["https://nextcloud.com/blog/german-state-nextcloud-build-digitally-sovereign-ai-for-public-sector"]
title = "German state & Nextcloud build digitally sovereign AI for public sector - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Nextcloud’s momentum continues strongly after last weekend’s announcement of the first private AI assistant embedded in its collaboration platform, with a first significant partnership announcement. As covered in the prominent German public sector-focused Tagesspiegel newsletter, Minister of Digitisation and Head of the State Chancellery Dirk Schrödter, and Nextcloud Founder and CEO Frank Karlitschek shook hands last Tuesday, on a collaboration to build digitally sovereign AI. As part of the AI strategy of the German state, the collaboration will create a generative language model for the state administration that is adapted to the specifics of administrative texts. As Margrethe Vestager aptly remarked, “With artificial intelligence, trust is a must, not a nice-to-have.” The evaluation of AI should focus not only on its technology but also on its societal and environmental benefits. The public sector across the EU faces questions around AI with regard to digital sovereignty and data leaks. The latest technologies enable AI’s to access troves of documents and then answer questions from them or generate content out of them. These functions would allow great advances in the speed of handling bureaucratic processes, but current solutions require large swaths of data to be handed over to third-party AI providers. This creates unacceptable risks for the digital sovereignty and security of government data. A digitally sovereign AI is needed. The German state of Schleswig-Holstein has made a strategic bet on Nextcloud’s on premise content collaboration platform as part of its focus on digital sovereignty. The latest developments by Nextcloud in the area of ethical AI align strongly with the state’s commitment to digitization of its services. As one of the most innovative states in Germany, it is aiming to dramatically accelerate its bureaucratic processes so that, for example, the approval process for wind turbines or other economic developments can move forward much faster."
