["https://nextcloud.com/blog/tu-berlin-halves-database-load-by-migrating-22k-users-to-nextcloud"]
title = "TU Berlin halves database load by migrating 22K users to Nextcloud - Nextcloud"
description = "Last week, we announced that 9 German education and research organizations moved from ownCloud to Nextcloud together with the TU Berlin. Today we’ve published a case study on our website which details the migration of the TU Berlin and the results achieved, including 50% lower base and 38% lower peak database loads. The end result […]"
full_description = '''We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize <img decoding="async" class="alignright size-full wp-image-2733" src="https://nextcloud.com/wp-content/uploads/2022/09/Logo_der_Technischen_Universitat_Berlin.svg" alt="" width="299" height="" /> Last week, we announced that 9 German education and research organizations moved from ownCloud to Nextcloud together with the TU Berlin. Today we’ve published a case study on our website which details the migration of the TU Berlin and the results achieved, including 50% lower base and 38% lower peak database loads. The end result was faster service to users at lower cost. <img decoding="async" class="size-large wp-image-2699" src="https://nextcloud.com/wp-content/uploads/2017/07/TUB-Hauptgebaeude070710-1024x680.jpg" alt="" width="1024" height="680" srcset="https://nextcloud.com/c/uploads/2017/07/TUB-Hauptgebaeude070710-1024x680.jpg 1024w, https://nextcloud.com/c/uploads/2017/07/TUB-Hauptgebaeude070710-300x199.jpg 300w, https://nextcloud.com/c/uploads/2017/07/TUB-Hauptgebaeude070710-768x510.jpg 768w, https://nextcloud.com/c/uploads/2017/07/TUB-Hauptgebaeude070710-1536x1020.jpg 1536w, https://nextcloud.com/c/uploads/2017/07/TUB-Hauptgebaeude070710.jpg 2000w" sizes="(max-width: 1024px) 100vw, 1024px" /> The Tu Berlin was one of the first universities to provide its own file sync and share solution, already evaluating ownCloud back in 2011. They provided cloud storage within the DFN cloud research program, servicing 16 member research and higher education institutions today. Their service has over 22.000 active users at the TU Berlin, with more at the other organizations and storage for the TU Berlin itself is well over 70 TB, with students allowed a maximum of 20 GB data and staff members up to 100 GB. The TU Berlin uses load balancers spreading user requests between 4 application servers which run a NGINX/MySQL/PHP 5.6 stack on CentOS 7.3. Data can be found on a GPFS-based storage and a Galera MySQL cluster while LDAP and Kerberos handle authentication and all of it runs in LXD containers managed with OpenStack.'''
author = "Jos Poortvliet"
