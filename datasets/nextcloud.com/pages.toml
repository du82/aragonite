["https://nextcloud.com/blog/first-open-source-ai-assistant"]
title = "Meet the Nextcloud AI Assistant - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize AI technology has become too useful and accessible to ignore, so more and more users make the choice to sacrifice tomorrow’s privacy for the sake of an excellent result today. At Nextcloud, we believe that everybody deserves privacy. We released the first open-source AI assistant that is hosted where you want it to be. It can get a multitude of tasks done inside your content collaboration platform without compromising your data: in content writing, mail communication, team chats, and more. Nextcloud AI Assistant is a capable and versatile tool that enhances your work throughout Nextcloud Hub to keep writing, communication, and other productivity tasks simple and low effort. Unlike other AI-powered content collaboration tools, Nextcloud doesn’t share your data with a third party technology provider to train the core AI model. This means that all data you work with, including documents, emails, chats and more, stays yours. We build the AI Assistant using a flexible, solution-independent approach which gives you a choice between multiple large language models (LLM) and services. It can be fully hosted within your instance, processing all requests in-house, or powered by an external service. This enables unmatched capabilities of language processing across various use scenarios with control of what is running behind your instruments and how. And importantly, you can have a 100% open-source assistant. Nextcloud AI Assistant features are available in the main Nextcloud Hub navigation to help you with quick text tasks, and in several apps including Text, Mail, and soon Talk, for app-specific actions. If you want to read about other AI tools available in Nextcloud, we welcome you to read the AI features overview or visit our documentation portal. Whatever you are working on, Nextcloud AI Assistant is only one click away. Should you need any help with a small task like generating a headline, paraphrasing a text, or translating a sentence, just click on a ✨ icon on the top right corner of the main navigation and give the Assistant its input."
