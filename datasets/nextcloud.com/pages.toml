["https://nextcloud.com/blog/nextcloud-for-die-zeit-microsoft"]
title = "Nextcloud for DIE ZEIT: Microsoft’s anti-competitive behavior, PR stunts and salami slicing - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize DIE ZEIT, a prominent German outlet, interviewed Nextcloud’s founder Frank Karlitschek for a story on Microsoft’s anti-competitive behaviour on the European office software market. The article addresses a history of Microsoft’s practices that grant the tech giant a possible illegal advantage over local competition, an ongoing litigation with the EU Commission, and possible legal solutions to restore a level playing field for the providers in Europe. Your can access the original text in German on ZEIT ONLINE website. Continue reading for a recap of the article and the key takeaways. Since the original article is in German language, all direct quotes used in this blog are translated. This is how the original title sounds like, if translated to English. Starting off with Frank’s monthly video calls with the EU commission, Leon Werner introduces Nextcloud’s struggle with the world’s wealthiest company: by employing a range of tactics and making use of its dominant position, Microsoft gains an unfair advantage over the competition and leaves no room for small providers like Nextcloud. Since 2017, Microsoft had bundled Teams app with its Office offering, driving providers of videoconferencing and chatting apps out and locking Office customers tighter to the Microsoft ecosystem. After an EU Commussion warning following complaints made not only by Nextcloud, but other companies like Slack, Microsoft made a move to sell Teams separately at a symbolic one or two euro fee, thus slowing down the antitrust case. If services such as cloud storage or Teams were included free of charge, other providers such as Nextcloud would be deprived of their livelihood. Daniel Zimmer, an antitrust law expert and former chairman of the Monopolies Commission, also claims that the network effect still allows Microsoft to stay dominant in the market. “These prices will not ensure that companies will look for a replacement for Teams,” says Dennis-Kenji Kipker, Professor of IT Security Law at the University of Bremen."
author = "Mikhail Korotaev"
