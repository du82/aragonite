title = "Nextcloud is the one and only Solution we are providing to our End-Customers: Florian Hausleitner - Nextcloud"
description = "Nextcloud is being used by organizations, big and small, that value privacy, security, and control over their data. Raiffeisen Informatik Center Steiermark GmbH is one such organization that’s using Nextcloud in certain capacities. We talked to Florian Hausleitner, Senior IT System Engineer of the center, to understand their IT infrastructure and the role Nextcloud plays […]"
full_description = '''We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize <img decoding="async" class="alignright wp-image-3190" src="https://nextcloud.com/wp-content/uploads/2017/10/florianhausleitner.png" alt="" width="168" height="243">Nextcloud is being used by organizations, big and small, that value privacy, security, and control over their data. Raiffeisen Informatik Center Steiermark GmbH is one such organization that’s using Nextcloud in certain capacities. We talked to Florian Hausleitner, Senior IT System Engineer of the center, to understand their IT infrastructure and the role Nextcloud plays at the center. Please tell us about Raiffeisen Informatik Center Steiermark and Raiffeisen Rechenzentrum? What does the center do? Raiffeisen Informatik Center Steiermark is 100% owned by Raiffeisen Landesbank Steiermark AG and privately funded. Raiffeisen Informatik Center Steiermark is a Full-Service IT-Provider in Financial Sector. We are providing the whole IT-Infrastructure as well as all financial applications for both Raiffeisen and Hypo Banks here in Styria/Austria. With over 4500 clients, more than 1500 Server-Systems, 1500 Network-Devices and two datacenters with 1400 m² housing space, Raiffeisen Informatik Center Steiermark is one of the largest IT companies in the Southern Region of Austria. I am a Senior IT-Systems Engineer here at Raiffeisen Informatik Center Steiermark. I am responsible for “Datacenter Service” which includes the complete stack from the datacenter buildings, power supply, air conditioning and the safety installations of the building. We want to deliver all of our services at a great level of availability, usability, and quality. For the datacenters themselves, it means I have to avoid downtime in any of our installations. I have to plan and provide capacities right and make sure that new systems are installed with no waiting time.'''
