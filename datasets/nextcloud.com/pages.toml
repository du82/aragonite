["https://nextcloud.com/migration"]
title = "Nextcloud - Migration guide"
description = "Using this migration guide, we at Nextcloud strives to make migration of customers from other platforms as seamless as possible."
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Nextcloud customers migrate from a wide range of other solutions. Premium customers receive free migration assistance from solutions like Dracoon or SharePoint. Limitations apply, ask your sales representative! As it is frequently requested, we provide a special ownCloud-to-Nextcloud migration service for free for all our customers. Moving between services is a capability Nextcloud itself offers with the Data Export/Import feature. Available since Nextcloud 24, this function allows users to export their data in an archive, giving a choice of what to upload and when. Nextcloud offers significant scalability, security and feature improvements over ownCloud (see a full comparison here) and our experienced support team has already helped several hundreds of customers with sometimes tens of thousands of users migrate successfully. Nextcloud is fully licensed under the AGPL, giving you all the benefits of open source and avoiding any risk of mixing a proprietary enterprise edition with open source components. Our customers appreciate expert help from a German, employee-owned company set up to provide a long term relationship between customers and business. Last but not least, Nextcloud has by far the strongest expertise in large scale deployments, as is evident in our work on Global Scale. We can directly help you migrate to Nextcloud Enterprise or you can look for an offer from one of our partners. We offer enterprises a free migration package including free migration support but also a free subscription for the duration of the rest of the ownCloud subscription. Our Premium subscription offers support for migration from a multitude of other platforms. In case of custom enterprise migrations we advise you to contact our sales team. Home users are invited to share their questions and experiences for support on our forums."
