["https://nextcloud.com/blog/nextcloud-wins-the-acteurs-du-libre-european-award-2023"]
title = "Nextcloud wins the Acteurs du Libre European Award 2023 - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Today, we are sharing some exciting news, coming just a few weeks after Frank won the prestigious European Software Freedom award in Austria. Nominated for the European Award of the Acteurs du Libre contest, Nextcloud wins this year’s prize! We are thankful to our community, our talented team, and the great visionaries behind the project for achieving this important win. Part of the Open Source Experience event, the Acteurs du Libre contest awards Free Software companies, entrepreneurs, projects and associations that make notable contributions to open source and free software. Each year, six awards are given to the nominees, each highlighting to the contribution in a particular area of FOSS development, management or implementation: the Committed Public Service Award, the European Award in collaboration with APELL, the Business Development Award, the Best Open Source Strategy Award, the Open and Edthical Digital Award, and the Jury’s Special Award. This year’s ceremony welcomed Nextcloud founder Frank Karlitschek on stage to receive the European Award given in collaboration with APELL. This prize aims to reward open source organizations headquartered in Europe, but outside of France, that has successfully led the commercial development of an open source project. The evaluation of the proposals and the award ceremony is organized in collaboration with APELL (European Free Software Professional Association). This is truly a remarkable milestone for our hardworking team and the community surrounding Nextcloud and engaging in our project. This achievement is a testament to the dedication and our collective brilliance. Tireless efforts and commitment to excellence shown by the community and the talented Nextcloud team have lifted us us to new heights. Deepest thanks to everyone that has stood by us throughout this journey."
