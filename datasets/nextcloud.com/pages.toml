full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Nextcloud has been recognized with the World Summit Award Germany that selects and promotes local digital innovation improving society, aiming to contribute to the United Nations' agenda of sustainable development goals. Nextcloud is nominated for the CloudComputing-Insider IT-Awards in 2024, making it our 8th nomination. With your help, we can once again make it to the winners' list! Read on to learn more about the award and how to vote. Read about a remarkable prize achieved thanks to Nextcloud community, our talented team, and the great visionaries behind the project. Nextcloud founder and CEO Frank Karlitschek earns the honorary SFS Award at the 20th annual SFSCON taking place in South Tyrol, Italy. Nextcloud nominated for CloudComputing-Insider Award 2023! We appreciate your support and let’s make it together again to win first place! Nextcloud participated in the CloudComputing-Insider Awards 2022 and won again the first prize in Germany! IT Awards got votes from over 70 000 readers this year and Nextcloud came out on top, left behind Dropbox, Microsoft and others, and was chosen by the largest community... One of the best parts about a hackathon is people coming together from around the world in the name of code. The team that created the new organizational chart is a prime example of that. Comprised of team lead Shieva Saavedra from the Phillipines, Manuel... This post was adapted by the European Commissions blog here. From April 25th to May 10th, Nextcloud and the European Commission’s DIGIT team joined forces in creating the NextGov Hackathon. There were three main goals of our hackathon: One, to add new features and improvements... Nextcloud offers a modern, on premise content collaboration platform with real-time document editing, video chat & groupware on mobile, desktop and web."
