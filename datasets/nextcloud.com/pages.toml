title = "Nextcloud Hub 10 – your unified, modular digital workspace - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize More and more of our digital lives are controlled by a handful of big tech firms and their CEOs – but there is a better way. A way that puts control back in your hands, fosters collaboration, and protects your digital freedom. And today, that is more important than ever. With Nextcloud Hub 10, we double down on the vision that started it all: an integrated yet modular digital workspace, built for freedom, security, and teamwork. Instead of juggling multiple disconnected apps, Nextcloud Hub provides a unified platform – easier to manage, scale, and secure – while still offering deep customization. Choose from our core applications, extend them with 400+ integration-ready apps, and bring in the services you need. Because the future isn’t about walled gardens – it’s about open collaboration. Whether you’re running Nextcloud at home, in a business, government, or local sports club, you stay in control. Our federation features connect Nextcloud servers worldwide, bringing millions together in a truly decentralized network. This release also brings practical improvements: Performance improvements across all our products, thousands of tweaks for improved UX and stability, your new personal assistant, workflow automation for the public sector, a sleeker, more compact design and much more. Nextcloud is more than technology – it’s a community. We’d love to hear your thoughts and feedback and hope you’ll enjoy this brand-new Nextcloud Hub! Nextcloud Hub is here, built on the foundation of collective innovation and made possible by our incredible community. This release brings numerous performance and stability improvements, inspired by your contributions and feedback. Thank you to everyone involved in coding, testing, sharing, providing feedback, and supporting Nextcloud Hub. Your dedication makes this progress possible, and we celebrate this new release together with you!"
