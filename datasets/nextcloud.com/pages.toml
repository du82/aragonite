title = "Contribute to Nextcloud server or apps"
description = "Nextcloud is an open source content collaboration project and we invite you to contribute and help improve Nextcloud server or apps"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Nextcloud is an open source project and an open company. That means it is yours to make a difference! Do you want to get a certain improvement in Nextcloud? Did you find a problem? Do you want to help translate, promote or document Nextcloud? We invite you to join our development efforts on GitHub and the conversations on our forums. Interact with us on our blogs and social media channels, too! Learn about setting up a development environment or read our security guidelines, coding style and more! Help answer questions users and developers have about Nextcloud! Please be considerate of our code of conduct. We want to provide a positive and enjoyable environment for everybody. Testing upcoming Nextcloud Server releases is the best way of making sure the new release can do what you need it to do. And of course, only if you report a problem to us we know about it and can fix it! If you have a bug to report, see the issue submission page Nextcloud occasionally hires contributors as interns. It is best to ask the employees you work with about this, or send an inquiry to our jobs email address. To help equalize opportunities for tech jobs for people in underrepresented groups in tech, we have our Include program. You can submit a request for mentoring there, which can turn into an internship as well. Learn more about Include here. Also, we are hiring. We look especially for people who want to turn their passion into their job! When possible, we hire people from our active community base or from the wider open source community. Just telling other people about Nextcloud is already immensely helpful! Use social media, real life, or write a review at the many websites that review software. Some links below! You can also represent us at events, giving a talk for example. Learn more about Nextcloud events here."
