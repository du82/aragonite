["https://nextcloud.com/de/about"]
title = "About - Nextcloud"
description = "Wir sind ein nachhaltiges Unternehmen und setzen auf langfristige Stabilität, nicht auf kurzfristige Vertriebsziele. Also kein Wachstum um jeden Preis: Schutz der Menschen, der Gesellschaft und der Umwelt."
full_description = "Wir sind ein nachhaltiges Unternehmen und setzen auf langfristige Stabilität, nicht auf kurzfristige Vertriebsziele. Also kein Wachstum um jeden Preis: Schutz der Menschen, der Gesellschaft und der Umwelt. Wir glauben, dass die Privatsphäre ein grundlegendes Menschenrecht ist. Jeder hat das Recht auf eine sichere Kommunikation. Das ist die wichtigste Motivation für all unsere Produkte. Wir respektieren die Zeit und die geistige Belastbarkeit der Benutzer. Deshalb ist Nextcloud einfach benutzerfreundlich. Wir haben Vertrauen in einander und in unsere gemeinsamen Ziele, die die Grundlage für unsere Entscheidungen bilden. Dies ermöglicht flexible Remote-Arbeit und eine weitgehend dezentrale, kollaborative Entscheidungsfindung. Alles, was wir tun, ist zu 100 % Open Source. Unser Ansatz ist weder Open Core, noch basiert er auf proprietären Erweiterungen. Wir verwenden und unterstützen offene Standards so weit wie möglich. Wir begrenzen unsere Kunden nicht auf proprietäre Formate. Sie können alles importieren und exportieren. Wir entwickeln dezentralisierte Produkte als Alternative zu zentralisierten Plattformen. Die Benutzer können wählen, was sie wollen und wo sie es wollen. Eine offene Zusammenarbeit mit einer breiten Community führt zu besseren Ergebnissen. Wir vertrauen unserer Community und befähigen sie, die Verantwortung für ihre Beiträge zu übernehmen und im Rahmen der praktischen Möglichkeiten und rechtlichen Bestimmungen so viel Zugang und Kontrolle wie möglich darüber zu haben. Vielfältige Teams und Communities machen uns besser und innovativer. Wir unterstützen ausgegrenzte Menschen dabei, sich in Open Source einzubringen und sich zu entfalten. Barrierefreiheit ist ein grundlegendes Menschenrecht, und Technologie sollte für jeden zugänglich sein. Wir speichern einige Cookies, um Besucher zu zählen und die Nutzung der Website zu erleichtern. Diese verlassen unseren Server nicht und dienen nicht der Verfolgung Ihrer online-Aktivitäten. Weitere Informationen hierzu finden Sie in unserer Datenschutzrichtlinie. Anpassen"
