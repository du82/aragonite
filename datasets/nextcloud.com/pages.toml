["https://nextcloud.com/blog/nextcloud-recognized-with-world-summit-award-germany"]
title = "Nextcloud recognized with World Summit Award Germany - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Nextcloud has been recognized with the World Summit Award Germany in the Government & Citizen Engagement category. WSA selects and promotes local digital innovation improving society, aiming to contribute to the United Nations’ agenda of sustainable development goals. In addition, Nextcloud is shortlisted for the World Summit Awards on a global level. The winners will be announced in January 2025. The digital collaboration platform has been recognized for excelling in data sovereignty and giving customers and users control over their data. Nextcloud builds an open source platform for people to store their files, chat and videoconference, manage calendars, emails and more, that is not run by a single entity. Using a web interface and mobile apps, users don’t have to hand over their data to anybody else. Users, companies and governments can use Nextcloud software to build their own clouds, in a very easy way. And – hundreds of thousands have. Data is concentrated in the hands of a very small number of companies. This is not good for society – especially with the rise of AI. Privacy is the foundation of democracy and society does not function well if all communication and collaboration is mediated by a few democratically unaccountable entities. Nextcloud is deeply rooted in the open source community and has become the most popular self-hosted alternative to the collaboration platforms of big tech companies. There are an estimated 500,000 servers on the internet running Nextcloud, some of these with millions of users. We do not track users but estimate to have between 25 and 50 million users in total. For the business side, besides companies and other organzations, more than 600 EU institutions, federal and state ministries, as well as city and local governments globally rely on Nextcloud, including Germany, France, the Netherlands, Serbia, Canada, Australia, Brazil and the USA. The most popular self-hosted collaboration solution for 2 million users in the public sector and tens of millions of users overall around the globe."
author = "Mikhail Korotaev"
