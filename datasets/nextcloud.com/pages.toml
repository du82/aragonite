full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize If you are using Nextcloud Hub 8 or 9, we strongly recommend you to update to version 29.0.12 or 30.0.6 respectively. Maintenance updates include important bug fixes, stability and security upgrades. It is a quick and safe process, as always! The updates include a number of important bug fixes and performance optimization, as well as other improvements in all supported Nextcloud Hub versions. You can find the full changelog on our website. Nextcloud Hub 10 will be launched on February 25th at 2 PM (CET) in an online event. Register now to join the live presentation and be among the first to experience it! Nextcloud’s minor releases primarily focus on addressing security vulnerabilities and functionality bugs, avoiding major system overhauls that could jeopardize user data. Keeping your server up to date is vital, and our approach to testing and validation ensures that upgrading to minor releases is generally smooth and reliable. For mission-critical Nextcloud systems in enterprise settings, consider switching to Nextcloud Enterprise. The tier provides you with ultimate deployment confidence: direct access to the Nextcloud engineering team, full assistance throughout deployment and integration, and peace of mind for system administrators. If you’re responsible for maintaining Nextcloud in your setting, this option may be the ideal solution for you. Welcome Nextcloud Hub 10. Our latest release comes with reinforced performance in every app, deeper integration across the platform, and dozens of new features that will make your day easier. In the Nextcloud 2024 wrap-up, we want to take a moment to celebrate this year's achievements. Join us as we continue to reimagine what’s possible - shaping a world where open source, privacy and connection come together and drive progress for the greater good."
