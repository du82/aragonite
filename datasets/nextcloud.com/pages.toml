full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Welcome Nextcloud Hub 10. Our latest release comes with reinforced performance in every app, deeper integration across the platform, and dozens of new features that will make your day easier. Europe faces significant challenges in staying competitive in a rapidly evolving digital world dominated by the US and China. The Draghi report sheds light on the EU’s dependence on foreign technology, the need for innovation, and actionable strategies for building a resilient digital economy. In... Donald Trump’s return to the White House has reignited debates about the balance of power in the tech industry. With legislations like the CLOUD Act and ongoing discussions around data sovereignty, open source faces significant challenges. These dynamics highlight the difficulty of navigating a world... Maintenance updates 29.0.11 and 30.0.5 for Nextcloud Hub 8 and 9 respectively are here! Read an update summary and access full changelog on the website. In the Nextcloud 2024 wrap-up, we want to take a moment to celebrate this year's achievements. Join us as we continue to reimagine what’s possible - shaping a world where open source, privacy and connection come together and drive progress for the greater good. By 2025 the most popular Microsoft Office products fall out of support. We believe there's a need for a real Microsoft 365 alternative that protects your privacy. Maintenance updates 28.0.12 and 30.0.2 for Nextcloud Hub 7 and 9 respectively are here! Read an update summary and access full changelog on the website. Organisations, small and large, need a way to ensure the resiliency and digital sovereignty of their operations – an open-source, privacy-respecting alternative to Teams. And today, we present that solution - Nextcloud Talk. In this article, we find out how open-source AI gets you your privacy back and explore examples of reliable AI models that you can use in your ecosystem."
