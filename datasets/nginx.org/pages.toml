title = "Changes"
full_description = "ChangesChanges with njs 0.8.9 Release Date: 14 January 2025 nginx modules: Bugfix: removed extra VM creation per server. Previously, when js_import was declared in http or stream blocks, an extra copy of the VM instance was created for each server block. This was not needed and consumed a lot of memory for configurations with many server blocks. This issue was introduced in 0.8.6 and was partially fixed for location blocks only in 0.8.7. Core: Feature: implemented fs for the QuickJS engine. Changes with njs 0.8.8 Release Date: 10 December 2024 nginx modules: Feature: implemented shared dictionary for the QuickJS engine. Improvement: js_preload_object is refactored. Bugfix: fixed limit rated output. Bugfix: optimized use of SSL contexts for the js_fetch_trusted_certificate directive. Core: Feature: implemented process object for the QuickJS engine. Feature: implemented the process.kill() method. Bugfix: fixed XML tests with libxml2 2.13 and later. Bugfix: fixed promise resolving when Promise is inherited. Bugfix: fixed absolute scope in cloned VMs. Changes with njs 0.8.7 Release Date: 22 October 2024 nginx modules: Bugfix: eliminated unnecessary VM creation. Previously, njs consumed memory proportionally to the number of nginx locations. The issue was introduced in 0.8.6. Improvement: added strict syntax validation for js_body_filter. Improvement: improved error messages for module loading failures. Core: Feature: implemented fs.readlinkSync(). Improvement: implemented lazy stack symbolization. Bugfix: fixed heap-buffer-overflow in Buffer.prototype.indexOf(). The issue was introduced in 0.8.6. Bugfix: fixed Buffer.prototype.lastIndexOf() when `from` is provided. Changes with njs 0.8.6 Release Date: 02 October 2024 nginx modules: Feature: introduced the QuickJS engine. Feature: added optional nocache flag for the js_set directive for http and stream. Thanks to Thomas P. Feature: exposed capture group variables in the HTTP module. Thanks to Thomas P. Core: Feature: added Buffer module for the QuickJS engine. Bugfix: fixed handling of empty labelled statement in a function. Bugfix: fixed Function constructor handling when called without arguments. Bugfix: fixed Buffer.prototype.writeInt8() and friends. Bugfix: fixed Buffer.prototype.writeFloat() and friends. Bugfix: fixed Buffer.prototype.lastIndexOf(). Bugfix: fixed Buffer.prototype.write(). Bugfix: fixed maybe-uninitialized warnings in error creation. Bugfix: fixed ctx.codepoint initialization in UTF-8 decoding. Bugfix: fixed length initialization in Array.prototype.pop(). Bugfix: fixed handling of encode arg in fs.readdir() and fs.realpath(). Changes with njs 0.8.5 Release Date: 25 June 2024 nginx modules: Change: bytes invalid in UTF-8 encoding are converted into the replacement character in: r.variables.var, r.requestText, r.responseText, s.variables.var, the data argument of the s.on() callback with upload or download event types, the data argument of the js_body_filter directive. When working with binary data, use: r.rawVariables.var, r.requestBuffer, r.responseBuffer, s.rawVariables.var, the upstream or downstream event type for s.on(), buffer_type=buffer for js_body_filter. Feature: added timeout argument for add(), set(), and incr() methods of a shared dictionary. Bugfix: fixed checking for duplicate js_set variables. Bugfix: fixed request Host header when the port is non-standard. Bugfix: fixed handling of a zero-length request body in ngx.fetch() and r.subrequest(). Bugfix: fixed heap-buffer-overflow in Headers.get(). Bugfix: fixed r.subrequest() error handling. Core: Feature: added zlib module for QuickJS engine. Bugfix: fixed zlib.inflate(). Bugfix: fixed String.prototype.replaceAll() with a zero-length argument. Bugfix: fixed retval handling after an exception in Array.prototype.toSpliced(), Array.prototype.toReversed(), Array.prototype.toSorted(). Bugfix: fixed RegExp.prototype[@@replace]() with replacements containing $', $` and strings with Unicode characters. Bugfix: fixed a one-byte overread in decodeURI() and decodeURIComponent(). Bugfix: fixed tracking of argument scope. Bugfix: fixed integer overflow in Date.parse(). Changes with njs 0.8.4 Release Date: 16 April 2024 nginx modules: Feature: the Server header for outgoing header can be set. Improvement: validating URI and args arguments in r.subrequest(). Improvement: checking for duplicate js_set variables. Bugfix: fixed clear() method of a shared dictionary without a timeout introduced in 0.8.3. Bugfix: fixed r.send() method of a shared dictionary without a timeout with Buffer argument. Core: Feature: added QuickJS engine support in CLI. Bugfix: fixed atob() with non-padded base64 strings. Changes with njs 0.8.3 Release Date: 07 February 2024 nginx modules: Bugfix: fixed Headers.set(). Bugfix: fixed js_set with Buffer values. Bugfix: fixed clear() method of a shared dictionary when a timeout is not specified. Bugfix: fixed stub_status statistics when js_periodic is enabled. Core: Bugfix: fixed building with libxml2 2.12 and later. Bugfix: fixed Date constructor for overflows and with NaN values. Bugfix: fixed underflow in querystring.parse(). Bugfix: fixed potential buffer overread in String.prototype.match(). Bugfix: fixed parsing of for-in loops. Bugfix: fixed parsing of hexadecimal, octal, and binary literals with no digits. Changes with njs 0.8.2 Release Date: 24 October 2023 nginx modules: Feature: introduced console object. The following methods were introduced: error(), info(), log(), time(), timeEnd(), warn(). Bugfix: fixed HEAD response handling with large Content-Length in Fetch API. Bugfix: fixed items() method for a shared dictionary. Bugfix: fixed delete() method for a shared dictionary. Core: Feature: extended fs module. Added fs.existsSync(). Bugfix: fixed xml module. Broken XML exception handling in xml.parse() method was fixed. Bugfix: fixed Regexp.prototype.exec() with global regexp and Unicode input. Changes with njs 0.8.1 Release Date: 12 September 2023 nginx modules: Feature: introduced the js_periodic directive for http and stream that allows specifying a JS handler to run at regular intervals. Feature: implemented items() method of a shared dictionary. The method returns all the non-expired key-value pairs. Bugfix: fixed size() and keys() methods of a shared dictionary. Bugfix: fixed erroneous exception in r.internalRedirect() introduced in 0.8.0. Core: Bugfix: fixed incorrect order of keys in Object.getOwnPropertyNames(). Changes with njs 0.8.0 Release Date: 06 July 2023 nginx modules: Change: removed special treatment of forbidden headers in Fetch API introduced in 0.7.10. Change: removed deprecated since 0.5.0 r.requestBody and r.responseBody in http module. Change: throwing an exception in r.internalRedirect() while filtering in http module. Feature: introduced more global nginx properties: ngx.build, ngx.conf_file_path, ngx.error_log_path, ngx.prefix, ngx.version, ngx.version_number, and ngx.worker_id. Feature: introduced the js_shared_dict_zone directive for http and stream that allows declaring a dictionary shared between worker processes. Feature: introduced global nginx.shared methods and properties for working with shared dictionaries. Improvement: added compile-time options to disable njs modules. For example, to disable libxslt-related code: NJS_LIBXSLT=NO ./configure .. --add-module=/path/to/njs/module Bugfix: fixed r.status setter when filtering in http module. Bugfix: fixed setting of Location header in http module. Core: Change: native methods are provided with retval argument. This change breaks compatibility with C extension for njs requiring the modification of the code. Change: non-compliant deprecated String methods were removed. The following methods were removed: String.bytesFrom(), String.prototype.fromBytes(), String.prototype.fromUTF8(), String.prototype.toBytes(), String.prototype.toUTF8(), String.prototype.toString(encoding). Change: removed support for building with GNU readline. Feature: added ES13-compliant Array methods: Array.from(), Array.prototype.toSorted(), Array.prototype.toSpliced(), Array.prototype.toReversed(). Feature: added ES13-compliant TypedArray methods: %TypedArray%.prototype.toSorted(), %TypedArray%.prototype.toSpliced(), %TypedArray%.prototype.toReversed(). Feature: added CryptoKey properties in WebCrypto API. The following properties were added: algorithm, extractable, type, usages. Bugfix: fixed retval of сrypto.getRandomValues(). Bugfix: fixed evaluation of computed property names with function expressions. Bugfix: fixed implicit name for a function expression declared in arrays. Bugfix: fixed parsing of for-in loops. Bugfix: fixed Date.parse() with ISO-8601 format and UTC time offset. Changes with njs 0.7.12 Release Date: 10 April 2023 nginx modules: Bugfix: fixed Headers() constructor in Fetch API. Core: Feature: added Hash.copy() method in crypto module. Feature: added zlib module. Improvement: added support for export {name as default} statement. Bugfix: fixed Number constructor according to the spec. Changes with njs 0.7.11 Release Date: 09 March 2023 nginx modules: Bugfix: added missed linking with libxml2 for the dynamic module. The bug was introduced in 0.7.10. Core: Feature: added XMLNode API to modify XML documents. Change: removed XML_PARSE_DTDVALID during parsing of an XML document due to security implications. The issue was introduced in 0.7.10. When XML_PARSE_DTDVALID is enabled, libxml2 parses and executes external entities present inside an XML document. Bugfix: fixed the detection of await in arguments. Bugfix: fixed Error() instance dumping when “name” prop is not primitive. Bugfix: fixed array instance with a getter property dumping. Bugfix: fixed njs_object_property() with NJS_WHITEOUT properties. Bugfix: fixed func instance dumping with “name” as getter. Bugfix: fixed attaching of a stack to an error object. Bugfix: fixed String.prototype.replace() with replacement containing “$'”, “$`”. Changes with njs 0.7.10 Release Date: 07 February 2023 nginx modules: Feature: added Request, Response, and Headers ctors in Fetch API. Bugfix: fixed nginx logger callback for calls in the master process. Core: Feature: added signal support in CLI. Feature: added xml module for working with XML documents. Feature: extended support for symmetric and asymmetric keys in WebCrypto. Most notably JWK format for importKey() was added. Feature: extended support for symmetric and asymmetric keys in WebCrypto API. Most notably JWK format for importKey() was added. generateKey() and exportKey() were also implemented. Feature: added String.prototype.replaceAll(). Bugfix: fixed for(expr1; conditional syntax error handling. Bugfix: Object.values() and Object.entries() with external objects. Bugfix: fixed RegExp.prototype[@@replace](). Changes with njs 0.7.9 Release Date: 17 November 2022 nginx modules: Bugfix: fixed Fetch Response prototype reinitialization. When at least one js_import directive was declared in both HTTP and Stream, ngx.fetch() returned inapproriate response in Stream. The bug was introduced in 0.7.7. Core: Bugfix: fixed String.prototype.replace(re) if re.exec() returns non-flat array. Bugfix: fixed Array.prototype.fill() when start object changes this. Bugfix: fixed description for fs.mkdir() and fs.rmdir() methods. Bugfix: fixed %TypedArray%.prototype.set(s) when s element changes this. Bugfix: fixed Array.prototype.splice(s,d) when d resizes this during eval. Bugfix: fixed for-in loop with left and right hand side expressions. Changes with njs 0.7.8 Release Date: 25 October 2022 nginx modules: Feature: added js_preload_object directive. Feature: added ngx.conf_prefix property. Feature: added s.sendUpstream() and s.sendDownstream() in stream module. Feature: added support for HEAD method in Fetch API. Improvement: improved async callback support for s.send() in stream module. Core: Feature: added name instance property for a function object. Feature: added njs.memoryStats object. Bugfix: fixed String.prototype.trimEnd() with unicode string. Bugfix: fixed Object.freeze() with fast arrays. Bugfix: fixed Object.defineProperty() with fast arrays. Bugfix: fixed async token as a property name of an object. Bugfix: fixed property set instruction when key modifies base binding. Bugfix: fixed complex assignments. Bugfix: fixed handling of unhandled promise rejection. Bugfix: fixed process.env when duplicate environ variables are present. Bugfix: fixed double declaration detection in modules. Bugfix: fixed bound function calls according to the spec. Bugfix: fixed break label for if statement. Bugfix: fixed labeled empty statements. Changes with njs 0.7.7 Release Date: 30 August 2022 nginx modules: Feature: the number of nginx configuration contexts where js directives can be specified is extended. HTTP: the js_import, js_path, js_set, and js_var directives are allowed in server and location contexts. The js_content, js_body_filter and js_header_filter are allowed in if context. Stream: the js_import, js_path, js_set, and js_var are allowed in server context. Feature: added r.internal property. Bugfix: fixed reading response body in Fetch API. Bugfix: fixed js_fetch_timeout in stream. Bugfix: fixed socket leak with 0 fetch timeout. Core: Feature: extended fs module. Added fs.openSync(), fs.promises.open(), fs.fstatSync(), fs.readSync(), fs.writeSync(). The following properties of FileHandle are implemented: fd, read(), stat(), write(), close(). Bugfix: fixed parseInt(), parseFloat(), Symbol.for() with no arguments. Changes with njs 0.7.6 Release Date: 19 July 2022 nginx modules: Feature: improved r.args{} object. Added support for multiple arguments with the same key. Added case sensitivity for keys. Keys and values are percent-decoded now. Bugfix: fixed r.headersOut{} setter for special headers. Core: Feature: added Symbol.for() and Symbol.keyfor(). Feature: added atob() and btoa() from WHATWG spec. Bugfix: fixed large non-decimal literals. Bugfix: fixed Unicode argument trimming in parseInt(). Bugfix: fixed break instruction in try-catch block. Bugfix: fixed async function declaration in CLI. Changes with njs 0.7.5 Release Date: 21 June 2022 nginx modules: Change: adapting to changes in nginx header structures. Bugfix: fixed r.headersOut{} special getters when value is absent. Change: returning undefined value instead of an empty string for Content-Type when the header is absent. Core: Bugfix: fixed catching of the exception thrown from an awaited function. Bugfix: fixed function value initialization. Bugfix: fixed interpreter when await fails. Bugfix: fixed typed-array constructor when source array is changed while iterating. Bugfix:fixed String.prototype.replace() with byte strings. Bugfix: fixed template literal from producing byte-strings. Bugfix: fixed array iterator with sparse arrays. Bugfix: fixed memory free while converting a flat array to a slow array. Bugfix: properly handling NJS_DECLINE in promise nativ"
