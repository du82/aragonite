full_description = '''nginx nginx ("engine x") is an HTTP web server, reverse proxy, content cache, load balancer, TCP/UDP proxy server, and mail proxy server. Originally written by Igor Sysoev and distributed under the 2-clause BSD License. Enterprise distributions, commercial support and training are available from F5, Inc. Docs • Code • Install • Beginner's Guide Latest News 2025-02-05 nginx-1.26.3 stable version has been released, with a fix for the SSL session reuse vulnerability (CVE-2025-23419). 2025-02-05 nginx-1.27.4 mainline version has been released, featuring optimized resource usage for complex SSL configurations, and with a fix for the SSL session reuse vulnerability (CVE-2025-23419). 2025-01-14 njs-0.8.9 version has been released, featuring fs module for the QuickJS engine. 2024-12-10 njs-0.8.8 version has been released, featuring shared dictionary for the QuickJS engine. Older news Other NGINX Projects njsNGINX JavaScript (njs) extends nginx functionality with an ECMAScript-compatible interpreter for HTTP and Stream modules.Docs • Code UnitNGINX Unit is a lightweight application runtime that simplifies the application stack for running web apps and APIs.Docs • Code IngressNGINX Ingress Controller connects Kubernetes apps and services with rock solid request handling, auth, self-service CRDs, and easy debugging.Docs • Code Gateway FabricNGINX Gateway Fabric provides L4 and L7 routing capabilities in Kubernetes, implementing the Gateway API using NGINX as the data plane.Docs • Code'''
