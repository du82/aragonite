["https://nhlbi.nih.gov/health/high-blood-pressure"]
title = "High Blood Pressure - What Is High Blood Pressure? | NHLBI, NIH"
description = "Learn about signs and symptoms, causes, risk factors, and treatments for high blood pressure, a common disease in which blood flows through blood vessels, or arteries, at higher than normal pressures."
full_description = "High Blood Pressure Home < Back To Health TopicsHigh Blood Pressure 0 High Blood Pressure MENU Home < Back To Health TopicsHigh Blood Pressure What Is High Blood Pressure? Symptoms Diagnosis Causes and Risk Factors Treatment Living With High Blood Pressure Pregnancy and High Blood Pressure MORE INFORMATION Participate in a Study Fact Sheets and Handouts Research High Blood Pressure High Blood Pressure What Is High Blood Pressure? Language switcherEnglishEspañol High blood pressure, or hypertension, is a common condition that occurs when your blood pressure—the force of the blood on the walls of your arteries—is often too high. Medical Animation Copyright © 2024 Nucleus Medical Media, All rights reserved. Half of all American adults have high blood pressure, also known as hypertension. Many don’t even know it. High blood pressure develops when blood flows through your arteries at higher-than-normal pressures.Blood pressures are written as two numbers separated by a slash like this: 120/80 mm Hg. You can say this as “120 over 80 millimeters of mercury” or just as “120 over 80.” The first number is your systolic pressure — that’s the force of the blood flow when blood is pumped out of the heart. The second number is your diastolic pressure, which is measured between heartbeats when the heart is filling with blood.Your blood pressure changes throughout the day based on your activities. A healthy systolic blood pressure is less than 120 mm Hg. A healthy diastolic pressure is less than 80 mm Hg. Your blood pressure is high when you have consistent systolic readings of 130 mm Hg or higher, or diastolic readings of 80 mm Hg or higher.Blood pressure levelsBlood Pressure CategorySystolic and Diastolic Pressure (mm Hg)NormalLess than 120 systolic pressure AND Less than 80 diastolic pressureElevated120 to 129 systolic pressure AND Less than 80 diastolic pressureHigh Blood Pressure Stage 1130 to 139 systolic pressure OR 80 to 89 diastolic pressureHigh Blood Pressure Stage 2140 or higher systolic pressure OR 90 or higher diastolic pressureHypertensive Crisis Higher than 180 systolic pressure OR Higher than 120 diastolic pressureContact your provider immediately. Symptoms from high blood pressure don’t usually occur until it causes serious health problems. About 1 in 3 U.S. adults with high blood pressure aren’t even aware they have it and are not being treated to control their blood pressure. That’s why it is important to have your blood pressure checked at least once a year. Regular monitoring using home blood pressure is also recommended.To control or lower high blood pressure, your healthcare provider may recommend that you adopt a heart-healthy lifestyle that includes:Choosing a heart-healthy dietary pattern and foods such as those in the DASH eating plan, the Dietary Guidelines for Americans, or the Mediterranean eating patternBeing physically active and reducing sedentary behaviorLosing weight for people with overweight or obesityQuitting smokingReducing stressGetting enough good-quality sleepYour healthcare provider may also recommend medicines to help control your blood pressure.Controlling your blood pressure can help prevent or delay serious health problems such as chronic kidney disease, heart attack, heart failure, stroke, and possibly vascular dementia.Find research studies and get resources on high blood pressure. Book traversal links for What Is High Blood Pressure? Next Symptoms Last updated on April 25, 2024"
