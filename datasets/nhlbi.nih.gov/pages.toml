title = "Find NHLBI Clinical Trials and Studies | NHLBI, NIH"
description = "Are you a healthy adult? In this clinical trial, researchers are trying to improve the quality of heart CT scans by using new methods to create the images. Researchers will take normal CT images of the heart and compare those images to super high-resolution images made with a super-computer. Healthy adults aged 18 years or older may be able to participate. The study is taking place at the NIH Clinical Center in Bethesda, Maryland."
full_description = "Clinical Trials and Studies Español The NHLBI leads or sponsors studies for patients who have heart, lung, blood, or sleep related diseases or disorders. Find studies for diseases and conditions and see if you or a loved one is eligible. For funding information, please visit funding opportunities. How Clinical Trials Work Who Can Participate Benefits, Risks & Safety Measures Find NHLBI Clinical Trials and Studies Search selected NHLBI-supported clinical trials and observational studies by condition, location, or age group. You can also view the complete list of NHLBI-funded studies at ClinicalTrials.gov. Filter by: Close Disease or Condition (-) CLEAR Acute Respiratory Distress Syndrome Alpha-1 Antitrypsin Deficiency Anemia Angina (Chest Pain) Aortic Aneurysm Aplastic Anemia Arrhythmias Asthma Atherosclerosis Atrial Fibrillation Bleeding Disorders Blood Cholesterol Blood Clotting Disorders Bronchiectasis Bronchitis Cardiac Arrest Cardiac Catheterization Cardiomyopathy Circadian Rhythm Disorders Conduction Disorders Congenital Heart Defects COPD Coronary Artery Bypass Grafting Coronary Heart Disease Cystic Fibrosis Deep Vein Thrombosis (DVT) Defibrillators Heart-Healthy Living Heart Attack Heart Failure Heart Inflammation Heart Surgery Heart Tests Heart Transplant Heart Treatments Heart Valve Diseases Hemolytic Anemia High Blood Pressure High Blood Triglycerides How the Heart Works How the Lungs Work Insomnia Interstitial Lung Diseases LAM Long QT Syndrome Low Blood Pressure Lung Disease Treatments Marfan Syndrome Metabolic Syndrome Overweight and Obesity Peripheral Artery Disease Physical Activity and Your Heart Platelet Disorders Pleural Disorders Pneumonia Polycythemia Vera Primary Ciliary Dyskinesia Pulmonary Fibrosis Pulmonary Hypertension Pulmonary Rehabilitation Respiratory Failure Sarcoidosis Sickle Cell Disease Sleep Apnea Sleep Deprivation and Deficiency Sleep Disorder Treatments Smoking and Your Heart Stroke Tests for Lung Disease Thalassemia The Lungs Transcatheter Aortic Valve Replacement (TAVR) Treatments for Blood Disorders Vasculitis Venous Thromboembolism Ventilator/Ventilator Support Women and Heart Disease Location (-) CLEAR Alabama Arizona Arkansas California Colorado Connecticut Delaware Florida Georgia Hawaii Illinois Indiana Iowa Kansas Kentucky Louisiana Maine Maryland Massachusetts Michigan Minnesota Mississippi Missouri Nebraska Nevada New Hampshire New Jersey New Mexico New York North Carolina Ohio Oklahoma Oregon Pennsylvania Rhode Island South Carolina South Dakota Tennessee Texas Utah Vermont Virginia Washington West Virginia Wisconsin Age Group (-) CLEAR Child (Birth - 17) Adult (18-64) Senior (65+) Recruitment Status (-) CLEAR Recruiting Not yet recruiting + View More Filters FILTER BY KEYWORD Clear All Showing 1 - 10 out of 344 results Controls and Healthy Vasculature Initiative Recruiting Maryland Are you a healthy adult? In this clinical trial, researchers are trying to improve the quality of heart CT scans by using new methods to create the images. Researchers will take normal CT images of the heart and compare those images to super high-resolution images made with a super-computer. Healthy adults aged 18 years or older may be able to participate. The study is taking place at the NIH Clinical Center in Bethesda, Maryland. Deep Vein Thrombosis (DVT) Adult, Older Adult Accepting Healthy Volunteers Prospective Evaluation of Next Generation CT Reconstruction (NextGenIR) Recruiting Maryland Are you at least 18 years old and scheduled for a CT of the chest, abdomen, and pelvis? In this study, researchers want to learn if new CT imaging methods with less radiation make images that are similar to traditional ways. If you are at least 18 and your doctor has said you need a CT scan of the chest, abdomen, or pelvis, you may be able to participate. This study is taking place at the National Institutes of Health Clinical Center in Bethesda, Maryland. The Lungs How the Lungs Work How the Heart Works Adult, Older Adult Splanchnic Venous Capacitance in Postural Tachycardia Syndrome Recruiting Tennessee The study is to investigate that the worsening orthostatic tachycardia and symptoms after glucose ingestion in POTS patients are due to a greater increase in splanchnic venous capacitance and excessive blood pooling during an orthostatic challenge. Heart Attack Adult Accepting Healthy Volunteers RCT of Sensor-controlled Digital Game for Heart Failure Self-management Recruiting Texas This study evaluates a sensor-controlled digital game (SCDG) to motivate self-management behaviors of weight monitoring and physical activity in adults with heart failure (HF). Half of the participants will receive the SCDG app and weight monitoring and physical activity sensors and the other half will receive only the weight monitoring and physical activity sensors. Heart Failure Physical Activity and Your Heart Adult, Older Adult 2-Hydroxybenzylamine (2-HOBA) to Reduce HDL Modification and Improve HDL Function in Familial Hypercholesterolemia (FH) Recruiting Tennessee Do you have a family history of high cholesterol? Researchers are studying whether a particular medication can lower cholesterol in people with a family history of high cholesterol. You may be able to participate if you are 18 to 69 years old, have not had a heart attack or stroke recently, and do not have uncontrolled high blood pressure. This study will take place in Nashville, Tennessee. Blood Cholesterol Adult, Older Adult Together Everyone Achieves More (TEAM) Trial Recruiting South Carolina Are you an African American or Black woman? Do you want to join a study about becoming more active? This study explores whether a group program can help women be more physically active. You must be 18 years old and exercise less than 60 minutes per week to join. The study is taking place in Columbia, South Carolina. Physical Activity and Your Heart Heart-Healthy Living Adult, Older Adult Accepting Healthy Volunteers Female The MObile Health InterVEntion in Pulmonary Arterial Hypertension (MOVE PAH) Study Recruiting Tennessee The Investigators propose a randomized trial of smart texts versus usual care for 6 months. The Investigators will randomize 100 PAH patients to the mHealth intervention or usual care. The Investigators will test the effect of a text-based mHealth intervention on HRQOL in PAH using the PAH-specific emPHasis-10 questionnaire. The Investigators will also test the effect of an mHealth intervention on exercise capacity, measured by a supervised home-based 6MWD test. Finally, the Investigators will examine the effect of the intervention on time to clinical worsening (composite of PAH therapy escalation, PAH hospitalization, and death) one year after randomization. Pulmonary Hypertension Adult, Older Adult The Diaphragmatic Initiated Ventilatory Assist (DIVA) Trial Recruiting Multiple Locations DIVA is a pragmatic randomized clinical trial (RCT) to determine: among (P) preterm infants born 24-27 6/7 weeks gestation undergoing extubation from mechanical ventilation, whether (I) Non-invasive neurally adjusted ventilatory assist (NIV-NAVA) (C) compared with Non-synchronized nasal intermittent positive pressure ventilation (NS-NIPPV), will reduce the incidence of (O) extubation failure within (T) 5 days (120 hours) of extubation. Interstitial Lung Diseases Lung Disease Treatments Child Medication Adherence in Patients With Sarcoidosis Recruiting Maryland The goal of the study is to look at the relationship between how individuals with Sarcoidosis take the sarcoidosis medicines and how it affects the disease, to evaluate any factors that may make individuals not want to take the medicines, and to develop and refine ways to help support individuals with Sarcoidosis especially when it comes to the medicines. The overall hypothesis is higher medication adherence will be associated with better clinical outcomes in sarcoidosis. The investigators will enroll 150 patients with biopsy proven pulmonary sarcoidosis for at least one year who are on any oral treatment regimen for at least six months into a 12-month longitudinal study. Sarcoidosis Adult, Older Adult Mental Stress Reactivity in Women With CMD Recruiting Georgia Are you a woman with coronary microvascular dysfunction? In this clinical trial, researchers are studying coronary microvascular dysfunction, which occurs when there are problems in the small blood vessels in the heart. It frequently causes chest pain and is more common in women. The researchers want to learn how daily life and mental stress affect the heart. You may be able to participate if you are at least 45 years old, have gone through menopause, and are willing to undergo tests to measure your stress level. The study is taking place at locations in Atlanta, Georgia. Coronary Heart Disease Women and Heart Disease Adult, Older Adult Female Pagination Current page 1 Page 2 Page 3 Page 4 Next Last"
