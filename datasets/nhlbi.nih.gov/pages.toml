full_description = "NEWS & EVENTS Sickle Cell Disease Advisory Committee - Agenda, January 14, 2025 January 14, 2025 Virtual 10:00 a.m. - 3:00 p.m. ET Description The Sickle Cell Disease Advisory Committee (SCDAC) makes recommendations on research priorities conducted or supported by NHLBI. The Committee also makes recommendations about long range plans of basic, clinical, applied, health education, and prevention related research concerning the scientific aspects of research programs on the nature, causes, diagnosis, treatment, and prevention of Sickle Cell Disease. The Committee will advise, consult with, and make recommendations to the Director, NIH, the Director, NHLBI, and the Director, DBDR.10:00am-10:15am: Welcome and General IntroductionsTitilope Fasipe, MD, PhD, Baylor College of Medicine/Texas Children’s Hospital, SCDAC ChairJulie Panepinto, MD, MSPH, Director, DBDR, NHLBI, SCDAC Executive SecretaryTraci Mondoro, PhD, Associate Director, DBDR, NHLBIJuan Salomon, MS, PMP, Cure Sickle Cell Initiative Coordinator, NHLBIIdalia Yabe, PhD, Program Officer, NHLBI10:15am-11:15am: Brief NHLBI SCD Program Updates10:15-10:30am FDA Approval of commercial gene therapies and 15 year follow-up mandate10:30-10:45am Overview of the Cure Sickle Cell InitiativeGene therapy funded clinical trialsNatural History Data ResourceLong Term Follow Up overview10:45-1:00pm: Experts to Provide an Overview of End Organ Assessments and Morbidity in SCD10:45-10:50am: Introduction to Guest SpeakersTraci Mondoro, PhD10:50-11:20am: SCD and the LungSpeaker: Elizabeth Klings, MD11:20-11:50pm: SCD and the HeartSpeaker: Ankit Desai, MD11:50am-12:00pm: Break12:00-12:30pm: SCD and the BrainSpeaker: Allison King, MD, MPH, PhD12:30-1:00pm: SCD and the KidneySpeaker: Jeffrey Lebensburger, DO1:00pm-1:40pm: Lunch Break1:40- 2:50pm Group discussion on end organ LTFUGeneral discussion2:50- 3:00pm Final remarks and meeting adjourned.Videocasthttps://videocast.nih.gov/watch=55419"
