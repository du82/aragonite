full_description = "About the NHLBI The NHLBI is the nation's leader in the prevention and treatment of heart, lung, blood and sleep disorders. Our Mission The National Heart, Lung, and Blood Institute (NHLBI) provides global leadership for a research, training, and education program to promote the prevention and treatment of heart, lung, and blood disorders and enhance the health of all individuals so that they can live longer and more fulfilling lives. Learn more about the NHLBI mission and Strategic Vision Gary H. Gibbons, M.D. Director, National Heart, Lung, and Blood Institute 2012 - Present View all Leadership What We Do Advance scientific discoveries Discover how the NHLBI's research initiatives are enhancing knowledge and impacting public health. Improve public health Read the latest science-based, plain-language health information for heart, lung, blood, and sleep disorders. Fund groundbreaking research Gain access to current funding and training opportunities from the NHLBI. How We Function Divisions, Offices and Centers Advisory Committees Budget and Legislative Working at the NHLBI One of the largest institutes and centers that make up the National Institutes of Health, the NHLBI offers job and training opportunities to promote the prevention and treatment of heart, lung, and blood diseases and sleep disorders. Learn more about working at the NHLBI How to Reach Us National Heart, Lung, and Blood Institute Building 31 31 Center Drive Bethesda, MD 20892 Get answers to your questions about health, clinical trials, the website, and more. Contact Us Gary H. Gibbons, M.D. Director, National Heart, Lung, and Blood Institute 2012 - Present View all Leadership"
