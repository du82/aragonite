full_description = "Strategic Vision The NHLBI's Strategic Vision rests on four mission-driven goals that will benefit from sustained Institute focus. Eight objectives organize the 132 Research Priorities. Download the full Strategic Vision Questions? Goals Four mission-oriented goals are at the center of the Strategic Vision. View the Strategic Goals and Objectives Understand Human Biology Reduce Human Disease Develop Workforce and Resources Advance Translational Research ObjectivesUnderstand normal biological function and resilienceInvestigate newly discovered pathobiological mechanisms important to the onset and progression of HLBS diseasesInvestigate factors that account for differences in health among populationsIdentify factors that account for individual differences in pathobiology and in responses to treatmentsDevelop and optimize novel diagnostic and therapeutic strategies to prevent, treat, and cure HLBS diseasesOptimize clinical and implementation research to improve health and reduce diseaseLeverage emerging opportunities in data science to open new frontiers in HLBS researchFurther develop, diversify, and sustain a scientific workforce capable of accomplishing the NHLBI’s mission Eight objectives provide a framework for moving HLBS science forward. Research Priorities More than 1,000 Compelling Questions (CQs) and Critical Challenges (CCs) submitted during the Strategic Visioning process were refined to yield 132 Research Priorities that will guide NHLBI initiatives to advance our progress in achieving the eight objectives. View Compelling Questions (CQs) and Critical Challenges (CCs) Getting to the Vision The Strategic Visioning process was unprecedented and involved a broad circle of partners—scientists, medical professionals, policymakers, patients and patient advocates, professional groups, and other interested members of the public. Learn more"
