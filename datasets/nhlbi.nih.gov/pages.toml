e updated Asthma Management Guidelines which offer healthcare providers updated recommendations across six areas of asthma care. Division of Lung Diseases The NHLBI’s Division of Lung Diseases supports research on the causes, diagnosis, prevention, and treatment of lung diseases and sleep disorders. Lung Health Related Topics at NHLBI NHLBI offers information on a variety of lung-related diseases and conditions. Participate in Clinical Trials The NHLBI leads or sponsors many studies to advance our knowledge and treatment of lung diseases and sleep disorders—and you can help. Learn more. Advancing the Research on Lung Diseases Learn how NHLBI conducts and supports research that expands our understanding of lung biology and how lung diseases start and progress. Lung Health News and Events Find the latest stories about NHLBI-funded research and events. Funding Opportunities for Research Search and learn more about NHLBI funding opportunity announcements (FOAs) for research on lung diseases and sleep disorders. COVID-19 and the Lungs Learn how COVID-19 affect the lungs. Related News January 02, 2025 | NHLBI in the Press Researchers develop nasal swab test that can detect specific asthma subtypes in kids Researchers developed a nasal swab test that helps identify specific asthma subtypes or endotypes in children, which can be difficult to detect. Read more Related Events COPD: Protect Your Lungs for Life — A Learn More Breathe Better® Webinar October 10, 2024 Virtual 2:00 p.m. - 3:00 p.m. ET Join the Learn More Breathe Better® program and guest speakers from the Breathe Better Network as we discuss how people in all stages of ... Read more"
