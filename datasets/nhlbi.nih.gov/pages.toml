full_description = "February is American Heart Month Find fact sheets, social media resources, videos, and more! 1 Health Education Resources Participate in a Study Funding Opportunities NHLBI News Health Topics What's Happening at the NHLBI News Cardiovascular risk score gauges the toll that mental stress can have on the heart News Severe infections linked to increased associated risks for heart failure Education 25 Ways To Take Part in American Heart Month Fact Sheet Follow NHLBI on our Social Media Accounts Health Topics Featured health topic Coronary Heart Disease Coronary heart disease is a common type of heart disease where the arteries of the heart cannot deliver enough oxygen-rich blood to the heart. View Coronary Heart Disease Health Topic View Coronary Heart Disease Cardiomyopathy Heart Attack Blood Cholesterol Heart Inflammation Heart-Healthy Living Heart Failure View All Topics Featured Areas of Research Discover research programs and initiatives that seek to inform prevention, diagnosis, and treatment for today’s major health challenges and conditions. Heart Failure NHLBI-supported research has contributed to heart failure treatments using breakthrough therapies. Learn more about heart failure research at NHLBI Data Science BioData Catalyst is a cloud-based ecosystem where researchers can analyze data related to NHLBI focus areas, like Long COVID, sickle cell disease, asthma, and heart disease. BioData Catalyst Research Community Engagement Alliance (CEAL) CEAL is helping communities hardest hit by COVID-19. Learn more about CEAL and its programs. Community Engagement Alliance (CEAL) Against COVID-19 Disparities NHLBI Events Jan 14 Sickle Cell Disease Advisory Committee - Agenda, January 14, 2025 Tue, Jan 14 Jan 15 Taking Care of #OurHearts Together: Building Heart-Healthy Communities Wed, Jan 15 View More Events NHLBI PUBLICATIONS The NHLBI has materials for patients and health professionals on many health topics, such as asthma, heart disease, and sic