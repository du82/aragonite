["https://nhlbi.nih.gov/health/sleep-apnea"]
title = "Sleep Apnea - What Is Sleep Apnea? | NHLBI, NIH"
description = "Sleep apnea is a common condition that occurs when your breathing stops and restarts many times while you sleep. Learn about the causes, symptoms, and treatments of sleep apnea."
full_description = "Sleep Apnea Home < Back To Health TopicsSleep Apnea 0 Sleep Apnea MENU Home < Back To Health TopicsSleep Apnea What Is Sleep Apnea? Symptoms Diagnosis Causes and Risk Factors Treatment Living With Sleep Apnea and Women Sleep Apnea in Children MORE INFORMATION Participate in a Study Fact Sheets and Handouts Research Sleep Apnea Sleep Apnea What Is Sleep Apnea? Language switcherEnglishEspañol Sleep apnea is a common condition that occurs when your breathing stops and restarts many times while you sleep. This can prevent your body from getting enough oxygen. If someone tells you that you snore or gasp for air during sleep, you may want to talk to your healthcare provider. You may also want to ask your provider about sleep apnea if you experience other symptoms of poor sleep quality, such as excessive daytime sleepiness.There are two types of sleep apnea.Obstructive sleep apnea, also called OSA, happens when your upper airway becomes blocked many times while you sleep. The blockage can reduce or completely stop airflow. This is the most common type of sleep apnea. Factors such as obesity, large tonsils, or changes in your hormone levels can narrow your airway. Any of these factors could increase your risk for obstructive sleep apnea.Central sleep apnea occurs when your brain does not send the signals needed to breathe. Health conditions that affect how your brain controls your airways and chest muscles can cause central sleep apnea. What is sleep apnea? Learn about the symptoms and health effects of untreated sleep apnea. To diagnose sleep apnea, your provider may have you do a sleep study. Breathing devices, such as continuous positive air pressure (CPAP) machines, and lifestyle changes are common sleep apnea treatments. If these treatments do not work, your provider may recommend surgery to correct the problem that is causing your sleep apnea. If your sleep apnea is not diagnosed or treated, you may not get enough quality sleep. This can lead to issues with concentrating, making decisions, remembering things, or controlling your behavior. Untreated sleep apnea increases the risk for stroke, heart attack, and other serious problems.About 50 to 70 million Americans have a sleep disorder. To learn about NHLBI sleep research and find more sleep-related information, visit the Sleep Health Education and Awareness pages. Book traversal links for What Is Sleep Apnea? Next Symptoms Last updated on January 09, 2025"
