["https://nhlbi.nih.gov/education"]
title = "Education and Awareness | NHLBI, NIH"
description = "Find health education and outreach materials to promote wellness and lower the risk of heart, lung, blood and sleep diseases and disorders."
full_description = "Education and Awareness The National Heart, Lung, and Blood Institute (NHLBI) develops health education and awareness programs to effect positive change in public health. These initiatives focus on implementing national programs to help lower the risk for and consequences of heart, lung, blood, and sleep diseases and disorders. We develop these educational programs by first synthesizing accepted scientific findings. We then use our knowledge of adult learning theory, sound behavior change, and social marketing to design informational materials that not only effectively inform our audience but also enable them to make healthy changes to their behavior. Moreover, the NHLBI partners with private-sector organizations and other Government agencies to amplify critical public health messages. HeartThe Heart Truth®The Heart Truth® is a national education program that raises awareness about heart disease and its risk factors.American Heart MonthJoin NHLBI during the month of February and beyond to raise awareness about heart health. We offer a wide variety of educational materials and resources to use in your community, on social media, and more that help people learn more about what they can do to protect their hearts.High Blood Pressure Education ResourcesJoin the NHLBI in May during National High Blood Pressure Education Month and beyond to raise awareness about high blood pressure. Through its research and clinical trials, the NHLBI is improving the health of people who have high blood pressure. We offer educational resources to help people manage and lower their blood pressure, including DASH eating plan resources. Community Health Worker Tools Community health workers play an important role in educating their communities about heart disease. Find culturally appropriate resources from NHLBI and The Heart Truth to use in African American, Hispanic/Latino, American Indian, Alaska Native, and Asian American, Native Hawaiian and other Pacific Islander communities. DASH Eating PlanThe DASH eating plan, also known as the DASH diet, is a flexible and balanced eating plan that helps create a heart-healthy eating pattern for life. Learn more about the health benefits of the plan and how to follow the DASH eating plan and limit calories and sodium in your daily life.Therapeutic Lifestyle Changes (TLC) To Lower CholesterolThe Therapeutic Lifestyle Changes, or TLC, Program is a three-part program created by the National Heart, Lung, and Blood Institute to improve cholesterol numbers.LungLearn More Breathe Better®Learn More Breathe Better® is a national health education program that raises awareness about asthma, chronic obstructive pulmonary disease, and lung health. Asthma Education Resources Asthma is a long-term lung disease that causes periods of wheezing, chest tightness, shortness of breath, and coughing. When people control their asthma, they can lead full and active lives. Use our resources to raise awareness of asthma and encourage proper treatment.Chronic Obstructive Pulmonary Disease (COPD) Education Resources COPD is a progressive lung disease that over time makes it hard to breath. Most people who have COPD have both emphysema and chronic bronchitis. It is a leading cause of death in the United States. Join us on the #COPDjourney and help raise awareness about COPD and its symptoms. COPD National Action PlanThe COPD National Action Plan is the first-ever blueprint for a multi-faceted, unified fight against the disease. Developed at the request of Congress with input from the broad COPD community, it provides a comprehensive framework for action by those affected by the disease and those who care about reducing its burden.BloodBlood Diseases and Disorders Education Program A national health education program that brings greater visibility to blood diseases, disorders, donation, and safety.Sickle Cell Disease: Research, Programs, and ProgressSickle cell disease affects about 100,000 Americans, many of whom are African American. The NHLBI continues its legacy of commitment to use science to extend and improve the lives of people who have sickle cell disease. We also develop resources and support engagement activities for patients, their families, researchers, health professionals, and other partners.SleepSleep HealthAbout 50 to 70 million Americans have sleep disorders, and 1 in 3 adults do not regularly get the recommended amount of uninterrupted sleep they need to protect their health.Other InitiativesAim for a Healthy WeightAim for a Healthy Weight provides science-based weight control information for patients, the public, and health professionals. Resources include healthy eating plans, menu planners, recipes, a BMI (body mass index) calculator, and physical activity tips.We Can!® (Ways to Enhance Children's Activity & Nutrition)We Can!® (Ways to Enhance Children’s Activity and Nutrition) is a national science-based education program designed to give parents, caregivers, and entire communities the tips, tools, and strategies they need to help children maintain a healthy weight. The program focuses on three important behaviors: improving food choices, increasing physical activity, and reducing screen time."
