title = "Website, Privacy, and Accessibility | NHLBI, NIH"
description = "Get answers to your questions on website errors, privacy, Freedom of Information Act (FOIA), and accessibility-related matters from the NHLBI."
full_description = "Home/About the NHLBI/ < Back To Contact NHLBI/Website, Privacy, and Accessibility 1 Website, Privacy, and Accessibility Get answers to your questions on website errors, privacy, Freedom of Information Act (FOIA), and accessibility-related matters from the NHLBI. Last updated July 11, 2022 Website, Privacy, and Accessibility MENU CLOSE Contact NHLBI Health and Clinical Trials Information Trademark and Logo Privacy and Accessibility Budget and Research FOIA Request The FOIA, 5 U.S.C. 552, provides individuals with a right to access to records in the possession of the Federal government. The government may withhold information pursuant to the nine exemptions and three exclusions contained in the Act. NHLBI operates a Freedom of Information Act (FOIA) Fee-for-Service Center that processes FOIA requests for multiple NIH institutes and centers. If you have questions regarding FOIA requests pending with NHLBI or any of its service center clients or questions specific to their records, please contact Marianne Manheim, NHLBI FOIA and Privacy Act Coordinator, by phone (301-496-9737) or email (nhlbifoiarequest@nhlbi.nih.gov). Submit a FOIA Request What is the external link disclaimer policy? This graphic notice () next to a link on the National Heart, Lung, and Blood Institute’s website indicates that the link leads to another site that is not a federal government website. NHLBI links to external websites to supplement the information found on our website. However, NHLBI cannot guarantee the accuracy of information provided on external websites. Linking to a non-federal website does not indicate an endorsement by NHLBI of the sponsors or of the information and products presented on the website. You will be subject to the external website's privacy policy when you leave NHLBI's website. What is the NHLBI privacy policy? ​​​​​The NHLBI does not disclose, give, sell, or transfer any personal information about visitors to its websites, unless required by law or court order. The NHLBI is committed to protecting your privacy. Please read our Privacy Policy page for more detail. What is the NHLBI Website Accessibility Statement? The NHLBI web pages have been designed to make them accessible to all users and compatible with screen readers and other assistive technologies. However, with the continual innovations in technology, it is possible that you may encounter problems when accessing certain pages. For plug-in information refer to Notes on Viewing & Downloading Files (plug-Ins), the page describes notes on accessing various file formats such as HTML, ASP, MS Word, PowerPoint & Excel Viewers (Windows), CSV, PDF, TXT and Zip files. DISCLAIMER: The NHLBI website screen or document appearance may vary depending on your hardware/software configuration. Different operating systems, browsers, screen resolution settings, and specific software plug-ins (such as Adobe Pro vs. Adobe Reader, or PowerPoint Viewer vs. PowerPoint MS Office) will affect display results. In addition, document properties assigned by the NHLBI website may be overridden by customized settings within your software applications (such as those on Internet Explorer’s Internet Options tab). Font issues such as warnings about embedded fonts may be resolved by choosing more flexible 'default font' options. Other influences on accessibility and usability results may be the use of different models and versions of screen readers or other assistive technology devices. Therefore, in an effort your resolve issues in an expedient manner, it is prudent to take note of the specificities requested when reporting accessibility issues. If you need an alternative means of accessing any information on the NHLBI website, please contact us through our NHLBI Web Maintenance Team."
