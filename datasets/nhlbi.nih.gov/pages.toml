full_description = "Blood Diseases and Disorders Education Program Blood diseases and disorders affect millions of people in the U.S. Learn more about their symptoms, treating and managing these conditions, and blood donation and safety. Learn More CONNECT WITH US Highlights About the Blood Diseases & Disorders Education Program A national health education program that brings greater visibility to blood diseases, disorders, donation, and safety. SCD: Milestones in Research and Clinical Progress Booklet Learn about the history of SCD, from its discovery in 1910 to the NHLBI legacy of research that has advanced the understanding of SCD. January is National Blood Donor Month Share fact sheets, social media content, articles, and other blood donation resources. Blood Disease & Disorders Resources The Blood Diseases & Disorders Education Program offers resources for health and community professionals to educate patients, their caregivers, and the public about blood diseases, blood disorders, blood donation and safety. Blood Health Education Resources Sickle Cell Disease: Research, Programs, and Progress Donate Blood. Save Lives. Social Media Resources Health Professional Resources Blood Health Videos Partnering Join the Blood Health Network The Blood Health Network is a partnership of organizations around the country working to raise awareness about blood diseases and disorders affecting Americans. Learn more about the Blood Health Network Health Professionals Community Subcontract Program The Blood Diseases & Disorders Education Program supports community organizations in promoting blood donation across the United States. Community Subcontract Program Related Initiatives Cure Sickle Cell initiative (CureSCi) See how NHLBI-led research is paving the way to a cure for sickle cell disease. Blood Disorders and Blood Safety The NHLBI is a global leader in blood-related research. Learn about NHLBI-supported research on blood disorders, including sickle cell disease, blood safety, transfusion medicine, and more. Sickle Cell and other clinical trials Find out if you or someone you love is eligible to participate in an NHLBI clinical trial for sickle cell disease. COVID-19 and the Blood Learn how COVID-19 affect the blood. Related News July 02, 2024 | Research Feature A potential game-changer for emergency medicine: synthetic platelets Imagine being a paramedic treating a trauma patient who’s bleeding severely. You know your patient’s life is in danger, but there’s not much you can do because the patient needs an infusion of blood containing... Read more Related Events ASH (American Society of Hematology) Annual Meeting & Exposition 2024 December 7 - 9 , 2024 San Diego Convention Center 111 W Harbor Dr San Diego, CA 92101 The National Heart, Lung, and Blood Institute (NHLBI) of the National Institutes of Health (NIH) is participating in ASH 2024, the Americ... Read more"
