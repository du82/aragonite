["https://nhlbi.nih.gov/about/budget-and-legislative-information"]
title = "Budget and Legislative Information | NHLBI, NIH"
description = "Each year, the NHLBI receives its budget from the United States Congress. Learn more about our budget and how it funds our programs and research priorities."
full_description = "Home/ < Back To About the NHLBI/Budget and Legislative Information Budget and Legislative Information Each year, the NHLBI receives its budget from the United States Congress. Learn more about our budget and how it funds our programs and research priorities. Read the FY 2025 Congressional Justification Fact Sheet Last updated March 11, 2024 The NHLBI has a long history of supporting groundbreaking research to prevent, detect, and treat heart, lung, blood, and sleep disorders and diseases. Each year, we invest more than $3 billion in medical research in NHLBI laboratories and at more than 520 research institutions across the country and world. Research Data, Funding, and Highlights Research Funding and Success Rates See data on NHLBI’s budget and research funding. Learn more Disease Prevalence & Mortality Data Find prevalence, mortality, and healthcare cost statistics for heart, lung, blood, and sleep conditions. Learn more Advancing Heart, Lung, Blood, and Sleep Research See our 2024 science advances and research highlights. Learn more Congressional Budget Justifications Each year, when the President submits a budget request to Congress, federal agencies including the NIH/NHLBI prepare a Congressional Justification for the House and Senate appropriations committees. This document helps justify the President's request by detailing our past investments and advances in research, active research programs, evolving scientific priorities, and proposed budget for the coming fiscal year (FY). FY 2025 Congressional Justification FY 2024 Congressional Justification FY 2023 Congressional Justification FY 2022 Congressional Justification FY 2021 Congressional Justification FY 2020 Congressional Justification FY 2019 Congressional Justification FY 2018 Congressional Justification FY 2017 Congressional Justification Significant Items Each year, Congress issues directives, called Significant Items, to Federal agencies, including NIH, in the reports accompanying House and Senate appropriations bills. Significant Items are assigned to the NIH Institutes and Centers (ICs) according to their areas of expertise. FY 2022 Significant Items FY 2021 Significant Items FY 2020 Significant Items FY 2019 Significant Items FY 2018 Significant Items FY 2017 Significant Items FY 2016 Significant Items Congressional Appropriations Hearings Each year, the NHLBI Director may be called upon to testify before the House and Senate Appropriations Subcommittees on Labor, Health and Human Services, and Education, and Related Agencies (LHHS).Explore past Statements for the Record: FY 2019 Budget - NHLBI Director's Statement - Senate Appropriations Subcommittee FY 2016 Budget - NHLBI Director's Statement - Senate Appropriations Subcommittee FY 2015 Budget - NHLBI Director's Statement - Senate Appropriations Subcommittee FY 2014 Budget - NHLBI Director's Statement - Senate Appropriations Subcommittee Congressional Testimony, Briefings, Reports, and Special Events NHLBI Division of Lung Diseases Director James P. Kiley, Ph.D., speaks at a Congressional briefing on vaping. (March 3, 2020) The NHLBI is accountable to keeping Congress informed about Institute-funded research. Occasionally, NHLBI subject matter experts are asked to testify before Congress or participate in Congressional briefings and events.FY 2022 Senate Appropriations Labor-HHS Subcommittee. (May 26, 2021) NHLBI Speaker: Gary H. Gibbons, M.D., NHLBI Director, joins NIH Director Collins and several other NIH Institute Directors.FY 2022 House Appropriations Labor-HHS Subcommittee. (May 25, 2021) NHLBI Speaker: Gary H. Gibbons, M.D., NHLBI Director, joins NIH Director and several other NIH Institute Directors. Black Maternal Health Caucus Roundtable. (December 11, 2019) NHLBI speaker: Gary H. Gibbons, M.D., NHLBI Director.Labor-HHS Subcommittee members visit NIH. (September 17, 2019) NHLBI speaker: John Tisdale, M.D., Division of Intramural Research.The Alliance of Aging Research 2019 Annual Congressional Bipartisan Awards (September 17, 2019) John Tisdale, M.D. of NHLBI received Silver Innovator Award.Congressional Rare Disease Caucus Briefing on New Technologies and Treatments for Rare Diseases (May 15, 2019) NHLBI Speaker: Gary H. Gibbons, M.D., NHLBI Director.Capitol Hill Event to Commemorate the NHLBI Division of Lung Diseases (DLD) 50th Anniversary (April 9, 2019)Research! America 30th Annual Meeting of Members (March 13, 2019) NHLBI Speaker: Gary H. Gibbons, M.D., NHLBI Director.WomenHeart Capitol Hill Briefing on Women’s Inclusion in Cardiovascular Research (February 26, 2019) NHLBI Speakers: Gary H. Gibbons, M.D., NHLBI Director, and Nakela Cook, M.D., Chief of Staff at NHLBIPulmonary Fibrosis Patient Education Day, (September 22, 2018) NHLBI Speaker: Gary H. Gibbons, M.D., NHLBI DirectorCongressional Briefing on Chronic Obstructive Pulmonary Disease: The Burden in Rural America, (March 20, 2018) NHLBI Speaker: James, P. Kiley, Ph.D., director of the Division of Lung Diseases Key Moments in NHLBI’s Legislative History 1948The National Heart Institute was established in 1948 when President Harry S. Truman signed into law the National Heart Act, Public Law 80-655, which authorized the Institute to conduct, assist, and foster research; provide training; and assist the states in the prevention, diagnosis, and treatment of heart diseases.1969The Institute was renamed the National Heart and Lung Institute in 1969 by the U.S. Secretary of Health, Education, and Welfare, after a major National Heart Institute reorganization that created a pulmonary disease branch, along with branches for other cardiovascular diseases, therapeutic evaluation, and epidemiology.1972Congress further expanded the Institute’s authorities in 1972, with the enactment of the National Heart, Blood Vessel, Lung and Blood Act, Public Law 92-423, to augment the national effort against heart, lung, and blood diseases.1976In 1976, the Health Research and Health Services Amendments, Public Law 94-278, authorized research and training on blood disease and the use of blood products and the management of blood resources. The law also changed the Institute’s name to the NHLBI.1993In 1993, the National Center on Sleep Disorders Research was established as part of NHLBI, with the enactment of the NIH Revitalization Act, Public Law 103-43. The Center remains under the leadership of the NHLBI Division of Lung Diseases.For more information about the NHLBI's history, visit The NIH Almanac. Annual Science Advances Advancing Heart, Lung, Blood, and Sleep ResearchLearn more about some of NHLBI's major programs, partnership activities, as well as recent advances in research funded by the institute. The information is presented by program area and showcases how NHLBI is implementing the objectives established in the NHLBI Strategic Vision. NHLBI Gift FundThe NHLBI is also authorized by Congress to accept donations and bequests to support its mission. Learn more about the NHLBI Gift Fund Still can't find what you're looking for? Science Policy, Outreach, and Reporting (SPOR) BranchSPOR Branch Chief: Sandeep Dayal, Ph.D.Office of Science Policy, Engagement, Education and CommunicationsNational Heart, Lung, and Blood Institute301-496-4236"
