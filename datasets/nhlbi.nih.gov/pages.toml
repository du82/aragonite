comes to the health benefits of coffee, timing may count January 02, 2025 Researchers develop nasal swab test that can detect specific asthma subtypes in kids View all news Featured Past Events Taking Care of #OurHearts Together: Building Heart-Healthy Communities Join The Heart Truth® for "Taking Care of #OurHearts Together: Building Heart-Healthy Communities" — a panel discussion featuring experts from the NHLBI and community organizations. This event will explore community-focused heart health statistics, lifestyle behaviors, and key resources to foster heart-healthy habits across diverse populations. January 15, 2025 Virtual 2:00 p.m. EST Blood Pressure Assessment Across the Lifespan: Improving Clinical Research and Clinical Practice This workshop will evaluate progress and discuss further research directions, including technology developments and blood pressure assessments in special populations. The workshop will convene experts to address current challenges and explore innovative solutions in order to advance the field of blood pressure assessment. December 5 - 6 , 2024 11:00 a.m. - 4:30 p.m. EST. Virtual Advancing the COPD National Action Plan: Progress and Priorities Virtual Workshop This workshop will assess the progress made towards implementation of the COPD National Action Plan since its release. We will also reengage the COPD community around using the COPD National Action Plan Community Action Tool to track and monitor progress. November 15, 2024 Virtual 9:30 a.m. - 3:30 p.m. ET CONTACT Paper Accepted? Alert NHLBI Press (OSPEEC) Was your NHLBI-funded research accepted for publication? Help us promote it and click here.'
