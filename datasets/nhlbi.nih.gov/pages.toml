description = "Join The Heart Truth and community partners to discuss heart health disparities, prevention, and resources for fostering heart-healthy communities this American Heart Month."
full_description = "NEWS & EVENTS Taking Care of #OurHearts Together: Building Heart-Healthy Communities January 15, 2025 Virtual 2:00 p.m. EST Description Join The Heart Truth® for Taking Care of #OurHearts Together: Building Heart-Healthy Communities. A panel of experts from the National Heart, Lung, and Blood Institute and community-based organizations will highlight the impact of heart disease on specific populations across the U.S. and discuss behaviors that promote heart disease prevention. This conversation will encourage the public to connect with others in their community to foster heart-healthy lifestyles, understand their heart health numbers, share resources, and engage in important conversations to support one another. Following the panel discussion, The Heart Truth will highlight resources for American Heart Month 2025.Speakers include:Gina Wei, MD, MPH, Acting Director, Division of Cardiovascular Sciences, National Heart, Lung, and Blood Institute, National Institutes of HealthJason Deen, MD, Director of University of Washington’s Medicine’s Center for Indigenous Health Jacquilyn R. German, MPH, Program Director, Jackson Heart Study Community Engagement Center, Mississippi State Department of HealthAlia Southworth, MPH, Senior Program Director, Asian Health Coalition Maria Bustamante, Health Initiatives Program Manager, National Center for Farmworker HealthRegisterhttps://westat.zoomgov.com/webinar/register/WN_9eBOcpEyQH6OqbPTzKQ8pA#/registration"
