full_description = "Heart-Healthy Living Home < Back To Health TopicsHeart-Healthy Living 0 Heart-Healthy Living MENU Home < Back To Health TopicsHeart-Healthy Living What Is Heart-Healthy Living? Understand Your Risk for Heart Disease Get Your Blood Pressure and Cholesterol Checked Choose Heart-Healthy Foods Aim for a Healthy Weight Get Regular Physical Activity Manage Stress Quit Smoking Get Enough Good-Quality Sleep MORE INFORMATION Participate in a Study Fact Sheets and Handouts Heart-Healthy Living Heart-Healthy Living What Is Heart-Healthy Living? Language switcherEnglishEspañol Heart disease is a leading cause of death in the United States for both men and women. But you can do a lot to protect your heart and stay healthy.Heart-healthy living involves understanding your risk, making healthy choices, and taking steps to reduce your chances of getting heart disease, including coronary heart disease, the most common type. By taking preventive measures, you can lower your risk of developing heart disease that could lead to a heart attack. You can also improve your overall health and well-being. Learn about the steps you can take to live a heart-healthy lifestyle. FACT SHEET 10 Ways You Can Support Heart Health Get heart-healthy tips to help you reduce the risk of heart disease. Download the fact sheet Book traversal links for What Is Heart-Healthy Living? Next Understand Your Risk for Heart Disease Last updated on April 23, 2024 FACT SHEET 10 Ways You Can Support Heart Health Get heart-healthy tips to help you reduce the risk of heart disease. Download the fact sheet"
