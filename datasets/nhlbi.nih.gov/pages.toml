full_description = "Advisory and Peer Review Committees and Review Boards Advisory Committees NHLBI Board of Scientific Counselors HLBSC National Heart, Lung, and Blood Advisory Council NHLBAC NHLBI Sickle Cell Disease Advisory Committee SCDAC Sleep Disorders Research Advisory Board SDRAB National Asthma Education and Prevention Program Coordinating Committee NAEPPCC National Commission on Lymphatic Diseases NCLD Peer Review Committees NHLBI Standing Study SectionsHeart, Lung, and Blood Program Project Review Committee (HLBP) Roster - This committee, also known as the Program Project Parent Committee, performs the second level review of Program Project Grants sent to NHLBI under the P01 mechanism.Clinical Trials Review Committee (CLTR) Roster - This committee performs the review of UG3 and U24 grant applications containing NIH-defined clinical trials.NHLBI Single-Site and Pilot Clinical Trials Study Section (SSPT) Roster - This committee performs the review of single-site investigator-initiated clinical trials and clinical trial pilot studies using the R61/R33 and R34 mechanisms.NHLBI Institutional Training Mechanism Review Committee (NITM) Roster - This committee performs the review of training grants using the T32 mechanism.NHLBI Mentored Clinical and Basic Science Review Committee (MCBS) Roster - This committee performs the review of training grants using the K01 and K08 mechanisms.NHLBI Mentored Patient-Oriented Research Review Committee (MPOR) Roster - This committee performs the review of training grants using the K23, K24, and K25 mechanisms.NHLBI Mentored Transition to Independence Review Committee (MTI) Roster - This committee performs the review of training grants using the K99/R00 and K22 mechanisms.Special Emphasis PanelsSpecial Emphasis Panels (SEPs) -- Initial ReviewReview BoardsClinical Data Science Institutional Review Board - This review board provides a central review of secondary research proposals."
