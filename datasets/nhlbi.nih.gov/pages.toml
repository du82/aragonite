full_description = "Divisions, Offices and Centers List of divisions, offices, and centers Center for Translation Research and Implementation Science The Center for Translation Research and Implementation Science (CTRIS) supports research to identify approaches that accelerate access to and integration of evidence-based practices for heart, lung, blood, and sleep health, striving for equity and improved health and healthcare services for all. Division of Blood Diseases and Resources The Division of Blood Diseases and Resources (DBDR) is a leader in research on the causes, prevention, and treatment of non-neoplastic blood diseases. Division of Cardiovascular Sciences The Division of Cardiovascular Sciences (DCVS) supports research to advance understanding of and interventions for promoting heart and vascular health across the lifespan. Division of Extramural Research Activities The NHLBI Division of Extramural Research Activities (DERA) provides leadership and advice to the NHLBI Director on developing, implementing, and coordinating extramural research contract, grant, and training program policies. Division of Intramural Research The mission of the NHLBI Division of Intramural Research (DIR), otherwise known as the Bethesda Labs, is to perform robust scientific and clinical research that leads to a better understanding of biology and clinical pathology. Division of Lung Diseases The Division of Lung Diseases (DLD) supports research on the causes, diagnosis, prevention, and treatment of lung diseases and sleep disorders. Office of the Director The Office of the Director (OD) provides overall planning, direction, coordination, and evaluation of the Institute's programs. Center for Translation Research and Implementation Science The Center for Translation Research and Implementation Science (CTRIS) supports research to identify approaches that accelerate access to and integration of evidence-based practices for heart, lung, blood, and sleep health, striving for equity and improved health and healthcare services for all."
