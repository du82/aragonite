["http://nicksweeney.com/2008/01/15/the-standard-apple-uk-surchage"]
title = "The Standard Apple UK Surcharge · Nick Sweeney"
description = "The Apple Store numbers are somewhat deceiving, because US prices exclude state sales tax, which is paid by most buyers, while UK prices include VAT. But the standard rule of thumb for working out …"
full_description = "The Standard Apple UK Surcharge 15.01.2008&c.nick The Apple Store numbers are somewhat deceiving, because US prices exclude state sales tax, which is paid by most buyers, while UK prices include VAT. But the standard rule of thumb for working out how much extra Apple screws out of British customers is as follows: Convert the US price, add VAT, stick 10% on top for shits and giggles, then round up to the nearest £49 or £99.* The MacBook Air fits this, as did the iPhone (figures rounded to nearest UKP): Convert: $1799 = £919 Add VAT: @ 17.5% = £161 Subtotal before SAUKS: £1080 Add SAUKS @ 10% = £108 Subtotal after SAUKS: £1188 Rounded up to nearest £99, you get £1199. Voilà. * Unless it’s under £100, where you round to the nearest £5 or £9. Leopard’s $129 became (£65 + VAT) + 10% = £84, rounded up to £85."
