full_description = "About …this site? nicksweeney.com is where I used to write about things. I write elsewhere now, though generally not about things. Maybe I’ll write about things again at some point. …the author? I live near mountains, do stupid things with computers, think about technology, history, culture and identity, and sometimes write about it. In another place and another life I wrote a doctoral thesis on early modern psychology and English poetry. The first time I saw a web browser was January 1994; that summer I remember turning all the links dark blue. I like borders and crossing-points and juxtapositions and uncertain spaces. …time I got in touch? Email is nick [at] nicksweeney.com . It’s nice to get email, especially these days."
