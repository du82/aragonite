title = "沿革 | NICT-情報通信研究機構"
full_description = "NICTについて NICTについて NICTブランドステートメント 理事長挨拶 役員紹介 組織 研究所長紹介 NICT憲章 目標・計画 事業報告書 評価 公開情報 所在地案内 沿革 NICTフェロー紹介 アドバイザリーコミッティー 沿革 沿革 CRL: 旧通信総合研究所 ／ TAO: 旧通信・放送機構 1891（明治24）年8月 逓信省に電気試験所 設置 1915（大正4）年1月 逓信省電気試験所平磯出張所を設立 1935（昭和10）年5月 無線機器の型式検定業務を開始 1940（昭和15）年1月 標準電波（JJY）発射業務を開始（検見川） 1948（昭和23）年6月 文部省電波物理研究所を統合 1952（昭和27）年8月 郵政省電波研究所の発足 1964（昭和39）年5月 鹿島支所を開設（直径30mパラボラアンテナ施設を完成） 1979（昭和54）年8月 通信・放送衛星機構を設立 1982（昭和57）年8月 君津衛星管制センターを開所 1988（昭和63）年4月 電波研究所を通信総合研究所に名称変更（郵政省通信総合研究所） 1989（平成元）年5月 関西支所の発足、鹿島支所と平磯支所を統合した関東支所の発足 1990（平成2）年10月 特定通信・放送開発事業への支援を開始 1992（平成4）年10月 通信・放送機構に名称変更 高度通信・放送研究開発を開始 1997（平成9）年7月 横須賀無線通信研究センターの発足 2000（平成12）年7月 けいはんな情報通信融合研究センターの開設 2001（平成13）年1月 郵政省が総務省に再編（総務省通信総合研究所） 2001（平成13）年4月 独立行政法人通信総合研究所の発足 2001（平成13）年7月 民間基盤技術研究促進業務を開始 2002（平成14）年3月 衛星管制業務を終了 2002（平成14）年8月 アジア研究連携センターの開設 2003（平成15）年4月 基盤技術研究促進センターの業務の一部を承継 2004（平成16）年4月 旧通信総合研究所と旧通信・放送機構が統合し、独立行政法人情報通信研究機構（NICT）として発足 2012（平成24）年4月 耐災害ICT研究センターの開設 2013（平成25）年4月 脳情報通信融合研究センターの開設 2015（平成27）年4月 国立研究開発法人情報通信研究機構に名称変更"
