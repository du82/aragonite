["https://www.nict.go.jp/about/charter.html"]
title = "NICT憲章 | NICT-情報通信研究機構"
full_description = "NICTについて NICTについて NICTブランドステートメント 理事長挨拶 役員紹介 組織 研究所長紹介 NICT憲章 目標・計画 事業報告書 評価 公開情報 所在地案内 沿革 NICTフェロー紹介 アドバイザリーコミッティー NICT憲章 人類は、国家や地域、民族や世代など、あらゆる境界を越えて、相互の理解を深め、知恵を交わすなかで、発展してきました。コミュニケーションは人類社会を支えるもっとも重要な活動であり、情報通信技術はそのコミュニケーションを支える基礎であります。情報通信技術はまた、人類の高度な知的活動と経済活動を支える基盤でもあります。 情報通信研究機構（NICT）は、こうした情報通信技術の研究開発を、基礎から応用まで統合的な視点で推進することによって、世界を先導する知的立国としてのわが国の発展に貢献していきます。同時に、大学や産業界、さらには海外の研究機関と密接に連携し、研究開発成果を広く社会へと還元していくことによって、豊かで安心・安全な生活、知的創造性と活力に富む社会、そして調和と平和を重んじる世界の実現に貢献していきます。"
