["https://www.nict.go.jp/about/nict-brand-statement.html"]
title = "NICTブランドステートメント | NICT-情報通信研究機構"
full_description = "NICTについて NICTについて NICTブランドステートメント 理事長挨拶 役員紹介 組織 研究所長紹介 NICT憲章 目標・計画 事業報告書 評価 公開情報 所在地案内 沿革 NICTフェロー紹介 アドバイザリーコミッティー NICTブランドステートメント 私たちNICTは、「知の限界を超え 未来の社会基盤を創る NICT」というブランドステートメントを作成しました。 このブランドステートメントは、私たちの原点と存在意義を⽰したものであり、そこにはさらなる挑戦を通じてICTが持つ可能性を拡げ、皆様と共に未来の社会を創っていきたいという想いが込められております。 NICTでは最先端の情報通信研究開発をはじめとする幅広い業務を担うべく、多様な⼈材が働いています。このブランドステートメントは、多様なバックグラウンドを持つ職員⼀⼈⼀⼈が共通のNICTのブランドイメージを持ちながら活躍することで、今後のさらなる成⻑を⽬指していくための⼼の拠りどころになるものです。 これからも私たちは、このブランドステートメントを通じてより多くの皆様と協調・連携しながら、新しい価値の創造に努めてまいります。"
