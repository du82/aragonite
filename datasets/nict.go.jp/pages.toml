description = "NICTの研究成果を、「研究者名」「組織名」 「発表題目」などから検索いただけます。"
full_description = "NICTの研究成果を、「研究者名」「組織名」 「発表題目」などから検索いただけます。 情報通信研究機構は日本標準時を決定・維持しています。「NICT インターネット時刻供給サービス」の時刻情報と、あなたのコンピュータの時刻差を表示いたします。 日本標準時に関する業務を紹介します。標準電波 JJYの送信状況は、こちらでご覧いただけます。 宇宙天気予報として、太陽活動、太陽風・太陽放射線の状況、電離層嵐などの宇宙環境の変動についてお知らせします。 政府のサイバーセキュリティ戦略等に基づき、国の機関、地方公共団体、独立行政法人、重要社会基盤事業者等を対象として、現実のサイバー攻撃を想定したリアルな演習を開発・実施しています。 25歳以下を対象に、革新的な開発やアイデアでセキュリティの未来を担う「セキュリティイノベーター」となる人材を、365日かけて育成する長期ハッカソンです。 情報処理安全確保支援士向け特定講習を提供しています。CYDERで培ったノウハウを活かし、リアリティを高めた実践的なインシデントハンドリング演習など本格的なトレーニングを実施しています。 総務省、国立研究開発法人情報通信研究機構（NICT）及びインターネットプロバイダが連携し、IoT機器へのアクセスによる、サイバー攻撃に悪用されるおそれのある機器の調査及び当該機器の利用者への注意喚起を行う取組です。 無差別型サイバー攻撃の大局的な動向を把握することを目的としたサイバー攻撃観測・分析システムによるサイバー攻撃状況をリアルタイムに可視化します。 世界31言語に対応！スマホで話しかけると外国語に相互に翻訳してくれるアプリです。簡単に使えるインターフェースで、翻訳が正しいかどうか確認もできます。"
