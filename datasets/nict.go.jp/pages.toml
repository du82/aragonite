["https://www.nict.go.jp/about/Director-Generals.html"]
title = "研究所長紹介｜NICT-情報通信研究機構"
description = """
電磁波研究所は、電波と光などの「電磁波」に関する研究開発と法定業務（パブリックサービス）を小金井本部中心に、3箇所の電波観測施設（サロベツ（北海道）、山川（鹿児島県）、大宜味（沖縄県））、2箇所の電波送信所（おおたかどや山（福島県）、はがね山（佐賀県と福岡県の県境））、沖縄電磁波技術センターなど日本全国の観測施設において各種センサによる観測を行い、研究開発を行っています。
　第5期中長期計画の3年目となる令和5年度は、これまでの2年間で取り組んで参りました研究開発を着実に進め、電磁波を使った気象、災害、宇宙環境をはじめとする社会の状況を正確に把握するセンシング技術の研究開発、科学技術の発展や現代社会の基盤維持に不可欠な、電磁波に関する基準や標準を構築するための技術の研究開発、電磁波を活用した萌芽的な研究開発や、当研究所が有する電磁波技術のビジネス展開・国際連携・学際連携を推進し、“電磁波による新しい社会基盤の創出”を実現します。"""
full_description = "電磁波研究所は、電波と光などの「電磁波」に関する研究開発と法定業務（パブリックサービス）を小金井本部中心に、3箇所の電波観測施設（サロベツ（北海道）、山川（鹿児島県）、大宜味（沖縄県））、2箇所の電波送信所（おおたかどや山（福島県）、はがね山（佐賀県と福岡県の県境））、沖縄電磁波技術センターなど日本全国の観測施設において各種センサによる観測を行い、研究開発を行っています。 第5期中長期計画の3年目となる令和5年度は、これまでの2年間で取り組んで参りました研究開発を着実に進め、電磁波を使った気象、災害、宇宙環境をはじめとする社会の状況を正確に把握するセンシング技術の研究開発、科学技術の発展や現代社会の基盤維持に不可欠な、電磁波に関する基準や標準を構築するための技術の研究開発、電磁波を活用した萌芽的な研究開発や、当研究所が有する電磁波技術のビジネス展開・国際連携・学際連携を推進し、“電磁波による新しい社会基盤の創出”を実現します。 私たちネットワーク研究所は、5カ所（東京・小金井、神奈川・横須賀、宮城・仙台、茨城・鹿島、兵庫・神戸）を拠点に活動しています。前中長期計画期間における「統合ICT基盤分野」の研究開発で培った技術を礎に、Beyond 5G 時代における Society 5.0 の高度化による社会システムの変革を実現するため、通信トラヒックの急増や通信品質の確保、サービスの多様化等に対応しうる「革新的ネットワーク」分野の研究活動を実施します。すなわち、Beyond 5Gで望まれる機能である広帯域通信や超低遅延、高信頼を叶えるため、光・無線・ネットワーキング等の基礎・システム技術を高める研究活動をしています。 世界的なSDGs等の社会課題解決に貢献するため、ネットワークの研究開発に取り組みます。具体的には、数量面と通信領域（陸上に加え海上や上空・宇宙）の拡張性や、災害・障害といった場面でも情報流通を支えるレジリエンスを追求します。さらには、円滑な情報流通を根幹で支える大容量の光通信技術や光と電波を調和利用する技術、柔軟に省力に通信・計算・蓄積・センシングリソース（資源）を制御管理し、さまざまな情報特性に合うネットワークサービスを共存させるためのネットワーク基盤技術を確立してまいります。サイバー空間上のネットワーク技術検証基盤への挑戦も行っています。 ネットワークは、様々な技術革新によって新たなモノを繋ぎ続け、価値の創造に貢献しています。私たちは一体となってネットワーク分野の技術を創造し深化し、標準化、研究開発成果の普及を推進して、Beyond 5G時代の社会を支えます。産業界や学術界と密接に連携し、また、社会の皆さまのご意見にアンテナを張りながら、技術を確立し、研究成果の展開促進や当該分野の国力強化を推進してまいります。"
year_published = 2025
