title = "NICTフェロー紹介 | NICT-情報通信研究機構"
full_description = "NICTについて NICTについて NICTブランドステートメント 理事長挨拶 役員紹介 組織 研究所長紹介 NICT憲章 目標・計画 事業報告書 評価 公開情報 所在地案内 沿革 NICTフェロー紹介 アドバイザリーコミッティー NICTフェロー紹介 2022年 柳田敏雄 未来ICT研究所 脳情報通信融合研究センター 研究センター長 柳田研究センター長は、1998年以来、NICTにおいて、脳科学と情報科学を融合させた新しい研究分野を開拓するとともに、2011年に脳情報通信融合研究センター（CiNet）を設立し、この分野における世界的研究開発拠点形成を進めてきました。 同氏は、半導体情報処理装置などの人工システムと比べて桁違いに小さなエネルギーで動作する筋肉や細胞の生体システムが、「熱ゆらぎ」を有効活用していることを世界に先駆けて解明し、工学技術へ応用可能であることを明確に示しました。この「ゆらぎ」原理が、脳の情報処理にも適用可能であることをCiNetにおいて示しました。さらに、CiNetのセンター長として、「CiNet Brainの構築」というセンターの共通目標を設定し、多様な脳機能を統一的に理解し、応用できる研究開発をすすめています。この中から、脳情報を読み解く技術、省エネルギーで耐障害性の極めて高い情報ネットワーク制御技術、無線技術を活用したブレーン・マシン・インターフェース開発などを実現しています。 CiNetは、すでに、人間の脳を計測し解析する研究センターとしては世界的規模を有しており、わが国の有望な若手研究者を育成するだけでなく、国際交流の拠点として機能していいます。脳に学ぶ人工知能の研究にも取り組んでおり、心が通う情報通信技術の研究開発も進んでいます。このような柳田氏の独創的研究成果やリーダーシップは、恩賜賞・学士院賞受賞や文化功労者・学士院会員への選出など、多数の受賞等で国の内外から高く評価されています。 2020年 鳥澤健太郎 ユニバーサルコミュニケーション研究所 データ駆動知能システム研究センター センター長 鳥澤センター長は、専門であるコンピュータサイエンスはもとより、哲学、歴史等、全く異なる分野への造詣も深く、これまで広い視野で、AIの一種である自然言語処理の研究を進めてきました。 同氏がNICTにおいて開発を主導してきた一連の大規模自然言語処理システムであるWeb情報分析システムWISDOM X、対災害情報分析システムDISAANA/D-SUMM、次世代音声対話システムWEKDAは、いずれも、同氏の視野の広さと、コンピュータサイエンス、自然言語処理における高い研究スキルが結合することによって生まれたものです。さらには、同氏が民間企業や他の国研と共同で開発を進めている高齢者向けマルチモーダル音声対話システムMICSUS、防災チャットボットSOCDAの開発においても、これらの広い視野やスキルが大きく貢献しています。 これらの複雑かつ大規模なAIシステムは、自然言語処理研究者から並列分散計算の専門家、言語学者までを含む多数の研究者やプログラマ、データ作成者からなるチームを同氏がまとめ上げることにより実現したものであり、氏の優れたリーダーシップを示すものです。また、同氏が手がけたシステムは、自治体等で防災訓練や実災害で活用されており、民間企業へのソフトウェアライセンスの提供も行われています。氏の構想力、実績は、日本学術振興会賞、文部科学大臣表彰、Twitter Data Grants等、多数の受賞等でNICT外からも高く評価されています。 2016年 佐々木雅英 未来ICT研究所主管研究員 佐々木主管研究員は、平成8年4月に郵政省通信総合研究所（当時）に入所後、量子情報通信の研究開発に従事してきました。 量子情報通信は、量子物理学に基づいて、絶対安全な量子暗号や従来の容量限界を打破する量子通信を実現する革新的な技術です。佐々木主管研究員は、小規模の量子計算機を光受信回路に組み込むことで、従来理論の「シャノン限界」を打破する量子通信が可能となることを2003年に実証し、量子通信の研究開発に新たな局面を切り拓きました。その後も、光の量子制御に関する新技術を次々に実証するとともに、産学官連携プロジェクトを主導し、量子鍵配送(QKD)装置の性能を大幅に改善し、2010年に量子暗号ネットワーク（Tokyo QKD Network）を構築して完全秘匿動画伝送を世界で初めて実現するなど、量子情報通信の基礎・応用の両面において顕著な成果を挙げました。さらに、企業と連携してスマートフォンやドローンなどの移動体通信を完全秘匿化するアプリケーションを開発し、地方創生特区において実証試験を行うなど技術の普及活動にも積極的に取り組んでいます。 隅田英一郎 先進的音声翻訳研究開発推進センター 副研究開発推進センター長 隅田副研究開発推進センター長は、「汎用で高精度」の自動翻訳の実現という究極の目標を掲げ、その実現に不可欠な「大規模多言語データ」の収集を、翻訳保有者、翻訳者、自動翻訳開発者を巻き込んだエコシステムの創出も含めた大きな構想の下に、30年以上一貫して「『亀のように』じっくりと確実に」研究開発を進めてきました。 自動翻訳の研究に携わり、規則翻訳、用例翻訳、統計翻訳、ニューラルネット翻訳の基礎研究を実施し、日本語と多言語の間の高精度な自動翻訳システムを実現し、2010年に音声翻訳のスマホアプリ「VoiceTra」、2014年にテキスト翻訳の公開サイト「TexTra」を実現しました。 また、音声翻訳技術のコンソーシアムのU-STARの主幹事として、32の参加機関を擁するまで拡大したほか、国際会議IWSLTの実行委員として、会議の国際的な認知を広げ、音声翻訳に関する標準的な会議として定着させました。さらに、2014年に国際会議WATを創始し、アジア言語の自動翻訳の研究加速を主導しています。 これらの研究開発とともに後進研究者の育成や研究マネージメントにおいて力を発揮しています。 2013年 大岩和弘 未来ICT研究所主管研究員 大岩主管研究員は、郵政省通信総合研究所（当時）に入所後、一貫してタンパク質モータの構造と運動機構に関する生物物理学的研究を行い、この研究分野の発展に貢献してきました。 大岩主管研究員は、タンパク質モータの機能を、物理学的視点から、最少要素を用いて試験管内で再構築、その解析を行う「in vitro 再構成実験系」と、一つのタンパク質モータ分子を捕捉して、その力学・酵素特性を計測する「単一分子計測手法」の発展に大きく寄与し、これらに構造解析手法を組み合わせることで、構造から機能まで幅広く解析を進めることに成功して、Nature誌をはじめとした国際一流誌に多数の成果を発表しています。また、これらの成果の重要性が認められ、2005年には第23回大阪科学賞を受賞しました。 さらに、タンパク質モータを機能素材として捉えて、センサーや超小型駆動装置などへの工学的応用を意識した領域融合的研究を進め、タンパク質モータ研究分野の新しい展開を試みており、分子通信という情報通信の新概念を提唱することで、世界的な新しい潮流を生み出すに至っています。 2011年 井口俊夫 電磁波計測研究所長 井口研究所長は、郵政省電波研究所（当時）に入所後、ほぼ一貫して電波を利用したリモートセンシング技術の研究を行ってきました。 熱帯降雨観測計画（TRMM）から全球降水観測計画（GPM）へと続く人工衛星による降水の3次元構造の観測計画においては、我が国における主導的研究者として、研究立案やシステム開発に携わってきました。 特に、TRMM計画においては、衛星搭載の降雨レーダのデータから高精度な3次元の降雨分布を推定するアルゴリズムを開発し、米航空宇宙局（NASA）及び宇宙航空研究開発機構（JAXA）での標準処理アルゴリズムとして採用されました。このアルゴリズムを用いてデータを処理することにより、それまで検知が不可能であった洋上や未開拓地域等での降雨の3次元分布構造を正確に把握することが可能となりました。TRMMによる降雨観測は1997年以来十数年にわたり継続しており、米国に深刻な被害をもたらしたハリケーンカトリーナの観測及びその進路予測精度改善など様々な成果を挙げています。 この長年にわたる観測結果は、天気予報や洪水予報・警報、台風・ハリケーンの進路予報などの改善に繋がっているほか、熱帯・亜熱帯における降水システムの理解の深化に大きく貢献しています。 （井口所長の役職は、授与当時の役職に基づく） 王鎮 未来ICT研究所主管研究員 王主管研究員は、郵政省通信総合研究所（当時）に入所後、ほぼ一貫して超伝導現象を利用したデバイス開発の研究を行ってきました。 その中で、窒化ニオブ薄膜・デバイス技術を主導的研究者として研究立案からデバイス開発、システム応用まで中心となり実施してきました。この技術は、優れた特性を持ちながら応用範囲が限定されていた窒化ニオブを実用化へ向ける大きなブレークスルーとなり、高感度・低雑音のテラヘルツ帯受信機や超伝導量子ビットデバイス、高速・低雑音・広帯域の超伝導ナノワイヤ単一光子検出器などの開発へと広く応用されました。 特に、開発した窒化ニオブ超伝導電磁波受信機を世界で初めて電波天文観測へ応用することに成功しました。また、窒化ニオブを用いた量子ビットデバイスは、固体デバイスとして世界で最も長いデコヒーレンスタイムを達成、近年、長年にわたり蓄積した窒化ニオブ薄膜作製技術とナノ微細加工技術を融合し、世界最高性能のマルチチャンネル超伝導単一光子検出システムを開発すると共に、この検出器を用いて国内で初めて行なわれた量子暗号鍵配送実験を成功に導き、量子暗号鍵配送の世界記録の達成に貢献しました。この一連の技術開発は当該分野の発展にも大きく貢献し、今後、様々な応用分野の開拓及び産業応用にも期待されています。 （王主管研究員の役職は、授与当時の役職に基づく） 2009年 増子治信 首席研究統括 増子首席研究統括は、郵政省電波研究所（当時）に入所後、電波を利用したリモートセンシング技術の研究に従事してきました。特に電波を利用して地表面の高精細画像を取得する合成開口レーダ（SAR）の開発においては、我が国における研究開発の第一人者として、基礎研究からシステム開発に至るまで中心的な役割を果たしてきました。 増子首席研究統括は、わが国初の航空機搭載SAR（航空機SAR）を開発し、世界で最も優れた性能である地上での分解能1.5 mという高分解能を実現するとともに、偏波観測による対象の識別機能及び2つのアンテナを用いた干渉法による高度測定機能（3次元観測機能）を実現しました。本航空機SARの開発により、昼夜、天候によらず、地図作製、土地利用の調査及び農林業等への応用をはじめとして、災害時の被害状況の把握や火山災害等における活動予測と災害対策及び復興計画立案などに有効な情報を提供できるようになりました。三宅島や有珠山の火山噴火災害においては、噴煙で上空からの写真撮影が難しい状況の中、本航空機SARで観測した被害状況に関するデータを関係機関に速やかに提供してその対策に活かされ、これらの研究開発の社会的・行政的な意義が高く評価されました。 （増子首席研究統括の役職は、授与当時の役職に基づく）"
