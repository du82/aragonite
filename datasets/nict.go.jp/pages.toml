["https://www.nict.go.jp/about/greetings.html"]
title = "理事長挨拶 | NICT-情報通信研究機構"
full_description = "NICTについて NICTについて NICTブランドステートメント 理事長挨拶 役員紹介 組織 研究所長紹介 NICT憲章 目標・計画 事業報告書 評価 公開情報 所在地案内 沿革 NICTフェロー紹介 アドバイザリーコミッティー 理事長挨拶 理事長 徳田 英幸 国立研究開発法人情報通信研究機構（NICT）は、情報通信分野を専門とする我が国唯一の公的研究機関として、情報通信技術の研究開発を基礎から応用まで統合的な視点で推進し、同時に、大学、産業界、自治体、国内外の研究機関などと連携し、研究開発成果を広く社会へ還元し、イノベーションを創出することを目指しています。 新型コロナウイルス感染症、自然災害、地球温暖化など顕在化した地球規模の社会的課題へ柔軟に対応し、日本全体を持続可能で強靭な社会へ変革するためには、 サイバー空間とフィジカル空間を融合させることで人間中心の社会を実現するSociety 5.0を実現することが必要不可欠です。 令和３年4月より開始した第5期中長期計画では、Society 5.0の早期実現に向け、新たなICT技術戦略に基づいた研究開発の加速、オープンイノベーション・共創的取組の加速、研究開発成果の社会展開の加速という3つの「加速」を重視した研究開発を推進します。 重点的に研究開発を行う５つの分野として、電磁波先進技術分野、革新的ネットワーク分野、サイバーセキュリティ分野、ユニバーサルコミュニケーション分野、フロンティアサイエンス分野の研究開発を進めます。また、政府戦略を踏まえ、Society 5.0の早期実現に向けた次世代ICT基盤に必要不可欠な先端技術として、戦略的に推進すべき研究4領域（Beyond 5G、AI、量子情報通信、サイバーセキュリティ）についても積極的に研究開発を進めます。 研究開発の質を高め、その成果をより効果的に社会に実装していくためには、国内外の研究機関、企業、大学、地方自治体などとの協力体制の構築が欠かせません。NICTは情報通信に関するオープンイノベーションの拠点として、関係者と密接に連携しつつ、基礎的・基盤的な研究開発から新しい事業活動に対する支援までの幅広い取組を総合的に推し進めます。 NICTは、Society 5.0の実現を目指し、国や社会を豊かにしていくための多くのチャレンジにオープンなマインドで戦略的に取り組んでまいります。 理事長 徳田 英幸"
