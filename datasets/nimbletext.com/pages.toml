["https://nimbletext.com/Info/ideasforfuturefeatures"]
title = "Ideasforfuturefeatures - NimbleText.com"
full_description = '''Have long wanted to be able to refer to cell values either by their number, e.g. $3 or by the name of the column, e.g. $CustomerNo -- assuming we did not err by treating the first row as a header row. This: "Microsoft Edge WebView2" looks interesting but is still in developer preview. It might mean that the embedded browser is finally able to handle arrow functions and better styling. Read through questions people are having at stackoverflow to take the pulse of the developer community on this emerging tech: search tags webview and microsoft-edge at stackoverflow. We could also use react native to make it just as good on tablets and ipads and smart phones and more. Though the browser version should be the canonical one. Monaco editor as used by vs code is the way to go to achieve block editing syntax highlighting line numbering and a lot of other functionality. Currently there are $ONCE, $EACH for looping through rows (and the special token $EACH+ for looping through all rows after the first row. When we are inside a $coleach what do we use to refer to the current cell for the current row? $cell ? BUT what happens if you hit another $coleach inside a $coleach ? does that mean you effectively emit a $endcoleach (to exit the current endcoleach) before continuing into the next $coleach or does it mean there is an inner loop of cols inside cols...? It might seem cool to allow it to be an inner loop... but what would $cell then mean? the inner loop's current cell or the outer loop's current cell? What happens if we hit two $endcoleach's in a row? It's an error, but how do we flag that kind of error within nimbletext? We would simply ignore the second $endcoleach and continue on, but it would be good to report a warning in some way. Consider a language feature for repeating a section an arbitrary number of times. e.g. could generate data with it. If the user has not touched the column separator textbox, and the data is changed (and a short duration has passed.. i.e. debounce the event) then detect the column separator.'''
year_published = 2025
clearnet = "https://nimbletext.com/Info/ideasforfuturefeatures"
