["https://nimbletext.com/HowTo/GenerateViews"]
title = "How to Generate Views The Easy Way"
full_description = "So you want to create a view. Let's say you already know the columns you want to use (or if you don't, get that sorted out first, then come back here. Ready? Good.) Let's say we want a simple view based on all the columns of an existing table. First we can collect the list of columns from our existing table, using any of the methods described in this article 'How do you list the columns of a table, quickly!' The central component is a comma-separated list of columns. We can turn our basic list of columns into a comma separated list of columns very easily, avoiding all repetitive paw-work, by using the simplest pattern imaginable in NimbleText: Now say we want something a little trickier: we want to rename the columns so that they are friendly for the reader. If this is what we're after: We can generate this in NimbleText by using a simple built in function 'to words' that splits a PascalCased name into its constituent words. Try this pattern: For extra credit (but not a lot of benefit) we can let NimbleText generate the rest of the view definition. Here's a pattern in NimbleText that does it all: Pulling that pattern apart we see use of the '$once' and '$each' keywords, use of embedded javascript, and use of the keywords $rowNumOne and $numRows. But remember that simple patterns like our first example, '$0,' are useful all by themselves, and give you plenty of bang for your buck (it's zero dollars after all!). You can slowly build up to more complex examples, always getting more value along the way. And there we have it, a custom user-friendly View generator, and most of the wisdom you need to tailor your own custom views. Of course this is just one type of SQL statement that NimbleText will help you generate. There's no limit to what types of text you can produce with it. You can also get general help, help on all the symbols and keywords, or on the built-in functions, filtering with a where clause, help with the powerful command-line automation, or applying custom formats to your dates and times."
