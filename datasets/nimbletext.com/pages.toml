["https://nimbletext.com/SET/Advanced"]
title = "Advanced SET Comparison with NimbleSET"
full_description = '''By default, NimbleSET performs 'absolute' comparisons, where an entire row on the left is compared to an entire row on the right. But often you want something more nuanced. You want to look at particular columns or search for particular patterns. A 'natural' comparison would look for rows where "CustomerID" on the left matched "CustomerID" on the right, since those columns exist in both sets. If there were 10 columns with the same headings, then all 10 columns would be matched. To compare one column on the left a specific column on the right, look at the 'Comparison Type' drop down, in the middle of the screen. It contains a menu of all possible combinations of columns. In just two clicks you can switch to compare any column on the left to any column on the right. (It's much quicker than it would be to perform the same comparison with a database!) For example, if we want to join a list of the US states to their capitals... We might have state information like this: We can use 'Intersection' to see items in both lists (and to find the full state name that goes with each capital, the capital city for each state... sell it however you want). We can use 'Left Only' to see which State's are missing a capital, or 'Right only' to see if we have a capital for a nonexistent state. We want to find (or exclude!) people with certain skills. NimbleSET is the tool we use. We enter the skills we're after on the right This is a fantastic tool for keyword analysis, combing through logfiles, and many other jobs that need doing. Now you can quickly sort the left, right or results panel by any column. Or invert their order. Or shuffle them randomly. These are all features that are only unlocked when you purchase a license for NimbleSET. More features and screenshots are described here.'''
year_published = 2025
clearnet = "https://nimbletext.com/SET/Advanced"
