["https://nimbletext.com/SET/about"]
title = "Compare Two Lists with NimbleSET"
full_description = "You have two sets of data, two lists, and you want to compare them. We can demonstrate this problem with the awesome power of a Venn diagram: NimbleSET lets us instantly split two sets into these three areas. And it does a whole lot more as well. Any time you have two lists... you need NimbleSET! In an instant you can see which items are in one list and not the other. ( or ) and see which items are in both lists () Those simple options are very powerful. They can quickly resolve office disputes, disarm data arguments, de-escalate the threat of inter-cubicle warfare. Don't get caught up in arguments about whose data is different: put it to the test, with a quick and easy tool that every member of your team can understand. (So simple even your manager can see the value!) If each list has columns, then you can join them on just the columns they share . Or any pair of columns . Joining data with NimbleSET is a faster, more direct approach than putting the sets into a database first. And it's more reliable than wonky old VLOOKUP. NimbleSET is the best way to join your data."
