title = "How to Generate Update Statements"
full_description = '''Assuming you have some data already, perhaps as raw text, generating a SQL update statement should be trivial, but it can end up being a lot of grunt work. This is exactly the kind of situation where NimbleText shines. It feels great ridding yourself of this kind of grunt work, just watch! And if you get lost for a moment don't worry. Just drink it in, let it wash over you. It'll click soon enough. In NimbleText, we paste our data into the first textbox (the data textbox). Then we create a pattern like this: NimbleText is free, by the way. You can use it online, or even better, you can download it and use it even when you're offline. You can copy this out, being careful to avoid the first row (it contains the headers) and now you have your update statements. Job done. There's only one refinement left to the technique above: we want to skip the header row. For this we'll use the $each+ ('each plus') keyword. The '$each' token means 'Repeat the following bit for each row of our raw data. More specifically, the '$each+' (each PLUS) token means "skip the header row, and then repeat this pattern for each data row. And there we have it, a custom update generator, and all the wisdom you need to tailor your own custom update generators. You can also get general help, help on all the symbols and keywords, or on the built-in functions, filtering with a where clause, help with the powerful command-line automation, or applying custom formats to your dates and times. If you haven't downloaded NimbleText yet, then for added power, privacy and versatility I sincerely think you should download it now.'''
