["https://nimbletext.com/HowTo/ExtractColumns"]
title = "NimbleText: Extracting a list of columns from a block of text"
full_description = "For example a create table statement contains a list of the columns -- though it takes some work to extract them from there. ...and tell nimbleText that our data is using a space as the column separator, we can give it this simple pattern: Now if any of the column names contained spaces we would not have gotten the right value. So let's see what happens with this table definition: So the trick here is to instead tell NimbleText that the column separator is a closing square bracket... ']' -- then we get: We can refine the pattern a little, by skipping the first and last rows, and putting the closing square backet on the end of each row: This is just a taste of extracting lists out of text. You can think of NimbleText as a very minimalist tool for transforming data. Why are we doing this in the first place? No doubt we have some purpose in getting the list of columns. We might want to generate an insert statement, an update statement, a stored procedure, a view, or manipulate the text in some other way. No doubt, getting the list of columns is not an end in itself. You can also get general help, help on all the symbols and keywords, or on the built-in functions, filtering with a where clause, help with the powerful command-line automation, or applying custom formats to your dates and times. If you haven't downloaded NimbleText yet, then for added power, privacy and versatility I sincerely think you should download it now."
