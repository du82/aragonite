["https://nimbletext.com/HowTo/GenerateHTMLTable"]
title = "Generate HTML Tables Quickly"
full_description = "The keywords we used were the $h, to refer to header column, $once to repeat our header and footer once only, $each+ to repeat our body once for each row (but skipping the header row... that's what the '+' is for) and the $0, $1 etc keywords, to refer to the first, and second columns, etc. Let's go through this again, but a little more slowly and taking a little more time to see what's going on. NimbleText is the fastest way to generate HTML tables using data from excel, or any other text. To generate tables with HTML, all you need is a suitable pattern, and here's a few sample patterns to get you started! The pattern is pretty obvious: there's a header section that repeats for each column, and then a series of rows, with each column inside a <td> tag. And this is the kind of repetitive text generation that NimbleText eats for breakfast. That's right. NimbleText springs awake in the morning, looks around for a healthy bit of text manipulation and rubs its belly with glee. Now hang on a minute. That's all very good, but there's not much use creating a table unless we have some tabular data to stick inside it. Say we want to turn the following data into a nice looking HTML table: ...but you could just as well have Tab Separated Data, or any other kind of data. (Generating HTML tables from Excel data is very easy, for example) The first part and the last part are only produced once, so we put the command $once at the start of those sections. This is a handy thing to know. The middle part - where our rows of data are showm - is repeated for every row of our data, so we put a $each command before it. In fact, we did something slightly trickier. Because we wanted to repeat for each row apart from the header we used the special purpose $each+ (pronounced 'dollar each PLUS') command. This just means 'repeat for every row, but **skip the header row please**, me old mate NimbleText'. In the header part of the table, where we want to say the name of each column, we used the $h command, where:"
