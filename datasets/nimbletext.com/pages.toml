["https://nimbletext.com/Help/Where"]
title = "NimbleText - The 'Where' Clause"
full_description = '''Where clauses are used to filter your input, so that your pattern is only applied to the rows you choose. Where clauses are only enabled once you purchase a NimbleText license (compare versions). You can turn this feature on using the 'Show where clause' checkbox in the toolbar; it is also available from the Tools menu. The where clause is a piece of javascript, which is evaluated once for each row of your input data. If it returns true then that row is passed on, and the row is passed on to the pattern. If it returns false, then that row is ignored, and does not affect your output. Note that you don't wrap the where clause in "<% %>" bee-stings, as you do with embedded javascript in patterns. All of these examples use this input data, concerning the Beatles, and assume the pattern is simply $row To only process rows where the fourth column is a number, use the 'is not a number' function, like so: To find rows where the first field has some leading or trailing space, use the trim function. (For this to work you need to turn off the option to trim each field) You can also get general help, help on all the symbols and keywords, or on the built-in functions, filtering with a where clause, help with the powerful command-line automation, or applying custom formats to your dates and times. If you haven't downloaded NimbleText yet, then for added power, privacy and versatility I sincerely think you should download it now.'''
