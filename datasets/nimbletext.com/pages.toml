["https://nimbletext.com/Help/DateFormat"]
title = 'Format Dates with the "format" function - Date Format Help while processing text with NimbleText'
full_description = "Note: while the format function converts a Date into a string, the reverse is also possible! Use the toDate function to turn any string into a date. There are also some named masks that you can use. These are not currently configurable. If you'd like to be able to edit the defined masks used by these masks, it can be included in a future version of NimbleText. You need only ask. This functionality is provided by Steven Levithan's excellent Date-time format library. The main underlying difference is that in NimbleText capital 'M' is used for month, while lower-case 'm' for minutes (instead of the opposite); this is done for consistency with C# (and dotnet in general) where myself and many of my customers are most familiar. The documentation above is based on the original JavaScript Date Format Documentation from Steven Levithan with some changes, so errors are all mine. Steven is also the author of the cross-browser split function which is used by NimbleText. He co-authored O'Reilly's Regular Expressions Cookbook (now in its second edition) so I think you should go and buy that. Note that internationalization can also be achieved (though I don't have any special feature to make this smoother, yet) As described by Steven Levithan here, you can specify the substrings used for parts of dates, like so: You can also get general help, help on all the symbols and keywords, or on the built-in functions, filtering with a where clause, help with the powerful command-line automation, or applying custom formats to your dates and times. If you haven't downloaded NimbleText yet, then for added power, privacy and versatility I sincerely think you should download it now."
