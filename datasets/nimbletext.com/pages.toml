["https://nimbletext.com/SET/Commandline"]
title = "Command-Line Automation - NimbleSET"
full_description = "First I'll give you the quick guide, then show you the built in command-line helper for NimbleSET which makes this all too easy. And finish off with the complete command-line reference which describes every possible commandline argument (aka parameter) and option (aka flag) as well as their abbreviations. The most common use case for the command-line is that you want to send in a left and right file, specify an operation, and write the output to a file. Here's how you do that: Here we've specified a left file (using the abbreviation '-l'), a right file (using the abbreviation '-r'), the intersect operation, which selects only those rows which are in both the left and the right files, and an output file (-o). There are three different ways you can receive the output. If you use the 'gui' flag, then the user interface will be shown, and you can access the result there. You can specify an output file, and the result will be written there, using the 'outputfile' argument. If you don't specify the outputfile argument, or the gui flag, then the output is written to standard out. Even though NimbleSET and the command-line are good friends, NimbleSET is not a console application, it is a Windows application. (If it was a console app, you'd see a command prompt everytime you run the exe). And because NimbleSET is not a console application, you cannot using a redirect operator (>) to direct the output directly into a file. To send its output to a file, you need to use the --outputfile (-o) argument, and specify a filename. Under the tools menu you'll find the Command-Line Helper. This is a handy built-in tool to make command-line automation dead simple. Just pick the options you want and, as you do, a sample of the required command-line is provided at the foot of the form. You can also press 'execute' to try it out immediately. (A command prompt will open up, and run the command-line you've built up.)"
