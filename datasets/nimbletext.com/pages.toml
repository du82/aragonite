full_description = '''Assuming you have some data already, perhaps as raw text, generating a SQL insert statement should be trivial, but it can end up being a lot of grunt work. This is exactly the kind of situation where NimbleText shines. It feels great ridding yourself of this kind of grunt work, just watch! And if you get lost for a moment don't worry. Just drink it in, let it wash over you. It'll click soon enough. In NimbleText, we paste our data into the first textbox (the data textbox). Then we create a pattern like this: NimbleText is free, by the way. You can use it online, or even better, you can download it and use it even when you're offline. You can copy this out, being careful to avoid the first row (it contains the headers) and now you have your insert statements. Job done. In SQL Server 2008 onward there is a more compact syntax for inserts: we can include multiple rows in a single statement, like this: We refine our pattern to only say 'insert' once, and then to wrap our data in braces and quotes, like this: The '$each' token means 'Repeat the following bit for each row of our raw data. More specifically, the '$each+' (each PLUS) token means "skip the header row, and then repeat this pattern for each data row. Unfortunately, our SQL is not completely valid as long as it has that comma at the end. To get rid of it, we need to use a common little NimbleText trick. Instead of leaving that trailing comma in our pattern, we need to replace it with a snippet that means 'only output a comma if we're not on the last row of data', here's the snippet: And there we have it, a custom insert generator, and all the wisdom you need to tailor your own custom insert generators. You can also get general help, help on all the symbols and keywords, or on the built-in functions, filtering with a where clause, help with the powerful command-line automation, or applying custom formats to your dates and times. If you haven't downloaded NimbleText yet, then for added power