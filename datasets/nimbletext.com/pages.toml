["https://nimbletext.com/Help/Privacy"]
title = "Privacy"
full_description = '''You should be aware that when you use the free online version of NimbleText (at https://NimbleText.com/Live) you have less privacy than when using the downloaded Desktop version. In order to better understand how NimbleText is used I occasionally store and review the patterns and delimiters that people enter into the free online version. I never sample the data (the first textarea) or the output (the last textarea) because the risk that they contain confidential personal information or privileged business information is much higher. I do *not* need the stress ;-) I try to anonymize the patterns so that I don't know who is creating it (for example, I never store the IP address of the person who created the pattern). Despite this, I have seen situations where the patterns contain information that could easily be traced back to a particular business. I've set up the sampling system to automatically delete samples that are more than 90 days old. I do not sell the information I collect. It's *only* purpose is to try and give our developer (i.e. me, Leon) a better understanding of how NimbleText is used in the famous "real world". For example, by looking at the patterns that people create, I've realised that people are often generating batches of file operations (in a variety of operating systems) and often generating Json. These are two usages that were not previously described in any of the online help, but will be in future. I've also gained an insight into the kind of mistakes that users typically make when creating patterns. I see that 'off by one' errors in selecting columns are common, as are bugs around situations when people do or do not need to wrap the output in single or double quotes. I might add features to the desktop version to help these scenarios. Also, I've seen, again and again, that the simplest patterns are the best. If you are at all uncomfortable with your patterns being seen by others then I strongly suggest you stop using NimbleText online and instead use the downloadable desktop version.'''
year_published = 2025
