["https://nimbletext.com/info/privacy"]
title = "Privacy - NimbleText.com"
full_description = '''NimbleThing Pty Ltd ("us", "we", or "our") operates https://NimbleText.com (the "Site"). This page informs you of our policies regarding the collection, use and disclosure of Personal Information we receive from users of the Site. We use your Personal Information only for providing and improving the Site. By using the Site, you agree to the collection and use of information in accordance with this policy. While using our Site, we may ask you to provide us with certain personally identifiable information that can be used to contact or identify you. Personally identifiable information may include, but is not limited to your name ("Personal Information"). Like many site operators, we collect information that your browser sends whenever you visit our Site ("Log Data"). This Log Data may include information such as your computer's Internet Protocol ("IP") address, browser type, browser version, the pages of our Site that you visit, the time and date of your visit, the time spent on those pages and other statistics. In addition, we use Google Analytics to collect, monitor and analyze traffic to the Site. Please refer to Googles terms of service for further details: https://policies.google.com/privacy?hl=en-US We may use your Personal Information to contact you with newsletters, educational sequences of email, marketing or promotional materials and other information related to the Site. Some emails are transactional in nature and do not include unsubscribe instructions. For example, if you purchase a license, you will receive a confirmation of license details via email: this email is transactional and does not include an unsubscribe link. Similarly, password reset or security emails are examples of transactional emails. All non-transactional emails from the Site will include a link you can use to unsubscribe from further emails. Additionally, you can contact us to request that you be removed from any future communication. Cookies are files with small amount of data, which may include an anonymous unique identifier. Cookies are sent to your browser from a web site and stored on your computer's hard drive. Like many sites, we use "cookies" to collect information. You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent. However, if you do not accept cookies, you may not be able to use some portions of our Site.'''
