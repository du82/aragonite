["https://nimbletext.com/Version/Notes"]
title = "NimbleText: Release Notes"
full_description = '''NimbleText now has considerably better support for high DPI (and for mixed DPI too). This version has been tested at higher DPI than ever before. (This is code for: I've got a new computer and nimbletext didn't look right on it.) High and Mixed DPI support have their challenges. Most of the desktop software I encounter has some problems rendering correctly in at least one of the DPI configurations available from the hardware. We hope it's greatly improved in this release but there will always be more or new work to do on it. We do appreciate detailed reports: with screenshots and monitor sizes etc, of any bugs that are encountered -- to support@nimbletext.com. There were so many that it would fill the full height of the screen on most people's computers. See the image at right ⇒ Now we've grouped the functions into categories, instead of one big list. The "date/time" related functions are under one menu item, the "casing/capitalization functions" are under another. The groups are: You can mark any function you like as a "favorite" â­ and then it will also appear in the root of the "Functions" menu, at the top (not only under its category). As usual we've added new functions, but quite a lot more than usual, now that we're no longer space constrained. In fact, we've added so many that we haven't had time to document them all. Thanks to the grouping explained above, we're no longer space-constrained, and can add (or reveal) more in-built functions. Any remaining capitalization styles from this blog post: Think you're clever? Can you name each of these CASING styles? ...are now available as functions. Really powerfull date parsing functions at last! There are now a complete round-tripping set of string-to-date and date-to-string power. The user experience (including the Look/Style) of "Filter" (previously called 'Where') has been improved. A new "Filter" menu is available on the main menu -- jam packed with examples of useful Filter functions you can use. These are 'predicates' with examples such as:'''
