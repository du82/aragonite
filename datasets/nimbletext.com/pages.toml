["https://nimbletext.com/home/about"]
title = "NimbleText: About"
full_description = '''I steadily improved NimbleText for five years before releasing it as a product. It was originally called 'The World's Simplest Code Generator.' and released through my blog (secretGeek.net) NimbleText includes two libraries from Steven Levithan. The excellent Date-time format library and the cross-browser split function. Steven co-authored O'Reilly's Regular Expressions Cookbook (now in its second edition) so I think you should go and buy that. The 'nimble' icon was created using Paint.net and Sib Icon Editor. The 'report a bug' and 'make a suggestion' icons in NimbleText are from the famous Silk Icons set. The remainder of the icons are from Microsoft's Visual Studio icon set, or are original creations. Some design decisions were made easier by looking at LinqPad. When in doubt, it is great to ask yourself "what would Joe Albahari do?" Image of frustrated businessman by Zach Klein, Creative Commons 2.0. Happy monkey by Chris Lott, some rights reserved. Computer monkeys by Chris Lott, some rights reserved, Helpful headset hero from the Dutch Central Government is available under the Creative Commons CC0 1.0 Universal Public Domain Dedication.'''
