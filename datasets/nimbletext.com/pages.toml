full_description = '''You can purchase a license to unlock extra features. But it is still useful when it is not licensed. The license just makes it extra functional. You can use it online, free at NimbleText Live. No download is required, howver, NimbleText Live has fewer features than the downloadable desktop edition. Here are 31 examples of Text Manipulation that you can perform right now, in the online interactive tool. From adding prefixes or suffixes to every line, cHanGiNg the CASE of text, removing “smart quotes” and symbols©®™, to counting words, summarising text, and generating code in any language: see practical examples. If you purchase an upgrade (under $20 for a regular user) you unlock the professional features and NimbleText takes you to the next level. The upgrade gives you filters ('where' clauses) so you can be more selective about your text manipulation. It also allows you to fully automate NimbleText from the command-line, and provides many other benefits that turn it into a more versatile part of your data-crunching toolkit. Scott Hanselman is a software developer who knows a thing or two about great tools. He's downloaded and used pretty much every piece of software on the internet and Scott's giant list of tools (at hanselman.com/tools ) is widely read and used by developers everywhere. What does he think of NimbleText? Scott rates NimbleText as one of his "BIG TEN LIFE AND WORK-CHANGING UTILITIES" NimbleText – Regular Expressions are hard and I'm not very smart. NimbleText lets me do crazy stuff with large amounts of text without it hurting so much. —Scott Hanselman Did someone mention regular expressions? Regular Expressions are hard. NimbleText is secretly powered by regular expressions, but YOU DON'T NEED TO KNOW THAT. You don't have to know a single thing about regular expressions to be an expert at using NimbleText. Let me give you a metaphor. You can sit on a fine timber chair without being an expert carpenter. Similarly you can get the benefits and power of regular expressions without actually writing them yourself. This is called the Zen of NimbleText.'''
