["https://nimbletext.com/Help/CommandLine"]
title = "NimbleText - Command-Line Automation for Text and Data Manipulation and Processing"
full_description = '''First I'll give you the quick guide, then show you the built in command-line helper for NimbleText which makes this all too easy. Then provide the complete command-line reference which describes every possible commandline argument (aka parameter) and option (aka flag) as well as their abbreviations. And finally, quite a lot of tips for powershell users. Quick tip: You can use \r,\n and \t to represent carriage return (character 13), line feed (character 10) and the infamous tab (character 11) respectively. The most common use case for the command-line is that you want to send in a data file, specify a pattern, and write the output to a file. Here's how you do that: Here we've specified an inputdatafile (using the abbreviation '-i'), a pattern argument (using '-p') and an outputfile (-o). There's two ways you can specify the input data: inputdatafile to get input from a file (as shown above), or rawdata to specify raw input directly at the command-line. There are two ways you can specify the pattern: patternfile to get the pattern from a file, or pattern to specify the pattern directly at the command-line (as shown above) There are three different ways you can receive the output. If you use the 'gui' flag, then the user interface will be shown, and you can access the result there. You can specify an output file, and the result will be written there, using the 'outputfile' argument. If you don't specify the outputfile argument, or the gui flag, then the output is written to standard out. Even though NimbleText and the command-line are good friends, NimbleText is not a console application, it is a Windows application. (If it was a console app, you'd see a command prompt flash into existence, momentarily, every time you run the exe). And because NimbleText is not a console application, you cannot use a redirect operator (>) to direct the output directly into a file. To send its output to a file, you need to use the --outputfile (-o) argument, and specify a filename. Under the tools menu you'll find the Command-Line Helper. This is a handy built-in tool to make command-line automation dead simple.'''
