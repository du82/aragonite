["https://nimbletext.com/Help/Keywords"]
title = "NimbleText - Symbols and Keywords"
full_description = '''The symbol '$0' is replaced by the value of the first field, the symbol '$1' is replaced by the value of the second field, and so on. The symbol '$h0' is replaced by the value of the first field in the header row, the symbol '$h1' is replaced by the value of the second field in the header row, and so on. In practice $h is often combined with the $EACH+ symbol , so that you can process each row but skip the first row, and refer back to the first row from the row you are outputting. The symbol '$-1' is replaced by the value of the last field, the symbol '$-2' is replaced by the value of the second last field, and so on. The 'minus' symbol means, 'start counting columns from the right, rather than from the left.' The keyword '$rowNum' is replaced by the current row number (with the first row being '0', as nerds like to count from zero) Any text that is after a '$ONCE' keyword will only be output once, regardless of how many rows there are. This applies to the text after a '$ONCE' keyword, but only until a subsequent '$EACH' keyword is found (or the end of the pattern is reached). '$ONCE' is useful for adding a header or a footer to your output. For real power, use it with an '$EACH' keyword (described next) Any text that is after a '$EACH' keyword will be output once for each row. This applies to the text after the '$EACH' keyword, but only until a subsequent '$ONCE' keyword is found (or the end of the pattern is reached). You can interleave as many '$ONCE' and '$EACH' sections as you want. They work together to create wonderful things. So we used the once, each, once pattern to create a simple report with header, repeating-body and footer. '$EACH+' is pronounced 'dollar each plus.' It behaves exactly the same as '$EACH' except that it skips the header row. It exists for the sake of convenience. Because a newline is invisible, there is not much to see in the result above. There is however an undocumented function called unterpret() that will turn new-line characters into the literal text \n and tab characters into the literal text \t'''
year_published = 2025
