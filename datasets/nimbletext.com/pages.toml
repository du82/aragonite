["https://nimbletext.com/help"]
title = "NimbleText - General Help with Text Manipulation and Code Generation"
full_description = '''NimbleText is the world's simplest code generator. It formats your data using the patterns you supply. When I say 'The first box contains your data' I'm talking about any list of text. Perhaps you have a shopping list, or a spreadsheet. Any of these things can be pasted in the 'data' text box. In technical terms the data is 'separated values' meaning there are rows and columns, where each column is indicated by some kind of delimiter (such as a comma) and each new row is indicated by a different kind of delimiter (such as a carriage return). Spreadsheets, such as excel, are a good source of data. If you paste data in from Excel, it is usually separated with 'tab' characters, instead of commas, so it would look like this: Data is abundant, omnipresent. But it doesn't want to stay in neat little columns. It ends up making its way into richer places. It becomes text, and data structures, and wonderful things like HTML and Code. That's where NimbleText helps out. The pattern in this case is '$0 is a color' where "$0" means "Whatever value is in the first column." (When nerds count, we start at zero) red is a color orange is a color yellow is a color green is a color blue is a color indigo is a color violet is a color To do this we can use one of the 'built-in' functions (they are typical functions that you need all the time when manipulating text). We want to capitalize the first word, so we use the function 'To Sentence Case.' Here's our improved function: Red is a color Orange is a color Yellow is a color Green is a color Blue is a color Indigo is a color Violet is a color You can also get general help, help on all the symbols and keywords, or on the built-in functions, filtering with a where clause, help with the powerful command-line automation, or applying custom formats to your dates and times. If you haven't downloaded NimbleText yet, then for added power, privacy and versatility I sincerely think you should download it now.'''
