["https://nimbletext.com/Help/Functions"]
title = "NimbleText - Built-in Functions for Generating Code and Manipulating Text"
full_description = '''You can embed raw javascript in your patterns, by surrounding it with 'bee-stings' (i.e. wrap it in <% and %> ) A lot of people overlook this feature, even when they read about it, so I'll repeat it one more time, and put it in a blockquote and and add emphasis: You rarely need all that power. Most of the time, all you need is a single function call, to a well-chosen function that manipulates text. In the general help there are general examples, and below are examples specific to every "built-in" function. This is part of the "batteries included" aspect of Nimble Text. The functions you want are already loaded into the Functions menu♦, ready to be added to your pattern. Any function that you "favorite" (⭐) will also be listed directly in the "top level" of the functions menu. Commonly seen in internet forums, this casing style is recommended for when you are angry, and wishing to either really get your point across, or to ensure that you alienate the recipient of an email. The built-in function toTitleCase changes your text to Title Case, meaning that each word is capitalized. The built-in function toPascalCase changes your text to PascalCase, meaning that each word is capitalized and then spaces are removed. The built-in function toCamelCase changes your text to camelCase, which is just like PascalCase, but more camel-like. Technically, the difference is that in camelCase the first letter of the first word is lower-case. Thus PascalCase is sometimes called "Upper Camel Case" and this camelCase could be called "lower Camel Case". It is a small difference, but somehow worth an extra function. The built-in function toSentenceCase changes your text to Sentence case, meaning that the first word is capitalized, and all of the other words are left alone. The built-in function toSnakeCase converts words to "snake_case" - i.e. lower case with underscores between words. The built-in function toKebabCase converts words to "kebab-case" - i.e. lower case with hyphens between words.'''
