["https://nimbletext.com/HowTo/GenerateINStatement"]
title = "How to Generate SQL 'IN' Statements"
full_description = '''You have a list, be it a short list or a long list, and you need to turn it into a SQL 'in' statement. We figure we could solve it with a regular expression -- but our mind recoils in horror at the suggestion. So we take the dumb way out and reformat it by hand. I'm telling you now -- there is a simpler solution. NimbleText eats data like this and spits out 'IN' statements for breakfast! It's dollar-zero (meaning, 'the zeroth column'), surrounded by quotes and followed by a comma. That pattern gets repeated for every row in our data. The '$each' token means 'Repeat the following bit for each row of our raw data. And the more specific '$each+' (each PLUS) token means "skip the header row, and then repeat this pattern for each data row. Hmm, we still have our trailing comma. We can get rid of that using this common NimbleText snippet (available from the snippet menu) Now we're going to combine that with a little logic to output the beginning and trailing parentheses. And there we have it, a reusable 'in' statement generator, and all the wisdom you need to build it yourself. As a matter of fact, this pattern is one that you need never type out by hand. It's such a common problem, that this pattern is included in the snippet menu of nimbleText. Under 'snippets' just select "SQL: 'in' statement" and it will put this pattern straight into the pattern box for you: You can also get general help, help on all the symbols and keywords, or on the built-in functions, filtering with a where clause, help with the powerful command-line automation, or applying custom formats to your dates and times. If you haven't downloaded NimbleText yet, then for added power, privacy and versatility I sincerely think you should download it now.'''
year_published = 2025
clearnet = "https://nimbletext.com/HowTo/GenerateINStatement"
