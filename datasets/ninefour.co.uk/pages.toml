full_description = "Ready to chat? Our small websites are great for startups and small businesses, Interested? Call to see how we can help with your project. 020 8133 9428 or use our online quotation tool. Four Oaks is a great example of what we can achieve with smaller scale websites. Cliff and Gill approached Nine Four as they needed a website for Cliff’s taxi company as well as the property they Let. The Taxi business, “Four Oaks Cars” was well established, Cliff had business cards, and was listed on lots of local websites including Yell and Penny Post. The property company had been running for some time but had no online presence or any branding, the obvious solution was to call the company “Four Oaks Accommodation”. During our first meeting we discussed the importance of brand, how it would be beneficial to re-work the logo as well as finer details such as using an email address that matches the domain names, rather than a @ btconnect address. We designed two combination logos marks that work as a group and individually, a colour pallet was also chosen that compliments the rural setting and draws on the previous colours. We can’t thank you enough for the work you have put into both our sites. The new logos are great and we are using these on our business cards and letterheads. All of our websites are designed and built to work on a range of devices. Many modern search engines, such as Google now rank mobile website first, so if your website is not responsive you could be loosing business to your customers. It’s vital your website looks professional and uses modern techniques, this gives potential customers complete confidence to get in touch. Award winning website design and development agency in Newbury, Hungerford, Thatcham. 2 Old Bath Rd Newbury, Berkshire, RG14 1QL United Kingdom Studio: 01635 896124 Office: 020 8133 9428 [email protected] © 2005 - 2025 All rights reserved Nine Four Ltd. Registered in England and Wales - No. 9394378. Privacy Policy, Cookie 