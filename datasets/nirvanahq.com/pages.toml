//nirvanahq.com/, and includes all subdomains, present and future. These subdomains include but are not limited to https://focus.nirvanahq.com/, which is where you can access your Account and use the Service on the Web. There will be additional definitions made throughout these TOU, but you’ll be able to recognize them as they will be capitalized, bolded, and in quotation marks. Additional definitions may also be found in the Privacy Policy, and will have the same meaning in these TOU as they do there.By visiting the Website, using the Service on the Website, and / or installing, using or accessing the Application on your Device, you hereby accept to be bound by these TOU or EULA without qualification. In English, that means you agree to these TOU as if they were a contract, no matter how you interact with Nirvana. In fact, the TOU are a contract! If you don’t agree to be bound by this contract between you and Nirvana, don’t use the Service and delete the Application from your Device (if you have downloaded it).These TOU were last modified on September 23, 2024. Nirvana reserves the right, at any time and without prior notice, to modify or replace any portion of the TOU. Any changes to the TOU can be found at this URL. It is your responsibility to check the TOU periodically for changes. Your use of the Service following any changes to the TOU constitutes acceptance of those changes. If there are any significant changes to the TOU that materially affect your relationship with Nirvana, you will be notified upon logging-in to the Service or via email. The TOU should be read in conjunction with the Privacy Policy, as both these documents govern your use of the Website or Application. If you have any questions about these TOU, please contact:Nirvana Legal ServicesNirvanahq, Inc.1981 McGill College AveMontréal, QC H3A 0G6CanadaOr by email legal@nirvanahq.com2. General Code of Conduct for Use of the Website or ServiceBy visiting the Website and / or using the Service, you 