the argument is a Nix string literal, you have to escape the quotes.) --argstr name value This option is like --arg, only the value is not a Nix expression but a string. So instead of --arg system \"i686-linux\" (the outer quotes are to keep the shell happy) you can say --argstr system i686-linux. --attr / -A attrPath Select an attribute from the top-level Nix expression being evaluated. (nix-env, nix-instantiate, nix-build and nix-shell only.) The attribute path attrPath is a sequence of attribute names separated by dots. For instance, given a top-level Nix expression e, the attribute path xorg.xorgserver would cause the expression e.xorg.xorgserver to be used. See nix-env --install for some concrete examples. In addition to attribute names, you can also specify array indices. For instance, the attribute path foo.3.bar selects the bar attribute of the fourth element of the array in the foo attribute of the top-level expression. --expr / -E Interpret the command line arguments as a list of Nix expressions to be parsed and evaluated, rather than as a list of file names of Nix expressions. (nix-instantiate, nix-build and nix-shell only.) For nix-shell, this option is commonly used to give you a shell in which you can build the packages returned by the expression. If you want to get a shell which contain the built packages ready for use, give your expression to the nix-shell --packages convenience flag instead. -I path Add an entry to the Nix expression search path. This option may be given multiple times. Paths added through -I take precedence over NIX_PATH. --option name value Set the Nix configuration option name to value. This overrides settings in the Nix configuration file (see nix.conf5). --repair Fix corrupted or missing store paths by redownloading or rebuilding them. Note that this is slow because it requires computing a cryptographic hash of the contents of every path in the closure of the build. Also note the warning under nix-store --repair-path. Note See man nix.conf for overriding configuration settings with command line flags. Common Environment Variables Most Nix commands interpret the following environment variables: IN_NIX_SHELL Indicator that tells if the current environment was set up by nix-shell. It can have the values pure or impure. NIX_PATH A colon-separated list of directories used to look up the location of Nix expressions using paths enclosed in angle brackets (i.e., <path>), e.g. /home/eelco/Dev:/etc/nixos. It can be extended using the -I option. If NIX_PATH is not set at all, Nix will fall back to the following list in impure and unrestricted evaluation mode: $HOME/.nix-defexpr/channels nixpkgs=/nix/var/nix/profiles/per-user/root/channels/nixpkgs /nix/var/nix/profiles/per-user/root/channels If NIX_PATH is set to an empty string, resolving search paths will always fail. For example, attempting to use <nixpkgs> will produce: error: file 'nixpkgs' was not found in the Nix search path NIX_IGNORE_SYMLINK_STORE Normally, the Nix store directory (typically /nix/store) is not allowed to contain any symlink components. This is to prevent “impure” builds. Builders sometimes “canonicalise” paths by resolving all symlink components. Thus, builds on different machines (with /nix/store resolving to different locations) could yield different results. This is generally not a problem, except when builds are deployed to machines where /nix/store resolves differently. If you are sure that you’re not going to do that, you can set NIX_IGNORE_SYMLINK_STORE to 1. Note that if you’re symlinking the Nix store so that you can put it on another file system than the root file system, on Linux you’re better off using bind mount points, e.g., $ mkdir /nix $ mount -o bind /mnt/otherdisk/nix /nix Consult the mount 8 manual page for details. NIX_STORE_DIR Overrides the location of the Nix store (default prefix/store). NIX_DATA_DIR Overrides the location of the Nix static data directory (default prefix/share). NIX_LOG_DIR Overrides the location of the Nix log directory (default prefix/var/log/nix). NIX_STATE_DIR Overrides the location of the Nix state directory (default prefix/var/nix). NIX_CONF_DIR Overrides the location of the system Nix configuration directory (default prefix/etc/nix). NIX_CONFIG Applies settings from Nix configuration from the environment. The content is treated as if it was read from a Nix configuration file. Settings are separated by the newline character. NIX_USER_CONF_FILES Overrides the location of the Nix user configuration files to load from. The default are the locations according to the XDG Base Directory Specification. See the XDG Base Directories sub-section for details. The variable is treated as a list separated by the : token. TMPDIR Use the specified directory to store temporary files. In particular, this includes temporary build directories; these can take up substantial amounts of disk space. The default is /tmp. NIX_REMOTE This variable should be set to daemon if you want to use the Nix daemon to execute Nix operations. This is necessary in multi-user Nix installations. If the Nix daemon's Unix socket is at some non-standard path, this variable should be set to unix://path/to/socket. Otherwise, it should be left unset. NIX_SHOW_STATS If set to 1, Nix will print some evaluation statistics, such as the number of values allocated. NIX_COUNT_CALLS If set to 1, Nix will print how often functions were called during Nix expression evaluation. This is useful for profiling your Nix expressions. GC_INITIAL_HEAP_SIZE If Nix has been configured to use the Boehm garbage collector, this variable sets the initial size of the heap in bytes. It defaults to 384 MiB. Setting it to a low value reduces memory consumption, but will increase runtime due to the overhead of garbage collection. XDG Base Directories Nix follows the XDG Base Directory Specification. For backwards compatibility, Nix commands will follow the standard only when use-xdg-base-directories is enabled. New Nix commands (experimental) conform to the standard by default. The following environment variables are used to determine locations of various state and configuration files: XDG_CONFIG_HOME (default ~/.config) XDG_STATE_HOME (default ~/.local/state) XDG_CACHE_HOME (default ~/.cache) Files nix-channel operates on the following files. Channels A directory containing symlinks to Nix channels, managed by nix-channel: $XDG_STATE_HOME/nix/profiles/channels for regular users $NIX_STATE_DIR/profiles/per-user/root/channels for root nix-channel uses a profile to store channels. This profile contains symlinks to the contents of those channels. Subscribed channels The list of subscribed channels is stored in ~/.nix-channels $XDG_STATE_HOME/nix/channels if use-xdg-base-directories is set to true in the following format: <url> <name> ... Examples Subscribe to the Nixpkgs channel and run hello from the GNU Hello package: $ nix-channel --add https://nixos.org/channels/nixpkgs-unstable $ nix-channel --list nixpkgs https://n'''
