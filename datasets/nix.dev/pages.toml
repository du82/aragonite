["https://nix.dev/manual/nix/stable/language/builtins.html"]
title = "Built-ins - Nix Reference Manual"
full_description = '''Built-ins This section lists the values and functions built into the Nix language evaluator. All built-ins are available through the global builtins constant. Some built-ins are also exposed directly in the global scope: derivation import abort throw derivation attrs derivation is described in its own section. abort s Abort Nix expression evaluation and print the error message s. add e1 e2 Return the sum of the numbers e1 and e2. addDrvOutputDependencies s Create a copy of the given string where a single constant string context element is turned into a derivation deep string context element. The store path that is the constant string context element should point to a valid derivation, and end in .drv. The original string context element must not be empty or have multiple elements, and it must not have any other type of element other than a constant or derivation deep element. The latter is supported so this function is idempotent. This is the opposite of builtins.unsafeDiscardOutputDependency. all pred list Return true if the function pred returns true for all elements of list, and false otherwise. any pred list Return true if the function pred returns true for at least one element of list, and false otherwise. attrNames set Return the names of the attributes in the set set in an alphabetically sorted list. For instance, builtins.attrNames { y = 1; x = "foo"; } evaluates to [ "x" "y" ]. attrValues set Return the values of the attributes in the set set in the order corresponding to the sorted attribute names. baseNameOf x Return the base name of either a path value x or a string x, depending on which type is passed, and according to the following rules. For a path value, the base name is considered to be the part of the path after the last directory separator, including any file extensions. This is the simple case, as path values don't have trailing slashes. When the argument is a string, a more involved logic applies. If the string ends with a /, only this one final slash is removed. After this, the base name is returned as previously described, assuming / as the directory separator. (Note that evaluation must be platform independent.) This is somewhat similar to the GNU basename command, but GNU basename will strip any number of trailing slashes. bitAnd e1 e2 Return the bitwise AND of the integers e1 and e2. bitOr e1 e2 Return the bitwise OR of the integers e1 and e2. bitXor e1 e2 Return the bitwise XOR of the integers e1 and e2. break v In debug mode (enabled using --debugger), pause Nix expression evaluation and enter the REPL. Otherwise, return the argument v. builtins (set) Contains all the built-in functions and values. Since built-in functions were added over time, testing for attributes in builtins can be used for graceful fallback on older Nix installations: # if hasContext is not available, we assume `s` has a context if builtins ? hasContext then builtins.hasContext s else true catAttrs attr list Collect each attribute named attr from a list of attribute sets. Attrsets that don't contain the named attribute are ignored. For example, builtins.catAttrs "a" [{a = 1;} {b = 0;} {a = 2;}] evaluates to [1 2]. ceil double Converts an IEEE-754 double-precision floating-point number (double) to the next higher integer. If the datatype is neither an integer nor a "float", an evaluation error will be thrown. compareVersions s1 s2 Compare two strings representing versions and return -1 if version s1 is older than version s2, 0 if they are the same, and 1 if s1 is newer than s2. The version comparison algorithm is the same as the one used by nix-env -u. concatLists lists Concatenate a list of lists into a single list. concatMap f list This function is equivalent to builtins.concatLists (map f list) but is more efficient. concatStringsSep separator list Concatenate a list of strings with a separator between each element, e.g. concatStringsSep "/" ["usr" "local" "bin"] == "usr/local/bin". convertHash args Return the specified representation of a hash string, based on the attributes presented in args: hash The hash to be converted. The hash format is detected automatically. hashAlgo The algorithm used to create the hash. Must be one of "md5" "sha1" "sha256" "sha512" The attribute may be omitted when hash is an SRI hash or when the hash is prefixed with the hash algorithm name followed by a colon. That <hashAlgo>:<hashBody> syntax is supported for backwards compatibility with existing tooling. toHashFormat The format of the resulting hash. Must be one of "base16" "nix32" "base32" (deprecated alias for "nix32") "base64" "sri" The result hash is the toHashFormat representation of the hash hash. Example Convert a SHA256 hash in Base16 to SRI: builtins.convertHash { hash = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"; toHashFormat = "sri"; hashAlgo = "sha256"; } "sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=" Example Convert a SHA256 hash in SRI to Base16: builtins.convertHash { hash = "sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU="; toHashFormat = "base16"; } "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" Example Convert a hash in the form <hashAlgo>:<hashBody> in Base16 to SRI: builtins.convertHash { hash = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"; toHashFormat = "sri"; } "sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=" currentSystem (string) The value of the eval-system or else system configuration option. It can be used to set the system attribute for builtins.derivation such that the resulting derivation can be built on the same system that evaluates the Nix expression: builtins.derivation { # ... system = builtins.currentSystem; } It can be overridden in order to create derivations for different system than the current one: $ nix-instantiate --system "mips64-linux" --eval --expr 'builtins.currentSystem' "mips64-linux" Note Not available in pure evaluation mode. currentTime (integer) Return the Unix time at first evaluation. Repeated references to that name will re-use the initially obtained value. Example: $ nix repl Welcome to Nix 2.15.1 Type :? for help. nix-repl> builtins.currentTime 1683705525 nix-repl> builtins.currentTime 1683705525 The store path of a derivation depending on currentTime will differ for each evaluation, unless both evaluate builtins.currentTime in the same second. Note Not available in pure evaluation mode. deepSeq e1 e2 This is like seq e1 e2, except that e1 is evaluated deeply: if it’s a list or set, its elements or attributes are also evaluated recursively. dirOf s Return the directory part of the string s, that is, everything before the final slash in the string. This is similar to the GNU dirname command. div e1 e2 Return the quotient of the numbers e1 and e2. elem x xs Return true if a value equal to x occurs in the list xs, and false otherwise. elemAt xs n Return element n from the list xs. Elements are counted starting from 0. A fatal error occurs if the index is out of bounds. false (Boolean) Primitive value. It can be returned by comparison operators and used in conditional expressions. The name false is not special, and can be shadowed: nix-repl> let false = 1; in false 1 fetchClosure args Note This function is only available if the fetch-closure experimental feature is enabled. For example, include the following in nix.conf: extra-experimental-features = fetch-closure Fetch a store path closure from a binary cache, and return the store path as a string with context. This function can be invoked in three ways, that we will discuss in order of preference. Fetch a content-addressed store path Example: builtins.fetchClosure { fromStore = "https://cache.nixos.org"; fromPath = /nix/store/ldbhlwhh39wha58rm61bkiiwm6j7211j-git-2.33.1; } This is the simplest invocation, and it does not require the user of the expression to configure trusted-public-keys to ensure their authenticity. If your store path is input addressed instead of content addressed, consider the other two invocations. Fetch any store path and rewrite it to a fully content-addressed store path Example: builtins.fetchClosure { fromStore = "https://cache.nixos.org"; fromPath = /nix/store/r2jd6ygnmirm2g803mksqqjm4y39yi6i-git-2.33.1; toPath = /nix/store/ldbhlwhh39wha58rm61bkiiwm6j7211j-git-2.33.1; } This example fetches /nix/store/r2jd... from the specified binary cache, and rewrites it into the content-addressed store path /nix/store/ldbh.... Like the previous example, no extra configuration or privileges are required. To find out the correct value for toPath given a fromPath, use nix store make-content-addressed: # nix store make-content-addressed --from https://cache.nixos.org /nix/store/r2jd6ygnmirm2g803mksqqjm4y39yi6i-git-2.33.1 rewrote '/nix/store/r2jd6ygnmirm2g803mksqqjm4y39yi6i-git-2.33.1' to '/nix/store/ldbhlwhh39wha58rm61bkiiwm6j7211j-git-2.33.1' Alternatively, set toPath = "" and find the correct toPath in the error message. Fetch an input-addressed store path as is Example: builtins.fetchClosure { fromStore = "https://cache.nixos.org"; fromPath = /nix/store/r2jd6ygnmirm2g803mksqqjm4y39yi6i-git-2.33.1; inputAddressed = true; } It is possible to fetch an input-addressed store path and return it as is. However, this is the least preferred way of invoking fetchClosure, because it requires that the input-addressed paths are trusted by the Nix configuration. builtins.storePath fetchClosure is similar to builtins.storePath in that it allows you to use a previously built store path in a Nix expression. However, fetchClosure is more reproducible because it specifies a binary cache from which the path can be fetched. Also, using content-addressed store paths does not require users to configure trusted-public-keys to ensure their authenticity. fetchGit args Fetch a path from git. args can be a URL, in which case the HEAD of the repo at that URL is fetched. Otherwise, it can be an attribute with the following attributes (all except url optional): url The URL of the repo. name (default: source) The name of the directory the repo should be exported to in the store. rev (default: the tip of ref) The Git revision to fetch. This is typically a commit hash. ref (default: HEAD) The Git reference under which to look for the requested revision. This is often a branch or tag name. This option has no effect once shallow cloning is enabled. By default, the ref value is prefixed with refs/heads/. As of 2.3.0, Nix will not prefix refs/heads/ if ref starts with refs/. submodules (default: false) A Boolean parameter that specifies whether submodules should be checked out. exportIgnore (default: true) A Boolean parameter that specifies whether export-ignore from .gitattributes should be applied. This approximates part of the git archive behavior. Enabling this option is not recommended because it is unknown whether the Git developers commit to the reproducibility of export-ignore in newer Git versions. shallow (default: false) Make a shallow clone when fetching the Git tree. When this is enabled, the options ref and allRefs have no effect anymore. allRefs Whether to fetch all references (eg. branches and tags) of the repository. With this argument being true, it's possible to load a rev from any ref. (by default only revs from the specified ref are supported). This option has no effect once shallow cloning is enabled. verifyCommit (default: true if publicKey or publicKeys are provided, otherwise false) Whether to check rev for a signature matching publicKey or publicKeys. If verifyCommit is enabled, then fetchGit cannot use a local repository with uncommitted changes. Requires the verified-fetches experimental feature. publicKey The public key against which rev is verified if verifyCommit is enabled. Requires the verified-fetches experimental feature. keytype (default: "ssh-ed25519") The key type of publicKey. Possible values: "ssh-dsa" "ssh-ecdsa" "ssh-ecdsa-sk" "ssh-ed25519" "ssh-ed25519-sk" "ssh-rsa" Requires the verified-fetches experimental feature. publicKeys The public keys against which rev is verified if verifyCommit is enabled. Must be given as a list of attribute sets with the following form: { key = "<public key>"; type = "<key type>"; # optional, default: "ssh-ed25519" } Requires the verified-fetches experimental feature. Here are some examples of how to use fetchGit. To fetch a private repository over SSH: builtins.fetchGit { url = "git@github.com:my-secret/repository.git"; ref = "master"; rev = "adab8b916a45068c044658c4158d81878f9ed1c3"; } To fetch an arbitrary reference: builtins.fetchGit { url = "https://github.com/NixOS/nix.git"; ref = "refs/heads/0.5-release"; } If the revision you're looking for is in the default branch of the git repository you don't strictly need to specify the branch name in the ref attribute. However, if the revision you're looking for is in a future branch for the non-default branch you will need to specify the the ref attribute as well. builtins.fetchGit { url = "https://github.com/nixos/nix.git"; rev = "841fcbd04755c7a2865c51c1e2d3b045976b7452"; ref = "1.11-maintenance"; } Note It is nice to always specify the branch which a revision belongs to. Without the branch being specified, the fetcher might fail if the default branch changes. Additionally, it can be confusing to try a commit from a non-default branch and see the fetch fail. If the branch is specified the fault is much more obvious. If the revision you're looking for is in the default branch of the git repository you may omit the ref attribute. builtins.fetchGit { url = "https://github.com/nixos/nix.git"; rev = "841fcbd04755c7a2865c51c1e2d3b045976b7452"; } To fetch a specific tag: builtins.fetchGit { url = "https://github.com/nixos/nix.git"; ref = "refs/tags/1.9"; } To fetch the latest version of a remote branch: builtins.fetchGit { url = "ssh://git@github.com/nixos/nix.git"; ref = "master"; } To verify the commit signature: builtins.fetchGit { url = "ssh://git@github.com/nixos/nix.git"; verifyCommit = true; publicKeys = [ { type = "ssh-ed25519"; key = "AAAAC3NzaC1lZDI1NTE5AAAAIArPKULJOid8eS6XETwUjO48/HKBWl7FTCK0Z//fplDi"; } ]; } Nix will refetch the branch according to the tarball-ttl setting. This behavior is disabled in pure evaluation mode. To fetch the content of a checked-out work directory: builtins.fetchGit ./work-dir If the URL points to a local directory, and no ref or rev is given, fetchGit will use the current content of the checked-out files, even if they are not committed or added to Git's index. It will only consider files added to the Git repository, as listed by git ls-files. fetchTarball args Download the specified URL, unpack it and return the path of the unpacked tree. The file must be a tape archive (.tar) compressed with gzip, bzip2 or xz. If the tarball consists of a single directory, then the top-level path component of the files in the tarball is removed. The typical use of the function is to obtain external Nix expression dependenc'''
