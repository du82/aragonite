["https://nix.dev/tutorials/module-system/deep-dive"]
title = "2. Module system deep dive — nix.dev  documentation"
full_description = '''2. Module system deep dive# Or: Wrapping the world in modules In this tutorial you will follow an extensive demonstration of how to wrap an existing API with Nix modules. 2.1. Overview# This tutorial follows @infinisil’s presentation on modules (source) for participants of Summer of Nix 2021. It may help playing it alongside this tutorial to better keep track of changes to the code you will work on. 2.1.1. What will you learn?# You’ll write modules to interact with the Google Maps API, declaring module options which represent map geometry, location pins, and more. During the tutorial, you will first write some incorrect configurations, creating opportunities to discuss the resulting error messages and how to resolve them, particularly when discussing type checking. 2.1.2. What do you need?# You will use two helper scripts for this exercise. Download map.sh and geocode.sh to your working directory. Warning To run the examples in this tutorial, you will need a Google API key in $XDG_DATA_HOME/google-api/key. 2.2. The empty module# Write the following into a file called default.nix: default.nix# { ... }: { } 2.3. Declaring options# We will need some helper functions, which will come from the Nixpkgs library, which is passed by the module system as lib: default.nix# - { ... }: + { lib, ... }: { } Using lib.mkOption, declare the scripts.output option to have the type lines: default.nix# { lib, ... }: { + options = { + scripts.output = lib.mkOption { + type = lib.types.lines; + }; + }; } The lines type means that the only valid values are strings, and that multiple definitions should be joined with newlines. Note The name and attribute path of the option is arbitrary. Here we use scripts, because we will add another script later, and call this one output, because it will output the resulting map. 2.4. Evaluating modules# Write a new file eval.nix to call lib.evalModules and evaluate the module in default.nix: eval.nix# let nixpkgs = fetchTarball "https://github.com/NixOS/nixpkgs/tarball/nixos-23.11"; pkgs = import nixpkgs { config = {}; overlays = []; }; in pkgs.lib.evalModules { modules = [ ./default.nix ]; } Run the following command: Warning This will result in an error. nix-instantiate --eval eval.nix -A config.scripts.output Detailed explanation nix-instantiate --eval parses and evaluates the Nix file at the specified path, and prints the result. evalModules produces an attribute set where the final configuration values appear in the config attribute. Therefore we evaluate the Nix expression in eval.nix at the attribute path config.scripts.output. The error message indicates that the scripts.output option is used but not defined: a value must be set for the option before accessing it. You will do this in the next steps. 2.5. Type checking# As previously mentioned, the lines type only permits string values. Warning In this section, you will set an invalid value and encounter a type error. What happens if you instead try to assign an integer to the option? Add the following lines to default.nix: default.nix# { lib, ... }: { options = { scripts.output = lib.mkOption { type = lib.types.lines; }; }; + config = { + scripts.output = 42; + }; } Now try to execute the previous command, and witness your first module error: $ nix-instantiate --eval eval.nix -A config.scripts.output error: ... error: A definition for option `scripts.output' is not of type `strings concatenated with "\n"'. Definition values: - In `/home/nix-user/default.nix': 42 The definition scripts.output = 42; caused a type error: integers are not strings concatenated with the newline character. To make this module pass the type checks and successfully evaluate the scripts.output option, you will now assign a string to scripts.output. In this case, you will assign a shell command that runs the map script in the current directory. That in turn calls the Google Maps Static API to generate a world map. The output is passed on to display it with feh, a minimalistic image viewer. Update default.nix by changing the value of scripts.output to the following string: default.nix# config = { - scripts.output = 42; + scripts.output = '' + ./map.sh size=640x640 scale=2 | feh - + ''; }; 2.6. Interlude: reproducible scripts# That simple command will likely not work as intended on your system, as it may lack the required dependencies (curl and feh). We can solve this by packaging the raw map script with pkgs.writeShellApplication. First, make available a pkgs argument in your module evaluation by adding a module that sets config._module.args: eval.nix# pkgs.lib.evalModules { modules = [ + ({ config, ... }: { config._module.args = { inherit pkgs; }; }) ./default.nix ]; } Note This mechanism is currently only documented in the module system code, and that documentation is incomplete and out of date. Then change default.nix to have the following contents: default.nix# { pkgs, lib, ... }: { options = { scripts.output = lib.mkOption { type = lib.types.package; }; }; config = { scripts.output = pkgs.writeShellApplication { name = "map"; runtimeInputs = with pkgs; [ curl feh ]; text = '' ${./map.sh} size=640x640 scale=2 | feh - ''; }; }; } This will access the previously added pkgs argument so we can use dependencies, and copy the map file in the current directory into the Nix store so it’s available to the wrapped script, which will also live in the Nix store. Run the script with: nix-build eval.nix -A config.scripts.output ./result/bin/map To iterate more quickly, open a new terminal and set up entr to re-run the script whenever any source file in the current directory changes: nix-shell -p entr findutils bash --run \ "ls *.nix | \ entr -rs ' \ nix-build eval.nix -A config.scripts.output --no-out-link \ | xargs printf -- \"%s/bin/map\" \ | xargs bash \ ' \ " This command does the following: List all .nix files Make entr watch them for changes. Terminate the invoked command on each change with -r. On each change: Run the nix-build invocation as above, but without adding a ./result symlink Take the resulting store path and append /bin/map to it Run the executable at the path constructed this way 2.7. Declaring more options# Rather than setting all script parameters directly, we will to do that through the module system. This will not just add some safety through type checking, but also allow to build abstractions to manage growing complexity and changing requirements. Let’s begin by introducing another option, requestParams, which will represent the parameters of the request made to the Google Maps API. Its type will be listOf <elementType>, which is a list of elements of one type. Instead of lines, in this case you will want the type of the list elements to be str, a generic string type. The difference between str and lines is in their merging behavior: Module option types not only check for valid values, but also specify how multiple definitions of an option are to be combined into one. For lines, multiple definitions get merged by concatenation with newlines. For str, multiple definitions are not allowed. This is not a problem here, since one can’t define a list element multiple times. Make the following additions to your default.nix file: default.nix# scripts.output = lib.mkOption { type = lib.types.package; }; + + requestParams = lib.mkOption { + type = lib.types.listOf lib.types.str; + }; }; config = { scripts.output = pkgs.writeShellApplication { name = "map"; runtimeInputs = with pkgs; [ curl feh ]; text = '' ${./map.sh} size=640x640 scale=2 | feh - ''; }; + + requestParams = [ + "size=640x640" + "scale=2" + ]; }; } 2.8. Dependencies between options# A given module generally declares one option that produces a result to be used elsewhere, in this case scripts.output. Options can depend on other options, making it possible to build more useful abstractions. Here, we want the scripts.output option to use the values of requestParams as arguments to the ./map script. 2.8.1. Accessing option values# To make option values available to a module, the arguments of the function declaring the module must include the config attribute. Update default.nix to add the config attribute: default.nix# -{ pkgs, lib, ... }: { +{ pkgs, lib, config, ... }: { When a module that sets options is evaluated, the resulting values can be accessed by their corresponding attribute names under config. Note Option values can’t be accessed directly from the same module. The module system evaluates all modules it receives, and any of them can define a particular option’s value. What happens when an option is set by multiple modules is determined by that option’s type. Warning The config argument is not the same as the config attribute: The config argument holds the result of the module system’s lazy evaluation, which takes into account all modules passed to evalModules and their imports. The config attribute of a module exposes that particular module’s option values to the module system for evaluation. Now make the following changes to default.nix: default.nix# config = { scripts.output = pkgs.writeShellApplication { name = "map"; runtimeInputs = with pkgs; [ curl feh ]; text = '' - ${./map} size=640x640 scale=2 | feh - + ${./map} ${lib.concatStringsSep " " + config.requestParams} | feh - ''; Here, the value of the config.requestParams attribute is populated by the module system based on the definitions in the same file. Note Lazy evaluation in the Nix language allows the module system to make a value available in the config argument passed to the module which defines that value. lib.concatStringsSep " " is then used to join each list element from the value of config.requestParams into a single string, with the list elements of requestParams separated by a space character. The result of this represents the list of command line arguments to pass to the ./map script. 2.9. Conditional definitions# Sometimes, you will want option values to be, well, optional. This can be useful when defining a value for an option is not required, as in the following case. You will define a new option, map.zoom, to control the zoom level of the map. The Google Maps API will infer a zoom level if no corresponding argument is passed, a situation you can represent with the nullOr <type>, which represents values of type <type> or null. This does not automatically mean that when the option isn’t defined, the value of such an option is null – we still need to define a default value. Add the map attribute set with the zoom option into the top-level options declaration, like so: default.nix# requestParams = lib.mkOption { type = lib.types.listOf lib.types.str; }; + + map = { + zoom = lib.mkOption { + type = lib.types.nullOr lib.types.int; + default = null; + }; + }; }; To make use of this, use the mkIf <condition> <definition> function, which only adds the definition if the condition evaluates to true. Make the following additions to the requestParams list in the config block: default.nix# requestParams = [ "size=640x640" "scale=2" + (lib.mkIf (config.map.zoom != null) + "zoom=${toString config.map.zoom}") ]; }; This will only add a zoom parameter to the script invocation if the value of config.map.zoom is not null. 2.10. Default values# Let’s say that in our application we want to have a different default behavior that sets the zoom level to 10, such that automatic zooming has to be enabled explicitly. This can be done with the default argument to mkOption. Its value will be used if the value of the option declaring it is not specified otherwise. Add the corresponding line: default.nix# map = { zoom = lib.mkOption { type = lib.types.nullOr lib.types.int; + default = 10; }; }; }; 2.11. Wrapping shell commands# You have now declared options controlling the map dimensions and zoom level, but have not provided a way to specify where the map should be centered. Add the center option now, possibly with your own location as default value: default.nix# type = lib.types.nullOr lib.types.int; default = 10; }; + + center = lib.mkOption { + type = lib.types.nullOr lib.types.str; + default = "switzerland"; + }; }; }; To implement this behavior, you will use the geocode utility, which turns location names into coordinates. There are multiple ways of making a new package accessible, but as an exercise, you will add it as an option in the module system. First, add a new option to accommodate the package: default.nix# options = { scripts.output = lib.mkOption { type = lib.types.package; }; + + scripts.geocode = lib.mkOption { + type = lib.types.package; + }; Then define the value for that option where you make the raw script reproducible by wrapping a call to it in writeShellApplication: default.nix# config = { + scripts.geocode = pkgs.writeShellApplication { + name = "geocode"; + runtimeInputs = with pkgs; [ curl jq ]; + text = ''exec ${./geocode.sh} "$@"''; + }; + scripts.output = pkgs.writeShellApplication { name = "map"; runtimeInputs = with pkgs; [ curl feh ]; Add another mkIf call to the list of requestParams now where you access the wrapped package through config.scripts.geocode, and run the executable /bin/geocode inside: default.nix# "scale=2" (lib.mkIf (config.map.zoom != null) "zoom=${toString config.map.zoom}") + (lib.mkIf (config.map.center != null) + "center=\"$(${config.scripts.geocode}/bin/geocode ${ + lib.escapeShellArg config.map.center + })\"") ]; }; This time, you’ve used escapeShellArg to pass the config.map.center value as a command-line argument to geocode, string interpolating the result back into the requestParams string which sets the center value. Wrapping shell command execution in Nix modules is a helpful technique for controlling system changes, as it uses the more ergonomic attributes and values interface rather than dealing with the peculiarities of escaping manually. 2.12. Splitting modules# The module schema includes the imports attribute, which allows incorporating further modules, for example to split a large configuration into multiple files. In particular, this allows you to separate option declarations from where they are used in your configuration. Create a new module, marker.nix, where you can declare options for defining location pins and other markers on the map: marker.nix# { lib, config, ... }: { } Reference this new file in default.nix using the imports attribute: default.nix# { pkgs, lib, config, ... }: { + imports = [ + ./marker.nix + ]; + 2.13. The submodule type# We want to set multiple markers on the map. A marker is a complex type with multiple fields. This is where one of the most useful types included in the module system’s type system comes into play: submodule. This type allows you to define nested modules with their own options. Here, you will define a new map.markers option whose type is a list of submodules, each with a nested location type, allowing you to define a list of markers on the map. Each assignment of markers will be type-checked during evaluation of the top-level config. Make the'''
