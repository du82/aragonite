["https://nix.dev/manual/nix/stable/command-ref/conf-file"]
title = "nix.conf - Nix Reference Manual"
full_description = '''Name nix.conf - Nix configuration file Description Nix supports a variety of configuration settings, which are read from configuration files or taken as command line flags. Configuration file By default Nix reads settings from the following places, in that order: The system-wide configuration file sysconfdir/nix/nix.conf (i.e. /etc/nix/nix.conf on most systems), or $NIX_CONF_DIR/nix.conf if NIX_CONF_DIR is set. Values loaded in this file are not forwarded to the Nix daemon. The client assumes that the daemon has already loaded them. If NIX_USER_CONF_FILES is set, then each path separated by : will be loaded in reverse order. Otherwise it will look for nix/nix.conf files in XDG_CONFIG_DIRS and XDG_CONFIG_HOME. If unset, XDG_CONFIG_DIRS defaults to /etc/xdg, and XDG_CONFIG_HOME defaults to $HOME/.config as per XDG Base Directory Specification. If NIX_CONFIG is set, its contents are treated as the contents of a configuration file. File format Configuration files consist of name = value pairs, one per line. Comments start with a # character. Example: keep-outputs = true # Nice for developers keep-derivations = true # Idem Other files can be included with a line like include <path>, where <path> is interpreted relative to the current configuration file. A missing file is an error unless !include is used instead. A configuration setting usually overrides any previous value. However, for settings that take a list of items, you can prefix the name of the setting by extra- to append to the previous value. For instance, substituters = a b extra-substituters = c d defines the substituters setting to be a b c d. Unknown option names are not an error, and are simply ignored with a warning. Command line flags Configuration options can be set on the command line, overriding the values set in the configuration file: Every configuration setting has corresponding command line flag (e.g. --max-jobs 16). Boolean settings do not need an argument, and can be explicitly disabled with the no- prefix (e.g. --keep-failed and --no-keep-failed). Unknown option names are invalid flags (unless there is already a flag with that name), and are rejected with an error. The flag --option <name> <value> is interpreted exactly like a <name> = <value> in a setting file. Unknown option names are ignored with a warning. The extra- prefix is supported for settings that take a list of items (e.g. --extra-trusted users alice or --option extra-trusted-users alice). Integer settings Settings that have an integer type support the suffixes K, M, G and T. These cause the specified value to be multiplied by 2^10, 2^20, 2^30 and 2^40, respectively. For instance, --min-free 1M is equivalent to --min-free 1048576. Available settings abort-on-warn If set to true, builtins.warn will throw an error when logging a warning. This will give you a stack trace that leads to the location of the warning. This is useful for finding information about warnings in third-party Nix code when you can not start the interactive debugger, such as when Nix is called from a non-interactive script. See debugger-on-warn. Currently, a stack trace can only be produced when the debugger is enabled, or when evaluation is aborted. This option can be enabled by setting NIX_ABORT_ON_WARN=1 in the environment. Default: false accept-flake-config Warning This setting is part of an experimental feature. To change this setting, make sure the flakes experimental feature is enabled. For example, include the following in nix.conf: extra-experimental-features = flakes accept-flake-config = ... Whether to accept nix configuration from a flake without prompting. Default: false access-tokens Access tokens used to access protected GitHub, GitLab, or other locations requiring token-based authentication. Access tokens are specified as a string made up of space-separated host=token values. The specific token used is selected by matching the host portion against the "host" specification of the input. The actual use of the token value is determined by the type of resource being accessed: Github: the token value is the OAUTH-TOKEN string obtained as the Personal Access Token from the Github server (see https://docs.github.com/en/developers/apps/building-oauth-apps/authorizing-oauth-apps). Gitlab: the token value is either the OAuth2 token or the Personal Access Token (these are different types tokens for gitlab, see https://docs.gitlab.com/12.10/ee/api/README.html#authentication). The token value should be type:tokenstring where type is either OAuth2 or PAT to indicate which type of token is being specified. Example ~/.config/nix/nix.conf: access-tokens = github.com=23ac...b289 gitlab.mycompany.com=PAT:A123Bp_Cd..EfG gitlab.com=OAuth2:1jklw3jk Example ~/code/flake.nix: input.foo = { type = "gitlab"; host = "gitlab.mycompany.com"; owner = "mycompany"; repo = "pro"; }; This example specifies three tokens, one each for accessing github.com, gitlab.mycompany.com, and gitlab.com. The input.foo uses the "gitlab" fetcher, which might requires specifying the token type along with the token value. Default: empty allow-dirty Whether to allow dirty Git/Mercurial trees. Default: true allow-import-from-derivation By default, Nix allows Import from Derivation. With this option set to false, Nix will throw an error when evaluating an expression that uses this feature, even when the required store object is readily available. This ensures that evaluation will not require any builds to take place, regardless of the state of the store. Default: true allow-new-privileges (Linux-specific.) By default, builders on Linux cannot acquire new privileges by calling setuid/setgid programs or programs that have file capabilities. For example, programs such as sudo or ping will fail. (Note that in sandbox builds, no such programs are available unless you bind-mount them into the sandbox via the sandbox-paths option.) You can allow the use of such programs by enabling this option. This is impure and usually undesirable, but may be useful in certain scenarios (e.g. to spin up containers or set up userspace network interfaces in tests). Default: false allow-symlinked-store If set to true, Nix will stop complaining if the store directory (typically /nix/store) contains symlink components. This risks making some builds "impure" because builders sometimes "canonicalise" paths by resolving all symlink components. Problems occur if those builds are then deployed to machines where /nix/store resolves to a different location from that of the build machine. You can enable this setting if you are sure you're not going to do that. Default: false allow-unsafe-native-code-during-evaluation Enable built-in functions that allow executing native code. In particular, this adds: builtins.importNative path symbol Opens dynamic shared object (DSO) at path, loads the function with the symbol name symbol from it and runs it. The loaded function must have the following signature: extern "C" typedef void (*ValueInitialiser) (EvalState & state, Value & v); The Nix C++ API documentation has more details on evaluator internals. builtins.exec arguments Execute a program, where arguments are specified as a list of strings, and parse its output as a Nix expression. Default: false allowed-impure-host-deps Which prefixes to allow derivations to ask for access to (primarily for Darwin). Default: empty allowed-uris A list of URI prefixes to which access is allowed in restricted evaluation mode. For example, when set to https://github.com/NixOS, builtin functions such as fetchGit are allowed to access https://github.com/NixOS/patchelf.git. Access is granted when the URI is equal to the prefix, or the URI is a subpath of the prefix, or the prefix is a URI scheme ended by a colon : and the URI has the same scheme. Default: empty allowed-users A list user names, separated by whitespace. These users are allowed to connect to the Nix daemon. You can specify groups by prefixing names with @. For instance, @wheel means all users in the wheel group. Also, you can allow all users by specifying *. Note Trusted users (set in trusted-users) can always connect to the Nix daemon. Default: * always-allow-substitutes If set to true, Nix will ignore the allowSubstitutes attribute in derivations and always attempt to use available substituters. Default: false auto-allocate-uids Warning This setting is part of an experimental feature. To change this setting, make sure the auto-allocate-uids experimental feature is enabled. For example, include the following in nix.conf: extra-experimental-features = auto-allocate-uids auto-allocate-uids = ... Whether to select UIDs for builds automatically, instead of using the users in build-users-group. UIDs are allocated starting at 872415232 (0x34000000) on Linux and 56930 on macOS. Default: false auto-optimise-store If set to true, Nix automatically detects files in the store that have identical contents, and replaces them with hard links to a single copy. This saves disk space. If set to false (the default), you can still run nix-store --optimise to get rid of duplicate files. Default: false bash-prompt The bash prompt (PS1) in nix develop shells. Default: empty bash-prompt-prefix Prefix prepended to the PS1 environment variable in nix develop shells. Default: empty bash-prompt-suffix Suffix appended to the PS1 environment variable in nix develop shells. Default: empty build-dir The directory on the host, in which derivations' temporary build directories are created. If not set, Nix will use the system temporary directory indicated by the TMPDIR environment variable. Note that builds are often performed by the Nix daemon, so its TMPDIR is used, and not that of the Nix command line interface. This is also the location where --keep-failed leaves its files. If Nix runs without sandbox, or if the platform does not support sandboxing with bind mounts (e.g. macOS), then the builder's environment will contain this directory, instead of the virtual location sandbox-build-dir. Default: `` build-hook The path to the helper program that executes remote builds. Nix communicates with the build hook over stdio using a custom protocol to request builds that cannot be performed directly by the Nix daemon. The default value is the internal Nix binary that implements remote building. Important Change this setting only if you really know what you’re doing. Default: empty build-poll-interval How often (in seconds) to poll for locks. Default: 5 build-users-group This options specifies the Unix group containing the Nix build user accounts. In multi-user Nix installations, builds should not be performed by the Nix account since that would allow users to arbitrarily modify the Nix store and database by supplying specially crafted builders; and they cannot be performed by the calling user since that would allow him/her to influence the build result. Therefore, if this option is non-empty and specifies a valid group, builds will be performed under the user accounts that are a member of the group specified here (as listed in /etc/group). Those user accounts should not be used for any other purpose! Nix will never run two builds under the same user account at the same time. This is to prevent an obvious security hole: a malicious user writing a Nix expression that modifies the build result of a legitimate Nix expression being built by another user. Therefore it is good to have as many Nix build user accounts as you can spare. (Remember: uids are cheap.) The build users should have permission to create files in the Nix store, but not delete them. Therefore, /nix/store should be owned by the Nix account, its group should be the group specified here, and its mode should be 1775. If the build users group is empty, builds will be performed under the uid of the Nix process (that is, the uid of the caller if NIX_REMOTE is empty, the uid under which the Nix daemon runs if NIX_REMOTE is daemon). Obviously, this should not be used with a nix daemon accessible to untrusted clients. Defaults to nixbld when running as root, empty otherwise. Default: machine-specific builders A semicolon- or newline-separated list of build machines. In addition to the usual ways of setting configuration options, the value can be read from a file by prefixing its absolute path with @. Example This is the default setting: builders = @/etc/nix/machines Each machine specification consists of the following elements, separated by spaces. Only the first element is required. To leave a field at its default, set it to -. The URI of the remote store in the format ssh://[username@]hostname. Example ssh://nix@mac For backward compatibility, ssh:// may be omitted. The hostname may be an alias defined in ~/.ssh/config. A comma-separated list of Nix system types. If omitted, this defaults to the local platform type. Example aarch64-darwin It is possible for a machine to support multiple platform types. Example i686-linux,x86_64-linux The SSH identity file to be used to log in to the remote machine. If omitted, SSH will use its regular identities. Example /home/user/.ssh/id_mac The maximum number of builds that Nix will execute in parallel on the machine. Typically this should be equal to the number of CPU cores. The “speed factor”, indicating the relative speed of the machine as a positive integer. If there are multiple machines of the right type, Nix will prefer the fastest, taking load into account. A comma-separated list of supported system features. A machine will only be used to build a derivation if all the features in the derivation's requiredSystemFeatures attribute are supported by that machine. A comma-separated list of required system features. A machine will only be used to build a derivation if all of the machine’s required features appear in the derivation’s requiredSystemFeatures attribute. The (base64-encoded) public host key of the remote machine. If omitted, SSH will use its regular known_hosts file. The value for this field can be obtained via base64 -w0. Example Multiple builders specified on the command line: --builders 'ssh://mac x86_64-darwin ; ssh://beastie x86_64-freebsd' Example This specifies several machines that can perform i686-linux builds: nix@scratchy.labs.cs.uu.nl i686-linux /home/nix/.ssh/id_scratchy 8 1 kvm nix@itchy.labs.cs.uu.nl i686-linux /home/nix/.ssh/id_scratchy 8 2 nix@poochie.labs.cs.uu.nl i686-linux /home/nix/.ssh/id_scratchy 1 2 kvm benchmark However, poochie will only build derivations that have the attribute requiredSystemFeatures = [ "benchmark" ]; or requiredSystemFeatures = [ "benchmark" "kvm" ]; itchy cannot do builds that require kvm, but scratchy does support such builds. For regular builds, itchy will be preferred over scratchy because it has a higher speed factor. For Nix to use substituters, the calling user must be in the trusted-users list. Note A build machine must be accessible via SSH and have Nix installed. nix must be available in $PATH for the user connecting over '''
