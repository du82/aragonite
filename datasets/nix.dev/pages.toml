["https://nix.dev/guides/troubleshooting"]
title = "Troubleshooting — nix.dev  documentation"
full_description = '''Troubleshooting# This page is a collection of tips to solve problems you may encounter using Nix. What to do if a binary cache is down or unreachable?# Pass --option substitute false to Nix commands. How to force Nix to re-check if something exists in the binary cache?# Nix keeps track of what’s available in binary caches so it doesn’t have to query them on every command. This includes negative answers, that is, if a given store path cannot be substituted. Pass the --narinfo-cache-negative-ttl option to set the cache timeout in seconds. How to fix: error: querying path in database: database disk image is malformed# This is a known issue. Try: $ sqlite3 /nix/var/nix/db/db.sqlite "pragma integrity_check" Which will print the errors in the database. If the errors are due to missing references, the following may work: $ mv /nix/var/nix/db/db.sqlite /nix/var/nix/db/db.sqlite-bkp $ sqlite3 /nix/var/nix/db/db.sqlite-bkp ".dump" | sqlite3 /nix/var/nix/db/db.sqlite How to fix: error: current Nix store schema is version 10, but I only support 7# This is a known issue. It means that using a new version of Nix upgraded the SQLite schema of the database, and then you tried to use an older version Nix. The solution is to dump the database, and use the old Nix version to re-import the data: $ /path/to/nix/unstable/bin/nix-store --dump-db > /tmp/db.dump $ mv /nix/var/nix/db /nix/var/nix/db.toonew $ mkdir /nix/var/nix/db $ nix-store --load-db < /tmp/db.dump How to fix: writing to file: Connection reset by peer# This may mean you are trying to import a too large file or directory into the Nix store, or your machine is running out of resources, such as disk space or memory. Try to reduce the size of the directory to import, or run garbage collection. macOS update breaks Nix installation# This is a known issue. The Nix installer modifies /etc/zshrc. When macOS is updated, it will typically overwrite /etc/zshrc again. As a workaround, add the following code snippet to the end of /etc/zshrc and restart the shell: if [ -e '/nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh' ]; then . '/nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh' fi'''
year_published = 2025
