["https://nix.dev/tutorials/nix-language"]
title = "Nix language basics — nix.dev  documentation"
full_description = '''Nix language basics# The Nix language is designed for conveniently creating and composing derivations – precise descriptions of how contents of existing files are used to derive new files. It is a domain-specific, purely functional, lazily evaluated, dynamically typed programming language. Notable uses of the Nix language Nixpkgs The largest, most up-to-date software distribution in the world, and written in the Nix language. NixOS A Linux distribution that can be configured fully declaratively and is based on Nix and Nixpkgs. Its underlying modular configuration system is written in the Nix language, and uses packages from Nixpkgs. The operating system environment and services it provides are configured with the Nix language. You may quickly encounter Nix language expressions that look very complicated. As with any programming language, the required amount of Nix language code closely matches the complexity of the problem it is supposed to solve, and reflects how well the problem – and its solution – is understood. Building software is a complex undertaking, and Nix both exposes and allows managing this complexity with the Nix language. Yet, the Nix language itself has only few basic concepts that will be introduced in this tutorial, and which can be combined arbitrarily. What may look complicated comes not from the language, but from how it is used. Overview# This is an introduction to reading the Nix language, for the purpose of following other tutorials and examples. Using the Nix language in practice entails multiple things: Language: syntax and semantics Libraries: builtins and pkgs.lib Developer tools: testing, debugging, linting, formatting, … Generic build mechanisms: stdenv.mkDerivation, trivial builders, … Composition and configuration mechanisms: override, overrideAttrs, overlays, callPackage, … Ecosystem-specific packaging mechanisms: buildGoModule, buildPythonApplication, … NixOS module system: config, option, … This tutorial only covers the most important language features, briefly discusses libraries, and at the end will direct you to reference material and resources on the other components. What will you learn?# This tutorial should enable you to read typical Nix language code and understand its structure. Its goal is to highlight where the Nix language may differ from languages you are used to. It therefore shows the most common and distinguishing patterns in the Nix language: Assigning names and accessing values Declaring and calling functions Built-in and library functions Impurities to obtain build inputs Derivations that describe build tasks Important This tutorial does not explain all Nix language features in detail and does not go into specifics of syntactical rules. For instance, we skip over commonplace constructs such as if ... then ... else .... See the Nix manual for a full language reference. What do you need?# Familiarity with software development Familiarity with Unix shell, to read command line examples A Nix installation to run the examples How long does it take?# No experience with functional programming: 2 hours Familiar with functional programming: 1 hour Proficient with functional programming: 30 minutes We recommend to run all examples. Play with them to validate your assumptions and test what you have learned. Read detailed explanations if you want to make sure you fully understand the examples. How to run the examples?# A piece of Nix language code is a Nix expression. Evaluating a Nix expression produces a Nix value. The content of a Nix file (file extension .nix) is a Nix expression. Note To evaluate means to transform an expression into a value according to the language rules. This tutorial contains many examples of Nix expressions. Each one is followed by the expected evaluation result. The following example is a Nix expression adding two numbers: 1 + 2 3 Interactive evaluation# Use nix repl to evaluate Nix expressions interactively (by typing them on the command line): $ nix repl Welcome to Nix 2.13.3. Type :? for help. nix-repl> 1 + 2 3 Note The Nix language uses lazy evaluation, and nix repl by default only computes values when needed. Some examples show a fully evaluated data structure for clarity. If your output does not match the example, try prepending :p to the input expression. Example: nix-repl> { a.b.c = 1; } { a = { ... }; } nix-repl> :p { a.b.c = 1; } { a = { b = { c = 1; }; }; } Type :q to exit nix repl. Evaluating Nix files# Use nix-instantiate --eval to evaluate the expression in a Nix file. $ echo 1 + 2 > file.nix $ nix-instantiate --eval file.nix 3 Detailed explanation The first command writes 1 + 2 to a file file.nix in the current directory. The contents of file.nix are now 1 + 2, which you can check with $ cat file.nix 1 + 2 The second command runs nix-instantiate with the --eval option on file.nix, which reads the file and evaluates the contained Nix expression. The resulting value is printed as output. --eval is required to evaluate the file and do nothing else. If --eval is omitted, nix-instantiate expects the expression in the given file to evaluate to a special value called a derivation, which we will come back to at the end of this tutorial in Derivations. Note nix-instantiate --eval will try to read from default.nix if no file name is specified. $ echo 1 + 2 > default.nix $ nix-instantiate --eval 3 Note The Nix language uses lazy evaluation, and nix-instantiate by default only computes values when needed. Some examples show a fully evaluated data structure for clarity. If your output does not match the example, try adding the --strict option to nix-instantiate. Example: $ echo "{ a.b.c = 1; }" > file.nix $ nix-instantiate --eval file.nix { a = <CODE>; } $ echo "{ a.b.c = 1; }" > file.nix $ nix-instantiate --eval --strict file.nix { a = { b = { c = 1; }; }; } Notes on whitespace# White space is used to delimit lexical tokens, where required. It is otherwise insignificant. Line breaks, indentation, and additional spaces are for readers’ convenience. The following are equivalent: let x = 1; y = 2; in x + y 3 let x=1;y=2;in x+y 3 Names and values# Values in the Nix language can be primitive data types, lists, attribute sets, and functions. We show examples of primitive data types and lists in the context of attribute sets. Later in this section we cover special features of character strings: string interpolation, file system paths, and indented strings. We deal with functions separately. Attribute sets and let expressions are used to assign names to values. Assignments are denoted by a single equal sign (=). Whenever you encounter an equal sign (=) in Nix language code: On its left is the assigned name. On its right is the value, delimited by a semicolon (;). Attribute set { ... }# An attribute set is a collection of name-value-pairs, where names must be unique. The following example shows all primitive data types, lists, and attribute sets. Note If you are familiar with JSON, imagine the Nix language as JSON with functions. Nix language data types without functions work just like their counterparts in JSON and look very similar. Nix 1{ 2 string = "hello"; 3 integer = 1; 4 float = 3.141; 5 bool = true; 6 null = null; 7 list = [ 1 "two" false ]; 8 attribute-set = { 9 a = "hello"; 10 b = 2; 11 c = 2.718; 12 d = false; 13 }; # comments are supported 14} JSON { "string": "hello", "integer": 1, "float": 3.141, "bool": true, "null": null, "list": [1, "two", false], "object": { "a": "hello", "b": 1, "c": 2.718, "d": false } } Note Attribute names usually do not need quotes.[1] List elements are separated by white space.[2] Recursive attribute set rec { ... }# You will sometimes see attribute sets declared with rec prepended. This allows access to attributes from within the set. Example: rec { one = 1; two = one + 1; three = two + 1; } { one = 1; three = 3; two = 2; } Note Elements in an attribute set can be declared in any order, and are ordered on evaluation. Counter-example: { one = 1; two = one + 1; three = two + 1; } error: undefined variable 'one' at «string»:3:9: 2| one = 1; 3| two = one + 1; | ^ 4| three = two + 1; let ... in ...# Also known as “let expression” or “let binding” let expressions allow assigning names to values for repeated use. Example: let a = 1; in a + a 2 Detailed explanation Assignments are placed between the keywords let and in. In this example we assign a = 1. After in comes the expression in which the assignments are valid, i.e., where assigned names can be used. In this example the expression is a + a, where a refers to a = 1. By replacing the names with their assigned values, a + a evaluates to 2. Names can be assigned in any order, and expressions on the right of the assignment (=) can refer to other assigned names. Example: let b = a + 1; a = 1; in a + b 3 Detailed explanation Assignments are placed between the keywords let and in. In this example we assign a = 1 and b = a + 1. The order of assignments does not matter. Therefore the following example, where the assignments are in reverse order, is equivalent: let a = 1; b = a + 1; in a + b 3 Note that the a in b = a + 1 refers to a = 1. After in comes the expression in which the assignments are valid. In this example the expression is a + b, where a refers to a = 1, and b refers to b = a + 1. By replacing the names with their assigned values, a + b evaluates to 3. This is similar to recursive attribute sets: in both, the order of assignments does not matter, and names on the left can be used in expressions on the right of the assignment (=). Example: let ... in ... let b = a + 1; c = a + b; a = 1; in { c = c; a = a; b = b; } { a = 1; b = 2; c = 3; } rec { ... } rec { b = a + 1; c = a + b; a = 1; } { a = 1; b = 2; c = 3; } The difference is that while a recursive attribute set evaluates to an attribute set, any expression can follow after the in keyword. In the following example we use the let expression to form a list: let b = a + 1; c = a + b; a = 1; in [ a b c ] [ 1 2 3 ] Only expressions within the let expression itself can access the newly declared names. We say: the bindings have local scope. Counter-example: { a = let x = 1; in x; b = x; } error: undefined variable 'x' at «string»:3:7: 2| a = let x = 1; in x; 3| b = x; | ^ 4| } Attribute access# Attributes in a set are accessed with a dot (.) and the attribute name. Example: let attrset = { x = 1; }; in attrset.x 1 Accessing nested attributes works the same way. Example: let attrset = { a = { b = { c = 1; }; }; }; in attrset.a.b.c 1 The dot (.) notation can also be used for assigning attributes. Example: { a.b.c = 1; } { a = { b = { c = 1; }; }; } with ...; ...# The with expression allows access to attributes without repeatedly referencing their attribute set. Example: let a = { x = 1; y = 2; z = 3; }; in with a; [ x y z ] [ 1 2 3 ] The expression with a; [ x y z ] is equivalent to [ a.x a.y a.z ] Attributes made available through with are only in scope of the expression following the semicolon (;). Counter-example: let a = { x = 1; y = 2; z = 3; }; in { b = with a; [ x y z ]; c = x; } error: undefined variable 'x' at «string»:10:7: 9| b = with a; [ x y z ]; 10| c = x; | ^ 11| } inherit ...# inherit is shorthand for assigning the value of a name from an existing scope to the same name in a nested scope. It is for convenience to avoid repeating the same name multiple times. Example: let x = 1; y = 2; in { inherit x y; } { x = 1; y = 2; } The fragment inherit x y; is equivalent to x = x; y = y; It is also possible to inherit names from a specific attribute set with parentheses (inherit (...) ...). Example: let a = { x = 1; y = 2; }; in { inherit (a) x y; } { x = 1; y = 2; } The fragment inherit (a) x y; is equivalent to x = a.x; y = a.y; inherit also works inside let expressions. Example: let inherit ({ x = 1; y = 2; }) x y; in [ x y ] [ 1 2 ] Detailed explanation While this example is contrived, in more complex code you will regularly see nested let expressions that re-use names from their outer scope. Here we use the attribute set { x = 1; y = 2; } to have something non-trivial to inherit from. The let expression inherits x and y from that attribute set using ( ), which is equivalent to writing: let x = { x = 1; y = 2; }.x; y = { x = 1; y = 2; }.y; in The new inner scope now contains x and y, which are used in the list [ x y ]. String interpolation ${ ... }# Previously known as “antiquotation”. The value of a Nix expression can be inserted into a character string with the dollar-sign and braces (${ }). Example: let name = "Nix"; in "hello ${name}" "hello Nix" Only character strings or values that can be represented as a character string are allowed. Counter-example: let x = 1; in "${x} + ${x} = ${x + x}" error: cannot coerce an integer to a string at «string»:4:2: 3| in 4| "${x} + ${x} = ${x + x}" | ^ 5| Interpolated expressions can be arbitrarily nested. (This can become hard to read, and we recommend to avoid it in practice.) Example: let a = "no"; in "${a + " ${a + " ${a}"}"}" "no no no" Detailed explanation Any Nix expression where the value can be represented as a string can be used within ${ }. The + sign in the above expression is the string concatenation operator, which takes two strings and produces a new string. The expression in the example is deliberately confusing in order to demonstrate that arbitrarily nested string interpolations are possible, but tend to be hard to read. It denotes a string that contains the interpolation of concatenating the value of a with a string that starts with a space and is followed by another interpolated string. That second interpolated string is again the result of concatenating the value of a and yet another string that starts with a space and is followed by an interpolation of a. Example: let a = "one"; b = "two"; in "${a + b}" "onetwo" Built-in functions are discussed in a later section. Warning You may encounter strings that use the dollar sign ($) before an assigned name, but no braces ({ }): These are not interpolated strings, but usually denote variables in a shell script. In such cases, the use of names from the surrounding Nix expression is a coincidence. Example: let out = "Nix"; in "echo ${out} > $out" "echo Nix > $out" Indented strings# Also known as “multi-line strings”. The Nix language offers convenience syntax for character strings which span multiple lines that have common indentation. Indented strings are denoted by double single quotes ('' ''). Example: '' multi line string '' "multi\nline\nstring\n" Equal amounts of prepended white space are trimmed from the result. Example: '' one two three '' "one\n two\n three\n" Note Indented strings also support string interpolation. For details check the documentation on string literals in the Nix language. File system paths# The Nix language offers convenience syntax for file system paths. Absolute paths always start with a slash (/). Example: /absolute/path /absolute/path Paths are relative when they contai'''
