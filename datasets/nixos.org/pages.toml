["https://nixos.org/download"]
title = "Download | Nix & NixOS"
description = "Nix is a tool that takes a unique approach to package management and system configuration. Learn how to make reproducible, declarative and reliable systems."
full_description = "Multi-user installation (recommended) Install Nix via the recommended multi-user installation: $ sh <(curl -L https://nixos.org/nix/install) --daemon We recommend the multi-user install if you are on Linux running systemd, with SELinux disabled and you can authenticate with sudo. Single-user installation Install Nix via the single-user installation: $ sh <(curl -L https://nixos.org/nix/install) --no-daemon Above command will perform a single-user installation of Nix, meaning that nix is owned by the invoking user. You should run this under your usual user account, not as root. The script will invoke sudo to create /nix if it doesn’t already exist. Which type of installation should you choose? This depends on your requirements, but here is a short list of reasons why we recommend multi-user installation: Pros Better build isolation (and that is what Nix is all about) Better security (a build can not write somewhere in your home) Sharing builds between users Cons Requires root to run the daemon More involved installation (creation of nixbld* users, installing a systemd unit, … Harder to uninstall Multi-user installation Updating to macOS 15 Sequoia If you recently updated to macOS 15 Sequoia and are getting error: the user '_nixbld1' in the group 'nixbld' does not exist when running Nix commands, refer to GitHub issue NixOS/nix#10892 for instructions to fix your installation without reinstalling. Install Nix via the recommended multi-user installation: $ sh <(curl -L https://nixos.org/nix/install) We believe we have ironed out how to cleanly support the read-only root on modern macOS. Please consult the manual on details what the installation script does. Multi-user installation (Requires WSL with systemd enabled) WSL versions 0.67.6 and above has systemd support. Follow Microsoft’s systemd guide to configure it, and then install Nix using: $ sh <(curl -L https://nixos.org/nix/install) --daemon Single-user installation Install Nix via the single-user installation $ sh <(curl -L https://nixos.org/nix/install) --no-daemon"
