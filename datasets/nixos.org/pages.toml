full_description = '''Community Community Nix and NixOS are developed and used by a diverse and welcoming community from all around the world. The NixOS Foundation aims to promote participation without regard to gender, sexual orientation, disability, ethnicity, age, or similar personal characteristics. We want to strive to create and foster community by providing an intentionally welcoming and safe environment where all feel valued and cared for, and where all are given opportunity to participate meaningfully. The Foundation will work with the community in service of this goal. Instances of abusive, harassing, or otherwise unacceptable behavior may be reported by contacting the project team at community@nixos.org. The project team is obligated to maintain confidentiality with regard to the reporter of an incident. Where to talk? The Nix community is spread across various platforms. Here are the official and unofficial spaces where you can find help, discuss development, and chat with other users. Official spaces These spaces are monitored and moderated by the NixOS Moderation Team. This means they are moderated in such a way that they follow the standards and moral values of our community. You can find out more about our moderation team here. Discourse Our official forum is the right place to get help from other users and discuss the development of the projects. There are also Announcements, Job offers and Events. Matrix space Real-time help, development chat, and off-topic community discussion takes place on Matrix. Github Official organization page on Github, where you can find nix, nixpkgs, and other repositories. Official social-media These spaces are maintained by our NixOS Marketing Team though not monitored and not moderated by the NixOS Moderation Team. Mastodon Twitter LinkedIn YouTube Our calendars We use these calendars to schedule events, meetings, and other. Official NixOS Calendar Community Calendar Unofficial spaces These spaces are not monitored and not moderated by the NixOS Moderation Team. Please be aware that different moral values and rules may apply in these spaces. The NixOS moderation team may advise moderators in these spaces, though does not control or enforce our community values. Stackoverflow Discord Reddit If you are looking for professional help, check out companies that offer Nix related services. let c=document.querySelectorAll(".clickable");c.forEach(e=>{e.classList.add("cursor-pointer"),e.addEventListener("click",()=>{e.querySelector("a, button").click()})}); NixCon The NixCon Team organizes a conference once a year. Next Conference NixCon 2024 - Berlin 25-27 October 2024 NixCon is a community-oriented conference for contributors and users of Nix and NixOS. It's about sharing experiences, inspiring people and discussing future development. Read more... Previous Conferences NixCon 2023 - Darmstadt 8-10 September 2023 NixCon is a community-oriented conference for contributors and users of Nix and NixOS. It's about sharing experiences, inspiring people and discussing future development. Read more... NixCon 2022 - Paris 20-22 October 2022 NixCon is a community-oriented conference for contributors and users of Nix and NixOS. It's about sharing experiences, inspiring people and discussing future development. Read more... NixCon 2020 - Online 16-18 October 2020 NixCon is a community-oriented conference for contributors and users of Nix and NixOS. It's about sharing experiences, inspiring people and discussing future development. Read more... NixCon 2019 - Brno 25-27 October 2019 NixCon is becoming a regular gathering that everybody expects to happen. This year we met at Brno, Czech Republic. This was the biggest conference so far. Read more... NixCon 2018 - London 25-27 October 2018 For the first time a Nix conference outside the Germany. London was the first conference that was not run over the weekend, but during the week. Read more... NixCon 2017 - Munich 28-31 October 2017 After a year of a break, Nix community gathered at TNG Technology Consulting in Munich. Read more... NixCon 2015 - Berlin 14-17 November 2015 Taking place in a Berlin-style converted loft, it was the first NixOS conference. It was the first time Nix community came together in such numbers. In two days there were many interesting talks. Read more... Meetups America New York (New York) Reston (Virginia) San Francisco (California) Europe Amsterdam (Netherlands) Berlin (Germany) Copenhagen (Denmark) London (United Kingdom) Montpellier (France) Nürnberg (Germany) Munich (Germany) Oslo (Norway) Stuttgart (Germany) Zürich (Switzerland) Aalen (Germany) Asia Singapore (Singapore) Tokyo (Japan) RFC Process The "RFC" (request for comments) process is intended to provide a consistent and controlled path for new features to enter the Nix language, packages and OS, so that all community can be confident about the direction the ecosystem is evolving in. Learn more Final Comment Phase New Submission Refine Submission Submission Rejected Submission Accepted FCP Cancelled Motion for FCP Discussion Phase Nomination Phase New Submission Substantial New Arguments Assignment of Shepherding Team Teams Foundation board Responsible for providing operational and organizational support to the NixOS project and community. Read more RFC Steering Committee Responsible for forming an RFC Shepherd team from the available nominations on each RFC, which is then responsible for accepting or rejecting a specific RFC. Read more Security Team Security is a priority for the NixOS community. In addition to community-sourced developments, NixOS has a dedicated team, to look into privately reported security issues. Read more Infrastructure Team Provides infrastructure for the Nix and NixOS community. Read more NixOS Release Team Manages the twice-yearly releases of NixOS. It is responsible the entire release process from setting the roadmap to uploading the artifacts. Read more NixCon Team Helps organize NixCon, a conference for the Nix and NixOS community. Read more Marketing Team Maintains this website, responsible for social media outreach, collects metrics. Help grow the Nix user base. Read more Moderation Team Moderates participation on official community platforms. Read more CUDA Team Making Nix and NixOS the first choice for users of CUDA-accelerated software. Read more Nix Team Maintains and releases the Nix package manager. Read more Documentation Team Works on improving learning experience and documentation. Read more Nix Formatting Team Maintains the official Nix formatter and standard format. Read more Geospatial Team Maintains geospatial software and related NixOS modules Read more Xen Project Hypervisor Team Maintains the Xen Project Hypervisor tooling and the accompanying NixOS modules. Read more Nix@NGI Team Making NixOS the distribution platform for the Next Generation Internet Read more Board members: Eelco Dolstra — Chair Ron Efroni — Treasurer Théophane Hufschmitt — Secretary Jonas Chevalier — Member Ryan Lahfa — Observer Janik Haag — Observer The mission! The mission of the foundation is to support the Nix ecosystem's infrastructure, and projects implementing the purely functional deployment model. In particular, the foundation supports Nix, Nixpkgs, NixOS, and operates: cache.nixos.org - the NixOS binary cache, containing over 120TB of prebuilt Nix packages. hydra.nixos.org - a Nix build farm, consisting of hundreds of macOS, x86-64 (Linux) and aarch64 (Linux) build cores. Hydra executes over 350,000 builds each week. Event Funding The NixOS Foundation is a registered non-profit organisation at the Chamber of commerce (Kamer van Koophandel) in Utrecht, The Netherlands. The KvK number is 63520583. You can contact the foundation by writing an email to foundation@nixos.org.'''
