["https://nixos.org/blog/announcements/2024/nixos-2411"]
title = "NixOS 24.11 released | Blog | Nix & NixOS"
description = "Nix is a tool that takes a unique approach to package management and system configuration. Learn how to make reproducible, declarative and reliable systems."
full_description = "Hello everyone, we are Tristan Ross and Weijia Wang, the release managers for the newest release of NixOS known as NixOS 24.11 Vicuña. We’re glad to announce that after the additional week-long delay that we can deliver this stable release of NixOS. NixOS is a Linux distribution, whose set of packages can also be used on other Linux systems and macOS. This release will receive bugfixes and security updates for seven months (up until 2025-06-31). Release manual Highlights New Services Backward Incompatibilities Other Notable Changes Upgrade Instructions ISO Image Downloads The 24.11 release was made possible due to the efforts of 2669 contributors, who authored 49079 commits since the previous release. Our thanks go the contributors who also take care of the continued stability and security of our stable release. NixOS is already known as the most up to date distribution while also being the distribution with the most packages. This release saw 8141 new packages and 20975 updated packages in Nixpkgs. We also removed 3970 packages in an effort to keep the package set maintainable and secure. In addition to packages the NixOS distribution also features modules and tests that make it what it is. This release brought 119 new modules and removed 30. In that process we added 1706 options and removed 556. GNOME 47 GNOME has been updated to version 47 “Denver”, which introduces accent colors, small screen support, screen capture hardware encoding, and more changes. Refer to the release notes for more details. Plasma 6 Plasma has been updated to version 6.2, which introduces many bug fixed and other changes. Refer to the release notes for more details. Darwin Rework Emily, Randy Eckenrode, and toonn did an amazing job with their work as the Darwin core maintainers to bring better support for Darwin into Nixpkgs. A comprehensive list of changes can be found on the NixOS Discourse under “The Darwin SDKs have been updated”. C Compilers LLVM has been updated to version 19 and GCC remains the same version. Tristan Ross made many changes which improves the way we provide multiple versions of LLVM. Special thanks We want to personally thank seth and Priyanshu Tripathi for editorializing the release notes, lennart for doing the release logo, Vladimír Čunát for his tireless effort in managing jobsets and staging cycles, Martin Weinelt for dutifully tending to our build infrastructure, and Cole Helbling for his effort on keeping ofBorg running. Reflections and Closing We are thankful for everyone who contributed and everyone who was patient for 24.11. It has been a great time working with everyone to make this release possible. We hope everyone is looking forward to the next release, NixOS 25.05 Warbler."
year_published = 2025
clearnet = "https://nixos.org/blog/announcements/2024/nixos-2411"
