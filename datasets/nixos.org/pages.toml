["https://nixos.org/blog/announcements/2005/service-deployment-paper-accepted-for-scm-12-2005"]
title = "Service deployment paper accepted for SCM-12 | Blog | Nix & NixOS"
description = "Nix is a tool that takes a unique approach to package management and system configuration. Learn how to make reproducible, declarative and reliable systems."
full_description = "The paper “Service Configuration Management” (accepted at the 12th International Workshop on Software Configuration Management) describes how we can rather easily deploy “services” (e.g., complete webserver configurations such as our Subversion server) through Nix by treating the non-component parts (such as configuration files, control scripts and static data) as components that are built by Nix expressions. The result is that all advantages that Nix offers to software deployment also extend to service deployment, such as the ability to easily have multiple configuration side by side, to roll back configurations, and to identify the precise dependencies of a configuration."
