["https://nixos.org/community/event-funding"]
title = "Event funding | Nix & NixOS"
description = "Nix is a tool that takes a unique approach to package management and system configuration. Learn how to make reproducible, declarative and reliable systems."
full_description = "The NixOS community is awesome! Our friends and members have been donating throughout the year, and now we’d like to put the money to work. We are launching a new grant program that will help our community thrive and widen. In particular, we are planning to fund meet-ups and conferences as in-person communication can inspire developers to new ideas and experiments and lead to teaming up and building new projects. This program will be aimed at supporting and boosting the NixOS community. It has been instrumental in getting us where we are today, and we hope that it will continue to reward and encourage amazing folks like you to volunteer time and talent for years to come. Who can apply? Any active community member that’s looking to organize a publicly-announced event with Nix developers can apply. The recipient must be located in a SEPA country or in a country supported by Wise. This allows to avoid money transfer issues. Unfortunately, individuals from India are excluded: it proved to be difficult to deal with India in terms of transactions. However, if you have a company, you can apply: things are easier this way. What events can be funded? Events that are funded by this process should be open and advertised in the public. They should be followed by a short by a short public report including a photo and a summary of the event and the outcomes. For instance, you can apply if you’re planning to organize: Nix meetups where a few people can make a presentation to showcase Nix to the audience Sprints: focused hacking for a period of time Smaller Nix-based get-togethers If you are planning an event that doesn’t look like any of these, but you think it may be important for the Nix community, feel free to reach out. Budget We can spare up to €500 for a meetup and €2000 for a sprint. But we’re flexible, so exceptions are possible. When should I apply? Deadline: 7th of every month Board decision: by the end of each month. How do I get re-imbursed? Use the following form to get reimbursed: New expenses. Make sure to mention the event and attach a valid VAT receipt. Once approved the money should go straight back to your bank account! Apply FAQ Can we apply with recurring events? We prefer you to apply for each instance of the recurring event. This way, we will be able to be fair and consider other events. Actually, you may apply with a larger event spread across the year. But the assessment for larger events requiring more funding is way thorougher. How will the approval process look like? In our selection process, the board will follow these steps: Collection of all responses between the submission times Reviewing and prioritising the applications What events are we willing to sponsor? Here’s an example of how we prioritize applications. Among the two listed options, the first one would be more favorable: Events that are focused on advocating Nix and attracting new community members Events that are focused on building software using the Nix ecosystem"
year_published = 2025
clearnet = "https://nixos.org/community/event-funding"
