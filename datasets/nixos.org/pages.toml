["https://nixos.org/blog"]
title = "Blog | Nix & NixOS"
description = "Nix is a tool that takes a unique approach to package management and system configuration. Learn how to make reproducible, declarative and reliable systems."
full_description = "NixOS 24.11 released - Published on Sat Nov 30 2024 Hello everyone, we are Tristan Ross and Weijia Wang, the release managers for the newest release of NixOS known as NixOS 24.11 Vicuña. We're glad to announce that after the additional week-long delay that we can deliver this stable release of NixOS. NixOS is a Linux distribution, whose set of packages can also be used on other Linux systems and macOS. This release will receive bugfixes and security updates for seven months (up until 2025-06-31). Release manual Highlights... Result for the Nix Steering Committee Election 2024 - Published on Tue Nov 05 2024 After successfully using CIVS to tally the 450 ballots cast (56% turnout) on OpaVote, We are hereby concluding this election! We congratulate the first members of the Nix Steering Committee (SC) (ordered alphabetically): @Ericson2314 (2 year term) @fpletz (1 year term) @Gabriella439 (2 year term) @jtojnar (2 year term)... Nix Steering Committee Election 2024 - Published on Mon Sep 16 2024 Some links in this post are only accessible to NixOS org members. As a first step towards a better governance for official Nix projects, we are happy to announce the kick-off of the first Nix Steering Committee election! The Steering Committee will be the primary community leadership body, responsible for steering the official Nix projects -- organisationally, socially, and technically. This includes making decisions over what is official, managing teams, approving NixOS Foundation policies relevant for the community, being the final escalation point, and more as detailed in the Nix Governance Constitution.... Open Letter to the European Commission - Published on Sun Jul 21 2024 Initially published by petites singularités. English translation provided by OW2. If you want to sign the letter, please re-publish the original letter on your website and add to the list of signatories. Since 2020, Next Generation Internet (NGI) programmes, part of European Commission's Horizon programme, fund free software in Europe using a cascade funding mechanism (see for example NLnet's calls). This year, according to the Horizon Europe working draft detailing funding programmes for 2025, we notice that Next Generation Internet is not mentioned any more as part of Cluster 4. NGI programmes have shown their strength and importance to supporting the European software infrastructure, as a generic funding instrument to fund digital commons and ensure their long-term sustainability. We find this transformation incomprehensible, moreover when NGI has proven efficient and economical to support free software as a whole, from the smallest to the most established initiatives. This ecosystem diversity backs the strength of European technological innovation, and maintaining the NGI initiative to provide structural support to software projects at the heart of worldwide innovation is key to enforce the sovereignty of a European infrastructure. Contrary to common perception, technical innovations often originate from European rather than North American programming communities, and are mostly initiated by small-scaled organizations. Previous Cluster 4 allocated 27 million euros to: &quot;Human centric Internet aligned with values and principles commonly shared in Europe&quot; ; &quot;A flourishing internet, based on common building blocks created within NGI, that enables better control of our digital life&quot; ;..."
