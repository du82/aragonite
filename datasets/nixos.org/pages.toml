["https://nixos.org/blog/announcements/2008/disnix-paper-accepted-at-hotswup"]
title = "DisNix paper accepted at HotSWUp | Blog | Nix & NixOS"
description = "Nix is a tool that takes a unique approach to package management and system configuration. Learn how to make reproducible, declarative and reliable systems."
full_description = "The paper “Atomic Upgrading of Distributed Systems” (by Sander van der Burg, Eelco Dolstra and Merijn de Jonge) has been accepted for presentation at the First ACM Workshop on Hot Topics in Software Upgrades (HotSWUp). A draft of the paper is available. It describes Sander’s master’s thesis research on DisNix, an extension to Nix that allows deployment and upgrading of distributed systems from a single declarative description. We will continue this research in the Jacquard PDS project, which has now started. (We still have an opening for a PhD student or a postdoc; please contact us if you’re interested.)"
