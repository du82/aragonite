full_description = "About At fast.ai we’ve recently gotten really excited about the use of transfer learning in NLP. Even better, we’ve found that other people share our excitement—including some of the alumni from our course who are working on building pre-trained models for their native languages, and top researchers like Sebastian Ruder. So, we’ve started some collaborative projects, and this site is where we’ll share the fruits of this work. At fast.ai we’ve recently gotten really excited about the use of transfer learning in NLP. Even better, we’ve found that other people share our excitement—including some of the alumni from our course who are working on building pre-trained models for their native languages, and top researchers like Sebastian Ruder. So, we’ve started some collaborative projects, and this site is where we’ll share the fruits of this work."
