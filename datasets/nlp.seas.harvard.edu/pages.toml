["http://nlp.seas.harvard.edu/NamedTensor"]
title = "Tensor Considered Harmful"
description = "Named tensors for better deep learning code."
full_description = '''Tensor Considered Harmful Alexander Rush - @harvardnlp TL;DR: Despite its ubiquity in deep learning, Tensor is broken. It forces bad habits such as exposing private dimensions, broadcasting based on absolute position, and keeping type information in documentation. This post presents a proof-of-concept of an alternative approach, named tensors, with named dimensions. This change eliminates the need for indexing, dim arguments, einsum- style unpacking, and documentation-based coding. The prototype PyTorch library accompanying this blog post is available as namedtensor. Tensor Traps Trap 1: Privacy by Convention Trap 2: Broadcasting by Alignment Trap 3: Access by Comments Named Tensor: A Prototype Proposal 1: Assigning Names Proposal 2: Accessors and Reduction Proposal 3: Broadcasting and Contraction Proposal 4: Shifting Dimensions Proposal 5: Ban Indexing Proposal 6: Private Dimensions Example: Neural Attention Conclusion / Request for Help Changelog See Part 2 as well. Updated the syntax of the prototype to be a subest of xarray whereever possible. Dropped the einops style string DSL notation to be more explicit. Implementations Jon Malmaud points out that the xarray project has very similar goals as this note with the addition of extensive Pandas and scientific computing support. Tongfei Chen’s Nexus project proposes statically type-safe tensors in Scala. Stephan Hoyer and Eric Christiansen have a labeled tensor library for Tensorflow that is the same as this appraoch. Labed Tensor Nishant Sinha has a TSA library that uses type annotations to define dimension names. #@title Setup #!rm -fr NamedTensor/; git clone -q https://github.com/harvardnlp/NamedTensor.git #!cd NamedTensor; pip install -q .; pip install -q torch numpy opt_einsum import numpy import torch from namedtensor import NamedTensor, ntorch from namedtensor import _im_init _im_init() Tensor Traps This post is about the tensor class, a multi-dimensional array object that is the central object of deep learning frameworks such as Torch, TensorFlow and Chainer, as well as numpy. Tensors carry around a blob of storage and expose a tuple of dimension information to users. ims = torch.tensor(numpy.load('test_images.npy')) ims.shape torch.Size([6, 96, 96, 3]) Here there are 4 dimensions, corresponding to batch_size, height, width, and channels. Most of the time you can figure this out by some comment in the code that looks like this: # batch_size x height x width x channels ims[0] This approch is concise and pseudo-mathy. However from a programming point of view it is not a great way to build complex software. Trap 1: Privacy by Convention Code that manipulates tensors does so by dimension identifiers in the tuple. If you want to rotate the image you read the comment, decide what dimensions need to be changed and alter them. def rotate(ims): # batch_size x height x width x channels rotated = ims.transpose(1, 2) # batch_size x width x height x channels return rotated rotate(ims)[0] This code is simple and in theory well documented. However, it does not reflect the semantics of the target function. The property of rotation is independent of the batch, or for that matter, the channels. The function should not have to account for these dimensions in determining the dimensions to alter. This leads to two problems. FIrst, it’s quite worrisome that if we pass in a singleton image this function runs fine but fails to work. rotate(ims[0]).shape torch.Size([96, 3, 96]) However, even more worrisome is that the function may actually use the batch dimensions by mistake and mix together properties of different images. This can lead to nasty bugs that would be easy to avoid if this dimension was hidden from the code. Trap 2: Broadcasting by Alignment The most useful aspect of Tensors is that they can quickly do array operations without directly requiring for loops. For this to work dimensions need to be directly aligned so that they can be broadcasts. Again this is done by convention and code documentation that makes it “easy” to line up dimensions. For instance, let’s assume we want to apply a mask to the above image. # height x width mask = torch.randint(0, 2, [96, 96]).byte() mask try: ims.masked_fill(mask, 0) except RuntimeError: error = "Broadcasting fail %s %s"%(mask.shape, ims.shape) error 'Broadcasting fail torch.Size([96, 96]) torch.Size([6, 96, 96, 3])' This fails because even though we knew that we were building a height and width shaped mask, the rules of broadcasting do not have the correct semantics. To make this work, you are encouraged to use either view or squeeze my least favorite functions. # either mask = mask.unsqueeze(-1) # or mask = mask.view(96, 96, 1) # height x width x channels ims.masked_fill(mask, 1)[0] Note we do not need to do this for the left-most dimensions so there is a bit of abstraction here. However reading through real code, dozens of right side views and squeezes become completely unreadable. Trap 3: Access by Comments It is possible that you look at the top two issues and think that as long as you are careful, these issues will be caught by run time errors. However, even well used the combination of broadcasting and indexing can lead to problems that are very tough to catch. a = ims[1].mean(2, keepdim=True) # height x width x 1 # (Lots of code in between) # ....................... # Code comment explaining what should be happening. dim = 1 b = a + ims.mean(dim, keepdim=True)[0] # (Or maybe should be a 2? or a 0?) index = 2 b = a + ims.mean(dim, keepdim=True)[0] b Here we assume that the coder is trying to combine two tensor using both reduction operations and dimension indexing. (Honestly at this point I have forgotten what the dimensions stand for). The main point though is that this code will run fine for whatever value dim is given. The comment here might descibe what is happening but the code itself doesn’t throw a run time error. Named Tensor: A Prototype Based on these issues, I think deep learning code should move to a better central object. There are several of these proposed. Here for fun, I will develop a new prototype. I have the following goals. 1) Dimensions should have human-readable names. 2) No function should have a dim argument. 3) Broadcast should be by name matching. 4) Transposition should be explicit. 5) Ban dimension based indexing. 6) Private dimensions should be protected. To experiment with these ideas I have built a library known as NamedTensor. Currently it is PyTorch specific, but in theory a similar idea could be used in other frameworks. The code is available at github.com/harvardnlp/namedtensor. Proposal 1: Assigning Names The core of the library is an object that wraps a tensor and provides names for each dimension. Here we simply wrap a given torch tensor with dimension names. named_ims = NamedTensor(ims, ("batch", "height", "width", "channels")) named_ims.shape OrderedDict([('batch', 6), ('height', 96), ('width', 96), ('channels', 3)]) Alternatively the library has wrappers for the pytorch constructors to turn them into named tensors. ex = ntorch.randn(dict(height=96, width=96, channels=3)) ex Most simple operations simply keep around the named tensor properties. ex.log() # or ntorch.log(ex) None Proposal 2: Accessors and Reduction The first benefit of names comes from the ability to replace the need for dim and axis style arguments entirely. For example, lets say we wanted to sort each column. sortex, _ = ex.sort("width") sortex Another common operation is a reduction where one or more dimensions is pooled out. named_ims.mean("batch") named_ims.mean(("batch", "channels")) Proposal 3: Broadcasting and Contraction The names that are provided also provide the basis for broadcasting operations. When there is a binary operations between two named tensors they first ensure that all dimension are matched in name and then apply standard broadcasting. To demonstrate let’s return to the masking example above. Here we simply declare the names of the dimensions of our mask, and ask the library to figure out the broadcasting. im = NamedTensor(ims[0], ("height", "width", "channels")) im2 = NamedTensor(ims[1], ("height", "width", "channels")) mask = NamedTensor(torch.randint(0, 2, [96, 96]).byte(), ("height", "width")) im.masked_fill(mask, 1) Similar operations can be used for standard matrix operations such as addition and multiplication. im * mask.double() A more general feature is the dot method for tensor contraction between name tensors. Tensor contraction, the machinery behind einsum, is an elegant way of thinking about generalizations of dot-products, matrix-vector products, matrix- matrix products, etc. # Runs torch.einsum(ijk,ijk->jk, tensor1, tensor2) im.dot("height", im2).shape OrderedDict([('width', 96), ('channels', 3)]) # Runs torch.einsum(ijk,ijk->il, tensor1, tensor2) im.dot("width", im2).shape OrderedDict([('height', 96), ('channels', 3)]) # Runs torch.einsum(ijk,ijk->l, tensor1, tensor2) im.dot(("height", "width"), im2).shape OrderedDict([('channels', 3)]) Similar notation can be used for sparse indexing (inspired by the einindex library). This is useful for embedding lookups and other sparse operations. pick, _ = NamedTensor(torch.randint(0, 96, [50]).long(), ("lookups",)) \ .sort("lookups") # Select 50 random rows. im.index_select("height", pick) Proposal 4: Shifting Dimensions Behind the scenes all of the named tensors are acting as tensor objects. As such thing like order and stride of dimensions does matter. Operations like transpose and view are crucial for maintaining this, but are unfortunately quite error-prone. Instead consider a domain specific langauge shift that borrows heavily from the Alex Rogozhnikov’s excellent einops package. tensor = NamedTensor(ims[0], ("h", "w", "c")) tensor Standard calls to transpose dimensions. tensor.transpose("w", "h", "c") Calls for splitting and stacking together dimensions. tensor = NamedTensor(ims[0], ("h", "w", "c")) tensor.split(h=("height", "q"), height=8).shape OrderedDict([('height', 8), ('q', 12), ('w', 96), ('c', 3)]) tensor = NamedTensor(ims, ('b', 'h', 'w', 'c')) tensor.stack(bh = ('b', 'h')).shape OrderedDict([('bh', 576), ('w', 96), ('c', 3)]) Ops can be chained. tensor.stack(bw=('b', 'w')).transpose('h', 'bw', 'c') Just for fun, here are some of the crazier examples from einops in this notation. tensor.split(b=('b1', 'b2'), b1=2).stack(a=('b2', 'h'), d=('b1', 'w'))\ .transpose('a', 'd', 'c') tensor.split(w=('w1', 'w2'), w2=2).stack(a=('h', 'w2'), d=('b', 'w1'))\ .transpose('a', 'd', 'c') tensor.stack(a=('b', 'w')).transpose('h', 'a', 'c') tensor.stack(a=('w', 'b')).transpose('h', 'a', 'c') tensor = NamedTensor(ims, ('b', 'h', 'w', 'c')) tensor.mean('b') tensor = NamedTensor(ims, ('b', 'h', 'w', 'c')) tensor.split(h = ('h1', 'h2'), h2 =2).split(w = ('w1', 'w2'), w2=2) \ .mean(('h2', 'w2')).stack(bw=('b', 'w1')) tensor = NamedTensor(ims, ('b', 'h', 'w', 'c')) tensor.split(b = ('b1', 'b2'), b1 = 2).mean('c') \ .stack(bw=("b1", "w"), bh=('b2', 'h')).transpose('bh', 'bw') tensor.split(b = ('b1', 'b2'), b1=2).stack(h=('h', 'b1'), w=('w', 'b2')) Proposal 5: Ban Indexing Generally indexing is discouraged in this named tensor paradigm. Instead use functions like index_select above. There are some useful named alternative functions pulled over from torch. For example unbind pulls apart a dimension to a tuple. tensor = NamedTensor(ims, ('b', 'h', 'w', 'c')) # Returns a tuple images = tensor.unbind("b") images[3] The function get directly selects a slice of from a named dimension. # Returns a tuple images = tensor.get("b", 0).unbind("c") images[1] Finally narrow can be used to replace fancy indexing. However you must give a new dim name (since it can no longer broadcast). tensor.narrow( 30, 50, h='narowedheight').get("b", 0) Proposal 6: Private Dimensions Finally named tensor attempts to let you directly hide dimensions that should not be accessed by internal functions. The function mask_to will keep around a left side mask that protects any earlier dimensions from manipulations by functions. The simplest example uses a mask to drop the batch dimension. def bad_function(x, y): # Accesses the private batch dimension return x.mean("batch") x = ntorch.randn(dict(batch=10, height=100, width=100)) y = ntorch.randn(dict(batch=10, height=100, width=100)) try: bad_function(x.mask_to("batch"), y) except RuntimeError as e: error = "Error received: " + str(e) error 'Error received: Dimension batch is masked' This is weak dynamic check and can be turned off by internal functions. In future versions, perhaps we can add function annotations to lift non-named functions to respect these properties. Example: Neural Attention To demonstrate why these choices lead to better encapsulation properties, let’s consider a real-world deep learning example. This example was proposed by my colleague Tim Rocktashel in the blog post describing einsum (https://rockt.github.io/2018/04/30/einsum). Tim’s code was proposed as a better alternative to raw PyTorch. While I agree that einsum is a step forward, it still falls into many of the traps described above. Consider the problem of neural attention, which requires computing, \[\begin{align*} \mathbf{M}_t &= \tanh(\mathbf{W}^y\mathbf{Y}+(\mathbf{W}^h\mathbf{h}_t+\mathbf{W }^r\mathbf{r}_{t-1})\otimes \mathbf{e}_L) & \mathbf{M}_t &\in\mathbb{R}^{k\times L}\\ \alpha_t &= \text{softmax}(\mathbf{w}^T\mathbf{M}_t)&\alpha_t&\in\mathbb{R}^L\\ \mathbf{r}_t &= \mathbf{Y}\alpha^T_t + \tanh(\mathbf{W}^t\mathbf{r}_{t-1})&\mathbf{r}_t&\in\mathbb{R}^k \end{align*}\] First we setup the parameters. def random_ntensors(names, num=1, requires_grad=False): tensors = [ntorch.randn(names, requires_grad=requires_grad) for i in range(0, num)] return tensors[0] if num == 1 else tensors class Param: def __init__(self, in_hid, out_hid): torch.manual_seed(0) self.WY, self.Wh, self.Wr, self.Wt = \ random_ntensors(dict(inhid=in_hid, outhid=out_hid), num=4, requires_grad=True) self.bM, self.br, self.w = \ random_ntensors(dict(outhid=out_hid), num=3, requires_grad=True) Now consider the tensor-based einsum implementation of this function. # Einsum Implementation import torch.nn.functional as F def einsum_attn(params, Y, ht, rt1): # -- [batch_size x hidden_dimension] tmp = torch.einsum("ik,kl->il", [ht, params.Wh.values]) + \ torch.einsum("ik,kl->il", [rt1, params.Wr.values]) Mt = torch.tanh(torch.einsum("ijk,kl->ijl", [Y, params.WY.values]) + \ tmp.unsqueeze(1).expand_as(Y) + params.bM.values) # -- [batch_size x sequence_length] at = F.softmax(torch.einsum("ijk,k->ij", [Mt, params.w.values]), dim=-1) # -- [batch_size x hidden_dimension] rt = torch.einsum("ijk,ij->ik", [Y, at]) + \ torch.tanh(torch.einsum("ij,jk->ik", [rt1, params.Wt.values]) + params.br.values) # -- [batch_size x hidden_dimension], [batch_size x sequence_dimension] return rt, at This implementation is an improvement over the naive PyTorch implementation. It removes many of the views and transposes'''
