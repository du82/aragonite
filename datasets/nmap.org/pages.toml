["https://nmap.org/mailman/listinfo/announce"]
title = "announce Info Page"
full_description = "Nmap-hackers is a low-traffic (1 or 2 messages per month) moderated list intended to spotlight new versions of Nmap and related projects. Announcements and news relating to port scanning, Insecure.Org, or Nmap author Fyodor may also be posted. Light discussion is permitted where particularly insightful, relevant, and interesting. An unmoderated Nmap development list is also available for hardcore Nmap enthusiasts who want to help shape its development. Nmap problem reports and most discussion should be sent there instead of to nmap-hackers. To view prior postings, visit the Nmap-announce list archives at Seclists.org. Subscribe to announce by filling out the following form. You will be sent email requesting confirmation, to prevent others from gratuitously subscribing you. This is a hidden list, which means that the list of members is available only to the list administrator. You may enter a privacy password below. This provides only mild security, but should prevent others from messing with your subscription. Do not use a valuable password as it will occasionally be emailed back to you in cleartext. If you choose not to enter a password, one will be automatically generated for you, and it will be sent to you once you've confirmed your subscription. You can always request a mail-back of your password when you edit your personal options."
