full_description = '''Download Reference Guide Book Docs Zenmap GUI In the Movies Nmap Changelog Nmap 7.95 [2024-04-23] Nmap 7.94 [2023-05-19] Nmap 7.93 [2022-09-01] Nmap 7.92 [2021-08-07] Nmap 7.91 [2020-10-09] Nmap 7.90 [2020-10-03] Nmap 7.80 [2019-08-10] Nmap 7.70 [2018-03-20] Nmap 7.60 [2017-07-31] Nmap 7.50 [2017-06-13] Nmap 7.40 [2016-12-20] Nmap 7.31 [2016-10-20] Nmap 7.30 [2016-09-29] Nmap 7.12 [2016-03-29] Nmap 7.11 [2016-03-22] Nmap 7.10 [2016-03-17] Nmap 7.01 [2015-12-09] Nmap 7.00 [2015-11-19] Nmap 6.47 [2014-08-23] Nmap 6.46 [2014-04-18] Nmap 6.45 [2014-04-11] Nmap 6.40 [2013-07-29] Nmap 6.25 [2012-11-29] Nmap 6.01 [2012-06-16] Nmap 6.00 [2012-05-21] Nmap 5.51 [2011-02-11] Nmap 5.50 [2011-01-28] Nmap 5.35DC1 [2010-07-16] Nmap 5.21 [2010-01-27] Nmap 5.20 [2010-01-20] Nmap 5.00 [2009-07-16] Nmap 4.76 [2008-9-12] Nmap 4.75 [2008-9-7] Nmap 4.68 [2008-6-28] Nmap 4.65 [2008-6-1] Nmap 4.62 [2008-5-3] Nmap 4.60 [2008-3-15] Nmap 4.53 [2008-1-12] Nmap 4.52 [2008-1-1] Nmap 4.50 [2007-12-13] Nmap 4.20 [2006-12-7] Nmap 4.11 [2006-6-23] Nmap 4.10 [2006-6-12] Nmap 4.03 [2006-4-22] Nmap 4.01 [2006-2-9] Nmap 4.00 [2006-1-31] Nmap 3.9999 [2006-1-28] Nmap 3.999 [2006-1-26] Nmap 3.99 [2006-1-25] Nmap 3.95 [2005-12-8] Nmap 3.93 [2005-9-12] Nmap 3.91 [2005-9-11] Nmap 3.90 [2005-9-8] Nmap 3.81 [2005-2-7] Nmap 3.75 [2004-10-18] Nmap 3.70 [2004-8-31] Nmap 3.55 [2004-7-7] Nmap 3.50 [2004-1-18] Nmap 3.48 [2003-10-6] Nmap 3.45 [2003-9-15] Nmap 3.30 [2003-6-28] Nmap 3.28 [2003-6-14] Nmap 3.27 [2003-4-28] Nmap 3.26 [2003-4-24] Nmap 3.25 [2003-4-19] Nmap 3.20 [2003-3-18] Nmap 3.00 [2002-07-31] Nmap 2.53 [2000-05-08] Nmap 2.52 [2000-05-03] Nmap 2.51 [2000-04-29] Nmap 2.50 [2000-04-28] Nmap 2.12 [1999-04-04] Nmap 2.11 [1999-04-03] Nmap 2.10 Nmap 2.09 Nmap 2.08 [1999-02-16] Nmap 2.07 [1999-02-08] Nmap 2.06 [1999-02-08] Nmap 2.05 [1999-02-08] #Nmap Changelog ($Id: CHANGELOG 39079 2025-02-10 21:06:54Z dmiller $); -*-text-*- [Nping]Bind raw socket to device when possible. This was already done for IPv6, but was needed for IPv4 L3 tunnels. [ValdikSS] [Ncat]Ncat in connect mode no longer defaults to half-closed TCP connections. This makes it more compatible with other netcats. The -k option will enable the old behavior. See https://seclists.org/nmap-dev/2013/q1/188 [Daniel Miller] [Nsock][GH#2788]Fix an issue affecting Ncat where unread bytes in the SSL layer's buffer could not be read until more data arrived on the socket, which could lead to deadlock. [Daniel Miller] [Ncat][GH#2422]New Ncat option -q to delay quit after EOF on stdin, the same as traditional netcat's -q option. [Daniel Miller] [NSE][GH#1014][GH#2616]SSH NSE scripts now catch connection errors thrown by the libssh2 Lua binding, providing useful output instead of a backtrace. [Joshua Rogers, Daniel Miller] Nmap will now allow targets to be specified both on the command line and in an input file with -iL. Previously, if targets were provided in both places, only the targets in the input file would be scanned, and no notice was given that the command-line targets were ignored. [Daniel Miller] [GH#1451]Nmap now performs forward DNS lookups in parallel, using the same engine that has been reliably performing reverse-DNS lookups for nearly a decade. Scanning large lists of hostnames is now enormously faster and avoids the unresponsive wait for blocking system calls, so progress stats can be shown. In testing, resolving 1 million website names to both IPv4 and IPv6 took just over an hour. The previous system took 49 hours for the same data set! [Daniel Miller] [NSE][GH#2571][GH#2572][GH#2622][GH#2784]Various bug fixes in the mssql NSE library. [johnjaylward, nnposter] [NSE][GH#2925][GH#2917][GH#2924]Testing for acceptance of SSH keys for a given username caused heap corruption. [Julijan Nedic, nnposter] [NSE][GH#2919][GH#2917]Scripts were not able to load SSH public keys. from a file. [nnposter] [NSE][GH#2928][GH#2640]Encryption/decryption performed by the OpenSSL NSE module did not work correctly when the IV started with a null byte. [nnposter] [NSE][GH#2901][GH#2744][GH#2745]Arbitrary separator in stdnse.tohex() is now supported. Script smb-protocols now reports SMB dialects correctly. [nnposter] [NSE]ether_type inconsistency in packet.Frame has been resolved. Both Frame:new() and Frame:build_ether_frame() now use an integer. [nnposter] [GH#2900, GH#2896, GH#2897]Nmap is now able to scan IP protocol 255. [nnposter] Nmap 7.95 [2024-04-23] § Integrated over 4,000 of your IPv4 OS fingerprints. Added 336 signatures, bringing the new total to 6,036. Additions include iOS 15 & 16, macOS Ventura & Monterey, Linux 6.1, OpenBSD 7.1, and lwIP 2.2 Integrated over 2,500 service/version detection fingerprints. The signature count went up 1.4% to 12,089, including 9 new softmatches. We now detect 1,246 protocols, including new additions of grpc, mysqlx, essnet, remotemouse, and tuya. [Windows]Upgraded Npcap (our Windows raw packet capturing and transmission driver) from version 1.75 to the latest version 1.79. It includes many performance improvements, bug fixes and feature enhancements described at https://npcap.com/changelog. [NSE]Added four new scripts from the DINA community (https://github.com/DINA-community) for querying industrial control systems: hartip-info reads device information from devices using the Highway Addressable Remote Transducer protocol iec61850-mms queries devices using Manufacturing Message Specification requests. [Dennis Rösch, Max Helbig] multicast-profinet-discovery Sends a multicast PROFINET DCP Identify All message and prints the responses. [Stefan Eiwanger, DINA-community] profinet-cm-lookup queries the DCERPC endpoint mapper exposed via the PNIO-CM service. Improvements to OS detection fingerprint matching, including a syntax change for nmap-os-db that allows ranges within the TCP Options string. This leads to more concise and maintainable fingerprints. [Daniel Miller] Improved the OS detection engine by using a new source port for each retry. Scans from systems such as Windows that do not send RST for unsolicited SYN|ACK responses were previously unable to get a response in subsequent tries. [Daniel Miller] Several profile-guided optimizations of the port scan engine. [Daniel Miller] Upgraded included libraries: Lua 5.4.6, libpcre2 10.43, zlib 1.3.1, libssh2 1.11.0, liblinear 2.47 [GH#2639]Upgraded OpenSSL binaries (for the Windows builds and for RPMs) to version 3.0.13. This addresses various OpenSSL vulnerabilities which don't impact Nmap (full details are in the GH issue). [GH#2672]Fixed an issue where TCP Connect scan (-sT) on Windows would fail to open any sockets, leading to scans that never finish. [Daniel Miller] [Zenmap][Ndiff][GH#2649]Zenmap and Ndiff now use setuptools, not distutils for packaging. [Ncat][GH#2685]Fixed Ncat UDP server mode to not quit after EOF on stdin. Reported as Debian bug: https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1039613 [NSE]ssh-auth-methods will now print the pre-authentication banner text when available. Requires libssh2 1.11.0 or later. [Daniel Miller] [Zenmap][GH#2739]Fix a crash in Zenmap when changing a host comment. [NSE][GH#2766]Fix TLS 1.2 signature algorithms for EdDSA. [Daniel Roethlisberger] [Zenmap][GH#2706]RPM spec files now correctly require the python3 package, not python>=3 [GH#2731]Fix an out-of-bounds read which led to out-of-memory errors when duplicate addresses were used with --exclude [GH#2609]Fixed a memory leak in Nsock: compiled pcap filters were not freed. [GH#2658]Fixed a crash when using service name wildcards with -p, as in -p "http*" [NSE]Fixed DNS TXT record parsing bug which caused asn-query to fail in Nmap 7.80 and later. [David Fifield, Mike Pattrick] [NSE][GH#2727][GH#2728]Fixed packet size testing in KNX scripts [f0rw4rd] Nmap 7.94 [2023-05-19] § Zenmap and Ndiff now use Python 3! Thanks to the many contributors who made this effort possible: [GH#2088][GH#1176][Zenmap]Updated Zenmap to Python 3 and PyGObject. [Jakub Kulík] [GH#1807][GH#1176][Ndiff]Updated Ndiff to Python 3. [Brian Quigley] Additional Python 3 update fixes by Sam James, Daniel Miller. Special thanks to those who opened Python 3-related issues and pull requests: Eli Schwartz, Romain Leonard, Varunram Ganesh, Pavel Zhukov, Carey Balboa, Hasan Aliyev, and others. [Windows]Upgraded Npcap (our Windows raw packet capturing and transmission driver) from version 1.71 to the latest version 1.75. It includes dozens of performance improvements, bug fixes and feature enhancements described at https://npcap.com/changelog. Nmap now prints vendor names based on MAC address for MA-S (24-bit), MA-M (28-bit), and MA-L (36-bit) registrations instead of the fixed 3-byte MAC prefix used previously for lookups. Added partial silent-install support to the Nmap Windows installer. It previously didn't offer silent mode (/S) because the free/demo version of Npcap Windoes packet capturing driver that it needs and ships with doesn't include a silent installer. Now with the /S option, Nmap checks whether Npcap is already installed (either the free version or OEM) and will silently install itself if so. This is similar to how the Wireshark installer works and is particularly helpful for organizations that want to fully automate their Nmap (and Npcap) deployments. See https://nmap.org/nmap-silent-install for more details. Lots of profile-guided memory and processing improvements for Nmap, including OS fingerprint matching, probe matching and retransmission lookups for large hostgroups, and service name lookups. Overhauled Nmap's string interning and several other startup-related procedures to speed up start times, especially for scans using OS detection. [Daniel Miller] Integrated many of the most-submitted IPv4 OS fingerprints for recent versions of Windows, iOS, macOS, Linux, and BSD. Added 22 fingerprints, bringing the new total to 5700! [NSE][GH#548]Added the tftp-version script which requests a nonexistent file from a TFTP server and matches the error message to a database of known software. [Mak Kolybabi] [Ncat][GH#1223]Ncat can now accept "connections" from multiple UDP hosts in listen mode with the --keep-open option. This also enables --broker and --chat via UDP. [Daniel Miller] [GH#2575]Upgraded OpenSSL binaries (for the Windows builds and for RPM's) to version 3.0.8. This resolves some CVE's (CVE-2022-3602; CVE-2022-3786) which don't impact Nmap proper since it doesn't do certificate validation, but could possibly impact Ncat when the --ssl-verify option is used. Upgrade included libraries: zlib 1.2.13, Lua 5.4.4, libpcap 1.10.4 [GH#2532]Removed the bogus OpenSSL message from the Windows Nmap executable which looked like "NSOCK ERROR ssl_init_helper(): OpenSSL legacy provider failed to load." We actually already have the legacy provider built-in to our OpenSSL builds, and that's why loading the external one fails. [GH#2541]UDP port scan (-sU) and version scan (-sV) now both use the same data source, nmap-service-probes, for data payloads. Previously, the nmap-payloads file was used for port scan. Port scan responses will be used to kick-start the version matching process. [Daniel Miller] Nmap's service scan (-sV) can now probe the UDP service behind a DTLS tunnel, the same as it already does for TCP services with SSL/TLS encryption. The DTLSSessionReq probe has had its rarity lowered to 2 to allow it to be sent sooner in the scan. [Daniel Miller] [Ncat]Ncat in listen mode with --udp --ssl will use DTLS to secure incoming connections. [Daniel Miller] [GH#1023]Handle Internationalized Domain Names (IDN) like Яндекс.рф on platforms where getaddrinfo supports the AI_IDN flag. [Daniel Miller] [Ncat]Addressed an issue from the Debian bug tracker (https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=969314) regarding data received immediately after a SOCKS CONNECT response. Ncat can now be correctly used in the ProxyCommand option of OpenSSH. Improved DNS domain name parsing to avoid recursion and enforce name length limits, avoiding a theoretical stack overflow issue with certain crafted DNS server responses, reported by Philippe Antoine. [GH#2338][NSE]Fix mpint packing in ssh2 library, which was causing OpenSSH errors like "ssh_dispatch_run_fatal: bignum is negative" [Sami Loone] [GH#2507]Updates to the Japanese manpage translation by Taichi Kotake. [Ncat][GH#1026][GH#2426]Dramatically speed up Ncat transfers on Windows by avoiding a 125ms wait for every read from STDIN. [scriptjunkie] [GH#1192][Windows]Periodically reset the system idle timer to keep the system from going to sleep while scans are in process. This only affects port scans and OS detection scans, since NSE and version scan do not rely on timing data to adjust speed. Updated the Nmap Public Source License (NPSL) to Version 0.95. This just clarifies that the derivative works definition and all other license clauses only apply to parties who choose to accept the license in return for the special rights granted (such as Nmap redistribution rights). If a party can do everything they need to using copyright provisions outside of this license such as fair use, we support that and aren't trying to claim any control over their work. Versions of Nmap released under previous versions of the NPSL may also be used under the NPSL 0.95 terms. Avoid storing many small strings from IPv4 OS detection results in the global string_pool. These were effectively leaked after a host is done being scanned, since string_pool allocations are not freed until Nmap quits. Nmap 7.93 [2022-09-01] § This release commemorates Nmap's 25th anniversary! It all started with this September 1, 1997 Phrack article by Fyodor: https://nmap.org/p51-11.html. [Windows]Upgraded Npcap (our Windows raw packet capturing and transmission driver) from version 1.50 to the latest version 1.71. It includes dozens of performance improvements, bug fixes and feature enhancements described at https://npcap.com/changelog. Ensure Nmap builds with OpenSSL 3.0 using no deprecated API functions. Binaries for this release include OpenSSL 3.0.5. Upgrade included libraries: libssh2 1.10.0, zlib 1.2.12, Lua 5.3.6, libpcap 1.10.1 [GH#2416]Fix a bug that prevented Nmap from discovering interfaces on Linux when no IPv4 addresses were configured. [Daniel Miller, nnposter] [NSE][GH#2463]NSE "exception handling" with nmap.new_try() will no longer result in a stack traceback in debug output nor a "ERROR: script execution failed" message in script output, since the intended behavior has always been to end the script immediately without output. [Daniel Miller] [GH#2494]Update the Nmap output DTD to match actual output since the `<hosthint>` element was added in Nmap 7.90. [NSE][GH#2496]Fix newtargets support: since Nmap 7.92, scripts could not add targets in script pre-scanning phase. [Daniel Miller] [GH#2468]Scripts dhcp-discover and broadcast-dhcp-discover now support setting a client identifier. [nnposter] [GH#2331][GH#2471]Script oracle-tns-version was not reporting t'''
