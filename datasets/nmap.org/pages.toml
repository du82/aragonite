title = "Zenmap - Official cross-platform Nmap Security Scanner GUI"
description = "Zenmap is the official cross-platform GUI for the Nmap Security Scanner.  It is free and runs on Linux, Windows, Mac OS X, etc."
full_description = "Download Reference Guide Book Docs Zenmap GUI In the Movies Introduction Zenmap is the official Nmap Security Scanner GUI. It is a multi-platform (Linux, Windows, Mac OS X, BSD, etc.) free and open source application which aims to make Nmap easy for beginners to use while providing advanced features for experienced Nmap users. Frequently used scans can be saved as profiles to make them easy to run repeatedly. A command creator allows interactive creation of Nmap command lines. Scan results can be saved and viewed later. Saved scan results can be compared with one another to see how they differ. The results of recent scans are stored in a searchable database. You can download Zenmap (often packaged with Nmap itself) from the Nmap download page. Zenmap is quite intuitive, but you can learn more about using it from the Zenmap User's Guide or check out the Zenmap man page for some quick reference information. Screen shots Here are some Zenmap action shots (click for full res):"
