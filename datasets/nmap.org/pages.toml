title = "Nmap OEM Edition—Redistribution License"
description = "Nmap OEM Edition redistribution license for companies wishing to redistribute the Nmap Security Scanner with their products. Nmap features include host discovery, port scanning, OS detection, and the Nmap Scripting Engine"
full_description = "Download Reference Guide Book Docs Zenmap GUI In the Movies Nmap OEM Edition—Redistribution License The Nmap Security Scanner is a network discovery tool uses raw IP packets in novel ways to determine what hosts are available on the network, what services (application name and version) those hosts are offering, what operating systems (and OS versions) they are running, what type of packet filters/firewalls are in use, and dozens of other characteristics. and security auditing. It has been continuously developed and improved since the first release in 1997. Nmap is free for end users, and is trusted by millions of them. But the free Nmap license does not allow redistribution of Nmap with proprietary hardware or software products. For more than 20 years we have funded the project by selling OEM licenses to companies who want to embed Nmap within their products to handle network scanning. All major operating systems are supported, including binary packages for Windows, Linux, and Mac OS. The Windows package is an exclusive OEM Edition, custom tailored for this purpose with special features such as silent installer. Top Nmap OEM Redistribution License Features Redistribution rights—The free Nmap license does not allow redistribution or use of Nmap within proprietary hardware or software products, but an Nmap OEM License allows for unlimited redistribution either within a product line or across the whole company's product portfolio. Windows OEM Edition Builds—We provide special builds for OEM customers utilizing the Microsoft Windows platform. These include a silent installer which also silently installs our Npcap OEM Windows library for raw packet capture and transmission. It omits the Zenmap GUI (which licensees almost never need), cutting the installer size by more than half. It also reports itself as Nmap OEM so end-users who notice it on the add/remove Software screen or similar know that it's the officially licensed version of Nmap. Commercial support—Nmap OEM maintenance plans include commercial support to ensure any bugs you find are fixed promptly and all your technical questions answered. Regular updates—Nmap OEM maintenance plans also include update rights, so you always have access to the latest releases. We are constantly releasing updates with performance enhancements, bug fixes, and new features you can learn about from our changelog. Continuity—Nmap OEM licensees have a contract guaranteeing the availability and terms for their Nmap OEM usage, while the terms and restrictions for the free Nmap license change from time to time. Licensing revenue also funds continued Nmap development and improvements. This license is for companies that wish to redistribute or use Nmap within the products they distribute. Folks only wanting to use Nmap themselves or within their organization can already download and use it for free. It is possible that some end-users might still want to buy Nmap OEM for solely internal use. Perhaps they want the silent Windows installer, or commercial support, or just want to help fund the project. If this is the case, please contact sales@nmap.com and we will consider implementing a program similar to our Npcap OEM Internal-Use License. Nmap OEM releases are always made in conjunction with normal releases and the version numbers are the same. In fact, Nmap OEM licensees on non-Windows platforms (including Linux and Mac OS X) simply use our standard Nmap builds (or build it themselves). A special OEM build isn't really needed for those platforms since those Nmap builds already support silent installation and they have no need for the Npcap Windows driver. Nmap OEM Licensees may use any Nmap features except for the Zenmap GUI, which is generally not relevant for OEM customers and is stripped out of our Windows OEM builds to reduce installer size. Some of the most valuable features include: Host Discovery—determine which hosts are up and available on the network. Port Scanning—determine which TCP/UDP ports are open. OS Detection—guess the remote operating system and device type based on TCP/IP stack characteristics. Version Detection—interrogate open ports to determine the running protocol, application, and version number if possible. Nmap Scripting Engine—a growing library of more than 500 scripts for enhanced network discovery and vulnerability assessment. For example, it can be used to query windows machines for exact OS or detect dozens of common vulnerabilities. Our recommended integration approach is to install Nmap on the end-user system using the silent-install feature and then have your application execute Nmap when needed, requesting XML formatted results (-oX) which you would then parse with any XML parser. The license also allows other integration approaches, such as parsing of Nmap's normal output format, processing Nmap data files directly, or even integrating Nmap source code into your application. Please note that this whole page describes the licenses that we currently sell. Previously sold licenses may have different terms and those are the terms which apply. If you have questions about your specific license, please contact sales@nmap.com. License Prices & Terms To keep things simple our standard Nmap license involves no per-seat royalties--just a reasonable one-time license buy-out fee and an optional annual maintenance fee which includes all new Nmap releases as well as commercial support. That maintenance fee never increases for as long as you keep renewing. We also offer a term license which includes redistribution rights and maintenance for a quarterly fee which must be paid every 3 months for as long as you are selling new products containing Nmap. The term license fee never increases either. Prices are in U.S. Dollars (USD) based on the size of company buying the license, broken into four tiers. This is because larger companies are usually able to derive more value from Nmap OEM by leveraging it at a greater scale. Larger companies generally cost us more to support as well. Prices are based on the whole company size, not just an individual division or development team. The prices are locked in after purchase, so they don't increase as companies grow later. Our Nmap OEM Enterprise Redistribution License is for our largest customers. The perpetual license to use Nmap OEM in a product line or category costs $119,980, plus an optional annual maintenance fee of $29,980. The quarterly term license option (which includes maintenance) costs $17,980 every 3 months. Our Nmap OEM Mid-Sized Company Redistribution License provides a discount for mid-sized customers. The perpetual license to use Nmap OEM in all company products costs $89,980, plus an optional annual maintenance fee of $22,980. The quarterly term license option (which includes maintenance) costs $13,980 every 3 months. To qualify for this license, a company must meet all these criteria: 500 or fewer employees Revenue (not profit) less than US$200 million in their most recent fiscal year If publicly traded, their market capitalization must be less than $1 billion Our Nmap OEM Small/Startup Company Redistribution License covers the smallest of our customers. The perpetual license to use Nmap OEM in all company products costs US$59,980, plus an optional annual maintenance fee of $17,980. The quarterly term license option (which includes maintenance) costs $9,980 per 3 months. To qualify for this license, a company must have 50 or fewer employees and no more than US$10 million revenue in the most recent fiscal year. Subsidiaries of larger companies only qualify for the small/startup license if the parent company also qualifies as such. All perpetual licenses include a six-month trial period during which you can cancel for any reason and receive a full refund of all money paid (including maintenance). The term license is only a 3-month commitment and can also be terminated with a full refund during the first 30 days of the initial quarter. We also provide the standard version of Nmap that you can fully test internally before purchase. The rights Nmap OEM customers enjoy are spelled out in the license certificate that we send to customers (filled out of course). It includes support, indemnification, warranty, updates, etc. We also offer a contract version (PDF format, editable MS Word document) for companies who prefer a contract signed by both parties. Downloading and Installing Nmap OEM Licensees who wish to use Nmap on Windows should use our special Nmap OEM packages. Each release has a self-installer named nmap-VERSION-setup.exe and a zip package named nmap-VERSION-win32.zip. We recommend packaging the self-installer and then calling it in silent mode during your own installer's execution. This handles upgrades, dependencies (like Npcap and MS Visual C++ redistributable packages), registry setting, and so forth. But the zip option is also available for manual installation. Installation instructions for both package formats are available here. The Windows OEM packages can be found in this distribution directory. If you don't remember your company's username and password, please contact sales@nmap.com. Be sure to download the latest version unless you specifically require an older one. Note that updating Nmap to later versions requires a maintenance (support and upgrades) subscription. If you aren't sure whether you have an active maintenance subscription, email sales@nmap.com and we'll check for you. Nmap OEM licenses also include redistribution rights to our Npcap OEM Windows packet capturing and transmission software if you are only using it for Nmap. You only need to buy an Npcap OEM redistribution license if you want to use Npcap directly from your (non-Nmap) software. Npcap OEM is included with our Nmap OEM Windows builds and licensees with Nmap update rights also receive new Npcap OEM versions as they are released. This can be handy in case a licensee wants to ship a newer version of Npcap than the one which comes with Nmap, or if they just want to test new Npcap releases before they are integrated into Nmap. You can download Npcap OEM here using your Nmap OEM download credentials. Licensees distributing our official Linux or Mac OS X binary packages, or those who compile Nmap themselves on any platform, should download the standard version of Nmap instead. We do not currently supply official OEM builds on these platforms because the special features aren't very relevant on those platforms. Licensees may also install Nmap using third-party software repositors (such as using “apt-get nmap” on Ubuntu Linux or “yum install nmap” on Red Hat Linux. Keep in mind that third party software repositories do not always keep their Nmap packages up to date. Some of them are frequently years behind the latest Nmap releases. Support and Documentation for Nmap OEM The Nmap OEM program is mostly about a different license allowing for redistribution as well as commercial support and other benefits. The software itself is identical on most platforms, and even the special Windows OEM edition only differs in a few small ways such as the silent installer support and Npcap OEM inclusion. So Nmap OEM uses the standard (and extensive) Nmap documentation. The primary documentation is the Nmap book, Nmap Network Scanning, which is now available in its entirety for free online. It's also available through standard booksellers. Further documentation is available from the Nmap documentation page. Licensees with an active maintenance (support and updates) subscription have special access to report bugs or ask Nmap technical support questions. If you are a licensee and don't have the support contact information, please email sales@nmap.com and we will send it to you. Purchase Process (Redistribution License) While we hope to set up an online order form for immediate purchase, we currently have a more manual process. To buy an Nmap OEM license, you or your preferred reseller should send a message to sales@nmap.com with the following information: Your company name if it isn't obvious from your email address or email signature. We need the end user company name if you are a reseller. Which license you want. This depends on your current company size as described here and would be either the Nmap OEM Enterprise Redistribution License, Nmap OEM Mid-Sized Company Redistribution License, or Nmap OEM Small/Startup Company Redistribution License. If this is the Enterprise Redistribution License, the license covers a named product line or category. Please include the product line name or category that you are interested in shipping with Nmap OEM. This is not needed for the smaller company licenses since those companies usually have fewer products. Do you want the perpetual license or quarterly term license? The term license is paid every 3 months until you cease redistributing Nmap OEM and notify us of license termination. Companies choosing the quarterly license must either set up auto-payments or pay the automated invoices that we email to them. We can handle initial vendor onboarding for the term license, but not individual (per payment) purchase orders, enterprise payment portals, etc. If it's a perpetual license, do you want 5 years of updates and support (with a 20% prepayment discount) or 1 year of maintenance (with possible renewals later), or no maintenance at all? The term license always includes maintenance as part of the quarterly fee. Once we receive your request, we will send a contract draft and formal quote with instructions for payment by wire transfer, ACH direct deposit, check, or PayPal. You can pay that directly or begin your company's procurement process for vendor onboarding, purchase order request, etc. As soon as a contract is signed, we will activate your license and send you the following: Account credentials for you and your team to download current and (if you purchased updates) future Nmap OEM and Npcap releases. We send these to everyone, but they are only needed if you will be shipping Nmap on the Windows OS. Contacts for submitting support requests (assuming you purchased support). Support includes bug reports as well as any technical questions you might have about Nmap. FAQ - Frequently Asked Nmap OEM Questions Is maintenance (support and updates) optional? For our normal (perpetual) license, maintenance is optional but highly recommended because it extends the perpetual license to include all new versions released during the maintenance period. And Nmap is under very active development. You can read about all our recent performance improvements, feature enhancements, and bug fixes. Maintenance also includes commercial support whenever you need it as well as priority with new feature requests. And the price never increases as long as you don't let it lapse for more than 120 days. For our quarterly term license, maintenance (including all updates and commercial support) is included along with redistribution rights in t"
