["https://nmap.org/mailman/listinfo/dev"]
title = "dev Info Page"
full_description = '''The Nmap dev list is intended to facilitate the development of the free Nmap Security Scanner. It provides an unmoderated forum for people to contribute ideas, patches, suggestions, etc. We also discuss the pros and cons of proposed changes to Nmap. Thus this list also serves as a sort of developmental "steering committee". New (test/beta) versions of Nmap may sometimes be released here prior to general availability for quality assurance purposes. Anyone hardcore enough to subscribe to nmap-dev should probably also subscribe to the Nmap announcement list, a moderated list for Nmap-related announcements. This list is reasonably high volume (sometimes 10+ posts per day). Prior postings to the list are available at the Nmap dev archives at Seclists.org. Non-members can post, but such posts go through moderation to prevent spam. Subscribe to dev by filling out the following form. You will be sent email requesting confirmation, to prevent others from gratuitously subscribing you. This is a hidden list, which means that the list of members is available only to the list administrator. You may enter a privacy password below. This provides only mild security, but should prevent others from messing with your subscription. Do not use a valuable password as it will occasionally be emailed back to you in cleartext. If you choose not to enter a password, one will be automatically generated for you, and it will be sent to you once you've confirmed your subscription. You can always request a mail-back of your password when you edit your personal options.'''
