full_description = "Download Reference Guide Book Docs Zenmap GUI In the Movies NSEDoc NSEDoc Portal NSE Documentation Nmap API NSE Tutorial Scripts Libraries Categories auth broadcast brute default discovery dos exploit external fuzzer intrusive malware safe version vuln Example Usage Script Output Script dns-random-srcport Script types: portrule Categories: external, intrusive Download: https://svn.nmap.org/nmap/scripts/dns-random-srcport.nse Script Summary Checks a DNS server for the predictable-port recursion vulnerability. Predictable source ports can make a DNS server vulnerable to cache poisoning attacks (see CVE-2008-1447). The script works by querying porttest.dns-oarc.net (see https://www.dns-oarc.net/oarc/services/porttest). Be aware that any targets against which this script is run will be sent to and potentially recorded by one or more DNS servers and the porttest server. In addition your IP address will be sent along with the porttest query to the DNS server running on the target. Example Usage nmap -sU -p 53 --script=dns-random-srcport <target> Script Output PORT STATE SERVICE REASON 53/udp open domain udp-response |_dns-random-srcport: X.X.X.X is GREAT: 26 queries in 1.2 seconds from 26 ports with std dev 17905 Requires comm nmap shortport string stdnse Author: Script: Brandon Enright <bmenrigh@ucsd.edu> porttest.dns-oarc.net: Duane Wessels <wessels@dns-oarc.net> License: Same as Nmap--See https://nmap.org/book/man-legal.html"
