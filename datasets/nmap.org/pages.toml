title = "Download the Free Nmap Security Scanner for Linux/Mac/Windows"
description = """
Official Download site for the Free
Nmap Security Scanner. Helps with network security, administration, and general hacking"""
full_description = "Download Reference Guide Book Docs Zenmap GUI In the Movies Downloading Nmap Get the latest Nmap for your system: Windows macOS Linux (RPM) Any other OS (source code) Older versions (and sometimes newer test releases) are available from the Nmap release archive (and really old ones are in dist-old). For the more security-paranoid (smart) users, GPG detached signatures and SHA-1 hashes for each release are available in the sigs directory (verification instructions). Before downloading, be sure to read the relevant sections for your platform from the Nmap Install Guide. The most important changes (features, bugfixes, etc) in each Nmap version are described in the Changelog. Using Nmap is covered in the Reference Guide, and don't forget to read the other available documentation, particularly the official book Nmap Network Scanning! Nmap users are encouraged to subscribe to the Nmap-hackers mailing list. It is a low volume (7 posts in 2015), moderated list for the most important announcements about Nmap, Insecure.org, and related projects. You can join the 128,953 current subscribers (as of September 2017) by submitting your email address here: (or subscribe with custom options from the Nmap-hackers list info page) You can also get updates by liking Nmap on Facebook or following us @nmap on Twitter. Nmap is distributed with source code under custom license terms similar to (and derived from) the GNU General Public License, as noted in the copyright page. Microsoft Windows binaries Please read the Windows section of the Install Guide for limitations and installation instructions for the Windows version of Nmap. It's provided as an executable self-installer which includes Nmap's dependencies and the Zenmap GUI. We support Nmap on Windows 7 and newer, as well as Windows Server 2008 R2 and newer. We also maintain a guide for users who must run Nmap on earlier Windows releases.. Note: The version of Npcap included in our installers may not always be the latest version. If you experience problems or just want the latest and greatest version, download and install the latest Npcap release. Latest stable release self-installer: nmap-7.95-setup.exe Latest Npcap release self-installer: npcap-1.80.exe We have written post-install usage instructions. Please notify us if you encounter any problems or have suggestions for the installer. Linux RPM Source and Binaries Many popular Linux distributions (Redhat, Mandrake, Suse, etc) use the RPM package management system for quick and easy binary package installation. We have written a detailed guide to installing our RPM packages, though these simple commands usually do the trick: rpm -vhU https://nmap.org/dist/nmap-7.95-3.x86_64.rpm rpm -vhU https://nmap.org/dist/zenmap-7.95-1.noarch.rpm rpm -vhU https://nmap.org/dist/ncat-7.95-3.x86_64.rpm rpm -vhU https://nmap.org/dist/nping-0.7.95-3.x86_64.rpm You can also download and install the RPMs yourself: Latest stable release: x86-64 (64-bit Linux) Nmap RPM: nmap-7.95-3.x86_64.rpm x86-64 (64-bit Linux) Ncat RPM: ncat-7.95-3.x86_64.rpm x86-64 (64-bit Linux) Nping RPM: nping-0.7.95-3.x86_64.rpm Optional Zenmap GUI (all platforms): zenmap-7.95-1.noarch.rpm Source RPM (includes Nmap, Zenmap, Ncat, and Nping): nmap-7.95-1.src.rpm Mac OS X Binaries Nmap binaries for Apple macOS (x86-64) are distributed as a disk image file containing an installer. The installer allows installing Nmap, Zenmap, Ncat, and Ndiff. The programs have been tested on Mac OS X 10.9 and later. See the Mac OS X Nmap install page for more details. Users of PowerPC (PPC) Mac machines, which Apple ceased selling in 2006, should see this page instead for support information. Latest stable release installer: nmap-7.95.dmg Source Code Distribution This is the traditional compile-it-yourself format. The Nmap tarball compiles under Linux, Mac OS X, Windows, and many UNIX platforms (Solaris, Free/Net/OpenBSD, etc.) It includes Zenmap, the GUI frontend. Detailed Linux/BSD/Solaris compilation instructions and options are provided here, though this usually does the trick: bzip2 -cd nmap-7.95.tar.bz2 | tar xvf - cd nmap-7.95 ./configure make su root make install Most Windows users install with our Windows executable installer, but we also provide Windows source code compilation instructions. Most Mac OS X users install with our Mac installer, but we also provide Mac OS X source code compilation instructions. If you are compiling Nmap anyway, you might prefer to get the very latest code from our SVN source code repository or the Nmap GitHub mirror rather than downloading a tarball here. Latest stable Nmap release tarball: nmap-7.95.tar.bz2 (or gzip compressed) Other Operating Systems Many other operating systems support Nmap so well that I have no need to create and distribute binary packages myself. You can choose to use the packages below, or compile the source distribution, which is often newer. We have created installation pages for the following platforms: Linux (all distributions) Microsoft Windows Mac OS X FreeBSD, OpenBSD, and NetBSD Sun Solaris Amiga, HP-UX, and Other Platforms"
