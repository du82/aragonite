["https://nmap.org/5"]
title = "Nmap 5.00 Release Notes"
description = """
Insecure.Org is pleased to announce
the immediate, free availability of the Nmap Security Scanner version
5.00 from https://nmap.org/"""
full_description = '''Nmap 5.00 Released July 16, 2009 -- Insecure.Org is pleased to announce the immediate, free availability of the Nmap Security Scanner version 5.00 from https://nmap.org/. This is the first stable release since 4.76 (last September), and the first major release since the 4.50 release in 2007. Dozens of development releases led up to this. Considering all the changes, we consider this the most important Nmap release since 1997, and we recommend that all current users upgrade. About Nmap Nmap ("Network Mapper") is a free and open source (license) utility for network exploration or security auditing. Many systems and network administrators also find it useful for tasks such as network inventory, managing service upgrade schedules, and monitoring host or service uptime. Nmap uses raw IP packets in novel ways to determine what hosts are available on the network, what services (application name and version) those hosts are offering, what operating systems (and OS versions) they are running, what type of packet filters/firewalls are in use, and dozens of other characteristics. It was designed to rapidly scan large networks, but works fine against single hosts. Nmap runs on all major computer operating systems, and official binary packages are available for Linux, Windows, and Mac OS X. In addition to the classic command-line Nmap executable, the Nmap suite includes an advanced GUI and results viewer (Zenmap), a flexible data transfer, redirection, and debugging tool (Ncat), and a utility for comparing scan results (Ndiff). Nmap was named “Security Product of the Year” by Linux Journal, Info World, LinuxQuestions.Org, and Codetalker Digest. It was even featured in eight movies, including The Matrix Reloaded, Die Hard 4, and The Bourne Ultimatum. As free software, we don't have any sort of advertising budget. So please spread the word that Nmap 5.00 is now available! Top 5 Improvements in Nmap 5 Before we go into the detailed changes, here are the top 5 improvements in Nmap 5: The new Ncat tool aims to be your Swiss Army Knife for data transfer, redirection, and debugging. We released a whole users' guide detailing security testing and network administration tasks made easy with Ncat. The addition of the Ndiff scan comparison tool completes Nmap's growth into a whole suite of applications which work together to serve network administrators and security practitioners. Ndiff makes it easy to automatically scan your network daily and report on any changes (systems coming up or going down or changes to the software services they are running). The other two tools now packaged with Nmap itself are Ncat and the much improved Zenmap GUI and results viewer. Nmap performance has improved dramatically. We spent last summer scanning much of the Internet and merging that data with internal enterprise scan logs to determine the most commonly open ports. This allows Nmap to scan fewer ports by default while finding more open ports. We also added a fixed-rate scan engine so you can bypass Nmap's congestion control algorithms and scan at exactly the rate (packets per second) you specify. We released Nmap Network Scanning, the official Nmap guide to network discovery and security scanning. From explaining port scanning basics for novices to detailing low-level packet crafting methods used by advanced hackers, this book suits all levels of security and networking professionals. A 42-page reference guide documents every Nmap feature and option, while the rest of the book demonstrates how to apply those features to quickly solve real-world tasks. More than half the book is available in the free online edition. The Nmap Scripting Engine (NSE) is one of Nmap's most powerful and flexible features. It allows users to write (and share) simple scripts to automate a wide variety of networking tasks. Those scripts are then executed in parallel with the speed and efficiency you expect from Nmap. All existing scripts have been improved, and 32 new ones added. New scripts include a whole bunch of MSRPC/NetBIOS attacks, queries, and vulnerability probes; open proxy detection; whois and AS number lookup queries; brute force attack scripts against the SNMP and POP3 protocols; and many more. All NSE scripts and modules are described in the new NSE documentation portal. News articles and reviews Please mail Fyodor if you see (or write) reviews/articles on the Nmap 5.00 release. Here are the ones seen so far: Reasonably detailed (or with many comments) English articles: ITWire: Nmap Turns Five Slashdot: Nmap 5.00 Released, With Many Improvements SecurityFocus: Nmap gets a major upgrade, LoveMyTool: Exclusive Review of Nmap 5.0 (by Tim O'Neill) Reddit: Nmap 5.00 Released, considered by maintainers as most important release since 1997 Ed Skoudis: Nmap 5.00 Initial Impressions - Niiiice! Hacker News: Nmap 5.00 Released Risky Business: Nmap Reloaded: Biggest Release Since 1997 Linux Weekly News: Nmap 5.00 Released InternetNews.com: Nmap 5 improves open source network security auditing Michael Rash (Cipherdyne): Nmap-5.00, Zenmap, and ndiff IronGeek.Com added a new video: NDiff: Comparing two Nmap 5 scans to find changes in your network Twitter has literally thousands of tweets about 5.00 (you may need to page back to July 16). AllVoices: Powerful network security tool Nmap reaches version 5.00 The H: Version 5.0 of the Nmap network scanner released Sans Internet Storm Center: Nmap 5.0 Released Linuxologist: Nmap 5.0 Released: Most Important Since 1997! Brief mentions: Wireshark.Org, Securiteam, Dark Reading, Linux Today, CGISecurity.Com, Security4All, Help Net Security, Red Gecko, Peter Van Eeckhoutte, Security Database, Owl Linux, Priveon Labs Non-English articles: Arabic: Linux AC, iSecur1ty.org Czech: ABC Linuxu, Root.cz Chinese: Solidot, Netsecurity.51cto.com Dutch: Tweakers.net, Security.nl French: Silicon.fr, LinuxFR.org German: Golem.de, Heise online, Pro-Linux.de, PC Welt, Menzer.net, Secorvo Security News (PDF) Russian: OpenNet.ru, Xakep.ru, Linux.org.ru Spanish: Viva Linux, Barrapunto, menéame, Linux Maya, Iniqua, A por Linux, Portal Chileno de Seguridad Informatica Others: Version 2 (Danish), hup.hu (Hungarian), BR-Linux.Org (Portuguese), IDG.se (Swedish) Journalists (anyone writing about the Nmap release) are welcome to use any of the text or screen shots on this page. Example run and screen shots Nmap 5.00 provides a wealth of information about remote systems, as shown in this sample scan: # nmap -A -T4 scanme.nmap.org 207.68.200.30 Starting Nmap 5.00 ( https://nmap.org ) at 2009-07-13 16:22 PDT Interesting ports on scanme.nmap.org (64.13.134.52): Not shown: 994 filtered ports PORT STATE SERVICE VERSION 22/tcp open ssh OpenSSH 4.3 (protocol 2.0) | ssh-hostkey: 1024 03:5f:d3:9d:95:74:8a:d0:8d:70:17:9a:bf:93:84:13 (DSA) |_ 2048 fa:af:76:4c:b0:f4:4b:83:a4:6e:70:9f:a1:ec:51:0c (RSA) 53/tcp open domain ISC BIND 9.3.4 70/tcp closed gopher 80/tcp open http Apache httpd 2.2.2 ((Fedora)) |_ html-title: Go ahead and ScanMe! 113/tcp closed auth 31337/tcp closed Elite Device type: general purpose Running: Linux 2.6.X OS details: Linux 2.6.20-1 (Fedora Core 5) Interesting ports on 207.68.200.30: Not shown: 991 filtered ports PORT STATE SERVICE VERSION 53/tcp open domain Microsoft DNS 6.0.6001 88/tcp open kerberos-sec Microsoft Windows kerberos-sec 135/tcp open msrpc Microsoft Windows RPC 139/tcp open netbios-ssn 389/tcp open ldap 445/tcp open microsoft-ds Microsoft Windows 2003 microsoft-ds 464/tcp open kpasswd5? 49158/tcp open ncacn_http Microsoft Windows RPC over HTTP 1.0 49175/tcp open msrpc Microsoft Windows RPC Running: Microsoft Windows 2008|Vista Host script results: | smb-os-discovery: Windows Server (R) 2008 Enterprise 6001 Service Pack 1 | LAN Manager: Windows Server (R) 2008 Enterprise 6.0 | Name: MSAPPLELAB\APPLELAB2K8 |_ System time: 2009-07-13 16:17:07 UTC-7 | nbstat: NetBIOS name: APPLELAB2K8, NetBIOS user: , NetBIOS MAC: 00:1a:a0:9a:a3:96 | Name: APPLELAB2K8<00> Flags: |_ Name: MSAPPLELAB<00> Flags: TRACEROUTE (using port 135/tcp) HOP RTT ADDRESS [Cut first 8 lines for brevity] 9 36.88 ge-10-0.hsa1.Seattle1.Level3.net (4.68.105.6) 10 36.61 unknown.Level3.net (209.245.176.2) 11 41.21 207.68.200.30 Nmap done: 2 IP addresses (2 hosts up) scanned in 120.26 seconds # (Note: some output was modified to fit results on screen) Here are some Nmap and Zenmap 5.00 screen shots (click thumbnails for full resolution): Classic command-line Nmap Zenmap's new network topology graphing mode Zenmap showing all discovered HTTP services Zenmap displaying Nmap output Change details The Nmap Changelog describes nearly 600 significant improvements since our last major release (4.50). Here are the highlights: Nmap Scripting Engine (NSE) The Nmap Scripting Engine (NSE) is one of Nmap's most powerful and flexible features. It allows users to write (and share) simple scripts to automate a wide variety of networking tasks. Those scripts are then executed in parallel with the speed and efficiency you expect from Nmap. It existed in Nmap 4.50, but has been dramatically improved: Every script has been improved, and the number of scripts has grown nearly 50% to 59. Ron Bowes embarked on a massive MSRPC/NETBIOS project to allow Nmap to interrogate Windows machines much more completely. He added six NSE libraries (msrpc, msrpcperformance, msrpctypes, netbios, smb, and smbauth) and 14 scripts (p2p-conficker, smb-brute, smb-check-vulns, smb-enum-domains, smb-enum-processes, smb-enum-sessions, smb-enum-shares, smb-enum-users, smb-os-discovery, smb-pwdump, smb-security-mode, smb-server-stats, and smb-system-info). He also wrote a detailed paper on the new scripts. Nmap was one of the first scanners to remotely detect the Conficker worm thanks to smb-check-vulns, and p2p-conficker. Other new scripts include: asn-query—Maps IP addresses to autonomous system (AS) numbers. auth-spoof—Checks for an identd (auth) server which is spoofing its replies. banner—A simple banner grabber which connects to an open TCP port and prints out anything sent by the listening service within five seconds. dns-random-srcport—Checks a DNS server for the predictable-port recursion vulnerability. Predictable source ports can make a DNS server vulnerable to cache poisoning attacks (see CVE-2008-1447). dns-random-txid—Checks a DNS server for the predictable-TXID DNS recursion vulnerability. Predictable TXID values can make a DNS server vulnerable to cache poisoning attacks (see CVE-2008-1447). ftp-bounce—Checks to see if an FTP server allows port scanning using the FTP bounce method. http-iis-webdav-vuln—Checks for a vulnerability in IIS 5.1/6.0 that allows arbitrary users to access secured WebDAV folders by searching for a password-protected folder and attempting to access it. This vulnerability was patched in Microsoft Security Bulletin MS09-020. http-passwd—Checks if a web server is vulnerable to directory traversal by attempting to retrieve /etc/passwd using various traversal methods such as requesting ../../../../etc/passwd. imap-capabilities—Retrieves IMAP email server capabilities. mysql-info—Connects to a MySQL server and prints information such as the protocol and version numbers, thread ID, status, capabilities, and the password salt. pop3-brute—Tries to log into a POP3 account by guessing usernames and passwords. pop3-capabilities—Retrieves POP3 email server capabilities. rpcinfo—Connects to portmapper and fetches a list of all registered programs. snmp-brute—Attempts to find an SNMP community string by brute force guessing. socks-open-proxy—Checks if an open socks proxy is running on the target. upnp-info—Attempts to extract system information from the UPnP service. whois—Queries the WHOIS services of Regional Internet Registries (RIR) and attempts to retrieve information about the IP Address Assignment which contains the Target IP Address. The set of new libraries is equally impressive. Modules are all listed here (scroll down to "Modules"). Introduced the NSE Documentation Portal which documents every NSE script and library included with Nmap. It is generated from NSEDoc comments embedded in scripts. Scripts are available for download on this site as well. We also dramatically improved the NSE Guide. NSE now supports run-time interaction so you know when it will complete, and the --host-timeout option so you can define when it completes. Support for -S (source IP address) and --ip-options has been added to the NSE and version detection subsystems. Added Boolean Operators for --script. You may now use ("and", "or", or "not") combined with categories, filenames, and wildcarded filenames to match a set of files. A new default category includes the scripts which run by default when NSE is requested. NSE can now be used in combination with ping scan (e.g. "-sP --script") so that you can execute host scripts without needing to perform a port scan. Zenmap graphical front-end and results viewer Zenmap is a cross-platform (Linux, Windows, Mac OS X, etc.) Nmap GUI and results viewer which supports all Nmap options. It aims to make Nmap easy for beginners to use while providing advanced features for experienced Nmap users. Frequently used scans can be saved as profiles to make them easy to run repeatedly. A command creator allows interactive creation of Nmap command lines. Scan results can be saved and viewed later. Saved scan results can be compared with one another to see how they differ. The results of recent scans are stored in a searchable database. While Zenmap already existed in Nmap 4.50, it has improved dramatically since then: While Nmap stands for “Network Mapper”, it hasn't been able to actually draw you a map of the network—until now! The new Zenmap Network Topology feature provides an interactive, animated visualization of the hosts on a network and connections between them. The scan source is (initially) in the center, with other hosts on a series of concentric circles which represent the number of hops away they are from the source. Nodes are connected by lines representing discovered paths between them. Read the full details (and oogle the pretty pictures) in our article on Surfing the Network Topology. Topology views can be saved as a PNG, postscript, PDF, or SVG image. The scan aggregation feature allows you to combine the results of many Nmap scans into one view. When one scan is finished, you may start another in the same window. Results of the new scan are seamlessly merged into one view. Zenmap has been internationalized and translated by volunteers into four languages (French, German, Brazilian Portuguese, and Croatian). We have instructions on using an existing translation and we're always looking for volunteers to translate Zenmap into your native language. Overhauled the default list of scan profiles to provide a much more diverse and useful set of default profile options. If users don't like any of these canned scan commands, they can easily create their own in the Profile Editor. '''
year_published = 2025
clearnet = "https://nmap.org/5"
