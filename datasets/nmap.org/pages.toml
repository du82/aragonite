["https://nmap.org/nsedoc/modules/smb.html"]
title = "smb NSE Library — Nmap Scripting Engine documentation"
description = "Documentation of functions and script-args provided by the smb Nmap Scripting Engine library."
full_description = '''Download Reference Guide Book Docs Zenmap GUI In the Movies NSEDoc NSEDoc Portal NSE Documentation Nmap API NSE Tutorial Scripts Libraries Categories auth broadcast brute default discovery dos exploit external fuzzer intrusive malware safe version vuln Script Arguments Functions Library smb Implements functionality related to Server Message Block (SMB, an extension of CIFS) traffic, which is a Windows protocol. SMB traffic is normally sent to/from ports 139 or 445 of Windows systems. Other systems implement SMB as well, including Samba and a lot of embedded devices. Some of them implement it properly and many of them not. Although the protocol has been documented decently well by Samba and others, many 3rd party implementations are broken or make assumptions. Even Samba's and Windows' implementations aren't completely compatible. As a result, creating an implementation that accepts everything is a bit of a minefield. Microsoft's extensive documentation is available at the following URLs: SMB: http://msdn.microsoft.com/en-us/library/cc246231(v=prot.13).aspx CIFS: http://msdn.microsoft.com/en-us/library/ee442092(v=prot.13).aspx Where possible, this implementation, since it's intended for scanning, will attempt to accept any invalid implementations it can, and fail gracefully if it can't. This has been tested against a great number of weird implementations, and it now works against all of them. The intention of this library is to eventually handle all aspects of the SMB protocol. That being said, I'm only implementing the pieces that I (Ron Bowes) need. If you require something more, let me know and I'll put it on my todo list. A programmer using this library should already have some knowledge of the SMB protocol, although a lot isn't necessary. You can pick up a lot by looking at the code. The basic login/logoff is this: [connect] C->S SMB_COM_NEGOTIATE S->C SMB_COM_NEGOTIATE C->S SMB_COM_SESSION_SETUP_ANDX S->C SMB_COM_SESSION_SETUP_ANDX C->S SMB_COM_TREE_CONNECT_ANDX S->C SMB_COM_TREE_CONNECT_ANDX ... C->S SMB_COM_TREE_DISCONNECT S->C SMB_COM_TREE_DISCONNECT C->S SMB_COM_LOGOFF_ANDX S->C SMB_COM_LOGOFF_ANDX [disconnect] In terms of functions here, the protocol is: status, smbstate = smb.start(host) status, err = smb.negotiate_protocol(smbstate, {}) status, err = smb.start_session(smbstate, {}) status, err = smb.tree_connect(smbstate, path, {}) ... status, err = smb.tree_disconnect(smbstate) status, err = smb.logoff(smbstate) status, err = smb.stop(smbstate) The stop function will automatically call tree_disconnect and logoff, cleaning up the session, if it hasn't been done already. To initially begin the connection, there are two options: 1) Attempt to start a raw session over 445, if it's open. 2) Attempt to start a NetBIOS session over 139. Although the protocol's the same, it requires a session request packet. That packet requires the computer's name, which is requested using a NBSTAT probe over UDP port 137. Once it's connected, a SMB_COM_NEGOTIATE packet is sent, requesting the protocol "NT LM 0.12", which is the most commonly supported one. Among other things, the server's response contains the host's security level, the system time, and the computer/domain name. Some systems will refuse to use that protocol and return "-1" or "1" instead of 0. If that's detected, we kill the connection (because the protocol following won't work). If that's successful, SMB_COM_SESSION_SETUP_ANDX is sent. It is essentially the logon packet, where the username, domain, and password are sent to the server for verification. The username and password are generally picked up from the program parameters, which are set when running a script, or from the registry where it can be set by other scripts (for example, smb-brute.nse). However, they can also be passed as parameters to the function, which will override any other username/password set. If a username and password are set, they are used for the first login attempt. If a login fails, or they weren't set, a connection as the 'GUEST' account with a blank password is attempted. If that fails, then a NULL session is established, which should always work. The username/password will give the highest access level, GUEST will give lower access, and NULL will give the lowest (often, NULL will give no access). The actual login protocol used by SMB_COM_SESSION_SETUP_ANDX is explained in detail in smbauth.lua. Thanks go to Christopher R. Hertel and his book Implementing CIFS, which taught me everything I know about Microsoft's protocols. Additionally, I used Samba's list of error codes for my constants. Although I don't believe they would be covered by GPL, since they're public now anyways, but I'm not a lawyer and, if somebody feels differently, let me know and we can sort this out. Scripts that use this module can use the script arguments listed below example of using these script arguments: nmap --script=smb-<script>.nse --script-args=smbuser=ron,smbpass=iagotest2k3,smbbasic=1,smbsign=force <host> Author: Ron Bowes <ron@skullsecurity.net> Copyright © Same as Nmap--See https://nmap.org/book/man-legal.html Source: https://svn.nmap.org/nmap/nselib/smb.lua Script Arguments smbbasic Forces the authentication to use basic security, as opposed to "extended security". Against most modern systems, extended security should work, but there may be cases where you want to force basic. There's a chance that you'll get better results for enumerating users if you turn on basic authentication. smbsign Controls whether or not server signatures are checked in SMB packets. By default, on Windows, server signatures aren't enabled or required. By default, this library will always sign packets if it knows how, and will check signatures if the server says to. Possible values are: force: Always check server signatures, even if server says it doesn't support them (will probably fail, but is technically more secure). negotiate: [default] Use signatures if server supports them. ignore: Never check server signatures. Not recommended. disable: Don't send signatures, at all, and don't check the server's. not recommended. More information on signatures can be found in smbauth.lua. randomseed Set to a value to change the filenames/service names that are randomly generated. smbport Override the default port choice. If smbport is open, it's used. It's assumed to be the same protocol as port 445, not port 139. Since it probably isn't possible to change Windows' ports normally, this is mostly useful if you're bouncing through a relay or something. Functions add_account (host, username, domain, password, password_hash, hash_type, is_admin) Wrapper around smbauth.add_account. close_file (smb, overrides) This sends a SMB request to close a file (or a pipe). create_file (smb, path, overrides) This sends a SMB request to open or create a file. delete_file (smb, path, overrides) This sends a SMB request to delete a file (or a pipe). disable_extended (smb) Turn off extended security negotiations for this connection. file_delete (host, share, remotefile) Delete a file from the remote machine file_read (host, share, remotefile, use_anonymous, overrides) Write given data to the remote machine on the given share. This is similar to file_upload, except the data is given as a string, not a file. file_upload (host, localfile, share, remotefile, overrides, encoded) Upload a file from the local machine to the remote machine, on the given share. file_write (host, data, share, remotefile, use_anonymous) Write given data to the remote machine on the given share. This is similar to file_upload, except the data is given as a string, not a file. files_exist (host, share, files, overrides) Check how many files, in a given list, exist on the given share. find_files (smbstate, fname, options) List files based on a pattern within a given share and directory get_account (host) Wrapper around smbauth.get_account. get_fqpn (host, sharename) Returns the fully qualified path name (FQPN) for shares. This is required for modern versions of Windows. Returns \\<ip>\<sharename> when successful. Otherwise, returns the same share name. get_os (host) Retrieve information about the host's operating system. This should always be possible to call, as long as there isn't already a SMB session established. get_overrides (username, domain, password, password_hash, hash_type, overrides) Create an 'overrides' table get_overrides_anonymous (overrides) Get an 'overrides' table for the anonymous user get_port (host) Determines whether or not SMB checks are possible on this host, and, if they are, which port is best to use. This is how it decides: get_socket_info (host) Basically a wrapper around socket:get_info, except that it also makes a SMB connection before calling the get_info function. Returns the mac address as well, for convenience. get_status_name (status) Convert a status number from the SMB header into a status name, returning an error message (not nil) if it wasn't found. get_uniqueish_name (host, extension, seed) Generate a string that's somewhat unique, but is based on factors that won't change on a host. get_windows_version (os) Converts numbered Windows version strings ("Windows 5.0", "Windows 5.1") to names ("Windows 2000", "Windows XP"). is_admin (host, username, domain, password, password_hash, hash_type) Determines, as accurately as possible, whether or not an account is an administrator. If there is an error, 'false' is simply returned. list_dialects (host, overrides) Returns list of supported dialects for SMBv1, SMBv2 and SMBv3. logoff (smb, overrides) Logs off the current user. Strictly speaking this isn't necessary, but it's the polite thing to do. negotiate_protocol (smb, overrides) Wrapper function to negotiate the protocol to use in the SMB connection. By default it attempts to negotiate with using following dialects: NT LM 12.0 (SMBv1) negotiate_v1 (smb, overrides) Negotiates SMBv1 connections read_file (smb, offset, count, overrides) This sends a SMB request to read from a file (or a pipe). send_transaction_named_pipe (smb, function_parameters, function_data, pipe, no_setup, overrides) This is the core of making MSRPC calls. It sends out a MSRPC packet with the given parameters and data. share_anonymous_can_read (host, share) Check whether or not a share is accessible by the anonymous user. Assumes that share_host_returns_proper_error has been called and returns true. share_anonymous_can_write (host, share) Determine whether or not the anonymous user has write access on the share. This is done by creating then deleting a file. share_find_writable (host) Find a share that the current user can write to. Return it, along with its path. If no share could be found, an error is returned. If the path cannot be determined, the returned path is nil. share_get_details (host, share) Get all the details we can about the share. These details are stored in a table and returned. share_get_list (host) Retrieve a list of fileshares, along with any details that could be pulled. This is the core of smb-enum-shares.nse, but can also be used by any script that needs to find an open share. share_host_returns_proper_error (host, use_anonymous) Determine whether or not a host will accept any share name (I've seen this on certain systems; it's bad, because it means we cannot tell whether or not a share exists). share_user_can_read (host, share) Check whether or not a share is accessible by the current user. Assumes that share_host_returns_proper_error has been called and returns true. share_user_can_write (host, share) Determine whether or not the current user has read or read/write access on the share. This is done by creating then deleting a file. smb_encode_header (smb, command, overrides) Creates a string containing a SMB packet header. The header looks like this: smb_read (smb, read_data) Reads the next packet from the socket, and parses it into the header, parameters, and data. smb_send (smb, header, parameters, data, overrides) Prepends the NetBIOS header to the packet, which is essentially the length, encoded in 4 bytes of big endian, and sends it out. start (host) Begins a SMB session, automatically determining the best way to connect. start_ex (host, bool_negotiate_protocol, bool_start_session, str_tree_connect, str_create_file, bool_disable_extended, overrides) Initiates a SMB connection over whichever port it can, then optionally sends the common initialization packets. start_netbios (host, port, name) Begins a SMB session over NetBIOS. start_raw (host, port) Begins a raw SMB session, likely over port 445. Since nothing extra is required, this function simply makes a connection and returns the socket. start_session (smb, overrides, log_errors) Sends out SMB_COM_SESSION_SETUP_ANDX, which attempts to log a user in. stop (smb) Kills the SMB connection and closes the socket. tree_connect (smb, path, overrides) Sends out SMB_COM_SESSION_TREE_CONNECT_ANDX, which attempts to connect to a share. tree_disconnect (smb, overrides) Disconnects a tree session. Should be called before logging off and disconnecting. write_file (smb, write_data, offset, overrides) This sends a SMB request to write to a file (or a pipe). Functions add_account (host, username, domain, password, password_hash, hash_type, is_admin) Wrapper around smbauth.add_account. Parameters host username domain password password_hash hash_type is_admin close_file (smb, overrides) This sends a SMB request to close a file (or a pipe). Parameters smbThe SMB object associated with the connection overridesThe overrides table Return value: (status, result) If status is false, result is an error message. Otherwise, result is undefined. create_file (smb, path, overrides) This sends a SMB request to open or create a file. Most of the parameters I pass here are used directly from a packetlog, especially the various permissions fields and flags. I might make this more adjustable in the future, but this has been working for me. Parameters smbThe SMB object associated with the connection pathThe path of the file or pipe to open overrides[optional] Overrides for various fields Return value: (status, result) If status is false, result is an error message. Otherwise, result is a table containing a lot of different elements, the most important one being 'fid', the handle to the opened file. delete_file (smb, path, overrides) This sends a SMB request to delete a file (or a pipe). Parameters smbThe SMB object associated with the connection pathThe path of the file to delete overridesThe overrides table Return value: (status, result) If status is false, result is an error message. Otherwise, result is undefined. disable_extended (smb) Turn off extended security negotiations for this connection. There are a few reasons you might want to do that, the main ones being that extended security is going to be marginally slower and it's not going to give the same level of information in some cases (namely, it doesn't present the se'''
