["https://nmap.org/nsedoc/modules/msrpc.html"]
title = "msrpc NSE Library — Nmap Scripting Engine documentation"
description = "Documentation of functions and script-args provided by the msrpc Nmap Scripting Engine library."
full_description = '''Download Reference Guide Book Docs Zenmap GUI In the Movies NSEDoc NSEDoc Portal NSE Documentation Nmap API NSE Tutorial Scripts Libraries Categories auth broadcast brute default discovery dos exploit external fuzzer intrusive malware safe version vuln Functions Library msrpc By making heavy use of the smb library, this library will call various MSRPC functions. The functions used here can be accessed over TCP ports 445 and 139, with an established session. A NULL session (the default) will work for some functions and operating systems (or configurations), but not for others. To make use of these function calls, a SMB session with the server has to be established. This can be done manually with the smb library, or the function start_smb can be called. A session has to be created, then the IPC$ tree opened. Next, the interface has to be bound. The bind() function will take care of that. After that, you're free to call any function that's part of that interface. In other words, if you bind to the SAMR interface, you can only call the samr_ functions, for lsa_ functions, bind to the LSA interface, etc. Although functions can technically be called in any order, many functions depend on the value returned by other functions. I indicate those in the function comments, so keep an eye out. SAMR functions, for example, require a call to connect4. Something to note is that these functions, for the most part, return a whole ton of stuff in a table; basically, everything that is returned by the function. Generally, if you want to know exactly what you have access to, either display the returned data with a print_table-type function, or check the documentation (Samba 4.0's .idl files (in samba_4.0/source/librpc/idl; see below for link) are what I based the names on). The parameters for each function are converted to a string of bytes in a process called "marshalling". Functions here take arguments that match what a user would logically want to send. These are marshalled by using functions in the msrpctypes module. Those functions require a table of values that isn't very use friendly; as such, it's generated, when possible, in the functions in this module. The value returned, on the other hand, is returned directly to the user; I don't want to limit what data they can use, and it's difficult to rely on servers to format it consistently (sometimes a null is returned, and other times an empty array or blank string), so I put the onus on the scripts to deal with the returned values. When implementing this, I used Wireshark's output significantly, as well as Samba's .idl files for reference: http://websvn.samba.org/cgi-bin/viewcvs.cgi/branches/SAMBA_4_0/source/librpc/idl/. I'm not a lawyer, but I don't expect that this is a breach of Samba's copyright -- if it is, please talk to me and I'll make arrangements to re-license this or to remove references to Samba. Revised 07/25/2012 - added Printer Spooler Service (spoolss) RPC functions and constants [Aleksandar Nikolic] Author: Ron Bowes <ron@skullsecurity.net> Copyright © Same as Nmap--See https://nmap.org/book/man-legal.html Source: https://svn.nmap.org/nmap/nselib/msrpc.lua Functions atsvc_jobadd (smbstate, server, command, time) Calls the function JobAdd, which schedules a process to be run on the remote machine. bind (smbstate, interface_uuid, interface_version, transfer_syntax) Bind to a MSRPC interface. call_function (smbstate, opnum, arguments) Call a MSRPC function on the remote server, with the given opnum and arguments. call_lanmanapi (smbstate, opnum, paramdesc, datadesc, data) LANMAN API calls use different conventions than everything else, so make a separate function for them. DNSSERVER_Query (smbstate, server_name, zone, operation) Issues type specific information queries to server. This method is obsoleted by R_DnssrvQuery2. enum_shares (host) Attempts to enumerate the shares on a remote system using MSRPC calls. Without a user account, this will likely fail against a modern system, but will succeed against Windows 2000. epmapper_lookup (smbstate, handle) Lookup endpoint mapper for endpoints get_pad (data, align, pad_byte) Makes a pad for alignment get_server_stats (host) Retrieves statistical information about the given server. get_share_info (host, name) Attempts to retrieve additional information about a share. Will fail unless we have administrative access. get_user_list (host) Gets the best possible list of user accounts on the remote system using every available method. lsa_close (smbstate, handle) Call the close function, which closes a session created with a lsa_openpolicy-style function lsa_enum_users (host) Attempt to enumerate users using LSA functions. lsa_lookupnames2 (smbstate, policy_handle, names) Call the LsarLookupNames2 function, to convert the server's name into a sid. lsa_lookupsids2 (smbstate, policy_handle, sids) Call the LsarLookupSids2 function, to convert a list of SIDs to their names lsa_openpolicy2 (smbstate, server) Call the LsarOpenPolicy2 function, to obtain a "policy handle". This must be done before calling many of the LSA functions. lsa_SidType_tostr (val) A proxy to a msrpctypes function that converts a SidType to an English string. rap_netserverenum2 (smbstate, domain, server_type, detail_level) Queries the (master) browser service for a list of server that it manages RRAS_marshall_RequestBuffer (RB_PCBIndex, RB_ReqType, RB_Buffer) The RequestBuffer is a generic information container used by the RasRpcSubmitRequest method to set or retrieve information on RRAS server. This method performs serialization of RequestBuffer structure. Note: This structure is not an IDL specification and as such is not translated into NDR. RRAS_SubmitRequest (smbstate, pReqBuffer, dwcbBufSize) The RasRpcSubmitRequest method retrieves or sets the configuration data on RRAS server. samr_AcctFlags_tostr (val) A proxy to a msrpctypes function that converts a AcctFlags to an English string. samr_close (smbstate, handle) Call the close function, which closes a handle of any type (for example, domain_handle or connect_handle) samr_connect4 (smbstate, server) Call the connect4 function, to obtain a "connect handle". samr_enum_users (host) Attempt to enumerate users using SAMR functions. samr_enumdomainaliases (smbstate, domain_handle) Call the EnumDomainAliases function, which retrieves a list of groups for a given domain samr_enumdomains (smbstate, connect_handle) Call the enumdomains function, which returns a list of all domains in use by the system. samr_enumdomainusers (smbstate, domain_handle) Call EnumDomainUsers, which returns a list of users only. To get more information about the users, the QueryDisplayInfo() function can be used. samr_getaliasmembership (smbstate, alias_handle, args) Call the GetAliasMembership function. Sends the "raw" data, without marshaling. samr_getmembersinalias (smbstate, alias_handle) Call the GetMembersInAlias function, which retrieves a list of users in a group. samr_lookupdomain (smbstate, connect_handle, domain) Call the LookupDomain function, which converts a domain's name into its sid, which is required to do operations on the domain. samr_lookupnames (smbstate, domain_handle, names) Call the EnumDomainAliases function, which retrieves a list of groups for a given domain samr_openalias (smbstate, domain_handle, rid) Call the OpenAlias function, which gets a handle to a group. samr_opendomain (smbstate, connect_handle, sid) Call OpenDomain, which returns a handle to the domain identified by the given sid. This is required before calling certain functions. samr_PasswordProperties_tostr (val) A proxy to a msrpctypes function that converts a PasswordProperties to an English string. samr_querydisplayinfo (smbstate, domain_handle, index, count) Call QueryDisplayInfo, which returns a list of users with accounts on the system, as well as extra information about them (their full name and description). samr_querydomaininfo2 (smbstate, domain_handle, level) Call QueryDomainInfo2, which grabs various data about a domain. service_create (host, servicename, path) Create a "service" on a remote machine. service_delete (host, servicename) Delete a service on the remote machine based on its name. I don't recommend deleting any services that you didn't create. service_start (host, servicename, args) Start a service on the remote machine based on its name. For example, to start the registry service, this can be called on "RemoteRegistry". service_stop (host, servicename) Stop a service on the remote machine based on its name. For example, to stop the registry service, this can be called on "RemoteRegistry". spoolss_abort_printer (smbstate, printer_handle) Call the RpcAbortPrinter() function whose opnum is 21. spoolss_end_doc_printer (smbstate, printer_handle) Call the EndDocPrinter() function whose opnum is 23. spoolss_open_printer (smbstate, printer) Call the RpcOpenPrinterEx() function whose opnum is 69. spoolss_start_doc_printer (smbstate, printer_handle, filename) Call the RpcStartDocPrinter() function whose opnum is 17. spoolss_write_printer (smbstate, printer_handle, data) Call the RpcWritePrinter() function whose opnum is 19. srvsvc_netpathcanonicalize (smbstate, server, path) Call the NetPathCanonicalize() function, which is the target of ms08-067. srvsvc_netpathcompare (smbstate, server, path1, path2, pathtype, pathflags) Call the NetPathCompare() function, which indirectly calls NetPathCanonicalize(), the target of ms08-067. I'm currently only using this to trigger ms08-067. srvsvc_netservergetstatistics (smbstate, server) Calls the NetServerGetStatistics function, which grabs a bunch of statistics on the server. This function requires administrator access to call. srvsvc_netsessenum (smbstate, server) Call the NetSessEnum function, which gets a list of active sessions on the host. For this function, a session is defined as a connection to a file share. srvsvc_netshareenumall (smbstate, server) Call the MSRPC function netshareenumall on the remote system. srvsvc_netsharegetinfo (smbstate, server, share, level) Call the MSRPC function netsharegetinfo on the remote system. This function retrieves extra information about a share on the system. srvsvc_ShareType_tostr (val) A proxy to a msrpctypes function that converts a ShareType to an English string. start_smb (host, path, disable_extended, overrides) This is a wrapper around the SMB class, designed to get SMB going quickly for MSRPC calls. stop_smb (state) A wrapper around the smb.stop function. string_uuid_to_exe (uuid) Helper function that maps known UUIDs to corresponding exe/services. svcctl_closeservicehandle (smbstate, handle) Calls the function CloseServiceHandle, which releases a handle. svcctl_controlservice (smbstate, handle, control) Calls the function ControlService, which can send various commands to the service. svcctl_createservicew (smbstate, handle, service_name, display_name, path) Calls the function CreateServiceW, which creates a service on the remote machine. This should be deleted with DeleteService when finished. svcctl_deleteservice (smbstate, handle) Calls the function DeleteService, which deletes a service on the remote machine. This service has to opened with OpenServiceW or similar functions. svcctl_openscmanagera (smbstate, machinename) Calls the function OpenSCManagerA, which gets a handle to the service manager. Should be closed with CloseServiceHandle when finished. svcctl_openscmanagerw (smbstate, machinename, access_mask) Calls the function OpenSCManagerW, which gets a handle to the service manager. Should be closed with CloseServiceHandle when finished. svcctl_openservicew (smbstate, handle, name, access_mask) Calls the function OpenServiceW, which gets a handle to the service. Should be closed with CloseServiceHandle when finished. svcctl_queryservicestatus (smbstate, handle, control) Calls the function QueryServiceStatus, which gets the state information about the service. svcctl_startservicew (smbstate, handle, args) Calls the function StartServiceW, which starts a service. Requires a handle created by OpenServiceW. uuid_to_string (uuid) Helper function to convert binary UUID representation to usual string. winreg_closekey (smbstate, handle) Calls the function CloseKey, which closes an opened handle. Strictly speaking, this doesn't have to be called (Windows will close the key for you), but it's good manners to clean up after yourself. winreg_enumkey (smbstate, handle, index, name) Calls the Windows registry function EnumKey, which returns a single key under the given handle, at the index of 'index'. winreg_openhkcu (smbstate) Call the OpenHKCU function, to obtain a handle to the HKEY_CURRENT_USER hive winreg_openhklm (smbstate) Call the OpenHKLM function, to obtain a handle to the HKEY_LOCAL_MACHINE hive winreg_openhkpd (smbstate) Call the OpenHKPD function, to obtain a handle to the hidden HKEY_PERFORMANCE_DATA hive winreg_openhku (smbstate) Call the OpenHKU function, to obtain a handle to the HKEY_USERS hive winreg_openkey (smbstate, handle, keyname) Calls the function OpenKey, which obtains a handle to a named key. winreg_queryinfokey (smbstate, handle) Calls the function QueryInfoKey, which obtains information about an opened key. winreg_queryvalue (smbstate, handle, value) Calls the function QueryValue, which returns the value of the requested key. Functions atsvc_jobadd (smbstate, server, command, time) Calls the function JobAdd, which schedules a process to be run on the remote machine. This requires administrator privileges to run, and the command itself runs as SYSTEM. Parameters smbstateThe SMB state table. serverThe IP or Hostname of the server (seems to be ignored but it's a good idea to have it) commandThe command to run on the remote machine. The appropriate file(s) already have to be there, and this should be a full path. time[optional] The time at which to run the command. Default: 5 seconds from when the user logged in. bind (smbstate, interface_uuid, interface_version, transfer_syntax) Bind to a MSRPC interface. Two common interfaces are SAML and SRVSVC, and can be found as constants at the top of this file. Once this function has successfully returned, any MSRPC call can be made (provided it doesn't depend on results from other MSRPC calls). Parameters smbstateThe SMB state table interface_uuidThe interface to bind to. There are constants defined for these (SAMR_UUID, etc.) interface_versionThe interface version to use. There are constants at the top (SAMR_VERSION, etc.) transfer_syntaxThe transfer syntax to use. I don't really know what this is, but the value was always the same on my tests. You can use the constant at the top (TRANSFER_SYNTAX), or just set this parameter to 'nil'. Return value: (status, result) If status is false, result is an error message. Otherwise, result is a table of values, none of which are especially useful. call_function (smbstate, opnum, arguments) Call a MSRPC function on the remote server, '''
