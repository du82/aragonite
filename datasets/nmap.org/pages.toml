["https://nmap.org/nsedoc/modules/msrpctypes.html"]
title = "msrpctypes NSE Library — Nmap Scripting Engine documentation"
description = "Documentation of functions and script-args provided by the msrpctypes Nmap Scripting Engine library."
full_description = '''Download Reference Guide Book Docs Zenmap GUI In the Movies NSEDoc NSEDoc Portal NSE Documentation Nmap API NSE Tutorial Scripts Libraries Categories auth broadcast brute default discovery dos exploit external fuzzer intrusive malware safe version vuln Functions Library msrpctypes This module was written to marshall parameters for Microsoft RPC (MSRPC) calls. The values passed in and out are based on structs defined by the protocol, and documented by Samba developers. For detailed breakdowns of the types, take a look at Samba 4.0's .idl files. There is nothing simple about how this all comes together, so I'll take some time to explain how it's done. This is fairly technical and, when it comes right down to it, unnecessary for how to use these functions (although if you want to write one of these, you best understand it). There are base types, like int32 and int16. These are marshalled the way you'd expect (converted to a 4- or 2-byte little endian string). The only trick with these is that they have to end up aligned on 4-byte boundaries. So, a 2-byte integer requires 2 bytes of padding, and a 1-byte integer requires 3 bytes of padding. The functions marshall_int32, marshall_int16, etc. will marshall the base types, and unmarshall_int32, unmarshall_int16, etc. will unmarshall them. Strings are a little bit trickier. A string is preceded by three 32-bit values: the max length, the offset, and the length. Additionally, strings may or may not be null terminated, depending on where they're being used. For more information on strings, see the comments on marshall_unicode. The functions marshall_unicode and unmarshall_unicode can be used to marshall/unmarshall strings. Pointers also have interesting properties. A pointer is preceded by a 4-byte value called (at least by Wireshark) the "referent id". For a valid pointer, this can be anything except 0 (I use 'NMAP' for it). If it's '0', then it's a null pointer and the data doesn't actually follow. To help clarify, a pointer to the integer '4' could be marshalled as the hex string 78 56 34 12 04 00 00 00 (the referent_id is 0x12345678 and the integer itself is 0x00000004). If the integer is nil, then it's marshalled as 00 00 00 00, which is simply a referent_id of 0. From the perspective of the program, pointers can be marshalled by using the "_ptr" versions of normal functions (for example, marshall_int32_ptr and unmarshall_unicode_ptr. From the perspective of functions within this module, especially functions for marshalling structs and arrays, the marshall_ptr and unmarshall_ptr functions should be used. These can marshall any data type; the marshalling function is passed as a parameter. So far, this is fairly straight forward. Arrays are where everything falls apart. An array of basic types is simply the types themselves, preceded by the "max length" of the array (which can be longer than the actual length). When pointers are used in an array, however, things get hairy. The 'referent_id's of the pointers are all put at the start of the array, along with the base types. Then, the data is put at the end of the array, for all the referent_ids that aren't null. Let's say you have four strings, "abc", "def", null, and "jkl", in an array. The array would look like this: 0x00200000 (referent_id for "abc") 0x00400000 (referent_id for "def") 0x00000000 (null referent_id) 0x00800000 (referent_id for "jkl") "abc" (note that this also has the standard string stuff, the max_length, offset, and actual_length) "def" "ghi" If you mix in a base type, it goes at the front along with the referent_ids. So, let's say you have a structure that contains two integers and a string. You have an array of these. It would encode like this: 0x00200000 (referent_id for the string in the first struct) 0x00000001 (first integer in the first struct) 0x00000002 (second integer in the first struct) 0x00400000 (referent_id for the string in the second struct) 0x00000003 (first integer in the second struct) 0x00000004 (second integer in the second struct) "string1" (contains max_length, offset, and actual_length) "string2" From the perspective of the program, arrays shouldn't need to be marshalled/unmarshalled, this is tricky and should be left up to functions within this module. Functions within this module should use marshall_array and unmarshall_array to interact with arrays. These take callback functions for the datatype being stored in the array; these callback functions have to be in a particular format, so care should be taken when writing them. In particular, the first parameter has to be location, which is used to separate the header (the part with the referent_ids) and the body (the part with the pointer data). These are explained more thoroughly in the function headers. Structs are handled the same as arrays. The referent_ids and base types go at the top, and the values being pointed to go at the bottom. An array of struct, as has already been shown, will have all the base types and referent_ids for all the members at the top, and all the values for all the pointers at the bottom. Structs tend to be custom functions. Sometimes, these functions are passed as the callback to marshall_ptr or marshall_array (and the equivalent unmarshall_ functions). This means that the custom struct functions have to be able to split themselves into the base types and the pointer data automatically. For an example, see the functions that have already been written. In the case where you need to unmarshall the same struct from both an array and a pointer, there's an issue; they require different prototypes. There's really no way to directly fix this, at least, none that I could come up with, so I write a function called unmarshall_struct. unmarshall_struct basically calls a struct unmarshalling function the same way unmarshall_array would. This is a bit of a kludge, but it's the best I could come up with. There are different sections in here, which correspond to "families" of types. I modeled these after Samba's .idl files. MISC corresponds to misc.idl, LSA to lsa.idl, etc. Each of these sections has possible dependencies; for example, SAMR functions use LSA strings, and everything uses SECURITY and MISC. So the order is important -- dependencies have to go above the module. The datatypes used here are modeled after the datatypes used by Microsoft's functions. Each function that represents a struct will have the struct definition in its comment; and that struct (or the closest representation to it) will be returned. Often, this requires scripts to access something like result['names']['names'][0]['name'], which is rather unwieldy, but I decided that following Microsoft's definitions was the most usable way for many reasons. I find the best way to figure out how to work a function is to call a print_table()-style function on the result and look at how the response is laid out. Many datatypes are automatically encoded when sent and decoded when received to make life easier for developers. Some examples are: All absolute time values will be seconds from 1970 All relative time values will be in seconds (this includes the hyper datatype); when possible, the milliseconds/microseconds (as far down as we have access to) will be preserved as a decimal All enumerations will be a string representing the constant (which can be converted to a user-readable string using one of the _tostr functions); what that means is, enumeration values are never used, only the names SIDs will be converted to user-readable strings in the standard format (S-x-y-...) GUIDs are stored as tables of values; however, I might change this to a string representation at some point Source: https://svn.nmap.org/nmap/nselib/msrpctypes.lua Functions lsa_LookupNamesLevel_tostr (val) Convert a lsa_LookupNamesLevel value to a string that can be shown to the user. This is based on the _str table. lsa_SidType_tostr (val) Convert a lsa_SidType value to a string that can be shown to the user. This is based on the _str table. marshall_array (array) Marshalls an array. marshall_ascii (str, max_length) Marshall a null-terminated ascii string, with the length/maxlength prepended. Very similar to marshall_unicode, except it's ascii and the null terminator is always used. marshall_ascii_ptr (str, max_length) Marshall a pointer to an ascii string. marshall_atsvc_DaysOfMonth (flags) Marshall a atsvc_DaysOfMonth. This datatype is tied to the table above with that name. marshall_atsvc_DaysOfWeek (flags) Marshall a atsvc_DaysOfWeek. This datatype is tied to the table above with that name. marshall_atsvc_Flags (flags) Marshall a atsvc_Flags. This datatype is tied to the table above with that name. marshall_atsvc_JobInfo (command, time) Marshall a JobInfo struct. marshall_dom_sid2 (sid) Marshall a dom_sid struct marshall_int16 (int16, pad) Marshall an int16 marshall_int16_ptr (int16, pad) Marshall a pointer to an int16 marshall_int32 (int32) Marshall an int32 marshall_int32_array (data) Marshall an array of int32 values. marshall_int32_ptr (int32) Marshall a pointer to an int32 marshall_int64 (int64) Marshall an int64. This is simply an 8-byte integer inserted into the buffer, nothing fancy. marshall_int64_ptr (int64) Marshall a pointer to an int64. marshall_int8 (int8, pad) Marshall an int8 marshall_int8_array (data, max_length) Marshall an array of int8s, with an optional max_length set. marshall_int8_array_ptr (data, max_length) Marshall a pointer to an array of int8s. marshall_int8_ptr (int8, pad) Marshall a pointer to an int8 marshall_lsa_LookupNamesLevel (names_level) Marshall a lsa_LookupNamesLevel. This datatype is tied to the table above with that name. marshall_lsa_ObjectAttribute () Marshall a lsa_ObjectAttribute struct marshall_lsa_QosInfo () Marshall a lsa_QosInfo struct marshall_lsa_SidArray (sids) Marshall a lsa_SidArray struct marshall_lsa_SidType (sid_type) Marshall a lsa_SidType. This datatype is tied to the table above with that name. marshall_lsa_String (str, max_length) Public version of marshall_lsa_String_internal -- see that function on that for more information. This version doesn't require a location, so it's suitable to be a public function. marshall_lsa_String_array (strings) Marshall an array of lsa_String objects. This is a perfect demonstration of how to use marshall_array. marshall_lsa_String_array2 (strings) Basically the same as marshall_lsa_String_array, except it has a different structure marshall_lsa_TransNameArray2 (names) Marshall a lsa_TransNameArray2 struct marshall_lsa_TransSidArray2 (sids) Marshall a lsa_TransSidArray2 struct marshall_NTTIME (time) Marshalls an NTTIME. marshall_NTTIME_ptr (time) Marshalls an NTTIME*. marshall_policy_handle (policy_handle) Marshalls a policy_handle, which looks like this: marshall_samr_AcctFlags (flags) Marshall a samr_AcctFlags. This datatype is tied to the table above with that name. marshall_samr_ConnectAccessMask (accessmask) Marshall a samr_ConnectAccessMask. This datatype is tied to the table above with that name. marshall_samr_DomainAccessMask (accessmask) Marshall a samr_DomainAccessMask. This datatype is tied to the table above with that name. marshall_samr_PasswordProperties (properties) Marshall a samr_PasswordProperties. This datatype is tied to the table above with that name. marshall_srvsvc_NetSessCtr (level, data) Marshall the top-level NetShareCtr. This is a union of a bunch of different containers: marshall_srvsvc_NetSessCtr10 (NetSessCtr10) Marshall a NetSessCtr (session container) type 10. marshall_srvsvc_NetShareCtr (level, data) Marshall the top-level NetShareCtr. This is a union of a bunch of different containers: marshall_srvsvc_NetShareCtr0 (NetShareCtr0) Marshall a NetShareCtr (container) type 0. marshall_srvsvc_NetShareCtr1 (NetShareCtr1) Marshall a NetShareCtr (container) type 1. marshall_srvsvc_NetShareCtr2 (NetShareCtr2) Marshall a NetShareCtr (container) type 2. marshall_srvsvc_ShareType (sharetype) Marshall a srvsvc_ShareType. This datatype is tied to the table above with that name. marshall_svcctl_ControlCode (flags) Marshall a svcctl_ControlCode. This datatype is tied to the table above with that name. marshall_svcctl_State (flags) Marshall a svcctl_State. This datatype is tied to the table above with that name. marshall_svcctl_Type (flags) Marshall a svcctl_Type. This datatype is tied to the table above with that name. marshall_unicode (str, do_null, max_length) Marshall a string that is in the format: [string,charset(UTF16)] uint16 *str marshall_unicode_array (strings, do_null) Marshall an array of unicode strings. This is a perfect demonstration of how to use marshall_array. marshall_unicode_array_ptr (strings, do_null) Marshall a pointer to an array of unicode strings. See marshall_unicode_array for more information. marshall_unicode_ptr (str, do_null, max_length) Marshall a pointer to a unicode string. marshall_winreg_AccessMask (accessmask) Marshall a winreg_AccessMask. marshall_winreg_String (table, max_length) A winreg_String has the same makeup as a winreg_StringBuf, as far as I can tell, so delegate to that function. marshall_winreg_StringBuf (table, max_length) A winreg_stringbuf is a buffer that holds a null-terminated string. It can have a max size that's different from its actual size. marshall_winreg_StringBuf_ptr (table, max_length) Marshall a winreg_StringBuffer pointer. Same as marshall_winreg_StringBuf, except the string can be nil. marshall_winreg_Type (winregtype) Marshall a winreg_Type. This datatype is tied to the table above with that name. marshall_winreg_Type_ptr (winreg_type) Marshall a pointer to a winreg_Type. This datatype is tied to the table above with that name. samr_AcctFlags_tostr (val) Convert a samr_AcctFlags value to a string that can be shown to the user. This is based on the _str table. samr_ConnectAccessMask_tostr (val) Convert a samr_ConnectAccessMask value to a string that can be shown to the user. This is based on the _str table. samr_DomainAccessMask_tostr (val) Convert a samr_DomainAccessMask value to a string that can be shown to the user. This is based on the _str table. samr_PasswordProperties_tostr (val) Convert a samr_PasswordProperties value to a string that can be shown to the user. This is based on the _str table. srvsvc_ShareType_tostr (val) Convert a srvsvc_ShareType value to a string that can be shown to the user. This is based on the _str table. string_to_unicode (string, do_null) Convert a string to Unicode (UTF-16 LE), optionally add a null terminator, and align it to 4-byte boundaries. svcctl_ControlCode_tostr (val) Convert a svcctl_ControlCode value to a string that can be shown to the user. This is based on the _str table. unicode_to_string (buffer, pos, length, do_null) Read a unicode string from a buffer, optionally eat the null terminator, and optionally align it to 4-byte boundaries. unmarshall_dom_sid2 (data, pos) Unmarshall a dom_sid struct unmarshall_dom_sid2_ptr (data, pos) Unmarshall a pointer to a'''
