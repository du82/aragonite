["https://nmap.org/6"]
title = "Nmap 6 Release Notes"
description = "After 3 years of work, 3,924 code commits, and more than a dozen point releases, the Nmap Project is delighted to announce the immediate, free availability of the Nmap Security Scanner version 6. It includes a more powerful Nmap Scripting Engine, 289 new scripts, better web scanning, full IPv6 support, the Nping packet prober, faster scans, and much more!"
full_description = '''Nmap 6 Released May 21, 2012—The Nmap Project is pleased to announce the immediate, free availability of the Nmap Security Scanner version 6.00 from https://nmap.org/. It is the product of almost three years of work, 3,924 code commits, and more than a dozen point releases since the big Nmap 5 release in July 2009. Nmap 6 includes a more powerful Nmap Scripting Engine, 289 new scripts, better web scanning, full IPv6 support, the Nping packet prober, faster scans, and much more! We recommend that all current users upgrade. Contents: About Nmap Top 6 Improvements in Nmap 6 Press Screen Shots Detailed Improvements Moving Forward (Future Plans) Acknowledgments Download and updates About Nmap Nmap (“Network Mapper”) is a free and open source (license) utility for network discovery and security auditing. Many systems and network administrators also find it useful for network inventory, managing service upgrade schedules, monitoring host or service uptime, and many other tasks. Nmap uses raw IP packets in novel ways to determine what hosts are available on the network, what services (application name and version) those hosts are offering, what operating systems (and OS versions) they are running, what type of packet filters/firewalls are in use, and dozens of other characteristics. It was designed to rapidly scan large networks, but works fine against single hosts. Nmap runs on all major computer operating systems, and official binary packages are available for Linux, Windows, and Mac OS X. In addition to the classic command-line Nmap executable, the Nmap suite includes an advanced GUI and results viewer (Zenmap), a flexible data transfer, redirection, and debugging tool (Ncat), a utility for comparing scan results (Ndiff), and a packet generation and response analysis tool (Nping). Nmap was named “Security Product of the Year” by Linux Journal, Info World, LinuxQuestions.Org, and Codetalker Digest. It was even featured in a dozen movies, including The Matrix Reloaded, The Bourne Ultimatum. Girl with the Dragon Tattoo, and Die Hard 4. Nmap was released to the public in 1997 and has earned the trust of millions of users. As free software, we don't have any sort of advertising budget. So please spread the word that Nmap 6 is now available! Top 6 Improvements in Nmap 6 Before we go into the detailed changes, here are the top 6 improvements in Nmap 6: 1. NSE Enhanced The Nmap Scripting Engine (NSE) has exploded in popularity and capabilities. This modular system allows users to automate a wide variety of networking tasks, from querying network applications for configuration information to vulnerability detection and advanced host discovery. The script count has grown from 59 in Nmap 5 to 348 in Nmap 6, and all of them are documented and categorized in our NSE Documentation Portal. The underlying NSE infrastructure has improved dramatically as well. [More details] 2. Better Web Scanning As the Internet has grown more web-centric, Nmap has developed web scanning capabilities to keep pace. When Nmap was first released in 1997, most of the network services offered by a server listened on individual TCP or UDP ports and could be found with a simple port scan. Now, applications are just as commonly accessed via URL path instead, all sharing a web server listening on a single port. Nmap now includes many techniques for enumerating those applications, as well as performing a wide variety of other HTTP tasks, from web site spidering to brute force authentication cracking. Technologies such as SSL encryption, HTTP pipelining, and caching mechanisms are well supported. [More details] 3. Full IPv6 Support Given the exhaustion of available IPv4 addresses, the Internet community is trying to move to IPv6. Nmap has been a leader in the transition, offering basic IPv6 support since 2002. But basic support isn't enough, so we spent many months ensuring that Nmap version 6 contains full support for IP version 6. And we released it just in time for the World IPv6 Launch. We've created a new IPv6 OS detection system, advanced host discovery, raw-packet IPv6 port scanning, and many NSE scripts for IPv6-related protocols. It's easy to use too—just specify the -6 argument along with IPv6 target IP addresses or DNS records. In addition, all of our web sites are now accessible via IPv6. For example, Nmap.org can be found at 2600:3c01::f03c:91ff:fe96:967c. [More details] 4. New Nping Tool The newest member of the Nmap suite of networking and security tools is Nping, an open source tool for network packet generation, response analysis and response time measurement. Nping can generate network packets for a wide range of protocols, allowing full control over protocol headers. While Nping can be used as a simple ping utility to detect active hosts, it can also be used as a raw packet generator for network stack stress testing, ARP poisoning, Denial of Service attacks, route tracing, etc. Nping's novel echo mode lets users see how packets change in transit between the source and destination hosts. That's a great way to understand firewall rules, detect packet corruption, and more. [More details] 5. Better Zenmap GUI & results viewer While Nmap started out as a command-line tool and many (possibly most) users still use it that way, we've also developed an enhanced GUI and results viewer named Zenmap. One addition since Nmap 5 is a “filter hosts” feature which allows you to see only the hosts which match your criteria (e.g. Linux boxes, hosts running Apache, etc.) We've also localized the GUI to support five languages besides English. A new script selection interface helps you find and execute Nmap NSE scripts. It even tells you what arguments each script supports. [More details] 6. Faster scans In Nmap's 15-year history, performance has always been a top priority. Whether scanning one target or a million, users want scans to run as fast as possible without sacrificing accuracy. Since Nmap 5 we've rewritten the traceroute system for higher performance and increased the allowed parallelism of the Nmap Scripting Engine and version detection subsystems. We also performed an intense memory audit which reduced peak consumption during our benchmark scan by 90%. We made many improvements to Zenmap data structures and algorithms as well so that it can now handle large enterprise scans with ease. [More details] Press Please mail Fyodor if you see (or write) reviews/articles on the Nmap 6 release. Here are the ones seen so far: Reasonably detailed (or with many comments) English articles: Reddit: Nmap 6 released! Hacker News: Nmap 6 released after three years of work Slashdot: Nmap 6 Released Featuring Improved Scripting, Full IPv6 Support Network World: New Nmap Probes IPv6 Networks The H Open Source (Heise Online): Nmap now fully ready for IPv6 The Register: NMap 6.0 arrives: Fyodor’s finest since 2009 Linux ForYou: What’s New in Nmap 6 Internet Society: New Nmap Version 6 Provides Full IPv6 Support, Useful IPv6 Tools Unixmem: Nmap reaches version 6 SecurityWeek: Nmap 6 Now Available With Enhancements, New Functions Brief English mentions: SANS Internet Storm Center (ISC), Help Net Security, Linux Weekly News (LWN), Ethical Hacker Network, HD Moore, Darknet Permission is granted for journalists (or anyone writing about this Nmap release) to use any of the text or screen shots on this page. For quotes, you can email Fyodor at fyodor@nmap.org. Leave your phone number if you want a callback. Screen Shots Nmap 6 provides a wealth of information about remote systems, as shown in this sample scan against a machine we maintain for scan testing purposes (scanme.nmap.org): Here is an example using Zenmap against a couple of production web servers (Nmap.org and Reddit): Perhaps the most visually appealing aspect of Zenmap is its network topology mapper. Here it is being used to interactively explore the routes between a source machine and more than a dozen popular web sites: Detailed Improvements The Nmap Changelog describes more than 600 significant improvements since our last major release (5.00 in July 2009). Here are the highlights: Nmap Scripting Engine (NSE) The Nmap Scripting Engine (NSE) is one of Nmap's most powerful and flexible features. It allows users to write (and share) simple scripts to automate a wide variety of networking tasks. Those scripts are then executed in parallel with the speed and efficiency you expect from Nmap. Users can rely on the growing and diverse set of scripts distributed with Nmap, or write their own to meet custom needs. NSE was just beginning to take off with Nmap 5, and represents perhaps our proudest accomplishment in Nmap 6: Script count has nearly sextupled from 59 to 348 scripts! The full list is too long to include here, but you can find them all at the NSE Documentation Portal. Information gathering is one of Nmap's prime features, so we added 44 new protocol information query scripts: acarsd-info, address-info, amqp-info, backorifice-info, bitcoin-info, bitcoinrpc-info, broadcast-upnp-info, db2-das-info, drda-info, eap-info, epmd-info, ganglia-info, giop-info, hadoop-datanode-info, hadoop-jobtracker-info, hadoop-namenode-info, hadoop-secondary-namenode-info, hadoop-tasktracker-info, hbase-master-info, hbase-region-info, hddtemp-info, http-qnap-nas-info, ipv6-node-info, iscsi-info, maxdb-info, membase-http-info, memcached-info, mongodb-info, nat-pmp-info, ndmp-fs-info, netbus-info, ntp-info, openlookup-info, quake3-info, redis-info, riak-http-info, rpcap-info, socks-auth-info, stun-info, versant-info, vnc-info, voldemort-info, vuze-dht-info, xmpp-info Some of our favorite new scripts don't send any traffic at all—they just interpret and present information discovered by other scripts or Nmap itself. These include: address-info shows extra information about IPv6 addresses, such as embedded MAC or IPv4 addresses when available. creds-summary lists all discovered credentials (e.g. from brute force and default password checking scripts) at end of scan. duplicates attempts to discover multihomed or IP aliased systems by analyzing and comparing information collected by other scripts (SSL certificates, SSH host keys, MAC addresses, and NetBIOS server names). reverse-index creates a reverse index at the end of scan output showing which hosts run a particular service. unusual-port compares the detected service on a port against the expected service for that port number (e.g. ssh on 22, http on 80) and reports deviations. Nmap has two new NSE script scanning phases. The new pre-scan occurs before Nmap starts scanning. Some of the initial pre-scan scripts use techniques like broadcast DNS service discovery or DNS zone transfers to enumerate hosts which can optionally be treated as targets. The other phase (post scan) runs after all of Nmap's scanning is complete. These can do things like print summaries of all the host-specific results or find correlations. For example, ssh-hostkey can now tell you at the end of the scan which IP addresses have duplicate SSH host keys (and thus may be different interfaces of the same machine) and reverse-index prints an index at the end of a scan showing which hosts have individual services (such as telnet or http) available. Created a new target library which allows scripts to add newly discovered targets to Nmap's scanning queue. This allows Nmap to support a wide range of target acquisition techniques. 27 scripts can now use this feature: bitcoin-getaddr, bittorrent-discovery, broadcast-db2-discover, broadcast-dropbox-listener, broadcast-ms-sql-discover, broadcast-ping, dns-brute, dns-srv-enum, dns-zone-transfer, hadoop-jobtracker-info, hadoop-namenode-info, hadoop-secondary-namenode-info, hbase-master-info, hbase-region-info, hostmap-bfk, iscsi-info, lltd-discovery, omp2-enum-targets, resolveall, snmp-interfaces, targets-asn, targets-ipv6-multicast-echo, targets-ipv6-multicast-invalid-dst, targets-ipv6-multicast-mld, targets-ipv6-multicast-slaac, targets-sniffer, targets-traceroute We created a high speed authentication credential checking library for our protocol brute force password auditing scripts. We then added 48 new “brute” scripts, for a total of 53 (full list). Supported protocols range from extremely popular ones such as HTTP, FTP, MySQL, telnet, socks, and pop3 to more obscure ones such as VMauthd, RPcap, Redis, and iSCSI. We even support brute force cracking of other security scanning and exploitation tools, including Metasploit XML-RPC, Nessus, Nessus XML-RPC, Nexpose, and OpenVAS OTP. Since brute force scripts are most effective with a quality password list, we created a top 5000 password database by cracking 635,546 passwords from the Gawker compromise and combining those results with many other leaks such as RockYou, PHPBB, MySpace, etc. We added a credentials storage library. This makes it easy for credentials passed in by the user or discovered by brute force scripts to then be used for deeper interrogation, and also allows for consistent reporting of discovered credentials. We discovered a major directory traversal vulnerability in Apple AFP protocol and released a script for detecting and exploiting the problem Added and then removed a mac-geolocation script which relied on a Google database to determine strikingly accurate GPS coordinates for anyone's wireless access point based on their MAC address. It was very powerful and arguably a little creepy. Google must have decided that the capability was too powerful as they discontinued the service before our script was even two months old. Added a new script force feature. You can force scripts to run against target ports (even if the “wrong” service is detected) by placing a plus (+) in front of the script name passed to --script. Added a new --script-args-file option which allows you to specify the name of a file containing all of your desired NSE script arguments. The arguments may be separated with commas or newlines and may be overridden by arguments specified on the command-line with --script-args. Added a host-based registry which only persists (for the given host) until all scripts have finished scanning that host. The normal registry saves information until it is deleted or the Nmap scan ends. That is a waste of memory for information which doesn't need to persist that long. Use the host based registry instead if you can. Replaced our runlevel system for managing the order of script execution with a much more powerful dependency system. This allows scripts to specify which other scripts they depend on (e.g. a brute force authentication script might depend on username enumeration scripts) and NSE manages the order. Dependencies only enforce ordering, they cannot pull in scripts which the user didn't specify. A new --script-help option describes all scripts matching a given specification. It accepts the same specification format as --script does. For example, try ‘nmap --script-help "default or http-*"’. The script arguments '''
