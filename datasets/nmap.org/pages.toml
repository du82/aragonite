full_description = 'Download Reference Guide Book Docs Zenmap GUI In the Movies NSEDoc NSEDoc Portal NSE Documentation Nmap API NSE Tutorial Scripts Libraries Categories auth broadcast brute default discovery dos exploit external fuzzer intrusive malware safe version vuln Script Arguments Example Usage Script Output Script banner Script types: Categories: discovery, safe Download: https://svn.nmap.org/nmap/scripts/banner.nse Script Summary A simple banner grabber which connects to an open TCP port and prints out anything sent by the listening service within five seconds. The banner will be truncated to fit into a single line, but an extra line may be printed for every increase in the level of verbosity requested on the command line. Script Arguments banner.timeout How long to wait for a banner. Default: 5s banner.ports Which ports to grab. Same syntax as -p option. Use "common" to only grab common text-protocol banners. Default: all ports. Example Usage nmap -sV --script=banner <target> Script Output 21/tcp open ftp |_ banner: 220 FTP version 1.0\x0D\x0A Requires comm nmap stdnse shortport table Author: jah License: Same as Nmap--See https://nmap.org/book/man-legal.html action action (host, port) Grabs a banner and outputs it nicely formatted. Parameters host port'
