uck-and-dive journey and rough-and-tumble attitude of a two-time Oscar winner and star of 85 movies, who was found dead at his home in Santa Fe, New Mexico alongside his wife and dog yesterday (February 26), aged 95. Hackman came to cinema relatively late in his career, making his first credited appearance in 1964’s Lilith (starring Warren Beatty) at the age of 34. His route there had been long and bumpy. Born in San Bernadino, California, in 1930, his family moved frequently during his youth and fractured in 1943. The “hurt and disappointment” of his father leaving the family with a wave from a car would go on to fuel some of his most fraught performances. A trouble-making teenager with a love of James Cagney movies, at 16 he lied about his age in order to join the Marine Corps and spent four years serving in Japan and Mao’s revolutionary China, where he gained a reputation as a brawler. However, a motorcycle accident left him unfit to join his battalion in the Korean War and in 1951 Hackman was discharged, spending six months studying journalism at the University of Illinois before quitting for New York to pursue the dreams of acting he’d harboured since the age of 10. Warren Beatty as Clyde Barrow and Gene Hackman as Buck Barrow in the film ‘Bonnie and Clyde’, 1967. CREDIT: Silver Screen Collection/Getty Images They would be a long time reaching fruition though. For much of his early twenties Hackman drifted through odd jobs in New York, working as a truck driver, furniture cleaner, shop assistant and doorman – his old drill sergeant spotting him on the door of a Times Square hotel and declaring him “a sorry son of a bitch” only fired his determination to succeed on the stage. At 26 he moved back to California and enrolled at the Pasadena Playhouse’s acting school, where he was considered old and untalented, but made good friends in fellow oddball (and conga playing partner) Dustin Hoffman. The pair, both voted “Least Likely To Succeed” by their classmates, decamped to NYC after Hackman was thrown out of the school after an inauspicious year and shared an apartment with a young Robert Duvall as they pursued their acting ambitions. Hackman juggled minor stage and screen roles – often in crime drama TV shows such as Naked City and The Defenders, and plays including Broadway misses (his debut Children From Their Games) and hits (1964’s Any Wednesday and Poor Richard) – with work at a Howard Johnson’s restaurant. He saw every rejection as a challenge: “It was more psychological warfare, because I wasn’t going to let those fuckers get me down,” he said in a 2004 interview. “If you’re really interested in acting, there is a part of you that relishes the struggle.” Small film roles began filtering in and 1967 was a turning point. Having been dropped from the role of Mr Robinson in The Graduate for being too young, he was picked up to play Warren Beatty’s fiery and rebellious older brother Buck Barrow in Bonnie And Clyde, a role which earned him an Oscar nomination for Bes'''
