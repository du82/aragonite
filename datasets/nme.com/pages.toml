e Irish Album Charts – and ‘Eurostar’ collaborator Reggie jumps onstage to spray his verse. His shouts of ‘Dublin’s in the house!’ capture the energy in the room. The bass is booming, everyone’s dressed to the nines, and Travy’s Irish fans have shown up to salute the sizeable strides he’s making. “The Nigerian-Irish people are doing crazy things,” Travy says proudly, joining NME on a video call a couple of weeks later. He’s calm and talkative, and lights up at mention of that night. “We had to struggle to get where we are, but it’s definitely a better place now. When I moved to Ireland from rural Nigeria [aged six], I was disorientated ‘cause I was like, ‘This isn’t my country’. A lot of the places I was around were predominantly white areas. So the mindframe I’ve had since young is: ‘I’m not from here, so I’m just gonna use this place to the best of my ability’. I think that led to me doing music – I didn’t really fit in even if I tried, so let me just stay doing what I wanna do.’ Advertisement The 26-year-old is at the forefront of a generation of Black Irish artists forging a new path within the country’s music scene, alongside the likes of Sello, Monjola, and long-time collaborator Elzzz. His first two projects, ‘Full Circle’ (2023) and ‘Doghouse’ (2024), both made with Elzzz, secured the Number Two and Number One spots on the Irish Album Charts respectively, and ‘Spooky’ (produced by Galway-born beatmaker Liam Harris) has further boosted that momentum. “I wanted to make this project explore who I am as a person, the Nigerian and Irish perspective… I want people to be like ‘This guy’s an alien!’” ‘Spooky’ was crafted over a two-month period spent renting a flat in Paris, striving for nonstop creativity and endeavour. “Me and Liam had this place in the second district in Paris, and sometimes we didn’t even have a penny bro, I was just chowing on these pasta boxes every day just to keep going!” Travy laughs. “But I knew what I was gonna get from the project, so it was just them graveyard shifts, really being in that creative flow… it was nice having that time and space to record at any given moment. I was thinking, ‘If I record in Paris, will the music sound different?’ But I still have the same vim, so it’s not just the cold weather that’s making me rap like this!” Travy’s fresh, distinctly Irish rap sound stems from a wide array of sources. He tends to lean on dark, swelling instrumentals that blend the edginess of mid-2010s south London drill with a more upbeat, bouncing UK grime energy, his vocal cadences and calmly-delivered bars akin to Homerton’s Unknown T. A swish braggadocious quality nodding to booming New York drill runs through the project, too. Anchoring it all in his home city are little touches of Dublin slang like ‘FSSH’ (an expression harnessed on the mixtape’s eponymous lead single) and ominous choral samples that transport you to midnight mass in a cold, cavernous Catholic church (‘Meet Spooky’). But creating this sense of identity hasn’t been eas'''
