!important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } Gene Hackman has reportedly been found dead with his wife Betsy Arakawa and their dog in their New Mexico home. Per the Santa Fe New Mexican, the couple and their dog were found dead on Wednesday afternoon (February 26) in their home in the New Mexico city of Santa Fe. Their deaths were confirmed by Santa Fe County Sheriff Adan Mendoza hours later at midnight. The Santa Fe New Mexican reported that, in an interview, Mendoza stated there was no immediate indication of foul play. No cause of death was provided, along with a possible time of death. Hackman was 95, while Arakawa, a classical pianist, was 63. He leaves behind three children: Christopher, Elizabeth Jean and Leslie Anne, with whom he shared with his late ex-wife, Faye Maltese, who died in 2017. Gene Hackman in the 1974 thriller ‘The Conversation’. CREDIT: Silver Screen Collection/Getty Images A generational acting talent, with a career that spanned over six decades, Hackman has spent the last two decades or so in retirement. In 2008, he officially announced his retirement from acting. Among the films that starred Hackman over the decades are 1971’s The French Connection, 1974’s The Conversation, 1978’s Superman, 1988’s Mississippi Burning, 1992’s Unforgiven, and 2001’s The Royal Tenenbaums. His last feature film role was 2003’s Welcome to Mooseport, in which he starred alongside Ray Romano. This is a developing story. /* inline tdc_css att */ .tdi_89{ margin-top:48px !important; margin-bottom:48px !important; border-color:#000000 !important; border-style:solid !important; border-width: 1px 0px 0px 0px !important; } You May Also Like window._taboola = window._taboola || []; _taboola.push({mode:'alternating-thumbnails-a', container:'taboola-below-article', placement:'below-article', target_type: 'mix'}); /* custom css */ 