ligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } Stranger Things is a phenomenon that has grown to match its nostalgic influences. It might be proudly loaded with nods to the ’80s – Dungeons And Dragons, Kate Bush, Stephen King and Nightmare on Elm Street are all referenced – but those nuggets are stylistic window-dressing for a show that’s always placed its endearing, original characters at the forefront of the spectacle. READ MORE: ‘Stranger Things’ season four part one review: all the terrifying thrills you’ve come to expect The charming cast leading the charge have all become global superstars too – from Finn Wolfhard (Mike Wheeler), Millie Bobby Brown (Eleven) to Joe Keery as everyone’s favourite jock Steve Harrington. With one season left, can Stranger Things defy expectations again to make its final adventure the best yet? Has Stranger Things season five been confirmed? Advertisement Yup, we’ll return to Hawkins one last time In February 2022, creators Matt and Ross Duffer announced in a letter that the fifth season of Stranger Things will be the show’s last. “Seven years ago, we planned out the complete story arc for Stranger Things,” the Duffer Brothers wrote. “At the time, we predicted the story would last four to five seasons. It proved too large to tell in four, but – as you’ll soon see for yourselves – we are now hurtling toward our finale. Season four will be the penultimate season; season five will be the last. “There are still many more exciting stories to tell within the world of Stranger Things; new mysteries, new adventures, new unexpected heroes. But first we hope that you stay with us as we finish this tale of a powerful girl named Eleven and her brave friends, of a broken police chief and a ferocious mom, of a small town called Hawkins and an alternate dimension known only as the Upside Down. As always, we are grateful for your patience and support.” uoos noʎ ǝǝs pic.twitter.com/pJ71dRgmo1 — Stranger Things (@Stranger_Things) February 17, 2022 Is there a release date for Stranger Things season five? [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); 2025! Despite the Duffer Brothers hoping for a quicker turnaround between season four and season five of Stranger Things, it seems fans will have to wait a little bit longer. Filming for season five began in January 2024 and in July, (the eight-year anniversary of Stranger Things season one) Netflix confirmed that the team were halfway through production. The streamer ended 2024 by sharing photos from a wrap party, with Stranger Things season five finishing filmi'''
