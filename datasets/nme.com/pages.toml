d_ad_content-horiz-right{ float: right; margin-top: 6px; margin-left: 21px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title{ width: 300px; height: 250px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title:before{ position: absolute; top: 50%; transform: translateY(-50%); margin: auto; display: table; width: 100%; }.tdi_86 .tdb-block-inner blockquote p{ font-size:30px !important; }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left, .tdb_single_content .id_ad_content-horiz-right, .tdb_single_content .id_ad_content-horiz-center { margin: 0 auto 26px auto; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left { margin-right: 0; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-right { margin-left: 0; } }@media (max-width: 767px) { .tdb_single_content .td-a-ad { float: none; text-align: center; } .tdb_single_content .td-a-ad img { margin-right: auto; margin-left: auto; } .tdb_single_content .tdc-a-ad { float: none; } }@media print { .single .td-header-template-wrap, .single .td-footer-template-wrap, .single .td_block_wrap:not(.tdb_breadcrumbs):not(.tdb_single_categories):not(.tdb-single-title):not(.tdb_single_author):not(.tdb_single_date ):not(.tdb_single_comments_count ):not(.tdb_single_post_views):not(.tdb_single_featured_image):not(.tdb_single_content) { display: none; } .single.td-animation-stack-type0 .post img { opacity: 1 !important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } Stardew Valley is an absolutely massive video game. You start out as a plucky everyman, burnt out by life, who inherits a plot of land in the titular community. From there, you’re free to do pretty much whatever brings you the most joy – whether that’s growing crops, completing jobs around the farm or simply interacting with the colourful cast of townsfolk. There are endless opportunities – and creator Eric ‘ConcernedApe’ Barone keeps on adding more. READ MORE: ‘Stardew Valley’ creator Eric Barone discusses his life in music Not content with selling 41million units since the game came out in 2016, last year, Barone released a sixth major update for the game. It added another bumper crop of exciting new features – and inspired legions of new players to dive into the easy-going everyday of Stardew Valley. Advertisement “I could keep updating forever,” he tells NME shortly before a well-earned Christmas break, still tweaking those newly added features. “Unless every single player is having a good experience, I’m stressing out.” Playing through the game to test out various patches means he’s already thinking about cool new features to add later. “It’s hard to give up on a game that is still popular and is so meaningful to people. Realistically, I can see myself still doing this when I’m 80 years old.” ‘Stardew Valley’. CREDIT: ConcernedApe So far, each and every update has been completely free. “Before I made Stardew Valley, I was just some random dude working on a game in my bedroom. The game turned me from a nobody into a somebody,” says Barone. “I feel like it’s my duty to give back by constantly making it better. Charging fans for those updates feels wrong. Love and respect is a more valuable currency than cash anyway.” It’s something he saw first-hand during last year’s ‘Festival Of Seasons’ world tour, which turned Barone’s own “rinky dink” soundtrack into an orchestral odyssey. Finding himself in rooms with thousands of cosplaying fans who’d come together to celebrate the DIY game means the developer has “finally started to accept” the popularity of his creation. He felt a bit like a rock star at every show. “The fact people keep showing up for my silly little game still blows my mind.” View this post on Instagram A post shared by Stardew Valley: Symphony of Seasons (@stardewconcert) [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); Indeed, Barone enjoyed the experience so much that his plans for the upcoming ‘Symphony Of Seasons’ tour are “even bigger”. There’ll be more musicians, a “video presentation” to go alongside the music and larger venues too. “Hearing the Stardew Valley soundtrack played live just has a different quality to it,” he gushes. “When you’re playing the game, you’re usually alone but at these concerts, you’re surrounded by other people and watching musicians recreate the music. It’s a real human experience and those are special.” Eric Barone knows the legacy of Stardew Valley is a lot to live up to. There have been a few attempts at a follow-up in the year'''
