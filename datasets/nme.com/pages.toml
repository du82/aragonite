ated” her hometown, the 27-year-old singer-songwriter made a “very obvious” decision to postpone its release by a full month. READ MORE: Ichiko Aoba’s oceanic dreams “Some of my closest collaborators, who are a huge part of this project in their own right, lost their homes. The entire city was essentially momentarily displaced,” Black tells NME over Zoom in mid-February. She spent her unexpected downtime “on the ground” helping friends and fellow artists to begin the lengthy rebuilding process. “It definitely put everything in perspective for me,” adds the singer, who moved to the city around a decade ago. Advertisement In a way, Black’s career has been an extended exercise in reading the room and playing the long game. She could have remained a punchline – the teenage girl who went viral with ‘Friday’, supposedly “the worst song ever” – but instead she reinvented herself as a credible independent musician. With her 2021 EP ‘Rebecca Black Was Here’ and 2023 debut album ‘Let Her Burn’, Black displayed a real flair for catchy and cathartic dark-pop. Rebecca Black. Credit: Davis Bates Her origin story will evoke nostalgia in anyone who was even moderately online at the start of the last decade. When she was 13, Black’s mother paid indie label Ark Music Factory US$4,000 to produce a single and music video for her driven daughter. “I was always in theatre corps and performance groups – you know, really embarrassing forms of putting myself out there,” Black recalls with a laugh. Ark asked Black to pick between two pre-written tracks. The first, titled ‘Super Woman’, felt too “adult” for a 13-year-old, so she chose ‘Friday’, which proved to be a fateful decision. In March 2011, around a month after its music video was quietly uploaded to YouTube, ‘Friday’ went viral in the most overwhelming way imaginable. Trolls and wags on Twitter (as X was then known) became obsessed with every aspect of the endeavour: its excessively Auto-Tuned vocals, crushingly mundane lyrics (“yesterday was Thursday, Thursday / today it is Friday, Friday”) and low-budget video showing Black singing awkwardly in the back of a car and at a party. [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); ‘Friday’ was also eviscerated by critics – one branded it “mind-meltingly horrific” – but Black received sisterly support from Lady Gaga, who said sweetly: “Anyone that’s telling her she’s cheesy is full of shit.” Still, the song’s viral notoriety and undeniably catchy chorus turned it into a surprise hit that climbed to Number 58 on the Billboard Hot 100. Rebecca Black. Credit: Ella Margolin A few days before she speaks to NME, Rebecca Black q'''
