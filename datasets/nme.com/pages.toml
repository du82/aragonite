rmoil through melancholy bolero ballads. His mother, Trịnh Vĩnh Trinh, is likewise an accomplished singer. In early 2024, Thể Thiên became Vietnam’s first artist to be signed to Universal Music Group’s global division without any prior music released. And in December, he unveiled his debut album ‘Trần Thế’, a breakup-driven dance pop record inspired in part by Saigon club music. After a week, the album had risen to the Number Two spot on Apple Music Vietnam. Now, nearly two months into his debut, he’s nearing 150,000 monthly listeners on Spotify and garnered millions of views on TikTok. Advertisement “It happened so fast – all the fans and all the love has been amazing,” Thể Thiên tells NME between sips of iced coffee the morning after performing at a local music festival. “But I’m still learning how to talk to the audience. When you’re on stage, it’s a 1-minute interaction. What do you say? That’s the biggest challenge for me. I still don’t feel like people want to hear what I have to say yet.” “The album is just the story of my stroll in the mortal world – and sin is something all humans go through” Taking the spotlight is somewhat new to Thể Thiên who, before becoming Vietnam’s most exciting new pop artist, was primarily known for his work as a sought-after stylist under the moniker Tigrebia. But he says fashion was never the end game. He’s always known he wanted to be a singer. “Styling just fell into place when I moved back to Vietnam, but after four years, I was done with dressing people,” he recalls of his initial years after returning from university in Canada. “I’ve had this dream to be a singer for over 10 years. My family knew it’s what I wanted. They supported it, too.” But according to Thể Thiên, it wasn’t until 2022 that he decided to finally make music his focus, realising that at 26, “realistically, I was getting a bit old to start for the first time in the entertainment industry. So I knew I needed to do it. I had to prove something to myself.” [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); To this end, ‘Trần Thế’ is an honest and fantastical manifesto – of finding heartbreak, chasing the thrills of Saigon nightlife and coming of age between two cultures and languages. Thể Thiên says he wanted his debut album to be a thematic contradiction. “I wanted to write sad lyrics for party music.” Sonically, ‘Trần Thế’ fuses disparate influences from Thể Thiên’s favourite genres like hyperpop, UK garage and South African amapiano. He also credits artists like NewJeans and Charli XCX for inspiration – but explains that much of the album’s sound was ultimately developed organically in the stu'''
