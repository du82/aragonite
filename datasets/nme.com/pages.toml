title = "The 10 best Drake and PartyNextDoor collaborations"
description = "‘$ome $exy $ongs 4 U’ is full of late-night allure, with ‘Somebody Loves Me’ serving as a shadowy, atmospheric plea wrapped in rich harmonies and raw vulnerability. Over a brooding, R&B-style beat, the duo croon about their lavish lifestyles while wrestling with their longing for true love. It’s a refined take on their signature introspective sound, proving that – 12 years on – they still know how to make loneliness sound irresistible."
