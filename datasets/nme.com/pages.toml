g { opacity: 1 !important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } The first song I remember hearing Rodgers & Hammerstein – ‘The Sound Of Music’ “My mum would play this over and over. I knew every lyric of the entire movie [when I was young] – and I would go out on the swing set and sing it from start to finish… driving the neighbours completely crazy. In Los Angeles, they do an annual sing-a-long at the Hollywood Bowl and people dress up. I’ve been as Fraulein Maria. I use the ukelele as a purse.” Advertisement The first album I ever owned Madonna – ‘Like A Virgin’ “I had it on tape when I was around 10… Years later, I went to Madonna’s 40th birthday party at her house in Los Angeles. I was dating an actor who had just done a play with her in London. Guy Ritchie gave the toast and Demi Moore was there too. She had a dancefloor out in the backyard that they had filled with goldfish. It was like you were dancing on an aquarium. But I think something happened and a lot of the fish were dying. They had to drain it and get them out. “I remember it was an Eastern-influenced party and her brother was wearing this kimono and he caught on fire. Someone had to rip off his kimono and stamp on it. And then when you got your car from the valet at the end of the night, they had left a red rose inside.” The first gig I went to [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); Erasure at American University in Washington D.C., 1992 “I’d recently moved from Idaho, to Virginia, right outside Washington D.C. Where I lived in Idaho, it was too small of a town for bands to tour through. That I could go to a place and watch a band perform live in front of me was like a fantasy… Erasure was just this dance party. I thought all concerts were as theatrical and dance-y because it was my first experience. Nothing was quite like that afterwards…” The song that reminds me of home Neil Diamond – ‘Soolaimon’ Advertisement “I chose Idaho because that’s where I consider my hometown to be. My parents didn’t have a lot of options and they would play the same things over and over. When my mother would put this on, she was usually in a really good mood – singing and dancing in the house. I just felt very safe and happy.” The song I wish I’d written The Cure – ‘Fascination Street’ “I decided to go with a song that, every single time I listen to it, I think: ‘That is a perfect song.’It’s the orchestration of it; how it builds and builds with this sort of magical wall of sound – and then that haunting '''
