d_content-horiz-left{ float: left; margin-top: 9px; margin-right: 21px; }.tdb_single_content .id_ad_content-horiz-right{ float: right; margin-top: 6px; margin-left: 21px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title{ width: 300px; height: 250px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title:before{ position: absolute; top: 50%; transform: translateY(-50%); margin: auto; display: table; width: 100%; }.tdi_86 .tdb-block-inner blockquote p{ font-size:30px !important; }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left, .tdb_single_content .id_ad_content-horiz-right, .tdb_single_content .id_ad_content-horiz-center { margin: 0 auto 26px auto; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left { margin-right: 0; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-right { margin-left: 0; } }@media (max-width: 767px) { .tdb_single_content .td-a-ad { float: none; text-align: center; } .tdb_single_content .td-a-ad img { margin-right: auto; margin-left: auto; } .tdb_single_content .tdc-a-ad { float: none; } }@media print { .single .td-header-template-wrap, .single .td-footer-template-wrap, .single .td_block_wrap:not(.tdb_breadcrumbs):not(.tdb_single_categories):not(.tdb-single-title):not(.tdb_single_author):not(.tdb_single_date ):not(.tdb_single_comments_count ):not(.tdb_single_post_views):not(.tdb_single_featured_image):not(.tdb_single_content) { display: none; } .single.td-animation-stack-type0 .post img { opacity: 1 !important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } In the 2002 film State Property (starring rapper Beanie Sigel), director Abdul Malik Abbott canonised Philadelphia’s slippery streets. Burrowing through the salvo of XXL tees, Rocawear sweats, and low-angle shots, the rallying quote “get down or lay down” ripples through the cult classic flick. While it may seem arbitrary, it crystallises Philly’s fragmented, unwavering ethos and culture. At 24, rapper Ghais Guevara is now delivering his own manifesto. NME meets Guevara (born Jaja Gha’is Robinson) at a dimly lit Southbank riverfront bar in the thick of British winter to talk about his debut album ‘Goyard Ibn Said’. Instead of Abbott’s Spielbergian street thriller, the city captured on the record is one born from the window ledge of Robinson’s North Philly home, rooted in Black liberation and anti-capitalist ideals. Advertisement As he fondly recounts, Robinson himself was raised on a musical diet of Beanie Sigel – especially his regional 2005 anthem, ‘Feel It In the Air’, whose chorus he treated like gospel. He draws equally from the Pan-African experience, the African American cultural canon, and broader pop culture, all combining mantras of Black pain, joy, and resilience. Robinson’s bars are rooted in the Black Power revolution, yet they remain unapologetically free from conventional expectations. Tomorrow, Robinson will release ‘Goyard Ibn Said’, a moniker he previously adopted inspired by Omar Ibn Said, “a Muslim slave from what is now Senegal who was brought to America,” he explains. “His autobiography, written in Arabic, chronicles his life as a slave and his forced conversion to Christianity. I see parallels in my own experience entering the industry – navigating a system that feels oppressive, encountering people I’d rather avoid, and enduring a sort of ‘forced conversion’ to fit in.” “I want to open people’s perspectives and get them to understand rappers, and by extension, Black males, Black people, and ultimately the world” Whether Robinson speaks, engages in Marxist discourse, or expresses himself through music, there’s always a message: a rally against bourgeoisie-bound convention and conformist thinking. It’s what’s made Robinson a breakout star in the underground experimental hip-hop scene since his 2021 mixtape ‘Blackbolshevik’, going on to earn acclaim from the likes of BBC 6 Music and NPR. Never shy to critique, yet always ready to crack a smile and revel in hip-hop’s rich history, Robinson is a student of the game. “Growing up in Philly, we grew up modelling ourselves after rappers,” he says. “That’s all we had as role models who ‘made it out’. Rappers and ballers. So to come out of that and learn the misogynistic nature and the predatory nature [of the industry] and all of that, it’s like, damn, is that necessary? Is that what I have to be?” He pauses before continuing, his tone softening yet resolute. “It’s kind of hard, but at a certain point, you’re just like, I’m going to do it my way: with some integrity. The old guard is dead. I love my city. It taught [me] what I needed to be, and what I don’t.” [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Rec'''
