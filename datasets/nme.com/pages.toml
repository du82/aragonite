s the Margaret Thatcher regime of the time, and all the songs are about that experience.” 2Which French DJ covered PiL’s ‘This Is Not a Love Song’ in 2007?“No idea!” WRONG. David Guetta on his ‘Pop Life’ album. “Never heard of him! Was that anything to do with Daft Punk? ‘Cause Daft Punk wanted to work with me a while back, but I didn’t feel the vibe. I felt it was too much of a ‘studio’ thing and gimmicky – nothing at all like the fun you could get up to with Leftfield, who I recorded ‘Open Up’ with, which I adore. They [Daft Punk] were just deadpan serious people trying to be techno. I’m not one for fellers that wear helmets as their live performance achievement! [Laughs]” “They came at me with many ideas, but it was all ‘just turn up, there’s the studio, we expect you to do this. Go!’. But I can’t work like that. I have to be able to get good and fucking drunk with you before! [Laughs] I have to see your drawers drop!” 3In 2017, which Manchester frontman said he would loved to have been lead singer of th'''
