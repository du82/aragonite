 resurgence seems like it’s crowded with American bands. Salisbury quartet Oversize are hoping to refocus attention on the atmospheric sounds from the UK with their debut album, ‘Vital Signs’. “I think it has become more of an Americanised genre over the last couple of years, but the bands that originally inspired us were all English or Irish,” says guitarist Lewis Lennane-Emm. Advertisement “I don’t have a chip on my shoulder, but as an area of the world, we have such a rich history of shoegaze and alternative guitar music and it does feel like it’s been forgotten a bit,” he continues. “I almost see it as a personal venture of mine to bring some of that UK charm within that sort of music over here.” “You’re the mayor of the Society of British Shoegaze Preservation,” jokes his bandmate Sam McCauley. “Pop that in big quotes!” Lennane-Emm laughs, before making a more serious point. “I think there’s something about this rainy, unpleasant land that provides really good guitar music.” “If there’s anything to be gained from grieving, it certainly makes you a stronger person. It gives you a different perspective, a different way of seeing things” – Sam McCauley Not as much of it, however, comes out of their sleepy, rural town of Salisbury. Once, it had a rich, self-sufficient scene which brought them together when they were teenagers. There were shows on every weekend, space to rehearse and create at the local community centre Grosvenor House. “It’s so rural and public transport is so awful that you had to make your own scene,” Lennane-Emm recalls. But post-pandemic, that scene has been decimated: “We walk past that building – it got defunded and boarded up and now it’s rotten on the inside. It’s such a shame, the amount of kids who could have stayed out of trouble if they’d only had somewhere to go and had a creative outlet.” The band that came to be Oversize began taking shape in 2017 after Lennane-Emm returned to Salisbury – “one of those places people tend to leave and then later come back to” – upon finishing university. Knowing that McCauley was about, he sent him some demos in the hope of working with him, having already admired his work in other projects. McCauley brought on board drummer Sam Shutler – affectionately known as Big Sam to differentiate him from McCauley – and together they started fleshing out those demos, dragging one-watt amps to McCauley’s loft after work to write. [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); This was mostly casual music-making dependent on whether the trio’s calendars lined up; sometimes the three of them would go months without seeing each other. In late 201'''
