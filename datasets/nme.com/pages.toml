in-right: 21px; }.tdb_single_content .id_ad_content-horiz-right{ float: right; margin-top: 6px; margin-left: 21px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title{ width: 300px; height: 250px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title:before{ position: absolute; top: 50%; transform: translateY(-50%); margin: auto; display: table; width: 100%; }.tdi_86 .tdb-block-inner blockquote p{ font-size:30px !important; }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left, .tdb_single_content .id_ad_content-horiz-right, .tdb_single_content .id_ad_content-horiz-center { margin: 0 auto 26px auto; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left { margin-right: 0; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-right { margin-left: 0; } }@media (max-width: 767px) { .tdb_single_content .td-a-ad { float: none; text-align: center; } .tdb_single_content .td-a-ad img { margin-right: auto; margin-left: auto; } .tdb_single_content .tdc-a-ad { float: none; } }@media print { .single .td-header-template-wrap, .single .td-footer-template-wrap, .single .td_block_wrap:not(.tdb_breadcrumbs):not(.tdb_single_categories):not(.tdb-single-title):not(.tdb_single_author):not(.tdb_single_date ):not(.tdb_single_comments_count ):not(.tdb_single_post_views):not(.tdb_single_featured_image):not(.tdb_single_content) { display: none; } .single.td-animation-stack-type0 .post img { opacity: 1 !important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } More than any number of Oscars or Golden Globes, an adjective carved into the eternal cinematic lexicon is the true mark of a filmmaker’s immortality. The very word ‘Lynchian’ – denoting a kind of carnivalesque dark surrealism; sometimes fantastical, sometimes macabre, sometimes dreamlike, often eerily everyday – will forever pay tribute to the work of one of cinema’s finest ever auteurs, David Lynch, who died yesterday (January 16) aged 78. Having begun his directorial career in the realm of grainy, yet highly respected monochrome arthouse movies (1977’s Eraserhead; 1980’s The Elephant Man), Lynch’s unique vision truly crystalised on boldly colourful classics such as Blue Velvet (1986), Wild At Heart (1990), Lost Highway (1997) and Mulholland Drive (2001), for which he received the last of three Academy Award nominations for Best Director. Across this canon he deployed his trademark experimental techniques – dream imagery, fracturing identities, non-linear timelines, plots that twist so strangely they recast his films as puzzle cubes – upon such beloved genres as neo noir, crime drama and the Americana road trip with a master’s eye for striking visual composition, all the better to explore the sinister underbelly of American normality. Advertisement To watch a Lynch film was to enter a tangled narrative woodland with barely a smattering of breadcrumbs to guide you towards sense and clarity, and the inherent mysteries embedded at the heart of the director’s work proved endlessly engrossing. His Twin Peaks series of TV shows and 1992 film developed one of pop culture’s most avid cult followings, still picking episodes apart to decipher the series’ true meaning, and there is even much fan love for his 1984 space opera folly Dune. David Lynch and Kyle MacLachlan. Credit: ANNE-CHRISTINE POUJOULAT/AFP via Getty Images Born in Missoula, Montana, in 1946 to a transient but somewhat idyllic childhood, Lynch first evolved his visual eye as a student of art and painting, studying at Washington’s Corcoran School Of Fine Arts, the School Of The Museum Of Fine Arts in Boston and, after a foiled plan to move to Europe, the Pennsylvania Academy Of The Fine Arts. A married father of one by the age of 22, in stark contrast to his own upbringing he lived with his new family in the poverty-stricken Fairmount neighbourhood of Philadelphia, which helped to colour his cinematic worldview. “The feeling was so close to extreme danger, and the fear was so intense,” he’d tell one biographer. “There was violence and hate and filth. But the biggest influence in my whole life was that city.” Purchasing a cheap 16mm camera, Lynch made his first short film, Six Men Getting Sick (Six Times), at the Academy for just $150. Further surreal shorts – a girl recites the alphabet before bleeding to death in The Alphabet (1968); a boy grows a grandmother from a seed in The Grandmother (1970) – were funded by wealthy fellow students and grants from the American Film Institute. Moving to the AFI Conservatory in Los Angeles in 1970, where he was hailed as one of the school’s most promising students, Lynch funded his first full-length film Eraserhead with a $10,000 grant, a loan from his father and the proceeds from a paper round delivering The Wall Street Journal. Filmed sporadically over four years from a script of just 21 pages, and often shot in so'''
