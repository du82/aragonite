iety to excitement – because deep down, that’s what it really is. I’ve been dreaming about this [show] for a long time.” Alongside Reading & Leeds main stage appearances, tours with Bring Me The Horizon and Korn, plus two Megan Thee Stallion collaborations, Ally Pally is just another marker of the unstoppable force that is Spiritbox in heavy metal. Their stunning 2021 debut ‘Eternal Blue’ effortlessly weaved between heaven-sent choruses and ruthless, uncompromising riffs, propelling the band into the metal mainstream. While the pandemic ensured they remained heavy metal’s unseen, best-kept secret, the band’s organic growth from the extensive touring that followed only augmented the hype for their second album. Two exhilarating EPs (2022’s ‘Rotoscope’ and 2023’s ‘The Fear Of Fear’) came in between, whetting fans’ appetites further through some cutting-edge experimentation, be it groovy industrial stomper ‘Rotoscope’ or the Grammy-nominated tracks ‘Jaded’ and ‘Cellar Door’. Advertisement “It helped bridge the'''
