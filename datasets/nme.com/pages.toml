ebrate this continued interest in the art of crate-digging – and as part of our ongoing partnership with all-around audiophiles Marshall, who know a good vinyl shop when they see one – we decided to ask some of our favourite new acts for their record store recs… Next Door Records, London Chosen by: Matilda Mann – who makes gorgeous folk music which goes straight for the heart “It’s a record store/cafe on the Uxbridge Road. I forgot when it opened but I remember waking in and searching through all their collections when I was little. I was just so drawn in by the atmosphere. They have a little section at the back to sit and then in the evening, it becomes a small dance floor while they DJ out front. It’s small but it has such a place in my heart. I’m so excited to be having a release party there for my debut album ‘Roxwell’.” Most treasured purchase: ‘Juno OST’ “It’s one of my favourite albums ever and the first vinyl I bought. When I was about 15, I was obsessed with that movie, all the songs in it and how they paired together. It’s one of the main reasons I started writing my own songs and it made me fall more in love with movie soundtracks. The Moldy Peaches’ ‘Anyone Else But You’ was the first song I learned to play on guitar.” View this post on Instagram A post shared by Next Door Records (@nextdoorrecords_) Across The Tracks, Brighton Chosen by: Welly – who make chaotic indie pop celebrating the drama of everyday life “It’s on Sydney Street. It’s typical old-school record shop stuff – the staff are slightly standoffish, it’s a bit dog-eared round the edges, and a lot of the sleeves on the outside displays are rain-worn and sunbleached blue. But their selection is unmatched. Other Brighton sellers specialise in new releases (Family Store, Resident), dance/electronic (Rarekind, Cult Hero) or just nice, dusty stuff (Wax Factor, Fine Records) but Across the Tracks has it all. It even has a specific section for porno soundtracks. Oh! And it’s open ‘til six, so you can go after work or before the pub.” Most treasured purchase: Michael Nyman – ‘The Draughtman’s Contract OST’ “In honesty, I mainly go for their CDs (the owner offered to burn me a copy of Scott Walker’s second album when he didn’t have it) but this was probably the best vinyl purchase. It opened me up to a world of orchestral pomp so far from Welly. No doubt I’ll be forcing baroque-pop on our fans by the next decade. Blame Across The Tracks!” Flashback Records, London Chosen by: Man/Woman/Chainsaw – who make fast and furious punk rock that’s as smart as it is scathing Billy Ward (vocals): “When I first started getting into music, my nearest record shop was the old premises of their Crouch End branch. I’d take the bus and spend hours rifling through the whole collection, looking for artists I’d heard of and discovering and falling in love with a myriad of new ones. It’s a special place. Later on, when the band got started, we’d go on to play many gigs promoted by Flashback as well – they put on great shows.'''
