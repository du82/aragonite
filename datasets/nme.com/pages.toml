portant; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); While Edward Norton’s turn as Bruce Banner has always been an awkward inclusion in the MCU timeline (he was later recast with Mark Ruffalo taking over), this Hulk outing is connected by a post-credits scene showing Tony Stark recruiting for The Avengers. 6. Thor (2011) This kickstarted the cosmic angle of the MCU as we’re introduced to Asgard, the Nine Realms and Thor’s (Chris Hemsworth) dynamic with Dr. Jane Foster (Natalie Portman). Chris Hemsworth in ‘Thor’ CREDIT: Alamy/Marvel 7. The Avengers (2012) Marvel’s first superhero team-up brought together Iron Man, Captain America, Thor, the Incredible Hulk (played by Mark Ruffalo), Black Widow and newbie Hawkeye (Jeremy Renner) into a grand culmination for Phase One. 8. Thor: The Dark World (2013) Advertisement This picks up aft'''
