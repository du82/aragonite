ntent-horiz-right{ float: right; margin-top: 6px; margin-left: 21px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title{ width: 300px; height: 250px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title:before{ position: absolute; top: 50%; transform: translateY(-50%); margin: auto; display: table; width: 100%; }.tdi_86 .tdb-block-inner blockquote p{ font-size:30px !important; }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left, .tdb_single_content .id_ad_content-horiz-right, .tdb_single_content .id_ad_content-horiz-center { margin: 0 auto 26px auto; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left { margin-right: 0; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-right { margin-left: 0; } }@media (max-width: 767px) { .tdb_single_content .td-a-ad { float: none; text-align: center; } .tdb_single_content .td-a-ad img { margin-right: auto; margin-left: auto; } .tdb_single_content .tdc-a-ad { float: none; } }@media print { .single .td-header-template-wrap, .single .td-footer-template-wrap, .single .td_block_wrap:not(.tdb_breadcrumbs):not(.tdb_single_categories):not(.tdb-single-title):not(.tdb_single_author):not(.tdb_single_date ):not(.tdb_single_comments_count ):not(.tdb_single_post_views):not(.tdb_single_featured_image):not(.tdb_single_content) { display: none; } .single.td-animation-stack-type0 .post img { opacity: 1 !important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } It’s a chilly evening on Hateruma Island and a boy is looking for a dog. He runs out of the simply lit room where Ichiko Aoba is sitting, mid-conversation with NME. The Japanese singer-songwriter breaks her train of thought; with a gentle giggle, she peeks out of the door after him. READ MORE: XG: in pursuit of the infinite It’s a lighthearted, enchanting image befitting the ambient folk artist who has spellbound listeners across the world with an equally magical simplicity. Aoba’s signature sound is decidedly sparse: many of her songs simply pair her serene, glass-like voice with skillful classical guitar – but the results are sublime. Whether in freezing concert halls or on acclaimed studio albums like ‘0’ and ‘qp’, Aoba’s minimalism carries an unspeakable, near-surreal gravity. Advertisement Recently, however, the Kyoto artist’s universe has become more concrete. Aoba has become increasingly informed by her own field research across Japan. Delicate field recordings on 2019’s ‘Ayukawa no Shizuku’ documented her intimate encounters with natural landscapes, while the Ryukyu Archipelago inspired her 2020 breakthrough, ‘Windswept Adan’ – conceptualised as a fictional film score to the story of a girl sent away to a fantastical island. On that record, her music also took flight into richer textures, from psychedelic chamber folk to ambient drones and classical arrangements. Amid these travels, Aoba was mesmerised particularly by the beauty of Hateruma Island, nestled at Okinawa’s southernmost point. As she continued to visit the island’s communities, “I thought about how the people of the island had lived all the way to this time and where they were right now,” she shares. “As I absorbed these ancient songs, those lifestyles and traditions made their way naturally into the album.” Ichiko Aoba at Into The Great Wide Open. Credit: Vrije Geluiden Aoba found herself shifting from attentive observer to active participant. The second track of her new album ‘Luminescent Creatures’ is a festival folk song: during Mushama, devotees pray to ancestors for good harvests and protection. It’s the island’s largest festival, though participation has dwindled over time. “At some point in the spring, I was asked by someone in the village if I could play this on the sanshin,” Aoba recalls. “I was told that if I could play it by summer, they would show me to the elders of the community. If they approved, then I could play in the festival. It was a few loose tests, but after I passed, I was allowed to participate.” The song’s title ‘24° 03′ 27.0″ N 123° 47′ 7.5″ E’, the coordinates of the island’s lighthouse, feels like an apt metaphor for the beacon Aoba’s music has become, calling to listeners across language barriers. Her musicality feels instantly transportive, therapeutic – and somehow, familiar. It’s a borderless quality that’s attracted collaborators including the likes of Cornelius, Ryuichi Sakamoto, Pomme, Mac Demarco and more. [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); For ‘Luminescent Creatur'''
