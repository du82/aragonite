k-type0 .post img { opacity: 1 !important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } Everybody Loves Raymond could return for a Friends: The Reunion-style one-off episode, possibly in 2026 to celebrate three decades since the first episode aired, creator Phil Rosenthal told NME. Starring Ray Romano as put-upon Italian-American dad Raymond Barone, the series ran for 210 episodes between 1996 and 2005 before being remade for multiple international markets. In the UK, it aired in the popular weekday breakfast slot on Channel 4. Advertisement A number of key cast members – including Peter Boyle and Doris Roberts, who played Raymond’s crotchety parents – have since died. Some of the remaining cast appeared together for various interviews over the years, most recently in 2020 for the 14th Annual IMF Virtual Comedy Celebration, but never for a full-length reunion production. “This year we’ve been off the air for 20 years,” said Rosenthal. “It’s a good time to do a reunion special, the way Friends did a reunion special [in 2021]. It wasn’t a reboot of Friends. It was: here they are now – talking about what it was like then… We can do that next year when we’ll have premiered 30 years ago. We’re talking to production companies right now. We want to do it.” Ray Romano and Philip Rosenthal attend ‘SNL50: The Homecoming Concert At Radio City Music Hall’ in New York City. CREDIT: Sean Zanni/Patrick McMullan via Getty Images Romano has spoken many times about his reluctance to do a full reboot or sequel to the show – as other ‘90s sitcoms such as Frasier have done recently – and Rosenthal agrees with him: “Time has passed. People have passed away, so a reboot isn’t going to feel the same. It never does,” he said. “There’s so much money to be had if you keep going. We felt like we had enough money. We’d done well enough to live comfortably. Why keep going? We’re gonna actually hurt the legacy of the show.” A sitdown special featuring classic clips, tales from the set and new interviews would be agreeable to all, Rosenthal suggests. “We’ll all have fun stories because that’s where all the material for Raymond came from – from stuff that happened to us. If you worked for me, your job was to go home, get in a fight with your wife and come back in and tell me about it…” [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); Rosenthal, also a best-selling author and host of hit Netflix travel show Somebody Feed Phil, will tell some of these stories when his An Evening With Phil Rosenthal Of S'''
