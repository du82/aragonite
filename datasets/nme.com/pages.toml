animation-stack-type0 .post img { opacity: 1 !important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } Michelle Trachtenberg, the actor known for her roles in Gossip Girl and Buffy The Vampire Slayer, has died at the age of 39. The news was reported by the New York Post on Wednesday (February 26), with police confirming she had been found in her New York City apartment. No cause of death has been disclosed. Trachtenberg gained her major breakthrough as a teenager as Dawn Summers, the younger sister of Sarah Michelle Gellar’s Buffy in the cult WB series Buffy The Vampire Slayer. She joined in season five in 2000 and remained on the show until its conclusion with season seven in 2003, with the role earning her a Teen Choice Award nomination in 2001. Michelle Trachtenberg in Longboat Key, Florida on April 21, 2007. (Photo by J. Meric/WireImage for Manning, Selvage and Lee) She found another wave of adoration later in the 2010s when she portrayed Georgina Sparks on The CW’s teen drama Gossip Girl. Her character was a former friend of Blake Lively’s Serena van der Woodsen and a scheming Manhattan socialite who would routinely find herself clashing with Serena and Leighton Meester’s Blair Waldorf. Born in New York on October 11, 1985, Trachtenberg was acting from a very young age, picking up work in adverts at the age of three. Her early TV credits included Nickelodeon’s The Adventures Of Pete & Pete and the lead role in the 1996 film Harriet The Spy, the adaptation of the beloved coming-of-age comedy novel. She went on to star in projects such as 2004 raunchy sex comedy Eurotrip, the 2005 Disney film Ice Princess and the 2009 teen fantasy 17 Again, alongside Zac Efron and the late Matthew Perry. In more recent years, she made appearances on major TV series including House, NCIS: Los Angeles and Weeds. She also made a notable appearance in the music video for Fall Out Boy’s ‘This Ain’t A Scene, It’s An Arms Race’ in 2006 and revived her role as Georgina Sparks in the 2022 reboot of Gossip Girl. ABC News have reported that Trachtenberg had recently undergone liver transplant surgery, but it is unknown if that is connected to her death. /* custom css */ .tdb_single_tags{ margin-bottom: 2px; font-weight: 600; }.tdb_single_tags span, .tdb_single_tags a{ font-size: 11px; }.tdb_single_tags span{ text-transform: uppercase; }.tdb_single_tags ul{ display: inline-block; margin: 0; list-style-type: none; font-size: 0; }.tdb_single_tags li{ display: inline-block; margin-left: 0; }.tdi_87 span{ margin-right: 4px; padding: 2px 8px 3px; color: #fff; background-color: #222; }.tdi_87 a{ margin-right: 4px; padding: 1px 7px 2px; border: 1px solid #ededed; color: #111; } /* landscape */ @media (min-width: 1019px) and (max-width: 1140px){ .tdi_87 a{ border: 1px solid #ededed; } } /* portrait */ @media (min-width: 768px) and (max-width: 1018px){ .tdi_87 a{ border: 1'''
