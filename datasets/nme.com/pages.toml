ne; } .single.td-animation-stack-type0 .post img { opacity: 1 !important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } If you’ve seen his celebrated Dark Knight trilogy or experienced the mind-boggling sci-fi thrills of Interstellar and Tenet, you’ll know Christopher Nolan only makes epic films. His newest blockbuster is no different. Nolan is following up the Oscar-winning Oppenheimer with an adaptation of the ancient Greek poem The Odyssey. Spanning 10 years, split into 24 books and featuring everything from vengeful gods to vicious monsters, it’s a beast of a project. You bet we’re excited. When will The Odyssey be released? Advertisement The Odyssey was only announced at the end of last year but the film already has a release date – July 17, 2026. It’s the same release window as Nolan’s previous film Oppenheimer and that did alright at the box office (grossing $957million against a budget of $100million) despite competition from the more broadly popular Barbie. Who’s in The Odyssey cast? So far, a lot of big name actors have been confirmed for Nolan’s latest but who they’ll be playing is still under wraps. According to The Hollywood Reporter, Matt Damon, Tom Holland, Robert Pattinson and Anne Hathaway will headline the movie, with Lupita Nyong’o, Charlize Theron, Zendaya and Jon Bernthal set for supporting roles. A first-look image of The Odyssey confirmed Matt Damon will be playing titular king Odysseus. Matt Damon is Odysseus. A film by Christopher Nolan, #TheOdysseyMovie is in theaters July 17, 2026. pic.twitter.com/7a5YbfqVfG — odysseymovie (@odysseymovie) February 17, 2025 In January, Elliot Page, Himesh Patel, Bill Irwin and Samantha Morton were all added to the cast while more recent additions include Mia Goth, Corey Hawkins, Jesse Garcia, Will Yun Lee, Rafi Gavron, Shiloh Fernandez, Nick E Tarabay, Jimmy Gonzales, Maurice Compte, Michael Vlamis and Iddo Goldberg. Speaking on The Dish podcast last year, Holland revealed that he’d signed on without really knowing what the film was about. “It hasn’t started shooting [and] to be perfectly honest with you, I don’t know anything about it. Everything is very, very hush-hush [but] I’m super excited,” he said. [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); Meanwhile, returning Nolan collaborator Anne Hathaway said she has “so many feelings” about getting cast in The Odyssey after previously starring in The Dark Knight Rises and Interstellar. “It fills me with so much joy, and I don’t know how to talk about it,” sh'''
