title = 'John Lydon: "Daft Punk wanted to work with me a while back, but I didn’t feel the vibe"'
description = """
“Fuck off! Number ones? That’s like having a piss, innit? Better with Number Twos – we were the shit! [Laughs] Was it Queen?”
WRONG. Talking Heads’ ‘Fear of Music’ topped the poll.
“All accolades to the American import. Homegrown talent gets second best. I’m not bitter! [Laughs] I liked Talking Heads. On my last tour, I wore an extra-wide baggy suit in homage to David Byrne.”
Talking of pissing, Joey Ramone claimed the Ramones pranked you when you met them backstage in 1977 by secretly urinating in your beer…
“That’s nonsense! I’m an Irishman, do you think I’d let my pint go missing? So many lies have come out of the Ramones camp over the years. The biggest and most contentious was they were the precursors to punk. Look at the difference between what we were doing and what America was up to. Ours was a cultural war based in working class principles versus the Margaret Thatcher regime of the time, and all the songs are about that experience.”"""
