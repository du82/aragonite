bout dancing” Still, it could always be worse. NME meets the electronic duo in the plush lounge of the swanky Soho Hotel to chat about their fifth album, ‘Coming Home’. Decked in all black and Adidas, the pair could pass as Berlin hipster tourists. You wouldn’t know they’re state agitators, sonic experimentalists who’ve worked with Grimes and Bring Me The Horizon’s Oli Sykes, and a band in exile. “Right now, I’m considering moving here for a period of time,” Anastasia ‘Nastya’ Kreslina says of London. “It’s a big city with a hectic lifestyle. I’m used to that template.” Advertisement Kostylev was born into music as the son of a conductor and music professor before the Soviet Union collapsed and “went into shambles”, splitting his family apart. Scoring burned Muse and Radiohead CDs from “music nerd” friends in a town near Moscow where internet speeds where primitive and records either expensive or scarce, he defied expectations to follow his lineage and pursue a life and career in sound. “I had to gaslight myself into believing it was possible,” he says now. “I felt a lot of pressure from family and friends because no one believed it.” “At first we were calling it ‘audio visual terror’ because everything that the establishment didn’t like was called ‘terrorism’” – Nikolay Kostylev Latvian-born Kreslina’s mother, meanwhile, was an opera singer and member of an Orthodox church choir – an origin story that makes total sense of her theatrical style and the religious imagery of IC3PEAK. “Coming from Orthodox culture, they’re used to suffering,” she says, getting blunt with the theology. “If you come out with something bold and aggressive, sometimes the crowd likes to be a bit submissive.” They stood out when they burst onto Moscow’s underground rave scene. Kreslina hopped on one of Kostylev’s solo tracks at first in 2013, then when they started getting some strong attention, IC3PEAK were born. “Everything happened so quickly,” remembers Kostylev. “We started the project, then everyone came to the first rave and already knew the songs.” Raves by their nature are anti-establishment. Imagine having the balls to do that in Russia of all places. “It was just possible at the time,” he shrugs. “It wouldn’t be five years later, and certainly isn’t now. People would just be in jail if they did that in Moscow today.” Nikolai Kostylev of IC3PEAK. Credit: Sasha Komarova [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); With their gothic clash of electronica and rap, designed to question and prod, IC3PEAK naturally had their fair share of run-ins with the law. “At first we were calling it ‘audio visual terror’ because '''
