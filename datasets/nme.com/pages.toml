content .id_ad_content-horiz-right{ float: right; margin-top: 6px; margin-left: 21px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title{ width: 300px; height: 250px; }.tdb_single_content .tdc-a-ad .tdc-placeholder-title:before{ position: absolute; top: 50%; transform: translateY(-50%); margin: auto; display: table; width: 100%; }.tdi_86 .tdb-block-inner blockquote p{ font-size:30px !important; }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left, .tdb_single_content .id_ad_content-horiz-right, .tdb_single_content .id_ad_content-horiz-center { margin: 0 auto 26px auto; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-left { margin-right: 0; } }@media (max-width: 767px) { .tdb_single_content .id_ad_content-horiz-right { margin-left: 0; } }@media (max-width: 767px) { .tdb_single_content .td-a-ad { float: none; text-align: center; } .tdb_single_content .td-a-ad img { margin-right: auto; margin-left: auto; } .tdb_single_content .tdc-a-ad { float: none; } }@media print { .single .td-header-template-wrap, .single .td-footer-template-wrap, .single .td_block_wrap:not(.tdb_breadcrumbs):not(.tdb_single_categories):not(.tdb-single-title):not(.tdb_single_author):not(.tdb_single_date ):not(.tdb_single_comments_count ):not(.tdb_single_post_views):not(.tdb_single_featured_image):not(.tdb_single_content) { display: none; } .single.td-animation-stack-type0 .post img { opacity: 1 !important; } } /* phone */ @media (max-width: 767px){ .tdi_86 img.aligncenter, .tdi_86 .aligncenter img{ margin-left: -50px; width: calc(100% + (2 * 50px)); max-width: none !important; } } It was an early morning in September 2022 and Mia Wray was spiralling in the middle of an airport. She was checking in for a flight to London for a writing trip, having booked sessions with several songwriters and producers around the UK. This wasn’t the reason for the rising adrenaline, though. Rather, as the Melbourne pop artist was making her way through check-in and security, she was rapidly realising her life was about to change forever – because she was infatuated with a woman. READ MORE: Heartworms – ‘Glutton For Punishment’ review: riveting, raw goth rock ready to take off “I remember calling my friend at the airport,” Wray tells NME, sitting in the offices of her Australian label, Mushroom Music. “[Saying to her] I feel like I can’t explain it. I feel like something has been ignited or lit in me for the first time in a really long time. I feel giddy, I feel physically hot. I feel like my skin and my face is always flushed and on fire whenever I think about her, and when I think about, I guess, what she represents. Advertisement “I was like, well, fuck, what am I going to do? This isn’t just a cute little crush. This is a really big thing. And I’ve been with my partner for seven years. Fuck.” Wray got on the flight, and for the next few weeks sat in studios and writing rooms trying to untangle the panicked threads in her brain. It was a “surreal” experience, she says, sitting on couches with strangers and sketching out something so vulnerable as her coming to grips with her sexuality. “The amount of strangers’ couches in London that I have cried on…” Wray smiles, shaking her head. Credit: Nick Mckk This was the emotional crucible that forged Wray’s piercing debut album ‘Hi, It’s Nice To Meet Me’. It’s a long-awaited debut for the songwriter, who has released three EPs since she was signed by Mushroom in 2012. With popular singles like ‘Monster Brain’ and ‘Stay Awake’, it became clear over the years why Wray was so fiercely championed by the late Mushroom CEO and Australian music industry legend Michael Gudinski: her songwriting was sharp and full-hearted, channelling the likes of HAIM and Maggie Rogers. Unexpectedly, one of these artistic touchstones would play a part in ‘Hi, It’s Nice To Meet Me’. British songwriter Gabrielle Aplin – a hero of Wray’s for more than a decade – joined one of her songwriting sessions in Bath at the last minute. [data-feed-main-container-id="taboola-mid-article"].tbl-feed-frame-DIVIDER .tbl-feed-card { box-shadow: none !important } .alternating-thumbnails-b-stream .video-title { line-height: 1.3 !important; margin-bottom: 2px !important; } Recommended window._taboola = window._taboola || []; _taboola.push({ mode: 'alternating-thumbnails-b-stream', container: 'taboola-mid-article', placement: 'Mid Article', target_type: 'mix' }); “That was a big moment for me,” says Wray. “I had been listening to Gabby’s music since I was 14, and her art was my best mate. I obviously didn’t know her personally, but then all of a sudden I’m on a couch with her writing a song and confiding in her personally about my situation. That was a weird, full circle moment.” The song that fell out of the session was the single ‘Tell Her’ and one of the album’s peaks, Wray’s angst and nervous excitement powered by a driving bass. Another key session on the trip was with Manchester duo SOAP, who helped carve out the track ‘What If’'''
