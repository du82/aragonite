description = "These lessons are designed to engage learners on a journey through time with a diverse array of the women of New Mexico. Grade level groupings contain multiple lesson plans that are intended to be taught in sequence in order to build knowledge, skills, and connections between the past and present."
full_description = '''Home Women Bios Curriculum About Us News and Events Contact Us Get Involved Donate Search for:Search Button #slide-in-open{ cursor: pointer; } .line{ display: block; position: absolute; height: 4px; width: 100%; background: #24394A; border-radius: 9px; opacity: 1; -webkit-transition: .1s ease-in-out; -moz-transition: .1s ease-in-out; -o-transition: .1s ease-in-out; transition: .1s ease-in-out; } .line-2 { top: 10px; } .line-3 { top: 20px; } #slide-in-open.open .line-1 { top: 10px; -webkit-transform: rotate(135deg); -moz-transform: rotate(135deg); -o-transform: rotate(135deg); transform: rotate(135deg); } #slide-in-open.open .line-2 { display: none; } #slide-in-open.open .line-3 { top: 10px; -webkit-transform: rotate(-135deg); -moz-transform: rotate(-135deg); -o-transform: rotate(-135deg); transform: rotate(-135deg); } .slide-in-menu { right: 0 !important; opacity: 1 !important; } .slide-in-menu-container { -webkit-transition: all 0.5s ease !important; -moz-transition: all 0.5s ease !important; -o-transition: all 0.5s ease !important; -ms-transition: all 0.5s ease !important; transition: all 0.5s ease !important; } jQuery(function($){ $('#slide-in-open').click(function(){ $(this).toggleClass('open'); $('.slide-in-menu-container').toggleClass('slide-in-menu'); $('.headerLogo').toggleClass('hideSlow'); }); }); Home Women Bios Curriculum About Us News and Events Contact Us Get Involved Donate Search for:Search Button Get Involved Get Involved Help Us Educate, Inspire, and Empower The New Mexico Historic Women Marker Program is made possible through generous and ongoing support from the International Women’s Forum of New Mexico, the state of New Mexico, select New Mexico businesses, and individuals. Our sponsors enable us to inspire the next generation of young people through awareness, curriculum, and opportunities to continue the legacy of women artist, activists, entrepreneurs, healers, judges, lawyers, physicians, pioneers, politicians, scientists, and community leaders who have helped make New Mexico the land of Enchantment. Eve Ball, far right, speaking to three of the Mescalero/Lipan tribal elders: (l-r) Percy Bigmouth; Old Scout Bigmouth and Crookneck, c. 1950. Old Scout served in the Geronimo campaigns and was about 100 at this time. Photo courtesy of Lynda A. Sanchez. You can help bring the power of women’s history to communities today and inspire positive change. Your contribution will help sustain and grow core elements of our program: Celebrating the often unrecognized contributions of women in our multicultural history Inspiring the next generation to leave a positive legacy through K-12 curriculum, library exhibits, presentations, and other tools for teaching about women in New Mexico history Spreading the word about women in New Mexico history through our website, social media, printed materials, digital and print press coverage, speaking engagements, and special events, including marker dedication ceremonies Expanding our historic photo library and developing video documentaries for public distribution Conducting and sharing research on the history of women in New Mexico Sponsorship levels Your contribution of any amount is appreciated. Contributions of $250 or more are eligible for tax-deductible status; please contact us for more information on how to make a tax-deductible contribution. Select your sponsorship level *Silver - up to $249Coral - $250 to $499Turquoise - $500 to $999Gold - $1,000 to $2,499Platinum - $2,500 to $4,999Diamond $5,000+Other AmountSilver Sponsorship Amount *USDCoral Sponsorship Amount *USDTurquoise Sponsorship Amount *USDGold Sponsorship Amount *USDPlatinum Sponsorship Amount *USDDiamond Sponsorship Amount *USDOther Amount *USDHow would you like your contribution to appear on our web site? *Under my nameIn honor ofIn memory ofAnonymousIn honor of: *0 / 50In memory of: *0 / 50Your InformationFirst Name *Last Name *Email Address *PhoneWhat inspired you to donate? *TotalPayment Method *Credit CardPayable to MICA Group. Please use "International Women’s Forum of New Mexico" in the memo or description field. Mail to: MICA Group c/o Peggy Mainor, Executive Director 5301 Springlake Way Baltimore, MD 21212Credit / Debit Card * Submit Donation Information New Mexico Historic Women Marker Program Partners Our work would not be possible without the generous financial support and active involvement of our Partners and Volunteers. Our heartfelt thanks to: Cultural Properties Review Committee, Anne Staveley Photography; Marty & Rodney Wilson, bookmark sponsors; Julia and Randy Sulsar, photography and videography; Brenda Robillard, editing and research. Nicole Rassmuson designed the logo, brand identity, and website for the New Mexico Historic Women Marker Program in 2016. Over the past decade as creative director, she has created and shaped the look and feel of the program through a variety of print and digital artwork, including advertisements, articles, bookmarks, brochures, business cards, postcards, posters, presentations, social media, and the updated Marker Program website. We look for unique opportunities to work with other nonprofits, corporations, and small businesses to bring visibility to women in New Mexico while supporting Diversity, Equity, and Inclusion (DEI) and Environmental, Social, and Governance (ESG) initiatives for organizations throughout New Mexico. Please contact us for more information about partnering with the New Mexico Historic Women Marker Program.'''
