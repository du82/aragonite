["https://www.nmhistoricwomen.org/new-mexico-historic-women/ana-de-sandoval-y-manzanares"]
title = "Ana de Sandoval y Manzanares  - New Mexico Historic Women Marker Program"
description = "For all of New Mexico’s history under Spanish and Mexican administrations, in some respects, women had more legal rights then their English, North American  ..."
full_description = "Photo Credit: Courtesy of New Mexico Historic Women Marker Program. Courtesy of New Mexico Historic Women Marker Program. A survivor of the 1680 Pueblo Revolt, she led her family back to New Mexico, widowed and destitute, and in 1716, successfully petitioned the New Mexico governor to reinstate her as the lawful owner of her late father's San Clemente land grant, which had been his encomienda before the Pueblo Revolt. For all of New Mexico’s history under Spanish and Mexican administrations, in some respects, women had more legal rights then their English, North American counterparts. Ana de Sandoval y Manzanares is a pointed example. After surviving the 1680 Pueblo Revolt, she returned to New Mexico after being exiled, a destitute widow and one of many women heads of household. She settled in the Santa Fe area and, in 1697, received an allotment of livestock and supplies from Governor Diego de Vargas. In 1716, she asserted her rights and successfully petitioned the New Mexico Governor to restore her father’s land, the San Clemente Grant that today includes the site of the Village of Los Lunas. Probably born in New Mexico around 1650 to Mateo Sandoval y Manzanares, who had a large estancia near San Felipe Pueblo, she appears to have traveled many times with her parents between New Mexico and Mexico. Her father was a mulatto and her mother, Juana de la Cruz was a Mexican Indian. This racial mixture did not prevent her parents from owning property or benefiting from business, nor could it exclude them from exercising their civil rights under Spanish law. As a young girl, Ana married Blas de la Candelaria in the early 1660s. She had four children by him and adopted another. Her father received a private land grant in the Rio Abajo area near present-day Las Lunas, New Mexico. By 1684, she was listed in the El Paso area as a widower with an extended family of eleven people. Eight years later her family grew to thirteen members. Ana de Sandoval y Manzanares was one of many women heads of household who returned to New Mexico after the revolt and exile. She settled in the Santa Fe area and, in 1697, received an allotment of livestock and supplies from Governor Diego de Vargas. She remained in the Santa Fe area until the early 1700s resettling of Atrisco on the Rio Grande’s west bank opposite the future site of Albuquerque. Two of her sons are listed among the people who founded Albuquerque. The old plaza of Candelaria in the north part of the town and the modern Candelaria Street were given the family name."
