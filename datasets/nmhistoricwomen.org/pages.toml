["https://www.nmhistoricwomen.org/event/history-makers-celebrating-the-women-shaping-new-mexico"]
title = "History Makers: Celebrating the Women Shaping New Mexico  - New Mexico Historic Women Marker Program"
description = '''
The New Mexico Historic Women Marker Program (NMHWMP), a program of the International Women’s Forum of New Mexico (IWF-NM), in collaboration with New Mexico Magazine, will host a special event on March 6, 2025, at the Roundhouse from 2:00-3:30 PM to honor eight extraordinary women making history in our communities today.
Nominated by the people of New Mexico and featured in New Mexico Magazine’s March issue, these women have demonstrated resilience, leadership, and a profound impact across various fields. This event is an opportunity to recognize their contributions, amplify their stories, and highlight the ongoing role of women in shaping New Mexico’s future.
Honorees include:

Paula Garcia – Advocate for water sovereignty and land preservation
Sylvia Acosta – Champion for education and first-generation college students
Meghan Montelibano Gorman – Founder of Santa Fam, supporting families and caregivers
Kate Noble – Leader in early childhood education and economic development
Marianna Behrends – Educator, rancher, and advocate for agricultural education
Kara Bobroff – Founder of One Generation, fostering Indigenous-led social change
Dr. Annette Sobel – Physician, engineer, and innovator in public health and security
Rose B. Simpson – Award-winning Tewa sculptor and mixed-media artist (unable to attend in person)

Program Highlights:

Welcome and update from the New Mexico Historic Women Marker Program
Recognition of eight History Makers leading change in their communities
Remarks from leaders and legislative sponsors
Insights from organizations working to uplift women and girls across New Mexico

Join us as we honor the past, celebrate the present, and inspire the future.

	
		

				




