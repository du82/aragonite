["https://www.nmhistoricwomen.org/new-mexico-historic-women/graciela-olivarez"]
title = "Graciela Olivárez  - New Mexico Historic Women Marker Program"
description = "Graciela Olivárez, “Amazing Grace” to friends and colleagues, was the first woman to graduate from Notre Dame Law School, a remarkable achievement particula ..."
full_description = "Despite lacking a high school diploma, she was accepted to Notre Dame Law School and in 1970 became its first woman graduate. Through her work as an attorney, public servant, entrepreneur, and civil rights activist, she became one of the most notable Hispanic women in the United States. Graciela Olivárez, “Amazing Grace” to friends and colleagues, was the first woman to graduate from Notre Dame Law School, a remarkable achievement particularly given that she started work young and did not have the opportunity to earn her high school diploma. From her humble beginnings, she managed to overcome obstacles to become one of the most notable Hispanic women in the nation, working as an attorney, public servant, entrepreneur, and civil rights activist. Olivárez was born in 1928 to Damian Gil Valero and Eloisa Solis Valero in Sonora, Arizona, a small mining town near Phoenix. She lived with her father, a Spanish immigrant; her mother, a Mexican-American; and her four siblings. She dropped out of school at age 15 to work. She found employment at KIFN, a Spanish-language station, where she worked in a number of positions, including disc jockey. She hosted a radio program, where she often discussed civil rights and other issues she advocated. Her path to Notre Dame was unconventional. In 1965, she became State Director of the Office of Economic Opportunity (OEO) in Arizona, a department responsible for overseeing federally funded social welfare programs. While working for OEO, she met Rev. Theodore M. Hesburgh, then president of Notre Dame University. He encouraged her to apply to law school, despite lacking her high school diploma. Olivárez, then in her late thirties and a single parent, entered Notre Dame Law School. In 1970, she became the law school’s first female graduate. After graduating from Notre Dame Law School, Olivárez took a position in Phoenix as a consultant for the National Urban Coalition and later as Director of Food for All. In 1972, she moved to New Mexico when she became the Director of the Institute for Social Research and Development at the University of New Mexico (UNM). She notably pushed for men and women to be equally represented on the National Council of La Raza’s Board of Directors. From 1973 to 1975, she taught at UNM law school. In 1975, she was appointed by New Mexico Governor Jerry Apodoca to the State Planning Office, making her the highest ranking government official in New Mexico. In 1977, President Jimmy Carter appointed Olivárez Director of the Community Services Administration."
author = "MyProject ByFranziska"
