["https://www.nmhistoricwomen.org/new-mexico-historic-women/clarita-garcia-de-aranda-allison"]
title = "Clarita Garcia de Aranda Allison  - New Mexico Historic Women Marker Program"
description = "Born on January 11, 1921 to Juanita Candelaria and Nevarez Garcia de Aranda in Albuquerque, Clarita Garcia de Aranda grew up in a large musical family, with ..."
full_description = "Part of a large musical family, her love for the flamenco tradition brought greater awareness and appreciation to this centuries-old art form and its importance in the cultural history of the Southwest. Born on January 11, 1921 to Juanita Candelaria and Nevarez Garcia de Aranda in Albuquerque, Clarita Garcia de Aranda grew up in a large musical family, with five sisters and three brothers. In a 1988 interview, she said she learned to dance “when I knew my left foot from my right,” taught and influenced by her mother, Juana Garcia Candelaria, who came to the United States when she was young. Clarita learned more than dancing from her mother, adding in the interview that “…Mexican men didn’t think women should be dancers. They thought they should stay at home. But my mother was strong willed. She continued to dance and made sure her children danced in her troupe.” Clarita’s daughter, Eva Enciñias, remembers her grandmother Juanita as a rezadora who sang at funerals and velorios in Albuquerque in the early 1900s. As Clarita grew, she and her brothers and extended family continued to mature into the art form. She learned to sing and dance professionally during the 1930s and 1940s from three family members who all performed professionally: her old cousin Dandido Garcia, her brother Antonio Garcia (known as “El Garrica”), and her younger cousin Saturnino Garcia. In 1941, Clarita served as Queen of the Santa Fe Fiesta. Family history and recollection of statements made by Clarita indicate that she moved to Washington, D.C., during World War II to serve as a civilian Spanish-language interpreter. The family believes she may have worked with the WAVES, an acronym for “Women Accepted for Volunteer Emergency Service,” part of the United States Naval Reserve (Women’s Reserve). In Washington, she met and married Donald K. Allison, an engineer who worked with the U.S. Army. The couple lived in Washington, D.C., for a time, but after the war, Clarita began to perform flamenco professionally, touring the country. Her engagements took her to Sedona, Arizona; the Marymount Theater in New York; and to the World’s Fair in Seattle, Washington, in 1962. She returned to Albuquerque many times as well. In one newspaper article highlighting her upcoming performance at Sandia Base Officer’s Club, she described flamenco music to a reporter, providing insight into her interpretation of the dance. Clarita explained that the art of Flamenco is of ancient and exotic origin, a type of “folk music” with fire, daring, ecstasy, and frenzy, coupled with improvisation. Interpretation depends solely on the dancer and guitarist."
author = "MyProject ByFranziska"
year_published = 2023
