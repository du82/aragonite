["https://www.nmhistoricwomen.org/new-mexico-historic-women/georgia-okeeffe"]
title = "Georgia O'Keeffe  - New Mexico Historic Women Marker Program"
description = "Born on November 15, 1887, Georgia O'Keeffe grew up on a farm in Sun Prairie, Wisconsin, the second of seven children. As a child, she received art les ..."
full_description = "One of New Mexico’s most famous citizens, her abstract charcoal drawings from 1916 are now recognized as among the most innovative in all of American art of the period. As early as the mid-1920s, she was considered one of America's most important and successful artists, a legacy that continues today. Born on November 15, 1887, Georgia O’Keeffe grew up on a farm in Sun Prairie, Wisconsin, the second of seven children. As a child, she received art lessons at home, and her abilities were quickly recognized and encouraged by teachers throughout her school years. By the time she graduated from high school in 1905, O’Keeffe was determined to make her way as an artist. O’Keeffe pursued studies at the Art Institute of Chicago (1905–1906) and at the Art Students League, New York (1907–1908), where she was quick to master the principles of imitative realism. In 1908, she won the League’s William Merritt Chase still-life prize for her oil painting Untitled (Dead Rabbit with Copper Pot). Shortly after, however, O’Keeffe quit making art, saying later that she had known then that she could never achieve distinction working within this tradition. Her interest in art was rekindled four years later (1912) when she took a summer course for art teachers at the University of Virginia, Charlottesville, taught by Alon Bement of Teachers College, Columbia University. Bement introduced O’Keeffe to the then-revolutionary ideas of his colleague, artist and art educator Arthur Wesley Dow at Teachers College. Dow believed that the goal of art was the expression of the artist’s personal ideas and feelings and that such subject matter was best realized through harmonious arrangements of line, color, and notan (the Japanese system of lights and darks). Dow’s ideas offered O’Keeffe an alternative to imitative realism, and she experimented with the approach for two years while she taught art in the Amarillo, Texas, public schools (1912-14) and worked summers in Virginia as Bement’s assistant."
author = "MyProject ByFranziska"
