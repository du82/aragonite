["https://www.nmhistoricwomen.org/new-mexico-historic-women/carrie-wooster-tingley"]
title = "Carrie Wooster Tingley  - New Mexico Historic Women Marker Program"
description = "Carrie Wooster was born in Bowling Green, Ohio, on May 20, 1877, to a wealthy family. Diagnosed with tuberculosis, which had stricken her father, she travel ..."
full_description = "Sharing a commitment to the sick and disadvantaged, she and her husband secured WPA funds and strong support from President Roosevelt to build a hospital in New Mexico for children with polio. When it opened in 1938, the Carrie Tingley Hospital for Crippled Children was a state-of-the-art facility. Carrie Wooster was born in Bowling Green, Ohio, on May 20, 1877, to a wealthy family. Diagnosed with tuberculosis, which had stricken her father, she traveled to the southwest in 1911 with her mother. Intending to reach Arizona, mother and daughter left the train in Albuquerque when Wooster became too sick to travel farther. Wooster’s fiancé, Clyde Tingley, joined them soon after. Once she recovered from her illness, the couple married on April 21, 1911. Over time, they became prominent citizens of Albuquerque, engaged in so many civic works that Clyde Tingley became known as the unofficial mayor of the city. He continued his interests through politics, successfully running for governor in 1935. With the Depression causing economic hardship in New Mexico, Governor Tingley became a strong proponent for New Mexico on a federal level, lobbying successfully to receive federal funds through the Works Progress Administration and other Depression-era projects for the state. These funds enabled construction of new schools, public buildings, highways, and parks. As work progressed, Governor Tingley formed a relationship with President Roosevelt, and the two met and corresponded on projects often. Clyde and Carrie Tingley shared a commitment to the sick and disadvantaged, particularly children with disabilities. President Roosevelt, himself a victim of polio, similarly believed the government should take an active role in creating facilities for the care of children with paralysis. Using WPA funds and with strong support from Roosevelt, Governor Tingley set out to build such a hospital in New Mexico, primarily to serve children stricken with polio. A site was selected in the town of Hot Springs, now Truth or Consequences, in part to take advantage of the natural geothermal waters in the town. According to lawyer and historian William A. Keleher:"
author = "MyProject ByFranziska"
