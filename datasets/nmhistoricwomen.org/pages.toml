["https://www.nmhistoricwomen.org/new-mexico-historic-women/myra-ellen-jenkins"]
title = "Myra Ellen Jenkins  - New Mexico Historic Women Marker Program"
description = "Myra Ellen Jenkins was born on September 26, 1916, in Elizabeth, Colorado, to Lewis Harlan Jenkins and Minnie (Ackroyd) Jenkins. Growing up in the Black For ..."
full_description = "The first state historian, she was an authority and expert witness on Pueblo Indian issues and assisted many pueblos in trying to either retain or regain title to their ancestral lands. Teacher, scholar, and friend, her independent thinking, forthright opinions, feisty wit made an impact on all she met. Myra Ellen Jenkins was born on September 26, 1916, in Elizabeth, Colorado, to Lewis Harlan Jenkins and Minnie (Ackroyd) Jenkins. Growing up in the Black Forest region, southeast of Denver and northeast of Colorado Springs, she was part of a family of homesteaders. She descended from English immigrants on her mother’s side, and her father was from Iowa. The land they worked together is still known as the Jenkins Ranch. Her grandfather had been to Santa Fe earlier in his life, working as a stonemason for a church, so stories he told while she was growing up in Colorado included his memories of Santa Fe. She earned her bachelor’s degree in history from the University of Colorado in 1937 but because it was the depression, couldn’t get a job, so she continued on and earned a Master’s in history in 1938. She taught and served as a debate coach in the public school system in Colorado and went on to earn her Ph.D. in Latin American History from UNM in 1953. Thereafter, she was affectionately known as “Dr. J.” After graduating from UNM, Myra Ellen went to work for the Museum of New Mexico in Santa Fe in the spring of 1960. She had been involved in the creation of the New Mexico State Records Center and Archives, and the Spanish and Mexican archives and the records center were at the museum. From the inception of the State Records Center and Archives in 1960 until her retirement twenty years later, Jenkins held the position of chief archivist for the state. That position, as described by an article in the Santa Fe New Mexican, is “responsible for managing and preserving the state’s archives and making them available for use by government agencies, business and the public.”"
author = "MyProject ByFranziska"
