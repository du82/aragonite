["https://www.nmhistoricwomen.org/new-mexico-historic-women/carlotta-thompkins-thurmond-lottie-deno"]
title = 'Carlotta Thompkins Thurmond "Lottie Deno"  - New Mexico Historic Women Marker Program'
description = 'Carlotta Thompkins "Lottie Deno" Thurmond lived a life of legend, and in so doing, likely became the inspiration for the Miss Kitty character in t ...'
full_description = 'Photo Credit: Credit: https://www.findagrave.com/memorial/14303628/carlotta-j.-thurmond Courtesy of New Mexico Historic Women Marker Program. Generally considered the inspiration for Miss Kitty in Gunsmoke and Laura Denbo in Gunfight at the O.K. Corral, her prowess at the faro table and her tough-as-nails personality cemented her reputation as the archetypal "virtuous gambler." Carlotta Thompkins “Lottie Deno” Thurmond lived a life of legend, and in so doing, likely became the inspiration for the Miss Kitty character in the popular TV series Gunsmoke. Born in Warsaw, Kentucky, on April 21, 1844, her early life, particularly her relationship with her father, had a great impact on her. She was born to a wealthy family and spent many of her early years traveling with her father to gambling houses in New Orleans and throughout Europe. When her father was killed after enlisting in the Confederate Army in the Civil War, her mother sent her to Detroit to stay with family friends. But fate—and a natural ability at gambling—had other plans for her. Rather than settling down, she instead connected with a jockey she knew from horse racing, a man named Johnny Golden. Together, the couple (along with her longtime nanny) traveled on riverboats up and down the Ohio and Mississippi rivers, gambling to make a living. She excelled at faro, a popular variation of poker that was common in gambling halls at the time. Parting with Golden, she moved to San Antonio, where she became interested in Frank Thurmond, the owner of a gambling house where she worked. On a journey with Frank through the gambling halls of the southwest, her life turned legendary. Her prowess at the faro table and her tough-as-nails personality cemented her reputation as the archetypal “virtuous gambler.” She’s generally considered the inspiration for the Miss Kitty character in Gunsmoke, as well as the Laura Denbo character in the movie Gunfight at the O.K. Corral. Traveling from San Antonio to Fort Concho, Jacksboro, San Angelo, Denisson, Fort Worth, and finally to Fort Griffin in 1877, this period in her life is rife with stories, though some appear apocryphal. She may have brushed with historical greatness in the form of Doc Holiday, even beating him at several games.'
