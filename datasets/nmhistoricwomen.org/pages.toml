["https://www.nmhistoricwomen.org/new-mexico-historic-women/juliana-gutierrez-y-chavez-hubbell"]
title = "Juliana Gutiérrez y Chavez Hubbell  - New Mexico Historic Women Marker Program"
description = "Juliana Gutiérrez y Chavez Hubbell was a member of two prominent early Spanish families in New Mexico and a descendant of Josefa Baca, a woman who was the o ..."
full_description = "Photo Credit: Public domain. Courtesy of New Mexico Historic Women Marker Program. Courtesy of New Mexico Historic Women Marker Program. Courtesy of New Mexico Historic Women Marker Program. She and her husband built an extensive ranch that she often managed alone, becoming the matriarch of one of the most successful trading families in New Mexico history and helping establish the modern village of Pajarito. Their ranch is preserved today as the historic Gutiérrez-Hubbell House. Juliana Gutiérrez y Chavez Hubbell was a member of two prominent early Spanish families in New Mexico and a descendant of Josefa Baca, a woman who was the original owner of the land comprising present-day Pajarito. In 1849, at the age of 16, she wed trader and army officer James Lawrence Hubbell through an arranged marriage. The couple built an extensive ranch that supported a mercantile and post office, orchards, vineyards, and pasturelands for livestock, which they raised and traded. With her husband often away on business, she managed the property, becoming the matriarch of one of the most successful trading families in New Mexico history and helping establish the modern village of Pajarito. Their ranch is preserved today as the historic Gutiérrez-Hubbell House. Born in 1833, Juliana Gutiérrez was a descendant of Josefa Baca, the original owner of the “Sitio de Paraje,” a large tract of land that comprises today’s community of Pajarito. After Baca’s death around 1756, her son, Antonio, purchased much of the land she had left to her descendants. Antonio’s daughter married Clemente Gutiérrez in 1755, who acquired the Sitio de Parajito and other tracts, which he then passed on to his son, who passed them to Juan Nepomuceno Gutiérrez, the father of Juliana Gutiérrez. Before they were succeeded by the Gutiérrez and Hubbell families, the Baca and Chavez families had become some of the wealthiest and most powerful families in New Mexico. They worked hard and creatively, developing large farming and ranching operations. By 1750, they were among the first traders, leading large caravans to Mexico and building a business empire that lasted into the 20th century. Family members were militia leaders and military officers, mayors, mayordomos, legislators, judges, and lawmen."
