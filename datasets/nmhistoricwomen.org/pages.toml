["https://www.nmhistoricwomen.org/new-mexico-historic-women/captive-women-and-children-of-taos-county"]
title = "Captive Women and Children of Taos County  - New Mexico Historic Women Marker Program"
description = "From the seventeenth century into the nineteenth century, raiding and trading human beings, especially women and children, occurred with regularity in New M ..."
full_description = "Photo Credit: Courtesy of New Mexico Historic Women Marker Program. Courtesy of New Mexico Historic Women Marker Program. On the New Mexico frontier during the 17th and 18th centuries, Hispanic and Indigenous communities regularly raided each other, suffering enormous consequences. Thousands of women and children were taken captive. Most were never returned. From the seventeenth century into the nineteenth century, raiding and trading human beings, especially women and children, occurred with regularity in New Mexico. Native Americans took and traded human captives among themselves as well as in the communities in north-central New Mexico. Captives were necessary for religious purposes, menial tasks, and trade. Some captives were traded at trade fairs held at Taos, Abiquiu, and Pecos, where captive Hispanics were traded back to their own society or captive Indians from as far away as Nebraska were traded into New Mexican society. Many of these latter people remained in New Mexican society. They and their descendents became known as genízaros in New Mexico. Many Hispanic punitive expeditions took Native captives. Many of New Mexico’s early governors illegally ran sweatshops of captive Indians. They were also involved in illegally trading captives south into Mexico. The Diné (Navajo) raided western New Mexican settlements incessantly. At one time their raids successfully depopulated the Rio Puerco Valley, which they saw as a part of their homeland. Today, the descendents of many of these captives form a Mexican Clan in the Diné Nation. María Rosa Villalpando is one case study. Taken in a Comanche raid on Ranchos de Taos in 1760, she was traded to the Pawnee tribe, with whom she lived for ten years. During that time she had a son and met a French trader who fathered her third child, ransomed her, and took her to the new village of St. Louis, where they were married in 1770. She and her husband had three more children. After twenty-two years of marriage her husband went to France and never returned. Ten years later, in 1802, Maria Rosa’s first child, Joseph Julian Jacques, a son from New Mexico who survived that long-ago raid, crossed the plains to visit his mother. She acknowledged him and made an estate settlement with him."
