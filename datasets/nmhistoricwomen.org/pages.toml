["https://www.nmhistoricwomen.org/new-mexico-historic-women/soledad-chavez-chacon"]
title = "Soledad Chávez de Chacón  - New Mexico Historic Women Marker Program"
description = "In 1922, two years after women gained the right to vote, Soledad Chavez de Chacon was elected Secretary of State, the first Hispanic woman to hold statewide ..."
full_description = "Two years after women gained the right to vote, she was elected Secretary of State, the first Hispanic woman to hold statewide office in New Mexico and the country. In 1921–only three years earlier–New Mexico had become one of the last states to allow women in public office. Her achievements opened doors. In 1922, two years after women gained the right to vote, Soledad Chavez de Chacon was elected Secretary of State, the first Hispanic woman to hold statewide office in New Mexico and the country. She descended from a family of territorial governors and office holders, and “the hand of destiny” provided another historic opportunity in 1924: Lt. Governor José Baca passed away while Governor James Hinkle was out of state, leaving Secretary Chacόn to assume the duties of the governor, becoming the first female Hispanic in the nation to govern a state. New Mexico was one of the last states in 1921 to allow women in public office, and Soledad’s achievements opened doors. Born in Albuquerque on August 10, 1889, to Melitón Chávez and Francisca Baca, she graduated from Albuquerque High School in 1908, and earned a degree in accounting from Albuquerque Business College. Nicknamed Lala, she does not appear to have pursued accounting professionally. In 1910, she married Ireneo Eduardo Chacón and was raising two children, a daughter and a son, with him. In 1922, shortly after the passage of the 19th amendment to the Constitution granted women the right to vote, Democrats in New Mexico floated the possibility of running a woman on their ticket to help secure votes of women. Republicans were doing likewise. After discussion at the Democratic State Convention in Albuquerque, five powerful leaders of the party—Felipe Chacón (her brother-in-law), Dennis Chaves (her cousin, and future U.S. Senator of New Mexico), Thomas Mabry, John Miles, and Stephen Rael—arrived one afternoon at the home of Soledad Chávez de Chacón and asked the 32-year-old to accept the nomination of the party for the office of New Mexico secretary of state."
author = "MyProject ByFranziska"
year_published = 2023
year_updated = 2023
