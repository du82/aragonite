["https://www.nmhistoricwomen.org/new-mexico-historic-women/maria-montoya-martinez-povika-pond-lily"]
title = "Maria Montoya Martinez, Povika, “Pond Lily”  - New Mexico Historic Women Marker Program"
description = "Maria Montoya Martinez, Povika, “Pond Lily,” was a self-taught potter, who, with her husband, Julian Martinez, revived black pottery. In the late nineteenth ..."
full_description = "Photo Credit: Courtesy of New Mexico Historic Women Marker Program. Courtesy of New Mexico Historic Women Marker Program. One of the most written about and photographed Pueblo potters, she reinvigorated interest in Pueblo pottery and helped transform a utilitarian item to an art. She and her husband visited the White House and attended world’s fairs, serving as ambassadors of Pueblo life. Maria Montoya Martinez, Povika, “Pond Lily,” was a self-taught potter, who, with her husband, Julian Martinez, revived black pottery. In the late nineteenth century, pottery usage and production had been in decline as commercially produced goods became more common in New Mexico, a trend that started with the opening of the Santa Fe Trail in 1821. Maria and Julian reinvigorated interest in Pueblo pottery and helped transform the utilitarian item to an art. Maria, who lived into her nineties, was one of the most written about and photographed Pueblo potters. Maria was born in San Ildefonso Pueblo, a Tewa speaking community about twenty miles northwest of Santa Fe. Born to Tomas and Reycita Peña Montoya, Maria was the second of five daughters. She attended St. Catherine’s Indian School in Santa Fe for two years. As a child, Maria learned to make pottery by observing women in her community, including her maternal aunt, Nicolasa Peña Montoya and Martina Montoya, a respected potter. In 1904, she married Julian Martinez, also from San Ildefonso. On the same day they married, they headed to St. Louis World’s Fair, where they demonstrated pottery making and traditional dances. In 1907, the School of American Research, under the direction of Dr. Edgar L. Hewett, undertook an excavation of the Pajarito Plateau, a prehistoric Pueblo site. Julian was among the local men hired to dig the site. Maria became interested in pottery shards uncovered at the excavation. Hewett encouraged her to replicate some of the ancient pots, while Julian reproduced wall and pottery designs from the site. Julian, a talented painter, is credited with adapting the avanyu (water or plumed serpent) from ancient sources. As collaborators, Maria shaped the pots and Julian painted them."
author = "MyProject ByFranziska"
year_published = 2023
