["https://www.nmhistoricwomen.org/new-mexico-historic-women/amelia-elizabeth-white"]
title = "Amelia Elizabeth White  - New Mexico Historic Women Marker Program"
description = "Amelia Elizabeth White and her younger sister Martha arrived in Santa Fe in 1923, purchased land, and built a magnificent estate on Garcia Street, now home  ..."
full_description = "Her magnificent estate on Garcia Street, now home to the School for Advanced Research (SAR), was a gathering place for Santa Fe artists, writers, and archaeologists, and White worked tirelessly to protect the heritage and improve the lives of the residents of her adopted community. Amelia Elizabeth White and her younger sister Martha arrived in Santa Fe in 1923, purchased land, and built a magnificent estate on Garcia Street, now home to the School for Advanced Research (SAR). El Delirio, or the Madness as it was called, quickly became a gathering place for Santa Fe artists, writers, and archaeologists who flocked to its billiard house, tennis court, and swimming pool, the first in Santa Fe. Guesthouses were constructed to accommodate their visitors, who included Agatha Christie and her archaeologist husband, Max Mallowan. Built to resemble the mission church at Laguna Pueblo, the main house reflected a growing interest in Santa Fe style. Their parties were legendary and included such luminaries as William Penhallow and Alice Corbin Henderson, Witter Bynner, John Sloan, Gustave Baumann, Randall Davey, Will Shuster, and Sylvanus Morley. Born in New York City and educated at Bryn Mawr, White enjoyed Santa Fe’s colorful traditions, especially Fiesta. Dressed in a sixteenth-century English hunting costume, she marched in the 1933 Fiesta parade, accompanied by four Irish wolfhounds. Standing 36 inches at the shoulder, they dwarfed White, who was barely five feet tall. “She was a tiny little thing,” noted archaeologist Marjorie Lambert. “She weighed perhaps not quite 90 pounds, but she had a brain on her like steel wool.” The sisters were partial to big dogs, especially Irish wolfhounds, which they raised at El Delirio. They built a state-of-the art kennel, which they called Rathmullen, and hired Alex Scott, a professional trainer, to show their dogs. In 1934 the American Kennel Gazette described Rathmullen as “one of the leading establishments of Irish wolfhounds in the United States.” White would later raise and show Afghans under the name Kandahar Kennels."
