["https://www.nmhistoricwomen.org/new-mexico-historic-women/debbie-martinez-la-chicanita"]
title = "Debbie Martinez, “La Chicanita”  - New Mexico Historic Women Marker Program"
description = "In the mid-1970s, when many young Chicano teenagers were protesting, attending college, or working for family businesses, a flowering music scene was blosso ..."
full_description = "One of the youngest in a musical family, she was a star of the unique Nuevo Mexico sound that started in the 1950’s. At age 12, her recording of “Una Pobre Tambien” became a hit and she toured extensively. When she lost her hearing in her 20s, she returned to school and became a lawyer for immigrants. In the mid-1970s, when many young Chicano teenagers were protesting, attending college, or working for family businesses, a flowering music scene was blossoming in the central Rio Grande Valley of New Mexico. Starting in the 1950s, a blend of music from Mexico in the form of ranchera and mariachi sounds, along with the rock and country sounds from Tennessee and west Texas, came together in New Mexico to blend with the already ancient Indo-Hispano music forms of the region to create a unique Nuevo Mexico sound that would resonate for decades to come. Indicative of this movement were the Sánchez brothers, Al Hurricane, Baby Gaby, and Tiny Morrie, who fused Mexican and Rock and Roll sounds to become trailblazers of New Mexican’s Spanish language music scene. Another family dynasty of musicians was established in Albuquerque in 1961 by Roberto Martínez, a native of the Mora Valley in northern New Mexico. His early years of hearing Penitente alabados and obsession with Pedro Infante culminated with the founding of his New Mexican mariachi group, Los Reyes de Albuquerque. Roberto finished what could be considered an eight year apprenticeship in Denver, playing guitar and singing in a Mexican duo called Los Trobadores, with his wife Ramona’s uncle Jesse Ulibarri. With guitar in hand and a drive to express himself through his Hispano Mexican musical forms, Roberto and Los Reyes started to build a following and make a name for themselves in Albuquerque, playing bars like Molly’s in Tijeras for tips, but also performing for dignitaries such as John F. Kennedy. Around 1966, Roberto and Ramona, who had five children by this time, encouraged the three eldest siblings, Roberta, Doris, and Lorenzo, to form a trio called Los Chamacos. Originally a Spanish language group that performed traditional Mexican songs, they started to branch out, singing the popular pop and rock songs of the day by groups artists such as The Beatles, The Rolling Stones and Bob Dylan, among others. In a stroke of creativity ahead of his time, Roberto would translate the lyrics to Spanish and Los Chamacos would sing songs bilingually. They even recorded a few singles on the Hurricane label established by the Sánchez family. The group performed as a trio, but also with local mariachis, including Los Reyes de Albuquerque. By the late 1960s, the older girls were ready to graduate from high school and pursue relationships, marry, and have children. In a last attempt to keep Los Chamacos together, Roberto had their fourth child, Debbie, sing with the group to see if she could add a jolt of energy."
author = "MyProject ByFranziska"
year_published = 2023
year_updated = 2023
