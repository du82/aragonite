full_description = '''Curriculum Curriculum Welcome, Educators! The New Mexico Historic Women Marker Program is as much about the future as it is about the past. Through stories, we hope to inspire young people to think about their role in history going forward and the legacy they will leave. We encourage educators to connect with each other through our program, explore our curriculum, and use our website to introduce students to the wonderful women who have helped shape New Mexico’s history. How to Use This Curriculum These lessons are designed to engage learners on a journey through time with a diverse array of the women of New Mexico. Grade level groupings contain multiple lesson plans that are intended to be taught in sequence in order to build knowledge, skills, and connections between the past and present. Each lesson references the New Mexico PED Social Studies and Humanities Content Standards, allowing teachers to easily align the lessons to meet student needs. We invite you to join this community that inspires our future. .singWomenContainer .singWomenContent > p:nth-child(n + 3) { display: none; } .singWomenContainer .singWomenContent > h3, .singWomenContainer .singWomenContent > ul { display: none; } .singWomenContainer .singWomenContent > p.showList:nth-child(n + 3) { display: block; } .singWomenContainer .singWomenContent > h3.showList, .singWomenContainer .singWomenContent > ul.showList { display: block; } .singWomenContainer p.more { color: #38585A; font-weight: 600; font-style: oblique; cursor: pointer; min-width: 120px; text-align: center; } .singWomenContainer label.more.showMe { display: block; } .readMoreDivider { display: flex; align-items: center; padding: 1em 0 2em; } .readMoreDivider hr { width: auto; flex-grow: 1; } .readMoreDivider p { width: fit-content; } .singWomenContent p { line-height: 1.7em; } var liCount; $(document).ready(function () { $( '<div class="readMoreDivider hideOnPrint" style="column-span: all;"><hr><p class="more">READ MORE</p> <hr></div>' ).insertAfter( ".singWomenContainer p:nth-child(2)" ); $(".singWomenContainer .singWomenContent").each(function () { liCount = $(this).children("p").length; if (liCount > 2) { $(this).next(".more").addClass("showMe"); } }); $(".more").click(function () { $(".singWomenContent").find("p, h3, ul").toggleClass("showList"); var $this = $(this); $this.toggleClass('SeeMoreTC'); if($this.hasClass('SeeMoreTC')){ $this.text('READ LESS'); } else { $this.text('READ MORE'); } }); }); .searchWomenButton { display: flex; justify-content: center; } .searchWomenButton a { color: #FFFFFF!important; border-width: 0px!important; border-radius: 6px; font-size: 18px; font-weight: 500!important; background-color: #00737F; display: flex; justify-content: center; align-items: center; padding: 15px 25px; cursor: pointer; } .searchWomenButton a img { max-height: 35px; padding-left: 20px; } Introduction to the Curriculum - Read this first Grade Levels .readMoreDivider { display: none; } .lessons-header { margin-bottom: 30px; display: grid; grid-template-columns: 1fr 3fr; } .lessons-header .lessons-header-leftCol { margin-right: 15px; border-radius: 26px; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; color: white; font-family: "made_mirageregular"; font-size: 50px; } .lessons-header .lessons-header-rightCol { margin-left: 5px; display: flex; flex-direction: column; gap: 20px; } .lessons-header .lessons-header-rightCol .lessons-description { flex-grow: 1; border-radius: 26px; padding: 40px 25px; border: 1px solid #d4d4d4; } .lessons-description p { color: #444444; line-height: 1.5em; } .lessons-header.gk-2nd .lessons-header-leftCol { background-color: #e3cd88; } .lessons-header.gk-2nd .lessons-description { background: rgb(227 205 136 / 30%); display: flex; align-items: center; } .lessons-header.g3rd-5th { padding-top: 30px; } .lessons-header.g3rd-5th .lessons-header-leftCol { background-color: #c8d19b; } .lessons-header.g3rd-5th .lessons-description { background: rgb(200 209 155 / 30%); display: flex; align-items: center; } .lessons-header.g6th-8th { padding-top: 30px; } .lessons-header.g6th-8th .lessons-header-leftCol { background-color: #9fc1cb; } .lessons-header.g6th-8th .lessons-description { background: rgb(160 192 203 / 30%); display: flex; align-items: center; } .lessons-header.g9th-12th { padding-top: 30px; } .lessons-header.g9th-12th .lessons-header-leftCol { background-color: #e4b08f; } .lessons-header.g9th-12th .lessons-description { background: rgb(228 176 143 / 30%); display: flex; align-items: center; } .lessons-button { min-width: 225px; width: max-content; text-align: center; font-size: 20px; background: gainsboro; color: #00747f; border-radius: 16px; padding: 10px 15px; cursor: pointer; } .lessons-container { overflow: hidden; visibility: hidden; opacity: 0; margin-top: -40px; margin-bottom: 40px; max-height: 0; transition: opacity .5s ease-in-out, visibility .5s ease-in-out, margin-top .5s ease-in-out, margin-bottom .5s ease-in-out, max-height .5s ease-in-out; } .lessons-container.active { visibility: visible; opacity: 1; margin-top: 0; margin-bottom: 0; max-height: 350px; transition: opacity .5s ease-in-out, visibility .5s ease-in-out, margin-top .5s ease-in-out, margin-bottom .5s ease-in-out, max-height .5s ease-in-out; } @media screen and (max-width: 1100px) { .lessons-header { grid-template-columns: 1fr 2fr; } .lessons-container.active { max-height: 800px; } .lessons-header .lessons-header-leftCol { margin-right: 13px; } .lessons-header .lessons-header-rightCol { margin-left: 7px; } } @media screen and (max-width: 800px) { .lessons-header { grid-template-columns: 1fr; gap: 20px; } .lessons-header .lessons-header-leftCol { margin-right: 0; } .lessons-header .lessons-header-rightCol { margin-left: 0; } .lessons-header .lessons-header-leftCol { aspect-ratio: 4 / 1; } } @media screen and (max-width: 500px) { .lessons-header .lessons-header-leftCol { font-size: 40px; aspect-ratio: 4 / 1; } .lessons-container.active { max-height: 2030px; } } K-2nd Students deepen their understanding of communities through learning about women from New Mexico in a cross-grade-level setting. Students explore someone in their own life that makes a significant difference for a community, imagining that one day they could be recognized on a historic marker. The lessons promote cooperative learning, listening, writing, and observation skills, along with artistic expressions of understanding. Show Lesson Plans 3rd-5th In order to place women within New Mexico’s historical timeline, students complete independent research on a specific woman from the New Mexico Historic Women Marker Program website. The lessons include reading, note taking and outlining, writing a monologue, creating a commemorative coin, and community connection through teaching younger students in a cross-grade-level project. Show Lesson Plans 6th-8th Through historical inquiry and source analysis, students are introduced to the women featured on the New Mexico Historic Women Marker Program website. The lessons include reading, note taking, writing, creative presentations, source analysis, and a final collaborative “tea party” where students make connections between women from varied eras, backgrounds, and cultures. Show Lesson Plans 9th-12th Students utilize the New Mexico Historic Women Marker Program website as a means to delve further into the scholarship of primary and secondary source use. The lessons include analysis of creating an identity of “home,” civic contributions, determining the reliability of a source, research skills and essay writing, and a creative collaborative “dinner party.” A final stand-alone lesson guides students through an examination of the collective impacts made by groups of women. Show Lesson Plans jQuery(document).ready(function($) { $( ".lessons-header.gk-2nd .lessons-button" ).click(function() { var $this = $(this); $this.toggleClass('hideLP'); if($this.hasClass('hideLP')