["https://www.nmhistoricwomen.org/new-mexico-historic-women/chief-justice-pamela-b-minzner"]
title = "Chief Justice Pamela B. Minzner  - New Mexico Historic Women Marker Program"
description = "One of approximately twenty women in the Harvard law class of five hundred, she and her female classmates found their job search after law school challengin ..."
full_description = "Photo Credit: Courtesy of New Mexico Historic Women Marker Program. Courtesy of New Mexico Historic Women Marker Program. Courtesy of New Mexico Historic Women Marker Program. A tireless jurist, trailblazer for other women, and UNM professor dedicated to and admired by her students, she was said to have influenced more young female lawyers than any other individual in the state. In 1999, she became the first woman Chief Justice of the New Mexico Supreme Court. One of approximately twenty women in the Harvard law class of five hundred, she and her female classmates found their job search after law school challenging. Law firms were recruiting male graduates but ignoring the women. The female students, well versed in their legal rights, pushed to interview with every single Boston Law Firm, reportedly forcing one well dressed Boston lawyer interviewer to back up against the wall, aghast at the sight of six women walking through the door to be interviewed for a job. The female law students were helped by the 1964 Civil Rights Act, which prohibited discrimination in employment on the basis of sex. After rejecting a position as an office manager, the future Chief Justice Minzner was hired as an attorney with the Boston firm of Bingham, Dana and Gould. After marrying Richard Minzner, a fellow Harvard Law School student, Pamela Minzner moved to New Mexico in 1971, joining the firm of Cotter, Hernandez, Atkinson, Campbell and Kelsey. She and her husband had two sons, Max and Carl. She often spoke of the importance of maintaining the delicate balance between career and family, especially for women–one of the motivating factors in her accepting a teaching position at University of New Mexico Law School. Minzner’s teaching career began when a partner at Minzner’s law firm introduced her to the first woman hired as a tenured faculty member at the University of New Mexico Law School. Minzner joined the faculty in 1972 and credited her position on the Court of Appeals and then on the Supreme Court in part to several women who were her students and graduates of the law school."
