title = "Women Markers Archive  - New Mexico Historic Women Marker Program"
full_description = "Mexican Period (1821 - 1848) | Spanish Colonial (1540 - 1821) | Statehood (1912 - present) | Territorial Period (1848 - 1912) | Mexican Period (1821 - 1848) | Spanish Colonial (1540 - 1821) | Statehood (1912 - present) | Territorial Period (1848 - 1912) | Mexican Period (1821 - 1848) | Pre-Colonial | Spanish Colonial (1540 - 1821) | Statehood (1912 - present) | Territorial Period (1848 - 1912) | Mexican Period (1821 - 1848) | Pre-Colonial | Spanish Colonial (1540 - 1821) | Statehood (1912 - present) | Territorial Period (1848 - 1912) | Mexican Period (1821 - 1848) | Pre-Colonial | Spanish Colonial (1540 - 1821) | Statehood (1912 - present) | Territorial Period (1848 - 1912) | She ran the ranch and raised three children, all of whom became prominent figures in New Mexico history, including Agnes Morley Cleaveland, author of No Life for a Lady. Her book No Life For a Lady, first published in 1941, is an autobiographical story of a woman's life on a turn-of-the-century ranch. The book has been an invaluable resource to subsequent generations of scholars interested in the ranching west. Called the “matriarch” of Hispanic weaving in New Mexico, she made her own dyes from plants and flowers, constantly invented new designs, and taught others how to weave, including fifty-two direct descendants in her family. Her magnificent estate on Garcia Street, now home to the School for Advanced Research (SAR), was a gathering place for Santa Fe artists, writers, and archaeologists, and White worked tirelessly to protect the heritage and improve the lives of the residents of her adopted community. A survivor of the 1680 Pueblo Revolt, she led her family back to New Mexico, widowed and destitute, and in 1716, successfully petitioned the New Mexico governor to reinstate her as the lawful owner of her late father's San Clemente land grant, which had been his encomienda before the Pueblo Revolt. An important western voice in The Harlem Renaissance, Coleman taught and published more than thirty short stories and poetry, appearing in The Competitor, Opportunity: Journal of Negro Life, and other outlets popular with Harlem Renaissance writers."
