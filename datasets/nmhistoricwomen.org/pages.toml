title = "Home  - New Mexico Historic Women Marker Program"
description = "From potters to political game changers to the quiet but courageous core of communities, women have been shaping New Mexico's history for centuries."
full_description = "Celebrating New Mexico’s Trailblazing Women Celebrating New Mexico’s Trailblazing Women From potters to political game changers to the quiet but courageous core of communities, women have been shaping New Mexico history for centuries. THROUGH ROADSIDE MARKERS ACROSS THE STATE, THE NEW MEXICO HISTORIC WOMEN MARKER PROGRAM TELLS THE STORIES OF SOME OF THESE WOMEN—ARTISTS, ACTIVISTS, EDUCATORS, ENTREPRENEURS, LAWYERS, HEALERS, POLITICIANS, GRANDMOTHERS, GAMBLERS, VISIONARIES, THINKERS, LEADERS—WHOSE ENDURING LEGACY CONTINUES TO INSPIRE WOMEN AND MEN OF ALL AGES TODAY. Maria Montoya Martinez, Povika, “Pond Lily” One of the most written about and photographed Pueblo potters, she reinvigorated interest in Pueblo pottery and helped transform a utilitarian item to an art. She and her husband visited the White House and attended world’s fairs, serving as ambassadors of Pueblo life. Graciela Olivárez Despite lacking a high school diploma, she was accepted to Notre Dame Law School and in 1970 became its first woman graduate. Through her work as an attorney, public servant, entrepreneur, and civil rights activist, she became one of the most notable Hispanic women in the United States. Debbie Martinez, “La Chicanita” One of the youngest in a musical family, she was a star of the unique Nuevo Mexico sound that started in the 1950’s. At age 12, her recording of “Una Pobre Tambien” became a hit and she toured extensively. When she lost her hearing in her 20s, she returned to school and became a lawyer for immigrants. Soledad Chávez de Chacón Two years after women gained the right to vote, she was elected Secretary of State, the first Hispanic woman to hold statewide office in New Mexico and the country. In 1921–only three years earlier–New Mexico had become one of the last states to allow women in public office. Her achievements opened doors. Myra Ellen Jenkins The first state historian, she was an authority and expert witness on Pueblo Indian issues and assisted many pueblos in trying to either retain or regain title to their ancestral lands. Teacher, scholar, and friend, her independent thinking, forthright opinions, feisty wit made an impact on all she met. Women of Shakespeare (Emma Marble Muir, Rita Wells Hill, Janaloo Hill Hough) Through the tireless efforts of three women from three generations, a piece of New Mexico history has been preserved for posterity. If not for their preservation, protection, research, and education efforts, the “ghost town” of Shakespeare would have faded into oblivion both physically and in memory. Georgia O’Keeffe One of New Mexico’s most famous citizens, her abstract charcoal drawings from 1916 are now recognized as among the most innovative in all of American art of the period. As early as the mid-1920s, she was considered one of America's most important and successful artists, a legacy that continues today. Juliana Gutiérrez y Chavez Hubbell She and her husband built an extensive ranch that she often managed alone, becoming the matriarch of one of the most successful trading families in New Mexico history and helping establish the modern village of Pajarito. Their ranch is preserved today as the historic Gutiérrez-Hubbell House. Ida O. Jackson A Black woman who began teaching when schools were segregated, she helped grow Clovis’s Black school from two to 35 students; their school was named in her honor. She contributed to her community in many ways, teaching Sunday school, offering housing, and helping launch a social club for Black women. .searchWomenButton { display: flex; justify-content: center; } .searchWomenButton a { color: #FFFFFF!important; border-width: 0px!important; border-radius: 16px; font-size: 18px; font-weight: 700!important; background-color: #5babb5; display: flex; justify-content: center; align-items: center; padding: 10px 25px; cursor: pointer; } .searchWomenButton a img { max-height: 35px; padding-left: 20px; } Search by Location, Category, or Era Upcoming Events 