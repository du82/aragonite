ways and byways of New Mexico's 33 counties tell an inspiring story. Thanks to the New Mexico Historic Women Marker Program, log-hewn roadside markers throughout the state now celebrate the lives and accomplishments of more than 100 women-early... New Mexico Magazine: Celebrating New Mexico’s Trailblazing Women Feb 22, 2023AN IDEA THAT FLOURISHED INTO AN INITIATIVE IN 2006, the New Mexico Historic Women Marker Program celebrates some of the many courageous women who helped shape the unique, multicultural history of New Mexico. Through roadside markers, curriculum, public outreach, and... « Older Entries @nmhistoricwomen Announcements #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; width:600px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ #mc-embedded-subscribe-form input[type=checkbox]{display: inline; width: auto;margin-right: 10px;} #mergeRow-gdpr {margin-top: 20px;} #mergeRow-gdpr fieldset label {font-weight: normal;} #mc-embedded-subscribe-form .mc_fieldset{border:none;min-height: 0px;padding-bottom:0px;} #mc_embed_signup input {border: 1px solid transparent;} #mc_embed_signup form {width: 100%; padding: 0 30px;} #mc_embed_signup #mce-success-response { color: #000; text-align: center; width: 100%; margin-top: 0; display: none; } Sign up for announcements (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';fnames[5]='BIRTHDAY';ftypes[5]='birthday';}(jQuery));var $mcj = jQuery.noConflict(true);"
