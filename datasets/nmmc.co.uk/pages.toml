["https://nmmc.co.uk/monsters-of-the-deep"]
title = "Monsters of the Deep | National Maritime Museum Cornwall"
description = "In National Maritime Museum Cornwall's Monsters of the Deep, take a deep breath, plunge down into the murky depths of the ocean and discover what lurks beneath."
full_description = "Take a virtual tour of Monsters of the Deep from the air, soar through the exhibition, come face-to-face with a killer whale skeleton, glide around the space and meet some real monsters of the deep. From a terrifying Feegee mermaid to the spindly legs of a giant sea spider there are plenty of sights to see. Explore our top reasons to dive into the mysterious world of the deep sea. Hundreds of sea creature specimens from the National Oceanography Collection arrived at the Museum recently. Find out more about their role in Monsters of the Deep. Preparations for Monsters of the Deep are in full swing and strange and bewildering deliveries are arriving daily to the Museum - see what arrived this week! From mummified mermaids to giant krakens the size of an island, our new major exhibition, Monsters of the Deep, will take visitors on an immersive tour through the world of deep-sea monsters. Dr Darren Naish is a zoologist and author, best known for his work on dinosaurs and other prehistoric reptiles as well as for his writings on sea monsters and other mystery beasts. Dr Tammy Horton is a Research Scientist at the National Oceanography Centre (NOC), Southampton. She is an expert in deep-sea taxonomy, ecology and biodiversity. Dr Jon Copley is guest curator of Monsters of the Deep, marine biologist and Associate Professor in Ocean Exploration & Public Engagement at the University of Southampton. Isabel Stevens is a writer, editor and curator based in London, and is the production editor for Sight and Sound, a monthly international film magazine published by the BFI. Viktor Wynd is an artist who uses museum objects in the way that other artists use paint. He’s the founder and proprietor of London’s famous Museum of Curiosities, Fine Art & UnNatural History. At the entrance to Monsters of the Deep a huge eye keeps watch. It was designed and created by A-Side Studio and Engine House Animation Studio - find out more about the process. Below the glistening surface of the sea, lurking down at the extreme depths of the ocean are hair-raising, toe-curling, horror-making monsters. With deadly weapons and carnivorous appetites, the deep-seas can be a terrifying place."
