full_description = "Friday 28 June 2024 – Sunday 8 June 2025. An intimate exhibition celebrating the 100th anniversary of the Sunbeam one-design keelboat boat racing in Falmouth. Saturday 23 November 2024 - Sunday 4 January 2026. An evocative, multi-media exhibition on the resilience of Cornwall’s coastal communities past, present and future. Let imaginations run wild in the Skull Island Play Zone. Become a pirate and captain your crew from the quarterdeck while keeping watch for intruders! Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Through our exhibitions programme, we aspire to bring new and diverse perspectives to maritime issues and highlight their relevance to the present day. We also bring rare objects from around the world to Cornwall, telling local, national, and international stories. The admission fee, which includes entry for a year, is reinvested back into the Museum to enhance and grow our activity; this encompasses our family learning activities, our award-winning education programmes, our boatbuilding and conservation, and our work preserving and promoting Cornwall’s maritime heritage. We are an independent museum and charity. Our day-to-day operation doesn’t receive any government funding, which means we are reliant on admission fees and Gift Aid. All revenue is reinvested back into the Museum. We also rely on volunteers who give over 30,000 hours of their time every year. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
