title = "About | National Maritime Museum Cornwall"
description = "We rely on visitor income to continue our work. Your generous support enables us to fulfil our educational mission and preserve maritime heritage."
full_description = "We rely on visitor income to continue our work. Your generous support enables us to fulfil our educational mission and preserve maritime heritage. Despite its title, National Maritime Museum Cornwall does not receive any government funding or grants. We rely on the support of our visitors. Our Trustees act as guardians and we seek to represent a broad range of different backgrounds, areas of expertise and perspectives on the Board. National Maritime Museum Cornwall is a celebration of the sea. Find out more about our beginnings and some of the highlights of the last 20 years. Find out about current job vacancies and careers at National Maritime Museum Cornwall, located on Discovery Quay in Falmouth."
