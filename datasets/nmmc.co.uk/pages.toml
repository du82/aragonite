["https://nmmc.co.uk/tidal-zone"]
title = "Tidal Zone | National Maritime Museum Cornwall"
description = "Descend below sea level in the Tidal Zone and glimpse an underwater view of Falmouth Harbour through two large windows."
full_description = 'Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Descend below sea level in the Tidal Zone and glimpse an underwater view of Falmouth Harbour through two large windows. If you stand here long enough, you’ll see the tide rise and fall. You never know what you’ll find swimming through the water or climbing along the other side of the glass. Take a close look and you might spot a cormorant diving after a fish, crabs, shrimps, and maybe even a seal. Here, you can also learn about the effects of the moon and sun on the tides, and how they are caused. Interactive displays also introduce some of the animals and plants that live in the estuary, which is a Special Conservation Area that’s home to a wide diversity of species. {"@context":"http:\/\/schema.org\/","@id":"https:\/\/nmmc.co.uk\/tidal-zone\/#arve-youtube-5cjxwjh1dj8","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/5cJXwJH1DJ8?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} {"@context":"http:\/\/schema.org\/","@id":"https:\/\/nmmc.co.uk\/tidal-zone\/#arve-youtube-0sc856ikdry","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/0sc856IkDRY?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} {"@context":"http:\/\/schema.org\/","@id":"https:\/\/nmmc.co.uk\/tidal-zone\/#arve-youtube-ankvvsulxqa","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/aNKvVSulXQA?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884'
