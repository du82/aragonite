["https://nmmc.co.uk/object/boats/daisy-daisy-give-me-your-answer-do"]
title = "BC04 – Sailing dinghy “Daisy Belle” | NMMC"
description = "After being found in a sorry state in a Falmouth creek, former racing dinghy Daisy Belle was restored as closely as possible to her original form."
full_description = "Daisy Belle began life racing and fishing around Falmouth before retiring to more leisurely use.Built by William Brabyn at his Calenick Creek, Truro Yard c.1885, her name was inspired by the 1890s popular song ‘A bicycle built for two’. She remained in the ownership of the Nicholls family until the Museum acquired her in 2001.The boat was found to be remarkably fast, and a racing report from Mylor regatta in 1913 shows her as having come second in the cruisers under 18ft class. She was also very quick to go about, but that operation required the shifting of large amounts of ballast between the leeward and the windward sides.In the 1950s Daisy Belle was discovered in a sorry state of repair in a Falmouth creek, and was nearly cut up to make a garden seat. Fortunately the family member concerned had second thoughts so she was repaired and altered. The rig, already previously converted from her original lug and mizzen to gunter, was converted again to bermudian, a steel centreplate was added, and a centreplate box was built to house it. At some point a foredeck and side decks were also added.When the Museum acquired Daisy Belle the decision was taken to remove all non-original material and restore her to her former configuration and rig. The decision was also taken to make her part of the Museum’s historic floating collection.She was restored as closely as possible to her original form under the expert guidance of local boat builder Ralph Bird, before his death in 2009.The fore and side decks have been removed, as has the centreplate and box. Broken and rotten ribs have been replaced with ones more characteristic of boats from the Fal, and her rig has been restored to the original lug and mizzen form.It is hoped that, as long as her conditions permits, during the summer months Daisy Belle will be seen both on the Museum pontoon, and making guest appearances at local regattas.Dimensions: LOA 14ft 6ins; beam 5ft 10ins; draft 1ft 6insDesigner and builder: Joseph BrabynYear of build: c.1885Original owner: Joseph Nicholls (b.1874)Rig: lug and MizzenAlbatross Mk II Continental – L83.1Ben Ainslie’s Finn “Rita”"
