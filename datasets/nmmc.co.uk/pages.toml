full_description = "There are so many exciting things happening at the National Maritime Museum Cornwall this year: from the BRAND NEW Titanic Stories exhibition, to NEW Pirate School in the Easter and… What a year! This video showcases key highlights achieved by the team at The National Maritime Museum Cornwall in 2017. With thanks to all our supporters, staff, and volunteers. The ground-breaking exhibition Tattoo: British Tattoo Art Revealed was only possible due to the passion and knowledge of individual collectors, and the objects they saved. Without them, all this material… A sneaky peak at this unique installation Tattoos are a living and uniquely three dimensional form of art. The museum responded to this by commissioning an innovative installation which literally brings… Cruel tyrant? Or maritime hero? Twelve young people from St Ives Secondary School have researched and produced this documentary film that challenges the popular perception of Captain William Bligh as… What does Conrad think of our replica Bounty launch built in-house at the museum? Conrad Humphreys is a competitive sailor and professional skipper onboard the ambitious recreation of Bligh’s legendary journey for Channel 4 programme ‘Mutiny.’ Here he talks about one of his highlights in our Captain Bligh exhibition. A modern master chooses his exhibition highlights Tattoo: British Tattoo Art Revealed features over 400 artefacts and artworks including memorabilia donated by legend Alex Binnie from his iconic shop ‘Into…"
