["https://nmmc.co.uk/about/support-us/donations"]
title = "Donations and sponsorship | National Maritime Museum Cornwall"
description = "We are most grateful for any donation you feel able to give to support our work. Here are some examples of what your donation could enable us to do."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Whether you are interested in restoring historic boats, inspiring children with tales of heroic adventures on the sea, or supporting our exhibition programme, below are some examples of what your donation could enable us to do. The Bartlett Library has a large collection of archive materials that either require conservation now or will require conservation in the future. You could help The Library in its work in other areas by donating money towards the binding of books and magazines or refurbishing a large volume. The cost of each of these activities is small, £40 – £200, but will have a lasting benefit to our collections. New display cases of various shapes and sizes are needed for our galleries throughout the Museum. Each new exhibition will require cases to display objects and these will range from table top cases to large free standing cases. National Maritime Museum Cornwall holds some of the nation’s most important boats. We are committed to the restoration and conservation of these boats so that they can be enjoyed by the general public. To provide basic maintenance for one of the boats in our historic floating collection costs an average of £500 per year for materials alone. Major restoration projects cost a lot more. You may prefer to make a general donation to the Museum as a whole instead of identifying a specific area on this list. We welcome any support you may offer and can assure you that it will be put to good use. To make a donation, please send a cheque made payable to National Maritime Museum Cornwall with your full name, address and postcode on the reverse to the address below. Sponsorship of galleries or exhibitions is a wonderful way of becoming closely involved with the Museum and its work. We are always happy to talk to you about ways in which we can help you to achieve your business or marketing objectives through sponsorship. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
