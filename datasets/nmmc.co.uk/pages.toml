["https://nmmc.co.uk/learn/plan-your-visit"]
title = "Plan your school visit | National Maritime Museum Cornwall"
description = "Our award-winning learning programme is the largest and most varied of its kind in Cornwall."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Our award winning learning programme is the largest and most varied of its kind in Cornwall. We offer your school group an unforgettable experience in the Museum’s inspirational spaces. The Museum is open to the public and education groups between 10am and 5pm, seven days a week every day throughout the year except Christmas Day and Boxing Day. School visits are typically between 10am and 2pm, but our Learning Manager is happy to help you timetable your visit depending on your arrival and departure times. We offer a range of curriculum workshops and hands-on learning activities for formal and informal education groups. Each programme can be carefully tailored to the needs of your group. We may also be able to mix and match activities to your topic or programme of study. Teachers and group leaders are welcome and encouraged to carry out a free planning visit to see how we can meet the aims of your visit and assess the site. Our Learning Manager can arrange a personal planning meeting whenever convenient. The Museum is passionate about the life-long value of engaging young people with the Museum’s unique cultural resources, and aims to keep its charges to educational groups as low and flexible as possible. Example costs per pupil/student for education groups are outlined below. Please note all adults in a supervisory role are free of charge for pre-booked groups. You may pay on arrival by credit card or by cheque (made payable to National Maritime Museum Cornwall). We are happy to invoice schools and other groups after their visit. All charges are based on numbers actually attending (e.g. if only 45 students attend out of an original booking of 50, we will only charge for the 45 students). The Museum aims to be as accommodating as possible with education group bookings. However, because of the high level of demand, we reserve the right to charge a cancellation fee for groups with fewer than half their booked numbers or who cancel within 21 days of the visit date."
year_published = 2016
year_updated = 2024
clearnet = "https://nmmc.co.uk/learn/plan-your-visit"
