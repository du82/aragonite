["https://nmmc.co.uk/privacy-statement"]
title = "Privacy statement | National Maritime Museum Cornwall"
description = "This privacy statement provides you with details of how the National Maritime Museum Cornwall will collect, store and use the personal data you supply."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free At National Maritime Museum Cornwall (NMMC) we recognise the importance of protecting your personal information and are committed to processing it responsibly and in compliance with the General Data Protection Regulation 2018. When processing your personal data, we will only do so in relation to specific purposes and only after giving careful consideration to ensure that your privacy rights are not seriously impacted. We will process the personal data that you provide to us in the following ways for the purpose of (and on the basis of) our performance of our contractual obligations to you: We will process the personal data that you provide to us in the following ways in order to comply with our legal obligations: We will also process your personal data where you have given your consent for us to do so, for example: Where we are relying on consent to process your personal data, we will only process your personal data for the purpose that you have given us consent for. Except where we use third party services to collect information, when you are asked for personal data by us, you are sharing that information with us alone, unless we specifically state otherwise below. We may also provide your personal data to third parties who may process your data as part of the services they carry out on our behalf. In order to provide you with the services that you have requested from us, the following third parties may also need to process your personal data: We do not sell or rent your personal data to anyone. We will never provide your personal data to another company or charity for their marketing purposes, without your explicit consent. We will always do our best to keep your personal data secure. Steps we take in order to do this include the use of technical controls (such as encryption and network protection), limiting the number of people working for us who have access to your data and ensuring that they are trained in protecting your personal data."
