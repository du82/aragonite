["https://nmmc.co.uk/2025/02/whats-been-happening-roof-repair-project-2025"]
title = "What’s been happening – Roof Repair Project 2025 | NMMC"
description = "See what's been happening at the Museum while we were temporarily closed to undertake essential repairs and maintenance in January 2025."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free From Monday 6 January 2025 until Saturday 15 February 2025, National Maritime Museum Cornwall was temporarily closed for some essential repairs to the building’s roof. We were awarded an Arts Council Museum Estate and Development grant to undertake a comprehensive approach to repair some significant leaks. The Museum’s roof has leaked for a long time, it has sometimes meant we’ve had more buckets catching drips than boats on display. We knew that the work would be very disruptive, so we took the difficult decision to fully close the Museum for the duration of the main works. During the six-week closure the Museum has replaced its entire roofing system, increased drainage and improved weatherproofing and insulation. Alongside these major structural repairs, the Museum has also carried out a number of other works to replace and repair high-level windows, upgrade gallery spaces and improve access. When the Museum reopens on Saturday 15 February, some external works will continue. The Museum team expect these to be completed by the end of March 2025. We’d like to extend our thanks to all our visitors for bearing with us whilst we completed these important upgrades. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
