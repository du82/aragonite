["https://nmmc.co.uk/whats-on/beyond-the-break-lucia-griggis-journey-as-a-global-surf-photographer-lecture"]
title = "Beyond the Break: Lucia Griggi’s Journey as a Global Surf Photographer – Lecture | National Maritime Museum Cornwall"
description = "Lucia Griggi shares her incredible journey to becoming one of the world’s most renowned female surf photographers."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Join Lucia as she shares her incredible journey from the rugged shores of Cornwall to becoming one of the world’s most renowned female surf photographers. Discover the challenges she faced, the moments that defined her career, and the passion that fueled her rise to global recognition. Through captivating stories and stunning visuals, Lucia offers a behind-the-scenes look at working with the WSL and top surf magazines, inspiring audiences to chase their dreams no matter the odds. Lucia Griggi is an award-winning photographer and film director known for capturing the untamed beauty of nature and the pulse of adventure around the world. With a lens focused on surfing’s raw power and the serene yet formidable Arctic wilderness, Lucia has carved out a unique space in photography, blending art with exploration. Her work often evokes a sense of connection to the ocean, an ode to her deep-rooted passion for the sea and the spirit of travel. Born with a natural curiosity for uncharted territories, Lucia’s journeys have taken her from the cresting waves of remote island coasts to the icy expanse of polar landscapes. She has the rare ability to frame fleeting moments of motion and stillness, turning them into stories that resonate with those who share her reverence for the wild. Lucia’s photos are not just images—they’re invitations. They call viewers to appreciate the world’s raw edges and to seek adventure in the places where nature reveals both its ferocity and grace. Her work has graced the pages of prominent publications and inspired campaigns for brands that share her commitment to authenticity and adventure. Beyond the Break: Lucia’s Journey as a Global Surf Photographer is part of National Maritime Museum Cornwall’s 2025 lecture series. Other lectures in this series include: A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
