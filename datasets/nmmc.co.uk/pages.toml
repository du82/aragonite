["https://nmmc.co.uk/visit"]
title = "Plan your visit | National Maritime Museum Cornwall"
description = "The Museum is usually open every day of the year from 10am – 5pm, except Christmas Eve, Christmas Day and Boxing Day."
full_description = "The Museum is usually open every day of the year from 10am – 5pm, except Christmas Eve, Christmas Day and Boxing Day. Groups of 10 or more receive discounted entry fee. We offer tailor made packages and specialised tours. With spectacular views over Falmouth's magnificent harbour, the Waterside Cafe is a popular port of call for visitors. Support the Museum by becoming an Annual Member. Your donation will help us to preserve Cornwall's maritime heritage for future generations. Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Plan your visit to National Maritime Museum Cornwall, from buying tickets to getting here and making the most of what’s on. The Museum is open Monday – Sunday, 10am – 5pm. We are closed on Christmas Eve, Christmas Day and Boxing Day. We offer free admission to under 5s, a child’s price, free admission to Carers and discounts for NHS workers and Blue Light Card holders. The admission ticket to the Museum is also an annual pass that allows you unlimited entry for a whole year. Many people only visit us once in a year but, through Gift Aid, offering annual passes in this way allows us to treat your ticket fee as a donation and therefore increases funding for our charitable work. If you are a UK taxpayer and have purchased admission or chosen to make a donation to us, we may be able to claim 25p for each £1 of your donation, which will be additional funding for our charitable work. Gift Aid is reclaimed by the charity from the tax you pay for the current tax year. Your address is needed to identify you as a current UK taxpayer and there’s no extra cost to you. For groups of 10+ we offer a 10% discount with free entry and Waterside Café vouchers for a tour guide and driver. Find out more about groups at National Maritime Museum Cornwall. We do not allow dogs into the Museum unless they are trained assistance dogs. Dogs are welcome in the Gift Shop. We aim to make our exhibitions as family friendly as possible. There is lots for families to enjoy together and children to explore. Don’t miss our top picks:"
