["https://nmmc.co.uk/collection/troze"]
title = "Troze | National Maritime Museum Cornwall"
description = "TROZE is an online refereed journal covering a range of topics, many to do with Cornish and West Country maritime history."
full_description = "The Dunkin brothers were everyone’s idea of Cornish rogues in the late C18, being involved as privateers, smugglers and mine owners. Their story is the stuff of romantic fiction. The growth in piracy and its effect on the SW fisheries industry coincided with the rise and fall of Charles I, contributing to his unpopularity. The nineteenth century owners of gardens around Falmouth were well-placed to benefit from that port’s connections with the outside world. The result was a demonstration of wealth and power century through horticulture. A study of a house in Falmouth and the career of the man who built it: ‘Honest’ Jack Parsons, commander of HMS Crane, one of the last Packet Ships to sail from Falmouth. In October 1767, William Pearse, a man of over 80 was hanged outside Launceston, the first victim of the newly-strengthened 1753 Wreck Act. Pearse’s experience tells us much about the activity of wrecking, wrecking laws and the legal process, and what wreckers might have faced if they were caught. The repair of an aged chair. The chance discovery of some letters from 1847. A hidden love-story revealed. Insights into the life of a 19th century trading-ship captain."
year_published = 2024
clearnet = "https://nmmc.co.uk/collection/troze"
