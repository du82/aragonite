["https://nmmc.co.uk/about-the-national-maritime-museum-cornwall"]
title = "About us | National Maritime Museum Cornwall"
description = "National Maritime Museum Cornwall is a place to enrich your understanding of the sea and Cornwall. Learn more about what we do and what we have to offer."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Through our exhibitions programme, we aspire to bring new and diverse perspectives to maritime issues and highlight their relevance to the present day. We also bring rare objects from around the world to Cornwall to tell local, national, and international stories. Your admission fee is reinvested back into the museum to enhance and grow our work, which also includes our family learning activities, our award-winning education programmes, our boat building and conservation projects, and our work to preserve and promote Cornwall’s maritime heritage. Read more about how you support the Museum here. The Museum opened in 2003 and is located on the aptly named Discovery Quay in Falmouth, South Cornwall. The Museum sits beside a thriving harbour that’s the third deepest natural harbour in the world. Falmouth is Britain’s traditional gateway to the Atlantic and one of Europe’s finest sailing waters. There’s plenty to see and do here, from bathing on golden beaches to exploring a patchwork of shops and eateries. The beautiful Fal River runs through an Area of Outstanding Natural Beauty, with the town being renowned for its creative buzz that features art galleries and an eclectic mix of venues hosting contemporary works, independent films, and live performances. Falmouth’s maritime legacy and coastal culture is a huge part of its charm, boasting world class water sports on its sheltered shoreline. You’ll find gig rowing, kayaking, diving, and regular sailing events such as Falmouth Regatta and the Pendennis Cup. The Museum has 15 galleries situated over 5 floors. Exhibits explore the overwhelming influence of the sea on local, national, and global history and culture. Read more about our galleries and facilities here. Our award-winning learning programme is the largest and most varied of its kind in Cornwall. We offer school groups an unforgettable experience in the Museum’s inspiring spaces. Find out more about our programmes and workshops here."
year_published = 2017
year_updated = 2025
