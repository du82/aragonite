["https://nmmc.co.uk/2018/03/video-introducing-our-major-exhibition-titanic-stories"]
title = "Video: Introducing Titanic Stories | National Maritime Museum Cornwall"
description = "Our new exhibition Titanic Stories re-appraises the myths, controversies and assumptions about one of the most well-known events of the 20th century."
