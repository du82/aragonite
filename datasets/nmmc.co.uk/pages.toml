["https://nmmc.co.uk/about/trustees"]
title = "Trustees | National Maritime Museum Cornwall"
description = "Our Trustees act as guardians and we seek to represent a broad range of different backgrounds, areas of expertise and perspectives on the Board."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Our Trustees serve in a voluntary capacity. They act as guardians and we seek to represent a broad range of different backgrounds, areas of expertise and perspectives on the Board. Trustees are frequently leaders in their fields. They include experts in maritime history, and leaders in business. Alexandra is the daughter of Rear Admiral Sir Morgan Morgan Giles, and granddaughter of the Teignmouth based yacht designer Francis Morgan Giles. By profession an interior designer, she has run her own business and been responsible for the renovation and care of many properties, both historic and contemporary. She is involved in numerous Cornish charities, including the Cornwall Historic Churches Trust, the Royal Cornwall Agricultural Association, and is Patron of Marie Curie Cornwall. Alexandra has a large extended family, both in the UK and Australia. She is married to Colonel Sir Edward Bolitho (Lord Lieutenant of Cornwall), lives near Penzance and has three grown up children and three grandchildren. Simon started his career at Samuel Montagu & Co Ltd, merchant bankers, and after seven years moved to Jardine Matheson & Co Ltd where he worked in Singapore, Hong Kong and Kuala Lumpur. In 1985 he joined the shipping company, Bibby Line Group Ltd, in Liverpool as Managing Director becoming non-executive Chairman in 2000. He has also been Chairman of the Port of London Authority, Deputy Chairman of Lloyds Register and Chairman of A & P Group. He is an Elder Brother of Trinity House, and the Vice President of the RNLI. In 2010 he was Prime Warden of The Worshipful Company of Shipwrights and is a Freeman of the Company of Watermen and Lightermen. Rob is the Director of Finance, Audit and Risk (responsible for Finance, Legal and Compliance Services) at Falmouth University, having been the Director of Finance from 2016 and Deputy Director since 1998. During his time at Falmouth, he has been involved with finances across the institution from the early days of European funding and the acquisition of the Penryn campus, the establishment of the joint venture, Falmouth Exeter Plus, and the merger with Dartington College of Arts."
year_published = 2016
year_updated = 2025
