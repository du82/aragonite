["https://nmmc.co.uk/2024/11/falmouths-festive-free-weekend-2024"]
title = "Falmouth's Festive Free Weekend 2024 | NMMC"
description = "On Saturday 7 and Sunday 8 December 2024 entry to the National Maritime Museum Cornwall is FRE for Falmouth's Festive Weekend."
full_description = "On Saturday 7 and Sunday 8 December, National Maritime Museum Cornwall is FREE to all visitors to celebrate Falmouth’s Festive Weekend.Immerse yourself in the best of what makes our beautiful part of the world sparkle at this magical time of year and help Charlie Chough uncover Cornwall’s festive traditions in our Museum trail. Feast your eyes on our beautiful willow lobster pot Christmas tree, take part in Christmas crafts and make your very own festive Falmouth scene to take home – as well as enjoying all the usual museum favourites.Falmouth’s Festive Weekend in 2024 sees more family fun, live music performance and snowy streets throughout the town.Make & Take12.30pm – 3.30pm (last entry 3.15pm)Have a go at making your own Festive Falmouth Scene to take home.Christmas Cheer in the Waterside Café10.30am – 4.30pmThe Waterside Café will be serving up festive treats with a spectacular view over Falmouth harbour.Gift Shop10am – 5pmOur Gift Shop is the perfect pitstop for Christmas gifts, with Cornwall-inspired keepsakes, maritime treasures and a special selection of Sale goodies.See Pirates before it closesPirates exhibition, currently held in The Hold.Our latest blockbuster exhibition, Pirates, closes on Sunday 5 January – see it before it goes.Museum FavouritesThere’s so much to see at National Maritime Museum Cornwall. Make the most of your visit and explore: • Explore The Tidal Zone with views under the sea • Head up to The Lookout Tower for breathtaking panoramic views of Falmouth • Cornwall and Falmouth’s maritime heritage in the Cornwall Galleries • Enjoy the Flying Flotilla in the Boat Hall • Climb aboard the RNLI Rescue Zone • Discover the Boat Pool where you can challenge yourself to sailing races • The Waterside Café where you can drink in the incredible views • The Gift Shop – perfect for last minute Christmas gifts!See what else is on this December as we celebrate A Cornish Christmas 2024.If you’d like to come back and visit us soon, annual passes can be bought on the day at the usual admissions price."
