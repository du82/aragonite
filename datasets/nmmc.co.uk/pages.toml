["https://nmmc.co.uk/learn/eyfskey_stage_1"]
title = "Schools: EYFS / Key Stage 1 | National Maritime Museum Cornwall"
description = "Award winning Early Years + Key Stage 1 programme offers fun and inspiring learning experiences encouraging exploration, imagination and collaboration."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Our award winning Early Years and Key Stage 1 programme offers fun and inspiring learning experiences helping children develop an understanding of the world around them and encouraging exploration, imagination and collaboration. EYFS and Year 1: Cross Curricular Meet Oceana a mischievious Cornish sea sprite who lives to collect things and bring them to the museum. Can you find the magical rhyme to wake her up to play? Learn about tides, handle real artefacts from the seabed, take part in an under the sea sound story and make your own boat to sail on our boat pool. ‘Very engaging – the pre-visit materials really enhanced the visit. The children were so excited and lots of topic learning will easily follow in class. When walking around the Museum, one child said, “Thank you for choosing this trip, it’s the best trip ever!”’ – Class Teacher, Illogan School (Under the Sea) Themes: The Sea | Tides | Myths and Legends | Music and Sound | Storytelling | Plastic Pollution | Recycling Duration: 2 x 45-minute activities, plus time to explore the museum (flexible) Cost: £5.95 per pupil, adults free Group Size: Typically up to 2 classes Curricular Links: Click here for the ELGs and Curricular Links KS1 History: Significant historical events, people and places in the locality. KS1 English: Speaking and listening. Explore the truth about the golden age of piracy. Find out what pirate treasure really looked like and where in the world it came from using our giant floor map. Get hands-on in our object handling activity and investigate what weapons pirates used in battle. Discover the difference between a galleon and a deadly sloop and make your very own pirate ship to sail across our boat pool! ‘Great, varied exhibits; brilliant organisation and facilities provided by the Museum. They are very effective at engaging students – particularly good to give children who have not visited Museums before a positive experience.’ – Class Teacher, Kilkhampton Junior & Infant School (Pirates: Fact & Fiction)"
year_published = 2016
year_updated = 2024
clearnet = "https://nmmc.co.uk/learn/eyfskey_stage_1"
