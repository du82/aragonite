["https://nmmc.co.uk/whats-on/curating-100-years-of-waveriding-in-cornwall-lecture"]
title = "Curating 100 Years of Waveriding in Cornwall – Lecture | National Maritime Museum Cornwall"
description = "Join Dr. Sam Bleakley as he speaks about the journey curating SURF! and gathering over 100 Cornish surfboards spanning 100 years of waveriding history."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Dr Sam Bleakley is a former professional surfer and European surf champion, now specialising in surf event broadcast commentary and researching and curating innovative work on surfing through writing, films and education. In this lecture, Sam takes us behind the scenes on his journey curating SURF! gathering over 100 Cornish surfboards spanning 100 years of waveriding history. Ambitious to share the hidden histories of pioneer women in Cornish surfing, para surfing and blue health, Sam connects with the Cornish surf community gathering surfboard art, shaping tools, original magazines, world title trophies, vintage wetsuits and clothing from private collections. Dr Sam Bleakley is a former professional surfer and European surf champion, now specialising in surf event broadcast commentary and researching and curating innovative work on surfing through writing, films and education. Alongside a number of other titles, Sam is author of the best-selling book Mindfulness and Surfing: reflections for saltwater souls and the editor of The Surfing Tribe: a history of surfing in Britain. Sam is also an associate lecturer in sustainable tourism at Falmouth University. Born and raised close to Land’s End, Sam is deeply connected to (and inspired by) the rich tradition of surfing in Cornwall. Sam studied a BA and MA in Geography at Pembroke College, the University of Cambridge, and researched a PhD at Falmouth University (and the University of the Arts London) on travel writing and surf exploration in Haiti. Sam also produces and presents an adventure activist series called Brilliant Corners documenting emerging surf communities, responsible tourism, action sports, and the power of surfing for social good around the world. Curating 100 years of Waveriding in Cornwall is part of National Maritime Museum Cornwall’s 2025 lecture series. Other lectures in this series include:"
