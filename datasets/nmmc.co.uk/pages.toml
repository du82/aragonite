["https://nmmc.co.uk/explore/bartlett-library-2"]
title = "The Bartlett Maritime Research Centre + Library | NMMC"
description = "The Museum's research work is led by the Bartlett Maritime Research Centre which incorporates the Bartlett Library."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free The museum’s research work is led by the Bartlett Maritime Research Centre which incorporates the Bartlett Library and the Peter and Julie Newall Library, a wonderful resource of books, archives and records on maritime matters. It houses a team of volunteers who answer enquiries for members of the public and who work on a range of research projects. Private researchers are very welcome to explore the library or to seek answers to specific questions with the help of one of our volunteers. A range of finding aids for researchers are constantly being developed and updated. With around 40 databases, these cover subjects such as: The Bartlett holds some 18,000 volumes on our open shelves, having grown by gift and purchase, from the core collection of 6,000 volumes, generously donated by our benefactor J. V. Bartlett Esq., in 2003. Significant loans from the Cornwall Library Service (including a number of Lloyd’s Registers), together with gifts from many individuals have greatly increased the size and value of the collection since our establishment in 2003, supplemented by the Peter and Julie Newall Library in 2018. Maritime Reference Section Covering everything from supertankers to sailing dinghies, it includes an extensive run of Lloyd’s Registers from 1764, to near current editions; a good run of Mercantile Navy Lists, 1850s to 1960s; Lloyd’s Lists, the British maritime newspaper (facsimile editions, or microfilm copies), 1741 to 1859. Our books cover such diverse subjects as Shipping Companies, British and foreign; Yacht cruising; Fishing and Fisheries; a selection of Naval material; Maritime Art and Artists; Navigation; Exploration; etc. Archives, Periodicals, Magazines and Journals A comprehensive range of Falmouth harbour archives, has been deposited with the Bartlett, by the Falmouth Harbour Commissioners – including Harbour Commissioners, and Harbour Committee minute books; Dredging ledgers; Harbour Masters Journals, 1870s to 1970s. These are held in the Haddon Room. These archives are supplemented by an extensive range of Falmouth Harbour pilotage material, and G. C. Fox & Co.’s Falmouth Arrivals ledgers."
year_published = 2016
year_updated = 2024
