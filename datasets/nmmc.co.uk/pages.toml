["https://nmmc.co.uk/nsbr"]
title = "National Small Boat Register"
full_description = "This is a database of notable historic small craft (33ft LOA and below). It includes details of the designer, builder, dimensions, construction, propulsion, service history, current location and ownership and images of the vessels. If the vessel is over 33ft in length there is a separate well-established database – the National Register of Historic Vessels or NRHV – which is managed by National Historic Ships UK. The NSBR database recognises the importance of small boats. It enables us to determine what is out there, as boats under 33ft have historically been neglected in other surveys and registers. Registration is automatic upon completion of the online form, and registrations are not assessed in terms of historical or technical importance. Registration does not confer any status or merit for valuations for insurance policies, applications to the Charity Commission, or to apply for restoration funding."
