["https://nmmc.co.uk/2025/02/creative-projects-reducing-museum-waste"]
title = "Creative projects reducing Museum waste | NMMC"
description = "Find out how we've been finding innovative ways to reuse and repurpose materials from our exhibitions and construction projects."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free We’re committed to reducing waste across all museum operations, finding innovative ways to reuse and repurpose materials from exhibitions and construction projects, whenever possible. Following our recent Pirates exhibition, we partnered with St Austell-based Parc Signs for the deinstallation of the displays. One creative outcome was connecting with Bodmin Community College student Joshua Ellicott, who transformed the Pirates exhibition canvas banners into a custom jacket for an innovative college project. Joshua, who was nominated for the DofE Innovator of the Year Award, discovered his passion for textiles during his GCSEs. He shared his experience working with our materials: “I made my first garment in May last year, having no real experience up to that point apart from taking textiles GCSE. I put a great deal of thought into my garments to make them all as functional as possible.” Josh created the jacket as a statement piece demonstrating recycled materials’ potential: “Using these valuable materials makes you more aware of the sheer amount of waste created when making a garment.” During our recent major repair and renovation project, we’ve extended our sustainability efforts to include the reuse of the construction materials that were no longer fit for purpose on our Museum roof, working with our external contractors we repurposed the old insulation materials and the old windows that were being removed and replaced to local construction projects. Environmental sustainability is one of our core strategic objectives. We’re working with dedicated sustainable travel and tourism consultants to take steps towards practices that reduce our environmental impact across all operations. By reusing materials from both exhibition spaces and building maintenance, we’re working towards our commitment to responsible resource management throughout our organisation."
author = "Rosie Leo"
