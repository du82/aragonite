title = "Volunteering | National Maritime Museum Cornwall"
description = "Our volunteers are highly valued members of the Museum team. Find out more about what we can offer you, and what to do if you want to get involved."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Our crew of volunteers are highly valued members of the Museum team. We are extremely grateful for their continued support; they contribute so much to the Museum in a variety of ways. We’re always keen to encourage others to join us, and we welcome enquiries from everyone. You don’t need experience to volunteer for us, as full training and support will be provided. We are just looking for enthusiastic people to help us exceed our visitor’s expectations by providing an enjoyable day out. Our volunteers enjoy many benefits. Eligibility for some of these benefits depends on how many hours you volunteer. They include: We’re delighted you’re interested in volunteering with us. Please complete the form below and we’ll be in touch soon. Once you have returned your form, Emily will contact you to arrange an informal interview at the Museum. We aim to ensure our volunteers have a rewarding and fulfilling experience. This informal interview will help you, and us, decide whether the Museum is really where you want to volunteer. The Museum provides full induction welcome training for all volunteer roles, which helps you become familiar with the Museum. You will also receive specific department training in order for you to be confident in your role. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
