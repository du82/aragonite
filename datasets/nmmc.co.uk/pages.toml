["https://nmmc.co.uk/2023/01/pirates"]
title = "Pirates | National Maritime Museum Cornwall"
description = "Running until Sunday 5 January - Were pirates of the 18th century heroes of the age or no more than callous cutthroats?"
full_description = 'Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free {"@context":"http:\/\/schema.org\/","@id":"https:\/\/nmmc.co.uk\/2023\/01\/pirates\/#arve-youtube-bg89hwvkqxa","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/BG89HWvkQxA?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} Pirates has now closed at National Maritime Museum Cornwall. We’ll be welcoming our next major exhibition to The Hold in March 2025, find out more here. Dashing, daring and adventurous or bloodthirsty, immoral and greedy – were pirates of the 18th century heroes of the age or no more than callous cut-throats? For generations, pirates have been portrayed in film, fiction and fashion as symbols of freedom and adventure. But how and why has this image been created? To find out, immerse yourself in the digital world of the Sea of Thieves game, land on Treasure Island, meet the man behind Long John Silver and dance a hornpipe with Horatio Pugwash before discovering the dark world of the real pirates of the Caribbean. In this latest major exhibition, explore how popular culture has shaped how we think of pirates today and dive beneath the surface to unearth the harsh and terrifying truth. {"@context":"http:\/\/schema.org\/","@id":"https:\/\/nmmc.co.uk\/2023\/01\/pirates\/#arve-youtube-m3geldooth8","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/M3gelDoOTh8?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884'
