["https://nmmc.co.uk/titanic-stories"]
title = "Titanic Stories | NMMC"
description = "Opening in Falmouth on 8 March 2018, this former exhibition offered new insights and included artefacts never seen in the UK before."
full_description = 'Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Our major exhibition TITANIC STORIES examines the stories of the Titanic’s momentous sinking on 15 April 1912, re-appraising many of the myths, controversies and assumptions that still linger around one of the most well-known historic events of the 20th century. Working in collaboration with private collectors from overseas and national museums in the UK, TITANIC STORIES presents rare and never-seen-before objects, as well as retelling the personal stories of many of the survivors, victims and descendants of the Titanic disaster, including those from Cornwall. {"@context":"http:\/\/schema.org\/","@id":"https:\/\/nmmc.co.uk\/titanic-stories\/#arve-youtube-uabfmmw5z5i","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/uABfmmw5Z5I?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} Focusing on the remarkably rapid commercialisation of the disaster, the exhibition also offers an in-depth exploration of the tragic event’s quick rise in status to one of the most globally talked about and commodified events in history, from how the news initially broke and was reported by international media (a subject of early ‘fake news’ stories), to the first souvenir postcards produced days after the sinking, the books written and film adaptations made within weeks, and the commemorative music and memorials, as well as more contemporary ephemera and artefacts following the wreck’s discovery in September 1985. Alongside documentary and personal photographs, letters, newspaper cuttings, compelling items such as a First-Class passenger list found in the pocket of a victim, are on display. International cinema adaptations of the Titanic story are explored, from a Nazi propaganda film, to the award-winning A Night to Remember, each represented in the exhibition by their original film posters, production stills and more. Iconic items from James Cameron’s 1997 blockbuster will also feature, including one of Kate Winslet’s celebrated costumes and other props and pieces from the epic production.'
year_published = 2017
year_updated = 2024
