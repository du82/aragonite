["https://nmmc.co.uk/learn/key-stage-2"]
title = "Key Stage 2 | National Maritime Museum Cornwall"
description = "Our award-winning Key Stage 2 programme delivers interactive and engaging curriculum workshops led by our creative and experienced team."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Our award winning Key Stage 2 programme delivers interactive and engaging curriculum workshops led by our creative and experienced team. Activities on offer include object handling, storytelling and role-play challenges covering a range of topics. KS2 History: Vikings Find out why the Vikings took to the sea, where they went and what they did when they got there. Pupils take part in a Viking traders challenge before learning how the Vikings used wind energy to move their boats across the water (includes a demonstration on our Boat Pool). Optional extra: Take part in our Viking coin striking activity and make your very own replica Viking coin to take back to school! ‘The staff were knowledgeable and engaging. The day had been well thought out, well planned and well resourced. It was lovely that the kids were able to be so hands on in a museum.’ – Class Teacher, St Merryn School (Vikings: Sailors, Raiders and Traders) Duration: 90-minute activity (Viking Trading Challenge / wind-on-sail demonstration and sailboat activity) and an opportunity to explore the museum (flexible). Cost: £5.95 per pupil, adults free // Coin Striking Activity: +50p per pupil Group Size: Typically up to 2 classes KS2 History: A significant turning point in British history; the changing power of monarchs. Come face to face with Elizabeth I in our portrait investigation and get hands on with a giant map of the world to discover the causes and impact of exploration in Tudor times. Follow Francis Drake as he voyages around the world and take part in a raiding challenge with replica artefacts. Take a close look at our model of Drake’s ship Golden Hind and learn about wind-on-sail by using our remote-controlled yachts on our big boat pool. ‘From my most academic to our special needs pupils, all of the children gained from their experience. They didn’t stop talking about it on the bus and enthusiastically took part in a Q&A session when we got back to school.’ – Class Teacher, Trewirgie Junior School (Tudor Explorers)"
