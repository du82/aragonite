full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free National Maritime Museum Cornwall (NMMC) acknowledges its duty of care to safeguard and promote the welfare of children and adults at risk (vulnerable adults) and is committed to ensuring its safeguarding practices reflects statutory responsibilities, government guidance and best practice. NMMC’s Safeguarding Policy recognises the welfare and interests of children, young people and adults at risk are paramount in all circumstances. It aims to ensure that, regardless of age, gender, religion or beliefs, ethnicity, disability, sexual orientation, transgender status or socioeconomic background, all children, young people, and adults at risk: Experience a safe, positive, and enjoyable visit to the Museum and remain safe from harm during participation in our planned activities, events, and learning opportunities (including online). It is, sadly, common knowledge that some children, young people, and adults at risk may have experienced historic abuse, or are currently victims of neglect, abuse, bullying or exploitation. NMMC accepts its responsibilities to take reasonable and appropriate steps to ensure the welfare and safety of everyone during their visit to the museum. The policy and procedures are promoted internally by the Designated Safeguarding Lead (Human Resources Manager) and where appropriate, also shared with external partners. The policies and procedures for safeguarding are reviewed every two years, but more regularly under the following circumstances: A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
