full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Despite its title, it is not included in the Government’s list of national museums and does not receive any Government revenue funding or grants. It is therefore required to charge an entrance fee where other national museums are free of charge. The long-term survival of the museum is dependent on the number of visitors we have per year and the money we can raise from external sources. We rely on your support and there are many ways in which you can support us. Find out more in the support us section of our website. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
