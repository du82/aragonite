["https://nmmc.co.uk/whats-on/event/captain-bligh-myth-man-mutiny"]
title = "Captain Bligh: Myth, Man and Mutiny | NMMC"
description = "Step into the sights and sounds of one the greatest survival feats in British history in our new major exhibition at National Maritime Museum Cornwall."
full_description = 'Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free This exhibition tells the story of Captain Bligh, challenging the Hollywood depiction of the famous mutiny on HMS Bounty. In April 1789 Bligh and his loyal men were cast adrift mid-ocean in the Bounty’s 23 foot launch in the expectation they would die. In a remarkable feat of seamanship, Bligh sailed the heavily overloaded launch to safety across 3600 nautical miles of open sea from Tonga to Timor, in the East Indies. Our exhibition brings to life this survival story, featuring relics from the voyage and a specially built reproduction of the Bounty launch. {"@context":"http:\/\/schema.org\/","@id":"https:\/\/nmmc.co.uk\/captain-bligh-myth-man-mutiny\/#arve-youtube-w0cbxwp5vyk","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/w0cBXWp5VYk?feature=oembed&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} Image: The reproduction of the Bounty launch, a highlight of the Captain Bligh, Myth, Man and Mutiny exhibition. Photo by Paul Abbitt. 230 years ago, British navy ship HMS Bounty was sailing from Tahiti to the West Indies. During its 17 month voyage, in the middle of the South Pacific the famous mutiny broke out, led by Bligh’s acting lieutenant, Fletcher Christian. Bligh and his loyal men were cast adrift, mid-ocean in the Bounty’s 23-foot launch in the expectation they would die. Image: Captain Bligh, Myth, Man + Mutiny features a faithful reproduction of the Bounty launch, original relics from the voyage, a fine model of the Bounty has also come from The National Maritime Museum Greenwich and one of William Hodges’s magnificent paintings of Tahiti, from Cook’s second voyage. Photo by Luke Hayes. Cast adrift in the South Pacific, Bligh and his men seemed to face certain death. 19 men packed into the launch, which was only 23ft long and little more than 6ft wide. Supplies were only enough to last that many people, on normal rations, for five days. The journey would take over 48 days.'
year_published = 2017
year_updated = 2023
