title = "Intelligent Activism and Surfing as a Catalyst – Lecture | National Maritime Museum Cornwall"
description = "Join Chris Hines, Co-Founder and former Director of Surfers Against Sewage, exploring the origins of the marine conservation charity."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Join Chris Hines, Co-Founder and former Director of Surfers Against Sewage, as he explores the origins and campaigning of the marine conservation charity from 1990 through to 2000. From the beaches to the corridors of power, Chris will reveal how SAS helped deliver a £5.5 billion clean up, reflect on where surfing sits 35 years on and present the dilemmas that we all face in relation to the planet and the population. “We can and should all be activists in our professional and personal lives, it’s payback for the joy we get from surfing and the oceans.” – Chris Hines Chris has been working and campaigning for the environment for over 30 years and revels in inspiring positive change. Co-founder and then Director of Surfers Against Sewage from 1990 till 2000. Regarded as “some of the Government’s most sophisticated environmental critics” by the BBC and “Britain’s coolest pressure group” by the Independent, Chris was then Sustainability Director at the Eden Project for 5 years. He was awarded an MBE for “services to the environment” and an Honorary Doctorate of Science from the University of Plymouth. He now aims to deliver positive change by working with clients with a shared vision, including sitting on the BBC’s Sustainability Advisory Group and has recently given presentations to a wide range of organisations from Accenture to Comic Relief and Pfizer to the RSPCA.…and he still gets plenty of surfing in! Intelligent Activism and Surfing as a Catalyst is part of National Maritime Museum Cornwall’s 2025 lecture series. Other lectures in this series include: A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
