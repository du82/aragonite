["https://nmmc.co.uk/visit/accessibility"]
title = "Access | National Maritime Museum Cornwall"
description = "The Museum aims to provide a great experience for all ages, abilities and backgrounds."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Built in 2002, this modern building has been designed with access in mind. There are five levels in the Museum, all of which are accessible by lift or ramp. You should allow at least 1.5 – 3 hours for your visit. Accessible toilets are located on the first and second floors and there are larger facilities available if required. An ADi Room Mate is installed in the accessible toilet near to the Waterside Cafe – ADi is an audio device for blind and visually impaired visitors. Currently National Maritime Museum Cornwall does not have a Changing Places. We understand the importance of facilities such as these being available, and whilst we seek the necessary funding to build a Changing Places, we instead hire the services of Mobiloo occasionally. Find out more about Mobiloo at NMMC. The nearest Changing Places is located a short distance from the Museum at the Grove Place Public Toilets. The British Sign Language (BSL) tablet tour is designed to help deaf BSL users gain a better understanding of the unique story of the museum and get more from their visit. The tablet is available from the admissions desk. There are various hearing loops throughout the building. These can be identified by the hearing loop symbol. The sensory bags and ear defenders are available to anyone who may need them throughout the year and can be found at the Admissions Desk. On certain days throughout the year the Museum offers Relaxed Sessions where noise is reduced, quiet spaces are allocated and sensory bags and ear defenders are available. The nearest public car park is 100 metres away, across the square (a level, but cobbled surface). The car park has a number of designated accessible parking spaces. Carers who are required to assist disabled visitors are admitted free of charge with the person they are assisting. Proof may be asked for. The Museum is part of the Safe Places National Network, offering help to people who feel worried, anxious or who are at risk when out and about in Falmouth."
year_published = 2016
year_updated = 2024
