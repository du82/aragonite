["https://nmmc.co.uk/2024/10/roof-repair-project-2025"]
title = "Roof Repair Project 2025 | NMMC"
description = "From Mon 6 Jan 2025, reopening Saturday 15 February, National Maritime Museum Cornwall will temporarily close to undertake some repairs to the building’s roof."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free From Monday 6 January 2025, reopening Saturday 15 February 2025, National Maritime Museum Cornwall will temporarily close to undertake some essential repairs to the building’s roof. The Museum’s roof has leaked for a long time, and with buckets placed across the building to catch the drips, it has often meant we’ve had more buckets than boats on display. Previous attempts have been made to repair the roof, and despite everyone’s best efforts, the proposed solutions were sadly unsuccessful. It’s now time to banish the buckets! National Maritime Museum Cornwall is an iconic building, sitting proudly on the edge of Falmouth’s harbour. The architecturally award-winning design is complex and was revolutionary for its time. Securing the Museum’s future is paramount to ensuring generations to come can continue to discover and enjoy Cornwall’s rich and globally significant maritime legacy. As custodians of the building, and the collections within it, we’re thrilled to have been awarded an Arts Council Museum Estate and Development grant to undertake a more radical and comprehensive approach to repair the leaks – one we believe will finally resolve the challenges we have. The work will involve removing the existing membrane and installing a new roofing system, crucially improving drainage and weatherproofing. The work will be highly disruptive, so we have taken the difficult decision to fully close the Museum for the duration of the main works. This then provides us with the opportunity to undertake some other vital work at the same time including: As a museum dedicated to sharing our collections with people, closing our doors for six weeks isn’t something we relish. We know our local community, in particular, use us as a hub for learning, research, exploration and fun, so it is our intention to make the closure as short as possible. We will reopen in time for February half term and our Science of the Sea activities on Saturday 15 February. For those who have been to Science of the Sea before, you know what we mean when we say we’ll be reopening with a bang!"
author = "Lindsey Skinner"
year_published = 2024
year_updated = 2025
