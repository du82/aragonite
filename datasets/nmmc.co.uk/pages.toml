["https://nmmc.co.uk/explore/galleries"]
title = "Galleries | National Maritime Museum Cornwall"
description = "Exhibitions, live performances, events and activities throughout the year."
full_description = 'Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free {"@context":"http:\/\/schema.org\/","@id":"https:\/\/nmmc.co.uk\/explore\/galleries\/#arve-youtube-a2bo77l3fjw","type":"VideoObject","embedURL":"https:\/\/www.youtube-nocookie.com\/embed\/a2BO77L3FJw?feature=oembed&enablejsapi=1&origin=https%3A%2F%2Fnmmc.co.uk&iv_load_policy=3&modestbranding=1&rel=0&autohide=1&playsinline=0&autoplay=0"} Falmouth, on the South Cornwall coast, is a fitting setting for this journey of discovery to begin. The Museum is located on aptly named Discovery Quay, and is a vast, iconic building, home to exciting exhibitions and a wide range of galleries taking visitors on a journey through the influence of the sea on history and culture. The building was custom designed and built on land that was once covered in the sheds of boat builders. These sheds inspired the design of the building which is covered in green oak. The building has the most fantastic, breathtaking views over Falmouth harbour. Your voyage of discovery begins in the Boat Hall. Here you can orientate yourself in the building, admiring the hanging flotilla of small boats on display over your head. The variety of boats around the world is staggering. From earliest times people have built rafts and logboats using whatever material was available, and have powered them by muscle, wind or engine. They are shaped by the people who make and use them and are used for working, fishing, rescue, ceremony, transporting people and goods. Each boat reflects its heritage. Seek out the Ednamair, the tiny dinghy in which the Robertson family – five people and a friend – survived for 38 days in the Pacific after their yacht had been holed. This is one of the great ocean survival stories of modern times. Beyond, in the RNLI Rescue Zone there are ride-on rescue vehicles, a dressing-up area and information about sea safety where we celebrate the outstanding work of the RNLI. The Hold is our largest single exhibition space where we install our respected and renowned major exhibitions. Our aim is to curate ambitious and unexpected exhibitions developing partnership projects with national and international museums, bringing new connections with world cultures to Cornwall, and bringing ancient artefacts from national and international collections.'
