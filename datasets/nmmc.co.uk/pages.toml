["https://nmmc.co.uk/2024/02/exhibiting-resilience"]
title = "Resilience | National Maritime Museum Cornwall"
description = "An evocative, multi-media exhibition on the resilience of Cornwall’s coastal communities past, present and future."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free An evocative, multi-media exhibition on the resilience of Cornwall’s coastal communities past, present and future. Be drawn in by the suspended glass buoys at the centre of the gallery and their faint buzz of sound. Come closer and the volume increases so you can hear the voices from those connected to Cornwall’s coast. The exhibition explores how coastal communities have responded to changes within living memory, and how those past events influence people today. It will uncover the pressures that a life connected to the ocean can bring. Please note, this exhibition is designed as an immersive, interactive audio-visual experience. It has multiple sound sources which some visitors may find overwhelming. Resilience has been created in partnership with Kaleider and the Universities of Exeter and Southampton. Visiting the Resilience Exhibition is free as part of the Museum’s annual admission fee. Pay once and get in free for a year. Explore 15 galleries over five floors, jump aboard boats, climb the 100-foot Lookout Tower, go underwater in the Tidal Zone, uncover ocean adventures and survival stories and sail miniature boats on the Boat Pool. Plus, have fun in Skull Island Play Zone and learn about Cornish maritime history in our Cornwall galleries. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
