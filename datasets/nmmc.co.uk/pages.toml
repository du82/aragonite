["https://nmmc.co.uk/2018/05/cookies-policy"]
title = "Cookies policy | NMMC"
description = "This page explains how we use cookies on our website."
full_description = "Our Cookies PolicyThis page explains how we use cookies on our website. You can change your browser settings to block or delete our cookies at any time (find out how to do this on the About Cookies website). If you continue to use our website without changing your settings, we will accept your consent to receive our cookies.What are cookies?Our websites use cookies, as almost all websites do, to help provide you with the best experience we can. Cookies are small text files that are placed on your computer or mobile phone when you browse websites.How we use cookiesOur cookies help us to:Make our websites work as you’d expectRemember some settings and/or shopping basket contents during and between visitsAllow you to share pages with social networks like Facebook or TwitterPersonalise our sites to you to help you get what you need fasterMonitor performance and help us to continuously improve our websites for you.We do not use cookies to:Collect any personally identifiable information (without your express permission)Collect any sensitive information (without your express permission)Pass personally identifiable data to third parties.Third party functionsOur sites, like most websites, include functionality provided by third parties. For example, the YouTube videos on our websites use cookies. Disabling these cookies will probably break the functions offered by these third parties.Anonymous visitor statistics cookiesWe use ’analytics software’ to compile visitor statistics, such as how many people have visited our website, what type of technology is being used (eg Mac, Windows PC, mobile device), how long visitors spend on the site, and what pages were viewed. These programs also tell us, on an anonymous basis, how people reached this site (eg from a search engine), whether they have been here before and, for our shop site, which items were purchased.We use Google Analytics to do our anonymous visitor and e-commerce tracking.Giving us permission to use cookiesIf the settings on your software that you are using to view this website (your browser) are adjusted to accept cookies we take this, and your continued use of our website, to mean that you are fine with this. Should you wish to remove or not use cookies from our site you can learn how to do this below; however, doing so will likely mean that our site will not work as you would expect.Turning cookies offYou can usually switch cookies off by adjusting your browser settings to stop it from accepting cookies. Doing so, however, will likely limit the functionality of our and a large proportion of the world’s websites as cookies are a standard part of most modern websites.If you would prefer not to receive cookies from our websites, please change your browser settings (find out how to do this on the About Cookies website).Concerns about spywareIt may be that you have concerns around cookies relate to so-called ‘spyware’. Rather than switching off cookies in your browser you may find that anti-spyware software achieves the same objective by automatically deleting cookies considered to be invasive."
author = "Lindsey Skinner"
year_published = 2018
year_updated = 2023
