["https://nmmc.co.uk/about/support-us/annual-membership"]
title = "Annual membership | National Maritime Museum Cornwall"
description = "Support the Museum by becoming an Annual Member. Your donation will help us to preserve Cornwall's maritime heritage for future generations."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free In return for the benefits your membership gives you, your donation helps us with restoration, conservation and education programmes so that we can preserve the maritime heritage for future generations. As an independent museum we receive no revenue funding from the government and rely on people like you to enable us to continue our charitable work. We want everyone to enjoy their visit; our collections to inspire and challenge with new and exciting displays, and for the Museum to continue evolving as a world class visitor destination. With your help we will continue to develop, excite and educate. We would like you to become part of our future and join us on this journey. National Maritime Museum Cornwall’s members enjoy free admission in November and January to a number of Cornwall’s best attractions. The attractions are listed below with additional details on planning your visit. Please check opening times and visitor information before visiting and ensure you have your valid NMMC Membership card(s) with you (not to be confused with the Museum’s Annual Pass). If you would like to support our work and enjoy unlimited entry to the Museum we also have other schemes that enable you to do this. Life Membership allows a named individual free entry to the Museum for life, VIP invites to special events, such as previews of temporary exhibitions, lectures, seminars and various other events. This package allows you and a guest to have free entry to the Museum for life, VIP invites to special events, such as previews of temporary exhibitions, lectures, seminars and various other events. The money we raise through these partnerships makes an invaluable contribution to enhancing our displays and continuing our restoration, conservation and education programmes as well as meeting our financial responsibilities. See our current Corporate members. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
