["https://nmmc.co.uk/category/kids-family"]
title = "Kids + family | National Maritime Museum Cornwall"
description = "National Maritime Museum Cornwall is one of the UK’s most family-friendly museums. There’s plenty for you to do, both during term time and during the holidays."
full_description = "Friday 22 November.As part of Kids in Museums Takeover Day, we’re asking toddlers to help us manage the Museum! Saturday 5 April – Monday 21 April.This Easter holidays, join the Cornish Caretakers as they bring Cornish history to life in an hilarious and informative show ‘The Cornish Caretakers and the Treasures of Cornishness’ at National Maritime Museum Cornwall. Saturday 25 October – Sunday 2 November.The nights are drawing in and the shadows are taking over. Come and join us for a spooky half term this October. Join in with the eerie shadow puppet stories and songs in the Boat Hall, get creative in spooky Make & Take, and discover the Museum trail! Sunday 8 October, 11.30amCastles, crows, and rowing boats. Mermaids, dragons and tiny islands surrounded by the sea… Arthur’s Club, a place where everyone is welcome, a place where stories come alive. Thursday 31 October.Halloween at the Museum is perfect for children and their families. Visit out of hours if you dare! Join in with the eerie shadow pirate puppet stories and songs in the Main Hall, create your own shadow puppets in Make & Take and join the Museum trail and find all the hidden pirate ghosts. Saturday 20 December – Sunday 4 January.Immerse yourself in the best of what makes our beautiful part of the world sparkle at this magical time of year with A Cornish Christmas. Decorate our festive sailing boat, help Charlie Chough uncover Cornwall’s festive traditions in our Museum trail, and more. Once a month during term time.Get creative with your little one in Minnows Makes, craft sessions designed for under 5s. Join us to make something different each month using our most colourful and vibrant art supplies. Every Monday during term time.A weekly storytelling and lively sing-a-long session. Minnows Tales starts at 11am and is perfect for under 5s."
