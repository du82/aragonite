["https://nmmc.co.uk/visit/getting-here"]
title = "Directions and Map | National Maritime Museum Cornwall"
description = "How to find National Maritime Museum Cornwall, based on Discovery Quay in Falmouth."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free The Museum is at the southern end of Falmouth’s harbour side, between the main shopping area and Falmouth Docks. There are brown signs (with an anchor) to assist you on the outskirts of Falmouth, but limited further signs on the A39 so please keep going on the A39 (past Merchants Manor Hotel on your right, then Fox Rosehill Gardens on your left) until you are directed to take a left turn by a brown sign which lists the Maritime Museum with the anchor. Follow this along Avenue Road and you will see the Maritime Car Park. There is pay on exit parking in the Maritime Car Park (max 4 hours controlled by Automatic Number Plate Recognition, with a 2.2-metre height restriction) or in Grove Place car park (max 3 hours) providing over 400 short term spaces within 150 metres of the Museum. The Dell car park, near the railway station, offers long-term parking and is about 200 metres away. All these car parks have accessible spaces. Arriving into Falmouth by bus is a convenient way to navigate your great day out. With no need to worry about parking, enjoy more time discovering what Falmouth has to offer. Visit Cornwall by Kernow to plan your journey. The Museum is a five-minute walk from Falmouth Town (The Dell) Station. There is a regular train service with connections to the main London to Penzance line. Change at Truro for the branch line to Falmouth. Coaches can drop off on Cambeltown Way (adjacent to the Maritime Car Park) or at the bus stop on Marine Crescent. Long stay parking for coaches is at Gyllyngvase Coach Park, Queen Mary Road, Falmouth, TR11 4DP. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
