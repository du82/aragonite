["https://nmmc.co.uk/whats-on/event/tattoo-british-tattoo-art-revealed"]
title = "Tattoo: British Tattoo Art Revealed | NMMC"
description = "A genuinely ground-breaking and comprehensive history of British tattooing, featuring cutting edge designers, leading academics and major private collectors."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Tattoo: British Tattoo Art Revealed is a genuinely ground-breaking and comprehensive history of British tattooing, featuring cutting edge designers, leading academics and major private collectors. This is the largest gathering of real objects and original tattoo artwork ever assembled in the UK featuring over 400 original artworks, photographs and historic artefacts. The exhibition challenges long-standing myths and pre-conceptions about tattooing when it comes to class, gender and age, whilst at the same time celebrating the astonishingly rich artistic heritage of tattooing in the UK. Image: Detail from rare Sailor Knight flash banner courtesy of Neil Hopkin-Thomas. Photo by Paul Abbitt The exhibition showcases the work of major tattoo artists from George Burchett, via The Bristol Tattoo Club, to Alex Binnie and Lal Hardy. The exhibition features items from three of the most important private collections of tattoo material in Britain, loaned by collectors Jimmie Skuse, Paul “Rambo” Ramsbottom and Willy Robinson, providing a rare opportunity to display original artwork and artefacts not otherwise on public display. The exhibition also delves into previously unseen private archives that reveal hidden histories, including the incredible real story of Britain’s pioneering female tattoo artist, Jessie Knight. Tattoos are a living and uniquely three dimensional form of art. The museum responds to this by commissioning an innovative installation which literally brings the art off the gallery wall to create a ‘sculptural map’ of British tattoo art today. The ‘100 Hands’, curated by Alice Snape of ‘Things and Ink’ magazine, is based around one hundred silicone arms, each tattooed with an original design by 100 of the leading tattoo artists working across the UK. Image: The 100 Hands installation features original designs by 100 of the top tattoo artists working in the UK today. Photo by Luke Hayes"
