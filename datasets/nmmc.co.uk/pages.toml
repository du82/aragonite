["https://nmmc.co.uk/news/page/10"]
title = "Latest News from National Maritime Museum Cornwall - Part 10"
description = "Many words or phrases used in the present day can trace their origins back to the maritime world. Some – like ‘all hands on deck’ and ‘plain sailing’ – are more obvious than others."
full_description = "Many words or phrases used in the present day can trace their origins back to the maritime world. Some – like ‘all hands on deck’ and ‘plain sailing’ – are more obvious than others. Explore the history of the oldest form of fixed-seat rowing to take place anywhere, as well as the history of Penryn Rowing Club. Thursday 7 November, 7.30pm.Cornish writer and blogger Elizabeth Dale (The Cornish Bird) uncovers some of the lesser-known stories from Cornwall’s history. The battery powered tea lights used for our Christmas 2022 Make & Take crafting activities have been recalled by the Office of Product and Standards. It has been highlighted that there is a high risk of choking. Today the Cutty Sark is one of the world’s most famous ships, but it wasn’t all plain sailing for the vessel. In this Bartlett Blog we explore the ship’s history and how Wilfred & Catharine Dowman from Falmouth secured the Cutty Sark’s future. The town of Eyemouth in Berwickshire on the East Coast of Scotland was a busy fishing port with a large fishing fleet landing huge catches of haddock and herring. In October 1881 the fishing fleet suffered a devastating disaster. Our new major Pirates exhibition has inspired this month’s Bartlett Blog. Follow the story of the schooner, Ryelands, that was transformed from a cargo ship into a movie star. Tickets to the 2023 Lecture Series are now on sale and includes talks from leading academics and creators from across the country. In May hear from illustrator Matt Johnson on how he created his wonderful book Red Sails & Pilchards and in the autumn the lectures take on a pirate focus where explore further some of the themes covered in the new Pirates exhibition. In a recent exhibition at National Maritime Museum Cornwall, entitled Memories of Falmouth 1934 – 1969, several images were featured of the schooner Mary Barrow. The three masted topsail schooner was one of the last sailing ships plying the coastal trade around Britain in the 1930s."
