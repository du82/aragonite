["https://nmmc.co.uk/about/support-us/legacies"]
title = "Legacies | National Maritime Museum Cornwall"
description = "A gift in your will is one of the best ways to ensure future generations continue to be inspired by Cornwall and Falmouth's maritime heritage."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free A gift in your Will is one of the best ways to ensure future generations continue to be inspired by boats, the sea, and Cornwall and Falmouth’s maritime heritage. Legacies contribute towards the long term financial security of the Museum and because legacies to registered charities such as National Maritime Museum Cornwall are tax free it can also help to reduce your liability for Inheritance Tax. A gift in your Will, no matter how small, will make a real difference to our work. The website will give you an idea of the wide range of projects we are working on at any one time. Our education and exhibitions programmes are constantly evolving and we aim to provide something of interest for everyone no matter how young or old. We also have a busy collections programme ensuring the preservation of our maritime heritage through our boats and Cornish collections. If you are considering making a Will, it is important that you use the services of a solicitor. They will be able to help and advise you on the best sort of provision for you and your loved ones. To find a local solicitor click on the following links: Once you’ve made provision for your loved ones, you can then look at how you’d like to make your gift. You can either leave a specific amount of money, which is known as a Pecuniary Bequest, or a share of what’s left over after all of your wishes have been carried out, which is a Residuary Bequest. Rather than leaving a specific amount of money, many people chose to leave a percentage or the residue of their estate because its value is not affected by inflation A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
