["https://nmmc.co.uk/category/bartlett-library"]
title = "Bartlett Blog | National Maritime Museum Cornwall"
description = "The Bartlett Library holds over 20,000 volumes and offers one of the finest collections of maritime reference books, periodicals and archival material."
full_description = "This Bartlett blog offers fascinating insights into pilot boats and maritime pilotage, pilots are a vital safety service in Falmouth and beyond. This Bartlett blog provides background information to the historical maritime journal kept by Captain Edward Lawrance of the Packet Ship Anna Teresa. This Bartlett Blog looks at the official naming ceremony of the Queen Elizabeth Dock in Falmouth in 1958 and the arrival of the first ship to enter the dock. This Bartlett Blog examines the story of John Arscott, a convict from Truro in and Catherine Prior, an accomplice of Mary Broad, who were both sentenced to seven years transportation and taken to Australia on board the First Fleet. In 1881 Charles Napier Hemy lived and worked as an artist in Falmouth. In this Bartlett Blog we uncover what led Hemy to become an artist and what brought him to Falmouth. In 1746, William Cookworthy discovered a source of clay which was to lead to developments in English porcelain and the birth of the China clay industry in Cornwall. Uncover the life of a former First World War nurse who became one of the world’s most famous female yacht racers. Discover the part played by Falmouth, the Fal, and the Helford when 150,000 troops and over 5,000 vessels took part in the largest amphibious invasion in history."
