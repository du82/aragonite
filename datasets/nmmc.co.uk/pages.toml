["https://nmmc.co.uk/about/our-beginnings"]
title = "Our story so far… | National Maritime Museum Cornwall"
description = "National Maritime Museum Cornwall is a celebration of the sea. Find out more about our beginnings and some of the highlights of the last 20 years."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free National Maritime Museum Cornwall is a fully independent museum, a development of the original FIMI (Falmouth International Maritime Initiative) partnership created in 1992, and the result of collaboration between Royal Museums Greenwich, and the former Cornwall Maritime Museum in Falmouth. Royal Museums Greenwich owns an impressive collection of small boats – some 120 craft of historical significance from Britain and overseas. For years, its Trustees had been seeking a suitable waterfront location in which to create an imaginative and dynamic showcase for the boats, many of which can still be sailed. Falmouth, offering a waterside location, rich nautical heritage and one of the world’s finest harbours, was a natural choice. The Cornwall Maritime Museum evolved from a collection reflecting Cornwall’s rich maritime history gathered over 150 years by the Royal Cornwall Polytechnic Society. In 1981, this collection was brought together as the Falmouth Maritime Museum, later changing to the Cornwall Maritime Museum. Since then, the collection has grown and prospered. Both museums applied separately to the Heritage Lottery Fund for assistance in developing their ideas. At the Fund’s suggestion, the two began talks that culminated in the formation of a joint venture to create a single entity. Although owing a great deal to both sponsoring museums, the new undertaking was to be independent, with its own governing body, financially self-supporting, and most importantly with displays to reflect its location and market. A new Charitable Trust was created to oversee the project. In addition to the HLF, funding for National Maritime Museum Cornwall has come from the South West Regional Development Agency, the European Regional Development Fund (5b funding programme), individuals, and corporate sponsors. The landmark building was designed by architects Long & Kentish, following a countrywide competition run by Cornwall County Council in 1996."
year_published = 2016
year_updated = 2024
