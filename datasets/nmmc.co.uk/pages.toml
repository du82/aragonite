["https://nmmc.co.uk/category/curators-choice"]
title = "Curator's choice | National Maritime Museum Cornwall"
description = "Each Curator’s Choice puts the spotlight on a different artefact at the Museum, delving into their history and what they would have been used for."
full_description = "In 1951, an American general cargo vessel set out on passage from Hamburg to Baltimore carrying a mysterious cargo. This festive postcard is part of the Museum’s archive collection and was sent across the sea from the Isles of Scilly in 1908. In 1994, Cornish diver Colin Martin found the Hanover wreck after seven years of searching. Learn more about the tragedy and what objects were recovered. This beautiful little chest, or Victorian writing slope, belonged to one of Falmouth’s ship and boat owners, Captain Albert Edward Benney. Standard diving dress is a type of diving suit that was formerly used for all underwater work, now largely superseded by lighter and more comfortable equipment. The diving suit on… At first glance a coracle seems a rather unlikely water craft, with no discernible bow or stern, and a strangely shaped paddle for propulsion. But they have stood the test… Hevva! Hevva! This horn looks quite ordinary, but it played an incredibly special role in Cornish history. It belongs to a period where the pilchard industry was one of the… “Pilchards! Whose bodies yield the fragrant oil and make the London lamps at midnight smile!” Peter Pindar 1783. Cornwall once relied upon the sea for nearly everything: food, transport, trade,… Where we introduce you to some of the stories behind objects in the Museum… This model is a scale replica of Slippen, a Cornish pilot gig built in 1830. Gigs were…"
