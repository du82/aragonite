description = "Immerse yourself in the best of what makes our beautiful part of the world sparkle at this magical time of year with A Cornish Christmas at National Maritime Museum Cornwall."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free Immerse yourself in the best of what makes our beautiful part of the world sparkle at this magical time of year with A Cornish Christmas. Decorate our festive sailing boat, help Charlie Chough uncover Cornwall’s festive traditions in our Museum trail, and more. Feast your eyes on our beautiful willow lobster pot Christmas tree. The unique tree was constructed by Cadgwith fisherman Nigel Legge and decorated with plaster starfish made by Museum volunteers. Explore 15 galleries over five floors, jump aboard boats, climb the 100-foot Lookout Tower, go underwater in the Tidal Zone, uncover ocean adventures and survival stories and sail miniature boats on the Boat Pool. Plus, have fun in Skull Island Play Zone and learn about Cornish maritime history in our Cornwall galleries. The Christmas holiday activities are FREE as part of the Museum’s annual admission fee. Pay once and get in free for a year. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
