["https://nmmc.co.uk/2025/02/maritime-pilots-and-pilotage"]
title = "Maritime Pilots and Pilotage | NMMC"
description = "This Bartlett blog offers fascinating insights into pilot boats and maritime pilotage, pilots are a vital safety service in Falmouth and beyond."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free This blog post offers fascinating insights into the vital maritime service of pilotage that continues to ensure ships can ‘better come into their ports without peril’. In October 2024 Falmouth Harbour’s new £1.6 million pilot boat Atlantic arrived from the builders, Holyhead Marine in North Wales. The Atlantic is a replacement for the pilot boat the LK Mitchell named after the Falmouth Pilot, 49-year-old Captain Laurence Kerr Mitchell, who died in September 1974 after trying to board the distressed P & O Ferry Eagle in bad weather in Falmouth Bay. Whilst the LK Mitchell, which has served Falmouth Harbour for many years, is bound for Scotland the Atlantic now joins Arrow to provide Falmouth Harbour’s pilot services. These boats are part of the long history and the continuing provision for pilots and pilotage in Falmouth and the United Kingdom. Falmouth is the third deepest natural harbour in the world and the Falmouth Pilotage area covers Falmouth and Gerrans Bays, the Carrick Roads and the Rivers Fal and Helford. Falmouth Harbour is a Trust Port. There are no shareholders or owners, income is to maintain the port. A Board of Commissioners with statutory powers and duties was created by Act of Parliament over 150 years ago. The Order for the Maintenance and Regulation of the Harbour of Falmouth in the County of Cornwall was part of the Pier and Harbour Orders Confirmation Act 1870 (No 2) 33 & 34 Vict. It states that There shall be a body of Commissioners for carrying this order into execution which Commissioners and their successors are hereby, for the purposes of this Order, incorporated by the name of “the Falmouth Harbour Commissioners”. One of the Board’s primary responsibilities, among others, is to ensure safety and compliance for the harbour and therefore safe and efficient pilotage is a critical role in the operations of the harbour. Fal Pilot Services is the service arm of Fal Harbour which fulfils this role."
author = "Rosie Leo"
year_published = 2025
year_updated = 2025
