["https://nmmc.co.uk/visit/ticket-prices"]
title = "Ticket prices | National Maritime Museum Cornwall"
description = "Buy a ticket and get in free to National Maritime Museum Cornwall for a year."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free You may not be aware but we’re an independent museum and registered charity and your entry fee supports the work of the Museum including our education programmes. On paying the admission fee you will receive an Annual Pass which allows you to return as many times as you wish for the following 12 months. Many people only visit us once in a year but through Gift Aid, offering annual passes in this way allows us to treat your ticket fee as a donation and therefore increases funding for our charitable work. All children (under 16) must be accompanied by an adult. Companions who are required to assist disabled visitors are admitted free of charge. You will also be offered the opportunity to Gift Aid your entrance fee. Gift Aid is a simple way to increase the value of your entrance fee to the charity – at no extra cost to you. If you pay tax in the UK, we can reclaim the basic rate tax on your entrance fee, giving the Museum an additional 25% towards our charitable work. If you would like to support our work and enjoy a wealth of other benefits, please join us as a Member. For more information see the membership page. There is a special discount for pre-booked education groups. Please see our education section for information. A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
