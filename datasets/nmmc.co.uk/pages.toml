["https://nmmc.co.uk/whats-on"]
title = "What’s On | National Maritime Museum Cornwall"
description = "Saturday 23 November 2024 – Sunday 4 January 2026An evocative, multi-media exhibition on the resilience of Cornwall’s coastal communities past, present and future."
full_description = "Saturday 23 November 2024 – Sunday 4 January 2026An evocative, multi-media exhibition on the resilience of Cornwall’s coastal communities past, present and future. Friday 28 June 2024 – Sunday 8 June 2025An intimate exhibition celebrating the 100th anniversary of the Sunbeam one-design keelboat boat racing in Falmouth. Friday 28 March 2025 – January 2027SURF! is the next major exhibition from National Maritime Museum Cornwall, celebrating a century of surfing in Cornwall. Spring 2025Our Lecture Series for Spring 2025 ‘Surf Pioneers’ draws on the themes of our new major exhibition SURF! celebrating 100 years of Waveriding in Cornwall. Thursday 3 April, 7.30pmDr Sam Bleakley takes us behind the scenes on his journey curating SURF! gathering over 100 Cornish surfboards spanning 100 years of waveriding history. Saturday 5 April – Monday 21 AprilThis Easter holidays, join the Cornish Caretakers as they bring Cornish history to life in an hilarious and informative show ‘The Cornish Caretakers and the Treasures of Cornishness’ at National Maritime Museum Cornwall. Saturday 24 May – Sunday 1 JuneThis May half term, discover the curious creatures found on our Cornish coast with the Rock Pool Project at National Maritime Museum Cornwall. Thursday 1 May, 7.30pmLucia Griggi shares her incredible journey from the rugged shores of Cornwall to becoming one of the world’s most renowned female surf photographers. Thursday 15 May, 7.30pmIn this lecture, Chris Hines MBE Hon.D.Sc. will look at the origins and campaigning of Surfers Against Sewage and where surfing activism sits 35 years on. Monday 21 July – Sunday 31 AugustAn aerial surf adventure. Immerse yourself in the energy of the ocean waves as the dancers drop in, cut back and hang ten. Saturday 25 October – Sunday 2 NovemberAs the nights start drawing in and the shadows take over, come and join us for a spooky half term this October. Join in with the eerie shadow puppet stories and songs in the Boat Hall, get creative in spooky Make & Take, and discover the Museum trail!"
