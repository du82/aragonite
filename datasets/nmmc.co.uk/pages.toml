["https://nmmc.co.uk/2025/02/the-secret-helford-river-spy-boat-reviving-a-ww2-hero"]
title = "The Secret Helford River Spy Boat: Reviving a WW2 Hero | NMMC"
description = "A remarkable piece of local maritime history is coming to life in our Museum boatbuilding workshop as we carefully craft a replica of a World War II boat with an extraordinary secret mission."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free A remarkable piece of local maritime history is coming to life in our Museum boatbuilding workshop. Under the direction of Bob White, Boat Collection Manager, our workshop volunteer team are carefully crafting a replica of a World War II boat with an extraordinary secret mission… During the dark days of World War II, the Helford River was a critical launching point for daring Special Operations Executive (SOE) missions into occupied France. Brave operatives would navigate small boats to within a kilometre of enemy coastlines, before being rowed ashore to inhospitable beaches, delivering crucial supplies to the French Resistance. In the latter half 1942, Lt. Cmdr. Nigel Warington-Smyth of Naval Intelligence in Falmouth, undertook ‘Operation Slide Rule’, to test a variety of hull shapes suitable for rowing ashore in surf. As part of this process, he drew up two new designs, the S.N.1 and S.N.2. The replica in our workshop is being built using original S.N.2 plans that were discovered at the National Maritime Museum Greenwich. The design features an innovative cold-moulded, double diagonal construction that was cutting-edge technology for its time. This innovative building style was made possible by the development of new adhesives and used in both boat and aircraft construction of the time, to produce lightweight and extremely rigid forms. Pass by the boatbuilding workshop in the Museum on Wednesdays to see the progress of the Helford Spy Boat build as it moves from the initial lofting, the process of drawing a boat full-size before it is built, to the construction itself. Visitors can look forward to seeing the completed historic vessel, and learning more about the secret wartime activities of the Helford River, in a special exhibition planned for spring 2026. In the meantime, discover more about the Helford River and SOE missions that took place in this Maritime Views article Helford and the SOE."
author = "Rosie Leo"
year_published = 2025
year_updated = 2025
