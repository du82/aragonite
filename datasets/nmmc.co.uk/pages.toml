["https://nmmc.co.uk/about/working-in-the-museum"]
title = "Job vacancies | National Maritime Museum Cornwall"
description = "Find out about current job vacancies and careers at National Maritime Museum Cornwall, located on Discovery Quay in Falmouth."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free We’re a small, friendly, dedicated and hard-working team supported by a large group of volunteers, without whom we simply couldn’t function. You can find our current job vacancies below, and our volunteering opportunities are here. Keep an eye on our Facebook and Twitter channels for all the latest roles. We are seeking a part-time Visitor Experience Supervisor, who will work as part of the Visitor Experience team, overseeing the day-to-day operation of the Museum to ensure we deliver an exceptional visitor experience. You will undertake the daily procedures at the start of the day to ensure the Museum is ready for our first visitors at 10.00am and have responsibility for securely locking up at the end of the day. You will be the key point of contact for all staff and volunteers on operational matters, problem solving to ensure issues are resolved quickly and efficiently. Our Visitor Experience Supervisors offer a warm welcome to visitors arriving for their visit, process admission tickets, and assist with retail sales. They have daily management for our Visitor Experience volunteers, ensuring the rota is maintained, proactively contacting volunteers where there is a requirement for support. You will have previous experience of working in a busy customer-facing environment, have a ‘can-do’ attitude, with excellent customer service skills. You will be an excellent team player who can face the daily challenges competently and calmly. You would be the ‘responsible person’ in an evacuation situation, consulting with the emergency services and senior members of staff. You have responsibility to administer first aid to visitors, staff, and volunteers, as and when required. It is not essential that you have a first aid qualification, as training will be provided. If you are interested in applying, please email your completed application form, to lindafrost@nmmc.co.uk or Linda Frost, Head of Human Resources, National Maritime Museum Cornwall, Discovery Quay, Falmouth, TR11 3QY."
year_published = 2016
year_updated = 2025
