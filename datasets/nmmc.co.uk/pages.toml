title = "Learning | National Maritime Museum Cornwall"
description = "At National Maritime Museum Cornwall we offer a range of ways to learn, from our Lecture Series to our Make & Take craft sessions."
full_description = "This festive postcard is part of the Museum’s archive collection and was sent across the sea from the Isles of Scilly in 1908. In 1994, Cornish diver Colin Martin found the Hanover wreck after seven years of searching. Learn more about the tragedy and what objects were recovered. Join in with the eerie shadow pirate puppet stories and songs in the Main Hall, create your own shadow puppets in Make & Take and join the Museum trail and find all the hidden pirate ghosts. We’re heading shore side this may half term with the Rock Pool Project where we’ll be looking for Mini Monsters of the Not So Deep on our local beaches. The creatures found in Cornish rockpools are often very colourful. In this Make & Take at Home we explore how to add colour to your drawings. We’re heading to Cornwall’s rock pools this May half term to find creatures to draw. Here’s how to find things to draw in our latest Make & Take at Home.…"
