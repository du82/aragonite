full_description = "A new installation of contemporary tattoo art created by 14 Black and POC tattoo artists all working in the UK today.This post contains sculptural representations of male and female nudity, including body parts. Hegarty’s Boatyard is one of the latest temporary exhibitions to open at National Maritime Museum Cornwall this year. We thought we’d catch-up with Kevin O’Farrell, the photographer behind the exhibition, to find out more about him and this incredible body of work. It is with great sadness that we announce the death of our dear friend Captain George Hogg – one of the Museum’s founders, and a passionate and dedicated volunteer. Isabel Stevens is a writer, editor and curator based in London, and is the production editor for Sight and Sound, a monthly international film magazine published by the BFI. Dr Tammy Horton is a Research Scientist at the National Oceanography Centre (NOC), Southampton. She is an expert in deep-sea taxonomy, ecology and biodiversity. Dr Darren Naish is a zoologist and author, best known for his work on dinosaurs and other prehistoric reptiles as well as for his writings on sea monsters and other mystery beasts. Dr Jon Copley is guest curator of Monsters of the Deep, marine biologist and Associate Professor in Ocean Exploration & Public Engagement at the University of Southampton. Viktor Wynd is an artist who uses museum objects in the way that other artists use paint. He’s the founder and proprietor of London’s famous Museum of Curiosities, Fine Art & UnNatural History. After three years of meticulous and extensive restoration Sea Queen, a Mevagissey working boat owned by National Maritime Museum Cornwall, is back in the water."
