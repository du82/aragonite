title = "Overseas Groups | National Maritime Museum Cornwall"
description = "The Museum offers an inspirational experience to overseas students wishing to explore the rich maritime heritage of Cornwall."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free The Museum offers an inspirational experience to overseas students wishing to explore the rich maritime heritage of Cornwall, or simply to enhance their language skills in an exciting environment. All our displays are designed to be interactive and engaging to young people. Key features include amazing artefacts, hands-on exhibits and audio-visual displays exploring stories of wrecks and rescues, fishing, smuggling, historic boat-building and racing. There’s also the opportunity to go ‘under-water’ in our Tidal Zone (one of only three natural underwater galleries in the world), and, after seeing life as a fish, climb the 29m tower to get a birds-eye view of Falmouth. You can also learn to sail in the Waterfront boat pool using our wind powered radio controlled boats. We are currently revising our provisions for overseas students so please check regularly for any updates. To talk through your needs, book a visit or arrange a pre-view, please contact Seth Hall, Formal Learning Manager: A company limited by guarantee | Registered in England and Wales | Reg no: 3446298 | Charity no: 1067884"
