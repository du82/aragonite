["https://nmmc.co.uk/explore/collections"]
title = "Our collections | National Maritime Museum Cornwall"
description = "The museum’s collections consist of a range of objects, boats, art, books and archives to promote an understanding of the maritime heritage of Cornwall."
full_description = "Ticket PricesPay once, get in all year Adults £18.50 Children (Under 18s) £9.50 Children (Under 5s) Free We have two main collections at the museum, The National Small Boat Collection, including objects and archives which relate to small boats, and the collection of objects representing the maritime history of Cornwall. The National Small Boat Collection was originally developed by the National Maritime Museum at Greenwich. This is now housed in Cornwall where it has been extended by the addition of other craft. This collection is representative of boats from the UK and around the world. A maximum of length overall of 30ft (9.2m) is set for the collection although there are exceptions. A collection of objects and archives support the National Small Boat Collection. Even those who don’t don’t know a luff from a lugger are seduced by the romance of boats, and this is a collection of international importance, preserving craft used for survival, work, competition, leisure, pleasure, exploration and war… from the Inuit kayak, a deadly hunter’s tool of skin and driftwood with an unbroken pedigree stretching back 10,000 years to the Mirror dinghy, as much a part of the ’60s social revolution as the Mini car. The Museum doesn’t just tell the story of inanimate objects – it relates the tales of the lives and the times of those who made and used them. Much of the Cornish Maritime Collection came from the former Cornwall Maritime Museum in Falmouth. It contains objects, pictures, models and archives relating to the history of Cornwall and the sea, and Falmouth in particular. An important element of this collection is the material relating to the Falmouth Packet Ships which includes six watercolours by Maltese artist Cammillieri. The museum has a large collection of objects, boats and archives. The majority of the collection is held in store. If you would like to make an appointment to view objects which are not on display, please email enquiries@nmmc.co.uk outlining the type(s) of objects you would like to view"
year_published = 2016
year_updated = 2024
