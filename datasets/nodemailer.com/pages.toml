["https://nodemailer.com/message/custom-source"]
title = "Custom source :: Nodemailer"
description = "Nodemailer is a module for Node.js to send emails"
full_description = "If you want to use your own custom generated RFC822 formatted message source, instead of letting Nodemailer to generate it from the message options, use option raw. This can be used both for the entire message or alternatively per-attachment or per-alternative. This example loads the entire message source from a string value. You don’t have to worry about proper newlines, these are handled by Nodemailer. When using raw for attachments then you need to provide all content headers youself, Nodemailer does not process it in any way (besides newline processing), it is inserted into the MIME tree as is."
author = "Andris Reinman"
year_published = 2025
