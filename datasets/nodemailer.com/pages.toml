["https://nodemailer.com/app"]
title = "NodemailerApp :: Nodemailer"
description = "Nodemailer is a module for Node.js to send emails"
full_description = "The app includes local SMTP and POP3 servers, a sendmail replacement, a catchall email domain service, an AMP4Email renderer, and it imports emails from EML, EMLX, large MBOX files from Gmail Takeout, Maildir folders, and Postfix queue files for inspection and preview. Want to see the actual HTML source of a beautifully designed email instead of garbled rfc822 text? Just open the HTML tab of an email to view it. You can use NodemailerApp to instantly preview emails sent from your dev environment, whether via SMTP, sendmail, or the open web using the built-in catchall service. You can also upload emails to an external SMTP or IMAP server. All SMTP, POP3, and IMAP transactions include live logs for extra clarity. Note: Downloads may be slow due to limited network throughput, and file sizes are large (>100MB) since NodemailerApp is built on Electron. 1. Preview emails as they are imported. You can start importing a large 10GB mbox file from Gmail Takeout and immediately start browsing the emails that are already imported. 2. Rich email output. View the plain text alternative, HTML source code, and email headers alongside the standard rich text view. You can download the entire email as an EML file or export it as a PDF. Attachments are located under the Files tab. 3. Local development server. NodemailerApp can be configured as an SMTP relay server in your development environment. Emails sent from local environments (like Laravel) can be immediately previewed in NodemailerApp, which catches emails for testing purposes without delivering them to actual recipients. You can also retrieve these emails via POP3 if needed. 4. Message upload. Emails stored in NodemailerApp can be uploaded to an SMTP server for delivery or to an IMAP server to store them in your email account. 5. Extensive search. Search for emails, attachments, or people. NodemailerApp indexes all header values in every message, making it easy to find specific emails, such as a PDF sent by your boss last year."
