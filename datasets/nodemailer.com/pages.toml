["https://nodemailer.com/extras/mailparser"]
title = "Mailparser :: Nodemailer"
description = "Nodemailer is a module for Node.js to send emails"
full_description = "Advanced email parser for Node.js. Everything is handled as a stream which should make it able to parse even very large messages (100MB+) with relatively low overhead. The module exposes two separate modes, a lower level MailParser class and simpleParser function. The latter is simpler to use (hence the name) but is less resource efficient as it buffers attachment contents in memory. simpleParser is the easiest way to parse emails. You only need to provide a message source to get a parsed email structure in return. As an additional bonus all embedded images in HTML (eg. the images that point to attachments using cid: URIs) are replaced with base64 encoded data URIs, so the message can be displayed without any additional processing. Be aware though that this module does not do any security cleansing (eg. removing javascript and so on), this is left to your own application. headers is a Map with lowercase header keys. So if you want to check for the Subject: header then you can do it like this: The format of a header depends on the specific key. For most header keys the value is either a string (a single header) or an array of strings (multiple headers with the same key were found). The following headers are parsed into structured objects, where value property includes the main value as string and params property holds an object of additional arguments as key-value pairs MailParser is a lower-level email parsing class. It is a transform stream that takes email source as bytestream for the input and emits data objects for attachments and text contents. The parser emits ‘headers’ once message headers have been processed. The headers object is a Map. Different header keys have different kind of values, for example address headers have the address object/array as the value while subject value is string. Event ‘data’ or ‘readable’ emits message content objects. The type of the object can be determine by the type property. Currently there are two kind of data objects"
author = "Andris Reinman"
year_published = 2025
clearnet = "https://nodemailer.com/extras/mailparser"
