["https://nodemailer.com/dkim"]
title = "DKIM :: Nodemailer"
description = "Nodemailer is a module for Node.js to send emails"
full_description = "Nodemailer supports DKIM signing, which adds a digital signature to all outgoing messages. This signature is calculated and added as an additional header (or multiple headers, if using multiple keys). One drawback of DKIM signing is that Nodemailer needs to cache the entire message before it can be sent. Normally, message output is streamed directly to SMTP without caching. For small messages, this difference is negligible, but for larger messages, Nodemailer offers the option to cache messages on disk instead of in memory. In this scenario, Nodemailer buffers the message in memory up to a certain size and then switches to disk caching. After the signature is calculated and sent to SMTP, the cached message is streamed from disk to SMTP. DKIM signing can be configured at the transport level (where all messages are signed with the same keys) or at the message level (where different keys can be used for each message). If both are configured, the message-level DKIM settings will take precedence. Assumes a public key is available for 2017._domainkey.example.com. You can check if the key exists using the dig tool:"
author = "Andris Reinman"
year_published = 2025
clearnet = "https://nodemailer.com/dkim"
