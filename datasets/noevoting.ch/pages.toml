["https://noevoting.ch/info/Nation"]
title = "E-Voting zerstört die Demokratie."
full_description = 'Aus leichtfertigen Antworten unbedarfter Bürger auf unprofessionelle Umfragen über die Beliebtheit des Gedankens einer elektronischen Abstimmung wird ein Bedarf abgeleitet. Aus diesem künstlichen Bedarf wird dann ein Prestige Projekt für die Bundesverwaltung. Die Auslandschweizer Organisationen (ASO) befeuern den Gedanken eines E-Voting mit einer eindrücklichen Lobby-Arbeit verschiedener Diplomaten im Bundesdienst. FDP Politiker sehen zwar die Problematik des Cyberkrieges, sind aber überzeugt von der Machbarkeit einer sicheren Lösung durch "die Industrie". Sie unterscheiden nicht zwischen möglichen inländischen Herstellern und ausländischen Grosskonzernen, welche im militärisch-industriellen Komplex arbeiten Nachdem alle parlamentarischen Vorstösse nicht mehrheitsfähig waren, blieb der breiten Opposition gegen E-Voting nur noch die Volksinitative. Ein Referendum gegen das Gesetz der politschen Rechte hätte am unseligen Status Quo mit dem Testbetrieb (50% des Elektorates zugelassen) E-Voting nichts geändert Einige Beiträge zeigen eindrücklich die Möglichkeiten des heutigen Cyberkrieges. Alles was schon länger möglich schien, ist heute unbestritten als Tatsache festzustellen, nicht zuletzt dank den Enthüllungen des Edward Snowden. Mit einem öffentlichen Test der Kernanlage E-Voting/POST glaubt man das Vertrauen der Bevölkerung zu gewinnen, wenn dort nicht allzu offensichtliche Mängel auftreten. Und das, obwohl niemand behaupten würde, dass in einer solchen Situaton die Sicherheit ausreichen würde. Mit 3 E-Voting Lösungen hat der Bund angefangen. Die erste ("Konsortium-Lösung") wurde vom Bundesrat 2015 gestoppt. Als offizieller Grund wurde angegeben, weil das Abstimmungsgeheimnis nicht garantiert werden konnte. Die zweite Lösung CHVote ist seit Ende November am Auslaufen per 2020, nachdem der CCC mit einfachsten Mitteln eine Sicherheitslücke aufgezeigt hatte. Die Kosten für deren Behebung sowie für weitere Sicherungsmassnahmen wollte der Kt. GE nicht mehr (alleine) tragen.'
