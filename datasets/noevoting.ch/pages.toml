full_description = "Aktuelle Präsentation E-Voting E-Voting 2022 Publizierte Arbeiten 10.10.2022 Tell-news Kampf um die Demokratie Original NoEvoting 05.09.2022 Freie Universität Berlin World Wide Wahl statt Wahlokal? - BsC Arbeit von Matthias Kuhn (39 Seiten Text mit Anhang 104) Medienberichte 10.08.2022 PCTipp Post lässt ethische Hacker das System attackieren. 10.08.2022 Swissinfo 'Die Parteien zeigen sich wieder offen für E-Voting' 26.08.2022 netzwoche 'Post tritt Trägerschaft von swiss-cyber-defense bei' 28.08.2022 Blick 'NDB: Russland bekämpft Demokratie von der Schweiz aus.' 14.09.2022 BFH 'BFH-Forschende veröffentlichen neuste Version ihres E-Voting-Systems' 21.09.2022 Bundeskanzlei 'Beirat diskutiert Entwurf für aktualisierte Strategie Digitale Schweiz' 28.09.2022 inside-it 'Keine kritischen Lücken im E-Voting-System der Post gefunden.' 06.10.2022 inside-it 'Bruce Schneier: Man wird nie sicher sein, dass E-Voting nicht manipuliert wurde' Kommentare Die machen zuerst eine Ethik-Prüfung vor der ethischen Kommission? Natürlich kann man das machen, aber das Problem der Vertrauenswürdigkeit löst das nicht! Müsste heissen: Viele Politiker haben wieder vergessen, warum E-Voting ein unkalkulierbares Risiko darstellt und man dieses nicht eingehen darf. Wir hier der Bock zum Gärtner gemacht oder der Gärtner zum Bock? E-Voting wäre eine ideale Plattform dafür. Schön, dass auch der NDB inzwischen entsprechende Risiken konstatiert hat. Eine zweite Applikationslösung, deren Erfinder die erste prüfen. Das ist grundsätzlich gut. Aber die grundlegenden Risiken liegen nicht an der Applikation. Über E-Voting hat man nichts gehört !? So etwas hört man immer wieder. Sagt aber gar nichts aus. Ändert nichts an der Problematik. Bruce Schneier: DER Kryptologie-Spezialist! Spezialisten haben wir auch in der Schweiz! Ihre Überzeugung in allen Ehren, Frau Schüpbach, sie wirkt aber nicht glaubwürdiger bei steter Wiederholung. Die Risikoabwägung aller Cyber Experten spricht eine andere Sprache. Genauso ist es!"
