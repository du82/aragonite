["https://noevoting.ch/info/gesetzeslage"]
title = "E-Voting zerstört die Demokratie."
full_description = "Bund NEU: Bundesgesetz über die politischen Rechte - BISHER: Verordnung der BK über die elektronische Stimmabgabe Anhand des Beispiels des Kt BE kann man die rechtliche Problematik des E-Voting erkennen. Es gibt lediglich folgende gesetzliche Regelungen: 1 Der Regierungsrat kann die Stimmabgabe auf elektronischem Weg ermöglichen, wenn die technischen und organisatorischen Voraussetzungen erfüllt sind. 2 Der Wille der Stimmberechtigten muss korrekt festgestellt werden können, und das Stimmgeheimnis muss gewahrt bleiben. Hier stehen Anforderungen an die Ressourcen für eine elektronische Stimmabgabe, aber keine Kriterien, nach welchen diese erfüllt sind. Es gibt folgende Interpretationsmöglichkeiten: a) Die Regierung sorgt einfach dafür, dass es so ist. Das ist wohl die meistvermutete Annahme. Aber kann und muss man das einfach glauben? b) Es ist dem Gesetzgeber egal, wie eine solche Anforderung erfüllt und nachgewiesen wird. Wieso eigentlich? Der Gesetzgeber sollte doch die Rahmenbedingungen auch für die Regierung setzen? c) Wenn jemand beweisen kann, das es nicht so ist, soll er es doch beweisen und gerichtlich vorgehen. Aber ist das nicht eine unzulässige Beweislastumkehr? Interessant ist, dass bei klassichen Stimmkanälen bis auf jeden Handgriff gesetzlich vorgeschrieben ist, wer was wie zu machen hat, damit alles korrekt abläuft. Bei den elektronischen Mitteln wird die Korrektheit einfach stillschweigend angenommen. In einer unzulässigen, stillschweigenden Beweislastumkehr wird jetzt offenbar verlangt, dass Inkorrektheiten nachgewiesen werden müssen. Hat dieser Regelung der Stimmbürger wirklich automatisch zugestimmt, weil er das Referendum gegen diese obgenannten ungenügend formulierten Bestimmungen nicht ergriffen hat? Handelt es sich hier nicht um einen staatspolitisch höchst fragwürdiges und undemokratisches Vorgehen? Der einzelne Bürger, der bei der klassischen Wahlermittlung mitwirkt, muss Dutzenden Regelungen genügen, um das zu tun, der Staat jedoch, der alles zentral und elektronisch abwickelt, tut das ohne Kontrollmöglichkeiten durch Wahlkommissionen, wie das bis anhin üblich war."
year_published = 2025
