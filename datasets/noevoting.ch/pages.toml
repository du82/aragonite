["https://noevoting.ch/info/vernehmlassung21"]
title = "E-Voting zerstört die Demokratie."
full_description = "noevoting.ch Stellungnahmen des Vereins E-Voting Moratorium gesendet an evelyn.mayer@bk.admin.ch am 08.06.2021 (Originaltexte in Deutsch)/ Nos Positions / Nostri Posizioni , [1] Fragebogen Vernehmlassung vom 22.05.2021 [2] Offizielle Vernehmlassungsantwort vom 08.06.2021 (10p) Gesamtwürdigung der neuen Verordnung (Präsentation) Der Dialog mit der Wissenschaft hat die Problematik auf ein angemessenes wissenschaftliches Niveau gebracht. Auch die Komplexität findet in der Verordnung und deren Anhang durchaus einen angemessenen Ausdruck. Nicht erkannt werden die politischen Folgen einer solchen Komplexität. Den Kantonen, die niemals alle die notwendigen Ressourcen dafür bereitstellen können, werden die Überprüfung all der hochkomplexen Massnahmen aufgebürdet, die daraus zu folgen hätten. Deren Risiko-Management wird deshalb mit untragbaren Kompromissen an die Sicherheit enden. Damit kann das Vertrauen in das E-Voting nicht gewonnen werden. Das jetzt geübte Herumbaggern am E-Voting Applikations-Code ist zwar ein unabdingbarer Teil der Sicherheitsbetrachtungen. Es ist aber einer, der alleine für sich völlig ungenügend ist. Beim dynamischen Einsatz des Codes kann jederzeit eine Manipulation erfolgen. Um das zu verhindern bräuchte es an allen beteiligten Orten umfassende operative Sicherheitsvorkehrungen, die ausserordentlich ressourcenaufwendig sind. Die zuständigen Kantone haben diese Ressourcen nicht. Die Komplexität des Systems bedingt ausserdem einen enormen Zeitbedarf für jegliche Art von Kontrollaufgaben, ganz zu schweigen vom Kommunikationsbedarf bei Unregelmässigkeiten. Diese Zeit gibt es gar nicht beim Abstimmungs- und Wahlvorgang. Dazu kommt die Möglichkeit des Diebstahls von Abstimmungscodes bei den Druckzentren. Jene Codes der Nichtwähler könnten so problemlos auf der ganzen Welt verwendet werden. Die Kontrolle dazu ist völlig ineffektiv und daher unpraktikabel. Kurzum: Das Projekt ist zum Scheitern verurteilt. [1] Die Entdeckung von Lecks und der Diebstahl von Zugangscodes zur Abstimmung können von Benutzern auf der ganzen Welt begangen werden. Solche Angriffe sind schwer zu erkennen und können mit der aktuellen Lösung nicht wirksam verhindert werden. Das Recht des Nichtwählers, die Nutzung seiner allfällig fälschlich abgegebenen Stimme überprüfen zu lassen, ist dabei nicht praktikabel. [2] Die Folgen von unsicheren Endgeräten trägt nicht nur der Benutzer selbst, sondern auch das Kollektiv der Stimmbürger. Insbesondere gehört auch das Abstimmgeheimnis hiezu. [3] Das Ausmass einer Manipulation kann niemals festgestellt werden. Dadurch ergibt sich ein riesiges Potential an Verunsicherung bei jeglichen Unregelmässigkeiten. Es besteht deshalb Grund für Misstrauen gegenüber Anbieter und Behörden in Bezug auf Transparenz. [4] Die Funktion einer Wahlkommission im bestehenden Sinne kann nicht mehr stattfinden. Es sind nur noch höchstqualifizierte IT-Experten und Mathematiker, die etwas zur Gültigkeit des Abstimmungsvorganges sagen können. Deren Kompetenz und Redlichkeit unterliegen keinerlei demokratischer Legitimation. [5] Das Zeitfenster für Abklärungen bei Meldungen von möglichen Manipulationen wird immer zu klein sein, um in jedem Fall rechtzeitig die Gültigkeit von Wahlen und Abstimmungen zu kommunizieren. [6] Ein Probebetrieb wird jahrelang für Anbieter und Nutzer stark defizitär ausfallen. Wenn die definitive Einführung auf einer guten System-Sicherheit basieren soll, so ist das Ende des Probebetriebes kaum abzusehen. Nutzen und Aufwand stehen in einem dramatisch schlechten Verhältnis."
