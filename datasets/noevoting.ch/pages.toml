["https://noevoting.ch/info/vernehmlassung"]
title = "E-Voting zerstört die Demokratie."
full_description = "Übersicht Vernehmlassungsdokumente vom 30.03.2019 [1] Bewertetes Vernehmlassungsformular Gesetzestext vom 24.02.2019 [2] Offizielle Vernehmlassungsantwort vom 30.03.2019 [3] Zusammenfassender Kommentar zum Expertenbericht vom 19.12.2018 [4] Kommentierte Erläuterungen vom 19.12.2018{in gelb/rot die kommentierten Aussagen, in grün besonders bemerkenswerte Aussagen} [5] Kommentierter Expertenbericht vom 19.12.2018{in gelb/rot die kommentierten Aussagen, in grün besonders bemerkenswerte Aussagen} Genereller Kommentar zum Gesetz I. Der Bundesrat regelt die Anforderungen an die Systeme für die elektronische Stimmabgabe und deren Betrieb. Im Prinzip nichts gegen den Satz einzuwenden, aber die Erfahrung bei Cyberdedrohungen zeigt, dass solche einmal definierten Anforderungen bei weitem nicht den realen Bedrohungen auf Dauer genügen. Zertifizierungen der bisherigen Art sind wertlos, da sie nicht den höchsten Ansprüchen entsprechen, die es für die elektronische Stimmabgabe benötigte. An die Heimgeräte der Benutzer und das Internet im allgemeinen z.B. werden gar keine Anforderungen gestellt, wohl weil eine Umsetzung davon juristisch und technisch schwierig wäre und die Kostenfolgen jemand zu tragen hätte. Die Sicherheit muss aber immer ganzheitlich konzipiert, realisiert, geprüft und permanent überwacht werden, denn das schwächste Glied bestimmt im Wesentlichen die Sicherheit. Den dafür notwendigen Aufwänden wird nirgendwo effektiv Rechnung getragen und es darf deshalb bezweifelt werden, dass sie geleistet werden würden. Der Bund, der als einziger dies könnte, hat sich schon vorsorglich aus diese Pflicht entlassen.(Erl. Pkt. 1.4) Die Kantone kriegen (lediglich) die Auflage die erforderlichen Bestimmungen zu erlassen, damit die Sicherheit gewährleistet wird. Sie sind dazu nicht in der Lage, denn es wird Unmögliches verlangt. Interessant ist dies im Zusammenhang damit, dass die Zertifizierungen für die Auswertungs-Systeme, die der Bund ausgibt, allein eben offenbar doch nicht zu genügen scheinen, denn das nicht vernachlässigbare Restrisiko gegen den Missbrauch müssen die Kantone mit Vorschriften abdecken. Falls es solche gäbe, müsste die Einhaltung derselben aber rigoros überprüft werden, was enorme Aufwände für die Kantone bedeutete. Der Bund lässt hier Spielraum: Wenn sie das nicht tun oder wenn es keine oder zu wenige Kontrollen gibt, geht es auf Kosten der Sicherheit. Dann stellt sich die Frage, wer trägt die Verantwortung für zu spät oder gar nicht aufgedeckte Missbrauchsfälle. Die Geschädigte ist die Gesellschaft als Ganzes. Das Vertrauen, das sie den Institutionen entgegenbringt darf nicht aufs Spiel gesetzt werden. II. Das Gesetz müsste unbedingt dem obligatorischen Referendum unterstellt werden, denn es betrifft eine derart einschneidende Änderung der politischen Rechte und Verantwortungen, dass es eigentlich verfassungsrelevant ist."
