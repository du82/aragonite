title = "E-Voting zerstört die Demokratie."
full_description = "Die Initiative verlangt ein 5jähriges Verbot der E-Voting Aktivitäten. Anschliessend kann das Verbot von der Bundesversammlung aufgehoben werden, wenn folgende Bedingungen erfüllt sind: - Sämtliche Schritte der elektronischen Stimmabgabe sind ohne besondere IT Kenntnisse überprüfbar. - Eine Beeinflussung von aussen gegen die wirkliche Willensäusserung kann bei der Stimmenauszählung ausgeschlossen werden. - Das gleiche gilt auch für alle Teilergebnisse, die auch nachzählbar sein müssen. Dabei sollen mindestens die gleichen Sicherheitsbedingungen wie bei der handschriftlichen Wahl bestehen."
