beurteilt von NIST' inside-it 18.09.2018, 'Graubünden ent­scheidet sich für E-Voting-System der Post' Netzwoche 17.10.2018, Oliver Spycher:'Verifizierbares E-Voting ist möglich' Netzwoche 17.10.2018, 90 Prozent der unter 30-Jährigen wünschen sich E-Voting' B's Log 03.11.2018, 'Warum E-Voting immer noch keine gute Idee ist' BFH 07.11.2018, 'Schwachstelle im E-Voting-System' B's Log 09.11.2018 'Wo die Bundeskanzlei falsch liegt' Zum Hacker Fall des CCC: Steigerlegal 20.11.2018, 'Unsicheres E-Voting: Abmahnung an den CCC !' Christian Folini zum Hacker Fall 20.11.2018, 'Antworten auf technische Fragen zu den im Schweizer Fernsehen behaupteten Schwachstellen im Genfer E-Voting System' Volker Birk's blog 20.11.2018, Entgegnungen auf die falschen Behauptungen watson 28.11.2018. 'Paukenschlag beim E-Voting: Genf zieht seiner Online-Wahlplattform den Stecker, aber ...' Inside-it 28.11.2018, 'Kanton Genf trägt eigene E-Voting-Lösung zu Grabe' Computerworld 28.11.2018 'Kanton Genf verzichtet auf seine E-Voting-Plattform' swissinfo 28.11.2018, 'Kanton Genf verzichtet auf seine elektronische Abstimmungsplattform' Inside-it 12.12.2018, 'Nationalrat fragt nach Kosten des E-Votings der Post' heise 20.12.2018, 'Regierung gibt grünes Licht für E-Voting – die Gegner sind zahlreich' irregular-expression.ch 21.12.2018, Kluge Antworten auf den Propaganda-Blog der POST Halbheer 23.12.2018, Cybersecurity verlangsamen, E-Voting vorantreiben: schlecht für die Schweiz. bluewin 25.01.2019, 'Für diesen Experten ist E-Voting zu gefährlich' inside-it 25.01.2019, 'Volksinitiative gegen E-Voting lanciert' nau 28.01.2019, 'Eric Dubuis: Sicheres E-Voting in der Schweiz ist möglich' it-magazine 28.01.2019, 'E-Voting soll vorübergehend verboten werden' Republik 31.01.2019, 'Das heikle Geschäft mit der Demokratie' Limi's Blog 1.02.2019, 'eVoting-Moratorium macht Sinn' IT Magazin 4.02.2019, Eine Illusion namens Sicherheit' Die meisten unabhängigen Experten aus der Wissenschaft lehnen die Idee 'E-Voting' wegen der grundsätzlichen mangelnden Sicherheit am Internet und dem Verlust des Vertrauens in Folge einer möglichen Manipulation rundum ab. Sie sehen den Staat nicht in der Lage, machbare Lösungen, die sicher, bezahlbar und benutzerfreundlich sind, bereitzustellen. Aufgrund der vielen Cyber-Vorfälle in der letzten Zeit gibt es keinen Anlass, von etwas anderem auszugehen. Thomas Verasani, FDP, lehnt nur die aktuelle Lösung ab, die er für weder bequem genug noch sicher hält. Er ist u.a. der Meinung, der Staat müsste - als Vorbedingung - den Bürger vor Cyberattacken schützen. Dazu müsste man noch ein paar Regeln im Bereich Datenschutz und Überwachung ändern oder erstellen. Damit wäre - seiner Ansicht nach - ein künftiges E-Voting System sinnvoll. Er macht aber keine Angaben über die ressourcenmässige und politische Machbarkeit. Konversation mit ICT Präsident Flatt Die NR Dobler und SR Müller stellen mit Prof. St. Frei (ETH) einen Angriffssimulator vor. Dort wird versucht, mit statistischen Mitteln eine Manipulation festzustellen.Sie schlagen am 11.6.18 eine Begrenzung des E-Voting Testbetriebs vor. Kommentar. Dieser Fall beweist, dass Angriffe auf den Homecomputer ziemlich einfach sind. Die Reaktion der BK zeigt, dass sie den Nutzer selbst verantwortlich macht für diese Art Risiken. Neuer Hype in Zug: Mit einem publizitätsträchtigen Versuch beginnt wieder, was zuerst fertiggedacht werden müsste. Technologisch interessant, aber demokratiepolitisch nicht weniger bedenklich: Keine Transparenz, Abstimmgeheimnis, Ressourcenfragen unbehandelt. Interview mit NR Glättli. Offener Brief als Antwort an Frau Regierungsrätin Fehr zu 'E-Voting als Treiber der Netzsicherheit' S. Diskussion bei "Kommentaren" mit Replik und Duplik Ein konstruktiver Beitrag eines Befürworters. Aber auch er sagt: "Der Bund müsste seine Strategie ändern". 5 gute Ideen, unter welchen Bedingungen man so ein Vorhaben angehen müsste. Warum üben wir seit 18 Jahren an der Idee E-Voting herum ohne diese Erkenntnisse? Wie könnte man den Bund dazu bringen, das "richtig" zu tun? Hier wird zu Recht darauf hingewiesen, dass bei der heutigen Auszählung ebenfalls zentrale elektronische und prozessuale Komponenten verwendet werden, die manipulieranfällig sind. Sie sind aber weit weniger komplex und können besser beherrscht werden. Hier wird auf die Bedeutung der Kantone hingewiesen, die die Verantwortung für Abstimmungen haben. Leider haben sie aber meist nicht genügend Ressourcen, um E-Voting genügend kompetent bewältigen zu können. In diesem Beitrag wird erläutert, wie schwierig die Entwicklung des Rechts ist bei der Umsetzung von vollständigen Transparenzanforderungen, wobei der Fokus auch hier immer nur auf der Applikation liegt. Staatssicherheits- und Geschäftsgeheimnisansprüche stehen auch da im Wege. Die Autorin ist optimistisch, dass diese Entwicklung positiv ist. Nicht beachtet wird, dass durch die Tatsache, dass nur die allerwenigsten Leute es verstehen können, die Transparenz nie wirklich entsteht. Beitrag Marques: In USA herrscht ein Wirrwarr von Systemen, aber etwas ist klar: die Einsicht, dass sich internetbasierte Systeme nicht zertifizieren lassen, auch nur ansatzweise sicher zu sein, ist schon länger da. Deshalb der verstärkte Versuch mit Wahlcomputer: und sogar das scheitert, obwohl sich solche Systeme ja eigentlich viel leichter absichern lassen sollten, weil in der Kompexlität eingeschränkter und eine Notwendigkeit zur Vernetzung a priori nicht notwendig ist. Auf gut Deutsch: einen Taschenrechner / Wahlcomputer zu bauen, der nur das und genau nur das tut, was er soll, ist einfacher als einen Verbund von Rechnern im weltweiten Netz zu konstruieren, die wir auch im Alltag nutzen.In der Praxis aber gelingt auch das nicht; theoretisch ist das eng damit verknüpft, dass wir es mit universellen (turing-vollständigen) Rechenmaschinen zu tun haben. Deshalb kann man damit ja auch Schach spielen, wie der CCC in DE ja plakativ gegenüber dem Bundesverfassungsgericht zeigte. Das Beispiel mit dem Schach ist im Urteil mit drin: es überzeugt die Richter ultimativ, E-Voting zu verbieten. Für den ehemaligen Projektleiter des E-Voting CH genügt offenbar die theoretische Überprüfbarkeit. Die universelle Verifizierbarkeit besteht für ihn nur in der Auszählung und für die Übertragung braucht es zusätzlich die individuelle Verifizierbarkeit. Man ist also auf die Mitwirkung jedes einzelnen Stimmbürgers angewiesen. Diese Interpretation der Definition von u.V. ist wissenschaftlich falsch und politisch irreführend. Sie muss universell sein, d.h. nicht abhängig von der Regel-Befolgung aller anderen. Der Informatikprofessor Portmann hat sich auf Umfragen spezialisiert. Er hat herausgefunden, dass die Jungen Informatikmittel überwiegend toll finden und deshalb auch so abstimmen wollen. Über Risiken und Gefahren äussert er sich nicht. Prof. Dubuis: "Beim E-Voting der heutigen Form ist man auf die digitale Mündigkeit des Stimmbürgers angewiesen" Volker Birk (CCC CH) stellt klar, mit welchen Falschaussagen die Bundeskanzlei die Bevölkerung zu beschwichtigen versucht. Sie stützt sich auf eine sog. "Expertengruppe" und veröffentlicht die Aussagen hier. Herr Folini verliert sich in der Frage, ob und wann eine technische Massnahme so getroffen worden sei, wie in den Medien berichtet. Er attestiert aber auch, dass Fehler gemacht wurden. Diese Debatte geht an der eigentlichen Problematik vorbei, denn es gäbe Hunderte oder mehr solcher Diskussionen zu führen, um alle relevanten Probleme im Cyberraum in den Griff kriegen zu können. Das Problem ist vielmehr folgendes: Die Promotoren des E-Voting sehen offenbar ihre Verantwortlichkeiten einzig in dem von ihnen entwickelten Erfassungs- und Auswertungssystem. Die Risiken, die durch die Lücken und Defizite der Internet-Infrastruktur, sowie diejenigen der daran angeschlossenen Benutzersysteme Tatsache sind, werden zwar vielleicht nicht ignoriert, aber im Endeffekt auf die Benutzer abgeschoben. Damit verkennen sie die politische Dimension eines solchen Vorhabens: es geht nicht nur - wie sonst meistens bei IT Projekten - darum, "zufriedene" Kunden zu haben, sondern die gesamt-gesellschaftlichen Risiken zu erfassen und transparent und exakt darzustellen. Das ist nicht geschehen, wohlweislich, weil damit die Akzeptanz akut gefährdet würde. Nicht zu ersparen ist somit der Vorwurf: Das Projekt -Management hat in Bezug auf die Umweltanalyse kläglich versagt. Der Kt. GE gibt seine Plattform auf: Zu teuer, man überlässt das Feld der POST. Glaubt jemand, dass die Post das günstiger macht oder dass das System dort sicherer sei? Und wo bleibt jetzt die systemische Redundanz? Es verbleibt 1 Hersteller mit ausländischen Investoren... Das Argumentationsgebäude der E-Voting-Befürworter fällt in sich zusammen. Was bedeutet die Aufgabe des CHVote für das E-Voting CH? Raphael Reischuk hat es verstanden. Der Professor Dubuis weiss zwar auch, wovon er spricht, aber in dieser Form wird das bestimmt falsch verstanden. Die Frage ist nicht, ob es möglich ist, sondern ob wir das haben. Und das tun wir nicht, auch nach 18 Jahren Investitionen und Testerfahrung nicht. Wieso soll das jetzt in 1 Jahr möglich sein? Aber selbst das theoretische Wissen unterliegt offenbar einer ständigen Erneuerung, wie die Spezifikation CHVote zeigt. Unabhängige Verifizierungsmethoden gäbe es ausserdem nur mit einer E2E-Sicherheit. Diese würde aber eine total andere Client/Server Architektur bedingen. Endgeräte müssten sämtlichen Sicherheitsanforderungen entsprechen. Die wären dann aber nicht von den heutigen Herstellern zu den heutigen Preisen zu haben. Und dann ist immer noch die Druckcode Geschichte nicht sicher. Darum gibt es nur diese Lösung! Das müsste auch die letzten E-Voting-Fans von den bequemen Sitzen reissen! Sehr gute Analyse ! Bravo, Adrienne Fiechter. Dieser Abschnitt ist nicht mehr aktuell s. diesen . [2] Aktuelle Medienberichte / Rapports de médias actuels / Rapporti dei media attuali in deutsch: 2013 BAZ onlin