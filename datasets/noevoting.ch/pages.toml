title = "E-Voting zerstört die Demokratie."
full_description = '9 x SVP + 1 x GPS gegen 5 x SP + 4 x CVP + 4 x FDP + 1 x BDP + 1 x GLP. Die Parlamentarier stimmen parteipolitisch ab. Sie sehen mehrheitlich unsere Demokratie im E-Labor als "nützliche Testversuche". Sie glauben, dass man die Sicherheit auf Gesetzesstufe verordnen kann! Die Kantone können das unselige Vorhaben auch noch stoppen - aber jeder nur für sich. Aber die Regierungen und die Parlamente sind noch grossenteils unsicher, ob ein solcher Stopp mehrheitsfähig ist. Die obrigkeitlichen Beschwichtigungen aus der Bundeskanzlei haben enormes Gewicht. Die Faktenlage mit der Aufgabe des CHVote durch den Kanton Genf nach dem Hackerangriff hat aber in einem grossen Teil der Bevölkerung die Zweifel am Sinn des E-Votings genährt. Jetzt braucht es darum die Volksinitiative! Wir wollen, dass das Volk die Souveränität über die Stimmenauszählung behält. Darum müssen alle Schritte des Wahl- und Abstimmungsvorganges für jedermann überprüfbar und nachvollziehbar bleiben. Weder die Bundeskanzlei noch IT Betreiber der Kantone oder eines Privatanbieters dürfen ermächtigt werden, alleine darüber zu befinden, ob ein Ergebnis korrekt ist. Bis jetzt ist für uns nicht plausibel gemacht worden, wie diese Anforderung mit einer E-Voting Lösung umgesetzt werden kann. Wir wollen aber auch kein immerwährendes Technologieverbot. Ein 5jähriges Moratorium mit Auflagen für eine Neukonzeption E-Voting scheint für uns ein gangbarer Weg. Chronologie wichtiger Meilensteine:31.05.2018: Ein Initiativ-Komitee hat getagt und das weitere Vorgehen verabschiedet. Ein Initiativtext liegt vor. 15.06.2018: Ein neues, breites Debattenforum wird eröffnet. 15.06.2018: Der Text wird veröffentlicht zur Konsultation unter Experten 28.06.2018: Die Parl. Initiativen Grüter und Glättli zu E-Voting werden in der Parl. Kommission behandelt Sie werden mit 15:10 bzw. 12:10 abgelehnt. 31.07.2018: Der Text wird veröffentlicht zur basisdemokratischen Konsultation 06.09.2018: Der Text wird finalisiert 11.09.2018: Parl. Init. Grüter/Glättli werden im NR behandelt wurden relativ knapp abgelehnt September 2018: Initiativkomitee wird erweitert und offizialisiert September 2018: Text geht zur Vor-Prüfung in die Bundeskanzlei 12.10.2018: Die SPK SR folgt der Parl. Init. 18.427 von SR Müller zur Begrenzung des Testbetriebs. Kommentar zu den Vorschlägen / "Strengere Auflagen"? Ein Witz. Oktober 2018: Der Zeitplan für die Gesetzesrevision "Polit. Rechte" wird angefordert. November 2018: Medienmitteilung des Initiativkomitees nach dem Hackervorfall mit CHVote November 2018: Diverse überparteiliche Gruppen von Kantonsparlamentariern in den Kantonen ZH,GL,AG,SG und JU sprechen sich für ein E-Voting Moratorium aus. 09.12.2018: Nach der SVP und den Grünen beschliessen die JUSO die Unterstützung unserer nationalen Initiative. 29.12.2018: Die Bundeskanzlei veröffentlicht den Text der Gesetzesrevision und eröffnet die Vernehmlassung. 31.12.2018: Eröffnung des Spendenkontos z.G. des Vereins "E-Voting Moratorium". 08.01.2019: Finalisierung des Initiativtextes mit den Korrekturen durch die Bundeskanzlei. Beschluss des Initiativ-Komitees über das weitere Vorgehen im Detail. 25.01.2019: Pressekonferenz im Bundesmedienzentrum 1000 Uhr zur Lancierung der Volksinitiative. Referenten. Pressemappe. Bilder Danach:WE-COLLECT-Kampagne 26.02.2019 Bestätigung der Volksinitiative durch die Bundeskanzlei, vorbehältlich einiger formeller Korrekturen auf dem Unterschriftenbogen. 16.03.2019 Start Unterschriftensammlung. 24.06.2019 Der Kt. GE zieht jetzt CHVote per sofort zurück. 27.06.2019 Die Bundeskanzlei zieht nach vernichtenden Stellungnahmen aus allen Parteien die Gesetzesrevision zurück. 06.07.2019 Die Post zieht ihr "altes" System ebenfalls per sofort zurück. Das "neue", welches dem "Intrusion Test" unterworfen wurde und kapitale Fehler zeigte, möchten sie aber in Zusammenarbeit mit der spanischen Fa. SCYTL weiterentwickeln! Der Testbetrieb soll gemäss Bundeskanzlei weitergeführt werden können, allerdings auf einer "neuen Basis". Diese ist aber z. Zt unbekannt. 22.06.2020'
