full_description = '''Für diesen Abschnitt Sprache wählen E-Voting Medienberichte, Analysen, Anlässe Medienberichte werden nicht übersetzt. Die Kommentare sind teilweise dreisprachig. Achtung ! Die neuen Medienberichte sind unter NEWS zu finden! Inhaltsverzeichnis: - [1] Experten kommen zu Wort, Fachzeitschriften 2009-2019 - [2] Übrige Medienberichte CH/dt, CH/fr, CH/it, international bzw. englisch 2013-2019 - [3] TV Sendungen in deutsch, französisch, italienisch und englisch 2012-2019 - [4] Berichte über Parlamentsgeschäfte 2017-2019 - [5] Die Haltung der Bundeskanzlei 2018 - [6] Kantonale Entscheidungen und Geschäfte E-Voting 2015-2019 - [7] Die Meinung von Fachexperten der OSZE über das schweizerische E-Voting System 2015 - [8] Meine eigenen Analysen - [9] Anlässe 2018 / 2019 [1] Experten kommen zu Wort / Les experts ont leur mot à dire / Gli esperti hanno voce in capitolo Prof. Erich Neuwirth, ehem. Uni Wien, 19.05.2009, 'Zauberlehrlinge des E-Votings' Volker Birk b-log, 21.08.2016 'Weshalb E-Voting keine gute Idee ist', WOZ 27.04.2017, 'Erik Schönenberger: E-Voting auf Biegen und Brechen' (Schweiz.Dig.Gesellschaft) Volker Birk b-log, 15.1.2018 'Digitale Demokratie ist keine Demokratie' Université de Lausanne 18.01.2018, 'E-Voting in der Schweiz: Eine vergleichende Analyse der Entwicklungsstände und Haltungen in den Kantonen' Computer Chaos Club (CCC),26.2.2018, Stellungnahme zu E-Voting Thomas Verasani, FDP 27.2.2018, 'e-Voting = Tod der Demokratie?' Besorgte Bürger in Rapperswil/Jona werden mit E-Voting konfrontiert, 2.03.2018 CCC 2.03.2018, Boykottaufruf für E-Voting und Alternativ-Vorschlag NZZ Leserbrief N. Bertschinger 2.03.2018 Hirntorsionen, 2.03.2018, 'Das Ende der Demokratie', Blog von Dominic Zschokke Klein-Report 3.03.2018, 'E-Voting schürt Misstrauen' Netzwoche vom 7.03.2018 'E-Government fordert Politik und Verwaltungen' Inside-it 8.03.2018, '250000 Fr. für E-Voting Hacker sind vorhanden' Sicherheitsforum, 14.03.2018, Prof. Dr. Lubich, 'Gefaehrdete