["https://noidea.dog/birds"]
title = "I Like Birds — No Idea Blog"
description = "I like photographing birds."
full_description = "May 11th, 2023 May 11, 2023 My first ever successful picture of a swallow. They’re so fast! Barn swallow behind IKEA in Red Hook Comment Red Hook May 3rd 2023 May 3, 2023 Walking past the building site for a new park in Red Hook and I stopped to check out what was making the squeaky cheeping sound. Three killdeer were running around in there. I'd never seen them in New York before, only at my in-laws' place in New Mexico.The building site was on my walk home from school dropoff, so I started carrying my camera every day. And I was rewarded with: killdeer babies! A killdeer adult and three floofy babies. Comment Jamaica Bay January 3rd 2023 and December 27th 2022 January 3, 2023 I went to Jamaica Bay last week to look for snow geese. There weren’t any around, though I saw a peregrine falcon, so I was still pretty happy. Ms 10 and I went back again yesterday to try again, and got snow geese (hurray! I love them.) and also a cool woodpecker. We heard this hairy woodpecker calling and tapping for a long time before we saw it. The peregrine falcon has huge eyes, a vicious beak and a general air of having evolved to murder things. It’s a real “I’m glad it’s small and I’m big” kind of bird. The West Pond was full of geese, mostly Canada geese but a bunch of brants and a few snow geese. The snow geese were the reason I went out there in the first place, so I was glad to see them :-) They’re wonderful to watch. Comment Prospect Park, April 9th, 2022 April 15, 2022 We’d had a very indoors Saturday morning so we went to the Park for the afternoon. My first time ever seeing a Northern Flickr. It looks like a bird designed by a child. I love it. Ms 9 took this picture: her first bird! The floofiest American robin. A baby, I assume? It was in no hurry to run or fly away anyway. How much wood would a wood duck duck if a wood chuck would chuck wood at it? And another first for me, a hermit thrush. Comment Prospect Park, February 19, 2022 February 19, 2022 I went to the Brooklyn Bird Club’s introduction to birdwatching walk in Prospect Park. View fullsize Red bellied woodpecker. I love that it can hold on at this angle. (Actually I love everything about red bellied woodpeckers.) My first red winged blackbird. View fullsize American robin having a snack. And a northern cardinal at the feeders. Comment"
year_published = 2023
year_updated = 2023
