title = "What can you see from here? — No Idea Blog"
description = "So there's a scene I love in the 1980 movie The Blues Brothers."
full_description = '''These are the slides from my SRECon 2024 plenary, What Can You See From Here?AbstractWhat you can see depends on where you stand. Your own context plays a big part in how you work, what you think is important, and how you interpret what's going on around you. Even your job title or team name can influence–and limit!–how you see the world. It's easy to find yourself stuck: no longer learning, polishing a service nobody else cares about, or wondering why it's so hard to get anything done outside your own team. A change in perspective can change what you think is important, how you influence the decisions that you care about, and even what you think is possible for yourself. In this talk, we'll look at how to get a broader view.SLIDES <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/ea96efdd-fde1-473a-b6c0-a52bdd5d1ce6/What+Can+You+See+From+Here+SRECon+March+2024+160.png" alt="What Can You See From Here SRECon March 2024 160.png" /> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/973dfbdc-3c4a-4c74-800d-4766738e79cc/What+Can+You+See+From+Here+SRECon+March+2024+161.png" alt=" So there's a scene I love in the 1980 movie The Blues Brothers. " /> So there's a scene I love in the 1980 movie The Blues Brothers. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/7a831579-4353-47a6-b32a-413afebe66ff/What+Can+You+See+From+Here+SRECon+March+2024+162.png" alt=" In the movie, Jake and Elwood–the Blues Brothers!–have had adventures and some really phenomenal musical numbers to get their band back together. But now they need a gig. So they walk into the first bar they find, and pretend to be the band that's p" /> In the movie, Jake and Elwood–the Blues Brothers!–have had adventures and some really phenomenal musical numbers to get their band back together. But now they need a gig. So they walk into the first bar they find, and pretend to be the band that's playing that night.Elwood asks: what kind of music do you usually have here?And the owner says: ohh we've got both kinds: we got country and western.And in the movie the bartender is kind of the butt of the joke. Which, fair, it's a great line. But even once they're aware of the context, Jake and Elwood still assume that the crowd will like their music. They launch into their regular blues set and of course it doesn't go well. Our protagonists can see the bubble that the bartender is in, but they can't see their own bubble. Until people throw beer bottles at their heads.So that's what I want to talk about today: noticing our own bubbles. Hopefully without anyone throwing beer bottles at our heads. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/8ce3fd65-219f-4880-8e57-a9831bc8b3e0/What+Can+You+See+From+Here+SRECon+March+2024+165.png" alt=" My name's Tanya.&amp;nbsp;I'm a senior principal software engineer at Squarespace, working on platforms these days. But I come from the SRE tradition and being at SRECon feels like coming home. I'm from Ireland, where you'll see these amazing little" /> My name's Tanya. I'm a senior principal software engineer at Squarespace, working on platforms these days. But I come from the SRE tradition and being at SRECon feels like coming home.I'm from Ireland, where you'll see these amazing little robins all over the place, but I lived in New York for 14 years–that's our friend the cardinal there. And then last summer I moved to Albuquerque where it turns out that these little dinosaurs are real things that stroll through your garden like it's no big deal. I'm still adjusting to roadrunners.I wrote this book last year, the Staff Engineer's Path, and I also host Lead Dev's Staff Plus conference, which runs in New York and London. Running a conference gives you a new perspective. It's very rewarding and I recommend it, but if you see an SRECon organizer, say thank you because it's a ton of work and they've done an amazing job.Finally, my kid tells me I should include her in my bio, so also: I have an extremely great kid. She doesn't look like this, but this is her sloth, whose name is Slof.Ok, question for the room: who likes getting into fights on the internet? Should you deploy on Fridays? How big should a microservice be? How much should a staff engineer code? What does “platform” mean? Let's argue!For each of these topics, you’ll find people who really really care about their answers to these questions. But why do they care about these topics rather than some other topics that are more important in the greater scheme of things? It’s because this is where they’re zoomed in. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/38960aff-663f-4957-a27c-4f01ed974871/What+Can+You+See+From+Here+SRECon+March+2024+166.png" alt=" Things that are relatively small but right in front of you can seem bigger than things that are huge but far away.&amp;nbsp;(The picture is from an Irish tv show called Father Ted. Ted is explaining to Dougal that the real cows off in the distance are" /> Things that are relatively small but right in front of you can seem bigger than things that are huge but far away. (The picture is from an Irish tv show called Father Ted. Ted is explaining to Dougal that the real cows off in the distance are actually much larger than the toy cow in his hand. Dougal is not getting it.)In tech we often talk about bikeshedding or, more formally, C Northcote Parkinson's Law of Triviality. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/c992c838-db82-4100-ab84-4f1336f99e21/What+Can+You+See+From+Here+SRECon+March+2024+167.png" alt=" Bikeshedding is the idea is that if you bring a plan for something huge–Professor Parkinson's example was an atomic power plant–people sort of assume you know what you're doing. But if you're building something much smaller, say a bikeshed, you will" /> Bikeshedding is the idea is that if you bring a plan for something huge–Professor Parkinson's example was an atomic power plant–people sort of assume you know what you're doing. But if you're building something much smaller, say a bikeshed, you will get tangled up in infinite arguments and discussions.The way we usually frame bikeshedding is that we say everyone likes to argue about the things that are easy, because the hard things are just too difficult to understand. But when I see bikeshedding in action in tech contexts, I’ve noticed that it’s usually something else: it’s not that the topics we zoom in on are easier, or at least not just that. It's that everyone wants to talk about the things in their own narrow field of expertise. We can see our own field really clearly and so we care.I only recently learned how “bikeshedding” became a common idiom in tech, and it's a beautiful thing. It was a thread on the FreeBSD mailing list in 1999. FreeBSD is a free and open-source Unix-derived operating system, and the FreeBSD community has a philosophy around engineering it and building it right. They want it to be good because they care. There had just been a big fight in the community about the behavior of the sleep command when given fractional seconds. And Poul-Henning Kamp sent an amazing email: <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/c4616be4-a117-4709-ab80-430b164e575f/What+Can+You+See+From+Here+SRECon+March+2024+168.png" alt=" He said: “it was a proposal to make sleep do the right thing if given a non-integer argument that set this particular grass-fire off.” And he said this particular argument received far more attention than most of the community’s real problems did. " /> He said: “it was a proposal to make sleep do the right thing if given a non-integer argument that set this particular grass-fire off.” And he said this particular argument received far more attention than most of the community’s real problems did. (I really recommend that you read the whole thing at bikeshed.com, by the way. It's a complete delight. )So why did people care so much? In general, why do we care so much about small changes in our own domains? I think it’s because we’re zoomed way in. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/d0d703cf-4530-40cd-829e-45efa5423296/What+Can+You+See+From+Here+SRECon+March+2024+184.png" alt=" Topics can be sort of fractal in complexity and interestingness: as you get up close, new elements and textures and features reveal themselves to you. Up close, I sort of think that everything is interesting and everything has a sort of weird be" /> Topics can be sort of fractal in complexity and interestingness: as you get up close, new elements and textures and features reveal themselves to you. Up close, I sort of think that everything is interesting and everything has a sort of weird beauty. The people who have taken the time to stare at the thing, well they see that beauty and so they start to really care. This is not just a tech thing! I was talking to an investment banker recently for example, and he was telling me about the differences between various financial instruments and the problems he was solving. And I felt like… this is not my area and I don’t really get it, but I can see that you love it and that you’re fascinated by it and I absolutely understand that feeling. I think that this fascination from zooming in also explains another phenomenon that C Northcote Parkinson pointed out: <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/51240bae-93c5-4b72-a14f-12d99622be81/What+Can+You+See+From+Here+SRECon+March+2024+170.png" alt=" He called it the modern malady of galloping orgmanship , the tendency of people in every team to always want to increase the number of staff on their team.&amp;nbsp;We get up close close close and so we see all the things that are possible, everythin" /> He called it the modern malady of galloping orgmanship, the tendency of people in every team to always want to increase the number of staff on their team. We get up close close close and so we see all the things that are possible, everything we could do and everything we could improve. And because those things are close to us, they seem as big as other work that is maybe more important, but further away. Teams almost never say "hey, you know what, we've achieved our P0 goals. We should give our headcount to another team." <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/d85c6d95-6827-44ed-aa5e-917a78fc176b/What+Can+You+See+From+Here+SRECon+March+2024+171.png" alt=" Getting up close can mean that we lose perspective on what we’re doing. We make local decisions based on what one team needs, even though it's worse for the broader group. We build completely daft machines because every group optimizes for their o" /> Getting up close can mean that we lose perspective on what we’re doing. We make local decisions based on what one team needs, even though it's worse for the broader group. We build completely daft machines because every group optimizes for their own piece and for making themselves maximally useful instead of looking at the whole system. And of course each team adds its own complexity to the broader system: everyone adds components and fallbacks and reliability features and so half the outages are caused by some of those features interacting badly or having a bad day. But we'd be in a much better place if someone stepped back and looked at the whole picture and optimized the whole thing, even if it meant removing their own team's part of it. Similarly, when we want to convince other people to do something, we're the Blues Brothers in the country and western bar: we play our regular tunes because they sound great to us and to the people who are just like us. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/40eda573-f589-49cf-9b64-ab6a3f815a9e/What+Can+You+See+From+Here+SRECon+March+2024+172.png" alt=" We say, “Come on, colleague in another department, let’s all upgrade our versions of a tool and config that you didn't even know you were using. It's a breaking change but it’s worth it! You need to upgrade your CI/CD system, maybe. Or we want you t" /> We say, “Come on, colleague in another department, let’s all upgrade our versions of a tool and config that you didn't even know you were using. It's a breaking change but it’s worth it! You need to upgrade your CI/CD system, maybe. Or we want you to move from opentracing to open telemetry. It will be better! For me! My life gets easier–the auto instrumentation is better. My team can turn off a system we hate maintaining!”And your colleagues in another orgs are just like, what…? <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/d14da734-b51b-4665-bb55-0bd275a65ccc/What+Can+You+See+From+Here+SRECon+March+2024+173.png" alt=" Your colleague’s reaction is, “That doesn't sound like a thing I care about” “It's great! I swear! You're going to get super wide cardinality span! You don't understand what that means but it will take literally five minutes to learn about it! Y" /> Your colleague’s reaction is, “That doesn't sound like a thing I care about” “It's great! I swear! You're going to get super wide cardinality span! You don't understand what that means but it will take literally five minutes to learn about it! You’ll love it!” <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/e7d56fdd-0703-4eeb-811f-5d8f0fb8612a/What+Can+You+See+From+Here+SRECon+March+2024+174.png" alt=" NOPE. Your colleague is like, “look, I need to do my taxes on time and floss and be anxious about whatever was on the news today. I need to parse the ten page email I got from my kid's school to understand whether it's closed for Norwegian constitut" /> NOPE. Your colleague is like, “look, I need to do my taxes on time and floss and be anxious about whatever was on the news today. I need to parse the ten page email I got from my kid's school to understand whether it's closed for Norwegian constitution day or whatever's happening this week. Also I have a day job and OKRs which are not about refactoring my drones or whatever thing you just told me about.”We need to play a different song that relates to their context, not ours. Otherwise. Once more…. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/06ae99d0-1e3b-4c85-8660-f5b9f1e4cf62/What+Can+You+See+From+Here+SRECon+March+2024+175.png" alt=" NOPE! I think it's funny how easily we can miss that our local experience might not match everyone else’s, because in other contexts, we're really good at it! " /> NOPE!I think it's funny how easily we can miss that our local experience might not match everyone else’s, because in other contexts, we're really good at it! <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1654c19f-e96e-4d68-8772-13e6f0d7a060/'''
