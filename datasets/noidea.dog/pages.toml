["https://noidea.dog/continuous"]
title = "Continuous — No Idea Blog"
full_description = '''View fullsize Image: Animated gif showing the view out the window of a sleeper car on the Lakeshore Limited train from New York to Chicago. The Hudson River and another set of tracks are going by outside. The sky is blue and has fluffy clouds. Damn, I want to be on a train right now. These are the slides from my Continuous Lifecycle London keynote.AbstractContinuous integration. Continuous deployment. Continuous delivery. We’re moving as fast as we can, but are we going in the right direction? In this talk, we’ll discuss why “But why?” is the most important question you can ask along the way, and look at some of the detours and roadblocks that can hinder your journey: vestigial infrastructure, migrations that never end, and the kinds of technical debt that can DDoS a whole organisation.More than that, we’ll ask the big questions: Why are we doing any of this? Why are we all here? What are we for?By adding continuous introspection (and a little existential angst) to the continuous lifecycle, we can go faster, better.SLIDES <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671123854-LEH09GL4BFVD8XUDRBGL/Slide1.png" alt=" Hello! " /> Hello! <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671124735-L6ZW4TZ6SBN5EN7T5YQI/Slide2.png" alt=" We live in a busy world. There is a lot we can choose to do. And right now you’ve chosen to come to a conference (or you haven’t, but you’re just reading this slide deck! Thanks for being here either way!). I think that can be difficult for a lot " /> We live in a busy world. There is a lot we can choose to do. And right now you’ve chosen to come to a conference (or you haven’t, but you’re just reading this slide deck! Thanks for being here either way!).I think that can be difficult for a lot of us to step away from whatever we're creating or whatever we're debugging, and do something else for a couple of days. Disconnecting feels weird. It feels unproductive. But this is a talk about being deliberate. Sometimes you need to deliberately slow down a bit so that you go faster in the long run. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671126545-1SWIMC2YKCOBCD3DRX7V/Slide3.png" alt=" It's unusual in our industry to say to slow down. We like going fast! We are all bias towards action, agile, move fast and break things! We call things names like Swift and SPDY and Velocity. We put our rubies onto rails! In the time I've been stan" /> It's unusual in our industry to say to slow down. We like going fast! We are all bias towards action, agile, move fast and break things! We call things names like Swift and SPDY and Velocity. We put our rubies onto rails!In the time I've been standing here, three javascript frameworks have been born, lived full beautiful lives and faded into obscurity! That's our industry.And this conference is called Continuous Lifecycle. We are all about moving, all about speed.And, let's be clear, that's good. According to... <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671129808-X0PPOZWAI6KR6Q2CMWZ0/Slide4.png" alt=" ...the State of DevOps report (which I recommend reading) high performing teams do move quickly. The report says that highest performing companies deploy 46 times as often as the lowest performing. They can push in under an hour and roll back re" /> ...the State of DevOps report (which I recommend reading) high performing teams do move quickly. The report says that highest performing companies deploy 46 times as often as the lowest performing. They can push in under an hour and roll back really quickly.There's a ton of advantage and flexibility to being able to move quickly. You can respond to things your customers want. You can take small risks, secure in the knowledge that you can recover quickly if there's a mistake. It's great to be able to go fast. So long as you’re going in the right direction.But if you’re going in the wrong direction, going fast just makes you wronger. As Peter Drucker famously said.. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671135473-TVCBKDJIV1GATRQ7S7MB/Slide5.png" alt=" …there's nothing so useless as doing efficiently that which should not be done at all. Sometimes we need to slow. down. and think really hard about where we're going and what we're doing on the way. Sometimes we need to step outside the continu" /> …there's nothing so useless as doing efficiently that which should not be done at all.Sometimes we need to slow. down. and think really hard about where we're going and what we're doing on the way. Sometimes we need to step outside the continuous: we need to do things in a slower and less obvious way, so that we go faster and better in the long run. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671156453-VMQRBKFMY4EPNPP95NYA/Slide6.png" alt=" Hello! My name is Tanya and I'm a principal software engineer at Squarespace in New York. We have offices in Portland and Dublin as well by the way (and we’re hiring everywhere ) and if you're in Dublin we host a great semi-regular SRE meetup . " /> Hello! My name is Tanya and I'm a principal software engineer at Squarespace in New York. We have offices in Portland and Dublin as well by the way (and we’re hiring everywhere) and if you're in Dublin we host a great semi-regular SRE meetup.I'm whereistanya on twitter and github, and I blog about tech and organisational stuff here at noidea.dog, which is, of course, a Squarespace site :-)And I really love going places on trains. The last time I was in London, for example, I was actually on the way from Dublin to Glasgow. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671155281-JLZ3OIA9GU4M3Z8B4GIE/Slide7.png" alt=" I flew in to Heathrow, had a bit of extra time so I went to see the Magna Carta at the British Library for an hour, and then I got on the Caledonian sleeper (which is a lovely train, by the way). You might point out that Dublin to Glasgow, is a " /> I flew in to Heathrow, had a bit of extra time so I went to see the Magna Carta at the British Library for an hour, and then I got on the Caledonian sleeper (which is a lovely train, by the way).You might point out that Dublin to Glasgow, is a direct flight which is shorter than the flight from Dublin to London and much shorter than the train from London to Glasgow, so a reasonable question would be "why?" and the answer of course would be... <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671156651-QGZ2YR6P4KPJGHCRFNAL/Slide8.png" alt=" …because trains! I do that a lot: I go somewhere out of my way just so I can spend a bunch of time on a train. It's so peaceful. I love the way it forces me to take a bunch of time where I can't do my regular, continuous day to day things. But i" /> …because trains!I do that a lot: I go somewhere out of my way just so I can spend a bunch of time on a train. It's so peaceful. I love the way it forces me to take a bunch of time where I can't do my regular, continuous day to day things. But it's not downtime. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671157756-SVWL7QKPRVPVZ8F2HOFD/Slide9.png" alt=" On trains I am more productive: I write better, I code better, I can think thoughts I just wouldn't have had otherwise. All because I'm forced to slow down. Going to Glasgow by train via London took a bit longer. But I still arrived at the place I" /> On trains I am more productive: I write better, I code better, I can think thoughts I just wouldn't have had otherwise. All because I'm forced to slow down.Going to Glasgow by train via London took a bit longer. But I still arrived at the place I needed to be at by the time I needed to be there, I got more done on the way, and I got to see the Magna Carta.Ok, why am I talking about trains. A lot of the talks at any conference are about how to go fast. (And, again, that's excellent and you should do that.) But this one's going to do the opposite. We're going to talk about some things we only get to do if we go a little slower. We're going to think outside the continuous and outside the quickest way to get to somewhere.The talk's not going to take the most direct route either. We'll wander a bit and take some diversions. We'll still get where we're going on time, but hopefully see some interesting things along the way. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671157768-NFZ8IORCWOZ0K7GS6ATO/Slide10.png" alt=" Here's a rail map for where we're going to go today. We're going to start by figuring out where we're even going. Where do we want to be? How do we think about that? Then we'll get distracted by something shiny, which will seem to get us closer" /> Here's a rail map for where we're going to go today. We're going to start by figuring out where we're even going. Where do we want to be? How do we think about that?Then we'll get distracted by something shiny, which will seem to get us closer to our goal, but ultimately slow us down.Then we'll stop and look at a few things that we can only do if we take a little longer to get where we're going, little station stops that slow us down in the moment, but that ultimately make us faster, and happier.We'll get very briefly existential… it will be alarming! But we will find our way back out of there, and finally arrive at a destination of some sort! Which we'll choose in a minute when we ask…. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671158601-SA3Q1EOS65HDZEIOVJIW/Slide11.png" alt=" …what do we want out of our work? Where do we want to go? " /> …what do we want out of our work? Where do we want to go? <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671158620-OCPRFOD2AH2O3XME528X/Slide12.png" alt=" So I work in infrastructure, and I'm sometimes jealous of my friends in product type organisations, because I feel like this is well covered for them. " /> So I work in infrastructure, and I'm sometimes jealous of my friends in product type organisations, because I feel like this is well covered for them. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557671158962-1OQJ3UYHMK0GS1U1UBOU/Slide13.png" alt=" Product managers say &quot;We should make this thing!&quot; and then everyone works together to make the thing and later the thing launches and there's an ice cream party to celebrate the launch. (If product orgs don't work exactly like that, don't spoil " /> Product managers say "We should make this thing!" and then everyone works together to make the thing and later the thing launches and there's an ice cream party to celebrate the launch.(If product orgs don't work exactly like that, don't spoil my illusions by telling me.) <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557751832370-RQ6D770MN9880A05QTWC/Continuous+%2810%29.png" alt=" We usually don't really have product management in infrastructure or SRE or release engineering or other orgs who are mostly facing internal customers, and I think it's a huge loss. We don't have this regular powerful check in for &quot;Who are our custo" /> We usually don't really have product management in infrastructure or SRE or release engineering or other orgs who are mostly facing internal customers, and I think it's a huge loss. We don't have this regular powerful check in for "Who are our customers? Are they happy? What do they actually want?" Infrastructure goals are often more like "just… continually make everything better?". And continuous improvement is great, but it's hard to feel like you ever get to a party type of a place.In the absence of product management, I think it's worth figuring this ourselves. Where do we want to get to? What are big goals we can choose for ourselves? <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557676148802-HA1LSZJQU7AHO6MIOQV9/Continuous.png" alt=" There's this metaphor I like. Remember the game Civilisation? It was released in 1991 and has had lots of different releases since then. The idea was that you would be a civilization, and you'd start at prehistory with very primitive skills and tech" /> There's this metaphor I like. Remember the game Civilisation? It was released in 1991 and has had lots of different releases since then. The idea was that you would be a civilization, and you'd start at prehistory with very primitive skills and technologies. But as you'd go along, each turn you'd get to build things or improve your cities or interact with other civilizations.There were a bunch of different ways to win, like you could win by military conquest -- you'd kill everyone who wasn't on your team -- or you could win by building a spaceship, which I think is a much cooler way to win at society.The whole way through the game, you'd get to research technologies. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557676311107-RLKJ9LD9LH5005JR4H8M/Continuous+%281%29.png" alt=" But you couldn't just jump ahead and research spaceships, you'd have to first of all learn sailing and pottery and the mysterious and secret art of writing stuff down and so on; Then you could build on that until, near the end, you'd research spac" /> But you couldn't just jump ahead and research spaceships, you'd have to first of all learn sailing and pottery and the mysterious and secret art of writing stuff down and so on; Then you could build on that until, near the end, you'd research space travel. I haven't played in a long time so I don't know what the research tech tree is like in recent games. You can probably research blockchain and, like, serverless now, I don't know.I always think of that tech tree when people talk about the stuff they want to do. Because a lot of the time, you're not working on a project for the sake of the project. You're working on it for the thing it unlocks. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557676443836-TWCMV0YN1ALV9AYQXBR2/Continuous+%282%29.png" alt=" Say you’re working on Physics. Physics is cool, you know? You drop things, they fall down. How fast does it fall down? Wooo let's find out with physics! But it's hard to explain to someone who doesn't already think it's cool. &quot;Ok, but how does it ma" /> Say you’re working on Physics. Physics is cool, you know? You drop things, they fall down. How fast does it fall down? Wooo let's find out with physics! But it's hard to explain to someone who doesn't already think it's cool. "Ok, but how does it make my life better?" "PHYSICS!"But if you tell them you need physics so that you can get steam engines... <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1557676312'''
