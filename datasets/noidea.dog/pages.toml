["https://noidea.dog/tipperary"]
title = "Tipperary — No Idea Blog"
full_description = "June 24, 2024 June 25, 2024 Lots of good stuff from the last few days. I saw the male hen harrier, which is always a treat. After a few years of coming here, my brain is finally trained to notice a distant white dot moving against the landscape. The female is brown and I still can’t pattern-match her at a distance, but if she’s overhead my “raptor!” signal kicks in at least.Yesterday J, Ms 11 and I went out to look at the pair of little fields we call the secret orchard. It’s a lovely little enclosed area, getting smaller and more enclosed as new baby blackthorn trees spawn out from the hedges. There’s so much blackthorn, and there’s a good amount of elder and rowan at the edges too. If the deer had a predator I think the secret orchard would rapidly become a secret tiny forest. (“Rapidly” being a relative thing when you’re talking about growing trees.) I found a dog rose, which is also always a treat and, hiding away in a corner, there’s broom, a plant I haven’t seen here before. View fullsize View fullsize Behind the secret orchard is a three-room tumbledown cottage. When we got here it was absolutely infested in (invasive, horrible) cherry laurel and (tree-farm escapee) Sitka spruce, and neighbouring cow intrusions had made the ground mucked up and sludgy. Last year we got it all fenced off and had the unwelcome plants removed, and it’s dried out really nicely. The laurel’s coming back already though. We need to murder it better.I spent some time cautiously poking around in the room that still has half a roof, and it reminded me of a point and click adventure where there are a few interesting items to find but it takes a while to notice them.Up high on a windowsill: there’s a rusted hair clippers! Under fallen roof tiles: two lovely red window shutters. I’d love to keep them if we can, but the wood feels pretty fragile.Sticking out from a pile of wood: it’s a copy of the Irish Farmer’s Journal from September 30th, 1960! I have no idea how it lasted this long but it’s already crumbling, so I need to photograph the pages fast. View fullsize Outside the house there were lots of birds: chaffinches, wrens, siskins, robins, blackcaps, and Merlin heard a treecreeper. That’s the second time it’s told me about one around here, but I’ve only seen them in Dublin. I’d love to see one here. Ms 11 found a big brown scarab beetle (improbably called a cockchafer) and J found a deer antler, which I took home to put in the Collection Of Interesting Things. It’s now nestled in beside the piece of wasps nest, the birds nest, the buzzard feather, and the various old bottles that have shown up around the place. Two shelves of an IKEA Billy bookcase so far, and the rate of Interesting Things to find doesn’t seem to be slowing down.In the evening, Ms 11 and I went to explore the drowned sitka trees in “umbellifer heaven” below the house and see how many trees we want to mark for keeping. I’d expected one, maybe two, but the sitkas were a good nursery and there’s a bunch of great stuff growing in amongst them: a baby hawthorn, at least three nice elder trees, and a sycamore that’s big enough to be worth keeping. (Sycamores are an introduced species, grow super fast, and are kind of weeds, but I appreciate them as agreeable shade trees.) Also, at least two of the sitkas turned out to actually just be surprisingly healthy branches coming off a massive fallen tree. The fallen tree has lots of tangled limbs and interesting climbable bits and Ms 11 immediately scrambled up on it. If we clean up around it and remove the spikier parts, I think it’d be a pretty great play structure. So that’s a fun project that we’ll try to get some time for this summer. Comment"
