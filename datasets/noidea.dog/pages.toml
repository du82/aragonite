["https://noidea.dog/glue"]
title = "Being Glue — No Idea Blog"
description = "You know that thing where everyone on a software engineering team turns up and just writes code for eight hours a day and then later the project is successful? No you don't. Projects don’t work like that! Of course coding is an important skill in a software engineering team. But there are a ton of other skills that we need to bring to work every day. Skills that can mean the difference between a project that succeeds and one that fails."
full_description = '''Talk Abstract:Your job title says "software engineer", but you seem to spend most of your time in meetings. You'd like to have time to code, but nobody else is onboarding the junior engineers, updating the roadmap, talking to the users, noticing the things that got dropped, asking questions on design documents, and making sure that everyone's going roughly in the same direction. If you stop doing those things, the team won't be as successful. But now someone's suggesting that you might be happier in a less technical role. If this describes you, congratulations: you're the glue. If it's not, have you thought about who is filling this role on your team?Every senior person in an organisation should be aware of the less glamorous - and often less-promotable - work that needs to happen to make a team successful. Managed deliberately, glue work demonstrates and builds strong technical leadership skills. Left unconscious, it can be career limiting. It can push people into less technical roles and even out of the industry.Let's talk about how to allocate glue work deliberately, frame it usefully and make sure that everyone is choosing a career path they actually want to be on.Slides: <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571242034-0NOXV4VRXO9ATV7ZNH3P/Slide1.jpeg" alt=" You know that thing where everyone on a software engineering team turns up and just writes code for eight hours a day and then later the project is successful? No you don't. Projects don’t work like that! Of course coding is an important skill in " /> You know that thing where everyone on a software engineering team turns up and just writes code for eight hours a day and then later the project is successful? No you don't. Projects don’t work like that! Of course coding is an important skill in a software engineering team. But there are a ton of other skills that we need to bring to work every day. Skills that can mean the difference between a project that succeeds and one that fails. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571242404-7HWDW1RF7YLKF9X6WSB0/Slide2.jpeg" alt=" Like noticing when other people in the team are blocked and helping them out. Or reviewing design documents and noticing what's being handwaved or what's inconsistent. Or onboarding the new people and making them productive faster. Or improving proc" /> Like noticing when other people in the team are blocked and helping them out. Or reviewing design documents and noticing what's being handwaved or what's inconsistent. Or onboarding the new people and making them productive faster. Or improving processes to make customers happy. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571242267-8UTYMLXFN6I61TPAORE1/Slide3.jpeg" alt=" I call all of this glue work. It's technical leadership, so we do get some signal for it on leadership interviews for senior engineers. But sometimes a team ends up someone who isn't senior, but who happens to be good at this stuff. Someone wh" /> I call all of this glue work.It's technical leadership, so we do get some signal for it on leadership interviews for senior engineers.But sometimes a team ends up someone who isn't senior, but who happens to be good at this stuff. Someone who acts senior before they're senior. This kind of work makes the team better -- there's plenty of it to go around. But people aren't always rewarded for doing it. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571242415-C9118O09NUMGPP1T19SA/Slide4.jpeg" alt=" In fact, doing glue work too early can be career limiting , or even push people out of the industry. It's ironic. We lose good engineers because they happen to also be good at other skills we need. " /> In fact, doing glue work too early can be career limiting, or even push people out of the industry.It's ironic. We lose good engineers because they happen to also be good at other skills we need. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571242771-HRNVVXR04APN202L8O0W/Slide5.jpeg" alt=" Hello, my name's Tanya and I'm a principal software engineer at Squarespace. I'm whereistanya on twitter and github and I blog here at noidea.dog , which is of course a Squarespace site. And today I want to talk about glue. " /> Hello, my name's Tanya and I'm a principal software engineer at Squarespace. I'm whereistanya on twitter and github and I blog here at noidea.dog, which is of course a Squarespace site.And today I want to talk about glue. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571242826-DKXOP02IL3IVO5BCUXHQ/Slide6.jpeg" alt=" Here's our agenda: 1) I'm going to tell a story of someone whose career is hurt by glue work. It's not exactly a true story but it's a lot of true stories combined. I've given this talk a few times now and I've had so many amazing emails from peopl" /> Here's our agenda:1) I'm going to tell a story of someone whose career is hurt by glue work. It's not exactly a true story but it's a lot of true stories combined. I've given this talk a few times now and I've had so many amazing emails from people who’ve told me this was their story too.2) Then we're going to talk about fairness, both in the outcome of the story and in how work is distributed3) Then we're going to talk about whether and when to leave the IC engineer track and become a people manager, product manager, etc. I imagine a lot of people reading this have grappled with this decision at some point. There are a lot of opinions on how to make it and I'll give you one more :-)4) Then how to frame your work if you've been doing a lot of glue, and how to makes your impact visible. Or how to help your coworkers or reports do the same thing.5) And finally, I want to talk about learning and growing, which is something I don't think our industry talks about enough.Ok, story time. Imagine a software engineer.... <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571242884-7I315JKOQ73RSB4WSSZK/Slide7.jpeg" alt=" Here she is, first day in a new team. She's been out of college a few years, had her first couple of tech jobs. She's not wildly confident in her skills, but likes the work. " /> Here she is, first day in a new team. She's been out of college a few years, had her first couple of tech jobs. She's not wildly confident in her skills, but likes the work. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571242941-1AQIALBNY0AIDT3HU1FK/Slide8.jpeg" alt=" The new codebase is very hairy and her first changes take a long time. This is normal, but everyone's busy with their own stuff and nobody's reassuring her. She feels like she's working too slowly, needing too much help. After a few weeks, she’s afr" /> The new codebase is very hairy and her first changes take a long time. This is normal, but everyone's busy with their own stuff and nobody's reassuring her. She feels like she's working too slowly, needing too much help. After a few weeks, she’s afraid they regret hiring her. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243049-1OO5B761DE9GRJM3C85R/Slide9.jpeg" alt=" Then she gets her first win. A customer comes in with a request: they want data that the API really should be able to provide but the team hasn't prioritised this feature yet. Our friend here spends a couple of days manually getting the data the cus" /> Then she gets her first win. A customer comes in with a request: they want data that the API really should be able to provide but the team hasn't prioritised this feature yet. Our friend here spends a couple of days manually getting the data the customer needs. The customer is overjoyed.She documents how to get that data, and some answers to other questions the team gets asked a lot on slack. The team stops getting so many interruptions. The customers are happy; the other software engineers are happy.Ok, back to that difficult code. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243102-0F71N8LRWNGBY4A0LH8T/Slide10.jpeg" alt=" A while later, she gets talking with people on a nearby team. They seem to have a different idea of what problem they're all solving and they're going in a different direction. She sets up a meeting with System Designer on her team and asks a lot of" /> A while later, she gets talking with people on a nearby team. They seem to have a different idea of what problem they're all solving and they're going in a different direction. She sets up a meeting with System Designer on her team and asks a lot of questions. The thing changes direction. Now they're working together and building something better. She takes notes at the meeting and sends them around to make sure everyone has a shared understanding of what got agreed. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243260-JNFABMLVYCDW3K3FZ38L/Slide11.jpeg" alt=" New people join the team. She remembers her difficult first few weeks and writes a bunch of onboarding documents. She sets up a mentorship program, so all new people will get a mentor from now on. " /> New people join the team. She remembers her difficult first few weeks and writes a bunch of onboarding documents. She sets up a mentorship program, so all new people will get a mentor from now on. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243330-7BFJ1BIQWIYB7QKJR1G5/Slide12.jpeg" alt=" The company keeps having outages, and they’re often attributed to lack of tests in the codebase. She gathers a bunch of senior people and keeps pushing until they agree on coding standards for the whole organisation. All code will be more tested, mo" /> The company keeps having outages, and they’re often attributed to lack of tests in the codebase. She gathers a bunch of senior people and keeps pushing until they agree on coding standards for the whole organisation. All code will be more tested, more readable and more reliable now. There are fewer rollbacks. Code review gets faster because the code's in a consistent style. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243382-URC5VE0G1QVHAJ2AQCJK/Slide13.jpeg" alt=" The manager has a bunch of teams and is starting to rely on Engineer to know what's going on with this one. Hey, Awesome Coder seems blocked. Do you know what the deal is? Our Engineer investigates, discovers that Awesome Coder needs information fr" /> The manager has a bunch of teams and is starting to rely on Engineer to know what's going on with this one. Hey, Awesome Coder seems blocked. Do you know what the deal is?Our Engineer investigates, discovers that Awesome Coder needs information from another team but is mired in a three week long email thread. She talks to some people in real life, figures out what the confusion is, sorts it out. Awesome Coder is unblocked. He says thank you, writes thousands of lines of code. Since she now has a lot of state on the project, our Engineer writes his documentation and launch plan. The thing ships on time.Well done Awesome Coder, says everyone.Two years pass like this. Engineer keeps vowing that she will write more code soon…. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243529-QER63NW438SLK73CM1OU/Slide14.jpeg" alt=" ….but every day, something more important comes up. They team has started to treat her as an unofficial lead. She has a broad view of everything that's going on and can spot the negative space between the designs and point out extra things that need" /> ….but every day, something more important comes up. They team has started to treat her as an unofficial lead. She has a broad view of everything that's going on and can spot the negative space between the designs and point out extra things that need to happen. She has 1:1s with everyone. She's mentoring all the new people.When she does have free time, it's an hour or two between meetings. The idea of swapping the code into her brain for two hours and then going to a meeting is really painful.She's not worried though, because everyone tells her how great her work is. She always gets glowing performance reviews. In fact she feels like she's gone up a level. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243579-EBH9LAZP4K8SWJAJEX7Z/Slide15.jpeg" alt=" Let's see if her company's promotion process agrees. Who should we promote? " /> Let's see if her company's promotion process agrees. Who should we promote? <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243643-02YLW2ASCPNE3SYIZLW3/Slide16.jpeg" alt=" Well, obviously the person who wrote all that code! Well done Awesome Coder! " /> Well, obviously the person who wrote all that code! Well done Awesome Coder! <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243743-MOTZWFPCKEJ9XNQ2V36F/Slide17.jpeg" alt=" And the person who did the design for the thing, and made it integrate so well with the stuff they were building in the other team! Well done, System Designer! Aaaaaand…. " /> And the person who did the design for the thing, and made it integrate so well with the stuff they were building in the other team! Well done, System Designer!Aaaaaand…. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243889-CRM3XXM17PHNT981SXPW/Slide18.jpeg" alt=" …that’s it. Wait, what? " /> …that’s it.Wait, what? <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571243950-PSE32V6ETNEOV9VXR4FU/Slide19.jpeg" alt=" Why not me? " /> Why not me? <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571244009-B6N1E216LCIY5T4ZTNTY/Slide20.jpeg" alt=" Your project isn't finished. You're not producing much code. You didn't have enough impact yet. " /> Your project isn't finished. You're not producing much code. You didn't have enough impact yet. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571244069-DW9QL500CGQY250JYL3I/Slide21.jpeg" alt=" But I decreased onboarding time. " /> But I decreased onboarding time. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571244145-ZGR7DW93XDFGFJNVG2OE/Slide22.jpeg" alt=" I noticed that we were building the wrong thing and made us change course. " /> I noticed that we were building the wrong thing and made us change course. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1556571244279-7ZKHVJ7RE2ULE9NX6TJ1/Slide23.jpeg" alt=" Our customers say I'm the only person who helps them. " /> Our customers say I'm the only person who helps them. <img src="https://images.squarespace-cdn.com/content/v1/5a05'''
