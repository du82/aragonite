full_description = "A grab-bag of advice for engineers March 3, 2018 jtr occasionally interviews people to collect the history of SRE at Google, and I did one recently. Most of it isn't relevant outside the Goog, but he ended on general questions about advice for engineers, so I'm posting that here. Here's my version of the sunscreen song. Read More In conversations Tags leadership, engineering Comment Conversation with Ms 4 January 4, 2017 Me: “How was your day?”Ms 4: “Did you know two threes is the same as three twos?” Read More In conversations Tags code, kid Comment Conversation with Ms 3 March 2, 2016 “Why you didn’t write code?” Read More In conversations Tags code, kid Comment Consistent Fears October 8, 2015 I gave a talk at NYU on Monday. Good questions during and in 1:1s afterwards, but what really struck me was the consistent themes in what the students (it was a women in computing group) were absolutely terrified of: Read More In conversations Comment"
