["https://noidea.dog/maybe-great"]
title = "Maybe Great — No Idea Blog"
description = """
You have a great idea for a software project. But… will it work? Is it 
actually a great idea?"""
full_description = '''BACKGROUNDThis is a talk called “The Maybe Great Idea”, originally written for Etsy’s Code As Craft speaker series. TALK AbstractYou have a great idea for a software project. But… will it work? Is it actually a great idea? Are you sure that there aren't huge risks you're not seeing that could cause the design to be torpedoed at the last minute? Could other people be quietly solving the same problem? It sure would be nice if your organisation could endorse the idea and say yes, absolutely, do it!Once an engineering org has more than a few people, making big decisions can be hard. Often there are lots of people who can say no to an idea, but it's hard to find anyone to definitively say yes. So how do we make it easy for people with good ideas to get support and get started?In this talk I'll tell you about our journey from the popular #YOLO method of software development, through writing RFC (Request for Comment) design documents, writing better RFCs, reviewing designs as a massive terrifying group, reviewing designs in secret smoky rooms, finding a balance that made us happy, and accidentally building a community along the way. It's a journey we're glad we've taken, and it can work for other people too.CREDITSThe emoji came from emojipedia.com! I love that site. Thank you Rebecca Sliter, Katie Sylor-Miller, Gordon Radlein and Sarah Milstein for reviewing! Thank you Eva Parish for “You have a great idea. Is it actually a great idea?”, which is succinct and perfect. Thank you Alex, Andrew, David, Gabe, Johnathan, Karim, Regan, Shane and Tom who came to the dry run of this talk and gave me excellent advice. And of course thank you Trish for the project.Thanks to Biz for making amazing slides (I hope she will at some point share her Facts About Animals deck. You will all learn so much!) and to Joel for being hilarious about Herman Melville and both of them for putting up with me spending every moment tweaking slides for the last couple of months. LINKSSee also https://noidea.dog/blog/yes-if, the blog post that inspired this talk. I also have opinions about RFCs at https://noidea.dog/blog/design-documents and https://noidea.dog/blog/nobody-could-have-predicted-that.TWEETS Etsy was proud to host @whereistanya as our @codeascraft speaker with our very own @ksylor moderating. Awesome lessons from her work using RFC design documents. pic.twitter.com/DprhErOVMF— Mike Fisher (@MikeFisher_Fish) December 4, 2019 Y’all, tonight I got to listen to @whereistanya dropping knowledge and then have a conversation with her and it was awesome! Very excited to share the video when it’s ready! pic.twitter.com/Qx8y2RufeO— Katie Sylor-Miller (@ksylor) December 4, 2019 SLIDES <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321802415-A0FM2L6K0Q2UO33W3TZ3/image1.jpg" alt=" " /> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321680769-V2G5RAYJ52LE023AN4BA/image2.jpg" alt=" Say there’s a technical problem you want to solve. You think a lot about how to solve it. " /> Say there’s a technical problem you want to solve. You think a lot about how to solve it. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321844054-FWKITFMCV214OB77IKUP/image3.jpg" alt=" And over time, your thoughts start coming together and finally you think you know exactly how to do it. You have an idea. " /> And over time, your thoughts start coming together and finally you think you know exactly how to do it. You have an idea. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321878950-LEG7IVOBWR582SSIR4O1/image4.jpg" alt=" It might even be a great idea! You have this whole design in your brain. What happens next? You could just build it. " /> It might even be a great idea! You have this whole design in your brain. What happens next?You could just build it. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321947955-WRLGPBIIGEV4XU6RJUEJ/image5.jpg" alt=" I've seen people do this, go off in a corner for a month or a quarter and churn away at their idea, refining it and creating it. When you emerge at the end of that time, then you get to show other people what you've made. " /> I've seen people do this, go off in a corner for a month or a quarter and churn away at their idea, refining it and creating it. When you emerge at the end of that time, then you get to show other people what you've made. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321948142-UYXKCWY6ZTHKWRHI58OI/image6.jpg" alt=" You tell your potential users, other teams, people whose software you might want to integrate with… " /> You tell your potential users, other teams, people whose software you might want to integrate with… <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321554989-OP44X8IYY5MRIJNQG3EM/image7.jpg" alt=" …and maybe all of those people love it! Maybe it's exactly solved their problems too. But what's more likely is that someone will say... " /> …and maybe all of those people love it! Maybe it's exactly solved their problems too.But what's more likely is that someone will say... <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321554904-X4JPHSMPO0MRIEO9TI7Q/image8.jpg" alt=" “This doesn't quite fit my use case.&quot; " /> “This doesn't quite fit my use case." <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321555459-6ZGJ9JRQ74E9QAP00MNE/image9.jpg" alt=" “I don't get why this is useful? Why did you spend time on it?” " /> “I don't get why this is useful? Why did you spend time on it?” <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321555529-5C1X6S3GMH1KJT9ZI7NM/image10.jpg" alt=" Or “I just built something really similar!” " /> Or “I just built something really similar!” <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321556034-ZL5K1JRLE7EBXPXQ8RYY/image11.jpg" alt=" One approach to avoid this situation is, back when we're at the point of knowing what we want to build, we write it all down. There are a bunch of names for this kind of document but for this talk I'm going to call it an RFC because that's what we c" /> One approach to avoid this situation is, back when we're at the point of knowing what we want to build, we write it all down. There are a bunch of names for this kind of document but for this talk I'm going to call it an RFC because that's what we call it at Squarespace and I've finally, after coming up on two years, trained myself out of saying "design document", which is what we called it at Google.RFC stands for Request For Comments. And it is a request for comments. You might not always like the comments you get. But we'll get to that. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321556058-M2BLROZD35QAF456C1L9/image12.jpg" alt=" For now, let's say that an RFC is a way of explicitly saying... &quot;Here's what I want to do!&quot; Here's why I want to do it. Here's when I think it will be done. We send it to other people and ask for their review. " /> For now, let's say that an RFC is a way of explicitly saying..."Here's what I want to do!"Here's why I want to do it.Here's when I think it will be done.We send it to other people and ask for their review. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321556566-8D0KZ0XPTU3CL6DFTBS0/image13.jpg" alt=" And they look at the goals, and decide if they think those are good goals. And they look at the plan and decide if they think that's a good plan. And they look at the timeline and decide if they think that's a good timeline. And they t" /> And they look at the goals, and decide if they think those are good goals.And they look at the plan and decide if they think that's a good plan.And they look at the timeline and decide if they think that's a good timeline. And they tell you.And then you incorporate their comments and build the system, right? <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321556593-8EBBGQQFIU8MPQKBYZEO/image14.jpg" alt=" And everyone is happy? The end. So I think writing RFCs is amazing and great, but I also think the process of turning a maybe great idea into a reality is more complicated than that and we should talk about why. But I should get my bio out of the" /> And everyone is happy? The end.So I think writing RFCs is amazing and great, but I also think the process of turning a maybe great idea into a reality is more complicated than that and we should talk about why. But I should get my bio out of the way first. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321557978-80PM0JM5QDSWPR5MHN4E/image15.jpg" alt=" Hi! My name's Tanya. I'm a principal engineer at Squarespace which has its headquarters here in lovely New York City! Squarespace, as you'll know if you ever heard a podcast, is the all in one platform for domains, websites, online stores, and mark" /> Hi! My name's Tanya. I'm a principal engineer at Squarespace which has its headquarters here in lovely New York City! Squarespace, as you'll know if you ever heard a podcast, is the all in one platform for domains, websites, online stores, and marketing tools! We're hiring! I'm whereistanya on github and twitter and I blog (here!) at noidea.dog, which is of course a Squarespace site. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321558899-WMLBPFAFNEEABTCBGRBY/image16.jpg" alt=" Before I go back to talking about RFCs, I want to take a moment to acknowledge my domain bias which is that I've been an infrastructure/backend person for most of my career. While I have worked with wonderful product folks and mobile folks and front" /> Before I go back to talking about RFCs, I want to take a moment to acknowledge my domain bias which is that I've been an infrastructure/backend person for most of my career. While I have worked with wonderful product folks and mobile folks and frontend folks, that's not where my experience lies.While this talk will look at how an organization agrees that someone should go ahead with a design, I will not be able to say intelligent things about how to collaborate with product managers and designers, or what kind of scaffolding and process is useful for making that smooth.But, can we agree that, wherever in the stack we sit, we have a lot in common? For example, we all want to work on good and useful things that other people want to use? Let’s agree on that. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321560442-B6ZY5U5QHL6TZNB4VV76/image17.jpg" alt=" So my job's a bit weird, because I was hired as the first principal engineer at Squarespace and I had to figure out what that meant. Now that I've been doing this job for 20 months or so, I've come to the conclusion that whatever I end up doing on a" /> So my job's a bit weird, because I was hired as the first principal engineer at Squarespace and I had to figure out what that meant. Now that I've been doing this job for 20 months or so, I've come to the conclusion that whatever I end up doing on any given day is probably my job. But when I first joined in March of last year, the guidance I had was to "solve the big cross-team problems". Which, btw, is the best job and I recommend it. I *love* solving big cross-team problems.So in my first week of the job, I was getting to know people, learning systems, looking around for problems to solve. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321559459-6F1TIA1K0C2EQ5QTTT2T/image18.jpg" alt=" And after a few days I had this meeting with my colleague Trish. So, Trish is one of those people who can just look at a situation and see what's not working, and know exactly what needs to change for it to be wildly successful. She's a technical pr" /> And after a few days I had this meeting with my colleague Trish. So, Trish is one of those people who can just look at a situation and see what's not working, and know exactly what needs to change for it to be wildly successful. She's a technical program manager, a TPM, which means she starts out with +15 to competence, but she has even more than usual of this incredible power to see what things need to be tweaked to make everything better. At this point, I didn't even know that but cool, someone put a 1:1 in my calendar so I went! <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321559945-OUWLSOHSATXCRG1P503M/image19.jpg" alt=" And we talked about a bunch of things, and one of them was that Trish asked &quot;If you're looking for problems to solve, can you do something about RFCs?&quot; And I said &quot;maybe, what's wrong with RFCs?&quot; " /> And we talked about a bunch of things, and one of them was that Trish asked "If you're looking for problems to solve, can you do something about RFCs?"And I said "maybe, what's wrong with RFCs?" <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321560557-UW9621EW6KO7DU5DP4TJ/image20.jpg" alt=" Trish said “Well, infrastructure engineering at Squarespace was a small group until relatively recently. The way a small group makes decisions is that everyone who needs to know something probably sits together, eats lunch together, and talks to eac" /> Trish said “Well, infrastructure engineering at Squarespace was a small group until relatively recently. The way a small group makes decisions is that everyone who needs to know something probably sits together, eats lunch together, and talks to each other. Information flows easily.But we've grown a lot and we recently split infrastructure into multiple teams. As we've grown, we can't all be in the same discussion. Here's our current RFC process.” <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321560978-QKLIA8TTESR27W4ILH9N/image21.jpg" alt=" “Someone writes an RFC, a Request For Comment document. They share the doc directly with some people, and then they create a Jira ticket for it in the RFC project as well.” " /> “Someone writes an RFC, a Request For Comment document. They share the doc directly with some people, and then they create a Jira ticket for it in the RFC project as well.” <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575321561084-7XP1Q9QL5YY1B51BS27K/image22.jpg" alt=" “A lot of people have configured Jira so that they get a mail for every new issue in the RFC project. So an arbitrary bunch of people will find out about this RFC and some subset of them will find the subject line interesting and choose to go read i" /> “A lot of people have configured Jira so that they get a mail for every new issue in the RFC project.'''
