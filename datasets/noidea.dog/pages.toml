title = "No Idea Blog"
description = "If you have more than a few microservices, their interdependencies get hard to reason about. I worked for a few years on a project to manage and control microservice dependencies and to make sure it would be possible to turn the company’s tech stack back on if we ever turned it off.Silvia Esparrachiari, Ashleigh Rentz and I wrote an article about the work, published in ACMQueue and Communications of the ACM.I also wrote a talk about it called “Have you tried turning it off and turning it on again?”: https://www.youtube.com/watch?v=xvk4RFGsrWoUSENIX review of the talk: https://www.usenix.org/blog/review-disaster-recoverySlides: https://www.slideshare.net/TanyaReilly/have-you-tried-turning-it-off-and-turning-it-on-againGraphviz examples: https://github.com/whereistanya/graphviz   And O’Reilly interviewed me about it: https://www.oreilly.com/ideas/creating-better-disaster-recovery-plans"
full_description = 'Microservice Dependencies If you have more than a few microservices, their interdependencies get hard to reason about. I worked for a few years on a project to manage and control microservice dependencies and to make sure it would be possible to turn the company’s tech stack back on if we ever turned it off.Silvia Esparrachiari, Ashleigh Rentz and I wrote an article about the work, published in ACMQueue and Communications of the ACM.I also wrote a talk about it called “Have you tried turning it off and turning it on again?”: https://www.youtube.com/watch?v=xvk4RFGsrWoUSENIX review of the talk: https://www.usenix.org/blog/review-disaster-recoverySlides: https://www.slideshare.net/TanyaReilly/have-you-tried-turning-it-off-and-turning-it-on-againGraphviz examples: https://github.com/whereistanya/graphviz And O’Reilly interviewed me about it: https://www.oreilly.com/ideas/creating-better-disaster-recovery-plans <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534436835810-N6Q0X8YUXAOBEII0LPC0/Screen+Shot+2018-08-16+at+5.25.56+PM.png?format=500w"> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534436740772-82BXGSJQQKI1MUL9TCB5/Screen+Shot+2018-08-16+at+5.25.19+PM.png?format=500w"> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534436849390-G1H1SMX45RTBDTFE753W/Screen+Shot+2018-08-16+at+5.26.14+PM.png?format=500w"> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534436839981-47IG2YGL09CZUL4Y0QK4/Screen+Shot+2018-08-16+at+5.26.52+PM.png?format=500w"> Talking About Talking Anyone who does a bunch of public speaking will eventually do a talk about public speaking and this is mine.Slides: https://www.slideshare.net/TanyaReilly/a-talk-about-talkingBlog post about finding images to use: http://noidea.dog/blog/stock-photography <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534429280235-N57J7Y832QJJWBKBK7TG/mikito-tateisi-333584-unsplash+%282%29.jpg?format=500w"> Everyone who does a bunch of public speaking eventually does a talk about public speaking and here’s mine, hi. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534434173753-IWB4KUU190A151F04R9U/Screen+Shot+2018-08-16+at+4.42.23+PM.png?format=500w"> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534434206816-NO1K1WXFGFLI1UG0GY5P/Screen+Shot+2018-08-16+at+4.43.04+PM.png?format=500w"> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534434236786-HE40MWST8NIZEVJHC3TQ/Screen+Shot+2018-08-16+at+4.43.38+PM.png?format=500w"> Coding on Trains I like to code on long train journeys, usually with my small kid beside me asking what I’m doing. Here’s a game I made her over several train trips.Blog posts: https://noidea.dog/blog/pygame-adventures https://noidea.dog/blog/pygame-adventures-part-2Code:https://github.com/whereistanya/pygame_adventures <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534435123808-AKDKJX5UJ9L26DO5EU2V/screenshot.jpg?format=500w"> Sonos Jukebox A raspberry pi project to start and stop albums on my sonos using amazon dash buttons. Full blog post at https://noidea.dog/blog/sonos-jukebox. Code and documentation at http://github.com/whereistanya/sonos-jukebox <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534429486016-GBI9WXURBWTKH4UT7ID5/buttons+%281%29.jpg?format=500w"> prev / next Back to Projects <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1664813242144-D38HLIVRIPQU3Z45N9D3/bookcover.jpg?format=500w">0 Book <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534432634460-KY15NC2IP6P8GQLL6ZH5/87-12023787969MIx.jpg?format=500w">76 Blog (tech stuff) <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1688292609534-L6FU8NHOR7K21YZV2751/PXL_20210529_122651327.jpg?format=500w">28 Blog (nature nerdery in Tipperary) <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1664813315833-U2XQFYKZEGKMR1YAQZE0/41993744451_4b5f0f210d_z.jpg?format=500w">0 Fire Escapes <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575397467243-TXGD5YTS73L789V6R7SX/Screen+Shot+2019-12-03+at+1.24.12+PM.png?format=500w">0 Glue <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1711517246664-GLBRQFRWQGRMYGOJIJ6F/jack-hamilton-EP_OHkgn1JI-unsplash.jpg?format=500w">0 What can you see from here? <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1602103010708-4KI0CRS6K0F8XN6757AE/wizard.jpg?format=500w">0 Impostor <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1575397363604-1ZY4OP24QHK7ZYRN86CW/Screen+Shot+2019-12-03+at+1.22.21+PM.png?format=500w">0 Maybe Great <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1555963517073-NAK7PDOPFU54KAWOP7JY/Screen+Shot+2019-04-22+at+4.04.18+PM.png?format=500w">0 Continuous <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1535223098598-GH0DYEFWFE9JKI1XCW5U/Screen+Shot+2018-08-25+at+2.39.51+PM.png?format=500w">4 Microservice Dependencies <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1535222100730-85GSNMU90V3M26AQPJSC/image-asset.jpeg?format=500w">4 Talking About Talking <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1535222007450-99A0ROOY9RI0R3P4CEFS/image-asset.jpeg?format=500w">1 Coding on Trains <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1641609799337-61DLZX1S42D40JLI2OMU/robin.jpg?format=500w">14 Birds <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534440406189-XXW5B26725TNSYGQS5WR/image-asset.jpeg?format=500w">1 Sonos Jukebox <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1526933255466-CY7436YYVPZHW7KR5KHD/IMG_20110901_145816.jpg?format=500w">52 Where is Tanya? (Around the world in 80 days)'
