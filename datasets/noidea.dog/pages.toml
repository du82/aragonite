["https://noidea.dog/staff"]
title = "Staff Engineering — No Idea Blog"
full_description = "THE STAFF ENGINEER’S PATHNow available in Korean and Spanish! PLEASE SHOP LOCAL IF POSSIBLEIf you can buy your book in your local bookshop, please do! Local bookshops keep resources in your local community, and give people a cool place to hang out. Help them stay in business. Two ways to buy online but still nominate a local bookshop to support are… buy paper books from bookshop.org! buy audiobooks from libro.fm! The Staff Engineer’s Path is also available at…lots of local libraries (via Overdrive) kobo.comebooks.comschroff publishers (India edition)oreilly.com (via a subscription)decoding.co.kr (Korean translation by Grace Kim!)entre-libros.com (Spanish translation)audible.com (audiobook)amazon.com (English or Spanish)…and lots of other places! I’d love to add some other booksellers around the world. Got a favorite I should add? Tell me: addbookshop@noidea.dog RESOURCESLINKSCurious about something I mentioned in the book? Looking for a footnote?Check out a list of chapter-by-chapter links and resources.BOOK DISCUSSIONHere’s a conversation with Suzan Bond about where the book came from, what a staff engineer is, and why we need technical leadership roles. Lead Dev Bookmarked: The Staff Engineer’s Path FURTHER READINGThe Staff Engineer’s Path has three parts: big picture thinking, project execution and leveling up. PART ONE: BIG PICTURE THINKINGPart one of the book is about understanding the big picture of your company and your organization, creating that big picture for other people with vision and strategy, and being willing to make the big decisions that are blocking other people. That includes understanding your own impact: we dive into what a Staff+ engineer even is and why the industry needs them. More from me on these topics:Here’s my intro as cohost of the first ever Staff Engineering conference. (It was such a great conference! The Lead Dev folks are magical.) As part of that same conference, I got to interview a tech luminary: Diane Tang, Google Fellow. I wrote the foreword to Will Larson’s fantastic book, Staff Engineer.On making decisions and reviewing architecture as a group: The Maybe-Great Idea Slowing down to go faster: ContinuousWhy we need an IC track: Not all Engineering Leaders are Engineering ManagersThinking ahead: Sending Gifts to Future-YouAccentuate the Negative: Making the non-perfect decision: Having impact in engineering by supporting other people’s ideas Design documents, maybe the only record of what the hell you were thinkingThe Nuts and Bolts with Tanya Reilly: What is a principal engineer at Squarespace? and other questions The Power of “Yes, if”: Iterating on our RFC Process, for the Squarespace engineering blog PART TWO: PROJECT EXECUTIONPart two is about project execution. Staff+ engineers can take on massive ambiguous cross-org projects and make them succeed despite the difficulty. This part of the book talks about how to survive and thrive during the whole project lifecycle, how to get past the difficult parts, how to manage your time, energy and social capital, and a whole lot of tactics for keeping things moving.More from me on these topics.I moderated this panel of excellent, insightful people: Sustaining and Growing Motivation Across ProjectsMapping the immovable objects in engineering projectsHow to break out of the thread of doom Surviving the organizational side questI like taking notes and I recommend it. Can somebody volunteer to take notesNobody could have predicted this. Can RFCs help us predict failures? (Sort of.)How to make a big technical change: I wouldn’t start from here. PART THREE: LEVELLING UPA Staff+ engineer is a force multiplier. In part three, I talk about how to directly be a good influence through mentorship, sponsorship, coaching, delegation, and great code and design reviews, and how to indirectly be a good influence by modelling what a great engineer looks like. We’ll also look at learning and how to level yourself up and give away your job.More from me on these topics:Still the most popular thing I’ve ever done in my life: Being Glue Embrace your inner incident commander! How to be the grownup in the room when everything’s on fire. How to make onboarding easierA grab bag of advice for engineers, junior and senior You really don’t know what feigned surprise is? Hacking scared humans to help them do things they don’t think they can doDelegation means not answering all the questionsWhy learning is the most important skill in tech Staff engineer communities: why we need them and how to find them"
year_published = 2025
