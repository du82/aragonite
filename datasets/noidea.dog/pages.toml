title = "Fire Escapes — No Idea Blog"
description = "So, I'm a New Yorker. I wasn’t born here — I’m an immigrant — but one of the many things I love about New York City is that you move here, and it’s immediately your city. The number one criterion for being a New Yorker is wanting to be a New Yorker. It's a welcoming place. So good morning to my fellow New Yorkers, wherever you're originally from, and, if you're travelled to be here, welcome to New York. We're glad to have you.I work in Site Reliability and I'm especially interested in what happens when things fail, the contingency plans we use to recover when something breaks. And last year I was thinking about that a lot and walking around the city and I started really noticing that New York is *covered* in fire escapes. They’re a contingency plan too. They’re for incident response. You don’t use them until all of your regular methods of getting out of the building have failed.So I started reading about fire escapes."
full_description = '''THE HISTORY OF FIRE ESCAPES BACKGROUNDWhile thinking a lot about dependencies and disaster plans, I started noticing the fire escapes that are a staple of New York City buildings. The result was a talk called The History of Fire Escapes.SLIDES <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469497844-U31LQ2FORTRKG4RLPS9R/Slide1.png" alt="Slide1.png" /> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469504844-XOFUVE42X8SFTM4JR5XD/Slide2.png" alt=" So, I'm a New Yorker. I wasn’t born here — I’m an immigrant — but one of the many things I love about New York City is that you move here, and it’s immediately your city. The number one criterion for being a New Yorker is wanting to be a New Yorke" /> So, I'm a New Yorker. I wasn’t born here — I’m an immigrant — but one of the many things I love about New York City is that you move here, and it’s immediately your city. The number one criterion for being a New Yorker is wanting to be a New Yorker. It's a welcoming place. So good morning to my fellow New Yorkers, wherever you're originally from, and, if you're travelled to be here, welcome to New York. We're glad to have you.I work in Site Reliability and I'm especially interested in what happens when things fail, the contingency plans we use to recover when something breaks. And last year I was thinking about that a lot and walking around the city and I started really noticing that New York is *covered* in fire escapes. They’re a contingency plan too. They’re for incident response. You don’t use them until all of your regular methods of getting out of the building have failed.So I started reading about fire escapes. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469510908-FH6J011ZF52DL17K5UZQ/Slide3.png" alt=" Before I say more about that, let’s talk content. This talk is about at disaster prevention and disaster recovery in software, by looking at parallels in building fires. This will include stories of some of the worst fires in the history of New York" /> Before I say more about that, let’s talk content. This talk is about at disaster prevention and disaster recovery in software, by looking at parallels in building fires. This will include stories of some of the worst fires in the history of New York City.We'll be looking at the reasons fires started, the stuff that helped them spread and how people died. There's also some pictures of buildings on fire. Nothing lurid, but there are pictures.If you have raw feelings related to recent fires, this could be rough.If you'd be more comfortable skipping this one, you should do that with my blessing. While you're packing up, I'll even tell you what I'm going to say, so you don't miss anything: <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469512871-NM6MER57JVF8Q8GHM9RV/Slide4.png" alt=" Here's my thesis Fire escapes are a hacky bit of afterthought tacked on to the outside of a building after the building is finished. If you're using fire escapes, it's worth making them as good as possible, but you’ll prevent more fires if you buil" /> Here's my thesisFire escapes are a hacky bit of afterthought tacked on to the outside of a building after the building is finished. If you're using fire escapes, it's worth making them as good as possible, but you’ll prevent more fires if you build better buildings.Similarly, incident response is often a hacky bit of afterthought tacked on long after software is released. Again, great incident response can help you recover faster than if you don’t have it but… you’ll prevent more outages if you build better software.Finally, buildings have an extremely detailed fire code, but we don't really have an extremely detailed systems engineering code for software, and I think we should have.Now I'm going to say the same thing but take 35 minutes. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469530262-8Y26362MSNH19Z8JCK1I/Slide5.png" alt=" Fire escapes were really only built in New York City for a hundred years. They weren't common until the 1860s, and in the 1960s they stopped being allowed on new construction. There's some debate now about whether we should start removing them i" /> Fire escapes were really only built in New York City for a hundred years. They weren't common until the 1860s, and in the 1960s they stopped being allowed on new construction.There's some debate now about whether we should start removing them in places where the building has been upgraded, or whether they should be preserved as part of the city's history.I think at least some of them should be preserved. Look how beautiful that is! <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469527622-L0NKTDX48B632PM4590E/Slide6.png" alt=" And here's another lovely one. They made an effort to have it match the style of the building, not feel like a separate thing tacked on at the end. And I think that's key. " /> And here's another lovely one. They made an effort to have it match the style of the building, not feel like a separate thing tacked on at the end. And I think that's key. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469535784-UHNJENXBMVMSGQUOP4BU/Slide7.png" alt=" But most of the time, the people adding the fire escape didn't think of it as part of the building .As this quote says, fire escapes were haphazardly attached to the most elaborately designed facades. The facade of the building was architecture " /> But most of the time, the people adding the fire escape didn't think of it as part of the building .As this quote says, fire escapes were haphazardly attached to the most elaborately designed facades. The facade of the building was architecture but the fire escape was law.It was an external contingency plan, not part of the main structure. And I think that's part of why fire escapes ended up not being successful. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469540628-DMWSEJS8A4V4HZNQ7ISA/Slide8.png" alt=" But I'm jumping to the end. Let's look at the evolution of New York City's fire code. By the way, my great fear now is that there’s a building historian in the room who will listen to this and be like “Nope, that is really not what happened.&quot; Pl" /> But I'm jumping to the end. Let's look at the evolution of New York City's fire code.By the way, my great fear now is that there’s a building historian in the room who will listen to this and be like “Nope, that is really not what happened." Please forgive any errors, building historian! If i made mistakes, I would love if you would come tell me at the end! <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469543189-TCBGWLSV5RUHAPLU928Y/Slide9.png" alt=" On to the history. We’re skipping the great fire of 1776, and jumping straight to 1835 and the Financial district. This was a commercial, not residential area, and as a result the number of fatalities was comparatively low -- two people -- I mea" /> On to the history. We’re skipping the great fire of 1776, and jumping straight to 1835 and the Financial district.This was a commercial, not residential area, and as a result the number of fatalities was comparatively low -- two people -- I mean, still, two too many, but this is mostly remembered as a fire that cost a LOT of money. Almost 700 buildings were destroyed. The city had 26 fire insurance companies. This fire put 23 of them out of business. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469541430-LM5U2RCJRZETCEDDW1X8/Slide10.png" alt=" The fire was caused by a burst gas pipe in a maze of wooden warehouses. Wood burns easily so there were no failure domains: the fire spread very quickly. Inside two hours it covered 17 city blocks, most of the financial district. The city's wate" /> The fire was caused by a burst gas pipe in a maze of wooden warehouses. Wood burns easily so there were no failure domains: the fire spread very quickly. Inside two hours it covered 17 city blocks, most of the financial district.The city's water supplies were low and the typical contingency plan was to pull water from the rivers, but it was a freezing night in December and first the firefighters had to cut through ice.At the time it was also common to use gunpowder to level buildings and stop the fire spreading. But they had used up all their gunpowder on a fire two days earlier. That fire involved the entire fire department of 1500 people, and they were still exhausted. Still, they fought the fire for 15 hours until marines from the Brooklyn Navy Yard arrived with more gunpowder and blew up some buildings along Wall Street to make a barrier. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469542250-64YELRZ7XY05H3PMXWT0/Slide11.png" alt=" As a result of the fire, the city stopped using volunteer firefighters and moved to a professional force with better equipment. And they built the Croton Dam and Aqueduct. It was built because of the fire, but a reliable water source is good for" /> As a result of the fire, the city stopped using volunteer firefighters and moved to a professional force with better equipment.And they built the Croton Dam and Aqueduct. It was built because of the fire, but a reliable water source is good for lots of reasons! <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469542817-TXALRKXFRG66WGO8VWNB/Slide12.png" alt=" But more importantly, as well as better incident response, they took the opportunity to make a more resilient city. The fire spread fast because the buildings were made of wood. They rebuilt with stone and brick. And this paid off, ten years l" /> But more importantly, as well as better incident response, they took the opportunity to make a more resilient city. The fire spread fast because the buildings were made of wood. They rebuilt with stone and brick.And this paid off, ten years later, when there was another enormous fire. The great fire of 1845 was very bad -- thirty people died -- but it didn’t spread as far or as fast, because it slowed down when it hit those new brick buildings. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469554423-HOWV8VY09KLDMRIC7UG8/Slide13.png" alt=" Let’s jump forward 25 years and talk about tenements. Tenements were extremely dense, extremely terrible housing. I'd read about tenements but hasn't realised the scale of them. In the 1860s, nearly 500 thousand people -- more than half the city -- " /> Let’s jump forward 25 years and talk about tenements. Tenements were extremely dense, extremely terrible housing. I'd read about tenements but hasn't realised the scale of them. In the 1860s, nearly 500 thousand people -- more than half the city -- lived in tenements.The population of New York City doubled every decade between 1800 and 1880. Maybe you've seen this with teams and software systems: when you grow rapidly, you can build some culture problems and some technical debt. This was certainly the case here. Landlords made more accommodation by splitting big rooms into many smaller ones, mostly with no light or ventilation. These were really awful places to live. They were crime riddled, filthy and filled with disease. Every report about them mentioned that they were fire traps.In 1860, two tenement fires happened back to back. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469543949-VS1HDPW22PABYVPQPR7Q/Slide14.png" alt=" The first one, on Elm Street, started in a bakery on the ground floor of a large residential building. Terrible place for a bakery, but that's where it was. The baker was storing a lot of hay and wood shavings, and when they burned they made dense s" /> The first one, on Elm Street, started in a bakery on the ground floor of a large residential building. Terrible place for a bakery, but that's where it was. The baker was storing a lot of hay and wood shavings, and when they burned they made dense smoke, killing some of the people who lived in the higher floors before the fire even got up there.The wooden stairway quickly burned away, trapping people on the top floors. Firefighters arrived with ladders, but the ladders only went to the fourth floor and this was a six storey building. At least 10 people died.A month later four houses burned on west 45th street. These houses had roof hatches called scuttles, which should have let people escape across the roofs, but they all were missing their ladders so nobody could get up there. Another ten people died. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469544366-HQ5DSMFC1UGJHDJISQHJ/Slide15.png" alt=" These escape plans -- the ladders and scuttles and the roof -- had worked fine for a previous iteration of shorter NYC buildings, but they hadn't been updated for the new shape of the city. Just like with the water and the gunpowder, there was a" /> These escape plans -- the ladders and scuttles and the roof -- had worked fine for a previous iteration of shorter NYC buildings, but they hadn't been updated for the new shape of the city.Just like with the water and the gunpowder, there was a plan in place for a fire disaster. And just like them, the plan only worked in the most optimistic circumstance.We see that all the time. Backups that will work if we lose the database in a very specific way. Failover plans that only work if we have two weeks notice of the failover and the old data center doesn't lose power. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469545024-QR6C16E4D9ZSRAWQR90H/Slide16.png" alt=" The city immediately passed a law to make the tenements more robust against fire. They even put an injunction on new tenement construction until the law was passed. Now houses for more than eight families (kind of specific) had to have fire-proof" /> The city immediately passed a law to make the tenements more robust against fire. They even put an injunction on new tenement construction until the law was passed. Now houses for more than eight families (kind of specific) had to have fire-proof stairs either inside or outside the building.What’s frustrating about this is that four years earlier a commission had reported that, if there was a fire, tenants on the 6th and 7th floors of tenements had basically zero chance of survival. They recommended fire proof stairs. But nothing happened until a bunch of people died. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1560469551164-P203XGKO4MQ5ECWB5UJY/Slide17.png" alt=" Seven years later, the Draft Riots (which are a whole separate awful thing in which a whole bunch of people died ) led to another law: the Tenement House act. This act had '''
