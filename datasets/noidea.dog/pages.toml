["https://noidea.dog/impostor"]
title = "Impostor — No Idea Blog"
description = '''I’ve been an engineer for more than twenty years. I love technology, I love learning new things, and I was never very interested in becoming a manager. So I stayed on the "technical track” and I’m a principal software engineer now. But when I came into the industry, I would never have assumed I would become a senior engineer. I didn’t think of myself as someone who could do that role.Although I always got good performance reviews for my current level, when I looked at more senior engineers, I couldn't imagine doing their job.They seemed like wizards.'''
full_description = '''This is a talk about impostor syndrome specifically in tech and specifically as it affects women who are relatively new in their careers. I’ve delivered this talk once, at the Squarespace Lounge at Grace Hopper in September 2020. When I took a poll during the event, 96% of the 270+ attendees said they had experienced this feeling of not being a “real engineer”. 96%!If you haven’t felt this way, or you’re not the intended audience, you are (obviously!) still very welcome here. This post may not resonate with you, but please understand that this phenomenon is very real for many of your colleagues. Think about whether you can change anything that contributes to that. Thanks for reading. I hope it’s helpful. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767590476-H6EMLTOFK6DVWPC0BHGA/image1.jpg" alt="image1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767593266-G9TC0VBS3W3VYYH1LI27/image2.jpg" alt=" I’ve been an engineer for more than twenty years. I love technology, I love learning new things, and I was never very interested in becoming a manager. So I stayed on the &quot;technical track” and I’m a principal software engineer now. But when I came" /> I’ve been an engineer for more than twenty years. I love technology, I love learning new things, and I was never very interested in becoming a manager. So I stayed on the "technical track” and I’m a principal software engineer now. But when I came into the industry, I would never have assumed I would become a senior engineer. I didn’t think of myself as someone who could do that role.Although I always got good performance reviews for my current level, when I looked at more senior engineers, I couldn't imagine doing their job.They seemed like wizards. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767593780-9Y1404JA40LB39B8B8BN/image3.jpg" alt=" You can't learn to be a wizard ; you either are one or you aren't. I wasn’t. Some of my colleagues seemed to have the wizard gene. They seemed to know things without ever having to try to learn them, they liked to work alone, they loved talking " /> You can't learn to be a wizard; you either are one or you aren't. I wasn’t.Some of my colleagues seemed to have the wizard gene. They seemed to know things without ever having to try to learn them, they liked to work alone, they loved talking about tech trivia, and they almost certainly did open source or were really nerdy about linux kernels or whatever. I didn’t do those things. I genuinely thought that they were real engineers and I wasn't.I got four promotions at Google and it was the third one before I started to internalise that maybe I was doing the job well.To be clear, I'm still not a wizard. This is not self-deprecation! I'm a good engineer. But I still have to work hard and deliberately learn any time I want to know something new. I will always prefer to collaborate. I'm still not particularly interested in linux kernels… but it turns out you don't need to be, unless that’s what you’re working on. Nerding on tech trivia is only one of the ways to do the job. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767594056-K3JPY5DBABACHWHJOBGZ/image4.jpg" alt=" This feeling of &quot;I'm not a real engineer&quot; is often called “impostor syndrome”. It's this idea that you're not any good at the thing you're doing for your career. Like, sure, you're passing your exams or finishing your projects at work or whatever, b" /> This feeling of "I'm not a real engineer" is often called “impostor syndrome”. It's this idea that you're not any good at the thing you're doing for your career. Like, sure, you're passing your exams or finishing your projects at work or whatever, but at some point it's going to get too hard and you'll be found out to be a fraud. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767594243-5LGUUE4RA1YZNE3TYVPO/image5.jpg" alt=" Impostor syndrome is not just a tech thing. You can find articles about imposter syndrome in law, in architecture, in teaching, in the military, all over the place. But a lot of the time when I see it in tech, I think there’s more to the story, es" /> Impostor syndrome is not just a tech thing. You can find articles about imposter syndrome in law, in architecture, in teaching, in the military, all over the place. But a lot of the time when I see it in tech, I think there’s more to the story, especially when it's women telling me they don't feel like real engineers. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767594462-HP46WQ0Q16A87C9WW71H/image6.jpg" alt=" I think often the feeling of not fitting in is because, get this, you genuinely don't fit in ! For a long time, the media image of a programmer was someone who knew all of the tech trivia in the world without ever asking questions, collaborating" /> I think often the feeling of not fitting in is because, get this, you genuinely don't fit in!For a long time, the media image of a programmer was someone who knew all of the tech trivia in the world without ever asking questions, collaborating or looking things up. Usually but not always male.Reality was less extreme than that, but the senior people were almost all men, and they were often dismissive of “soft skills”. And they didn't talk about learning; they just seemed to get information magically for free. Wizards, right?It used to be that if you went to a conference it'd be three days of male speakers and MAYBE one woman but she'd probably be talking about women in computing. It was rough times, friends. In that environment, it's not at all surprising that a woman early in her career might look at the senior visible folks and say "That's not who I am. No path starting at me can go to there". If you only see one way to be a senior engineer, and you just aren’t that kind of person, how can you see yourself as a senior engineer? <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767594621-76Z9NOO82YYTJ9ASOQ15/image7.jpg" alt=" To make matters worse, the industry wasn't always very welcoming. Forums were often mean and condescending. You might have seen the study about it being harder to get pull requests accepted with a female name . Even today we still see idiotic ho" /> To make matters worse, the industry wasn't always very welcoming. Forums were often mean and condescending. You might have seen the study about it being harder to get pull requests accepted with a female name.Even today we still see idiotic hot takes on Twitter like "If your github isn't solid green, you're not a real programmer" or “if you don’t act in a certain way then you shouldn’t be a software engineer”. One place I worked at had documentation for how to know whether someone was a good hire. It said they should have “nerdy hobbies". All of this is gatekeeping. This is intentionally keeping people out who aren’t like the people who are already there. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767594829-26UKQ8U8II0XHFVXU2NZ/image8.jpg" alt=" Not surprisingly, retention for women was TERRIBLE ( and still is ). Many women left entirely. Many others moved into product management or people management or tech education where they could see more people who looked like them, where it was a lit" /> Not surprisingly, retention for women was TERRIBLE (and still is). Many women left entirely. Many others moved into product management or people management or tech education where they could see more people who looked like them, where it was a little friendlier. Obviously these are all awesome roles and I’m glad to have good people doing them. But we ended up with very few women who stayed around long enough to become senior engineers. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767595019-5Y48MZKQ2YMXHOBM5HJ5/image9.jpg" alt=" And so new female engineers coming in were less likely to see any senior people who were like them. There was nobody to show the next group that there are tons of valid ways to be a good engineer. There were fewer people to tell the gatekeepers to k" /> And so new female engineers coming in were less likely to see any senior people who were like them. There was nobody to show the next group that there are tons of valid ways to be a good engineer. There were fewer people to tell the gatekeepers to knock it off. And so that cycle continued.There are a bunch of people who should be here supporting you right now, who should be acting as role models for all the ways there are to be engineers. Except they're not here.So, we're in a better place now, but not… tons better? Most conferences that are worth going to have a diverse lineup these days. But apparently we’re still only at 13% female engineers, which implies that a ton of women joining the industry are going to be the only woman on their team, or might not be able to see any more senior women around them. When I talk with interns coming in, many of them still tell me "I don't feel like a real engineer" and that makes me sad.I'm glad we came up with the term imposter syndrome. It's helpful to have a label for this feeling. But I want us to watch out for what or who in our environment might be making us feel like that, and what information we're feeding our brains all day long about what real software engineers look and act like.All that said, if you’re impostoring or you know someone who is and want to help them, I want to share three suggestions. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767595659-R4G5518LFLURAVE87OB0/image10.jpg" alt=" 1. Find a community that is kind to you. 2. Find role models who are like you, who inspire you. 3. Learn something you find a bit scary. " /> 1. Find a community that is kind to you.2. Find role models who are like you, who inspire you.3. Learn something you find a bit scary. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767599189-B5SI32GT3GL2BOWPS8E3/image11.jpg" alt=" The first one is to find a community where you don't feel &quot;different&quot;. Early on in my career, I was super skeptical about events (like Grace Hopper!) that focused on a gender. I felt like it shouldn't matter. And it shouldn’t matter! But it doe" /> The first one is to find a community where you don't feel "different".Early on in my career, I was super skeptical about events (like Grace Hopper!) that focused on a gender. I felt like it shouldn't matter. And it shouldn’t matter! But it does. Over time, being "diversity" gets exhausting. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767602262-OTCGSJ7O0WV11BFA75Q1/image12.jpg" alt=" No matter how hard you try to blend in and just be one of the people, other people on the team will notice what's different about you. You can turn up every day wearing the tech uniform of jeans and a t-shirt. You can convince yourself that they don" /> No matter how hard you try to blend in and just be one of the people, other people on the team will notice what's different about you. You can turn up every day wearing the tech uniform of jeans and a t-shirt. You can convince yourself that they don't notice you're different, but I assure you they’ve noticed.I had a clear example of this at a conference once. I was talking with a bunch of people about DNSSEC, all engineers talking about DNS together, and someone interrupted me to ask "hey, shouldn't you be in the women in computing session instead of the DNS session?". Uh, excuse me, I was blending in here, didn’t you know? This sort of thing happens a lot. It's nice to have a community where you can relax and just be one of the people without anyone (including yourself) thinking of you as a strange alien who is different from everyone else. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767605519-1UKYBCWNRAAKVBOZZTKZ/image13.jpg" alt=" It’s also great to have a group where everyone supports and boosts each other, where they shine a light on each other’s achievements and are happy for each other’s successes. And help each other. If you can’t find a group like this, I really recomm" /> It’s also great to have a group where everyone supports and boosts each other, where they shine a light on each other’s achievements and are happy for each other’s successes. And help each other.If you can’t find a group like this, I really recommend that you try to build it. Take a long view: even if everyone's junior now, you won't always be. Build networks now and keep them for the long haul.It absolutely doesn't have to be a women in tech community. But find a group where you can be yourself, where you are supported, and where you support everyone else right back.This year the Grace Hopper theme is #TOGETHERWEBUILD btw. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767610166-EYJ5P1KN6M05LXTRQ00Z/image14.jpg" alt=" The second suggestion is to seek out role models. These might come from your community, they might not. They don't have to be people exactly like you, but people who you can identify with, whose path you can imagine following. People who may be incr" /> The second suggestion is to seek out role models. These might come from your community, they might not. They don't have to be people exactly like you, but people who you can identify with, whose path you can imagine following. People who may be incredibly more skilled and experienced than you, but who don’t feel like wizards.It's hard to be what you don't see. It's good to have some pre-worn paths to follow so you don't have to invent the ways to behave. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1601767609142-X3BH8OFPE9DP3V3OTDBI/image15.jpg" alt=" Shonda Rhimes said it so well. She said she got through the glass ceiling without scratches and bruises because she was running on a path created by every other woman's footsteps, women whose paths she could study to see what would work and where th" /> Shonda Rhimes said it so well. She said she got through the glass ceiling without scratches and bruises because she was running on a path created by every other woman's footsteps, women whose paths she could study to see what would work and where the ways through were. This is a phenomenal speech. I still get shivers when I read it.http://glassceiling.com/shonda-rhimes-i-didnt-break-the-glass-ceilingIf you have any doubts that you can do things, find people who are like you who are doing them already.I feel weird recommending Twitter because it's so doomy and awful, but Tech Twitter is amazing and diverse and you can choose to follow incredibly inspirational people. Be deliberate about who you follow. Again, think '''
