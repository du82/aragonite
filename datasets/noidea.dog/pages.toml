title = "About — No Idea Blog"
full_description = "Hi!My name is Tanya Reilly and this is a pretentious picture. Look! I am a visionary, visioning. Ideation all over the place. I like Raspberry Pi, Linux, Python, Go, C++ (well, sometimes. It’s a complicated relationship.), coffee, trains, the NYT Crossword, distributed systems and making things hard for humans to accidentally break.I have a blog here. I’m on the Hachyderm instance of Mastodon. My LinkedIn is here. My github is there. I’ve written a bunch of things for LeadDev over here. And sometimes I talk at things. Contact information. Blog RSS"
