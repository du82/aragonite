J7Y832QJJWBKBK7TG/mikito-tateisi-333584-unsplash+%282%29.jpg?format=500w"> Everyone who does a bunch of public speaking eventually does a talk about public speaking and here’s mine, hi. <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534434173753-IWB4KUU190A151F04R9U/Screen+Shot+2018-08-16+at+4.42.23+PM.png?format=500w"> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534434206816-NO1K1WXFGFLI1UG0GY5P/Screen+Shot+2018-08-16+at+4.43.04+PM.png?format=500w"> <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534434236786-HE40MWST8NIZEVJHC3TQ/Screen+Shot+2018-08-16+at+4.43.38+PM.png?format=500w"> Coding on Trains I like to code on long train journeys, usually with my small kid beside me asking what I’m doing. Here’s a game I made her over several train trips.Blog posts: https://noidea.dog/blog/pygame-adventures https://noidea.dog/blog/pygame-adventures-part-2Code:https://github.com/whereistanya/pygame_adventures <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534435123808-AKDKJX5UJ9L26DO5EU2V/screenshot.jpg?format=500w"> Sonos Jukebox A raspberry pi project to start and stop albums on my sonos using amazon dash buttons. Full blog post at https://noidea.dog/blog/sonos-jukebox. Code and documentation at http://github.com/whereistanya/sonos-jukebox <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534429486016-GBI9WXURBWTKH4UT7ID5/buttons+%281%29.jpg?format=500w"> prev / next Back to Projects <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1664813242144-D38HLIVRIPQU3Z45N9D3/bookcover.jpg?format=500w">0 Book <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1534432634460-KY15NC2IP6P8GQLL6ZH5/87-12023787969MIx.jpg?format=500w">76 Blog (tech stuff) <img src="https://images.squarespace-cdn.com/content/v1/5a05ececd55b4165f250f032/1688292609534-L6FU8NHOR