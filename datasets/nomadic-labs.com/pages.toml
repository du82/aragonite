["https://www.nomadic-labs.com/engineering-manager-f-h"]
title = "Engineering Manager | Nomadic Labs"
full_description = "Help to evolve the Tezos blockchain. Work with the leading engineering group safeguarding the trustworthiness of Tezos upgrades. The Tezos blockchain is a decentralized ledger that redefines the meaning of holding and exchanging assets in a digital, connected world. Its key value proposition is to be self-amendable: contrary to other blockchains, it can evolve continuously with no need for so-called “blockchain forks” that endanger the user assets. Nomadic Labs is one of the largest research and development centers within the Tezos ecosystem. This Paris-based company brings together more than 60 people, the majority of whom are highly-skilled software engineers (25+ PhDs) contributing to the Tezos engineering roadmap. Nomadic Labs prioritizes three key areas: (1) maintaining the Tezos blockchain’s position as a technological leader in the blockchain industry through deep expertise in functional programming (OCaml, Rust), formal methods, cryptography, and decentralized systems; (2) driving the adoption of Tezos technology; and (3) assisting companies and institutions in France, Luxembourg, Belgium, and Germany to leverage the Tezos blockchain for their business requirements by offering dedicated technical support. As an Engineering Manager, you will assume complete responsibility for managing a software engineering team, delivering product features, and achieving the team’s mission. Your role demands being an inspirational leader who fosters continuous growth, high performance, and a culture of ownership. You must possess a deep understanding of designing, developing, and delivering innovative and safety-critical software amidst high uncertainties. With your experience, you recognize the critical role of teamwork, coaching, and proficient project management. This position is suited for someone who excels in a rapidly changing, fast-growing, and competitive environment. applied mathematical content is required. You have previous strong experience in Engineering Management and are willing to work with talented engineers. You have a significant track record as a senior software engineer and very good knowledge of software engineering best practices. In addition, you understand what a critical distributed software system is. Prior knowledge of blockchain technology is appreciated but not strictly required."
