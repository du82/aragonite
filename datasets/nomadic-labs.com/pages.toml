["https://www.nomadic-labs.com/cube3-nomadic-labs-partnership-incubator"]
title = "Nomadic Labs Partners with Incubator Cube3 | Nomadic Labs"
description = "Montaigne Conseil & Patrimoine announces that it will become a Tezos Corporate Baker"
full_description = "Paris, October 16, 2024 — Nomadic Labs, one of the largest R&D hubs in the Tezos ecosystem, announces a partnership with Cube3, a renowned accelerator, aimed at accelerating Web3 startups incubated for one year. Focused on the development and evolution of the Tezos protocol, Nomadic Labs assists businesses, institutions, and industries in their use of the Tezos blockchain by providing technical support. Since the beginning of the year, Nomadic Labs has adopted a strategy of partnering with incubators like 42 Startup Club, 50Partners, Euratechnologies, and now Cube3. The goal: to foster ambitious, solid projects and help project leaders integrate into the Web3 ecosystem, as well as to build new use cases on the Tezos blockchain. In early September, Cube3 kicked off a new 9-month support cycle with 14 startups. This dynamic ecosystem brings together innovative entrepreneurs selected from 140 applications during a unique ceremony hosted by Cube3. Notable attendees included its CEO, Valentin Demé, alongside jury members like Mounir Laggoune from Finary, Thomas Douchez from Visa, and YouTuber Amixem. The 14 selected startups will have access to essential resources and partnerships, enabling their projects to grow, especially on the international stage. To achieve this, Cube3 offers comprehensive support to entrepreneurs. The selected startups, known as “cubers,” benefit from over 100 hours of personalized advice, delivered by both internal teams and top-tier experts in fields like legal, business structuring, financing, and technological innovation. The partnership with Nomadic Labs is fully aligned with this approach. The Paris-based Tezos R&D center will provide its technological and business expertise for one year to certain startups from Cube3’s current cohort, including: Driven by a shared vision with Cube3 to support the emergence of the next generation of Web3 startups, this partnership allows Nomadic Labs to guide innovative projects. By working closely with Cube3, Nomadic Labs can identify and onboard promising startups into the Tezos ecosystem, providing them with a robust network to thrive."
