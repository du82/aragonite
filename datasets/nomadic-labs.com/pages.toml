["https://www.nomadic-labs.com/technical-writer"]
title = "Technical Writer | Nomadic Labs"
full_description = "Help to document and showcase the Tezos blockchain and to shape it closer to user needs. Work with the Technical Users Relations team within the leading engineering group developing the Tezos technology. The Tezos blockchain is a decentralized ledger that redefines the meaning of holding and exchanging assets in a digital, connected world. Its key value proposition is to be self-amendable: contrary to other blockchains, it can evolve continuously with no need for so-called “blockchain forks” that endanger the user assets. Nomadic Labs is one of the largest research and development centers within the Tezos ecosystem. This Paris-based company brings together more than 60 people, the majority of whom are highly-skilled software engineers (25+ PhDs) contributing to the Tezos engineering roadmap. Nomadic Labs prioritizes three key areas: (1) maintaining the Tezos blockchain’s position as a technological leader in the blockchain industry by evolving the Tezos protocol; (2) driving the adoption of Tezos technology; and (3) strengthening of the ecosystem. As an ambassador of the Nomadic Labs and Tezos technology, you will build a sharp and strong image of our products while growing the ecosystem. As a Technical Writer at Nomadic Labs, the recruited engineer will work on explaining and promoting the Tezos technology and products. If you are motivated by a fast-growing, promising and innovative business sector, you are autonomous, rigorous and responsive, you welcome challenges and seek to further your career in a worldwide project, join our teams now! Send an email to careers@nomadic-labs.com ! I do not wish for my personal data to be transferred to the subcontractor platforms Ashby and Trilitech.I agree to my information being shared with the partner Trilitech and the subcontractor Ashby."
