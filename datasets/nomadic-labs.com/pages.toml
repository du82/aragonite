["https://www.nomadic-labs.com/internship-program"]
title = "Internship Program | Nomadic Labs"
full_description = "Nomadic Labs is a leading research and development center in Paris, dedicated to advancing the Tezos protocol within an international, decentralized, and vibrant ecosystem (such as the Tezos Foundation, Trilitech, and others). With a focus on core development, our mission is to enhance security, scalability, and functionality across the Tezos ecosystem. The internship program offers an exciting opportunity to join our engineering teams, contributing to the development of the Tezos blockchain. Interns will: Be considered for junior engineering positions upon successful completion of the internship, with a minimum starting salary of €55,000. Ideally, experience or coursework in modern programming languages, particularly in OCaml and Rust – experience in Scala or Haskell are also considered relevant. There are four engineering teams at Nomadic Labs: Core Layer 1, Core Layer 2, Core Tezos X, and Engineering Infrastructure. We describe here the scope of these teams and some possible topics to join these teams as an intern but this is not a closed list: further discussions with candidates can lead to different propositions depending on the profile and the interests of the intern. The Core Layer 1 team is focusing on the “Layer 1” of Tezos. This layer offers a secure settlement layer for the full stack. It is a full-fledged blockchain equipped with a fast and secure proof-of-stake consensus algorithm, an on-chain governance mechanism, and a smart contract execution platform, all this running on top of a P2P permissionless network. Proposer Lotteries: Prototype different Proposer lottery mechanisms and compare their performance and properties under various network conditions. Parallelized Operation Validations: Design and implement a system for validating multiple operations simultaneously to enhance throughput and scalability. The Core Layer 2 team is focusing on the implementation of the Data Availability Layer of Tezos and the Smart Rollups called Etherlink – an EVM compatible L2 chain – and TezLink – a Michelson compatible L2 chain, on-chain execution platforms for decentralized applications."
