["https://www.nomadic-labs.com/the-french-red-cross-tezos-acheeve"]
title = "The French Red Cross x Acheeve on the Tezos blockchain | Nomadic Labs"
description = "ComPilot the compliance platform, announces the deployment of its solutions on the Tezos blockchain. This enables Web3 project owners to access advanced and streamlined compliance tools."
full_description = "Paris, November 7, 2024 – During the Paris Olympic Games, the French Red Cross, in collaboration with Acheeve, a Web3 platform dedicated to employee engagement, recognized the efforts of its volunteers by awarding them unique digital badges. These distinctions celebrate the volunteers' achievements and dedication throughout the Olympic events, highlighting their positive impact on society. This innovative initiative, combining involvement and technology, was made possible through the Tezos blockchain. The Olympic and Paralympic Games in Paris, the world’s largest sporting events, mobilized over 45,000 volunteers this summer across all official sites, contributing to their success. These volunteers' mission was to improve participant experiences, enhance sports performance, and ensure smooth operations. To create a lasting memory of the volunteers' contributions, the French Red Cross, in partnership with Acheeve, built an innovative platform in January 2023. This platform utilizes NFTs (non-fungible tokens) on a large scale to celebrate the various missions undertaken by volunteers, such as emergency services, logistics, and support. This project has been supported from the outset by the Tezos Foundation and Nomadic Labs, one of the largest research and development centers for the Tezos blockchain. Exclusive digital badges, in the form of NFTs stored on the Tezos blockchain, were specifically created for French Red Cross volunteers. These immutable and tamper-proof digital trophies confirm their participation and are stored in a personal digital wallet. As volunteers completed missions, they received new NFTs, adding them to their wallets. The results of this campaign have been highly positive, both in terms of engagement and interaction with volunteers. In total, the initiative led to: Given the success of this tripartite initiative, the partners are now considering expanding the project nationwide. This recognition model could be integrated into the French Red Cross’s daily activities, such as outreach missions and training programs, with an added focus on gamification. Beyond being digital rewards, the NFTs also serve as a reliable database for the organization, allowing for a better understanding of its volunteers."
