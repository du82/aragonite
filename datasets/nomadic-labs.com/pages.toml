["https://www.nomadic-labs.com/metadev3-becomes-a-baker-on-tezos"]
title = "Metadev3 Becomes a Corporate Baker on Tezos | Nomadic Labs"
description = "ComPilot the compliance platform, announces the deployment of its solutions on the Tezos blockchain. This enables Web3 project owners to access advanced and streamlined compliance tools."
full_description = '''Paris, November 12, 2024 – Metadev3, a Web3 consulting and digital transformation offering from IORGA Group, strengthens its involvement in the Tezos ecosystem by becoming a baker (validator). As a blockchain validator, this Web3 specialist will verify and secure transactions while contributing to the decentralized governance of the Tezos blockchain. IORGA Group, a subsidiary of The Blockchain Group, brings 25 years of experience in developing innovative and custom business solutions. With its Metadev3 offering, it specializes in the design and implementation of Web3 projects, including blockchain integrations like Tezos. Metadev3 recently developed a tool named APY.3 — a modular technical platform built on a cloud infrastructure that simplifies the connection between Web2 and Web3 environments. This platform enables the deployment of new use cases, particularly those based on the Tezos blockchain. Notably, APY.3 ensures seamless integration between traditional financial systems (Web2) and blockchain technology (Web3), providing a reliable means of ensuring the security and traceability of financial transactions, especially those related to Mobile Money and Visa card usage. By becoming a baker (Tezos validator), Metadev3 deepens its participation in decentralized governance, thereby contributing to the evolution of the protocol and network security. The entity now holds voting rights proportional to the Tezos tokens (tez) it stakes and receives through delegation, ensuring the network's security and reliability. The Tezos blockchain, which has undergone sixteen upgrades — the latest being called "Paris" — offers enhanced performance, maturity, and robustness, along with improved throughput on Layer 2, thanks to the introduction of the Data Availability Layer (DAL). “We are thrilled to deepen our exploration of the Tezos ecosystem, which presents significant potential, and to contribute to its sustainability as blockchain technology continues to be adopted across various sectors. Becoming a baker was a natural choice for us, aligning with our mission to identify use cases that address business challenges and deliver tangible ROI for our clients. The APY.3 solution enables seamless integration of Web2 data into Web3, thus facilitating the transition.”'''
