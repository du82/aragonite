["https://www.nomadic-labs.com/head-of-builders-programme"]
title = "Head of Builders Programme | Nomadic Labs"
full_description = "The Tezos blockchain is a decentralized ledger that redefines the meaning of holding and exchanging assets in a digital, connected world. Its key value proposition is to be self-amendable: contrary to other blockchains, it can evolve continuously with no need for so-called “blockchain forks” that endanger the user assets. Nomadic Labs is one of the largest research and development centers within the Tezos ecosystem. This Paris-based company brings together more than 60 people, the majority of whom are highly-skilled software engineers (25+ PhDs) contributing to the Tezos engineering roadmap. Nomadic Labs prioritizes three key areas: (1) maintaining the Tezos blockchain’s position as a technological leader in the blockchain industry through deep expertise in functional programming (OCaml, Rust), formal methods, cryptography, and decentralized systems; (2) driving the adoption of Tezos technology; and (3) assisting companies and institutions in France, Luxembourg, Belgium, and Germany to leverage the Tezos blockchain for their business requirements by offering dedicated technical support. Tezos is an open-source platform known for its flexibility, security, and self-amendment capabilities. It’s built to empower developers to create smart contracts and decentralised applications with ease. Today, the Tezos ecosystem is made up of thousands of passionate community members actively involved in various projects and initiatives including the development of decentralised applications, smart contracts, and educational content. We’re proud to partner with the likes of Manchester United, McLaren Racing, Ubisoft, and Societe Generale (to name a few). Some of the exciting projects built on the Tezos blockchain are Hic Et Nunc, Objkt.com, OneOf and Kukai. We encourage you to explore the Tezos website and follow us on Twitter & Discord to learn more about the project. The TechRel team at Trilitech and Nomadic Labs is responsible for supporting builders, bakers and users across the Tezos ecosystem including for our Layer 1 and Layer 2 (Etherlink) blockchains."
