["https://www.nomadic-labs.com/lecoffre-io-secure-notarial-acts-on-the-tezos-blockchain"]
title = "LeCoffre.io: Secure Notarial Acts on the Tezos Blockchain | Nomadic Labs"
description = "ComPilot the compliance platform, announces the deployment of its solutions on the Tezos blockchain. This enables Web3 project owners to access advanced and streamlined compliance tools."
full_description = "Paris, November 28, 2024 – LeCoffre.io, launched by the mission-driven company not.IT FACTORY based on an idea from the not.IT LAB technology endowment fund, is an online platform designed by notaries for notaries. It aims to secure, streamline, and trace the collection and transmission of documents for all notarial acts. Developed in France by Smart-Chain using the Tezos blockchain technology, LeCoffre.io was rolled out nationwide in June 2024 and is currently used by around thirty notary offices, with a target of reaching 100 users by the end of the year. LeCoffre.io provides a platform for notary offices to secure and trace document exchanges. Its goal is to eliminate fraud risks by selectively distributing encrypted and authenticated data while ensuring a streamlined, sovereign, and regulation-compliant (GDPR) document management process. The platform offers an intuitive and user-friendly interface enabling notaries to request and receive notarized documents from their clients: Through a secure connection, documents are analyzed and immutably recorded on Tezos. Chosen because of its scalability, security, low environmental impact due to its Proof-of-Stake (PoS) mechanism, and on-chain governance. Each file is timestamped, tamper-proof, and verifiable at any time. Only the notary can access the documents stored on LeCoffre.io, and all data is encrypted and retained for a limited time to ensure confidentiality. LeCoffre.io complies with the new anti-money laundering and counter-terrorist financing (AML/CTF) obligations for notaries and plans to accelerate its adoption by integrating new artificial intelligence (AI) features to enhance security further. The platform is currently used by 30 notary offices in France, with a goal of reaching 100 users by year-end. In recent years, notaries have faced challenges in controlling the security and integrity of data transmitted online. While file transfer platforms facilitate the sharing of large documents, they do not always guarantee data integrity and origin. Amid a rise in cyberattacks, LeCoffre.io protects client information by mitigating risks of fraud, hacking, and document tampering while offering transparent case tracking."
