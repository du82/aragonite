["https://www.nomadic-labs.com/compilot-now-on-the-tezos-blockchain"]
title = "ComPilot now on the Tezos Blockchain | Nomadic Labs"
description = "ComPilot the compliance platform, announces the deployment of its solutions on the Tezos blockchain. This enables Web3 project owners to access advanced and streamlined compliance tools."
full_description = "Paris, October 7, 2024 - ComPilot (formerly NexeraID), the compliance platform for Web3 businesses, announces the deployment of its solutions on the Tezos blockchain. This enables Web3 project owners to access advanced and streamlined compliance tools. The Web3 ecosystem continuously evolves regarding regulatory requirements and blockchain use cases. ComPilot provides compliance solutions that help Web3 projects develop securely while adhering to complex regulatory frameworks. By leveraging data from both Web2 and Web3, the platform simplifies and automates key processes such as Anti-Money Laundering (AML), Know Your Customer (KYC), Know Your Business (KYB), and wallet screening. The deployment of ComPilot on Tezos aims to encourage businesses and developers to innovate and will help: Following the recent announcement of the activation of Tezos’ 16th upgrade, Paris, which introduced the Data Availability Layer (DAL) to enhance the scalability of Smart Rollups on Layer 2, the deployment of ComPilot strengthens compliance and management of Web3 projects on Tezos without compromising network decentralization or security. “We are proud to be the compliance layer of the Tezos blockchain. This collaboration highlights the importance of compliance in preparing for the future of blockchain. With ComPilot, our goal is to empower project owners to focus on innovation while remaining compliant with current regulations” “At Nomadic Labs, we are delighted to have supported the deployment of ComPilot’s solutions on Tezos. With the implementation of regulations like MiCA in 2024, compliance is a key issue for blockchain projects. Having tools like ComPilot is essential for ensuring the secure and sustainable development of projects on Tezos.”"
