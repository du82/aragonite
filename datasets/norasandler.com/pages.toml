full_description = "Writing a C Compiler Is Here! Aug 20, 2024 It’s finally here! Writing a C Compiler goes on sale today on Bookshop.org, Barnes & Noble, Amazon, and wherever books are sold1. (It’s been available directly from No Starch Press for a few weeks now!) You can find links to the companion code, errata, and other resources on the book’s web page. I’m incredibly grateful to everyone who preordered a copy, and especially to the readers who took the time to email me and share their feedback. One of the best parts of writing a project-based book like this hearing how people are making it their own—readers have been writing compilers in everything from Rust to Scheme to C, and a few brave souls are even targeting totally different instruction sets. I can’t wait to see what else this book’s readers build. 1 If you see it for sale in a physical bookstore, send me a photo!"
