["https://nordhealth.com/news/nordhealth-acquires-easypractice"]
title = "Nordhealth acquires EasyPractice | Nordhealth"
description = "Thousands of healthcare and veterinary professionals around the world use Nordhealth’s software and APIs to help improve care, save time and grow their business."
full_description = "Nordhealth acquires EasyPracticeJanuary 31, 202231 January 2022, Nordhealth announced it has completed its acquisition of EasyPractice, a leading cloud-based practice management software provider for therapists.Founded in 2012 in Copenhagen, Denmark by Emil Højbjerg and Bo Møller, EasyPractice helps therapists easily manage bookings, invoices, and journals. EasyPractice is used daily by thousands of therapists across Denmark and 20+ other countries, and has helped serve more than 1 million patients.“EasyPractice is a great company with an amazing product, a talented team, and an incredibly passionate community,” said Charles MacBain, CEO, Nordhealth. “Our strategy is to transform Nordhealth products from sales-led and requiring manual onboarding to fully product-led and self-service. We look forward to learning from our new colleagues at EasyPractice about their experiences building and supporting a self-service practice management software with an intuitive platform.”“Today marks the beginning of an exciting new chapter for EasyPractice, one where we will be able to accelerate our mission and help more people than ever,” said Bo Møller, Co-Founder of EasyPractice. “As part of Nordhealth, we will be able to advance our international expansion and product offering,” adds Emil Højbjerg, Co-Founder of EasyPractice.Oliver Lindebod, the COO of EasyPractice adds; “We’ve been doing our best to build a business that provides exceptional service and a great product to clinics and therapists and I’m thrilled that we’ll now get to work with another of the suppliers in the market who takes quality, customer service, and product development seriously.”With EasyPractice, Nordhealth will gain a leading position in the Danish therapy software market and an affordable and intuitive solution that can be used by therapists internationally. As a part of Nordhealth, EasyPractice will be well-positioned to extend its mission of improving the work life of therapists. EasyPractice will operate independently under the EasyPractice brand, driving forward a continued focus on its mission, customers, and community. It will continue to be led by founders Bo and Emil and the current leadership team.Nordhealth will purchase EasyPractice for a total price of DKK 110 million which consists of DKK 80 million in cash upfront, subject to working capital and other adjustments and an additional contingent earn-out of up to DKK 30 million, based on the achievement of certain performance metrics in 2022.Nordhealth intends to schedule an investor group Q&A call on the acquisition of EasyPractice on Wednesday the 2nd of February, 2022 at 2pm CET hosted by CEO, Charles MacBain.Please use the following link: https://us02web.zoom.us/j/88323635925The presentation will be recorded and made available on nordhealth.com.For further information, please contact:Charles Macbain, CEOcharles.macbain@nordhealth.comView all news"
