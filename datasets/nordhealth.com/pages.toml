["https://nordhealth.com/news/acquisition-of-aspit-as"]
title = "Nordhealth completes the acquisition of Aspit AS | Nordhealth"
description = "Thousands of healthcare and veterinary professionals around the world use Nordhealth’s software and APIs to help improve care, save time and grow their business."
full_description = "Nordhealth completes the acquisition of Aspit ASAugust 02, 20212 June 2021, Nordhealth announced an agreement to acquire 100% of the shares outstanding in Aspit AS, to strengthen the market position and product offering in Norway.Aspit AS is a leading supplier of electronic patient record systems (EHR) and IT operations to the healthcare sector in Norway. More than 6 000 therapists use Aspit’s cloud-based Software as a Service (“SaaS”) products. Aspit's EHR systems have established a leading positions within the psychotherapy market with the product Psykbase, and the physiotherapy/chiropractor markets with the product Physica. In 2018, the company was granted a five-year national licensing contract with the Directorate for e-Health in Norway, which led to the launch of new solutions such as Envision and Capture, that allow clinicians to send and receive medical images, video and documents. Aspit also provides IT-operational services to several municipalities in Norway. Aspit is headquartered in Seljord, Telemark, with offices in Oslo and Arendal, and has 55 employees.“Aspit has a strong presence in the Norwegian market, and there are numerous synergies between our two companies that will help us to deliver even better products and services for our customers. We welcome our new Norwegian colleagues and look forward to building a dynamic and future-oriented organization together,” says Charles MacBain, CEO of Nordhealth, adding “Nordhealth bring together everything that’s required to manage a healthcare business digitally and the acquisition of Aspit is well aligned with our expansion strategy of acquisitions as well as organic growth.”“After spending the past twenty years building Aspit together with great colleagues and customers, it is a privilege to join forces with Nordhealth. Nordhealth shares the values that have been important to our success, such as healthy business ethics, long-term planning, the willingness to innovate and closeness to our customers. Together we will strengthen Norwegian and Nordic eHealth well into the future,” says CEO of Aspit, Dag Helge Haslekås.View all news"
