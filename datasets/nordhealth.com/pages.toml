["https://nordhealth.com/privacy"]
title = "Privacy | Nordhealth"
description = "Thousands of healthcare and veterinary professionals around the world use Nordhealth’s software and APIs to help improve care, save time and grow their business."
full_description = "PrivacyThis is Privacy Notice for Nordhealth Oy’s customers and prospects. Last modified on May 16th, 2023.1. ControllerNordhealth Oy (2162673-1)Aleksanterinkatu 30-3400100 Helsinki, Finlandtel. +358 19 425 1610(hereafter “we”)2. Contact email for register mattersdpo@nordhealth.com3. What is the purpose and the legal basis of processing personal data?The purposes of processing personal data are:the delivery and development of our products and services,fulfilling our contractual and other promises and obligations,taking care of the customer relationship,analyzing and profiling the behavior of a customer or other data subject,electronic direct marketing andtargeting advertising in our and others’ online services.The basis of processing personal data is our legitimate interest based on customer relationship and/or other relevant connection, to perform a contract and consent.4. What data do we process?We process the following personal data of our customers or other data subjects, such as the participants of our trainings, in connection with the customer register:basic information of the data subject* such as name, customer number, username and/or other identifier, password and preferred language;contact information of the data subject* such as email address, phone number, address;information of company and company’s contact persons such as business ID, names and contact details of the contact persons;possible prohibitions and consents of direct marketing;information of the participants of events and possible information regarding the event, such as special diets;information regarding the customer relationship and the contract such as past and current contracts and orders, user profile formed based on the customer relationship, call recordings, correspondence with the customer/data subject and other contacts, cookies and data related to using them;other possible information gathered with data subject’s consent.Providing personal data marked with an asterisk is a requirement for our contractual and/or customer relationship. Without the necessary information we are not able to provide the product and/or service.5. From where do we receive data?Our primary source is information that you submit as a customer.For the purposes described in this privacy notice, personal data may also be collected and updated from publicly available sources and based on information received from the authorities or other third parties within the limits of the applicable laws and regulations. Such updating of data is performed manually or by automated means.6. To whom do we disclose data, and do we transfer data outside the EU or the EEA?We don’t disclose data from the register to external parties.We use subcontractors that process personal data on our behalf.We transfer personal data outside the EU/EEA. When personal data is processed outside the EU/EEA, we make sure that the subcontractor has committed to use the EU Commission’s standard contractual clauses.7. How do we protect the data and how long do we store them?Only those of our employees, who on behalf of their work are entitled to process customer data, are entitled to use the system containing personal data. The data is technically protected. Access to the data requires adequate rights. Unauthorized access is also prevented by firewalls and technical protection. Only designated persons have the right to process and maintain the data. Users are bound by professional secrecy. The information system is backed up safely and can be restored as needed. Security checks are carried out on a regular basis.We store the data for the duration of the customer relationship and as required by applicable legislation.We assess the need for data storage regularly, taking into account the applicable legislation. In addition, we take care of such reasonable actions that ensure no incompatible, outdated or inaccurate personal data is stored in the register taking into account the purpose of the processing. We correct or erase such data without delay.8. What are your rights as a data subject?You have the right to inspect the personal data stored in the register concerning yourself and the right to demand rectification or erasure of the data. If you have access to your data, you may edit the data yourself. Insofar as the processing is based on consent, you also have the right to withdraw or change your consent. Withdrawing your consent does not affect the lawfulness of processing before the withdrawal of the consent.You have the right to object or to demand restriction of the processing of your data and to lodge a complaint with the supervisory authority.On grounds relating to your particular situation you also have the right to object other processing activities when the legal basis of processing is legitimate interest. In connection with your request, you shall identify the specific situation, based on which you object to the processing. We can refuse the request of objection only on legal grounds.9. Who can you be in contact with?All contacts and requests concerning this privacy policy shall be submitted in writing or in person to the person mentioned in section two (2)."
