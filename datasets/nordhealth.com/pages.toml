title = "Company | Nordhealth"
description = "We’re not your traditional healthcare software provider. For starters, we have strong Nordic roots. That drives us to challenge the status quo with modern design thinking and innovation."
full_description = "CompanyWe’re not your traditional healthcare software provider. For starters, we have strong Nordic roots. That drives us to challenge the status quo with modern design thinking and innovation.We’re all problem solvers at heart and love to get our teeth into new challenges regardless of complexity. But we don’t just build our own software, we also acquire others. We’ve been doing this since 2001 and we’re now the leading healthcare software provider in the Nordics.Provet Cloud is available in 44 countries supporting over 70,000 customers...— CEO Charles MacBain, Interviewed on FinansavisenOver 70 thousand healthcare professionals around the world use our software. This means that we affect over 20 million patients, a number that is growing daily. We’re immensely proud to make a change at this scale.You’re probably wondering what the secret is behind consistent delivery and sustained growth? Long days, too many coffees and frayed nerves? That's not how we do things....the software itself is not everything, it’s part of a complete package including our service...— CIO Janne Huttunen, Accepting the 2022 Finnish Software Entrepreneur of the Year awardIn the Nordics, there’s a saying “the morning is wiser than the evening.” It means if you’re not sure, sleep on it. Sounds simple but it holds a lot of wisdom. It’s how we remain at the sharp end of digital healthcare. We’re efficient and driven, but understand that big decisions require time and refined thought.Our mission is to redefine digital healthcare.Our valuesWith every ambition, comes a set of values. Ones that shape our day to day culture, define who we are, what we do, and how we push forward.Put customers firstNever overlook what really matters. Great service, ease of use, honest pricing, and respect for our customer’s time, money, and trust.Take ownershipThink long-term and take initiative. Care about the outcome. Be accountable. Do the right thing for us, our customers, and the team.Do more with lessSimplicity is the key to great results. Create fewer features, but make them great instead of just good. Dare to say “no” to prevent the core from being lost in the noise.Be stronger togetherEngage beginners and attract experts to grow excellent teams. This isn’t something we do on our own — it’s all about sharing and exchanging ideas.Embrace changeChallenge the status quo. Seek out and embrace continuous change, evolution, and improvement."
