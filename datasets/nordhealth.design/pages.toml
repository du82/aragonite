full_description = 'Nord CDNOverviewPackagesURL StructureSubresource IntegrityVersionsNord serves all of its packages via a Content Delivery Network for better performance and stability. Nord CDN also makes it faster to implement and use our packages in production.A content delivery network (CDN) is a group of geographically distributed servers that speed up the delivery of web content by bringing it closer to where users are. CDNs cache content like web pages, images, and video in proxy servers near to your physical location. Some of the benefits of using Nord’s CDN includes:Faster load times and better performance for all usersCDN scales more rapidly during heavy trafficMinimizes risk of traffic spikes at point of origin, ensuring stabilityDecreases infrastructure costs due to traffic offloadingFaster to get up and running with development workAvailable packages #The following packages are available for usage via Nord CDN:Web Components: https://nordcdn.net/ds/components/Design Tokens: https://nordcdn.net/ds/tokens/Themes: https://nordcdn.net/ds/themes/Webfonts: https://nordcdn.net/ds/fonts/CSS Framework: https://nordcdn.net/ds/css/Nordicons: https://nordcdn.net/ds/icons/Color Utilities: https://nordcdn.net/ds/color/Ag Theme Nord: https://nordcdn.net/ds/ag-theme-nord/URL structure #Nord CDN uses the following URL structure for the hosted packages:https://nordcdn.net/ds/<package>/<version>/<file>To fetch e.g. the Webfonts using the above format, you would write it like:https://nordcdn.net/ds/fonts/2.0.0/fonts.cssTo find URLs for Webfonts, see Webfonts documentationTo find URLs for Design Tokens, see Design Tokens documentationTo find URLs for Themes, see Themes documentationTo find URLs for Nordicons, see Nordicons documentationTo find URLs for Color Utilities, scroll down.To find URLs for AG Theme Nord, scroll down.Subresource Integrity #Subresource Integrity is a security feature that enables browsers to verify that resources they fetch from a CDN are delivered without unexpected manipulation. It works by allowing you to provide a cryptographic hash that a fetched resource must match (source: MDN).Our documentation automatically provides cryptographic hashes for the latest available package versions. To enable SRI verification, use the following tags in the <head> of your application:Design Tokens #<link rel="stylesheet" href="https://nordcdn.net/ds/tokens/7.1.2/tokens.custom-properties.css" integrity="sha384-oq5hOWENy+//pHZtNXU0kmwsnx1TBLmSyooW2y0lLhHM/OY1UJQmQsCLkj4T6yUR" crossorigin="anonymous" />Webfonts #<link rel="stylesheet" href="https://nordcdn.net/ds/fonts/3.0.2/fonts.css" integrity="sha384-dkSLlcNlq50O3Ils6+x72v07BbSaUb10p9/GEuuIJBcR1d0Nn+lDdvUQoXYz2Dq9" crossorigin="anonymous" />Web Components #<script type="module" src="https://nordcdn.net/ds/components/3.21.0/index.js" integrity="sha384-0lwc5YgP75SYFXh084QaXJqXzmT/hUy3iDLX6p/sTCfxKN0ATfwDDrtmxQEyfYpV" crossorigin="anonymous"></script>CSS Framework #<link rel="stylesheet" href="https://nordcdn.net/ds/css/3.4.0/nord.min.css" integrity="sha384-vP8vAwFE1NL05TTjbbZm1ptgW7ebDlHeBqUlh56k9her6dCKDsDkx9eEM7CHLMLA" crossorigin="anonymous" />Nordicons #<img src="https://nordcdn.net/ds/icons/3.7.0/assets/[ICON NAME].svg" height="24" width="24" alt="" />Themes #Theme: Light defaultTheme: Light high contrastTheme: Dark defaultTheme: Dark high contrast<!-- Light default theme --> <link rel="stylesheet" href="https://nordcdn.net/ds/themes/8.1.1/nord.css" integrity="sha384-0Cfi7HuwGy+wburyclpPdLl1Djoqk3OD3YVxD0Y6eHSe0JB0wYCq5MWjQagEwBcE" crossorigin="anonymous" /><!-- Light high contrast theme --> <link rel="stylesheet" href="https://nordcdn.net/ds/themes/8.1.1/nord-high-contrast.css" integrity="sha384-XxkWYGGTs7ql2s3/vXAFcy7o4LKft4SHVkfjSGTpJ6C8yl1K2XP/a0Jt9dD2Om50" crossorigin="anonymous" /><!-- Dark default theme --> <link rel="stylesheet" href="https://nordcdn.net/ds/themes/8.1.1/nord-dark.css" integrity="sha384-4mfQkitA1YUssjHukrfVhopnhPw9eM2tX8Z05rZ/5NJRmDJN1fQp2gGfwydx2SzL" crossorigin="anonymous" /><!-- Dark high contrast theme --> <link rel="stylesheet" href="https://nordcdn.net/ds/themes/8.1.1/nord-dark-high-contrast.css" integrity="sha384-lVjSY8vXAQ/hGmdyl5HjCVi08pGs1ZgbEuRF5t16MBwqaUxHWwwa4A91qnxlka1C" crossorigin="anonymous" />Color Utilities #<script src="https://nordcdn.net/ds/color/2.1.2/index.min.js" integrity="sha384-jxrTtdfF/6hvgvhLE4alDoHJFk9JrEs860SBDqh8N/S4EMQ6Q9UA3CTRLbAEGY3i" crossorigin="anonymous"></script>AG Theme Nord #<link rel="stylesheet" href="https://nordcdn.net/ds/ag-theme-nord/2.1.2/ag-theme-nord.min.css" integrity="sha384-NsmV8z1nnwWJXIdEazyqkWsKw2lKvViZtzCTRLEhx0hCaRQTTDoTazbJRggFP0S5" crossorigin="anonymous" />Available versions #Nord CDN includes versioned releases of the following packages starting from:@nordhealth/tokens: 1.0.0 and newer@nordhealth/themes: 2.0.0 and newer@nordhealth/fonts: 2.0.0 and newer@nordhealth/components: 1.0.0-alpha.23 and newer@nordhealth/css: 1.0.0-alpha.0 and newer@nordhealth/color: 1.0.0 and newer@nordhealth/ag-theme-nord: 1.0.0 and newerCan I use Nord CDN in my own project? #Nord Design System is solely meant for building digital products and experiences for Nordhealth. Please see the terms of use for full license details.Getting support #Need help with Nord CDN? Please head over to the Support page for more guidelines and ways to contact us. Was this page helpful?YesNoSend feedbackWe use this feedback to improve our documentation.Thank you for the feedback, your response has been saved. Edit page© 2025 Nordhealth Ltd Accessibility Terms of Use What’s New API status RSS Feed'
