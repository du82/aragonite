title = "Team | NoRedInk"
full_description = "Team We are a dedicated, passionate team of educators, engineers, designers, and advocates. .vertical-spacer-block { --vertical-spacer-height-xxs: calc(var(--wp--preset--spacing--xxs) * var(--wp--custom--scaling-percentage, 1));--vertical-spacer-height-xs: calc(var(--wp--preset--spacing--xs) * var(--wp--custom--scaling-percentage, 1));--vertical-spacer-height-s: calc(var(--wp--preset--spacing--s) * var(--wp--custom--scaling-percentage, 1));--vertical-spacer-height-m: calc(var(--wp--preset--spacing--m) * var(--wp--custom--scaling-percentage, 1));--vertical-spacer-height-l: calc(var(--wp--preset--spacing--l) * var(--wp--custom--scaling-percentage, 1));--vertical-spacer-height-xl: calc(var(--wp--preset--spacing--xl) * var(--wp--custom--scaling-percentage, 1));--vertical-spacer-height-xxl: calc(var(--wp--preset--spacing--xxl) * var(--wp--custom--scaling-percentage, 1));--vertical-spacer-height-xxxl: calc(var(--wp--preset--spacing--xxxl) * var(--wp--custom--scaling-percentage, 1)); } Jeff Scheur Founder and CEO After teaching high school English for 8 years and grading 15,000 papers, Jeff created NoRedInk to help his students improve their writing skills. A National Board Certified Teacher, former debate director, and speaker on education innovation, he is intent on improving the feedback loop in classrooms and empowering students to become skilled, creative, and confident writers. He holds an MA in Education from the University of Michigan, Ann Arbor, and a BA from Oberlin College. Blake Sipek CFO Coming Soon! Jennifer Dearman Senior VP of Customer Success Coming soon! Rebecca Sanchez Senior VP of Product Rebecca oversees Product, Engineering, Design, Growth, and Curriculum at NoRedInk. She has spent the past 18 years building products that help millions of students become better readers, writers, and communicators. Before joining NoRedInk, Rebecca led product development for IXL Learning’s ELA and Spanish products. Prior to that, she developed applications and digital media for educational publishers. She holds a BA from Pomona College. Robin Sykes Senior VP of Marketing Robin is the executive marketing leader at NoRedInk. She has devoted her career to helping students learn essential life skills, first as an elementary school teacher in Nashville, TN, and later as EVP of Global Marketing at EVERFI. Robin earned a BA from Gordon College and an MEd in Instructional Leadership from Lipscomb University. A native New Yorker who has spent most of her adult life in the south, Robin has finally started embracing the contraction “y’all.” Cindy Christensen Executive Assistant As the executive assistant to the CEO, Cindy manages the details necessary for our CEO and the executive team to focus their valuable time on what is most meaningful to the company. As a former special education teacher and a mother, she is proud to be part of a team that’s impacting education in a positive way. Tillie Fowles Head of Product Ops & Strategic Initiatives Tillie leads NoRedInk’s Product Ops and Strategic Initiatives and she formerly served as NoRedInk’s Head of Product Growth. Tillie previously worked in product growth for social change organizations and companies, finding new and creative ways to engage people to create change. She loves hiking and hanging with dogs, and she will never say no to a dance party. One of her favorite writing challenges is writing a six word story. Stacey Adams Staff Product Designer Stacey works on making NoRedInk more intuitive and delightful to use. In the process, she is also relearning all the grammar rules she used to know when she wrote commentaries for NPR at Youth Radio. Prior to NoRedInk, Stacey designed and developed mobile and Facebook games at Zynga and created virtual gifts and themes on LiveJournal. Stacey sighs every time she opens a fashion resale app and sees the abundance of items containing “sequence,” “heals,” and/or “razor back.” Ben Dansby Senior Product Designer Ben, or “Dansby” as he’s known in some circles, helps design the NoRedInk experience, figuring out ways to make the site easier to use, nicer to look at, and more laden with great features for teachers and students. He’s worked as a designer in FinTech and as a freelancer across industries from healthcare to robotics. Ben’s a pretty good speller but is a firm believer in the mutability of language. Eman Mehrez Senior Product Manager Eman helps to keep students, teachers and admins focused on what really matters. Working with the integrations teams, she makes sure NoRedInk users have easy access to all the information they need without having to juggle and context-change between different LMS. Prior to NoRedInk, Eman led the integrations initiatives at Unito.io, helping users stay focused, aligned, and efficient. In her free time, Eman enjoys spending time with her dog, reading historical fiction books, and experimenting with vegan recipes. Max Hoffman Senior Product Manager Max helps set the roadmap for what new features we will be building to help support teachers and students. He holds a BA in Computer Science from Vassar and a BE in Electrical Engineering from Dartmouth. Deciding that he was more interested in building products than designing circuits, he went directly into product management within the Edtech industry. An avid reader of all things sci-fi and fantasy, he often gets corrected for pronouncing words incorrectly that he learned from books. Elise Gaasenbeek Product Manager II Elise collaborates with the growth and product teams to help provide the best possible user experience and ensure teachers know exactly how NoRedInk can support them in the education process. Elise previously worked in a variety of industries where she helped companies explore new ways to communicate, connect, and create value for their prospects and customers. Elise lives in Toronto, Canada, where she enjoys playing sports, dancing, and diving into a great novel. She also enjoys making note of all the differences in how Americans and Canadians pronounce the same words (e.g., missile, finance, etc.) and likes to use excessive “eh’s” when it’s clear her American colleagues find the word entertaining. Stephanie Wye Director, Curriculum Stephanie works with the Curriculum Team to make NoRedInk’s content rigorous and engaging. Before joining NoRedInk, she taught middle school English in Madrid and created literacy curriculum and assessments for a charter network in New York City. She holds a BA in Linguistics and Spanish from Georgetown University and an EdM in Language and Literacy from the Harvard Graduate School of Education. Stephanie is delighted by regional variations in language like “wait in line” versus “wait on line.” Natalie Chapman Manager, Curriculum Natalie works with the Curriculum Team to develop engaging content for students. Before joining NoRedInk, Natalie taught middle school English in Washington, DC, for six years. She holds a BA in Social Studies from Harvard and a MEd in General and Special Education from Lesley University. Natalie giggles when affected by the ineffective use of “affect” and “effect.” Allison Hamilton Curriculum Designer II Before joining the Curriculum team, Allison taught AP Research, AP Literature, and a handful of other high school English courses. She also created ELA curriculum for two charter networks, worked as a freelance writer and editor, and spent two years in Prague teaching English as a foreign language. Allison earned her BA in English Literature and Religious Studies from Rockhurst University in Kansas City and her Master’s in Secondary English Education from Regis University in Denver. Though she currently lives in Brooklyn, she never misses an opportunity to use a folksy, midwestern aphorism like “you can’t get blood from a turnip” or “better not look a gift horse in the mouth.” Anna Smith Curriculum Designer II Anna works with the Curriculum Team to design engaging content for students. Before joining NoRedInk, she taught at an elementary school in Austin, TX. She has designed curriculum in a variety of non-traditional learning capacities over the years and spent time as an outdoor education facilitator. She holds a BA in Spanish from Hamilton College and an MEd in Curriculum and Instruction from the University of Texas at Austin. Anna loves hyperboles more than anything, but it’s taken her an eternity to think of a good one to share here. Katina Vradelis Senior Curriculum Designer Katina helps the Curriculum team work their curriculum magic! Before NoRedInk, she spent several years at another edtech company; before that, she studied linguistics at the University of Chicago and worked with a delightful bunch of gifted teens. She loves especially apt eggcorns (preying mantis) and rebracketings (but that’s a whole nother story). Sam Cooper Curriculum Designer II Originally from the UK, Sam taught English in Spain and Germany before becoming a curriculum designer at NoRedInk. Sam holds a BA in German and Linguistics from the University of Oxford and a postgraduate diploma in TESOL. As a linguist, Sam loves spotting increasingly subtle differences between US and UK English. Selorm Quist Curriculum Designer I Sel supports the Curriculum team’s curricular dreams! In addition to a stint as a foreign policy analyst, she has been a museum educator, a college writing tutor, and an English curriculum designer for schools in East Africa. She holds a BA in Sociology from Rutgers, and she earned her MS in International Affairs at The New School. Sel enjoys dramatic interjections and the art of verbification. Blake Thomas Director, Engineering Blake draws on nearly two decades of experience in engineering to support the work, growth, and accomplishments of the exceptional engineers, team leads, and managers he has the privilege of working with. Blake studied mathematics at the University of Chicago, which leads Blake’s partner to believe he is at least minimally qualified to sum rubrics for her ELA students’ assignments. Joke’s on her, and in retaliation, he regularly uses the ampersand in direct contravention of the MLA. Anita Nuthi Senior Manager, Engineering Anita is an engineering manager and team lead for one of our feature teams. Prior to joining NoRedInk, she worked in various industries including process control, telecommunications, broadband over power lines, and event management. Anita is working on breaking her habit of writing extra long sentences joined with lots of commas, semicolons, and colons. Alec Munro Manager, Engineering As a big believer in the empowering value of technology, Alec has spent over 20 years learning to build systems that deliver great experiences. These days, he’s convinced that looking after the people using those systems has to be the starting point for any such effort. He is frequently vexed by how many homophones and homographs “right” has. Collin Doering Senior Manager, Engineering Collin is an engineering manager and team lead who has a passion for working on projects and at companies that align with “social good”. He currently works with multiple teams. Prior to joining at NoRedInk, Collin worked in the computer security and healthcare industries. He is also a long-time, avid computing hobbyist with interests spanning infrastructure, hardware, security, Free Software, functional programming and package management (Guix/Nix) and, in the very distant past, the Java ecosystem. In his spare time, he likes to spend time with his family, including two young sons, as well as go outside for various activities, including hiking, biking, snowboarding, and boating. Faraaz Ismail Manager, Engineering Faraaz focuses on team execution and individual growth for a couple of engineering teams. Previously, he worked in the health insurance, climate & logistics, and email startup spaces. Outside of work, he spoils his cat and dabbles in a variety of activities: improv, crafting, board games, and many more! He is fascinated by how people remember the large number of special rules in the English language. Kristen Riley Manager, Engineering Kristen is an engineering manager for the growth and marketing team. Prior to NoRedInk, she led a product team delivering award-winning identity governance software. She has worn a number of hats, from designer and user experience lead to program manager, product manager, and scaled agile expert. After many years of rephrasing ambiguous English terms for translation teams, she is still impressed by how many ways short phrases like “review details” can be interpreted. When not working, Kristen can be found outdoors, on the water or in the mountains and woods. Brian Cardiff Staff Software Engineer Before joining NoRedInk, Brian worked on maintaining the Crystal programming language and on open source humanitarian and public health software projects. He was also a TA in computer science for 10 years. He likes UX, visualizations, formal methods, and knowing how things work. He can hardly work with swing, jazz and blues music on; he would rather dance to it. Brian Carroll Staff Software Engineer Brian lives in Ireland, and he’s been working in technology for over 20 years. These days, he helps to make sure our site is able to welcome more and more students while we continue making it better and better. Some day, he hopes to be able to spell the word “Quetzalcoatlus” correctly without looking it up. Juan Edi Staff Software Engineer Juan worked on open source humanitarian and public health software projects before joining NoRedInk. He was also a TA at Concurrency and Programming Paradigms classes in Buenos Aires and loves helping teachers and students for a living. Although usually an even-tempered fellow, he’s quite fond of quotation marks and dies a little inside when people use them for emphasis. Juan Wajnerman Staff Software Engineer Juan (aka Waj) has spent more than 20 years telling computers what to do. He enjoys solving problems and performance issues, bringing software ideas to life, and working on the Crystal programming language. He loves traveling, especially on airplanes. Maybe one day, he will learn to play the piano. Juliano Solanho Staff Software Engineer Juliano lives in Brazil and loves cooking singing cats and the importance of commas. Their work is making sure our servers are happy as NoRedInk grows. They’re a Recurse Center alum who loves new approaches to education. Micah Hahn Staff Software Engineer Micah is the only member of his family that did not become a teacher; he simply loves programming too much. So, as a happy compromise, he writes software to help teachers foster students’ writing skills at NoRedInk. Micah is passionate about functional programming and enjoys ambiguous grammar in English, but most definitely not in programming languages. Micah and his wife reside in beautiful Astoria, Queens. Charbel Rami Senior Software Engineer Charbel works with the Accessibility team to ensure everyone can use NoRedInk. He lives "
