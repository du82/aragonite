full_description = "FPSScale your FPS to millions of players instantly and keep latency low.Normcore utilizes multiple cloud providers to host game servers all over the world, ensuring optimal latency and unparalleled uptime even as you scale to millions of users.If you've ever launched a large title, you know that latency and uptime can make or break your game. When your title blows up on TikTok, you want your infrastructure be confident that your infrastructure will scale automatically to handle new players.Start NowContact SalesHow our customers use Normcore.Joy Way, an award-nominated game development studio known for its critically acclaimed VR title STRIDE, has once again pushed the boundaries of virtual reality gaming with its latest release: Stack.With Stack, Joy Way utilizes Normcore to deliver a fast-paced title, low-latency experience.Joy WayAvailable on Steam and the Meta Quest store.Sail is an open world pirate adventure game inspired by games like Sea of Thieves & Assassin's Creed Black Flag.Normcore provided the tools needed for Red Team Interactive to prototype, develop, and ship a multiplayer title, at scale, with zero prior multiplayer experience.SailAvailable on the Meta Quest store.Joy WaySailWhat our customers are saying.Throwback Studios used Normal's Normcore Unity package to more quickly build and scale Derby, a free-to-play multiplayer social park. We took full advantage of Normal's elastic cloud and pricing to more affordably and reliably handle rapid concurrent player growth after finding viral video success on TikTok.- Cody Woputz, Co-Founder & CTO, Throwback StudiosAt GOLF+ the multiplayer experience is core to our offering. Golfers love playing with friends, and new people, and Normcore has made it extremely easy for us to seamlessly connect hundreds of thousands of people playing all across the world. There's no better solution in the market for adding multiplayer to your title.- Ryan Engle, Founder and CEO, GOLF+I love how easy it was to add Normcore to my game. It's been simple to set up, and honestly, the voice quality is superb. It feels like you're right there talking to someone face-to-face. Networked Physics and Object Ownership really bring the game to life; you can grab a ball, toss it, and it behaves just as you'd expect.- Kenneth Lemieux, CEO, Loud Shirt GamesWe use Normcore to handle network physics for all experiences including basketball, football and baseball in Big Ballers. I find Normcore by far to be the easiest and most intuitive networking solution. The Normal team is active and responsive in their discord which is invaluable. Excellent DevUX for what is typically a vastly complicated field.- Chris Walz, CEO & Chief Game Designer, Doge LabsA dependable networking solution is crucial for the fast-paced gameplay in Blacktop Hoops. We use Normcore for all things multiplayer. Blacktop Hoops features 1v1, 2v2, 3v3 and 4v4 matches, half court and full court. We have casual and ranked games. Normcore handles all real-time multiplayer.- Nathaniel Ventura, CEO, Vinci GamesNormcore has enabled me to create shared virtual worlds that used to require a dedicated networking team in the past. The quality and consistency of both the Normcore plugin and its team have turned me into a fanboi.- Mischa Winkler, Founder, RevelUsed by the best.Customer StoriesReady to get started?Start developing for free. The best way to evaluate Normcore is to try it out.Start NowContact SalesAlways know what you pay.Pay only for what you use, with no hidden fees or CCU caps.PricingTry our examplesAdd multiplayer to any project in a few minutes.Documentation"
