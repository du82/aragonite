full_description = "Simple pricing.Don't let a big day ruin your bill for the month.Normcore only bills for the room servers and bandwidth you actually use. We don't measure your peak CCUs to determine your bill for the whole month.PublicFreeGet up and running quickly with our generous free tier. No credit card required.Included Features:30 concurrent users10 rooms1-hour session limit50 room hours120GB of bandwidthStart NowPro$49/ moUse Normcore with unlimited concurrent users. Includes enough usage for most applications.Included Features:Unlimited concurrent usersUnlimited roomsNo session limits1000 room hours3TB of bandwidthStart NowUnlimited$49/ mo + useUse Normcore without any limits. Get everything included in the Pro tier and pay only for what you use beyond that.Included Features:Unlimited concurrent usersUnlimited roomsNo session limits1000 room hours then $0.01/HR3TB of bandwidth then $0.10/GBStart NowSupport Add-onsDiscord SupportFreeJoin the Normcore team in our official Discord. It's a great place to ask our team questions, show off your projects, and get hired to work on other Normcore projects.Join nowEnterprise SupportGet dedicated support from Normal. Each plan comes with a dedicated account manager, private Slack support channel, and guaranteed response times.Need a feature? Support plans can be used to prioritize what features our team implements next.Contact SalesCustomized PlansVolume discountsPrivate hostingServer-side pluginsOn-premisesContact Sales"
