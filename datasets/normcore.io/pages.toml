full_description = "Live EventsHost live events for anyone, anywhere in the world.Use Normcore to create rich experiences that scale to millions of people. From interactive concerts to virtual festivals and live shows, Normcore gives you the tools to create shared experiences that audiences can join from anywhere.With Normcore's native WebGL support you can reach even more people. Provide same great experience you'd expect from a native Unity build, directly from the web, with no installation required.Start NowContact SalesHow our customers use Normcore.The Museum of Other Realities is an immersive social art showcase in VR, the Museum of Other Realities (MOR) is a place to connect, share, and experience virtual reality art with others.One of the first experiences built with Normcore, The MOR shaped the way people experience digital art.Museum of Other RealitiesAvailable on Steam.Shopify is an all-in-one commerce that powers millions of businesses worldwide. In an effort to improve their remote work culture, they created Shopify Party, a browser-based internal tool designed to inject fun and interactivity into their virtual hangouts.Utilizing Normcore's WebGL support, they've deployed Party to 10,000+ employees. Read more about it in their blog post here: https://shopify.engineering/how-we-built-shopify-party.ShopifyAn internal tool for collaboration at Shopify.Softspace is a spatial collaboration tool and AI knowledge engine. Browse the web, pin up images, draft notes, and explore the connections between concepts.Normcore provides the framework necessary to allow Softspace to connect their users in real-time.SoftspaceAvailable on the Meta Quest store.The Wild is a tool for teams to present, collaborate, and review projects from anywhere. Easily present files from Revit, SketchUp, and Bim 360 workflows.Normcore's real-time networking, built-in avatars, and voice chat enable The Wild to connect teams anywhere in the world.The WildAvailable for the Meta Quest, Pico, and Valve Index.Museum of Other RealitiesShopifySoftspaceThe WildWhat our customers are saying.At GOLF+ the multiplayer experience is core to our offering. Golfers love playing with friends, and new people, and Normcore has made it extremely easy for us to seamlessly connect hundreds of thousands of people playing all across the world. There's no better solution in the market for adding multiplayer to your title.- Ryan Engle, Founder and CEO, GOLF+A dependable networking solution is crucial for the fast-paced gameplay in Blacktop Hoops. We use Normcore for all things multiplayer. Blacktop Hoops features 1v1, 2v2, 3v3 and 4v4 matches, half court and full court. We have casual and ranked games. Normcore handles all real-time multiplayer.- Nathaniel Ventura, CEO, Vinci GamesNormcore has enabled me to create shared virtual worlds that used to require a dedicated networking team in the past. The quality and consistency of both the Normcore plugin and its team have turned me into a fanboi.- Mischa Winkler, Founder, RevelI love how easy it was to add Normcore to my game. It's been simple to set up, and honestly, the voice quality is superb. It feels like you're right there talking to someone face-to-face. Networked Physics and Object Ownership really bring the game to life; you can grab a ball, toss it, and it behaves just as you'd expect.- Kenneth Lemieux, CEO, Loud Shirt GamesNormcore makes the decision to add multiplayer a no-brainer. It doesn’t matter if it’s VR, 2D, or on the web. It’s straightforward, easy to set up, and it just works. At Shopify, we were able to build a full social web experience with networked physics and voice in no time. I still can’t believe it can run like butter at 120fps…in a browser!- Daniel Beauchamp, ShopifyThrowback Studios used Normal's Normcore Unity package to more quickly build and scale Derby, a free-to-play multiplayer social park. We took full advantage of Normal's elastic cloud and pricing to more affordably and reliably handle rapid concurrent player growth after finding viral video success on TikTok.- Cody Woputz, Co-Founder & CTO, Throwback StudiosUsed by the best.Customer StoriesReady to get started?Start developing for free. The best way to evaluate Normcore is to try it out.Start NowContact SalesAlways know what you pay.Pay only for what you use, with no hidden fees or CCU caps.PricingTry our examplesAdd multiplayer to any project in a few minutes.Documentation"
