full_description = "EsportsCreate the next esport in weeks, not years.Normcore isn’t just multiplayer networking, it’s a collection of all of the common building blocks that every multiplayer title needs. One of the most important for any esport: Networked Physics.Most AAA studios have an entire team dedicated to networked physics. With Normcore, you get AAA-level physics with native Rigidbody and Rigidbody2D support, smooth interpolation, and prediction out of the box.Start NowContact SalesHow our customers use Normcore.Golf+ is the exclusive VR Golf game of the PGA Tour and Top Golf. With over 52,000 reviews, Golf+ has been in the list of top 20 paid titles on Meta Quest for 4+ years.Normcore has been instrumental in enabling Golf+ to connect hundreds of thousands of players worldwide.GOLF+Available on the Meta Quest store.Gym Class is the #1 most-played sports game on the Meta Quest store and has an official partnership with the NBA.With Normcore's robust infrastructure and scalable architecture, Gym Class is well-equipped to handle the demands of its rapidly growing player base.Gym ClassAvailable on the Meta Quest store.Nock is a multiplayer bow and arrow soccer created by Normal. It's fast-paced movement requires ultra low latency network synchronization provided by Normcore.Developed by the same folks that built Normcore, Nock pushes our team to continually push the limits of what Normcore technology can do.NockAvailable on Steam, PlayStation, and the Meta Quest store.GOKA Street is a mobile soccer game for iPhone and iPad created by Blay Games and has featured by Apple on the iOS App store.Normcore has allowed GOKA Street to handle explosive growth from various app store features and hype surrounding the game.GOKA StreetAvailable on the iOS App Store and Google Play Store.Joy Way, an award-nominated game development studio known for its critically acclaimed VR title STRIDE, has once again pushed the boundaries of virtual reality gaming with its latest release: Stack.With Stack, Joy Way utilized Normcore to deliver a fast-paced, low-latency experience.Joy WayAvailable on Steam and the Meta Quest store.One of the most popular online VR sports games, Big Ballers VR delivers a fully multiplayer game with up to 10 players per park.Normcore powers high-octane immersive physics that fit all kinds of unique playstyles.Big BallersAvailable on the Meta Quest store.Blacktop Hoops is a streetball-inspired multiplayer basketball game. Complete against players across the globe in epic streetball matches.With Normcore, Backtop Hoops is building a competitive basketball game designed for the metaverse.Blacktop HoopsAvailable on Steam and the Meta Quest store.Derby is one of the top multiplayer baseball experiences. Meet friends, play baseball, and more.Normcore provides the scalable architecture needed for everything from competitive 1v1 games to a full-sized social park.DerbyAvailable on the Meta Quest store.GOLF+Gym ClassNockGOKA StreetJoy WayBig BallersBlacktop HoopsDerbyWhat our customers are saying.Normcore has enabled me to create shared virtual worlds that used to require a dedicated networking team in the past. The quality and consistency of both the Normcore plugin and its team have turned me into a fanboi.- Mischa Winkler, Founder, RevelI love how easy it was to add Normcore to my game. It's been simple to set up, and honestly, the voice quality is superb. It feels like you're right there talking to someone face-to-face. Networked Physics and Object Ownership really bring the game to life; you can grab a ball, toss it, and it behaves just as you'd expect.- Kenneth Lemieux, CEO, Loud Shirt GamesAt GOLF+ the multiplayer experience is core to our offering. Golfers love playing with friends, and new people, and Normcore has made it extremely easy for us to seamlessly connect hundreds of thousands of people playing all across the world. There's no better solution in the market for adding multiplayer to your title.- Ryan Engle, Founder and CEO, GOLF+Throwback Studios used Normal's Normcore Unity package to more quickly build and scale Derby, a free-to-play multiplayer social park. We took full advantage of Normal's elastic cloud and pricing to more affordably and reliably handle rapid concurrent player growth after finding viral video success on TikTok.- Cody Woputz, Co-Founder & CTO, Throwback StudiosWe use Normcore to handle network physics for all experiences including basketball, football and baseball in Big Ballers. I find Normcore by far to be the easiest and most intuitive networking solution. The Normal team is active and responsive in their discord which is invaluable. Excellent DevUX for what is typically a vastly complicated field.- Chris Walz, CEO & Chief Game Designer, Doge LabsSail's multiplayer is built on Normcore. Normcore has been easy for us to learn and extremely reasonable in terms of pricing and feature sets we need to build our game. Combined with voice chat, it made it incredibly easy for us to build out Sail's multiplayer in a short amount of time. We can’t recommend Normcore enough.- Garett Cook, Founder, Red Team InteractiveUsed by the best.Customer StoriesReady to get started?Start developing for free. The best way to evaluate Normcore is to try it out.Start NowContact SalesAlways know what you pay.Pay only for what you use, with no hidden fees or CCU caps.PricingTry our examplesAdd multiplayer to any project in a few minutes.Documentation"
