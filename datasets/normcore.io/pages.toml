full_description = "Senior Staff SWE: Scalable API DeveloperFull Time, Remote. Posted 01/06/2025SummaryWe're hiring a Senior Staff Typescript, Postgres, TimescaleDB engineer to contribute to our Matchmaking, Player Accounts, Lobby, and Leaderboard APIs. We're looking for developers who have experience scaling REST APIs and Postgres databases beyond simply adding indexes or connection pools.Key QualificationsExperience working with type-safe Postgres queries, and scaling large Postgres applications is required. Bonus points if you have professional experience with TimescaleDB.Experience building performant REST APIs with Typescript and Node.Strong knowledge of web application architecture and design patternsExperience with Git, Continuous Integration/Continuous Deployment (CI/CD), and Agile methodologiesBachelor's degree or higher in Computer Science or a related field, or equivalent work experienceStrong analytical and problem-solving skillsAbility to work collaboratively in a team environment and communicate effectively with both technical and non-technical stakeholdersExperience with cloud technologies, such as AWS or Azure, is a plusExperience with VR or AR development is a plusDescriptionIn addition to real-time multiplayer APIs, Normcore includes APIs for analytics, leaderboards, matchmaking, lobbies, and accounts for game developers to easily build these features into their games without having to develop or scale their own backend.We're hiring a Senior Staff Typescript + Postgres engineer to contribute to these APIs and work with game developers to design the ideal APIs for them. We're looking for developers who have experience scaling REST APIs and Postgres databases beyond simply adding indexes or connection pools.This is a full-time remote role for a Senior Staff Typescript, Node, Postgres, TimescaleDB Developer working on Normcore's cloud game server products. You will be responsible for designing and developing modern, responsive, and scalable web applications and REST APIs. Game developers will use these services to power the games they develop. Therefore, they need to be performant, and they need to scale. You will work closely with other developers, product managers, and stakeholders to identify requirements and translate them into technical solutions.EducationBachelor of Science / Computer Science, or equivalent professional experience.Reach Out!Whether you think you're a good fit or not, we want to hear from you. Got impostor syndrome? Don’t think you’re the best person for the job? Nonsense! We want this to be a place for you to learn. Shoot us a message anyway. It won't take more than a minute :)jobs@normalvr.com"
