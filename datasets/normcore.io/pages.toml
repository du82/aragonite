ux, CEO, Loud Shirt GamesNormcore cross-platform design, coupled with exceptional voice chat capabilities, provided us with the low-latency, high-quality communication essential for immersive gameplay. Normcore isn't just our multiplayer solution; it's the backbone of our game's success. Our 4.9/5.0 rating proves my point.- Michal Wroblewski, Game Developer, Rooms of RealitiesSail's multiplayer is built on Normcore. Normcore has been easy for us to learn and extremely reasonable in terms of pricing and feature sets we need to build our game. Combined with voice chat, it made it incredibly easy for us to build out Sail's multiplayer in a short amount of time. We can’t recommend Normcore enough.- Garett Cook, Founder, Red Team InteractiveNormcore makes the decision to add multiplayer a no-brainer. It doesn’t matter if it’s VR, 2D, or on the web. It’s straightforward, easy to set up, and it just works. At Shopify, we were able to build a full social web experience with networked physics and voice in no time. I still can’t believe it can run like butter at 120fps…in a browser!- Daniel Beauchamp, ShopifyWe ranked 16 different frameworks for a variety of different features. Normcore was the clear winner in those tests. The API was something that meshed well with our game, and we’re delighted with our decision to use Normcore!- Andrew Eiche, CEO, Owlchemy LabsUsed by the best.Customer StoriesReady to get started?Start developing for free. The best way to evaluate Normcore is to try it out.Start NowContact SalesAlways know what you pay.Pay only for what you use, with no hidden fees or CCU caps.PricingTry our examplesAdd multiplayer to any project in a few minutes.Documentation"
