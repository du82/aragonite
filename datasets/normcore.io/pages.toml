full_description = "Installations & LBERun Normcore on-location for your installation or arcade.Normcore Private On-Premises can be run anywhere from a single computer on-location to your own datacenter. Our servers run on Windows, Mac, and Linux, anywhere you need them.Start developing for free on Normcore Public, and when you're ready, switch your application to Normcore Private in less than 5 minutes. No code changes necessary.Start NowContact SalesHow our customers use Normcore.The Dream Machine Experience was created by Nona Hendryx with designs by XR artist Sutu.Installed at The Lincoln Center in New York, The Dream Machine utilized Normcore to power multiplayer for their location-based installation.SutuShown at The Lincoln Center NY.Spacebar Arcade is a multiplayer VR arcade world set in the wild fringe of cyberspace. Built as a two-story tall arcade cabinet for AWE, players could enter an immersive space built on-location.Normcore powered on-location offline multiplayer without relying on the conference center internet for a smooth experience.Spacebar ArcadeCreated for Augmented World Expo.SutuSpacebar ArcadeWhat our customers are saying.A dependable networking solution is crucial for the fast-paced gameplay in Blacktop Hoops. We use Normcore for all things multiplayer. Blacktop Hoops features 1v1, 2v2, 3v3 and 4v4 matches, half court and full court. We have casual and ranked games. Normcore handles all real-time multiplayer.- Nathaniel Ventura, CEO, Vinci GamesAt GOLF+ the multiplayer experience is core to our offering. Golfers love playing with friends, and new people, and Normcore has made it extremely easy for us to seamlessly connect hundreds of thousands of people playing all across the world. There's no better solution in the market for adding multiplayer to your title.- Ryan Engle, Founder and CEO, GOLF+Sail's multiplayer is built on Normcore. Normcore has been easy for us to learn and extremely reasonable in terms of pricing and feature sets we need to build our game. Combined with voice chat, it made it incredibly easy for us to build out Sail's multiplayer in a short amount of time. We can’t recommend Normcore enough.- Garett Cook, Founder, Red Team InteractiveThrowback Studios used Normal's Normcore Unity package to more quickly build and scale Derby, a free-to-play multiplayer social park. We took full advantage of Normal's elastic cloud and pricing to more affordably and reliably handle rapid concurrent player growth after finding viral video success on TikTok.- Cody Woputz, Co-Founder & CTO, Throwback StudiosI love how easy it was to add Normcore to my game. It's been simple to set up, and honestly, the voice quality is superb. It feels like you're right there talking to someone face-to-face. Networked Physics and Object Ownership really bring the game to life; you can grab a ball, toss it, and it behaves just as you'd expect.- Kenneth Lemieux, CEO, Loud Shirt GamesWe ranked 16 different frameworks for a variety of different features. Normcore was the clear winner in those tests. The API was something that meshed well with our game, and we’re delighted with our decision to use Normcore!- Andrew Eiche, CEO, Owlchemy LabsUsed by the best.Customer StoriesReady to get started?Start developing for free. The best way to evaluate Normcore is to try it out.Start NowContact SalesAlways know what you pay.Pay only for what you use, with no hidden fees or CCU caps.PricingTry our examplesAdd multiplayer to any project in a few minutes.Documentation"
