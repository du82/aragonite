s. The API was something that meshed well with our game, and we’re delighted with our decision to use Normcore!- Andrew Eiche, CEO, Owlchemy LabsAt GOLF+ the multiplayer experience is core to our offering. Golfers love playing with friends, and new people, and Normcore has made it extremely easy for us to seamlessly connect hundreds of thousands of people playing all across the world. There's no better solution in the market for adding multiplayer to your title.- Ryan Engle, Founder and CEO, GOLF+We use Normcore to handle network physics for all experiences including basketball, football and baseball in Big Ballers. I find Normcore by far to be the easiest and most intuitive networking solution. The Normal team is active and responsive in their discord which is invaluable. Excellent DevUX for what is typically a vastly complicated field.- Chris Walz, CEO & Chief Game Designer, Doge LabsThrowback Studios used Normal's Normcore Unity package to more quickly build and scale Derby, a free-to-play multiplayer social park. We took full advantage of Normal's elastic cloud and pricing to more affordably and reliably handle rapid concurrent player growth after finding viral video success on TikTok.- Cody Woputz, Co-Founder & CTO, Throwback StudiosNormcore cross-platform design, coupled with exceptional voice chat capabilities, provided us with the low-latency, high-quality communication essential for immersive gameplay. Normcore isn't just our multiplayer solution; it's the backbone of our game's success. Our 4.9/5.0 rating proves my point.- Michal Wroblewski, Game Developer, Rooms of RealitiesNormcore has enabled me to create shared virtual worlds that used to require a dedicated networking team in the past. The quality and consistency of both the Normcore plugin and its team have turned me into a fanboi.- Mischa Winkler, Founder, RevelUsed by the best.Customer StoriesReady to get started?Start developing for free. The best way to evaluate Normcore is to try it out.Start NowContact SalesAlways know what you pay.Pay only for what you use, with no hidden fees or CCU caps.PricingTry our examplesAdd multiplayer to any project in a few minutes.Documentation"
