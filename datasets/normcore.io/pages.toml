full_description = "Remote CollaborationCreate tools for real-time remote collaboration.Normcore isn't only for games. We have teams around the world using it to create tools for remote collaboration. Bring your team together for real-time meetings, concert pre-visualization, client presentations, team building games, and more.With Normcore's WebGL support, provide same great experience you'd expect from a native Unity build, directly from the web, with no installation required.Start NowContact SalesHow our customers use Normcore.Softspace is a spatial collaboration tool and AI knowledge engine. Browse the web, pin up images, draft notes, and explore the connections between concepts.Normcore provides the framework necessary to allow Softspace to connect their users in real-time.SoftspaceAvailable on the Meta Quest store.Shopify is an all-in-one commerce that powers millions of businesses worldwide. In an effort to improve their remote work culture, they created Shopify Party, a browser-based internal tool designed to inject fun and interactivity into their virtual hangouts.Utilizing Normcore's WebGL support, they've deployed Party to 10,000+ employees. Read more about it in their blog post here: https://shopify.engineering/how-we-built-shopify-party.ShopifyAn internal tool for collaboration at Shopify.Tangle is a remote collaboration platform that aims to make remote work culture more enjoyable by fostering better connections among team members.Powered by Normcore, Tangle offers an always-on, virtual space for teams to collaborate, communicate, and bond.TangleAvailable on tangle.global.The Wild is a tool for teams to present, collaborate, and review projects from anywhere. Easily present files from Revit, SketchUp, and Bim 360 workflows.Normcore's real-time networking, built-in avatars, and voice chat enable The Wild to connect teams anywhere in the world.The WildAvailable for the Meta Quest, Pico, and Valve Index.SoftspaceShopifyTangleThe WildWhat our customers are saying.Normcore cross-platform design, coupled with exceptional voice chat capabilities, provided us with the low-latency, high-quality communication essential for immersive gameplay. Normcore isn't just our multiplayer solution; it's the backbone of our game's success. Our 4.9/5.0 rating proves my point.- Michal Wroblewski, Game Developer, Rooms of RealitiesThrowback Studios used Normal's Normcore Unity package to more quickly build and scale Derby, a free-to-play multiplayer social park. We took full advantage of Normal's elastic cloud and pricing to more affordably and reliably handle rapid concurrent player growth after finding viral video success on TikTok.- Cody Woputz, Co-Founder & CTO, Throwback StudiosI love how easy it was to add Normcore to my game. It's been simple to set up, and honestly, the voice quality is superb. It feels like you're right there talking to someone face-to-face. Networked Physics and Object Ownership really bring the game to life; you can grab a ball, toss it, and it behaves just as you'd expect.- Kenneth Lemieux, CEO, Loud Shirt GamesSail's multiplayer is built on Normcore. Normcore has been easy for us to learn and extremely reasonable in terms of pricing and feature sets we need to build our game. Combined with voice chat, it made it incredibly easy for us to build out Sail's multiplayer in a short amount of time. We can’t recommend Normcore enough.- Garett Cook, Founder, Red Team InteractiveAt GOLF+ the multiplayer experience is core to our offering. Golfers love playing with friends, and new people, and Normcore has made it extremely easy for us to seamlessly connect hundreds of thousands of people playing all across the world. There's no better solution in the market for adding multiplayer to your title.- Ryan Engle, Founder and CEO, GOLF+We use Normcore to handle network physics for all experiences including basketball, football and baseball in Big Ballers. I find Normcore by far to be the easiest and most intuitive networking solution. The Normal team is active and responsive in their discord which is invaluable. Excellent DevUX for what is typically a vastly complicated field.- Chris Walz, CEO & Chief Game Designer, Doge LabsUsed by the best.Customer StoriesReady to get started?Start developing for free. The best way to evaluate Normcore is to try it out.Start NowContact SalesAlways know what you pay.Pay only for what you use, with no hidden fees or CCU caps.PricingTry our examplesAdd multiplayer to any project in a few minutes.Documentation"
