["https://normcore.io/privacy"]
title = "Privacy - Normcore"
description = "Seamless multiplayer for Unity. Add multiplayer to any Unity app, scale to millions of users automatically."
full_description = "PrivacyLast update: April 18, 2019This Privacy Policy explains how we at Normal VR, LLC (“Normal,” “we,” “our,” “us”) collect, use, and disclose information through our websites (including normalvr.com, normcore.io, dashboard.normcore.io, and our blog at www.normalvr.com/blog, our other online products and services that link to this Privacy Policy (collectively, the “Services”), or when you otherwise interact with us. This policy does not apply to the information of end users of our customers who may be using our Normcore plugin with their own application or product.We may change this Privacy Policy from time to time. If we make changes, we will notify you by revising the date at the top of the policy and, in some cases, we may provide you with additional notice (such as adding a statement to our homepage or sending you a notification). We encourage you to review the Privacy Policy whenever you access the Services or otherwise interact with us to stay informed about our information practices and the choices available to you.Collection of InformationInformation You Provide to UsWe collect information you provide directly to us. For example, we collect information when you create an account to use our Normcore service as a developer, participate in any interactive features of the Services, submit a comment to our Normal blog, fill out a form, participate in a contest or promotion, make a purchase, apply for a job, communicate with us via third party social media sites, request customer support, or otherwise communicate with us. The types of information we may collect include your name, email address, company name and information, website address, payment information (processed by a third party), the name of your application, billing information, and any other information you choose to provide.Information About Your Use of the ServicesUsage InformationWe collect some information about your use of the Services. For example, when you make use of our Normcore plugin, we collect some information on your usage such as the IP address your usage originates from, a list of room names created by your application, a timestamp when a user connects and disconnects from our multiplayer servers, a temporary identifier for users connected to our Services, and bandwidth usage data for both statistical and billing purposes.Automatically Collected InformationWhen you access or use our Services, we automatically collect some information about you, including:Log Information: We collect log information about your use of the Services, including the type of browser you use, access times, pages viewed, your IP address, and the page you visited before navigating to our Services.Device Information: We collect information about the computer you use to access our Services, including the hardware model, operating system, and version.Information Collected by Cookies and Other Tracking Technologies: We use different technologies to collect information, including cookies and web beacons. Cookies are small data files stored on your hard drive or in device memory that help us improve our Services and your experience, see which areas and features of our Services are popular and count visits. Web beacons are electronic images that may be used in our Services or emails and help deliver cookies, count visits, and understand usage and campaign effectiveness. For more information about cookies and how to disable them, please see “Your Choices” below.Use of InformationWe use the information we collect to provide, maintain, and improve our Services. For example, we use information about you to administer your Normcore.io account, validate that the users associated with your Normcore account usage are authorized, accurately bill you for your Normcore account usage, and to allow you to submit comments on our Normal blog. We may also use the information we collect to:Send you technical notices, updates, security alerts, and support and administrative messages and to respond to your comments, questions, and customer service requests;Communicate with you about products, services, offers, and events offered by Normal and others, and provide news and information we think will be of interest to you;Monitor and analyze trends, usage, and activities in connection with our Services;Detect, investigate and prevent fraudulent transactions and other illegal activities and protect the rights and property of Normal and others;Personalize and improve the Services and provide advertisements, content, or features that we think will be of interest to you;Facilitate contests, sweepstakes, and promotions and process and deliver entries and rewards; andCarry out any other purpose described to you at the time the information was collectedSharing of InformationWe will not share information about you except in the following circumstances or as otherwise described in this Privacy Policy:With vendors, consultants, and other service providers who need access to this information to carry out work on our behalf;In response to a request for information if we believe disclosure is in accordance with, or required by, any applicable law or legal process, including lawful requests by public authorities to meet national security or law enforcement requirements;If we believe your actions are inconsistent with our user agreements or policies, or to protect the rights, property, and safety of Normal or others;In connection with, or during negotiations of, any merger, sale of company assets, financing or acquisition of all or a portion of our business by another company;Between and among Normal and our current and future parents, affiliates, subsidiaries, and other companies under common control and ownership; andWith your consent or at your direction.We may also share aggregated or de-identified information, which cannot reasonably be used to identify you.Advertising and Analytics Services Provided by OthersWe may allow others to provide analytics services and serve advertisements on our behalf across the web. These entities may use cookies, web beacons, and other technologies to collect information about your use of the Services and other websites and applications, including your IP address, web browser, pages viewed, time spent on pages or in apps, links clicked, and conversion information. This information may be used by Normal and others to, among other things, analyze and track data, determine the popularity of certain content, deliver advertising and content targeted to your interests on our Services and other websites, and better understand your online activity. For more information about interest-based ads, or to opt out of having your web browsing information used for behavioral advertising purposes, please visit www.aboutads.info/choices or www.youronlinechoices.eu if you are a user in the European Economic Area.Data RetentionWe store the information we collect on you for as long as is necessary for the purpose for which we originally collected it, or for other legitimate business purposes, including to meet our legal, regulatory, or other compliance obligations.Transfer of Information to the U.S. and Other CountriesNormal is based in the United States and we process and store information in the U.S. Therefore, we and our service providers may transfer your information to, or store or access it in, jurisdictions that may not provide equivalent levels of data protection as your home jurisdiction. We will take steps to ensure that your personal data receives an adequate level of protection in the jurisdictions in which we process it.Your ChoicesAccount InformationYou may update or correct certain information about you at any time by logging into your account, or you can email us at privacy@normalvr.com and submit a request. If you wish to deactivate your account, please email us at privacy@normalvr.com, but note that we may retain certain information as required by law or for legitimate business purposes. We may also retain cached or archived copies of information about you for a certain period of time.CookiesMost web browsers are set to accept cookies by default. If you prefer, you can usually choose to set your browser to remove or reject browser cookies. Please note that if you choose to remove or reject cookies, this could affect the availability and functionality of our Services.Promotional CommunicationsYou may opt out of receiving promotional emails from Normal by following the instructions in those emails or by contacting us at privacy@normalvr.com. If you opt out, we may still send you non-promotional emails, such as those about your account or our ongoing business relations.European Economic AreaIf you are in the European Economic Area (“EEA”), you have certain rights and protections under the law regarding the processing of your personal data.Legal Basis for ProcessingIf you are in the EEA, when we process your personal data we will only do so in the following situations:We need to use your personal data to perform our responsibilities under our contract with you. For example, we use personal data about you to accurately bill you, to process payments (through a third party payments processor) for your use of our Services, and to provide the Service you have requested.We have a legitimate interest in processing your personal data. For example, we may process your personal data to communicate with you about changes to our Services, to provide, secure, and improve our Services, and to track usage of our Services to better understand how they are being used. Additionally, we may use personal data about you to send you promotional communications and news about product updatesWe have your consent to do so. For example, if we intend to change the way we process your personal data in a material way or process it for a new purpose, we will request your consent before doing so.We have a legal obligation to process your personal data. For example, we may need to retain certain personal data to comply with our recordkeeping and retention requirements or we may need to retain certain sales information to comply with applicable law.Data Subject RequestsIf you are in the EEA, you have the right to access personal data we hold about you and to ask that your personal data be corrected, erased, or transferred. You may also have the right to object to, or request that we restrict, certain processing. If you would like to exercise any of these rights, privacy@normalvr.com. Alternatively, you may contact us as indicated below.Questions or ComplaintsIf you are in the EEA and have a concern about our processing of personal data that we are not able to resolve, you have the right to lodge a complaint with the data privacy authority where you reside. For contact details of your local Data Protection Authority, please see: http://ec.europa.eu/justice/data-protection/article-29/structure/data-protection-authorities/index_en.htm"
year_published = 2025
