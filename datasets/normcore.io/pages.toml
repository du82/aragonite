full_description = "VR & ARAdd avatars and voice chat in 5 minutes.Normcore was built with VR and AR in mind. Normal creates our own VR titles, and we couldn't find a solution with that had truly high quality voice chat, networked physics, and persistent spaces, so we built our own.Normcore powers some of the biggest VR and AR titles on the market.Start NowContact SalesHow our customers use Normcore.From the creators of Job Simulator comes an all new omniversal hand tracked cooperative multiplayer game: Dimensional Double Shift.The team at Owlchemy ranked 16 different frameworks before choosing Normcore as the clear choice to power Dimensional Double Shift.Dimensional Double ShiftAvailable on the Meta Quest store.Golf+ is the exclusive VR Golf game of the PGA Tour and Top Golf. With over 52,000 reviews, Golf+ has been in the list of top 20 paid titles on Meta Quest for 4+ years.Normcore has been instrumental in enabling Golf+ to connect hundreds of thousands of players worldwide.GOLF+Available on the Meta Quest store.Nock is a multiplayer bow and arrow soccer created by Normal. It's fast-paced movement requires ultra low latency network synchronization provided by Normcore.Developed by the same folks that built Normcore, Nock pushes our team to continually push the limits of what Normcore technology can do.NockAvailable on Steam, PlayStation, and the Meta Quest store.Gym Class is the #1 most-played sports game on the Meta Quest store and has an official partnership with the NBA.With Normcore's robust infrastructure and scalable architecture, Gym Class is well-equipped to handle the demands of its rapidly growing player base.Gym ClassAvailable on the Meta Quest store.Joy Way, an award-nominated game development studio known for its critically acclaimed VR title STRIDE, has once again pushed the boundaries of virtual reality gaming with its latest release: Stack.With Stack, Joy Way utilized Normcore to deliver a fast-paced, low-latency experience.Joy WayAvailable on Steam and the Meta Quest store.Sail is an open world pirate adventure game inspired by games like Sea of Thieves & Assassin's Creed Black Flag.Normcore provided the tools needed for Red Team Interactive to prototype, develop, and ship a multiplayer title, at scale, with zero prior multiplayer experience.SailAvailable on the Meta Quest store.Softspace is a spatial collaboration tool and AI knowledge engine. Browse the web, pin up images, draft notes, and explore the connections between concepts.SoftspaceAvailable on the Meta Quest store.One of the most popular online VR sports games, Big Ballers VR delivers a fully multiplayer game with up to 10 players per park.Normcore powers high-octane immersive physics that fit all kinds of unique playstyles.Big BallersAvailable on the Meta Quest store.Dimensional Double ShiftGOLF+NockGym ClassJoy WaySailSoftspaceBig BallersWhat our customers are saying.A dependable networking solution is crucial for the fast-paced gameplay in Blacktop Hoops. We use Normcore for all things multiplayer. Blacktop Hoops features 1v1, 2v2, 3v3 and 4v4 matches, half court and full court. We have casual and ranked games. Normcore handles all real-time multiplayer.- Nathaniel Ventura, CEO, Vinci GamesI love how easy it was to add Normcore to my game. It's been simple to set up, and honestly, the voice quality is superb. It feels like you're right there talking to someone face-to-face. Networked Physics and Object Ownership really bring the game to life; you can grab a ball, toss it, and it behaves just as you'd expect.- Kenneth Lemieux, CEO, Loud Shirt GamesThrowback Studios used Normal's Normcore Unity package to more quickly build and scale Derby, a free-to-play multiplayer social park. We took full advantage of Normal's elastic cloud and pricing to more affordably and reliably handle rapid concurrent player growth after finding viral video success on TikTok.- Cody Woputz, Co-Founder & CTO, Throwback StudiosNormcore makes the decision to add multiplayer a no-brainer. It doesn’t matter if it’s VR, 2D, or on the web. It’s straightforward, easy to set up, and it just works. At Shopify, we were able to build a full social web experience with networked physics and voice in no time. I still can’t believe it can run like butter at 120fps…in a browser!- Daniel Beauchamp, ShopifySail's multiplayer is built on Normcore. Normcore has been easy for us to learn and extremely reasonable in terms of pricing and feature sets we need to build our game. Combined with voice chat, it made it incredibly easy for us to build out Sail's multiplayer in a short amount of time. We can’t recommend Normcore enough.- Garett Cook, Founder, Red Team InteractiveNormcore cross-platform design, coupled with exceptional voice chat capabilities, provided us with the low-latency, high-quality communication essential for immersive gameplay. Normcore isn't just our multiplayer solution; it's the backbone of our game's success. Our 4.9/5.0 rating proves my point.- Michal Wroblewski, Game Developer, Rooms of RealitiesUsed by the best.Customer StoriesReady to get started?Start developing for free. The best way to evaluate Normcore is to try it out.Start NowContact SalesAlways know what you pay.Pay only for what you use, with no hidden fees or CCU caps.PricingTry our examplesAdd multiplayer to any project in a few minutes.Documentation"
