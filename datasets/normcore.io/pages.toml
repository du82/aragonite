full_description = "GovernmentNormcore is actively used by multiple U.S. government contractors.We understand first-hand how strict various government agencies can be. Whether you require specific security compliance standards or the ability to host Normcore on-premises in AWS GovCloud, rest assured—we've done it before.Start NowContact SalesHow our customers use Normcore.Dynepic's MOTAR brings together best-in-class XR vendors who specialize in and allow for legacy training programs to modernize with XR training options.By utilizing Normcore Private On-Premises, Dynepic hosts their products in air-gapped environments and on AWS GovCloud.DynepicAvailable for enterprise and government use.DynepicWhat our customers are saying.At GOLF+ the multiplayer experience is core to our offering. Golfers love playing with friends, and new people, and Normcore has made it extremely easy for us to seamlessly connect hundreds of thousands of people playing all across the world. There's no better solution in the market for adding multiplayer to your title.- Ryan Engle, Founder and CEO, GOLF+We ranked 16 different frameworks for a variety of different features. Normcore was the clear winner in those tests. The API was something that meshed well with our game, and we’re delighted with our decision to use Normcore!- Andrew Eiche, CEO, Owlchemy LabsSail's multiplayer is built on Normcore. Normcore has been easy for us to learn and extremely reasonable in terms of pricing and feature sets we need to build our game. Combined with voice chat, it made it incredibly easy for us to build out Sail's multiplayer in a short amount of time. We can’t recommend Normcore enough.- Garett Cook, Founder, Red Team InteractiveThrowback Studios used Normal's Normcore Unity package to more quickly build and scale Derby, a free-to-play multiplayer social park. We took full advantage of Normal's elastic cloud and pricing to more affordably and reliably handle rapid concurrent player growth after finding viral video success on TikTok.- Cody Woputz, Co-Founder & CTO, Throwback StudiosNormcore makes the decision to add multiplayer a no-brainer. It doesn’t matter if it’s VR, 2D, or on the web. It’s straightforward, easy to set up, and it just works. At Shopify, we were able to build a full social web experience with networked physics and voice in no time. I still can’t believe it can run like butter at 120fps…in a browser!- Daniel Beauchamp, ShopifyI love how easy it was to add Normcore to my game. It's been simple to set up, and honestly, the voice quality is superb. It feels like you're right there talking to someone face-to-face. Networked Physics and Object Ownership really bring the game to life; you can grab a ball, toss it, and it behaves just as you'd expect.- Kenneth Lemieux, CEO, Loud Shirt GamesUsed by the best.Customer StoriesReady to get started?Start developing for free. The best way to evaluate Normcore is to try it out.Start NowContact SalesAlways know what you pay.Pay only for what you use, with no hidden fees or CCU caps.PricingTry our examplesAdd multiplayer to any project in a few minutes.Documentation"
