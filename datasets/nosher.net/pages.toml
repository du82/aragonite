["https://nosher.net/images/2025/2025-02-09MellisWalk"]
title = "nosher.net  - A Pub Walk to the Railway Tavern, Mellis, Suffolk - 9th February 2025"
description = "After a bit of a break, we finally get a chance for another pub walk. As it's a bit late and the weather's not that good, we opt for a shortish one and so do the Railway Tavern in Mellis again. The next day, Isobel's off to Bristol for some work thing, so gets dropped off at Diss railway station."
