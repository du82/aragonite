["https://nosher.net/images/2025/2025-02-24RainyNorwich"]
title = "nosher.net  - A Rainy Couple of Hours in Norwich, Norfolk - 24th February 2025"
description = "Isobel's got a couple of work meetings in Norwich, so it's a chance to tag along and roam around Norwich for a couple of hours. Although it's not exactly first thing in the morning, the market has mostly not yet opened and the streets are quiet, so it's quite reminiscent of wandering around Norwich on a Sunday back in the 80s, before the implementation of the Sunday Trading act in 1994. Which is quite appropriate, as the roaming around includes a trip up to Valentine Street to the old rented house occupied in 1987, and a look to see if the old Soman-Wherry offices - once the Crocodile pub, and now just an anonymous house - are still there."
full_description = '''A Rainy Couple of Hours in Norwich, Norfolk - 24th February 2025 Isobel's got a couple of work meetings in Norwich, so it's a chance to tag along and roam around Norwich for a couple of hours. Although it's not exactly first thing in the morning, the market has mostly not yet opened and the streets are quiet, so it's quite reminiscent of wandering around Norwich on a Sunday back in the 80s, before the implementation of the Sunday Trading act in 1994. Which is quite appropriate, as the roaming around includes a trip up to Valentine Street to the old rented house occupied in 1987, and a look to see if the old Soman-Wherry offices - once the Crocodile pub, and now just an anonymous house - are still there. previous album: A Walk around Redgrave and Lopham Fen, Redgrave, Suffolk - 23rd February 2025 var prevAlbum = "2025/2025-02-23RedgraveFen"; var base = "https://static.nosher.net/images"; var imgCount = 38; var index = -1; var pos = 0; var images = [ "2025/2025-02-24RainyNorwich/imgp0564", "2025/2025-02-24RainyNorwich/imgp0566", "2025/2025-02-24RainyNorwich/imgp0567", "2025/2025-02-24RainyNorwich/imgp0568", "2025/2025-02-24RainyNorwich/imgp0569", "2025/2025-02-24RainyNorwich/imgp0570", "2025/2025-02-24RainyNorwich/imgp0571", "2025/2025-02-24RainyNorwich/imgp0572", "2025/2025-02-24RainyNorwich/imgp0573", "2025/2025-02-24RainyNorwich/imgp0579", "2025/2025-02-24RainyNorwich/imgp0581", "2025/2025-02-24RainyNorwich/imgp0582", "2025/2025-02-24RainyNorwich/imgp0583", "2025/2025-02-24RainyNorwich/imgp0584", "2025/2025-02-24RainyNorwich/imgp0585", "2025/2025-02-24RainyNorwich/imgp0586", "2025/2025-02-24RainyNorwich/imgp0587", "2025/2025-02-24RainyNorwich/imgp0589", "2025/2025-02-24RainyNorwich/imgp0590", "2025/2025-02-24RainyNorwich/imgp0593", "2025/2025-02-24RainyNorwich/imgp0594", "2025/2025-02-24RainyNorwich/imgp0596", "2025/2025-02-24RainyNorwich/imgp0598", "2025/2025-02-24RainyNorwich/imgp0599", "2025/2025-02-24RainyNorwich/imgp0600", "2025/2025-02-2