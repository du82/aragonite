["https://nosher.net/images/2017/2017-03-06MarchMisc"]
title = "nosher.net  - Paul's Birthday and other March Miscellany - 6th March 2017"
description = "It's Paul's 40th birthday up the pub, but before that there's some March randomness, including working in Cambridge but having to get crummy commuter trains - a chore made worse when a tree falls down and blocks the line near Stowmarket so the train stops at Kennet in the middle of nowhere. At least it's a diesel-only branch line, so there are no overhead wires to break and the tree is sawn up within half an hour. After that, there's a trip to Norwich with a stop off at the Norfolk and Norwich hospital  to see the G-Unit."
