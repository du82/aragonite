description = "This is an interesting advert - gender stereotyping aside - in the form of its implied message, from a company that controlled much of the UK Schools' IT hardware market until it ..."
full_description = '''function disableForMobile(x) { if (x.matches) { $("#zoom").hide(); } } $(document).ready(function() { var media = window.matchMedia("(max-width: 840px)") disableForMobile(media); $('html, body').animate({ scrollTop: ($('.hilite').first().top) },500); }); $(window).on("load", function() { var doZoom = false; var zoomer = $(".zoomer"); var magicon = $(".magicon"); var height = zoomer.height(); var zimg = zoomer.children("img"); var offset = zimg.offset() var naturalWidth = zimg.get(0).naturalWidth; var naturalHeight = zimg.get(0).naturalHeight; if (naturalWidth > 1200) { $(".magicon").show(); $(".magicon").on("click", function() { doZoom = !doZoom; if (doZoom) { $(this).children("button").html("Turn off zoom"); } else { $(this).children("button").html("🔍 Click to zoom"); } }); zoomer.on("mouseover", function() { if (doZoom) { console.log(zimg.get(0).naturalWidth); zimg.width(naturalWidth); zimg.height(naturalHeight); zoomer.height(height); zoomer.css('cursor','zoom-in'); console.log(zimg.width()); zoomer.on("mousemove", function(event) { if (doZoom) { var newx = event.pageX - offset.left; var newy = event.pageY - offset.top; zimg.offset({left: offset.left - newx, top: offset.top - newy}); } }); } }); zoomer.on("mouseout", function() { if (doZoom) { zimg.width(700); zimg.height(naturalHeight/2); zimg.offset(offset); } }); } }); Research Machines Advert - October 1980 adverts home | a-z index | industry connections | timelines | by year | next Research Machines advert | previous Research Machines advert | previous advert | next advert From Personal Computer World 🔍 click to zoom What will you do with 12-year-old programmers when he reaches 16? This is an interesting advert - gender stereotyping aside - in the form of its implied message, from a company that controlled much of the UK Schools' IT hardware market until it finally bailed out of PC sales in June 2014[1]. It reflects the generation of kids who were the first to get access to computers in their own homes, like the ZX80, VIC-20 and so on, and had to learn how to program in BASIC in order to do anything useful. BASIC wasn't always the most popular choice, with computer-scientist legend Professor Edsger Dijkstra - father of structured programming and famous for saying "GOTO statements considered harmful" - having a proper rant against BASIC, as well as hobbyist programmers in general, at an international conference in 1977. Dijkstra grumbled bitterly that non-professionals and the BASIC language had put back programming by 25 years[2]. This seemed to be a position the advert seems to at least partly agree with, suggesting that when kids reach 16 they need something a bit more advanced than a box that runs BASIC to program on. Others have similarly suggested that no-one should program in BASIC after puberty[3]. And so to address this apparent market, RML was offering a Z80-based computer running CP/M, with alternative and "serious" programming languages Fortran and COBOL available. It retailed for £897 for the entry-level system (about £5,470 in 2025 prices), which would frankly put it out of the reach of most home markets, but then it was primarily aimed at 6th-forms and colleges. Fear of Technology: Visions of a Computer Future at the end of the 1970s The end of the 1970s was marked by a widespread fear of new technology in popular media and society at large, a fear which perhaps really found its voice in the BBC's influential Horizon programme "Now the chips are down", which caused quite a stir[4] when it was first broadcast in March 1978[5]. Reflecting as it did upon a dystopian future where new technology would lead to widescale job losses, for instance with the use of robots in car manufacturing, the Horizon programme was even noted as one of the jolts that "woke up" an oblivious population by Prime Minister Jim Callaghan, although Callaghan had already initiated a study in to the impact of microcomputers a few months before back in the January of 1978[6]. The net result was that by the end of the year the Labour Government had decided to commit £40 million to promote the "revolution" in the UK. The feeling of unease was prevalent enough that many articles in the press would attempt to take away the fear of technology by offering soothing examples of why people might want a computer in their own home. One such example, although it could be said to be preaching to the choir as it appeared in August 1978's Personal Computer World, was written by none other than Magnus Magnusson, most famous as the long-serving host of television's Mastermind. I've started, so I'll finish Magnusson started with a microcomputer-economics lesson: the world's first business computer - Joe Lyon's LEO 1, built in 1951 - cost £5,000,000 whilst a 1978 kit offered pretty much the same performance for £500 or less, demonstrating how prices had fallen by one or even two orders of magnitude in each decade. There then followed questions like "why should you buy a computer?", statements like "there are still many people who are a little afraid of the computer" or predictions like "just as dad buys an electric train set for his son's first birthday, so dad will buy a computer for his children's educational advancement and his own fun". This seems to show that even as early as 1978, when there were very few micros actually in schools, computers were already seen as a de-facto solution to education problems. Magnusson continued his essay with some other very common memes of the time: "a computer really comes in to its own by helping you to plan your household budgeting. Your computer can find the solutions by taking all your personal circumstances in to account. All you do is feed in your monthly pay cheque and your fixed expenses and let the computer take out the drudgery and come up with the answers". There was also the perennial favourite "[a computer] can help you reduce your energy consumption by controlling the central heating and opening or closing curtains or windows" - a trope that by the 2010s had spawned smart thermostats, a perfect example of a solution looking for a problem. Relief from drudgery was a recurring theme, but according to Mike Cooley, formerly of the AEWU and TASS unions, microcomputers and the rest were too often presented as liberating people from "all the boring, routine back-breaking tasks that they had been engaged in". It was also a myth that this would somehow naturally lead people to be free to engage in creativity and have better, more satisfying and worthwhile jobs[7] - the problem with drudgery being that as soon as you removed it, some other boring job would come along to take its place. The belief that sufficient programming was enough to model any behaviour, given enough data, also seemed to be widespread. Professor Jay Forrester, part of the MIT team that devised the infamous, influential and later-discredited 1972 "Limits of Growth" study for the global think-tank Club of Rome, was quoted in an address to the US Congress as stating "The human mind is not adapted to interpreting how social systems behave... until recently there has been no way to estimate the behaviour of social systems except by contemplation and guesswork. The great uncertainty with mental models is the inability to anticipate consequences of interactions between parts of a system." Forrester continued with the somewhat naïve: "This uncertainty is totally eliminated in computer models. Given a stated set of assumptions, the computer traces the resulting consequences without doubt or error. Any concept or relationship that can be clearly stated in ordinary language can be translated into computer model language"[8][9]. Meanwhile Magnusson concluded his ernest and somewhat parochial article "Computing for Everybody" with a quote from the editor of Personal Computer World: "The world is full of divisions: rich and poor, north and south, developed and under-developed, literate and illiterate. Soon, if we do not make great effort, there will be another division - between those of us who are aware of the uses and the power of the personal computer, and those who are not. It will be the difference between surviving the information tidal wave and being drowned by it"[10]. Social divide Eric Lubbock, who was by now elevated to the status of Lord Avebury of the UK's upper parliamentary chamber, the House of Lords, echoed this sense of an upcoming divide when he gave a talk at the University of Sussex on 1st November 1979. Lubbock stated: "Here in the UK ... there does not seem to be any consciousness of a need to explain these advances to the consumer or the trade unionist, nor to encourage them to participate in the discussion, let alone the management of the changes that will so profoundly affect them. There is a danger that Britain may on the one hand become polarised in to a fairly small elite of professionals and managers who are keen to apply the available technology, and on the other, the mass of the people for whom the word micro-electronics conjurs up only images of Big Brother and the dole queue. The contrast between the two groups would be stark, because the range of skilled and semi-skilled activities in between would have virtually disappeared. This would be a prescription for extreme social unrest, perhaps disintigration."[11]. An archetypal dole queue, featured in the documentary New Technology: Whose Progress?", first broadcast in 1981. Source: https://archive.org/details/newtechnologywhoseprogressLord Avebury's talk was in response to the announcement of a Government programme intended to get the public engaged in a debate on informatics and society. There was still a general lack of awareness amongst the public of the threats and/or opportunities of microcomputers, despite a nationwide campaign throughout 1979 "aimed at alerting the country's key decision makers to the facts of microelectronic life". That campaign, part of the Government's Microprocessor Applications Project (MAP) and launched with the co-operation of the National Computing Centre (NCC), had involved over 50,000 people from the business world taking part in 140 workshops, as well as presentations to over 12,000 Union members at various conferences[12]. Jobs holocaust Barrie Sherman waves a cigar around as he talks on Horizon. © BBC Horizon 1978The Trade Unions, which in 1980 represented 12 million workers[14], were not quiet on the matter of the perceived impending jobs crisis. Clive Jenkins, general secretary for the white-collar Association of Scientific, Technical and Managerial Staffs (ASTMS) union laying his cards on the table in the book "The Collapse of Work", co-authored with Union researcher Barrie Sherman. Malcolm Peltu, reviewing the book in September 1979's Personal Computer World wrote that it: "clearly forsees a future in which information technology creates an environment where there is substantially smaller demand for both physical and white-collar clerical labour, leading to the possible creation of a 'leisure society' in which it will be normal for most people to be 'unemployed' most of the time"[15]. Despite Jenkins and Sherman calling this a "jobs holocaust", Peltu also mentioned his surprise that they (and most Unions) were pro technology, with Jenkins and Sherman going on to say that we must "first ensure that we do get our technological revolution and we get it early enough". Sherman had also appeared on a panel discussion following the first broadcast of the Horizon documentary saying that "there are economic, political and social repercussions" of the move to a micro-processor-dominated society[16], a sentiment echoed elsewhere on the left of the political spectrum by former Labour Cabinet Minister Mervyn Rees who, whilst opening a new Computer Workshop in Leeds, suggested that "a new social class will grow up in response to the micro, in the next decade"[17]. The ASTMS union was one of the first organisations in the UK to take the threat to jobs seriously, saying that "the days when fears of unemployment caused by computing could be discounted have definitely vanished". The union was forecasting 3.8 million unemployed by 1985 and 5.2 million by 1991 (the actual figures were 3.0 million in 1985 and about 2.4 million in 1991[18]). Several studies in 1978, including one undertaken for the BBC and another by the Cambridge Economic Policy Group and published in The Times in May of that year, increased the feeling of pessimism by foreseeing constantly increasing unemployment fuelled not just by the microprocessor but also by an increase in population - another popular fear at the time. Jenkins and Sherman said of this "if at present we cannot provide jobs for 1.5 million people, how will we cope with an extra 2.5 million?"[19]. Various government attempts to put off this expected rise in unemployment, like increases in short-time working and job-swap schemes, as well as encouraging young people to stay in education for as long as possible were seen as futile attempts about as useful as "trying to shovel the tide back". Mostly though it was a message of increasing unemployment: Dutch electronics company Philips was expecting to reduce its 500,000 workforce by over half in ten years, as by that time it was forecasting that improvements in production methods through technology would leave it 56% overmanned. Elsewhere 128,000 jobs were forecast to be lost in the US car industry by 1985 and a proposal for an unmanned factory in Japan suggested that a control crew of ten could do the work of 700. Even as late as 1982, Chairman of Mensa, inventor and computer pioneer Clive Sinclair was also forecasting wide-scale unemployment, when at the third annual Mensa symposium in Cambridge he predicted 10 million unemployed in Britain by the end of the century, with only 10% of the population remaining in manufacturing. Sinclair actually saw this as a benefit, suggesting that "positions in industry are inimicable to the human spirit" and that "a move away from this present type of organisation will restore the potential of the individual". He went on to suggest that this would lead to an affirmation of class distinctions and would lead to a revival of "traditional and artistic patronage" before concluding "early in the next century we will have made intelligent machines, ending for all time the current pattern of drudgery. It may well be that western civilisation is just about to flower"[20]. One of the problems with a sudden unleashing of "leisure" was who would pay for it, as the traditional way of distributing wealth had been via the pay packet. However in the new world order, wealth would be concentrated in the hands of the elite who had control of the computer systems and other various tools of "high technology", whereas for the masses without a job there would actually be no money to pay for their new-found life of leisure. All that would be left in this new World Order would be a new drudgery of'''
