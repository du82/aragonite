["https://nosher.net/images/2018/2018-03-03MoreMarchSnow"]
title = "nosher.net  - More March Snow and a Postcard from Diss, Norfolk - 3rd March 2018"
description = '''It's Day Four of the "Beast From the East", and there's still a good pile of snow around - having reached nearly 20cm by the end of Wednesday night - so Fred heads over to the Oaksmere again to do some more sledging. By Saturday, the snow's melting, but there's still enough around for a few photos around town in Diss.'''
