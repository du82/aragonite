["https://nosher.net/images/2025/2025-02-01FebruaryMisc"]
title = "nosher.net  - The Demolition of Park Road, Diss, Norfolk - 1st February 2025"
description = "Large parts of the area along Park Road in Diss are being - or have recently been - demolished, including the feather factory, which is rapidly turning into some new housing estate, and John Grose - formerly Mereside Ford, Sheffield Garner and Chitty's - where it's now possible to see the view across the Mere to the church, which hasn't been visible from that location for decades. Then we go for a short walk around Eye and check up on Anita-tree - the walnut from our garden which Isobel planted in memory of a late friend. We even stop for a pint in the Queen's Head, which at that time of day isn't too full of swearing, at least in the Cross Street bar."
full_description = '''The Demolition of Park Road, Diss, Norfolk - 1st February 2025 Large parts of the area along Park Road in Diss are being - or have recently been - demolished, including the feather factory, which is rapidly turning into some new housing estate, and John Grose - formerly Mereside Ford, Sheffield Garner and Chitty's - where it's now possible to see the view across the Mere to the church, which hasn't been visible from that location for decades. Then we go for a short walk around Eye and check up on Anita-tree - the walnut from our garden which Isobel planted in memory of a late friend. We even stop for a pint in the Queen's Head, which at that time of day isn't too full of swearing, at least in the Cross Street bar. next album: A Pub Walk to the Railway Tavern, Mellis, Suffolk - 9th February 2025previous album: Dove Players' Wrap Party and the GSB at Thornham - 26th January 2025 var nextAlbum = "2025/2025-02-09MellisWalk"; var prevAlbum = "2025/2025-01-26PPWrapParty"; var base = "https://static.nosher.net/images"; var imgCount = 27; var index = -1; var pos = 0; var images = [ "2025/2025-02-01FebruaryMisc/imgc20250131_215701", "2025/2025-02-01FebruaryMisc/imgp0115", "2025/2025-02-01FebruaryMisc/imgp0116", "2025/2025-02-01FebruaryMisc/imgp0118", "2025/2025-02-01FebruaryMisc/imgp0123", "2025/2025-02-01FebruaryMisc/imgp0129", "2025/2025-02-01FebruaryMisc/imgp0130", "2025/2025-02-01FebruaryMisc/imgp0132", "2025/2025-02-01FebruaryMisc/imgp0134", "2025/2025-02-01FebruaryMisc/imgp0135", "2025/2025-02-01FebruaryMisc/imgp0138", "2025/2025-02-01FebruaryMisc/imgp0139", "2025/2025-02-01FebruaryMisc/imgp0140", "2025/2025-02-01FebruaryMisc/imgp0143", "2025/2025-02-01FebruaryMisc/imgp0147", "2025/2025-02-01FebruaryMisc/imgp0148", "2025/2025-02-01FebruaryMisc/imgp0152", "2025/2025-02-01FebruaryMisc/imgp0156", "2025/2025-02-01FebruaryMisc/imgp0157", "2025/2025-02-01FebruaryMisc/imgp0159", "2025/2025-02-01FebruaryMisc/imgp0160", "2025/2025-02-01FebruaryMisc/imgp016