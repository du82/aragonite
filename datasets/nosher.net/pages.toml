["https://nosher.net/images/2018/2018-03-29Station119"]
title = "nosher.net  - Elvis Lives! (in a Brewery), Station 119, Eye, Suffolk - 29th March 2018"
description = "New-ish US-style micro-brewery Station 1-1-9 holds an official new premises party up at its brewery/warehouse on Eye Airfield industrial estate's Progress Way. The problem is that we're cycling, and the weakest beer - which is a robust 5% or more - runs out straight away, leaving only beers of 6.4% and up. At least there's an entertaining Elvis-based entertainer on hand to distract us from the impending doom of a lost weekend."
