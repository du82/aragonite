title = "nosher.net  - A Return to Chagford, Devon - 16th February 2025"
description = "We're off to Devon for the first time in ages - albeit without Fred who's opted to stay behind and look after Lucy the one-eyed cat - and once again we're taking the electric car. However, this time we're a bit more prepared for the extra time for charging, although it still takes ages as we leave at around 4.15pm and don't arrive at the rented holiday flat right in the centre of Chagford until about 1.20am. On the next day we meet up with Sis and Matt at the Old Forge Café just down the road for a coffee and/or hot chocolate, then we head off to Moretonhampstead to see Grandma J, before an evening in the Globe Inn for a couple of pints. On the day after that, we drive further afield - the having recharged overnight as Chagford actually now has a couple of working chargers in the Health Centre car park - to meet up with Sis and Matt again at Saunton Beach on the North Devon coast, followed by lunch at Squire's fish restaurant on Braunton. And if that wasn't enough food already, we follow it up with a very impressive Sunday roast at the Globe Inn back in Chagford."
full_description = '''A Return to Chagford, Devon - 16th February 2025 We're off to Devon for the first time in ages - albeit without Fred who's opted to stay behind and look after Lucy the one-eyed cat - and once again we're taking the electric car. However, this time we're a bit more prepared for the extra time for charging, although it still takes ages as we leave at around 4.15pm and don't arrive at the rented holiday flat right in the centre of Chagford until about 1.20am. On the next day we meet up with Sis and Matt at the Old Forge Café just down the road for a coffee and/or hot chocolate, then we head off to Moretonhampstead to see Grandma J, before an evening in the Globe Inn for a couple of pints. On the day after that, we drive further afield - the having recharged overnight as Chagford actually now has a couple of working chargers in the Health Centre car park - to meet up with Sis and Matt again at Saunton Beach on the North Devon coast, followed by lunch at Squire's fish restaurant on Braunton. And if that wasn't enough food already, we follow it up with a very impressive Sunday roast at the Globe Inn back in Chagford. next album: Uni: A Return to Plymouth Polytechnic, Devon - 17th Februry 2025previous album: A Pub Walk to the Railway Tavern, Mellis, Suffolk - 9th February 2025 var nextAlbum = "2025/2025-02-17PlymouthVisit"; var prevAlbum = "2025/2025-02-09MellisWalk"; var base = "https://static.nosher.net/images"; var imgCount = 87; var index = -1; var pos = 0; var images = [ "2025/2025-02-16SauntonSands/imgp0205", "2025/2025-02-16SauntonSands/imgp0206", "2025/2025-02-16SauntonSands/imgp0210", "2025/2025-02-16SauntonSands/imgp0215", "2025/2025-02-16SauntonSands/imgp0217", "2025/2025-02-16SauntonSands/imgp0218", "2025/2025-02-16SauntonSands/imgp0220", "2025/2025-02-16SauntonSands/imgp0221", "2025/2025-02-16SauntonSands/imgp0222", "2025/2025-02-16SauntonSands/imgp0223", "2025/2025-02-16SauntonSands/imgp0225", "2025/2025-02-16SauntonSands/imgp0226", "202