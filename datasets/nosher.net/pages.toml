["https://nosher.net/images/2018/2018-03-31TripsToNorwich"]
title = "nosher.net  - A Couple of Trips to Norwich, Norfolk - 31st March 2018"
description = 'Various combinations of the gang end up in Norwich two days on the trot - first Nosher and the boys go up as Harry wants to buy some more Lego with his birthday money, then all of us, plus Grandad, are up the following day to watch Peter "Pete Rabbat" Rabbit at the cinema.'
