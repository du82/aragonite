["https://nosher.net/images/2020/2020-03-13SimonWoodMemorial"]
title = "nosher.net  - A SwiftKey Memorial Service, Covent Garden, London  - 13th March 2020"
description = '''It's the memorial service for SwiftKey colleague Simon Wood, who died at the end of July 2019. The memorial is held at the St. Paul's Church in Covent Garden in London - otherwise known as the "Actors' Church" - where a large group from the choir that Simon was in, the Wimbledon Choral Society, is in attendance and sings three numbers, two which were commisioned specially for Simon's Requiem for Cancer fundraisers. As the group from SwiftKey is right in front of the choir, we get the full immersive surround-sound experience, which is something special. It's also clear, wandering around Covent Garden for a bit before the service, that things are quieter than usual, thanks to the growing threat from the Coronavirus. One of the street entertainers ends up performing to just a single small boy. Afterwards, we head over for tea at the Oaksmere.'''
full_description = '''A SwiftKey Memorial Service, Covent Garden, London - 13th March 2020 It's the memorial service for SwiftKey colleague Simon Wood, who died at the end of July 2019. The memorial is held at the St. Paul's Church in Covent Garden in London - otherwise known as the "Actors' Church" - where a large group from the choir that Simon was in, the Wimbledon Choral Society, is in attendance and sings three numbers, two which were commisioned specially for Simon's Requiem for Cancer fundraisers. As the group from SwiftKey is right in front of the choir, we get the full immersive surround-sound experience, which is something special. It's also clear, wandering around Covent Garden for a bit before the service, that things are quieter than usual, thanks to the growing threat from the Coronavirus. One of the street entertainers ends up performing to just a single small boy. Afterwards, we head over for tea at the Oaksmere. next album: A Trip to Cooke's Music, St. Benedict's Street, Norwich - 14th March 2020previous album: A Trip to High Lodge, Brandon, Suffolk - 7th March 2020 var nextAlbum = "2020/2020-03-14Norwich"; var prevAlbum = "2020/2020-03-07HighLodge"; var base = "https://static.nosher.net/images"; var imgCount = 44; var index = -1; var pos = 0; var images = [ "2020/2020-03-13SimonWoodMemorial/imgp9937", "2020/2020-03-13SimonWoodMemorial/imgp9939", "2020/2020-03-13SimonWoodMemorial/imgp9942", "2020/2020-03-13SimonWoodMemorial/imgp9945", "2020/2020-03-13SimonWoodMemorial/imgp9946", "2020/2020-03-13SimonWoodMemorial/imgp9947", "2020/2020-03-13SimonWoodMemorial/imgp9952", "2020/2020-03-13SimonWoodMemorial/imgp9958", "2020/2020-03-13SimonWoodMemorial/imgp9963", "2020/2020-03-13SimonWoodMemorial/imgp9970", "2020/2020-03-13SimonWoodMemorial/imgp9975", "2020/2020-03-13SimonWoodMemorial/imgp9976", "2020/2020-03-13SimonWoodMemorial/imgp9979", "2020/2020-03-13SimonWoodMemorial/imgp9981", "2020/2020-03-13SimonWoodMemorial/imgp9984", "2020/2020-03-13SimonWoodMemo