full_description = "nosher.net has gone HD! The updating of the photo archive continues: all photos are now High Definition, which means that instead of being downscaled to 700 pixels wide, every single one of the 83,000-odd photos in the collection is now scaled to 1600 pixels but displayed at 800, so high-DPI phones and monitors render them nice and sharply - although for the early digital photos taken on a Kodak DCS3800 that means pretty much their full size, so they can't be improved on now if displays get even sharper in future.The downside of this whole process is that new tricks with processing are learned each time, which means now going around again to do better straightening, perspective correction for some, and improved colour correction for most. Latest photos A Rainy Couple of Hours in Norwich, Norfolk - 24th February 2025 A Walk around Redgrave and Lopham Fen, Redgrave, Suffolk - 23rd February 2025 Uni: A Return to Plymouth Polytechnic, Devon - 17th Februry 2025 A Return to Chagford, Devon - 16th February 2025 A Pub Walk to the Railway Tavern, Mellis, Suffolk - 9th February 2025 The Demolition of Park Road, Diss, Norfolk - 1st February 2025 Dove Players' Wrap Party and the GSB at Thornham - 26th January 2025 A Pub Walk to the Lion, Debenham, Suffolk - 19th January 2025 Dove Players do Treasure Island, The Village Hall, Occold - 11th January 2025 The Dereliction of Anglia Square, Norwich - 7th January 2025 Dove Players Tech Rehearsal, Occold, Suffolk - 5th January 2025 A 3G Lab Trip to Bangkok, Thailand - 2nd October 2004 A 3G Lab Trip to Melbourne, Victoria, Australia - 5th October 2004 A Postcard From Manila: a 3G Lab Working Trip, Philippines - 9th July 2004 A New Year Miscellany, Brome, Suffolk - 1st January 2025 St. Stephen's Day in Blackrock, County Dublin, Ireland - 26th December 2024 Christmas at Da Gorls, Monkstown Farm, Dublin - 25th December 2024 A Santa Tractor Parade and the SYWO in Ipswich - 23rd December 2024 The Stowmarket Christmas Tree