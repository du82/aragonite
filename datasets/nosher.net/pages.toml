["https://nosher.net/images/2019/2019-03-27NamcoFunDay"]
title = "nosher.net  - A Team Outing at Namco Funscape, South Bank, London - 27th March 2019"
description = '''Nosher's team at work has one of its occasional "away days", and this time it's a return to Namco Funscape, near the London Eye on the South Bank of the Thames in that London. On the way down, as it's not a working commute, there's more of a chance to catch up with trackside dereliction such as the 1860s Fison's North Warehouse, currently the subject of attempts to get it restored or at least preserved. It's a building that's hard to catch as the train is normally running past at around 80mph, and many previous attempts have been a bust, but this time a lucky well-timed shot gets it almost perfectly. Then, on the way back, instead of getting the tube all the way back from Waterloo to Liverpool Street, there's an exit at Bank and a chance to wander more slowly along the roads, which reveals interesting details normally missed when cycling frantically to the station.'''
