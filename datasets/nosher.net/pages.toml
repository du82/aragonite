["https://nosher.net/images/2025/2025-02-17PlymouthVisit"]
title = "nosher.net  - Uni: A Return to Plymouth Polytechnic, Devon - 17th Februry 2025"
description = '''It's been a surprisingly long time since the last trip to actual Plymouth - despite having been to Chagford and Spreyton, which are only about 25 miles away across Dartmoor, many times in between. In the nine years since the last trip the city centre remains broadly unchanged, although the Civic Centre is looking decidedly more derelict and House of Fraser could do with a clean. The University of Plymouth (formerly Plymouth Polytechnic) campus however is a different matter as it's been around 20 years since the last proper look around, and for the first time it's become more-or-less impossible to do a proper "then and now" session as many buildings have gone or have been redeveloped beyond recognition. It's a bit unsettling in some ways, but is at least a measure that the university is still "happening". Anyway, after dragging Harry around the campus for a bit, we (minus Isobel who's working remotely from the rented flat) retire to Drake Circus for a bit of sushi, then drive back across Dartmoor to Chagford. After a last couple of pints in the Globe, we drive back the next day in a ten-hour epic, thanks to roadworks and recharging sagas.'''
full_description = '''Uni: A Return to Plymouth Polytechnic, Devon - 17th Februry 2025 It's been a surprisingly long time since the last trip to actual Plymouth - despite having been to Chagford and Spreyton, which are only about 25 miles away across Dartmoor, many times in between. In the nine years since the last trip the city centre remains broadly unchanged, although the Civic Centre is looking decidedly more derelict and House of Fraser could do with a clean. The University of Plymouth (formerly Plymouth Polytechnic) campus however is a different matter as it's been around 20 years since the last proper look around, and for the first time it's become more-or-less impossible to do a proper "then and now" session as many buildings have gone or have been redeveloped beyond recognition. It's a bit unsettling in some ways, but is at least a measure that the university is still "happening". Anyway, after dragging Harry around the campus for a bit, we (minus Isobel who's working remotely from the rented flat) retire to Drake Circus for a bit of sushi, then drive back across Dartmoor to Chagford. After a last couple of pints in the Globe, we drive back the next day in a ten-hour epic, thanks to roadworks and recharging sagas. next album: A Walk around Redgrave and Lopham Fen, Redgrave, Suffolk - 23rd February 2025previous album: A Return to Chagford, Devon - 16th February 2025 var nextAlbum = "2025/2025-02-23RedgraveFen"; var prevAlbum = "2025/2025-02-16SauntonSands"; var base = "https://static.nosher.net/images"; var imgCount = 72; var index = -1; var pos = 0; var images = [ "2025/2025-02-17PlymouthVisit/imgp0407", "2025/2025-02-17PlymouthVisit/imgp0408", "2025/2025-02-17PlymouthVisit/imgp0410", "2025/2025-02-17PlymouthVisit/imgp0411", "2025/2025-02-17PlymouthVisit/imgp0412", "2025/2025-02-17PlymouthVisit/imgp0415", "2025/2025-02-17PlymouthVisit/imgp0416", "2025/2025-02-17PlymouthVisit/imgp0418", "2025/2025-02-17PlymouthVisit/imgp0421", "2025/2025-02-17PlymouthVisit/i