["https://nosher.net/images/2025/2025-02-23RedgraveFen"]
title = "nosher.net  - A Walk around Redgrave and Lopham Fen, Redgrave, Suffolk - 23rd February 2025"
description = "We drag Harry out to get some new shoes from Mountain Warehouse in Bressingham, from where it's a short hop up to Redgrave and Lopham Fen. After a walk around the fen, it's another short drive over to the Cross Keys in Redgrave for a couple of beers, or Ghost Ship Zero in Isobel's case. Before that, the demolition of John Grose/Mereside Ford/Sheffield Garner is almost complete, with there being not much left other than a pile of earth and a new view from Park Road across the Mere and to the church."
full_description = '''A Walk around Redgrave and Lopham Fen, Redgrave, Suffolk - 23rd February 2025 We drag Harry out to get some new shoes from Mountain Warehouse in Bressingham, from where it's a short hop up to Redgrave and Lopham Fen. After a walk around the fen, it's another short drive over to the Cross Keys in Redgrave for a couple of beers, or Ghost Ship Zero in Isobel's case. Before that, the demolition of John Grose/Mereside Ford/Sheffield Garner is almost complete, with there being not much left other than a pile of earth and a new view from Park Road across the Mere and to the church. next album: A Rainy Couple of Hours in Norwich, Norfolk - 24th February 2025previous album: Uni: A Return to Plymouth Polytechnic, Devon - 17th Februry 2025 var nextAlbum = "2025/2025-02-24RainyNorwich"; var prevAlbum = "2025/2025-02-17PlymouthVisit"; var base = "https://static.nosher.net/images"; var imgCount = 23; var index = -1; var pos = 0; var images = [ "2025/2025-02-23RedgraveFen/imgp0004", "2025/2025-02-23RedgraveFen/imgp0005", "2025/2025-02-23RedgraveFen/imgp0518", "2025/2025-02-23RedgraveFen/imgp0520", "2025/2025-02-23RedgraveFen/imgp0521", "2025/2025-02-23RedgraveFen/imgp0523", "2025/2025-02-23RedgraveFen/imgp0527", "2025/2025-02-23RedgraveFen/imgp0530", "2025/2025-02-23RedgraveFen/imgp0532", "2025/2025-02-23RedgraveFen/imgp0534", "2025/2025-02-23RedgraveFen/imgp0535", "2025/2025-02-23RedgraveFen/imgp0538", "2025/2025-02-23RedgraveFen/imgp0540", "2025/2025-02-23RedgraveFen/imgp0541", "2025/2025-02-23RedgraveFen/imgp0542", "2025/2025-02-23RedgraveFen/imgp0544", "2025/2025-02-23RedgraveFen/imgp0547", "2025/2025-02-23RedgraveFen/imgp0548", "2025/2025-02-23RedgraveFen/imgp0551", "2025/2025-02-23RedgraveFen/imgp0553", "2025/2025-02-23RedgraveFen/imgp0555", "2025/2025-02-23RedgraveFen/imgp0560", "2025/2025-02-23RedgraveFen/imgp0563", ]; var ids = [ "imgp0004", "imgp0005", "imgp0518", "imgp0520", "imgp0521", "imgp0523", "imgp0527", "imgp0530", "imgp0532", "imgp0534", "i