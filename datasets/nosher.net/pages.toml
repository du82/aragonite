description = "Fred's bust his flute so we have to visit Cooke's in Norwich in order to get it fixed, but whilst we're there we decide to get a new flute as an upgrade anyway. We also have a look around St. Gregory's Antiques and Collectibles on St. John's Alley, and manage to not visit Pizza Express for a change, even though it's virtually next door to Cooke's."
