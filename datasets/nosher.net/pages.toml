["https://nosher.net/images/2017/2017-03-21MarchMisc"]
title = "nosher.net  - Digger Action and other March Miscellany, Suffolk and London - 21st March 2017"
description = "It's a random week: Everyone's out in Paddington's Sheldon Square, by the office, for the first properly warm day of the year. Then, there's a curry night, and the digger is in to excavate an extensive patio area, but first we have to clear away the site which looks like a hurricane has destroyed a house. After that, on the way back from work, Nosher is caught up by road closures following the Westminster terrorist incident, where all the roads leading to the Houses of Parliament have been closed off, and then it's Harry's birthday."
