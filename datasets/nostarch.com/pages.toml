["https://nostarch.com/data-engineering-cybersecurity"]
title = "Data Engineering for Cybersecurity | No Starch Press"
description = "Learn beginner-friendly strategies and free tools for streamlining your organization's data processes to support and strengthen cybersecurity."
full_description = "When a cybersecurity incident occurs, how does anyone know? Data must leave workstations and servers, bounce across the network, and land in a central database before analysts can use it. This project-based book covers that complex space between an organization’s computers and the security analyst tasked with protecting them. The guidance is straightforward, and the focus is on streamlining the process of gathering, transforming, and storing cybersecurity data using free and open-source tools. The author elaborates on core logging strategies, while also emphasizing the importance of standardizing data, using encryption to protect transmitted data, and creating “data pipelines” that support cybersecurity, data analytics, and automation needs alike. You’ll how to: By the end, you’ll know how to enrich your security data, protect it from unauthorized parties, and automate your workflow in the process – leaving more room for creative thinking. James Bonifield is a cybersecurity professional with over a decade of experience analyzing malicious activity, implementing data pipelines, and training others in the security industry. He enjoys spending free time with his wife and kids, traveling, and tinkering with all things security and Python related."
