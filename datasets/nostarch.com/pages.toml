description = "Career Opportunities Sales Manager Senior Acquisitions Editor Marketing Communications Assistant About us Since 1994, No Starch Press has redefined technical publishing by proving that complex topics can be both accessible and uncompromisingly rigorous. While other publishers chased digital trends, we recognized an enduring truth: technical professionals cherish well-crafted physical books. Our partnership with Penguin Random House has allowed us to bring this vision to an ever-growing global audience of developers, hackers, and technology enthusiasts."
full_description = "Sales Manager Senior Acquisitions Editor Marketing Communications Assistant About us Since 1994, No Starch Press has redefined technical publishing by proving that complex topics can be both accessible and uncompromisingly rigorous. While other publishers chased digital trends, we recognized an enduring truth: technical professionals cherish well-crafted physical books. Our partnership with Penguin Random House has allowed us to bring this vision to an ever-growing global audience of developers, hackers, and technology enthusiasts. What sets us apart isn't just what we publish, but how we work. We're an independent company that treats each book as a craft project, not a product. We work closely with authors to distill complex technical concepts into clear, engaging prose. We believe that true learning happens when readers can follow a thought process, not just memorize commands. We're looking for people who share our obsession with quality and our belief that technical books should be both demanding and enjoyable -- and in bookstores of all kinds. Join us in our mission to create and distribute resources that don't just teach technology, but inspire readers to push its boundaries. Note: You must live in one of these states in order to be considered for a full time position: CA, GA, IL, MD, ME, MO, NY, OH, OR, PA, WA Sales Manager Our Sales Managers are strategic leaders who drive the success of technical publishing. We're seeking an experienced sales professional who can build relationships, identify market opportunities, and ensure our groundbreaking books reach the developers and technology enthusiasts who need them. WHAT YOU'LL DO: Plan and direct book distribution strategies across sales territories Build and manage relationships with our distributor, Penguin Random House and key distribution partners Analyze market data to optimize inventory and identify sales opportunities Create and deliver compelling sales presentations Develop and implement strategic sales campaigns Track performance metrics and adapt strategies for maximum impact Collaborate with our marketing team to align sales and promotional efforts WHAT YOU BRING: 5+ years of sales experience in book publishing or related industry Deep understanding of book distribution and sales channels Proven track record of meeting and exceeding sales targets Strong analytical skills for market analysis and forecasting Excellence in communication and presentation Bachelor's degree Experience managing and motivating teams WHAT SETS YOU APART: You're passionate about technology and the power of books You combine analytical thinking with creative problem-solving You thrive in a dynamic, remote environment You have exceptional organizational and multitasking abilities You're energized by working with a list beloved by readers worldwide This is a remote position; hybrid is possible. You'll work with a dedicated team while helping bring cutting-edge technical knowledge to readers across the globe. In order to be considered for this position please reply to [email protected] with your resume and cover letter. Salary range: $67,000 to $75,000. Senior Acquisitions Editor Our Senior Acquisitions Editors are creative visionaries who shape the future of technical publishing. We're seeking an experienced editor who can identify groundbreaking ideas, nurture technical authors, and transform complex concepts into books that developers and technology enthusiasts love. WHAT YOU'LL DO: Scout and recruit talented authors Guide manuscripts from concept to completion, ensuring they meet standards for technical accuracy and readability Build and manage relationships with technical reviewers and industry experts Develop compelling marketing narratives that capture value Collaborate with our production team to ensure seamless manuscript preparation Identify emerging technology trends and market opportunities for new titles WHAT YOU BRING: 8+ years of technical editing experience, with a proven track record of successful publications Deep understanding of the technology landscape and programming concepts Ability to transform technical writing into engaging, accessible prose Strong project management skills and experience managing multiple projects Keen eye for market opportunities and emerging technology trends Proficiency with publishing tools including Word, LibreOffice, and LaTeX/Overleaf Bachelor's degree in a relevant field WHAT SETS YOU APART: You're a technical enthusiast and storyteller You have an entrepreneurial mindset and can work independently You're passionate about creating resources that help people master technology You thrive in a collaborative, remote environment where quality is paramount HOW TO APPLY: In order to be considered for this position please reply to [email protected] with your resume and a cover letter specifically addressing: 1. Your experience working with authors 2. Examples of projects you've collaborated on 3. Your interest in the position This is a remote position; hybrid is possible. You'll work with innovative minds in technology while helping shape the future of technical education. Marketing Communications Assistant Respond to customer inquiries, coordinate with our authors, conduct research on marketing opportunities, and generally support our marketing efforts as a member of a tight-knit, flexible, and growing team. Although this is an entry-level position, we’re looking for someone who is eager and able to make substantial contributions to our company by building and maintaining relationships, identifying new opportunities, and tackling projects alongside the Marketing team. Key Responsibilities: Act as first point of contact for customers, ensuring prompt and professional responses through Freshdesk, Mailchimp, and social media platforms Resolve customer inquiries efficiently and pleasantly to maintain positive relationships Collaborate with Marketing team to improve customer service processes Author Coordination Serve as a liaison between the company and our authors, providing sales and marketing updates as needed in consultation with Marketing Manager Coordinate collaborative marketing efforts and media appearances with authors Gather title-specific information from authors as needed for internal resources and promotional materials Help to maintain strong relationships with authors Marketing Research Conduct research as needed to identify and qualify marketing opportunities Maintain a database of relevant conferences and other marketing events Investigate potential brand or influencer partnerships General Support Assist with projects as part of the greater Marketing team Qualifications: Bachelor’s degree in Marketing, Communications, or related field (or equivalent experience) Excellent written and verbal communication skills Strong analytical abilities with a keen eye for detail An ability to anticipate needs and take initiative without direction Proven experience in customer service, communications, marketing, or a similar role A proactive and collaborative mindset with the ability to accept feedback and juggle multiple priorities How to Apply: In order to be considered for this position please reply to [email protected] with the following: A detailed resume highlighting relevant experience A cover letter specifically addressing: Your experience working with customers Examples of collaborative projects on which you've worked Your level of familiarity with marketing and communications The reason for your interest in this position ​​​​​​​​​​Freelancers We're always on the lookout for excellent proofreaders, copyeditors, and indexers. If you're interested in freelance work, please email [email protected] detailing your relevant experience."
