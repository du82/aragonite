["https://nostarch.com/about_ebooks.htm"]
title = "About No Starch Press ebooks | No Starch Press"
description = "What is an ebook bundle? Most of our titles are available as an ebook bundle containing PDF, Mobi, and ePub files. If the bundle you download is a compressed (ZIP) file, simply uncompress it. Once uncompressed, you should have access to all three formats."
full_description = "What is an ebook bundle? Most of our titles are available as a DRM-free ebook bundle containing PDF, Mobi, and ePub files. If the bundle you download is a compressed (ZIP) file, simply uncompress it. Once uncompressed, you should have access to all three formats. We consider the entire ebook bundle and its files to be one entity. The ebook bundle will always contain a PDF, but it may also contain Mobi and ePub files. That means your rights in the ebooks that you purchase from us apply to the bundle as a whole, not to each separate file in the bundle. Please think of your ebook bundle as the equivalent of a printed book. We do. How do I receive my ebook bundle? When you purchase an ebook (bundle) on nostarch.com, a download link should appear in the Files section of your user account, along with an email notification telling you that your files are ready to download. Simply log into your account, and you'll be able to access your No Starch Press ebook library from any type of computer or mobile device. If you have problems downloading your ebook files, please email [email protected]. What's an ePub or Mobi file, and why should I care? You should be able to read PDFs on any operating system using a number of applications including viewers built into Internet browsers. You should be able to read our EPUB files on the Kindle, iPhone and iPad, iBooks, Nook, Kobo, and on the macOS, Windows, and Linux operating systems. You should also be able to view EPUB and MOBI ebooks using desktop software like Calibre (https://calibre-ebook.com/). How do I get my ebooks on my mobile device? All of our ebooks are DRM-free. That means you're free to load them onto the device of your choice and start reading. For advice on how to load your files onto your device, here are some helpful pointers: Android users should be able to view PDFs in a tool like Adobe Reader, view Mobi files in the Kindle app, and view ePub and PDF files in Google Play Nook users should be able to view ePub files. Apple iPad, iPhone, iBooks users (iOS) should be able to load ePub and PDF files Kindle users should be able to use the Mobi file PC users should be able to view any of the three formats using Adobe Reader or a tool like Calibre Kobo users should be able to load ePub and PDF files to the Kobo eReader by following these directions. Note: No Starch Press is unable to provide technical support for Kindle, iPhone, iPad, or any third party hardware or software. Can I print my ebook? Share it? The formats in your ebook bundle (PDF, ePub, and Mobi files) are DRM-free. We've never used DRM because we trust our readers and we believe that you should have the same rights in ebooks as in printed books. That said, please be sure that the use of your ebook bundle is consistent with any copyright restrictions, and with fair use. Almost any personal use of your ebook bundle is acceptable, including making a backup copy, copying it to your personal storage (whether local or online), etc. But making and sharing multiple copies is not playing fair, so please don't do that. (Posting your ebook files to torrent sites is also not playing fair, so don't do that either. If you have any questions about this, ask us: [email protected].) Like a printed book, you can lend your eBook bundle to a friend, as long as you don't keep any copies of the ebook bundle or the files it contains once you've loaned it out. What do I do if my ebook isn't rendering properly? Unfortunately, as much as we try, we are unable to test every book with every device. If you are unable to read an ePub or Mobi file contained in your ebook bundle, you'll still find that the PDF version of your book renders cleanly. All ebook bundles include PDFs. But if you do encounter rendering errors, please email us at [email protected] with any specific feedback, and we'll do our best to fix the issue. Are all of your titles available in ebook format? Most of our books are available in ebook format. Some are available as PDF only and, very rarely, some are not available in ebook format at all. This is usually for one of two reasons: The book is graphics-heavy, resulting in a very large PDF that then converts to a huge reflowable ePub or Mobi document. Books like these may be available as PDF only. The book's author has asked us not to sell the title electronically."
year_published = 2009
year_updated = 2024
