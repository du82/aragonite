["https://notabug.org/tos"]
title = "tos - NotABug.org: Free code hosting"
description = "Gogs is a painless self-hosted Git service."
full_description = 'NotABug.org provides Git repository, Wiki, and issue tracker hosting, referred to as hosting from here on in this document, for Free/Libre software projects as defined by the Free Software Foundation under certain terms and conditions If you find a violation of these terms anywhere on NotABug.org, or you have questions about this policy, please contact admin@notabug.org. NotABug.org does not claim any ownership of any data uploaded by its users. Using NotABug.org does not constitute a transfer of copyrights to NotABug.org. NotABug.org will provide you with private Git repositories for which the following conditions are met: NotABug.org is dedicated to providing a harassment-free experience for everyone, regardless of gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, age, race, or religion. We do not tolerate harassment of participants in any form. This code of conduct applies to all NotABug.org spaces, including Git repositories, issues, comments, and wiki content, both online and off. Anyone who violates this code of conduct may be sanctioned or expelled from these spaces at the discretion of the NotABug.org operators. Some projects hosted on NotABug.org may have additional rules in place, which will be made clearly available to participants. Participants are responsible for knowing and abiding by these rules. Clearly available is defined as a file named "CONDUCT" in the root of a repository, optionally in markdown format. This document supersedes any project specific code of conduct in case of a conflict. NotABug.org takes your privacy very seriously, apart from tracking required for normal operation of the site we make no further attempts to identify you or your activity. NotABug.org is also available through the Tor anonymous network. Additionally NotABug.org maintains a Tor hidden service at http://qs3zumwfci4tntnd.onion/. Please see this for additional information. As the function of NotABug.org is to share code and ideas many of your actions will be available to the internet at large. Please be aware that the email address you use in your Git pushes will be publicly visible in any Git repository that you collaborate with, and any forks made of those repositories.'
author = "Gogs"
year_published = 2025
