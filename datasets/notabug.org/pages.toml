title = "about - NotABug.org: Free code hosting"
description = "Gogs is a painless self-hosted Git service."
full_description = "NotABug.org is a free-software code collaboration platform for freely licensed projects. We exist to help projects that distribute under any free license. These include, but are not limited to: NotABug.org is based on the Gogs MIT licensed code collaboration platform. The version we run is always available here on the master branch. NotABug.org is run by Peers, a group of people interested in free software and free society. We help each other to support free projects and free culture. NotABug.org is currently primarily administered by Hein-Pieter van Braam-Stewart <hp@notabug.org> with help from other contributors."
