["https://note.mu/terms/seller_creators"]
title = "加盟店規約｜note ――つくる、つながる、とどける。"
description = "クリエイターが文章やマンガ、写真、音声を投稿することができ、ユーザーはそのコンテンツを楽しんで応援できるメディアプラットフォームです。だれもが創作を楽しんで続けられるよう、安心できる雰囲気や、多様性を大切にしています。"
full_description = "加盟店規約 総則 この加盟店規約（以下、「本規約」といいます。）は、noteご利用規約の一部を構成し、note株式会社（以下、「当社」といいます。）が提供する「note」（以下、「本サービス」といいます。）におけるポイントを利用する加盟店またはその申込者と当社との間の契約関係について定めるものです。 加盟店およびその申込者には、本規約のほか、当社が別途定める「 noteご利用規約 」が適用されるものとします。なお、noteご利用規約における「 note総則規約 」および「 noteクリエイター規約 」の規定と本規約の規定との間に矛盾抵触が生じた場合には、本規約の規定が優先して適用されるものとします。 定義 本規約において使用する用語は、本規約において別途定義するもののほか、以下の意味を有するものとします。本規約に定めのない用語は、noteご利用規約に定めるものと同義とします。 本サービスのウェブサイトおよびスマートフォンアプリを「本サイト」といいます。 クリエイターが本サービス上に配信したデジタルコンテンツまたは本サービス上で運営する各種サービスを利用する者を「ユーザー」といいます。 デジタルコンテンツの制作および配信または各種サービスの運営をし、本サービス上でユーザーに対し購読・閲覧その他の利用をさせる者を「クリエイター」といいます。 ユーザーとクリエイターの総称を「利用者」といいます。 本サービスにおけるデジタルコンテンツの販売価格および各種サービスの価格を総称して「代金」といいます。なお、代金には消費税相当額を含みます。 本規約3.に従い、ユーザーによる通常ポイントの決済の相手方となることができる資格を持つクリエイターとなることを申し込み、当社が承認したクリエイターを「加盟店」といいます。 本規約3.4に基づき成立する、本規約に基づく契約を「加盟店契約」といいます。 本サービスにおいて加盟店となることを希望するクリエイターを「加盟店契約申込者」といいます。 電磁的方法により記録される金額に応じた対価をユーザーから得て、当社が当該ユーザーに対して発行する前払式支払手段（資金決済に関する法律第３条第１項第１号）であり、ユーザーが、１ポイント＝１円として、本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等に使用することができるものを「通常ポイント」といいます。 当社がユーザーに対して無償で付与するものであり、ユーザーがnoteご利用規約に従い、1ポイント＝1円として、本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等に使用できるものを「期間限定ポイント」といいます。 通常ポイントおよび期間限定ポイントを総称して、「noteポイント」（以下「ポイント」といいます。）といいます。 取引契約に基づくユーザーの代金の支払にポイントを利用することを「ポイント決済」といいます。 当社からユーザーに対する通常ポイントの発行サービスおよび本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等の取引における通常ポイントを用いた決済サービスおよびこれに付随するサービスを「通常ポイントサービス」といいます。 当社が発行する通常ポイントによる決済について定める特約を「 通常ポイント利用特約 」といいます。なお、期間限定ポイントによる決済については、noteご利用規約における「 noteポイント規約 」をご参照ください。 本サービスの全ての利用者に適用される「note総則規約」、ならびにクリエイターとして利用する場合に適用される「noteクリエイター規約」、ユーザーとして利用する場合に適用される「noteユーザー規約」およびユーザーにおけるポイントの発行または付与および利用その他取り扱いに関してユーザーに適用される「noteポイント規約」から構成される規約を「noteご利用規約」といいます。なお、本規約、通常ポイント利用特約および本サイト上に掲載する本サービスの利用に関わるルール等についても、noteご利用規約の一部を構成するものとします。 加盟店契約 加盟店契約申込者は、当社に対して本サービスの加盟店契約申込みを行う場合には、本規約およびnoteご利用規約に同意のうえ、本サービスの会員登録を行うとともに、加盟店申込審査に必要な所定の資料（以下「提出書類」といいます。）を求められた場合には、当社に提出するものとします。加盟店契約申込者は、加盟店契約申込みにあたり、当社に対し、当社以外の前払式支払手段発行者との加盟店契約の締結およびこれに付随する合意をすることならびに加盟店契約に関連する当社以外の前払式支払手段発行者との間の一切の取引について加盟店契約申込者を代理する権限を授与するものとします。 加盟店契約申込者は、予め本規約およびnoteご利用規約の内容を確認・承諾のうえ、当社に対し加盟店契約申込みを行うものとし、加盟店が当社所定のフォームより申込事項を送信した場合には、本規約およびnoteご利用規約の内容を承諾したものとみなします。 加盟店は、当社から最新かつ真実の情報を提出するよう要請された登録情報および提出書類の内容が最新かつ真実の情報であることを保証するものとします。 当社は、加盟店契約申込者に関して、当社の定める基準に基づく加盟店契約申込者の加盟店契約審査を行うことができるものとします。当社が加盟店契約申込者による加盟店契約申込みを承諾する旨の通知が到達した時点で、本規約およびnoteご利用規約をその内容とする当社および加盟店間の加盟店契約が成立するものとし、加盟店契約申込者の登録が完了するものとします。なお、当社は加盟店による有料でのデジタルコンテンツの販売または各種サービスの運営開始をもって、加盟店契約の申込みおよび承諾通知に代えることができるものとします。また、当社は、加盟店契約申込者に対して、加盟店契約審査の結果として、加盟店契約申込者による加盟店契約申込みを承諾しなかった場合であっても、その理由を開示する義務を負わないものとします。 加盟店は、当社、当社が指定する決済事業者に対し、ポイント決済以外の方法によりユーザーから支払われるサービス代金を代理受領する権限を付与するものとします。 登録情報の変更 加盟店は、自己の登録情報に変更があった場合には、遅滞なく、当社所定の方法により、登録情報の変更を当社へ通知するとともに、登録情報の変更にかかる当社が請求する資料を求められた場合には提出するものとします。 加盟店が前項に定める手続を怠ったことにより、加盟店が損害を被った場合、当社の責めに帰すべき事由がある場合を除き、当社はそれにより加盟店が被った損害から一切免責されるものとします。 デジタルコンテンツの販売および各種サービスの運営 加盟店は、noteご利用規約に基づき、デジタルコンテンツの販売または各種サービスの運営を行うこととします。 加盟店は、noteクリエイター規約3.に基づき、当社の指定する範囲においてデジタルコンテンツの販売価格または各種サービスの価格を自由に設定することができます。 加盟店がデジタルコンテンツの販売または各種サービスの運営によりユーザーの個人情報を取得する場合、当社の プライバシーポリシー に則って管理するものとします。 当社は、加盟店による本規約5.1に定めるデジタルコンテンツの販売の開始または各種サービスの運営の開始後、当該デジタルコンテンツまたはサービスについて審査を行うものとします。加盟店は審査にあたり、当社が加盟店に対し情報の提供を求めたときは、これに応じなければなりません。加盟店がこれに応じない場合、または加盟店の本サービスの利用につき、本規約およびnoteご利用規約の遵守に疑義が生じた場合、当社は、加盟店に対する事前通知をすることなく、noteクリエイター規約10.等に基づき、本サービスの利用を停止し、当該審査の対象となったデジタルコンテンツの販売または各種サービスの運営を削除または一時停止し、または検索結果からの除外などの合理的な措置をすることができるものとします。 当社は、noteクリエイター規約11.に基づき、加盟店に対し、代金不払および違約金の支払いを求めることができるものとします。 ポイント決済 加盟店は、本サービス上で自らが行うデジタルコンテンツの販売または各種サービスの運営につき、noteご利用規約に基づき取引契約が成立した場合において、ユーザーが、noteご利用規約に定めるところにより、当社所定の方法で代金の支払の全部または一部にポイントを利用する旨の意思表示を行い、当社がこれを承認した場合には、本規約およびnoteご利用規約に従って適正にポイントによる決済を行うものとします。 本規約6.1の場合、当社がポイントの利用を承認した時点で、ユーザーが利用したポイント相当額について、当社が当該ユーザーからポイント相当額の債務を免責的に引き受けることによって加盟店は当該ユーザーに対して当該ポイント相当額分の代金を請求することができなくなるものとし、加盟店はこれら（当社がユーザーとの間で免責的債務に関する合意をすることを含みます。）について予め承諾します。この場合、当社は、当該利用されたポイント相当額分の金銭を、本規約7.に従い、加盟店に支払うものとします。 加盟店は、ユーザーが利用したポイント相当額が代金に満たない場合には、当社所定の方法により、当該代金からポイント相当額を控除した金額の支払いを受けることができるものとします。 加盟店は、ユーザーがポイントによる決済を希望した場合であっても、以下の各号に該当する場合は、ポイントによる決済を受け付けてはならないものとします。 別途当社が指定したサービス以外の取引である場合 本規約6.1に定める当社の承認がない場合 ユーザーがnoteご利用規約に違反している場合またはそのおそれがある場合 システムやネットワークの障害時その他やむを得ない事由により、当社がポイント決済を取り扱わないものと通知した場合 その他当社が別途定める場合 代金およびnote利用料率 当社は、本規約6.2に基づく当社による債務の引き受けの結果として、加盟店に対して、ポイント相当額に応じた支払債務を負うものとし、その支払いについては、noteクリエイター規約4.を準用するものとします。なお、本規約6.3に基づく代金の総額からポイント相当額を控除した金額については、noteクリエイター規約4.に定めるところにより支払いが行われるものとします。 禁止事項 加盟店は、以下の各号に該当する行為を行ってはならないものとします。 法令、本規約もしくはnoteご利用規約または当社以外の前払式支払手段発行者との加盟店契約に違反する行為。 以下に該当するデジタルコンテンツの掲載、メンバーシップにおける投稿その他の本サービスにおける情報の送信。 ① 盗作、剽窃など、他者の著作権等を侵害しているもの。 ② 上記のほか、他者の財産権、商標権等の知的財産権、肖像権、名誉・プライバシー等を侵害するもの。 ③ 詐欺やそのおそれがあるもの。 ④ 性的な音声、画像、動画の配信。 ⑤ わいせつ的、暴力的な表現行為、その他過度の不快感を及ぼすおそれのあるもの。 ⑥ 差別につながる民族・宗教・人種・性別・年齢等に関するもの。 ⑦ 自殺、集団自殺、自傷、違法薬物使用、脱法薬物使用等を勧誘・誘発・助長するおそれのあるもの。 ⑧ マルチ商法等、当社がユーザーに不利益をもたらすと判断する情報商材。 ⑨ 株式の銘柄推奨、その他金融商品取引法に抵触するもの。 ⑩ 「必ずもうかる」等、ユーザーに著しい誤解を招く表現を用いたもの。 ⑪ コンピュータウィルスその他有害なコンピューター・プログラムを含むもの。 ⑫ オンラインゲーム等のアカウント、キャラクター、アイテム、通貨および仮想通貨などを譲渡しようとするもの。 ⑬ 不当景品類および不当表示防止法、医薬品、医療機器等の品質、有効性および安全性の確保等に関する法律、ならびに医療法その他の広告に関する法令に違反するもの、またはそのおそれのあるもの。 ⑭ 特定の個人、特定のグループまたは組織になりすますもの。 ⑮ マルチ商法等当社がユーザーに対して不利益をもたらすものであると判断する情報商材の宣伝に直接もしくは間接的に利用するもの。 ⑯ 未成年者を犯罪行為またはそのおそれのある行為に勧誘するもの。 ⑰ 法令に違反するもの。 ⑱ 公序良俗に反するもの。 ⑲ ①から⑱までの内容が掲載されているサイトへのリンクがあるもの。 ⑳ その他、①から⑲までに準じる不適切なもの。 確定・未確定を問わず売上、利益その他これに類するものを公開して、本サービス上で配信するデジタルコンテンツや各種サービスの購入を煽る行為。 スパム投稿、スパム行為であると当社が判断する行為。 反社会的勢力またはそれに準ずると当社が独自に判断する行為。 掲載したデジタルコンテンツが不適切な内容であると当社が独自に判断する行為。 本サービスのサーバーに過度に負担をかける行為。 マネー・ロンダリングを目的とした行為 本サービスの運営に支障が生じると当社が独自に判断する行為。 その他、(2)①から⑲までに準じ、当社が不適切と独自に判断する行為 差別的取扱いの禁止 加盟店は、ポイント決済が本規約またはnoteご利用規約に違反することとなる場合を除き、正当な理由なく、ポイント決済の拒絶、現金払いその他の支払手段の利用の要求、追加代金の請求など、ポイント決済を希望するユーザーに対し、ポイント決済を行わないユーザーより不利となる差別的取扱いを行わないものとします。 調査、報告等 当社は、本規約またはnoteご利用規約の違反その他必要があると認めたときは、加盟店に対し、調査、報告、資料の提出等を求めることができるものとし、加盟店は、速やかにこれに応じるものとします。 本サービスに関し、関係各省庁その他行政機関等から調査、報告もしくは資料の提出等を求められた場合または指摘もしくは指導があった場合には、加盟店は、当社の指示に従い、調査、報告および資料の提出等を行い、また、当該指摘もしくは指導に従った措置を採るものとします。 代金不払および違約金の支払い 加盟店がユー