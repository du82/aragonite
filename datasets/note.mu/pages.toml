full_description = "通常ポイント利用特約 目的 この通常ポイント利用特約（以下、「本特約」といいます。）は、noteご利用規約の一部を構成し、note株式会社（以下、「当社」といいます。）が提供するnote（以下、「本サービス」といいます。）における、当社が発行する有償の「通常ポイント」による決済について定める特約です。本特約に定めのない事項は、noteご利用規約に従うものとします。なお、noteご利用規約における「 note総則規約 」、「 noteユーザー規約 」および「 noteポイント規約 」の規定と本特約の規定との間に矛盾抵触が生じた場合には、本特約の規定が優先して適用されるものとします。期間限定ポイントによる決済については、noteご利用規約における「 noteポイント規約 」をご参照ください。 本サービス上で通常ポイントを利用する者は、noteご利用規約および本特約に同意のうえ、本サービスを利用するものとし、これらの規約および本サイト上に掲載する本サービスの利用に関わるルール等に従って、通常ポイントを取得、使用等するものとします。 定義 本特約において使用する以下の用語は各々以下に定める意味を有するものとします。本特約に定めのない用語は、noteご利用規約に定めるものと同義とします。 本サービスのウェブサイトおよびスマートフォン・タブレットアプリを「本サイト」といいます。 クリエイターが本サービス上に配信したデジタルコンテンツまたは本サービス上で運営する各種サービスを利用する者を「ユーザー」といいます。 デジタルコンテンツの制作および配信または各種サービスの運営をし、本サービス上でユーザーに対し購読・閲覧その他の利用をさせる者を「クリエイター」（「クリエイター」には出版社を含みます。）といいます。 ユーザーとクリエイターを総称して「利用者」といいます。 本サービスにおけるデジタルコンテンツの販売価格および各種サービスの価格を総称して「代金」といいます。なお、代金には消費税相当額を含みます。 電磁的方法により記録される金額に応じた対価をユーザーから得て、当社が当該ユーザーに対して発行する前払式支払手段（資金決済法第3条第1項第1号）であり、1ポイント＝1円として、本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等に使用することができるものを「通常ポイント」といいます。 当社がユーザーに対して無償で付与するものであり、ユーザーがnoteご利用規約に従い、1ポイント＝1円として、本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等に使用できるものを「期間限定ポイント」といいます。 通常ポイントおよび期間限定ポイントを総称して、「noteポイント」（以下「ポイント」といいます。）といいます。 当社からユーザーに対する通常ポイントの発行サービスおよび本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等の取引における通常ポイントを用いた決済サービスおよびこれに付随するサービスを「通常ポイントサービス」といいます。 当社に対しユーザーによる通常ポイントの決済の相手方となることができる資格を持つクリエイターとなることを申し込み、当社が承認したクリエイターを「加盟店」といいます。 通常ポイントサービスを利用する加盟店またはその申込者と当社との間の契約関係について定める規約を「加盟店規約」といいます。 本サービスの全ての利用者に適用される「note総則規約」、クリエイターとして利用する場合に適用される「noteクリエイター規約」、ユーザーとして利用する場合に適用される「noteユーザー規約」およびユーザーにおけるポイントの発行または付与および利用その他取り扱いに関してユーザーに適用される「noteポイント規約」から構成される、本サービスの利用に関する規約を「noteご利用規約」といいます。なお、本特約、加盟店規約および本サイト上に掲載する本サービスの利用に関わるルール等についても、noteご利用規約の一部を構成するものとします。 申込みの方法 本サービスのウェブサイト上で通常ポイントサービスを利用しようとする場合には、本サービスの利用申込みをするものとし、利用申込みにあたっては、当社が定める所定のフォームから登録が必要となります。 ユーザーの利用申込みに対し、当社が承諾の通知を送信した時点で登録が完了となり、本サービスを利用することができる状態となります。 申込内容を確認させていただいた結果、本サービスへの登録をお受けできない場合があります。 当社は、過去にnoteご利用規約違反等によって当社から利用停止等の処分を受けたユーザーについて、ユーザーの登録の申込みを拒むことができます。 接続環境等の準備 ユーザーは、通常ポイントサービスを利用しようとする場合には、本サービスを利用するために必要なインターネット接続環境を自己の責任と負担で用意するものとします。 ユーザーは、自己の責任において本サービスを利用するものとし、当社に故意または重大な過失がある場合を除いて、本サービスを利用してなされた一切の行為およびその結果について一切の責任を負うものとします。 通常ポイントの発行 通常ポイントは、本サイトにおいて、１ポイント＝１円として、クレジットカード決済あるいはスマートフォン・タブレットアプリ内課金など当社が定める決済方法のうち、ユーザーが選択した方法により、購入することができます。 通常ポイントの1回あたりの購入額および保有の上限額は30万円です。 その他の通常ポイントの発行および保有に関する条件は、当社が別途定め、本特約または本サイト内において表示するところに従うものとします。 通常ポイントの発行手続きが完了した場合には、その後に利用可能な通常ポイントの残高が、当社所定の本サイト上に表示されますので、ユーザーは、当該表示を確認するものとします。 通常ポイントの発行を受けることができない場合 ユーザーは、以下の各号に該当すると当社が合理的に判断した場合には、通常ポイントの発行を受けることができない場合があります。 本特約またはnoteご利用規約に基づいてユーザーのアカウントが停止されているなど、ユーザーが本特約またはnoteご利用規約に基づくサービスを受けられない場合 ユーザーがnoteご利用規約もしくは本特約に違反し、または違反するおそれがある場合 本特約で定めた通常ポイントの発行条件に合致しない場合 停電、システム障害その他やむを得ない事由により、通常ポイントの発行を停止している場合 ユーザーの本サービスにおける取引状況ならびに通常ポイントの使用状況等に照らし、通常ポイントの発行が不適切である場合 その他当社が別途定める場合 前項に基づき、ユーザーが通常ポイントの発行を受けることできないことにより、ユーザーに損害等が生じた場合であっても、当社に故意または重大な過失がある場合を除いて、当社は、その責任を負いません。 通常ポイントの有効期限 通常ポイントの有効期限は、ありません。 通常ポイントの残高確認等 通常ポイントの利用可能な残高は、本サイト上の当社所定の画面にて確認いただくことができます。 通常ポイントの利用履歴は、本サイト上の当社所定の画面にて確認いただくことができます。ただし、本サイト上に表示される利用履歴の範囲等については、当社が定めるところによります。 通常ポイントの使用 ユーザーは、本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等について、1ポイント=1円として、その保有する通常ポイントを使用することができるものとします。 ユーザーが当社所定の方法により、本サイト上で通常ポイントを使用する旨を当社に通知し、当社がこれを承認した場合には、当社が、ユーザーが保有する通常ポイントを減算した時点で、ユーザーは、当該通常ポイント使用額の代金について支払を完了したものとします。 １回に使用することができる通常ポイントの数量その他の通常ポイントの使用に関する条件は、当社が別途定め、本特約または本サイト内において表示するところに従うものとします。 ユーザーが保有する通常ポイントを代金の支払いに使用した場合には、noteポイント規約6.の定めるとおり、当社は、代金のうち、当社の承認を得て使用された通常ポイントの金額相当分の代金等支払債務を、通常ポイントの減算時点で免責的に引き受け、ユーザーに代わって、本特約および加盟店規約に従って加盟店に支払うものとします。 ユーザーが利用した通常ポイントの相当額が、加盟店とユーザーとの間の取引契約における代金の総額に満たない場合、ユーザーは、当該代金の不足した金額をnoteご利用規約の定めに従い当社が指定する方法により支払うものとします。 通常ポイントを使用することができない場合 ユーザーは、以下の各号に該当すると当社が判断した場合には、通常ポイントを使用することができません。 通常ポイントが偽造、変造され、もしくは不正に作出されたものである場合、またはそのおそれがある場合 通常ポイントが違法に取得されたものである場合、違法に取得されたことを知りながら、もしくは知ることができる状態で取得した場合、または通常ポイントが違法に保有されるに至ったものである場合 本特約に基づくユーザーのアカウントが停止されているなど、ユーザーがnoteご利用規約に基づくサービスを受けられない場合 ユーザーが本特約もしくはnoteご利用規約に違反し、またはこれらに違反するおそれがある場合 本特約および当社が別途定めた通常ポイントの使用条件に合致しない場合 ユーザーの当社サービスまたは第三者サービスにおける取引状況ならびに通常ポイントの使用状況等に照らし、通常ポイントの使用が不適切である場合 システム障害、通常ポイントの破損、停電、天災地変その他やむを得ない事由により、当社サービスまたは通常ポイントの使用を停止している場合 本サービスの障害復旧対応や定期メンテナンス等により、一時的に当社サービスまたは通常ポイントの使用を停止している場合 その他当社が別途定める場合 前各号に基づきユーザーが通常ポイントを使用することができないことにより、ユーザーに損害等が生じた場合であっても、当社は、その責任を負いません。 通常ポイントの第三者による使用等 通常ポイントの使用は、ユーザー本人が行うものとし、当該ユーザー以外の第三者が行うことはできません。 当社は、通常ポイント使用時に入力されたユーザ名およびパスワードが登録されたものと一致することを当社所定の方法により確認した場合には、ユーザーによる使用とみなします。それが第三者による不正使用であった場合でも、当社は、使用された通常ポイントを返還する義務を負わず、ユーザーに生じた損害について一切責任を負いません。 当社に故意または重大な過失がある場合を除いて、ユーザーの端末の故障その他の事由により、ユーザーが保有する通常ポイントの全部もしくは一部が失われた場合でも、当社は、その責任を負いません。 加盟店との連絡等 本サービスにおいて加盟店が有料または無料でデジタルコンテンツを販売または各種サービスを運営する場合は、加盟店とユーザーとの間において直接契約が成立することになります。当社は加盟店にコンテンツの販売および各種サービスの運営の場を提供する立場になります。当社は、当該契約について契約の当事者とはならず、当該契約に関する責任は負いません。したがって、当該契約に基づき通常ポイントを使用して代金を支払った取引に際し、万一トラブルが生じた際には、ユーザーと加盟店との間で解決していただくことになります。ただし当社は当事者間のトラブルに関し、その解決に向け最大限努力します。 加盟店とユーザーとの間において、取引契約が成立した後、取消し、解除その他の理由により当該取引契約が効力を失った場合で、当社がこれを認めたときは、当社所定の方法により通常ポイントの使用を取り消します。ただし、通常ポイントの使用の取消しをすることができない場合には、当社所定の方法により、使用された通常ポイント相当額を返金することがあります。 払戻しの禁止 ユーザーは、通常ポイントを当社が指定する本サービスにおけるユーザーと加盟店との間の代金のうち当社が指定する代金の支払い以外の、現金、財物その他の経済的利益と交換することはできません。また、当社は、理由のいかんを問わず、一切通常ポイントの払戻しをいたしません。ただし、法令上必要な場合はこの限りではなく、この場合の払戻し方法は、法令に従って当社が定め、本サイト等に表示するところに従うものとします。 ユーザー資格の喪失 理由のいかんを問わず、ユーザーがユーザーとしての地位を喪失した場合には、当該ユーザーが保有する通常ポイントは全て失効し、以後、使用することはできないものとします。ユーザーは、本サービスを退会する際には、通常ポイントを全て使用のうえ、退会手続を行ってください。ユーザーの退会時に未使用の通常ポイントが残っていたとしても、当社は、ユーザーに対して、退会後において、通常ポイントに相当する金額等の支払義務を負わないものとします。 通常ポイントサービスの停止、終了等 当社は、以下の各号に該当する場合は、そのユーザーについて通常ポイントサービスの一部または全部を停止することがあります。この場合、当社はユーザーに対し何ら通知する義務を負いません。 通常ポイントが偽造、変造され、もしくは不正に作出されたものである場合、またはそのおそれがある場合 通常ポイントが違法に取得されたものである場合、ユーザーが違法に取得されたことを知りながら、もしくは知ることができる状態で取得した場合、または通常ポイントが違法に保有されるに至ったものである場合 ユーザーがnoteご利用規約に違反した場合 ユーザーの本サービスにおける取引状況ならびに通常ポイントの使用状況等に照らし、通常ポイントの使用が不適切である場合 noteご利用規約に基づき、ユーザーに対し、本サービスの利用を停止等すべき場合 その他当社が必要と認める場合 当社は、以下の各号に該当する場合は、通常ポイントサービスの一部または全部を停止することがあります。この場合、当社はユーザーに対し合理的な手段によりサービスを停止する旨の通知をします。 システム障害、通常ポイントの破損、停電、天災地変その他やむを得ない事由により、本サービスまたは通常ポイントサービスを提供することができない場合 通常ポイントサービスの障害復旧対応や定期メンテナンス等により、一時的に当社サービスまたは通常ポイントサービスを提供することができない場合 その他やむを得ない事由がある場合 当社は、ユーザーに対して事前に通知することなく、通常ポイントサービスの機能の一部を停止し、または中断することができます。 当社は、過去にnoteご利用規約の違反等によって当社から利用停止等の処分を受けたユーザーについて、通常ポイントサービスの利用の停止をすることができます。 通常ポイントサービスの終了 当社は、当社の都合により、通常ポイントサービスの提供を終了することができます。この場合、当社はユーザーに事前に通知します。 前項の場合、当社は、本サイトへの掲載その他当社所定の方法により、通常ポイントサービスを終了させる旨およびユーザーが保有する通常ポイント相当額の払戻しの方法について周知の措置をとります。この場合の払戻しの方法については、法令の定めに従います。 前項の場合において、通常ポイントの未使用残高が判明しない場合には、当社は、払戻しの義務を負わないものとします。 当社は、当社に故意または重大な過失がある場合を除いて、本条に基づき当社が行った措置に基づきユーザーに生じた損害について一切の責任を負いません。 地位譲渡 ユーザーは、当社の書面による承諾がなければ、契約上の地位または権利・義務について、第三者に対して譲渡、移転、担保設定、その他の処分をすることはできません。 事業譲渡 当社は本サービスにかかる事業を他社に譲渡した場合には、当該事業譲渡に伴い契約上の地位、本特約に基づく権利および義務ならびにユーザーの情報その他の顧客情報を当該事業譲渡の譲受人に譲渡することができるものとし、ユーザーは、かかる譲渡につき予め同意したものとします。なお、本規定における事業譲渡には、通常の事業譲渡のみならず、会社分割その他事業が移転するあらゆる場合を含むものとします。 通常ポイントサービスの内容および本特約の変更 当社は、当社の判断において、通常ポイントサービスの内容の変更をする可能性があります。また、当社は、当社の判断により、本特約を変更することがあります。変更後の本特約は、当社が別途定める場合を除いて、本サイト上に表示した時点より効力を生じるものとします。 当社は、通常ポイントサービスまたは本特約を変更する場合は、ユーザーに対し電子メールまたはその他周知に適した方法により通知した上で、所定のURLに変更後の本特約を掲示します。 上記にかかわらず、ユーザーが通常ポイントサービスまたは本特約の変更通知を受け取った後または通常ポイントサービスまたは本特約の変更日以後に本サービスを利用した場合は、その変更内容について異議なく同意したものとみなします。 分離可能性 本特約のいずれかの条項またはその一部が、法令等により無効と判断された場合であっても、当該無効とされた以外の部分は、継続して有効に存続するものとします。 準拠法と裁判管轄 本特約は日本法を準拠法とします。 本特約の各事項に関連して紛争が生じた場合は、東京地方裁判所を第一審の専属的合意管轄裁判所とします。 第1版 2024年4月10日制定"
