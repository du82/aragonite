full_description = "ご利用規約 このnoteご利用規約（以下、「本利用規約」といいます。）は、note株式会社（以下、「当社」といいます。）が提供するnote（以下、「本サービス」といいます。）の利用者に適用される、サービス利用にあたっての契約です。 本利用規約は、本サービスの全ての利用者に適用される「 note総則規約 」、ならびにクリエイターとして利用する場合に適用される「 noteクリエイター規約 」、ユーザーとして利用する場合に適用される「 noteユーザー規約 」およびユーザーにおけるポイントの発行または付与および利用その他取り扱いに関してユーザーに適用される「 noteポイント規約 」から構成されています。 その他noteのウェブサイトおよびスマートフォン・タブレットアプリ（以下、「本サイト」といいます。）上に掲載するnoteの利用に関わるルール等についても、本利用規約の一部を構成するものとし、適用されるものとします。本サービスをご利用いただく前に、これらをよくお読み頂き、同意下さいますようお願いします。 note総則規約 定義 クリエイターが本サービス上に配信したデジタルコンテンツまたは本サービス上で運営する各種サービスを利用する者を「ユーザー」といいます。 ユーザーのうち本サービスの会員登録を行わないで本サービスを利用する者を「ゲストユーザー」といいます。 デジタルコンテンツの制作および配信または各種サービスの運営をし、本サービス上でユーザーに対し購読・閲覧その他の利用をさせる者を「クリエイター」（「クリエイター」には出版社を含みます。）といいます。 当社が提供する本サービスにおける有料サービスである「noteプレミアム会員サービス」を利用するクリエイターを「プレミアム会員」といいます。 ユーザーとクリエイターを総称して「利用者」といいます。 電磁的方法により記録される金額に応じた対価をユーザーから得て、当社が当該ユーザーに対して発行する前払式支払手段（資金決済法第3条第1項第1号）であり、1ポイント＝1円として、本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等に使用することができるものを「通常ポイント」といいます。 当社がユーザーに対して無償で付与するものであり、ユーザーが本利用規約に従い、1ポイント＝1円として、本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等に使用できるものを「期間限定ポイント」といいます。 通常ポイントおよび期間限定ポイントを総称して、「noteポイント」（以下「ポイント」といいます。）といいます。 当社からユーザーに対する通常ポイントの発行サービスおよび本サービスのうち当社が指定するデジタルコンテンツまたは各種サービスの対価の支払い等の取引における通常ポイントを用いた決済サービスおよびこれに付随するサービスを「通常ポイントサービス」といいます。 当社に対しユーザーによる通常ポイントの決済の相手方となることができる資格を持つクリエイターとなることを申し込み、当社が承認したクリエイターを「加盟店」といいます。 当社が発行する通常ポイントによる決済について定める特約を「通常ポイント利用特約」といいます。 本サービスの機能と当社の役割 本サービスは、当社が管理・運営する、クリエイターとユーザーを直接つなげるデジタルコンテンツの市場をつくることを目的としたウェブサービスです。 当社は、プロモーション等を通じて本サービスの認知向上、ユーザーの利便性の向上およびクリエイターの収益向上に寄与できるよう努力します。 デジタルコンテンツの取扱い ユーザーは、本サービス上で、クリエイターと取引契約を締結し、本サービスを利用します。 クリエイターが制作したデジタルコンテンツの著作権は、クリエイターに帰属します。当社は、本利用規約に基づくメディアおよびプラットフォームとしての機能を提供する立場であって、ユーザーに対しデジタルコンテンツの著作権の譲渡、貸与等を認めるものではありません。 利用資格 本サービスは、以下のすべてを満たす方がご利用いただけます。 デジタルコンテンツを制作するクリエイター、ユーザーおよび当社が互いに協力してインターネット上にこれからのデジタルコンテンツ市場を作るという、本サービスの理念に同意できる方 インターネット接続環境を自己の責任と負担で用意できる方 本利用規約に同意の上継続して遵守できる方 契約締結について法的な責任能力のある方 当社が指定する方法による支払決済を利用できる支払い能力のある方 利用者は、自己の責任において本サービスを利用するものとし、本サービスを利用してなされた一切の行為およびその