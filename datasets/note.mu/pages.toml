title = "資金決済法に基づく表示｜note ――つくる、つながる、とどける。"
description = "クリエイターが文章やマンガ、写真、音声を投稿することができ、ユーザーはそのコンテンツを楽しんで応援できるメディアプラットフォームです。だれもが創作を楽しんで続けられるよう、安心できる雰囲気や、多様性を大切にしています。"
full_description = "資金決済法に基づく表示 通常ポイントに関する資金決済法に基づく表示 商号 note株式会社 支払可能金額等 累積保有限度額 30万円 有効期限 無期限 但し、退会その他の理由により、利用者が本サービスの利用者としての地位を失った場合には、通常ポイントは失効します。 お問い合わせ先 〒102-0083 東京都千代田区麹町6-6-2 note株式会社 運営事務局 リクエスト送信フォーム からお問い合わせください。 使用場所の範囲 「note」サービス内 利用上の注意点 「 noteご利用規約 」「 通常ポイント利用特約 」をご覧ください。 未使用残高を確認する方法 noteサイト上の「管理画面」で未使用残高を確認できます。 規約 「 noteご利用規約 」「 通常ポイント利用特約 」「 加盟店規約 」をご確認ください。 資金決済法に基づく利用者保護を図るための措置等 利用者の資金の保全に関する事項 資金決済法第14条第1項の規定の趣旨 前払式支払手段の保有者の保護のための制度として、資金決済に関する法律の規定に基づき、前払式支払手段の毎年3月31日及び9月30日現在の未使用残高の半額以上の額の発行保証金を法務局等に供託等することより資産保全することが義務づけられております。 資金決済法第31条第1項に規定する権利の内容 万が一の場合、前払式支払手段の保有者は、資金決済に関する法律第31条の規定に基づき、あらかじめ保全された発行保証金について、他の債権者に先立ち弁済を受けることができます。 発行保証金の供託、発行保証金保全契約または発行保証金信託契約の別 当社は、発行保証金を金銭により供託しています。 不正利用等の場合の補償その他の対応について 対応方針 ① 当社は、以下の事項について当社の責に帰すべき事由がある場合に限り、利用規約及び適用される法令の定めに従って、補償に関する対応を行います。 ・利用者の意思に反して前払式支払手段が不正に使用されまたは購入された場合 ② 当社及び連携するクレジットカード会社その他金融機関等（以下「クレジットカード会社等」といいます。）が以下の事項が発生したと判断する場合、当社はクレジットカード会社等と連携し、全額補償を行います。なお、事実関係の調査等のため必要と当社が判断する資料等の提供がない場合には、補償を行うことができない場合があります。 ・真の権利者の意思に反して前払式支払手段が不正に購入された場合 補償の手続き・問い合わせ窓口 上記(1)①に関する補償については、以下のリクエスト送信フォームからご連絡ください。リクエスト送信フォーム入力の際、リクエスト種別の中から「お問い合わせ・不具合報告をしたい」を選択し、その後に表示される質問項目の中から「noteポイントについて」を選択してください。 リクエスト送信フォーム 上記(1)②に関する補償については、お使いのクレジットカード会社等によって対応が異なる場合がありますので、まずはお使いのクレジットカード会社等にお問い合わせください。 不正利用の公表について 当社は、不正利用が発生した場合又はそのおそれがあると判断した場合、次の各号のいずれかに該当するときは、必要な情報を公表することがあります。 ① 被害の拡大を防止するために必要があると判断したとき ② 類似の事案の発生を回避するために有益であると判断したとき ③ 被害額や件数等の事情において社会的な影響が大きいと認められるとき"
