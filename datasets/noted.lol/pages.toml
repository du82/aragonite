full_description = "Self Hosted Roundup #30 by Jeremy Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website • March 04, 2023 • 3 min read Comments Share Share on X Share on Facebook Share on LinkedIn Share on Pinterest Email Copy link Self Hosted Roundup Self Hosting Welcome back to the Self Hosted Roundup where we bring you the latest in Self Hosted and Open Source applications!What new self hosted apps have we found this week? Let's take a look.Pastenympastenym - This project is inspired from pastebin service. The main goal is to offer a solution for sharing text with Nym products to offer full anonymity, even on metadata level.DemoPairDropPairDrop is a sublime alternative to AirDrop that works on all platforms.Send images, documents or text via peer to peer connection to devices in the same local network/Wi-Fi or to paired devices. As it is web based, it runs on all devices.LinuxServer has recently created a Docker image for PairDrop.DemoEasyPanelEasyPanel - Use an intuitive interface to deploy applications, manage databases, and provision SSL certificates.Chat DeskChat Desk is a BRAND NEW self-hosted chat application for desktop written in Flutter!Mastodon (LinuxServer Edition)Mastodon is a free, open-source social network server based on ActivityPub where users can follow friends and discover new ones. LinuxServer has created a Docker image that might simplify the installation for some users. Check it out here!ForteForte is a self-hosted music platform. You can either connect to a forte server or create your own server for your friends & family. However, it is also very convenient to use forte on your local machine as a stand-alone music player.HmsterHmster - A Self-hostable Instapaper-ish document managing app.Desktop App of the WeekThe free and open source desktop app of the week goes to....PeaZip 🏆PeaZip is a free file archive utility and rar extractor for Linux, macOS, and Windows, which works with 200+ archive types and variants (7z, ace, arc, bz2, cab, gz, iso, paq, pea, rar, tar, wim, zip, zipx...), handles spanned archives (001, r01, z01...), supports multiple archive encryption standards, file hashing, exports tasks as console scripts.Do you ❤️ Self Hosted Roundup?Spread the love and share this article with a friend and have them subscribe!Become a paid supporter of Noted ⭐We'd love to have you Join us on Discord with other Self Hosting and Homelab enthusiasts!These applications are not necessarily already highlighted on Noted but may eventually be reviewed. The goal of this series is to simply let you know what's new in Self Hosting (or new to me) in a bulletin style fashion so you have something to tinker with over the weekend. You can browse the Self Hosted applications or the directory for in depth reviews of applications we have used and tested.Have a great weekend everyone! Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website On this page Unlock full content Subscribe to Noted Subscribe Sending Sent Please check your inbox and click the confirmation link. Read Next 3 min read GoCron - A Self Hosted Go Based Task Scheduler with GUI Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 28, 2025 3 min read Dolibarr - Self Hosted HR and Customer Relationship Management Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of se