full_description = "Self Hosted Roundup #26 by Jeremy Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website • February 03, 2023 • 3 min read Comments Share Share on X Share on Facebook Share on LinkedIn Share on Pinterest Email Copy link Self Hosted Roundup Self Hosting I wrote this entire article using ChatGPT! Not really but wouldn't that be hilarious? Another week brings more goodies on Self Hosting!What's new in Self Hosted this Week?Some new and some not so new. Here's what I found this week!UpSnapUpSnap is s simple wake on lan app written with SvelteKit, Go, PocketBase and nmap. I personally use this on my network and really like it!Core FeaturesDashboard to wake up devices with one clickSet timed wake and shutdown events via cronAdd custom ports to devices which will be pingedDiscover devices by scanning networkDark/light or system preferred color schemeDocker images for amd64, arm64, arm/v7LibreNMSLibreNMS is an auto-discovering PHP/MySQL/SNMP based network monitoring which includes support for a wide range of network hardware and operating systems including Cisco, Linux, FreeBSD, Juniper, Brocade, Foundry, HP and many more.LodestoneThe #1 goal of Lodestone is to make self-hosting game servers on any platform a streamlined and simple process. Lodestone is built with a focus on the user experience to minimize the friction of setting up a server. Part of this effort is an intuitive and straightforward UI we have developed over 4 months. Lodestone also has some advanced features on the table for expert users, such as an event viewer, multiple users + permissions, and an upcoming plugin system.ActivepiecesActivepieces is a no-code Business Automation Tool. An open source alternative to Zapier.Built for no-code users and citizen developersSelf-host with a simple Docker commandAn alternative to Zapier, Make.com and TrayNomieNomie is a Open Source Life Tracker / Mood Tracker / Data Journal. I found some Docker Compose builds in the issue tracker here.Desktop App of the WeekThis week I thought I'd add in a nice find for converting files on a Windows machine.File ConverterFile Converter is a very simple tool which allows you to convert and compress one or several file(s) using the context menu in windows explorer. And it's Open Source!👋Like what you see? Consider subscribing to the Noted newsletter!OSS-RSSCheck out our new Self Hosted and OSS related RSS feed with over 10 member blogs and a handful of other well known, related blogs. OSS-RSS feed is a mobile friendly, centralized, all-in-one Self Hosting and Open Source RSS feed for those interested in Self Hosting, Open Source and a dash of security tossed in. We even include popular related podcasts!That's all I have this week but if you can't get enough, you can always see more here or check out the Self Hosted app directory. Be sure and subscribe to our newsletter where you can get these articles sent to your inbox every week!We'd love to have you Join us on Discord with other Self Hosting and Homelab enthusiasts!Have a great weekend everyone! Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website On this page Unlock full content Subscribe to Noted Subscribe Sending Sent Please check your inbox and click the confirmation link. Read Next 3 min read GoCron - A Self Hosted Go Based Task Scheduler with GUI Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to