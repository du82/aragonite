full_description = '''Self Hosted Roundup # 29 by Jeremy Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website • February 25, 2023 • 3 min read Comments Share Share on X Share on Facebook Share on LinkedIn Share on Pinterest Email Copy link Self Hosted Roundup Self Hosting Welcome back to the Self Hosted Roundup where we bring you the latest in Self Hosted and Open Source applications!CogitoCogito is... another second brain app.All your notes in one placeadd Linkadd Tweetadd Noteadd Tag, Title, CommentSearch in Article, Tweet and NoteAutomatic Tag with Natural language processingSave searchDark themeMark card as TodoBulk remove or add tag (hold shift and select)PWA app (with share to cogito option on Android)Open to feature requestLinksnatchLinksnatch is an effortlessly simple bookmarks app that lets you save the links on your device on the go. Docker image here.LynxLynx is a fullstack application using the MEVN stack to shorten your URLs.MIND RemindersMIND is a simple self hosted reminder platform that uses push to send notifications to your device. Set the reminder and forget about it!Theme ParkTheme Park is a place to get custom themes for your favorite apps! If you run any of the LinuxServer arr apps simply add the following 2 environment variables to your stack to use the theme you see above (overseerr). Example for Sonarr- DOCKER_MODS=ghcr.io/gilbn/theme.park:sonarr - TP_THEME=overseerr So the compose file would look like this.version: "2.1" services: sonarr: image: lscr.io/linuxserver/sonarr:latest container_name: sonarr environment: - PUID=1000 - PGID=1000 - TZ=Etc/UTC - DOCKER_MODS=ghcr.io/gilbn/theme.park:sonarr - TP_THEME=overseerr volumes: - /path/to/data:/config - /path/to/tvseries:/tv #optional - /path/to/downloadclient-downloads:/downloads #optional ports: - 8989:8989 restart: unless-stopped Desktop App of the WeekThe free and open source desktop app of the week goes to....Sigma File Manager 🏆Sigma File Manager is a free, open-source, quickly evolving, modern file manager (explorer / finder) app for Windows and Linux.Websites and Tools to check OutA weekly short list of interesting websites, useful tools and articles.End of an Era: Linode Brand RetiredLast year, Akamai bought industry pioneer Linode, with the intent of integrating the virtual server provider into its global network of cloud computing services. Today Akamai announced that the Linode brand is being retired: Over the next few months, you’ll notice some cosmetic changes to your Linod…LowEndBoxraindog308Over-engineering my document storage system with Paperless-ngxI think the first realisation that I was getting old was when I implemented a system to store physical + digital documents and was excited about it. My previous document system looked a little something like this: Whenever someone asked me “hey can you prove you got a C in GCSESkerritt.blogAutumn SkerrittDo you ❤️ Self Hosted Roundup?Spread the love and share this article with a friend and have them subscribe!Become a paid supporter of Noted ⭐We'd love to have you Join us on Discord with other Self Hosting and Homelab enthusiasts!These applications are not necessarily already highlighted on Noted but may eventually be reviewed. The goal of this series is to simply let you know what's new in Self Hosting (or new to me) in a bulletin style fashion so you have something to tinker with over the weekend. You can browse the Self Hosted applications or the directory for in depth reviews of applications we have used and tested.Have a great weekend everyone! Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taugh