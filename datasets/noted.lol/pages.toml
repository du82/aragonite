full_description = "About NotedWhat is Noted and how can we help you learn more about self-hosting and open-source software?Noted is an independent publication that took its first steps in April 2022. Our main areas of interest orbit around Home Lab, Self Hosting, Security, and all things Open Source or free software, often referred to as FOSS.The Noted MissionAt Noted, we're on a mission to explore the vast world of free and open-source applications, created by remarkable developers from all corners of the globe. Our aim is to be the guiding star that leads newcomers through the cosmic journey of self-hosted applications, inspiring them to embark on their own digital odyssey, boldly venturing where they've never gone before.Discover something newPerhaps you'll stumble upon a game changer that revolutionizes how you navigate your self-hosted homelab. Personally, I'm always on the hunt for fresh projects to satisfy my self-hosting curiosity. That's why I created the Self-Hosted Roundup dedicated to folks like us who crave new tinkering opportunities.Noted AnalyticsNoted is completely transparent. We do not collect any personal data through analytics. We use Umami and Plausible for tracking which both use anonymous tracking methods.Get it delivered!Stay up to date with new content sent straight to your inbox! No more worrying about whether you missed something because of a pesky algorithm or news feed. Subscribe here. We deliver each Self Hosted Roundup via email each week so be sure to subscribe for free if you don't want to miss a beat! Sign up for Noted Subscribe .nc-loop-dots-4-24-icon-o{--animation-duration:0.8s} .nc-loop-dots-4-24-icon-o *{opacity:.4;transform:scale(.75);animation:nc-loop-dots-4-anim var(--animation-duration) infinite} .nc-loop-dots-4-24-icon-o :nth-child(1){transform-origin:4px 12px;animation-delay:-.3s;animation-delay:calc(var(--animation-duration)/-2.666)} .nc-loop-dots-4-24-icon-o :nth-child(2){transform-origin:12px 12px;animation-delay:-.15