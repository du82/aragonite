description = "What's new in self hosted applications this week? Check it out in the Self Hosted Roundup #28! 👋"
full_description = "Self Hosted Roundup #28 by Jeremy Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website • February 17, 2023 • 3 min read Comments Share Share on X Share on Facebook Share on LinkedIn Share on Pinterest Email Copy link Self Hosted Roundup Self Hosting What's new in Self Hosted apps this week?We have a nice trend this week! Here's a look at what we found.ZipLineZipLine is a ShareX file upload server that is easy to use, packed with features such as image and text (code snippet) sharing, url shortener and more. You can also use ZipLine as a standalone application without ShareX by manually uploading your files in the dashboard. PaasterPaaster is a secure and user-friendly pastebin application that prioritizes privacy and simplicity. With end-to-end encryption and paste history, Paaster ensures that your pasted code remains confidential and accessible.AnonUploadAnonUpload is a simple, databaseless PHP file uploader. It's built with privacy in mind, by not showing the direct filename used. AnonUpload is designed to work anywhere! Nginx, Apache, Lightspeed, Anything Will Work!jfa-gojfa-go is a user management app for Jellyfin (and now Emby) that provides invite-based account creation as well as other features that make one's instance much easier to manage.PodgrabPodgrab is a is a self-hosted podcast manager which automatically downloads latest podcast episodes. It is a light-weight application built using GO.YopassYopass is a project for sharing secrets in a quick and secure manner*. The sole purpose of Yopass is to minimize the amount of passwords floating around in ticket management systems, Slack messages and emails. The message is encrypted/decrypted locally in the browser and then sent to yopass without the decryption key which is only visible once during encryption, yopass then returns a one-time URL with specified expiry date.Websites and Tools to check OutDaily Dev - daily.dev is a browser extension and a web app that helps developers stay updated on the latest programming news. Essentially it's a feed of articles we gather from the best tech blogs on any programming topic.Awesome Self Hosted - Your go-to Self Hosted Toolbox. Our goal is to help you find the software and libraries you need. Made by developers for developers.CyberChef - The Cyber Swiss Army Knife - a web app for encryption, encoding, compression and data analysis.Weekly Poll QuestionLast week we asked your opinion about what self hosting is and here are the results!This weeks question: How often do you do System Updates? <– Click to take the poll!Loading...Do you ❤️ Self Hosted Roundup?Spread the love and share this article with a friend and have them subscribe!Become a paid supporter of Noted ⭐We'd love to have you Join us on Discord with other Self Hosting and Homelab enthusiasts!These applications are not necessarily already highlighted on Noted but may eventually be reviewed. The goal of this series is to simply let you know what's new in Self Hosting (or new to me) in a bulletin style fashion so you have something to tinker with over the weekend. You can browse the Self Hosted applications or the directory for in depth reviews of applications we have used and tested.Have a great weekend everyone! Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website On this page Unlock full content Subscribe to Noted Subscribe Sending Sent Please check your inbox and click the confirmation link. Read Next 3 min read GoCron - A Self Hosted Go 