description = """
If you're thinking about setting up your own self-hosting hardware and applications but don't know how to begin, these articles and guides can point you in the right direction and maybe even clear up some of your doubts. I've listed them in the order you should read them.





How Can"""
full_description = "Get Started Self-Hosting If you're thinking about setting up your own self-hosting hardware and applications but don't know how to begin, these articles and guides can point you in the right direction and maybe even clear up some of your doubts. I've listed them in the order you should read them. How Can I Get Started Self-Hosting? Want to get started self-hosting? Here's the rundown on the basics to get you started. Learn more What is a Homelab and What can You Learn from Them? Let's talk homelabs! What are they and why do you need a homelab? It's much easier than you think to get started! Learn more Install Docker and Portainer on Debian for Self-Hosting Install Docker and Portainer with this quick and simple guide sure to have you self-hosting your own apps in no time at all. Learn more Self Host a Ghost Blog on Your Homelab Using Docker Hosting your own website is fun and satisfying knowing you are in complete control of your data. Not only that but you are saving money by not paying for 3rd party hosting services. Learn more Setup your Domain using Cloudflare Tunnels and Zero Trust Here's how you can utilize Cloudflare DNS and Zero Trust to access your self hosted website with your domain name. Learn more How to Protect Self Hosted Login Pages using Cloudflare Zero Trust Policies Protect your Self-Hosted, SaaS and Private applications with Zero Trust policies. Only users who match your policies will have access to your configured applications. Learn more If for whatever reason you do not have good internet and need a place to self host a blog, you can always seek out a VPS provider. I can highly recommend Hosthatch. Hosthatch High performance compute VMs, with dedicated CPU allocations and extremely high IOPS NVMe disks. Deploy in 16 edge locations, and deliver consistently high-performance to your users, regardless of where they are located. Starting at $4/mo You can get started at just $4/mo with 10GB of storage, 2Gb RAM, 1TB of data transfer, 1 Dedicated IP and DDoS protection. To give you a point of reference, Noted is just under 5GB and I have uploaded thousands of images since April 2022. 10GB is more than enough space for a website like this."
