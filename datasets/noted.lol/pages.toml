description = "What's new in self hosted applications this week? Check it out in the Self Hosted Roundup #31! 👋"
full_description = '''Self Hosted Roundup #31 by Jeremy Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website • March 11, 2023 • 4 min read Comments Share Share on X Share on Facebook Share on LinkedIn Share on Pinterest Email Copy link Self Hosted Roundup Self Hosting Welcome back to the Self Hosted Roundup where we bring you the latest in Self Hosted and Open Source applications each week.What new self hosted apps have we found this week? Let's take a look.HuntlyHuntly is a self-hosted information management tool, in simple terms, contains the following features.RSS subscription and reading.Automatically saves the pages that have been viewed, then you can save them as read later, favorites or archives.There is a special treatment for Twitter sites that automatically saves the requested tweet timeline, recording whether it has been viewed or not, and in huntly you can even revisit these tweets in a more convenient way.You can search by title, content, type, favorite method, and other dimensions.Connect to other services, currently GitHub is supported, so it's also a Github stars management tool.In the future, it may support connections to services like Pocket, Hypothesis, etc.DocspellDocspell is a personal document organizer. Or sometimes called a "Document Management System" (DMS). You'll need a scanner to convert your papers into files. Docspell can then assist in organizing the resulting mess 😉. It can unify your files from scanners, emails and other sources. It is targeted for home use, i.e. families, households and also for smaller groups/companies.Tasks.mdTasks.md is a self-hosted file based task management board that supports Markdown syntax.FeaturesCreate cards, lists and tags in a modern and responsive interface;Write cards as Markdown files;Easy to install with a single Docker image;Light and dark themes synced with operating system settings;Heavy customizable with 3 default color themes (Adwaita, Nord and Catppuccin);Support for subpath based reverse-proxy with a environment variable for base path;Home JournalHome Journal is a self-hosted mini journaling site for families for capturing memories, stories, photos, ideas, jokes and anything else you want to remember.ListoryLogin with Spotify and Listory will save all tracks you listen to.sponsorblockcastsponsorblockcast is a POSIX shell script that skips sponsored YouTube content and skippable ads on all local Chromecasts, using the SponsorBlock API. It was inspired by CastBlock but written from scratch to avoid some of its pitfalls (see Differences from CastBlock).Desktop App of the WeekThe free and open source desktop app of the week goes to...Tabby 🏆Tabby (formerly Terminus) is a highly configurable terminal emulator, SSH and serial client for Windows, macOS and LinuxIntegrated SSH and Telnet client and connection managerIntegrated serial terminalTheming and color schemesFully configurable shortcuts and multi-chord shortcutsSplit panesRemembers your tabsPowerShell (and PS Core), WSL, Git-Bash, Cygwin, MSYS2, Cmder and CMD supportDirect file transfer from/to SSH sessions via ZmodemFull Unicode support including double-width charactersDoesn't choke on fast-flowing outputsProper shell experience on Windows including tab completion (via Clink)Integrated encrypted container for SSH secrets and configurationSSH, SFTP and Telnet client available as a web app (also self-hosted).Joke of the WeekOne day, William was called to fix a computer at a local business. As he was working on the computer, he accidentally spilled his coffee all over the keyboard. "Oh no!" he exclaimed. "I guess that's what you call a 'Java' error!" His client just stared at him blankly, clearly not amused. 😆👋Like what you see? Consider subscribing to the Noted newsletter! You can always unsubscribe at any time. We also have Discord!Do you ❤️ Self Hosted Roundup?Spread the love and share this article with a friend and have them subscribe!Become a paid supporter of Noted ⭐We'd love to have you Join us on Discord with other Self Hosting and Homelab enthusiasts!These applications are not necessarily already highlighted on Noted but may eventually be reviewed. The goal of this series is to simply let you know what's new in Self Hosting (or new to me) in a bulletin style fashion so you have something to tinker with over the weekend. You can browse the Self Hosted applications or the directory for in depth reviews of applications we have used and tested.Have a great weekend everyone! Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website On this page Unlock full content Subscribe to Noted Subscribe Sending Sent Please check your inbox and click the confirmation link. Read Next 3 min read GoCron - A Self Hosted Go Based Task Scheduler with GUI Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 28, 2025 3 min read Dolibarr - Self Hosted HR and Customer Relationship Management Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 25, 2025 3 min read HabitTrove - Self Hosted, Gamified Habit Tracker Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 22, 2025 7 min read How to Self Host and Install WG-Easy VPN using a VPS Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 21, 2025 2 min read PSWD: Self-Hosted, Simple & Secure Password Generator Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 20, 2025 3 min read Create the Perfect Working Environment with Ambient Sounds using Atomify Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 19, 2025 3 min read Many Notes: Open-Source and Self Hosted Markdown Note-Taking App Bruno Creator and developer of Many Notes - a markdown note-taking app designed for simplicity Website Feb 19, 2025 6 min read Kokoro FastAPI - Self Hosted Text to Speech Platform Installation Guide Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 18, 2025 4 min read Zonos TTS: Self Hosted ElevenLabs Rival Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 17, 2025 4 min read Stump: Self Hosted Comics, Manga and Digital Book Server with OPDS Support Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators.