description = "Noted celebrates 300 articles and Happy New Year! I'm kicking off the new year a bit behind schedule, but I couldn't help feeling excited to celebrate! Reaching 300 articles is a huge milestone. Nearly three years have flown by since we first hit publish on our very first post."
full_description = "News 300 Articles and a Happy New Year Noted celebrates 300 articles and Happy New Year! I'm kicking off the new year a bit behind schedule, but I couldn't help feeling excited to celebrate! Reaching 300 articles is a huge milestone. Nearly three years have flown by since we first hit publish on our very first post. Subscribe to Noted Subscribe Sending Sent Please check your inbox and click the confirmation link. Comments Share Share on X Share on Facebook Share on LinkedIn Share on Pinterest Email Copy link I'm kicking off the new year a bit behind schedule, but I couldn't help feeling excited to celebrate! Reaching 300 articles is a huge milestone. Nearly three years have flown by since we first hit publish on our very first post. It's crazy to think about how far we've come, and I'm so grateful to have all of you along for the ride. We've grown, learned, and shared so many amazing self-hosted applications together, and I'm honored to be a part of this journey with each and every one of you.What's New?I've given our site a fresh new look, and I'm excited to share it with you! As someone who's probably used to seeing just the content in your RSS reader, I want to make sure you know that I designed this update to be enjoyable for me too, but also hopefully makes it easier for you to find what you're looking for. One of my favorite new features is the Table of Contents on each post page. It's a simple touch that makes browsing through our content so much more straightforward and organized.To be honest, not much else has changed. I'm still here and still enthusiastic about sharing my thoughts and ideas! As I reflect on the past few years, I've realized that I might not have been as consistent with publishing articles as I used to be. However, I'm committed to continuing this journey and bringing some fresh energy to it.New Categories Page!I'm excited to finally share my latest creation with you! After spending two hours building it from scratch, I've got a page that lets you see all the categories on Noted at once. And yes, You can even import them into your RSS reader for specific content you want to see. Just add /rss to the end of the tag URL. I've also added a link in the header for easy access to the page.Final Notes and ThoughtsLooking ahead, it's clear that I have a wealth of topics to cover. But rest assured, self-hosting is still the top priority for me, and I'm committed to delivering quality content through this platform.I also want to thank our community on Discord. Your engagement and feedback have been invaluable, and I'm excited to continue sharing knowledge and resources with you. I appreciate your continued interest and I look forward to seeing what the future holds for Noted! Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website On this page Unlock full content Subscribe to Noted Subscribe Sending Sent Please check your inbox and click the confirmation link. Read Next 3 min read GoCron - A Self Hosted Go Based Task Scheduler with GUI Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 28, 2025 3 min read Dolibarr - Self Hosted HR and Customer Relationship Management Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 25, 2025 3 min read HabitTrove - Self Hosted, Gamified Habit Tracker Jeremy Hello! I'm Jeremy, the crea