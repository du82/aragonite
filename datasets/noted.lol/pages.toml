 Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 17, 2025 4 min read Stump: Self Hosted Comics, Manga and Digital Book Server with OPDS Support Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 14, 2025 3 min read Squirrel Servers Manager: Easily Manage your Servers & Containers Emmanuel Costa Feb 13, 2025 Subscribe to Noted Subscribe to our newsletter to get news and reviews delivered to your inbox! Subscribe Sending Sent Please check your inbox and click the confirmation link. Discussion'''
