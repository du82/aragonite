title = "HabitTrove - Self Hosted, Gamified Habit Tracker"
description = "Track your progress with a gamified system where daily habits earn you coins, redeemable for exciting rewards with the self hosted HabitTrove."
full_description = '''Self Hosted Task Management & To-do Lists HabitTrove - Self Hosted, Gamified Habit Tracker Track your progress with a gamified system where daily habits earn you coins, redeemable for exciting rewards with the self hosted HabitTrove. by Jeremy Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website February 22, 2025 • 3 min read Comments Share Share on X Share on Facebook Share on LinkedIn Share on Pinterest Email Copy link The eternal struggle of getting kids to help out around the house! It feels like pulling teeth, doesn't it? But today, that changed when I found a new self hosted app. I sat down with my wife and our kids, and we introduced them to a new system that's all about making chores feel more like fun. Introducing HabitTrove. Essentially, they earn points for completing things (we're calling them "habits"), which they can then trade in for rewards. My wife was super excited about it, and the kids were over the moon with enthusiasm ("Yes!"). From this moment on, I'm hopeful that our little ones will start taking ownership of their responsibilities and maybe even develop a growth mindset along the way.What is HabitTrove?HabitTrove is a gamified habit tracking application that helps you build and maintain positive habits by rewarding you with coins, which you can use to exchange for rewards.HabitTrove Core Features Create and track daily habits Earn rewards for completing habits Create a wish list of rewards to redeem with earned coins View your progress through habit completion streaks and statistics Visualize your progress on the calendar heatmap Support for dark mode settings Available as a progressive web app (PWA) for seamless mobile access Install HabitTrove using Docker ComposeInstalling HabitTrove is simple. Drop the following Docker Compose config into Portainer.services: habittrove: ports: - "3000:3000" volumes: - "./data:/app/data" # Use a relative path instead of $(pwd) image: dohsimpson/habittrove environment: - AUTH_SECRET=SfsSzodbyIsuwIZ4D3eOtjy6u3kLnzY8Chang the AUTH_SECRET by generating a new one using openssl rand -base64 32 in your terminal.Visit the HabitTrove web ui by visiting the server IP on port 3000.Using HabitTroveUsing the HabitTrove web interface, you can add habits, tasks and customize them with rewards and give them a coin value.Building Positive Routines : Launch a new habit by clicking "Add Habit" and give it a name, description, and personalized reward.💡When adding a new Habit, you need to use one of the following in the "When" field: every day, every week, every month or every year.Tracking Progress : Update your dashboard to reflect completed habits, earning you rewards with every milestone achieved.Reward Redemption : Browse your curated wishlist of available rewards that can be redeemed with earned coins.Monitoring Momentum : Visualize your journey through the interactive progress heatmap and streak counters, providing valuable insights into your growth.Final Notes and ThoughtsIf there's one self-hosted app that has won over my wife, it's this one! She was eager to dive in and start exploring its features, asking me how she could get access to start adding more rewards and building more habits. I couldn't help but feel a sense of pride knowing it had already resonated with her, and even my kids have caught on and are enjoying it too.Please visit the HabitTrove Github repo and give it a star!👋Like what you see? Consider subscribing to the Noted newsletter! You can always unsubscribe at any time. We also have Discord! Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website On this page Unlock full content Subscribe to Noted Subscribe Sending Sent Please check your inbox and click the confirmation link. Read Next 3 min read GoCron - A Self Hosted Go Based Task Scheduler with GUI Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 28, 2025 3 min read Dolibarr - Self Hosted HR and Customer Relationship Management Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 25, 2025 7 min read How to Self Host and Install WG-Easy VPN using a VPS Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 21, 2025 2 min read PSWD: Self-Hosted, Simple & Secure Password Generator Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 20, 2025 3 min read Create the Perfect Working Environment with Ambient Sounds using Atomify Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 19, 2025 3 min read Many Notes: Open-Source and Self Hosted Markdown Note-Taking App Bruno Creator and developer of Many Notes - a markdown note-taking app designed for simplicity Website Feb 19, 2025 6 min read Kokoro FastAPI - Self Hosted Text to Speech Platform Installation Guide