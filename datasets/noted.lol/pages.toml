full_description = "Noted Updates February 2023 by Jeremy Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website • February 02, 2023 • 2 min read Comments Share Share on X Share on Facebook Share on LinkedIn Share on Pinterest Email Copy link News Hey everyone! 👋 Jeremy here with another Noted update. Let's take a look at what's been going on for the month of January on Noted!Giving back to Open SourceAs mentioned in our last update, we have been sponsoring developers in the F/OSS community. Thanks to our amazing members, we have been able to sponsor 6 developers this month! Yes, we are starting slow but I believe this will grow to be an amazing effort from the community.If you didn't know already, any membership that is $5 or more will be partially donated to open source projects. We explain more in detail here and how you can help! If you are a free member and want to upgrade, just login and tap the upgrade button in the upper right corner.You can save articles as BookmarksThis is nothing new but it's something overlooked by most people. We have a built in bookmark system where you can click the icon below the featured image and save the article.Simply click the bookmark icon then navigate to the bookmarks page. And the best part is you don't even have to be logged in. You can add and delete bookmarked articles any time, anywhere as long as you use the same browser.Noted Community Now OpenA couple weeks ago we reviewed the open source Answer portal. I liked it so much that we decided to use it as our community portal where you can ask, answer and vote on self hosted related questions. The development team did say there will be a dark mode coming soon too!OSS-RSS is a thing NowOur friendly staff MediaCowboy and I have been curating a list of members blogs that relate to self hosting and homelab content. We have 10 member blogs already on the list. I also made this so you can get the feed all in one place! OSS-RSS is a simple aggregator that pulls articles using RSS from each member blog and others we feel fit the niche. Add it to your favorites or bookmarks and enjoy the reads! It looks really good on mobile devices too.OSS stands for Open Source Software but we will also curate other related content.OSS-RSS uses a self hosted app called RSS. I did a quick review of the RSS app here that you can check out. It's made by Dan Brown, the same developer who created Bookstack!What do you want to see more of on Noted?Lastly, I value your feedback and would appreciate if you could take this quick Poll so I know what you want to see more of on Noted. https://strawpoll.com/polls/X3nk46lrBgELoading...This will help us focus on that content and help deliver more of what you want to see here! 😀Thank you for reading and we look forward to sharing more great content with you! 👋 Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website On this page Unlock full content Subscribe to Noted Subscribe Sending Sent Please check your inbox and click the confirmation link. Read Next 3 min read GoCron - A Self Hosted Go Based Task Scheduler with GUI Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 28, 2025 3 min read Dolibarr - Self Hosted HR and Customer Relationship Management Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab 