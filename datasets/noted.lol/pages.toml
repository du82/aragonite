["https://noted.lol/noted-update-march-2023"]
title = "Noted Updates March 2023 - 200 Articles! 🎉"
description = "I have some new and exciting things to share with you all. Oh! And we hit 200 articles!"
full_description = "Noted Updates March 2023 - 200 Articles! 🎉 by Jeremy Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website • March 19, 2023 • 2 min read Comments Share Share on X Share on Facebook Share on LinkedIn Share on Pinterest Email Copy link News I feel rather ecstatic about updating you all on the recent happenings at Noted. It's with great pleasure that I can announce to you that we've achieved a monumental feat. We have over 200 articles on Noted! 🎉 Wow! I must say, it's been an incredible journey, and the warm reception from our readers has been such a motivator for us to keep pushing to provide more valuable content. And when I say us, I mean me mostly but there are some amazing people who contribute to Noted too!Our traffic and user engagement this year has been off the charts, and we have all of you to thank for that. You've made all the hard work worth it for us.While you might think most of our traffic comes from Reddit, actually, Google crosses the finish line by a nose! 👃In addition, the Noted Discord community has grown to 1200-plus members, and I couldn't be happier about the connections, camaraderie and idea sharing happening there. I am so excited about the growing interactions.I also have some new and exciting additions to Noted, which I hope you'll all love. I have started a new category named “Product Spotlight,” which delves into the review of distinctive new products related to the industry. I'd also like to introduce you to the “Linux Basics” category where I explain, in layman terms, some fundamental Linux related tools and commands you may find useful.But, wait, there's more! I would like to inform you that I have commenced a new interview series where I showcase the individual journeys of developers, get insights into their innovative projects and hear their unique perspectives on the industry. The first participant is someone who has developed a very popular app that most of you know well. I am thrilled about this new addition, and can’t wait to share the first interview coming soon!As always, I appreciate your readership and support. I am grateful for your participation in the weekly Self-Hosted Roundup posts on Reddit, which has become an essential aspect of the Noted community. I am continually striving to provide you with value driven content and look forward to sharing more updates on the progress with you. Thank you for being a part of Noted. Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website On this page Unlock full content Subscribe to Noted Subscribe Sending Sent Please check your inbox and click the confirmation link. Read Next 3 min read GoCron - A Self Hosted Go Based Task Scheduler with GUI Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 28, 2025 3 min read Dolibarr - Self Hosted HR and Customer Relationship Management Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb 25, 2025 3 min read HabitTrove - Self Hosted, Gamified Habit Tracker Jeremy Hello! I'm Jeremy, the creative force behind Noted. With a blend of self-taught expertise in homelab tech and professional experience with Docker, I'm eager to connect with fellow innovators. X Website Feb