["https://noti.st/melchoyce/8nPSqp/customizing-the-future"]
title = "Customizing the Future"
description = "Gutenberg is not the only ship charging into the great unknown — Customization is soon to follow. From the past year of customization work, to where we see Customization going in a post-Gutenberg world, I’ll map out the path we’re charting for the future. I’m sure you’ll want to come along for the ride."
full_description = "I’m also the current Customization design lead for WordPress. This past year, I worked a lot on 4.8, and co-lead the 4.9 release. Before that, I also worked on the WordPress.com Customizer, so I’ve been thinking about this topic for a while. Before I talk about exciting future possibilities, let’s start by looking back a bit on the history of the Customizer. The Customizer, then known as the Theme Customizer, was released in WordPress 3.4 “Green” in June of 2012. The new Theme Customizer duplicated some basic site settings like your title and tagline, along with your homepage settings. It also included theme options like header images, background colors, whatever else your theme supported. It brought these features into a live preview context, which was great, because previously you had to toggle back and forth between editing and previewing everything live on your site. For example, you wouldn’t know how your new header image would actually looked until you saved, which obviously isn’t ideal. With the Theme Customizer, you could finally preview those changes before pushing them live. In 3.9, widget management was added to the Customizer. This was pretty controversial, especially with the insinuation that it would eventually replace the wp-admin widget management screen. Here we are ten releases later with both interfaces still kickin’ around, so I guess that didn’t end up being an issue. I personally really love this feature because it helps streamline the process of building a site in one place, and in general I just find it faster to use. A couple versions later, menus were added to the Customizer as well. I love this interface way better than the wp-admin one which is sooo slow, so I was really stoked when it came out. At the end of last year, we added a couple new features. First of all, we launched new edit icons to the preview pane of the Customizer. This was a feature I’d worked on with my team at WordPress.com, and after it received some community interest, we proposed it as a core feature. It’s very much a bandaid solution for direct manipulation in the Customizer, but I think it’s been helpful."
year_published = 2018
