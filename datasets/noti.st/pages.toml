["https://noti.st/laurakalbag/Ot8Mx4/people-might-actually-use-this"]
title = "People might actually use this"
description = "Decentralisation is necessary to give people ownership and control of their own data, but it is not inherently ethical. Laura will discuss the importance of inclusive, accessible and ethical technology, and how we use these approaches to build decentralised technology that people might actually want to use."
full_description = "As I’ve only got 25 minutes to give this presentation, I am going to quickly run through my assertions. These are things I hold to be true, the reasons I am here today, and what we need to get past to build ethical decentralised technology. We often use technology more than we use public infrastructure. In the last twenty years, internet-connected technology has gone from having a supporting role in our work and communications to the foundation of our social and labour infrastructure. Surveillance capitalism, extracting and exploiting people’s personal information for financial gain, is the primary business model of mainstream technology. This is fuelled by venture capital which requires fast growth and reward, encouraging unethical business practices that harm marginalised people first. Including racism, homophobia, transphobia, ableism, misogyny. We build technology in our image, we write algorithms with our biases. And because the majority of people building technology are cis straight white non-disabled men, the needs of others are at best ignored, at worst, exploited. Because of the previous points, technology has a huge impact on society and democracy. Because technology has power, unethical business models, and exploits the vulnerable, it is having a detrimental effect on the world around us. These are systemic issues. I’m not blaming you for everything. Technology is an amplifier of our societal problems. That’s why we can’t pretend technology can fix issues with people. The best and most ethical technology in the world is not going to fix a broken planet or a toxic society. We can’t tell people to quit Facebook if there’s no better alternative to Facebook. We can’t tell people to make the effort unless there’s somewhere else to go. This is really hard. Because the tech industry is built upon venture capital and surveillance capitalism, going against the status quo is difficult. Funding is hard. Finding the tools is hard. Finding people to work on the projects is hard. Learning the best way to build things is hard."
year_published = 2019
