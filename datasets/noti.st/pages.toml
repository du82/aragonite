full_description = "Rachel Andrew works for Google as Content Lead for Chrome DevRel working on web.dev and the Chrome for Developers site. She is a front and back-end web developer, author and speaker, author or co-author of 22 books including The New CSS Layout and a regular contributor to a number of publications both on and offline. Rachel is a Member of the CSS Working Group, and can be found posting photos of her cats on Mastodon as @rachelandrew. Using grid layout to position items can sometimes result in a disconnected tab order, creating challenges for accessibility. While avoiding reordering has traditionally been the advice, this approach limits some of the powerful features of grid layout. A new solution is on the horizon! In this talk, I’ll introduce the reading-flow property and discuss the work being done by the CSS Working Group to address this issue."
