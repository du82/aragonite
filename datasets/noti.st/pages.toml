["https://noti.st/helen/0OHozl/whose-design-is-it-anyway"]
title = "Whose Design is it Anyway?"
description = """
As creators of products and services, we’re pretty good at thinking we’ve got it all sussed. We map user journeys, we create roadmaps, we write user stories. We know what we want people to do; what actions we want them to take. But do we really know who these people are? Do we really know what they need? Do we take the time to find out, or are we building products and services based on our own assumptions and biases?
And what about those who lack our digital privilege? Digital exclusion is a reality for many people. It’s our responsibility to look out for everyone, not just those who are the most visible or the easiest to design for. As designers, we have the power to massively hinder or improve lives; not those of ‘users’ but of people. This talk looks at what it means to be digitally excluded and how by adopting a practical user research-led attitude to design, we can create products that are not just appealing to us, but life-changing to those who use them."""
full_description = "A great metaphor for people not using design in the way it was intended I want to question our assumptions as digital designers in 2019 The aim of this talk is to think about the real people we’re designing for. Not who we imagine them to be. I’ve spent time, in previous workplaces, as a UX designer without access to users. It was hard. I used the tools available to me, I planned user journeys As a designer, I became the representative ‘user’ I would tell clients “you are not your user” but in reality, neither was I I knew that I didn’t know and this started causing me to feel discontented and frustrated in my work. I joined SPARCK and switched my focus from design to research And I came to realise that in this industry it’s so easy to get trapped in filter bubbles So often we build things on biases, assumptions, untested business models, wishful thinking…? Especially within agile processes, we move so quickly, that sometimes we just need to build and ship something. But when we do this are we… Putting the cart before the horse If we’re building without understanding who is going to use it, we are in danger of not only building something, like the slide, that doesn’t work as intended for users but actively excludes them This is from the Microsoft Inclusive Design manual, which I’ll come back to it a bit Here’s a question: How can we lower these barriers if we’re acting as the people using the product? We can make best guesses and stick with well-known design conventions But what we really need to do is break out of our bubbles and speak to real people. With that in mind, I want you to meet… Keith - not his real name or photo - we keep participants anonymous - he’s 61 What stood out: self-critical about his tech abilities He’s managed to ‘get to grips’ with online banking He has an iPhone but uses it just for basic texts and a few emails Even though he knows he can do things on his phone, if he has to do too much on it, he uses a laptop at home where his girlfriend and daughter can ‘guide him if he goes wrong.’"
year_published = 2019
clearnet = "https://noti.st/helen/0OHozl/whose-design-is-it-anyway"
