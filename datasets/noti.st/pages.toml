["https://noti.st/sdras/QapmoT/composable-animation"]
title = "Composable Animation"
description = '''Design Systems have changed the way that developers and designers collaborate on fonts, colors, UI structure, forms and the like. So why does it feel like animation in a design system always falls short? The animation section usually lays dormant aside from a "fade", or we craft one-offs for a perfect experience, but each perfect experience becomes less perfect because they don't share the same language. In this talk, we'll break down exactly how to build animations so that they're composable, extendable, and can be used for a multitude of purchases, and still maintain cohesion. We'll talk about how animation in specific requires teams to work together because it's an intersection of design and development: it's harder to throw over a wall. We'll break down exactly how to make it all fit together, for the most seamless collaboration between you and your team.'''
full_description = '''A presentation at Clarity in December 2018 in 5000 Estate Enighed, Independence, KS 67301, USA by Sarah Drasner “It’s important to define your audience for your documentation early.” Val head, designing interface animation Timing Like h1, h2 //---timing ----// $class-slug: t !default; @for $i from 1 through 7 { .#{$class-slug}-#{$i} { animation-duration: 0.8 - (0.1s * $i); } } @sarah_edo Easing Branded //---ease ----// $easein-quad: cubic-bezier(0.55, 0.085, 0.68, 0.53); $easeout-quad: cubic-bezier(0.25, 0.46, 0.45, 0.94); $easein-back: cubic-bezier(.57, .07, .6, 1.71); $easeout-back: cubic-bezier(0.175, 0.885, 0.32, 1.275); .entrance { animation-timing-function: $easeout-quad; } @sarah_edo Animations Only what you need //animations @keyframes pop { 0% { transform: scale(0.9) translateZ(0); } 100% { transform: scale(1) translateZ(0); } } .pop { animation-name: pop; @extend .anim-fill-both; } @sarah_edo <TransitionGroup> { this.state.shouldShowSoundwaves && <Soundwaves outTime={0.5} drawTiming={5} elTime={1} easing=‘Circ’ /> } </TransitionGroup> @sarah_edo Vue Single File Components <template> <div> </div> </template> <script> export default { } </script> <style scoped> </style> @sarah_edo Import Global Sass Files for Overarching Principles module.exports = { css: { loaderOptions: { sass: { data: @import "@/scss/_variables.scss"; } } } } css-tricks.com/how-to-import-a-sass-file-into-every-vue-component-in-an-app/ @sarah_edo <template> <svg @click="makeHeart" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 120 120" aria-labelledby="heartface" role="presentation"> ... </svg> </template> <script> import { TweenMax, TimelineMax, Sine } from ‘gsap' export default { methods: { makeHeart() { const tl = new TimelineMax() tl.add('start') ... } } } </script> github.com/sdras/vue-sample-svg-icons @sarah_edo Responsive interactions Desktop and mobile compatible Zingtouch Hammer Draggable Flickity onMouseOver || onTouchStart @sarah_edo Responsive consistency • SVG is great for responsive • Eases should stay the same, but timing can be adjusted • initial-scale=1.0 in the meta tag or device will wait 300ms • Larger touch-target, > 40px x 40px or use @media(pointer:coarse) 24ways.org/2016/animation-in-design-systems/ @sarah_edo'''
