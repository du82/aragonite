["https://noti.st/laurakalbag/ESaCQp/sabotaging-our-future-selves"]
title = "Sabotaging Our Future Selves"
description = "Who do we really help with accessible technology and why do any of us bother at all? This talk will explore the motivations for our work, and where inclusive design fits in our processes, approaches, outlooks, and lives."
full_description = "It’s called Accessibility For Everyone, published by A Book Apart. I actually took about three years to write that book about accessibility. Still, over three years, accessibility still didn’t become a wide concern in our industry. Visual impairments are wide-ranging. They could mean you are nearsighted, farsighted, have astigmatism, are colour blind, have eyesight loss, or are blind. Predominantly when we talk about how auditory impairments may affect our use of the web, we are talking about hearing loss or being deaf. Motor impairments could range from difficulty with fine motor control, low stamina for repetitive tasks or pain while moving, among many other combinations of difficulties using the web. Motion sensitivity is often forgotten or ignored, but for people with vestibular disorders, or prone to seizures, motion can be very harmful. Cognitive impairments are a huge spectrum which includes impairments such as memory, attention, problem-solving, visual processing, maths processing, text processing, learning disabilities and low literacy. And neurodiversity is often forgotten. Neurodiversity means a person who processes the world differently, and so may struggle with interfaces created by neurotypical people. Accessibility is like adding an ugly ramp as an afterthought to the back of your newly-built shop building. Inclusive design is like building your shop building with a ramp and stairs from the very beginning, trying to accommodate as many needs as possible. It’s remembering to add railings for people who need support, and bright lines on the steps so people who find it difficult to see them can use the steps safely. Making your small font size adjustable with special buttons might be how you make it more accessible for people who can’t read small text. (This could be older people, people with eyesight loss, people who have a small screen, or people who are sitting far from their displays.) Inclusive design is making the font bigger for everyone to begin with, not expecting people to have to find a hidden button in order to make the text readable."
year_published = 2018
clearnet = "https://noti.st/laurakalbag/ESaCQp/sabotaging-our-future-selves"
