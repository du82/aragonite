full_description = "This Privacy Policy explains what happens to any personal data that you provide to us, or that we collect from you whilst you visit our site. We do update this Policy from time to time, therefore the policy will always display the last updated date. Our Data Controller is Drew McLellan, Managing Director. You can contact us via the email address support@noti.st. The majority of the information we collect and store, is the publicly accessible information you upload in order to create your profile and presentation page. In addition we need a small amount of information to be able to create an account, and to charge you for a pro account while complying with tax laws. We aim to keep the information that we request and store to a minimum. Notist is a product from the company Under Engineering Ltd. We are physically located in the United Kingdom. Our servers and therefore the application databases are hosted in Germany in the European Union by the hosting company Hetzner. Publicly shared assets such as images as PDF files are hosted with Microsoft Azure and distributed globally via a Content Delivery Network (CDN). In order to run our service we use various third party services. In the interest of transparency below is a table detailing all of the third party services we use, their location, the data that is shared or stored with them. Cookies provide information regarding the computer used by a visitor. Where used, these cookies are downloaded to your computer and stored on the computer’s hard drive. Such information will not identify site visitors personally. It is statistical data. When you log into your account on the Notist website, a session cookie will be used to maintain state, keeping you logged into our site. We use the information that we collect from you to provide our services to you. In addition to this we may use the information for one or more of the following purposes: To provide information to you relating to other products that may 