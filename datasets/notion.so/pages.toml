["https://notion.so/product/ai"]
title = "Meet the new Notion AI"
description = "Add to your workspace for $8 / member / month billed annually or $10 / member / month billed monthly."
full_description = '''How do I activate Notion AI?Notion AI is available to all users. You can prompt AI using your space bar, highlighting text and selecting "Ask AI", clicking the Notion AI button at the bottom right of your app or in your sidebar, adding an autofill property to a database, or via slash commands. You must take action for AI to activate.It will not generate content unless you perform one of the actions above.How is Notion AI different from other AI tools?It’s overwhelming (and expensive!) to use so many different apps to get your work done. Now there are AI search tools, writing assistants, and chatbots adding to your pile of browser tabs. So we designed Notion AI to be an all-in-one AI tool for you.Notion AI can search your workspace and other apps, generate content in your own style, analyze PDFs and images, and chat with you about anything—all seamlessly integrated throughout your workspace.It’s connected to multiple knowledge sources: Notion, Slack, Google Docs, Slides & Sheets, and AI knowledge from cutting-edge language models like GPT-4 and Claude.It's easier to use than other AI tools, with no "prompting" required. Translate a doc to another language, generate a summary, or explain technical jargon in a single click—no need to copy paste between your work and a separate AI tool.AI is changing fast, and we’ll keep making Notion AI more knowledgeable and capable so you have a state-of-the-art AI tool. We always test and tweak to ensure the highest quality—so feedback is always welcome.How does Notion AI use my data?We follow our standard data protection practices to keep your data encrypted and private. Notion AI will not use your data to train our models unless you opt in to a request to share your data.Any information used to power Notion AI will be shared with AI subprocessors for the sole purpose of providing you with the Notion AI features. We specifically have contractual agreements in place with our AI subprocessors that prohibit the use of customer data to train their models. Learn more about Notion AI security and privacy practices here.How much usage is included with the Notion AI add-on plan?When you purchase the Notion AI add-on, you’re enabling everyone in your workspace (except for guests) to have unlimited use of Notion AI.To ensure optimal performance and fair usage across all Notion AI users, your access to AI features can be reduced depending on your usage.Is there a free trial for Notion AI?Everyone can try Notion AI for free, so you can test most of its capabilities before purchasing the add-on subscription. Please note that some features are not available in the free trial, including AI connectors BETA, autofilling a database in bulk, and auto-updating of autofilled database properties.The number of complimentary AI responses is shared among the entire workspace. Once you've used all your complimentary AI responses, you will see a message that a Notion AI add-on subscription is necessary to continue using AI features. You’ll need to be a workspace owner, and on desktop, to add Notion AI to your plan.'''
