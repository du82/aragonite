["https://notion.so/affiliates"]
title = "Join the Notion Affiliate Program"
description = "Make money by referring people to Notion. Earn 50% commission from the first year subscription fees for successful new Plus or Business upgrades that sign-up through your affiliate link. Now also rewarding upgrades to Notion AI! There’s no limits to what you can earn."
full_description = "Refer Notion to your friends and followers, and earn up to $50 per activated sign up plus 20% of year one revenue for each referral you drive. No limits to how much you can earn.🌐 Program now global and improved! Share your unique affiliate link through your channels. You’ll have access to our Affiliates Resource Center with promotional best practices, guides, videos, and more. Earn commissions up to $50 per activated sign up plus 20% of year one revenue for each referral you drive.It’s easy to generate multiple links and track your rewards through PartnerStack What is the Notion Affiliate Program and how can I apply?The affiliate program is a way for bloggers, writers, community owners, entrepreneurs, influencers, Notion creators, and others to spread the word about Notion and earn financial rewards.Apply with this link! We review affiliate applicants on a weekly basis. We ask for some information about you, your content links and your audience to evaluate and approve you.What qualifies as a successful conversion?Net new workspaces that upgrade to a paid Plus or Business plan within 180 days of clicking your affiliate link will be eligible for the affiliate commission. Commissions are paid on a last-click basis, so your link must be the last touch point before the user signed up.How can I create, track, and promote my affiliate link?You can create multiple links and see your stats in your dashboard by signing in to PartnerStack.Once you receive your personalized affiliate link, we recommend that you promote it on your blog, social profile, website, videos, etc (the more places the better).When you post or distribute content about Notion, your message must make it obvious that you have a financially compensated relationship with Notion. We need all promotions to be FTC compliant. A helpful guide can be found here.What if a user adds additional seats to their workspace after their first invoice?If additional seats are being bought, we will consider it an additional transaction. As long as the customer signed up within a year, a reward will be generate for each new transaction.What if a user downgrades?If a user downgrades from a paying monthly plan to a free plan or receives a refund within the first 2 months of the subscription we may claw back the reward or deduct the amount from future commissions.Can I refer myself?Self-referrals are not allowed. The spirit of the program is to reward you for referring other people. This is not a way to get a discount on your own account.What terms apply to the Notion Affiliate Program?The Notion Marketing Program Participant Terms apply to your participation in the Affiliate Marketing Program along with this Program Resource Guide and any Program Policies that we may make available to you from time to time.Have more questions?If you have more questions, you can reach out to us at [email protected]"
