["https://notion.so/startups"]
title = "Notion – Notion for Startups"
description = "Welcome to First Block, a Notion series where founders and executives from the world's leading companies tell us about the many “firsts” of their startup journeys. Hosted by our Co-founder and COO Akshay Kothari, this series explores the many ups and downs that founders face as they build their companies, and what they've learned along the way."
full_description = "Who is eligible?You must be a non-paying Notion customer, with less than 50 employees and under $10M in funding from an accredited investor. See full terms and conditions.Why is Notion offering a discount for startups?We've seen thousands of startups use Notion to get going on the right foot — as a wiki, for project management, document sharing, notes, and more. We want to help more companies lay a strong foundation that can grow with them from the beginning.How do I apply to receive the discount?Fill out this application!What is the offer worth?Notion’s Plus Plan costs $12 per member per month paid monthly. Notion’s AI add-on costs $10 per member per month paid monthly. The startup offer is equivalent to a maximum of $6,600 for 50 employees.How do I suggest a partner that Notion should work with?Don’t see your investors on our list? There are a few things you can do:Send them a note encouraging them to join the program.Tweet at them and @NotionHQ with the hashtag #NotionForStartups and we’ll pick up the conversation! You can also email us at [email protected].Fill out this application and make your suggestion on our form.I want this discount to be available to my portfolio companies. How can I become a partner?We want to hear from you! Apply to be a partner and we’ll get back to you with more information. We’re especially interested in finding partners outside of major tech hubs. Still have more questions? Message support You must be a non-paying Notion customer, with less than 50 employees and under $10M in funding from an accredited investor. See full terms and conditions. We've seen thousands of startups use Notion to get going on the right foot — as a wiki, for project management, document sharing, notes, and more. We want to help more companies lay a strong foundation that can grow with them from the beginning. Notion’s Plus Plan costs $12 per member per month paid monthly. Notion’s AI add-on costs $10 per member per month paid monthly. The startup offer is equivalent to a maximum of $6,600 for 50 employees."
