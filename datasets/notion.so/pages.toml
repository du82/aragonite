title = "Tools & Craft – Notion Blog"
description = "Visit the Notion blog to learn more about our thoughts on the future of work."
full_description = "InspirationA Notion Love StoryConnie and Kyle were two singles looking for love in San Francisco. One thing connected them: both used Notion to create “date-me docs”—profile pages that they could circulate to find love outside of the swiping turnstile of dating apps. After a chance encounter at a hackathon, they exchanged docs (one of which was famous). The rest is history.Notion HQ InspirationHow I launched a viral marketing campaign using NotionFrom mastering Notion to driving a viral creative campaign that became a company milestone, here’s how Funmi Ajike made B2B SaaS marketing anything but boring.Funmi AjikeContent Strategist & Producer, Air TechHow we built custom emojiOur challenge: load millions of personalized, sometimes animated emojis into a workspace without breaking everything. As we strive to make Notion the happiest workspace on earth, it was a technical puzzle worth solving. Henry Chiu InspirationHow leading AI companies are using AI toolsAI is quietly reshaping how teams get work done, but not all companies are putting it to use. A few have figured out the secret to implementing AI effectively—we asked them how.Drew EvansMarketing For TeamsHow ecosio replaced 20 different tools with Notion in just 8 weeksBy centralizing company knowledge and leveraging Notion AI, ecosio has achieved unprecedented levels of productivity. Notion HQMaking the Brand at Make with NotionWhen we decided to host a conference for our users, we kept coming back to one guiding question: What would it feel like to spend a day with Notion?Huy Vu Notion HQThe Magic of In-Person FeedbackAt Make with Notion, we took full advantage of the opportunity to meet our users in person. All comers were asked one question: “What should we build in 2025?”Makenna Bigelow and Sanya Attari For Teams5 must-have templates for your teamNew year, new projects, same chaotic feeling figuring out how you’re going to get organized for the year. My secret weapon? Templates.Drew EvansMarketing"
