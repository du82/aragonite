["https://notion.so/personal"]
title = "Your connected workspace for notes, docs & tasks | Notion"
description = "Get started with Notion for personal use for $0, forever. Write, plan, and organize - all in one place."
full_description = "What if I'm already paying for the old Personal Plan?You've been automatically upgraded to our new Personal Pro Plan at no extra cost! In addition to all the features of the free Personal Plan, Personal Pro includes:No limit on file uploads (5MB is the limit for free)Unlimited guest collaborators (5 guests is the limit for free)Version history up to 30 daysPriority customer supportYou can switch back to the free Personal Plan at any time.What happens to all the guests I added on the old Free Plan?You can still add up to 5 guests to collaborate on any page in your workspace. If you've already added more than 5 guests, they will still be there. But to add more over the 5-guest limit, you’ll need to upgrade to the Personal Pro Plan.That said, our new public editing feature makes it possible to allow any other Notion users with the page's link to add edits or comments.What if I had multiple members in my Free Plan workspace?No worries, you don’t have to remove anyone! There is a block limit when your Free Plan has multiple members. If you hit a limit you can:Upgrade to our Plus Plan.Start a new workspace for just yourself and use it for free, indefinitely.Remove members, and enjoy no content limits on your own.Note: Make sure members in your workspace have their private pages backed up before you remove them!How can my team try out Notion for free?We want to make it easy for you to take Notion for a spin with multiple members before you start paying. Here's how to do that:Create a new Notion workspace, and select Team as the type when asked.You'll be enrolled in a Team Plan free trial that gives you access to Team Plan features with trial limits on block content, guests and version history. When you hit those limits, you can upgrade.Still have more questions? Learn more in our help center. You've been automatically upgraded to our new Personal Pro Plan at no extra cost! In addition to all the features of the free Personal Plan, Personal Pro includes:No limit on file uploads (5MB is the limit for free)Unlimited guest collaborators (5 guests is the limit for free)Version history up to 30 daysPriority customer supportYou can switch back to the free Personal Plan at any time."
