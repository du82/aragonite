["https://notion.so/product/notion-for-education"]
title = "Notion for Students"
description = "Your teaching assistant, code reviewer and writing editor—right where you work. Notion AI combines world knowledge from models like GPT-4 with your notes and content stored in Notion to give you personalized responses."
full_description = "Are there any discounts for students?The Education Plus Plan for individual students is a free Plus Plan for a one-member workspace. It’s available for students signed in with their education institution's email per the WHED. You may also be eligible for 50% off Notion AI if you’re on this plan. Offer terms and conditions apply.With the Plus plan, students can organize plans, tasks and notes across school and life with unlimited pages & blocks, file uploads, more features to customize and publish your site, and 30-day version history.Just sign in with your school email address, by scrolling down the Billing in-product page and selecting Get free Education plan.Learn more about our student offers here: https://www.notion.so/help/notion-for-educationHow do I sign up for the free Education plan? You’re eligible for the free Plus plan if:You’re a student or educator at an accredited college or university.You have a school email address. We don’t accept student IDs or other documentation to verify at this time.You’re not eligible if:You’re a K-12 student or K-12 educator. But you can still use our Free Plan with unlimited storage for free! Learn more on our pricing page.Your Notion account is associated with a personal email address, such as a gmail.com or email address.Eligible users can sign up for the plan by following these steps:Go to Settings in your sidebar.Select Upgrade plan.Select Get free education plan. If your school is recognized by our system, you’ll be upgraded automatically!If you satisfy all requirements above for access to the plan but don't see Get free education plan, please write into [email protected] to request your school domain get access. If your institution is recognized by and listed in the WHED, your domain will be allowlisted and receive access.What's Notion's student organization plan? Yes! Student-led organizations at select verified higher education institutions around the globe can get access to our Plus plan and add all of their org members to collaborate entirely for free.With the Plus Plan, student orgs can upload unlimited blocks and files, add members to their workspace, get 30-day page history, add up to 100 guests, and more — free of charge.Sign your org up for the free offer here. Note: This discount is only eligible for workspaces for volunteer student organizations. Workspaces that are not designated for student organizations with will not qualify for the discount.What happens when I graduate or leave my educational institution?You can continue using your free Plus plan for education as long as it continues to be associated with your educational email address. We hope you’ll stick with us 🤞I’m a student who loves Notion. How can I get more involved?Amazing! Thanks for being part of our community. The Notion Campus Leaders Program enables students around the world to share and teach Notion at their universities, while building strong Notion communities on campus. We encourage you to attend an upcoming CL event on your campus — or, if you’re feeling extra passionate, you can apply to become a Campus Leader yourself!"
