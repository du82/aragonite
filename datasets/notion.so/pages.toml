es a devilishly complex problem seem simple.”Steve HuffmanCo-founder & CEO, Reddit“I think of Notion as the bones of our company knowledge. Google Docs doesn't provide that because it's not as easy to navigate all of the different things you have going on. Now it's our absolute source of knowledge and project management.”Siqi ChenCEO, Sandbox VR“We're a distributed team so we can't do many meetings. Notion gives us all the same information so we can keep moving.”Marie SchneegansCEO, Workwell“You can tell the huge amount of effort that went into keeping Notion so simple. They understand that you can solve a lot of problems with one tool.”Guillermo RauchCEO, Vercel“We use Notion across Sales, Marketing, Product, and Engineering. You can replace Google, Trello, Dropbox Paper, Guru, and Confluence all in one tool.”Guy MarionCEO, BrightbackWeb appShareSign upDesktop appSearchUpdatesSettings & MembersNew pageTemplatesImportTrashNew pageShare Mac WindowsApple App StoreGoogle App StoreUsing Notion at work? Request a demo4:19 Download from App Store"
