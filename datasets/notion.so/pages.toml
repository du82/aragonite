["https://notion.so/security"]
title = "Notion Security & Compliance | SOC 2 Certified, trusted by Enterprises"
description = "Learn how Notion protects your data with enterprise-grade security, SOC 2 compliance, ISO compliance, and comprehensive trust features. Discover our commitment to security, privacy, and compliance standards that keep your workspace safe."
full_description = "Notion takes a security-by-design approach to protecting your data. Our team continues to make investments so you can use Notion with confidence.Our security practices → Notion’s infrastructure is designed with layers of protection to help ensure your data is secure while transmitted, stored, or processed. Protections include but are not limited to encryption, least privilege access, secure software development, and a public bug bounty program. Our information security team continuously implements new security controls and monitors Notion for malicious activity across our infrastructure, networks, and assets. Notion provides a robust set of in product data protection and admin controls for greater visibility and control over our data. Enterprise admins can deploy Notion to their organizations with SSO via SAML 2.0, provision users through SCIM, and track activity with the audit log features. Enterprise admins can also fine tune permission controls and guests, and manage team organizations. Notion maintains a comprehensive privacy compliance program and is committed to partnering with its customers and vendors on privacy compliance efforts. This page highlights some of the key aspects of our program. At Notion our team is dedicated to developing and implementing data privacy processes and safeguards that meet industry standards and best practices. We conduct ongoing training for our teams to ensure that they are up to speed with developments in legislation and essential privacy and security practices. Every Notion employee and contractor signs up to non-disclosure terms to maintain the confidentiality and security of your data. Notion also holds any vendors that handle personal data to the same data management, security, and privacy practices and standards to which we hold ourselves. At Notion we strive to keep all of our agreements up to date with the latest regulations and industry standards. Our Master Subscription Agreement and Data Processing Addendum describe in detail Notion’s data privacy processes, standards, safeguards and our compliance with data protection legislation. To ensure that our terms track with the GDPR, CCPA and other global privacy standards we continually have our terms assessed by leading privacy experts in multiple jurisdictions."
