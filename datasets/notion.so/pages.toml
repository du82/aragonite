["https://notion.so/pricing"]
title = "Notion Pricing Plans: Free, Plus, Business, Enterprise, & AI."
description = "Learn more about our different pricing plans. We support everyone, from free personal accounts to enterprise businesses."
full_description = '''Notion AINow with AI connectorsAdd to your workspace for $8 per member/month, billed annually.$10 per member/month billed monthly.Get startedRead AI FAQConnect apps like Slack & Google Drive BetaLimit the AI’s search to your trusted sourcesGenerate and edit text in any docAutofill databases with summaries & insightsChat about anything using GPT-4 & ClaudeGet startedRead AI FAQ How much usage is included with the Notion AI add-on plan?When you purchase the Notion AI add-on, you’re enabling everyone in your workspace (except for guests) to have unlimited use of Notion AI.To ensure optimal performance and fair usage across all Notion AI users, your access to AI features can be reduced depending on your usage.Is there a free trial for Notion AI?Everyone can try Notion AI for free, so you can test most of its capabilities before purchasing the add-on subscription. Please note that some features are not available in the free trial, including AI connectors BETA, autofilling a database in bulk, and auto-updating of autofilled database properties.The number of complimentary AI responses is shared among the entire workspace. Once you've used all your complimentary AI responses, you will see a message that a Notion AI add-on subscription is necessary to continue using AI features. You’ll need to be a workspace owner, and on desktop, to add Notion AI to your plan.How does Notion AI use my data?We follow our standard data protection practices to keep your data encrypted and private. Notion AI will not use your data to train our models unless you opt in to a request to share your data.Any information used to power Notion AI will be shared with AI subprocessors for the sole purpose of providing you with the Notion AI features. We specifically have contractual agreements in place with our AI subprocessors that prohibit the use of customer data to train their models. Learn more about Notion AI security and privacy practices here.Can I purchase Notion AI for only part of my team, without purchasing for the entire workspace?Notion AI can only be purchased for the entire workspace. Currently, there isn’t an option to provision AI access to only a portion of your workspace.If you do decide to add AI to your workspace, every member in the workspace will be able to use AI features — this includes workspace owners, membership admins, and members. Guests will not be able to use AI features in your workspace.How do I get charged when I add members to my workspace?When you add a new member to your workspace, they will use an existing paid seat if you have any available in your workspace. If you do not have any existing available paid seats, your count of paid seats will increase by 1. Changes in membership that occur mid-month will create prorated charges based on the amount of time remaining in the billing cycle when the paid seat was added.For every member you delete from your workspace, you will open up 1 available paid seat. This means you have the option to exchange members in your workspace without paying any additional costs, as long as your total billable seat count remains the same.You’ll receive an invoice for any charges accrued by changes in membership on your selected payment method, on the day of the month you initially signed up for your subscription.Each time your billing period starts (monthly or annual), your count of paid seats will be synchronized so it exactly matches the amount of members present in your workspace.Where can I find my invoices?Workspace admins can access, view, and download your workspace's invoices by going to Settings & members → Billing, then scrolling to Invoices. There you can click on "View invoice" to see the invoice PDF.What are your accepted payment methods?We currently accept all major credit and debit card brands.What happens when I go over the block storage limit on a Free Plan?If you’re using a Free Plan workspace by yourself, you’ll be able to add as many pages and blocks as you like.If you’re using a Free Plan workspace with multiple members, you’ll be able to add a limited number of blocks before you have to upgrade. When you reach the limit, you can still read, edit, and organize existing content blocks as usual, but you won’t be able to add new content blocks.What is a block?A block is any single piece of content you add to your page, like a paragraph of text, a to-do item, an image, a code block, an embedded file, etc. Think of your page as being made up of these building blocks. Learn more about blocks here →Do you offer student discounts?The Plus Plan (with a 1-member limit) is free for students and educators. Compared to the Free Plan, you’ll be able to add more guests, have access to more version history, and upload larger files.Just sign up with your school email address and you’ll immediately gain access to these features. Thousands of school email domains are eligible, not just .edu!For more info & FAQs, visit the Notion for Education page.How is pricing calculated for the paid plans?If you upgrade your workspace to one of the paid plans, you will be charged a fee per member.Guests are free of charge – but they can only access individual pages they are invited to. In other words, guests won’t be able to see all the team pages under the Teamspaces section in the left sidebar.What do the different analytics tiers mean?Basic page analytics (Free and Plus Plans): Includes a list of page viewers as well as a chart displaying views over time.Advanced page analytics (Business Plan): Includes everything above as well as a list of page editors.Workspace analytics (Enterprise Plan): Includes everything above as well as user level analytics, analytics on all pages in your workspace, and search analytics for content in your workspace.How does adding and removing members work?Whether you're on a monthly or yearly billing schedule, your account may be charged on a monthly basis if you make changes in membership. If you added members, your account will be charged a prorated amount based on the percentage of the billing cycle left when a user was added. If you removed members, you will not receive credit but instead will still have use of that seat for a different user for the remainder of the billing period.What happens when I change plans?Upgrading your plan: Your account will be upgraded and charged immediately. The amount due will be reduced based on the percentage of the billing cycle left at the time the plan was changed.Downgrading your plan: Your account will be downgraded at the end of your billing cycle. Learn about how your features may be impacted after a downgrade here →How do I cancel my paid plan?Your Notion subscription, annual or monthly, will automatically renew until you cancel it. You can cancel your subscription by going to Settings in the left-hand sidebar on a desktop computer, then selecting Billing, then Change plan. After you cancel, you’ll still have access to all the paid features until the end of your billing cycle.Learn more about billing in this article.What happens if my payment fails? Like if my credit card expires?Your account email will be notified after each failed payment. Payments may be retried up to 8 times within the next month. After this, if the payment did not succeed, your workspace will get restricted to limited-access for a period of time before being downgraded to the Free plan.Can I change my payment method?You can change your payment method at any time in your billing settings.How do refunds work?Our refund policy is simple. If you believe you've made a mistake signing up for a paid Notion subscription online or in-app, please contact us inside the app or email [email protected]. We'll be happy to refund you the full amount (not pro-rated) if you downgrade your subscription within three days of signing up for monthly billing, or within 30 days of signing up for annual billing.If you have accidentally added members to your workspace, you can remove those members at any time. If you’ve been charged for members who were accidentally added, we're happy to provide a refund of the prorated charges if you reach out within three days of the invoice date (please make sure the additional members have been removed from your workspace when writing in).And if for any reason you're unhappy with Notion, please let us know at [email protected] — we'd love to hear your feedback, and will be happy to work with you to create the best experience possible.What if I live in a region with a mandatory refund policy?If you live in the European Union, United Kingdom, or another region with a mandatory refund policy, you may be eligible for a monthly subscription refund past 72 hours. For example, customers in the European Union can receive a full refund for a monthly subscription within 14 days of purchase, rather than 72 hours.To request a refund, please contact us inside the app or email [email protected]. If you live in a region with a mandatory refund policy, please let us know and we'll be happy to assist you.Still have more questions? Learn more in our help center.'''
year_published = 2025
