title = "Hypermobility shop"
description = "Hypermobility Shop Reach out to our team for more information or to explore our range of hypermobility products Strapping Tapes Our range of strapping tapes includes options that we have found to be less reactive on hypermobile skin, reducing the risk of irritation. Archies Orthopaedic Thongs Archies are supportive flip-flops designed to provide arch support […]"
full_description = '''Hypermobility Shop Reach out to our team for more information or to explore our range of hypermobility products Strapping Tapes Our range of strapping tapes includes options that we have found to be less reactive on hypermobile skin, reducing the risk of irritation. Archies Orthopaedic Thongs Archies are supportive flip-flops designed to provide arch support and comfort. They are perfect for individuals with flat feet or those who require additional support while walking. Self-Massage Equipment We stock a variety of tools to target trigger points & relieve muscle tension (Dr Graeme massager, suction massage cups, trigger balls etc.) Pillows & Cushions Whether you need neck support during sleep or lumbar support while sitting, our ergonomically designed pillows and cushions can help you maintain proper posture and reduce discomfort. More Info Body Braid & Arm Braid The Body Braid and Arm Braid systems provide dynamic support to enhance proprioception and improve postural stability. Braces Our selection of braces provides support and stability to hypermobile joints, helping to reduce pain and prevent injuries. Smart Crutches Smart crutches provide enhanced support and comfort for those with mobility challenges. They are designed to reduce strain on the wrists and forearms, offering a more ergonomic and comfortable option for daily use. Hot & Cold Therapy We offer a range of hot and cold therapy products to manage pain and inflammation. From heat packs & cold compresses to cooling cushions & back support, these products are essential for soothing sore muscles and joints, or for managing any injuries. More Info Compex Muscle Stimulators Compex muscle stimulators are aneffective tool for strengthening andrehabilitating muscles and canbe tailored to suit your specificneeds and goals. The Compexdevices are available for hire andpurchase. Exercise Equipment From weights, resistance bands, to balance balls and spinny discs, we offer a range of exercise equipment to help you achieve your fitness goals safely and effectively. Oval 8 Splints & Silver Ring-Splints Ring-splints provide support and stability to hypermobile fingers and joints, reducing pain and improving function. Our range of ring-splints is designed to fit comfortably and discreetly, allowing you to go about your daily activities with ease. Stickman Communications Say it simply with Stickman: fun, clear, and creative communication tools to support accessible communication for those with disabilities. More Info Mg12 Magnesium Products Magnesium is an essential mineral for maintaining muscle health. We stock Australian-made & owned Mg12 magnesium products which is reported by clients to make their skin much less itchy than other magnesium products. MoveActive Grip Socks Our MoveActive grip socks provide non-slip support, making them ideal for activities such as yoga, Pilates, or daily wear around the house. Grip socks (or bare feet) are now compulsory for our exercise classes as they enhance stability and reduce the risk of falls. Sodii (Electrolytes) Maintaining proper hydration is essential for individuals with hypermobility, especially during physical activity. Sodii electrolytes are a convenient way to replenish electrolytes lost through sweat and ensure optimal hydration levels. Flamingo Feet Flamingo Feet is a unique foot support device designed to improve foot alignment and stability. Ideal for individuals with hypermobility-related foot issues, Flamingo Feet provides support where you need it most, allowing you to move with confidence and comfort. Adorable Zebra Merchandise From clothing and accessories to stationery and gifts, our zebra merchandise is a fun and fashionable way to raise awareness and show solidarity with the hypermobility community. How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + "</a>"; }); Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Public (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[13]='TOPICS';ftypes[13]='text';fnames[3]='LBIRTHDAY';ftypes[3]='date';fnames[4]='SBIRTHDAY';ftypes[4]='birthday';fnames[5]='LAPPTDATE';ftypes[5]='date';fnames[6]='LASTCASE';ftypes[6]='text';fnames[7]='LASTPRAC';ftypes[7]='text';fnames[8]='LASTAPPTNA';ftypes[8]='text';}(jQuery));var $mcj = jQuery.noConflict(true);'''
