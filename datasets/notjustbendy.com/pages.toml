title = "Sport Hypermobility"
description = "Engaging in recreational sports and physical activities is an integral part of a healthy lifestyle for people of all ages. However, individuals with hypermobility may face unique challenges and considerations when participating in sports. At Not Just Bendy, we cater our services to recreational sports enthusiasts with hypermobility, offering tailored Physiotherapy and Exercise Physiology solutions […]"
full_description = '''Recreational Sports and Hypermobility Engaging in recreational sports and physical activities is an integral part of a healthy lifestyle for people of all ages. However, individuals with hypermobility may face unique challenges and considerations when participating in sports. At Not Just Bendy, we cater our services to recreational sports enthusiasts with hypermobility, offering tailored Physiotherapy and Exercise Physiology solutions to support their active lifestyle. Sports Where People With Hypermobility Often Excel People with hypermobility often excel in sports that require exceptional flexibility and agility, such as gymnastics, dance, aerial, acro, yoga, swimming, and para-sports. Their natural joint mobility enables them to perform complex movements with grace and fluidity, giving them a distinct advantage in these activities. While these athletes often thrive in such activities, it’s important to manage their joint health carefully to prevent injuries. A customised physiotherapy plan can help recreational athletes with hypermobility enhance their performance while protecting their joints and muscles. Benefits Of An Appropriate & Safe Exercise Program: The maintenance of movement, strength and fitness is the best way to prevent deconditioning and potential worsening of existing symptoms associated with hypermobility. An appropriate and safe exercise program can reap benefits for an individual with hypermobility in the following ways: Improved proprioception Increased muscle bulk Release of endorphins can modulate pain Exercise relieves stress At Not Just Bendy, we understand how important it is to keep you exercising in your chosen sport. We may suggest modifications to your training schedule but will only ask you to not attend your sport due to acute injury or with an extreme medical need. Understanding The Challenges: Recreational sports and physical activities often involve dynamic movements, high impact forces, and repetitive motions, which can exacerbate symptoms associated with hypermobility. Additionally, individuals with hypermobility may be more prone to injuries, such as sprains, strains, and dislocations, due to the increased flexibility and laxity of their joints. How We Can Help: Our experienced Physiotherapists and Exercise Physiologists can work closely with recreational sports enthusiasts to address the specific challenges posed by hypermobility and optimise their performance and safety. We offer a range of services tailored to meet the unique needs of each individual, including: Pre-Participation Screening: We conduct thorough assessments to identify any underlying joint hypermobility or movement dysfunctions that may increase the risk of injury during sports participation. Injury Prevention Strategies: Based on the individual’s sport of choice and specific areas of vulnerability, we develop customised injury prevention programs focused on strengthening muscles, improving joint stability, and enhancing proprioception. Performance Optimisation: We design personalised exercise programs to improve functional movement patterns, agility, and overall athletic performance while minimising the risk of overuse injuries. Rehabilitation and Recovery: In the event of a sports-related injury, our rehabilitation programs are tailored to expedite healing, restore function, and prevent recurrence, allowing athletes to return to their favourite activities safely and confidently. Education and Empowerment: We provide comprehensive education on hypermobility management strategies, including proper warm-up and cool-down techniques, joint protection methods, and adaptive equipment recommendations, empowering individuals to take control of their health and well-being. Discussion with your coach/trainer (extra charges may apply): To ensure a cohesive approach to your training, we offer consultations with your coach or trainer. This collaboration helps in aligning your exercise program with your sport-specific goals and addressing any hypermobility-related concerns. Our team can provide your coach with insights and recommendations to optimise your training while safeguarding your health. Take The Next Step If you suspect that you or a loved one may have hypermobility, or if you are experiencing symptoms associated with EDS or HSD, don’t wait to seek help. Early screening and preventive measures can make a significant difference in managing these conditions effectively. Contact us today to schedule a consultation and take the first step toward optimising your sports performance and injury prevention efforts. Learn More To learn more about how our team can help, visit these pages: Physiotherapy for hypermobility Exercise Physiology for hypermobility Evidence-Informed Care for Zebras 100% Hypermobility-Dedicated Team Industry-Leading Founder Tailored Management for Hypermobility Brand New Facility & Onsite Pilates Gym Disability-Friendly Facilities Neurodiverse, LGBTQIA+ Friendly Practice Learn More How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + "</a>"; }); Meet Our Team Meet your dedicated and empathetic team of professionals at Not Just Bendy Sharon Hennessey Founder & Principal Physiotherapist Marlisa Kwan Team Leader & Senior Physiotherapist Belinda Bruest Senior Physiotherapist Maria Yee Senior Physiotherapist & PhD Candidate Meet Our Team Our Affiliations Always Forget Your Exercises? We have A Free App! We understand that keeping up with your exercise routine can be challenging, especially when balancing a busy schedule. That’s why we’re excited to introduce our free PhysiApp client app – a convenient, user-friendly tool designed to help you stay on track with your physiotherapy exercises and achieve your health goals. Why Use PhysiApp? Perfect Form, Anytime, Anywhere Track Your Progress Online and Offline In-App Reminders to Stay Motivated Over 200 Special NJB Exercises for those with Hypermobility & EDS Learn More Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Public (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[13]='TOPICS';ftypes[13]='text';fnames[3]='LBIRTHDAY';ftypes[3]='date';fnames[4]='SBIRTHDAY';ftypes[4]='birthday';fnames[5]='LAPPTDATE';ftypes[5]='date';fnames[6]='LASTCASE';ftypes[6]='text';fnames[7]='LASTPRAC';ftypes[7]='text';fnames[8]='LASTAPPTNA';ftypes[8]='text';}(jQuery));var $mcj = jQuery.noConflict(true);'''
