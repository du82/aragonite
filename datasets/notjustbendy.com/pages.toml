["https://www.notjustbendy.com/dance-conditioning-rehabilitation"]
title = "Dance Conditioning Rehabilitation for Hypermobility: Not Just Bendy"
description = "Specialized rehabilitation and conditioning programs for hypermobile dancers at Not Just Bendy. Support your passion for dance while ensuring optimal health and performance."
full_description = '''Dancers & Hypermobility Specialised rehabilitation and conditioning programs are available for hypermobile dancers at Not Just Bendy. We understand the unique challenges dancers with hypermobility face and the importance of specialised care to support their passion for dance while ensuring optimal health and performance. Our team of experienced Physiotherapists and Exercise Physiologists (some of whom are dancers themselves) are committed to providing comprehensive rehabilitation and conditioning programs designed specifically for dancers with hypermobility. Understanding Hypermobility in Dancers: Hypermobility is a condition characterised by excessive joint flexibility and can significantly impact dancers, leading to increased risk of injury and reduced stability, affecting performance quality. Dancers with hypermobility can face challenges such as joint instability, recurrent sprains, muscle imbalances, and chronic pain. Understanding these unique needs is crucial in developing effective rehabilitation and conditioning strategies to support dancers in their pursuit of excellence. To address the specific challenges hypermobile dancers face, an individually-tailored physiotherapy approach is essential. This involves not only focusing on injury rehabilitation but also on preventative care that enhances joint stability, muscular strength, and overall body control. Through targeted exercises, manual therapy, and individualised conditioning programs, physiotherapy can help hypermobile dancers build strength in key areas, reduce pain, and optimise movement efficiency. By working closely with therapists who understand the demands of dance and hypermobility, dancers can achieve better balance, coordination, and endurance, allowing them to perform at their best while minimising the risk of future injuries. Benefits Of Our Programs: • Reduced risk of dance-related injuries • Improved joint stability and control • Enhanced muscular strength and endurance • Optimised dance technique and performance quality • Faster recovery from injury • Increased confidence and enjoyment in dance Benefits Of An Appropriate & Safe Exercise Program for Dancers with Hypermobility: For dancers with hypermobility, maintaining movement, strength, and fitness is essential not only for performance but also for preventing deconditioning and the worsening of hypermobility-related symptoms. A tailored and safe exercise program designed specifically for hypermobile dancers can offer the following key benefits: • Improved proprioception, enhancing body awareness and control during complex dance movements • Increased muscle bulk, providing greater support and stability to hypermobile joints • Enhanced joint protection, reducing the risk of injury from overextension or instability • Release of endorphins, which can help modulate pain and improve overall well-being • Stress relief, promoting mental clarity and focus, both of which are crucial for dancers At Not Just Bendy, we understand how important it is to keep you dancing while addressing the unique needs of hypermobility. Our exercise programs emphasise joint stability and protection, ensuring that you develop strength in key areas to support long-term dance health. We take a holistic approach, incorporating flexibility, strength, and balance exercises that work with your dance routine. While we may suggest modifications to prevent injury, we only recommend avoiding dance sessions in cases of acute injury or significant medical concerns, always prioritising your safety and performance goals. Our Approach: At Not Just Bendy, we take a holistic approach to dance conditioning and rehabilitation for hypermobile individuals. Our programs are tailored to address the specific biomechanical demands of dance while focusing on enhancing joint stability, strength, flexibility, and overall performance. Here’s how we can help: Comprehensive Assessment: We begin with a thorough assessment of your musculoskeletal health, dance technique, and performance goals to identify areas of concern and develop a personalised treatment plan. Individualised Rehabilitation: Our physiotherapists utilise evidence-based techniques and modalities to address muscle imbalances, joint instability, and other issues commonly associated with hypermobility. Treatment may include manual therapy, therapeutic exercises, joint mobilisation, and proprioceptive training. Strength and Conditioning: We offer individually-tailored strength and conditioning programs designed to improve muscular strength, endurance, and control, enhancing performance while reducing the risk of injury. These programs are tailored to meet the unique needs of dancers with hypermobility and focus on optimising movement patterns and technique. Flexibility Training: While most dancers naturally possess a high degree of flexibility, it’s essential to balance this with strength and stability. Our exercise programs aim to improve range of motion safely, address muscle tightness, and promote proper alignment to support injury prevention and performance enhancement. Education and Injury Prevention: We provide valuable education on injury prevention strategies, dance biomechanics, and self-care practices to empower dancers with the knowledge they need to stay healthy and perform at their best. Take The Next Step Whether you’re a recreational dancer or a professional performer, our dance conditioning and rehabilitation programs can support you on your journey to dance excellence. Contact us today to schedule an appointment and take the first step towards a healthier, stronger, and more enjoyable and resilient dance experience. Learn More To learn more about how our team can help, visit these pages: Physiotherapy for hypermobility Exercise Physiology for hypermobility Evidence-Informed Care for Zebras 100% Hypermobility-Dedicated Team Industry-Leading Founder Tailored Management for Hypermobility Brand New Facility & Onsite Pilates Gym Disability-Friendly Facilities Neurodiverse, LGBTQIA+ Friendly Practice Learn More How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + "</a>"; }); Meet Our Team Meet your dedicated and empathetic team of professionals at Not Just Bendy Sharon Hennessey Founder & Principal Physiotherapist Marlisa Kwan Team Leader & Senior Physiotherapist Belinda Bruest Senior Physiotherapist Maria Yee Senior Physiotherapist & PhD Candidate Meet Our Team Our Affiliations Always Forget Your Exercises? We have A Free App! We understand that keeping up with your exercise routine can be challenging, especially when balancing a busy schedule. That’s why we’re excited to introduce our free PhysiApp client app – a convenient, user-friendly tool designed to help you stay on track with your physiotherapy exercises and achieve your health goals. Why Use PhysiApp? Perfect Form, Anytime, Anywhere Track Your Progress Online and Offline In-App Reminders to Stay Motivated Over 200 Special NJB Exercises for those with Hypermobility & EDS Learn More Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We reco