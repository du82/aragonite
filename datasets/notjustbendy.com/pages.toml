["https://www.notjustbendy.com/code-of-conduct"]
title = "Code of conduct"
description = "Not Just Bendy Hypermobility Services has a zero tolerance policy for rude, harassing, manipulating, intimidating or violent behaviour towards their Physiotherapists, receptionists and other clients. We also have the right to withdraw service for any reason we choose without explanation.  Enforcement of this policy is at our discretion and you will be excluded from attending […]"
full_description = "Code Of Conduct and Zero Tolerance Guidelines Not Just Bendy Hypermobility Services has a zero tolerance policy for rude, harassing, manipulating, intimidating or violent behaviour towards their Physiotherapists, receptionists and other clients. We also have the right to withdraw service for any reason we choose without explanation. Enforcement of this policy is at our discretion and you will be excluded from attending our practice in the future. In some cases, the police will be called. In order for Not Just Bendy Hypermobility Services to maintain good relations with their clients, we would like to ask all clients to read and take note of the types of behaviour that would be found unacceptable: Using offensive language or swearing Any physical violence such as pushing or shoving or invading the personal space or physical intimidation Verbal abuse in any form including verbally insulting or being upset in the presence of our staff Racial abuse and sexual harassment Persistent or unrealistic demands that cause stress to staff Threatening language including threats of retaliation, litigation or complaints Threat of self harm Causing damage/stealing from the premises, staff or patients Obtaining services fraudulently Other behaviours that cause our staff distress We ask you to treat our Physiotherapists and staff courteously at all times. We take it very seriously if a member of staff is experiences any of the listed behaviours from one of our clients. Our Physiotherapists and staff have a right to care for others without fear of being spoken to in an offensive manner, attacked or abused. To successfully provide these services a mutual respect between all the staff and clients must be in place. Dealing with people who are upset, abusive or aggressive towards our staff or other clients, takes us away from caring for you. All our staff aim to be polite, helpful, and sensitive to all client’s individual needs and circumstances. The staff understand that ill clients do not always act in a reasonable manner and will take this into consideration when trying to deal with a misunderstanding or complaint. However, offensive behaviour, will not be tolerated. Abusers will be required to leave the clinic and be asked to transfer their care to another clinic. Extreme cases, including refusal to leave the clinic, will result in the police being called. We have the right to refuse treatment and take further action against anyone who threatens the safety of our staff and our clients. Other policies and answers can be found in our Frequently Asked Questions page."
