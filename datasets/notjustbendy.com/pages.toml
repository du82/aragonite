["https://www.notjustbendy.com/marlisa-kwan"]
title = "Marlisa Kwan"
description = "Marlisa Kwan Team Leader & Senior Physiotherapist Available for Individual Consultation & Telehealth(BOOKS CLOSED FOR NEW PATIENTS) Eight Mile Plains, Brisbane, Australia (07) 3123 4826 reception@notjustbendy.com CURRENTLY NOT SEEING ANY NEW PATIENTS Marlisa is a dedicated physiotherapist at Not Just Bendy Hypermobility Services, where her focus lies within hypermobility. Her journey into concentrating in hypermobility […]"
full_description = "Marlisa Kwan Team Leader & Senior Physiotherapist Available for Individual Consultation & Telehealth(BOOKS CLOSED FOR NEW PATIENTS) Eight Mile Plains, Brisbane, Australia (07) 3123 4826 reception@notjustbendy.com Contact Us CURRENTLY NOT SEEING ANY NEW PATIENTS Marlisa is a dedicated physiotherapist at Not Just Bendy Hypermobility Services, where her focus lies within hypermobility. Her journey into concentrating in hypermobility began with a serendipitous encounter during her duration in the community sector, where she had the privilege of working closely with a client diagnosed with Hypermobile-Ehlers Danlos Syndrome (H-EDS) and Postural Orthostatic Tachycardia Syndrome (POTS). Eager to deepen her understanding, Marlisa attended a pivotal lecture on hypermobility facilitated by Sharon Hennessey through the Australian Physiotherapy Association in 2019. This experience not only broadened her clinical perspective but also led to a profound realisation—Marlisa discovered her own hypermobility. Since then, Marlisa has evolved into a dedicated advocate for hypermobile individuals, serving at NJB since its establishment in 2020. Throughout her tenure, she has assisted over 200 clients with hypermobility, consistently honing her expertise. She remains committed to staying at the forefront of EDS research and management strategies, actively seeking advanced training opportunities. Marlisa’s dedication is evident in her attendance in conferences such as Mast Cell Activation Syndrome 2023, the Australian POTS conference 2023 and Marfan Conference 2024. Additionally, she has completed her EDS Finding Functional Foundations course, completing her seventh Allied Health module through EDS ECHO, Level 1 in Pilates Equipment and Neuromuscular dry needling (Level 1 &2 condensed) Marlisa’s commitment to holistic care extends beyond hypermobility, as evidenced by her interest in neurological physiotherapy, which has significant overlap with our treatment approach for hypermobility. She has previously completed the Introduction to Vestibular Rehabilitation course. Marlisa’s dedication to her clients transcends the clinical setting; she is deeply invested in supporting individuals through the National Disability Insurance Scheme (NDIS), continually updating her knowledge to navigate the evolving landscape effectively. At the heart of Marlisa’s practice philosophy is personalised care. She believes in tailoring interventions to suit each client’s unique needs, goals, and daily fluctuations in symptoms. Marlisa employs a multifaceted approach, offering specific advice on energy conservation, pain management, and joint protection, complemented by hands-on techniques and lived experience. Beyond her professional endeavours, Marlisa finds solace and joy in the outdoors, often accompanied by her beloved Kelpie, Winnie. She is also committed to practicing what she preaches and enjoys regularly attending the gym, pilates, rock climbing and other physical challenges at an average skill level. Marlisa is passionate about helping her clients maintain their own active lifestyles by offering tailored modifications to ensure they can continue safely. Contact us to make an appointment with Marlisa Kwan."
