full_description = "Hypermobility Resources Not Just Bendy – also smart, educated, and mighty. Hypermobile-Ehlers-Danlos Syndrome, Joint Hypermobility Syndrome and Hypermobility Spectrum Disorder – can all have hypermobile joints (now or in the past) and sometimes other issues related to connective tissue issues. Knowledge is power, but everyone with hypermobility is unique. Avoid getting overwhelmed by online information. Let your therapist guide you through what’s most relevant to your journey. Here are some of Not Just Bendy’s recommended resources to kickstart your research. For tailored advice, ask your physiotherapist about where to focus. Note: This is not medical advice. Please consult your healthcare provider for personalized recommendations. Conference Summary Links: https://www.ehlers-danlos.com/ https://www.ehlersdanlosaus.com/ https://www.hypermobility.org/living-with-hypermobility-syndromes https://potsfoundation.org.au/ Jeannie Di Bon – blog, podcast and zebra club app full of rehab class for HEDS) Discount code POTS20 – 20% off subscription www.thezebra.club Finding therapists around Australia: Facebook groups: EDS/Zebras for your local area and ask for recommendations Ehlers Danlos Society Directory of professionals https://www.ehlers-danlos.com/healthcare-professionals-directory/ Physiotherapy practices with a reformer pilates gym. Look at the website and call/email for ino. Looking for a physio who works with older people or who treats complex conditions and chronic pain. Unfortunately Not Just Bendy is unable to give out recommendations unless you are a current client For medical professionals only: Education:Bite size webinar chunks with guest speakers. Low cost program essential for all those wanting to upskill in hypermobility EDS ECHO Multidisciplinary Team Practice Australasia Facebook group: Hypermobility for Australian Allied Health Linkin: Hypermobility Special Interest Group General Overview Hypermobility Links & Websites What is hypermobility? Blog by Not Just Bendy Principal Physiotherapist Sharon Hennessey. Ehlers-Danlos Society. https://www.ehlers-danlos.com Comprehensive site includes full text published journal articles and internationally agreed classifications. Very good YouTube channel with lectures recorded from patient focused global learning conference. A good one about how to approach rehab is: Physical Therapy Management (of h-EDS)- Inge De Wandele and Leslie Russek https://www.hypermobility.org/ HMSA – Hypermobility Syndrome Association (UK) www.hypermobilityconnect.com – Australian blog, Facebook page and positive patient support group Podcast series: Hypermobility Happy Hour www.notjustbendy.com – blog and website of Not Just Bendy Hypermobility Services Physiotherapist Sharon Hennessey (don’t go anywhere you are already here) Podcast interview with Physiotherapist Sharon Hennessey about connective tissue disorders and working with hypermobile patients (recorded by Insight Osteopathy). https://drchenphysio.com/ – insight filled blog of Not Just Bendy Physiotherapist Dr Chen Hypermobile- Ehlers Danlos Syndrome diagnostic checklist pdf https://www.ehlers-danlos.com/heds-diagnostic-checklist/ General Overview Books “Joint Hypermobility Handbook” by Dr Brad Tinkle (USA Geneticist) is a general guide and easy to understand handbook discussing many symptoms associated with hypermobility. “Understanding Hypermobile-Ehlers-Danlos Syndrome and Hypermobility Spectrum Disorder”, by Claire Smith. A very comprehensive book with detailed medical information and references to an extensive list of scientific papers. A useful guide to share with your medical practitioner. Disjointed Hypermobility without Tears: Moving Pain-Free with Hypermobility and EDS by Jeannie Di Bonn. A good introduction to the importance of posture, breathing and letting go of muscle tension. Jeannie Di Bonn has also given an EDS society webinar titled – Movement Therapy and EDS Well being. Disjointed: Navigating the Diagnosis and Management of hypermobile Ehlers-Danlos Syndrome and Hypermobility Spectrum Disorders by Diana Jovin The Trifecta Passport: Tools for Mast Cell Activation Syndrome, Postural Orthostatic Tachycardia Syndrome and Ehlers-Danlos Syndrome by Amber Walker Common Postural Issues and Hypermobility References Increased Lumbar Lordosis (low back arch) – hippainhelp.com/causes-affects-exercise-for-lordosis-and-hip-and-back-pain/ Hip Hanging – hippainhelp.com/are-you-a-hip-hanger-ideas-on-how-not-how-to-stand-for-hip-pain-relief/ How to Use a Walking Stick – hippainhelp.com/how-to-use-a-walking-stick-why/ Pain with walking – hippainhelp.com/3-simple-strategies-to-reduce-hip-pain-with-walking-and-running/ Autonomic Dysfunction (Dysautonomia) including Postural Orthostatic Tachycardia Syndrome(POTS) What is POTS? Dysautonomia Society. 4 minute summary video. Dr Peter C. Rowe – Managing Life with Autonomic Symptoms. Excellent summary of the conservative and medical management of POTS 2022 Conference: POTS Unmasked (first POTS focused Australian focus) – All webinars available for free. https://potsfoundation.org.au/conference/2022-conference-pots-unmasked/ Teens & Autonomic Dysfunction [PDF] – A useful workbook focusing on salt, fluids and pacing. Includes diary for problem solving & geared at teens although also useful for adults. www.ehlers-danlos.org/wp-content/uploads/2017/07/MAYO_Clinic_Teens_Dysautonomia_copy.pdf “The Dysautonomia Project” – book, website, articles, Facebook page and videos: thedysautonomiaproject.org www.mycoolingstore.com – wide range of products to assist with keeping cool www.cooldownaustralia.com.au – Australian website with products to help you keep cool Mast Cell Activation Syndrome Mast Cell Activation Disease: Current Concepts by Dr Lawrence Afrin. Australian POTS foundation 2022 Mast Cell Activation Syndrome and it relationship to hypermobility blog by Sharon Hennessey 2023 BOOK: The Trifecta Passport: Tools for Mast Cell Activation Syndrome, Postural Orthostatic Tachycardia Syndrome and Ehlers-Danlos Syndrome by Amber Walker Healthline: Low histamine Diet https://www.whatthebleepcanieat.com Mast cell mediator questionnaire GUTS Issues and Diet Hypermobility References “Association between EDS and gut problems” EDS society lecture presented by world leader in this field – Dr Qasim Aziz Heidi Collins EDS society presentation notes: ehlers-danlos.com/pdf/Collins-EDS-You-are-NOT-what-you-eat-S.pdf Allergies and intolerance (including IBS symptoms) The Monash University Low FODMAP Diet™ – www.monashfodmap.com Books by Dr Sue Shepherd – shepherdworks.com.au/shop/#wrapper-wdp554ed61d23b6f, includes: “The Two-Step Low-FODMAP Diet and Recipe Book” “Low FODMAP Recipes” “Gluten Free Cooking” “Allergy-Free Cooking Recipe Book” “The Complete Low FODMAP diet” (booktopia) by Dr Sue Shepherd Lower inflammation Healthline: Mediterranean Diet Healthline: Low histamine Diet https://www.whatthebleepcanieat.com NB: It is important to discuss dietary changes with your specialist medical team, GP, gastroenterologist or dietician. Hormones & Periods Disorders of Bladder Function hypermobility/EDS by Prof Vik Khullar www.youtube.com/watch?v=bqqRQYCvOkI Hypermobility Happy Hour – Podcast on Menses, Mast Cells and Migraines soundcloud.com/user-676536371/interview-with-dr-lila-rosenthal Book by Laren Briden: Period Repair Manual www.larabriden.com/period-repair-manual/ Scientific Journal Article: Successful mast-cell-targeted treatment of chronic dyspareunia, vaginitis, and dysfunctional uterine bleeding. www.ncbi.nlm.nih.gov/pubmed/30964355 www.PelvicPain.Org – free website with info on pelvic pain for women, men and teens: Link to the teen page including period pain management Fatigue, Activity Tracking & Pacing Cresta Fatigue Guide – excellent workbook for problem solving fatigue Pacing activity ideas from www.PainManagement.org Runkeeper app – measures distances walked. Fitbit/ Apple Watch/Garmin etc– worn on the wrist these devices can measures daily steps, heart rate and sleep cycles. Pedometer – to measure daily steps. Many smart phones have a built in pedometer (for iPhone: look in the Health app) and you can get more advanced options from the app store. Sleep Tracker app Activity Diary – can be used to record your activity, sleep and pain level. You can make your own, choose an app or download worksheets Fall Detection – Apple Watch (on series 4 & 5 or above) Chronic Pain Management “Explain Pain” book by David Butler & Lorimer Moseley TED talk by Lorimer Moseley “Why Things Hurt?” A quick but useful guide to chronic pain – www.noigroup.com/noijam/a-glittery-free-pain-resource/ “Recognise” – Smartphone App by NOI group. For training laterality (distinguishing left from right) which can be helpful in chronic pain www.noigroup.com/product/recogniseapp/ What is chronic pain – Blazin guns – video explaining the many factors that contribute to chronic pain. Free online course for those with chronic medical conditions – develop good emotional well being despite having a chronic condition ecentreclinic.org/?q=CCCourse PainBytes; Free online pain course for kids & adolescents www.aci.health.nsw.gov.au/chronic-pain/painbytes App: Curable – app that includes pain education, problem solving and meditation www.curablehealth.com See also Mindfulness/Meditation section Breathing/Relaxation Breathing Is Important With Hypermobility and EDS | Jeannie Di Bon https://www.youtube.com/watch?v=GK8rKm9ApE0 Cranio-Cervical Instability Upper Cervical Instability in Hypermobile Patients by Dr X.Chen (NJB physio) https://www.physio-network.com/blog/upper-cervical-instability-hypermobility/ Article (Sharon Hennessey (NJB physio) co-author): Presentation and physical therapy management of upper cervical instability in patients with symptomatic generalized joint hypermobility: International expert consensus recommendations https://www.frontiersin.org/articles/10.3389/fmed.2022.1072764/full Mindfulness/Meditation “Headspace” – www.headspace.com or download headspace phone app. Ten minute mindfulness meditations made simple. First ten meditations are free. Useful animations about the brain and negative thoughts. Buddhify app Smiling Mind app – also has meditations for children and adolescents 1 Giant Mind app “The Happiness Trap” or the comic version “The Happiness Trap Pocketbook” by Russ Harris are excellent publications that cover the basics of ACT (acceptance and commitment therapy) and mindfulness. www.actmindfully.com.au Spotify music app – search for mindfulness, meditation or relaxation. Helpful Equipment/Accessories – see also our Hypermobility Shop page Please note: No responsibility is taken for any information provided on this site or any of the links listed. These links are not and do not imply specific individual medical advice. Please consult your own medical practitioner for advice to suit your personal circumstances. Want To Learn More From Sharon Hennessey About Hypermobility? Sharon’s ground-breaking hypermobility educational courses are launching soon – sign up now to know when the courses go live! Join the wait list to be the first to access exclusive video content, tailored for health professionals, patients, carers, and anyone seeking to better understand hypermobility. Join the Waitlist More Info Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Public (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[13]='TOPICS';ftypes[13]='text';fnames[3]='LBIRTHDAY';ftypes[3]='date';fnames[4]='SBIRTHDAY';ftypes[4]='birthday';fnames[5]='LAPPTDATE';ftypes[5]='date';fnames[6]='LASTCASE';ftypes[6]='text';fnames[7]='LASTPRAC';ftypes[7]='text';fnames[8]='LASTAPPTNA';ftypes[8]='text';}(jQuery));var $mcj = jQuery.noConflict(true);"
