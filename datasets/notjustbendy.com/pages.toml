full_description = '''Directions & Parking Location We are located at our brand new, custom-built facility in Eight Mile Plains. Our address is: Building 9, Suite 203 Level 1Freeway Office Park 22728 Logan RoadEight Mile Plains4113 Queensland Tip: Best to put in “Not Just Bendy” into Google Maps. Our Building We are located in the building pictured (left). Directions: From the city Head south on the Pacific Motorway, from Brisbane City. Take exit 14 for Logan Rd, and use the right 2 lanes to turn right onto Logan Rd/State Route 95. Follow Logan Rd for approximately 2.7km, our clinic will be on your left. Turn onto School Road to access Freeway Office Park and follow the signs to Building 9. From the Gold Coast Head north on the Pacific Motorway. Take exit 20 for State Route 30/Logan Rd towards Underwood/Springwood. Turn left onto Logan Rd/State Route 30, and follow Logan Rd for approximately 4km. Make a U-turn at Levington Rd, then turn onto School Road to access Freeway Office Park. Follow the signs to Building 9. Parking There are 4 customer carparks marked with Not Just Bendy out the front of building 9. There are also 7 undercover/basement parking marked with Not Just Bendy with lift access to the clinic. Entry to the basement car park is located between Building 9 and Building 10. It is the second driveway (first driveway is for access to daycare only and one disabled park). You will see a Medsana sign that says “Parking here” You will need to press the button to be admitted to the basement carpark, or use the code that you have been given by our reception team. Turn left once you enter the car park, and park in one of our signed parking bays which are all the way down past the lift on the left, and will be marked with Not Just Bendy signage. There is also a disabled carpark in this area. Access our facility by going to Level 1 in the lift. Overflow unmarked parking is available on School Rd. Disability Parking: If you have a disability parking permit, you are also able to use the disability parking bays that are available throughout Freeway Office Park. There is one bay in the undercover parking area close to our other carparks, one bay outside Building 9 which is near the daycare center (with flat access to lobby with lift to our floor), and other bays by Building 10. Need To Contact Us? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Email: document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + '</a>'; });'''
