["https://notjustbendy.com/ndis-reports"]
title = "NDIS Reports -"
description = "Supporting Evidence at Not Just Bendy Hypermobility Services (Updated October 2024 – Subject to Change) Striking a Balance: Patient Care and Staff Well-Being At Not Just Bendy Hypermobility Services, we are committed to offering exceptional care to our clients, which includes supporting your journey with the NDIS. However, it’s important for us to share our […]"
full_description = "NDIS Reports Supporting Evidence at Not Just Bendy Hypermobility Services (Updated October 2024 – Subject to Change) Striking a Balance: Patient Care and Staff Well-Being At Not Just Bendy Hypermobility Services, we are committed to offering exceptional care to our clients, which includes supporting your journey with the NDIS. However, it’s important for us to share our perspective on writing supporting evidence: High Demand, Limited Resources: While we understand the importance of supporting evidence in accessing necessary support, the demand for this service can be overwhelming. Our resources, especially in terms of staff time and energy, are finite. Ensuring Staff Well-Being: The process of writing detailed supporting evidence is time-consuming and can be stressful, potentially leading to therapist burnout. Our top priority is the health and well-being of our staff, as they are the cornerstone of the quality care we provide. Selective Service: Given these challenges, we only offer this service to established, regularly engaged clients. Our Ethics: We base our recommendations on what we would testify to as “reasonable and necessary” in a court of law. We ask that clients respect our professional judgment regarding what can be included in reports. Report Writing Services for NDIS/DSP Access (letters of support) Completing supporting evidence for NDIS or DSP access is complicated and takes a great deal of time. Our supporting evidence services to assist with NDIS and/or DSP access are exclusive to our long-term, regular clients. We do not complete reports for clients who are only seeking report writing services or for conditions that fall outside our clinical expertise (e.g., non-physical disabilities). As we prioritize addressing our new patient waitlist, our therapists focus on practical-based therapy, which results in therapists unfortunately being unable to assist with functional capacity assessments/extensive reports. Who can access these services at NJB? NJB Specific Eligibility: To qualify for these supporting evidence services, clients must be actively engaged with our therapy. The therapist needs a comprehensive understanding of your function and disability impact. NDIS Guidelines: It is recommended that the health professional providing evidence has been treating the applicant for at least six months. Note that a letter from us alone is typically not sufficient for NDIS access—extensive reports from an external Occupational Therapist are often required. What is the process? Getting to know you: Our physiotherapists spend time understanding your unique situation. This initial phase is crucial for us to provide supporting evidence that truly reflects your needs. Regular attendance in physiotherapy/exercise physiology is vital for a strong NDIS application, where the disability results in physical impairments. NDIS Access Eligibility: You must satisfy the following (as per NDIS eligibility criteria): Under the age of 65 years old Australian citizen, permanent resident or protected Special Category Visa holder Have a significant disability, that is likely to be permanent. Significant: Meaning substantially reduced capacity to undertake activities within at least one of the six NDIS functional domains. Permanent: Disability needs to be assessed as lifelong or likely to be lifelong. Disability: Must have obtained an official diagnosis from a medical specialist in writing (excluding children under the age of 9) You must have tried all reasonable available treatment options Letter Preparation: Depending on how long you have been a client at NJB Hypermobility Services, our therapists may not require additional information prior to completing the letter. However, in some circumstances a telehealth appointment to clarify information may be necessary. Questionnaires and objective outcome measures are usually not completed, due to time restraints, but depending on your situation and your therapist’s capacity this may be included. Contents of Letter of Support (NDIS access): Brief report on diagnosis, impairments, intervention to date (at NJB) and recommendations. Supporting Evidence for Existing NDIS Participants We provide supporting evidence for the following situations: Plan Review: These reports summarise your disability, outlines NDIS funded interventions provided by your therapist and provides clinical recommendations. Information and specificity vary dependent on client’s situation and length of engagement with the clinic. Change of Circumstance: Supporting evidence for a “change of circumstance” request (e.g. participants seeking to add a diagnosis of h-EDS to an existing plan) is available only to clients who meet both NJB specific eligibility and NDIS access eligibility (listed above). This is because the extensive evidence needed to demonstrate the permanency of a disability can only be provided by a clinician who has been involved in the participant’s care for a significant period of time. Additionally change of circumstance requests will only be completed if the treating therapist supports the change and determines it to meet the NDIS eligibility criteria for a “significant” change. Report contents: Information and specificity vary dependent on client’s situation and engagement with the clinic. Report is similar to that of a typical NDIS plan review report, with inclusion of the recommended change. Assistive Technology Letters: We may provide letters for low/mid-cost assistive technology recommended by your therapist, but we do not support requests for specialist disability accommodation (SDA) or high-cost assistive technology. Costs and Procedures for all Supporting Evidence Notice Period: We require a minimum of 12 weeks’ notice for all report and letter requests. Even for urgent change of circumstances, NDIS processing may take up to six months. You may require a consultation (telehealth or in clinic) with your therapist to discuss your request, prior to your therapist agreeing to complete the supporting evidence. Billing: Reports are charged at the treating therapist’s hourly rate, including time for any modifications or document reviews. All supporting evidence and appointment payments must have been received prior to receival of your supporting evidence. Not Just Bendy Hypermobility Services holds no responsibility for delays associated with your provider. Appointment-Based Process: The estimated writing time will be booked in the therapist’s schedule like an appointment. Without this booking, we cannot guarantee availability or timeframes for completion. The estimated writing time will vary. Your therapist will use their clinical judgement and expertise to provide this estimate. If you have budget restrictions, please highlight this to your therapist and they can focus the report on the essential information. Some reports may also require an additional in clinic consultation with your therapist to complete relevant outcome measures. Client Responsibility: Any unpaid invoices not covered by NDIS are the client’s responsibility. Important Considerations Hypermobile Ehlers-Danlos Syndrome (hEDS) and NDIS Access: Obtaining NDIS support with hEDS as the listed disability can be challenging, though not impossible. The process often requires extensive documentation that goes beyond our therapists’ capacity to provide. We prioritize transparency to avoid wasting time and resources, given the limited capacity of both our clients and therapists. Recently, most NDIS access applications or change of circumstance requests for inclusion of h-EDS to an existing plan have led to internal or external reviews, resulting in lengthy processes. If we determine that an application does not meet NDIS access criteria or is unlikely to be approved, we will not proceed with writing the report.Scope of Practice: We reserve the right to decline report requests that fall outside our expertise or ethical guidelines. Please see our Code of Conduct for additional information – https://notjustbendy.com/code-of-conduct/A reminder: We are unable to provide supporting evidence for new clients regarding access to the NDIS or DSP. To offer these documents, the therapist must have a thorough understanding of the client’s functional abilities and overall capacity, which can vary on a case-by-case basis."
