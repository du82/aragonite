["https://www.notjustbendy.com/cne-award"]
title = "centre of excellence"
description = "Center Of Excellence - Awarded by The EDS Society to Not Just Bendy"
full_description = '''Center Of Excellence – Awarded by The EDS Society Our Prestigious Recognition: The EDS Society Centre of Excellence Award We are thrilled to announce that our clinic has been awarded the prestigious Centre of Excellence (CNE) Award by The Ehlers-Danlos Society. We are exclusively the only practice in Brisbane to receive this honour, recognising our commitment to providing exceptional care for individuals with Ehlers-Danlos Syndrome (EDS) and Hypermobility Spectrum Disorders (HSD). What The Award Represents Centres that have been awarded represent recognition for their wealth of expertise across many areas of care delivery for those with EDS and HSD. Together, these centres make a crucial contribution towards achieving The Ehlers-Danlos Society’s mission of increasing the availability of clinical services, decreasing the diagnostic odyssey, and standardising communication and care for those impacted by EDS and HSD. The Rigorous Application Process The process to achieve this accolade was extensive and rigorous. It required us to demonstrate the highest standards of care, training, and accessibility. Here are some key aspects of our application and the commitments we made to be recognized as a Centre of Excellence: Comprehensive Therapist Training Each of our therapists has undergone rigorous training to provide the best care for EDS and HSD patients. Our team is trained in the latest diagnostic criteria and management guidelines, ensuring that our patients receive accurate diagnoses and effective treatment plans. We have a proven track record of managing over hundreds of EDS clients, showcasing our experience and dedication to this community. Exceptional Client Care At Not Just Bendy, our commitment to exceptional client care is evident in our rigorous adherence to the Ehlers-Danlos Society C.A.R.E. Model, which emphasises Care, Access, Research, and Education. Care We prioritise the highest standards of care for individuals with Ehlers-Danlos Syndrome (EDS) and Hypermobility Spectrum Disorders (HSD). Our multidisciplinary approach ensures comprehensive management tailored to each patient’s unique needs. Here are the key elements of our client care: Multidisciplinary Care: We provide coordinated care through our network of specialists, ensuring holistic treatment for all symptoms and comorbidities. Patient-Centred Approach: We listen to and validate our patients’ experiences, incorporating their feedback through surveys and questionnaires to continuously improve our care. Rigorous Diagnostic Standards: We use the internationally peer-reviewed 2017 criteria for diagnosing EDS and HSD, committing to update our practices as new guidelines are established. Our dedication to professional development and community engagement is demonstrated by our active participation in educational events and conferences hosted by the Ehlers-Danlos Society. Our journey began with Sharon Hennessey’s attendance at the groundbreaking EDS conference in New York in 2016 and has continued with team participation in subsequent conferences, including the Sydney conference in 2018 and various online and virtual summits. Access Accessibility is a cornerstone of our practice, ensuring that our services reach all who need them: Telehealth Services: We offer telehealth consultations to reach patients in all geographies where it is possible, breaking down barriers to access. Disability-Friendly Facilities: Our clinic is designed with full disability access, and we provide necessary adaptations to ensure comfort and ease for all patients. Inclusive Care: We adhere to the Society’s Diversity, Equity, and Inclusion (DEI) policies, ensuring that our services are accessible to underserved communities. Research Contributing to the advancement of EDS and HSD research is fundamental to our mission: Research Participation: We actively encourage our patients to engage in research activities and sign up for the EDS & HSD DICE Global Registry. Innovative Studies: We support academic research, like Maria Yee’s PhD study on the use of dance classes for rehabilitating children with hypermobility, and contribute to scientific literature with publications such as Sharon Hennessey’s work on upper cervical instability. Future Collaborations: We are preparing to collaborate with a local university to conduct research using data from over 900 symptomatic hypermobility clients, aiming to make significant contributions to the field. Education Continuous education and community engagement are key to our practice’s success: Professional Development: We participate in the EDS ECHO programs and attend annual CNE conferences to stay abreast of the latest developments and share our knowledge. Internal Training: Knowledge gained from conferences and educational events is disseminated through structured internal training sessions, ensuring all team members are updated with the latest practices. Community Education: We engage in public presentations and provide extensive educational resources, including blogs and handouts, to raise awareness and support for the hypermobility community. Commitment to Excellence Receiving the EDS Society Centre of Excellence Award is a testament to our unwavering commitment to the EDS and HSD community. We are dedicated to providing the highest quality of care, advancing research, and promoting education to improve the lives of those affected by these conditions. We invite you to learn more about our services and how we can support your journey towards better health and well-being. Contact us today to schedule an appointment or to get more information about our programs for EDS and HSD patients. How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + "</a>"; }); Join Our Newsletter! Stay in the loop with the latest information on hypermobility. Are you a Health Professional? YesNo .btn-custom { background-color: #964e9e; border-radius: .33rem; border-color: black; border-width: 0; color: white; padding: 10px 20px; font-size: 16px; cursor: pointer; text-transform: uppercase; border-style: solid; transition: background-color 0.3s ease; } .btn-custom:hover { background-color: #7b3f7d; } /* Centering the button */ .nf_button_container { text-align: center; margin-top: 20px; /* Optional: Adds some space above the button */ } /* Placeholder Styling */ input::placeholder, textarea::placeholder { color: black; /* Placeholder text color */ font-style: italic; /* Italicize the placeholder text */ opacity: 1; /* Ensures the placeholder has full opacity */ } /* Adjusting input field styling */ input[type="text"], input[type="email"], textarea { padding: 10px; border-radius: .33rem; border: 1px solid #ccc; width: 100%; box-sizing: border-box; /* Ensures padding does not affect total width */ } /* Adjust input field styling on focus */ input[type="text"]:focus, input[type="email"]:focus, textarea:focus { border-color: #964e9e; /* Changes border color when focused */ outline: none; /* Removes default outline */ } /* Centering the Health Professional Section */ .nf_areuhp_inner { text-align: center; } /* Aligning radio buttons and labels */ .nf_areuhp_inner label { margin: 0 10px; /* Spacing between radio buttons */ }'''
