["https://www.notjustbendy.com/hypermobility-in-working-adults"]
title = "hypermobility in the workplace"
description = "In today’s dynamic workforce, individuals with hypermobility face unique challenges across various industries. From office workers spending prolonged hours at their desks to healthcare professionals on their feet for extended shifts, hypermobility can impact productivity, job performance, and overall well-being. At Not Just Bendy, we understand the diverse needs of working adults and offer tailored […]"
full_description = '''Hypermobility in Working Adults In today’s dynamic workforce, individuals with hypermobility face unique challenges across various industries. From office workers spending prolonged hours at their desks to healthcare professionals on their feet for extended shifts, hypermobility can impact productivity, job performance, and overall well-being. At Not Just Bendy, we understand the diverse needs of working adults and offer tailored physiotherapy solutions to support individuals across a wide range of professions: Office Workers and Creative Professionals: Challenges: Office professionals, artists, musicians, and other creative professionals often find themselves immersed in activities that demand repetitive hand and arm movements and maintain prolonged static sitting or standing postures. These repetitive and static movements can gradually lead to overuse injuries, exacerbating joint pain and stiffness, especially among individuals with hypermobility. Moreover, inadequate proprioception, the body’s awareness of its positioning in space, can contribute to poor posture, further exacerbating pre-existing painful conditions such as back or neck pain. In addition to physical challenges, the nature of office and creative work often involves intense focus and long hours, leading to mental fatigue and increased susceptibility to musculoskeletal strain. The pressure to meet deadlines and produce high-quality work may inadvertently lead individuals to neglect their physical well-being, potentially exacerbating existing issues or creating new ones. How We Can Help: Our team of Physiotherapists and Exercise Physiologists recognises the unique demands faced by office workers and creative professionals. We conduct comprehensive functional and ergonomic assessments to optimise your posture and workstation setup, addressing specific concerns related to your work environment. Through targeted soft tissue mobilisation techniques and personalised exercise prescriptions, we aim to alleviate muscle tension, improve joint mobility, and enhance proprioception. Furthermore, we provide practical guidance on posture correction and recommend supportive techniques using braces and tapes to promote optimal alignment and reduce the risk of injury. Our holistic approach not only addresses immediate discomfort but also empowers you with the knowledge and tools to maintain long-term musculoskeletal health, allowing you to perform at your best creatively and professionally. Healthcare Professionals, Teaching, Fitness & Service Industries: Challenges: People working in physically demanding roles such as those in the health, teaching, fitness and service industries face unique challenges due to the nature of their work. Prolonged periods of standing, lifting heavy objects, repetitive motions, and awkward postures can all contribute to musculoskeletal strain and fatigue. Additionally, the high-pressure environment and emotional demands inherent in these professions can further exacerbate physical discomfort and stress. How We Can Help: Our Physiotherapists and Exercise Physiologists offer specialised rehabilitation programs focused on strengthening and conditioning muscles, improving balance, coordination and proprioception, and implementing strategies to manage overexertion and injury. Through targeted exercises, ergonomic assessments, and personalised treatment plans, we aim to alleviate pain, enhance physical resilience, and promote overall well-being. By addressing the root causes of musculoskeletal discomfort and fatigue, we empower individuals to perform at their best and thrive in their respective roles. Consulting and On-Site Professionals: Challenges: Consulting and on-site professionals in industries such as construction, manufacturing, mining, and agriculture etc. face unique challenges due to the demanding and often unpredictable work environments. These roles typically involve frequent site visits, which can include exposure to dusty environments, temporary buildings with poor desk and chair setups, and living away from home without access to regular support services for weeks at a time. The nature of their tasks often requires navigating uneven surfaces, enduring long drives, and managing stressful deadlines. For individuals with hypermobility, these conditions can significantly increase the risk of musculoskeletal injuries, such as strains, sprains, and overuse injuries. How We Can Help: Our experienced team of Physiotherapists and Exercise Physiologists understands the specific needs of consulting and on-site professionals with hypermobility. We develop tailored rehabilitation programs that prioritise functional movement patterns, ergonomics, and injury prevention strategies. Through a combination of targeted exercises, soft tissue mobilisation techniques, and education sessions, we aim to address both acute and chronic pain, improve functional capacity, and enhance overall well-being. Additionally, our experts provide practical guidance on workplace ergonomics and safety measures to minimise the risk of future injuries. This includes advice on optimal desk and chair setups, techniques to manage long periods of driving, and strategies to handle the physical demands of uneven surfaces and adverse working conditions. By empowering consulting and on-site professionals with the knowledge and tools to maintain optimal musculoskeletal health, we strive to support them in performing their job duties safely, efficiently, and with confidence, even in challenging environments. Other ways we can help: Exercise classes: Our individualised and small group exercise classes are meticulously crafted for working adults with hypermobility, integrating Clinical Pilates with tailored strengthening and conditioning regimens. Regular attendance is strongly encouraged to harness the full spectrum of benefits and accelerate progress toward achieving your unique functional objectives. Further details regarding our exercise classes can be accessed here. Circulation Management Advice: We can assist with effective management of circulatory health, especially for those with Postural Orthostatic Tachycardia Syndrome (POTS). We can offer advice to help reduce symptoms like dizziness and improve focus and concentration during prolonged sitting or standing. For more detailed information, visit our POTS blog. Liaise with your employers: By collaborating with your employer, we aim to implement ergonomic adjustments and accommodations tailored to your specific requirements, thereby promoting your comfort, productivity, and overall well-being in the workplace. Liaise with your medical team: We coordinate with your medical team to ensure a cohesive and holistic approach to managing your hypermobility-related challenges. Take the Next Step If you suspect that you or a loved one may have hypermobility, or if you are experiencing symptoms associated with EDS or HSD, don’t wait to seek help. Early screening and preventive measures can make a significant difference in managing these conditions effectively. Contact our friendly reception team today to schedule your hypermobility screening and start your journey towards better joint health and overall well-being. Learn More To learn more about how our team can help, visit these pages: Physiotherapy for hypermobility Exercise Physiology for hypermobility Evidence-Informed Care for Zebras 100% Hypermobility-Dedicated Team Industry-Leading Founder Tailored Management for Hypermobility Brand New Facility & Onsite Pilates Gym Disability-Friendly Facilities Neurodiverse, LGBTQIA+ Friendly Practice Learn More How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + "</a>"; }); Meet Our Team Meet your dedicated and empathetic team of professionals at Not Just Bendy Sharon Hennessey Founder & Principal Physiotherapist Marlisa Kwan Team Leader & Senior Physiotherapist Belinda Bruest Senior Physiotherapist Maria Yee Senior Physiotherapist & PhD Candidate Meet Our Team Our Affiliations Always Forget Your Exercises? We have A Free App! We understand that keeping up with your exercise routine can be challenging, especially when balancing a busy schedule. That’s why we’re excited to introduce our free PhysiApp client app – a convenient, user-friendly tool designed to help you stay on track with your physiotherapy exercises and achieve your health goals. Why Use PhysiApp? Perfect Form, Anytime, Anywhere Track Your Progress Online and Offline In-App Reminders to Stay Motivated Over 200 Special NJB Exercises for those with Hypermobility & EDS Learn More Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Public (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[13]