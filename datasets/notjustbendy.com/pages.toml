["https://www.notjustbendy.com/blog/exercise-physiology-for-hypermobility"]
title = "exercise physiology hypermobility"
description = "What Can the Not Just Bendy Hypermobility Services Exercise Physiologist Do for Me? Our Exercise Physiologist knows how complex hypermobility can be and how difficult it can be to exercise without creating a new injury. There are many different ways that they can help those with hypermobility or Ehlers-Danlos Syndrome. What is the Difference Between […]"
full_description = "What Can the Not Just Bendy Hypermobility Services Exercise Physiologist Do for Me? Our Exercise Physiologist knows how complex hypermobility can be and how difficult it can be to exercise without creating a new injury. There are many different ways that they can help those with hypermobility or Ehlers-Danlos Syndrome. You may choose to see our EP for setup, review and progression of your home program Advice for starting a gym-based program Supervised exercise in a gym setting including strength, weights, and muscle conditioning Clinical Pilates programs Rehabilitation programs for those with POTS/dysautonomia and/or fatigue Face to face, telehealth and home visits (depending on location & availability) Small group classes: Not Just Bendy – Balanced & StrongBlending Clinical Pilates with strength & conditioningFocus on working towards your functional goalsEveryone in the class has their own program: which can be a mix of clinical Pilates (matwork and equipment), strengthening with weights/bands, and safe stretching. Group size = 3 participants For information on class times please see https://notjustbendy.com/classes What is the Difference Between Physiotherapy and Exercise Physiology? Now that we have an Exercise Physiologist (EP) many clients ask us what the difference is between Physiotherapy and Exercise Physiology for hypermobility.Physiotherapy is a great place to start, especially during the early stages of your rehab journey and later for maintenance or any new concerns. Our physiotherapists are very skilled at assessing, diagnosing and managing injuries and musculoskeletal conditions, as well as helping to problem-solve other issues associated with Hypermobility & Ehlers-Danlos Syndrome.As time passes and your condition improves, when you are ready to take the next step in your rehab journey to increase your physical activity and exercise, Exercise Physiology for Hypermobility may be suited for you. Our EP, Avery, can also be very helpful for people who find it difficult to exercise in conventional sessions (e.g. gym or sports) without frequently injuring themselves. Accredited Exercise Physiologists are university-qualified, allied health professionals. The motto for Exercise Physiologists is “Exercise is Medicine.” In addition to exercise, they focus on creating behavior change, increasing physical activity and self-management. Your physiotherapist generally sees you in a treatment room whereas your Exercise Physiologist will usually treat you in a gym-based area of the clinic. Also, EPs do NOT use massage or hands-on mobilisations as part of their treatment the way physios do. During your initial session with the Exercise Physiologist they will discuss your current health, your goals, medical and exercise history. Depending on your goals, they can also assess your current exercise capacity, strength, endurance, fitness, as well as how you are moving. If you are an existing patient of a Not Just Bendy Physiotherapist, your physio will provide detailed communication about you and any recommended “do’s and don’ts” for your rehab program. At Not Just Bendy we work together as an interdisciplinary team through all stages of your rehab. Can I See Your Exercise Physiologist With My NDIS Plan or Medicare EPC? Absolutely you can. Exercise Physiology treatment comes under your Capacity Building funding. Even those with a diagnosis of social/emotional issues (who are often not funded for physiotherapy) will often have some funding for Exercise Physiology. We are also able to offer telehealth and – depending on availability – home visits. If you have a Medicare EPC (Enhanced Primary Care) or Chronic Disease Management plan you can see our Exercise Physiologist. Please make sure your GP marks your referral as “Exercise Physiology” and refers directly to “Not Just Bendy Hypermobility Services”. Please be aware that we do not bulk bill these care plans and a gap will be payable. What Is the Name of Your Exercise Physiologist? Avery Wu is an Accredited Exercise Physiologist and is our first Exercise Physiologist at Not Just Bendy Hypermobility Services. Avery Wu graduated from Queensland University of Technology in 2021 with a Bachelor of Clinical Exercise Physiology. Avery has an extensive Pilates background having completed a Diploma of Professional Pilates Instruction from PilatesITC in 2019. For the past 3 years she has been teaching clinical and group Pilates classes to clients of all ages and abilities, including at PhysioTec since 2020. In her experience as a Pilates instructor, Avery has worked with hypermobile clients through their rehabilitation as an interdisciplinary team with the physiotherapists from Not Just Bendy Hypermobility and other physiotherapy practices. To book an appointment please call 3123 4826 and ask for Not Just Bendy or email reception@notjustbendy.com"
author = "Sharon Hennessey"
