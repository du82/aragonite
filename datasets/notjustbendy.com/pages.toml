full_description = "Empowering Hypermobile Lives Through Transformative Care About Us Not Just Bendy Hypermobility At Not Just Bendy, we specialise in providing high quality Physiotherapy and Exercise Physiology services with a focus on Hypermobility Spectrum Disorders, Hypermobile – Ehlers Danlos Syndrome, and related conditions. We also provide care for the rarer variants of EDS and Marfan Syndrome. Our dedication and unique offerings set us apart. New Clients | Booking Enquiry Existing Clients | Book Appointment Evidence-Informed Care for Zebras 100% Hypermobility-Dedicated Team Industry-Leading Founder Tailored Management for Hypermobility Brand New Facility & Onsite Pilates Gym Disability-Friendly Facilities Neurodiverse, LGBTQIA+ Friendly Practice Learn More Our Services At Not Just Bendy, we understand the unique challenges faced by individuals with Ehlers-Danlos Syndrome (EDS) and Hypermobility Spectrum Disorders (HSD). As Brisbane’s leading hypermobility physiotherapy clinic, we offer expert, compassionate care tailored to support a diverse range of clients—from individuals managing significant daily disabilities to working professionals and recreational athletes. We cater to all ages, from school children to adults, helping each client achieve their best quality of life. Our Services The EDS Society Centre and Network of Excellence Award We are thrilled to announce that our clinic has been awarded the prestigious Centre and Network of Excellence (CNE) Award by The Ehlers-Danlos Society. We are exclusively the only centre in Brisbane to receive this honour, recognising our commitment to providing exceptional care for individuals with Ehlers-Danlos Syndrome (EDS) and Hypermobility Spectrum Disorders (HSD). Learn More Want To Learn More From Sharon Hennessey About Hypermobility? Sharon’s ground-breaking hypermobility educational courses are launching soon – sign up now to know when the courses go live! Join the wait list to be the first to access exclusive video content, tailored for health professionals, patients, carers, and anyone seeking to better understand hypermobility. Join the Waitlist More Info Discover The Not Just Bendy Experience Learn More Meet Our Team Meet your dedicated and empathetic team of professionals at Not Just Bendy Sharon Hennessey Founder & Principal Physiotherapist Marlisa Kwan Team Leader & Senior Physiotherapist Belinda Bruest Senior Physiotherapist Maria Yee Senior Physiotherapist & PhD Candidate Meet Our Team Always Forget Your Exercises? We have A Free App! We understand that keeping up with your exercise routine can be challenging, especially when balancing a busy schedule. That’s why we’re excited to introduce our free PhysiApp client app – a convenient, user-friendly tool designed to help you stay on track with your physiotherapy exercises and achieve your health goals. Why Use PhysiApp? Perfect Form, Anytime, Anywhere Track Your Progress Online and Offline In-App Reminders to Stay Motivated Over 200 special NJB Exercises for those with Hypermobility & EDS Learn More Our Affiliations “At Not Just Bendy, hypermobility is more than flexibility. We offer holistic care that builds strength, confidence, and resilience to help you reach your goals.”Sharon Hennessey – Physiotherapist & Founder of Not Just Bendy Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Pub