description = "Our therapists understand how complicated being hypermobile can be, and the need to balance strength with rest and safe stretching. Find Your Balance. Our classes run for up to 55 minutes. During your class, you will be completing your individually prescribed exercise program with guidance and supervision from our Physiotherapist. You can expect to complete […]"
full_description = '''Exercise Classes for Hypermobility Class Schedule Let us know if you can’t make the following class sessions and would prefer to have another time scheduled! Enquire MON Balanced and Strong 5.30 PM Register TUE Balanced and Strong 10.30AM 5.30 PM Register WED Balanced and Strong 1.30PM 5.00PM Register THU Balanced and Strong 5.00PM Register FRI Balanced and Strong 4.30 PM 5.30PM Register Our therapists understand how complicated being hypermobile can be, and the need to balance strength with rest and safe stretching. Get Started! Find Your Balance. Our classes run for up to 55 minutes. During your class, you will be completing your individually prescribed exercise program with guidance and supervision from our Physiotherapist. You can expect to complete a combination of resistance training and Pilates-based exercise, using various machines in our well-equipped gym. Find your Strength. Resistance training helps increase muscle strength by working against a force, such as your body-weight, an exercise band or dumbbells. Meanwhile Pilates-based exercises focus on control, stability, and mobility of the muscles.These exercises can be performed on specialized equipment such as a reformer. What are the classes like? Small Group, Individualised Programs Tailored for those with hypermobility Blending Clinical Pilates with strength & conditioning Focused on working towards your functional goals Group size = max. 4 participants Supervised by a qualified Physiotherapist or Exercise Physiologist Pre-Assessments A pre-assessment with one of our Physiotherapists/exercise physiologists is required prior to attending classes. For clients new to the clinic a pre-assessment (over two appointments) with one of our therapists is required prior to commencing classes. For pre-existing clients of the clinic a session with the therapist instructing the class is still required prior to commencement. During these appointments we will learn about your medical history and goals, introduce you to the gym space, and create an individualized program. As your safety is our priority, one-to-one sessions may be necessary before classes can be commenced. How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + "</a>"; }); Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Public (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[13]='TOPICS';ftypes[13]='text';fnames[3]='LBIRTHDAY';ftypes[3]='date';fnames[4]='SBIRTHDAY';ftypes[4]='birthday';fnames[5]='LAPPTDATE';ftypes[5]='date';fnames[6]='LASTCASE';ftypes[6]='text';fnames[7]='LASTPRAC';ftypes[7]='text';fnames[8]='LASTAPPTNA';ftypes[8]='text';}(jQuery));var $mcj = jQuery.noConflict(true);'''
