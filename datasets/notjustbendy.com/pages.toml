["https://www.notjustbendy.com/jobs"]
title = "careers"
description = "Apply for a career with us at Not Just Bendy"
full_description = "Careers Not Just Bendy Hypermobility Services, is looking for our new physiotherapist – could you be our new unicorn zebra superstar? We are an industry leader with all our Physiotherapists and our Exercise Physiologist focused solely on Hypermobility Spectrum Disorder, Hypermobile-Ehlers Danlos Syndromes and their best management. Not Just Bendy Hypermobility Services (Eight Mile Plains, Brisbane QLD), has been created due to a real need in the community to understand, assess and manage the complexity of problems associated with Hypermobility Spectrum Disorder and the Ehlers-Danlos Syndromes. We are industry leader with all our Physiotherapists and our Exercise Physiologist focused solely on this chronic, complex condition and its best management. Hypermobility is a very misunderstood condition in the general medical community, and our therapists have found their calling – educating, empowering, and rehabilitating our mostly female clients. We are an industry leader in Hypermobility in Brisbane, with all our Physiotherapists and our Exercise Physiologist focused solely on this chronic, complex condition and its best management. We have a large referral base and work closely with a large network of medical professionals across Queensland. Not Just Bendy is very busy and is growing quickly (currently adding an extension), located in Eight Mile Plains. We are a tight nit team who share a passion and would love you to join us. Join Us Now! Evidence-Informed Care for Zebras 100% Hypermobility-Dedicated Team Industry-Leading Founder Tailored Management for Hypermobility Brand New Facility & Onsite Pilates Gym Disability-Friendly Facilities Neurodiverse, LGBTQIA+ Friendly Practice Learn More Benefits of Joining Us Work in a new and modern physiotherapy practice custom built for hypermobility – large private rooms with low allergens New extension with large gym including weights, cardio and pilates equipment Friendly, supportive workplace Small team environment Newer practice open to adjustments in work flow efficiencies and a rock star practice manager and reception team to back you up Take your time and give you clients what they really need with many clients regularly attending for one hour appointments Ongoing professional mentoring from experienced physiotherapists with extensive experience with complex hypermobility, local joint rehabilitation, and problem solving case management Work in a practice that is committed to supporting our team’s professional development with regular in-services, mentoring and a training budget for external courses Opportunity to work flexibly with telehealth and home visit work also available if desired and also flexibility to fit around your life Variety of presentations and high focus on exercise and rehabilitation means less stress on your own body compared to other musculoskeletal practices Knowledge about hypermobility often encourages those who are hypermobile to work at the practice – this is welcomed Access to Pilates rehab gym outside of work hours for your own strengthening program Responsibilities & Requirements Responsibilities: Conduct functional and musculoskeletal assessments of patients’ physical abilities Utilise manual hands-on therapy and targeted exercises to manage patients’ pain, rehabilitation and recovery Develop and implement personalised treatment plans to help clients improve their strength, flexibility, and overall movement Provide education and support to help clients understand their conditions and manage their symptoms long-term Maintain accurate client records and submit reports as required Liaising with the multi-disciplinary team and NDIS for client plan reviews is also needed. Requirements: Bachelor’s degree in physiotherapy (or equivalent allied health qualification) or higher qualification Our unicorn would have five years of post-graduate experience in Musculoskeletal physiotherapy although those with less experience are still welcome to apply. Current AHPRA unrestricted registration (supervision considered for exceptional candidates) Professional Indemnity Insurance Exceptional communication and interpersonal skills. Ability to work independently and as part of a team. Detail-oriented, analytical, and creative problem-solving abilities Experience with treating patients with hypermobility is preferred but not essential. Some interest in the areas of chronic pain, rehabilitation, Pilates or women’s health is looked on favorably. Extensive training will be provided upon commencement of position Join Us Now! More About Us We are a well-known physiotherapy practice specializing in hypermobility related issues, and we are expanding our team of health care professionals to meet growing demand. Our books are full to overflowing and we have a full caseload waiting for you. Treating this caseload is a challenge. Think you know everything physio has to offer and feeling stuck in a rut? New to the area and wanting to enhance and diversify your skills? This job will blow your mind at what as physiotherapists we can achieve and become. For the right candidate, we offer extensive training with our practice principle Sharon Hennessey and other senior members of our team. There is room to grow in this role over time and develop your own special interest niche. Our mission is to provide high quality care for those with symptomatic hypermobility and Ehlers-Danlos Syndrome. Does this sound like it is something that physios generally treat well? That certainly is not what our clients are telling us. They are frustrated by the lack of integrated care and long term management offered by many in the community. This is the gap that we provide. We provide non-judgemental care, without discrimination but also endeavour to deliver a friendly and personal approach to develop long term relationships with our clients. It is not unusual to hear lots of laughter radiating out of our treatment rooms! We receive referrals from client support groups, word of mouth but also hundreds of GPs and a huge range medical specialist consultants (pain, genetics, rheumatology, endocrinology, heamatology, orthopaedics). We also provide referrals and co-treat with other physiotherapists around Australia. As our new physiotherapist, you will be responsible for assessing and treating clients with mobility issues associated with hypermobility. You will also provide education and support to our clients to ensure they are empowered to manage their symptoms long-term. Full time staff have a huge earning potential with base wage, commission bonus and training budget included. Although a full-time role with a flexible working schedule is preferred, those who want part-time work are welcome to apply, as we can accommodate personal commitments. If this sounds like we are the right practice for you please reach out for discussion. Remember we have a case load ready for you. Inquires, cover letter or resumes to be sent to Sharon Hennessey via e-mail. Want To Learn More From Sharon Hennessey About Hypermobility? Sharon’s ground-breaking hypermobility educational courses are launching soon – sign up now to know when the courses go live! Join the wait list to be the first to access exclusive video content, tailored for health professionals, patients, carers, and anyone seeking to better understand hypermobility. Join the Waitlist More Info Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Public (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[13]='TOPICS';ftypes[13]='text';fnames[3]='LBIRTHDAY';ftypes[3]='date';fnames[4]='SBIRTHDAY';ftypes[4]='birthday';fnames[5]='LAPPTDATE';ftypes[5]='date';fnames[6]='LASTCASE';ftypes[6]='text';fnames[7]='LASTPRAC';ftypes[7]='text';fnames[8]='LASTAPPTNA';ftypes[8]='text';}(jQuery));var $mcj = jQuery.noConflict(true);"
