["https://www.notjustbendy.com/paediatric-hypermobility-services"]
title = "Paediatric hypermobility"
description = "At Not Just Bendy, we understand that children with hypermobility require specialised care tailored to their unique developmental needs. Our Paediatric Hypermobility Services are designed to provide comprehensive physiotherapy and exercise physiology solutions aimed at supporting children and adolescents in managing hypermobility-related challenges and optimising their overall well-being. Our Paediatric Services Age Range: We provide […]"
full_description = '''Paediatric Hypermobility Services At Not Just Bendy, we understand that children with hypermobility require specialised care tailored to their unique developmental needs. Our Paediatric Hypermobility Services are designed to provide comprehensive physiotherapy and exercise physiology solutions aimed at supporting children and adolescents in managing hypermobility-related challenges and optimising their overall well-being. Our Paediatric Services Age Range: We provide services for children attending mainstream school, from pre-prep (kindergarten) age and above. Key Features of Our Paediatric Hypermobility Services: Specialised Assessment: Our experienced physiotherapists conduct thorough assessments to evaluate the extent of hypermobility and its impact on your child’s musculoskeletal system, motor skills, and functional abilities. Tailored Treatment Plans: Based on the assessment findings, we develop personalised treatment plans that address your child’s specific needs and goals. These plans may include a combination of therapeutic exercises, manual therapy techniques, postural training, and ergonomic recommendations. Family-Centred Approach: We believe in involving families as active participants in the treatment process. We provide education and guidance to parents and caregivers on how to support their child’s physical development and manage hypermobility-related symptoms effectively. Fun and Engaging Sessions: We create a supportive and enjoyable environment for children to participate in therapy sessions. Our therapists incorporate play-based activities, games, and exercises that are age-appropriate and designed to keep your child motivated and engaged throughout the treatment process. Collaborative Care: We work closely with Occupational Therapists, Podiatrists, Speech Therapists, Pediatricians, Orthopaedic Specialists, and other healthcare professionals involved in your child’s care to ensure quality, holistic care, and optimal treatment outcomes. Our Paediatric Hypermobility Services Across Various Developmental Phases: School Age: In school-age children, hypermobility can impact physical activities, such as school and sports participation, and recreational play. Our therapists work with children and their teachers or coaches to enhance their motor skills, balance, and proprioception through targeted exercises and activities. We provide guidance on injury prevention strategies and ergonomic modifications to promote safe and active participation in school and extracurricular activities. Adolescence: During adolescence, hypermobility-related symptoms, such as joint pain and instability, may become more pronounced, especially during periods of rapid growth. Our goal is to empower adolescents with the knowledge and skills to manage their hypermobility effectively. We offer specialised exercise programs focused on strength training, flexibility, and joint stability to improve functional abilities and reduce the risk of injury. Transition to Adulthood: As adolescents transition into adulthood, the management of hypermobility becomes increasingly important for long-term health and well-being. Our team provides ongoing support and guidance to help young adults navigate the challenges associated with hypermobility, including joint protection strategies, lifestyle modifications, and self-management techniques. We empower individuals to lead active and fulfilling lives while managing their hypermobility effectively. Through our Paediatric Hypermobility Services, we are committed to providing compassionate and expert care that meets the unique needs of children and adolescents with hypermobility at every stage of development. Contact us today to learn more about how we can support your child’s health and well-being through our specialised paediatric hypermobility services. Whether your child experiences joint pain, instability, or motor coordination difficulties associated with hypermobility, our Paediatric Hypermobility Services are here to provide compassionate and expert care every step of the way. Although it is important to note that our excellence lies in hypermobility based management of children. We will refer on to specialist paediatric clinics for complex cases which we feel need more specific paediatric physiotherapy expertise. Take the Next Step Early screening and preventive measures can make a significant difference in managing these conditions effectively. Contact us today to learn more about how we can support your child’s health and well-being through our specialised paediatric hypermobility services. Learn More To learn more about how our team can help, visit these pages: Physiotherapy for hypermobility Exercise Physiology for hypermobility Evidence-Informed Care for Zebras 100% Hypermobility-Dedicated Team Industry-Leading Founder Tailored Management for Hypermobility Brand New Facility & Onsite Pilates Gym Disability-Friendly Facilities Neurodiverse, LGBTQIA+ Friendly Practice Learn More How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + "</a>"; }); Meet Our Team Meet your dedicated and empathetic team of professionals at Not Just Bendy Sharon Hennessey Founder & Principal Physiotherapist Marlisa Kwan Team Leader & Senior Physiotherapist Belinda Bruest Senior Physiotherapist Maria Yee Senior Physiotherapist & PhD Candidate Meet Our Team Our Affiliations Always Forget Your Exercises? We have A Free App! We understand that keeping up with your exercise routine can be challenging, especially when balancing a busy schedule. That’s why we’re excited to introduce our free PhysiApp client app – a convenient, user-friendly tool designed to help you stay on track with your physiotherapy exercises and achieve your health goals. Why Use PhysiApp? Perfect Form, Anytime, Anywhere Track Your Progress Online and Offline In-App Reminders to Stay Motivated Over 200 Special NJB Exercises for those with Hypermobility & EDS Learn More Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Public (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[13]='TOPICS';ftypes[13]='text';fnames[3]='LBIRTHDAY';ftypes[3]='date';fnames[4]='SBIRTHDAY';ftypes[4]='birthday';fnames[5]='LAPPTDATE';ftypes[5]='date';fnames[6]='LASTCASE';ftypes[6]='text';fnames[7]='LASTPRAC';ftypes[7]='text';fnames[8]='LASTAPPTNA';ftypes[8]='text';}(jQuery));var $mcj = jQuery.noConflict(true);'''
