title = "Meet the team"
description = "Our Physiotherapists Please note we are currently running a waiting list for new physiotherapy clients until we have consistent availability.   SHARON HENNESSEY Founder & Principal Physiotherapist BOOKS CLOSED – NOT SEEING NEW PATIENTS Sharon has had a passion for treating hypermobility throughout her 24 years as a physiotherapist.Sharon has skills in rehabilitation, problem solving […]"
full_description = '''Meet the Team Our Physiotherapists Please note we are currently running a waiting list for new physiotherapy clients until we have consistent availability. SHARON HENNESSEY Founder & Principal Physiotherapist BOOKS CLOSED – NOT SEEING NEW PATIENTS Sharon has had a passion for treating hypermobility throughout her 24 years as a physiotherapist.Sharon has skills in rehabilitation, problem solving and management of road blocks that can derail rehabilitation. Read more… MARLISA KWAN Team Leader & Senior Physiotherapist BOOKS CLOSED – NOT SEEING NEW PATIENTS Marlisa is a dedicated physiotherapist who has assisted over 200 clients with hypermobility. Marlisa is commited to staying at the forefront of EDS research & management strategies. Marlisa’s practice philosophy is personalised, hoslitic care. Read more… BELINDA BRUEST Senior Physiotherapist Belinda is an experienced physiotherapist who has a broad knowledge base including a passion for using Pilates as a tool for rehabilitation. Belinda has a special interest in spinal issues of the back and also has experience in rehabilitation of ballet and dance injuries. Read more… MARIA YEE Senior Physiotherapist & PhD Candidate Maria first developed a curiosity for hypermobility while studying in Physiotherapy school. Her ex-ballet classmates who were then training to be professional dancers were reporting patella and shoulder dislocations, and she got busy practicing strapping their joints up. Read more… ELISSA MAK Senior Physiotherapist Elissa holds a Bachelor of Exercise Science as well as a Masters of Physiotherapy, and has experience with a diverse caseload of clients. She has an encouraging, caring, patient-centered approach, and caters her treatments towards each individual’s personal goals. Read more… ARIEL LEE Senior Physiotherapist Ariel graduated from the University of Queensland in 2018 and is known for her patient-centric approach. She brings a wealth of expertise to her practice in advanced techniques in Dry Needling, managing headache, chronic pain, and vestibular conditions etc. Read more… LAUREL HOPPIS Associate Physiotherapist Laurel holds a Bachelor of Applied Exercise Science as well as a Doctor of Physiotherapy. She has a genuine passion for listening to patient’s stories and providing individualist treatment programs for all her patients. She also has an infectious laugh! Read more… GLORIA KANG Associate Physiotherapist Gloria has experience in diverse areas of physiotherapy including musculoskeletal therapy, women’s health, orthopedics and surgical support. She is dedicated to enhancing patients’ lives through evidence-based practice and specialized care. Read more… GUN “KEVIN” KANG Associate Physiotherapist Kevin’s journey into physiotherapy started with his own frustrations as a patient, driving him to pursue better care for others. He specialises in spinal physiotherapy and hypermobility conditions, with over five years of experience treating complex cases. Read more… KEYI CHENG Emerging Physiotherapist Keyi holds a Bachelor of Science in Biology and a Master of Physiotherapy Studies degree. With her personal experience of hypermobility, she is passionate about using the knowledge she has to provide individualised care for more patients with hypermobility. Read more… Our Exercise Physiologist AVERY WU Exercise Physiologist Avery holds a Bachelor of Clinical Exercise Physiology as well as a Diploma of Professional Pilates Instruction, and has experience working with hypermobility and its associated conditions. Avery’s ultimate goal is to help her patients live a more fulfilling life doing the things they enjoy. Read more… Our Wonderful Support Team MICHELLE Business Manager Michelle, our Business Manager and passionate solutionist! With over a decade of experience in Office Management and Consulting, she is dedicated to helping our team and Not Just Bendy excel. She thrives on enhancing our workplace culture, streamlining operations, and guiding our business toward its goals. JENNIFER Practice Manager Meet Jen, our powerhouse Practice Manager at Not Just Bendy! In addition to looking after our patients and staff, Jen keeps the physiotherapy clinic running like a well-oiled machine! While she may not seek the spotlight, Jen’s efforts make all the difference in delivering top-notch care to our patients. SUE Senior Receptionist & Finance Officer Affectionately known as the “Mother Hen”, Sue has a knack for nurturing our patients and making them feel a part of our big, happy family. A teacher in a former life, Sue’s extensive knowledge and experience has made her a pro at keeping things running smoothly. Chaos doesn’t stand a chance when Sue is on duty! JAY Receptionist Jay takes pride in his work ethic and has a genuine desire to help our patients (and the rest of the staff!). Our resident ‘cool kid’ and tech guru, Jay is always the first to put up his hand to assist where needed. Jay’s energetic and helpful nature makes him the rockstar of our team. ATHENA Receptionist Athena holds a Bachelor of Exercise and Sport Science from UQ and has experience in customer service, allied health, and the sports industry. She enjoys connecting with people from diverse backgrounds and fostering inclusive, supportive environments. How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + "</a>"; }); Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights 