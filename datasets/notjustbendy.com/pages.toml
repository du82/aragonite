description = "Specialized care for hypermobility. Our team, led by expert Sharon Hennessey, provides evidence-informed treatment tailored to your needs."
full_description = '''Help for Hypermobility 100% Hypermobility-Dedicated Therapy Team Our team is uniquely trained and entirely dedicated to understanding, caring and providing help for hypermobility. Many of our professionals have personal lived experiences with hypermobility, enhancing our capacity to provide quality and specialised care with genuine empathy. This focus ensures that every treatment plan is not only informed by the latest research but is also deeply empathetic and tailored to your specific needs. Evidence-Based Care & Industry-Leading Founder Led by Sharon Hennessey, a leading expert in Australia in the field of physiotherapy for hypermobility, our clinic bases all treatments on the most current, evidence-based practices. This commitment ensures that you receive the most effective care possible. Exciting news! Sharon is launching a brand-new hypermobility educational course soon. Want to be the first to know when it launches? Join the waitlist below! Join Waitlist! More Info Tailored Help for Hypermobility Every patient’s experience of hypermobility is unique. That’s why we offer tailored management plans that are specifically designed to address the individual challenges and goals of each patient. Discover all the services we offer here. Free Access to 200+ NJB Curated Hypermobility Exercises to help At Not Just Bendy, we have specially recorded over 200 exercises specifically for individuals with hypermobility. These exercises have been developed over time based on our extensive experience working with those who are hypermobile. With PhysiApp, you have access to the exercises developed by Not Just Bendy anytime you need them. Learn more about it here. Ongoing Commitment to Hypermobility Research Our founder, Sharon Hennessey, regularly presents at talks with other health professionals and patients and actively contributes to research on hypermobility. A list of her research publications and research can be found here. Our staff consistently attends conferences and talks to stay updated on the latest developments in hypermobility. Our Senior Physiotherapist Maria is pursuing her PhD on hypermobility in dancers at the University of Queensland. You can learn more about her research and how to participate here. Exclusive Recognition by The Ehlers-Danlos Society Not Just Bendy is the only clinic in Brisbane to have been awarded the prestigious Centre of Excellence award by The Ehlers-Danlos Society. This recognition reflects our exceptional commitment to providing specialised, high-quality care for individuals with hypermobility and related conditions. Our clinic stands out for its dedication to excellence, innovative treatment approaches, and unwavering support for our patients. This accolade is a testament to the outstanding work of our team and our relentless pursuit of the best possible outcomes for our clients. To learn more, click here. Rich Educational Resources & Expertise on Hypermobility At Not Just Bendy, we are dedicated in providing solutions from our rich pool of educational resources to help manage your hypermobility-related symptoms. Our approach includes: • Practical advice for managing stiffness • Tips for coping with everyday challenges • Guidance on bracing and taping techniques for joint support • Pain management strategies • Support for non-musculoskeletal symptoms like POTS, dysautonomia, and fatigue • Take-home resources with exercise guides and self-care tips • Hands-on treatments, including massage, joint mobilisation, and dry needling for pain relief and improved mobility Our comprehensive approach ensures you have the tools and support needed to effectively manage your symptoms. Integrating Innovative Technology to Enhance Hypermobility Care At our clinic, we leverage innovative technology to provide advanced care for those with hypermobility. Our approach includes: • Posture and Functional Movement Assessments: We use video analysis apps to evaluate posture and movement patterns, helping identify areas that need improvement for optimal function and pain relief. • Real-Time Ultrasound Imaging: This technology allows us to visualise muscle activation during treatment, helping clients learn to recruit deep muscle support effectively for improved stability. • Neuromuscular Electrical Stimulation (NMES): Using Compex muscle stimulators, we stimulate muscles to enhance strength and function, supporting better neuromuscular control and rehabilitation outcomes. By integrating these cutting-edge technologies, we empower clients to achieve better movement quality, strength, and overall management of their hypermobility symptoms. Brand New Facility & Onsite Pilates Gym We take pride in our state-of-the-art and custom-built facility at Eight Mile Plains on the Southside of Brisbane, designed with your comfort and needs in mind. Our onsite Pilates gym is equipped with the latest equipment, helping you strengthen and stabilise your body in a beautiful and supportive environment. Neurodiversity-Friendly Our practice employs neurodivergent individuals in our team. We welcome and support individuals who are neurodivergent in our care. We strive to understand the perspectives of those with ADHD, Autism, and other neurodivergent people and we respect the diverse communication styles and needs of our clients. Have a chat (or text or email) with our team to discuss how we can better accommodate your neurodivergent needs. Disability-Friendly Facilities Our clinic is fully accessible and designed to be disability-friendly. We offer lift access to our practice, and have designated disability parking available in the building. If you require further assistance or have specific needs, please contact our friendly reception team prior to your arrival for more information. There is a disability accessible toilet just outside the door to our practice. Our floors are smooth and our corridors are wide. LGBTQIA+ Friendly Our clinic is a safe and welcoming space for LGBTQIA+ individuals, providing respectful and inclusive care to all patients. Allergy and Sensory-Sensitive Practice We recognize the importance of a safe environment for those with allergies and sensory sensitivities. Our practice adheres to strict cleanliness protocols and can accommodate specific allergy-related needs upon request. We also have dimmable lights and block our blinds in our private treatment rooms to accomodate your visual sensory needs. We stock various brands of tapes and accessories to cater to people with various skin sensitivities. Please let our friendly reception team know prior to your arrival how we can better accommodate your allergy and sensory requirements. Hypermobility-Friendly Products We offer a range of products specifically designed for individuals with hypermobility. Explore our products here to find tools and aids that can support your treatment and management plan. Location Conveniently located close to both the Gateway Motorway and SE Freeway we see clients from all over SE Queensand and Northern NSW. We also offer telehealth services and our clients who travel to see us often find a mixture of telehealth and in person visits an excellent approach. Directions to our clinic and parking information can be found here. How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; var email = user + "@" + domain; document.getElementById("email-address").innerHTML = '<a href="mailto:' + email + '">' + email + "</a>"; }); Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Public (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[13]='TOPICS';ftypes[13]='text';fnames[3]='LBIRTHDAY';ftypes[3]='date';fnames[4]='SBIRTHDAY';ftypes[4]='birthday';fnames[5]='LAPPTDATE';ftypes[5]='date';fnames[6]='LASTCASE';ftypes[6]='text';fnames[7]='LASTPRAC';ftypes[7]='text';fnames[8]='LASTAPPTNA';ftypes[8]='text';}(jQuery));var $mcj = jQuery.noConflict(true);'''
