description = "At Not Just Bendy, we are proud to be recognised for our commitment to clinical & research excellence, as well as the dedicated care we provide for people with hypermobility and related conditions. EDS Society Centre of Excellence Award We are thrilled to announce that our clinic has been awarded the prestigious Centre of Excellence […]"
full_description = '''Our Awards At Not Just Bendy, we are proud to be recognised for our commitment to clinical & research excellence, as well as the dedicated care we provide for people with hypermobility and related conditions. EDS Society Centre of Excellence Award We are thrilled to announce that our clinic has been awarded the prestigious Centre of Excellence (CNE) Award by The Ehlers-Danlos Society. We are proud to be the only practice in Brisbane to receive this honour, recognizing our commitment to providing exceptional care for individuals with Ehlers-Danlos Syndrome (EDS) and Hypermobility Spectrum Disorders (HSD). Learn more about our dedication to exceptional client care and the rigorous process of qualifying for this award. More Info Allied Health Awards We are delighted to share that our clinic has been honored with two prestigious accolades at the 2024 Australian Allied Health Awards: the Physiotherapist of the Year and the Allied Health Adult Team Excellence awards. We extend our heartfelt gratitude to our patients, partners, and the broader community for their unwavering support. These achievements inspire us to continue delivering exceptional care and advancing the standards of allied health services. Click on the button below for more info! More Info Evidence-Informed Care for Zebras 100% Hypermobility-Dedicated Team Industry-Leading Founder Tailored Management for Hypermobility Brand New Facility & Onsite Pilates Gym Disability-Friendly Facilities Neurodiverse, LGBTQIA+ Friendly Practice Learn More Our Affiliations How can we help? We’re here to answer any questions you may have. We prefer online contact whenever possible – reach out to us and we’ll respond as soon as we can. Tel: (07) 3123 4826 Fax: (07) 3532 8704 Email: Address: Freeway Office Park 2Building 9. Level 12728 Logan RdEight Mile Plains QLD 4113 Directions & Parking document.addEventListener("DOMContentLoaded", function () { var user = "reception"; var domain = "notjustbendy.com"; 