["https://www.notjustbendy.com/physiotherapy"]
title = "Hypermobility Physiotherapy Brisbane"
description = "Not Just Bendy is an award-winning hypermobility physiotherapy clinic. We provide comprehensive care with a team of expert therapists."
full_description = "Hypermobility Physiotherapy Brisbane Not Just Bendy – Our Unique Approach Not Just Bendy Hypermobility Services is a leading physiotherapy clinic specialising in the assessment and management of hypermobility, including Ehlers-Danlos Syndrome (EDS) and Hypermobility Spectrum Disorders (HSD). Our clinic was established to address a crucial need in the community for expert physiotherapy care focused on the complexities of hypermobility. With a team of physiotherapists who are extensively trained in both general physiotherapy and hypermobility-specific care, we proudly offer the first custom-built physiotherapy facility in Australia designed specifically for hypermobile individuals. At Not Just Bendy, we understand the unique challenges faced by individuals with hypermobility. As Brisbane’s leading hypermobility physiotherapy clinic, we provide comprehensive care tailored to meet the needs of clients ranging from working adults to children, adolescents, and recreational athletes. Our clinic offers a welcoming, inclusive environment, designed to accommodate neurodivergent and LGBTQI+ clients. With private treatment rooms, a well-equipped rehabilitation gym, and features like dimmable lighting for those with sensitivities, we ensure a comfortable space for all. Additionally, our facility is free of dust and mould, making it ideal for clients with allergies.­­­ We also provide a range of products sourced from around the world to support hypermobility management, including braces, self-massage tools, and zebra-patterned merchandise. Why Physiotherapy Can Help? Physiotherapy plays a crucial role in managing and alleviating the symptoms associated with Ehlers-Danlos Syndrome (EDS) and Hypermobility Spectrum Disorders (HSD). These conditions often lead to joint instability, chronic pain, and fatigue, significantly impacting daily activities and quality of life. Without proper management, hypermobility can increase the risk of injury and further complications. At Not Just Bendy, we use evidence-informed techniques to deliver targeted physiotherapy interventions specifically designed to: Enhance joint stability: Strengthening the muscles around hypermobile joints reduces excessive movement, providing better support and lowering the risk of dislocations or subluxations. Research shows that proprioception and strength training are beneficial in reducing joint and spinal pain, improving movement control, and enhancing quality of life in both paediatric and adult populations. Increase strength: Building muscle strength is key to improving overall function and reducing strain on joints, helping you move with more control and confidence. Exercise therapy is considered a cornerstone of management, addressing physical impairments and improving overall strength and mobility. Improve mobility: Our interventions focus on maintaining or improving the range of motion, ensuring you can move freely without pain or discomfort. Reduce the risk of injury: By addressing joint instability and strengthening muscles, our physiotherapy programs help prevent injuries common in hypermobile individuals. In addition to these benefits, learning to self-manage subluxations and dislocations can reduce the need for emergency visits and prevent unnecessary medication use. Proper understanding of body mechanics and ergonomics can minimize physical stress, and the use of external joint support such as braces and splints can protect both large and small joints during functional or recreational activities. Whether you’re struggling with day-to-day activities, managing chronic fatigue, or trying to stay active in sports, physiotherapy can provide the support and care needed to improve your overall function and quality of life. Our Physiotherapy Services for Hypermobility At Not Just Bendy, we take a holistic approach to treating hypermobility, offering a wide range of physiotherapy services designed to meet the specific needs of the hypermobile community, including: Personalised & Group-Based Exercise Programs: Designed to strengthen and stabilise joints while improving overall fitness and mobility. Learn more about our group exercise classes here. Pain Management Strategies: Techniques to help alleviate pain through therapeutic exercises, manual therapy, and self-management education. Joint Protection Advice: Guidance on protecting joints during daily activities and sports to prevent injury. Paediatric Physiotherapy: Age-appropriate care tailored to the needs of children and adolescents with hypermobility. We also provide education and resources to help clients manage their condition effectively, covering topics such as: Understanding how hypermobility affects daily life. Safe techniques for improving joint stability and muscle strength. Strategies for managing fatigue and energy levels. Modifying activities to reduce joint strain and prevent injury. Latest research and strategies for living well with EDS and hypermobility. Additional Services We Offer We offer a broad suite of additional services to support our clients: Screening & Prevention Assessments: Early identification of musculoskeletal issues to prevent further complications. Posture and Functional Movement Assessments: Comprehensive evaluations of movement patterns to address pain or joint instability. Muscle Retraining: Using video analysis, real-time ultrasound, and neuromuscular electrical stimulation (NEMS) to build muscle strength and support joints. Hands-on Techniques: Massage, joint mobilisation, and dry needling to alleviate pain and improve function. Collaboration with Healthcare Teams: Ensuring coordinated care with your broader healthcare team. Management of Non-Musculoskeletal Symptoms: Advice for associated conditions like POTS/dysautonomia and Mast Cell Activation Syndrome (MCAS). Who We Serve We provide expert care for a diverse range of clients: Dancers: Providing conditioning and rehabilitation programs specifically for hypermobile dancers. Adults: Helping manage symptoms within daily life and professional activities. Children and Adolescents: Offering age-appropriate care that supports growth and development while effectively managing symptoms. Sports Enthusiasts: Focusing on injury prevention, performance enhancement, and rehabilitation for hypermobile athletes. When to Seek Help If you or someone you know is struggling with symptoms related to EDS or hypermobility, early physiotherapy intervention can prevent complications and improve function. At Not Just Bendy, we offer comprehensive assessments that go beyond standard physiotherapy, ensuring a holistic approach to care for hypermobile clients. What to Expect in Your Physiotherapy Sessions Before your first appointment, you’ll receive an online questionnaire to help us understand your goals and condition in detail. Initial Assessment (75 minutes): Pre-Appointment Review: We review your questionnaire before the session to gain insights into your condition. In-Person Assessment: We discuss your main concerns and how hypermobility affects your body. A physical assessment begins if time allows. Post-Session Documentation: We document your treatment plan and next steps, which may include a letter to your referring doctor. Second Appointment (60 minutes):This session completes your full assessment, provides education, trials any products or bracing, and begins your treatment plan, including hands-on therapy and exercise prescription. Ongoing Appointments:Subsequent sessions are personalised based on your progress, and appointments range from 30-60 minutes, depending on your needs. At Not Just Bendy, we pride ourselves on providing expert physiotherapy care for hypermobile individuals. Our patient-centred approach ensures that you are supported every step of the way, from your initial assessment through your ongoing treatment plan. Contact us today to learn how we can help you manage hypermobility and thrive. Evidence-Informed Care for Zebras 100% Hypermobility-Dedicated Team Industry-Leading Founder Tailored Management for Hypermobility Brand New Facility & Onsite Pilates Gym Disability-Friendly Facilities Neurodiverse, LGBTQIA+ Friendly Practice Learn More Bookings Select from the options below to book an appointment with us: New Clients Existing Clients We are located on the south-side of Brisbane, Queensland, Australia. We are available for face-to-face and telehealth (online) consults for residents of Australia. Our Affiliations Always Forget Your Exercises? We have A Free App! We understand that keeping up with your exercise routine can be challenging, especially when balancing a busy schedule. That’s why we’re excited to introduce our free PhysiApp client app – a convenient, user-friendly tool designed to help you stay on track with your physiotherapy exercises and achieve your health goals. Why Use PhysiApp? Perfect Form, Anytime, Anywhere Track Your Progress Online and Offline In-App Reminders to Stay Motivated Over 200 Special NJB Exercises for those with Hypermobility & EDS Learn More Join Our Hypermobility Community! Stay up to date with hypermobility community news, the latest research, expert insights and practical tips for managing hypermobility and EDS. We respect your time and privacy – no spam, just valuable content! #mc_embed_signup{background:#fff; false;clear:left; font:14px Helvetica,Arial,sans-serif; width: 400px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address *First Name *Last Name Which newsletter group would you like to join? Health ProfessionalsPatients, Carers and General Public (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[13]='TOPICS';ftypes[13]='text';fnames[3]='LBIRTHDAY';ftypes[3]='date';fnames[4]='SBIRTHDAY';ftypes[4]='birthday';fnames[5]='LAPPTDATE';ftypes[5]='date';fnames[6]='LASTCASE';ftypes[6]='text';fnames[7]='LASTPRAC';ftypes[7]='text';fnames[8]='LASTAPPTNA';ftypes[8]='text';}(jQuery));var $mcj = jQuery.noConflict(true);"
