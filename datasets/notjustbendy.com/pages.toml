["https://www.notjustbendy.com/avery-wu"]
title = "Avery Wu"
description = "Avery Wu Exercise Physiologist Available for Individual Consultation, Telehealth & Home Visits Eight Mile Plains, Brisbane, Australia (07) 3123 4826 reception@notjustbendy.com Avery Wu is an accredited exercise physiologist and our first at Not Just Bendy Hypermobility Services. She graduated from Queensland University of Technology in 2021 with a Bachelor of Clinical Exercise Physiology. Avery also […]"
full_description = "Avery Wu Exercise Physiologist Available for Individual Consultation, Telehealth & Home Visits Eight Mile Plains, Brisbane, Australia (07) 3123 4826 reception@notjustbendy.com Contact Us Avery Wu is an accredited exercise physiologist and our first at Not Just Bendy Hypermobility Services. She graduated from Queensland University of Technology in 2021 with a Bachelor of Clinical Exercise Physiology. Avery also has an extensive Pilates background having completed a Diploma of Professional Pilates Instruction from PilatesITC in 2019. Avery has experience working with hypermobility and its associated conditions as an Exercise Physiologist and in Pilates-based settings. In addition, she has worked with clients with a wide scope of chronic health conditions including cardio-respiratory, metabolic, musculoskeletal and neurological conditions in a non-profit setting. While a student, Avery completed a women’s health placement working with clients with hypermobility who were going through pregnancy or were postnatal, and/or had other women’s health conditions. Avery is a firm believer of exercise as medicine and the important role it plays in the management of chronic health conditions. She is passionate about working with clients to achieve their goals, big or small, through the prescription of evidence-based exercise programs formulated to the individual needs of each client. Avery is experienced in exercise assessment, prescription and delivery in both gym and Pilates settings. Her exercise prescription utilises both traditional strength and conditioning and Pilates based exercises, finding the balance between progression whilst being mindful of exacerbating injury. Being hypermobile and POTS-y herself, Avery also has a personal understanding of the multifaceted challenges hypermobility can present during exercise. Avery participated in competitive figure skating in her youth, and having to complete exercise rehabilitation for sporting injuries, she experienced first-hand the long-term benefits of exercise. This kick-started her journey of learning and inspired her to pursue a degree in Exercise Physiology. Since learning more about her own hypermobility, it has become an area of interest in her work and motivated her to undertake further professional development. Avery is currently completing EDS ECHO Allied Health Professionals program, and attends regular professional development hosted by the Australian POTS Foundation in addition to her regular mentoring with Sharon Hennessey, Principal Physiotherapist at Not Just Bendy. In the future, Avery hopes to further build her knowledge and skills in women’s health. When not at work Avery enjoys cooking, trying new restaurants, and attending ballet and Pilates classes."
