["https://www.notjustbendy.com/prices"]
title = "Prices not just bendy"
description = "What are your prices for treatment at Not Just Bendy? Our fee structure: Please find below our fee structure as of 1st July 2024: Principal Physiotherapist – Sharon Hennessey Senior Physiotherapists – Maria, Belinda, Marlisa, Elissa & Ariel Associate Physiotherapists – Laurel, Gloria & Kevin Emerging Physiotherapists – Keyi Exercise Physiologist – Avery *Note: Initial […]"
full_description = "Prices/Fees at Not Just Bendy What are your prices for treatment at Not Just Bendy? Our fee structure: Please find below our fee structure as of 1st July 2024: Principal Physiotherapist – Sharon Hennessey Initial Appointment (75min therapy | 15min notes): $399 Follow-Up Appointment (50min therapy | 10min notes): $247 Follow-Up Appointment (37min therapy | 8min notes): $193 Follow-Up Appointment (25min therapy | 5min notes): $133 Senior Physiotherapists – Maria, Belinda, Marlisa, Elissa & Ariel Initial Appointment (60min therapy | 15min notes): $299 Follow-Up Appointment (50min therapy | 10min notes): $230 Follow-Up Appointment (37min therapy | 8min notes): $180 Follow-Up Appointment (25min therapy | 5min notes): $124 Associate Physiotherapists – Laurel, Gloria & Kevin Initial Appointment (60min therapy | 15min notes): $269 Follow-Up Appointment (50min therapy | 10min notes): $215 Follow-Up Appointment (37min therapy | 8min notes): $167 Follow-Up Appointment (25min therapy | 5min notes): $115 Emerging Physiotherapists – Keyi Initial Appointment (60min therapy | 15min notes): $242.49 Follow-Up Appointment (50min therapy | 10min notes): $193.99 Follow-Up Appointment (37min therapy | 8min notes): $145.49 Follow-Up Appointment (25min therapy | 5min notes): $96.99 Exercise Physiologist – Avery Initial Appointment* (50min therapy | 10min notes): $205 Follow-Up Appointment (50min therapy | 10min notes): $182 Follow-Up Appointment (37min therapy | 8min notes): $134 Follow-Up Appointment (25min therapy | 5min notes): $95 *Note: Initial appointments with our Exercise Physiologist are required for all new clients to Not Just Bendy, or for clients who have not attended our practice in the last 6 months. Classes Balanced & Strong Group Exercise Group $62 (up to 50 minutes) 4 person group supervised by our Physiotherapist or Exercise PhysiologistPrivate health rebates may be available for these groups^ What is the tiered pricing structure at Not Just Bendy? At Not Just Bendy, we are dedicated to providing exceptional physiotherapy care tailored to meet a diverse range of needs and preferences. Understanding that each client’s journey and requirements are unique, we have established a tiered pricing structure to ensure accessibility and specialized care for everyone. Our tiered system allows clients to choose from a range of physiotherapists – each with varying levels of experience and expertise in hypermobility and related areas. From our highly experienced Principal Physiotherapist to our emerging talents, every tier guarantees the highest standard of care and dedication. Explore our tiers to find the perfect match for your physiotherapy needs. Principal Physiotherapist: Sharon Hennessey, our practice principal, leads the team with extensive expertise in hypermobility, complemented by her role as a lecturer in this area. Senior Physiotherapists: With years of general experience and over 300 complex hypermobility cases handled, our Senior Physiotherapists bring deep knowledge and a significant client following. They are highly sought after and often booked in advance. Associate Physiotherapists: Trained extensively in our detailed Not Just Bendy system, these physiotherapists confidently handle a wide range of complex cases, with ready access to senior team members for additional support. Emerging Physiotherapists: As our newest team members, these registered physiotherapists are closely mentored by senior staff and personally trained by Sharon Hennessey. This tier is ideal for clients seeking quality care at an accessible price point, especially during the therapists’ initial time at Not Just Bendy, a period focused on building confidence and dedication to client care. Be assured that the staff member will be getting additional support from our senior team in the background. What can I expect from my appointments with your Physiotherapists? Initial Assessment (75 minutes total) Pre-Appointment Review (5 minutes) : Before we meet, we dedicate time to thoroughly review your online assessment form. This helps us gain a comprehensive understanding of your situation and prepare for our session. In-Person Assessment (60 minutes): Detailed questioning about your goals and main problems, focusing on joint and muscle issues. A review of your body’s systems to understand how they may relate to hypermobility. General advice on managing hypermobility and, time permitting, starting a physical assessment. The extent of physical assessment during this initial meeting varies based on individual complexity. Post-Session Documentation (10 minutes): After our meeting, we allocate time to comprehensively document your session and plan the next steps in your treatment. This time will likely include a letter to your referring practitioner (this may be completed after the second session if more information is required). Second Appointment (60 minutes total) Session with Physiotherapist (50 minutes): This follow-up session is crucial for: Completing your full assessment including the most impactful joint/muscle issues Providing in-depth education about your condition. Trialing products/braces/taping that may be of assistance Initiating your treatment including hands on and/or exercise/rehabilitation program. Treatment plan and recommendation for ongoing appointments. Post-Session Documentation (10 minutes): After our meeting, we allocate time to comprehensively document your session and plan the next steps in your treatment. Ongoing Appointments The frequency and length of subsequent appointments (30-60 minutes) are personalized based on factors like your progress, travel requirements, financial considerations, and the level of support you need. We are committed to a patient-centered approach and encourage open communication throughout your treatment journey. If you have any questions or require further details, please feel free to contact us. Why do my consultation times include time for notes? In 2023, we faced challenges, including the resignation of several staff members due to burnout. This has highlighted the need for us to reassess our working model, especially given the complexity and unique needs of our clients, particularly those with complex hypermobility conditions. Our commitment to providing exceptional care includes ensuring the well-being of our dedicated team. To address these challenges, we are including in our consultations, times for comprehensive documentation. This is vital for ensuring treatment continuity, monitoring client progress, and meeting legal requirements set by our governing body. This is a crucial step towards enhancing the care we provide and supporting the health and balance of our staff. We believe these adjustments will help us continue to offer the high-quality service you expect from us. What payment options do I have? Payment Methods at Not Just Bendy At Not Just Bendy, we strive to make our payment process as convenient and flexible as possible for our clients. We accept the following payment methods: Cash: For those who prefer traditional payment methods, we accept cash payments. Card Payments: We accept most major debit and credit cards. Please note, however, that we do not accept American Express. Afterpay: To provide more flexibility, we offer Afterpay services, allowing clients to receive treatment immediately and pay for it over four equal installments, due every two weeks. To use Afterpay services, clients need to sign up to the Afterpay app prior to attending their appointment. This can be easily done through the Afterpay website or mobile app. Payment is required at the time of treatment and can be made by EFTPOS or credit card (Visa and Mastercard). NB: – card transaction fees may apply. Payments through other types of funding 1. Private Health Insurance At Appointment: Bring your insurance card to claim on the spot and pay only the gap. Rebate Entitlement: Check with your health fund for specific rebate details as they vary by provider and coverage level. 2. Medicare Chronic Disease Management (CDM) Plan: Bring your CDM referral and Medicare card. We do not BULK BILL – you pay our scheduled prices listed above. Payment Requirement: Full payment required at appointment; then we lodge your claim. Rebate only $58.00/session (as of July 2023, subject to change). Safety Net Rebate: Potential higher rebate after reaching annual safety net (up to 85% of the fee). Note: Cannot claim both through Medicare and private health insurance for the same service. 3. Workers Compensation or Third Party / Insurance Initial Requirements: Medical practitioner referral, Insurance details, and claim number. Pending Claims: Pay per session until the claim is approved; invoices provided for reimbursement. Possible Gap Fee: Check with insurer or WorkSafe for scheduled fees; Gap fees for our service may apply 4. Department of Veteran Affairs (DVA) No Gap Fee: Direct billing to DVA. Requirements: DVA card and valid D904/GP referral. Session Length: Capped at 30 minutes per visit. 5. NDIS Self-Managed Participants: Standard rates apply; receipts provided for myplace portal claims. Plan-Managed Participants: NDIS Pricing Arrangements and Price Limits; invoices sent to plan management after support provision. Additional NDIS Information: Travel: Pro rata billing up to 30 mins per journey; shared costs for final participant’s return journey. Report Writing & Non-Face-to-Face Activities (including notes, team liason): Charged pro rata at the hourly rate. Cancellations: Self-Managed Participants: Less than 24-hour notice incurs 100% charge of the session cost Plan-Managed Participants: Less than 48-hour notice incurs 100% charge of the session cost Service Agreements: Required to receive services for plan-managed participants More Questions There are more questions answered in the Frequently Asked Questions page including: What are the prices for telehealth? Why does the initial session cost more?"
