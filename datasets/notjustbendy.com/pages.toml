["https://www.notjustbendy.com/belinda-breust"]
title = "Belinda Breust"
description = "Belinda Breust Senior Physiotherapist Available for Individual Consultation Eight Mile Plains, Brisbane, Australia (07) 3123 4826 reception@notjustbendy.com Belinda Breust is an experienced physiotherapist with nearly two decades of practice, bringing a strong academic background with a Master’s in Science and a Master’s in Physiotherapy Degree from Queensland. Her academic achievements include being awarded Academic Excellence […]"
full_description = "Belinda Breust Senior Physiotherapist Available for Individual Consultation Eight Mile Plains, Brisbane, Australia (07) 3123 4826 reception@notjustbendy.com Contact Us Belinda Breust is an experienced physiotherapist with nearly two decades of practice, bringing a strong academic background with a Master’s in Science and a Master’s in Physiotherapy Degree from Queensland. Her academic achievements include being awarded Academic Excellence in her final year of physiotherapy studies. Her professional journey spans across both public hospital settings in Tasmania and Victoria, including the Royal Hobart Hospital (RHH), Royal Melbourne Hospital (RMH), and Royal Children’s Hospital (RCH), and private practice. In private practice, Belinda discovered a passion for hypermobility, combining it with her interest in dance to develop a specialization in this area. Her dedication to understanding and managing hypermobility is evident through her involvement in studies and courses on flexibility, extreme mobility, and specifically for pole dancers. Belinda’s commitment to professional development is demonstrated by her past role as a Board Member of the Australian Physiotherapy Association (APA) and her contributions to coordinating dance-related courses. Joining Not Just Bendy Hypermobility Services (NJBHS) in 2020, she has been instrumental in treating individuals with Generalized Hypermobility Spectrum Disorder (GHSD) or Hypermobile Ehlers-Danlos Syndrome (HEDS), focusing on rehabilitation to improve their functional levels. Her expertise extends to Mechanical Diagnostic Therapy (MDT), having achieved credentialing in the McKenzie Method, and she is a certified Clinical Pilates Clinician through Dance Medicine Australia (DMA). This background supports her application of specific exercise-based rehabilitation, especially in spinal conditions, hypermobility management, and dancers. She continued to develop her knowledge of hypermobility when she joined the NJBHS team in 2020 under the expert guidance of Sharon, the Principal Physiotherapist. Since working at NJBHS, Belinda has treated many people with GHSD or HEDS, successfully rehabilitating them to a level of function that allows them to tackle their goals once again. She has assisted a number of applicants to access Disability support or NDIS when needed. She has also completed a number of training courses both in-house and externally, to address the specific needs of GHSD or HEDS patients. These training courses include Upper Cervical Instability, Body Braids, TMJ management, shoulder rehabilitation, hypermobility and nutrition, POTS management, Autonomic dysfunction in relation to the vagus nerve, and MCAS. External training has involved Bracing and management for Hypermobility & Paediatrics, EDS Echo virtual training for Allied Health, APA Conference special interest group in hypermobility, Flexibility Intensive, Extreme Hypermobility, and Hypermobility for Pole Dancers. Her goal and intention are to dedicate time to treating the clientele at NJBHS with as much compassion and empathy as possible, to educate patients, and give them as many tools as possible to manage their condition. Belinda aims to work closely with her clients and help them navigate the complexities that GHSD and HEDS invariably present on a daily basis. As a member of the APA, Belinda continues to engage with the physiotherapy community. Her personal interests, such as dancing and outdoor activities, complement her professional life, reflecting a balanced approach to well-being. Belinda Breust is excited to bring her advanced skills in movement analysis, muscle assessment, and exercise-based rehabilitation to Not Just Bendy Hypermobility Services.Please contact us to make an appointment with Belinda Breust."
