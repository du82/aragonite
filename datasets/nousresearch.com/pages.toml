["https://nousresearch.com/introducing-the-forge-reasoning-api-beta-and-nous-chat-an-evolution-in-llm-inference"]
title = "Introducing the Forge Reasoning API Beta and Nous Chat: An Evolution in LLM Inference - NOUS RESEARCH"
description = "The Forge Reasoning API contains some of our latest advancements in inference-time AI research, building on our journey from the original Hermes model."
full_description = "At Nous Research we’re launching two new projects: the Forge Reasoning API Beta and Nous Chat, a simple chat platform featuring the Hermes language model. The Forge Reasoning API contains some of our advancements in inference-time AI research, building on our journey from the original Hermes model. Our dedicated place for simply interacting with the powerful Hermes 3 70B language model! We’ve designed a sleek interface that puts sophisticated AI capabilities at your fingertips while maintaining ease of use. Hermes 3 is an open-source language model built for higher expression, long-form thinking and individual alignment. At hermes.nousresearch.com, our threaded conversation system helps you organize your thoughts and projects, while the system prompt and configuration options gives you full control over your AI interactions. Whether you’re conducting analysis, exploring future scenarios, or seeking practical advice, Nous Chat provides the focused environment you need to make the most of our loved open-source model. The Forge Reasoning API allows you to take any popular model and superpower it with a code interpreter and advanced reasoning capabilities. Our evaluations demonstrate that Forge augments the Hermes 70B model to be competitive with much larger models from Google, OpenAI and Anthropic in reasoning benchmarks: Hermes 70B x Forge outperforms larger models in the AIME evaluation specifically. This metric focused on competition-grade math questions–the AIME competition is one of the two tests used to determine eligibility for the US Math Olympiad, and has been used as a standard for similar reasoning systems in the past. Benchmarks demonstrate one perception of any LLM technology; we’re most interested in real-world use cases, and the vaunted “vibe checks” that can come from the field test of inference. We are currently exploring further how the Forge Reasoning system impacts frontier closed models. The Forge Reasoning API will be available in Beta for a select group of users starting this week.“Forge” integrates multiple research breakthroughs including our Hermes model family, Mixture of Agents, Chain of Code, Monte Carlo Tree Search to create a comprehensive system for enhanced reasoning capabilities."
author = "NOUS RESEARCH"
year_published = 2024
year_updated = 2024
