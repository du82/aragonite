["https://nousresearch.com/nous-psyche"]
title = "Announcing Nous Psyche on Solana - NOUS RESEARCH"
description = "ANNOUNCING NOUS PSYCHE ON SOLANA Superintelligence should solve for maximal individual agency and freedom of spirit. Its development cannot be left solely in the hands of a few corporations and oligarchs. Psyche is the antidote to this uncertainty – an open infrastructure to democratize and decentralize the development of superintelligence for humanity. Experiment with Psyche’s […]"
full_description = "Superintelligence should solve for maximal individual agency and freedom of spirit. Its development cannot be left solely in the hands of a few corporations and oligarchs. Psyche is the antidote to this uncertainty – an open infrastructure to democratize and decentralize the development of superintelligence for humanity. Experiment with Psyche’s training code, and the design for the entire open-sourced distributed training stack is here. The first phase of Psyche builds on Nous DisTrO technology, unleashing cooperative training for generative AI models. The Solana blockchain coordinates heterogeneous compute (4090s, a100s, h100s) to join together and train models to be fault-tolerant and censorship-resistant. Models can be trained by any participant or a subset of trusted actors. Participants can maintain data privacy when running their own data server. For testnet, compute providers will be screened in a centralized (trusted) environment, with a transition to a decentralized (permissionless) network over time. The second phase of Psyche expands its impact: accessible inference and advanced model capabilities. Psyche, when powering training and inference, has the potential to accelerate the work in the new reasoning paradigm dramatically. Comprehensive reasoning and reinforcement learning (RL) are pivotal to advancing AI. State-of-the-art (SOTA) reinforcement learning infrastructure is inherently distributed, differing from traditional pre-training or fine-tuning, in that there is a substantial workload of inference of the model during training. Nous Research plans to pre-train, fine-tune, and serve its next-generation language models on Psyche. Psyche unlocks the potential to have an open system of continuous model improvement, and enable instant distribution of Nous’ products. Core functionalities remain in active development. NOUS DISTRO is an optimizer and networking stack that constitutes the core component of the Psyche Network. It massively reduces bandwidth requirements, enabling the scalable open training of AI models for public use."
