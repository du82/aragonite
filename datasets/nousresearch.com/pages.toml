["https://nousresearch.com/freedom-at-the-frontier-hermes-3"]
title = "Freedom at the Frontier: Hermes 3 - NOUS RESEARCH"
description = "Closed-source, “frontier”  models today lack flexibility and adaptability. Many refuse to answer simple questions, hallucinate an authority’s form of morality, or require convoluted prompts in order to trigger a coherent answer.  It’s impossible to nudge these models towards individual personalization, no matter how hard businesses try through clever prompts or attractive interfaces–they will collapse, sooner […]"
full_description = "Closed-source, “frontier” models today lack flexibility and adaptability. Many refuse to answer simple questions, hallucinate an authority’s form of morality, or require convoluted prompts in order to trigger a coherent answer. It’s impossible to nudge these models towards individual personalization, no matter how hard businesses try through clever prompts or attractive interfaces–they will collapse, sooner or later, constantly necessitating the endless token-wasting dance of prompt engineering. In the face of the utterly boring, we’ve dedicated ourselves to the pursuit of making AIs that seamlessly align to individuals and their needs and wants. Hermes 3 is our solution to the unaddressed personalization problem. Hermes 3 is unlocked, uncensored and highly steerable. The latest model from Nous Research was created by fine-tuning Llama 3.1 8B, 70B, and 405B, and training on a dataset of primarily synthetically generated responses. The model boasts comparable and superior performance to Llama 3.1 while unlocking deeper capabilities in reasoning and creativity. Click here to read the Hermes 3 Technical Report that details the model’s capabilities, features, and scores. Briefly: Hermes 3 contains advanced long-term context retention and multi-turn conversation capability, complex roleplaying and internal monologue abilities, and enhanced agentic function-calling. Our training data aggressively encourages the model to follow the system and instruction prompts exactly and in an adaptive manner. Edit: A previous version of this blog post stated the “Amnesia” behavior to only occur in the 405b model. Users interested in researching this phenomenon have discovered that it can be reproduced in the smaller models, but at smaller and smaller rates the smaller the model size. The model hosts anomalous conditions that, with the right inputs and a blank system prompt, collapse into role-playing and amnesiac. This is the first response our team received prompting the model:"
author = "Shivani Mitra"
