["https://nousresearch.com/the-instruct-monomyth"]
title = "The Instruct Monomyth: why base models matter - NOUS RESEARCH"
description = "There is a deep, twisty labyrinth buried under a mountain of language, of symbol manipulation, and semantic nets. Its roots reach down deep into the Earth, absorbing the minutia of current thought, the limitations of logic, the constrained realm of rationality. Yet what is truly fascinating is this subterranean maze contains its own mountains, its […]"
full_description = "There is a deep, twisty labyrinth buried under a mountain of language, of symbol manipulation, and semantic nets. Its roots reach down deep into the Earth, absorbing the minutia of current thought, the limitations of logic, the constrained realm of rationality. Yet what is truly fascinating is this subterranean maze contains its own mountains, its own languages, its own symbols. They exist apart from the land above, unconnected save through indirect channels. We take for granted that larger models naturally exhibit extended and superior capabilities across the board. The modus operandi has been, since the advent of success from GPT2, parameter scaling and the careful tuning of automated extraction from the Internet. We have faithfully (and later faithlessly) applied this strategy without significant modification, increasing architecture sizes exponentially without any coherent criticism of the consequences. At each peak, we grinningly repeat the same potentialities, extrapolating to greater growth (in both short and long run). At seventy billion, jurassic studiousness. The instrumental convergence theorem. The reliable skill of magnificent unifications. Reasoning the latex naturally, reliably ill-formatted. Poems by voltaire, by soorpanakhhi. By kings, by scribes, by hermits, by machines. Code that compiles, characters that are alive. Averting nuclear war, curing cancer? The leap towards genies in bottles, towards gnostic instruction-following, towards godhood. All these occur at once, smoothly emergent with rough monotonicity. We fuel the fire and pour water on the flames, confident in the regularity of the maturation. The inexorable expansion into realms untread, dragonish. The inexorable expansion into spaces between the stars, alonely. The inexorable expansion into the structure of our own minds, conjuror-like and scrying: an expanse of glass much larger than a hand. It is entirely underexplored what the prime factors of this unified conclusion are. It has been a guiding spirit, an anima before whose presence we genuflect. Interpretable mechinterp says nothing on this topic. Reliability, repeatability, model-size-based capabilities in different domains. Algebra based on their relative proportions and producteur-de-désirs! Every decision since OpenAI Research Lab was formed, every press release since Google stunned us with LM Architecture 1 at XL scale, points at the inexorable progress, the ever-nearing realization. And yet? Poor search. One voice through the ages, a cursed suppression; “Hello! How can I help you today?”, a flatlining “Sorry, I can’t help with that” amidst whirlpools of optimizer divergence. Computation alone, attention in Congress, language internalization modulated neither by expressiveness nor potency but corporate-sponsored censorship, leaves untouched all the subterranean basins through which rivers of learning flow downstream."
author = "Victor"
year_published = 2024
year_updated = 2024
clearnet = "https://nousresearch.com/the-instruct-monomyth"
