["https://nownownow.com/p/aLzl"]
title = "Cecilia Macaulay now now now"
description = "nownownow.com: personal websites with a /now page"
full_description = "Cecilia Macaulay ceciliamacaulay.com.au/now 'This should work!' is a miserable dead end. 'How can I make this work? is an infinite game, and new friends will appear to play it with you. Location: Melbourne, Victoria, Australia Professional title: Zen Permaculture Home life Designer What do you do? I get unseen obstacles in your home life to disappear, through design workshops and hands-on harmonising. My sister and I run 2 hour webinars on quirky declutter topics such as ‘Create a garden of food in your fridge’ and ‘Create a sacred space anywhere in your home’. I do home harmonizing in Tokyo, Sydney and Melbourne. People let go of 70% of their possessions, and double their love for what remains. Relationships transform. Relatives Think it’s magic, but nature is already miraculous, and so are we, once we get into our flow. Why? I saw in Permaculture ways to design around my shortcomings. Now I get to be the hero and share the systems I curated with others, for a life of love. What should we read? No Bad Parts by Richard Schwartz. There is a whole 'family', or 'village' of characters inside us, as there should be, to give us strength in a changing world. Dr. Schwartz shows me how to calm my 'inner troublemakers', those impulses that think they are helping. As for my 'outer troublemakers', the annoying people in this world: I'm naturally looking at them with curiosity now, and this often turns to tenderness. URLs: https://www.ceciliamacaulay.com.au/ https://www.instagram.com/cecilia_macaulay/ https://www.linkedin.com/in/cecilia-macaulay/"
