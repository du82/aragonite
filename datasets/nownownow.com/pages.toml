full_description = "Joseph Chan jefftay.com/now People nowadays hold different positions and it is growing frustrating. We need to put opinions aside and sit down to communicate with each other so that we can learn to understand each other. To understand the world is not the key, the process itself is. Location: Shenzhen, 广东省 (Guǎngdōng Shěng), China Professional title: Amazon Operator, Lifelong Learner What do you do? # I read some books, mostly about Social Sciences, History and Philosophy. I take notes on TiddlyWiki and try to learn in public. I sometimes use Obsidian and other note-taking tools too. I consider myself as a Marxist/Socialist. I read and think from different perspectives. I write shitty articles. I love to communicate and discuss with others. I believe the hardest thing for a human being to do is to know thyself. Why? I write shitty articles because so that I can read those junks and laugh at them years after I grow. I read different books from those who spent their whole lives learning and achieving. I communicate and discuss with others because this builds consensus. What should we read? - Selected Works Of Mao Tse-tung - The Razor's Edge by W. Somerset Maugham - The Moon and Sixpence by W. Somerset Maugham - Remembrance of Earth's Past (The Three-Body Series) by Liucixin URLs: https://jefftay.com https://imzm.im/ https://x.com/raymekee"
