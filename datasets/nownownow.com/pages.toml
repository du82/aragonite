["https://nownownow.com/p/8E9h"]
title = "Niklas Goeke now now now"
description = "nownownow.com: personal websites with a /now page"
full_description = '''Niklas Goeke nik.art/now The two most obstructive words standing between you and inner peace are "I" and "think." I think, I think, I think. “I” means the ego is speaking. Not your true self but the character you’ve created and play in the world every day. “Think” means your omniscient gut has left the chat. Thinking is the ego plotting its next move. In the rare moments when we manage to drop the "I" and the "think," be it during meditation, flow, or a profound experience, we realize there's something deeper. Something honest. Something that just is yet always knows what we must do. Take a break from “I.” Take a break from “think.” You're much more than ego and brains, and the questions life truly asks us can’t be answered with either. Location: Munich, Germany Professional title: Writer, Founder of Four Minute Books What do you do? I write books, stories, essays, and book summaries for dreamers, doers, and unbroken optimists. Why? I write because it's the one thing I can't NOT do. I've always loved stories in all shapes and sizes, so for me, writing is the best form of authentic self-expression I've found. What should we read? The Practicing Mind by Thomas M. Sterner URLs: https://nik.art/ https://fourminutebooks.com/'''
