title = "Irish American Heritage Month (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us Article Irish American Heritage Month blockquote {border-left: 5px solid #fff;} The Irish Memorial in downtown Charleston, South Carolina, recognizes the state's Irish history, including the many Irish-born soldiers defending Fort Sumter at the outbreak of the Civil War. NPS \ Alban and Tejada Every March and throughout the year, the National Park Service and our partners commemorate the role of Irish Americans in American history. More than 400 years of Irish American history and heritage can be found in national parks and communities through the work of our programs and partners. Explore stories of people and places in person or virtually. Inspired by something you’ve learned or found a bit of family history in a national park? Share your experiences on social media using #IrishAmericanHeritageMonth and #FindYourPark or #EncuentraTuParque. blockquote {border-left: 5px solid #fff;} Commodore John Berry, whose statue stands in front of Independence Hall in Philadelphia, was born in Ireland. NPS Photo About the Heritage Month Irish American Heritage Month is timed during the month of March when St. Patrick’s Day, a holiday traditionally celebrated by many Irish Americans, also takes place. The first Irish American Heritage Month happened in 1991 and continued to be established through Congressional laws and presidential proclamations. US presidents have since issued annual presidential proclamations for Irish American Heritage Month since 1997 making it an established tradition. Learn more about the history of the heritage month through the Library of Congress. Like most history and heritage months, the goal is not to confine celebration, commemoration, and reflection to one month. Rather to do so at the same time, then continue to learn, share, and have conversations throughout the rest of the year. blockquote {border-left: 5px solid #fff;} Featured Stories and Places With more than 400 years of history and heritage, discover some of the stories, people, and places preserved in national parks or through our programs and partners. Find more stories about Irish American heritage that are woven into other European American history. jQuery(document).ready(function() { jQuery('#searchListing-EDC564E0-CBD6-DAE3-D6131A2C4CE529AB').searchlisting({ searchURL: "/solr/", searchURLReady: "/solr/?q=*&fl=Title,Abstract,Type,Subtype,Parks,Organizations,Sites_Item,Image_URL,Image_Alt_Text,PageURL&defType=edismax&sort=Date_Last_Modified desc&start=0&fq=Category:\"Articles\" AND (Type:\"Article\" OR Type:\"Person\" OR Type:\"Place\") AND (Tags_Item:\"Irish\" OR Tags_Item:\"Irish American Heritage\" OR Tags_Item:\"irish american history\" OR Tags_Item:\"irish heritage\" OR Tags_Item:\"Irish History\") AND -Allow_Listing_Display:false&rows=10", getMetaFields: "Title,Abstract,Type,Subtype,Parks,Organizations,Sites_Item,Image_URL,Image_Alt_Text,PageURL", frontEndClient: "", perPage: "10", startNum: "0", keywords: "", filterQuery: "Category:\"Articles\" AND (Type:\"Article\" OR Type:\"Person\" OR Type:\"Place\") AND (Tags_Item:\"Irish\" OR Tags_Item:\"Irish American Heritage\" OR Tags_Item:\"irish american history\" OR Tags_Item:\"irish heritage\" OR Tags_Item:\"Irish History\") AND -Allow_Listing_Display:false", usesDynamicNavigation: "", sort: "Date_Last_Modified desc", extrasForm: "", extrasForm_keywordField: "", extrasForm_keywordField: "", dataTransformJS: "if(\'Type\' in meta && typeof meta[\'Type\'] == \'object\'){ meta[\'Type\'] = meta[\'Type\'].join(\',\'); }var st = metaFieldArr.indexOf(\'Subtype\'); var t = metaFieldArr.indexOf(\'Type\'); if (st !== -1 && t == -1) { metaFieldArr[st] = \'Type\'; if(\'Subtype\' in meta){ meta[\'Type\']=meta[\'Subtype\']; delete meta[\'Subtype\']; }} if(\'Parks\' in meta){ meta[\'Parks\']=meta[\'Parks\'].replace(/,/g , \', \'); }if(\'Organizations\' in meta){ meta[\'Organizations\']=meta[\'Orga