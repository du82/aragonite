["https://nps.gov/state/id/index.htm"]
title = "Idaho (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Idaho</li>').show(); }); Idaho Parks National Historic Trail California Various States CA,CO,ID,KS,MO,NE,NV,OR,UT,WY Follow in the footsteps of over 250,000 emigrants who traveled to the gold fields and rich farmlands of California during the 1840s and 1850s: the greatest mass migration in American history. The California National Historic Trail is over 5,000 miles long and covers portions of 10 states. Step into history along more than 1,000 miles of ruts and traces from travelers and their overland wagons. Alerts & Conditions » Basic Information » Calendar » Maps » National Reserve City Of Rocks Almo, ID Described by California Trail emigrants as “a city of tall spires,” “steeple rocks,” and “the silent city,” this awe-inspiring landscape continues to captivate. Today, it beckons rock climbers, hikers, campers, hunters, and adventurers with its dramatic scenery, fascinating geology, and echoes of the Old West. The Silent City is ready for you to explore. Alerts & Conditions » Basic Information » Calendar » Maps » National Monument & Preserve Craters Of The Moon Arco, Carey and Rupert , ID Craters of the Moon is a vast ocean of lava flows with scattered islands of cinder cones and sagebrush. We invite you to explore this "weird and scenic landscape" where yesterday's volcanic events are likely to continue tomorrow. Basic Information » Calendar » Current Conditions - Craters of the Moon » Maps » National Monument Hagerman Fossil Beds Hagerman, ID During the Pliocene, this place looked quite different. Lush wetlands, forests, and grasslands provided excellent habitat for a variety of animals. From fascinating, now-extinct creatures like the saber-toothed cat, mastodon, and ground sloth, to more familiar animals like horses, beavers, and birds, the scientific study of Pliocene fossils is the key to Hagerman. Alerts & Conditions » Basic Information » Calendar » Maps » National Geologic Trail Ice Age Floods WA,OR,ID,MT At the end of the last Ice Age, 18,000 to 15,000 years ago, an ice dam in northern Idaho created Glacial Lake Missoula stretching 3,000 square miles around Missoula, Montana. The dam burst and released flood waters across Washington, down the Columbia River into Oregon before reaching the Pacific Ocean. The Ice Age Floods forever changed the lives and landscape of the Pacific Northwest. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Lewis & Clark Sixteen States: IA,ID,IL,IN,KS,KY,MO,MT,NE,ND,OH,OR,PA,SD,WA,WV The Lewis and Clark National Historic Trail winds nearly 4,900 miles through the homelands of more than 60 Tribal nations. It follows the historic outbound and inbound routes of the Lewis and Clark Expedition of 1803-1806 from Pittsburgh, Pennsylvania to the Pacific Ocean. Follow the trail to find the people, places, and stories that make up the complex legacy of the expedition. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Minidoka Jerome, ID,WA During World War II, over 120,000 people of Japanese ancestry were forcibly removed from their homes and incarcerated without due process of law. Although little remains of the barbed-wire fences and tar-papered barracks, the Minidoka concentration camp once held over 13,000 Japanese Americans in the Idaho desert. Minidoka preserves their legacy and teaches the importance of civil liberties. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park Nez Perce four states ID,MT,OR,WA Since time immemorial, the valleys, prairies, mountains, and plateaus of the inland northwest have been home to the nimíipuu (Nez Perce) people. Extremely resilient, they survived the settling of the United States and adapted to a changed world. Nez Perce National Historical Park consists of 38 places important to the history and culture of the nimíipuu. Explore these places. Learn their stories. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Oregon Various States ID,KS,MO,NE,OR,WA,WY Imagine yourself an emigrant headed for Oregon: would promises of lush farmlands and a new beginning lure you to leave home and walk for weeks? More than 2,000 miles of trail ruts and traces can still be seen along the Oregon National Historic Trail in six states and serve as reminders of the sacrifices, struggles, and triumphs of early American settlers. Alerts & Conditions » Basic Information » Calendar » Maps » National Park Yellowstone Yellowstone National Park, ID,MT,WY On March 1, 1872, Yellowstone became the first national park for all to enjoy the unique hydrothermal and geologic features. Within Yellowstone's 2.2 million acres, visitors have unparalleled opportunities to observe wildlife in an intact ecosystem, explore geothermal areas that contain about half the world’s active geysers, and view geologic wonders like the Grand Canyon of the Yellowstone River. Basic Information » Calendar » Current Conditions » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 7 National Parks 664,232 Visitors to National Parks $59,800,000 Economic Benefit from National Park Tourism » $47,454,826 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 40 Certified Local Governments » 43 Community Conservation & Recreation Projects (since 1987) » 3 National Trails Administered by NPS » 1,077 National Register of Historic Places Listings » 10 National Historic Landmarks » 11 National Natural Landmarks » 1 World Heritage Site » 382 Places Recorded by Heritage Documentation Programs » 571,882 Objects in National Park Museum Collections » 245 Archeological Sites in National Parks » 3 Teaching with Historic Places Lesson Plans » 8 Discover Our Shared Heritage Travel Itineraries » Print the summary » These numbers are just a sample of the National Park Service's work. Figures are for the fiscal year that ended 9/30/2020. More Information Alerts Events Photos & Multimedia Articles Nationwide News Get Your America the Beautiful Pass! Work With Us'''
