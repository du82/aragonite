full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us try{ jQuery(document).ready(function() { NPS.display.outputNav('/planyourvisit','/planyourvisit/trip-ideas.htm','read'); }); } catch(err){ console.log(err); } Trip Ideas blockquote {border-left: 5px solid #fff;} Looking for ideas to help you plan your next trip to a national park? This is the place to start! These trip ideas provide recommended activities designed to help you figure out how to spend your time. For even more ideas, see the list of all trip ideas below or search for things to do and trip ideas by park, activity, topic, duration, and more. Featured Trip Ideas Massachusetts Cape Cod Surf & Turf Adventure Create your own adventure at the seashore. Tour by bicycle during the day and then settle in for sunset on the beach. WASHINGTON, DC Civil Rights in Washington, DC Washington DC is home to sites commemorating the Civil Rights Movement and the fight for constitutional equality at the national level. CALIFORNIA Off the Beaten Path Explore parts of Sequoia & Kings Canyon National Parks that are less-visited throughout the year. jQuery(document).ready(function() { jQuery('#searchListing-56AB9FF1-AAF4-3814-2F5896980E078990').searchlisting({ searchURL: "/solr/", searchURLReady: "/solr/?q=*&fl=Title,Abstract,Subtype,Parks,Organizations,Sites_Item,Image_URL,Image_Alt_Text,Duration,Topics,Activities,Activity_Fee,Reservations,Age,Pets,Location,Season,Time_Of_Day,PageURL&defType=edismax&sort=Date_Last_Modified desc&start=0&fq=Category:\"Trip Ideas\" AND Type:\"Trip Idea\" AND -Allow_Listing_Display:false&rows=10", getMetaFields: "Title,Abstract,Subtype,Parks,Organizations,Sites_Item,Image_URL,Image_Alt_Text,Duration,Topics,Activities,Activity_Fee,Reservations,Age,Pets,Location,Season,Time_Of_Day,PageURL", frontEndClient: "", perPage: "10", startNum: "0", keywords: "", filterQuery: "Category:\"Trip Ideas\" AND Type:\"Trip Idea\" AND -Allow_Listing_Display:false", usesDynamicNavigation: "", sort: "Date_Last_Modified desc", extrasForm: "", extrasForm_keywordField: "", extrasForm_keywordField: "", dataTransformJS: "if(\'Type\' in meta && typeof meta[\'Type\'] == \'object\'){ meta[\'Type\'] = meta[\'Type\'].join(\',\'); }var st = metaFieldArr.indexOf(\'Subtype\'); var t = metaFieldArr.indexOf(\'Type\'); if (st !== -1 && t == -1) { metaFieldArr[st] = \'Type\'; if(\'Subtype\' in meta){ meta[\'Type\']=meta[\'Subtype\']; delete meta[\'Subtype\']; }} if(\'Parks\' in meta){ meta[\'Parks\']=meta[\'Parks\'].replace(/,/g , \', \'); }if(\'Organizations\' in meta){ meta[\'Organizations\']=meta[\'Organizations\'].replace(/,/g , \', \'); }if(\'Sites\' in meta){ meta[\'Sites\']=meta[\'Sites\'].replace(/,/g , \', \'); }if(\'Type\' in meta){ meta[\'Type\']=meta[\'Type\'].replace(/,/g , \', \'); }if(\'Season\' in meta){ meta[\'Season\']=meta[\'Season\'].replace(/,/g , \', \'); }if(\'Time_Of_Day\' in meta){ meta[\'Time_Of_Day\']=meta[\'Time_Of_Day\'].replace(/,/g , \', \'); }if(\'Topics\' in meta){ meta[\'Topics\']=meta[\'Topics\'].replace(/,/g , \', \'); }if(\'Activities\' in meta){ meta[\'Activities\']=meta[\'Activities\'].replace(/,/g , \', \'); }if(\'Image_URL\' in meta){ meta[\'Image_URL\'] = meta[\'Image_URL\'].replace(\'/cropped_image/\', \'/cropped_image/secondary/\'); }if(\'Type\' in meta && meta[\'Type\'] !== \'News\' && \'Date_Released\' in meta){ delete meta[\'Date_Released\']; }" ,facetFields: "Parks_Item,Organizations_Item" }) }); Trip Ideas Across the Country Narrow By Location: Narrow By Office: Show 10 40 Sort By: Relevance Recently Updated Date Released Title Loading results... Last updated: June 18, 2020 Places to Go Find a Park Things to Do Events Entrance Passes America the Beautiful Pass Series Visit Parks Free! Fee-Free Days'''
