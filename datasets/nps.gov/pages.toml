title = "Learn & Explore (U.S. National Park Service)"
description = "Learn more about the National Park Service and explore the diverse places that make up the National Park System and their natural and cultural resources and stories."
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us try{ jQuery(document).ready(function() { NPS.display.outputNav('/learnandexplore','/learnandexplore/index.htm','read'); }); } catch(err){ console.log(err); } Learn More About Us Discover History Explore Nature Kids Educators News Photos & Multimedia "National parks are the best idea we ever had. Absolutely American, absolutely democratic, they reflect us at our best rather than our worst." So wrote author Wallace Stegner in 1983. We invite you to discover why. Explore the stories of America's people and places. These stories are found across our nation's landscapes—in more than 400 national parks, in national heritage areas, along historic trails and waterways, and in every neighborhood. Learn about the natural resources in parks, from the rocks under our feet to the sky overhead. Investigate the issues that affect our parks and how we join with neighbors and partners to address them. Find opportunities for kids to discover the wonders of the national parks. Learn who we are, what we do, and what's going on in the national parks. Join us. National Park Topics Explore nature, history, recreation, and preservation in national parks and learn about the work we do. Featured Topics Connections To the Land American Indian Heritage A Setting for Inspiration Art in the Parks NPS & Historic Preservation Historic Preservation Fire: Destruction or Renewal? Fire: Structural Fire and Wildland Fire Discover their Secret Lives Bats Fossils are evidence of ancient life Fossils and Paleontology Kids & Teachers Explore, Learn, Protect! Junior Ranger Programs Many national parks offer young visitors the opportunity to join the National Park Service "family" as junior rangers. Lesson Plans & More Teaching With Historic Places This program brings historic places into the classroom, enlivening history, social studies, geography, civics, and other subjects. Calling All Fourth Graders! Every Kid Outdoors All fourth graders can participate in a fun online activity and receive a voucher for a free 4th Grade Annual Pass. Last updated: October 1, 2022 Every Kid Outdoors For Kids America’s Classrooms For Educators Stories of Places & People Discover History Protecting the Natural World Explore Nature'''
