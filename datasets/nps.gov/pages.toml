full_description = "#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us try{ jQuery(document).ready(function() { NPS.display.outputNav('/planyourvisit','/planyourvisit/national-park-system-operating-status.htm','read'); }); } catch(err){ console.log(err); } National Park System Operating Status blockquote {border-left: 5px solid #fff;} Visiting Parks in 2025 As of February 27, 2025 There are no systemwide alerts or closures. The National Park Service is hiring seasonal workers to continue enhancing the visitor experience as we embrace new opportunities for optimization and innovation in workforce management. We are focused on ensuring that every visitor has the chance to explore and connect with the incredible, iconic spaces of our national parks. Our teams are dedicated to staffing to meet the evolving needs of our visitors, ensuring memorable and meaningful experiences for all. As always, plan ahead when considering a park visit. Information about trip planning, operational updates, and reservations is on NPS.gov or the NPS App. Plan Your Visit Know before you go! Active alerts in parks View alerts in parks here or on the park's website Use the NPS App Find park maps, guides, and more Last updated: February 27, 2025"
