full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us Places of Wonder and Discovery National parks are great places to explore anything kids can imagine. Go on an outdoor adventure. Walk in the footsteps of famous people. Take in unique scenery. Explore new interests. Experience real places you may have only heard about. But most of all, national parks are places where you can have fun and create memories that last a lifetime. Every Kid Outdoors for 4th Graders Introducing 4th graders to national parks and other public lands and waters. Visit Parks With Kids You never know what you might see and do at a national park near you. Explore Junior Ranger Activity Books Nearly every park has a Junior Ranger activity. Junior Ranger Online Explore online activities, virtual tours, and more. Last updated: September 1, 2021 Get Involved Youth & Young Adult Programs For Teachers Educators Portal Explore History Teaching with Historic Places Get Outdoors Camping with Kids jQuery(document).ready(function() { var subsiteURL = "/portals/kids/"; var jsonSrc = ""; var siteCode = subsiteURL.split("/"); siteCode = siteCode[2]; jsonSrc = subsiteURL+"structured_data_portals_"+siteCode+".json"; jQuery.getJSON(jsonSrc, function( data ) { var hasSocialMedia = 0; var outputSocialMedia = '<div class="col-sm-6 col-md-4"><div class="ParkFooter-socialLinks"><h3>Stay Connected</h3><ul class="ParkFooter-socialLinks row">'; if (data.facebookURL) { outputSocialMedia += '<li class="col-2 col-sm-4 col-md-2"><a href="'+data.facebookURL+'"><svg class="icon" focusable="false" role="img" aria-label="Facebook for this portal"><use xlink:href="/common/commonspot/templates/assets/sprite.symbol.svg#facebook"></use></svg></a></li>'; hasSocialMedia = 1; } if (data.twitterURL) { data.twitterURL = data.twitterURL.replace('twitter.com', 'x.com') // convert old Twitter links into equivalent X links outputSocialMedia += '<li class="col-2 col-sm-4 col-md-