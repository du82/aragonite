title = "Arkansas (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Arkansas</li>').show(); }); Arkansas Parks National Memorial Arkansas Post Gillett, AR Located at the confluence of two rivers, Arkansas Post has served as a gathering place for many cultures throughout human history - it represents cultural cooperation, conflict, synthesis, and diversity. Alerts & Conditions » Basic Information » Calendar » Maps » National River Buffalo Harrison and St. Joe, AR Established in 1972, Buffalo National River flows freely for 135 miles and is one of the few remaining undammed rivers in the lower 48 states. Once you arrive, prepare to journey from running rapids to quiet pools while surrounded by massive bluffs as you cruise through the Ozark Mountains down to the White River. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Butterfield Overland MO, AR, OK, TX, NM, AZ, CA In 1857, businessman and transportation entrepreneur John Butterfield was awarded a contract to establish an overland mail route between the eastern United States and growing populations in the Far West. What became known as the Butterfield Overland Trail made an arcing sweep across the southern rim of the country. Stagecoaches left twice a week carrying passengers, freight, and mail. Basic Information » Calendar » Current Conditions » Maps » National Historic Site Fort Smith Fort Smith, AR,OK Explore life on the edge of frontier and Indian Territory through the stories of soldiers, the Trail of Tears, scandals, outlaws, and lawmen who pursued them. From the establishment of the first Fort Smith on December 25, 1817, to the final days of Judge Isaac C. Parker's jurisdiction over Indian Territory in 1896, Fort Smith National Historic Site preserves almost 80 years of history. Alerts & Conditions » Basic Information » Calendar » Maps » National Park Hot Springs Hot Springs, AR Hot Springs National Park has a rich cultural past. The grand architecture of our historic bathhouses is equally matched by the natural curiosities that have been drawing people here for hundreds of years. Ancient thermal springs, mountain views, incredible geology, forested hikes, and abundant creeks – all in the middle of town – make Hot Springs National Park a unique and beautiful destination. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Little Rock Central High School Little Rock, AR In 1957, Little Rock Central High School was the epicenter of confrontation and a catalyst for change as the fundamental test for the United States to enforce African American civil rights following Brown v. Board of Education. Learn how the sacrifice and struggle endured by the Little Rock Nine have provided opportunities and opened doors for those seeking education around the world. Alerts & Conditions » Basic Information » Calendar » Maps » National Military Park Pea Ridge Pea Ridge, AR On March 7-8, 1862, over 23,000 soldiers fought here to decide the fate of Missouri which was a turning point of the war in the Trans-Mississippi. This 4,300-acre battlefield honors those who fought and died on these hallowed grounds. Pea Ridge was the most pivotal Civil War battle west of the Mississippi River. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site President William Jefferson Clinton Birthplace Home Hope, AR Named for the father who died shortly before his birth, William Jefferson Blythe III later became the 42nd President of the United States. In Hope, the experiences shared with his mother and grandparents in rural Arkansas developed the broad views on race relations, social justice, and public service that defined his presidency and life after the White House. For Bill Clinton, "Hope was home." Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Trail Of Tears AL,AR,GA,IL,KY,MO,NC,OK,TN Remember and commemorate the survival of the Cherokee people, forcefully removed from their homelands in Georgia, Alabama, and Tennessee to live in Indian Territory, now Oklahoma. They traveled by foot, horse, wagon, or steamboat in 1838-1839. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 7 National Parks 3,897,132 Visitors to National Parks $362,000,000 Economic Benefit from National Park Tourism » $59,047,320 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 21 Certified Local Governments » 39 Community Conservation & Recreation Projects (since 1987) » 1 Wild & Scenic Rivers Managed by NPS » 2 National Trails Administered by NPS » 2,851 National Register of Historic Places Listings » 17 National Historic Landmarks » 5 National Natural Landmarks » 185 Places Recorded by Heritage Documentation Programs » 1,900,003 Objects in National Park Museum Collections » 1,290 Archeological Sites in National Parks » 3 Teaching with Historic Places Lesson Plans » 8 Discover Our Shared Heritage Travel Itineraries » Print the summary » These numbers are just a sample of the National Park Service's work. Figures are for the fiscal year that ended 9/30/2020. More Information Alerts Events Photos & Multimedia Articles Nationwide News Get Your America the Beautiful Pass! Work With Us'''
