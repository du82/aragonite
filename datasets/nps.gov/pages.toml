description = "Massachusetts"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Massachusetts</li>').show(); }); Massachusetts Parks National Historical Park Adams Quincy, MA From the sweet little farm at the foot of Penn’s Hill to the gentleman’s country estate at Peace field, Adams National Historical Park is the story of “heroes, statesmen, philosophers…and learned women” whose ideas and actions helped to transform thirteen disparate colonies into one united nation. Alerts & Conditions » Basic Information » Calendar » Maps » National Scenic Trail Appalachian Maine to Georgia, CT,GA,MA,MD,ME,NC,NH,NJ,NY,PA,TN,VA,VT,WV The Appalachian Trail is a 2,190+ mile long public footpath that traverses the scenic, wooded, pastoral, wild, and culturally resonant lands of the Appalachian Mountains. Conceived in 1921, built by private citizens, and completed in 1937, today the trail is managed by the National Park Service, US Forest Service, Appalachian Trail Conservancy, numerous state agencies and thousands of volunteers. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park Blackstone River Valley RI,MA The Blackstone River powered America's entry into the Age of Industry. The success of Samuel Slater's cotton spinning mill in Pawtucket, RI touched off a chain reaction that changed how people worked and where they lived. Learn how this revolution transformed the landscape of the Blackstone Valley and the United States. Old Slater Mill will reopen in Spring 2025. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park Boston Boston, MA Discover how one city could be the Cradle of Liberty, site of the first major battle of American Revolution, and home to many who espoused that freedom can be extended to all. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Boston African American Boston, MA Centered on the north slope of Beacon Hill, the African American community of 1800s Boston led the city and the nation in the fight against slavery and injustice. These remarkable men and women, together with their allies, were leaders in the Abolition Movement, the Underground Railroad, the Civil War, and the early struggle for equal rights and education. Alerts & Conditions » Basic Information » Calendar » Maps » National Recreation Area Boston Harbor Islands Boston, MA . . . where you can walk a Civil War-era fort, view historic lighthouses, explore tide pools, hike lush trails, camp under the stars, or relax while fishing, picnicking, or swimming—all within reach of downtown Boston. Youth programs, visitor services, research, wildlife management, and more are coordinated on the park's 34 islands and peninsulas by the Boston Harbor Islands Partnership. Alerts & Conditions » Basic Information » Calendar » Maps » National Seashore Cape Cod Wellfleet, MA The great Outer Beach described by Thoreau in the 1800s is protected within the national seashore. Forty miles of pristine sandy beach, marshes, ponds, and uplands support diverse species. Lighthouses, cultural landscapes, and wild cranberry bogs offer a glimpse of Cape Cod's past and continuing ways of life. Swimming beaches and walking and biking trails beckon today's visitors. Basic Information » Calendar » Current Park Conditions » Maps » National Historic Site Frederick Law Olmsted Brookline, MA Frederick Law Olmsted (1822-1903) is recognized as the founder of American landscape architecture and the nation's foremost parkmaker. Olmsted moved his home to suburban Boston in 1883 and established the world's first full-scale professional office for the practice of landscape design. During the next century, his sons and successors perpetuated Olmsted's design ideals, philosophy, and influence. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site John Fitzgerald Kennedy Brookline, MA JFK’s parents never expected that their second son would grow up to be president. Yet in his birthplace home he learned values that inspired a life in public service. His mother, Rose Kennedy, recreated her family’s first home to share her memories of those early years with visitors. We commemorate not only his early life, but the ideas and principles he left behind. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Longfellow House Washington's Headquarters Cambridge, MA Longfellow House-Washington's Headquarters National Historic Site preserves a remarkable Georgian house whose occupants shaped our nation. It was a site of colonial enslavement and community activism, George Washington’s first long-term headquarters of the American Revolution, and the place where Henry Wadsworth Longfellow wrote his canon of 19th-century American literature. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park Lowell Lowell, MA Lowell’s water-powered textile mills catapulted the nation – including immigrant families and early female factory workers – into an uncertain new industrial era. Nearly 200 years later, the changes that began here still reverberate in our shifting global economy. Explore Lowell, a living testament to the dynamic human story of the industrial revolution. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park Minute Man Concord, Lincoln, Lexington, MA At Minute Man National Historical Park the opening battle of the Revolution is brought to life as visitors explore the battlefields and structures associated with April 19, 1775, and witness the American revolutionary spirit through the writings of the Concord authors. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park New Bedford Whaling New Bedford, MA "The town itself is perhaps the dearest place to live in, in all New England..nowhere in all America will you find more patrician-like houses, parks and gardens more opulent, than in New Bedford…all these brave houses and flowery gardens came from the Atlantic, Pacific, and Indian oceans. One and all, they were harpooned and dragged up hither from the bottom of the sea." H. Melville, "Moby-Dick" Alerts & Conditions » Basic Information » Calendar » Maps » National Scenic Trail New England MA,CT From the Sound to the summits: the New England Trail covers 235 miles from Long Island Sound across long ridges to scenic mountain summits in Connecticut and Massachusetts. The trail offers panoramic vistas and close-ups of New England’s natural and cultural landscape: traprock ridges, historic village centers, farmlands, unfragmented forests, quiet streams, steep river valleys and waterfalls. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Salem Maritime Salem, MA Established on March 17, 1938 as the first National Historic Site in the United States, Salem Maritime National Historic Site consists of nine acres of land and twelve historic structures along the Salem waterfront, as well as a downtown visitor center. Located in the urban setting of Salem, the park preserves and interprets over 600 years of New England's maritime history and global connections. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Saugus Iron Works Saugus, MA In the 1600's, on the banks of the Saugus River, something extraordinary happened! Explore the place where European iron makers brought their special skills to a young Massachusetts colony. Saugus Iron Works is a twelve-acre National Historic Site that includes working waterwheels, forges, mills, a historic 17th century home, and a lush river basin. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Springfield Armory Springfield, MA For nearly two centuries, the U.S. Armed Forces and American industry looked to Springfield Armory for innovative engineering and superior firearms. Springfield Armory National Historic Site commemorates the critical role of the nation’s first armory by preserving and interpreting the world's largest historic US military small arms collection, along with historic archives, buildings and landscape. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Washington-Rochambeau Revolutionary Route MA,RI,CT,NY,NJ,PA,DE,MD,VA,DC In 1781, General Rochambeau’s French Army joined forces with General Washington’s Continental Army to fight the British Army in Yorktown, Virginia. With the French Navy in support, the allied armies moved hundreds of miles to become the largest troop movement of the American Revolution. The effort and cooperation between the two sides led to a victory at Yorktown and secured American independence. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 16 National Parks 7,848,724 Visitors to National Parks $1,349,100,000 Economic Benefit from National Park Tourism » $117,446,799 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 27 Certified Local Governments » 97 Community Conservation & Recreation Projects (since 1987) » 5 National Heritage Areas » 4 Wild & Scenic Rivers Managed by NPS » 3 National Trails Administered by NPS » 4,457 National Register of Historic Places Listings » 189 National Historic Landmarks » 11 National Natural Landmarks » 1,721 Places Recorded by Heritage Documentation Programs » 5,967,433 Objects in National Park Museum Collections » 445 Archeological Sites in National Parks » 13 Teaching with Historic Places Lesson Plans » 10 Discover Our Shared Heritage Travel Itineraries » Print the summary » These numbers are just a sample of the National Park Service's work. Figures are for the fiscal year that ended 9/30/2020. More Information Alerts Events Photos & Multimedia Articles Nationwide News Get Your America the Beautiful Pass! Work With Us'''
