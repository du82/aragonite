title = "Indiana (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Indiana</li>').show(); }); Indiana Parks National Historical Park George Rogers Clark Vincennes, IN The British flag would not be raised above Fort Sackville Feb. 25, 1779. At 10 A.M., the garrison surrendered to American Colonel George Rogers Clark. His American army, aided by French residents of the Illinois country, had marched through freezing floodwaters to gain this victory. The fort’s capture assured United States claims to the frontier, an area nearly as large as the original 13 states. Alerts & Conditions » Basic Information » Calendar » Maps » National Park Indiana Dunes Porter, IN Lake Michigan's might has influenced Indiana Dunes for millennia. Wind and waves have shaped the land, leaving a rich mosaic of habitats along these 15 miles of Indiana coast. Over 50 miles of trails lead through shifting sand dunes, quiet woodlands, sunny prairies and lush wetlands. Known for its striking plant and bird diversity, it's easy to find inspiration throughout the park’s 15,000 acres. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Lewis & Clark Sixteen States: IA,ID,IL,IN,KS,KY,MO,MT,NE,ND,OH,OR,PA,SD,WA,WV The Lewis and Clark National Historic Trail winds nearly 4,900 miles through the homelands of more than 60 Tribal nations. It follows the historic outbound and inbound routes of the Lewis and Clark Expedition of 1803-1806 from Pittsburgh, Pennsylvania to the Pacific Ocean. Follow the trail to find the people, places, and stories that make up the complex legacy of the expedition. Alerts & Conditions » Basic Information » Calendar » Maps » National Memorial Lincoln Boyhood Lincoln City, IN Abraham Lincoln grew from youth to manhood on this southern Indiana soil. Many character and moral traits of one of the world's most respected leaders was formed and nurtured here. Explore Lincoln's boyhood and learn about the boy who would one day become the leader of our nation. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 3 National Parks 3,128,978 Visitors to National Parks $204,400,000 Economic Benefit from National Park Tourism » $102,199,711 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 24 Certified Local Governments » 54 Community Conservation & Recreation Projects (since 1987) » 1 National Trails Administered by NPS » 2,084 National Register of Historic Places Listings » 42 National Historic Landmarks » 30 National Natural Landmarks » 500 Places Recorded by Heritage Documentation Programs » 200,660 Objects in National Park Museum Collections » 227 Archeological Sites in National Parks » 3 Teaching with Historic Places Lesson