title = "Alaska (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Alaska</li>').show(); }); Alaska .HeroPromo { overflow: visible; } Land of the Midnight Sun Alaska Plan Your Trip Parks Wild River Alagnak King Salmon, AK The headwaters of Alagnak Wild River lie within the rugged Aleutian Range of neighboring Katmai National Park and Preserve. Meandering west towards Bristol Bay and the Bering Sea, the Alagnak traverses the beautiful Alaska Peninsula, providing an unparalleled opportunity to experience the unique wilderness, wildlife, and cultural heritage of southwest Alaska. Alerts & Conditions » Basic Information » Calendar » Maps » Alaska Public Lands Anchorage, AK Alaska’s parks, forests, and refuges are rich and varied. The Alaska Public Lands Information Centers help visitors and residents to have meaningful, safe, enjoyable experiences on public lands, and encourages them to sustain the natural and cultural resources of Alaska. These centers provide trip-planning, interpretation, and education for all ages. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Area Aleutian Islands World War II Unalaska/Dutch Harbor, AK The remote Aleutian Islands, home to the Unangax^ (Aleut) people for over 8,000 years, became a fiercely contested Pacific battleground in World War II. Some Unangax^ were taken from their homelands as Japanese prisoners of war while the others were evacuated from the islands by the government. Both groups suffered greatly during the war, and some would never return to their villages. Alerts & Conditions » Basic Information » Calendar » Maps » National Monument & Preserve Aniakchak King Salmon, AK Given its remote location and challenging weather conditions, Aniakchak is one of the most wild and least visited places in the National Park System. This landscape is a vibrant reminder of Alaska's location in the volcanically active "Ring of Fire," as it is home to an impressive six mile (10 km) wide, 2,500 ft (762 m) deep caldera formed during a massive volcanic eruption 3,500 years ago. Alerts & Conditions » Basic Information » Calendar » Maps » National Preserve Bering Land Bridge Nome, AK Bering Land Bridge National Preserve lies at the continental crossroad that greatly influenced the distribution of life in the Western Hemisphere during the Pleistocene Epoch. It is a vital landscape for Indigenous communities who depend on the land just as their ancestors did for many generations. It is a wild and ecologically healthy landscape unlike any other. Alerts & Conditions » Basic Information » Calendar » Maps » National Monument Cape Krusenstern Kotzebue, AK A bridge to the past and a land for the future, Cape Krusenstern National Monument protects approximately 560,000 acres of diverse Arctic coastal, and upland ecosystems. Inhabited by the Iñupiaq people since time-immemorial, over 5,000 years of sequential human use is documented in the 114 successive beach ridges. Rich connections to the land and waters are preserved through subsistence practices. Alerts & Conditions » Basic Information » Calendar » Maps » National Park & Preserve Denali Denali Park, AK Denali is six million acres of wild land, bisected by one ribbon of road. Travelers along it see the relatively low-elevation taiga forest give way to high alpine tundra and snowy mountains, culminating in North America's tallest peak, 20,310' Mount McKinley. Wild animals large and small roam un-fenced lands, living as they have for ages. Solitude, tranquility and wilderness await. Basic Information » Calendar » Current Conditions » Maps » National Park & Preserve Gates Of The Arctic Bettles, AK This vast landscape does not contain any roads or trails. Visitors discover intact ecosystems where people have lived with the land for over ten thousand years. Wild rivers meander through glacier-carved valleys, caribou migrate along age-old trails, endless summer light fades into aurora-lit night skies of winter. Virtually unchanged, except by the forces of nature. Alerts & Conditions » Basic Information » Calendar » Maps » National Park & Preserve Glacier Bay Gustavus, AK Covering 3.3 million acres of rugged mountains, dynamic glaciers, temperate rainforest, wild coastlines and deep sheltered fjords, Glacier Bay National Park and Preserve is known as Homeland to the Huna and Yakutat Lingít, and is a highlight of Alaska's Inside Passage. From sea to summit, Glacier Bay offers limitless opportunities for adventure and inspiration. Alerts & Conditions » Basic Information » Calendar » Maps » Iñupiat Heritage Center Barrow , AK On the rooftop of the world, the Iñupiat Heritage Center in Barrow, Alaska, tells the story of the Iñupiat people. They have thrived for thousands of years in one of the most extreme climates on Earth, hunting the bowhead, or "Agviq." In the 19th century, the quiet northern seas swarmed with commercial whalemen from New England, who also sought the bowhead for its valuable baleen and blubber. Alerts & Conditions » Basic Information » Calendar » Maps » National Park & Preserve Katmai King Salmon, AK A landscape is alive underneath our feet, filled with creatures that remind us what it is to be wild. Katmai was established in 1918 to protect the volcanically devastated region surrounding Novarupta and the Valley of Ten Thousand Smokes. Today, Katmai National Park and Preserve also protects 9,000 years of human history and important habitat for salmon and thousands of brown bears. Alerts & Conditions » Basic Information » Calendar » Maps » National Park Kenai Fjords Seward, AK At the edge of the Kenai Peninsula lies a land where the ice age lingers. Nearly 40 glaciers flow from the Harding Icefield, Kenai Fjords' crowning feature. Wildlife thrives in icy waters and lush forests along the fjords once carved by the vast expanse of ice. Today, shrinking glaciers bear witness to the effects of our changing climate. Basic Information » Calendar » Current Conditions » Maps » National Historical Park Klondike Gold Rush Skagway, AK Headlines screamed "Gold!" The dream of a better life catapulted thousands of people to Alaska and the Yukon Territory. Their journey shaped them, and changed the people they encountered and the north forever. Today, the park remembers the trails, boomtowns, and stories of the Klondike Gold Rush. Alerts & Conditions » Basic Information » Calendar » Klondike Gold Rush Maps » National Park Kobuk Valley Kotzebue, AK Caribou, sand dunes, the Kobuk River, Onion Portage - just some of the facets of Kobuk Valley National Park. Thousands of caribou migrate through, their tracks crisscrossing sculpted dunes. The Kobuk River is an ancient and current corridor for people and wildlife. For 9000 years, people came to Onion Portage to harvest caribou as they swam the river. Even today, that rich tradition continues. Alerts & Conditions » Basic Information » Calendar » Maps » National Park & Preserve Lake Clark Port Alsworth, AK Lake Clark National Park and Preserve is a land of stunning beauty. Volcanoes steam, salmon run, bears forage, and craggy mountains reflect in shimmering turquoise lakes. Here, too, local people and culture still depend on the land and water. Venture into the park to become part of the wilderness. Alerts & Conditions » Basic Information » Calendar » Maps » National Preserve Noatak Kotzebue, AK As one of North America's largest mountain-ringed river basins with an intact ecosystem, the Noatak River environs feature some of the Arctic's finest arrays of plants and animals. The river is classified as a National Wild and Scenic River. It offers stunning wilderness float-trip opportunities - from deep in the Brooks Range to the tidewater of the Chukchi Sea. Alerts & Conditions » Basic Information » Calendar » National Historical Park Sitka Sitka, AK On an island amid towering spruce and hemlock, Sitka National Historical Park preserves the site of a battle between invading Russian traders and Indigenous Kiks.ádi Tlingit. Totem poles from Tlingit and Haida areas line the park’s scenic coastal trail, and the restored Russian Bishop’s House is a rare reminder of Russia’s colonial legacy in North America. Alerts & Conditions » Basic Information » Calendar » Maps » National Park & Preserve Wrangell - St Elias Copper Center, AK Wrangell-St. Elias is a vast national park that rises from the ocean all the way up to 18,008 ft. At 13.2 million acres, the park is the same size as Yellowstone National Park, Yosemite National Park, and Switzerland combined! Within this wild landscape, people continue to live off the land as they have done for centuries. This rugged, beautiful land is filled with opportunities for adventure. Basic Information » Calendar » Current Conditions » Maps » National Preserve Yukon - Charley Rivers Eagle, AK Located in Interior Alaska, Yukon-Charley Rivers offers exploration in a largely untouched landscape. Whether you float the mighty Yukon River or paddle the Charley River's whitewater, your memories will last a lifetime. Geology, cultural history, gold rush remnants, wildlife, and vast scenery will be a part of your experience. But, the strongest element will be solitude. Your adventure awaits. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 23 National Parks 1,916,088 Visitors to National Parks $2,307,600,000 Economic Benefit from National Park Tourism » $42,302,339 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 15 Certified Local Governments » 191 Community Conservation & Recreation Projects (since 1987) » 1 National Heritage Area » 13 Wild & Scenic Rivers Managed by NPS » 1 National Trails Administered by NPS » 447 National Register of Historic Places Listings » 50 National Historic Landmarks » 16 National Natural Landmarks » 1 World Heritage Site » 670 Places Recorded by Heritage Documentation Programs » 7,461,766 Objects in National Park Museum Collections » 6,535 Archeological Sites in National Parks » 6 Teaching with Historic Places Lesson Plans » 6 Discover Our Shared Heritage Travel Itineraries » Print the summary » These numbers are just a sample of the National Park Service's work. Figures are for the fiscal year that ended 9/30/2020. More Information Alerts Events Photos & Multimedia Articles Nationwide News Get Your America the Beautiful Pass! Work With Us'''
