["https://nps.gov/state/hi/index.htm"]
title = "Hawaii (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Hawaii</li>').show(); }); Hawaii Parks National Historic Trail Ala Kahakai the Island of Hawaii, HI Established in 2000 to preserve, protect and interpret traditional Native Hawaiian culture and natural resources, Ala Kahakai National Historic Trail is a 175 mile corridor encompassing a network of culturally and historically significant trails. This "trail by the sea" traverses wahi pana (storied landscapes), ancient Hawaiian sites and over 200 ahupua?a (traditional land divisions). Connect now! Basic Information » Calendar » Current Conditions » Maps » National Park Haleakalā Kula, Maui, HI This special place vibrates with stories of ancient and modern Hawaiian culture and protects the bond between the land and its people. The park also cares for endangered species, some of which exist nowhere else. Come visit this special place - renew your spirit amid stark volcanic landscapes and sub-tropical rain forest with an unforgettable hike through the backcountry. Alerts & Conditions » Basic Information » Calendar » Maps » National Park Hawaiʻi Volcanoes Hilo, HI Hawai‘i Volcanoes National Park protects some of the most unique geological, biological, and cherished cultural landscapes in the world. Extending from sea level to 13,680 feet, the park encompasses the summits of two of the world's most active volcanoes - Kilauea and Mauna Loa - and is a designated International Biosphere Reserve and UNESCO World Heritage Site. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Honouliuli HI Although not yet open to the public, Honouliuli National Historic Site will tell the history of incarceration, martial law, and the experience of prisoners of war in Hawai‘i during World War II. Honouliuli National Historic Site will be a place to reflect on wartime experiences and recommit ourselves to the pursuit of freedom and justice. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park Kalaupapa Kalaupapa, HI When Hansen's disease (leprosy) was introduced to the Hawaiian Islands, King Kamehameha V banished all afflicted to the isolated Kalaupapa Peninsula on the north shore of Molokai. Since 1866, more than 8,000 people, mostly Hawaiians, have died at Kalaupapa. Once a prison, Kalaupapa is now a refuge for the few remaining residents who are cured but were forced to live their lives in isolation. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park Kaloko-Honokōhau Kailua-Kona, HI To survive in a hot and arid environment the native Hawaiians (kanaka maoli) used ancient fishing skills, including the building of fishponds, and the knowledge of the location of precious fresh water (wai) that flows into the many brackish pools throughout the park. The spirit of the people (poe) and the knowledge of the elders (kupuna) created a tradition of respect and reverence for this area. Alerts & Conditions » Basic Information » Calendar » Maps » National Memorial Pearl Harbor Honolulu, HI At Pearl Harbor National Memorial, we honor the lives affected by the December 7, 1941, attack. This pivotal moment in global history marked the United States' entry into World War II, impacting nations and communities worldwide. Join us in reflecting on this shared history and its lasting significance in the pursuit of peace. Alerts & Conditions » Basic Information » Calendar » Map of the Pearl Harbor Visitor Center » National Historical Park Puʻuhonua o Hōnaunau Honaunau, HI Imagine you had just broken the sacred laws, the kapu, and the only punishment was death. Your only chance of survival is to elude your pursuers and reach the Pu?uhonua, a place of refuge. The Pu?uhonua protected the kapu breaker, defeated warriors, as well as civilians during the time of battle. No physical harm could come to those who reached the boundaries of the Pu?uhonua. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Puʻukoholā Heiau Kawaihae, HI How many places in America can you walk in the footsteps of a king? Where else has a stranded sailor risen up to become a great chief over an entire island? Where else can you experience the culminating event of a people, foretold from centuries past? Where else can you stand on a beach and watch as sharks pass over a submerged temple? Experience all this and much more – only at Pu'ukohola Heiau! Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 8 National Parks 4,764,320 Visitors to National Parks $819,100,000 Economic Benefit from National Park Tourism » $49,938,377 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 3 Cert