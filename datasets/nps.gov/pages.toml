["https://nps.gov/state/la/index.htm"]
title = "Louisiana (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Louisiana</li>').show(); }); Louisiana Parks National Historical Park Cane River Creole Natchez, LA The Cane River region is home to a unique culture; the Creoles. Generations of the same families of workers, enslaved and tenant, and owners lived on these lands for over 200 years. The park tells their stories and preserves the cultural landscape of Oakland and Magnolia Plantations, two of the most intact Creole cotton plantations in the United States. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail El Camino Real de los Tejas Various States TX,LA Explore a diverse array of histories contained within El Camino Real de los Tejas’ 150-year life, including the Spanish struggle to missionize American Indian nations, the growth of cattle ranching in the Mexican period, and the movement for Texan independence and statehood. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park and Preserve Jean Lafitte New Orleans, LA In Jean Lafitte's day, silver and gold filled a pirate's treasure chest, but today's treasures are people, places, and memories. Discover New Orleans’ rich cultural mix. Learn Cajun traditions from people who live them. Watch an alligator bask on a bayou’s bank. Walk in the footsteps of the men who fought at 1815’s Battle of New Orleans. Follow the link to discover the treasure of Jean Lafitte. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park New Orleans Jazz New Orleans, LA Discover the roots of jazz at the New Orleans Jazz National Historical Park. Located in the heart of the French Quarter, our park offers live performances, exhibits, and programs that celebrate the legacy of America's unique musical art form. Immerse yourself in the vibrant history and culture of jazz, a sound that continues to inspire the world. Join us in preserving and celebrating the music! Alerts & Conditions » Basic Information » Calendar » Maps » National Monument Poverty Point Epps, LA Now a nearly forgotten culture, Poverty Point at its peak 3,000 years ago was part of an enormous trading network that stretched for hundreds of miles across the continent. It was - and is - also an engineering marvel, the product of five million hours of labor. Explore the culture of a highly sophisticated people who left behind one of North America’s most important archeological sites. Alerts & Conditions » Basic Information » Calendar » Maps » National Military Park Vicksburg Vicksburg, MS,LA To Confederate President Jefferson Davis, Vicksburg was the "nailhead that holds the South's two halves together." President Abraham Lincoln remarked "Vicksburg is the key" to victory, and could be the north's lifeline into the south. As the federals closed in on the Fortress City, they were met by a ring of forts with over 170 cannon. The resulting battle would determine the war's outcome. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShow