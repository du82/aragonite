full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Florida</li>').show(); }); Florida Parks National Preserve Big Cypress Ochopee, FL The freshwaters of the Big Cypress Swamp, essential to the health of the neighboring Everglades, support the rich marine estuaries along Florida's southwest coast. Conserving over 729,000 acres of this vast swamp, Big Cypress National Preserve contains a mixture of tropical and temperate plant communities that are home to diverse wildlife, including the Endangered Florida panther. Alerts & Conditions » Basic Information » Calendar » Maps » National Park Biscayne Miami, Key Biscayne & Homestead, FL Within sight of Miami, yet worlds away, Biscayne protects a rare combination of aquamarine waters, emerald islands, and fish-bejeweled coral reefs. Evidence of 10,000 years of human history is here too; from prehistoric tribes to shipwrecks, and pineapple farmers to presidents. For many, the park is a boating, fishing, and diving destination, while others enjoy a warm breeze and peaceful scenery. Alerts & Conditions » Basic Information » Calendar » Maps » National Seashore Canaveral Titusville and New Smyrna Beach, FL Reflect on the barrier island which is composed of dune, hammock, and lagoon habitat. Explore ancient Timucua shell mounds. Experience the sanctuary that is provided for thousands of species of plants and animals that call Canaveral National Seashore home. Alerts & Conditions » Basic Information » Calendar » Maps » National Monument Castillo de San Marcos St. Augustine, FL Built by the Spanish in St. Augustine to defend Florida and the Atlantic trade route, Castillo de San Marcos National Monument preserves the oldest masonry fortification in the continental United States and interprets more than 450 years of cultural intersections. Alerts & Conditions » Basic Information » Calendar » Maps » National Memorial De Soto Bradenton, FL In May 1539, Conquistador Hernando de Soto’s army of soldiers, hired mercenaries, craftsmen, and clergy made landfall in Tampa Bay. They were met with fierce resistance of indigenous people protecting their homelands. De Soto’s quest for glory and gold would be a four year, four thousand mile odyssey of intrigue, warfare, disease, and discovery that would form the history of the United States. Alerts & Conditions » Basic Information » Calendar » Maps » National Park Dry Tortugas Key West, FL Almost 70 miles (113 km) west of Key West lies the remote Dry Tortugas National Park. This 100-square mile park is mostly open water with seven small islands. Accessible only by boat or seaplane, the park is known the world over as the home of magnificent Fort Jefferson, picturesque blue waters, superlative coral reefs and marine life, and the vast assortment of bird life that frequents the area. Basic Information » Calendar » Current Conditions » Maps » National Park Everglades Miami, Naples, and Homestead, FL Everglades National Park protects an unparalleled landscape that provides important habitat for numerous rare and endangered species like the manatee, American crocodile, and the elusive Florida panther. An international treasure as well - a World Heritage Site, International Biosphere Reserve, a Wetland of International Importance, and a specially protected area under the Cartagena Treaty. Alerts & Conditions » Basic Information » Calendar » Maps » National Memorial Fort Caroline the Timucuan Preserve; Jacksonville, FL At the settlement of la Caroline, French settlers struggled for survival in a new world. Many sought religious freedom in a new land, while others were soldiers or tradesmen starting a new life. The climactic battles fought here between the French and Spanish marked the first time that European nations fought for control of lands in what is now the United States. It would not be the last time. National Monument Fort Matanzas St. Augustine, FL Fort Matanzas National Monument preserves the fortified coquina watchtower, completed in 1742, which defended the southern approach to the Spanish military settlement of St. Augustine. It also protects approximately 300 acres of Florida coastal environment containing dunes, marsh, maritime forest, and associated flora and fauna, including threatened and endangered species. Alerts & Conditions » Basic Information » Calendar » Maps » National Seashore Gulf Islands Gulf Breeze, Florida and Ocean Springs, Mississippi , FL,MS Millions of visitors are drawn to the Gulf of America for Gulf Islands National Seashore's emerald coast waters, magnificent white beaches, fertile marshes and historical landscapes. Come explore with us today! Basic Information » Calendar » Maps » Temporary Road and Facility Closures » Ecological & Historic Preserve Timucuan Jacksonville, FL Visit one of the last unspoiled coastal wetlands on the Atlantic Coast. Discover 6,000 years of human history and experience the beauty of salt marshes, coastal dunes, and hardwood hammocks. The Timucuan Preserve includes Fort Caroline and Kingsley Plantation. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 11 National Parks 14,471,710 Visitors to National Parks $1,458,700,000 Economic Benefit from National Park Tourism » $175,225,407 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 83 Certified Local Governments » 66 Community Conservation & Recreation Projects (since 1987) » 1 National Heritage Area » 2 Wild & Scenic Rivers Managed by NPS » 1,893 National Register of Historic Places Listings » 46 National Historic Landmarks » 18 National Natural Landmarks » 1 World Heritage Site » 798 Places Recorded by Heritage Documentation Programs » 11,709,176 Objects in National Park Museum Collections » 1,192 Archeological Sites in National Parks » 8 Teaching with Historic Places Lesson Plans » 11 Discover Our Shared Heritage Travel Itineraries » Print the summary » These numbers are just a sample of the National Park Service's work. Figures are for the fiscal year that ended 9/30/2020. More Information Alerts Events Photos & Multimedia Articles Nationwide News Get Your America the Beautiful Pass! Work With Us'''
