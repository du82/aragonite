title = "Delaware (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Delaware</li>').show(); }); Delaware Parks National Historic Trail Captain John Smith Chesapeake Various States VA,MD,DE,DC,PA,NY People first arrived in the Chesapeake Bay during the last ice age. As glaciers melted, diverse societies learned to thrive in a world of water. When Englishman Captain John Smith explored the Bay in 1608, he documented hundreds of American Indian communities. Today, sites on his map are archeological treasures and sacred sites for tribal citizens. Come join us on the shores of the Chesapeake Bay! Alerts & Conditions » Basic Information » Calendar » Maps » Chesapeake Bay Chesapeake Bay Watershed, DC,DE,MD,NY,PA,VA,WV Over 41 million acres are connected through the waters that flow to and through Chesapeake Bay. The National Park Service strives to connect people to the opportunities and adventures throughout the watershed. Inspiring stewardship across this vast region supports recreation, business, tourism, learning, and a thriving natural resource for all to enjoy. Alerts & Conditions » Basic Information » Calendar » National Historical Park First State DE,PA Famous as the First State to ratify the Constitution, Delaware was born out of a conflict among three world powers for dominance of the Delaware Valley. From this beginning, the region developed a distinct character that tolerated diversity in religion and national origin and valued independence. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Washington-Rochambeau Revolutionary Route MA,RI,CT,NY,NJ,PA,DE,MD,VA,DC In 1781, General Rochambeau’s French Army joined forces with General Washington’s Continental Army to fight the British Army in Yorktown, Virginia. With the French Navy in support, the allied armies moved hundreds of miles to become the largest troop movement of the American Revolution. The effort and cooperation between the two sides led to a victory at Yorktown and secured American independence. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 1 National Park $11,700,000 Economic Benefit from National Park Tourism » $45,466,794 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 7 Certified Local Governments » 27 Community Conservation & Recreation Projects (since 1987) » 1 Wild & Scenic Rivers Managed by NPS » 1 National Trails Administered by NPS » 720 National Register of Historic Places Listings » 14 National Historic Landmarks » 409 Places Recorded by Heritage Documentation Programs » 1 Archeological Site in National Parks » 2 Teaching with Historic Places Lesson Plans » 4 Discover Our Shared Heritage Travel Itineraries » Print t