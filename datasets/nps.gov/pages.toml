title = "Maryland (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Maryland</li>').show(); }); Maryland Parks National Battlefield Antietam Sharpsburg, MD 23,000 soldiers were killed, wounded or missing after twelve hours of savage combat on September 17, 1862. The Battle of Antietam ended the Confederate Army of Northern Virginia's first invasion into the North and led Abraham Lincoln to issue the preliminary Emancipation Proclamation. Alerts & Conditions » Basic Information » Calendar » Maps » National Scenic Trail Appalachian Maine to Georgia, CT,GA,MA,MD,ME,NC,NH,NJ,NY,PA,TN,VA,VT,WV The Appalachian Trail is a 2,190+ mile long public footpath that traverses the scenic, wooded, pastoral, wild, and culturally resonant lands of the Appalachian Mountains. Conceived in 1921, built by private citizens, and completed in 1937, today the trail is managed by the National Park Service, US Forest Service, Appalachian Trail Conservancy, numerous state agencies and thousands of volunteers. Alerts & Conditions » Basic Information » Calendar » Maps » National Seashore Assateague Island MD,VA Want to live on the edge? Visit a place recreated each day by ocean wind and waves. Life on Assateague Island has adapted to an existence on the move. Explore sandy beaches, salt marshes, maritime forests and coastal bays. Rest, relax, recreate and enjoy some time on the edge of the continent. Basic Information » Calendar » Current Conditions » Maps » Parkway Baltimore-Washington Washington D.C. and Baltimore, Maryland, MD This 29-mile highway connects Baltimore, MD and Washington, D.C. The parkway has carried visitors to and from the capital city since 1954. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Captain John Smith Chesapeake Various States VA,MD,DE,DC,PA,NY People first arrived in the Chesapeake Bay during the last ice age. As glaciers melted, diverse societies learned to thrive in a world of water. When Englishman Captain John Smith explored the Bay in 1608, he documented hundreds of American Indian communities. Today, sites on his map are archeological treasures and sacred sites for tribal citizens. Come join us on the shores of the Chesapeake Bay! Alerts & Conditions » Basic Information » Calendar » Maps » Park Catoctin Mountain Thurmont, MD President Franklin D. Roosevelt created programs to give people a chance to rebuild their lives from the Great Depression. The Works Progress Administration and the Civilian Conservation Corps gave this land a second opportunity and through re-growth, a new role as a recreation area. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park Chesapeake & Ohio Canal Potomac River, DC,MD,WV Preserving America's early transportation history, the C&O Canal began as a dream of passage to Western wealth. Operating for nearly 100 years the canal was a lifeline for communities along the Potomac River as coal, lumber, and agricultural products floated down the waterway to market. Today it endures as a pathway for discovering historical, natural, and recreational treasures. Basic Information » Calendar » Current Park Conditions » Maps » Chesapeake Bay Chesapeake Bay Watershed, DC,DE,MD,NY,PA,VA,WV Over 41 million acres are connected through the waters that flow to and through Chesapeake Bay. The National Park Service strives to connect people to the opportunities and adventures throughout the watershed. Inspiring stewardship across this vast region supports recreation, business, tourism, learning, and a thriving natural resource for all to enjoy. Alerts & Conditions » Basic Information » Calendar » Civil War Defenses of Washington Washington, DC,MD,VA On forested hills surrounding the nation's capital are the remnants of a complex system of Civil War fortifications. These strategic buttresses transformed the young capital into one of the world's most fortified cities. By 1865, 68 forts and 93 batteries armed with over 800 cannons encircled Washington, DC. Today, you can visit 17 of the original sites now managed by the National Park Service. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Clara Barton Glen Echo , MD Clara Barton dedicated her life and energies to help others in times of need - both home and abroad, in peacetime as well as during military emergencies. Glen Echo was her home the last 15 years of her life, and the structure illustrates her dedication and concern for those less fortunate than herself. Alerts & Conditions » Basic Information » Calendar » Maps » Park Fort Foote Oxon Hill, MD Fort Foote was constructed in 1863 atop Rozier's Bluff to strengthen the ring of fortifications that encircled Washington, D.C. Two of the Guns that protected Washington are still there along with the remains of the fort's earthworks. Alerts & Conditions » Basic Information » Calendar » Maps » National Monument and Historic Shrine Fort McHenry Baltimore, MD by the dawn's early light, a large red, white and blue banner? Whose broad stripes and bright stars... were so gallantly streaming...over Fort McHenry! The valiant defense of the fort during the Battle of Baltimore on September 13-14, 1814 inspired Francis Scott Key to write the words that became the U.S. national anthem. The fort's history holds many other stories too, from the Civil War to WWII. Alerts & Conditions » Basic Information » Calendar » Maps » Park Fort Washington Fort Washington, MD Built to defend the river approach to Washington, DC, Fort Washington has stood as silent sentry for over 200 years. As technologies advanced so did Fort Washington, from the brick and stone of the 19th century to the concrete and steel of the 20th century. Joining the National Park Service in 1946, the park continues to protect the Potomac River. Alerts & Conditions » Basic Information » Calendar » Maps » Memorial Parkway George Washington DC,MD,VA The George Washington Memorial Parkway was designed for recreational driving. It links sites that commemorate important episodes in American history and preserve habitat for local wildlife. The parkway and its associated trails provide a scenic place to play and rest in the busy Washington, DC metropolitan area. Basic Information » Calendar » Current Conditions » Maps » Park Glen Echo Glen Echo, MD Glen Echo Park began in 1891 as a National Chautauqua Assembly "to promote liberal and practical education." By 1911, it transformed into DC's premier amusement park until it closed in 1968. Since 1971, the National Park Service has owned and operated the site and today, with the help of the Glen Echo Park Partnership for Arts and Culture, offers year-round cultural and recreational activities. Alerts & Conditions » Basic Information » Calendar » Maps » Park Greenbelt Greenbelt, MD Enjoy affordable camping, hiking, and peaceful forest surroundings just ten miles from Washington, DC! Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Hampton Towson, MD Hampton National Historic Site preserves what remains of a once 25,000-acre enslavement plantation. For hundreds of years, enslaved people, indentured servants, tenant farmers, paid laborers, and the Ridgely family all made their own contributions to Hampton, creating a space where cruelty and decadence collide to provide a complex history of the United States. Alerts & Conditions » Basic Information » Calendar » Maps » Harmony Hall Prince George's County, MD The 18th century Harmony Hall mansion is located on a 62.5-acre open pasture land estate along the Potomac River. This estate was purchased by the National Park Service in 1966, to preserve southern Maryland cultural heritage. Surrounded by a rich landscape, it offers visitors many chances to connect with Colonial History. The park also home to the remains of the Want Water House and canal. Alerts & Conditions » Basic Information » Calendar » Maps » National Historical Park Harpers Ferry Harpers Ferry, WV,VA,MD At the confluence of the Shenandoah and Potomac rivers, on the ancestral home of the Tuscarora and Shawnee people, lies Harpers Ferry. Here you can explore John Brown's Raid against slavery. Find your connection to the struggle for freedom, education, and civil rights at Storer College. Discover miles of trail in the Blue Ridge and along Civil War battlefields. Basic Information » Calendar » Current Conditions » Maps » National Historical Park Harriet Tubman Underground Railroad Cambridge, MD Harriet Tubman was a deeply spiritual woman who lived her ideals and dedicated her life to freedom. She is the Underground Railroad’s best known conductor and before the Civil War repeatedly risked her life to guide 70 enslaved people north to new lives of freedom. This new national historical park preserves the same landscapes that Tubman used to carry herself and others away from slavery. Alerts & Conditions » Basic Information » Calendar » Maps » National Battlefield Monocacy Frederick, MD During the summer of 1864, the Confederacy carried out a bold plan to turn the tide of the Civil War in their favor. They planned to capture Washington, DC and influence the election of 1864. On July 9, however, Federal soldiers outnumbered three to one, fought gallantly along the banks of the Monocacy River in an effort to buy time for Union reinforcement to arrive in Washington, DC. Alerts & Conditions » Basic Information » Calendar » Maps » Oxon Cove Park & Oxon Hill Farm Oxon Hill, MD The diverse history of Maryland and our national heritage can be experienced at Oxon Cove Park. Through hands-on programs and other activities, you can experience farm life and how its changed over time. Explore how the park evolved from a plantation home during the War of 1812, to a hospital farm, to the park you can visit today. Alerts & Conditions » Basic Information » Calendar » Maps » Park Piscataway Accokeek., MD Piscataway Park is home to bald eagles, beavers, deer, foxes, ospreys, and many other species. To complement the surroundings, the park has, in addition to a public fishing pier and two boardwalks over fresh water tidal wetlands, a variety of nature trails, meadows, and woodland areas. The Park is also home to National Colonial Farm. Alerts & Conditions » Basic Information » Calendar » Maps » National Scenic Trail Potomac Heritage the corridor between the Chesapeake Bay and the Allegheny Highlands, DC,MD,PA,VA The Potomac River corridor is rich in both history and recreation, offering a chance to both explore your heritage and choose your adventure along the way. Start your journey here! Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Star-Spangled Banner DC,MD,VA For three years the young United States was embroiled in the War of 1812 and the Chesapeake Bay region felt the brunt of it, choked by shipping blockades and ravaged by enemy raids. Through sites and landscapes in Virginia, the District of Columbia, and Maryland, the Trail tells the stories of the events, people, and places that led to the birth of the U.S. national anthem. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Thomas Stone Port Tobacco, MD In 1776, Thomas Stone and 55 others signed the Declaration of Independence. In doing so, Stone risked his home, his family's security, and even his life to support the Declaration of Independence's promise of freedom. Yet he and many other signers denied freedom to those they enslaved. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Washington-Rochambeau Revolutionary Route MA,RI,CT,NY,NJ,PA,DE,MD,VA,DC In 1781, General Rochambeau’s French Army joined forces with General Washington’s Continental Army to fight the British Army in Yorktown, Virginia. With the French Navy in support, the allied armies moved hundreds of miles to become the largest troop movement of the American Revolution. The effort and cooperation between the two sides led to a victory at Yorktown and secured American independence. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 18 National Parks 5,974,112 Visitors to National Parks $313,900,000 Economic Benefit from National Park Tourism » $95,983,492 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 22 Certified Local Governments » 102 Community Conservation & Recreation Projects (since 1987) » 3 National Heritage Areas » 5 National Trails Administered by NPS » 1,589 National Register of Historic Places Listings » 75 National Historic Landmarks » 6 National Natural Landmarks » 2,038 Places Recorded by Heritage Documentation Programs » 2,665,321 Objects in National Park Museum Collections » 686 Archeological Sites in National Parks » 11 Teaching with Historic Places Lesson Plans » 9 Discover Our Shared Heritage Travel Itineraries » Print the summary » These numbers are just a sample of the National Park Service's work. Figures are for the fiscal year that ended 9/30/2020. More Information Alerts Events Photos & Multimedia Articles Nationwide News Get Your America the Beautiful Pass! Work With Us'''
