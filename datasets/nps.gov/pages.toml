title = "Alabama (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Alabama</li>').show(); }); Alabama Parks National Monument Birmingham Civil Rights AL In 1963, images of snarling police dogs unleashed against non-violent protesters and of children being sprayed with high-pressure hoses appeared in print and television news around the world. These dramatic scenes of violent police aggression against civil rights protesters in Birmingham, Alabama were vivid examples of segregation and racial injustice in America. Alerts & Conditions » Basic Information » Calendar » Maps » National Monument Freedom Riders AL In 1961, a small interracial band of “Freedom Riders” challenged discriminatory laws requiring separation of the races in interstate travel. They were attacked by white segregationists, who firebombed the bus. Images of the attack appeared in hundreds of newspapers, shocking the American public and spurring the Federal Government to issue regulations banning segregation in interstate travel. Alerts & Conditions » Basic Information » Calendar » Maps » National Military Park Horseshoe Bend Daviston, AL On 27 March 1814, Major General Andrew Jackson ‘s army of 3,300 men attacked Chief Menawa’s 1,000 Red Stick Creek warriors fortified in a horseshoe shaped bend of the Tallapoosa River. Over 800 Red Sticks died that day. The battle ended the Creek War, resulted in a land cession of 23,000,000 acres to the United States and created a national hero of Andrew Jackson. Alerts & Conditions » Basic Information » Calendar » Maps » National Preserve Little River Canyon Fort Payne, AL Little River is unique because it flows for most of its length atop Lookout Mountain in northeast Alabama. Forested uplands, waterfalls, canyon rims and bluffs, pools, boulders, and sandstone cliffs offer settings for a variety of recreational activities. Natural resources and cultural heritage come together to tell the story of the Preserve, a special place in the Southern Appalachians. Alerts & Conditions » Basic Information » Calendar » Maps » Parkway Natchez Trace the states of AL,MS,TN The Natchez Trace Parkway is a 444-mile recreational road and scenic drive through three states. It roughly follows the "Old Natchez Trace," a historic travel corridor used by American Indians, "Kaintucks," European settlers, slave traders, soldiers, and future presidents. Today, people can enjoy a scenic drive as well as hiking, biking, horseback riding, and camping along the Parkway. Basic Information » Calendar » Current Conditions » Maps » National Scenic Trail Natchez Trace Tupelo, AL,MS,TN The Natchez Trace National Scenic Trail is five sections of hiking trail running roughly parallel to the 444-mile long Natchez Trace Parkway scenic motor road. The foot trails total more than 60 miles and offer opportunities to explore wetlands, swamps, hardwood forest, and the history of the area. For What's Open What's Close visit www.nps.gov/natr/planyourvisit/what-is-open-what-is-closed.htm Alerts & Conditions » Basic Information » Calendar » Maps » National Monument Russell Cave Bridgeport, AL Russell Cave is an archeological site with one of the most complete records of prehistoric cultures in the Southeast. In the 1950s, archeologists uncovered a large quantity of artifacts representing over 10,000 years of use in a single place. Today, Russell Cave National Monument helps bring to light many cultural developments of phenomenal human journeys. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Selma To Montgomery Montgomery, Lowndes & Dallas Counties, AL Established by Congress in 1996, the Selma to Montgomery National Historic Trail commemorates the people, events, and route of the 1965 Voting Rights March in Alabama. Led by Dr. Martin Luther King, Jr., Black and White non-violent supporters fought for the right to vote in Central Alabama. Today, you can connect with this history and trace the events of these marches along the 54-mile trail. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Trail Of Tears AL,AR,GA,IL,KY,MO,NC,OK,TN Remember and commemorate the survival of the Cherokee people, forcefully removed from their homelands in Georgia, Alabama, and Tennessee to live in Indian Territory, now Oklahoma. They traveled by foot, horse, wagon, or steamboat in 1838-1839. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Tuskegee Airmen Tuskegee, AL Before the first African American military pilots became known as the "Red Tails" they wore striped tails as they began their flight training in the Army's PT-17 Stearman bi-plane. Their flying adventure started at Moton Field, in Tuskegee, Alabama, where the Army Air Corps conducted a military test to determine if African Americans could be trained to fly combat aircraft. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Tuskegee Institute Tuskegee Institute, AL In 1881, Booker T. Washington arrived in Alabama and started building Tuskegee Institute both in reputation and literally brick by brick. He recruited the best and the brightest to come and teach here including George Washington Carver who arrived in 1896. Carver’s innovations in agriculture, especially with peanuts, expanded Tuskegee’s standing throughout the country. The story continues…. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 9 National Parks 1,323,667 Visitors to National Parks $121,200,000 Economic Benefit from National Park Tourism » $79,301,042 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 34 Certified Local Governments » 45 Community Conservation & Recreation Projects (since 1987) » 2 National Heritage Areas » 3 National Trails Administered by NPS » 1,351 National Register of Historic Places Listings » 38 National Historic Landmarks » 7 National Natural Landmarks » 1,255 Places Recorded by Heritage Documentation Programs » 432,264 Objects in National Park Museum Collections » 257 Archeological Sites in National Parks » 9 Teaching with Historic Places Lesson Plans » 6 Discover Our Shared Heritage Travel Itineraries » Print the summary » These numbers are just a sample of the National Park Service's work. Figures are for the fiscal year that ended 9/30/2020. More Information Alerts Events Photos & Multimedia Articles Nationwide News Get Your America the Beautiful Pass! Work With Us'''
