me}</a></li>`; has_related_content = 1; } output_related_content += '</ul></div></div>'; } if ( data.RELATED_ORGS.length ) { // Organizations output_related_content += '<div class="col-sm-4 col-md-4"><div class="ExperienceMoreCategory"><h3>Organizations</h3><ul class="row">'; var display_total = data.RELATED_ORGS.length; if ( display_total > max_display ) { display_total = max_display; } for (var i = 0; i < display_total; i++ ) { if ( data.RELATED_ORGS[i].site_code.toString().length ) { output_related_content += `<li class="ExperienceMore item"><a class="more" href="/orgs/${data.RELATED_ORGS[i].site_code}" onclick="gas('send', 'event', 'Experience More', '${document.location.href}', '/orgs/${data.RELATED_ORGS[i].site_code}', 1, true)">${data.RELATED_ORGS[i].name}</a></li>`; } else { output_related_content += '<li class="item">'+data.RELATED_ORGS[i].name+'</li>'; } has_related_content = 1; } output_related_content += '</ul></div></div>'; } output_related_content += '</div></div>'; if(has_related_content == 1) { jQuery("#related_content_position").replaceWith(output_related_content); } });'''
