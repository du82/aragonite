description = "District of Columbia"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>District of Columbia</li>').show(); }); District of Columbia Parks African American Civil War Memorial Washington, DC Over 200,000 African-American soldiers and sailors served in the U.S. Army and Navy during the Civil War. Their service helped to end the war and free over four million slaves. The African American Civil War Memorial honors their service and sacrifice. Alerts & Conditions » Basic Information » Calendar » Maps » Park Anacostia Washington, DC Welcome to Anacostia Park, your neighborhood national park in the heart of Washington, DC! Enjoy exercise along the river trail or relax by the water, Anacostia Park is a breath of fresh air and a space to unwind amid a bustling city. Alerts & Conditions » Basic Information » Calendar » Maps » National Monument Belmont-Paul Women's Equality Washington, DC Home to the National Woman's Party for more than 90 years, this was the epicenter of the struggle for women's rights. From this house in the shadow of the U.S. Capitol and Supreme Court, Alice Paul and the NWP developed innovative strategies and tactics to advocate for the Equal Rights Amendment and equality for women. President Barack Obama designated the national monument on April 12, 2016. Basic Information » Alerts & Conditions » Calendar » Maps » Capitol Hill Parks Washington, DC The Capitol Hill Parks include several park areas east of the U.S. Capitol. Included in this group are Folger, Lincoln, Stanton, and Marion Parks, the Eastern Market and Potomac Avenue Metro stations, and several smaller land parcels such as Seward Square, Twining Square, the Maryland Avenue Triangles, the Pennsylvania Avenue Medians, and 59 inner-city triangles and squares. Basic Information » Calendar » Current Conditions » Maps » National Historic Trail Captain John Smith Chesapeake Various States VA,MD,DE,DC,PA,NY People first arrived in the Chesapeake Bay during the last ice age. As glaciers melted, diverse societies learned to thrive in a world of water. When Englishman Captain John Smith explored the Bay in 1608, he documented hundreds of American Indian communities. Today, sites on his map are archeological treasures and sacred sites for tribal citizens. Come join us on the shores of the Chesapeake Bay! Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Carter G. Woodson Home Washington, DC Before Dr. Carter G. Woodson, there was very little accurate written history about the lives and experiences of Americans of African descent. Today a National Historic Site, Dr. Woodson’s home served as the headquarters for the Association for the Study of African American Life and History. Dr. Woodson established Negro History Week here in 1926, which we celebrate today as Black History Month. Basic Information » Calendar » Current Conditions » Maps » National Historical Park Chesapeake & Ohio Canal Potomac River, DC,MD,WV Preserving America's early transportation history, the C&O Canal began as a dream of passage to Western wealth. Operating for nearly 100 years the canal was a lifeline for communities along the Potomac River as coal, lumber, and agricultural products floated down the waterway to market. Today it endures as a pathway for discovering historical, natural, and recreational treasures. Basic Information » Calendar » Current Park Conditions » Maps » Chesapeake Bay Chesapeake Bay Watershed, DC,DE,MD,NY,PA,VA,WV Over 41 million acres are connected through the waters that flow to and through Chesapeake Bay. The National Park Service strives to connect people to the opportunities and adventures throughout the watershed. Inspiring stewardship across this vast region supports recreation, business, tourism, learning, and a thriving natural resource for all to enjoy. Alerts & Conditions » Basic Information » Calendar » Civil War Defenses of Washington Washington, DC,MD,VA On forested hills surrounding the nation's capital are the remnants of a complex system of Civil War fortifications. These strategic buttresses transformed the young capital into one of the world's most fortified cities. By 1865, 68 forts and 93 batteries armed with over 800 cannons encircled Washington, DC. Today, you can visit 17 of the original sites now managed by the National Park Service. Alerts & Conditions » Basic Information » Calendar » Maps » Constitution Gardens Washington, DC Officially established in 1965, National Mall and Memorial Parks actually protects some of the older parkland in the National Park System. Areas within this premier park provide visitors with ample opportunities to commemorate presidential legacies; honor the courage and sacrifice of war veterans; and celebrate the United States commitment to freedom and equality. Alerts & Conditions » Basic Information » Calendar » Maps » Memorial Dwight D. Eisenhower DC The Dwight D. Eisenhower Memorial tells the story of one of America's greatest leaders of the 20th century. Basic Information » Calendar » Current Conditions » Maps » Ford's Theatre Washington, DC April 14, 1865. President Lincoln is assassinated at Ford’s Theatre. Discover how a nation handled grief and loss, how everyday people experienced a national tragedy, and how we have remembered a fallen leader. Today, in partnership with Ford’s Theatre Society, live dramatic productions highlight Lincoln’s love of the theatre, and the power of stories to connect us to ourselves and our history. Alerts & Conditions » Basic Information » Calendar » Maps » Fort Dupont Park Washington, DC This 361 acre wooded park was once home to an earthen fort built to protect Washington, DC, during the Civil War. Today, visitors can see the fort's earthworks and escape to the great outdoors. Activities include picnics, nature walks, biking, gardening, environmental education, music, and ranger-led programs. Alerts & Conditions » Basic Information » Calendar » Maps » Franklin Delano Roosevelt Memorial Washington, DC These words by President Franklin Delano Roosevelt ushered the United States into World War II and defined what it is to be an American. Stop by this secluded memorial and begin to understand the Roosevelt legacy. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Frederick Douglass Washington, DC Frederick Douglass spent his life fighting for justice and equality. Born into slavery in 1818, he escaped as a young man and became a leading voice in the abolitionist movement. People everywhere still find inspiration today in his tireless struggle, brilliant words, and inclusive vision of humanity. Douglass's legacy is preserved here at Cedar Hill, where he lived his last 17 years. Alerts & Conditions » Basic Information » Calendar » Maps » Memorial Parkway George Washington DC,MD,VA The George Washington Memorial Parkway was designed for recreational driving. It links sites that commemorate important episodes in American history and preserve habitat for local wildlife. The parkway and its associated trails provide a scenic place to play and rest in the busy Washington, DC metropolitan area. Basic Information » Calendar » Current Conditions » Maps » Kenilworth Park & Aquatic Gardens Washington, DC Deep within Kenilworth lies an oasis, hidden behind trees and cattails. It's a place where beavers build their homes and turtles sleep on logs. Lotus blooms rise from the muck and lilies sit on the water. The wind dances with the dragonflies, rustling through the trees, carrying the song of the birds until it brushes across your face, fading to a whisper, saying "come join." Alerts & Conditions » Basic Information » Calendar » Maps » Korean War Veterans Memorial Washington, DC At the Korean War Veterans Memorial, "Our nation honors her sons and daughters who answered the call to defend a country they never knew and a people they never met." Alerts & Conditions » Basic Information » Calendar » Maps » LBJ Memorial Grove on the Potomac Washington, DC From this distance the seat of national power appears pristine across the river, so President Johnson came here often when he needed to escape from the stresses of building a Great Society. After he died, his wife chose this place for his memorial. A landscape of serpentine paths, white pines, a granite monolith, and an open meadow honors his legacy of social justice and conservation legislation. Alerts & Conditions » Basic Information » Calendar » Maps » Lincoln Memorial Washington, DC "...as in the hearts of the people for whom he saved the Union, the memory of Abraham Lincoln is enshrined forever." Beneath these words, the 16th president of the United States sits immortalized in marble as an enduring symbol of unity, strength, and wisdom. Alerts & Conditions » Basic Information » Calendar » Maps » Martin Luther King, Jr. Memorial Washington, DC Located in downtown Washington, DC, the memorial honors Martin Luther King, Jr.'s legacy and the struggle for freedom, equality, and justice. A prominent leader in the modern civil rights movement, Dr. King was a tireless advocate for racial equality, working class, and the oppressed around the world. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Mary McLeod Bethune Council House Washington, DC Mary McLeod Bethune achieved her greatest recognition at the Washington, DC townhouse that is now this National Historic Site. The Council House was the first headquarters of the National Council of Negro Women (NCNW) and was Bethune’s last home in Washington, DC. From here, Bethune and the NCNW spearheaded strategies and developed programs that advanced the interests of African American women. Alerts & Conditions » Basic Information » Calendar » Maps » National Capital Parks-East Washington, DC Welcome to National Capital Parks-East. We invite you to journey to the parks east of the Capitol of Washington, D.C. National Capital Parks-East consists of 14 park sites, parkways and statuary covering more than 8,000 acres of historic, cultural, and recreational parklands from Capitol Hill to the nearby Maryland suburbs. Alerts & Conditions » Basic Information » Calendar » Maps » National Mall and Memorial Parks Washington, DC This is where the nation comes to remember and where history is made. As “America’s Front Yard,” the National Mall and Memorial Parks is home to many of our country’s most iconic memorials telling the story of people and events that shaped us as a nation. Each year, millions of people come to recreate, commemorate presidential legacies, honor our veterans, and make their voices heard. Alerts & Conditions » Basic Information » Calendar of Events » Maps » Pennsylvania Avenue Washington, DC A street unlike any other. It is known the world over as the heart of the Nation's Capital. America's history has marched, paraded, promenaded, and protested its way along the Avenue. Alerts & Conditions » Basic Information » Calendar » Maps » National Scenic Trail Potomac Heritage the corridor between the Chesapeake Bay and the Allegheny Highlands, DC,MD,PA,VA The Potomac River corridor is rich in both history and recreation, offering a chance to both explore your heritage and choose your adventure along the way. Start your journey here! Alerts & Conditions » Basic Information » Calendar » Maps » Park Rock Creek Washington, DC Rock Creek Park is truly a gem in our nation's capital. This 1,754 acre city park was officially authorized in 1890, making it the third national park to be designated by the federal government. It offers visitors the opportunity to escape the bustle of the city and find a peaceful refuge, recreation, fresh air, majestic trees, wild animals, and thousands of years of human history. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Star-Spangled Banner DC,MD,VA For three years the young United States was embroiled in the War of 1812 and the Chesapeake Bay region felt the brunt of it, choked by shipping blockades and ravaged by enemy raids. Through sites and landscapes in Virginia, the District of Columbia, and Maryland, the Trail tells the stories of the events, people, and places that led to the birth of the U.S. national anthem. Alerts & Conditions » Basic Information » Calendar » Maps » The White House and President's Park Washington, DC The White House is owned by the American people and stewarded by the National Park Service. It is more than the President's residence; it is a site for protests and national discourse about what it means to be American. As one of the most iconic sites in the country, the White House and President's Park seeks to tell the stories of all people who have lived, worked, and visited. Alerts & Conditions » Basic Information » Calendar » Maps » Theodore Roosevelt Island Washington, DC In the 1930s, landscape architects transformed Mason’s Island from neglected, overgrown farmland into Theodore Roosevelt Island, a memorial to America’s 26th president. They conceived a “real forest” designed to mimic the natural forest that once covered the island. Today miles of trails through wooded uplands and swampy bottomlands honor the legacy of a great outdoorsman and conservationist. Basic Information » Calendar » Current Conditions » Maps » Thomas Jefferson Memorial Washington, DC Author of the Declaration of Independence, statesman and visionary for the founding of a nation. Alerts & Conditions » Basic Information » Calendar » Maps » Vietnam Veterans Memorial Washington, DC Honoring the men and women who served in the controversial Vietnam War, the Vietnam Veterans Memorial chronologically lists the names of 58,318 Americans who gave their lives in service to their country. Alerts & Conditions » Basic Information » Calendar » Maps » Washington Monument Washington, DC Built to honor George Washington, the United States' first president, the 555-foot marble obelisk towers over Washington, D.C. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Washington-Rochambeau Revolutionary Route MA,RI,CT,NY,NJ,PA,DE,MD,VA,DC In 1781, General Rochambeau’s French Army joined forces with General Washington’s Continental Army to fight the British Army in Yorktown, Virginia. With the French Navy in support, the allied armies moved hundreds of miles to become the largest troop movement of the American Revolution. The effort and cooperation between the two sides led to a victory at Yorktown and secured American independence. Alerts & Conditions » Basic Information » Calendar » Maps » World War I Memorial Washington, DC A grateful nation honors the service, valor, courage and sacrifice of the 4.7 million American sons and daughters who served in the Great War. Basic In'''
