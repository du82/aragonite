title = "Georgia (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Georgia</li>').show(); }); Georgia Parks National Historic Site Andersonville Andersonville, GA Nearly 13,000 men died on these grounds, a site that became infamous even before the Civil War ended. Their burial grounds became Andersonville National Cemetery, where veterans continue to be buried today. This place, where tens of thousands suffered captivity so others could be free, is also home to the National Prisoner of War Museum and serves as a memorial to all American prisoners of war. Alerts & Conditions » Basic Information » Calendar » Maps » National Scenic Trail Appalachian Maine to Georgia, CT,GA,MA,MD,ME,NC,NH,NJ,NY,PA,TN,VA,VT,WV The Appalachian Trail is a 2,190+ mile long public footpath that traverses the scenic, wooded, pastoral, wild, and culturally resonant lands of the Appalachian Mountains. Conceived in 1921, built by private citizens, and completed in 1937, today the trail is managed by the National Park Service, US Forest Service, Appalachian Trail Conservancy, numerous state agencies and thousands of volunteers. Alerts & Conditions » Basic Information » Calendar » Maps » National Recreation Area Chattahoochee River Atlanta, GA Today the river valley attracts us for so many reasons. Take a solitary walk to enjoy nature’s display, raft leisurely through the rocky shoals with friends, fish the misty waters as the sun comes up, or have a picnic on a Sunday afternoon. Get Outdoors and experience your Chattahoochee River National Recreation Area as you have never done before. Basic Information » Calendar » Current Conditions » Maps » National Military Park Chickamauga & Chattanooga Fort Oglethorpe, GA,TN In 1863, Union and Confederate forces fought for control of Chattanooga, known as the "Gateway to the Deep South." The Confederates were victorious at nearby Chickamauga in September. However, renewed fighting in Chattanooga that November provided Union troops victory and control of the city. After the fighting, a Confederate soldier ominously wrote, "This...is the death-knell of the Confederacy." Basic Information » Calendar » Current Conditions » Maps » National Seashore Cumberland Island Saint Marys, GA St Marys is the gateway to Cumberland Island, Georgia's largest and southernmost barrier island. Here pristine maritime forests, undeveloped beaches and wide marshes whisper the stories of both man and nature. Natives, missionaries, enslaved African Americans and Wealthy Industrialists all walked here. Cumberland Island is also home to over 9,800 acres of Congressionally designated Wilderness. Alerts & Conditions » Basic Information » Calendar » Maps » National Monument Fort Frederica St. Simons Island, GA War was imminent as James Oglethorpe established Fort Frederica in 1736, to help protect the British colonies from the Spanish in Florida. Fort Frederica illustrates the story of the War of Jenkins Ear (1739-1748) and how its British defenders fought off the Spanish Army. Today, archeology has uncovered the story of the 1,000 people that once lived here. Alerts & Conditions » Basic Information » Calendar of Events » Maps » National Monument Fort Pulaski Savannah, GA For much of the 19th century, masonry fortifications were the United States’ main defense against overseas enemies. However, during the Civil War, new technology proved its superiority over these forts. Using rifled cannons, the U.S. Army compelled the Confederate garrison inside Fort Pulaski to surrender. The siege was a landmark experiment in the history of military science and invention. Alerts & Conditions » Basic Information » Calendar » Park Maps » National Historical Park Jimmy Carter Plains, GA Few U.S. Presidents have had such close ties with where they were born and raised. The rural southern culture of Plains, Georgia revolves around farming, church, and school, which had a large influence in molding the character and shaping the political policies of the 39th President of the United States. Alerts & Conditions » Basic Information » Calendar » Maps » National Battlefield Park Kennesaw Mountain Kennesaw, GA Kennesaw Mountain National Battlefield Park is a 2,965 acre National Battlefield that preserves a Civil War battleground of the Atlanta Campaign. Opposing forces maneuvered and fought here from June 19, 1864 until July 2, 1864. Although most famous as a Civil War battlefield, Kennesaw Mountain has a much richer story. Alerts & Conditions » Basic Information » Calendar » Trail Maps » National Historical Park Martin Luther King, Jr. Atlanta, GA Welcome to Martin Luther King, Jr. National Historical Park & Preservation District where a young boy grows up in a time of segregation. He was moved by destiny to lead the modern civil rights movement. This was Martin Luther King, Jr. Explore his roots, walk in his footsteps, visit the home of his birth, and where he played as a child. Hear his voice in the church where he changed the world. Basic Information » Calendar » Current Conditions » Maps » National Historical Park Ocmulgee Mounds Macon, GA Welcome to Ocmulgee Mounds National Historical Park. This park is a prehistoric American Indian site, where many different American Indian cultures occupied this land for thousands of years. American Indians first came here during the Paleo-Indian Period hunting Ice Age mammals. Around 900 CE, the Mississippian Period began, and people constructed mounds for their elite, which remain here today. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Trail Of Tears AL,AR,GA,IL,KY,MO,NC,OK,TN Remember and commemorate the survival of the Cherokee people, forcefully removed from their homelands in Georgia, Alabama, and Tennessee to live in Indian Territory, now Oklahoma. They traveled by foot, horse, wagon, or steamboat in 1838-1839. Alerts & Conditions » Basic Information » Calendar » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 11 National Parks 6,532,801 Visitors to National Parks $605,400,000 Economic Benefit from National Park Tourism » $104,265,157 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 100 Certified Local Governments » 63 Community Conservation & Recreation Projects (since 1987) » 3 National Heritage Areas » 2 National Trails Administered by NPS » 2,210 National Register of Historic Places Listings » 49 National Historic Landmarks » 11 National Natural Landmarks » 992 Places Recorded by Heritage Documentation Programs » 4,995,442 Objects in National Park Museum Collections » 302 Archeological Sites in National Parks » 5 Teaching with Historic Places Lesson Plans » 9 Discover Our Shared Heritage Travel Itineraries » Print the summary » These numbers are just a sample of the National Park Service's work. Figures are for the fiscal year that ended 9/30/2020. More Information Alerts Events Photos & Multimedia Articles Nationwide News Get Your America the Beautiful Pass! Work With Us'''
