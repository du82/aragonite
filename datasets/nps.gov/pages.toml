["https://nps.gov/state/ks/index.htm"]
title = "Kansas (U.S. National Park Service)"
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us jQuery(document).ready(function() { //this is done manually because there isn't a nav on the state pages jQuery("ol#breadcrumbs").append('<li><a href="/">NPS.gov</a></li><li><a href="/findapark/index.htm">Find A Park</a></li><li>Kansas</li>').show(); }); Kansas Parks National Historical Park Brown v. Board of Education Topeka, KS The path to equality has been anything but smooth. It's taken courage and dedication by everyday people coming together for a common goal to carry the country toward true equality. Parents, teachers, secretaries, welders, ministers, and students drove their communities, and the country along with them, toward justice in a series of often unsteady turns leading to the Brown v. Board decision. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail California Various States CA,CO,ID,KS,MO,NE,NV,OR,UT,WY Follow in the footsteps of over 250,000 emigrants who traveled to the gold fields and rich farmlands of California during the 1840s and 1850s: the greatest mass migration in American history. The California National Historic Trail is over 5,000 miles long and covers portions of 10 states. Step into history along more than 1,000 miles of ruts and traces from travelers and their overland wagons. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Fort Larned Larned, KS Discover a complete and authentic army post from the 1860s -1870s! This well-preserved fort on the Santa Fe Trail shares a tumultuous history of the Indian Wars era. The sandstone constructed buildings sheltered troops who were known as the Guardians of the Santa Fe Trail. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Fort Scott Fort Scott, KS Promises made and broken! Who deserves to be free? The fight for freedom! Soldiers fighting settlers! Each of these stories is a link in the chain of events that encircled Fort Scott from 1842-1873. All of the site's structures, its parade ground, and its tallgrass prairie bear witness to this era when the country was forged from a young republic into a united transcontinental nation. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Lewis & Clark Sixteen States: IA,ID,IL,IN,KS,KY,MO,MT,NE,ND,OH,OR,PA,SD,WA,WV The Lewis and Clark National Historic Trail winds nearly 4,900 miles through the homelands of more than 60 Tribal nations. It follows the historic outbound and inbound routes of the Lewis and Clark Expedition of 1803-1806 from Pittsburgh, Pennsylvania to the Pacific Ocean. Follow the trail to find the people, places, and stories that make up the complex legacy of the expedition. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Site Nicodemus Nicodemus, KS Formerly enslaved African Americans left Kentucky at the end of the post-Civil War Reconstruction period to experience freedom in the "Promised Land" of Kansas. Nicodemus represents the involvement of African Americans in the homesteading movement across the Great Plains. It is the oldest and only remaining Black settlement west of the Mississippi River. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Oregon Various States ID,KS,MO,NE,OR,WA,WY Imagine yourself an emigrant headed for Oregon: would promises of lush farmlands and a new beginning lure you to leave home and walk for weeks? More than 2,000 miles of trail ruts and traces can still be seen along the Oregon National Historic Trail in six states and serve as reminders of the sacrifices, struggles, and triumphs of early American settlers. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Pony Express Various States CA,CO,KS,MO,NE,NV,UT,WY It is hard to believe that young men once rode horses to carry mail from Missouri to California in the unprecedented time of only 10 days. This relay system along the Pony Express National Historic Trail in eight states was the most direct and practical means of east-west communications before the telegraph. Alerts & Conditions » Basic Information » Calendar » Maps » National Historic Trail Santa Fe CO,KS,MO,NM,OK You can almost hear the whoops and cries of "All's set!" as trail hands hitched their oxen to freight wagons carrying cargo between western Missouri and Santa Fe, New Mexico. Follow the Santa Fe National Historic Trail through five states and you'll find adventure and evidence of past travelers who made this remarkable trip before you! Alerts & Conditions » Basic Information » Calendar » Maps » National Preserve Tallgrass Prairie Strong City, KS Tallgrass prairie once covered 170 million acres of North America, but within a generation most of it had been transformed into farms, cities, and towns. Today less than 4% remains intact, mostly in the Kansas Flint Hills. Established on November 12, 1996, the preserve protects a nationally significant remnant of the once vast tallgrass prairie ecosystem. Here the tallgrass makes its last stand. Basic Information » Calendar » Current Conditions » Maps » By The Numbers jQuery(document).ready(function(){ var deviceAgent = navigator.userAgent.toLowerCase(); var iOSAgent = deviceAgent.match(/(iphone|ipod|ipad)/); const tooltip = new bootstrap.Tooltip('.disclaimer', { boundary: document.body }); jQuery(".disclaimer").each(function(){ jQuery(this).attr("title", "This figure is based on the number of official National Park Service units in the state. The sites shown on this page may also include sites affiliated with or managed by the National Park Service."); jQuery(this).on('show.bs.tooltip', function () { jQuery(document).data("tooltipShowing", true); }); jQuery(this).on('hide.bs.tooltip', function () { jQuery(document).data("tooltipShowing", false); }); }); // Check onClick event of "container" class to see if a tooltip is open. // If so, close it: iOS touch hack if (iOSAgent) { // mobile code here jQuery(".container").bind('click',function() { if(jQuery(document).data("tooltipShowing") == true){ jQuery(".disclaimer").tooltip("hide"); } }); } }); 5 National Parks 99,019 Visitors to National Parks $8,000,000 Economic Benefit from National Park Tourism » $63,161,299 of Land & Water Conservation Fund Appropriated for Projects (since 1965) » 17 Certified Local Governments » 34 Community Conservation & Recreation Projects (since 1987) » 1 National Heritage Area » 4 National Trails Administered by NPS » 1,594 National Register of Historic Places Listings » 26 National Historic Landmarks » 5 National Natural Landmarks » 230 Places Recorded by Heritage Documentation Programs » 697,076 Objects in National Park Museum Collections » 29 Archeological Sites in National Parks » 3 Teaching with Historic Places Lesson Plans » 9 Discover Our Shared Heritage Travel Itineraries » Print the summary » These numbers are just a sample of the National Park Service's work. Figures are for the fiscal year that ended 9/30/2020. More Information Alerts Events Photos & Multimedia Articles Nationwide News Get Your America the Beautiful Pass! Work With Us'''
