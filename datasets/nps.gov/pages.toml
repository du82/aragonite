title = "Discover History (U.S. National Park Service)"
description = "Find out more about Cultural Resources Programs."
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us History Is Who We Are The National Park Service is one of the United States' leading agencies for understanding history and culture. We preserve historic sites both within national park boundaries and beyond. We offer opportunities to help communities preserve their history. Whether you want to visit an historic national park, discover America's stories, or find assistance to preserve the places that matter to you, we hope you discover something new about our shared history. Cultural Resources Programs Find out more about Cultural Resources Programs. Grant Opportunities Learn about funding opportunities available to your organization or community. Many grants are now open. Climate Adaptation Like natural resources, cultural resources are affected by climate change yet depend on people to withstand climate change. Telling All Americans' Stories These stories and sites are multi-faceted projects explore the legacies of all Americans, including underrepresented groups. Explore NPS Museum Collections Explore its locations, stories, and thousands of objects. Heritage Travel Visit over 3,000 places in over 60 Travel Itineraries Telling Stories in the Parks National Parks each contribute a significant story that helps create the American natural and cultural historic fabric. Cultural Landscapes Discover the intersection of cultural and natural resources. Last updated: March 12, 2024 Search our Historic Photos National Parks Preserving America's Past Teach with objects! Teaching with Museum Collections History of the National Park Service jQuery(document).ready(function() { var subsiteURL = "/portals/history/"; var jsonSrc = ""; var siteCode = subsiteURL.split("/"); siteCode = siteCode[2]; jsonSrc = subsiteURL+"structured_data_portals_"+siteCode+".json"; jQuery.getJSON(jsonSrc, function( data ) { var hasSocialMedia = 0; var outputSocialMedia = '<div class="col