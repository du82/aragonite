title = "Alaska Native Cultures - Alaska (U.S. National Park Service)"
description = "Explore Alaska Native stories of the past, present, and future."
full_description = '''#modal-contact-us .modal-body { padding-top: 0px; } .modal-header { border:none; } Contact Us Alaska Native Cultures blockquote {border-left: 5px solid #fff;} This map shows the indigenous language regions of Alaska. Related languages of neighboring Canada and Russia are also shown. National parks are also shown; click on a national park to explore information concerning the indigenous people traditionally calling those areas home. Krauss, Holton, Kerr, and West. 2011. Indigenous Peoples and Languages of Alaska. Fairbanks and Anchorage: Alaska Native Language Center and UAA Institute of Social and Economic Research. Online: https://www.uaf.edu/anla/collections/map/ Alaska Native people have lived with the land long before it became a state or any national parks were established. Spanning from the temperate rainforests of Southeast, to the tundra of the Interior, the coastal regions of Southcentral and even the remote regions of the Aleutian Islands–Alaska Native people have distinct languages and traditions. Subsistence lifestyles and native customs still thrive in many parks and communities. Traditional ecological knowledge and native place names give us a deeper understanding of the science, history, and beauty of our national parks. Discover Alaska Native culture, past and present, in the articles below. jQuery(document).ready(function() { jQuery('#mapid-9604').imageMapResize(); }); Stories Explore Alaska Native stories of the past, present, and future. People Learn more about Alaska Native people and their long history on these lands. Traditional Knowledge Learn more about the traditional knowledge that feeds the body and souls of Alaska Natives. Subsistence Subsistence is a way of life -- learn about how it sustains Alaska Natives and their cultures here. Alaska Natives and Our Parks Learn more about the rich cultural history and Alaska Native heritage in each NPS unit of Alaska. Understanding the Past Understand culture through oral history, linguistics, Alaska Native art and literature, archaeology, ecology, and biology. jQuery(document).ready(function() { jQuery('#searchListing-42BEF161-920C-384B-D58917C5EAAE5F9E').searchlisting({ searchURL: "/solr/", searchURLReady: "/solr/?q=*&fl=Title,Abstract,Type,Subtype,Sites,Sites_Item,Image_URL,Image_Alt_Text,PageURL&defType=edismax&sort=Date_Last_Modified desc&start=0&fq=Category:\"Articles\" AND (Type:\"Article\" OR Type:\"Person\") AND Tags_Item:\"alaska\" AND (Tags_Item:\"Alaska Native\" OR Tags_Item:\"Native Alaskans\" OR Tags_Item:\"culture\") AND -Tags_Item:\"archaeology\" AND -Tags_Item:\"archeology\" AND -Allow_Listing_Display:false&rows=10", getMetaFields: "Title,Abstract,Type,Subtype,Sites,Sites_Item,Image_URL,Image_Alt_Text,PageURL", frontEndClient: "", perPage: "10", startNum: "0", keywords: "", filterQuery: "Category:\"Articles\" AND (Type:\"Article\" OR Type:\"Person\") AND Tags_Item:\"alaska\" AND (Tags_Item:\"Alaska Native\" OR Tags_Item:\"Native Alaskans\" OR Tags_Item:\"culture\") AND -Tags_Item:\"archaeology\" AND -Tags_Item:\"archeology\" AND -Allow_Listing_Display:false", usesDynamicNavigation: "", sort: "Date_Last_Modified desc", extrasForm: "", extrasForm_keywordField: "", dataTransformJS: "if(\'Type\' in meta && typeof meta[\'Type\'] == \'object\'){ meta[\'Type\'] = meta[\'Type\'].join(\',\'); }var st = metaFieldArr.indexOf(\'Subtype\'); var t = metaFieldArr.indexOf(\'Type\'); if (st !== -1 && t == -1) { metaFieldArr[st] = \'Type\'; if(\'Subtype\' in meta){ meta[\'Type\']=meta[\'Subtype\']; delete meta[\'Subtype\']; }} if(\'Sites\' in meta){ meta[\'Sites\']=meta[\'Sites\'].replace(/,/g , \', \'); }if(\'Type\' in meta){ meta[\'Type\']=meta[\'Type\'].replace(/,/g , \', \'); }if(\'Subtype\' in meta && meta[\'Subtype\'] == \'Series\' ) { delete meta[\'Subtype\']; }if(\'Image_URL\' in meta){ meta[\'Image_URL\'] = meta[\'Image_URL\'].replace(\'/cropped_image/\', \'/cropped_image/secondary/\'); }if(\'Type\' in meta && meta[\'Type\'] !== \