title = "National Security Agency/Central Security Service > Helpful Links > NSA FOIA > Declassification & Transparency Initiatives"
full_description = '''var windowIsLoaded13508=false; var documentIsReady13508=false; function setModuleHeight13508() { var moduleId=".DnnModule-13508"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit13508() { if(windowIsLoaded13508&&documentIsReady13508) { setModuleHeight13508(); window.addEventListener('resize',setModuleHeight13508); } } $(document).ready(function() { documentIsReady13508=true; pdInit13508(); }); $(window).load(function() { windowIsLoaded13508=true; pdInit13508(); }); Declassification & Transparency Initiatives NSA releases declassified records in accordance with the law to promote transparency. Contact Us Overview NSA reviews records and makes them publicly available under the Freedom of Information Act (FOIA) or Mandatory Declassification Review provisions of Executive Order 13526. We periodically conduct "Special Topical Reviews" of categories of records for release. In accordance with the federal Open Government directive, we also identify and release subjects and records for which there is a general public interest. NSA releases the following policies and procedures related to managing and releasing records, which are frequently requested by the public, and other general policies. Browse Policies Archived Releases NSA reviews for declassification all permanently classified documents 25 years or older under the provisions of Executive Order 13526, “Classified National Security Information”, dated 29 December 2009 and routinely releases them to the National Archives Records Administration (NARA). Documents released to NARA include this index of 4,923 entries of approximately 1.3 million pages from the pre-World War I period through the end of World War II; and this index of entries of more than 50,000 pages covering the period from before World War 1 through the 1960s. .smalltext22 a{ color:#4448ac; } FOIA Reports and Releases NSA releases annual FOIA reports and other declassified documents to promote transparency. Browse Documents NSA Inspector General Reports This collection contains semi-annual reports to Congress and summaries of investigations conducted by NSA's Inspector General that are responsive to multiple FOIA requests. View Reports Historical Releases NSA releases archived materials on special topics, including documents, events and figures. Search Releases .smalltext22 a{ color:#4448ac; } Internal Periodicals & Publications NSA releases archived periodicals and publications frequently requested by the public. Browse Pubs'''
