ule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } National Centers of Academic Excellence in Cybersecurity Watch an NCAE Story HomeAcademicsCenters of Academic Excellence jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); .learnmore{ position: absolute; bottom: 0; width: 100%; font-family: 'Teko-Light', sans-serif; font-size: 0.7em; font-weight: 300; display: flex; flex-direction: row; justify-content: flex-end; } .learnmore button{ background-color: transparent; border: none; } .learnmore a{ text-decoration: none; } .learnmore a:hover{ text-decoration: underline; } .learnmore .fa-angle-right{ color: #87C232; } .btn-lg { padding: 10px 0 0 0; font-size: 2.3em; line-height: 1.3333333; border-radius: 6px; color: #86C232; margin-left: -15px; justify-content: right; align-content: normal; } The National Centers of Academic Excellence in Cybersecurity (NCAE-C) program is managed by NSA's National Cryptologic School. Federal partners include the Cybersecurity and Infrastructure Security Agency (CISA), the Federal Bureau of Investigation (FBI), the National Institute of Standards and Technology (NIST)/National Initiative on Cybersecurity Education (NICE), the National Science Foundation (NSF), the Department of Defense Office of the Chief Information Officer (DoD-CIO), and U.S. Cyber Command (USCYBERCOM). NCAE-C program aims to create and manage a collaborative cybersecurity educational program with community colleges, colleges, and universities that: Establishes standards for cybersecurity curriculum and academic excellence, Includes competency development among students and faculty, Values community outreach and leadership in professional development, Integrates cybersecurity practice within the institution across academic disciplines, Actively engages in solutions to challenges facing cybersecurity education. Academic institutions may choose from three designations. The designation process is a combination of elements related to the institution focused on outputs for determining academic achievement. This combination assures that the institution meets the desired characteristics of a CAE institution, and that the academic delivery to students is producing the qualified workforce needed by the nation. CAE-designated institutions must complete validation of a Program of Study, which is a series of courses and experiences that a student can reasonably accomplish in the course of attaining a degree or completing a certificate. Contact Us .smalltext22 a{ color:#4448ac; } Cyber Defense The CAE-CD designation is awarded to regionally accredited academic institutions offering cybersecurity degrees and/or certificates at the associate, bachelor’s and graduate levels. Learn More Cyber Research The CAE-R designation is awarded to DoD schools, PhD producing military academies, or regionally accredited, degree granting four-year institutions rated by the Carnegie Foundation Basic Classification system as either a Doctoral University - Highest Research Activity, Doctoral University - Higher Research Activity, or Doctoral University - Moderate Research Activity. Learn More Cyber Operations The CAE-CO program is a deeply technical, interdisciplinary, higher education program firmly grounded in the computer science, computer engineering, and/or electrical engineering disciplines, with extensive opportunities for hands-on applications via labs and exercises. Learn More .smalltext22 a{ color:#4448ac; } Program Resources NCAE program guidance, resources and requirements are available. Learn More Current NCAE Institutions A list of NCAE colleges and universities is available. View List NCAE Program Book NCAE publishes a program book for your convenience. Download'''
