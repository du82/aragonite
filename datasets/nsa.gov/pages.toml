full_description = '''var windowIsLoaded12973=false; var documentIsReady12973=false; function setModuleHeight12973() { var moduleId=".DnnModule-12973"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit12973() { if(windowIsLoaded12973&&documentIsReady12973) { setModuleHeight12973(); window.addEventListener('resize',setModuleHeight12973); } } $(document).ready(function() { documentIsReady12973=true; pdInit12973(); }); $(window).load(function() { windowIsLoaded12973=true; pdInit12973(); }); .herotitle{ color: white; font-family: 'Teko-Semibold', sans-serif; font-size: 5rem; font-weight: bold; text-align: center; padding-top: 2%; display: flex; justify-content: center; flex-direction: row; } .herosmall{ font-size: 2rem; font-family: 'Roboto-Thin', sans-serif; color: #ffffff; line-height: 125%; padding-top: 0%; font-weight: normal; text-align:center; padding-bottom: 5%; display: flex; justify-content: center; } .animate{ display: flex; justify-content: center; align-items: center; margin-top: 65px; } /* Style the button and place it in the middle of the container/image */ .animate .btn { background-color:#262626; border-radius:1px; border:2px solid #86C232; display:inline-block; cursor:pointer; color:#ffffff; font-family:'Teko-Light', sans-serif; font-size:2rem; margin-top:-10%; padding-left: 25px; padding-right: 25px; padding-top: 5px; padding-bottom: 2px; text-transform:uppercase; display: flex; justify-content: center; } .animate .btn:hover { background-color: #86C232; color:#262626; } .animate .btn a { color: #ffffff; } .animate .btn a:hover { background-color: #86C232; color:#262626 !important; } .DnnModule.DnnModule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } Operating Under Legal Authorities NSA operates within its legal authorities to execute its cybersecurity and foreign signals intelligence missions. Contact Us .sections{ display:flex; flex-wrap: wrap; flex-direction: row; justify-content: center; width:100%; } .sections h1{ font-family: 'Teko-Light', sans-serif; text-align: center; color:black; font-size:4em; } .section-text h2{ font-family: 'Teko-Medium',sans-serif; text-align: left; color:#4448AC; font-size:2.5rem; font-weight:bold; } .inner-section{ display:flex; flex-direction:column; margin: 10px 40px; width:75%; position:relative; } .section-text { font-size: 1.5rem; display:block; flex-direction: column; justify-content: center; color: black; text-align: left; padding: 0px 14px 0px 14px; font-family: 'Roboto-Light',sans-serif; margin-bottom: 40px; } .learnmore{ position: absolute; bottom: 0; width: 100%; font-family: 'Teko-Light', sans-serif; font-size: 0.7em; font-weight: 300; display: flex; flex-direction: row; justify-content: flex-end; } .learnmore button{ background-color: transparent; border: none; } .learnmore a{ text-decoration: none; } .learnmore a:hover{ text-decoration: underline; } .learnmore .fa-angle-right{ color: #87C232; } .btn-lg { padding: 10px 0 0 0; font-size: 2.3em; line-height: 1.3333333; border-radius: 6px; color: #86C232; margin-left: -15px; justify-content: right; align-content: normal; } Overview The rule of law plays a vital role in not only the conduct of NSA's operations but also the security of our nation. One of NSA's core values is respect for the law, and the agency is committed to ensuring that its missions are grounded in adherence to the U.S. Constitution and compliance with the U.S. laws, regulations, and policies that govern its activities. NSA operates within the legal authorities that task us to execute our missions on behalf of the nation's security. NSA’s Office of General Counsel ensures we properly and reliably execute our cybersecurity and signals intelligence missions consistent with these authorities. .smalltext22 a{ color:#4448ac; } Executive Order 12333 and National Security Council Intelligence Directive 6 As set forth in Executive Order 12333 and National Security Council Intelligence Directive 6, NSA collects, processes, analyzes, produces, and disseminates signals intelligence (SIGINT) information for foreign intelligence and counterintelligence purposes as part of NSA's role as a combat support agency in the Department of Defense. NSA SIGINT develops insights on our adversaries to provide the nation a decisive information advantage in competition, crisis, or conflict. Read More Foreign Intelligence Surveillance Act of 1978 (FISA) The FISA of 1978 codifies rules for requesting authorization to collect electronic communications within the United States by compelling assistance from U.S. service providers. NSA relies on FISA authorizations to acquire significant foreign intelligence with the approval and oversight of the Foreign Intelligence Surveillance Court. By law, all FISA activities must be conducted consistent with the Fourth Amendment to the Constitution. Read More National Security Directive 42 (NSD-42) NSD-42 designates NSA as the National Manager for National Security Systems (NSS) (i.e., telecommunications and information systems operated by the U.S. Government). In this capacity, NSA acts as the focal point for cryptography, telecommunications systems security, and information systems security for NSS. NSA Cybersecurity aims to prevent and eradicate cyber threats to thwart foreign adversaries and defend vital networks. Read NSD-42'''
