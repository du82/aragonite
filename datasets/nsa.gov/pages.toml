title = "National Security Agency/Central Security Service > About  > Frequently Asked Questions (FAQ)"
full_description = '''var windowIsLoaded14113=false; var documentIsReady14113=false; function setModuleHeight14113() { var moduleId=".DnnModule-14113"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit14113() { if(windowIsLoaded14113&&documentIsReady14113) { setModuleHeight14113(); window.addEventListener('resize',setModuleHeight14113); } } $(document).ready(function() { documentIsReady14113=true; pdInit14113(); }); $(window).load(function() { windowIsLoaded14113=true; pdInit14113(); }); Frequently Asked Questions (FAQs) HomeAboutFrequently Asked Questions (FAQ) jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); The National Security Agency/Central Security Service (NSA/CSS) is a key member of the Intelligence Community and, by its very nature, requires a high degree of confidentiality. The Agency collects, processes, and disseminates intelligence information from foreign electronic signals for national foreign intelligence and counterintelligence purposes and to support military operations. NSA/CSS is also tasked with preventing foreign adversaries from gaining access to classified national security information. The answers to some of the most common questions about NSA/CSS can be found in the following categories: Collapse All Expand All Cryptologic Heritage What is cryptology? How has cryptology influenced American history? Where can I learn more about our nation's cryptologic heritage? 1. What is cryptology? Cryptology is the art and science of making and breaking codes and ciphers. NSA is responsible for creating the systems that protect U.S. communications and for analyzing systems and communications used by foreign powers. Making a code or cipher system is called cryptography. Those who try to "break" a cryptosystem are practicing cryptanalysis. 2. How has cryptology influenced American history? Code making and code breaking have influenced America's history. During the Civil War, both Union and Confederate soldiers sent encrypted messages and intercepted enemy communications. In 1917, British decryption of the Zimmermann Telegram helped push the United States into World War I. Intelligence derived by solving many Japanese and German systems gave Allied forces an edge in many World War II battles - on land and at sea - arguably shortening the war and saving countless lives. Protecting U.S. communications was likewise as important to the Allied victory in WWII as reading the enemy's messages. The Marine Corps and Army trained Native Americans in radio communications. They used their own languages and code words to confuse enemy soldiers who may have been listening. The Army and Navy also used the SIGABA, an extremely complex cipher machine, to encrypt messages. The enemy never broke the Navajo code talkers or the SIGABA code, giving the United States a clear advantage. The Cold War saw cryptology foster the development of new communications and computer technology. Today's supercomputers, encrypted cell phones, and verification systems owe some of their development to work done for the NSA/CSS. The NSA continues to provide and protect vital information, shaping America's history and contributing to the nation's cryptologic heritage. 3. Where can I learn more about our nation's cryptologic heritage? The National Cryptologic Museum collection contains thousands of artifacts illustrating the rich history of cryptology. The museum also has a research library with a unique collection of commercial code books, declassified NSA documents, and transcribed oral histories. The museum, adjacent to NSA headquarters in Fort Meade, Maryland, is open to the public. School groups and civic organizations are welcome. Group tours may be scheduled in advance by calling 301-688-5849. Employment/Business Opportunities Who works at the National Security Agency/Central Security Service? How do I become an NSA employee? My company can help NSA. How can I get a contract? Can NSA help my company test its systems for security or protect its information? I need to verify employment of an NSA employee. Where do I go? 1. Who works at the National Security Agency/Central Security Service (NSA/CSS)? The NSA/CSS workforce comprises civilian employees and military service members-Army, Navy, Air Force, Marine Corps, and Coast Guard. An array of professionals is represented including: mathematicians, civil engineers, electrical engineers, intelligence analysts, language analysts, physicists, computer scientists, researchers, security officers, data flow experts, budget analysts, contract specialists, finance managers, and many more. 2. How do I become an NSA employee? As one of the nation's premiere intelligence agencies, NSA offers unique and challenging employment opportunities. Because we protect some of our nation's most coveted information while exploiting that of our adversaries, each NSA employee must be a loyal, trustworthy U.S. citizen and must qualify for a TOP SECRET clearance. For more about careers and the hiring process, visit the careers section of our web site and check out full-time employment opportunities or one of the many scholarship, internship, or high school work/study programs. Once you find something that fits your interests and qualifications, you can apply online. 3. My company can help NSA. How can I get a contract? Register with the NSA Acquisition Resource Center at www.nsaarc.net to highlight your company's capabilities and identify a point of contact. For more information, visit the Doing Business With Us section. 4. Can NSA help my company test its systems for security or protect its information? As part of our cybersecurity mission, NSA provides guidance, products, and services to protect classified and unclassified national security systems against exploitation from interception, unauthorized access, or related technical intelligence threats. If your company provides support to defense or national security, you may qualify for assistance. Check the cybersecurity section of our web site for more information. 5. I need to verify employment of an NSA employee. Where do I go? National Security Agency has implemented a new automated Verification of Employment (VOE) process for current NSA employees. As such, NSA will no longer accept VOE requests via fax or phone from external third party companies. Third party requests will only be accepted for previous NSA employees. Please clearly state that the employee is a previous employee in your request. Current NSA employees must use the new streamlined tool to submit requests directly to the VOE office. For questions call the VOE Office - 301-688-8713 The hours of operation are - 8:00 a.m. and 3:00 p.m. FISA Section 702What is FISA Section 702? Section 702 of the Foreign Intelligence Surveillance Act (FISA) is a key foreign intelligence authority that helps keep the United States, its citizens, and allies safe and secure. The authority allows the U.S. government to collect information from individual foreign intelligence targets located overseas who use U.S. electronic communications services such as email and telephone. Intelligence from Section 702 is used every day to protect the nation from critical threats, inform U.S. Government strategy, and save American lives. How does NSA decide which foreign persons to target with FISA Section 702? NSA uses the authority to collect the communications of specified foreign targets likely to possess, receive, or communicate foreign intelligence information. NSA’s use of Section 702 authority is highly focused and limited - acquiring the communications of specific foreign actors overseas and using those details to answer intelligence requirements given to NSA by U.S. policymakers, such as illuminating terrorist plots, understanding the strategic intentions of China, Russia, North Korea, and Iran, and identifying cyber threats to the United States and its allies. Does NSA use FISA Section 702 to target Americans? The exclusive focus of 702 is specific foreign persons who are physically located outside of the U.S. and who have or are likely to communicate foreign intelligence that satisfies the carefully vetted intelligence requirements of U.S. policy makers. The targeting of a foreign person with the goal of gathering the communications of an American is strictly prohibited. Other provisions of FISA address the circumstances in which the government may seek court approval to conduct electronic surveillance against an American. How does NSA ensure FISA Section 702 is compliant with the law? The government has instituted many safeguards and levels of oversight to ensure that NSA uses FISA Section 702 lawfully and in a way that protects the privacy and civil liberties of Americans. These safeguards include a comprehensive and robust internal oversight program, as well as, external oversight from all three branches of government, including by the U.S. Congress, federal judges, and independent review by the U.S. Privacy and Civil Liberties Oversight Board, which has issued public statements and reports on the effectiveness of NSA’s compliance program. In addition, the government has reaffirmed its commitment to using this authority in ways that protect the privacy and civil liberties of non-U.S. persons through Executive Order 14086. Is there an alternative foreign intelligence authority that could replace 702? No, there is no substitute for 702. Much of the U.S. government’s most valuable intelligence, including from high-priority targets, relies on Section 702 collection. The authority, which expires in December 2023, provides irreplaceable insights into this country’s most pressing national security concerns. Since Congress enacted the authority in 2008, the U.S. Intelligence Community’s lawful and appropriate use of 702 has provided critical military and intelligence insights, including into some of the world’s most dangerous foreign actors. Oversight How are the activities of the NSA/CSS regulated and who monitors them? What defines the Intelligence Role of NSA/CSS? Who is considered a U.S. Person? Are U.S. persons outside of the United States afforded protection? Couldn't NSA simply ask its allies to provide them with information about U.S. persons? How does the NSA/CSS ensure its employees are aware of and abide by the regulations? How can I find out if the government has records on me? Where can I report government fraud, waste and abuse? 1. How are the activities of the NSA regulated and who monitors them? The U.S. Constitution, federal law, executive order, and regulations of the Executive Branch govern NSA's activities. As a Defense Agency, NSA operates under the authority of the Department of Defense. As a member of the Intelligence Community, NSA also operates under the Office of the Director of National Intelligence. NSA/CSS activities are subject to strict scrutiny and oversight both from outside and from within. External bodies such as the House Permanent Select Committee on Intelligence (HPSCI) and the Senate Select Committee on Intelligence (SSCI), the President's Intelligence Oversight Board, the Foreign Intelligence Surveillance Court, the Department of Defense, the Office of the Director of National Intelligence, and the Department of Justice help ensure that NSA adheres to U.S. laws and regulations that are applicable to the Agency's activities. Internally, the Office of the Inspector General conducts inspections, audits, and investigations to make certain that NSA/CSS operates with integrity, efficiency, and effectiveness while the Office of the General Counsel provides legal advice. The Office of Compliance ensures the Agency conforms to the standards, policies, and standards under which it operates. Most importantly, each NSA/CSS employee is charged with knowing, understanding, and obeying to the fullest the laws of the nation. 2. What defines the intelligence role of NSA? Executive Order 12333 (EO 12333) authorizes agencies of the intelligence community to obtain reliable intelligence information, consistent with applicable Federal law and EO 12333, with full consideration of the rights of U.S. persons. Pursuant to EO 12333, NSA is authorized to collect, process, analyze, produce, and disseminate signals intelligence information and data for foreign intelligence and counterintelligence purposes to support national and departmental missions, and to provide signals intelligence support for the conduct of military operations. The executive order, however, prohibits the collection, retention, or dissemination of information about U.S. persons except pursuant to procedures established by the head of the agency and approved by the Attorney General. 3. Who is considered a U.S. Person? Federal law and executive order define a U.S. Person as: A citizen of the United States; An alien lawfully admitted for permanent residence; An unincorporated association with a substantial number of members who are citizens of the U.S. or are aliens lawfully admitted for permanent residence; or, A corporation that is incorporated in the U.S. 4. Are U.S. persons outside of the United States afforded protection? Yes, the privacy rights of U.S. persons are protected regardless of their location. 5. Couldn't NSA simply ask its allies to provide them with information about U.S. persons? NSA is prohibited from requesting an ally to undertake activities that NSA itself is prohibited from conducting. 6. How does the NSA ensure its employees are aware of and abide by the regulations? The NSA conducts extensive training of its employees to ensure that the work force is aware of and understands the regulations governing NSA activities. The members of the NSA workforce charged with foreign intelligence production receive very specific training advising them of their responsibility to protect the privacy of U.S. persons. Access to intelligence information is contingent upon the completion of such training sessions. 7. How can I find out if the government has records on me? Both the Freedom of Information Act (FOIA) and the Privacy Act (PA) establish procedures for individuals to seek access to government records. The FOIA is a statute that gives anyone the right to seek access to government records. Since NSA is authorized by law to collect only foreign intelligence information, we would not ordinarily expect to find intelligence information about U.S. persons. Although you may submit a FOIA reques'''
