title = "Joint Publications Focus on Mitigation Strategies for Edge Devices > National Security Agency/Central Security Service > Press Release View"
description = "FORT MEADE, Md. - The National Security Agency (NSA) has joined the Australian Signals Directorate’s Australian Cyber Security Centre (ASD’s ACSC), the Canadian Centre for Cyber Security"
full_description = '''HomePress RoomPress Releases & StatementsPress Release View jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); PHOTO INFORMATION Download Details Share CSI: Mitigation Strategies for Edge Devices CSI: Mitigation Strategies for Edge Devices window.delayInitMediaElementJs = true; function toggleInfo(event) { $("#adetail-slick-gallery").toggleClass('open');; sizeSlideInfo(); } function GalleryInit() { var $gallery = $("#adetail-slick-gallery"); $gallery.on('init', function () { initMediaElementJs(); }).slick({ fade: true, adaptiveHeight: true }); $gallery.on('afterChange, setPosition', function (event, currentSlide) { $gallery.animate({ height: $('.slick-current .item').first().height() + 'px' }, 300); sizeSlideInfo(); }); } function sizeSlideInfo() { var $gallery = $("#adetail-slick-gallery"); var $info = $gallery.siblings('.slide-info'); var infoContent = $('.slick-current').find('.slide-info-hidden').html(); let h = $info.height(); if ($gallery.hasClass('open')) { $info.css('height', h + 'px') .empty() .html(infoContent) .animate({ height: $info.find('.slide-info-inner').outerHeight() + 'px' }, 300); } else { $info.css('height', '0'); } } $(window).load(function() { GalleryInit(); }); jQuery(document).ready(function() { var prm = Sys.WebForms.PageRequestManager.getInstance(); if (prm){ if(typeof GalleryInit == 'function'){ prm.add_endRequest(GalleryInit); } } }); jQuery(document).ready(function() { var prm = Sys.WebForms.PageRequestManager.getInstance(); if (prm){ if(typeof SlideshowInit == 'function'){ prm.add_endRequest(SlideshowInit); } } }); Press Release | Feb. 4, 2025 Joint Publications Focus on Mitigation Strategies for Edge Devices FORT MEADE, Md. - The National Security Agency (NSA) has joined the Australian Signals Directorate’s Australian Cyber Security Centre (ASD’s ACSC), the Canadian Centre for Cyber Security (CCCS), and others to release three Cybersecurity Information Sheets (CSIs) that highlight critically important mitigation strategies for securing edge device systems, including firewalls, routers, and virtual private network (VPN) gateways. Collectively, these reports – “Mitigation Strategies for Edge Devices: Executive Guidance,” “Mitigation Strategies for Edge Devices: Practitioners Guidance,” and “Security Considerations for Edge Devices” – provide a high level summary of existing guidance for securing edge devices, with comprehensive recommendations for tactical, operational, and strategic audiences to enhance network security and improve resilience against cyber threats. “Edge devices act as boundaries between organizations’ internal enterprise networks and the Internet; if left unsecured, even unskilled malicious cyber actors have an easier time finding and exploiting vulnerabilities in their software or configurations,” said Eric Chudow, an NSA cybersecurity vulnerability analysis subject matter expert. “As organizations scale their enterprises, even though securing all devices is important, prioritizing edge device security is vital to defend the many endpoints, critical services, and sensitive data they protect.” The guide, “Mitigation Strategies for Edge Devices: Executive Guidance” is intended for executives within large organizations and critical infrastructure sectors responsible for the deployment, security, and maintenance of enterprise networks. It outlines seven key mitigation strategies for managing and securing edge devices within traditional network architectures: Know the edge Procure secure-by-design devices Apply hardening guidance, updates, and patches Implement strong authentication Disable unneeded features and ports Secure management interfaces Centralize monitoring for threat detection The companion guide, “Mitigation Strategies for Edge Devices: Practitioners Guidance,” is written for operational, cybersecurity, and procurement staff and provides an overview of what edge devices are; risks and threats to them; relevant frameworks and controls by some of the authoring nations; and a more in depth discussion on the seven mitigation strategies. Additionally, the report includes a case study of a successful exploitation to show how malicious actors compromise edge devices when they are not secured properly and to highlight further how edge devices are critical to the security of a network. Expanding on the other reports, the “Security Considerations for Edge Devices” guidance details threats to edge devices from common malicious techniques and ways organizations can reduce the risk of compromise with mitigation recommendations. The publication also outlines factors organizations should consider when evaluating the security of edge devices, along with recommendations for edge device manufacturers to improve the built-in and default security of devices they produce. Additional co-sealers for the ASD’s ACSC guides are the Cybersecurity and Infrastructure Security Agency (CISA); the United Kingdom’s National Cyber Security Centre (NCSC-UK); New Zealand’s National Cyber Security Centre (NCSC-NZ); Netherlands’ General Intelligence and Security Service (AIVD) and Military Intelligence and Security Service (MIVD); Czech Republic’s National Cyber and Information Security Agency (NUKIB); Japan’s National Center of Incident Readiness and Strategy for Cybersecurity (NISC), National Police Agency, and Computer Emergency Response Team (JPCERT); and the Republic of Korea’s National Intelligence Service (NIS) and NIS’ National Cyber Security Center (NCSC). Read the full reports: Mitigation Strategies for Edge Devices: Executive Guidance Mitigation Strategies for Edge Devices: Practitioners Guidance Security Considerations for Edge Devices Visit our full library for more cybersecurity information and technical guidance. NSA Media Relations MediaRelations@nsa.gov 443-634-0721 SHARE PRINT Related Documents CSI: Security Considerations for Edge Devices CSI: Security Considerations for Edge Devices: Practitioner Guidance CSI: Security Considerations for Edge Devices: Executive Guidance edge devices mitigation for edge devices securing edge devices var displayNextPrevNav = false var loggedIn = false; var articleId = 4052657; var moduleId = 12594; var mejPlayer; $(function () { if (!window.delayInitMediaElementJs) initMediaElementJs(); }); function initMediaElementJs() { mejPlayer = $(".article-view video").not(".noplayer").mediaelementplayer({ pluginPath: "/desktopmodules/SharedLibrary/Plugins/MediaElement4.2.9/", videoWidth: '100%', videoHeight: '100%', success: function (mediaElement, domObject) { var aDefaultOverlay = jQuery(mediaElement).parents('.media-inline-video, .video-control').find('.defaultVideoOverlay.a-video-button'); var aHoverOverlay = jQuery(mediaElement).parents('.media-inline-video, .video-control').find('.hoverVideoOverlay.a-video-button'); var playing = false; $("#" + mediaElement.id).parents('.media-inline-video, .video-control').find('.mejs__controls').hide(); if (typeof GalleryResize === "function") GalleryResize(); mediaElement.addEventListener('play', function (e) { playing = true; jQuery(".gallery").trigger("pause", false, false); $("#" + e.detail.target.id).parents('.media-inline-video, .video-control').find('.mejs__controls').show(); $("#" + e.detail.target.id).parents('.media-inline-video, .video-control').find('.duration').hide(); if (aDefaultOverlay.length) { aDefaultOverlay.hide(); aHoverOverlay.hide(); } //place play trigger for DVIDS Analytics }, false); mediaElement.addEventListener('pause', function (e) { playing = false; if (aDefaultOverlay.length) { aDefaultOverlay.removeAttr("style"); aHoverOverlay.removeAttr("style"); } }, false); mediaElement.addEventListener('ended', function (e) { playing = false; }, false); if (aDefaultOverlay.length) { aDefaultOverlay.click(function () { if (!playing) { mediaElement.play(); playing = true; } }); aHoverOverlay.click(function () { if (!playing) { mediaElement.play(); playing = true; } }); } }, features: ["playpause", "progress", "current", "duration", "tracks", "volume", "fullscreen"] }); if (displayNextPrevNav) { DisplayNextPreviousNav(moduleId, articleId, loggedIn); } } $(window).load(function () { if (displayNextPrevNav) { var winWidth = $(document).width(); if (winWidth > 1024) { $('#footerExtender').css('height', '0px'); $('.article-navbtn .headline').addClass('contentPubDate'); } else { $('#footerExtender').css('height', $('.article-navbtn .headline').html().length > 0 ? $('.bottomNavContainer').height() + 'px' : '0px'); $('.article-navbtn .headline').removeClass('contentPubDate'); } } }); $(window).resize(function () { if (displayNextPrevNav) { var winWidth = $(document).width(); if (winWidth < 1024) { $('#footerExtender').css('height', $('.article-navbtn .headline').html().length > 0 ? $('.bottomNavContainer').height() + 'px' : '0px'); $('.article-navbtn .headline').removeClass('contentPubDate'); } else { $('#footerExtender').css('height', '0px'); $('.article-navbtn .headline').addClass('contentPubDate'); } } });'''
