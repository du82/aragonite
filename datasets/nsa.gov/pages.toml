full_description = '''var windowIsLoaded12744=false; var documentIsReady12744=false; function setModuleHeight12744() { var moduleId=".DnnModule-12744"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit12744() { if(windowIsLoaded12744&&documentIsReady12744) { setModuleHeight12744(); window.addEventListener('resize',setModuleHeight12744); } } $(document).ready(function() { documentIsReady12744=true; pdInit12744(); }); $(window).load(function() { windowIsLoaded12744=true; pdInit12744(); }); .herotitle{ color: white; font-family: 'Teko-Semibold', sans-serif; font-size: 5rem; font-weight: bold; text-align: center; padding-top: 2%; display: flex; justify-content: center; flex-direction: row; } .herosmall{ font-size: 2rem; font-family: 'Roboto-Thin', sans-serif; color: #ffffff; line-height: 125%; padding-top: 0%; font-weight: normal; text-align:center; padding-bottom: 5%; display: flex; justify-content: center; } .animate{ display: flex; justify-content: center; align-items: center; margin-top: 65px; } /* Style the button and place it in the middle of the container/image */ .animate .btn { background-color:#262626; border-radius:1px; border:2px solid #86C232; display:inline-block; cursor:pointer; color:#ffffff; font-family:'Teko-Light', sans-serif; font-size:2rem; margin-top:-10%; padding-left: 25px; padding-right: 25px; padding-top: 5px; padding-bottom: 2px; text-transform:uppercase; display: flex; justify-content: center; } .animate .btn:hover { background-color: #86C232; color:#262626; } .animate .btn a, a:link, a:visited { color: #ffffff; } .animate .btn a:hover { background-color: #86C232; color:#262626 !important; } .DnnModule.DnnModule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } Civil Liberties and Privacy Protections NSA strives to build public trust in our ability to uphold civil liberties and privacy values through transparency. Contact Us Overview As a member of the nation's Intelligence Community, NSA is held accountable for upholding the laws of the land while providing critical foreign intelligence information to keep America and its allies safe and secure. As part of this, NSA is required by law to protect the freedoms, civil liberties, and privacy rights of Americans while accomplishing important national security missions. Learn More Leadership NSA’s Civil Liberties, Privacy, & Transparency (CLPT) Office director is the primary advisor on the protection of civil liberties and privacy to NSA senior leadership. This advisor represents NSA's interests in the privacy arena by engaging with key stakeholders, overseers, the private sector, and the public to better understand their concerns. In this role, the CLPT director serves as the lead for promoting and integrating civil liberties and privacy protections into NSA policies, plans, procedures, technology, programs, and activities. As rules and oversight evolve over time, having a single official who is dedicated to these issues helps NSA stay on top of changes and bring new perspectives on how best to consider civil liberties and privacy while conducting mission work. Read Bio CLPT Reports NSA releases reports in accordance with the law to promote transparency of our mission activities. Read Reports CLPT Documents These core reports and documents guide NSA in our civil liberties and privacy work. Review Documents CLPT Resources Various resources and partners support our privacy and civil liberties work. Learn More'''
