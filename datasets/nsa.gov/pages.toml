full_description = '''var windowIsLoaded15640=false; var documentIsReady15640=false; function setModuleHeight15640() { var moduleId=".DnnModule-15640"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit15640() { if(windowIsLoaded15640&&documentIsReady15640) { setModuleHeight15640(); window.addEventListener('resize',setModuleHeight15640); } } $(document).ready(function() { documentIsReady15640=true; pdInit15640(); }); $(window).load(function() { windowIsLoaded15640=true; pdInit15640(); }); Collaborative Partnerships Scaling security through partnerships to prevent, detect, and defeat cyber adversaries. Our Relationships At the Cybersecurity Collaboration Center (CCC), NSA establishes collaborative relationships to prevent, detect, and defeat cyber adversaries targeting our nation’s most sensitive networks. These relationships include bi-directional cyber threat intelligence sharing with major IT and cybersecurity companies who are best positioned to scale defensive impacts. Together, the CCC and our partners have hardened billions of endpoints across the globe against foreign malicious cyber activity. var windowIsLoaded15834=false; var documentIsReady15834=false; function setModuleHeight15834() { var moduleId=".DnnModule-15834"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit15834() { if(windowIsLoaded15834&&documentIsReady15834) { setModuleHeight15834(); window.addEventListener('resize',setModuleHeight15834); } } $(document).ready(function() { documentIsReady15834=true; pdInit15834(); }); $(window).load(function() { windowIsLoaded15834=true; pdInit15834(); }); Bi-Directional Partnerships Our partnerships are underpinned by Non-Disclosure Agreements that protect the privacy of each entity. They focus on core technology products and sectors including but not limited to: Cloud Service Providers Content Delivery Network Endpoint Protection Incident Response Internet Service Providers Network Security Operational Technology Security Threat Intelligence Interested in pursuing a partnership? If you believe you may be eligible for a collaborative partnership, reach out today to start our vetting process. Start Here Enduring Security Framework The Enduring Security Framework (ESF) is a public-private partnership that aims to address risks that threaten critical infrastructure and National Security Systems (NSS). ESF is charged with bringing together representatives from private and public sectors to work on intelligence-driven, shared cybersecurity challenges. ESF produces cybersecurity guidance on chronic challenges, jointly developed by NSA, CISA and industry partners. Read More'''
