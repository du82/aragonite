full_description = '''HomeSite Policies jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); .hi-main-barn-16722 { background-color:#B80202;color:#fff} .hi-outern-16722{ margin-bottom:15px} .hi-main-barn-16722:hover{ background-color:#d40202 } .hi-main-barn-16722.hot{ cursor:pointer} Be CYBERSMART: NSA does not contact individuals about recovering money, funds, or cryptocurrency. Some websites and emails try to mislead members of the public into thinking they are official U.S. government websites. Internet sites ending in the ".gov" top-level domain suffix are official government websites with secure HTTPS connections. Official U.S. government email addresses also end in ".gov," and any correspondence coming from an address that does not end with ".gov" should be considered suspect. Learn more from our partners here about how you can protect yourself! $(document).ready(function () { $('.hi-main-barn-16722').click(function () { var target = '_blank'; var win = window.open('https://www.fbi.gov/how-we-can-help-you/scams-and-safety', target); win.focus(); }) }); $(document).ready(function () { $('.hi-admin-sliden-16722').click(function () { var slideoutMenu = $(this).closest(".hi-admin-outer"); slideoutMenu.toggleClass("open"); if (slideoutMenu.hasClass("open")) { slideoutMenu.animate({ right: "0px" }); } else { slideoutMenu.animate({ right: -310 }, 250); } }); }); Site Policies and Terms of Use AGREEMENT BETWEEN USER AND National Security Agency/Central Security Service The National Security Agency/Central Security Service Web Site is comprised of various Web pages operated by National Security Agency/Central Security Service. The National Security Agency/Central Security Service Web Site is offered to you conditioned on your acceptance without modification of the terms, conditions, and notices contained herein. Your use of the National Security Agency/Central Security Service Web Site constitutes your agreement to all such terms, conditions, and notices. MODIFICATION OF THESE TERMS OF USE National Security Agency/Central Security Service reserves the right to change the terms, conditions, and notices under which the National Security Agency/Central Security Service Web Site is offered, including but not limited to the charges associated with the use of the National Security Agency/Central Security Service Web Site. LINKS TO THIRD PARTY SITES The National Security Agency/Central Security Service Web Site may contain links to other Web Sites ("Linked Sites"). The Linked Sites are not under the control of National Security Agency/Central Security Service and National Security Agency/Central Security Service is not responsible for the contents of any Linked Site, including without limitation any link contained in a Linked Site, or any changes or updates to a Linked Site. National Security Agency/Central Security Service is not responsible for webcasting or any other form of transmission received from any Linked Site. National Security Agency/Central Security Service is providing these links to you only as a convenience, and the inclusion of any link does not imply endorsement by National Security Agency/Central Security Service of the site or any association with its operators. NO UNLAWFUL OR PROHIBITED USE As a condition of your use of the National Security Agency/Central Security Service Web Site, you warrant to National Security Agency/Central Security Service that you will not use the National Security Agency/Central Security Service Web Site for any purpose that is unlawful or prohibited by these terms, conditions, and notices. You may not use the National Security Agency/Central Security Service Web Site in any manner which could damage, disable, overburden, or impair the National Security Agency/Central Security Service Web Site or interfere with any other party's use and enjoyment of the National Security Agency/Central Security Service Web Site. You may not obtain or attempt to obtain any materials or information through any means not intentionally made available or provided for through the National Security Agency/Central Security Service Web Sites. USE OF COMMUNICATION SERVICES The National Security Agency/Central Security Service Web Site may contain bulletin board services, chat areas, news groups, forums, communities, personal web pages, calendars, and/or other message or communication facilities designed to enable you to communicate with the public at large or with a group (collectively, "Communication Services"), you agree to use the Communication Services only to post, send and receive messages and material that are proper and related to the particular Communication Service. By way of example, and not as a limitation, you agree that when using a Communication Service, you will not: Defame, abuse, harass, stalk, threaten or otherwise violate the legal rights (such as rights of privacy and publicity) of others. Publish, post, upload, distribute or disseminate any inappropriate, profane, defamatory, infringing, obscene, indecent or unlawful topic, name, material or information. Upload files that contain software or other material protected by intellectual property laws (or by rights of privacy of publicity) unless you own or control the rights thereto or have received all necessary consents. Upload files that contain viruses, corrupted files, or any other similar software or programs that may damage the operation of another's computer. Advertise or offer to sell or buy any goods or services for any business purpose, unless such Communication Service specifically allows such messages. Conduct or forward surveys, contests, pyramid schemes or chain letters. Download any file posted by another user of a Communication Service that you know, or reasonably should know, cann