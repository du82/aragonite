description = "FORT MEADE, Md. - The National Security Agency (NSA) joins the Cybersecurity and Infrastructure Security Agency (CISA) and other organizations to publish guidance helping operational technology (OT)"
full_description = '''HomePress RoomPress Releases & StatementsPress Release View jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); PHOTO INFORMATION Download Details Share CSI: Secure by Demand: Priority Considerations for Operational Technology Owners and Operators in the Selection of Digital Products Graphic CSI: Secure by Demand: Priority Considerations for Operational Technology Owners and Operators in the Selection of Digital Products Graphic window.delayInitMediaElementJs = true; function toggleInfo(event) { $("#adetail-slick-gallery").toggleClass('open');; sizeSlideInfo(); } function GalleryInit() { var $gallery = $("#adetail-slick-gallery"); $gallery.on('init', function () { initMediaElementJs(); }).slick({ fade: true, adaptiveHeight: true }); $gallery.on('afterChange, setPosition', function (event, currentSlide) { $gallery.animate({ height: $('.slick-current .item').first().height() + 'px' }, 300); sizeSlideInfo(); }); } function sizeSlideInfo() { var $gallery = $("#adetail-slick-gallery"); var $info = $gallery.siblings('.slide-info'); var infoContent = $('.slick-current').find('.slide-info-hidden').html(); let h = $info.height(); if ($gallery.hasClass('open')) { $info.css('height', h + 'px') .empty() .html(infoContent) .animate({ height: $info.find('.slide-info-inner').outerHeight() + 'px' }, 300); } else { $info.css('height', '0'); } } $(window).load(function() { GalleryInit(); }); jQuery(document).ready(function() { var prm = Sys.WebForms.PageRequestManager.getInstance(); if (prm){ if(typeof GalleryInit == 'function'){ prm.add_endRequest(GalleryInit); } } }); jQuery(document).ready(function() { var prm = Sys.WebForms.PageRequestManager.getInstance(); if (prm){ if(typeof SlideshowInit == 'function'){ prm.add_endRequest(SlideshowInit); } } }); Press Release | Jan. 13, 2025 NSA and Others Publish Guidance for Secure OT Product Selection FORT MEADE, Md. - The National Security Agency (NSA) joins the Cybersecurity and Infrastructure Security Agency (CISA) and other organizations to publish guidance helping operational technology (OT) owners and operators integrate security when selecting OT products. The joint Cybersecurity Information Sheet (CSI), “Secure by Demand: Priority Considerations for Operational Technology Owners and Operators in the Selection of Digital Products,” highlights key security elements to consider when purchasing industrial automation and control systems and other OT products, as well as specific questions to ask manufacturers. Many OT products are not designed or developed securely, and they commonly have weaknesses that make them a target for cyber threat actors, including the following: weak authentication, shared software vulnerabilities, limited logging, default settings, default credentials, and default protocols. “The guidance not only helps owners and operators of critical systems secure their OT procurement lifecycles, it also sends a message to manufacturers to establish a more resilient and flexible cybersecurity foundation in their products,” said Dave Luber, NSA’s Cybersecurity Director. The CSI urges OT owners and operators to select products with the following key security elements: configuration management, logging in the baseline product, open standards, ownership, protection of data, secure by default, secure communications, secure controls, strong authentication, threat modeling, vulnerability handling, and upgrade tooling. The other agencies co-sealing the CSI are the Federal Bureau of Investigation (FBI), the U.S. Department of Energy, the U.S. Environmental Protection Agency (EPA), the U.S. Transportation Security Administration, the Australian Signals Directorate’s Australian Cyber Security Centre (ASD’s ACSC), Canadian Centre for Cyber Security (CCCS), European Commission, Germany’s Federal Office for Information Security (BSI), Netherland’s National Cyber Security Centre (NCSC-NL), New Zealand’s National Cyber Security Centre (NCSC-NZ), and the United Kingdom’s National Cyber Security Centre (NCSC-UK). The report complements a previously published CSI, “Shifting the Balance of Cybersecurity Risk: Principles and Approaches for Secure by Design Software,” jointly released in April 2023 and updated in October 2023. Read the full report here. Visit our full library for more cybersecurity information and technical guidance. NSA Media Relations MediaRelations@nsa.gov 443-634-0721 SHARE PRINT cybersecurity CSI Secure by demand secure by design Operational Technology OT Procurement var displayNextPrevNav = false var loggedIn = false; var articleId = 4027075; var moduleId = 12594; var mejPlayer; $(function () { if (!window.delayInitMediaElementJs) initMediaElementJs(); }); function initMediaElementJs() { mejPlayer = $(".article-view video").not(".noplayer").mediaelementplayer({ pluginPath: "/desktopmodules/SharedLibrary/Plugins/MediaElement4.2.9/", videoWidth: '100%', videoHeight: '100%', success: function (mediaElement, domObject) { var aDefaultOverlay = jQuery(mediaElement).parents('.media-inline-video, .video-control').find('.defaultVideoOverlay.a-video-button'); var aHoverOverlay = jQuery(mediaElement).parents('.media-inline-video, .video-control').find('.hoverVideoOverlay.a-video-button'); var playing = false; $("#" + mediaElement.id).parents('.media-inline-video, .video-control').find('.mejs__controls').hide(); if (typeof GalleryResize === "function") GalleryResize(); mediaElement.addEventListener('play', function (e) { playing = true; jQuery(".gallery").trigger("pause", false, false); $("#" + e.detail.target.id).parents('.media-inline-video, .video-control').find('.mejs__controls').show(); $("#" + e.detail.target.id).parents('.media-inline-video, .video-control').find('.duration').hide(); if (aDefaultOverlay.length) { aDefaultOverlay.hide(); aHoverOverlay.hide(); } //place play trigger for DVIDS Analytics }, false); mediaElement.addEventListener('pause', function (e) { playing = false; if (aDefaultOverlay.length) { aDefaultOverlay.removeAttr("style"); aHoverOverlay.removeAttr("style"); } }, false); mediaElement.addEventListener('ended', function (e) { playing = false; }, false); if (aDefaultOverlay.length) { aDefaultOverlay.click(function () { if (!playing) { mediaElement.play(); playing = true; } }); aHoverOverlay.click(function () { if (!playing) { mediaElement.play(); playing = true; } }); } }, features: ["playpause", "progress", "current", "duration", "tracks", "volume", "fullscreen"] }); if (displayNextPrevNav) { DisplayNextPreviousNav(moduleId, articleId, loggedIn); } } $(window).load(function () { if (displayNextPrevNav) { var winWidth = $(document).width(); if (winWidth > 1024) { $('#footerExtender').css('height', '0px'); $('.article-navbtn .headline').addClass('contentPubDate'); } else { $('#footerExtender').css('height', $('.article-navbtn .headline').html().length > 0 ? $('.bottomNavContainer').height() + 'px' : '0px'); $('.article-navbtn .headline').removeClass('contentPubDate'); } } }); $(window).resize(function () { if (displayNextPrevNav) { var winWidth = $(document).width(); if (winWidth < 1024) { $('#footerExtender').css('height', $('.article-navbtn .headline').html().length > 0 ? $('.bottomNavContainer').height() + 'px' : '0px'); $('.article-navbtn .headline').removeClass('contentPubDate'); } else { $('#footerExtender').css('height', '0px'); $('.article-navbtn .headline').addClass('contentPubDate'); } } });'''
