description = "FORT MEADE, Md. – A report released by the National Security Agency (NSA), the Cybersecurity and Infrastructure Agency (CISA), the Defense Advanced Research Projects Agency (DARPA), and the"
full_description = '''HomePress RoomPress Releases & StatementsPress Release View jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); PHOTO INFORMATION Download Details Share CSI: Closing the Software Understanding Gap graphic CSI: Closing the Software Understanding Gap graphic window.delayInitMediaElementJs = true; function toggleInfo(event) { $("#adetail-slick-gallery").toggleClass('open');; sizeSlideInfo(); } function GalleryInit() { var $gallery = $("#adetail-slick-gallery"); $gallery.on('init', function () { initMediaElementJs(); }).slick({ fade: true, adaptiveHeight: true }); $gallery.on('afterChange, setPosition', function (event, currentSlide) { $gallery.animate({ height: $('.slick-current .item').first().height() + 'px' }, 300); sizeSlideInfo(); }); } function sizeSlideInfo() { var $gallery = $("#adetail-slick-gallery"); var $info = $gallery.siblings('.slide-info'); var infoContent = $('.slick-current').find('.slide-info-hidden').html(); let h = $info.height(); if ($gallery.hasClass('open')) { $info.css('height', h + 'px') .empty() .html(infoContent) .animate({ height: $info.find('.slide-info-inner').outerHeight() + 'px' }, 300); } else { $info.css('height', '0'); } } $(window).load(function() { GalleryInit(); }); jQuery(document).ready(function() { var prm = Sys.WebForms.PageRequestManager.getInstance(); if (prm){ if(typeof GalleryInit == 'function'){ prm.add_endRequest(GalleryInit); } } }); jQuery(document).ready(function() { var prm = Sys.WebForms.PageRequestManager.getInstance(); if (prm){ if(typeof SlideshowInit == 'function'){ prm.add_endRequest(SlideshowInit); } } }); Press Release | Jan. 16, 2025 NSA Jointly Releases Recommendations for Closing the Software Understanding Gap FORT MEADE, Md. – A report released by the National Security Agency (NSA), the Cybersecurity and Infrastructure Agency (CISA), the Defense Advanced Research Projects Agency (DARPA), and the Office of the Under Secretary of Defense for Research and Engineering (OUSD R&E) urges a national effort to better understand the behavior of software underpinning national security and critical infrastructure systems. The Cybersecurity Information Sheet (CSI), “Closing the Software Understanding Gap,” points to the need for policy action, technical innovation, and resources to help systems owners and operators better construct and assess their software-controlled systems across all conditions – normal, abnormal, and hostile. “A lack of understanding of software imposes risks on many critical systems that are dependent on software to run properly and as intended,” said Neal Ziring, NSA Research Technical Director. “This report is a national call for the government and private sectors to work together to prioritize understanding software as a national effort critical to the nation’s success in the future.” Currently, the nation’s ability to build software outstrips its ability to understand it, leaving systems vulnerable to exploitation, the CSI states. Undiscovered behavior in software has exposed critical vulnerabilities in aircraft, military systems, and supply chains and impacted national security objectives, with the CSI citing numerous examples. The CSI outlines a call to action to address gaps in software understanding through: Policy action – As technical capabilities mature, policy needs to evolve to require and formalize processes for characterizing software behavior before it is introduced into critical systems. Technical innovation – Technical capabilities for measuring software and reasoning about its behavior need to be developed to reduce risk. All suitable techniques, including formal methods and artificial intelligence, should be leveraged to develop rigorous, reliable, rapid, and inexpensive capabilities. ​Resources – Significant sustained investments in research, development, and engineering are needed to support a unified set of software understanding capabilities. Public and private partnerships with industry should also be explored to ensure practical and efficient solutions that can be leveraged across missions and diverse systems. Read the full report here. Visit our full library for more cybersecurity information and technical guidance. NSA Media Relations MediaRelations@nsa.gov 443-634-0721 SHARE PRINT Related Documents CSI: Closing the Software Understanding Gap cybersecurity software understanding software gap Cybersecurity Information Sheet CSI var displayNextPrevNav = false var loggedIn = false; var articleId = 4031718; var moduleId = 12594; var mejPlayer; $(function () { if (!window.delayInitMediaElementJs) initMediaElementJs(); }); function initMediaElementJs() { mejPlayer = $(".article-view video").not(".noplayer").mediaelementplayer({ pluginPath: "/desktopmodules/SharedLibrary/Plugins/MediaElement4.2.9/", videoWidth: '100%', videoHeight: '100%', success: function (mediaElement, domObject) { var aDefaultOverlay = jQuery(mediaElement).parents('.media-inline-video, .video-control').find('.defaultVideoOverlay.a-video-button'); var aHoverOverlay = jQuery(mediaElement).parents('.media-inline-video, .video-control').find('.hoverVideoOverlay.a-video-button'); var playing = false; $("#" + mediaElement.id).parents('.media-inline-video, .video-control').find('.mejs__controls').hide(); if (typeof GalleryResize === "function") GalleryResize(); mediaElement.addEventListener('play', function (e) { playing = true; jQuery(".gallery").trigger("pause", false, false); $("#" + e.detail.target.id).parents('.media-inline-video, .video-control').find('.mejs__controls').show(); $("#" + e.detail.target.id).parents('.media-inline-video, .video-control').find('.duration').hide(); if (aDefaultOverlay.length) { aDefaultOverlay.hide(); aHoverOverlay.hide(); } //place play trigger for DVIDS Analytic