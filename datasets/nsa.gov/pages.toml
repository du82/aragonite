full_description = '''var windowIsLoaded13408=false; var documentIsReady13408=false; function setModuleHeight13408() { var moduleId=".DnnModule-13408"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit13408() { if(windowIsLoaded13408&&documentIsReady13408) { setModuleHeight13408(); window.addEventListener('resize',setModuleHeight13408); } } $(document).ready(function() { documentIsReady13408=true; pdInit13408(); }); $(window).load(function() { windowIsLoaded13408=true; pdInit13408(); }); Freedom of Information Act Submit FOIA Request Overview NSA releases as much information as possible, consistent with the need to protect classified or sensitive information under the exemption provisions of applicable federal laws. Learn More Reading Room Read about the laws and policies that govern our FOIA and Privacy Act programs. Enter the Room .smalltext22 a{ color:#4448ac; } Privacy Act To request Privacy Act records, please submit your request by following our step-by-step process. Learn More Frequently Requested Information NSA receives thousands of requests for information each year, many of which are duplicative. For your convenience, a listing of frequent FOIA requests and their general disposition are available. Search Info Declassification & Transparency Initiatives NSA reviews records and makes them publicly available. In accordance with the federal Open Government directive, we also identify and release subjects and records for which there is a general public interest. Browse Documents'''
