full_description = '''var windowIsLoaded14211=false; var documentIsReady14211=false; function setModuleHeight14211() { var moduleId=".DnnModule-14211"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit14211() { if(windowIsLoaded14211&&documentIsReady14211) { setModuleHeight14211(); window.addEventListener('resize',setModuleHeight14211); } } $(document).ready(function() { documentIsReady14211=true; pdInit14211(); }); $(window).load(function() { windowIsLoaded14211=true; pdInit14211(); }); Mission-Oriented Research HomeResearchNSA Mission-Oriented Research jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); .smalltext22 a{ color:#4448ac; } Mathematics NSA performs world-class mathematics research and cryptographic design and is responsible for applying advanced techniques from mathematics-related fields to create breakthroughs in cryptology, information processing, network/data analysis, signals intelligence, and cybersecurity. Through our Math Sciences Program, NSA offers programs for eligible faculty members to maintain a vigorous academic mathematics community. Learn More Laboratory For Advanced Cybersecurity Research (LACR) LACR partners with academia, industry, and mission to advance the science of cybersecurity. It conducts mission-focused research to automate network defense, creates trusted hardware and software solutions, advances the use of formal methods, and creates tools to enhance cyber threat intelligence. Learn More Laboratory For Physical Science (LPS) Through the fundamental understanding of physical sciences and engineering, LPS research supports current and future mission challenges confronting NSA and the IC. Research areas include future computing systems (quantum/high-performance computing) and advanced manufacturing and sensing. Visit Lab .smalltext22 a{ color:#4448ac; } Lab For Telecommunication Sciences (LTS) LTS collaborates with academia, industry, other government labs, and IC mission organizations to conduct advanced networking, computing, and telecommunications research. It initiates technical research to solve intractable problems and explore the implications of new communications domains. Visit Lab Computer & Analytic Sciences Computer and Analytic Sciences Research, which includes the Lab for Analytic Sciences, conducts mission-focused research to invent techniques, tools, and tradecraft that augment analysts’ ability to derive intelligence from complex data. It develops new technologies for transforming raw data into actionable information. Learn More Innovation NSA’s focus on innovation transformation into an agency that rapidly adapts to unforeseen challenges and opportunities by helping organizations rapidly iterate, integrate tight feedback loops, bring outside technology and tradecraft in, and make better decisions under uncertainty. Learn More .smalltext22 a{ color:#4448ac; } Research & Technology Applications NSA establishes partnerships with industry, academia, and other government agencies to accelerate mission goals, advance science, and promote the growth and commercialization of technology originally created for the agency’s mission. Learn More'''
