full_description = '''var windowIsLoaded15310=false; var documentIsReady15310=false; function setModuleHeight15310() { var moduleId=".DnnModule-15310"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit15310() { if(windowIsLoaded15310&&documentIsReady15310) { setModuleHeight15310(); window.addEventListener('resize',setModuleHeight15310); } } $(document).ready(function() { documentIsReady15310=true; pdInit15310(); }); $(window).load(function() { windowIsLoaded15310=true; pdInit15310(); }); Architectural Barriers Act (ABA) HomeABA jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); Notice of Rights Architectural Barriers Act of 1968 (42 U.S.C. § 4151-57) The Architectural Barriers Act (ABA) generally requires facilities that are designed, built, altered, or leased with Federal funds be accessible to individuals with disabilities. The Agency’s Installations & Logistics organization is responsible for ensuring the physical accessibility of Agency facilities. To file an ABA complaint with the NSA, visit Report a Barrier to Facilities and Services. The U.S. Access Board is an independent federal agency that promotes equality for people with disabilities through leadership in accessible design and the development of accessibility guidelines and standards. The Access Board’s ABA accessibility standards are available on its website. Subject to certain limitations and exclusions, the Department of Defense (DoD) has adopted the Access Board’s ABA accessibility standards. The DoD standards, found in a 31 October 2008 memorandum, are also available on the Access Board website. Information about filing an ABA complaint with the Access Board may be found at its online ABA complaint form. If the Agency’s investigation of a complaint filed under Section 508 of the Rehabilitation Act of 1973 or the Architectural Barriers Act of 1968 shows that a different entity is responsible for the alleged violation, the Agency will attempt to assist the individual with locating the proper place to file the complaint against the other entity, if possible.'''
