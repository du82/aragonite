title = "National Cryptologic University"
full_description = '''var windowIsLoaded15532=false; var documentIsReady15532=false; function setModuleHeight15532() { var moduleId=".DnnModule-15532"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit15532() { if(windowIsLoaded15532&&documentIsReady15532) { setModuleHeight15532(); window.addEventListener('resize',setModuleHeight15532); } } $(document).ready(function() { documentIsReady15532=true; pdInit15532(); }); $(window).load(function() { windowIsLoaded15532=true; pdInit15532(); }); HomeAcademicsNational Cryptologic University jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); .section-text h2{ font-family: 'Teko-Medium',sans-serif; text-align: left; color:#4448AC; font-size:2.5rem; font-weight:bold; } .inner-section{ display:flex; flex-direction:column; margin: 10px 40px; width:75%; position:relative; } .section-text { font-size: 1.5rem; display:flex; flex-direction: column; justify-content: center; color: black; text-align: left; padding: 0px 14px 0px 14px; font-family: 'Roboto-Light',sans-serif; margin-bottom: 0px; } Overview The National Cryptologic University (NC-U) is the education and training element of the National Security Agency/Central Security Service (NSA/CSS) or “Agency.” The National Cryptologic School changed its name to the NC-U in 2022 reflecting the evolution of NC-U’s educational achievements over 56 years from when NCS was first established as a trade school. NC-U is responsible for academic and professional development in cryptologic and cryptologic-related disciplines in support of U.S. mission requirements. NC-U executes this responsibility through its curriculum stretching and over 1600 courses spanning cryptology, cyber, language, business and leadership, the NC-U is the one on the premier educational institutions within the Department of Defense. Deliver Deliver high-quality education & training to meet enterprise needs and develop/retain talent. Develop Develop a culture of strategic data responsiveness to continuously improve services. Optimize Optimize resources – human, financial, technological, and spatial – to be nimble and agile in the delivery of education & training; regularly match and realign resources to synchronize with mission priorities and develop resiliency. Modernize Modernize the learning technology ecosystem and grow our tradecraft to deliver services at scale to the workforce based on needs and accessibility. .smalltext22 a{ color:#4448ac; } Education and Professional Development NC-U offers professional education in five focus areas: Cryptology, Language, Business, Leadership and Cyber. Learn More College Programs NC-U offers several external college programs to help students gain college degrees. Learn More Outreach NC-U partners with schools to help cultivate the next generation of experts in science, technology, engineering, math, language and analysis to protect the nation. Learn More Accreditation NC-U is a nationally accredited Institution of higher learning. Learn More'''
