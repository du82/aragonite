title = "National Security Agency | About NSA Mission"
full_description = '''var windowIsLoaded12687=false; var documentIsReady12687=false; function setModuleHeight12687() { var moduleId=".DnnModule-12687"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit12687() { if(windowIsLoaded12687&&documentIsReady12687) { setModuleHeight12687(); window.addEventListener('resize',setModuleHeight12687); } } $(document).ready(function() { documentIsReady12687=true; pdInit12687(); }); $(window).load(function() { windowIsLoaded12687=true; pdInit12687(); }); About NSA/CSS A U.S. Department of Defense combat support agency and member of the U.S. Intelligence Community Watch the Video Mission The National Security Agency/Central Security Service (NSA/CSS) leads the U.S. Government in cryptology that encompasses both signals intelligence (SIGINT) insights and cybersecurity products and services and enables computer network operations to gain a decisive advantage for the nation and our allies. Throughout the site, NSA/CSS will be referred to collectively as NSA. Learn More Central Security Service Central Security Service provides timely and accurate cryptologic support, knowledge, and assistance to the military cryptologic community, while promoting partnership between the NSA and the cryptologic elements of the Armed Forces. .smalltext22 a{ color:#4448ac; } Cybersecurity NSA Cybersecurity prevents and eradicates threats to U.S. national security systems with a focus on the Defense Industrial Base and the improvement of our weapons’ security. Through our Cybersecurity Collaboration Center, NSA partners with allies, industry and researchers to strengthen awareness to advance cybersecurity outcomes. Learn More Signals Intelligence NSA provides foreign signals intelligence (SIGINT) to our nation's policymakers and military forces. SIGINT plays a vital role in our national security by providing America's leaders with critical information they need to defend our country, save lives, and advance U.S. goals and alliances globally. Learn More Cybersecurity Collaboration Center NSA’s Cybersecurity Collaboration Center harnesses the power of industry partnerships to prevent and eradicate foreign cyber threats to National Security Systems, the Department of Defense, and the Defense Industrial Base. Learn More .smalltext22 a{ color:#4448ac; } Locations NSA has offices around the world with four cryptologic centers across the United States. Learn More Strategic Environment NSA postures to prevent and eradicate threats and help the United States and its Allies defeat adversaries consistent with its authorities and with guidance from various national strategies. Learn More Customers & Partners NSA partners with other U.S. Government and military agencies and allies to execute its missions in signals intelligence and cybersecurity. Learn More'''
