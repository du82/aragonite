px; padding-bottom: 2px; text-transform:uppercase; display: flex; justify-content: center; } .animate .btn:hover { background-color: #86C232; color:#262626; } .animate .btn a, a:link, a:visited { color: #ffffff; } .animate .btn a:hover { background-color: #86C232; color:#262626 !important; } .DnnModule.DnnModule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } Cultivating the Next Generation of Experts NSA creates collaborative educational programs with qualifying education institutions. Contact Us .sections{ display:flex; flex-wrap: wrap; flex-direction: row; justify-content: center; width:100%; } .sections h1{ font-family: 'Teko-Light', sans-serif; text-align: center; color:black; font-size:4em; } .section-text h2{ font-family: 'Teko-Medium',sans-serif; text-align: left; color:#4448AC; font-size:2.5rem; font-weight:bold; } .inner-section{ display:flex; flex-direction:column; margin: 10px 40px; width:75%; position:relative; } .section-text { font-size: 1.5rem; display:flex; flex-direction: column; justify-content: center; color: black; text-align: left; padding: 0px 14px 0px 14px; font-family: 'Roboto-Light',sans-serif; margin-bottom: 40px; } .learnmore{ position: absolute; bottom: 0; width: 100%; font-family: 'Teko-Light', sans-serif; font-size: 0.7em; font-weight: 300; display: flex; flex-direction: row; justify-content: flex-end; } .learnmore button{ background-color: transparent; border: none; } .learnmore a{ text-decoration: none; } .learnmore a:hover{ text-decoration: underline; } .learnmore .fa-angle-right{ color: #87C232; } .btn-lg { padding: 10px 0 0 0; font-size: 2.3em; line-height: 1.3333333; border-radius: 6px; color: #86C232; margin-left: -15px; justify-content: right; align-content: normal; } Overview NSA partners with schools to develop the talent and tools we need to meet future national security challenges by: Funding skill development programs like summer camps Promoting development of curricula for growing career fields such as cybersecurity Sponsoring skills and research paper competitions Hosting student interns and co-ops Awarding research grants and funding research labs and projects Awarding Broad Area Announcement bid contracts through NSA’s Acquisition Resource Center These partnerships help cultivate the next generation of experts in science, technology, engineering, math, language and analysis and broaden the pool of skilled cybersecurity professionals who can protect the nation from cyberattacks. Our academic partnerships also foster interest in critical need foreign languages and advance science through research and innovation benefiting the country, even beyond NSA's need to apply emerging technologies to our mission. We have partnership opportunities at both the college/university level and the kindergarten-12 level. If you are a student, an educator, or an academic researcher, we encourage you to check out what we have to offer. .smalltext22 a{ color:#4448ac; } National Centers of Academic Excellence in Cybersecurity NCAE programs aim to create and manage collaborative cybersecurity educational programs with community colleges, colleges, and universities. Learn More For Students NSA encourages educators to partner with us to enhance STEM and language education. Learn More For Educators Explore the free STEM and foreign language services NSA can provide your non-profit, academic school or organization. Learn More .smalltext22 a{ color:#4448ac; } Research Partnerships NSA seeks academic partnerships that produce the best technical talent to solve the nation's intelligence problems and develop innovations to secure the future. Learn More National Cryptologic University (NC-U) NC-U is responsible for academic and professional development in cryptologic and cryptologic-related disciplines in support of U.S. mission requirements. Learn More The National Security Agency does not endorse the content of external links to non-Federal agency websites in this article and the content of the external links is not subject to federal information quality, privacy, security, and related guidance.'''
