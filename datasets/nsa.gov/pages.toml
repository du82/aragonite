full_description = '''var windowIsLoaded13079=false; var documentIsReady13079=false; function setModuleHeight13079() { var moduleId=".DnnModule-13079"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit13079() { if(windowIsLoaded13079&&documentIsReady13079) { setModuleHeight13079(); window.addEventListener('resize',setModuleHeight13079); } } $(document).ready(function() { documentIsReady13079=true; pdInit13079(); }); $(window).load(function() { windowIsLoaded13079=true; pdInit13079(); }); .herotitle{ color: white; font-family: 'Teko-Semibold', sans-serif; font-size: 5rem; font-weight: bold; text-align: center; padding-top: 2%; display: flex; justify-content: center; flex-direction: row; } .animate{ display: flex; justify-content: center; align-items: center; margin-top: 65px; } /* Style the button and place it in the middle of the container/image */ .animate .btn { background-color:#262626; border-radius:1px; border:2px solid #86C232; display:inline-block; cursor:pointer; color:#ffffff; font-family:'Teko-Light', sans-serif; font-size:2rem; margin-top:-10%; padding-left: 25px; padding-right: 25px; padding-top: 5px; padding-bottom: 2px; text-transform:uppercase; display: flex; justify-content: center; } .animate .btn:hover { background-color: #86C232; color:#262626; } .animate .btn a, a:link, a:visited { color: #ffffff; } .animate .btn a:hover { background-color: #86C232; color:#262626 !important; } .DnnModule.DnnModule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } Central Security Service (CSS) Supporting the Military HomeAboutCentral Security Service jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); p { font-size:1.5rem; } a { font-size:1.5rem; } a:hover, a:link, a:visited { color: #474baf; } The Central Security Service (CSS) provides timely and accurate cryptologic support, knowledge, and assistance to the military cryptologic community. Established by presidential directive in 1972, CSS promotes full partnership between the NSA and the cryptologic elements of the Armed Forces, and teams with senior military and civilian leaders to address and act on critical military-related issues in support of national and tactical intelligence objectives. CSS coordinates and develops policy and guidance on the signals intelligence and cybersecurity missions of NSA/CSS to ensure military integration. Combining NSA and CSS caused the Director, NSA to become dual-hatted as Chief, CSS and also created a more unified cryptologic effort. The principal advisor to Director, NSA/Chief CSS on military cryptologic issues is the Deputy Chief, Central Security Service (DCHCSS). The DCHCSS oversees the function of the military cryptology system; manages and cultivates the partnerships between NSA/CSS and the Service Cryptologic Components; and ensures military capabilities are integrated in support of the warfighter. In 1996, Director, NSA/Chief, CSS U.S. Air Force Lt. Gen. Kenneth A. Minihan approved the creation of a CSS seal designed to represent the combined commands. Updated in 2022, the seal now displays all six of the Service Cryptologic Components, which are comprised of the United States Army's Intelligence and Security Command, the Marine Corps Information Command (MCIC), United States Fleet Cyber Command, the 16th Air Force, United States Space Force, and the US Coast Guard Deputy Assistant Commandant for Intelligence. Each are equally balanced around a six point star which is centered on the symbol of CSS. Learn more about NSA/CSS seals.'''
