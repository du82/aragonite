 has adopted the Access Board’s ABA accessibility standards. The DoD standards, found in a 31 October 2008 memorandum, are also available on the Access Board website. Information about filing an ABA complaint with the Access Board may be found at its online ABA complaint form. If the Agency’s investigation of a complaint filed under Section 508 of the Rehabilitation Act of 1973 or the Architectural Barriers Act of 1968 shows that a different entity is responsible for the alleged violation, the Agency will attempt to assist the individual with locating the proper place to file the complaint against the other entity, if possible.'''
