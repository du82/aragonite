} .DnnModule.DnnModule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } NSA Cryptographic Support Services NSA offers access to cryptographic key services to customers and partners. Some of the below services include gated content and may require secure login via username/password or smartcard access. .smalltext22 a{ color:#4448ac; } Access Request This application is used to request accounts for both the Information Assurance Directorate Engineering Data (IED) application and the ECMIPR application. Access to each application must be requested explicitly. Visit Site Key Support The EKMS Central Facility is the center of the Electronic Key Management System (EKMS) responsible for the provision of electronic key and certificates. The CFF offers new key generation, electronic rekey and support services for an array of modern electronically rekeyable equipment servicing a world-wide customer base. Visit Site Master Reference Catalog Related to Key Support and offers a master reference catalog. Visit Site .smalltext22 a{ color:#4448ac; } Central Office of Record (COR) The COR provides oversight and guidance to established COMSEC programs within the COMSEC Material Control System and ensures compliance with national policy. To become a member of the COR website, you must first register at the Key Support Central Facility. Visit Site National Cryptographic Solutions Management Office (NCSMO) The NCSMO provides a platform to expeditiously coordinate the secure exchange of Cryptographic Modernization (CryptoMod) management and technical information. Visit Site IOSS Interagency OPSEC Support Staff (IOSS) acts as a consultant to other U.S. Government departments or agencies by providing technical guidance and assistance resulting in self-sufficient OPSEC programs for the protection of U.S operations. Visit Site .smalltext22 a{ color:#4448ac; } Secure Phone Secure Phone provides a platform to expeditiously coordinate the secure exchange of secure phone management & technical information. Visit Site Committee on National Security Systems (CNSS) The CNSS provides a forum for the discussion of policy issues and is responsible for setting national-level cybersecurity policies, directives, instructions, operational procedures, guidance and advisories for U.S. Government departments and agencies for the security of National Security Systems (NSS) through the CNSS Issuance System. The CNSS Library contains those issuances permitted on the internet that address cybersecurity issues. Visit Site National Centers of Academic Excellence in Cybersecurity NCAE programs aim to create and manage collaborative cybersecurity educational programs with community colleges, colleges, and universities. Visit Site .smalltext22 a{ color:#4448ac; } National Security Cyber Assistance Program (NSCAP) The NSCAP Accreditation Portal allows qualified national security system owners and operators to apply for Cyber Incident Response Assistance (CIRA) accreditation to meet the growing needs of the U.S. Government and supplements the incident response and intrusion detection services that NSA provides to the Department of Defense, Intelligence Community, and other organizations as authorized and directed. Visit Site eMIPR/EC MIPR Request For access to EC MIPR, you must first have an account. If you need to request an account, first visit Access Request. If you already have an account, visit the site. Request Access IA Engineering Data For access to IED, you must first have an account. If you need to request an account, first visit Access Request. If you already have an account, visit the site. Request Access .smalltext22 a{ color:#4448ac; } IAD.gov (Legacy) NSA formerly released cybersecurity information and provided customer support through its legacy Information Assurance Directorate. Visit Site'''
