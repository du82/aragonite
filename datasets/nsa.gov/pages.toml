title = "Business Programs and Resources"
full_description = '''var windowIsLoaded13558=false; var documentIsReady13558=false; function setModuleHeight13558() { var moduleId=".DnnModule-13558"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit13558() { if(windowIsLoaded13558&&documentIsReady13558) { setModuleHeight13558(); window.addEventListener('resize',setModuleHeight13558); } } $(document).ready(function() { documentIsReady13558=true; pdInit13558(); }); $(window).load(function() { windowIsLoaded13558=true; pdInit13558(); }); Business Programs & Resources HomeBusinessBusiness Programs and Resources jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); NSA offers a wide variety of programs and opportunities designed to allow companies to work with NSA. .smalltext22 a{ color:#4448ac; } Electronic Invoicing NSA encourages its vendors to submit invoices electronically in an effort to provide a fast and accurate method to track invoices submitted for payment. Learn More GreyBox To assist developers in building technologies that can work in our technical ecosystem, NSA has developed GreyBox, a tool used to test, integrate and demonstrate that software can work with NSA's architecture. GreyBox includes mock-ups of interfaces for several common services that are dependencies for multiple mission applications in our classified environments. Developers can use GreyBox in their own unclassified software development facility to assess how well their software can interoperate with our interface. GreyBox is now available through the NSA Acquisition Resource Center (ARC). If your company is already registered in the ARC, you can download GreyBox from the ARC today. If you are not already registered in the ARC, visit Getting Started. Learn More Cybersecurity Resources Cybersecurity Resources from DoD and NSA. Learn More .smalltext22 a{ color:#4448ac; } NSA Programs for Innovation NSA is seeking innovative ideas, approaches and technologies to facilitate and enhance all of our Missions. To support these efforts, several programs for rapid acquisition and engagement. Learn More Provisional Industrial Security Approval (PISA) Sponsorship Program NSA's unique clearance sponsorship program for small businesses can help your company start working with NSA. Learn More Technology Security and Export Control The Office of Technology Security and Export Control (TSEC) provides support to policy formulation, guidance, and license issuance regarding exports of signals intelligence (SIGINT) related technology. Learn More .smalltext22 a{ color:#4448ac; } Technology Transfer Program NSA has established a formal Technology Transfer mechanism for openly sharing technologies with commercial, academic, and other government partners. Learn More Unsolicited Proposals NSA is interested in receiving unique and innovative ideas that satisfy our technology challenges. Learn More Commercial Engagement Center (CEC) The Commercial Engagement Center (CEC) works with commercial companies to help make us safer at home and abroad. Today more than ever public-private partnerships are needed to protect national security communications and to prevent foreign adversaries from harming our nation and our allies - both physically and in cyberspace. Learn More .smalltext22 a{ color:#4448ac; } DoD Small Business Resources More information on various small business programs within the Department of Defense. Learn More DoD Skillbridge SkillBridge is an excellent opportunity as you plan for your life after the military. SkillBridge matches civilian opportunities to your job training and work experience at the end of your military duty. Learn More'''
