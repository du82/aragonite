title = "National Security Agency Mission and Combat Support"
full_description = '''var windowIsLoaded12665=false; var documentIsReady12665=false; function setModuleHeight12665() { var moduleId=".DnnModule-12665"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit12665() { if(windowIsLoaded12665&&documentIsReady12665) { setModuleHeight12665(); window.addEventListener('resize',setModuleHeight12665); } } $(document).ready(function() { documentIsReady12665=true; pdInit12665(); }); $(window).load(function() { windowIsLoaded12665=true; pdInit12665(); }); Mission & Combat Support HomeAboutMission & Combat Support jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); Mission The National Security Agency/Central Security Service (NSA/CSS) leads the U.S. Government in cryptology that encompasses both foreign signals intelligence (SIGINT) insights and cybersecurity products and services, and enables computer network operations to gain a decisive advantage for the nation and our allies. Throughout the site, NSA/CSS will be referred to collectively as NSA. Combat Support NSA is part of the U.S. Department of Defense serving as a combat support agency. Supporting our military service members around the world is one of the most important things that we do. NSA analysts, linguists, engineers and other personnel deploy to Afghanistan and other hostile areas to provide actionable SIGINT and cybersecurity support to warfighters on the front lines. We provide intelligence support to military operations through our signals intelligence activities, while our cybersecurity personnel, products and services ensure that military communications and data remain secure, and out of the hands of our adversaries. Learn more about our signals intelligence support in the first episode of No Such Podcast. We provide wireless and wired secure communications to our warfighters and others in uniform no matter where they are, whether traveling through Afghanistan in a Humvee, diving beneath the sea, or flying into outer space. Our cybersecurity mission also produces and packages the codes that secure our nation's weapons systems. Learn more about these missions in the second episode of No Such Podcast. Additionally, we set common protocols and standards so that our military can securely share information with our allies, NATO and coalition forces around the world. Interoperability is a key to successful joint operations and exercises.'''
