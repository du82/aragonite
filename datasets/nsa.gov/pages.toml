} .DnnModule.DnnModule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } Ensuring NSA Operates Consistent with our Authorities NSA executes our cybersecurity and foreign signals intelligence missions properly and reliab Overview NSA’s Office of General Counsel (OGC) ensures we properly and reliably execute our cybersecurity and signals intelligence missions consistent with these authorities. Learn More Leadership The General Counsel is NSA's chief legal officer and serves as the head of OGC, which provides legal services to every component of the Agency worldwide. Read Bio .smalltext22 a{ color:#4448ac; } Legal Careers NSA regularly seeks highly motivated, accomplished attorneys from diverse backgrounds to join its dynamic and challenging practice to ensure Agency operations comply with the law while also protecting both our national security and our civil liberties. Learn More Resources NSA’s Office of General Counsel provides these resources to support our work. Learn More Operating Authorities NSA operates within the legal authorities that task us to execute our missions on behalf of the nation's security. NSA’s Office of General Counsel ensures we properly and reliably execute our cybersecurity and signals intelligence missions consistent with these authorities. Learn More'''
