} .DnnModule.DnnModule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } Collecting & Analyzing our Adversaries’ Moves Consistent with our authorities, NSA collects foreign intelligence to inform policymakers and defeat adversaries. Learn More Overview NSA provides foreign signals intelligence (SIGINT) consistent with our authorities to our nation's policy-makers and military forces to defend our country, save lives, and advance U.S. goals and alliances globally. Learn More National Strategies NSA executes our missions consistent with authorities that specifically limit us to gathering information about international terrorists and foreign powers, organizations, or persons in support of a variety of U.S. national strategies. Learn More .smalltext22 a{ color:#4448ac; } Executive Order 12333 and National Security Council Intelligence Directive 6 As set forth in Executive Order 12333 and National Security Council Intelligence Directive 6, NSA collects, processes, analyzes, produces, and disseminates signals intelligence (SIGINT) information for foreign intelligence and counterintelligence purposes as part of NSA's role as a combat support agency in the Department of Defense. NSA SIGINT develops insights on our adversaries to provide the nation a decisive information advantage in competition, crisis, or conflict. Read More Foreign Intelligence Surveillance Act of 1978 (FISA) The FISA of 1978 codifies rules for requesting authorization to collect electronic communications within the United States by compelling assistance from U.S service providers. NSA relies on FISA authorizations to acquire significant foreign intelligence with the approval and oversight of the Foreign Intelligence Surveillance Court. By law, all FISA activities must be conducted consistent with the Fourth Amendment to the Constitution. Read More Civil Liberties, Privacy and Transparency As a member of the nation's Intelligence Community, NSA is held accountable for upholding the laws of the land while providing critical foreign intelligence information to keep America and its allies safe and secure. As part of this, NSA is required by law to protect the freedoms, civil liberties, and privacy rights of Americans while accomplishing important national security missions. Learn More .smalltext22 a{ color:#4448ac; } Technical Signals Intelligence (TechSIGINT) Find out more information on this subdiscipline. Learn More'''
