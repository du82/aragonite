y, the National Security Agency (NSA) announced that Ms. Sheila Thomas has been selected to serve as NSA's next Executive Director and second-highest senior civilian leader. Ms. Thomas brings extensive experience from a variety of positions across NSA and the Department of Defense. Most recently, she served as NSA’s director of Engagement & Policy, where she advanced and integrated essential NSA activities, including: policy and compliance, internal and external communications, engagement with national and foreign partners, and the delivery of intelligence products and services. She has also served overseas and in assignments at the Pentagon, the Department of Commerce, and the FBI. Ms. Thomas succeeds Ms. Catherine Aucella, who retired in December 2024 after serving as NSA Executive Director since August 2022. “Sheila brings a wealth of experience and knowledge from a variety of roles across NSA and the Department of Defense,” said General Timothy D. Haugh, Commander, USCYBERCOM, Director NSA/Chief, CSS. “I am grateful for everything Ms. Aucella did for the Agency as Executive Director and look forward to Sheila’s contributions in her new role.” Ms. Thomas will continue to strengthen the Agency’s external engagement with our partners and stakeholders, while fostering public trust and confidence in support of our vision and strategy. SHARE PRINT var displayNextPrevNav = false var loggedIn = false; var articleId = 4035162; var moduleId = 12594; var mejPlayer; $(function () { if (!window.delayInitMediaElementJs) initMediaElementJs(); }); function initMediaElementJs() { mejPlayer = $(".article-view video").not(".noplayer").mediaelementplayer({ pluginPath: "/desktopmodules/SharedLibrary/Plugins/MediaElement4.2.9/", videoWidth: '100%', videoHeight: '100%', success: function (mediaElement, domObject) { var aDefaultOverlay = jQuery(mediaElement).parents('.media-inline-video, .video-control').find('.defaultVideoOverlay.a-video-button'); var aHoverOverlay = jQuery(mediaEleme