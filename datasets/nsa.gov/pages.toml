learnmore{ position: absolute; bottom: 0; width: 100%; font-family: 'Teko-Light', sans-serif; font-size: 0.7em; font-weight: 300; display: flex; flex-direction: row; justify-content: flex-end; } .learnmore button{ background-color: transparent; border: none; } .learnmore a{ text-decoration: none; } .learnmore a:hover{ text-decoration: underline; } .learnmore .fa-angle-right{ color: #87C232; } .btn-lg { padding: 10px 0 0 0; font-size: 2.3em; line-height: 1.3333333; border-radius: 6px; color: #86C232; margin-left: -15px; justify-content: right; align-content: normal; } Overview The Enduring Security Framework (ESF) is a public-private partnership that addresses risks to critical infrastructure and National Security Systems. ESF is a cross-sector working group that operates under the auspices of Critical Infrastructure Partnership Advisory Council (CIPAC) to address threats and risks to the security and stability of U.S. National Security Systems and critical infrastructure. It is comprised of experts from the U.S. Government as well as representatives from the Information Technology, Communications, and the Defense Industrial Base sectors. ESF is charged with bringing together representatives from private and public sectors to work on intelligence-driven, shared cybersecurity challenges. ESF is chartered by the Department of Defense, Department of Homeland Security, Office of the Director of National Intelligence, and the IT, Communications and Defense Industrial Base Sector Coordinating Councils. NSA serves as the Executive Secretariat of ESF and leverages DHS Critical infrastructure Partnership Advisory Council (CIPAC) authorities to conduct ESF activities. .section-text h2 { font-family: 'Teko-Medium',sans-serif; text-align: left; color:#4448AC; font-size:2.5rem; font-weight:bold; } Enduring Security Framework Products Search var url = location.href; var queryString = url.split('?')[1]; url = url.split('?')[0]; var pageString = ""; if (typeof queryString != "undefi