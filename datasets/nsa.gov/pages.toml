} .DnnModule.DnnModule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } NSA Speakers Bureau Overview Today's world is incredibly complex. The National Security Agency has the daunting task of being part of the team tasked with securing our nation in the midst of the associated chaos. The SpeakersNSA program introduces you to our people and our mission. While we can't discuss every mission aspect, we want to pull back the curtain a bit on what we do. Our team members are immensely proud of their role in the Agency's mission and being an integral part of the national defense structure. Our goal is to identify opportunities for our people to tell you this story -to help relevant audiences understand the intricacies of today's information and cyber environments. Our speakers let you hear directly from our team about topics that are current to us. Many people don't realize the breadth of the NSA mission. The agency workforce is comprised of technical and nontechnical experts in cybersecurity, language analysis, artificial intelligence, business support, and education outreach (to name a few). We encourage you to review the list of common topics and frequently asked questions. If a topic seems relevant to you or your organization, submit a speaker request form and we'll determine how we can support. Speaker Topics NSA speakers support engagements through discussions on a variety of topics. Explore Topics Guidelines & FAQs To ensure your event is successful, NSA offers the following guidelines and answers to frequently asked questions for a seamless experience. Learn More .smalltext22 { margin-bottom: 20px !important; } .smalltext22 a{ color:#4448ac; } Speaker Requests Invite an NSA expert to engage your audience to showcase our mission! Submit Request Podcast Request Form Request an Executive Leader NSA executive leaders are available to engage with your audiences to talk about our mission, strategic outcomes and whole-of-government efforts. To request an executive to speak at your event, use the following: SPEAKING EVENT REQUEST FORM To request an executive in an attendance only role, use the following: ATTENDANCE ONLY REQUEST FORM'''
