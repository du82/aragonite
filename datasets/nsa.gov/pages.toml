title = "Frequently Requested Information"
full_description = '''var windowIsLoaded13423=false; var documentIsReady13423=false; function setModuleHeight13423() { var moduleId=".DnnModule-13423"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit13423() { if(windowIsLoaded13423&&documentIsReady13423) { setModuleHeight13423(); window.addEventListener('resize',setModuleHeight13423); } } $(document).ready(function() { documentIsReady13423=true; pdInit13423(); }); $(window).load(function() { windowIsLoaded13423=true; pdInit13423(); }); Frequently Requested Information HomeHelpful LinksNSA FOIAFrequently Requested Information jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); The Freedom of Information Act Office receives thousands of requests for information each year, many of which are duplicative. For your convenience, a listing of frequent FOIA requests and their general disposition has been created. This list has been sorted into three categories: Declassification and Transparency Initiatives UFO and Other Paranormal Related Information (No Records Exist) Records Exist, but Not Releasable This page contains a list of records which have been requested frequently. The records have been located but are not releasable. This list contains a description of the material and reason for its protection. Collapse All Expand All Micropurchase Card (also known as AMEX/IMPACT cards at some agencies) This list is composed of the names of NSA/CSS employees. The names of employees are protected under the third exemption of the FOIA, which provides for the withholding of information specifically protected from disclosure by statute. The specific statute applicable in this case is Section 6, Public Law 86-36 (50 U.S. Code 3605). Public Law 86-36 allows for the protection of the names of NSA/CSS employees, as well as the functions and activities of the Agency.'''
