full_description = '''var windowIsLoaded13167=false; var documentIsReady13167=false; function setModuleHeight13167() { var moduleId=".DnnModule-13167"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit13167() { if(windowIsLoaded13167&&documentIsReady13167) { setModuleHeight13167(); window.addEventListener('resize',setModuleHeight13167); } } $(document).ready(function() { documentIsReady13167=true; pdInit13167(); }); $(window).load(function() { windowIsLoaded13167=true; pdInit13167(); }); .herotitle{ color: white; font-family: 'Teko-Semibold', sans-serif; font-size: 5rem; font-weight: bold; text-align: center; padding-top: 2%; display: flex; justify-content: center; flex-direction: row; } .herosmall{ font-size: 2rem; font-family: 'Roboto-Thin', sans-serif; color: #ffffff; line-height: 125%; padding-top: 0%; font-weight: normal; text-align:center; padding-bottom: 5%; display: flex; justify-content: center; } .animate{ display: flex; justify-content: center; align-items: center; margin-top: 83px; } /* Style the button and place it in the middle of the container/image */ .animate .btn { background-color:#262626; border-radius:1px; border:2px solid #86C232; display:inline-block; cursor:pointer; color:#ffffff; font-family:'Teko-Light', sans-serif; font-size:2rem; margin-top:-10%; padding-left: 25px; padding-right: 25px; padding-top: 5px; padding-bottom: 2px; text-transform:uppercase; display: flex; justify-content: center; } .animate .btn:hover { background-color: #86C232; color:#262626; } .animate .btn a { color: #ffffff; } .animate .btn a:hover { background-color: #86C232; color:#262626 !important; } .DnnModule.DnnModule-DNN_HTML.DnnModule-12638 { overflow: hidden !important; } Getting Started Contact Us HomeBusinessGetting Started jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); Doing business with NSA is not as daunting as you may have been led to believe. It is true that NSA does no "open" procurements; therefore, you will never see an NSA requirement on SAM.gov. However, by following a few easy steps, you can register your company in NSA's Acquisition Resource Center (ARC) and begin to position your business to do work with NSA. Getting Started The first step is to register your company in NSA's Acquisition Resource Center (ARC). Before you can register in the ARC, however, you must be registered in the System for Award Management (SAM). If you are not currently registered in the SAM, follow the link provided and return here after you have your confirmed SAM registration. Once you have completed your SAM registration, visit www.nsaarc.net to begin your ARC registration. For questions you can contact the ARC at (866) 91-GOARC or by email. After registering in the ARC, you should attend the Office of Small Business Programs' Pathway to Success: A Start-Up Guide to Working with NSA briefing. The briefing is open to companies of all sizes and provides a comprehensive overview of the NSA acquisition process and programs designed to help companies understand how to do business with the agency. "Pathway to Success" is a standing, monthly briefing. This is the Office of Small Business Programs' "Start-up Guide" for how to do business with the agency, and is held in lieu of one-on-one meetings with companies due to the large numbers of small businesses interested in working with the NSA. Register for the "Pathway to Success" briefing. Each of these meetings will provide detailed information about the next steps you should take to position your company to do business with the National Security Agency. If you need assistance with any of these steps, please call (443) 479-2384 or contact the Office of Small Business Programs. Once you have completed the above, please visit our Business Programs & Resources page for additional business opportunities available at NSA.'''
