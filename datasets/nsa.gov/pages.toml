full_description = '''var windowIsLoaded13834=false; var documentIsReady13834=false; function setModuleHeight13834() { var moduleId=".DnnModule-13834"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit13834() { if(windowIsLoaded13834&&documentIsReady13834) { setModuleHeight13834(); window.addEventListener('resize',setModuleHeight13834); } } $(document).ready(function() { documentIsReady13834=true; pdInit13834(); }); $(window).load(function() { windowIsLoaded13834=true; pdInit13834(); }); Advancing Intelligence through Science NSA Research focuses on innovation and collaboration to maintain the competitive edge. Research @ NSA Overview NSA conducts leading-edge research to advance U.S. intelligence and national security capabilities by inventing, developing, and applying advancements in science and emerging technologies. Learn More The Next Wave NSA offers the latest news on emerging technologies in research. Read Issues .smalltext22 a{ color:#4448ac; } Mission-Oriented Research NSA focuses on seven mission-oriented research areas. Learn More Science of Security NSA sponsors the Science of Security (SoS) Initiative for the promotion of a foundational cybersecurity science that is needed to mature the cybersecurity discipline and to underpin advances in cyber defense. Learn More Technology Transfer Program NSA Technology Transfer Program transfers NSA-developed technology to industry, academia, and other research organizations, benefitting the economy and the Agency mission. The program has an extensive portfolio of patented technologies across multiple technology areas. Learn More .smalltext22 a{ color:#4448ac; } Mathematical Sciences Program NSA Mathematical Sciences Program is proud to offer grant funding for eligible faculty members because it recognizes the mutual benefit of maintaining a vigorous academic mathematics community. Learn More Featured Publications by NSA Researchers NSA researchers are active in their fields within and outside of NSA. View a list of their external publications via the button below. Learn More'''
