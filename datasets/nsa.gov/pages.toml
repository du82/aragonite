title = "Conferences and Events"
full_description = '''var windowIsLoaded13177=false; var documentIsReady13177=false; function setModuleHeight13177() { var moduleId=".DnnModule-13177"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit13177() { if(windowIsLoaded13177&&documentIsReady13177) { setModuleHeight13177(); window.addEventListener('resize',setModuleHeight13177); } } $(document).ready(function() { documentIsReady13177=true; pdInit13177(); }); $(window).load(function() { windowIsLoaded13177=true; pdInit13177(); }); Business Conferences & Events HomeBusinessConferences & Events jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); NSA hosts a variety of conferences and events to support those who wish to partner with us. Unless otherwise noted in the event information, registration announcements are published prior to the event on the NSA ARC website. Collapse All Expand All Pathway to Success Presentation Pathway to Success" is a monthly presentation that helps companies, large and small, learn about the Agency's needs and special programs that help increase NSA's industrial base. Attendees will learn about the Acquisition Resource Center (ARC), how it is used, the importance of a company profile, and how to market their company's capabilities to the Agency. This presentation helps companies "get started" with NSA and is held in lieu of one-on-one meetings. Advance registration is required and secured on a first-come, first-served basis; registrants must be U.S. citizens; and reservations are limited to two people per company. For additional information on getting started and how to register to attend the Pathway to Success presentation, visit Getting Started. Technology Expositions/Vendor ShowcasesThese events are held in Agency spaces and provide companies with a cost and time effective forum to demonstrate their capabilities to NSA personnel. Companies with similar capabilities and/or socioeconomic status are invited to maximize the networking opportunities. Business in a MinuteOur annual Business in a Minute event consists of focused meetings scheduled throughout the day between industry representatives, NSA prime contractors, and NSA government representatives. Industry representatives are given 15 minutes to spotlight their company's capabilities to prime contractors and government representatives who either schedule a follow-up meeting with the company or provide constructive feedback on the company's products/services. NSA/Armed Forces Communications Electronics Association (AFCEA) Mission & Acquisition Symposium (NAMAS)NAMAS is an annual classified event held each fall that provides detailed information about NSA's future plans. During this event, NSA provides industry with mission and acquisition information, such as focus areas, near-term contract solicitation schedules, and long-term government business forecasts. The symposium strengthens NSA's business partnerships and supports companies' strategic business planning. Attendance is restricted to individuals with appropriate clearance levels. NSA Acquisition/Industry Partnership Exchange (NAIPE)NAIPE is an annual unclassified conference held each spring for companies actively working under an NSA contract as a prime contractor or subcontractor. This event is designed to give contractors the opportunity to meet with NSA representatives from select Agency organizations to discuss issues and challenges faced while doing business with NSA. The event includes presentations by NSA acquisition executives and informative breakout sessions.'''
