 in the past five years is that industry is just as important in painting our threat pictures as our USG partners… We’ve realized we need to be talking to each other." - Kristina Walter, Chief of the Cybersecurity Collaboration Center var windowIsLoaded16586=false; var documentIsReady16586=false; function setModuleHeight16586() { var moduleId=".DnnModule-16586"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit16586() { if(windowIsLoaded16586&&documentIsReady16586) { setModuleHeight16586(); window.addEventListener('resize',setModuleHeight16586); } } $(document).ready(function() { documentIsReady16586=true; pdInit16586(); }); $(window).load(function() { windowIsLoaded16586=true; pdInit16586(); }); .CCCservices .narrow-box-section { min-width: 350px; padding: 46px; margin: 20px; } DIB Cybersecurity Services at no cost to DoD Contractors Protective Domain Name Services (DNS) Block users from connecting to malicious domains to drive down risk and protect DOD information. Attack Surface Management Gain an adversarial view of your internet-facing assets; find and fix issues before they do. Threat Intelligence Collaboration Stay one step ahead of the adversary through NSA threat intelligence. Continuous Autonomous Penetration Testing Run rapid, machine-driven pen-tests against internal networks and receive tailored mitigations guidance. Do you have an active DoD contract? Enroll in NSA’s DIB Cybersecurity services. Get Started Our Offerings DIB Cybersecurity Services NSA offers no-cost cybersecurity services to any company that has contracts with DoD or access to non-public DoD information. Learn More Collaborative Partnerships NSA establishes collaborative relationships to prevent, detect, and defeat cyber adversaries targeting our nation’s most sensitive networks. Learn More Standards and Certifications U.S. participation in standards and certifications secures emerging technologies and empowers U.S. industry to shape the market. Learn More Cybersecurity Academic Outreach NSA invests in academic partnerships to recruit, train, equip, and retain the next generation of cybersecurity professionals. Artificial Intelligence Security Center NSA combines research with intelligence insights to detect AI vulnerabilities, provide mitigations, and publish AI best practices for NSS and the DIB. Learn More var windowIsLoaded15821=false; var documentIsReady15821=false; function setModuleHeight15821() { var moduleId=".DnnModule-15821"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit15821() { if(windowIsLoaded15821&&documentIsReady15821) { setModuleHeight15821(); window.addEventListener('resize',setModuleHeight15821); } } $(document).ready(function() { documentIsReady15821=true; pdInit15821(); }); $(window).load(function() { windowIsLoaded15821=true; pdInit15821(); }); Enduring Security Framework The Enduring Security Framework (ESF) is a public-private partnership that aims to address risks that threaten critical infrastructure and National Security Systems (NSS). ESF is charged with bringing together representatives from private and public sectors to work on intelligence-driven, shared cybersecurity challenges. ESF produces cybersecurity guidance on chronic challenges, jointly developed by NSA, CISA and industry partners. Read More'''
