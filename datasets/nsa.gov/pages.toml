title = "National Security Agency/Central Security Service > Business > Overview"
full_description = '''var windowIsLoaded13538=false; var documentIsReady13538=false; function setModuleHeight13538() { var moduleId=".DnnModule-13538"; var thisModule=$(moduleId+":first"); var nextSiblings=thisModule.nextAll(".DnnModule").slice(0,1); if(nextSiblings) { var height=0; nextSiblings.each(function() { $(this).css({ 'overflow': 'auto', 'position': 'relative' }); height+=$(this).outerHeight(true); }); var updatedCss={ "height": height+"px", "marginBottom": "-"+height+"px" } thisModule.find('.pdbg-container').css(updatedCss); } } function pdInit13538() { if(windowIsLoaded13538&&documentIsReady13538) { setModuleHeight13538(); window.addEventListener('resize',setModuleHeight13538); } } $(document).ready(function() { documentIsReady13538=true; pdInit13538(); }); $(window).load(function() { windowIsLoaded13538=true; pdInit13538(); }); How to do Business with NSA HomeBusinessOverview jQuery(document).ready(function () { var lastBreadcrumbItem = jQuery(".skin-breadcrumb-container a").last(); var breadcrumbSpan = $("<span>").text(lastBreadcrumbItem.text()).addClass(lastBreadcrumbItem.attr("class")); lastBreadcrumbItem.replaceWith(breadcrumbSpan); }); NSA encourages all parties interested in doing business with us to review the entire “Doing Business with Us” section of our website. The NSA Office of Small Business Programs provides information about events, programs, and opportunities designed to help businesses understand how to work with us. Please note that we do not meet with companies one-on-one. We encourage you to visit our Getting Started webpage and attend an upcoming Pathway to Success - Doing Business with the National Security Agency briefing where you will receive all available information about doing business with us. If you still have questions after reviewing our website and attending the briefing, you may contact the NSA Office of Small Business Programs by email or phone at (443) 479-2384. The mission of this office is to ensure that small businesses; service-disabled, veteran-owned small businesses; HUBZone small businesses; small disadvantaged businesses; and woman-owned small businesses have the maximum practicable opportunity to participate in NSA acquisitions. Our office provides innovative approaches to maximize NSA prime contract and subcontract opportunities for small businesses while maintaining a vigilant, effective, approachable, and visible small business advocacy program. We are committed to ensuring the growth of small business opportunities at NSA, and we advocate on behalf of the small business community, as a whole, on a daily basis. NSA operates its small business programs in accordance with federal policies and guidelines, including: Federal Acquisition Regulation (FAR) Defense Federal Acquisition Regulation Supplement (DFARS) SBA.gov Department of Defense Office of Small Business Programs'''
