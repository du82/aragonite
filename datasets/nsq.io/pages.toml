["https://nsq.io/clients/tcp_protocol_spec.html"]
title = "NSQ Docs 1.3.0 - TCP Protocol Spec"
full_description = "The NSQ protocol is simple enough that building clients should be trivial in any language. We provide official Go and Python client libraries. After connecting, a client must send a 4-byte “magic” identifier indicating what version of the protocol they will be communicating (upgrades made easy). After authenticating, the client can optionally send an IDENTIFY command to provide custom metadata (like, for example, more descriptive identifiers) and negotiate features. In order to begin consuming messages, a client must SUB to a channel. Upon subscribing the client is placed in a RDY state of 0. This means that no messages will be sent to the client. When a client is ready to receive messages it should send a command that updates its RDY state to some # it is prepared to handle, say 100. Without any additional commands, 100 messages will be pushed to the client as they are available (each time decrementing the server-side RDY count for that client). The V2 protocol also features client heartbeats. Every 30s (default but configurable), nsqd will send a _heartbeat_ response and expect a command in return. If the client is idle, send NOP. After 2 unanswered _heartbeat_ responses, nsqd will timeout and forcefully close a client connection that it has not heard from. The IDENTIFY command may be used to change/disable this behavior. Unless stated otherwise, all binary sizes/integers on the wire are network byte order (ie. big endian) Valid topic and channel names are characters [.a-zA-Z0-9_-] and 1 <= length <= 64 (max length was 32 prior to nsqd 0.2.28) feature_negotiation (nsqd v0.2.19+) bool used to indicate that the client supports feature negotiation. If the server is capable, it will send back a JSON payload of supported features and metadata. output_buffer_size (nsqd v0.2.21+) the size in bytes of the buffer nsqd will use when writing to this client. output_buffer_timeout (nsqd v0.2.21+) the timeout after which any data that nsqd has buffered will be flushed to this client."
year_published = 2025
clearnet = "https://nsq.io/clients/tcp_protocol_spec.html"
