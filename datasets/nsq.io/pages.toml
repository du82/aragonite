["https://nsq.io/overview/internals.html"]
title = "NSQ Docs 1.3.0 - Internals"
full_description = "nsqlookupd is the daemon that manages topology information and provides an eventually consistent discovery service. nsqadmin is a web UI to introspect the cluster in realtime (and perform various administrative tasks). Data flow in NSQ is modeled as a tree of streams and consumers. A topic is a distinct stream of data. A channel is a logical grouping of consumers subscribed to a given topic. A single nsqd can have many topics and each topic can have many channels. A channel receives a copy of all the messages for the topic, enabling multicast style delivery while each message on a channel is distributed amongst its subscribers, enabling load-balancing. These primitives form a powerful framework for expressing a variety of simple and complex topologies. Topics and channels, the core primitives of NSQ, best exemplify how the design of the system translates seamlessly to the features of Go. Go’s channels (henceforth referred to as “go-chan” for disambiguation) are a natural way to express queues, thus an NSQ topic/channel, at its core, is just a buffered go-chan of Message pointers. The size of the buffer is equal to the --mem-queue-size configuration parameter. To get messages from a topic to its channels the topic cannot rely on typical go-chan receive semantics, because multiple goroutines receiving on a go-chan would distribute the messages while the desired end result is to copy each message to every channel (goroutine). Instead, each topic maintains 3 primary goroutines. The first one, called router, is responsible for reading newly published messages off the incoming go-chan and storing them in a queue (memory or disk). The second one, called messagePump, is responsible for copying and pushing messages to channels as described above. Channels are a little more complicated but share the underlying goal of exposing a single input and single output go-chan (to abstract away the fact that, internally, messages might be in memory or on disk): Additionally, each channel maintains 2 time-ordered priority queues responsible for deferred and in-flight message timeouts (and 2 accompanying goroutines for monitoring them)."
year_published = 2025
clearnet = "https://nsq.io/overview/internals.html"
