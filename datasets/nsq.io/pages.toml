["https://nsq.io/overview/performance.html"]
title = "NSQ Docs 1.3.0 - Performance"
full_description = "The main repo contains a script (bench/bench.py) that automates a distributed benchmark on EC2. It bootstraps N nodes, some running nsqd and some running load-generating utilities (PUB and SUB), and then parses their output to provide an aggregate total. The following runs reflect the default parameters of 6 c3.2xlarge, the cheapest instance type that supports 1gbit links. 3 nodes run an nsqd instance and the rest run instances of bench_reader (SUB) and bench_writer (PUB), to generate load depending on the benchmark mode. This benchmark measures just producer throughput, with no additional load. The message size is 100 bytes and messages are distributed over 3 topics. This benchmark more accurately reflects real-world conditions by servicing both producers and consumers. Again, the message size is 100 bytes and messages are distributed over 3 topics, each with a single channel (24 clients per channel). At an ingress of ~842k and egress of ~806k msgs/s, consuming an aggregate 156mb/s of bandwidth, we’re now maxing out the CPU capacity on the nsqd nodes. By introducing consumers, nsqd needs to maintain per-channel in-flight accounting so the load is naturally higher. The consumer numbers are slightly lower than producers because consumers send twice the number of commands as producers (a FIN command must be sent for each message), impacting throughput. DISCLAIMER: Please keep in mind that NSQ is designed to be used in a distributed fashion. Single node performance is important, but not the end-all-be-all of what we’re looking to achieve. Also, benchmarks are stupid, but here’s a few anyway to ignite the flame:"
