title = "NSQ Docs 1.3.0 - A realtime distributed messaging platform"
full_description = "NSQ promotes distributed and decentralized topologies without single points of failure, enabling fault tolerance and high availability coupled with a reliable message delivery guarantee. See features & guarantees. NSQ scales horizontally, without any centralized brokers. Built-in discovery simplifies the addition of nodes to the cluster. Supports both pub-sub and load-balanced message delivery. It’s fast, too. NSQ is easy to configure and deploy and comes bundled with an admin UI. Binaries have no runtime dependencies and we provide pre-compiled releases for linux, darwin, freebsd and windows as well as an official Docker image. Official Go and Python libraries are available as well as many community supported libraries for most major languages (see client libraries). If you’re interested in building your own, there’s a protocol spec."
