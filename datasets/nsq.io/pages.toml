["https://nsq.io/deployment/docker.html"]
title = "NSQ Docs 1.3.0 - Docker"
full_description = "There is a single, minimal nsq image that contains all of the NSQ binaries. Each binary can be run by specifying the binary as the command when running Docker. The basic format is: Set the --lookupd-tcp-address flag to the host’s IP and the TCP port of previously run nsqlookupd, i.e. dockerIP:4160: Note that this uses port 4160, the port exposed when we started the nsqlookupd container (which also happens to be the default port for nsqlookupd). To use TLS with containerized NSQ binaries, you need to include the certificate file, the private key, and the root CA file. The Docker image has a volume mount available at /etc/ssl/certs/ available for this purpose. Mount a host directory containing the files to the volume, then specify the files in the command line, as usual: This will load the certificates from /home/docker/certs into the Docker container to use when running. To store nsqd data on the host disk, use the /data volume as your data directory, which lets you mount to a data-only Docker container or mount to a host-directory: To start nsqd, nsqlookupd, and nsqadmin together using docker-compose then create a docker-compose.yml. To start run the following command from the same directory as the docker-compose.yml created previously. A private network will be created and three containers will be started using the private network. On the local host each container will have a random port mapped to ports exposed in the docker-compose.yml. Assuming that the nsqlookupd had host port 31001 mapped to the container port 4161 a simple ping could be performed using curl."
year_published = 2025
