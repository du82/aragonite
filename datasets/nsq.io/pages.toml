["https://nsq.io/overview/faq.html"]
title = "NSQ Docs 1.3.0 - FAQ"
full_description = "nsqd is a relatively lightweight process with a bounded memory footprint, which makes it well suited to “playing nice with others”. Another benefit is that it essentially forms an independent, sharded, silo of data for that topic on a given host. NSQ promotes a consumer-side discovery model that alleviates the upfront configuration burden of having to tell consumers where to find the topic(s) they need. However, it does not provide any means to solve the problem of where a service should publish to. This is a chicken and egg problem, the topic does not exist prior to the first publish. By co-locating nsqd (see question above), you sidestep this problem entirely (your service simply publishes to the local nsqd) and allow NSQ’s runtime discovery system to work naturally. Typically only a few depending on your cluster size, number of nsqd nodes and consumers, and your desired fault tolerance. 3 or 5 works really well for deployments involving up to several hundred hosts and thousands of consumers. nsqlookupd nodes do not require coordination to answer queries. The metadata in the cluster is eventually consistent. NO! Just use the HTTP endpoints for publishing (/pub and /mpub). It’s simple, it’s easy, and it’s ubiquitous in almost any programming environment. We believe NSQ’s default mode of operation should prioritize safety and we wanted the protocol to be simple and consistent. (1) and (2) should be considered programming errors. (3) and (4) are rare and (5) is a natural part of any TCP based protocol. Deleting topics is a relatively infrequent operation. If you need to delete a topic, orchestrate the timing such that publishes eliciting topic creations will never be performed until a sufficient amount of time has elapsed since deletion. For example, good topic names are encodes, decodes, api_requests, page_views and good channel names are archive, analytics_increment, spam_analysis. There are no built-in limits imposed. It is only limited by the memory and CPU of the host nsqd is running on (per-client CPU usage was greatly reduced in issue #236)."
year_published = 2025
