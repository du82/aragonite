["https://nullcon.net/goa-2025/cfp"]
title = "Nullcon Security Conference & Training"
description = "Nullcon is Asia’s largest international security conference, where key stakeholders from the industry, delegates from the government company representatives, COOs and hackers come together to talk about InfoSec"
full_description = '''< NULLCON 2025 - GOA /> Call for Papers CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue Welcome to the 15th Edition of Nullcon Goa Nullcon is an annual security conference held in Goa, India, dedicated to showcasing the diverse talents within the information security industry. It is a platform for freshers and experts to share their groundbreaking research and innovations with the cybersecurity community. The conference highlights the latest developments in both offensive and defensive security technologies, inviting researchers and hackers from around the world to present the 'Next Big Thing' in security. NOTE: Request you to go through the below content before making a submission even if you are a seasoned speaker. < CFP opens on /> 5th September 2024 < CFP closes on /> 15th November 2024 CFP Closed SUBMISSION TOPICS We are interested in new and cutting-edge security findings that align with our motto, "The next security thing!" Some security topics for your reference (but not limited to) are IoT Web SDN Radio Cloud Mobile Telecom Web3 Satellites Networks Forensics Hardware Embedded ICS/SCADA Smart Cities Blockchain IMPORTANT DATES CFP OPENS CFP CLOSE FINAL SPEAKER ANNOUNCEMENT TRAINING DATES CONFERENCE DATES 5th September 2024 15th November 2024 01st December onwards 26th-28th February 2025 1st-2nd March 2025 WHO CAN SUBMIT A CALL FOR PAPERS? Be it a fresher or an expert, we encourage all InfoSec enthusiasts to submit their work. At Nullcon we have multiple tracks suitable for individuals with diverse interests, we have a dedicated track for iOS and macOS admirers. An exclusive track for BountyCraft for individuals who are always finding bugs and fixing them. Developer track, where individuals can display methods of securing websites/applications while building them. A specific track dedicated to technical women researchers — Winja Track; where we boost women to bridge the gender gap in the InfoSec industry. Workshops and Villages for participants who love being introduced to new ideas, allowing them to practice hands-on skills in a safe environment. Lastly, we have a Main track for technical talks to address prevalent challenges and difficulties related to cyber security. REVIEW Based on the scoring of our external review panel members and our internal decision, we take a call on the acceptance of papers. We are immensely thankful to our Call For Papers (CFP) Review Board members for volunteering in their free time to review and score the research submissions. Please Note: The Call For Papers (CFP) Review Board is independent; we do not provide them any monetary benefits. Apart from the process of 'Call For Papers' (CFP), Nullcon has no associations with the Review Board members in terms of their business / projects / social engagements. SUBMISSION GUIDELINES Early Submissions Submitting early ensures a better possibility of your research being accepted in the first round of review itself. The more you delay, the more competition you have with other papers that are submitted later. Select Correct Research Category Ensure to choose the relevant submission category in the form. If the submission is going to be presented prior to the Nullcon conference or is an enhancement of presented research, it falls under Current Research and not New Research. New Research Gets Priority Over Current Research At Nullcon we focus on New Research that has not been published / presented prior to the Nullcon conference dates. If your submission is a rework / enhancement of your existing research or a similar presentation to what is already delivered / published elsewhere, it will get less scoring as compared to new research. Ensure Using Real-Life Examples / Case Studies / Demos A great submission always reflects on how it is implied in reality, this can be done by sharing real-life experiences, connecting it with a case study or simply presenting a live demo. Spare No Technical Details Providing concrete technical details ensures a better chance of the research being accepted. Reviewers often give a low score to submissions that have small or vague abstracts and due to time constraints may not even get a chance to request more details. Therefore, the best way is to provide a supporting full technical paper that explains all the vulnerabilities, exploits, etc in detail. Review Feedback We do not ask our review board members for comments. Declining A Submission Please take rejection as a suggestion for improvement somewhere in the paper and not as an offense. Declining on a paper does not mean your submission is not good. There are many parameters we look at when reviewing a paper, technical in-depth is only one of them. Many times, we have to let go of really good talks because there is already an accepted paper on a similar subject or too many good submissions, or your submission is already presented/published elsewhere. We want you to succeed and are only trying to help you to prepare for future submissions. So, cheer up and get ready for the next submission. RESEARCH SUBMISSION CATEGORIES New Research A research topic that has not been presented/published or is not going to be presented/published before Nullcon Goa 2025. Desi Jugaad It is a Hindi word for "Local Hacks." This category is dedicated to hackers who find innovative tech/non-tech solutions for real-life challenges. Current Research A research topic that has already been presented/published partly or wholly before Nullcon Goa 2025. SPEAKER BENEFITS For New Research Category: Travel Reimbursement (either the actual spent amount or the below-mentioned amount, whichever is less) - International Speaker (USD 1200) - National Speaker (INR 7000) Complimentary Accommodation for 3 Nights. Complimentary Corporate Conference Pass. Invitation to Speaker Gathering along with Drinks. Invitation to Nullcon Networking Dinner Party. For Other Categories (Current Research, Desi Jugaad, Workshop, Village): Complimentary Accommodation near or at the Venue for 3 Nights. Complimentary Corporate Conference Pass. Invitation to Speaker Gathering along with Drinks. Invitation to Nullcon Networking Dinner Party. * Travel Reimbursement exception can be made for the Current Research submission if the talk scoring is high from the review team. Please note, we do not share review scores/comments with any individual. This is purely on the discretion of the organization team. SPEAKER TERMS AND CONDITIONS Only one speaker will be eligible for Travel Reimbursement benefits in case of two or more speakers for a talk. The process to redeem the Travel Reimbursement will begin a week after the conference is over. It is mandatory to submit a soft copy of your passport and e-visa for reimbursement purposes. We do not provide Travel Reimbursement in cash. The provided accommodation will be shared among speakers in case of two or more speakers for a talk. Once a talk is accepted, it is not allowed to add more speakers to the talk. By submitting a paper and agreeing to talk at Nullcon, the submitter gives Payatu Technologies Pvt Ltd. (Organizer of the Nullcon Goa Conference), the right to post, publish, and re-distribute online and offline, soft, and/or hard copies of the presentation material including slides, source code, detailed paper, and the recorded video of the presentation and the speaker(s). All proposals must be submitted through the Call For Papers (CFP) form. Proposals submitted through any other way will not be considered for CFP review. The talk submitted for a specific event will only be considered for that event only. CONTACT If you have any queries, feel free to get in touch with us at [email protected] For sponsorship/registration queries, please get in touch with us at [email protected]. All our recent updates will also be announced on our Twitter handler @nullcon - this is the easiest and shortest way to know us.'''
