["https://nullcon.net/goa-2025/speaker-state-of-iOS-jailbreaking"]
title = "Nullcon Security Conference & Training"
description = "Nullcon is Asia’s largest international security conference, where key stakeholders from the industry, delegates from the government company representatives, COOs and hackers come together to talk about InfoSec"
full_description = "< NULLCON 2025 - GOA /> About the Speaker CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Lars Fröder Security Researcher Cellebrite Labs < Talk Title /> State of iOS Jailbreaking in 2025 < Talk Category /> iOS and macOS Track < Talk Abstract /> Ever since the introduction of the iPhone in 2009, hackers and enthusiast have been exploiting security vulnerabilities to gain control over their iOS devices, to escape Apples walled garden.In recent years, Apple has heavily cracked down on Kernel post exploitation with features such as- Kernel Patch Protection (KPP/KTRR)- Pointer Authentication (PAC)- Page Protection Layer (PPL)Bypasses for some of these features are now required to gain the desired level of control over the operating system.This talk aims to provide an up-to-date high level overview over the most recent tools to archive code execution and jailbreak on iOS and their internals, including the vulnerabilities they exploit.The talk covers two tools developed by the presenter:- TrollStore, a way to install unsigned apps based on a codesign vulnerability on iOS 14.0 - 16.6.1, 17.0- Dopamine, a jailbreak for iOS 15.0 - 16.5 < Speaker Bio /> Lars is a Security Researcher at Cellebrite Labs."
