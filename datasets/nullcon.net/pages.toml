["https://nullcon.net/goa-2025/speaker-surfing-the-wild-west-of-open-source-software"]
title = "Nullcon Security Conference & Training"
description = "Nullcon is Asia’s largest international security conference, where key stakeholders from the industry, delegates from the government company representatives, COOs and hackers come together to talk about InfoSec"
full_description = "< NULLCON 2025 - GOA /> About the Speaker CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Abhisek Datta Co-Founder SafeDep < Talk Title /> Surfing the Wild Wild West of Open Source Software Supply Chain Risks < Talk Category /> Workshop and Villages < Talk Abstract /> Everyone uses open source software (OSS) but it comes with a cost. Cost of vulnerabilities and malware. The malware sprawl in the OSS ecosystem has increased by over 700% since 2022. Vulnerabilities in unmaintained or unpopular libraries become a high risk security debt for consumer software development teams. While many organization have an OSS component vetting proess in place, they are hardly effective due to the sheer volume of components brought in as direct and transitive dependencies. The process needs to be automated, contextual and mature over time to be effective. This is what `vet`, a free and open source tool, intends to solve.In this workshop, the participants will learn to identify risky OSS components and setup policy driven guardrails to protect against such risks. Particularly they will experienceA real-world example of malicious open source library and its reverse engineeringUsing `vet` to identify risky open source components using custom policy as codeAutomating OSS component vetting in CI/CD (GitHub Actions) using `vet-action`Writing `vet` policies using Common Expressions Language (CEL)Forking, hacking and contributing to `vet`Use and contribute to `vet`:https://github.com/safedep/vet < Speaker Bio /> Abhisek is the creator and maintainer of vet, a free and open source tool for policy driven vetting of OSS dependencies. He is currently building SafeDep, a company focussed on making OSS safe & trusted for software development teams."
year_published = 2025
