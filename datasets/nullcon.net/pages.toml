full_description = "< NULLCON 2025 - GOA /> Volunteer CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue CALL FOR VOLUNTEERS NULLCON GOA 2025 Volunteer Registration will be open from 10th January 2025 12:00 AM IST to 12th January 2025 11:59 PM IST. Nullcon has always been a great learning experience for volunteers. In order to ensure a successful event, we rely on precise planning for a smooth execution of the conference, along with making it a wonderful experience for our volunteers. We like to ensure that our Con-Trollers enjoy the conference by being part of some of the activities while being accountable for the tasks they have been allocated to. Keeping the same in mind, we request all our interested candidates to read the terms and conditions carefully before signing up for volunteering and filling up the planner. Volunteer Task Breakdown: A preview of what the tasks will look like for a Con-troller at Nullcon. The mentioned tasks is a reference list: Registration Desk: Help attendees check in, distribute passes, and direct them to the venue. Manage the merchandise desk. Exhibition Booth: Support exhibitors and maintain cleanliness in the hall. Be a point of contact for exhibitors, ensuring smooth operations. Hosting: Introducing speakers, managing stage logistics, and ensure technical setups are ready. Monitoring session timing and ensure the next speaker is prepared. Help Desk / Control Room: Serve as the event’s coordination hub, managing issues and maintaining clear communication. Party Duty: Verify valid passes at the networking party and ensure safety and security. Runners: Assist with errands, fill in for other volunteers during breaks and support wherever needed. Photography / Videography: Capture key moments, assist the main photographer and video crew with documentations. Hygiene Management: Maintain cleanliness across the venue, coordinate with helping staff for timely cleaning, and ensure hygiene standards are met. Terms and Condition: General Rules: The primary intention behind volunteering at Nullcon shouldn't be of attending the conference. When you volunteer with us, you’re stepping into a role that’s just as important as any full-time job. We expect our volunteers to take on their responsibilities seriously and give their best on both days of the event. Volunteering at Nullcon offers a chance to develop diverse skills, build your network, and gain insights into areas outside your usual career field. One can always take a quick break between a shift to cool off their heels. It is understandable that being in Goa volunteers would like to have a leisurely evening by the beach or over drinks; however, it is crucial to report to the shift on time and avoid any excuses during the event as it's of prime importance. Accommodation will be provided by the Nullcon Team however considering your convenience or preference you are free to stay elsewhere at your own expense and responsibility. We understand you would love to attend a particular talk or session during the conference; to make this possible please reach out to the group leaders well in advance so they can arrange replacements. However, remember, if you've already been assigned a duty, we ask that you prioritise your responsibility and fulfill it as part of your volunteer commitment. Please Note: The volunteers need to make their own travel reservations for the conference. Event Setup & Tear Down: Event Setup: All Volunteers have to report to the Main Venue (Bits Pilani Goa) at 5:00 PM on 28th February 2025 for setting up the conference. Tear Down: All Volunteers must stay back at the venue on 2nd March 2025 at 5:00 PM of the conference to complete the tear down of the event zone. Accommodation: For all the volunteers, Shared Accommodation will be provided. (Hotel check-in on 28th February 2025 & check-out on 3rd March 2025). Post Conference Party: Upon successful completion of the Conference, we would arrange an exclusive Cocktail Dinner for the Con-Trollers. The venue and the timing will be shared at the Conference. Managing Indiscipline: Volunteers not adhering to time disciplines or unable to complete the committed shifts need to pay for the accommodation and registration pass provided free to the volunteers. Nullcon reserves the right to cancel Volunteer benefits in any case of misbehavior or conference's violation of the code of conduct. (https://nullcon.net/about-conferencepolicy/) Any complaints of misdemeanor will lead to the Blacklisting of the candidate for Volunteering at Nullcon. Submission Closed for Call For Volunteers."
