["https://nullcon.net/goa-2025/training/advanced-infrastructure-security-assessment-goa-2025"]
title = "Nullcon Security Conference & Training"
description = "Nullcon is Asia’s largest international security conference, where key stakeholders from the industry, delegates from the government company representatives, COOs and hackers come together to talk about InfoSec"
full_description = "< NULLCON 2025 - GOA /> About The Training CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Goa 2025 | Trainings AI Security: Terminating The Terminator Advanced Infrastructure Security Assessment Attack and Defend Software Supply Chains Azure Cloud Attacks for Red and Blue Teams Blocking the Storm: A Hands-On Guide to Hardening and Securing Kubernetes Clusters DevSecOps - A Hands-on Experience Efficient Malware Analysis: Comprehensive Approach HackTheWeb: Pentesting Beyond Basics Hacking Android Applications IoT Security Bootcamp GOA Edition Rapid Threat Model Prototyping (RTMP) - Agile Threat Modeling Mastery including Cloud and AI Slaying the RE Dragon: Mastering Reverse Engineering The Application Security Tool Stack - How to Discover Vulnerabilities in Software Prashant Mahajan Sold Out Training Objectives Training Outlines WHAT TO BRING? Training PREREQUISITE WHO SHOULD ATTEND? WHAT TO EXPECT? WHAT ATTENDEES WILL GET? WHAT NOT TO EXPECT? ABOUT THE TRAINER < Training Title /> Advanced Infrastructure Security Assessment < Training Schedule /> Start Date: Feb 26, 2025 End Date: Feb 28, 2025 < Training Venue /> Venue: Bogmallo Beach Resort Goa < Training Objectives /> Security systems are evolving and becoming more complex, and so are hacking techniques. Every successful compromise of the network infrastructure has to evade multiple layers of security in a perfect sequence. Imagine yourself in an environment with diverse operating systems, servers, and applications with legacy as well as in-house developed products and security solutions such as firewalls, AV, etc. How do you plan to go ahead and pwn them all? Learn to exploit and compromise targets where Metasploit will not work by default. Look inside the exploit code, and tweak them to make it work against your targets. Perform a wide array of tricks to discover, enumerate, and pwn services, systems, and domain controllers. Move around in an enterprise network with Active Directory. Analyse and exploit enterprise software components. NOTE: This is an advanced training program. The participants are expected to be familiar with network services vulnerability assessment and penetration testing, including basic ideas about vulnerabilities and their exploitation techniques. < Training Level /> Advanced < Training Outlines /> Day-1Exploiting network service to gain a footholdDiscover network servicesTry exploitation with public toolsCustomize public exploit to gain accessPivoting LabPivoting using Meterpreter and SOCKS TunnelProxychains, Sliver, ChiselDiscovering and exploiting internal networkHacking the Evil CorpDiscover apps and servicesExploit configuration weaknesses for information gatheringAV EvasionDay-2Windows Domain ExploitationNetwork discovery and gaining entry to the domainCredential extraction from memoryActive Directory enumerationKerberos attackPass the TicketKerberoastingDomain privilege escalationLateral MovementPsExec / PSSession with Hash / Ticket (PtH / PtT)Golden TicketDCSyncDay-3More Lateral MovementACL AbuseDelegationUnconstrainedConstrainedResource-based Based Constrained DelegationAzure and Hybrid < WHAT TO BRING? /> A laptop with administrator privilegesMinimum 50 GB of free hard disk spaceMinimum 4 GB RAM for virtual machinesA laptop should have ethernet and wifi capability (Adapters for Ethernet Connectivity).VM Player or VMWare Workstation installedAdministrative rights on the laptop to disable AV.GitHub IDNote: The Apple M series will not be supported. < Training PREREQUISITE /> Experience with vulnerability assessment and penetration testingFamiliarity with web application security vulnerabilitiesBasic knowledge of TCP / IP network protocolFamiliarity with virtualization tools like VMware / VirtualBox < WHO SHOULD ATTEND? /> Penetration TesterSecurity AnalystSecurity Engineer < WHAT TO EXPECT? /> Exposure to infrastructure penetration testing tools and techniquesExploiting enterprise networkLive real-life scenariosMulti vector attacksExploiting configuration vulnerabilities < WHAT ATTENDEES WILL GET? /> A lab manual will be provided at the end of the course, which can be used as a cheat sheet in real-life engagements. < WHAT NOT TO EXPECT? /> The labs used during the course are not provided/accessible after the training. < About the Trainer /> Prashant Mahajan runs Payatu Australia Pty Ltd (https://www.payatu.com.au) and OzHack (https://www.ozhack.com) and works as a Teacher at TAFENSW. He has over a decade of experience in various aspects of Information Security, including penetration testing, vulnerability analysis, digital forensics, and incident response. He is also a developer of open-source tools such as ADRecon (https://github.com/adrecon/ADRecon) and AzureADRecon (https://github.com/adrecon/AzureADRecon).He is a founder member of Null - The Open Security Community (https://null.community) and frequently speaks at industry events and trainings."
