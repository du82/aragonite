curity affordable, accessible, and actionable for businesses of all sizes. With its focus on simplifying security and enabling proactive protection, Airtel Secure helps businesses anticipate risks, adapt to evolving threats, and safeguard the future of digital transformation. Visit us on: https://www.airtel.in/b2b/ Title Sponsor Palo Alto Networks Visit us on: https://www.paloaltonetworks.com/prisma/cloud Gold Sponsor Hackerone HackerOne is a vulnerability coordination and bug bounty platform that connects businesses with penetration testers and cybersecurity researchers. Visit us on: https://www.hackerone.com/ BountyCraft Sponsor Adobe Adobe has been an active participant in the security community for many years, engaging with partners, standards organizations, and security researchers to collectively enhance the security of our products. We recognize the security community as a force multiplier in our quest to provide a safe and secure experience for Adobe’s customers. Adobe's Bug Bounty Program leverages the large community of hackers to collaborate and strengthen protections for Adobe products. Learn more and start hunting today: https://hackerone.com/adobe BountyCraft Sponsor Microsoft Microsoft was founded in 1975. Our mission is to enable people and businesses throughout the world to realize their full potential by creating technology that transforms the way people work, play, and communicate. We develop and market software, services, and hardware devices that deliver new opportunities, greater convenience, and enhanced value to people's lives. We do business worldwide and generate revenue by developing, licensing, and supporting a wide range of software products and services, by designing and selling hardware devices, and by delivering relevant online advertising to a global customer audience. Representatives from the MSRC will be joining NullCon Goa 2025. Visit us on: https://www.microsoft.com/en-us/msrc Networking Party Sponsor Altered Security At Altered 