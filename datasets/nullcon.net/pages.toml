full_description = "< NULLCON 2025 - GOA /> About the Speaker CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Matthias Frielingsdorf Co-Founder & VP of Research iVerify < Talk Title /> Predator Malware: Trust Broken at the Core < Talk Category /> iOS and macOS Track < Talk Abstract /> In 2023, Cytrox's Predator malware re-emerged in its second iteration, leaving cybersecurity experts with limited insights. Despite Predator's growing threat, detailed analysis of this commercial spyware remains scarce. We now had a rare opportunity to analyze the latest version of Predator, shining a light on what makes it one of the most sophisticated and covert threats in recent years. In this talk, we will break down Predator's architecture, including the distinct features introduced in its second iteration. We'll explore its complex infection chain, evasive techniques and the the differences between the first and second iteration. By examining this threat in detail, we aim to not only expose the methods behind Predator but also to equip cybersecurity professionals with knowledge to better anticipate and counter such malware in the future. < Speaker Bio /> Matthias Frielingsdorf leads the research team at iVerify. He previous worked on securing Deutsche Bahn’s Smartphones and Tablets and testing mobile security software and upcoming security products for T-Systems. He wrote his Master Thesis on iOS Exploit / Malware detection and has presented his research at conferences like BlackHat, OBTS and LabsCon. He trained more than 60 people on the detection of commercial spyware on iOS. Matthias is passionate about all things related to iOS security. When he’s not playing basketball or games he loves to spend his time learning new things around iOS. leads the research team at iVerify. He previous worked on securing Deutsche Bahn’s Smartphones and Tablets and testing mobile security software and upcoming security products for T-Systems. He wrote his Master Thesis on iOS Exploit / Malware detection and has presented his research at conferences like BlackHat, OBTS and LabsCon. He trained more than 60 people on the detection of commercial spyware on iOS. Matthias is passionate about all things related to iOS security. When he’s not playing basketball or games he loves to spend his time learning new things around iOS."
