["https://nullcon.net/goa-2025/speaker-kernel-conquest"]
title = "Nullcon Security Conference & Training"
description = """
< Talk Title />                                                                                        Kernel Conquest: Breaking Boundaries and Demystifying Kernel SU for Root Access in Azure Cloud Shell"""
full_description = "< NULLCON 2025 - GOA /> About the Speaker CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Alla Vamsi Krishna Project Assistant Indian Institute of Science, Bengaluru Kandi Abhishek Reddy Security Researcher Team bi0s < Talk Title /> Kernel Conquest: Breaking Boundaries and Demystifying Kernel SU for Root Access in Azure Cloud Shell < Talk Category /> Technical Speakers < Talk Abstract /> The presentation will explore a critical Use-After-Free vulnerability and novel RCU techniques found in the Netfilter kernel module of Azure Cloud Shell, impacting kernel version 5.10.102.2-microsoft-standard and prior versions of 6.9, a custom kernel version used by Azure Cloud Shell. Upon successful exploitation, an attacker can achieve elevated privileges within the Azure Cloud Shell environment, potentially leading to container escape within the user’s session and access to sensitive cloud resources like passwords and .pem files. I will also cover the technical aspects and root cause of the vulnerability, including the exploitation techniques used and the steps taken to achieve privilege escalation in Azure Cloud Shell. The session will further examine the broader implications of such vulnerabilities and their mitigations in multi-tenant cloud infrastructures. Finally, a demo will be showcased as proof of concept. This vulnerability was disclosed responsibly to the Microsoft Security Response Center (MSRC) and has been Just been mitigated, though no official patch has been released yet. This talk emphasizes the importance of securing kernel modules and demonstrates how proactive research can uncover and address critical risks in widely used cloud platforms like Azure. Attendees will gain valuable insights into cloud security, kernel exploitation, and the significance of vulnerability research. < Speaker Bio /> Vamsi Krishna's BioAlla Vamsi Krishna is a Research associate at IISc. Machine learning enthusiast Abhishek's BioI am Kandi Abhishek Reddy, a graduate of Amrita Vishwa Vidyapeetham, Bangalore, specialization in Computer Science and Electronics Engineering. Currently, I work as a security researcher with Team bi0s, India's top-ranked Capture the Flag (CTF) team and cybersecurity research community, as well as a full-time software engineer at NOKIA as a subcontractor.I have a strong focus and interests on binary exploitation and digital forensics, I have many accomplishments through hands-on experience in CTF competitions, where I have achieved significant milestones. Additionally, I have successfully identified and reported vulnerabilities to Microsoft, contributing to real-world security improvements.Passionate about continuous learning, I am always seeking new challenges and opportunities to grow in the rapidly evolving fields of cybersecurity and technology."
