full_description = "< NULLCON 2025 - GOA /> About The Training CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Goa 2025 | Trainings AI Security: Terminating The Terminator Advanced Infrastructure Security Assessment Attack and Defend Software Supply Chains Azure Cloud Attacks for Red and Blue Teams Blocking the Storm: A Hands-On Guide to Hardening and Securing Kubernetes Clusters DevSecOps - A Hands-on Experience Efficient Malware Analysis: Comprehensive Approach HackTheWeb: Pentesting Beyond Basics Hacking Android Applications IoT Security Bootcamp GOA Edition Rapid Threat Model Prototyping (RTMP) - Agile Threat Modeling Mastery including Cloud and AI Slaying the RE Dragon: Mastering Reverse Engineering The Application Security Tool Stack - How to Discover Vulnerabilities in Software Dhruv Shah Register Training Objectives Training Outlines WHAT TO BRING? Training PREREQUISITE WHO SHOULD ATTEND? WHAT TO EXPECT? WHAT ATTENDEES WILL GET? WHAT NOT TO EXPECT? ABOUT THE TRAINER < Training Title /> HackTheWeb: Pentesting Beyond Basics < Training Schedule /> Start Date: Mar 03, 2025 End Date: Mar 05, 2025 < Training Venue /> Venue: Bogmallo Beach Resort Goa < Training Objectives /> Take your web application pen-testing skills to the next level with this intermediate-level training course tailored for professional pen testers, bug hunters, and security enthusiasts. Rooted in the principles of the Open Web Application Security Project (OWASP) Testing Guide, this comprehensive course equips you with a structured and practical approach to uncovering vulnerabilities. By mapping workflows, understanding the intricate components of web applications, and utilizing open-source tools, you'll sharpen your ability to identify critical bugs with precision and efficiency. Designed for those actively engaged in pentest projects, this training is your key to becoming a more proficient and impactful web application pentester. < Training Level /> Intermediate < Training Outlines /> Syllabus Introduction to Web app testingOWASP Top 10 VulnerabilitiesOWASP Web App Testing GuideIntroduction to ProxiesReporting as you go Information GatheringSearch Engine discovery and reconnaissance for information leakageFingerprinting the web serverEnumerating applications on the web serverFingerprinting Application and Application Framework Configuration and Deployment Management TestingApplication Platform ConfigurationSubdomain TakeoverCloud Storage Identity Management TestingTesting for Roles and PrivilegesAccount EnumerationLogin Brute ForceDefault CredentialsWeak Username Policy Authentication TestingTesting Lockout MechanismsBypassing Authentication SchemaJWT AttackTesting for Password Reset FunctionalitiesTesting for Authentication in Alternative Channels2FA Bypass Authorization TestingDirectory Traversal vulnerabilitiesBypassing Authorization SchemaTesting for Privilege EscalationInsecure Direct Object References (IDOR) Input Validation/Injection TestingSQL Injection vulnerabilitiesTime-Based SQL InjectionData Exfiltration via Blind OOB SQL InjectionXML Injection vulnerabilitiesVanilla XXE attackData Exfiltration via Blind XXE attacksModern XSS AttacksHost Header InjectionSSRF AttacksSSRF on Traditional Web AppsSSRF over CloudTemplate Injection AttacksExploiting File Upload functionalitiesDeserialization Attacks Session Management TestingTesting Logout FunctionalityTesting for Session HijackingTesting for Misconfigured Cookie Attributes Testing for Weak CryptographyPadding Oracle AttacksExploiting Weak Encryptions Testing for Components with Known VulnerabilitiesAttacking PHP SymphonyAttacking vulnerable third-party librariesCMS AttacksLog4j Business Logic TestingBuilding models for Business logic FlowsAttacking Coupon Functionality / Process Timing AttacksAttacking Payment GatewaysPolluting Application LogsCircumventing Workflows Reporting < WHAT TO BRING? /> A Laptop with Admin rights, 16+ GB RAM, and Internet access. < Training PREREQUISITE /> Laptop withAdmin Privilegesminimum 16 GB ram100 GB Disk space for OvaInternet AccessAbility to install Virtual Box < WHO SHOULD ATTEND? /> Senior Web Application PentestersJunior Web Application PentestersSecurity EngineersBug Bounty HuntersDVA < WHAT TO EXPECT? /> The course is 30% theory and 70% Hands-onThis course focuses on the EB application Pentesting in modern days.The course is focused on a proper grey box pentest, keeping in mind helping bug bounty hunters understand application workflows to find improved Business logic flaws. < WHAT ATTENDEES WILL GET? /> Attendees will get the following:ova file containing the tools required for the labAccess to State of the Art Hacking LabSlide deckAnswer SheetsCheat SheetsTips and Tricks document for various attacks < WHAT NOT TO EXPECT? /> This is not beginner training, Prior knowledge of Web App Pentest is required. We will be building upon the existing knowledge to improve the understanding of the vulnerabilities and learn how to exploit them.This is 30% theory and 70% hands-on training. There will be lots of exercises. An additional 5 days of lab time will be given to play with the lab environment. < About the Trainer /> Dhruv Shah is an information security professional with over 13+ years of expertise in application, mobile, network, and cloud security. He has co-authored the books “Kali Linux Intrusion and Exploitation” and “Hands-on Pentesting with BurpSuite” by Packtpub. Dhruv has delivered advanced web hacking and Hacking and securing cloud Infrastructure classes and trained at major cybersecurity conferences such as Black Hat USA, Europe, and Asia, as well as other notable events like Hack in Paris, BSides Lisbon, Texas Cyber Summit, etc. He has provided security training to clients across the UK, EU, and USA. He is a core member of Recon Village at Defcon. His online presence is under the handle @snypter."
