["https://nullcon.net/goa-2025/speaker-building-glitch-resistant-firmware"]
title = "Nullcon Security Conference & Training"
description = "Nullcon is Asia’s largest international security conference, where key stakeholders from the industry, delegates from the government company representatives, COOs and hackers come together to talk about InfoSec"
full_description = "< NULLCON 2025 - GOA /> About the Speaker CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Arshid Shyam Kumar Technical Expert Siemens Chinmay Krishna R Junior-year Integrated Master’s Student IIIT-Bangalore < Talk Title /> Building Glitch-Resistant Firmware: Practical Software Countermeasures for Hardware glitch attacks < Talk Category /> Developer Track < Talk Abstract /> This paper explores software countermeasures to mitigate voltage glitch attacks targeting embedded systems, specifically the STM32F3 microcontroller. By testing five variations of password verification code, this research demonstrates how specific software modifications—like variable duplication, masking, and volatile counters—impact the success rate of hardware glitch attacks. Results show that introducing redundancy, timing adjustments, and data masking in software can significantly enhance system resilience. Unlike hardware countermeasures, which are often complex, costly, and impractical for brownfield projects, these software defenses offer a flexible and cost-effective solution. This work provides actionable insights for secure firmware development and improved robustness in embedded systems. < Speaker Bio /> Shyam's speaker Bio:Based in Bengaluru, India, I am a Security Researcher with over 10 years of experience, focusing on hardware security, cloud security, and network security at Siemens Technology. My professional experience includes:(i) Telecom and network security with a leading telecom service provider,(ii) IDS and Smart City Cyber range development at the Government of India's cybersecurity department (NCIIPC), and(iii) Secure embedded systems development at ISRO (Indian Space Research Organisation). Chinmay's BioChinmay is a student pursuing an integrated Bachelor's and Master's degree in Electronics and Communications Engineering at IIIT-Bangalore. With a strong passion for VLSI design and embedded systems, he has cultivated a deep understanding of these fields through rigorous academic training and hands-on experience.In the summer of 2024, he interned at Siemens Technology in Bengaluru, where he contributed to projects focusing on security and trust for embedded systems. This pivotal experience honed his technical expertise and sparked a keen interest in developing secure, reliable technologies for today’s interconnected world. He is committed to advancing technology through innovative and impactful solutions."
year_published = 2025
