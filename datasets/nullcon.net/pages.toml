full_description = "< NULLCON 2025 - GOA /> About the Speaker CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Bhargav Rathod Security Analyst Salesforce < Talk Title /> MacOS Lockdown Mode: A Forensic Deep Dive < Talk Category /> iOS and macOS Track < Talk Abstract /> This talk delves into the intricacies of macOS Lockdown mode and its implications on digital forensics. The presentation will provide a deep dive into the technical mechanisms of Lockdown mode, analyzing its impact on traditional forensic techniques.This talk is designed for forensic investigators, incident responders, and security professionals seeking to understand the complexities and investigative implications of macOS Lockdown Mode.This research serves as a comprehensive guide for digital forensic analysts dealing with macOS devices, and contributes to the broader understanding of privacy and security features in modern operating systems. It underscores the need for continuous research and development in the field of digital forensics to keep pace with advancing technology. < Speaker Bio /> Bhargav Rathod is a Security Analyst at Salesforce with a strong focus on macOS Forensics and Malware Analysis. Holding an MS in Digital Forensics, he is also GIAC GIME Certified.He has made significant contributions as an Organizing Committee member for the DFRWS USA & DFRWS APAC Conferences, helping to shape the discourse and direction of these prestigious events. His areas of interest are DFIR & Malware Analysis. He has previously spoken at SANS DFIR Summit 2023 & BSides Ahmedabad 2024."
