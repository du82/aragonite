full_description = "< NULLCON 2025 - GOA /> About the Speaker CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Kartik Lalan Security Architect PIC < Talk Title /> eKYC Crisis: Securing the Lockers < Talk Category /> Technical Speakers < Talk Abstract /> This talk would focus on how rapid digitization of every possible thing, brought in the need of digital KYC (know your customer) and with that it outsourced massive data risk. How our existing data is at potential risk, how it would leave persistent risk for the future and what are the gaps in current vaults, would be discussed. Payment Cards can be discarded once compromised, but that ain't possible for KYC details. Moreover, the design implemented in current solutions allow replay easily, which makes end user more vulnerable and eventually national security as well. Not targeting any specific solution, but would prefer touching upon most prominent solutions & risk outcomes. < Speaker Bio /> Product Security Engineer @ Security Centre of Excellence – Philips Innovation Campus. He is M.Tech. in CS with Specialization in Information & Network Security. He conducts frequent talks and workshops on InfoSec topics @ several places including C0C0N, DEFCON BHV, Bsides Chapters, Null Chapters, DroidCon-IN. Kartik loves to write technical Blogs in his leisure time."
