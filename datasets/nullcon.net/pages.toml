full_description = "< NULLCON 2025 - GOA /> Resume and Career Clinic CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue RESUME Resume and Career Clinic < Date: /> 2nd March 2025 < Time: /> 10:15 am IST to 11:15 am IST < Venue: /> Birla Institute Of Technology And Science, Goa, India < Application Last Date: /> 19th February 2025 Registration Now < Introduction: /> The first step towards a new job or change in career in any industry is to have a proper resume—and Infosec is no different. It is always a great thing to have a solid resume of your skills and experience to make an impression on the hiring team. At Nullcon, we have a focused track with guidance to provide the necessary tools and knowledge required for infosec job search, career development, and advancement. Resume reviews and career guidance sessions provided by industry recruiters and leaders. Our community reviewers who have a huge amount of combined experience in interviewing, and vetting candidates are ready to put their experiences to work to help you by providing feedback and guidance. < Mentors for Resume and Career Clinic: /> Aman Aryan - Head of Consulting, Research & IT at Payatu Madhu Akula - Pragmatic Security Leader & Startup Advisor Neelu Tripathy - Independent Security Consultant Pavan Mohan - Senior Manager, Product Security at ServiceNow Prajal Kulkarni - CISO at Groww Riddhi Shree - Senior Lead Engineer at Qualcomm Infosec Infosec Jobs by our Sponsors & Partners SERVICENOW HackerOne < link /> ServiceNow Careers < Job Role: /> Staff Product Security Engineer < Location: /> Hyderabad < Technical Requirements: /> Product Security, Application Security Testing, Manual Source Code Review, Security Vulnerabilities Management < Job Description: /> Identify the important strategic product security focus areas for the team Help lead security discussions with the other engineering teams Participate in research to identify new attack vectors and adopt new methodologies Perform application security testing on ServiceNow products Audit source code of the platform and applications Identify, communicate, and recommend remediation of Security Vulnerabilities < Contact email: /> [email protected] < Job Role: /> Staff Information Security Engineer < Location: /> Hyderabad < Technical Requirements: /> Configuration Management, Vulnerabilities Management, Risk Assessment < Job Description: /> Assess security risk and impact of issues pertaining to ServiceNow System Scanning, Vulnerability and Security Configuration Management Partner with stakeholders to provide triage and remediation recommendations Partner with compliance teams to ensure appropriate level of risk management Manage system security baselines, scanning, and managing vulnerabilities/compliance results (e.g. CIS benchmarks) < Contact email: /> [email protected] < link /> HackerOne Careers < Company: /> HackerOne < Job Role: /> Product Security Analyst < Location: /> Pune < Technical Requirements: /> Bug Bounty experience required < Job Description: /> 3+ years of professional manual web app testing experience Proven experience with vulnerability disclosure and bug bounty (experience managing a bug bounty program is a plus but not required) Strong technical knowledge of OWASP top 10 Comfortable using security testing tools including Burpsuite Excellent written and verbal communication skills Experience using frameworks such as CVSS Self-motivated and able to manage your time and energy output while maintaining a consistent and sustainable operational rhythm English fluency - both written and verbal Candidates must already based in Pune, India and willing to work a hybrid model from an office/WeWork 4-5 days per week. < Contact email: /> [email protected] < Job Role: /> Software Engineer < Location: /> Pune < Technical Requirements: /> Bug Bounty experience required < Job Description: /> our first 30 days will be focusing on getting to know our HackerOnies. You will join your new squad and being onboarded - get to learn the technology stack (Ruby on Rails +GraphQL + ReactJS + many more) 5+ years of experience in full-stack software engineering, especially within a SAAS environment. Experience developing applications with Ruby on Rails or Python. Preferred experience with ReactJS and TypeScript, generative AI, ElasticSearch /OpenSearch, GraphQL. < Contact email: /> [email protected]"
