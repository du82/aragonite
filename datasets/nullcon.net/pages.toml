full_description = "< NULLCON /> Privacy Policy This privacy policy depicts how nullcon uses, stores and protects the personal information provided to us. During and for the purpose of conference registration and related communication, nullcon may collect the following information: - Name and job title - Contact information including email address - Demographic information such as postcode, preferences and interests Disclaimer of Reliability Nullcon will not use or sell information provided by you for any commercial purpose or otherwise distribute your personal information to third parties (including but not limited to: sponsors and partner organizations) unless we have your permission or are required by law. Nullcon sponsors are advised that no conference attendee lists will be provided to them before, during, or after the event. If you believe any information provided to us by you is incorrect, incomplete or holds cause for dispute please contact us immediately at [email protected]. We will rectify it as requested to do so in the fastest means possible. The nullcon website may contain links to other websites. nullcon does not have control over the other websites and therefore nullcon cannot be held responsible for the protection and privacy of the information you provide on these websites. We suggest you view their Privacy Policy to know more. The nullcon website does not make use of cookies. A cookie is a small file that is placed on your hard drive to store certain information about the website and / or the user. It is used to manage user information and certain website functionality, although may also be used incorrectly to compromise user security. We do not make use of any such methods. Nullcon does make use of website analytics and only stores information gathered through its users and visitors such as number of page views, day of visit, means of accessing the website, location, etc. Any personal data about the user or visitor is not collected. None of this information is gathered for any purpose other than our internal analysis and would not be handed over to any third party. If nullcon is acquired, merges or forms a collaboration with another firm then all the information collected through this website would be handed over or accessible by the newly formed body. Nullcon will make every effort to preserve and protect user privacy through information gathered by this website, but may need to disclose information when required to by law. To unsubscribe from Nullcon email communications and announcements—kindly drop us an email at info[@]nullcon[.]net with the subject line 'Unsubscribe.'"
