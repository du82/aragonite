["https://nullcon.net/faq"]
title = "Nullcon Security Conference & Training"
description = "Nullcon is Asia’s largest international security conference, where key stakeholders from the industry, delegates from the government company representatives, COOs and hackers come together to talk about InfoSec"
full_description = "< NULLCON /> Frequently asked questions FAQ Frequently asked questions Attendee Exhibitor Volunteer CFP Submission Training Is registration available for attendees at the conference? We have only online registration process, and there will not be any on-the-spot registration. How do I pay? You can pay by online bank transfer, wallet payment, and credit card. How do I request an invoice? With ticket confirmation, all attendees will get an automated invoice generated by our systems. What is the refund policy for attendees? At Nullcon, we do not have a refund policy. Is my registration/ticket transferable? Yes, the Nullcon ticket is transferable, but the attendee cannot change the ticket type and select training. What will you send me once I have registered? All attendees will get their ticket soft copy and invoice on their email as soon as they complete the registration process. What are my transportation/accommodation options for getting to the event? All attendees need to manage their own travel and stay. Nullcon is liable only to provide the deliverables mentioned on the registration page. Where can I contact the organizer with any other questions? You can reach our team at [email protected] or +91 9004017799 Where can I get a list of exhibiting companies? Exhibition layouts, exhibitors list, and other exhibition details will be available on the Nullcon exhibitor page https://nullcon.net/goa-2025/exhibition Do I need to bring my student ID card? Yes, an attendee who has registered for a student pass must need to bring and produce the valid original college ID card of the current year. Photocopies of the ID card will not be entertained. Participants doing part-time and remote studies are not admitted under the student pass category. Where can I get the conference program information? The conference schedule will be announced on the Nullcon website 15 days before the conference. All speaker talk details are available on the Nullcon speaker page. Will the presentations be available to view after the show? Yes, all the speaker talks and presentations will be uploaded on the Nullcon archive page after the event. Will there be any CPE credit certificate or attendance certificate? All attendees of the Nullcon event will get a participation certificate on request. What is the schedule for the day of the event? The conference schedule will be announced on the Nullcon website 15 days before the conference. Is there a dress code? No, Nullcon doesn’t have any dress code. Which pass includes food at the Conference? Lunch will be provided on all training & conference days including morning & evening Tea/Coffee. Kindly note, only corporate attendees will get an invitation to Nullcon networking dinner party on the 1st day of the conference. How can I sign up for workshops? All conference pass holders have access to workshops and other tracks. What is the conference and training venue for Nullcon Goa 2025? The venue for Nullcon Goa 2025 is the BITS, GOA. We have multiple training venues; therefore, as per your choice of training, we request you to check out the training page for venue details. What is the difference between corporate and individual pass? Both the passes have the same benefits, but only corporate pass holders will get access to the Nullcon networking dinner party. What would be the time & venue for the Networking Party? If you are a corporate pass holder, then you will receive an invite email with venue details & time a couple of days before the Conference. The networking party may begin at 7:30 PM IST on the 1st day of the Conference. What about group discounts? Nullcon has a group discount of 5% on the participation of 4 or more people. How will I know which exhibitors to visit? The Nullcon program guide will have the conference about and exhibitors’ details to help attendees find exhibitors. Where can I register myself for the conference and what are the prices? Please explore the below link to know more about the Nullcon pass cost and registration process. https://nullcon.net/goa-2025/registration How do I reserve a booth, and what is the cost? Please contact us on [email protected] for exhibition opportunities. What is the registration deadline? Nullcon registration will be open till we get sold out. The earlier you register the better for branding and smooth flow. We may reserve the right to not sell an exhibition booth 2 weeks prior to the event due to logistic issues. What is the exhibit setup/breakdown times? The exhibition timings on conference days are from 9.00 am to 6.00 pm. The ready exhibition booth will be handed over to exhibitors at 5.00 pm one day before the conference, for any additional setup which has to be done by the exhibitor themselves. What are the conference hours? The conference exhibition timings are 9.00 am – 6.00 pm How are the booths assigned? The booths are assigned as per the available booth space. Can my company hold a seminar at the event? All our talks/workshops are selected via the CFP Process. We do not have any sales or marketing talks accepted/present at Nullcon. What are the different engagement and marketing opportunities available? Nullcon has multiple sponsorship opportunities at the event; please contact the organizer for more details. How do I receive a certificate in my volunteer work? All volunteers will be provided a volunteer certificate by Nullcon organizers after the event. I’m interested in volunteering at the conference, how can I apply? Interested candidates for volunteering can submit their application through our ‘Call for Volunteers’ program, which will open in Dec - Jan month. Who can submit presentations? Nullcon CFP is open for all, and anyone can submit talk details. How long will I have to wait before I am notified if I have been accepted or denied? The final CFP review will be shared with the speakers within 15 days after the last date of CFP being closed. I have a co-author who is not presenting. How to cite them? Speakers can submit the co-presenter details with the talk details. Can I add co-presenters after getting selected? Speaker needs to submit all presenter details at the time of talk submission only. Will my guests be allowed to attend my presentation for free? No, all attendees of Nullcon need to purchase conference tickets. Will I be paid? None of Nullcon speakers will get paid, though speakers will get benefits like travel reimbursement, complimentary accommodation, one complementary student pass, etc., as per their talk acceptance category. What are the requirements to participate in a training course? Nullcon Training is open for all to join. In which language is the training conducted? Nullcon training will be conducted in the English language. What is the maximum number of participants for the courses? Each Nullcon training has a different cap limit based on the capacity and trainer’s requirement. Tentatively each training batch consists of around 20 – 40 participants. Do I have to bring anything for the training? Each training pre-requisite is mentioned on the respective training page; all attendees are requested to follow the same. The trainers can also ask additional prerequisites through emails before the training. Is food provided during the training? Lunch and tea/coffee will be provided during training days. How do I register for training? The interested attendee can register for the training through the registration page. How can I cancel a training? Nullcon has a no refund/cancellation policy. Attendees can transfer the training seat to someone else but cannot change the training selected or the cancel the training. Do I get a certificate for participating in a training? All training attendees will get a training completion certificate issued by Nullcon after the training is completed & feedback form filled."
year_published = 2025
