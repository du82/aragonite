["https://nullcon.net/goa-2025/training/devsecops-goa-2025"]
title = "Nullcon Security Conference & Training"
description = "Nullcon is Asia’s largest international security conference, where key stakeholders from the industry, delegates from the government company representatives, COOs and hackers come together to talk about InfoSec"
full_description = "< NULLCON 2025 - GOA /> About The Training CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Goa 2025 | Trainings AI Security: Terminating The Terminator Advanced Infrastructure Security Assessment Attack and Defend Software Supply Chains Azure Cloud Attacks for Red and Blue Teams Blocking the Storm: A Hands-On Guide to Hardening and Securing Kubernetes Clusters DevSecOps - A Hands-on Experience Efficient Malware Analysis: Comprehensive Approach HackTheWeb: Pentesting Beyond Basics Hacking Android Applications IoT Security Bootcamp GOA Edition Rapid Threat Model Prototyping (RTMP) - Agile Threat Modeling Mastery including Cloud and AI Slaying the RE Dragon: Mastering Reverse Engineering The Application Security Tool Stack - How to Discover Vulnerabilities in Software Yash Roongta Karan Shah Register Training Objectives Training Outlines WHAT TO BRING? Training PREREQUISITE WHO SHOULD ATTEND? WHAT TO EXPECT? WHAT ATTENDEES WILL GET? WHAT NOT TO EXPECT? ABOUT THE TRAINER < Training Title /> DevSecOps - A Hands-on Experience < Training Schedule /> Start Date: Feb 26, 2025 End Date: Feb 28, 2025 < Training Venue /> Venue: Bogmallo Beach Resort Goa < Training Objectives /> Keep up with DevOps modernization and widen your career prospects. This practical 3-day course will help you build your own DevSecOps pipeline so you can make products secure by design. Get your hands dirty with our popular virtual labs and learn from experienced, practicing penetration testers with a legacy of training at Black Hat. Learn how to use and automate the most popular and effective security tools and practices, overcome common DevSecOps challenges, instill security culture within your team, and more... < Training Level /> Intermediate - Advanced < Training Outlines /> What’s in the syllabus: Note: our syllabuses are subject to change based on new vulnerabilities found and exploits released.LAB SETUPOnline lab setupOffline lab instructionsINTRODUCTION TO DEVOPSWhat is DevOps?Lab: Creating a DevOps pipelineINTRODUCTION TO DEVSECOPSSecurity challenges in DevOpsThreat modeling for DevOpsDevSecOps – why you need it, how you use it, and what it isVulnerability managementCONTINUOUS INTEGRATIONPre-commit hooksIntroduction to TalismanLab: Running TalismanLab: Create your own regexes for TalismanSecrets managementIntroduction to HashiCorp VaultDemo: Vault commandsCONTINUOUS DELIVERYSoftware Composition Analysis (SCA)Introduction to OWASP Dependency- CheckLab: Run OWASP Dependency- Check pipelineLab: Fix issues reported by Dependency- CheckStatic Analysis Security Testing (SAST)Introduction to SemgrepLab: Run Semgrep pipelineLab: Create your own Semgrep rulesLab: Fix issues reported by SemgrepDynamic Analysis Security Testing (DAST)Introduction to OWASP ZAPDemo: Creating OWASP ZAP Context FileLab: Run OWASP ZAP in the pipelineINFRASTRUCTURE AS CODEVulnerability Assessment (VA)Introduction to OpenVASLab: Run OpenVAS pipelineContainer Security (CS)Introduction to TrivyLab: Run Trivy in PipelineLab: Improvise Docker base imageCompliance as Code (CaC)Introduction to Chef InspecLab: Run Chef Inspec in the pipelineLab: Improvise with Docker compliance controlsCONTINUOUS MONITORINGLogging – why to do it, how, and what logs to collect.Introduction to the ELK StackLab: View Logs in KibanaAlerting – how to create alerts that help you prioritizeIntroduction to ElastAlert and ModSecurityLab: View alerts in KibanaMonitoring – how to track and learn from malicious activityLab: Create Attack Dashboards in KibanaDEVSECOPS IN AWSWhat does DevOps on Cloud Native AWS look like?AWS threat landscapeShifting to DevSecOps in Cloud Native AWSDEVSECOPS CHALLENGES AND ENABLERSChallenges with DevSecOpsHow to build a DevSecOps cultureSecurity champions – how to create DevSecOps advocates across your teamCase study: how organizations use automation to implement development security best practiceWhere to beginDevSecOps maturity model < WHAT TO BRING? /> The attendees will need a laptop with admin privileges and unfiltered access to the internet. < Training PREREQUISITE /> The course is browser based and hence having a chrome/firefox browser will be needed in the laptops.Additionally the attendees need their own GitHub account < WHO SHOULD ATTEND? /> DevelopersDevOps/DevSecOps engineersApplication security engineersOps teamsCISOsThis course is suitable for organizations and teams with a DevOps pipeline already in place, as well as those planning to implement one. The syllabus has been designed to help different key stakeholders improve their skills and knowledge across different security practices and embed “security by design” as the way of working. Putting these learnings to use will lead to improvements in the overall security posture of your applications over time. < WHAT TO EXPECT? /> This course uses a Defense by Offence methodology based on real world offensive research (not theory). That means everything we teach has been tried and tested, either on a live environment or in our labs, and can be applied (by you) once the course is over. By the end of the course, you’ll know:How cyber criminals and penetration testers exploit insecure DevOps practicesExactly where to start when shifting from DevOps to DevSecOpsHow to use Talisman to create pre-commit hooks to lower the chance of credentials and other secrets being exposed during developmentHow to automate security into a fast-paced DevOps environment using various open-source tools and scripts that don’t slow down deliveryHow to secure your methodology for managing and delivering Infrastructure as Code (IaC)How to use the Elastic (ELK) Stack to monitor your applications’ behaviors with logs and alertsHow to achieve DevSecOps in cloud native AWSWhat challenges to expect when moving to a DevSecOps model and how to overcome themHow to mature your DevSecOps approach over time < WHAT ATTENDEES WILL GET? /> Certificate of completion.Your own offline lab setup to use after the course.8 Continuing Professional Education (CPE) credits awarded per day of training fulfilled.Learning pack: question & answer sheets, setup documents, and command cheat sheet. < WHAT NOT TO EXPECT? /> The course is focused on DevSecOps using open-source tools. We will not be covering comparisons of paid tools or endorsing commercial tools. < About the Trainer /> YASH RoongtaAfter gaining a Bachelor’s degree in Commerce, Yash passed a post-grad diploma in Cybersecurity in 2016 and joined HappiestMinds as a Security Analyst. Over the next few years, he completed a number of certifications including OSCP and OSWP and acquired experience in numerous business sectors, including banking, finance, telecoms, and ecommerce. He also gained team leading experience managing the Cybersecurity team of one of India’s leading telecoms companies, which involved developing attack scenarios and defence capabilities to detect and counter them. In his spare time, he leads the Mumbai chapter of OWASP, which aims to spread awareness around Cybersecurity issues and hosts information security sessions in the Mumbai region. In 2024, Yash completed his Master in Cyber Security. Yash delivers multiple training courses for NotSoSecure both for private clients and at conferences. Karan joined NotSoSecure in 2019 and works with clients operating across a broad range of business sectors, including banking, e-commerce, and software development. Working as part of a small team of Security Consultants on- and off-site, he carries out various types of Penetration Testing on web applications, mobile applications, and networks. This part of his work also involves providing practical, actionable reports and being responsible for ensuring that clients’ secured environments meet required standards. He also delivers NotSoSecure training, such as the Application Security for Developers course, and undertakes various types of research for the company.Key SkillsWeb applications Penetration TestingMobile application Penetration TestingNetwork Penetration TestingSource Code ReviewAPI TestingThick ClientHTML & Javascript"
