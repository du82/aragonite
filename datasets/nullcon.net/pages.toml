["https://nullcon.net/goa-2025/speaker-bridging-the-gap"]
title = "Nullcon Security Conference & Training"
description = "Nullcon is Asia’s largest international security conference, where key stakeholders from the industry, delegates from the government company representatives, COOs and hackers come together to talk about InfoSec"
full_description = "< NULLCON 2025 - GOA /> About the Speaker CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Gayatri Sunil Relekar Student VIT, Pune Prateek Singh Lead OT Cybersecurity - APAC Eaton < Talk Title /> Bridging the Gap: Enhancing OT Security with an Affordable Testbed < Talk Category /> Workshop and Villages < Talk Abstract /> Operational Technology (OT) systems are the backbone of many industrial operations. These systems are designed to keep things running smoothly, prioritizing reliability above all else. In the past, OT systems were mostly isolated, so security wasn’t a major concern. However, with the rise of Industry 4.0 and the integration of the Industrial Internet of Things (IIoT), OT systems are now interconnected with IT networks, making them more vulnerable to cyber-attacks. This shift has exposed serious gaps in OT security, which many industries are now trying to address. Problem StatementThe problem is twofold:Skillset Gap: There is a shortage of skilled professionals in the OT security domain who have the expertise to protect OT systems from cyber threatsLack of affordable OT simulation testbeds: There is a lack of affordable testbed simulators for testing OT system resilience against cyber threats for industries and academia.The challenge is finding a practical and affordable way to test and strengthen OT systems against cyber threats.What We’re DoingTo address these challenges, we’re developing a low-cost testbed that simulates a real-world industrial environment. This testbed will allow researchers, academia and industrial firms to run simulations of their own systems, letting them see how their OT setups would stand up to different types of cyber-attacks. They’ll be able to use the platform to learn more about OT security by running their own attack scenarios and improving their skills in this growing field.Our goal is to create something practical and affordable that anyone can use to improve their understanding of OT cybersecurity. Future OutlookLooking ahead, this testbed has the potential to make an impact on how industries approach OT security. As more industries realize the importance of protecting their OT systems, tools like this will be crucial for testing and improving resilience.Over time, we hope to see our platform evolve into a go-to resource for both professional training and academic research. With industries becoming more reliant on interconnected systems, the need for tools that can help secure these environments will only grow. By making this testbed accessible and easy to use, we’re helping industries strengthen their defenses against ever-evolving cyber threats, while also supporting the next generation of cybersecurity professionals. < Speaker Bio /> Gayatri's BioCurrently pursuing a B.Tech in Instrumentation and Control Engineering at VIT Pune, I discovered my passion for cybersecurity during my coursework and through a pivotal project with Eaton. This project, which focused on cybersecurity, particularly in OT Technologies and ICS Systems, ignited my interest and led me to further explore and practice in this domain. My deep understanding of cybersecurity concepts has been instrumental in my academic and professional journey. The project I worked on evolved into a testbed, enabling individuals to set up and perform cybersecurity practices independently. Prateek's BioWith more than a decade of experience in OT/ICS cybersecurity, Prateek Singh is a certified IEC 62443 expert and TOGAF 9.2 practitioner who has led transformative projects to secure critical infrastructure in power, manufacturing, and water sectors. He has published OT Security research papers in IEEE, collaborated with Indian government ministries on cybersecurity. Currently, as a OT Security Lead – APAC at Eaton, he manages cybersecurity for over 20 Eaton sites and multiple customer, driving innovation and security excellence."
