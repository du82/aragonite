lopers. Visit us on: https://github.com/security Scholarship Sponsor Visa Visa is a world leader in digital payments, facilitating transactions between consumers, merchants, financial institutions, and government entities across more than 200 countries and territories. Our mission is to connect the world through the most innovative, convenient, reliable and secure payments network, enabling individuals, businesses and economies to thrive. We believe that economies that include everyone everywhere, uplift everyone everywhere and see access as foundational to the future of money movement. Visit us on: https://usa.visa.com/run-your-business/visa-security.html Program Guide Sponsor Cyware Cyware Labs is a product-based cybersecurity provider headquartered in New York, USA. Cyware offers a full stack of innovative cyber fusion solutions for all-source strategic, tactical, technical, and operational threat intelligence sharing, and threat response automation. Cyware’s Enterprise Solutions are designed to promote secure collaboration, inculcate cyber resilience, enhance threat visibility and deliver the needed control by providing organizations with an automated context-rich analysis of threats for a proactive response without losing the element of human judgment. Visit us on: https://cyware.com/ CXO Panel Sponsor PureID Visit us on: https://www.pureid.io/ Speaker Happy Hour Sponsor Birla Institute of Technology Birla Institute of Technology and Science, Pilani - Sancoale Goa Campus (and known in short as BITS Pilani, Sancoale Goa Campus) is a private deemed university campus located in Sancoale, Goa, India. Established in 2004, it is one of the four campuses of the BITS Pilani.[1] The Aditya Birla Group privately supports the residential features of the institute. Visit us on: https://www.bits-pilani.ac.in/goa/ Venue Supporter Recorded Future Visit us on: https://www.recordedfuture.com/ Signage Sponsor COMMUNITY PARTNER'''
