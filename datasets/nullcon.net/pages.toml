full_description = "< NULLCON 2025 - GOA /> Capture the Flag CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue HackIm Winja SCADA CTF < Start & End Date /> 1st February 2025 at 02:00 PM IST 2nd February 2025 to 02:00 PM IST < Registration /> Closed! < Venue /> Online CTF < Sponsored By /> < Organised By /> < Welcome to HackIM? /> Welcome to the 16th Edition of HackIM CTF! It is a popular hacking challenge contest where participants get together to find security flaws on a given platform. < Categories of Challenges /> Pwn - Binary exploitation Web - Web security Cry - Cryptography Misc - Miscellaneous Rev - Reverse engineering < Prize Details /> 1st Winner USD 500 cash prize SANS Training India Flipper Zero 1-month Subscription of HackTheBox 2 Complimentary Corporate Investment Passes for Nullcon Goa 2025 Conference Shared Accommodation provided near the conference Nullcon Goodies 2nd Winner USA 250 cash prize Flipper Zero 1-month Subscription of HackTheBox 2 Complimentary Corporate Investment Passes for Nullcon Goa 2025 Conference Shared Accommodation provided near the conference Nullcon Goodies Prizes for 20 Top Scorers: The top 20 scorers of HackIM CTF will win Complimentary Individual Conference Passes for Nullcon Goa 2025 All the HackIM top scorers will be introduced to the sponsors for networking and career opportunities. Note: If you are playing HackIM CTF as a team, the prize is given to a team and not every individual of the team. < CTF Crew Name /> Henning Seidler Lasse Krähner Lukas Selinka Maath Oudeh Moritz Grothe Nicolas Werner Niklas Kowallik Raphael Krafczyk Sebastian Neef < Registration /> Register Now < Venue /> Birla Institute Of Technology And Science (BITS), Goa < Start & End Date /> 2nd March 2025 11:20 IST to 16:30 IST < Sponsor /> Greetings! Winja CTF is a hybrid event happening online as well as physically at Nullcon Goa 2025. For playing online the event is free however for participating physically one will require a conference pass (Student / Individual / Corporate) < What is WINJA? /> A community focused on bringing women and men eye-to-eye with each other in the infosec industry. We help each and every individual to explore their potential in a comfortable environment and to bring out their true self without feeling intimidated by others. < Prize Details /> 1st Winner (On-Site) Apple iPad Flipper Zero 1 Google Titan Key Lock Picking Kit Exclusive Winja and Nullcon Hamper 2nd Winner (On-Site) SANS Training Flipper Zero 1 Google Titan Key No Starch Press Book Exclusive Winja and Nullcon Hamper Winner (Online) Flipper Zero No Starch Press Book Exclusive Winja and Nullcon Hamper < Participants Requirement /> Hardware requirements A laptop with admin privileges At least 20 GB of free space Minimum 3GB Ram Software requirements Operating System any of the following: OSX, Win 7 and above, Ubuntu 12.0.4 VMware OR Virtual Box 4.x.x installed < Categories of Challenges /> Boot2root Cloud Forensics LLM Reverse Engineering Source Code Review Web < WINJA Volunteers /> Akshay Khanna Aravindha Hariharan M Sandhra Bino Shashank Dubey Siddhant Chouhan Sneha Surana Yakshita Sharma < Registration /> Onsite at Nullcon Goa 2025 < Registration Link /> Opening Soon < Start Date & Time /> 1st March 2025 < End Date & Time /> 2nd March 2025 < Supporter /> < Description /> Dive into Real-World SCADA and IoT Security Challenges! Engage in hands-on activities centred around SCADA & IoT systems security. Enhance your expertise in hacking critical infrastructure through biopharma & hospital scenario-based challenges. Collaborate & contribute with Like-Minded Cybersecurity Enthusiasts! Join forces with fellow professionals who share a passion for critical infrastructure security. < Ideal Participants Should Have Skills In: /> Wireless Security Penetration Testing Network and Infrastructure Security Scripting & Automation Reverse Engineering Thick-client security Mobile application security This competition is open to individuals who are over the age of eighteen (18) at the time of registration. Current interns, employees or contractors of Schneider Electric are not eligible to participate in the CTF. It is a 24-hour competition. < Prize Details /> 1st Winner (On-Site) Cash Prize of INR 10,000 Ledger Crypto Wallet 1 Google Titan Key Exclusive Nullcon Hamper 2nd Winner (On-Site) Proxmark 1 Google Titan Key Exclusive Nullcon Hamper Special Winner Exclusive Nullcon Hamper < Players to bring /> Laptop with Admin access"
