full_description = '< NULLCON 2025 - GOA /> About the Speaker CFP CTF Live Bug Hunting Registration Schedule Speakers Sponsors Training Venue GO BACK Drishti Jain International Tech Speaker < Talk Title /> Satellite Communications: Analyzing and Protecting Space-Based Assets < Talk Category /> Winja Track < Talk Abstract /> As the reliance on satellite communication systems grows for global connectivity, military operations, weather forecasting, and critical infrastructure, protecting these space-based assets from cyber threats and physical interference becomes paramount. This talk delves into the vulnerabilities present in satellite communication (SatCom) systems, highlighting potential attack vectors such as signal jamming, spoofing, and data interception. It will explore the latest advancements in securing satellite communications, focusing on both defensive and offensive strategies to safeguard the integrity and availability of these vital systems. By understanding the risks and the cutting-edge methods for mitigating them, the audience will gain valuable insights into the protection of space-based assets in an increasingly connected world. < Speaker Bio /> Drishti is a Software Engineer and a technology book author. She is currently based in the USA and believes in democratizing opportunities and brings knowledge of the latest developments in the fast-moving field of technology to early professionals, students, and keep them up to date and well-equipped for their professional careers. Her initiative "SkillUp with Drishti" enables students and professionals to grow in their career. She has spoken at conferences across the globe and is also a social entrepreneur. Her non-profit organisation - Samyak Drishti Foundation works in environment, education and healthcare sectors and operates in a number of cities across India.In her spare time, she likes to paint nature, explore new places and anchor live shows'
