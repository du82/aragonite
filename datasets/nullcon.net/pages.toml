full_description = "< NULLCON /> Media Pass PASS MEDIA PASS REGISTRATIONS What is NULLCON? Founded in 2010. NULLCON is an extensive platform for the exchange of information about zero-day vulnerabilities, latest attack vectors, and other cyber threats. Here, security researchers and experts from various fields discuss information security, along with showcasing multiple offensive and defensive security technologies. NULLCON is Asia's one of the largest information security conference. NULLCON Goa 2025 Conference Dates: 1st - 2nd March 2025 Venue: BITS Goa Media Pass Qualified members of the media are encouraged to register for a complimentary press pass to NULLCON Goa 2025. All media personnel interested in covering or attending the event for publication (print/web/broadcast) purposes can register interest by filling this form: Form will be open soon Note: These workshops are designed keeping in mind at-risk groups like - Journalists, Lawyers, Activists which are prone to surveillance and cyberattacks. It's highly recommended for people who work in similar fields."
