ior to the event. Transfers requested after this deadline will not be accepted. Tickets can only be transferred in their entirety; partial transfers or transfers for individual days are not allowed. This means that if a ticket is transferred, it will cover the entire duration of the training or conference. Photography and Videography: During the 5 days of the conference and training, pictures and videos of the event activities as well as attendees would be captured by the organisation team. This will be used with or without edits for multimedia activities like social media, marketing reports, blogs, short clips, etc. An attendee is permitted to use hand-held cameras and/or smartphones to take photographs and capture digital images for personal, non-commercial use, provided the photography is not disruptive. Photographs may not be published, sold, reproduced, transmitted, distributed, or otherwise commercially exploited in any manner whatsoever. Should you not wish to be filmed or photographed, we kindly request you to not register for the conference or training. Training: Nullcon reserves the right to cancel the training in case of less number of registrations. In this case, Nullcon will inform the attendees at least 2 weeks before the actual training date. Nullcon training venue may be different from the conference venue and the training attendees will be notified about the venue details almost 2 weeks prior to the training dates. Conference: Participants must possess a valid ticket—either student, individual, or corporate—to attend any sub-events or activities associated with Nullcon. The views expressed by any event attendee, speaker, exhibitor, or sponsor are not necessariliy those of Nullcon. All attendees, speakers, exhibitors, and sponsors are solely responsible for the content of all individual or corporation presentations, marketing collateral, and/or advertising. Participants under the age of 21 would not be served alcoholic beverages/drinks at nullcon networking party. If for some reason the person is found consuming the legal liabilities is on the attendee and the conference organizer has the right to take any action they seem appropriate. Student Pass: Attendees who have registered under student pass have to bring along and produce a valid and original college ID card of the current year at the registration desk. In case the attendee does not have a valid ID card he/she will have to pay the difference in amount for an Individual or Corporate pass (whichever he/she chooses) at the registration desk. Photocopies of the ID cards will not be entertained, even if attested. Distance learning institute students will not be allowed under student pass. Privacy Policy: While registering for an event, the participant grants the organiser the right to save and process his/her personal data. The data (comprising the participant’s name, telephone and electronic contact info, business/billing purposes, as well as for informing the participant about future events and activities. Usage of information: Nullcon may disclose your personal data to third party service providers engaged by Nullcon to assist in the conduct of the event (e.g. training, venue, logistics, registration desk setup, mobile application provider). Information you provide when registering for participating in an event managed or co-sponsored by parties other than or in addition to Nullcon may be shared with those parties other than or in addition to Nullcon may be shared with those parties, and the treatment of such information is further subject to the privacy policies of those parties. Except as described herein, Nullcon will not disclose your personal data to any other third party without your consent except where required to do so by law. Code of Conduct: We are 100% committed to providing a welcoming, safe and friendly environment to our Nullcon community. By participating you agree to follow and respect our Code of Conduct. General: Nullcon reserves the right to change, amend, add or remove any of the above Terms and Conditions in its sole discretion and without prior notice. If one or more of the conditions outlines in these Terms and Conditions should become invalid, the remaining conditions will continue to be valid and apply. These Terms and Conditions apply to all event participants (attendees, speakers, sponsors, exhibitors)."
