["https://numpy.org/pt"]
title = "NumPy"
description = "Arrays n-dimensionais poderosas Rápidos e versáteis, os conceitos de vetorização, indexação e broadcasting do NumPy são, na prática, o padrão em computação com arrays. Ferramentas de computação numérica O NumPy oferece um conjunto completo de funções matemáticas, geradores de números aleatórios, rotinas de álgebra linear, transformadas de Fourier, e mais. Interoperabilidade O NumPy suporta um grande número de plataformas de hardware e computação, e pode ser combinado com bibliotecas de computação com arrays esparsas, distribuidas ou em GPUs. Alto desempenho O núcleo do NumPy é feito de código otimizado em C. Experimente a flexibilidade do Python com a velocidade de código compilado. Fácil de usar A sintaxe de alto nível do NumPy torna-o acessível e produtivo para programadores de qualquer nível de experiência e formação. Código aberto Distribuido com uma licença BSD liberal, o NumPy é desenvolvido e mantido publicamente no GitHub por uma comunidade vibrante, responsiva, e diversa."
full_description = "NumPy traz o poder computacional de linguagens como C e Fortran para Python, uma linguagem muito mais fácil de aprender e usar. Com esse poder vem a simplicidade: uma solução no NumPy é frequentemente clara e elegante. A API do NumPy é o ponto de partida quando bibliotecas são escritas para explorar hardware inovador, criar tipos de arrays especializados, ou adicionar capacidades além do que o NumPy fornece. NumPy está no centro de um rico ecossistema de bibliotecas de ciência de dados. Um fluxo de trabalho típico de ciência de dados exploratório pode parecer assim: For high data volumes, Dask andRay are designed to scale. Stabledeployments rely on data versioning (DVC),experiment tracking (MLFlow), andworkflow automation (Airflow andPrefect). O NumPy forma a base de bibliotecas de aprendizagem de máquina poderosas como scikit-learn e SciPy. À medida que a disciplina de aprendizagem de máquina cresce, a lista de bibliotecas construidas a partir do NumPy também cresce. As funcionalidades de deep learning do TensorFlow tem diversas aplicações — entre elas, reconhecimento de imagem e de fala, aplicações baseadas em texto, análise de séries temporais, e detecção de vídeo. O PyTorch, outra biblioteca de deep learning, é popular entre pesquisadores em visão computacional e processamento de linguagem natural. O MXNet é outro pacote de IA, que fornece templates e protótipos para deep learning. Técnicas estatísticas chamadas métodos de ensemble tais como binning, bagging, stacking, e boosting estão entre os algoritmos de ML implementados por ferramentas tais como XGBoost, LightGBM, e CatBoost — um dos motores de inferência mais rápidos. Yellowbrick e Eli5 oferecem visualizações para aprendizagem de máquina. NumPy é um componente essencial no crescente campo de visualização em Python, que inclui Matplotlib, Seaborn, Plotly, Altair, Bokeh, Holoviz, Vispy, Napari, e PyVista, para citar alguns. O processamento de grandes arrays acelerado pela NumPy permite que os pesquisadores visualizem conjuntos de dados muito maiores do que o Python nativo poderia permitir."
year_published = 2023
