["https://numpy.org/ja"]
title = "NumPy"
description = "強力な多次元配列 NumPyの高速で多機能なベクトル化計算、インデックス処理、ブロードキャストの考え方は、現在の配列計算におけるデファクト・スタ>ンダードです。 数値計算ツール群 NumPyは、様々な数学関数、乱数生成器、線形代数ルーチン、フーリエ変換などを提供しています。 オープンソース NumPyは、寛容なBSDライセンスで公開されています。NumPyは活発で、互いを尊重し、多様性を認め合うコミュニティによって、 GitHub上でオープンに開発されていま す. 相互運用性 NumPyは、幅広いハードウェアとコンピューティング・プラットフォームをサポートしており、分散処理、GPU、疎行列ライブラリにも対 応しています。 高パフォーマンス NumPyの大部分は最適化されたC言語のコードで構成されています。これによりPythonの柔軟性とコンパイルされたコードの高速性の両方 を享受できます。 使いやすさ NumPyの高水準なシンタックスは、どんなバックグラウンドや経験を持つのプログラマーでも簡単に利用することができ、生産性を高め>ることができます。"
full_description = "インタラクティブシェルを使用して、ブラウザ上で Numpy を試してみてください。 Numpy は、 C や Fortran のような言語の計算パフォーマンスを、Pythonにもたらします。 このパワーはNumPyのシンプルさから来ており、NumPyによるソリューションの多くは明確でエレガントになります。 NumPyのAPIは、革新的なハードウェアを利用したり、特殊な配列タイプを作成したり、NumPyが提供する以上の機能を追加するためにライブラリを作成する際の基礎となります。 Numpy は豊富なデータサイエンスライブラリのエコシステムの中核にあります。一般的なデータサイエンスのワークフローは次のようになります。 大規模データに対して、DaskとRayはスケールすることを目指して設計されています。安定したデプロイメントに関しては、データのバージョニング（DVC）、実験の追跡（MLFlow）、ワークフローの自動化（AirflowおよびPrefectが重要ですが様々なNumPyベースのツールが提供されています。 NumPyは、scikit-learnやSciPyのような強力な機械学習ライブラリの基礎を形成しています。機械学習の技術分野が成長するにつれ、NumPyをベースにしたライブラリの数も増えています。TensorFlowの深層学習機能は、音声認識や画像認識、テキストベースのアプリケーション、時系列分析、動画検出など、幅広い応用用途があります。PyTorchも、コンピュータビジョンや自然言語処理の研究者に人気のある深層学習ライブラリです。MXNetもAIパッケージの一つで、深層学習の設計図やテンプレート機能を提供しています。 ensemble法と呼ばれる統計的手法であるビンニング、バギング、スタッキングや、XGBoost、LightGBM、CatBoostなどのツールで実装されているブースティングなどは、機械学習アルゴリズムの一つであり、最速の推論エンジンの一つです。YellowbrickやEli5は機械学習の可視化機能を提供しています。"
