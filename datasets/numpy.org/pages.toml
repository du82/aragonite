full_description = "The NumPy project welcomes your expertise and enthusiasm! Your choices aren’t limited to programming, as you can see below there are many areas where we need your help. If you’re unsure where to start or how your skills fit in, reach out! You can ask on the mailing list or GitHub (open an issue or comment on a relevant issue). Those are our preferred channels (open source is open by nature), but if you prefer to talk privately, contact our community coordinators at [email protected] or on Slack (write [email protected] for an invite). We also have a biweekly community call, details of which are announced on the mailing list. You are very welcome to join. If you are new to contributing to open source, we also highly recommend reading this guide. Our community aspires to treat everyone equally and to value all contributions. We have a Code of Conduct to foster an open and welcoming environment. Programmers, this guide explains how to contribute to the NumPy codebase.Check out also our YouTube channel for additional advice. The project has more than 250 open pull requests – meaning many potential improvements and many open-source contributors waiting for feedback. If you’re a developer who knows NumPy, you can help even if you’re not familiar with the codebase. You can: NumPy’s User Guide is undergoing rehabilitation. We’re in need of new tutorials, how-to’s, and deep-dive explanations, and the site needs restructuring. Opportunities aren’t limited to writers. We’d also welcome worked examples, notebooks, and videos. NEP 44 — Restructuring the NumPyDocumentation lays out our ideas – and you may have others. The NumPy issue tracker has a lot of open issues. Some are no longer valid, some should be prioritized, and some would make good issues for new contributors. You can: We’ve just revamped our website, but we’re far from done. If you love web development, these issues list some of our unmet needs – and feel free to share your own ideas. We can barely begin to list the contributions a graphic designer can make here. Our docs are parched for illustration; our growing website craves images – opportunities abound."
