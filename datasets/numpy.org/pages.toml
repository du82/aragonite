["https://numpy.org/es/case-studies/blackhole-image"]
title = "NumPy - Caso de estudio: La primera imagen de un Agujero Negro"
description = """
Agujero Negro M87#
(Créditos de la imagen: Colaboración del telescopio del Horizonte de Sucesos) Capturar imágenes del Agujero Negro M87 es como intentar ver algo que por definición es imposible de ver. —Katie Bouman, Profesora Asistente, Ciencias de la Computación & Matemáticas, Caltech
Un telescopio del tamaño de la Tierra# El Telescopio Event Horizon (EHT) , es un conjunto de ocho radiotelescopios terrestres que forman un telescopio computacional del tamaño de la Tierra, estudiando al universo con una sensibilidad y resolución sin precedente. El enorme telescopio virtual, que utiliza una técnica llamada Interferometría de línea de base muy larga (VLBI), tiene una resolución angular de 20 microsegundos de arco — ¡suficiente para leer un periódico en Nueva York desde un café en la acera en París!"""
full_description = "Capturar imágenes del Agujero Negro M87 es como intentar ver algo que por definición es imposible de ver. El Telescopio Event Horizon (EHT) , es un conjunto de ocho radiotelescopios terrestres que forman un telescopio computacional del tamaño de la Tierra, estudiando al universo con una sensibilidad y resolución sin precedente. El enorme telescopio virtual, que utiliza una técnica llamada Interferometría de línea de base muy larga (VLBI), tiene una resolución angular de 20 microsegundos de arco — ¡suficiente para leer un periódico en Nueva York desde un café en la acera en París! Una nueva vista del universo: El trabajo preliminar de la innovadora imagen de EHT se había establecido 100 años antes, cuando Sir Arthur Eddington dio el primer apoyo observacional a la teoría de la relatividad general de Einstein. El agujero negro: EHT se entrenó en un enorme agujero negro supermasivo aproximadamente a 55 millones de años luz de la Tierra, situado en el centro de la galaxia Messier 87 (M87) en el cúmulo de galaxias Virgo. Su masa es 6.5 mil millones de veces la del sol. Se había estudiado por más de 100 años, pero nunca antes se había observado un agujero negro. Comparando las observaciones con la teoría: A partir de la teoría general de la relatividad de Einstein, los científicos esperaban encontrar una región similar a una sombra causada por la flexión gravitacional y la captura de la luz. Los científicos pudieron utilizarla para medir la enorme masa del agujero negro. EHT plantea enormes desafíos de procesamiento de datos, incluyendo las rápidas fluctuaciones de fase atmosféricas, amplio ancho de banda de grabación, y telescopios que son ampliamente disímiles y geográficamente dispersos. Cada día, el EHT genera más de 350 terabytes de observaciones, almacenados en discos duros llenos de helio. Reducir el volumen y complejidad de estos datos es enormemente difícil. Cuando el objetivo es ver algo nunca antes visto, ¿cómo pueden los científicos estar seguros de que la imagen es correcta?"
