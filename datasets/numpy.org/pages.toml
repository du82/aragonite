["https://numpy.org/pt/case-studies/gw-discov"]
title = "NumPy - Estudo de Caso: Descoberta de Ondas Gravitacionais"
description = """
Ondas gravitacionais#
(Créditos de imagem: O projeto Simulating eXtreme Spacetimes (SXS) no LIGO) O ecossistema científico Python é uma infraestrutura crítica para a pesquisa feita no LIGO. —David Shoemaker, Colaborador Científico no LIGO
Sobre Ondas Gravitacionais e o LIGO# Ondas gravitacionais são ondulações no tecido espaço-tempo, gerado por eventos cataclísmicos no universo, como colisão e fusão de dois buracos negros ou a coalescência de estrelas binárias ou supernovas. A observação de ondas gravitacionais pode ajudar não só no estudo da gravidade, mas também no entendimento de alguns dos fenômenos obscuros existentes no universo distante e seu impacto."""
full_description = "Ondas gravitacionais são ondulações no tecido espaço-tempo, gerado por eventos cataclísmicos no universo, como colisão e fusão de dois buracos negros ou a coalescência de estrelas binárias ou supernovas. A observação de ondas gravitacionais pode ajudar não só no estudo da gravidade, mas também no entendimento de alguns dos fenômenos obscuros existentes no universo distante e seu impacto. O Observatório Interferômetro Laser de Ondas Gravitacionais (LIGO) foi projetado para abrir o campo da astrofísica das ondas gravitacionais através da detecção direta de ondas gravitacionais previstas pela Teoria Geral da Relatividade de Einstein. O observatório consiste de dois interferômetros amplamente separados dentro dos Estados Unidos - um em Hanford, Washington e o outro em Livingston, Louisiana — operando em uníssono para detectar ondas gravitacionais. Cada um deles tem detectores em escala quilométrica de ondas gravitacionais que usam interferometria laser. A Colaboração Científica LIGO (LSC), é um grupo de mais de 1000 cientistas de universidades dos Estados Unidos e em 14 outros países apoiados por mais de 90 universidades e institutos de pesquisa; aproximadamente 250 estudantes contribuem ativamente com a colaboração. A nova descoberta do LIGO é a primeira observação de ondas gravitacionais em si, feita medindo os pequenos distúrbios que as ondas fazem ao espaço-tempo enquanto atravessam a Terra. A descoberta abriu novas fronteiras astrofísicas que exploram o lado “curvado” do universo - objetos e fenômenos que são feitos a partir da curvatura do espaço-tempo. As ondas gravitacionais são difíceis de detectar pois produzem um efeito muito pequeno e têm uma pequena interação com a matéria. Processar e analisar todos os dados do LIGO requer uma vasta infraestrutura de computação. Depois de cuidar do ruído, que é bilhões de vezes maior que o sinal, ainda há equações de relatividade complexas e enormes quantidades de dados que apresentam um desafio computacional: O(10^7) horas de CPU necessárias para análises de fusão binária espalhado em 6 clusters LIGO dedicados."
year_published = 2025
