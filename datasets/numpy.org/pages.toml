full_description = "NumPy é um projeto de código aberto impulsionado pela comunidade desenvolvido por um grupo muito diversificado de contribuidores. A liderança do NumPy assumiu um forte compromisso de criar uma comunidade aberta, inclusiva e positiva. Por favor, leia o Código de Conduta NumPy para orientações sobre como interagir com os outros de uma forma que faça a comunidade prosperar. Oferecemos vários canais de comunicação para aprender, compartilhar seu conhecimento e se conectar com outros dentro da comunidade NumPy. Abaixo, listamos algumas formas de se envolver diretamente com o projeto e a comunidade do NumPy. Por favor, note que encorajamos os usuários e membros da comunidade a apoiarem-se uns aos outros para perguntas sobre utilização - veja Obter Ajuda. Esta lista é o principal fórum para discussões mais longas, como adicionar novos recursos ao NumPy, fazer alterações no roadmap do NumPy e em todos os tipos de tomada de decisão para todo o projeto. Anúncios sobre o NumPy, como novas versões, reuniões de desenvolvedores, sprints ou palestras de conferência também são feitas nesta lista. Nesta lista, por favor, use bottom posting, responda à lista (em vez de a outro remetente), e não responda aos digests. Um arquivo pesquisável desta lista está disponível aqui. Por favor, note que o GitHub não é o lugar certo para relatar uma vulnerabilidade de segurança. Se você acha que encontrou uma vulnerabilidade de segurança no NumPy, relate-a aqui. Uma sala de bate-papo em tempo real para fazer perguntas sobre contribuir para o NumPy. Este é um fórum privado, especificamente para pessoas hesitantes em levantar suas perguntas ou idéias em uma grande lista de e-mails públicos ou no GitHub. Por favor, clique aqui para mais detalhes e como obter um convite. Se você gostaria de encontrar um encontro ou grupo de estudo local para aprender mais sobre o NumPy e o ecossistema mais amplo de pacotes Python para ciência de dados e computação científica, recomendamos explorar