["https://numpy.org/pt/case-studies/blackhole-image"]
title = "NumPy - Estudo de Caso: A Primeira Imagem de um Buraco Negro"
description = """
Black Hole M87#
(Créditos: Event Horizon Telescope Collaboration) Criar uma imagem do Buraco Negro M87 é como tentar ver algo que, por definição, é impossível de se ver. —Katie Bouman, Professora Assistente, Ciências da Computação e Matemática, Caltech
Um telescópio do tamanho da Terra# O telescópio Event Horizon (EHT), é um conjunto de oito telescópios em solo formando um telescópio computacional do tamanho da Terra, projetado para estudar o universo com sensibilidade e resolução sem precedentes. O enorme telescópio virtual, que usa uma técnica chamada interferometria de longa linha de base (VLBI), tem uma resolução angular de 20 micro-arcossegundos — o suficiente para ler um jornal em Nova Iorque a partir de um café em uma calçada de Paris!"""
full_description = "Criar uma imagem do Buraco Negro M87 é como tentar ver algo que, por definição, é impossível de se ver. O telescópio Event Horizon (EHT), é um conjunto de oito telescópios em solo formando um telescópio computacional do tamanho da Terra, projetado para estudar o universo com sensibilidade e resolução sem precedentes. O enorme telescópio virtual, que usa uma técnica chamada interferometria de longa linha de base (VLBI), tem uma resolução angular de 20 micro-arcossegundos — o suficiente para ler um jornal em Nova Iorque a partir de um café em uma calçada de Paris! Uma nova visão do universo: A imagem inovadora do EHT foi publicada 100 anos após o experimento de Sir Arthur Eddington ter produzido as primeiras evidências observacionais apoiando a teoria da relatividade geral de Einstein. O Buraco Negro: o EHT foi treinado em um buraco negro supermassivo a aproximadamente 55 milhões de anos-luz da Terra, localizado no centro do galáxia Messier 87 (M87) no aglomerado de Virgem. Sua massa é equivalente a 6,5 bilhões de vezes a do Sol. Ele vem sendo estudado há mais de 100 anos, mas um buraco negro nunca havia sido observado visualmente antes. Comparando observações com a teoria: Pela teoria geral da relatividade de Einstein, os cientistas esperavam encontrar uma região de sombra causada pela distorção e captura da luz causada pela influência gravitacional do buraco negro. Os cientistas poderiam usá-la para medir a enorme massa do mesmo. O EHT representa um desafio imenso em processamento de dados, incluindo rápidas flutuações de fase atmosférica, uma largura grande de banda nas gravações e telescópios que são muito diferentes e geograficamente dispersos. A cada dia, o EHT gera mais de 350 terabytes de observações, armazenadas em discos rígidos cheios de hélio. Reduzir o volume e a complexidade desse volume de dados é extremamente difícil. Quando o objetivo é algo que nunca foi visto, como os cientistas podem ter confiança de que sua imagem está correta?"
year_published = 2025
