["https://numpy.org/es/case-studies/gw-discov"]
title = "NumPy - Estudio de Caso: Descubrimiento de Ondas Gravitacionales"
description = """
Ondas Gravitacionales#
(Créditos de imagen: El proyecto Simulación de Espacio-tiempos eXtreme (SXS) en LIGO) El ecosistema científico de Python es una infraestructura crítica para la investigación realizada en LIGO. —David Shoemaker, Colaboración científica LIGO
Acerca de Ondas Gravitacionales y LIGO# Las ondas gravitacionales son ondulaciones en el tejido del espacio y el tiempo, generadas por cataclismos en el universo, tales como la colisión y fusión de dos agujeros negros o la coalescencia de estrellas binarias o supernovas. La observación de Ondas Gravitacionales no solo puede ayudar en el estudio de la gravedad, sino también en la comprensión de algunos de los fenómenos oscuros en el universo distante y su impacto."""
full_description = "El ecosistema científico de Python es una infraestructura crítica para la investigación realizada en LIGO. Las ondas gravitacionales son ondulaciones en el tejido del espacio y el tiempo, generadas por cataclismos en el universo, tales como la colisión y fusión de dos agujeros negros o la coalescencia de estrellas binarias o supernovas. La observación de Ondas Gravitacionales no solo puede ayudar en el estudio de la gravedad, sino también en la comprensión de algunos de los fenómenos oscuros en el universo distante y su impacto. El Observatorio de Ondas Gravitacionales por Interferometría Láser (LIGO) fue diseñado para abrir el campo de la astrofísica de ondas gravitacionales mediante la detección directa de las ondas gravitacionales predichas por la Teoría General de la Relatividad de Einstein. Comprende dos interferómetros ampliamente separados dentro de los Estados Unidos: uno en Hanford, Washington, y el otro en Livingston, Louisiana, operando al unísono para detectar ondas gravitacionales. Cada uno de ellos tiene detectores de ondas gravitacionales de escala de múltiples kilómetros que utilizan interferometría de láser. La Colaboración Científica de LIGO (LSC) es un grupo de más de 1000 científicos de universidades de los Estados Unidos y de otros 14 países, respaldados por más de 90 universidades e institutos de investigación; aproximadamente 250 estudiantes contribuyen activamente a la colaboración. El nuevo descubrimiento de LIGO es la primera observación de ondas gravitacionales, realizada midiendo las diminutas perturbaciones que las ondas generan en el espacio y el tiempo a medida que pasan a través de la Tierra. Ha abierto nuevas fronteras astrofísicas que exploran el lado deformado del universo: objetos y fenómenos que están hechos de espaciotiempo deformado. Las Ondas Gravitacionales son difíciles de detectar, ya que producen un efecto muy pequeño y tienen una diminuta interacción con la materia. Procesar y analizar todos los datos de LIGO requiere una vasta infraestructura informática. Después de ocuparse del ruido, que es miles de millones de veces mayor que la señal, aún quedan ecuaciones de relatividad muy complejas y enormes cantidades de datos que suponen un desafío computacional: se necesitan aproximadamente O(10^7) horas de CPU para los análisis de fusiones binarias, distribuidas en 6 clústeres dedicados de LIGO"
year_published = 2025
