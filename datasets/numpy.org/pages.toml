full_description = "NumPy documentation# Version: 2.2 Download documentation: User guide (PDF) | Reference guide (PDF) | All (ZIP) | Historical versions of documentation Useful links: Installation | Source Repository | Issue Tracker | Q&A Support | Mailing List NumPy is the fundamental package for scientific computing in Python. It is a Python library that provides a multidimensional array object, various derived objects (such as masked arrays and matrices), and an assortment of routines for fast operations on arrays, including mathematical, logical, shape manipulation, sorting, selecting, I/O, discrete Fourier transforms, basic linear algebra, basic statistical operations, random simulation and much more. Getting started New to NumPy? Check out the Absolute Beginner’s Guide. It contains an introduction to NumPy’s main concepts and links to additional tutorials. To the absolute beginner’s guide User guide The user guide provides in-depth information on the key concepts of NumPy with useful background information and explanation. To the user guide API reference The reference guide contains a detailed description of the functions, modules, and objects included in NumPy. The reference describes how the methods work and which parameters can be used. It assumes that you have an understanding of the key concepts. To the reference guide Contributor’s guide Want to add to the codebase? Can help add translation or a flowchart to the documentation? The contributing guidelines will guide you through the process of improving NumPy. To the contributor’s guide"
