["https://nutraceuticalbusinessreview.com/beneo-isomaltulose-palatinose-improves-sleep-quality-study"]
title = "Isomaltulose consumption before bed can improve sleep quality, study finds"
description = "Beneo's isomaltulose ingredient Palatinose — when consumed as a bedtime drink — can lengthen the deep sleep phase, suggesting the functional food ingredient can provide health benefits beyond the metabolism"
full_description = '''A novel study has found that Beneo's sustained release isomaltulose carbohydrate, Palatinose, can improve aspects of sleep. When consumed as a bedtime drink, Palatinose can balance blood glucose levels — resulting in a longer deep sleep phase and a more restful night's sleep. This research highlights that Palatinose can offer health benefits beyond the metabolism, strengthening the ingredient's standing as a solution for overall wellness. Tackling the insomnia surge Sleep is a necessity for overall wellbeing, though many people in the modern world aren't getting enough it. A range of studies conducted globally have found that insomnia is on the rise, with its prevalence reaching as high as 60% in some regions. Poor sleep quality has been linked to a plethora of negative health outcomes, including obesity, impaired glucose metabolism and dementia — meaning that it's crucial that consumers get a good night's sleep wherever possible. To assess if functional carbohydrates could benefit sleep parameters in any way, Gaylor and her team at the University of Swansea's Faculty of Medicine, Health and Life Sciences gave 20 healthy young participants 50g of Palatinose or glucose dissolved in water 15 minutes before bed. During the study period, each participant's blood glucose levels were monitored continuously, with their sleep characteristics also being measured using polysomnography and actigraphy. Researchers then tested each volunteer's story recall capabilities in the morning. Palatinose promotes better sleep As expected through previous findings, those consuming the Palatinose-based bedtime drink had a slower and more sustained release of glucose into the blood — meaning they didn't experience blood sugar level dips within the first half of the night. Notably, those who consumed Palatinose also experienced an increase in deep sleep, with participants gaining an average of 22 more minutes within this sleep phase. Researchers believe this is because having balanced blood glucose levels promotes better sleep quality, deeper sleep and a reduction in wakeful periods during the night. Notably, some participants receiving Palatinose also experienced an increase in memory recall the following day — likely due to a prolonged period of deep sleep. "These findings are significant, as deep or slow-wave sleep is important for physical recovery and cognitive health," noted Dr Stephan Theis, Head of Nutrition Science and Communication at Beneo. "By supporting balanced blood sugar levels and prolonging the deep sleep phase, Palatinose may improve restful sleep and a person’s overall well-being." "Its ability to sustain blood sugar levels overnight may also have far-reaching implications for dietary interventions, targeting sleep disorders and cognitive decline,” he concluded. Share on X Share on LinkedIn Share on Facebook Featured companies Beneo BENEO supplies functional ingredients derived from the chicory root, sugar beet, rice and wheat in support of food and drinks with additional health and technical benefits See more'''
