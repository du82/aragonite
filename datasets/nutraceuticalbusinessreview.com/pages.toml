["https://nutraceuticalbusinessreview.com/beneo-189875"]
title = "Beneo"
description = """
BENEO supplies functional ingredients derived from the chicory root, sugar beet, rice and wheat in support of food
and drinks with additional health and technical benefits"""
full_description = "Profile Our functional fibres, carbohydrates, protein and rice ingredients improve taste and texture in a broad range of applications: dairy, confectionery, bakery, cereals, baby food, vegetables, meat, soups, sauces and beverages. In addition, they help reduce fat, sugar, artificial ingredients, improve digestive, bone and dental health, energy and weight management and/or mental & physical performance and enrich them in fibre or proteins. Contact us for ideation and insights. For more information about BENEO and our ingredients, visit: www.BENEO.com or follow us on Twitter: twitter.com/_BENEO or LinkedIn: www.linkedin.com/company/beneo. Ingredient descriptions: FUNCTIONAL PROTEINS BENEO’s non-GMO, functional wheat and rice proteins possess excellent binding capacities, process stability and a neutral taste. They have a high nutritional value and can be applied to meat substitutes, bakery foods and many other applications. FUNCTIONAL FIBRES BENEO’s highly-soluble functional fibres, Orafti® Inulin and Oligofructose, extracted from the chicory root, possess a natural sweetness. They improve digestive health and calcium absorption, in addition to inducing smoother blood sugar levels. FUNCTIONAL CARBOHYDRATES BENEO’s functional carbohydrates, ISOMALT and Palatinose™ are ideal ingredients with a balancing effect on blood sugar levels. ISOMALT is a non-cariogenic, low-glycaemic and low-caloric sugar replacer derived from sugar beet. It replaces sugar on a 1:1 ratio, with its low-hygroscopic it increases shelf life and brings out flavours and colours in sugar-free hard-boiled candy. Palatinose™ (isomaltulose) is a more slowly released carbohydrate derived from the sugar beet. It provides its full carbohydrate energy (4kcal/g) in a sustained way and helps to improve fat oxidation during physical activity. In addition to being non-cariogenic and non-hygroscopic, it also guarantees stable osmolality in beverages and is non-hygroscopic. SPECIALTY RICE INGREDIENTS BENEO’s rice ingredients help to address the rising demand for clean label, organic, gluten- and lactose-free and hypoallergenic products. They help improve the mouthfeel, texture, shelf-life and colour of products and in specific low(er) fat foods. Prebiotics – the scientifically proven superfoods for holistic health. The gut plays a major role in human health and well-being. That’s why 4 in 5 consumers recognise its importance to influence on their physical wellbeing. In a recent international quantitative survey, almost all respondents agreed that our gastrointestinal tract is inhabited by bacteria and our diet influences the type of bacteria in our gut. The gut microbiota is the population of trillions of microorganisms that live in the gut, particularly at the lower end, the large intestine, where faeces are formed. For a long time, researchers’ focus was to identify microorganisms that trigger diseases (pathogens) and the best way to destroy them with antibiotics. With increasing knowledge about the gut microbiota it became clear that there are good bacteria that are beneficial for the human host. In particular the bacterial groups Bifidobacterium and Lactobacillus are known to support health in many ways. It is also becoming clear, that the microbiota ecosystem interacts with the human body. The gut microbiota produces metabolites and break down products within their ecosystem inside the gut. These products are of bacterial origin and influence the gut environment, and may even cross the gut barrier, reaching the blood circulation and therefore other organs like the brain, kidney, muscles, lung etc. The complexity is evident and its relationship to health and wellbeing is crucial. Read this paper that shows the uniqueness of Orafti® Inulin and Oligofructose as proven plant-based prebiotics – ingredients that are scientifically proven to let consumers feel the health benefit of! Social media"
