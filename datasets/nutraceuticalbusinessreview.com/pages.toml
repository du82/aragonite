["https://nutraceuticalbusinessreview.com/a-balanced-gut-for-a-longer-life-the"]
title = "A balanced gut for a longer life: the diversity advantage"
description = "The difference between unhealthy ageing and healthy ageing is in the composition of the microbiome, reports Dr Mahmoud Ghannoum, cofounder and Chief Scientific Officer at Biohm Health"
full_description = "Healthy ageing is more than just commitment to good habits; the condition of the gut microbiome can make a huge difference in a well-functioning body years down the road. As humans age, the microbiome evolves.1 In the microbiome of an 8-week-old infant, for example, Actinobacteria reigns and Firmicutes and Bacteroidetes occur in lower amounts. By contrast, let’s compare the dominant taxa in healthy and frail elderly subjects: in the microbiome of the healthy elderly, Firmicutes overpower Bacteroidetes; but, in the latter, Bacteroidetes tends to dominate. Healthy elderly people also have a more diverse and balanced microbiome with more longevity associated bacterial and fungal species (Faecalibacterium and Coprococcus) than their frail counterparts — who tend to have more unhealthy levels of Fusobacterium and Candida albicans. Not yet a Subscriber? This is a small extract of the full article which is available ONLY to premium content subscribers. Click below to get premium content on Nutraceutical Business Review. Subscribe now Already a subscriber? Sign in here. Share on X Share on LinkedIn Share on Facebook Companies: Biohm Health See more"
