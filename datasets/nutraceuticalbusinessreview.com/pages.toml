["https://nutraceuticalbusinessreview.com/barentz-appoints-esther-veninga-as-new-cfo"]
title = "Barentz appoints Esther Veninga as new CFO"
description = "Barentz appoints Esther Veninga as new CFO"
full_description = "Barentz, a leading global specialty ingredients solution provider, is pleased to announce the appointment of Esther Veninga as Chief Financial Officer (CFO) and as a member of the Board, effective from 1 May 2025. Esther brings extensive international experience in finance and strategy, having held senior leadership roles in major food retail businesses across Europe and the United States. Esther joins Barentz from Albert Heijn, where she served as CFO, overseeing the financial strategy of one of the largest subsidiaries of Ahold Delhaize. Prior to this, she was CFO of Delhaize Serbia and held key finance and business leadership positions at Stop & Shop, Ahold Delhaize, and Ahold Czech Republic. Her career has spanned business planning and controlling, investor relations, strategic programme management, and financial control, equipping her with a comprehensive understanding of corporate finance and operational excellence. Commenting on her appointment, Esther said: “I am excited to join Barentz and contribute to its continued growth and success. Barentz has built a strong reputation as a global leader in specialty ingredients, and I look forward to working with the team to drive financial performance and strategic expansion.” Derk Jan Terhorst, CEO of Barentz, added: “We are delighted to welcome Esther to our leadership team. I have worked with Esther in the past and have always admired her analytical skills and business insight which she combines with her natural way of working with people of all backgrounds and levels, as well as her collaborative approach and forward- thinking mindset. Her broad financial expertise and international experience will be instrumental as we continue to execute our strategic ambitions and enhance our global market position.” Esther holds a master’s degree in Business and Managerial Economics from Erasmus University Rotterdam and has completed executive education at Harvard Business School in Strategic Financial Analysis for Business Evaluation. Share on X Share on LinkedIn Share on Facebook"
