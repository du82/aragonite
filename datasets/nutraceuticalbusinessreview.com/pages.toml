["https://nutraceuticalbusinessreview.com/barentz-names-gustavo-levy-dosualdo-as-new-regional"]
title = "Barentz names Gustavo Levy Dosualdo as new Regional CEO for South America"
description = "Barentz, a leading global specialty ingredients solution provider, is pleased to announce the appointment of Gustavo Levy Dosualdo as Regional CEO for Brazil, effective 3 February, 2025. Gustavo succeeds Elzo Tovani Benzaquen, who will take on a new role at Barentz after contributing significantly to the company's regional expansion in recent years"
full_description = "Gustavo brings over 20 years of experience in specialty ingredients, with a distinguished career at MCassab, where he most recently served as Director for the Life Sciences and Industrial Chemistry Divisions. His leadership has driven innovation and growth across diverse markets, including human nutrition, pharmaceuticals, cosmetics, and performance chemicals. Kees Schepers, Executive board member for South America, APAC, and Formulated Solution Centers at Barentz, commented: “I am thrilled to welcome Gustavo to the Barentz leadership team. His strong leadership skills, extensive market knowledge, and commitment to excellence will be instrumental in driving Barentz South America to new heights. I would also like to extend my heartfelt thanks to Elzo for his outstanding contributions to our regional growth and success. Under his guidance, we achieved significant milestones that position us strongly for the future.” Gustavo shared his enthusiasm about joining Barentz: “I’ve been following Barentz’s growth in South America and have always admired its ability to build a broad market presence through strategic acquisitions and a commitment to customer and supplier excellence. I am now honoured to join this exceptional team and lead us into the next phase of growth. My focus will be on uniting our talented teams, leveraging their expertise, and strengthening our partnerships with principals to deliver the best solutions to our customers. I believe in leadership that demands results but equally prioritises employee well-being, recognition, and professional development.” Barentz entered South America in 2018 with the acquisition of Tovani Benzaquen. Since then, it has expanded to now cover eight countries, serving more than 3000 customers across Human Nutrition, Pharma, Personal Care, Animal Nutrition and Performance Materials. Share on X Share on LinkedIn Share on Facebook"
