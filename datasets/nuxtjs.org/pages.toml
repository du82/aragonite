full_description = "The Nuxt BlogRead the latest news about all Nuxt solutions, from framework announcements to integration tutorials. RSS Subscribe to our newsletterSubscribeReleaseNuxt 3.15Nuxt 3.15 is out - with Vite 6, better HMR and faster performanceDecember 24, 2024ReleaseIntroducing Nuxt Icon v1Discover Nuxt Icon v1 - a modern, versatile, and customizable icon solution for your Nuxt projects.November 25, 2024ReleaseNuxt 3.14Nuxt 3.14 is out - with a new rspack builder, shared folder, and performance enhancements!November 4, 2024ReleaseNuxt 3.13Nuxt 3.13 is out - porting back some of the new features we're building for Nuxt 4!August 22, 2024ReleaseIntroducing Nuxt ScriptsNuxt Scripts provides better performance, privacy, security, and developer experience for third-party scripts.August 20, 2024AnnouncementNuxt 2 End-of-Life (EOL)Nuxt 2 will reach End of Life (EOL) on June 30th, 2024. We've partnered with HeroDevs on offering Never-Ending Support (NES).June 14, 2024ReleaseNuxt 3.12Nuxt 3.12 is out - full of improvements and preparing the way for Nuxt 4!June 10, 2024ArticleRefreshed Nuxt ESLint IntegrationsWe revamped our ESLint integrations to support ESLint v9 with the flat config, as well as a new module with many more capabilities.April 10, 2024ReleaseNuxt: Looking forwardA lot of things have happened for Nuxt over the last year. Sébastien and Daniel share their thoughts on what we've achieved, and where we're going next.March 28, 2024ReleaseNuxt 3.11Nuxt 3.11 is out - with better logging, preview mode, server pages and much more!March 16, 2024ArticleThe Evolution of Shiki v1.0Shiki v1.0 came with many improvements and features - see how Nuxt drives the evolution of Shiki!March 11, 2024ReleaseNuxt 3.10Nuxt 3.10 is out - packed with features and fixes. Here are a few highlights.January 30, 2024ReleaseNuxt 3.9Nuxt 3.9 is out - a Christmas gift from the Nuxt team bringing Vite 5, interactive server components, new composables, a new loading API and more.December 25, 2023ReleaseNuxt DevTools v1.0Nuxt DevTools v1.0 is out, generally available to all Nuxt projects!November 13, 2023ReleaseNuxt 3.8Nuxt 3.8 is out, bringing built-in DevTools, automatic Nuxt Image install, a new app manifest and much more.October 19, 2023AnnouncementA New WebsiteWe are thrilled to release the new nuxt.com, powered by Nuxt UI and now open source.October 18, 2023ReleaseNuxt 3.7Nuxt 3.7 is out, bringing a new CLI, native web streams and response, rendering optimisations, async context support - and much more.August 25, 2023ArticleNuxt on the EdgeLearn how we made Nuxt 3 capable of running on edge runtimes to run with server-side rendering close to your users.July 13, 2023ReleaseNuxt 3.6Nuxt 3.6 is out, bringing performance improvements, fully static server components, better style inlining, static presets, increased type safety - and much more.June 23, 2023ReleaseNuxt 3.5Nuxt 3.5.0 is out, bringing Vue 3.3, new defaults, interactive server components, typed pages, environment config - and much more.May 16, 2023ReleaseNuxt 3.4Nuxt 3.4.0 is the latest release of Nuxt 3, bringing exciting new features, including support for the View Transitions API, transferring rich JavaScript payloads from server to client - and much more.April 11, 2023ReleaseIntroducing Nuxt DevToolsUnleash the Developer Experience with Nuxt and understand your app better than ever.March 27, 2023ReleaseNuxt 3.3The 3.3.0 is a minor (feature) release with lots of performance and DX improvements, bug fixes and new features to play with.March 14, 2023ReleaseNuxt: A vision for 2023This past year has been an exciting one. Looking into the new year, there is a lot we have planned as a team and we'd love to share it with you.January 17, 2023ReleaseAnnouncing 3.0We are thrilled to announce the first stable version of Nuxt 3.0.0November 16, 2022ReleaseAnnouncing Nuxt 3 Release CandidateNuxt 3 beta was announced on October 12, 2021 after 16 months of work, introducing a new foundation based on Vue 3, Vite and Nitro. Six months later, we are happy to announce the first release candidate of Nuxt 3, code named “Mount Hope“ 🚀April 12, 2022ReleaseIntroducing Nuxt 3 Beta468 days after the first commit, the Nuxt 3 beta has finally arrived. Discover what's inside and what to expect from it. Yes, it includes Vue 3 and Vite ⚡️October 11, 2021ReleaseNuxt 2 Static ImprovementsWith Nuxt version 2.13, the full-static mode has been introduced. In addition, a new command nuxt export was added to pre-render your pages without triggering a webpack build with the goal to separate the rendering and build process. The only issue was that most Nuxt users weren't able to unleash the full potential of the separation... until now.July 27, 2020ReleaseGoing Full StaticLong awaited features for JAMstack fans has been shipped in v2.13: full static export, improved smart prefetching, integrated crawler, faster re-deploy, built-in web server and new target option for config ⚡️June 18, 2020ReleaseUnderstanding how fetch works in Nuxt 2.12Explore different features of the fetch hook and learn a brand new way to bring data into Nuxt applications.April 6, 2020ReleaseNuxt 2: From Terminal to BrowserHow we changed the developer experience to stop switching between the terminal and browser.June 3, 2019ReleaseIntroducing Smart PrefetchingStarting from Nuxt v2.4.0, Nuxt will automagically prefetch the code-splitted pages linked with a nuxt-link when visible in the viewport by default.January 28, 2019"
