title = "Nuxt: The Intuitive Vue Framework · Nuxt"
description = "Nuxt is an open source framework that makes web development intuitive and powerful. Create performant and production-grade full-stack web apps and websites with confidence."
full_description = '''Nuxt v3.15 is out The IntuitiveVue Framework Nuxt is an open source framework that makes web development intuitive and powerful.Create performant and production-grade full-stack web apps and websites with confidence. Get Started Nuxt in 100 Seconds Trusted by the best front-end teamsThe power ofVue ComponentsWe love Vue Single-File Components as much as you do. Simple, intuitive and powerful, Nuxt lets you write Vue components in a way that makes sense. Every repetitive task is automated, so you can focus on writing your full-stack Vue application with confidence.Learn about ViewsHello World Exampleapp.vue<script setup> useSeoMeta({ title: 'Meet Nuxt', description: 'The Intuitive Vue Framework.' }) </script> <template> <div id="app"> <AppHeader /> <NuxtPage /> <AppFooter /> </div> </template> <style> #app { background-color: #020420; color: #00DC82; } </style> html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}Static or Dynamic,the choice is yoursDecide what rendering strategy you need at the route level. By leveraging the hybrid rendering, you can get the best of both worlds: the performance of a static site and the interactivity of a dynamic one.Learn about Hybrid RenderingNuxt on the Edgepages/index.vuenuxt.config.ts<script setup> // Pre-render the homepage at build time defineRouteRules({ prerender: true }) </script> <template> <div> <h1>Homepage</h1> <p>Pre-rendered at build time</p> </div> </template> html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}Compose witheverything you need.Routing & LayoutsFile based routing system to build complex views and interfaces with a powerful and conventional approach.Data FetchingComposables that run on the server to fetch data for your components and enable you to render content in different ways.Assets & StyleImage, Font and Script optimizations with a built-in support for CSS Modules, Sass, PostCSS, CSS-in-JS and more.SEO & Meta TagsProduction ready and indexable by search engines while giving the feeling of an app to the end-users.MiddlewareRun custom code such as authentication, localization or A/B testing before rendering a page or a group of pages.State ManagementNuxt provides a simple way to share a reactive and SSR-friendly state between components.TransitionsCreate smooth transitions between layouts, pages and components with a built-in support for Vue & browser transitions.Error HandlingBuilt-in error handling and logging to help you debug your application and provide a better user experience.LayersExtend your Nuxt application with another Nuxt application to reuse components, composables, layouts, pages and more.Server RoutesCreate API endpoints and server routes to securely connect with third party services and consume from your frontend.Auto ImportsNuxt auto-imports helpers, composables, and Vue APIs to use across your app without explicitly importing them.TypeScriptNuxt provides helpful shortcuts to ensure you have access to accurate type information when you are coding.Ship faster withendless integrationsIntegrate with your favorite tools and services. Nuxt is built to be flexible and can be extended with a robust modules ecosystem. Connect your application with popular headless CMS, eCommerce, Database or UI/UX libraries with a single line of code.Explore Nuxt ModulesLearn about ModulesBuilt by developersaround the world.The development of Nuxt and its ecosystem is led by an international team. From contributors to developer advocates, the community is made up of members with different horizons and skills. We are happy to see new members every day and encourage anyone to join us and help in many ways: answering questions, giving a talk, creating modules and contributing to the core.NuxtersTrusted by theWorld Wide Web.Nuxt offers a compelling solution and a great ecosystem to help you ship fullstack Vue apps that are performant and SEO friendly. The flexibility to choose between SSR and SSG is icing on the cake.Evan YouCreator of Vue.js and ViteNuxt is a fantastic choice for teams building a production-grade product on the web. It aims to bake in performance best-practices while maintaining excellent Vue.js DX.Addy OsmaniChief Engineer of ChromeNuxt has been an incredible source of innovation and inspiration for developers and framework authors alike. It's been amazing to see its growth in web projects of all sizes on the web.Guillermo RauchCo-founder and CEO of VercelNuxt has outstanding developer productivity, experience, and performance right out of the gate! There’s so much attention to detail, ensuring teams have everything at their fingertips to productively build all manners of applications.Sarah DrasnerDirector of Engineering, GoogleNuxt has a unique approach of combining a great developer experience with reusable, fully integrated features that speed up the development and performance of your next website or application.Dominik AngererCo-founder of StoryblokThe moment I used Nuxt for the first time I felt in love with it. Apart from its scalability, performance and developer experience, the team behind of it is also fantastic. Thanks for developing such a great framework and making our lives much easier!Savas VedovaSenior Frontend Engineer at GitLabNuxt’s blend of high performance and focused developer experience is a game changer. Its SSR and SSG flexibility, coupled with a community that’s as vibrant as the Vue.js ecosystem, makes it a great choice for modern web projects.Rijk van ZantenCTO at Directus'''
