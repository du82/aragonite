full_description = "Vulnerabilities Official Vendor Comments NVD provides the software industry an open forum to comment upon the vulnerabilities discovered in their products. Software vendors have the deepest knowledge about their products and thus are uniquely positioned to comment on their vulnerabilities. Organizations can use this service in a variety of ways. For example, they can provide configuration and remediation guidance, clarify vulnerability applicability, provide deeper vulnerability analysis, dispute third party vulnerability information, and explain vulnerability impact. The CVES API returns all comments within the optional vendorComments object. Until late 2023, the complete set of comments is available as an XML feed from the NVD data feed page. They are also enumerated below. We encourage other vulnerability databases and services to incorporate Official Vendor Comments alongside their CVE descriptions. The comments are also available on the respective NVD vulnerability summary pages (e.g., https://nvd.nist.gov/vuln/detail/CVE-2006-4124). Software development organizations can submit official comments by contacting NVD staff ( nvd@nist.gov). The capability exists both for organizations to manually submit comments and for organizations to log into NVD to issue and modify comments themselves. We recommend the log in capability for organizations that are affected by more than a few CVE vulnerabilities. It is our hope that the software industry will actively participate in this open forum and that the Official Vendor Comments will be propagated throughout the 300+ products and services that use the CVE standard. The total number of vendor comments is 1,486 (updated every 2 hours) Vendor Comment CVEs 8e6 Technologies CVE-2007-2970 abarcar Software CVE-2006-5840 Acunetix Limited CVE-2007-0120 Advanced Search Bar CVE-2007-4250 AirMagnet CVE-2006-5741 CVE-2006-5742 CVE-2006-5746 AlgoSec CVE-2013-5092 CVE-2013-7318 CVE-2014-4164 Allied Telesyn CVE-2006-61