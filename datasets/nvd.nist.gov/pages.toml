title = "NVD - CWE Over Time"
full_description = '''GeneralVisualizationsVulnerability Visualizations CWE Over Time The two visualizations on this page are simple graphs which provide different views of how the assignment of vulnerabiility types has changed over time. Relative Vulnerability Type Totals By Year The vulnerabilties in the NVD are assigned a CWE based on a slice of the total CWE Dictionary . The visualization below shows a stacked bar graph of the total number of vulnerabilities assigned a CWE for each year. It is possible (although not common) that a vulnerability has multiple CWEs assigned. Vulnerability Type Change By Year This visualization is a slightly different view that emphasizes how the assignment of CWEs has changed from year to year. jQuery(document).ready(function ($) { var baseUrl = document.getElementById('CweServiceEndpointHidden').value; console.log("CWE Service base URL", baseUrl); d3.json(baseUrl + "/counts", vulnsCounts.drawVulnsCounts); d3.json(baseUrl + "/percentages", vulnsPercentages.drawVulnsPercentages); });'''
