full_description = '''Developers Products This documentation assumes that you already understand at least one common programming language and are generally familiar with JSON RESTful services. JSON specifies the format of the data returned by the REST service. REST refers to a style of services that allow computers to communicate via HTTP over the Internet. Click here for a list of best practices and additional information on where to start. The NVD is also documenting popular workflows to assist developers working with the APIs. CPE API The CPE API is used to easily retrieve information on a single CPE record or a collection of CPE records from the Official CPE Dictionary . The dictionary contains 1,374,055 CPE Names and more than 420,000 match strings. Because of this, the NVD enforces offset-based pagination to answer requests for large collections. Through a series of smaller “chunked” responses controlled by an offset startIndex and a page limit resultsPerPage users may page through all the records in the dictionary. For more information on the full CPE specification please refer to the Computer Security Resource Center. The URL stem for retrieving CPE information is shown below. Base URL https://services.nvd.nist.gov/rest/json/cpes/2.0 Parameters cpeNameId optional {uuid} This parameter returns a specific CPE record identified by a Universal Unique Identifier (UUID). Please note, cpeNameId only checks whether a {uuid} is correctly formatted. Requests for properly formatted {uuid} that have not been assigned to a product in the Official CPE Dictionary will return a successful response without results. The CPE Match Criteria API response provides valid {uuid} values under the cpeNameId field. cpeNameId https://services.nvd.nist.gov/rest/json/cpes/2.0?cpeNameId=87316812-5F2C-4286-94FE-CC98B9EAEF53 cpeMatchString optional {match string} This parameter returns CPE Names that exist in the Official CPE Dictionary, based on the value of {match string}. A CPE Name is a string of characters comprised of 13 colon separated values that describe a product. In CPEv2.3 the first two values are always “cpe” and “2.3”. The 11 values that follow are referred to as the CPE components. A CPE Match string is a single CPE string that correlates to one or many CPE Names in the Official CPE Dictionary. Because the NVD publishes CPE applicability statements for thousands of CVE each year, match strings are made to withstand changes to the Official CPE Dictionary, without requiring consistent maintenance. Request CPE names for Microsoft Windows 10 https://services.nvd.nist.gov/rest/json/cpes/2.0?cpeMatchString=cpe:2.3:o:microsoft:windows_10 Request CPE names for Microsoft Windows 10, version 1511 https://services.nvd.nist.gov/rest/json/cpes/2.0?cpeMatchString=cpe:2.3:o:microsoft:windows_10:1511 Request all CPE names with the vendor "Microsoft" https://services.nvd.nist.gov/rest/json/cpes/2.0?cpeMatchString=cpe:2.3:*:Microsoft keywordExactMatch optional By default, keywordSearch returns any CPE record where a word or phrase is found in the metadata title or reference links. If the value of keywordSearch is a phrase, i.e., contains more than one term, including keywordExactMatch returns only the CPE matching the phrase exactly. Otherwise, the results will contain records having any of the terms. If filtering by keywordExactMatch, keywordSearch is required. Please note, this parameter should be provided without a parameter value. Request all exact matches of "Microsoft Windows" https://services.nvd.nist.gov/rest/json/cpes/2.0?keywordSearch=Microsoft Windows&keywordExactMatch Please note, the example above would not return a CPE unless the exact phrase "Microsoft Windows" appears in the metadata title or reference links. keywordSearch optional {keyword(s)} This parameter returns only the CPE records where a word or phrase is found in the metadata title or reference links. Request all mentions of "Red" and "Hat" https://services.nvd.nist.gov/rest/json/cpes/2.0?keywordSearch=Red Hat Request any CPE mentioning both "Java" and "Oracle" https://services.nvd.nist.gov/rest/json/cpes/2.0?keywordSearch=Java Oracle Please note, multiple {keywords} function like an 'AND' statement. This returns results where all keywords exist somewhere in the metadata title or reference links, though not necessarily together. Keyword search operates as though a wildcard is placed after each keyword provided. For example, providing "circle" will return results such as "circles" but not "encircle". lastModStartDate & lastModEndDate optional {start date} {end date} These parameters return only the CPE records that were last modified during the specified period. If a CPE record has been modified more recently than the specified period, it will not be included in the response. If filtering by the last modified date, both lastModStartDate and lastModEndDate are required. The maximum allowable range when using any date range parameters is 120 consecutive days. A CPE record is considered "modified" when any of the follow actions occur: A new CPE record is created An existing CPE record is modified An existing CPE is deprecated Values must be entered in the extended ISO-8601 date/time format: [YYYY][“-”][MM][“-”][DD][“T”][HH][“:”][MM][“:”][SS][Z] The "T" is a literal to separate the date from the time. The Z indicates an optional offset-from-UTC. Please note, if a positive Z value is used (such as +01:00 for Central European Time) then the "+" should be encoded in the request as "%2B". The user agent may handle this automatically. Request all CPE records modified between the start and end datetimes https://services.nvd.nist.gov/rest/json/cpes/2.0/?lastModStartDate=2021-08-04T13:00:00.000%2B01:00&lastModEndDate=2021-10-22T13:36:00.000%2B01:00 matchCriteriaId optional {uuid} This parameter returns all CPE records associated with a match string identified by its {uuid}. matchCriteriaId will only accept a properly formatted {uuid}. CPE Match Criteria comes in two forms: CPE Match Strings and CPE Match String Ranges. Both are abstract concepts that are then correlated to CPE URIs in the Official CPE Dictionary. Unlike a CPE Name, match strings and match string ranges do not require a value in the part, vendor, product, or version components. The CVE API returns valid {uuid} within the configurations object. The Match Criteria API returns valid {uuid} within the matchCriteriaId object. Request all CPE names that match a uuid https://services.nvd.nist.gov/rest/json/cpes/2.0?matchCriteriaId=36FBCF0F-8CEE-474C-8A04-5075AF53FAF4 resultsPerPage optional {page limit} This parameter specifies the maximum number of CPE records to be returned in a single API response. For network considerations, the default value and maximum allowable limit is 10,000. startIndex optional {offset} This parameter specifies the index of the first CPE to be returned in the response data. The index is zero-based, meaning the first CPE is at index zero. The CPE API returns four primary objects in the response body that are used for pagination: resultsPerPage, startIndex, totalResults, and products. totalResults indicates the total number of CPE records that match the request parameters. If the value of totalResults is greater than the value of resultsPerPage there are more records than could be returned by a single API response and additional requests must update the startIndex to get the remaining records. The best, most efficient, practice for keeping up to date with the NVD is to use the date range parameters to request only the CPE that have been modified since your last request. Request 20 CPE records, beginning at index 0 and ending at index 19 https://services.nvd.nist.gov/rest/json/cpes/2.0/?resultsPerPage=20&startIndex=0 Request the CPE records, beginning at index 20 and ending at index 39 https://services.nvd.nist.gov/rest/json/cpes/2.0/?resultsPerPage=20&startIndex=20 Response CPE API JSON Schema This API response includes only one JSON schema for defining the structure of the response data. The following document includes information on data types, regex patterns, maximum character length, and other information that can support developers and database administrators looking to create their own local repository. CPE Schema Response Details The CPE API returns seven primary objects in the body of the response: resultsPerPage, startIndex, totalResults, format, version, timestamp, and products. The totalResults object indicates the number of CPE records that match the request criteria, including all parameters. If the value of totalResults is greater than the value of resultsPerPage, then additional requests are necessary to return the remaining records. The parameter startIndex may be used in subsequent requests to identify the starting point for the next request. More information and the best practices for using resultsPerPage and startIndex are described above. The format and version objects identify the format and version of the API response. timestamp identifies when the response was generated. The products object contains an array of objects equal to the number of records returned in the response and is sorted in ascending order by the created property of the cpe object. The cpe object is explained in more detail below. cpe required This object contains a boolean flag indicating whether the CPE is deprecated, the cpeName (including the reverse solidus escape character \), the cpeNameId, the date and time that the CPE was added to the Official CPE Dictionary, the date and time that the CPE was last modified, as well as additional metadata under the titles object. If the CPE is deprecated an optional deprecatedBy field will provide the CPE Name that that replaces it. Toggle JSON { "resultsPerPage": 2, "startIndex": 0, "totalResults": 2, "format": "NVD_CPE", "version": "2.0", "timestamp": "2023-01-10T19:46:53.290", "products": [ { "cpe": { "deprecated": false, "cpeName": "cpe:2.3:a:3com:3cdaemon:-:*:*:*:*:*:*:*", "cpeNameId": "BAE41D20-D4AF-4AF0-AA7D-3BD04DA402A7", "lastModified": "2011-01-12T14:35:43.723", "created": "2007-08-23T21:05:57.937", "titles": [ { "title": "3Com 3CDaemon", "lang": "en" }, { "title": "スリーコム 3CDaemon", "lang": "ja" } ] } }, { "cpe": { "deprecated": true, "cpeName": "cpe:2.3:o:linux:linux_kernel:2.6.2:*:*:*:*:*:*:*", "cpeNameId": "DF3171C4-00E8-4B0F-97EB-2F3EC3394A87", "lastModified": "2021-06-01T14:14:47.707", "created": "2007-08-23T21:16:59.567", "titles": [ { "title": "Linux Kernel 2.6.2", "lang": "en" } ], "refs": [ { "ref": "https://github.com/torvalds/linux", "type": "Version" } ], "deprecatedBy": [ { "cpeName": "cpe:2.3:o:linux:linux_kernel:2.6.2:-:*:*:*:*:*:*", "cpeNameId": "1B4C49FC-8606-45D7-94D1-19C5626D69C7" } ], "deprecates": [ { "cpeName": "cpe:2.3:o:linux:kernel:2.6.2:*:*:*:*:*:*:*", "cpeNameId": "B548E49E-BC95-4804-A2C2-D7ACC7F72095" } ] } } ] } Match Criteria API The CPE Match Criteria API is used to easily retrieve the complete list of valid CPE Match Strings. Unlike a CPE Name, match strings and match string ranges do not require a value in the part, vendor, product, or version components. The URL stem for retrieving match criteria information is shown below. Base URL https://services.nvd.nist.gov/rest/json/cpematch/2.0 Parameters cveId optional {CVE ID} This parameter returns all non-deprecated CPE match strings in the availability statement of a specific vulnerability identified by its Common Vulnerabilities and Exposures identifier (the CVE ID). cveId https://services.nvd.nist.gov/rest/json/cpematch/2.0?cveId=CVE-2022-32223 lastModStartDate & lastModEndDate optional {start date} {end date} These parameters return only the CPE records that were last modified during the specified period. If a CPE record has been modified more recently than the specified period, it will not be included in the response. If filtering by the last modified date, both lastModStartDate and lastModEndDate are required. The maximum allowable range when using any date range parameters is 120 consecutive days. When a user populates the lastModStartDate and lastModEndDate parameters, the API will compare these dates with the most recent lastModified or cpeLastModified dates of the CPE Match Criteria. If this date is within the time frame provided, the match criteria will be included in the response. This ensures that data consumers are always aware of changes to the CPE Match Criteria itself or the CPE Names that match. cpeLastModified changes when a CPE Name relevant to the CPE Match Criteria is created, modified, or deprecated. lastModified changes when the CPE Match Criteria is created or its status changes. Values must be entered in the extended ISO-8601 date/time format: [YYYY][“-”][MM][“-”][DD][“T”][HH][“:”][MM][“:”][SS][Z] The "T" is a literal to separate the date from the time. The Z indicates an optional offset-from-UTC. Please note, if a positive Z value is used (such as +01:00 for Central European Time) then the "+" should be encoded in the request as "%2B". The user agent may handle this automatically. Request all CPE match strings modified between the start and end datetimes https://services.nvd.nist.gov/rest/json/cpematch/2.0?lastModStartDate=2021-08-04T13:00:00.000%2B01:00&lastModEndDate=2021-10-22T13:36:00.000%2B01:00 matchCriteriaId optional {uuid} This parameter returns all CPE records associated with a match string identified by its {uuid}. matchCriteriaId will only accept a properly formatted {uuid}. CPE Match Criteria comes in two forms: CPE Match Strings and CPE Match String Ranges. Both are abstract concepts that are then correlated to CPE URIs in the Official CPE Dictionary. Unlike a CPE Name, match strings and match string ranges do not require a value in the part, vendor, product, or version components. The CVE API returns valid {uuid} within the configurations object. The Match Criteria API returns valid {uuid} within the matchCriteriaId object. Request all CPE names that match a uuid https://services.nvd.nist.gov/rest/json/cpematch/2.0?matchCriteriaId=36FBCF0F-8CEE-474C-8A04-5075AF53FAF4 matchStringSearch optional {cpe match string} This parameter returns all CPE Match Strings that conform to the pattern of the {cpe match string}. If a match string includes any CPE Names they will be listed in the response under matches. CPE Match Criteria comes in two forms: CPE Match Strings and CPE Match String Ranges. Both are abstract concepts that are then correlated to CPE URIs in the Official CPE Dictionary. Unlike a CPE Name, CPE Match Strings and CPE Match String Ranges do not require a value in the part, vendor, product, or version components. This parameter does not support CPE Match String Ranges. matchCriteriaId is a simpler alternative for many use cases. Request all CPE Match Strings where the vendor and product components conform to the following pattern. https://services.nvd.nist.gov/rest/json/cpematch/2.0?matchStringSearch=cpe:2.3:*:cisco:adaptive_security_appliance:* resu'''
