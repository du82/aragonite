full_description = 'Vulnerabilities NVD Data Feeds APIs and Data Feed Types The following table contains links and short descriptions for each API or data feed the NVD offers. Please read how to keep up-to-date with NVD data when using the traditional data feeds. Users of the data feeds provided on this page must have an understanding of the XML and/or JSON standards and XML or JSON related technologies as defined by www.w3.org. Type Description CVE and CPE APIs An alternative to the traditional vulnerability data feed files. The APIs are far more flexible and offer a richer dataset in a single interface compared to the JSON Vulnerability Feeds and CPE Match Feed. JSON Vulnerability Feeds Each vulnerability in the file includes a description and associated reference links from the CVE® dictionary feed, as well as CVSS base metrics, vulnerable product configuration, and weakness categorization. CPE Match Feed A feed that provides the product/platform applicability statement to CPE URI matching based on the CPEs in the official CPE dictionary. Vulnerability Translation Feeds Translations of vulnerability feeds. Vulnerability Vendor Comments Comments provided by vendors regarding a particular flaw affecting within a product. CPE Dictionary dictionary containing a list of products. Common Configuration Enumeration (CCE) Reference Data Reference data for common configuration items. CVE and CPE APIs The 2.0 APIs are the preferred method for staying up to date with the NVD. Users interested in learning where to begin with the API should visit the NVD developers pages. Benefits of the APIs over the traditional data feeds include: The APIs are updated as frequently as our website (unlike the traditional feeds which have explicit update intervals) The APIs provide search capabilities based on the Advanced search feature of the website The APIs provide CVE and CPE based searching capabilities, including the ability to search for single CVE and CPE entries The ability to view only the information that has changed since a given date or time Simplified methods of identifying CPE matches to Applicability statements CVE API Documentation CPE API Documentation Automation Support for CVE Retrieval Automation Support for CPE Retrieval How to Keep Up-to-Date with the NVD Data Using the Traditional Feeds The vulnerability feeds provide CVE® data organized by the first four digits of a CVE® identifier (except for the 2002 feeds which include vulnerabilities prior to and including "CVE-2002-"). If you are locally mirroring NVD data, either the APIs or the data feeds may be used to stay synchronized. After performing a one-time import of the complete data set using the compressed JSON vulnerability feeds, the "modified" feeds should be used to keep up-to-date. Each feed is updated nightly, but only if the content of that feed has changed. For example, the 2004 feeds will be updated only if there is an addition or modification to any vulnerability with a starting CVE® identifier of "CVE-2004-". The "recent" feeds are a list of recently published vulnerabilities and the "modified" feeds are a list of recently published and modified vulnerabilities. The "recent" and "modified" feeds only contain vulnerabilities changed within the previous eight days. These feeds are updated approximately every two hours. META Files Users should always consult the META file to determine if a given feed has been updated since the last import. If no changes have been made there is no benefit to downloading either the .zip or .gz files. This approach should result in a reasonable use of less than 200 requests per day. Each of the data feeds is described by an associated plain text file with the same name as the .xml/.json file with a .meta extension. These files are updated approximately every two hours to reflect changes within their respective feed file. For example, if the name of the file is nvdcve-1.1-Modified.json then the .meta file name will be nvdcve-1.1-Modified.meta. The .meta file contains information about the specific feed file including the last modified date and time, the size of the file uncompressed, and a SHA256 value of the uncompressed file: lastModifiedDate:2015-09-10T08:40:09-04:00 size:1273382 zipSize:91619 gzSize:91477 sha256:ac782e2db403e2b09ad5dd676501e8755fda3f2bef347b7503491700c6c5eaff JSON Feeds These data feeds includes both previously offered and new NVD data points in an updated JSON format. The "year" feeds are updated once per day, while the "recent" and "modified" feeds are updated every two hours. The NVD plans to retire all legacy data feeds while guiding any remaining data feed users to updated application-programming interfaces (APIs). APIs have many benefits over data feeds and have been the proven and preferred approach to web-based automation for over a decade. For additional information on the NVD API, please visit the developers pages. Click here for more information on the retirement timeline. Schema Version 1.1 : NVD JSON 1.1 Schema Feed Updated Download Size (MB) CVE-Modified 02/28/2025; 8:00:02 PM -0500 META GZ 1.06 MB ZIP 1.06 MB CVE-Recent 02/28/2025; 8:00:00 PM -0500 META GZ 0.65 MB ZIP 0.65 MB CVE-2025 02/28/2025; 3:00:04 AM -0500 META GZ 0.63 MB ZIP 0.63 MB CVE-2024 02/28/2025; 3:00:46 AM -0500 META GZ 8.82 MB ZIP 8.82 MB CVE-2023 02/28/2025; 3:01:14 AM -0500 META GZ 7.46 MB ZIP 7.46 MB CVE-2022 02/28/2025; 3:01:41 AM -0500 META GZ 7.06 MB ZIP 7.06 MB CVE-2021 02/28/2025; 3:02:07 AM -0500 META GZ 6.81 MB ZIP 6.81 MB CVE-2020 02/28/2025; 3:02:31 AM -0500 META GZ 5.76 MB ZIP 5.76 MB CVE-2019 02/25/2025; 3:02:27 AM -0500 META GZ 4.71 MB ZIP 4.71 MB CVE-2018 02/25/2025; 3:02:44 AM -0500 META GZ 4.15 MB ZIP 4.15 MB CVE-2017 02/25/2025; 3:03:00 AM -0500 META GZ 3.79 MB ZIP 3.79 MB CVE-2016 02/21/2025; 3:03:12 AM -0500 META GZ 2.74 MB ZIP 2.74 MB CVE-2015 02/21/2025; 3:03:21 AM -0500 META GZ 2.29 MB ZIP 2.29 MB CVE-2014 02/15/2025; 3:03:15 AM -0500 META GZ 2.39 MB ZIP 2.39 MB CVE-2013 02/