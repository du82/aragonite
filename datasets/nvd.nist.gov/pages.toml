full_description = "Vulnerabilities /* wrap the words for CVSS v4 */ #nistv4Metric { word-wrap: break-word; } /*<![CDATA[*/ var vuln = { nistV4Present: false, cnaV4Present: false, nistV3Present: false, cnaV3Present: false, nistV2Present: true, cnaV2Present: false }; /*]]>*/ CVE-1999-0523 Detail Modified This CVE record has been updated after NVD enrichment efforts were completed. Enrichment data supplied by the NVD may require amendment due to these changes. Description ICMP echo (ping) is allowed from arbitrary hosts. Metrics CVSS Version 4.0 CVSS Version 3.x CVSS Version 2.0 NVD enrichment efforts reference publicly available information to associate vector strings. CVSS information contributed by other sources is also displayed. CVSS 4.0 Severity and Vector Strings: NIST: NVD N/A NVD assessment not yet provided. CVSS 3.x Severity and Vector Strings: NIST: NVD Base Score: N/A NVD assessment not yet provided. CVSS 2.0 Severity and Vector Strings: NIST: NVD Base Score: 0.0 LOW Vector: (AV:N/AC:L/Au:N/C:N/I:N/A:N) Vendor Statements (disclaimer) Official Statement from Red Hat (09/11/2007) Red Hat Enterprise Linux by default does respond to ICMP echo requests, although it’s likely that in a production environment those would be filtered by some firewall on entry to your network. However you can happily block ICMP ping responses using iptables if you so wish, but note that there is no known vulnerability in allowing them. For more details, please see: http://kbase.redhat.com/faq/FAQ_43_4304.shtm References to Advisories, Solutions, and Tools By selecting these links, you will be leaving NIST webspace. We have provided these links to other web sites because they may have information that would be of interest to you. No inferences should be drawn on account of other sites being referenced, or not, from this page. There may be other web sites that are more appropriate for your purpose. NIST does not necessarily endorse the views expressed, or concur with the facts present