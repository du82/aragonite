5.126 due to insufficient input sanitiza... read CVE-2024-10784 Published: December 12, 2024; 2:15:07 AM -0500 V3.1: 5.4 MEDIUM CVE-2024-11384 - The Arena.IM – Live Blogging for real-time events plugin for WordPress is vulnerable to Stored Cross-Site Scripting via the plugin's 'arenablog' shortcode in all versions up to, and including, 0.3.0 due to insufficient input sanitization and outpu... read CVE-2024-11384 Published: December 12, 2024; 12:15:07 AM -0500 V3.1: 5.4 MEDIUM CVE-2025-22716 - Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection') vulnerability in Taskbuilder Team Taskbuilder allows SQL Injection. This issue affects Taskbuilder: from n/a through 3.0.6. Published: January 21, 2025; 9:15:11 AM -0500 V3.1: 8.8 HIGH CVE-2025-0581 - A vulnerability classified as problematic has been found in CampCodes School Management Software 1.0. This affects an unknown part of the file /chat/group/send of the component Chat History. The manipulation of the argument message leads to cross ... read CVE-2025-0581 Published: January 19, 2025; 10:15:08 PM -0500 V3.1: 5.4 MEDIUM CVE-2023-5505 - The BackWPup plugin for WordPress is vulnerable to Directory Traversal in versions up to, and including, 4.0.1 via the job-specific backup folder. This allows authenticated attackers to store backups in arbitrary folders on the server provided the... read CVE-2023-5505 Published: August 17, 2024; 5:15:07 AM -0400 V3.1: 6.8 MEDIUM CVE-2024-38810 - Missing Authorization When Using @AuthorizeReturnObject in Spring Security 6.3.0 and 6.3.1 allows attacker to render security annotations inaffective. Published: August 20, 2024; 12:15:07 AM -0400 V3.1: 7.5 HIGH CVE-2024-37099 - Deserialization of Untrusted Data vulnerability in Liquid Web GiveWP allows Object Injection.This issue affects GiveWP: from n/a through 3.14.1. Published: August 19, 2024; 1:15:07 PM -0400 V3.1: 9.8 CRITICAL CVE-2023-0714 - The Metform Elementor Contact Form Builder for WordPress is vulnerable to Arbitrary File Upload due to insufficient file type validation in versions up to, and including, 3.2.4. This allows unauthenticated visitors to perform a "double extension" ... read CVE-2023-0714 Published: August 17, 2024; 6:15:06 AM -0400 V3.1: 9.8 CRITICAL CVE-2024-57668 - In Code-projects Shopping Portal v1.0, the insert-product.php page has an arbitrary file upload vulnerability. Published: February 06, 2025; 2:15:19 PM -0500 V3.1: 8.8 HIGH CVE-2025-0973 - A vulnerability classified as critical was found in CmsEasy 7.7.7.9. This vulnerability affects the function backAll_action in the library lib/admin/database_admin.php of the file /index.php?case=database&act=backAll&admin_dir=admin&site=default. ... read CVE-2025-0973 Published: February 02, 2025; 8:15:07 PM -0500 V3.1: 6.5 MEDIUM CVE-2024-12822 - The Media Manager for UserPro plugin for WordPress is vulnerable to unauthorized modification of data that can lead to privilege escalation due to a missing capability check on the add_capto_img() function in all versions up to, and including, 3.1... read CVE-2024-12822 Published: January 30, 2025; 9:15:33 AM -0500 V3.1: 9.8 CRITICAL CVE-2024-12821 - The Media Manager for UserPro plugin for WordPress is vulnerable to unauthorized modification of data that can lead to privilege escalation due to a missing capability check on the upm_upload_media() function in all versions up to, and including, ... read CVE-2024-12821 Published: January 30, 2025; 9:15:32 AM -0500 V3.1: 6.5 MEDIUM'''
