title = "NVD - CVE-2001-0935"
full_description = "Vulnerabilities /* wrap the words for CVSS v4 */ #nistv4Metric { word-wrap: break-word; } /*<![CDATA[*/ var vuln = { nistV4Present: false, cnaV4Present: false, nistV3Present: false, cnaV3Present: false, nistV2Present: true, cnaV2Present: false }; /*]]>*/ CVE-2001-0935 Detail Modified This CVE record has been updated after NVD enrichment efforts were completed. Enrichment data supplied by the NVD may require amendment due to these changes. Description Vulnerability in wu-ftpd 2.6.0, and possibly earlier versions, which is unrelated to the ftpglob bug described in CVE-2001-0550. Metrics CVSS Version 4.0 CVSS Version 3.x CVSS Version 2.0 NVD enrichment efforts reference publicly available information to associate vector strings. CVSS information contributed by other sources is also displayed. CVSS 4.0 Severity and Vector Strings: NIST: NVD N/A NVD assessment not yet provided. CVSS 3.x Severity and Vector Strings: NIST: NVD Base Score: N/A NVD assessment not yet provided. CVSS 2.0 Severity and Vector Strings: NIST: NVD Base Score: 7.5 HIGH Vector: (AV:N/AC:L/Au:N/C:P/I:P/A:P) Vendor Statements (disclaimer) Official Statement from Red Hat (09/27/2006) CVE-2001-0935 refers to vulnerabilities found when SUSE did a code audit of the wu-ftpd glob.c file in wu-ftpd 2.6.0. They shared these details with the wu-ftpd upstream authors who clarified that some of the issues did not apply, and all were addressed by the version of glob.c in upstream wu-ftpd 2.6.1. Therefore we believe that the issues labelled as CVE-2001-0935 do not affect wu-ftpd 2.6.1 or later versions and therefore do not affect Red Hat Enterprise Linux 2.1. References to Advisories, Solutions, and Tools By selecting these links, you will be leaving NIST webspace. We have provided these links to other web sites because they may have information that would be of interest to you. No inferences should be drawn on account of other sites being referenced, or not, from this page. There may be other web sites that are more appropriate for your purpose. NIST does not necessarily endorse the views expressed, or concur with the facts presented on these sites. Further, NIST does not endorse any commercial products that may be mentioned on these sites. Please address comments about this page to nvd@nist.gov. Hyperlink Resource http://www.novell.com/linux/security/advisories/2001_043_wuftpd_txt.html http://www.novell.com/linux/security/advisories/2001_043_wuftpd_txt.html Weakness Enumeration CWE-ID CWE Name Source NVD-CWE-Other Other NIST Known Affected Software Configurations Switch to CPE 2.2 CPEs loading, please wait. Denotes Vulnerable Software Are we missing a CPE here? Please let us know. Change History 3 change records found show changes CVE Modified by CVE 11/20/2024 6:36:28 PM Action Type Old Value New Value Added Reference http://www.novell.com/linux/security/advisories/2001_043_wuftpd_txt.html CVE Modified by MITRE 5/13/2024 9:19:27 PM Action Type Old Value New Value Initial CVE Analysis 1/01/2004 12:00:00 AM Action Type Old Value New Value Quick Info CVE Dictionary Entry: CVE-2001-0935 NVD Published Date: 11/28/2001 NVD Last Modified: 11/20/2024 Source: MITRE"
