title = "NVD - CVE-2001-0983"
full_description = "Vulnerabilities /* wrap the words for CVSS v4 */ #nistv4Metric { word-wrap: break-word; } /*<![CDATA[*/ var vuln = { nistV4Present: false, cnaV4Present: false, nistV3Present: false, cnaV3Present: false, nistV2Present: true, cnaV2Present: false }; /*]]>*/ CVE-2001-0983 Detail Modified This CVE record has been updated after NVD enrichment efforts were completed. Enrichment data supplied by the NVD may require amendment due to these changes. Description UltraEdit uses weak encryption to record FTP passwords in the uedit32.ini file, which allows local users who can read the file to decrypt the passwords and gain privileges. Metrics CVSS Version 4.0 CVSS Version 3.x CVSS Version 2.0 NVD enrichment efforts reference publicly available information to associate vector strings. CVSS information contributed by other sources is also displayed. CVSS 4.0 Severity and Vector Strings: NIST: NVD N/A NVD assessment not yet provided. CVSS 3.x Severity and Vector Strings: NIST: NVD Base Score: N/A NVD assessment not yet provided. CVSS 2.0 Severity and Vector Strings: NIST: NVD Base Score: 4.6 MEDIUM Vector: (AV:L/AC:L/Au:N/C:P/I:P/A:P) Vendor Statements (disclaimer) Official Statement from UltraEdit (03/06/2012) We include an option, by design, that allows the user to *not* save the password, and instead enter the password on a per FTP session basis. This would provide the highest level of security. If the user decides to have UltraEdit save the FTP password in the INI, it is encrypted for the benefit of the user moving their settings from one system to another. However, even with the highest level of encryption of the saved password, if the user decides to save their password in the INI, there will always be a level of vulnerability as a result of the users decision to save the password. References to Advisories, Solutions, and Tools By selecting these links, you will be leaving NIST webspace. We have provided these links to other web sites because they may have i