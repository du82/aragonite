["https://www.nvidia.com/en-us/data-center/grace-cpu"]
title = "NVIDIA Grace CPU and Arm Architecture | NVIDIA"
description = "The world’s first CPU for servers, purpose built for terabyte-scale accelerated computing."
full_description = "As models explode in complexity, accelerated computing and energy efficiency are becoming critical to meet the demands of AI. The NVIDIA Grace™ CPU is a groundbreaking Arm® CPU with uncompromising performance and efficiency. It can be tightly coupled with a GPU to supercharge accelerated computing or deployed as a powerful, efficient standalone CPU. The NVIDIA Grace CPU is the foundation of next-generation data centers and can be used in diverse configurations for different data center needs. The NVIDIA GB200 NVL2 platform brings the new era of computing to every data center, delivering unparalleled performance for mainstream large language model (LLM) inference, vector database search, and data processing. The NVIDIA GB200 Grace™ Blackwell Superchip combines two NVIDIA Blackwell Tensor Core GPUs and a Grace CPU. It can scale up to the GB200 NVL72—a massive 72-GPU system connected by NVIDIA® NVLink®—to deliver 30X faster real-time inference for large language models (LLMs). The NVIDIA GB200 NVL2 platform brings the new era of computing to every data center, delivering unparalleled performance for mainstream large language model (LLM) inference, vector database search, and data processing. The NVIDIA Grace Hopper™ Superchip combines the Grace and Hopper architectures using NVLink-C2C to deliver a CPU+GPU coherent memory model for accelerated AI and high-performance computing (HPC) applications. The NVIDIA Grace CPU Superchip uses the NVLink-C2C technology to deliver 144 Arm Neoverse V2 cores and 1 terabyte per second (TB/s) of memory bandwidth. NVIDIA Project DIGITS brings the power of Grace Blackwell to developer desktops. The GB10 Superchip, combined with 128GB of unified system memory, lets AI researchers, data scientists, and students work with AI models locally with up to 200 billion parameters. NVIDIA provides in-depth support for NVIDIA Grace with performance-tuning guides, developer tools, and libraries."
