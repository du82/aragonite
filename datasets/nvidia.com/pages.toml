["https://www.nvidia.com/en-us/ai-data-science/products/cuopt"]
title = "cuOpt | Decision Optimization | NVIDIA"
description = "Achieve world-record accuracy and performance to handle large-scale problems with millions of constraints and variables, save time, and reduce costs."
full_description = "Achieve world-record accuracy and performance to handle large-scale problems with millions of constraints and variables, save time, and reduce costs. NVIDIA® cuOpt™ is a groundbreaking optimization AI microservice excelling in fast decision optimization, including linear programming and mixed integer linear programming heuristics and VRP (Vehicle Routing Problems). It handles large-scale problems with millions of variables and constraints, enabling near real-time optimization, potentially saving millions of dollars. With 23 world-record benchmarks, cuOpt owns all of the recent world records on the largest routing benchmarks. It also accelerates state-of-the-art CPU linear programming techniques on Mittelmann’s benchmark, solving large-scale optimization problems with millions of variables and constraints. cuOpt uses GPU-accelerated logistics solvers relying on heuristics, metaheuristics, and optimizations to calculate complex vehicle routing problems with a wide range of constraints. cuOpt can be deployed in any data center or cloud. With support for distance and time matrices with asymmetric patterns, it can be seamlessly integrated with popular map engines. Faster on 60% of the Mittelmann LPOpt instances and more than 10X faster on 20% when compared to commercial SOTA. Consistent speedups of 8X ~ 5,607X on multi-commodity flow problems. Experience world-record performance, achieved across Li & Lim and Gehring & Homberger accuracy benchmarks. Route 1,000 packages in 10 seconds instead of 20 minutes (120X faster) with the same level of accuracy. Rerun models and adjust for changes like inoperable vehicles, traffic and weather disruptions, and the addition of new orders—all within service-level agreement (SLA) time constraints. Access a secure, production-ready microservice, as part of NVIDIA AI Enterprise, designed to deploy anywhere and accelerate time to value. See how NVIDIA cuOpt supports industry use cases and jump-start your AI development with curated examples."
year_published = 2025
