["https://www.nvidia.com/en-us/about-nvidia/careers/diversity-and-inclusion"]
title = "Diversity and Inclusion Support and Resources | NVIDIA"
description = "Tackling the world’s greatest challenges takes fresh, new ideas based on unique perspectives, backgrounds, and cultures. This is the diversity that fuels our innovation and creativity and unlocks endless opportunities for everyone who works to make them a reality.  Everyone has a voice. Everyone belongs."
full_description = "Tackling the world’s greatest challenges takes fresh, new ideas based on unique perspectives, backgrounds, and cultures. This is the diversity that fuels our innovation and creativity and unlocks endless opportunities for everyone who works to make them a reality. Everyone has a voice. Everyone belongs. We dedicate ourselves to building a just, decent, and inclusive company. We must be empathetic to the experience of underrepresented groups and act to make NVIDIA a place of opportunities. We do this because it is right and just, and we believe it will help make NVIDIA better. We want to attract the world's best people who reflect different perspectives to help us deliver life-changing breakthroughs. We’ve adapted our processes to let candidates meet with employees from their representative communities during their interview process, write more inclusive job descriptions, and boost our social inclusivity globally. “I felt welcomed from the very start and have the support and encouragement to succeed. No matter where you come from-,…you are part of one team.” — Manuel, Recruiting We strive to create an environment where underrepresented groups feel empowered. Through our CARE Allyship Program, we train our people to unlock the power of diversity and inclusion and take action to help others succeed. “The Allyship Program taught me how to be more attentive to the needs of underrepresented groups and how to create a space for people to be seen and heard.” — Thiru, Software NVIDIA has always been fearless about taking on new challenges, and we encourage and support employees who share the same values. There are endless opportunities at NVIDIA, and you have the opportunity to explore them all. We provide tailored mentoring programs, job-shadowing experiences, and leadership development opportunities. “NVIDIA has created the right conditions for me to thrive and do my life's work–elevating the employee experience through inclusion and belonging.” — Marc, Diversity, Inclusion, and Belonging"
year_published = 2025
clearnet = "https://www.nvidia.com/en-us/about-nvidia/careers/diversity-and-inclusion"
