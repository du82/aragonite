["https://www.nvidia.com/en-us/about-nvidia/legal-info/logo-brand-usage"]
title = "Logos & Brand Guidelines | NVIDIA"
description = "NVIDIA’s logo and other branded elements are key to our company’s unique identity and differentiation. These assets may not be used in any manner that isn’t expressly authorized in writing by NVIDIA."
full_description = "NVIDIA’s logo and other branded elements are key to our company’s unique identity and differentiation. These assets may not be used in any manner that isn’t expressly authorized in writing by NVIDIA. The NVIDIA logo is our primary brand identifier and the most often-used element of NVIDIA's visual identity. It’s our signature, so consistent and proper use is important. Usage of our logo also infers a partnership or endorsement, so following the guidance below is critical to ensure brand consistency across all touchpoints. Examples of approved logo usage: For co-branding with partner logos. When NVIDIA is a sponsor. In a group of logos alongside other companies (“logo garden”). In educational or research applications that use NVIDIA technologies and products. The NVIDIA logo must be represented as large and bold as possible. When faced with space limitations, these are the minimum sizing requirements to ensure the logo is legible. Use the full, two-color logo wherever possible. One-color versions are available for use with the NVIDIA green background and if the two-color options are not reproducible. Ensure that the color profile matches the application (digital vs. print). Use a minimum contrast ratio of 1:10 against the background when using the NVIDIA logo. The NVIDIA logo should always have a minimum area of clear space. This ensures that the logo is clearly readable when surrounded by text, headlines, images, or other logos. Clear space on all sides should be at least the height of the “n” of the NVIDIA logo.. This is a minimum, but additional space is welcome."
