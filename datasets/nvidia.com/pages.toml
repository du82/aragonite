["https://www.nvidia.com/en-us/ai-data-science/products/riva"]
title = "Riva | Speech and Translation AI | NVIDIA"
description = "NVIDIA Riva is a set of GPU-accelerated multilingual speech and translation microservices for building fully customizable, real-time conversational AI pipelines."
full_description = "Build and deploy fully customizable multilingual speech and translation AI for your large language model and retrieval-augmented generation based applications. NVIDIA® Riva is a set of GPU-accelerated multilingual speech and translation microservices for building fully customizable, real-time conversational AI pipelines. Riva includes automatic speech recognition (ASR), text-to-speech (TTS), and neural machine translation (NMT) and is deployable in all clouds, in data centers, at the edge, and on embedded devices. With Riva, organizations can add speech and translation interfaces with large language models (LLMs) and retrieval-augmented generation (RAG) to transform chatbots into engaging, expressive multilingual assistants and avatars. Achieve high multilingual transcription and translation accuracy, and provide out-of-the-box, expressive, professional female and male voices with state-of-the-art models pretrained on thousands of hours of audio on NVIDIA supercomputers. Customize across ASR pipelines for different languages, accents, domains, vocabulary, and context for the best possible accuracy for your use case and across TTS pipelines for the brand voice and intonation you want. Provide consistent experiences to hundreds of thousands of concurrent users with higher inference performance than existing technology, and deploy anywhere—in data centers, on premises, in the cloud, at the edge, or in embedded devices. Accelerate the development and deployment of production-grade, multilingual, voice-enabled AI applications with NVIDIA AI Enterprise, an end-to-end, cloud-native software platform for enterprise-grade secure and stable generative AI. Experience new ASR, TTS and NMT microservices now available—designed to provide optimized AI inference for speech and translation AI. This includes Parakeet models that deliver recording setting ASR accuracy and performance. See how NVIDIA AI supports industry use cases, and jump-start your speech AI development with curated examples."
