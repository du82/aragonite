["https://www.nvidia.com/en-us/autonomous-machines/intelligent-video-analytics-platform"]
title = "Metropolis - Video Analytics & Applications | NVIDIA"
description = "Metropolis is an intelligent video analytics platform that makes it easier and more cost effective for enterprises, governments, and integration partners to leverage world-class AI-enabled solutions to improve critical operational efficiency and safety problems"
full_description = "NVIDIA Metropolis is an application framework, set of developer tools, and ecosystem of companies that brings visual data and AI together to improve operational efficiency and safety across a variety of industries. It helps make sense of data created by trillions of sensors for some of the world’s most valuable physical transactions. These include frictionless retail, streamlined inventory management, traffic engineering in smart cities, optical inspection on factory floors, patient care in healthcare facilities, and more. Take advantage of the Metropolis developer tools and ecosystem to create, deploy, and scale AI and IoT applications from the edge to the cloud. Experience greater performance and scalability using NVIDIA DeepStream, TAO Toolkit, microservices, generative AI, and NVIDIA® CUDA-X™ acceleration libraries. Explore the full set of NVIDIA Metropolis developer tools to supercharge your AI-powered video analytics development and deployment efforts. The NVIDIA AI Blueprint for video search and summarization helps you build video analytics AI agents that let industrial operators communicate with their infrastructure through search and summarization of live or archived video sensor data. It integrates vision language models (VLMs) like NVIDIA Cosmos Nemotron VLMs, large language models (LLMs) like NVIDIA Llama Nemotron LLMs, and NVIDIA NIM™ inference microservices to deliver new levels of collaboration. The “Mega” Omniverse Blueprint offers enterprises a reference architecture of NVIDIA-accelerated computing, AI, and Omniverse™ technologies to develop and test digital twins. You can use it with your own software to build AI-powered robot brains that drive robots, Metropolis perception from cameras, equipment, and more for continuous development, testing, and optimization. Tap into a powerful collection of Metropolis APIs and microservices specifically built to fast-track development and deployment of vision AI applications on the NVIDIA Jetson™ edge-AI platform."
year_published = 2025
