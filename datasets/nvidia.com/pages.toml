title = "Corporate Sustainability | NVIDIA"
description = "Our innovations in AI and accelerated computing are setting new standards for environmental responsibility while powering a greener, more sustainable future."
full_description = "Our innovations in AI and accelerated computing are setting new standards for environmental responsibility while powering a greener, more sustainable future. NVIDIA Blackwell GPUs are generally 20X more energy efficient than traditional CPUs for certain AI and high-performance computing (HPC) workloads. NVIDIA DPUs can significantly reduce power consumption by up to 25% by offloading essential data center networking and infrastructure functions from less efficient CPUs. In FY24, we increased the amount of our renewable electricity use to 76%. This was made possible through on-site renewables and investing in purchasing utility renewable electricity tariffs, energy attribute certificates, and purchase power agreements. We’re working with companies worldwide to apply AI’s revolutionary capabilities to save energy and adapt to climate change."
