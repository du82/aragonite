["https://www.nvidia.com/en-us/about-nvidia/careers/life-at-nvidia"]
title = "Life, Culture, Career at  NVIDIA"
description = "NVIDIA has a commitment to make sure its employees have good mental and physical health–in order for us to do our best work."
full_description = "We’re all about doing what’s never been done. It starts with hiring diverse, brilliant, passionate people, then creating an empowering environment where they have the support and inspiration to help take on the world's greatest challenges–together. Explore NVIDIA’s body of work. Meet NVIDIANs doing their life’s work on the NVIDIA Life blog. NVIDIA has a commitment to make sure its employees have good mental and physical health–in order for us to do our best work…It's part of what defines us as NVIDIA employees. It allows us to accept that we are human, not robots, not data points, but human compassion. — Mike, Packaging Development We don’t fall back on policy, trends, or norms. If it’s the right thing to do for our employees–for your families, for the work–we find a way to make it happen. Always with compassion and respect. It’s a commitment to supporting our team holistically, not just as employees, but as humans. Take care of yourself and your family, then bring your whole self to work to do the work that you love. Every day feels like the first day of school—it’s fun and there’s always something new. At NVIDIA, you can be authentic, professional, and still disagree and have different thoughts NVIDIANs are able to do their life’s work here because they know they’ll be taken care of in the ways that matter most. We focus on programs that look after you and your family’s physical, emotional, and financial well-being. We also work hard to anticipate what our employees will need at every stage of life—from dealing with student debt to caring for aging parents or building a family. Our ESPP is one of the best in the industry, delivering more than $300 million in value to our employees and interns last year alone. We support giving back in ways and to the causes most meaningful to you. All employees and interns receive up to $10,000 each year to match personal financial and volunteer time donations made to eligible charities. NVIDIA has one of the n