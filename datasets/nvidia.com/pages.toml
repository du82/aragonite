full_description = "Jetson Xavier NX Series Introducing the powerful NVIDIA Jetson Xavier NX 16GB module. Shop all Jetson Xavier NX Products The Jetson Xavier NX enables AI at the edge with powerful computing performance, while keeping the small form factor of the Jetson Nano. This makes it possible to deploy containerized Azure solutions with AI acceleration at scale for applications like processing multiple camera feeds, more sophisticated robotics applications, and edge AI gateway scenarios. — Moe Tanabian, General Manager of Azure Edge Devices, Microsoft NVIDIA’s architectural ability to leverage its AI software technology from multiple industries, from the data center to its Jetson AI edge solutions, is a dramatic accelerator for the embedded and robotics world. The embedded and robotics world is about to transform from fixed function software devices to modern, software-defined computers. — Janakiram MSV, Analyst, Janakiram & Associates The NVIDIA Jetson Xavier NX allows us to get higher performance within a tighter size and power budget, enabling innovative development of compact drones for a variety of practical applications. We believe the Jetson platform with cloud-native support is an important new development to help build and deploy future generations of autonomous machines. — Sertac Karaman, Associate Professor of Aeronautics and Astronautics, Massachusetts Institute of Technology NVIDIA's embedded Jetson products have been accelerating the research, development, and deployment of embedded AI solutions on Lockheed Martin's platforms. With Jetson Xavier NX's exceptional performance, small form factor & low power, we will be able to do more processing in real-time at the edge than ever before. — Lee Ritholz, Director & Chief Architect Applied Artificial Intelligence, Lockheed Martin In a world where AI chips are announced on what seems like a daily basis, I believe NVIDIA raised the bar with its Jetson Xavier NX —showing that exceptional performance at s