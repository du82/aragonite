full_description = "Effective April 30, 2024 Thank you for your interest in joining our team. NVIDIA collects personal information (“Recruiting Data”) as part of our career application process, and this Privacy Policy for NVIDIA Career Applicants (“Applicant Privacy Policy”) details what information we collect, and how we use that information. This Applicant Privacy Policy applies only to our recruiting process. Please refer to our NVIDIA Privacy Policy for information on how we collect and process data for specific NVIDIA services and products. We collect Recruiting Data for recruitment, assessment, and hiring purposes. Categories of information we may collect (where permitted by applicable law) include: RECRUITMENT Personal contact information such as your name, phone number, email address, and mailing address; Demographic information (with your consent) such as race/ethnicity, gender (male/female/decline to state/diverse), and veteran status; Education information, such as current or past schools attended; and Inferences such as interests, preferences, and certain demographic information based on other personal information we collect and the interactions we have with job applicants. ASSESSMENT Education background such as schools attended and degrees obtained; Internship and/or work history; and Other information provided by you or collected during the interview process, including feedback from interviews. HIRING Citizenship information (unless prohibited in the relevant jurisdiction); Government-issued identity numbers; Results of background checks, which include identity verification, education history, work history, and criminal history, to the extent such checks are permitted in the relevant jurisdiction; For certain positions such as those involving finance, financial credit checks, to the extent such checks are permitted in the relevant jurisdiction; and Contact information for work references that you have identified, and feedback from those references regarding your work history and performance, to the extent such checks are permitted in the relevant jurisdiction."
