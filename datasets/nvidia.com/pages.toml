["https://www.nvidia.com/en-us/ai-data-science/foundation-models"]
title = "AI Foundation Models and Endpoints | NVIDIA"
description = "NVIDIA AI Foundation models include community and NVIDIA built, pre-trained generative AI models that enable enterprises to create custom models faster."
full_description = "NVIDIA AI Foundation models are community- and NVIDIA-built models and are optimized to deliver the best performance on NVIDIA accelerated infrastructure. Enterprises can customize and deploy these models with NVIDIA NIM™ microservices and streamline the transition to production AI. Explore the NVIDIA API catalog and experience the models directly from a browser or connect to NVIDIA-hosted endpoints and start POC for free. Deploy NVIDIA AI Foundation models at scale with NVIDIA NIM—a set of easy-to-use microservices that ensure seamless scalable inference, on-premises or in the cloud, leveraging industry-standard APIs. The development of physical-AI-embodied systems such as robots and autonomous vehicles is accelerated with the new NVIDIA CosmosTM platform. The NVIDIA AI Foundry service—a collection of NVIDIA AI Foundation Models, NVIDIA NeMo™ framework and tools, and NVIDIA DGX™ Cloud gives enterprises an end-to-end solution for creating custom generative AI models. Try leading foundation models, including Llama 2, Stable Diffusion, and NVIDIA’s Nemotron-3 8B family, optimized for the highest performance efficiency. Customize models on DGX Cloud, a serverless AI-training-as-a-service platform for enterprise developers. Connect your applications to API endpoints and test their real-world performance running on a fully-accelerated stack. NVIDIA AI Foundation Models include leading community- and NVIDIA-built models to support various use cases, including content generation, image creation, drug discovery, and IT service automation. Build AI chatbots that connect with your custom LLMs and knowledge bases to accurately and naturally answer domain-specific questions in real time. Generative AI is impacting every industry today—from IT services and telecommunications to finance and retail. Putting generative AI into practice requires enterprises to have access to an AI foundry to build custom models using proprietary data and deploy them at scale. See how the world’s leading organizations are serving their customers with NVIDIA AI."
