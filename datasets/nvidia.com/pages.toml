title = "Trustworthy AI For A Better World | NVIDIA"
description = "We believe AI should respect privacy and data protection regulations, operate in a secure and safe way, function in a transparent and accountable manner, and avoid unwanted biases and discrimination. We are committed to safe and trustworthy AI, in line with the White House Voluntary Commitments and other global AI Safety initiatives."
full_description = "We believe AI should respect privacy and data protection regulations, operate in a secure and safe way, function in a transparent and accountable manner, and avoid unwanted biases and discrimination. We are committed to safe and trustworthy AI, in line with the White House Voluntary Commitments and other global AI Safety initiatives. AI should comply with privacy laws and regulations, and meet societal norms for personal data and information privacy. Make AI technology understandable to people. Explain, in non-technical language, how an AI system arrived at its output. Trustworthy AI principles are foundational to our end-to-end development and essential for the technical excellence that enables partners, customers, and developers to do their best work. We are building data factories for generative AI services, tools to curate and validate unbiased datasets for computer vision, libraries for scaling natural language processing data for large language models, groundbreaking security features like confidential computing, and innovations like open-source techniques for model alignment with human feedback. Trustworthiness is a fundamental property of our technology. — Jensen Huang, NVIDIA founder and CEO Our AI research is focused on developing algorithms and systems that can augment human capabilities, solve complex problems, and improve efficiencies across industries. We work to maintain our guiding principles of privacy, transparency, nondiscrimination, and safety and security in all research practices and methodologies. Hear from the experts and government leaders paving the way for AI regulation and trustworthiness. Explore NVIDIA GTC Trustworthy AI sessions curated to help companies identify and address potential obstacles to developing their own initiatives."
