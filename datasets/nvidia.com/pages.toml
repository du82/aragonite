["https://www.nvidia.com/en-us/ai-data-science/solutions/speech-ai"]
title = "What is Speech AI? | NVIDIA Glossary"
description = "Speech AI is a subset of conversational AI and includes automatic speech recognition (ASR) for converting spoken language into text and text-to-speech (TTS) for transforming written words into a natural-sounding voice."
full_description = "Speech AI is a subset of conversational AI and includes automatic speech recognition (ASR) for converting spoken language into text and text-to-speech (TTS) for transforming written words into a natural-sounding voice. A speech AI system includes two main components: An automatic speech recognition (ASR) system, also known as speech-to-text, speech recognition, or a voice recognition system. A text-to-speech (TTS) system, also known as speech synthesis or an AI voice generator. The first step in a typical ASR pipeline is extracting useful features from the input audio. This is often done using a Mel spectrogram, which represents the strength of various frequencies in the audio over time on a logarithmic scale. The Mel spectrogram is then passed to an acoustic model that predicts the probability of each character. The decoder then takes these character probabilities at each time step and converts them into a sequence of words. To improve the accuracy of ASR models, a language model is employed to predict the likelihood of a sentence and correct errors made by the acoustic model. Finally, a punctuation and capitalization model enhances the readability of the text, and inverse text normalization rules are applied to format the text correctly (e.g., converting “ten o’clock” to “10:00”). The first stage of the TTS pipeline involves text preparation. This process includes text analysis, recognizing and analyzing expressions like dates, monetary amounts, and airport codes, as well as text normalization, which converts written text into its spoken form such as expanding abbreviations (e.g., “10 kg” to “ten kilograms”). The next step is text encoding, where each character is converted into a numerical value, and the text is transformed into an encoded vector for input into a spectrogram generator. After encoding, pitch and duration predictors estimate how long each phoneme should be held and the pitch at which it should be spoken, ensuring natural prosody in the generated speech. This information, along with the encoded text, is then fed into a spectrogram generator, which converts the text into Mel spectrograms. Finally, these spectrograms are passed through a vocoder model that generates natural-sounding speech."
year_published = 2025
