title = "Deploy Generative AI with NVIDIA NIM | NVIDIA"
description = "Explore the latest optimized AI models, connect AI agents to data with NVIDIA NeMo, and deploy anywhere with NVIDIA NIM microservices."
full_description = "Explore the latest optimized AI models, connect AI agents to data with NVIDIA NeMo, and deploy anywhere with NVIDIA NIM microservices. Cosmos World Foundation Models generate physics-aware videos and world states for physical AI development. Cosmos Nemotron VLMs enable querying images and videos from the physical or virtual world. Llama Nemotron LLMs advance the best open-source models with the latest techniques from NVIDIA for unparalleled performance. Work with your favorite LLM programming frameworks, including LangChain and LlamaIndex, and easily integrate the latest AI models into your applications. Data powers modern enterprise applications. Connect AI agents to enterprise data at scale with an AI query engine that uses retrieval-augmented generation (RAG) to equip employees with instant, accurate institutional knowledge. Everything you need to build impactful agentic AI applications. Each blueprint includes NVIDIA NIM™, NeMo, and partner microservices, one or more AI agents, sample code, customization instructions, and a Helm chart for deployment. Part of NVIDIA AI Enterprise, NVIDIA NIM is a set of easy-to-use inference microservices for accelerating the deployment of foundation models on any cloud or data center and helping to keep your data secure. Get NIM up and running with the optimal runtime engine based on your NVIDIA-accelerated infrastructure. Seamlessly deploy containerized AI microservices on any NVIDIA accelerated infrastructure, from a single device to data center scale. Rely on production-grade runtimes, including ongoing security updates, and run your business applications with stable APIs backed by enterprise-grade support. Lower the operational cost of running models in production with AI runtimes that are continuously optimized for low latency and high throughput on NVIDIA-accelerated infrastructure. NVIDIA NIM provides optimized throughput and latency out of the box to maximize token generation, support concurrent users at peak times, and improve responsiveness."
