["https://www.nvidia.com/en-us/about-nvidia/privacy-policy"]
title = "NVIDIA Privacy Policy"
description = "NVIDIA is committed to respecting your privacy. This Privacy Policy applies to our world-wide family of NVIDIA-operated websites, apps, and products."
full_description = "We’re committed to supporting your privacy rights. Control your personal data. You have the right to see the data we have collected, take it with you, make corrections, withdraw consent for future uses, opt out of sales and sharing, or erase your data all together at any time. Expect non-discrimination. You have the right to non-discriminatory treatment, regardless of whether you allow us to process your data. Protect your privacy—and your choices. If you feel we’ve failed in any way, you have the right to lodge a complaint with a data protection authority in your region. When we use the term “NVIDIA” we’re referring collectively to NVIDIA Corp. in the United States and to our subsidiaries and affiliates globally. If you have an NVIDIA account or have signed up for our content with your email address, you may visit privacy.nvidia.com to exercise your privacy rights. Otherwise, you can contact us directly at privacy@nvidia.com. We use your NVIDIA account or your registered email address to verify your identity. NVIDIA does not use, sell, or share “sensitive personal information” as defined by California law. However, our sharing of non-sensitive data with advertising providers may qualify as the sale of personal data or the sharing of personal data for purposes of targeted advertising. From time to time, we may launch certain products or features (e.g., demos or beta technologies) that involve collection of personal data that falls outside the scope of this privacy policy. In those instances, we will provide you with additional privacy-related information and disclosures at the time of collection. The additional privacy disclosures will supplement this Privacy Policy and govern how we may process the personal data collected at that time. If you’ve consented to receive marketing communications or recommendations, we share hashed details about your identity with third-party ad providers such as Google to serve interest-based ads to you and others. These hashed details may include your name, email, phone number, job title, organizational business affiliations, zip code, country, and social media handles. Your information is shared in hashed form only, which means that your details are irreversibly converted to a fixed-size string of characters such as “0890f456684a70f1a9f1dbcee40c1fe847b76f338581a9a1d9202c76b1c175f4” (which is the SHA-256 hash of “NVIDIA”). Sharing information in hashed form means that third-party ad providers can only identify you if they already have the information we have shared and have hashed it themselves to match the hashed version we are sharing. Sharing information in hashed form is a way of identifying information that both parties have without sharing the information itself. You can opt out of data sharing for interest-based advertising at any time by visiting our Privacy Center or by enabling an opt-out preference signal."
year_published = 2025
