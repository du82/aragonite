["https://www.nvidia.com/en-us/ai/cosmos"]
title = "NVIDIA Cosmos | Physical AI Development with World Foundation Models (WFM)"
description = "NVIDIA Cosmos is a platform of state-of-the-art generative world foundation models, advanced tokenizers, guardrails, and an accelerated data processing and curation pipeline built to accelerate the development of physical AI."
full_description = "NVIDIA Cosmos™ is a platform of state-of-the-art generative world foundation models (WFM), advanced tokenizers, guardrails, and an accelerated data processing and curation pipeline built to accelerate the development of physical AI systems such as autonomous vehicles (AVs) and robots. Cosmos provides developers with open and easy access to highly performant world foundation models and data pipelines, making physical AI development accessible to all. A family of pre-trained models purpose-built for generating physics-aware videos and world states for physical AI development. Learn more about model architectures, development resources, and availability here. Autoregressive and diffusion models for Text-to-World and Video-to-World generation, available in parameter sizes ranging from 4 to 14 billion to suit various needs. 12-billion-parameter upsampling model for refining text prompts, delivering enhanced accuracy and detail in generated outputs. 7-billion-parameter model designed for decoding video sequences, optimized for augmented reality applications. Pre-guard to filter brands, unsafe content, and harmful prompts within Cosmos generated outputs. Post-guard to remove questionable scenarios. Guardrail to blur human faces. Digital watermarks on synthetic videos generated from Preview APIs on NVIDIA API catalog. NVIDIA is working with the robotics and autonomous vehicle ecosystem to develop a set of benchmarks to reflect the unique requirements of physical AI applications from world foundation models. Cosmos benchmarks are designed to evaluate the next generation of world models with advanced criteria like 3D consistency and physics alignment, essential for robotics and autonomous systems. Compared to VideoLDM (VLDM), a baseline generative model for video synthesis, Cosmos WFMs excel in geometric accuracy with lower Sampson error and better temporal stability. Benchmarks also evaluate WFMs based on physical behaviors like gravity and collision dynamics. Cosmos WFMs consistently outperform VLDM on visual consistency, achieving up to 14X higher pose estimation success rates. While diffusion models deliver higher fidelity out of the box, autoregressive models deliver excellent performance for custom models."
