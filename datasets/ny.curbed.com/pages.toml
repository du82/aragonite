title = "50 small ways to make NYC a better place - Curbed NY"
description = "From supporting local businesses and getting to know your neighbors to joining your local community board, here’s how you can make a difference in your neighborhood, borough, and the greater city."
full_description = '''Part of The beginner’s guide to New York City When it comes to making change at the local level, the smallest actions can spur the biggest changes—and in New York City, where the options for helping your fellow citizens can be downright overwhelming, starting small is often the best in-road to a larger commitment to activism. With that—and the larger desire among our fellow New Yorkers to get involved—in mind, we present these small, but substantial, ways that you can help make NYC a better place. 1. Make calls to your legislators. Regardless of your political affiliation, it’s important to hold your elected officials accountable for the promises that got them in office in the first place. And yes, a phone call is the best way to do it: Calling about important issues—whether it’s something at the federal level or something related just to your neighborhood—will let your local official know that their constituents are engaged and aware, and might just put a fire under them to get things done. The New York Times has more on why this is such a big deal. 2. Donate, don’t discard, your old clothes. We’re as big of devotees to The Life-Changing Magic of Tidying Up as anyone, but what do you do with all of those clothes once the Kondo-ing is over? Find an organization in need: Shelters like the Bowery Mission can redistribute clean clothing to homeless New Yorkers. If you’re a woman and have professional duds to discard, give them to Dress for Success. And in the wintertime—when the need for warm clothes is greatest—New York Cares accepts and distributes gently used coats during its annual Coat Drive. (That organization also keeps a list of shelters that accept gently used clothing.) You can also bring them to a GrowNYC Greenmarket, which will either distribute them to places in need or use them for purposes like rags or fiber filling. 3. Recycle. There’s no excuse not to—pretty much anything you might need to dispose of can be recycled in some way. Food scraps? Those can turn into compost. Old electronics, like computers or cell phones? Plenty of organizations, like the Lower East Side Ecology Center and the Department of Sanitation, will take those. Clothes? Covered. Furniture? Yup. GrowNYC even hosts Stop ’n’ Swap events in every borough, where people can bring small items (games, housewares, books) that they no longer need. (Here’s a refresher on what you can recycle through DSNY.) A post shared by NYC zerowaste (@nyczerowaste) on Mar 25, 2015 at 7:20am PDT 4. Compost. Helping reduce the amount of waste produced in New York City starts at home—and in your own refrigerator. The NYC Compost Project has food scrap drop-off sites in all five boroughs, and you can use this handy map to locate your closest location. Want to one-up your composting commitment? Consider opening your own food scrap drop-off site in your neighborhood. 5. Set your Amazon account to donate to a NYC charity. This is one of the simplest things you can do: The AmazonSmile program lets you choose from nearly a million charities, and each time you shop on Amazon, the AmazonSmile Foundation will donate 0.5 percent from the purchase price to the one you picked. At press time, there were literally thousands of New York organizations—Picture the Homeless, Gilda’s Club, and New York City Rescue Mission are just a few—in the program, so pick your favorite and do some good the next time you buy something. 6. Stay informed about local news. It’s important to stay on top of national news, but to get a sense of what’s changing in your immediate surroundings, make local papers and blogs a part of your daily media diet. While the closure of outlets like DNAInfo and the Village Voice has hurt the city’s media landscape in recent years, there are still plenty of outlets helping New Yorkers stay informed: hyperlocal blogs (West Side Rag, EV Grieve, Welcome2TheBronx, etc.), tabloids (the Post and the Daily News), local papers (Brooklyn Daily Eagle, Queens Chronicle, Staten Island Advance, etc.) digital outlets (City Limits, The City, City and State, etc.) and more. Oh, and Curbed NY, of course. 7. Learn about the city. Knowing the history of New York City—the good, the bad, and the ugly—will help you as you begin to become more involved in activism. There’s no shortage of books devoted to every aspect of the city’s past and present, so no matter your preferred cause—whether it’s fighting for affordable housing, against displacement, or for safer streets—you’ll find something that will help you understand it better. Need somewhere to start? This list will help. Some of our favorites include the obvious—The Death and Life of Great American Cities, The Power Broker, Up in the Old Hotel—along with newcomers like Justin Davidson’s Magnetic City, or Greg Goldin and Sam Lubell’s Never Built New York. 8. Bring your old electronic equipment to an e-waste recycling center. State and city laws prevent electronic waste from being disposed of with regular waste, but some retailers, like Best Buy and Staples, will accept electronics, along with recycling centers like the Lower East Side Ecology Center. GrowNYC also holds recycling events throughout the year. If you live in a building, work with your landlord to see if the property qualifies to participate in the Department of Sanitation’s free program, e-cycleNYC. 9. Remember reusable bags. Some fun facts about plastic bags, courtesy of the Department of Sanitation: They’re non-recyclable and end up rotting away in landfills for centuries, we use more than 10 billion of them every year, and disposing of ’em costs New York City a whopping $12 million every year. But that will soon change. In 2019, New York became the third state to ban single-use plastic bags after California and Hawaii. Gov. Andrew Cuomo signed the statewide ban into law in 2019, and come March 1, that landmark change will take effect. If you haven’t already begun using reusable bags, don’t wait until spring, start cutting down your use of landfill-clogging bits of trash now. Stuff a reusable alternative in your purse or backpack (Baggu has plenty of stylish ones), snag a cheap one at Trader Joe’s, or sign a Zero Waste Pledge to get one for free from the Department of Sanitation. 10. Donate money. You’re not always going to have the time or energy to be involved directly—and that’s okay. If you don’t have time, but do have the financial stability to donate money, do that. It’s especially useful to donate to nonprofits in the city or in your community, which may not get as much national attention as organizations like the ACLU, but need funding to continue their work. 11. Pick up a piece of trash. Don’t be a litterbug—that’s obvious. But it’s also good to take things a step further: Pick up a piece of litter that’s floating around. We promise it won’t kill you. If you really want to make an impact, volunteer with organizations like Love Your Block, the New York Restoration Project (NYRP), or NYC Parks to pitch in with efforts to keep our city beautiful. 12. Get to know your neighbors. New Yorkers may have the unfortunate (and undeserved) reputation of not being particularly friendly, but that doesn’t need to hold true—especially in your building. It takes as little effort as baking a batch of cookies to let your neighbor know that there’s a friendly face close by. Don’t be afraid to take the first step, and know that your neighbor is probably feeling just as awkward as you are. If that goes well, consider going a step further: Organize a potluck for your floor or your building, depending on how much space you have. 13. Organize a block party. What better way is there to get to know your neighbors than by bringing them together at a big, fun box social? Get a permit from the city, spread the word, and get planning. 14. Shop at your local Greenmarket. Yes, going to Trader Joe’s may be more convenient (though is it really?), but there are plenty of benefits to shopping at your local Greenmarket. Not only will you choose from foods that are fresher and healthier (and, in many cases, less expensive than you’d find at a chain grocer), you’ll also support small family farms who work hard to provide the city with access to locally grown, seasonal products. Not sure how to find a Greenmarket near you? Start here. 15. Support small businesses… Too many of the city’s independent shops have closed due to competition from larger corporations, rising rents, and dwindling clientele. Supporting local businesses keeps the city from turning into a huge shopping mall and helps communities flourish. And when possible, patronize businesses owned by women, people of color, immigrants, and LGBTQ New Yorkers—because New York’s diversity is one of the many things that makes it great. 16. ...and don’t forget to nominate them for NYC’s Love Your Local initiative. Most New Yorkers have their favorite corner deli, or the coffee shop they stop at before their morning commute. And now, you can send some extra love to those businesses. The city’s Department of Small Business Services launched a program that lets you add your favorite local business to a citywide map; some of those can qualify for grants to make improvements to their store or get expert advice. 17. Attend neighborhood meetings. The best way to find out about the goings on in your neighborhood is to attend the dozens of public meetings organized each month by your local community board. They’re easy enough to find on the boards’ websites, and you’ll soon discover that you might be one among many trying to get more green space or stop a huge development from overwhelming your neighborhood. 18. Join your local community board. One of the best ways to effect change in your neighborhood is to become a member of your local community board—all it takes is reaching out to your City Council member or borough president. Board members serve one-year terms, or staggered two-year terms; they typically reside in or have a business in the neighborhood and are appointed by the borough president. Check out this handy explainer for all the details. A post shared by MillionTreesNYC (@milliontreesnyc) on May 21, 2014 at 6:56am PDT 19. Request a tree for your block. Studies have shown that living near an abundance of green space can have a measurable impact on your overall happiness. And New York City's reputation as a concrete jungle doesn't mean that you can't reap those benefits—the Parks Department's "Request a Street Tree" program lets anyone ask for a tree to be planted on their block, provided it's not being requested for private property. (And once your tree arrives, don't forget to take care of it!) 20. Smile at people. New Yorkers have a reputation for being abrasive, so help shake the stereotype in a way that’s free and only takes a second: Smile at people. You don’t have to grin at everyone who passes by—and you definitely don’t have to listen to low-level street harassers—but sometimes, a smile and a hello to the cashier at your favorite coffee shop, or the person waiting behind you in line, can brighten their day and make you feel like a better person in the process. 21. Be kind to the homeless. Though it’ll take a massive effort to end homelessness in New York City, there are small things that you can do to empower those who need help. The first thing is to remember that people experience homelessness for myriad reasons—so leave the stereotyping or judgmental attitudes behind. Help out in small ways, like donating to organizations that combat homelessness in New York (such as Coalition for the Homeless or the Ali Forney Center). If you have more time to invest, volunteer at a shelter, or simply reach out to emergency services if you see someone in need of help. (The city discourages giving money to panhandlers, but we’re not going to tell you not to do that, too.) 22. Patronize the places that give New York its flavor. Every time a beloved New York City institution closes—places like Edison Cafe, Lincoln Plaza Cinemas, or Coffee Shop—many inevitably lament the fact that they didn’t frequent those places more often. So this one is obvious: Ensure that the businesses that give New York its character stick around by actually patronizing them. Don’t just say you’re going to get pizza at Di Fara, or pick up your next subway read from Three Lives & Company—actually do it, and help keep mom and pops, an essential part of the fabric of NYC, in business. View this post on Instagram A post shared by Chronicle Books (@chroniclebooks) on Dec 9, 2017 at 9:12am PST 23. Give someone directions. Sometimes the simplest thing you can do to make New York a better place is to make someone feel more welcome here. One easy way to do that? Give a tourist directions. (How do you find them? Look for the folks with a map who seem lost—it’s that easy.) It’ll make you feel better—we promise—and it’ll show those unfamiliar with our fair city that New York values are the best values. 24. Make a Little Free Library. Creating a Little Free Library is an easy way to promote neighborliness, curiosity, and literacy in your community. The Little Free Library website gives step-by-step instructions about how to start this take-one, give-one book exchange in your neighborhood: For starters, pick a high-trafficked spot and designate someone to look after the library. Want to know where else in New York, or the world, there are other Little Free Libraries? Check out the world map. 25. Create a pop-up park for PARKing Day. PARKing Day is about reclaiming space in the city allotted for cars and other forms of private transportation for more equitable use as a public park—even if only for two hours. During PARKing Day, on-street metered parking spaces are transformed (with an okay from the city) into an outdoor respite. How you use and decorate your PARKing Day space is up to you—be creative! 26. Document the city. Not everyone is going to become the next Humans of New York, but one of the best ways to get to know the city—and your fellow New Yorkers—is to start snapping photos. Even better, share them on Instagram, where there are thousands of photographers bonding over their shared love of the five boroughs. Once you start snapping pictures of everyday life, there’s no telling what you’ll find or who you’ll meet. 27. Familiarize yourself with a part of NYC that you don’t know. One of the best ways to feel more connected to the five boroughs is to explore everything they have to offer, from the big touristy stuff to the tiny neighborhoods in the outer reaches of the city. Even if you think you know NYC well, there’s bound to be a spot you’ve never visited before—so take yourself on a trip within the city limits. Go to the end of a subway line and walk around, or explore a park that you’ve never been to before. You’ll come away from that journey having learned something new, and with a greater appreciation for this huge, wonderful city. 28. Make a point to volunteer regularly'''
