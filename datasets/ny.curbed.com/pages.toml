title = "Best books about New York: 50 essential NYC books - Curbed NY"
description = "Consider this list a starting point for anyone who wants to understand how New York became, well, New York."
full_description = '''If you buy something from a Curbed link, Vox Media may earn a commission. See our ethics policy. Part of The beginner’s guide to New York City There are hundreds, if not thousands, of books about New York City—broad overviews of its history, deep dives into topics like gentrification or architecture, novels that capture a particular moment in time, the list goes on. And in coming up with this list, which narrows that vast assemblage down to just 50 essential books, our goal was simple: to provide a starting point for anyone who wants to understand how New York became, well, New York. We tasked our editors with choosing the books no New York bookshelf should be without—the ones that have informed their understanding of the city’s past, present, and future. We also asked city experts—architects, critics, authors, and urbanists among them—to give their recommendations. The resulting list is not comprehensive, but it is diverse, with fiction, non-fiction, children’s books, and more represented. We hope you enjoy—and if your favorite is not on the list, chime in with your picks in the comments. And one thing to note: We’ve linked to Amazon here for convenience’s sake, but we of course recommend seeking these out at one of New York City’s amazing independent bookstores: the Strand, Three Lives & Company, Greenlight, Community Bookstore, Word, Book Culture… we could go on, but you get the idea. 1. The Encyclopedia of New York City edited by Kenneth T. JacksonThe title is self-explanatory: This massive tome is a truly comprehensive reference guide to everything you need to know about New York City, from Berenice Abbott to Louis Zukofsky—literally. 2. Up in the Old Hotel by Joseph Mitchell“What a gift. That is what I thought after I read Up in The Old Hotel. Not just a gift to me, but to the history of New York City. The way Joseph Mitchell writes is batshit wonderful, funny, spare, and kind. Mitchell’s New York has cash registers made of soup bowls, makeshift bludgeons of rolled up magazines, and above all characters. The details he shares could easily have been lost forever, instead, they are here for all time to transport and make any New Yorker’s heart swell.” —Tamara Shopsin, illustrator, line cook, and author of Arbitrary Stupid Goal 3. A History of New York in 101 Objects by Sam RobertsBuilding off a New York Times feature that solicited reader input on the tchotchkes that best represent New York, Roberts’s 2014 book is a compact, yet thorough, history of the greatest city in the world. The objects featured are wonderfully diverse—oysters, subway tokens, the Domino Sugar Refinery sign, and the bagel all make appearances—and the stories are compulsively readable. It’s proof that you don’t need to read a dense, 1,000-page book to get a sense of what makes a city a city. 4. The Bowery Boys: Adventures in Old New York by Greg Young and Tom Meyers“One of the running themes of this book is not just about the history of New York but how New Yorkers looked at their own history throughout history.”—Young, in an interview with the authors on Curbed NY 5. The Island at the Center of the World by Russell Shorto“New Yorkers tend to think the city sprang fully formed out of the past, a triumph of development by British colonists, but the Dutch were here for over a century before the English gave them the book. Shorto’s book paints a vivid picture of a colony on the tip of Manhattan far more vibrant than most history textbooks allow and provides a glimpse into the origins of a Europeanized New York often glossed over.” —Ben Kabak, blogger, Second Ave Sagas 6. New York City Transit Authority: Objects by Brian KelleyFrom the team that brought you the reissue of the NYCTA Standards Manual comes this compendium of subway ephemera, painstakingly collected and catalogued by photographer Brian Kelley. Taken as a whole, the items in the book—everything from old token to NYCTA uniforms to pamphlets distributed to tourists—amount to a stunning visual archive of New York’s transit history. 7. The Other Islands of New York City by Sharon Seitz and Stuart Miller“It first came out in 1996, and is still one of the best introductions to the geography, ecology, and history of the city’s waterfront. It’s both a practical guide and a great piece of writing, and it definitely helped to inspire my own fascination with the city’s coast.” —Nathan Kensinger, photographer and Curbed NY columnist 8. The Grand Central Oyster Bar and Restaurant Cookbook by Sally Ingber and Roy FinamoreOne of New York’s most iconic restaurants demands a big book packed with photography, recipes and history. That’s exactly what you get here, with photographs—from the gorgeous Guastavino vaulting to dishes like the Oyster Pan Roast—alongside more than 100 classic recipes, some of which date back to the Oyster Bar’s opening in 1913. Behind-the-scenes stories and historical anecdotes also reveal how this space has remained sacred to New Yorkers for over 100 years. 9. Gotham by Mike Wallace“While it only covered the period up to 1898 (in 1,424 pages), I found the themes—especially about the cyclical nature of the city—to be timeless and applied them in my time as Deputy Mayor. I'm excited for the next volume, which just came out—17 years after the first!” —Dan Doctoroff, CEO of Sidewalk Labs and author of Greater Than Ever 10. Greater Gotham by Mike Wallace“The monumental sequel to the monumental Gotham covers just 21 years, from the consolidation of New York and Brooklyn to 1919—but what years they were! You might think that doing justice to that period of gilt and misery in more than 1,000 pages might get tedious, but this is a made-for-Netflix epic.” —Justin Davidson, New York magazine architecture critic and author of Magnetic City: A Walking Companion to New York 11. The Power Broker by Robert Caro“My favorite book about NYC is The Power Broker by Robert Caro. It's a fascinating portrait of Robert Moses, who was a visionary city planner, but also extremely short-sighted and completely awful in many, many ways. It's also about power and how it is amassed. And, of course, it's about NYC—how and why it looks the way it does today.” —Roz Chast, New Yorker cartoonist and author of Going into Town: A Love Letter to New York 12. The New York Nobody Knows by William B. HelmreichNative New Yorker and City College professor Helmreich wrote the ultimate walking guide to the city by, well, walking; he covered 816 miles in his quest to chronicle the fascinating minutiae of New York’s many neighborhoods. And fans, take note: Helmreich plans to cover all five boroughs in separate volumes, with Brooklyn having come out in 2016, and Manhattan due next year. 13. The Death and Life of Great American Cities by Jane Jacobs“Apart from being astute and full of implications about human nature as well as urban planning, her analysis evokes the city like almost no other book—in part because Jacobs conjures up not just the New York of a particular era but the vital something that is constant, that accounts for so much of the city’s pull, generation after generation. This, I said over and over again as I read the book for the first time: This is what I love about New York.” —Adelle Waldman, author, The Love Affairs of Nathaniel P 14. Just Kids by Patti SmithPunk-poet legend Patti Smith chronicles her early years in the New York of the 1960s and ’70s in this 2010 memoir. Funny, eloquent and wise, Just Kids is an elegiac ode to her friend, collaborator and sometimes lover, the late Robert Mapplethorpe, whose rise as a photographer was intertwined with Smith's own ascendancy in the New York punk scene. It's also a love letter to the city of the era, as Smith's exploits take her from Scribner's Book Store to the Chelsea Hotel to Coney Island to the sweaty heart of Max's Kansas City and CBGB's. 15. Here Is New York by E.B. WhiteE.B. White took a stroll through Manhattan and wrote one of the most quintessential love letters to New York. The accomplished essayist and children’s-book author pays perfect tribute to midcentury NYC in an essay that still rings true today. He awes over the implausible mess of infrastructure and humanity, and offers astute observations like this: "New Yorkers temperamentally do not crave comfort and convenience—if they did they would live elsewhere." 16. Forgotten New York by Kevin Walsh“Walsh's book came out right around the time I was moving to NYC, and I used it as a sort of field guide to looking for bits of history around various NYC neighborhoods. By pointing out buildings, lesser known landmarks and remnants of early NYC, Walsh gives the reader a new way to see every day things we walk past on the way to the subway. He teaches people how to engage with their environment, and ultimately appreciate it more, even the ugly parts.” —Julia Wertz, author, Tenements, Towers & Trash: An Unconventional Illustrated History of New York City 17. The Works by Kate Ascher“You don’t have to be an infrastructure geek to love this illustrated guide to everything we take for granted—what our water, electricity, garbage collection, transit systems and more actually look like beneath the surface, and how they actually work. A little dated, coming out in 2005, but most of our deep infrastructure is still what it was and you’ll never look at the city the same way again.” —Brian Lehrer, host, The Brian Lehrer Show on WNYC 18. The AIA Guide to New York City by Norval White and Elliot WillenskyCome for the in-depth descriptions of every major New York building, stay for the bitchy commentary about the ones the authors didn’t like all that much. (See: calling Richard Meier’s One Prospect Park “a massive beached whale,” among other bon mot.) First published 50 years ago, the most recent edition was released in 2010—and we’re eagerly awaiting the next one. 19. Never Built New York by Greg Goldin and Sam LubellWhat would New York have become if an airport anchored the southern tip of Manhattan, or if an enormous I.M. Pei-designed supertall loomed over Midtown? We’ll never know, but Goldin and Lubell’s hulking 2016 book lets us imagine. The duo chronicles dozens of fascinating unrealized architectural schemes for the five boroughs, and while some may make you thankful for the city we have—Raymond Hood’s “skyscraper bridge” may have been a bit much—others will have you wondering what could have been. 20. Magnetic City by Justin Davidson“Whether people are visiting New York for the first time, or have only ever seen it on TV, or have lived here their whole lives, I would like people to be able to stand on a given street corner or walk down a block and have a sense of why it is the way it is. Everything has a history, and you can see that history embedded almost like a fossil or a series of archeological layers in the city that you're seeing in front of you.”—from an interview with the author on Curbed NY 21. The Great Bridge by David McCulloughThis is a monumental book for a monumental bridge. The Brooklyn Bridge—viewed as the greatest engineering feat of mankind when it opened in 1883—was the result of a toiling (some might say cursed) family, who fought off competitors and corrupt politicians to beat the laws of nature and provide an essential connection between Manhattan and Brooklyn. David McCullough’s 500-plus page book takes you through every detail, making this an indispensable resource for New York history and architecture buffs. 22. Delirious New York by Rem Koolhaas“One of the most original approaches to thinking about the role of “fantastic” architecture in the growth of New York City. It changed how I understand the city.” —David Rockwell, founder and president, Rockwell Group Want more books about cities? Check out Curbed’s list of 101 books about where and how we live! 23. An Architectural Guidebook to Brooklyn by Francis MorroneBrooklyn has emerged as a cultural destination, but it’s worth celebrating what attracted many to the borough before it exploded in popularity: its charming residential architecture. Morrone’s guidebook details the row houses, churches and various historic structures in northern and central Brooklyn, which includes the borough’s iconic “brownstone belt.” The story of Brooklyn’s buildings is also one of brilliant, quirky, and sometimes corrupt architects and developers, which lends the book added color. 24. Christadora by Tim Murphy“As an architect, I believe that architecture can profoundly impact people's lives. Tim Murphy has made architecture a character in his book, describing the way the city is an architectural landscape of stories, memories and cultural history.” —Rick Cook, founding partner, COOKFOX 25. The Best of Everything by Rona JaffeBefore The Group or The Bell Jar—or even Sex and the City—there was Rona Jaffe’s novel about a group of young women living, loving, and working in New York City. Its plot twists (abortion, stalking, and pre-marital sex among them) seemed shocking at the time, but influenced generations of New York women. 26. Breakfast at Tiffany's by Truman CapoteThough many people are on more familiar terms with Blake Edwards's iconic film adaptation, it's worth reading the crystalline prose of Truman Capote's original 1958 novella. Set in the 1940s, Breakfast at Tiffany's limns both the glamour and the darkness of Holly Golightly's life as a society darling/borderline prostitute on the Upper East Side—and the unnamed narrator who's fascinated and repelled by her. Perhaps no author has better encapsulated the sense of New York as a place of personal reinvention, for better and worse. 27. The Long-Winded Lady by Maeve Brennan“One of my favorite New York books is The Long-Winded Lady, a collection of short essays written mostly in the 1960s by Maeve Brennan for The New Yorker magazine's Talk of the Town. Brennan observes the city and its ordinary people on the streets of the Village and Times Square, from tables in bars and restaurants, and in the lobbies of budget hotels. Her essays are filled with compassion and connection, mixed with the anonymity of city life.” —Jeremiah Moss, blogger and author of Vanishing New York: How a Great City Lost Its Soul 28. The Amazing Adventures of Kavalier and Clay by Michael ChabonThe history of comic books is irrevocably intertwined with the history of New York City. In his 2000 Pulitzer-winning novel, Michael Chabon tells the story of two Jewish kids—one from Brooklyn, one a refugee from Nazi-occupied Prague—who dream up a Superman-esque hero and rise to fame during the Golden Age of comics. The city is as much a character as Sammy, Joe, and their creation: a loud, delirious dreamscape brimming with menace and possibility. 29. The Group by Mary McCarthy“In her blockbuster 1963 novel The Group, Mary McCarthy writes about a cohort of young women making their way in the big city upon graduating from Vassar. The book is so frank—about sex, power, and the profound misogyny of American life in the 1930s—that it'''
