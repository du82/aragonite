["http://www.ny1.com/nyc/all-boroughs/on-air/2017/09/26/jamie-stelter-traffic-reporter"]
title = "Jamie Stelter — Anchor, Traffic & Transit/'Mornings On 1'"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''Jamie Stelter — Anchor, Traffic & Transit/'Mornings On 1' BY Spectrum News Staff New York City PUBLISHED 1:57 PM ET Oct. 18, 2018 PUBLISHED 1:57 PM EDT Oct. 18, 2018 SHARE Follow Jamie Stelter on Twitter and Instagram. What is there to say about Jamie Stelter that hasn't already been said? The NY1 Traffic Anchor and "Mornings On 1" co-host has been a mainstay on the network since 2010, bringing viewers the latest from the trains, tunnels, and all modes of transportation around the city. She’s been dubbed the "Trans-It Girl" by the New York Post and "New York's Wake Up Call" by Variety. Jamie is from Philadelphia, but this Eagles fan is as New York as they come. She hops the subway home to her apartment near Columbus Circle every day after work and loves instagramming all the quirks of New York City life. Like many others, her romantic life is a direct result of her time at NY1. Her now-husband Brian reached out to NY1 anchor Pat Kiernan on Twitter to see if he would play matchmaker. Pat did, and Jamie and Brian are now married, and have a daughter, Sunny, and a son, Story.'''
