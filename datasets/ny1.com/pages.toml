["https://ny1.com/nyc/all-boroughs/political-buzz/2020/03/02/political-buzz-bob-hardt-corona-virus-trump"]
title = "Political Buzz: A Terrifying Viral Moment"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''A Terrifying Viral Moment BY Bob Hardt New York City PUBLISHED 5:52 AM ET Mar. 02, 2020 PUBLISHED 5:52 AM EST Mar. 02, 2020 SHARE We’re officially in a real-life scary movie today as a deadly virus has found its way to New York City while the nation’s political elite is in full Bickersons mode. It’s less of a statement about the power of Michael Bloomberg than the weakness of Donald Trump when the former mayor purchases three minutes of prime-time TV last night and almost sounds like Jonas Salk compared to Vice President Mike Pence – at least when it comes to Coronavirus. Diseases aren’t political so it didn’t make sense for the president to name his running mate as his Coronavirus point man. Americans crave someone who’s off the ideological spectrum when going to the doctor’s office -- not someone who’s calling the Coronavirus fear a “hoax” that’s being drummed up by Democrats. Remember those scary few hours on 9/11 when it felt like no one was in charge? That’s sort of what it’s felt like for days as Americans are hearing about new Coronavirus cases in new places every day. No one can blame the White House for the spread of the disease but the almost anti-vax vibe that emanated from the president at a rally on Friday night was downright disturbing. With the stock market plunging and people stockpiling food and hand sanitizers, the first step would be for the president to admit there’s a problem. If he doesn’t, we’ve got ourselves an even bigger one. For more of Bob's columns, visit the NY1 Political Buzz homepage. SIGN UP FOR OUR POLITICAL NEWSLETTER: #mc_embed_signup{background:#f2f5fa; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} #mc_embed_signup .button { background-color: #74a6ee !important; font-size: 15px; border: none; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; font-family: "proximanova-bold-webfont" !important; } #mc_embed_signup form { padding: 0px 0 0px