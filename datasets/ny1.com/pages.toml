full_description = 'Crisis and Accomplishment: The Rise and Fall of John Lindsay - Part 1 - The Flamboyant Idealist BY Spectrum News Staff New York City PUBLISHED 7:00 AM ET Dec. 12, 2024 PUBLISHED 7:00 AM EST Dec. 12, 2024 SHARE In 1965, New York City was teetering on the edge of an uncertain future, but a Republican congressman from the Upper East Side was determined to save it. Fighting traditional power brokers and machine politicians, John Lindsay improbably was elected mayor that year; his eight years in office became one of the most tumultuous and transformative times in New York’s recent history. In part one of a three-part podcast series by Spectrum News NY1, Errol Louis explores John Lindsay’s turbulent New York, focusing on his early years in Congress and building up to being elected mayor in a dramatic three-way race in November of 1965. Join the conversation, weigh in on Twitter using the hashtag #NY1YouDecide or give us a call at 212-379-3440 and leave a message. Or send an email to YourStoryNY1@charter.com. ABOUT THE SHOW NY1’s Errol Louis has been interviewing powerful politicians and cultural icons for years, but it’s when the TV cameras are turned off that things really get interesting. From career highlights, to personal moments, to stories that have never been told, join Errol each week for intimate conversations with the people who are shaping the future of New York and beyond. Listen to "You Decide with Errol Louis" every Wednesday, wherever you listen to podcasts. HOW TO LISTEN APPLE PODCASTS SPOTIFY STITCHER RSS'
