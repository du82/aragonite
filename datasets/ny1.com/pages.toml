["http://www.ny1.com/nyc/all-boroughs/on-air/2017/09/26/cheryl-wills"]
title = "Cheryl Wills — Anchor, 'NY1 Live At Ten' and 'In Focus'"
description = "Cheryl is a charter member of the NY1 News team, having joined NY1 before the station went on the air in 1992."
full_description = '''Cheryl Wills — Anchor, 'NY1 Live At Ten' and 'In Focus' BY Spectrum News Staff New York City PUBLISHED 1:00 PM ET Jul. 11, 2023 PUBLISHED 1:00 PM EDT Jul. 11, 2023 SHARE Cheryl Wills is an Emmy Award-winning journalist for Spectrum News NY1. As the first African American woman to host a prime-time nightly newscast for the cable network, Cheryl anchors the Emmy-nominated broadcast "Live at Ten" on weeknights. Cheryl has been with NY1 since its launch in 1992 and is one of the station’s most recognizable journalists for breaking news and special coverage. She is also the talk show host of the weekly public affairs program "In Focus with Cheryl Wills," where she interviews the most powerful newsmakers and elected officials in the country. Cheryl is also the acclaimed author of a series of books about her family’s transition from slavery to freedom in the United States. "Die Free: A Heroic Family Tale," "The Emancipation of Grandpa Sandy Wills," "Emancipated: My Family’s Fight for Freedom," and "EMMA" all chronicle her three-times great-grandfather’s heroic service as a member of the United States Colored Troops during the Civil War. On March 25, 2011, Cheryl made history as the first journalist invited to speak at the United Nations General Assembly Hall for the International Remembrance of Victims of Slavery and the Transatlantic Slave Trade, which was broadcast live around the world on UNTV. Cheryl has been honored numerous times during her 30-plus years as a journalist. In 2023, Cheryl was awarded the prestigious Gracie Award from the Alliance for Women in Media. Cheryl has also received awards from the New York Press Club, the Newswomen’s Club of New York and the Associated Press, and she received a special medal from the United Nations Correspondents Association, personally presented to her by U.N. Secretary General Ban Ki-Moon. City & State Magazine hailed Cheryl as one of New York’s most “remarkable women,” and Cheryl is one of the women profiled in the award-winning 2020 book "She is Me: How Women Will Save the World." Cheryl is most proud to be the Commander and Lifetime Descendant Member of the New York Chapter of the Sons and Daughters of the United States Colored Troops, a national organization of Civil War descendants who raise awareness about 200,000 Black soldiers who bravely served during the Civil War. She is a graduate of the prestigious S.I. Newhouse School of Public Communications at Syracuse University. You can connect with Cheryl online at www.CherylWills.com, on Twitter at @CherylWillsNY1, Instagram at @CherylWills_NY1, Facebook at @CherylWills, and TikTok at @CherylDWills.'''
