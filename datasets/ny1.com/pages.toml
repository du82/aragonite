["https://ny1.com/nyc/all-boroughs/political-buzz/2020/05/12/ny1-political-buzz-after-the-curve-bob-hardt"]
title = "Political Buzz: After the Curve"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''After the Curve BY Bob Hardt New York City PUBLISHED 9:27 PM ET May 11, 2020 PUBLISHED 9:27 PM EDT May 11, 2020 SHARE “I want to live alone in the desert I want to be like Georgia O'Keeffe I want to live on the Upper East Side And never go down in the street.” – Warren Zevon It’s been one of the darkest springs in New York City history, with 18,231 residents felled by the coronavirus in March and April. That’s like if everyone at a sold-out crowd for a Rangers game at Madison Square Garden dropped dead in two months. Or, if you follow crime in New York City, think of all of those stories about a particularly gruesome murder that gets plenty of attention in our tabloids. Well, New York City has seen 9,532 people classified as homicide victims – for all of the 21st century. You have to pry open our city’s big book of tragic history to try to understand the sheer magnitude of what COVID-19 has done to New York in a matter of a few bleak weeks. It feels like 10 years ago, but it was just last month that President Trump claimed that “we see light at the end of the tunnel” – unconsciously echoing General William Westmoreland’s infamous description of the Vietnam War in 1967. But cruel irony is lost on our president, who showed no clue when “Live and Let Die” was playing while he was on a tour of an Arizona mask factory last week. Cluelessness aside, the numbers are indeed getting a little less awful each day, although it does show that you’re developing a callus on your soul when a “good” day is when 200 people are killed by COVID in the city instead of 400. As the numbers slowly tick down, we have to be prepared for an entire city that will be suffering from post-traumatic stress disorder and an economy that’s off the rails. Combine the aftermath of 9/11 and New York’s dark fiscal days of the 1970s, and that barely begins to paint the picture of the challenges ahead. There’s plenty of anger and finger-pointing going around – and some of it is well-deserved. But for New York to bounce back, we’re going to need a plan and a rallying cry that goes far beyond just someone taking their finger off a pause button or bringing back baseball. Live and let live. For more of Bob's columns, visit the NY1 Political Buzz homepage. SIGN UP FOR OUR POLITICAL NEWSLETTER: #mc_embed_signup{background:#f2f5fa; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} #mc_embed_signup .button { background-color: #74a6ee !important; font-size: 15px; border: none; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; font-family: "proximanova-bold-webfont" !important; } #mc_embed_signup form { padding: 0px 0 0px 0% !important; } #mc_embed_signup input.email { font-family: "proximanova-regular-webfont" !important; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */'''
