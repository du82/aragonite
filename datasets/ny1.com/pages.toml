["https://ny1.com/nyc/all-boroughs/political-buzz/2020/02/26/democratic-south-carolina-debate-michael-bloomberg-recap-2020-presidential-election-bob-hardt-political-buzz"]
title = "Michael Bloomberg Steps Over a Low Debate Bar in Charleston"
description = "NY1 Political Director Bob Hardt shares his analysis on Mike Bloomberg's performance in the Democratic presidential debate in Charleston."
full_description = '''Bloomberg Steps Over a Low Debate Bar BY Bob Hardt Charleston, S.C. PUBLISHED 11:07 PM ET Feb. 25, 2020 PUBLISHED February 25, 2020 @11:07 PM SHARE Don't call it a comeback. While he'll never sound like Pericles (unless there's a Pericles from Medford), Michael Bloomberg on Tuesday night gave a debate performance that showed he can actually defend himself when he's attacked rather than looking like someone who took a vow of non-violence before his first debate in Las Vegas. Sure, Bloomberg had a Scrooge McDuck moment when he claimed that he "bought" the House of Representatives to help Nancy Pelosi. But he corrected himself mid-sentence and avoided gaffing his way out of the primary before voters even have the chance to cast their ballots for him on Super Tuesday. Like in last week's debate, Elizabeth Warren seemed to take great glee in going after Bloomberg despite the fact that her ideological rival is Bernie Sanders and not Bloomberg, the man who is trying to be the king of the anti-Sanders movement in the Democratic Party. Perhaps Warren is still bitter that Bloomberg endorsed Republican Scott Brown in his Senate campaign against her — or perhaps she's trying to win points with Sanders should he be the nominee. Regardless, she had some of the best anti-Bloomberg lines of the night. "The core of the Democratic Party will never trust him," warned Warren, who may have a point. Bloomberg never won a majority of the Democratic vote in his three campaigns for mayor in New York City and he's now focusing on Super Tuesday states with open primaries that aren't really big-D Democratic, including Tennessee, Arkansas, and Oklahoma. Of at least local interest, former Mayor David Dinkins endorsed Bloomberg's candidacy just before the debate, a fact that could have helped Bloomberg when he was yet again asked to defend his protracted support of the police tactic of stop-and-frisk. But Bloomberg never mentioned that he had the backing of the city's only African American mayor who, ironically, gave Bill de Blasio his first real job in government. Watching the debate's many attacks, there were times when you would have thought that Bloomberg was the frontrunner instead of Sanders. But it was an odd night in other ways with the Naked Cowboy getting a goofy shout-out from Bloomberg before anyone even mentioned the coronavirus by name. Bloomberg also didn't buy into the "fun" endgame in the debate in which candidates were supposed to share their favorite motto. Bloomberg quoted himself — which shouldn't be all that surprising given that his memoirs are titled "Bloomberg by Bloomberg" and he also named his media empire after himself. In the end, Bloomberg sort of lived to fight another day. But should Bernie Sanders win the South Carolina primary on Saturday, all of the candidates on stage may find that while there's still a Super Tuesday, they're just about out of days. For more of Bob's columns, visit the NY1 Political Buzz homepage. SIGN UP FOR OUR POLITICAL NEWSLETTER: #mc_embed_signup{background:#f2f5fa; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} #mc_embed_signup .button { background-color: #74a6ee !important; font-size: 15px; border: none; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; font-family: "proximanova-bold-webfont" !important; } #mc_embed_signup form { padding: 0px 0 0px 0% !important; } #mc_embed_signup input.email { font-family: "proximanova-regular-webfont" !important; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */'''
