title = "New York State Government Guide | Spectrum News NY1 | New York City"
description = "Spectrum News New York State Government Guide offers an in-depth look at how New York's state lawmakers decide on everyday issues that affect you."
full_description = '''State government has a direct impact on the lives of New York's citizens. From health care to education to environmental issues, your state lawmakers make decisions that affect you and your family. But how much do you know about what happens in the Assembly and Senate chambers? Bills passed in the state legislature directly impact the day-to-day life of New Yorkers, but how much do you know about how the state government works? Find out about the different branches of government, who’s who in New York's government, and how you can reach your lawmaker. The New York State Legislature is made up of a 63-member Senate and a 150-member Assembly. Each New York resident has a state senator and an Assembly member who represents them in Albany. Below are the maps for the New York State Senate and Assembly districts. You can zoom in and maneuver each map to where you live. Then, hover your cursor over the district in your area to find your legislator. Click on the district to go to that legislator's website. Not sure which district is yours? You can look up all your representatives by going to the New York State Board of Elections website and typing in your address. Every year, hundreds of bills are filed in the New York State Assembly and Senate. With only 61 scheduled days in the legislative session, not all of them make it up for debate. Do you have an issue that's important to you? Keep tabs on what your lawmakers are talking about so you can be in the know. Your lawmakers like to use Twitter more and more to make big announcements, give updates on their bills, and share their opinions on a wide variety of subjects. Our live feed helps you keep track of all our lawmakers in one place so you always know what is happening. Errol Louis interviews political newsmakers, pundits and consultants from New York City and beyond on NY1's "Inside City Hall" program, every weeknight at 7 p.m. and 11 p.m.'''
