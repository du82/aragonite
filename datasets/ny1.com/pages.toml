["https://ny1.com/nyc/all-boroughs/politics/you-decide-with-errol-louis.html"]
title = "You Decide with Errol Louis | Spectrum News NY1 | New York City"
description = 'NY1’s Errol Louis has been interviewing powerful politicians and cultural icons for years, but it’s when the TV cameras are turned off that things really get interesting. From career highlights, to personal moments, to stories that have never been told, join Errol each week for intimate conversations with the people who are shaping the future of New York and beyond. Listen to "You Decide with Errol Louis" every Wednesday, wherever you listen to podcasts.'
full_description = '''NY1’s Errol Louis has been interviewing powerful politicians and cultural icons for years, but it’s when the TV cameras are turned off that things really get interesting. From career highlights, to personal moments, to stories that have never been told, join Errol each week for intimate conversations with the people who are shaping the future of New York and beyond. Listen to "You Decide with Errol Louis" every Wednesday, wherever you listen to podcasts. Errol Louis is the Political Anchor of Spectrum News NY1, where he hosts "Inside City Hall," a nightly prime-time show that focuses on New York politics. He regularly interviews top political and cultural leaders, and has moderated more than two dozen debates, including the race for mayor, public advocate, city and state comptroller, state Attorney General and the U.S. Senate. He also was a panelist in a 2016 Democratic presidential debate in Brooklyn between Hillary Clinton and Bernie Sanders. Additionally, Louis is an adjunct professor of Urban Reporting at the CUNY Graduate School of Journalism. Prior to joining Spectrum News NY1, Louis served on the Daily News' editorial board, and he still pens weekly opinion columns for the newspaper. He also hosted a weekday talk show on AM1600 WWRL. A graduate of New Rochelle High School, Louis attended Harvard College, where he graduated with a B.A. in Government. He also earned an M.A. in Political Science from Yale University and a J.D. from Brooklyn Law School. Do you have a question for Errol or one of his guests? We want to hear it. Errol may even give you a shoutout in the next podcast.'''
