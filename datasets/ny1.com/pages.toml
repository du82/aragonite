["https://ny1.com/nyc/all-boroughs/political-buzz/2020/05/19/ny1-political-buzz-crime-on-beach-amid-coronavirus-pandemic-bob-hardt"]
title = "Political Buzz: Back to Normal on the Beach"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''Back to Normal on the Beach BY Bob Hardt New York City PUBLISHED 8:00 AM ET May 19, 2020 PUBLISHED 8:00 AM EDT May 19, 2020 SHARE How can it possibly be a good thing when you’re the victim of a crime? It’s taken me a couple of days to process the theft of my bike and its toddler trailer — along with two stuffed bunnies — on the sands of Far Rockaway and I’m pretty OK with it now. On this past Saturday, I took our daughter on a sunny ride down the boardwalk to a remote spot on the beach where it would be almost impossible not to find some social distance. Sadly, we also managed to distance ourselves from a thief who trekked down to the beach and made off with our six-wheels of transportation and our four-legged friends when we were looking at the waves instead of our bike. Related Stories LIVE UPDATES: Coronavirus in New York City LIVES LOST: Remembering Victims of the Coronavirus What to Do If You Test Positive for COVID-19 CDC Coronavirus Page WHO Coronavirus Page After some shock and shame, I called for backup: my wife rode to the rescue and picked us up in our car and took us home. For the rest of weekend, I went through about 70 stages of grief. In some ways, I blame myself for mistaking a near-deserted urban beach for a desolate stretch of Cape Cod. But don’t we all get a pass when we’re in the middle of pandemic? No, the lesson stands: crime rests for no one — even if there’s not a big black market for a beat-up hybrid bike and its sandy trailer. Maybe the thief has a penchant for rabbits or maybe, like Plunkitt of Tammany Hall, he saw an opportunity and he took it. Will New York City survive the coronavirus? As long as someone has the energy and time to steal a bike even though we’re at the epicenter of a global pandemic, the answer is a definitive yes. Meanwhile, everything is just fine at home as long as our daughter doesn’t ask me about the rabbits. For more of Bob's columns, visit the NY1 Political Buzz homepage. SIGN UP FOR OUR POLITICAL NEWSLETTER: #mc_embed_signup{background:#f2f5fa; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} #mc_embed_signup .button { background-color: #74a6ee !important; font-size: 15px; border: none; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; font-family: "proximanova-bold-webfont" !important; } #mc_embed_signup form { padding: 0px 0 0px 0% !important; } #mc_embed_signup input.email { font-family: "proximanova-regular-webfont" !important; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */'''
