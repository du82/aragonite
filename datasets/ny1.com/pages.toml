["http://www.ny1.com/nyc/all-boroughs/on-air/2017/08/31/roger-clark"]
title = "Roger Clark — Multimedia Journalist"
description = "Roger Clark began his NY1 career in 2001 as the Staten Island reporter before moving on to the morning features beat three years later."
full_description = "Roger Clark — Multimedia Journalist BY Spectrum News Staff New York City UPDATED 12:00 PM ET Oct. 18, 2023 PUBLISHED 1:47 PM ET Oct. 18, 2018 PUBLISHED 1:47 PM EDT Oct. 18, 2018 SHARE Roger Clark is a multimedia journalist at Spectrum News NY1. Born in the Bronx, he lived in both Staten Island and Queens when he was young and is currently a Manhattan resident, making Brooklyn the only borough he’s yet to reside in. Roger holds a Bachelor of Science in broadcast journalism and communications from Syracuse University. He got his start working for local news affiliates around New York state before beginning his tenure at NY1 in 2001, and he counts telling stories in his hometown as a dream come true. Whether he's dressed as a cannoli on Mulberry Street, or reporting from one of the city's many cultural institutions in communities all over the five boroughs, Roger is always game for a challenge. In addition to his career in news, Roger is also an accomplished drummer and lifelong punk rock enthusiast. When he’s not in the office, you can find him playing softball for his local league or hanging out with his wife and son and cat Beatrice. Often, Roger can be found on the road following his son's own youth sports activities, or at a stadium or arena rooting on his favorite New York City sports teams. It's a busy life, but he wouldn't have it any other way! You can find Roger on Instagram, X (formerly Twitter), Facebook, and Threads at @RogerClark41."
