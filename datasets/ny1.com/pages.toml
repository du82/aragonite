full_description = '''Political Buzz: A calm election day before a 2024 storm BY Bob Hardt UPDATED 12:10 PM ET Oct. 18, 2023 PUBLISHED 6:00 AM ET Sep. 27, 2023 With all the attention that the upcoming presidential race is getting, it's easy to lose sight that New York City voters are being asked to head to the polls in a little more than a month.What's at stake? You can't tell the players without a scorecard, but luckily, the Board of Elections last week released its official ballot, showing that although all 51 City Council seats are theoretically up for grabs, 14 candidates won't even be facing a challenger. Read More Political Buzz: Farewell to a colleague BY Bob Hardt PUBLISHED 6:00 AM ET Sep. 12, 2023 With Ruschell Boone, her laugh usually came first.From deep within, Ruschell would let loose a laugh, even on a lousy day where she was out in the field covering a story where she was baking in the sun or trying to chase down a story with no leads. Read More Political Buzz: A muddled migrant message BY Bob Hardt PUBLISHED 6:00 AM ET Aug. 29, 2023 "Because something is happening here but you don't know what it is. Do you, Mr. Jones?" — Bob Dylan Read More Political Buzz: The tears of Emma Lazarus BY Bob Hardt PUBLISHED 6:00 AM ET Jul. 25, 2023 "Stay Away!" - Nirvana Read More Political Buzz: Blaming the refs from the pulpit BY Bob Hardt PUBLISHED 6:00 AM ET Jul. 12, 2023 “When does the hard part start?” – Eric Adams Read More Political Buzz: The conscious uncoupling of Bill and Chirlane BY Bob Hardt PUBLISHED 6:00 AM ET Jul. 07, 2023 "You don't do the things that I do. You want to do things I can't do. Always something breaking us in two.” – Joe Jackson Read More Political Buzz: The other man who saved New York BY Bob Hardt PUBLISHED 1:35 PM ET Jun. 26, 2023 “The city’s clamor can never spoil the dreams of a boy and goil. We’ll turn Manhattan into an isle of joy.” – Lorenz & Hart Read More Political Buzz: City Hall's one-man band BY Bob Hardt PUBLISHED 6:00 AM ET J