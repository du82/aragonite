["https://ny1.com/nyc/all-boroughs/political-buzz/2020/03/09/bloomberg-political-buzz-bob-hardt"]
title = "Political Buzz: Citizen Bloomberg"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''Citizen Bloomberg BY Bob Hardt New York City PUBLISHED 5:43 AM ET Mar. 09, 2020 PUBLISHED March 9, 2020 @5:43 AM SHARE When Michael Bloomberg was a nine-year-old boy in Massachusetts, his spiritual godfather died 3,000 miles away in a Beverly Hills mansion with his longtime mistress by his side. One of the richest and most powerful men in the world, William Randolph Hearst built a media empire across the country and then tried to leverage it into winning the hearts of voters. Serving two terms as a New York Congressman, Hearst couldn’t get further, losing two races for mayor and one for governor. And long before there were presidential caucuses or primaries, there were smoke-filled rooms where Hearst was unable to push his name forward with Democratic fixers as a presidential or vice presidential candidate. Like Bloomberg, Hearst wasn’t a natural politician and relied on “paid media” – his own newspapers – to push his cause. (And Hearst likely would have won the mayoralty in 1905 if the Democratic machine hadn’t engaged in massive fraud.) But Hearst’s ultimate failure should have been a valuable lesson to Bloomberg that money and media can’t buy you everything. Being the king of your own castle is very different from becoming the King of America. Perhaps if Bloomberg were a more skilled debater his campaign would still be afloat but it’s more likely that voters were more attracted to someone who resembles their uncle than someone who disdainfully invites them to the compay holiday party. Bloomberg extrapolated his perfect storm win of 2001 into a White House pipe dream of 2020. He still has a role to play in the presidential race – but it will be from the sidelines. Hearst could have warned him this was coming. For more of Bob's columns, visit the NY1 Political Buzz homepage. SIGN UP FOR OUR POLITICAL NEWSLETTER: #mc_embed_signup{background:#f2f5fa; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} #mc_embed_signup .button { background-color: #74a6ee !important; font-size: 15px; border: none; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; font-family: "proximanova-bold-webfont" !important; } #mc_embed_signup form { padding: 0px 0 0px 0% !important; } #mc_embed_signup input.email { font-family: "proximanova-regular-webfont" !important; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */'''
