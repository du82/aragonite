["https://ny1.com/nyc/all-boroughs/political-buzz/2020/05/27/ny1-political-buzz--local-heroes-and-villains"]
title = "NY1 Political Buzz: Local Heroes and Villains"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''Local Heroes and Villains BY Bob Hardt New York City PUBLISHED 8:00 AM ET May 27, 2020 PUBLISHED May 27, 2020 @8:00 AM SHARE “Keep your distance. Keep your distance. When I feel you close to me, what can I do but fall?” – Richard Thompson It’s not always easy to love thy neighbor. Peering out my second-floor window on Friday night, I discovered that some of my fellow Rockaway residents were acting like it was just another Memorial Day weekend - not exactly “Animal House,” but hardly “My Dinner with Andre.” In ordinary times, that means lots of beer and loud talk, and plenty of sloppy interaction within six feet of each other on a porch or in a yard. There hasn’t been much of any of those things since March 7 – Rockaway’s St. Patrick’s Day Parade – the last day that most people here gathered together before things started falling apart. Since then, the peninsula has lost at least 471 people to the coronavirus – with Far Rockaway being one of the worst-hit neighborhoods in the city. And on Friday night, it was almost a mirage of death for some of my neighbors, who were feeling no pain as we entered the holiday weekend. After not having left the peninsula and following the hazy rules for more than two months, I get it. We are summer people. You could go months without seeing your neighbor, and suddenly you’re waving to them every day as the temperature starts to rise. The logic of the quarantine is apparently lost on many of us when a beer and a hug is immediate and someone else’s bad cough is at least a week away. The numbers are plunging in New York City, but it’s fair to worry that people are getting tired of being good citizens and not realizing that their behavior has been reaping rewards. Be a good neighbor. Open your window. Wave. And toast from afar. For more of Bob's columns, visit the NY1 Political Buzz homepage. SIGN UP FOR OUR POLITICAL NEWSLETTER: #mc_embed_signup{background:#f2f5fa; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} #mc_embed_signup .button { background-color: #74a6ee !important; font-size: 15px; border: none; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; font-family: "proximanova-bold-webfont" !important; } #mc_embed_signup form { padding: 0px 0 0px 0% !important; } #mc_embed_signup input.email { font-family: "proximanova-regular-webfont" !important; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */'''
