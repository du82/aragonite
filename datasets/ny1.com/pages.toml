["https://ny1.com/nyc/all-boroughs/political-buzz/2020/04/27/political-buzz-bob-hardt-rikers-island-cornavirus"]
title = "Political Buzz: A Virus Runs Rampant on Rikers"
description = "NY1 Political Buzz, Political Director Bob Hardt shares his analysis and opinions on the week in city politics."
full_description = '''A Virus Runs Rampant on Rikers BY Bob Hardt New York City PUBLISHED 6:14 AM ET Apr. 27, 2020 PUBLISHED April 27, 2020 @6:14 AM SHARE How do you safely run a large jail in the time of Coronavirus? In New York City’s case, the sad answer is you don’t. On any given day, close to 4,000 New Yorkers are being held on Rikers Island – many of them convicted of no crime while awaiting trial. But being behind bars right now in New York City could be a possible death sentence because of Coronavirus. In a powerful podcast by NY1’s Courtney Gross, inmates and corrections officers reveal the dangerous conditions on Rikers – where more than half of the jail was on lockdown this month because of COVID-19. At least three inmates and nine staff members have died from the virus while more than 1,200 others have tested positive. While city officials say they’re doing everything they can to minimize the health risk in the jails, no one would even bother to sit down with Gross to try to answer questions being raised by both inmates and guards about safety on the island. While it makes little sense to release a dangerous criminal on the streets, it also seems grossly unfair to put someone -- who hasn’t been convicted of anything – in a situation in which he or she could get extremely ill. Closing Rikers was a top priority of many advocates and elected officials before the virus. Regardless of the financial cost, it seems like an important goal because of the human cost that’s now involved on the massive jail. When almost everyone in New York City is worried about the Coronavirus, it’s clearly too easy to forget about people who are inside a jail in the middle of an island. Endnote: It’s with great sadness that I note the sudden passing of WNYC’s Richard Hake. Richard was the radio equivalent of our Pat Kiernan, a voice that tens of thousands of New Yorkers awoke to every morning. Richard was an inspiration and a friend to so many people, including me and my dear wife. He cannot be replaced and will be missed. For more of Bob's columns, visit the NY1 Political Buzz homepage. SIGN UP FOR OUR POLITICAL NEWSLETTER: #mc_embed_signup{background:#f2f5fa; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} #mc_embed_signup .button { background-color: #74a6ee !important; font-size: 15px; border: none; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; font-family: "proximanova-bold-webfont" !important; } #mc_embed_signup form { padding: 0px 0 0px 0% !important; } #mc_embed_signup input.email { font-family: "proximanova-regular-webfont" !important; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */'''
