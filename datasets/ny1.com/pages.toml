["https://ny1.com/nyc/all-boroughs/news/2023/12/06/mario-cuomo-the-last-liberal-part-1---rising-up-the-political-ranks"]
title = "Mario Cuomo: The Last Liberal Part 1"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''Mario Cuomo: The Last Liberal Part 1 - Rising up the political ranks BY Spectrum News Staff New York City PUBLISHED 5:00 AM ET Dec. 07, 2023 PUBLISHED 5:00 AM EST Dec. 07, 2023 SHARE 2023 marks 40 years since Mario Cuomo was sworn in as governor of New York for the first time. Cuomo was one of the most unlikely politicians the state had seen in a long time. The child of illiterate working-class immigrants who owned a grocery store in South Jamaica, Cuomo was a public-school genius who found himself graduating at the top of his class at St. John’s Law School. After taking a few pro-bono cases representing homeowners in Queens, Cuomo found himself encouraged to enter politics by legendary journalists Jimmy Breslin and Pete Hamill, as well as NYC Mayor John Lindsay. What followed was a wild rise up the ranks, one that included a highly publicized run for mayor, as well as turns as lieutenant governor and New York secretary of state before finally being elected governor. From the perspective of his advisers and the reporters that covered him – some of them speaking about their experiences with Cuomo for the first time – we'll find out how Cuomo managed to become a major political figure in the Democratic Party despite having a background that differed from most elected officials. See more on our Mario Cuomo series at ny1.com/mariocuomo. ABOUT THE SHOW NY1’s Errol Louis has been interviewing powerful politicians and cultural icons for years, but it’s when the TV cameras are turned off that things really get interesting. From career highlights, to personal moments, to stories that have never been told, join Errol each week for intimate conversations with the people who are shaping the future of New York and beyond. Listen to "You Decide with Errol Louis" every Wednesday, wherever you listen to podcasts. HOW TO LISTEN APPLE PODCASTS SPOTIFY STITCHER GOOGLE PODCASTS RSS'''
