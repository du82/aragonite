["https://ny1.com/nyc/all-boroughs/political-buzz/2020/06/09/ny1-political-buzz-bob-hardt-taking-the-nypd-to-the-woodshed"]
title = "Taking the NYPD to the Woodshed"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''Taking the NYPD to the Woodshed BY Bob Hardt New York City PUBLISHED 8:00 AM ET Jun. 09, 2020 PUBLISHED 8:00 AM EDT Jun. 09, 2020 SHARE "The first cut is the deepest." - Cat Stevens The Thin Blue Line is about to get a little skinnier. OK, so no one will ever accuse the NYPD of being svelte with its annual budget of about $6 billion, but the death of George Floyd at the hands of police in Minnesota is about to cause some belt-tightening 1,200 miles away from Minneapolis. Mayor Bill de Blasio is bowing to protesters’ demands and promising to cut some of the police department’s budget and give it to youth programs. Yup, youth programs – the very warm-and-fuzzy thing that the mayor was proposing to shear just two months ago as the coronavirus was raging across the city. It’s sometimes tricky to follow Bill de Blasio’s bouncing budget ball. The mayor has been around long enough to have seen things bounce in the other direction. Thirty years ago, de Blasio was a mid-level City Hall staffer for David Dinkins, whose mayoralty was sinking under the weight of 2,207 murders in his first year in office. With the pressure of then-City Council Speaker Peter Vallone, Dinkins eventually went on a NYPD hiring spree, even launching a “Safe Streets, Safe City” lottery ticket in a desperate attempt to stop the violence by beefing up the police force. And for a wide variety of reasons, it’s largely been a 30-year success story, with the number of homicides dipping to 311 in 2019 – an incredible 86% drop from 1990. While it may be a fair question to wonder if the NYPD needs to have the same level of staffing in a less-dangerous time, that question was answered pretty clearly by the City Council and the mayor in 2015 when they decided to hire close to 1,300 more cops. The force behind that deal was then-City Council Speaker Melissa Mark-Viverito – a politician who will never be confused with Clint Eastwood. Amazingly, the move to increase the NYPD’s budget funding came less than a year after the death of Eric Garner at the hands of the NYPD. So what’s changed in five years to make the NYPD a political pariah in some circles? The death of George Floyd certainly gave New Yorkers a painful case of déjà vu, with Floyd even echoing Garner’s dying words: “I can’t breathe.” But the massive protests across the country could also be seen as a collective response to President Donald Trump, who seems a lot more interested in talking about his latest poll numbers than Floyd’s death or the coronavirus, which has killed a disproportionate number of African-Americans and Latinos. There’s just a little irony in a city cutting the budget of its police force in the wake of some of the worst rioting we’ve seen in decades, but that’s where we are in 2020. And does anyone really think that the NYPD – or any city agency – will be magically fixed by reducing its budget? Solutions are complicated and could be even more expensive. It’s easier to cut and run. For more of Bob's columns, visit the NY1 Political Buzz homepage. SIGN UP FOR OUR POLITICAL NEWSLETTER: #mc_embed_signup{background:#f2f5fa; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} #mc_embed_signup .button { background-color: #74a6ee !important; font-size: 15px; border: none; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; font-family: "proximanova-bold-webfont" !important; } #mc_embed_signup form { padding: 0px 0 0px 0% !important; } #mc_embed_signup input.email { font-family: "proximanova-regular-webfont" !important; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */'''
