full_description = '"The Rush Hour,” a two-hour weekday news program anchored by award-winning journalist Annika Pergament, focuses on diving deeper into the people and stories defining New Yorkers’ days. Along with breaking news and weather, “The Rush Hour” features NY1’s signature coverage of politics, mass transit, the school system, Broadway and more. Annika utilizes her decades of reporting on New York to give the show an additional focus on the power players who move this city — from businesses to nonprofits to major institutions. Watch “The Rush Hour” weekdays at 4 p.m. The show airs on NY1 and is available to Spectrum subscribers on Channel 1 and via the Spectrum News App for mobile, Xumo Stream Box, Roku and Apple TV streaming devices. Annika Pergament is an Emmy Award-winning journalist with 30 years of experience covering New York’s biggest stories for NY1, including the terror attacks on Sept. 11, the financial crisis of 2007-2008 and the COVID-19 pandemic. Her recent pieces include an investigation into New York City’s Administration for Children’s Services, an interview with Alex Bolen, CEO of Oscar de la Renta, and a profile of the director and actor Jennifer Esposito.'
