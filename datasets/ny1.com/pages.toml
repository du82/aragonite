["https://ny1.com/nyc/all-boroughs/exploring-your-health/2019/06/06/explore-your-health-with-the-help-of-erin-billups.html"]
title = "Explore Your Health with the Help of Erin Billups"
description = "Our veteran health reporter breaks down difficult health questions and what we can do to solve them."
full_description = '''Explore Your Health with the Help of Erin Billups BY Spectrum News Staff New York City PUBLISHED 9:59 AM ET Jun. 06, 2019 PUBLISHED 9:59 AM EDT Jun. 06, 2019 SHARE Erin Billups has been reporting on health for Spectrum News since 2013. She’s covered a wide range of topics, from the roll-out of the Affordable Care Act to innovations in treatment for diseases like diabetes, Alzheimer’s, heart disease and cancer. Erin’s coverage regularly highlights public policy responses to health epidemics and widening disparities in access to care. Erin is now the host of Spectrum Networks’ new initiative “Exploring Your Health,” which will take a deeper dive into major health issues affecting Americans. Erin has held several roles with Spectrum Networks. She hosted Spectrum News NY1’s weekly health program, "City Health Beat," for two years. She was the first reporter stationed at Spectrum’s Washington D.C. Bureau, which launched in July 2011. In Washington, Erin covered President Obama's announcement of the end of the Iraq War and U.S. Supreme Court arguments on cases ranging from immigration reform to health care reform. Prior to working in the nation’s capital, Erin kept tabs on changes in David Paterson's administration and the transition to Andrew Cuomo's administration as NY1's State House Reporter. Her stint in Albany included covering the historic and controversial same-sex marriage bill, which passed in 2011. Before working for NY1, Erin was the political reporter for Spectrum News’ Capital Tonight in Upstate New York. She began her career with Spectrum News as the morning reporter in Albany. Prior to that, she was a general assignment reporter in Elmira-Corning at the ABC affiliate WENY-TV, where she also covered the health beat. Originally from Hollis, Queens, Erin was raised by her mother and grandmother, who was an emergency department nurse. Health and nutrition were regularly a focus of family conversation and a large part of why she chose to pursue the health beat. Erin is a graduate of the State University at Albany. She lives in New York City with her husband and their two children.'''
year_published = 2019
year_updated = 2019
