["http://www.ny1.com/nyc/all-boroughs/on-air/2017/09/26/pat-kiernan"]
title = "Pat Kiernan — Anchor, 'Mornings On 1'"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''Pat Kiernan — Anchor, 'Mornings On 1' BY Spectrum News Staff New York City PUBLISHED 12:42 PM ET May 23, 2018 PUBLISHED 12:42 PM EDT May 23, 2018 SHARE Follow Pat Kiernan on Twitter and Instagram. Pat Kiernan has been morning anchor at NY1 News since 1997. He's become a part of the daily routine for New York City, guiding New Yorkers through their morning with a briefing on news, weather, traffic, sports and what's "In the Papers." Pat has led NY1's coverage on dozens of breaking news stories. He was on the anchor desk for 12 consecutive hours on September 11th, 2001. Pat is so closely associated with TV news in New York that he's been asked to "play himself" more than two dozen times in movies and TV shows. Recent screen credits include "Ghostbusters," "Billions" and The Amazing Spider-Man 2. Pat started his broadcast news career while completing his business degree at the University of Alberta in Edmonton. He moved to New York from Canada in 1996 to join Time Warner's early efforts to deliver news online. Pat lives in Williamsburg, Brooklyn with his wife Dawn and daughters Lucy and Maeve. He still doesn't like getting up at 3 am.'''
