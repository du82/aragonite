full_description = '''"Mornings On 1" is the only morning show made by New Yorkers for New Yorkers. It's one destination for everything you need to know to start your day. Join Pat Kiernan and Jamie Stelter weekdays from 6 to 9 a.m. for the latest headlines, business news, and traffic and weather information from around the five boroughs. Know of someone who deserves to be honored for their contributions to the NYC community? Let us know by emailing your suggestion to NYER@charter.com. Starting the morning with Pat Kiernan has become a part of the daily routine for many New Yorkers. During his 20 years on the morning anchor desk, Pat has reported on all of New York City’s major news stories. Known for his “In the Papers” segment, it may not surprise you to learn that Pat’s first job was actually as a paper boy. You’ve probably also seen Pat at the movies and in some of your favorite shows – he’s been asked to play himself in more than 20 films and TV series. Read More She’s never hit the snooze button in her life, a trait that makes her the perfect fit for Mornings on 1! Read More During Roger Clark's time as NY1's morning reporter, he has surfed Rockaway Beach, climbed rock walls, learned the trapeze, figure skated, kayaked the Hudson, and canoed the Gowanus Canal. Read More'''
