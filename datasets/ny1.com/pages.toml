["https://ny1.com/nyc/all-boroughs/political-buzz/2020/02/24/bob-hardt-political-buzz-column-don-t-break-our-ballot-box"]
title = "Political Buzz: Don’t Break Our Ballot Box"
description = "Get the best experience and stay connected to your community with our Spectrum News app. Learn More"
full_description = '''Don’t Break Our Ballot Box BY Bob Hardt New York City PUBLISHED 5:54 AM ET Feb. 24, 2020 PUBLISHED 5:54 AM EST Feb. 24, 2020 SHARE It’s lucky that the Nevada Democratic presidential caucuses weren’t that close. More than 24 hours after voters in the Silver State headed home, less than 90 percent of the actual vote had been counted. Maybe that doesn’t sound like such a big deal, but if Bernie Sanders had been stuck in a dogfight with Joe Biden instead of trouncing him, we’d likely be reliving the uncertainty of the Iowa caucuses where both Sanders and Pete Buttigieg were calling themselves the winner for days. While it’s important to get things right (remember Florida in 2000?), it’s also important to get things done in a timely fashion – particularly in the primary calendar, where the schedule is tight between contests. Between the mess of Iowa and the continuing stench of Russian meddling in our elections, it’s understandable that people are a little nervous whenever they head to the polls. Here in New York, we need to reassure voters that their ballots will be counted in an orderly process rather than like last month’s debacle in Iowa. (Note to future app-buyers: avoid companies with names like Shadow Inc.) With a special election for borough president next month and the presidential primary in April, Democratic voters in Queens are expected to head to the polls four times this year. The least we can do is assure them that everything is running smoothly. With ranked-choice voting coming to next year’s Democratic mayoral primary, it’s important to educate voters on how the system will work and how long it could take before we know the actual identity of the winner. And as confusing as ranked-choice voting will be for primary voters next year, just be thankful that we don’t have caucuses in New York City. Ballots are supposed to be secret for a reason—especially on the Upper West Side. For more of Bob's columns, visit the NY1 Political Buzz homepage. SIGN UP FOR OUR POLITICAL NEWSLETTER: #mc_embed_signup{background:#f2f5fa; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} #mc_embed_signup .button { background-color: #74a6ee !important; font-size: 15px; border: none; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; font-family: "proximanova-bold-webfont" !important; } #mc_embed_signup form { padding: 0px 0 0px 0% !important; } #mc_embed_signup input.email { font-family: "proximanova-regular-webfont" !important; -webkit-border-radius: 0px !important; -moz-border-radius: 0px !important; border-radius: 0px !important; } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */'''
