["https://nyassembly.gov/PIO/foil"]
title = "Freedom of Information Request (FOIL) | New York State Assembly"
description = "News and Information from the New York State Assembly"
full_description = "New York State Assembly Freedom of Information Law Request Thank you for your interest in the New York State Assembly. Our website offers a wide variety of information about the legislative process, committees, the state budget, upcoming events, publications, and other resources. Questions about navigating the website? Please contact the Assembly Public Information Office at (518) 455-4218. To submit an electronic FOIL request to the New York State Assembly under the New York State Freedom of Information Law, please complete the form below. Please note: New York State Assembly FOIL requests should pertain to the Assembly’s work. FOIL requests for the New York State Senate, or any other agency, should be sent directly to them. A Guide to the Public Inspection and Copying of Legislative Records provides detailed information about the Assembly FOIL process. The Assembly will respond to FOIL requests via email within five business days. Please be advised that all electronic Freedom of Information requests are determined to have been received on the first normal business day after such requests are submitted. After receiving a FOIL request, the Assembly shall (1) make such record available; (2) deny such request in writing; or (3) provide a written acknowledgement of the receipt of such request and a statement of the approximate date, which shall be reasonable under the circumstances of the request, when such request will be granted or denied. FOIL requests should be as detailed as possible. Incomplete or inaccurate entries can’t be processed. A Guide to the Public Inspection and Copying of Legislative Records * Indicates Required Field First Name * Last Name * Organization Email * Confirm Email * Address * Address Line 2 City * State * New York New York Alabama Alaska Arizona Arkansas California Colorado Connecticut Delaware District of Columbia Florida Georgia Hawaii Idaho Illinois Indiana Iowa Kansas Kentucky Louisiana Maine Maryland Massachusetts Michigan Minnesota Mississippi Missouri Montana Nebraska Nevada New Hampshire New Jersey New Mexico New York North Carolina North Dakota Ohio Oklahoma Oregon Pennsylvania Rhode Island South Carolina South Dakota Tennessee Texas Utah Vermont Virginia Washington West Virginia Wisconsin Wyoming Zip 5 * Your Inquiry Under the provisions of the New York State Freedom of Information Law, Article 6 of the Public Officers Law, I hereby request a copy of (or: access to): * Describe as accurately and specifically as possible the record or records you want, and provide all the relevant information you have concerning them. Electronic Signature * By checking this box and typing my name, I am electronically signing my application. I agree that my electronic signature is the legal equivalent of my actual signature. First Name * Middle Initial Last Name * Suffix"
