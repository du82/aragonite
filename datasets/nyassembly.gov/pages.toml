["https://nyassembly.gov/directions"]
title = "Directions and Maps | New York State Assembly"
description = "News and Information from the New York State Assembly"
full_description = "The New York State Assembly chambers are located in the Capitol Building. Most Assembly offices are in the Capitol, Legislative Office Building and Agency Building 4. These buildings are all part of the Empire State Plaza complex in downtown Albany, New York. The Empire State Plaza also houses many State agencies and commissions, as well as the Empire State Plaza Convention Center, New York State Museum and Empire Center at the Egg. Driving Directions From the North: Take Interstate 87 (Northway) to Interstate 90 (East) exit, proceed east to Interstate 787 and take Empire Plaza exit. From the South: Take New York State Thruway (Interstate 87) to Exit 23 - straight through Toll Booth to Interstate 787, then take Empire Plaza exit. From the East: Take Interstate 90 and cross Hudson River. Take exit to Interstate 787 South, along river. Take Empire Plaza exit. From the West: Take the New York State Thruway (Interstate 90) to Exit 24 (Albany), proceed east on Interstate 90 to Interstate 787 South, along river. Take Empire Plaza Exit. Visitor Parking The following map highlights some of the visitor parking areas in and around the Empire State Plaza."
year_published = 2025
