["https://nyassembly.gov/req"]
title = "Assembly Request Information | New York State Assembly"
description = "Activity Book K-3 (PDF) - A New York-themed educational coloring page with puzzles appropriate for children in grades K-3."
full_description = "Request Information The New York State Assembly makes a wide variety of helpful publications available to the public free of charge. You can request publications by completing the following electronic request form or by contacting the Assembly Public Information Office at (518) 455-4218. Please note that the Assembly takes the confidentiality of any information you provide seriously. The Assembly will not release, sell or give away any information provided--including electronic and postal addresses--without your express permission. Also, if you request to receive electronic mail notices, they will contain simple instructions to allow you to discontinue receiving them at any time. Step 1 Provide your information * Indicates Required Field First Name * Last Name * Organization Email * Confirm Email * Address * Address Line 2 City * State * New York New York Alabama Alaska Arizona Arkansas California Colorado Connecticut Delaware District of Columbia Florida Georgia Hawaii Idaho Illinois Indiana Iowa Kansas Kentucky Louisiana Maine Maryland Massachusetts Michigan Minnesota Mississippi Missouri Montana Nebraska Nevada New Hampshire New Jersey New Mexico New York North Carolina North Dakota Ohio Oklahoma Oregon Pennsylvania Rhode Island South Carolina South Dakota Tennessee Texas Utah Vermont Virginia Washington West Virginia Wisconsin Wyoming Zip 5 * Step 2 Select the publication(s) you wish to receive Note that many of the Assembly's publications are available in English or Spanish. Please select your preference: English Español Activity Book K-3 (PDF) - A New York-themed educational coloring page with puzzles appropriate for children in grades K-3. Activity Book 4-6 - A New York-themed booklet of puzzles and facts appropriate for children in grades 4-6. Agriculture (PDF) - explains state agricultural tax reforms and programs helping the state's largest industry - agriculture. AIDS - reports on the fight against AIDS in NYS and where to get information on AIDS treatments. American Flag (PDF) - outlines the origin and history of the Stars and Stripes and the proper way to handle and display the American flag. Asthma (PDF) - An overview of this growing health risk, with descriptions of what can initiate an asthma attack and asthma treatments. It also explains how to prevent asthma attacks and how to help children with asthma. Auto Leasing (PDF) - explains protections for consumers leasing vehicles. Bike Safety and Helmet Law (PDF) - information on bicycle rules of the road and on the state's bicycle helmet law. Bottle Law (PDF) - explains New York's bottle return program and how the deposit system works. Carbon Monoxide (PDF) - explains the dangers of carbon monoxide and how to detect this odorless, invisible, deadly gas. Child Support (PDF) - outlines the child support system in the state and explains some of the responsibilities of parents. Clean Air Act - outlines the NYS Clean Indoor Air Act which restricts smoking in public places. Co-ops (Nassau, Westchester and Rockland counties) - overview of the basic laws of co-op conversion and cooperative ownership in the counties of Nassau, Westchester and Rockland. Co-ops (New York City) - overview of the basic laws of co-op conversion and cooperative ownership applicable to New York City. (Paying for) College - brief overview of state and federal college financing programs. Consumer Rights (PDF) - consumer tips on how to avoid being scammed. Credit Cards - answers common questions about credit and credit card usage. Crime Watch (PDF) - safety tips on how to avoid being a crime victim. Domestic Violence and Stalking Laws (PDF) - outlines laws that protect victims of domestic violence and stalking. EDITH (Exit Drills in the Home) (PDF) - illustrated explanation of fire safety plans everyone should practice in their home. Elderly Pharmaceutical Insurance Coverage Plan (EPIC) (PDF) - answers questions about who is eligible for the state's prescription plan for senior citizens. FOIL (PDF) - a guide to the public inspection and copying of important Assembly records. Generic Drugs (PDF) - information on the generic drug law and how it can save consumers money. Housing Complaints (PDF) - answers to some common questions about filing a housing complaint in New York City and your rights as a tenant. Health Care Proxy (PDF) - Frequently Asked Questions (FAQs) on designating a health care agent to make your health care decisions if you can't. Homeowners (PDF) - consumer tips for homeowners on tax savings, insurance, and how to avoid scams aimed at homeowners. Household Hazardous Waste - information on how to properly dispose of household hazardous wastes. Identity Theft Protection (PDF) - Tips on how to prevent yourself from becoming a victim of identity theft. Lead Poisoning (PDF) - how to lessen the chances of lead poisoning in your home. The Legislative Process and YOU (PDF) - a brief description of the legislative process and an overview of how a bill becomes a law Lemon Law - consumer guide on the state's Lemon Law, which protects consumers who buy new and used cars. Lyme Disease (PDF) - FAQs about how to protect you and your family from Lyme disease. Managed Health Care - information on consumer protections for individuals receiving health care from health maintenance organizations. NYC Parking Calendar (New York City) (PDF) - Calendar of dates when parking regulations are suspended throughout the five boroughs and information on street cleaning regulations. Organ Donation (PDF) - FAQs about organ donation and where to get more information on it. Patients' Rights (PDF) - Information on the NYS Patients Bill of Rights as well as phone numbers to call if you have questions about quality of health care. Phone Scams (PDF) - consumer information on telemarketing scams and how to get your name taken off telemarketer lists. Physician Charges (PDF) - FAQs on the Mandatory Medicare Assignment Law which limits how much doctors can charge Medicare patients. Playing it Safe (PDF) - safety tips for parents and children. Radon (PDF) - information on radon, a potentially deadly gas found in many homes today. Rent Stabilization (New York City) (PDF) - information for tenants who live in rent stabilized or rent controlled apartments. Real Property Tax Credit for Homeowners and Renters (PDF) - provides information on this important tax benefit for senior citizens and lower income families. Safety Tips for Seniors (PDF) - crime prevention tips for senior citizens. Senior Citizen Programs (New York City) (PDF) - overview of senior citizen programs which help cut costs of taxes, transportation and utilities, including programs specific to New York City. Senior Citizen Programs (New York State, excluding New York City) (PDF) - overview of senior citizen programs in the state which help cut costs of taxes, transportation and utilities. Small Business (PDF) - helpful information and phone numbers for small business owners. Smoke Detector (PDF) - FAQs on the smoke detector law. Solid Waste Reduction (PDF) - tips on how to reduce your household waste. Spousal Impoverishment - information on how this law helps seniors avoid spending their life savings on nursing home costs. Summer Reading (PDF) - explains the importance of reading over summer break and how to participate in the Assembly's Summer Reading Challenge for youths. Teen Suicide (PDF) - guide on how to recognize warning signs of teen suicide and alcohol and drug use. Tenants Rights (Dutchess, Nassau, Rockland, Ulster and Westchester counties) (PDF) - overview of tenants' rights and the state's housing laws in the counties of Dutchess, Nassau, Rockland, Ulster and Westchester. Tenants Rights (New York State, including New York City) (PDF) - overview of tenants' rights and the state's housing laws applicable in most of the state, including New York City. There Ought To Be A Law (PDF) - comment sheet to send to your Assembly representative on ideas you think might make good laws. Utility Consumers (PDF) - overview on consumer rights with utility companies. Veterans (PDF) - overview of veterans programs in the state. Volunteer Firefighters (PDF) - explains the state's Volunteer Firefighter's Benefit Law and protections due volunteer firefighters. Voter Registration (PDF) - includes a voter registration form and information on voter registration. Water Conservation (PDF) - tips on how to save water in your home. Welcome to the State Assembly (PDF) - information about the Assembly and a listing of Assembly committee meetings. Women Veterans (PDF) - explains programs in the state aimed at women veterans. Workers Rights (PDF) - overview of unemployment insurance, occupational safety and health, and other rights of workers in New York. Step 3 submit request"
