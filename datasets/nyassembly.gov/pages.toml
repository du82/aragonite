full_description = ".content p .p-tmp-space { margin-top:20px; } Welcome to the New York State Assembly Intern Program CARL E. HEASTIESPEAKER ALICIA HYNDMANINTERN COMMITTEE CHAIR A message to all interested students from Alicia Hyndman, Chair ASSEMBLY INTERN COMMITTEE A COMPREHENSIVE ACADEMIC PROGRAM AN EXTRAORDINARY EXPERIENCE The Assembly Session Internship is a comprehensive academic program which gives qualified students the chance to work in the New York State Assembly. Session and Graduate Internship Programs All Majors are Encouraged to Apply To be eligible, applicants must be: Undergraduate students who are full-time juniors and seniors matriculated in a college degree program or Graduate students or applicants who recently completed a graduate degree program within one year of graduation. Intern Committee Brochure Intern Committee Poster Graduate Brochure Earn While You Learn $8,800 Stipend - Undergraduate Session Interns $23,000 Stipend - Graduate Scholars Up to a Full Semester's Credit for Undergraduates Undergraduate Program Graduate Program INTERNSHIP APPLICATIONS Please note: The 2025 Session and Graduate Internship Applications are available. More Details If you have any questions, call or email: Kathleen McCarty, Director at 518-455-4704 or mccartyk@nyassembly.gov The N.Y.S. Assembly is an Equal Opportunity Employer Internship Links Revalidation for NCCRS(National College Credit Recommendation Service)"
