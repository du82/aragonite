full_description = "Geoffrey O’Brien Back on Catfish Row What is striking about Porgy and Bess in performance is how much freedom Gershwin’s music allows for the exploration of character. It gives space for unanticipated revelation, just as it allows a flexibility of approach. November 21, 2019 issue Fintan O’Toole Eyeless in Gaza What lessons do people actually learn from the cruelties they applaud and the ones they suffer in return? October 10, 2023 Henry James ‘The Touch of Autumn’ October: It might be an ado about trifles—and half the poetry, roundabout, the poetry in solution in the air, was doubtless but the alertness of the touch of Autumn, the imprisoned painter, the Bohemian with a rusty jacket, who had already broken out with palette and brush. October 23, 2016 William Dalrymple Murder in Karachi Two books about the barbaric murder of Daniel Pearl fill in the outlines of his life and death: the first, by his widow, is a moving tribute. The second, by Bernard-Henry Lévy, is a book of hate, riddled with errors. December 4, 2003 issue Charles Glass Letter from Mount Lebanon “The demise of ancient antagonisms should be a reason for hope in this hopeless land, but it isn’t. Ehden’s tranquility does not hide the fact that peace is precarious here.” December 10, 2023 Adam Hochschild Ku Klux Klambakes The Klan of the 1920s embodied the same racism as its predecessors, but served it up beneath a deceptively benign façade, in all-American patriotic colors. December 7, 2017 issue Stephen Jay Gould The Streak of Streaks “Joe DiMaggio’s fifty-six-game hitting streak is both the greatest factual achievement in the history of baseball and a principal icon of American mythology. What shall we do with such a central item of our cultural history?” August 18, 1988 issue Charles Rosen What Did the Romantics Mean? “‘Here is a man who has discovered the tragedy of landscape,’ said the French sculptor David D’Angers after visiting Caspar David Friedrich in his studio, and indeed Friedrich was one of the first European artists to restore landscape to the status of a major genre.” November 1, 1973 issue"
