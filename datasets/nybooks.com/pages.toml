description = 'To the Editors: In his discussion of my Brancusi: A Study of the Sculpture (August 21), James Ackerman says that I "was a student of the artist." Not so.'
full_description = "Facebook Twitter Threads .st0{fill:currentColor;} Bluesky Mail to Print page Submit a letter: Email us letters@nybooks.com In response to: The Shape of Things to Come from the August 21, 1969 issue To the Editors: In his discussion of my Brancusi: A Study of the Sculpture (August 21), James Ackerman says that I “was a student of the artist.” Not so. If I had been, my name would surely have been included in one of the book’s appendixes where I list “associates, students and assistants of Brancusi.” A small error, but significant of Dr. Ackerman’s neglect of the purpose of the book and its apparatus. I promised formal analysis and close examination. He criticizes me for not elaborating the philosophical, historical and psychological setting in which the sculpture was produced. This is like complaining that a microscope doesn’t afford a good view of the moon. Sidney Geist New York City This Issue November 20, 1969 Subscribe to our Newsletters Best of The New York Review, plus books, events, and other items of interest Email Address Continue Facebook Twitter Threads .st0{fill:currentColor;} Bluesky Mail to Print page This Issue November 20, 1969 Read Next James Ackerman The Shape of Things to Come August 21, 1969 issue Joe Kane The Boy Who Nearly Won the Texaco Art Competition a poem February 10, 2005 issue Joseph W. Alsop How Did Art Collecting Begin? December 21, 1978 issue Charles Hope On Francis Haskell (1928–2000) February 24, 2000 issue Joseph W. Alsop Art into Money July 17, 1986 issue Iris Murdoch Salvation by Words June 15, 1972 issue Richard Wollheim What is Art? April 30, 1964 issue Ernst Gombrich The Art of Collecting Art December 2, 1982 issue"
