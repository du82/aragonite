title = "About Us | The New York Review of Books"
description = "The New York Review of Books has established itself as “the premier literary-intellectual magazine in the English language.”"
full_description = "The New York Review was launched during the New York City newspaper strike of 1963, when the magazine’s founding editors, Robert Silvers and Barbara Epstein, alongside Jason Epstein, Robert Lowell, and Elizabeth Hardwick, decided to start a new kind of publication—one in which the most interesting, lively, and qualified minds of the time could write about current books and issues in depth. Readers responded by buying almost every copy and writing thousands of letters to demand that the Review continue. From the beginning, the editors were determined that the Review should be an independent publication; it began life as an editorial voice beholden to no one, and it remains so today. Silvers and Epstein continued as co-editors until her death in 2006, and Silvers served as sole editor until his death in 2017. Since 2019 Emily Greenhouse has edited The New York Review, and it remains the magazine where, across twenty issues each year, the major voices in world literature and thought discuss books and ideas. In addition to the print magazine, the NYR Online publishes thorough and wide-ranging essays about politics national and global, film, art, and the cultural preoccupations of the day. For more than sixty years The New York Review has been guided by its founding philosophy that criticism is urgent and indispensable. It is the journal where Mary McCarthy reported on the Vietnam War from Saigon and Hanoi; Hannah Arendt wrote her “Reflections on Violence”; Noam Chomsky wrote about the responsibility of intellectuals; Susan Sontag challenged the claims of modern photography; James Baldwin penned a letter to Angela Davis; Jean-Paul Sartre talked about the loss of his sight; and Elizabeth Hardwick eulogized Martin Luther King. In the pages of the Review, Joan Didion wrote a rigorous defense of the Central Park Five; Nadine Gordimer and Bishop Desmond Tutu described apartheid in South Africa; Václav Havel published his reflections from the Czech underground; Helen Vendler read poetry by everyone from William Wordsworth to Wallace Stevens; Timothy Garton Ash observed Eastern Europe after the Berlin Wall fell; Mark Danner reported on torture at CIA black sites; Janet Malcolm wrote about psychoanalysis, Diane Arbus, and translation; and Garry Wills wrote about American politics and the Catholic Church. Joan Acocella watched the work of Bob Fosse; Yasmine El Rashidi reported from Tahrir Square during Egypt’s Arab Spring; Darryl Pinckney wrote about Ferguson, Missouri; Namwali Serpell teased out the figure of the whore in literature and film; Zadie Smith charted two paths for the contemporary novel; Tim Judah reported from the outbreak of war in Ukraine; Sherrilyn Ifill wrote about the Supreme Court’s repeal of both affirmative actionand Roe v. Wade; Fintan O’Toole analyzed Trumpism; Aryeh Neier deplored the genocide in Gaza; and Martha Nussbaum defended the rights of animals."
