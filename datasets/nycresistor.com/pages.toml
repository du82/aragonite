title = "Feb 14 2025 : Build Your Own IoT Love Messengers – NYC Resistor"
description = "Participants will learn about Internet of Things technology by building a pair of Love Messengers, which make a great gift.In this Valentine's Day-special class, participants will build their very own pair of Love Messengers: a perfect gift for friends, partners and loved ones ?. Love Messengers are two IoT devices that are connected to each…"
full_description = "Feb 14 2025 : Build Your Own IoT Love Messengers classes Jan 272025 Participants will learn about Internet of Things technology by building a pair of Love Messengers, which make a great gift. In this Valentine’s Day-special class, participants will build their very own pair of Love Messengers: a perfect gift for friends, partners and loved ones ?. Love Messengers are two IoT devices that are connected to each other via a real-time database. When one Love Messenger is pressed, the other will light up, no matter how far apart they are. The class will provide all materials, and playfully introduce Internet of Things technology, basic coding (C++), electronics, and fabrication techniques. At the end of the class, everyone gets to take their love messengers home as a gift for a loved one. No prior experience necessary. Bring your own laptop! The class is $20/person, but we want our workshop to be accessible to everyone. If the $20 ticket is a barrier for you, we’d be happy to sponsor it—just let us know by reaching out to us at [email protected]. The instructors: Pepi and Julia are two NYC-based creative technologists passionate about open-source projects. “Love Messengers” is our first fully open-source tech project – over the years, we’ve refined its code and fabrication, and have taught this workshop at events like Siggraph 2024, Parsons Dorkshop and NYC Resistor. This is a masks optional event. As with all NYC Resistor events, this class is 18+ and governed by our Code of Conduct. The Code of Conduct, as well as accessibility information, can be found at www.nycresistor.com/participate/. Please note that refunds must be requested 24 hours in advance. If you have any questions, please email [email protected]. More info and RSVP Posted by Classes at 7:49 pm Tagged with: class Sorry, the comment form is closed at this time."
