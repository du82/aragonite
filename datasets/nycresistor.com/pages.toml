l sensors, wireless communication and all kinds of other yummy candy. hehe I really enjoy electronics as well… Dcny55 says: January 21, 2012 at 4:30 pm I have a project I would like to build but have no understanding of how to go about it. I want to light a tube with rgb flex strip inside to shine out various holes in it and also the open end , so that it would shine out into a room. I would like it to be controlled by a remote. Can you advise me or point me to a site that might be able to help? Thank You! David Robotics Hackathon says: February 10, 2012 at 6:40 pm We will be happy to have you as an organizer in NYC.We are challenging other cities to join Global Robotics Hackathon(March 2-4). We will ship FREE robots to each team and many other prizes(thanks to our sponsors Google and Robotshop) Register your team here: http://www.RoboticsHackathon.com Ge5 says: February 21, 2012 at 6:45 pm anyone know of workshops/classes in NYC area offering Open Frameworks? thanks…ge5 Boris Landoni says: April 3, 2012 at 12:49 pm I would like to suggest you this post: http://www.open-electronics.org/arduino-full-memory-upgrade-to-the-last-atmel-toolchain-version/ The actual Arduino compiler is not able to compile correctly sketches that require data areas larger than 64kWord. This version is an important enhancement in respect of the one included in the Arduino IDE and offers many advantages: – supports all the 8bit ATMEL microcontrollers families; – overcame the 128kB limit and compiles correctly sketches up to 256kB; – includes best and newest libraries; – outputs a most compact and efficient compiled object code. dirk v. ginkel says: May 16, 2012 at 12:05 pm Hi I would like to get in touch with a Arduino developer for tonight and tomorrow. I am working on a project now and I will pay for the help you give me. Please get in touch with me if you are interested! Sean Strebin says: June 17, 2012 at 11:12 pm Do you have a class C F.C.C. operator’s license? You will be fined for wire fraud. The Federal Communications Commissionand Canadian Broadcasting Company in Canada is fining illegal broadcasters and producers and seizing the equipment. Do you have any other telephony devices or transmitting equipment? Did you make any broadcasts on December 25, 2011? Fugitives Charles Sandoval (aka Paauwee), Fitzgerald, Christmas, Parvin, Mashaud, Henry, and Able were found impersonating law enforcement officers at the Kokomo Sheriff Department. They were using ham operating transmitters. This was turned over to the FBI in D.C.. Indiana correctional institutions and others across the United States are racketeering against names in government such as, Paul Bateman and Sherman Funk. Monica Bateman, Victoria Nevarez, Angela Omans, Monica Quick, and Anne Funk (Missouri) have been imprisoned over 14 years illegally. Greg Hendrickson, Utah, was found operating illegal ham units and impersonating an F.C.C. engineer. Hendrickson was using the F.C.C. website email. His associate, Steven Whitehead, was found using ham systems and other transmitting devices. He was involved in stalking and harassment of Hollywood actresses and workers going back to 1998. Whitehead was difficult in paying female employees of ethnic background. Steven Whitehead mentioned his father was retired from JPL and content writing computer software. Whitehead may be nvolde with Jet Propulsion Laboratory Amateur radio group which was cited for verious broadcast violations. These men may be responsible for the September 11 crashes. The F.C.C. is investigating public utilities fraud and 2-3 way party calling wire fraud. The Hollywood Reporter in Los Angeles, California reported that Michael Powell tried to pass a law that 2-3 way party calling is legal. Everyone or anyone can listen to your phone calls. The F.C.C. website is fraud and is being treated as such. Do not call the illegal broadcaster. Sean Strebin, F.C.C. engineer, east coast Mail says: July 1, 2012 at 6:22 pm Hi, I am a designer based in Brooklyn, looking for a partner who is very passionate about Solar Energy to engage in new product development. Please get in touch if you would love to hear more about it. Dave says: September 6, 2012 at 7:57 pm Hi. Just got txks for the Lazer class on 9/30. Then I realized I’m going to be at Makerfaire that day. Can I save my tkt for another class? Josh Greenberg says: November 25, 2012 at 11:29 pm Hi, I live on long island, and I’m 16. I’m into electrical design and engineering, and I spent the last summer at labs in UC Santa Barbara. I love tinkering with breadboards, LEDs, PCB boards, etc. Is there an age requirement to be a part of this community? Christine says: January 4, 2013 at 12:27 am Hello, Resistor Folks! Any hopes that you’ll be offering a welding class sometime in the near future? Thanks so much! Christine Nick Sund says: March 2, 2013 at 2:35 pm Anyone know of any hacker groups like this in Portland, OR? PeterNYC says: March 13, 2013 at 1:03 pm Hi electronic aficionados, I have a project I am working on and my friend who has been the electronics / microcontroller / sound member has to take a leave because of personal reasons. Wondering if anyone wants to join me and my friend who is a mechanical engineer as we build cool things. Caroline says: March 27, 2013 at 12:21 pm Come one come all! If you are a computing professional in the NYC area we want to hear your thoughts on the future of computing. Join us for a listening session with free beer and pizza at our DUMBO loft from 5:30-8:00pm on Monday April 1st. All interested participants should email [email protected] with your name, job function and favorite micro brew. serg says: April 5, 2013 at 8:42 pm Greetings, dear Resystor stuff ! Your email seems not to work, cause this letter is still not answered. (i sent it 8 days ago) . My name is Sergey – i’m a student of Strelka Institute, based in Moscow Russia. ( http://www.strelka.com ) I’m also experimental electronic musician and in charge of t