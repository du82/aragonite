title = "Contact – NYC Resistor"
description = "We are not equipped to accept visitors outside of our public nights. Please sign up for free tickets to ur Craft Nights or email us to set up an appointment. Email: contact [at] nycresistor [dot] com. There's now also a public Discord Server:  Join Here or reach out to our contact email for support."
full_description = "Contact We are not equipped to accept visitors outside of our public nights. Please sign up for free tickets to ur Craft Nights or email us to set up an appointment. Email: contact [at] nycresistor [dot] com. There’s now also a public Discord Server: Join Here or reach out to our contact email for support. Posted by Nick Bilton at 10:23 pm 110 Responses to “Contact” Comments (102) Trackbacks (1) Pingbacks (7) David perry says: May 27, 2011 at 2:58 am I believe your workshop has an age limit of eighteen years old I am under such a limit and I am looking for a lab to be able to build projects in, tips? Rstlne1234 says: June 6, 2011 at 1:52 pm Was your group featured in a WSJ artical? Negalvan says: July 5, 2011 at 10:44 pm Hoping to see and Android programming 101 class soon Ara says: July 21, 2011 at 6:05 am Good day NYC Resistor, I’m looking for any contact details (email, phone number or mail address) of the website owner or marketing person that I can communicate with for possible business venture on website income opportunities. We are very much interested to do business with you. Please send me an email together with your website name and I’ll be glad to call you to discuss this matter. Thank you Save your Precious Files now to TheDataLocker Online Backup! Checkout http://www.thedatalocker.com blu3nine says: August 10, 2011 at 2:34 pm Please more html/css classes! Jack says: September 27, 2011 at 3:29 pm Looking for a tech to convert cell phone screens into a monitor for an art project. Cool if it ends up as open source. contact [email protected] for details. VCRW says: November 21, 2011 at 6:04 pm Would you recommend a place on NYC where I can get Arduino boards /kits. I am visiting NY from Canada where online purchase wil cost us 1.5 more compare to what you pay there. So far I have found checked NYC computer store but there are some comments saying you must ne a student there. Thnak in advance Jascha TRON says: November 25, 2011 at 8:27 pm