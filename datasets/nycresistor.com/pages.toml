["https://www.nycresistor.com/2010/01/18/nycresistor-is-moving"]
title = "NYCResistor is Moving! – NYC Resistor"
description = "We're at the end of our 2 year lease at NYCResistor. We've grown out of our space. Classes are almost always full, the heat isn't on on the weekends, and the walls are stacked high with projects. It's been time to move for a while and now it's official. We've signed the papers and given…"
full_description = '''NYCResistor is Moving! Uncategorized Add comments Jan 182010 We’re at the end of our 2 year lease at NYCResistor. We’ve grown out of our space. Classes are almost always full, the heat isn’t on on the weekends, and the walls are stacked high with projects. It’s been time to move for a while and now it’s official. We’ve signed the papers and given notice and we’re moving to an awesome new space. The new space is really awesome. It’s about 10 blocks away from our current location and two blocks from the Atlantic Street station which is convenient for pretty much every train ever. It is almost 3x the space with two main rooms and a bunch of smaller rooms. There is a place for a kitchen although there is no kitchen in that place. We will have our own bathroom. The laser gets its own room. There is a loft already there and an archway. There is a stage with lots of room for presentations and probably an audience of 100-150. The ceilings are tin. There will be more room for more awesome. The downsides are that there is no passenger elevator (only a very old freight elevator) and that the space needs a lot of work to get to be the cozy space we want it to be. There aren’t concrete floors like our current space, but there is a fire escape and sprinklers in the event of an emergency which is an upgrade from our current space. We get to control the heat, but we have to pay for it. We’re excited about the possibilities and freaked out by the amount of money it is going to cost us to move so stay tuned for a fund-raising post. Over all, we’re thrilled to make more space for more hacking in 2010! We have to be out of our current place by the first of March, so expect the last two weeks of February to be a little busy in terms of our schedule. If you’ve got questions, drop them in the comments and we’ll try and answer them! Posted by Bre Pettis at 4:11 pm 15 Responses to “NYCResistor is Moving!” Comments (14) Pingbacks (1) alexknowshtml says: January 18, 2010 at 8:29 pm awesome news, congrats NYC Resistor! Reply Russ Nelson says: January 18, 2010 at 8:32 pm Ooohhhhhhh, a tin roof! That's one sixth of a Faraday cage! Fire up the spark generator! The klystron! The Tesla coil! Man, it sounds like you guys are having a great time. I wish I lived in Brooklyn … or that I lived somewhere large enough to support a hackerspace. Reply Facebook User says: January 18, 2010 at 8:36 pm sounds great, can just imagine what's possible in your new space. we just founded out hackerspace in bangkok. we got a small group, but long way to go until it's cozy. Reply Tiago Henriques says: January 18, 2010 at 9:13 pm cool! 😉 congrats for the new space! looking forward to see some pictures! Reply noel hidalgo says: January 18, 2010 at 9:37 pm HOLYCIRCUTS BATMAN! @NYCresistor is going to have a presentation space for 100 – 150 people! Reply aestetix says: January 18, 2010 at 9:41 pm Wow, congrats! That's awesome to hear! Reply Pyrodogg says: January 18, 2010 at 9:42 pm Congrats guys! *Now even more jealous that I don't live in NYC Reply JC says: January 18, 2010 at 11:46 pm Congrats on your new space! Sounds freaking awesome! I hope to be able to drop by between HOPE and Defcon next summer. Hack on! -jc from labitat.dk Reply Eric says: January 19, 2010 at 1:49 am I can only speak for myself, but I think if you put out an APB on moving day, you'd get an army of mutants to come help out for the cost of pizza. Reply mightyohm says: January 19, 2010 at 7:24 am Congrats, NYCR! Reply mightyohm says: January 19, 2010 at 7:24 am Congrats, NYCR! Reply Threemoons says: January 19, 2010 at 6:56 pm So I take it that classes will take place at the OLD space until the move? Just double-checking 'cause it would suck to get up on a Saturday AM, haul butt out to DUMBO, and then realize that I was in the wrong place. 😀 Reply kellbot says: January 20, 2010 at 10:57 pm Yep, they're in the old space until we're settled into the new one. Don't worry, we'll make it super clear once we switch class locations! Reply plunkman says: January 22, 2010 at 2:39 am Close to Atlantic Avenue is great! Now I can take the train from Long Island in. Reply Leave a Reply Cancel reply Your Comment You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name (required) E-mail (required) URI Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
