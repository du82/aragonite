["https://www.nycresistor.com/2008/08/28/how-to-identify-polymers-with-burnination"]
title = "How to Identify Polymers with Burnination – NYC Resistor"
description = "Confirmed: Moleskine notebooks contain PVC or other chlorinated plastics. Do not laser cut them for your safety and the safety of your laser cutter. Adam brought his laptop in to etch today. As we all know, laser cutting PVC is bad and releases chlorine gas (which is corrosive and bad for you and your machine.)…"
full_description = '''How to Identify Polymers with Burnination Uncategorized Add comments Aug 282008 Confirmed: Moleskine notebooks contain PVC or other chlorinated plastics. Do not laser cut them for your safety and the safety of your laser cutter. Adam brought his laptop in to etch today. As we all know, laser cutting PVC is bad and releases chlorine gas (which is corrosive and bad for you and your machine.) Adam’s laptop was made of an unknown polymer, and we wanted to make sure we didn’t damage our new lazzzor. Luckily, there is an easy way to determine if a plastic is okay to etch. Watch the video below, and check out this guide to polymer identification for full details. There is actually a suite of tests you use to determine the type of plastic, but the burning one is the most fun, as well as the one that detects chlorine. Enjoy! Polymer Identification by Burnination from Zach 'Iowa' Hoeken on Vimeo. Posted by hoeken at 12:23 am 24 Responses to “How to Identify Polymers with Burnination” Comments (20) Pingbacks (4) phooky says: August 28, 2008 at 12:40 am Oh god. That’s… that’s really what my voice sounds like, isn’t it. I’m going to laser-etch my trachea next. Reply Edwin says: August 28, 2008 at 9:41 am Oh yeah, I hear yah; it’s always disturbing to see/hear yourself (though I suppose you can get used to it with practice). I see myself in pics or video and I’m always, omg, what dork! Reply Edwin says: August 28, 2008 at 9:46 am Oh yeah, Chlorine; for extra credit in junior high science class, I made a quart jar of chlorine. My teacher, clearly, was an idiot. When I aired it out after class, a huge mistake, I ended up with the most amazing headache. Reply Dave says: August 28, 2008 at 12:51 pm If Chlorine is bad, Fluorine should also be bad. Thus, you probably shouldn’t burn/laser-etch Teflon: http://en.wikipedia.org/wiki/Polytetrafluoroethylene But, the question is, what will the flame test response be for Fluorine? Reply winnie says: August 28, 2008 at 12:59 pm i love you, phooky. you are the awesome. Reply phooky says: August 31, 2008 at 2:41 pm PTFE appears to be reasonably safe. Fluorine is so electronegative I doubt our puny laser can pry it from whatever it’s currently bound to. Reply Richard says: January 7, 2010 at 8:12 pm Never burn PTFE, it's fumes are cacinogenic, maybe fluorine? Reply osnos says: October 6, 2010 at 10:14 pm Fluorine is correct. Which, with the available hydrogen in the atmosphere (moisture), will form hydrofluoric acid. It will likely fog up your glass optics. Don't burn PTFE. Reply Seth Morabito says: September 2, 2008 at 4:14 pm Phooky, you’re famous! And to think I knew you when you were a NOBODY. Reply Arthur says: September 4, 2008 at 6:48 pm here’s the chemistry basis… the copper ions from the solid copper wire combines with the freed up chloride (in the burnt plastic) to form copper chloride… which burns green: http://jchemed.chem.wisc.edu/jcesoft/cca/cca2/MAIN/FLAME/CD2R1.HTM Reply Arthur says: September 4, 2008 at 6:51 pm also remember that a propane torch releases CO (ie: carbon monoxide) which is poisonous. If you get a headache while burning “safe non-PVC’s”, it could be because of the CO. Reply Darin says: January 24, 2009 at 3:49 pm thanks for putting this up, as a pipefitter/welder, I’m all the time put in positions where things around me get burned up, now I can at least test some of them to know what I should absolutely have removed before I get at what I’m working on directly. The air I breathe sometimes is bad enough, I certainly don’t need chlorine too. Reply Lynne Angeloro says: March 5, 2009 at 2:03 am GREAT info on keeping us from being dead! We’ll use this flame test here at TechShop to be sure no one kills us all in a cloud of Chlorine gas with one of our 2 laser cutters! THANKS! Lynne. Reply Ernie says: June 1, 2009 at 3:00 pm Hi. How much would it cost to perform a burn test of some heavy cardboard? I need to determine the degree of scorching it will suffer if I use it to laser cut a design. Thanks Ernie Reply shiiitt?? says: December 28, 2009 at 4:23 am whoa whoa whoa wait i got these lighters from beijing that are shaped like olympic torches that light green fire….shit? or is something else causing green fire? Reply RoganGunn says: July 21, 2010 at 3:47 am No, don't worry – there are LOADS of different greens caused by various elements. In those lighters they use a metal compound to give off certain colours. Vibrant green is nickel and it's compounds/salts, or bluey-green may be a copper compound. All the harmful stuff would be too expensive to put on a cheapo lighter. (E.g. Barium or Boron compounds.) There's an admittedly incomplete list here: http://en.wikipedia.org/wiki/Flame_test Hope this helps! Though you should have paid attention in chemistry at school… 😉 Reply Jerry Rutherford says: June 29, 2011 at 2:20 am Very nicely done. I have been looking up the data sheets, etc. This is a good quick test. Thanks! (I have a 35w Epilog laser) I wonder how SPECTAR plastic will react? It smells VERY sweet… and even a tiny amount will make you woozy… so it is likely VERY BAD to burn it. http://www.eastman.com/Products/Pages/ProductHome.aspx?Product=71002011&list=Polymers but you can heat form it very well. Reply Anonymous Coward says: April 25, 2012 at 3:15 pm Thanks for posting this! This video says that laser cutting ABS is “safe”. IT IS NOT SAFE Laser cutting/etching of ABS produces hydrogen cyanide. Yes, the same stuff they use to execute people in a gas chamber. Reply Nathan says: November 19, 2012 at 11:15 am ABS is safe to cut, and does not contain chlorine Reply anonymous coward says: November 19, 2012 at 1:22 pm I didn’t say ABS – > chlorine. I said ABS – > hydrogen cyanide which is much worse and easier to kill yourself with without knowing you’re hurting yourself. Its like CO but much more potent. Go look at the Wikipedia page for ABS. I have many years of experience in the laser industry. Please don’t give safety advice if you’re not qualified to do so. Just because you haven’t killed yourself yet doesn’t mean that someone else reading this can’t beat you to it. Reply Leave a Reply Cancel reply Your Comment You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name (required) E-mail (required) URI Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
