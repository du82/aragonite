title = "Apr 02 2025 : Intro to Soldering Workshop – NYC Resistor"
description = "Soldering is one of the most important skills you'll need for working with electronics. Come join us for an introductory through-hole solderSoldering is one of the most important skills you'll need for working with electronics. Come join us for an introductory through-hole soldering workshop. Soldering enables you to create sturdy connections between electrical components. In…"
full_description = "Apr 02 2025 : Intro to Soldering Workshop classes Feb 222025 Soldering is one of the most important skills you’ll need for working with electronics. Come join us for an introductory through-hole solder Soldering is one of the most important skills you’ll need for working with electronics. Come join us for an introductory through-hole soldering workshop. Soldering enables you to create sturdy connections between electrical components. In this hands-on workshop, you’ll learn how to use a soldering iron safely and effectively, and get plenty of practice with both soldering and de-soldering techniques. We’ll be soldering up some Game of Life kits – LED tiles that generate nifty animations. No previous experience is required, making this introductory workshop a great choice for anyone who’s curious about getting started with hardware tinkering! All materials will be provided. OK, awesome, I want to join! Please be ready to start at 12 pm! We find that you will need this time to get through the whole class. Our classes tend to sell out about a week in advance so if you’re interested, you may want to sign up early. This class will be taught by Resistor member Raphael Abrams. As with all NYC Resistor events, this class is 18+ and governed by our Code of Conduct. The Code of Conduct, as well as accessibility information, can be found at www.nycresistor.com/participate/. Please note that refunds must be requested 72 hours in advance. If you have any questions, please email [email protected]. More info and RSVP Posted by Classes at 4:24 pm Tagged with: class Sorry, the comment form is closed at this time."
