description = "Noisebridge, a hackerspace in San Francisco, is awesome. It's a very open and wonderfully chaotic space. I have been co-hacking from here while in town and it's got a fantastic vibe. This picture shows about half of the space. Behind me are two classrooms, a kitchen, a server room, bathroom and more rooms being built…"
full_description = 'Acres of Hacking: Noisebridge! Uncategorized Add comments Oct 242009 Noisebridge, a hackerspace in San Francisco, is awesome. It’s a very open and wonderfully chaotic space. I have been co-hacking from here while in town and it’s got a fantastic vibe. This picture shows about half of the space. Behind me are two classrooms, a kitchen, a server room, bathroom and more rooms being built out. They have one rule: “be excellent to each other.” I took a bunch of pictures. Check them all out! Posted by Bre Pettis at 6:57 pm 5 Responses to “Acres of Hacking: Noisebridge!” Comments (4) Trackbacks (1) nycdesigner says: October 24, 2009 at 8:28 pm It was great to “run” into you the other night over there. I definitely got a great vibe about the space, and was wowed by the sheer square footage and lighting brightness! And lots of lounge area too. Reply jonas says: October 27, 2009 at 4:50 am aww, im so jealous! the new place looks so great! Reply Jackson says: November 9, 2009 at 3:38 pm Wow! What an amazing looking space! Thanks for sharing your photos, Bre. Reply Jackson says: November 9, 2009 at 8:38 pm Wow! What an amazing looking space! Thanks for sharing your photos, Bre. Reply Leave a Reply Cancel reply Your Comment You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name (required) E-mail (required) URI Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
