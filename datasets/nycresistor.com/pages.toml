title = "Participate – NYC Resistor"
description = "Participate: We like friendly people who like to think about how things work. We are not equipped to accept visitors outside of Craft Nights. Please come to Craft Night, or email us to set up an appointment. Come hang out with us at Craft Night every Monday and Thursday night! RSVPs for Craft Night are…"
full_description = '''Participate Add comments Participate: We like friendly people who like to think about how things work. We are not equipped to accept visitors outside of Craft Nights. Please come to Craft Night, or email us to set up an appointment. Come hang out with us at Craft Night every Monday and Thursday night! RSVPs for Craft Night are appreciated (but not required) via our Eventbright here. Craft Night happens almost every Thursday and Monday from 6:30pm until we get tired and go home. These are our public nights: stop by and meet people, share knowledge, and work on your projects. Don’t forget to bring a project to work on! Please check the calendar and read the front page of the blog for announcements and changes. We also host Masks On Craft Night every First Friday and Third Wednesday. We teach classes and have occasional parties where we dress up. Come by and say hi during a public event, we’d be happy to meet you and show you around. Check our EventBrite page and our Google Calendar for upcoming events. You can also join our Facebook group and read this blog to stay informed. There’s now also a public Discord group, here’s the signup link. Membership: Resistor is a private space in which members pay monthly dues. Membership to NYC Resistor involves some process, but step 1 is to say hi at the next Craft Night! Friends of NYCR is a way for non-members to support NYCR. It is completely optional, and immensely appreciated. If you enjoy our public events, classes, and craft nights, consider becoming a Friend of NYCR. Accessibility: There is a short set of stairs leading to our building’s front door (5ish steps). Resistor is located on the fourth floor. If you would like to use the elevator, please ring the buzzer and a member will bring the freight elevator down; otherwise, you will need to use the stairs. Code of Conduct If you’re visiting us, we ask that you abide by our code of conduct: Welcome to NYC Resistor. We are here to learn, share, and make. We want everyone to feel comfortable asking questions, trying new things, and making mistakes. We ask that your conduct be guided by the desire to help us create an inclusive, encouraging, and diverse environment free of intimidation and harassment. We are an eighteen and over facility. Comments, actions, or visual displays which demean, harass, or insult others are not permitted. This includes those which target a person’s race, creed, ethnicity, age, religion, gender, gender identity, sexual orientation, physical appearance, or ability. NYC Resistor reserves the right to summarily eject you if you recklessly endanger others, act in violation of the code outlined above, or otherwise behave poorly. If someone is abusive or causes you to feel uncomfortable, you can email the Code of Conduct Committee at [email protected]. You can also ask any NYC Resistor member for help. This code of conduct is neither exhaustive, nor complete. It serves to distill our common understanding of a safe, collaborative space. The Code of Conduct Committee is a rotating group of NYC Resistor members. We will respond to any reports within 7 days. If you have a complaint which requires a CoC Committee member to recuse themselves, you can alternatively contact a member of the current committee directly. For 2024-2025, the current members are: Raph Woody Benalene Winston Posted by Eric Skiff at 10:54 pm 44 Responses to “Participate” Comments (38) Pingbacks (6) Jordan Bowden says: January 27, 2008 at 11:56 pm I listened to the whole CCC interveiw with you, and ive always been interested in this kinda stuff, i think what your doing is really, really cool, but, i live in London Ontario Canada, i wish there was something like this here! Reply Chris says: March 18, 2008 at 5:16 pm Why don’t you start one where you live? Reply Wasim Akhtar says: April 30, 2008 at 3:13 am I am wasim akhtar, i am working in a bank as system manager. I want to joint your co. for the sake of sharing knowledge. Regards, Wasim Reply amit kumar giri says: May 18, 2008 at 6:47 am sir i want to learn the mobile hacking process, because in this day i m too tence. because some people try to make a false call at my mobile no and every day blackmail me. so in my self i want to learn how can i keep record the mobile and the person without contact with any other orgnization thank you Reply Graham says: January 20, 2009 at 5:18 pm @ Jordan Hey fellow Ontarian? Ontonion? I completley agree! You may want to check out HackLab.to I believe they are ontario based…. if you live around Toronto No Worries, Graham Reply Diego Toala says: January 21, 2009 at 12:08 pm Hi it’s nice to hear about NYC Resistor and all your work, I move to NYC , I’m from Ecuador, South America, I don’t speak English at all and I wanna participate in your community but I don’t know if there’s a problem with my English skills? Thank you and congratulations Reply LokiClock says: November 2, 2010 at 6:36 pm If you have a friend who speaks better English, even if they don't speak Spanish, you'll want to bring them. If you were able to type that without a translation dictionary, you'll be able to meet some people even if you don't end up getting to talk about projects. Reply Chema says: November 4, 2009 at 11:01 pm Thanks for your space, we need more of it ! Reply Chema says: November 5, 2009 at 5:35 am Thanks for your space, we need more of it ! Reply bettyx1138 says: November 19, 2009 at 4:36 pm the irc java client on this page no werky Reply bettyx1138 says: November 19, 2009 at 9:36 pm the irc java client on this page no werky Reply markalanb says: March 8, 2010 at 6:55 pm I live in Phoenix Arizona and would like to find out if you know of a similar group out here. I work at a local theater as a set builder, actually work is the wrong word as I volunteer there to build the sets. I am always looking for ways to make sets work on a very limited budget. Reply Vandal968 says: November 1, 2010 at 9:45 pm Markalanb, I realize that I'm replying to an old post, but just in-case you haven't found it already, there is a hackerspace in Phoenix called Heatsynclabs.org stop by and check us out (if you haven't already.) cheers, v Reply Maleyna says: July 13, 2010 at 4:21 am Ah! this site is not iPad friendly. The font is the same color as part of the background. Please fix. This site looks like it rules and I wanna read it! Reply kellbot says: April 22, 2011 at 1:55 pm I’d argue that the iPad is not web friendly, rather than the other way around. Reply Jason says: June 28, 2013 at 6:46 pm Where is my like button? Reply Christine Bryce says: January 14, 2011 at 9:44 pm Do I have to be a member to attend a workshop? Reply Herb says: January 17, 2011 at 11:27 pm No, you do not have to be a member. These are public workshops. Please attend! Reply Artemis Fowl951 says: December 4, 2011 at 8:02 pm Is there an age minimum for classes? Would my relatively mature 12 year old be able to participate in some beginner workshops? Reply Nicole says: May 11, 2013 at 5:05 pm Hi – I am not at all affiliated with the good folks of NYC Resistor, and I hope they don’t mind my spreading the word about my own program on their site, but the Lab for Robotics Education is organizing a free robotics summer program for NYC high school students this summer – you should check us out at http://thelare.org/ and encourage your child to apply! Thanks! 🙂 Reply TarlSS says: March 5, 2012 at 3:00 pm Are there any classes on how to use a mill, CNC or manual? Any suggestions where I can learn to use one? Reply Joseph Chagan says: May 23, 2012 at 11:01 pm Does the Web Dev Study group still meet weekly? I don’t see it on the Calendar. Reply Kate, please ask raf, ok? says: May 24, 2012 at 2:29 pm What time are the strippers coming? Reply pbenco says: June 21, 2012 at 7:49 am Hello, i’m ben, french user of the TMP/Lab, and i have plan to go visiting you tonight 21, around 7pm, is it possible? Should i bring some beer (french tradition, US too?). I’m a robot addict, focused on LEGO NXT & TETRIX, but 3D printing interessed me a lot, to enable new pieces not provided by LEGO, electronic based hack for new sensors, and SDR. Reply Stuart Uram says: May 2, 2013 at 5:07 pm I am working on a project to 3-D print ceramics and looking for an association with some one interested in ceramics, modelling and has mechanical skills. Not all required, I can supply some of each. Could lead to a part time or full time job. Reply eberle eberle says: May 9, 2013 at 6:26 pm I’m curious about your project. Are you making a printer ? – Joseph Reply Nicole says: May 11, 2013 at 4:46 pm Hi! NYC Resistor looks awesome. Just wondering, what happens at Craft Night? Is it sort of a hack on whatever you want event, or is there a planned activity? Should I be bringing my own materials? Thanks! (Also, @Eric Skiff – I love your music! I listen to the Resistor Anthems all the time. 🙂 ) Reply ericskiff says: May 15, 2013 at 1:23 am Hi Nicole! Thanks – so glad you like the tunes! 🙂 Craft night is generally a time when people bring their own projects and hack around the tables and ask each other for advice and help on what they’re hacking on. That said, we do have a new project that’s on the wall expressly to be hacked on by craft night attendees! The Glowpanel is 40 superbright pixels of diffused color awesomeness and waiting for you to hook it up with animations, etc! Reply enrico sinatra says: November 27, 2013 at 4:32 pm Hi from Sicily, Banzi talk about you! If I will live in Ny, I will be a member of this group. Reply nightnyc says: December 23, 2013 at 2:03 am We have a very interested project running on called http://www.nightnyc.net We are looking for feedback of users. Please share! Reply Steve Kirkne says: January 29, 2014 at 10:45 am This looks amazing I wish I lived in NY next time I visit ill have to stop by and show you what I do someone who is a member there email me please . [email protected] Reply Erica says: January 12, 2015 at 11:36 am Hi – does your age requirement apply to classes? With or without parents along to supervise/participate? Thanks. Reply Kim Gerard says: April 8, 2015 at 10:01 am What a great initiative! Reply Simcha Jaskiel says: August 11, 2015 at 10:30 pm Hi I’m working on building a wall mount pc and i”m trying to make it out of aluminum. i thought i did enough research on and i would be able to bend the piece with a homemade brake, it didn’t work 🙁 just wondering if you guys have any tools for shaping sheet aluminum that would be awesome. Reply AnalogKid17 says: April 8, 2016 at 4:08 pm What is the average age of members? Do you have people in their 30s and 40s ? Reply Billie Ward says: July 14, 2016 at 11:37 pm Yep. Reply Rashmi Kapoor says: February 15, 2017 at 12:52 am Learn Best Android Tutorials For Freshers as well as Experienced from here http://abhiandroid.com/ Reply Glen Beestone says: July 30, 2019 at 12:40 pm i’m a member of Newcastle MakerSpace in UK (Newcastle is where the only UK Makerfaire is ( was) ) and I’m going to be working in NYC throughout August. i’ll be traveling light so sadly I’ll not have anything to bring along to work on, but I’d love to pop in and see the place and chat to people if that’s OK ? Reply Leave a Reply Cancel reply Your Comment You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name (required) E-mail (required) URI Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
