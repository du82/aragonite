["https://www.nycresistor.com/2025/02/12/mar-02-2025-machine-embroidery-with-ink-stitch-hands-on-workshop"]
title = "Mar 02 2025 : Machine Embroidery with Ink/Stitch – Hands-On Workshop! – NYC Resistor"
description = "Learn to create stunning embroidery designs using Inkscape + Ink/Stitch!This workshop is perfect for beginners and hobbyists looking to dive into machine embroidery using Ink/Stitch (InkEmbroidery)—a free and powerful extension for Inkscape. You’ll learn how to design, digitize, and stitch your own patterns with confidence! What You’ll Learn: Setting up Ink/Stitch (InkEmbroidery) in Inkscape Creating…"
