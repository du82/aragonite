["https://www.nycresistor.com/2025/02/26/mar-09-2025-diyaudio-nyc-march-meetup"]
title = "Mar 09 2025 : diyaudio.nyc March Meetup – NYC Resistor"
description = "Resistor hosts a meetup for the diyaudio.nyc group, and invites anyone to come learn about making your own home audio gear.diyaudio.nyc has regular meetups to share recent DIY projects (speakers, amps, preamps, tubes and solid state - anything home-audio related), as well as talks and demos on related topics and skills (how to solder, how…"
full_description = "Mar 09 2025 : diyaudio.nyc March Meetup classes Feb 262025 Resistor hosts a meetup for the diyaudio.nyc group, and invites anyone to come learn about making your own home audio gear. diyaudio.nyc has regular meetups to share recent DIY projects (speakers, amps, preamps, tubes and solid state – anything home-audio related), as well as talks and demos on related topics and skills (how to solder, how digital crossovers work, fabrication techniques, digital room correction, etc). Building your own gear doesn’t have to be a solitary hobby anymore… has regular meetups to share recent DIY audio projects (speakers, amps, DACs, etc – anything home-audio related), as well as talks and demos on related topics and skills (how to solder, how digital crossovers work, fabrication techniques, digital room correction, etc). This month we’ll show you how to build your own Raspberry Pi streamer (anyone can build one of these!), as well as some new speaker and amp projects members are working on. (If history is any guide, at the end of the meetup some of us will want to keep talking about projects and we’ll move to a bar nearby – join us!) Have a project you’d like to share? We want to hear about it. Have a project to share? Email [email protected] with the details. Who should come? Open to anyone interested in DIY home audio who wants to learn and make some new friends – all experience levels welcome. If you’ve ever wanted to build any audio gear, we’re here for you. (We generally don’t focus on production, live sound, musical instruments, or making music, although there certainly is some overlap.) Note from the organizer, Pete: I started diyaudio.nyc a couple years ago because I wanted to meet some like-minded folks near me – I knew they were out there. And they are! Thank you for being a part! Let’s grow this group! These days, for me, it’s all audio all the time – I work as a Buyer for The Music Room buying high end audio equipment, and also offer complete classes to build your own equipment as Gowanus Audio. This is a masks optional event. As with all NYC Resistor events, this class is 18+ and governed by our Code of Conduct. The Code of Conduct, as well as accessibility information, can be found at www.nycresistor.com/participate/. If you have any questions, please email [email protected] More info and RSVP Posted by Classes at 1:42 pm Tagged with: class Sorry, the comment form is closed at this time."
year_published = 2025
