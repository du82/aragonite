full_description = "Mar 30 2025 : Meal Prep 101: Thai! classes Comments Off on Mar 30 2025 : Meal Prep 101: Thai! Mar 032025 Hey there! Join us for Meal Prep 101: Thai! where we’ll be trying out new recipes and techniques for easy, delicious meal prepping! Meal Prep 101: Thai Date: Mar 30, 2025 Time: 5PM EST Location: NYC Resistor Welcome to Meal Prep 101: Thai! The thesis of this series is to teach and practice basic knife skills, increase comfortability in the kitchen, and develop knowledge of flavor combinations, portion-size, produce selection, and active refrigerator inventory to better feed oneself with healthy, delicious, and affordable meals. Each class will take home between 3 and 8 portions of pre-prepared, or low-effort meals along with spice blends, marinates, and other kitchen essentials to make cooking easier and better at home. Meals will center around vegetables. Groceries will be PROVIDED with RSVP. Please discuss for other dietary restrictions or allergies before attending. We will do our best to accommodate. Menu: Thai Curry Mushroom Prep Thai Chili, Fish sauce TBD Masks optional Paypal/Zelle is under phone number 631 371 1168 Venmo is @winston-chiang Instagram is @ouroboros.in.reverse More info and RSVP Posted by Classes at 10:45 am Tagged with: class Mar 28 2025 : Synthesizer Night @ NYC Resistor classes Comments Off on Mar 28 2025 : Synthesizer Night @ NYC Resistor Feb 262025 Gathering musicians, enthusiasts, and curious minds to connect, collaborate, and share their passion for synthesis. BYO synth encouraged! Join us at NYC Resistor, a makerspace in Brooklyn for an electrifying Synthesizer Night! Get ready to unleash your creativity, explore sonic landscapes, and connect with fellow synth enthusiasts in an evening dedicated to the mesmerizing world of synthesizers. This is a pay-what-you-wish event (recommended donation $8). Synthesizer Night at NYC Resistor is a celebration of all things synthesizer. Whether you’re a seasoned musician, an avid collector, or simply fascinated by the possibilities of electronic sound, this event offers a unique opportunity to gather with like-minded individuals and revel in the captivating soundscape of synthesizers. At Synthesizer Night, participants are encouraged to bring their own synthesizers, from vintage analog gems to cutting-edge modular wonders. It’s a chance to showcase your personal setup, experiment with new equipment, and dive into the rich sonic tapestry that synthesizers offer. For those looking to enhance the collaborative experience, consider arriving early to connect your synthesizer to a MIDI/CV clock. This allows for synchronized timing among all instruments, creating a seamless musical fusion during impromptu jam sessions. In addition to the collaborative jam sessions, the event provides a unique opportunity for a show and tell/play with anything that attendees bring. Share your favorite gear, experiment with different setups, and engage in hands-on exploration of various synthesizers and electronic music equipment. The event unfolds in a relaxed and welcoming atmosphere, providing a platform for musicians, enthusiasts, and curious minds to connect, collaborate, and share their passion for synthesis. Whether you’re a beginner seeking guidance or an expert eager to inspire others, Synthesizer Night is the perfect setting to engage in conversations, exchange knowledge, and foster a vibrant community. Throughout the evening, you’ll have the opportunity to engage in impromptu jam sessions, where the collective energy of multiple synthesizers intertwines to create awe-inspiring sounds. Experience the joy of collaborating with fellow musicians, experiment with different genres and styles, and let the unique characteristics of each instrument shape your sonic explorations. Additionally, for those who wish to showcase their skills and perform, there will be dedicated performance slots. Take center stage, captivate the audience, and let your creativity soar as you demonstrate the full potential of your synthesizer setup. To sign up for a performance slot, email [email protected] or join our Discord and post to #synth. Whether you’re an ardent synth enthusiast, an aspiring musician, or simply curious about the captivating world of synthesizers, Synthesizer Night at NYC Resistor is an event that will inspire, educate, and leave you in awe of the boundless possibilities that electronic sound offers. Don’t miss this opportunity to immerse yourself in an evening of music, collaboration, and innovation. Mark your calendars, pack up your favorite synths, and join us at NYC Resistor for a night you won’t soon forget. We can’t wait to see you there! This is a masks optional event. As with all NYC Resistor events, this class is 18+ and governed by our Code of Conduct. The Code of Conduct, as well as accessibility information, can be found at www.nycresistor.com/participate/. More info and RSVP Posted by Classes at 1:45 pm Tagged with: class"
