title = "Contact – NYC Resistor"
description = "We are not equipped to accept visitors outside of our public nights. Please sign up for free tickets to ur Craft Nights or email us to set up an appointment. Email: contact [at] nycresistor [dot] com. There's now also a public Discord Server:  Join Here or reach out to our contact email for support."
full_description = "Contact We are not equipped to accept visitors outside of our public nights. Please sign up for free tickets to ur Craft Nights or email us to set up an appointment. Email: contact [at] nycresistor [dot] com. There’s now also a public Discord Server: Join Here or reach out to our contact email for support. Posted by Nick Bilton at 10:23 pm 110 Responses to “Contact” Comments (102) Trackbacks (1) Pingbacks (7) Glen Sundin says: February 9, 2015 at 8:50 pm If anyone from your group is in college or younger you should check out http://www.youngmindawards.com You all create some cool stuff and may have a project worthwhile. Glen Sundin, Executive Director, Young Mind Awards Sam says: July 27, 2015 at 4:23 pm I have various electronic components that could be useful to your group. I am a retired electronics systems engineer that had a development lab at home, and now am interested in donating many RF capacitors, coil winding parts, resistors, capacitors, ICs, transformers, inductors, analog test equipment..etc. I even have a 535 and a 545 (plus manual)Tektronix scopes that need CRTs. I f you have any interest please contact Sam at [email protected]. Brad Smith says: September 23, 2015 at 8:33 am Regarding Ahmeds Clock.For my little attempt to deal with the technology education issue (kids and adults) I have started ahmedsclock.org. It’s pretty rudimentary right now. If anyone feels like contributing content, or being an admin, I could use all the help I can get. Thanks. ljh2000 says: November 11, 2015 at 6:13 am Hi, there, I teach at a public elementary school in the Bronx and am on your mailing list. During my time here I’ve founded and expanded our school’s robotics club in addition to co-coaching a Lego robotics team, had visiting faculty from Fordham and NYU Polytechnic present their robots, entered our elementary school in an invention competition that only took high schools on before, and am furthering our collaboration with NYU Poly to use robots to measure the environmental health our our community. We’ve also had our children lead robotics workshops for autistic students, a practice we’ll expand in the coming year. I need your help to make our robotics club even better. I’m seeking anyone who’d want to visit on a Friday anytime in November to January between 12:50 and 2:20 who builds robots and might want to show off their work and talk about it. If anyone wants to help lead a simple robotics project for our kids, that’s great, too. We don’t have money to offer… just a bunch of great kids who will be the next generation of makers and builders. Oh, if you can pass along this link, that helps too. It’s a DonorsChoose project to bring more robots to our school: http://www.donorschoose.org/project/robot-invasion-iv-the-end-of-the-trilog/1765769/?rf=link-siteshare-2015-11-teacher-teacher_691947&challengeid=121455 Thanks, Lee javierxgamer says: January 22, 2016 at 6:10 pm i’m interested in this group but I’m living in Spain. Can I participate with us via online? Tanya James says: May 20, 2017 at 10:38 pm Do you have an amazing idea that can disrupt or bring about a change in the following categories: Health tech, active wear, footwear or urban apparel Can you incorporate cutting edge technology into that design? If you feel you need training… please attend our free design meet ups by clicking on this link to register. http://meetu.ps/c/2CS…. You have four months to design the next best fashion tech wearable. The winners will have design exhibited during our annual Microsoft Fashion Tech Week NY “Internet of Fashion” 2017 and Awarded prize September 17-20, 2017. Submissions begin May1, 2017 at http://theinternetoffashion.com https://uploads.disquscdn.com/images/e9ae140df790066c1e15cac4191d03f0ff598ad36fa9943f669b6208a96ed538.jpg Felipe J Ruiz says: June 25, 2017 at 10:08 pm I am interested in data science projects, im new at this endeavor would like to meet , chat, join hacks etc. – please advise « Older Comments"
