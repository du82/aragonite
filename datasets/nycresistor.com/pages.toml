full_description = "Feb 16 2025 : Spy Kids Watch Party classes Feb 062025 Spy Kids, an ageless masterpiece, will be screened for free for an audience of exclusively earnest adults. 24 years later, we haven’t forgotten. Spy Kids is an ageless masterpiece which brought into our lives such notable creatures as Thumb-Thumbs, Fooglies, and Alan Cumming. The film deftly used whimsy and humor to explore, through a critical lens, the impacts of artificial intelligence and the role family plays in community building. The Library of Congress concurs, having recently selected the film for preservation in the United States National Film Registry for its cultural significance. For this reason, we have chosen to host a screening of Spy Kids 1. Join us to revel in Robert Rodriguez’s creative prowess. Light snacks will be provided. Costumes encouraged. https://youtu.be/qzlwriXWMNk?si=ztBzxfCS4ZdajuVU (click here to get in the mood 😉 ) Earnest adults only. No kids, spy or otherwise. Anna is a Spy Kids expert and historian, having spent the past twenty years of their life researching (watching) the Spy Kids series and analyzing its themes. This is a Masks Optional event. As with all NYC Resistor events, this class is 18+ and governed by our Code of Conduct. The Code of Conduct, as well as accessibility information, can be found at www.nycresistor.com/participate/. More info and RSVP Posted by Classes at 5:01 pm Tagged with: class Sorry, the comment form is closed at this time."
