full_description = "Mar 15 2025 : School’s Inn Session: Spring Recess classes Feb 072025 Come hang at a uniquely attentive and supportive open mic, where we share our collective attention to all forms of artistic expression School’s In: Spring Semester March 15 7pm – 10pm Pay What You Wish Come hang at a uniquely attentive and supportive open mic, where we joyful share a stage with first time performers, professionals, and everyone in-between. Come sing, dance, recite, act, play in any form and be heard and appreciated. Sign-up will be first-come first-serve. Each performance will be 6 minutes. Inquire about featured slots. Slots reservation can be gifted for consistent attendance. Winston has been hosting mics around the city for 4 years, performing poetry and curating spaces for artists at any level to share and hone their art forms. He is proud of the friends who have been brought up, but is extra encouraging to brand new performers, trying to find an audience or share for the first time. Event is open to all people, bring your full self, celebratory clothing, and a friend! (no robots) This is a masks optional event. As with all NYC Resistor events, this class is 18+ and governed by our Code of Conduct. The Code of Conduct, as well as accessibility information, can be found at www.nycresistor.com/participate/. Please note that refunds must be requested 24 hours in advance. If you have any questions, please email [email protected]. More info and RSVP Posted by Classes at 3:31 pm Tagged with: class Sorry, the comment form is closed at this time."
