description = "Come join us around the big table for an afternoon of stitching, hooking, purling, weaving, and basically any sort of hand craft!Come join us around the big table for an afternoon of stitching, hooking, purling, weaving, and basically any sort of hand craft! We have coffee and tea on hand, and feel free to bring…"
full_description = "Feb 22 2025 : Stitch Circle classes Jan 312025 Come join us around the big table for an afternoon of stitching, hooking, purling, weaving, and basically any sort of hand craft! Come join us around the big table for an afternoon of stitching, hooking, purling, weaving, and basically any sort of hand craft! We have coffee and tea on hand, and feel free to bring your own small snacks. This is an inclusive space, all are welcome. Bring a project, or get inspired by the supplies we have here. Some of the supplies that we have are: two giant tubs of yarn, lots of crochet hooks, straight and circular knitting needles, needle felting tools and felt, embroidery hoops and thread, and even a small loom! Donations go to helping the space stay stocked up with craft supplies! Please do not attend if you are feeling sick. Nobody enjoys catching even the common cold, so stay home! Your host: Ben is primarily a crocheter who dabbles in other stitch witchery. They have been crocheting for over 20 years and loves starting projects, but apparently hates finishing them. This is a masks optional event. As with all NYC Resistor events, this class is 18+ and governed by our Code of Conduct. The Code of Conduct, as well as accessibility information, can be found at www.nycresistor.com/participate/. If you have any questions, please email [email protected] More info and RSVP Posted by Classes at 4:55 pm Tagged with: class Sorry, the comment form is closed at this time."
