full_description = "Feb 23 2025 : Meal Prep 101: Beta Test 3 classes Feb 032025 Hey there! Join us for Meal Prep 101: Beta Test 3, where we’ll be trying out new recipes and techniques for easy, delicious meal prepping! Meal Prep 101: Beta Test 3 Date: Feb 23, 2025 Time: 5PM EST Location: NYC Resistor Welcome to Meal Prep 101: Beta Test 3. The thesis of this series is to teach and practice basic knife skills, increase comfortability in the kitchen, and develop knowledge of flavor combinations, portion-size, produce selection, and active refrigerator inventory to better feed oneself with healthy, delicious, and affordable meals. Each class will take home between 3 and 8 portions of pre-prepared, or low-effort meals along with spice blends, marinates, and other kitchen essentials to make cooking easier and better at home. Meals will center around vegetables. Groceries will be PROVIDED with RSVP. Please discuss for other dietary restrictions or allergies before attending. We will do our best to accommodate. THIS IS THE FOURTH CLASS. PLEASE ALLOW CHANGES FOR PRICING AS WE MOVE TOWARDS REGULAR PROGRAMMING. Menu: Onions and Peppers Salsa Verde Cilatro-lime rice pickled jalapenos veggie stock?! Masks optional Paypal/Zelle is under phone number 631 371 1168 Venmo is @winston-chiang Instagram is @ouroboros.in.reverse More info and RSVP Posted by Classes at 12:03 pm Tagged with: class Sorry, the comment form is closed at this time."
