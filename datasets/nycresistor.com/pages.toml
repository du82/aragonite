title = "kellbot – NYC Resistor"
description = "We learn, share, and make things."
full_description = "Learn to Create Generative Art with p5.js Uncategorized Comments Off on Learn to Create Generative Art with p5.js Feb 242022 Learn to create art algorithmically in our March 13th online p5.js class! Register on EventBrite p5.js is a JavaScript library which makes it easy to create computational art in any browser. It is easy to learn and use but can also be combined with other libraries to become a powerful tool for creation. Based on Processing, p5.js can also be used to make animations and interactive work. This class will dive into different strategies for creating interesting algorithms, including exploring the use of color and texture. We’ll talk about how to control randomness to create organized chaos. Generative art isn’t limited to abstract geometric design! p5.js can be used to create figurative work as well. ArchiSketch by KT This is a beginner friendly class, however you do need to already be familiar with basic programming concepts such as functions, variables, and loops. It’s OK if you don’t have any JavaScript experience, the core ideas will translate between languages. Completed p5.js programs, called sketches, can be shared on platforms such as openprocessing.org, embedded in any web page, or exported and saved as an image. This class is taught by NYC Resistor alumni member Kelly Maguire, who uses p5.js to generate unique postcards. Anyone can request a postcard, which is mailed using a print-on-demand direct mail service and sent directly to their homes. Class meets virtually at 12pm Eastern time on March 13, 2022. To register head to EventBrite. Posted by kellbot at 6:10 pm Now through Christmas: Laser Wednesdays! Uncategorized No Responses » Nov 302011 This time of year our laser gets pretty busy, so we’ve opened up an additional laser night on Wednesdays. Tonight through December 21st, come by on Monday or Wednesday from 7:30-10:30 to fire the laser! And another thing… Because it’s such a popular time of year for lasing, we ask that you prepare your cut files so they can be broken up into smaller batches. That way instead of one person monopolizing the machine for hours, we can rotate through. So if you have an army of 100 Christmas ornaments to make, prepare your file so they can be cut in 2 sessions of 50 or 3 sessions of 33.3333. Posted by kellbot at 12:41 pm"
