["https://www.nycresistor.com/author/admin"]
title = "Bre Pettis – NYC Resistor"
description = "We learn, share, and make things."
full_description = 'DemoParty! Uncategorized No Responses » Mar 222011 The Mozilla Labs* DemoParty is an upcoming online competition to foster artful development and exploration of Open Web technologies, taking inspiration from the classic DemoScene. On March 30th 2011, 7pm, Tobias Leingruber** from Mozilla Labs and F.A.T. will present this project together with 2 special guests (TBA), and dive with us into the DemoScene culture and Open Web technology. Join us for a fun evening and free Pizza + Beer! *Mozilla Labs is a virtual lab where people come together to create, experiment, and play with new Web innovations and technologies. Crazy ideas and inspirations are encouraged as we all explore and experiment with brand new ideas in whole new ways. Mozilla Labs is about inspiring and harnessing the intelligence, wisdom, and energy of the Mozilla community; let’s imagine the future of the Web, and then let’s build it together. **Tobias Leingruber (@tbx) is an artist and communication designer, researching in viral media, popular culture, amateur aesthetics and the future of the web. As an advocate for openness and freedom online he has worked with many artists and organisations including the F.A.T. Lab, Artzilla.org and Mozilla. Best known for Pirates of the Amazon, Skate the Web and his latest work FB Resistance, he has exhibited work worldwide and has been covered by the NY Times, LA Times, Wired, Spiegel, 3sat(TV) and Liberation.fr. Posted by Bre Pettis at 10:26 am Superstars of the Arduino! Uncategorized 4 Responses » Mar 212010 NYCResistor has a new space and it’s beautiful and we’re nearly done fixing it up. Maybe you’ve heard that we’re having an Arduino Art Party? It’s going to be featuring the superstars of the Arduino world! This show is important because while the arduino has been a growing factor in the cutting edge art scene, an art show that showcases the full capabilities of it as the main focus of the art show has never been done. This will be a landmark event in the history of mechanized and programmable art! So what will be at NYCResistor on March 27th from 8-12pm at 87 3rd Avenue in Brooklyn? wind-up birds (hc gilje 2008) from hc gilje on Vimeo. HC Gilje’s wind up birds. Cyber woodpeckers, need we say more about that? Arron Koblin will display data crashes transformed into art. (Not pictured above) Laura Greig‘s arduino powered painting machine. Hernando Barragán – The creator of the wiring board will display Infomatic driven LEDs. Things – Edith Kollath Creates Books that Breathe from Bre Pettis on Vimeo. NYCResistor Member Edith Kolath Jan Borches and REne Bohne’s Luminet Jacket will be on display and blinking. Becky Stern‘s interactive embroidery will be blinking. \ Oscar Torres and Jackoon the painting robot will be doing their thing. Raphael Abrams has a twitchie. Half doll, half robot. It’s a dollborg. Joe Saavedra – Will be displaying a jacket that has the game of life displayed over LED matrix based on your pulse! Ok, now you know the awesomeness that is in store for you! Get your tickets now! Posted by Bre Pettis at 5:19 pm'
