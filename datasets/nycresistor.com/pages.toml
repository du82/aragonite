title = "Mar 12 2025 : Beep Beep Booper: Building a lil Analog Piano – NYC Resistor"
description = "Assemble your own circuit and take home a working mini electronic piano that makes fun beeping and booping sounds!The workshop: In this hands-on workshop, you will create a mini electronic piano using an analog circuit. You'll learn the basics of breadboards and electrical components like buttons, resistors, capacitors, and the 555 Timer Chip. By the…"
full_description = "Mar 12 2025 : Beep Beep Booper: Building a lil Analog Piano classes Feb 182025 Assemble your own circuit and take home a working mini electronic piano that makes fun beeping and booping sounds! The workshop: In this hands-on workshop, you will create a mini electronic piano using an analog circuit. You’ll learn the basics of breadboards and electrical components like buttons, resistors, capacitors, and the 555 Timer Chip. By the end of the session, you’ll assemble your own circuit and take home a working mini piano that makes fun beeping and booping sounds! Who it’s for: For anyone who is interested in making an analog circuit that makes noise. Note from your instructor: Hi, I’m Gracy! I received my master’s from NYU’s ITP program in 2023, where I focused on creative coding and physical computing. In my own work, I love experimenting with sensors and motors, and I’m always excited to help others incorporate physical computing into their own projects. This workshop was created with my fellow ITP classmates, Bianca Gan and Priyanka Makin, and has been taught to a wide range of age groups. This is a masks optional event. As with all NYC Resistor events, this class is 18+ and governed by our Code of Conduct. The Code of Conduct, as well as accessibility information, can be found at www.nycresistor.com/participate/. If you have any questions, please email [email protected] More info and RSVP Posted by Classes at 11:16 pm Tagged with: class Sorry, the comment form is closed at this time."
