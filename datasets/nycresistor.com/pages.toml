title = "David Huerta – NYC Resistor"
description = "Museum coder by day, hardware hacker by night."
full_description = "Breath Life Into Your Projects by Using Dead Vapes at Open Hardware Summit salvage Comments Off on Breath Life Into Your Projects by Using Dead Vapes at Open Hardware Summit Feb 282024 Heading north for Open Hardware Summit this year? Join NYC Resistor members Becky Stern, Kari Love, and friends for a talk on re-purposing discharged disposable vape parts. Becky will introduce the salvage process and how regulation had the unintended consequence of creating more e-waste, and Kari, David Rios, and Shuang Cai will talk about how they transformed them into rechargeable musical instruments! Disposable vaping devices, like the ubiquitous Elfbar, are designed to become ubiquitous e-waste, but as much as the batteries are coated in sticky nicotine, they can, in fact, be repurposed for re-use. Like many contradictions in the production of electronics, this is due to a confluence of economic and political factors beyond just engineering concerns, which will be explored in this session. The Open Hardware Summit is happening May 3rd and 4th in 2024. Tickets for Open Hardware Summit are available now. See you in Montreal! Posted by David Huerta at 8:26 pm Tagged with: elfbar, ewaste, music, ohs2024, synth, synthesizer, vape Open Hardware Summit returns to NYC April 28th and 29th Uncategorized Comments Off on Open Hardware Summit returns to NYC April 28th and 29th Apr 232023 The Open Hardware Summit is happening virtually and in New York City at NYU April 28/29th. A number of NYC Resistor members will be in attendance, and we would love to see you attend too – Get your tickets here! If you’re not near NYC, you can also watch virtually via OSHWA’s YouTube channel. You can find the schedule here, which includes hands-on workshops, unconference sessions, and 2 days full of awesome talks from presenters around the world about open source hardware, education, creative tech, engineering and more! BONUS: NYC Resistor will also be hosting Open Hardware Summit’s afterparty on the night of the 28th. Space is limited, RSVP here. Posted by David Huerta at 3:28 pm"
