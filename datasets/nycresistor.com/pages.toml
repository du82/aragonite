description = "One of the awesome things about building a hacker group is the community that has grown up around us. Our members are cool and all, but our community is what makes us great. Unfortunately keeping a hackerspace as awesome as ours running comes with some real financial costs. Rent, power, insurance... it all adds up…"
full_description = 'Friends of NYCR Add comments One of the awesome things about building a hacker group is the community that has grown up around us. Our members are cool and all, but our community is what makes us great. Unfortunately keeping a hackerspace as awesome as ours running comes with some real financial costs. Rent, power, insurance… it all adds up pretty quickly. Some of our community members have asked how they can help. Therefore, we’ve created a friends of resistor area where you can give us money, and we say you are our friends! Wait, that sounds bad. Friends first, *then* money. Crap, still bad. Don’t judge me! So what do you get for being a Friend of Resistor? Access to an amazing community of hackers and makers via our Google Group, craft night, and other public events. But wait, aren’t I already getting those for free? Well, yes. By becoming a Friend of Resistor you help make sure these events stay free, as well as give us the resources to host more open community events. $13.37 / month. So sweet, so l33t. Friend : $13.37 USD – monthlyHekin Good Friend : $133.70 USD – monthlyAre you okay fren? : $1,337.00 USD – monthly Posted by hoeken at 11:29 am 6 Responses to “Friends of NYCR” Comments (4) Pingbacks (2) Sergey Chernyshev says: May 7, 2008 at 1:06 pm Membership link seems to be broken… How does one become a member? Sergey Reply Doug says: January 21, 2009 at 9:32 am Way cool! Is there anything like your group in Atlanta, GA? Reply Zach says: January 21, 2009 at 11:42 am Only one way to find out: http://www.hackerspaces.org Reply Ed says: March 2, 2009 at 6:27 pm Could anyone recommend a store where I can buy a decent soldering stations in NYC. Thank you. Reply Leave a Reply Cancel reply Your Comment You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name (required) E-mail (required) URI Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
