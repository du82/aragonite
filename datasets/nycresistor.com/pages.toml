["https://www.nycresistor.com/2009/11/02/makerbot-in-the-bits-n-pieces-show-at-material-connexion"]
title = "MakerBot in the Bits ‘n Pieces show at Material Connexion – NYC Resistor"
description = "MakerBot grew out of the friendships forged at NYCResistor and is going to be in the best art show of the 21st century. It's called Bits 'N Pieces and it'll be at Material Connexion starting on Thursday. DATES: November 4 - December 4, 2009 HOURS: Monday - Friday, 9am - 6pm LOCATION: Material ConneXion 60…"
full_description = 'MakerBot in the Bits ‘n Pieces show at Material Connexion Uncategorized Add comments Nov 022009 MakerBot grew out of the friendships forged at NYCResistor and is going to be in the best art show of the 21st century. It’s called Bits ‘N Pieces and it’ll be at Material Connexion starting on Thursday. DATES: November 4 – December 4, 2009 HOURS: Monday – Friday, 9am – 6pm LOCATION: Material ConneXion 60 Madison Avenue, 2nd Floor New York, NY 10010 T. 212-842-2050 NEAREST SUBWAYS: #6 at 28th and Park / NRW at 28th and Broadway. Bits ‘n Pieces is a traveling exhibition of work by international designers, architects, computer scientists, and material and technology researchers. It will showcase projects still in their development stage, as well as furniture, architecture, jewelry, graphic design and products that anticipate the next phase of the digital revolution, focusing on how society is imbued with, shaped by and shapes technology. This new era will be marked by increased awareness about, and accessibility of, continuously advancing technologies and materials and the changes that we will be making in our lives through them will be not just formal but structural, not merely aesthetic but substantive, changing how we actually think about, design and build our objects and space. What will life look like based on changes that are sometimes visible to the public and sometimes invisible? Read on for the conceptual essay. (It’s good) We live in a sped-up world in which technological advances occur faster and faster. We can’t imagine, for instance, living in our homes and working in our offices without products that were lab experiments only five years ago. Often, it has been technological innovation that has served as the catalyst for these changes. For example, will the 3D printer – the cost of which has plummeted in only a decade – move from the lab and the factory into our homes and offices in the near future? How could seemingly small changes like this actually have a big impact on society, socially, economically and culturally? Technology has bestowed a greater responsibility on the designer by radically altering his role. Design will not only be about creating products that are a result of innovation, but envisioning future scenarios and communicating these clearly to the public, suggesting new production processes and testing the manifold uses of new technologies. The designer is now in a position to tell factories which tools should be made and/or designed in order to make products, becoming as much researchers, scientists and engineers as “designers.” In this way, they must begin to use technology as a tool with which to expand what we perceive as “normal” and constantly re-create our quotidian world. The concept of Bits ‘n Pieces came to life when a diverse group of product designers based in the U.S. and Europe began to discuss how their various projects were informed by digital technology. Differences in location seemed to create differences in perspective but there were also, unexpectedly, many things in common. Bits ‘n Pieces addresses the myriad ways in which the digital era has changed the world of design, from the ways in which designers imagine images, objects and space to how they fabricate prototypes and manufacture at the mass level. Digital information emailed directly to a press, mill, laser-cutter or 3D printer can sometimes be picked up the very next day in the form of a three- dimensional object. Today, design developments speed across the globe via the Internet. It has also become increasingly easy to produce images, objects and architecture that were previously impossible thereby expanding the consumer’s horizon at a much more rapid rate. Much of the work in Bits ‘n Pieces asks what we do and how we do it now that the digital revolution is behind us, and we have entered a post-digital era. Whether an object is digital or analog is no longer of any importance, since digital technologies are now embedded in the ways we think, work and play. Ten years ago, digital technologies were a goal rather than a means; one assumed that everything should and would be digitized. The tendency was “You are either with or against us”. One example can be seen in the music world, where around the turn of the century there was a big division between the digital musicians, with the blips and drones and the musicians that swore by analog. This discussion is now slowly quieting down and making room for subtle incorporations of digital in analog music and vice versa. Today’s designers must dart back and forth frequently and effortlessly between digital and analog, using whatever means suits the job. By now, digital technology is “here to stay” and is a tool in a toolbox, next to all the other already existing (and emerging) tools. Posted by Bre Pettis at 1:12 pm 2 Responses to “MakerBot in the Bits ‘n Pieces show at Material Connexion” Comments (2) dominic says: December 10, 2009 at 4:30 am A furniture outlet can be a terrific way to outfit your home or office in comfort and style at a low cost. Outlet stores have been around for years now and have been a way for anyone, but especially bargain shoppers to get the brand name and top of the line products such as clothing, shoes and even pots and pans, at lower prices than they would find at a regular retailer. Reply dominic says: December 10, 2009 at 9:30 am A furniture outlet can be a terrific way to outfit your home or office in comfort and style at a low cost. Outlet stores have been around for years now and have been a way for anyone, but especially bargain shoppers to get the brand name and top of the line products such as clothing, shoes and even pots and pans, at lower prices than they would find at a regular retailer. Reply Leave a Reply Cancel reply Your Comment You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> 