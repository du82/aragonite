full_description = "Soldering Party for Great (Social) Justice with HeatSeek, Thursday Oct 5, 6-9pm Uncategorized Comments Off on Soldering Party for Great (Social) Justice with HeatSeek, Thursday Oct 5, 6-9pm Sep 302017 Learn to solder and help Heat Seek assemble devices to track the heat in apartments and keep landlords honest! Sign up here We need your help to solder and assemble 25 of HeatSeek’s latest temperature-logging devices. This is a simple through-hole soldering project and a good place for beginners to start and we’re happy to teach you how to solder, but we’d also LOVE help from a few experienced folks who can guide others or zip through a few devices even faster! Heat Seek‘s mission is make the city a safer, warmer place to live for all New Yorkers. Heat Seek helps tenants resolve their home heating issues by providing the objective, reliable temperature data they need to hold their landlords accountable. Working closely with tenant organizers, public interest attorneys, and city officials, HeatSeek installs proprietary temperature sensors and offers technical expertise to assist low-income tenants in documenting when their landlords fail to provide adequate heat during the wintertime. By focusing on tenants at risk being forced from rent-stabilized and other affordable housing, Heat Seek ensures that sensors are placed with the tenants who need their data the most. If you’re able to come help, please sign up so we know how many helpers to plan for! Posted by Eric Skiff at 10:59 pm Bring an awesome RasPi project Wednesday and win this amazing goodie bag from Adafruit! Uncategorized 6 Responses » Sep 142012 Adafruit is joining us along with the Raspberry Pi Foundation for our upcoming event on wednesday, and they’ve offered up an amazing Raspberry Pi shaped goodie backpack filled with accessories. The event is sold out but if you have an awesome project that you want to bring, and think you have a shot at winning this awesome prize from Adafruit, tell us about your project in the comments, and we’ll see if we can squeeze you in 🙂 Here’s the info from Adafruit’s blog How can you win? We’re going to give this away to someone at the NYC Resistor event on September 19th. If you’re going to the event you need to show up with a cool project made with a Raspberry Pi in some way. Ladyada and Becky will pick a winner, so make sure you show up with something really cool that shows what you can do with a Pi, looking for ideas? Check out tutorials and Pi day here. Posted by Eric Skiff at 11:34 am"
