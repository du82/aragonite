full_description = "June 28th: NES Cartridge Hacking – Super Mario Clouds Uncategorized 6 Responses » Jun 042014 On ~*June 28th*~ we’ll be hosting a new class on hacking NES cartridges for art and various related shenanigans. Cory Arcangel’s Super Mario Clouds is a well known work of digital art where a Nintendo game cartridge was modified to just show the clouds in the game. He also happened to release some instructions on how to reproduce his leet hax! In this workshop, we’ll be creating Super Mario Clouds from old NES cartridges, bringing modern art to your living room without having to splurge at Art Basel. Some basic soldering, desoldering, and programming will also be covered as a bonus since that’s how old NES cartridges are hacked. Limited to 12 spots and includes your very own old Super Mario cartridge. This class will be taught by NYC Resistor member David Huerta and Jon Dahan, who crafted this workshop after his experience re-creating it at the Metropolitan Art Museum’s Media Lab. Sign up on Eventbrite. Posted by David Huerta at 11:00 am Tagged with: art, assembly, cartridge, class, clouds, corey archangel, games, mario, nes, new media, programming, workshop"
