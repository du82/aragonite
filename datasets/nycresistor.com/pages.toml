["https://www.nycresistor.com/2025/02/01/mar-05-2025-learn-to-use-a-laser-cutter-to-cut-and-etch-your-own-designs"]
title = "Mar 05 2025 : Learn to Use a Laser Cutter to Cut and Etch Your Own Designs – NYC Resistor"
description = "Harness the power of an Epilog 60 Watt Laser! In this class you'll learn everything you need.Harness the power of an Epilog 60 Watt Laser! In this class you'll learn everything you need to know to make the ideas in your head become a reality with a laser. In this three hour class, you will…"
full_description = "Mar 05 2025 : Learn to Use a Laser Cutter to Cut and Etch Your Own Designs classes Feb 012025 Harness the power of an Epilog 60 Watt Laser! In this class you’ll learn everything you need. Harness the power of an Epilog 60 Watt Laser! In this class you’ll learn everything you need to know to make the ideas in your head become a reality with a laser. In this three hour class, you will learn: How to set up a file for cutting on the laser cutter in Inkscape or Adobe Illustrator. Laser cutter safety including materials testing. Laser cutter operation including configuration, cuts and raster etching in common materials like wood, acrylic, cardboard and others. At the end of class, you will go home with: One laser cut project, either the class default or a simple one of your own design (see below for details) Resistor Laser Certification, enabling you to use our laser on Craft Nights. Please bring the following to class: A laptop with either Inkscape (free: download here: https://inkscape.org/release/inkscape-1.2.1/) or Adobe Illustrator installed. A USB jump drive The following items are optional if you’d like to try cutting a simple custom design. If your file ends up being too complicated, we may have you do the class default project first, just to learn the laser in the time allotted – but we’ll definitely help you with your more complex cut at a free Craft Night in future! An SVG vector file of a simple shape you’d like to cut for your first cut. A piece of 1/8 inch or thinner wood, acrylic or cardboard you’d like to cut. If you can’t bring your own material, small pieces will be made available, or larger pieces for purchase on site. Please be on time for the start of class! If you’re late you will miss your slot. This class will be taught by NYC Resistor member Katie. As with all NYC Resistor events, this class is 18+ and governed by our Code of Conduct. The Code of Conduct, as well as accessibility information, can be found at www.nycresistor.com/participate/. Please note that refunds must be requested 72 hours in advance. If you have any questions, please email [email protected]. More info and RSVP Posted by Classes at 12:17 pm Tagged with: class Sorry, the comment form is closed at this time."
