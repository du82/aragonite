full_description = "laser is back up! Uncategorized No Responses » Jun 092014 Our laser is back in action! Posted by astrida at 10:16 am The toilet is clean, we’re ready for next Saturday… Uncategorized No Responses » Jun 082013 There’s nothing like a big party to force some cleaning… would you look at our toilet? I mean… I’m not even sure it was this clean when we moved in. Someone will think some magic cleaning elves descended upon it in the dead of night. This is just so you’ve been alerted… that the facilities will be clean for our 4th Annual Interactive Party this coming Saturday June 15. We’ll have great projects, wine, a DJ and dancing under a great big LED illuminated arch. Go get tickets now, as they are moving and we’re not sure we’ll have any left to sell at the door… http://interactiveshow2013-eorg.eventbrite.com/# Posted by astrida at 4:07 pm TICKETS on SALE for our 2013 Interactive Show Uncategorized 3 Responses » May 182013 Coming June 15th to NYC Resistor, the 2013 Interactive Show. We’re still soliciting for a few more projects, but we’ve already got a great menagerie of really interesting & fun work lined up. This year’s theme is Digital Archeology. Expect to see the old, and the old hacked into new… Our show usually sells out far in advance, so don’t dawdle. Get your tickets here: http://interactiveshow2013.eventbrite.com/ Posted by astrida at 11:58 am Nail Art Make-A-Long this Saturday! Uncategorized 1 Response » May 102013 Ever wanted to trick your nails out with a paint-job worthy of notice? This is how… and no need to pay a salon $50 for the glory. We’ll teach you how on Saturday (5:30-8:30pm) after our Laser Class, using templates stamps and other techniques. We’ll have a small selection of polishes, so if you’re after a specific color combo you may want to bring your own. Tickets still available here— be prepared to come with a base-coat or to add one while you’re there. GUYS WELCOME! (Remember you can also paint your toes). Posted by astrida at 11:56 am"
