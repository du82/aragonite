["https://www.nycresistor.com/join"]
title = "Join – NYC Resistor"
description = "Key Members NYC Resistor is a private space in which keyholding members pay monthly dues in exchange for 24/7 access to the space. Membership is inclusive of a variety of different professions and backgrounds, including crafters, creative technologists, engineers of every kind, designers and both part-time and full-time artists. We also foster a mix of…"
full_description = "Join Key Members NYC Resistor is a private space in which keyholding members pay monthly dues in exchange for 24/7 access to the space. Membership is inclusive of a variety of different professions and backgrounds, including crafters, creative technologists, engineers of every kind, designers and both part-time and full-time artists. We also foster a mix of skill levels, ranging from beginners to seasoned experts. We’re fans of people trying things they don’t know how to do, as well as teaching others how to do stuff they do know how to do. Our members use our space for building things, hosting workshops, collaborating, giving and receiving feedback for their projects and more. Membership costs $115 per month. If you agree to teach at least two classes per year, membership is $75 per month. (Plus, you get paid to teach the classes.) In exchange, members receive 24/7 access to the space and our community. If you’re interested in joining, come get to know us and let us know you want to join! Our Craft Nights are open to the public. Come and learn–no matter what your skill level–share what projects you’re working on, and meet our members. After a while, if we have a space open in the group and it’s a good fit, you may be invited to be a member. Before an invite happens, our membership will discuss whether to vote on your membership. NYC Resistor is a small, close-knit community, requiring an extremely high level of trust between members. Any member may delay a vote on membership until more people have met a prospective member, and any single member may veto a vote altogether, no questions asked. Just like visitors to Resistor, members are expected to abide by the Code of Conduct. Become a Friend of NYC Resistor Rent in Brooklyn isn’t cheap! Become a Friend of NYC Resistor and help us with our operating costs. By joining Friends of NYC Resistor, you get access to our online Discord community, as well as other perks like discounted laser time and classes. Questions? Email us at [email protected]. Posted by David Huerta at 7:57 pm"
