["https://nyheder.tv2.dk/klima/2025-02-24-staten-tager-hul-paa-milliardopkoeb"]
title = "Staten tager hul på milliardopkøb - TV 2"
description = "Nu går arbejdet med opkøb af jord i forbindelse med den grønne trepart for alvor i gang. Der er afsat 43 milliarder til projektet."
full_description = "KlimaStaten tager hul på milliardopkøbNu går arbejdet med opkøb af jord i forbindelse med den grønne trepart for alvor i gang. Der er afsat 43 milliarder til projektet.Minister for Grøn Trepart Jeppe Bruus (S) er gået i gang med at købe jord op for at komme i mål med statens ambition om mere natur og skov på de danske landbrugsarealer. Foto: Mads Claus Rasmussen / Ritzau Scanpix 24. feb kl. 17.22Charlotte Rudiengaard Rasmussen & Signe Mai VilsbøllNiels Madsen har set frem til dagen længe.Fra sit vindue kan han i dag se plovfurer, så langt øjet rækker, men første skridt mod en omlægning af landbrugsjorden er taget, og i fremtiden bliver markerne med afgrøder efter alt at dømme afløst af et større vådområde.Det bliver Niels Madsens nye udsigt.- Vi får et dejligt udsyn over området. En stor del af jorden har været sprøjtet og kunstgødet før, men det bliver taget ud, så det ikke må sprøjtes, kunstgødes, pløjes og dyrkes. Det er vi rigtig glade for, og det passer lige ind i det, som vi har kæmpet for i årevis, siger Niels Madsen, som er uddannet økolog og dyrker sin jord efter biodynamiske principper.Han er én af årsagerne til, at vådområdeprojektet ser ud til at lykkedes – og han har ventet på et besøg fra Minister for Grøn Trepart, Jeppe Bruus.Den grønne trepartDen grønne trepart er en aftale mellem regeringen, Landbrug & Fødevarer, Danmarks Naturfredningsforening, Fødevareforbundet NNF, Dansk Metal, Dansk Industri og KL. Aftalen blev indgået i juni 2024 og vedtaget i Folketinget i november samme år. Målet med aftalen er at få genoprettet livet i danske fjorde, søer og vandløb, skabe mere natur og biodiversitet og nå klimamål. Derudover skal CO₂-udledningen i landbruget nedbringes. Frem mod 2030 skal 400.000 hektar landbrugsjord omlægges til naturområder, svarende til Fyn og Lollands samlede areal. Desuden indfører Danmark som del af aftalen en CO₂​-afgift på landbrugsproduktion. Ministeren tog i dag til Kolding for at hilse på og inspicere den jord, staten netop har købt for at komme i mål med vådområdeprojektet Fiskebæk Kær syd for Kolding.Købet af jord til projektet sker som led i den største omlægning af Danmarks arealer i nyere tid.Landbrugsjord til skov og natur15 procent af den danske landbrugsjord skal omlægges til skov og natur frem mod 2030 for at få genoprettet livet i danske fjorde, søer og vandløb, skabe mere natur og biodiversitet og nå klimamål.Det gav Regeringen og en række aftaleparter sidste år håndslag på, hvorefter de præsenterede Den grønne trepartsaftale.Med den grønne trepartsaftale er der afsat 43 milliarder kroner til at sikre, at 140.000 hektar kulstofrige lavbundsjorde bliver udtaget, mens 250.000 hektar landbrugsjord bliver omlagt til skov.Se ogsåAftale om den grønne trepart er på pladsDen første af de 43 milliarder er der nu taget hul på med et statsligt køb af landbrugsjord nær Kolding, som Niels Madsen tidligere var ejer af.Jorden skal gives i bytte til jordejere, der skal stoppe med at dyrke den jord, som gerne skal udgøre Fiskebæk Kær.En meget lang procesFormålet med Fiskebæk Kær er at reducere kvælstofudledningen til Hejlsminde Nor og Lillebælt. Vådområde-projektet blev startet op i efteråret 2020.Først i 2024, da der blev sat penge af til grønne projekter som Fiskebæk Kær, blev det ifølge Ministeriet for Grøn Trepart muligt at skaffe såkaldt erstatningsjord til bytte for projektjord.Niels Madsen har i mange år drevet landbrug efter biodynamiske principper. Nu sælger han jord til staten for at give plads til et stort vådområde tæt på hans bolig. Foto: Peter Nejsig / Peter NejsigNiels Madsen har været utålmodig. Han synes, det hele har taget meget lang tid.- Det kunne have gået meget hurtigere. Det er bureaukrati af værste skuffe. Det er så utilfredsstillende, påpeger Niels Madsen, der fik kabalen til at gå op ved at sælge staten omkring 40 hektar jord nogle kilometer fra sit hjem.Han håber, at minister Jeppe Bruus vil gøre sit for, at projekter som Fiskebæk Kær ikke trækker i langdrag.- De er nødt til at lægge nogle beføjelser ud til de mennesker, der skal stå for at omlægge områderne, så man kan få det handlet af i en fart, siger Niels Madsen.Svært at komme i målIfølge Ministeriet for Grøn Trepart kan de 43 milliarder, der er blevet afsat til arealomlægning, være med til at sætte skub i de naturprojekter, der har været svære at gennemføre – blandt andet på grund af økonomien.Data fra handelsplatformen Resights viser, at staten har betalt Niels Madsen knap 9,3 millioner kroner for 42 hektar ren landbrugsjord, som han tidligere har dyrket økologisk og efter biodynamiske principper.Det svarer til en pris på knap 221.000 per hektar, hvilket er mere end den gennemsnitlige jordpris inklusiv bygninger, men den er helt fair, mener Niels Madsen.- Jeg vil kalde det en rimelig pris, siger han.Hvad Niels Madsen får i kompensation for de knap 6 hektar jord ned til Fiskebæk Kær, han ikke længere må dyrke, ved han ikke.- Vi får et udspil i løbet af foråret, som vi skal sige ja til, før de kan gå i gang. Vi regner med noget i omegnen af det andet, forklarer han.Minister er fortrøstningsfuldDet var en tilfreds minister, der i dag kunne plante støvlerne i den jyske muld.- Jeg vil gerne takke Niels Madsen for at få puslespillet til at gå op, så vi kan få de sidste lodsejere med og få realiseret et projekt, som er alt det, den grønne trepart handler om, siger Minister for Grøn Trepart, Jeppe Bruus.Er pengetanken på 43 milliarder nok til at realisere ambitionerne?- 43 milliarder er mange penge, men det er klart, at det kræver noget vilje at få tingene til at lykkes. Men når jeg kommer rundt i landet, så er det også det, jeg møder. Folk er utroligt imødekommende og bakker op, understreger Jeppe Bruus.Se ogsåTrepartsaftale kaster millioner efter naturnationalparker på havetFremover kommer Niels Madsen til at dyrke afgrøder på nye marker, han købte i sommer. Her udvider han sit økologiske og biodynamiske landbrug og fortsætter sin mission.- Vi har helt siden 1989 arbejdet ud fra de her principper, og den grønne trepart passer lige ind i det. Hele målet for mig er at dyrke sunde fødevarer. Ikke det plastik-pis, man køber nede i Brugsen eller, hvor man nu køber ind. Det er kun vand og kunstgødning, understreger Niels Madsen.Kommer du til at købe mere jord for at plante træer eller være med til at lave vild natur? - Hvis jeg kan få lov at købe noget, jeg kan lægge om, så kunne jeg sagtens finde på det. Tror du, man kommer i mål med de ambitioner, man har lagt op til i den grønne trepart?- Det vil jeg sandelig håbe. Men man er nødt til at lægge nogle beføjelser ud til arbejdsgrupperne, så der kan ske noget. Jeg kunne godt være bekymret for, at det kommer til at tage lidt længere tid end først antaget. Sådan må det være. Bare det bliver, som man har aftalt. Det værste, der kan ske, er, at det hele falder fra hinanden, siger Niels Madsen.Del artikelDelFacebookXE-mailLinkKopiér"
