full_description = '''SamfundHendes pølser bliver stjålet – "De har ryddet hele fryseren"Uærlige kunder har over natten ryddet en vejbod til stor frustration for ejeren selv.Udarbejdet af TV2 ØstjyllandDortes pølser bliver stjåletDortes pølser bliver stjåletI går kl. 13.37Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.I går kl. 13.40Her har de for meget varme - det kan 'gaskommunen' måske drage nytte afHer har de for meget varme - det kan 'gaskommunen' måske drage nytte afI går kl. 19.47En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.I går kl. 19.18Salling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.Salling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.I går kl. 19.17Tre grise stjålet fra kontroversiel udstilling i KøbenhavnTre grise stjålet fra kontroversiel udstilling i KøbenhavnI går kl. 17.35Politiet afspærrer yderligerePolitiet afspærrer yderligereI går kl. 14.14Politi er ikke længere massivt til stedePoliti er ikke længere massivt til stedeI går kl. 06.57Orange varevogn fjernes fra gerningsstedOrange varevogn fjernes fra gerningsstedI går kl. 06.46Fabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske statFabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske stat28. feb kl. 14.56Kendt frisør blev afvist som barnKendt frisør blev afvist som barn28. feb kl. 13.34Kig mod Europa, siger lektorKig mod Europa, siger lektor28. feb kl. 12.49 I går kl. 19.04 Anne Marie Stoustrup Petersen TV2 ØstjyllandNormalt vækker det glæde, når Dorte Kølbæk fra Kastrup på Djursland kan melde udsolgt i sin vejbod, hvor hun sælger hjemmedyrkede fødevarer.Men synet, der mødte hende tirsdag morgen, vakte alt andet end glæde. Hele fryseren, hvor Dorte Kølbæks grill- og spegepølser normalvis ligger, var ryddet, og betalingen var udeblevet.- Jeg bliver så træt og vred over, at folk ikke bare kan betale. Den her gang har de ryddet hele fryseren, siger Dorte Kølbæk til TV2 Østjylland.Tyveriet tirsdag er det andet inden for to uger. Første gang blev der også stjålet grill- og spegepølser, men ikke nok til at tømme hele fryseren.Synet tirsdag fik hende til tasterne, og i et Facebook-opslag skriver hun blandt andet, at hun "håber, tyven kvæles i alle de pølser som straf".Det er hele overskuddet, der forsvinderDorte Kølbæk, KastrupEt problem flere stederDorte Kølbæk er ikke den eneste, der oplever, at uærlige kunder løber afsted med varerne uden at betale.I Høbjerg Gartneri og Gårdbutik i Grenaa har ejer Peter Drejer Nielsen tidligere haft samme udfordring.- De, der gør det (red. stjæler), gør det ikke af nød. De gør det, fordi de kan, og det vil vi gerne have dem til at lade være med, siger Peter Drejer Nielsen til TV2 Østjylland. Video: TV 2 ØstjyllandDerfor besluttede butikken for nogle år siden at installere videoovervågning, og det har vist sig at have en god effekt.- Det virker rigtig godt, og det er ganske få gange, at vi har været nødt til at kontakte kunder, der ikke betaler. Men vi skal leve af det her, og vi er nødt til at få nogle penge i kassen, lyder det fra Peter Drejer Nielsen.I Kastrup vil Dorte Kølbæk dog hellere appellere til kundernes samvittighed.Er det her ikke noget, man kan forvente, når man har en vejbod?- Det kan man måske godt, men jeg kunne ikke selv drømme om at gøre det. Jeg ved godt, at det er naivt, men man skal være et ordentligt menneske, og man stjæler ikke bare, svarer Dorte Kølbæk.Knuser gård-drømDe to episoder, der er fundet sted de seneste 14 dage, har allerede haft store konsekvenser for Dorte Kølbæk og hendes mand, der drømmer om at udvide produktionen på gården i Kastrup med lokal vin.- Det koster mange tusinde kroner det her, og der kommer ikke overskud ud af det, lyder det fra Dorte Kølbæk.- De træder virkelig på os. Det er os, der passer det hver eneste dag 24/7. Det er hele overskuddet, der forsvinder, og vi får ikke engang løn ud af at have gået her og passet og fodret grisene, uddyber hun.Jeg har været nødt til at stoppe med at have det herude Dorte Kølbæk, KastrupIfølge gårdejeren giver det ikke økonomisk mening at bemande vejboden. Hun er heller ikke umiddelbart sikker på, at overvågning er den rette løsning.Dog håber hun, at kunderne fremover vil kontakte hende, når de ønsker at købe noget i boden, for grill- og spegepølser tør hun ikke længere have liggende ude.- Jeg har været nødt til at stoppe med at have dem herude. Jeg håber, at kunderne vil bestille ved mig. Det eneste problem er bare, at når folk køber sådan noget her, er det ofte impulskøb, siger Dorte Kølbæk.Sådan kan ejere af vejboder undgå tyverierChristian Østergård, som er vicepolitiinspektør fra Syd- og Sønderjyllands Politis Forebyggelsesenhed, opfordrer til, at man først og fremmest erstatter kontantbetaling med MobilePay. - Det er en nem og sikker løsning for alle parter. Der er ikke længere kontanter i kassen. Og rigtig mange kender jo app’en i forvejen, lyder det fra vicepolitiinspektøren. Han tilføjer, at man bør overveje at flytte vejboden, hvis den ikke er synlig fra ejerens ejendom. - Hvis det er muligt, så flyt boden, så den kan ses fra stuehuset eller en anden beboelse. Det kan virke præventivt, at vejbodstyven ved, at han risikerer at blive opdaget, hvis han stjæler fra boden. Kilde: Syd- og Sønderjyllands Politi Del artikelDelFacebookXE-mailLinkKopiérUdarbejdet af TV2 Østjylland'''
