["https://nyheder.tv2.dk/business/2025-02-25-tesla-salget-styrtdykker-men-aarsagen-er-ikke-den-som-mange-tror"]
title = "Tesla-salget styrtdykker – men årsagen er ikke den, som mange tror - TV 2"
description = "Flere og flere ringer til FDM, fordi de ikke vil købe Elon Musks biler, men det er ikke hovedårsagen til, at Tesla-salget styrtdykker."
full_description = '''BusinessTesla-salget styrtdykker – men årsagen er ikke den, som mange trorFlere og flere ringer til FDM, fordi de ikke vil købe Elon Musks biler, men det er ikke hovedårsagen til, at Tesla-salget styrtdykker.Tesla har tabt næsten halvdelen af sine salg i Europa sammenlignet med sidste år. Foto: Dado Ruvic / Ritzau Scanpix 25. feb kl. 20.59Kristian Skovby ØrbækAntallet af nyregistrerede elbiler stiger på tværs af Europa, men for Tesla går det stik modsat.For mens antallet af registrerede elbiler i januar er steget med over en tredjedel sammenlignet med samme måned sidste år, er salget af Tesla-biler faldet med 45 procent.For bare tre år siden tænkte man på Tesla, når man tænkte elbil, det gør man ikke længereIlyas Dogru, forbrugerøkonom FDMDet viser nye tal fra den europæiske sammenslutning af bilproducenter (acea). Tallene dækker over EU-landene samt Norge, Schweiz og Storbritannien.Der er tale om et massivt fald, siger forbrugerøkonom hos FDM Ilyas Dogru, der peger på flere årsager til, at forbrugerne i januar har valgt den amerikanske bilproducent fra.Ny model på vejI alt peger Ilyas Dogru på fem årsager til, at Tesla ikke sælger så mange biler som tidligere.En årsag vejer dog tungest.For til marts kommer der en ny Tesla Model Y på gaden:- Det er den største årsag, for det har gjort, at salget i Europa er gået ned. Folk venter på den bil.Se ogsåTesla sniger stor nyhed ud i ly af nattenDen nye model kommer med et "facelift" og er generelt en bedre bil end den Model Y, man i dag kan få leveret, lyder vurderingen fra FDM.Det har også tidligere fået Karsten Meyland Lemche fra FDM til at rådgive danske købere om at holde igen med Tesla-købet, til den nye model kommer.Men når Tesla er gået så meget tilbage, mens resten af elbilsproducenterne stormer frem, er det også fordi, at Tesla kæmper på andre fronter.Den negative naboeffektUdover at mange venter på den nye model, er Tesla også blevet ramt af den stigende konkurrence, som der har været på elbilsmarkedet de seneste år.- For bare tre år siden tænkte man på Tesla, når man tænkte elbil. Det gør man ikke længere, fordi nu er der så mange andre konkurrenter, siger Ilyas Dogru.Konkurrencen fik i første omgang Tesla til at sænke sine priser markant, men her er konkurrenterne nu fulgt med, forklarer forbrugerøkonomen.Tesla har solgt rigtig mange biler til europæerne de seneste par år. Foto: Pool / Ritzau ScanpixI mellemtiden lykkedes det Tesla at sælge rigtig mange biler. I både 2023 og 2024 var Tesla Model Y den mest solgte bil i Danmark.Det faktum kan dog komme til at bide Tesla bagi. For ifølge Ilyas Dogru bliver Tesla ramt af det, han kalder "den negative naboeffekt", som han oplever i danskernes forhold til biler.- Der kører simpelthen så mange hvide Tesla Model Y rundt i Danmark og for den sags skyld også i Europa, så mange siger, at de ikke vil have det samme, som alle andre har, siger han.Musk-effektenDet er umuligt at måle præcis, hvor mange salg Tesla går glip af på baggrund af, at danskerne ikke vil have det samme som alle andre.Det samme gør sig gældende om det, Ilyas Dogru kalder 'Musk-effekten', som man hos FDM ikke kan sætte en præcis størrelse på.Hvor stor effekt Elon Musk har på Tesla-salget har FDM ikke en endelig opgørelse over, men flere og flere ringer til forenings rådgivning, fordi de ønsker et alternativ. Foto: Nathan Howard / Ritzau ScanpixMen Tesla-milliardæren Elon Musks offentlige ageren og udtalelser er noget, som de danske bilkøbere har en holdning til.- Flere og flere ringer ind til vores købsrådgivning, fordi de gerne vil have en elbil, men de vil ikke have en Tesla på grund af Elon Musk, siger Ilyas Dogru.Elon Musk har den seneste tid gjort sig bemærket med sit tætte samarbejde med den amerikanske præsident Donald Trump, sin rolle i besparelser i det offentlige USA, støtte til flere højreorienterede europæiske partier, og ikke mindst en fejde med den danske astronaut Andreas Mogensen.Se ogsåInteressen for Tesla daler markant – flere vil ikke støtte Elon MuskHvor stor, den effekt er, bliver lettere at vurdere, når salgstallene for den nye Model Y begynder at rulle ind, lyder det.Jan Lang, der er markedsanalytiker ved Bilbasen, har dog tidligere fortalt TV 2, at Elon Musk har en direkte påvirkning på salget af Teslaer i Danmark.Se ogsåTesla-salget styrtdykker i Europa – Musk kan være årsagen, mener analytikerHan fortalte, at flere og flere bilforhandlere, som de taler med, valgte at at købe en elbil hos en konkurrent, efter Musk erklærede sin støtte til den nuværende amerikanske præsident, Donald Trump.En tendens, som er fortsat gennem den restende del af 2024 og starten af 2025, forklarede han.Slutteligt peger forbrugerøkonomen på, at Tesla fortsat kun har to modeller på det europæiske marked. Der mangler simpelthen et billigere alternativ, og derfor mister Tesla generelt markedsandele til konkurrenterne i Europa.Del artikelDelFacebookXE-mailLinkKopiér'''
year_published = 2025
year_updated = 2025
