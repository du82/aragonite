full_description = "BusinessNordjyde køber jord for millioner af kroner – og det er ikke for at rejse skovLandbrugsinvestor Søren Rasmussen køber jord for at hjælpe unge landmænd. Han er ikke i markedet for at lægge store arealer om til skov og natur. Det seneste år har Søren Rasmussen købt landbrugsjord for flere hundrede millioner gennem en række selskaber. Foto: Janne Bekker / TV 2 Grafik 25. feb kl. 16.31Signe Mai Vilsbøll & Charlotte Rudiengaard RasmussenPræcis hvor meget landbrugsjord Søren Rasmussen ejer, har han ikke helt styr på. Men det er mange hundrede hektar. De senere år har nordjyden med det anonyme navn været yderst aktiv investor og købt så meget landbrugsjord, at samtalen hurtigt falder på Søren Rasmussen, når man spørger ejendomsmæglere, hvem der køber allermest jord i Danmark lige nu. - Sådan er landmænd. Hvis vi har råd, så køber vi naboens jord, påpeger Søren Rasmussen. Således er han med årene blevet en af de største private jordbesiddere i landet. Gennem forskellige selskaber – og i kompagniskab med andre – har han bare det seneste halve år handlet landbrugsejendomme og jord for mere end 400 millioner kroner, viser tal fra handelsplatformen Resights. Og mens rigmænd som Jacob Jelsing i øjeblikket køber op for at afvikle konventionelle landbrug i klimaet og biodiversitetens navn, er Søren Rasmussen på en mission, der er til landbrugets fordel. Han vil udvikle og udvide landbruget. Investerer i unge landmændSøren Rasmussen fra Hobro er uddannet inden for landbrug. Formuen til de mange opkøb kommer fra blandt andet planteavl, svineproduktion og fra energiselskabet Eurowind Energy. De første 11 hektar, svarende til 110.000 kvadratmeter, købte Søren Rasmussen som 18-årig, og derfra er antallet af hektar i porteføljen vokset og vokset, fortæller han.- Det var den traditionelle måde at blive landmand på. Man købte langsomt jord op, indtil det blev ens fuldtidserhverv. I dag er vejen til drive landbrug på fuld tid en anden. De danske landbrug er nemlig typisk så store, at det er vanskeligt for unge landmænd at finde penge nok til at købe, når de hidtidige ejere af bedrifter skal på pension. Derfor må de hente midler hos investorer, og her står Søren Rasmussen ofte klar til at hjælpe unge på vej. - Mange landmænd er over de 70, så det er vigtigt, at der bliver generationsskiftet. Hvis ejerskabet bliver for gammelt, går det i stå. Der er brug for nye visioner, siger Søren Rasmussen. Ifølge Ministeriet for Landbrug, Fiskeri og Fødevarer ventes op mod en tredjedel af alle heltidslandbrug i Danmark at skulle gennemgå et generationsskifte inden 2030. Søren Rasmussen har købt sig ind i en lang række af disse landbrug de senere år. Her har han bidraget med investeringer i produktionen, hjulpet med at effektivisere og også i nogle tilfælde været med til at udvide landbrugene. Faktisk laver han, efter eget udsagn, “næsten ikke andet”. Med sine investeringer vil han sikre landmændene de bedste muligheder for at få afsat deres afgrøder og dyr og samtidig samle værdikæderne, så større dele af produktionen foregår i Danmark. - Mange griseproducenter tænker kortsigtet, når de sender deres smågrise ud af landet. Det vil jeg ikke. Jeg investerer i den fulde produktion. Det, der skaber arbejdspladser i Danmark, siger Søren Rasmussen. Mere med på de nye tankerDe unge landmænd, der skal overtage fra den ældre generation, er “lidt mere med på de nye tanker”, mener Søren Rasmussen. Igen taler han om værdikæderne. Den grønne trepartDen grønne trepart er en aftale mellem regeringen, Landbrug & Fødevarer, Danmarks Naturfredningsforening, Fødevareforbundet NNF, Dansk Metal, Dansk Industri og KL. Aftalen blev indgået i juni 2024 og vedtaget i Folketinget i november samme år. Målet med aftalen er at få genoprettet livet i danske fjorde, søer og vandløb, skabe mere natur og biodiversitet og nå klimamål. Derudover skal CO₂-udledningen i landbruget nedbringes. Frem mod 2030 skal 400.000 hektar landbrugsjord omlægges til naturområder, svarende til Fyn og Lollands samlede areal. Desuden indfører Danmark som del af aftalen en CO₂​-afgift på landbrugsproduktion. Faktisk går han så meget op i, at dansk landbrug omstiller sig og hjemtager større dele af produktionen, at han mener, det burde have været en del af den grønne trepartsaftale, der skal gøre Danmark grønnere. - Jeg havde gerne set, at man havde bragt værdikædetankegangen ind i treparten, så CO₂-aftryk bliver beregnet på den fulde produktion, også det, der ryger ud af landet. Måske kan det få flere til at tænkte mindre på kortsigtet profitoptimering, siger Søren Rasmussen og tilføjer: - Sidste år eksporterede vi halvdelen af de levende grise ud af landet, kørte dem 16 timer i lastbil til Langtbortistan og lukkede slagterier. Søren Rasmussen er ifølge data fra handelsplatformen Resights ejer og medejer af omkring 11.000 hektar landbrugsjord. Foto: Janne Bekker / TV 2 GrafikMed den grønne trepart sigter regeringen, Landbrug og Fødevarer, Danmarks Naturfredningsforening med flere mod at gøre Danmark grønnere. Der er en CO₂-afgift på vej til landbruget, og man vil også have landmænd til at afgive jord, der kan omlægges til skov og natur. Hvordan har du det med visionerne bag den grønne trepartsaftale?- Vi bor og har jord ned til Mariager Fjord, så vi får det uden tvivl ind på nethinden. Det er et af de steder, hvor der skal udledes mindre, siger Søren Rasmussen med henvisning til, at fjorden er sårbar over for tilførsel af kvælstof og fosfor. Er du bekymret for det?- Det tror jeg såmænd nok, vi skal løse. Ingen større skovrejsningSøren Rasmussen er ikke meget for at svare på, hvordan han som en af landets store jordbesiddere vil bidrage til, at Danmark lykkes med den omfattende arealomlægning, der er igangsat med den grønne trepartsaftale. 15 procent af landbrugsjorden skal omlægges til skov og natur, lyder det i aftalen. - Vi planter både blomsterbrak og træer, bruger millioner på det hvert år, og vi kommer til at gøre mere. Der er vi på en rejse, siger landbrugsinvestoren. Han fortæller, at han er blevet ringet op af flere, som ønsker at rejse skov på hans jord. Men så må de først lukke grisestaldene, understreger Søren Rasmussen: - Vi planter ikke skov rundt om grisestaldene. Jeg skal have foder til grisene og kunne køre gylle rundt. Jeg deltager gerne i skovrejsning, især når vi har slidt grisehusene ned. Det skal bare give mening. Kunne du selv finde på at rejse skov i større skala?- Det bliver nok ikke mig, der ejer jorden, når der skal rejses skov. Men jeg kommer da nok til at skulle give nogle procent jord til det eller vådområder. Om det bliver direkte eller indirekte, det ved jeg ikke, lyder det fra Søren Rasmussen. De politiske ambitioner om at få omlagt 400.000 hektar landbrugsjord til skov, natur og vådområder er Søren Rasmussen ikke så bekymret for. Ifølge ham er der “masser af investorer, som er godt i gang med den bevægelse”. Det mærker han også, når han er på jagt efter jord. En hamstringsbølge i markedet?Flere steder i landet er der så stor interesse for investering i landbrugsjord, at priserne er steget kraftigt, mener Søren Rasmussen. - Hver anden dag er der en rigmand, som har købt jord eller en herregård til høje priser. - Nogle dele af Danmark gider jeg slet ikke køre hen til, fordi prisen er sat efter en anden opskrift end landbrugsopskriften. Jeg kunne tage et kort og lave en cirkel 40 kilometer rundt om Århus, hvor jeg slet ikke behøver kigge, siger Søren Rasmussen. Den store interesse for landbrugsjord kan ifølge eksperter få priserne på jord til at stige yderligere, og det kan godt bekymre landbrugsinvestoren. Ikke af samme årsag som Jacob Jelsing, der frygter forsinkelser i planerne om den grønne arealomlægning, men fordi en potentiel prisboble kan udfordre det generationsskifte i landbruget, han forsøger at hjælpe på vej. - Hvis man investerer i jord, skal man tro på, jord er mere værd om ti år. Men hvis sælgerne udbyder gårde og jord til mere, end det kan forrente, kan vi ikke følge med, siger Søren Rasmussen, der gerne skal have 3,5 procent i direkte afkast af sine investeringer og “håber på lidt konjunkturafkast”. Søren Rasmussen tror godt, der kan være tale om en vis hamstringsbølge i markedet, hvor jordejere i “sårbare områder” søger efter ny jord for at sikre sig, hvis en del af deres jord skal udtages. Du har selv købt voldsomt op. Hamstrer du for at sikre de landbrug, du er en del af?- Nej. Jeg er helt rolig. På koncernbetragtning har vi sådan set nok jord, siger Søren Rasmussen. Ifølge data fra handelsplatformen Resights ejer Søren Rasmussen og selskaber, han er medejer af, over 11.000 hektar jord, svarende til to gange Fanø.Del artikelDelFacebookXE-mailLinkKopiér"
