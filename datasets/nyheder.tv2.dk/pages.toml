["https://nyheder.tv2.dk/business/2025-01-24-kinesiske-droner-flyver-i-stort-set-alle-dele-af-danmark"]
title = "Kinesiske droner flyver i stort set alle dele af Danmark - TV 2"
description = "Myndighederne skal tænke sig grundigt om, når de køber fra Kina, siger minister."
full_description = '''BusinessKinesiske droner flyver i stort set alle dele af DanmarkMyndighederne skal tænke sig grundigt om, når de køber fra Kina, siger minister. Kinesiske droner flyver i stort set alle dele af DanmarkKinesiske droner flyver i stort set alle dele af Danmark20. feb kl. 08.10Ingen aftale endnuIngen aftale endnu28. feb kl. 12.27Rød åbning i DanmarkRød åbning i Danmark28. feb kl. 10.14Danish Crown lukker i KinaDanish Crown lukker i Kina27. feb kl. 10.41- Mange danske virksomheder mærker den her træghed i Tyskland- Mange danske virksomheder mærker den her træghed i Tyskland24. feb kl. 14.25Fred til arbejdsgiverne i en usikker verdenFred til arbejdsgiverne i en usikker verden23. feb kl. 16.19Opråb fra medarbejdere om bedre tone i branchenOpråb fra medarbejdere om bedre tone i branchen23. feb kl. 16.09Har øje på mangel på arbejdskraft i branchenHar øje på mangel på arbejdskraft i branchen23. feb kl. 16.01Lønstigning på 3000 kroner om månedenLønstigning på 3000 kroner om måneden23. feb kl. 15.52Økonomi har fyldt megetØkonomi har fyldt meget23. feb kl. 15.45Der er rent faktisk en del overraskelser, siger erhvervskommentatorDer er rent faktisk en del overraskelser, siger erhvervskommentator23. feb kl. 15.33Lønstigning vil smitte af på kommende aftalerLønstigning vil smitte af på kommende aftaler23. feb kl. 15.14 20. feb kl. 05.15Emil Vincent Sarrouw JensenArtiklen er opdateret med svar fra DJI.Kinesiske droner udstyret med kamera flyver i stort set alle dele af landet.Selvom PET har advaret mod den slags teknologi, har 71 danske kommuner alligevel købt en eller flere droner, der er produceret i Kina.Det viser en undersøgelse, som TV 2 har foretaget.I alt er der købt 223 droner fra den kinesiske producent Da Jiang (DJI), der er bandlyst af statslige myndigheder i USA.Hvis de bliver brugt i en sammenhæng, hvor kritisk infrastruktur er involveret, så er det noget rodAndreas Graae, Adjunkt og droneekspert, ForsvarsakademietDe bruges til at måle land op, føre miljøtilsyn, overflyve bygninger og udføre andre overvågningsopgaver.Droner fra DJI er ellers sortlistet af amerikanerne, og virksomheden anklages for at dele data med den kinesiske stat.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Sådan har vi gjort TV 2 har spurgt samtlige 98 kommuner om deres brug af droner. Ud af dem er 87 vendt tilbage indenfor tidsperioden, og 71 svarer, at de har en eller flere droner fra den kinesiske producent DJI. Samlet bruger kommunerne 223 droner, der er produceret i Kina. Dronerne udfører et hav af opgaver – blandt andet landopmåling, miljøtilsyn, overflyvning af bygninger og andre overvågningsopgaver. TV 2 har dog bedt kommunerne om at se bort fra droner, der bruges til undervisning på skoler og lignende. Sortlistet i USAI USA har de kinesiske droner længe været årsag til bekymring.I en trusselsvurdering fra 2023 advarede FBI alle amerikanske myndigheder om truslen fra droner, der er produceret i Kina, og lagde vægt på, at de udgør en "væsentlig risiko" mod USA's nationale sikkerhed.Det skyldes ifølge FBI, at dronerne kan indsamle data og sensitiv information om kritisk infrastruktur, og sende det hjem til Kina.DJI er verdens største producent af kommercielle droner. Foto: Christinne Muschi / Ritzau ScanpixI yderste tilfælde kan den slags data bruges til at planlægge sabotage eller cyberangreb mod amerikanske mål, lyder det i risikovurderingen.DJI er samtidig sortlistet af det amerikanske forsvarsministerium på grund af "deres tætte bånd til kinesisk militær", og derfor må statslige myndigheder i USA slet ikke bruge DJI.Verdens største producent af komercielle dronerDa Jiang (DJI) er verdens største producent af droner og har hovedsæde i Shenzhen, Kina. De producerer små fjernstyrede droner, der koster helt ned til et par tusind kroner for den billigste model, og kan købes i det meste af verden. Virksomheden står globalt for mere end 70 procent af det samlede marked for salg af droner til kommercielt brug. - Vi plejer at skele til USAPå trods af amerikanernes advarsler har vi her i landet ikke haft den samme berøringsangst over for de kinesiske droner.Det er tidligere kommet frem, at både forsvaret, flere styrelser og dansk politi har indkøbt fra DJI.Rigspolitiets indkøb af 130 droner fik i 2023 PET til at komme med en generel advarsel mod kinesisk overvågningsteknologi.Se ogsåKommuner shopper kinesiske elbiler trods advarsel fra Mette FMen kommunerne er altså fortsat med at købe dem.I Danmark har vi ellers for vane at lytte godt efter, når amerikanerne kommer med den slags advarsler, fortæller Andreas Bøje Forsby. Han er seniorforsker ved Dansk Institut for Internationale Studier (DIIS), hvor han har særligt fokus på udenrigspolitik og Kina.- Vi plejer at skele til USA, og fra dansk side er vi normalt opmærksomme på, hvad vores tætteste allierede har indført af restriktioner i forhold til især kinesisk teknologi, siger han.Journalistiske principperTV 2 publicerer nyheder ud fra journalistiske principper om etik og balance. Det betyder blandt andet, at vi faktatjekker, interviewer kilder og altid forsøger at lade sagens parter komme til orde. Du kan læse vores etiske retningslinjer her. TV 2 er desuden tilmeldt Pressenævnet og følger de presseetiske regler. Truslen skal tages alvorligAndreas Graae, der er adjunkt ved Forsvarsakademiet og ekspert i droner, vurderer, at de kinesiske droner i visse tilfælde kan udgøre en risiko.I hvert fald hvis de kommer for tæt på for eksempel energi- og vandforsyning, havne, kraftværker, datakabler eller på anden måde får adgang til sensitive data.- Meget af det, kommunerne laver, det er i sig selv ikke særligt hemmeligt. Men hvis de (red. droner) bliver brugt i en sammenhæng, hvor kritisk infrastruktur er involveret, så er det noget rod, siger han.Droneeksperten understreger samtidig, at truslen fra kinesisk overvågning er noget, der skal tages alvorligt – også i Danmark.-Al den data, som DJI kan indhente via deres brugere, må vi gå ud fra sendes direkte til myndigheder i Kina, som kan udnytte ellers uskadelig data ved at samkøre det. Det er netop den form for spionage, som efterretningstjenesterne herhjemme har advaret imod, siger han.PerspektivKinas indsamling af data Foto: TV 2I Kina har man indført lovgivning, der klart og tydeligt siger, at kinesiske myndigheder til enhver tid kan kræve, at virksomheder udleverer information. Efterretningslovgivningen fra 2017 giver de kinesiske efterretningstjenester mulighed for at pålægge virksomheder, organisationer og enkeltpersoner at udlevere enhver form for information og data, der har betydning for Kinas nationale sikkerhed. Loven giver også de kinesiske efterretningstjenester beføjelse til at udføre samme aktiviteter i udlandet som inden for Kinas grænser. Samtidig har Kina indført flere love for at begrænse udlandets adgang til data fra Kina. I 2021 indførte styret en lov, der minder om databeskyttelsesforordningen du kender fra EU, der har til formål at beskytte persondata. Den gjorde det langt sværere for internationale virksomheder at sende data ud af landet, og straffen for at bryde loven er store millionbøder og i yderste tilfælde fængselsstraf. Derudover har man også forbudt elbiler fra amerikanske Tesla at parkere tæt ved offentlige bygninger af frygt for, at bilerne kan indsamle geografiske data og opsnappe vigtig information via de indbyggede kameraer. Kilde: PET's vurdering af spionagetruslen mod Danmark (2023) og PwC. Andreas Bøje Forsby mener ikke, at man nødvendigvis kan fortænke kommunerne i, at de har valgt droner fra DJI, fordi der reelt ikke findes et fornuftigt alternativ.DJI har nemlig udkonkurreret de fleste andre producenter, og deres droner er både billigere og mere effektive, forklarer han.- DJI er kendt for at levere brugervenlige kvalitetsdroner. Så længe de ikke bliver brugt til opgaver, hvor der kan høstes følsomme oplysninger, så er der som udgangspunkt ikke et problem, siger han og tilføjer:- Men det forudsætter naturligvis, at kommunerne har gennemtænkt brugen af disse droner.Center for Cybersikkerhed oplyser til TV 2, at enhver form for teknologi med et kamera potentielt "kan angribes eller indeholde sårbarheder, der kan anvendes i forbindelse med cyberspionage".Men når det handler om udstyr som droner, er det et væsentligt spørgsmål, hvor og hvad de bruges til:- Hvis dronen skal overvåge dyreliv i et naturområde, er det ikke nødvendigvis problematisk. Men hvis man anvender den på et sted og på en måde, hvor man ikke tænker sikkerhed ind i det, så har man potentielt introduceret en sårbarhed, lyder det i et skriftligt svar.Må ikke flyve i nærheden af kritisk infrastrukturI Aarhus Kommune, der har købt 15 droner fra DJI, er man bevidste om, at der kan være en risiko forbundet med at bruge kinesisk teknologi.Kommunen har derfor indført tydelige retningslinjer for, hvor og hvornår dronerne må bruges. Det siger Rasmus Ry Nielsen, som er digitaliseringschef hos Teknik og Miljø i Aarhus Kommune.- VI har aldrig flyvninger nær kritisk infrastruktur, og vi holder en vis afstand til jordoverfladen, så billeder ikke kan bruges til ansigtsgenkendelse, fortæller han.Der er dog ingen tekniske foranstaltninger, der forhindrer dronerne i at flyve frit, så det er op til den enkelte dronepilot at overholde retningslinjerne.Nogle kalder det den nye silkevej. Kina forsøger at vinde store markedsandele med udbredelsen af teknologi, og det er også et forsøg på at sætte et geopolitisk aftrykAndreas Graae, Adjunkt og droneekspert, ForsvarsakademietMen hvis Aarhus Kommune vil erstatte de kinesiske droner, er der ikke et oplagt alternativ.- Vi er opmærksomme på, at vi ikke nødvendigvis altid kan forlade os på grej fra Kina. Men som reglerne er nu, så har vi ikke et alternativ, hvis de skal erstattes, siger han.Han peger på, at kommunen ligesom alle andre køber ind på fælles aftaler, og at man er forpligtet til at købe det bedste produkt til den laveste pris.DJI-drone. Foto: Steve Marcus / Scanpix DenmarkHos Kommunernes Landsforening (KL) forholder man sig ikke til den konkrete brug af droner og henviser i stedet til de gældende regler på området.- Når kommunerne køber droner, følger man selvfølgelig de regler og retningslinjer, som de danske myndigheder og EU har udstukket. Hvilke implikationer den globale handels- og sikkerhedssituation har for den offentlige sektors indkøb, er op til Folketinget og de relevante myndighederne at vurdere, lyder det i et skriftligt svar til TV 2.En ny silkevejBåde Andreas Bøje Forsby og Andreas Graae peger på et mere generelt problem ved indkøbet af kinesisk teknologi.Som tingene er lige nu, fungerer Kina i praksis som hele verdens kommercielle dronefabrik, og DJI sidder på suverænt den største markedsandel globalt.Den slags monopol er ifølge Andreas Graae en del af Kinas overordnede strategi, der handler om at få mere global indflydelse.- Nogle kalder det den nye silkevej. Kina forsøger at vinde store markedsandele med udbredelsen af teknologi, og det er også et forsøg på at sætte et geopolitisk aftryk og komme foran i teknologikapløbet med USA, siger han.Se ogsåNy plan skal redde Europa: - Vi har skudt os selv i fodenOgså Andreas Bøje Forsby peger på risikoen for, at kinesisk teknologi kommer til at fylde for meget.- Et argument for at droppe de her droner er, at vi bliver for afhængige af denne type monitoreringsteknologi fra Kina. Det er derfor, nogle mener, at man skal understøtte vestlige producenter i stedet, så kineserne ikke dominerer i samme grad, siger han.Den danske forhandler af de kinesiske droner, DJI Store Nordic, afviser at kommentere på risikoen ved brug af dronerne og henviser til moderselskabet i Kina. TV 2 har forholdt DJI kritikken, og virksomheden svarer skriftligt:- DJI er en privatejet og -kontrolleret virksomhed og har været det siden grundlæggelsen i 2006. Grundlæggeren kontrollerer virksomheden. Ingen regeringsenheder eller repræsentanter sidder i DJI's bestyrelse eller har nogen rolle i dens drift, lyder et uddrag.Læs det komplette svar fra DJI i bunden af artiklen.- Skal tænke sig grundigt om, siger ministerMinister for samfundssikkerhed og beredskab, Torsten Schack Pedersen (V), understreger, "at både myndigheder og virksomheder skal tænke sig grundigt om".- Der er ingen tvivl om, at med det trusselsbillede vi ser ind i, så skal man være meget opmærksom på cybersikkerhed, siger han til TV 2.USA har sortlistet og kalder dronerne en trussel mod national sikkerhed. Bør det ikke vække bekymring herhjemme?- Det er klart, at hvis man køber udstyr fra lande, som vi ikke har et sikkerhedspolitisk samarbejde med, så skal man være ekstra opmærksom, siger ministeren.Minister for samfundssikkerhed og beredskab Torsten Schack Pedersen (V). Foto: Mads Claus Rasmussen / Ritzau ScanpixTorsten Schack Pedersen svarer ikke direkte på, om der skal være klare retningslinjer for brugen af kinesisk teknologi i kommunerne, men henviser til at ministeriet løbende opdaterer deres anbefalinger til myndighederne.I et skriftligt svar oplyser Erhvervsministeriet til TV 2, at de mener, at "det under udbudsreglerne er muligt at varetage væsentlige sikkerhedsinteresser."- Det kan man for eksempel gøre ved at stille relevante krav i tekniske specifikationer og vilkår for udførelse af kontrakten, herunder for eksempel krav til data-opbevaring, lyder det.Svar fra DJIDJI er en privatejet og -kontrolleret virksomhed og har været det siden grundlæggelsen i 2006. Grundlæggeren kontrollerer virksomheden. Ingen regeringsenheder eller repræsentanter sidder i DJIs bestyrelse eller har nogen rolle i dens drift. DJI overholder alle gældende love, regler og standarder for databeskyttelse i alle de regioner, hvor vi opererer. Der har indtil videre ikke været beviser for, at DJI-droner sender følsomme data til uautoriserede parter. Siden 2017 har DJI proaktivt underlagt sine produkter regelmæssige uafhængige sikkerhedsaudits og udvidet rækkevidden af indbyggede brugerprivatlivskontroller i vores forbruger- og erhvervsdroner. Vi giver dronebrugere fuld kontrol over de data, de genererer. Brugere behøver ikke at dele disse data med DJI, og som standard bliver fotos, flyvelogs, videoer og mobildata ikke synkroniseret med DJI. Derudover kan vores kunder flyve vores produkter i Local Data Mode, hvilket betyder, at der ikke er nogen internetforbindelse. I praksis bliver dronen dermed det digitale svar på en air-gapped computer. Del artikelDelFacebookXE-mailLinkKopiér'''
