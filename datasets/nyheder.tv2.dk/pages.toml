["https://nyheder.tv2.dk/business/2025-02-17-nu-melder-elon-musk-sig-ind-i-kaploebet-om-kunstig-intelligens-den-er-iskold-over-for-etik-og-moral-siger-ekspert"]
title = "Nu melder Elon Musk sig ind i kapløbet om kunstig intelligens: - Den er iskold over for etik og moral, siger ekspert - TV 2"
description = "Tidligt tirsdag morgen dansk tid lancerede Elon Musk sin længe ventede chatbot, Grok 3."
full_description = "BusinessNu melder Elon Musk sig ind i kapløbet om kunstig intelligens: - Den er iskold over for etik og moral, siger ekspertTidligt tirsdag morgen dansk tid lancerede Elon Musk sin længe ventede chatbot, Grok 3.Elon Musk melder sig med Grok 3 ind i kapløbet om kunstig intelligens. Foto: Kevin Lamarque / Ritzau Scanpix 18. feb kl. 17.52Andreas PinstrupFørst ville han sætte udviklingen af kunstig intelligens på pause, da den indebar ''dybe risici for menneskeheden''.Men nu melder han sig ind i kapløbet om at skabe ''den mest intelligente AI på jorden''.Manden i centrum er verdens rigeste mand, Elon Musk, og den nye chatbot hedder Grok 3.Mens andre AI-tjenester som ChatGPT vil tøve med at indgå i samtaler om visse emner, kommer Grok 3 uden nogen former for censur.- Grok 3 er iskold over for etik og moral. Den svarer bare på, hvad den bliver bedt om, lyder det fra techekspert David Guldager.Enormt tæt kapløbGrok 3 har på lanceringsdagen indtaget en førsteplads på Chatbot Arenas rangliste som bedste tjeneste indenfor kunstig intelligens.Selvom listen er det bedste pejlemærke for, hvem der fører i kapløbet, så er det et marginalt forspring, da alle de største tjenester scorer højt på tværs af sidens kategorier, lyder det fra TV 2s AI-ekspert, Bo Bergstedt.- De store tjenester ligger og 'stjæler' hinandens udviklere hele tiden, og de træner deres chatbots på samme måde, så det er meget svært at fastholde et eventuelt forspring, siger han.Hvad er kunstig intelligens?Kunstig intelligens eller AI, som det kaldes efter det engelske udtryk artificial intelligence, er computerprogrammer og maskiner, som efterligner et eller flere aspekter af den menneskelige intelligens. Det gælder abstrakt tænkning, analyse, problemløsning, mønstergenkendelse, sprogbeherskelse og -forståelse, planlægning og lignende. Computerprogrammer, der spiller skak, diagnosticerer patienter, planlægger ruter eller fører en samtale, er eksempler på kunstig intelligens. Kilde: Danmarks Tekniske Universitet, DTU I januar var det kinesiske DeepSeek, der pludselig skød genvej og fik Vesten til at ryste i bukserne, da den trods et markant lavere budget end konkurrenterne pludselig lå side om side med veletablerede OpenAI, der står bag ChatGPT.Et kinesisk indtog, der sendte aktiekursen for verdens største selskab, chipproducenten Nvidia, ned med 18 procent – et tab, som siden er delvist genvundet.Se ogsåMusk leder storstilet forsøg på at købe selskabet bag ChatGPTNæste gennembrud for kunstig intelligens bliver ifølge Bo Bergstedt muligheden for at få kunstig intelligens til at overtage menneskelige opgaver med minimal til ingen menneskelig kontakt.Det kunne eksempelvis være, at den kunstige intelligens ikke blot planlægger din rejse, men at den også bestiller flybilletterne selv.- Du finder ikke en techdirektør, der på det seneste ikke har talt om såkaldte agenter. At AI bliver sluppet mere fri og begynder at kunne løse opgaver på internettet eller internt i en virksomhed uden menneskelig indblanding, siger han.Konkurrence skaber innovationI et kapløb gælder det om at komme først.På nuværende tidspunkt er der ingen, der ved, hvor målstregen for kunstig intelligens befinder sig, men konkurrencen på området gør, at vi nærmer os den hurtigere og hurtigere, vurderer techekspert David Guldager:PerspektivForholdet mellem Elon Musk og Sam Altman Foto: John Macdougall, Saul Loeb / Ritzau ScanpixElon Musk og Sam Altman var med til at stifte OpenAI i 2015. OpenAI startede som en nonprofitorganisation med et klart værdisæt. Fokus skulle være på sikkerhed og forskning – ikke på at tjene penge. Musk og Altman ragede i første omgang uklar i 2017, da det stod klart, at OpenAI havde brug for mere finansiering, hvis de skulle lykkes med at udvikle kunstig intelligens. Musk ønskede på dette tidspunkt at ændre OpenAI til et for-profit selskab. Uenigheder om virksomhedens fremtid fik i 2018 Elon Musk til at forlade OpenAI. - Den her konkurrencesituation gør, at innovationen vinder frem. De ligger og skubber til hinandens grænser, og der er nogle virksomheder, som løber virkelig stærkt for at nå næste fase.Konkurrencen er i høj grad båret frem af en intern rivalisering mellem Elon Musk og OpenAI's direktør, Sam Altman.- Elon Musk vil gerne overgå sin personlige rival, Sam Altman. Han har på mange måder en umoden tilgang til kapløbet, da det også har været en personlig målsætning for ham med Grok 3 at overgå Sam Altman, forklarer techeksperten.Grok 3 er endnu ikke lanceret i EU eller Storbritannien.Del artikelDelFacebookXE-mailLinkKopiér"
