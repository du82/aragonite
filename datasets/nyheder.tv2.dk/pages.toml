title = 'Danish Crown opgiver kinesisk eventyr og lukker "problembarn" - TV 2'
description = "Den danske slagterigigant Danish Crown lukker en fabrik i Kina. 112 personer står til at miste arbejdet."
full_description = 'BusinessDanish Crown opgiver kinesisk eventyr og lukker "problembarn"Den danske slagterigigant Danish Crown lukker en fabrik i Kina. 112 personer står til at miste arbejdet.Danish Crown lukker i KinaDanish Crown lukker i Kina27. feb kl. 10.44Ingen aftale endnuIngen aftale endnu28. feb kl. 12.27Rød åbning i DanmarkRød åbning i Danmark28. feb kl. 10.14- Mange danske virksomheder mærker den her træghed i Tyskland- Mange danske virksomheder mærker den her træghed i Tyskland24. feb kl. 14.25Fred til arbejdsgiverne i en usikker verdenFred til arbejdsgiverne i en usikker verden23. feb kl. 16.19Opråb fra medarbejdere om bedre tone i branchenOpråb fra medarbejdere om bedre tone i branchen23. feb kl. 16.09Har øje på mangel på arbejdskraft i branchenHar øje på mangel på arbejdskraft i branchen23. feb kl. 16.01Lønstigning på 3000 kroner om månedenLønstigning på 3000 kroner om måneden23. feb kl. 15.52Økonomi har fyldt megetØkonomi har fyldt meget23. feb kl. 15.45Der er rent faktisk en del overraskelser, siger erhvervskommentatorDer er rent faktisk en del overraskelser, siger erhvervskommentator23. feb kl. 15.33Lønstigning vil smitte af på kommende aftalerLønstigning vil smitte af på kommende aftaler23. feb kl. 15.14Nu er ny overenskomst underskrevetNu er ny overenskomst underskrevet21. feb kl. 10.51 27. feb kl. 11.13Mikkel Walentin MortensenEfter at en række slagterier er blevet lukket i Danmark de seneste år, får krisen i Danish Crown nu også konsekvenser på den anden side af jorden.Slagterigiganten lukker således en fabrik i den kinesiske by Pinghu, der ellers tidligere var udset som starten på et større eventyr.Det oplyser Danish Crown i en pressemeddelelse torsdag formiddag.- Vores strategiske gennemgang viste, at vi reelt stod med to muligheder; enten at sælge fabrikken eller lukke den og flytte udstyret derfra til vores fabrikker i Europa. Det var altså ikke længere en reel mulighed at fortsætte med det nuværende setup i Pinghu, udtaler virksomhedens finansdirektør, Anders Aakær Jensen.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Tilbage i 2019 lignede det et stort eventyr, men det har vist sig at være et blødende sårJens Nymark, erhvervsanalytiker hos TV 2Fra hjørnesten til problembarnDanish Crown havde i årtier haft succes med at sælge frossen svinekød til Kina, men med indvielsen af fabrikken i Pinghu ville den danske kødkæmpe vinde endnu større indpas på det kinesiske marked.- Fabrikken er hjørnestenen i den satsning, der skal gøre Danish Crown til et veletableret brand i Kina i løbet af de næste fem år, sagde Danish Crowns daværende administrerende direktør, Jais Valeur, i forbindelse med åbningen i september 2019.Se ogsåDanske svin har det svært i Asien, så nu bliver der fyret i Ringsted – fokus skal være på bacon og pepperoniMen kort efter ramte coronapandemien, der fik Danish Crown til at lukke fabrikken ned, og siden har økonomiske problemer plaget hele Danish Crown-koncernen.I september sidste år, fem år efter åbningen i Kina, skiftede Danish Crown direktør, og den nye mand på toppen, Niels Duedahl, gjorde det hurtigt klart, at Kina-satsningen skulle ses efter i sømmene.- Der er en mindre produktion derude, men det er klart, at den fabrik er et problembarn. Det er tabsgivende, og scenariet er salg eller afvikling, for vi ser ikke en fremtid for den, sagde Niels Duedahl i januar til mediet Agriwatch.Se ogsåNy direktør skal redde kriseramt slagterigigant - medejere har truet og presset17.000 kvadratmeter til salgSelvom fabrikken i Pinghu nu bliver lukket ned, har Danish Crown ikke afskrevet den fuldstændigt.Fabrikken, der strækker sig over 17.000 kvadratmeter og har 112 medarbejdere i øjeblikket, skal nemlig gerne sælges, bliver det oplyst.Ifølge Anders Aakær Jensen har Danish Crown allerede underskrevet en hensigtserklæring og aftalt vilkårene for et frasalg, men der kan stadig gå nogle måneder, inden aftalen falder helt på plads.Hvad Danish Crown kan tjene på at sælge fabrikken i Pinghu, fremgår ikke, men pengene vil lune for selskabet, der de seneste år har kæmpet med faldende overskud.- Tilbage i 2019 lignede det et stort eventyr, men det har vist sig at være et blødende sår, som har kostet Danish Crown op mod syv milliarder kroner. Derfor tager man den her store beslutning og siger: Det skal slutte nu, siger TV 2s erhvervsanalytiker Jens Nymark om nyheden.Se ogsåDanish Crown er i krise, viser nyt regnskabDel artikelDelFacebookXE-mailLinkKopiér'
