title = "Menighedsrådsformand med ”bibelsk” drøm møder ”tåbelig” modstand - TV 2"
description = "Den grønne trepart lægger op til den største arealomlæggelse i Danmarkshistorien. Alligevel er det svært lokalt at få lov at rejse skov"
full_description = 'BusinessMenighedsrådsformand med ”bibelsk” drøm møder ”tåbelig” modstandDen grønne trepart lægger op til den største arealomlæggelse i Danmarkshistorien. Alligevel er det svært lokalt at få lov at rejse skov Menighedsrådsformand udpeger de områder, kirken håber at overtageMenighedsrådsformand udpeger de områder, kirken håber at overtage21. feb kl. 14.37Det er områder omkring Tryggevælde Å, kirken vil overtageDet er områder omkring Tryggevælde Å, kirken vil overtage21. feb kl. 14.41Ingen aftale endnuIngen aftale endnu28. feb kl. 12.27Rød åbning i DanmarkRød åbning i Danmark28. feb kl. 10.14Danish Crown lukker i KinaDanish Crown lukker i Kina27. feb kl. 10.41- Mange danske virksomheder mærker den her træghed i Tyskland- Mange danske virksomheder mærker den her træghed i Tyskland24. feb kl. 14.25Fred til arbejdsgiverne i en usikker verdenFred til arbejdsgiverne i en usikker verden23. feb kl. 16.19Opråb fra medarbejdere om bedre tone i branchenOpråb fra medarbejdere om bedre tone i branchen23. feb kl. 16.09Har øje på mangel på arbejdskraft i branchenHar øje på mangel på arbejdskraft i branchen23. feb kl. 16.01Lønstigning på 3000 kroner om månedenLønstigning på 3000 kroner om måneden23. feb kl. 15.52Økonomi har fyldt megetØkonomi har fyldt meget23. feb kl. 15.45Der er rent faktisk en del overraskelser, siger erhvervskommentatorDer er rent faktisk en del overraskelser, siger erhvervskommentator23. feb kl. 15.33 26. feb kl. 08.53Charlotte Rudiengaard Rasmussen & Signe Mai VilsbøllVild natur og biernes summen, en lille bro ned til åen og en samlingsplads for lokalsamfundets skoler og børnehaver. Når Nis Hatt lukker øjnene og forestiller sig, hvordan de nu så golde marker kan komme til at se ud i fremtiden, får han et smil på læben. - Det lyder måske sådan lidt bibelsk, men jeg har en drøm om at give det gode liv videre. Det gode liv med naturen helt tæt på. Det, som jorden var engang, siger menighedsrådsformanden. Han står med en helt unik mulighed for at ændre den jord, landbrugsmaskiner indtil for nylig satte deres tunge aftryk i, fordi kirkens forpagtningsaftale med den lokale landmand udløber. Strøby Kirke i Nordstevns Pastorat råder over tolv hektar jord, som tidligere var forpagtet ud til en landmand. Foto: Peter Thorsøe / Peter ThorsøeOg med statens udmeldinger i den netop vedtagne grønne trepart om flere grønne og naturlige arealer i Danmark, ser Nis Hatt muligheder. Den grønne trepartDen grønne trepart er en aftale mellem regeringen, Landbrug & Fødevarer, Danmarks Naturfredningsforening, Fødevareforbundet NNF, Dansk Metal, Dansk Industri og KL. Aftalen blev indgået i juni 2024 og vedtaget i Folketinget i november samme år. Målet med aftalen er at få genoprettet livet i danske fjorde, søer og vandløb, skabe mere natur og biodiversitet og nå klimamål. Derudover skal CO₂-udledningen i landbruget nedbringes. Frem mod 2030 skal 400.000 hektar landbrugsjord omlægges til naturområder, svarende til Fyn og Lollands samlede areal. Desuden indfører Danmark som del af aftalen en CO₂​-afgift på landbrugsproduktion. Han er bare allerede stødt på de første udfordringer.Som formand for menighedsrådet i Nordstevns Pastorat er han ansvarlig for at finde ud af, hvad der nu skal ske med de godt tolv hektarer jord, som kirken ejer. Det er ikke så svært. Til gengæld er det svært at finde ud af, hvordan man kommer i mål.- Jeg har mange drømme og visioner for det her sted, men jeg er stødt ind i et sandt kludetæppe af regler og lovgivning, der på hver sin måde spænder ben for at gøre det, som staten egentlig efterspørger, forklarer han. Sommerfugle og vandkalveKirken står nærmest majestætisk på toppen af de omkringliggende marker, og menighedsrådsformanden forestiller sig sammen med præsten i Strøby Kirke, at området omkring kirken kunne blive et lokalt samlingspunkt.TIP OS!Er du landmand, jordejer eller nabo til et område, der kan blive omlagt til skov og natur? Så vil vi gerne høre fra dig. Skriv en mail til sigv@tv2.dk. - Hvis markerne kunne omdannes til vild natur med blomstereng og flotte, grønne træer og måske en lille gangsti ned til Tryggevælde Å, som ligger lige hernede for enden af markerne, så ville det være en kæmpe gevinst for hele området og ikke kun kirken, siger præst Janne Melcher. Og de drømme flugter rigtig godt med statens vedtagelse af den grønne trepart, hvor der blandt andet står, at godt ti procent af Danmarks samlede areal skal omlægges til skov og natur frem til 2045. Det er der afsat 43 milliarder kroner til. Men de flugter samtidig rigtig dårligt med lokalplanerne for området. Her står der nemlig, at det ikke er tilladt at rejse skov på områderne, fordi der skal være et såkaldt “indkig” til kirken. Og gangbroen ned til åen, hvor menighedsrådsformanden havde forestillet sig børn, der fisker med net efter sommerfugle og vandkalve, må kirken nok også skyde en hvid pind efter. Man skal have det organiseret sådan, at folk ikke taber pustenJørgen Primdahl, professor på Institut for Geovidenskab og Naturforvaltning på Københavns Universitet- EU-lovgivning vil ikke tillade, at man bygger på arealet ned til åen, siger Nis Hatt. Han fortæller, at han føler sig lidt som Sisyfos, der i den græske mytologi var dømt til i evig tid at rulle en sten op ad en bjergside. Hver gang han næsten var ved toppen, rullede stenen fra ham igen. Så var det forfra igen.At det skal være så svært at opfylde statens ønsker, forstår han ikke.- Det virker rent ud sagt tåbeligt, at vi skal kæmpe så meget for at lave udpint landbrugsjord om til natur, understreger han. Hvem ringer man til?En landskabsarkitekt har foreslået menighedsrådet at sætte naturen fri, så der kan gro det, der nu kan gro, men det er menighedsrådsformanden faktisk ikke helt sikker på, at man må. For der står i loven, at man ikke må vende ryggen til jordbesiddelsen og bare lade stå til. Så nu foreslår landskabsarkitekten, at man smider frø ud, der til forår og sommer vil blive til blomstermarker. Så overtræder menighedsrådet ikke nogen lovgivning. Tror formanden i hvert fald. - Det bliver sikkert også rigtig fint. Men det ærgrer mig, at vi ikke kan gøre mere for både at gøre det her til et naturskønt område, men også nogle arealer som lokale børnehaver og skoler kan samles om, siger Nis Hatt. Præst Janne Melcher og menighedsrådsformand Nis Hatt savner hjælp fra staten til, hvordan de skal opfylde ønskerne om mere vild natur og skovrejsning på kirkens jordbesiddelser. Foto: Peter Thorsøe / Peter ThorsøeMest af alt ønsker præsten og menighedsrådsformanden, at der vil komme en form for hjælp til sådan nogle som dem, der gerne vil mere vild natur og mindre opdyrkning af marker. - Jeg vil bare gerne have et nummer at kunne ringe til, så vi kan få hjælp til, hvordan vi navigerer i alle de her regler og love. Man mister jo helt modet, når processen er så tung. Jeg forstår simpelthen ikke, at det skal være så kompliceret, siger Janne Melcher. Et sandt regel-kludetæppeIkke langt fra det nordstevnske pastorat sidder Jørgen Primdahl. Han er professor på Institut for Geovidenskab og Naturforvaltning på Københavns Universitet, og hele sit liv har han arbejdet med arealomlægning i Danmark og været med til at indgå i mange lokale samarbejdsprojekter om natur og landskab.- Det er godt, at man ser det som en samarbejdsopgave, men man skal have det organiseret sådan, at folk ikke taber pusten. Opgaven med at få det her til at lykkes skal man give til nogen, som har en interesse i, at det sker og ikke mindst har noget ekspertise, forklarer han. Han forstår godt, at det kan være svært for den enkelte at finde hoved og hale i den grønne trepart, og hvad den kan komme til at betyde for dig og mig. Og ikke mindst for arbejdet med den største arealomlægning i det danske landskab siden landboreformerne i slutningen af 1700-tallet. - Det, der foregår lige nu, er det, jeg vil kalde typisk dansk og med et begreb, som jeg har tyvstjålet, nemlig den såkaldte fordørspolitik, påpeger Jørgen Primdahl. Vi er faktisk ude i, at kaffeforgiftning kan blive anerkendt som en arbejdsskadeMads Flinterup, klima- og biodiversitetschef i HedeselskabetAltså at man ifølge Jørgen Primdahl fra centralt hold – og især fra regeringen men også fra organisationerne – stiller sig op og fortæller, at nu skal det hele laves rigtigt og ordentligt og omfattende, så vi får løst det her problem én gang for alle. - Men så mangler der noget mere konkret om, hvad der skal ske og ikke mindst hvordan, forklarer han. Et meget sigende dilemmaMed den grønne trepart er det besluttet, at der skal udtages 140.000 hektar kulstofrige lavbundsjorde, og 250.000 hektar skal omplantes til skov. Det betyder, at et samlet areal på cirka otte gange Falster over de kommende år vil blive omlagt til natur, skov og vådområder. Aftalen siger ikke noget om, hvor og hvordan træerne skal plantes, og hvor lavbundsjordene skal udtages. Heller ikke, hvilke arealer det vil være bedst at placere solceller, vindmøller og energianlæg på. Det er i stedet lagt ud til de enkelte kommuner, der skal finde løsningen lokalt. - Ser vi på de instrumenter, der er til rådighed, gælder det, at arealanvendelse i det åbne land er reguleret i et stadigt mere uoverskueligt kludetæppe af støtteordninger og restriktiv lovgivning. Det skal der ryddes op i, siger Jørgen Primdahl.Han mener, at det dilemma, som Nordstevns Pastorat står i, er meget sigende for den proces, der går i gang nu. - I det konkrete eksempel gør menighedsrådsformanden jo alt, hvad han kan. Så hvem skal han ringe til for at finde en vej? Det er jo det, der er problemet her, påpeger han. Kirken vil blandt andet etablere gangstier og vild natur i området. Video: TV 2 NEWSHan fremhæver, at staten i aftalen om den grønne trepart har sørget for, at der er såkaldte “omlægningskonsulenter” sat i spil til at kunne løse spørgsmål om tilskud, lovgivning og regler. Men der vil ifølge Jørgen Primdahl i mange tilfælde være brug for anden rådgivning end den, landbrugskonsulenter kan yde, og der er i det hele taget brug for oprustning på rådgivningssiden, mener han.- Det vil også være en rigtig god idé, hvis kommunerne identificerer en række større indsatsområder, hvor de forskellige mål kan tænkes sammen, og hvor man i fællesskab kan udvikle strategier for fremtiden, understreger Jørgen Primdahl.Fra landbrugsjord til vild naturLige netop det med at skulle blive enige om at se det gode i en ny idé er for klima- og biodiversitetschef Mads Flinterup fra Hedeselskabet en helt afgørende hjørnesten i den grønne trepart. - Det kan blive ret komplekst. For hvis man skal genoprette naturen, så skal man jo have rigtig mange mennesker med forskellige holdninger og ønsker til at blive enige om kursen, understreger han. Hedeselskabet står blandt andet for at forvalte store skovarealer og investere i skov i Danmark og flere andre europæiske lande og arbejder også med natur- økosystemgenopretning.Det er jo ikke alle, der er enige med mig i, at vild natur på områderne her er vejen fremNis Hatt, Formand for menighedsrådet i Nordstevns PastoratFaktisk blev Hedeselskabet sat i verden i 1866 for at hjælpe de danske bønder med at opdyrke heden. Men selv om Hedeselskabet altså blev til for at omlægge og forme landskabet til dyrkning, så understreger Mads Flinterup, at opgaven nu ikke er meget anderledes end dengang. Fokus er bare et andet.- Førhen lå det nærmest i vores DNA, at al land skulle gøres til frugtbar landbrugsjord, men nu handler det langt mere for os om at sikre os, at vi er rustet til den nye virkelighed med klimaforandringer, biodiversitetskrise og et krav om at mindske CO2-udledninger, siger Mads Flinterup. Derfor er han også overordnet glad for, at den grønne trepart har set dagens lys. Hvordan den føres ud i livet, forholder han sig mere skeptisk til.En gul, bølgende kornmark hitterMads Flinterup mener, at hele idéen med, at det er ude i kommunerne, slaget skal stå, og fordelingen skal finde sted, kommer til at trække processerne i langdrag. For det er rigtig mange mennesker, der skal blive enige.Han peger blandt andet på ét af de projekter, som er nævnt i den grønne trepart: genopretning af Kolindsund Sø på Djursland. - Bare det ene projekt bliver en kæmpe opgave, hvor staten skal blive enig med femten lodsejere, som jo nok har femten forskellige motivationer. Det bliver meget svært at nå til enighed lokalt, siger han.Og det kan godt være, at man på Christiansborg er blevet enige om en bred aftale. Men ude i de forskellige kommuner er det ifølge Mads Flinterup langt fra alle der synes, at mere natur er vejen frem. - Du skal ikke sidde til mange forsamlingshusmiddage, før du finder ud af, at der altså sidder rimelig mange mennesker derude, der mener, at en bølgende kornmark er væsentlig federe natur end noget som helst, som jeg som biodiversitetsaficionado kan finde på at sætte op, ik? understreger Mads Flinterup. Stubbene på jorden vidner om mange års opdyrkning og pløjning af jorden, der ligger lige ned til Tryggevælde Å. Foto: Peter Thorsøe / Peter ThorsøeHan frygter, at processen med at skabe mere natur i Danmark kan trække i langdrag, og at målene, der er sat med den grønne trepart, ikke nås. Netop fordi der ikke er tænkt i en overordnet fordelingsnøgle eller national areallov. - Vi er faktisk ude i, at kaffeforgiftning kan blive anerkendt som en arbejdsskade. Der skal gang i den helt store kaffedrikning ude lokalt for at nå til enighed. Men uanset hvor meget kaffe, der bliver drukket, er jeg bange for, at det kan vise sig at være rigtig svært at nå i mål til tiden, og at det kan blive rigtig svært at nå til enighed under de rammer, vi kender for treparten i dag, siger Mads Flinterup. Der skal fjernes nogle sten på markenPå Christiansborg medgiver Minister for Grøn Trepart, Jeppe Bruus, at der er nogle sten, der skal "fjernes fra marken" for at få sat mere fart under omlægningen.- Men vi må heller ikke glemme, at der sker rigtig meget lige nu rundt omkring i hele landet, og at der er rigtig meget, der går godt. Der er så nogle steder, hvor der er nogle blokeringer, og det skal vi have kigget på, siger han.Hvad vil du helt konkret gøre?- Vi skal have gang i samarbejdet med kirker og andre statslige myndigheder, der ejer jord rundt omkring, og det skal ind i de ordninger, vi sidder og arbejder med, forklarer ministeren.Kan du ikke som minister sige til kommunerne, at nu må der ryddes op, så vi kan få sat gang i arbejdet uden forhindringer?- Vi har nedsat 23 udvalg, som sidder rundt i hele landet og kigger på, hvordan landskabet skal omlægges. Og der sidder kommunerne jo også, og dér får vi alle de her input ind. Så er opgaven at løse de problemer, der opstår undervejs, lyder det fra ministeren.Mere kaffe, økonomi og afstemningTilbage i Strøby Kirke ved formanden for menighedsrådet også godt, at der skal drikkes en hel del kaffe for at indfri ønskerne om mere natur og skov på kirkens arealer.For det er ikke kun kommunen og EU, der kan slå revner i fundamentet under naturvisionerne.Det kan naboerne også. Den private ejendomsret sk'
