["https://nyheder.tv2.dk/udland/2025-03-02-trump-indfoerer-officielt-sprog-for-at-samle-usa"]
title = "Trump indfører officielt sprog for at samle USA - TV 2"
description = "Engelsk som nationalt sprog skal samle USA, der er præget af indvandring fra hele verden, lyder udtalelse fra Trump."
full_description = "Trump i Det Hvide HusTrump indfører officielt sprog for at samle USAEngelsk som nationalt sprog skal samle USA, der er præget af indvandring fra hele verden, lyder udtalelse fra Trump.USA's præsident, Donald Trump, mener, at engelsk som officielt sprog vil samle landet. Foto: Saul Loeb / Ritzau Scanpix I dag kl. 05.11RitzauDen amerikanske præsident, Donald Trump, har lørdag indført engelsk som USA's officielle sprog.Det skriver Det Hvide Hus i en pressemeddelelse. Donald Trump står som afsender af meddelelsen.- Vores nations statslige dokumenter, herunder uafhængighedserklæringen og forfatningen, er alle skrevet på engelsk. Det er derfor på høje tid, at engelsk bliver erklæret for USA's officielle sprog.- Et nationalt udpeget sprog er kernen i et forenet og sammenhængende samfund, og USA styrkes af en befolkning, der frit kan udveksle idéer på et fælles sprog, lyder det.Dekretet ophæver et dekret fra 1990'erne under den daværende præsident Bill Clinton.Der tales mere end 350 sprog i USADet daværende dekret krævede ifølge nyhedsbureauet AFP, at føderale myndigheder og myndigheder, der modtager finansiering af staten, skal yde hjælp til ikke-engelsktalende borgere.Ifølge det nye dekret vil agenturerne stadig selv kunne beslutte, hvor megen hjælp de vil tilbyde på andre sprog end engelsk.- Intet i denne ordre kræver eller foreskriver dog nogen ændring i de tjenester, der leveres af noget agentur, lyder det i pressemeddelelsen.Se ogsåVild plan om at gøre Trump til diktator har fundet vej til hans inderkredsDet Hvide Hus anerkender, at der tales mere end 350 sprog i USA, lyder det videre.- Når vi byder nye amerikanere velkommen, vil en politik, der tilskynder til at lære og anvende vores nationale sprog, gøre USA til et fælles hjem og give nye borgere mulighed for at opnå den amerikanske drøm, lyder det.40 millioner spansktalendeNæsten 68 millioner mennesker taler et andet sprog end engelsk i hjemmet, viser tal fra den amerikanske regering fra 2019 ifølge AFP.Mens engelsk er langt det største sprog i landet, anslås det, at mere end 40 millioner mennesker i USA taler spansk i hjemmet.Ud over andre indvandrergrupper som kinesere og vietnamesere omfatter det komplekse amerikanske sproglandskab en lang række sprog fra USA's oprindelige folk.Del artikelDelFacebookXE-mailLinkKopiér"
