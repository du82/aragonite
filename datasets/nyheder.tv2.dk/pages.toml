["https://nyheder.tv2.dk/udland/2025-02-19-trump-kritiserer-ukraine-for-krigen-i-skulle-aldrig-have-startet-den"]
title = 'Trump kritiserer Ukraine for krigen – "I skulle aldrig have startet den" - TV 2'
description = "USA's præsident sagde tirsdag, at Ukraine startede krigen mod Rusland. Forsøget på at omskrive historien var kun en blandt flere løgne fra Trump."
full_description = '''Krigen i UkraineTrump kritiserer Ukraine for krigen – "I skulle aldrig have startet den"USA's præsident sagde tirsdag, at Ukraine startede krigen mod Rusland. Forsøget på at omskrive historien var kun en blandt flere løgne fra Trump.Donald Trump taler ved sit resort i Mar-a-Lago resort i Florida 18. februar 2025. Foto: Roberto Schmidt / Ritzau Scanpix 19. feb kl. 13.23Peter MøllerDigital efterretnings-korrespondentMeget har ændret sig, siden de russiske kampvogne rullede over grænsen til Ukraine 24. februar 2022.I de seneste tre år har størstedelen af den vestlige verden – med USA i spidsen – holdt Ruslands præsident, Vladimir Putin, ansvarlig for overfaldet på sit naboland.Men sådan er det ikke mere.Han er gået fuld Kreml. Han har simpelthen overtaget Putins talepunkterJacob Kaarsbo, tidligere chefanalytiker i Forsvarets EfterretningstjenesteTirsdag aften gik USA's præsident, Donald Trump, hårdt til angreb på Ukraine og landets præsident, Volodomyr Zelenskyj, for at føre krig mod russerne.TV 2 PlayKampen om USA: Bør Europas ledere læse Trumps bog?Angrebet kom med en kritik af Ukraines ønske om at sidde med ved forhandlingsbordet, når USA og Rusland drøfter landets skæbne.- I dag hørte jeg: "Åh, vi blev ikke inviteret". Altså, I har været der i tre år. I skulle have afsluttet den efter tre år. I skulle aldrig have startet det. I kunne have lavet en aftale, lød det fra Trump under et pressemøde i Mar-a-Lago i Florida.Her talte præsidenten med en gruppe indbudte mediefolk og svarede på spørgsmål om de forhandlinger, USA netop har indledt med Rusland i Saudi-Arabien.Anklagen mod Ukraine var kun én i en række, der gav indtryk af, at vi står over for en ny verdensorden.Ødelagte kampvogne i Kyiv-forstaden Butja, hvor russiske soldater skød civile ukrainere og begik krigsforbrydelser i februar 2022. Foto: Zohra Bensemra / Ritzau ScanpixZelenskyj under angrebFor eksempel angreb Donald Trump Ukraines præsident, Volodomyr Zelenskyj, der ellers er blevet hyldet som en helt i USA for at have modstået Ruslands blitzkrig i begyndelsen af 2022.Men under tirsdagens møde blev Donald Trump spurgt, om han bakkede op om et ønske fra Rusland om, at der skal være valg i Ukraine.Den amerikanske præsident bliver spurgt ind til, hvor vidt man vil støtte et russisk krav om et valg i Ukraine for at nå en fredsløsning. Video: TV 2 NEWSOg præsidenten valgte at stille sig på russernes side.- Vi har en situation, hvor vi ikke har haft valg i Ukraine, og hvor vi har undtagelsestilstand. Lederen i Ukraine, jeg hader at sige det, men han er nede på fire procent i opbakning, og landet er blevet sprængt til ukendelighed, sagde Donald Trump.Han tilføjede, at idéen om at holde valg i Ukraine skam ikke kom fra russerne.- Det kommer ikke fra Rusland. Det er noget, der kommer fra mig og mange andre lande, sagde Donald Trump.Mens Donald Trump angreb Volodomyr Zelenskyj, var den ukrainske præsident i Ankara for at hente opbakning fra Tyrkiet. Foto: Necati Savas / Ritzau ScanpixDet er svært at udføre pålidelige meningsmålinger i en krigszone, hvor tusindvis af ukrainere er internt fordrevne eller er flygtet ud af landet. Men intet tyder på, at Donald Trumps udsagn om fire procents opbakning til Zelenskyj er sandt.De seneste målinger, som blev udført af Kyiv International Institute of Sociology i december 2024, viser, at opbakningen til Volodomyr Zelenskyj i den ukrainske befolkning er oppe på 52 procent.At ukrainerne egentlig skulle have holdt et præsidentvalg i april sidste år er sandt nok. Men Ukraines forfatning giver mulighed for at udsætte valg på grund af krig, og Volodomyr Zelenskyj valgte at udsætte valghandlingen på grund af den russiske invasion.OverdrivelsenUnder samtalen blev Donald Trump spurgt om, hvordan han vil undgå, at Rusland blander sig i et eventuelt ukrainsk valg og indsætte en marionetregering.Præsident Putin og jeg talte om Ukraine. Det var hans øjestenDonald Trump, USA's præsidentDet svarede han ikke på, men understregede, at han skam godt kan lide Volodomyr Zelenskyj.- Jeg kan godt lide ham personligt. Han er okay, men det handler ikke om det personlige for mig – det handler om at få opgaven løst. Lige nu har du en ledelse, der har tilladt en krig at fortsætte, som aldrig burde have fundet sted, sagde Donald Trump.Under mødet kom Donald Trump desuden med en overdrivelse af, hvor mange mennesker, der har mistet livet i krigen, og hvor store ødelæggelserne er.- Når man ser på, hvad der sker i Ukraine, hvor millioner af mennesker er blevet dræbt, inklusive soldater, millioner af mennesker dræbt, en stor del af deres byer jævnet med jorden. Jeg forstår ikke, hvordan nogen overhovedet kan bo der. Når de siger, at de har lavet en meningsmåling, og Zelenskyj er på fire procent – hvem bor der overhovedet? lød det fra Donald Trump.I modsætning til, hvad Donald Trump siger, står de fleste ukrainske byer der endnu. Antallet af døde og sårede i krigen er ukendt, men anslås at være på cirka en million.Droneangreb mod Ukraines hovedstad, Kyiv, mandag 17. februar – som det fremgår af billederne, står en stor del af byen der endnu. Foto: Gleb Garanich / Ritzau ScanpixUnder Donald Trumps samtale med de indbudte mediefolk gav han også sin forgænger, Joe Biden, noget af skylden for krigen og sagde, at den ville have være undgået, hvis Trump havde vundet valget i 2020.- Dette er noget, der aldrig burde være sket, og som aldrig ville være sket. Jeg plejede at diskutere det med Putin. Præsident Putin og jeg talte om Ukraine. Det var hans øjesten, kan jeg fortælle jer, men der var aldrig en chance for, at han ville gå ind. Og jeg sagde til ham: "Du må hellere lade være med at gå ind. Gå ikke ind, gå ikke ind," og han forstod det. Han forstod det fuldt ud, sagde Donald Trump.Tredje verdenskrigIfølge præsidenten er det nu de europæiske lande, der risikerer at starte en ny krig.- Jeg er kun interesseret i at se, om jeg måske kan redde millioner af liv. Det her kan ende i en tredje verdenskrig. For at være ærlig over for jer. I hører nu, at Europa siger: "Tja, vi tror, at vi bliver nødt til at gå ind," og pludselig ender vi i en tredje verdenskrig over noget, der aldrig burde være sket. Og det er en meget trist situation, lød det fra Donald Trump.I Ukraine bliver Donald Trumps nye forhold til Rusland og beskyldninger mod landet modtaget med afdæmpede svar.Han har ret i, at det kan udvikle sig til tredje verdenskrigJacob Kaarsbo, tidligere chefanalytiker i Forsvarets EfterretningstjenesteFor eksempel sagde det ukrainske parlamentsmedlem Oleksij Hontjarenko til BBC, at præsidentens udtalelser "ikke er rare at høre", men at Ukraine ikke kan tåle at tabe USA som allierede.Volodomyr Zelenskyj selv er noget mere skarp i sine udtalelser og siger, at Donald Trumps påstand om, at han kun har opbakning fra fire procent i befolkningen er "russisk desinformation". Den ukrainske præsident siger også, at Trump er "fanget i en boble af russisk desinformation", og at "hvis nogen ønsker at fjerne mig nu, vil det ikke virke".Trump taler med mediepersoner og influencere i Mar-a-Lago, 18. februar 2025. Foto: Roberto Schmidt / Ritzau ScanpixJacob Kaarsbo, der er udenrigs- og sikkerhedspolitisk kommentator og tidligere chefanalytiker i Forsvarets Efterretningstjeneste, har også hørt Donald Trumps udtalelser, og han er ikke i tvivl om, hvor den amerikanske præsident har fået sine talepunkter fra. - Han er gået fuld Kreml. Han har simpelthen overtaget Putins talepunkter. Han vender verden på hovedet, ligesom når man udtaler sig fra Kremls side, siger han til TV 2.Ifølge Jacob Kaarsbo kan Donald Trump have et ønske om at få fjernet Ukraines præsident, Volodomyr Zelenskyj, så USA kan lave en forretningsaftale med Rusland.Aftalen kan for eksempel handle om at dele Ukraines naturressourcer.- Aftaler han et magtskifte i Ukraine med Putin, kan man dele i porten. Rusland har før haft Kreml-tro folk ved magten i Kyiv, og Trumps version af et demokrati er nok i virkeligheden mere et autokrati, siger Jacob Kaarsbo.Han deler i øvrigt Donald Trumps bekymring om, at situationen kan udvikle sig til en storkrig, men påpeger, at ansvaret ligger hos Donald Trump.- Han har ret i, at det kan udvikle sig til tredje verdenskrig. Men så er det, fordi han ikke vil forsvare Europa og sætte sig op mod diktatorer, siger Jacob Kaarsbo.Del artikelDelFacebookXE-mailLinkKopiér'''
