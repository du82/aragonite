title = "Europas største økonomi har været til valg - TV 2"
description = "Hvad skete der? Europas største økonomi, Tyskland, har søndag fået ny chef efter at kristendemokraterne CDU/CSU har fået flertal. Det har betydning for både ak..."
full_description = 'Kl. 13.00Grønne aktier til tops i DanmarkDe grønne virksomheder Ørsted og Vestas klarer sig lige nu bedst af de danske C25-aktier. Ørsted er således næsten 5 procent oppe sammenlignet med i sidste uge, mens Vestas er steget med mere end 3,5 procent.På forhånd havde Dansk Industri (DI) udpeget den grønne dagsorden som ét af de steder, hvor det tyske valg kunne få størst betydning for Danmarks økonomi.- Det tyske valg kan få afgørende betydning for udviklingen af grøn energi og det dansk-tyske samarbejde på området. Valgets udfald vil definere, om Tyskland intensiverer sine grønne investeringer, lyder det i analysen fra DI.Også Sydbank har i en analyse peget på Vestas som ét af de danske selskaber, der har mest på spil.Del opslagDelFacebookXE-mailLinkKopiér Kl. 12.46- Mange danske virksomheder mærker den her træghed i Tyskland Selvom Tyskland er Europas største og vigtigste økonomi, har landet gennem de seneste årtier haltet efter inden for blandt andet infrastruktur og digitalisering. Det har forstørret mange af de problemer, der også plager andre europæiske økonomier, og været skyld i, at Tysklands økonomi har stået stille de seneste to år. Det forklarer Danske Banks cheføkonom, Las Olsen, til TV 2:- Der har været en marginal tilbagegang i både 2023 og 2024, og billedet er nogenlunde det samme her i starten af 2025. Tysk økonomi er desværre gået rigtig meget i stå, og det er et problem for Tyskland, resten af Europa og for Danmark.Las Olsen peger dels på bilbranchen, der har haft det svært, og høje energipriser som nogle af de ting, der har udfordret Tysklands økonomi. Derfor er det nødvendigt med store investeringer i de "strukturelle" problemer, mener cheføkonomer, der mener, at situationen også er et problem for dansk økonomi:- Der er dele af dansk økonomi, der har det rigtig godt og som trækker det hele med op, men når vi ser på eksporten af varer, der er lavet i Danmark, er Tyskland langt det vigtigste marked. Der er mange danske virksomheder, der mærker den her træghed i Tyskland, siger Las Olsen.Del opslagDelFacebookXE-mailLinkKopiér'
