["https://nyheder.tv2.dk/business/2025-02-10-wegovy-kan-aendre-varerne-i-dit-supermarked-industrien-holder-oeje"]
title = "Wegovy kan ændre varerne i dit supermarked – industrien holder øje - TV 2"
description = "Flere producenter er klar til at omstille sig, hvis antallet af patienter på fedmemedicin fortsat stiger. Eksperter kalder det nødvendigt."
full_description = 'BusinessWegovy kan ændre varerne i dit supermarked – industrien holder øjeFlere producenter er klar til at omstille sig, hvis antallet af patienter på fedmemedicin fortsat stiger. Eksperter kalder det nødvendigt.Det er blandt andet helt almindelige dagligvarer, der sniger sig ned i danskernes lommer. Arkivfoto. Foto: Liselotte Sabroe / Ritzau Scanpix 18. feb kl. 11.37Kristian Skovby Ørbæk & Jonathan KorsagerFremover kan supermarkedernes hylder med søde sager og sukkerholdige produkter blive erstattet af sundere alternativer.I to år har danskerne haft adgang til Novo Nordisks nyeste præparat mod svær overvægt, Wegovy. Siden har vægttabsmedicinen indtaget det danske marked på en facon, der aldrig er set tidligere.Det har fået flere eksperter på detailområdet til at advare supermarkeder og producenter mod den nye tendens.TV 2 har talt med flere af de danskere, der har valgt vægttabsmedicinen til. De fortæller, at Wegovy har nedsat deres appetit betydeligt.Se også48-årig kvinde er bare ikke sulten – en kæmpe "gamechanger", siger ekspertOg med næsten 150.000 danskere, der ugentlig stikker sig selv med medicin mod overvægt, skal branchen forberede sig på en ny gruppe af kunder, der har fået fjernet sulten.- Det er i den grad noget, vi kigger på. Jeg synes allerede, at 150.000 på vægttabsmedicin er en relativ stor gruppe mennesker, siger Kim Ege Møller, der er kommunikationschef i Orkla Danmark.Kan ændre måden, der bliver købt indOrkla står blandt andet bag chipsene fra Kims, marmeladen fra Den Gamle Fabrik, Beauvais og Bähnke.Her er man meget opmærksom på, at slankemedicinen kan ændre måden, der bliver købt ind på, fortæller Kim Ege Møller.- Lige nu producerer vi en række forskellige fødevarer med både højere og lavere indhold af fedt, sukker og salt. Men det kan sagtens ændre sig som følge af den her udvikling, siger han.Opmærksomheden deler man hos Arla, der er blandt verdens største mejerier. Her er de første forbrugerundersøgelser af kunder på Wegovy allerede foretaget.Arla forventer en stigende efterspørgsel på proteinholdige måltidserstatninger. Foto: Niels Ahlmann Olesen / Ritzau ScanpixUndersøgelserne viser, at patienter på vægttabsmedicin bevæger sig væk fra sukkerholdige varer. I stedet efterspørger de produkter, der sikrer de rigtige næringsstoffer og er lave på kalorier.Det fortæller innovationsdirektør, Sandra Jørgensen, der påpeger, at Wegovys indtog har sat fart i en udvikling. - Vi har set en trend mod sunde og nærende fødevarer, og vi tror på, at den trend nu vil blive forstærket med fremkomsten af vægttabspræparater, siger hun.Koncernen forventer derfor at se en endnu større efterspørgsel på dets proteinholdige varer i fremtiden. Samtidig ser virksomheden et øget potentiale for produkter, der kan hjælpe på fordøjelsen, da studier har vist, at det kan være en bivirkning af vægttabsmedicinen, forklarer Sandra Jørgensen.- Vi har en super portefølje med vores Cultura-serie, og vi vil også i fremtiden lancerer flere produkter med fokus på fordøjelsen.Hvordan ændres forbruget?Amerikanere på vægttabsmedicin reducerer deres udgifter til dagligvarer med gennemsnitligt 416 dollars svarende til knap 3000 kroner inden for de første seks måneder. Blandt husholdninger med højere indkomst reduceres udgifterne endnu mere. Særligt i kategorien af ultraforarbejdede fødevarer som chips, bagværk og småkager ser man, at brugerne reducerer deres udgifter med op til 11 procent. Mindst påvirket er produkter som yoghurt og friske råvarer. Det viser et nyt studie, der er offentliggjort af Cornell University og forbrugerindsigtsgruppen Numerator, hvor man har undersøgt, hvordan slankemedicin ændrer forbruget hos de amerikanske brugere. Målrettede produkterI den danske afdeling af fødevaregiganten Nestlé har man også et øje på fedmemedicinens indtog.- Vi ser udviklingen som en mulighed for at bringe vores ekspertise for ernæring i spil, så vi kan imødekomme specifikke behov hos mennesker, der ønsker at tabe sig, skriver Nestlé Danmark i en mail.På koncernplan har man for nylig lanceret en række nye produkter specifikt målrettet brugere på slankemedicin. - Når du spiser mindre, har du brug for bestemte vitaminer, mineraler og tilskud, sagde daværende administrerende direktør Ulf Mark Schneider til Bloomberg News om den nye varekategori, der skal dække et forventet fald i efterspørgslen på søde sager og frysepizzaer.Nestlés nye produktserie rettet mod amerikanere på vægttabsmedicin. Foto: NestléIndtil videre er produkterne kun udrullet på det amerikanske marked.Nestlé Danmark ønsker ikke at kommentere på, om der i Danmark kommer lignende produkter på hylderne, eller om virksomheden ser ændringer i kundernes forbrug herhjemme.Nestlé har også lanceret en proteindrik i USA, der markedsføres på at undertrykke sult som vægttabsmedicin. Foto: NestléBliver foregangsfigurMed Nestlés amerikanske satsning forventer lektor Mogens Bjerre på Copenhagen Business School, at Nestlé vil blive foregangsfigur for en række fødevareproducenter – også i Danmark. - Vi kommer til at se flere udviklinger i retning af, at fødevareproducenterne tager højde for forskellige typer forbrugere, der har forskellige typer udfordringer i deres madforbrug, siger Mogens Bjerre, der underviser i detailhandel.Jeg tror ikke, at der findes en enkel, nem løsning til at tackle det her, hvis det vokser yderligereKim Ege Møller, Kommunikationschef OrklaI Danmark lever omkring 900.000 med svær overvægt. Ifølge Mogens Bjerre er der tale om en så stor gruppe af danskere, der potentielt kan benytte sig af vægttabsmedicin, at det vil være naivt at lukke øjnene for.Gruppen er eksempelvis allerede større end glutenallergikere, som fødevarebranchen producerer en lang række produkter til, fremhæver han.Se ogsåFem figurer viser, hvem der har indløst recept på medicin til vægttab - Det er interessant, at dagligvaresektoren pludselig har fået en spiller, der påvirker afsætningen af varer, men intet har med dagligvaresektoren at gøre, siger Mogens Bjerre.Ingen panikI landets supermarkedskæder skaber udbredelsen af fedmemedicin ikke de store panderynker endnu. Det viser en rundringning blandt landets største detailkæder foretaget af TV 2. De fleste supermarkeder følger udviklingen, men har endnu ikke kunnet dokumentere effekten af slankemedicinen, da flere parametre kan have indflydelse på salgstallene, lyder det.Det gør sig gældende i Coop, hvor fedmemedicin ikke er på radaren, fortæller informationsdirektør Jens Juul Nielsen.Hos Salling Group er man klar til hurtigt at kunne omstille produkter og sortiment, hvis der bliver behov for det. - Vi holder øje. Det er klart, hvis der lige pludselig er 800.000, der er på det, så kan vi mærke det på fødevareforbruget, siger kategoridirektør i Salling Group, Jean Ladehoff.Salling Group står bag Netto, Føtex og Bilka. Foto: Ida Guldbæk Arentsen / Ritzau ScanpixHan mener dog, at man skal passe på med ikke at "sygeliggøre" kunder ved at lave produkter henvendt til brugere af fedmemedicin.Hos Lidl og Rema 1000 følger man også udviklingen, men heller ikke her er der data, der entydigt peger på en effekt fra fedmemedicin.Det samme gør sig gældende hos Dagrofa. Her er det tendenserne fra blandt andet USA, som har vakt en interesse, fortæller kategoridirektør, Jesper Bjerring.- Konklusionen for os er, at det stadig kun har en mindre påvirkning på indkøbsmønstrene i befolkningen. Det er en forholdsvis begrænset gruppe, hvor vi ikke detaljeret ved, hvordan det påvirker deres indkøb, siger Jesper Bjerring.Ingen enkel løsningOrkla ser heller ikke et specifikt marked for danskere på vægttabsmedicin endnu. Men man er opmærksom på, at der lige nu er en gruppe danskere, der køber mindre og efterspørger andre varer end tidligere.Fortsætter den gruppe med at vokse, vil der være behov for at sætte ind på flere områder.- Det danske marked er enormt konkurrencebetonet, og jeg tror ikke, at der findes en enkel, nem løsning til at tackle det her, hvis det vokser yderligere, siger kommunikationschef Kim Møller Ege.Orkla producerer blandt andet chipsene fra Kims. Foto: Niels Ahlmann Olesen / Ritzau ScanpixArla har heller ikke Wegovy-produkter på vej. Til gengæld bliver der hele tiden udviklet nye produkter, der også henvender sig til den gruppe af forbrugere, fortæller Sandra Jørgensen.For begge producenter handler det om at skære ned på fedt og sukker.Selvom Arla forventer, at flere af deres produkter vil nyde godt af udviklingen, ser virksomheden ikke ubekymret på vægttabsmedicinens indtog.Arla har investeret mange penge i at udbrede sunde måltider og frygter, at danskerne potentielt ser en anden vej. - Der er en bekymring for, at vægttabsmedicinen kan gå ind og mindske behovet for de sunde måltider, hvis man har mulighed for at tage et præparat, der håndterer ens overforbrug, siger Sandra Jørgensen.Del artikelDelFacebookXE-mailLinkKopiér'
