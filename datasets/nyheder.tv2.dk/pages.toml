["https://nyheder.tv2.dk/klima/2025-02-10-usaedvanlig-situation-har-ramt-klodens-nordligste-egne"]
title = "Usædvanlig situation har ramt klodens nordligste egne - TV 2"
description = "Når havisen forsvinder, opvarmes kloden hurtigere, da is reflekterer solens varme, lyder det fra meteorolog."
full_description = 'KlimaUsædvanlig situation har ramt klodens nordligste egneNår havisen forsvinder, opvarmes kloden hurtigere, da is reflekterer solens varme, lyder det fra meteorolog.Vinterisen slår revner i de arktiske egne. Arkivfoto. Foto: Steffen Graupner 10. feb kl. 17.18Jonas DamsboMeteorolog, TV 2 VejretLangt mod nord, hvor vintermørket stadig hersker, giver en opsigtsvækkende udvikling anledning til bekymring.I de første dage af februar er der således sket en markant afsmeltning af den arktiske havis.Se ogsåVerdens største isbjerg har løsrevet sig og truer vildtreservatUnder normale omstændigheder er der ellers et voksende isdække i Arktis på denne tid af året.Men intet er normalt midt i en klimakrise.Tværtimod er der smeltet så meget af isen, at udbredelsen er på et rekordlavt niveau for årstiden. Det viser satellitdata fra den japanske rumorganisation JAXA.Afsmeltningen tog især fart omkring månedsskiftet og har siden da ligget på et stabilt lavt niveau.Den gule graf viser udbredelsen af den arktiske havis i 2025, som i øjeblikket er på et rekordlavt niveau. Foto: Zack LabeEkstrem varme giver udfordringerneUdfordringerne for den arktiske havis kommer som konsekvens af en ekstrem varm periode i begyndelsen af februar.Her blev klodens nordligste breddegrader ramt af en ekstraordinær varm luftmasse, der blev ført langt mod nord af et kraftigt lavtryk, som gav temperaturer på hele 20 til 25 grader mere end det normale.Det resulterede i temperaturer over frysepunktet, hvilket er helt uhørt på denne tid af året.Sådan så situationen ud onsdag 5. februar. Temperaturen på Nordpolen var 20 grader over det normale for årstiden. Foto: TV 2 VejretEksempelvis blev der søndag 2. februar registreret hele 1,3 plusgrader ved Kap Morris Jesup, der med sin placering på den allernordligste spids af Grønland er verdens nordligste vejrstation på land.Se ogsåKlimaforskningen opnår historisk milepæl – dansk forsker kalder det for "fantastisk"De 1,3 grader lyder måske køligt, men i forhold til at vejrstationens middeltemperatur for hele februar er minus 26,4 grader, så er det altså meget varmt.Ifølge klimatolog ved DMI, Thomas Gravgaard Askjær, er der blevet målt temperaturer ved Kap Morris Jesup i 44 år, og kun fem gange har den vist over frysepunktet i februar. Det fortæller han til Dagbladet Information.LynanalyseAndreas NyholmMeteorolog, TV 2At havisen i Arktis forsvinder, er ret usædvanligt midt om vinteren, da den burde vokse. Selvom det kan være et tilfældigt udsving, følger det en tydelig tendens: mindre og mindre havis hen over årene. Hvis et tykt isdække ikke når at dannes før sommeren, kan afsmeltningen accelerere og potentielt føre til et nyt minimum i september. Så det, vi ser nu, er absolut bekymrende. Det er næsten sikkert, at Arktis bliver isfrit om sommeren – spørgsmålet er kun hvornår. Sandsynligvis vil det ske inden 2050. Selvom den værste varme er overstået, er det stadig meget varmere end normalt på Nordpolen. Særligt i den arktiske del af Rusland ligger temperaturerne fortsat ekstremt højt for årstiden.Med de høje temperaturer får havisen svært ved at etablere sig yderligere frem mod smeltesæsonen, der begynder i slutningen af marts.Temperaturafvigelsen fra det normale lørdag 8. februar 2025. Foto: CopernicusKlimaforandringerne accelereresUdgangspunktet for havisens udbredelse var i forvejen lav, men med den seneste varmebølge stadfæstes den rekordlave udbredelse for årstiden yderligere med en negativ udbredelse.Samtidig viser data ved Polar Portal, der er en dansk is- og klimaovervågningstjeneste i Arktis, at også havisens tykkelse og volumen er på et rekordlavt niveau.Se ogsåDen arktiske havis kan potentielt smelte inden 2030I sidste ende giver det meget dårlige betingelser for sommerhavisens overlevelse, der allerede kan være smeltet bort inden 2030, hvilket vil sætte skub på klimaforandringerne.- Når havisen forsvinder, opvarmes kloden hurtigere, da is reflekterer solens varme, lyder analysen fra TV 2 Vejrets meteorolog Andreas Nyholm.Havisens udbredelse 8. februar 2025. Data: Ocean and Sea Ice, Satellite Application Facility-projektet (OSISAF). Foto: Polar PortalIfølge den europæiske klimatjeneste Copernicus er den globale middeltemperatur steget med 1,3 grader siden industrialiseringen.I Arktis går temperaturstigningen imidlertid endnu stærkere. Her er temperaturen steget med hele 3,3 grader.Del artikelDelFacebookXE-mailLinkKopiérSe ogsåDen danske vinter forsvinderNy data giver bekymrende nyt om klodens tilstandMysteriet om rekordvarmt år kan være løst'
