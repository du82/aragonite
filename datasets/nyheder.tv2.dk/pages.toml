full_description = '40 min sidenMette Frederiksen på vej til LondonDanmarks statsminister, Mette Frederiksen (S), rejser søndag til London for at deltage i et uformelt topmøde om situationen i Ukraine foranlediget af den britiske premierminister Keir Starmer. Det genbekræfter statsministeren i en pressemeddelelse tidligt søndag morgen. - Ukraines kamp for frihed er vores kamp. Det er afgørende et sikre et stærkt Ukraine her og nu, så vi kan nå frem til det, vi alle sammen ønsker: En langsigtet og bæredygtig fred. Europa skal stå sammen og levere mere militær støtte. Hellere i dag end i morgen. Og vi skal sikre de nødvendige sikkerhedsgarantier, så krigen ikke bare vender tilbage til Ukraine eller et andet land, siger Mette Frederiksen i meddelelsen. Europæiske ledere deltager ved mødet senere i dag. Del opslagDelFacebookXE-mailLinkKopiér Kl. 22.53Det er sket i dagReaktionerne efter fredagens kuldsejlede møde mellem Ukraines præsident, Volodymyr Zelenskyj, og USA’s præsident, Donald Trump, er lørdag væltet ind.Bliv klogere på dagens begivenheder herunder:Zelenskyj fik opbakning fra Storbritanniens premierminister, Keir Starmer, efter et møde i London, der blev rykket frem fra søndag.NATO’s generalsekretær, Mark Rutte, opfordrer Zelenskyj til at reparere forholdet til Trump.Udenrigsminister Lars Løkke Rasmussen (M) sagde, at han var chokeret efter fredagens diplomatiske optrin i Det Hvide Hus.Nedsmeltningen i Det Hvide Hus er blevet modtaget positivt af Rusland, der siger, at Zelenskyj afviser fred, da han er besat af at fortsætte krigen i Ukraine.Zelenskyj siger fortsat, at han er klar til at underskrive mineralaftalen med USA.Europæiske ledere, heriblandt statsminister Mette Frederiksen (S), holder søndag et uformelt topmøde i London.Del opslagDelFacebookXE-mailLinkKopiér Kl. 22.48Tidligere FN-ambassadør afviser konspirationsteoriDen tidligere amerikanske FN-ambassadør Susan Rice afviser den ubekræftede konspirationsteori om, at hun var en af flere demokratiske politikere, der skulle have talt med Ukraines præsident, Volodymyr Zelenskyj, forud for hans møde med USA’s præsident, Donald Trump, fredag.- For god ordens skyld, så har jeg aldrig mødt Zelenskyj og aldrig talt med ham. Nogensinde. Eller rådgivet ham eller nogen omkring ham, skriver Susan Rice i et opslag på det sociale medie X.Konspirationsteorien går ud på, at Rice sammen med flere andre såsom tidligere udenrigsminister Antony Blinken havde rådgivet Zelenskyj til at være "stærk" og "hård" over for Trump.Del opslagDelFacebookXE-mailLinkKopiér'
