title = "Hun var for nøgen og tjente for meget – nu er hun tilbage som Oscar-favorit - TV 2"
description = "Hun var 16 år, da hun vendte ryggen til omsorgssvigt og overgreb og søgte mod Hollywood. I dag ser hendes mission om anerkendelse ud til at lykkes."
full_description = '''OscarHun var for nøgen og tjente for meget – nu er hun tilbage som Oscar-favoritHun var 16 år, da hun vendte ryggen til omsorgssvigt og overgreb og søgte mod Hollywood. I dag ser hendes mission om anerkendelse ud til at lykkes. 46 min sidenSimone Kirstine HansenHun har været en verdensstjerne gennem mere end tre årtier.Alligevel har hun aldrig fået andet end priser for sit dårlige skuespil.Måske netop derfor ser vi i øjeblikket 62-årige Demi Moore gå måbende og smågrædende op på det ene podie efter det andet.Her modtager hun nogle af verdens fineste filmpriser for sin rolle i ’The Substance’ – noget, hun aldrig havde troet, var muligt.Demi Moore modtager den såkaldte SAG-Award for bedste kvindelige skuespiller i en hovedrolle i 'The Substance'. Foto: Chris Pizzello / Chris Pizzello/Invision/APFor bare få år siden havde hun nemlig dømt sig selv helt ude som skuespiller.Hendes alder og tvivl på eget talent havde fået hende til at opgive modet, har hun fortalt.Men nu er hun altså favorit til den største filmpris af dem alle – en Oscar.Hendes comeback har fået tilnavnet ”The Demisanse”.For historien om Demi Moore er ikke historien om en kvinde, der er kommet let til tingene.Jeg var pigen, hvis mor konstant prøvede at slå sig selv ihjel, og pigen hvis to fædre havde forladt hendeDemi MooreDet er derimod historien om en pige, der var så omsorgssvigtet, at hun var villig til at satse absolut alt på en karriere i mediebranchen – et sted, der modtog hende med konstant kritik af hendes krop og tidligt satte hende i bås som den ”kønne pige” uden meget andet at byde på.Følg Oscar 2025 på TV 2 og tv2.dkDu kan se hele Oscar-showet, der begynder søndag aften 2. marts, på TV 2 og TV 2 PLAY. Klokken 22.00 varmer Michèle Bellaiche og Adam Duvå Hall op til Oscar-showet, hvor de har en række gæster i studiet. Klokken 00.30 kan du se stjernerne ankomme på den røde løber. Klokken 01.00 begynder selve showet, hvor de 23 filmpriser bliver uddelt. Det hele slutter klokken 4. På tv2.dk kan du også følge med i, hvad der sker i showet på vores livebloggen. Misbrug, selvmordsforsøg og hustler-farFor at forstå Demi Moores vej ind i skuespilverdenen er man nødt til at kende til hendes barndom.For det var den, der fik hende til at vende ryggen til sin familie og gå efter skuespillerdrømmen, da hun var bare 16 år gammel.Demi Moore blev født i 1962 i byen Roswell i Mexico af fattige og alkoholiserede forældre.Hendes mor var bipolar og narcissistisk. Hendes far havde gjort det til en levevej at forsøge at snyde og gamble sig til penge.Demi Moores barndom bestod i høj grad af at flytte hjem, by og skole, nogle gange helt op til syv gange på et år. Flytninger skete som oftest, fordi faren var utro, eller mafiaen var efter ham.Hun var 12 år, da hendes mor første gang forsøgte at begå selvmord. Det lykkedes Demi at redde hende, da hun fik fisket pillerne op af halsen på moren, der lå badeværelsesgulvet med Demis skrigende far ved hendes side. - Noget dybt inde i mig skiftede der. Det kom aldrig tilbage. Min barndom var ovre, har hun senere fortalt i sin selvbiografi ’Inside Out’.Demi Moore var 13 år gammel, da hendes 31-årige mor begyndte at slæbe hende med på barer. Den unge datter var et godt blikfang og tiltrak mændenes opmærksomhed, har Demi Moore senere forklaret. Foto: ScanpixSom 13-årig fandt Demi Moore ud af, at manden hun kaldte far, slet ikke var hendes far. Den biologiske far skred allerede inden, Demi Moore blev født.Den ikke-biologiske far forlod hende også, da han samme år blev skilt fra moren. - Jeg var pigen, hvis mor konstant prøvede at slå sig selv ihjel, og pigen hvis to fædre havde forladt hende, fortæller hun om det manglende selvværd, der efterhånden plantede sig i hende.Et selvværd, der krakelerede helt, da hun som 15-årig kom hjem i sin og morens lejlighed og fandt en 49-årig ven af familien siddende i sofaen. Solgt af sin egen morDen 49-årige mand voldtog Demi Moore den dag. Han lod hende efterfølgende forstå, at han havde givet moren penge for at få lov til at komme ind i lejligheden og vente på Demi. ”Hvordan føles det at blive gjort til luder af sin egen mor for 500 dollars?” sagde han ifølge Demi Moore.- Det føles som at være forældreløs, har hun senere sagt.Det var med den følelse, at Demi Moore flygtede væk fra hjemmet som bare 16-årig.I 1981 giftede hun sig med sin første mand, rockmusikeren Freddy Moore.Et turmulatarisk ægteskab, der gik i opløsning fire år senere.Demi Moore og den 12 år ældre Freddy Moore. Demi Moore har i sin bog 'Inside Out' fortalt, hvordan hun sneg sig væk fra sin polterabend dagen før brylluppet og havde sex med en af sine venner. Ægteskabet var altså på mange måder dømt til at mislykkedes. Foto: ScanpixEfternavnet beholdt hun som bekendt.Måske fordi hun netop havde fået sit første gennembrud i filmen ’Kliken fra st. Elmo’, hvor hun spillede rollen som den smukke og glamourøse kvinde Jules van Patten, der under overfladen kæmpede med et stof- og alkoholmisbrug.Demi Moore (i midten) sammen med resten af holdet, der blandt andet talte Emilio Estevez, Rob Lowe og Andrew McCarthy, i ungdomsfilmen 'Kliken fra St. Elmo'. Demi Moore blev senere kæreste med Emilio Estevez. Foto: Columbia/TristarEn historie, som Demi Moore delvist kunne relatere til.Hun måtte nemlig selv på afvænning under optagelserne, da hun allerede i sine start 20’ere havde udviklet et massivt alkoholmisbrug.’Kliken fra St. Elmo’ gav Demi Moore det første skub mod stjernerne.Hun blev en del af en gruppe upcoming-skuespillere som blandt andet talte Emilio Estevez og Rob Lowe. Gruppen fik tilnavnet ’Brat Pack’ i pressen.Mens Demi Moores første mand gav hende det verdensberømte efternavn, katapulterede ægteskabet med hendes anden mand hende til absolut stjernestatus i Hollywood.StjerneparretDemi Moore og Bruce Willis. Foto: Fred Prouser / Scanpix DanmarkDemi Moore og Bruce Willis. Foto: Fred Prouser / Scanpix DanmarkFor i 1987 mødte Demi Moore en anden skuespiller, der, ligesom hende, stod på tærsklen til stor berømmelse. Den 32-årige Bruce Willis.Det slog hurtigt gnister imellem de to, og allerede senere samme år blev de gift.Bruce Willis var på det tidspunkt ikke helt lige så kendt som Demi Moore, men det blev han, da han året efter havde hovedrollen i en film ved navn ’Die Hard’.Demi Moore har aldrig taget en skuespilleruddannelse. Men de utallige skoleskift i barndommen gjorde hende, ifølge eget udsagn, i stand til at tilpasse sig en hvilken som helst rolle og situation med lynets hast. Foto: Fred Prouser / Scanpix DanmarkDemi Moore selv stod, uden at ane det, over for et manuskript, der også skulle vise sig at gøre hende verdensberømt. Men hun var noget tvivlende.Genren var af en sjældent set karakter: ”Overnaturlig, romantisk komedie".Det kunne enten blive fantastisk eller "en fucking katastrofe", har hun senere fortalt.GhostDemi Moore endte dog med at sige ja til rollen som Molly Jensen i filmen ’Ghost’, hvor hun spillede sammen med Patrick Swayze og Whoopi Goldberg.Filmen fik blandede anmeldelser.Men publikum elskede den.Scenen, hvor Demi Moore drejede en lerskål med Patrick Swayze, blev senere ikonisk. Den romantiske scene, hvor Demis Moores karakter, keramikeren Molly Jensen, drejer en skål med sin kæreste, gik over i filmhistorien. Den er også blevet genindspillet flittigt i en lang række sketchshows. Foto: Af Archive / Mary Evans/AF Archive/Paramount'Ghost' blev den bedst indtjenende film i 1990 (på andenpladsen lå gemalens film ’Hard 2’), og gjorde Demi Moore verdensberømt.- Der blev hun en kæmpestjerne, forklarer filmanmelder hos Politiken Nanna Frank Rasmussen.Filmen blev et gigantisk hit både på grund af Demi Moore, men også fordi Patrick Swayze landede balancen mellem at være "macholækker og følelsesmæssig tilgængelig", forklarer Nanna Frank Rasmussen:- Hvis publikum ikke drømte om at være ham, og dermed by proxy at være sammen med Demi Moore, så drømte de om at være den unge, korthårede Demi Moore, der fik lerdrejning til at være den mest erotiske selvpleje, en kvinde kunne finde på, siger hun.Ghost blev startskuddet på Demi Moores gyldne æra med en række kendte film.I 1993 medvirkede Demi Moore i filmen 'Indesent Proposal', hvor hun spillede overfor Woody Harrelson og Robert Redford. Foto: ParamountMen start 90’erne blev også årene, hvor hun udviklede en alvorlig spiseforstyrrelse.For kravene til kvinder i Hollywood var brutale.Kroppen skulle være perfekt.I en film vejede hun således for meget og måtte tabe sig. I en anden mente instruktøren, at hun var blevet for tynd og nu lignede ”en fucking mand”.Hun måtte derfor tage på, så hendes bryster og former kunne blive tydeligere.Derfor var hun især glad for sin rolle i ’A Few Good Men’ (1992), hvor hun for én gangs skyld ikke skulle være letpåklædt og spille den mandlige hovedrolles kærlighedsinteresse, men slet og ret en dygtig officer, der tilfældigvis var kvinde.I retsalsdramaet 'A Few Good Men' spiller Tom Cruise en advokat, der skal frikende mordanklagede soldater, mens Demi Moore er hans mere uerfarne, men retfærdighedssøgende medhjælper. Foto: Columbia/TristarDet holdt hårdt, fandt hun senere ud af.Instruktøren havde været under massivt pres fra en rasende producent, der ikke kunne forstå, hvorfor Demi Moore og Tom Cruise ikke skulle have sex, har hun fortalt i bogen "Inside Out'.- Hvis Tom Cruise og Demi Moore ikke skal have sex sammen, hvorfor er Demi (Moores karakter) så overhovedet en kvinde?I 1996 havde Demi Moore opnået så stor stjernestatus, at hun kunne hæve en løncheck, der skrev hende ind i historiebøgerne.StripteaseDemi Moore i filmen 'Striptease' fra 1996. Foto: ScanpixDemi Moore i filmen 'Striptease' fra 1996. Foto: ScanpixDet var rollen som singlemoren Angela i filmen ’Striptease’, der udløste en løn på 90 millioner kroner til Demi Moore.Det beløb gjorde hende til årets bedst betalte skuespiller.Og for første gang i filmhistorien gik den titel til en kvinde.Selv følte Demi Moore, at hun slog et slag for ligestilling og ligeløn.Men blandt feminister og filmfolk fik filmen voldsom kritik.- Det skyldtes både, at filmen måske ikke var så god. Men Demi Moore blev også beskyldt for at benytte sig af sin krop til at sælge filmen. Man kan jo indvende, at det var de fleste kvindelige skuespilleres lod dengang, men det var åbenbart særligt slemt, når Demi Moore bekendte så tydeligt kulør. Hun blev kritiseret for at være kvindeforræder og bruge billige tricks som at strippe for at få folk i biografen, forklarer Nanna Frank Rasmussen.Ifølge Filmmagasnet Ekkos Oscar-ekspert Casper Hindse havde Demi Moore allerede fra starten et åbenlyst skuespiltalent. Det var bare sjældent, hun fik lov at vise det, da hun ofte blev castet som "den kønne pige". Foto: Ukendt / Scanpix DanmarkI pressen fik hun hurtigt diva-tilnavnet ”Gimme Moore” (”Giv mig mere”, red.).Og samme år vandt hun den lidet flatterende pris, en ’Golden Raspberry Award’, for årets værste skuespilpræstation.Året efter var det mændenes tur til at kritisere Demi Moore og hendes brug af sin krop.Det skete, da hun gav den som første kvindelige Navy SEAL-soldat i filmen G.I. Jane. Denne gang tonede hun frem på biograflærredet i en helt ny kropsform som hårdtpumpet soldat med skaldet isse."Ikke særlig tiltrækkende"Demi Moore i G.I. Jane Foto: Ritzau ScanpixDemi Moore i G.I. Jane Foto: Ritzau ScanpixHvor hun før blev kritiseret for at spille på de kvindelige former, mødte hun nu kritik for det modsatte.Det fortæller Casper Hindse, der er Filmmagasinet Ekkos Oscar-ekspert og filmanmelder for Ritzau Fokus.- Jeg har læst gamle anmeldelser, hvor hun bliver kritiseret enormt meget, blandt andet for ikke at være særlig tiltrækkende, når hun er skaldet, siger han.Ifølge Nanna Frank Rasmussen var Demi Moores krop – som mange andre kvindelige skuespilleres kroppe i den tid – en politisk kampplads:- I ’Striptease' blev hun kritiseret for at forråde kvinder. I G.I. Jane for at forråde mænd. Hun kunne næsten ikke gøre noget, uden at folk forholdt sig voldsomt til hendes kropslige præstationer, siger hun.Demi Moore var i intensiv træning for at blive klar til rollen som Jordan O'Neill, der som den første kvinde skal gennemføre uddannelsen til Navy Seal. I samme ombæring blev hun kronraget til rollen. Foto: Af Archive / Mary Evans/AF Archive/Hollywood Igen vandt Demi Moore en såkaldt Razzie som årets værste skuespillerinde.I slut 90’erne befandt hun sig således i en paradoksal situation. Hun var var en af Hollywoods største stjerner og bedst betalte skuespillere.Men hendes film, skuespil, person og krop var udsat for hård kritik. Det var også nogenlunde heromkring, at en producent lod hende forstå, at hun var en såkaldt ”popcornskuespiller”.Sådan en, der kan trække masserne i biografen til film, som de kan sidde og ganske popcorn til, forklarer Casper Hindse. - Men altså ikke en skuespiller med noget videre kunstnerisk talent. Man mente, at Moore kunne sælge billetter, men onde tunger sagde, at det nok mest var fordi, hun havde været med i 'Striptease', siger han.Prædikatet som popcornskuespiller fik hende til at opgive drømmen om store filmpriser og anerkendte roller, har hun senere fortalt.En mand, der kunne ødelægge karrierenI 1998 valgte Demi Moore at trække sig helt fra skærmen. Ægteskabet med Bruce Willis gik i stykker.Men parret bosatte sig i hver deres hus i samme kvarter i Idaho og havde noget så sjældent som en fredelig Hollywoodskilsmisse.Demi Moore brugte de næste cirka tre år på at være fuldtidsmor for parrets tre døtre,Demi Moore og Bruce Willis med døtrene Rumer, Scout og Tallulah. Moore og Bruce har bevaret en tæt relation. I dag ses de ofte sammen med deres døtre på deres sociale medier, især efter at Bruce Willis fik diagnosen FTD (frontotemporal demens). Foto: ScanpixI 2003 tonede hun kort frem på lærredet igen som skurk og afhoppet agent i ’Charlie’s Angels – Uden hæmninger’.Det var samme år, hun mødte en ny mand.En mand, som hendes agent på det kraftigste anbefalede hende at holde sig fra.For det ville blive enden på hendes karriere.Cougaren og hendes ToyboyDemi Moore og Ashton Kutcher. Foto: ScanpixDemi Moore og Ashton Kutcher. Foto: ScanpixMen 41-årige Demi Moore var blevet forelsket til op over begge ører i den fremadstormende skuespiller og komiker Ashton Kutcher.Han var 25 år.Og det var lige præcis aldersforskellen på 16 år, der, der, ifølge agenten, ville ødelægge Demi Moores chancer for at blive taget seriøst i branchen, har Moore senere forklaret i sin biografi ’Inside Out’. Agenten havde da heller ikke helt uret.Det nye stjernepar, der to år senere giftede sig, blev jaget vildt af paparazzierne.Demi Moore blev udråbt til cougar og Ashton Kutcher til hendes toyboy.Samme opmærksomhed faldt ikke på eksmanden Bruce Willis, da han kort tid efter giftede sig med sin 23-årige yngre hustru Emma, har Demi Moore senere bemærket. I årevis blev der skrevet om Demi Moore og Ashton Kutchers fremmøde på de røde løbere i de glitrerede magasiner. Hendes roller i film som ’Bobby’, ’Mr. Brooks’ og ’Flawless’, hørte '''
