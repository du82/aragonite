["https://nyheder.tv2.dk/business/2025-02-21-milliardaer-vil-have-fat-i-mindst-1000-hektar-landbrugsjord"]
title = "Milliardær vil have fat i mindst 1000 hektar landbrugsjord  - TV 2"
description = "Da Jacob Jelsing så indholdet af den grønne trepart, gik han på jagt efter landbrugsjord. Det vil han nu omlægge til skov og natur."
full_description = "BusinessMilliardær vil have fat i mindst 1000 hektar landbrugsjord Da Jacob Jelsing så indholdet af den grønne trepart, gik han på jagt efter landbrugsjord. Det vil han nu omlægge til skov og natur. Det seneste halve år har biotek-milliardær Jacob Jelsing købt jord for næsten 70 millioner. Foto: Janne Bekker / TV 2 Grafik 25. feb kl. 11.58Signe Mai Vilsbøll & Charlotte Rudiengaard RasmussenEgentlig havde Jacob Jelsing ikke sat tal på sine opkøbsplaner, men han kom på et tidspunkt i processen til at sige, at han ville købe 1000 hektar landbrugsjord, så det har han tænkt sig at holde. Forhåbentlig bliver det meste erhvervet hurtigt, og måske får han også mulighed for at købe endnu flere hektar. - Hvis der ikke er kommet fart i den arealomlægning, man har sat gang i med den grønne trepartsaftale, så fortsætter jeg, påpeger Jacob Jelsing, da TV 2 går tur med ham på hans marker i Kornerup nær den midtsjællandske by Roskilde. Den grønne trepartDen grønne trepart er en aftale mellem regeringen, Landbrug & Fødevarer, Danmarks Naturfredningsforening, Fødevareforbundet NNF, Dansk Metal, Dansk Industri og KL. Aftalen blev indgået i juni 2024 og vedtaget i Folketinget i november samme år. Målet med aftalen er at få genoprettet livet i danske fjorde, søer og vandløb, skabe mere natur og biodiversitet og nå klimamål. Derudover skal CO₂-udledningen i landbruget nedbringes. Frem mod 2030 skal 400.000 hektar landbrugsjord omlægges til naturområder, svarende til Fyn og Lollands samlede areal. Desuden indfører Danmark som del af aftalen en CO₂​-afgift på landbrugsproduktion. Det er ikke meget mere end et halvt år siden, biotek-milliardæren brugte de første millioner af sin private formue på jord.Først nu rører man ved landbruget rolle i klima- og biodiversitetskrisen, og så venter man på, at landmændene gør noget frivilligt. Der burde politikerne altså være blevet klogere. Jacob Jelsing, biotek-milliardær og jordejerI dag har han lagt næsten 70 millioner kroner i landbrugsejendomme med 240 hektar jord på Sjælland, men han er på jagt efter mere, så han kan afvikle flere konventionelle landbrug og omdanne dem til natur og skov i klimaet og biodiversitetens navn. Mere skov og naturJacob Jelsing er en af mange private investorer i markedet for landbrugsjord, hvor efterspørgslen ifølge ejendomsmæglere i øjeblikket så stor, at man kunne fristes til at kalde jord for det nye guld. Han er blandt de private investorer, der har brugt flest penge på jord i 2024, viser data fra handelsplatformen Resights.Millionerne til investeringerne i landbrugsjord, kommer fra en vellykket børsnotering af forskningsvirksomheden Gubra, der i 2023 ottedoblede Jacob Jelsings formue og gjorde ham god for 3 milliarder kroner. Jacob Jelsing er stadig bestyrelsesformand i Gubra, som han også var medstifter af, og fra Gubra havde han erfaring med at opkøbe og omlægge landbrugsjord til skov og natur. Jacob Jelsing ejer cirka 240 hektar landbrugsjord fordelt på fem marker i henholdsvis Rågeleje nord for Hillerød og Kornerup vest for Roskilde. Foto: Janne Bekker / TV 2 GrafikDette fortsætter han med i sit eget investeringsselskab Earthbreak. I første omgang på det tidligere landbrug i Kornerup vest for Roskilde, der ligger op ad en drikkevandsboring og har Kornerup Å løbende langs matrikelgrænsen. - Der er ikke nogen fast skabelon, men jeg forestiller mig traditionel skov med lysåbne områder, forhåbentlig med kreaturer, der kan gå og græsse, og så synes jeg også, det kunne være fedt med stier, frokostborde og måske lidt regenerativ grøntsagsproduktion (skånsom dyrkningsmetode, red.), fortæller milliardæren, der også har drømme om et kollektiv i det store hovedhus, der hører til landbruget i Kornerup. Det konventionelt drevne landbrug, markerne før rummede, er så småt afviklet. - Indtil videre er vi stoppet med at sprøjte, og der er taget en beslutning om, at jorden ikke skal gødes mere, siger Jacob Jelsing, der er blevet kompenseret økonomisk gennem støtteordninger for at lægge brugen af pesticider på hylden. Et kompromis med store manglerSom havbiolog af uddannelse og investor i grønne start-ups er natur, miljø og klima ikke nye interesseområder for milliardæren, der blev skuffet ved præsentationen af den grønne trepartsaftale. - Jeg har i mange år undret mig over den negative rolle, landbruget har haft. At man har sprøjtet med pesticider her så tæt på vandløb, sø og drikkevandsboring er mig en gåde, siger Jacob Jelsing og peger i retningen af det smalle område midt på markerne, der er ejet af forsyningsselskabet Hofor. Aftalen, som Regeringen og aftaleparterne kalder “historisk”, opfatter Jacob Jelsing som et kompromis med meget store mangler. Nok er der en ambition om at reducere landbrugets udledning af drivhusgasser og sikre bedre vilkår for natur, biodiversitet, vandmiljø og drikkevand, men det hele er baseret på frivillighed, påpeger han: - Det bliver forhåbentlig godt, hvis det lykkedes. Det er bare gået for langsomt. Først nu rører man ved landbruget rolle i klima- og biodiversitetskrisen, og så venter man på, at landmændene gør noget frivilligt. Der burde politikerne altså være blevet klogere. Det var da Jacob Jelsing så indholdet af treparten, at han begyndte at købe op.Her stod det klart for ham, at han var “nødt til at gøre noget selv”. Ikke “superlet” at finde jordEn ting kan spænde ben for hans planer: tøven i markedet.Der skal gerne være tale om jord fra konventionelle landbrug, men lige nu er de rigtige projekter svære at finde, og det er ikke helt let at få landmænd til at sælge, fortæller Jacob Jelsing.Måske venter de på mere afklaring fra Regeringen om krav og afgifter. Måske venter de på, at priserne på jord stiger. Det ved han ikke. - Men det er ikke superlet. Det er begrænset, hvad der er til salg, og jeg går med en fornemmelse af, at folk sidder og lurepasser, siger Jacob Jelsing. Han er ikke vild med at betale mere end højst nødvendigt, for han er jo også forretningsmand, lader han os forstå. - Folk kommer med ublu høje priser, helt op mod 500.000 pr. hektar (gennemsnittet er lige nu 201.000 kr. per hektar, red.). Så vender jeg mig om og går. Jeg synes ikke, vi skal have en fuldstændig accelererende jordpris, og jeg vil heller ikke forgylde det danske landbrug, siger Jacob Jelsing. Hvis landmænd og andre jordejere “bare sidder og venter på at prisen på jorden stiger”, vil det ifølge milliardæren blive en udfordring for de politisk vedtagne mål om at omlægge 15 procent af den danske landbrugsjord til skov og natur. Af den politiske aftale fremgår det, at arealomlægningen skal ske med “ro om jordpriserne”. Analytikere og ejendomsmæglere mener dog, at stor efterspørgsel og lavt udbud af landbrugsjord kan påvirke priserne i opadgående retning. Stod det til milliardæren, skulle Regeringen “lægge ekstra pres på”, for eksempel ved at fastsætte et loft over priserne på landbrugsjord, mens den omfattende arealomlægning er i gang. - Arealomlægningen er i alles interesse. Det er for vores klima, vores natur, økosystemerne i vores fjorde, vores drikkevand og vores sundhed. Det håber jeg, alle i Danmark kan se. Vi bliver nødt til at få det til at ske nu, mener Jacob Jelsing, der er bekymret for, at priserne stiger yderligere.- Så trækker nogle af dem, der vil det samme som mig, sig måske, fordi det bliver for dyrt. Villig til at tabe pengeDen relativt nyslåede jordbesidder vil de kommende måneder forsøge at samle flere kræfter. Han mener nemlig, de rige har en moralsk pligt. - Jeg er i den heldige situation, at jeg har nogle økonomiske midler. I stedet for at købe en ny bil, vil jeg gerne bruge dem på noget, der forhåbentlig kan være med til at forsinke klimaforandringer og tab af biodiversitet. I løbet af den kommende tid har han planer om at oprette en fond henvendt til investorer med kapital og grønne visioner, der kan foretage flere og måske også større opkøb uden at drive priserne op til landmændenes fordel. Med aftalen lægger staten op til samarbejde med lodsejere. Er du klar til at indgå i samarbejde med aftaleparter og kommuner?- Jeg vil utrolig gerne samarbejde. Jeg har ikke ambitioner om at sidde på min jord og tjene på den. Jeg vil fremme den her fælles agenda, og det hører jeg, andre også gerne vil, siger Jacob Jelsing. Det er ikke, fordi det skal være ren velgørenhed. Faktisk må det meget gerne være en forretning, der kører rundt og giver et par procents afkast, men det er ikke afgørende, understreger Jacob Jelsing. Er du villig til at tage et tab?-Ja. Jeg synes, man i Danmark har glemt at værdisætte naturen. For mig har en genskabt natur mere værdi end økonomisk kapital. Hvor meget er du klar til at tabe på dine investeringer?-Det har jeg vitterligt ikke gjort mig nogle tanker om. Som sådan tror jeg ikke, at jeg kommer til at tabe penge på det. Men hvis der ryger 10-25 procent, fordi jeg laver noget vildt fantastisk, så er det helt ok.Del artikelDelFacebookXE-mailLinkKopiér"
