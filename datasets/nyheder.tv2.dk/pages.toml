title = "Regeringen vil investere i våben – skal du også det? - TV 2"
description = "Selvom flere våbenproducenter de seneste år har oplevet voldsomme stigninger i deres aktiekurs, kan der måske stadig være penge at hente."
full_description = "BusinessRegeringen vil investere i våben – skal du også det?Selvom flere våbenproducenter de seneste år har oplevet voldsomme stigninger i deres aktiekurs, kan der måske stadig være penge at hente.Regeringen præsenterede i går en fond på samlet 50 milliarder kroner, som skal finansiere en oprustning af forsvaret i 2025 og 2026. Foto: Mads Claus Rasmussen / Ritzau Scanpix 20. feb kl. 20.36Andreas Pinstrup- Køb, køb, køb. Der er kun én ting, der tæller nu, og det er hastighed, for virkeligheden er, at vi er bagud.Budskabet var klart fra statsminister Mette Frederiksen (S), da hun onsdag præsenterede planen om, at det danske forsvar får yderligere 50 milliarder kroner til oprustning i 2025 og 2026.Se også- Køb, køb, køb, siger statsministeren – her er manden, der skal bruge 50 milliarder50 milliarder, der blandt andet skal bruges på at fylde indkøbskurven hos verdens våbenforhandlere, så det danske forsvar står rustet til den ''farligste situation i mange år''.- Man træder ikke ind på bundenFlere våbenproducenter har siden Ruslands invasion af Ukraine haft kronede dage. Det samme har deres investorer.Tyske Rheinmetall lever blandt andet af at producere og sælge ammunition til kampvogne og artilleri, og det har de seneste år været en god forretning.Aktiekursen er siden Ruslands fuldskala invasion i februar 2022 steget med 850 procent.Det betyder, at havde du investeret 10.000 kroner i den tyske våbenleverandør, ville de aktier i dag have haft en værdi på 95.000 kroner.I samme periode har svenske Saab, der producerer avancerede forsvarssystemer, oplevet en stigning i deres aktiekurs på 432 procent.Se ogsåEt punkt adskiller yngre mænd og kvinder økonomisk – ekspert peger på mulig årsagMen er det stadig muligt at nå med på 'toget' og tjene penge på at investere i våbenindustrien? Ja, mener Lars Hytting, der er aktiechef i Arthascope – men ikke uden risiko.- Det er aldrig for sent at komme med på toget, men man skal være klar over, at man ikke træder ind på bunden af bakken. Der vil være en vis risiko forbundet med det på nuværende tidspunkt, forklarer han.Aktiechefen uddyber, at der på nuværende tidspunkt er en hype omkring Rheinmetall og Saab, da de to selskabers aktiekurs er steget markant mere end resten af branchen.- For tre år siden var der ingen, der kendte til Rheinmetall, og nu gør alle. Under coronapandemien var det den grønne omstilling, der fløj afsted, og i dag er det decimeret til ingenting. Jeg siger ikke, at det samme sker for våbenindustrien, men som investor skal man være klar over den hype, siger han.Oprustning kan gavne andre producenterDer er usikkerhed i sigte, uanset om du kigger mod nord, syd, øst eller vest for tiden.En verdenssituation, der er med til at holde hånden over de investorer, der skulle vælge at investere i våbenindustrien.Se ogsåDanmark opruster som et land i krig, siger TV 2 korrespondent- Min forventning er, at de her store oprustninger alt andet lige bør fungere som en bund i våbenaktierne. Hele verden investerer i forsvaret, og det er et faktum, siger Lars Hytting.En verdenssituation som især Rheinmetall og Saab har nydt godt af, da de har kunnet levere det landbaserede materiel, der har været efterspurgt under krigen i Ukraine.Men snart kan investeringerne komme til at falde andre steder, lyder det fra investeringsstrateg i Saxo Bank Oskar Bernhardtsen.- En europæisk efterkrigstidsoprustning kan tænkes at indeholde investeringer, der relativt set kan komme til at gavne andre europæiske forsvarsvirksomheder som Leonardo, Thales, Safran eller måske de amerikanske forsvarsgiganter Lockheed Martin, RTX og Northrop Grumman, siger han.Fra våben til forsvarsaktierDet har før været ilde set at handle med aktier, der relaterer sig til våbenindustrien, men den tendens er nu ved at vende især blandt én gruppe investorer.Mere end hver anden mandlige investor mener, at det er etisk forsvarligt at investere i selskaber, der producerer våben.Til sammenligning er det kun knap hver fjerde kvinde, der synes det samme.Se ogsåDet tager flere år før vi kan forsvare os selv, siger tidligere forsvarschefDet viser en opinionsundersøgelse foretaget af Epinion fra Finans Danmark.Ifølge Lars Hytting er der helt generelt sket en ændring i, hvordan vi omtaler investeringer i våbenselskaber.- Man køber ikke længere våbenaktier. Man køber ind i forsvarsindustrien. På den måde er det ligesom blevet alment accepteret, at det er okay at købe våbenaktier. Det er ikke forbudt på samme måde som for fem år siden at eje våbenaktier, siger han.Han uddyber, at våbenaktier længe blev sammenlignet med investeringer i olie og tobak, der også var ''fy-fy'' gennem en længere årrække, men nu er den tendens vendt.De danske privatinvestorer har på bare tre år tidoblet deres beholdning af forsvarsaktier i landets seks største bankerI december 2024 havde investorerne forsvarsaktier for samlet set 2,1 milliarder kroner.I 2021 lød værdien på 200 millioner kroner, viser tal lavet for Finans Danmark.Del artikelDelFacebookXE-mailLinkKopiér"
year_published = 2025
