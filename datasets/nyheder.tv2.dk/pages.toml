full_description = "Samfund150 stod klar til at ribbe badehotel for inventarCirka 40 minutter tog det, før stort set alt var væk. Udarbejdet af TV Midtvest150 stod klar til at ribbe badehotel for inventar150 stod klar til at ribbe badehotel for inventarI går kl. 13.22Her har de for meget varme - det kan 'gaskommunen' måske drage nytte afHer har de for meget varme - det kan 'gaskommunen' måske drage nytte afI går kl. 19.47En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.I går kl. 19.18Salling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.Salling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.I går kl. 19.17Tre grise stjålet fra kontroversiel udstilling i KøbenhavnTre grise stjålet fra kontroversiel udstilling i KøbenhavnI går kl. 17.35Politiet afspærrer yderligerePolitiet afspærrer yderligereI går kl. 14.14Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.I går kl. 13.42Politi er ikke længere massivt til stedePoliti er ikke længere massivt til stedeI går kl. 06.57Orange varevogn fjernes fra gerningsstedOrange varevogn fjernes fra gerningsstedI går kl. 06.46Fabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske statFabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske stat28. feb kl. 14.56Kendt frisør blev afvist som barnKendt frisør blev afvist som barn28. feb kl. 13.34Kig mod Europa, siger lektorKig mod Europa, siger lektor28. feb kl. 12.49 I går kl. 13.36 Alexandra Lund Lysgaard TV MidtvestSom forventet blev muligheden for gratis guld fra Agger Badehotel noget af et tilløbsstykke.Allerede inden dørene blev åbnet klokken 10, var køen lang uden for det gule badehotel.- Jeg er vildt overrasket. Der stod nok 150 mennesker ude foran. Jeg troede bare, at folk kom dryssende op ad dagen, fortæller arkitekt Søren Sarup, som er medejer af hotellet.Han fortæller, at der ikke har været særlig rift om bestemte ting, men jævn rift om både borde, stole, glas, kopper og så videre.Cirka 40 minutter efter åbning var det hele stort set væk.- Det er meget overvældende, og det viser bare, at stedet her er værdsat af rigtig mange. Der har også været tidligere medarbejdere forbi, som lige skulle have et gensyn med den tidslomme, som det er her, siger Søren Sarup.Ifølge Søren Sarup har der været folk forbi fra hele Thy, Mors og Skive.Alt inventar var gratis og skulle væk, fordi badehotellet står over for en totalrenovering, hvor kun murene vil være de samme – alt andet bliver fornyet. Målet er, at det nye badehotel står klar i 2026.Der blev hurtigt samlet til bunke foran Agger Badehotel, hvor det var først til mølle. Foto: Søren SarupAlt var gratis. Til gengæld opfordrede de nye ejere af hotellet til at donere et beløb til Agger Fælledpark. Foto: Søren SarupDet tog kun de fremmødte cirka 40 minutter at tømme hele badehotellet for inventar. Foto: Søren SarupDel artikelDelFacebookXE-mailLinkKopiérUdarbejdet af TV MidtvestSe ogsåSlagter til kamp mod kæmpebøde: - Det er noget hysteri33-årig kørt på skadestuen efter uheldTivoli-legende har fået særlig hyldest"
