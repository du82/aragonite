["https://nyheder.tv2.dk/samfund/2025-03-01-her-har-de-for-meget-varme-det-kan-gaskommunen-maaske-drage-nytte-af"]
title = "Her har de for meget varme – det kan 'gaskommunen' måske drage nytte af - TV 2"
description = "I Kalundborg Kommune har de så meget overskudsvarme, at de gerne vil sælge ud af den - og dét er de interesserede i i Holbæk."
full_description = "SamfundHer har de for meget varme – det kan 'gaskommunen' måske drage nytte afI Kalundborg Kommune har de så meget overskudsvarme, at de gerne vil sælge ud af den - og dét er de interesserede i i Holbæk.Udarbejdet af TV2 ØSTKaren Thestrup Clausen ser gerne overskudsvarmen komme til Holbæk. Foto: Jacob Bagge - TV2 ØST I går kl. 19.52 Kasper Marquardtsen, Kristoffer Koch TV2 ØSTUdover Novo Nordisk producerer medicin i hobetal, så leverer det kæmpe industriområde også tonsvis af varme i forbindelse med deres produktioner, som normalt går til spilde.Varme som i princippet kan opvarme 50.000 husstande.Mit indtryk er, at det vil blive billigere for forbrugerne, men selvfølgelig skal vi sikre, at alle de aftaler vi indgår... Vi skal sørge for, at vi ikke risikerer at hænge på en kæmperegning.Karen Thestrup Clausen, formand i udvalget Klima, Miljø og Natur, Holbæk Kommune.Og lige præcis den varme kunne de godt bruge i Holbæk.- Helt sikkert. Det håber jeg rigtig meget, vi kan få glæde af, fortæller formand Karen Thestrup Clausen (EL) i udvalget Klima, Miljø og Natur i Holbæk Kommune.Mandag den 3. marts er der møde i udvalget, hvor de enten skal vende tomlen nedad eller opad til et samarbejde med flere virksomheder i Kalundborg (Kalundborg Symbiose), der gerne vil levere overskudsvarme til blandt andet Holbæk.Kræver opbakningFor at de i Holbæk kunne få glæde af varmen, ville det også kræve et større og omfattende arbejde med rørlægning.Det hele forudsætter dog, at der kommer en stor fjernvarmeudbygning i Holbæk, fastslår Anders Dyrelund, som er ekspert i energiplanlægning i byer.Eksperten er i tvivl om, det er den bedste løsning for Holbæk - men priser initiativet velkommen. Foto: Tina Mortensen - TV2 ØST- Holbæk er jo lige den største by i Danmark, som stadigvæk har 100 procent naturgas, derfor er der også fokus på, hvordan de (Holbæk, red.) kan komme af med gassen. Og her er den første barriere for, at Holbæk kan få glæde af overskudsvarmen fra Kalundborg, at der bliver lagt et fjernvarmeanlæg i Holbæk, fortæller han og fortsætter:- For at det kan lade sig gøre, kræver det, at der er opbakning til sådan et projekt fra kunderne. Og især de store. Og lige nu, set i lyset af alle mulige andre aktører, kan der godt være en stor usikkerhed på det, siger han med henvisning til fjernvarmeskandalen i Odsherred Kommune.Formanden for Kalundborg Symbiose ønsker at sælge ud af overskudsvarmen, som lige nu bliver spildt, til flere kommuner. Foto: Tina Mortensen - TV2 ØSTI 2022 talte man også om projektet, men den gang blev det vurderet at de økonomiske konsekvenser i forbindelse med transporten af overskudsvarmen, ville være for store.- Den helt store ændring fra dengang til nu er, at vi opfører en hel masse fabrikker. Derfor er der endnu mere varme i Kalundborg, og mængden er vokset så meget, at der faktisk er en business case, der rent faktisk kan hænge sammen, fortæller Michael Hallgren, der er formand for Kalundborg Symbiose og produktionsdirektør hos Novo Nordisk. Video: TV Øst- Billigere for kunderNogle af de folk, TV2 ØST mødte på gaden i Holbæk, fremhævede også fjernvarmesituationen i Odsherred Kommune, som en årsag til ikke at skulle have opført et fjernvarmeanlæg i Holbæk.- Når vi har hørt, hvordan priserne er steget der. Det, tror jeg, bliver rentabelt, siger Henrik Petersen.Henrik Petersen. Foto: Kristoffer Koch - TV2 ØST- Det bliver man lidt bange for med fjernvarme, så det tror jeg ikke, vi er helt hooked på, fortæller Lone Bergqvist.Lone Bergqvist. Foto: Kristoffer Koch - TV2 ØSTDet bliver dog politikernes fornemmeste opgave at sørge for, at omkostningerne for forbrugerne ikke stiger, hvis aftalen skulle træde i kraft.- Mit indtryk er, at det vil blive billigere for forbrugerne, men selvfølgelig skal vi sikre, at alle de aftaler vi indgår. Vi skal sørge for, at vi ikke risikerer at hænge på en kæmperegning. Men det er vi også meget opmærksomme på, fortæller Karen Thestrup Clausen (EL), som er formand i udvalget Klima, Miljø og Natur i Holbæk Kommune.Del artikelDelFacebookXE-mailLinkKopiérUdarbejdet af TV2 ØSTSe ogsåVanvittige tilbud fik folk til at ligge i kø i fire dageTo personer fængsles for vold med døden til følgeSjællandsk firma sagsøger minister efter at have spredt 'falske' og 'belastende' rygter"
