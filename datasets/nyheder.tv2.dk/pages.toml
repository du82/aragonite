["https://nyheder.tv2.dk/samfund/2025-03-01-vanvittige-tilbud-fik-folk-til-at-ligge-i-koe-i-fire-dage"]
title = "Vanvittige tilbud fik folk til at ligge i kø i fire dage - TV 2"
description = "Jongshøj Maskiner fejrer 20 års jubilæum – og det fejrer de med absurde køtilbud, som folk lå i telt for at få glæde af."
full_description = "SamfundVanvittige tilbud fik folk til at ligge i kø i fire dageJongshøj Maskiner fejrer 20 års jubilæum – og det fejrer de med absurde køtilbud, som folk lå i telt for at få glæde af. Udarbejdet af TV2 ØSTFolk var meget ivrige efter de gode procenter, så folk havde sat telte op, så de kunne ligge i kø. Foto: Jungshøj Maskiner I går kl. 20.35 Kasper Marquardtsen, Jesper Truelsen TV2 ØSTJongshøj Maskiner fyldte lørdag 20 år.Og det skulle fejres på fornem vis, hvorfor virksomheden havde lavet nogle ret så specielle køtilbud, som folk kom valfartende til for at udnytte.- Jeg har ligget i kø siden tirsdag. Jeg ville gerne have en havetraktor, fortæller Emil Valaker fra Slagelse.Det var da også mange procenter, den unge mand kunne få på havetraktoren.Emil Valaker glæder sig til sommer, hvor han skal bruge sin nye havetraktor til at slå græs og tjene penge på den måde. Foto: Jesper Truelsen - TV2 ØST- Jeg har jo ikke givet mere end 20 kroner for havetraktoren, og lå man først, kunne man få den største, siger Emil Valaker.Det er virkelig noget, vi har moret os over her på kontoret, fordi vi har set, hvor meget interesse, der har været.Henrik Jongshøj, indehaver af Jongshøj MaskinerNormalprisen for Emil Valakers nye havetraktor var 33.000 kroner.- Jeg synes, det er det hele værd. Det var dog lidt tungt i tirsdags, da jeg lagde mig i telt, siger hanFlere personer har ventet i flere dage. Foto: Jungshøj Maskiner'vi har moret os'Foruden de ret så vilde havetraktor-tilbud kunne kø-kunderne også glæde sig over gode rabatter på græsklipper-robotter til 20 kroner, der ellers normalt koster 13.000 kroner.- Det har været megasjovt med denne her kø-gimmick. Og at folk rent faktisk har ligget i kø siden i tirsdags, det bliver jeg glad for, fortæller Henrik Jongshøj, som er indehaver af Jongshøj Maskiner.Der var proppet med mennesker i butikken. Foto: Jesper Truelsen - TV2 ØSTNogle af varerne var da også sat ned med 99,94 procent.- Vi har jo valgt fem større produkter, som vi har sat gevaldigt ned. Det er jo en form for markedsføring, men det er virkelig også bare noget, vi har moret os over her på kontoret, fordi vi har set, hvor meget interesse der har været. Vi har rigtig kunne følge med i, hvem der har ligget i kø, forklarer indehaveren videre.Del artikelDelFacebookXE-mailLinkKopiérUdarbejdet af TV2 ØSTSe ogsåSjællandsk firma sagsøger minister efter at have spredt 'falske' og 'belastende' rygterDF-politiker risikerer fængselsstraf: - Jeg har bare gjort min pligtParti i kaos kort før kommunalvalget - spidskandidat trækker sig"
