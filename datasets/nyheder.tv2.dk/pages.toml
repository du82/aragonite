title = 'Opløftende resultater "giver os tid til at handle" - TV 2'
description = "Dansk forsker kalder resultaterne for endnu et potentielt stort søm i kisten for de dramatiske studier."
full_description = '''KlimaOpløftende resultater "giver os tid til at handle"Dansk forsker kalder resultaterne for endnu et potentielt stort søm i kisten for de dramatiske studier.Den vigtige havstrøm AMOC, der strækker sig hele vejen op til de arktiske egne, ser ud til at være mere stabil end først antaget. Foto: Lisi Niesner / Ritzau Scanpix 1. feb kl. 12.03Jonas DamsboMeteorolog, TV 2 VejretDet vakte både bekymring og stor debat, da to danske professorer for halvandet år siden fandt frem til, at den vigtige atlantiske havstrøm AMOC risikerer at kollapse allerede i dette århundrede.Et kollaps af denne havstrøm vil nemlig få alvorlige konsekvenser for klimaet i blandt andet Nordeuropa.Men et nyt studie fra Woods Hole Oceanographic Institution i Massachusetts kommer nu med opløftende resultater, der dæmper frygten for det absolutte skrækscenarie.Men jeg håber da, at det er deres studie, der viser sig at have ret i modsætning til voresPeter Ditlevsen, klimaforsker ved Københavns UniversitetIfølge studiet har der ikke været nogen svækkelse af AMOC gennem de seneste seks årtier. Tværtimod er der tegn på, at havstrømmen har været ganske stabil.- Hvis AMOC er mere stabil end tidligere antaget, er det gode nyheder, fordi det giver os tid til at handle, siger Nicholas Foukal, klimaforsker og medforfatter af studiet, til The Washington Post.Dermed aflyser forskerne bag studiet – i hvert fald i denne omgang – det frygtede kollaps.Fatale konsekvenserAMOC står for 'Atlantic Meridional Overturning Circulation', og er kort fortalt et slags transportbånd af varme og kolde havstrømme i det nordlige Atlanterhav.Hele systemet spiller en central rolle i forhold til at regulere klimaet. Eksempelvis sørger cirkulationen for at give Nordeuropa milde vintre.Forstå AMOC – og hvorfor den kan kollapseAMOC står for 'Atlantic Meridional Overturning Circulation', der er en del af ’den termohaline cirkulation’, som fragter køligt vand til varmere himmelstrøg i dybhavet og varmt vand nordpå i overfladen, drevet af forskelle i temperatur og saltholdighed. Nedsynkning af afkølet saltholdigt vand i områder af Nordatlanten er en af de drivende processer. AMOC’en er central for den globale klimaregulering. Men i takt med at den globale temperatur stiger, vil isen på Grønland smelte mere og mere, og nedbørsmængderne over de kolde have vil stige. Derved blandes der mere og mere ferskvand i det nordlige Atlanterhav. Ved forhøjede mængder af ferskvand i havet i det nordlige Atlanterhav mindskes massefylden af vandet. Hvis det ferske vand ikke bliver tungt nok til at synke ned, kan det svække eller stoppe cirkulationen. FNs klimapanel (IPCC) har længe arbejdet med en opfattelse af, at AMOC kunne blive svækket som følge af klimaforandringerne, men at et egentligt sammenbrud i dette århundrede er usandsynligt.Se ogsåDystert dansk klimastudie går verden rundt: Tættere på kollapsI den seneste hovedrapport fra IPCC stod risikoen for kollaps af AMOC anført som "lav", men med stor konsekvens.Den store, direkte konsekvens af et kollaps ville være, at temperaturerne ændrer sig over havet, men også i Nordeuropa, hvor især vintrene vil blive meget koldere.Hvis AMOC kollapser, vil det nordatlantiske område bliver meget koldt. Foto: Wei Liu med flere / Science AdvancesHelt så galt kommer det imidlertid ikke til at gå i forhold til resultaterne fra det nye studie. Dog er forskergruppen stadig enig med IPCC om, at AMOC vil blive svækket i et varmere klima.- Vi forventer stadig fuldt ud, at AMOC vil svækkes i fremtiden, lyder det fra Nicholas Foukal.Journalistiske principperTV 2 publicerer nyheder ud fra journalistiske principper om etik og balance. Det betyder blandt andet, at vi faktatjekker, interviewer kilder og altid forsøger at lade sagens parter komme til orde. Du kan læse vores etiske retningslinjer her. TV 2 er desuden tilmeldt Pressenævnet og følger de presseetiske regler. Sætter spørgsmålstegn ved dystre studierDe seneste par år har der ellers været nogle studier, som har peget i retning af et AMOC-kollaps indenfor nærmere fremtid.Men ifølge Steffen M. Olsen, der er klimaforsker ved Danmarks Meteorologiske Institut, sætter det nye studie spørgsmålstegn ved, om der overhovedet er en reduktion.- Det er et studie, som understreger, at det er en stabil AMOC, og er dermed endnu et potentielt stort søm i kisten for de dramatiske studier, siger Steffen M. Olsen til TV 2.Sådan gjorde forskerneI studiet sammenligner forskerne 24 forskellige klimamodeller og data for varmetransporten mellem oceanet og atmosfæren. Klimamodellerne er derefter brugt til at lave en rekonstruktion af AMOC gennem de seneste 60 år. De modeller, der passer bedst med observationerne af varmetransporten, viser ingen tegn på reduktion af AMOC. Skal AMOC være tæt på et sammenbrud, kræver det, at hele havcirkulationen er under svækkelse, og det er der altså ikke tegn på for nuværende.- Jeg ser en vis konvergens over de sidste år om, at der er enighed om en stabil cirkulation, lyder det fra Steffen M. Olsen, der netop har været afsted på et videnskabeligt møde i Bruxelles om det nye studie.Se ogsåNyt katastrofestudie splitter danske forskereIfølge klimaforskeren er der især ét problem ved de dystre undersøgelser – nemlig at de bruger overfladetemperaturer til at beregne AMOC, hvilket ikke er muligt.Stor usikkerhed præger fortsatSteffen M. Olsen medgiver dog, at der stadig er udfordringer med at beskrive AMOC's stabilitet, da den fremtidige udvikling generelt er behæftet med stor usikkerhed.Usikkerheden er også noget, som Peter Ditlevsen, klimaforsker ved Københavns Universitet, hæfter sig ved.Se også44 klimaforskere advarer nordiske ministre om alvorlig risiko - Det er et udmærket studie og lægger fint oven på det, vi allerede ved. Men det kommer ikke med et endeligt svar på grund af usikkerhederne, siger Peter Ditlevsen til TV 2.Tilbage i sommeren 2023 var Peter Ditlevsen med til at forudsige skrækscenariet over dem alle – et kollaps af AMOC i dette århundrede.Se ogsåSådan kan Danmark se ud, hvis forskeres værste mareridt bliver til virkelighed- Vores studie stemmer meget godt i overensstemmelse med, at vi nærmer os et tipping point, siger Peter Ditlevsen.Hvad er et tipping point?Begrebet tipping point bruges ofte, når der tales om klimaforandringer. Det er et slags vendepunkt i forbindelse med klimaet, hvor en proces eskalerer og passerer en grænse, hvorefter processen ikke kan gå tilbage til udgangspunktet – eller har meget svært ved det. Der er altså typisk tale om en selvforstærkende proces. Et eksempel på et tipping point er sommerudbredelsen af den arktiske havis. På grund af det varmere klima bliver der mindre havis om sommeren, hvilket gør, at havet kan absorbere mere energi fra solen. Dermed varmes havet yderligere op, hvilket kan få endnu mere is til at smelte. Når først et tipping point er passeret, kan de sætte gang i en kædereaktion, hvor nye tipping points nås. Peter Ditlevsen pointerer dog også, at selv deres studie også indeholder stor usikkerhed, hvilket er et faktum, når der arbejdes med forudsigelsen af AMOC.- Det er svært at bevise eller modbevise noget, når usikkerheden er så stor. Men jeg håber da, at det er deres studie, der viser sig at have ret i modsætning til vores, lyder det fra Peter Ditlevsen.Del artikelDelFacebookXE-mailLinkKopiér'''
