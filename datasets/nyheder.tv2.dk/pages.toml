full_description = '''SamfundSkulle sultes ihjel – weekendens mest omtalte grise er blevet stjåletDe tre grise er pludselig forsvundet. Udarbejdet af TV 2 KosmopolTre grise stjålet fra kontroversiel udstilling i KøbenhavnTre grise stjålet fra kontroversiel udstilling i KøbenhavnI går kl. 17.37Her har de for meget varme - det kan 'gaskommunen' måske drage nytte afHer har de for meget varme - det kan 'gaskommunen' måske drage nytte afI går kl. 19.47En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.I går kl. 19.18Salling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.Salling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.I går kl. 19.17Politiet afspærrer yderligerePolitiet afspærrer yderligereI går kl. 14.14Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.I går kl. 13.42Politi er ikke længere massivt til stedePoliti er ikke længere massivt til stedeI går kl. 06.57Orange varevogn fjernes fra gerningsstedOrange varevogn fjernes fra gerningsstedI går kl. 06.46Fabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske statFabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske stat28. feb kl. 14.56Kendt frisør blev afvist som barnKendt frisør blev afvist som barn28. feb kl. 13.34Kig mod Europa, siger lektorKig mod Europa, siger lektor28. feb kl. 12.49- Vi vil vinde nogle år som minimum- Vi vil vinde nogle år som minimum28. feb kl. 12.18 I går kl. 17.41 Morten Engelschmidt TV 2 KosmopolMarco Evaristtis udstilling "And Now You Care", der særligt handler om fremstilling af dyrevelfærd, er lørdag formiddag blevet udsat for tyveri.Det skriver kunstneren selv i en pressemeddelelse lørdag eftermiddag.Fredag startede ud