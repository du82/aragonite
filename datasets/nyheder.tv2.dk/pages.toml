["https://nyheder.tv2.dk/business/2025-02-26-21-topchefer-delte-643-millioner-mellem-sig-se-listen-her"]
title = "21 topchefer delte 643 millioner mellem sig – se listen her - TV 2"
description = "Fem C25-topchefer tjente mere end 50 millioner kroner sidste år."
full_description = 'Business21 topchefer delte 643 millioner mellem sig – se listen herFem C25-topchefer tjente mere end 50 millioner kroner sidste år.Topchefernes i de danske eliteselskaber scorer alle en millionhyre - men særligt tre ting afgør, hvor stor størrelsen af gagen. Foto: Frederik Johan Scheel / TV 2 Grafik 27. feb kl. 13.02Mikkel Walentin MortensenRettelse 28/02: Tidligere var Alexander Laciks løn i 2024 opgjort til 61,4 millioner kroner. Han fik retteligt 50,6 millioner. De 61,4 millioner kroner var derimod den udgift, Pandora regnskabsførte til hans løn, som følge af regler for, hvordan langsigtede aktieincitamenter skal bogføres. I den forbindelse er den samlede lønsum, for de 21 topchefer, ændret fra 654 til 643 millioner kroner.Den lavestlønnede får lidt mere end en million kroner om måneden for at passe sit arbejde. De bedst betalte tjener det samme på syv dage.Over de seneste uger har en lang række af Danmarks største og vigtigste virksomheder fremlagt deres regnskab for 2024, og her kan man ikke kun læse, om selskaberne har tjent penge eller ej – man kan også se, hvad direktørerne er blevet betalt.I alt har 21 af landets C25-selskaber offentliggjort deres regnskab i januar og februar, og her kan man læse, at direktørerne tilsammen er blevet betalt 643 millioner kroner.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Tre afgørende faktorerOverordnet set er der tre faktorer, der spiller ind på, hvor stor en topchefs lønpose er, når man sammenligner med andre sværvægtere fra erhvervslivet. Det fortæller Ken L. Bechmann, der har forsket i topchefernes aflønning og er professor i finansiering ved Copenhagen Business School (CBS).- Virksomhedernes størrelse er generelt det vigtigste. Jo større selskabet er, desto mere får topdirektøren typisk i løn. Den næste faktor er virksomhedens sektor og de forskelle, der er på brancher. Den tredje er specifikke forhold for virksomheden: Klarer den sig ekstraordinært godt? Skal man tiltrække en ny direktør? Den slags kan hive lønnen op, siger Ken L. Bechmann.At størrelse betyder noget, kan man eksempelvis se i aflønningen af Mærsks administrerende direktør, Vincent Clerc. Shippinggiganten havde Danmarks største omsætning i 2024, og Clerc selv kunne sejle hjem med 48,3 millioner kroner i årsløn. Det placerer ham ikke helt på toppen af lønlisten, men han er godt deroppe ad.Pandoras Alexander Lacik er en af C25-indekset bedstbetalte topchef. Som en del af sin løn fik han sidste år 2,2 millioner i blandt andet flyttegodtgørelse. Foto: Emilie Lærke / Ritzau ScanpixSå er der sektorerne. Her fremhæver Ken L. Bechmann medicinalindustrien som et sted, hvor lønposerne typisk er relativt tunge. Det gælder selvfølgelig for Novo Nordisks topchef, Lars Fruergaard, men også cheferne for henholdsvis Genmab og Zealand Pharma ligger højt på listen over de mest velbetalte C25-chefer.Og det endda selvom Zealand Pharmas omsætning var langt fra de andre C25-selskaber, og at virksomheden som den eneste kom ud af 2024 med et underskud.- Der er nogle medicinalselskaber, hvor omsætningen måske ikke er voldsom stor lige nu, men hvor vækstpotentialet er det. Man kæmper på et internationalt marked om de samme kompetencer, og derfor er det også udslagsgivende, hvilken sektor man arbejder inden for, fortæller professoren.Se ogsåSkatterabat skjuler den virkelige værdi af dronningens lønEndeligt er der de selskabsspecifikke ting. Her kan man pege på Pandora, der betalte topchef Alexander Lacik 50,6 millioner kroner sidste år inklusiv 2,2 millioner i flyttegodtgørelse.- Der er en årsag til, at man gerne vil finde eller fastholde den rette direktør. Det er også derfor, nogle er villige til at gå ret langt – i en dansk kontekst – og betale eksempelvis flytteomkostninger for en direktør.Derudover betyder det selvfølgelig også noget, om man sidder på direktørposten i hele året. DSV har eksempelvis givet Jens Bjørn Andersen 2,4 millioner i vederlag, selvom han kun var direktør i januar. I Sydbank nåede Karen Frøsig at få 11,4 millioner kroner for at arbejde frem til et direktørskifte i sommer.Hos Rockwool, hvor der var vagtskifte i september, blev den nu tidligere direktør, Jens Birgersson, betalt 14,9 millioner kroner i løn - samt en fratrædelsesbonus på 20,5 millioner kroner.272 milliarder kronerDe 21 regnskaber afslører, at det ikke kun er topcheferne, der har haft et godt år – det samme har selskaberne. I alt har de 21 virksomheder haft et overskud på 272 milliarder kroner, viser en gennemgang af regnskaberne, som TV 2 har foretaget.Dertil kan lægges 1,6 milliarder kroner fra Bavarian Nordic, der har fremlagt nøgletal, men ikke sit endelige regnskab, og derfor ikke indgår i opgørelsen.- Det har været en rigtig fin regnskabssæson. Selskaberne har leveret nogle gode resultater og kan godt være tilfredse, lyder det opsummerende fra Per Hansen, der er investeringsøkonom ved Nordnet.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Til sammenligning tjente C25-selskaberne, da de offentliggjorde deres årsregnskab for fem år siden, omkring 102 milliarder kroner. Men at bundlinjen er vokset med 170 milliarder kroner på fem år, er ifølge Per Hansen ikke nødvendigvis udtryk for, at det er gyldne tider overalt i den danske børselite.Han fremhæver i stedet at nogle enkelte virksomheder – Novo Nordisk og Mærsk – samt indeksets banker udgør en meget stor del af forskellen på 2019 og 2024.Se ogsåNovo Nordisk tjente over 100 milliarder kroner i 2024Hvor stor en forskel gør milliondirektørerne?Netop rederiet A.P. Møller-Mærsk fremhæver en vigtig pointe om topchefernes løn.I løbet af de seneste fem regnskaber har Mærsk således både leveret underskud, moderate plusser og de to største overskud i dansk erhvervshistorie. Alligevel har topchefens løn hvert år ligget på omkring 40-50 millioner kroner.- Nogle direktører kan sagtens gøre en stor forskel. Men for andre er det måske sværere. Er Vincent Clerc altafgørende i Mærsk? Det tror jeg ikke, for Mærsk tjener gode penge, når fragtraterne er høje – ligesom deres konkurrenter, siger Per Hansen.Se ogsåSe listen: Så meget tjente topcheferne i 2019 og 2020Samme pointe kommer fra Ken L. Bechmann, der nævner coronapandemien som et tidspunkt, hvor alle virksomheder blev påvirket uanset af, hvilken kaptajn, der stod i virksomhedernes styrehus.- Selv de bedste direktører kunne ikke undgå at blive påvirket af Covid-19. Men når man kigger på resultater på tværs af virksomheder inden for samme branche, der bliver ramt af de samme ting, så er der ingen tvivl om, at den rigtige eller forkerte topchef kan gøre en stor forskel, siger professoren og fortsætter:- Når det handler om det lange træk og om hvem, der bliver vindere i en bestemt industri, bliver det ret afgørende at have den rette direktør. Omvendt kan den forkerte direktør ødelægge ret meget.Direktørens aktiekursOgså aktiemarkedet har mere end et halvt øje på, hvem der står i spidsen for de største selskaber, fortæller Per Hansen.Han fremhæver amerikanske Starbucks som et eksempel herpå.Efter nogle turbulente år annoncerede kaffekæden 13. august sidste år, at man ville skifte ud på posten som administrerende direktør. Det fik aktien til at stige.- Da Starbucks fik ny direktør, købte investorerne ind på, at det var en chef, der kunne få vendt biksen rundt, siger han.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Per Hansen, hvis vi nu tager et hypotetisk eksempel og siger, at Novo Nordisks topchef, Lars Fruergaard, i morgen meddeler, at han stopper som direktør. Hvilken effekt vil det så have for Novos aktiekurs?- Der ville komme en reaktion, som ville handle meget lidt om Fruergaard og meget mere om: ”Hvad er det her mon udtryk for?”. Investorerne vil lede børsmeddelelsen igennem med en tættekam efter tegn på, om det er business as usual, eller om der er noget, der har fået ham til at køre træt i opgaven, siger Per Hansen og anslår, at aktiekursen måske ville falde med 2-3 procent, hvis ikke Novo Nordisk fik håndteret chefskiftet korrekt.For et selskab af Novo Nordisks størrelse vil et fald på 2 procent betyde, at selskabets værdi falder med omkring 55 milliarder danske kroner.- Men hvis situationen var som for et år siden, hvor Novo var i god fremgang, ville reaktionen være langt mere afmålt. I hvert fald hvis investorerne fik indtryk af, at der var styr på efterfølgeren, for så ville det skabe noget stabilitet, som aktiemarkedet elsker, siger Per Hansen.Se ogsåPå marker kæmper landets rigeste om at eje Danmarks nye guldDel artikelDelFacebookXE-mailLinkKopiér'
