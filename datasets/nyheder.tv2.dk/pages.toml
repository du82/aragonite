["https://nyheder.tv2.dk/klima/2025-02-17-ekstremt-vejr-risikerer-at-give-prisstigninger-paa-foedevarer-i-2025"]
title = "Ekstremt vejr risikerer at give prisstigninger på fødevarer i 2025 - TV 2"
description = "Afgrøder er sårbare overfor ekstremt vejr, hvilket risikerer at give problemer i landbrugsproduktionen og diverse forsyningskæder."
full_description = "KlimaEkstremt vejr risikerer at give prisstigninger på fødevarer i 2025Afgrøder er sårbare overfor ekstremt vejr, hvilket risikerer at give problemer i landbrugsproduktionen og diverse forsyningskæder.Særligt chokoladepriserne er eksploderet på grund af ekstremt vejr. Foto: TV 2 17. feb kl. 21.21Jonas DamsboMeteorolog, TV 2 VejretKaffe og chokolade er for mange to ting, der hører uløseligt sammen.Men det er også to fødevarer, hvis priser er eksploderet over det seneste års tid.For kakao er priserne steget med hele 163 procent, mens stigningen for kaffe lyder på 103 procent. Alt sammen primært på grund af mere nedbør og højere temperaturer end sædvanligt i de producerende områder.Se ogsåKaffepriser stiger til ekstremt niveauOg meget tyder på, at prisstigningerne vil fortsætte i løbet af 2025 – ikke kun for kaffe og chokolade, men for fødevarer generelt.Det fortæller konsulentvirksomheden Inverto til nyhedsmediet The Guardian.Ifølge Inverto kan vi forvente ustabile fødevarepriser, fordi trenden med mere ekstreme vejrhændelser vil fortsætte i 2025, hvilket vil resultere i manglende udbytte.Rammer bredtDet er altså særligt kaffe og chokolade, hvor priserne er stukket helt af.Så sent som i denne uge satte kaffepriserne rekord, da prisen på arabica-bønnen nåede 4 dollar (28,47 kroner) for ét pund (0,45 kilo) på børsen i New York.De seneste prisstigninger på kaffe skyldes, at Brasilien, der er verdens største kaffeproducent, har haft en dårlig høst efter blandt andet ekstrem tørke i landet. Se ogsåChokolade-chok: Pernille er ramt af ekstreme prisstigningerTilbage i december kunne TV 2 berette om ekstreme prisstigninger på chokolade efter en fejlslagen høst i Ghana og Elfenbenskysten, hvor op mod 80 procent af verdens kakao stammer fra.Men også på solsikkeolie og olivenolie har der været omfattende prisstigninger på op imod 56 procent, hvilket er forårsaget af tørke i producerende lande som Bulgarien, Ukraine og Spanien.Andre fødevarer med kraftige prisstigninger fra år til år omfatter appelsinjuice og smør, der begge er steget med mere end en tredjedel, mens oksekød er steget med lidt mere end en fjerdedel, lyder det i analysen.- Fødevareproducenter og detailhandlen bør ændre deres forsyningskæder og indkøbsstrategier for at reducere overdreven afhængighed af en region, der er ramt af afgrødesvigt, siger Katharina Erfort, rektor ved Inverto, til The Guardian.Risikoen for ekstremt vejr stigerMed en middeltemperatur på 15,09 grader blev 2024 det varmeste år nogensinde registreret.Rekordvarmen er fortsat ind i 2025, idet januar også satte global varmerekord.Den ekstreme varme er en konsekvens af klimaforandringerne, som er med til at gøre risikoen for ekstremt vejr højere.Se ogsåSpanske oversvømmelser truer forsyningskæder til hele Europa- Ekstreme vejrbegivenheder rundt om i verden vil fortsætte med at blive mere ekstreme og mere hyppige i takt med den globale temperaturstigning, lyder det fra Pete Falloon, der er fødevaresikkerhedsekspert ved MetOffice og University of Bristol.Pete Falloon advarer om, at afgrøder er mere sårbare overfor ekstremt vejr.På sigt risikerer vi derfor, at der kan opstå problemer i landbrugsproduktionen og diverse forsyningskæder.Del artikelDelFacebookXE-mailLinkKopiérSe ogsåNy data giver bekymrende nyt om klodens tilstandFødevarepriserne har aldrig været højere – her er de ti varer, der er steget mestEuropa løber tør for olivenolie"
year_published = 2025
