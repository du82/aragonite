["https://nyheder.tv2.dk/udland/2025-03-01-det-skriver-russiske-medier-om-skaenderiet-endefuld-for-aaben-skaerm"]
title = "Det skriver russiske medier om skænderiet: Endefuld for åben skærm - TV 2"
description = "Trump kritiseres over en bred kam i det meste af Europa, men i Rusland er billedet et andet."
full_description = '''UdlandDet skriver russiske medier om skænderiet: Endefuld for åben skærmTrump kritiseres over en bred kam i det meste af Europa, men i Rusland er billedet et andet.Efter mødet udtalte EU's udenrigschef Kaja Kalla, at "verden har brug for en ny leder". Foto: Kevin Lamarque / Ritzau Scanpix I går kl. 15.03Sebastian Juel EblingDen ukrainske præsidents besøg i Det Hvide Hus har mildest talt rystet verden, og er blevet beskrevet som et "totalt sammenbrud".- I dag blev det tydeligt, at den frie verden har brug for en ny leder, lød det blandt andet fra EU's udenrigschef Kaja Kalla efter mødet.Der er meget stor begejstring fra russisk sideFlemming Splidsboel, Seniorforsker, DIISDe fleste europæiske ledere har set mødet mellem de to som en katastrofe for forholdet mellem Europa og USA.Men med russiske øjne, er der noget, der tyder på, at nedsmeltningen ses som en sejr for Vladimir Putins Rusland.TV 2 PlayKampen om USA: Kong Trump kalder Zelenskyj en diktator"Utaknemmelig gris"Læser man i de russiske medier, ser det "totale sammenbrud" nemlig ud til at sprede håb.Den tidligere russiske præsident Dmitrij Medvedev, der nu er næstformand for Ruslands Sikkerhedsråd, roste Donald Trump for at have "sagt sandheden" og kaldte det en "rasende irettesættelse" af en "utaknemmelig gris".Se ogsåDe 120 minutter, der rystede verden – hvad ved vi om Zelenskyjs besøg hos Trump? Den russiske journalist for mediet Komsomolskaya Pravda Alexandr Kotz erklærer også det ophedede møde mellem Trump og Zelenskyj for en "sejr" for Rusland.- Det er nu tydeligt, at Ukraine næppe vil få en plads ved forhandlingsbordet i den nærmeste fremtid, mens Ruslands position er blevet styrket, skriver Kotz på sin Telegram-side, der har over en halv million følgere.Bølgerne gik højt, da de to statsledere mødtes i Det Hvide Hus fredag aften dansk tid. Foto: Saul Loeb / Ritzau ScanpixTV 2s korrespondent Claus Borg Reinholdt, der særligt dækker Rusland, og som tidligere har boet i landet, er da heller ikke i tvivl om, at de russiske reaktioner på mødet står i "stor kontrast" til de europæiske.Det glæder både i mediebilledet og i de officielle udtalelser.- Russerne er tilfredse med udviklingen. Jo mere splid, der er i Vesten, desto bedre er det for Rusland. En russisk kommentator har sågar sagt, at amerikanerne gør russernes arbejde, fortæller han.Pro-ukrainske høgeRundt i det russiske mediebillede er historien langt hen ad vejen den samme.- Trumps team vil helt sikkert fremskynde forhandlingerne med Rusland, hvilket allerede bærer frugt, skriver mediet Regnum.Ifølge det russiske medie er forholdet mellem Kyiv og USA blevet "fuldstændigt ødelagt af Trump-regeringen", hvilket kan føre til en "lempelse af internationale sanktioner mod Rusland", lyder det.AI-genereret billede fra det russiske medie RIA. Foto: RIA / AI-genereret- En offentlig konfrontation med Zelenskyj vil give Trump mulighed for at fremstå som en forkæmper for amerikanske interesser og en leder, der er parat til at sætte de pro-ukrainske høge på plads, fortsætter artiklen, der beskriver mødet som en "afklædning" af den ukrainske præsident, fortsætter artiklen.For statsmediet RIA, skriver den fremtrædende, russiske journalist Vladimir Kornilov, at "verden aldrig har set så spektakulært et show".Se ogsåVild plan om at gøre Trump til diktator har fundet vej til hans inderkredsHans skriv er ledsaget af et AI-genereret billede af en klovn iført gult og blåt tøj, der sandsynligvis repræsentere det ukrainske flag, som flygter fra Det Hvide Hus, mens den jagtes af et sort militærkøretøj.Teksten slutter med et citat fra Ungarns premierminister, Viktor Orbán:- Stærke mænd skaber fred, svage mænd starter krige. I dag stod præsident Donald Trump modigt op for freden, lød ordene fra Orbán, der afslutningsvis binder en knude på Vladimir Kornilovs tekst.Trump beskrives som "erfaren og talentfuld"Det kan da også se ud som om, at mødet, der med europæiske øjne lang hen ad vejen ses som en katastrofe, kan gå hen og blive en direkte fordel for Rusland.Det vurderer Flemming Splidsboel, der er seniorforsker ved Dansk Institut for Internationale Studier (DIIS).USA's præsident, Donald Trump, talte med journalister i Washington DC, efter Zelenskyj blev bedt om at forlade stedet. Foto: Jim Lo Scalzo / Ritzau Scanpix- Der er meget stor begejstring fra russisk side. I mediebilledet i Rusland tegner der sig en historie om, at der nu endelig er en (Trump, red.), der sætter Zelenskyj på plads, og at de "store drenge" nu kan sætte sig ved forhandlingsbordet, fortæller Flemming Splidsboel til TV 2.Se ogsåZelenskyj modtager europæisk støtte efter møde med TrumpOg det er netop fortællingen om Trump og Putin, som de store, vigtige politikere, der går igen i de russiske medier – hvorimod Zelenskyj fremstilles som en hysterisk og useriøst part."Trump gav Zelenskyj en "endefuld" i Washington", lyder en overskrift fra RIA, mens mediet SMN2 beskriver Zelenskyjs ageren under mødet som "hysterisk".Volodymyr Zelenskyj forlod Det Hvide Hus, kort efter forhandlingerne brød sammen. Foto: Shawn Thew / Ritzau ScanpixOmvendt beskriver RIA i den føromtalte artikel af Vladimir Kornilov Donald Trump som en "erfaren og talentfuld showman".Flemming Splidsboel har tidligere udtalt til TV 2, at det i flere russiske medier rygtes, at der snart kan blive sat et møde op mellem Donald Trump og Vladimir Putin, hvor de skal diskutere krigen i Ukraine.- Mit bedste bud er, at Trump og Putin allerede har en grov skitse til en plan, måske endda med nogle ret konkrete elementer i – og det vil Putin gerne have effektueret, siger han.Lige nu holder verden vejret, mens man venter på det næste træk.Del artikelDelFacebookXE-mailLinkKopiér'''
