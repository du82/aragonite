title = "Netcompany henter ny landechef  - TV 2"
description = "Tidligere koncerndirektør i TDC Jens Aaløse bliver ny landechef for Netcompany i Danmark."
full_description = 'BusinessNetcompany henter ny landechef Tidligere koncerndirektør i TDC Jens Aaløse bliver ny landechef for Netcompany i Danmark.Jens Aaløse bliver ny landechef. Foto: Mads Claus Rasmussen / Ritzau Scanpix 24. feb kl. 10.01RitzauNetcompany får ny landechef i Danmark i form af Jens Aaløse, der tidligere blandt andet har været koncerndirektør i TDC.Aaløse skifter fra en stilling som managing partner hos Maj Invest Private Equity.Som landechef for Netcompanys danske forretning får han blandt andet til opgave at skaffe flere opgaver til porteføljen, der allerede omfatter NemKonto og Mit.dk.- Den danske forretning er sund og stærk, og med en dansk erhvervsprofil som Jens kan vi ramme et endnu højere niveau.Se ogsåMystisk hackergruppe lækker filer fra Netcompany og "latterliggør" Danmark- Vi går efter at vinde langsigtede, strategiske aftaler, som er samfundskritiske og af høj kompleksitet. Den mission ved jeg, er med til at motivere en erhvervsleder som Jens, siger André Rogaczewski, der er administrerende direktør for Netcompany.Startede i SAS58-årige Aaløse startede karrieren hos SAS, hvor han i en årrække blandt andet var direktør med ansvar for marketing og salg til privatkunder.Han blev i 2010 administrerende direktør for Danske Spil, inden han i 2013 blev koncerndirektør i TDC.- Med min erfaring fra statslige og private virksomheder kender jeg Netcompany fra kundesiden og tror derfor på, at jeg kan bidrage til at vækste Netcompanys største enkeltstående marked og bygge et endnu stærkere grundlag for europæisk ekspansion, lyder det fra den kommende landechef.Jens Aaløse tiltræder sin nye stilling 1. april.Se ogsåNetcompany falder næsten 17 procent efter regnskabDel artikelDelFacebookXE-mailLinkKopiér'
