full_description = "NyhederTip os på 1234@tv2.dkSend os dit tip om en historie, vi skal kigge nærmere på. 23. maj 2018 kl. 09.49Tip os! Har du oplevet noget spændende netop der, hvor du befinder dig? Eller har du fået fingrene i et billede eller video, vi skal se nærmere på?Vi er altid på mail 1234@tv2.dk, klar til at modtage spændende bidrag fra dig. Det eneste du skal gøre er;Skriv mail til 1234@tv2.dkOplys dine kontaktinformationer (fulde navn, adresse, telefonnummer)Fortæl om din historie og vedhæft billede/video. Vi glæder os til at høre fra dig! Har du et konkret tip, der kræver særlig fortrolighed og eventuelt krypteret kommunikation, til vores undersøgende journalister, så kan det også lade sig gøre. Se hvordan på tv2.dk/secure.Har du vejrbilleder til vores vejrredaktion kan duvia Instagram tagge dit billede med #TV2vejret og få dit eget billede med på vores mediawall herbruge vores TV 2 Vejr App. Hent til iPhone her og til Android hereller uploade billeder herBetingelser for uploadNår du sender video eller billeder til os, forventes det, at du også besidder rettighederne til det sendte. Det er endvidere altid din pligt at sikre, at du er i besiddelse af de fornødne rettigheder til at offentliggøre materialet. Eventuelle erstatningskrav rettet mod TV 2 vil blive videresendt til den enkelte person, der måtte have krænket 3. parts rettigheder. TV 2 har ret til at anvende det tilsendte materiale tidsubegrænset på alle måder og i alle nuværende som kommende medier, herunder også i forbindelse med markedsføringen og demonstrationen af vores produkter. Det er alene TV 2, der afgør, om det tilsendte materiale anvendes eller ej.Del artikelDelFacebookXE-mailLinkKopiér"
