full_description = '''4 min sidenMie HaugaardKrig i MellemøstenUSA sender militær bistand til Israel for fire milliarder dollarUSA's udenrigsminister, Marco Rubio, har underskrevet en bekendtgørelse om at fremskynde leveringen af militær bistand til Israel til en værdi af fire milliarder amerikanske dollar. Det oplyser Rubio natten til søndag dansk tid. Det svarer til knap 29 milliarder kroner.Del opslagDelFacebookXE-mailLinkKopiér Kl. 05.31Mie HaugaardTrump i Det Hvide HusDommer erklærer Trump-fyring af vagthund for ulovligEn føderal dommer har erklæret USA's præsident Donald Trumps fyring af den føderale vagthund Hampton Dellinger for ulovlig. Det skriver nyhedsbureauet Reuters. Hampton Dellinger har det seneste år været øverste chef for det uafhængige agentur, Office of Special Counsel, der skal beskytte offentligt ansatte whistleblowere mod repressalier. Donald Trump valgte efter sin indsættelse 20. januar at fyre Dellinger, der blev ansat under forgængeren, demokraten Joe Biden.Del opslagDelFacebookXE-mailLinkKopiér Kl. 05.25Mie HaugaardKrig i MellemøstenHamas kræver opstart af anden faseHamas kræver, at man påbegynder anden fase af aftalen for våbenhvile i Gaza, skriver AFP. Første fase udløb lørdag. Israel ønsker at forlænge første fase, oplyste Israels regeringskontor lørdag.Del opslagDelFacebookXE-mailLinkKopiér Kl. 05.23Mie HaugaardUdlandTrump indfører engelsk som USA's officielle sprogDen amerikanske præsident, Donald Trump, har lørdag indført engelsk som USA's officielle sprog. Det skriver Det Hvide Hus i en pressemeddelelse. Donald Trump står som afsender af meddelelsen. Dekretet ophæver et dekret fra 1990'erne under den daværende præsident Bill Clinton, som krævede, at føderale myndigheder og myndigheder, der modtager finansiering af staten, skal yde hjælp til ikke-engelsktalende borgere.Del opslagDelFacebookXE-mailLinkKopiér Kl. 05.18Mie HaugaardKendteCharli XCX tager de største priser ved Brit AwardsPå scenen fortalte Charlie XCX ifølge Reuters, at hun føler sig som et levende bevis på, at man ikke skal gå på kompromis med sig selv. Foto: Scott A Garfitt / Scott A Garfitt/Invision/APPopsangeren Charli XCX blev den store vinder ved den britiske musikindustris prisfest, Brit Awards, der foregik lørdag i O2 Arena i London. Det skriver flere britiske medier, herunder Reuters og BBC. Her vandt den 32-årige popartist, der går under det borgerlige navn Charlotte Emma Aitchison, fem priser. Hendes album "Brat", der udkom sidste sommer, blev belønnet med prisen for Årets Album. Desuden vandt hun priserne for Årets Artist, Bedste Danseoptræden og Årets Sang for "Guess".Del opslagDelFacebookXE-mailLinkKopiér'''
