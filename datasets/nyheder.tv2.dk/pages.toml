["https://nyheder.tv2.dk/business/2025-02-20-paa-marker-kaemper-landets-rigeste-om-at-eje-danmarks-nye-guld"]
title = "På marker kæmper landets rigeste om at eje Danmarks nye guld - TV 2"
description = "Voksende interesse og prisstigninger på jord kan udfordre planerne om et ændret danmarkskort, mener økonomer."
full_description = 'BusinessPå marker kæmper landets rigeste om at eje Danmarks nye guldVoksende interesse og prisstigninger på jord kan udfordre planerne om et ændret danmarkskort, mener økonomer.En række landbrugsmæglere, TV 2 har talt med, fortæller, at mange gerne vil have jord - og at mange også gerne vil have rigtig meget jord. Foto: Mads Claus Rasmussen / Ritzau Scanpix 25. feb kl. 07.11Signe Mai Vilsbøll & Charlotte Rudiengaard RasmussenI september lagde han 13 millioner kroner i en landbrugsejendom med jord nær den østjyske by HørningTo måneder senere gav han 80 millioner kroner for et større landbrug ved Hornslet nord for Aarhus.Og selvom 2025 kun lige er begyndt, har Bestseller-milliardær Anders Holch Povlsen, allerede indkøbt landbrug og jord for yderligere 100 millioner kroner. Igen i det østjyske.Markedet for jord er styret af frygt og begær, præcis som på aktiemarkedet. I øjeblikket hersker begæretBent Holm, indehaver af landbrugsmæglervirksomheden Hekto & Co.Købene er bemærkelsesværdige, men Anders Holch Povlsen, der nok er bedst kendt som en af Danmarks rigeste, er bare én blandt flere store, private investorer, der i øjeblikket kæmper om at få fingre i landets nye guld.Den grønne trepartDen grønne trepart er en aftale mellem regeringen, Landbrug & Fødevarer, Danmarks Naturfredningsforening, Fødevareforbundet NNF, Dansk Metal, Dansk Industri og KL. Aftalen blev indgået i juni 2024 og vedtaget i Folketinget i november samme år. Målet med aftalen er at få genoprettet livet i danske fjorde, søer og vandløb, skabe mere natur og biodiversitet og nå klimamål. Derudover skal CO₂-udledningen i landbruget nedbringes. Frem mod 2030 skal 400.000 hektar landbrugsjord omlægges til naturområder, svarende til Fyn og Lollands samlede areal. Desuden indfører Danmark som del af aftalen en CO₂​-afgift på landbrugsproduktion. Landbrugsjorden er ifølge mæglere eftertragtet som aldrig før.- Det går vildt stærkt, og det ser ud til at fortsætte i mindst samme tempo. Jeg har været med i 30 år, og jeg har ikke oplevet lignende. Vi solgte 65 landbrugsejendomme med jord sidste år, og allerede i de to første måneder af i år er vi på godt ti, siger direktør i Landbogruppen Nordjylland, Hans W. Henriksen.Rigmænd, storbønder og andre kapitalstærke kræfter står klar til at smide millioner i landbrugsarealer, efter regeringen og de øvrige parter bag den grønne trepartsaftale i sommeren 2024 første gang præsenterede planerne om at omlægge 15 procent af den danske landbrugsjord til skov og natur.Få jorde til salgIndehaver af den landsdækkende landbrugsmæglervirksomhed Hekto & Co, Bent Holm, har været landbrugsmægler i 15 år. Finanskrisen var hård ved markedet for landbrugsjord, men efter et par gode driftsår for landbruget fra omkring 2021 kom der igen gang i opkøbet af landbrugsjord, fortæller han. Siden er interessen for landbrugsjord vokset. Men det er noget andet, der sker lige nu.- Markedet er meget aktivt. Der er utrolig stor efterspørgsel på jord, siger Bent Holm.Ifølge Bent Holm er der langt mellem landmænd og andre jordejere, som ønsker at sætte deres jord til salg, og det, der bliver sat på markedet, ryger hurtigt. - Udbuddet plejer at være tre gange så højt, nævner Bent Holm. En række landbrugsmæglere, TV 2 har talt med, fortæller, at mange gerne vil have jord, og at mange også gerne vil have rigtig meget jord. Det er også Bent Holms oplevelse.- Jeg tror utvivlsomt, at de politiske planer har betydning. Selvom der ikke ligger en færdig plan for håndteringen, så medfører forventningerne nogle strategiske overvejelser i forhold til at sikre sig bedst muligt og måske også få fat i nogle jordarealer, det kan være svært at komme i nærheden af senere, vurderer Bent Holm og tilføjer:- Markedet for jord er styret af frygt og begær, præcis som på aktiemarkedet. I øjeblikket hersker begæret, tilføjer han. Nye købestærke investorerEnergiudviklere på jagt efter arealer til vindmøller og solceller fyldte tidligere en del i salget af landbrugsjord, men lige nu er etablerede landmænd blandt de mest ivrige opkøbere, fortæller mæglerne. Det skyldes ifølge Bent Holm blandt andet, at der er kommet nye arealkrav for mælkeproducenter, som fremover skal have et større areal per ko, men der er også nogle, der parkerer deres værdier i jord og håber på prisstigninger, siger han.Og så er der investorerne uden for landbruget: for eksempel rigmænd, som har formue fra deres rolle i kendte, danske virksomheder og investerer i jord af diverse årsager. Flere af disse rigmænd og -kvinder optræder på handelsplatformen Resights liste over de største investorer i landbrug med køb for millioner af kroner rundt om i det danske land.Der er Bestseller-milliardæren Anders Holch Povlsen, som ifølge data fra Resights har udvidet sine jordbesiddelser med næsten 1600 hektar siden juni ved at købe op for omkring 280 millioner kroner gennem en række selskaber.Anders Holch Povlsen ejer ifølge handelsplatformen Resights omkring 3600 hektar landbrug. Primært i Østjylland. En stor del af arealerne er købt det seneste halve år. Foto: Janne Bekker / TV 2 GrafikDer er også Danmarks rigeste familie, Lego-familien Kirk Kristiansen.Arvingen Sofie Kirk Kristiansen har i samme periode smidt et trecifret millionbeløb efter mere jord for at udvide sit biodiversitetsprojekt Klelund Dyrehave i Sydjylland, mens familiens investeringsselskab Kirkbi er godt i gang med at opkøbe jord, der skal omdannes til skov og natur.Disse køb er ifølge familien selv en del af Kirkbis klimastrategi, der blev præsenteret i 2022, hvor Kirkbi har sat to milliarder kroner af til at opkøbe 10.000 hektar jord og plante 40 millioner træer. Indtil videre er der købt 2900 hektar, særligt landbrugsjord af ringe kvalitet, som er i gang med at blive omdannet, og investeringerne er ikke uden økonomisk incitament.Træerne er produktionsskov, der i fremtiden kan fældes og omdannes til byggematerialer, så projektet giver afkast.Investor vil omdanne landbrugsjord til skov og naturTV 2 har spurgt ind til baggrunden for både Kirkbis og Anders Holch Povlsens jordopkøb, men ingen af dem ønsker at stille op til interview.Det vil til gengæld Jacob Jelsing, der ligesom de andre har investeret mange millioner kroner i landbrugsjord, siden den grønne trepartsaftale blev præsenteret.Jacob Jelsing er blevet formuende på børsnoteringen af biotek-virksomheden Gubra, han var medstifter af. Med to jordopkøb af samlet 240 hektar har han meldt sig på markedet for at give sit bidrag til den omfattende arealomlægning, og ambitionen er at købe mindst 800 hektar ekstra, fortæller han til TV 2. Måske endda allerede i 2025. Formålet med biotek-milliardærens opkøb er at omdanne konventionelle landbrug til skov, vild natur og regenerativt landbrug (en mere skånsom dyrkningsmetode, red.).Han gik i gang med sine opkøb, netop fordi han var bekymret for, at det ville blive svært for Regeringen og aftaleparterne at nå i mål med arealomlægningen.- Da man kom ud med trepartens store ambitioner og ordet frivillighed, så var min første tanke: Det her kommer aldrig til at ske, siger Jacob Jelsing, der på sin jagt efter landbrugsjord mærker det lave udbud, ejendomsmæglerne beretter om.- Det er begrænset, hvad der er til salg, og jeg går med en fornemmelse af, at folk sidder og lurpasser.Flere gange er Jacob Jelsing stødt på landmænd, der har krævet "ublu høje priser" på helt op mod 500.000 per hektar, og der vender han om og går. Han håber, at andre gør det samme, så jordprisen ikke accelererer og får nogle af de investorer, der vil det samme som ham selv, til at trække sig, fordi det bliver for dyrt.Prisstigninger på 31 procentAf den politiske aftale fremgår det, at implementeringen skal ske “med blik for at holde jordpriserne i ro”.Helt i ro har jordpriserne dog ikke holdt sig, siden aftalen blev præsenteret. Det skyldes ifølge cheføkonom hos fondsmæglerselskabet Agrocura Jens Schjerning blandt andet den store interesse for landbrugsjord.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Det har påvirket priserne, der satte rekord i efteråret 2024.I tredje kvartal sidste år, som er nyeste tilgængelige tal, nåede prisen per hektar landbrugsjord op på 201.000 kroner, hvilket er det højeste niveau siden finanskrisen. På bare tre år er gennemsnitsprisen steget 31 procent med store regionale forskelle i hektarpris. Østjylland, hvor Anders Holch Povlsen køber jord, har ifølge Jens Schjerning oplevet største prishop i perioden.Andre steder i landet – på Fyn, Sjælland og Lolland – er landbrugsjorden af en sådan kvalitet, at priserne per hektar altid ligger noget over gennemsnit. !function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Faldende renter og forbedret indtjening på fødevarer har gjort det attraktivt for mange at investere i landbrugsjord, forklarer Jens Schjerning, der følger prisudviklingen tæt. Det er én af forklaringerne på den voksende interesse. Men derudover mener chefanalytikeren, ligesom ejendomsmæglerne, at den grønne trepart har effekt. Han kalder det et stort indgreb i markedsmekanismerne. - Når staten skal finde små 400.000 hektar til skov og landbrugsprojekter, så betyder det noget i en tid, hvor der i forvejen er mange andre om buddet. Det bliver spændende, hvor stor betydning det får, siger Jens Schjerning, der forventer, at prisen fortsætter op i 2025. Mindre for midlerneHos klimatænketanken Concito er der også en forventning om yderligere prisstigninger på landbrugsjord, og det bekymrer cheføkonom Torsten Hasforth.- Udsigten til yderligere prisstigninger kan få jordejere til at holde på deres jord.Med den grønne trepartsaftale er der i første omgang lagt op til, at landmænd og andre jordejere frivilligt skal tage landbrugsjord ud af drift, bytte deres jord væk for anden landbrugsjord eller omlægge deres jord til skov og natur med økonomisk støtte fra staten.Til at understøtte målene er der afsat 43 milliarder, som skal dække både skovrejsning, etablering af vådområder og statslige opkøb af jord. Novo Nordisk Fonden har bidraget med yderligere 10 milliarder kroner til arealomlægningen, der primært skal “accelerere etableringen af sammenhængende naturarealer og skovrejsning”.- Vi har hele tiden været bekymrede for, at de midler, der er stillet til rådighed, ikke er nok til at opfylde de ambitioner, der er. Når efterspørgslen og priserne stiger, er midlerne til opkøb mindre værd. Det er uheldigt, siger Torsten Hasforth. Han frygter, at der med prisstigninger skal hives flere penge op af statskassen for at nå i mål, men håber, at den varslede CO2-afgift på landbrugsproduktionen fra 2030 og de restriktive krav til anvendelse af kvælstof på marker kan lægge en dæmper på prisstigningerne. - Hvis man ikke må komme kvælstof i jorden i samme grad som tidligere falder udbytterne, og så kan jorden blive mindre værd. Men det kræver selvfølgelig, at begrænsningerne bider på landmændene, siger Concitos cheføkonom. Minister: - Vi kommer til at regulereMinister for Grøn Trepart, Jeppe Bruus (S), kunne i går fortælle, at der netop er taget hul på den første af de i alt 43 milliarder kroner, Regeringen har afsat med den grønne trepartsaftale.Pengene gik til opkøb af landbrugsjord, som skal indgå i bytte for jord til et vådområdeprojekt, der blev søsat tilbage i 2020.At interessen for landbrugsjord vokser og priserne samtidig er stigende, har ministerens opmærksomhed, men han er indtil videre overbevist om, at det ikke kommer til at spænde ben for målet med treparten, siger han til TV 2.- Vi kommer selvfølgelig til at fokusere på, at jordpriserne ikke skal stige. Der skal være ro om jordpriserne. I første omgang handler det om, at staten ikke ligger og byder hinanden op og at vi får private til at være med i projektet.Jeppe Bruus nævner desuden kommende regulering som et værktøj, der kan holde priserne i ro.- Vi kommer til at regulere, hvad man kan på de marker, der udleder for meget kvælstof, og der kommer en afgift på de lavbundsjorde, der står og afgasser. Alt i alt skal det være med til at holde ro om priserne.Er du slet ikke bekymret for, at priserne på jord kommer til at stige endnu mere?- Jo. Det er også derfor, vi har fokus på at holde ro om jordpriserne. Staten betaler ikke overpris, og vi kan se, at der er mange, som gerne vil sælge. Der var en overansøgning i vores klima og lavbundsprojekter sidste år. Det er rigtig positivt, lyder det fra Jeppe Bruus, der anerkender, at det kræver vilje "at få tingene til at lykkes" for de midler, der er afsat.- Når jeg kommer rundt i landet, så er det også det, jeg møder. Folk er utroligt imødekommende og bakker op, understreger ministeren.Del artikelDelFacebookXE-mailLinkKopiér'
