title = "Ordkrig mellem Zelenskyj og Trump har nået nye højder – ekspert forudser, at det kan ende med to scenarier - TV 2"
description = "Ekspert opfordrer Zelenskyj til at køre samme strategi, som den danske regering gør."
full_description = '''Krigen i UkraineOrdkrig mellem Zelenskyj og Trump har nået nye højder – ekspert forudser, at det kan ende med to scenarierEkspert opfordrer Zelenskyj til at køre samme strategi, som den danske regering gør.Zelenskyj og Trump langer ud efter hinanden i kølvandet på de indledende fredsforhandlinger i Saudi-Arabien. Arkivfoto. Foto: Shannon Stapleton / Ritzau Scanpix 19. feb kl. 23.47Berfin ErdemSå er der kommet andre boller på suppen.Der er i øjeblikket en intens ordkrig mellem USA's præsident, Donald Trump, og Ukraines præsident, Volodymyr Zelenskyj.- Desværre lever han i den her desinformationsboble, sagde Zelenskyj onsdag ifølge nyhedsbureauet Reuters om Trump.Kort efter kom Donald Trump med et opslag på sit sociale medie Truth Social, hvor han kaldte Zelenskyj for en "diktator".- Han nægter at afholde valg, han ligger lavt i de ukrainske meningsmålinger, og det eneste, han er god til, er at spille Biden som en violin. Som en diktator uden valg, må Zelenskyj hellere reagere hurtigt, ellers har han ikke noget land tilbage, skriver Trump.Det hele sker i kølvandet på tirsdagens indledende fredsforhandlinger i Saudi-Arabien, hvor Ukraine ikke var inviteret med.Tirsdag mødtes repræsentanter fra USA og Rusland i Saudi-Arabiens hovedstad, Riyadh, og formålet med mødet var blandt andet at drøfte krigen i Ukraine. Foto: Russian Foreign Ministry Press Service Handout / Ritzau ScanpixPå kort tid har det træk affødt en lavine af dramatiske, diplomatiske twists i spørgsmålet om fred i Ukraine – indeholdende hårde vendinger om Zelenskyj fra Trump.Ordkrigen kan have fatale konsekvenser for Ukraines involvering i fredsforhandlingerne om krigen. Det vurderer Isabel Bramsen, der er fredsforsker ved Center for Konfliktløsning på Lunds Universitet, over for TV 2.- Jeg er bekymret for, hvad Zelenskyj roder sig ud i. Det er en vildt svær balancegang, han står i, forklarer Isabel Bramsen.Zelenskyj nægter at være tredjehjul, siger ekspertUdtalelserne flyver, og situationen er tæt på at spidse til.Det er blot omkring en uge siden, at Trump manede frygten til jorden, da han forsikrede om, at Ukraine vil have en plads ved forhandlingsbordet.Da det ikke var tilfældet ved tirsdagens indledende fredsforhandlinger i Saudi-Arabien, rettede Zelenskyj skarp kritik mod fredsmødet i golflandet – en kritik, som nu udvider sig til at handle om Trump.PerspektivOrdkrigen – hvad har Trump og Zelenskyj sagt?Tirsdag: Zelenskyj reagerede kraftigt på de indledende forhandlinger i Saudi-Arabien. - Forhandlinger burde ikke foregå bag vores ryg, udtalte Zelenskyj ifølge nyhedsbureauet Reuters. Dernæst aflyste Zelenskyj sit planlagte statsbesøg til Saudi-Arabien onsdag. Ruslands præsident, Vladimir Putin, har tirsdag tilsyneladende åbnet op for en mulig samtale med Zelenskyj, men understreger, at der er "juridiske aspekter relateret til hans legitimitet", der skal overvejes. Alle valg i Ukraine er aflyst på grund af den militære undtagelsestilstand, der er blevet indført i landet, med henvisning til den ukrainske forfatning. Senere på dagen bliver Trump ved et pressemøde spurgt ind til, hvorvidt man vil støtte det russiske krav om et valg i Ukraine for at nå en fredsløsning. - Vi har en situation, hvor vi ikke har haft valg i Ukraine, vi har krigsretstilstand, hvor lederen i Ukraine, jeg hader at sige det, men han er nede med fire procent i meningsmålinger, og hans land er blevet sprængt i stykker. Det ligner en nedrivningsplads, siger Trump og tilføjer: - Og ja, jeg vil sige, når de vil have en plads ved bordet, ville Ukraines befolkning så ikke være nødt til at sige, at det er længe siden, vi har haft et valg, fortsætter han. Onsdag: Trumps udtalelser tirsdag er tilsyneladende ikke faldet i god jord hos Zelenskyj, da han onsdag langer ud efter Trump og hans allierede. - De lader Putin slippe ud af isolation, og jeg tror, at Putin og Rusland er meget glade, fordi de er involveret i diskussionerne, og i går var der signaler på, at det er dem, der er ofrene – det er nyt, siger Zelenskyj blandt andet ifølge Reuters. Kort efter kom Trump med et opslag på sit sociale medie Truth Social, hvor han kaldte Zelenskyj for en "diktator". - På den ene side vil Zelenskyj ikke finde sig i at blive sat på sidelinjen som et tredjehjul i en russisk-amerikansk diplomatiske tilnærmelse, siger Isabel Bramsen og tilføjer:- Men omvendt skal han jo også virkelig passe på, for Trump er ikke sådan en, man vil blive uvenner med i offentligheden, lyder det fra Isabel Bramsen.Skruer tiden tilbage til 2019Isabel Bramsen forestiller sig dermed to mulige scenarier for forhandlingerne:Zelenskyj, Putin og Trump indgår alle i højpolitiske forhandlinger om krigens afslutning.Hvis ukrainerne vil have fred, så skal de – under en våbenhvile – først til stemmeurnerne.- Hvis det er de to hovedmuligheder, så er det i hvert fald afgørende, at Zelenskyj er i kridthuset hos Trump, så han ikke pludselig bliver set som illegitim, lyder det fra Isabel Bramsen.Forskeren minder også om, hvordan Trump tilbage i 2019 beskrev statsminister Mette Frederiksens udtalelser som "nasty", da hun kaldte diskussionen om at "købe" Grønland for "absurd" – og hun henviser til hele det hvirvelvind, der er fulgt med sidenhen.- Zelenskyj kan med fordel gøre som den danske regering, der i spørgsmålet om Grønland og Trump fik en lang række andre europæiske ledere til at tale Trump imod på deres vegne frem for selv at rage uklar med Trump, påpeger Isabel Bramsen.52 procent af ukrainerne havde tillid til Zelenskyj i december 2024, viser en meningsmåling fra Kyiv International Institute of Sociology.Det er ifølge instituttets målinger den laveste opbakning siden maj 2022.Del artikelDelFacebookXE-mailLinkKopiér'''
