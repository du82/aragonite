["https://nyheder.tv2.dk/business/2025-02-20-stor-dansk-virksomhed-vandt-paa-trump-for-otte-aar-siden-nu-har-de-igen-en-fordel"]
title = "Stor dansk virksomhed vandt på Trump for otte år siden – nu har de igen en fordel - TV 2"
description = "FLSmidths aktiekurs steg kraftigt i kølvandet på Donald Trumps valgsejr for otte år siden. Men snart kan vigtigt element forsvinde."
full_description = 'BusinessStor dansk virksomhed vandt på Trump for otte år siden – nu har de igen en fordelFLSmidths aktiekurs steg kraftigt i kølvandet på Donald Trumps valgsejr for otte år siden. Men snart kan vigtigt element forsvinde.FLSmidth har hovedsæde i Valby, men driver forretning i hele verden. Foto: Ida Marie Odgaard / Ritzau Scanpix 20. feb kl. 22.48Mikkel Walentin MortensenTænk bare på Ørsted, Vestas eller Novo Nordisk.For en række af Danmarks største selskaber har udsigten til og tiltrædelsen af Donald Trump som præsident i USA kostet på aktiekursen.Se ogsåFlere elitevirksomheder vælger kvinder til bestyrelserne – men ikke til de tunge posterMen for FLSmidth, der beskæftiger sig med udstyr til minedrift og cement, er vagtskiftet i Washington ikke nogen dårlig nyhed.Det fortæller Valby-virksomhedens finansdirektør, Roland Andersen, i forbindelse med offentliggørelsen af årsregnskabet torsdag.- Jeg synes stadig, at mange ting er lidt usikre, men en del af tingene vil formentlig være positive for os, siger finansdirektøren til TV 2.- En god ting for vores forretningGrunden til, at FLSmidth kan få gavn af Donald Trump i Det Hvide Hus er, at han har lovet et øget fokus på den amerikanske undergrund. Ifølge Roland Andersen vil det være godt nyt for mineindustrien, der hidtil har været plaget af meget lange ventetider og godkendelsesprocesser.- De signaler, der kommer fra Trumps administration, er, at han vil have mere fokus på mineindustrien. Det vil formentlig betyde, at der hurtigere vil blive tilladelser til at udvinde miner i USA, og det vil på længere sigt være en god ting for vores forretning, siger FLSmidths (FLS) finansdirektør.Se ogsåKinesiske droner flyver i stort set alle dele af DanmarkKort fortalt går FLSmidths forretning på to ben: Dels er der minedelen, der udgør langt hovedparten af FLS’ virke, og dels er der en cementdivision. I begge kategorier sælger man industrianlæg og serviceydelser, og derfor er det danske selskab yderst afhængigt af, at mineselskaber får lov til at grave i USA, så de skal købe udstyr og ydelser fra FLS.Aktiefesten i 2016Siden Donald Trump vandt det amerikanske præsidentvalg i november, er FLSmidths aktiekurs steget med cirka syv procent, men flere gange har aktien faktisk været billigere end på valgdagen.Sådan var det imidlertid ikke i 2016, hvor Trumps første valgsejr gav luft under FLS’ aktiekurs. I dagene op til valget for otte år siden kostede én FLS-aktie således omkring 240 kroner, mens den et år senere var omkring 430 kroner værd.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Dengang var det også udsigten til et opsving for mineindustrien, der smittede af på FLS’ aktiekurs, men også Trumps løfte om at skyde op mod 500 milliarder dollars ind i den amerikanske infrastruktur gav håb om en travl cementbranche.Denne gang har aktiereaktionen altså været mere afdæmpet, men FLSmidth – der frem til 2004 ejede Danmarks største cementfabrik, Aalborg Portland – har også meldt ud, at man gerne vil sælge sin cementforretning fra, så fokus i fremtiden kommer til at være på minedelen.Se ogsåArla tjener milliarder – derfor stiger prisen på mælk så voldsomtDel artikelDelFacebookXE-mailLinkKopiér'
