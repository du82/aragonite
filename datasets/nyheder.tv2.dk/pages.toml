["https://nyheder.tv2.dk/samfund/2025-02-27-omstridt-lovgivning-rammer-ogsaa-anden-gruppe-men-de-faar-ikke-hjaelp"]
title = "Omstridt lovgivning rammer også anden gruppe – men de får ikke hjælp - TV 2"
description = "Beskæftigelsesministeren har meldt ud, at omstridt lovgivning, der rammer adopterede, skal ændres. Men det er ikke den eneste gruppe, der er berørt."
full_description = 'SamfundOmstridt lovgivning rammer også anden gruppe – men de får ikke hjælpBeskæftigelsesministeren har meldt ud, at omstridt lovgivning, der rammer adopterede, skal ændres. Men det er ikke den eneste gruppe, der er berørt.Beskæftigelsesminister Ane Halsboe-Jørgensen vil ændre omstridt lovgivning, så den undtager adopterede. Foto: Thomas Sjørup / Ritzau Scanpix I går kl. 13.59Nickie Josephine Stilling KarlsenDanskere, der har boet i udlandet i mere end et sammenhængende år, vil fra 1. juli 2025 gå under betegnelsen ”indrejst” i kontanthjælpssystemet, hvis de er vendt tilbage til Danmark efter 1968.Således bliver deres rettigheder sidestillet med indvandreres.Tidligere på ugen kunne Information og TV 2 fortælle, at det samme gælder adopterede. Det fik beskæftigelsesminister Ane Halsboe-Jørgensen til at udtale, at hun nu vil forsøge at ændre lovgivningen, så den gruppe bliver undtaget.Jeg troede da, at jeg som dansk statsborger med dansk pas havde danske rettigheder. Det kommer bag på mig, at det har jeg åbenbart ikkeMarianne Oehlenschläger, specialskolelærerMen nu råber såkaldte udlandsdanskere op, for de går også under aftalen om arbejdspligt, der ellers var målrettet indvandrere – ”især kvinder med ikke-vestlig baggrund, der skal opleve, at de har noget at bidrage med og gør en forskel”, som det lød fra beskæftigelsesminister Ane Halsboe Jørgensen, da aftalen blev præsenteret.Arbejdspligten betyder, at udlandsdanskerne modtager en såkaldt mindstesats i kontanthjælpssystemet, som svarer nogenlunde til den lave kontanthjælpsydelse, der er målrettet udlændinge. Ved at være i arbejde kan man optjene retten til højere ydelser.Organisationen Danes Worldwide kalder det ”en våd klud i ansigtet” på danskere, der ellers har arbejdet for Danmarks interesser i udlandet og danske børn født i udlandet.Se ogsåMinister trækker i land i adoptionssagIkke lige så værdigDa Marianne Oehlenschläger og hendes mand tog til Tanzania i 2003 for at arbejde, havde hun aldrig i sin vildeste fantasi forestillet sig, at det kunne få betydning for hendes og ikke mindst hendes børns rettigheder i det danske kontanthjælpssystem.- Jeg troede da, at jeg som dansk statsborger med dansk pas havde danske rettigheder. Det kommer bag på mig, at det har jeg åbenbart ikke, siger hun.Mellem 2003 og 2006 var Marianne Oehlenschläger lærer på en dansk skole i Tanzania. Hendes mand og børn var også med, og det er særligt børnenes rettigheder, der nu bekymrer Marianne Oehlenschläger.- Én ting er, om jeg får brug for kontanthjælpssystemet. Men mine børn har et langt liv foran sig, hvad hvis de får brug for det? De har ikke valgt, hvor de skulle bo, mens de var små, uddyber hun.Marianne Oehlenschläger har boet og arbejdet i Tanzania fra 2003 til 2006 og er nu sidestillet med indvandrere i kontanthjælpssystemet. Foto: PrivatfotoMadeleine Steenberg Williams er netop et af de børn af udlandsdanskere, der nu står til at blive sidestillet med indvandrere i det danske kontanthjælpssystem.Hun er vokset op i Danmark, har en studentereksamen, studerer i dag på CBS og lægger mange timer i frivilligt arbejde.En udlandsdansker er ikke indvandrer, en udlandsdansker er dansk statsborger. Det her rammer jo helt skævtMichael Bach Petersen, generalsekretær i Danes WorldwideI dag er hun 22 år, men hun blev født i Ungarn, fordi hendes mor var udsendt som diplomat for den danske stat, og hun har også boet i USA, fra hun var tre til syv år, da hendes mor gjorde tjeneste der.Derfor bliver hendes rettigheder i kontanthjælpssystemet også sidestillet med indvandreres efter 1. juli 2025. Det bekymrer hende, fordi man aldrig ved, om man kan få brug for hjælp, forklarer hun:- Men det er lige så meget hele præmissen, at jeg ikke bliver anset som lige så værdig til de ydelser, vi har i samfundet.Madeleine Steenberg Williams er født og har boet i udlandet som barn, fordi hendes mor var udsendt som diplomat for den danske stat. Hun er frustreret over de ulemper, det nu fører med sig. Foto: PrivatfotoOveni de nye ændringer i kontanthjælpssystemet står Madeleine Steenberg Williams lige nu midt i en proces, hvor hun skal søge om at bevare sit danske statsborgerskab, fordi hun er født i udlandet.Den danske stat kan ikke fratage hende det, fordi det er ulovligt at gøre mennesker statsløse, men hun skal alligevel igennem en ansøgningsproces, når hun fylder 22 år. Den ansøgning venter hun på at få godkendt.Derfor er bekymringerne om den nye lovændring en ting oveni alt det andet, fortæller hun:- Alt det her, bare fordi min mor har arbejdet for den danske stat i udlandet.Se ogsåPresset stiger på ministeren: - Jeg forventer en kæmpe undskyldning, siger adopteret kvindeAndenrangsborgereOrganisationen Danes Worldwide repræsenterer og rådgiver danskere, der bor og arbejder i udlandet.Her hilser de det meget velkommen, at adopterede nu ser ud til at blive undtaget lovgivningen, men samtidig er man meget utilfreds og frustreret over, at lovændringen stadig rammer udlandsdanskere. Sådan lyder det fra generalsekretær Michael Bach Petersen.- En udlandsdansker er ikke indvandrer, en udlandsdansker er dansk statsborger. Det her rammer jo helt skævt. Hensigten med loven er at få indvandrere ud af kontanthjælpssystemet, men den skal jo ikke ramme sagesløse danskere, blot fordi de har boet i udlandet, siger han.Jeg har prøvet virkelig hårdt og bliver nu behandlet sådan her af mit eget landMadeleine Steenberg Williams, studerendeStod det til Michael Bach Petersen, blev udlandsdanskere også undtaget arbejdspligten på samme måde som adopterede.Danmark har som lille og åben økonomi hårdt brug for eksportindtægter og investeringer, som danskere i udlandet i den grad er med til at skaffe, lyder det:- Alligevel gør man med dette lovforslag udlandsdanskere til andenrangsborgere på trods af, at de tjener danske interesser ude i verden. Det er en våd klud i ansigtet på dem, at de ved tilbagevenden til Danmark vil blive omfattet af arbejdspligten.Se ogsåAdopterede sidestilles med indvandrere i ny lovgivning- Jeg kan bare se til, mens mine rettigheder forsvinderMadeleine Steenberg Williams bruger også ordet ”andenrangsdansker”. Hun føler, hun står alene uden mulighed for at råbe politikerne op.- Jeg synes, det er en hård situation, for det føles nytteløst. Jeg kan bare se til, mens mine rettigheder forsvinder, siger hun.Marianne Oehlenschläger er ikke i tvivl om, at lovændringen kan afskrække danskere fra at rejse ud i verden – særligt hvis deres børn skal med.- Hvis vi havde vidst, at det her ville ramme vores børn, skulle vi da lige overveje en gang mere, om det var det, vi ville, siger hun.Også i Madeleine Steenberg Williams’ familie fylder det, at moderens arbejde for den danske stat i udlandet nu bliver en ulempe for hende, fortæller hun:- Alt det arbejde, jeg har gjort, bliver ikke accepteret som ligeværdigt. Og hele mit liv i Danmark bliver ikke anerkendt. Jeg har prøvet virkelig hårdt og bliver nu behandlet sådan her af mit eget land.Se ogsåAdoptionssag får partier til at kræve endnu en lov ændretObjektive kriterierTV 2 har fredag talt med beskæftigelsesordfører Jens Joel (S) om kritikken af lovgivningen.Han er ikke enig i beskrivelsen af, at lovgivningen gør udlandsdanskere til "andenrangsborgere".- Hvis man boet en del af sit liv i et andet land og ikke bidraget med skat herhjemme, så synes jeg, at det er rimeligt nok, at man ikke fra start får både fuld adgang til danske ydelser plus det, man måtte have optjent privat i et andet land, siger ordføreren.Jens Joel forklarer, at reglerne er lavet for at sikre, at Danmarks sociale ydelser ikke virker tillokkende for indvandrere og udlændinge. Pointen er dermed, at man skal optjene retten til højere kontanthjælpsydelser ved at være i arbejde.Han understreger samtidig, at der er tale om objektive kriterier, der altså gælder for alle, der kommer til Danmark.- Vi står helt ved, at den her lovgivning er lavet for at sikre, at der ikke kommer for mange flygtninge og indvandrere til Danmark. Men loven er ikke indrettet efter herkomst, fordi det er nødt til at være objektive kriterier, fortæller han.Jens Joel pointerer samtidig, at reglerne ikke er nye.- Det, at man skal optjene ret til højere ydelser, når man kommer til Danmark udefra – også som udenlandsdansker – er et velkendt princip og ikke noget, der er indført med den nye lovgivning om arbejdspligt, fortæller han.Del artikelDelFacebookXE-mailLinkKopiér'
