description = "Hvad skete der? Efter USA's præsident Donald Trump torsdag aften gentog sine trusler om at pålægge straftold på varer fra Mexico, Canada, Kina og EU, plagede ø..."
full_description = 'Kl. 11.09Tæt på nul i DanmarkEfter et par timers handel er det danske C25-indeks tæt på at ramme gårsdagens lukkekurs – altså gå i nul, om man vil.Den store taber i Danmark ser ud til at blive Zealand Pharma, der er nede med 3,7 procent omkring klokken 11. GN Store Nord, Danske Bank og Mærsk står tillige til fald på over 1 procent. Bryggeriet Royal Unibrew, Pandora og Novonesis er omvendt i plus med mindst 1 procent.Også i en række andre europæiske lande, hvor dagen startede i rødt, er aktiemarkedet langsomt kravlet op i de første handelstimer. Stoxx 600, der består af de største 600 europæiske børsnoterede selskaber, er i øjeblikket minus 0,3 procent.Del opslagDelFacebookXE-mailLinkKopiér Kl. 10.30Danske Bank peger på europæiske aktier- 2025 kan blive året for europæiske aktier.Sådan lyder det i en analyse fra Danske Bank, der mener, at europæiske aktiers stærke start på året kan fortsætte. De seneste år er amerikanske aktier ellers løbet fra deres europæiske modparter, men nu ser landets største bank "små glimt af håb for europæisk vækst", samtidig med at aktierne er "billigt værdisat".- Derfor er der rum for, at både europæisk vækst og europæiske aktier kan overraske positivt, lyder det i analysen.Del opslagDelFacebookXE-mailLinkKopiér Kl. 10.18Kryptomarkedet har prøvet det, der er værre, siger ekspertSom tidligere beskrevet har både det seneste døgn og den seneste uge været en dyr omgang for en række af de største og vigtigste kryptovalutaer i verden. Af de seks mest værdifulde er fire af dem faktisk faldet med tæt på eller over 20 procent den seneste uge, viser data fra Coinmarketcap.Men alligevel er der ikke tale om nogen historisk krise, fortæller Mads Eberhardt, der er uafhængig økonom og ekspert i kryptomarkedet.- Rent historisk har kryptomarkedet og Bitcoins prøvet det, der er værre. Kryptomarkedet er ekstremt volatilt – priserne svinger meget – og investorerne er vant til, at det går op og ned, siger han til TV 2.Faldene skal samtidig ses i lyset af, at kryptomarkedet er steget stort, siden at Donald Trump vandt det amerikanske præsidentvalg i starten af november. Trods de markante fald den seneste uge er prisen på Bitcoin eksempelvis stadig over niveauet inden Trumps valgsejr, og ifølge Mads Eberhardt tyder alt da også på, at USA rent faktisk vil være mere venligt stemt over for kryptovalutaer end tidligere.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Del opslagDelFacebookXE-mailLinkKopiér'
