["https://nyheder.tv2.dk/business/2025-02-20-46000-finansansatte-kan-se-frem-til-loenstigning-i-ny-overenskomst"]
title = "46.000 finansansatte kan se frem til lønstigning i ny overenskomst - TV 2"
description = "Der vil blandt andet være fuld løn til medarbejdere, der går til fertilitetsbehandling, lyder det i aftalen."
full_description = "Business46.000 finansansatte kan se frem til lønstigning i ny overenskomstDer vil blandt andet være fuld løn til medarbejdere, der går til fertilitetsbehandling, lyder det i aftalen. Ny overenskomstaftale har fokus på et mere bæredygtigt arbejdsliv. Foto: Thomas Traasdahl / Ritzau Scanpix 20. feb kl. 11.43RitzauFinans Danmark og Finansforbundet har torsdag indgået en ny overenskomst for 46.000 finansansatte.Det oplyser Finans Danmark i en pressemeddelelse.Aftalen er treårig og løber frem til 31. marts 2028.Se ogsåTopøkonomer er ikke i tvivl – danskerne kan se frem til pæne lønstigningerDen indeholder et nyt lønsystem med en lønstigning på 2,4 procent det første år. Lønrammen stiger årligt 2,5 procent i de to sidste år.Det giver en samlet lønstigning på 7,4 procent i perioden.Et bæredygtigt arbejdslivDesuden har parterne ønsket et mere bæredygtigt arbejdsliv i aftalen.Blandt andet vil der være fuld løn til medarbejdere, der går til fertilitetsbehandling.Der vil også være bedre muligheder for at planlægge overenskomstmæssige feriedage i forbindelse med personlige mærkedage eller dage, der betyder noget særligt for medarbejderen, lyder det.Se ogsåDanskernes tillid til økonomien rammer årets laveste niveau- Finanssektorens nye overenskomst er økonomisk ansvarlig og giver mere fleksibilitet til gavn for både virksomheder og medarbejdere, siger Morten Schønning Madsen, der er direktør for Finans Danmark/Arbejdsgiver.- Med aftalen sikrer vi fornuftige lønstigninger og giver medarbejderne bedre muligheder for at håndtere arbejdslivet i svære livssituationer, lyder det.Overenskomsten gælder for 116 virksomheder og ansatte i landets penge- og realkreditinstitutter samt datacentraler. Del artikelDelFacebookXE-mailLinkKopiér"
year_published = 2025
year_updated = 2025
