title = "Butiksejer nægter at fjerne ulovlige skilte - TV 2"
description = "Ejer af Vinspecialisten i Silkeborg, Ludovic Riauté, havde forleden besøg af borgmester Helle Gade for at drøfte skiltene foran hans butik."
full_description = "BusinessButiksejer nægter at fjerne ulovlige skilteEjer af Vinspecialisten i Silkeborg, Ludovic Riauté, havde forleden besøg af borgmester Helle Gade for at drøfte skiltene foran hans butik.Udarbejdet af TV MidtvestLudovic Riauté har haft skiltene i 12 år. Foto: Jan Ebbesen, TV MIDTVEST I går kl. 21.49 Trine Schmidt TV MidtvestVinspecialisten, der ligger i gågaden i Silkeborg, har i 12 år haft tre skilte stående foran butikken. Men to ud af de tre skilte står der ulovligt.Sidste år vedtog politikerne i kommunens Plan- og vejudvalg nemlig et nyt regulativ for skilte i gågaden, som fastsætter, at butikker med op til 20 meters facade højst må have ét skilt stående foran butikken.Og det er Ludovic Riauté langt fra tilfreds med, så da han i efteråret blev bedt om at fjerne to af sine tre skilte, nægtede han.- De skilte er vigtige for min forretning, så kunderne i gågaden lægger mærke til min butik, siger han.Han ansøgte Silkeborg Kommune om dispensation til at beholde alle tre skilte, men fik til sin store utilfredshed afslag. Skiltene har dog stået der lige siden.Borgmesterbesøg uden løsningEfter at have inviteret borgmester Helle Gade (S) til en snak fik Ludovic Riauté for nyligt fornemt besøg. Og mødet var positivt, fortæller han:- Det gik rigtig fint. Hun forstod mine frustrationer og var enig med mig i, at de tre skilte ikke generer nogen i gågaden.Ifølge reglerne i Silkeborg Kommune må Vinspecialisten kun have et af sine tre skilte stående foran butikken. Foto: Privatfoto, Vinspecialisten SilkeborgAlligevel er han ikke optimistisk:- Hun fortalte, at hun ikke rigtig kan gøre noget ved det, og at det er Plan- og vejudvalget, jeg skal have fat i. Så dem kommer jeg nu til at bede om et møde, siger han og tilføjer: - Men det kommer jo til at tage lang tid. Jeg kommer til at beholde skiltene uanset.Reglerne står fastBorgmester Helle Gade understreger overfor TV MIDTVEST, at reglerne er vedtaget politisk:- Der er jo politisk vedtaget et skilteregulativ, og så længe mine kollegaer i Plan- og vejudvalget ikke har lavet det om, så er det sådan, reglerne er, og det bakker jeg op om. Jeg kommer ikke til at ændre noget, siger hun.Hun har dog opfordret Ludovic Riauté til at tage dialogen videre:- Jeg har foreslået ham at invitere alle syv medlemmer af Plan- og vejudvalget til en kop kaffe, ligesom han inviterede mig, siger hun og afslutter: - Og måske kan han også invitere nogle af de andre butiksejere fra gågaden med for at høre, om de har ønsker eller input, siger hun.Del artikelDelFacebookXE-mailLinkKopiérUdarbejdet af TV MidtvestSe ogsåSlagter til kamp mod kæmpebøde: - Det er noget hysteri150 stod klar til at ribbe badehotel for inventarKai på 75 år er hjemmehjælper og elsker sit job"
