["https://nyheder.tv2.dk/udland/2025-02-19-trump-har-et-klart-formaal-med-at-kalde-zelenskyj-en-diktator-siger-ekspert"]
title = "Trump har et klart formål med at kalde Zelenskyj en diktator, siger ekspert - TV 2"
description = "TV 2s korrespondent Lotte Mejlhede måtte nærlæse Trumps seneste angreb på Ukraines præsident flere gange."
full_description = 'Krigen i UkraineTrump har et klart formål med at kalde Zelenskyj en diktator, siger ekspertTV 2s korrespondent Lotte Mejlhede måtte nærlæse Trumps seneste angreb på Ukraines præsident flere gange.Donald Trump har intensiveret sine angreb på Ukraines præsident, Volodymyr Zelenskyj. Foto: Andrew Caballero-reynolds, Sergei Gapon / Ritzau Scanpix 19. feb kl. 21.34David BuchUkraines præsident er en diktator, som ikke afholder valg.Sådan lyder Donald Trumps seneste frontalangreb på Volodymyr Zelenskyj.- Han nægter at afholde valg, han ligger lavt i de ukrainske meningsmålinger, og det eneste, han er god til, er at spille Biden som en violin. Som en diktator uden valg, må Zelenskyj hellere reagere hurtigt, ellers har han ikke noget land tilbage, skriver den amerikanske præsident på sit sociale medie Truth Social.For hver linje tænker man, ”skriver han virkelig det”Lotte Mejlhede, TV 2s korrespondent i USAPræsident Trumps angreb kommer dagen efter, at han anklagede Ukraine for at starte krigen. Her hævede Trump også, at Zelenskyj kun har opbakning fra fire procent af den ukrainske befolkning. Men det passer ikke.Den seneste måling fra Kyiv International Institute of Sociology viser, at opbakningen til Zelenskyj i den ukrainske befolkning er på 57 procent.Ukrainerne skulle have holdt præsidentvalg i april sidste år, men Ukraines forfatning giver mulighed for at udsætte valg på grund af krig, og Zelenskyj valgte at udsætte valghandlingen på grund af den russiske invasion.Se ogsåTrump kritiserer Ukraine for krigen – "I skulle aldrig have startet den"Ligeglad med fredJacob Kaarsbo, der er udenrigs- og sikkerhedspolitisk kommentator og tidligere chefanalytiker i Forsvarets Efterretningstjeneste, mener, at Donald Trump har et klart formål med sine angreb på Ukraines præsident.- Når Trump kalder Zelenskyj en diktator, og går ud med den her påstand om, at han kun har opbakning fra fire procent af den ukrainske befolkning, er det for at gøre Zelenskyj illegitim. Det gør han, fordi Zelenskyj og vi europæere er besværlige for Trump. Han foretrækker at lave en handel med Putin og Rusland, siger Jacob Kaarsbo til TV 2 og tilføjer:- Vi er tilbage til, at Trump laver aftaler om Ukraine – uden Ukraine. Trump er ligeglad med fred og en fredsaftale. For ham er det mere vigtigt at lave en aftale med Putin. Det er lukrativt, og så må europæerne ryge og rejse. Det er desværre den realitet, vi står med.LynanalyseClaus Borg ReinholdtKorrespondent, TV 2Det er et angreb af dimensioner, som Trump kommer med. Ukrainerne kan ikke længere regne med amerikanerne, og derfor håber man nu, at europæerne vil komme op i gear og være der for dem. Den seneste tid har vist, at Zelenskyj er magtesløs over for Trumps udmeldinger, og det eneste, han nu kan gøre, er at afvise hans urigtige påstande. Russerne sidder og klapper i hænderne. Det her er præcis det, de gerne vil høre fra en amerikansk præsident. Det er ikke bare det de vil høre om krigen, men også i forbindelse med de forhandlinger, der nu går i gang. Men Zelenskyj kommer ikke til at overgive sig. Trump er provokeretTV 2s korrespondent i USA, Lotte Mejlhede, fortæller, at hun var nødt til at nærlæse Trumps kontroversielle angreb på Ukraines præsident:- For hver linje tænker man, ”skriver han virkelig det”. Vi har at gøre med en præsident, som er så provokeret af, at Zelenskyj gør oprør mod fredsprocessen i Saudi Arabien, hvor Ukraine og Europa ikke var inviteret.- Samtidig er Zelenskyj gået i rette med Trumps udmelding om, at præsidenten kun skulle have opbakning fra fire procent af Ukraines befolkning, hvilket ikke passer. Selv i en Trump-målestok er det her voldsom retorik, som mange i Europa vil sidde fuldstændig hovedrystende over for, siger Lotte Mejlhede.Se ogsåRusland tog stikket hjem ved forhandlingsbordet – nu har Zelenskyj én stor opgaveTrumps anklager om, at Ukraine startede krigen og om Zelenskyjs manglende opbakning i befolkningen, fik tidligere på dagen Ukraines præsident til at kritisere Donald Trump i hårde vendinger.På et pressemøde sagde Zelenskyj, at Trump er fanget i en "desinformations-boble", og at den amerikanske præsident har hjulpet med at ”gøre op med Putins isolation på et globalt plan”.LynanalyseLotte MejlhedeUSA-korrespondent, TV 2Trumps seneste retoriske frontalangreb på Zelenskyj er selv på en Trump-skala meget voldsomt. At kalde Zelenskyj en diktator og beskylde ham for at krigen har trukkket ud, fortæller med tydelighed, at Trump VIL have krigen sluttet hurtigt - næsten - koste, hvad det vil på den ukrainske side. Så hvorfor overhovedet bruge ordet “næsten” om de ukrainske omkostninger? Fordi Trump stadig har en kæmpe interesse i at få adgang til Ukraines jord/metal ressourcer for at holde Kina stangen - og han vil heller ikke se godt ud, hvis en kommende fredsaftale ender med at blive så meget på Putins præmisser, at Putin hurtigt vil lade hånt om den - og fortsætte sine imperialistiske tendenser. Så vil Trump ikke gå over i historien som ham, der fik en fred i stand. Trump roser sig selvI opslaget onsdag på Truth Social, hvor Donald Trump kalder Volodymyr Zelenskyj en "diktator", fremhæver USA’s præsident også sig selv.- Vi forhandler succesfuldt med Rusland om at gøre ende på krigen, noget, som kun "TRUMP" og Trump-administrationen kan gøre. Biden prøvede aldrig, og Zelenskyj vil sandsynligvis gerne holde the gravy train (at tjene hurtige penge uden at arbejde for det, red.) kørende, skriver Trump.Se ogsåTrump og Musk afviser spekulationer om forholdUSA har siden krigens begyndelse støttet Ukraine både militært og økonomisk, men siden Trump har overtaget præsidentembedet, har der i Europa og Ukraine været bekymring for, om støtten vil fortsætte.I sit opslag på Truth Social hævder Donald Trump, at mange af de penge, USA har sendt til Ukraine, er "forsvundet".Han uddyber ikke, hvad han mener, men skriver, at præsident Zelenskyj har været en dårlig leder for landet.- Jeg elsker Ukraine, men Zelenskyj har gjort et forfærdeligt stykke arbejde, skriver den amerikanske præsident.Risikerer at starte tredje verdenskrigTrumps frontalangreb på Zelenskyj kommer efter, at den amerikanske præsident sent onsdag aften dansk tid holdt et pressemøde i Mar-a-Lago i Florida.Se ogsåUkraines skæbne ligger i hænderne på Trump – hvad er det værste, der kan ske?Udover at anklage Ukraine for at starte krigen mod Rusland, gav han også sin forgænger, Joe Biden, noget af skylden for krigen og sagde, at den ville have været undgået, hvis Trump havde vundet valget i 2020.- Præsident Putin og jeg talte om Ukraine. Det var hans øjesten, kan jeg fortælle jer, men der var aldrig en chance for, at han ville gå ind. Jeg sagde til ham: "Du må hellere lade være med at gå ind. Gå ikke ind, gå ikke ind," og han forstod det. Han forstod det fuldt ud, lød det fra Donald Trump.Ifølge Donald Trump er det nu de europæiske lande, der risikerer at starte tredje verdenskrig.- Det her kan ende i en tredje verdenskrig. For at være ærlig over for jer. I hører nu, at Europa siger: "Tja, vi tror, vi bliver nødt til at gå ind," og pludselig ender vi i en tredje verdenskrig over noget, der aldrig burde være sket. Det er en meget trist situation, sagde Trump til den fremmødte presse.Del artikelDelFacebookXE-mailLinkKopiérSe ogsåTrump kritiserer Ukraine for krigen – "I skulle aldrig have startet den"Rusland tog stikket hjem ved forhandlingsbordet – nu har Zelenskyj én stor opgaveUkraines skæbne ligger i hænderne på Trump – hvad er det værste, der kan ske?'
