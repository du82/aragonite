full_description = "Kl. 22.23Demonstranter i protest mod Vance og Musk i to delstaterDemonstranter samlede sig lørdag i Waitsfield i den amerikanske delstat Vermont, hvor den amerikanske vicepræsident J. D. Vance holder skiferie.Demonstrationen kom dagen efter konfrontationen mellem Vance og USA's præsident Donald Trump på den ene side og Ukraines præsident Volodymyr Zelenskyj på den anden under et møde i det Hvide Hus i Washington.Det skriver The Guardian.Samtidig var der også demonstration ved Space X's hovedkvarter i det sydlige Californien. Det er Elon Musk, der står bag Space X.Del opslagDelFacebookXE-mailLinkKopiér Kl. 20.38Norsk olieselskab nægter at sælge olie til USA Det uafhængige norske rederi og olieselskab Haltbakk Bunkers nægter nu at levere olie til USA så længe Donald Trump er præsident. Det skriver det norske medie Kystens Næringsliv.Selskabets ejer Gunnar Gran hylder på selskabets Facebook-side den ukrainske præsident Volodymyr Zelenskyj.- Stor ære til Ukraines præsident for at forblive rolig og behersket selv om USA dolkede ham i ryggen på tv. Det gav os kvalme. Kort og godt, skriver han.- Vi vælger selv vores kunder, skriver Gran videre.Del opslagDelFacebookXE-mailLinkKopiér Kl. 17.30Forsvarsminister sender op til 3000 soldater og kampvogne til USA's grænser mod syd USA's forsvarsminister Pete Hegseth har beordret yderligere 2500-3000 soldater til USA's grænser mod syd.Det skriver Washington Post.Det drejer sig blandt andet om soldater fra en motoriseret brigade, som er udstyret med kampvogne.Del opslagDelFacebookXE-mailLinkKopiér Kl. 09.20Pentagon beder ansatte om at redegøre for arbejdsindsatsDet amerikanske forsvarsministerium, Pentagon, beder nu alligevel sine medarbejdere om i fem punkter at gøre rede for, hvad de har udrettet i den foregående uge.Notatet, der er underskrevet af forsvarsminister Pete Hegseth, kommer efter flere dages forvirring over, hvorvidt offentligt ansatte behøvede at svare på en e-mail sendt sidste weekend fra USA's kontor for personaleledelse, OPM.Det var lederen af Trump-administrationens effektiviseringsenhed, DOGE, Elon Musk, der i et opslag på X skrev, at alle offentligt ansatte ville modtage sådan en mail.Her lød det desuden, at manglende svar ville blive betragtet som en opsigelse.Efterfølgende oplyste kontoret for personaleledelse dog, at medarbejdere ikke ville blive afskediget, hvis de undlod at besvare mailen.Mailen er blevet sendt til i alt 2,3 millioner offentligt ansatte. Pentagon har cirka 950.000 ansatte.Del opslagDelFacebookXE-mailLinkKopiér"
