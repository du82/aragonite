["https://nyheder.tv2.dk/udland/2025-03-02-popfaenomen-tager-de-stoerste-priser-ved-britisk-musikfest"]
title = "Popfænomen tager de største priser ved britisk musikfest - TV 2"
description = "Charli XCX havde en travl aften ved Brit Awards, hvor hun fem gange var på scenen for at modtage en pris."
full_description = '''UdlandPopfænomen tager de største priser ved britisk musikfestCharli XCX havde en travl aften ved Brit Awards, hvor hun fem gange var på scenen for at modtage en pris.Charli XCX var fem gange oppe på scenen for at modtage en pris ved lørdagens Brit Awards. Foto: Isabel Infantes / Ritzau Scanpix I dag kl. 05.26RitzauPopsangeren Charli XCX blev den store vinder ved den britiske musikindustris prisfest, Brit Awards, der foregik lørdag i O2 Arena i London.Det skriver flere britiske medier, herunder Reuters og BBC.Her vandt den 32-årige popartist, der går under det borgerlige navn Charlotte Emma Aitchison, fem priser.Hendes album 'Brat', der udkom sidste sommer, blev belønnet med prisen for Årets Album.Limegrønt tema smittede af på amerikansk valgkampIfølge Reuters inspirerede den 32-årige popartist et popkulturelt fænomen med albummet, og i starten af februar vandt hun tre Grammys for 'Brat' og singlen 'Guess'.Fænomenet 'brat summer' bredte sig over sociale medier og fremhævede ifølge The Guardian, at unge kvinder gerne vil leve "beskidt, lykkeligt og uden bh".Se ogsåKamala Harris rider på en bølge af succes, men hvad sker der, når det bliver grimt?Albummets limegrønne tema blev brugt af den daværende amerikanske præsidentkandidat og tidligere vicepræsident Kamala Harris i hendes valgkampagne.Dedikerede prisen til andre kunstnereCharli XCX satte sig lørdag aften desuden på priserne for Årets Artist, Bedste Danseoptræden og Årets Sang for 'Guess', som amerikanske Billie Eilish optræder på.På scenen fortalte Charlie XCX ifølge Reuters, at hun føler sig som et levende bevis på, at man ikke skal gå på kompromis med sig selv.- Jeg vil gerne dele den her (pris, red.) med alle artister, som nogensinde har følt, at de er nødt til at gå på kompromis for at blive anerkendt og for at få deres øjeblik i rampelyset, sagde hun.Prisen for Årets Sangskriver blev uddelt tidligere på ugen, og også denne vandt Charlie XCX.Hyldest til Liam PayneAmerikanske Chappell Roan vandt Årets Internationale Artist, og hendes single 'Good Luck, Babe!' vandt Årets Internationale Sang.'Espresso'-sangeren Sabrina Carpenter modtog prisen for global succes. Den samme pris har Adele, Ed Sheeran, Sam Smith og One Direction vundet før hende.Se ogsåBritisk stjerne til Roskilde Festival efter aflysningPrisuddelingen indeholdt også en hyldest til den tidligere One Direction-sanger Liam Payne, som døde i oktober efter at være faldet fra et hotelværelses balkon på tredje sal i Buenos Aires i Argentina.Brit Awards er en prisuddeling, der har eksisteret siden 1977 og hylder britisk og international popmusik.Del artikelDelFacebookXE-mailLinkKopiér'''
