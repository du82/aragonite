["https://nyheder.tv2.dk/business/2025-02-18-zirkus-nemo-erklaeret-konkurs-med-bloedende-hjerte"]
title = 'Zirkus Nemo erklæret konkurs med "blødende hjerte" - TV 2'
description = "Søren Østergaard forklarer, at Zirkus Nemo er gået konkurs efter corona og en våd sommer, som gav vandskade."
full_description = 'BusinessZirkus Nemo erklæret konkurs med "blødende hjerte"Søren Østergaard forklarer, at Zirkus Nemo er gået konkurs efter corona og en våd sommer, som gav vandskade.Skuespiller og ejer af Zirkus Nemo, Søren Østergaard. (Foto: Mads Claus Rasmussen/Ritzau Scanpix) Foto: Mads Claus Rasmussen / Ritzau Scanpix 18. feb kl. 12.25RitzauZirkus Nemo er blevet erklæret konkurs.Det oplyser Søren Østergaard, som står bag cirkusset, i en pressemeddelelse.- Det er med blødende hjerte, vi meddeler, at Zirkus Nemo er blevet erklæret konkurs, lyder det i meddelelsen.Søren Østergaard forklarer, at konkursen blandt andet skyldes økonomiske efterveer fra corona.Dertil kom en våd sommer, som førte til alvorlige vandskader, lyder det.I selskabets seneste regnskab fremgår det, at det havde et underskud på 869.000 kroner i 2022/2023. I det foregående regnskabsår lød underskuddet på knap 1,6 millioner kroner.I regnskabet for 2022/2023 fremgår det desuden, at Zirkus Nemo havde en negativ egenkapital på lidt over tre millioner kroner.Telt kunne ikke rejses på grund af regnI regnskabet lyder det, at selskabets cirkusaktiviteter har været præget af eftervirkninger fra coronarestriktioner og udfordringer i forbindelse med opstart efter nedlukning.Det har betydet, at antallet af solgte billetter ikke nåede samme niveau som før corona, skriver ledelsen i regnskabet.I det seneste fulde regnskabsår, før coronapandemien førte til nedlukning og restriktioner, havde selskabet ellers overskud. I 2018/2019 tjente Zirkus Nemo således knap 685.000 kroner.Zirkus Nemo er startet af skuespiller og entertainer Søren Østergaard og journalist og vært Anders Lund Madsen i 1999.Selskabet er i dag ejet af Søren Østergaard.I foråret 2024 måtte Zirkus Nemo flytte årets forestilling fra Langelinie i Horsens til Vestre Engvej i Vejle.Det skyldtes, at der var kommet så meget regn, at det ikke var muligt på forsvarlig vis at rejse cirkusteltet på den bløde jord.I 2024 markerede cirkusset sit 25-års jubilæum med en jubilæumsforestilling.Her kunne publikum ifølge hjemmesiden opleve gamle kendinge som Målermanden, Marianne, Baglænsmanden, Bager Jørgen, Smadremanden og mange flere.Del artikelDelFacebookXE-mailLinkKopiér'
year_published = 2025
