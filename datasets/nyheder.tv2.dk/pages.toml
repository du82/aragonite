["https://nyheder.tv2.dk/business/2025-02-18-arla-tjener-milliarder-derfor-stiger-prisen-paa-maelk-saa-voldsomt"]
title = "Arla tjener milliarder – derfor stiger prisen på mælk så voldsomt - TV 2"
description = "Geopolitisk uro, afgifter og usikkerhed har betydning for mælkeprisen, siger Arlas topchef."
full_description = 'BusinessArla tjener milliarder – derfor stiger prisen på mælk så voldsomtGeopolitisk uro, afgifter og usikkerhed har betydning for mælkeprisen, siger Arlas topchef.Mejerigiganten Arla solgte for mere end 100 milliarder sidste år. Foto: Thomas Traasdahl / Ritzau Scanpix 19. feb kl. 09.28Mikkel Walentin MortensenMælkegiganten Arla fortsætter med at tjene milliarder.Det står klart, efter at selskabets seneste regnskab er blevet offentliggjort onsdag morgen. Her kan man læse, at bundlinjen for 2024 er et overskud på 401 millioner euro – tre milliarder danske kroner – hvilket nærmest er identisk med resultatet for 2023 og 2022.Arlas milliardoverskud er kommet samtidig med, at mælkeprisen er skudt i vejret og klart løbet fra den generelle inflation i samfundet.Men Arla afviser at skumme fløden. I stedet kalder mejerigiganten de stigende priser for et resultat af øget usikkerhed og global mangel på mælk.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Langt over gennemsnittetUanset hvordan man kigger på det, er mælk blevet dyrere i Danmark de seneste år.Siden 2015 er priserne i samfundet bredt set steget med 20 procent, men i samme periode er frisk mælk blevet 87 procent dyrere. Det viser tal fra Danmarks Statistik.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Som landets suverænt største mejerivirksomhed – og én af de største spillere på det globale marked for mælk – er det ikke uden betydning, hvor meget Arla betaler sine mælkeproducenter. Derfor har det også skabt overskrifter, når Arlas mælkepris i 2024 var på sit næsthøjeste niveau nogensinde – kun overgået af 2022.Men kunderne skal ikke forvente, at prisen i køledisken falder i den kommende tid, siger Arlas direktør, Peder Tuborgh, til TV 2:- Der er større efterspørgsel efter mælk og mejeriprodukter, end der egentlig er mælk til rådighed, og så sker der det helt naturlige, at priserne går op. Det har vi også set i år.Se ogsåWegovy kan ændre varerne i dit supermarked – industrien holder øjeStorpolitik i kostaldenMælkechefen peger på en række faktorer, der får prisen i såvel Danmark som resten af verden til at stige:Dels har efterspørgslen på mælk været større end udbuddet i 2024. Her vil høje priser have en naturligt afdæmpende effekt, fremgår det af Arlas årsregnskab. Samtidig rammer geopolitiske usikkerheder ned helt inde i de danske kostalde.- Jeg ville ønske, at det var muligt for landmændene at producere mere mælk, men det kræver investeringer. Og når man investerer, kan man godt lide at kunne se 30 år ud i fremtiden, inden man optager et lån. Sådan er det for private, der skal købe et hus, og for landmænd. Men de kan altså ikke se 30 år ud i fremtiden, som det ser ud lige nu, siger Peder Tuborgh.Følger verdensmarkedetSelvom Arla er Danmarks største mejeri, er man nødt til at følge verdenspriserne, fortæller Henning Otte Hansen, der er seniorrådgiver ved Institut for Fødevare- og Ressourceøkonomi på Københavns Universitet:- Verdensmarkedet er under pres med høje mælkepriser generelt set. Arla må følge de globale priser, da de har en stor del af deres salg globalt.Se ogsåDet er billigere at producere ny fløde, erkender ArlaUdover geopolitisk uro kan også høje udgifter til energi og fragt få mælkeprisen til at vokse yderligere, mener seniorrådgiveren, der sidste år udgav en bog om megatrends i landbrugs- og fødevaresektoren.- Landmændene spørger sig selv: Tør vi virkelig investere med 30 års sigt med så mange usikkerheder? Særligt klimadebatten og afgifter på metan bringer køerne i fokus og giver usikkerhed, siger han.Topchef afviser priskritikIkke desto mindre har debatten om prisen på mælk og mejeriprodukter kørt flere gange de seneste år.I 2022 satte erhvervsminister Simon Kollerup (S) gang i et pristjek af blandt andet smør, der var dyrere i Danmark end i sammenlignelige lande. Konkurrence- og Forbrugerstyrelsen fandt ikke anledning til at kritisere Arla eller andre for at skrue priserne på produkter kunstigt højt op, men i efteråret stod Arla igen i blæst omkring sine priser.Se ogsåForbrugerstorm mod nye skruelåg: - Jeg er tosset over det og irriteretHer kom det frem, at Salling Group – der står bag Netto, Føtex og Bilka – ville droppe en række Arla-produkter, fordi de ikke kunne ”forstå” Arlas priser.Men Peder Tuborgh afviser kritikken.- Der var en hændelse sidste år, der ikke har noget med den generelle prisudvikling at gøre. Der er altid lidt armlægning, men det lander som regel altid fint, og det har det også gjort i det her tilfælde. Men det er et globalt fænomen, og det er ikke kun Arla Foods, der har haft et rigtig godt år.Del artikelDelFacebookXE-mailLinkKopiér'
year_published = 2025
year_updated = 2025
