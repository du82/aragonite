["https://nyheder.tv2.dk/business/2025-01-06-biogas-gigant-i-aaben-intern-magtkamp-der-stikker-mere-under-den-her-konflikt-siger-ekspert"]
title = 'Biogas-gigant i åben intern magtkamp – der "stikker mere under den her konflikt", siger ekspert - TV 2'
description = "Stridighederne bunder i større ting, end offentligheden kender til, mener ekspert."
full_description = '''BusinessBiogas-gigant i åben intern magtkamp – der "stikker mere under den her konflikt", siger ekspertStridighederne bunder i større ting, end offentligheden kender til, mener ekspert. BioCirc omsatte i 2023 for 1,1 milliard kroner og har flere end 3000 ansatte. Foto: TV 2 Grafik / Ulla Skov 8. jan kl. 11.57Opdateret 20. feb kl. 13.12Emil Øgaard HelligsøBiogas-koncernen BioCirc går til dagligt med ambitionen om at blive verdens største biogasproducent, men december og starten på det nye år har mildest talt været tumultarisk for virksomheden.Bestyrelsen bag den danske milliardvirksomhed, der tæller mere end 300 ansatte, har ladet offentligheden følge med i en åben krig.En krig med en direktør, der blev fyret, men havde magten til at blive. Alt imens dem, der havde stemt for fyringen, kunne se frem til at blive afsat.Jeg forestiller mig, at der er stikker mere under den her konflikt, end vi i offentligheden er vidner tilPer Nikolaj Bukh, Professor i Økonomistyring, Aalborg UniversitetNu har de valgt at 'begrave stridsøksen', skriver virksomheden. Men inden de nåede så langt, kostede det hoveder i bestyrelsen.Og nu rejser et spørgsmål sig:Hvordan skal BioCirc komme videre fra det interne kaos?Se ogsåLandsby frygter 214 lastbiler i døgnet og en forfærdelig stankKaosramt biogas-koncernBioCirc er en dansk biogasvirksomhed i milliardstørrelsen, der producerer grøn energi på otte biogasanlæg i landet. Derudover har de fem såkaldte energiklynger, der kombinerer en bred vifte af energikilder, heriblandt sol, vind og biogas.Men selvom projektet lyder godt, har Finans beskrevet, hvordan forhold omkring ledelsesstilen bidraget til, at tilliden til direktøren er væk.Senest har det har fået bestyrelsesmedlemmer til at trække sig – 6. januar i år kom det frem, at DLG har valgt at trække sine to medlemmer fra BioCircs bestyrelse, ligesom nu tidligere bestyrelsesformand, Michael Haaning, i et opslag på LinkedIn kunne fortælle, at han også træder ud af bestyrelsen for BioCirc.Dermed blev BioCircs bestyrelse mandag næsten halveret fra syv medlemmer til fire.Overblik over BioCircs interne stridigheder I begyndelsen af december startede blev bestyrelsen i BioCirc gjort opmærksomme på problematiske forhold ved direktør Bertel Maigaards ledelsesstil. Daværende bestyrelsesformand Michael Haaning krævede oplysningerne undersøgt ved en intern undersøgelse. Undervejs følte bestyrelsen angiveligt, at undersøgelsen blev modarbejdet af Bertel Maigaard selv og hans kompagnon Claus Molbech Bendtsen. Natten til den 31. december kom det frem i en besked, at et flertal i bestyrelsen vælger at fyre direktør Bertel Maigaard og igangsætter en advokatundersøgelse. Den 1. januar kom BioCirc med en pressemeddelelses, hvor de skriver, at Bertel Maigaard ikke på nogen måde var opsagt. Den 2. januar skriver BioCirc i en pressemeddelelse, at de bestyrelsesmedlemmer, der stemte for fyringen af Bertel Maigaard, vil blive afsat ved en ekstraordinær generalforsamling den 24. januar. Den 5. Januar skriver BioCirc, at Claus Molbech Bendtsen bliver ny bestyrelsesformand og direktør Bertel Maigaard, der få dage forinden var blevet fyret, også bliver fremtidig næstformand. Den 6. januar meddeler DLG, at de trækker deres to bestyrelsesmedlemmer fra BioCirc, ligesom Michael Haaning trækker sig som bestyrelsesformand. Ligeledes skriver BioCirc, at de har begravet stridsøksen for at kunne se fremad. Kilde: Finans og BioCirc Professor i økonomistyring ved Aalborg Universitet, Per Nikolaj Bukh, har dog svært ved at tro på, at sagen kun handler om ledelsesstilen, som er den officielle årsag til stridighederne og faldende hoveder i bestyrelsen.- Jeg tvivler på, at man igangsætter en undersøgelse udelukkende baseret på en mindre god ledelsesstil. Jeg forestiller mig klart, at der stikker mere under den her konflikt, end vi i offentligheden er vidne til, siger Per Nikolaj Bukh.Med det henviser Per Nikolaj Bukh til, at bestyrelsen igangsatte en advokatundersøgelse ved Kromann Reumert, efter de natten til 31. december meddelte, at de havde besluttet at fyre direktør Bertel Maigaard.Per Nikolaj Bukh mener, at det er usædvanligt at lave en advokatundersøgelse udelukkende på baggrund af problematiske forhold omkring ledelsesstil.Har "gentagne gange" forsøgt at skabe enighedDerudover opfatter Per Nikolaj Bukh, at fyringen af en direktør, der sidder med afgørende bestemmelse i bestyrelsen, er et tegn på, at det ikke kun handler om ledelsesstil. Derfor kommer det heller ikke bag på ham, at bestyrelsesmedlemmer falder fra.Heriblandt er DLG, der skriver i en pressemeddelelse, at de trækker sine to bestyrelsesmedlemmer fra BioCircs bestyrelse, fordi de ikke har den fornødne tillid til BioCircs forvalter i form af virksomheden Maigaard og Molbech II ApS.Det er klart, at kommunen har en klar forventning om, at der kommer en redegørelse for, hvad de her stridigheder bunder i.Jakob Vium Dyrman (V), formand for Klimaudvalget, Vesthimmerland KommuneDe skriver, at de gentagne gange forgæves har forsøgt at skabe enighed om god ledelse omkring BioCirc. TV 2 har været i kontakt med DLG, der refererer til pressemeddelelsen og ikke vil kommentere yderligere på sagen.DLG formidler kontrakter mellem BioCirc og landmænd, og her tilføjer Mette Sehested, der er kommunikationsdirektør for DLG, at de fortsat vil overholde deres juridiske forpligtelser overfor BioCirc, men at de for nuværende ikke kommer til at udvide samarbejdet.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); En fremtid ud af kaosset?Efter interne stridigheder til åbent skue i offentligheden, lader det nu til, at BioCirc-bestyrelsen har samlet sig, og som de selv formulerer det, 'har begravet stridsøksen'.Direktør Bertel Maigaard udtaler i pressemeddelelsen, at han erkender, at hans ambitioner og passion har bidraget til frustration for medarbejdere. Derudover kommer det frem, at virksomheden vil hyre en ledelsescoach.Ifølge Per Nikolaj Bukh, ligger der intet til hinder for, at virksomheden skulle komme videre, uden at være blevet decideret skadet af den seneste tids skærmydsler.Se ogsåKommuner shopper kinesiske elbiler trods advarsel fra Mette FUnder hele forløbet har det nemlig været den omdiskuterede direktør, Bertel Maigaard, og hans kompagnon Claus Molbech Bendtsen, der har haft den afgørende indflydelse, fordi de som følge af selskabskonstruktionen bestemmer, hvordan bestyrelsen skal sammensættes.Og det har de altså fortsat, eftersom Bertel Maigaards fyring ikke blev effektueret.- Når der bliver indsat nye bestyrelsesmedlemmer, må man have en formodning om, at de bakker op om ledelsen og den ledelsesstil, der udrettes fremover, udtaler Per Nikolaj Bukh.Politikerne følger sagen tætI kommunerne, hvor BioCircs anlæg holder til, følger politikerne nøje med i sagen. I Viborg Kommune har næstformanden for Klimaudvalget set til, mens BioCircs uenigheder har raset.- Det lyder selvfølgelig ikke godt, når man ser deres modsigende pressemeddelelser, siger Kurt Mosgaard (V), næstformand i Klima- og Miljøudvalget i Viborg Kommune, til TV 2.Mens kommunen stadig støtter projektet, mener Kurt Mosgaard, at kommunen er opmærksom på, hvem der står bag de virksomheder, kommunen samarbejder med, og at de er i takt med kommunens værdier. Han er dog positiv overfor det samarbejde, de har ude på biogasanlæggene.Se ogsåVores naturgasforbrug fortsætter med at faldeOgså i Jammerbugt Kommune følger formanden for Teknik- og Miljøudvalget med i BioCirc-miseren.- Vi har en forventning om, at de løser de interne forhold, så der er en sikker hånd på rattet i forhold til de projekter, der er i gang i kommunen, siger Niels Christian Hem (V).Manden i spidsen for Klimaudvalget i Vesthimmerlands Kommune forventer en afklaring.- Jeg er sikker på, at der kommer en redegørelse for, hvad de her stridigheder bunder i, udtaler Jakob Vium Dyrman (V), formand for Klimaudvalget i Vesthimmerland Kommune til TV 2.Og det er ikke usandsynligt, at kommunerne vil blive inviteret til en kop kaffe, mener Per Nikolaj Bukh.- Når uroen har lagt sig, vil de have en klar interesse i at invitere ud på et besøg for at vise, at alt kører som det skal, og at kommunen ikke har noget frygte, udtaler professoren i økonomistyring.TV 2 har forsøgt at få en kommentar fra BioCirc, men de er ikke vendt tilbage henvendelsen.Del artikelDelFacebookXE-mailLinkKopiér'''
