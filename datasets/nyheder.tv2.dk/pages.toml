full_description = "SamfundVej er forsvundet efter jordskredBåde vand og strøm gik, da jorden pludselig skred og fjernede en vej ved Sdr. Felding.Udarbejdet af TV MidtvestVej er forsvundet efter jordskredVej er forsvundet efter jordskredI går kl. 13.12Her har de for meget varme - det kan 'gaskommunen' måske drage nytte afHer har de for meget varme - det kan 'gaskommunen' måske drage nytte afI går kl. 19.47En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.I går kl. 19.18Salling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.Salling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.I går kl. 19.17Tre grise stjålet fra kontroversiel udstilling i KøbenhavnTre grise stjålet fra kontroversiel udstilling i KøbenhavnI går kl. 17.35Politiet afspærrer yderligerePolitiet afspærrer yderligereI går kl. 14.14Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.I går kl. 13.42Politi er ikke længere massivt til stedePoliti er ikke længere massivt til stedeI går kl. 06.57Orange varevogn fjernes fra gerningsstedOrange varevogn fjernes fra gerningsstedI går kl. 06.46Fabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske statFabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske stat28. feb kl. 14.56Kendt frisør blev afvist som barnKendt frisør blev afvist som barn28. feb kl. 13.34Kig mod Europa, siger lektorKig mod Europa, siger lektor28. feb kl. 12.49 I går kl. 13.33 Alexandra Lund Lysgaard TV MidtvestEn vej er pludselig forsvundet efter et jordskred i et skovområde ved Sdr. Felding syd for Herning.- Det ser voldsomt ud. Nogle steder er det sunket fire til fem meter ned, og det har taget både vand og strøm, fortæller Bjarke Bakkegaard Gamst, som ejer jorden og bor tæt derpå.Det er ikke første gang, det er sket. Også i 2004 skred jorden pludselig i området. Dengang var det Bjarke Bakkegaard Gamsts far, der ejede den, og kommunen spærrede området på ubestemt tid.Siden er der blevet åbnet op igen, og området er nu et yndet mål til gå- og cykelture.- Det er bare skov og søer, men nu er det spændende, hvor meget sø der er tilbage, siger Bjarke Bakkegaard Gamst. Foto: TV MIDTVESTJordskredet skete fredag formiddag, og ingen er kommet til skade i forbindelse med det.Gamle kulgraveDet nye jordskred er sket godt 20 år efter det første skred, og det er ikke usædvanligt i netop det område.- Det er gamle kulgrave, hvor vejen er lavet på sandopbygning. Tidligere målinger og boringer har vist, at det kan ske igen, men ingen havde regnet med, at det ville ske så hurtigt, siger Bjarke Bakkegaard Gamst.Da det er et sted, som folk ofte går tur, er der nu sat en afspærring op 500 meter før selve jordskredet. Bjarke Bakkegaard Gamst opfordrer folk til ikke at gå i området på nuværende tidspunkt.- Der er ingen adgang, og det håber vi, at folk vil respektere. Det er set før, at der kan ske jordskred igen kort tid efter, når det første skred har sat sig.Det var Bjarke Bakkegaard Gamst oldefar, som var den første til at bygge i området i 1911. Siden er det blevet i familien, og i 2020 overtog Bjarke selv. Hans forældre bor der stadig.Del artikelDelFacebookXE-mailLinkKopiérUdarbejdet af TV MidtvestSe ogsåSlagter til kamp mod kæmpebøde: - Det er noget hysteri33-årig kørt på skadestuen efter uheldTivoli-legende har fået særlig hyldest"
