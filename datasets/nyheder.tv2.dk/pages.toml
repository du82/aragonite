["https://nyheder.tv2.dk/udland/2025-03-01-muligt-nyt-sexoffer-medvirkede-i-diddys-eget-realityshow"]
title = "Muligt nyt sexoffer medvirkede i Diddy's eget realityshow - TV 2"
description = "Kvinde bag nyt søgsmål medvirkede i programmet 'I Want to Work for Diddy', hvor håbefulde deltagere kæmpede for at blive stjernens højre hånd."
full_description = '''UdlandMuligt nyt sexoffer medvirkede i Diddy's eget realityshowKvinde bag nyt søgsmål medvirkede i programmet 'I Want to Work for Diddy', hvor håbefulde deltagere kæmpede for at blive stjernens højre hånd.Et andet civilt søgsmål mod Sean "Diddy" Combs, der også inkluderede anklager mod rapperen Jay-Z, er for nyligt blevet nedlagt, efter det påståede offer erkendte, at der var "huller" i hendes historie (arkivfoto). Foto: Eric Thayer / Scanpix Denmark I går kl. 19.17Sebastian Juel EblingFredag blev der rejst fire nye civile søgsmål mod den indflydelsesrige musiker og producer Sean 'Diddy' Combs.En af sagsøgerne hævder at have været udsat for et seksuelt overgreb fra Diddy, mens hun var deltager i et realityprogram, hvor han var hovedpersonen.Diddys advokater udtaler, at der er tale om opportunister, der forsøger at få penge ud ad den 55-årige rapstjerne.'I Want to Work for Diddy'I alt fire nye sager mod Sean Diddy Combs blev rejst mod rapperen fredag. Det skriver flere amerikanske medier på baggrund af retsdokumenter – herunder The New York Times.Sean 'Diddy' Combs er i forvejen – foruden utallige andre civile søgsmål – anklaget for blandt andet afpresning, organiseret kriminalitet, manipulation af vidner, menneskehandel, trusler og voldelige overgreb.Hvad er et civilt søgsmål? Civilt søgsmål: En sag mellem private parter. Det kan være en person eller virksomhed, der sagsøger en anden part for at få en økonomisk erstatning eller for at få indført et påbud. Bevisbyrden er lavere end ved en straffesag og kræver kun, at "noget er mere sandsynligt end ikke" ("preponderance of the evidence"). Føderal straffesag: En sag anlagt af staten mod en person, der er anklaget for at have begået en forbrydelse. Bevisbyrden er højere og kræver bevis "beyond a reasonable doubt" (uden for enhver tvivl). Mulige straffe inkluderer fængsel, bøder eller en betinget fængselsdom. En af de nye fire sagsøgere er en kvinde, der tidligere har medvirket i to episoder af Sean Diddy Combs eget realityshow kaldet 'I Want to Work for Diddy' (Jeg vil arbejde for Diddy, red.).Se ogsåJay-Z glæder sig over, at "useriøse, fiktive og forfærdelige anklager" mod ham er droppetI programmet forsøgte håbefulde assistenter at imponere den krævende Diddy for at sikre sig en stilling som hans højre hånd. Kvinden bag søgsmålet er krediteret for at have optrådt i to episoder, skriver The New York Times.Kvinden hævder, at hun omkring 2008, det samme år som showet blev optaget, var til en fest i SoHo-området på Manhattan i New York, hvor Combs også var til stede.Det mulige offer beskriver i søgsmålet, at hun modtog en drink, hvorefter hun begyndte at føle sig utilpas.En mand og tre kvinderDa hun senere vågnede op i det hus, hvor castet til showet boede, var hun overbevist om, at hun var blevet voldtaget, skriver det amerikanske medie VICE.Hun hævder også, at Sean 'Diddy' Combs forsøgte at tvinge hende til oralsex, inden hun mistede bevidstheden.Kvindens sag er én af i alt fire nye søgsmål, der alle er rejst samme dag.I en anden af de civile sager hævder en mand, at han i 1999 mødte Diddy på et natklub, hvor rapstjernen gav ham alkohol og stoffet ecstasy (MDMA), hvorefter han blev voldtaget af rapstjernen på et af natklubbens toiletter.Se ogsåSucces, sex og sammenbrud – historien om Sean 'Diddy' Combs' fald fra toppenDe øvrige to sager omhandler begge kvinder, der fortæller lignende historier om, at de modtog en drink fra enten Diddy selv, eller nogen fra hans omgangskreds, hvorefter de blev udsat for seksuelle overgreb.Diddy har via sine advokater afvist alle anklagerne, som beskrives som "endnu en af de mange, falske anklager".- Uanset hvor mange søgsmål, der bliver anlagt, ændrer det ikke på, at Mr. Combs aldrig har begået seksuelle overgreb eller deltaget i menneskehandel – hverken mod mænd eller kvinder, voksne eller mindreårige. Vi lever i en verden, hvor enhver kan anlægge et søgsmål af hvilken som helst grund, lyder det i en udtalelse fra stjernens advokater.Andet søgsmål blev nedlagtFor få uger siden blev et andet søgsmål mod Diddy, der også inkluderede rapstjernen Jay-Z, droppet af sagsøgeren selv.Det skete efter, at hun selv fortalte, at der var "huller" i hendes vidneforklaring.- Den traumatiske oplevelse, som min kone, mine børn, mine nærmeste og jeg selv har gennemgået, vil aldrig forsvinde udtalte Jay-Z, der har det borgerlige navn Shawn Carter.Sagen var rejst af advokaten Tony Buzbee, sammen med mere end 100 andre sager mod Sean 'Diddy' Combs.De fleste af de civile søgsmål er rejst på baggrund af en lov kaldet Victims of Gender-Motivated Violence Protection Law (lov om beskyttelse af ofre for kønsmotiveret vold, red).Se også120 står klar til at sagsøge Sean ”Diddy” Combs for seksuelle overgrebEn ændring af denne lov i 2022 skabte et midlertidigt vindue, hvor personer, der mener, at de var ofre for seksuelle overgreb, kunne anlægge civile søgsmål, selv hvis forældelsesfristen for de påståede hændelser var udløbet, skriver The New York Times.Deadline for at indgive søgsmål relateret til loven var fredag – noget som Diddy's advokater også kritiserede.- Det er tydeligt, at opportunister skynder sig at indgive grundløse anklager i sidste øjeblik. Mr. Combs forbliver sikker på, at han vil vinde i retten, lød det i udtalelsen.Den føderale retssag mod Sean 'Diddy' Combs begynder 5. maj i år.Del artikelDelFacebookXE-mailLinkKopiér'''
