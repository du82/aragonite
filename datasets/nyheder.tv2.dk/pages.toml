["https://nyheder.tv2.dk/udland/2025-03-01-hun-tager-praemien-for-mest-ukloge-europaeiske-reaktion-siger-tidligere-topdiplomat"]
title = 'Hun tager præmien for "mest ukloge" europæiske reaktion, siger tidligere topdiplomat - TV 2'
description = "Både Trump og Zelenskyj gik til stålet, siger tidligere ambassadør i USA. Men forholdet mellem de to har ikke været godt længe."
full_description = '''Krigen i UkraineHun tager præmien for "mest ukloge" europæiske reaktion, siger tidligere topdiplomatBåde Trump og Zelenskyj gik til stålet, siger tidligere ambassadør i USA. Men forholdet mellem de to har ikke været godt længe. European Union High Representative for Foreign Affairs and Security Policy Kaja Kallas speaks to the press ahead of the EUs foreign affairs council at the EU headquarters in Brussels on February 24, 2025. (Photo by JOHN THYS / AFP) Foto: John Thys / Ritzau Scanpix I går kl. 20.04Emma Klinker Stephensen & Emil Gjerding NielsonDer har i mange år været dårligt forhold mellem USa's præsident, Donald Trump, og Ukraines præsident, Volodymyr Zelenskyj, og det var fredagens møde mellem de to toppolitikere et bevis på.Det siger Friis Arne Petersen, der har en lang karriere i diplomatiet på sit generalieblad – blandt andet som ambassadør i Tyskland, Kina og USA.Forholdet mellem de to statsoverhoveder bliver svært at reparere nu, lyder det. - De har i mange år haft et dårligt personligt forhold. Der har været ondt blod mellem de to toppolitikere af mange forskellige grunde. Det tror jeg ikke, man kan fjerne, slet ikke efter den her fuldstændige nedsmeltning – fra dem begge to, siger Friis Arne Petersen.Se ogsåEfter 40 minutter og 26 sekunder begik Zelenskyj en stor fejl, siger forhandlingsekspertHan giver begge politikere ansvaret for, at mødet kørte fuldstændig af sporet.- Trump var meget hård ved Zelenskyj, men Zelenskyj var også hård ved Trump. Han (Zelenskyj, red.) siger, at han ikke spiller kort – det bør han ikke sige. Han bør tænke på sit eget lands fremtid og interesser: "Hvordan får jeg den amerikanske præsident til at give mig det, jeg har brug for, altså sikkerhedsgarantier?", lyder det.Kallas var uklog og mindst strategiskDen tidligere ambassadør har også ord med på vejen til EU’s udenrigschef, Kaja Kallas, der fredag aften var ude og bede om en ny leder af den frie verden, som hun skrev på det sociale medie X.- I dag blev det tydeligt, at den frie verden har brug for en ny leder. Det er op til os, europæerne, at påtage os denne udfordring.Se ogsåDe 120 minutter, der rystede verden – hvad ved vi om Zelenskyjs besøg hos Trump? Friis Arne Petersen kalder visse europæiske reaktioner – blandt andre Kallas' – efter Trump og Zelenskyjs møde "meget bekymrende".- Paradoksalt nok er det vores fælles udenrigsminister, som tager præmien for den mest ukloge og mindst strategiske tilgang ved at sige, at vi har brug for en ny leder i den vestlige verden, siger han.Han sammenligner tilgangen med Trumps egen strategi.- Det fremmer ikke Europas rolle i forhold til USA. Hvis vi skal have en rolle – EU sammen med USA og Ukraine – i en fredsforhandling mod eller med Rusland, skal vi tilkæmpe os det. Vi skal tale os ind i det univers, Trump opererer i, og ikke "fyre" ham, siger han og tilføjer:- Hvem skulle den nye leder være?Nye toner overfor EuropaFriis Arne Petersens opfordring er, at Europa bør udvise varsomhed med at tage alt for meget afstand til USA nu.Han tror heller ikke, at "USA er kommet helt over på Ruslands side", sådan som nogle frygter, siger han. Trump er tværtimod meget opmærksom på, at han ikke skal være i den ene eller anden lejr – altså hverken i den russiske eller ukrainske.- Og det er selvfølgelig også nyt for Europa, siger Friis Arne Petersen.Se ogsåZelenskyj modtager europæisk støtte efter møde med TrumpDet bør de europæiske ledere huske på, når de lørdag og søndag er til møde i Storbritannien, siger han.- Det, der er på spil for Europa i weekendens møder, er, at vi ikke kommer til at ofre for meget af vores meget lange strategiske militære samarbejde, lyder det.Del artikelDelFacebookXE-mailLinkKopiér'''
year_published = 2025
year_updated = 2025
