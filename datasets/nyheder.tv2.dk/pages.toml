["https://nyheder.tv2.dk/politik/2025-02-20-kinesiske-droner-skal-ikke-flyve-i-danmark-siger-ordfoerer"]
title = "- Kinesiske droner skal ikke flyve i Danmark, siger ordfører - TV 2"
description = "Myndighederne skal tænke sig grundigt om, når de køber fra Kina, siger minister."
full_description = '''Politik- Kinesiske droner skal ikke flyve i Danmark, siger ordførerMyndighederne skal tænke sig grundigt om, når de køber fra Kina, siger minister. Flere partier udtrykker bekymring ved kommunernes brug af droner fra Kina. Foto: Mikkel Friis Andersen / Tv 2 Grafik 21. feb kl. 17.45Emil Vincent Sarrouw JensenFlere af Folketingets partier kalder på handling, efter at TV 2 torsdag kunne fortælle, at danske kommuner køber droner fra Kina i stor stil.Det er stærkt bekymrendeAnne Valentina, beredskabsordfører, SFOrdførere fra Dansk Folkeparti, Enhedslisten og SF udtrykker deres bekymring og efterlyser tydelige retningslinjer på området.- Man tager sig nogle gange til hovedet. De kan åbenbart ikke finde ud af det ude i kommunerne, så derfor må vi andre træde til og lovgive på området, siger Dansk Folkepartis forsvarsordfører, Alex Ahrendtsen, til TV 2 og fastslår:- Kinesiske droner skal ikke flyve rundt i Danmark.I alt har 71 kommuner købt 223 droner fra Kina.Samtlige droner stammer fra den kinesiske producent DJI, der er bandlyst af statslige myndigheder i USA.Danske eksperter påpeger, at der kan være en sikkerhedsrisiko, hvis dronerne bruges forkert, eksempelvis hvis de kommer i nærheden af kritisk infrastruktur.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Sådan har vi gjort TV 2 har spurgt samtlige 98 kommuner om deres brug af droner. Ud af dem er 87 vendt tilbage indenfor tidsperioden, og 71 svarer, at de har en eller flere droner fra den kinesiske producent DJI. Samlet bruger kommunerne 223 droner, der er produceret i Kina. Dronerne udfører et hav af opgaver – blandt andet landopmåling, miljøtilsyn, overflyvning af bygninger og andre overvågningsopgaver. TV 2 har dog bedt kommunerne om at se bort fra droner, der bruges til undervisning på skoler og lignende. Kommuner har levet "i deres egen lille boble"SF's beredskabsordfører, Anne Valentina Berthelsen (SF), kalder kommunernes brug af droner fra Kina "stærkt bekymrende".- Vi bør alle tage ansvar for, at vi har sikkerhedspolitiske interesser for øje, også ude i kommunerne, siger hun.Er der så ikke brug for, at I gør mere fra centralt hold?- Der er behov for klarhed om, hvilke hensyn der er vigtigst. Kommunerne er vant til at konkurrere på pris, og der er kinesisk teknologi ofte billig. Der skal vi være opmærksomme på, at andre sikkerhedshensyn også skal varetages. Det er i sidste ende ministerens ansvar at sikre, lyder det fra Anne Valentina Berthelsen.Se ogsåKinesiske droner flyver i stort set alle dele af DanmarkAlex Ahrendtsen fra Dansk Folkeparti er klar til at følge USA's eksempel og forbyde de kinesiske droner.- Jeg tror, vi bliver nødt til at gøre ligesom amerikanerne og lovgive om det. Jeg er bekymret, for kommunerne har åbenbart levet i deres egen lille boble, siger han.Hos Enhedslisten understreger retsordfører Rosa Lund, at det skal fremstå klart, hvordan dronerne må anvendes i kommunerne.- Generelt er det vigtigt, at der er tydelige grænser, når vi taler om droner og overvågning. Både i forhold til hvad der bliver overvåget, hvad det bruges til, og hvor længe det opbevares. Ellers risikerer vi, at data ender i forkerte hænder, siger hun til TV 2.USA har sortlistet dronerne og kalder dem en trussel mod national sikkerhed. Bør det ikke vække mere bekymring herhjemme?- Jeg synes ikke, det er USA, der skal afgøre, hvordan vi gør tingene i Danmark. Center for Cybersikkerhed skal være dem, der vurderer truslen og udarbejder retningslinjerne, siger Rosa Lund.TV 2 har forelagt ovenstående kritik for Kommunernes Landsforening (KL), der ikke ønsker at kommentere.I forbindelse med TV 2s dækning af kommunernes brug af droner gav KL følgende svar:- Når kommunerne køber droner, følger man selvfølgelig de regler og retningslinjer, som de danske myndigheder og EU har udstukket. Hvilke implikationer den globale handels- og sikkerhedssituation har for den offentlige sektors indkøb, er op til Folketinget og de relevante myndighederne at vurdere, lyder det i et skriftligt svar.- Skal tænke sig grundigt om, siger ministerMinister for samfundssikkerhed og beredskab Torsten Schack Pedersen (V) understregede i forbindelse med TV 2s afdækning torsdag, "at både myndigheder og virksomheder skal tænke sig grundigt om".- Der er ingen tvivl om, at med det trusselsbillede, vi ser ind i, så skal man være meget opmærksom på cybersikkerhed, sagde han til TV 2.Torsten Schack Pedersen understreger samtidig, at det især gør sig gældende, når der købes udstyr fra lande som Kina, som Danmark ikke har et sikkerhedspolitisk samarbejde med.Minister for samfundssikkerhed og beredskab Torsten Schack Pedersen (V). Foto: Mads Claus Rasmussen / Ritzau ScanpixMinisteren svarer ikke direkte på, om der skal være klare retningslinjer for brugen af kinesisk teknologi i kommunerne, men henviser til, at ministeriet løbende opdaterer deres anbefalinger til myndighederne.TV 2 har forholdt DJI kritikken, og du kan læse selskabets svar herunder:Svar fra DJIDJI er en privatejet og -kontrolleret virksomhed og har været det siden grundlæggelsen i 2006. Grundlæggeren kontrollerer virksomheden. Ingen regeringsenheder eller repræsentanter sidder i DJIs bestyrelse eller har nogen rolle i dens drift. DJI overholder alle gældende love, regler og standarder for databeskyttelse i alle de regioner, hvor vi opererer. Der har indtil videre ikke været beviser for, at DJI-droner sender følsomme data til uautoriserede parter. Siden 2017 har DJI proaktivt underlagt sine produkter regelmæssige uafhængige sikkerhedsaudits og udvidet rækkevidden af indbyggede brugerprivatlivskontroller i vores forbruger- og erhvervsdroner. Vi giver dronebrugere fuld kontrol over de data, de genererer. Brugere behøver ikke at dele disse data med DJI, og som standard bliver fotos, flyvelogs, videoer og mobildata ikke synkroniseret med DJI. Derudover kan vores kunder flyve vores produkter i Local Data Mode, hvilket betyder, at der ikke er nogen internetforbindelse. I praksis bliver dronen dermed det digitale svar på en air-gapped computer. Del artikelDelFacebookXE-mailLinkKopiér'''
