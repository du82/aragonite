["https://nyheder.tv2.dk/live/business/2025-02-23-overenskomst-paa-transportomraadet"]
title = "Overenskomst på transportområdet - TV 2"
description = "Hvad sker der? 3F Transport og Dansk Industri er søndag blevet enige om en treårig overenskomstaftale på transportområdet, som berører 186.000 ansatte.Aftalen ..."
full_description = "Kl. 16.43Lønstigning vil smitte af på kommende aftalerAftalen er ikke den første, der er landet i OK2025-forhandlingerne. Både ansatte i industrien, finansansatte og butiksansatte har allerede fået deres aftale i hus.Det særlige ved forhandlingerne i transportbranchen er dog, at det er den første aftale, der lander på normallønsområdet.Derfor er der tale om et såkaldt gennembrudsforlig, hvor især lønstigningstaksten vil smitte af på de kommende normallønsaftaler, der i alt gælder op mod 186.000 medarbejdere. Sådan lyder det fra TV 2s arbejdsmarkedskommentator Henny Christensen:- Der vil være masser af andre brancher, der kigger på den takst, og så bliver det den, som også kommer til at dække de områder.Del opslagDelFacebookXE-mailLinkKopiér Kl. 16.22Her er de vigtigste punkter fra pressemødetLønstigninger på mindst 2300 kroner om måneden for en 37-timers arbejdsuge over de næste tre år.Dertil kommer 700 kroner om måneden på grund af en forhøjelse fra 9 til 11 procent til den ansattes fritvalgskonto.Arbejdsgivers indbetaling til pension stiger fra 10 til 11 procent.Stigning i seniorfridage fra 32 til 46 dage om året.Forældre får ret til at holde fri ved barns tredje sygedag, og bedsteforældre får ret til to børnebørns omsorgsdage.Der indføres såkaldte trivselskonsulenter, der skal hjælpe med at forbedre tonen og arbejdsmiljøet og forebygge chikane og konflikter på arbejdspladserne.Del opslagDelFacebookXE-mailLinkKopiér Kl. 16.10Begge parter garanterer reallønsfremgangGruppeformanden for Transportgruppen i 3F, Jan Villadsen, kan godt garantere reallønnen for de medarbejdere, der er omfattet af aftalen. Det siger han til TV 2.- Hvis verden ellers ser ud, som vi regner med om tre år, indskyder han.Det er viceadministrerende direktør i DI, Kim Graugaard, enig i. Med aftalen bliver lønmodtagerne ved med at være sikret reallønsfremgang, ligesom danske virksomheder kommer til at opretholde deres konkurrenceevne, lyder det.Del opslagDelFacebookXE-mailLinkKopiér"
