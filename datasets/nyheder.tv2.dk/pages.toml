["https://nyheder.tv2.dk/live/krimi/2025-03-01-doed-mand-identificeret"]
title = "Død mand identificeret - TV 2"
description = "Hvad sker der? En død mand er blevet fundet i en kloak i Harlev, oplyser Østjyllands Politi. Politiet kan ikke udelukke, at der ligger en forbrydelse bag.Denne..."
full_description = "Kl. 17.49Død mand identificeret Østjyllands Politi har identificeret den døde mand, der fredag blev fundet død i en kloak i Harlev, oplyser Østyllands Politi i en pressemeddelelse.De pårørende er endnu ikke underrettet, og derfor vil politiet ikke oplyse yderligere om ham.Dødsårsagen er endnu ikke fastslået, og politiet mangler svar på en del spørgsmål, som efterforskningen skal afklare.- Det har været et vanskeligt arbejde, og vi har haft brug særligt specialudstyr, Beredskabsstyrelsen og vandværk undervejs. Vi har foretaget en del afhøringer og undersøgelser på stedet, men der mangler stadig en del efterforskningsskridt, før vi kan afdække hændelsesforløbet, siger politiinspektør René Raffo.Del opslagDelFacebookXE-mailLinkKopiér Kl. 14.49Beredskabsstyrelsen bistår Mindst otte medarbejdere fra Beredskabsstyrelsen er til stede for at assistere politiet.Det siger TV 2 Østjyllands Anne Marie Stoustrup Petersen.Der er også tre vogne fra styrelsen på stedet, fortæller hun.Del opslagDelFacebookXE-mailLinkKopiér Kl. 14.03Politiet er fortsat til stede Østjyllands Politi arbejder fortsat på stedet og kommer til at være der noget tid endnu.Det skriver politiet på X.Her lyder det samtidig fra politiet, at der formentlig går noget tid, før de har noget nyt at meddele om sagen.Del opslagDelFacebookXE-mailLinkKopiér Kl. 13.51Udvider afspærringDer er sat en ekstra afspærring op i området ved Edelhoffvej, lyder det fra TV2 Østjyllands reporter på stedet.Konkret er der blevet spærret af ved en pumpestation, hvor politiet også arbejder.Pumpestationen ligger nede af en sidevej til Stillingvej.Del opslagDelFacebookXE-mailLinkKopiér Kl. 13.48Politiet arbejder to steder Ifølge TV2 Østjylland arbejder politiet lørdag eftermiddag to forskellige steder ved området i Harlev. Det ene sted er ved krydset ved Edelhoffvej og Stillingvej, hvor et hvidt telt er blevet sat op. Det er her, at den afdøde mand blev fundet i en kloak. Det andet sted er ved en pumpestation, som ligger cirka 200 meter ned af Stillingvej. Del opslagDelFacebookXE-mailLinkKopiér"
