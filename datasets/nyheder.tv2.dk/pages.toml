["https://nyheder.tv2.dk/samfund/2025-02-28-20-aarig-vil-gerne-flytte-hjemmefra-men-det-er-pissedyrt"]
title = "20-årig vil gerne flytte hjemmefra, men det er ”pissedyrt”  - TV 2"
description = "Der er en markant stigning i andelen af unge, der forbliver boende hos deres forældre. Boligmarkedet er knækket midt over, siger forbrugerøkonom."
full_description = 'Samfund20-årig vil gerne flytte hjemmefra, men det er ”pissedyrt” Der er en markant stigning i andelen af unge, der forbliver boende hos deres forældre. Boligmarkedet er knækket midt over, siger forbrugerøkonom.Drømmescenariet for Nikolaj Steengaard er, at han flytter ind i en lejebolig med sine kammerater – men de vil heller ikke flytte ud. Foto: Privatfoto I går kl. 16.37Berfin ErdemUde godt, men hjemme bedst.Sandra Binau Bendtsen bor hjemme hos sin mor i Albertslund, og selvom den 25-årige i perioder har overvejet at flytte hjemmefra, har det aldrig føltes muligt.- Når jeg kun har én indkomst, og jeg gerne vil have mit eget, så er det bare megadyrt, siger Sandra Binau Bendtsen til TV 2.Og hun er langtfra den eneste, der har det sådan.Flere unge i alderen 20 til 24 år forbliver boende hos deres forældre.Det viser nye tal fra Danmarks Statistik, og tendensen gør sig særligt gældende i hovedstadsområdet.Frederiksberg Kommune topper listen med med en stigning på 93 procent i andelen af 20-24-årige, der stadig bor hjemme siden 2010. Lige i hælene er Københavns Kommune og Glostrup Kommune med en stigning i samme periode på 88 procent.Se også- Man tør ikke engang håbe på det, siger 23-årig om udsigten til at købe lejlighedBoligdrømmen synes fjern, siger økonomDanske unge flyver først fra reden.Det har undersøgelser af europæiske lande gennem tiden gang på gang bevist, men alt tyder på, at de stigende bolig- og lejepriser – i særdeleshed i København – får færre danske unge til at skynde sig med at pakke flyttekasserne.Det vurderer Ann Lehmann Erichsen, der er forbrugerøkonom i Sydbank og tidligere har forsket i unges boligforhold.- Boligpriserne i Danmark er knækket over – det stikker af i Storkøbenhavn i forhold til resten af landet, fastslår forbrugerøkonomen.De ti kommuner med størst stigning i antallet af hjemmeboende unge siden 2010 Frederiksberg: 93 procent Glostrup: 88 procent København: 88 procent Helsingør: 71 procent Ballerup: 64 procent Gentofte: 64 procent Hvidovre: 59 procent Gladsaxe: 58 procent Albertslund: 55 procent Tårnby: 54 procent Sandra Binau Bendtsen, der til daglig arbejder som kundeservicemedarbejder, har tidligere med lys og lygte ledt efter et sted at bo.Flere faktorer har dog været afgørende for, at det endnu ikke har udmøntet sig til noget.Sandra Binau Bendtsen kan ikke se, hvorfor hun skal skynde sig med at flytte hjemmefra, når hun har det godt med sin mor. Foto: PrivatfotoHun har svært ved at finde en bolig, da hun ikke er berettiget til studie- og ældreboliger, og en andelsbolig har hun overvejet, men boligmarkedet – og alt det, det indebærer – føles uoverskueligt for hende, da hun tidligere har været ramt af stress.Samtidig har hun et godt forhold til sin mor, og da hendes tvillingesøster flyttede hjemmefra, oplevede hun, at det var mere overskueligt at blive boende hjemme.- Jeg har stadig gerne villet flytte, men det har ligesom givet noget mere ro, noget mere plads, lyder det fra Sandra Binau Bendtsen.Se ogsåMidt i boligjagten fik hun ubehagelig video – ”det er desværre normen”Roomies?En lejebolig er ideel for Sandra Binau Bendtsen, fortæller hun, men hun har ikke kunnet finde noget til en overkommelig pris – heller ikke i Albertslund, som hun hellere vil bo i end i København til forskel for mange andre danske unge.- Selvfølgelig kunne jeg vælge at sige, så flytter jeg ud og bor med en roomie, siger Sandra Binau Bendtsen og tilføjer:- Men man kan sige, om jeg har et værelse med min mor eller en fremmed – så foretrækker jeg altså at bo hos min mor.Se ogsåHøje lejlighedspriser fastholder unge i dyre lejeboligerDet kan 20-årige Nikolaj Steengaard nikke genkendende til.Han bor med sin familie i Holte, og selvom han helst ville bo i København, er det "pissedyrt".Til trods for at det plager ham med de lange transporttider til København, hvor han tager etårigt kursus i film, så er tanken om at flytte ind med roomies, han ikke kender i forvejen, ikke noget, der ligefrem begejstrer ham.Drømmescenariet for Nikolaj Steengaard – som heller ikke berettiget til en studiebolig – er, at han i stedet flytter ind i en lejebolig med sine kammerater.- Men der er jo selvfølgelig en stor udfordring i det – fordi de andre gider heller ikke rigtig at flytte hjemmefra, lyder det fra ham.Nationalbanken vender tommelfinger nedad til forslagFlere har foreslået at lade unge bruge deres pensionsopsparinger på boligkøb for at lette adgangen til boligmarkedet.Det vil dog have den stik modsatte effekt, viser en ny analyse fra Nationalbanken.Resultatet vil være, at boligpriserne vil stige, hvilket vil gøre det lige så svært at komme ind på boligmarkedet som før. Den vurdering deler Ann Lehmann Erichsen.Se ogsåUnge vil bruge pensionen på en bolig – nu bakkes de op af Ældre SagenEn andelsbolig virker tiltalende for Nikolaj Steengaard, men han tør ikke at låse sig fast, da han ikke ved, hvad fremtiden bringer, og dermed hvor han ender i landet – eller om han overhovedet bliver i Danmark for den sags skyld.Desuden synes han, at det virker umuligt, når det som regel kræver at blive skrevet op på ventelister til andelsboligforeninger mange år i forvejen.- Det er også bare totalt væk, at det koster sådan noget som 200 kroner om året for at skrive mig op på en liste, hvor det er usikkert, om jeg overhovedet får noget, siger han.For unge, der er vokset op i Storkøbenhavn, er det blevet svært at flytte hjemmefra og samtidig være tæt på familie og venner, lyder det fra forbrugerøkonom Ann Lehmann Erichsen. Foto: Niels Ahlmann Olesen / Ritzau ScanpixForbrugerøkonom Ann Lehmann Erichsen opfordrer forældre, der ser for sig, at deres børn som unge voksne vil flytte til Storkøbenhavn, til straks at få dem skrevet op på ventelister til boliger.- Du skal skælde mor og far ud, hvis ikke du blev skrevet op, da du blev født, joker Ann Lehmann Erichsen og tilføjer:- Det kan man selvfølgelig ikke forlange af forældre, men det ville da være en god idé, hvis de gjorde det.Se ogsåSe kortet: Så godt har boligmarkedet klaret sig i din kommuneMere normaliseret i andre kulturer at bo hjemme19-årige Blessing Mwamba bor i Brøndby Strand med sin familie, og heller ikke hun har travlt med at flytte ud.Dels fordi det giver mange økonomiske fordele at blive boende hos sin familie.Det giver blandt andet større frihed til at nyde sin ungdom med cafeture og rejser – alt imens hun stadig hjælper til med huspligter, men ikke med huslejen ligesom Nikolaj Steengaard.Og dels fordi hun qua sine congolesiske rødder kommer fra en kultur, hvor det er mere almindeligt at blive boende hjemme som voksen. Det samme gør sig gældende for de af hendes veninder, der ligeledes er minoritetsetniske.Blessing Mwamba stiller sig uforstående over for, hvorfor der i Danmark er så høj en forventning om, at man flytter hjemmefra i en tidlig alder. Foto: PrivatfotoTal fra Danmarks Statistik fra november 2024 viser, at det især er efterkommere med ikkevestlig baggrund i aldersgruppen 30-44 år, der forbliver boende hos deres forældre.Til sammenligning gælder det kun 6,5 procent for efterkommere fra vestlige lande, mens tallet for personer med dansk oprindelse er 3,2 procent.- Alle dem, jeg kender, som bor ude, arbejder virkelig hårdt hver eneste dag for at betale deres regninger, siger Blessing Mwamba om universitetsstuderende som hende selv og tilføjer:- Jeg føler ikke, at de har lige så meget frihed, som jeg har.Se ogsåDanskernes boligsituation er "kritisk", vurderer EUKast blikket mod Norge, foreslår økonomTendensen med, at flere unge bor hjemme, vil vare ved i et stykke tid fremover, vurderer Ann Lehmann Erichsen.For at gøre det lettere for unge at få adgang til det danske boligmarked foreslår forbrugerøkonomen at hente inspiration fra vores norske naboer.Flere unge bor til lejeI København er der færre af de 25-29-årige, der bor i ejerbolig, mens det modsatte gælder for lejeboliger. Andelen af unge i København i alderen 25-29 år, der bor til leje, er steget med 19 procent siden 2017. Det er sket samtidig med, at andelen af unge i københavnske ejerlejligheder er skrumpet – også når man medregner forældrekøb. Kilde: Mybanker, Danmarks Statistik (2024) I Norge findes en ordning kaldet Boligsparing for Ungdom (BSU), som giver unge mulighed for at spare op til boligkøb med et skattefradrag på 10 procent af indbetalte beløb i indkomståret 2024.De, der ikke allerede ejer en bolig, kan årligt spare op til 27.500 norske kroner – svarende til omkring 17.500 danske kroner – med et maksimalt sparebeløb på 300.000 kroner.Ordningen er designet til at lette adgangen til boligmarkedet og ikke mindst opmuntre unge til at begynde med at spare op tidligt i livet.- Det er måske en anden vej at gå – at vi får fokus på opsparing til udbetaling, siger Ann Lehmann Erichsen.Et valg, der vækker undrenSandra Binau Bendtsen, Nikolaj Steengaard og Blessing Mwamba er alle stødt på undren i deres omgangskreds på grund af, at de endnu ikke er flyttet hjemmefra – hvad enten det er fra kollegaer, medstuderende eller potentielle dates.- Jeg bliver ofte spurgt på universitetet, hvornår jeg har tænkt mig at flytte ud, siger Blessing Mwamba og tilføjer:- Og så siger jeg, at jeg ikke har tænkt mig at flytte ud snart, og så kigger de lidt sjovt, og så er de sådan – hvorfor ikke?Blessing Mwamba stiller sig uforstående overfor, hvorfor der i Danmark er så høj en forventning om, at man flytter hjemmefra i en tidlig alder.Se også - Ingen gode nyheder for førstegangskøbere, siger økonom efter nye prognoserDog erkender de også, at de er heldige at kunne bo tæt på hovedstaden – frem for at være vokset op i mere afsidesliggende områder, hvor de måske ville være tvunget til at flytte på grund af studie- eller arbejdsmuligheder.- Det tager bare lige 20 minutter, og så er jeg i Indre By, siger Sandra Binau Bendtsen.Det er ikke altid let at blive boende derhjemme, fortæller de, og det kræver koordination og tålmodighed i hver deres familie.Alligevel har de tre unge fundet en vej, der giver dem plads til at finde en balance mellem økonomi og studier – samtidig med at de nægter at lade samfundets normer diktere deres valg.Del artikelDelFacebookXE-mailLinkKopiér'
year_published = 2025
year_updated = 2025
