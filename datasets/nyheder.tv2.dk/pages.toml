["https://nyheder.tv2.dk/business/2025-02-10-arkitekter-vil-stoppe-nybyggeri-vi-skal-restaurere-transformere-og-renovere"]
title = 'Arkitekter vil stoppe nybyggeri – vi skal "restaurere, transformere og renovere" - TV 2'
description = "Hvis byggeriet skal være mere klimavenligt, skal alle fra bygherre til den almindelige borger tænke anderledes, mener branchen."
full_description = 'BusinessArkitekter vil stoppe nybyggeri – vi skal "restaurere, transformere og renovere"Hvis byggeriet skal være mere klimavenligt, skal alle fra bygherre til den almindelige borger tænke anderledes, mener branchen.Arkitekter vil stoppe nybyggeri – vi skal "restaurere, transformere og renovere"Arkitekter vil stoppe nybyggeri – vi skal "restaurere, transformere og renovere"10. feb kl. 20.31Ingen aftale endnuIngen aftale endnu28. feb kl. 12.27Rød åbning i DanmarkRød åbning i Danmark28. feb kl. 10.14Danish Crown lukker i KinaDanish Crown lukker i Kina27. feb kl. 10.41- Mange danske virksomheder mærker den her træghed i Tyskland- Mange danske virksomheder mærker den her træghed i Tyskland24. feb kl. 14.25Fred til arbejdsgiverne i en usikker verdenFred til arbejdsgiverne i en usikker verden23. feb kl. 16.19Opråb fra medarbejdere om bedre tone i branchenOpråb fra medarbejdere om bedre tone i branchen23. feb kl. 16.09Har øje på mangel på arbejdskraft i branchenHar øje på mangel på arbejdskraft i branchen23. feb kl. 16.01Lønstigning på 3000 kroner om månedenLønstigning på 3000 kroner om måneden23. feb kl. 15.52Økonomi har fyldt megetØkonomi har fyldt meget23. feb kl. 15.45Der er rent faktisk en del overraskelser, siger erhvervskommentatorDer er rent faktisk en del overraskelser, siger erhvervskommentator23. feb kl. 15.33Lønstigning vil smitte af på kommende aftalerLønstigning vil smitte af på kommende aftaler23. feb kl. 15.14 10. feb kl. 19.36Maria OienNye byggerier skyder op i hele Danmark. Boligblokke, typehuse, mikrolejligheder.Det gamle bliver revet ned, og nyt bliver bygget op.Alene i Københavns Kommune er der lagt en plan for, at der kan bygges 40.000 nye boliger i de kommende 12 år.Men de mange nye byggerier møder kritik fra flere fronter, fordi det er skidt for klimaet.Arkitekterne Søren Nielsen og Nicolai Bo Andersen foreslår derfor et decideret byggeristop for boliger i Danmark.- Vi bliver nødt til at reducere den efterspørgsel, der er for rum og ressourcer ved at restaurere, transformere og renovere det, vi allerede har, i stedet for at bygge nyt, siger Nicolaj Bo Andersen.- Det betyder ikke et stop for arkitektur, tværtimod, det betyder et stop for de kedelige standardbyggerier, vi har set masser af.Hvis det skal leve op til så skrappe krav, når man transformerer og renoverer, så bliver det ubetaleligt dyrtHenrik L. Bank, direktør for BygherreforeningenOgså i Bygherreforeningen, der er brancheforeningen for "dem, der trykker på knappen" for byggerierne, er det en del af den officielle bæredygtighedspolitik, at man skal bygge mindre nyt og i stedet transformere.Direktør Henrik L. Bang ser dog et byggestop som et meget langt skridt at gå.- Det er helt klart, hvis vi ikke får flyttet os hurtigt nok som branche, så havner vi jo i et byggestop. Derfor opfordrer vi vores medlemmer til at begynde at gøre noget af egen drift, siger han til TV 2.De nuværende kvadratmeter er mest bæredygtigeUndersøgelser fra Tænketanken Concito viser, at byggeriet står for 30 procent af den danske CO₂-udledning.Det gælder blandt andet import og produktion af byggematerialer, nedrivning af eksisterende byggerier og bygning af nye.Og selvom det måske kan betyde et mindre energiforbrug for den enkelte borger med et nybyggeri, så er vi nødt til at tænke det hele vejen rundt.Arkitekt og medie- og videncenterchef hos Videnscenter Bolius, Kirstine Virén, fortæller, at de mest bæredygtige og klimavenlige kvadratmeter, der er, er dem, der allerede står i dag.- Den bagage, som det nybyggede hus har i forhold til ressourceforbruget og CO₂-aftrykket i alle de materialer, der er blevet anvendt, transporteret og produceret, er enorm. Den bliver vi nødt til at kigge på nu og her, lyder det fra Kirstine Virén.Undersøgelsen fra Concito viser, at renovering har en lavere klimapåvirkning end nybyggerier, når man kigger på den såkaldte "livscyklus" i byggeriet.Herfra lyder anbefalingen, at der bliver stillet krav om, at man skal sammenligne klimabelastningen ved nedrivning og nybyggeri over for at renovere, før der gives tilladelse.Nyt mindset hos hr. og fru DanmarkVi vil som danskere ikke bare have nyt, vi vil også bo større. Ifølge en opgørelse fra Bolius fra 2022 er det gennemsnitlige nybyggede parcelhus 213 kvadratmeter.Vi vil have større stuer, to toiletter og walk-in-closet, og det er også det mindset, der skal ændres hos danskerne, hvis der skal ske noget i byggeriet, lyder det fra flere af dem, TV 2 har talt med.Kristine Virén fra Bolius nævner som eksempler, at vi skal overveje, om det er nødvendigt at få det nye køkken eller om taget måske kan holde et par år til.- Hvis vi som forbrugere begynder at efterspørge mere bæredygtige løsninger, så kan vi gøre vores del til at ændre denne her kurs, siger hun.Se ogsåHøje lejlighedspriser fastholder unge i dyre lejeboligerDet samme mener foreningen Lærlinge for Bæredygtighed, hvor Emmilie Joy Hansen er forkvinde.Hun siger, at byggebranchen skal være en del af bæredygtighedsdebatten på samme niveau, som vi diskuterer, om der skal mindre kød på tallerkenen.- Ligesom danskerne skal tage stilling til, hvordan de transporterer sig selv, og hvad de spiser, så skal de forstå, hvad det er, de bor i. Det er jo i vores boliger, vi befinder os i allermest, siger hun.Mildere krav til renoveringDerfor mener Emmilie Joy Hansen også, at branchen har et ansvar i at rådgive kunderne. Det gælder alt fra ejendomsmægleren, der siger, at en bolig bare skal rives ned – til håndværkere, der hjælper folk med renovering.Professionelt synes hun også, at det er sjovere at arbejde med genbrugsmaterialer som bygningssnedker.Direktør for Bygherreforeningen, Henrik L. Bang, er enig i, at det kræver en omstilling hele vejen rundt, både professionelt, hos kunderne og ude hos danskerne, der står for efterspørgslen på de her boliger.Han mener bestemt, at byggebranchen er klar til at renovere mere i stedet for bygge nyt, men han peger på, at reglerne på området skal ændres.Se ogsåBygherre skal betale 1,8 millioner i erstatning for fældede træerKonkret ser han gerne, at der bliver mildere krav i lovgivningen for boliger, der skal renoveres, fordi de i dag er lige så skrappe som til et nybyggeri.- Hvis det skal leve op til så skrappe krav, når man transformerer og renoverer, så bliver det ubetaleligt dyrt, og så havner man tit i den situation, at så kan man lige så godt rive ned og starte forfra for at kunne leve op til kravene, siger han.I første omgang har Social- og boligstyrelsen sat gang i en gennemgang af bygningsreglementet, hvor den del er et element.Skal være sværere at rive nedOgså i Social- og boligministeriet har minister Sophie Hæstrup Andersen (S) sat gang i en undersøgelse af, hvordan kommunerne kan få bedre muligheder for at sige nej til at rive ned, så man i højere grad kan renovere frem for at bygge nyt.Hun forholder sig ikke til et midlertidigt byggestop, men hun peger på en model, hvor "forureneren betaler", altså at bygherre betaler for de klimaudgifter, der er forbundet med et byggeri.- Jeg vil gerne kigge på, hvordan vi kan gøre det sværere bare at rive ned, siger hun til TV 2.Undersøgelsens resultater forventes at være klar i midten af 2026.Del artikelDelFacebookXE-mailLinkKopiér'
year_published = 2025
year_updated = 2025
