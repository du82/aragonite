["https://nyheder.tv2.dk/udland/2025-03-01-han-stillede-spoergsmaal-til-zelenskyjs-toej-og-er-kaereste-med-en-af-trumps-stoerste-stoetter"]
title = "Han stillede spørgsmål til Zelenskyjs tøj – og er kæreste med en af Trumps største støtter - TV 2"
description = "Journalisten har givet det, han kalder et &quot;officielt svar på jakkesæt-spørgsmålet&quot; lørdag."
full_description = '''Krigen i UkraineHan stillede spørgsmål til Zelenskyjs tøj – og er kæreste med en af Trumps største støtterJournalisten har givet det, han kalder et "officielt svar på jakkesæt-spørgsmålet" lørdag.Brian Glenn sammen med sin kæreste, den konservative politiker Marjorie Taylor Greene. Arkivfoto. Foto: Cheney Orr / Ritzau Scanpix I går kl. 22.00Emma Klinker Stephensen & Mie HaugaardBrian Glenn er måske ikke et navn, du kender. Men det er navnet på den journalist, der fredag spurgte Ukraines præsident, Volodymyr Zelenskyj, til hans tøj, da han besøgte Donald Trump i Det Hvide Hus.Inden det gik rigtig galt for de to.Spørgsmålet faldt, lige inden både USA's præsident, Donald Trump, og vicepræsidenten J.D. Vance kommenterede på Zelenskyjs taknemmelighed og respekt – eller mangel på samme.- Hvorfor har du ikke et jakkesæt på? Ejer du et jakkesæt? Mange amerikanere har et problem med, at du ikke respekterer kontorets (Det Ovale Værelse, red.) værdighed.Sådan lød det fra Brian Glenn, der arbejder for mediet Real America’s Voice og var en af de journalister, der havde fået lov til at være til stede i Det Ovale Værelse, mens Zelenskyj sad med Trump.Se ogsåDet skriver russiske medier om skænderiet: Endefuld for åben skærmZelenskyj svarede, at det bliver efter krigen.- Jeg vil bære et kostume, når denne krig er slut. Måske noget i stil med dit, vi må se, måske noget, der bedre... Måske noget billigere, siger Zelenskyj til den amerikanske journalist.Den ukrainske præsident var iklædt en langærmet bluse i sort med Ukraines våbenskjold over brystet og lange, sorte bukser.Volodymyr Zelenskyj sammen med Donald Trump fredag i Det Ovale Værelse. Foto: Saul Loeb / Ritzau ScanpixBringer svar på XNu har Brian Glenn bragt det, han kalder et ”officielt svar på jakkesæt-spørgsmålet” på sin profil på X.- Præsident Zelenskyj har båret den grønne jumpsuit (eller noget lignende) ved enhver lejlighed, når han har mødt andre verdensledere, klædt respektfuldt til lejligheden, skriver han og fortsætter:- At han endnu engang træder ind i det højeste embede i den mest magtfulde nation i verden, klædt som han gjorde, afspejler hans indre manglende respekt for ikke kun vores land, præsidenten og de amerikanske borgere, der har gjort det muligt for Ukraine at overleve, så længe de har til dette punkt (økonomisk set), skriver han.Se ogsåDe 120 minutter, der rystede verden – hvad ved vi om Zelenskyjs besøg hos Trump? Han mener, at det betyder, at man godt kan skue hunden på hårene.- Øjeblikke efter min udveksling med præsident Zelenskyj begyndte vi at høre en lidt anden tone/stemning fra ham, da han var i dialog med præsident Trump og Vance, da hans påklædning faktisk begyndte at afspejle hans overordnede holdning til forhandlingerne.Musk iklædt t-shirtTV 2 har i løbet af dagen haft spørgsmål fra læserne i vores livechat efter fredagens møde i USA om netop Zelenskyjs tøj.Og det havde måske været klogt af den ukrainske præsident, hvis han havde været iklædt noget andet, siger USA-kommentator Torsten Jansen.- Det er altid nemt at være bagklog. Men det havde været klogt, hvis Zelenskyj havde taget et jakkesæt og et slips på, og på den måde signaleret, at han var åben over for en ændret dynamik i relationen til USA, siger han.Men det er dobbeltmoralsk, når man tænker på Elon Musks påklædning i det selvsamme rum for nogle uger siden, hvor han havde en t-shirt på med ordene ”Occupy Mars” (besæt Mars, red.) under jakken, siger Torsten Jansen.Elon Musk i det Ovale Værelse 11. februar. Arkivfoto. Foto: Kevin Lamarque / Ritzau Scanpix- De hardcore MAGA-folk, som ønsker, at støtten til Ukraine skal stoppe, benyttede påklædningen til at angribe Ukraines leder for at være respektløs. Samtidig ser de det, at han ikke har jakke og slips på, som udtryk for, at han ikke vil tale fred, men fortsætte kampen for enhver pris, lyder svaret fra Torsten Jansen.Han mener ikke, at Elon Musk kommer til at ændre sin påklædning på grund af kritikken mod Zelenskyj.Se ogsåSådan endte mødet mellem Trump og Zelenskyj i skænderi Kæreste med politikerJournalisten Brian Glenn, der stillede et omdiskuterede spørgsmål, er kærester med højrefløjspolitikeren og kongresmedlemmet Marjorie Taylor Greene.Hun har flere gange gjort sig bemærket i medierne – blandt andet ved at beskylde en journalist for at være årsag til, at Donald Trump var udsat for et attentatforsøg i sommer.Kongresmedlem Marjorie Taylor Greene. Arkivfoto. Foto: Andrew Harnik / Ritzau ScanpixPræsident Zelenskyj har lørdag været til møde i London med den britiske premierminister, Keir Starmer. Mødet var blevet fremrykket efter fredagens hændelser.Del artikelDelFacebookXE-mailLinkKopiér'''
