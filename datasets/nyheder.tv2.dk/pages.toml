["https://nyheder.tv2.dk/klima/2025-01-31-den-danske-vinter-forsvinder"]
title = "Den danske vinter forsvinder - TV 2"
description = "Når klimaet ændrer sig, forandrer det også os, forklarer psykolog."
full_description = 'KlimaDen danske vinter forsvinderNår klimaet ændrer sig, forandrer det også os, forklarer psykolog.Den danske vinter forsvinderDen danske vinter forsvinder1. feb kl. 17.35Råd anbefaler ambitiøst 2035-målRåd anbefaler ambitiøst 2035-mål27. feb kl. 11.26Statsstøtte til havvind er "en alvorlig fejl", mener tænketankStatsstøtte til havvind er "en alvorlig fejl", mener tænketank31. jan kl. 14.23Energiselskab lover at "se seriøst" på nyt udbud af havvindEnergiselskab lover at "se seriøst" på nyt udbud af havvind31. jan kl. 13.55- Lysene på landingsbanen bliver tændt, siger brintvirksomhed- Lysene på landingsbanen bliver tændt, siger brintvirksomhed31. jan kl. 13.26Minister vender tilbage med plan for nyt udbudMinister vender tilbage med plan for nyt udbud31. jan kl. 11.14Energiø Bornholm udskydesEnergiø Bornholm udskydes31. jan kl. 11.08Regeringen vil skyde milliarder i at fremrykke brintrørRegeringen vil skyde milliarder i at fremrykke brintrør31. jan kl. 10.51Regeringen dropper udbud af havvindRegeringen dropper udbud af havvind31. jan kl. 10.46Brintrør til Tyskland er "afgørende", siger BrintbranchenBrintrør til Tyskland er "afgørende", siger Brintbranchen31. jan kl. 10.24Mads Nipper færdig i ØrstedMads Nipper færdig i Ørsted31. jan kl. 09.16Video fra Lasse ChristensenVideo fra Lasse Christensen7. jan kl. 09.00 1. feb kl. 10.30Astrid Helmer MørckHvis du har det som om, at vinteren i gamle dage var koldere og mere snefyldt, er der noget om det.For i løbet af de sidste 100 år er den danske vinter blevet 3 grader varmere – og det er særligt de seneste 30 år, at temperaturen for alvor er stukket i vejret.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); 3 grader er en del i sig selv, forklarer TV 2s meteorolog Andreas Nyholm, der kalder udviklingen "bekymrende".Men fordi vi er gået fra 0 grader til plusgrader, er forandringen også meget synlig. Vinteren er mindre hvid og mere våd.- Vi er gået fra at have en vinter, der er præget af sne og kulde, til en vinter, der minder om efterår, siger han.Vi savner knitrende sneNår klimaet forandrer sig, forandrer det også os, forklarer psykolog Solveig Roepstorff.Hun har beskæftiget sig med klimapsykologi siden 2018, og ifølge hende mærker mange af os lige nu det, hun kalder for snelængsel.- En del af os længes efter den knitrende, sprøde sne og det lys, der kommer med sneen. Det er med til at påvirke vores humør, siger hun og peger på, at det kan få antallet af vinterdepressioner til at stige.Se ogsåHar du vinterdepression? Her er fire råd til at komme gennem mørketDer er stadig vinterdage, hvor landet bliver dækket af et hvidt lag sne. Men selv der er noget anderledes, lyder det.- Det føles som en stjålen lykke, en slags hit-and-run, når det rammer. For vi mærker, at det bliver mindre og sjældnere, siger Solveig Roepstorff.Forårsbebudere i oktoberJes Aagard, der er biolog og naturvejleder, kan også mærke, at noget har forandret sig.Flere af de fugle, der plejer at trække sydpå, når det bliver for koldt, bliver hængende i Danmark. De mildere temperaturer betyder, at de kan finde føde hele året.- Så er der ingen grund til at spilde energien ved at fare sydpå. Det ser vi for eksempel med tranerne. Og det er ændret for ganske nyligt, siger Jes Aagard.Se ogsåNye arter krydser grænsen til DanmarkPlanternes rytme er på samme måde blevet anderledes. I oktober så han forårsblomsten anemonen stå i skovbunden, og i sidste uge plukkede Jes Aagard høje ramsløg på Bornholm.- Det plejer jo at være en forårsbebuder. Men når temperaturen er så høj, så tager de chancen og kommer op, siger han.Nogle af de danske padder er også stået op, selv om de plejer at være i dvale. Og i insektverdenen er der bier, der forvilder sig ud. Ifølge Jes Aagard er det forbundet med en fare, fordi dens føde ikke er fulgt med endnu.- Der er stadig et miskmask mellem de her faktorer, der er tilpasset over mange tusind år. Og hvis vi bliver ramt af en kuldebølge, så vil mange af de dyr og planter, der er vågnet tidligt, dø, siger han.Eksistentielle truslerDet kan virke uskyldigt, at en forårsblomst springer ud om vinteren, eller at en trækfugl bliver det samme sted hele året.Men årstidernes nye rytmer kan skabe en utryghed i os, forklarer Solveig Roepstorff. For de ændrede mønstre giver os en fornemmelse af, at noget ikke trives.- Det er et grundvilkår, der ændrer sig. Årstidernes gang – noget vi engang regnede for sikkert – forandrer sig. I det lys kan man godt kalde det for en eksistentiel trussel, siger hun.Se ogsåForsker kalder nye tal for pindsvin "forfærdelige"I bund og grund handler det også om en følelse af at miste. Et tab af den version af vinteren, vi er vant til, giver os en fornemmelse af, at vores trygge rammer er forandret. Også selv om vi befinder os i dem lige nu.- Det er en form for hjemve. Vi har stadig et hjem, men det er så forandret, at det føles fortabt, siger Solveig Roepstorff.Pollensæsonen er blevet forlængetDet er ikke kun vores sind, der bliver påvirket af klimaets forandringer. De milde vintre smitter også af på vores fysiske helbred – og det er især noget, danske pollenallergikere og astmatikere mærker.- Hvis man har astma, så kan det blive trigget af det fugtige vintervejr. Især hvis ens astma ikke er velbehandlet, siger Christine Højer Eriksen, der er sundhedsfaglig koordinator hos Astma- og Allergi Danmark.Se ogsåKlimaforandringer sender helt nye sygdomme til DanmarkPollensæsonen er også blevet længere: Sæsonen for birk er blevet 15 dage længere, for græs er den blevet forlænget med 18 dage, og pollenmængden er også øget.- Det er vind og vejr, der styrer, hvornår sæsonerne går i gang, siger Christine Højer Eriksen.Har du spørgsmål om astma, allergi, høfeber og eksem?Du kan ringe til Astma-Allergi Danmarks Rådgivning på tlf. 43 43 42 99. Telefonen er åben på hverdage kl. 9-12, tirsdag og torsdag kl. 13-15 og onsdag kl. 16-18. Du kan gratis downloade app’en Dagens Pollental. Her kan man finde Dagens Pollental og se, hvor mange pollen man regner med, at der er i luften de næste fem dage. Du kan læse meget mere om astma og allergi på www.astma-allergi.dk Hun peger på, at de nye mønstre betyder, at flere med pollenallergi kan få værre og længere sygdomsforløb.Men så skulle man tro, at det milde vintervejr gjorde livet lettere for Vejdirektoratet, når det gælder saltning og snerydning. Men sådan er det ikke udelukkende.Selvom der ifølge chefkonsulent Freddy Knudsen saltes 25 procent mindre og ryddes 50 procent mindre end for ti til 15 år siden, kan der ikke skæres tilsvarende i beredskabet.- Det hele er blevet mere uforudsigeligt. Det kommer i bølger og mere pletvist rundtom i landet. Det er også det, vi ser i en mild periode som nu, hvor der så lige pludselig er dage med frost i en del af landet, siger han.Tidligere gik vintersæsonen fra 1. oktober til 30. april. Nu starter den tidligst 15. oktober, men med fleksible ordninger kan opstarten udskydes.Journalistiske principperTV 2 publicerer nyheder ud fra journalistiske principper om etik og balance. Det betyder blandt andet, at vi faktatjekker, interviewer kilder og altid forsøger at lade sagens parter komme til orde. Du kan læse vores etiske retningslinjer her. TV 2 er desuden tilmeldt Pressenævnet og følger de presseetiske regler. Glæden ved en smattet vinterIfølge Solveig Roepstorff er det først og fremmest vigtigt at dele sine tanker og følelser om den anderledes vinter med andre. Det hjælper at sætte ord på, hvordan man har det, og at se det spejlet i andre.Hun peger på, at mennesket har vist sig at være robust – også under omskiftelige omstændigheder.En måde at vænne sig til den nye vinter er ved at skabe nye gode minder forbundet med den. Ligesom nogle af os har et billede af tykke snelag og skøjteture, når vi tænker på vinteren nu.- Vi skal lære nye måder at glæde os over et vinterlandskab på – også selvom det er vådt og smattet. På den måde forbinder vi os til den i stedet for at føle tab, siger hun.Se ogsåÅrets gang i haven er forandret – her er, hvad du kan nå endnuDet kræver dog tid. Men fordi udviklingen sker så relativt hurtigt, er der allerede forskel på, hvor hårdt snelængslen har fat i os.- Generationerne oplever det her forskelligt. De, der er børn nu, har jo ikke det samme billede af vinteren som dem, der var barn for 30 år siden, siger Solveig Roepstorff.Del artikelDelFacebookXE-mailLinkKopiér'
