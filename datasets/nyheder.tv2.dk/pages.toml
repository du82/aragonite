full_description = "UdlandMicrosoft finder fejl mailsystem med driftsproblemerOutlook, der er techgiganten Microsofts mailsystem, har lørdag haft tekniske udfordringer, skriver medier.Microsofts Outlook er lørdag ramt af nedbrud. Foto: Microsoft / Microsoft I går kl. 23.21RitzauLørdag aften undersøger den amerikanske techgigant Microsoft et problem, der har gjort, at flere bruger ikke har kunnet tilgå mailsystemet Outlook.Det skriver Microsoft i et opslag på det sociale medie X.Techgiganten skriver også, at man retter fejlen for at imødekomme udfaldet.Det sker, efter at Outlook lørdag aften dansk tid har været ukampdygtig i et kortere tidsrum.Det har flere medier herunder amerikanske Fox og tyske Bild skrevet med henvisning til hjemmesiden Downdetector.Knap 40.000 har meldt ind til portalen, at de har oplevet problemer med at tilgå Outlook, skriver B.T.Også Ekstra Bladet har skrevet, at deres konti ikke har været mulige at tilgå.Ikke længe efter blev adgangen dog genoprettet.Microsoft er en amerikansk multinational teknologivirksomhed, der har været en nøglespiller i computerindustrien siden grundlæggelsen i 1975.Techgiganten har gennem tiden været en af verdens mest værdifulde virksomheder med millioner af brugere verden over.Del artikelDelFacebookXE-mailLinkKopiér"
