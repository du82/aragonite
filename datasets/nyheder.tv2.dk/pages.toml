["https://nyheder.tv2.dk/2025-03-01-efter-40-minutter-og-26-sekunder-begik-zelenskyj-en-stor-fejl-siger-forhandlingsekspert"]
title = "Efter 40 minutter og 26 sekunder begik Zelenskyj en stor fejl, siger forhandlingsekspert - TV 2"
description = "Konsekvenserne af det kuldsejlede pressemøde kan blive store. Og måske det allerede er for sent for Ukraine."
full_description = '''Krigen i UkraineEfter 40 minutter og 26 sekunder begik Zelenskyj en stor fejl, siger forhandlingsekspertKonsekvenserne af det kuldsejlede pressemøde kan blive store. Og måske det allerede er for sent for Ukraine.Her begynder den dårlige stemningHer begynder den dårlige stemningI går kl. 15.44Keir Starmer lover fuld opbakningKeir Starmer lover fuld opbakningI går kl. 19.21Zelenskyj takker det britiske folkZelenskyj takker det britiske folkI går kl. 19.19Zelenskyj ankommer til Downing StreetZelenskyj ankommer til Downing StreetI går kl. 18.32Lars Løkke Rasmussen vil ikke sige alt, hvad han tænkerLars Løkke Rasmussen vil ikke sige alt, hvad han tænkerI går kl. 16.38Lars Løkke Rasmussen vil ikke rokke ved forhold til USALars Løkke Rasmussen vil ikke rokke ved forhold til USAI går kl. 16.31Lars Løkke Rasmussen vil ikke dvæle ved nedsmeltningLars Løkke Rasmussen vil ikke dvæle ved nedsmeltningI går kl. 16.26Chokeret Lars Løkke Rasmussen kalder møde for en "katastrofe"Chokeret Lars Løkke Rasmussen kalder møde for en "katastrofe"I går kl. 16.19Hun tager præmien for "mest ukloge" reaktion, siger tidligere topdiplomatHun tager præmien for "mest ukloge" reaktion, siger tidligere topdiplomatI går kl. 16.11Zelenskyj er landet i LondonZelenskyj er landet i LondonI går kl. 15.54Tidligere topdiplomat afviser teori om Trump og RuslandTidligere topdiplomat afviser teori om Trump og RuslandI går kl. 15.50Nedsmeltning var begges ansvar, siger tidligere topdiplomatNedsmeltning var begges ansvar, siger tidligere topdiplomatI går kl. 15.45 I går kl. 17.13Maja LangbergDen ukrainske præsident, Volodymyr Zelenskyj, var så tæt på.Han havde fået vist hele verden billeder af ukrainske fanger. Han havde også fået nævnt, at tusindvis af ukrainske børn er blevet bortført. Og han fik tid til at italesætte vigtigheden af sikkerhedsgarantier.Men efter 40 minutter og 26 sekunder gik det ifølge Mikkel Gudsøe, der er uddannet konfliktmægler og lektor i forhandling og konfliktløsning ved Aarhus Universitet, galt.- Man kan sammenligne det med at være til geografi-eksamen og svare rigtigt på alle spørgsmål. Men så på vej ud af døren få sagt, at Afrika er hovedstaden på Bornholm, og at Jorden er flad, siger Mikkel Gudsøe til TV 2.Konsekvenserne af det kuldsejlede pressemøde kan blive store. Og måske det allerede er for sent for Ukraine. Video: TV 2 NEWSEt af "de værste pressemøder i historien"Fredagens pressemøde har allerede sat gang i et hav af analyser, reaktioner og breaking news.Jeg tænkte bare: 'Nej, nej, nej'Isabel Bramsen, fredsforskerI særdeleshed seancens sidste cirka 10 minutter, hvor en ophedet diskussion udspillede sig mellem den ukrainske præsident, den amerikanske præsident og den amerikanske vicepræsident, J.D. Vance.Og spørger man Mikkel Gudsøe, var det en kommentar fra sidstnævnte, der provokerede Zelenskyj i en sådan grad, at pressemødet udviklede sig til "et af de værste pressemøder i historien" – potentielt med store konsekvenser for en kommende fredsaftale.Til det stort anlagte pressemøde deltog også andre end de to præsidenter i midten. Til højre i billedet ses eksempelvis både den amerikanske udenrigsminister, Marco Rubio, og den amerikanske vicepræsident, J. D. Vance. Foto: Mystyslav Chernov / ASSOCIATED PRESSEn forhandlingsmæssig fejlIfølge Mikkel Gudsøe, er den ukrainske præsident traditionelt god til at "holde hovedet koldt" og sige de rigtige ting på det rigtige tidspunkt.Men da J.D. Vance efter knap 40 minutter tog ordet og betonede vigtigheden af diplomati, knækkede filmen.Volodymyr Zelenskyj reagerede ved at fortælle om Ukraines allerede fejlslåede diplomatiske aftaler med Rusland og spørge den amerikanske vicepræsident, hvilken slags diplomati han egentlig talte om.Hvordan startede skænderiet?Hen mod pressemødets afslutning tog den amerikanske vicepræsident, J.D. Vance, ordet. Her sagde han blandt andet, at vejen til fred og velstand "måske er at engagere sig i diplomati". - Vi prøvede Joe Bidens vej med at slå os for brystet og lade, som om at præsidenten for USA's ord betød mere end præsidenten for USA's handlinger. Det, der gør Amerika til et godt land, er, at Amerika engagerer sig i diplomati. Det er, hvad præsident Trump gør, sagde han. Som reaktion spurgte Ukraines præsident, Volodymyr Zelenskyj – 40 minutter og 26 sekunder inde i pressemødet – om han måtte henvende sig direkte til Vance. Da han fik lov, pointerede han, at Ukraine tidligere har indgået diplomatiske aftaler med Rusland og Vladimir Putin, som er blevet brudt. - Han (Putin, red.) brød våbenhvilen, han dræbte vores folk, og han udvekslede ikke fanger, sagde Zelenskyj direkte henvendt til J.D. Vance. - Hvilken slags diplomati, JD, taler du om? Hvad mener du? spurgte han. Herefter kaldte J.D. Vance den ukrainske præsident for "respektløs", og så fulgte omkring ti minutter med mere eller mindre intens mundhuggeri mellem Trump, Vance og Zelenskyj. Reaktionen fra Vance var, at Zelenskyj var "respektløs", og herfra var Trump-lejren ifølge Mikkel Gudsøe "blevet antændt".- Zelenskyj har selvfølgelig ret til at reagere, som han gjorde. Men forhandlingsmæssigt var det på ingen måde det rigtige, siger han.Mikkel Gudsøe mener i stedet, at Zelenskyj skulle have givet Vance og Trump ret i, at diplomatiet er rette vej frem – og at det "stærke amerikanske lederskab forhåbentlig kan vise vejen".- Det er jo fedteri, men man er nødt til at se på, hvem man sidder overfor, konkluderer Mikkel Gudsøe.Også fredsforskeren Isabel Bramsen har svært at forestille sig "et værre udfald" af fredagens pressemøde.Et møde med stort potentialeMere specifikt er Isabel Bramsen lektor og leder for freds- og konfliktstudier ved Lunds Universitet.Og tv-billederne fra mødet mellem Trump og Zelenskyj gjorde hende ikke just mere håbefuld i forhold til en kommende fredsaftale i Ukraines favør.- Jeg tænkte bare: 'Nej, nej, nej', siger hun til TV 2.Hun uddyber, at mødet havde et særligt stort potentiale, fordi det kom i kølvandet på en periode med ordkrig mellem de to præsidenter.Det var derfor Zelenskyjs mulighed for at komme tilbage "i varmen og ind i centrum af fredsforhandlingerne".PerspektivOrdkrigen: Hvad har Trump og Zelenskyj sagt? Foto: Presidential Office Of Ukraine/Ritzau ScanpixI løbet af februar har både Volodymyr Zelenskyj og Donald Trump kommet med verbale skyts mod hinanden. 19. februar sagde Trump, at Ukraine selv har startet krigen med Rusland, og at den ukrainske præsident er en "diktator", som "nægter at afholde valg". Omvendt har Zelenskyj udtalt, at Trump er "fanget i en boble af russisk desinformation". - Men det præcis modsatte skete. Og risikoen er nu meget stor for, at Trump fortsætter sin diplomatiske bejlen til Rusland uden at forholde sig til Ukraine og europæerne, siger Isabel Bramsen.Spørgsmålet er derfor, hvad Zelenskyj kan gøre for at genvinde Trumps øre og sikre sig medbestemmelse i en kommende fredsaftale.Mit bedste bud er, at Trump og Putin allerede har en grov skitse til en planFlemming Splidsboel, seniorforsker på Dansk Institut for Internationale StudierOg her har både Mikkel Gudsøe og Isabel Bramsen svært ved at komme med et klokkeklart svar. For den amerikanske præsidents humør er lunefyldt – og en fjende den ene dag kan være en ven den næste.– Det er jo en virkelig svær balancegang. På den ene side skal han sætte sig i respekt og ikke finde sig i alt. Og på den anden side skal han ikke sætte Trumps pis i kog, siger Isabel Bramsen.Donald Trump har før "vendt på en tallerken", siger fredsforsker Isabel Bramsen. Eksempelvis var han i 2017 stærkt kritisk over for Nordkoreas leder, Kim Jong-Un. Men et par år efter gik de "nærmest som bedste venner" over den nordkoreanske grænse. Foto: Kevin Lamarque / Ritzau ScanpixDen helt store violinMikkel Gudsøe mener heller ikke, at Zelenskyj skal "lægge sig fladt ned" eller for den sags skyld sige undskyld.Men samtidig er det ifølge ham svært at komme uden om nødvendigheden af at tage den helt store violin i brug over for den amerikanske ledelse.- Der skal ikke bare stryges med hårene. De skal friseres, og de skal friseres grundigt, siger han.Se ogsåDet skriver russiske medier om skænderiet: Endefuld for åben skærmSiden pressemødet har Zelenskyj da også i flere udtalelser gjort det klart, at Ukraine er "meget taknemmelig" over for USA.- Amerikas hjælp har været afgørende for at hjælpe os med at overleve, skriver han blandet andet på det sociale medie X lørdag.- På trods af den hårde dialog forbliver vi strategiske partnere, understreges det derudover.Spørger man Flemming Splidsboel, der er seniorforsker på Dansk Institut for Internationale Studier og gennem en årrække har haft Rusland som fokus, kan noget dog tyde på, at det allerede er for sent.Har Trump og Putin allerede en plan?- Mit bedste bud er, at Trump og Putin (Ruslands præsident, Vladimir, red.) allerede har en grov skitse til en plan, måske endda med nogle ret konkrete elementer i – og det vil Putin gerne have effektueret, siger han til TV 2.Seniorforskeren kan kun gisne om, hvad en sådan aftale indeholder. Men han nævner dog forskellige muligheder:For eksempel at Ukraine skal afstå de russiskbesatte områder. At sanktioner mod Rusland bliver ophævet. At Ukraine nægtes medlemskab af NATO. At al snak om krigsforbrydelser og krigsskadeerstatninger bliver sløjfet. Eller at Ukraine afskæres adgang til kampvogne, kampfly eller missiler.Rygterne i russiske medier lyder, at der inden for ganske få uger vil finde et møde sted mellem Vladimir Putin og Donald Trump. Det fortæller seniorforsker Flemming Splidsboel. Foto: Sergei Bobylyov / Ritzau ScanpixFaktisk tror Splidsboel allerede, der lå en form aftale inden det kuldsejlede pressemøde.For det virkede for ham, som om der var en "amerikansk plan om at give Zelenskyj nogle skrammer".- Han skulle ikke tales op til at kunne blokere en proces, der allerede var i gang. Og det siger mig, at vi er på vej mod et udfald, der ser dårligt ud for Ukraine, siger han.Del artikelDelFacebookXE-mailLinkKopiér'''
