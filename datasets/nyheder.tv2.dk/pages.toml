["https://nyheder.tv2.dk/business/2025-02-27-nabo-er-sur-paa-kirkens-naturplaner-traeer-vil-oedelaegge-min-udsigt"]
title = "Nabo er sur på kirkens naturplaner: - Træer vil ødelægge min udsigt - TV 2"
description = "Det er ikke alle, der er glade for planerne om at omdanne landbrugsjord til skov og vild natur."
full_description = 'BusinessNabo er sur på kirkens naturplaner: - Træer vil ødelægge min udsigtDet er ikke alle, der er glade for planerne om at omdanne landbrugsjord til skov og vild natur. Nabo er sur på kirkens naturplaner: - Træer vil ødelægge min udsigtNabo er sur på kirkens naturplaner: - Træer vil ødelægge min udsigt27. feb kl. 17.42Ingen aftale endnuIngen aftale endnu28. feb kl. 12.27Rød åbning i DanmarkRød åbning i Danmark28. feb kl. 10.14Danish Crown lukker i KinaDanish Crown lukker i Kina27. feb kl. 10.41- Mange danske virksomheder mærker den her træghed i Tyskland- Mange danske virksomheder mærker den her træghed i Tyskland24. feb kl. 14.25Fred til arbejdsgiverne i en usikker verdenFred til arbejdsgiverne i en usikker verden23. feb kl. 16.19Opråb fra medarbejdere om bedre tone i branchenOpråb fra medarbejdere om bedre tone i branchen23. feb kl. 16.09Har øje på mangel på arbejdskraft i branchenHar øje på mangel på arbejdskraft i branchen23. feb kl. 16.01Lønstigning på 3000 kroner om månedenLønstigning på 3000 kroner om måneden23. feb kl. 15.52Økonomi har fyldt megetØkonomi har fyldt meget23. feb kl. 15.45Der er rent faktisk en del overraskelser, siger erhvervskommentatorDer er rent faktisk en del overraskelser, siger erhvervskommentator23. feb kl. 15.33Lønstigning vil smitte af på kommende aftalerLønstigning vil smitte af på kommende aftaler23. feb kl. 15.14 27. feb kl. 17.16Signe Mai Vilsbøll & Charlotte Rudiengaard RasmussenI Strøby nær Køge drømmer menighedsrådet om at befri kirkens jord fra landbrugsmaskiner og invitere den vilde natur ind på arealerne, når forpagtningsaftalen med den lokale landmand udløber.Drømmene taler direkte ind i ambitionerne for den netop vedtagne grønne trepartsaftale, men lovgivningen taler imod.Det er dog ikke kun det, menighedsrådet kalder "et sandt kludetæppe af regler", der kan gøre det svært at få omlagt landbrugsjorden til skov eller vild natur. Det kan også naboerne til kirkens arealer.Hvis de på en eller anden måde får det igennem, vil vi kræve millionerstatningRita Ebbesen, pensionistDe synes ikke, at kirkens "bibelske" drøm om at få naturen helt tæt på, er en god idé.- Da vi hørte rygterne om, at kirken vil rejse skov, stak vi naboer næserne sammen. Der skal ikke være skov her i vores baghave. Det ødelægger vores udsigt, fortæller pensionist Rita Ebbesen, der ligesom sine ni naboer bor med udsigt ud over den mark, menighedsrådet bestemmer over.Den grønne trepartDen grønne trepart er en aftale mellem regeringen, Landbrug & Fødevarer, Danmarks Naturfredningsforening, Fødevareforbundet NNF, Dansk Metal, Dansk Industri og KL. Aftalen blev indgået i juni 2024 og vedtaget i Folketinget i november samme år. Målet med aftalen er at få genoprettet livet i danske fjorde, søer og vandløb, skabe mere natur og biodiversitet og nå klimamål. Derudover skal CO₂-udledningen i landbruget nedbringes. Frem mod 2030 skal 400.000 hektar landbrugsjord omlægges til naturområder, svarende til Fyn og Lollands samlede areal. Desuden indfører Danmark som del af aftalen en CO₂​-afgift på landbrugsproduktion. Rita Ebbesen forstår ikke, at menighedsrådet taler om marken som "udpint landbrugsjord". For hende er kornmarken et unikt stykke natur med masser af dyreliv.- Når det er koldt, er marken fyldt med gæs og svaner, og ham, der har haft forpagtningsaftalen sørger for, at marken altid står pæn. Han fjerner også ukrudt, så det ikke kommer ind i vores haver.Natur kan blive "et helvede"Parcelhusene ved kirkens jord ligger side om side.Udsigten udover markerne var en af hovedattraktionerne, da Rita Ebbesen og hendes mand for 30 år siden besluttede at købe huset tæt på kirken i Strøby, og derfor er hun klar til at gå på barrikaderne for at bevare den.- Hvis de på en eller anden måde får det igennem, vil vi kræve millionerstatning. Vi har alle sammen købt vores huse med den udsigt, der er nu. Den vil vi beholde, siger Rita Ebbesen og nævner, at der er et hav af fredninger, som ikke burde gøre det muligt for menighedsrådet at komme igennem med planerne. Hun har selv undersøgt det.- Det er fredet område. Man må slet ikke rejse skov.Se ogsåMenighedsrådsformand med ”bibelsk” drøm møder ”tåbelig” modstandMed den grønne trepartsaftale er der lagt op til, at 15 procent af den danske landbrugsjord skal omlægges til skov og natur, og regeringen håber, at jordejere - som for eksempel kirken - kan bidrage, så vi får et grønnere Danmark og lever op til vores klimamål. Er du imod de ambitioner?- Det skal ikke være her. Der er ikke tale om udpint landbrugsjord, og hvis der bliver rejst skov, så bliver det som at kigge ind i en mørk mur, når vi sidder i vores baghave, lyder det fra Rita Ebbesen.Hvad med noget vild natur?- Hvis der er vild natur på det stykke, kan det blive et helvede for os. Så står ukrudtet jo ind i vores haver.En bølgende kornmarkRisikoen for, at den omfattende arealomlægning, regeringen og parterne bag den grønne aftale har afsat milliarder til, ikke falder i god jord alle steder, er stor.LynanalyseTore BønkeKlimaredaktørSkovrejsning vil være et væsentligt bidrag, hvis Danmark skal nå sit klimamål for 2030. Klimarådet tror på, at målet kan nås, men fremhæver samtidig plantning af ny skov som en af de mest usikre effekter. Eksemplet her fra Strøby viser hvorfor. Det er ofte en langstrakt proces at få lodsejere til at afgive jord, og så kan der dukke andre udfordringer op som bureaukratiske regler eller i dette tilfælde modstand fra omgivelserne. Regeringen er nødt til tage højde for udfordrende bureaukratiske og demokratiske processer, hvis dens klimaplaner også skal virke i virkeligheden inden 2030. Det påpeger klima- og biodiversitetschef i Hedeselskabet, Mads Flinterup, der til daglig arbejder med projekter, hvor landbrugsarealer skal omlægges til skov og natur.- Du skal ikke sidde til mange forsamlingshusmiddage, før du finder ud af, at der altså sidder rimelig mange mennesker derude, der synes, at en bølgende kornmark er væsentlig federe natur end noget som helst, jeg som biodiversitetaficionado kan finde på at sætte op, siger Mads Flinterup.Ude i kommunerne, hvor slaget skal stå, er det langt fra alle, der synes, at mere natur er vejen frem, mener Mads Flinterup. Derfor kan omlægningsplanerne blive både komplekse og vanskelige.Se ogsåPå marker kæmper landets rigeste om at eje Danmarks nye guldKonfliktmægler Mie Marcussen, der er jurist med master i konfliktmægling fra Københavns Universitet, er enig.Vi bruger naturen forskelligt, og mange har stærke meninger om, hvordan natur skal se ud, og hvad ægte natur i det hele taget er. Det gør dialogen svær, mener konfliktmægleren:- Det her er bare begyndelsen. Vi kommer til at se mange flere konflikter på det her område. Netop natur er et højspændt område og genstand for megen debat. Konceptet ”vild med vilje” er et godt eksempel på noget, der deler vandene. Nogle elsker det. Andre hader det. Nogle synes, at vild natur er fantastisk. Andre synes, at vild natur er ukrudt og noget rod.Ambitionerne om mere natur og skov skal realiseres lokalt. Kan det lade sig gøre?- Man får svært ved at få folk til frivilligt at blive enige om, hvad der er bedst at bruge arealerne til. Det kræver central styring. Netop på det her område med opfattelsen af natur, er der så mange følelser på spil, og det skaber altid konflikter. Regeringen er nødt til at få taget hånd om processen og styre den. Ellers når man aldrig til enighed, siger Mie Marcussen.Kirke vil fortsætte dialogI Landdistrikternes Fællesråd håber formand Steffen Damsgaard, at kommuner, landmænd og øvrige jordejere vil sikre god dialog med naboer og lokalsamfund, mens den politisk vedtagne arealomlægning står på.- Det er afgørende med dialogmøder og høringer i kommunerne. Vi kommer ikke til at kunne gøre alle tilfredse i den her omlægning, men man skal selvfølgelig sørge for, at processen er så hensigtsmæssigt som muligt.Måske giver det også mening "at genbesøge målet om at få rejst 250.000 hektar skov", påpeger Steffen Damsgaard.- Det er vigtigt, at vi arbejder med landskaberne. Men de her mange hektar skov vil ændre landskabet og udsigten fra de enkelte borgeres hus. Derfor kunne man måske overveje at lave andre arealanvendelser på en del af det områderne, der giver den samme klimaeffekt. For eksempel store græsarealer.Se ogsåMilliardær vil have fat i mindst 1000 hektar landbrugsjord Formand for menighedsrådet i Nordstevns Pastorat, Nis Hatt, tager naboens bekymring til sig. Han er ansvarlig for at finde ud af, hvad der skal ske med de godt 12 hektar jord, Strøby Kirke ejer, og ser frem til at fortsætte dialogen med kirkens naboer.- Jeg synes, at det er fantastisk, at det her afstedkommer en konstruktiv dialog, omkring hvordan det danske landskab skal se ud i fremtiden, siger Nis Hatt, der "sætter stor pris på" naboernes engagement.- Det er godt, at folk har tid til at engagere i lokalområdet, og at vi får en diskussion om, hvad natur er. Både lokalt, regionalt og nationalt.Del artikelDelFacebookXE-mailLinkKopiér'
