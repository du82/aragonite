["https://nyheder.tv2.dk/live/udland/2025-03-01-trump-og-zelenskyj-skaendtes-for-aaben-skaerm-stil-dit-spoergsmaal-her"]
title = "Trump og Zelenskyj skændtes for åben skærm – stil dit spørgsmål her - TV 2"
description = "Hvad sker der? Den ukrainske præsident, Volodymyr Zelenskyj, forlod fredag Det Hvide Hus i utide. Han og USA's præsident, Donald Trump, skulle have underskreve..."
full_description = "Kl. 17.43Tak for i dag, vi fortsætter i morgen med Tantholdt Vi takker for jeres overvældende mængde af gode spørgsmål her i livechatten i kølvandet på gårsdagens ophedede skænderi mellem Ukraines præsident, Volodymyr Zelenskyj, og USA's præsident, Donald Trump.USA-kommentator Torsten Jansen, sikkerhedspolitiske kommentator Jacob Kaarsbo og TV 2s Europa-korrespondent Lise Toft Hessellund har besvaret jeres spørgsmål om blandt andet Trumps, Zelenskyj og Europas næste træk, Zelenskyjs valg om ikke at bære jakkesæt, hvorvidt Trump kan finde på at trække støtten helt, udsigten til fred og ikke mindst frygten for Tredje Verdenskrig og krig i Danmark. Læs dem og mange flere svar på jeres spørgsmål her i livechatten. Vi fortsætter livechatten i morgen, hvor TV 2s korrespondent Rasmus Tantholdt sidder klar fra Odesa i Ukraine til at besvare jeres spørgsmål. Del opslagDelFacebookXE-mailLinkKopiér Kl. 17.37Kaarsbo takker afSikkerhedspolitisk kommentator Jacob Kaarsbo takker af for nu. Del opslagDelFacebookXE-mailLinkKopiér Kl. 17.28SpørgsmålPaw andersen: Er det fuldstændigt utænkeligt at Trump kan blive frataget præsident posten ?SvarHmm med mindre han gør noget, hvor der kan startes en rigsretssag, så ser jeg det ikke for mig. Men en rigsretssag er politisk, og så kræver det, at republikanere går med. Og her må vi bare konstatere, at uanset hvad Trump siger og gør, og uanset hvad de fleste andre republikanere har sagt tidligere, så ender de altid med at stille sig bag Trump.Jeg mener, at stormløbet på Kongressen 6. januar 2021 var reelt et kupforsøg, men alligevel er han kommet tilbage. De fleste republikanere er bange for at gå imod ham, og derfor tror jeg ikke, han bliver afsat.Venlig hilsen Jacob KaarsboKontekst: Donald Trump blev sigtet for sin rolle i at opildne demonstranterne 6. januar 2021. En sag, som den særlige anklager bad om at få henlagt, efter Trump vandt valget i 2024. Forinden fandt Højesteret i USA også, at den siddende præsident har immunitet i en lang række sager, og at Trump muligvis ikke kan retsforfølges for sin rolle i angrebet. Desuden frikendte USA's senat tilbage i 2021 Donald Trump i rigsretssagen mod ham."
