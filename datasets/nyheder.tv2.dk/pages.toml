["https://nyheder.tv2.dk/samfund/2025-03-01-fastelavnsboller-stikker-helt-af-saelges-i-millionvis"]
title = "Fastelavnsboller stikker helt af – sælges i millionvis - TV 2"
description = "Salling Group bager flere millioner fastelavnsboller i år. Det traditionelle bagværk er blevet et &quot;festfyrværkeri&quot;, mener madhistoriker."
full_description = '''SamfundFastelavnsboller stikker helt af – sælges i millionvisSalling Group bager flere millioner fastelavnsboller i år. Det traditionelle bagværk er blevet et "festfyrværkeri", mener madhistoriker.Udarbejdet af TV2 ØstjyllandSalling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.Salling Groups bageri i Årslev ved Aarhus, laves der mellem 4000 og 5000 fastelavnsboller på en enkelt nat.I går kl. 19.18En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.En af de fastelavnsboller de laver hos bageriet Mor Anna i Aarhus.I går kl. 19.18Her har de for meget varme - det kan 'gaskommunen' måske drage nytte afHer har de for meget varme - det kan 'gaskommunen' måske drage nytte afI går kl. 19.47Tre grise stjålet fra kontroversiel udstilling i KøbenhavnTre grise stjålet fra kontroversiel udstilling i KøbenhavnI går kl. 17.35Politiet afspærrer yderligerePolitiet afspærrer yderligereI går kl. 14.14Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.Peter Drejer Nielsen har opsat videoovervågning i sin gårdbutik.I går kl. 13.42Politi er ikke længere massivt til stedePoliti er ikke længere massivt til stedeI går kl. 06.57Orange varevogn fjernes fra gerningsstedOrange varevogn fjernes fra gerningsstedI går kl. 06.46Fabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske statFabrikken i Elling – også kaldet 'Krudten' – har tidligere været brugt til at producere våben for den danske stat28. feb kl. 14.56Kendt frisør blev afvist som barnKendt frisør blev afvist som barn28. feb kl. 13.34Kig mod Europa, siger lektorKig mod Europa, siger lektor28. feb kl. 12.49- Vi vil vinde nogle år som minimum- Vi vil vinde nogle år som minimum28. feb kl. 12.18 I går kl. 19.32 Jakob Kryger TV2 ØstjyllandKlokken er fire om natten, og hundredevis af boller bliver fyldt med creme, marmelade og flødeskum.Til sidst får de hver et lille stykke chokolade på toppen.Vi er i Salling Groups bageri i Årslev ved Aarhus, hvor der laves mellem 4000 og 5000 fastelavnsboller på en enkelt nat.Fra Årslev bliver fastelavnsbollerne kørt ud til Salling Groups butikker i Østjylland. Foto: TV 2 ØstjyllandEn af de erfarne, der har sin gang i bageriet, er Jim Pedersen. Han har arbejdet som bager i over 30 år.- De er blevet meget mere farverige i dag. Nu handler det i højere grad om udsmykning, mens de tidligere bare fik et drys flormelis, siger Jim Pedersen.Fastelavnsboller i massevis Salling Group bager knap 1,2 millioner fastelavnsboller med fløde i fem varianter, næsten 2,4 millioner gammeldags fastelavnsboller i to varianter og cirka én million wienerbrøds-fastelavnsboller i fire varianter. Bagerierne bruger i alt over 70.500 kilo fløde, mere end 23.500 kilo flødecreme, knap 4.000 kilo blåbærkompot, mere end 4.000 kilo rabarberkompot og 6.400 kilo hindbærkompot. På de mest travle dage på bageriet i Årslev pisker en stor maskine omkring 800 kilo fløde til fastelavnsbollerne. Kilde: Salling Group 100 kilo cremePå én nat bruger bageriet i Årslev cirka 500 liter fløde, 50 kilo blåbær-, hindbær- og rabarbermarmelade samt 100 kilo creme.Og meget er altså sket, siden bager Jim Pedersen første gang lavede fastelavnsboller.Jim Pedersen foran fastelavnsbollerne med blåbær. Foto: TV 2 Østjylland- Jeg synes, at de er blevet mere spændende, end de var i gamle dage, lyder det fra Jim Pedersen, som i dag er produktionsleder.I alt bager Salling Group over 4,5 millioner fastelavnsboller fra 2. januar til 3. marts. Det er mere end en million flere end for bare seks år siden.Der laves i øjeblikket 5000 fastelavnsboller hver nat i Årslev. Foto: TV 2 ØstjyllandCaviar og bladguldMen det er ikke kun antallet af bagte fastelavnsboller hos Salling Group, der slår rekord. Også indholdet i det traditionelle bagværk bliver vildere år for år, og næsten kun fantasien sætter grænser for, hvad der i dag bliver puttet i fastelavnsbollerne.Udviklingen af fastelavnsboller er enormBettina Buhl, madhistorikerPriserne varierer også voldsomt. For eksempel koster en gammeldags fastelavnsbolle hos Føtex ti kroner, mens man hos d'Angleterre i København finder Danmarks – formentlig – dyreste til 345 kroner.For de penge får man chefkonditorens bud på en nytænkende bolle uden begrænsninger – inklusiv nogle meget utraditionelle ingredienser.Danmarks formentlig dyreste fastelavnsbolle, der koster 345 kroner. Foto: Hotel d’AngleterrePå toppen er nemlig både caviar og bladguld.Et festfyrværkeriFastelavnsbollen går mange hundrede år tilbage i tiden, siger Bettina Buhl, som er madhistoriker hos det Grønne Museum.Dengang spiste man den til en fest inden en 40 dages faste. Her kom alt det, der gjorde folk glade, på bordet.Madhistoriker Bettina Buhl med en moderne fastelavnsbolle. Foto: TV 2 ØstjyllandOg noget tyder altså på, at bollen stadig gør folk glade – dog i nye klæder.- Udviklingen af fastelavnsboller er enorm – fra den lille, simple hvedebolle til det her festfyrværkeri, som fastelavnsbollen er blevet for os danskere, siger madhistorikeren.Fasten forsvandt, da Danmark blev protestantisk i starten af 1500-tallet, men traditionen med fastelavn holdt ved. Og i 1950'erne fik den klassiske hvedebolle tilføjet creme og flødeskum. Video: TV 2 ØstjyllandI 2017 spiste 37 procent af danskerne mindst én fastelavnsbolle, og i 2024 var tallet steget til 52 procent.Del artikelDelFacebookXE-mailLinkKopiérUdarbejdet af TV2 ØstjyllandSe ogsåBrunt værtshus i vigtigt kapløb – kan blive landets hyggeligsteDavid Nielsen bliver ny cheftræner i AC HorsensGrønland ønsker udvidelse af afsnit på Aarhus Universitetshospital'''
