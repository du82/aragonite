title = 'Søren Gade ser "ikke noget odiøst" i Michelin-middag – landsretten kalder det bestikkelse - TV 2'
description = "Flere tidligere chefer i Forsvaret fortæller, at de har spist middage betalt af forsvarsindustrien. De kan have brudt loven, vurderer professor."
full_description = '''BusinessSøren Gade ser "ikke noget odiøst" i Michelin-middag – landsretten kalder det bestikkelseFlere tidligere chefer i Forsvaret fortæller, at de har spist middage betalt af forsvarsindustrien. De kan have brudt loven, vurderer professor.Folketingets formand, Søren Gade (V), er en af dem, der i kraft af sin tidligere rolle som forsvarsminister har vidnet i landsretten i forbindelse med en sag om bestikkelse. Arkivfoto. Foto: Bo Amstrup / Ritzau Scanpix / Ritzau Scanpix 21. feb kl. 05.28Mathilde Graversen & Kasper Randrup-ThomsenBåde byretten og landsretten kalder det bestikkelse. Men det er "normalt", "ikke problematisk", "inden for rammen" og "kutyme".Sådan lyder det fra en række tidligere topchefer i Forsvaret heriblandt forhenværende forsvarsminister Søren Gade (V), der i dag er formand for Folketinget.Det kan TV 2 nu fortælle på baggrund af en retssag mod en major, der i november blev idømt ti dages betinget fængsel ved Østre Landsret. Han blev dømt for bestikkelse, fordi han tilbage i 2011 spiste middag på Michelin-restauranten Kong Hans Kælder i selskab med en leverandør til Forsvaret – på leverandørens regning.Det var, og er fortsat, kutyme, at det er leverandørerne, der betaler for madenSøren Gade, tidligere forsvarsministerForsvarsindustrien har altså ikke alene forsynet det danske forsvar med militært isenkram. Ifølge vidneudsagnene har industrien også forsynet Forsvarets medarbejdere med gode middage – og flere af de tidligere topchefer ser fortsat ikke noget problem i denne praksis i dag.Men der er tale om overtrædelse af "helt grundlæggende bestikkelseslovgivning", fortæller Sten Bønsing, der er professor i forvaltningsret på Aalborg Universitet.Se ogsåTidligere chef i Forsvaret dømt for bestikkelseJesper Olsen, der er formand for organisationen Transparency International, som arbejder for at bekæmpe korruption og bestikkelse, mener også, at det er problematisk.- Vi står over for en opgave med at købe nyt forsvarsudstyr for mange milliarder kroner. Og nu taler politikere også om en krigsskat. Vi har brug for maksimal tillid, og det får man ikke, hvis der ikke tages afstand fra en smørelseskultur med dyre middage betalt af våbenproducenter, siger han.Netop nu er Forsvarets håndtering af indkøb øverst på dagsordenen, efter regeringen har givet Forsvaret endnu flere penge og mere magt til selv at styre indkøbene.Sagen kort: Kong Hans KælderMajoren var i 2011 chef for våben og ammunitionssektionen i Forsvarets Materieltjeneste – det, som i dag hedder Forsvarsministeriets Materiel- og Indkøbsstyrelse (FMI). Dengang blev han inviteret til et møde på Michelin-restauranten Kong Hans Kælder af den spanske våbenleverandør Expal, efter Forsvaret havde klaget over problemer med ammunition fra Expal. Det er TV 2s dokumentarprogram 'Operation X', der i første omgang omtalte middagen i 2020, og Forsvarets Auditørkorps rejste derefter tiltale i sagen. Nu har både byret og landsret gjort det klart, at majoren ved at tage imod middagen har overtrådt straffelovens paragraf 144 og gjort sig skyldig i bestikkelse. Han er ved Østre Landsret 13. november 2024 blevet idømt 10 dages betinget fængsel. - Dette var normalt, og det var ikke et problemHelt grundlæggende er reglen, at offentligt ansatte ikke må modtage en gave eller anden fordel fra private i kraft af deres offentlige rolle.Ansatte i Forsvaret må derfor ikke mødes med en privat våbenleverandør, hvor det primære formål er at spise. Og de må heller ikke tage imod en middag i arbejdssammenhæng, der går udover en beskeden middag eller frokost, forklarer Sten Bønsing.- Det er helt traditionelt, at offentligt ansatte skal holdes rene, siger han.Alligevel har tidligere topfolk i Forsvaret på stribe nu fortalt i landsretten, at det tilbage i starten af 2010'erne var helt almindelig praksis at spise middage på restauranter, der blev betalt af forsvarsindustrien.Se ogsåDen bedste beslutning i ti år eller begyndelsen på nye skandaler?En tidligere chef i det, der før hed Forsvarets Materieltjeneste, har forklaret, at møder normalt blev afholdt hos leverandøren eller Forsvarets Materieltjeneste, men at man efterfølgende kunne tage ud og spise med våbenleverandøren.- Dette var normalt, og det var ikke et problem, at leverandøren betalte for middagen, fortalte han i landsretten ifølge domsresuméet, hvor han tilføjede, at der ikke var regler for, hvad sådan en middag måtte koste.En anden tidligere chef forklarede i retten, at man ikke måtte modtage gaver, men at man godt kunne lade en leverandør betale for forplejning. Det var "normalt" at få betalt restaurantbesøg, når man besøgte leverandører i udlandet, og det var "ikke problematisk", fordi en middag ikke udgør en vedvarende berigelse, lød hans forklaring.En tredje chef, der har været ansat i en anden del af Forsvaret, fortalte i retten, at "det er hans opfattelse, at det var inden for rammen at blive inviteret på Kong Hans Kælder".Du skal holde op med at opfatte det som en gave, for det er det ikke. Det er en middagEigil Schjønning, tidligere chef for Hærens KampskoleSelv den tidligere forsvarsminister og nuværende formand for Folketinget Søren Gade (V) fortalte som vidne i retten, at det ville undre ham, hvis ikke flere medarbejdere i Forsvaret har spist med leverandører som led i deres arbejde.- Det var og er fortsat kutyme, at det er leverandørerne, der betaler for maden, fortalte han i landsretten ifølge domsresuméet.Se ogsåRegeringen opretter særlig forsvarsfond med milliarderUndrer sig over Søren Gades udtalelserSøren Gade mener ikke, at der er "noget odiøst i, at en medarbejder, der inviteres på Kong Hans Kælder, tager imod invitationen", og han forklarede i retten, at det er en "almindelig del af ens arbejde" og "i nationens tjeneste", hvis der er en saglig begrundelse for mødet.Når Jesper Olsen fra Transparency International læser domsresuméet, undrer han sig særligt over udtalelserne fra netop den tidligere forsvarsminister og nuværende formand for Folketinget.- Han sender et signal om, at det, som er lov og ret her i landet, i virkeligheden er noget underligt noget. At det er noget pjat, siger han med henvisning til Søren Gades kommentar om, at der ikke er noget odiøst i den kutyme.Jesper Olsen mener, at Søren Gade skylder at kommentere på, at landsretten nu ligesom byretten har slået fast, at der er tale om bestikkelse, når en ansat i Forsvaret tager imod en middag på en Michelin-restaurant fra en leverandør.- Det her handler jo også om at sende et politisk signal, siger han.Se ogsåSå langt er Europa fra at kunne forsvare sig selv mod RuslandSøren Gade afviser at stille op til interview om sagen, og han ønsker heller ikke at kommentere kritikken fra Transparency International.- Min forklaring står i retsbogen, og dommen tages selvfølgelig til efterretning, skriver han til TV 2.Vidner kan også være skyldigeI landsretten fortalte flere vidner, at de også selv har spist middage, der var betalt af forsvarsindustrien.Dermed kan de ligeledes have gjort sig skyldige i at modtage bestikkelse, lyder det fra Sten Bønsing.- Det er svært at svare på, når man ikke kender sagerne i detaljer, men jeg vil tro, at det har været ulovligt, siger juraprofessoren.Straffeloven § 144 om modtagelse af bestikkelseDen, der i udøvelse af dansk, udenlandsk eller international offentlig tjeneste eller hverv uberettiget modtager, fordrer eller lader sig tilsige en gave eller anden fordel, straffes med bøde eller fængsel indtil 6 år. Søren Gade fortalte i retten, at han som minister "har spist sig gennem rigtig mange middage" på våbenmesser i udlandet betalt af våbenleverandører, hvor han ikke har kendt kuvertprisen.Som forsvarsminister anså han det som "en del af opgaven", og som vidne fremførte han, at en middag i hans optik ikke kan påvirke en medarbejder og sidestilles med en gave.En af de tidligere chefer i Forsvarets indkøbsafdeling fortalte også, at han ofte selv har været ude at spise med leverandører, som betalte for middagen, når han besøgte leverandører i udlandet. Og at han "meget vel" kan have spist på Michelin-restauranter uden at vide det.Et tredje vidne fortalte i landsretten, at han endda selv har deltaget i en middag på Kong Hans Kælder betalt af en leverandør.Dette vidne er Eigil Schjønning, der fra 2005 til 2010 var chef for Hærens Kampskole, som havde et tæt samarbejde med våbenindustrien. Han har sagt ja til at uddybe sine pointer fra landsretten i et interview med TV 2.- Hvad fanden bilder du dig ind?Over for TV 2 uddyber Eigil Schjønning, at det var beordret tjeneste, da han som brigadechef i slutningen af 00'erne deltog i en middag på Kong Hans Kælder.Det svenske våben-, fly- og elektronikfirma Saab skulle levere et operativt computersystem til Forsvaret og betalte for middagen, hvor der blev talt om status for computersystemet, fortæller han.Derudover har han også deltaget i "op mod ti" middage i Oksbøl samt middage og receptioner i udlandet i forbindelse med våbenudstillinger.- Der må ikke være mistanke om noget som helst. Men at deltage i en middag i forlængelse af et møde, hvor drøftelserne fortsætter, det er ikke bestikkelse, fastholder Eigil Schjønning, der blev pensioneret fra Forsvaret i 2017.Han nævner selv, at der var store problemer med den spanske våbenleverandør, der tilbage i 2011 inviterede den nu dømte major på Kong Hans Kælder.Kan du så ikke se, at det for udenforstående kan virke som om, firmaet prøver at smøre ansatte i Forsvaret ved at købe dem en dyr middag på Kong Hans Kælder?- Joh, det kan jeg da godt se. Men det har bare ikke noget at gøre med sagen. For det er ikke en gave, siger han.Se også- Jeg vil ikke have det siddende på Danmarks navn, fastslår Mette Frederiksen Eigil Schjønning fastholder trods dommen i by- og landsretten, at en middag på Kong Hans Kælder "ligger fuldstændig inden for det", som han opfatter som "det rigtige". Hvis nogen skal kritiseres, er det våbenleverandøren, lyder det.- Jeg vil bare vende mig mod den spanske våbenleverandør og sige: "Hvad fanden bilder du dig ind at lave den her middag på Kong Hans?" Det er jo lige præcis en måde at bringe den her major i uføre på. Fordi nogen kan sige: "Ah, hvordan kan det være?"Er det ikke en ansvarsfraskrivelse at skyde skylden på den spanske våbenleverandør, når det er nogen fra Forsvaret, der modtager den her middag?- Du skal holde op med at opfatte det som en gave, for det er det ikke. Det er en middag, som de deltager i. De skal bare ikke selv betale for den. Det er ikke en gave, siger Eigil Schjønning.Nyere sager om bestikkelse og misbrug i ForsvaretSager om bestikkelse, svindel og vennetjenester har de senere år plaget Forsvaret og Forsvarsministeriet. Rigsrevisionen har også flere gange peget på problemer med økonomistyring og indkøb i Forsvaret, hvor der blandt andet er fundet svigt af basale regnskabs- og kontrolregler. I 2024 blev en tidligere kontorchef i Forsvarets Ejendomsstyrelse i Vestre Landsret idømt seks måneders betinget fængsel for bestikkelse, efter han modtog et køkken, en markise samt hårde hvidevarer, som han fik leveret privat fra styrelsens leverandører, imens regningen endte i styrelsen. I samme sag blev en tidligere projektleder i styrelsen idømt tre års fængsel. Svindlen foregik i årene 2013-2019. I 2020 blev en tidligere hærchef i Vestre Landsret idømt tre måneders fængsel for forsøg på magtmisbrug. Han var blandt andet tiltalt for at have misbrugt sin stilling til at ændre optagelseskrav, så hans daværende kæreste kunne komme ind på en eftertragtet uddannelse i hæren. I 2018 blev en tidligere chef på krigsskibet Absalon idømt 20 dages betinget fængsel i Østre Landsret for mandatsvig, efter han havde brugt Forsvarets penge på en maltesisk stripklub. I kølvandet på denne sag kunne Berlingske i senere berette, at Forsvarsministeriets Auditørkorps i 2019 modtog i alt 68 sager om ansatte, der brugte deres kort uberettiget. En del af sagerne var bagateller, men i seks sager afsluttet i 2019 blev ansatte straffet for misbrug. En vigtig grundpille i samfundetSelvom flere af de tidligere topfolk i Forsvaret ikke mener, at der kan være tale om bestikkelse, når man modtager en middag på en Michelin-restaurant, så er loven ifølge Sten Bønsing ganske klar.Og det er afgørende, at den bliver overholdt, lyder det.Det er afgørende, at der ikke kan opstå situationer, hvor der kan herske tvivl om, at ansatte i Forsvaret handler sagligt og upartiskTroels Lund Poulsen, forsvarsministerSelv hvis Forsvarets ansatte ikke er blevet påvirket af en dyr middag, så er alene mistanken, der kan opstå ved at have modtaget middagen – dels hos andre våbenleverandører i branchen og i den almene befolkning – dybt problematisk, forklarer Sten Bønsing.For eksempel kan andre konkurrenter undlade at byde på en opgave, hvis de har en opfattelse af, at en bestemt leverandør giver dyre middage og dermed har en bedre chance for at få en opgave. Så risikerer vi som samfund, at vi ikke får det bedste tilbud.Det er også problematisk, hvis der i befolkningen breder sig en opfattelse af, at offentligt ansatte administrerer efter hensyntagen til deres egen private lomme og fornøjelse – og ikke samfundets bedste.- Det er en vigtig grundpille i vores samfund, at man har tillid til, at de offentlige myndigheder varetager deres opgaver, som de skal, siger Sten Bønsing.Se ogsåForsvarschefer blev sendt på luksusrejse inden stor indkøbsaftaleJesper Olsen fra Transparency International mener også, at landretten går i "lige præcist de små sko, man skal gå i".- For der skal ikke være en smørelseskultur rundt om offentlige leverandører, siger han.Retningslinjer er ved at blive opdateretForsvarsminister Troels Lund Poulsen (V) har afvist at stille op til mundtligt interview med TV 2 om sagen. I stedet har ministeriet taget imod skriftlige spørgsmål.Ministeren svarer dog ikke på TV 2s spørgsmål om, hvorvidt der i Forsvaret stadig hersker den opfattelse, at det er inden for skiven at få betalt en dyr middag af en våbenleverandør, eller om ansatte stadig spiser restaurantmiddage betalt af leverandører.Adspurgt om ministeren selv har spist middage betalt af forsvarsindustrien, og hvorvidt han i så fald har været opmærksom på prisen, henviser han til Økonomistyrelsens åbne oversigt over de gaver, ministre modtager.Enten har Troels Lund Poulsen ikke modtaget en eneste dyr middag, eller også er det ikke blevet registreret som en gave, for af hans gavelister på styrelsens hjemmeside fremgår der ikke en eneste middag.Se ogsåFire personer frifindes i bestikkelsessag i ForsvaretTroels Lund Poulsen skriver, at det er "afgørende, at der ikke kan opstå situationer, hvor der kan herske tvivl om, at ansatte i Forsvaret handler sagligt og upartisk". Og at der findes vejledninger og bestemmelser, som de ansatte derfor skal følge:- Det er det klare udgangspunkt, at Forsvarets ansatte ikke modtager gaver eller andre fordele fra virksomheder i forbindelse med deres arbejde, men det fremgår af 'God adfærd i det offentlige', at ansatte i visse tilfælde – og i et ikke upassende omf'''
