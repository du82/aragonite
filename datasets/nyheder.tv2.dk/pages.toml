["https://nyheder.tv2.dk/business/2025-02-27-tusindvis-af-danskere-har-tjent-stort-paa-denne-aktie-men-nye-farer-lurer"]
title = "Tusindvis af danskere har tjent stort på denne aktie, men nye farer lurer - TV 2"
description = "Nvidia har gennem flere år været en aktieraket med kurs mod himlen, men ny konkurrent kan stikke en kæp i hjulet på chipgiganten."
full_description = 'BusinessTusindvis af danskere har tjent stort på denne aktie, men nye farer lurerNvidia har gennem flere år været en aktieraket med kurs mod himlen, men ny konkurrent kan stikke en kæp i hjulet på chipgiganten.Selskabet er blandt de absolut største i verden. Foto: Dado Ruvic / Ritzau Scanpix 27. feb kl. 19.55Andreas PinstrupChipgiganten Nvidia bragede ud af 2024 med et overskud på 519 milliarder kroner og en aktiekurs, der i løbet af det forgangne år steg 187 procent.Med på himmelfarten har været tusindvis af danskere, der gennem flere år har kunnet spinde guld på, at verdens næststørste selskab igen og igen har slået rekorder.Se ogsåRegeringen vil investere i våben – skal du også det?Men under den eksplosive vækst ulmer en usikkerhed, man normalt ikke forbinder med et overskud på 519.000.000.000 kroner.- Selvom Nvidia med dette regnskab overgår forventningerne, så er fremtidsudsigterne mere mudrede, siger aktiechef hos Danica Pension, Esben Saxbeck Larsen.Regnskabet har dagen derpå ikke haft nogen positiv effekt på selskabets aktiekurs, der ved markedets åbning tog et dyk på minus tre procent.En dansk-amerikansk folkeaktieNovo Nordisk, Ørsted og Vestas. Tre store danske virksomheder, som danskerne stolt investerer sine sparepenge i. Alene på handelsplatformen Nordnet har 43.000 danskere købt aktier i Ørsted.Men en anden aktie, danskerne har lige så nær som den danske havvindkæmpe, er amerikanske Nvidia. 42.000 danskere købt aktier i den amerikanske techgigant.Udover de aktive køb er der endnu flere danskere, der har Nvidia-aktien som en del af indeksfonde.!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Kigger vi ud over de private investorer, så er antallet af danskere, der bør følge Nvidia-kursen dog langt større.Tager man alene de tre største kommercielle pensionsselskaber Velliv, PFA og Danica Pension, så har de sammen aktier i chipproducenten for 21 milliarder danske kroner.- Nvidia har været den største bidragsyder til de flotte resultater, vi har set på pensionsfronten de seneste to-tre år, lyder det fra Danica Pensions Esben Saxbeck Larsen.Se ogsåChipproducent gør comeback efter rekordstort tabHan uddyber, at Nvidia med deres produktion af mikrochips sætter tonen for markedet omkring kunstig intelligens (AI). Et marked, der siden lanceringen af ChatGPT i november 2022, har sendt aktiekursen op med 745 procent.Og med introduktionen af de nye AI-chips, de såkaldte Blackwell-chips, spår selskabets administrerende direktør, Jensen Huang, endnu mere vækst i sigte:- Vi har haft succes med at opskalere produktionen af AI-supercomputere med Blackwell. AI udvikler sig med lysets hastighed.Kinesisk konkurrent skaber usikkerhedPå trods af et overskud på over 500.000.000.000 kroner har Nvidia den seneste tid ikke kun været omgærdet af succes.I slutningen af januar bragede aktien pludselig ned med tolv procent, hvilket svarede til, at de mistede hele Novo Nordisks samlede værdi i løbet af én dag.Det skete, da kinesiske DeepSeek gjorde sit indtog på markedet for kunstig intelligens. Her præsenterede de en model, der kunne konkurrere med de bedste amerikanske versioner fra Google og OpenAI, mens de samtidig kunne producere dem til en tyvendedel af prisen.Se ogsåNu melder Elon Musk sig ind i kapløbet om kunstig intelligens: - Den er iskold over for etik og moral, siger ekspertDen pludselig kinesiske konkurrence rystede techmarkedet så meget, at Nvidia faldt fra tronen som verden mest værdifulde selskab og blev overhalet af Apple.Nvidia har siden det kinesiske chok genvundet fodfæste, og aktiekursen er siden årsskiftet nede med cirka 2 procent, men selvom stormen for nu er drevet over, så har det også givet anledning til mere pessimisme blandt investorerne.- Selvom Nvidia siger, at det nok skal gå fremad, så er der noget usikkerhed, og det gør, at de er lidt mere konservative i, hvordan de guider markedet, lyder det fra aktiechef, Esben Saxbeck Larsen.Del artikelDelFacebookXE-mailLinkKopiér'
