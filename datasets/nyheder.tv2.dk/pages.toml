["https://nyheder.tv2.dk/business/2025-02-21-novo-saetter-stopper-for-kopimedicin-i-usa"]
title = "Novo sætter stopper for kopimedicin i USA - TV 2"
description = "Kopiproducenter får mellem 60 og 90 dage til at indstille salget af populære Novo-midler i USA."
full_description = "BusinessNovo sætter stopper for kopimedicin i USAKopiproducenter får mellem 60 og 90 dage til at indstille salget af populære Novo-midler i USA.Novo sætter produktionen i vejret for at stoppe kopister. Foto: Tom Ittle / Ritzau Scanpix 21. feb kl. 19.12RitzauDet er lykkedes for den danske medicinalgigant Novo Nordisk at skrue op for produktionen af Wegovy og Ozempic, så der ikke længere er mangel i USA.Det melder landets fødevare- og lægemiddelstyrelse, FDA, som har fjernet de to lægemidler fra en liste over medicin, der ikke leveres nok af.Så længe der har været mangel, har det været tilladt for andre producenter at sælge kopier af Novo-midlerne.Men nu kan Novo Nordisk selv følge med efterspørgslen på Wegovy og Ozempic, som bruges til at behandle henholdsvis fedme og diabetes.Kopiproducenterne får mellem 60 og 90 dage til at indstille salget, oplyser FDA.USA er et vigtigt marked for Novo, som har haft det som en af sine største prioriteter at øge produktionskapaciteten.Alene i år har den danske virksomhed investeret 6,5 milliarder dollar i USA, skriver Novo Nordisk i en pressemeddelelse. Det svarer til over 46 milliarder kroner.- Vi er glade for, at FDA har meldt ud, at der er styr på forsyningen af de eneste lægemidler med semaglutid, der er godkendt af FDA, skriver Novo.Både Wegovy og Ozempic indeholder stoffet semaglutid. Det øger frigørelsen af insulin i kroppen og påvirker appetitten.Ozempic blev godkendt i USA i 2017, mens Wegovy kom til i 2021.Begge lægemidler steg hurtigt i popularitet. Så hurtigt, at Novo ikke har kunnet levere nok til landet, som har over 300 millioner indbyggere.Mens der har været mangel, har 200.000 patienter hver måned købt semaglutid produceret af andre virksomheder end Novo Nordisk.Men de må snart gå tilbage til den originale - og dyrere - Novo-medicin.Udsigten til kopiernes retræte fra markedet har været godt nyt for Novo-aktien. Fredag er den steget med 5,8 procent. En Novo-aktie koster nu 630 kroner.Trods stigningen er der dog stadig et godt stykke op til den markedsværdi, som Novo kunne præstere i sommer. Her røg prisen for en enkelt aktie op på over 1000 kroner./ritzau/ReutersDel artikelDelFacebookXE-mailLinkKopiér"
