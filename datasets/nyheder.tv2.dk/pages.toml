["https://nyheder.tv2.dk/udland/2025-03-02-dommer-erklaerer-trump-fyring-af-vagthund-for-ulovlig"]
title = "Dommer erklærer Trump-fyring af vagthund for ulovlig - TV 2"
description = "Donald Trumps fyring af en vagthund for offentligt ansatte er erklæret ulovlig af en føderal dommer."
full_description = "UdlandDommer erklærer Trump-fyring af vagthund for ulovligDonald Trumps fyring af en vagthund for offentligt ansatte er erklæret ulovlig af en føderal dommer.Hampton Dellinger er chef for det uafhængige agentur, Office of Special Counsel, der skal beskytte offentligt ansatte whistleblowere mod repressalier. ARKIVFOTO. Foto: U.S. Office Of Special Counsel / Ritzau Scanpix I dag kl. 05.20RitzauEn føderal dommer har erklæret USA's præsident Donald Trumps fyring af den føderale vagthund Hampton Dellinger for ulovlig.Det skriver nyhedsbureauet Reuters.Hampton Dellinger har det seneste år været øverste chef for det uafhængige agentur, Office of Special Counsel, der skal beskytte offentligt ansatte whistleblowere mod repressalier.Donald Trump valgte efter sin indsættelse 20. januar at fyre Dellinger, der blev ansat under forgængeren, demokraten Joe Biden.Ender i HøjesteretHvis fyringen af Dellinger fik lov til at stå ved magt, mener den føderale dommer Amy Berman Jackson, at det ville give Trump en forfatningsmæssig tilladelse til at mobbe embedsmænd til at følge hans vilje.Derfor har dommeren valgt at erklære fyringen ulovlig. Sagen ender formentlig i USA's Højesteret, skriver Reuters.Selv om Hampton Dellinger modtog en fyreseddel fra Trump-administrationen i februar, har Amy Berman Jackson bestemt, at Dellinger får lov til at passe sit arbejde, indtil en retssag er afgjort.Offentligt ansatte har modtaget mailDellinger, der i sidste uge blev ansat på en femårig periode, glæder sig over støtten fra den føderale dommer.Han betegner det som ironisk, at han som vagthund skulle frygte for at blive ofret i en vilkårlig og partisk fyring.Siden Donald Trump overtog præsidentposten for halvanden måned siden, har han annonceret store besparelser i det offentlige.Trump har hyret rigmanden Elon Musk til at stå i spidsen for effektiviseringsenheden, Doge. Elon Musk har sagt, at han vil spare fire milliarder dollar om dagen i en omfattende føderal spareplan.Offentligt ansatte har fået en mail, hvor de skal gøre rede for, hvad de har udrettet i den foregående uge. Hvis de ikke svarede på mailen, truede Musk med, at det ville blive betragtet som en opsigelse.Del artikelDelFacebookXE-mailLinkKopiér"
