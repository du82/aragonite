["https://nyheder.tv2.dk/udland/2025-02-27-kvinde-haevder-hun-blev-forbigaaet-og-degraderet-fordi-hun-var-heteroseksuel"]
title = "Kvinde hævder, hun blev forbigået og degraderet, fordi hun var heteroseksuel - TV 2"
description = "Anklageren hævder, at det er forfatningsstridigt, at majoritetsgrupper skal fremvise en større bevisbyrde. Flere frygter for retssagens konsekvenser."
full_description = '''UdlandKvinde hævder, hun blev forbigået og degraderet, fordi hun var heteroseksuelAnklageren hævder, at det er forfatningsstridigt, at majoritetsgrupper skal fremvise en større bevisbyrde. Flere frygter for retssagens konsekvenser.Mens flere organisationer frygter, at Marlean Ames’ retssag kan tage ligestillingskampen et skridt tilbage i USA, ser hun sig selv som en forkæmper for ligestilling. Foto: Megan Jelinger / Ritzau Scanpix I går kl. 14.00Salka Cordt AndersenEn sag om ”omvendt diskrimination” har ført den 60-årige Marlean Ames fra delstaten Ohio hele vejen til USA's højesteret.Afgørelsen kan ifølge flere internationale medier ”ændre årtiers ligestillingsgarantier” på arbejdsmarkedet i flere amerikanske delstater.Sagen begyndte, da Marlean Ames i 2019 søgte om en forfremmelse i sit job i Ohios statslige myndighed for ungdomstilbud.Hvis hun vinder, vil strømmen af ​​påstande om omvendt forskelsbehandling ligne noget, vi aldrig nogensinde har set førJohnny C. Taylor Jr., administrerende direktør for hr-foreningen SHRMJobbet fik hun ikke. I stedet blev hun kort tid efter degraderet til en lavere stilling.Ifølge The Washington Post blev hendes løncheck skåret med 40.000 dollars om året.Årsagen var imidlertid ikke Ames' faglige kvalifikationer, men skyldtes i stedet alene det faktum, at hun er heteroseksuel.Det hævder kvinden i hvert fald selv, og derfor lagde hun sag an mod sin tidligere arbejdsgiver, som hun beskylder for diskrimination på baggrund af hendes seksualitet – altså hendes heteroseksualitet.Håb forude for heteroseksuel kvindeBåde Ames' oprindelige stilling og stillingen, som hun søgte, blev ifølge retsdokumenter besat af mennesker med en homoseksuel orientering.Ifølge den 60-årige kvinde var de begge mindre kvalificerede til jobbet end hende. Derudover argumenterer hun for, at også hendes daværende chef er homoseksuel.Da Marlean Ames i første omgang anlagde sagen mod Ohio Department of Youth Services, dømte de lavere retsinstanser til fordel for hendes daværende arbejdsplads.Se ogsåNyt budskab fra heteroseksuelle kvinder spreder sig efter Trump-sejrDerfor tog hun sagen til højesteret, hvor en høring fandt sted denne onsdag.Ifølge BBC er en overvægt af sagens dommere konservative, hvorfor der er større mulighed for, at dommen vil falde i Ames' favør. Mediet bemærker desuden, at dommere på begge side af det politiske spektrum udviste sympati for hendes sag.Bevisbyrden kan variereDa Marlean Ames i første omgang tabte retssagen, lød begrundelsen, at hun manglede dokumentation for sin anklage om diskrimination.Det er kravet til mængden af dokumentation, hun skulle fremlægge, som hendes anklager nu går i rette med.Ifølge BBC er sagsøgere i sager om "omvendt diskrimination" nemlig forpligtede til at fremvise flere beviser.Præcedens fra tidligere sager viser, at flere amerikanske domstole har krævet en større bevisbyrde, når hvide mennesker og heteroseksuelle har fremsat anklager om diskrimination.Se ogsåTrump har erklæret krig mod tre bogstaver, men måske er hans motiv langt mere udspekuleretDet kunne være dokumentation, der kan påvise et mønster af diskrimination, eller at den diskriminerende part er en minoritet, skriver The Washington Post.Mennesker, der tilhører minoritetsgrupper, skal imidlertid ikke opfylde samme krav ved retssagens start, skriver CNN.Da jeg indbragte sagen, anede jeg ikke, at jeg ville få sværere end andre ved at løfte bevisbyrdenMarlean AmesEn praksis, som Ames' anklager hævder er i strid med den amerikanske forfatning.Den vurdering ser flere af høringens dommere ud til at tilslutte sig, skriver BBC.- Det burde være ligegyldigt, om hun er homoseksuel eller heteroseksuel, den juridiske byrde bør være den samme, sagde den konservative dommer Amy Coney Barrett.Kan føre til et hav af kommende søgsmålFlere frygter dog for konsekvenserne, hvis en sejr til Ames vil danne præcedens for fremtidig retspraksis.- Hvis hun vinder, vil strømmen af ​​påstande om omvendt forskelsbehandling ligne noget, vi aldrig nogensinde har set før. Heteroseksuelle, hvide mennesker overalt vil kunne sagsøge, siger Johnny C. Taylor Jr., som er administrerende direktør for hr-foreningen SHRM.Se ogsåTrump har givet ham én særlig opgave – han skal gøre op med "wokeisme" i verdens mest magtfulde militærHos advokatfirmaet og borgerrettighedsorganisationen NAACP Legal Defense and Education Fund er der også bekymring.Organisationen skriver blandt andet, at kravet til majoritetsgrupper er ”passende” på grund af den strukturelle racisme i USA.- Sorte mennesker og andre minoriteter har historisk set været ofre for bias, mens "omvendt diskrimination" er sjælden, lyder det.Springbræt for Trump-administrationAmerikanske arbejdsgivere følger også sagen nøje, fortæller arbejdsretsekspert Julie Levinson Werner til The Washington Post.Hun ser retssagen som et stort vendepunkt i den nationale debat, når det gælder arbejdet med mangfoldighed.Selvom sagen ikke direkte handler om såkaldte DEI-programmer, der har til formål at fremme diversitet, frygter flere nemlig, at den kan gå ud over den slags programmer, som den amerikanske præsident, Donald Trump, allerede har erklæret krig mod.Se ogsåTrump hævder at forsvare kvinder mod "kønsideologisk ekstremisme"Ifølge Jason Solomon, direktør for National Institute for Workers’ Rights, kan det ligefrem blive et springbræt for Trump-administrationen, når den ”forsøger at udhule antidiskriminationsloven”.For Ames er sagen et spørgsmål om både ligestilling og retfærdighed.- Da jeg indbragte sagen, anede jeg ikke, at jeg ville få sværere end andre ved at løfte bevisbyrden. Jeg ønsker, at alle, der føler, at de er blevet diskrimineret, får en fair chance og ikke bliver skubbet hen i et hjørne og afskediget, bare fordi de tilhører en majoritet, siger hun ifølge The Washington Post.USA's højesteret har endnu ikke truffet en afgørelse i sagen.Del artikelDelFacebookXE-mailLinkKopiér'''
