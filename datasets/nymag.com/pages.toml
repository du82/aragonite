["https://nymag.com/intelligencer/article/barack-michelle-obama-divorce-rumors-subtweet.html"]
title = "Barack & Michelle Obama Quash Divorce Rumors via Subtweet"
description = "Barack and Michelle Obama quashed divorce rumors via subtweet. Michelle made news by skipping the Carter funeral and Trump inauguration. But their Valentine’s X posts suggest they’re still together, and Barack isn’t cheating with Jennifer Aniston."
full_description = '''conspiracy theories Updated Feb. 15, 2025 Barack and Michelle Obama Quash Divorce Rumors via Subtweet By Margaret Hartmann, senior editor for Intelligencer who has worked at New York since 2012 Photo: @BarackObama/X Michelle Obama skipped both Jimmy Carter’s state funeral and Donald Trump’s second inauguration last month. So obviously, Michelle and Barack are … getting a divorce? There is a huge pile of evidence that Michelle Obama did not attend these events because she really hates Trump. There is pretty much no evidence that she’s trying to avoid her husband of 32 years, unless In Touch is your most trusted news source, you don’t understand satire, and you refuse to accept Jennifer Aniston’s insistence that she is not having a torrid affair with Barack. Nevertheless, there’s been a ton of speculation recently that the former president and First Lady are separated, or maybe even headed for divorce. The Obamas (sort of) addressed the rumors in a pair of subtweets on January 17. Barack posted this message on X, wishing a happy birthday to the “love of my life.” Happy birthday to the love of my life, @MichelleObama. You fill every room with warmth, wisdom, humor, and grace – and you look good doing it. I’m so lucky to be able to take on life's adventures with you. Love you! pic.twitter.com/WTrvxlNVa4— Barack Obama (@BarackObama) January 17, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Barack writes a sweet birthday message to his wife every year, as the Daily Mail noted while freaking out over the fact that he didn’t post first thing on January 17. But it seems like Michelle was not offended by her husband waiting 12 hours and 40 minutes to publicly wish her a happy birthday. Love you, honey! ❤️😘 https://t.co/fiQaCYmQ02— Michelle Obama (@MichelleObama) January 17, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); The former first couple posted another pair of lovey-dovey messages on Valentine’s Day: Thirty-two years together and you still take my breath away. Happy Valentine’s Day, @MichelleObama! pic.twitter.com/wiIJ0kstRm— Barack Obama (@BarackObama) February 14, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); If there’s one person I can always count on, it’s you, @BarackObama. You’re my rock. Always have been. Always will be. Happy Valentine’s Day, honey! ❤️ pic.twitter.com/f099TnZHVY— Michelle Obama (@MichelleObama) February 14, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); So there you have it: Clearly the Obamas are still very much in love … or very committed to this elaborate conspiracy to needlessly lie about their relationship status! This post was updated after to include the Obamas’ Valentines Day posts. More on Michelle Obama Michelle Obama Isn’t Sick — She Just Hates Trump Trump Already Tried to Kill Michelle Obama’s Version of MAHA Michelle Obama Had the Best Closing Argument of the Campaign See All Sign Up for the Intelligencer Newsletter Daily news about the politics, business, and technology shaping our world. Email This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Vox Media, LLC Terms and Privacy Notice By submitting your email, you agree to our Terms and Privacy Notice and to receive email correspondence from us. Tags: conspiracy theories michelle obama barack obama politics early and often More Show Leave a Comment Barack & Michelle Obama Quash Divorce Rumors via Subtweet const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'intelligencer'; const keywords = ["conspiracy theories","michelle obama","barack obama","politics","early and often"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript 