["http://nymag.com/intelligencer/article/who-killed-andy-the-footless-goose-gene-fleming.html"]
title = "Who Killed Andy the Footless Goose?"
description = "Gene Fleming’s footless goose Andy was the most famous bird in America before he was brutally murdered in 1991. Fleming’s granddaughter Jessica Korgie is still investigating."
full_description = '.layout > .ad-splash, .one-column-layout > .ad-splash { display: none; } crime Feb. 26, 2025 Who Killed the Footless Goose? Thirty-three years ago, Andy was the most famous bird in America. Then he was brutally murdered. By Owen Long, a freelance writer covering subcultures, city life, and politics Photo: The Andy Archive, Andy the Goose LLC Photo: The Andy Archive, Andy the Goose LLC Photo: The Andy Archive, Andy the Goose LLC This article was featured in One Great Story, New York’s reading recommendation newsletter. Sign up here to get it nightly. On the morning of Sunday, October 20, 1991, in the south-central Nebraska farm town of Hastings, Leo Stohler walked through Chautauqua Park, an open field surrounded by clapboard houses, wafting a metal detector over the dewy grass. Head down and following an indistinct crackle, he suddenly stumbled upon something awful lying flat in his path: a decapitated corpse wearing nothing but shoes. Stohler recognized the body. He found a phone and called his neighbor, Gene Fleming. Ten miles away, Fleming was sipping coffee in his kitchen with his wife, Nadine. It was their son’s birthday. They had plans to celebrate with friends later on and were taking the morning slow. The phone rang. Fleming answered, listened, then set down the receiver. He went to check on Andy in his room. But the room was empty. Fleming dialed 911. Downtown, the sheriff’s deputy, Mike Peterson, picked up. “There’s been a murder,” Fleming said. “Somebody get me an officer.” “Calm down,” Peterson said. “Who’s been murdered?” “Andy,” Fleming said. “My goose.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Hastings Tribune Archive", "caption": "Gene Fleming and Andy.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/36b/c09/b957d15237a2cf16010d004bf1270a2f4e-digital-FlemingGene14971-A-039.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Gene Fleming and Andy. Photo: Hastings Tribune Archive Gene Fleming was well known in Hastings. An eccentric inventor, he had turned the profits from his “cattle-oiler” — a metal cylinder covered in insecticide, meant to help cows ward off flies — into Fleming Manufacturing Co., a livestock-equipment company that would employ more than 70 people (its slogan: “For Whom the Bulls Toil”). Fleming lived on a sprawling, unusual estate — a Navy ammunition depot he and his wife had renovated just outside town. He filled the cavernous rooms with bullfighting memorabilia, a push-pedal organ, and taxidermied elk, a bobcat, and eagles; he built a hydroponics garden for growing vegetables in the winter. Outside, he installed a tennis court plus a small model lighthouse for stray cats to live in. He set up a playground of his own inventions: swings and teeter-totters welded to cattle-feeders. Next came a Japanese garden with a man-made pond and an arched wooden bridge. He kept geese and goats in the garden. In the ’70s, he moved his son and daughter-in-law onto the compound; a few years later, they had a daughter, Jess. In September 1988, Fleming drove to visit his brother-in-law, Ivor, who owned a farm a few miles from Hastings. In the gravel driveway, he noticed a new goose — it didn’t have feet and was struggling to get around. Ivor had named it Rock ’n’ Roll. The goose was unpopular with the other animals, Ivor told Fleming, and frankly depressing to watch. But Fleming was enamored with the strangely deformed creature. He offered his brother-in-law a trade: two healthy geese in exchange for Rock ’n’ Roll and his mate, Polly. “Sure,” Ivor said. Once home, Fleming strapped Rock ’n’ Roll to a skateboard. The goose toppled off. So he went out and bought a pair of size-zero patent-leather baby sneakers from a local shoe shop, filled them with rubber padding, and fitted them over the goose’s stumps. The transformation was immediate: The goose could walk. Within hours, he was tearing across the lawn and slicing through the surface of the pond. Pleased with himself, Fleming introduced the goose to Jess and suggested the bird needed a new name. Jess said, “How about Andy?” Word quickly got out in Hastings that Gene Fleming had a footless goose. On October 10, 1988, the Hastings Tribune published an article, called “Goose Steps in Style,” chronicling Andy’s unlikely journey to ambulation. Later that week, the Associated Press picked it up. Within weeks, Andy’s presence was requested in malls, schools, and nursing homes across the state. Fleming grabbed his briefcase and fedora, sat Andy in the passenger seat of his Triumph TR7 convertible, and the two of them went on tour. After decades of making sales pitches at trade shows and one-on-one to farmers in their fields, Fleming was a seasoned orator. He knew how to captivate an audience. The duo’s act was straight-forward: Andy stood, mostly still in his shoes, as Fleming delivered an impassioned speech about the power of self-belief. He always finished with a quote, which he attributed to Andy. “I felt bad when I was born without feet,” he would say, “but worse when I met a man without wings.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "The Andy Archive, Andy the Goose LLC", "contentUrl": "https://pyxis.nymag.com/v1/imgs/5fa/a39/6aa2df1f5be21031b2571f5998de3c8c19-digital-IMG-4395.2x.rdeep-vertical.w460.jpg", "width": "920", "height": "1380" } } Photo: The Andy Archive, Andy the Goose LLC Back in Hastings, Fleming brought Andy everywhere — to the park, to city hall. When he went to the bank, he brought Andy inside: They were both making deposits, he liked to say. At a town meeting, Andy was declared an honorary ambassador of the Chamber of Commerce. Responding to popular demand, Fleming started a fan club and printed certificates, which he mailed to children who wrote Andy letters. Fleming’s wife, Nadine, designed and commissioned buttons, key chains, T-shirts, and sweatshirts bearing Andy’s likeness, which were sold whenever Andy visited the local mall. On the streets, merch-clad Andy fans strolled past Andy’s Cafe, a pre-Andy eatery that had adopted his image as its logo. At the depot, Fleming moved Andy out of the garden and into his own pen. At the end of January 1989, Andy appeared in People magazine. Days later, he was on The Tonight Show. Across the desk from Johnny Carson, Fleming presented Andy’s growing bespoke-footwear collection: boots, flippers, cleats, and special contraptions he used to grip Polly while they mated. When Andy waddled out from behind the curtain, the crowd broke into earsplitting applause. Later that year, Andy appeared in Reader’s Digest and was gifted a lifetime supply of baby sneakers by Nike; a pair of his sneakers was immortalized in the Ripley’s Believe It or Not! collection. He was featured in the German magazine Der Spiegel. Fan letters came from Australia, Denmark, and China. Evidently, there was something cross-culturally amusing and inspiring about a footless goose wearing shoes. Toy manufacturers, a publishing house, and a licensing company began courting Andy, sending Fleming effusive letters that promised percentages for seemingly endless permutations of Andy’s effigy. It seemed inevitable that he would soon ascend to the highest plane attainable for a goose — or a person, for that matter — in postindustrial America: He was on the cusp of becoming a brand. { "@context": "http://schema.org", "@type": "ImageObject", "author": "Hastings Tribune Archive", "contentUrl": "https://pyxis.nymag.com/v1/imgs/e96/acf/d3086e581e4479d52d3b9c9d860b3bb6d9-digital-MasonicTemple553-466-015.2x.rhorizontal.w700.jpg" } { "@context": "http://schema.org", "@type": "ImageObject", "author": "Hastings Tribune Archive", "contentUrl": "https://pyxis.nymag.com/v1/imgs/f42/50e/6f59941246549f574961ee72f86c2acce4-digital-FlemingGene14971-A-026.2x.rvertical.w570.jpg" } Andy with children at a clinic for language disorders. Andy photographed for a preview of ABC’s Incredible Sunday. Photo: Hastings Tribune Archive. Andy with children at a clinic for language disorders. Andy photographed for a preview of ABC’s Incredible Sunday. Photo: Hastings Tribune Archive. { "@context": "http://schema.org", "@type": "ImageObject", "author": "Hastings Tribune Archive", "contentUrl": "https://pyxis.nymag.com/v1/imgs/707/700/4cf4e03d0a114649e3eb9858b4a80b3c5b-digital-ChamberCommerce229-767-002.2x.rhorizontal.w700.jpg" } { "@context": "http://schema.org", "@type": "ImageObject", "author": "The Andy Archive, Andy the Goose LLC", "contentUrl": "https://pyxis.nymag.com/v1/imgs/029/f31/f215f729d054810704459fc147928865e6-digital-AndyPARADE.2x.rvertical.w570.jpg" } Fleming pushing Andy in a parade. The Hastings Chamber of Commerce honors Andy with a blazer. Photo: The Andy Archive, Andy the Goose LLC; Hastings Tribune Archive. Fleming pushing Andy in a parade. The Hastings Chamber of Commerce honors Andy with a blazer. Photo: The Andy Archive, Andy the Goose LLC; Hastings Tr... more Fleming pushing Andy in a parade. The Hastings Chamber of Commerce honors Andy with a blazer. Photo: The Andy Archive, Andy the Goose LLC; Hastings Tribune Archive. On the October morning Andy was found decapitated, Fleming met Deputy Peterson at the park. The two men stood over the corpse. Fleming was in shock but invited the deputy back to his property to look for clues. In the mud outside Andy’s pen, the two men found what looked like two sets of human footprints. Inside, they found blood spattered on the door and on a box on the concrete floor. Whether the blood belonged only to Andy was unclear. Polly, with whom Andy had spent the night, was gone. Based on the blood and Andy’s wounds, it seemed likely that he was killed in his pen. Afterward, the culprit seemed to have transported his body to an unknown secondary location, where the person or persons removed his head — nowhere to be found — and most of his feathers. After that, Andy’s remains appeared to have been driven ten miles into town to Chautauqua Park and deposited on the path leading to the central pavilion, where Leo Stohler found him the next morning. Peterson took statements from Gene and Nadine. Did they have any enemies? Not that they were aware of. Did Andy? None. With nothing left to do, the deputy departed. Hastings was an unusually safe town, a place where residents did not lock their doors, where people left their car keys in the ignition. Now many citizens were alarmed and outraged. Rumors emerged. Since Fleming was a successful businessman, people speculated that an envious employee — or ex-employee — might have killed Andy. Gene and Nadine rented out part of the depot, so a former tenant was floated as a possibility. Some theorized that the murder might have been the sick joke of a gang of listless teenagers. Others suspected something stranger. Reports had arrived from Colorado of a string of mysterious bird mutilations — sacrifices, it seemed. Was a Satanist coven migrating east across the U.S, ritually dispatching birds en route? The editor of the Hastings Tribune spent the night in the cemetery on the lookout for witches. As days turned into weeks, residents started spontaneously bringing in envelopes of cash to the sheriff’s office; a reward fund was established. Public outcry was such that an official investigation was launched, and Peterson was appointed lead investigator on the case. A young officer with only six years on the force, Peterson was used to solving the kinds of mysteries common to small towns, like burglaries and car thefts. There was nothing in the handbook about how to handle a crime involving an animal, so he began with the basics. He interviewed Fleming’s employees and tenants. They described him as kind and generous, not someone who would do something to inspire revenge. Some teenagers did brag about killing Andy, but their stories fell apart under interrogation. The deputy waited for a credible accusation to surface. As news of Andy’s death spread to his fans around the globe, the reward fund swelled to $8,000. Previously, the highest reward in Hastings history was $100. Besides monetary contributions, Andy’s fans sent letters to Fleming by the hundreds. “Scumbag,” they called the killer, “creep,” “lunatic,” “subhuman,” “bozo.” Even elementary-schoolers and children too young to understand Andy’s death joined the indignation. “I am sorry that Andy died,” a girl named Teresa Anderson wrote. “I just wish that they would leave him alone.” After Andy’s death, Fleming wasn’t the same. He paced and puttered, looking lost, no longer spending his days innovating in his warehouse. After months and no leads, the sheriff’s office declared the case still unsolved. The reward money went toward a children’s shelter and school-library books. A local mason donated a headstone for Andy, which Fleming placed near the side of his house. Over the years, the prairie pushed in on the Flemings’ property, threatening the playground, the lighthouse, and the Japanese garden; Indian grass ensnarled the grave. { "@context": "http://schema.org", "@type": "ImageObject", "author": "The Andy Archive, Andy the Goose LLC", "contentUrl": "https://pyxis.nymag.com/v1/imgs/355/0db/0d8f01ba9f2ff0aebc2a296d678332d06f-crop-digital-NikeMarkTomashow1989-2.2x.rhorizontal.w700.jpg" } { "@context": "http://schema.org", "@type": "ImageObject", "author": "The Andy Archive, Andy the Goose LLC", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ea9/020/312c983457d2c0507d0aa508fbd7f1bf07-digital-AndyOnCarson.2x.rhorizontal.w700.jpg" } Nike employee Mark Thomashow and Andy. Andy and Fleming with Johnny Carson. Photo: The Andy Archive, Andy the Goose LLC. Nike employee Mark Thomashow and Andy. Andy and Fleming with Johnny Carson. Photo: The Andy Archive, Andy the Goose LLC. I recently stumbled upon a story about Andy and his shoes in an old newspaper article. Delighted, I Googled him and was disturbed to learn of his gruesome death. Weeks went by, and I couldn’t put the case out of my mind. The beginning — a footless goose inspires disabled people around the world — contrasted so sharply with the ending. What was the motivation? I decided to insert myself. After some sleuthing, I discovered that Gene Fleming’s granddaughter, Jessica Korgie, now 49, had spoken to reporters intermittently about Andy. I pestered her via email, offering to try to find the goose’s killer. Finally, this past October, she replied and explained that she had conducted her own halting investigation over the decades. To this day, she said, she desperately wanted to know what happened, but there was something holding her back from digging too deeply — an intense reluctance. It felt almost existential. She had leads but was afraid to follow them. Still, she said, I’d caught her at a good time. In a few weeks, on the 33rd anniversary of Andy’s murder, she would be performing a one-woman show about the goose’s life and de'
