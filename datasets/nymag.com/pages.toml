["https://nymag.com/intelligencer/article/asteroid-2024-yr-threat-to-earth-2032.html"]
title = "What NASA Said About an Asteroid Hitting Earth in 2032"
description = "The odds of the recently discovered 2024 YR asteroid hitting Earth in 2032 have gone up, but there’s no reason to panic (for at least another four years). Also, the JWST is now on the case."
full_description = '''what we know Updated Feb. 13, 2025 Is a Big Asteroid Going to Hit Earth in 2032? By Chas Danner, staff editor at Intelligencer Orbit diagram for 2024 YR as of February 7, 2025. Illustration: NASA/JPL A recently spotted space rock has suddenly climbed atop astronomers’ threat lists. As of February 7, NASA’s Center for Near Earth Object Studies calculates that the nearly 300-foot-wide asteroid 2024 YR4 now has a 2.3 percent chance of hitting Earth on December 22, 2032 — which caused some alarm since that is one percent higher than what the European Space Agency had calculated a week prior. Luckily, astronomers aren’t terribly worried about it just yet. Below is a quick look at the risk of 2024 YR4 making a deep impact on our home world. . Holy crap! Are we all going to die in 2032?! No, or at least not because of the 2024 YR4 asteroid. First off, there is currently only about a one-in-43 chance that this rock hits Earth, and those odds will change (and probably go down) as scientists gather more data on the recently spotted asteroid. A nearly 98 percent chance it won’t hit us is pretty good. Second, while that’s definitely a massive rock, it’s not like a dinosaurs-killing size. Three hundred feet wide is about on par with the asteroid that exploded over Siberia in 1908 (also known as the 1908 Tunguska Event). That rock blew up in the sky and flattened about 800 square miles of remote forest but obviously did not cause Armageddon. Put another way, the asteroid currently ranks three out of ten on the Torino Impact Hazard Scale, which astronomers use to categorize potential Earth-impact events. Ten is an impact that could potentially end civilization, but three is: A close encounter, meriting attention by astronomers. Current calculations give a 1% or greater chance of collision capable of localized destruction. Most likely, new telescopic observations will lead to re-assignment to Level 0. Attention by public and by public officials is merited if the encounter is less than a decade away. Third, if the odds do go way up, we’ll know all that well in advance of December 2032 and have plenty of time to freak out and get into prepping or for scientists to find a way to knock it off course later. . So … don’t panic? No, there are plenty of other things worth panicking about right now, but not this. . But if it does hit Earth, that would still be really bad, right? Yeah, an asteroid of that size hitting the planet could do a lot of localized damage and be devastating if it exploded over a populated area. It’s not planet-killer size but is a potential city killer, as one scientist explained to CBS News. . So what’s next? Scientists are continuing to track the asteroid while it remains visible from Earth this month. In addition, the ESA has announced that the James Webb Space Telescope will be used to evaluate the size and trajectory of 2024 YR4, once in March and again in May. Per the ESA, the telescope will should provide a more accurate estimate of the asteroid’s size: Webb is able to study the infrared light (heat) that 2024 YR4 emits, rather than the visible light it reflects. Infrared observations can offer a much better estimate of an asteroid’s size, as explained in an article recently published in the journal Nature, co-authored by members of ESA’s Planetary Defence Office.Astronomers will use Webb’s MIRI instrument to get a much more precise estimate of the asteroid’s size. This, in turn, will be used by ESA, NASA, and other organisations to more confidently assess the hazard and determine any necessary response. Observations made using Webb’s NIRCam instrument will complement MIRI’s thermal data and will also provide additional measurements of the asteroid’s position once it is beyond the reach of Earth-based telescopes. The Earth will also have another close encounter with 2024 YR4 in 2028, and it will become visible to skywatchers again. At that point, astronomers will again reevaluate the risk and we can all plan accordingly. This post has been updated. Sign Up for the Intelligencer Newsletter Daily news about the politics, business, and technology shaping our world. Email This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Vox Media, LLC Terms and Privacy Notice By submitting your email, you agree to our Terms and Privacy Notice and to receive email correspondence from us. Tags: space asteroids science astronomy what we know More Show Leave a Comment Is a Big Asteroid Going to Hit Earth in 2032? const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'intelligencer'; const keywords = ["space","asteroids","science","astronomy","what we know"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
