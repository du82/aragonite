title = "SCOTUSblog’s Tom Goldstein Ran Out of Luck"
description = "SCOTUSblog’s Tom Goldstein has run out of luck. Here’s how the most influential Supreme Court lawyer of his generation gambled it all away."
full_description = '.layout > .ad-splash, .one-column-layout > .ad-splash { display: none; } the law Feb. 14, 2025 The Legal Star Who Ran Out of Luck How the most influential Supreme Court lawyer of his generation gambled it all away. By Matt Stieb, Intelligencer staff writer Photo-Illustration: Intelligencer; Photos: AP, Getty Photo-Illustration: Intelligencer; Photos: AP, Getty Photo-Illustration: Intelligencer; Photos: AP, Getty This article was featured in One Great Story, New York’s reading recommendation newsletter. Sign up here to get it nightly. There are few attorneys alive today who have influenced the Supreme Court as much as Tom Goldstein. He has argued 45 cases before the Court, single-handedly changing how lawyers get cases in front of the nine justices, and taught a generation of Harvard and Stanford law students how to do the same. The website he founded, SCOTUSblog, pioneered coverage of the Court and became the go-to destination to learn about the most consequential rulings of the century. On Monday, an hour north of the high court, he was booked into a maximum-security jail next to the freeway. His fall was as abrupt as it was shocking to the legal heavyweights he counts as friends. Publicly, he was a wealthy, well-liked, married father of two, an award-winning attorney widely cited as an authority on the high court. Privately, according to a 22-count indictment revealed last month, Goldstein, 54, was living as an international high-stakes poker player who evaded millions in taxes and used his law firm as a slush fund to pay gambling debts and support multiple girlfriends. Colleagues always knew he liked poker, playing with quarters for chips as a lecturer on the Harvard Law campus. But none seemed to know the extent to which he was hooked. The Feds, however, claim he borrowed millions from former clients and fellow gamblers to play in exclusive matches from Macau to Las Vegas, getting close to an alleged member of the Hong Kong underworld along the way. Although he usually played for cash, crypto, or casino chips, he allegedly once funded a poker game with a kilo of gold. “A lot of us who knew him were surprised,” says one former colleague. “We knew he was a big gambler. But nobody knew he was basically living a second life.” Goldstein has pleaded not guilty, hired the top crisis-PR firm to fight for his reputation, and retained two former lawyers of Donald Trump’s to defend him in court. His team is already showing its worth, prevailing over prosecutors in a dispute over a crypto transaction post-indictment that landed him behind bars. “At the moment, Tom is the Pete Rose of the Supreme Court bar,” says a longtime friend, referring to the baseball phenom who died in exile from the sport because he bet on his own games. “It would take enormous work to claw himself back into what he once considered the right kind of life.” The way Goldstein tells it, he just barely made it as a lawyer at all. He had mediocre grades at the University of North Carolina, putting more effort into the debate team than his political-science classes. “He’s caring and looks after the people in his orbit and is funny and charming and all of those things,” his debate coach told an alumni magazine. But when it was time to compete, a different side came out: “You could watch him all day but never actually see the knife in his hand.” He was turned away from all the law programs he applied to except American University’s, where he made it in as a night student because his stepmom’s cousin knew the admissions director. While at American, Goldstein made the first important cold call of his career, pitching Nina Totenberg, NPR’s legal-affairs reporter, on why he should be her intern. “From somebody who talked too fast and was a little shaky and sort of pissed off the court in the beginning, he became one of those lawyers who could stand there for an hour or two and not be thrown off his mark,” says Totenberg, after whom Goldstein later named his daughter. Attorneys noted a different skill of his. “He took very aggressive positions,” says the colleague, “which had the potential to be very successful or end in ignominious defeat.” In 1994, he married Amy Howe, his college sweetheart whose notes he relied on to get through undergrad. Friends say Howe — 2-0 in her own brief Supreme Court advocate career — was just as brilliant as her husband but quieter and more grounded. “She was always his ethical guidepost when ambition might peek around,” says Totenberg. Howe used to remind her husband at the beginning of his career that the cases he took on involved real people. Soon after passing the bar, Goldstein began rising through the ranks of white-shoe law firms in D.C. (Jones Day and Boies Schiller) before going into private practice with Howe, running the firm from their laundry room. His niche was finding “circuit splits,” i.e., two appellate courts ruling in contradiction to each other; these cases have the kind of judicial tension the Supreme Court is looking to resolve. Goldstein figured out that major firms looking for big payouts weren’t targeting circuit splits involving small amounts of money. So he began cold-calling potential clients to win them over — even those who already had lawyers, according to another former colleague. This method put him on the fast track to the Supreme Court. In 1999, at the age of 28, Goldstein argued his first case there, which was also his first time formally arguing before any judge. He lost the dispute over his client’s $1,500 fine 9-0, but losing did not scare him in the way that it did some other Ivy-pedigreed lawyers. He was making his name as a Supreme Court advocate with bigger fees promised down the line. “The time was right for somebody like Tom to figure out that if the court really wants to decide circuit splits, then we should get involved early in cases and start reaching out to people in lower courts,” explains a third former colleague. Not everyone was impressed by the aggressive approach from the upstart lawyer from a second-tier law school. “If I’m going to have heart-bypass surgery, I wouldn’t go to the surgeon who calls me up,” John Roberts, then a private attorney, said of Goldstein at the time. But within a few years, it seemed as if everyone in appellate law was emulating his lowball method; he likened the practice to “hitting singles” instead of home runs. “The Supreme Court practice has always been kind of a loss leader,” explains the third former colleague. “It’s a prestige thing. It allows firms to tell their clients, ‘We can represent you from cradle to grave in litigation.’” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Steve Ruark/AP Content Services for Carolina Alumni Review", "caption": "Goldstein in front of the Supreme Court in 2017.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/d0c/461/9dae3b1de0c59e0109cbffda817aecebc7-goldstein-2017.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Goldstein in front of the Supreme Court in 2017. Photo: Steve Ruark/AP Content Services for Carolina Alumni Review “Most of the big firms are out there hunting for the kinds of cases Tom got his break with,” says one attorney Goldstein mentored. “Now if there’s a case that might be worthy of Supreme Court review — even if it’s only a $10,000 case — there’s probably ten big law firms begging to do it.” A year after Goldstein’s first court appearance, Laurence Tribe hired him for a research position on the Democrats’ all-star legal team for Bush v. Gore. “Tom has an essentially photographic memory,” says Tribe. “He’s very good at dealing with people.” Having barely made it into law school a few years earlier, Goldstein had elbowed his way into the echelon of Supreme Court lawyers, an exclusive world of former clerks; future justices; and Harvard, Stanford, and Yale grads. “I stood for things that they didn’t like,” he told his alumni magazine. “I think they were very comfortable with an elite Supreme Court bar. I didn’t know enough to care.” Former colleagues say Goldstein was chatty and could read people and how to cater his arguments to each justice on the bench. “He knew the Court’s decisions; he knew the justices’ attitudes,” says David Boies, who argued Bush v. Gore for the Democrats. He went to dinner with the justices and knew enough about them to give personal color to reporters. Clarence Thomas is much more verbose than his court demeanor would suggest; Antonin Scalia was a poker fan. In 2004, Goldstein began teaching at Harvard Law’s Supreme Court litigation clinic, a program where law students learn the ins and outs of arguing before the justices; Stanford Law trusted him to co-found its program that same year. “A lot of former students went on to clerk at the Court, and he absolutely changed the kinds of cases the Court heard,” the third former colleague says. “He’s had a huge impact on the way the Supreme Court operates.” Around the same time, Goldstein created SCOTUSblog with his wife to share their knowledge of the Court by providing fast, incisive takes on decisions. He once called the blog a “marketing ploy,” but over time it became indispensable for SCOTUS watchers, including the clerks working for the justices. In 2012, the site was flooded with visitors after Goldstein correctly read the decision upholding Obamacare as constitutional while CNN and Fox News had made the wrong call. “There are lots of lawyers who know the answer but can’t give it to you in English,” says Pete Williams, a friend who retired as NBC’s longtime court watcher. “Tom could always cut through and be very clear in his answers.” Attention flooded Goldstein, too. Several firms tried to recruit him before he joined the multinational Akin Gump Strauss Hauer & Feld as a partner at 35. SCOTUSblog became a Jeopardy! clue and earned a Peabody Award, the first to be won by a blog. He appeared on The Daily Show, nerdy but confident in a comedic setting. Demanding a four-figures-per-hour fee, he became fond of three-piece suits and luxury watches. The company behind The Walking Dead bought his life rights for a TV show called Tommy Supreme — the character pitched as a “likable guy in the most unlikable profession.” Like millions of Americans, Goldstein caught the poker bug around the time an amateur who called himself Chris Moneymaker went on a miracle run to win the main event at the 2003 World Series of Poker — a ratings boon that helped launch the popularity of online Texas Hold’em. Goldstein’s own poker career began quietly enough with games at his home outside D.C. with friends, lawyers, and fellow bloggers. One attendee recalled that they were more of a “social gathering” than serious poker. Goldstein was a natural, dominating a 130-person tournament to win a seat at the World Series of Poker in 2008. He got bounced early but managed a six-figure run in an 18-hour game at the Bellagio while he was in Vegas. It helped that the same skills from the courtroom apply at the card table: reading people, calculating odds, and knowing when to go for the big win. “It has great analytical benefits,” he told Legal Times of the similarities between his profession and his hobby just before the tournament. “You learn a lot about people.” Within a few years of getting into the game, Goldstein began playing against local high rollers in a long-standing game outside D.C., says one friend who played with him. Favoring a sport coat and pocket square, “Tom looked very meek and mild,” the friend recalls, “but at the end of the day he turned out to be super-aggressive.” Private games are attractive to rich or famous players for a few reasons, such as avoiding attention or taxes. But the main factor is to keep out professionals (sharks) who could slowly bleed high-net players (whales) over the course of an evening. This way, the adrenaline and the stakes stay high without anyone worrying about getting fleeced. In the D.C. game, players could win as much as $25,000 in one night. Goldstein’s preferred type of game was called a heads-up match, where you play only one opponent. Not only could Goldstein read people, he was near-impossible to read, says one person who played with him: “He was fearless. It’s tough to play against people that are fearless.” But in games facing more than one opponent, the same appetite for risk that made Goldstein a threat in the courtroom put him at a disadvantage in group matches of Texas Hold’em. He seemed more interested in the thrill of a high-action game than in winning or losing money. He would raise when he didn’t have to or try to draw out the cards other people had, playing weak hands just to find out what others were holding. “Sometimes he would play hands totally blind,” the poker player says. One friend recalls confronting Goldstein over his poker playing early on, worrying that it wasn’t a good idea: “I remember very clearly, he just sort of said it’s not a big deal.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Steve Ruark/AP Content Services for Carolina Alumni Review", "caption": "Amy Howe, Goldstein’s wife and SCOTUSblog partner.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/013/b04/10ec3ec332ecb29fb08eb37671a740110d-amyhowe.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Amy Howe, Goldstein’s wife and SCOTUSblog partner. Photo: Steve Ruark/AP Content Services for Carolina Alumni Review Over time, the card game began to creep into his work. Harvard Law acquaintances recalled hearing stories of Goldstein flying students from the Supreme Court litigation clinic to Las Vegas. In 2011, he left his partner position at Akin Gump to avoid a conflict of interest with its client Caesars Entertainment when he decided to represent the top online poker site, PokerStars. (To do so, he restarted his own firm as Goldstein & Russell.) Two years later, he filed a brief supporting a defendant accused of operating an illegal gambling business on behalf of the Poker Players Alliance. Where gambling is dumb luck, Goldstein wrote that “poker is a contest of wits and wills between the players, and therefore a game of skill.” Looking every bit the Ivy League professor, Goldstein found an unlikely kindred spirit: a poker player, occasional actor, and vape-brand founder named Dan Bilzerian. In the casino world and beyond, he is a controversial figure: A high-testoterone lad-mag icon often surrounded by half-naked women on yachts and private jets. He claims to have gotten mega-rich playing massive heads-up matches against the Beverly Hills billionaire Alec Gores and the Texas billionaire Andy Beal. In one week in 2014, Bilzerian was sued by a woman for allegedly kicking her in the face in a Miami Beach nightclub — and then sued by the porn actress Janice Griffith for allegedly breaking her foot when he threw her off a roof into a pool during a shoot for Hustler. '
