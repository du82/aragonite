title = "Was Trump Friends With Jeffrey Epstein? Everything We Know."
description = "Trump was friends with Jeffrey Epstein for years. Here’s the history of their friendship, plus latest news on their connection, including the Trump and Epstein photo and why GOP senators say Trump must declassify the Epstein documents with JFK files."
full_description = 'scandals Updated Feb. 14, 2025 Trump’s Friendship With Jeffrey Epstein: Everything We Know By Margaret Hartmann, senior editor for Intelligencer who has worked at New York since 2012 Jeffrey Epstein and Donald Trump at Mar-a-Lago in 1997. Photo: Davidoff Studios Photography/Getty Images While Jeffrey Epstein’s black book contained a staggering number of A-listers and high-society pals, perhaps the biggest question surrounding last year’s release of a tranche of Epstein court documents was what they would reveal about Donald Trump. The hype reached a fever pitch on January 3, 2024, when Mark Epstein claimed that before his brother died in jail while awaiting trial on sex-trafficking charges, he told him he knew secrets that could blow up the presidential election between Trump and Hillary Clinton. “Here’s a direct quote: ‘If I said what I know about both candidates, they’d have to cancel the election.’ That’s what Jeffrey told me in 2016,” Mark Epstein told the New York Post. Wild stuff! But Mark Epstein said he didn’t know what information his brother was referring to. And while Trump was mentioned in both old court documents and the batches released in 2024, there was no smoking gun. Trump has repeatedly denied any Epstein-related wrongdoing. Yet questions about the president’s ties to Epstein persist, as the convicted sex offender is a conspiracy-theory fixture. Here’s a running list of everything we’ve learned about Trump’s relationship with Epstein. What do we know about Trump’s friendship with Epstein? Trump began palling around with Epstein in the late ’80s, but the depth of their friendship is a subject of debate. Footage unearthed by NBC News in 2019 shows the two men joking around and ogling women during a party at Trump’s Mar-a-Lago resort in 1992. Trump and Epstein were also photographed together in 1992 and 1997. The now famous image below shows Trump and then-girlfriend Melania Knauss partying with Epstein and Ghislaine Maxwell at Mar-a-Lago on February 12, 2000. { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Davidoff Studios Photography/Getty Images", "contentUrl": "https://pyxis.nymag.com/v1/imgs/8ee/3b3/08c5667ac1139fa8acf87dbeebc498b677-epstein-trump.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Davidoff Studios Photography/Getty Images In 2002, the mogul told New York, “I’ve known Jeff for 15 years. Terrific guy. He’s a lot of fun to be with. It is even said that he likes beautiful women as much as I do, and many of them are on the younger side. No doubt about it — Jeffrey enjoys his social life.” Is the photo of Epstein with Donald Trump, Eric, and Ivanka real? Yes. In recent years a 1993 photo of Trump and his children standing next to Epstein has been circulating online. Well, this. pic.twitter.com/tKTuzYsgoC— ashley judd (@AshleyJudd) October 20, 2020 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Snopes.com confirmed that the image is real with the photographer, Dafydd Jones: The 1993 photo was captioned: “Eric Trump, Ivanka Trump, Donald Trump, Jeffrey Epstein, Harley Davidson Cafe opening. Manhattan. 1993.”“I can of course confirm that those people were all at the Harley Davidson Cafe and I did do a picture in black and white on film,” Jones wrote to us via email in early 2024. This should not be confused with the bogus image that shows Donald kissing a young Ivanka on the head, with Epstein in the foreground. That photo was edited to add Epstein, according to FactCheck.org. Did Trump go to the island Epstein owned? There is no evidence that Trump ever visited Little St. James, Epstein’s residence located in the U.S. Virgin Islands. Epstein allegedly trafficked and sexually abused women and girls there, which is why it was nicknamed “Orgy Island,” “Pedophile Island,” and “Island of Sin.” Trump has denied that he ever visited Epstein’s island. But he’s been happy to fan similar unfounded conspiracy theories about about his political rivals. When asked in 2019 if he believes the Clintons were involved in Epstein’s death, Trump answered: I have no idea. I know he was on his plane 27 times, and he said he was on the plane four times. But when they checked the plane logs, Bill Clinton, who was a very good friend of Epstein, he was on the plane about 27 or 28 times, so why did he say four times? And then the question you have to ask is ‘Did Bill Clinton go to the island?’ because Epstein had an island that was not a good place as I understand it, and I was never there. So you have to ask, ‘Did Bill Clinton go to the island?’ If you find that out, you’re going to know a lot. Like Trump, Clinton flew on Epstein’s plane. But none of the Epstein flight logs list either former president as passengers on Virgin Islands-bound flights. A Clinton spokesman said the former president “has never been to Little St. James” and his office has repeatedly said he “knows nothing” about Epstein’s “terrible crimes.” Did Trump ever fly on Epstein’s plane? Yes. Flight logs show Trump was on Epstein’s plane multiple times, though he has denied it. Trump flew on Epstein’s private jet at least seven times between 1993 and 1997, according to flight logs made public during various court proceedings. As the Miami Herald reported in 2021, Trump was accompanied by his then-wife Marla Maples and two of his young children on some of these flights: The flights were all between Palm Beach and New York City airports, with the June 1994 flight stopping at Ronald Reagan Washington Washington National Airport between Palm Beach and New York.A woman named Marla, apparently Trump’s then-wife Marla Maples, is listed as joining him on the June 1994 flight, along with a Tiffany, apparently their then-infant daughter, and a nanny. Trump’s son Eric is listed as joining him on an August 1995 flight between Palm Beach and New York. Nevertheless, in a January 2024 Truth Social post, Trump claimed “I was never on Epstein’s Plane, or at his ‘stupid’ Island.” Bizarrely, it seems Trump unwittingly used Epstein’s plane during the 2024 campaign. The Miami Herald reported that the Trump campaign used a blue Gulfstream jet formerly owned by Epstein to travel to several campaign fundraisers after Trump’s private jet experienced mechanical problems on Friday, August 9, 2024. Epstein’s old plane is now owned by Threshold Aviation Group, an Ontario, California-based company that offers private charter service. The Herald noted that the plane used by the Trump campaign was not the infamous “Lolita Express”; Epstein replaced that plane around 2017 and it “has since been destroyed.” A Trump campaign official told the New York Times that it has used the private jet vendor for years, and will try to avoid using Epstein’s old plane in the future. What’s going on with Katie Johnson and the allegations against Trump? In 2016 a woman who went by the pseudonyms Katie Johnson and Jane Doe in legal filings accused Trump of raping her in 1994, when she was 13, during an orgy held at Epstein’s home in Manhattan. She accused Epstein of raping her as well. Three suits were filed over the same allegations; the first was dismissed for failure to properly state a claim, and the other two were voluntarily dismissed. The third case was withdrawn just days before the 2016 election, and the accuser canceled a press conference at the last minute. Her attorney, Lisa Bloom, said the woman had received death threats and, “She has decided she is too afraid to show her face … She is in terrible fear.” The circumstances around the case were bizarre, as Vox summarized at the time: It was the end of an incredibly strange case that featured an anonymous plaintiff who had refused almost all requests for interviews, two anonymous corroborating witnesses whom no one in the press had spoken to, and a couple of seriously shady characters — with an anti-Trump agenda and a penchant for drama — who had aggressively shopped the story around to media outlets for over a year.Those shady characters — a former reality-TV producer who calls himself Al Taylor and a Never Trump conservative activist named Steve Baer — had been mostly unsuccessful in getting the media to bite. There are a few very good reasons for that, which the Huffington Post’s Ryan Grim succinctly summed up: Taylor and Baer have been really sketchy about the whole thing, and since the accuser is anonymous, journalists can’t do anything to verify her claims. The only journalist who has actually interviewed Johnson, Emily Shugerman at Revelist, came away confused and even doubting whether Johnson really exists. Trump has been accused of sexual misconduct by more than 20 other women over the years; those women were not underage, and their allegations did not involve Epstein. In May 2023, a federal jury found Trump civilly liable for sexually abusing E. Jean Carroll in the mid-1990s and for defaming her when he denied her rape allegation in 2022. He was ordered to pay Carroll $5 million in damages and is currently appealing the verdict. What did Michael Wolff say about tapes and photos of Trump and Epstein? Author Michael Wolff made several salacious claims about Epstein and Trump on the October 31, 2024 episode of his podcast Fire and Fury, which he co-hosts with former Condé Nast editor James Truman. On November 2, The Daily Beast published another Wolff tape in which Epstein claimed, “I was Donald’s closest friend for 10 years.” On his podcast, Wolff, who wrote three books about the Trump administration, said Epstein had showed him about half a dozen photos of Trump with “topless young women” sitting in his lap, which were taken in the late ‘90s at Epstein’s Palm Beach home. The Daily Beast reported: Wolff said of the photos, “They were with Trump at Epstein’s Palm Beach house sitting around the pool with these young girls, and the young girls are topless.“And in some of the pictures, they’re sitting in his lap. I mean, and, and then there’s one I especially remember where there’s a stain, a telltale stain and on the front of Trump’s pants, and the girls are pointing at him and laughing.” Trump separated from his second wife Marla Maples in 1997 and began dating his third wife, Melania, in 1998. Wolff said Epstein kept the photos in his safe, which was seized by the FBI when they raided his homes in July 2019. The author said that during the Trump administration, the convicted sex offender was “utterly preoccupied with Trump, and I think, frankly, afraid of him.” In the same episode, Wolff claimed that in the ‘90s Trump and Epstein were “very competitive” especially when it came to women, and “shared a girlfriend” at one point, per Newsweek. Wolff also said that at one point they “had a competition about who would be the first one who would sleep with Princess Diana,” though he added, “Now, I don’t think that ever happened.” Wolff also played a purported recording of Epstein talking with him about Trump’s White House team, which he said was made in a New York restaurant in 2017. Wolff claimed he his recordings of Epstein discussing Trump total around 100 hours. In the recording published on November 2, which Wolff said was recorded in August 2017, Epstein says Trump is “charming,” but “He’s a horrible human being. He does nasty things to his best friends, best friends’ wives, anyone who he first tries to gain their trust and uses it to do bad things to them.” Epstein also claims Trump liked to “fuck the wives of his best friends,” and describes his elaborate schemes for seducing his friends’ partners. Wolff says Epstein also bragged about his closeness to Donald and Melania by saying, “the first time he slept with her was on my plane,” the so-called “Lolita Express.” Flight logs show Trump flew on Epstein’s plane multiple times, though there is obviously no way to verify this specific claim. Karoline Leavitt, the national press secretary for Trump’s 2024 election campaign, responded by pointing out that Wolff’s reporting has been questioned in the past. She told the Daily Beast: Michael Wolff is a disgraced writer who routinely fabricates lies in order to sell fiction books because he clearly has no morals or ethics. He waited until days before the election to make outlandish false smears all in an effort to engage in blatant election interference on behalf of Kamala Harris. He’s a failed journalist that is resorting to lying for attention. What did Stacey Williams say about Trump and Epstein? Less than two weeks before the 2024 election, former model Stacey Williams accused Trump of groping her in 1993 as Epstein looked on. Williams had previously alluded to this on social media, but she publicly described the incident in detail for the first time during a Zoom call on October 21 organized Survivors4Harris, a group of sexual-abuse survivors supporting Kamala Harris. This is hard to stomach.Stacy Williams recounts the time Donald Trump groped her in an elevator in 1993 after being introduced by Jeffrey Epstein. She also reveals that Epstein and Trump were “really good friends and spent a lot of time together.”I don’t know what’s more… pic.twitter.com/PLaxcUMEwc— Christopher Webb (@cwebbonline) October 24, 2024 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Williams said that during a 1993 walk with Epstein, who she was dating, he suggested they stop into Trump Tower to visit Donald. She said on the call: Moments later, Trump was greeting us. And he pulled me into him, and started groping me. He put his hands all over my breasts, my waist, my butt. And I froze. And I froze because I was so deeply confused about what was happening because the hands were moving all over me yet these two men were like smiling at one another and continuing on in their conversation. She said Epstein berated her afterward, and she came to feel that the groping was part of a “twisted game” between the two men. A short time later, Trump sent Williams a postcard from Mar-a-Lago via her agent. The Guardian published a photo of it on October 23. Trump campaign press secretary Karoline Leavitt denied the story, telling The Guardian: “These accusations, made by a former activist for Barack Obama and announced on a Harris campaign call two weeks before the election, are unequivocally false. It’s obvious this fake story was contrived by the H'
