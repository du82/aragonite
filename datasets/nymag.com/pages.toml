title = "Trump Cabinet Confirmation Hearings: Schedule & How to Watch"
description = "Trump Cabinet confirmation hearings: schedule, how to watch live, and who’s been confirmed. Here’s how to stream all the Senate confirmation hearings online, and the full list of Trump nominees including Tulsi Gabbard, Kash Patel, and RFK Jr."
full_description = 'early and often Updated Feb. 13, 2025 Trump Cabinet Confirmation Hearings: Schedule & How to Watch By Margaret Hartmann and Chas Danner Photo-Illustration: Intelligencer; Photos: Getty Back in 2016, Democrats were widely appalled by Donald Trump’s Cabinet picks, whom they described as dangerous and “historically unqualified.” Now even a few of Trump’s Republican congressional allies were said to be “stunned and disgusted” over his second-term Cabinet picks, with RFK Jr., and Pete Hegseth, and Tulsi Gabbard drawing the most outrage. Yet the GOP Senate seems poised to approve all of Trump’s nominees (with the exception of Matt Gaetz, who had to withdraw his name from consideration for attorney general). Here’s the Senate confirmation hearing schedule so far, with links to how to watch the hearings online, followed by the full list of Trump Cabinet picks. Senate Confirmation Hearing Schedule & How to Watch Thursday, February 13 10:00 a.m. EST: Education secretary nominee Linda McMahon will appear before the Senate HELP Committee. Watch the hearing here on Senate.gov. Wednesday, February 19 10:00 a.m. EST: Labor secretary nominee Lori Chavez-DeRemer will appear before Senate HELP Committee. Watch the hearing here on Senate.gov. Which Trump Cabinet Members Have Been Confirmed? Secretary of State Marco Rubio CIA Director John Ratcliffe Defense Secretary Pete Hegseth Homeland Security Secretary Kristi Noem Treasury Secretary Scott Bessent Transportation Secretary Sean Duffy EPA Administrator Lee Zeldin Interior Secretary Doug Burgum Energy Secretary Chris Wright Attorney General Pam Bondi Secretary of Veterans Affairs Doug Collins Secretary of of Housing and Urban Development Scott Turner Office of Management and Budget Director Russell Vought Director of National Intelligence Tulsi Gabbard Secretary of Health and Human Services Robert F. Kennedy Jr. The Full List of Trump Cabinet Picks Here are all of Trump’s picks — along with a few nominees for other top administration positions — arranged from highest to lowest in the line of succession. Marco Rubio: Secretary of State { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Intelligencer; Photo: Getty", "contentUrl": "https://pyxis.nymag.com/v1/imgs/0e1/ad5/d2bea42d6a66640e1f2dc402ead1bfd27c-rubio.2x.rsquare.w570.png", "width": "1140", "height": "1140" } } Graphic: Intelligencer; Photo: Getty Who: Marco Rubio has served as U.S. senator from Florida since 2011 and is vice-chair of the Senate Intelligence Committee. He ran for president in 2016 but lost the GOP nomination to Trump. Qualifications, According to Trump: He said in a statement posted to Truth Social: Marco is a Highly Respected Leader, and a very powerful Voice for Freedom. He will be a strong Advocate for our Nation, a true friend to our Allies, and a fearless Warrior who will never back down to our adversaries. I look forward to working with Marco to Make America, and the World, Safe and Great Again! Potential Issues: Rubio is known for his hawkish positions, particularly on China, Cuba, Iran, and Venezuela. But as the Washington Post notes, he’s “generated bipartisan acclaim,” as he might be Trump’s most conventional pick. Confirmation Status: Rubio was unanimously confirmed by the full Senate. Pete Hegseth: Secretary of Defense { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Intelligencer; Photo: Getty", "contentUrl": "https://pyxis.nymag.com/v1/imgs/70d/2a0/502d97fcf05c15e83cf14facb3f5a4ed8a-hegseth.2x.rsquare.w570.png", "width": "1140", "height": "1140" } } Graphic: Intelligencer; Photo: Getty Who: Pete Hegseth is a former Fox News host and Army National Guard officer. He served in the wars in Iraq and Afghanistan, as well as Guantanamo Bay. Qualifications, According to Trump: He said in a Truth Social post: Pete has spent his entire life as a Warrior for the Troops, and for the Country. Pete is tough, smart and a true believer in America First. With Pete at the helm, America’s enemies are on notice - Our Military will be Great Again, and America will Never Back Down… Potential Issues: While Hegseth served in the military, he has no experience running anything larger than a small nonprofit. As Defense secretary, he’s in charge of leading the Pentagon and 1.3 million active-duty troops. He has controversial views on a wide range of topics, from women serving in combat (he’s opposed) to servicemembers accused of war crimes (he wants them pardoned) to handwashing (he doesn’t do it). Also, he was investigated for an alleged sexual assault in 2017. And a fellow servicemember flagged him as a possible “Insider Threat” over a tattoo he has that’s associated with white-supremacist groups. Confirmation Status: Hegseth was confirmed by a vote of 51-50, with Vice President J.D. Vance casting the tie-breaking vote. Pam Bondi: Attorney General { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Intelligencer; Photo: Getty", "contentUrl": "https://pyxis.nymag.com/v1/imgs/f0c/099/8f1ac783fce2fc41472026437f33224c6e-bondi.2x.rsquare.w570.png", "width": "1140", "height": "1140" } } Graphic: Intelligencer; Photo: Getty Who: Pam Bondi is a lobbyist who served as Florida’s attorney general from 2011 to 2019. Qualifications, According to Trump: Trump initially nominated Matt Gaetz for attorney general, then picked Bondi after he withdrew from consideration. Trump wrote in a Truth Social post: Pam was a prosecutor for nearly 20 years, where she was very tough on Violent Criminals, and made the streets safe for Florida Families. Then, as Florida’s first female Attorney General, she worked to stop the trafficking of deadly drugs, and reduce the tragedy of Fentanyl Overdose Deaths, which have destroyed many families across our Country. She did such an incredible job, that I asked her to serve on our Opioid and Drug Abuse Commission during my first Term — We saved many lives! Possible Issues: Bondi is a longtime Trump loyalist who served on his first impeachment defense team and publicly backed his false stolen election claims in 2020. (That’s true of most people on this list, but it’s notable because the AG is responsible for investigating claims of irregularities in federal elections.) Back in 2013, Bondi’s aides said the Florida AG was considering joining a multi-state lawsuit against Trump University after receiving nearly two dozen complaints about the for-profit college. Four days later, Bondi’s PAC received a $25,000 contribution from a Trump nonprofit and she never joined the lawsuit. But Trump and Bondi both claim the donation had nothing to do with her decision. Confirmation Status: Bondi was confirmed by a vote of 54-46. Doug Burgum: Secretary of the Interior { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Intelligencer; Photo: Getty", "contentUrl": "https://pyxis.nymag.com/v1/imgs/03b/dd7/42c07b834eece213a7d976f359de282eb4-burgum.2x.rsquare.w570.png", "width": "1140", "height": "1140" } } Graphic: Intelligencer; Photo: Getty Who: Doug Burgum has been the governor of North Dakota since 2016. He’s worth hundreds of millions of dollars, mainly because he sold his software company to Microsoft in 2002. He ran for president in 2024 and became a top Trump surrogate when he dropped out. Qualifications, According to Trump: He teasingly unveiled the news of Burgum’s impending nomination during an event at Mar-a-Lago on November 14. A day later, he put out a statement announcing that Burgum will be both Interior secretary and head of the newly formed “National Energy Council, which will consist of all Departments and Agencies involved in the permitting, production, generation, distribution, regulation, transportation, of ALL forms of American Energy.” Potential Issues: Environmental groups raised concerns about Burgum’s lack of experience, coziness with oil billionaires, and commitment to drilling in public lands — but that all fits with Trump’s agenda. This is one of Trump’s more conventional picks. Confirmation Status: Burgum was confirmed by a vote of 79-18. Robert F. Kennedy Jr.: Secretary of Health and Human Services { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Intelligencer; Photo: Getty", "contentUrl": "https://pyxis.nymag.com/v1/imgs/dbb/865/0b23602783399622ec59d18e2455559c50-rfk--.2x.rsquare.w570.png", "width": "1140", "height": "1140" } } Graphic: Intelligencer; Photo: Getty Who: Robert F. Kennedy Jr. is America’s best-known anti-vaccine activist. He ran for president in 2024 as a Democrat, then as an independent. He dropped out of the race in August 2024 and endorsed Trump, but he still appeared on the ballot in some states. Qualifications, According to Trump: He said on X: For too long, Americans have been crushed by the industrial food complex and drug companies who have engaged in deception, misinformation, and disinformation when it comes to Public Health. The Safety and Health of all Americans is the most important role of any Administration, and HHS will play a big role in helping ensure that everybody will be protected from harmful chemicals, pollutants, pesticides, pharmaceutical products, and food additives that have contributed to the overwhelming Health Crisis in this Country. Mr. Kennedy will restore these Agencies to the traditions of Gold Standard Scientific Research, and beacons of Transparency, to end the Chronic Disease epidemic, and to Make America Great and Healthy Again! Potential Issues: RFK Jr. is one of Trump’s most appalling picks. He has a long history of peddling health-related conspiracy theories: He’s claimed vaccines cause autism, linked depressants to mass shootings, and suggested HIV doesn’t cause AIDS, to name just a few of his false health assertions. And now he may oversee everything from Americans’ health insurance to food safety to the availability of drugs and vaccines. Confirmation Status: Kennedy was confirmed by a vote of 52 to 48. Scott Bessent: Secretary of Treasury { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Intelligencer; Photo: Getty", "contentUrl": "https://pyxis.nymag.com/v1/imgs/671/39f/a103ddd6302f787c2eb8cb2324c18a8e05-bressent.2x.rsquare.w570.png", "width": "1140", "height": "1140" } } Graphic: Intelligencer; Photo: Getty Who: Scott Bessent, 62, is a billionaire hedge-fund manager who is currently the CEO, founder, and chief investment officer at Key Square Capital Management in New York. Prior to that, he was the chief investment officer at Soros Fund Management. Bessent was a top Trump campaign fundraiser, as has become one of Trump’s top economic advisers. He is the first openly gay Treasury secretary. Qualifications, According to Trump: He said in a Truth Social post: Scott is widely respected as one of the World’s foremost International Investors and Geopolitical and Economic Strategists. Scott’s story is that of the American Dream. Scott has long been a strong advocate of the America First Agenda. On the eve of our Great Country’s 250th Anniversary, he will help me usher in a new Golden Age for the United States, as we fortify our position as the World’s leading Economy, Center of Innovation and Entrepreneurialism, Destination for Capital, while always, and without question, maintaining the U.S. Dollar as the Reserve Currency of the World. Unlike in past Administrations, we will ensure that no Americans will be left behind in the next and Greatest Economic Boom, and Scott will lead that effort for me[.] ﻿Potential Issues: Bessent is a former Democrat and protégé of liberal billionaire philanthropist George Soros. Bessent survived an internal “knife fight” over the Treasury job with transition co-chair Howard Lutnick. Bessent’s Trump World critics have cast doubt on whether he is a MAGA true believer, particularly when it comes to the use of tariffs, which Bessent then enthusiastically backed in a November 15 Fox News op-ed. Nonetheless, Bessent is widely considered a safe pick for Trump. Confirmation Status: Bessent was confirmed by a vote of 68 to 29. Howard Lutnick: Secretary of Commerce { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Intelligencer; Photo: Getty", "contentUrl": "https://pyxis.nymag.com/v1/imgs/94a/819/0bc030da5555ad922f7a98b86aaf07e57f-lutnick.2x.rsquare.w570.png", "width": "1140", "height": "1140" } } Graphic: Intelligencer; Photo: Getty Who: Howard Lutnick is the billionaire CEO of the financial-services firm Cantor Fitzgerald, the co-chair of Trump’s transition team, a top campaign fundraiser, and a loyal longtime friend, ally, and adviser to Trump. Lutnick is also the chairman of the brokerage firm BGC Group Inc. and the commercial real-estate firm Newmark Group. Trump said that in addition to his Commerce role, Lutnick will “lead our Tariff and Trade agenda, with additional direct responsibility for the Office of the United States Trade Representative.” Qualifications, According to Trump: He said in a Truth Social post: In his role as Co-Chair of the Trump-Vance Transition Team, Howard has created the most sophisticated process and system to assist us in creating the greatest Administration America has ever seen. Howard has been a dynamic force on Wall Street for more than 30 years. He joined Cantor Fitzgerald in 1983, and rapidly rose through the ranks to become President and CEO at the age of 29. Tragedy struck on September 11, 2001, when terrorists attacked the World Trade Center, and Cantor Fitzgerald lost 658 of its 960 New York-based employees, including Howard’s brother and his best friend. He emerged from these events with an indominable [sic] sense of purpose to rebuild the firm to honor those lost, support their families, and become a beacon of hope for those who remained. Requires Confirmation: Yes. ﻿Potential Issues: Lutnick’s attempts to sink his rival for the Treasury secretary job, Scott Bessent, reportedly frustrated Trump and made Lutnick some enemies among the president-elect’s inner circle. He has already been subject to conflict-of-interest suspicions, since his three businesses have dealings across most sectors of the U.S. economy, and he reportedly promoted his businesses during recent transition-related meetings on Capitol Hill. Sean Duffy: Secretary of Transportation { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Intelligencer; Photo: Getty", "contentUrl": "https://pyxis.nymag.com/v1/imgs/578/b39/974dd1d4d83a85bde2a4da178a40ff1557-duffy.2x.rsquare.w570.png", "width": "1140", "height": "1140" } } Graphic: Intelligencer; Photo: Getty Who: Sean Duffy is a former U.S. representative from Wisconsin, former co-host of The Bottom Li'
