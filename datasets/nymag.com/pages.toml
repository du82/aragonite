title = "DOJ in Upheaval Over Eric Adams Case: Live Updates"
description = "Another federal prosecutor has resigned over the Justice Department’s attempt to dismiss the charges against Eric Adams, and more may soon follow. In New York, the calls for Adams to step down are growing. Here are live updates."
full_description = '''we'll do it live Live Updated 2/15/2025 DOJ’s Eric Adams Mess Isn’t Over: Live Updates By Intelligencer Staff Photo: John Lamparski/Getty Images The Justice Department’s efforts to dismiss federal charges against Mayor Eric Adams, in apparent exchange for his cooperation on Donald Trump’s immigration crackdown, continues to wreak havoc in New York and Washington, D.C. After seven DOJ officials resigned in protest, the Justice Department was finally able to file to drop the charges on Friday evening, but federal judge Dale Ho will still need to sign off. Meanwhile, the calls for Adams to resign are growing, as is the pressure on Governor Kathy Hochul, who has the power to remove Adams from office. Below are the latest developments. .cls-1 { fill: none; } Copied chas danner Updated Feb. 15, 2025, 3:41 PM EST Stewart-Cousins suggests Adams should resign, too The state senator majority leader, who has long avoided commenting on Adams’s indictment, said Saturday that it was “probably time” for the mayor to go: BREAKING: State Senate Majority Leader Andrea Stewart-Cousins calls on NYC Mayor Eric Adams to resign.“It's probably time that he move aside, Stewart-Cousins exclusively told The Post.— Vaughn Golden (@VaughnEGolden) February 15, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 15, 2025, 10:05 AM EST Worse than Watergate That was how former U.S. attorney (and Cafe Insider co-host) Joyce Vance characterized the Adams-DOJ quid pro quo in an interview with Nia Prater: I don’t think we have ever seen — at least not since Watergate — prosecutors being asked to do something that was so clearly improper. People have made the point that Danielle Sassoon is a member of the Federalist Society and a former Scalia law clerk. Other resignations have come from people who similarly might have politics that are more in line with this administration’s politics than with Joe Biden’s politics. I say this as someone who lived through some of the excesses of the George W. Bush administration, which seems a little bit quaint now by comparison: You just don’t see this happen.The difference that’s worth pointing out between Watergate and this was that in Watergate, the request came from the White House, and it was the leadership of the Justice Department that said no. Here, what I think is so shocking and what so many prosecutors have had a visceral reaction to is that this is coming from the attorney general and the acting deputy attorney general of the United States. The fact that those two leaders who took an oath to uphold the Constitution would demand this from a U.S. Attorney and from line prosecutors is just utterly shocking. Read the rest here. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 14, 2025, 7:45 PM EST More on the tense standoff between Bove and DOJ Public Integrity lawyers over the Adams case The New York Times has confirmed Reuter’s earlier report and added some additional details. During a video call with lawyers in the DOJ’s Public Integrity Section on Friday morning, Bove demanded that his motion to dismiss the charges against Mayor Adams be signed within an hour — and they perceived that meant there would be consequences if that didn’t happen: Before being summoned for the tense meeting, lawyers in the section debated their bad options, but came to increasingly believe that someone should step forward to save the jobs of the others, people familiar with the discussions said. …Part of the consideration for Justice Department lawyers is whether simply signing the document would mean risking their bar license, since major ethical objections have already been made to dropping the case. But in those private discussions, many of the lawyers believed it would be a worse outcome if all the section’s lawyers were fired or forced to resign over the Adams case. Ultimately someone did step forward: longtime DOJ prosecutor Ed Sullivan, who reportedly agreed to file the motion in order to protect his colleagues. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 14, 2025, 7:00 PM EST How will Judge Ho respond? As the New York Times points out, federal judges usually accept government requests to drop charges and have virtually no legal power to do otherwise. It’s however likely Ho will hold a hearing on the matter, and it’s possible he could eventually write an opinion criticizing the highly suspicious request, even if he can’t legally reject it. It’s not yet clear what will happen. One law professor who spoke with the Times thinks Ho will not be pleased: “Judge Ho could say this is a politically motivated decision and it affronts the grand jury process and the integrity of the court,” said Stephen Gillers, a professor of legal ethics at New York University School of Law. …Professor Gillers said Mr. Bove’s rationale for seeking dismissal of the charges would not sit well with the judge.“Judge Ho will not accept that — should not accept that — as the justification for throwing out a grand jury decision to indict.” .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 14, 2025, 6:32 PM EST It’s official: DOJ has filed to drop the charges against Adams DOJ officially moves to drop Eric Adams case. https://t.co/rlwWz3gv5K pic.twitter.com/MPKOg1pioc— Kyle Cheney (@kyledcheney) February 14, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); It looks like deputy attorney general Bove got two DOJ officials to make the request, Criminal Division official (and former U.S. attorney) Antoinette T. Bacon, and Edward Sullivan from the Public Integrity Section. Now they will have to see how the judge responds. .cls-1 { fill: none; } Copied nia prater Updated Feb. 14, 2025, 4:23 PM EST More New York politicians call for Adams to resign (or be removed) More and more people from the New York political world are publicly calling for the mayor to step down or be removed. • New York City public advocate Jumaane Williams, who would take over as mayor if Adams resigns or is removed, said Friday that he hoped Adams would resign, noting that “he cannot be the mayor of this city and govern this city the way it needs to be governed.” • Queens state senator John Liu called on Governor Hochul to “come to the defense of your constituents” and remove Adams if he doesn’t resign. • “Mayor Adams has put this city and all of our people in jeopardy to save himself,” Brooklyn borough president Antonio Reynoso also said Friday. “Governor Hochul must end this chaos and remove Eric Adams — now.” • On Thursday, Representative Nydia Velazquez called Sassoon’s claims “damning” and added that “NYC can’t be led by someone under Trump’s thumb and willing to sell out New Yorkers. Mayor Adams must resign.” • Representative Alexandria Ocasio-Cortez echoed those words in her own post, writing, “Trump wields this leverage over Adams, the city is endangered. We cannot be governed under coercion. If Adams won’t resign, he must be removed.” • Mike Gianaris, the deputy leader of the State Senate, also called out the mayor on social media, saying that if Adams himself doesn’t step down, Hochul should take steps to remove him: The last thing the people of New York want is for our city to turn into an annex of the Trump administration, yet that's exactly what is happening. Eric Adams is clearly compromised and can no longer be considered the legitimate leader of our city. He must step down or be removed— Sen. Mike Gianaris (@SenGianaris) February 14, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); • Lieutenant Governor Antonio Delgado has also been emphatic that Adams’s tenure must come to an end: New York City deserves a Mayor accountable to the people, not beholden to the President. Mayor Adams should step down.— Antonio Delgado (@DelgadoforNY) February 14, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Hochul herself has called the allegations against Adams “extremely concerning and serious,” but stopped short of calling for the mayor to step down. The governor, however, did not explicitly rule out using her office’s obscure power to unilaterally remove Adams as mayor. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 14, 2025, 4:12 PM EST Trump says ‘I know nothing’ New comments from President Trump on the Mayor Eric Adams situation, via the White House pool pic.twitter.com/hgCBnJMBKJ— Kevin Frey (@KevinFreyTV) February 14, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); He also waved off the significance of the federal prosecutors quitting over the move, describing them as “mostly people from the previous administration” who “were all going to be gone or dismissed.” .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 14, 2025, 3:52 PM EST Adams denies quid pro quo deal with Trump DOJ The mayor released a statement denying the multiple reports, and the account of now former U.S. attorney Danielle Sassoon, that his lawyers offered his cooperation on Trump’s immigration crackdown in exchange for dropping the charges against him: “I want to be crystal clear with New Yorkers: I never offered — nor did anyone offer on my behalf — any trade of my authority as your mayor for an end to my case. Never.” Statement from @NYCMayor as pressure mounts for him to resign or be removed“I’m solely beholden to the 8.3 million New Yorkers that I represent and I will always put this city first.” pic.twitter.com/coK4pzSjjU— Brigid Bergin (@brigidbergin) February 14, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Also worth noting: However Adams’ lawyer Alex Spiro said something different yesterday - denying there was no quid pro quo but admitted:“We were asked if the case had any bearing on national security and immigration enforcement and we truthfully answered it did.” pic.twitter.com/M8c5Puk1BQ— Morgan McKay (@morganfmckay) February 14, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 14, 2025, 3:47 PM EST Bondi says case against Adams ‘is being dismissed today’ She appeared on Fox News from Munich on Friday afternoon. “He is about to get back his security clearance,” she said of the case. To be clear, the charges against Adams can’t be dismissed until the judge overseeing the case signs off. According to Reuters, a veteran career prosecutor at the DOJ’s public integrity unit, Ed Sullivan, volunteered to dismiss the charges, following a pressure campaign by deputy attorney general Emil Bove. Sources told Reuters that Sullivan to protect his colleagues: “This is not a capitulation-this is a coercion,” one of the people briefed on the meeting later told Reuters. “That person, in my mind, is a hero.” Sullivan’s decision came after the attorneys in the meeting contemplated resigning en masse, rather than filing the motion to dismiss, another source briefed on the matter told Reuters. There are approximately 30 attorneys in the Public Integrity Section. CNBC reports that Bove met via video with the attorneys in the unit, and offered a promotion to those who agreed to sign the dismissal — then gave them an hour to provide the names of two prosecutors who would do it. It’s not clear if another prosecutor has agreed along with Sullivan. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 14, 2025, 3:15 PM EST Adams says Trump administration heard him ‘crying out in the wind’ In addition to Fox News, the mayor and Trump border czar Tom Homan also sat for an interview with Dr. Phil on Friday morning. At one point, Adams seemed to expressed his gratitude to the Trump administration: “I’m really pleased to have this collaboration because it was almost as though I was crying out in the wind and this administration heard it.” .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 14, 2025, 2:03 PM EST Tish James calls SDNY prosecutor Sassoon a ‘profile in courage’ She otherwise declined to comment on the Adams case during a Friday press conference on the state’s efforts to block DOGE’s U.S. Treasury access. “At this point, there’s a number of discussions going on, discussions going on at the state level, discussions going on at the local level, private discussions,” the state attorney general said. “I’m going to refrain from any comment until such time as we complete those discussions and determine the fate of the mayor of the city of New York.” .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 14, 2025, 1:33 PM EST Cuomo releases campaign-style video amid Adams chaos The disgraced former governor published a valentine of sorts: It's got campaign ad music and everything - Cuomo rolls out campaign style video shot at a senior center: "I've missed you!!" "Remember who we are -- we are New Yorkers and we are New York tough and '''
