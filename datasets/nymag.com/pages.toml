title = "Andrew Cuomo Announces Campaign for Mayor of New York"
description = "Disgraced former governor Andrew Cuomo has finally officially joined the race to replace the disgraced current mayor, Eric Adams."
full_description = '''the city politic Updated Mar. 1, 2025 Andrew Cuomo Is Officially Running for Mayor By Chas Danner, staff editor at Intelligencer Photo: Al Drago/Getty Images Disgraced former New York governor Andrew Cuomo has officially entered the race to replace disgraced current New York City mayor Eric Adams. Cuomo announced his long-expected comeback attempt with a 17-minute video on Saturday, framing his candidacy as a solution to a “city in crisis”: Our city is in crisis. That’s why I am running to be Mayor of New York City. We need government to work. We need effective leadership. https://t.co/a0vVYRF4iP pic.twitter.com/JIrhD1Edqs— Andrew Cuomo (@andrewcuomo) March 1, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Despite his considerable baggage, Cuomo is widely expected be the front-runner for the Democratic primary — at least initially — on name recognition alone, and he is already on top of early polls. In 2021, the now-67-year-old political scion resigned as governor amid a barrage of sexual-harassment allegations (which he continues to deny). He was also accused of mishandling the COVID crisis after his administration was found to have underreported the number of people who died in nursing homes during the pandemic. Before his sudden downfall, Cuomo had been expected to surpass his father, Mario Cuomo, by winning a fourth term as governor. He was also once considered a potential presidential candidate, but now he’s literally trying to reintroduce himself to New Yorkers (“Hi, I’m Andrew Cuomo,” is how he begins his announcement video). And here’s how Cuomo addressed his past “mistakes”: Did I make mistakes, some painfully? Definitely, and I believe I learned from them and that I am a better person for it, and I hope to show that every day. But I promise you this: I know what needs to be done and I know how to do it, and I will give it my all to get the job done — and it will get done. In October, the GOP-led House Select Subcommittee on the Coronavirus Pandemic sent a letter to the Justice Department recommending charges against Cuomo over the nursing-home scandal. It’s not clear if the DOJ will launch its own investigation into Cuomo now that it’s run by Trump political appointees who have already used federal charges against Mayor Adams to their apparent advantage. Similarly to how Adams ran for the job, Cuomo is framing his mayoral campaign around fears that the city isn’t safe. In his announcement video, over footage of people living on the street, Cuomo referenced migrants and crime after declaring that “our New York City is in trouble”: You feel it when you walk down the street and try not to make eye contact with a mentally ill homeless person, or when the anxiety rises up your chest as you’re walking down into the subway. You see it in the empty storefronts, the graffiti, the grime, the migrant influx, the random violence. The city just feels threatening, out of control and in crisis. He also indicated that as mayor, he would be open to working with Trump: I will work with anyone who wants to work for the benefit of New York. I hope President Trump remembers his hometown and works with us to make it better. But make no mistake, I will stand up and fight for New York. I have done it before and will do it again. Cuomo already has a sizable war chest of money left over from his previous political life, as well as some public proponents, including Representative Ritchie Torres, who this week told the New York Post he was backing Cuomo’s bid. The Bronx Democrat said that New York needs a “Mr. Tough Guy” with “the courage to stand up to extremist politics — both from the far left and far right.” Other mayoral candidates quickly attacked Cuomo on Saturday: Welcome, @andrewcuomo !In honor of your sad attempt to get attention, let's remember your time as Governor of New York—before you resigned for sexually harassing 13 women and leading thousands of elderly New Yorkers to their deaths during Covid-19.https://t.co/JhXFMphn17 pic.twitter.com/zafkiIqD8x— Brad Lander (@bradlander) March 1, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Andrew Cuomo is now officially running to lead the city he repeatedly threw under the bus as governor. He spent years treating New York City like his personal punching bag—slashing MTA funding and wrecking the subway while funneling money to upstate ski resorts, and trying to cut…— Scott Stringer (@scottmstringer) March 1, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Andrew Cuomo is no friend to New York City.Cuomo slashed funding from our schools and subways, closed our hospitals, hurt our tenants & seniors — and Black New Yorkers paid the price.NYC deserves a Mayor who cares about our city, lives in our city, and puts our city first.— Senator Zellnor Y. Myrie 米维 (@zellnor4ny) March 1, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Mayor Adams’s response? The more the merrier: .@NYCMayor responds to news that @AndrewCuomo is running against him for mayor:“Come one, come all. Everybody should put their position forward. I have a great record to run on. We look forward to the campaign.” pic.twitter.com/anZahvCCL7— Jason Beeferman (@JasonBeeferman) March 1, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); This post has been updated. Sign Up for the Intelligencer Newsletter Daily news about the politics, business, and technology shaping our world. Email This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Vox Media, LLC Terms and Privacy Notice By submitting your email, you agree to our Terms and Privacy Notice and to receive email correspondence from us. Tags: the city politic andrew cuomo 2025 mayoral race politics eric adams early and often More Show Leave a Comment Andrew Cuomo Is Officially Running for Mayor const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'intelligencer'; const keywords = ["the city politic","andrew cuomo","2025 mayoral race","politics","eric adams","early and often"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const free