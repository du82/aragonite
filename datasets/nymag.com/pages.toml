["https://nymag.com/intelligencer/article/sarah-jones-disposable-book-excerpt-right-covid-vaccines.html"]
title = "Sarah Jones ‘Disposable’ Excerpt: How Fringe Captured Right"
description = "Long before Robert F. Kennedy Jr., or even COVID, a movement was born to undermine public health, Sarah Jones writes in her new book, Disposable: America’s Contempt for the Underclass."
full_description = ".layout > .ad-splash, .one-column-layout > .ad-splash { display: none; } politics Feb. 15, 2025 How the Fringe Captured the Right Long before RFK Jr. or COVID, a movement was born to undermine public health. By Sarah Jones, senior writer for Intelligencer who covers politics and labor Photo: Mark Peterson/Redux Photo: Mark Peterson/Redux This is adapted from Sarah Jones’s forthcoming book, Disposable: America’s Contempt for the Underclass, available from Avid Reader Press on February 18. Earla Dawn Dimitriadis sought beauty in life and looked for it on her deathbed, her daughter, Jennifer Ritz Sullivan, said. No stranger to ugliness, Earla wanted the happiness that others had often denied her. “She grew up in a poor household with a lot of abuse at the hands of her parents,” Jennifer explains. At the age of fifteen, her parents forced her out of school and into a marriage that turned abusive. A determined Dimitriadis earned her GED when she was in her thirties and attended night classes at a local community college before getting a master’s degree from the University of Phoenix at age fifty-eight. She worked hard at a variety of jobs, but she especially loved working with children as a teacher’s assistant. “This woman was beyond creative,” Jennifer remembers. Give her a toilet paper roll and some construction paper and Earla could create anything. For Halloween, her children always had handmade costumes. She had a lively spirit, Jennifer adds. “My mom would go to shows with me a lot, and we’d be rocking and dancing and singing and just in the moment, and not worried about what anybody’s going to say,” she says. When she came out as queer, Earla wore a rainbow pin to support her daughter. In 2020, when the virus immobilized the nation, Earla took her health seriously and rarely ventured out. She got sick anyway. From her hospital bed in the ICU, she posted regular Facebook updates along with photos of bedazzled butterflies and dragonflies: small joys in a bleak place. But her prognosis was never good. “By the time she got there, there was damage done to her lungs and she had pneumonia set in,” Jennifer says. “So she wasn’t able to talk due to the lack of oxygen.” She and her sister arranged a final, devastating call with their mother. For fourteen minutes, Earla made a gurgling, almost suffocating sound in between gasps of conversation. She told her daughters that she didn’t want to be on a ventilator, that she was in too much pain, and that she was ready to be done. There was more to say and not enough time. “She told us that she loved us, that she had a gift waiting for us, and my mom and my sister and I just stayed on the phone until she couldn’t do it anymore,” Jennifer continues. Dimitriadis died of COVID on December 5, 2020. She left behind a community united in appreciation for her life. “When she passed, I had two different people tell me that she helped them in domestic violence situations. And my mother, with all the abuse she experienced, was very aware of other people’s circumstances,” Jennifer says. Jennifer believes she knows who to blame for her mother’s death. Dimitriadis was careful during the pandemic, keeping close to home to protect herself, but home would not stay a sanctuary: according to Jennifer, a Trump-supporting relative who refused to wear masks brought the virus to Dimitriadis. Jennifer says that even after Dimitriadis passed away, that relative still did not believe that COVID was a major threat. Right-wing rhetoric fostered a delusion immovable even by Earla’s death. Jennifer is still angry. Not only did the politicization of COVID contribute to her mother’s death, it complicated everything that followed. “I don’t think people realize behind every COVID death, there’s this catastrophic grief that is often interlocking with so many different things because we’re complex human beings,” she explains. While she mourned her mother, she feared for her husband, an essential worker who stripped at the back door every day because of the possibility he’d spread COVID. When a death is political, grief is a territory to defend. “People fat-shamed my mom in her death, and I’ve been called a crisis actor. I’m like, ‘Why would I fucking put myself out there knowing the hatred that’s going to be spewed at me, and the comments?’” Jennifer wonders. Melissa Powers, who lost her mother, Deborah Smith, to COVID, says she encountered a similar hatred. “I just started dropping people off my Facebook friend list and blocking people out of my life, because they’d be like, ‘COVID’s a hoax, and it’s all overblown, and only people that are old and frail are dying.’ Talking about people like they don’t matter because they’re old,” she adds. Melissa and Jennifer stare down a conservative movement convulsed by the pandemic. For the right, so skeptical of experts, government intervention, and collective action, the pandemic was a political problem. Their solution was an active and collective neglect. A real response would have shaken the movement to its foundations. Trump, then, could only intermittently endorse public health measures. Meanwhile, conservative activists and intellectuals cried out against lockdowns, masks, and vaccine mandates to provide the president with the cover he needed to retreat and, later, to undermine his liberal successor. They couched their words in the language of liberty and populist fervor. Patrick Deneen, the post-liberal academic, once said that “elites” favored lockdowns in opposition to the “masses.” Quoting Christopher Lasch, he said that the masses understand “inherent limits on human control over social development, over nature and the body, over the tragic elements in human life and history.” R. R. Reno, the editor of First Things, tweeted that “mask culture if [sic] fear-driven” and that “it’s a regime dominate [sic] by fear of infection and fear of causing of infection. Both are species of cowardice.” The right cared nothing for either Jennifer or Melissa, or for their mothers. Their pain only made them targets in a broader conflict. The American right wing revels in a war on the public sphere. As the writer Matthew Sitman put it in an essay for Gawker, “The right benefits from people becoming more isolated, hunkered down, wary of others, and doubtful that a better future can be built. It is to such people that the reactionary message appeals: the best you can hope for is to hoard what you have, and attack the shadowy forces and alien others that you’re told imperil you and your livelihood. Solidarity and generosity are turned into risky wagers not worth taking.” Jennifer is more than a target to the right. Once an activist for the group Marked by COVID, she remains an advocate, speaking out about her mother’s death and pushing for a COVID remembrance day in her home state of Massachusetts. She is therefore a threat. By asking the public to remember the dead — and why they died — she defies a plot that stole her mother’s life. Most Americans supported lockdown measures and mask mandates at the time, just as most American voters had rejected Donald Trump at the ballot box in 2016. Though Trump liked to call himself a man of the silent majority, he only ever represented a febrile minority. Yet that minority inflicts real damage on themselves, and on bystanders like Dimitriadis. As COVID spread, conservatives weren’t merely disruptive; they were trying to break society apart. Conspiracy theories foretold collapse; now the fringe was forcing a war. In the process, the far right found common cause with conservative intellectuals, the so-called mainstream. A skepticism of democratic institutions has given way to pure authoritarianism. In previous decades conservatives were more willing to work within democratic means, but the pretense is over. The right fractures old bonds to make way for a new order — one they aim to control. COVID denialism is a rejection of society, which has always been more than a grouping of relationships. Society is an idea, and during COVID, an egalitarian ethos clashed directly with an antidemocratic view. There were casualties, including Dimitriadis. To the right, their deaths are an acceptable loss. A disposable person has no innate rights, no meaning beyond the profit they can generate for others. The right’s new order would make more people disposable, with little say over their working conditions let alone the trajectory of the nation. To understand the right’s reaction to COVID, look to its past. Though we may associate “crunchiness” with the left, there is a long history of medical skepticism and “crunchy” thinking on the right, and on the far right in particular, as the historian Kathleen Belew noted in a piece for the Atlantic. “Consider Coeur d’Alene, Idaho, the home of the white-separatist compound Aryan Nations,” which simultaneously appealed to “environmentally inclined leftists attracted to the scenic lakes and mountains,” she added. “Scholars have spent ample time on other alliances between neighbors in this period — such as the way the white-power movement radicalized its rural neighbors affected by the farm crisis of the 1970s.” Both groups can fixate upon “ideas of purity, an interest in survivalism, and a deep distrust of the government,” albeit for different reasons, and water fluoridation emerged as a point of agreement. Some progressive environmentalists believed fluoride threatened human bodies and ecosystems alike. Libertarians opposed fluoridation on individual-rights grounds. To members of the John Birch Society, fluoride was a communist plot to poison red blooded Americans. White nationalists consumed by thoughts of a coming race war “worried that fluoride would make people docile, such that revolution against the state and race war would be harder to accomplish,” Belew wrote. “I often think of the far right as the people who beta test talking points and moral panics, so they beta tested the fluoride thing,” explains Seth Cotlar, a professor of history at Willamette University who has studied the right. That fringe antifluoridation message gained some traction, he adds. “When we talk about fluoride as this evil conspiracy to sap you of your bodily purity, people’s ears perk up and they hear it. They respond to it, and they’ll show up at city council meetings and get really angry about it. It becomes a way to just throw a monkey wrench in public interest governance, which is what these fascists are angry about.” For the far right, antifluoridation also looked like a means to transcend the fringe and earn the mainstream consideration they otherwise lacked. “They learn that a very small number of very dedicated people, who show up with a barrage of what looks like scientific information, can pretty easily circumvent what feels like an emergent consensus, so they do it and they push it,” he says. The right’s antifluoridation tactics capitalized upon the public’s Cold War fear of communism. Many were openly anti-Semitic and white nationalist, eager for a way to popularize their racist ideals. Although activists were prone to overstate their influence, they were able to dissuade some locales from fluoridating water supplies despite the clear public health benefits of doing so. Matthew Dallek, a political historian at George Washington University and the author of Birchers: How the John Birch Society Radicalized the American Right, sees echoes of old Bircher obsessions in today’s conservative movement. In addition to the suspicion that communists would use fluoride to poison an unsuspecting American public, “there’s a somewhat milder version of it, which is basically that this is government trying to control our lives.” Birchers latched on to the belief that too much fluoride would yellow the teeth as proof it was dangerous for human consumption. “But again, they sort of latch onto this as the rhetoric of ‘it’s a choice.’ It should be a choice in the same way maybe the vaccines should be a choice for small kids. And so that, I would say, has been a significant through line in modern times,” he adds. “You can draw a line, I think, between the conspiracy theories about fluoride and the vaccine and mask denialism.” Dallek sees further echoes in the Society’s promotion of laetrile, an extract found in fruit seeds such as apricot that could, proponents claimed, cure cancer. One Birch Society leader, a urologist, prescribed the extract to a patient with cancer, who later died; the family sued. “The reason I think this story is relevant is that there are even doctors and dentists who are supposedly scientists or people of science who engage in this kind of public health denialism and conspiracy theories,” Dallek says. “It’s not alternative medicine, it’s really a denialism. It’s not thinking about yoga or meditation to calm anxiety, which is a legitimate field of study, or psychedelics to treat depression. These are things that just have no real basis in scientific reality.” Though membership in the John Birch Society would decline over the years, its conspiratorial ideas persisted. Beyond the John Birch Society, the right wing’s commitment to public health denialism goes back decades and even centuries. Dr. David Gorski, a surgical oncologist who is the managing editor of the website Science-Based Medicine, and who has monitored the anti-vaccine movement for nearly two decades, tells me that there has always been a rightward tilt to vaccine hostility. At anti-vaccine protests in the 1800s, you’d hear familiar messages about the tyranny of vaccine mandates. Though there are “enclaves” of left-wing vaccine resistance in places like Marin County, California, he says, “beginning sometime around the rise of the Tea Party movement, I started noticing the shift. Even then, some of the most prominent anti-vaxxers were conservatives.” In 2007, Texas offered a glimpse of alliances to come when a coalition of right-wing organizations and parents formed against then-governor Rick Perry, who’d issued an executive order requiring the Gardasil HPV vaccine for girls ages eleven and twelve. The vaccine, which was created by Merck, protects against some cancer-causing forms of HPV. Many conservative groups, particularly Christian right groups, went on the attack. To the Eagle Forum, Perry’s order represented unforgivable governmental overreach — especially for a Republican politician. In one 2007 editorial, the late Phyllis Schlafly attacked Perry, citing reports that his reelection campaign had received $5,000 from Merck’s political action committee. Not only had Perry been bought, she insinuated, his order “would force the vaccine on good girls who don’t engage in premarital sex and don’t need the vaccine.” (Bad girls would have to suffer.) Texas legislators overrode the executive order, but Perry defended his decision until a presidential campaign event in 2011, when he admitted he hadn’t done his research. “I always thought that it should have been the "
