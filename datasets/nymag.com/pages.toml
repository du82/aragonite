title = "Trump and Musk’s Government Purge Is Intensifying: Updates"
description = "Scores of federal workers are getting axed, endangering many government services, and Trump has now literally declared himself above the law."
full_description = '''politics Live 12:39 p.m. Trump and Musk’s Government Purge Is Intensifying: Updates By Intelligencer Staff Photo: Kayla Bartkowski/Getty Images It was a busy week for President Trump’s government demolition efforts, with mass layoffs beginning at numerous agencies as part of a long expected purge of the federal workforce. For now, the layoffs are just targeting probationary employees, who have less protection than longtime federal workers. The full impact of Trump and DOGE’s “force reductions” remains to be seen. Below are updates, analysis, and commentary over the holiday weekend as the shockwaves spread. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 16, 2025, 12:39 PM EST Bird flu first defenses among those hit by Trump and DOGE layoffs Seems like a bad idea. Reports Politico: Laboratories in a national network of 58 facilities responding to the spread of bird flu were notified Friday that 25 percent of the staff in a central program office coordinating their work were fired in the Trump administration’s mass layoffs of federal employees.USDA’s National Animal Health Laboratory Network program office has a staff of only 14 people, but it plays a major role in responding to animal disease outbreaks. It’s responsible for data management, ensuring that labs across the country are conducting the same tests and following similar protocols to accurately and effectively track animal diseases.The labs that make up the American Association of Veterinary Laboratory Diagnosticians were informed that testing and other responses to the H5N1 outbreak would be slower after the layoff, said Keith Poulsen, director of the Wisconsin Veterinary Diagnostic Laboratory. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 16, 2025, 10:24 AM EST More upheaval at the National Archives The acting U.S. archivist is gone, as are several other top officials, per the Washington Post: A source familiar with the situation said that the acting archivist, William J. Bosanko, and the agency’s inspector general, Brett M. Baker, decided to retire and that several other senior officials resigned after Trump officials made it clear they wanted to remove the agency’s leadership team and install loyalists. The person spoke on the condition of anonymity to discuss internal matters. Bosanko’s week-long tenure is the shortest the in history of the agency. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 15, 2025, 4:39 PM EST At least 20 immigration judges got the axe The AP reports: On Friday, 13 judges who had yet to be sworn in and five assistant chief immigration judges were dismissed without notice, said Matthew Biggs, president of the International Federation of Professional and Technical Engineers, which represents federal workers. Two other judges were fired under similar circumstances in the last week.It was unclear whether they would be replaced. The US Department of Justice’s executive office for immigration review, which runs the courts and oversees its roughly 700 judges, did not immediately respond to a request for comment on Saturday.Immigration courts are backlogged with more than 3.7m cases, according to Syracuse University’s Transactional Records Access Clearinghouse, and it takes years to decide asylum cases. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 15, 2025, 3:00 PM EST Nuclear safety workers were apparently fired by mistake NBC News reports on the Trump administration’s botched efforts to rehire them: National Nuclear Security Administration officials on Friday attempted to notify some employees who had been let go the day before that they are now due to be reinstated — but they struggled to find them because they didn’t have their new contact information.In an email sent to employees at NNSA and obtained by NBC News, officials wrote, “The termination letters for some NNSA probationary employees are being rescinded, but we do not have a good way to get in touch with those personnel.”The individuals the letter refers to had been fired on Thursday and lost access to their federal government email accounts. NNSA, which is within the Department of Energy and oversees the nation’s nuclear stockpile, cannot reach these employees directly and is now asking recipients of the email, “Please work with your supervisors to send this information (once you get it) to people’s personal contact emails.” .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 15, 2025, 2:55 PM EST Trump suggests the law is whatever he wants it to be It’s President’s Day weekend, and the current president is embracing his inner monarch: President Trump’s latest posting: pic.twitter.com/3Gjsoifxlx— Jonathan Lemire (@JonLemire) February 15, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 15, 2025, 2:55 PM EST The impact on government services is just beginning The Washington Post reports on just some of the immediate-term effects caused by the Trump administration’s purge: In an Energy Department subagency that helps provide power, staff who handled homeowners’ electricity bills were fired, employees said, potentially leaving no one to take the money that keeps their lights on. In one state, all but two of the employees who helmed an Agriculture Department program assisting poor rural communities were fired. And in a tiny Wyoming town, a Forest Service office that has spent decades providing support to hikers, Christmas tree permits to residents and firewood for the elderly has been forced to shutter, a staffer said. …Meanwhile, some federal employees who moved across the country to take positions in D.C., suddenly jobless, say they are unable to pay their rent and unable to afford a move back home. Others are struggling to figure out how they’ll afford their children’s college tuition or care for elderly parents. Many — newly fired or worried about being next — are frantically submitting applications for as many open jobs as they can find. Still others are mourning the decades-long careers in the federal government they hoped to have. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 15, 2025, 2:55 PM EST How much will IRS layoffs impact tax season? The Internal Revenue Service reportedly plans to lay off thousands of probationary workers next week, amid ongoing GOP efforts to claw back the Biden administrations large-scale investments in the agency. As the Associated Press notes, it’s not at all clear what that will mean for the agency as it handles Americans’ tax returns. IRS employees working on the 2025 tax season were not eligible for the Trump administration’s “fork in the road” buyout offer, but nobody seems to know yet how eliminating probationary employees will impact tax season efforts. The Washington Post reports that as many as 9,000 IRS employees may get the axe, and that the layoffs are likely to target tax collection. Elon Musk’s DOGE team is heavily involved in the plans, as well. .cls-1 { fill: none; } Copied Chas Danner Updated Feb. 15, 2025, 2:55 PM EST DOGE is using a sledgehammer, not a scalpel As Ed Kilgore explains: [D]on’t be too fooled by the smoke and mirrors of DOGE technological virtuosity in doing its job. At bottom, it’s the same approach to the federal budget that knuckle-dragging conservative ideologues have adopted at least since the Reagan administration. Like his low-tech predecessors, Musk regards even good government as inherently wasteful, which in turn makes efforts to improve what taxpayers get for their money a waste of time. What DOGE is doing could in theory be good, bad or just mindless. But it’s mostly a blast from the past rather than any sort of cutting-edge “reform.” Sign Up for the Intelligencer Newsletter Daily news about the politics, business, and technology shaping our world. Email This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Vox Media, LLC Terms and Privacy Notice By submitting your email, you agree to our Terms and Privacy Notice and to receive email correspondence from us. Tags: remove interruptions liveblog politics early and often federal employees doge donald trump elon musk we'll do it live More Show Leave a Comment Trump and Musk’s Government Purge Is Intensifying: Updates const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'intelligencer'; const keywords = ["remove interruptions","liveblog","politics","early and often","federal employees","doge","donald trump","elon musk","we'll do it live"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
