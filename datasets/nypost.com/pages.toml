["https://nypost.com/2025/02/28/tech/google-chrome-users-warned-to-delete-16-popular-extensions-due-to-malicious-threat-risk"]
title = "Google Chrome users warned to delete 16 popular extensions due to 'malicious' threat risk"
description = 'Google Chrome users have been warned to delete 16 "malicious" browser extensions that could lead to a security threat and "fraud" at the hands of a prolific "threat actor."'
full_description = '''Tech Google Chrome users warned to delete 16 popular extensions due to ‘malicious’ threat risk By Eric Hegedus Published Feb. 28, 2025, 6:04 p.m. ET Google Chrome users have been warned to delete more than a dozen dangerous browser extensions. SOPA Images/LightRocket via Getty Images Google Chrome users have been warned to delete 16 “malicious” browser extensions that could lead to a security threat and “fraud” at the hands of a prolific “threat actor.” The extensions affect functionality involving screen capture, ad blocking, emoji keyboards and more, with a potential impact on at least 3.2 million users, according to GitLab Threat Intelligence, which first reported the threat. The extensions inject code and harmful scripts into browsers, allowing hackers to steal user data and engage in search-engine fraud involving ad revenue, according to Tom’s Guide. The affected extensions deal with screen capture, ad blocking, emoji keyboards and more. Take Production – stock.adobe.com After users granted permission to use them, the extensions, while legitimate, were infected with malicious updates that corrupted them. According to tech site Notebook Check, the attack was traced to developer accounts that unknowingly transferred control of extensions to the attackers, whose dangerous updates were available through official browser extension stores. Explore More How to stop getting a ton of unwanted phone calls Tesla owners may be swapping out vehicle logos due to vandalism fears linked to Elon Musk How 'PayPal Mafia' ousted Musk from CEO job — then saved SpaceX The dangerous extensions include: Blipshot Emojis (Emoji Keyboard) Color Changer for YouTube Video Effects for YouTube and Audio Enhancer Themes for Chrome and YouTube Picture in Picture Mike Adblock für Chrome Super Dark Mode Emoji Keyboard Emojis for Chrome Adblocker for Chrome (NoAds) Adblock for You Adblock for Chrome Nimble Capture KProxy Page Refresh Wistia Video Downloader WAToolkit The legitimate extensions were infected with malicious updates. SHOTPRIME STUDIO – stock.adobe.com The targeted extensions already have been removed from the Chrome Web Store, but users should manually delete them if they are still installed on their browsers. Tom’s Guide advises then using antivirus software to scan for malware or other viruses. Filed under computers cybersecurity google 2/28/25 Read Next Sam Altman's OpenAI launches GPT-4.5 with fewer 'hallucina... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_atf")) { googletag.display("div-gpt-ad-rec_atf"); } else { console.log('div-gpt-ad-rec_atf not a defined slot', window.definedSlots || []); } }); } var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-native")) { googletag.display("div-gpt-ad-native"); } else { console.log('div-gpt-ad-native not a defined slot', window.definedSlots || []); } }); } Trending Now on NYPost.com This story has been shared 54,214 times. 54,214 How to watch Tank Davis vs. Lam