["https://nypost.com/2025/03/01/entertainment/francis-ford-coppola-roasts-gutless-hollywood-after-razzies-worst-director-win-an-industry-so-terrified-of-risk"]
title = "Francis Ford Coppola roasts 'gutless' Hollywood after Razzies 'worst director' win: 'An industry so terrified of risk'"
description = "Coppola first began developing “Megalopolis” in the late 1970s."
full_description = '''Entertainment Francis Ford Coppola roasts ‘gutless’ Hollywood after Razzies ‘worst director’ win: ‘An industry so terrified of risk’ By Alexandra Bellusci Published March 1, 2025, 3:17 p.m. ET Francis Ford Coppola and his granddaughters. AFP via Getty Images Francis Ford Coppola is taking his 2025 Worst Director Razzies win in stride. The Oscar winner, 85, was given the title at the notorious award show for his 2024 sci-fi drama “Megalopolis,” which starred Adam Driver, Aubrey Plaza, Jon Voight, and Shia LaBeouf. The big-budget movie, which cost $120 million to make, was a commercial flop making just $14.6 million at the box office. It was also panned by critics, including The Post’s Johnny Oleksinski 5 Francis Ford Coppola attends the “Megalopolis” premiere. WireImage However, Coppola clapped back after the Razzies honor — or, rather, dishonor — on social media. The veteran director wrote on Instagram on Friday, “I am thrilled to accept the Razzie award in so many important categories for @megalopolisfilm, and for the distinctive honor of being nominated as the worst director, worst screenplay, and worst picture at a time when so few have the courage to go against the prevailing trends of contemporary moviemaking!” Explore More 'Grey's Anatomy' star shares 'very subtle' warning signs ahead of brain tumor diagnosis Teddi Mellencamp, 43, gives health update after undergoing surgery to remove brain tumors Christopher Reeve's son reveals sweet way he'll honor late father at wedding The famed creator then took a moment to reflect on Hollywood and movie-making in the current day and age. 5 Francis Ford Coppola attends the 2024 Kennedy Center Honors. FilmMagic “In this wreck of a world today, where ART is given scores as if it were professional wrestling, I chose to NOT follow the gutless rules laid down by an industry so terrified of risk that despite the enormous pool of young talent at its disposal, may not create pictures that will be relevant and alive 50 years from now.” Coppola added, “What an honor to stand alongside a great and courageous filmmaker like Jacques Tati who impoverished himself completely to make one of cinema’s most beloved failures, PLAYTIME!” “My sincere thanks to all my brilliant colleagues who joined me to make our work of art, MEGALOPOLIS, and let us remind ourselves us that box office is only about money,” he continued, “and like war, stupidity and politics has no true place in our future.” 5 Adam Driver in “Megalopolis.” ©Lions Gate/Courtesy Everett Collection Many fans showed their support for Coppola in the comments section. One follower wrote: “Megalopolis was a masterpiece Mr Coppola, me and my friends still think about it almost everyday.” Another chimed in, saying: “I applaud you, sir. Continue to walk to the beat of your own drum. I wish there were many others that also had the courage to do so.” Rounding out the sweet comments, was the Razzies themselves, writing, “So much respect to FFC as a filmmaker and especially for acknowledging our award with a humble and meaningful statement.” Coppola first began developing “Megalopolis” in the late 1970s to shed light onto his long-standing vision of a Roman epic set in modern-day New York. 5 Aubrey Plaza in “Megalopolis.” ©Lions Gate/Courtesy Everett Collection 5 Grace VanderWaal in “Megalopolis.” ©Lions Gate/Courtesy Everett Collection “Everyone’s so worried about money,” he told The Associated Press in September ahead of the movie release. “I say: Give me less money and give me more friends.” “I realized that the genius of human invention usually happened when we were playing with our kids. It’s in the act of play that we’re so creative,” Coppola reflected on his films’ perspectives. “The cave paintings, you see hands but there are big hands and little hands.” Filed under directors films francis ford coppola razzie awards razzies 3/1/25 Read Next Teddi Mellencamp, 43, gives health update after undergoing... // set a default widg