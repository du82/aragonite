full_description = '''Sports Book an exclusive Yankees spring training trip now for the 2025 season By Sophie Cannon Published Oct. 7, 2024, 4:15 p.m. ET New York Post may be compensated and/or receive an affiliate commission if you click or buy through our links. Featured pricing is subject to change. Forget taking me out to the ball game — take me to Florida to hang out with the Yankees during spring training. For the first time, TrueFan Travel has announced a New York Spring Training travel package for March 2025. Reserve your slot now and then, from March 16 through March 21, enjoy all that spring training has to offer in sunny Clearwater Beach and Tampa. “The New York Post is excited to partner with TrueFan Travel to help promote their Yankees Spring Training event,” said Brad Elders, COO of the New York Post. “As the travel company moves into the New York sports fan market, we see a natural alignment as the Post is the premiere content destination for New York sports fans.” The TrueFan Travel New York Spring Training Trip includes: TrueFan Travel 5 night stay at the Hilton Clearwater Beach Resort Meet and greet with Lou Piniella, former Yankee player and manager, and a New York Post sports insider yet to be announced All-inclusive St. Patrick’s Day party with food, drinks, and live entertainment Yacht party with great food and premium open bar Game day transportation Group tickets to two Spring Training games Flights and airport transfers available as an add-on BOOK NOW “New York Yankees fans are known for their dedication, loyalty, and knowledge of their current team and the history of the franchise,” said Vince Rizzuto of TrueFan Travel. “We have traveled all over the world and seen NY Yankees gear in almost every city we have visited. It’s an iconic brand. Fans can join us in Florida for spring training from anywhere – assembling Yankees fans from every corner of the globe for a celebration of the team in a fun, relaxing environment by the beach.” Which Yankees Spring Training games are included? The two exhibition games included for 2025 are sure to be the most entertaining of spring training. On March 18, the Yankees play the Red Sox at Steinbrenner Field and the following day the Yankees face off against the Phillies at BayCare Ballpark. Before the games, celebrate St. Patrick’s Day in style with an all-inclusive party with food, drinks and live entertainment. There will also be a chance to sail with fellow sports fans during a yacht party complete with an open bar and good vibes. To get hyped ahead of the 2025 season, enjoy a recap from last season’s festivities with a Phillies-centric trip from 2024. The play-by-play below is a great sneak peak into what you can expect from the 2025 package, so see below for some beach-front views, St. Patrick’s Day parting and plenty of baseball. Travel packages and pricing information To make the most of this March holiday, rally four of your super fan friends and get your five-night package for as low as $1,899 per person. A three-person room starts at $2,099, two-person starting at $2,399 and a solo trip starting at $3,599. Need flights and airport transfers to and from? You can add on round-trip direct flights from LaGuardia to Tampa with charter bus transfers for $650 per person, taking the planning off of your (home) plate — pun intended. BOOK NOW Check out New York Post Shopping for more content. Filed under florida new york yankees sports fans spring training travel deals 10/7/24 Read Next Yankees vet making first career start at first base for AL... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zer