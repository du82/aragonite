title = "GrubHub lays off 500 employees -- weeks after food delivery giant sold to Wonder"
description = "GrubHub laid off 500 employees -- or 20% of its workforce -- less than two months after the food delivery service was acquired by food app delivery rival Wonder, The Post has learned."
full_description = '''Business GrubHub lays off 20% of employees — two months after rival acquires food delivery platform By Lisa Fickenscher Published Feb. 28, 2025, 1:01 p.m. ET GrubHub laid off 500 employees — 20% of its workforce — less than two months after the food delivery service was acquired by food app delivery rival Wonder. Grubhub’s chief executive, Howard Migdal, addressed employees in a blog post at 7 a.m. Friday. “We’ve made the difficult decision to eliminate approximately 500 positions at Grubhub,” Migdal said in the post. “These changes span all teams as we begin to integrate functions with Wonder.” 3 GrubHub employees were told to work from home on Feb. 28 pending news about a restructuring. Getty Images Employees were asked to work from home Friday as the newly combined company revealed news about restructuring “that will impact the number of roles we’ll have at GrubHub,” according to an online post about the cuts. “We know this is tough news to hear and will likely cause some uneasiness for the rest of the today. Our intention is to be transparent and inform everybody of these actions in advance to help you prepare.” Explore More Google's co-founder has wild expectations for how many hours a week AI employees should work Elon Musk begs 'top notch' air traffic controllers to come out of retirement to ease shortage Montauk's $100 lobster salad may be latest casualty in battle between East Hampton and wealthy residents In November, Wonder announced a deal to acquire GrubHub from Just Eat Takeaway.com for $650 million. The sale, completed Jan. 7, was a massive haircut for the Amsterdam company which bought GrubHub for $7.3 billion. 3 Amsterdam-based Just Eat Takeaway.com sold Grubhub for a pittance of the $7.3.billion it paid for it three years ago. Ascannio – stock.adobe.com Wonder was founded by serial tech entrepreneur Marc Lore — whose famously successful startups have included Diapers.com and Jet.com, acquired by Amazon and Walmart, respectively. Wonder bills itself as a “new kind of food hall” that delivers made-to-order meals from well-known chefs and restaurants. 3 Wonder bills itself as a “food Hall” delivery service. Wonder A GrubHub spokesperson said in a statement, “18 months ago, we launched a plan to accelerate growth and return to positive free cash flow. We’re proud that we achieved positive free cash flow in 2024 and that we have returned to growth. We have good momentum, and today’s reorganization will allow us to continue maximizing our potential by increasing investments to fuel growth.” Filed under food delivery grubhub marc lore mergers & acquisitions 2/28/25 Read Next Sam Altman's OpenAI launches GPT-4.5 with fewer 'hallucina... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_atf")) { googletag.display("div-gpt-ad-rec_atf"); } else { console.log('div-gpt-ad-rec_atf not a defined slot', window.definedSlots || []); } }); } var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-nat