title = "Fox News' Kat Timpf thanks fans for support after breast cancer diagnosis announcement"
description = "Fox News personality Kat Timpf thanked fans for their support after she announced Tuesday that she's been diagnosed with breast cancer -- and assured her supporters that she's getting the “best medical advice” possible."
full_description = '''Entertainment Fox News’ Kat Timpf thanks fans for support after breast cancer announcement By Shane Galvin Published Feb. 28, 2025, 9:45 p.m. ET Fox News personality Kat Timpf thanked fans for their support after she announced Tuesday that she’s been diagnosed with breast cancer — and assured her supporters that she’s getting the “best medical advice” possible. Timpf took to social media on Friday to address those who were shocked by her double-barreled bit of health news earlier this week — announcing the birth of her first child and her “Stage 0” cancer diagnosis. “Thank you so much for all the support. Its meant so much to me, this is obviously a really crazy difficult unexpected time and I really do appreciate it,” Timpf said in a selfie video posted onto X. 4 Timpf says she received concerned advice from fans when they heard her potential medical plan of action. X/@KatTimpf 4 The “Gutfeld!” star was able to work some humor into the personal announcement. X/@KatTimpf The Fox host relayed that many worried watchers reached out with questions after she revealed Tuesday that doctors said her “best course of action would likely be a double mastectomy as soon as possible.” “Trust me, there’s no one for whom [a double mastectomy] seems more extreme than me,” Timpf explained in her Friday update. Explore More 'Grey's Anatomy' star shares 'very subtle' warning signs ahead of brain tumor diagnosis Teddi Mellencamp, 43, gives health update after undergoing surgery to remove brain tumors Christopher Reeve's son reveals sweet way he'll honor late father at wedding “I don’t take cutting my t–s off lightly,” Timpf said, adding, “As a general rule I don’t think any woman does. I find it devastating.” Timpf then said that she consulted with her team of medical professionals who came up with a treatment plan that worked for her, and that she is getting the “best medical advice” possible. 4 Timpf shared this image of her while pregnant. @kattimpf/Instagram “Every case of breast cancer is very different. There are a lot of details of mine that I haven’t shared,” she said. “Trust that I’m making the best decision for me and my family.” The “Gutfeld!” regular stressed that the most important thing for her is to be able to take care of her newborn son. 4 The Fox News personality with her husband Cameron Friscia (right). @camfrish/Instagram Timpf was dramatically diagnosed with breast cancer just 15-hours before giving birth to her son — though she took the news in stride, even finding a place for humor. “Don’t freak out. It’s just, like, a LITTLE bit of cancer,” she wrote. “I’m learning to celebrate everything I can. I’m lucky that we found the cancer so early; I’m lucky to be my son’s mom,” Timpf wrote. The five-year survival rate of those diagnosed with breast cancer is 99%, according to the National Breast Cancer Foundation. Filed under breast cancer cancer fox news 2/28/25 Read Next Blackpink's Lisa, hot off her new solo album, is performin... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_atf")) { googletag.display("div-gpt-ad-rec_atf"); } else { console.log('d