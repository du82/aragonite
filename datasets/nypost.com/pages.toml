title = "Democrats and the media are still gaslighting on the Biden decline cover-up"
description = "Democrats have learned nothing from the backlash to their constant lies about then-President Joe Biden’s mental decline."
full_description = '''Opinion editorial Democrats, media still refusing to own the Biden-decline coverup By Post Editorial Board Published Feb. 28, 2025, 6:50 p.m. ET A onetime top Biden aide admitted staff knew that the ex-prez's "age was an issue" from "Day 1." AFP via Getty Images Democrats have learned nothing from the backlash to their constant lies about then-President Joe Biden’s mental decline. In an interview with Puck, onetime top Biden aide Michael LaRosa admitted the obvious: The staff knew that the ex-prez’s “age was an issue” from “Day 1” and opted for “gaslighting” the public when his behavior raised alarms. Yet in the same breath, he pushed back against calling this a “coverup” as “a little harsh.” Not remotely harsh enough, in fact: That the Bidenites, Dems in general and most of the press kept up the deception so long has earned them a lasting distrust — and owning up to the wrong is the necessary first step in recovering any credibility. Hence the broad contempt for journo Jake Tapper’s announcement that he’s co-authoring “Original Sin: President Biden’s Decline, Its Cover-up, and His Disastrous Choice to Run Again,” due out May 20. Yes, his co-author Alex Thompson of Axios stands out for not playing along with the coverup, but Tapper was one of the worst. Explore More Dems lead Zelensky, Ukraine off a cliff with pressure to reject mineral deal Why 'cage-free' eggs are not all they're cracked up to be Why Trump still has a grand plan to solve the Ukraine crisis — even after heated Zelensky meeting Will he be dishing on all the details of his complicity? Again, most of the press actively played along in the gaslighting for four years as Americans watched their president forget where he was, mix up the names of foreign leaders and mumble his way through press conferences. Tapper even told Lara Trump in 2020 that she had “no standing to diagnose somebody’s cognitive decline” when she brought it up. He also attacked doubters for supposedly making fun of Biden’s lifelong stutter. For years, major media relayed Dems’ talking points that expressing doubts about the president’s mental acuity was right-wing propaganda and cruel ageism, and echoed party leaders’ insistence that he was “sharp” and “focused.” Now the very same water-carriers complain that President Trump’s team is upending their privileges for White House press briefings. No matter that they retain far more access to Trump than they ever did to Biden from his first days in the Oval Office. And the whole pack meant to keep the “Weekend at Bernie’s” charade going to re-elect Biden until that debate made the lies impossible to continue (though some of them tried for weeks more). None of this makes Americans trust Republicans, but if the GOP fails, the nation will simple face a bipartisan crisis of trust: Dems (and the media) can’t recover by just trying to wait out their shame. Yet Democrats like LaRosa are still in denial about how much his party’s dishonesty damaged its image, alienated voters and put the country in danger. And journos like Tapper seem to be hoping they can salvage their reputations by pretending they had nothing to do with the whole thing. It won’t work, and we hope Tapper’s book admits as much. The only way to rebuild trust in America’s institutions is for those institutions to start earning it back: More gaslighting will only see ensure it’s dead and buried. Filed under democrats editorial jake tapper joe biden Media white house 2/28/25 Read Next DOGE's war on the government class, Comey’s creepy sex-s... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type