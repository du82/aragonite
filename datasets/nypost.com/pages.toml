["https://nypost.com/2025/02/28/media/washington-post-subscribers-cancel-jeff-bezos-overhauls-opinion-page"]
title = "Washington Post subscribers cancel Jeff Bezos overhauls opinion page"
description = "A previous mass exodus of subscribers began in late October when Bezos reportedly blocked a planned endorsement of then-Vice President Kamala Harris."
full_description = '''Media Washington Post subscribers cancel in droves after Jeff Bezos overhauls opinion page By Ariel Zilber Published Feb. 28, 2025, 3:21 p.m. ET More than 75,000 digital subscribers have canceled their subscriptions to The Washington Post following an announcement by its owner, Jeff Bezos, that the paper’s opinion section would be revamped to align with libertarian ideals touting “personal liberties” and “free markets,” according to a report. The decision, which Bezos announced on Wednesday, triggered immediate upheaval within the organization, including the resignation of opinions editor David Shipley, who had unsuccessfully attempted to dissuade Bezos from the change. A previous mass exodus of subscribers began in late October when Bezos reportedly blocked a planned endorsement of Democratic presidential nominee Kamala Harris. Between that decision and Election Day, over 300,000 subscribers severed ties with the Post, amounting to more than 12% of its digital subscribers. 3 More than 75,000 subscribers to the Washington Post have cancelled their membership following owner Jeff Bezos’s decision to overhaul the opinion page. Getty Images Despite an aggressive push to attract new subscribers — adding 400,000 at discounted rates — the paper still has suffered a “net loss of a couple hundred thousand” paying subscribers, NPR reported. Explore More AOC asks NPR host to clarify the 'problem' when he brings up mass illegal immigration Ex-Chicago mayor slams city leaders for fixating on niche liberal issues while crime spirals Executive producer of Kaitlan Collins' CNN show abruptly leaves network: 'Taking a toll' Many within the newsroom believe that without Bezos’ interventions, the paper’s subscriber base would have remained significantly higher, according to National Public Radio, which first reported the latest round of cancellations. Shipley has not responded to requests for comment. A Washington Post spokesperson declined to comment. Bezos’ move to overhaul the opinions section was the subject of a column by Washington Post media critic Erik Wemple, but the piece was killed by editors, according to a report. The fallout extended beyond the newsroom, as longtime figures associated with the Post voiced their disapproval. Associate editor David Maraniss and former executive editor Marty Baron expressed concerns, with Baron describing the move as “craven.” 3 David Shipley resigned as opinions editor after Bezos introduced the planned changes. The Washington Post via Getty Images In an interview with Zeteo News, Baron, who had previously praised Bezos in his 2023 memoir, suggested the billionaire was “basically fearful” of President Trump. The number of subscription cancellations, first reported by NPR, was provided by a source who requested anonymity due to concerns about professional repercussions. The Washington Post Company, citing its status as a privately held business, declined to comment on the figures or the criticism. Bezos told staffers in a memo that he supported a shift toward supporting “personal liberties and free markets.” “We’ll cover other topics too, of course,” Bezos wrote in a message to staff, which he publicly shared on X, the social media platform owned by Elon Musk. “But viewpoints opposing those pillars will be left to be published by others.” He argued that in the digital age, newspapers no longer need to offer a “broad-based opinion section that [seeks] to cover all views.” Within the newsroom, concerns have escalated over potential editorial interference. Executive editor Matt Murray sought to reassure staff, stating that he had received no indication that Bezos intended to alter news coverage. He reiterated this position in a memo to employees, urging them to continue reporting “without fear or favor,” according to NPR. Bezos defended his editorial decisions, particularly the rejection of the Harris endorsement, by asserting that he was seeking to bolster the paper’s credibility among the broader public. 3 The Washington Post has been in a state of upheaval in recent months as Bezos seeks to shift the paper’s orientation. AFP via Getty Images “Most people believe the media is biased,” he wrote in an op-ed. “Anyone who doesn’t see this is paying scant attention to reality, and those who fight reality lose.” However, he also acknowledged that his business interests create complexities, as Amazon and Blue Origin have extensive contracts with the federal government. Given the Trump administration’s focus on reshaping government and private industry, concerns over conflicts of interest have arisen. “You can see my wealth and business interests as a bulwark against intimidation, or you can see them as a web of conflicting interests. Only my own principles can tip the balance from one to the other,” Bezos wrote in October. Since then, he has donated $1 million to Trump’s inauguration fund and attended the president’s swearing-in alongside other tech leaders. Trump later revealed that he had dinner with Bezos on Wednesday evening. The evolving relationship between Bezos and Trump has unsettled Post employees, with some choosing to voice their objections publicly. In January, Shipley rejected a political cartoon by Pulitzer Prize-winning staffer Ann Telnaes, which depicted Bezos and other tech moguls capitulating to Trump. Telnaes subsequently resigned. The controversy surrounding Telnaes’ departure sparked another wave of subscription cancellations, reportedly far exceeding normal levels. Filed under jeff bezos subscriptions washington post 2/28/25 Read Next Washington Post spiked media critic's column about Bezos's... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_atf")) { googletag.display("div-gpt-ad-rec_atf"); } else { console.log('div-gpt-ad-rec_atf not a defined slot', window.definedSlots || []); } }); } var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-native")) { googletag.display("div-gpt-ad-native"); } else { console.log('div-gpt-ad-native not a defined slot', window.definedSlots || []); } }); } Trending Now ON NYPOST.com This story has been shared 54,214 times. 54,214 How to watch Tank Davis vs. Lamont Roach: Fight time, full card and more This story has been shared 38,179 times. 38,179 Commanders acquire former All-Pro wide receiver in major trade with 49ers This story has been shared 36,335 times. 36,335 DOGE doubles down on 'what did you do last week' emails — with a new requirement var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_widget")) { googletag.display("div-gpt-ad-rec_widget"); } else { console.log('div-gpt-ad-rec_widget not a defined slot', window.definedSlots || []); } }); } Most Commented Join the Conversation This story has 5.7K comments. 5.7K Trump boots Zelensky from White House after Oval Office clash, says he ‘disrespected’ US as mineral deal left unsigned This story has 3.7K comments. 3.7K Trump tells Zelensky he’s 'gambling with WWIII' in heated, high-stakes Oval Office meeting This story has 2.2K comments. 2.2K AG Pam Bondi says DOJ will likely release Epstein files today: 'It's pretty sick' var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_btf")) { googletag.display("div-gpt-ad-rec_btf"); } else { console.log('div-gpt-ad-rec_btf not a defined slot', window.definedSlots || []); } }); } Now on Page Six Lizzo twerks in new video after showing off dramatic weight loss Harrison Ford diagnosed with shingles, steps down as presenter at 2025 Oscars: report Inside Justin Bieber’s 31st birthday celebration with wife Hailey, son Jack after singer slams drug use speculation See All Now on Decider Bill Maher Says Trump-Zelensky Oval Office Dispute Is Like ‘The Real Housewives of the White House’ See All'''
