title = "Models bare butt cracks at Milan Fashion Week and style gurus are outraged: 'I do not want to live in that world'"
description = "At Milan Fashion Week, Diesel debuted its fall/winter 2025 collection featuring egregiously low-cut denim in which models bared their butt cracks."
full_description = '''Fashion & Beauty Models bare butt cracks at Milan Fashion Week and style gurus are outraged: ‘I do not want to live in that world’ By Brooke Kato Published Feb. 28, 2025, 9:40 a.m. ET Low rise jeans are back — no butts about it. At Milan Fashion Week, Diesel debuted its fall/winter 2025 collection featuring egregiously low-cut denim in which models bared their butt cracks. The Italian fashion house, known for its subversive runway shows, dressed a gaggle of male and female models in peek-a-boo jeans that showed a hint of plumber’s crack paired with backless tops. 4 Diesel dared to design extremely low cut denim for the runway this season, the bumster jeans stealing the show. Shutterstock Models also donned striking all-white or black contact lenses, some with spray-painted smiles, as they paraded against the backdrop of graffitied tapestries, created with nearly 2 miles of fabric spray-painted by 7,000 artists. According to People, Diesel’s latest collection was meant to be “elevated yet disrupted, corrupted, slashed, destroyed, and impossibly low-cut.” Explore More Air Canada sues passenger who spent thousands on clothes while his luggage was missing — so who is in the right? US citizen faces hefty fines for accidentally bringing this common item into the country from overseas: 'Are they serious?' How Canada is getting 'quiet revenge' against the US — with coffee The NSFW bumster jeans harken back to ’90s — falling in line with the catwalk’s grunge, Y2K ambiance — but now all fashionistas were fans of the controversial cut. “PLEASE do not make plumber cracks a trend,” one person commented on Vogue’s TikTok coverage of the show. “I do not want to live in that world.” “Immediately no,” another chimed in. 4 While viewers at home lamented the return of plumber’s crack chic, Martens told press ahead of the show that he wanted to bring back the NSFW denim. REUTERS 4 Models wore backless shirts — which looked like paper mache button-ups — which accentuated their peek-a-boo backsides. Getty Images “Low rise jeans: yes. plumber cracks: no,” declared someone else. “Why ya’ll using cracks as accessories,” inquired one viewer. “Oh no not these jeans again,” lamented another. The daring denim was initially popularized by Alexander McQueen in 1993 with the “Taxi Driver” collection — and Diesel creative director Glenn Martens vowed to “bring them back,” according to the New York Times. But he isn’t the only one. 4 The models’ procession was set against a grungey backdrop created with nearly 2 miles of fabric spray painted by 7,000 graffiti artists. Shutterstock Dilara Findikoglu is no stranger to the controversial pants — from lace-up trousers to waistbands that dip dangerously low — and, last year, Ludovic De Saint Sernin presented leather pants baring “butt cleavage.” On the red carpet, too, celebrities like Katy Perry and Julia Fox have recently rocked the look. It’s enough to declare that cracks are officially back. “I feel like there’s a return to deliberate undressing,” Sarah Faisal, the founder of the UK-based vintage platform Baraboux, told Vogue Business. “It’s something that was a heavy trend in the ’90s with McQueen and Tom Ford at Gucci, picking what we reveal and making that the statement.” Filed under denim diesel fashion week jeans milan fashion week 2/28/25 Read Next Would you pay $500 to have your scalp washed in a car wash... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?