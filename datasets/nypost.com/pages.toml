["https://nypost.com/2025/02/28/real-estate/keith-rabois-and-jacob-helberg-want-65m-for-miami-home"]
title = "Keith Rabois and Jacob Helberg want $65M for Miami home"
description = "Rabois snapped up the modern Venetian Islands property in 2020 for about $29 million and poured an additional $15 million into high-end renovations."
full_description = '''Real Estate exclusive details Investor Keith Rabois and Trump pick Jacob Helberg want $65M for Miami Beach mansion with a scuba-size aquarium By Mary K. Jacob Published Feb. 28, 2025, 3:10 p.m. ET Venture capitalist Keith Rabois and his husband, Jacob Helberg — President Trump’s nominee for undersecretary of state for growth, energy and the environment — are looking to sell their massive Miami Beach estate for a $65 million as Helberg prepares to relocate to Washington, DC. Rabois snapped up the modern Venetian Islands property in 2020 for about $29 million and poured an additional $15 million into high-end renovations, according to the Wall Street Journal. Despite Helberg’s full-time move to DC, Rabois said he plans to remain in Miami Beach, though will often visit the capital. 19 Venture Capitalist Keith Rabois and Jacob Helberg, President Trump’s nominee for undersecretary of state for growth, energy, and the environment, are listing their Miami Beach home for $65 million. 1 Oak Studios 19 Rabois and Helberg bought the Venetian Islands property for around $29 million in 2020 and invested $15 million in renovations. 1 Oak Studios 19 The home includes a $1 million, 5,600-gallon aquarium requiring a scuba diver for maintenance. 1 Oak Studios Explore More Inside the condo crisis brewing in Florida's once-hot real estate market This COVID boomtown is seeing the biggest decline in rents in the country Here's how much it costs to buy the most expensive home in Texas — and it just upped its asking price “The house is 15,000 square feet, which is too large for just me while Jacob is in DC and I travel to New York City, San Francisco and DC every month,” Rabois told The Post of their decision to sell the home. The estate includes a giant 5,600-gallon aquarium that requires a scuba diver for upkeep. Their agent, Julian Johnston of Corcoran, told The Journal the tank, imported from Japan, set them back a cool $1 million. 19 The 15,000-square-foot home was built by former Bolthouse Farms president Andre Radandt in 2019. 1 Oak Studios 19 The kitchen boasts two islands. 1 Oak Studios 19 The outdoor kitchen. 1 Oak Studios The couple recently purchased a historic seven-bedroom home in Washington’s elite Kalorama neighborhood for roughly $7 million, The Post previously reported. Their sprawling Miami Beach residence was originally developed by the late Andre Radandt, former president of Bolthouse Farms, and completed in 2019. The six-bedroom estate boasts an infinity-edge pool, an outdoor kitchen, a private dock, a 55,000-pound boat lift and a sleek rooftop deck with a hot tub. 19 An outdoor space for sunbathing. 1 Oak Studios 19 A den. 1 Oak Studios 19 The outdoor terrace. 1 Oak Studios 19 A dining space. 1 Oak Studios The grand entrance features a dramatic bridge over a reflecting pool, leading to a two-story sculptural wall designed by the late artist Erwin Hauer. Inside, the home is equally over-the-top, with an open-concept kitchen and living area complete with a massive island and twin glass-enclosed wine cellars, which Rabois and Helberg added. They also installed restored wood floors and calfskin wall paneling, elevating the luxury factor even further. 19 The wet bar. 1 Oak Studios 19 The aquarium is a statement on its own. 1 Oak Studios 19 The entertainment area. 1 Oak Studios 19 Another view of the entertainment space. 1 Oak Studios But the true showstopper is the enormous aquarium, so large that maintenance requires a diver to enter through a secret hatch in the primary bedroom closet. Helberg, a senior adviser to Palantir Technologies CEO Alex Karp, has yet to be confirmed in his government role, while Rabois remains a major player in Silicon Valley as an early investor in companies like Stripe and DoorDash. He’s also a member of the so-called “PayPal Mafia,” alongside Trump allies Elon Musk and David Sacks. The couple, who married in 2018 in a St. Barts ceremony officiated by OpenAI’s Sam Altman, left San Francisco for Miami in 2020, joining a wave of tech executives fleeing the Bay Area. 19 An ensuite bedroom. 1 Oak Studios 19 An ensuite bathroom. 1 Oak Studios 19 A sauna. 1 Oak Studios 19 One of six bedrooms. 1 Oak Studios 19 Another bathroom. 1 Oak Studios At the time, Rabois didn’t hold back on his criticism of San Francisco’s leadership, calling the city poorly run while touting Miami’s business-friendly climate. But as artificial intelligence continues to dominate the tech world, Rabois now sees a shift back toward the West Coast. “If anything saves the Bay Area, it’s going to be this AI wave led by OpenAI,” he said at a recent conference. Miami’s luxury market has been red-hot in recent months, with multimillion-dollar deals closing regularly. Just last month, a property on nearby La Gorce Island sold for a breathtaking $100 million — proving that, for the ultra-wealthy, South Florida remains a prime destination. Filed under aquarium florida luxury luxury development luxury real estate mansion miami miami beach residential real estate silicon valley trump venture capital washington dc 2/28/25 Read Next Vice President JD Vance has listed his DC-area home for $1... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); What to Shop Now TikTokers swear by this viral walking pad for getting more steps in — It's under $100 on A