["https://nypost.com/2025/02/28/business/soaring-egg-prices-cost-restaurant-owner-20k-more-each-week"]
title = "Soaring egg prices cost restaurant owner $20K more each week"
description = "A rampant bird flu outbreak has sent egg prices soaring and the dining industry scrambling to catch up – with one DC-based restaurateur shelling out an extra $20,000 each week."
full_description = '''Business This Washington-based restaurateur is shelling out an extra $20K each week as egg shortage drives up prices By Taylor Herzlich Published Feb. 28, 2025, 5:46 p.m. ET A rampant bird flu outbreak has sent egg prices soaring and the dining industry scrambling to catch up – with one Washington, DC-based restaurateur claiming he shells out an extra $20,000 each week. Steve Salis, founder and chief executive of Catalogue, a restaurant holding company that owns more than a dozen locations across the Delaware-Maryland-Virginia area, said he started to notice his egg costs were piling up in the second week of January. “I let it go for about two or three weeks,” Salis told The Post, “but then I started saying to myself, ‘Oh my goodness’…I was on track to eat north of a million dollars [this year] and then some.” 3 Ted’s Bulletin restaurants offer a breakfast menu all day long. Catalogue The avian flu has forced farmers to cull their flocks across the country, causing shortages that sent egg prices soaring 15.2% in January – the largest monthly increase since 2015, according to the Bureau of Labor Statistics. Shortages have left customers fighting over a few cartons at the grocery store and restaurant owners struggling to contend with higher costs – especially breakfast chains that specialize in egg dishes, like Salis’ Ted’s Bulletin. Explore More GrubHub lays off 20% of employees — two months after rival acquires food delivery platform Google's co-founder has wild expectations for how many hours a week AI employees should work Elon Musk begs 'top notch' air traffic controllers to come out of retirement to ease shortage In just a few weeks, Salis said he went from paying $32 for a case of eggs to more than $70. And Ted’s Bulletin, which offers its breakfast menu all day long, serves up at least 25 dishes that contain eggs – requiring up to 500 fresh cases each week. “When I started seeing in grocery stores that you couldn’t go and buy eggs, and if you did, you were so fortunate like it was like liquid gold…it told me everything I needed to know,” he told The Post. Salis was born and raised in New Hampshire and started his career in the restaurant industry at 20, when he dropped out of college, moved to New York and worked as a caterer. 3 Steve Salis, founder and chief executive of Catalogue, a restaurant holding company that owns more than a dozen locations in the DMV area. Catalogue With 15 years in the industry under his belt, he decided this year to add a surcharge on his menu for the first time – a 75-cent fee on each menu item that includes eggs. “You don’t want to start slashing things that make your business important. You don’t want to reduce staff,” Salis said. Egg costs went from accounting for about 30% of his overall food purchases for Ted’s restaurants to as much as 45% now, Salis said. Ted’s Bulletin – one of Catalogue’s five restaurant brands – is not the first to resort to an egg surcharge. 3 Salis said soaring egg prices are costing him an extra $20,000 a week for Ted’s Bulletin locations alone. Catalogue Waffle House made headlines earlier this month when it added a 50-cent surcharge per egg to its menus. Denny’s, another large chain that specializes in breakfast dishes, quickly followed suit. “It’s a bit of a balancing act,” Salis told The Post. “We’ve been juggling a lot for a long time.” The jump in egg prices is a double whammy for breakfast chains, some of which are still recovering from pandemic-induced inflation, which forced many restaurants to shutter. Filed under bird flu inflation prices restaurants 2/28/25 Read Next Telsa manager says he was fired after speaking up about El... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_el