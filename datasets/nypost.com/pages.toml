full_description = '''Movies ‘Captain America: Brave New World’ still king of the box office since Valentine’s Day debut By Angela Barbuti Published March 1, 2025, 5:37 p.m. ET America still loves this superhero. For the second Friday in a row, “Captain America: Brave New World” was No. 1 at the box office. The film, released on Valentine’s Day, earned $3.6 million on Friday, its third in the theaters, according to The Numbers. 3 “Captain America: Brave New World,” starring Anthony Mackie as the titular character, landed in first place on its third Friday in theaters. ©Walt Disney Co./Courtesy Everett Collection It is expected to take in $14.5 to $15.5 million this weekend, Deadline reported. “Last Breath,” based on the true story of deep-sea divers who rescue a crewmate trapped hundreds of feet below the ocean’s surface, landed in second place on its first Friday in theaters, with sales of just over $3 million. Explore More Teddi Mellencamp, 43, gives health update after undergoing surgery to remove brain tumors Christopher Reeve's son reveals sweet way he'll honor late father at wedding Gene Hackman's wife 'hadn't called' her dementia-plagued mom in months, housekeeper says The survival thriller, which Screen Rant said “goes back to the basics of what makes a thriller so gripping,” stars Woody Harrelson, whom the outlet credited with giving “a solid performance.” Falling down a notch from last week and landing in third was “The Monkey,” with $1.8 million in revenue. 3 “Last Breath” stars Finn Cole, Woody Harrelson, Simu Liu, who play deep-sea divers. ©Focus Features/Courtesy Everett Collection 3 “The Monkey” landed in third. Courtesy Everett Collection In fourth place was “Paddington in Peru,” dropping down a spot, with a $970,000 take. “Dog Man” also dropped down a ranking to fifth, taking home $860,000. Filed under box office captain america Family Movies marvel marvel comics survival thrillers woody harrelson 3/1/25 Read Next Francis Ford Coppola roasts 'gutles