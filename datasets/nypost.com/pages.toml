title = "Dramatic bodycam footage shows pardoned Jan. 6 rioter Matthew Huttle shot dead during traffic stop"
description = "Matthew Huttle, 42, was killed in an altercation with a Jasper County sheriff’s deputy on Jan. 27 after he lunged for his gun inside his mini van when a cop pulled him over for speeding."
full_description = '''US News Dramatic bodycam footage shows pardoned Jan. 6 rioter shot dead during traffic stop: ‘I can’t go to jail’ By Patrick Reilly Published Feb. 28, 2025, 2:19 p.m. ET WARNING: GRAPHIC CONTENT A convicted Jan. 6 rioter pardoned by President Trump told an Indiana police officer that he “can’t go to jail” and threatened to kill himself before the cop shot him dead at a traffic stop, dramatic bodycam footage shows. Matthew Huttle, 42, was killed in an altercation with a Jasper County sheriff’s deputy on Jan. 27 after he lunged for his gun inside his minivan when a cop pulled him over for speeding. “I can’t go to jail for this, sir,” Huttle, looking fidgety and nervous, tells the deputy, video obtained by Fox 59 shows. When the cop asks him to put his hands behind his back so he can take him into custody, Huttle suddenly bolts for his vehicle. “Don’t you do it, buddy!” the deputy yells, chasing him. 4 Huttle looks distressed before he sprints to his van and reaches for a gun, bodycam footage shows. Jasper Co. Sheriffâs Dept. Explore More Honors student sues her Connecticut school district after graduation — claiming she is illiterate Ex-MSNBC host Joy Reid went on antisemitic 'rant' about COVID, former staffer claims Princeton fratricide victim remembered as 'friend to all' by older brother at heartbreaking funeral Huttle jumps into the van’s driver’s seat and can be heard wrestling with the officer as he attempts to grab his firearm. “I’m shooting myself,” Huttle can be heard saying. “No, no, no, no,” the deputy pleads. The deputy jumps back off Huttle, draws his pistol and unloads at least four rounds as he retreats from the van, the clip shows. 4 Matthew Huttle was pardoned for his involvement in the Jan. 6 riots the week before he was shot dead by a cop at a traffic stop. DOJ Huttle was stopped for driving 70 mph in a 55-mph zone and the altercation starts out pleasantly, video shows. Huttle, unprompted, tells the deputy early on, “I just want you to know I’m a January 6 defendant.” “What do you mean?” the deputy asks. “I stormed the Capitol,” Huttle says. 4 Huttle was pulled over for driving 70 in a 55-mph zone. Jasper Co. Sheriffâs Dept. “I can’t really afford to get in any trouble right now,” he says, to which the deputy lets out a small chuckle. He admits to driving without a license and the deputy goes back to his cruiser to run his information. When the deputy comes back, he asks Huttle to step out of the vehicle. The cop explains to Huttle that he has to take him into custody due to his felony status as a repeat offender. “Today, you are going to come with me,” the deputy tells him. 4 Huttle panicked after the deputy told him he was being taken into custody. DOJ Clinton County Deputy Prosecutor Chris Vawter said that after reviewing the footage, he believes that the shooting was justified. “Believing that Huttle posed a deadly threat, the deputy fired multiple shots, striking Huttle,” Vawter said in his findings, Fox59 reported. A loaded 9mm handgun and additional ammunition were found inside the minivan “near where Huttle had reached,” the prosecutor said. Huttle had pleaded guilty to entering a restricted building and spent six months behind bars before his release in July 2024. Just a week before his death, Trump pardoned him and 1,500 others for their involvement in the Capitol riot. Filed under capitol riot indiana pardons police shootings 2/28/25 Read Next Six Flags' iconic Kingda Ka roller coaster destroyed in dr... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; z