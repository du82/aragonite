["https://nypost.com/2025/02/08/lifestyle/juliana-canfield-and-rebecca-hall-admire-the-wearable-art-at-lafayette-148"]
title = "Exclusive | Juliana Canfield and Rebecca Hall admire the wearable art at Lafayette 148"
description = "When Juliana Canfield isn’t plying her craft on stage, she might be crafting on the couch. The Tony-nominated winning actor, who played Kendall Roy’s assistant Jess on “Succession” and Holly in the…"
full_description = '''Fashion & Beauty exclusive alexa Juliana Canfield and Rebecca Hall admire the wearable art at Lafayette 148 By Alev Aktar Published Feb. 8, 2025, 5:01 p.m. ET Juliana Canfield, Patina Miller and Rebecca Hall pose at the Lafayette 148 fall fashion presentation in Chelsea. Hannah Turner Harts/BFA.com / Shutterstock, Yvonne Tnt/BFA.com/Shutterstock When Juliana Canfield isn’t plying her craft on stage, she might be crafting on the couch. The Tony-nominated winning actor, who played Kendall Roy’s assistant Jess on “Succession” and Holly in the hit Broadway musical “Stereophonic,” has taken up knitting. “I started about three weeks ago, so I have room to grow,” the thespian told Alexa at the Lafayette 148 presentation in Chelsea on Friday. “I’m not making a scarf, because I think that’s the sort of danger zone for a new knitter. You just sort of make this pointless scarf that you’ll never wear that’s hideous. I started with a hot pink balaclava, a hooded snood. It actually worked out pretty well and I’m pretty proud of it. I’ve been wearing it and getting compliments.” Canfield admired the artistry of the brand’s fall collection, called “Woven Stories.” “It’s textured and sumptuous and very wearable,” she said. “I love everything.” 7 Juliana Canfield shows off her floaty dress at the Lafayette 148 presentation. Hannah Turner Harts/BFA.com / Shutterstock 7 Creative director Emily Smith greets actor Ebony Obsidian. Hannah Turner Harts/BFA.com / Shutterstock Explore More US citizen faces hefty fines for accidentally bringing this common item into the country from overseas: 'Are they serious?' Air Canada sues passenger who spent thousands on clothes while his luggage was missing — so who is in the right? How Canada is getting 'quiet revenge' against the US — with coffee 7 Actor Rebecca Hall layers up for the cold. Hannah Turner Harts/BFA.com / Shutterstock Creative director Emily Smith hosted the buzzy cocktail party, greeting fans like Rachel Hall, Beanie Feldstein, Ebony Obsidian and Patina Miller, and explaining the inspiration for the line. “The commitment to craft is really important to us as a brand,” she told Alexa. “I have a deep passion for fabrics. It’s always been my starting point for everything: just letting the fabric tell you what it wants to be, and respecting it. “We’ve always worked with the Italian mills,” added Smith, who gave props to her in-house team of textile designers and the expert female handweavers in the company’s New York atelier. “Over maybe the last five years we’ve gotten more and more connected with them to develop and produce our own fabrics.” 7 Actor and singer Patina Miller strikes a pose at the party. Yvonne Tnt/BFA.com/Shutterstock 7 Actor Beanie Feldstein said she always feels “very elegant and put together” in Lafayette 148. Hannah Turner Harts/BFA.com / Shutterstock The fall line features custom jacquards, fringed finishes, exposed seams, hand-stitched embellishments and deadstock fabrics responsibly transformed into elegant new compositions. As always, there are iconic pieces like the perfect trench, an impeccable white shirt and a softly tailored suit. The bag of the season – a handwoven, fringed suede and-leather L-Tote in black – attracted a lot of attention. 7 A trio of luxe looks from the Lafayette 148 fall collection. The macramé fringed top, center, is handcrafted in leather. Courtesy of the brand 7 The line features innovative, textured designs and custom prints developed in-house. Courtesy of the brand Actor Rebecca Hall, who stars in the new biographical drama, “Peter Hujar’s Day,” said that she loves the label’s alignment with art traditions. “There’s a culture of women weaving tapestries and all these different influences that I really love. They also make clothes that are luxurious and really wearable and practical for all types of different situations.” As for her own needle skills, they are in development. “I can’t knit anything!” she exclaimed. “I can barely darn a sock!” Filed under alexa beanie feldstein fall fashion fashion designers new york fashion week rebecca hall 2/8/25 Read Next Christian Cowan channels 'childhood creativity' at NYFW: '... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); Now on Page Six Harrison Ford diagnosed with shingles, steps down as presenter at 2025 Oscars: report Inside Justin Bieber’s 31st birthday celebration with wife Hailey, son Jack after singer slams drug use speculation Billy Joel, 75, falls down, sparks concern after losing balance at concert Elon Musk welcomes 14th child, his fourth with Neuralink exec Shivon Zilis See All Video WATCH: Former Gov. Andrew Cuomo's announces he's running for NYC mayor Video shows FedEx cargo plane engine ablaze prompting emergency landing at Newark Airport Rangers fans continue the booing of the Canadian National Anthem'''
