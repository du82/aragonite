title = "Gene Hackman died at least 9 days before his, wife's bodies found mummified at New Mexico home, sheriff says"
description = "Legendary Hollywood actor Gene Hackman was dead at least nine days before maintenance workers found the two-time Oscar winner, his wife Betsy Arakawa and one of their dogs inside their New Mexico home."
full_description = '''US News Gene Hackman died at least 9 days before his, wife’s bodies found mummified at New Mexico home, sheriff says By Anna Young Published Feb. 28, 2025 Updated Feb. 28, 2025, 6:24 p.m. ET Legendary Hollywood actor Gene Hackman was dead at least nine days before maintenance workers found the two-time Oscar winner, his wife and one of their dogs inside their sprawling New Mexico home, police said. The last “event” recorded on “The French Connection” star’s pacemaker was Feb. 17, Santa Fe Sheriff Adan Mendoza said Friday afternoon. “According to the pathologist, I think it’s a good assumption that was his last day of life,” he told reporters, explaining that the date helps authorities build a timeline to determine what led to the couple’s tragic end. 6 Hackman was found dead alongside his wife as a welfare check was ordered. Getty Images Hackman, 95, his classical pianist wife Betsy Arakawa, 65, and one of their German shepherds were found Wednesday afternoon in the couple’s multi-million dollar Santa Fe home. At this time, police don’t know who died first as autopsies to determine the case of their deaths are underway. Explore More Hundreds of pro-Ukraine protesters demonstrate as JD Vance visits Vermont ski resort for family vacation DOGE doubles down on 'what did you do last week' emails — with a new requirement Honors student sues her Connecticut school district after graduation — claiming she is illiterate Hackman, who last appeared in the 2004 film “Welcome to Mooseport,” retired after his doctor advised him his heart “wasn’t in the kind of shape that I should be putting it under any stress,” he told a UK movie magazine in 2009. The maintenance workers in the couple’s gated community hadn’t seen them in about two weeks — and were alarmed when there was no answer when they came to do work at the home. Police said earlier Friday they suspected the couple had likely been dead for “several days” — or even weeks — by the time their bodies were found. 6 The Santa Fe sheriff said that carbon monoxide poisoning had been ruled out. Reuters Hackman was discovered near a pair of sunglasses in what police believe was the mudroom — with officials stating that it appeared he had “suddenly fallen.” His walking cane was also found near his body. Arakawa’s body was found decomposed, mummified and bloated on the bathroom floor near an open prescription bottle and scattered pills. The iconic “Unforgiven” star’s body also showed obvious signs of death, police said. Gene Hackman and wife Betsy Arakawa found dead in their home Gene Hackman and his wife tested negative for carbon monoxide, sheriff says Gene Hackman’s wife Betsy Arakawa ‘hadn’t called’ her dementia-plagued mom, 91, in months, housekeeper says Medications, cellphones seized from Gene Hackman and wife’s home as investigation into their mysterious deaths continues Gene Hackman died at least 9 days before his, wife’s bodies found mummified at New Mexico home, sheriff says Mendoza said the couple — who were married for 34 years — tested negative for carbon monoxide poisoning, with initial findings confirming they suffered no external trauma. Additional tests will be completed as the investigation continues. Police have since seized Tylenol, a thyroid medication and Diltiazem, a high blood pressure pill, along with two green cellphones and a 2025 planner. Medical records from MyQuest and patient portal from Quest Diagnostics were also taken, according to the search warrant’s inventory list released Friday. 6 Officials say Hackman was dead for at least nine days before maintenance workers found his body at his New Mexico home. AP 6 Police do not know who died first, but autopsies will determine the cause of their deaths. Facebook / Animal Rescue, Inc. It was not clear who the seized medications belonged to — with police citing federal law that restricts the release of medical information — and if they were the ones found near Arakawa. Police said they will review all medication, cellphone data, photos, phone calls, text messages, events and more. “These are things I think are important for the pathologist and OMI (Office of the Medical Investigator) to consider to try to make a determination of what the cause and manner of death are,” Mendoza said. Two healthy dogs were also found on the couple’s property Wednesday, with animal control working with family members to secure their safety, Mendoza said. 6 Hackman’s cane was also found near his body, while Arakawa’s body was found on the bathroom floor right by an open prescription bottle with pills scattered all over the floor. Ron Galella Collection via Getty Images 6 Police don’t believe foul play is involved but that the deaths are considered suspicious enough to launch an investigation. SplashNews.com Police don’t suspect foul play but said the deaths were suspicious enough to launch an investigation, which is continuing with autopsy and toxicology reports underway. Fire officials have since ruled out a carbon monoxide leak. The “Bonnie and Clyde” actor was in good health and kept up with yoga and Pilates, according to his family, and was kept to a “strict diet” by his wife. “Gene was not only a legendary actor whose talent shaped generations of storytelling, but he and Besty were also longtime residents of our community, deeply woven into the fabric of Santa Fe,” Santa Fe Film Commissioner Jennifer LaBar-Tapia said.“Gene’s legacy in film is unparalleled, spanning decades of unforgettable performances, including some that are filmed right here in Santa Fe. His work inspired countless artists, actors and filmmakers and his impact will continue to be felt for generations to come.” Filed under celebrity deaths gene hackman new mexico 2/28/25 Read Next Socialist lawmakers among frontrunners in NYC race for may... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_atf")) { googletag.display("div-gpt-ad-rec_atf"); } else { console.log('div-gpt-ad-rec_atf not a defined slot', window.definedSlots || []); } }); } var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-native")) { googletag.display("div-gpt-ad-native"); } else { console.log('div-gpt-ad-native not a defined slot', window.definedSlots || []); } }); } Trending Now in US News This story has been shared 37,273 times. 37,273 Hundreds of pro-Ukraine protesters demonstrate as JD Vance visits Vermont ski resort for family vacation This story has been shared 30,282 times. 30,282 DOGE doubles down on 'what did you do last week' emails — with a new requirement This story has been shared 18,078 times. 18,078 Honors student sues her Connecticut school district after graduation — claiming she is illiterate This story has been shared 15,285 times. 15,285 Girl, 15, raped in NYC stairwell by parolee out 1 month after sexually assaulting boy, pushing him off roof: cops var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push