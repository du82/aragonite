["https://nypost.com/2025/02/09/lifestyle/alice-olivia-lifts-the-curtain-on-shakespeare-inspired-collection"]
title = "Exclusive | Alice + Olivia lifts the curtain on Shakespeare-inspired collection"
description = "The Alice + Olivia founder and CEO staged a theatrical fall presentation inspired by none other than William Shakespeare."
full_description = '''Lifestyle exclusive alexa Alice + Olivia lifts the curtain on Shakespeare-inspired collection By Alev Aktar Published Feb. 9, 2025, 5:29 p.m. ET Alice + Olivia founder and CEO Stacey Bendet (inset), was inspired by the works of William Shakespeare. Joe Schildhorn/BFA.com, Rony Alwin Stacey Bendet brought the drama. The Alice + Olivia founder and CEO staged a theatrical fall presentation inspired by none other than William Shakespeare. Admiring the finery were celebrities like Julianne Hough, Tiffany Haddish, Anna Cathcart, Gavin Casalegno, Ming Lee Simmons, Jenny Mollen and Dani Stahl. “The whole theme was ‘Shakespeare is in Love,’ and each set is a different Shakespeare play,” Bendet told Alexa, adding that the line is richly ornamented with embellishments like lace-trimmed cuffs and collars and jacquard shot with gold. “I feel like clothes are going to be really expensive this year, so let’s make it worth it!” 10 Dancer and television personality Julianne Hough rocked a caped pantsuit from the brand. Joe Schildhorn/BFA.com 10 Model Ming Lee Simmons stepped out in a black ensemble. Joe Schildhorn/BFA.com Explore More US citizen faces hefty fines for accidentally bringing this common item into the country from overseas: 'Are they serious?' Air Canada sues passenger who spent thousands on clothes while his luggage was missing — so who is in the right? How Canada is getting 'quiet revenge' against the US — with coffee In preparation for the season, the brand’s design team visited the The Royal Shakespeare Company’s archive and costume hire collection in Stratford-upon-Avon, England. The remarkable repository catalogs clothing, millinery, jewelry, armory, footwear and other items dating all the way back to 1879. Using these artifacts as a starting point, Bendet fashioned an embroidered skirt of sonnets, 16th-century inspired lantern skirts and capes and a Lady Macbeth-inspired black velvet corset dress. 10 Alice + Olivia founder and CEO Stacey Bendet brought the drama in a floral gown. Joe Schildhorn/BFA.com 10 Actor and comedian Tiffany Haddish cut up for the cameras. Joe Schildhorn/BFA.com 10 Actor and writer Jenny Mollen was in full feather at the presentation. Joe Schildhorn/BFA.com Dozens of models posed in tableaux vivants harkening back to the famous works: A floral fantasy recalling “Midsummer Night’s Dream;” a balcony overlooking a garden from “Romeo and Juliet,” and a gold backdrop invoking The Merchant of Venice. “The beauty of this collection exemplifies how we can learn so much from the past to create in the present,“ said Bendet. 10 Models posed on gorgeously decorated sets. RONY ALWIN 10 The collection included opulent black and gold pieces, many accented with bows and cutouts. RONY ALWIN 10 “A Midsummer Nights Dream” vignette featured a larger-than-life book. RONY ALWIN 10 Modern takes on the theme included embellished jeans, bustiers and brocade mini-dresses. RONY ALWIN 10 A ravishing Juliet peers over the balcony on the “Romeo and Juliet” set. RONY ALWIN Her friend Julianne Hough, who glided into the party wearing a crisp white caped vest and pants, told Alexa that she admires Bendet’s fertile imagination. “Fashion can sometimes feel quite stuffy – we take things so seriously. She does such a great job at creating fun and play. It’s always a blast.” Filed under alexa alice + olivia fashion designers jenny mollen julianne hough new york fashion week stacey bendet 2/9/25 Read Next Social media users share their most mortifyingly memorable... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); Now on Page Six Harrison Ford diagnosed with shingles, steps down as presenter at 2025 Oscars: report Inside Justin Bieber’s 31st birthday celebration with wife Hailey, son Jack after singer slams drug use speculation Billy Joel, 75, falls down, sparks concern after losing balance at concert Elon Musk welcomes 14th child, his fourth with Neuralink exec Shivon Zilis See All Video WATCH: Former Gov. Andrew Cuomo's announces he's running for NYC mayor Video shows FedEx cargo plane engine ablaze prompting emergency landing at Newark Airport Rangers fans continue the booing of the Canadian National Anthem'''
