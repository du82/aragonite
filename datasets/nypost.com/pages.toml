["https://nypost.com/2025/02/28/business/microsoft-shutting-down-skype-after-20-years-as-platform-failed-to-keep-up-with-zoom-slack"]
title = "Microsoft ending Skype after 20 years as platform failed to keep up with Zoom, Slack"
description = "Skype will ring for the last time on May 5 as owner Microsoft retires the two-decade-old internet calling service that redefined how people connect across borders."
full_description = '''Business Microsoft retiring Skype after 20 years — as platform failed to keep up with Zoom, Slack By Reuters Published Feb. 28, 2025, 11:52 a.m. ET Skype will ring for the last time on May 5 as owner Microsoft retires the two-decade-old internet calling service that redefined how people connect across borders. Shutting down Skype will help Microsoft focus on its homegrown Teams service by simplifying its communication offerings, the software giant said on Friday. Founded in 2003, Skype’s audio and video calls quickly disrupted the landline industry in the early 2000s and made the company a household name boasting hundreds of millions of users at its peak. 3 Founded in 2003, Skype’s audio and video calls quickly disrupted the landline industry in the early 2000s and made the company a household name boasting hundreds of millions of users at its peak. EPA But the platform has struggled to keep up with easier-to-use and more reliable rivals such as Zoom and Salesforce’s Slack in recent years. The decline was partly because Skype’s underlying technology was not suited for the smartphone era. Explore More GrubHub lays off 20% of employees — two months after rival acquires food delivery platform Elon Musk begs 'top notch' air traffic controllers to come out of retirement to ease shortage Google's co-founder has wild expectations for how many hours a week AI employees should work When the pandemic and work-from-home fueled the need for online business calls, Microsoft batted for Teams by aggressively integrating it with other Office apps to tap corporate users — once a major base for Skype. To ease the transition from the platform, its users will be able to log into Teams for free on any supported device using their existing credentials, with chats and contacts migrating automatically. With that, Skype will become the latest in a series of high-flying bets that Microsoft has mishandled, such as the Internet Explorer web browser and its Windows Phone. Other big tech firms have also struggled with online communication tools, with Google making several attempts through apps including Hangouts and Duo. 3 Microsoft bought Skype in 2011 for $8.5 billion after outbidding Google and Facebook. (Above) Microsoft CEO Steve Ballmer discussing the acquisition at the time. Getty Images 3 Skype will become the latest in a series of high-flying bets that Microsoft has mishandled, such as the Internet Explorer web browser and its Windows Phone. handout Microsoft declined to share the latest user figures for Skype and said there would be no job cuts due to the move. It added that Teams has about 320 million monthly active users. When Microsoft bought Skype in 2011 for $8.5 billion after outbidding Google and Facebook — its largest deal at the time — the service had around 150 million monthly users; by 2020, that number had fallen to roughly 23 million, despite a brief resurgence during the pandemic. Microsoft said on Friday, “Skype has been an integral part of shaping modern communications. We are honored to have been part of the journey.” Filed under internet microsoft skype Zoom 2/28/25 Read Next Google's co-founder has wild expectations for how many hou... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof goo