title = "VP JD Vance has listed his DC-area home for $1.69M"
description = "Vance has little use for the Alexandria, Virginia residence, now that he and his family have relocated to the traditional abode of the Vice President."
full_description = '''Real Estate Vice President JD Vance has listed his DC-area home for $1.69M By Emily Davis Published Feb. 28, 2025, 1:35 p.m. ET Vice President JD Vance’s Alexandria, Virginia home is now on the market. Vance has little use for the DC-area dwelling. Following January’s inauguration, he and his family have relocated to the traditional abode of the Vice President — the US Naval Observatory on Embassy Row. The “Hillbilly Elegy” author bought this 5,750-square-foot property in the neighborhood of Del Ray for $1.64 million in 2023, before he was tapped to be President Donald Trump’s running mate. Now, the 100-year-old home can be yours, for $1.69 million. Realtor.com first reported the listing, which is held by Sotheby’s International Realty. 5 Newly minted Vice President JD Vance is looking to sell his DC-area home. Getty Images 5 Vice President JD Vance. Bloomberg via Getty Images 5 The home is not visible on Google Maps. The area has been under tight security ever since the November election. Google Maps Explore More Inside the condo crisis brewing in Florida's once-hot real estate market This COVID boomtown is seeing the biggest decline in rents in the country Here's how much it costs to buy the most expensive home in Texas — and it just upped its asking price 5 Vance and his wife Usha have three children. Corbis via Getty Images The five-bedroom farmhouse would have been the perfect fit for the former Ohio senator’s family of five, but the Vance clan never quite gelled with the predominantly liberal Del Ray community, the Washingtonian reported. The family kept to themselves during their short stay, and increasingly tight security around the residence after the November election reportedly drew the ire of Vance’s inconvenienced neighbors. The quaint, dark blue home exudes charm — it celebrated its 100th anniversary this year — but boasts modern upgrades and “fresh architecture.” A lovely front porch welcomes visitors into a light-filled sitting room. Hardwood floors and woodburning fireplaces are complemented by whitewashed walls and a seemingly endless number of custom built-ins. Above the open-concept downstairs is a second floor with four bedrooms, including a king-size primary suite and a child’s bedroom with a hand-painted mural of the cosmos. The hardscaped backyard includes an impressive ADU, or accessory dwelling unit. The additional unit includes a kitchenette, another woodburning fireplace and a full bathroom. 5 The Vice President’s new digs at the Naval Observatory. One Observatory Circle The home has direct access to a quaint community park, which has reopened to the public after being closed off while the Vances were in residence. It’s also a 5-minute walk to Del Ray’s “made-for-strolling” main street, filled with eclectic boutiques and family-friendly eats. Vance and his wife Usha remain owners of a DC townhouse, which they continue to rent out, according to the Washington Post. They also maintain their $1.7 million home in the East Walnut Hills neighborhood of Cincinnati. Filed under JD Vance residential real estate washington dc 2/28/25 Read Next A luxury home on the verge of collapsing into Cape Cod Bay... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); What to Shop Now TikTokers swear by this viral walking pad for getting more steps in — It's 