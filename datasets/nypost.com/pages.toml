title = "How Trump can kill Midtown tolls AND plug the MTA's cash hole"
description = "Gov. Kathy Hochul wants a federal bailout for the MTA, but she’s dismissing a solution right beneath her feet."
full_description = '''Opinion Here’s how Trump can kill Midtown tolls AND plug the MTA’s cash hole By David Catalfamo Published Feb. 28, 2025, 5:51 p.m. ET President Donald Trump speaks at the Conservative Political Action Conference (CPAC), at the Gaylord National Resort & Convention Center on Feb. 22, 2025. AP Let’s be blunt: New York’s Southern Tier has been left for dead by New York’s liberal elites. This once-proud region of blue-collar workers now faces poverty, rising Medicaid dependency and drug addiction, all while the same elite sit comfortably in their Manhattan high-rises fretting over how to speed up their crosstown commutes and squeeze peons for more cash. And still, New York City is crumbling from within. The Metropolitan Transportation Authority — the lifeblood of the entire metropolitan region — is falling apart, begging for a bailout. It’s outdated, underfunded, dangerous and in desperate need of massive funds. With President Donald Trump’s decision to terminate congestion pricing, the MTA now faces a staggering $15 billion funding gap for critical infrastructure repairs. Explore More Fracking pioneer Chris Wright confirmed as Trump’s energy secretary If Gov. Hochul wants a bright future for New York, she’ll end the insane ban on fracking Trump will make America energy dominant with frack-exec Cabinet pick The president was right to reject this Midtown toll as an unfair burden on working-class motorists, but the need to stabilize the MTA’s finances remains. Gov. Kathy Hochul wants a federal bailout, but she’s dismissing a solution right beneath her feet. Instead of grabbing more case from taxpayers, New York can create a revenue stream that would permanently boost the MTA’s finances, while also revitalizing communities upstate — by unlocking New York’s vast natural-gas reserves through hydrofracking. Unlike congestion pricing, natural-gas development would generate new revenue without imposing added costs on commuters. And Trump holds the power to make it happen. For years, state leaders have blocked fracking on the basis of a bogus health study, depriving the Southern Tier of an economic lifeline. But Trump’s Jan. 20 Energy Emergency Executive Order has changed the game: By declaring the Northeast a region where “dangerous state and local policies jeopardize our nation’s core defense and security needs,” the administration has established the legal authority to override New York’s fracking ban in the name of national security. The order lays out a comprehensive strategy to advance domestic-energy production, directing federal agencies to exercise their emergency powers, streamline environmental reviews and prioritize the Northeast for immediate action. Federal agencies now have clear authorization to issue drilling permits that preempt state regulations, while the Army Corps of Engineers can expedite water permits under emergency provisions. Legal challenges will inevitably arise, but the administration has firm constitutional grounds to assert federal preemption during a declared national emergency. The administration has multiple avenues to implement this plan. The president could formally declare that hydrofracking in New York is critical to national security under the National Emergencies Act. The Interior Department could lease federal lands and mineral rights for drilling, bypassing state prohibitions. The Justice Department could challenge New York’s ban under the Commerce Clause as an unconstitutional barrier to interstate energy markets. And if necessary, the president could invoke the Defense Production Act to compel natural-gas production in the interest of national security. Keep up with today's most important news Stay up on the very latest with Evening Update. Thanks for signing up! Enter your email address Please provide a valid email address. By clicking above you agree to the Terms of Use and Privacy Policy. Never miss a story. Check out more newsletters The economic benefits are undeniable. Pennsylvania’s natural gas industry supported 123,000 jobs in 2022, with an average annual wage of $97,000 — more than double the state’s median income. The sector added nearly $25 billion to GDP and $3.2 billion in state and local tax revenues. Additionally, $6.3 billion in royalties went to private landowners and government entities. If New York unlocked even 20% of Pennsylvania’s output, the impact would be transformative. Fees alone could generate $55.8 million for local infrastructure projects. State and local tax revenues could reach $640 million, with an added $520 million in federal taxes. Natural-gas royalties to landowners and government entities could total $1.26 billion per year. The Southern Tier would roar back to life with high-paying jobs and economic growth — and the MTA would finally have a steady, reliable source of funding to modernize its aging transit system. At the same time, the United States would reduce its dependence on foreign energy, keeping billions of dollars within the country. To maximize this opportunity, the state could issue “Trump ReviveNY Bonds” as a financial tool to connect upstate energy production with MTA improvements. The most practical model would lock in future fracking revenue for MTA capital investment, creating a guaranteed funding stream for critical infrastructure projects. A Natural Gas Trust Fund would ensure responsible fiscal management, while a carefully calibrated tax and leasing structure would maximize revenue for both local communities and the state. This isn’t a theoretical exercise: It’s a practical, job-creating, revenue-generating solution that benefits every corner of New York. Trump’s Energy Emergency Order provides the mechanism to make it happen, fulfilling his promise to stand up for forgotten Americans by unlocking natural-gas production, creating jobs and saving the MTA from financial ruin. The question isn’t whether New York can afford to frack, but whether we can afford not to. David Catalfamo, president of Capital Public Strategies, was a communications director and vice president for economic development under Gov. George Pataki. Filed under congestion pricing donald trump energy fracking kathy hochul mta natural gas pennsylvania tolls 2/28/25 Read Next Small thanks and a little grace can repair that disastrous... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_atf")) { googletag.display("div-gpt-ad-rec_atf"); } else { console.log('div-gpt-ad-rec_atf not a defined slot', window.definedSlots || []); } }); } var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-native")) { googletag.display("div-gpt-ad-native"); } else { console.log('div-gpt-ad-native not a defined slot', window.definedSlots || []); } }); } Columnists Michael Goodwin Dems lead Zelensky, Ukraine off a cliff with pressure to reject mineral deal Kirsten Fleming Sick Snapchat rumors may ruin an Ole Miss co-ed's life – and it proves we're all stuck in middle school Naomi Schaefer Riley This court 'win for mothers' puts KIDS' lives at risk See All Columnists var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_widget")) { googletag.display("div-gpt-ad-rec_widget"); } else { console.log('div-gpt-ad-rec_widget not a defined slot', window.definedSlots || []); } }); } var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_btf")) { googletag.display("div-gpt-ad-rec_btf"); } else { console.log('div-gpt-ad-rec_btf not a defined slot', window.definedSlots || []); } }); } Covers Today's Cover Front Cover Back Cover Flip for back cover Browse Covers Trending Now on NYPost.com This story has been shared 37,273 times. 37,273 Hundreds of pro-Ukraine protesters demonstrate as JD Vance visits Vermont ski resort for family vacation This story has been shared 35,877 times. 35,877 How to watch Tank Davis vs. Lamont Roach: Fight time, full card and more This story has been shared 34,276 times. 34,276 Air Canada sues passenger who spent thousands on clothes while his luggage was missing — so who is in the right?'''
