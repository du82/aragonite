full_description = '''Real Estate Here’s how much it costs to buy the most expensive home in Texas — and it just upped its asking price By Emily Davis Published Feb. 28, 2025, 3:40 p.m. ET Hear ye, hear ye, the most expensive home in Texas is back on the market — again. This mega-mansion, known as the Crespi estate, is fit for a king. After all, it was designed in the 1930s for an Italian count. Despite its bucolic scenery, the sprawling estate sits just minutes from downtown Dallas. Its vaunted halls have hosted dignitaries and icons the likes of Coco Chanel and the Duke and Duchess of Windsor. But even with these accolades, the 10-bed home — with 12 full bathrooms and five powder rooms — can’t seem to find a buyer. The opulent home was last listed in 2023 for $60 million. The price was slashed to $47 million and ultimately taken off market in 2024. Now the seller, an influential Dallas family, is back and bolder than ever. 20 Despite its bucolic scenery, the sprawling estate sits just minutes from downtown Dallas. Zach Spross 20 The property spans 15.69 acres. Zach Spross Explore More Inside the condo crisis brewing in Florida's once-hot real estate market This COVID boomtown is seeing the biggest decline in rents in the country A luxury home on the verge of collapsing into Cape Cod Bay has been demolished 20 An opulent staircase. Zach Spross 20 The home has hosted the likes of Coco Chanel, and the Duke and Duchess of Windsor. Zach Spross 20 The home blends its French chateau inspiration with Texas charm. Zach Spross 20 A light-filled sitting area. Zach Spross 20 The kitchen has plenty of counter space. Zach Spross 20 A 19-seat theater. Zach Spross 20 The home boasts 10 bedrooms. Zach Spross 20 Ornate wallpaper lines the halls. Zach Spross 20 A more casual sitting area with wooden beams overhead. Zach Spross 20 With 12 full and five half bathrooms at the estate, there’s always somewhere to go. Zach Spross 20 The garage fits more than five cars, according to the listing. Zach Spross As if space were a problem for this “Greater than Gatsby” estate, the sellers have thrown in an additional three lots totaling 3.74 acres to the deal. That brings the property’s total swath to nearly 16 acres, sweetening an already-overflowing pot and upping the price of Texas’s most expensive home to $64 million. The Real Deal first reported on the listing, which is held by Briggs Freeman Sotheby’s International Real Estate. The listing dubs the limestone villa as “Dallas’ most legendary estate.” 20 The home is dripping with custom details from floor to ceiling. Zach Spross 20 One of two wine cellars. Zach Spross 20 Another bedroom. Zach Spross 20 An Art Deco bar. Zach Spross The home seems to demand a new owner throw a Gatsby-style bash, with a real ballroom, an Art Deco bar and two separate wine cellars. Or perhaps the formal rose garden, conservatory and dining room with a custom Swarovski crystal-mantled fireplace are the perfect settings for a swoon-worthy “Bridgerton” ball. If the next owner of the French-style chateau needs some space from their guests, and the 3,000-square-foot primary suite simply does not suffice, they have nothing to fear. The property includes a 3,300-square-foot guesthouse and a 4,800-square-foot entertainment pavilion to keep everyone busy. 20 It looks like the French countryside, but this estate is a short drive from downtown Dallas. Zach Spross 20 A creek runs through the property. Zach Spross 20 A fountain. Zach Spross There’s also a massive swimming pool and spa, tennis and bocce ball courts, a 19-seat theater, ample gardens, greenhouses and a heliport. The home is currently owned by an influential oil industry family, and was previously owned by the Texas Rangers’ former owner Tom Hicks. The estate was designed by Swiss architect Maurice Fatio for the Italian count Pio Crespi. Fatio was known for catering to the the design needs of Palm Beach’s well-heeled, according to the Real Deal, but the Dallas home was hi