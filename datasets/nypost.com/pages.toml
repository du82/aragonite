title = "Washington Post spiked column on Jeff Bezos overhaul of opinion page"
description = "The Washington Post blocked its media critic from covering owner Jeff Bezos' move to remake the newspaper's opinion page, according to a report."
full_description = '''Media Washington Post spiked media critic Erik Wemple’s column about owner Jeff Bezos’s move to overhaul opinion section: report By Ariel Zilber Published Feb. 28, 2025, 12:17 p.m. ET The Washington Post spiked a column by its media critic about Jeff Bezos’ decision to reshape the newspaper’s Editorial pages, which led to the resignation of the section’s editor, according to a report. Erik Wemple had chimed in on the Amazon founder’s pivot — seeking a focus on American values like “personal liberties and free markets” — but his article was never published, according to the Gene Pool newsletter. 3 Erik Wemple, media critic for the Washington Post, had his column about owner Jeff Bezos’ recent move to overhaul the newspaper’s opinion page spiked, according to a report. Screenshot / Washington Post Someone at the Washington Post who read the column described it to Gene Pool as “more mystified and saddened then outrage or appalled.” Gene Weingarten, a satirical writer and former Washington Post columnist, wrote in his newsletter that he reached out to Wemple after noticing that the media critic did not have a published piece analyzing the move. “I called Erik, whom I consider a friend, to ask if he was still planning to write. He said something I’d never before heard from him or any other media critic: No comment, not on or off the record,” Weingarten wrote. Explore More AOC asks NPR host to clarify the 'problem' when he brings up mass illegal immigration Executive producer of Kaitlan Collins' CNN show abruptly leaves network: 'Taking a toll' Ex-Chicago mayor slams city leaders for fixating on niche liberal issues while crime spirals Wemple also “offered no hints,” according to Weingarten. “No winks or nudges, no nothing. He apologized, but I understood entirely,” Weingarten wrote, adding: “The atmosphere in the newsroom is miasmic, poisoned by fear and distrust.” A Washington Post spokesperson was not immediately available for comment. The Washington Post published a story about Bezos’s announcement, which led Opinions Editor David Shipley to quit. But, as Weingarten noted, the article did not include mention criticism from former and current staffers, including ex-Executive Editor Marty Baron. Baron slammed the move as a “betrayal of free expression” and that he was “appalled” by the decision. 3 Shipley is a former speechwriter for Bill Clinton. He parted ways with the Washington Post earlier this week. The Washington Post via Getty Images Baron called Bezos’ pivot a “betrayal of free expression.” Critics argue that this shift undermines the newspaper’s tradition of diverse viewpoints and may reflect an attempt to align more closely with President Donald Trump, especially following Bezos’ intervention to prevent the paper from endorsing Kamala Harris in the 2024 election. 3 Current and former staffers at the newspaper criticized the move by Bezos. christianthiel.net – stock.adobe.com Supporters, however, believe this focus will provide clarity and reinforce the paper’s core values. Bezos said his decision stems from his belief that these viewpoints are underrepresented in current media discourse and that other media outlets already offer a broad spectrum of perspectives. The mogul wrote that he offered Shipley an opportunity to remain in his job and help usher in “this new chapter” but that Shipley instead “decided to step away.” Filed under donald trump jeff bezos kamala harris media bias washington post 2/28/25 Read Next Washington Post staffer slams Gayle King for hitching ride... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergne