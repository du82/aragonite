["https://nypost.com/2025/02/11/lifestyle/michael-kors-wraps-new-york-fashion-week-with-star-studded-lineup"]
title = "Exclusive | Michael Kors wraps New York Fashion Week with star-studded lineup"
description = "Dozens of celebrities applauded the gorgeous fall presentation, including Nicole Scherzinger, Kerry Washington, Rachel Zegler, Uma Thurman, Rachel Brosnahan, Ella Hunt, Suni Lee, Jane Krakowski, Cristin Milioti, Julianna Margulies and Courtney Eaton."
full_description = '''Fashion & Beauty exclusive alexa Michael Kors wraps New York Fashion Week with star-studded lineup By Alev Aktar Published Feb. 11, 2025, 6:05 p.m. ET Nicole Scherzinger, Suki Waterhouse, Kerry Washington and Lea Michele graced the front row at Michael Kors' fall fashion show. Courtesy of Michael Kors In a remarkable feat of fashion fearlessness, Lisa Rinna wore flats to Michael Kors. “Brave!” joked the actor and entrepreneur. Clad in Kors’ oversized blazer and pleated trousers, Rinna was feeling her ‘fit. “I love this menswear, androgynous vibe,” the “Mommy Meanest” star told Alexa. “And I think this look is better with flat shoes.” Rinna attended the show in Chelsea’s Terminal Warehouse (the former location of Tunnel nightclub) with her daughter, 26-year-old television personality Delilah Belle, while her 23-year-old, Amelia Gray, strutted her stuff on the runway. 8 Lisa Rinna, right, poses with her daughter, Delilah Belle. Courtesy of Michael Kors Dozens of celebrities applauded the gorgeous fall presentation, including Nicole Scherzinger, Kerry Washington, Rachel Zegler, Uma Thurman, Rachel Brosnahan, Ella Hunt, Suni Lee, Jane Krakowski, Cristin Milioti, Julianna Margulies and Courtney Eaton. Explore More US citizen faces hefty fines for accidentally bringing this common item into the country from overseas: 'Are they serious?' Air Canada sues passenger who spent thousands on clothes while his luggage was missing — so who is in the right? How Canada is getting 'quiet revenge' against the US — with coffee 8 Lea Michele, Rose Byrne, Rachel Brosnahan, Kerry Washington and Suki Waterhouse chatted at the show. Courtesy of Michael Kors 8 Designer Michael Kors welcomes “West Side Story” star Rachel Zegler. Courtesy of Michael Kors 8 Model Leni Klum rocked a Michael Kors Collection bustier and circle skirt. Courtesy of Michael Kors “This show was inspired by the laid-back elegance that imbues the spirit of our homes and our new Michael Kors Collection store on Madison Avenue,” said Kors in a statement. “Timeless, warm, modern, architectural yet sensual, I wanted the collection to exemplify cozy modernism and hands in the pockets chic.” An all-sizes and ages cast paraded richly layered styles, like a relaxed black pantsuit worn over a vest unbuttoned to reveal a bra. Skirts hit below the knee and came in carwash, fan-pleated and crossover styles; pants were slouchy and coats ranged from fluffy faux fur to a sequined camel trench. Accents included all manner of boots and travel-inspired bags like satchels and oversized clutches. 8 Kors sent out softly tailored menswear and pleated skirts paired with boots. Courtesy of Michael Kors 8 Polished looks included a asymmetrical suiting and a shimmery trench coat. Courtesy of Michael Kors “Funny Girl” and “Glee” alum Lea Michele wore a black-and-white twill wool jacquard carved jacket and matching dance skirt that could have come straight off the catwalk. “I just had a baby five months ago, and Michael has dressed me in all of the seasons of my life: Before pregnancy, during pregnancy, and so I just feel so beautiful in this right now. I want everything that Michael makes, if I could be so lucky.” Singer-songwriter, actor and model Suki Waterhouse, meanwhile, stepped out in a romper. “This is a kind of mini bodysuit which is really well fitted and feels so great and easy to wear,” the “Daisy Jones & The Six” star told Alexa. “This is everything that Michael embodies: glamorous yet I feel very comfortable in my skin.” 8 Amelia Gray Hamlin stalked the runway in a plum ensemble. Courtesy of Michael Kors 8 Ivy Getty turned her trench coat into a dress. Courtesy of Michael Kors The new mom said that she’s been spending a lot more time in New York, so is constantly shopping for coats and jackets. “Most of the time I’m in L.A, and I’m just enjoying being here so much and having seasons,” added the London native, who has Kors in her coat closet. “They’re such a classic staple.” Sometimes a coat can be everything. Model, fashion collector, philanthropist, singer and heiress to the Getty oil fortune Ivy Getty rocked a short one solo. “This trench is being worn as a dress,” she said. “My grandma used to love to get me a trench coat. I think it’s a chic statement piece.” Filed under alexa kerry washington lea michele lisa rinna michael kors rose byrne suki waterhouse 2/11/25 Read Next These are the 20 best perfumes that will have everyone ask... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); Now on Page Six Harrison Ford diagnosed with shingles, steps down as presenter at 2025 Oscars: report Inside Justin Bieber’s 31st birthday celebration with wife Hailey, son Jack after singer slams drug use speculation Billy Joel, 75, falls down, sparks concern after losing balance at concert Elon Musk welcomes 14th child, his fourth with Neuralink exec Shivon Zilis See All Video WATCH: Former Gov. Andrew Cuomo's announces he's running for NYC mayor Video shows FedEx cargo plane engine ablaze prompting emergency landing at Newark Airport Rangers fans continue the booing of the Canadian National Anthem'''
