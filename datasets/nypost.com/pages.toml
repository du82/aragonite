title = "LoveShackFancy throws New York Fashion Week's prettiest party"
description = "The cult brand LoveShackFancy toasted the end of New York Fashion Week with a buzzy bash celebrating its autumn/winter 2025 collection."
full_description = '''Lifestyle alexa LoveShackFancy throws New York Fashion Week’s prettiest party By Alev Aktar Published Feb. 12, 2025, 1:21 p.m. ET Fancy that! The Upper East Side’s James B. Duke Mansion was overflowing with pearls, paillettes and precious pinks on Tuesday night. The cult brand LoveShackFancy toasted the end of New York Fashion Week with a buzzy bash celebrating its autumn/winter 2025 collection. Founder and creative director Rebecca Hessel Cohen invited hundreds of gorgeous guests of all ages, from her daughters and their friends to singer-songwriter, model, and actress Charlotte Lawrence; “The Summer I Turned Pretty” star Gavin Casalegno; model and actor Elysée Sanvillé; designer and TV personality Rachel Zoe; TV host and chef Daphne Oz, designer and blogger Danielle Bernstein and actors Odeya Rush, Hart Denton and Jasmine Amy Rodgers. It felt like a Gilded Age ball for New York’s stylish set. 5 LoveShackFancy founder and creative director Rebecca Hessel Cohen (center, standing in white lace dress) closed New York Fashion Week with a glittering party. Matt Borkowski/BFA.com Explore More US citizen faces hefty fines for accidentally bringing this common item into the country from overseas: 'Are they serious?' Air Canada sues passenger who spent thousands on clothes while his luggage was missing — so who is in the right? How Canada is getting 'quiet revenge' against the US — with coffee 5 Rebecca Hessel Cohen celebrates with Charlotte Lawrence. Matt Borkowski/BFA.com 5 Actor Gavin Casalegno stepped out in a dapper double-breasted suit. Matt Borkowski/BFA.com 5 Actor Jasmine Amy Rodgers, left, and model and actor Elysée Sanvillé were dressed to the nines. Matt Borkowski/BFA.com 5 Models wearing LoveShackFancy’s signature ultra-feminine looks posed in the flower-filled James B. Duke Mansion. Matt Borkowski/BFA.com An array of models were decked in the brand’s fall finery, from ruffled and sequined slithers to lingerie-inspired slips and bedazzled gowns. Two girls in pearl ensembles with lampshades on their heads gyrated in the foyer. And as the crowd sipped champagne and nibbled on iced madeleines and macaroons in a gilded reception room, a trapeze artist draped in a cloud of tulle twirled overhead. Children dressed in LoveShack’s adorable Kids and Tween togs scampered around the party, snatching bottles of Sally Hansen nail polish displayed in little baskets. It was a fun and glamorous way to end a packed week of more than 75 designer runway shows and presentations. Filed under alexa daphne oz fall fashion fashion designers new york fashion week 2/12/25 Read Next Ex-Mormon OnlyFans star unveils secrets of 'magic underwea... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); Now on Page Six Harrison Ford diagnosed with shingles, steps down as presenter at 2025 Oscars: report Inside Justin Bieber’s 31st birthday celebration with wife Hailey, son Jack after singer slams drug use speculation Billy Joel, 75, falls down, sparks concern after losing balance at concert Elon Musk welcomes 14th child, his fourth with Neuralink exec Shivon Zilis See All Video WATCH: Former Gov. Andrew Cuomo's announces he's running for NYC mayor Video shows FedEx cargo plane engine ablaze prompting emergency landing at Newark Airport Rangers fans continue the booing of the Canadian National A