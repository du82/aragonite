["https://nypost.com/2025/02/28/media/karine-jean-pierre-speaks-out-against-democrats-who-pushed-biden-off-2024-election-ticket"]
title = "Karine Jean-Pierre speaks out against Democrats who pushed Biden off 2024 election ticket"
description = 'Former White House press secretary Karine Jean-Pierre spoke about how "shocking" it was to see Democratic Party leaders criticize then-President Joe Biden to the point where he had to leave the race.'
full_description = '''Media Karine Jean-Pierre compares Democrats calling for Biden to be kicked off 2024 election ticket to a ‘firing squad’ By Alexander Hall, Fox News Published Feb. 28, 2025, 11:05 a.m. ET Originally Published by: New York defense attorney argues legal system was weaponized against Trump Joy Behar corrects herself after claiming Elon Musk is 'pro-apartheid' during 'The View' Expensive college tuition 'one of the great travesties of this country' Former White House press secretary Karine Jean-Pierre spoke about how “shocking” it was to see Democratic Party leaders criticize then-President Joe Biden to the point where he stepped down from the race. A month into President Donald Trump’s second term in office, the Democratic Party is still reeling from the 2024 race. One of the race’s most contentious aspects was how leaders and influential figures in the party demanded Biden relinquish the party’s nomination after his disastrous debate performance last June. At an event at the Institute of Politics at Harvard University, Jean-Pierre was asked to share an anecdote about the challenges she faced in the three weeks after that debate up until Biden dropped out, and whether he should have run at all. “He was the President of the United States at the time, he was the leader of the Democratic Party. It was truly his decision to make on what he wanted to do, and I supported that 100%. Whatever it was, I was going to support that 100%,” she answered. “Because he had the right to, as the leader of the Democratic Party coming out of a pretty successful midterm. There was supposed to be a red wave, there wasn’t a red wave.” 4 Former White House press secretary Karine Jean-Pierre spoke about how “shocking” it was to see Democratic Party leaders criticize then-President Joe Biden to the point where he had to leave the race. Institute of Politics at Harvard Kennedy School 4 Biden relinquished the Democratic party’s nomination after his debate performance last June against Donald Trump. REUTERS The great challenge of that three-week period, she said, came from other parts of the Democratic Party itself. “I… look, personally, I think what was the toughest thing to see in the three weeks was there was a disconnect for me [in] what was happening with leadership in the Democratic Party and how it was truly, as my former colleague, communications director Ben Labolt said, it was a firing squad.” “I had never seen anything like it before. I had never seen a party do that in the way that they did, and it was hurtful and sad to see that happening,” Jean-Pierre said. “A firing squad around a person who I believe was a true patriot, a person who I believe did everything that he can for this country. A person who I believe, as I mentioned before, has done more in one term than most presidents had done in two terms, historical things, and I was shocked by what I was seeing.” 4 “I had never seen anything like it before. I had never seen a party do that in the way that they did, and it was hurtful and sad to see that happening,” Jean-Pierre said. Getty Images 4 “A firing squad around a person who I believe was a true patriot, a person who I believe did everything that he can for this country. A person who I believe, as I mentioned before, has done more in one term than most presidents had done in two terms, historical things, and I was shocked by what I was seeing,” she continued. Institute of Politics at Harvard Kennedy School When asked by another member of the panel, Jean-Pierre confirmed she was referring to Democratic leaders who emerged to publicly criticize Biden, noting how “shocking” the turn of events was at the time. “Instead of coming together to really be unified and trying to figure out how do we save our democracy, how do we fight back, that’s what I was seeing,” she said. “That’s what we decided to do for three weeks, and, you know, it was truly, truly unfortunate, and I think it hurt us more than I think folks realized, to have done that.” Filed under democrats joe biden karine jean-pierre 2/28/25 Read Next Executive producer of Kaitlan Collins' CNN show abruptly l... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=33405'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })(); var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-rec_atf")) { googletag.display("div-gpt-ad-rec_atf"); } else { console.log('div-gpt-ad-rec_atf not a defined slot', window.definedSlots || []); } }); } var adWrapper = document.querySelector('.slideshow-ad-wrapper'); if (typeof googletag !== 'undefined') { googletag.cmd.push(function() { if (window.definedSlots && -1 !== window.definedSlots.indexOf("div-gpt-ad-native")) { googletag.display("div-gpt-ad-native"); } else { console.log('div-gpt-ad-native not a defined slot', window.definedSlots || []); } }); } Trending Now ON NYPOST.com This story has been shared 43,208 times. 43,208 Honors student sues her Connecticut school district after graduation — claiming she is illiterate This story has been shared 32,971 times. 32,971 US citizen faces hefty fines for accidentally bringing this common item into the country from overseas: 'Are they serious?' This story has been shared 32,797 times. 32,797 Ex-MSNBC host Joy Reid went o