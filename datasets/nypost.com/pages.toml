["https://nypost.com/2025/02/28/lifestyle/nyc-women-are-getting-yoga-boobs-amp-hoping-nobody-notices-strong-but-petite"]
title = "Exclusive | NYC women are getting 'yoga boobs' — & hoping nobody notices: 'Strong but petite'"
description = '''Bye-bye to "Baywatch" boobs — small breasts are suddenly a big deal in plastic surgery, with Big Apple women lining up for barely noticeable augmentations, whether through implants or fat grafts. Dubbed "yoga boobs" or "ballerina breasts," the au naturel appearance — which takes its name from women with slender, athletic builds — has cropped up in doctors' offices around town and even across the nation, amid a rise in "undetectable" aesthetics.'''
full_description = '''Fashion & Beauty exclusive Big implants go bust! NYC women are getting ‘yoga boobs’ — and hoping nobody notices: ‘Strong but petite’ By Brooke Kato Published Feb. 28, 2025, 11:51 a.m. ET Gianna Mazzilli said she never wanted the "fake-looking, big, Baywatch-looking boobs." Tamara Beckwith The hottest club in NYC is the itty-bitty committee. Bye-bye to “Baywatch” boobs — small breasts are suddenly a big deal in plastic surgery, with Big Apple women lining up for barely noticeable augmentations, whether through implants or fat grafts. Dubbed “yoga boobs” or “ballerina breasts,” the au naturel appearance — which takes its name from women with slender, athletic builds — has cropped up in doctors’ offices around town and even across the nation, amid a rise in “undetectable” aesthetics. It’s a stark contrast from the plastic surgery heyday of the early 2000s, when exaggerated busts reigned, according to Park Avenue plastic surgeon Dr. Lara Devgan. She receives 50 to 100 inquiries per month for “yoga boobs,” which she describes as “enough to fill out a sports bra while maintaining a sleek, sculpted silhouette.” “The uptick has coincided with the growing rise in weight loss medications including GLP1s,” she told The Post. “There has been an overall societal trend toward slimness, and balanced and proportionate breasts are a huge part of that.” Explore More Air Canada sues passenger who spent thousands on clothes while his luggage was missing — so who is in the right? US citizen faces hefty fines for accidentally bringing this common item into the country from overseas: 'Are they serious?' How Canada is getting 'quiet revenge' against the US — with coffee 5 Dr. Darren Smith prefers to use recently approved Motiva breast implants, which look more natural, to achieve the “ballerina breast” look. Tamara Beckwith New York surgeon Dr. Darren Smith told The Post that he too has gotten a higher concentration of interested patients than five years prior, and has 20 to 30 requests for the low-profile procedure every month. “They want something kind of strong but petite,” he said of the “yoga boobs” fad. “They’re not so much doing it to get other people’s attention, but they just want a little bit more volume to fill out there their physique,” he said. “They want breasts that look like they have always been there and that they just fit their frame very nicely.” 5 Mazzilli said her friends would have never noticed her augmentation if she hadn’t mentioned her “ballerina breast” procedure — a trend that Chicago-based plastic surgeon Dr. Eric Anderson told The Post has even grown in popularity at his Midwest practice over the last six to 12 months. Tamara Beckwith New Yorker Gianna Mazzilli, 25, knew she “never wanted big boobs” — like the “fake-looking, big, Baywatch-looking boobs,” she noted. She struggled with asymmetrical breasts, but post-op, no one would be the wiser. In fact, it looks so natural that her friends couldn’t even tell. “I didn’t want them to look fake or have people think weird of me,” Mazzilli, who works in pharmaceutical marketing, told The Post. 5 The “yoga boob” or “ballerina breast” trend, shown here on Smith’s patient, involves a modest breast augmentation to achieve a more natural look. Courtesy Dr. Darren Smith See Also Women are rushing to NYC’s ‘Cleavage Clinic’ for non-surgical, all-natural boob jobs — that cost half the price of implants NYC-based plastic surgeon Dr. Sophie Bartsich told The Post that the downsized breast trend is “very new.” “A lot of patients want something that you can dress up or dress down,” she said. “They want something that’s a little more classic, a little more elegant.” She recalled a time not too long ago when implant manufacturers didn’t have smaller samples or even implants readily available for her to show patients. “There was a philosophy that [you should] go as big as you can with the implants, because the last thing you want is for the patient to say, ‘I wish, I wish I had gone bigger,'” Bartsich said. “That was the teaching back then.” Now, societal preferences have changed and doctors have learned the “damage” too-big implants can cause — rib deformity, breast tissue atrophy, skin stretching — and “almost any manufacturer makes them way smaller than they used to,” she added. The new, subtler look is achieved through one of three methods: implants, fat grafting or a hybrid of the two. While modern implants are the traditional route, some surgeons will harvest fat cells from another area of the body for the modest half- or full-cup boost. 5 Dr. Lara Devgan, whose patient is pictured here, described the “yoga boob” look as “enough to fill out a sports bra while maintaining a sleek, sculpted silhouette.” Courtesy Dr. Lara Devgan 5 “There has been an overall societal trend towards slimness, and balanced and proportionate breasts are a huge part of that,” said Devgan. Courtesy Dr. Lara Devgan Carmen N., who declined to disclose her last name for privacy, barely even wears makeup, so she didn’t want her breasts to look “done.” “I was very hesitant, but I also just didn’t feel as confident, like I almost felt like I had the body of a teenage boy,” Carmen, 34, told The Post, describing herself as having a petite frame. “I didn’t want anybody to look at me and be like, ‘Oh my God, Carmen got breast implants.” Now, the Brooklyn resident is a proud B-cup and is able to “fill out a bathing suit top” — and most of her friends don’t know she went under the knife. “This really gave me such a confidence boost,” she said. “It’s so natural. They look like I’ve had this my entire life.” Filed under breast implants cosmetic surgery exclusive plastic surgery yoga 2/28/25 Read Next Models bare butt cracks at Milan Fashion Week and style gu... // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elemen