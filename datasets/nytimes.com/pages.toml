title = "Opinion | This Is What the Courts Can Do if Trump Defies Them - The New York Times"
description = "How the escalating measures available to courts would work."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest EssayThis Is What the Courts Can Do if Trump Defies ThemFeb. 16, 2025Credit...Anna Reshetnikova/Getty ImagesListen to this article · 9:09 min Learn moreShare full articleBy Trevor W. Morrison and Richard H. PildesMr. Morrison and Mr. Pildes are professors of law at N.Y.U.Are we heading toward a full-blown constitutional crisis? For the first time in decades, the country is wrestling with this question. It was provoked by members of the Trump administration, including Russell Vought, the influential director of the Office of Management and Budget, and Stephen Miller, the deputy White House chief of staff, who have hinted or walked right up to the edge of saying outright that officials should refuse to obey a court order against certain actions of the administration. President Trump has said he would obey court orders — though on Saturday he posted on social media, “He who saves his country does not violate any law.”Some have argued that if the administration is defiant there is little the courts can do. But while the courts do not have a standing army, there are actually several escalating measures they can take to counter a defiant executive branch.The fundamental principle of the rule of law is that once the legal process, including appeals and stay applications, has reached completion, public officials must obey an order of the courts. This country’s constitutional traditions are built on, and depend upon, that understanding.A profound illustration is President Richard Nixon’s compliance with the Supreme Court decision requiring him to turn over the secret White House tape recordings he had made, even though Nixon knew that doing so would surely end his presidency.If the Trump administration ignores a court order, it would represent the start of a full-blown constitutional crisis.The courts rarely issue binding orders to the president, so these orders are not likely to be directed at President Trump personally. His executive orders and other commands are typically enforced by subordinate officials in the executive branch, and any court order — initially, it would come from the Federal District Court — would be directed at them.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
