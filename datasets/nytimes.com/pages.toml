["https://www.nytimes.com/2025/02/28/magazine/einav-zangauker-hamas-hostages-netanyahu.html"]
title = "How Einav Zangauker Became Netanyahu’s Fiercest Foe - The New York Times"
description = "Einav Zangauker, whose son is captive in Gaza, has made herself an unlikely enemy of the Israeli government."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Middle East TensionsThe LatestWest Bank Operation4 Hostages’ Bodies ReturnedIsrael’s Oct. 7 FailuresIsraeli Incursions Into SyriaYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Einav Zangauker in Tel Aviv.Credit...Michal Chelbin for The New York TimesSkip to contentSkip to site indexThe Great ReadHow an Anguished Mother Became Netanyahu’s Fiercest FoeEinav Zangauker, whose son is captive in Gaza, has made herself an unlikely enemy of the Israeli government.Einav Zangauker in Tel Aviv.Credit...Michal Chelbin for The New York TimesSupported bySKIP ADVERTISEMENTShare full article9797By Ruth MargalitFeb. 28, 2025Updated 2:32 p.m. ETThe Israeli poet Aharon Shabtai published a poem last fall that begins with the words “Instead of Moses.” Instead of Abraham, it continues, instead of Buddha, Jesus, Socrates and Tolstoy,Instead, instead of everything,I see by day,And see at night,I see in a dream, and on waking,In bed, in the shower, and on the road,In shopsIn Tel Aviv and in Jerusalem,Only the faceOnly the faceOf Einav Zangauker.The face of Einav Zangauker. How to describe it? The drooping eyes. The dark pits in which they rest. The toothy mouth that tugs downward. And the gaze. The gaze of Einav Zangauker — whose son, Matan, was captured by Hamas on Oct. 7, 2023, and remains a hostage in Gaza — is one that has seen the other side. It’s a gaze of anguish. Of torture, rage, sleeplessness and steel. It’s a gaze that the entire Israeli public has come to recognize, because Einav — she is now known by her first name only — is the country’s most visible representative of the hostage crisis and its fiercest opponent of the war.On a recent Saturday evening, Einav dragged deeply on a cigarette. She was standing in the plaza outside the Tel Aviv Museum of Art, which Israelis have renamed Hostages Square, shivering in a thin black cardigan and skinny jeans — her legs like two twigs wrapped in bark. She has lost 25 pounds since the attacks, and her frame was that of a girl, though her face looked older than her 46 years.“He will come home!” a woman called out to her.“Thank you,” Einav replied softly.Behind her, a giant screen projected the words “Get Them Out of Hell.” A clock showed 490 days, 12 hours, 43 minutes and counting. That morning, Israelis all over the country gathered for watch parties to celebrate the fifth scheduled release of hostages in five weeks. The releases until then were joyful — the hostages seeming relatively healthy — but this time the sight was ominous. The three men paraded onto a stage in central Gaza by their masked captors appeared skeletal and frail. Health professionals advised the families not to press them for information, but details began trickling out. One of the men was shackled for the entirety of his time in captivity; he did not walk or stand for 16 months, according to the Israeli media. All three men were starved, occasionally going days without any food whatsoever. They were subjected to interrogations during which they were tied upside down, beaten and burned with scalding objects. To see the state the men were in, Einav said, was “a catastrophe.”ImageEinav speaking in February at one of the weekly Saturday protests near the I.D.F. headquarters in Tel Aviv.Credit...Michal Chelbin for The New York Times<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
