title = "In Trump’s Cross Hairs Over Taking Gazans, Egypt and Jordan Try Diversion - The New York Times"
description = "The U.S. president has repeatedly asked the two Mideast allies to take in two million Palestinians from Gaza. Both Egypt and Jordan have been trying to offer Mr. Trump help in other ways."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Trump AdministrationliveUpdatesFeb. 16, 2025, 2:20 p.m. ETTracking the Major MovesLawsuits TrackerFederal Worker CutsConfirmations TrackerAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.In Trump’s Cross Hairs Over Taking Gazans, Egypt and Jordan Try DiversionThe U.S. president has repeatedly asked the two Mideast allies to take in two million Palestinians from Gaza. Both Egypt and Jordan have been trying to offer Mr. Trump help in other ways.Share full article339339Trucks carrying humanitarian aid enter Gaza from Egypt on Wednesday.Credit...Abdel Kareem Hana/Associated PressBy Vivian Yee and Alissa J. RubinFeb. 12, 2025Finding themselves in the fickle cross hairs of President Trump, Jordan and Egypt are moving with speed — and uncertain prospects of success — to dissuade, distract and divert him from forcing them to take in Palestinians from the Gaza Strip.For the two Arab governments, who view Mr. Trump’s proposal that they take in two million Palestinians as an existential threat, the strategy appears to be to placate the U.S. president with offers to work together to rebuild Gaza, bring peace to the region and expand humanitarian aid efforts. That could help them buy time, analysts say — perhaps enough for Mr. Trump to discard the idea as too complicated, or to recognize the strategic and security drawbacks of destabilizing two of the closest allies of the United States in the region.Jordan’s King Abdullah employed a conciliatory tone in his meeting with Mr. Trump in the Oval Office on Tuesday, telling the U.S. president that his country would take in 2,000 Palestinian children with cancer and other illnesses from Gaza. Still, he otherwise gave no ground on the question of resettling more Gazans, and later repeated Jordan’s rejection of the plan in a statement on social media.Jordan has been treating some cancer patients from Gaza for months already, making the offer more of a token than a real concession. But Mr. Trump called it a “beautiful gesture.”Other world leaders have found that flattering Mr. Trump tends to help them get their way. King Abdullah seemed to be following their example on Tuesday, heaping praise on the president as “somebody that can take us across the finish line to bring stability, peace and prosperity” to the Middle East.Even as the king pushed back against Mr. Trump in the post to make clear he was rejecting the mass displacement of Palestinians, he noted that the United States had a key role to play. “Achieving just peace on the basis of the two-state solution is the way to ensure regional stability,” he said in the post. “This requires U.S. leadership.”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
