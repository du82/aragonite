["https://www.nytimes.com/2025/02/28/opinion/medicaid-republicans.html"]
title = "Opinion | Republicans Want to Gut Medicaid. They Might Regret It. - The New York Times"
description = "Maybe they should get a second opinion."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest EssayRepublicans Want to Gut Medicaid. They Might Regret It.Feb. 28, 2025, 5:02 a.m. ETCredit...Illustration by The New York Times. Photograph by Getty Images.Listen to this article · 7:52 min Learn moreShare full article178178By Michael KinnucanMr. Kinnucan is the health policy director at the Fiscal Policy Institute.While President Trump has been busy with his executive branch rampage, congressional Republicans have been pursuing a plan to extend and enlarge Mr. Trump’s 2017 tax cuts, which favor the richest Americans.But the math is stubborn, particularly since Mr. Trump has repeatedly pledged to avoid cuts to Medicare and Social Security. And that has put Medicaid, the federally subsidized program run at the state level that provides health insurance or long-term care coverage to more than 70 million Americans, in the G.O.P.’s sights — even though Mr. Trump said this month that Medicaid, too, wouldn’t be “touched.”On Tuesday, House Republicans took the first step toward Medicaid cuts by passing a budget resolution that could mean up to $880 billion in cuts to Medicaid over 10 years. Now they have to actually identify specific cuts to the program — deciding which patients, providers and state governments will lose, and how much.Republicans are fooling themselves if they think it will be easy. Gutting Medicaid means attacking a program backed by a wide range of organizations — from the AARP to the American Hospital Association — that also enjoys broad public support. Even longtime Trump ally Steve Bannon recently warned: “A lot of MAGA’s on Medicaid,” adding, “just can’t take a meat ax to it, although I would love to.”The federal government spends around $600 billion a year on Medicaid. It reimburses states for at least 50 percent of program costs. (Rich states like New York and California typically get 50 percent, while some poor states, like West Virginia and Mississippi, get over 70 percent.)Significant cuts to this funding would send fiscal shock waves through state governments across the country as billions of dollars in federal funding stopped flowing, forcing states to decide where and how to cut their Medicaid programs — whether to eliminate coverage for some beneficiaries, reduce payments to physicians, deny home care to some seniors or raise state taxes to make up the difference.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
