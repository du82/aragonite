["https://www.nytimes.com/2025/02/16/us/politics/ukraine-zelensky-trump-russia.html"]
title = "Ukraine Won’t Accept a Deal It Didn’t Help Negotiate, Zelensky Says - The New York Times"
description = "Volodymyr Zelensky, the president of Ukraine, told NBC News that he’d warned President Trump that Russia’s president, Vladimir Putin, is a “liar.”"
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Trump AdministrationliveUpdatesFeb. 16, 2025, 3:09 p.m. ETTracking the Major MovesLawsuits TrackerFederal Worker CutsConfirmations TrackerAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Ukraine Won’t Accept a Deal It Didn’t Help Negotiate, Zelensky SaysVolodymyr Zelensky, the president of Ukraine, told NBC News that he’d warned President Trump that Russia’s president, Vladimir Putin, is a “liar.”Share full articlePresident Volodymyr Zelensky of Ukraine, left, met with Vice President JD Vance, Secretary of State Marco Rubio and other officials at the Munich Security Conference on Friday.Credit...Tobias Schwarz/Agence France-Presse — Getty ImagesBy Maggie HabermanFeb. 16, 2025, 12:35 p.m. ETPresident Volodymyr Zelensky of Ukraine reiterated in an interview that aired on Sunday that his country would “never” accept a peace deal struck by the United States and Russia if Ukraine did not have a seat at the negotiating table.In an interview on NBC’s “Meet the Press,” Mr. Zelensky sought to avoid criticisms of President Trump and instead praised his strength. He said he had told Mr. Trump during a phone call, shortly after Mr. Trump and President Vladimir V. Putin of Russia spoke for 90 minutes last week, that Mr. Putin is untrustworthy and feared Mr. Trump.Mr. Zelensky said he believed that Mr. Putin was “scared” of Mr. Trump, playing toward Mr. Trump’s desire to be seen as strong and the hope that the U.S. president could push Mr. Putin toward a deal he might not otherwise favor.“I said that he is a liar,” Mr. Zelensky said he told Mr. Trump of Mr. Putin. “And he said, ‘I think my feeling is that he’s ready for these negotiations.’”Mr. Zelensky added: “But I think he’s really a little bit scared about President Trump. And I think the president has this chance, and he’s strong. And I think that really he can push Putin to peace negotiations.”Mr. Zelensky’s interview came as three top foreign policy aides in the Trump administration — Marco Rubio, the secretary of state; Mike Waltz, the national security adviser; and Steve Witkoff, the Middle East envoy who also works on Ukraine-Russia issues — were expected to meet with Russian officials in Saudi Arabia in the coming days to discuss a path to ending the war. It would be the first substantial talks between the two countries on the conflict, three years after Russia’s full-scale invasion.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
