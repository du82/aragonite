full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTKnife Attack Suspect in Austria Was Inspired by ISIS, Official SaysOne person was killed and five others wounded in stabbings in the center of the town of Villach. A man from Syria was arrested at the scene.Listen to this article · 4:34 min Learn moreShare full articleThe site of a stabbing attack in Villach, Austria, on Saturday.Credit...Wiesflecker/Kleine Zeitung, via Associated PressBy Jin Yu Young and Christopher F. SchuetzeChristopher Schuetze reported from Berlin.Feb. 16, 2025Updated 12:17 p.m. ETA Syrian asylum seeker who the Austrian authorities said killed a teenager and wounded five other people in a knife attack in Villach, Austria, was inspired by the Islamic State militant group, officials said on Sunday.The man, who was detained after the attack on Saturday, had become radicalized online, said Austria’s interior minister, Gerhard Karner. The police said they believed that the victims were chosen at random.The suspect is 23 years old, came to Austria from Syria in 2020 and was later given asylum, according to the interior ministry.The attack comes days after an Afghan citizen, who came to Germany as a child refugee, drove a car into a crowd of people at a union march in Munich, 150 miles from Villach, killing two people and wounding nearly 40.In July, the singer Taylor Swift was forced to cancel three concerts in Vienna, Austria’s capital, after the authorities learned of a plan to attack the venue by two teenagers who had become radicalized Islamists online. Neither was a refugee.Austria’s far-right Freedom Party has profited from fears of foreigners, especially young male asylum seekers. Campaigning on a slogan of “Fortress Austria,” the party came in first in elections last year, with 29 percent of the vote. Last week it gave up its quest to form a governing coalition in Austria’s current Parliament, but its popularity continues to rise, according to polls.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
