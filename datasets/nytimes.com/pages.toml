full_description = "The New York Times Company Privacy Policy Last Updated on January 2, 2025 At The New York Times Company, our mission is to seek the truth and help people understand the world. We want you to understand how we handle your personal information. We also want you to know your rights and choices. This policy describes how we handle your personal information when you use the following “Times Services”: The New York Times print newspaper, plus our print International Edition Our websites, like nytimes.com and its subdomains including The Athletic and Wirecutter Our apps, like The New York Times app and The New York Times Games app Our email newsletters, like Cooking and Morning Briefing Our pages or ads on social media networks, like our Facebook and Instagram pages Anywhere we gather information from or about you and refer you to this Privacy Policy How we handle information about you depends on which Times Services you use and how you use them. For example, we use different information about print subscribers than website visitors. Be aware that certain Times Services work differently. Some have additional terms that supplement this policy (e.g., Reader Submissions). If you have questions, please don’t hesitate to contact us at privacy@nytimes.com. You can also review our Privacy F.A.Q. Table of Contents What Information Do We Gather About You?1. (A) Information Collected through Times Services i. Information You Voluntarily Give Us • For Registration • For Billing • For User-Generated Content • For Contests, Sweepstakes and Special Offers; Notice of Financial Incentives • For Reader Surveys, Research, Panels and Experience Programs • During Contact with Our Customer Care teams (including Call Centers (Internal and Offshore) and chat) • Refer-a-Friend ii. A Note about Sensitive Personal Information iii. Information Collected Automatically1. (B) Inferences; Information We Create or Generate 1. (C) Information Collected from Other Sources i. Privately Owned Databases ii. Social Media Platforms and Other Third-Party Services iii. Workplace and Schools What Do We Do With the Information We Collect about You?2. (A) We Provide the Times Services2. (B) We Personalize Your Experience2. (C) We Allow You to Share User-Generated Content2. (D) We Develop Products and Services, and Do Analysis2. (E) We Carry Out Administrative or Legal Tasks2. (F) We Offer Sweepstakes, Contests and Other Promotions2. (G) We Allow for Personalized Advertising on Times Services and Create Audiences for Third-Party Advertisers2. (H) We Advertise or Market Times Services to You2. (I) We Aggregate (or De-identify) Personal Information into Larger Findings To Whom Do We Disclose or Share the Information We Gather for Business and Commercial Purposes?3. (A) Within The New York Times Company3. (B) With Service Providers3. (C) With Other Third Parties What Are Your Rights and Choices?4. (A) In General i. Communications Preferences ii. Access, Correct, Change/Update, Delete or Restrict Processing of Your Personal Information iii. Managing Your Digital and Home Delivery Accounts iv. Browser and Platform Controls v. Opt Out of Targeted Advertising and “Sales or Sharing” of Personal Information vi. Delete My Account vii. Other Rights and Choices4. (B) California Privacy Notices and Rights i. Notice at Collection and Notice of Financial Incentives ii. Rights to Know, Correction, and Deletion iii. “Do Not Sell or Share My Personal Information” iv. Right to Limit Use and Disclosure of Sensitive Personal Information v. Authorized Agents vi. Non-Discrimination Rights vii. Record of Requests viii. California “Shine the Light” Privacy Rights ix. Removal of Content for California Minors How Long Do You Retain Data? How Do You Protect My Information? Are There Guidelines for Children? How Is Information Transferred Internationally? What Is Our Legal Basis? What about Third-Party Services? How Are Changes to this Privacy Policy Communicated? How Can You Contact Us? Who Is the Controller of Your Personal Information? 1. What Information Do We Gather About You? The information we gather about you depends on the context. By and large, it’s information about you that can personally identify you — either on its own or when combined with other information. The following describes the information we collect and how we obtain it. 1. (A) Information Collected through Times Services. i. Information You Voluntarily Give Us For Registration: When you sign up for a Times Service (whether via a subscription or a free account as a registered user), we collect personal identifiers such as your contact information, including your name and email address, and account credentials. We may also ask you to create an account name. Once you’re registered, we assign you a unique ID number. This ID number helps us recognize you when you’re signed in. For some Times Services, you can instead sign up by linking your Apple, Facebook or Google account. See Information Collected From Other Sources below. If you register for an event or conference, we might ask for additional information (e.g., your company name, your job title or your dietary restrictions). Some events and conferences may have different or additional privacy policies and terms and we recommend that you review those before you register. You may voluntarily choose to provide additional personal information in your User Profile. For Billing: To process payments or donations, we collect and use your payment information. This can include your name, your address, your telephone number, your email address, your credit or debit card information and any other relevant information. For User-Generated Content: We offer you the ability to post content that other users can read (e.g., comments or recipe notes). Anyone can read, collect and use any personal information that accompanies your posts. See the Comments F.A.Q., the Cooking FAQ on writing personal or public notes on recipes, and read the User-Generated Content section in our Terms of Service for more information. We do not have to publish any of your content. If the law requires us to take down, remove or edit your content, we will comply. For Contests, Sweepstakes and Special Offers; Notice of Financial Incentives: From time to time, we offer certain opportunities through contests, sweepstakes, gift cards, or other special promotions and offers. When you sign up for these, you give us your name, email and any other required information. Some such opportunities may allow you to earn “rewards” such as discounts (“Incentive Programs”) or gift cards. If this is part of the contest, sweepstake, promotion, survey or offer, we will provide you with a full description of the Incentive Program, including the benefits offered and related legal terms. Because these Incentive Programs involve the collection of personal information, they may be interpreted as “financial incentive” programs under California law (or other similar concept under another law). We use this information for the purposes described in this Privacy Policy including for targeted advertising. We may share your personal information with third parties as described in this Privacy Policy, including data analytics providers, advertising technology vendors, and social media platforms. The value of any financial incentive we offer is reasonably related to the value of any personal information you provide to us. We estimate the value of your personal information by considering, without limitation, the expenses we incur from collecting your personal information and/or providing the financial incentive to you, the revenue generated by your use of the financial incentive, and any improvements we can make to our products and Times Services based on information obtained through the financial incentive program. Please note that we may provide additional terms that apply to a particular financial incentive. If applicable, those terms will be presented to you at sign up. You may cancel your membership in such Incentive Programs at any time by contacting privacy@nytimes.com. For Reader Surveys, Research, Panels and Experience Programs: We gather personal information through questionnaires, surveys and feedback programs. Some surveys may include gift cards when you participate, which may be financial incentives, as discussed above. Surveys and Panels: Some of our surveys and feedback programs, including panels, will request your consent to provide on a purely voluntary basis information regarding your interests in various topics, including travel, entertainment and health and wellness, as well as demographic information, some of which may be considered sensitive under applicable laws such as your age, ethnicity, race, gender, sexual orientation, family characteristics and income. We use service provider platforms to support these programs and personal information is shared with them as described below with respect to service providers in general. We may also use survey providers that have their own independent relationship with you via third party sites or apps, whose practices we don’t control. We encourage you to review their policies. We target these surveys based on a number of factors including information we automatically collect about your interests and usage, as described below. These surveys are used for a variety of purposes described throughout this Privacy Policy including research for marketing of Times Services, as well as research for third party advertisers that are interested in targeting ads to particular groups of Times readers. As described in more detail below, we combine information from these surveys and panels with information collected automatically from Times Services and we also apply internal or third party machine learning or artificial intelligence large language models or applications to this information (alone or in combination with other personal information we collect about you). We do this for the purposes of improving Times Services, for marketing research, to personalize marketing of Times Services to you and/or to create audiences for third party advertisers. Recording Your Feedback: With your consent, we may record interviews with you and ask for your permission to use your voice and likeness for a variety of purposes including marketing, advertising and/or Times events. Reader Callouts: If you participate in a reader callout on Times Services, additional terms such as our Reader Submissions terms may apply (and will be posted where we ask you to participate). During Contact with Our Customer Care teams (including Call Centers (Internal and Offshore) and chat): We collect information from you when you place an order over the phone or contact customer service through one of our toll-free numbers or via chat. This can include your name, contact information, information about your account and any other information you choose to provide. Information you share will be shared with our service providers including call agents and technology platforms. Refer-a-Friend: With your consent, we comply with your requests to collect data about your friends, family or acquaintances (e.g., Refer-a-Friend campaigns). This functionality is only meant for U.S. residents. By using it, you acknowledge and agree that both you and your contacts are based in the United States — and that you have everyone’s consent for us to use their contact information. If you’d like to invite your friends to use Times Services, we will store this information for the sole purposes of allowing you to send your friends referral offers, for determining whether your friends use Times Services after a referral is sent, and to remind your friends of the referral sent on your behalf. We also allow you to contact your friends on your own to set up leaderboards for the Mini. iii. A Note about Sensitive Personal Information We generally don’t want to gather sensitive personal information about you. This includes: Government-issued IDs (such as your driver’s license, passport or social security number) Your racial or ethnic origin Your political opinions Your religion or other beliefs Your health, biometric or genetic characteristics, including physical characteristics or descriptions Any trade union membership Your sexuality (information about your sex life or sexual orientation) Citizenship or immigration status Any criminal background The content of your private communications (other than messages you may send to us) Your precise geolocation (street level, GPS or lat/long data or other data that is derived from a device and that locates you within a geographic area that is equal to or less than the area of a circle with a radius of 1,850 feet). We sometimes collect precise geolocation information (which may be considered a sensitive data type) to provide GPS-based location services you choose to enable. Account access information, such as a username and password (we collect that information only for the accounts you create directly with us and not for any other account you may have with a third party in a personal capacity). However, as explained in detail above in the section on “Reader Surveys, Research, Panels and Experience Programs,” there are situations when we request certain of the above information (e.g., a reader survey asks about your political leanings or ethnicity). You will always have the option to decline to answer or participate in such surveys, panels or other feedback programs. Outside these situations we would prefer you never share sensitive personal information with us. iii. Information Collected Automatically When you use Times Services, we collect some information automatically. The technologies we use to assist with this data collection include cookies, web beacons, tags and scripts and software development kits (or SDKs). We may also use newer technologies, such as clean rooms, matching services described below (such as Unified ID 2.0 and LiveRamp’s Authenticated Traffic Solution) and Comscore’s Unified Digital Measurement (UDM) 2.0, as many browsers begin to deprecate third party cookies. We use these technologies on our digital properties, including our websites and apps, as well as in our email communications and newsletters. For more information about how to manage tracking methods on Times Services, read our Cookie Policy and the What Are Your Rights and Choices? section below. The categories of personal information we collect automatically include: Identifiers and Device Information: When you access our Times Services digitally, including our websites, apps, email communications and newsletters, our servers use a variety of technologies in order to automatically receive, record and/or log information about the device you are using, including unique identifiers. If your browser doesn’t accept our cookies or similar technologies, you can’t access certain parts of our websites (e.g., your account on nytimes.com). The items we "
