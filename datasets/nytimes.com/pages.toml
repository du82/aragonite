title = "Trump to Sign Order Designating English as Official Language of the U.S. - The New York Times"
description = "The order is expected to be largely symbolic but would be a victory for America’s English-only movement, which has long had ties to efforts to reduce immigration and restrict bilingual education."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }U.S. ImmigrationRaids in Places of WorshipBirthright Citizenship OrderView From the BorderDetention at GuantánamoDeportation Flights to VenezuelaAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTTrump Plans Order to Designate English as Official Language of the U.S.The order is expected to be largely symbolic but would be a victory for America’s English-only movement, which has long had ties to efforts to reduce immigration and restrict bilingual education.Listen to this article · 3:34 min Learn moreShare full articleA sign in Spanish that reads “Entrance” at the border with Mexico in Brownsville, Texas. While more than three-quarters of Americans speak only English at home, there are about 42 million Spanish speakers in the country.Credit...Shannon Stapleton/ReutersBy Luke BroadwaterReporting from WashingtonFeb. 28, 2025, 4:22 p.m. ETWhen he was first seeking the presidency in 2015, Donald J. Trump mocked his rival Jeb Bush, who at times answered questions in Spanish.“This is a country where we speak English, not Spanish,” Mr. Trump said.A decade later, Mr. Trump, now in his second term as president, is seeking to make what was once a political jab the official policy of the United States.On Friday, a White House aide said Mr. Trump was planning to sign an executive order designating English as the official language of the United States. The official did not say when the president would do so.The order is expected to be largely symbolic but would be the biggest victory yet for the country’s English-only movement, which has long been tied to efforts to restrict bilingual education and reduce immigration to the United States. More than 30 states have already designated English as their official language.While more than three-quarters of Americans speak only English at home, there are about 42 million Spanish speakers in the country and three million speakers of Chinese.The planned executive order would rescind a Clinton-era mandate that required agencies and recipients of federal funding to provide language assistance to non-English speakers, but would allow agencies to keep current policies and provide documents and services in other languages, the White House official said. News of the planned order was reported earlier by The Wall Street Journal.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
