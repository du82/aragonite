["https://www.nytimes.com/2025/02/16/opinion/trump-ukraine-nukes.html"]
title = "Opinion | The Disrupter in Chief Can’t End a War Like This - The New York Times"
description = "The Trump team’s vacillations may not just cost Ukraine its independence; it could set the stage for a cataclysm."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTDavid FrenchThe Disrupter in Chief Can’t End a War Like ThisFeb. 16, 2025, 7:00 a.m. ETCredit...Roman Pilipey/Agence France-Presse — Getty ImagesListen to this article · 8:31 min Learn moreShare full article610610By David FrenchOpinion ColumnistCan a nation be truly free and independent if it doesn’t possess a nuclear arsenal?That question is being answered right now, on the battlefields of eastern Ukraine. If a nation’s conventional military can stop an aggressive, nuclear-armed nation in a defensive struggle, then there is hope for the viability of conventional deterrence.If, however, a conventionally armed nation is doomed to fail — because it lacks the resources (including the allies) to defend itself — then look for more countries to pursue nuclear weapons. They will choose self-defense over subservience.So far, most of the discussion of the risk of nuclear war in Russia’s invasion of Ukraine has been focused on a perceived immediate danger — that Russia will use nuclear weapons to achieve victory on the battlefield or to retaliate for Ukraine’s use of Western weapons on Russian soil.The hovering threat of Russia’s nuclear arsenal is one explanation for the Trump administration’s shocking weakness in its dealings with Russia. It will stand tall when confronting allies like Denmark, Canada, Mexico and Panama. It will threaten war crimes when dealing with a puny, diminished military force like Hamas.But regarding Russia? Consider the following news items from the past few days alone.Donald Trump initially refused to promise that he would even include Ukraine in his negotiations with Russia, as if Ukraine were a mere pawn on the chessboard. (He reversed himself and said later that “of course” Ukraine would have a place at the table.)He spoke to Vladimir Putin on Wednesday, an event Russians celebrated. The Russian stock market soared, and a Russian lawmaker said the call “broke the West’s blockade.”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
