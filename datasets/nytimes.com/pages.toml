["https://www.nytimes.com/2025/02/16/arts/television/snl-50th-anniversary-special.html"]
title = "How to Watch the ‘S.N.L.’ 50th Anniversary Special - The New York Times"
description = "The venerable sketch show is throwing itself a big star-studded party on Sunday night. Here’s everything you need to know about it."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }‘S.N.L.’ at 50Lorne Michaels ReflectsThe Greatest Episode?SNL’s DebutFamous CatchphrasesMusical MomentsAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTHow to Watch the ‘S.N.L.’ 50th Anniversary SpecialThe venerable sketch show is throwing itself a big star-studded party on Sunday night. Here’s everything you need to know about it.Listen to this article · 5:56 min Learn moreShare full articleLorne Michaels, right, during the first season of “Saturday Night Live,” will celebrate the show’s 50th anniversary on Sunday with plenty of alumni and famous friends.Credit...Associated PressBy Dave ItzkoffFeb. 16, 2025, 5:01 a.m. ET“Saturday Night Live” is celebrating its golden anniversary this weekend with a star-studded special in its Studio 8H at 30 Rock. You have questions? We have answers.When is the big ‘Saturday Night Live’ anniversary special?“SNL50: The Anniversary Special,” a three-hour event celebrating a half-century of comedy sketches, celebrity hosts, musical guests, standup monologues, fake commercials, performers losing it on national television, driving cats that get into car accidents and whatever the heck “Tiny Horse” is about, will be shown Sunday at 8 p.m. Eastern on NBC and Peacock. And yes, it is airing live.When did ‘S.N.L.’ broadcast its first episode?Back when it was simply called “Saturday Night” — because, at the time, ABC had a variety series called “Saturday Night Live” — the NBC show made its debut on Oct. 11, 1975.So ‘Saturday Night Live’ is celebrating its 50th anniversary on a Sunday months before its actual 50th anniversary?Well, it is currently the 50th season of “S.N.L.” Running the special on a Sunday night in February mirrors a strategy from 2015, when “S.N.L.” held its 40th anniversary show, and gives “SNL50” its own lane on a Presidents’ Day weekend following the hoopla of the Grammys and the Super Bowl, and ahead of the Oscars (March 2). Airing in prime time allows the special to reach a wider viewership and to wrap up in time for Tom Hanks to get his beauty rest.Who are some of the other celebrities scheduled to appear?You can expect venerated “S.N.L.” alums, veteran hosts and friends of the show including Adam Sandler, Eddie Murphy, Tina Fey, Will Ferrell, Chevy Chase, Amy Poehler, Steve Martin, Chris Rock, Maya Rudolph, Martin Short and Robert De Niro, according to NBC.Who were some of the guests who appeared in the 40th anniversary special?The 2015 celebration included sketches and tribute segments featuring Robert De Niro, Martin Short, Maya Rudolph, Chris Rock, Steve Martin, Amy Poehler, Chevy Chase, Will Ferrell, Tina Fey, Eddie Murphy and Adam Sandler.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
