title = "JD Vance, Positioning Himself as Trump’s Attack Dog, Berates Zelensky at Oval Office - The New York Times"
description = "The remarkable scene of a vice president injecting himself into a tense diplomatic discussion suggested that JD Vance does not want to be relegated to the B-team of the Trump administration."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Russia-Ukraine WarThe LatestThird AnniversaryHow Could It End?Zelensky and TrumpUkraine’s BordersPhotosAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTJD Vance Positions Himself as Trump’s Attack Dog During Blowup With ZelenskyThe remarkable scene of a vice president injecting himself into a tense diplomatic discussion suggested that JD Vance does not want to be relegated to the B-team of the Trump administration.Listen to this article · 6:50 min Learn moreShare full articleVice President JD Vance and President Trump had a contentious meeting with President Volodymyr Zelensky of Ukraine in the Oval Office on Friday.Credit...Doug Mills/The New York TimesBy Michael D. ShearMichael D. Shear covers the White House. He reported from Washington.Feb. 28, 2025, 6:27 p.m. ETFor 39 days, Vice President JD Vance performed his duties in the shadows of two bigger-than-life figures: President Trump and Elon Musk.That changed on Friday.With cameras rolling, the vice president ambushed President Volodymyr Zelensky of Ukraine, triggering the kind of overheated argument rarely seen in the Oval Office. Mr. Vance repeatedly accused Mr. Zelensky of disrespecting Mr. Trump by refusing to offer thanks for U.S. assistance.“Do you think that it’s respectful to come to the Oval Office of the United States of America and attack the administration that is trying to prevent the destruction of your country?” Mr. Vance asked, yelling over Mr. Zelensky.It was Mr. Vance’s most high-profile moment since assuming the role of Mr. Trump’s understudy. And it suggested that the 40-year-old, former first-term senator from Ohio is trying not to be relegated to the B-team of what has already become one of the most fast-paced and aggressive administrations in modern history.The remarkable scene of a vice president injecting himself into the middle of a tense diplomatic discussion in the Oval Office also showcased Mr. Vance’s media savvy. A onetime best-selling author and CNN political contributor, the vice president has demonstrated a knack for seizing on moments that will capture the media’s attention.On Friday, Mr. Vance found that moment as Mr. Zelensky tried to explain the ways in which President Vladimir V. Putin of Russia had reneged on prior diplomatic deals. Rather than engage with the Ukraine leader on the substance of that question, the vice president used a tried-and-true debater’s technique: He changed the subject.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
