title = "At Least 9 Dead in South After Rainstorm Pounds the Region - The New York Times"
description = "At least eight people died because of the storms in Kentucky alone, Gov. Andy Beshear said, adding that officials expect the death toll to rise."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTAt Least 9 Dead in South After Rainstorm Pounds the RegionAt least eight people died because of the storms in Kentucky alone, Gov. Andy Beshear said, adding that officials expect the death toll to rise.Listen to this article · 4:41 min Learn moreShare full articleFlooding on the Barren River in Bowling Green, Ky., on Sunday. Parts of the South were pounded with heavy rains, leading to flash flooding. Credit...Brett Carlsen/Getty ImagesBy Tim BalkPublished Feb. 15, 2025Updated Feb. 16, 2025, 2:28 p.m. ETAt least nine people, including a child, were dead after a severe rainstorm pounded a large section of the South and left hundreds of thousands of people without power on Sunday morning and communities contending with flash flooding.In northeast Tennessee, the National Weather Service in Memphis issued a flash flood emergency on Sunday afternoon through Monday morning after a levee along the community of Rives failed, causing “rapid onset flooding” there and the surrounding areas.“Get to high ground now,’’ the Weather Service warned on social media. Rives, which is northeast of Memphis, has a population about 300. Several area fire departments deployed crews to help residents. The Tipton County Fire Department said that about 200 people needed to be rescued.Kentucky was hit particularly hard and at least eight people died there because of the storms, Gov. Andy Beshear of Kentucky said at a news conference on Sunday. He said that officials expected the death toll to rise.He said there had been more than 1,000 rescues and there were more than 300 road closures.The governor said weather conditions were still dangerous in the state.In addition to the flash floods, riverbank flooding was going to be significant, he said. Wind gusts of 30 to 45 miles per hour on Sunday, combined with the wet ground, was uprooting trees and sending limbs crashing down.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
