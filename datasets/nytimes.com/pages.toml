full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Subscriber-only NewsletterClimate ForwardMinnesota’s Red-Tape-Cutting ExperimentLast year, the state passed a law to tackle a major barrier to cleaner energy: the long bureaucratic delays to get basic permits.Share full articleA solar field near the Sherburne County Generating Station in Becker, Minn., last summer.Credit...Tim Gruber for The New York TimesBy Allison PrangFeb. 28, 2025, 1:48 p.m. ETEditor’s note: The Climate Fix is our twice-a-month guide to the most important solutions to fighting climate change across the world. Have comments about what we should cover? Email us at Climateforward@nytimes.com.One of the biggest hurdles to bringing clean energy sources online in the U.S. often isn’t a lack of money, necessity or even willpower. It’s red tape.In some states, simply getting government approvals to build solar or wind projects can take more than a year, and that can come on top of local opposition or federal environmental reviews. Legislation to overhaul the process of issuing permits has been stalled in Congress for years, even as electricity demand is projected to rise and thousands of energy projects are stuck waiting to be connected to the grid.But Minnesota is trying to fix its own part of this cumbersome process.Last year, Gov. Tim Walz signed a bill that aims to simplify the state’s permitting process, in large part to help Minnesota reach its goal of having a carbon-free electric grid by 2040.It has typically taken energy projects in Minnesota 12 to 13 months to be granted site permits, according to Jeremy Duehr, an attorney at Fredrikson & Byron, a law firm that works with companies on the permitting process.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
