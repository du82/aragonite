["https://nytimes.com/privacy"]
title = "Privacy FAQ - The New York Times"
full_description = "The Times and Your DataPrivacy F.A.Q.The Times and Your DataThe trust of our readers is essential.Our readers should know how we handle their data.We created this page to answer our readers’ questions about how we use their personal data. This topic is important to many readers, and we value their right to understand how it works.This F.A.Q. applies to nytimes.com readers. If you want to dive deeper into the details, please see our Privacy Policy.Frequently asked questions1.Why does The Times collect (and use) my data?At The Times, we aim to create the best possible reader experience across every medium. This involves knowing certain things about our readership. For example, knowing which articles you read helps us understand your interests. That information lets us select the types of articles we show you in certain parts of the app or site. (This article selection process is still guided by our journalistic judgment, and doesn’t impact large portions of the app or site.)It is important to note that The Times is primarily funded by subscriptions and advertising. Both functions require the use of readers’ data. For example, we use readers’ data to identify who may be interested in a subscription in order to show you Times ads on other websites. Our advertisers ask us to use reader data so their ads can be targeted at the right audiences.2.What type of data is collected about me when I’m accessing The Times?Different types of data are collected based on the different Times services you use. There are effectively two types of data collection: direct and indirect.Direct data collection means you are submitting data to us. For example, when you create an account with The Times, you submit your email address to set up and personalize it.Indirect data collection takes place passively as you interact with our site or apps. Our tracking technologies collect data about your reading behavior, like which articles you read, which recipes you save, which Games you play or how often you visit The Times. Third-party advertisers collect behavioral data associated with their ads shown on our site or apps. Additionally, we collect data about readers from sources like privately owned databases and social media platforms.3.What does The Times do with data it collects on me?We use it to cater our journalism and other offerings to you, like by recommending content that may be of interest. The specific data we use depends on the offering, and how you are accessing it. We also use your data to tailor your experience, which includes marketing and advertising.4.How are you keeping my data safe?We have implemented organizational, technological and physical safeguards designed to keep our readers’ data secure internally. The Times is dedicated to building, maintaining and upgrading the measures we take to protect your data.5.What are some ways I can protect my data?We encourage our readers to take steps to safeguard their own data.6.Why am I given the option to use Facebook and Google for log-in?Our readers have voiced a desire for our log-in process to be even simpler.If you sign up via Facebook or Google, they share limited data with us so we can create an account for you. We do not share any data about your reading behavior with Facebook or Google when you sign up. To learn more, see our social login page.7.How can I learn more about how companies use personal data online?The Times regularly publishes pieces on the topic, including in Business, Technology, and Smarter Living.In 2019 and 2020, our Opinion series, The Privacy Project, explains how online privacy affects your daily life — and shows you how to take control of your data.8.Does The Times support the Global Privacy Control (GPC)?Yes.When we detect a GPC signal from a reader’s browser where GDPR, CCPA or a similar privacy law applies, we stop sharing the reader’s personal data online with other companies (except with our service providers).You can learn more about the GPC — and how to enable it in your browser — from the Global Privacy Control website.Explore moreOur Privacy PolicyRight arrowOur Cookie PolicyRight arrowAny other questions?Our team is here to help with any questions or concerns you may have about our privacy policy. Please send an email to privacy@nytimes.com."
