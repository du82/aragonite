["https://www.nytimes.com/2025/02/28/health/texas-measles-vaccine.html"]
title = "In Texas Measles Outbreak, Signs of a Riskier Future for Children - The New York Times"
description = "Vaccine hesitancy has been rising for years in the United States. Doctors and parents in one rural county are confronting the consequences."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Measles OutbreaksThe LatestVaccine EffectivenessSymptoms and TransmissionDo You Need a Booster?Riskier Future for ChildrenFalling Vaccination RatesAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTIn Texas Measles Outbreak, Signs of a Riskier Future for ChildrenVaccine hesitancy has been rising for years in the United States. Doctors and parents in one rural county are confronting the consequences.Listen to this article · 13:14 min Learn moreShare full article331331Dr. Leila Myrick, a family medicine physician at the Seminole Memorial Hospital in West Texas, examining 2-year-old Yazlynn Gutierrez, who was in between doses of the measles, mumps and rubella vaccine and was suspected of contracting measles on Wednesday.By Teddy RosenbluthPhotographs by Desiree RiosTeddy Rosenbluth traveled to West Texas to meet the doctors and residents coping with a growing measles outbreak.Feb. 28, 2025Updated 5:18 p.m. ETEvery day, as Dr. Wendell Parkey enters his clinic in Seminole, a small city on the rural western edge of Texas, he announces his arrival to the staff with an anthem pumping loudly through speakers.As the song reaches a climax, he throws up an arm and strikes a pose in cowboy boots. “Y’all ready to stomp out disease?” he asks.Recently, the question has taken on a dark urgency. Seminole Memorial Hospital, where Dr. Parkey has practiced for nearly three decades, has found itself at the center of the largest measles outbreak in the United States since 2019.Since last month, more than 140 Texas residents, most of whom live in the surrounding Gaines County, have been diagnosed and 20 have been hospitalized. Nine people in a bordering county in New Mexico have also fallen ill.On Wednesday, local health officials announced that one child had died, the first measles death in the United States in a decade.It may not be the last. Large swaths of the Mennonite community, an insular Christian group that settled in the area in the 1970s, are unvaccinated and vulnerable to the virus.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
