title = "Gene Hackman, Hollywood’s Consummate Everyman, Dies at 95 - The New York Times"
description = "The winner of two Oscars, he was hailed for his nuanced performances in films like “The French Connection,” “Unforgiven” and “The Royal Tenenbaums.”"
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Gene Hackman’s DeathThe LatestWhat We KnowJarring End to a Quiet LifeHackman (1930-2025)AppraisalBetsy Arakawa (1959-2025)You have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Gene Hackman in 1973. If the critics had one word for Mr. Hackman as a performer, it was “believable.”Credit...Evening Standard/Getty ImagesGene Hackman, Hollywood’s Consummate Everyman, Dies at 95The winner of two Oscars, he was hailed for his nuanced performances in films like “The French Connection,” “Unforgiven” and “The Royal Tenenbaums.”Gene Hackman in 1973. If the critics had one word for Mr. Hackman as a performer, it was “believable.”Credit...Evening Standard/Getty ImagesSupported bySKIP ADVERTISEMENTShare full article874874By Robert BerkvistFeb. 27, 2025Leer en españolGene Hackman, who never fit the mold of a Hollywood movie star but became one all the same, playing seemingly ordinary characters with deceptive subtlety, intensity and often charm in some of the most noted films of the 1970s and ’80s, has died, the authorities in New Mexico said on Thursday. He was 95.Mr. Hackman and his wife were found dead on Wednesday afternoon at the home in Santa Fe., N.M., where they had been living, according to a statement from the Santa Fe County Sheriff’s Department. The cause of death was unclear and under investigation. Sheriff’s deputies found the bodies of Mr. Hackman; his wife, Betsy Arakawa; and a dog, according to the statement, which said that foul play was not suspected.Mr. Hackman was nominated for five Academy Awards and won two during a 40-year career in which he appeared in films seen and remembered by millions, among them “Bonnie and Clyde,” “The French Connection,” “The Poseidon Adventure,” “Mississippi Burning,” “Unforgiven,” “Superman,” “Hoosiers” and “The Royal Tenenbaums.”The familiar characterization of Mr. Hackman was that he was Hollywood’s perfect Everyman. But perhaps that was too easy. His characters — convict, sheriff, Klansman, steelworker, spy, minister, war hero, grieving widower, submarine commander, basketball coach, president — defied pigeonholing, as did his shaded portrayals of them.Still, he did not deny that he had a regular-Joe image, nor did he mind it. He once joked that he looked like “your everyday mine worker.” And he did seem to have been born middle-aged: slightly balding, with strong but unremarkable features neither plain nor handsome, a tall man (6-foot-2) more likely to melt into a crowd than stand out in one.It was Mr. Hackman’s gift to be able to peel back the layers from characters who carried the weight of middle age.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
