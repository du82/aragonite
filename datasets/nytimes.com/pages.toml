["https://www.nytimes.com/2025/02/16/science/gila-monsters-cryptosporidium.html"]
title = "On a Mission to Heal Gila Monsters - The New York Times"
description = "After years in Big Pharma, a chemist pivoted to help save the species that made Ozempic possible."
full_description = 'You have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.On a Mission to Heal Gila MonstersAfter years in Big Pharma, a chemist pivoted to help save the species that made Ozempic possible.On a Mission to Heal Gila MonstersAfter years in Big Pharma, a chemist pivoted to help save the species that made Ozempic possible.Credit...Supported bySKIP ADVERTISEMENTListen to this article · 11:30 min Learn moreShare full article4040By Emily AnthesPhotographs by Emily ElconinFeb. 16, 2025By any measure, the diabetes drug Ozempic has been a blockbuster, racking up billions of dollars in annual sales. In the United States alone, pharmacies fill millions of prescriptions for Ozempic and related drugs, which have become popular for their weight-loss effects, every month.But in the beginning, before the celebrity endorsements and the think pieces and the global supply crunch, there was just a strange, venomous lizard with a flair for intermittent fasting. The Gila monster, which is native to the deserts of North America, can survive on just a few meals a year, thanks to a digestion-slowing hormone in its venom.The discovery of this hormone paved the way for Ozempic, making the Gila monster an enormously profitable gift to modern medicine. And last summer one particular Gila monster, a former pet named Pebbles, needed medicine in return.Pebbles, a resident at the Creature Conservancy, a wildlife education organization in Ann Arbor, Mich., had been infected with a parasite called Cryptosporidium. Hard to kill, the parasite colonizes the digestive tract and is typically a death sentence for reptiles. A veterinarian had recommended that Pebbles be humanely euthanized. But the Creature Conservancy wasn’t ready to accept that fate for Pebbles, who had at least another decade of life potentially ahead of her.“If we can fix her,” said Steve Marsh, the founder of the Creature Conservancy, one afternoon last July. <div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
