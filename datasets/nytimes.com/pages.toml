title = "Why China’s Xiaomi Can Make an Electric Car and Apple Can’t - The New York Times"
description = "Xiaomi, which produces smartphones and consumer electronics, delivered 135,000 E.V.s last year after tapping China’s robust manufacturing supply chain."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTWhy a Chinese Gadget Company Can Make an Electric Car and Apple Can’tXiaomi, which produces smartphones and consumer electronics, delivered 135,000 E.V.s last year after tapping China’s robust manufacturing supply chain.Listen to this article · 5:32 min Learn moreShare full article146146Xiaomi displayed its new electric vehicle, the SU7 Ultra, at an event in Beijing on Thursday, along with a premium version of its latest smartphone.Credit...Tingshu Wang/ReutersBy Meaghan Tobin and Claire FuMeaghan Tobin reported from Taipei, Taiwan, and Claire Fu from Seoul.Feb. 28, 2025Updated 1:52 p.m. ETAfter nearly a decade of trying, Apple finally gave up its effort to produce an electric car last year, canceling a project that soaked up $10 billion.But last year in China, the electronics maker Xiaomi launched its first electric car after just three years of development and delivered 135,000 vehicles. It has vowed to double that number in 2025.Xiaomi’s ability to succeed where Apple could not shows how thoroughly China has come to dominate the supply chain for electric vehicles. Chinese companies have mastered electric vehicle manufacturing. By tapping that infrastructure, Xiaomi was able to get components quickly and cheaply.More Chinese electric vehicle companies — including Leapmotor, Li Auto and Seres Group — are starting to turn a profit after burning cash for years in their intense competition for the world’s largest auto market.And Xiaomi is not the only Chinese consumer electronics company that has branched out to electric vehicles. The telecommunications giant Huawei, which the U.S. government has targeted with sanctions and legal action for years, is making autonomous driving software. Huawei has teamed up with multiple Chinese automakers, including Seres Group and the state-owned firms SAIC Motor, BAIC and Chery.Xiaomi has long been compared to Apple. It made bets that its rivals rushed to imitate, like selling its low-cost, high-design phones mainly online. Its chief executive, Lei Jun, even dressed like the Apple co-founder Steve Jobs, in jeans and a black shirt, for Xiaomi’s first phone launch in 2011.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
