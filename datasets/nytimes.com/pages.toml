["https://www.nytimes.com/2025/02/28/opinion/horse-racing-government-subsidies.html"]
title = "Opinion | Dead Athletes. Empty Stands. Billions to Keep Horse Racing Alive. - The New York Times"
description = "Let the sport of kings stand on its own."
full_description = 'You have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Credit...Justin Kaneps for The New York TimesSkip to contentSkip to site indexOpinionGuest EssayDead Athletes. Empty Stands. Why Are We Paying Billions to Keep This Sport Alive?Credit...Justin Kaneps for The New York TimesSupported bySKIP ADVERTISEMENTListen to this article · 26:00 min Learn moreShare full article694694By Noah ShachtmanMr. Shachtman is a contributing editor at Wired. He previously served as the editor in chief of Rolling Stone and The Daily Beast.Feb. 28, 2025One by one, the horses trot up the ramp and onto the track, pulling single-seat chariots behind them. Their drivers, dressed in garish green and bright pink silks, hop into position. Together, they begin to build up speed as they head into the setting sun. The clip-clop of their hooves hitting the track rises to a cacophony. “And they’re off,” the announcer says. The gates swing forward, and the race begins.Back in the day, when horse racing was the only legal form of gambling in New York State, 20,000 or more people would jam the stands at Yonkers Raceway, cheering wildly as the standardbreds ran their mile-long harness race. But on this day, despite the beautiful July weather, just a few dozen spectators hang around, slumped into faded orange seats along a chain-link fence. Even with online betting, the racetrack takes in less than one-fortieth of what it would have at the sport’s peak. So the horses take their two laps, head back down the runway and exit the track to something near silence.It’s a lonely time to be a racing fan. For those who own the horses, though, things aren’t so bad. Payouts for winners — the purses — are tremendous, bringing in investors with “both fists full of money,” said Joe Faraldo, the president of the Standardbred Owners Association of New York. Yonkers has purses that are among the largest of any racetrack of its kind, and it still has millions of dollars left over.If that doesn’t seem to add up, blame a strange and very lucrative arrangement crafted by interests in the horse racing industry (which includes harness racing and its higher-profile sister sport, thoroughbred racing). Back in 2001, when New York State agreed to hand out new licenses to operate slot machines, the racing crowd won an agreement that a chunk of the proceeds would go to them.At the Yonkers track, the adjacent casino was doing enough business to generate around $600 million during the last fiscal year. About 60 million of it went to pay out those purses, fund the local breeders and dole out a few million for Faraldo’s group. Multiply that by every year and every racetrack, and it’s billions and billions of dollars.ImageThe Empire City Casino, next to Yonkers Raceway.Credit...Justin Kaneps for The New York TimesImageJoe Faraldo, the president of the Standardbred Owners Association of New York.Credit...Justin Kaneps for The New York Times<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
