description = "Trump and Musk are destroying the magic of America."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTMaureen DowdWho Will Stand Up to Trump at High Noon?Feb. 15, 2025Credit...Photo illustration by The New York Times; source images from CBS/Getty ImagesListen to this article · 7:24 min Learn moreShare full article1.9k1857By Maureen DowdOpinion Columnist, reporting from WashingtonWhen I was a teenager, my older brother took me to see “Shane.”I wasn’t that into westerns, and the movie just seemed to be about a little boy running after Alan Ladd in the wilderness of the Tetons, screaming “Sha-a-a-a-ne, come back!”I came across the movie on Turner Classic Movies the other night, and this time I understood why the George Stevens film is considered one of the best of all time. (The A.F.I. ranks “Shane, come back!” as one of the 50 top movie lines of all time.)The parable on good and bad involves a fight between cattle ranchers and homesteaders. Ladd’s Shane is on the side of the honest homesteaders — including an alluring married woman, played by Jean Arthur. Arriving in creamy fringed buckskin, he is an enigmatic golden gunslinger who goes to work as a farmhand. Jack Palance plays the malevolent hired gun imported by the brutal cattle ranchers to drive out the homesteaders. Palance is dressed in a black hat and black vest. In case you don’t get the idea, a dog skulks away as Palance enters a saloon.It’s so easy to tell the good guys from the bad guys, the right thing to do versus the wrong. Law and order wasn’t a cliché or a passé principle that could be kicked aside if it interfered with baser ambitions.The 1953 film is also a meditation on American masculinity in the wake of World War II. A real man doesn’t babble or whine or brag or take advantage. He stands up for the right thing and protects those who can’t protect themselves from bullies.I loved seeing all those sentimental, corny ideals that America was built on, even if those ideals have often been betrayed.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
