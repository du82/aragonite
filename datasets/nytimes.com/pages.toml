title = "The Most Memorable ‘S.N.L.’ Sketches Where Actors Break Character - The New York Times"
description = "Lorne Michaels reportedly dislikes when “Saturday Night Live” cast members break character. But over 50 seasons, it’s become one of the show’s signature moves — one that usually delights the audience."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }‘S.N.L.’ at 50Lorne Michaels ReflectsThe Greatest Episode?SNL’s DebutFamous CatchphrasesMusical MomentsYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Losing It on Live TVLorne Michaels reportedly dislikes when “Saturday Night Live” cast members break character. But over 50 seasons, it’s become one of the show’s signature moves — one that usually delights the audience.Skip to contentSkip to site indexLosing It on Live TVLorne Michaels reportedly dislikes when “Saturday Night Live” cast members break character. But over 50 seasons, it’s become one of the show’s signature moves — one that usually delights the audience.Credit...Supported bySKIP ADVERTISEMENTListen to this article · 6:33 min Learn moreShare full article289289By Jason ZinomanJan. 29, 2025In one of the most popular sketches of the last few seasons of “Saturday Night Live,” Heidi Gardner lost it.Playing a sober-faced news anchor, she suddenly broke character, convulsing in laughter after seeing her cast mate Mikey Day sitting in the audience of a town hall dressed up to look like Butt-Head from “Beavis and Butt-Head”:VideoCreditCredit...In an interview about this viral moment, she described feeling guilty about it. Lorne Michaels, the longtime producer of the sketch show, has a reputation for hating it when cast members break character.But over 50 seasons, so many “S.N.L.” performers have done just that (some repeatedly) that it has become one of the show’s signature moves, inadvertent or not — one that usually delights the studio audience and viewers at home. Bill Hader, who often broke, has said, “I think Lorne secretly loved it.”VideoCreditCredit...In general, breaking during a performance, whether it’s a play or a sketch, is considered unprofessional. The argument is that it panders for laughs, destroys the suspension of disbelief and draws attention to the person laughing at the expense of the scene.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
