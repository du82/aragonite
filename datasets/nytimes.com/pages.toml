["https://www.nytimes.com/2025/02/28/us/gene-hackman-death-investigation-medications-planner.html"]
title = "Gene Hackman Most Likely Died on Feb. 17, Sheriff Says - The New York Times"
description = "The Santa Fe County sheriff said the actor’s pacemaker was inspected and last showed activity nine days before his and his wife’s bodies were found."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Gene Hackman’s DeathThe LatestWhat We KnowJarring End to a Quiet LifeHackman (1930-2025)AppraisalBetsy Arakawa (1959-2025)AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTGene Hackman Most Likely Died on Feb. 17, Sheriff SaysThe Santa Fe County sheriff said the actor’s pacemaker was inspected and last showed activity nine days before his and his wife’s bodies were found.Listen to this article · 6:04 min Learn moreShare full articleThe bodies of Gene Hackman and his wife, Betsy Arakawa, were discovered in separate rooms of their home in New Mexico this week.Credit...Roberto E. Rosales/Associated PressBy Nicholas Bogel-Burroughs and Julia JacobsNicholas Bogel-Burroughs reported from Santa Fe, N.M., and Julia Jacobs from New York.Feb. 28, 2025Updated 8:27 p.m. ETThe actor Gene Hackman most likely died nine days before his and his wife’s bodies were found in their secluded home near Santa Fe, N.M., the authorities said on Friday, as the central question of how they died remained unanswered.By examining Mr. Hackman’s pacemaker, a pathologist determined that the device’s last recorded “event” was on Feb. 17, indicating that Mr. Hackman died then, Sheriff Adan Mendoza of Santa Fe County said in a news conference.Mr. Hackman, 95, and his wife, Betsy Arakawa, 65, were found dead on Wednesday, in separate rooms of their home in a gated community. Since then, the mystery of what caused the deaths of the reclusive couple has consumed Hollywood, the cultural hub of Santa Fe and film lovers across the globe.Sheriff Mendoza said on Friday that it was unlikely that the couple had died from carbon monoxide poisoning, given that both of their bodies tested negative for traces of the gas.When investigators combed through the home in the mountains outside Santa Fe, they discovered common medication, medical records, two cellphones and a 2025 planner, according to an inventory of what the police collected.“We’ll be analyzing cellphone data — phone calls, text messages, events, photos in the cellphone — to try to piece a timeline together,” Sheriff Mendoza said.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
