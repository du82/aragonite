["https://www.nytimes.com/2025/02/26/movies/oscar-nominees-dinner-photos.html"]
title = "Ready for Their Close-Ups at the Oscar Nominees Dinner - The New York Times"
description = "Over 100 awards hopefuls gathered at the Academy Museum for a class photo just days before the ceremony. Our photographer and columnist were there."
full_description = "#masthead-section-label, #masthead-bar-one { display: none }Oscars 2025Nominees ListPredictionsPhotos: Nominees DinnerConan O’Brien on HostingFrom the Kremlin to the OscarsWhere to StreamReady for Their Close-Ups at the Oscar Nominees DinnerOver 100 awards hopefuls gathered at the Academy Museum for a class photo just days before the ceremony. Our photographer and columnist were there.Colman Domingo is up for a best actor Oscar for his role in “Sing Sing.” Skip to contentSkip to site indexReady for Their Close-Ups at the Oscar Nominees DinnerOver 100 awards hopefuls gathered at the Academy Museum for a class photo just days before the ceremony. Our photographer and columnist were there.Colman Domingo is up for a best actor Oscar for his role in “Sing Sing.” Credit...Supported bySKIP ADVERTISEMENTShare full articlePhotographs by Sinna NasseriText by Kyle BuchananFeb. 26, 2025On Tuesday night, over 100 Oscar nominees gathered at the Academy Museum in Los Angeles for a class photo in the David Geffen Theater.ImageDemi Moore, left, who starred in “The Substance,” and Cynthia Erivo, center, who starred in “Wicked,” are both vying for a best actress Oscar. Zoe Saldaña, right, is nominated in the best supporting actress category for her role in “Emilia Pérez.” In the upper left corner of the group, seated two rows above Timothée Chalamet, Ralph Fiennes clasped his hands and looked deep in thought, as though he were still pondering matters of papal importance in “Conclave.” Grouped together in the front row, the Oscar-nominated actresses Zoe Saldaña, Mikey Madison, Monica Barbaro, Cynthia Erivo and Ariana Grande formed a power quintet. “Everyone say ‘Oscar nominee!’” Erivo crowed as the flashbulbs went off.ImageAriana Grande is competing for a best supporting actress award for her role in “Wicked.”Still, with so many A-list filmmakers in the frame, there was bound to be someone who asked for another take. Here, it was the “Dune: Part Two” auteur Denis Villeneuve, who noted that the best director nominee James Mangold (“A Complete Unknown”) had the misfortune of arriving in the theater just after the class photo had been snapped.ImageJeremy Strong is nominated in the best supporting actor category for his role in “The Apprentice.”“Can we take a picture again?” asked Villeneuve.ImageSebastian Stan is competing for a best actor Oscar for his turn in “The Apprentice.”Academy president Janet Yang granted his wish, though she noted good-naturedly, “No more stragglers.”ImageIsabella Rossellini is a best supporting actress nominee for her performance in “Conclave.”Typically, the nominees would have gathered earlier this month for the annual Oscar nominees luncheon, an event that was canceled this year as the academy reshuffled its schedule because of the Los Angeles wildfires. In its place, the nominees were invited to a cocktail hour and dinner held just days before this Sunday’s Oscar ceremony.ImageMikey Madison is up for a best actress award for her role in “Anora.” Over cocktails before the class photos were taken, the “Sing Sing” star Colman Domingo chatted with the “Nickel Boys” director RaMell Ross, while Grande hugged the journalist Tracy Gilchrist, who had conducted the widely memed “holding space” interview with her and Erivo. Nearby, the “Substance” director Coralie Fargeat was engaged in a deep conversation with Jane Fonda, who had inspired the character played by Demi Moore in the film.ImageDemi Moore is a best actress nominee for her turn in “The Substance.”With Oscar voting long concluded, the night’s schmoozing felt more fraternal than frantic. There were no winners and losers, nor campaigns to still be waged. Instead, there was free-flowing champagne and conversation, and best of all, none of it had to fit into an acceptance speech or commercial break.ImageTimothée Chalamet is nominated in the best actor category for “A Complete Unknown.”ImageRalph Fiennes is vying for a best actor award for his performance in “Conclave.”ImageCynthia Erivo is nominated in the best actress category for her role in “Wicked.”ImageSean Baker is a best director nominee for his film “Anora.”ImageMonica Barbaro is nominated in the best supporting actress category for “A Complete Unknown.”ImageDiane Warren is nominated for the original song “The Journey” from the film “The Six Triple Eight.” ImageAdrien Brody is up for a best actor award for his performance in “The Brutalist.”ImageThe director Denis Villeneuve, whose film “Dune: Part Two” is up for best picture.Kyle Buchanan is a pop culture reporter and also serves as The Projectionist, the awards season columnist for The Times. More about Kyle BuchananSee more on: Academy Awards (Oscars)Share full articleAdvertisementSKIP ADVERTISEMENT"
