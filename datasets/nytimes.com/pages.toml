title = "Do You Need a Measles Booster? - The New York Times"
description = "With outbreaks spreading in the Southwest, it’s a good time to check your vaccination status."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Measles OutbreaksThe LatestVaccine EffectivenessSymptoms and TransmissionDo You Need a Booster?Riskier Future for ChildrenFalling Vaccination RatesAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTDo You Need a Measles Booster?With outbreaks spreading in the Southwest, it’s a good time to check your vaccination status.Share full article307307Credit...Getty ImagesBy Dani BlumFeb. 27, 2025Leer en españolMeasles outbreaks in Texas and New Mexico are fueling concerns about the rapid spread of the highly contagious virus.There have been more than 100 measles cases in the United States so far this year, compared to 285 cases in all of 2024. And health officials have warned that they expect more people to fall ill.The outbreaks come as the rate of childhood vaccinations, including against measles, have fallen. Most of the measles cases in recent outbreaks have been among people who were unvaccinated or whose vaccination status was unknown. Many have been young children, who are at particularly high risk. An unvaccinated child died in Texas from measles, health officials reported Wednesday.Vaccines are the most effective tools to combat measles. Breakthrough cases — infections among the vaccinated — are extremely rare. But as outbreaks spread, it’s important to review your own vaccination status and make sure you are properly protected.How to check if you have immunityMore than 90 percent of children in the U.S. have received at least one dose of the shot that protects against measles, mumps and rubella, which is part of the routine child vaccination schedule.If you are fully vaccinated — meaning you have received two doses at some point in your life — you should be set. Even though immunity from any vaccine wanes over time, the measles vaccine offers strong lifetime protection against infection for almost everyone, said Dr. William Schaffner, an infectious disease specialist at Vanderbilt University Medical Center.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
