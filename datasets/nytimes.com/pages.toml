["https://www.nytimes.com/2025/02/28/us/gene-hackman-death-updates.html"]
title = "What We Know About Gene Hackman and Wife Betsy Arakawa’s Death - The New York Times"
description = "Mr. Hackman’s body was found inside his home, along with those of his wife and a dog. The sheriff in Santa Fe, N.M., said it appeared that the couple had been dead for days or possibly weeks."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Gene Hackman’s DeathThe LatestWhat We KnowJarring End to a Quiet LifeHackman (1930-2025)AppraisalBetsy Arakawa (1959-2025)AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTWhat We Know About Gene Hackman’s DeathMr. Hackman’s body was found inside his home, along with those of his wife and a dog. The sheriff in Santa Fe, N.M., said it appeared that the couple had been dead for days or possibly weeks.Listen to this article · 4:25 min Learn moreShare full articleThe house owned by actor Gene Hackman and his wife, Betsy Arakawa, on Thursday.Credit...Roberto E. Rosales/Associated PressBy Alexandra E. Petri and Jonathan WolfeFeb. 28, 2025Updated 5:36 p.m. ETLeer en españolAn investigation is underway into the deaths of Gene Hackman and his wife, Betsy Arakawa, who were found dead at their home in Santa Fe, N.M., on Wednesday.Mr. Hackman’s body was found in a mud room, and Ms. Arakawa’s on the floor of a bathroom, according to a search warrant affidavit. A dead German shepherd was discovered in a closet of the bathroom near Ms. Arakawa.The Santa Fe County sheriff, Adan Mendoza, said on Friday that it appeared that “several days, possibly even up to a couple weeks” had passed since the couple had died.The sheriff’s office, which is conducting the investigation, said in a statement on Thursday that “there were no apparent signs of foul play.” But in an interview Friday morning with the “Today” show on NBC, Sheriff Mendoza said he was “not ruling that out.”The Fire Department did not find signs of a carbon monoxide leak, according to the search warrant affidavit.Santa Fe’s fire chief, Brian Moya, said on Friday that two separate searches of the property “didn’t find anything” that would point to a gas leak. But he didn’t rule it out definitively, saying that there were still “a lot of unanswered” questions.Read the Search Warrant Affidavit in the Gene Hackman Death InquiryAn affidavit from a Santa Fe County detective described how deputies found the bodies of Gene Hackman and his wife, Betsy Arakawa, on Wednesday.Read Document<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
