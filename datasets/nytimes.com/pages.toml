["https://www.nytimes.com/2024/03/20/well/measles-outbreak-symptoms.html"]
title = "Measles Outbreak: Symptoms, Spread, and Vaccination Information - The New York Times"
description = "Infected people can spread the virus before even realizing they have it."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Measles OutbreaksThe LatestVaccine EffectivenessSymptoms and TransmissionDo You Need a Booster?Riskier Future for ChildrenFalling Vaccination RatesAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTWhat You Need to Know About Measles Symptoms and TransmissionInfected people can spread the virus before even realizing they have it.Listen to this article · 4:11 min Learn moreShare full article223223Credit...Getty ImagesBy Dani Blum and Nina AgrawalPublished March 20, 2024Updated Feb. 26, 2025Leer en españolOne child has died and more than 130 people have fallen ill in measles outbreaks in Texas and New Mexico, raising concerns about the continued spread of the highly contagious virus.Public health experts have been increasingly concerned about the threat of measles for several reasons. Rates of vaccination against measles, mumps and rubella have been declining. And cases have appeared to rise recently: In 2024, there were 285 measles cases — nearly five times the number seen in 2023, according to the Centers for Disease Control and Prevention. The latest outbreaks are also unfolding in the first weeks of Robert F. Kennedy, Jr.’s tenure as health secretary. Mr. Kennedy has repeatedly expressed skepticism about the safety and benefit of vaccines, which have been shown to protect against and help limit the spread of measles and other infectious diseases. The majority of people that have been infected this year were unvaccinated or had an unknown vaccination status, according to the C.D.C.Here’s what to know about how the virus spreads and what its symptoms look like.How and when measles spreadsPart of what makes measles so tricky to contain is that infected people can easily spread the virus before even realizing they have it. Someone with measles can transmit the infection for up to four days before developing a telltale rash, according to the C.D.C.Measles spreads when someone who is sick coughs or sneezes, said Dr. Paul Offit, a vaccine expert at the Children’s Hospital of Philadelphia. The virus can linger in the air for up to two hours after an infected person leaves a room. People can also contract measles by touching a surface that a sick person has contaminated and then touching their eyes, nose or mouth. “It’s the most contagious of the vaccine-preventable diseases,” Dr. Offit said.Symptoms to watch out forIt typically takes one to two weeks for someone to feel ill after coming into contact with the virus. The earliest symptoms tend to be a cough, runny nose, pink eye and a fever. Some people may have a fever that goes above 104 degrees, which can be particularly dangerous for young children. Fewer than one in every 10 people with measles will also develop diarrhea, according to the C.D.C.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
