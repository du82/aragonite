["https://www.nytimes.com/2025/02/16/business/nyc-apartment-dispute-parrots.html"]
title = "How Pet Parrots Started a War Inside an NYC Apartment Building - The New York Times"
description = "How noise complaints in a Manhattan co-op led to a $750,000 legal settlement and shattered a friendship."
full_description = 'You have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Credit...Oliver Farshi for The New York TimesSkip to contentSkip to site indexThe Great Read3 Parrots, 1 Shared Wall, 2 Ruptured LivesHow noise complaints in a Manhattan co-op led to a $750,000 legal settlement and shattered a friendship.Credit...Oliver Farshi for The New York TimesSupported bySKIP ADVERTISEMENTShare full article465465By David SegalFeb. 16, 2025Long before the complaints about shrieking parrots, many years before lawyers were hired and stern letters exchanged, and more than a decade before the Department of Justice literally turned the building into a federal case, the Rutherford, a 14-story co-op in the Gramercy Park neighborhood of Manhattan, was a pretty tranquil place to live.At least it seemed that way to Charlotte Kullen. In late 1999, she was 26 and had already navigated a couple of difficult landlords as a renter in the city. When she closed on a small studio apartment on the Rutherford’s fifth floor, she felt relief.“I was like, OK, peace and quiet and no problems,” she said in a recent interview. “It’d be an investment. And then, you know, in five years or whatever, I get married and I go have kids somewhere. In the meantime, I can paint my walls, I can decorate.”Soon after arriving, she met her next-door neighbor, Meril Lesser, who had also recently moved in and was working on a master’s degree in psychology. The pair had plenty in common. They were both from New Jersey and roughly the same age. Both were deeply attached to their animals. Ms. Kullen owned a cat and eventually two papillon dogs, as well as a horse she kept in a barn in New Jersey. Ms. Lesser lived with two parrots.The women quickly developed a friendship, one that started warmly enough. Together they went to bars and parties and sought a place in Manhattan’s social whirl, all the while trying to gain traction professionally. Ms. Kullen was laid off from a public relations firm, then cycled through a few different jobs before founding her own P.R. shop and working out of her apartment. Ms. Lesser was briefly a social worker and eventually started making jewelry, which she sold through an Etsy store.Over the years, the neighbors shared meals, dating advice, pain relievers and the occasional holiday.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
