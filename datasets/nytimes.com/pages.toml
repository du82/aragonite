["https://www.nytimes.com/2025/02/12/movies/oscars-race-emilia-perez-anora.html"]
title = "Where the Oscar Race Stands After ‘Emilia Pérez’ Controversy - The New York Times"
description = "“Emilia Pérez” is hobbled, “Anora” is revitalized and plenty remains up in the air ahead of the March 2 awards ceremony."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Oscars 2025Nominees ListPredictionsPhotos: Nominees DinnerConan O’Brien on HostingFrom the Kremlin to the OscarsWhere to StreamAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTThe ProjectionistWhere the Oscar Race Stands After Two Tumultuous Weeks“Emilia Pérez” is hobbled, “Anora” is revitalized and plenty remains up in the air ahead of the March 2 awards ceremony.Listen to this article · 7:24 min Learn moreShare full article128128The “Emilia Pérez” stars Karla Sofía Gascón (left) and Zoe Saldaña in better days for their film’s Oscar campaign.Credit...Pathé FilmsBy Kyle BuchananFeb. 12, 2025Leer en españolSometimes, the period after the Oscar nominations can feel like a snooze. There may be a notable snub that’s worth discussing for a few days, but things eventually settle down and people begin to behave themselves as they head into the final stretch of the season.This hasn’t been that.The last two weeks in particular have been some of the most tumultuous in recent memory, thanks in large part to the controversy involving old tweets made by one of the “Emilia Pérez” stars, Karla Sofía Gascón. The initially defiant actress went rogue to defend herself, keeping her scandal in the headlines during several crucial voting periods. Now, a film that led the field with 13 Oscar nominations has been hobbled.After all of that turbulence, where do things stand? Here are five narratives now emerging from the season that I plan to keep an eye on.‘Anora’ ascendantImage“Anora,” starring Mark Eydelshteyn, left, and Mikey Madison, has momentum as the race enters its final weeks.Credit...Neon, via Associated PressAs this year began, the awards-season aspirations of “Anora” appeared to stall out. The Sean Baker-directed comedy went winless at the Golden Globes on Jan. 5, and that failure-to-launch feeling lingered over the next few weeks when the Critics Choice Awards, where “Anora” hoped to score anew, were postponed from Jan. 12 to Feb. 7 because of the Los Angeles wildfires.What a difference a weekend makes. On Friday, “Anora” picked up a best-picture prize at that delayed Critics Choice ceremony, and scored top honors the next night at separate shows held by the Directors Guild of America and the Producers Guild of America. Any movie that triumphs with both of those guilds has to be considered the best-picture front-runner, even though five years ago, “1917” conquered at the PGA and DGA awards and still lost the top Oscar to “Parasite.”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
