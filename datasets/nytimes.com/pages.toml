["https://www.nytimes.com/2025/02/28/opinion/putin-trump-ukraine.html"]
title = "Opinion | Putin Is Ready to Carve Up the World. Trump Just Handed Him the Knife. - The New York Times"
description = "The talks about Ukraine were never just about Ukraine."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTM. GessenPutin Is Ready to Carve Up the World. Trump Just Handed Him the Knife.Feb. 28, 2025Credit...PhotoQuest/Getty ImagesListen to this article · 8:10 min Learn moreShare full articleBy M. GessenOpinion ColumnistWashington and Moscow have been repairing relations at breakneck speed, comparable only to the speed at which the Trump administration is breaking things at home. After meeting with Secretary of State Marco Rubio in Saudi Arabia on Feb. 18, the Russian foreign minister, Sergei Lavrov, said the two sides had resolved to “eliminate impediments” to improving bilateral relations, a phrasing that sent chills down the spines of Russian exiles — myself included — who have sought what at the time seemed like safe harbor in the United States.Of course, Russia’s president, Vladimir Putin, has his sights set on much more than a bunch of political exiles. And his negotiations with President Trump about Ukraine are not just about Ukraine. Putin wants nothing less than to reorganize the world, the way Joseph Stalin did with the accords he reached with Franklin D. Roosevelt and Winston Churchill in the Crimean city of Yalta in February 1945. Putin has wanted to carve the globe up for a long time. Now, at last, Trump is handing him the knife.How do I know Putin wants this? Because he has said so. In fact, he, Lavrov and a cadre of Kremlin propagandists and revisionist historians haven’t shut up about Yalta for more than a decade. After illegally annexing Crimea in 2014, Putin addressed a gathering celebrating the 70th anniversary of the accords; it culminated in the unveiling of a monument to the three Allied leaders.His reverence for the Yalta accords goes beyond the glorification of the once-mighty Soviet Union and its leader Stalin; he believes that the agreement those three heads of state struck — with the Soviet Union keeping three Baltic States it had annexed as well as parts of Poland and Romania, and later securing domination over six Eastern and Central European countries and part of Germany — remains the only legitimate framework for European borders and security. In February, as Russia celebrated the accords’ 80th anniversary, and prepared to sit down with the Trump administration, Lavrov and the official Russia historians reiterated this message in article after article.This week, Alexander Dugin, a self-styled philosopher who has consistently supplied Putin with the ideological language to back up his policies, sat down for a long interview with Glenn Greenwald, the formerly leftist American journalist. Dugin affably explained why Russia invaded Ukraine: because it wanted and needed to reclaim its former European holdings but realistically could attempt to occupy only Ukraine. He also laid out potential pathways to ending the war. At the very least, he said, Russia would require a partition, demilitarization and denazification of Ukraine. He was purposefully using the language the Allies applied to Germany in Yalta.On X, where Dugin has been hyperactive in the last weeks, he is even bolder. In the lead-up to elections last week in Germany, he posted, “Vote AfD or we will occupy Germany once more and divide it between Russia and USA.” (A German journalist friend sent me a screenshot asking if the post was real — German journalists are less accustomed to the unimaginable than Russian ones.)<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
