title = "In Moving to Stop Adams Case, Career Lawyer Sought to Stave Off Deeper Crisis - The New York Times"
description = "A high-stakes decision for public corruption prosecutors at the Justice Department revealed a generational difference."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Eric Adams Corruption CaseThe LatestMotion to DismissProsecutors ResignJustice Dept. MemoThe ChargesAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTIn Moving to Stop Adams Case, Career Lawyer Sought to Stave Off Deeper CrisisA high-stakes decision for public corruption prosecutors at the Justice Department revealed a generational difference.Listen to this article · 7:32 min Learn moreShare full articleProsecutors in the Justice Department’s public integrity section were given an hour to decide whether to sign a request to dismiss charges against Mayor Eric Adams.Credit...Kent Nishimura for The New York TimesBy Devlin BarrettAdam GoldmanGlenn Thrush and William K. RashbaumDevlin Barrett, Adam Goldman and Glenn Thrush reported from Washington, and William K. Rashbaum from New York.Feb. 16, 2025Updated 3:02 p.m. ETThe threat of a mass firing was unspoken but loomed over the videoconference call.Summoning the staff of the Justice Department’s public integrity section on Friday morning, the acting deputy attorney general, Emil Bove III, was matter-of-fact. Two lawyers needed to step forward to sign a request to dismiss corruption charges against Mayor Eric Adams of New York.An earlier call with the section’s supervisors had gone badly. Three of them quit rather than abandon an important criminal case for brazenly political reasons. In all, seven prosecutors would resign to avoid taking a step they saw as deeply unethical.Mr. Bove gave them an hour to make up their minds. The nearly 20 lawyers on the video call were unnerved, aware that the decisions might eviscerate their ranks and damage the department’s credibility. Some had already written their resignation letters. But a senior member of the team volunteered to sign, in part to spare his younger colleagues.This article, based on interviews with people with knowledge of the events, offers the fullest account yet of that fraught hour. It revealed the determination of Mr. Trump’s appointees to ram through a top-down command that ran counter to the professional standards of career lawyers and challenged the independence of the department. All spoke on the condition of anonymity for fear of retribution.In demanding the case be dropped, Mr. Bove claimed that the timing of Mr. Adams’s indictment around nine months before the city’s primary gave “appearances” of political interference, and aiding a mayor who wanted to help deport undocumented immigrants outweighed convicting him of taking bribes. Mr. Bove concluded, according to the court filing in question, that “continuing these proceedings would interfere with the defendant’s ability to govern in New York City, which poses unacceptable threats to public safety, national security and related federal immigration initiatives and policies.”Mr. Bove and Attorney General Pam Bondi have argued that dropping the charges against Mr. Adams is part of a broader effort to end the “weaponization” of the department by reining in excesses of the Biden administration. A Justice Department spokesman declined to comment.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
