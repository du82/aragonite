description = "Trump’s actions remind me of authoritarians I’ve covered for four decades around the globe."
full_description = '''AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTNicholas KristofNot Quite a Unified Theory of Trumpism, but Still an Alarming PatternFeb. 15, 2025VideoCreditCredit...Brightstars/Getty ImagesListen to this article · 7:07 min Learn moreShare full article842842By Nicholas KristofOpinion ColumnistPresident Trump’s second term dizzies many Americans, but I find it oddly familiar — an echo of the time I lived in China as a reporter.Americans sometimes misperceive Trump’s actions as a fire hose of bizarre and disparate moves, a kaleidoscope of craziness. Yet there is a method to it, and I’ve seen parallels in authoritarian countries I’ve covered around the world over the past four decades.It’s not that I offer a unified theory of Trumpism, but there is a coherence there that requires a coherent response. Strongmen seek power — political power but also other currencies, including wealth and a glittering place in history — through a pattern of behavior that is increasingly being replicated in Washington.But let’s get this out of the way: I think parallels with 1930s Germany are overdrawn and diminish the horror of the Third Reich; the word “fascism” may likewise muddy more than clarify. Having covered genuinely totalitarian and genocidal regimes, I can assure you that this is not that.Democracy is not an on-off switch but a dial. We won’t become North Korea, but we could look more like Viktor Orban’s Hungary. This is a question not of ideology but of power grabs: Leftists eroded democracy in Venezuela and Nicaragua, and rightists did so in Hungary, India and (for a time) the Philippines and Poland. The U.S. is the next test case.When authoritarians covet power, they pursue several common strategies.First, they go after checks and balances within the government, usually by running roughshod over other arms of government. China, for example, has a Supreme Court and a National People’s Congress — but they are supine. Here in the United States, many Republican members of Congress have similarly been reduced to adoring cheerleaders. window.registerInteractive && window.registerInteractive("100000009993786"); .css-1xd5j6v{margin-top:0.75rem;}.css-xc2fe3{font-weight:700;-webkit-text-decoration:none;text-decoration:none;color:var(--color-content-secondary,#363636);}.css-qitxok{margin-left:45px;margin-top:10px;border-left:1px solid var(--color-stroke-tertiary,#C7C7C7);}.css-2f9c0w{list-style:none;margin:0;-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;font-size:0.875rem;line-height:1.0625rem;}.css-1kziinj{color:var(--color-content-tertiary,#5A5A5A);-webkit-text-decoration:none;text-decoration:none;}.css-mw5tos{border-radius:50%;height:18px;width:18px;background-color:#000;background-image:url('https://www.nytimes.com/vi-assets/static-assets/icon-t-logo-16x16-white-6d6d01f365f1dbdab596ce5f3e5b4592.svg');background-position:center;background-repeat:no-repeat;background-size:10px 10px;display:inline-block;margin-left:4px;vertical-align:-5px;white-space:nowrap;}.css-ept3uu{display:inline-block;margin-right:10px;overflow:hidden;object-fit:cover;border-radius:50%;height:34px;width:34px;}span.css-ept3uu{background:#ccc;color:#fff;display:inline-block;font-size:1rem;text-align:center;text-transform:uppercase;line-height:2.25rem;}.placeholder .css-ept3uu{background:#ccc;}.css-9ko0hh{font-family:nyt-franklin,helvetica,arial,sans-serif;font-weight:500;font-size:1rem;line-height:1.4375rem;max-width:600px;margin-left:0px;width:100%;}@media (min-width:630px){.css-9ko0hh{margin-left:auto;margin-right:auto;box-sizing:border-box;}}@media (min-width:1440px){.css-9ko0hh{max-width:600px;width:600px;margin-left:calc((100% - 600px) / 2);}}.css-1g0hipa{line-height:1.875rem;color:var(--color-content-secondary,#363636);font-family:nyt-franklin,helvetica,arial,sans-s