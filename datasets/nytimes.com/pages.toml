title = "Opinion | What Is ‘Severance’ About? - The New York Times"
description = "Three readings of the workplace mystery."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Subscriber-only NewsletterRoss DouthatOpinionWhat Is ‘Severance’ About?Feb. 28, 2025, 2:59 p.m. ETCredit...Alain PilonShare full articleBy Ross DouthatOpinion Columnist“Severance,” the Apple TV+ serial about a corporation whose employees have agreed to “sever” their workaday minds from their normal streams of consciousness, remembering nothing of office life at home and vice versa, is a show designed to break my heart.It’s a serial in the tradition of “Lost” or the first season of “True Detective,” or “The X-Files” farther back — an unspooling mystery with science fiction and perhaps supernatural elements, thick with clues that point toward a larger conspiracy or mythology in which the characters find themselves caught up. Some forms of fandom leave me cold (I don’t care about the Easter eggs at the end of the umpteenth Marvel movie, sorry), but when I fall for this kind of “puzzle box” show I fall hard — with the knowledge, hard-earned, that the nature of these shows is to overpromise and then disappoint when the time finally comes to pull the curtain back.Maybe “Severance” will be the exception; maybe the baby goats and dead seals popping up in the weirder corners of its office dystopia aren’t just like the polar bear on “Lost,” the symbol of a show whose pleased-with-itself mystifications ran ahead of any fundamental plan.But rather than rehash my issues with the puzzle-box model (which I last discussed when writing about “Yellowjackets,” a show that’s sadly lost my attention), I thought I’d try to talk about what “Severance” is doing right now, without regard to its potential endgame, by offering three possible answers to the question, What is this show actually about?The simplest answer is that it’s a show about the American way of work, with the severing procedure a savage twist on work-life balance issues, a sci-fi literalization of the idea of specific work identities (and distinct “work friends” and “work spouses”) as features of the modern office. And it’s about work in a way that’s especially resonant in a post-pandemic landscape where people have been taken out of the office for an extended period and find themselves returning — or considering a return, or being forced into a return — in a cultural context where the basic strangeness of office life has been thrown into relief.When this aspect of the show is most effective, “Severance” plays as a surreal companion piece to “The Office,” with Jim-Pam-Dwight sitcom dynamics transferred to a much weirder plane. Here office tchotchkes and departmental rivalries take on supernatural freight and corporate is a mysterious and baleful power rather than a hapless bunch of suits. When it doesn’t work as well it’s because the show slips backward from surrealism into a more banal kind of corporate satire. “Severance” depends on the deep weirdness of Lumon Industries, its peculiar rituals and hierarchies and internal corporate language, to weave dread into the familiar landscape of computers and cubicles and wall-to-wall carpeting.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access