title = "Opinion | The MAGA Youth Remind Me of the 1980s and Not In a Good Way - The New York Times"
description = "I worshiped Ronald Reagan and big hair in the 1980s. The MAGA youth of today remind me of myself."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest EssayThe 1980s Are Back, and Not in a Good WayFeb. 16, 2025, 9:00 a.m. ETCredit...Christina LeeListen to this article · 8:23 min Learn moreShare full article4040By Elizabeth SpiersMs. Spiers, a contributing Opinion writer, is a journalist and a digital media strategist.When I was 7, I sent a birthday card to President Ronald Reagan. It was the 1980s. I lived in rural Alabama, and pretty much all the adults around me were loudly on board with what was then the Reagan revolution, which had swept Jimmy Carter and his timid liberal apologists for America’s greatness out of power and made the presidency, especially to my young eyes, a glamorous exemplar of everything good about the country. I remember the seductive appeal of the story he told about America as a global superpower, a “shining city on a hill” where anyone could be successful with enough elbow grease, so long as those meddlesome big-government liberals didn’t get in the way.Being young and preppy and rich back then looked cool to me. Within a few years I had a crush on Alex P. Keaton on “Family Ties,” who horrified his ex-hippie parents with his love of heartless capitalism and harebrained business schemes. I didn’t see that the show was making fun of him, too. The young conservatives of the ’80s were all molded in his image (and he in theirs).Now, in 2025, some young people (who were not yet born in the age of Reagan) are renouncing the progressive politics of their millennial elders and acting like it’s the ’80s again. There was a marked shift toward Donald Trump by voters under 30 according to exit polling in last November’s election, so maybe they are just dressing the part. But when I read about a group of younger MAGA supporters reveling in their victory at the member’s only Centurion New York (declaring, as one 27-year-old in attendance did, that Trump “is making it sexy to be Republican again. He’s making it glamorous to be a Republican again”) or see photos or watch videos of MAGA youth at, say, Turning Point USA events run by Charlie Kirk, a preppy right-wing influencer whose organization recruits high schoolers and college students to be soldiers in the culture war, or in Brock Colyar’s New York magazine cover story about the young right-wing elite at various inauguration parties — I get a very distinct feeling of déjà vu. It’s laced with nostalgia but grounded in dread.These young right-wingers have a slightly modernized late ’80s look. I doubt they use Aqua Net or Drakkar Noir, but I imagine their parties have the feel of a Brat Pack movie where almost everyone is or aspires to be a WASPy James Spader villain. Few of the people I’m talking about were even alive in the 1980s, and so they can’t understand what it means for Mr. Trump to be so stuck in that time, still fighting its battles. Now, instead of renouncing hippie counterculture, they’ve turned against whatever their generation considers to be woke. The incumbent liberal they detested was Joe Biden instead of Jimmy Carter. Instead of junk bonds, many of them plan to get rich by investing in crypto and trust that this administration will pursue or exceed Reagan levels of deregulation to facilitate it. After all, Project 2025 mentions Reagan 71 times.Mr. Trump’s ’80s were, until now, his glory years, when he built Trump Tower, published “The Art of the Deal” and called the tabloids on himself using a made-up name, John Barron. He was routinely flattered in the tabloids thanks to the excellent public relations skills of Mr. Barron, popped up regularly on TV and wrestling promotions and started making movie cameos. Urban elites looked down on him — Spy magazine called him a “short-fingered vulgarian” — but he embodied what many people who weren’t rich thought rich people looked like, lived like, and, in his shamelessness and selfishness, acted like.More important for us now, his formative understanding of politics seems to have been shaped by that era, when America, humbled by the Vietnam War, Watergate, crime and the oil crisis, was stuck with a cardigan-wearing president who suggested that we all turn down our thermostats for the collective good. Reagan told us to turn the thermostat way up, live large and swagger again. Hippies became yuppies, at least in the media’s imagination.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
