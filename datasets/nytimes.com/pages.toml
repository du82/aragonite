title = "With Fighting Stilled, Gazans Face New Trauma: Searching for Their Dead - The New York Times"
description = "Thousands of bodies may be unearthed from Gaza’s ruins, the authorities say. Families with missing loved ones face fresh horrors as they search the rubble."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Middle East TensionsHostages’ Accounts of AbuseSearching for Gaza’s DeadLebanon’s Diaspora ReturnsTrump’s Gaza ProposalYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.With Fighting Stilled, Gazans Face New Trauma: Searching for Their DeadThousands of bodies may be unearthed from Gaza’s ruins, the authorities say. Families with missing loved ones face fresh horrors as they search the rubble.Hani al-Dibs and his children in Jabaliya, northern Gaza, at the site of the home they fled with 14 family members believed to be beneath the rubble.With Fighting Stilled, Gazans Face New Trauma: Searching for Their DeadThousands of bodies may be unearthed from Gaza’s ruins, the authorities say. Families with missing loved ones face fresh horrors as they search the rubble.Hani al-Dibs and his children in Jabaliya, northern Gaza, at the site of the home they fled with 14 family members believed to be beneath the rubble.Credit...Supported bySKIP ADVERTISEMENTListen to this article · 6:43 min Learn moreShare full article9494By Erika SolomonAaron Boxerman and Rawan Sheikh AhmadPhotographs by Saher AlghorraErika Solomon reported from Berlin, Aaron Boxerman from Jerusalem and Rawan Sheikh Ahmad from Haifa, Israel.Feb. 14, 2025After 15 months of war, Hani al-Dibs, a high-school teacher, thought his greatest wish was to see the bombardment of Gaza come to an end. But the long-awaited cease-fire has brought only bitterness and dread.Mr. al-Dibs is one of countless Gazans burdened with an agonizing duty: trying to recover the remains of loved ones trapped beneath the swathes of rubble left by Israel’s war against Hamas.Some families have returned home to find corpses of loved ones so decomposed, they cannot tell them apart. Others cannot even enter the wreckage to dig, so strong is the stench of human decay. And some have searched and searched, only to find nothing at all.As they prepared to return to their hometown, Jabaliya, in northern Gaza, Mr. al-Dibs’s two surviving children kept asking him whether their mother and little brothers might somehow have survived the blast that had trapped their bodies for three months beneath the rubble of the family home.“They’d ask: What if they were still sleeping after the explosion, and climbed out later? What if, later on, the Israelis heard them screaming, and got them out?” he said in an interview. “Their questions torment me.”Gazan health authorities have tallied nearly 48,000 among the dead, without distinguishing between civilians and combatants.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
