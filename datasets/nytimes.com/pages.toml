["https://www.nytimes.com/2025/01/23/movies/oscar-nominees-movies-streaming.html"]
title = "Where to Stream the 2025 Oscar Nominees: ‘Anora,’ ‘Conclave’ and More - The New York Times"
description = "Many of the top contenders can be watched at home. Here’s a guide to help you get a jump on the field."
full_description = '''#masthead-section-label, #masthead-bar-one { display: none }Oscars 2025Nominees ListPredictionsPhotos: Nominees DinnerConan O’Brien on HostingFrom the Kremlin to the OscarsWhere to StreamAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTWhere to Stream the 2025 Oscar NomineesMany of the top contenders can be watched at home. Here’s a guide to help you get a jump on the field.Share full articleAriana Grande and Cynthia Erivo, both Oscar nominees for “Wicked,” which is available on demand.Credit...Giles Keyte/Universal PicturesBy Scott TobiasPublished Jan. 23, 2025Updated Feb. 28, 2025, 11:45 a.m. ETThe nominees for the 97th Academy Awards were announced on Thursday morning and an unusually high number of them are still exclusively in theaters, including the best picture contenders “A Complete Unknown,” “The Brutalist,” “I’m Still Here” and “Nickel Boys.” But many more major nominees are currently a click away on streaming and rental platforms, most notably the Netflix musical “Emilia Pérez,” which leads the field with 13 nominations, the Broadway-to-Hollywood hit “Wicked,” and a pair of American indie provocations, “Anora” and “The Substance.”Other titles should become available in the lead-up to ceremony on March 2, but for now, here’s a complete rundown of where to find all the major awards hopefuls.‘Anora’VideotranscriptBackbars0:00/2:34-0:00transcript‘Anora’ | Anatomy of a SceneThe writer, director and editor Sean Baker narrates a sequence from his comedy featuring Mikey Madison and Mark Eydelshteyn.“Hi, I’m Sean Baker. I’m the writer, director and editor of “Anora.” This is the scene in which our protagonist, Ani, played by Mikey Madison, is arriving at the house supposedly owned by Ivan Zakharov, who is played by Mark Eydelshteyn. So this was obviously supposed to bring not only Ani into Ivan’s world, but the audience into Ivan’s world. So I wanted the camera to essentially be following Ani, but also be seeing the world through Ani’s eyes. That’s why I did my best to not make it very cutty, especially when she arrives up at the front door and comes into the house. That is a one shot. “So welcome to my humble aboard. Hugs! Because I really wanted the audience to be walking through this space with Ani and seeing the space for the first time with Ani. So when she turns and looks to the right, the camera is turning and looking to the right. When she looks to the left, the camera’s turning and looking to the left. And what it does is that it really sets up the geography because the geography is going to be extremely important later on in the film, especially in the home invasion scene. So Drew Daniels, my amazing cinematographer who I’ve worked with now twice, he is a master at handheld camera operation, so he’s the one who’s actually holding the camera and shooting this entire sequence. “Not too shabby!” “What is ‘shabby’?” “Oh, I’m just playing.” Drew’s handheld cinematography is about as steady as handheld can get, especially with a heavy camera like this. And then he lands in this beautiful two shot. For me as an editor, that gave me a really solid out to cut to our wide static shot. “Oh, sorry, I’m waiting for you.” This was my wonderful actors adding a little bit of improv there, where Mark runs up the stairs. And then the next shot where they’re coming into the bedroom. This shot will be repeated at the end of the film. So in many ways it’s bookending her experience at this mansion. “Nice view.” “My view is better.”{"@context":"https://schema.org","@type":"VideoObject","@id":"https://www.nytimes.com/video/movies/100000009814094/anora-scene.html","description":"The writer, director and editor Sean Baker narrates a sequence from his comedy featuring Mikey Madison and Mark Eydelshteyn.","url":"https://www.nytimes.com/video/movies/100000009814094/anora-scene.html","name":"‘Anora’ | Anatomy of a Scene","thumbnailUrl":["https://static01.nyt.com/images/2024/11/07/multimedia/anora-anatomy1-jhpl/anora-anatomy1-jhpl-videoSixteenByNine1050.jpg","https://static01.nyt.com/images/2024/11/07/multimedia/anora-anatomy1-jhpl/anora-anatomy1-jhpl-superJumbo.jpg","https://static01.nyt.com/images/2024/11/07/multimedia/anora-anatomy1-jhpl/anora-anatomy1-jhpl-square640-v2.jpg"],"embedUrl":"https://www.nytimes.com/video/players/offsite/index.html?videoId=100000009814094","contentUrl":"https://vp.nyt.com/video/2024/11/07/129380_1_anora-anatomy_wg_480p.mp4","uploadDate":"2024-11-08T15:49:07.000Z","transcript":"“Hi, I’m Sean Baker. I’m the writer, director and editor of \"Anora.\" This is the scene in which our protagonist, Ani, played by Mikey Madison, is arriving at the house supposedly owned by Ivan Zakharov, who is played by Mark Eydelshteyn. So this was obviously supposed to bring not only Ani into Ivan’s world, but the audience into Ivan’s world. So I wanted the camera to essentially be following Ani, but also be seeing the world through Ani’s eyes. That’s why I did my best to not make it very cutty, especially when she arrives up at the front door and comes into the house. That is a one shot. \"So welcome to my humble aboard. Hugs! Because I really wanted the audience to be walking through this space with Ani and seeing the space for the first time with Ani. So when she turns and looks to the right, the camera is turning and looking to the right. When she looks to the left, the camera’s turning and looking to the left. And what it does is that it really sets up the geography because the geography is going to be extremely important later on in the film, especially in the home invasion scene. So Drew Daniels, my amazing cinematographer who I’ve worked with now twice, he is a master at handheld camera operation, so he’s the one who’s actually holding the camera and shooting this entire sequence. \"Not too shabby!\" \"What is 'shabby'?\" \"Oh, I’m just playing.\" Drew’s handheld cinematography is about as steady as handheld can get, especially with a heavy camera like this. And then he lands in this beautiful two shot. For me as an editor, that gave me a really solid out to cut to our wide static shot. \"Oh, sorry, I’m waiting for you.\" This was my wonderful actors adding a little bit of improv there, where Mark runs up the stairs. And then the next shot where they’re coming into the bedroom. This shot will be repeated at the end of the film. So in many ways it’s bookending her experience at this mansion. \"Nice view.\" \"My view is better.\"","duration":"PT2M34S"}The writer, director and editor Sean Baker narrates a sequence from his comedy featuring Mikey Madison and Mark Eydelshteyn.CreditCredit...NeonNominated for: Best picture, director, actress, supporting actor, original screenplay, editing.How to watch: Rent it on Amazon, Apple TV+, Fandango at Home, Google Play and YouTube.The writer-director Sean Baker’s rambunctious film concerns the whirlwind romance between a sex worker from Brighton Beach and the son of a Russian oligarch. It somehow channels both the madcap energy of classic screwball and the unfiltered emotion of John Cassavetes. Much of that liveliness is owed to Mikey Madison’s firecracker of a performance as Ani, a stripper whose time with a handsome young party animal, Ivan (Mark Eydelshteyn), at first seems like a “Pretty Woman” fantasy. But a quickie marriage draws attention from Ivan’s minders in the states and his parents abroad. Ani’s fight for their relationship, which turns literal at times, is alternately slapstick and touching.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'''
