["https://www.nytimes.com/2025/02/14/arts/television/lorne-michaels-saturday-night-live.html"]
title = "Lorne Michaels Reflects on His ‘S.N.L.’ Legacy Ahead of the 50th Anniversary - The New York Times"
description = "The man who made “Saturday Night Live” reflects on its legacy."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }‘S.N.L.’ at 50Lorne Michaels ReflectsThe Greatest Episode?SNL’s DebutFamous CatchphrasesMusical MomentsYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.The Great ReadLive From New York, It’s Lorne MichaelsThe man who made “Saturday Night Live” reflects on its legacy.As the creator of “Saturday Night Live,” Lorne Michaels has shaped American comedy for half a century.Credit...Daniel Arnold for The New York TimesThe Great ReadLive From New York, It’s Lorne MichaelsThe man who made “Saturday Night Live” reflects on its legacy.As the creator of “Saturday Night Live,” Lorne Michaels has shaped American comedy for half a century.Credit...Daniel Arnold for The New York TimesSupported bySKIP ADVERTISEMENTListen to this article · 21:07 min Learn moreShare full article132132By Maureen DowdFeb. 14, 2025Is it possible that Lorne Michaels is Lorne-ed out?Even for a man who enjoys being famous, all the hoopla surrounding the 50th anniversary of “Saturday Night Live,” all the extra attention it has brought him, has been a bit much.“I say this not with any sense of modesty — I was famous enough,” Michaels said recently at Orso, one of his favorite New York haunts. Someone who knew him once sardonically suggested Michaels would like to have “LEGENDARY” stitched into his underwear. And he is, after all, known in some circles by one name, like Beyoncé, Cher, Ichiro. But Michaels demurs.“Everybody who had to know me, knew me,” he said. “I wasn’t in the public eye. But now, walking over here, a young comedian came up and said, ‘How would I audition?’”I said I would have loved to have seen that encounter.“You would not love that,” he said in his bone-dry voice and signature cadence.Since the 50th season premiered last fall, the anniversary of “S.N.L.,” one of a fragmented America’s few remaining communal cultural events, has inspired a steady stream of tributes to the show and its creator. There was a Jason Reitman origin-story movie called “Saturday Night,” as well as hundreds of feature stories and listicles in the press. Last month there was a four-part docuseries on the show and another documentary on just the music. Friday night brings an “S.N.L” concert at Radio City Music Hall, livestreaming on Peacock. A 600-plus page biography of Michaels titled “Lorne,” by Susan Morrison, an editor at The New Yorker, comes out next week.It all culminates on Sunday with a live three-hour prime-time special looking back on “S.N.L.” and its singular legacy. Like a Veterans Day parade with troops from different wars marching by, “S.N.L.” stars from different decades, among many other celebrities young and old — guests include Paul McCartney, Robert De Niro, Steve Martin, Sabrina Carpenter, Tom Hanks, Kim Kardashian and Dave Chappelle — are swirling around New York, ready to help Michaels celebrate the golden anniversary.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
