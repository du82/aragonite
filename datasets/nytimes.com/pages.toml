328V11.1139C19%2011.4939%2018.8494%2011.8583%2018.5813%2012.127C18.3132%2012.3957%2017.9496%2012.5467%2017.5704%2012.5467H13.285L13.2271%2017ZM1.42971%201.21014C1.37079%201.21014%201.31428%201.2336%201.27262%201.27535C1.23095%201.31711%201.20754%201.37375%201.20754%201.4328V11.1139C1.20754%2011.1729%201.23095%2011.2296%201.27262%2011.2713C1.31428%2011.3131%201.37079%2011.3366%201.42971%2011.3366H8.05934L12.01%2014.4926V11.3366H17.5125C17.5714%2011.3366%2017.6279%2011.3131%2017.6696%2011.2713C17.7112%2011.2296%2017.7346%2011.1729%2017.7346%2011.1139V1.4328C17.7346%201.37375%2017.7112%201.31711%2017.6696%201.27535C17.6279%201.2336%2017.5714%201.21014%2017.5125%201.21014H1.42971Z%22%20fill%3D%22var(--color-content-quaternary%2C%23727272)%22%2F%3E%0A%3C%2Fsvg%3E');background-repeat:no-repeat;background-position:calc(100% - 20px) 20px;}.css-1spplqm{margin-left:45px;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;}.css-1bctr2p{font-size:0.875rem;line-height:1.25rem;font-family:nyt-franklin,helvetica,arial,sans-serif;color:var(--color-content-secondary,#363636);word-break:break-word;}.css-1bctr2p a{color:var(--color-signal-editorial,#326891);font-family:nyt-franklin,helvetica,arial,sans-serif;-webkit-text-decoration:none;text-decoration:none;}.css-146oyqz{margin:0;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:justify;-webkit-justify-content:space-between;-ms-flex-pack:justify;justify-content:space-between;}.css-146oyqz a{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-shrink:1;-ms-flex-negative:1;flex-shrink:1;}.css-1ker8rx{-webkit-text-decoration:none;text-decoration:none;display:block;font-size:0.875rem;line-height:1.0625rem;}.css-1ker8rx a:hover{-webkit-text-decoration:underline;text-decoration:underline;}.css-1ker8rx:afer{content:' ';position:absolute;top:0;right:0;left:0;bottom:0;}.css-1ker8rx:hover{-webkit-text-decoration:none;text-decoration:none;}.css-qitxok .css-1ker8rx{margin:21px 0 0 16px;}From the conversationYYuri ViziteiMissouriHaving been born and raised in the USSR and having observed Russia closely for 20 years (for business reasons), I can attest, that's what's happening is not 1930's fascism, but rather 2010s Russia. The gradual loss of parliament's role. Submission of the judicial branch. Expansion of the president's powers. First behind the scenes, and then overt , out in the open , with voter approval. Most importantly loss of rule of law. At every level. Which in turn results in oligarch centric consolidation of "business" (the only business that can operate in such climate, and vast systemic expansion of corruption.All of those attributes are now on display in America. They are being accelerated and propelled by purposeful chaos. We know where Russia is today. America will either wake up or end up in the same place.{"@context":"https://schema.org","@type":"Comment","@id":"https://www.nytimes.com/2025/02/15/opinion/trump-authoritarian-china.html#permid=139818310","parentItem":"https://www.nytimes.com/2025/02/15/opinion/trump-authoritarian-china.html","text":"Having been born and raised in the USSR and having observed Russia closely for 20 years (for business reasons), I can attest, that's what's happening is not 1930's fascism, but rather 2010s Russia. The gradual loss of parliament's role. Submission of the judicial branch. Expansion of the president's powers. First behind the scenes, and then overt , out in the open , with voter approval. Most importantly loss of rule of law. At every level. Which in turn results in oligarch centric consolidation of \"business\" (the only business that can operate in such climate, and vast systemic expansion of corruption. \n\nAll of those attributes are now on display in America. They are being accelerated and propelled by purposeful chaos. We know where Russia is today. America will either wake up or end up in the same place.","dateCreated":"2025-02-15T14:06:20.000Z","datePublished":"2025-02-15T14:06:21.000Z","author":{"@type":"Person","name":"Yuri Vizitei"}}Nicholas KristofOpinion Columnist@Yuri Vizitei Thanks for your comment. I think you're right that 2010s Russia is a parallel, as are Hungary, Poland, Philippines and Venezuela from that period. Sadly, there are plenty of examples of charismatic elected leaders who drag their nations in an authoritarian direction. And it sometimes is popular for a time -- which makes it all the more important for Democrats to get their house in order and make the arguments most likely to persuade the centrist voter in Wisconsin, Arizona, Georgia etc.{"@context":"https://schema.org","@type":"Comment","@id":"https://www.nytimes.com/2025/02/15/opinion/trump-authoritarian-china.html#permid=139822962","parentItem":"https://www.nytimes.com/2025/02/15/opinion/trump-authoritarian-china.html#permid=139818310","text":"@Yuri Vizitei Thanks for your comment. I think '''
