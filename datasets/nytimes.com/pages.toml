["https://www.nytimes.com/2025/02/27/us/betsy-arakawa-wife-gene-hackman-dead.html"]
title = "Betsy Arakawa, a Classical Musician and the Wife of Gene Hackman, Dies at 65 - The New York Times"
description = "As the spouse of a two-time Oscar winner, she avoided interviews and stayed off social media. But in private, she typed up Mr. Hackman’s novels and helped edit them."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Gene Hackman’s DeathThe LatestWhat We KnowJarring End to a Quiet LifeHackman (1930-2025)AppraisalBetsy Arakawa (1959-2025)AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTBetsy Arakawa, a Classical Musician and the Wife of Gene Hackman, Dies at 65As the spouse of a two-time Oscar winner, she avoided interviews and stayed off social media. But in private, she typed up Mr. Hackman’s novels and helped edit them.Listen to this article · 3:46 min Learn moreShare full articleBetsy Arakawa met Gene Hackman in the 1980s when she was working part-time at a fitness center in Los Angeles and trying to make it as a classical musician. Credit...DMI/The LIFE Picture Collection, via ShutterstockBy Jonathan WolfePublished Feb. 27, 2025Updated Feb. 28, 2025, 4:38 a.m. ETLeer en españolBetsy Arakawa, a classical musician and small-business owner who was married to Gene Hackman and helped edit his novels, was found dead with him at their home in Santa Fe, N.M., the local authorities said on Thursday. She was 65.Sheriff’s deputies found the bodies of Ms. Arakawa and Mr. Hackman, 95, along with one of their dogs, on Wednesday afternoon, according to a statement from the Santa Fe County Sheriff’s Department. The cause of death was unclear and under investigation.Mr. Hackman was nominated for five Academy Awards and won two during a 40-year acting career. In his later years, he became a published author, writing three historical novels, and he attributed his writing style, in part, to Ms. Arakawa.“If in fact I have a style, it came from repeated edits, friends’ suggestions and my wife’s unwavering, specific read-throughs,” he told the “Writer’s Bone” podcast in 2014.Mr. Hackman would write his books with pen and paper, and Ms. Arakawa would type them up on a computer, making edits or sharing thoughts on characters with him, according to Barbara Lenihan, a friend of the couple for nearly 35 years.“She was very involved with what he did,” Ms. Lenihan said. “She made it very possible for him to do it.”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
