full_description = 'New York Times - Top StoriesTrump-Zelensky Clash Signals a Break in AllianceLIVEFeb. 28, 2025, 8:41 p.m. ETTrump and Vance Berate Ukrainian Leader in Oval OfficePresident Trump and Vice President JD Vance accused President Volodymyr Zelensky of being ungrateful for aid and not acceding to U.S. demands.In a Fox News interview, Mr. Zelensky dodged a question about whether he owed Mr. Trump an apology. AnalysisBehind the Collision: Trump Jettisons Ukraine on His Way to a Larger GoalPresident Trump’s Oval Office encounter reflected his determination to put aside alliances and commitments to principles in favor of raw great-power negotiations.6 min readEarlier in the day, Trump greeted Zelensky outside the West Wing.Associated PressZelensky told Trump not to trust Putin.ReutersTrump and Vance berated Zelensky.Trump tried to strong-arm Zelensky into making a peace deal with Russia.Zelensky left the White House after the fiery exchange with Trump and Vance.Tyler PagerZelensky, appearing on Fox News, told Bret Baier he does not know whether the confrontation with Trump and Vance was a planned ambush, as some Democrats have suggested. “It was just a really tough situation,” he said.Tyler PagerZelensky concluded the interview on Fox News by expressing regret about his exchange with Trump and thanking the United States for its support. Zelensky also told Bret Baier that “of course” he could salvage his relationship with Trump.Reid J. EpsteinFourteen Democratic governors released a joint statement condemning how Trump and Vance treated Zelensky today at the White House and pledging their support for Ukraine.Peter BakerWith raised voices, Trump and Vance berated Zelensky of Ukraine in a remarkably fractious White House meeting, accusing Zelensky of not being grateful enough for U.S. support and trying to strong-arm him into making a peace deal with Russia.Peter BakerI have covered the White House since 1996. There has never been an Oval Office meeting in front of cameras like this in all that time. Never has an American president lectured the leader of an ally in public like this, much less the leader of a country that is fighting off invaders.Andrew E. KramerZelensky has tried to walk a fine line with Trump, though it unraveled today. He tried to avoid angering the leader of a vital ally, but pushed back on Trump’s narratives when he felt he had no choice, such as Trump’s claim that Ukraine started the war.Andrew E. KramerAmid the crosstalk and angry commentary, Trump and Zelensky argued over a matter of huge importance for Ukraine: whether a cease-fire should come before a deal on security guarantees. Zelensky says Putin cannot be trusted, so guarantees are needed.Erica L. Green​Trump has falsely claimed that Ukraine started the war, has refused to acknowledge Russia’s invasion of the country, and has disparaged Zelensky as a “dictator” while refusing to call Putin one.Erica L. GreenDuring the heated meeting on Friday, he said that Zelensky’s “hatred” for Putin, the dictator who invaded Ukraine, might be the reason the invasion won’t end. “You see the hatred he’s got for Putin,” Trump said. “That’s very tough for me to make a deal with that kind of hate.”Andrew E. KramerZelensky showed photographs of prisoners of war who had been abused in Russia, making a point that the war is about more than money to be made in mining. Zelensky is trying hard to include a prisoner exchange in any agreement.Robert JimisonEarlier this morning, Republican and Democratic senators met with Zelensky, some posting smiling selfies with him and some anticipating a signing ceremony for a mineral deal in a few hours.Robert JimisonThe contrast between that meeting and what transpired inside the Oval Office is a strikingly public display of the divide between President Trump’s approach to this war and the sentiment of many Republican defense hawks on Capitol Hill.Ukrainians Feel Blindsided by Deal’s Breakdown and by Trump’s Actions4 min readEurope Rallies Around Zelensky After Explosive White House Meeting3 min read<img src="https://static01.nyt.com/images/2025/02/28/multimedia/28ukraine-assess-1-fwpb/28ukraine-assess-1-fwpb-smallSquare252.jpg?format=pjpg&amp;quality=75&amp;auto=webp&amp;disable=upscale" alt="A man in military-style clothing seated alongside two men wearing suits in the Oval Office." class="css-122y91a"/>AnalysisZelensky, Seeking a Diplomatic Victory With Trump, Leaves With a Debacle6 min read<img src="https://static01.nyt.com/images/2025/02/28/multimedia/28trump-news-great-ratings-top-kzcv/28trump-news-great-ratings-top-kzcv-smallSquare252.jpg?format=pjpg&amp;quality=75&amp;auto=webp&amp;disable=upscale" alt="President Trump sounded almost excited by the drama of his fiery confrontation with President Volodymyr Zelensky of Ukraine." class="css-122y91a"/>‘This Is Going to Be Great Television’: Trump Sums Up His Zelensky Showdown3 min read<img src="https://static01.nyt.com/images/2025/02/28/multimedia/28dc-vance3-gzlv/28dc-vance3-gzlv-smallSquare252.jpg?format=pjpg&amp;quality=75&amp;auto=webp&amp;disable=upscale" alt="Vice President JD Vance and President Trump had a contentious meeting with President Volodymyr Zelensky of Ukraine in the Oval Office on Friday." class="css-122y91a"/>JD Vance Positions Himself as Trump’s Attack Dog During Blowup With Zelensky5 min read<img src="https://static01.nyt.com/images/2025/02/28/multimedia/28hp-promo-thumb-fgmj/28hp-promo-thumb-fgmj-smallSquare252.jpg?format=pjpg&amp;quality=75&amp;auto=webp&amp;disable=upscale" alt="" class="css-122y91a"/>Here Are Excerpts From the Fiery Exchange Between Trump and Zelensky8 min read window.registerInteractive && window.registerInteractive("100000010017656"); Measles OutbreaksVaccine EffectivenessSymptoms and TransmissionFalling Vaccination Rates"use strict";(function(){// prevent menus from overflowing into right rail on desktop function a(){var a=document.querySelector("nav[aria-labelledby=\"styln-measles-hp-menu\"