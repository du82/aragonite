["https://www.nytimes.com/2024/09/27/arts/television/snl-1975-cast-crew.html"]
title = "‘SNL’ Debut Cast and Crew Look Back on 50 Seasons - The New York Times"
description = "With a new film about the show, and a 50th anniversary season starting, Chevy Chase, Garrett Morris, Jane Curtin, Laraine Newman and others look back."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }‘S.N.L.’ at 50Lorne Michaels ReflectsThe Greatest Episode?SNL’s DebutFamous CatchphrasesMusical MomentsYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Credit...NBCSkip to contentSkip to site indexWhen ‘Saturday Night Live’ Debuted, They Were There. Here’s What They Remember.With a new film about the show, and a 50th anniversary season starting, Chevy Chase, Garrett Morris, Jane Curtin, Laraine Newman and others look back.Credit...NBCSupported bySKIP ADVERTISEMENTShare full article459459By Dave ItzkoffPublished Sept. 27, 2024Updated Oct. 9, 2024As the historic 50th season of “Saturday Night Live” gets underway, its very first episode has become a piece of show-business mythology: the story of how a group of misfit writers and performers, led by a 30-year-old Canadian upstart named Lorne Michaels, put together a counterculture comedy-variety show in Manhattan amid interpersonal conflict, last-minute changes and substance abuse, and somehow established a television institution.It’s a legend so revered that it has inspired a new film, “Saturday Night,” directed by Jason Reitman, in which a cast of young actors portraying the Not Ready for Prime Time Players (as well as the show’s producers and crew members) act out a version of events as they might have unfolded on that fateful evening of Oct. 11, 1975.For the people actually involved in the debut broadcast of what was then called “Saturday Night” — the writers, cast members, comedians and musicians — that excitement and energy is only one part of the tale. They remember the creation of the NBC show — the long buildup to its premiere, the performance itself and the aftermath — as sometimes hectic, sometimes carefully organized. It was a period full of head-butting, but one that also fostered camaraderie and lifelong friendships. And it never would have happened without some crucial, 11th-hour discoveries, or the right people in place to make those realizations.But at no point did they wonder if they were about to make history. “I don’t think it concerned us one way or the other,” said Chevy Chase, a founding cast member and writer. “We were going to do what we do, and if you laugh, great, you laugh. You’ll tell somebody else about it, and they’ll laugh the next time.”Here, some of those participants share their memories of how “Saturday Night” came to life.Jane CurtinImageJane Curtin said that she realized the show was catching on when she left 30 Rock and on the street “you’d pass by people and they would shake.”Credit...NBCU Photo Bank/Getty ImagesCurtin had acted in theater, commercials and a Boston-area improv group, the Proposition, when she auditioned for “Saturday Night” in summer 1975. At her callback, Curtin expected a conversation with producers: “I walked in the door,” she recalled, “and they said, ‘OK, what have you prepared?’ The classic anxiety dream.” Fortunately, she had some old material in her purse. “It was a big purse,” Curtin said.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
