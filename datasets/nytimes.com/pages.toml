description = "Between the idols of Hollywood’s golden age and the media-savvy stars of today, he had an appeal all his own."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Gene Hackman’s DeathThe LatestWhat We KnowJarring End to a Quiet LifeHackman (1930-2025)AppraisalBetsy Arakawa (1959-2025)AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTappraisalGene Hackman’s Gritty, Grouchy, Old-School StyleBetween the idols of Hollywood’s golden age and the media-savvy stars of today, he had an appeal all his own.Listen to this article · 6:16 min Learn moreShare full article2727Gene Hackman was a different leading man from Warren Beatty and Robert Redford. He broke through with his rough charm.Credit...Disney General Entertainment Content, via Getty ImagesBy Jim WindolfFeb. 28, 2025, 10:33 a.m. ETIn the decades separating the suave Cary Grant from the willowy Timothée Chalamet, there was a leading man with a rougher kind of charm.Even in his box-office heyday, Gene Hackman had a receding hairline and a paunch. He could pass for 50 when he was 30. He described himself as a “big lummox kind of person.”His first noteworthy role came alongside Jean Seberg in the 1964 film “Lillith.” Ms. Seberg said she found Mr. Hackman handsome because his face had so much character to it — but she didn’t believe he would go very far in an industry that favored Warren Beatty and other more conventionally attractive men.But changing attitudes demanded a new kind of star, and Mr. Hackman arrived when the sharp-focus cinema of the midcentury years gave way to the grainier palette of the 1970s, a time when the line between hero and antihero was blurring.He was 40 when he had his first leading role, in the drama “I Never Sang for My Father.” The next year he put on a porkpie hat to play the vicious cop Popeye Doyle in “The French Connection,” a performance that won him the first of his two Oscars.ImageMr. Hackman put on a porkpie hat to play Popeye Doyle in “The French Connection,” a performance that won him the first of his two Oscars.Credit...20th Century Fox, via Getty Images<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
