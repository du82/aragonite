title = "How Trump’s One-for-One Tariff Plan Threatens the Global Economy - The New York Times"
description = "In starting a process to impose reciprocal tariffs on American trading partners, the White House is sowing uncertainty and risking inflation."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Trump TariffsThe LatestWho Pays for Tariffs?U.S. Manufacturing CostsHot Inflation Raises StakesTaiwan PreparesYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Rows of cars waiting to be shipped at the Port of Tianjin in China. President Trump is aiming to advance a new era in which trade treaties give way to country-to-country negotiations. Credit...The New York Timesnews analysisHow Trump’s One-for-One Tariff Plan Threatens the Global EconomyIn starting a process to impose reciprocal tariffs on American trading partners, the White House is sowing uncertainty and risking inflation.Rows of cars waiting to be shipped at the Port of Tianjin in China. President Trump is aiming to advance a new era in which trade treaties give way to country-to-country negotiations. Credit...The New York TimesSupported bySKIP ADVERTISEMENTListen to this article · 8:26 min Learn moreShare full article469469By Peter S. GoodmanPeter Goodman has covered the evolving trade war inside and outside the United States since the beginning of President Trump’s first term.Feb. 16, 2025The world economy was already grappling with a perplexing assortment of variables, from geopolitical conflicts and a slowdown in China to the evolving complexities of climate change. Then, President Trump unleashed a plan to uproot decades of trade policy.In starting a process to impose so-called reciprocal tariffs on American trading partners, Mr. Trump increased volatility for international businesses. He broadened the scope of his unfolding trade war.In basic concept, the argument for reciprocal tariffs is straightforward: Whatever levies American companies face in exporting their wares to another country should apply to imports from that same country. Mr. Trump has long championed this principle, presenting it as a simple matter of fairness — redress to the fact that many American trading partners maintain higher tariffs.Yet in practice, calculating individual tariff rates on thousands of products drawn from more than 150 countries poses a monumental problem of execution for a vast range of companies, from American manufacturers dependent on imported parts to retailers that buy their goods from overseas.“It’s potentially a herculean task,” said Ted Murphy, an international trade expert at Sidley Austin, a law firm in Washington. “For every widget, every tariff classification, you can have 150 different duty rates. You’ve got Albania to Zimbabwe.”ImageSeamstresses working at a factory in Cartagena, Colombia, last month. Mr. Trump has challenged the merits of companies moving plants out of China by threatening tariffs on imports from Colombia and other countries.Credit...Alejandro Cegarra for The New York Times<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
