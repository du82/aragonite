["https://www.nytimes.com/2025/02/28/style/oscars-makeup.html"]
title = "Oscar Nominees Makeup Got Real in 2025: “The Substance,” “Wicked” and More - The New York Times"
description = "This year’s Oscar nominees for makeup and hairstyling, for movies such as “The Substance,” “Wicked” and “A Different Man,” showcased prosthetics and special effects."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Oscars 2025Nominees ListPredictionsPhotos: Nominees DinnerConan O’Brien on HostingFrom the Kremlin to the OscarsWhere to StreamAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTPus-Filled Injections and Green Witches: Movie Makeup Got RealThis year’s Oscar nominees for makeup and hairstyling, for movies such as “The Substance,” “Wicked” and “A Different Man,” showcased prosthetics and special effects.Listen to this article · 6:17 min Learn moreShare full article55Makeup artists applying Demi Moore’s extra layer for her role in “The Substance.”Credit...MubiBy Kellina MooreFeb. 28, 2025, 5:02 a.m. ETActors may deliver impassioned speeches about achieving their “childhood dreams,” but we don’t often hear about how those sculpting wounds with clay and bubbling skin with latex are fulfilling their lifelong fantasies.“Teenager treats” is how Pierre Olivier Persin, the special effects designer nominated for an Oscar for makeup and hairstyling for “The Substance,” described his work on the film, which involved two full-body prosthetics and countless other pieces and puppets. Mike Marino, the makeup designer for Sebastian Stan in “A Different Man,” nominated in the same category, described his childhood bedroom as a sort of cabinet of curiosities, filled with “jars of experiments and screaming Siamese twins.”It’s a particularly exciting year for makeup and hairstyling nominees: buckets of blood and pus-filled injections in “The Substance”; face tumors sloughing off like jelly in “A Different Man”; green witches and blue horses in “Wicked”; a vampire shriveling away in “Nosferatu”; and a menacing drug lord created with facial prosthetics in “Emilia Pérez.”Image“She wanted to see her hands. She wanted to get that reaction” from the other cast members, said Frances Hannon, the hair and makeup designer for “Wicked” about Cynthia Erivo, who played the green-skinned witch Elphaba in the film and has been vocal about her preference to be physically painted rather than having the hue added in postproduction.Credit...Universal Pictures, via Associated PressWhile in years past the category has sometimes leaned toward honoring the subtle transformations of delicately coifed period hairstyles, these nominees reflect a year that relied heavily on the use of makeup to create practical special effects.Once upon a time, most special effects were achieved with makeup. Think “An American Werewolf in London” (1981), “The Fly” (1986), “Beetlejuice” (1988): All the various monsters, mutations and marvels in these films were largely created with latex, foam and human hands. Then, in the early 2000s, studios became more reliant on computers to digitally generate these effects.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
