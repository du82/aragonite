["https://www.nytimes.com/2025/02/28/opinion/ben-stiller-gene-hackman.html"]
title = "Opinion | Ben Stiller on Gene Hackman’s Simple Truth - The New York Times"
description = "What he told me on the set of “The Royal Tenenbaums” has stayed with me ever since."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest EssayBen Stiller on Gene Hackman’s Simple TruthFeb. 28, 2025Credit...Image Source Touchstone PicturesListen to this article · 5:38 min Learn moreShare full article116116By Ben StillerMr. Stiller is an actor and director.Twenty-five years ago I found myself sitting in a director’s chair in Harlem next to Gene Hackman. I had been playing one of his sons in a world created by Wes Anderson, where somehow that made genealogical sense. He towered over me, both in height and stature. I don’t think my character was adopted but that might have been the back story we both created to justify the relationship.I didn’t ever feel comfortable around him. His movies were deeply embedded in my consciousness. In a time before social media and constant entertainment news, he was truly intimidating to me. He was one of the four actors on my Mount Rushmore, with Al Pacino, Robert De Niro and Dustin Hoffman. When Gene Hackman said something onscreen, you believed him.We had been filming “The Royal Tenenbaums” for about four weeks and we were waiting to film one of the final scenes of the movie, a long tracking shot that would end with him comforting my character, who had suffered a great loss. During the shoot I had found myself alone with him a couple of times, waiting to set up a shot or, after lunch had been called, walking back to the small trailers parked on a side street off Broadway. Each time, I had tried to think of something to say to him, to somehow acknowledge how much his work meant to me. It never felt right. But here we were sitting next to each other, and he seemed to not be doing anything. The shoot was going to be over soon and I’d probably never have a better moment to say something.“Gene, I have to tell you something.”I could feel the adrenaline surge through me. Even saying “Gene” felt adventurous. I felt a tingling in my stomach. He turned to me with a pleasant, curious smile. He had not seemed entirely happy on this shoot. While he was always courteous to me and the crew, I had gotten the feeling he didn’t feel as if he had any peers on this set, people he could be himself with. This is all speculation, but I felt he missed having a buddy on the set, a contemporary.But in this moment he was as approachable as I’d seen him. I thought about all the times so many people must have told him about his incredible work in “The Conversation,” or “The French Connection,” or “Mississippi Burning.” But I had wanted to tell him about the movie that really meant the most to me.I recall saying something like, “I just have to say — and I know you have obviously done so many great movies, just, like, incredible performances …”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
