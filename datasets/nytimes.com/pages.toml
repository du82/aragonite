title = "Opinion | ‘S.N.L.' Is for Me and All the Other Outsiders - The New York Times"
description = "Most of us aren’t hilarious or gorgeous or famous, and “Saturday Night Live” gives us access to all of those things."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest EssayOn ‘S.N.L.’ the Jokes Aren’t Even the Half of ItFeb. 15, 2025Credit...Peter ArkleListen to this article · 6:46 min Learn moreShare full article9494By Curtis SittenfeldMs. Sittenfeld is the author of the novel “Romantic Comedy” and the forthcoming story collection “Show Don’t Tell.”In December 2019, when my children were in third and fifth grade, I decided to show them a “Saturday Night Live” sketch that, decades before, my three siblings and I had loved: Jan Hooks and Nora Dunn as the Sweeney Sisters singing a Christmas medley at a party. I had trouble finding this particular sketch, but as my kids and I inhaled, via YouTube, a random assortment of other ones from over the years — among them such classics as “NPR’s Delicious Dish: Schweddy Balls” and “The Love Toilet” — I inadvertently yet happily created what would become our 2020 hobby, while quarantined in our Minneapolis home. I also welcomed my offspring into a time-honored tradition: watching “S.N.L.” when you’re a little too young for it.I myself began doing this in the mid-80s, in my friend Annie’s attic, when her older brothers introduced us to “Choppin’ Broccoli,” “A Couple of White Guys” and “The Church Lady.” As it happens, “S.N.L.” and I are the same age. I arrived in August 1975, and “S.N.L.” debuted in October. It’s therefore a little brain-scrambling to me that “S.N.L.” is now, with deserved fanfare, celebrating 50 years while I’m not quite 49 and a half, but apparently a TV show’s first season starts immediately, while a human’s first season starts when she turns 1.In any case, when I think of being too young for “S.N.L.” and enjoying it anyway, I don’t exactly mean because of the risqué content. Admittedly, as my family started watching entire episodes in reverse order of their airing — we especially enjoyed the golden age of Kate McKinnon and Aidy Bryant — my husband and I occasionally fast-forwarded through sketches not because they were crude (bring on “Undercover Office Potty”) but because they were innocence-destroying (the intentionally misogynistic “Guy Who Just Bought a Boat”).But I suspect that for a child watching “S.N.L.,” the joke itself doesn’t necessarily matter. If you’re 8 or 10, you might never even have heard of the politician or cultural trend being mocked. But you still know that you’re watching something funny; the magic of “S.N.L.” is that with its costumes and collaboration and the cast members regularly cracking up themselves and one another, it makes adulthood itself seem fun.My parents had friends and attended and threw parties, but even so, there was something about adulthood that struck me as serious when I was a kid — adults spent their days getting their oil changed, filling out paperwork, going to funerals — and the sheer silliness of “S.N.L.” seemed charmingly, enticingly at odds with that. If you were lucky, perhaps you could build a life around silliness. As it turned out, I did and I didn’t: I’m not a comedian, but as a novelist, I did build a life around making stuff up, reconstituting what the culture offers.Back in Minneapolis, the pandemic dragged on, and eventually my family was joined on our TV-watching couch by a rescue Chihuahua named Weenie. As we all watched episode after episode, it dawned on me that in addition to being a kid’s festive idea of adulthood, “S.N.L.” embodies several other elusive and aspirational ideas: an idea of New York for people who, like me, have never lived there; an idea of having hilarious friends or co-workers instead of annoying ones; an idea of being able to metabolize political instability into biting jokes instead of feeling helpless about it; an idea of glamorous after-parties that we want to want to attend when most of us don’t really want to stay up that late. (Though here I might just mean me. My kids are now teenagers and go to bed after I do. But my family has never watched “S.N.L.” live; we usually watch it on Sunday around 7 p.m.)<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
