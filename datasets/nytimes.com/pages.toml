["https://www.nytimes.com/2025/02/16/opinion/bove-sassoon-trump-adams.html"]
title = "Opinion | Trump’s Legal Shakedowns Won’t End With the Adams Case - The New York Times"
description = "The Justice Department’s loyalty game is new, dangerous and self-defeating."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest EssayAll the President’s Sock PuppetsFeb. 16, 2025, 7:00 a.m. ETCredit...Harris Allen for The New York TimesListen to this article · 8:38 min Learn moreShare full article823823By Daniel RichmanMr. Richman, a former federal prosecutor, is a law professor at Columbia University and is writing a book on early federal criminal enforcement.Every occupying force knows the tactic: If you want to cow a large population, pick one of its most respected citizens and demand he debase himself and pledge fealty. If he refuses, execute him and move on to the next one. This is how the Trump Justice Department thinks it will bring U.S. attorneys’ offices around the country under its control, starting last week with the Southern District of New York. Firing or demanding the resignation of a previous administration’s top prosecutors has become standard. After all, elections matter, and a new president should be free to set new priorities.But the Trump Justice Department’s twisted loyalty game is something new, dangerous and self-defeating. And this round probably won’t be the last.In instructing the Southern District to drop the case against Mayor Eric Adams of New York, Emil Bove III, the acting deputy attorney general, found a useful loyalty test. In his letter to Danielle Sassoon, the interim Southern District U.S. attorney, Mr. Bove gave two transparently inappropriate reasons: a baseless claim that the prosecution was politicized, which her powerful resignation letter demolished, and a barely concealed suggestion that a dismissal would provide leverage over Mr. Adams and ensure his cooperation in the administration’s efforts to deport undocumented immigrants. As Hagan Scotten, who led the Adams prosecution and has also resigned, nicely put it, “No system of ordered liberty can allow the government to use the carrot of dismissing charges, or the stick of threatening to bring them again, to induce an elected official to support its policy objectives.”When Ms. Sassoon, to her considerable credit, refused to debase herself and her office by proceeding on these rationales, Mr. Bove moved on to lawyers in Washington. Each resigned, until finally he found officials who would join him in signing.I don’t know why the Southern District was the first office in Mr. Bove’s cross hairs. Perhaps Mr. Adams’s lawyers, with connections to President Trump and Elon Musk, were first in a line of cronies seeking sweet deals for their clients. Perhaps Mr. Adams’s pilgrimage to Mar-a-Lago gave his case priority. Perhaps Mr. Bove has demanded similar demonstrations of loyalty from other offices, which quietly caved. Or perhaps Mr. Bove, an alumnus of the Southern District, thought its reputation for independence required it to be the first brought to heel.At the nation’s founding, the Southern District quickly assumed importance because the New York Customs House was the source of a large chunk of the government’s revenue. Its present culture was established when President Theodore Roosevelt recruited an elite New York lawyer, Henry Stimson, later a secretary of war and secretary of state, to go after abusive monopolies. Merit, not the usual patronage concerns, drove Mr. Stimson’s recruitment of young lawyers, including Felix Frankfurter and Emory Buckner, who would become an esteemed leader of the office.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
