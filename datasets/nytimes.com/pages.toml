["https://www.nytimes.com/2025/02/28/nyregion/nyc-diamond-dealer-swap-lab-grown.html"]
title = "He Stole $400,000 in Diamonds and Swapped Them for Look-Alikes - The New York Times"
description = "Manashe Sezanayev, who owned a store in Manhattan’s diamond district, pleaded guilty Thursday to stealing diamonds owned by other merchants and replacing them with cheaper, lab-grown stones."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTHe Stole $400,000 in Diamonds and Swapped Them for Look-AlikesManashe Sezanayev, who owned a store in Manhattan’s diamond district, pleaded guilty Thursday to stealing diamonds owned by other merchants and replacing them with cheaper, lab-grown stones.Listen to this article · 4:02 min Learn moreShare full articleManashe Sezanayev was indicted in Manhattan criminal court in July on charges of grand larceny, scheming to defraud and criminally possessing a forged instrument. Credit...Jeenah Moon for The New York TimesBy Maia ColemanFeb. 28, 2025, 6:00 p.m. ETA New York diamond dealer pleaded guilty on Thursday to stealing more than $400,000 worth of diamonds from two sellers and replacing them with cheaper lab-grown stones in a scheme he operated out of a Manhattan storefront.The dealer, Manashe Sezanayev, 41, who owned Rachel’s Diamonds, a jewelry store in the heart of the borough’s diamond district, admitted to taking three diamonds he claimed to be interested in buying and surreptitiously swapping them with counterfeit versions while the sellers weren’t looking.Mr. Sezanayev was indicted in Manhattan criminal court in July on charges of grand larceny, scheming to defraud and criminally possessing a forged instrument for his role in the scheme.He pleaded guilty to grand larceny, which is a felony, and is expected to receive five years of probation and no prison time, according to the Manhattan district attorney’s office. Mr. Sezanayev has paid $200,000 in restitution and returned one of the stolen diamonds to the victim, the office said.Alvin L. Bragg, the Manhattan district attorney, said in a statement on Friday that Mr. Sezanayev was now facing accountability for his crimes.“We will continue to prosecute those who take advantage of consumers and conduct business deals in a dishonest manner,” Mr. Bragg said.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
