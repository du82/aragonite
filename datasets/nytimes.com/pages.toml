["https://www.nytimes.com/2025/02/28/movies/gene-hackman-death-new-mexico.html"]
title = "For Gene Hackman, a Jarring End to a Quiet, Art-Filled Life in Santa Fe - The New York Times"
description = "Mr. Hackman, who was found dead with his wife and one of their dogs, had written novels and painted since leaving Hollywood behind for retirement in New Mexico."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Gene Hackman’s DeathThe LatestWhat We KnowJarring End to a Quiet LifeHackman (1930-2025)AppraisalBetsy Arakawa (1959-2025)AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTFor Gene Hackman, a Jarring End to a Quiet, Art-Filled Life in Santa FeMr. Hackman, who was found dead with his wife and one of their dogs, had written novels and painted since leaving Hollywood behind for retirement in New Mexico.Listen to this article · 6:21 min Learn moreShare full article191191Investigators searched the home of Gene Hackman and his wife, Betsy Arakawa, after their bodies were found in separate rooms on Wednesday. Credit...Roberto E. Rosales/Associated PressBy Julia JacobsFeb. 28, 2025Updated 7:29 p.m. ETLeer en españolYears after Gene Hackman retired from acting, he was at dinner with a friend in New Mexico who wanted to know how actors were able to cry on cue.“He put his head down at the table for about 30 seconds and raised his head up and there are tears coming down,” the friend, Doug Lanham, recalled. “He looked at me and goes, ‘How do you like that?’”After a long career in movies that won him two Oscars and the admiration of generations of film lovers, Mr. Hackman left Hollywood behind for Santa Fe, where he spent his final decades enjoying its striking scenery, trying his hand at painting and writing novels while living what appeared to be a quiet but full life with his wife, Betsy Arakawa.He played an active role in the city’s civic and social life during his early years there before slowing down and growing a bit more reclusive as he entered his late 80s and then his 90s, friends said. Some had been expecting to get word of his death from Ms. Arakawa one of these days.So it was shocking for them to learn this week that Mr. Hackman, 95, had been found dead in the mud room of his home in Santa Fe and that Ms. Arakawa, 65, had been found dead in a bathroom near an open prescription bottle and scattered pills. One of the couple’s dogs, a German shepherd, was found dead in a nearby closet.Video{"@context":"https://schema.org","@type":"VideoObject","@id":"https://www.nytimes.com/video/us/100000010018603/gene-hackman-911-call.html","description":"The caller described seeing a body on the floor and urged emergency services to quickly send help.","url":"https://www.nytimes.com/video/us/100000010018603/gene-hackman-911-call.html","name":"911 Call Seeks Help at Home of Gene Hackman","thumbnailUrl":["https://static01.nyt.com/images/2025/02/27/multimedia/27xp-hackman-death-gphw/27xp-hackman-death-gphw-videoSixteenByNine1050.jpg","https://static01.nyt.com/images/2025/02/27/multimedia/27xp-hackman-death-gphw/27xp-hackman-death-gphw-superJumbo.jpg","https://static01.nyt.com/images/2025/02/27/multimedia/27xp-hackman-death-gphw/27xp-hackman-death-gphw-square640.jpg"],"embedUrl":"https://www.nytimes.com/video/players/offsite/index.html?videoId=100000010018603","contentUrl":"https://vp.nyt.com/video/2025/02/28/134833_1_28vid-hackman_wg_480p.mp4","uploadDate":"2025-02-28T07:35:33.000Z","duration":"PT50S"}The caller described seeing a body on the floor and urged emergency services to quickly send help.CreditCredit...Mark J. Terrill/Associated Press<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
