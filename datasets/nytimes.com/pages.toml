title = "Volunteers Search for ISIS Kidnap Victims - The New York Times"
description = "No international body is searching for hundreds of Yazidi women and girls still held captive by the Islamist terrorists. Instead, their fates depend on a ragtag army of activists, relatives and armchair detectives."
full_description = 'You have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.They are the missing, torn from their families a decade ago by ISIS militants.Many are likely dead. Some may have been sold into sexual slavery. Others have been trapped in detention camps.The world has moved on, save for a band of searchers who refuse to give up.How a Network of Amateur Sleuths Helps Rescue Women Kidnapped by ISISNo international body is searching for hundreds of Yazidi women and girls still held captive by the Islamist terrorists. Instead, their fates depend on a ragtag army of activists, relatives and armchair detectives.By Eve SampsonFeb. 16, 2025The investigator’s eyes dart between the two photographs. In one, a young girl, maybe 10, is wearing a colorful shirt, her hair loose. In the other, a woman, her face weathered to an indeterminate age and framed by a black hijab, stares into the camera.The first picture is among hundreds of images of young girls sent in by families desperate to find loved ones who were kidnapped years ago, when militants from the Islamic State first roared to power in Iraq and Syria. The pictures of older women come in from a variety of sources.The woman examining the photographs has become skilled at finding the telling detail that might help confirm an identity — and lead to someone’s freedom. But she is not a professional investigator. Her name is Pari Ibrahim, and by day she is the executive director of a nonprofit in suburban Maryland.At night, by the glow of a laptop screen, she scours the photos, hoping to locate women taken captive as long as a decade ago.“Sometimes, late at night, I’m working to see if this girl is someone who can be identified,” said Ms. Ibrahim as she compared the two photographs, searching the faces for any hint — the bow of the lips, perhaps, or a telltale mole — that she might be looking at the same person.“Ten years brings a lot of change into someone’s face and appearance,” she said. “It’s not easy.”The missing people are all members of a religious minority, the Yazidi, who were a particular focus of the brutal campaign of terror that ISIS, also known as the Islamic State, launched in 2014. In the years that followed, according to a United Nations commission, the militants murdered, enslaved, raped and tortured at will. Some 3,100 Yazidis were killed and 6,800 kidnapped in August 2014 alone, one study estimates.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
