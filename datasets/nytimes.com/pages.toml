full_description = '#masthead-section-label, #masthead-bar-one { display: none }Winter WeatherForecastHow Much Will It Snow?Tracking TemperaturesHow to Stay SafeProtecting PetsAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTDamaging Winds to Lash the East Coast as Part of Powerful Winter StormHeavy snow, sleet, freezing rain, and damaging winds of up to 70 miles per hour are all in the mix for Sunday into Monday.Listen to this article · 3:55 min Learn moreShare full article window.registerInteractive && window.registerInteractive("100000009991729"); Five-day precipitation forecast 1 2 3 5 10+ inches Source: National Oceanic and Atmospheric Administration Notes: Values are shown only for the contiguous United States and are in inches of water or the equivalent amount of melted snow and ice. By Zach Levitt, Bea Malsky and Martín González Gómez { __sveltekit_1t6mxmh = { env: {}, assets: "https://static01.nytimes.com/newsgraphics/precipitation-forecast-map-embed/1739552325154", base: new URL("..", location).pathname.slice(0, -1), element: document.currentScript.parentElement }; const data = [null,{"type":"data","data":{map_props:{"300":{lat:36.519617725329155,lng:-86.81414992468312,zoom:3.9,ratio:"0.7"},"600":{lat:37.39342214944233,lng:-86.3844997972579,zoom:3.96633611155665,ratio:"0.63"},"945":{lat:36.1933783720217,lng:-85.5175196789288,zoom:4.62863092414871,ratio:"0.63"}},disable_us_reset_button:false,frozen:true,frozen_file:"2025-02-15",type:"severe",bounds:null,legend:"Five-day precipitation forecast",hide_credit:false},"uses":{}}]; Promise.all([ import("https://static01.nytimes.com/newsgraphics/precipitation-forecast-map-embed/1739552325154/_app/immutable/entry/start.c546d711.js"), import("https://static01.nytimes.com/newsgraphics/precipitation-forecast-map-embed/1739552325154/_app/immutable/entry/app.f0ce2932.js") ]).then(([kit, app]) => { kit.start(app, __sveltekit_1t6mxmh.element, { node_ids: [0, 5], data, form: null, error: null, params: {id:"2025-02-14-precip"}, route: {"id":"/(publish)/embed/[id]"} }); }); } By Amy GraffAmy Graff is a reporter on The Times’s weather team.Feb. 16, 2025Updated 1:26 p.m. ETA sprawling storm that blanketed some parts of the Northeast with up to seven inches of snow and deluged parts of the South with heavy rain and deadly flooding is next expected to deliver powerful, damaging winds that will last into Monday.Power outages, downed trees and hazardous road conditions could disrupt daily life and upend travel plans.At Kennedy Airport in New York, the winds, which were gusting as high as 45 miles per hour, were expected to delay up to 200 flights on Sunday afternoon, according to the Federal Aviation Administration.Bob Oravec, a meteorologist with the Weather Prediction Center, called the system a “high-impact storm” and said that the most severe weather on Sunday was likely to occur in the Northeast.Powerful winds are expected to develop on Sunday afternoon and linger into Monday up and down the East Coast, and westward into the Appalachians and the Ohio Valley.Damaging winds up to 70 m.p.h. are expected. In the Allegheny Mountains, which straddle Virginia and West Virginia and extend into Maryland and Pennsylvania, a blizzard warning is in effect from 1 p.m. Sunday until 3 p.m. Monday.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div