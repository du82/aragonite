full_description = '#masthead-section-label, #masthead-bar-one { display: none }Oscars 2025Nominees ListPredictionsPhotos: Nominees DinnerConan O’Brien on HostingFrom the Kremlin to the OscarsWhere to StreamAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENT2025 Oscar Nominations: See the Full ListThe movies competing for the 97th Academy Awards. The ceremony will air on March 2.Share full articleAdrien Brody, center, in “The Brutalist.”Credit...Lol Crawley/A24, via Associated PressBy Shivani GonzalezPublished Jan. 23, 2025Updated Feb. 28, 2025, 10:24 a.m. ETLeer en españolAfter a delay following the fires in Los Angeles, the nominations for the 97th Academy Awards were announced Thursday morning, with “Emilia Perez,” “The Brutalist” “ and “Wicked” garnering multiple nods.“Emilia Pérez” led with 13 nominations, including best picture. “The Brutalist” and “Wicked,” also best picture nominees, both received 10.The Brazilian feature “I’m Still Here,” which took home a best actress prize at the Golden Globes for its star Fernanda Torres, was nominated for best picture, international feature and actress.The ceremony, hosted by Conan O’Brien, will take place on March 2 and air on ABC and will stream on Hulu.See the complete list of nominees below.Best Picture“Anora”Read our review.“The Brutalist”Read our review.“A Complete Unknown”Read our review.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p clas