title = "Federal Workers Will Get Another Email Asking Them to Detail Accomplishments - The New York Times"
description = "Elon Musk sowed chaos across the government just days ago by asserting that failure to comply with a similar directive would result in their dismissals."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Musk’s InfluenceActing DOGE AdministratorWho Is in DOGE?Federal Worker CutsDOGE Deletes CutsStudent Loan DataPushback AttemptAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Federal Workers Will Get Another Email Asking Them to Detail AccomplishmentsElon Musk sowed chaos across the government just days ago by asserting that failure to comply with a similar directive would result in their dismissals.Share full articleElon Musk during a meeting of President Trump’s cabinet members on Thursday. Officials at some agencies defied Mr. Musk’s orders and told workers to pause or not respond to the previous email. Credit...Doug Mills/The New York TimesBy Madeleine Ngo and Eileen SullivanReporting from WashingtonFeb. 28, 2025Updated 3:58 p.m. ETFederal workers are expected to receive another email as soon as Saturday asking them to describe what they achieved this past week, according to a person familiar with the matter.The email will come directly from agencies’ human resources divisions this time, instead of from the Office of Personnel Management, the person said. The decision comes after O.P.M. leaders met with agency representatives on Thursday and advised them to send out the emails, according to the person. They spoke on condition of anonymity because they were not authorized to speak publicly.It was not clear as of Friday afternoon how widely the plans had been communicated across the federal work force, however. It was also unclear what consequences, if any, there would be if employees fail to comply. Civilian workers at the Department of Defense received a heads-up on Friday afternoon that they would receive the email on Monday, and that a response was expected.“Reply to that email and cc your supervisor within 48 hours,” the notice said. “Submissions must exclude classified or sensitive information and will be incorporated into weekly situation reports by supervisors. Noncompliance may lead to further review.”That amounts to significantly more guidance than federal employees received last weekend, when they were surprised by a mass email from the Office of Personnel Management that instructed them to reply with a list of five accomplishments from their previous workweek.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
