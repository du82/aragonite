["https://www.nytimes.com/2025/02/28/opinion/free-speech-trump-maga.html"]
title = "Opinion | The MAGA War on Speech - The New York Times"
description = "If only the powerful are free to speak their minds, it’s not free speech."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTThe Editorial BoardThe MAGA War on SpeechFeb. 28, 2025Credit...Illustration by Rebecca Chew/The New York TimesListen to this article · 13:20 min Learn moreShare full article1.7k1714By The Editorial BoardThe editorial board is a group of opinion journalists whose views are informed by expertise, research, debate and certain longstanding values. It is separate from the newsroom.In 1791, the nation’s founders ratified the First Amendment to the Constitution. It would come to offer protections in the new nation essentially never seen before: the right to ask things of and to criticize the government; to express opinions, popular or not; to assemble peacefully; to practice diverse religious beliefs; and to have a free press that publishes information without fear of censorship or retribution.This constitutional provision reflects the framers’ intent to establish a society where individuals have the ability to voice their views and participate actively in shaping the nation’s governance while holding their leaders accountable. Together, these five guaranteed liberties continue today to make the people of the United States the freest in the world.President Trump and many of his supporters — from tech leaders like Elon Musk to populist politicians like Vice President JD Vance — have spent the past several years portraying themselves as free-speech crusaders. Capitalizing on the censorial strains of the left, they regularly lecture about the necessity of letting people say whatever they want, even if it’s hateful, asinine or corrosive.That form of free-speech absolutism, which aims to defend not just favored speech but also disfavored speech, has a long and welcome role in American society. The problem is that for all their bluster, these supposed free-speech crusaders have proved themselves consistently intolerant when it comes to words, ideas and perspectives they disagree with.Over the past month Mr. Trump and his allies have embarked on an expansive crackdown on free expression and disfavored speakers that should be decried not just as hypocritical but also as un-American and unconstitutional.In the distorted view of the Trump administration, protecting free speech requires controlling free speech — banning words, phrases and ideas that challenge or complicate government-favored speech. Officials in Washington have spent the past month stripping federal websites of any hint of undesirable words and thoughts, disciplining news organizations that refuse to parrot the president’s language and threatening to punish those who have voiced criticism of investigations and prosecutions.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
