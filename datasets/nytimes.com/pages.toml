description = "Prosecutors in suburban Chicago said the killing of Wadee Alfayoumi in 2023 was motivated by hatred of Muslims."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTJury Convicts Landlord in Fatal Stabbing of Palestinian American BoyProsecutors in suburban Chicago said the killing of Wadee Alfayoumi in 2023 was motivated by hatred of Muslims.Listen to this article · 4:54 min Learn moreShare full articleWadee Alfayoumi’s father and uncle at a vigil for Wadee in 2023.Credit...Nam Y. Huh/Associated PressBy Robert Chiarito and Mitch SmithRobert Chiarito reported from Joliet, Ill. Mitch Smith reported from Chicago.Feb. 28, 2025Updated 4:44 p.m. ETA jury in suburban Chicago convicted a man on Friday on murder and hate crime charges in the fatal stabbing of a 6-year-old Palestinian American boy who lived at his property. The killing, which took place days after Hamas attacked Israel in 2023, was fueled by anti-Muslim hate, the authorities said.The defendant, Joseph M. Czuba, 73, faces up to life in prison when he is sentenced by a state judge in May.The attack on Wadee Alfayoumi, a kindergartner who loved Legos and soccer, drew international attention and left many members of Illinois’s large Palestinian and Muslim communities frightened and angry. Some leaders in those communities connected the attack to rhetoric used by some American politicians and media personalities that they said dehumanized Palestinians.Wadee and his mother, Hanan Shaheen, who was wounded in the attack, had lived for two years in rented rooms in Mr. Czuba’s home in Plainfield Township, Ill., about 40 miles southwest of Chicago. After the violence in the Middle East began, Ms. Shaheen told the jury, the relationship with her landlord suddenly soured. She said Mr. Czuba began making hateful statements about Muslims and demanded that Ms. Shaheen and her young son move out.“I told him, ‘Pray for peace,’” said Ms. Shaheen, who is Muslim and Palestinian American.But a few days later, she said, Mr. Czuba knocked on her bedroom door and began stabbing her with a knife, leaving her bleeding from the chest, back and head. After she retreated into a bathroom to call 911, she said Mr. Czuba attacked Wadee, who had just celebrated his birthday. Ms. Shaheen remembered her son crying out, “Stop! Oh no!”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
