full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTA Mandate for Boston’s Suburbs: Make Room for More ApartmentsThe state required 177 cities and towns served by public transit to loosen their zoning rules so that more multifamily housing can be built. A number of them resisted.Listen to this article · 7:19 min Learn moreShare full articleSupporters of the MBTA Communities Act outside Town Hall in Needham, Mass., last yearCredit...Sophie Park for The New York TimesBy Jenna RussellReporting from Winthrop and Needham, Mass.Feb. 16, 2025Updated 2:00 p.m. ETWorking at a cafe in Winthrop, Mass., for the last seven years, Valdineia Santos fell in love with the seaside suburb of 20,000 people, just north of Boston.But the two-bedroom apartments she found there rented for about $3,000 per month, considerably more than she could afford. So Ms. Santos and her young daughter stayed put in Malden, a city about a half-hour’s drive inland.“Maybe someday,” she said, winding down her shift at the cafe recently.A four-year-old state law meant to increase the supply of apartments in dozens of towns around Boston — ideally putting downward pressure on rents — was passed to help people like Ms. Santos. But the law has had a rough road, with a number of towns arguing that the state cannot force them to allow more multifamily housing.“It’s taking away the rights of citizens, and transferring those rights away from the people who know the town best,” said Diana Viens, a Winthrop resident who has led a movement there to defy the law. “Has the governor ever set foot here? Has she looked at our plan for our downtown?”The law requires 177 cities and towns served by public transit — spanning eastern Massachusetts from the New Hampshire border to the Cape Cod bridges — to allow multifamily housing to be built without a special permit, in at least one area near public transportation. Most of the communities were supposed to submit revised zoning rules by the end of last year.ImageA commuter train approaches the station in Needham, Mass. The MBTA Communities Act required towns served by public transit to revise their local zoning codes to allow for more multifamily housing.Credit...Sophie Park for The New York Times<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
