["https://www.nytimes.com/2025/02/28/opinion/donald-trump-birthright-citizenship.html"]
title = "Opinion | ‘An Emotional Torture Chamber for Liberals’: 3 Writers on Trump’s First Month - The New York Times"
description = "A discussion of stunt politics and how Republicans leverage emotionally charged issues over a long horizon."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest Essay‘An Emotional Torture Chamber for Liberals’: 3 Writers on Trump’s First MonthFeb. 28, 2025, 5:02 a.m. ETCredit...Illustration by Shoshana Schultz/The New York TimesListen to this article · 20:19 min Learn moreShare full articleBy Frank BruniNicole Hemmer and Tim MillerMr. Bruni is a contributing Opinion writer. Ms. Hemmer is the author of “Partisans: The Conservative Revolutionaries Who Remade American Politics in the 1990s.” Mr. Miller is the host of “The Bulwark Podcast.”Frank Bruni, a contributing Opinion writer, hosted a written online conversation with Nicole Hemmer, a history professor at Vanderbilt and the author of “Partisans: The Conservative Revolutionaries Who Remade American Politics in the 1990s,” and Tim Miller, the author of “Why We Did It: A Travelogue From the Republican Road to Hell,” to discuss President Trump’s stunt politics and how Republicans leverage emotionally charged issues over a long horizon.Frank Bruni: When President Trump issued that executive order on birthright citizenship on Day 1 — right out of the gate — I thought: Here we go again. Here’s another emotionally charged gambit that is not meant to lead to any real change because it’s patently unconstitutional and sure to be blocked by the courts but that gets gobs of attention and generates oodles of commentary. I also thought about the way Republicans used abortion in the past, about the party’s particular genius for anger-juicing issues that are sure to go unresolved for years and about Trump’s M.O. as the apotheosis of that. Tim, Nicole, am I onto something, or do I need more coffee?Nicole Hemmer: I always recommend more coffee, but I do think there’s something to that. Overturning birthright citizenship is an issue that serves as a kind of vice signaling, a way of indicating who the shared enemies are and how the president would hurt them if he had unchecked power.Tim Miller: In this case I think this is a sincere policy goal they would like to effectuate. Yes, it is also a brazen P.R. stunt. But ending birthright citizenship has deep support among the MAGA intellectual set. And most MAGA voters would be for it.Bruni: Damn you, Tim. I had the word “stunt” in my shoulder bag and was all ready to yank it out with a great flourish and much self-congratulation, and now you’ve ruined that. I hear both of you on the fact that MAGA voters feel about an end to birthright citizenship the way sharks do about chum: They’re all over it.But I’m wondering if on some level Trump and Republicans like it that the proposal to end birthright citizenship, like the efforts to overturn Roe, might stick around for a very long and profitable while, might be a sustained source of anger and funds rather than a quick fix.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
