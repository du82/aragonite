full_description = '#masthead-section-label, #masthead-bar-one { display: none }‘S.N.L.’ at 50Lorne Michaels ReflectsThe Greatest Episode?SNL’s DebutFamous CatchphrasesMusical MomentsYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Skip to contentSkip to site indexLadies and Gentlemen, 38 Key Musical Moments on ‘S.N.L.’As the show celebrates its 50th season, look back at some of its most fiery, shocking and groundbreaking performances.Credit...Supported bySKIP ADVERTISEMENTListen to this article · 14:39 min Learn moreShare full article418418By Christopher R. WeingartenPublished Jan. 25, 2025Updated Jan. 29, 2025From the age of the 8-track to the time of TikTok, the “Saturday Night Live” stage has adapted to (and subsequently outlived) every musical trend in the last half-century. From its early days as an extension of a young creative team’s edgy tastes (Sun Ra, Tom Waits, Ornette Coleman) to its current station as a state-of-the-pop-union address, “S.N.L.” can break a musical guest or destroy them, providing no shortage of in-studio tensions, national controversies and unforgettable magic. Here are 38 landmark moments.Oct. 11, 1975Billy PrestonImageOn the show still known as “Saturday Night,” the inaugural musical guest was the keyboard authority Billy Preston, who played a supremely funky version of his No. 1 hit “Nothing From Nothing.”Oct. 18, 1975Simon and GarfunkelThe tumultuous relationship of Simon and Garfunkel was briefly mended for their first performance in three years: intimate and austere versions of “The Boxer,” “Scarborough Fair” and “My Little Town.”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></pat