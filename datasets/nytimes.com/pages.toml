["https://www.nytimes.com/2025/02/14/style/christine-ko-alan-yang-wedding.html"]
title = "She Was the Female Lead in His Film. Now She’s His Leading Lady. - The New York Times"
description = "When Alan Yang, known for “Parks and Recreation” and “Master of None,” directed his first film, Christine Ko’s audition tape stopped him in his tracks. Once the film wrapped, romance emerged."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTVowsShe Was the Female Lead in His Film. Now She’s His Leading Lady.When Alan Yang, known for “Parks and Recreation” and “Master of None,” directed his first film, Christine Ko’s audition tape stopped him in his tracks. Once the film wrapped, romance emerged.Listen to this article · 9:15 min Learn moreShare full articleChristine Ko and Alan Yang were married at a private club in Manhattan on Jan. 3. They had met when she auditioned for the 2020 film “Tigertail.”Credit...Kayleigh TaylorBy Valeriya SafronovaFeb. 14, 2025In March 2018, Christine Ko canceled an audition for the film “Tigertail” because her adoptive father, who had been sick with cancer for many years, was dying and she wanted to see him.A few weeks later, the role still hadn’t been cast, so Ms. Ko, an actress, was invited again to audition.“I remember where I was when I watched her audition video,” said Alan Michael Yang, the writer, director and producer of “Tigertail.” He was so impressed by her performance that he wanted to meet Ms. Ko in person.Ms. Ko landed the role as the film’s female lead, and she and Mr. Yang spent the early fall working together in New York and Taiwan, with him behind the camera and her in front of it. The film is inspired by Mr. Yang’s parents, Joanne Bian and Peter Yang, and the story of their immigration from Taiwan to the United States. Like Mr. Yang, Ms. Ko is Taiwanese-American.“It’s so cool that we’re from similar cultural backgrounds,” Ms. Ko said. During filming, she said, they were both “discovering our identity and where our parents are from.”Ms. Ko, 36, grew up with two sets of parents: her biological parents, Cindy Wen and Frankie Kao, who lived in Taiwan her whole life, and her aunt and uncle, Irene and Richard Wang, who adopted her when she was 3 years old and raised her in Acworth, Ga. She received a bachelor’s degree in communication from Georgia State University, and in 2011, she moved to Los Angeles to become an actress. She worked as a waitress, babysitter and Uber driver until she caught a break on CBS’s “The Great Indoors” in 2016. Since then, she’s been cast on TV shows like “Dave,” “Only Murders in the Building” and “The Handmaid’s Tale.”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
