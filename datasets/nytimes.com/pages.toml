title = "As Trump Targets Research, Scientists Share Grief and Resolve to Fight - The New York Times"
description = "At a conference in Boston, the nation’s scientists commiserated and strategized as funding cuts and federal layoffs throw their world into turmoil."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTAs Trump Targets Research, Scientists Share Grief and Resolve to FightAt a conference in Boston, the nation’s scientists commiserated and strategized as funding cuts and federal layoffs throw their world into turmoil.Listen to this article · 5:46 min Learn moreShare full articleSudip Parikh, who leads the American Association for the Advancement of Science, in Washington in 2023.Credit...Olivier Douliery/Agence France-Presse — Getty ImagesBy Raymond ZhongReporting from Boston, at the annual meeting of the American Association for the Advancement of Science.Feb. 16, 2025Updated 2:47 p.m. ETAt the annual gathering in Boston this past week of one of America’s oldest scientific societies, the discussions touched on threats to humankind: runaway artificial intelligence, toxic “forever chemicals,” the eventual end of the universe.But the most urgent threats for many scientists were the ones aimed at them, as the Trump administration slashes the federal scientific work force and cuts back on billions of dollars in funding for research at universities.“Angst and anxiety and, to a certain extent, grief,” is how Sudip Parikh, who leads the American Association for the Advancement of Science, the organization hosting the conference, summed up the mood on Saturday. News about layoffs at government agencies rippled across conference-goers’ phones.“It’s like we’re getting hit from all sides,” said Roger Wakimoto, the vice chancellor for research at the University of California, Los Angeles.Mere weeks into President Trump’s second term, his administration and Republicans in Congress have sent universities reeling with crackdowns on diversity initiatives, threats to endowments and potential deportations of undocumented students.ImagePresident Trump in Florida on Friday.Credit...Al Drago for The New York Times<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
