["https://www.nytimes.com/2025/02/16/opinion/read-books-learning.html"]
title = "Opinion | Let Students Finish the Whole Book. It Could Change Their Lives. - The New York Times"
description = "Had they merely read the summary, my students would have seen many of the same words, but they’d have lacked the feeling part."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest EssayLet Students Finish the Whole Book. It Could Change Their Lives.Feb. 16, 2025, 7:00 a.m. ETVideoCreditCredit...Veronyka JelinekListen to this article · 6:25 min Learn moreShare full articleBy Tim DonahueMr. Donahue teaches high school English at Greenwich Country Day School in Connecticut.In her memoir, Dorothy Allison writes, “Two or three things I know for sure and one of them is that telling the story all the way through is an act of love.”Throughout my teaching career at independent schools, which began during the Clinton administration, I’ve also been telling students that reading a story all the way through is an act of love. It takes stillness and receptivity to realize this, it takes a willingness to enter the life of someone you’ll never meet, and it requires great practice.It’s easy to join the hand-wringing chorus, blaming TikTok’s corn drill challenge, Jake Paul and their ilk for the diminuendo of Dickens. But we cannot let reading become another bygone practice. In their more than eight hours of screen time a day, on average, students navigate a galaxy of mediated experiences; schools need to be a bastion of the analog experience of the physical book.The study of English involves more than reading. It includes written expression and the cultivation of an authentic voice. But the comprehension of literature, on which the study of English is based, is rooted in the pleasure of reading. Sometimes there will be a beam of light that falls on a room of students collectively leaning into a story, with only the scuffing sounds of pages, and it’s as though all our heartbeats have slowed. But we have introduced so many antagonists to scrape against this stillness that reading seems to be impractical.The test scores released at the end of last month by the National Assessment of Educational Progress reveal disturbing trend lines for the future of literacy in our country. Thirty-three percent of eighth graders scored “below basic” on reading skills, meaning they were unable to determine the main idea of a text or identify differing sides of an argument. This was the worst result in the exam’s 32-year history. To make matters worse, or perhaps to explain how we got here, the assessment reported that in 2023 only 14 percent of students said they read for fun almost every day, a drop of 13 percentage points since 2012.In its attempt to make English more relevant, the National Council of Teachers of English — devoted to the improvement of language arts instruction — announced in 2022 that it would widen its doors to the digital and mediated world. The aim was to retreat from the primacy of the written word and invite more ideas to be represented by images and multimedia. “It behooves our profession, as stewards of the communication arts, to confront and challenge the tacit and implicit ways in which print media is valorized above the full range of literacy competencies students should master,” the council said.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
