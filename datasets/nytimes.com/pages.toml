["https://www.nytimes.com/2025/02/16/us/politics/trump-europe-alliance-crisis.html"]
title = "Trump Team Leaves European Alliance in Crisis; Macron Calls for Emergency Summit - The New York Times"
description = "European leaders felt certain about one thing after a whirlwind tour by Trump officials — they were entering a new world where it was harder to depend on the United States."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Trump AdministrationliveUpdatesFeb. 16, 2025, 3:09 p.m. ETTracking the Major MovesLawsuits TrackerFederal Worker CutsConfirmations TrackerAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTnews analysisTrump Team Leaves Behind an Alliance in CrisisEuropean leaders felt certain about one thing after a whirlwind tour by Trump officials — they were entering a new world where it was harder to depend on the United States.Listen to this article · 11:31 min Learn moreShare full article631631Vice President JD Vance speaking with President Volodymyr Zelensky of Ukraine during a bilateral meeting on the sidelines of the Munich Security Conference on Friday.Credit...Matthias Schrader/Associated PressBy David E. Sanger and Steven ErlangerReporting from MunichFeb. 16, 2025Updated 11:02 a.m. ETMany critical issues were left uncertain — including the fate of Ukraine — at the end of Europe’s first encounter with an angry and impatient Trump administration. But one thing was clear: An epochal breach appears to be opening in the Western alliance.After three years of war that forged a new unity within NATO, the Trump administration has made clear it is planning to focus its attention elsewhere: in Asia, Latin America, the Arctic and anywhere President Trump believes the United States can obtain critical mineral rights.European officials who emerged from a meeting with Defense Secretary Pete Hegseth said they now expect that tens of thousands of American troops will be pulled out of Europe — the only question is how many, and how fast.And they fear that in one-on-one negotiations with President Vladimir V. Putin of Russia, Mr. Trump is on his way to agreeing to terms that could ultimately put Moscow in a position to own a fifth of Ukraine and to prepare to take the rest in a few years’ time. Mr. Putin’s ultimate goal, they believe, is to break up the NATO alliance.Those fears spilled out on the stage of the Munich Security Conference on Saturday morning, when President Volodymyr Zelensky declared that “Ukraine will never accept deals made behind our backs.” He then called optimistically for the creation of an “army of Europe,” one that includes his now battle-hardened Ukrainian forces. He was advocating, in essence, a military alternative to NATO, a force that would make its own decisions without the influence — or the military control — of the United States.Mr. Zelensky predicted that Mr. Putin would soon seek to manipulate Mr. Trump, speculating that the Russian leader would invite the new American president to the celebration of the 80th anniversary of the defeat of Nazi Germany. “Putin will try to get the U.S. president standing on Red Square on May 9 this year,” he told a jammed hall of European diplomats and defense and intelligence officials, “not as a respected leader but as a prop in his own performance.”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
