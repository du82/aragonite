["https://www.nytimes.com/2025/02/16/us/politics/donors-democrats-trump.html"]
title = "Venting at Democrats and Fearing Trump, Liberal Donors Pull Back Cash - The New York Times"
description = "Demoralized donors are frustrated with Democrats’ failings and worried about retribution from the president. Their frugality has left liberal groups struggling to fight the new administration."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Trump AdministrationliveUpdatesFeb. 16, 2025, 2:54 p.m. ETTracking the Major MovesLawsuits TrackerFederal Worker CutsConfirmations TrackerAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTVenting at Democrats and Fearing Trump, Liberal Donors Pull Back CashDemoralized donors are frustrated with Democrats’ failings and worried about retribution from the president. Their frugality has left liberal groups struggling to fight the new administration.Listen to this article · 10:44 min Learn moreShare full article898898President Trump has not yet taken action against any liberal groups or donors, but many worry that he or his allies may seek to punish them through congressional investigations, lawsuits or tax audits.Credit...Doug Mills/The New York TimesBy Lisa LererReid J. Epstein and Theodore SchleiferFeb. 16, 2025, 5:01 a.m. ETThe demoralization and fear gripping blue America in the early weeks of President Trump’s administration have left liberal groups and their allies struggling for cash, hurting their ability to effectively combat the right-wing transformation of the federal government.The small-dollar online spigot that powered opposition to the first Trump administration has slowed to a trickle as shaken liberal voters withhold their donations.Charitable foundations that have long supported causes like voting rights, L.G.B.T.Q. equality and immigrants’ rights are pulling back, devoting time to prepare for expected investigations from the Republican-led Congress.And some of the country’s biggest liberal donors have paused giving, frustrated with what they see as Democrats’ lack of vision and worried about retaliation from a vengeful president. Some Democrats say a few of their reliable donors are now openly supporting Mr. Trump, or at least looking to curry favor with him.Fund-raising slowdowns are common after a presidential defeat and before marquee midterm races fully begin. But interviews with more than 50 donors, strategists and leaders of activist organizations show that many Democrats believe this year is different.While Mr. Trump has not taken action against any liberal groups or lawmakers, Democrats worry his frequent threats of retribution during the campaign have led to a chilling effect on the charitable foundations and nonprofit advocacy groups that have long been pillars of the country’s civil society.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
