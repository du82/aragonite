description = "Our comedy columnist reflects on 50 years of “Saturday Night Live.”"
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.NewsletterThe MorningLife, from New YorkOur comedy columnist reflects on 50 years of “Saturday Night Live.”Share full articleJane Curtin and Chevy Chase in 1976. Credit...Owen Franken/Corbis, via Getty ImagesFeb. 16, 2025Updated 8:07 a.m. ETBy Jason ZinomanI write The Times’s On Comedy column.Like “Saturday Night Live,” I turn 50 this year. In fact, I was born only one week after its premiere, which means that along with being a comedy revolution, a career launchpad and a pop culture juggernaut, the show is also a good way for me to keep track of time.Every cast represents a different era in my life. I missed the storied original group — including Chevy Chase and Jane Curtin, both of whom will appear on a prime-time 50th anniversary special tonight — as I was busy learning how to walk, talk and eat solid food. And yet its jokes (“It’s a floor wax and a dessert topping”) were repeated in my house enough to make their way into my consciousness.It wasn’t until I was 10 that I stayed up to watch “S.N.L.,” during the strange and spectacular season starring Billy Crystal and Christopher Guest. I was the perfect age to appreciate Martin Short’s Ed Grimley, a giddy, prancing innocent who exuded the nervous energy of childhood. But it was the next hit era, featuring Phil Hartman, Jan Hooks and Dana Carvey, that got me hooked on sketch comedy. The cable-access spoof “Wayne’s World” showed up just after puberty. Perfect timing.ImageMike Myers and Dana Carvey during a “Wayne’s World” skit in 2015.Credit...Dana Edelson/NBCUniversal, via Getty ImagesJust as teenagers rebel against their parents, “S.N.L.” fans eventually start rolling their eyes at the show. In my 20s, I first indulged in the popular tradition of loudly lamenting that it wasn’t as funny as it used to be. I stopped watching and missed some of the best years of Chris Farley and Adam Sandler. I returned for the Tina Fey era, which ended in my 30s, and became a devoted fan of the cast that featured Bill Hader, Kristen Wiig and Andy Samberg. In recent years, the perspective and mellowing of middle age have helped me enjoy some less-than-perfect seasons. Yet my kids watch those same episodes with an excited fandom and snorting exasperation that I can no longer muster.The celebration of half a century of “Saturday Night Live” is a major event because the show transcends comedy. More than 26 million people watched its 40th anniversary special. This one feels even more significant, one of the last gasps of the monoculture. “S.N.L.” has been culturally relevant for so long that it’s woven into the background of our lives — continually reinventing itself, always there. The New York Times has tried to capture its impact on the culture in the past few weeks. We’ve singled out the show’s 13 greatest ad parodies, its 38 most important musical moments and 50 catchphrases it has ushered into our vocabulary. I explored how its cast members’ extensive history of breaking character has become an unlikely signature of its sketch comedy.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
