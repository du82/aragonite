title = "Israeli Hostages’ Accounts of Abuse Raise Alarms for Remaining Captives - The New York Times"
description = "Freed hostages have told of starvation, and relatives of others held in Gaza say officials have relayed accounts of torture."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Middle East TensionsHostages’ Accounts of AbuseSearching for Gaza’s DeadLebanon’s Diaspora ReturnsTrump’s Gaza ProposalAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTIsraeli Hostages’ Accounts of Abuse Raise Alarms for Remaining CaptivesFreed hostages have told of starvation, and relatives of others held in Gaza say officials have relayed accounts of torture.Listen to this article · 6:15 min Learn moreShare full articleHamas handing over the Israeli hostages Ohad Ben Ami, left, Eli Sharabi, right, and Or Levy, not pictured, to the Red Cross as part of the fifth round of an exchange deal on Saturday.Credit...Saher Alghorra for The New York TimesBy Ephrat LivniFeb. 10, 2025Bound. Starved. Wounded. Tortured. These are the conditions that some hostages being held in Gaza still face, according to information their families said they had received from Israeli military and security officials after Hamas released three captives on Saturday as part of a cease-fire agreement.The emaciated appearance of three hostages released in a ceremony in Gaza staged by Hamas last weekend — Eli Sharabi, 52; Or Levy, 34; and Ohad Ben-Ami, 56 — and the details of their captivity have relatives of the remaining captives sounding the alarm about the urgent need for the continuation of the phased cease-fire deal. The urgency comes as the militant group said on Monday it would indefinitely postpone the next hostage releases, set for Saturday, citing Israeli cease-fire violations.Before they were handed over to Red Cross officials in exchange for 183 Palestinian prisoners on Saturday, the frail, painfully thin hostages were paraded onstage before a crowd in the city of Deir al-Balah, Gaza, each holding a Hamas-issued “release certificate,” and made to recite words written for them — including thanks to the militants who had held them for 16 months.A doctor in charge of overseeing the treatment of two of the freed Israeli hostages later said they were in poor condition. The third was in a “severe nutritional state,” according to an official at the hospital where he was being treated.Hamas has said it treats its captives benevolently.Under the first phases of the cease-fire deal, the armed Palestinian group agreed to free 25 living hostages and the bodies of eight who were killed, in exchange for about 1,500 Palestinian prisoners. So far, about half of those exchanges have been carried out.Hamas on Saturday denounced “the brutal treatment of our prisoners” by Israeli officials. “This includes ongoing assaults, torture, and disregard for age or the severe health conditions suffered by many prisoners,” it said in a statement, highlighting what it said was the difference in treatment between the hostages and the prisoners.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
