["https://www.nytimes.com/2025/02/15/business/medicare-medigap-advantage.html"]
title = "Medicare Doesn’t Pay for Everything: How to Bridge the Cost Gap - The New York Times"
description = "Older Americans have ways to protect against high out-of-pocket health care costs, but it’s important to understand the trade-offs."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTretiringBridging the Medicare Cost Gap: Knowing Your OptionsOlder Americans have ways to protect against high out-of-pocket health care costs, but it’s important to understand the trade-offs.Listen to this article · 12:11 min Learn moreShare full articleCredit...Jeremy NguyenBy Mark MillerFeb. 15, 2025Medicare can cover most of your health care needs when you turn 65, but it doesn’t pay for everything. And one of the most significant financial challenges to watch out for are the out-of-pocket costs you can face aside from monthly premiums — including deductibles and other types of cost sharing.Just how much you’ll pay, and when, depends on the type of Medicare enrollment that you choose: traditional Medicare, which is operated by the government and provides care on a fee-for-service basis, or Medicare Advantage, which is run by private insurance companies and operates on a managed care model.There is no built-in annual out-of-pocket limit in traditional Medicare for outpatient and hospitalization services. Protection is available from supplemental insurance coverage. Some retirees get this from former employers, unions or Medicaid, but most often it means purchasing Medigap — a policy offered by private insurance companies that covers part or all of Medicare’s cost-sharing requirements. And 10 percent of people on traditional Medicare age 65 or older don’t have any supplemental protection, according to KFF, a nonprofit health policy research group — which is a risky move, experts say.Medicare Advantage plans come with out-of-pocket limits — but they can be high, ranging from roughly $5,000 to $9,000 annually depending on the services you use. What’s more, the out-of-pocket protection varies among plans. When serious medical conditions arise, out-of-pocket costs can be a significant financial hit or make it difficult to afford care altogether. (Starting this year, the Inflation Reduction Act of 2022 imposes a $2,000 cap on total out-of-pocket spending for drugs covered by Part D plans.)Choosing between traditional Medicare and Advantage shouldn’t be based on cost alone. Medicare Advantage plans offer one-stop shopping and extra benefits, but they restrict care to in-network providers and have been criticized for techniques such as “prior authorization,” used by insurance companies to ensure that services are medically necessary by requiring approval before a benefit will be covered. Traditional Medicare offers the widest access to health providers, and only a small group of medical services require prior authorization.It’s important to understand the out-of-pocket trade-offs between traditional Medicare and Medicare Advantage. Let’s look at how Medigap policies work and how to buy them — and how to evaluate what you might pay out-of-pocket in Advantage plans.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
