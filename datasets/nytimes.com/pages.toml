title = "Yrjo Kukkapuro, Who Made the Easiest of Easy Chairs, Dies at 91 - The New York Times"
description = "A celebrated Finnish modernist, he designed a variety of furnishings but was best known for his seating — which, his company said, “almost every Finn has sat on.”"
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTYrjo Kukkapuro, Who Made the Easiest of Easy Chairs, Dies at 91A celebrated Finnish modernist, he designed a variety of furnishings but was best known for his seating — which, his company said, “almost every Finn has sat on.”Listen to this article · 7:32 min Learn moreShare full articleThe furniture designer Yrjo Kukkapuro with his Experiment chairs and coffee tables in the 1980s. An admirer described him as “playful with form and color, but always thinking about the user at the center.”Credit...via Studio KukkapuroBy Julie LaskyPublished Feb. 15, 2025Updated Feb. 16, 2025, 2:04 p.m. ETYrjo Kukkapuro, a Finnish furniture designer who devoted his restless creative energies to sedentary comfort, creating dozens of chairs that coddled sitters and lent a zesty flair to their surroundings, died on Feb. 8 at his home in Kauniainen, Finland. He was 91.His death was confirmed by his daughter, Isa Kukkapuro-Enbom.In his seven-decade career, Mr. Kukkapuro designed a variety of furnishings for homes, offices and public institutions. But he was best known for his seating.“Almost every Finn has sat on a chair he designed — at a metro station, in a bank, at a school or in a library,” his company, Studio Kukkapuro, said in a news release.An experimental modernist who was invigorated by the availability of lightweight synthetic materials after World War II, Mr. Kukkapuro made abundant use of fiberglass and other plastics, which could be sculpted to the human form. He also favored organic materials like steam-bent plywood and leather.Referring to Mr. Kukkapuro’s relentless pursuit of ergonomics, Jukka Savolainen, a former director of the Design Museum in Helsinki who now heads the Alvar Aalto Museum in Finland, described him as “playful with form and color, but always thinking about the user at the center.”Among Mr. Kukkapuro’s most celebrated designs was Karuselli, a slick fiberglass lounge chair with exuberant leather upholstery rolling over the edges. He attached the bulbous bucket seat to the flowerlike base with a steel bracket that permitted the chair — whose name means “carousel” in Finnish — to both swivel and rock.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
