["https://www.nytimes.com/2025/02/28/us/politics/television-trump-zelensky-ukraine.html"]
title = "Trump Sums Up His Zelensky Showdown: ‘This Is Going to Be Great Television’ - The New York Times"
description = "The ratings are never far from President Trump’s mind."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Trump AdministrationliveUpdatesFeb. 28, 2025, 8:41 p.m. ETTracking Major MovesLawsuits TrackerIs That Legal?Confirmations TrackerAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.‘This Is Going to Be Great Television’: Trump Sums Up His Zelensky ShowdownThe ratings are never far from President Trump’s mind.Share full articlePresident Trump sounded almost excited by the drama of his fiery confrontation with President Volodymyr Zelensky of Ukraine.Credit...Kenny Holston/The New York TimesBy Shawn McCreeshShawn McCreesh is a White House correspondent. He reported from Washington.Feb. 28, 2025Updated 8:38 p.m. ETOne of the most surreal moments of Friday’s Oval Office showdown between President Trump and President Volodymyr Zelensky of Ukraine came at the very end.After all the shouting and the saber-rattling and the lecturing and the pleading and the politicking had ceased, the American president shifted a little in his seat and shared an observation.“This is going to be great television,” he remarked. “I will say that.”It was a conclusion as startling as it was fundamentally Trumpian.This was not a season finale boardroom scene of “The Apprentice” that had just taken place. It was the highest of high-stakes talks — one that could determine the fate of millions, the existence of a sovereign nation and the security of a continent — going wildly off the rails.But for Mr. Trump, one thing that was on his mind, as always, was the ratings. He sounded almost excited by the drama of the spectacle, as though he could feel the front pages of the world’s newspapers being written in real time.This is a man who spent years yelling at people on TV as a way to make a living. He is wired to think about things in terms of “great television.” He is a highly conscious performer. But playacting as a tough guy on NBC on Thursday nights between 9 and 10 p.m. is not the same thing as bossing around an ally before the eyes of the world, even if Mr. Trump uses the same language to describe one performance as he would the other.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
