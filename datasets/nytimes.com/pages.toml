["https://www.nytimes.com/2025/02/27/arts/music/billy-hart-jazz-drummer-just.html"]
title = "Billy Hart Has One Foot in Jazz’s Past and the Other in Its Future - The New York Times"
description = "At 84, the drummer whose discography includes credits on more than 600 albums is releasing another by his long-running quartet."
full_description = 'You have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Billy Hart Has One Foot in Jazz’s Past and the Other in Its FutureAt 84, the drummer whose discography includes credits on more than 600 albums is releasing another by his long-running quartet.Skip to contentSkip to site indexBilly Hart Has One Foot in Jazz’s Past and the Other in Its FutureAt 84, the drummer whose discography includes credits on more than 600 albums is releasing another by his long-running quartet.Credit...Supported bySKIP ADVERTISEMENTListen to this article · 7:35 min Learn moreShare full articleBy Hank ShteamerFeb. 27, 2025Onstage at Smoke in late January, the all-star septet the Cookers were surging into high gear. The catalyst: their drummer, Billy Hart, who stirred up rhythmic eddies and punched out stinging cymbal accents while fixing the saxophonist Azar Lawrence with an eager, heat-of-battle grin.On “Just,” a new album by Hart’s own long-running quartet, out Friday, he reveals some of that intensity in a more understated guise, playing alongside vanguard musicians a quarter century or more younger — the saxophonist Mark Turner, the pianist Ethan Iverson and the bassist Ben Street — and pulling off what has become, across his six-decade-plus career, a trademark Billy Hart feat: sounding effortlessly and perpetually contemporary.“He’s a continual, consummate student of the music,” Turner said of Hart, 84, in a phone interview. While Hart’s style draws on the many eras in which he has been active, he continued, “he hasn’t changed his language into something that is based in a period.”The bassist Buster Williams has worked with Hart since the early ’60s, first meeting him on a gig with the vocalist Betty Carter and later aligning with him in many other contexts, including the Mwandishi band, Herbie Hancock’s trailblazing electric-jazz sextet of the early ’70s. “He’s got that fresh understanding of things,” Williams said in a phone interview. “His vision is always looking forward.”ImageCould the young Billy Hart, growing up in Washington, D.C., have envisioned such a long and thriving career? “Of course not,” he said with an incredulous laugh.Credit...Vincent Tullo for The New York TimesOutside the jazz world, Hart is largely unknown. But within the genre — where peers and fans refer to him as Jabali, or “rock,” one of the Swahili monikers bestowed on the members of the Mwandishi band by their associate James Mtume — his esteem is near-universal, a status reflected in a 2022 National Endowment for the Arts Jazz Master designation and his staggeringly broad discography, encompassing more than 600 albums.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
