["https://www.nytimes.com/2025/02/15/us/politics/trump-saves-country-quote.html"]
title = "Trump Suggests No Laws Are Broken if He’s ‘Saving His Country’ - The New York Times"
description = "President Trump shared a quotation on social media, making it clear it was one he wanted people to absorb: “He who saves his Country does not violate any Law.”"
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Trump AdministrationliveUpdatesFeb. 16, 2025, 3:04 p.m. ETTracking the Major MovesLawsuits TrackerFederal Worker CutsConfirmations TrackerAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Trump Suggests No Laws Are Broken if He’s ‘Saving His Country’President Trump shared a quotation on social media, making it clear it was one he wanted people to absorb: “He who saves his Country does not violate any Law.”Share full article“He who saves his Country does not violate any Law,” Mr. Trump wrote, first on his social media platform Truth Social, and then on the website X.Credit...Al Drago for The New York TimesBy Maggie HabermanCharlie Savage and Jonathan SwanFeb. 15, 2025President Trump on Saturday posted on social media a single sentence that appears to encapsulate his attitude as he tests the nation’s legal and constitutional boundaries in the process of upending the federal government and punishing his perceived enemies.“He who saves his Country does not violate any Law,” Mr. Trump wrote, first on his social media platform Truth Social, and then on the website X.By late afternoon, Mr. Trump had pinned the statement to the top of his Truth Social feed, making it clear it was not a passing thought but one he wanted people to absorb. The official White House account on X posted his message in the evening.The quote is a variation of one sometimes attributed to Napoleon Bonaparte, although its origin is unclear.Nonetheless, the sentiment was familiar: Mr. Trump, through his words and actions, has repeatedly suggested that surviving two assassination attempts is evidence that he has divine backing to enforce his will.He has brought a far more aggressive attitude toward his use of power to the White House in his second term than he did at the start of his first. The powers of the presidency that he returned to were bolstered by last year’s Supreme Court ruling that he is presumptively immune from prosecution for any crimes he may commit using his official powers.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
