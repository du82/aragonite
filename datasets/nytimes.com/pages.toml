title = "Beloved Pink House on Massachusetts Coast to Be Demolished - The New York Times"
description = "Gov. Maura Healey, lamenting the decision, called the house “a special part of the history, culture and fabric” of the coastal region north of Boston."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTDespite Efforts to Save It, a Beloved Pink House in Massachusetts Will Be RazedGov. Maura Healey, lamenting the decision, called the house “a special part of the history, culture and fabric” of the coastal region north of Boston.Listen to this article · 3:45 min Learn moreShare full articleGov. Maura Healey had intervened to try and save the house last fall, hours before it was to be demolished.Credit...Sophie Park for The New York TimesBy Jenna RussellFeb. 28, 2025, 7:17 p.m. ETA battered pink house on the coast of Massachusetts, beloved by generations of artists and romantics, will be torn down by the federal government in March, ending a yearslong fight to save it.The U.S. Fish and Wildlife Service, which owns the house, confirmed the plan on Friday. It came four months after Gov. Maura Healey intervened to try and save the house last fall, hours before it was to be demolished. Talks between state and federal officials followed, but no plan emerged to preserve the home in Newbury, Mass.In a statement, Fish and Wildlife said the demolition would take place by March 31. The house sits at the edge of a wildlife refuge, and the timing, the statement said, is meant “to coincide with the return of an estimated 300 migratory bird species” to the refuge for the spring and summer.“After a thorough and collaborative effort among all parties, relocation of the structure ultimately could not be accomplished,” the statement said. “The building is currently in a deteriorated state and poses risks to refuge staff, wildlife and the adjacent salt marsh.”The federal agency acquired the structure, known as the Pink House, in 2011, when it bought nine surrounding acres from the home’s last private owner. Fish and Wildlife officials previously said that the 99-year-old house had attracted vandals and required costly upkeep, sitting in an active flood zone.Ms. Healey lamented the decision in a statement on Friday, calling the house “a beloved fixture” and “a special part of the history, culture and fabric” of the coastal region north of Boston.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
