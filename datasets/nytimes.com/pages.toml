description = "When the former team doctor for Penn State football sued for wrongful termination, the case offered a rare look into coaches interfering with medical advice."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTThe Power Struggle Over a College Athlete’s Medical Well-BeingWhen the former team doctor for Penn State football sued for wrongful termination, the case offered a rare look into coaches interfering with medical advice.Listen to this article · 10:05 min Learn moreShare full articleLast year a Pennsylvania jury awarded Dr. Scott Lynch $5.25 million in damages for wrongful termination. The trial offered a rare glimpse into how a high-profile college football team handled decisions around athletes’ injuries.Credit...Michelle Gustafson for The New York TimesBy Billy WitzFeb. 16, 2025, 3:00 a.m. ETEarly in the 2014 football season, a Nike representative entered the Penn State athletic trainer’s office and confronted the football team’s two doctors and head trainer.The representative ran down a list of players, including the star quarterback, whose socks and shoes had recently been taped over to help stabilize previous injuries. The tape covered the Nike swoosh, and the representative wanted it stopped, court testimony showed.Soon, the coach, James Franklin, began to interfere, requiring the trainer to provide a list of players who needed their ankles taped over their shoes, along with an explanation. The episode was just one instance that troubled Scott Lynch, the head team doctor, who had begun to feel that in the face of pressure from the coach and administrators, he was the only line of defense for the athletes. He complained to supervisors about the coach’s meddling with medical decisions. Ultimately, Dr. Lynch was removed from his position. Then he sued.Last year a Pennsylvania jury awarded Dr. Lynch $5.25 million in damages for wrongful termination. The trial offered a rare glimpse into how a high-profile college football team handled decisions around injuries — and revealed the pressure on trainers and doctors to greenlight students to get back on the field, despite reservations.ImagePenn State’s head coach, James Franklin, leading his team onto the field before the Orange Bowl College Football Playoff semifinal game this month. Credit...Lynne Sladky/Associated Press“College sports are broken, and I think they’re beyond repair,” Dr. Lynch said in an interview. “There’s way too much money that’s getting in the way of people making good decisions. Nobody’s protecting the athletes.”<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
