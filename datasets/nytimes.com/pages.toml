title = "Opinion | Kennedy’s Anti-Vaccine Views Don’t Represent America - The New York Times"
description = "Threatening vaccine access is not only bad science, it’s bad politics."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest EssaySorry, Mr. Kennedy, Most Americans Want to Get Their ShotsFeb. 16, 2025, 9:00 a.m. ETCredit...Matt Rourke/Associated PressListen to this article · 4:41 min Learn moreShare full articleBy Caitlin RiversDr. Rivers is an epidemiologist at the Johns Hopkins Bloomberg School of Public Health and the author of “Crisis Averted: The Hidden Science of Fighting Outbreaks.”There is very little that Americans can agree on these days. Half of people report that religion is very important to them, while more than a quarter say it’s not. Just under half of parents are satisfied with the quality of their children’s education, while the other half are not. Even sports, often considered America’s pastime, draw the interest of only a little over one third of Americans.But one thing nearly everyone agrees on? Vaccines are good.This simple fact has been overshadowed by fears about what will happen to vaccine policy under Robert F. Kennedy Jr., the new secretary of health and human services. Mr. Kennedy has a long history of vaccine skepticism, and critics fear his leadership could lead to interference with vaccine programs or even withdrawal of vaccines from the market. Such moves are already roiling some state health programs. In Louisiana, the Health Department will “no longer promote mass vaccination,” instead leaving vaccine education to medical providers.What has been overlooked in discussions about Mr. Kennedy’s future agenda is one key fact: Vaccines remain enormously popular. Given this broad support, politicians should think twice about targeting something so widely valued.Recent reports in the news media and medical journals highlight a decline in the proportion of kindergartners who have received the measles, mumps, rubella shot. In the last five years, national coverage has fallen to 93 percent, from 95 percent, and in some states like Idaho, it is as low as 80 percent. But while these numbers fall short of the national goal of 95 percent required to maintain herd immunity for measles, they remain a resounding show of confidence.This confidence extends not just to the M.M.R. vaccine. Some 92 percent of American children received the polio vaccine by age 2, and more than 90 percent were vaccinated against hepatitis B. And it’s not just because of school requirements. Nearly nine in 10 Americans — including 86 percent of Republicans — say the benefits of childhood vaccines outweigh the risks.Unlike children, who typically have regular checkups and managed vaccination schedules through their pediatricians, many adults don’t have a doctor checking in with them on immunization. Yet nearly eight in 10 adults have still received at least one Covid-19 vaccination. Four in 10 get the annual flu vaccine, which prevents severe illness but not infection. That number rises to 70 percent among older adults, the population most at risk. While there is room for improvement, these numbers are solid indicators that vaccines are in good standing.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
