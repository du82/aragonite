full_description = '''AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTSubmit Your Crossword Puzzles to The New York TimesThe New York Times looks for intelligent, literate, entertaining and well-crafted crosswords that appeal to the broad range of Times solvers.Share full articleJan. 3, 2025Puzzle Submission GuidelinesSubmission Guidelines Technical SpecsPuzzle Submission FormSubmissions are open.A New York Times crossword will be a collaboration between you and our staff of editors, who will seek to preserve your voice while making the puzzle as enjoyable as possible for solvers. This page of guidelines is a living document and reflects our current best practices on crossword construction.A summary of what we look for:Lively fill, with words, phrases and names that solvers know or can infer from the crossings.Original, on-target clues, pitched at the puzzle’s intended difficulty level, including a variety of cultural reference points.No more than three puzzles pending at a time.What we could use more of: Thursday and Sunday puzzles that don’t involve a rebus.Submission Guidelines ThemesThemes should be fresh, interesting, narrowly defined and consistently applied throughout the puzzle. For example, if the theme includes a particular kind of pun, then all the puns should be of that kind. Themes and theme entries should be accessible to everyone. We generally prefer puzzles with playful themes rather than straightforward subjects.FillConstructors should emphasize lively words, well-known names and fresh phrases. Common words that lend themselves to interesting and imaginative cluing angles are encouraged.Diversity in cultural references — for age, gender, ethnicity, etc. — is desired.Avoid offensive language. Be mindful of words that might impact solvers negatively. Non-English words are allowed, so long as they are familiar or inferable to people who don’t speak the language.Avoid uncommon abbreviations and partial phrases longer than five letters (“So ___” for BE IT would be permissible, while “So ___” for IT GOES would not.) window.registerInteractive && window.registerInteractive("100000008004147"); if (!window.Promise || !window.fetch || !window.URL) { document.write('<script src="https://static01.nyt.com/newsgraphics/2021/09/27/xwd-submission-payment/20d4a684e0397563ff4bb63ae307c79e61c2d38b/polyfills.js"><\/script>'); } (function() { window.NYTG = window.NYTG || {}; window.NYTG.ASSETS = "https://static01.nyt.com/newsgraphics/2021/09/27/xwd-submission-payment/20d4a684e0397563ff4bb63ae307c79e61c2d38b/".slice(0, -1); window.NYTG.BIG_ASSETS = "https://static01.nyt.com/newsgraphics/2021/09/27/xwd-submission-payment/assets/".slice(0, -1); var supports_import = false; var can_use_import = location.hostname.indexOf('preview.n' + 'yt.net') == -1; var shimport_url = window.NYTG.ASSETS + "/shimport@1.0.1.js"; var shimport_promise; try { new Function("if(0)import('')")(); supports_import = true; } catch(e) { } if (!can_use_import || !supports_import) { shimport_promise = new Promise(function(fulfil, reject) { var s = document.createElement("script"); s.src = shimport_url; s.onload = function() { fulfil(__shimport__); }; s.onerror = reject; document.head.appendChild(s); }); } window.NYTG.load = function(module) { var url = new URL(module, location.href).href; if (can_use_import && supports_import) { return eval("import('" + url + "')"); } else { return shimport_promise.then(function(shimport) { return shimport.load(url); }); } }; // for --live window.NYTG.subscribers = {}; window.NYTG.watch = function(url, cb) { if (!window.NYTG.subscribers[url]) window.NYTG.subscribers[url] = []; window.NYTG.subscribers[url].push(cb); window.NYTG.load(url).then(cb); }; }()); (function() { // Check for template type: standard, minimal, or blank var templateType = "template-" + ("" || "standard"); // 