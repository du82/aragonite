["https://www.nytimes.com/2025/02/28/opinion/elon-musk-south-africa.html"]
title = "Opinion | Elon Musk Is South African. We Shouldn’t Forget It. - The New York Times"
description = "His worldview is inseparable from his rearing in apartheid South Africa."
full_description = 'AdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.OpinionSupported bySKIP ADVERTISEMENTGuest EssayElon Musk Is South African. We Shouldn’t Forget It.Feb. 28, 2025Credit...Photo illustration by The New York Times. Source photograph by Eric Lee/The New York TimesListen to this article · 7:39 min Learn moreShare full articleBy William ShokiMr. Shoki is a journalist and the editor of the Africa Is a Country website. He wrote from Cape Town.Elon Musk is everywhere.He is firing federal employees, gaining access to important government data, popping into the Oval Office, appearing on Fox News alongside President Trump and even attending a White House cabinet meeting. For some, his rampage through the institutions of the American state augurs a replacement by private interests; for others, it amounts to a Big Tech takeover. For many looking on, it’s above all a baffling bromance at the heart of power. However one understands Mr. Musk’s role in the Trump administration, it has cemented his reputation as one of the most powerful people on the planet.But discussion of Mr. Musk, especially in the United States, often misses something: He is a white South African, part of a demographic that for centuries sat atop a racial hierarchy maintained by violent colonial rule. That history matters. For all the attempts to describe Mr. Musk as a self-made genius or a dispassionate technocrat, he is in fact a distinctly ideological figure, one whose worldview is inseparable from his rearing in apartheid South Africa. More than just an eccentric billionaire, Mr. Musk represents an unresolved question: What happens when settler rule fails but settlers remain? That’s what is playing out in America today.Born in Pretoria in 1971, Mr. Musk had an upbringing typical of the white South African elite. The family was wealthy, despite his parents divorcing when he was young, its economic standing shaped by a system designed to assist whites. Mr. Musk doesn’t appear to have enjoyed his private education — there are stories of bullying and loneliness — but he still benefited from the advantages it conferred. Though his father, an engineer, was for a time a member of the anti-apartheid Progressive Party, there is little evidence Mr. Musk inherited his political convictions. Like many white South Africans, Mr. Musk left the country before the collapse of racial rule, settling in Canada, where his mother was born, in 1989.He never returned, but South Africa clearly stayed with him. Take his recent intervention into the debate over the country’s land reform as an example. In response to a bill passed in January that allows in specific circumstances the expropriation of land without compensation, Mr. Musk used his platform to suggest that white South Africans are uniquely persecuted. Never mind that land restitution is a broadly accepted norm in post-colonial societies or that eminent domain or compulsory purchase laws do something similar in the United States and elsewhere. The Trump administration — amplifying fringe voices, promoting distorted narratives of racial victimhood and using Mr. Musk’s claim as a symbolic cudgel — was only too happy to play along.Mr. Musk’s role in the controversy suggests he has not so much moved beyond the logic of apartheid as absorbed it. His ideological commitments — deregulated markets, hostility to labor organizing and Trumpist nationalism — bear its trace. In effect, his politics reprise apartheid’s economic principles on a global scale: maintaining zones of privilege under the guise of “free enterprise” while resisting any moves toward redistribution as threats. You can hear it in his exhortations for others to work harder and his pleas for him and his businesses to receive special treatment.Mr. Musk is one of a number of reactionary figures with roots in Southern Africa who found an unlikely home in Silicon Valley and now wield disproportionate influence in shaping American and global right-wing politics. These men, such as Peter Thiel and David Sacks, emerged from a historical tradition that revered hierarchy and sought to sustain racial and economic dominance, only to find themselves in a world where that order was unraveling. Their politics reflect an instinct to preserve elite rule, cloaked in the language of meritocracy and market freedom, while channeling resentment toward new power structures they view as threats to their position.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
