title = "Left Out of Ukraine Talks, Europe Races to Organize a Response - The New York Times"
description = "The Trump administration’s push for direct negotiations with Russia without Ukraine’s involvement leaves the European allies with no clear role."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Russia-Ukraine WarPhotosWarming U.S.-Russia RelationsUkraine’s BordersWhy Ukraine Isn’t In NATOProtecting Ukraine’s SecurityAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTLeft Out of Ukraine Talks, Europe Races to Organize a ResponseThe Trump administration’s push for direct negotiations with Russia without Ukraine’s involvement leaves the European allies with no clear role.Listen to this article · 7:30 min Learn moreShare full articleSecretary of State Marco Rubio has been involved in a flurry of diplomatic discussions in recent days, including with Russia’s foreign minister.Credit...Sean Gallup/Getty ImagesBy Andrew E. KramerReporting from Kyiv, UkraineFeb. 16, 2025Updated 1:24 p.m. ETWhile American officials prepared on Sunday for the start of talks with Russia over ending the war in Ukraine, European leaders were rushing to formulate a response to President Trump’s push for a settlement that appeared to leave them and Kyiv with no clear role in the process.The Russian ambassador to Saudi Arabia, where the talks are set to take place this week, met Sunday with the kingdom’s foreign minister. Two senior Trump administration officials — the national security adviser, Mike Waltz, and the Middle East envoy, Steve Witkoff — will fly to Saudi Arabia to join Secretary of State Marco Rubio for the negotiations, Mr. Witkoff said Sunday in an interview with Fox News.The final preparations follow a flurry of diplomatic discussions over the past several days that included a conversation between Mr. Rubio and Russia’s foreign minister, Sergey V. Lavrov.On Sunday, Mr. Rubio said in an interview from Jerusalem with CBS News that if an opportunity presented itself “for a broader conversation that would involve Ukraine, that would involve the end of the war, that would involve our allies all over the world, particularly in Europe, we’re going to explore it if that opportunity presents itself.”The meeting with Russia, while preliminary, would signal the start of Mr. Trump’s accelerated timetable for a deal and his seeming determination to conduct negotiations with Russia alone, at least for now.Ukraine will not take part, Andriy Yermak, the head of the President Volodymyr Zelensky’s presidential office, confirmed Sunday in a post on the Telegram social networking site. He said that Ukraine would prefer to reach a common plan for negotiations with the Trump administration before meeting with a Russian delegation.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
