title = "She’s Trying to Stay Ahead of Alzheimer’s, in a Race to the Death - The New York Times"
description = "In the Netherlands, doctors and dementia patients must negotiate a fine line: Assisted death for those without capacity is legal, but doctors won’t do it."
full_description = 'You have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Irene Mekel, who seeks medical assistance in dying, was diagnosed with Alzheimer’s disease a year ago.Credit...Melissa Schriek for The New York TimesShe’s Trying to Stay Ahead of Alzheimer’s, in a Race to the DeathIn the Netherlands, doctors and dementia patients must negotiate a fine line: Assisted death for those without capacity is legal, but doctors won’t do it.Irene Mekel, who seeks medical assistance in dying, was diagnosed with Alzheimer’s disease a year ago.Credit...Melissa Schriek for The New York TimesSupported bySKIP ADVERTISEMENTShare full article295295By Stephanie NolenStephanie Nolen is examining medically assisted death around the world. She reported this article from Amsterdam, Groningen and Castricum, the Netherlands.Feb. 16, 2025Updated 11:16 a.m. ETSoon, Irene Mekel will need to pick the day she dies.She’s not in any hurry: She quite likes her life, in a trim, airy house in Castricum, a Dutch village by the sea. She has flowers growing in her back garden, and there is a street market nearby where vendors greet villagers by name. But if her life is going to end the way she wants, she will have to pick a date, sooner than she might like.Listen to this article with reporter commentary{"@context":"https://schema.org","@type":"AudioObject","@id":"https://static.nytimes.com/podcasts/2025/02/14/science/16death-netherlands-audio/xx-death-netherlands-FINAL-MIX-v1-jy.mp3","description":"","name":"Listen to this article with reporter commentary","contentUrl":"https://static.nytimes.com/podcasts/2025/02/14/science/16death-netherlands-audio/xx-death-netherlands-FINAL-MIX-v1-jy.mp3","uploadDate":"2025-02-14T23:29:57.254Z","duration":"PT1.474S"}“It’s a tragedy,” she said.Ms. Mekel, 82, has Alzheimer’s disease. It was diagnosed a year ago. She knows her cognitive function is slowly declining, and she knows what is coming. She spent years working as a nurse, and she cared for her sister, who had vascular dementia. For now, she is managing, with help from her three children and a big screen in the corner of the living room that they update remotely to remind her of the date and any appointments.In the not-so-distant future, it will no longer be safe for her to stay at home alone. She had a bad fall and broke her elbow in August. She does not feel she can live with her children, who are busy with careers and children of their own. She is determined that she will never move to a nursing home, which she considers an intolerable loss of dignity. As a Dutch citizen, she is entitled by law to request that a doctor help her end her life when she reaches a point of unbearable suffering. And so she has applied for a medically assisted death.In 2023, shortly before her diagnosis, Ms. Mekel joined a workshop organized by the Dutch Association for Voluntary End of Life. There, she learned how to draft an advance request document that would lay out her wishes, including the conditions under which she would request what is called euthanasia in the Netherlands. She decided it would be when she could not recognize her children and grandchildren, hold a conversation or live in her own home.But when Ms. Mekel’s family doctor read the advance directive, she said that while she supported euthanasia, she could not provide it. She will not do it for someone who has by definition lost the capacity to consent.<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
