title = "Putin Has Long Wanted More Power in Europe. Trump Could Grant It. - The New York Times"
description = "Remarks by Vice President JD Vance and Defense Secretary Pete Hegseth are fueling concerns that the U.S. will move away from Europe and align with Moscow."
full_description = '#masthead-section-label, #masthead-bar-one { display: none }Trump AdministrationliveUpdatesFeb. 16, 2025, 2:35 p.m. ETTracking the Major MovesLawsuits TrackerFederal Worker CutsConfirmations TrackerAdvertisementSKIP ADVERTISEMENTYou have a preview view of this article while we are checking your access. When we have confirmed access, the full article content will load.Supported bySKIP ADVERTISEMENTPutin Has Long Wanted More Power in Europe. Trump Could Grant It.Remarks by Vice President JD Vance and Defense Secretary Pete Hegseth are fueling concerns that the U.S. will move away from Europe and align with Moscow.Listen to this article · 7:47 min Learn moreShare full article1k1015President Vladimir V. Putin of Russia in Togliatti, Russia, last month, in a photo released by the Russian state media.Credit...Vyacheslav Prokofyev/Sputnik, via ReutersBy Paul SonneReporting from BerlinFeb. 16, 2025Updated 10:50 a.m. ETPresident Vladimir V. Putin of Russia shocked the audience at the annual security conference in Munich in 2007 by demanding the rollback of domineering American influence and a new balance of power in Europe more suitable to Moscow.He didn’t get what he wanted — then.Nearly two decades later, during the very same conference, top officials from President Trump’s cabinet made one thing clear: Mr. Putin has found an American administration that might help him realize his dream.Comments by Defense Secretary Pete Hegseth and Vice President JD Vance raised fears among attendees that under the new administration the United States. might align with Russia and either assail Europe or abandon it altogether.Such a shift, analysts say, would give Mr. Putin a previously unthinkable victory far more momentous for him than any objectives in Ukraine.“Since the dawn of the Cold War in the late 1940s, the Kremlin has dreamed of pushing America out of its role as the cornerstone of European security,” said Andrew S. Weiss, vice president for studies at the Carnegie Endowment for International Peace. “Putin surely is savvy enough to pounce on any openings provided by the new administration.”ImageVice President JD Vance at the Munich Security Conference on Friday. His speech there signaled that the U.S. may be more open to partnering with Russia than with the European nations that have traditionally been its allies.Credit...Thomas Kienzle/Agence France-Presse — Getty Images<div class="css-7axq9l" data-testid="optimistic-truncator-noscript"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="css-1b5b8u1"><path fill="currentColor" fill-rule="evenodd" d="M2.5 12a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Zm8.5 1.75v-7.5h2v7.5h-2Zm0 2v2h2v-2h-2Z" clip-rule="evenodd"></path></svg><div data-testid="optimistic-truncator-noscript-message" class="css-6yo1no"><p class="css-3kpklk">We are having trouble retrieving the article content.</p><p class="css-3kpklk">Please enable JavaScript in your browser settings.</p></div></div>Thank you for your patience while we verify access. If you are in Reader mode please exit and log into your Times account, or subscribe for all of The Times.Thank you for your patience while we verify access.Already a subscriber? Log in.Want all of The Times? Subscribe.AdvertisementSKIP ADVERTISEMENT'
