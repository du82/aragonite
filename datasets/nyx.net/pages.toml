["https://nyx.net/philos.html"]
title = "Nyx - Philosophy"
full_description = '''Every public system has a philosophy behind it, I believe, so it behooves me to write up what the philosophy of Nyx is. Just in case you were wondering. :-) I am convinced that electronic media will one day be as common as the telephone and newpaper are now. Everyone will ultimately have an e-mail address, I envision, as well as all people/organizations users will want to contact: Companies, government officials, government agencies, newspapers, etc. Furthermore, I believe that electronic access is a *necessity*, not a luxury. If it is treated as a luxury, as most information providers do, then the cost will continue to be exorbitant; this will no doubt lead to a polarization of society into the information rich and poor. My vision is that everyone, financially rich or poor, should have equal access to electronic communication and data. As part of the process of this happening, there will be systems along the way that define _how_ those everyday interactions will take place, how they will "feel", what facilities will be available, how much they will cost, etc. Now, I don't mean "character based" vs. "graphics", or other user interface issues. Indeed, if I could easily provide a mouse-based point-and-shoot shell for Nyx, I would -- but I'll leave the interface issues to Prodigy and so on. User interfaces are not directly relevant to philosophy. I view the Prodigy's and Compuserve's of the world as setting one kind of tone for the future, and I'm not sure I like it *at all*: Prodigy is too concerned with offending anyone so they censor anything remotely offensive. I believe in free speech, and the anarchy of netnews, and cringe at this. I believe in letting users say what they want and policing themselves, rather than a central authority determining what is acceptable and what not. Much like people would treat a note posted on a cork-and-pushpin bulletin board. I'm also shocked that Prodigy charges a fee for more than 30 mail messages a month -- Heck, I send about 30 a day! And I'd like to see that opportunity freely available to all.'''
