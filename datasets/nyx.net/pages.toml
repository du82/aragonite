["https://nyx.net/history1997.html"]
title = "Nyx History: Part II"
full_description = '''With Andrew Burt leaving the University of Denver with a shiny new Phd and a new department chairman coming in, the University decided that it was time for Nyx to go. In April 1997, Andrew Burt formed the non-profit corporation "Nyx Net" to take over the operation of Nyx. Initially, Andrew Burt himself was to head the corporation with Marshall Barry also on the Board of Directors. However, after a spat that broke out on nyx.misc, Andrew Burt (as the Incorporator) fired the Board of Directors (who had never met), appointed new Board consisting of Trygve Lode (President) , Mike Beaty (Secretary) and Darlene Cypser (Treasurer), and then resigned as system administrator of Nyx. The new Board struggled over the summer of 1997 with negotiating with DU, writing bylaws for the new corporation, preparing a new site for Nyx (including getting all the phone lines in), appointing new administrators and asundry crises. In late September 1997 the dam finally broke and Nyx Net and DU signed an agreement to transfer Nyx to the non-profit corporation. The agreement transfered the hardware, the name "Nyx" and associated goodwill, and the Nyx operating account to the non-profit corporation, Nyx Net. On September 27, 1997, the network was physically moved from the University of Denver to a site in downtown Denver. A team of Nyx volunteers made this move fast and efficient. The Internet connection was provided under contract by Dimensional, a local isp. With the help of two Nyx volunteers, Alex Hsia and Rick Saltzman (with much system administration experience between them) Nyx was actually set up, reconfigured and back on the Internet in 36 hours. The new administration team of Paul Gregg (System Administrator), Elie Rosenblum (Mail Administrator) and Terry Knab (News Adminstrator) worked hard throughout the fall 1997 and winter 1998 to upgrade Nyx's ancient software. While Trygve struggled to get in some new hardware. In November 1998 Nyx's upstream provider, Dimensional Communications, moved to a new building requiring Nyx to use its own router (borrowed from Dimensional) and a frame relay circuit to reach Dimensional. This required some innovative rewiring by Trygve and Dave Denney of Dimensional. We also received permission from Sun Microsystems to upgrade the OS on the Suns to SunOS 4.1.3 and Alex Hsia began that process. Trygve Lode installed remote rebooting hardware so that someone would not have to run down to downtown Denver every time one of the machines went down.'''
year_published = 2025
clearnet = "https://nyx.net/history1997.html"
