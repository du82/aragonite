["http://www.nyx.net/~board/bylaws.html"]
title = "Bylaws of Nyx Net"
full_description = '''Nyx Net's purpose is to provide free public Internet access for charitable, educational, scientific, literary and other exempt purposes as defined in section 501(c)(3) of the Internal Revenue Code, or the corresponding section of any future tax code. For this purpose, Nyx Net is incorporated as a non-profit corporation under the laws of the State of Colorado. Nyx Net is not a commercial Internet Service Provider and its services are not to be used for the establishment or maintenance of a for-profit business. Nyx Net will have three classes of members: charter members, honorary members, supporting members. Additional classes may be added by amendment of these bylaws. 1. Charter Members -- All natural persons holding validated user accounts in good standing who have donated US$100 or more to Nyx between October 1, 1996 through October 1, 1997 are eligible to be Charter Members of Nyx Net. All charter memberships shall expire on October 1, 2007. 2. Supporting Members -- All natural persons holding validated user accounts in good standing who donate US$100 or more to Nyx in any calendar year are eligible to be Supporting Members of Nyx Net. Supporting memberships shall expire three years from the most recent date that the requirements of membership were satisfied. 3. Honorary Members -- All past and present Directors and Officers of Nyx Net, and past and present members of the Systems Administration Team with validated user accounts in good standing are eligible to be Honorary Members of Nyx Net. The Board of Directors may confer honorary membership on others at the Board's discretion. 5. If an account is terminated for cause, the membership of that user is terminated and may be re-established under paragraph 2 or 3 above. As required by Colorado law (C.R.S. 7-24-109), Nyx Net shall maintain a list of the names and addresses of all members of Nyx Net in the offices of Nyx Net which shall be available for inspection (by appointment) by other members "for any appropriate purpose." Any member not wishing to have their name and address available for inspection by other members may withdraw from membership.'''
