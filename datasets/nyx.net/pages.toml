full_description = '''These FAQs are also posted regularly to Usenet newsgroup rec.food.sourdough which is a fairly active Usenet newsgroup discussing the making of sourdough bread. You can access Usenet newsgroups via Google Groups or via a Usenet Newsreader.) The unc site hot linked above is also an ftp site so it can be reached with your favourite ftp program at: Carl Griffith's 1847 Oregon Trail Sourdough Starter (Carl's Starter) is now distributed from a commemorative web site. Carl's tradition of returning a dried starter to any one who sent him a self-addressed stamped envelope is continued. Sourdough International, Inc. PO Box 993 Cascade, Idaho 83611 FAX (208) 382-3129 (Nine different starters at $US10.50 each. I sent an email note to sourdo@micron.net (Sourdoughs International) and they sent me a brochure about their starters in the mail.) They have a website at; Also, Worldwide Sourdoughs From Your Bread Machine. Donna German and Ed Wood. Published by Bristol Publishing Enterprises, Inc. $8.95 ISBN 1-55867-095-5 There is a mailing list for bread making (not just sourdough). To subscribe to this list (Bread Bakers Digest) send mail to: bread-bakers-request@lists.bread-bakers.com and in the body of the message put: Please let me, darrell.web4 (at) telus.net (Darrell Greenwood), know of any other sites carrying good sourdough information that can be added to this page. Thanks. var site="sm6sourdough" <a href="http://sm6.sitemeter.com/stats.asp?site=sm6sourdough" target="_top"> <img src="http://sm6.sitemeter.com/meter.asp?site=sm6sourdough" alt="Site Meter" border=0></a> var sc_project=1338505; var sc_invisible=0; var sc_partition=12; var sc_security="82d458a6"; <a href="http://www.statcounter.com/" target="_blank"><img src="http://c13.statcounter.com/counter.php?sc_project=1338505&amp;java=0&amp;security=82d458a6&amp;invisible=0" alt="site stats" border="0"></a> _uacct = "UA-6755685-1"; urchinTracker();'''
