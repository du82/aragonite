["https://nyx.net/~gthompso/quine.htm"]
title = "The Quine Page (self-reproducing code)"
description = """
Various examples of self-reproduction of progr
ams"""
full_description = '''One day, several years ago, I came across an article in an old Byte on "self-reproducing programs". I was a curious lad, and looked to see what the article was about. It said, "Listing 1 is a C program which duplicates itself. When the program is run it produces (on the standard output) a file containing an exact copy of its own source code". I was hooked immediately--these guys must be geniuses! I copied the article at once, and tried to figure it out, but I didn't know C at the time. Soon after, I found another article, this one in Creative Computing. It had listings in BASIC, and I was ecstatic. I soon realized that anyone could write self-reproducing programs, and made a few in BASIC, Pascal, and Forth. Later that year I finally got a PC, and quickly forgot about the programs I had written on my old TI-994/A. Then, last year, as I was skimming through the Jargon file, I saw an entry I had not noticed before: :quine: /kwi:n/ /n./ [from the name of the logician Willard van Orman Quine, via Douglas Hofstadter] A program that generates a copy of its own source text as its complete output. Devising the shortest possible quine in some given programming language is a common hackish amusement. Here is one classic quine: "Wow. A 'common hackish amusement'. I've seen the Beer List, and the Hello World page, there must be a Quine Page. I'll have to look around, that should be pretty neat to see what must be hundreds of quines." I was half right. There were hundreds of quines, just no quine page. Admittedly, there were a few attempts, but none had more than ten or so. I had found over fifty by the time I came across any of these pages. Here is (hopefully) the definitive page. You can check out the plain quine section, the self-reproduction variations section, and bibliography. If you've visited before, browse the what's new section. Take a look at the want list of languages I'm specifically looking for. Finally, you can browse a list of links. ABC Ada Algol APL Assembly Awk BASIC BeFunge BlooP BrainF*** C C++ Objective CAML dBASE Emacs Lisp False Forth Fortran Haskell HP 48 RPL Icon Inform Intercal Interpol J Java More Java Javascript LISP Logo Lpc Lua Miranda ML Modula-2 MUMPS Oberon Pascal Perl More Perl Postscript POV-Ray Prolog Python Rexx Scheme SGML Smalltalk Snack SNOBOL 4 Tcl TeX TSE Unix Shell Vi'''
year_published = 2025
