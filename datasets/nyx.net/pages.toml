["http://nyx.net/newacct.html"]
title = "How to Join Nyx"
full_description = '''Because Nyx offers free services that could be (and have been) abused, we require validation. Validation is free. Because we offer services (such as linux shell access) that can be abused, please either (a) have your filled-in form notarized and include a copy of a signed photo ID, or (b) send a personal check; both are described in more detail below. Photocopy a signed, picture ID of yourself (preferred: driver's license, passport, etc.). Then obtain a NOTARIZED SIGNATURE on the application form (i.e., you sign it in the presence of a Notary Public, who checks your ID). SEE BELOW FOR MORE INFORMATION on this method, how to obtain a notarized signature, what to do in foreign countries, etc. Send a personal check (with YOUR name PRE-PRINTED on it) with a donation to Nyx Net. (We are not accepting credit cards for validation at this time.) If you decide you would like to send a donation as a means to acquire validation, then you should send the donation AND the filled out form (but no notary/photo ID necessary). The check must clear. You will receive your login and password via e-mail or in that self-addressed stamped envelope. Then you can log in. You will find yourself in a validation program explaining what to do from there. We strive to get validations completed within a few days, but in the worst case it may take 6-8 weeks for your account to be approved, depending on free time of the volunteers, etc. If you haven't heard back after, say, THREE WEEKS from when you started, contact us to ask what's up. DO NOT give out your e-mail address prior to receiving full access (because you won't be able to read it until you're validated). In the United States, you can find a Notary in many places: most banks offer this service to customers for free, many post offices, most large businesses have employees who are notaries. In other countries, the procedure may differ; ask at a bank, courthouse, police station, or other legal institution about some form of "guaranteed signature". A U.S. Embassy or similar office should be able to do it.'''
year_published = 2025
