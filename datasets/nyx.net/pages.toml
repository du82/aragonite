["http://nyx.net/faq.html"]
title = "Nyx Net FAQ"
full_description = '''** If you have a question that's not on this list, use 'fb' (feedback) on the main menu to ask (which posts it to the nyx.help newsgroup). If that fails, send email to 'support'. Common problems include creating an account but not being able to log in because of a "time out" -- this means Nyx is rather busy -- try using that login/password later. Another common problem is when the 'new' program says it can't find a suitable login name; this usually means you or your communications program sent extra characters to one of the questions and it got your name messed up. Note, for instance, the yes/no questions require only 'y' or 'n' and no carriage return; under some (not fully understood) circumstances this can cause this error. Please do NOT use anything other than letters in the name. See the "authorization" form in the val menu, 'a' option or 'ac' option. It requires EITHER that you visit someone in person, OR that you mail a *notarized* copy of the form with a photocopy of a picture id or a *personal* check written out to Nyx Net. Probably not. Since we are all volunteers we get behind some times. If it has been more than 4 weeks, please send feedback (fb) to support. It is your responsibility to remember you password. You cannot get the "old" account back if you have forgotten your password. Resetting passwords is time consuming and a potential security problem. The Nyx administrators will not do it. 1. First try all the old passwords you can think of. Try variations on those old passwords. Maybe you had a ! rather than a *. Remember that Nyx ignores all characters after the first 8 characters. 2. If you still cannot figure out the password, you can get a new account validated off the old one. To do this log in as 'new', create a new account, do a revalidation from that account. You can do the revalidation either on-line or by submitting new validation materials. Always change your password (and user information) on nyx itself. nyx10 copies nyx's password file each night so if you only perform any changes on nyx10 they will be wiped out by the next morning.'''
year_published = 2025
clearnet = "http://nyx.net/faq.html"
