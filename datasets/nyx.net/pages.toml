["https://nyx.net/history.html"]
title = "Nyx History"
full_description = '''Nyx was originally founded by Andrew Burt at the University of Denver in Denver, Colorado. The first part of this history was written by Andrew Burt. About 1987, one of DU's deans, Peter Warren, convinced Zimmerman Metals in Denver to donate their aging DEC PDP 11/70 to DU (I believe they replaced it with a Microvax II). It was offered to the Math & Computer Science department. At that time, M&CS had only one departmental system, a Pyramid 90x (named Isis), used for departmental mail, research, etc., so I initially thought the PDP might make a good "toy" system for my operating systems class, so I recommended accepting the 11/70. It arrived, all ten tons of it :-) (So I exaggerated. But the size -- about 20' long, 6' high, 3' deep -- is no joke.) It had: (Via other donations and purchases, this eventually became 3Mb memory and 5 RP06's (4 running, 1 spare).) Initially, the 11/70 hardware was not functional. Don McCarthy, M&CS's operations manager, spent untold hours piecing it back together and making repairs. Eventually, some time in early 1988, it was functional enough to try to load an operating system. I had obtained a tape of Unix, 2.9 BSD from Berkeley, and got that going. (OS geeks will rejoice to hear it was upgraded to 2.10 in January 1989, which was much more like 4.3, whereas 2.9 was based on the older 4.2 -- i.e. Nyx was "state of the art" in software.) I had originally intended to use the system in my Operating Systems class, but by the time the system was operational in late 1988, the OS class had already begun for the year in September, so I felt it would be more interesting to use the 11/70 as a BBS to access Internet content. I wrote a simple menu system in a few hours, one that would be obvious to users, but easy to write menus for. I did the first round in shell script (180 lines of code). A master's degree student, Dinesh Punjabi, was interested in doing a project, so I had him write a C version that strictly emulated the shell script, plus some enhancements I had been planning on. He finished it promptly, about 1000 lines of C. (I have since rewritten large parts, but I preserved his style for continuity.)'''
year_published = 2025
