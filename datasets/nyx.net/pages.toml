["https://nyx.net/cgi-bin/webhost.cgi"]
title = "Nyx web hosting"
full_description = "Nyx, the world's oldest free public-access Internet Service Provider, provides Unix shell accounts, a full, uncensored newsfeed, e-mail (including webmail), web space / web hosting, and even Unix programming and development tools. Dialup access (56k/v.90) is available in the Denver, Colorado local calling area. There is no setup fee or monthly cost required to have a Nyx account, though tax-deductable contributions are always appreciated. Nyx Net is a 501(c)(3) nonprofit organization entirely run by volunteers and supported by donations. Free web hosting is available to validated users with active accounts for your own small business use because of financial need, your own literary/cultural/scientific projects, personal use, or a non-profit entity you are associated with. If you are not yet a validated user, it is free to become one. If you are already a validated user, you may host web sites in one of two ways: Note that Nyx is not a domain name registrar, so you will have to set up the domain with a registrar. (This typically costs on the order of $15-20 a year from services such as GoDaddy; note that discount coupons for such services are often available.) Your existing Nyx login username: (Note that this login must already exist and be validated, as we will send email to this account to confirm the request. Note that the username owning the web files will be publicly visible, so it may not be advisable for anonNNNN users to do this if you don't want ownership to be known.) You specifically affirm that your use of web hosting on Nyx is for either (1) your own personal small business use because of financial need, (2) your own literary/cultural/scientific projects, (3) your own personal use, or (4) a non-profit entity you are associated with."
