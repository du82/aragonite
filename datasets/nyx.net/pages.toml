["https://nyx.net/policies.html"]
title = "Nyx Policies"
full_description = '''Space on Nyx is not inexhaustible (what else is new). This file details what is considered acceptable and unacceptable usage of disk space. It also explains what will happen to your files if you don't follow these guidelines! As stated in the "welcome" mail message, 2 MB is the recommended limit on homedirs. This should be fine for keeping the small amount of configuration files that are typically needed. Web space is limited to 20 MB. Your personal dir is for convenience only. It is NOT meant for you to keep all your worldly files. Nyx is not your personal closet, to store unneeded files. Nyx does have "temporary" file space -- make yourself a directory in /nyx/temp1 by running /nyx/bin/mktemp. An easy way to make and use this directory is to use the 'ct' and 't' options in the 'u'nix file menu. The first creates it (do only once) and 't' moves you to that directory (do before ftp'ing, etc.). [Note: do NOT use /tmp, /usr/tmp, or /nyx/tmp -- User files in there are subject to INSTANT removal (indeed, there is an hourly job that removes files from there). These directories are only to be used by programs like editors, mailers, etc. for their own short-lived temporary files.] Your temporary dir (that you create with the 'mktemp' program) is where you should put large files, such as files you've ftp'd but haven't downloaded yet (just cd there before starting ftp). Users working on projects for Nyx itself (installing new software) can get a dir in /nyx/projects by asking for one. As the name suggests, temporary space is for *temporary* material, not items you want to keep forever. Files in the temp dir are wiped out automatically after a certain number of days. Note that you can find out how much space you use via the 'du' and 'du2' options in the status menu ('du' and 'du -a' commands from the shell). A periodic list of 'pigs' may also be posted. You'll probably get nasty mail if you show up on this list. Read your mail immediately, or at least save it off the mail spool to your own directory. Do NOT send large amounts of data by mail (either sending or receiving). Do not use mail as a replacement for 'ftp'. Do not join mailing list if you aren't going to read it daily.'''
