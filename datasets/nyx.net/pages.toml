["https://nyx.net/history2013.html"]
title = "Nyx History: Part III"
full_description = "In 2013, Trygve had a medical problem, and became unable to work on Nyx. He had to sell his house. Darlene called Andrew, so, Aburt returns. Aburt took back over as President; Blanche Cohen took Darlene's place on the board; and Mike kept on keeping on. Without Trygve's home to live in, Nyx made an emergency move to a friend of Aburt's (since aburt's home didn't have sufficient bandwidth), and, greatly reduced in size (Trygve's basement was filled to the brim with server stuff), the servers lived in another basement for a few years. The servers themselves were getting old and flakey, and aburt's friend was not technical and not especially interested in rebooting servers or trying to fix them, so they were moved yet again, in 2016, this time to the Amazon AWS cloud, where they live today."
