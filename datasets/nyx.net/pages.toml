title = "Nyx"
full_description = "Nyx, the world's oldest Internet Service Provider, is a free public-access ISP that free e-mail, (including webmail), web space, web/domain hosting, a full, uncensored Usenet newsfeed, Linux shell accounts and the usual Unix/linux programming and development tools. There is no setup fee or monthly cost required to have a Nyx account, though tax-deductable contributions are always appreciated. Nyx Net is a 501(c)(3) nonprofit organization entirely run by volunteers and supported by donations. If you buy anything through Amazon, or if you like ebooks, please see our list of sites who share with Nyx. Purchases made this way share a percent with Nyx's fund drive! Nyx can now host free web sites for small businesses who need a hand, literary projects, and non-profit organizations. Read how to sign up."
