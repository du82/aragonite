["http://nyx.net/help.html"]
title = "Nyx Help"
full_description = '''At each prompt of "Choice:" you should pick one of the letters or words found down the left side of the menu. At various places you may find yourself at a prompt of "--More--" or similar -- such as at the bottom of the screen right now. At this prompt you may press the space bar to continue, control-B to go back a screen, or the "q" key to quit reading. To leave the system, type "bye" at the "Choice:" prompt. "x" will exit any menu and return you to the previous menu. "top" or "T" (capital T) will take you to the top (initial) menu. (Note that various *programs* use 'q' to quit, vs. 'x' to exit. Try 'q' first.) To set your terminal type, choose "c" from the "s" (System Status) menu. The initial type is vt100, suitable for many micro communication programs. For extended information about the commands that are run, use the "help" command from any menu; follow it with the option letters of what you're interested in, such as "help f" for help on what choosing option "f" would do. (Note that some options have no help -- just try them!) You can 'batch' menu commands, by separating them with a comma. As in, typing "i,h,x" from the main menu will go into the info menu, read the nyx history, and exit the info menu. Also, you can create menu macros: create a file .mshellmac in your home directory, where you want to put lines like name=commands as in hist=top,i,h,x And execute as #hist (including inside other macros or multi-command lines). To execute a "pure" Unix command you may enter it at the "Choice:" prompt preceded by an exclamation mark, as in "!who". It is NOT recommended that you do this unless you are familiar with Unix. You may learn Unix by choosing the "learn" option from the education menu. You may abandon the use of this menu system and use the standard Unix environment (the "shell") by doing "!csh" ("exit" to return to the menu). If you have any questions or need help, send mail to support ("fb" from the main menu). First, though, see 'faq' (Frequently Asked Questions) on the main menu -- all the common questions are answered there.'''
