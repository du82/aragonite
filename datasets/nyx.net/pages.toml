["http://nyx.net/share.html"]
title = ""
full_description = "To help support our fund drive, several organizations have offered to share a percent of their proceeds with Nyx for purchases made through special links. Namely: Amazon shares 0.5% of sales made through the Amazon Smile link. Visit the page to set up Nyx as your designated charity, then all purchases made through that link will benefit Nyx! (Note that you have to make the purchase through the Amazon Smile link.) Seeing Amazon's great idea, Nyx founder Andrew Burt established a similar program with his ReAnimus Press site— 30% of the proceeds of ebook sales made through these links benefit Nyx. (Each lists a link you can share with others to increase the benefit to Nyx.) A sample of ebook titles is below, or the full catalog is in the ReAnimus Press Store. h3 { background: gray;} “Wondrous... An oral scrapbook of the pioneering days of our video nation”—The New York Times Book Review You Must Remember This: An Oral History of Manhattan from the 1890s to World War II, by Jeff Kisseloff More than just an amazing and inspirational story, more than just a window into what it's like having a #1 hit song and working with music greats like Stevie Wonder, Diana Ross, and Michael Jackson, Charlene's autobiography is also a must-read for anyone considering a career in music. An amazing history of Jeffco. With 2,000 pictures, a must read for everyone living in the Denver area or interested in the history of Colorado and the West! Dr. Bova explores the future effects of science and technology on the human life span. Death will no longer be the inevitable end of life. In this all-encompassing work, Ben Bova explores the subject of light and shows how it has shaped every aspect of our existence. A wonderfully funny mix of Andy Rooney and Garrison Keillor. Biff America poignantly writes what the American people need to know. Through it all, Biff America has a gift for revealing the uplifting realities of modern life and, sometimes, his humor will make you blow beer through your nose."
