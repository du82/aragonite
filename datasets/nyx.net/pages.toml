["http://www.nyx.net/donatemonthly.html"]
title = "Nyx"
full_description = '''Nyx Net is a 501(c)(3) nonprofit. Donations are tax-deductable (and may be matched by your employer). If you like what Nyx offers and want to donate, your donations are immensely appreciated and go toward running and improving Nyx. Donations are purely voluntary, so everything remains completely free. Nyx has flourished this way for a long time on donations, proving that you don't need to charge fees to provide good services (which was what I wanted to demonstrate when I created Nyx, and which I suspect has helped keep Internet access costs from being exorbitant, as they were heading back then). It's similar to the public radio/TV model, but in the "Nyx model" there's no government funding -- and no holding people hostage during fund drives. :) Everything's low key, no pressure. Thank you for your support!'''
