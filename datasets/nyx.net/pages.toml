["https://nyx.net/history2000.html"]
title = "Nyx History: Part III"
full_description = '''The Boulder office proved more convenient than Nyx's previous digs in downtown Denver: not only was there free parking, initially Darlene Cypser lived only a few blocks away. So, for those times when the machines needed kicking, Darlene usually ended up being the one to give them the boot, leading to many phone calls between Nyx's Boulder office and Trygve Lode's Denver home to go over some of the finer points of kicking misbehaving hardware. In July, 1999, Darlene moved to Denver, which made the trip a little longer, but at least the parking was still free. In late August, 1999, Arachne (Nyx's webserver) crashed and was not coming back up. Darlene headed over to Nyx's HQ, hoping to bring Arachne back to life. Meanwhile, one of the remote admins was finishing up a kernel upgrade on Iris (Nyx's news server) and by the time Darlene had arrived, he had tried to reboot it...and it hadn't come back up. Neither Arachne nor Iris would respond to the usual prodding, but while Darlene was trying to get them to come back to life, Nyx's main server, Nyx10, *also* crashed, and crashed hard. Since Nyx's only other login machine mounted most of its drives off Nyx10, and Nyx10 was also handling incoming email, that left very little still running up in Boulder. Trygve was at a housewarming party at the time and ended up spending the party in the host's basement, trying to talk Darlene through getting Nyx's machines back up and running again...without success. Darlene packed up all of Nyx's computers and drive arrays into her car, drove down to the housewarming party, where they transferred the machines of Nyx into Trygve's jeep so he could take them home and set them up there. And so, for the first time, Nyx was moved into Trygve's house, and Darlene got to enjoy the rest of the housewarming party. Simply restoring all of the systems and bringing them back to Boulder probably would have taken about twelve hours. But with everything offline already, it seemed an appropriate time to go through the systems and track down a number of problems and potential problems that had been on the "to fix" list for too long, and to replace every single hard drive involved. In many cases this involved consolidating multiple drives into one, since Nyx was still using several original Quantum Prodrive 105Meg (not Gig, *Meg*) hard drives that had been spinning continuously for nearly ten years.'''
