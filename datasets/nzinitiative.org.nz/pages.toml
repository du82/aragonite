full_description = "There are fantastic opportunities for New Zealand today. With our young and well-educated population, and being geographically positioned in the middle of the fast-growing Pacific region, New Zealand can be one of the rising stars of the 21st century. This is what The New Zealand Initiative is all about. We are the organisation to sketch pathways towards a better future. Our mission is to help create a competitive, open and dynamic economy and a free, prosperous, fair, and cohesive society. As New Zealand’s leading think tank, we work closely with our members, policymakers across the political spectrum, the wider business community, the media, academics and the general public. Our researchers conduct independent research on a wide range of policy issues. From education to economic policy, from poverty to housing, and from local government to immigration, we are injecting new ideas into New Zealand's political debates. We are strictly non-partisan in our work and welcome an open exchange of views and ideas. The results of our research are made available to the public, free of charge, on our website. To find out more about The New Zealand Initiative and our work, subscribe to our newsletter or contact us."
