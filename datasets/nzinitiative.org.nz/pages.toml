full_description = "Podcast: The steady growth of NZ regulation Dr Eric Crampton eric.crampton@nzinitiative.org.nz +64 4 499 0790 View profile Derek Gill 5 February, 2025 In this episode, Eric talks to Derek Gill, an adjunct scholar at Victoria University, about new research conducted with colleagues that tracks the growth of New Zealand's regulatory state from 1908 to 2024, revealing a steady increase in regulation averaging 2.4% annual growth since 2008, regardless of which political party was in power. The research challenges the common narrative about deregulation in the 1980s and shows that New Zealand's regulatory growth mirrors international trends, though more work is needed to fully understand secondary legislation and sector-specific patterns. To listen to our latest podcasts, please subscribe to The New Zealand Initiative podcast on iTunes, Spotify or The Podcast App. The New Zealand Initiative · The steady growth of NZ regulation You can read the paper The Growth in the Size of the NewZealand Statute Book by Derek Gill, Stevie Shipman and Karl Simpson here. Eric and Derek talk about the following graphs in this podcast episode which are available in the the paper linked above:"
