full_description = "Podcast: German lessons for NZ councils: How merging mayor and CEO roles transformed local government Dr Oliver Hartwich oliver.hartwich@nzinitiative.org.nz +64 4 499 0790 View profile Nick Clark nick.clark@nzinitiative.org.nz View profile Oliver Wittke 17 October, 2024 In this episode, Oliver and Nick talk to Oliver Wittke, former mayor of Gelsenkirchen. They discuss a significant local government reform in North Rhine-Westphalia, Germany, that could offer valuable insights for New Zealand's current system. The German state transitioned from a model similar to New Zealand's current setup - with separate mayor and chief executive roles - to a unified, directly elected mayoral position with executive powers, a change that has been widely regarded as successful and could inform potential reforms in New Zealand's local government structure. To listen to our latest podcasts, please subscribe to The New Zealand Initiative podcast on iTunes, Spotify or The Podcast App. The New Zealand Initiative · German lessons for NZ councils: How merging mayor and CEO roles transformed local government"
