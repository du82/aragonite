full_description = "Launch of GDPLive's new Inflation Tracker with Foodstuffs North Island On July 15, Foodstuffs North Island welcomed us to their Auckland headquarters for a high-profile event unveiling GDPLive's latest iteration - the world's first real-time GDP and inflation tracker. Acting Prime Minister Hon David Seymour, Foodstuffs North Island CEO Chris Quin, and Massey University's Professor Christoph Schumacher and Dr Teo Susnjak delivered compelling presentations on the platform's advancements. Read more Dr Oliver Hartwich oliver.hartwich@nzinitiative.org.nz +64 4 499 0790 View profile Professor Christoph Schumacher View profile Event video 23 July, 2024 GDPLive - How are we tracking? Waiting for the release of the official Gross Domestic Product (GDP) figures has become more exciting since I launched GDPLive. It is like watching the lotto draw when the numbers drop, and you keep checking your ticket. Read more Professor Christoph Schumacher View profile Insights Newsletter 13 October, 2023 What’s with this ‘technical recession’? So, we are in a ‘technical recession’. Sounds bad. Read more Professor Christoph Schumacher View profile National Business Review 3 July, 2023 What does Govt being ‘more of a friend than foe’ to RBNZ mean? In my last column, I used a puzzling proverb to show that we can’t simultaneously have low inflation and cheap money. Today, I use the equally puzzling comment made by Adrian Orr in the OCR announcement that the government is ‘more of a friend than foe’ to explore the relationship between our government and the Reserve Bank. Read more Professor Christoph Schumacher View profile National Business Review 6 June, 2023 The economic cake: why we can’t both have it and eat it When I started learning English, I didn’t understand the popular idiomatic proverb: “You can’t have your cake and eat it too.” Of course, you can eat your cake if you have one. It’s the whole point of a cake – being eaten. Read more Professor Christoph Schumache