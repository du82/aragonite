full_description = "Submission: Gene Technology Bill Nick Clark nick.clark@nzinitiative.org.nz View profile Submission 17 February, 2025 1. INTRODUCTION AND SUMMARY 1.1 This submission on the Gene Technology Bill is made by The New Zealand Initiative (the Initiative), a Wellington-based think tank supported primarily by major New Zealand businesses. In combination, our members employ more than 150,000 people. 1.2 The Initiative undertakes research that contributes to developing sound public policies in New Zealand. We advocate for the creation of a competitive, open and dynamic economy and a free, prosperous, fair and cohesive society. 1.3 The Initiative's members span the breadth of the New Zealand economy; an enabling and efficient regulatory regime for gene technology is important for economic growth and prosperity. The views expressed in this submission are those of the author rather than the New Zealand Initiative's members. 1.4 The current Hazardous Substances and New Organisms Act 1996 (HSNO Act) is outdated and a significant barrier to innovation and economic growth. The Gene Technology Bill represents a necessary modernisation of New Zealand's regulatory framework for genetic technologies. 1.5 The New Zealand Initiative submits that the Bill should proceed. Submission: Gene Technology Bill Nick Clark nick.clark@nzinitiative.org.nz View profile Submission 17 February, 2025 1. INTRODUCTION AND SUMMARY 1.1 This submission on the Gene Technology Bill is made by The New Zealand Initiative (the Initiative), a Wellington-based think tank supported primarily by major New Zealand businesses. In combination, our members employ more than 150,000 people. 1.2 The Initiative undertakes research that contributes to developing sound public policies in New Zealand. We advocate for the creation of a competitive, open and dynamic economy and a free, prosperous, fair and cohesive society. 1.3 The Initiative's members span the breadth of the New Zealand economy; an enabling and