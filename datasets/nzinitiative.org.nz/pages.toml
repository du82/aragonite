full_description = "Making Local Government Work Nick Clark nick.clark@nzinitiative.org.nz View profile Research Report 10 December, 2024 New Zealand’s local government problems stem from a fundamental flaw that can be fixed, research released today reveals. “We have identified the root cause of council dysfunction: mayors and councillors lack the power to deliver what they promise voters. The real authority lies with unelected officials,” says Nick Clark, Senior Fellow at The New Zealand Initiative. His report “Making Local Government Work” points to successful solutions, including the transformation of local government in the German state of North Rhine-Westphalia, which faced similar problems with the same British-inherited system as New Zealand. “They solved this by giving mayors real authority while maintaining strong checks and balances. Twenty-five years later, their system delivers clear accountability and better outcomes,” Clark explains. “This shows what is possible when we address the democratic void in local government.” The report presents five approaches to reform, from adopting this proven international model to other substantial improvements in democratic oversight. These include giving communities direct votes on major projects and extending Auckland’s successful mayoral office model to other councils. “Every year we delay reform means more dysfunction and more wasteful spending,” Clark adds. “The solutions exist - we just need the political will to implement them.” Click here to download the two-page summary of Making Local Government Work. Nick clark discussed his report with Whakatāne Mayor Victor Luca and Dr Oliver Hartwich on our webinar launch of the report. Watch below. Nick discusses this report with Dr Oliver Hartwich on our podcast. Listen below. The New Zealand Initiative · Making Local Government Work Below is our podcast episode with Nick Clark and Dr Oliver Hartwich talking to Oliver Wittke, former mayor of Gelsenkirchen, who is featured in this report. The New Zealand Initiative · German lessons for NZ councils: How merging mayor and CEO roles transformed local government"
