["https://nzinitiative.org.nz/reports-and-media/opinion/please-maam-can-we-have-some-more-fiscal-largesse"]
title = "Please Ma’am, can we have some more fiscal largesse? | The New Zealand Initiative"
description = """
Budget 2025: Time for more decisive measures                                                                 
                                                            Dr Bryce Wilkinson ONZM                            
                                                                                                                                     Article                                                                            November 22"""
full_description = "Please Ma’am, can we have some more fiscal largesse? Dr Bryce Wilkinson ONZM bryce.wilkinson@nzinitiative.org.nz +64 4 499 0790 View profile Insights Newsletter 29 November, 2024 Last week, eleven New Zealand economists issued a public letter advocating more government spending relative to revenue. That means yet more debt. The belief that more government borrowing lessens recession severity has a long but professionally embarrassing history. The theory that recessions can be due to insufficient (government) spending is widely attributed to English super-star economist John Maynard Keynes (1883-1946). Much more problematic is the unqualified proposition that yet more government deficit-spending will alleviate recession. Economists who espouse this view are commonly called naïve Keynesians. The naïve proposition has repeatedly failed. A significant setback occurred in the late 1970s, when deficit spending, high unemployment and high inflation all persisted in the prosperous oil-importing countries. A more embarrassing setback came in 1981 when 364 UK economists wrote to the Times asserting that the Thatcher government’s monetarist policies would fail. In the event, economic recovery started about the same time as the letter appeared Thatcher’s policies brought inflation down and ended the recession. In New Zealand in 1982, a deficit-spending government cut taxes to buy trade union support for a wage and price freeze. The day the news broke, I encountered a well-known Keynesian economist in the street. Contrary to my expectation, he was pleased and believed the policy would support the slowing economy despite the growing public debt. The result was a public debt crisis in mid-1984, followed by a decade-long struggle to balance government spending and revenue. Three prime ministers and three ministers of finance were ousted along the way. Amidst that struggle, a new government cut spending in 1991. Most of Auckland University’s academic economists signed a public letter proclaiming that this would be self-defeating; it could only ‘worsen the recession’. Embarrassingly for them, June 1991 was the bottom of the recession. The strong economic and employment growth that followed turned fiscal deficits into surpluses. Globally, there are more examples of the failures of such superficial predictions. Context is one of the important missing ingredients. If spiralling debt is seen as a growing threat to stability, interest rates will rise and private spending falter. By credibly committing to decisive corrective action, a government can hope to lift private spending and lending confidence. Government U-turns can wreck credibility. Margaret Thatcher famously retorted: “this lady is not for turning”. The Keynesian economists lost that policy debate."
