full_description = "Submission: Developing an Enduring National Infrastructure Plan Discussion Document Nick Clark nick.clark@nzinitiative.org.nz View profile Submission 10 December, 2024 1. INTRODUCTION AND SUMMARY 1.1 This submission on the National Infrastructure Plan Discussion Document is made by The New Zealand Initiative (the Initiative), a Wellington-based think tank supported primarily by major New Zealand businesses. In combination, our members employ more than 150,000 people. 1.2 The Initiative undertakes research that contributes to developing sound public policies in New Zealand and creating a competitive, open and dynamic economy and a free, prosperous, fair and cohesive society. 1.3 The Initiative's members span the breadth of the New Zealand economy. They value efficient infrastructure planning, funding, and delivery. The views expressed in this submission are those of the author, not those of our members. 1.4 The Initiative considers a National Infrastructure Plan could be helpful if it is focused on addressing systemic challenges. We advise against ‘picking winners’ in the form of specific sectors or individual projects. 1.5 The consultation document correctly identifies many of New Zealand's infrastructure challenges. If a National Infrastructure Plan can help address these issues, it will be worthwhile. 1.6 It is evident that most challenges are with central and local government owned and operated infrastructure. Greater private ownership and involvement is likely to be beneficial. Submission: Developing an Enduring National Infrastructure Plan Discussion Document Nick Clark nick.clark@nzinitiative.org.nz View profile Submission 10 December, 2024 1. INTRODUCTION AND SUMMARY 1.1 This submission on the National Infrastructure Plan Discussion Document is made by The New Zealand Initiative (the Initiative), a Wellington-based think tank supported primarily by major New Zealand businesses. In combination, our members employ more than 150,000 people. 1.2 The Initiative undertakes research that contributes to developing sound public policies in New Zealand and creating a competitive, open and dynamic economy and a free, prosperous, fair and cohesive society. 1.3 The Initiative's members span the breadth of the New Zealand economy. They value efficient infrastructure planning, funding, and delivery. The views expressed in this submission are those of the author, not those of our members. 1.4 The Initiative considers a National Infrastructure Plan could be helpful if it is focused on addressing systemic challenges. We advise against ‘picking winners’ in the form of specific sectors or individual projects. 1.5 The consultation document correctly identifies many of New Zealand's infrastructure challenges. If a National Infrastructure Plan can help address these issues, it will be worthwhile. 1.6 It is evident that most challenges are with central and local government owned and operated infrastructure. Greater private ownership and involvement is likely to be beneficial."
