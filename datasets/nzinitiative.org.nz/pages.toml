full_description = '''Webinar: The Art and Science of Learning Professor Barbara Oakley and Dr Oliver Hartwich 4 March, 2025 Webinar Get ready for a fascinating journey into the art of learning with Professor Barbara Oakley, the brilliant mind behind the popular online course "Learning How to Learn" and New York Times bestselling author, as she joins us as our new Senior Fellow.Over the next 5 months, Barbara will embark on an exciting mission across New Zealand, collaborating directly with Primary and Secondary schools to transform how teachers approach education, particularly in mathematics. But that's not all – she's also launching new groundbreaking MOOCs (Massive Open Online Courses) that tackle critical challenges like harnessing the power of Generative AI in education and conquering the fear of teaching mathematics.Don't miss this rare opportunity to hear from Professor Oakley in a conversation with our Executive Director, Dr Oliver Hartwich. Learn about the remarkable journey that shaped her innovative approaches to learning, and experience first-hand the techniques from her renowned "Learning How to Learn" workshops.Join us for what promises to be an illuminating and inspiring session that could revolutionise how you think about learning and teaching!Date: Tuesday, 4 March 2025 Time: 3:00pm - 4:00pmPlease register for the webinar via this link. Also, submit your question in advance on Slido.com using code #3762639And if you'd like Barb to speak in person for your organisation while she is in New Zealand, please reach out to Lottie Evans, events@nzinitiative.org.nz About the speakers: Professor Barbara Oakley, Senior Fellow, NZ Initiative Barbara is a distinguished engineering professor and creator of "Learning How to Learn" - one of the world's most popular online courses. Beginning her career as a language specialist before transitioning to engineering, she exemplifies the transformative power of lifelong learning she now teaches. A New York Times bestselling author, she combines neuroscience and cognitive psychology to help millions worldwide learn more effectively. Dr Oliver Hartwich, Executive Director, NZ InitiativeBefore joining the Initiative, Oliver was a Research Fellow at the Centre for Independent Studies in Sydney, the Chief Economist at Policy Exchange in London, and an advisor in the UK House of Lords. Oliver holds a Master’s degree in Economics and Business Administration and a PhD in Law from Bochum University in Germany.'''
