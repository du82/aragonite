["https://nzinitiative.org.nz/reports-and-media/submissions/submission-australian-governments-consultation-on-the-proposed-new-digital-competition-regime"]
title = "Submission: Australian Government’s Consultation on the Proposed New Digital Competition Regime | The New Zealand Initiative"
description = """
I. Introduction<br />
<br />
We appreciate the opportunity to comment on the Australian Government’s (“Government”) consultation on the implementation of a new digital competition regime.1<br />
<br />
As we outline in our comments, the Government’s proposal rests on the assumption that there exists a broad global consensus on the need for ex-ante rules for digital platforms.…"""
full_description = "Submission: Australian Government’s Consultation on the Proposed New Digital Competition Regime Dr Oliver Hartwich oliver.hartwich@nzinitiative.org.nz +64 4 499 0790 View profile Dr Eric Crampton eric.crampton@nzinitiative.org.nz +64 4 499 0790 View profile Geoffrey A. Manne, Dirk Auer, R. Ian McEwin and Lazar Radic 14 February, 2025 I. Introduction We appreciate the opportunity to comment on the Australian Government’s (“Government”) consultation on the implementation of a new digital competition regime.1 As we outline in our comments, the Government’s proposal rests on the assumption that there exists a broad global consensus on the need for ex-ante rules for digital platforms. This purported consensus is, however, largely overstated. Australia should not feel pressured to “catch up” with a trend that does not exist. Second, the Government promotes ex-ante digital competition rules as “complementary” to an expanding web of regulatory interventions. In practice, however, each new regulation compounds a broader regulatory overload that threatens to result in net social losses. Third, ex-ante digital competition rules may reflect the European Union’s (“EU”) distinct industrial policies that are not necessarily suited to Australia. The EU may also be willing, for political reasons, to accept tradeoffs that Australians are not. Fourth, the Government’s focus on ad tech is misplaced. Ad tech is not the hub of anticompetitive behaviour that the Government suggests it is. Fifth, the Government should take lessons from the international experience, particularly that of the EU. As we show, the Digital Markets Act (“DMA”) has led to unintended consequences for businesses and consumers alike—reducing functionalities and limiting visibility for smaller players, such as hotels. Finally, and relatedly, the rules and conduct requirements the Government envision 1 Digital Platforms — A Proposed New Digital Competition Regime, AUST. GOV. TREAS. (2 December 2024), https://treasury.gov.au/consultation/c2024-547447 (hereinafter “Proposal Paper”)."
