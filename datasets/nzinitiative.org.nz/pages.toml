full_description = "Shock! Horror! Young people getting drunk at music festivals Panic ensued this week after it was revealed that young people have been going to summer music festivals, listening to music – and in some cases even getting drunk. As a report for RNZ revealed, there has been a crackdown on outdoor festivals all through the summer, with four postponed and another four cancelled outright. Read more Dr James Kierstead james.kierstead@nzinitiative.org.nz 04 499 0790 View profile Insights Newsletter 21 February, 2025 Podcast: The trouble with hate crime laws In this episode, James and Michael talk to Stephanie Martin from the Free Speech Union (and also the New Zealand Initiative) about a Law Commission consultation paper on hate crime legislation. The discussion examines the shift from treating hate as an aggravating factor in sentencing to creating specific hate crime offenses, while exploring philosophical questions about hate motivation and concerns about free speech implications. Read more Dr Michael Johnston michael.johnston@nzinitiative.org.nz 044990790 View profile Dr James Kierstead james.kierstead@nzinitiative.org.nz 04 499 0790 View profile Stephanie Martin stephanie.martin@nzinitiative.org.nz View profile 14 February, 2025 The heterodox hiatus A few years ago, when I was still a classics lecturer, I started to notice a disturbing trend. Scholars were being denounced on Twitter (RIP) for wrongthink. Read more Dr James Kierstead james.kierstead@nzinitiative.org.nz 04 499 0790 View profile Insights Newsletter 7 February, 2025 Hayek's real bastards In Hayek’s Bastards, the distinguished historian Dame Anne Salmond takes issue with Act’s Regulatory Standards Bill, which she sees as the attempt of a fringe party to impose its ideologies and which she thinks would “elevate individual rights and private property above all other considerations in law-making” and thus undermine democracy. Salmond presents the bill as a result, not of the normal processes of democracy, but of a global conspiracy of ‘neo-liberal’ think tanks tracing their lineage to 20th-century thinkers such as Friedrich von Hayek. Read more Dr James Kierstead james.kierstead@nzinitiative.org.nz 04 499 0790 View profile Newsroom 31 January, 2025"
