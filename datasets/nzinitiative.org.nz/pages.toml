In this webinar, we pull back the curtain on how government actually works, based on insider experiences. Dr Tony Burton's new report "Demystifying the State" challenges assumptions about public service motivation and reveals the…'''
full_description = '''Webinar: Demystifying the State - The Human Reality Behind Government Institutions Tony Burton, Andrea Black and Oliver Hartwich 10 September, 2024 Webinar What really goes on inside the machinery of government? Are public servants selfless heroes or self-interested bureaucrats?In this webinar, we pull back the curtain on how government actually works, based on insider experiences. Dr Tony Burton's new report "Demystifying the State" challenges assumptions about public service motivation and reveals the all-too-human realities of hierarchy, disengagement, and lack of accountability in state institutions.Drawing on vivid real-world examples - from policy successes to shocking failures - we will explore: The good, the bad and the ugly of how officials actually behave. Why well-intentioned reforms often fail to improve government performance. Fresh ideas for making government work better for all New Zealanders. Join Dr Tony Burton, former government insider Andrea Black, and Dr Oliver Hartwich for a frank discussion on the true nature of the state - and how we can realistically reform it.Date: Tuesday, 10 September 2024 Time: 2:30pm-3:30pm Please register for the webinar via this link. Also, submit your question in advance on Slido.com using code #131598 About the speakers: Dr Tony Burton, Research Fellow, NZ InitiativeTony acquired a PhD in economics and philosophy from the University of East Anglia researching game theory and choice under uncertainty. After the purity of academic research, he opted for the murky world of policy, first at the UK Ministry of Health, then in New Zealand at the Ministry of Social Development and Treasury.Andrea Black, Senior Ministerial Advisor in the Ardern/Hipkins Government ​Andrea’s career in The Public Service started and ended at Inland Revenue, with a four year stint at Treasury towards the end. She was the Independent Advisor to the Tax Working Group led by Sir Michael Cullen and then the Economist and Policy Director for the New Zealand Council of Trade Unions in 2020. She holds a Masters of Taxation Studies and is a Chartered Accountant Fellow.Dr Oliver Hartwich, Executive Director, NZ InitiativeBefore joining the Initiative, Oliver was a Research Fellow at the Centre for Independent Studies in Sydney, the Chief Economist at Policy Exchange in London, and an advisor in the UK House of Lords. Oliver holds a Master’s degree in Economics and Business Administration and a PhD in Law from Bochum University in Germany.'''
