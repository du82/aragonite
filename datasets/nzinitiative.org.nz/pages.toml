title = "Board  | The New Zealand Initiative"
full_description = "Roger Partridge is chairman and a co-founder of The New Zealand Initiative, and is a senior member of its research team. He led law firm Bell Gully as executive chairman from 2007 to 2014, after 16 years as a commercial litigation partner. Roger was executive director of the Legal Research Foundation, a charitable foundation associated with the University of Auckland, from 2001 to 2009, and was a member of the Council of the New Zealand Law Society, the governing body of the legal profession in New Zealand, from 2011 to 2015. He is a chartered member of the Institute of Directors, a member of the editorial board of the New Zealand Law Review and a member of the Mont Pelerin Society. Barbara Chapman was appointed as Deputy Chair on The New Zealand Initiative's Board of Directors in June 2019. Barbara served as Chief Executive and Managing Director of ASB Bank Limited from 2011 until 2018. Since 1994, she has held several diverse senior executive roles with the Commonwealth Bank Group of companies, having started her career with the Group as Chief Manager Marketing at ASB. Ms Chapman is the Chair of Genesis Energy and an Independent Director of Fletcher Building, IAG and Herald publisher, NZME. She was named the New Zealand Business Leader of the Year in 2017 and made a Companion of the New Zealand Order of Merit in the 2019 New Years Honours Roll for services to business. Matthew Cockram serves as the Chief Executive Officer and Principal of Cooper and Company NZ. Prior to that, he spent 20 years at law firm Bell Gully, with the last 5 years as Chairman, specialising in construction, commercial property and major projects. He has been an independent Director of Tainui Group Holdings Limited since March 25, 2011. Oliver Hartwich is the Executive Director of The New Zealand Initiative. Before joining the Initiative he worked for leading think tanks in London and Sydney as well as in the UK House of Lords. His research covers a broad range of policy issues, and his articles have been widely published."
