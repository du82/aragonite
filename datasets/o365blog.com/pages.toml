full_description = "How to preserve user's mailbox during the long leave May 29, 2018 Have you ever faced a situation, where a user takes a longer than 30-day leave, and you would like to save money spent on Office 365 licenses but still preserve user’s mailbox? In this blog, I tell you how! Office 365 email encryption May 16, 2018 (Last Modified: May 17, 2018) It still surprises me how few know that Office 365 includes a full-fledged email encryption solution, Office Message Encryption (OME). A “new OME”, built on top of Azure Information Protection, has been available for some time now. In this blog, I’ll tell you how to setup and customise the new OME."
