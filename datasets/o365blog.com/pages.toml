DIntReconAsGuest (AC) Invoke-AADIntUserEnumerationAsGuest (AC) Invoke-AADIntReconAsInsider (AC) Invoke-AADIntUserEnumerationAsInsider (AC) Invoke-AADIntPhishing DRS functions Get-AADIntAdUserNTHash (*) 😈 Get-AADIntADUserThumbnailPhoto (*) 😈 Get-AADIntDesktopSSOAccountPassword (*) 😈 MS Partner functions New-AADIntMSPartnerDelegatedAdminRequest (*) Approve-AADIntMSPartnerDelegatedAdminRequest (AD) Remove-AADIntMSPartnerDelegatedAdminRoles (AD) Get-AADIntMSPartners (AD) Get-AADIntMSPartnerOrganizations (MP) Get-AADIntMSPartnerRoleMembers (MP) Get-AADIntMSPartnerContracts (A) Find-AADIntMSPartners OneNote functions Start-AADIntSpeech (ON) Certificate Based Authentication (CBA) Get-AADIntAdminPortalAccessTokenUsingCBA Get-AADIntPortalAccessTokenUsingCBA Access Package functions Get-AADIntAccessPackages (AP) Get-AADIntAccessPackageCatalogs (AP) Get-AADIntAccessPackageAdmins (AP) B2C functions Get-AADIntB2CEncryptionKeys (M) New-AADIntB2CRefreshToken New-AADIntB2CAuthorizationCode Introduction AADInternals and AADInternals-Endpoints toolkits are PowerShell modules containing tools for administering and hacking Entra ID (ex. Azure AD), Office 365, and Entra ID related endpoints. It is listed in MITRE ATT&CK with id S0677. Installation Current version Since version 0.9.6, AADInternals has two modules: AADInternals and AADInternals-Endpoints. The latter one contains all functionality that deals with endpoints, such as, Entra ID joined devices, AD FS server, Entra ID Connect server, computer running PTA agent etc. Functions flagged with 😈 symbol are in this module. The modules can be installed from PowerShell: # Install the module Install-Module -Name "AADInternals" Install-Module -Name "AADInternals-Endpoints" # Import modules Import-Module -Name "AADInternals" Import-Module -Name "AADInternals-Endpoints" Output: ___ ___ ____ ____ __ __ / | / | / __ \/ _/___ / /____ _________ ____ _/ /____ / /| | / /| | / / / // // __ \/ __/ _ \/ ___/ __ \/ __ '/ / ___/ / ___ |/ ___ |/ /_/ _/ // / / / /_/ __/ / / / / / /_/ / (__ ) /_/ |_/_/ |_/_____/___/_/ /_/\__/\___/_/ /_/ /_/\__,_/_/____/ v0.9.7 by @DrAzureAD (Nestori Syynimaa) ___ ___ ____ ____ __ __ / | / | / __ \/ _/___ / /____ _________ ____ _/ /____ / /| | / /| | / / / // // __ \/ __/ _ \/ ___/ __ \/ __ `/ / ___/ / ___ |/ ___ |/ /_/ _/ // / / / /_/ __/ / / / / / /_/ / (__ ) /_/ |_/_/ |_/_____/___/_/ /_/\__/\___/_/ /_/ /_/\__,_/_/____/ For Endpoints 😈 v0.9.6 by @DrAzureAD (Nestori Syynimaa) Previous versions You may also install a specific version to use removed features. To use “the old” interactive authentication, install version 0.8.4: # Install the version 0.8.4 Install-Module -Name "AADInternals" -RequiredVersion "0.8.4" -Force # Import the module Import-Module -Name "AADInternals" -RequiredVersion "0.8.4" To use PTASpy, install version 0.9.3: # Install the version 0.9.3 Install-Module -Name "AADInternals" -RequiredVersion "0.9.3" -Force # Import the module Import-Module -Name "AADInternals" -RequiredVersion "0.9.3" The modules are also available in GitHub and PowerShell gallery Module GitHub PowerShell Gallery AADInternals https://github.com/Gerenios/AADInternals Link AADInternals-Endpoints https://github.com/Gerenios/AADInternals-Endpoints Link About AAD Internals is a PowerShell module where I’ve tried to put all the knowledge I’ve gained during the years spent with Office 365 and Entra ID. It is a result of hours of reverse-engineering and debugging of Microsoft tools related to Entra ID, such as PowerShell modules, directory synchronisation, and admin portals. The module is a plain PowerShell script module, so you can copy and paste the code to your own scripts as needed. Having said that, the are some functions that are utilising the built-in functionality of Windows. Thus, everything might not work on every computer. I haven’t tried to duplicate all functionality MSOnline, AzureAD, or MS Graph modules currently have. Instead, I decided to bring that information and functionality those modules doesn’t provide. Also, I have created some “blackhat” level functionality that allows administrators to do things that shouldn’t be even possible.. Detailed help about parameters etc. can be seen using PowerShell Get-Help cmdlet: # See help for Get-AADIntAccessTokenForAADGraph Get-Help Get-AADIntAccessTokenForAADGraph Version info Version Date Version notes 0.9.7 Dec 13th 2024 Renamed Get‑AADIntESTSAUTHCookies to Get‑AADIntESTSAUTHCookie and added -Persistent switch to get ESTSAUTHPERSISTENT cookie.Removed Get-AADIntComplianceCookies and changed Search‑AADIntUnifiedAuditLog to use access token. 0.9.6 Dec 10th 2024 Splitted the module in two (see blog post). Added support for ESTSAUTH cookies to Get‑AADIntAccessToken. Added Remove‑AADIntUserFromEstsAuthPersistentCookie.Added Get‑AADIntAppConsentInfo to show information about given application. Added Find‑AADIntBackdoor to find federated domains that were converted to backdoors with ConvertTo‑AADIntBackdoor.Added Convert‑AADIntObjectIDtoSID and Convert‑AADIntSIDtoObjectID to convert between Entra ID SID and ObjectID.Added Get-AADIntDynamicAbusableGroups to find groups with dynamic membership rule that have user modifiable attributes.Added Export‑AADIntLocalDeviceMDMCertificate for exporting Intune certificate of the device.Moved CloudAP support from Get‑AADIntUserPRTKeys to Get‑AADIntUserPRTKeysFromCloudAP.Added Get‑AADIntESTSAUTHCookies for getting ESTSAUTH and ESTSAUTHPERSISTENT cookies to be used for authentication with Get‑AADIntAccessToken. Added Invoke‑AADIntScriptAs to run PowerShell scripts as system or other users. 0.9.4 Jul 30th 2024 Added support for Entra ID sub regions (DOD & GCC High) to Invoke‑AADIntReconAsOutsider and Invoke‑AADIntUserEnumerationAsOutsider.Added Get‑AADIntTeamsExternalUserInformation to get external Teams user information. Allows getting User Principal Name with Entra ID User ObjectID.Added support for federated sign-in (ADFS only).Removed PTASpy to prevent antivirus blocking AADInternals installation on non-PTA computers.Lot of bug fixes. Added -SaveToMgCache switch to Get‑AADIntAccessTokenForMSGraph to ease using Microsoft Graph PowerShell SDK commands. You can now use AADInternals interactive authentication using the built-in first-party app “Azure Active Directory PowerShell”. 0.9.3 Jan 14th 2024 Added Test‑AADIntSARAPort and Resolve‑AADIntSARAHost.Added Get‑AADIntB2CEncryptionKeys to export B2C token encryption keys, and New‑AADIntB2CRefreshToken & New‑AADIntB2CAuthorizationCode to exploit them. Added Get‑AADIntAzureADFeatures, Get‑AADIntAzureADFeature, and Set‑AADIntAzureADFeature for listing and modifying Azure AD/Entra ID features. Added Add‑AADIntSyncFabricServicePrincipal for adding a missing Microsoft.Azure.SyncFabric service principal if BPRT creation fails. Modified ConvertTo‑AADIntBackdoor to add backdoor certificate to NextSigningCertificate if the domain is already federated. Added Install‑AADIntForceNTHash, Remove‑AADIntForceNTHash, and Initialize‑AADIntFullPass'''
