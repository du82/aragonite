["https://o365blog.com/tags/office-365"]
title = "Office 365"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "Deep-dive to Azure Active Directory Identity Federation June 12, 2019 (Last Modified: October 30, 2019) Identity federation is regarded as the most secure way to authenticate users to Azure AD. In this blog, I’ll deep-dive to identity federation implementation of Azure AD and point out some serious security issues. How to create over 256 character long passwords for cloud-only users May 10, 2019 Microsoft (finally!) announced in April 2019 the support for 8-256 character passwords in Azure AD/Office 365. This limit does not apply to users whose passwords are synced from the on-prem Active Directory (or for federated users). In this blog, I tell how to set insanely long passwords (64K+) also for cloud-only users! Technical deep dive to Microsoft Teams (free) July 25, 2018 Microsoft Teams has been available for free since July 2018. In this blog, I’ll deep dive to its technical details. How to use a non-routable on-premises UPN with Office 365 and Azure AD July 24, 2018 I’ve recently noticed that many organisations moving to Office 365 are struggling with their current on-premises non-routable UPNs. In this blog, I’ll show how to use Office 365 without altering on-premises UPNs. Chasing the Unicorn: PowerShell module for 'The Secret Office 365 Forensics Tool' July 02, 2018 (Last Modified: July 13, 2018) In June 2018 the existence of secret Office 365 forensics tool was confirmed. The tool refers to Microsoft’s undocumented Exchange Online Activities API. The API provides access to a granular mail activity events for up to six months old data! To provide administrators with easy access to the API, I created a PowerShell module (EXOMailActivity). In this blog, I’ll show you how to use the module to get access to mail activity data. Admin: Take back control of Office 365 Groups, Teams, and Planner! May 31, 2018 (Last Modified: July 11, 2018) Office 365 groups is a great way to promote collaboration between people inside and outside organisations. By default, users are able to create groups freely, making their use easy. However, in many organisations, this has led to chaos. In this blog, I show how you can get back the control of Office 365 groups, Teams and Planner."
