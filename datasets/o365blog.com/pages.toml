["https://o365blog.com/tags/azure"]
title = "Azure"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "Stealing and faking Azure AD device identities February 15, 2022 (Last Modified: February 17, 2022) In my previous blog posts I’ve covered details on PRTs, BPRTs, device compliance, and Azure AD device join. In this blog, I’ll show how to steal identities of existing Azure AD joined devices, and how to fake identies of non-AAD joined Windows devices with AADInternals v0.6.6. Spoofing Azure AD sign-ins logs by imitating AD FS Hybrid Health Agent July 08, 2021 (Last Modified: September 08, 2021) Azure AD Connect Health is a feature that allows viewing the health of on-prem hybrid infrastructure components, including Azure AD Connect and AD FS servers. Health information is gathered by agents installed on each on-prem hybrid server. Since March 2021, also AD FS sign-in events are gathered and sent to Azure AD. In this write-up (based on a Threat Analysis report by Secureworks), I’ll explain how anyone with a local administrator access to AD FS server (or proxy), can create arbitrary sign-ins events to Azure AD sign-ins log. Moreover, I’ll show how Global Administrators can register fake agents to Azure AD - even for tenants not using AD FS at all. Exporting AD FS certificates revisited: Tactics, Techniques and Procedures April 27, 2021 (Last Modified: September 09, 2022) I’ve talked about AD FS issues for a couple years now, and finally, after the Solorigate/Sunburst, the world is finally listening 😉 In this blog, I’ll explain the currently known TTPs to exploit AD FS certificates, and introduce a totally new technique to export the configuration data remotely. Deep-dive to Azure AD device join March 03, 2021 (Last Modified: September 10, 2021) Devices (endpoints) are a crucial part of Microsoft’s Zero Trust concept. Devices can be Registered, Joined, or Hybrid Joined to Azure AD. Conditional Access uses the device information as one of the decisions criteria to allow or block access to services. In this blog, I’ll explain what these different registration types are, what happens under-the-hood during the registration, and how to register devices with AADInternals v0.4.6."
