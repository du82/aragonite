["https://o365blog.com/tags/security/page/2"]
title = "Security"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "Abusing Azure Active Directory at t2.fi 2019 October 18, 2019 On October 25th, I’ll be talking at t2.fi infosec conference in Helsinki. In this blog, I’ll tell what to expect in my Abusing Azure Active Directory: Who would you like to be today? presentation. Azure AD Seamless SSO allows enumerating tenant users October 03, 2019 (Last Modified: February 17, 2021) In 2017, Oliver Morton introduced a feature he found in Office 365 Active Sync, allowing enumerating the existence of the users based on http status codes. (Update: The “feature” was fixed by Microsoft on mid November 2019). In this blog, I’ll introduce my similar findings on using Microsoft API to enumerate users when Seamless SSO is enabled in Azure AD tenant. AADInternals at Black Hat USA 2019 Arsenal! July 10, 2019 (Last Modified: August 09, 2019) I was honoured to hear that I was accepted to present my AADInternals toolkit at the most respected information security event in the world: Black Hat USA 2019. This is clearly one of my greatest professional achievements so far! In this blog, I’ll briefly introduce what to expect in my demo at Black Hat Arsenal. How to create over 256 character long passwords for cloud-only users May 10, 2019 Microsoft (finally!) announced in April 2019 the support for 8-256 character passwords in Azure AD/Office 365. This limit does not apply to users whose passwords are synced from the on-prem Active Directory (or for federated users). In this blog, I tell how to set insanely long passwords (64K+) also for cloud-only users! How to create a backdoor to Azure AD - part 1: Identity federation November 21, 2018 (Last Modified: August 05, 2020) On November 2018 Azure AD MFA was down over 12 hours preventing users from logging in to Office 365. Same happened in October 2019 in US data centers. As MFA is usually mandatory for administrators by company policy, they couldn’t log in either. In this blog, I’ll show how to create a backdoor to Azure AD so you can log in and bypass MFA."
