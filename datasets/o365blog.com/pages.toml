["https://o365blog.com"]
title = "AADInternals.com"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "AADInternals-Endpoints 😈 December 10, 2024 In September 2024, I tweeted about my intentions to split AADInternals module in two as AVs and MDE was blocking its installation. In this blog, I’ll explain the what and the why of the new AADInternals-Endpoints 😈 module. Exfiltrating NTHashes by abusing Microsoft Entra Domain Services January 13, 2024 (Last Modified: January 14, 2024) Last year I gave a presentation titled Dumping NTHashes from Azure AD at TROOPERS conference. The talk was about how the Microsoft Entra Domain Services (formerly Azure AD Domain Services) works and how it enabled dumping NTHashes from Entra ID (formerly Azure AD). In this blog, I’ll show how Microsoft Entra Domain Services (MEDS) can be (ab)used to exfiltrate NTHashes from on-prem Active Directory. DoSing Azure AD July 02, 2023 My recent talk at the great T2 conference on DoSing Azure AD gained a lot of attention. Unfortunately, the talk was not recorded, so I decided to write a blog for those who couldn’t attend. So here we go! Deploying users with pre-registered MFA May 23, 2023 (Last Modified: May 24, 2023) A couple of weeks ago a friend of mine asked would it be possible to pre-register MFA for users in Azure AD. For short, yes it is! In this blog, I’ll show how to pre-register OTP and SMS MFA methods using AADInternals’ Register‑AADIntMFAApp and Set‑AADIntUserMFA. Elevation of Privilege from Local Admin to gMSA January 23, 2023 In my previous blog post I explained how Group Managed Service Accounts (gMSA) passwords are stored locally on the servers. In this blog, I’ll share how you can easily elevate yourself from the local administrator to gMSA without a need to know the account password. I’m already using this technique in AADInternals to execute code as AD FS service account. Bypassing Azure AD home tenant MFA and CA November 08, 2022 (Last Modified: November 13, 2022) Multi-factor Authentication (MFA) and Conditional Access (CA) policies are powerful tools to protect Azure AD users’ identities. For instance, one may allow access only from compliant devices and require MFA from all users. However, because of Azure AD authentication platform architecture, users can bypass home tenant MFA and CA policies when logging in directly to resource tenants. This blog post tries to shed some light on how Azure AD authentication works under-the-hood. We’ll introduce the issue, describe how to exploit it, show how to detect exploitation, and finally, how to prevent the exploitation. The blog is co-authored with @SravanAkkaram and is based on his findings."
