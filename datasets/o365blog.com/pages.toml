["https://o365blog.com/post/pta-deepdive"]
title = "Deep-dive to Azure AD Pass-Through Authentication"
description = "Dr Syynimaa works as Principal Identity Security Researcher at Microsoft Security Research.  Before his security researcher career, Dr Syynimaa worked as a CIO, consultant, trainer, and university lecturer for over 20 years. He is a regular speaker in scientific and professional conferences related to Microsoft 365 and Entra ID (Azure AD) security. Before joining Microsoft, Dr Syynimaa was Microsoft MVP in security category and Microsoft Most Valuable Security Researcher (MVR)."
full_description = 'Deep-dive to Azure AD Pass-Through Authentication March 30, 2020 blog What is pass-through authentication? How it works? Registering the PTA agent Connecting to Azure Ad Bootstrap Service Bus Service Bus Relay Proxy Conclusion Setting up Fiddler to capture PTA flow Install PTA agent Register the PTA Agent Change the PTA Agent certificate Run the Fiddler Credits In my earlier blog, I explained how Azure AD identity federation works under-the-hood. In this post, I’ll be doing the same with Azure AD pass-through authentication (PTA). What is pass-through authentication? Azure Active Directory Pass-through Authentication (PTA) is an authentication method allowing users to sign in to on-premises and Azure AD/Office 365 using the same credentials. Technically it is a service running on a Windows server. The first instance is installed along with Azure AD Connect. For high-availability, extra agents can be installed from here. How it works? The overall authentication steps are explained in this article by Microsoft. In more detail, it goes like this: The PTA agent is registered to Azure AD. The certificate used by the agent is signed by the Azure app proxy. When starting the agent, a bootstrap file is fetched from the Azure app proxy. A persistent https connection using WebSocket/wsrelayedamqp is made to each signalling listener endpoints (in total 4 to 8 connections). When user is logging in and gives a password, a request to connect to Azure Service Bus relay is sent to some endpoints. The agent “picking up” the request will send back an “accept message” and connect to the given relay using WebSocket/wsrelayedconnection. The agent notifies the relay and receives a request to connect to app proxy. A WebSocket connection is made to proxy. The agent notifies the proxy and receives an authentication request in JSON format. The agent decrypts the password with the private key of the certificate it is using. The user name and password are sent to Win32 API LogonUserW function The authentication result is sent back to the app proxy with a regular https POST The technical details are provided below :mag: Registering the PTA agent When the PTA Agent is installed, it is first registered to Azure AD. This is done by sending an XML document containing a CSR (Certificate Signing Request) to “https://< tenant-id >.registration.msappproxy.net/register/registerConnector”. For example, if your Azure AD tenant id is “ae11aea0-4e67-438a-80a8-d877c5d4a885”, the following XML file is sent to https://ae11aea0-4e67-438a-80a8-d877c5d4a885.registration.msappproxy.net/register/registerConnector using POST protocol. <RegistrationRequest xmlns="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.Registration" xmlns:i="http://www.w3.org/2001/XMLSchema-instance"> <Base64Csr>MII..</Base64Csr> <AuthenticationToken>eyJ..</AuthenticationToken> <Base64Pkcs10Csr i:nil="true"/> <Feature>ApplicationProxy</Feature> <FeatureString>PassthroughAuthentication</FeatureString> <RegistrationRequestSettings> <SystemSettingsInformation i:type="a:SystemSettings" xmlns="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.RegistrationCommons" xmlns:a="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.Utilities.SystemSettings"> <a:MachineName>DC.company.com</a:MachineName> <a:OsLanguage>1033</a:OsLanguage> <a:OsLocale>0409</a:OsLocale> <a:OsSku>8</a:OsSku> <a:OsVersion>10.0.17763</a:OsVersion> </SystemSettingsInformation> <PSModuleVersion>1.5.643.0</PSModuleVersion> <SystemSettings i:type="a:SystemSettings" xmlns:a="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.Utilities.SystemSettings"> <a:MachineName>DC.company.com</a:MachineName> <a:OsLanguage>1033</a:OsLanguage> <a:OsLocale>0409</a:OsLocale> <a:OsSku>8</a:OsSku> <a:OsVersion>10.0.17763</a:OsVersion> </SystemSettings> </RegistrationRequestSettings> <TenantId>ae11aea0-4e67-438a-80a8-d877c5d4a885</TenantId> <UserAgent>PassthroughAuthenticationConnector/1.5.643.0</UserAgent> </RegistrationRequest> If everything goes okay, the following response is returned, containing the signed certificate. <RegistrationResult xmlns="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.Registration" xmlns:i="http://www.w3.org/2001/XMLSchema-instance"> <Certificate>MIIDO..</Certificate> <ErrorMessage/> <IsSuccessful>true</IsSuccessful> </RegistrationResult> As it can be seen below, the certificate is issued by hisconnectorregistrationca.msappproxy.net, and the subject is the tenant id. The certificate is valid for 180 days. As can be seen above, the MachineName in the CSR is the name of the server where the agent is installed. In the Azure AD Admin center, the status is shown as below. When multiple agents are installed, the status of each will be shown in the list. Connecting to Azure Ad After the agent is registered, it can connect to Azure AD. Technically there are three (or more) different types of connections involved in the authentication process. Bootstrap When the agent starts, it first requests a bootstrap from “https://< tenant-id >.pta.bootstrap.his.msappproxy.net/ConnectorBootstrap” using the following XML document. Authentication is performed using the certificate created during the registration process. Moreover, the MachineName is sent to Azure AD as part of the request. <BootstrapRequest xmlns="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.SignalerDataModel" xmlns:i="http://www.w3.org/2001/XMLSchema-instance"> <AgentSdkVersion>1.5.1542.0</AgentSdkVersion> <AgentVersion>1.5.1542.0</AgentVersion> <BootstrapAddOnRequests i:nil="true"/> <BootstrapDataModelVersion>1.5.1542.0</BootstrapDataModelVersion> <ConnectorId>0ea97280-4738-498d-b18a-3790e4886e62</ConnectorId> <ConnectorVersion i:nil="true"/> <ConsecutiveFailures>0</ConsecutiveFailures> <CurrentProxyPortResponseMode>Primary</CurrentProxyPortResponseMode> <FailedRequestMetrics xmlns:a="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.BootstrapDataModel"/> <InitialBootstrap>true</InitialBootstrap> <IsProxyPortResponseFallbackDisabledFromRegistry>true</IsProxyPortResponseFallbackDisabledFromRegistry> <LatestDotNetVersionInstalled>461814</LatestDotNetVersionInstalled> <MachineName>DC.company.com</MachineName> <OperatingSystemLanguage>1033</OperatingSystemLanguage> <OperatingSystemLocale>040b</OperatingSystemLocale> <OperatingSystemSKU>7</OperatingSystemSKU> <OperatingSystemVersion>10.0.17763</OperatingSystemVersion> <PerformanceMetrics xmlns:a="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.BootstrapDataModel"> <a:CpuAggregates/> <a:CurrentActiveBackendWebSockets>0</a:CurrentActiveBackendWebSockets> <a:FaultedServiceBusConnectionCount>0</a:FaultedServiceBusConnectionCount> <a:FaultedWebSocketConnectionCount>0</a:FaultedWebSocketConnectionCount> <a:LastBootstrapLatency>0</a:LastBootstrapLatency> <a:TimeGenerated>2020-03-30T13:49:31.4249204Z</a:TimeGenerated> </PerformanceMetrics> <ProxyDataModelVersion>1.5.1542.0</ProxyDataModelVersion> <RequestId>0c891cd7-afae-49bd-8f40-2f52263c2c0a</RequestId> <SubscriptionId>ae11aea0-4e67-438a-80a8-d877c5d4a885</SubscriptionId> <SuccessRequestMetrics xmlns:a="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.BootstrapDataModel"/> <TriggerErrors/> <UpdaterStatus>Stopped</UpdaterStatus> <UseServiceBusTcpConnectivityMode>false</UseServiceBusTcpConnectivityMode> <UseSpnegoAuthentication>false</UseSpnegoAuthentication> </BootstrapRequest> Among other information, the bootstrap response has a list of “signalling listener endpoints”. Each of the endpoints has a unique Shared Access Key and url. <BootstrapResponse xmlns="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.SignalerDataModel" xmlns:i="http://www.w3.org/2001/XMLSchema-instance"> <BackendSessionTimeoutMilliseconds>305000</BackendSessionTimeoutMilliseconds> <BootstrapAddOnResponses i:nil="true"/> <BootstrapClientAddOnSettings i:nil="true" xmlns:a="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.BootstrapDataModel"/> <BootstrapEndpointOverride i:nil="true"/> <CheckForTrustRenewPeriodInMinutes>360</CheckForTrustRenewPeriodInMinutes> <ConfigRequestTimeoutMilliseconds>20000</ConfigRequestTimeoutMilliseconds> <ConfigurationEndpointFormat>https://{0}:{1}/subscriber/admin</ConfigurationEndpointFormat> <ConnectionLimit>200</ConnectionLimit> <ConnectivitySettings>{"ServicePointManagerSettings":{"ConnectionLimit":200,"MaxServicePoints":0,"MaxServicePointIdleTimeMilliseconds":300000,"DnsRefreshTimeoutMilliseconds":1800000,"Expect100Continue":false,"UseNagleAlgorithm":false,"TcpKeepAliveEnabled":true,"TcpKeepAliveTime":60000,"TcpKeepAliveInterval":1000},"SignalingSettings":{"BindingType":"NetTcpRelayBinding","OpenTimeout":"00:01:00","CloseTimeout":"00:01:00","ReceiveTimeout":"10675199.02:48:05.4775807","ReliableSessionEnabled":false,"ReliableSessionInactivityTimeout":"00:10:00","ReliableSessionOrdered":true,"ListenBacklog":10,"MaxReceivedMessageSize":65536,"MaxBufferPoolSize":65536,"MaxBufferSize":65536,"MaxConnections":100,"WebSocketReceiveTimeout":"02:00:00","UseCachedServiceBusSasToken":false,"ServiceBusSasTokenTtl":"23:59:59","UseServiceBusTracingForListenerId":false},"WebSocketSignalingSettings":{"OpenTimeout":"00:00:30","CloseTimeout":"00:00:30","SendTimeout":"00:00:30","ReceiveTimeout":"02:00:00","IdleTimeout":"02:00:00","LeaseTimeout":"06:00:00","KeepAliveInterval":"00:00:10","MaxReceivedMessageSize":65536,"MaxConnections":1,"EnableAutomaticReconnects":true,"RetryableOperationSettings":{"MinimumSuccessfulOperationTimeSpan":"00:01:00","TotalAttempts":5,"InitialDelayMilliseconds":200,"DelayFactor":2}},"DnsCacheSettings":{"DnsCacheEnabled":true,"DnsCacheTtl":"00:30:00","DnsCacheResolutionTimeout":"00:01:00"},"BackendWebSocketSettings":{"MessageBufferSize":16384,"BackendWebSocketIdleTimeout":"05:00:00","BackendWebSocketInactivityCheckPeriod":"00:30:00"}}</ConnectivitySettings> <ConnectorState>Ok</ConnectorState> <DnsLookupCacheTtl>PT30M</DnsLookupCacheTtl> <DnsRefreshTimeoutMilliseconds>1800000</DnsRefreshTimeoutMilliseconds> <ErrorEndpointFormat>https://{0}:{1}/subscriber/error</ErrorEndpointFormat> <LogicalResponseTimeoutMilliseconds>15000</LogicalResponseTimeoutMilliseconds> <MaxBootstrapAddOnRequestsLength>0</MaxBootstrapAddOnRequestsLength> <MaxFailedBootstrapRequests>144</MaxFailedBootstrapRequests> <MaxServicePointIdleTimeMilliseconds>300000</MaxServicePointIdleTimeMilliseconds> <MinutesInTrustLifetimeBeforeRenew>43200</MinutesInTrustLifetimeBeforeRenew> <PayloadEndpointFormat>https://{0}:{1}/subscriber/payload</PayloadEndpointFormat> <PayloadRequestTimeoutMilliseconds>20000</PayloadRequestTimeoutMilliseconds> <PeriodicBootstrapIntervalMilliseconds>600000</PeriodicBootstrapIntervalMilliseconds> <ProxyPortResponseFallbackPeriod>P1D</ProxyPortResponseFallbackPeriod> <RelayReceiveTimeout>P10675199DT2H48M5.4775807S</RelayReceiveTimeout> <ResponseEndpointFormat>https://{0}:{1}/subscriber/connection</ResponseEndpointFormat> <ResponseRetryDelayFactor>2</ResponseRetryDelayFactor> <ResponseRetryInitialDelayMilliseconds>200</ResponseRetryInitialDelayMilliseconds> <ResponseRetryTotalAttempts>5</ResponseRetryTotalAttempts> <ResponseSigningEnabled>false</ResponseSigningEnabled> <ServiceMessage/> <SignalingListenerEndpoints xmlns:a="http://schemas.datacontract.org/2004/07/Microsoft.ApplicationProxy.Common.BootstrapDataModel"> <a:SignalingListenerEndpointSettings i:type="a:ServiceBusSignalingListenerEndpointSettings"> <a:IsAvailable>true</a:IsAvailable> <a:Name>his-eur1-weur1/ae11aea0-4e67-438a-80a8-d877c5d4a885_b9ebb6bb-e7e8-40e6-9bf9-fc258b2c77b8</a:Name> <a:Domain>servicebus.windows.net</a:Domain> <a:Namespace>his-eur1-weur1</a:Namespace> <a:ReliableSessionEnabled>false</a:ReliableSessionEnabled> <a:Scheme>sb</a:Scheme> <a:ServicePath>ae11aea0-4e67-438a-80a8-d877c5d4a885_b9ebb6bb-e7e8-40e6-9bf9-fc258b2c77b8</a:ServicePath> <a:SharedAccessKey>k5..</a:SharedAccessKey> <a:SharedAccessKeyName>Connector</a:SharedAccessKeyName> </a:SignalingListenerEndpointSettings> <a:SignalingListenerEndpointSettings i:type="a:ServiceBusSignalingListenerEndpointSettings"> <a:IsAvailable>true</a:IsAvailable> <a:Name>his-eur1-neur1/ae11aea0-4e67-438a-80a8-d877c5d4a885_b9ebb6bb-e7e8-40e6-9bf9-fc258b2c77b8</a:Name> <a:Domain>servicebus.windows.net</a:Domain> <a:Namespace>his-eur1-neur1</a:Namespace> <a:ReliableSessionEnabled>false</a:ReliableSessionEnabled> <a:Scheme>sb</a:Scheme> <a:ServicePath>ae11aea0-4e67-438a-80a8-d877c5d4a885_b9ebb6bb-e7e8-40e6-9bf9-fc258b2c77b8</a:ServicePath> <a:SharedAccessKey>jq..</a:SharedAccessKey> <a:SharedAccessKeyName>Connector</a:SharedAccessKeyName> </a:SignalingListenerEndpointSettings> <a:SignalingListenerEndpointSettings i:type="a:ServiceBusSignalingListenerEndpointSettings"> <a:IsAvailable>true</a:IsAvailable> <a:Name>his-eur1-weur1/ae11aea0-4e67-438a-80a8-d877c5d4a885_b9ebb6bb-e7e8-40e6-9bf9-fc258b2c77b8_reliable</a:Name> <a:Domain>servicebus.windows.net</a:Domain> <a:Namespace>his-eur1-weur1</a:Namespace> <a:ReliableSessionEnabled>true</a:ReliableSessionEnabled> <a:Scheme>sb</a:Scheme> <a:ServicePath>ae11aea0-4e67-438a-80a8-d877c5d4a885_b9ebb6bb-e7e8-40e6-9bf9-fc258b2c77b8_reliable</a:ServicePath> <a:SharedAccessKey>Z+..</a:SharedAccessKey> <a:SharedAccessKeyName>Connector</a:SharedAccessKeyName> </a:SignalingListenerEndpointSettings> <a:SignalingListenerEndpointSettings i:type="a:ServiceBusSignalingListenerEndpointSettings"> <a:IsAvailable>true</a:IsAvailable> <a:Name>his-eur1-neur1/ae11aea0-4e67-438a-80a8-d877c5d4a885_b9ebb6bb-e7e8-40e6-9bf9-fc258b2c77b8_reliable</a:Name> <a:Domain>servicebus.windows.net</a:Domain> <a:Namespace>his-eur1-neur1</a:Namespace> <a:ReliableSessionEnabled>true</a:ReliableSessionEnabled> <a:Scheme>sb</a:Scheme> <a:ServicePath>ae11aea0-4e67-438a-80a8-d877c5d4a885_b9ebb6bb-e7e8-40e6-9bf9-fc2