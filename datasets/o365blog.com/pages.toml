full_description = "Unnoticed sidekick: Getting access to cloud as an on-prem admin July 13, 2020 (Last Modified: December 03, 2021) This post is part 5⁄5 of Azure AD and Microsoft 365 kill chain blog series. Although on-prem administrators doesn’t usually have admin rights to Azure AD, they can have access to crucial information, such as Azure AD Connect, ADFS, and Active Directory. Administrators of these services can easily get admin rights to Azure AD to manipulate and impersonate users. In this blog, using AADInternals v0.4.0, I’ll show how to get Global Admin access and how to impersonate users as an on-prem administrator. Wolf in sheep's clothing: Azure Active Directory reconnaissance as an insider June 15, 2020 (Last Modified: December 11, 2021) This post is part 3⁄5 of Azure AD and Microsoft 365 kill chain blog series. Azure AD and Office 365 are cloud services and most information is hidden to the members (or guests) of the tenant. However, there are plenty of information publicly available to anyone. In this blog, using AADInternals v0.4.5, I’ll show how to gather information of any Azure AD tenant as an insider. Quest for guest access: Azure Active Directory reconnaissance as a guest June 14, 2020 (Last Modified: September 06, 2020) This post is part 2⁄5 of Azure AD and Microsoft 365 kill chain blog series. When sharing SharePoint to people outside the organisations or inviting them to Teams, a corresponding guest account is created to Azure AD. Although the created guest account is not a pure insider, it has wide read-only access to organisation’s Azure AD information. In this blog, using AADInternals v0.4.0, I’ll show how to gather information from Azure AD tenant as a guest user. Just looking: Azure Active Directory reconnaissance as an outsider June 13, 2020 (Last Modified: September 01, 2021) This post is part 1⁄5 of Azure AD and Microsoft 365 kill chain blog series. Azure AD and Office 365 are cloud services and most information is available only to the members (or guests) of the tenant. However, there are plenty of information publicly available to anyone. In this blog, using AADInternals v0.4.0, I’ll show how to gather information of any Azure AD tenant as an outsider."
