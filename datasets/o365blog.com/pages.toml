title = "Demo"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "Deploying users with pre-registered MFA May 23, 2023 (Last Modified: May 24, 2023) A couple of weeks ago a friend of mine asked would it be possible to pre-register MFA for users in Azure AD. For short, yes it is! In this blog, I’ll show how to pre-register OTP and SMS MFA methods using AADInternals’ Register‑AADIntMFAApp and Set‑AADIntUserMFA. Demo Deploying users with pre-registered MFA May 23, 2023 (Last Modified: May 24, 2023) A couple of weeks ago a friend of mine asked would it be possible to pre-register MFA for users in Azure AD. For short, yes it is! In this blog, I’ll show how to pre-register OTP and SMS MFA methods using AADInternals’ Register‑AADIntMFAApp and Set‑AADIntUserMFA."
