full_description = "Block user access to Azure AD PowerShell and Graph API Explorer August 27, 2018 (Last Modified: November 09, 2021) By default, any user of Office 365 or Azure AD tenant can read the content of Azure AD using PowerShell and Graph API Explorer. This is a serious security issue because users have undetectable access to other users’ personal data, which violates for instance GDPR. In this blog, I’ll tell how to prevent the access. Graph Block user access to Azure AD PowerShell and Graph API Explorer August 27, 2018 (Last Modified: November 09, 2021) By default, any user of Office 365 or Azure AD tenant can read the content of Azure AD using PowerShell and Graph API Explorer. This is a serious security issue because users have undetectable access to other users’ personal data, which violates for instance GDPR. In this blog, I’ll tell how to prevent the access."
