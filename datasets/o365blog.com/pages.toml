["https://o365blog.com/post/ps-module"]
title = "Azure AD PowerShell module installation got easier"
description = "Dr Syynimaa works as Principal Identity Security Researcher at Microsoft Security Research.  Before his security researcher career, Dr Syynimaa worked as a CIO, consultant, trainer, and university lecturer for over 20 years. He is a regular speaker in scientific and professional conferences related to Microsoft 365 and Entra ID (Azure AD) security. Before joining Microsoft, Dr Syynimaa was Microsoft MVP in security category and Microsoft Most Valuable Security Researcher (MVR)."
full_description = "Azure AD PowerShell module installation got easier February 09, 2018 (Last Modified: May 31, 2018) blog Before you begin Installing the Azure AD PowerShell module Azure AD PowerShell v1 (MsOnline) Azure AD PowerShell v2 (AzureAD) Azure AD PowerShell v2 preview (AzureADPreview) Azure AD PowerShell module was earlier installed by a standard .msi package. Now you can install it using one PowerShell command. However, installation requires PowerShell 5 or newer. Before you begin Module installation requires PowerShell 5 or later which is included in Windows 10 & Server 2016. If you have previous version of Windows, you need to install Windows Management Framework 5.1 here. Installing the Azure AD PowerShell module To install the latest Azure AD PowerShell module, enter the following commands as an administrator. Azure AD PowerShell v1 (MsOnline) # Install the MsOnline module Install-Module MSOnline If you haven’t used the Install-Module command earlier, you might not have NuGet provider. Just click the Yes to continue. You might also get the following error message stating that PSGallery is untrusted. This is okay so you may safely click the yes button. Now you are ready to connect to Office 365! Connect-MsolService Azure AD PowerShell v2 (AzureAD) # Install the AzureAD module Install-Module AzureAD Now you are ready to connect to Office 365! Connect-AzureAD Azure AD PowerShell v2 preview (AzureADPreview) Note! AzureAD Preview has same commands than AzureAD, only the module name is different. Therefore, they cannot be installed in the same computer together. # Install the AzureAD module Install-Module AzureADPreview Now you are ready to connect to Office 365! Connect-AzureAD PowerShell"
year_published = 2018
year_updated = 2018
