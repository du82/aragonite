full_description = "AADInternals World Tour August 2022: USA August 01, 2022 (Last Modified: August 16, 2022) blog Aug 9: TECHMENTOR Aug 10: Black Hat Aug 10 - 11: Black Hat Arsenal Aug 12: DEF CON Cloud Village Aug 12: DEF CON Demo Labs In August 2022, I’ll have several presentations regarding Azure AD security, open-source tools, and bug bounties. I’ll be presenting at TECHMENTOR, Black Hat Arsenal, DEF CON demo labs, and Cloud Village. If you like to have a chat on anything Azure AD related, want to say hi or get AADInternals sticker, check my schedule! Aug 9: TECHMENTOR I’ll have two presentations at TECHMENTOR event at Microsoft HQ. Date Time Description Aug 9 1:30pm - 2:45pm TT07 User and Device Identities – The Foundation of Azure AD Security Aug 9 3:00pm - 4:15pm TT10 Protecting Azure AD and M365 from On-prem Attacks Aug 10: Black Hat I’ll have one theater session at Secureworks’ booth #2634. Date Time Description Aug 10 10:30am - 10:45pm Finding Weak Points Before the Hackers Do Aug 10 - 11: Black Hat Arsenal I’ll be presenting three open-source tools at Black Hat Arsenal with my Secureworks team mates. Date Time Description Aug 10 11:30am - 1:00pm Secureworks® Primary Refresh Token (PRT) viewer Aug 11 10:00am - 11:30pm WhiskeySAML and Friends Aug 11 2:30pm - 4:00pm AADInternals: The Swiss Army Knife for Azure AD & M365 Aug 12: DEF CON Cloud Village I’ll be talking at DEF CON Cloud Village about how to get the most out of Microsoft bounty programs . After-recording available here. Date Time Description Aug 12 10:50am - 11:30am Making the most of Microsoft cloud bug bounty programs: How I made in $65,000 USD in bounties in 2021 Aug 12: DEF CON Demo Labs I’ll be presenting AADInternals red team tools in DEF CON Demo Labs! Date Time Description Aug 12 2:00pm - 3:55pm AADInternals: The Ultimate Azure AD Hacking Toolkit AADInternals BlackHat DEFCON"
