["https://o365blog.com/tags/office365"]
title = "Office365"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "OSINT October 11, 2022 (Last Modified: January 20, 2025) Tenant information This Open-source Intelligence (OSINT) tool will extract openly available information for the given tenant. The tool is using APIs mentioned in my previous blog post and in MS Graph API documentation. Domain details is returned only for the 20 first domains. For complete recon information, please use AADInternals PowerShell module. Note: Username requests are now throttled! This service is not meant for monitoring users 🤷‍♂️ Note: CBA status is valid ONLY if email of an existing user is given. Bypassing OneDrive sync domain restrictions December 11, 2019 (Last Modified: January 19, 2020) OneDrive has a security option to allow syncing only from PCs joined to specific domains. In this blog, using the latest AADInternals toolkit (announced at Black Hat Europe 2019), I’ll show how the domain restrictions can be easily bypassed. Get a free custom domain for Office 365/Azure AD from www.myo365.site! February 20, 2018 (Last Modified: March 30, 2020) Did you know that you could get a free custom domain for your Office 365 or Azure AD tenant? Security vulnerability in Azure AD & Office 365 identity federation November 16, 2017 (Last Modified: July 24, 2018) In this blog, I will describe a security vulnerability I discovered and reported to Microsoft in October. The vulnerability was disclosed in LIVE!360 TECHMENTOR event in Orlando on Nov 16th 2017. LIVE!360 event started today November 12, 2017 LIVE!360 event started today at Loews Royal Pacific Resort in Orlando. Tools November 08, 2017 (Last Modified: October 11, 2022) Tools for hacking and administering Azure AD & Microsoft 365 Links October 12, 2017 (Last Modified: October 10, 2022) This article have all the important links you need to administer Office 365 Welcome to Office 365 blog September 27, 2017 Welcome to my Office 365 blog! In this blog I’ll discuss about various aspects of administering Office 365 suite."
