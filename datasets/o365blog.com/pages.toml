Microsoft.PowerShell.Archive Desk {Compress-Archive, Expand-Archive} Manifest 7.0.0.0 Microsoft.PowerShell.Host Core {Start-Transcript, Stop-Transcript} Manifest 7.0.0.0 Microsoft.PowerShell.Management Core {Add-Content, Clear-Content, Clear-ItemProp… Manifest 7.0.0.0 Microsoft.PowerShell.Security Core {Get-Credential, Get-ExecutionPolicy, Set-E… Manifest 7.0.0.0 Microsoft.PowerShell.Utility Core {Export-Alias, Get-Alias, Import-Alias, New… Script 1.4.7 PackageManagement Desk {Find-Package, Get-Package, Get-PackageProv… Script 2.2.4.1 PowerShellGet Desk {Find-Command, Find-DSCResource, Find-Modul… Script 2.0.5 PSDesiredStateConfiguration Core {Configuration, New-DscChecksum, Get-DscRes… Script 2.0.2 PSReadLine Desk {Get-PSReadLineKeyHandler, Set-PSReadLineKe… Binary 2.0.3 ThreadJob Desk Start-ThreadJob It is even possible to install AADInternals to Cloud Shell! However, as Cloud Shell is running on Linux, only .Net Core is supported. So everything will not work. Using Cloud Shell from PowerShell Technically, the Cloud Shell is nothing but a WebSocket connection to terminal session of a Linux box in Azure. Technical details The technical process to connect to Cloud Shell is as follows. Step one First, a HTTP request (PUT) is sent to: https://management.azure.com/providers/Microsoft.Portal/consoles/default?api-version=2020-04-01-preview The payload of the request is: {"properties":{"osType":"linux"}} The response includes an url for the gateway. { "properties": { "osType": "Linux", "provisioningState": "Succeeded", "uri": "https://gateway12.westeurope.console.azure.com:443/n/cc-20a66344/cc-20a66344" } } Step two Next, a HTTP request (POST) is sent to the gateway url with the size information (rows and columns) and the shell type (bash or pwsh): https://gateway12.westeurope.console.azure.com/n/cc-20a66344/cc-20a66344/terminals?cols=124&rows=13&version=2019-01-01&shell=pwsh The response includes the url for the terminal WebSocket. { "id": "0ca733551cd94ce83f8d6a1b023ff8ef", "socketUri": "wss://gateway12.westeurope.console.azure.com/n/cc-20a66344/cc-20a66344/terminals/0ca733551cd94ce83f8d6a1b023ff8ef", "idleTimeout": "20", "tokenUpdated": true, "rootDirectory": "/home/admin" } Step three Next, a HTTP request (POST) is sent to the gateway for authorization: https://gateway12.westeurope.console.azure.com/n/cc-20a66344/cc-20a66344/authorize The response includes the authorization token. {"token":"KtkU1c9zXEh1jidHf6xYskuZL5N4WujFsiw043VDEm0mq7MjBnbOKJR92nmoWazUL4yFEcm4PRRq4r5KJag"} Step four The final step is make a WebSocket connection to the gateway address: wss://gateway12.westeurope.console.azure.com/n/cc-20a66344/cc-20a66344/terminals/0ca733551cd94ce83f8d6a1b023ff8ef The authorization token must be included in a cookie: Cookie: auth-token=KtkU1c9zXEh1jidHf6xYskuZL5N4WujFsiw043VDEm0mq7MjBnbOKJR92nmoWazUL4yFEcm4PRRq4r5KJag After the connection is made, all keystrokes from the (local) PowerShell are sent through the WebSocket to Azure. Also everything sent from the Azure through the WebSocket are printed to console. The output from the Azure are VT100 based control character sequences. Luckily, since around 2018, PowerShell console supports VT100! So, all I had to do was to pipe things directly between PowerShell console and Cloud Shell. Making the connection Connecting to Cloud Shell with AADInternals is pretty straight forward: # Get access token Get-AADIntAccessTokenForCloudShell -SaveToCache # Start the Cloud Shell (PowerShell) Start-AADIntCloudShell To start a Bash shell instead: # Start the Cloud Shell (Bash) Start-AADIntCloudShell -Shell Bash To exit from the Cloud Shell, type exit You can also move between PowerShell and Bash in Cloud Shell. To start a bash shell while in PowerShell, type bash. To start PowerShell while in Bash, type pwsh. References Microsoft: Overview of Azure Cloud Shell Microsoft: Console Virtual Terminal Sequences'
