full_description = "AADInternals published! October 25, 2018 (Last Modified: October 26, 2018) For the last couple months I’ve used most of my free time on studying and hacking Azure AD admin APIs. As a result, I’m finally publishing the first (beta) version of the AADInternals PowerShell module. Block user access to Azure AD PowerShell and Graph API Explorer August 27, 2018 (Last Modified: November 09, 2021) By default, any user of Office 365 or Azure AD tenant can read the content of Azure AD using PowerShell and Graph API Explorer. This is a serious security issue because users have undetectable access to other users’ personal data, which violates for instance GDPR. In this blog, I’ll tell how to prevent the access. Technical deep dive to Microsoft Teams (free) July 25, 2018 Microsoft Teams has been available for free since July 2018. In this blog, I’ll deep dive to its technical details. How to use a non-routable on-premises UPN with Office 365 and Azure AD July 24, 2018 I’ve recently noticed that many organisations moving to Office 365 are struggling with their current on-premises non-routable UPNs. In this blog, I’ll show how to use Office 365 without altering on-premises UPNs. Chasing the Unicorn: PowerShell module for 'The Secret Office 365 Forensics Tool' July 02, 2018 (Last Modified: July 13, 2018) In June 2018 the existence of secret Office 365 forensics tool was confirmed. The tool refers to Microsoft’s undocumented Exchange Online Activities API. The API provides access to a granular mail activity events for up to six months old data! To provide administrators with easy access to the API, I created a PowerShell module (EXOMailActivity). In this blog, I’ll show you how to use the module to get access to mail activity data. Admin: Take back control of Office 365 Groups, Teams, and Planner! May 31, 2018 (Last Modified: July 11, 2018) Office 365 groups is a great way to promote collaboration between people inside and outside organisations. By default, users are able to create groups freely, making their use easy. However, in many organisations, this has led to chaos. In this blog, I show how you can get back the control of Office 365 groups, Teams and Planner."
