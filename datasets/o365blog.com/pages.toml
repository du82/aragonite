["https://o365blog.com/post/hybridhealthagent"]
title = "Spoofing Azure AD sign-ins logs by imitating AD FS Hybrid Health Agent"
description = """
Azure AD Connect Health is a feature that allows viewing the health of on-prem hybrid infrastructure components, including Azure AD Connect and AD FS servers.
Health information is gathered by agents installed on each on-prem hybrid server. Since March 2021, also AD FS sign-in events are gathered and sent to Azure AD.

In this write-up (based on a Threat Analysis report by Secureworks), I’ll explain how anyone with a local administrator access to AD FS server (or proxy), can create arbitrary sign-ins events to Azure AD sign-ins log.
Moreover, I’ll show how Global Administrators can register fake agents to Azure AD - even for tenants not using AD FS at all."""
full_description = 'Spoofing Azure AD sign-ins logs by imitating AD FS Hybrid Health Agent July 08, 2021 (Last Modified: September 08, 2021) blog Introduction Hybrid Health agent for AD FS Process and protocol details Step 1: Log in Step 2: Write Event Id 1200 Step 3: Read Events Step 4: Get Service Access Token Step 5: Get Blob Upload Key Step 6: Get Event Publisher Key Step 7: Upload Events to blob storage Step 8: Send signature to events hub Spoofing sign-ins log with AADInternals Tampering with sign-ins log Registering fake agents with AADInternals v0.5.0 and later Registering hybrid health service Registering AD FS server Creating fake events Removing fake services and agents How to detect Exporting agent secrets Spoofing Registering fake services How to prevent Summary References Azure AD Connect Health is a feature that allows viewing the health of on-prem hybrid infrastructure components, including Azure AD Connect and AD FS servers. Health information is gathered by agents installed on each on-prem hybrid server. Since March 2021, also AD FS sign-in events are gathered and sent to Azure AD. In this write-up (based on a Threat Analysis report by Secureworks), I’ll explain how anyone with a local administrator access to AD FS server (or proxy), can create arbitrary sign-ins events to Azure AD sign-ins log. Moreover, I’ll show how Global Administrators can register fake agents to Azure AD - even for tenants not using AD FS at all. Introduction Per Azure AD Connect Health documentation: Azure Active Directory (Azure AD) Connect Health provides robust monitoring of your on-premises identity infrastructure. It enables you to maintain a reliable connection to Microsoft 365 and Microsoft Online Services. This reliability is achieved by providing monitoring capabilities for your key identity components. Also, it makes the key data points about these components easily accessible. After configuration and installation, we can see the health of AD FS services in the Azure AD Portal: We can also drill-down to see details: The logical structure of the hybrid health AD FS services in ArchiMate notation can be seen below: The service represents the AD FS service and has the name equal to the hostname property of AD FS service: # Get the AD FS service name Get-AdfsProperties | Select Hostname HostName -------- sts.fake.myo365.site The service consists of service members, which can be either federation server or federation server proxy. Service members names are equal equal to the hostname of the server or the proxy: # Get the computer host name $env:COMPUTERNAME SERVER To get things going, an agent need to be installed on each AD FS and proxy server. License requirements to use Azure AD Connect Health is Azure AD Premium P1 or P2. Hybrid Health agent for AD FS The Health Agent for AD FS has been there for years to report the health of the service. In March 2021, Microsoft announced that a public preview for AD FS sign-ins in Azure AD reporting is available to all customers. As soon as this was announced, I took a brief look and noticed that the agent is using Azure service bus (same than PTA authentication and Azure Web Application Proxy). Finally, at the end of May, I had time for proper research. Technically, in Azure AD, there are individual logs for a different types of sign-ins: SignInLogs NonInteractiveUserSignInLogs ServicePrincipalSignInLogs ManagedIdentitySignInLogs ProvisioningLogs ADFSSignInLogs RiskyUsers UserRiskEvents The “normal” Azure AD sign-ins events are stored to a log called SignInLogs and AD FS sign-ins to a log called ADFSSignInLogs: If the organisation has an Azure subscription, ADFSSignInLogs can be exported to Log Analytics workspace to be viewed and analysed. Below is an example of events extracted from Log Analytics: Administrators can view sign-ins logs in Azure Admin Portal. However, there is no dedicated tab for ADFSSignInLogs. Instead, AD FS log-in events are shown in User sign-ins (interactive) alongside “normal” Azure AD sign-ins events. Below is an example where we can see AD FS log-in events from above in Azure AD sign-ins log: The Health Agent for AD FS consists of three services. The one that is responsible for sending the events to Azure AD is Azure AD Connect Health AD FS Insights Service: Process and protocol details The overall process how AD FS sign-ins events are gathered and sent to Azure AD is illustrated below: Step 1: Log in First, a user logs in to AD FS using any method configured and available for the user. Step 2: Write Event Id 1200 During and after a successful or failed log-in, AD FS server writes multiple auditing events to Security log. Auditing is turned on during the installation of the agent and is a prerequisite for gathering events. The Event Id 1200 contains details about the log-in event: <?xml version="1.0" encoding="utf-16"?> <AuditBase xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:type="AppTokenAudit"> <AuditType>AppToken</AuditType> <AuditResult>Success</AuditResult> <FailureType>None</FailureType> <ErrorCode>N/A</ErrorCode> <ContextComponents> <Component xsi:type="ResourceAuditComponent"> <RelyingParty>urn:federation:MicrosoftOnline</RelyingParty> <ClaimsProvider>AD AUTHORITY</ClaimsProvider> <UserId>AADINTERNALS\test</UserId> </Component> <Component xsi:type="AuthNAuditComponent"> <PrimaryAuth>urn:oasis:names:tc:SAML:2.0:ac:classes:PasswordProtectedTransport</PrimaryAuth> <DeviceAuth>false</DeviceAuth> <DeviceId>N/A</DeviceId> <MfaPerformed>false</MfaPerformed> <MfaMethod>N/A</MfaMethod> <TokenBindingProvidedId>false</TokenBindingProvidedId> <TokenBindingReferredId>false</TokenBindingReferredId> <SsoBindingValidationLevel>TokenUnbound</SsoBindingValidationLevel> </Component> <Component xsi:type="ProtocolAuditComponent"> <OAuthClientId>N/A</OAuthClientId> <OAuthGrant>N/A</OAuthGrant> </Component> <Component xsi:type="RequestAuditComponent"> <Server>http://sts.fake.myo365.site/adfs/services/trust</Server> <AuthProtocol>WSFederation</AuthProtocol> <NetworkLocation>Intranet</NetworkLocation> <IpAddress>10.10.10.30</IpAddress> <ForwardedIpAddress /> <ProxyIpAddress>N/A</ProxyIpAddress> <NetworkIpAddress>N/A</NetworkIpAddress> <ProxyServer>N/A</ProxyServer> <UserAgentString>Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36</UserAgentString> <Endpoint>/adfs/ls/</Endpoint> </Component> </ContextComponents> </AuditBase> Step 3: Read Events The agent reads (at least) all Id 1200 events. The agent seems to be monitoring the Security log for changes. Step 4: Get Service Access Token The agent gets a Service Access Token from Azure AD. The token is fetched by making HTTP POST request to: https://s1.adhybridhealth.azure.com/oauth2/token The body of the request is (line changes added): grant_type=client_credentials&client_secret=<client_secret>&client_id=<tenant_id>_<machine_id> <client_secret> is a so called AgentKey, which is stored to the registry of AD FS server. The AgentKey is “protected” with DPAPI. <client_id> is a combination of the tenant id and machine id. Both of the values are also stored to the registry. Parameter Registry location client_secret HKLM:\SOFTWARE\Microsoft\ADHealthAgent\AgentKey tenant_id HKLM:\SOFTWARE\Microsoft\ADHealthAgent\TenantId machine_id HKLM:\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent\MachineIdentity As a response, we will have a JSON file containing the service access token: { "access_token": "2Fx1s5Th9h4...D4efhRG4", "token_type": "bearer", "expires_in": 3599 } The service access token is NOT a standard JWT token, but some Microsot encrypted blob. The token is valid for (almost) an hour. Step 5: Get Blob Upload Key The agent gets a Blob Upload Key that is required to send the actual events to Azure AD. The key is fetched by making HTTP GET request to: https://s1.adhybridhealth.azure.com/providers/Microsoft.ADHybridHealthService/monitoringpolicies/<service_id>/keys/BlobUploadKey <service_id> refers to the id of AD FS service registered to Azure AD during the first agent installation. The id not shown in the Azure Portal, but is luckily also stored to the registry. Parameter Registry location service_id HKLM:\SOFTWARE\Microsoft\ADHealthAgent\ADFS\ServiceId The Service Access Token from the previous step is included in the Authorization header: Authorization: Bearer <service access token> As a response, we will get a URL for the blob storage with a working shared access signature (SAS) token. The <service_id> is the service id sent in the request. https://adhsprodweuaadsynciadata.blob.core.windows.net/adfederationservice-<service_id>?sv=2018-03-28&sr=c&sig=RCrQOWOLr%2FjHIX6%2FxCti1bPmbHgkp4T9eLS07uP%2FyKM%3D&se=2021-07-10T08%3A01%3A46Z&sp=w Step 6: Get Event Publisher Key The agent gets an Event Publisher Key that is required to send the signature of the events blob to Azure AD. The key is fetched by making HTTP GET request to: https://s1.adhybridhealth.azure.com/providers/Microsoft.ADHybridHealthService/monitoringpolicies/<service_id>/keys/EventHubPublisherKey <service_id> is the same as in the previous step, and the service access token is also used similarly for authentication. As a response, we will get a JSON file that is just a single string containing Azure Service Bus endpoint and other related information, including another SAS token. "Endpoint=sb://adhsprodweuehadfsia.servicebus.windows.net/;SharedAccessSignature=SharedAccessSignature sr=sb%3a%2f%2fadhsprodweuehadfsia.servicebus.windows.net%2fadhsprodweuehadfsia%2fPublishers%2f658fe106-a59d-404e-985b-0c1bf3b4f72d&sig=4%2bZ%2bNurnA4%2b4t6dvTG8kqraJMlNzxKF0KFjiBIaZUw4%3d&se=1625904056&skn=RootManageSharedAccessKey;EntityPath=adhsprodweuehadfsia;Publisher=658fe106-a59d-404e-985b-0c1bf3b4f72d" Step 7: Upload Events to blob storage The events are sent to blob storage as a json file, which consists of an array of event objects. Below is the json file for the event from the step 2: 1[ 2 { 3 "UniqueID": "434c2d29-a4a0-4ce2-86f5-1679bbadc948", 4 "Server": "SERVER", 5 "EventType": 1, 6 "PrimaryAuthentication": 33, 7 "RequiredAuthType": 1, 8 "RelyingParty": "urn:federation:MicrosoftOnline", 9 "RelyingPartyName": "", 10 "Result": true, 11 "DeviceAuthentication": false, 12 "URL": "/adfs/ls", 13 "User": 1350057402, 14 "UserId": "AADINTERNALS\\test", 15 "UserIdType": 10, 16 "UPN": "test@fabrikam.azurelabs.online", 17 "Timestamp": "2021-07-09T07:03:54.9506592Z", 18 "Protocol": 2, 19 "NetworkLocation": 1, 20 "AppTokenFailureType": 0, 21 "IPAddress": "10.10.10.30", 22 "ClaimsProvider": null, 23 "OAuthClientID": null, 24 "OAuthTokenRetrievalMethod": null, 25 "MFA": null, 26 "MFAProviderErrorCode": null, 27 "ProxyServer": null, 28 "Endpoint": "/adfs/ls/", 29 "UserAgent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36", 30 "DeviceID": "", 31 "ErrorHitCount": 0, 32 "X509CertificateType": null, 33 "MFAAuthenticationType": null, 34 "ActivityId": "b91630ee-984e-40ff-a7ea-ffefdb472048", 35 "ActivityIdAutoGenerated": false, 36 "PrimarySid": "S-1-5-21-2918793985-2280761178-2512057791-1602", 37 "ImmutableId": "rJcYmpdAz0i3VB7sI6ZDcg==" 38 } 39] Note: From the identity information (rows 14, 16, 36, and 37 from the json file above) Azure AD only cares about UPN. All log-in events are sent to Azure AD. However, only those events having an UPN of an existing Azure AD user is added to ADFSSignInLog. Before sending the json file, it is compressed using Gzip. Agent sents the compressed json file to the blob storage by making HTTP POST to the url received in step 5. The url is modified by adding a file name and api-version to it: https://adhsprodweuaadsynciadata.blob.core.windows.net/adfederationservice-<service_id>/<id>.json?sv=2018-03-28&sr=c&sig=RCrQOWOLr%2FjHIX6%2FxCti1bPmbHgkp4T9eLS07uP%2FyKM%3D&se=2021-07-10T08%3A01%3A46Z&sp=w&api-version=2017-04-17 <service_id> is the same than in the previous steps and <id> is a random GUID identifying the sent events. The following HTTP headers are used: User-Agent: Azure-Storage/8.2.0 (.NET CLR 4.0.30319.42000; Win32NT 10.0.17763.0) x-ms-version: 2017-04-17 Content-MD5: <MD5Hash> x-ms-blob-type: BlockBlob x-ms-client-request-id: <id> <Md5Hash> is the MD5 hash calculated from the Gzip compressed json file. <id> is the same id used above. Step 8: Send signature to events hub Before calculating the signature to be sent to the events hub, we need to derive the signature key (this is very interesting): SHA512 hash is calculated from the AgentKey. The AgentKey is a base 64 encoded byte array, but the hash is calculated from the b64 string by converting it to the byte array of ASCII values! The resulting (binary) hash is converted to hex string. Signing key is a result of converting the hex string to byte array by using base 64 decoding !??!?? The next step is to define the string to be signed: <tenant_id>,<service_id>,<machine_id>,Adfs-UsageMetrics,<blob_url>,<date_string> <tenant_id>,<service_id>,<machine_id> are the values from the steps 4 and 5. <blob_url> is the url used in the previous step but without query parameters. <date_string> is the signing time (UTC) in sortable format like: 2021-07-09T10:43:35 Signature is calculated by converting the string to a byte array of UNICODE values and by calculating a HMACSHA512 from it using the signing key calculated earlier. Finally, the signature is base 64 encoded. Using the endpoint URL from the step 6. a connection is made to Azure Service Bus. Below is the screenshot from Fiddler showing the actual message containing the string to be signed and the actual signature. After sending the signature, the events are shown in the log in 15 minutes or so (can take much longer too). Spoofing sign-ins log with AADInternals AADInternals v0.5.0 includes the functionality to create fake events using the Hybrid Health Service protocol. First, we need to get the agent information (requires local administrator rights to AD FS server): # Get the agent information and save to a variable $agentInfo = Get-AADIntHybridHealthServiceAgentInfo Second, we create an array of fake events. This and the next step can be done from any internet-joined computer using the agent information from the previous step. # Create an array of fake events $events=@( New-AADIntHybridHealtServiceEvent -Server $agentInfo.Server -UPN "NestorW@contoso.azurelabs.online" -IPAddress "22.22.22.22" -NetworkLocationType Extranet -Timestamp (Get-Date).AddHours(-1) New-AADIntHybridHealtServiceEvent -Server $agentInfo.Server -UPN "DiegoS@contoso.azurelabs.online" -IPAddress "11.11.11.11" -NetworkLocationType Extranet ) Finally, we’ll send the events! I’m using -Verbose switch here to see what’s going on under-the-hood: # Send the events Send-AADIntHybridHealthServiceEvents -AgentInfo $agentInfo -Events $events -Verbose Output: VERBOSE: POST https://s1.adhybridhealth.azure.com/oauth2/toke'
