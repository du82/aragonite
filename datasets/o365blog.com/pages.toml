title = "Partner"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "Microsoft partners: The Good, The Bad, or The Ugly? December 11, 2021 (Last Modified: February 15, 2022) In 2018, I blogged first time about risks related to Delegated Administrative Privileges (DAP) given to Microsoft partners. Now, in 2021, Microsoft blogged how NOBELIUM exploited DAP to compromise customers of some Microsoft partners. In this blog, I’ll explain why DAP is so dangerous, how to exploit it, how to detect exploitation, and how to view partner related information with AADInternals v0.6.5. Partner Center PowerShell module sends telemetry data to Microsoft January 19, 2020 Microsoft has published a PowerShell module for their partners to ease and automate operations with their customers. This module is (quite intuitively) called Partner Center. While the module does well what it’s meant to do, it also tells Microsoft what the partners are doing."
