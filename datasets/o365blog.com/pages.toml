["https://o365blog.com/tags/security"]
title = "Security"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "Stealing and faking Azure AD device identities February 15, 2022 (Last Modified: February 17, 2022) In my previous blog posts I’ve covered details on PRTs, BPRTs, device compliance, and Azure AD device join. In this blog, I’ll show how to steal identities of existing Azure AD joined devices, and how to fake identies of non-AAD joined Windows devices with AADInternals v0.6.6. Deep-dive to Azure AD device join March 03, 2021 (Last Modified: September 10, 2021) Devices (endpoints) are a crucial part of Microsoft’s Zero Trust concept. Devices can be Registered, Joined, or Hybrid Joined to Azure AD. Conditional Access uses the device information as one of the decisions criteria to allow or block access to services. In this blog, I’ll explain what these different registration types are, what happens under-the-hood during the registration, and how to register devices with AADInternals v0.4.6. BPRT unleashed: Joining multiple devices to Azure AD and Intune January 31, 2021 (Last Modified: September 26, 2022) In October 2020, someone contacted me and asked whether it would be possible to create BPRTs using AADInternals. I hadn’t even heard of BPRTs, but was eventually able to help him to create BPRTs. Now this functionality is included in AADInternals v0.4.5. In this blog, I’ll explain what BPRTs are and how they can be used to join multiple devices to both Azure AD and Intune. I’ll also show the dark side of BPRTs: how they can be used to conduct DOS attacks against Azure AD, and how to detect and prevent this. Abusing Teams client protocol to bypass Teams security policies October 27, 2020 (Last Modified: October 29, 2020) Administrators can use teams policies for controlling what users can do in Microsoft Teams. In this blog, I’ll show that these policies are applied only in client and thus can be easily bypassed. AADInternals Cloud Identity Summit 2020 edition October 19, 2020 The new AADInternals release v0.4.4 AADInternals Cloud Identity Summit 2020 edition is now released! Read on to see the list of updates and new features."
