title = "Deep-dive to Azure AD device join"
description = "Dr Syynimaa works as Principal Identity Security Researcher at Microsoft Security Research.  Before his security researcher career, Dr Syynimaa worked as a CIO, consultant, trainer, and university lecturer for over 20 years. He is a regular speaker in scientific and professional conferences related to Microsoft 365 and Entra ID (Azure AD) security. Before joining Microsoft, Dr Syynimaa was Microsoft MVP in security category and Microsoft Most Valuable Security Researcher (MVR)."
full_description = 'Deep-dive to Azure AD device join March 03, 2021 (Last Modified: September 10, 2021) blog What is a device? Join Types Azure AD Registered Azure AD Joined Azure AD Hybrid Joined Technical details Device Object objectId deviceId deviceTrustType dirSyncEnabled isManaged isCompliant reserved1 onPremisesSecurityIdentifier profileType deviceSystemMetadata Join process Register Join Hybrid Join Conditional Access Single-Sign-On Joining devices with AADInternals Registering devices Joining devices Hybrid joining devices Hybrid joining to synced device - option 1 Hybrid joining to synced device - option 2 Hybrid joining by federation Summary References Devices (endpoints) are a crucial part of Microsoft’s Zero Trust concept. Devices can be Registered, Joined, or Hybrid Joined to Azure AD. Conditional Access uses the device information as one of the decisions criteria to allow or block access to services. In this blog, I’ll explain what these different registration types are, what happens under-the-hood during the registration, and how to register devices with AADInternals v0.4.6. What is a device? Technically, a device is one of the object types in Azure AD. The device object is sometimes called device identity. Where users are identified based on their credentials, devices are identified by certificates. In other words, a device certificate represents the device registered to Azure AD. These certificates are created during the registration process (this will be explained later). Join Types There are three different registration types, which are called Join Types. According to documentation these types are: Join Type Purpose Registered Devices that are Azure AD registered are typically personally owned or mobile devices and are signed in with a personal Microsoft account or another local account. Joined Devices that are Azure AD joined are owned by an organization and are signed in with an Azure AD account belonging to that organization. They exist only in the cloud. Hybrid Joined Devices that are hybrid Azure AD joined are owned by an organization and are signed in with an Active Directory Domain Services account belonging to that organization. They exist in the cloud and on-premises. Next, let’s view the documentation to see in detail the differences between these join types! Azure AD Registered According to documentation: The goal of Azure AD registered devices is to provide your users with support for the Bring Your Own Device (BYOD) or mobile device scenarios. In these scenarios, a user can access your organization’s Azure Active Directory controlled resources using a personal device. Azure AD Registered Description Definition Registered to Azure AD without requiring organizational account to sign in to the device Primary audience Applicable to all users with the following criteria: Bring your own device (BYOD)Mobile Devices Device ownership User or Organization Operating Systems Windows 10, iOS, Android, and MacOS Provisioning Windows 10 - Settings iOS/Android - Company Portal or Microsoft Authentication app MacOS - Company Portal Device sign in options End-user local credentialsPasswordWindows HelloPINBiometrics or Patter for other devices Key capabilities SSO to cloud resourcesConditional Access when enrolled into IntuneConditional Access via App protection policyEnables Phone sign in with Microsoft Authenticator app Azure AD Joined According to documentation: Azure AD join is intended for organizations that want to be cloud-first or cloud-only. Any organization can deploy Azure AD joined devices no matter the size or industry. Azure AD join works even in a hybrid environment, enabling access to both cloud and on-premises apps and resources. Azure AD Joined Description Definition Joined only to Azure AD requiring organizational account to sign in to the device Primary audience Suitable for both cloud-only and hybrid organizations.Applicable to all users in an organization Device ownership Organization Operating Systems All Windows 10 devices except Windows 10 HomeWindows Server 2019 Virtual Machines running in Azure (Server core is not supported) Provisioning Self-service: Windows OOBE or SettingsBulk enrollmentWindows Autopilot Device sign in options Organizational accounts using:PasswordWindows Hello for BusinessFIDO2.0 security keys Device management Mobile Device Management (example: Microsoft Intune)Co-management with Microsoft Intune and Microsoft Endpoint Configuration Manager Key capabilities SSO to both cloud and on-premises resourcesConditional Access through MDM enrollment and MDM compliance evaluationSelf-service Password Reset and Windows Hello PIN reset on lock screenEnterprise State Roaming across devices Azure AD Hybrid Joined According to documentation: Typically, organizations with an on-premises footprint rely on imaging methods to provision devices, and they often use Configuration Manager or group policy (GP) to manage them. If your environment has an on-premises AD footprint and you also want benefit from the capabilities provided by Azure Active Directory, you can implement hybrid Azure AD joined devices. These devices, are devices that are joined to your on-premises Active Directory and registered with your Azure Active Directory. Azure AD Joined Description Definition Joined to on-premises AD and Azure AD requiring organizational account to sign in to the device Primary audience Suitable for hybrid organizations with existing on-premises AD infrastructure.Applicable to all users in an organization Device ownership Organization Operating Systems Windows 10, 8.1, and 7Windows Server 2008/R2, 2012/R2, 2016, and 2019 Provisioning Windows 10, Windows Server 2016⁄2019Domain join by IT and autojoin via Azure AD Connect or ADFS configDomain join by Windows Autopilot and autojoin via Azure AD Connect or ADFS configWindows 8.1, Windows 7, Windows Server 2012 R2, Windows Server 2012, and Windows Server 2008 R2 - Require MSI Device sign in options Organizational accounts using:PasswordWindows Hello for Business for Win10 Device management Group PolicyConfiguration Manager standalone or co-management with Microsoft Intune Key capabilities SSO to both cloud and on-premises resourcesConditional Access through Domain join or through Intune if co-managedSelf-service Password Reset and Windows Hello PIN reset on lock screenEnterprise State Roaming across devices Technical details Now that we know the purpose of different join types let’s dive into technical details! Device Object Device objects are stored to Azure AD. Based on my research, here are the relevant attributes and their values related to different join types. Note! The attribute names presented here are those exposed by Azure Active Directory Graph API with api-version=1.61-internal query parameter. objectId The id of the Azure AD device object. deviceId The device id attribute of the Azure AD device object. For Hybrid Joined devices, equals to equals to objectGuid of the on-prem AD device object. deviceTrustType Indicates the join type. Join Type Value Registered Workplace Joined AzureAd Hybrid Joined ServerAd dirSyncEnabled Indicates whether the device is synchronised from the on-prem AD or not. True for Hybrid Joined devices. isManaged Indicates whether the device is managed or not. Always True for Hybrid Joined devices. For Registered and Joined devices, the attribute needs to be set by device management application or AADInternals Set‑AADIntDeviceCompliant function. isCompliant Indicates whether the device is compliant or not. Attribute needs to be set by device management application or AADInternals Set‑AADIntDeviceCompliant function. reserved1 The userCertificate attribute of the device from the on-prem AD object for Hybrid Joined devices. Public key with a subject name that equals to objectGuid of the on-prem AD device object. onPremisesSecurityIdentifier The security identifier (SID) of the on-prem AD device object. Only set for Hybrid Joined devices. profileType Always RegisteredDevice for Registered and Joined devices. For Hybrid Joined devices initially empty after synced from on-prem AD, set to registered after the actual join. deviceSystemMetadata Metadata about the device registration. Key Description CreationTime Time the device object was created. Example: “2/20/2021 8:52:52 AM” RegistrationAuthority Always set to “ADRS” RegistrationAuthTime For Registered and Joined devices, the epoch timestamp when the user who registered/joined the device was authenticated. Example: “1613810824” Note: The timestamp comes from user’s access token (nbf claim), which is always 5 minutes earlier than the actual login. RegistrationAuthMethods For Registered and Joined devices, the list of authentication methods used by the user who registered/joined the device. Can be any combination of “pwd”,“rsa”,“otp”,“fed”,“wia”,“mfa”,“mngcmfa”,“wiaormfa”,“none”. The PRT token created using this device will inherit this value.Can be changed with AADInternals Set‑AADIntDeviceRegAuthMethods function. Join process Now that we know the three different join types let’s dive to process how each of these join types are performed. Devices with different Join Type as seen in Azure AD portal: Register Registering devices to Azure AD has five steps: Generate Device key and Transport key. The registration software (depends on the device) generates two keysets called Device key (dkpub/dkpriv) and Transport key (tkpub/tkpriv). The private keys are stored in the device. The Device key is used to identify the device, whereas the Transport key is used to decrypt the session key when requesting the PRT (see this blog for details). A certificate signing request (SCR) for “CN=7E980AD9-B86D-4306-9425-9AC066FB014A” (dkpub) is generated with dkpriv. Request access token for Azure AD Join The registration software request access token for appid 1b730954-1685-4b74-9bfd-dac224a7b894 with 01cb2876-7ebd-4aa4-9cc9-d28bd4d359a9 audience. Return access token Enroll device A http POST request is made to “https[:]//enterpriseregistration.windows.net/EnrollmentServer/device/?api-version=1.0” to register the device to Azure AD: 1{ 2 "TransportKey": "UlNBMQAIAAADA[redacted]+Ht0sYG4vPqK1B2wQcnkO4cZhJ2Q==", 3 "JoinType": 4, 4 "DeviceDisplayName": "Registered Device", 5 "OSVersion": "C64", 6 "CertificateRequest": { 7 "Type": "pkcs10", 8 "Data": "MIICdDCCAVwCAQAwLzE[redacted]n/rOiQamubMpzL1eaEhWLH8v9hkxZic=" 9 }, 10 "TargetDomain": "contoso.com", 11 "DeviceType": "Commodore", 12 "Attributes": { 13 "ReuseDevice": true, 14 "ReturnClientSid": true, 15 "SharedDevice": false 16 } 17} The dkpub (row 8) and tkpriv (row 2) are Base64 encoded. The join type (row 3) indicates device registration. Return device certificate The return value contains the signed (dkpub) of the Device key (row 4) and its thumbprint (row 3). The owner of the device is also returned (row 7). 1{ 2 "Certificate": { 3 "Thumbprint": "EA9CE04D0FCFB4AB382E253B7F1BC48CBC60010B", 4 "RawBody": "MIID8jCC[redacted]IE34ylUixWmNVJj39HQ5ky4+0cY6JR1JovPLaCQ" 5 }, 6 "User": { 7 "Upn": "AllanD@contoso.com" 8 }, 9 "MembershipChanges": [{ 10 "LocalSID": "S-1-5-32-544", 11 "AddSIDs": ["S-1-12-1-4209995732-1115842628-132208791-3473393508", "S-1-12-1-1284395347-1172857899-2838897599-3439875365"] 12 } 13 ] 14} Join The process joining devices to Azure AD is identical to registering devices: Generate Device key and Transport key. Request access token for Azure AD Join Return access token Enroll device Only difference to the Registration is the JoinType (row 3): 1{ 2 "TransportKey": "UlNBMQAIAA[redacted]QkSnl0b8xkWqv5CKfBp8RQ==", 3 "JoinType": 0, 4 "DeviceDisplayName": "Joined Device", 5 "OSVersion": "Vic20", 6 "CertificateRequest": { 7 "Type": "pkcs10", 8 "Data": "MIICdDCCAVwCAQAwLz[redacted]2003EixNAH3U7ggIXgXBWwtVbs=" 9 }, 10 "TargetDomain": "contoso.com", 11 "DeviceType": "Commodore", 12 "Attributes": { 13 "ReuseDevice": true, 14 "ReturnClientSid": true, 15 "SharedDevice": false 16 } 17} Return device certificate Hybrid Join As mentioned earlier, hybrid joined devices are joined to both on-prem AD and Azure AD. Hybrid Joining is similar to Registering and Joining, but there are some big differences. First, the device object has to exist in Azure AD before the join can be performed. There are two ways to create the hybrid device object to Azure AD: it can be synced from on-prem AD with Azure AD Connect, or it can be generated via identity federation. With the latter way, the device object is created immediately to Azure AD, whereas the former method creates the object during the next synchronisation cycle. Second, the device is joined by the system, not the user. The authentication method used during the joining depends on how the device object is created to Azure AD: For the Azure AD Connect synchronisation, the authentication is performed by signing a part of the enrollment request with the private key of the computer’s machine certificate. Azure AD can verify the computer’s identity by validating the signature with the public key of the machine certificate. The public key is saved in Azure AD in the reserved1 attribute of the device object. For the identity federation, the authentication is performed by requesting a SAML token from AD FS and requesting an access token from Azure AD with that SAML token. The resulting access token is then used for the enrollment request. Let’s start with the Azure AD Connect synchronisation flow: Generate Machine certificate Set the value of userCertificate attribute of the device’s on-prem AD object to match the public key of the Machine certificate. Synchronise the device object to Azure AD. The Device Id attribute of the device’s Azure AD object is set to ObjectGuid of the device’s on-prem AD object. Generate Device key and Transport key. Enroll device The http POST request is a bit different than with Register and Join: 1{ 2 "ServerAdJoinData": { 3 "DeviceType": "Windows", 4 "TransportKey": "UlNBMQAIAAA[redacted