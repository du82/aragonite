["https://o365blog.com/tags/aadinternals"]
title = "Aadinternals"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "AADInternals World Tour August 2022: USA August 01, 2022 (Last Modified: August 16, 2022) In August 2022, I’ll have several presentations regarding Azure AD security, open-source tools, and bug bounties. I’ll be presenting at TECHMENTOR, Black Hat Arsenal, DEF CON demo labs, and Cloud Village. If you like to have a chat on anything Azure AD related, want to say hi or get AADInternals sticker, check my schedule! Deep-dive to Azure AD Pass-Through Authentication March 30, 2020 In my earlier blog, I explained how Azure AD identity federation works under-the-hood. In this post, I’ll be doing the same with Azure AD pass-through authentication (PTA). Bypassing OneDrive sync domain restrictions December 11, 2019 (Last Modified: January 19, 2020) OneDrive has a security option to allow syncing only from PCs joined to specific domains. In this blog, using the latest AADInternals toolkit (announced at Black Hat Europe 2019), I’ll show how the domain restrictions can be easily bypassed. How to create a backdoor to Azure AD - part 2: Seamless SSO and Kerberos October 30, 2019 (Last Modified: August 05, 2020) In my earlier blog post I explained how to create a backdoor to Azure AD using an identity federation vulnerability feature I discovered in 2017. In this blog post, I’ll explain how to create a backdoor using Seamless SSO and how to exploit it using forged Kerberos tickets. Abusing Azure Active Directory at t2.fi 2019 October 18, 2019 On October 25th, I’ll be talking at t2.fi infosec conference in Helsinki. In this blog, I’ll tell what to expect in my Abusing Azure Active Directory: Who would you like to be today? presentation. Azure AD Seamless SSO allows enumerating tenant users October 03, 2019 (Last Modified: February 17, 2021) In 2017, Oliver Morton introduced a feature he found in Office 365 Active Sync, allowing enumerating the existence of the users based on http status codes. (Update: The “feature” was fixed by Microsoft on mid November 2019). In this blog, I’ll introduce my similar findings on using Microsoft API to enumerate users when Seamless SSO is enabled in Azure AD tenant."
