["https://o365blog.com/post/ps-profile"]
title = "Using PowerShell profile to connect to Office 365"
description = "Dr Syynimaa works as Principal Identity Security Researcher at Microsoft Security Research.  Before his security researcher career, Dr Syynimaa worked as a CIO, consultant, trainer, and university lecturer for over 20 years. He is a regular speaker in scientific and professional conferences related to Microsoft 365 and Entra ID (Azure AD) security. Before joining Microsoft, Dr Syynimaa was Microsoft MVP in security category and Microsoft Most Valuable Security Researcher (MVR)."
full_description = 'Using PowerShell profile to connect to Office 365 October 10, 2017 blog What is a PowerShell profile? Creating a profile PowerShell profile makes connecting to Office 365 a lot easier! What is a PowerShell profile? PowerShell profile is simply a PowerShell script that is executed whenever you launch a new PowerShell session. You can have a profile which applies to all users or just to you. To automate the connection to Office 365 you should use the latter one. The path of the profile file is stored in $profile variable. You can easily find the location by “executing” the variable: # Print the location of the PowerShell profile $profile Note: There is a separate profile for both PowerShell and ISE! You can also check whether the profile file exists. The following command returns True if the profile exists: # Check if the profile exists Test-Path $profile Creating a profile If the profile does not exist, you first need to create one. Easies way is (naturally) to do it with PowerShell: # Create a new profile file with required directory structure New-Item -Path $profile -ItemType File -Force Make not of the file name and open it in your favorite editor, such as PowerShell ISE. Next we will create a script that connects you to Office 365 services. Usually you connect to Office 365 by using saved credentials. Credentials are first saved to variable using Get-Credential command, which shows a login prompt where you enter your username and password. To speed up the process, you can give your username as parameter so you only need to enter your password. Below is an example of a profile which is based to our connection script from the PowerShell article. # Save credentials and tenant for later use $cred=Get-Credential -UserName "youradmin@yourdomain.com" -Message "Office 365" $tenant="yourtenant" # Check for null before connecting if($cred -ne $null){ # Connect to Office 365 (Azure AD) Connect-MsolService -credential $cred # Connect to SharePoint Online Connect-SPOService -Url https://$tenant-admin.sharepoint.com -Credential $cred # Connect to Skype for Business $s4bses = New-CsOnlineSession -Credential $cred Import-PSSession $s4bses # Connect to Exchange Online $exses = New-PSSession -ConfigurationName Microsoft.Exchange -ConnectionUri https://outlook.office365.com/powershell-liveid/ -Credential $cred -Authentication Basic -AllowRedirection Import-PSSession $exses } After saving the file, you will be prompted for the password every time start a new PowerShell session. To skip connecting, simply click cancel or hit the escape button. PowerShell DNS'
