full_description = "Deep-dive to Azure AD Pass-Through Authentication March 30, 2020 In my earlier blog, I explained how Azure AD identity federation works under-the-hood. In this post, I’ll be doing the same with Azure AD pass-through authentication (PTA). How to create a backdoor to Azure AD - part 2: Seamless SSO and Kerberos October 30, 2019 (Last Modified: August 05, 2020) In my earlier blog post I explained how to create a backdoor to Azure AD using an identity federation vulnerability feature I discovered in 2017. In this blog post, I’ll explain how to create a backdoor using Seamless SSO and how to exploit it using forged Kerberos tickets. Abusing Azure Active Directory at t2.fi 2019 October 18, 2019 On October 25th, I’ll be talking at t2.fi infosec conference in Helsinki. In this blog, I’ll tell what to expect in my Abusing Azure Active Directory: Who would you like to be today? presentation. AADInternals at Black Hat USA 2019 Arsenal! July 10, 2019 (Last Modified: August 09, 2019) I was honoured to hear that I was accepted to present my AADInternals toolkit at the most respected information security event in the world: Black Hat USA 2019. This is clearly one of my greatest professional achievements so far! In this blog, I’ll briefly introduce what to expect in my demo at Black Hat Arsenal. How to create a backdoor to Azure AD - part 1: Identity federation November 21, 2018 (Last Modified: August 05, 2020) On November 2018 Azure AD MFA was down over 12 hours preventing users from logging in to Office 365. Same happened in October 2019 in US data centers. As MFA is usually mandatory for administrators by company policy, they couldn’t log in either. In this blog, I’ll show how to create a backdoor to Azure AD so you can log in and bypass MFA. AADInternals published! October 25, 2018 (Last Modified: October 26, 2018) For the last couple months I’ve used most of my free time on studying and hacking Azure AD admin APIs. As a result, I’m finally publishing the first (beta) version of the AADInternals PowerShell module."
