full_description = 'Using Azure Cloud Shell from PowerShell September 30, 2020 blog What Azure Cloud Shell Using Cloud Shell from PowerShell Technical details Step one Step two Step three Step four Making the connection References Azure Cloud Shell is a browser-based shell for managing Azure resources using your favourite shell, Bash or PowerShell. Cloud Shell is typically used from Azure Portal. It provides an easy access to Azure CLI, Azure PowerShell and Azure AD PowerShell. In this blog, I’ll introduce a new way to access Cloud Shell from PowerShell (requires AADInternals v0.4.3 or newer). What Azure Cloud Shell As per Microsoft documentation: Azure Cloud Shell is an interactive, authenticated, browser-accessible shell for managing Azure resources. It provides the flexibility of choosing the shell experience that best suits the way you work, either Bash or PowerShell. Cloud Shell can be accessed in four different ways: Using a direct link (shell.azure.com), from Azure portal, from docs.microsoft.com code snippets, and now from PowerShell with AADInternals. Typically, the Cloud Shell is used from the Azure portal: The nicest feature of the Cloud Shell is that it comes with pre-installed PowerShell and CLI tools for managing Azure. For instance, listing the available PowerShell modules shows that we have all we need to manage Azure and Azure AD. PS /home/admin> Get-Module -ListAvailable Directory: /usr/local/share/powershell/Modules ModuleType Version PreRelease Name PSEdition ExportedCommands ---------- ------- ---------- ---- --------- ---------------- Script 4.7.0 Az Core,Desk Script 1.9.4 Az.Accounts Core,Desk {Disable-AzDataCollection, Disable-AzContex… Script 1.1.1 Az.Advisor Core,Desk {Get-AzAdvisorRecommendation, Enable-AzAdvi… Script 1.3.0 Az.Aks Core,Desk {Get-AzAksCluster, New-AzAksCluster, Remove… Script 1.1.4 Az.AnalysisServices Core,Desk {Resume-AzAnalysisServicesServer, Suspend-A… Script 2.1.0 Az.ApiManagement Core,Desk {Add-AzApiManagementApiToGate