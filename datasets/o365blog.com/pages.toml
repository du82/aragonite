full_description = 'OSINT October 11, 2022 (Last Modified: January 20, 2025) Tenant information This Open-source Intelligence (OSINT) tool will extract openly available information for the given tenant. The tool is using APIs mentioned in my previous blog post and in MS Graph API documentation. Domain details is returned only for the 20 first domains. For complete recon information, please use AADInternals PowerShell module. Note: Username requests are now throttled! This service is not meant for monitoring users 🤷‍♂️ Note: CBA status is valid ONLY if email of an existing user is given. Using tenant id, domain name, or email of non-existing user may show false negatives. Note: AAD Connect cloud sync status may return false negatives. Enter tenant id, domain name, user email, or user object id: // Set focus to search field document.getElementById("search").focus() // If enter is pressed in search field, invoke the search function var input = document.getElementById("search"); // Execute a function when the user presses a key on the keyboard input.addEventListener("keypress", function(event) { if (event.key === "Enter") { event.preventDefault(); document.getElementById("bTenantInfo").click(); } }); No information found (or throttled user requests) PropertyValue DomainTypeSTS Office365 AzureAD Microsoft365 tools EntraID'
