["https://o365blog.com/tags/azure-active-directory/page/2"]
title = "Azure Active Directory"
description = "The toolkit for Azure AD hackers, bounty hunters, red/blue teamers"
full_description = "Azure AD Seamless SSO allows enumerating tenant users October 03, 2019 (Last Modified: February 17, 2021) In 2017, Oliver Morton introduced a feature he found in Office 365 Active Sync, allowing enumerating the existence of the users based on http status codes. (Update: The “feature” was fixed by Microsoft on mid November 2019). In this blog, I’ll introduce my similar findings on using Microsoft API to enumerate users when Seamless SSO is enabled in Azure AD tenant. AADInternals at Black Hat USA 2019 Arsenal! July 10, 2019 (Last Modified: August 09, 2019) I was honoured to hear that I was accepted to present my AADInternals toolkit at the most respected information security event in the world: Black Hat USA 2019. This is clearly one of my greatest professional achievements so far! In this blog, I’ll briefly introduce what to expect in my demo at Black Hat Arsenal. Deep-dive to Azure Active Directory Identity Federation June 12, 2019 (Last Modified: October 30, 2019) Identity federation is regarded as the most secure way to authenticate users to Azure AD. In this blog, I’ll deep-dive to identity federation implementation of Azure AD and point out some serious security issues. How to create a backdoor to Azure AD - part 1: Identity federation November 21, 2018 (Last Modified: August 05, 2020) On November 2018 Azure AD MFA was down over 12 hours preventing users from logging in to Office 365. Same happened in October 2019 in US data centers. As MFA is usually mandatory for administrators by company policy, they couldn’t log in either. In this blog, I’ll show how to create a backdoor to Azure AD so you can log in and bypass MFA. AADInternals published! October 25, 2018 (Last Modified: October 26, 2018) For the last couple months I’ve used most of my free time on studying and hacking Azure AD admin APIs. As a result, I’m finally publishing the first (beta) version of the AADInternals PowerShell module. Block user access to Azure AD PowerShell and Graph API Explorer August 27, 2018 (Last Modified: November 09, 2021) By default, any user of Office 365 or Azure AD tenant can read the content of Azure AD using PowerShell and Graph API Explorer. This is a serious security issue because users have undetectable access to other users’ personal data, which violates for instance GDPR. In this blog, I’ll tell how to prevent the access."
