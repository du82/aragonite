["https://oag.ca.gov/charities/forms"]
title = "Forms | State of California - Department of Justice - Office of the Attorney General"
description = "Updated Forms for 2022  Updated forms are available for download and are required with any filings received by the Registry on or after January 1, 2022. Significant changes include fee updates for charity, raffle and professional fundraiser applicants and registrants. Before registering, renewing or reporting each year, please always download the latest forms available from the appropriate program page using the menu on the right.  Charity registrants’ annual renewal fee schedule is updated on Form RRF-1. All registrants have a renewal fee based on total revenue."
