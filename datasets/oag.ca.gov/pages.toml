["https://oag.ca.gov/charities/contacts"]
title = "Contacts | State of California - Department of Justice - Office of the Attorney General"
description = "We encourage you to first review the links to the individual programs on the right-side menu for Charities (Initial Registration, etc.), Nonprofit Raffles, Professional Fundraisers, and Complaints. Each program has Frequently Asked Questions which may address your question or provide a solution to your concern. If the answer to your question isn’t found on the program pages, use the links below to send your inquiry to the appropriate team. An analyst will contact you with a response, if necessary. Depending on your question, responses may take up to 30 days."
