["https://oag.ca.gov/about"]
title = "Attorney General Rob Bonta | State of California - Department of Justice - Office of the Attorney General"
description = "Click for high-resolution photo. On April 23, 2021, Rob Bonta was sworn in as the 34th Attorney General of the State of California, the first person of Filipino descent and the second Asian-American to occupy the position. Attorney General Bonta's passion for justice and fairness was instilled in him by his parents, who served on the frontlines of some of America's most important social justice movements."
