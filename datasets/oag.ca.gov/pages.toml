["https://oag.ca.gov/careers/descriptions/cjis"]
title = "California Justice Information Services | State of California - Department of Justice - Office of the Attorney General"
description = "The mission of the California Justice Information Services (CJIS) Division is to provide accurate, timely, and comprehensive criminal history and analysis data to its client agencies, which include California’s local police and sheriff’s departments, district attorneys, and local and state regulatory agencies. In addition, the division supports the critical Department of Justice (DOJ) information technology infrastructure. The CJIS Division is also the bridge for these services to the federal and other states’ criminal justice agencies."
