["https://oag.ca.gov/children-seniors"]
title = "Protecting Children & Seniors | State of California - Department of Justice - Office of the Attorney General"
description = "The Attorney General has a responsibility for protecting children and seniors from harm. This responsibility comes in many forms: Investigating and prosecuting physical elder abuse committed by employees against patients in elder care facilities. Investigating and prosecuting skilled nursing homes, hospitals, and residential care facilities for adopting policies or promoting practices that lead to neglect and poor quality of care. Conducting surprise, on-site inspections of California's skilled nursing facilities."
