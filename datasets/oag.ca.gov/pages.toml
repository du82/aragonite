["https://oag.ca.gov/health-care"]
title = "Health Care | State of California - Department of Justice - Office of the Attorney General"
description = "The Healthcare Rights and Access Section serves as the lead in proactive healthcare work, representing the Attorney General in his independent capacity and coordinating this work with others in the Department of Justice, including the Solicitor General’s Office and other legal sections in the Public Rights and Civil Law Divisions. The Section has comprehensive authority to work on any matters, including investigations, litigation, and legislation, that will increase and protect the affordability, accessibility, and quality of healthcare in the State of California."
