["https://oag.ca.gov/hiddenfees"]
title = "SB 478 - Hidden Fees | State of California - Department of Justice - Office of the Attorney General"
description = "Beginning July 1, 2024, the “Honest Pricing Law” or “Hidden Fees Statute,” SB 478, which was recently amended by SB 1524, makes it illegal for most businesses to advertise or list a price for a good or service that does not include all required fees or charges other than certain government taxes and shipping costs. SB 478 is a price transparency bill. The statute does not change what price a business can charge or what may be included in that price. The law simply requires that the price listed include all mandatory charges."
