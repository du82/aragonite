["https://oag.ca.gov/charities/dissolution"]
title = "Dissolution | State of California - Department of Justice - Office of the Attorney General"
description = "Dissolution Webinar  A California nonprofit corporation that decides to stop operating and windup operations must take certain steps. In California, the procedures to voluntarily wind up operations are called “dissolution” of the nonprofit corporation. Dissolution can be accomplished by either filing an action with the superior court or by complying with voluntary dissolution procedures. Note: Please expect 30-90 days to process filings (forms and/or supporting documentation) from the date received. We will reply, if necessary. Please check the Registry Search Tool for updates."
