title = "Bureau of Children's Justice | State of California - Department of Justice - Office of the Attorney General"
description = "The Bureau of Children's Justice (BCJ) was formed within the Civil Rights Enforcement Section in 2015 to safeguard equal opportunity so that every child in the State of California can meet their full potential. BCJ's investigative work addresses systemic issues that impact children and youth in the state of California, focusing on remedying patterns or practices of discriminatory policies or procedures."
