title = "About CJSC | State of California - Department of Justice - Office of the Attorney General"
description = "CJSC MISSION STATEMENT The mandate of the Criminal Justice Statistics Center (CJSC) is to collect and report statistical data that allow for valid assessments of crime and the criminal justice process in California. CJSC DESCRIPTION The CJSC is a Statistical Analysis Center (SAC). SACs are units or agencies at the state government level that collect and use data received from various components of the criminal justice system. SACs reside in approximately 52 states and territories, varying in their placement within state government structure."
