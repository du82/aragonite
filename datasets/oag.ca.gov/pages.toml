title = "AB 953: The Racial and Identity Profiling Act of 2015 | State of California - Department of Justice - Office of the Attorney General"
description = "Eliminating racial and identity profiling in law enforcement requires everyone’s participation! RACIAL and IDENTITY PROFILING ACT (RIPA) of 2015 (AB 953) The Racial and Identity Profiling Act of 2015: Prohibits racial and identity profiling by law enforcement. Requires law enforcement agencies to report data to the Attorney General’s Office on a) all vehicle and pedestrian stops and b) citizen complaints alleging racial and identity profiling. Establishes the Racial and Identity Profiling Advisory Board."
