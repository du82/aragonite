["https://oag.ca.gov/consumers/contact/espanol"]
title = "Contáctenos/Formularios | State of California - Department of Justice - Office of the Attorney General"
description = "Maneras de Resolver Su Queja Considere sus opciones. Recuerde, usted debe buscar remedios en su disputa privada por su cuenta. El Procurador General no puede proporcionar asesoramiento legal o representar intereses particulares. Usted puede obtener una referencia a un servicio de referencia de abogados certificado al ponerse en contacto con la Barra Estatal de Abogados (State Bar) al 866-442-2529 (llamada gratis en California) o al 415-538-2250 (fuera de California), o a través de su sitio web en: www.calbar.ca.gov."
