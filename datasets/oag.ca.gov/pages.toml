["https://oag.ca.gov/economic"]
title = "Economic Security | State of California - Department of Justice - Office of the Attorney General"
description = "The Attorney General's Office believes that the economic security of working families is crucial to the economic wellbeing of California. That’s why he is fighting to make sure that everyone in our state can benefit from economic growth and consumer protections. The Attorney General has a special role in enforcing the laws that safeguard California consumers, including consumer protection statutes, antitrust laws, and other civil and criminal laws that protect families and competition in the California market."
