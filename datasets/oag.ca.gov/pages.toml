["https://oag.ca.gov/bi/retail-crime"]
title = "Organized Retail Crime | State of California - Department of Justice - Office of the Attorney General"
description = "What is Organized Retail Crime? Organized Retail Crime is characterized by organized criminal rings that steal property with the intent to sell and distribute, or return stolen merchandise for value. Organized Retail Crime takes many forms—from coordinated thefts of specific goods to orchestrated, brazen attacks on local retailers. In whatever form it takes, these organized crimes are felonies – not petty theft or shoplifting. Organized Retail Crime incidents are often part of sophisticated criminal networks that plan their attacks weeks or months before they are carried out."
