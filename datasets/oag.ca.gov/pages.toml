["https://oag.ca.gov/childabuse"]
title = "Child Abuse Central Index | State of California - Department of Justice - Office of the Attorney General"
description = '''The Attorney General administers the Child Abuse Central Index (CACI), which was created by the Legislature in 1965 as a tool for state and local agencies to help protect the health and safety of California's children. Defined in Penal Code sections 11164 through 11174.31, these statutes are referred to as the "Child Abuse and Neglect Reporting Act" or "CANRA". Investigated reports of child abuse are forwarded to the CACI. These reports contain information related to substantiated cases of physical abuse, sexual abuse, mental/emotional abuse, and/or severe neglect of a child.'''
