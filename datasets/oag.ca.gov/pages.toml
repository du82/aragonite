["https://oag.ca.gov/civil/disability-rights"]
title = "Disability Rights Bureau | State of California - Department of Justice - Office of the Attorney General"
description = "Nearly one quarter of adults in California have a disability.1  It is the public policy of the State of California to ensure equal access for all Californians with disabilities.  The Disability Rights Bureau (DRB) within the Civil Rights Enforcement Section protects and advances the rights of all people with disabilities in California. Investigative Authority DRB handles investigations pursuant to Government Code section 11180 et seq."
