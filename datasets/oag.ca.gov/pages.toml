title = "Appointments | State of California - Department of Justice - Office of the Attorney General"
description = "The Attorney General has the authority to appoint members to California boards and commissions. Attorney General Rob Bonta believes government works best when citizens are involved and engaged in their communities. Please consider serving on a board or commission to make a positive difference. California needs leaders that reflect the rich cultural diversity of our great state. This webpage provides the list of boards and commissions that the Attorney General has appointing authority, as well as the application form to apply. Please complete the application form."
