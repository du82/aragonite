description = "In order to gain employment with the California Office of the Attorney General, Department of Justice (DOJ), you must follow several steps, in accordance with the California State Civil Service process. These steps are as follows: Examination Becoming reachable on a list Locating a vacant position Participating in a hiring interview Passing Medical Examinations (if required) Pass a pre-employment drug test (if required) Pass a background clearance Complete probationary period Each of these steps are explained in more detail below."
