["https://oag.ca.gov/environment/justice"]
title = "Environmental Justice | State of California - Department of Justice - Office of the Attorney General"
description = "Every Californian should have the opportunity to live in a community that is healthy and safe. This is especially true for low-income communities and communities of color, who suffer disproportionate exposure to pollution and the corresponding health impacts from that exposure. In order to help protect community health and well-being, on February 22, 2018, Attorney General Becerra established the Bureau of Environmental Justice, and, on April 28, 2021, Attorney General Bonta announced the expansion of the Bureau."
