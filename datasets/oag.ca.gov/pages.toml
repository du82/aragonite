title = "Professional Fundraisers for Charitable Purposes | State of California - Department of Justice - Office of the Attorney General"
description = "Professional Fundraiser Webinar    About Professional Fundraisers    Charities use various professional fundraisers to solicit donations. Professional fundraisers may include commercial fundraisers, fundraising counsels, and commercial coventurers. There are mandatory registration requirements and contract requirements for commercial fundraisers and fundraising counsels that must be adhered to both by the charities and their respective fundraising professionals. Please note that certain terms must be included in the contract. A model contract is available."
