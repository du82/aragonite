["https://oag.ca.gov/charities/complaints"]
title = "Filing a Complaint About a Charity or Charitable Solicitation | State of California - Department of Justice - Office of the Attorney General"
description = "In California, the Attorney General has primary responsibility for supervising charities, charitable trusts, and professional fundraisers that solicit donations on their behalf. The Attorney General’s oversight involves protecting charitable assets and donations for their intended use, prohibiting deceptive or coercive charitable solicitations, and ensuring compliance with the charitable organization’s governing documents, such as the articles of incorporation or trust documents."
