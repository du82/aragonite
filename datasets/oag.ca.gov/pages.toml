["https://oag.ca.gov/conflict-interest"]
title = "Conflicts of Interest | State of California - Department of Justice - Office of the Attorney General"
description = "Conflicts-of-interest, pdf laws are grounded on the notion that government officials owe paramount loyalty to the public. Thus, personal and private financial considerations on the part of governmental officials should not be allowed to enter the decision-making process. The Conflicts of Interest guide summarizes and discusses the numerous conflicts-of-interest laws in California. The purpose of this guide is to assist government officials in complying with California’s conflicts-of-interest laws and to assist the public and the news media in understanding these laws."
