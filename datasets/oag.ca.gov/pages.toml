["https://oag.ca.gov/dag-recruitment"]
title = "Become a DOJ Deputy Attorney General | State of California - Department of Justice - Office of the Attorney General"
description = "DOJ attorneys represent the state and its residents to protect Californians from violent criminals,  preserve the environment, maintain a fair marketplace, and, above all, preserve the rule of law. Attorneys within DOJ argue the legal merits of cases in the highest courts in the state and  nation. As a result, many of the cases handled by our attorneys result in important legal precedents  that interpret the law for California and the nation."
full_description = "DOJ attorneys represent the state and its residents to protect Californians from violent criminals, preserve the environment, maintain a fair marketplace, and, above all, preserve the rule of law. Attorneys within DOJ argue the legal merits of cases in the highest courts in the state and nation. As a result, many of the cases handled by our attorneys result in important legal precedents that interpret the law for California and the nation. Where We Work Learn about the Legal Divisions and Offices within the California Department of Justice Division of Public Rights Handles investigations, litigation, and other efforts to preserve California's environment and natural resources; protect consumers and maintain competition; and safeguard the rights, health, and well-being of Californians. Division of Civil Law Provides legal services to many other statewide officers and for most state agencies. Division of Criminal Law Represents the people of California in criminal appeals and statewide prosecutions of certain crimes. Division of Medi-Cal Fraud & Elder Abuse Protects our most vulnerable citizens and helps safeguard the state's Medi-Cal program Office of the Solicitor General Serves as a clearinghouse for appeals handled by the DOJ and provides appellate advice to all DOJ divisions. Office of General Counsel Responsible for compliance, legal oversight, and risk management for DOJ."
