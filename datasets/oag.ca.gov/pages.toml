["https://oag.ca.gov/immigrant"]
title = "Immigration | State of California - Department of Justice - Office of the Attorney General"
description = "The California Attorney General's Office has been on the front lines of countless fights defending the rights of immigrants in California. That work is especially important to California – a state that is home to more immigrants than any other state. Nearly 11 million people living in California, about one in four, are immigrants. The Attorney General's Office has taken several actions to defend the rights of immigrants, including: Defended Dreamers and challenged the repeal of DACA. Opposed the Trump Administration’s attempt to add a citizenship question to the 2020 U.S. Census."
