title = "Division of Medi-Cal Fraud & Elder Abuse | State of California - Department of Justice - Office of the Attorney General"
description = "Our mission is to protect our most vulnerable citizens and help safeguard the state's Medi-Cal program. The California Attorney General’s Office, Division of Medi-Cal Fraud and Elder Abuse operates as the Medicaid Fraud Control Unit (MFCU). In California, the Medicaid program is called Medi-Cal and is administered by the Centers for Medicare and Medicaid Services and the California Department of Health Care Services."
