["https://oag.ca.gov/21st-century-policing"]
title = "21st Century Policing | State of California - Department of Justice - Office of the Attorney General"
description = "As California’s chief law enforcement officer, the Attorney General's Office knows that trust between law enforcement and the communities we serve is vital to effective policing. To strengthen this trust, Attorney General Becerra is committed to increasing fairness and transparency throughout the criminal justice system by effectively implementing California laws critical to eliminating bias in policing and reducing unnecessary uses of force; promoting evidence-based approaches and trainings to improve police practices across California; and investigating agencies for civil pattern or practice violations when there is evidence to suggest systemic police misconduct."
