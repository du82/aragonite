["https://oag.ca.gov/careers/aboutus/legal"]
title = "About Us - Legal Services Divisions | State of California - Department of Justice - Office of the Attorney General"
description = "The department's lawyers take on the challenge to represent the people of the biggest and most diverse state in the nation to protect them from violent criminals, preserve the environment, maintain a fair marketplace, and, above all, preserve the rule of law. Attorneys within the department argue the legal merits of cases in the highest courts in the state and nation. As a result, many of the cases handled by our attorneys result in important legal precedents that interpret the law for California and the nation. The department organizes its legal services into three main divisions."
