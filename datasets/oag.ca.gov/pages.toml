title = "How to apply | State of California - Department of Justice - Office of the Attorney General"
description = "Applying for a Civil Service Job Ready to start a career in public service? The California DOJ is part of the merit-based California State Civil Service process, which ensures we only hire and promote the best candidates based on their skills and qualifications. Follow this guide to learn about the steps to apply for a position with our department. Still unsure? We have dedicated recruiters who can help guide you through the application process and help find your career path with our department."
