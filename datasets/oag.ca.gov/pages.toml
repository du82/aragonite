title = "Nonprofit Raffles | State of California - Department of Justice - Office of the Attorney General"
description = "Raffle Registration Overview  The raffle registration covers raffles conducted during a calendar year, from January 1 to December 31. To register, use the raffle application (CT-NRP-1). Form CT-NRP-1 is accepted starting November 1 for the raffles to be conducted the following calendar year. Register at least 60 days before conducting a raffle to allow for processing of your raffle application. Raffle registration may be denied if you did not submit or submitted an incomplete raffle report for the raffle activities conducted the prior year."
