title = "About the California Department of Justice | State of California - Department of Justice - Office of the Attorney General"
description = "The California Constitution establishes the Attorney General as the state's chief law officer, responsible for ensuring that the laws of the state are uniformly and adequately enforced. The Attorney General is vested with broad powers and carries out these important responsibilities through the California Department of Justice. The Department of Justice is committed to fostering and maintaining an engaged and inclusive organizational culture that celebrates shared values and diversity, which are integral to excellence."
