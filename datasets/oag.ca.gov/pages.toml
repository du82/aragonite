["https://oag.ca.gov/civil/preveduc"]
title = "Prevention and Education | State of California - Department of Justice - Office of the Attorney General"
description = '''Every year, thousands of bias-motivated acts, commonly-referred to as "hate crimes" or "hate incidents" are committed across America.1 Generally speaking, any criminal act motivated by a specific bias against a victim's actual or perceived protected characteristic is a hate crime. A bias-motivated act that does not rise to the level of a crime is called a "hate incident." Hate crimes are prosecuted by city attorneys and district attorneys under California's penal code, while hate incidents can be the subject of civil lawsuits under California's civil code.'''
