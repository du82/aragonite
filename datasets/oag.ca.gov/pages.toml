["https://oag.ca.gov/bcj/complaint"]
title = "Complaint to the Bureau of Children's Justice | State of California - Department of Justice - Office of the Attorney General"
description = "BCJ identifies leads based on analyses of information from a variety of sources including: individual complaint, patterns of complaints, academic research, news reports, public and non-public data. BCJ carefully considers each lead and may initiate an investigation involving witness interviews, subpoenas, and consultation with experts. BCJ may work with the subject of the investigation to resolve concerns without any legal action or we may pursue civil judgments or criminal penalties. Sometimes, BCJ may resolve a matter within months. Often, investigation and litigation may take years."
