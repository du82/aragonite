["https://oag.ca.gov/human-trafficking"]
title = "Human Trafficking | State of California - Department of Justice - Office of the Attorney General"
description = "Questions to Topics  What is Human Trafficking? Identifying Human Trafficking  Reporting Human Trafficking Getting Help for Victims  Human trafficking is among the world's fastest growing criminal enterprises and is estimated to be a $150 billion-a-year global industry. It is a form of modern day slavery that profits from the exploitation of our most vulnerable populations. One common misperception is that human trafficking requires movement across borders."
