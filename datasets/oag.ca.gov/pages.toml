title = "Annual Registration Renewal | State of California - Department of Justice - Office of the Attorney General"
description = "Webinars Annual Registration Renewal Webinar- Electronic submission  Updated Annual Registration Renewal Webinar- Paper Submissions  Completing Form CT-TR-1 Webinar  Every charitable corporation, unincorporated association, and trustee doing business or holding property in California is required to annually renew its registration with the Attorney General's Registry of Charities and Fundraisers. Registrants must report annually by filing Form RRF-1 with the applicable renewal fee along with either IRS Form 990 (-EZ/PF) or Form CT-TR-1."
