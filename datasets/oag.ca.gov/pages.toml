["https://oag.ca.gov/cures"]
title = "Controlled Substance Utilization Review and Evaluation System | State of California - Department of Justice - Office of the Attorney General"
description = "New Data Submission Format on August 1, 2024 Beginning August 1, 2024, dispensers are required to report dispensations to the Controlled Substance Utilization Review and Evaluation System (CURES) using version 4.2B of the American Society for Automation in Pharmacy (ASAP) format. Previously, California dispensation data was reported using the ASAP version 4.1 format. This format change improves data quality by offering more data fields and clarifying certain other data fields."
