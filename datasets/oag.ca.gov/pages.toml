["https://oag.ca.gov/civil/underground"]
title = "Underground Economy Unit | State of California - Department of Justice - Office of the Attorney General"
description = "The Attorney General works to protect California's workers, legitimate businesses, and taxpayers through the Underground Economy Unit, which is part of the Civil Rights Enforcement Section. The Underground Economy Unit brings civil and criminal actions against persons engaged in the underground economy. The Unit has used California's Unfair Competition law to obtain restitution of unpaid wages, civil penalties, and injunctions to bring businesses into compliance with applicable labor and employment, tax, and licensing laws."
