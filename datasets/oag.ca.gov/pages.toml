["https://oag.ca.gov/ab1287"]
title = "AB 1287 - California’s Pink Tax Law | State of California - Department of Justice - Office of the Attorney General"
description = "The “Pink Tax” is illegal in California; gender-based price differences for substantially similar consumer products violate California law, including AB 1287. Because the Attorney General has enforcement authority for violations of California’s Pink Tax Law, it is critical that we hear from the public about potential violations of the law. What is the Pink Tax? When items marketed to women or girls are priced higher than the same or substantially similar items marketed to men or boys, the price difference that women have to pay is called the Pink Tax."
