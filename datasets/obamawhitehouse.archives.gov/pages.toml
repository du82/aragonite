is the biggest driver of climate change Global temperatures and carbon dioxide levels are on the rise The global annual average temperature has increased by more than 1.5 degrees F between 1880 and 2012. This interactive graph from the National Climate Assessment shows the concentration of atmospheric carbon dioxide over the same time period. Climate scientists say we need to avert an additional 2-degree temperature increase to avoid the most catastrophic impacts of climate change. U.S. greenhouse gas pollution includes: Carbon Dioxide (CO2), 82% Enters the atmosphere through burning fossil fuels (coal, natural gas, and oil), solid waste, trees and wood products, and also as a result of certain chemical reactions (e.g., manufacture of cement). Fluorinated gases, 3% Hydrofluorocarbons, perfluorocarbons, and sulfur hexafluoride are synthetic, powerful greenhouse gases that are emitted from a variety of industrial processes. Nitrous Oxide (N2O), 6% Emitted during agricultural and industrial activities, as well as during combustion of fossil fuels and solid waste. Methane (CH4), 9% Emitted during the production and transport of coal, natural gas, and oil as well as from landfills. Source: EPA We've made progress thanks to: Stronger Fuel Economy Standards We set the highest fuel economy standards in American history that will double the efficiency of our cars and trucks by 2025. increasing clean energy Since President Obama took office, the U.S. increased solar generation by twenty-fold and tripled electricity production from wind power. Decreased Carbon Pollution In 2012, U.S. greenhouse gas pollution fell to the lowest level in nearly 20 years. Renewable Energy and Efficiency Targets 35 states have renewable energy targets in place, and more than 25 have set energy efficiency targets. But we have more work to do. Share on Facebook Share on Twitter #section-272636 { margin: none; border-top: 1px solid #1d3565 !Important; position: relative; border-bottom: 1px solid #1d3