full_description = "The United States Congress is made up of the House of Representatives and the Senate. Learn more about the powers of the Legislative Branch of the federal government of the United States. Established by Article I of the Constitution, the Legislative Branch consists of the House of Representatives and the Senate, which together form the United States Congress. The Constitution grants Congress the sole authority to enact legislation and declare war, the right to confirm or reject many Presidential appointments, and substantial investigative powers. The House of Representatives is made up of 435 elected members, divided among the 50 states in proportion to their total population. In addition, there are 6 non-voting members, representing the District of Columbia, the Commonwealth of Puerto Rico, and four other territories of the United States. The presiding officer of the chamber is the Speaker of the House, elected by the Representatives. He or she is third in the line of succession to the Presidency. Members of the House are elected every two years and must be 25 years of age, a U.S. citizen for at least seven years, and a resident of the state (but not necessarily the district) they represent. The House has several powers assigned exclusively to it, including the power to initiate revenue bills, impeach federal officials, and elect the President in the case of an electoral college tie. The Senate is composed of 100 Senators, 2 for each state. Until the ratification of the 17th Amendment in 1913, Senators were chosen by state legislatures, not by popular vote. Since then, they have been elected to six-year terms by the people of each state. Senator's terms are staggered so that about one-third of the Senate is up for reelection every two years. Senators must be 30 years of age, U.S. citizens for at least nine years, and residents of the state they represent. The Vice President of the United States serves as President of the Senate and may cast the decisive vote in the event of a tie in the Senate."
year_published = 2015
year_updated = 2015
