full_description = "Home • The Administration • Joining Forces Overview About Resources Get Involved Share Your Message Stay Connected Photos & Videos News Support for our Service Members, Veterans, and their Families Joining Forces works hand in hand with the public and private sectors to ensure that service members, veterans, and their families have the tools they need to succeed throughout their lives. Let’s ensure that transitioning service members, veterans, and military spouses are able to connect with career opportunities. Find Employment Resources for Veterans Let’s ensure no barriers stand between quality, affordable education and veterans and their families. Find Employment Resources for Military Spouses Let’s work to reduce the tolls that the stress of war, multiple deployments, and frequent moves can take. Find information on Military Veteran and Service Member License Portability Stay Connected Joining Forces is all about coming together to support our nation’s service members, veterans, and their families: FacebookTwitterEmail Updates Featured Stories The First Lady Teams Up with Redbook to Support Female Veterans First Lady Michelle Obama and Redbook team up to help female veterans get jobs. The issue highlights five female veterans who visited the White House to speak with the First Lady about their experiences transitioning into civilian life. Learn More Celebrating Our Wounded Warriors and MSG Cedric King First Lady Michelle Obama introduced a video of wounded warrior MSG Cedric King, and celebrates the resilience and strength of our wounded warriors. Learn More Helping Employers Connect to Job Seeking Service Members, Veterans and Their Families The First Lady unveils the Administration's Online Veterans Employment Center. This new online platform supports transitioning service members, veterans, and their spouses looking for new career opportunities and helps employers find quality employees. Learn More Operation Got Your 6 First Lady Michelle Obama sends the Penguins of Madagascar on a top-secret mission to debunk the myths and show the truth about America's returning veterans. Learn More"
