full_description = '''At the White House, our digital strategy centers around meeting people where they are. This decentralized approach, in response to the proliferation of social media, aims to provide the American people with a multitude of ways to engage with their government. Recently, we launched the @POTUS account on Twitter and President Obama’s page on Facebook. Today, we're excited to announce that this push is continuing, with the debut of the White House’s Official Story on Snapchat. There are over 100 million daily active Snapchat users, and over 60 percent of American smartphone users between the ages of 13 and 34 use the platform. In light of the number of Americans who use the service to consume news and share with their friends, the White House is joining Snapchat to engage this broad cross-section of the population in new and creative ways. Tomorrow, our Official Story will take you behind the scenes of the White House's State of the Union preparations, with footage and angles you won’t find anywhere else. To tune in, find the White House on Snapchat by adding "WhiteHouse" as a friend or scanning the snapcode below:'''
