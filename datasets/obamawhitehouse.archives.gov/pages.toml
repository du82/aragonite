full_description = "Los inmigrantes y refugiados han venido a nuestro territorio en búsqueda de oportunidades y libertad desde antes de la fundación de nuestra nación. El proceso de integrarse en una tierra nueva —lograr autosuficiencia, participación política y cívica e inclusión social— puede ser difícil pero las recompensas pueden ser inmensas. Ambos somos hijos de inmigrantes y podemos atestiguar el éxito que surge de la integración completa en la fábrica de nuestra nación. Esta mañana, tuvimos el honor de presentarle al Presidente Obama un reporte del Grupo de Trabajo sobre Nuevos Estadounidenses, llamado Fortaleciendo a las Comunidades al Darle la Bienvenida a Todos los Residentes: Un plan de acción federal y estratégico sobre la integración de inmigrantes y refugiados. Este plan describe una estrategia sólida federal de integración de inmigrantes y refugiados que desarrollará nuestra competitividad global y que identifica maneras de asegurar que las personas diversas de nuestra nación contribuyan de forma plena a sus comunidades, y que se les dé la bienvenida en ellas. El Grupo de Trabajo, establecido por el Presidente Obama como parte de las acciones ejecutivas de responsabilidad de inmigración en noviembre de 2014, está compuesto por 16 departamentos federales, agencias y oficinas de la Casa Blanca. Su trabajo fue extensivo, de ritmo rápido, pero lo más importante es que fue gratificante. Para preparar esta plan de acción, realizamos una evaluación de las iniciativas federales actuales de integración, participamos con las partes interesadas a nivel local y nacional y solicitamos recomendaciones del público. Nuestro plan inicial de acción estratégica proporciona, para la consideración del presidente, recomendaciones específicas que tienen la intención de ayudar a: Una de las maneras más efectivas de obtener un sentido de pertenencia es ayudar a aquellos que lo necesitan en la comunidad. El Grupo de Trabajo, que reconoce el impacto positivo del servicio de voluntarios y nacional, ha revitalizado un nuevo proyecto para personas que viven en Estados Unidos para alentar al voluntariado entre todas las personas que viven en Estados Unidos, incluidos los ciudadanos de EE. UU. y aquellos que son nuevos en la nación. Puede apoyar la iniciativa al visitar obamawhitehouse.archives.gov/New-Americans. Este sitio web proporciona un código postal con base en el motor de búsqueda que identifica organizaciones locales que necesitan voluntarios."
