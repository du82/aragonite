full_description = "In the morning, the President will receive the Presidential Daily Briefing in the Oval Office. This meeting is closed press. In the afternoon, the President will travel to Chicago, Illinois. The departure from the South Lawn is open press, and the arrival at Chicago O’Hare International Airport is open to pre-credentialed media. In the evening, the President will deliver his farewell address to the American people, where he will thank his supporters, celebrate the ways we have changed this country for the better these past eight years, and offer his vision on where we all go from here. The Vice President, the First Lady, and Dr. Biden will also attend. The President’s address at McCormick Place is open to pre-credentialed media; however, the RSVP deadline has passed. Later in the evening, the President will depart Chicago, Illinois en route Washington, DC. The departure from Chicago O’Hare International Airport is open to pre-credentialed media, and the arrival on the South Lawn is open press."
