title = "Civil Rights | The White House"
description = "President Obama is leading the fight to protect everyone - no matter who you are, where you're from, what you look like, or who you love."
full_description = '''/** * Banner and button styles */ .hero-banner{ height: 169px; width: 976px; background: url(/sites/default/files/image/header_civil_rights_mega_03.jpg) top left no-repeat; } .hero-closed-text-wrap { padding-left: 20px; padding-top: 28px; width: 380px; } .hero-closed-title { line-height: 1.5em; color: #333; font-size: 1.1em; text-transform: uppercase; margin-bottom: 0px; } p.hero-closed-subtext { color: #333; font-family: Georgia, "Times New Roman", Times, serif; font-weight: normal; font-size: 2em; } .mw-button { background-color: #076cd3; color: #fff !important; font-family: Helvetica,Arial,"Lucida Grande","Nimbus Sans L",sans-serif; font-size: 13px; font-weight: bold; float: left; padding: 8px 15px; text-decoration: none; text-shadow: 1px 1px 0px #076cd3; text-transform: uppercase; margin-right: 4px; letter-spacing: 1px; border: 0; -webkit-border-radius: 4px; border-radius: 4px; } .mw-button:hover { color: #fff; background-color: #0058b2; text-decoration: none; } /* text styles */ .slide-wrap .slide-text h1{ color: #fff; font-family: Georgia, "Times New Roman", Times, serif; font-weight: normal; font-size: 2em; margin-bottom: -10px; } .slide-wrap .slide-text p{ color: #fff; font-family: arial, san-serif; font-weight: normal; font-size: 1.1em; padding: 15px 0 0 0; } .slide-wrap{ background: url(http://obamawhitehouse.archives.gov/sites/default/files/image/header_civil_rights_mega_03.jpg); display: block; margin-bottom: 2px; height: 350px; } .slide-wrap .slide-text-container{ width: 500px; display: inline-block; float: left; padding: 32px 10px 0px 20px; } .embed{ margin: 0px !important; } #energy-carousel { visibility:hidden; } .page-no-cols { padding-left: 0px; } /* new */ .video-container { background: #000000; width: 650px; height: 332px; float: right; overflow: hidden; } Strengthening Civil Rights President Obama is leading the fight to protect everyone - no matter who you are, where you're from, what you look like, or who you love. “We, the people, declare today that the most evident of truths — that all of us are created equal — is the star that guides us still; just as it guided our forebears through Seneca Falls, and Selma, and Stonewall; just as it guided all those men and women, sung and unsung, who left footprints along this great Mall, to hear a preacher say that we cannot walk alone; to hear a King proclaim that our individual freedom is inextricably bound to the freedom of every soul on Earth.” President Obama, January 21, 2013 Strengthening Protections Against Discrimination President Obama's Administration has vigorously enforced existing laws and successfully supported additional protections against discrimination. Criminal and Juvenile Justice The President is leading the fight to build a fairer and more equitable criminal justice system. Voting Rights President Obama's Administration has vigorously worked to ensure all Americans have the right to vote. Selma: 50 Years Later Learn more about the historic marches from Selma to Montgomery — and listen to the stories of those who were there. .issue-2col-tout { width:690px; } h3.issue-tout-subhead { color: #686868; font-family: "Arial, Helvetica, sans-serif"; font-size: 1.6em; margin: 0 0 10px; padding: 0 0 10px; font-weight: normal; line-height: 24px; } h3.issue-feature-subhead { margin: 5px 0 !important; } .issue-feature-left { width: 337px; float: left; } .issue-feature-right { width: 337px; float: right; } p.issue-feature-caption { color:#333333; margin: 0 0 5px; padding-right: 10px; } /* Fixing Right Rail */ #right-rail { padding: 10px 15px 0 0 !important; width: 240px !important; } #edge-under-top { display: none !important; } .extend-page { background: none !important; } p.section-intro { color: #333333; font-family: Georgia,"Times New Roman",Times,serif; font-size: 15px; } .opening-quote { color: #686868; font-family: Georgia, serif; font-size: 16px; line-height: 24px; margin-bottom: 10px; } .opening-attr { color: #686868; font-family: Georgia, serif; font-size: 14px; font-style: italic; line-height: 24px; }'''
