["http://obamawhitehouse.archives.gov/vp"]
title = "Vice President Joe Biden | The White House"
description = "See the President's daily schedule, explore behind-the-scenes photos from inside the White House, and find out all the ways you can engage with the most interactive administration in our country's history."
full_description = '''Vice President Joe Biden Jump to a Section Bio Middle Class Economics Violence Against Women Cancer Moonshot Foreign Policy Go To Top Facebook Twitter VP - bio Joseph Robinette Biden, Jr., represented Delaware for 36 years in the U.S. Senate before becoming the 47th and current Vice President of the United States. Joseph Robinette Biden, Jr., was born November 20, 1942, in Scranton, Pennsylvania, the first of four siblings. In 1953, the Biden family moved from Pennsylvania to Claymont, Delaware. He graduated from the University of Delaware and Syracuse Law School and served on the New Castle County Council. Then, at age 29, he became one of the youngest people ever elected to the United States Senate. Just weeks after the election, tragedy struck the Biden family when Biden's wife, Neilia and their one-year-old daughter, Naomi, were killed and their two young sons critically injured in an auto accident. Vice President Biden was sworn in to the U.S. Senate at his sons' hospital bedside and began commuting to Washington every day by train, a practice he maintained throughout his career in the Senate. In 1977, Vice President Biden married Jill Jacobs. Jill Biden, who holds a Ph.D. in Education, is a life-long educator and currently teaches at a community college in Northern Virginia. The Vice President’s son, Beau, was Delaware's Attorney General from 2007-2015 and a Major in the 261st Signal Brigade of the Delaware National Guard. He was deployed to Iraq in 2008-2009. Beau passed away in 2015 after battling with brain cancer with the same integrity, courage, and strength he demonstrated every day of his life. The Vice President’s other son, Hunter, is an attorney who manages a private equity firm in Washington, D.C. and is Chairman of the World Food Program USA. And his daughter Ashley is a social worker and is Executive Director of the Delaware Center for Justice. Vice President Biden has five grandchildren: Naomi, Finnegan, Roberta Mabel ("Maisy"), Natalie, and Robert Hunter. As a Senator from Delaware for 36 years, Vice President Biden established himself as a leader in facing some of our nation's most important domestic and international challenges. As Chairman or Ranking Member of the Senate Judiciary Committee for 17 years, then-Senator Biden was widely recognized for his work on criminal justice issues, including the landmark 1994 Crime Act and the Violence Against Women Act. As Chairman or Ranking Member of the Senate Foreign Relations Committee for 12 years, then-Senator Biden played a pivotal role in shaping U.S. foreign policy. He has been at the forefront of issues and legislation related to terrorism, weapons of mass destruction, post-Cold War Europe, the Middle East, and Southwest Asia. As the 47th Vice President of the United States, Joe Biden has continued his leadership on important issues facing the nation and has represented our country abroad traveling over 1.2 million miles to more than 50 countries. Vice President Biden has convened sessions of the President’s Cabinet, led interagency efforts, and worked with Congress in his fight to raise the living standards of middle class Americans, reduce gun violence, address violence against women, and end cancer as we know it. VP - initiatives quick links Middle Class Economics Violence Against Women Cancer Moonshot Foreign Policy VP - Middle Class Economics Middle Class Economics Vice President Joe Biden tours the Idora Neighborhood with Assistant Secretary of Commerce for Economic Development, Jay Williams and views homes that were revitalized through funding from the neighborhood stabilization fund at the department of Housing and Urban Development, and the hardest hit fund at the Department of the Treasury, in Youngstown, Ohio, September 1, 2017. (Official White House by David Lienemann) Eight years ago, the turmoil in the financial sector led to crippling conditions in the real economy -- the livelihood of millions of American households and businesses outside of Wall Street. Eight years later, we’re in the midst of the longest streak of job growth in history -- with more than 15 million jobs added. The Vice President played a key role in acting aggressively to arrest the crisis, restart growth and job creation, rebuild our economy on a stronger long-term foundation, and expand opportunity for all Americans. The Vice President was tasked with implementing and overseeing the $840 billion stimulus package in the American Recovery and Reinvestment Act, which has helped to rebuild our economy and lay the foundation for a sustainable economic future. He fought for America’s auto industry, saving 1.5 million jobs up and down the supply chain. The Vice President also leads the Ready to Work Initiative, the Administration’s key effort to identify opportunities to improve our nation’s workforce skills and training systems to help better prepare American workers for the jobs of a 21st century economy. Played a Leading Role in Getting the Economy Back on Track Chaired the Middle-Class Task Force, which was a guiding force in the Administration’s efforts to improve the livelihoods of middle-class families. Oversaw the Administration’s implementation of the Recovery Act -- which added 2 million jobs, helped stave off another Great Depression, and made an unprecedented investment in America’s infrastructure. One of the most efficient government spending programs in history, the Act was determined by the Government Accountability Office -- the gold standard in auditing -- to have waste, fraud, and abuse amount to less than two-tenths of one percent of the total cost of the package. Fought for a lifeline for America’s iconic auto industry, saving 1.5 million jobs up and down the supply chain. Fought for Congressional approval of the Dodd-Frank, which inserted accountability into the financial sector and fortified the stability of the financial system. Helped Guarantee Fiscal Policy that Supports Middle-Class Economics Led Administration negotiations over tax and spending bill that averted a debt crisis in 2011 and instituted one of the largest deficit-reduction plans in history. Secured a legislative compromise at the end of 2012 which averted a fiscal cliff and implemented the largest middle-class tax cut in history. Training and education Led the Administration’s Skills Initiative to improve effectiveness of federal workforce training programs so that more Americans can get the training they need for middle class jobs. Oversaw a comprehensive transformation of federal workforce training funding through review of all programs, identification of training strategies that work, and recommendations for practices to be adopted to ensure that federal programs are providing training for skills that employers need and for middle class jobs that are available. Fought to prioritize federal support for community colleges as a training provider, and led efforts to incorporate the proven best practice of close alignment between community colleges and employers into all funding programs. Recommended greater investment in on-the-job training, particularly apprenticeships, resulting in the greatest increase in the number of apprenticeships in more than a decade. Fought for a Level Playing Field for American Workers Fought for payroll tax cuts during the economic recovery -- ensuring a tax cut for every single worker in America. Pushed for a higher national minimum wage, and supported state and city level efforts when Congress failed to agree to a higher national wage floor. Was a major proponent of more robust overtime protections, stronger enforcement against companies that collude to hold down wages, and less harmful non-compete restrictions for workers. VP - Fighting Violence Against Women Combatting Violence Against Women Vice President Joe Biden gives remarks at an "It's On Us" event, in the Schine Student Center on the campus of Syracuse University, in Syracuse, New York, Nov. 12, 2015. (Official White House Photo by David Lienemann) As the author of the original Violence Against Women Act (VAWA), Vice President Biden has continued to draw upon his years in the United States Senate to address violence against women from the White House -- specifically domestic violence, sexual assault, teen dating violence, and stalking. Not long ago, violence against women was considered a private matter or “family affair” rather than recognized as a crime. Victims often suffered in silence when the court of law and court of public opinion turned a blind eye to a national secret hiding in plain sight. Too often, judges, lawyers, even friends and family blamed the victims instead of the perpetrator. As a senator, the Vice President was convinced that if the curtain was pulled back on this dirty little secret -- the vast majority of the American people would demand change. He and his staff spent thousands of hours researching the legal landscape on domestic violence and meeting with grassroots advocates operating the country’s first battered women’s shelters. They held hundreds of hours of hearings -- with testimony from advocates, health and legal professionals, and brave survivors. After several years as the country began to realize that change was necessary, VAWA was finally enacted into law in 1994. The country made great progress because of it, and the Vice President has continued to tackle the issue of violence against women during this Administration. Combatting Violence Against Women from the White House Vice President Biden announced the appointment of the first-ever White House Advisor on Violence Against Women to support and coordinate national and global efforts to combat domestic violence, sexual assault, and other forms of gender-based violence and serve as a senior advisor to the Vice President on the matters. President Obama signed the third reauthorization of VAWA after the Vice President helped break the log jam in the House. The reauthorization of VAWA brought new and enhanced protections for Alaska Native and American Indian women, immigrants, LGBT survivors. Addressing Campus Sexual Assault In April 2011, Vice President Biden, alongside Secretary of Education Duncan, released new guidance to help schools, colleges, and universities respond to sexual assault on campus. The new guidance clarified the legal obligations under Title IX for schools receiving federal funds to respond promptly and effectively to sexual violence. In January 2014, the Vice President and President announced the creation of the White House Task Force to Protect Students from Sexual Assault, to be co-chaired by the Vice President’s White House Advisor on Violence Against Women and the Executive Director of the White House Council on Women and Girls. Working with federal partners, the White House Task Force to Protect Students from Sexual Assault developed many new resources for use by colleges and universities, including: Not Alone: The First Report of the White House Task Force to Protect Students from Sexual Assault. This report contains a checklist for developing a campus sexual misconduct policy, a sample memorandum of understanding for developing a formal relationship between the campus and a local rape crisis center, and sample language for developing a campus policy on reporting and confidentiality. The Campus Climate Survey Validation Study (CCSVS). This landmark study by the Department of Justice released in January, 2016, provides data on the prevalence of sexual harassment and sexual assault victimization on nine college/university campuses. The Blueprint for Campus Police: Responding to Sexual Assault. The Blueprint, developed by the University of Texas-Austin in response to guidance from the Task Force, serves as a roadmap for campus law enforcement departments seeking to provide a more comprehensive response to sexual assault, including learning about trauma-informed approaches for interacting with sexual assault victims. Safe Place to Learn: Prevent, Intercede, and Respond to Sexual Harassment of K-12 Students. This resource package incorporates and emphasizes Title IX satisfaction; trauma sensitivity; and positive school climate. Considerations for School District Sexual Misconduct Policies. This document highlights a number of issues that could be particularly helpful for districts to consider when drafting sexual misconduct policies as part of their overall response to sexual misconduct in K-12 schools. Engaging Men and Boys as Bystanders in Preventing Violence Against Women and Girls In September 2014, President Obama and Vice President Biden unveiled It’s On Us, a new campaign to engage students and bystanders in preventing sexual assault. This campaign grew out of meetings convened by the Vice President with sports leagues, media, college-age groups, and others to identify messaging that would reach the millennial demographic. It’s On Us features a pledge that anyone can take to commit to standing up against sexual assault. Since its inception, almost 400,000 people have taken the pledge online. Vice President Biden delivered It’s On Us remarks at nine colleges and universities around the Nation: The University of Illinois; Clemson University; the Naval Academy; Morehouse College; Ohio State; Syracuse University; the University of Pittsburgh; the University of Nevada Las Vegas; and the University of Colorado at Boulder. Tackling the Rape Kit Backlog and Modernizing the FBI’s Definition of Rape In January 2012, at the urging of Vice President Biden and the White House Council on Women and Girls, the Justice Department modernized the FBI’s definition of rape, which had not been updated since the 1920s. The revised definition covers oral and anal penetration, alcohol/drug facilitated rapes, and rapes of men. Advocates had been working to obtain this change for a decade. In March 2015, the Vice President, along with Senator Barbara Mikulski from Maryland, announced the new $41 million Sexual Assault Kit Initiative, which provides funding to help communities accelerate testing of the estimated hundreds of thousands of rape kits that have been backlogged, something the Vice President called an “absolute priority.” In September 2015, the Vice President, Attorney General Loretta Lynch, New York District Attorney Cyrus Vance, and actress Mariska Hargitay announced the recipients of federal and state grants to reduce the backlog at an event at the New York City Crime Lab. Through a partnership between the Department of Justice “Sexual Assault Kit Initiative” and the New York County District Attorney’s Office “Sexual Assault Kit Backlog Elimination Program,” over $79 million was given to 43 jurisdictions in 27 states. Prioritizing Violence Against Women in Our Foreign Policy and National Security In 2012, President Obama issued an Executive Order on Preventing and Responding to Violence Against Women and Girls Globally to further enhance the Administration’s efforts to advance the right'''
