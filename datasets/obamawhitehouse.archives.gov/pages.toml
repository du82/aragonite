full_description = "President Obama has fought to achieve a simpler and fairer tax code that ends tax breaks and tax loopholes for wealthy Americans while helping paychecks go further for middle-class and working families. President Obama has passed wide-ranging tax relief for working families and small businesses — the drivers of economic growth — while also ending tax cuts for the top 2 percent highest-income Americans. But despite this progress, the tax code is still too complicated and full of inefficient loopholes and tax breaks that mostly benefit the wealthy. The President has proposed to simplify our tax code, make it fairer by eliminating large, unfair tax loopholes, and reinvest the savings in measures that will grow the economy and expand opportunity. The President's plan would make paychecks go further in covering the costs of child care, college, and a secure retirement, and would create and improve tax credits that support and reward work. Under President Obama’s leadership, we have made substantial progress in making the tax code fairer for working families. Under President Obama: As a result, middle-class taxes are at historically low levels, with the typical middle-income family paying lower federal income taxes than in almost any other period in the last 60 years. Relative to the tax code in place before the Administration, in 2016 the after-tax income of families in the lowest fifth of the income distribution has increased by more than 6 percent on average — a more than $850 boost — due to the policies enacted since 2009. At the same time, high-income earners are paying significantly more of their fair share. After the President successfully fought to reverse tax cuts for the highest-income Americans beginning in 2013: President Obama firmly believes that entrepreneurs and small businesses are engines of economic growth, and that their investments and innovation have been at the forefront of our economic recovery. That’s why he and his Administration have focused on strengthening small businesses by signing into law a series of tax cuts for small businesses. Importantly, the President recently signed bipartisan legislation that made permanent several tax cuts for small businesses, including permanently increasing the amount of investments that small businesses can immediately deduct to $500,000 and eliminating capital gains taxes on qualified small business investments. These tax cuts have helped small businesses hire and grow, provide affordable health insurance to employees, and invest in new machinery and equipment. The President also believes we should be doing more to help our small businesses succeed in a changing economy. As part of his Framework for Business Tax Reform, the President has proposed additional tax relief, while greatly simplifying tax filing for small businesses, including:"
