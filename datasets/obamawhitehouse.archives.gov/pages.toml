["http://obamawhitehouse.archives.gov/about/inside-white-house/west-wing-tour"]
title = "Inside the WH - West Wing Tour | The White House"
description = "See the President's daily schedule, explore behind-the-scenes photos from inside the White House, and find out all the ways you can engage with the most interactive administration in our country's history."
full_description = 'Inside the White House Tour the West Wing WW Tour nav History | West Wing Tour | Executive Office Building Tour | Video Series | Décor and Art | Holidays WW tour president letter Letter from the President It is my pleasure to welcome you to the West Wing of the White House. In 1902, President Theodore Roosevelt relocated his office from the second floor of the residence to this newly constructed building. The West Wing has expanded and undergone several renovations since then, but it has remained the official workplace of the President. President Thomas Jefferson first opened the White House for public tours because he understood then, as we do now, that this house belongs to the American people. I am proud to continue his tradition. In our country, the halls of government are not reserved for a privileged few, and the President’s workplace should be no exception. Your visit today helps to fulfill my goal of creating the most open and accessible administration in American history. Once again, welcome to the West Wing, and please accept my best wishes for an enjoyable tour. Sincerely, WW Tour ADA video Watch on Youtube This Is A Tour Of The West Wing (In Sign Language) West Wing Receptionist Leah Katz-Hernandez narrates a tour of the West Wing in American Sign Language, visiting the West Wing Lobby, the West Colonnade, the Rose Garden, the White House Press Briefing Room, the Cabinet Room, the Roosevelt Room, and the Oval Office. Watch here for a full audio description. Ground floor 1. Navy Mess The Navy Mess at the White House, June 25, 2009. (Official White House Photo by Lawrence Jackson) Navy Stewards have provided food service to the Commander in Chief since 1880. The modern White House Navy Mess was established under President Harry S. Truman in 1951. The Navy’s culinary specialists prepare and serve fine foods in the West Wing. Seated reservations are available to senior officials including commissioned officers, Cabinet Secretaries, and their guests. Staff located in the West and East Wing can enjoy food made in the Navy Mess from a take-out window located adjacent to the dining hall. 2. Situation Room The Situation Room of the White House, Dec. 30, 2011. (Official White House Photo by Chuck Kennedy) President Barack Obama and Vice President Joe Biden, along with members of the national security team, receive an update on the mission against Osama bin Laden in the Situation Room of the White House, May 1, 2011. Seated, from left, are: Brigadier General Marshall B. “Brad” Webb, Assistant Commanding General, Joint Special Operations Command; Deputy National Security Advisor Denis McDonough; Secretary of State Hillary Rodham Clinton; and Secretary of Defense Robert Gates. Standing, from left, are: Admiral Mike Mullen, Chairman of the Joint Chiefs of Staff; National Security Advisor Tom Donilon; Chief of Staff Bill Daley; Tony Blinken, National Security Advisor to the Vice President; Audrey Tomason Director for Counterterrorism; John Brennan, Assistant to the President for Homeland Security and Counterterrorism; and Director of National Intelligence James Clapper. Please note: a classified document seen in this photograph has been obscured. (Official White House Photo by Pete Souza) Months after being sworn into office, President John F. Kennedy was confronted with the Bay of Pigs Invasion in Cuba and insisted that intelligence information feed directly into the White House. The Situation Room was established in 1961 to meet President Kennedy’s request. The current “Sit Room” is a 5,000-square-foot complex of rooms that is staffed 24 hours a day, seven days a week to monitor national and world intelligence information. Televisions for secure video conferences and technology can link the President to generals and world leaders around the globe. First floor 3. West Colonnade President Barack Obama walks along the Colonnade of the White House to the Oval Office, Feb. 14, 2011. (Official White House Photo by Lawrence Jackson) Also known as the “45 second commute,” the West Colonnade was built for Thomas Jefferson to run alongside service spaces underneath the West Terrace, such as the ice house and storage rooms for coal and wood. The open columned walkway is now used by the President and his staff to travel between the West Wing and the Executive Residence. 4. Rose Garden & South Lawn State Dinner in the Rose Garden of the White House, June 7, 2011. (Official White House Photo by Pete Souza) President Barack Obama walks through the Rose Garden of the White House with National Security Advisor Tom Donilon, April 14, 2011. (Official White House Photo by Pete Souza) The Rose Garden was created by First Lady Ellen Axson Wilson in 1913. It was redesigned by First Lady Jacqueline Kennedy to serve as a Presidential reception area. President Nixon’s daughter, Tricia Nixon Cox, was married here in 1971. Marine One arrives at the South Lawn of the White House, Nov. 2, 2011. (Official White House Photo by Pete Souza) The South Lawn is the site of the President’s Marine One arrivals and departures and includes the White House tennis court, putting green, and, as of March 2009, a kitchen garden. The White House Kitchen Garden includes over 50 kinds of vegetables, as well as berries, herbs, and a beehive. 5. Cabinet Room President Barack Obama holds a Cabinet meeting in the Cabinet Room of the White House, Jan. 31, 2012. (Official White House Photo by Lawrence Jackson) In the Cabinet Room, the President meets with the Cabinet Secretaries, members of Congress, the National Security Council, and foreign Heads of State on topics ranging from energy efficiency to national security. When the President meets around the large mahogany table with the Cabinet Secretaries, each is assigned a chair based on the date their department was established with the oldest Cabinet departments seated closest to the center. The President sits at the center of the table with his back to the Rose Garden doors and opposite the Vice President. As a reflection of their inspiration and governing style, Presidents select the portraits that hang in the Cabinet Room. In May 2009, President Obama chose Frank O. Salisbury’s portrait of President Harry S. Truman to join the portraits of George Washington, Thomas Jefferson, and Theodore Roosevelt already displayed in the room. 6. Oval Office President Barack Obama works at the Resolute Desk in the Oval Office, Feb. 11, 2011. (Official White House Photo by Pete Souza) As the official office of the President and his primary place of work, the Oval Office provides the President with easy access to his senior advisors and the Executive Residence. Beyond its distinctive shape, the most famous feature of the Oval Office is the Resolute Desk. Made from timbers of the H.M.S. Resolute – a British navy ship – it was presented by Queen Victoria to President Rutherford B. Hayes in 1880. Since then, the desk has been used by every President with the exception of Presidents Johnson, Nixon, and Ford. Other notable furnishings in the Oval Office are the two paintings that flank the south windows. The Avenue in the Rain by Childe Hassam, 1917, depicts Fifth Avenue in New York City adorned with flags and banners in support of the Allied war effort during World War I. The Statue of Liberty by Norman Rockwell was prepared for the cover of The Saturday Evening Post to commemorate the Fourth of July in 1946. Each President decorates the Oval Office to suit his tastes, but some features remain constant including the white marble mantel from the original 1909 President’s Office, the Presidential Seal on the ceiling, and the two flags behind the President’s desk – the U.S. Flag and the President’s Flag. In addition to covering the walls with hand-painted striped wallpaper, President Obama added a new oval-shaped rug, which is made of 25% recycled wool. This rug features the Presidential Seal in the center and five historical quotations of meaning by Martin Luther King, Jr. and Presidents Abraham Lincoln, Theodore Roosevelt, Franklin D. Roosevelt, and John F. Kennedy around its border. 7. Roosevelt Room The Roosevelt Room occupies the original location of President Theodore Roosevelt’s office when the West Wing was built in 1902. This room was once called the Fish Room because President Franklin D. Roosevelt used it to display an aquarium and his fishing mementos. In 1969, President Nixon named the room in honor of Theodore Roosevelt for building the West Wing and Franklin D. Roosevelt for its expansion. On the southeast wall hangs President Theodore Roosevelt’s Congressional Medal of Honor awarded posthumously on January 16, 2001 to honor his heroism in the Spanish-American War in 1898. To the left of the fireplace hangs President Theodore Roosevelt’s Nobel Peace Prize, awarded in 1906, for his mediation of the Russo-Japanese War peace settlement. This was the first Nobel Prize awarded to an American. 8. West Wing Lobby The West Wing Lobby of the White House, Dec. 30, 2011. (Official White House Photo by Chuck Kennedy) The West Wing lobby is the reception room for visitors of the President, Vice President, and White House staff. The current lobby was renovated by Richard Nixon in 1970 to provide a smaller, more intimate receiving space. The large gilt clock was likely created from assembled parts (both old and new) to imitate an early nineteenth century clock, similar to those used in churches and other public buildings. The artist inscribed the name “Simon Willard,” an important clock maker at the turn of the nineteenth century. The English-made mahogany bookcase (c.1770) is one of the oldest pieces of furniture in the White House collection. Washington Crossing the Delaware (1851) by Emanuel Leutze and Eastman Johnson is a recreation of Leutze’s monumental life-size painting of the same subject. The painting has numerous historical inaccuracies, including the depiction of the American flag which was designed more than a year after the crossing took place. Vernal Falls is an 1889 view of a waterfall in the Yosemite Valley in California by Thomas Hill. Belonging to the permanent White House collection, this painting complements the c.1881 view of Old Faithful Geyser in Yellowstone by Albert Bierstadt that hangs on the same west wall of the reception room. 9. James S. Brady Press Briefing Room President Barack Obama gives a press conference in the James S. Brady Press Briefing Room of the White House, June 23, 2009. (Official White House Photo by Chuck Kennedy) During the Nixon Administration, more space was required to accommodate the growing press corps. Therefore, in 1970, the briefing room was constructed on top of the emptied pool that was installed for President Franklin D. Roosevelt’s physical therapy. In 2000, the James S. Brady Press Briefing Room was named in honor of former Press Secretary James Brady. He was shot and disabled during a 1981 assassination attempt on President Ronald Reagan. Today, the current White House press corps is made up of about 200 members. With just 49 chairs (arranged 7 by 7), it is up to the White House Correspondents Association to decide who gets these coveted seats. A plaque on each seat displays the name of the news organization to which it is assigned. WW Tour styles - do not display /* INSIDE WH SPECIFIC STYLES */ .longpage-main .nav a{ color: #ffffff; } .longpage-main .nav a:hover{ text-decoration: underline; } .longpage-main .nav p{ margin-bottom: 0; } div#section-354636 h2.section-title, div#section-354626 h2.section-title, div#section-354676 h2.section-title, div#section-354951 h2.section-title, div#section-354986 h2.section-title, div#section-359111 h2.section-title{ display: none; } div#section-359111{ border-bottom: 1px solid #cccccc; } .longpage-section:first-child{ background: transparent; } div#section-354661 h2.section-title{ display:none; padding: 0 auto ; } div#section-354951{ background: #edf2f6; } .longpage-body{ ma