full_description = "As Second Lady of the United States, Dr. Jill Biden works to bring attention to the sacrifices made by military families, to highlight the importance of community colleges to America’s future, and to raise awareness around areas of particular importance to women including breast cancer prevention, all while continuing to teach English full-time at a community college in nearby Virginia. Jill Biden, wife of Vice President Joe Biden, is a mother and grandmother, a lifelong educator, a proud military mom, and an active member of her community. As Second Lady, Dr. Biden works to bring attention to the sacrifices made by military families, to highlight the importance of community colleges to America’s future, and to raise awareness around areas of particular importance to women, including breast cancer prevention, all while continuing to teach as a full-time English professor at a community college in Northern Virginia. Dr. Biden has always said that community colleges are “one of America’s best-kept secrets.” As a teacher, she sees how community colleges have changed the lives of so many of her students for the better. As Second Lady, she works to underscore the critical role of community colleges in creating the best, most-educated workforce in the world. In 2012, she traveled across the country as part of the “Community College to Career” tour to highlight successful industry partnerships between community colleges and employers. In the fall of 2010, she hosted the first-ever White House Summit on Community Colleges with President Obama, and she continues to work on this outreach on behalf of the Administration – frequently visiting campuses, meeting with students and teachers, as well as industry representatives around the country. As a military mom, Dr. Biden understands firsthand how difficult it can be to have a loved one deployed overseas. Dr. Biden’s children’s book – Don’t Forget, God Bless Our Troops – was released in June 2012. Inspired by real-life events, the book tells the story of a military family’s experience with deployment through the eyes of Dr. Biden’s granddaughter, Natalie, during the year her father is deployed to Iraq. The book also includes resources about what readers can do to support military service members and their families."
year_published = 2014
year_updated = 2015
