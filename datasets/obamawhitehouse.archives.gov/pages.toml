description = "See the President's daily schedule, explore behind-the-scenes photos from inside the White House, and find out all the ways you can engage with the most interactive administration in our country's history."
full_description = '''Foreign Policy Regions Spotlight The Americas East Asia Pacific Europe and Eurasia Middle East and North Africa South and Central Asia Sub Saharan Africa Cross-Cutting Issues Regional Issues “For America, the choice is clear: We choose hope over fear. We see the future not as something out of our control, but as something we can shape for the better through concerted and collective effort. We reject fatalism or cynicism when it comes to human affairs. We choose to work for the world as it should be, as our children deserve it to be.” – President Obama, United Nations General Assembly, September 24, 2014 .masthead { margin-top: 16px; } .news-room.clearfix { display: none; } Spotlight Ebola: How We're RespondingEbola continues to be a public health and national security priority, and President Obama and his administration continue to take aggressive measures to respond. Get the facts about Ebola, and learn more about how we're responding."We Will Degrade and Ultimately Destroy ISIL"The President's goal is clear: to degrade and ultimately destroy ISIL through a comprehensive and sustained counterterrorism strategy so that it’s no longer a threat to Iraq, the region, the United States, and our partners. Learn more about our ISIL response here. Tweets by @NSCPress !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+"://platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs"); Tweets by @rhodes44 !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+"://platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs"); The Americas “But even more than interests, we’re bound by shared values. In each other’s journey we see reflections of our own. Colonists who broke free from empires. Pioneers who opened new frontiers. Citizens who have struggled to expand our nations’ promise to all people -- men and women, white, black and brown. We’re people of faith who must remember that all of us -- especially the most fortunate among us -- must do our part, especially for the least among us. We’re citizens who know that ensuring that democracies deliver for our people must be the work of all. This is our common history. This is our common heritage. We are all Americans.” – President Obama, Palacio de La Moneda Cultural Center in Santiago, Chile, March 21, 2011 Highlights View More Charting a New Course on CubaPresident Obama is taking action to cut loose the anchor of failed policies of the past, and to chart a new course in U.S. relations with Cuba.President Obama in Mexico and Costa RicaPresident Obama reinforces the deep cultural, familial, and economic ties that so many Americans share with Mexico and Central America.Vice President Biden Visits BrazilVice President Biden delivers a speech in Rio de Janeiro about the promise of a strong U.S.-Brazil partnership. Latest News From the Blog See All July 01, 2015President Obama Announces that the U.S. Will Reopen Our Embassy in CubaJune 17, 2015Promoting Security and Transparency in Central America: High Level Security Dialogue With the Northern TriangleApril 13, 2015The Seventh Summit of the Americas: The President's Trip and a Historic Meeting Videos June 29, 2016President Obama Addresses ParliamentJune 29, 2016President Obama Participates in a Trilateral Press ConferenceJune 29, 2016President Obama and President Nieto East Asia Pacific “Here, we see the future. As the world’s fastest-growing region-and home to more than half the global economy—the Asia Pacific is critical to achieving my highest priority: creating jobs and opportunity for the American people. With most of the world’s nuclear powers and some half of humanity, Asia will largely define whether the century ahead will be marked by conflict or cooperation, needless suffering or human progress.” – President Obama, Australian Parliament, November 17, 2011 Highlights View More President Obama's 2014 Trip to China, Burma, and AustraliaDeeply committed to his Asia rebalancing strategy, President Obama travels Asia for the second time in 2014 to meet with leaders in China, Burma, and Australia.First Lady Michelle Obama's 2014 Asia TripLearn about the First Lady's trip to China from March 19-26, 2014. She visits Beijing, Xi’an, and Chengdu, inviting students and classrooms across the U.S. to follow her trip.President Obama's Spring 2014 Asia TripThe President’s visit to Japan, the Republic of Korea, Malaysia, and the Philippines focused on our major priorities in the region.Vice President Biden's 2013 Asia TripLearn about the Vice President's six-day trip to Japan, China and the Republic of Korea where the Vice President meets with key leaders to discuss a full range of bilateral, regional and global issues.President Obama’s trip to Thailand, Burma and CambodiaSince taking office President Obama has focused on the importance of Asia Pacific to the future of the United States, both economically and in terms of our political and security objectives in the world.President Obama Meets with President Xi Jinping of ChinaPresident Obama and President Xi Jinping visit the Sunnylands estate in California. Latest News From the Blog See All April 28, 2015Welcome to the U.S.: The Prime Minister of Japan’s State VisitDecember 13, 2013West Wing Week 12/13/13 or, "Madiba, Farewell"July 25, 2013President Obama Meets with President Truong Tan Sang of Vietnam Videos September 06, 2016White House Press BriefingSeptember 06, 2016President Obama and President ParkMay 27, 2016President Obama Participates in a Wreath Laying Ceremony Europe and Eurasia “The buildings that are now living monuments to European unity were not drawn from simple blueprints. They were born out of the blood of the first half of the 20th century and the resolve of the second. Men and women had to have the imagination to see a better future, and the courage to reach for it. Europeans and Americans had to have the sense of common purpose to join one another, and the patience and the persistence to see a long twilight struggle through.” – President Obama, Strasbourg Town Hall, April 3, 2009 Highlights View More President Obama’s 2014 Trip to Estonia and the United KingdomPresident Obama travels to Estonia to meet with leaders of the Baltic States and to Wales to attend the NATO Summit.President Obama’s 2014 Trip to Netherlands, Belgium, Italy, and the Holy SeePresident Obama travels to the Netherlands, Belgium, Italy, the Holy See, and Saudi Arabia from March 24 to March 29 to mobilize the international communityPresident Obama’s 2013 G-20 TripAt his 7th G-20, the President consults leaders of the world’s largest economies on growth, job creation & financial stability.President Obama’s trip to Northern IrelandPresident Obama attends the G-8 Summit in Lough Erne, and speaks to the citizens of Belfast.President Obama Speaks to the People of BerlinPresident Obama discusses the deep and enduring bonds between the United States and Germany, and the values we share.Vice President Biden at the Munich Security ConferenceThe Vice President highlights our strong cooperation with European allies and highlighted our many joint accomplishments over the last four years. Latest News From the Blog See All April 17, 2015President Obama Welcomes Italian Prime Minister Renzi to the White HouseJanuary 14, 2015Chief of Staff Denis McDonough Underscores America’s Solidarity with France, and with Jewish Communities Across the WorldJanuary 07, 2015President Obama Responds to the Attack in France Videos April 25, 2016President Obama Delivers Remarks at Hannover Messe Building 35April 25, 2016President Obama Speaks at the Hannover Messe Trade FairApril 24, 2016President Obama Speaks at the Hannover Messe Trade Fair Middle East and North Africa “Two years ago in Cairo, I began to broaden our engagement based upon mutual interests and mutual respect. I believed then -– and I believe now -– that we have a stake not just in the stability of nations, but in the self-determination of individuals. The status quo is not sustainable. Societies held together by fear and repression may offer the illusion of stability for a time, but they are built upon fault lines that will eventually tear asunder. So we face a historic opportunity. We have the chance to show that America values the dignity of the street vendor in Tunisia more than the raw power of the dictator. There must be no doubt that the United States of America welcomes change that advances self-determination and opportunity. Yes, there will be perils that accompany this moment of promise. But after decades of accepting the world as it is in the region, we have a chance to pursue the world as it should be.” – President Obama, State Department, May 19, 2011 Highlights View More The 2014 U.S.-Africa Leaders SummitIn August, President Obama will welcome leaders from across the African continent to Washington, D.C. for a three-day U.S.-Africa Leaders Summit, to foster stronger ties between the United States and Africa.President Obama’s 2014 Trip to The Kingdom of Saudi Arabia, Netherlands, Belgium...President Obama travels to The Kingdom of Saudi Arabia, the Netherlands, Belgium, Italy, and the Holy See from March 24 to March 29 to mobilize the international community.P5+1 Negotiations with IranPresident Obama has been clear that achieving a peaceful resolution that prevents Iran from obtaining a nuclear weapon is in America’s national security interest.Response to SyriaLearn about President Obama's response to the Assad regime's use of chemical weapons in Syria.President Obama’s trip to the Middle EastIn the first foreign trip of his second term in office, President Obama visited Israel, the West Bank, and Jordan.Middle East Peace negotiators come to WashingtonAt the invitation of Secretary of State John Kerry, Israeli and Palestinian negotiators traveled to Washington to formally resume direct final status negotiations.End of the Iraq WarThe end of our mission in Iraq marks the fulfillment of a promise Barack Obama made to the American people even before he became President. Latest News From the Blog See All November 18, 2014President Obama Holds a Meeting on Ebola, Discusses Attacks in JerusalemSeptember 10, 2014President Obama: “We Will Degrade and Ultimately Destroy ISIL”September 10, 2014Tune In: President Obama Addresses the Nation on the ISIL Threat Videos April 21, 2016President Obama Speaks with the Press April 21, 2016President Obama and King Salman Deliver Statements to the Press November 14, 2014West Wing Week: 11/14/14 or, "The Future That We See" South and Central Asia “That’s what I want to address today —- the future that the United States seeks in an interconnected world, and why I believe that India is indispensable to this vision; how we can forge a truly global partnership -— not just in one or two areas, but across many; not just for our mutual benefit, but for the benefit of the world.” – President Obama, Remarks to the Joint Session of the Indian Parliament in New Delhi, India, November 8, 2010 "We are in Afghanistan to confront a common enemy that threatens the United States, our friends and allies, and the people of Afghanistan and Pakistan who have suffered the most at the hands of violent extremists." – President Obama, Remarks on a New Strategy for Afghanistan and Pakistan, March 27, 2009 Highlights View More Partnering with IndiaWhile visiting India, Vice President Biden held bilateral meetings with Indian leaders to build upon our already close relationship.President Obama Visits IndiaPresident Obama visited India for bilateral meetings with leaders, reaffirming our close relationship.Ending the War in AfghanistanPresident Obama speaks about the importance of ending the war in Afghanistan and reinvesting in America. Latest News From the Blog See All April 17, 2015West Wing Week: 04/17/15 or, "The Quintessential Sounds"January 28, 2015The Peace We Seek: President Obama Speaks to the People of India January 28, 2015Democracy and Progress in India Videos January 28, 2015On Board with Kal Penn: Travels with President Obama in India November 14, 2014West Wing Week: 11/14/14 or, "The Future That We See"August 02, 2013Around the World with the Vice President & Dr. Biden Sub Saharan Africa “I don’t see Africa as a world apart; I see Africa as a fundamental part of our interconnected world. Whether it’s creating jobs in a global economy, or delivering education and health care, combating climate change, standing up to violent extremists who offer nothing but destruction, or promoting successful models of democracy and development —- for all this we have to have a strong, self-reliant and prosperous Africa…And the United States wants to be your partner.” – President Obama, Young African Leaders Town Hall, August 3, 2010 Highlights View More The 2014 U.S.-Africa Leaders SummitIn August, President Obama will welcome leaders from across the African continent to Washington, D.C. for a three-day U.S.-Africa Leaders Summit, to foster stronger ties between the United States and Africa.President Obama meets with African leaders at the White HousePresident Obama and visiting leaders discuss how the U.S. can help continue support for efforts to strengthen democratic institutions and promote economic opportunity across sub-Saharan Africa.U.S. Strategy toward Sub-Saharan AfricaPresident Obama is committed to working closely with our African partners to advance the prosperity, security, and dignity that citizens deserve.Photo Gallery: The First Lady's Trip to South Africa and BotswanaA look at pictures from First Lady Michelle Obama's June 2011 trip to South Africa and Botswana, which focused on youth leadership, education, health, and wellness. Latest News From the Blog See All August 07, 2015West Wing Week: 08/07/15 or, "The Measure Of A Leader"July 26, 2015President Obama Travels to Kenya and EthiopiaNovember 15, 2014Welcoming the G20's Commitment to Stop Ebola and Strengthen Global Health Security Videos August 07, 2015West Wing Week: 08/07/15 or, "The Measure Of A Leader"November 14, 2014West Wing Week: 11/14/14 or, "The Future That We See"October 24, 2014A Digital Briefing on Ebola'''
