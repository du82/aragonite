["http://obamawhitehouse.archives.gov/administration/first-lady-michelle-obama"]
title = "First Lady Michelle Obama | whitehouse.gov"
description = """
From the News RoomLatest NewsRead the latest blog posts from 1600 Pennsylvania Ave
Share-WorthyCheck out the most popular infographics and videos
PhotosView the photo of the day and other galleries
Video GalleryWatch behind-the-scenes videos and more
Live EventsTune in to White House events and statements as they happen
Music & Arts PerformancesSee the lineup of artists and performers at the White House"""
full_description = "First Lady Michelle LaVaughn Robinson Obama is a lawyer, writer, and the wife of the 44th and current President, Barack Obama. She is the first African-American First Lady of the United States. Through her four main initiatives, she has become a role model for women and an advocate for healthy families, service members and their families, higher education, and international adolescent girls education. When people ask First Lady Michelle Obama to describe herself, she doesn't hesitate to say that first and foremost, she is Malia and Sasha's mom. But before she was a mother — or a wife, lawyer, or public servant — she was Fraser and Marian Robinson's daughter. The Robinsons lived in a brick bungalow on the South Side of Chicago. Fraser was a pump operator for the Chicago Water Department, and despite being diagnosed with multiple sclerosis at a young age, he hardly ever missed a day of work. Marian stayed home to raise Michelle and her older brother Craig, skillfully managing a busy household filled with love, laughter, and important life lessons. A product of Chicago public schools, Michelle Robinson studied sociology and African-American studies at Princeton University. After graduating from Harvard Law School in 1988, she joined the Chicago law firm Sidley & Austin, where she later met Barack Obama, the man who would become the love of her life. After a few years, Mrs. Obama decided her true calling was working with people to serve their communities and their neighbors. She served as assistant commissioner of planning and development in Chicago's City Hall before becoming the founding executive director of the Chicago chapter of Public Allies, an AmeriCorps program that prepares youth for public service. In 1996, Mrs. Obama joined the University of Chicago with a vision of bringing campus and community together. As Associate Dean of Student Services, she developed the university's first community service program, and under her leadership as Vice President of Community and External Affairs for the University of Chicago Medical Center, volunteerism skyrocketed."
