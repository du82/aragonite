full_description = '''"The way Washington changes is when people vote." —@POTUS: https://t.co/tzn3mMGN0C #StopGunViolence #GunsInAmerica https://t.co/SRbPbAvKuW Fort Hood Binghamton Aurora Oak Creek Newtown The Navy Yard Santa Barbara Charleston San Bernardino Too many. https://t.co/1zCZ2fFX2n Too many communities across the country are still suffering from the heartbreaking consequences of a gun in the wrong hands. In the past decade, more than 100,000 people have died as a result of gun violence. Many of these crimes were committed by people who never should have been able to purchase a gun in the first place. Sympathy is not enough to stop gun violence. Congress has repeatedly failed to take action, blocking commonsense reforms supported by the vast majority of the American people – including gun owners themselves. The President has a responsibility to do everything in his power to reduce gun violence. This week, he will. For every family who has had a loved one taken by a bullet from a gun, it's time to act to #StopGunViolence. For every family who has had a loved one taken by a bullet from a gun, it's time to act to #StopGunViolence. https://t.co/yI3ZzZFCYY More than 30,000 Americans die from gun violence every year. It's time to help #StopGunViolence. https://t.co/2Wl2y83riB Number of American victims of assaults, robberies, and other crimes involving a gun in the last decade Number of days after which a gun dealer can sell a gun to an individual if a background check is not yet complete So President Obama is taking executive action to reduce gun violence. Here’s what his actions are designed to do: "My 7-year-old son Daniel was among 20 1st graders and 6 brave educators who were shot to death" #StopGunViolence https://t.co/uEs6Ol0YY9 Mark Barden -- father of one of the young children killed at Sandy Hook Elementary in 2012, introduced the President at today's events. He also shared an email message reflecting on the life of his son Daniel and the actions we can take to honor him:'''
