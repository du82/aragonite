full_description = "From the President, to the Vice President, to the Cabinet, learn more about the Executive Branch of the government of the United States. The power of the Executive Branch is vested in the President of the United States, who also acts as head of state and Commander-in-Chief of the armed forces. The President is responsible for implementing and enforcing the laws written by Congress and, to that end, appoints the heads of the federal agencies, including the Cabinet. The Vice President is also part of the Executive Branch, ready to assume the Presidency should the need arise. The Cabinet and independent federal agencies are responsible for the day-to-day enforcement and administration of federal laws. These departments and agencies have missions and responsibilities as widely divergent as those of the Department of Defense and the Environmental Protection Agency, the Social Security Administration and the Securities and Exchange Commission. The President is both the head of state and head of government of the United States of America, and Commander-in-Chief of the armed forces. Under Article II of the Constitution, the President is responsible for the execution and enforcement of the laws created by Congress. Fifteen executive departments — each led by an appointed member of the President's Cabinet — carry out the day-to-day administration of the federal government. They are joined in this by other executive agencies such as the CIA and Environmental Protection Agency, the heads of which are not part of the Cabinet, but who are under the full authority of the President. The President also appoints the heads of more than 50 independent federal commissions, such as the Federal Reserve Board or the Securities and Exchange Commission, as well as federal judges, ambassadors, and other federal offices. The Executive Office of the President (EOP) consists of the immediate staff to the President, along with entities such as the Office of Management and Budget and the Office of the United States Trade Representative."
year_published = 2015
year_updated = 2016
