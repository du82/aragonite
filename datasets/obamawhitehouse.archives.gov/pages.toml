full_description = "Home • The Administration • Office of Science and Technology Policy About Pressroom OSTP Blog Divisions Initiatives R&D Budgets Resource Library NSTC PCAST Contact FEATURED TOPICS CLIMATE CHANGE: Climate change represents one of the greatest challenges of our time. The impacts of climate change are already being felt across the United States and around the world, increasing the frequency and severity of natural disasters, causing harm to both human and ecological health, and threatening our property, infrastructure, national security, and overall quality of life. While no single step can reverse the effects of climate change, the President has taken unprecedented action to address this critical issue, including outlining a comprehensive strategy to mitigate, prepare for, and lead global efforts to fight climate change under the Climate Action Plan; limiting carbon pollution from power plants under the Clean Power Plan; and leading a historic trip to the Arctic to raise awareness of the impacts of climate change. Learn more: White House: Energy, Climate Change, and Our Environment Climate Action Plan Fact Sheet Progress Report Clean Power Plan Fact Sheet White House: President Obama’s Trip to Alaska Fact Sheet: U.S. Leadership and the Historic Paris Agreement to Combat Climate Change National Climate Assessment 2016 WHITE HOUSE SCIENCE FAIR: Beginning in 2010, President Obama established a tradition of welcoming K–12 students from around the country to the White House for the White House Science Fair, recognizing the extraordinary work that our Nation’s young people are already doing in science, technology, engineering, and math (STEM), and inspiring others to get excited about and involved in these important subjects. The 2016 White House Science Fair on April 13, 2016, was the biggest yet, including more than 130 students from more than 30 states. Learn more: 2016 White House Science Fair Fact Sheet Blog Student Exhibitors and Honored Guests Video Coverage h3.initiative-title {margin: 20px 0 4px !important;} .block ul {padding: 0 0 0.25em 1em;} body li { line-height: 1.5em; padding-bottom: 0.4em;} .sublist {margin: 0 0 0 2.667em; list-style-type: circle;}"
