ist()) { // mobile theme $('#submission-thank-you').insertAfter('body > header'); jq183('#submission-thank-you').slideDown(2000).delay(5000).slideUp(2000); } else if ($('body.fd').doesExist()) { // framedynamic theme $('#submission-thank-you').insertAfter('#header'); jq183('#submission-thank-you').slideDown(2000).delay(5000).slideUp(2000); } else { // whitehouse theme $('#submission-thank-you').insertAfter('#header'); jq183('#submission-thank-you').slideDown(2000).delay(5000).slideUp(2000); } } });'''
