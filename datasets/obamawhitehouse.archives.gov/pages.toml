["http://obamawhitehouse.archives.gov/about/inside-white-house/eeob-tour"]
title = "Tour the Eisenhower Executive Office Building | The White House"
description = "See the President's daily schedule, explore behind-the-scenes photos from inside the White House, and find out all the ways you can engage with the most interactive administration in our country's history."
full_description = '''Inside the White House Tour the Eisenhower Executive Office Building WW Tour nav History | West Wing Tour | Executive Office Building Tour | Video Series | Décor and Art | Holidays EEOB tour intro The Eisenhower Executive Office Building (EEOB) is located next to the West Wing, and houses a majority of offices for White House staff. Originally built for the State, War, and Navy Departments between 1871 and 1888, the EEOB is an impressive building that commands a unique position in both our national history and architectural heritage. Designed by Supervising Architect of the Treasury Alfred Mullett, the granite, slate, and cast iron exterior makes the EEOB one of America’s best examples of the French Second Empire style of architecture. Construction took 17 years as the building slowly rose wing by wing. The EEOB was finished in 1888 and was the largest office building in Washington with nearly 2 miles of black and white tiled corridors. The Navy Department left in 1918 (except for the Secretary who stayed until 1921), followed by the War Department in 1938, and finally by the State Department in 1947. The White House began to move some of its offices across West Executive Avenue in 1939, and in 1949 the building was turned over to the Executive Office of the President and renamed the Executive Office Building. The building was designated a National Historic Landmark in 1969. The building continues to house various agencies that comprise the Executive Office of the President, such as the White House Office, the Office of the Vice President, the Office of Management and Budget, and the National Security Council. EEOB Rooms The Vice President's Ceremonial Office The top drawer of the Vice Presidents desk has been signed by Vice Presidents Cheney, Gore, Quayle, Mondale, and Rockefeller; and Presidents Truman and Eisenhower. The current Vice President's Ceremonial Office was originally used as the Secretary of Navy's office from 1879 to 1923. From 1923 to 1947, General John Pershing occupied the office initially as the Army Chief of Staff then as the Chairman of the Battle and Monuments Commission, becoming the longest single occupant of this room (24 years). Additionally, President Hoover used the office for three months following a Christmas Eve fire in the West Wing in 1929. Since 1960 it has been used as the Vice President's Ceremonial Office with the exception of Vice President Hubert Humphrey, because Lyndon Johnson did not give up the office when he became President after the Kennedy assassination. The current desk is part of the White House collection, and was commissioned to be built for Theodore Roosevelt's use in the Oval Office. Several important figures have used the desk including Presidents Taft, Wilson, Harding, Coolidge, and for a few months, Hoover. The desk was placed in storage early on during Herbert Hoover's Presidency where it remained until 1945 when President Truman then used it. Vice President Johnson and all subsequent Vice Presidents (except Hubert Humphrey) have used the desk. Since the 1940s, various users have signed the inside of the top drawer. The top drawer has been signed by Vice Presidents Cheney, Gore, Quayle, Mondale, and Rockefeller; and Presidents Truman and Eisenhower. Secretary of War Suite The Secretary of War Suite consists of ten rooms designed by Stephen Decatur Hatch, a prominent New York architect of the late 19th-century. Beginning in March of 1888, Secretary of War William Endicott occupied the suite. The suite would continue on to be occupied by 18 Secretaries of War until July 1939. Notable Secretaries of War included William Endicott, Elihu Root, William Howard Taft, and Henry Stimson. History made in these rooms included the development, review, and acceptance of all plans of defense for our nation and our armed forces in times of conflict as well as in times of peace between 1888 and 1939. The War Department moved from the building between 1938-39. The Bureau of the Budget, newly established by Franklin Roosevelt's administration, immediately took possession of these rooms. Another event of interest occurred in 1908, while in his office in what is now EEOB 230B, Secretary of War Taft received word by telephone that the Republican convention in Chicago had nominated him for the presidency. The Cordell Hull Room & the Diplomatic Reception Room Diplomatic Reception Room Cordell Hull Room When the south wing of the State Department first opened in 1875, it had three spectacular rooms designed to be showplaces for the department. One of these was the office of the Secretary of State located at the center of the second floor with three windows opening onto the south portico and a view of the Potomac River. The other two rooms included the State Department Library (now the EOP library) and the Diplomatic Reception Room (room 212, pictured upper right). A total of 24 men served 25 terms as Secretary of State (James G. Blaine served as Secretary of State for two terms—the first term March 1881 to December 1881, and the second term March 1889 to June 1892) in the EEOB. Hamilton Fish was the first Secretary of State to serve in this office, from July 1875 to March 1877. He and his staff moved into the building before the wing was fully completed in December 1875. Many important events have occurred in these rooms. In 1898, Secretary of State John Hay handed the Spanish ambassador his credentials and passport, thus signifying our declaration of war against Spain. During his term, Hay supported an American imperialist solution to the Spanish-American War, helped formulate the "Open Door" policy in China, arranged treaties to facilitate the building of the Panama Canal, and worked with President Roosevelt in settling the Russo-Japanese War. On Sunday morning, December 7, 1941, Secretary of State Cordell Hull was in his office (pictured lower right) meeting with his aides and discussing the volatile situation in the Far East. The meeting was interrupted when intercepted messages between Japanese Foreign Minister Togo and Japanese Ambassadors to the US were delivered to Secretary Hull's office. After receiving a phone call from President Roosevelt informing him of a Japanese attack on Pearl Harbor, Secretary Hull met with the Japanese Ambassador. The next day, Congress declared war on Japan. Later, in 1942, the United Nations Declaration was drafted and signed in this room. George Catlett Marshall was the last Secretary of State to serve in this office. Marshall oversaw the move of the Department of State staff from the EEOB to their new offices in Foggy Bottom, in the old War Department building, which was mostly complete by May 1947. Indian Treaty Room The Indian Treaty Room is located on the east wing's fourth floor and was originally the Navy Department Library. It was designed by Richard Ezdorf and was completed in 1880. The room does not resemble a library as we know it; the books were shelved in alcoves on two levels at each end adjacent to the main reading room. The Navy Department vacated the building between 1918 and 1921, with the library last to leave in 1923. The Indian Treaty Room was later used for presidential press conferences from 1950 until 1961. President Eisenhower held the first televised presidential press conference in this room on January 19, 1955. Phone booths were located just outside the door to accommodate the press needing to call in their stories for late breaking news. The room's designation as the "Indian Treaty Room" is one of the building's most interesting mysteries. It is not known how the room inherited its name despite considerable research. Its first mention in the press was in 1954, and many recall the days between 1923 and 1942 when the State Department used the room as storage space, and perhaps someone thought that treaties with Native American tribes were stored in the room. The War Library / The Law Library Originally designated as the War Department Library, the room was designed by Austrian-born Richard Ezdorf, a draftsman for the Supervising Architect of the Treasury, and completed in 1887. Ezdorf selected an eclectic mix of the French Renaissance, Classical, and Gothic Revival styles. Mixing elements of these styles was very popular in the late 19th-century and became characteristic of the high Victorian style. The War Department's library collection included books, charts, maps, and photographs. This includes photographs and their negatives taken by Mathew Brady during the Civil War, which were acquired by the War Department in 1875 for $25,000 when financial difficulties forced Brady to sell them. The U.S. Signal Corps became responsible for the library in 1894, and the War Department occupied the space until 1938 when they vacated the building. Between 1938 and 1970, the library was used for storage. In 1970, the library was renovated for use as a conference room. The library is currently used to house the Law Library for the Executive Office of the President. East Rotunda Located on the West Executive Avenue, center corridor side of the EEOB, the East Rotunda was designed for the Department of Navy by Richard Ezdorf, chief draftsman for the Supervising Architect of the Treasury; completed in 1879. West Rotunda Located on the 17th Street, center corridor side of the EEOB, the West Rotunda was designed for the Department of War by Richard Ezdorf, chief draftsman for the Supervising Architect of the Treasury; completed in 1888. Truman Bowling Alley On April 19, 1947, President Harry Truman was presented with the gift of two bowling lanes in the basement of the Executive Offices (today's West Wing where the Situation Room is presently located). The lanes came with an automatic pinsetter, which had been successfully introduced the year before at the 1946 American Bowling Congress (ABC) Tournament by AMF. In 1953, President Truman gave the lanes to the employees of the White House and the bowling alley first opened. In 1955, the lanes were moved from the West Wing's basement to the EEOB's basement. President Richard Nixon was the most avid of the presidential bowlers, spending as many as four hours at a time rolling games. EEOB Tour styles - do not display div#section-354636 h2.section-title, div#section-354626 h2.section-title, div#section-354676 h2.section-title, div#section-354951 h2.section-title, div#section-354986 h2.section-title, div#section-355941 h2.section-title, div#section-354991 h2.section-title{ display: none; } .longpage-section:first-child{ background: transparent; } div#section-354661{ background: #03476a; padding: 2em 0; } div#section-354661 h2.section-title{ display:none; padding: 0 auto ; } div#section-354626, div#section-354951, div#section-354986{ background: #edf2f6; } .longpage-body{ margin-top: 0; } .longpage-main p{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; font-size: 16px; } .longpage-main .byline{ font-size: 100%; font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif;} .longpage-nav-menu li a{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; } .longpage-main .longpage-body ol li, .longpage-main .longpage-body ul li{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; margin-bottom: 1em; } .longpage-section{ padding: 3em 0; } .longpage-main .masthead-wrap{ background: #579ccf; /* Old browsers */ background: -moz-linear-gradient(top, #579ccf 0%, #265e90 100%); /* FF3.6-15 */ background: -webkit-linear-gradient(top, #579ccf 0%,#265e90 100%); /* Chrome10-25,Safari5.1-6 */ background: linear-gradient(to bottom, #579ccf 0%,#265e90 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */ background: url("/sites/d