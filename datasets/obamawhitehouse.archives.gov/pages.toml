ng government to be more open, transparent, and accountable. Top Issues Economy This is a make or break moment for the middle class, and President Obama is working to build an economy that works for everyone — where hard work and responsibility are rewarded. Learn more Related Topics The Economic Record Creating American Jobs Security for the Middle Class Supporting American Businesses Education President Obama believes that every child deserves access to the type of education they need to prepare for the challenges of a new century. Learn more Related Topics The Record on Economy and Education Early Childhood Education K-12 Education Support for Higher Education Reform for the Future Energy and the Environment President Obama is building the foundation for a clean energy economy, tackling the issue of climate change, and protecting our environment. Learn more Related Topics The Record on Climate President Obama's Climate Action Plan Securing American Energy Our Environment Immigration Our nation's immigration system is broken. Fixing it is an economic and national security imperative. That's why President Obama is working to pass a common sense, comprehensive set of reforms that ensures everyone plays by the same rules. Learn more Related Topics Border Security Strengthening Enforcement Earned Citizenship Streamlining Legal Immigration Immigration & the Economy En Espanol Health Care President Obama is reforming health care to ensure a more secure future for American families. Learn more Related Topics The Record on Health Reform About the Affordable Care Act The New Law and You The Affordable Care Act & Medicare More Issues Civil Rights Disabilities Ethics Family Fiscal Responsibility Foreign Policy Homeland Security Poverty Rural Seniors & Social Security Service Taxes Technology Urban and Economic Mobility Veterans Violence Prevention Women'''
