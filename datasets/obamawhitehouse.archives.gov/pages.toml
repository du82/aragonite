PhotosView the photo of the day and other galleries
Video GalleryWatch behind-the-scenes videos and more
Live EventsTune in to White House events and statements as they happen
Music & Arts PerformancesSee the lineup of artists and performers at the White House"""
full_description = "In our eighth and final Holiday season of the Obama Administration, we present ‘The Gift of the Holidays’. This joyous season is always filled with opportunities to perform acts of kindness and goodwill. Whether by expressing gratitude to a service member, offering a token of appreciation to a teacher, or sharing moments of love and laughter with our neighbors, all of us can extend hands of friendship and reflect on what it means to be a part of our American family. As we look toward a new year filled with renewed hope and possibility, let us take time to share the holiday spirit of generosity and compassion with those we love. Each year, guests from across our country and around the world travel to our nation's capital to rejoice in the holidays. From floor to ceiling, rooms are trimmed with reminders of the bountiful gifts Americans hold dear. This year’s White House decorations also pay tribute to our Nation's service members and veterans for their gift of service and sacrifice. The East Garden Room features an American flag display formed from images of brave military members and their families, and Gold Star ornaments adorn the evergreen that honors the men and women who have laid down their lives for our country. Send a digital message of gratitude to our active duty service men and women.\u0003 The USO will share your message with our heroes through their centers around the world where our uniformed men and women are currently deployed. Send a message now: www.uso.org/holiday-form For more information on supporting our service members, veterans, and their families, please visit www.JoiningForces.gov. To engage online, please use #JoiningForces. The White House Library is a special reminder of the important gift of an education. A cozy room packed full of treasured books, the Library is adorned with a child’s school supplies; yellow pencils, bright crayons, and paper note cards create one-of-a-kind topiaries with chalkboard pedestals. In the colorful ornaments, the word “girls” is spelled in many languages to recognize the millions of adolescent women around the world who are not in school."
year_published = 2016
year_updated = 2016
