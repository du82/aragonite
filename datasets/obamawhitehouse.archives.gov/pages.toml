title = "Engage page | The White House"
description = "See the President's daily schedule, explore behind-the-scenes photos from inside the White House, and find out all the ways you can engage with the most interactive administration in our country's history."
full_description = '''Engage and Connect Engage with your government on the issues that matter most. Jump to a Section Connect Inside the First Digital White House Go To Top Facebook Twitter Engage - Social channels Connect with the White House See More Engage - SOTU Inside the Most Open and Participatory Administration in History Since day one, President Obama has always worked to make 1600 Pennsylvania and this Administration as open and accessible as possible, to keep pace with the changing ways we connect with each other, and to invite the American public to be a part of his Presidency, reaching people where the conversation is already happening online. The State of the Union and Big Block of Cheese Day The State of the Union Address is the President’s most important speech of the year. Since 2011, the White House has made the address accessible to more people and used it to kickstart conversations between the Administration and the American people on the challenges ahead. In 2011, the White House first aired a live enhanced stream of the President’s State of the Union Address, complete with charts and stats to help Americans better understand key points. In 2014, the Administration hosted the first-ever virtual “Big Block of Cheese Day,” during which dozens of White House officials took to social media for a day long ‘open house’ answering questions in real-time on Twitter, Facebook, Tumblr, Instagram and via Google+ Hangout. Learn more We the People: A New Way to Petition Your Government Launched in September of 2011, We the People was a new way to digitally petition the government. Using the platform, anybody could create a petition, gather support, and – if they reached a defined number of signatures – receive a response directly from Administration officials. Over the course of President Obama’s administration, hundreds of thousands of petitions were launched and millions of signatures were collected – some of these efforts resulting in real change. Often, petitions resulted in ongoing engagement with the White House, with petitioners being invited to online hangouts and in person conversations with Administration officials. Learn more South by South Lawn: A White House Festival of Ideas, Art, and Action In March 2016, President Obama traveled to South by Southwest® for a conversation on civic engagement. In Austin, he called on creative thinkers and entrepreneurs from across the country to help tackle our toughest challenges. In October 2016, the White House celebrated that spirit of innovation at the first-ever South by South Lawn, a White House festival of ideas, art, and action. At SXSL, we celebrated the inspiring work that so many Americans have already accomplished - called on everyone to roll up their sleeves and discover their own way to make a positive difference in our country. Learn more Read more about President Obama's digital firsts Engage - styles - do not display /* ENGAGE SPECIFIC STYLES */ .longpage-main hr{ border: 1px solid #d9d9d9; margin: 40px 0; } .socialblocks .thegrid.three.more{ padding: 7.5em 0; text-align: center; } .socialblocks .thegrid.three.fb{ background: #fff url("/sites/default/files/image/engage/engage-fb.png") no-repeat center center; !important } .socialblocks .thegrid.three.tw{ background: #fff url("/sites/default/files/image/engage/engage-tw.png") no-repeat center center; !important } .socialblocks .thegrid.three.ig{ background: #fff url("/sites/default/files/image/engage/engage-ig.png") no-repeat center center; !important } .socialblocks .thegrid.three.snap{ background: #fff url("/sites/default/files/image/engage/engage-snap.png") no-repeat center center; !important } .socialblocks .thegrid.three.yt{ background: #fff url("/sites/default/files/image/engage/engage-yt.png") no-repeat center center; !important } .socialblocks .thegrid.three.tumblr{ background: #fff url("/sites/default/files/image/engage/engage-tumblr.png") no-repeat center center; !important } .socialblocks .thegrid.three.medium{ background: #fff url("/sites/default/files/image/engage/engage-medium.png") no-repeat center center; !important } .socialblocks .thegrid.three.flickr{ background: #fff url("/sites/default/files/image/engage/engage-flickr.png") no-repeat center center; !important } .socialblocks .thegrid.three{ background: #fff; margin-right: 15px; margin-bottom: 15px; box-shadow: 0px 1px 5px 0px rgba(0, 0, 0, 0.2); border: 1px solid #c9d5de; height: 222px; } .socialblocks .thegrid.three:last-child{ margin-right: 0; } /* SECTIONS */ h2.section-title { display: none; } .longpage-section{ padding: 4em 0; } .longpage-body{ margin-top: 0; } /* END SECTIONS */ /* TYPOGRAPHY */ .longpage-main .summary{ font-size: 20px; } .longpage-main p{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; font-size: 16px; } .longpage-nav-menu li a{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; } .longpage-main .longpage-body ol li, .longpage-main .longpage-body ul li{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; margin-bottom: 1em; } .longpage-main h1{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; } .longpage-main h1.title{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; color: #ffffff; text-transform: capitalize; } .longpage-main h2 { font-size: 2.5em; font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; margin: 0.83em 0; color: #003366; } /* .longpage-main h2 { font-size: 2.5em; font-family: "HCo Hoefler Text",Georgia,"Times New Roman","DejaVu Serif",serif; margin: 0.83em 0; color: #003366; }*/ .longpage-main h2.subtitle { font-size: 30px; } .longpage-main h3 { font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; color: #003366; } .longpage-main h4 { font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; font-weight: bold; } .longpage-main h5{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; } .longpage-main blockquote{ font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; font-size: 20px; color: #333333; margin: 30px; border-left: 3px solid #cccccc; background: none; line-height: 1.5; font-weight: 100; } .longpage-main blockquote p{ margin-top: 15px; } .image-caption { font-size: 13px; color: #999999; background: #f0f0f0; padding: 10px; } /* END TYPOGRAPHY */ /* MASTHEAD/HERO */ .longpage-main .masthead-wrap{ background: url(/sites/default/files/image/engage/engage_header.jpg); background-size: cover; background-position: top center; } .longpage-main .masthead-wrap .masthead{ padding: 15em 0 5em 0 !important; } /* END MASTHEAD/HERO */ /* NAV START */ .longpage-nav-wrapper{ box-shadow: none; -webkit-box-shadow: none; border:0; background: #03476a; } .longpage-nav-menu li a{ color: #ffffff; font-weight: normal; font-family: "HCo Whitney","HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Nimbus Sans L",sans-serif; letter-spacing: 1px; } .longpage-nav-social-media-links{ display: none; } .longpage-nav .longpage-nav-menu{ width: auto; } .longpage-nav .longpage-nav-aside{ width: auto; } .longpage-nav-top-link a:link, .longpage-nav-top-link a:visited{ color: #2aa3f3; } .longpage-nav-top-link{ border: 1px solid #2aa3f3; } .longpage-nav-menu li.first a{ border-left: 1px solid #2aa3f3; } .longpage-nav-menu li a{ border-right:1px solid #2aa3f3; } /* NAV END */ /* RESPONSIVE STYLES */ @media (max-width: 48em){ .longpage-main .masthead-wrap .masthead{ padding: 6em 0 5em 0 !important; } } /* END RESPONSIVE STYLES */ /* Grid Specs Start */ .thegrid { display: inline-block; vertical-align: top; } .thegrid.three { width: 32%; } .thegrid.two-thirds { width: 66%; } .thegrid.two { width: 49%; } .thegrid .image-wrapper { width: 100%; height: 0; padding-top: 56.25%; position: relative; text-align: center; } .thegrid .image-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding-right: 20px; } .thegrid .image-caption { padding-right: 12px; padding-top: 16px; margin-right: -12px; } .thegrid .image-caption h5 { font-size: 18px; min-height: 46px; } .thegrid .image-caption h5 small { text-transform: uppercase; font-weight: normal; font-size: 13px; } .thegrid .image-caption p { font-size: 15px; } .image-caption.description.left { margin-left: 16px; } @media screen and (max-width: 48em) { .image-caption.description.left { margin-left: 0px; }} @media screen and (max-width: 48em) { .thegrid.two, .thegrid.three { width: 100%; }} /* Grid Specs End */'''
