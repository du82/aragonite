; }; }); // GA Tracking checks // Iterate through the elements the user hasn't yet scrolled beyond (if any), keeping track of // the furthest element reached with the max_idx variable for (var i=max_idx+1; i<all_sections.length; i++) { if (scrollDistance > all_sections.eq(i).offset().top - pageHeight*.7) { ga('send', 'event', "Longpage Scroll", "Climate Section Reached", all_sections.eq(i).text()); max_idx = i; } } }); }); $(document).ready(function(){ $('.show-hide').hide(); $('.toggle-text').click(function(){ $(this).next('.question-text').toggleClass('show-less'); $(this).next('.show-hide').slideToggle('fast'); return true; }); $('#htab2').addClass('active'); /* $('#clickable').click(); */ }); Clean Power Plan Americans have demonstrated their dedication to climate action through a wide variety of commitments. Learn more about these efforts. Mayors Businesses Campuses The Clean Power Plan The Clean Power Plan sets achievable standards to reduce carbon dioxide emissions by 32 percent from 2005 levels by 2030. By setting these goals and enabling states to create tailored plans to meet them, the Plan will: Protect the health of American families. In 2030, it will: Prevent up to 3,600 premature deaths Prevent 1,700 non-fatal heart attacks Prevent 90,000 asthma attacks in children Prevent 300,000 missed workdays and schooldays Boost our economy by: Leading to 30 percent more renewable energy generation in 2030 Creating tens of thousands of jobs Continuing to lower the costs of renewable energy Save the average American family: Nearly $85 a year on their energy bills in 2030 Save enough energy to power 30 million homes in 2030 Save consumers $155 billion from 2020-2030 Learn what the Plan means for your state .topper { color: #017c8c !important; font-family: helvetica, arial, sans-serif !important; text-transform: uppercase; margin-bottom:25px !important; } .grid-14.right.clearfix { width: 326px; margin-top: 0px !important; } .grid-25.clearfix { width: 50%; } .grid-26.clearfix { width: 46%; margin-top: 15px; margin-right: 15px; margin-bottom: 25px; } .grid-13 { width: 23%; margin-right: 12px; } .grid-14 { width: 25%; } Due to climate change, the weather is getting more extreme Due to climate change, the weather is getting more extreme Temperatures are rising across the U.S. 2014 was the hottest year on record globally, and 2015 is on track to break that record. Globally, the 10 warmest years on record all occurred since 1998. Source: NOAA For the contiguous 48 states, 7 of the 10 warmest years on record have occurred since 1998. Source: NOAA Extreme weather comes at a cost Climate and weather disasters in 2012 alone cost the American economy more than $100 billion $30 Billion U.S. drought/heatwave Estimated across the U.S. $65 Billion Superstorm Sandy Estimated $11.1 Billion Combined severe weather Estimated for incidents across the U.S. $1 Billion Western wildfires Estimated $2.3 Billion Hurricane Isaac Estimated There are also public health threats associated with extreme weather Children, the elderly, and the poor are most vulnerable to a range of climate-related health effects, including those related to heat stress, air pollution, extreme weather events, and diseases carried by food, water, and insects. We can choose to believe that Superstorm Sandy, and the most severe drought in decades, and the worst wildfires some states have ever seen were all just a freak coincidence. Or we can choose to believe in the overwhelming judgment of science — and act before it's too late." - President Obama Share on FacebookShare on Twitter #section-272461 { margin: none; border-top: 1px solid #bc312e !Important; position: relative; border-bottom: 1px solid #bc312e !Important; border-right: 1px solid #bc312e !Important; border-left: 16px solid #bc312e !Important; padding: 50px 25px; margin-top: 50px; } #section-272461 .section-title { display: none; } .section-body { width: 918px !important; } .big { font-size: 38px; font-family: helvetica, 