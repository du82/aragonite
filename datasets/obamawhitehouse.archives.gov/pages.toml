["http://obamawhitehouse.archives.gov/issues/defense"]
title = "Defense | whitehouse.gov"
description = "The Obama Administration is investing in our nation's defensive military forces needed to deter war and to protect the security of our country in the 21st Century.  Thanks to the extraordinary service of our men and women in uniform, we’re winding down a decade of war; we’re destroying the terrorist network that attacked us; we’re strengthening the alliances that extend our values. And today, every American can be proud that the United States is safer and stronger and more respected in the world.  President Barack Obama"
full_description = "The Obama Administration is investing in our nation's defensive military forces needed to deter war and to protect the security of our country in the 21st Century. The Obama Administration is investing in a strong, agile, well-trained, and well-equipped U.S. military that can fight and win the nation’s wars. U.S. Armed Forces must be able to prevail in current operations and the missions they are most likely to face, while developing capabilities to deter potential adversaries and provide a hedge against other risks and contingencies. Our policies will incorporate lessons from our experience in Iraq and Afghanistan. First and foremost, we will ensure that our troops have the training, equipment and support that they need when they are deployed, and the care that they and their families need and deserve. The National Security Strategy, released May 27, 2010, lays out a strategic approach for advancing American interests, including the security of the American people, a growing U.S. economy, support for our values, and an international order that can address 21st century challenges. On August 5, 2011 President Obama announced new commitments to servicemembers and veterans that will provide a comprehensive plan to lower veteran unemployment and ensure that servicemembers leave the military career-ready through hiring tax credits, private sector commitments, and reforms that improve the way we prepare, train, and educate servicemembers for life after the military. The commitment to America's veterans includes: Lighten Burdens on Our Brave Troops and Their Families: Those in uniform are not the only ones who serve; military families are a top priority for this Administration. The President has announced plans to raise military pay and continue providing quality child-care, job-training for spouses, and expanded counseling and outreach to families that have known the separation and stress of war. First Lady Michelle Obama and Dr. Jill Biden have launched the Joining Forces initiative to mobilize all sectors of society to give our service members and their families the opportunities and support they have earned."
year_published = 2015
year_updated = 2015
