full_description = '''Although 'Air Force One' can describe any Air Force aircraft carrying the President, it is now standard practice to use the term to refer to specific planes equipped to transport the Commander-in-Chief. The President of the United States must be ready to travel anywhere in the world on a moment’s notice. Fortunately, modern Presidents have access to a variety of transportation options — including flying aboard Air Force One. Technically, Air Force One is used to describe any Air Force aircraft carrying the President — but since the middle of the 20th century, it has been standard practice to refer to specific planes that are equipped to transport the Commander-in-Chief. Today, this name refers to one of two highly customized Boeing 747-200B series aircraft, which carry the tail codes 28000 and 29000. The Air Force designation for the aircraft is VC-25A. Air Force One is one of the most recognizable symbols of the presidency, spawning countless references not just in American culture but across the world. Emblazoned with the words "United States of America," the American flag, and the Seal of the President of the United States, it is an undeniable presence wherever it flies. Capable of refueling midair, Air Force One has unlimited range and can carry the President wherever he needs to travel. The onboard electronics are hardened to protect against an electromagnetic pulse, and Air Force One is equipped with advanced secure communications equipment, allowing the aircraft to function as a mobile command center in the event of an attack on the United States. Inside, the President and his travel companions enjoy 4,000 square feet of floor space on three levels, including an extensive suite for the President that features a large office, lavatory, and conference room. Air Force One includes a medical suite that can function as an operating room, and a doctor is permanently on board. The plane’s two food preparation galleys can feed 100 people at a time. Air Force One also has quarters for those who accompany the President, including senior advisors, Secret Service officers, traveling press, and other guests. Several cargo planes typically fly ahead of Air Force One to provide the President with services needed in remote locations.'''
year_published = 2015
year_updated = 2015
clearnet = "http://obamawhitehouse.archives.gov/1600/air-force-one"
