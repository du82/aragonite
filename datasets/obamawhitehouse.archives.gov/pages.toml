d9d9d9; } .wrapperborder5 { width:100%; margin-bottom:25px; min-height:150px; border-bottom: 1px solid #d9d9d9; } .wrapperborder6 { width:100%; margin-bottom:25px; min-height:2000px; border-bottom: 1px solid #d9d9d9; } .wrapperborder7 { width:100%; margin-bottom:25px; min-height:550px; border-bottom: 1px solid #d9d9d9; } .wrapperborder8 { width:100%; margin-bottom:25px; min-height:750px; border-bottom: 1px solid #d9d9d9; } .longpage-main p { font-family: Helvetica,Arial,"Lucida Grande","Nimbus Sans L",sans-serif; line-height: 1.5; color: #333; font-size: 17px; } .longpage-main .longpage-body ol li, .longpage-main .longpage-body ul li { margin-bottom: 12px; color: #6a6a6a; line-height: 1.5; font-size: 16px; width: 80%; } .masthead-wrap { background-color: #006ab2; background-image: linear-gradient(#006ab2,#FDFDFD); } @media screen and (max-width: 750px){ .hearpresident { width: 100% !important; } .wrapperborder1 { width:100%; margin-bottom:25px; min-height:100px; } .wrapperborder2 { width:100%; margin-bottom:25px; min-height:370px; } .wrapperborder3 { width:100%; margin-bottom:25px; min-height:325px; } .wrapperborder4 { width:100%; margin-bottom:25px; min-height:300px; } .wrapperborder5 { width:100%; margin-bottom:25px; min-height:180px; } .wrapperborder6 { width:100%; margin-bottom:25px; min-height:2000px; } } Video and Multimedia Sites Accounts Flickr (privacy policy) The White House Let’s Move Hulu (privacy policy) Inside the White House Music and the Arts President Obama's Weekly Address Speeches of President Obama West Wing Week The White House: Behind the Scenes White House White Board Instagram (privacy policy) The White House First Lady Michelle Obama Vice President Joe Biden Dr. Jill Biden Pete Souza Reach Higher WH Kitchen Garden iTunes (privacy policy) White House Podcasts Periscope (privacy policy) The White House The First Lady Joining Forces White House OSTP Pinterest (privacy policy) The White House SnappyTV (privacy policy) Individual Staff Accounts Spotify (privacy policy) The White House UStream (privacy policy) The White House Vine (privacy policy) @WhiteHouse @WHVine Vimeo (privacy policy) The White House YouTube (privacy policy) The White House Let’s Move Document Sharing Sites Accounts Avue (privacy policy) The White House Internship Program Drupal (privacy policy) The White House ESRI (privacy policy) The White House Mapbox (privacy policy) The White House Scribd (privacy policy) The White House SlideShare (privacy policy) The White House Socrata (privacy policy) The White House Third-Party Sites & Privacy Impact Assessment The White House has conducted and published a Privacy Impact Assessment of Third-Party Sites. 1. OVERVIEW & PURPOSE The White House has official pages or accounts on a variety of popular social network and media sites and applications to share content and engage with the American public. Third parties design and operate these sites (“third-party sites”), and the White House is one of many users on these sites. Additionally, the White House uses applications and tools provided by third-parties on WhiteHouse.gov (“third-party tools”) to share content and engage with the American public. Consistent with the policy articulated in OMB Memorandum M-10-23, this Privacy Impact Assessment (PIA) analyzes the White House’s use of third-party sites and tools and how this use could result in personally identifiable information (PII) becoming available to the White House. The social networks listed accounts for third-party sites and tools used by the White House, to be updated periodically. Every third-party site and tool used by the White House has its own privacy policy. The White House has reviewed these privacy policies, but individuals should consult those policies to understand how the third-party site or tool will treat information relating to them. Some third-party sites or tools may collect PII during the registration process, but the White House does not solicit or collect this information. The White House uses a variety of third-party sites and tools, which fall into a few general categories: Social networks — Sites where users may create their own pages, share their own content, and access content and applications created and shared by other uses on the site. These sites include, but are not limited to, Facebook, MySpace, LinkedIn, Twitter, and Digg. Video, image, and document sharing platforms — Sites where users may upload images, videos, and other content to share with the general public, who can view the content without having an account. These sites may require an account for users to comment on images or video. These sites include, but are not limited to, YouTube, Flickr, Vimeo, Hulu, Ustream, Socrata, and SlideShare. Submission and rating applications — Sites and applications that allow users to solicit content from the general public or user community, and empower the general public or user community to rate content submitted by other users. This includes, but is not limited to IdeaScale. We will revise or update this privacy impact assessment if our practices change, if new risks to privacy develop, or as we develop better ways to keep you informed. If we decide to change this assessment, we will post a new assessment on our site and change the date at the bottom. Changes to the policy shall not apply retroactively. 2. INFORMATION MADE AVAILABLE TO THE WHITE HOUSE THROUGH THIRD-PARTY SITES AND TOOLS What information is made available to the White House? The information made available to the White House depends on how users of third-party sites interact with official White House pages on those sites or use third-party tools on WhiteHouse.gov. If users visit a White House page on a third-party site to examine the content on that page and do not otherwise interact with the page (e.g., post comments, submit messages, “friend” or “follow” the White House), no PII about the user will be made available to the White House. If users “follow,” “friend,” or take a similar action with respect to the official White House page on a third-party site, the fact that the user made that selection will often be publicly available, depending on the policies of the third-party site. The White House does not record or search for which users “follow,” “friend,” or take similar actions with respect to its official pages. Whenever possible, the White House elects not to have non-public information made available to it. To our knowledge, none of third-party sites used by the White House make non-public information available to the White House based upon a user’s “following,” “friending,” or taking similar action with respect to the White House. If you become aware of a third-party site used by the White House that makes non-public information available to the White House, please contact us at [link to privacy contact form]. If users interact with a White House page or interact with a third-party tool on WhiteHouse.gov — for example by participating in a discussion or live chat, leaving a comment, or submitting an idea to be rated — the content published by the user will be made available to the White House (and often the general public). In addition to whatever information the user chooses to publish, the user’s account name or similar identifying information will often be made available to the White House and the public. What are the sources of information that could be made available to the White House? The information on these sites that could be made available to the White House is voluntarily published or submitted by users and almost always is available to the general public or the user community for the site. It may contain PII if users choose to publish that information. Some third-party sites or tools may collect PII during the registration process, but the White House does not solicit or collect this information. With the exception of Twitter and Digg, where official White House accounts may “follow” other accounts to more easily view the publicly available information they are publishing, the White House does not “friend” or take a similar action with respect to individual accounts, except for those controlled by other units of the federal government. Do individuals have the opportunity and/or right to decline to provide information? Participating in these third-party sites and utilizing third-party tools is voluntary. If a member of the public wishes to communicate without using a third-party site or tool, there will often be a dedicated point of submission on whitehouse.gov or the Contact form is also available when there is not a specific point of submission. The White House does not require users to submit PII through a third-party site or tool to obtain services, information, or assistance from the White House. 3. How does the White House use third-party sites that target content? The White House may utilize tools offered by third-party sites that target content to users based on attributes (e.g., language) or in'''
