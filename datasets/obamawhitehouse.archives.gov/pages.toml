full_description = "Every week, the President sits down to speak directly to the American people in a weekly address that goes live on Saturday morning. WASHINGTON, DC — This week, President Obama delivered his final weekly address thanking the American people for making him a better President and a better man. Over the past eight years, we have seen the goodness, resilience, and hope of the American people. We’ve seen what’s possible when we come together in the hard, but vital work of self-government – but we can’t take our democracy for granted. Our success as a Nation depends on our participation. It’s up to all of us to be guardians of our democracy, and to embrace the task of continually trying to improve our Nation. Despite our differences, we all share the same title: Citizen. And that is why President Obama looks forward to working by your side, as a citizen, for all of his remaining days. This week, I traveled to Chicago to deliver my final farewell address to the nation, following in the tradition of Presidents before me. It was an opportunity to say thank you. Whether we’ve seen eye-to-eye or rarely agreed at all, my conversations with you, the American people – in living rooms and schools; at farms and on factory floors; at diners and on distant military outposts – are what have kept me honest, kept me inspired, and kept me going. Every day, I learned from you. You made me a better President, and you made me a better man. Over the course of these eight years, I have seen the goodness, the resilience, and the hope of the American people. I’ve seen neighbors looking out for each other as we rescued our economy from the worst crisis of our lifetimes. I’ve hugged cancer survivors who finally know the security of affordable health care. I’ve seen communities like Joplin rebuild from disaster, and cities like Boston show the world that no terrorist will ever break the American spirit. I’ve seen the hopeful faces of young graduates and our newest military officers. I’ve mourned with grieving families searching for answers, and found grace in a Charleston church. I’ve seen our scientists help a paralyzed man regain his sense of touch, and our wounded warriors walk again. I’ve seen our doctors and volunteers rebuild after earthquakes and stop pandemics in their tracks. I’ve learned from students who are building robots and curing diseases and who will change the world in ways we can’t even imagine. I’ve seen the youngest of children remind us of our obligations to care for our refugees, to work in peace, and above all to look out for each other."
