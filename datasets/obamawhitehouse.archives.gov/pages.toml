full_description = "Originally built for the State, War and Navy Departments between 1871 and 1888, the Eisenhower Executive Office Building now houses a majority of offices for White House staff. The Eisenhower Executive Office Building is located next to the West Wing, and houses a majority of offices for White House staff. Originally built for the State, War and Navy Departments between 1871 and 1888, the EEOB is an impressive building that commands a unique position in both our national history and architectural heritage. Designed by Supervising Architect of the Treasury Alfred Mullett, the granite, slate and cast iron exterior makes the EEOB one of America's best examples of the French Second Empire style of architecture. It took 17 years for Mullett's masterpiece to finally be completed. Next door to the White House, the Eisenhower Executive Office Building (EEOB) commands a unique position in both our national history and architectural heritage. Designed by Supervising Architect of the Treasury, Alfred B. Mullett, it was built from 1871 to 1888 to house the growing staffs of the State, War, and Navy Departments, and is considered one of the best examples of French Second Empire architecture in the country. In bold contrast to many of the somber classical revival buildings in Washington, the EEOB's flamboyant style epitomizes the optimism and exuberance of the post-Civil War period. The State, War, and Navy Building, as it was originally known, housed the three Executive Branch Departments most intimately associated with formulating and conducting the nation's foreign policy in the last quarter of the nineteenth century and the first quarter of the twentieth century -- the period when the United States emerged as an international power. The building has housed some of the nation's most significant diplomats and politicians and has been the scene of many historic events. The history of the EEOB began long before its foundations were laid. The first executive offices were constructed on sites flanking the White House between 1799 and 1820. A series of fires (including those set by the British in 1814) and overcrowded conditions led to the construction of the existing Treasury Building. In 1866, the construction of the North Wing of the Treasury Building necessitated the demolition of the State Department building to the northeast of the White House. The State Department then moved to the D.C. Orphan Asylum Building while the War and Navy Departments continued to make do with their cramped quarters to the west of the White House."
