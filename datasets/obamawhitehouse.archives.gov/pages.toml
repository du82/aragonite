["http://obamawhitehouse.archives.gov/contact/chat"]
title = "Messenger Bot | The White House"
description = "See the President's daily schedule, explore behind-the-scenes photos from inside the White House, and find out all the ways you can engage with the most interactive administration in our country's history."
full_description = '''Citizens have written to the president since Thomas Jefferson was in office. Now, it's easier than ever. Messenger Bot - Timeline Contacting the White House Through the Years Messenger Bot - Timeline Facebook Messenger Send your stories, ideas, and concerns to President Obama, right from your phone. Or, visit our Facebook Page and click Message! Messenger Bot - Video 10 Letters a Day Each night, the President reads 10 letters sent to him by the American people."These letters," he says, "do more to keep me in touch with what’s happening around the country than just about anything else." Learn more about the new Messenger bot here. Messenger Bot - Quote “These letters, I think, do more to keep me in touch with what’s happening in the country than just about anything else.” - President Obama Messenger Bot - Examples What Do People Write to the President? Read examples of letters sent to President Obama on our Tumblr! PERSONAL STORIES Some are joyful, others are challenging, but they're all important and from the heart. THOUGHTS ON POLICY Whether or not you agree with the President and his policies, we want to hear your perspective. LETTERS FROM CHILDREN Our Nation has always been shaped by the next generation and we love to hear their ideas and concerns. Messenger Bot - CTA Go to our Facebook Page and Click Message! VISIT OUR FACEBOOK PAGE More ways to get in touch Write or Call the White House Submit a Comment Online Messenger Bot styles - do not display /* HIDE SECTION TITLES */ div#section-357076 h2.section-title { display: none; } div#section-356836 h2.section-title { display: none; } div#section-357041{ display: none; } div#section-356821{ background: #e7ebec; } div#section-356811 h2.section-title { display: none; } div#section-356816 h2.section-title { display: none; } div#section-356821 h2.section-title { display: none; } div#section-356826 h2.section-title { display: none; } div#section-357041 h2.section-title { display: none; } /* GENERAL