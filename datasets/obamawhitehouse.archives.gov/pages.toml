full_description = "With their offices located on the White House grounds, every Vice President since Walter Mondale has lived with their families on the grounds of the United States Naval Observatory. Located on the grounds of the United States Naval Observatory (USNO), the white 19th Century house at Number One Observatory Circle in northwestern Washington, D.C., was built in 1893. Originally intended for the superintendent of the USNO, the house was so lovely that in 1923, the chief of naval operations kicked out the superintendent so he could move in himself. Historically, Vice Presidents and their families lived in their own homes, but the cost of securing these private residences grew substantially over the years. Finally, in 1974, Congress agreed to refurbish the house at the Naval Observatory as a home for the Vice President. Three years passed before any Vice President actually lived at Number One Observatory Circle. Vice President Gerald Ford acceded to the Presidency before he could use the home, and his Vice President, Nelson Rockefeller, only used it for entertaining. Walter Mondale was the first Vice President to move into the home. It has since been home to the families of Vice Presidents Bush, Quayle, Gore, and Cheney. Vice President and Dr. Biden currently reside there. Vice Presidents have welcomed countless guests to the residence, including foreign leaders and dignitaries. Still, the Naval Observatory has continued to operate. Scientists observe the sun, moon, planets and selected stars, determine and precisely measure the time, and publish astronomical data needed for accurate navigation. In addition to the Vice President's Office in the West Wing, the Vice President and his staff maintain a set of offices in the Eisenhower Executive Office Building (EEOB), located next to the West Wing on the White House premises. This office, called the Vice President's Ceremonial Office, served as the Navy Secretary's Office when the EEOB housed the State, Navy and War Departments. Today, the Vice President uses the office for meetings and press interviews."
