full_description = "President Obama believes that all seniors should be able to retire with dignity, not just a privileged few. He believes that all Americans deserve to know that, if they become disabled or if they lose the breadwinner in the family, Social Security will be there to protect them. Many seniors are struggling in the face of the economic downturn, having seen their savings fall, and we acted quickly to help provide relief. The Recovery Act provided a one-time payment of $250 to retirees, other Social Security beneficiaries, disabled veterans, and SSI recipients. Fifty-six million retirees and other individuals received this one-time payment, totaling $14 billion. In light of continued economic hardship for too many seniors, the President has called for Congress to enact another $250 Economic Recovery Payment to our seniors this year, as well as to veterans and people with disabilities. President Obama believes that all seniors should be able to retire with dignity, not just a privileged few. And, he believes that all Americans deserve to know that, if they become disabled or if they lose the breadwinner in the family, Social Security will be there to protect them. Today, nearly 54 million Americans receive Social Security benefits, including 38 million retirees and their family members, 10 million Americans with disabilities and their dependents, and 6 million survivors of deceased workers. For many of these Americans, Social Security is a key source of income. In fact, for more than half of Social Security recipients aged 65 or over, the program provides over 50 percent of their family income and, because of its lifetime income protection and survivors benefits, Social Security is particularly important for elderly women. . Moreover, the program is not just for seniors. Because of features like survivors benefits, Social Security is one of the largest antipoverty programs for children, and disability benefits also help younger workers and their families and are particularly important to minority communities."
