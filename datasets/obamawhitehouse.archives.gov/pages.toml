full_description = "Founded in 1964 by Lyndon B. Johnson, the White House Fellows program is one of America's most prestigious programs for leadership and public service. White House Fellowships offer exceptional young men and women first-hand experience working at the highest levels of the federal government. Selected individuals typically spend a year working as a full-time, paid Fellow to senior White House Staff, Cabinet Secretaries and other top-ranking government officials. Fellows also participate in an education program consisting of roundtable discussions with renowned leaders from the private and public sectors, and trips to study U.S. policy in action both domestically and internationally. Fellowships are awarded on a strictly non-partisan basis. The purpose of the White House Fellows program is to provide gifted and highly motivated young Americans with some first-hand experience in the process of governing the Nation and a sense of personal involvement in the leadership of society. It is essential to the healthy functioning of our system that we have in the non-governmental sector a generous supply of leaders who have an understanding -- gained first hand -- of the challenges that our national government faces. In a day when the individual feels increasingly remote from the centers of power and decision-making, such leaders can help their fellow citizens comprehend the process by which the Nation is governed. In this country today, we produce a great number of skilled professionals. But too few of this intellectual elite provide the society with statesmanlike leadership and guidance in public affairs. Surely the raw material is still there. And just as surely more must be done in the development of our best young people to inspire and facilitate the emergence of such leaders and statesmen. Their horizons and experience must be broadened to give them a sense of personal involvement in the leadership of society, a vision of greatness for the society, and a sense of responsibility for bringing that greatness to reality."
