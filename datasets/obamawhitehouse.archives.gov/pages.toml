full_description = "The President is committed to securing the homeland against 21st century threats by preventing terrorist attacks and other threats against our homeland, preparing and planning for emergencies, and investing in strong response and recovery capabilities. The President’s highest priority is to keep the American people safe. He is committed to ensuring the United States is true to our values and ideals while also protecting the American people. The President is committed to securing the homeland against 21st century threats by preventing terrorist attacks and other threats against our homeland, preparing and planning for emergencies, and investing in strong response and recovery capabilities. We will help ensure that the Federal Government works with states and local governments, and the private sector as close partners in a national approach to prevention, mitigation, and response. The National Security Strategy, released May 27, 2010, lays out a strategic approach for advancing American interests, including the security of the American people, a growing U.S. economy, support for our values, and an international order that can address 21st century challenges. Administration also intends to provide $5 billion in assistance through the Shared Security Partnership over the next several years to enhance the ability of our partners to improve their own security and work with us to defeat terrorism worldwide. Attacks using improvised nuclear devices or biological weapons, as well as outbreaks of a pandemic disease, pose a serious and increasing national security risk, We will focus on reducing the risk of these high-consequence, nontraditional threats: Gathering, analyzing, and effectively sharing intelligence is vital to the security of the United States. In order to prevent threats, including those from terrorism, we will strengthen intelligence collection to identify and interdict those who intend to do us harm. The information we collect must be analyzed as well as shared, and we must invest in our analytic capabilities and our capacity to share intelligence across all levels of government. As we grow our intelligence capabilities, the President is also committed to strengthening efforts to protect the privacy and civil rights of all Americans."
year_published = 2015
year_updated = 2015
