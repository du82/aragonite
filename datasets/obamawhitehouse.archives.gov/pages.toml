full_description = 'President Obama has been deeply committed to engaging more Americans in service since taking office in 2008. President Obama believes in measuring the outcomes of service, promoting sustained civic engagement and rewarding innovative solutions to pressing social problems. President Obama has been deeply committed to engaging more Americans in service since taking office in 2008. He expanded AmeriCorps through measures such as signing the Edward M. Kennedy Serve America Act in 2009 and creating the FEMA Corps program in 2012. He launched the Serve.gov platform to make it easier for Americans to find and post local volunteer opportunities. The American Recovery and Reinvestment Act included $201 million in funding for the Corporation for National and Community Service to support an expansion of AmeriCorps State and National and AmeriCorps VISTA programs. President Obama has always been a strong supporter of empowering ordinary people to do extraordinary things by improving their local communities through service. President Obama asks how we – through both existing organizations and individual action – can take an active role in America’s economic recovery and improve our fellow citizens’ lives through our service work. President Obama believes that service consists of more than a "one-off" occasion. He believes that civic engagement and service should be a lifelong commitment whether at the school, community, city, state, or national level. This includes community service, government service, and military service. By empowering people at all stages of their lives and at all levels of society to stand up and help solve problems in their own communities, the federal government will encourage sustained civic engagement that will transform those serving, the communities they help, and the nation as a whole. President Obama believes in measuring the outcomes of service – not just the hours served or number of volunteers – to enhance what works and avoid using resources on ineffective programs. He will encourage planning, goal-setting, and execution by volunteers at the local level, so that volunteering is tied into a united and measured effort across the nation.'
