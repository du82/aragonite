full_description = "Anyone visiting DC can experience the history and art of the White House in person after submitting a tour request through one's Member of Congress. Public tour requests must be submitted through one's Member of Congress. These self-guided tours are available from 7:30 a.m. to 11:30 a.m. Tuesday through Thursday, 7:30 a.m. to 1:30 p.m. Fridays and Saturdays (excluding federal holidays or unless otherwise noted). Tour hours will be extended when possible based on the official White House schedule. Tours are scheduled on a first come, first served basis. Requests can be submitted up to three months in advance and no less than 21 days in advance. You are encouraged to submit your request as early as possible as a limited number of spaces are available. All White House tours are free of charge. (Please note that White House tours may be subject to last minute cancellation.) If you wish to visit the White House and are a citizen of a foreign country, please contact your embassy in Washington, DC for assistance in submitting a tour request. As part of President and Mrs. Obama’s commitment to open the White House to as many Americans as possible, we have partnered with the Google Art Project and allowed their 360 Street View cameras to capture the rooms that are featured on the public tour. Now anyone, anywhere, can experience the history and art of the White House via their computer. All guests 18 years of age or older will be required to present a valid, government-issued photo identification (detailed below). All foreign nationals must present their passport. All other forms of foreign identification will not be accepted. All information submitted (e.g. name, date of birth, city, etc.) must exactly match the government-issued photo ID you will present when arriving at the White House. The following forms of photo ID are acceptable for presentation to USSS upon entry to the White House complex: No other forms of identification will be accepted; photocopies, expired IDs, or other transmissions of these documents are NOT valid."
