full_description = "To provide the President with the support that he or she needs to govern effectively, the Executive Office of the President (EOP) was created in 1939 by President Franklin D. Roosevelt. Every day, the President of the United States is faced with scores of decisions, each with important consequences for America’s future. To provide the President with the support that he or she needs to govern effectively, the Executive Office of the President (EOP) was created in 1939 by President Franklin D. Roosevelt. The EOP has responsibility for tasks ranging from communicating the President’s message to the American people to promoting our trade interests abroad. Overseen by the White House Chief of Staff, the EOP has traditionally been home to many of the President’s closest advisors. The EOP Fiscal Year (FY) 2017 Congressional Budget Submission, supporting the offices and councils within the EOP, was submitted to the Congress on February 9, 2016. The EOP Fiscal Year (FY) 2016 Congressional Budget Submission, supporting the offices and councils within the EOP, was submitted to the Congress on February 2, 2015. The EOP Fiscal Year (FY) 2015 Congressional Budget Submission, supporting the offices and councils within the EOP, was submitted to the Congress on March 10, 2014. The EOP Fiscal Year (FY) 2014 Congressional Budget Submission, supporting the offices and councils within the EOP, was submitted to the Congress on April 10, 2013. The EOP Fiscal Year (FY) 2013 Congressional Budget Submission, supporting the offices and councils within the EOP, was submitted to the Congress on February 13, 2012. The EOP Fiscal Year (FY) 2012 Congressional Budget Submission, supporting the offices and councils within the EOP, was submitted to the Congress on February 14, 2011. The EOP Fiscal Year (FY) 2011 Congressional Budget Submission was submitted to the Congress on February 2, 2010."
