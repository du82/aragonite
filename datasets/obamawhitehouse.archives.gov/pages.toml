full_description = "The President is committed to nurturing a society that values the contributions of all of our citizens and residents, including the approximately 50 million people in this country living with disabilities. Nearly a quarter-century ago, we became the first nation on earth to comprehensively declare equality for its citizens with disabilities. With passage of the ADA, we enshrined into law the promise of equal access, equal opportunity, and equal respect for every American. Today, 19 percent of Americans (56.7 million people) live with disabilities. President Obama and his Administration are dedicated to ensuring that people with disabilities have the same access to the American Dream as every other citizen. That’s why this Administration has worked to toughen the protections against disability-based discrimination, increase accessibility in our communities, expand employment opportunities and increase financial independence for people with disabilities. Investing in access to education will best prepare our youth and young adults with disabilities to meet the needs of the 21st century. President Obama supports improved educational opportunities for people with disabilities. The Elementary and Secondary Education Act (ESEA) reauthorization proposal will increase support for the inclusion and improved outcomes of students with disabilities, ensuring that teachers are prepared to meet the needs of diverse learners and that assessments more accurately and appropriately measure the performance of students with disabilities. President Obama also supports expanded funding and increased enforcement for programs like the Individuals with Disabilities Education Act (IDEA) that ensure all Americans have access to the tools to succeed. The Department of Justice and Department of Education issued a joint Dear Colleague letter to schools reminding them that bullying is wrong and must not be tolerated – including against America’s 6.5 million students with disabilities. The Obama Administration is focused on providing Americans with disabilities with access to the resources and training necessary for them to succeed in the workplace."
