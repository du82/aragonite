full_description = "The Obama Administration has a comprehensive agenda to empower individuals with disabilities and equalize opportunities for all Americans. The Obama Administration has a comprehensive agenda to empower individuals with disabilities in order to equalize opportunities for all Americans. In addition to reclaiming America's global leadership on this issue by becoming a signatory to -- and having the Senate ratify -- the UN Convention on the Rights of Persons with Disabilities, the plan has four parts, designed to provide lifelong supports and resources to Americans with disabilities. They are as follows: This commitment to accessibility for all begins with this site and our efforts to ensure all functionality and all content is accessible to all Americans. Images on the site contain 'alt tags,' which aid users who listen to the content of the site by using a screen reader, rather than reading the site. Likewise, a 'skip to' link provides these users with a method for bypassing the header and going directly to the main content each time a page is accessed. Text transcripts accompany audio clips of the President's speeches and remarks, and closed captioning is available on videos. In addition to the features that make the graphics version of the site more accessible, a text-only version provides added convenience for users. Users can get information regarding the accessibility of Adobe Portable Document Format (PDF) files from the Access Adobe website. Although the new WhiteHouse.gov is still in its initial stages, we are constantly updating our site in an attempt to make it as accessible as possible. To improve the accessibility of WhiteHouse.gov, the White House has asked users with disabilities to review the site and has also reviewed the site's accessibility with outside web tools. The results of these reviews have been incorporated into the website. The White House welcomes comments on how to improve the site's accessibility for users with disabilities."
