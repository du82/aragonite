full_description = '''Back to Infographic Support for Veterans: By the Numbers August 1, 2016 As Americans, we have a sacred obligation to honor the service men and women who keep America free and safe. To live up to that promise, the Administration is redoubling our efforts to serve our nation's veterans by ensuring they get the benefits they have earned, as well as expanding opportunity for our service members, veterans, and their families. See the full Infographic SHARE: FACEBOOK | TWITTER Back to Infographic A Diverse Judicial Pool June 8, 2016 The men and women the President has nominated to enforce our laws and deliver justice represent his unprecedented commitment expanding the diversity of our nation's highest courts. That's a big deal — so if you learned something new here, pass it on. See the full Infographic SHARE: FACEBOOK | TWITTER Back to Video West Wing Week November 2, 2015 Watch the Video West Wing Week SHARE: FACEBOOK | TWITTER Back to Infographic President Eisenhower and Alaska August 31, 2015 On Jan. 3, 1959, President Dwight Eisenhower signed a proclamation admitting Alaska to the Union as the 49th state. See the full Infographic SHARE: FACEBOOK | TWITTER Back to Infographic President Franklin D. Roosevelt in Alaska August 31, 2015 Franklin D. Roosevelt was the nation's 32nd President and is considered by many to have been our country's "Conservationist President." See the full Infographic SHARE: FACEBOOK | TWITTER Back to Infographic Check from the Alaska Purchase August 31, 2015 On March 30, 1867, the United States reached an agreement to purchase Alaska from Russia for a price of $7.2 million. The Treaty with Russia was negotiated and signed by Secretary of State William Seward and Russian Minister to the United States Edouard de Stoeckl. See the full Infographic SHARE: FACEBOOK | TWITTER Back to Video Petition Signers at the White House July 28, 2015 Watch the Video Petition Signers at the White House SHARE: FACEBOOK | TWITTER Back to Infographic We the People Numbers July 28, 2015 In September of 2011, we launched We the People to give Americans a new way to petition their government about the issues they care about. Nearly four years later, take a look at where the platform stands. See the full Infographic SHARE: FACEBOOK | TWITTER'''
