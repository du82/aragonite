["http://obamawhitehouse.archives.gov/issues/technology"]
title = "Technology | whitehouse.gov"
description = "President Obama recognizes that technology is an essential ingredient of economic growth and job creation.  We have to do everything we can to encourage the entrepreneurial spirit, wherever we find it. We should be helping American companies compete and sell their products all over the world. We should be making it easier and faster to turn new ideas into new jobs and new businesses. And we should knock down any barriers that stand in the way. Because if we’re going to create jobs now and in the future, we're going to have to out-build and out-educate and out-innovate every other country on Earth.  President Barack Obama, September 16, 2011"
full_description = "President Obama recognizes that technology is an essential ingredient of economic growth and job creation. President Obama recognizes that technology is an essential ingredient of economic growth and job creation. Ensuring America has 21st century digital infrastructure—such as high-speed broadband Internet access, fourth-generation (4G) wireless networks, new health care information technology and a modernized electrical grid—is critical to our long-term prosperity and competitiveness. The President is committed to ensuring America has a thriving and growing Internet economy. The Internet has become a global platform for communication, commerce and individual expression, and now promises to support breakthroughs in important national priorities such as health care, education and energy. Additionally, the Internet and information technology can be applied to make government more effective, transparent and accessible to all Americans. President Obama has pledged to preserve the free and open nature of the Internet to encourage innovation, protect consumer choice, and defend free speech. The Administration has created an Internet Policy Task Force to bring together industry, consumer groups, and policy experts to identify ways of ensuring that the Internet remains a reliable and trustworthy resource for consumers and businesses. In July 2011, at the Organisation for Economic Co-operation and Development (OECD), the Obama Administration joined with representatives from business, civil society, and Internet technical communities from 34 countries to reaffirm the importance of Internet policy principles that have enabled the open Internet to flourish with innovation and human connections beyond our wildest expectations. Americans deserve an Internet that is safe and secure, so they can shop, bank, communicate, and learn online without fear their accounts will be hacked or their identity stolen. President Obama has declared that the “cyber threat is one of the most serious economic and national security challenges we face as a nation” and that “America's economic prosperity in the 21st century will depend on cybersecurity.” To help the country meet this challenge and to ensure the Internet can continue as an engine of growth and prosperity, the Administration is implementing the National Strategy for Trusted Identities in Cyberspace. The Administration also released the International Strategy for Cyberspace to promote the free flow of information, the security and privacy of data, and the integrity of the interconnected networks, which are all essential to American and global economic prosperity and security."
year_published = 2015
year_updated = 2015
clearnet = "http://obamawhitehouse.archives.gov/issues/technology"
