["https://obamawhitehouse.archives.gov/1600/state-and-local-government"]
title = "State & Local Government | whitehouse.gov"
description = """
From the News RoomLatest NewsRead the latest blog posts from 1600 Pennsylvania Ave
Share-WorthyCheck out the most popular infographics and videos
PhotosView the photo of the day and other galleries
Video GalleryWatch behind-the-scenes videos and more
Live EventsTune in to White House events and statements as they happen
Music & Arts PerformancesSee the lineup of artists and performers at the White House"""
full_description = '''Powers not granted to the federal government are reserved for states and the people, which are divided between state and local governments. Most Americans have more daily contact with their state and local governments than with the federal government. Police departments, libraries, and schools — not to mention driver's licenses and parking tickets — usually fall under the oversight of state and local governments. Each state has its own written constitution, and these documents are often far more elaborate than their federal counterpart. The Alabama Constitution, for example, contains 310,296 words — more than 40 times as many as the U.S. Constitution. Under the Tenth Amendment to the U.S. Constitution, all powers not granted to the federal government are reserved for the states and the people. All state governments are modeled after the federal government and consist of three branches: executive, legislative, and judicial. The U.S. Constitution mandates that all states uphold a "republican form" of government, although the three-branch structure is not required. In every state, the executive branch is headed by a governor who is directly elected by the people. In most states, the other leaders in the executive branch are also directly elected, including the lieutenant governor, the attorney general, the secretary of state, and auditors and commissioners. States reserve the right to organize in any way, so they often vary greatly with regard to executive structure. No two state executive organizations are identical. All 50 states have legislatures made up of elected representatives, who consider matters brought forth by the governor or introduced by its members to create legislation that becomes law. The legislature also approves a state's budget and initiates tax legislation and articles of impeachment. The latter is part of a system of checks and balances among the three branches of government that mirrors the federal system and prevents any branch from abusing its power.'''
year_published = 2015
year_updated = 2015
clearnet = "https://obamawhitehouse.archives.gov/1600/state-and-local-government"
