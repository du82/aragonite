PhotosView the photo of the day and other galleries
Video GalleryWatch behind-the-scenes videos and more
Live EventsTune in to White House events and statements as they happen
Music & Arts PerformancesSee the lineup of artists and performers at the White House"""
full_description = '''Together, We Make Change Happen “We should not fear the future, but shape it.” When President Obama took office, we were facing the worst economic crisis since the Great Depression. Seven years later, our businesses have created 14.1 million new jobs over the past 70 months. We’ve rebuilt our manufacturing base, reformed our health care system, and reinvented our energy sector. We’ve welcomed home more than 160,000 troops. We are living through an extraordinary moment in human history. Technological and social change is reshaping the way we live, the way we work, our environment, and our place in the world. But as Americans, we’ve been through big changes before and, like generations past, we can make change work for us. In his speech, President Obama laid out his plan to seize opportunities before us. In looking forward, there are four big questions that we as a country have to answer. How do we give everyone a fair shot at opportunity and security in the new economy? How do we make technology work for us, and not against us, as we solve our biggest challenges? How do we keep America safe and lead the world without becoming its policeman? How can we make our politics reflect the best in us, and not the worst? For all the challenges we face, the truth is that no country on Earth is better poised to seize the future than the United States. And if we answer these four basic questions, then there is nothing that America can’t do. Read On President Obama's final State of the Union Address The text of the full address, as prepared for delivery, is now online on Medium, Facebook notes, and WhiteHouse.gov/SOTUremarks. Read the Full Address SHARE CLOSE Cancer Touches Each of Us The number of new cancer cases will rise to 22 million within the next 2 decades. Share Your Story SHARE CLOSE <a href="https://www.youtube-nocookie.com/embed/Tjl8ka3F6QU?wmode=opaque">Embedded video for Watch as YouTube interviews President Obama (Friday, January 15):</a> Three days after his final State of the Union address, the President sat down for an interview with three leading YouTube stars. Learn More SHARE Share This: CLOSE'''
