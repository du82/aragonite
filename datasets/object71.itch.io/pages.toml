["https://object71.itch.io/its-not-there"]
title = "It's not there by Hristo Iliev"
description = "A prototype of the main gameplay mechanics that I thought would make a great horror game. I didn't have enough focus time to work on the game alone and so I went for MVP - something you can run and take a look at. Also as the comments that I heard from my first game jam (Plenty of fish in the sea) was that using public assets is not that cool so I decided to try and do my assets from scratch this time which took me more time.I will get better in future jams I hope :)"
