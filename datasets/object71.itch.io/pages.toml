["https://object71.itch.io/reach-the-window"]
title = "Reach the Window by Hristo Iliev"
description = '''
This game is a submission to the #GoGodotJam with the theme "Growth".
It is made entirely in the Godot. It tells the story of plants all around the world that try to grow their way out of the pot and into the outside world. You will take control of the plant growth by telling it where to go. Keep in mind that your plant needs water to survive long enough to reach the window.
Controls:
Arrow keys will navigate the plantESC brings you back to the main menu (no save)


I am a professional C++ game developer and also have a blog with useful programming articles including ones that are for the Godot game engine. You can check out more info on https://thatonegamedev.com!'''
full_description = "It is made entirely in the Godot. It tells the story of plants all around the world that try to grow their way out of the pot and into the outside world. You will take control of the plant growth by telling it where to go. Keep in mind that your plant needs water to survive long enough to reach the window. I am a professional C++ game developer and also have a blog with useful programming articles including ones that are for the Godot game engine. You can check out more info on https://thatonegamedev.com! WOW awsome game for a Jam its beatifully polished and the art is amazing and most important its fun and the idea is great. I only had a few hours for the duration of the jam so I had to scope low. It is pretty much the core mechanic and polish. I had ideas for other gameplay elements but I am also pretty accurate on estimation so I left it as is with just a few showcase levels. Except that nobody wants to waste his time on only one game in a jam where there are plenty. great execution! love the limited visibility, adds an element of uncertainty as a challenge for something that would otherwise be too easy :)"
year_published = 2025
