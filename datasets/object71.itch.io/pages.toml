title = "Plenty of fish in the sea by Hristo Iliev"
description = 'A game made for the Vertex Game Jam 2020 with the theme "Start small". You start as a tiny fish and need to eat fish that are smaller than you. If you get to a certain size you win. Controls are the left and right arrows and space.Originality of the game is almost none as it copies a flash game that I played in my childhood but as I do not have much experience in solo game making nor unity this was the fastest that I could produce with my work schedule. For me this is still an achievement.'
