["https://obs-us.com/about/case-studies/case-study-american-society-for-microbiology-press"]
title = "Case Study: American Society for Microbiology Press | Open Book Systems"
description = "Content Imperative The authors and editors of Escherichia coli and Salmonella: Cellular and Molecular Biology, the industry-standard reference book on E. coli and Salmonella, sought to make their c…"
full_description = "Case Study: American Society for Microbiology Press Content Imperative The authors and editors of Escherichia coli and Salmonella: Cellular and Molecular Biology, the industry-standard reference book on E. coli and Salmonella, sought to make their content available online and enrich it with continual updates, multimedia resources such as databases and videos, and powerful search-engine technology. OBS created the first “EcoSal” site for ASM Press. EcoSal is a dynamic web site that, like the print-edition predecessors it has supplanted, comprises a comprehensive archive of the corpus of knowledge on the enteric bacterial cell. EcoSal is made up of hundreds of modules of information and interpretation, with links to PubMed and cognate sites containing extensive tabular, pictorial, and video presentations, as well as to active databases of primary research. The online platform allows the publication of information to keep pace with changes in the field in a way that the paper medium never allowed. OBS’s Role Business model development Creative consultation for site design Development of content conversion process integrated with ASM Press’s workflow to convert legacy files and new content in complex Word documents (with math and tables) Project management Programming Managed hosting Ongoing technical support In addition to providing these services, OBS has been responsible for documentation and training ASM Press staff in file preparation techniques and other skills to give them greater control of their site. Link ASM Press"
year_published = 2013
year_updated = 2013
