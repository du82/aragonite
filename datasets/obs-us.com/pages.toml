full_description = "Case Study: Child Assessment Interactive Site for Early Childhood Education Publisher Content Imperative Our client’s content imperative involved bringing to life and making functional the interactive part of a highly successful, four-book series offering assessment, evaluation, and reporting for infants and children. OBS built and maintains for them a leading assessment and programming tool for children from birth to age six. Near-term federal reporting requirements created a strong business case for the company’s first major online publishing project back in 2006, and OBS still maintains the site we built for them today. With their site, our client supplemented a successful and highly regarded print line with online tools to serve its core market of early intervention and early childhood professionals. Providers can now conduct child assessments and comply with federal reporting requirements, while also achieving enhanced utility and considerable time savings by storing and sharing online child records and assessment data. Going beyond the book sales model, subscriptions to this site are sold to individuals and to enterprises. OBS’s Role Management consulting and project catalystProduct plan and business model developmentInformation designGraphic designAgile project managementEngineering using extreme programming techniquesExtensive testing of new features in frequent rolloutsOngoing updates and maintenance In addition to providing these services, OBS has also been active in knowledge transferal, documenting its work and training and supporting our client’s staff so that they assume more management responsibilities for this complex site. Share this:Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) Posted in Uncategorized on January 17, 2020 by OBS. Leave a reply"
