["https://obs-us.com/about/case-studies/case-study-capitalism"]
title = "Case Study: Capitalism | Open Book Systems"
description = "OBS served as a publishing catalyst for Capitalism: Its Origins and Evolution as a System of Governance by Harvard Business School Professor Emeritus Bruce R. Scott, which was published by Springer…"
full_description = "Case Study: Capitalism OBS served as a publishing catalyst for Capitalism: Its Origins and Evolution as a System of Governance by Harvard Business School Professor Emeritus Bruce R. Scott, which was published by Springer Verlag / New York in Fall 2011. Content Imperative This book, and the smaller excerpt published in 2009, represent the author’s magnum opus, a detailed definition of capitalism and its evolution—geographically, chronologically, organizationally—as well as an insightful exploration of the United States’ statuesque embodiment of capitalism itself. While people commonly think of capitalism as companies freely competing for market share and profits, Scott shows how governance has always been key to the system, as it is in professional sports. He challenges the notion of a “universal” model of capitalism, particularly one based on the U.S. system, and illuminates the frameworks on which markets depend. His work, particularly his last two chapters, are timely today, and specifically in the United States, where corporations wield larger and larger influence and are offered less and less oversight by the government of, for, and by the people. OBS’s Role Contract negotiation Permissions editing Identification of prizes, awards for the book Index review Cover design consultation Project management of three rounds of pages Links Amazon | Capitalism: Its Origins and Evolution as a System of Governance Amazon | The Concept of Capitalism"
