["https://observablehq.com/customer-stories/unavco"]
title = "Customer story: UNAVCO | Observable"
description = "Nonprofit organization UNAVCO turned to Observable to build prototype data visualizations and share insights with the world."
full_description = "UNAVCO is a non-profit organization, supported primarily by the National Science Foundation, with a mission to understand the Earth and how it changes over time; from its atmosphere, to its crust, and all the way down to its center. They tackle this audacious goal by deploying sensors across the planet to directly measure the Earth over time with sub-millimeter accuracy, through the scientific practice of geodesy. They were the first to directly measure plate tectonics in 1996, and continue to use their sensor networks to forecast earthquakes, measure stormwater, study the impact of climate change, or even use signals traveling between the sensors and satellites to do a CAT-scan-like analysis of the sky. As a testament to the massive scale and impact of their undertaking, Popular Science proclaimed them the most epic science project in a July 2011 article, ranking them above the Space Station and the Large Hadron Collider. “We are close to generating a petabyte of geospatial data a year and the discovery of all this data is complicated,” says David Mencin, Director of Data Services at UNAVCO. UNAVCO’s network of sensors has been capturing data for over 30 years, but this enormous treasure of data can only reach its full potential when it is easily discoverable and accessible by their team and the broader scientific community. While well-defined APIs are essential to enable access, too often documentation can be unclear making the API difficult to use. “Explaining APIs through documentation is not enough. If I can’t make a live demo of the API, then I haven’t really proven that it works and is something easy enough for people to use,” explains Brooks Mershon, a software engineer spearheading the development of modern in-browser data exploration tools at UNAVCO. With Observable, Brooks and his team build live demos of UNAVCO’s data APIs, visual tools to query data, and exploratory dashboards for analysis in notebooks that are easy to share and readily accessible. These notebooks empower the broader scientific community to discover data and build custom visualizations using UNAVCO’s examples as a starting point."
