["https://observablehq.com/customer-stories/iop-systems"]
title = "Customer story: IOP Systems | Observable"
description = "IOP Systems uses Observable to transform complex software performance metrics into actionable insights through rich displays of data."
full_description = 'IOP Systems is a startup that focuses on helping customers translate complex software performance metrics into actionable business outcomes. The company builds performance-specific monitoring and automated benchmarking tools to improve application runtime behavior so organizations can strike the most cost effective balance for maximum performance of cloud-hosted applications. Yao Yue, co-founder at IOP, recognized early in her career a significant gap in how complex back-end software performance data was benchmarked and presented to stakeholders. With her background in infrastructure engineering, she realized that while back-end system performance data holds great value for businesses and decision-makers, it often remains invisible because it is complex and hard to visualize. To tackle this challenge, Yao not only hired a visualization expert to build data products on top of infrastructure data, but also adopted Observable as a team to transform complex back-end data into clear, interactive, and actionable visuals that both engineers and business leaders could easily grasp and explore, bridging the gap between technical complexity and decision-making. Yao’s journey with Observable began before founding IOP while leading a team focused on supporting infrastructure, performance, and reliability of global operations at Twitter. There, Yao’s team developed benchmarking tests and analyses for metrics like latency and throughput to optimize system responsiveness and resource allocation. Over the course of five years, their team (many of whom are now founding members of IOP Systems) saved Twitter over $100 million dollars through their innovative analysis and data visualization. "During my time at Twitter, we needed to communicate sophisticated conclusions in a convincing manner to both business and engineering teams. The more compelling we could make the data story, the easier it was to get our point across. While our team had ample experience in software systems, we were severely understaffed in data presentation. Observable Notebooks were attractive for both visualization specialists and non-experts as a prototyping tool for this purpose."'
