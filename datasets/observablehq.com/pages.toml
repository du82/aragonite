["https://observablehq.com/blog/effective-animation"]
title = "Five ways to effectively use animation in data visualization | Observable"
description = "Animation can be a distraction in data visualization. Or, when applied effectively, it can enhance user engagement, reveal trends, and help viewers track patterns across metrics. Here are five ways to use animation for better data viz."
full_description = "Animation can enhance visualization in many ways, by helping viewers make connections, by showing them different perspectives, and by just drawing them in to take a closer look. Animation can be subtle and act in a supporting role, or it can be the main feature of a visualization. It can also be polarizing, and with good reason. Used carelessly, animation can add unnecessary complexity and distraction, and turn into a gimmick. That is why it is often avoided in serious visualization – but by doing so, visualization developers and designers lose out on its potential benefits. In this post, we share five ways that animation can improve data visualizations. For each, we describe how it can be useful for viewer understanding and experience, highlight published examples showing the approach used effectively, and point to ways to achieve similar effects with D3 or Observable Plot. It is sometimes interesting to show different kinds of representations of the same or related data. This can be hard to communicate to the viewer, however. It can also be an opportunity to explain a more complex or unfamiliar chart type by building on a more familiar one. One way to do all these things is to morph, or tween, between different views. Tweening is a term from animated movies, and comes from junior animators drawing the frames in between the ones drawn by senior artists. In data visualization, it usually means creating a smooth transition between different settings, shapes, or entire visualization types. Take this example transitioning between vote counts for the winning party in each electoral district in the German state of Brandenburg. It shows votes gained by the AfD party (in blue), number of votes in each district (as circles), votes gained by the SPD party (in red), and votes lost by the Green party (in green). While the base map stays the same for context, the way data is shown changes from a choropleth map showing data as color, to spiky shapes using length/height, to circles using area."
author = "Robert Kosara, Allison Horst"
year_published = 2024
