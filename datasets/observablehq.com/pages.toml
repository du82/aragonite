["https://observablehq.com/customer-stories/periscopic"]
title = "Customer story: Periscopic | Observable"
description = "Data visualization company Periscopic turned to Observable to streamline their analysis and visualization workflows, increasing collaboration and productivity."
full_description = "Companies such as The Bill and Melinda Gates Foundation, UNICEF, and Ecotrust, rely on Periscopic to help them identify and shed light on important and impactful topics like gun violence, economic and gender inequity, public health and climate change. With a focus on promoting data transparency and increasing public awareness, they work with their clients to identify topics and create data-driven stories to engage and educate in a way that anyone can easily understand. Recently, they worked with The Nature Conservancy to better illustrate how agricultural conservation directly impacts food production and even the health of the soil beneath our feet. From the strategists that research and identify trends, to developers who build APIs and dashboards, to designers who ensure visually polished outputs — it takes a village to bring their insights to life and share them with the world. Cross-functional collaboration isn’t a nice to have, it’s a must have to get their jobs done. Tool hopping during the iterative process and limited accessibility to previously used tools hindered important team input and slowed down the entire process. These were major roadblocks to effectively surfacing data-driven insights and it made explaining and presenting how they got the results to their clients difficult. “Observable allows our entire team to work together in ways we previously didn’t even realize was possible. Multiple teammates - even people who don’t code - can co-create in an Observable notebook and provide direction via feedback and comments in real time,” said Wes Bernegger, Data Director at Periscopic. “We can easily share a work in progress via a simple URL and quickly provide input or make changes as a group. This saves a tremendous amount of development and design time and helps us collectively develop more cohesive stories on behalf of our clients.” This improved workflow and ability to obtain input from a wider range of experts increased the quality of the work and the speed at which their team can create. Faster, more energetic collaboration between their data and design teams helps them better meet tight deadlines, while the expanded flexibility of Observable Plot chart types saves precious dev and design time."
