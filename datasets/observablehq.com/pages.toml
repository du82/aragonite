["https://observablehq.com/customer-stories/belo-investment-research"]
title = "Customer story: Belo Investment Research | Observable"
description = "With Observable, Belo Investment Research was able to quickly analyze data, create visualizations, and share dashboards for clients."
full_description = "Companies are struggling to make sense of market signals that could better inform investment decisions. The overwhelming amount of available data is causing companies to inadvertently overlook on-traditional data sources that could allow them to identify and effectively act on early market signals. Meet Belo, an investment research firm serving a client base of institutional investors in the US and Europe, that is about to expand to a broader offering in Brazil. Through data analysis, media monitoring and consulting services, the firm provides important intel to make sense of data and help their clients make better investment decisions. In order to obtain these early market signals, Belo chose to focus on alternative, non-traditional data sources (those that many investors may not consider) like credit card data, business processes processing and natural language processing. As Belo expands into other countries, they’re experiencing a growth spurt. With that growth, their goal is to decrease the time it takes to get meaningful analysis out to investors and they leverage Observable in order to speed up their time to market via faster dashboard creation and data visualization. “The work we do is extremely time-sensitive. With Observable, we created our first client dashboard in a couple of days and realized that time savings is crucial when choosing the right tool for this type of work. We’ve made amazing progress in our data workflow over the past year using Observable. The platform allows us to explore data sources that many investors don’t have on their radar. By making sense of how it practically applies to financial markets, we give our clients an edge,” explains Paulino Oliveira, CEO and Founder. As Belo grows and strives to offer services that clients can use to make more savvy investment decisions, they recognize their own need to invest in the right data exploration tools. These tools need to allow them to meet tight deadlines and work quickly and in a collaborative way. After trying out some existing solutions, they learned what they were missing: version control, the ability to combine/merge projects, and the ability to have more control over visuals. They also wanted a modular platform that allows for fast completion of everyday tasks."
