full_description = "From new open-source software, to inspiring community creations, and an exciting conference, it’s been a big year for Observable. As we look back on 2024, here are 24 insights from the year. Our first insight is quite literal: the Observable Insight conference we hosted earlier in December. Over 500 data viz developers, data scientists, analysts, and product managers joined us live for inspiring talks, discussions, demos, and creator spotlights showing what’s possible (and what’s coming!) in data visualization. If you missed Insight or want to revisit any of the insightful sessions, all recordings are available in our YouTube playlist! Observable community members created many amazingly insightful data visualizations and data apps this year. Picking just a handful to highlight was almost impossible, but here’s a dozen we particularly liked. Since releasing Observable Framework in February, we’ve been wowed by the dashboards and data apps built with it by the community. Here are a few that caught our eye: Climate Central’s analysis providing insights into urban heat hot spots (see also the customer story for a look into how their team uses Observable) Streets to Stability, a very insightful piece on homelessness cycles in San Francisco (all puns aside – see also our recent blog post interviewing Jason Forrest, one of the project’s leads) Private jet emissions (and why they are bad) provides an interesting view into the flight patterns of the super-rich A map inventorying Boston’s buildings to investigate their potential for reducing carbon emissions through retrofitting A real-time view of the BlueSky firehose, giving an overview of the most popular hashtags on the platform Our users also created many remarkable notebooks providing insights into a wide variety of topics. Here are a few that we love: A very insightful presidential election cartogram transition animation, which unlike most preserves geographical relationships Great circle vs. rhumb 