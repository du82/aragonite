["https://observablehq.com/blog/linked-brushing"]
title = "Use linked brushing to explore patterns across dimensions, space, and time | Observable"
description = "Learn how linked brushing can help viewers dig further into interconnected data by highlighting patterns across metrics, zoom in on spatial trends, and focus on time periods of interest."
full_description = "Real-world systems are complex, with patterns often influenced by a large number of intertwined variables that may be correlated. When visualizing such data, it's common to build a suite of simpler charts each showing relationships between two variables at a time. While that has the benefit of making each individual chart more manageable to build and understand, it can also mean sacrificing insights into the interconnectedness that links data together across variables in different charts. Linked brushing is one way to reintroduce some of that interconnectedness to your data displays. With linked brushing, a user selects a subset of values by dragging (or brushing) over the chart area. Then, any “linked” charts update automatically to reflect or highlight the same data, as shown below. A basic example of linked brushing. As a user brushes over the scatterplot of penguin bill dimensions (top), the histogram updates to highlight the body mass distribution for selected penguins. Linked brushing is a specific type of cross-filtering, a general term for filtering data displayed in one or more charts, based on the user’s selection in another. When there exist obvious or pre-defined categories, cross-filtering using simple selection (for example, by clicking on one wedge of a pie chart to filter to only that category) may be a better option — and it’s certainly more common in dashboards. But brushing can be particularly useful when you don’t want to limit a user to selecting a pre-defined category or region, giving them more control over which subset of the data they dig into. In this post, we highlight three examples that show how linked brushing can help users explore patterns across dimensions, dive deeper into local spatial trends, and focus on time periods of interest. For the right data, linked brushing can produce richer, more engaging visualizations that reveal relationships across metrics, without overcomplicating individual charts. Brushing can give viewers a fast, fluid way to investigate patterns across dimensions, making it a useful option for quick exploration. For example, in the scatterplot matrix below, a user selects points (representing body size measurements for 344 penguins, including flipper length, body mass, and bill dimensions) by dragging the mouse over any area, in any chart. The records within the selected area are simultaneously highlighted across all charts"
