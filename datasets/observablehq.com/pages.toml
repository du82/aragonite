["https://observablehq.com/blog/announcing-embedded-analytics"]
title = "Announcing embedded analytics | Observable"
description = "Bring rich, interactive visualizations to your app with Observable’s embedded analytics. Powered by baked data architecture, they deliver instant, scalable performance. Integrate easily with vanilla JavaScript modules while maintaining secure, personalized data experiences at scale."
full_description = "Displays of data have the power to deepen understanding, foster consensus, and shed light on hidden areas of opportunity. The challenge is getting that data in front of users in a way that is both accessible and digestible. Our newest capability allows you to bring rich, interactive data visualizations to your users wherever they are — including in an existing host application — without rewriting your entire application or building a stand-alone data app. With Observable’s new embedded analytics solution, it’s now easier than ever to integrate visualizations and dashboards built with Observable Framework directly into your applications without compromising on richness of data displayed, end-user performance, or brand continuity. When we launched Observable Cloud, we set out to solve two key challenges in data visualization: first, the architectural challenge of getting rich data visualizations to load instantly without costly infrastructure; and second, the organizational challenge of enabling data teams to work more independently, free from complex pipelines and with fewer dependencies on external support. Our support for embedded analytics builds on these solutions, bringing the advantages of Observable’s baked data architecture into your application. Historically, data teams have had to choose between expressive visualizations and end-user performance, especially when rendering large amounts of data in the browser. Observable’s baked data architecture is purpose-built for the web, delivering highly performant, expressive data apps, dashboards, and visualizations. Precomputed snapshots ensure that displays of data load instantly, while flattened transitive imports eliminate request chains, allowing embeds to load in parallel. This means your visualizations don’t just load faster — they perform better, scaling up to more complex data needs (i.e. larger data sets that display significantly more points of data) without the typical performance trade-offs."
