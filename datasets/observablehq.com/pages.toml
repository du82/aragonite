["https://observablehq.com/customer-stories/themarshallproject"]
title = "Customer story: The Marshall Project | Observable"
description = "Nonprofit news organization The Marshall Project built custom data analysis and visualization tools with Observable. Here's how."
full_description = "The Marshall Project is a nonprofit news organization devoted to covering the criminal justice system in the United States. The system holds over 2 million people in confinement and, by some estimates, has affected the lives of nearly half of all Americans by the incarceration of a family member. The Marshall Project seeks to create and sustain a sense of national urgency about the criminal justice system through their journalism. They use investigative, engagement, and data reporting to shed light on issues such as the use of force on children or people serving life without parole. On one such investigation, they used data from the Bureau of Labor Statistics to probe whether police officers were in fact leaving the force in droves as suggested by a public narrative. Their investigation uncovered that police employment decreased by less than 1% during 2020, while the overall US economy lost 6% of workers that year. “We love these kinds of stories where there is a popular narrative but the data reveals something different. People read these and go to their city hall meetings a little more informed. They can ask better questions and engage with the narratives more effectively,” says David Eads, data editor at The Marshall Project. Data teams often hold a service-oriented role in the newsroom. They explore and analyze data and then they send their analyses back to reporters, editors, and other stakeholders. Eads believes in a more collaborative approach. “We want to get out of a mindset where you go to the data people and they turn a crank and findings come out, but it inevitably leads to more questions. We really want to have collaborative exploration of data.” For collaborative data exploration to work effectively, sharing must feel natural and part of the process. At the same time, the interface must be intuitive so that everyone feels empowered to explore data. “Tools like Google docs are great for sharing, but not ideal for working with data. Tools like Jupyter are suitable for working with data, but are not easy for everyone to read because readers have to dig past a wall of code before they can get to the charts or answers they need,” explains Eads."
