["https://observablehq.com/blog/maps-and-data-visualization-with-fil-riviere"]
title = "We can always talk about maps | Observable"
description = "Fil Rivière, Data Visualization Engineer at Observable, describes his path into data visualization, what he likes in a map, what’s hard about mapmaking, and why he’s asking if we need a “slow cartography movement.”"
full_description = "Start poking around Observable — on the platform, in the codebase, in user support, across our data visualization galleries — and you’ll find Philippe Rivière’s fingerprints everywhere. Fil (as we know him) is a Data Visualization Engineer at Observable, and a core contributor to our open-source software including Observable Plot, D3, and Observable Framework. His avatar (cropped from an illustration by Mad Meg, which Fil describes as “a character sitting in a corner watching the horror of the world with a lot of angst”), appears atop many of our most popular chart examples and alongside countless responses in notebooks and discussion boards: Fil has had an especially outsized impact when it comes to helping people to make better maps, including as the primary developer of Plot’s geo mark. So it wasn’t a surprise when I reached out to Fil about doing an interview that his response was simply: “We can always talk about maps.” Read on to hear, in Fil’s own words, about his path into data visualization, what he likes in a map, what he’s excited about next, and why — despite developing tools that help us all make maps faster — he’s wondering if we need a “slow cartography movement.” A: I used to be a journalist. When I was just getting started in journalism, I was responsible for building and maintaining the paper’s website. I worked at that same newspaper for almost twenty years. I eventually got fed up and decided I wanted to try something new. At the same time, my friend and colleague Philippe Rekacewicz (who was a cartographer at the same newspaper) had decided to leave. I loved what Reka — as everyone calls him — was doing with maps, so I started learning cartography with him. Reka likes to draw maps by hand. He goes through datasets line-by-line, checks everything, makes sense of what it means, then draws a map with pastel crayons. This seemed to me like a tedious process, because I was used to programming. So, I started learning from Reka while trying to contribute to the work. I wanted to see how we could automate making maps for the web."
author = "Allison Horst"
year_published = 2025
year_updated = 2025
