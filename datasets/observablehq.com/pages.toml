["https://observablehq.com/customer-stories/smplrspace"]
title = "Customer story: Smplrspace | Observable"
description = "Real estate technology company Simplrspace integrated with Observable to empower their customers to develop visualizations based on spatial mappings."
full_description = "In today’s evolving commercial real estate sector, owners and property managers face increasing challenges in optimizing asset performance and operational efficiency. The complexity of managing commercial properties at scale often involves navigating a labyrinth of disparate systems, where access to reliable, consolidated property data is crucial for informed decision-making. Adding to this challenge is the difficulty of contextually understanding these data points without physically being present in the space. Smplrspace addresses these challenges with its lean digital twin technology that property owners can use to quickly develop accurate, virtual spatial mappings of real-life floor plans and properties. Once the digital twin is created, property owners can add data layers to visualize applications like facility occupancy, IoT device data, leasing reports, air quality, and other assets within a digital space. Smplrspace wanted to enhance the value of their technology by integrating with a partner in the business intelligence space. They were specifically seeking a JavaScript-based solution, recognizing JavaScript’s popularity and extensive use among developers. Integrating with Observable Framework was an ideal choice, given its open-source nature, polyglot language compatibility for data handling, and robust community. By importing the Smplrspace JavaScript library (smplr.js) into an Observable Framework project, developers can build data apps that seamlessly embed Smplrspace’s spatial floor plans into their apps. Additionally, developers can use Smplrspace data layers within Observable Framework to create custom interactive inputs that control Smplrspace spatial map properties, as well as custom charts and blended metrics. To demonstrate this integration, Smplrspace and Observable co-developed a showcase data app exploring time series indoor carbon dioxide concentrations. The spatial map of air quality was initially prototyped in an Observable notebook, which, according to Thibaut Tiberghien, CTO of Smplrspace, “[is] the ideal environment for experimenting with different visualization and analytical approaches, while also enabling easy sharing and collaboration within the team.”"
