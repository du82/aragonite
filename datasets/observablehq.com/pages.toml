["https://observablehq.com/blog/truth-about-pie-charts"]
title = "Everything you think you know about pie charts is wrong | Observable"
description = "Pie and donut charts get a bad rep, but they’re useful for some data and tasks. We look at what they’re good for, as well as the research on how they work, to dispel some of the myths and prejudices against them."
full_description = "You’ve heard the jokes about them, you’ve been told not to use them, maybe you’ve been made fun of for using one anyway: pie charts! They’re as popular with the masses as they’re hated by some. So what are pie charts good for, when should you use one, and what do you tell the know-it-all who keeps insisting that they’re always the wrong choice? In this post, I will walk you through what pie charts are good for, how donut charts work, and finally take a look at what the research says (such as it is). Why should you trust me? I worked in visualization research for a while and have run studies on pie charts (I’m linking to a few of my studies at the end of this blog post). In fact, I might be the person who has run the most studies on them specifically. Let’s get this out of the way first, though: I’m not here to sell you pie charts. If you don’t like them, don’t use them. What I am taking issue with, however, is that opinions and aesthetic judgments get passed around as facts. It might surprise you how little we actually know about pie charts, given how ubiquitous they are and how long they’ve been around. In fact, pie charts are among the oldest statistical charts that we recognize as charts. William Playfair is generally credited with their invention, in his Statistical Breviary published in 1801. People seem to have disliked them for nearly as long. Willard Brinton, for example, stated in his 1914 book, Graphic Methods for Presenting Facts, that “[the] circle with sectors is not as desirable an arrangement as the horizontal bar [chart].” And the list goes on. Pie charts aren’t always the right choice for the data or the question being asked. However, many of the claims people like to make about them are either wrong, or there’s no evidence for them. My goal here is to present what we know about pie charts (and what we don’t know!), so we can decide to like or dislike them on their actual merits. No chart is good for everything, it always depends on what your data looks like and what task you have in mind. Bar charts are great for comparing values to each other, such as returns from different investments, or the mileage you get with different cars. Direct comparison of values is a common task, so bar charts are often a good choice."
author = "Robert Kosara"
year_published = 2025
year_updated = 2025
