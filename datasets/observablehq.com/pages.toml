["https://observablehq.com/blog/kelsey-nanan"]
title = "From Urban Science to data storytelling: Inside the work of Kelsey Nanan | Observable"
description = "Kelsey Nanan transforms complex data into impactful stories through creativity, collaboration, and data driven exploration."
full_description = "When talking with data visualization developer Kelsey Nanan, one thing quickly becomes clear: her path into this field wasn’t a traditional, carefully charted route. Instead, it began with a single elective class during her master’s program in Urban Science that sparked what she calls “an almost obsessive interest in web mapping” and eventually led her to work on complex, socially impactful projects. Hers is a story of how a single moment of discovery can reorient an entire career. “I took this one specific class during my master’s,” says Kelsey. “It was basically an intro to front-end development for people who were not technical at all. I just fell in love, and I became obsessed.” That obsession led her first into web mapping, which became the gateway into what she really loves: custom data visualization. “In data viz development, anything you can imagine, you can create,” she explains. “I really enjoy that. It gives you a lot of flexibility and creativity.” It’s a mindset that has carried her through a variety of roles and projects. Early on, she “weaseled” her way into her first data visualization role where she used D3 to rebuild and customize charts at a startup, and that experience led her to later work at McKinsey’s Data Visualization Lab. More recently, she’s been bringing complex stories to life as a freelance data visualization developer. Throughout it all, Kelsey has continued learning, experimenting, and adapting — an ethos that shines through in the projects she highlights and the advice she shares. One of Kelsey’s core philosophies is to let the data speak and shape the story, rather than forcing a predetermined narrative. This principle formed the foundation for a project she worked on called: Streets to Stability that explores the ecosystem of homelessness services in San Francisco. What initially started as a request for a visualization that mapped service providers to different stages of homelessness rapidly revealed the daunting complexity of San Francisco’s support system. The system, designed to aid individuals experiencing homelessness, is convoluted: more than 230 providers receive public funding to offer healthcare, housing access, behavioral health, and social support, but these services frequently overlap. This leads to a tangled web of resources in which someone may have to navigate 15 to 30 different service providers to get the help they need."
author = "Chris Cooning, Allison Horst"
