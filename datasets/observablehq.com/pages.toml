["https://observablehq.com/customer-stories/beige-technologies"]
title = "Customer story: Beige Technologies | Observable"
description = "Beige Technlogies used Observable to streamline data visualization workfllows and build reusable dashboards for their energy provider clients."
full_description = "Australia’s energy market is highly competitive, with more than a hundred electricity retailers vying for customers in an open marketplace. Offering a fixed price to customers comes with a significant risk for energy suppliers, as wholesale electricity costs in Australia change constantly due to the market’s volatility. Managing this risk is crucial for energy retailers, who often rely on data-rich quoting software to help them monitor fluctuating electricity prices. However, such solutions are costly and typically only feasible for larger businesses and energy users. To address this issue, Beige Technologies has developed innovative solutions that help energy providers of all sizes manage their risk by tracking the correlation between customer usage and wholesale prices. By using rich data to create user-friendly charts, their team helps energy retailers better understand market trends and adjust their pricing strategies accordingly. This approach provides greater transparency and control to energy providers, allowing them to offer competitive prices to their customers, while still effectively managing their risk. Beige Technologies is helping to improve the efficiency and competitiveness of Australia’s energy market, benefitting both energy providers and customers alike. “We think of Observable as a very fancy, expressive napkin drawing, which serves the purpose of simply and effectively communicating design ideas to our developers. It helps quickly bring high fidelity designs closer to reality, similar to how Figma has done for designers,” said Jesse Warburg, co-founder at Beige Technologies. In the past, the team at Beige Technologies faced challenges in their project development process. They would start by creating prototypes of projects in Microsoft Excel, but then had to hand them off to developers to create final data apps or dashboards using different tools. This process was time-consuming and posed a significant risk of technical debt, especially when dealing with over half a million data points. Building complex interactive features was a daunting task for developers, which often resulted in project planning and execution challenges."
