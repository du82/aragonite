["https://observablehq.com/blog/simplicity-bar-charts"]
title = "The powerful simplicity of bar charts and histograms | Observable"
description = "Bar charts are the workhorses of data visualization, showing numerical data broken down into discrete categories. They can also show counts of items, such as in histograms. This post shows some examples, as well as how to create them in Observable Plot."
full_description = "Bar charts, unlike pie charts, are the uncontroversial workhorse of data visualization. They fit many different kinds of data, and are the easiest to interpret when you need to read small differences in numbers with a high degree of precision. In this post, we’ll look at how bar charts work and a few typical uses. In a follow-up post, we’ll then go a bit further into more unusual use cases. At its most basic, a bar chart shows a numeric value broken down by a category. This might be sales broken down by department, average yearly cheese consumption by age group, or the number of sunny days per year for different cities. Note that there are two different sources for the bar length here: it can be a numeric column in the data set (like sales or cheese consumption) or based on the number of records with a particular value (number of days tagged with “sunny”). This number determines the length of the bars. The other (usually horizontal) axis is categorical, which means that there is no inherent ordering – or, if there is an inherent order, it’s less important than the numbers shown by the bars. The categorical axis just breaks the data down into individual subsets that we care about. Take this distribution of letter frequencies in an English-language corpus, for example: If we want to know the most frequent letters, sorting by frequency (on the vertical axis) makes the most sense. We can easily find the most and least common letters, the third-common, etc. But what if we’re interested in a particular letter? Or if we want to see if there are any obvious dependencies between neighboring letters in the alphabet? Then we can use this chart, with letters arranged alphabetically (instead of ordered by count): Bars are independent from each other, so no matter how we order them, they always look the same. This is very different from a line chart, where the slope between two points can change dramatically depending on how far apart they are, and how the values differ."
author = "Robert Kosara"
year_published = 2025
year_updated = 2025
