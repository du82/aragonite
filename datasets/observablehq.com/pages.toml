["https://observablehq.com/customer-stories/floatprotocol"]
title = "Customer story: Float Protocol | Observable"
description = "With Observable, cryptocurrency organization Float Protocol developed interactive data visualizations and white papers to document complex data processes."
full_description = "In the cryptocurrency space many tokens peg their monetary value to the US dollar for example, Tether, DAI or USDC. These are known as stablecoins and are some of the most widely used tokens on the Ethereum network by market capitalization. Float Protocol asks the question, why is this the case? Why should an ecosystem which prides itself on open, permissionless, borderless, censorship resistant and decentralized systems use base currencies that are pegged to a single state’s fiat currency and monetary policy? Float Protocol is building the decentralized monetary system of the future and at the heart of it is the FLOAT token. Float is not designed to hold its value to $1.00 USD but instead it is designed to float and change value over time like most major fiat currencies. The price of FLOAT is supported by a basket of cryptocurrencies which represent the cryptocurrency economy. The price of FLOAT is stabilized through frequent Dutch auctions, where the Protocol sells and mints, or purchases and burns FLOAT tokens to meet market demand. Dutch Auctions work on a price curve, starting from a high price and moving down to a floor price. For us the high price is the average market price for the last period, and the floor price is the “target price”, the value of FLOAT that the algorithmic monetary policy aims for. “One of the main challenges is communicating how these auctions will operate in different market conditions. When does the Protocol sell FLOAT, when does it purchase FLOAT and how much FLOAT?”, says John L, Lead Researcher and Co-founder at Float Protocol. Many people are used to typical English auctions where all the goods go to the highest bidder but not everyone is familiar with Dutch auctions. These have an extra game theoretical aspect where it is not only about the best price that you can afford as a purchaser but whether you will get there in time before someone else is willing to take a less affordable offer. Additionally, what influences the price of FLOAT over the long term is how the target price changes over time. The monetary policy algorithm used to calculate the target price aims at capturing market sentiment via the value of the currencies in the basket alongside whether there is high or low demand for FLOAT."
year_published = 2025
