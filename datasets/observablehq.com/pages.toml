["https://observablehq.com/blog/jason-forrest"]
title = "Jason Forrest: all data visualization is a dialogue | Observable"
description = "Jason Forrest, data visualization designer and Editor-in-Chief of Nightingale, shares his thoughts on creating empathetic visualizations that inspire conversations."
full_description = "Note: This is our third post in a series highlighting the work, experiences, and perspectives of leaders in data visualization. It’s late September when we first reach out to Jason Forrest about an interview, and he’s neck deep in putting the final touches on a new exhibit, Hello from the Data Vandals, which opens days later at Cooper Union in New York City. The show — a joint effort by Jason and artist Jen Ray, the duo behind The Data Vandals — explores data on housing, environmental issues, food, and demographics in the East Village neighborhood through art, data visualization, film, workshops, and panel discussions. He sends along a short video of the exhibit space, filmed on his phone while walking past bold pop art, hand-painted statistics, and data viz projected onto a back wall. The final seconds of the clip zoom in on a large yellow poster with “WHO THE HELL ARE THE DATA VANDALS?” painted in all caps across the top. A brief description follows: “Our society looks at the world through data, but data doesn’t have to live in a dusty database! We create a new kind of art to begin conversations that affect us all.” When we meet with Jason the week after the show, we quickly learn that beginning conversations isn’t just a Data Vandals tagline — it’s core to Jason’s work and worldview, and not only as a data visualization designer. Whether through art, music, publishing, photography, or data viz, Jason’s on a mission to give people something to talk about. These days, Jason Forrest is a big name in data visualization. He led data viz efforts at McKinsey & Company — one of the largest consulting firms in the world — as a designer, analyst, and ultimately Director of the McKinsey Data Visualization Lab. In 2019 he co-founded Nightingale, the Journal of the Data Visualization Society, for which he still serves as editor-in-chief. He established the biannual print spinoff, Nightingale Magazine, in 2022. And, earlier this year, he founded the Jason Forrest Agency to build tools that help clients “explore data for better, faster decisions.”"
