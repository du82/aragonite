["https://observablehq.com/customer-stories/climate-central"]
title = "Customer story: Climate Central | Observable"
description = "Learn how Observable helped Climate Central more efficiently create and share high-quality data visualizations highlighting the impacts of climate change."
full_description = "Climate Central creates and publishes rich, interactive maps and graphics that highlight local impacts of climate change. Their visuals are used by journalists and science communicators worldwide in stories that bring climate impacts and solutions closer to home for policymakers and the public. Climate Central's Climate Matters program produces free weekly climate reporting resources, including local data and custom graphics, for thousands of media partners. Their relatively small team relies on Observable to build, host, and share up-to-date, interactive, local climate data at scale — and on schedule. We recently spoke with Climate Central's Kaitlyn Trudeau (Senior Research Associate) and Jennifer Brady (Senior Data Analyst and Research Manager), who shared how Observable helps their team build interactive dashboards, maximize their productivity, and expand what they think is possible for their data displays. Climate Central's Climate Matters team works in Observable Notebooks — browser-based, interactive, and editable documents defined by code — to explore climate data, develop interactive graphics, and share them with media partners. For example, they recently published a notebook where viewers can dig into fire weather trends across the United States: Climate Central's interactive graphics exploring fire weather trends across the U.S., created and shared in an Observable Notebook. See the live version: Fire weather in the U.S. And, they've embedded graphics directly from notebooks to include them on their website, which is straightforward with notebook embeds: We don't have to do tons of work just to get something onto our site. We just get the iframe and drop in the URL, and it works on our site. But when they needed to create a fast, interactive, multi-page data product where viewers could explore urban heat islands nationwide, they decided to build it using Observable Framework. Climate Matters chose Framework for their urban heat islands work for several reasons. First, they wanted to build a more polished, multi-page product — in particular, without the many UI elements that make notebooks easy to work in, but also a little busy for non-coding viewers. Second, the census tract and block group level spatial data exceeded notebook attachment limits, which is not a restriction for files-based Framework, where you work and build locally. Lastly, they needed to include fast, beautiful, interactive graphics that allow (and even encourage) viewers to dig deeper into the data."
