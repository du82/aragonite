["https://observablehq.com/customer-stories/trase"]
title = "Customer story: Trase | Observable"
description = "Environmental protection organization Trase utilized Observable to explore data and create advanced data visualizations and dashboards."
full_description = "Trase was formed from a partnership between the Stockholm Environmental Institute and Global Canopy with a mission to increase the sustainability of how the world’s agricultural commodities such as sugar, beef, corn, palm oil etc. are produced, traded and consumed, and to reduce the level of deforestation tied to current unsustainable methods. To do this, Trase surfaces data about global agricultural commodity supply chains and their impacts, revealing the links to environmental and social risks in tropical forest regions. Consisting of more than 30 globally-distributed collaborators, Trase curates data from diverse sources around the world, consolidates and analyzes it, and then creates advanced visualizations and dashboards to inform their readers. They chose Observable to generate and publish live interactive visualizations on their website continue to update and republish them directly from their Observable notebooks. Prior to using Observable, the Trase team was spending a significant amount of time and resources making changes to their website and their yearbook. The system was expensive and difficult to scale, so the data scientists on the team looked for a different approach. “Iterating on visualizations with external developers was proving expensive and slow, so I decided to create a few myself in a personal Observable account. It was from there that I developed a proof of concept for generating visualizations in-house, taking the financial burden off of our team and opening up the whole process,” says Ben Ayre, Research Associate at Trase. The team found the end-to-end experience with Observable, from prototyping to publishing in production, to be quick, easy and collaborative, without having to do several round-trip discussions with a third-party. As a result, they decided to do the visual design work themselves, and removing the vendor bottlenecks in their workflow. This allowed them to reduce costs and time-to-market of their data insights significantly."
