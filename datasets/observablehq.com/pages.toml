["https://observablehq.com/customer-stories/stitchfix"]
title = "Customer story: Stitch Fix | Observable"
description = "Personal styling service Stitch Fix used Observable to empower their data scientists, engineers, and decision makers to quickly explore and visualize data."
full_description = "Stitch Fix is an online personal styling service that fuses the human touch of expert stylists with the precision of advanced data science and algorithms to recommend items of clothing tailored to an individual’s unique fit, size, budget and style. The company was founded in 2011, and employs 8,000 people, including 145 data scientists, as part of its unique approach to the fashion industry. Stitch Fix has hundreds of internal data sources and algorithms for styling, operations, merchandising, inventory management, allocation and warehouse optimization. Data is foundational to the company, driving decisions and actions across departments. The Algorithms team generously shares its technical deep dives on its blog. With over 145 data scientists, sharing data, code, algorithms and knowledge is imperative. Stitch Fix’s Data Platform team started using Observable from the early days to enable ad hoc exploration of data and the many endpoints in the company’s service-based enterprise platforms. “We have a panoply of services that operate independently of each other. Valuable insights can be found regarding incidents, or other movements in the business. Nearly all of our services expose their state in rest APIs, so being able to knit all of these various APIs together to create a coherent view has been invaluable,” says Tarek Rached, Director of Algo UI at Stitch Fix. Observable notebooks are now a critical part of the company’s enterprise stack, documenting and explaining the logic and connections between the different data sets and services. This happens both implicitly (since the code and mappings are visible in one place) as well as explicitly (documented as text in the notebooks) This saves a lot of time, and streamlines the back and forth between the data scientists, engineers, and decision makers. Observable empowers the data scientists to rapidly incorporate data into their models with no infrastructure or software to set up. With the easy visualization and interactivity in the platform, they can collaborate, test, and launch their ideas much faster. And because the code, narrative and visualizations are web-based and accessible in their private team space, they are able to share and collaborate more easily with each other and partners."
year_published = 2025
