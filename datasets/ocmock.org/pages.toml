title = "Reference · OCMock"
description = "OCMock is a library for creating mock objects in Objective-C."
full_description = '''Reference This page describes the features present in OCMock 3.x, using the modern syntax. Previous versions of OCMock used a selector-based syntax. This is still available in OCMock 3, however, the default is the modern syntax. Related pages Getting started with OCMock Setting up OCMock for iOS development What's new in OCMock 3 OCMock 2 features page Contents Creating mock objects Stubbing methods Verifying interactions Argument constraints Mocking class methods Partial mocks Strict mocks and expectations Observer mocks Advanced topics Limitations Creating mock objects Class mocks id classMock = OCMClassMock([SomeClass class]); Creates a mock object that can be used as if it were an instance of SomeClass. It is possible to mock instance and class methods defined in the class and its superclasses. There are some subtleties when mocking class methods. See mocking class methods below. Protocol mocks id protocolMock = OCMProtocolMock(@protocol(SomeProtocol)); Creates a mock object that can be used as if it were an instance of an object that implements SomeProtocol. Otherwise they work like class mocks. Strict class and protocol mocks id classMock = OCMStrictClassMock([SomeClass class]); id protocolMock = OCMStrictProtocolMock(@protocol(SomeProtocol)); Creates a mock object in strict mode. By default mocks are nice, they return nil (or the correct default value for the return type) for whatever method is called. In contrast, strict mocks raise an exception when they receive a method that was not explicitly expected. See strict mocks and expectations below. Partial mocks id partialMock = OCMPartialMock(anObject); Creates a mock object that can be used in the same way as anObject. Any method that is not stubbed is forwarded to anObject. When a method is stubbed, and it is invoked using a reference to the real object, the mock will still be able to handle the invocation, which means that the stubbed method will be used and it is possible to verify that the method has been invoked. There are some subtleties when using partial mocks. See partial mocks below. Observer mocks deprecated Observer mocks are deprecated as of OCMock 3.8. Please use XCTNSNotificationExpectation instead. id observerMock = OCMObserverMock(); Creates a mock object that can be used to observe notifications. The mock must be registered in order to receive notifications. See observer mocks below for details. Stubbing methods Stubbing methods that return objects OCMStub([mock someMethod]).andReturn(anObject); Tells the mock object that when someMethod is called it should return anObject. Stubbing methods that return values OCMStub([mock aMethodReturningABoolean]).andReturn(YES); For methods that return primitive values it is important to use the right type of value. If, for example, a method returns a long but the stub uses an int an error will occur. The message will include the expected and the actual type (using Objective-C type codes such as “q” for long and “i” for int). Delegating to another method OCMStub([mock someMethod]).andCall(anotherObject, @selector(aDifferentMethod)); In this case the mock object will call aDifferentMethod on anotherObject when someMethod is called. The signature of the replacement method must be the same as that of the method that is replaced. Arguments will be passed, and the return value of the replacement method is returned from the stubbed method. It is common to implement the replacement method in the test case itself. Delegating to a block OCMStub([mock someMethod]).andDo(^(NSInvocation *invocation) { /* block that handles the method invocation */ }); The mock object will call the passed block when someMethod is called. The block can read the arguments from the invocation object, and it can use the invocation object to set up a possible return value. IMPORTANT: If you read the arguments from the invocation and get hard-to-explain crashes, please read the answer to this question on StackOverflow. Returning values in pass-by-reference arguments OCMStub([mock someMethodWithReferenceArgument:[OCMArg setTo:anObject]]); OCMStub([mock someMethodWithReferenceArgument:[OCMArg setToValue:OCMOCK_VALUE((int){aValue})]]); The mock object will set the reference that is passed to the method to anObject and aValue. Use setTo: for pass-by-reference arguments that return objects and setToValue: and OCMOCK_VALUE() for arguments that return primitives. Invoking block arguments OCMStub([mock someMethodWithBlock:[OCMArg invokeBlock]]); OCMStub([mock someMethodWithBlock:([OCMArg invokeBlockWithArgs:@"First arg", nil])]); The mock object will invoke the block passed as an argument to the stubbed method. If the block takes arguments and invokeBlock is used, the default values for the argument types are used, e.g. zero for a numerical type. Using invokeBlockWithArgs: it is possible to specify which arguments to invoke the block with; non-object arguments must be wrapped in value objects and the expression must be wrapped in round brackets. Throwing exceptions OCMStub([mock someMethod]).andThrow(anException); When someMethod is invoked the stub will throw anException. Posting notifications OCMStub([mock someMethod]).andPost(aNotification); When someMethod is invoked the stub will post aNotification. Chaining stub actions OCMStub([mock someMethod]).andPost(aNotification).andReturn(aValue); All actions such as andReturn and andPost can be chained. In this example the mock object will post a notification and return the value. Forwarding to the real object / class OCMStub([mock someMethod]).andForwardToRealObject(); When using a partial mock and when mocking class methods it is possible to stub a method and forward it to the real object (in case of partial mocks) or to the class (when mocking class methods). This is only useful when chaining actions or when using expectations. Doing nothing OCMStub([mock someMethod]).andDo(nil); It is possible to pass nil instead of a block to andDo. This is only useful with partial mocks or when mocking class methods. In these cases using andDo(nil) effectively suppresses the behaviour in the existing class. Fulfilling XCTest expectations requires OCMock 3.8 OCMStub([mock someMethod]).andFulfill(expectation); When the method is invoked an expectation in the XCTest framework is fulfilled. See this test for details. Logging messages requires OCMock 3.8 OCMStub([mock someMethod]).andLog(format, ...); When the method is invoked the message constructed from format and the arguments is logged via NSLog. It is likely that you want to use this in a chain, maybe followed by andReturn() or andForwardToRealObject(). Breaking into the debugger requires OCMock 3.8 OCMStub([mock someMethod]).andBreak(); When the method is invoked the debugger is opened as if a breakpoint was hit. The stack will end somewhere in the implementation of OCMock but if you look further up, past the __forwarding__ frames, you should be able to see where your code invoked the method. Verifying interactions Verify-after-running id mock = OCMClassMock([SomeClass class]); /* run code under test */ OCMVerify([mock someMethod]); Verifies that someMethod has been called by the code under test. If the method has not been invoked an error is reported. In Xcode and AppCode the error is reported on the line of the verify, for other test environments an exception is thrown. It is possible to use argument constraints in the verify statement. Stubs and verification id mock = OCMClassMock([SomeClass class]); OCMStub([mock someMethod]).andReturn(myValue); /* run code under test */ OCMVerify([mock someMethod]); It is possible to stub a method and still verify that it has been called. Quantifiers requires OCMock 3.6 id mock = OCMClassMock([SomeClass class]); /* run code under test */ OCMVerify(atLeast(2), [mock doStuff]); By default, verification simply checks whether a method has been called or, more precisely, whether it has been called at least once. Sometimes tests require to be more specific. Here the test verifies that the doStuff method was called at least twice. OCMVerify(never(), [mock doStuff]); OCMVerify(times(n), [mock doStuff]); OCMVerify(atLeast(n), [mock doStuff]); OCMVerify(atMost(n), [mock doStuff]); A number of different quantifiers exist for various cases. The never() quantifier is simply an abbreviation of times(0). If these macros cause problems in your code, it is possible to define the OCM_DISABLE_SHORT_SYNTAX or OCM_DISABLE_SHORT_QSYNTAX preprocessor macros, and use a prefixed form of the macro. In that case times(n) becomes OCMTimes(n) and so on. See section 9.6 below for details. [[[mock verify] withQuantifier:[OCMQuantifier atMost:1]] doStuff]; Because it isn't documented anywhere else: for fans of the old, selector-based syntax quantifiers are also available as shown above. Argument constraints The any constraint OCMStub([mock someMethodWithAnArgument:[OCMArg any]]) OCMStub([mock someMethodWithPointerArgument:[OCMArg anyPointer]]) OCMStub([mock someMethodWithSelectorArgument:[OCMArg anySelector]]) Adds a stub for the methods which is active for all invocations, no matter what argument is passed. Pointers and selectors require special treatment as shown above. Arguments that are neither objects nor pointers or selectors cannot be ignored using an any placeholder (for details see this forum thread). See just below for a workaround. Ignoring non-object arguments requires OCMock 3.5 OCMStub([mock someMethodWithIntArgument:0]).ignoringNonObjectArgs(); This tells the mock to ignore all non-object arguments in the invocation. It will accept any invocation of someMethodWithIntArgument: no matter what argument is actually passed. If the method has object arguments as well as non-object arguments, the object arguments can still be constrained as usual using the methods on OCMArg. Matching arguments OCMStub([mock someMethod:aValue) OCMStub([mock someMethod:[OCMArg isNil]]) OCMStub([mock someMethod:[OCMArg isNotNil]]) OCMStub([mock someMethod:[OCMArg isNotEqual:aValue]]) OCMStub([mock someMethod:[OCMArg isKindOfClass:[SomeClass class]]]) OCMStub([mock someMethod:[OCMArg checkWithSelector:aSelector onObject:anObject]]) OCMStub([mock someMethod:[OCMArg checkWithBlock:^BOOL(id value) { /* return YES if value is ok */ }]]) If an argument is passed when the stub is created, the stub only matches invocations with that exact argument. Calls with different arguments are not matched. The OCMArg class provides several methods that allow matching values in different ways. For checkWithSelector:onObject:, when the mock object receives someMethod:, it invokes aSelector on anObject. If the method takes an argument the mock will pass the argument that was passed to someMethod:. The method should return a boolean indicating whether the argument matched the expectation or not. Using Hamcrest matchers OCMStub([mock someMethod:startsWith(@"foo")]) It is also possible to use Hamcrest matchers. This will only work when the Hamcrest framework is explicitly linked by the unit test bundle. OCMock does not declare a dependency on Hamcrest and discovers it using runtime functions. Mocking class methods Stubbing class methods id classMock = OCMClassMock([SomeClass class]); OCMStub([classMock aClassMethod]).andReturn(@"Test string"); // result is @"Test string" NSString *result = [SomeClass aClassMethod]; Stubs for class methods are set up exactly like stubs for instance methods. However, behind the scenes the mock object makes some changes to the class. (It dynamically creates a new meta class and makes the class use that instead of its own meta class.) This allows OCMock to stub calls which are made directly to the class. IMPORTANT: If the mock object that added a stubbed class method is not deallocated then the stubbed method will persist across tests. If multiple mock objects manipulate the same class at the same time the behaviour is undefined. Verifying invocations of class methods id classMock = OCMClassMock([SomeClass class]); /* run code under test */ OCMVerify([classMock aClassMethod]); Verification is done in the same way as with instance methods. As described above, calls can be made directly to the class. Disambiguating class and instance methods id classMock = OCMClassMock([SomeClass class]); OCMStub(ClassMethod([classMock ambiguousMethod])).andReturn(@"Test string"); // result is @"Test string" NSString *result = [SomeClass ambiguousMethod]; In cases where a class method should be stubbed but the class also has an instance method with the same name as the class method, as assumed with ambiguousMethod above, the intent to mock the class method must be made explicit using ClassMethod(). Restoring the class id classMock = OCMClassMock([SomeClass class]); /* do stuff */ [classMock stopMocking]; The class can be returned to its original state by calling stopMocking. This is only necessary if the original state must be restored before the end of the test. The mock automatically calls stopMocking during its own deallocation. When the class is returned to its original state, its meta class will be switched back to the original meta class. This effectively removes all the stubs. However, this also makes it impossible for the mock to add new stubs or to verify interactions. You should really not use a mock after having called stopMocking. Partial mocks Stubbing methods id partialMock = OCMPartialMock(anObject); OCMStub([partialMock someMethod]).andReturn(@"Test string"); // result1 is @"Test string" NSString *result1 = [partialMock someMethod]; // result2 is @"Test string", too! NSString *result2 = [anObject someMethod]; From an API perspective stubs on partial mocks are set up in the same way as on class and protocol mocks. Partial mocks alter the class of the mocked object, though. (In fact, they create a subclass and switch the class of the mocked object to that subclass.) This means that calls using a reference to the real object, even including self in methods where the object calls itself, are also affected by stubs and expectations. Verifying invocations id partialMock = OCMPartialMock(anObject); /* run code under test */ OCMVerify([partialMock someMethod]); Verification is done in the same way as with class and protocol mocks. As described just above, calls using a reference to the real object are intercepted, too. There is no need to insure that a reference to the mock is used, calls can be made using references to the real object. Restoring the object id partialMock = OCMPartialMock(anObject); /* do stuff */ [partialMock stopMocking]; The real object can be returned to its original state by calling stopMocking. This is only necessary if the original state must be restored before the end of the test. The partial mock automatically calls stopMocking during its own deallocation. When the object is returned to its original state, its class will be switched back to the original class. This effectively removes all the stubs. However, this also makes it impossible fo'''
