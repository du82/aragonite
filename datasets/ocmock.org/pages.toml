full_description = '''Downloads Releases You can download releases of OCMock on GitHub https://github.com/erikdoe/ocmock/releases The disk images contain frameworks for macOS, iOS, tvOS, and watchOS development, a static library for iOS development, and the source code. As of OCMock 3.9.0 the binary distribution contains XCFrameworks. Usually the releases can be used on newer systems, too. For example, OCMock 3.1, built with Xcode 6.2 using the OS X 10.10 and iOS 8.2 SDKs, can also be built with Xcode 7 and its newer SDKs. However, there is no guarantee that a release of OCMock can be built with versions of Xcode older than the current stable version at release. Source code The source code for OCMock is available on GitHub https://github.com/erikdoe/ocmock The current build status is shown above on the right. If this isn't showing passing, chances are the code is currently not building correctly and we're busy trying to fix it. In all other cases, a local build from source should work. As mentioned above, there is no guarantee that a release of OCMock can be built with versions of Xcode older than the current stable version at release. License for OCMock 3.x Copyright (c) 2004-2023 Erik Doernenburg and contributors Licensed under the Apache License, Version 2.0 (the "License"); you may not use these files except in compliance with the License. You may obtain a copy of the License at http://www.apache.org/licenses/LICENSE-2.0 Unless required by applicable law or agreed to in writing, software distributed under the License is distributed on an "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for the specific language governing permissions and limitations under the License. License for OCMock 1.x and 2.x Copyright (c) 2004 - 2014 by Mulle Kybernetik. All rights reserved. Permission to use, copy, modify and distribute this software and its documentation is hereby granted, provided that both the copyright notice and 