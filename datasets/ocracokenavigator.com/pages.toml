iest public library in the United States. The current library replaced the 96 square foot small wood frame building in 1998. Ocracoke School Ocracoke has the smallest public school in the state of North Carolina. The school averages just over 6 graduates per year. Methodist Church The Methodist Episcopal Church was first established on Ocracoke Island in 1828. Village Craftsmen / Howard St. Both the "Around Creek" and "Down Point" audio tours begin at Village Craftsmen on Howard Street. Blackbeard's Lodge Built in 1938, Blackbeard’s Lodge was the first island building constructed specifically as a modern hotel. Old Post Office A History of the United States Post Office at Ocracoke. Howard Street Howard Street is a North Carolina treasure. No other street has the history and charm it boasts. British Cemetery This small graveyard is the final resting place of four British sailors from an armed trawler torpedoed in 1942. Get Directions For Driving Walking Bicycling show options hide options Avoid Tolls Avoid Highways From To Fetching directions...... Reset directions Print directions Date Categories Tags Permalink Status Published:December 12, 2014 Maps Bookmark the permalink Both comments and trackbacks are currently closed. « Previous Post Next Post »'''
