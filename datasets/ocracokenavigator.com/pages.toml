["https://ocracokenavigator.com"]
title = "Ocracoke Island's Mobile Web App! - Ocracoke Navigator"
description = "Ocracoke Navigator is a mobile guide to Ocracoke Island. Find things to do, places to eat, shopping, self-guided audio tours, and interactive maps."
full_description = "Ocracoke Island’s Mobile Web App! It’s like having an Ocracoke native in your pocket! Ocracoke Navigator provides easy-to-use interactive maps, extensive historical content , vintage and contemporary photographs, and other information about Ocracoke Island. Two self-guided audio walking tours are unique to Ocracoke Navigator. Audio can be streamed to mobile devices and the app will guide the listener to each stop. Twenty-two points of interest are covered on the “Down Point” and “Around Creek” tours. A kayak tour is also available. Extensive historical content and photographs, both vintage and contemporary, are also provided. All the major points of interest are included, as well as many lesser-known locations and events. The historical photographs map marks the locations of interesting photographs from the past, complete with an arrow indicating the orientation of the camera. Visitors are encouraged to visit the site and compare the old photographs with the current views."
