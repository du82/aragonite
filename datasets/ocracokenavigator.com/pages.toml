full_description = "Acknowledgements Ocracoke Navigator would like to thank the following: Philip Howard for providing us with detailed historical information as a starting point for many of the posts. You can follow Philip’s blog the Ocracoke Island Journal and read the his Ocracoke Newsletter for additional information about Ocracoke. Philip also wrote and produced the “Down Point” and “Around Creek” audio tours available on OcracokeNavigator.com. He is also the male voice you hear narrating every other stop on the tours. Ocracoke Preservation Society, for access to the historical photographs used on OcracokeNavigator.com. Everyone who donated photographs to Ocracoke Preservation Society. Thank you for enabling us to visually tell the story of Ocracoke. Stefen’s 2007 Toshiba Satellite A135-S4527 laptop running the Linux operating system. Stefen is a supporter of free and open source software. The following software was used: WordPress and associated plugins Linux Mint GNU Image Manipulation Program (GIMP) Inkscape Blender LibreOffice Scribus Xsane Audacity Nicolas Mollet for his Maps Icons Collection: http://mapicons.nicolasmollet.com"
