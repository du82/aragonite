description = "Find historic buildings, cemeteries, nature trails, beach access, public boat ramps, public parking, and exhibits on Ocracoke Island."
full_description = '''HomeMapsAbout Ocracoke Map About Ocracoke Map Stefen Howard Filter ByAllNoneAbout OcracokeArts and CultureHistorical PhotosPhoto SpheresPublic Services .wpgmaps_directions_outer_div button { padding: 0px; width: 35px; height: 35px; } .wpgmaps_directions_outer_div button img { width: 100%; } .wpgmaps_directions_outer_div input[type=text] { display: inline-block !important; } .wpgmza_table_category { display: none !important; }.wpgmza_table_address { display: none; } .wpgmza_map img { max-width:none; } .wpgmza_widget { overflow: auto; } TitleDescription Ramp 63 New beach access ramp - opening soon Old Hammock Oak Ocracoke Island boasts a number of magnificent Southern Live Oaks, many of them hundreds of years old. Learn more about live oaks and about the six oaks on Ocracoke that are members of the Live Oak Society. Springer's Point Oaks Ocracoke Island boasts a number of magnificent Southern Live Oaks, many of them hundreds of years old. Learn more about live oaks and about the six oaks on Ocracoke that are members of the Live Oak Society. Howard Street Oaks Ocracoke Island boasts a number of magnificent Southern Live Oaks, many of them hundreds of years old. Learn more about live oaks and about the six oaks on Ocracoke that are members of the Live Oak Society. Sound Access Road Pamlico Sound ORV access about two and a half miles north of the pony pasture. Sound Access Road Pamlico Sound ORV access about one and a half miles north of the pony pasture. North Ferry Terminal Parking Parking for about 15 vehicles is available here with several paths to the beach. North End Final Turn Parking This lot has room for about 23 vehicles. This access point has separate pedestrian and vehicle access. Watch for trucks once you get over the dunes. North of Pony Pasture Parking This lot has about 25 spaces available with several paths to the beach. Pony Pasture Parking Parking available on both sides of highway 12. There are about 18 spaces total. Be careful crossing. The speed limit here is 55 mph, so cars will be travelling fast. Campground Parking 46 spaces. Pedestrians share access with off-road vehicles when ramp is open. Watch for moving vehicles if you use this access point. Airport Parking Room for about 20 vehicles. Pedestrians share access with off-road vehicles. Watch for moving vehicles if you use this access point. Information Center Ocracoke Civic and Business Association is a non-profit organization that promotes local businesses and events. Lehigh Approaching Ocracoke from the south or west the ferry will pass two metal piles in Big Foot Slough Channel. They are part of a dredge which sank in 1942. A Tale of Blackbeard A Tale of Blackbeard is a musical play presented occasionally in the summer season as a community theater production on Ocracoke Island. Sound access road Pamlico Sound ORV access at the north ferry terminal. Sound access road Pamlico Sound ORV access just south of the north ferry terminal. Sound access road Pamlico Sound ORV access near the National Park Service Campground. Ramp 59 North Point ORV beach access Ramp 67 ORV beach access near Molasses Creek. Ramp 68 Campground ORV beach access. Ramp 70 Airport ORV beach access. Ramp 72 South Point Road ORV beach access. Mail Boat Aleta In the 1940s and early 1950s, Ocracoke's main link to the mainland was the privately owned and operated mail boat, Aleta. Silver Lake Native islanders almost always refer to Silver Lake Harbor as "The Creek." More formally it is called "Cockle Creek," a name used for generations. Old Diver About one hundred years ago, Augustus Abner McQuire drown while attempting to repair the hull of a ship anchored off Ocracoke. He was buried on Ocracoke and became a local ghost legend. First Automobile Accident In September of 1925, with only two vehicles on the entire Island, Ocracoke had it’s first automobile accident on what is now Howard Street. Ocracoke Post Office United States Post Office Public Boat Ramp Public Boat Ramp Public Parking Free public parking for Ocracoke visitors near the south ferry terminal and the NPS Visitor Center. Cedar Hammock Coast Guard Station The first lifesaving station on Ocracoke was built in 1883 just south of Hatteras Inlet near the current north ferry terminal. NPS Lifeguarded Beach The NPS lifeguarded beach is part of approximately sixteen miles of National Seashore and one of the most beautiful beaches on the eastern seaboard. The day use area has parking for about 100 vehicles. NPS Campground The National Park Service campground on Ocracoke is located approximately three miles northeast of the village on N.C. Highway 12 Hammock Hills Nature Trail North of the village across from the NPS campground is Hammock Hills Nature Trail, a ¾ of a mile loop through some of the highest points on the island. North Ferry Terminal Part of an extensive state ferry system, the north terminal connects Ocracoke with Hatteras Island. South Ferry Terminal Part of an extensive state ferry system, the south terminal provides passage to Cedar Island and Swan Quarter. WOVV Community Radio - 90.1 FM Ocracoke Working Watermen's Association Museum Working Watermen's Exhibit Ocracoke Working Watermen's Association Ocracoke Pony Pasture Ocracoke is home to a herd of wild ponies descended from Spanish Mustangs introduced by early colonists. Portsmouth Now a ghost town, Portsmouth was a thriving port village in the late eighteenth and early nineteenth century. U.S. Navy Beach Jumpers During WWII, the U.S. Navy used Ocracoke for a top-secret base for training a specialized unit in psychological warfare and deception. Loop Shack Hill A U.S. Navy installation designed to detect and deter U-boats off the North Carolina Coast during World War II. Ocracoke Naval Base During World War II, the US Navy built a base on Ocracoke Island to patrol the coast and deter U-boat attacks. Fort Ocracoke Memorial During the Civil War, a Confederate fort was constructed on Beacon Island, about one mile inside Ocracoke Inlet. This memorial commemorates this fort and the men from Ocracoke and Portsmouth who served. Fort Ocracoke During the Civil War, a Confederate fort was constructed on Beacon Island, about one mile inside Ocracoke Inlet. The fort was destroyed on September 17, 1861, and in 1998, the remains were discovered. NCCAT Ocracoke Campus The historic old Coast Guard building houses the Ocracoke branch of the North Carolina Center for the Advancement of Teaching. Old Quawk The story of Old Quawk has been told on Ocracoke Island since at least the early nineteenth century. Island Inn Built in 1901, the upper floor of the main section was used as the meeting room for the Odd Fellows Lodge. The lower floor was used as a schoolhouse. Springer's Point Springer’s Point is the last maritime forest remaining in Ocracoke Village. Off its shore lies Teach's Hole, where Blackbeard's last battle took place. Springer's Point Trail Head Springer’s Point is the last maritime forest remaining in Ocracoke Village. Off its shore lies Teach's Hole, where Blackbeard's last battle took place. Assembly of God Church The Assembly of God Church carries on the Pentecostal tradition begun in 1938 on Ocracoke Island. Community Store (Historic Site) This old general store was established in 1918 and sold groceries, clothes, fishing supplies, hardware, and even caskets. NPS Visitor Center Ocracoke is part of the Cape Hatteras National Seashore. There are many programs offered at the National Park Service Visitor Center on Ocracoke. Ocracoke Preservation Society Museum & Shop The Ocracoke Preservation Society is a non-profit, community-based organization dedicated to the preservation of Ocracoke Island’s rich historical and cultural heritage. Howard Cemetery The Howard Cemetery is one of the oldest on the island and one of the largest. George Howard, son of the last Colonial owner, is buried here. Ocracoke Library For many years Ocracoke boasted the tiniest public library in the United States. The current library replaced the 96 square foot small wood frame building in 1998. Capt Bill Thomas House In the harbor of St. Kitt’s in the Caribbean Captain Thomas spied a stately home with a wide veranda and decided to have a replica built for himself and his new bride back on Ocracoke. Albert Styron's Store (Historic Site) One of five general stores on Ocracoke during the first half of the twentieth century, Albert Styron’s store, established in 1920, served the need of people living Down Point. Teach's Hole / Blackbeard In November of 1718, the governor of Virginia sent Robert Maynard of the British Royal Navy to hunt down Blackbeard. In a deep water channel off the shore of Springer’s Point, Maynard’s men overpowered the smaller pirate crew and beheaded their captain. Ocracoke School Ocracoke has the smallest public school in the state of North Carolina. The school averages just over 6 graduates per year. Methodist Church The Methodist Episcopal Church was first established on Ocracoke Island in 1828. USLSS Boathouse In 1883 the US government established the island’s first Life Saving Station near Hatteras Inlet. Blackbeard's Lodge Built in 1938, Blackbeard’s Lodge was the first island building constructed specifically as a modern hotel. Old Post Office A History of the United States Post Office at Ocracoke. Berkley Castle Influenced by both New England turn-of-the-century resort architecture and by Colonial Williamsburg style, the Castle was built in the mid-1950s by industrialist Sam Jones. Howard Street Howard Street is a North Carolina treasure. No other street has the history and charm it boasts. British Cemetery This small graveyard is the final resting place of four British sailors from an armed trawler torpedoed in 1942. Bragg-Howard House This house is representative of the basic island home, the historic "story and a jump," a diminutive frame house, one and a half stories high. Ocracoke Lighthouse Ocracoke Island’s most prominent landmark is its 75′ tall lighthouse built in 1823. Get Directions For Driving Walking Bicycling show options hide options Avoid Tolls Avoid Highways From To Fetching directions...... Reset directions Print directions Date Categories Tags Permalink Status Published:December 4, 2014 Maps Bookmark the permalink Both comments and trackbacks are currently closed. « Previous Post Next Post »'''
