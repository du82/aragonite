["https://octobox.io/pricing"]
title = "Octobox"
description = "Untangle your GitHub Notifications"
full_description = "Octobox is free for open source projects. We have paid-for plans for access to private projects for you or your organisation which can be paid for in two ways: In order to take advantage of paid-access feature you will need to install the Octobox GitHub App on each repository or organisation you'd like to enable. This may require additional authorisation. Like many open source projects, Octobox currently relies on volunteers and donations to cover the cost of maintaining the Octobox project. This is not sustainable. Octobox is primarily maintained by Andrew Nesbitt and Benjamin Nickolls. We believe that many of the issues around the sustainability of open source software can be solved by the community itself. We also believe in leading by example, testing our assumptions, and backing up our decisions with data. Octobox has a small community of maintainers, contributors, supporters, and sponsors. Our first priority is to begin building a sustainable income, for ourselves and our community. Our second is to demonstrate that our approach is repeatable and scalable, proving that we can solve this problem together. Our pricing model is our first experiment. Octobox.io operated by Octobox Ltd., a company registered in the UK by Andrew Nesbitt and Benjamin Nickolls. The company is primarily designed to offer limited liability to the operators of Octobox.io and to renumerate directors and staff as employees or contractors. The Octobox project will continue to collect donations via Open Collective and operate a transparent ledger of income and outgoings for the project — including, for the time being, the costs of hosting Octobox.io. When it is able to, the project will pay maintainers for their time, including time spent operating Octobox.io, which will be directed through Octobox Ltd. Octobox Ltd. will provide private repository access to those who donate an equivalent sum (or more) to the community as pay directly through alternate channels. In addition, the company will pledge at least 15% of its revenues for use by the community to further the open source project, forever."
year_published = 2025
