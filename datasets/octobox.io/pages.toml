["https://octobox.io/documentation"]
title = "Octobox"
description = "Untangle your GitHub Notifications"
full_description = "Octobox helps you triage notifications efficiently so you can spend less time managing and more time getting things done. If you manage more than one active project on GitHub, you probably find GitHub Notifications pretty lacking. Notifications are marked as read and disappear from the list as soon as you load the page or view the email of the notification. This makes it very hard to keep on top of which notifications you still need to follow up on. Most open source maintainers (and some GitHub staff) end up using a complex combination of filters and labels in their mail client to manage their notifications from their inbox. If, like us, you try to avoid email, then Octobox is for you. This instance of Octobox is hosted by the Octobox.io team. To access Octobox.io you just need to sign in with your GitHub profile or install the GitHub app on the homepage. This will give you access to basic notification information for public and private repositories using GitHub's notification scope. To access more detailed information you need to install the Octobox.io GitHub App. To access more detailed information about your notifications (assignees, labels, conversations threads etc) Octobox.io needs more privileged access to your repositories. To enable this you need to install our GitHub App for your personal or organisation's account. Access to public repositories on Octobox.io is free forever, access to private repositories is a paid-for service. This may seem a little strange, but bear with us: As a social experiment in open source sustainability we are asking you to make a choice between supporting the community of maintainers and contributors, or supporting the commercial entity that operates Octobox.io. The service you'll receive will be exactly the same regardless of the way you pay. You can read more about why we think this is important over on our blog. Alternatively you can host your own instance of Octobox. See the installation guide for instructions and details regarding deployment to Heroku, Docker, and more."
year_published = 2025
clearnet = "https://octobox.io/documentation"
