["https://octobox.io/class_list.html"]
title = "Octobox"
description = "Untangle your GitHub Notifications"
full_description = '''You often wonder whether that issue you can't find was a figment of your imagination. You may even wake up in a cold sweat at the thought of hundreds of notifications landing in your inbox each morning. Many developers, and even some GitHub staff, use email filters to manage their notifications. If you'd prefer to stay away from email then Octobox is for you: Install the GitHub app to add live information on issue, PR, and CI status, labels, authors and more to your organisation's notifications: Octobox is free for open source projects with basic notifications for private projects. To add enhanced notifications for private repositories to your organisation's account: The Octobox team hosts a shared instance of Octobox at octobox.io, but perhaps you're looking to host your own or get yourself set up to contribute to Octobox? Fantastic! There are a number of install options available to you, check out the installation guide. Octobox is open source and the source code is hosted at GitHub. If you have an idea for a feature or enhancement, open an issue or a pull request. If you want to contribute you'll find we're a welcoming bunch. If you don't know where to start, take a look at the issues tagged as "Help Wanted". You can also help triage issues. This can include reproducing bug reports, or asking for vital information such as version numbers or reproduction instructions. If you would like to start triaging issues, one easy way to get started is to subscribe to Octobox on CodeTriage. Finally, if you would like to become a maintainer, we will consider adding you if you contribute frequently to the project. Feel free to ask. © 2021 Andrew Nesbitt, et al — Logo by Raeha Keller — Source available under AGPL 3.0 — Terms & Privacy Policy'''
year_published = 2025
