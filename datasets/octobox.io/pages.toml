["https://octobox.io/privacy"]
title = "Octobox"
description = "Untangle your GitHub Notifications"
full_description = "No, really, we actually do. But as a young, growing service provider it is necessary for Octobox.io to store some data. If we do so it will be for one of two reasons: We collect the e-mail addresses of those who sign up with Octobox.io, aggregate information on what pages users access or visit, and information volunteered by the consumer. We collect information about your GitHub notifications including some basic data about notifications from private repositories. If you install the GitHub App we collect more detailed data about these notifications including but not limitted to authors, labels, comments and status. If you enable private repository access then we collect this data for your private repositories too. Transmitting information over the Internet is generally not completely secure, and we can’t guarantee the security of your data. Your data is processed by servers in France and Ireland. Your data is stored on our servers in France, once it is stored we have processes in place to secure it. The information we collect is not shared with or sold to other organizations, except to provide products or services you have requested, with your permission, or under the following circumstances: Other than the above declarations we won’t share your information with any other organisations for marketing, market research or commercial purposes, and we don’t pass on your details to other websites. Like many other websites, we sometimes use cookies and third party tools to help us make our websites better. These tools are very common and widely used by other sites, but they do have privacy implications. When you visit sites that use these tools, you are potentially telling companies such as Google that you visited, as well as some information about how your web browser is configured. If you don’t want to share your browsing activities on sites with other companies, you can install opt-out browser plugins. You might find this article useful: The Guardian – How to Keep Your Privacy Online."
year_published = 2025
