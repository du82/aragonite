["https://octopress.org/docs/setup/rvm"]
title = "Installing Ruby with RVM - Octopress"
full_description = "Installing Ruby With RVM Jul 31st, 2012 RVM (Ruby Version Manager) handles the installation and management of multiple Ruby environments. Ruby 1.9.3 is required for Octopress and using RVM you can install it with ease. Install RVM Run the following command from your terminal. curl -L https://get.rvm.io | bash -s stable --ruby Be sure to follow any subsequent instructions as guided by the installation process. Install Ruby 1.9.3 Next install Ruby 1.9.3 and you'll be all set. rvm install 1.9.3 rvm use 1.9.3 rvm rubygems latest Run ruby --version to be sure you're using Ruby 1.9.3. If you're having trouble, seek help here. ← Return to setup"
