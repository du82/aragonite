["https://octopress.org/help"]
title = "Octopress Help - Octopress"
full_description = "Octopress Help Aug 2nd, 2011 Don't feel like reading the documentation? You've come to the right place! Actually no, please don't do that. If you have questions or problems I'm happy to help, but be sure you've read through some of these pages first. Getting Started - A Guide for installing Octopress and its dependencies. Configuring Octopress - This is important and easy. Be sure to give it a look. Blogging with Octopress - Learn how to create pages and posts. Deploying - A walkthrough for different deployment strategies. Getting/Giving Help If you have a question, or if you love helping others: Join the #Octopress IRC channel on irc.freenode.net. Search for an existing topic or start a new one describing your problem on Octopress's Google Group. Mention @Octopress on Twitter. Contributing If you want to help out, fork Octopress on Github and send me a pull request. This site is also open-source and if you find errors you can post issues or send me a pull request to the master branch. Please file all development issues on Octopress's main repository."
