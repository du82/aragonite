["https://octopress.org/2011/07/23/octopress-20-surfaces"]
title = "Octopress 2.0 Surfaces - Octopress"
full_description = "Octopress 2.0 Surfaces Jul 23rd, 2011 • Permalink Octopress is a framework designed by Brandon Mathis for Jekyll, the blog aware static site generator powering Github Pages. To start blogging with Jekyll, you have to write your own HTML templates, CSS, Javascripts and set up your configuration. But with Octopress All of that is already taken care of. Simply clone or fork Octopress, install dependencies and the theme, and you're set. What's new in 2.0? Short answer: Everything. Octopress is now based on mojombo/jekyll has been completely rewritten from the ground up with a mountain of goodies. Octopress comes with: A semantic HTML5 template A Mobile first responsive layout (rotate, or resize your browser and see) Built in 3rd party support for Twitter, Google Plus One, Disqus Comments, Pinboard, Delicious, and Google Analytics An easy deployment strategy using Github pages or Rsync Built in support for POW and Rack servers Easy theming with Compass and Sass A Beautiful Solarized syntax highlighting Be sure to check out the documentation to get the full scoop. Plugins FTW Most of these plugins have been created just for Octopress, but a few come from the Jekyll community along with improvements and updates. HTML5 Video Tag - easily post mp4 HTML5 video with flash player fallback Code Block - for easy inline code sharing Include Code - embed code from your filesystem Gist Tag - automatically downloads and embeds Github gists Image Tag - easily post images with class names and titles Render Partial - insert any file into another post or page Blockquote - generate beautiful, semantic block quotes Pullquote - generate CSS only pull quotes — no duplicate data, no javascript Category Generator - generates archive pages for each blog category For more plugins check out the plugin list Ready to Get Started? Octopress is really easy to set up and deploy, start here. For now that's it. Check out the docs, kick the tires, post issues, send me support requests, and tell all your friends. Oh, and if you like, follow @octopress and @imathis on Twitter. Posted by Brandon Mathis Updated Jul 24th, 2011 release Tweet Octopress 3.0 is coming »"
