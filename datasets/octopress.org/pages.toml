["https://octopress.org/docs/setup"]
title = "Octopress Setup - Octopress"
full_description = "Octopress Setup Jul 18th, 2011 First, I want to stress that Octopress is a blogging framework for hackers. You should be comfortable running shell commands and familiar with the basics of Git. If that sounds daunting, Octopress probably isn't for you. Before You Begin Install Git. Install Ruby 1.9.3 or greater using either rbenv or RVM. Install one of the ExecJS supported JavaScript runtimes. If ruby --version doesn't say you're using Ruby at least 1.9.3, revisit your rbenv or RVM installation. Setup Octopress git clone git://github.com/imathis/octopress.git octopress cd octopress Next, install dependencies. gem install bundler rbenv rehash # If you use rbenv, rehash to be able to run the bundle command bundle install Install the default Octopress theme. rake install Next Steps Set up deployment Configure your blog Start blogging with Octopress"
author = "Brandon Mathis"
year_published = 2011
