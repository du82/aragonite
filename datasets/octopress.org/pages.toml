["https://octopress.org/docs/plugins/gist-tag"]
title = "Gist Tag - Octopress"
full_description = "Gist Tag Jul 22nd, 2011 All you need is the gist's id and you can easily embed it in your page. This actually downloads a cache of the gist and embeds it in a <noscript> tag for RSS readers and search engines, while still using Github's javascript gist embed code for browsers. Syntax {% gist gist_id [filename] %} Example {% gist 4321346 %} <pre><code>@@ -590,7 +590,7 @@ class SpritesTest &lt; Test::Unit::TestCase it &quot;should generate a sprite from nested folders&quot; do css = render &lt;&lt;-SCSS - @import &quot;nested/*.png&quot;; + @import &quot;nested/**/*.png&quot;; @include all-nested-sprites; SCSS assert_correct css, &lt;&lt;-CSS</code></pre> If you want syntax highlighting (for a supported language), specify the filename (with extension): {% gist 4321346 gistfile1.diff %} <pre><code>@@ -590,7 +590,7 @@ class SpritesTest &lt; Test::Unit::TestCase it &quot;should generate a sprite from nested folders&quot; do css = render &lt;&lt;-SCSS - @import &quot;nested/*.png&quot;; + @import &quot;nested/**/*.png&quot;; @include all-nested-sprites; SCSS assert_correct css, &lt;&lt;-CSS</code></pre> If you have a gist with multiple files, you can include files one at a time by adding the name after the gist id. {% gist 1059334 svg_bullets.rb %} {% gist 1059334 usage.scss %} This plugin was initially developed by Brandon Tilly for Jekyll blogs."
