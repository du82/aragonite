["https://ocw.mit.edu/educator"]
title = "Educator | MIT OpenCourseWare | Free Online Course Materials"
description = "MIT OpenCourseWare is a web based publication of virtually all MIT course content. OCW is open and available to the world and is a permanent MIT activity"
full_description = "MIT OpenCourseWare shares content under a Creative Commons license. You are welcome to retain, reuse, and adapt the teaching materials you find on our platforms. Open educational resources are made more powerful by the instructors who enhance them through adaptations for learners in different contexts. When you share your adaptations of OER from MIT OpenCourseWare, you create more opportunities for learners to unlock knowledge for themselves and their communities. We’re especially interested in helping you share your culturally relevant adaptations. Together, we can create a more inclusive open educational ecosystem. Share my adaptation or open education story on the Chalk Radio podcast by emailing chalkradio@mit.edu In addition to openly sharing teaching materials on MIT OpenCourseWare, many MIT faculty also engage in open reflective practice, making their praxis accessible by educators, everywhere, in an effort to enhance the use and impact of the OER they share. Browse faculty interviews to explore how they approach teaching and learning, and how they taught on campus with the materials they share on MIT OpenCourseWare. Use their insights to inform your use of the OER you find on our platforms or to spark conversations about teaching and learning at your own institution. Like other content on MIT OpenCourseWare, the instructor interviews you’ll find on our platforms are shared under a Creative Commons license, so you can retain, re-use, and re-mix them in your own work. We invite you to connect with the MIT teaching community. Open education practice improves when teaching materials reflect a diversity of voices and experiences, and we welcome yours. We invite you to share your instructional ideas and approaches with MIT faculty. When you share your teaching insights, you’ll inspire new ways of thinking and learning in MIT classrooms, which will in turn enhance the OER we offer learners around the world. Sign up for the MIT Teaching + Learning Lab Newsletter to stay current on teaching topics important to the MIT community"
