["https://ocw.mit.edu/pages/why-give"]
title = "Why Give? | MIT OpenCourseWare | Free Online Course Materials"
description = "OCW would not be possible without the support of thousands of individuals who donate each year. Your gift ensures we can keep OCW growing with new courses and more rich resources."
full_description = "Since our founding in 2001, MIT OpenCourseWare has been guided by a revolutionary mission to openly share educational resources from MIT with the world. The site presents the core academic content — including lecture notes, syllabi, assignments, and exams — from nearly all of MIT’s undergraduate and graduate curricula. All content is offered freely and openly to support formal and informal learning around the world, whenever learners need them. Many of the site’s 2,600+ courses also include rich media resources such as video lectures, faculty podcasts, and inspiring examples of student work. Over twenty years in, our commitment to deliver on this mission continues as we work on more accessible, collaborative, and resilient ways of sharing resources and knowledge for the future. OCW has inspired a worldwide movement that now includes hundreds of universities sharing materials from more than ten thousand courses and has touched the lives of millions. Just as OCW would not be possible without the generosity of the MIT faculty sharing their course materials and methods, OCW would not be possible without the support of thousands of individuals who donate each year. Your gift ensures we can keep OCW growing with new courses and more of the rich resources — from video to podcasts — that make a difference for so many worldwide. Support OCW with a gift today. No one better captures the impact OCW has on the world than the thousands of learners who use OCW each day, a vibrant community of university and high school students, educators, and independent and lifelong learners from all over the world. To hear their stories, we invite you to read a compilation of some of the inspirational feedback we’ve received over the years. We’ve created a 20th edition of the OCW Book of Impact that recognizes this milestone. MIT OpenCourseWare is an online publication of materials from over 2,500 MIT courses, freely sharing knowledge with learners and educators around the world. Learn more"
