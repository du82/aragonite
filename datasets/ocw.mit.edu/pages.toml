e day it’s the same content.” For her graduation thesis, Eldouma did a project on disaster response and management in complex contexts, because at the time, Sudan was suffering from heavy floods and the country had limited resources to respond. “That’s when I realized I really love data, and I wanted to explore that more,” she says. While Eldouma loves math, she always wanted to find ways to use it for good. Through the early exposure to data science and statistical methods at her university, she saw how data science leverages math for real-world impact. After graduation, she took a job at the DAL Group, the largest Sudanese conglomerate, where she helped to incorporate data science and new technologies to automate processes within the company. When civil war erupted in Sudan in April 2023, life as Eldouma knew it was turned upside down, and her family was forced to make the difficult choice to relocate to Egypt. Purpose in adversity Soon after relocating to Egypt, Eldouma lost her job and found herself struggling to find purpose in the life circumstances she had been handed. Due to visa restrictions, challenges getting right-to-work permits, and a complicated employment market in Egypt, she was also unable to find a new job. “I was sort of in a depressive episode, because of all that was happening,” she reflects. “It just hit me that I lost everything that I know, everything that I love. I’m in a new country. I need to start from scratch.” Around this time, a friend who knew Eldouma was curious about data science sent her the link to apply to the MIT Emerging Talent Certificate in Data and Computer Science. With less than 24 hours before the application deadline, Eldouma hit “Submit.” Finding community and joy through learning Part of MIT Open Learning, MIT Emerging Talent at the MIT Jameel World Education Lab (J-WEL) develops global education programs that target the needs of talented individuals from challenging economic and social circumstances by equipping them