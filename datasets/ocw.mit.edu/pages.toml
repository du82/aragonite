["https://ocw.mit.edu/stories/do%C4%9Fa-k%C3%BCrk%C3%A7%C3%BCo%C4%9Flu"]
title = "Doğa Kürkçüoğlu | MIT OpenCourseWare | Free Online Course Materials"
description = "MIT OpenCourseWare is a web based publication of virtually all MIT course content. OCW is open and available to the world and is a permanent MIT activity"
full_description = "Turning adversity into opportunity How a love for math and access to MIT Open Learning’s online learning resources helped a Sudanese learner pursue a career in data science. Carolyn Tiernan | MIT Open Learning Sujood Eldouma always knew she loved math; she just didn’t know how to use it for good in the world. But after a personal and educational journey that took her from Sudan to Cairo to London, all while leveraging MIT Open Learning’s online educational resources, she finally knows the answer: data science. An early love of data Eldouma grew up in Omdurman, Sudan, with her parents and siblings. She always had an affinity for STEM subjects, and at the University of Khartoum she majored in electrical and electronic engineering with a focus in control and instrumentation engineering. In her second year at university, Eldouma struggled with her first coding courses in C++ and C#, which are general-purpose programming languages. When a teaching assistant introduced Eldouma and her classmates to MIT OpenCourseWare for additional support, she promptly worked through OpenCourseWare’s C++ and C courses in tandem with her in-person classes. This began Eldouma’s ongoing connection with the open educational resources available through MIT Open Learning. OpenCourseWare, part of MIT Open Learning, offers a free collection of materials from thousands of MIT courses, spanning the entire curriculum. To date, Eldouma has explored over 20 OpenCourseWare courses, and she says it is a resource she returns to regularly. Sujood from Sudan: An Open Learner&rsquo;s Story Video: MIT OpenCourseWare. Listen to the interview here. “We started watching the videos and reading the materials, and it made our lives easier,” says Eldouma. “I took many OpenCourseWare courses in parallel with my classes throughout my undergrad, because we still did the same material. OpenCourseWare courses are structured differently and have different resources and textbooks, but at the end of the day it’s the same content.” For her graduation thesis, Eldouma did a project on disaster response and management in complex contexts, because at the time, Sudan was suffering from heavy floods and the country had limited resources to respond. “That’s when I realized I really love data, and I wanted to explore that more,” she says. While Eldouma loves math, she always wanted to find ways to use it for good. Through the early exposure to data science and statistical methods at her university, she saw how data science leverages math for real-world impact. After graduation, she took a job at the DAL Group, the largest Sudanese conglomerate, where she helped to incorporate data science and new technologies to automate processes within the company. When civil war erupted in Sudan in April 2023, life as Eldouma knew it was turned upside down, and her family was forced to make the difficult choice to relocate to Egypt. Purpose in adversity Soon after relocating to Egypt, Eldouma lost her job and found herself struggling to find purpose in the life circumstances she had been handed. Due to visa restrictions, challenges getting right-to-work permits, and a complicated employment market in Egypt, she was also unable to find a new job. “I was sort of in a depressive episode, because of all that was happening,” she reflects. “It just hit me that I lost everything that I know, everything that I love. I’m in a new country. I need to start from scratch.” Around this time, a friend who knew Eldouma was curious about data science sent her the link to apply to the MIT Emerging Talent Certificate in Data and Computer Science. With less than 24 hours before the application deadline, Eldouma hit “Submit.” Finding community and joy through learning Part of MIT Open Learning, MIT Emerging Talent at the MIT Jameel World Education Lab (J-WEL) develops global education programs that target the needs of talented individuals from challenging economic and social circumstances by equipping them with the knowledge and tools to advance their education and careers. The Certificate in Computer and Data Science is a year-long online learning program that follows an agile continuous education model. It incorporates computer science and data analysis coursework from MITx, professional skill building, experiential learning, apprenticeship options, and opportunities for networking with MIT’s global community. The program is targeted toward refugees, migrants, and first-generation low-income students from historically marginalized backgrounds and underserved communities worldwide. Although Eldouma had used data science in her role at the DAL Group, she was happy to have a proper introduction to the field and to find joy in learning again. She also found community, support, and inspiration from her classmates who were connected to each other not just by their academic pursuits, but by their shared life challenges. The cohort of 100 students stayed in close contact through the program, both for casual conversation and for group work. “In the final step of the Emerging Talent program, learners apply their computer and data knowledge in an experiential learning opportunity,” says Megan Mitchell, associate director for Pathways for Talent and acting director of J-WEL. “The experiential learning opportunity takes the form of an internship, apprenticeship, or an independent or collaborative project, and allows students to apply their knowledge in real-world settings and build practical skills.” Determined to apply her newly acquired knowledge in a meaningful way, Eldouma and fellow displaced Sudanese classmates designed a project to help solve a problem in their home country. The group identified access to education as a major problem facing Sudanese people, with schooling disrupted due to the conflict. Focusing on the higher education audience, the group partnered with community platform Nas Al Sudan to create a centralized database where students can search for scholarships and other opportunities to continue their education. Eldouma completed the MIT Emerging Talent program in June 2024 with a clear vision to pursue a career in data science, and the confidence to achieve that goal. In fact, she had already taken the steps to get there: halfway through the certificate program, she applied and was accepted to the MITx MicroMasters program in Statistics and Data Science at Open Learning and the London School of Economics (LSE) Masters of Science in Data Science. In January 2024, Eldouma started the MicroMasters program with 12 of her Emerging Talent peers. While the MIT Emerging Talent program is focused on undergraduate-level, introductory computer and data science material, the MicroMasters program in Statistics and Data Science is graduate-level learning. MicroMasters programs are a series of courses that provide deep learning in a specific career field, and learners that successfully earn the credential may receive academic credit to universities around the world. This makes the credential a pathway to over 50 master’s degree programs and other advanced degrees, including at MIT. Eldouma believes that her experience in the MicroMasters courses prepared her well for the expectations of the LSE program. After finishing the MicroMasters and LSE programs, Eldouma aspires to a career using data science to better understand what is happening on the African continent from an economic and social point of view. She hopes to contribute to solutions to conflicts across the region. And, someday, she hopes to move back to Sudan. “My family’s roots are there. I have memories there,” she says. “I miss walking in the street and the background noise is the same language that I am thinking in. I don’t think I will ever find that in any place like Sudan.”"
year_published = 2025
