hips and other opportunities to continue their education. Eldouma completed the MIT Emerging Talent program in June 2024 with a clear vision to pursue a career in data science, and the confidence to achieve that goal. In fact, she had already taken the steps to get there: halfway through the certificate program, she applied and was accepted to the MITx MicroMasters program in Statistics and Data Science at Open Learning and the London School of Economics (LSE) Masters of Science in Data Science. In January 2024, Eldouma started the MicroMasters program with 12 of her Emerging Talent peers. While the MIT Emerging Talent program is focused on undergraduate-level, introductory computer and data science material, the MicroMasters program in Statistics and Data Science is graduate-level learning. MicroMasters programs are a series of courses that provide deep learning in a specific career field, and learners that successfully earn the credential may receive academic credit to universities around the world. This makes the credential a pathway to over 50 master’s degree programs and other advanced degrees, including at MIT. Eldouma believes that her experience in the MicroMasters courses prepared her well for the expectations of the LSE program. After finishing the MicroMasters and LSE programs, Eldouma aspires to a career using data science to better understand what is happening on the African continent from an economic and social point of view. She hopes to contribute to solutions to conflicts across the region. And, someday, she hopes to move back to Sudan. “My family’s roots are there. I have memories there,” she says. “I miss walking in the street and the background noise is the same language that I am thinking in. I don’t think I will ever find that in any place like Sudan.”"
