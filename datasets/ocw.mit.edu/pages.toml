["https://ocw.mit.edu/pages/get-started"]
title = "Get Started | MIT OpenCourseWare | Free Online Course Materials"
description = "This page provides users with information about OCW and how to utilize the site."
full_description = "OCW is a free and open publication of material from thousands of MIT courses across the entire MIT curriculum. That’s courses from every MIT department and degree program, and ranging from the introductory to the most advanced graduate level. Each OCW course includes a syllabus, some instructional material (such as lecture notes or a reading list), and some learning activities (such as assignments or exams). Many courses also have complete video lectures, free online textbooks, and faculty teaching insights. While some OCW content is custom-created for online use, most of it comes straight from the MIT classroom. You can freely browse the OCW collection and use it at your own pace. There’s no signup, no enrollment, and no start or end dates. MIT doesn’t offer credit or certificates for using OCW. Instead, use OCW to guide your own life-long learning, or use OCW to teach others. Knowledge is your reward! OCW is made for sharing. Download and save files and complete courses for later. Send them to friends and colleagues. Modify or remix OCW content for any non-commercial use – just remember to credit OCW as the source. It’s all allowed and encouraged, per the terms of our Creative Commons license. The free materials on OCW are used by educators around the world in teaching, adapted and integrated into curricula that inspires and empowers learners. And by sharing MIT faculty’s teaching approaches with the world, OCW is also a setting for reflective dialog about the craft of teaching and using Open Educational Resources (OER). We encourage you to start by exploring OCW’s Educator page which highlights content created and curated just for educators. When you find a course of interest, begin by skimming the syllabus and calendar. This tells you the course goals, key topics, and the sequence of what is taught and studied. It’s up to you to decide what and how you’d like to learn. Study the materials in a course from beginning to end, or select individual concepts found in different courses. You can let your curiosity be your guide, or refer to About the MIT Curriculum to learn about degree requirements and course sequences used by MIT students."
