full_description = "Turning adversity into opportunity How a love for math and access to MIT Open Learning’s online learning resources helped a Sudanese learner pursue a career in data science. Carolyn Tiernan | MIT Open Learning Sujood Eldouma always knew she loved math; she just didn’t know how to use it for good in the world. But after a personal and educational journey that took her from Sudan to Cairo to London, all while leveraging MIT Open Learning’s online educational resources, she finally knows the answer: data science. An early love of data Eldouma grew up in Omdurman, Sudan, with her parents and siblings. She always had an affinity for STEM subjects, and at the University of Khartoum she majored in electrical and electronic engineering with a focus in control and instrumentation engineering. In her second year at university, Eldouma struggled with her first coding courses in C++ and C#, which are general-purpose programming languages. When a teaching assistant introduced Eldouma and her classmates to MIT OpenCourseWare for additional support, she promptly worked through OpenCourseWare’s C++ and C courses in tandem with her in-person classes. This began Eldouma’s ongoing connection with the open educational resources available through MIT Open Learning. OpenCourseWare, part of MIT Open Learning, offers a free collection of materials from thousands of MIT courses, spanning the entire curriculum. To date, Eldouma has explored over 20 OpenCourseWare courses, and she says it is a resource she returns to regularly. Sujood from Sudan: An Open Learner&rsquo;s Story Video: MIT OpenCourseWare. Listen to the interview here. “We started watching the videos and reading the materials, and it made our lives easier,” says Eldouma. “I took many OpenCourseWare courses in parallel with my classes throughout my undergrad, because we still did the same material. OpenCourseWare courses are structured differently and have different resources and textbooks, but at the end of the day it’s the same content.” For her graduation thesis, Eldouma did a project on disaster response and management in complex contexts, because at the time, Sudan was suffering from heavy floods and the country had limited resources to respond. “That’s when I realized I really love data, and I wanted to explore that more,” she says. While Eldouma loves math, she always wanted to find ways to use it for good. Through the early exposure to data science and statistical methods at her university, she saw how data science leverages math for real-world impact. After graduation, she took a job at the DAL Group, the largest Sudanese conglomerate, where she helped to incorporate data science and new technologies to automate processes within the company. When civil war erupted in Sudan in April 2023, life as Eldouma knew it was turned upside down, and her family was forced to make the difficult choice to relocate to Egypt. Purpose in adversity Soon after relocating to Egypt, Eldouma lost her job and found herself struggling to find purpose in the life circumstances she had been handed. Due to visa restrictions, challenges getting right-to-work permits, and a complicated employment market in Egypt, she was also unable to find a new job. “I was sort of in a depressive episode, because of all that was happening,” she reflects. “It just hit me that I lost everything that I know, everything that I love. I’m in a new country. I need to start from scratch.” Around this time, a friend who knew Eldouma was curious about data science sent her the link to apply to the MIT Emerging Talent Certificate in Data and Computer Science. With less than 24 hours before the application deadline, Eldouma hit “Submit.” Finding community and joy through learning Part of MIT Open Learning, MIT Emerging Talent at the MIT Jameel World Education Lab (J-WEL) develops global education programs that target the needs of talented individuals from challenging economic and social circumstances by equipping them