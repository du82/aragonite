["https://ocw.mit.edu/courses/21g-010-introduction-to-european-and-latin-american-fiction-fall-2006"]
title = "Introduction to European and Latin American Fiction | Global Studies and Languages | MIT OpenCourseWare"
description = "This subject serves as a broad introduction to the field of European and Latin American fiction. It is taught in an historical manner—beginning with the first picaresque novel, _Lazarillo de Tormes_, and ending with contemporary European fiction. It is designed to help students acquire a general understanding of major fictional modes-from 18th century epistolary fiction, _Liaisons dangereuses_, to 20th century avant-garde fiction: _Cosmicomicsi_ and _Aura_. Attention is paid not only to the literary movements these works represent, but also to the subtle interplay of history, geography, language and cultural norms that gave rise to specific literary forms. While the reading load is heavy, the books are compelling."
