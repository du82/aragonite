["https://ocw.mit.edu/courses/21h-165-modern-african-history-spring-2019"]
title = "Modern African History | History | MIT OpenCourseWare"
description = "This course surveys the history of 19th and 20th century Africa. It focuses on the European conquest of Africa and the dynamics of colonial rule, especially its socioeconomic and cultural consequences. It looks at how the rising tide of African nationalism, in the form of labor strikes and guerrilla wars, ushered out colonialism. It also examines the postcolonial states, focusing on the politics of development, recent civil wars in countries like Rwanda and Liberia, the AIDS epidemic, and the history of apartheid in South Africa up to 1994. Finally, it surveys the entrepreneurship in the post-colonial period and China's recent involvement in Africa."
