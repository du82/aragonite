["https://ocw.mit.edu/about"]
title = "About Us | MIT OpenCourseWare | Free Online Course Materials"
description = "MIT OpenCourseWare is a web based publication of virtually all MIT course content. OCW is open and available to the world and is a permanent MIT activity"
full_description = '''MIT OpenCourseWare is a free and open collection of material from thousands of MIT courses, covering the entire MIT curriculum. Knowledge is your reward. Use OCW to guide your own life-long learning, or to teach others. MIT does not offer credit or certification to users of OCW – and asks for nothing in return. No enrollment or registration. Freely browse and use OCW materials at your own pace. There's no signup, and no start or end dates. Made for sharing. Download files for later. Send to friends and colleagues. Modify, remix, and reuse (just remember to cite OCW as the source.) More emerging knowledge about the world’s biggest challenges, such as improving equity, tackling climate change, and building the future of computing and artificial intelligence. More dynamic media like video lectures, podcasts, interactive assessments, and new forms like augmented and virtual reality. More inspiring examples of MIT's "mind, hand, and heart" approach that deeply engages learners and teachers in real-world problems. More support for educators teaching with Open Educational Resources (OER), adapting and remixing OCW content to maximize cultural relevance for their students. More collaborations across the OER ecosystem, working together to advance educational equity through open content and practices. While OCW is most known for free course materials, there’s more to OCW than just syllabi, lecture videos, notes and problem assignments from MIT classes. The OCW Educator project shares teaching inspirations from MIT faculty for colleagues at the Institute and around the world. Many OCW courses include an “Instructor Insights” section for practicing teachers, covering topics such as course design, active learning methods, and strategies to engage learners. Listen to OCW wherever you go. On this podcast, meet the instructors behind some of MIT’s most interesting courses, from nuclear physics to film appreciation to ethical responsibilities of computing. OCW includes a growing collection of free open textbooks, perfect for educators to use and adapt in their teaching, and for all learners to guide their studies.'''
year_published = 2025
