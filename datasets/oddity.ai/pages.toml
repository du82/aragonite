["https://oddity.ai/nl/blog/watchful-ai-privacy-and-bias"]
title = "Het Alziende Algoritme: Privacy en Bias in Computer Vision - Oddity.ai"
description = "Oddity realiseert de toekomst van veiligheid door misdaad op te sporen in live videobeelden. Onze technologie integreert met bestaande software in cameratoezichtruimtes en wordt gebruikt door gemeentes, politieafdelingen en private beveiligingsbedrijven."
full_description = '''In onze hedendaagse maatschappij ontstijgt het aantal bewakingscamera's het aantal patrouillerende politieagenten. Naarmate het gebruik van kunstmatige intelligentie (AI) op bewakingscamera's toeneemt, wordt de rol ervan in de openbare veiligheid steeds belangrijker. Technologieën in computer vision, die computers in staat stellen om visuele gegevens te interpreteren, bieden aanzienlijke mogelijkheden voor het bestrijden van criminaliteit en het garanderen van openbare veiligheid. Dergelijke technologieën worden gezien als een tweesnijdend zwaard, het heeft zowel de belofte van verbeterde veiligheid en levenskwaliteit, maar ook de mogelijkheid tot een dystopische maatschappij van massasurveillance. Oddity's missie is het gebruik van computer vision als een kracht voor het goede, met als doel de publieke veiligheid te verhogen zonder privacy daarvoor op te moeten offeren. Er zijn hierbij twee belangrijke aspecten waar rekening mee gehouden moet worden om een juist gebruik van AI bij publieke surveillance te garanderen: Belangrijk bij vooroordelen is het "black box" principe en het belang van verklaarbare AI. De black box verwijst naar een situatie waarin het besluitvormingsproces van een AI-systeem verborgen is en niet (gemakkelijk) te begrijpen voor mensen. Dit kan leiden tot problemen bij het begrijpen, vertrouwen en valideren van de beslissingen van de AI. Als we de interne werking van een AI-systeem niet kunnen controleren, zal het moeilijk zijn om uit te sluiten dat een AI-systeem geen ongewenste vooroordelen heeft. Het begrijpen van privacy en vooroordelen is niet alleen een technologische uitdaging, maar ook een maatschappelijke noodzaak. Bij het ontwikkelen van computervisie systemen moeten we zeer voorzichtig te werk gaan en ervoor zorgen dat ze zo zijn ontworpen dat misbruik zoveel mogelijk wordt beperkt. In deze blogpost verkennen we de standpunten van de Europese Unie en de Nederlandse overheid met betrekking tot privacy en bias en AI. Daarna geven we een overzicht van hoe Oddity.ai aansluit bij deze regelgeving en standaarden. We gaan in op onze proactieve maatregelen en het interne beleid dat we hebben geïmplementeerd om ervoor te zorgen dat onze AI-systemen de privacy waarborgen en vooroordelen beperken, waardoor onze toewijding aan ethische AI-ontwikkeling wordt versterkt.'''
author = "Oddity.ai B.V."
year_published = 2025
