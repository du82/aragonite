["https://oddity.ai/blog/the-startup-toolkit"]
title = "The Startup Toolkit - Oddity.ai"
description = "Oddity is developing the future of safety by detecting high impact crimes on live video footage. Our algorithms seamlessly integrates with existing software in security centers and is trusted by municipalities, law enforcement and private security companies."
full_description = "In my previous article I explained the importance of finding the problem-solution fit, and showed some parts of our go-to-market (GTM) approach. A multiple-case study with 12 founders of software startups located in The Netherlands, taught us that some aspects of the GTM approach are of significant value. We explain these industry lessons in this chapter, for which we coined the term The Startup Toolkit. The toolkit explains the six most important elements a startup should take into account to achieve the problem-solution fit and product-market fit. This article, or white paper, partly overlaps with my previous one, but it also explains new insights. We hope to aid (future) entrepreneurs by presenting these results. “Some inventions are solutions that are unrecognised by potential customers as solving a certain problem, a classic example being Facebook.” Do not focus on the technology first, assess whether the problem is, in fact, a customer problem by talking to potential customers. Numerous startups overlook this aspect, but the multiple-case study proved that this is the first thing that startups should do. Contemporary literature shows that after building the MVP, you should measure and test it with customers, for instance, via the Build-Measure-Learn (BML) Loop. However, this implies that startups should first build something while they could have learned beforehand if there exists a customer problem that demands to be solved. One pitfall, especially for innovative startups, should be noted: some inventions are solutions that are unrecognised by potential customers as solving a certain problem, a classic example being Facebook. In that case, it is better to work with an MVP to test your hypothesised solution. Other than that, the startup should talk with potential customers and attempt to understand their problems as thoroughly and early as possible. This understanding of the customer problem is paramount for the subsequently devised solution, which should be a prototype as MVP. The Design Thinking strategy has proven to be a suitable strategy for this purpose. However, the Value Proposition Design also provides practical techniques that can be applied by startups. For instance, it shows how to make a customer profile with customer jobs, which can aid in finding the right customers. This also helps in finding the ‘best’ market segment, which relates to another vital aspect of this toolkit"
author = "Oddity.ai B.V."
year_published = 2025
clearnet = "https://oddity.ai/blog/the-startup-toolkit"
