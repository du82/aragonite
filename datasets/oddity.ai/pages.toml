["https://oddity.ai/blog/the-base-rate-fallacy"]
title = "The Base Rate Fallacy - Oddity.ai"
description = "Oddity is developing the future of safety by detecting high impact crimes on live video footage. Our algorithms seamlessly integrates with existing software in security centers and is trusted by municipalities, law enforcement and private security companies."
full_description = "When talking about Oddity’s violence recognition system, we are often asked what the accuracy of our algorithm is. This seems like an easy enough question, but while answering it, we quickly run into trouble. To explain why, we need to look into a concept known within statistics as the Base Rate Fallacy. In general, the Base Rate Fallacy concerns a psychological effect that clouds peoples’ judgement when presented with certain statistics. In the most general sense, the fallacy describes how people often focus on a more specific case, rather than the larger picture. To make this more concrete, we will be looking at the most common type of this fallacy: the False Positive Paradox. The False Positive Paradox occurs when the incidence of a specific case within a large body of data is particularly low. In the case of violence recognition, this paradox is omnipresent. This is due to the fact that violence, especially in the case of video surveillance, is actually extremely rare. This is especially true from the perspective of a computer system. “Extremely” might even be an understatement. Let’s look at the incidence (i.e. how often something happens) of violence from a computer systems’ point of view to see why. To detect violence, the computer studies each frame it receives from a security camera and produces a confidence level between 0% and 100%. The higher the confidence, the more certain our algorithm is that violence is present in that particular frame. Let’s assume that the computer system does not look at each single frame, but combines them into batches of 16 frames. A confidence level is produced for each batch. Most security cameras produce 30 frames per second. So each batch covers around half a second of video footage. When the confidence level rises above a certain threshold, the system assumes there must be violence and sends out an alert. Now, let’s take a look at how often violence occurs within view of the cameras. I will focus on the results of a recent pilot we did that took place on a busy street with plenty of night clubs. Oddity’s algorithm was tested there on a small stretch covered by two cameras. Even though the location is a so-called “high-risk area”, only 3 violent incidents occurred over a period of 3 months (which is a good thing!). This data was confirmed by local law enforcement. We can quickly calculate that the incidence rate of violence is about 0.5 incidents per camera per month, which translates to around 1.5 seconds of violent footage. Now, we can calculate the incidence rate in terms of number of “batches” that contain violence, like the computer sees it:"
author = "Oddity.ai B.V."
year_published = 2025
clearnet = "https://oddity.ai/blog/the-base-rate-fallacy"
