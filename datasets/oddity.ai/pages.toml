["https://oddity.ai/nl/product"]
title = "Products - Oddity.ai"
description = "Oddity realiseert de toekomst van veiligheid door misdaad op te sporen in live videobeelden. Onze technologie integreert met bestaande software in cameratoezichtruimtes en wordt gebruikt door gemeentes, politieafdelingen en private beveiligingsbedrijven."
full_description = "Oddity verbetert de effectiviteit en efficiëntie van uw cameratoezicht. Met slim cameratoezicht maken we steden, gesloten inrichtingen, gevangenissen, openbaar vervoer en zorginstellingen veiliger dan ooit. Onze software integreert met de huidige infrastructuur, we herkennen geweld in gevangenissen en beveiligen hun perimeter. Lees onze casus hieronder om meer te leren over de ervaringen van een Nederlandse gevangenis. Wij herkennen geweld in verschillende steden en kunnen direct integreren met het huidige video management systeem. Geweld wordt direct herkend en beveiligingspersoneel geattendeerd om snel op incidenten te reageren. Medewerkers in de gezondsheidszorg krijgen steeds meer te maken met geweldsincidenten Zowel in reguliere als ggz-instellingen passen wij real-time detectie toe, om de veiligheid te vergroten. Geweld in het openbaar vervoer is een groeiend, hardnekkig probleem. Door geweldsdetectie toe te passen op bestaande CCTV camerasystemen, beveiligen wij stations en rijdend vervoer. Heb je al een prototype model ontwikkeld, maar geen productieklaar systeem? Oddity heeft een eigen deep learning inference platform ontwikkeld dat met elk type model werkt. Oddity's engine is speciaal ontwikkelt voor het in productie brengen van real-time on-premise AI. Altijd automatisch zelflerend. Onze algoritmes zijn gebaseerd op deep learning en worden slimmer hoe meer ze zien. Gebouwd op de nieuwste wetenschappelijke inzichten. Onze gedragsanalyse technieken zijn ontwikkeld op een onderzoeksuniversiteit. Onze gedragsanalyse technieken zijn 100% anoniem. We doen geen gezichtsherkenning, tracking of identiteitsbepaling. Een nieuwe generatie supersnelle computerchips kan miljarden berekeningen per seconde doen. Oddity gebruikt deze hardware om meer dan 200 camera's in real-time te analyseren op één server."
