["https://oddity.ai/nl/about"]
title = "About - Oddity.ai"
description = "Oddity realiseert de toekomst van veiligheid door misdaad op te sporen in live videobeelden. Onze technologie integreert met bestaande software in cameratoezichtruimtes en wordt gebruikt door gemeentes, politieafdelingen en private beveiligingsbedrijven."
full_description = "We zijn een jong, innovatief en ambitieus bedrijf. Door een combinatie van de wetenschappelijke aanpak, een passie voor veiligheid en een gemotiveerd team maken wij de wereld een betere plek. Rob is co-founder en CEO van Channable, een snelgroeiende scale-up in Nederland. Rob deelt zijn kennis en ervaring van het schalen van business met Oddity. Roeland Staal is een bekende naam in de Nederlandse veiligheidswereld. Hij heeft meer dan 40 jaar ervaring bij Bosch en ondersteunt nu Oddity.ai. Peter werd in 2009 benoemd als hoofddirecteur van de Dienst Justitiële Inrichtingen (DJI). Daarnaast is hij meer dan 10 jaar president geweest van de International Corrections and Prison Association (ICPA). Benno is sinds het begin aan Oddity verbonden als strategisch adviseur. Hij heeft ervaring als succesvolle ondernemer en directeur van een multinational. Ronald is een computer vision onderzoeker en is gespecialiseerd in gedragingen. Zijn kennis van zaken heeft bijgedragen aan de unieke werking van ons algoritme. Slinger heeft als assistent professor aan de Universiteit Utrecht een vitale rol gespeeld bij de totstandkoming van Oddity en adviseert meerdere tech-bedrijven."
