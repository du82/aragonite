["https://oddity.ai/nl/blog/stratumseind-pilot"]
title = "The Stratumseind Pilot - Oddity.ai"
description = "Oddity realiseert de toekomst van veiligheid door misdaad op te sporen in live videobeelden. Onze technologie integreert met bestaande software in cameratoezichtruimtes en wordt gebruikt door gemeentes, politieafdelingen en private beveiligingsbedrijven."
full_description = "It has been six months since the start of our first pilot in Stratumseind, Eindhoven. Hence it’s time to write about our expectations, experiences, results, and outlooks. We’ve performed this pilot in collaboration with Axis Communications and the municipality of Eindhoven. This blogpost briefly discusses the results from this pilot and lays out our plan for the future. Stratumseind is the longest nightlife street in The Netherlands, with more than 50 bars. The types of these bars vary, but generally, the party-audience visiting these bars is quite young. On weekends, most bars are open until 4:00 am, on weekdays, they close at around 2:00 am. Conveniently, this is also where the Living Lab Stratumseind is located: a testbed where all kinds of new technologies, usually based on sensors, are applied in real-life. The Livings Labs currently hosts a number of experiment including decreasing human aggression through adjusting lighting, sound analysis algorithms that can detect things like breaking glass, and adjusting behavior through releasing specific odours. The Livings Labs focuses on decreasing violence through various measures. Stratumseind is known for having a relatively high occurrence of violence, in part due to high levels of alcohol consumption. As such, Stratumseind provides for an excellent testbed for Oddity’s violence detection algorithm. We were allowed to surveil three cameras, which were placed for this pilot on ‘hotspots’ of Stratumseind, as depicted in the picture above. The first camera is placed near the church, marking the beginning of the street. Camera 2 and 3 are placed give or take 100 meters up ahead. They are on top of each other, facing the opposite direction and surveilling the busiest part of the street. If you visit the street, you will also notice that these cameras cover the usually crowded area of Stratumseind. Existing data of violence within the area shows that this part of Stratumseind sees most violence. We finished our setup in August and have now been monitoring and analyzing footage for six months. During that time we analyzed over 8000 hours of video footage (more than 850 million frames!). We detected a number of violent incidents (a few of which were quite serious). The most important results (as of January 1st 2020) are:"
author = "Oddity.ai B.V."
year_published = 2025
clearnet = "https://oddity.ai/nl/blog/stratumseind-pilot"
