["https://oddity.ai/nl/blog/open-source-video-and-rtsp"]
title = "Open Sourcing our RTSP Server and video-rs - Oddity.ai"
description = "Oddity realiseert de toekomst van veiligheid door misdaad op te sporen in live videobeelden. Onze technologie integreert met bestaande software in cameratoezichtruimtes en wordt gebruikt door gemeentes, politieafdelingen en private beveiligingsbedrijven."
full_description = '''We are proud to announce that we have decided to open source two formerly internal Oddity projects that help us read, process and distribute video streams. Today, we're open sourcing a Rust library called video-rs that can read, write, encode and decode video. video-rs is built on top of ffmpeg. The library is currently focused on real-time video applications, but we intend to grow it into a more generic video library. One project we have been using internally already uses video-rs: Oddity's RTSP server. RTSP is a protocol that is at the heart of all video surveillance. We often found ourselves needing an RTSP server for redistribution, restreaming, or other purposes, and decided to build one ourselves. We are open sourcing both projects hoping to enrich the ecosystem of video libraries in Rust. Oddity.ai is worldwide leader in violence detection, using deep learning to create a safer world. Ever since we started in 2020, we have been focused on developing an algorithm that can detect aggression with the highest possible accuracy, and with the fewest false positives possible. Building the most accurate AI has always been our primary goal, and it is what we are most known for. But to make our technology work in actual, real-world camera surveillance systems, we require another important component. That component is what we call our "engine platform". It is responsible for reading security camera feeds, running them through our AI model, and sending alarms to video management systems of our customers. The engine must be stable and robust. It must run unsupervised for years without maintenance, without failing. Some of our early installations have been running continuously ever since they were installed. Usually, the security cameras themselves are the most error-prone part of a video surveillance installation. They can be down due to network issues, for maintenance or they might have broken, often due to the weather or vandalism. In some cases the camera might go down, or it could reset itself and revert to a non-compatible profile. Additionally, from time to time, a camera will appear to be working, but doesn't actually produce any video. In all cases, our engine must log the issue and continue analysis on camera streams that are still up. Moreover, when the camera is repaired, our engine needs to pick up where it left off. From experience, we learned that having a well-built and well-tuned library for video retrieval is key to ensuring the stability of the engine. Added benefit is that we can use the same library for many other purposes that come up during experimentation, model validation, model debugging and video surveillance implementations.'''
author = "Oddity.ai B.V."
year_published = 2025
clearnet = "https://oddity.ai/nl/blog/open-source-video-and-rtsp"
