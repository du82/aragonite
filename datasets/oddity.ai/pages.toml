["https://oddity.ai/blog/ethics-of-ai"]
title = "Ethics of AI for Video Surveillance - Oddity.ai"
description = "Oddity is developing the future of safety by detecting high impact crimes on live video footage. Our algorithms seamlessly integrates with existing software in security centers and is trusted by municipalities, law enforcement and private security companies."
full_description = "The path towards the successful application of artificial intelligence in video surveillance that we are taking as a society crosses a lot of junctions and making a wrong choice along the way can cause a very undesirable outcome. The promise of AI is immense but the risks are large too. It is of utmost importance that we are aware of this, that we keep thinking critically and that we enable an open and inclusive dialogue. A strong and justified moral compass is necessary to keep walking the right track. In this blog, we offer our vision on the ethics of video surveillance with machine learning; it’s as relevant as ever. The pace of development in artificial intelligence is incredibly high. The past few years the translation of state-of-the-art research into practical applications has also started to take shape. AI is no longer solely a tech-giant asset but is deployed in organisations of all kinds. Protecting your online banking account from scammers, detecting asbestos-roofs or making the energy grid more efficient using AI-guided optimisations: all are no longer futuristic dreams. The automatic and immediate detection of violent assault also was such a dream once. There is, however, a non-technical limit to this progress. Not everything that’s technologically possible, is desirable. While some applications are clearly justified, others are clearly wrong. This articles focuses on the domain of video surveillance. No parent would argue against the value of finding a lost child using a network of face recognising surveillance cameras. At the same time, it would be uncomfortable if these cameras could be put to arbitrary use by the government. Unfortunately, it is not apparent how to implement the former while preventing the latter. The wish to surveil is of all times, but modern technology allows governments (and other organisations) to extend surveillance to the whole of our society. At the same time, it’s now possible to do so at a scale and with an efficiency that have never been seen before. Dystopian scenarios of repressive police states with all-seeing eyes, such as made famous in George Orwell’s 1984 (a must-read for everyone interested in video surveillance), are becoming technologically feasible. The risk of malicious application is the price we pay for the technological progress that enables the righteous application."
author = "Oddity.ai B.V."
year_published = 2025
clearnet = "https://oddity.ai/blog/ethics-of-ai"
