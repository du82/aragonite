["https://oddity.ai/blog/language-enabled-action-recognition"]
title = "Revolutionising Surveillance: From Traditional to Language-Enabled Action Recognition Models - Oddity.ai"
description = "Oddity is developing the future of safety by detecting high impact crimes on live video footage. Our algorithms seamlessly integrates with existing software in security centers and is trusted by municipalities, law enforcement and private security companies."
full_description = "In the world of surveillance and security, accurately recognizing actions from video footage is crucial. Traditional computer vision models have served this purpose well, but advancements in technology are paving the way for even more sophisticated approaches. One such advancement is the emergence of language-enabled computer vision models. This post will introduce the concept, compare it with traditional models, and highlight how it can enhance action recognition (AR) in surveillance and security. Traditional computer vision models are designed to identify and categorise objects or actions from images and videos. These models operate on a fixed set of output classes. For instance, a model trained to recognize activities might only distinguish between a set number of actions like walking, running, or jumping. This is similar to having a predefined dictionary of actions the model can recognize. While effective, this approach has limitations: Despite these limitations, traditional models have been the backbone of many surveillance systems, offering reliable performance for specific, well-defined tasks Language-enabled computer vision models represent a significant leap forward. These models are trained on massive datasets that combine images or videos with corresponding textual descriptions. These datasets can consist of image-text pairs scraped directly from the internet. It should be noted that these datasets are very large, with some datasets containing upwards of 1 billion image-text samples. In these datasets, each sample is an image-text pair. For example, one such pair could be a picture of a person jogging with a corresponding caption “Man wearing trainers jogging in Central Park, New York”. By feeding these pairs to a language-enabled model, this model then learns to associate this image to its natural language counterpart and vice versa. In other words, the model can then reason either from vision to text (i.e. which caption most closely matches this image or video) and from text to vision (i.e. which image or video most closely matches this caption). It can do so freely, meaning that any caption can be supplied to compare against. It follows that these language-enabled vision models have no fixed set of output classes."
author = "Oddity.ai B.V."
year_published = 2025
clearnet = "https://oddity.ai/blog/language-enabled-action-recognition"
