description = "Oddity realiseert de toekomst van veiligheid door misdaad op te sporen in live videobeelden. Onze technologie integreert met bestaande software in cameratoezichtruimtes en wordt gebruikt door gemeentes, politieafdelingen en private beveiligingsbedrijven."
full_description = "With the rise of camera surveillance, a lot of safety concerns have seen improvement. Emergency response times have gone up, anti-social behavior has gone down, and crime has been deterred. However, it is hard for surveillance operators to determine whether a crowd is just large or dangerously large. Even though graphics processors were initially intended for gaming, computer science enthusiasts are well aware that they hold significant value in numerous other areas as well. With the supply chain problems gradually being resolved and prices becoming more stable, many individuals are keen to get their hands on the latest NVIDIA GPUs. This blog post is here to help you make an informed decision when selecting the ideal GPU for your deep learning projects! In the world of surveillance and security, accurately recognizing actions from video footage is crucial. Traditional computer vision models have served this purpose well, but advancements in technology are paving the way for even more sophisticated approaches. One such advancement is the emergence of language-enabled computer vision models. This post will introduce the concept, compare it with traditional models, and highlight how it can enhance action recognition (AR) in surveillance and security. In onze hedendaagse maatschappij ontstijgt het aantal bewakingscamera's het aantal patrouillerende politieagenten. Naarmate het gebruik van kunstmatige intelligentie (AI) op bewakingscamera's toeneemt, wordt de rol ervan in de openbare veiligheid steeds belangrijker. Oddity's missie is het gebruik van computer vision als een kracht voor het goede, met als doel de publieke veiligheid te verhogen zonder privacy daarvoor op te moeten offeren. We are proud to announce that we have decided to open source two formerly internal Oddity projects that help us read, process and distribute video streams. First, we're open sourcing a Rust library called video-rs that can read, write, encode and decode video. Second, we're open sourcing our own custom RTSP server."
