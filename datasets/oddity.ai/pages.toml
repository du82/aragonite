["https://oddity.ai/nl"]
title = "Oddity.ai"
description = "Oddity realiseert de toekomst van veiligheid door misdaad op te sporen in live videobeelden. Onze technologie integreert met bestaande software in cameratoezichtruimtes en wordt gebruikt door gemeentes, politieafdelingen en private beveiligingsbedrijven."
full_description = "Oddity realiseert de toekomst van veiligheid door het detecteren van ernstige misdrijven op live videobeelden. Ons geavanceerde algoritme integreert naadloos met technologie in observatiecentra en geniet het vertrouwen van wetshandhavingsinstanties, detentiecentra, steden en vele andere entiteiten. Ons geavanceerde algoritme bewaakt videofeeds en waarschuwt beveiligingspersoneel voor gewelddadige incidenten, inbreuk op de perimeter en andere voorvallen. Het kan tegelijkertijd duizenden feeds verwerken, met een detectiesnelheid van minder dan een halve seconde. Ons algoritme monitort videostreams in real time en geeft alleen alarmen af wanneer het een incident detecteert. Incidenten met grote impact worden onmiddelijk opgemerkt. Op deze manier kunnen operators supersnel reageren op gebeurtenissen in de stad. Dit kan onze software 5 maal sneller dan onze competitie. Schaal op naar duizenden videostreams tegelijkertijd. Onze software monitort vele videostreams tegelijkertijd. Integreer met je bestaande VMS en infrastructuur. Snelle oplevering en meteen te gebruiken zonder extra training van je personeel. Privacy heeft topprioriteit binnen het beveiliginsdomein. Ons systeem is gebouwd op dat principe. De analyse door onze algoritmes gebeurt volledig anoniem, de servers worden op locatie geplaatst. De data blijft binnen de bestaande infrastructuur. Onze klanten zien 4x meer incidenten met behulp van onze algoritmes. Oddity bereikt bovenmenselijke resultaten met behulp van zelf ontwikkelde deep learning technieken."
