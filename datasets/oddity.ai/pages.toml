["https://oddity.ai/nl/blog/achieving-problem-solution-fit"]
title = "Achieving Problem Solution Fit for Startups - Oddity.ai"
description = "Oddity realiseert de toekomst van veiligheid door misdaad op te sporen in live videobeelden. Onze technologie integreert met bestaande software in cameratoezichtruimtes en wordt gebruikt door gemeentes, politieafdelingen en private beveiligingsbedrijven."
full_description = "Software startups around the world are struggling to survive. Usually, within two years from the startups’ creation, it is not competition but rather self-destruction that drives the majority of startups into failure. My previous post presented a go-to-market approach based on The Lean Startup, Design Thinking, The Lean Product Playbook, and The Startup Owner’s Manual, to provide structured guidance to startups. These strategies are all user-driven innovation strategies: they involve potential users, customers, or other stakeholders into the development process, thus maintaining a user-centred approach. In this article, I want to explain what has proven to be the most crucial part of the software startup: finding the problem-solution fit. The aim of this fit is to implement a solution that tests the trickiest hypotheses of the customer problem. The solution is based on a real customer problem that contains a particular need. If the hypotheses hold and the solution thus solves the customer problem, the problem-solution fit has been found. In this (and the next) article, I report the main findings of the research and discuss some parts of the Process Diagram, which is based on Method Engineering. The phases that I discuss are shown in the figure above: Learn and build, Understanding the problem, Create a customer point of view, Ideate, and Discover customers. This diagram has been evaluated by twelve co-founders of successful software startups in a holistic multiple-case study. We found that these founders all used a structured approach to building their startup. Therefore, we hypothesise that software startups can benefit significantly from a practical startup approach. Next, we dive deeper into the Learn and Build phase, which is the most crucial phase software startups go through. “New products are inherently hard to launch because both the problem and solution are unknown.” - Eric Ries This Learn and Build phase (shown in the figure below) has proven to be the most important, parallel phase that successful startups follow. It contains the very first activity that startups should follow if they have an idea: Find prospective customers to talk to. Usually, this idea is already translated to a software product, which should always be a Minimum Viable Product (MVP): a version of the product that requires the least amount of development time with a minimum amount of effort."
author = "Oddity.ai B.V."
year_published = 2025
