["https://oddity.ai/blog/watchful-ai-privacy-and-bias"]
title = "The Watchful AI: Privacy and Bias in Computer Vision - Oddity.ai"
description = "Oddity is developing the future of safety by detecting high impact crimes on live video footage. Our algorithms seamlessly integrates with existing software in security centers and is trusted by municipalities, law enforcement and private security companies."
full_description = "In our present society, surveillance cameras can be more prevalent than patrolling police officers. As the use of artificial intelligence (AI) on such surveillance cameras is expanded, its role in public safety is becoming increasingly significant. Computer vision technology, which enables machines to interpret and make decisions based on visual data, has great potential for addressing crime and ensuring public safety. However, the technology is often viewed as a double-edged sword, offering the promise of enhanced security and improved quality of life, while also harboring the potential for a mass surveillance dystopian society. It is Oddity’s mission to use computer vision as a force for good, and increase safety without sacrificing privacy. There are two main concerns to take into account to ensure proper use of AI in public surveillance: Related to bias, is the notion of the “black box” and the importance of explainable AI. The black box refers to a situation where the decision-making process of an AI system is hidden and not easily understandable by humans. This can lead to challenges in understanding, trusting, and validating the AI's decisions and behaviors. If we cannot inspect the inner workings of an AI system, it will be enormously difficult to rule out that an AI system has no undesired biases. However, understanding the issues of privacy and bias is not just a technological challenge but a societal imperative. In developing computer vision systems, we must take great caution, ensuring they are engineered to limit misuse where ever possible. In this blogpost, we will explore the positions of the European Union and the Dutch government regarding privacy and bias and AI. Following this, we will present an overview of how Oddity.ai aligns with these regulations and standards. We will detail our proactive measures and the internal policies we have implemented to ensure our AI systems uphold privacy and mitigate bias, reinforcing our commitment to ethical AI development."
