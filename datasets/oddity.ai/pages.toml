["https://oddity.ai/blog"]
title = "Blog - Oddity.ai"
description = "Oddity is developing the future of safety by detecting high impact crimes on live video footage. Our algorithms seamlessly integrates with existing software in security centers and is trusted by municipalities, law enforcement and private security companies."
full_description = "With the rise of camera surveillance, a lot of safety concerns have seen improvement. Emergency response times have gone up, anti-social behavior has gone down, and crime has been deterred. However, it is hard for surveillance operators to determine whether a crowd is just large or dangerously large. Even though graphics processors were initially intended for gaming, computer science enthusiasts are well aware that they hold significant value in numerous other areas as well. With the supply chain problems gradually being resolved and prices becoming more stable, many individuals are keen to get their hands on the latest NVIDIA GPUs. This blog post is here to help you make an informed decision when selecting the ideal GPU for your deep learning projects! In the world of surveillance and security, accurately recognizing actions from video footage is crucial. Traditional computer vision models have served this purpose well, but advancements in technology are paving the way for even more sophisticated approaches. One such advancement is the emergence of language-enabled computer vision models. This post will introduce the concept, compare it with traditional models, and highlight how it can enhance action recognition (AR) in surveillance and security. In our present society, surveillance cameras can be more prevalent than patrolling police officers. As the use of artificial intelligence (AI) on such surveillance cameras is expanded, its role in public safety is becoming increasingly significant. It is Oddity’s mission to use computer vision as a force for good, and increase safety without sacrificing privacy. We are proud to announce that we have decided to open source two formerly internal Oddity projects that help us read, process and distribute video streams. First, we're open sourcing a Rust library called video-rs that can read, write, encode and decode video. Second, we're open sourcing our own custom RTSP server. Oddity’s aim is to shape the future of safety. Apart from our usual projects in the domain of public safety, such as in cities, we are also working on different ideas. Our intern Wikke, together with the University of Utrecht, is working on a detecting seizures in newborns."
