full_description = "Freier Zugang zu unseren Gesetzen.Ein privater Verlag bestimmt darüber, wie unsere Gesetze in Kraft treten. Wer Gesetzesblätter des Bundes durchsuchen, kopieren oder ausdrucken will, wird zur Kasse gebeten.Das ändern wir!Wir stellen das Bundesgesetzblatt in digitaler Form kostenfrei zur Verfügung.Das BundesgesetzblattIm Bundesgesetzblatt (BGBl.) werden alle Gesetze der Bundesrepublik Deutschland veröffentlicht. Gesetze treten erst in Kraft, wenn sie dort erscheinen. Herausgeber ist der Bundesanzeiger Verlag, der 2006 privatisiert wurde. Er gehört zur Dumont-Verlagsgruppe.Der Bundesanzeiger VerlagDer Verlag erhebt Urheberrecht auf die Datenbank der Gesetzblätter. Diese sind zwar online einzeln einsehbar, aber können nicht gedruckt, durchsucht oder kopiert werden. Der Bundesanzeiger Verlag verbietet die Weiterverwendung. Wer die Gesetzblätter des Staates nutzen will, muss dem privaten Verlag Abo-Gebühren zahlen.Offene GesetzeZentrale Dokumente der Demokratie müssen offen für alle bereitstehen. Das Urheberrecht darf der Demokratie nicht im Wege stehen. Deswegen stellen wir auf dieser Seite sämtliche Bundesgesetzblätter seit 1949 frei, offen und kostenlos zur Verfügung.Alle Gesetzesblätter auf einer Website.Kostenlos, digital, offen.Gesetze entdeckenMehr erfahrenVergleich„Kostenloser Bürgerzugang“des Bundes­anzeiger VerlagsOffene­Gesetze.deDokumente druckbarBundes­anzeiger Verlag NeinOffene­Gesetze.de JaVolltextsucheBundes­anzeiger Verlag NeinOffene­Gesetze.de JaText in älteren AusgabenBundes­anzeiger Verlag NeinOffene­Gesetze.de JaGesamt-DownloadBundes­anzeiger Verlag NeinOffene­Gesetze.de JaFreie WeiterverwendungBundes­anzeiger Verlag NeinOffene­Gesetze.de JaStabile LinksBundes­anzeiger Verlag NeinOffene­Gesetze.de JaRSS-FeedsBundes­anzeiger Verlag NeinOffene­Gesetze.de JaProgrammier-SchnittstelleBundes­anzeiger Verlag NeinOffene­Gesetze.de Jaalle Funktionen kostenlosBundes­anzeiger Verlag NeinOffene­Gesetze.de JagemeinnützigBundes­anzeiger Verlag Nein, profitorientiertOffene­Gesetze.de Ja HintergrundIm Jahr 2006 wurde der staatliche Bundesanzeiger Verlag privatisiert. In einem umstrittenen Verfahren sicherte sich der Dumont-Verlag das Unternehmen und damit die Veröffentlichung aller Gesetze im Bundesgesetzblatt. Mehr lesen. Wie tritt ein Gesetz in Kraft?1. Gesetzgebungs­initiativeDie Bundesregierung, der Bundestag oder der Bundesrat starten eine Initiative für ein neues Gesetz.2. Beratung und ZustimmungDer Bundestag und der Bundesrat beraten über den Gesetzentwurf und verabschieden ihn, meist mit Änderungen.3. Gegen­zeichnungDie Bundesregierung zeichnet den Gesetzentwurf gegen.4. AusfertigungDer Bundespräsident fertigt das Gesetz aus und unterzeichnet es.5. VerkündungDas Gesetz wird im Bundesgesetzblatt verkündet. Der zuständige Bundesanzeiger Verlag ist ein privater Verlag. Er verbietet die Weiterverwendung der Gesetzesblätter online.Bedeutende VeröffentlichungenDas Grundgesetz (1949)Ehe für alle (2017)Urheberrechtsgesetz (1965)Tierschutzgesetz (1972)Mehr bedeutende VeröffentlichungenNeueste VeröffentlichungenGesetz zur Einführung eines Chancen-Aufenthaltsrechtsam 30.12.2022, Nr. 57 (2022), BGBl. Teil IGesetz zur Änderung des Tierarzneimittelgesetzes zur Erhebung von Daten über antibiotisch wirksame Arzneimittel und zur Änderung weiterer Vorschriftenam 30.12.2022, Nr. 57 (2022), BGBl. Teil IZweite Verordnung zur Sicherung von Vorbereitungsdiensten des Bundesministeriums des Innern und für Heimat während der COVID-19-Pandemieam 30.12.2022, Nr. 57 (2022), BGBl. Teil IZweite Verordnung zur Sicherung von Vorbereitungsdiensten des Bundeskanzleramts und des Bundesministeriums des Innern und für Heimat während der COVID-19-Pandemieam 30.12.2022, Nr. 57 (2022), BGBl. Teil IZweite Verordnung zur Sicherung von Vorbereitungsdiensten des Bundesministeriums der Finanzen während der COVID-19-Pandemieam 30.12.2022, Nr. 57 (2022), BGBl. Teil IMehr Veröffentlichungen"
