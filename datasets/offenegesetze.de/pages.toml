["https://offenegesetze.de/faq"]
title = "OffeneGesetze.de – Freier Zugang zu unseren Gesetzen"
description = "Freier Zugang zu unseren Gesetzen. Wir stellen das Bundesgesetzblatt in digitaler Form kostenfrei zur Verfügung."
full_description = "FAQ – Häufig gestellte FragenKann ich mir auf dieser Seite die aktuell gültigen Gesetze ansehen?Nein, Amtsblätter enthalten nur die Änderungen an den Gesetzen. Für die konsolidierte Fassung der Gesetze gibt es z.B. Gesetze im Internet.Erlaubt bgbl.de nicht schon einen kostenfreien Zugang?Auf bgbl.de gibt es einen sogenannten „kostenlosen Bürgerzugang“. Dort gibt es aber keine Such- oder Druckfunktion. Eine Suche über Google ist teilweise möglich, aber sehr beschränkt, da z.B. keine Filtermöglichkeit nach Jahr möglich ist. Die Süddeutsche Zeitung geht in ihrem Artikel näher auf die unterschiedliche Versionen von bgbl.de ein.Was ist der Unterschied zwischen BGBl. Teil I und Teil II?Das Bundesgesetzblatt besteht aus zwei Teilen. In Teil I werden Rechtsvorschriften wie Gesetze und Verordnungen veröffentlicht. Teil II enthält völkerrechtliche und andere internationale Abkommen.Wer steckt hinter dem Projekt?Der gemeinnützige Open Knowledge Foundation Deutschland e.V..Wollt ihr damit Geld verdienen?Nein. Die Plattform dient dazu, allen Menschen freien Zugang zu Bundesgesetzblättern zu verschaffen.Kann ich die Dokumente gesammelt herunterladen?Ja. Unter OffeneGesetze.de/daten kann man sämtliche Gesetzblätter oder auch die Gesetzblätter pro Jahr herunterladen. Es gibt auch eine Programmierschnittstelle (API), um auf die Dokumente zuzgreifen. Momentan fehlen vollständige Dokumente für einige Jahrgänge. Wir arbeiten daran, diese auch verfügbar zu machen.Warum ist der Text so komisch, wenn ich ihn aus älteren PDFs kopiere?Bei älteren Dokumenten gibt es derzeit noch Probleme mit der Texterkennungssoftware, um den Text zu extrahieren. Insbesondere mit dem Spalten-Layout gibt es Probleme. Wir arbeiten an einer Lösung und freuen uns über Hinweise.Und was ist mit anderen Dokumenten?Wir bekommen viele Zuschriften von Menschen, die sich auch eine Veröffentlichung von BGBl. Teil III sowie von Normen wünschen. Wir prüfen derzeit, was in dieser Hinsicht machbar ist.Ich benutze kein RSS. Kann ich trotzdem Updates erhalten?Ja, Sie können sich z.B. IFTTT Updates per E-Mails zuschicken lassen. Dafür einfach die URL des Feeds bei IFTTT eingeben and eine gewünschte E-Mail-Adresse schicken lassen.Bei weiteren Fragen können Sie gerne Kontakt zu uns aufnehmen."
