title = "OffeneGesetze.de – Freier Zugang zu unseren Gesetzen"
description = "Freier Zugang zu unseren Gesetzen. Wir stellen das Bundesgesetzblatt in digitaler Form kostenfrei zur Verfügung."
full_description = "PressePresseanfragen bitte an Arne Semsrott, [email protected], Telefon: 030 57703666 0PressemittelungOffeneGesetze - zentrale Dokumente der Demokratie erstmals frei zugänglichBerlin, 10.12.2018 - Die Bundesgesetzblätter sind die zentralen Dokumente der deutschen Demokratie. Unter OffeneGesetze.de sind sie jetzt erstmals frei zugänglich. Auf dem Portal stellt die gemeinnützige Open Knowledge Foundation Deutschland die Dokumente kostenfrei und zur freien Weiterverwendung bereit.Bisher sind Bundesgesetzblätter nur über die Website bgbl.de des Bundesanzeiger Verlags verfügbar. Der private Verlag verlangt für grundlegende Funktionen, zum Beispiel die Durchsuchbarkeit oder das Drucken von Gesetzblättern, Abogebühren. Eine Weiterverwendung der Dokumente untersagt der Verlag mit Verweis auf das Urheberrecht. Arne Semsrott, Projektleiter Open Knowledge Foundation Deutschland: “Das Urheberrecht darf der Demokratie nicht im Wege stehen. Daten und Dokumente des Staates müssen frei für alle Menschen zugänglich sein. Wenn das Justizministerium nicht dafür sorgt, muss eben die Zivilgesellschaft einspringen.”Der vormals staatliche Bundesanzeiger Verlag wurde 2006 privatisiert. In einem umstrittenen Verfahren sicherte sich der Dumont-Verlag das Unternehmen. Die genauen Bedingungen der Kooperation des Bundes mit dem Verlag hält das zuständige Justizministerium geheim. Neben dem Vertrieb des Bundesgesetzblatts erhielt der Verlag ohne Ausschreibung auch den Auftrag zum Betrieb von anderen staatlichen Plattformen, zum Beispiel dem Transparenzregister.Durch die Funktionen von OffeneGesetze.de, etwa den Gesamt-Download aller Bundesgesetzblätter seit 1949, wird es erstmals möglich, den Textbestand der Gesetzblätter zu analysieren und Veränderungen in Gesetzen der letzten Jahrzehnte nachzuvollziehen. Außerdem können anders als bisher einzelne Dokumente verlinkt und durchsucht werden. Auf der offiziellen Seite des Bundesanzeiger Verlags ist hingegen zum Beispiel das erste Bundesgesetzblatt, die Verkündung des Grundgesetzes 1949, nur als schiefer Bilderscan vorhanden.Presse-Artikel über unsOffeneGesetze.de Launch: 10.12.2018https://www.sueddeutsche.de/digital/offene-daten-aktivisten-stellen-alle-bundesgesetzblaetter-ins-netz-1.4246682https://netzpolitik.org/2018/offenegesetze-bundesgesetzblaetter-erstmals-frei-zugaenglich/https://www.lto.de/recht/hintergruende/h/offene-gesetze-inhalt-bundesgesetzblatt-datenbankschutz-urheberrecht/https://www.deutschlandfunkkultur.de/stiftung-veroeffentlicht-alle-bundesgesetze.265.de.html?drn:news_id=954611https://www.handelsblatt.com/dpa/wirtschaft-handel-und-finanzen-streit-um-urheberrecht-stiftung-veroeffentlicht-alle-bundesgesetze/23740910.htmlhttps://www.golem.de/news/open-data-okfn-befreit-bundesgesetzblaetter-1812-138167.htmlhttps://www.heise.de/newsticker/meldung/Urheberrecht-Open-Knowledge-Foundation-veroeffentlicht-alle-Bundesgesetze-4246696.htmlhttps://www.t-online.de/digital/id_84923282/open-knowledge-foundation-veroeffentlicht-alle-bundesgesetze.htmlhttps://www.chip.de/news/Neue-Plattform-veroeffentlicht-alle-neuen-Gesetze-Darum-machen-sich-die-Betreiber-damit-strafbar_155078480.htmlhttps://www.lawblog.de/index.php/archives/2018/12/10/bundesgesetzblatt-fuer-alle/https://blog.fefe.de/?ts=a2f0bcc2https://www.mydealz.de/deals/bundesgesetze-kostenlos-im-vollzugriff-1294111https://www.reddit.com/r/de/duplicates/a4v44e/offene_daten_aktivisten_stellen_alle/https://rivva.de/300714106https://www.die-stiftung.de/nachrichten-service/kurzmeldungen/open-knowledge-foundation-veroeffentlicht-alle-bundesgesetze-81135/https://www.saarbruecker-zeitung.de/sz-spezial/internet/stiftung-veroeffentlicht-alle-bundesgesetze-frei-zugaenglich-im-internet_aid-35037183https://www.pfaelzischer-merkur.de/ratgeber/stiftung-veroeffentlicht-alle-bundesgesetze-frei-zugaenglich-im-internet_aid-35039221http://www.digitalfernsehen.de/Urheberrechtsstreit-Stiftung-veroeffentlicht-alle-Bundesgesetze.172755.0.htmlhttps://www.fin