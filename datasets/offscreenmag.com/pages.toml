["https://offscreenmag.com/blog/letter-to-the-editor-9"]
title = "Letter to the editor"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Thanks for the speedy delivery of the three issues of Offscreen. I’ve just finished issue 14, now going through 13 and I already feel thankful for what they have done for me. It immediately convinced me to subscribe. I started out as a graphic designer with a ‘focus on web’ 18 years ago, and then worked at a design agency, before becoming an entrepreneur 10 years ago. I’ve grown up along with the web – learning new tools and new ways of thinking, and incorporating it all into what I offer my clients. Along the way I’ve lost my interest in design-focused magazines. More recently, I have been on the lookout for something that was more in line with my point of view, something that would enrich my thinking as an entrepreneur. And Offscreen is the perfect fit. The human perspective, the background stories with all the ups and downs really motivate me to continue chasing my dream to create products that help and inspire others. Published from Melbourne, printed in Berlin, read around the world: Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us. Offscreen is supported by sponsors that understand the value of unobtrusive advertising and a great reader experience. Current sponsors:"
