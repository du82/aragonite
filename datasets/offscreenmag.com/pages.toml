["https://offscreenmag.com/blog/letter-to-the-editor-2"]
title = "Letter to the editor"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Hi Kai, hope you had a great weekend and an awesome day so far! I wanted to drop you a message to say one thing. Thank you! Lately I have been struggling a lot with anxiety and depression. The everyday life in running a company is not always easy and the temptation of giving up is, sometimes, really strong. The last couple of weeks have been awful. Even just waking up, coming out of bed and drag myself to the office. This is not what I wanted from life. This is not what the people I look up to do. Your magazine has been one of my favourite readings since I discovered it a couple of years ago. This week it was my safety net. A window to a world to look up to and get inspired from. Your articles and interviews boosted my morale and gave me the motivation to pick up the pieces and start taking care of myself again. The stories of success you tell are always realistic, they show the struggle to get there, they show that a mindset oriented to excellence pays off. This was super important for me. Calmed down my anxiety and gave me the strength to get back to my fights. I just wanted to thank you. To tell you that you are making a difference in my life. A positive one. A massively positive one. I can imagine it’s hard work to run the magazine, but please do keep it up! You have something amazing in your hands. You are showing a good example to a lot of readers like me. Hopefully, some of us will be talented enough to make a difference in this world and it will be because of you. Sorry for the super long mail. I never write this kind of fan boy emails, but this time it was important to me. If you’ll ever need a hand with something, with the magazine or other projects, feel free to get in touch. I’ll always owe you a big one. This. This is why I do what I do. All the best to you, Simone! And thanks for sharing this heartfelt message with me/us."
