["https://www.offscreenmag.com/issues/17"]
title = "Offscreen Magazine Issue 17"
description = "Interviews with Tom Loosemore, Heather B. Armstrong, Jason Santa Maria, Ashwini Asokan."
full_description = "Tom Loosemore Leveraging the power of technology to run government like a startup and create the public services we need. Heather B. Armstrong Love letters and hate mail: the emotional journey of publishing one of the web’s most successful blogs. Jason Santa Maria Good design is medium-agnostic: the design director finds common ground between digital and analogue. Ashwini Asokan The AI entrepreneur and advocate fights for a future that works for everyone, not just a privileged few. “We owe it to our countries to help them close the technology gap. Our institutions are crucially important. Everything else is just play.” Reforming government takes audacity, willpower, and – perhaps most of all – a strong dissatisfaction with the status quo. Tom Loosemore doesn’t lack any of these attributes. As founding deputy director of GDS (Government Digital Services), Tom began a ground-breaking digital transformation of the UK government that later served as a model for other countries, and spawned many new initiatives for improving public services. With a multi-disciplinary team, a fully transparent approach, and many unconventional principles more typically found in tech startups, Tom showed that by embracing technological disruption, our experience of interacting with government institutions can be transformed from one that’s slow, confusing, and frustrating to one that’s fast, simple, and empathetic. “I just couldn’t wrap my head around the idea that so many people were twisting my work into something so negative and awful, when all I did was write some funny stories about me and my family.” During the heyday of blogging, Heather Armstrong was widely recognised as one of the most successful in the field. Her irreverent, imaginative, and deeply personal writing attracted millions of monthly readers, lucrative advertising deals, and the occasional social media shitstorm. Blogging under the pseudonym ‘Dooce’ for over sixteen years, Heather became renowned for candidly sharing details about her private life: the challenges of a divorce and of life as a single parent, her struggle with depression, her feuds with advertisers, and the never-ending barrage of hate mail. After a recent break from blogging, Dooce is back at it with renewed enthusiasm and her trademark brand of undiluted sass."
