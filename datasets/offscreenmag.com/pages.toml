["https://offscreenmag.com"]
title = "Offscreen Magazine – The Human Side of Technology"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "Offscreen is a (currently paused) independent print magazine that examines how we shape technology and how technology shapes us. Published 2–3 times per year in beautiful print, Offscreen offers critical perspectives on our tech-driven futures through in-depth interviews with a diverse range of contributors. A buzzword-free zone We replace inflated success stories and click-baity tech jargon with unpolished human stories and thoughtful, earnest conversations. The big picture We are unmoved by the latest fads and instead focus on the long-term positive and negative impact of major trends in technology. Taking a stand We’ve taken off the rose-coloured goggles to lay bare Big Tech’s lack of ethics, proposing a more sustainable and humane way forward. Proudly indie We’re funded by our readers and a handful of values-aligned sponsors allowing us to take a candid, objective view at the tech world. Offscreen grew out of a web designer’s frustration with the ephemeral nature of digital products. Find out more about the one-man journey of the magazine. Our publishing efforts promote a tech community guided by ethical, sustainable, inclusive, slow principles. Read more about how we strive for a kinder web. Published from Melbourne, printed in Berlin, shipped to readers around the world. Take a look behind the scenes of our production process and the specs of each issue. I can’t get enough of Offscreen. I love every page of every single issue! Inspiring content and impeccable design! Subscribed for the next three issues. Every Offscreen so far has changed the way I’ve wanted to conduct life and business. Keep it up. If you haven’t already, check out (and buy) Offscreen - probably the single most beautiful magazine I’ve ever seen. Inspiring stuff! Great design and great content. Also love the way Offscreen handles advertising with a fair, tasteful non-obtrusive approach. Other magazines should take note. The only thing disappointing about Offscreen is when you realise you’ve finished every article contained inside."
