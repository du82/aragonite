["https://offscreenmag.com/blog/day-in-the-life-of-me"]
title = "A day in the life of... me"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Some people recently asked me if I could do a ‘Day in the Life’ piece about my own day. I had a bit of time in between editing the new issue and retouching photos today, so here you go: 7:15am — My iPhone gently wakes me. I’ve given up resisting the urge to check my emails in bed a long time ago. I quickly scan the 32 unanswered emails. Some good, some bad, one with the subject line 'Sorry dude’. I wait with opening that one till after I had my first coffee. 7:45am — Pants are on, teeth are brushed. Time to check the weather: looking good enough for the five-minute bike ride to Code Black, one of about five local cafés and unofficial Offscreen 'side offices'. I inhale a banana on the way to my bike. 8:00am — Armed with a Long Black I get started with emails: a couple of stockist enquiries, a few contributors asking for feedback, some submissions, some bills to be paid, and a reader from Slovenia asking about the whereabouts of his shipment. Oh yeah, and that apologetic email from an interviewee dropping out last minute. 9:30am — After getting most of the emailing done, I’m scouring the web and my database of potential contributors to find a worthy replacement for the newly opened interview slot. One of the more difficult parts of running a magazine: locating and then soliciting busy people to see whether they can help you out on short notice. 10:15am — I’m starting to slouch — a good sign to get up and move to a new spot. I’ll grab a bag of coffee beans, pay up and ride home. 10:30am — A reminder of Melbourne’s unpredictable weather: I arrive slightly soaked. Time to put the heater on (yes, we have winters in Australia too!) and get the kettle going for a brew in the Chemex. I love the ritual of making coffee. 10:45am — Back to work with coffee in hand. I love my standing desk. Perhaps the best work-related investment I ever made. Today I’m getting started with some photo retouching for the new issue, so I’ll get the Spyder Express out to calibrate my external monitor."
