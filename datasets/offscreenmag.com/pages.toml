["https://offscreenmag.com/blog/taking-a-break"]
title = "Offscreen is taking a break"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Seven years ago, when I first thought about ‘a print magazine for pixel people’, I could have never imagined that today I’d still be answering emails from readers or preparing orders for fulfilment. What started as a somewhat nostalgic idea of a guy tired of pushing pixels on a screen ended up defining a large part of my life and, to be honest, my identity. Those of you who have followed me from the beginning know that I had my fair share of ups and downs – the result of me coming to terms with the reality of shipping tangible products. Whenever I was close to calling it ‘the last issue’ I would receive a heart-warming email or an encouraging tweet or I would run into an enthusiastic reader at an event that changed my mind. You kept me going over the years, making me proud and honoured to publish a magazine with an unbelievably supportive, loyal, and thoughtful readership. But not only by that measure has Offscreen exceeded my wildest expectations: the privilege to work with amazing contributors and sponsors, the opportunity to speak about Offscreen at many events around the globe, or simply being able to walk into a bookstore in a foreign country and seeing my own publication on display still makes me want to pinch myself. Having just released issue 20 I feel now is a good time to take a breather and give my mind some space to reassess. This means that there won’t be a new issue of Offscreen for at least six months, maybe more. I’m hoping to spend a bit of time exploring other ideas (such as the recently launched Dense Discovery) and – if the right project presents itself – I wouldn’t be opposed to joining a small team to work on something unrelated to publishing. (I’m particularly interested in the ‘tech-for-good’/social impact field, so if you think I could be a valuable addition to your team, please get in touch!)"
