full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I hope you’re doing well! I just wanted to send you a picture of me reading my Offscreen issue 10 with my four-month old, who happens to sort of be named after you. My wife and I were trying to think of names one day and an issue of Offscreen was on the coffee table and I remembered meeting you at XOXO. I asked her what she thinks of “Kai”. We were trying to find a name that works easily in English, Chinese and Japanese and it fit the bill. The name made the short list, then the list and in October of last year little Kai was born :-) I just thought I’d let you know. Thanks again for all of the hard work you do with Offscreen. It’s by far my favorite magazine to get in the mail :-) Brian I’ve said it before and I say it again: I have the bestest readership a publisher could wish for. Thank you, Brian! Published from Melbourne, printed in Berlin, read around the world: Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us. Offscreen is supported by sponsors that understand the value of unobtrusive advertising and a great reader experience. Current sponsors:"
