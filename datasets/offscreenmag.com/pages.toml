title = "Offscreen Magazine Issue 13"
description = "Interviews with Yancey Strickler, Gina Trapani, Sarah Bray, and Jamin Warren."
full_description = "Interview Yancey Strickler on the importance of being deterministic, his defiance to become the ‘Walmart of crowdfunding’, and his all-time favourite Kickstarter project. Reality-Driven Design UI designer Francesco Kirchhoff travels to Ebola-stricken Liberia and discovers a different (design) reality. Ten Commandments Stephen Wyatt Bush reminisces about the things his dad taught him about programming. Interview Gina Trapani on what it’s like to build one of the web’s most successful blogs, how 9/11 influenced her career, and her attempt to make social media more meaningful. Interview Sarah Bray on what it means to treat people like people on the internet, the power of tiny communities, and why we need more honesty in our marketing tactics. One Question We asked Jessica Rose, Gayle Allen, John V Willshire and William Albright what a connected future looks like to them. Becoming Cut Out For It The ups and downs of startup life as told by Other Machine Co. founder Danielle Applestone. Interview Jamin Warren on why videogames deserve more cultural recognition, the strange power of ‘magic circles’, and what jazz, comics, hip-hop, and games have in common. Toolbox Designer, developer, and founder of Cushion, Jonnie Hallman shows us his set of tools to get stuff done. Losing Sight Accessibility standards advocate Léonie Watson recounts the experience of losing her sight. Published from Melbourne, printed in Berlin, read around the world: Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us. Offscreen is supported by sponsors that understand the value of unobtrusive advertising and a great reader experience. Current sponsors:"
