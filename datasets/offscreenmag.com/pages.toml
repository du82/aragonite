["https://offscreenmag.com/blog/topic:snippets"]
title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. As Douglas Rushkoff says, we need a new operating system for startups. The current one will keep producing the same extractive and monopolistic empires we’ve gotten so far. No, what we need is a new crop of companies that are institutionally comfortable with leaving money on the table. Leaving growth on the table. Leaving some conveniences and some progress on the board, in order to lead the world into a better direction. Last week I emailed my readers to give them a status update on the making of the next issue. As in all my pre-launch emails I included a list of what’s been happening here at Offscreen over the last few months. One of those things was the ad-hoc fundraiser for refugees that I ran back in September. Half an hour after pressing Send I received my first-ever hate mail: Gary didn’t like the fact that I was using Offscreen as a platform to support refugees. While I think Gary and his attitude do not deserve more of my (or anyone’s) attention, it made me think about how ‘political’ a thing like Offscreen can or should become. (It’s depressing enough to think that humility and compassion is now a partisan issue.) In my talks and here on the blog, I’ve long been promoting a more personal approach to our work. I believe that we can make better products and create stronger relationships with the people who buy/use these products if we build some of our ideology right into what we make. Thanks in part to the internet, we have the unique opportunity to put ‘corporate professionalism’ behind us and instead put our moral beliefs front and center. I’m reminded of this excellent piece by Elizabeth Farrelly in which she describes how professionalism has become this destructive myth forcing us to leave our conscience at home. Professionalism, which most of us were brought up to admire, implies compartmentalisation. It used to mean something good and noble; leaving petty emotions at home, taking your higher self to work, thinking beyond mere profit, doing good, committing to altruism. Now, it means almost the opposite."
