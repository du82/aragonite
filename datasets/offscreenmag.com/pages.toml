["https://offscreenmag.com/blog/letter-to-the-editor-3"]
title = "Letter to the editor"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Thank you so much for the offer, I actually buy my copies at an independent magazine kiosk in Santa Monica, Ca since I’m a bit impatient when it comes to shipping haha. I wanted to say thank you for making such an amazing magazine. As someone who lives in the growing “Silicon Beach” part of southern California and works for a few tech companies, this magazine has given me so much confidence in pursuing more opportunities in tech. I love how personal your magazine feels. I read a lot of independent magazines from Hello Mr. to Human Being, The Happy Reader, The Great Discontent, Saturdays, Monster Children, Cereal, and the recently published Avaunt. What I like most about yours and other publications with similar dimensions is that it’s the perfect size to take around but also to leave out on the coffee table. I know you take careful time in choosing the paper and I have to say that hard work doesn’t go unnoticed, I would buy the magazine for the paper quality and smell alone. Those smaller details that may go unnoticed if sitting on a shelf amongst other widely spread commercial magazines are exactly the reasons why I seek yours out and only buy directly from you or from an independent seller where I know the money keeps you both in business. I really appreciate the colors you choose, the fonts you use, the advertisements sections, and my favorite: the side notes. Thank you so much for putting this out and continuing to share the behind the scenes processes that go into the creation of the magazine. All the emails you share, blog posts you write, and just every interaction to keep the magazine human makes me as a reader truly feel as if I’m supporting a friend by buying, reading and admiring their work. Published from Melbourne, printed in Berlin, read around the world: Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
