["https://www.offscreenmag.com/blog/topic:thoughts"]
title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. In the early days of this pandemic, a wave of appreciation for the internet washed over us. Confined to our homes, we figured out how to use our digital tools in earnest – to check in on each other, to stay informed, to work and play together. Some heralded it as the internet that we were supposed to get: one that elicits connection, not conflict. During the weeks that followed, the internet morphed into an existential lifeline for many. With no access to public physical spaces, we found ourselves relying on private virtual spaces. Suddenly all of our interactions and transactions occurred on the backbone of just a handful of privatised services. A dream come true for Big Tech. Social isolation perfectly complements Silicon Valley’s business model of ‘frictionless convenience’. Endless entertainment, news, shopping, and socialising, all without having to navigate the insanitary physical world – a risk we outsource to low-income gig workers. Eliminating reasons to go outside was already a winning strategy, but even the most bullish growth hackers couldn’t foresee the boon from a society in quarantine. In panic mode, our governments, too, have turned to tech solutionism. In what writer Naomi Klein calls the ‘Screen New Deal’, hastily signed public-private partnerships in mass surveillance and data collection promise to bring us out of isolation and into a ‘smart’ future, one where our health records and location data could be blurred into our shopping personas and search profiles. I know this sounds very cynical. There is no denying that technology is helping us get through this. But anyone who benefits from this tidal wave of fear and uncertainty deserves intense scrutiny. Big Tech’s relentless drive to expand their influence, often at the cost of smaller competitors and our public institutions, has just accelerated. On the back of this global health crisis, tech monopolies don’t just see a business opportunity, but a chance for redemption: when public systems falter, Big Tech is here to save the day. So goes their argument."
year_published = 2025
