["https://offscreenmag.com/blog/how-to-plan-a-magazine"]
title = "How to plan a magazine (using a flatplan)"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. In this post I want to give you guys a bit of insight into how I plan the content for each issue, and how my approach is somewhat different and simpler to that of other magazines. But let’s start with a few thoughts on creating an enjoyable reading experience. One of the beautiful things about printed publications is what Craig Mod calls ‘the edges of print’. We all know how great it feels to open a new book — the excitement of a fresh start. But also to be able to finish it, to close it and to move on to the next one. What happens in between those events is quite a linear experience. While magazines are also great for 'quick dips’ and reading in small chunks, most of us start from the front cover and work our way through to the final page. Compare this to consuming content online: how often do we start reading an article only to find ourselves watching a farting cat video because we clicked on a link half-way down the page? There aren’t any edges in digital. This is one of the reasons why printed publications are still such an attractive tool for storytelling. Because content consumption usually flows in a linear direction, editors can create a unique journey that has a clear start and a clear finish. When I first thought about Offscreen and how I wanted to present the content inside, the idea of arranging stories in an engaging way was exciting, but also quite daunting. The first step towards clarity and action was to define some basic boundaries, like the page count and the dimensions of the publication. Once I had some physical limits, I experimented with typography and grids within Indesign, trying to come up with a versatile set of ‘templates’ and a consistent visual direction. I won’t go into detail about this phase here, but let’s just say I bought a lot of font licenses (which I didn’t end up using) and printed out a ton of sample pages in the process."
