["https://offscreenmag.com/blog/replacing-ads-with-sponsorships"]
title = "Replacing ads with sponsorships"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I love discussing common challenges of producing a magazine with other publishers. One topic that always comes up is advertising, or rather, the need for third parties to help fund the production of the magazine. For most small publishers dealing with advertisers is considered a necessary evil – a small sacrifice in editorial freedom to make the larger vision possible. Unless you are an established newsstand magazine like Monocle, Frankie or Vogue getting high-profile companies to advertise in your publication is really hard. It’s much more likely that you end up working with smaller companies that on one hand are often much more accessible and passionate about your product, but on the other hand don’t have the creative manpower to come up with high-quality artwork for their ads. Editorial designers spend hundreds of hours creating a beautiful experience for their readers, so it really hurts when cheap ads disrupt that experience. When I started Offscreen I was trying to come up with a system that is less intrusive. I replaced annoying quarter-, half- and full-page ad slots half-way through an editorial piece in the magazine with sponsor pages: eight companies present themselves in a very subtle, unobtrusive, unified way in the center of the magazine. I don’t make a secret of relying on those companies. They help make Offscreen possible. In fact, they now cover pretty much all of the production cost of an issue. This idea worked out surprisingly well for everyone involved. It really does create a win-win-win situation. After the first issue went out and people started sending me feedback, I received lots of comments about how nicely designed and beautifully integrated the sponsor pages are. In fact, many readers told me that, for the first time ever, they read every single word of a magazine from cover to cover – including the ‘ads’. I get a sense that most readers don’t just not mind them, they actually find them valuable. If they haven’t heard of one of the sponsors before, they are very much inclined to check them out because they trust Offscreen and know that I won’t feature companies that provide no value. At best, my readers consider the sponsor pages a catalogue of suggestions. At worst, they flick through them acknowledging the fact that these companies made the magazine possible."
