["https://offscreenmag.com/blog/on-growth"]
title = "On Growth"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. It was some time between issue No8 and No9 that I became a little more comfortable. I was preparing my quarterly business activity statement for my accountant, sitting at one of my regular cafés in Melbourne. Crunching numbers isn’t one of my strengths, but I don’t mind doing the necessary admin work. After all, as a sole trader I should keep an eye on how well (or badly) I’m doing, right? I realised then and there that I’m doing just fine. Not amazingly well, but not too badly either. I could order another coffee with confidence, for sure. But having earned a little more money that quarter compared to the previous one was not what made me feel comfortable. It was the following thought process and the answer I arrived at. For most entrepreneurs, the idea of having to do better this month than last is constantly on their mind. If you spend much of your working day online like I do, you’re frequently reminded of how much everyone focuses on getting bigger and more profitable. Growth hackers. Content marketing. IPOs. Everyone is chasing the hockey stick. And everyone is anxious about being left behind. I get a lot of “How is the magazine going?”-type of questions when I meet readers in real life. I always wish I had some astounding numbers to report. How the magazine subscribers have quadrupled in the last quarter. How the new issue sold out over night. How I’m struggling to hire enough people in order to keep up with demand. It’s what we’ve come to expect from internet success stories. But that’s not the truth in Offscreen’s case. The truth is that Offscreen has seen very slow growth. I started with 3000 copies and it took me 11 issues to justify a 5000 print-run. The truth is that some issues do better than others depending on a range of factors, none of which seem very predictable. The truth is that the magazine still doesn’t make enough money to hire more than a few temporary freelancers. (More on that in coming blog posts)."
