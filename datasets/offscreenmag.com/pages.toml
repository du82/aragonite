["https://offscreenmag.com/issues/20"]
title = "Offscreen Magazine Issue 20"
description = "Interviews with Richard Pope, Amber Case, Aza Raskin, and Tricia Wang."
full_description = "Richard Pope Ensuring a more open society in the digital age by putting power back in the hands of citizens and consumers. Amber Case The Calm Tech pioneer offers a more elegant, humane, and unobtrusive approach to designing technology. Aza Raskin Guarding the sanctity of the human mind: can we regain our attention and keep our grasp on what’s real? Tricia Wang Big Data needs Thick Data: an ethnographer’s call to fight quantification bias and make the unmeasurable visible. “There should be a way that society can trust that if something goes wrong, it’s possible to inspect the code.” ‘Software is politics.’ Richard Pope strongly believes that digital products and services directly affect how power is distributed. That’s why he has dedicated much of his life to helping create a more open society that works in the digital age. It’s a thread running through his career: first as an integral part of the UK’s Government Digital Service and later at Projects by IF, where he showed organisations how to navigate a sea of regulatory and ethical challenges and build trust around private data. He recently announced his departure from IF, and his move to the Harvard Kennedy School as a Senior Fellow. Because of his deep insights into the public and private sectors, Richard has become a respected advocate for more transparency and accountability in both spheres, encouraging an open discussion about what sort of society we really want to live in. “The most interesting people are calm and collected. They understand the long-term versus the short-term, and they build things slowly. The real world takes a long time.” In her writings, research, and dynamic online presence, self-described ‘cyborg anthropologist’ and UX-designer Amber Case examines how our relationship with information changes the way we under- stand our world. Through her pioneering work in ‘Calm Tech’, the fellow at Harvard’s Berkman Klein Center explores ways we can protect our attention and recapture our sense of purpose and identity. Finding inspiration in that calmness, Amber is carrying on a family tradition – both her father and grandfather worked on early AI – as she seeks ways to design a balance where technology and humanity are both at their best."
