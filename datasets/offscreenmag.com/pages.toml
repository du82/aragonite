["https://offscreenmag.com/blog/results-reader-survey-2017"]
title = "Results of our reader survey"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. A couple of weeks ago I asked you to fill out our reader survey so that I could get a better picture of my audience and collect some basic feedback along the way. 554 of you submitted answers. Thanks so much! You can view the results of the multiple choice questions here: Of those who answered the two open-ended feedback questions (one on Offscreen Magazine, the other on Offscreen Dispatch) the vast majority had nothing but praise. I'm always flattered by this (thanks again!) but of course it's the critical feedback that helps me improve and make changes. Though, the contradictory nature of the responses really surprised me. Here are some verbatim answers: A few of the interviews lately have been less tech-industry focussed which is fine and understandable, but isn't my personal preference. Not a huge issue, though! – vs – Broaden the industries you cover in the magazine and also cover photography, art, illustration, typography, etc. Bring back the glued binding. This new one looks so very wrong. – vs – I like the redesign, especially the binding. I love the longform articles. Such a treat to have some well curated, deep discussion. The tone of voice is ace too. More of these would be welcome. – vs – Interviews can be very long and it's not fun for readers with limited attention span. Perhaps more bite-sized articles and features would be good. Focus on industry leaders. Julie Zhou was a big name which attracted me to that last issue. – vs – Interview less known people, from non-english speaking countries. I was a bit disappointed to see Julie Zhuo on cover of the new mag. She's too 'mainstream'. Keep it up with the diverse voices please! – vs – More diversity! The magazine is still mostly white guys in the U.S. Let's get some gender/racial/ethnic/geographic diversity in there. This is just a small selection. Reading through the hundreds of entries, it felt like almost every piece of feedback was immediately annulled by the next. To be honest, I'm not sure if I actually can take anything away from it. Perhaps that by landing in the middle I'm doing it right? I'm not sure."
