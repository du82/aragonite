["https://offscreenmag.com/blog/the-disaster-factory"]
title = "The Disaster Factory"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I’m a programmer, and therefore live in a world of worst-case scenarios. Networks fail, hard drives crash, and those troublesome human beings persist in disgorging all sorts of nonsense into every interface my software has. Computers are incredibly complex and delicate systems, and they fail in dramatic and unexpected ways, without warning, every day. In an environment as insanely chaotic as our modern technological infrastructure – made up of the most advanced science we have, and often held together with chewing gum and good intentions – the only rational response is a deep and abiding paranoia. Experience has taught me to see my software as a writhing mass of Achilles’ heels, a horrific Shoggoth, every line of code a potential disaster. And so I wrap each in a thick, protective layer of negative assumptions, so that when things do go wrong – and they will – the program can (best case) recover quickly or (worst case) not actually kill anyone. I wish I was exaggerating. Twenty years ago, a few weeks into my first professional programming job, I read a story about the software in a certain type of X-ray machine. An overflow bug had been found, and the upshot was that the machine had been accidentally mega-dosing every 256th person it scanned, effectively giving them cancer. Paranoia doesn’t seem response enough. By the way, don’t mention this at parties. People tend to look concerned and then sidle away. And never follow up with the story about the rocket that exploded because of a misplaced semicolon. But programmers – engineers of all stripes – can’t afford to look away. They need a relentlessly negative outlook, to come up with the most horrific thing imaginable, add contingencies to prevent it, and then invent something even worse. It’s what keeps our mechanised world ticking along, what keeps most catastrophic failures safely theoretical and leaves computers merely frustrating instead of murderous. While most have heard of Murphy’s Law – “Anything that can go wrong, will.” – only the nerds know Finagle’s corollary: “...at the worst possible moment.”"
