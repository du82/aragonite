["https://offscreenmag.com/blog/save-yourself"]
title = "Save Yourself"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Not too long ago, while sitting in my office, I took off my glasses, put my head in my hands, and cried. It was the culmination of the toughest year of my working life, and more specifically, of my fifteen years of running a company. As I squinted into my dark, brackish palms, I had visions of laughing with my co-workers over a drink after sales pitches, celebrating project launches, and laying carpet squares, prepping our beautiful new office. It all came rushing back in a Vaseline-lensed retrospective. If you invest a lot of time in something you’re passionate about, it becomes a part of you. For me, that passion happens to be running a company. And after a while, you have no longer a say in the matter. Whether you’re cutting grass, driving, or sleeping, you’re thinking about just one thing. It’s an involuntary response, like breathing. Or recoiling when you see Guy Fieri. Back then I knew I had to start my own company, because I was so often disappointed by other people I worked for. They didn’t take time to get to know you. They were short-tempered. They didn’t participate in the business anymore. And while I sensed they once inspired people, I saw little evidence of it myself. They appeared beaten down. So I decided to create the company I longed to work for. In the beginning, it was just a small group, and it felt like family. We had fun, and things felt effortless. I sold the work, managed projects, and designed websites. We were swamped with opportunities, so much so that we had the luxury of selecting the clients we wanted. There was almost no overhead, and the projects paid well. The industry was still blossoming, and while we weren’t a big fish, we were one of only a few in our pond. At one point, the opportunist in me realised that hiring more people would enable us to take on more work. Soon, we were ten, then fifteen. People would ask me, “How many people do you want to grow to?” and I’d respond, “No more than twenty, that’s for sure.” In 2011, we had a headcount of twenty-four. A merger and an additional business partner later, we’ve added ten people on top of that. Before I knew what hit me, we had multiple layers of management, closed door strategy meetings, and multiple project teams. We relied on messaging systems to communicate instead of speaking to one another face-to-face. It led to unconstructive backchannel communications, conflicting roles and responsibilities, and people not taking vested interests in one another – myself included. A young employee once came up to me and said, “I had no idea you were once a web designer. I just saw it on your LinkedIn profile.” Of course he didn’t. It was maybe the third conversation we’d had, and he’d been with the company for almost a year."
