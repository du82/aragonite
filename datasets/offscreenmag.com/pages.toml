["https://offscreenmag.com/blog/issue-23-out-now"]
title = "Just launched: Issue 23"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Today we’re releasing Offscreen Issue 23! As usual, first some house-keeping: subscriber copies are being sent out later this week and we’ll do another big round of shipments next Monday! If you’re not a subscriber, go ahead and order your copy now to be part of one of our first shipments. Please note that due to COVID-19 many shipments, especially those going outside the EU, will take longer to arrive! As always, we relied on the generous support by our sponsors to make this issue happen: Float, Bakken & Bæck, DNSimple, SuperHi, SiteGround, and Basecamp. And of course, a big ‘thank you’ to all Patrons of this issue. As a publisher guided by strong ethics on inclusivity, I recognise that I have failed to live up to my own standards. While I have taken steps to diversify our overall list of contributors in recent years, the people we interview have still been overwhelmingly white, with this issue featuring an all-white interviewee line-up. As I described in my newsletter (see issues 90 and 91), it took recent events in the US to make me realise how much I have neglected to truly educate myself about racism. Sadly, it has taken twenty-three issues of Offscreen for me to come to see how my shortcomings as a publisher have contributed to systemic and institutionalised racism in our world. As a concrete, immediate step, I will donate 10% of net sales of issue 23 to The National Justice Project, an Australian non-profit that takes strategic legal action to advance social justice, with a focus on First Nations communities and asylum seekers. I have already made a donation of $1,712 based on sales of issue 23 to Offscreen subscribers (receipt here). I will publish another update later this year with the amount of additional donations made. As I now try, like so very many people – including countless colleagues, friends, and Offscreen readers around the world – to more fully educate myself about racism through the many resources and tools available, I’d like to make a public commitment to do better: there will never be another issue of Offscreen with an all-white interview line-up."
