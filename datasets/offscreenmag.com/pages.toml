["https://www.offscreenmag.com/blog/topic:production"]
title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Email is a medium most of us had written off when social media came around. Yet, as a small business owner there is not a more powerful marketing tool than a well-maintained newsletter list. I'm an avid Twitter user too and I do get a lot of referrals from re/tweets, but it pales in comparison to the visits, sales, and replies I get from email campaigns. (By the way, Facebook as a promotional tool is completely useless unless you are willing to turn your messages into paid ads which, in my opinion, always feels a bit disingenuous.) For the launch of issue 17 I sent out an email to the ~10,500 people on my 'Offscreen Updates' list. This list is separate from my weekly Dispatch list and I usually only email subscribers of that list once or twice in between issues to inform them about the status of the next issue. If you have ordered anything from the Offscreen website in the past, you've been added to that list automatically. As such, this list consists of current and past customers – some are just following along passively, some buy issues occasionally, some are active subscribers of the magazine. Four months in between issues is a long time to remember what you last ordered, so I use my launch newsletter to inform everyone about their individual order or subscription status. Here's how I make that email as relevant and clear as possible... Disclosure: I'm using MailChimp, a current Offscreen sponsor, for my newsletters. It's possible to achieve similar outcomes with all major email marketing providers. This post was not commissioned or paid for by MailChimp. My custom order management system is connected to MailChimp via their API. This allows me to sync the following data about each customer to my MailChimp list: Besides the obvious ones, like email and name, I also sync the number of the issues they bought (ISSUES), the type of subscription they have (SUB) and an authorisation code (AUTH). The auth-code is a string of numbers and letters unique to each customer. I use this auth-code to enable existing customers to log into their Offscreen account, but I can also use this code to send them to the Offscreen checkout page with their shipping details pre-filled."
