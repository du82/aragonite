["https://offscreenmag.com/blog/meet-kieran-ohare"]
title = "Meet our sub-editor and proofreader Kieran O‘Hare"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Kieran O‘Hare my proofreader and sub-editor since issue No11 and has been hugely helpful in improving the overall quality of Offscreen’s writing. I asked him some questions about working on Offscreen and his many talents, one of which is publishing a magazine himself. Kieran: My name is Kieran O’Hare. I currently live in the northeastern U.S. in Portland, Maine. I have fallen (pleasantly!) into the role of copy-editor and sub-editor of Offscreen. When I’m not buried in an endless Google Doc with you, I lead a sort of double existence as a musician and an independent magazine publisher. On the musical side, I work around the world in music performance, as well as musical design and artistic direction for the stage. I play Irish traditional music on an instrument called the uilleann pipes, which is the uniquely Irish form of bagpipes, and I serve on the Board of Directors of an organization in Dublin called Na Píobairí Uilleann, which works for the preservation and spread of the uilleann pipes. I’m typing this from an airport in Baltimore, as I’m making my way home from recording a second album in Chicago with my trio, Open the Door for Three. While being a professional piper might be enough of a kamikaze mission in itself, I recently co-founded a brand new quarterly print magazine about Irish culture and people at home and around the world, called Éirways. I and my partner, designer Kevin O’Brien, just launched our first issue, and it’s going very well so far. It’s been an exciting and very fulfilling process. I’m already buried working on Issue #2, which we plan to launch around October 1. I’m fairly basic when it comes to technology, but I’ll try anything to see if it simplifies things for me. My basic arsenal on the road is my 11” MacBook Air, an iPad (with the White Noise app to make hotels bearable), and an iPhone. Pages, Skype, Facetime, and Gmail are constantly open and often in use. Squarespace – surprise, surprise – is the home for Éirways magazine. Thanks to you, Google Docs is always there too. Oh, and pens. I like pens. Lots of them. And paper: the good stuff."
year_published = 2025
