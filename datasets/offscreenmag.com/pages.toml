["https://www.offscreenmag.com/issues/21"]
title = "Offscreen Magazine Issue 21"
description = "Interviews with Kim Goodwin, James Bridle, Renée DiResta, and Nathan Schneider."
full_description = "Kim Goodwin The leadership coach believes effective human-centred design requires better decision-making – not pixel-pushing. James Bridle Rise against the machines: the artist and writer warns of a future clouded and dominated by technology. Renée DiResta The research pioneer who helps to expose the spread of disinformation and conspiracy theories on social media. Nathan Schneider Making work work for all: the cooperative model as an alternative to the robber-baron tech economy. We wouldn’t dream of steering a car solely by staring at the dials on the dashboard, yet we’re comfortable running companies by a myopic fixation on metrics. As we come to terms with the harmful consequences of even the most well-intentioned software, Kim Goodwin calls for a renewed focus on the human aspect of our work. Referring to historical precedents and best practices in other industries, the author and leadership coach puts forward a more human-centred design approach that’s driven by values, not metrics. Kim urges designers to think less about pushing pretty pixels, and more about their role in the ‘decision tree’ of an organisation – the epicentre of where design’s ethical framework is put into place. “I don’t think the idea that media has been democratised by the internet is true. It’s just been concentrated into an entirely different place.” How to describe James Bridle? Perhaps his vast and highly articulate work as an artist, journalist, writer, and technologist places him into that rare category of ‘public intellectual’ for our times. James explores how the hyper-connected digital world intersects with the physical, analogue one in which we all live – and the implications of this clash. He is never afraid to explore the darknesses that threaten our reality, as we increasingly live in a world whose complexity dwarfs our ability to understand it. We are – as he shows in his book New Dark Age – obsessed with measuring and modelling things, and increasingly the victims of our mistaken conviction that this will allow us to comprehend our present and control our future."
