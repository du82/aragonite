["https://offscreenmag.com/blog/magazine-subscription-management-system"]
title = "Building a custom magazine subscription management system"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. This post is an edited version of an email from September 2016 that was part of my Rebranding Diary. You can see much of what I discussed in that email live on our website now, like our multi-tier subscription model that charges readers on a per-issue basis. Offscreen’s original order management system (OMS) has served me very well over the years. It solved a fundamental problem every magazine maker faces: managing orders for single issues and for subscriptions (which are essentially orders for future issues) in one place, while keeping customer data up-to-date and optimising orders for shipping. It connected directly with PayPal’s IPN system, which has its flaws (like everything PayPal-related) but is extremely easy and fairly flexible to run. When we created this system almost five years ago, there were a lot fewer out-of-the-box ecommerce tools available. Today, between Shopify, Squarespace, bigCartel, and a whole host of other shopping cart apps, it begs the question why I should develop my own customer and inventory management tool. While the above mentioned apps are extremely powerful (especially Shopify with its own app store), they don’t exactly suit indie magazine makers who often publish new issues infrequently and rely heavily on subscribers to manage their cashflow. Available subscription management plugins don’t cater for this type of product either. Most subscription SaaS products either focus on digital subscription management or sell monthly subscription boxes which are completely different beasts to printed publications that come out every few months. While customising these tools is possible, they are just not meant to be used that way. I also don’t use any of the larger fulfilment services like Shipstation or Shipwire because Offscreen is shipped through a small logistics company in Berlin. Their low handling fees combined with German Post’s low postage makes shipping Offscreen around the world possible. Going through a small service provider like that also means I don’t have any fancy APIs to work with – instead I export a weekly order sheet in the form of a CSV file and make it available to my shipper in Berlin."
year_published = 2025
