title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Last year I got a surprise of my life, Offscreen Magazine. I found the first issue in an art and design book shop in Clerkenwell, London. At that moment paying £8 for the mag was not easy while this tiny amount of money once fed me for nearly a week. So actually I didn’t buy it at first. However the elegantly taken cover photograph called me in my dreams continually even I had no idea what it was about. I knew I needed to buy it asap. I went back to the book shop a couple of days after and found it at corner of the bookshelf. I fell in love with it immediately. It was not only because of the beautiful look, but also the people and their stories reminded me something I used to do/have. (Now I am more than happy that I made a correct decision especially when many people moan that they missed the first issue.) More than 10 years ago, an era when there were tables with backgrounds, Java Applet water reflections were everywhere, CSS was only for decorating text and hyperlinks, Macromedia ruled the animation world with Flash and Blackberry was only known as a fruit. I graduated from uni with a degree of digital design. I learnt how to construct a website day and night. When I was in high school, I built several websites for my own interest. I used to love web design so much! However I was disappointed with the reality in this field — no fixed deadlines like print media, people didn’t respect it enough. So I dropped out and became an editorial designer since I always collected beautiful and informative magazines. I do a very good job at balancing text and pictures together nicely. But when I have been getting better and better at InDesign and the user-interface of Dreamweaver seemed to be more and more unfamiliar, I thought I would be labeled as an editorial designer for my whole life and would never have any chance to code again."
