["https://offscreenmag.com/issues/23"]
title = "Offscreen Magazine Issue 23"
description = "Interviews with Rachel Botsman, Bruce Schneier, Seth Godin, Genevieve Bell"
full_description = "Rachel Botsman The trust expert challenges what we think we know about power, control, and the truth. Bruce Schneier Hacking society: how tech and policy must come together to face the threats of our interconnected world. Seth Godin The marketing pioneer and online ‘ruckus maker’ on doing work that matters for people who care. Genevieve Bell Keeping the humanity in technology in a future of artificial intelligence and cyber-physical systems. “We do not think enough about what we believe and why we believe it. What is our filter? What is our perception of reality? What is the trigger that has made us think something is true?” Trust, the age-old currency of all our interactions, is being transformed by technology. According to Rachel Botsman, rapid technological change demands ever larger ‘trust leaps’ from us as we try to navigate the many new unknowns in our lives, our work, and our societies. As a leading expert and author on trust, she aims to challenge and change our understanding of power, influence, truth, and the many other factors that influence how, whom, and whether we trust. Indeed, ‘Who Can You Trust?’ is the title of Rachel’s most recent book – and it’s a question we can’t afford not to ask in this era of pandemic lockdowns, deepfakes, and data exploitation. “It’s no longer sustainable to pretend that your system ends at the keyboard and screen. It encompasses the people who use it and the society it is embedded in.” A strong, independent voice on privacy and security, Bruce Schneier has for decades called attention to the fragility of the internet and of our tech-dependent world. As the author of over a dozen books – including his latest, Click Here to Kill Everybody – a fellow at Harvard, and an advocate in the private sector, his work helps us understand the delicate nature of the digital and cyber-physical systems that hold society together, so that we may better defend them in the face of threats both old and new. A leading voice in the emerging field of public interest technology, Bruce is urgently calling for a new generation of professionals who can speak tech to power."
