["https://offscreenmag.com/blog/name-your-price"]
title = "Name Your Price – a pricing experiment"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. After reading Robin Sloan’s fantastic piece about rethinking the idea of the static price tag, I came back from my holidays dying to experiment with flexible pricing myself. From reading about other experiments I knew that giving people the choice to pay (next to) nothing usually attracts a lot of opportunists that care more about scoring a bargain than paying for something they really appreciate. So I was expecting the average price paid to be well below the standard price for a copy. And so, in order to decrease my chances of losing a lot of money in this exercise, I decided to set a few limits. Here is what the experiment looked like: In the first step, visitors could pick one of the available back issues. I intentionally didn’t make future issues available for pre-sale because, well, selling things I haven’t even produced yet for potentially less than cost price is a pretty dumb thing to do. The second step offered a slider to define your own price — from $5 at the minimum to $38 at the max. With $5 as a minimum I could at least minimise the impact of a worst case scenario and have some of my shipping cost covered. I chose $38 as a maximum amount simply because it would put the handle of the slider right in the center at $22 (the regular price), which was also the default setting when opening the page. Just below the slider I offered a bit of insight into how the chosen price affects Offscreen as a business. Here are the tiers and their message: $5 – $7: Significant Loss If all copies sold at this price, Offscreen would generate a significant loss, killing the magazine instantly. $8 – $10: Small Loss If all copies sold at this price, Offscreen would generate enough money to cover shipping, but would still struggle to pay for other expenses. $11 – $13: Break-Even Point If all copies sold at this price, Offscreen would generate enough money to break even on expenses, but the publisher would essentially work for free full-time."
year_published = 2025
