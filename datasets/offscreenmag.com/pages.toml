["https://offscreenmag.com/blog/page:2"]
title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Just a quick note to let you know that the next issue of Offscreen will be delayed until international logistics has returned to some form of normality. While most shipments still get through at the moment, there are long delays in some countries. Sending a new issue to 1000+ readers around the world with that much uncertainty makes little sense. So I’ve decided to pause the publication until there is a light at the end of the COVID tunnel. In the meantime, our online shop remains open and we fulfil orders as usual (much appreciated!) – just expect some COVID-related shipping delays. In the early days of this pandemic, a wave of appreciation for the internet washed over us. Confined to our homes, we figured out how to use our digital tools in earnest – to check in on each other, to stay informed, to work and play together. Some heralded it as the internet that we were supposed to get: one that elicits connection, not conflict. During the weeks that followed, the internet morphed into an existential lifeline for many. With no access to public physical spaces, we found ourselves relying on private virtual spaces. Suddenly all of our interactions and transactions occurred on the backbone of just a handful of privatised services. A dream come true for Big Tech. Social isolation perfectly complements Silicon Valley’s business model of ‘frictionless convenience’. Endless entertainment, news, shopping, and socialising, all without having to navigate the insanitary physical world – a risk we outsource to low-income gig workers. Eliminating reasons to go outside was already a winning strategy, but even the most bullish growth hackers couldn’t foresee the boon from a society in quarantine. In panic mode, our governments, too, have turned to tech solutionism. In what writer Naomi Klein calls the ‘Screen New Deal’, hastily signed public-private partnerships in mass surveillance and data collection promise to bring us out of isolation and into a ‘smart’ future, one where our health records and location data could be blurred into our shopping personas and search profiles."
