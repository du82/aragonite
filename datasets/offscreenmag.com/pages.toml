["https://offscreenmag.com/blog/letter-to-the-editor-5"]
title = "Letter to the editor"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I just wanted to write you a brief note of appreciation. I am in the process of launching a magazine, and I wanted to let you know how much of an influence and an inspiration you have been. I have never functioned heretofore within the world of web design or app development or anything even vaguely computer-related. Yet, I read every issue of Offscreen from cover to cover, with great relish and enjoyment. The publication itself is what I have come over the last few years to seek, to demand, from the printed word: that is, a tranquil and beautiful diversion from work, from hassle, from being online all the time. Offscreen gives me what I have always sought from books. An escape, a stimulation, a diversion: ideas in physical form. A beautiful one, in this case. Moreover, I am staggered, and astounded, by the generosity you have shown in putting in the time to keep your blog going. You cannot imagine what an impetus and source of guidance your experiences, your honesty, and your transparency have been. I have read the whole thing, from your first post, and you have saved me huge amounts of time and hassle as you have kept me thinking of things that wouldn’t have occurred to me until it was too late! Whenever I’m having a hard time working on the next issue (which is often), I look through the Letters tag on my blog and read humbling emails such as this one to cheer me up. You guys are the best readership a magazine can wish for! Published from Melbourne, printed in Berlin, read around the world: Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us. Offscreen is supported by sponsors that understand the value of unobtrusive advertising and a great reader experience. Current sponsors:"
