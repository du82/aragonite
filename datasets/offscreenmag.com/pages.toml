description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. In a picturesque valley, nestled in the southern alps of Japan’s Yamanashi prefecture, lies a traditional Japanese hot spring hotel, an onsen. It’s not big. There are fewer than 40 rooms. Unlike other typical onsens, which operate during certain hours, the baths at this onsen are open 24 hours a day to serve its patrons. The water is of the highest quality – pure, alkaline, neither artificially heated nor treated. The meals served aim to 'balance taste, texture, appearance, and the season'. Fresh, seasonal ingredients are used, foraged and caught in the nearby mountains and rivers. The staff are hardworking, courteous, and committed to exemplary service. They embody omotenashi: the spirit of selfless service and humble hospitality. With an understanding that each of those they serve has different needs, there is a desire to put their patrons first, personalise their experience, and exceed expectations. The staff are dedicated not to reaching the top of the corporate ladder, but instead to protecting the onsen, to help it thrive and preserve it for years to come. They have done so for many, many years. Over 1,300 years in fact. Established in 705 A.D., Nishiyama Onsen Keiunkan is the oldest company in the world. It opened during the Middle Ages, before the Islamic Conquest of Spain, a full millennium before the Declaration of Independence of the United States of America. When the onsen opened, the country of my birth, New Zealand, had yet to be discovered by our Maori ancestors. And in all that time, this onsen has been operated by the same family – currently in its 52nd generation of continuous management. Some members of staff have held the same post for generations, passing it from parent to child, child to grandchild, grandchild to great-grandchild. The onsen has stayed small. They know what they do, and they do what they know. Their focus on service is relentless. They are a team united in its mission to protect, to nurture, to tend to, to keep alive – a delicate balance of continuation, innovation, and dedication that has endured for hundreds and hundreds of years."
