["https://www.offscreenmag.com/issues/19"]
title = "Offscreen Magazine Issue 19"
description = "Interviews with Jocelyn K. Glei, Angus Hervey, Ashleigh Axios, and Bryce Roberts."
full_description = "Jocelyn K. Glei A curator’s attempt at finding creativity and meaning in a world of fake productivity and infinite distraction. Angus Hervey Preventing dystopia through optimism: the political economist on a mission to prove that science and tech can save us. Ashleigh Axios The creative director of Obama’s White House calls on designers to tackle the biggest challenges of our time. Bryce Roberts No more chasing the unicorn: the venture capitalist with a fairer and more humble investment strategy. “We’ve become very good at making time for busy-work, and very bad at making time for our best work.” Jocelyn K. Glei wants to empower everyone to find meaning in doing their best work. Through her podcast, ‘Hurry Slowly’, her talks, and her books, she strives to show us the way to walk the best paths around the pitfalls of tech’s addictive new tools without falling into the traps of anxiety and fake productivity. Her ultimate goal? To teach us how to be creative and insightful, avoid burnout, and leave ourselves open to ‘great ideas and deep work in the age of distraction.’ “We’re in this wash of unintended consequences – ‘black swan’ events that are spiralling around us.” Rather than perpetuating the widely-held fear that our world is getting worse and worse, political economist and journalist Angus Hervey believes that our future is brighter than we think. He is optimistic that we are at a moment in history when the entire world can make the choice to take part in a process of great change that is positive and full of hope, and that is even now advancing humanity beyond our wildest imaginations. As he blends others’ ideas with his own through his talks, his writings, and his platform, Future Crunch, he spreads the news about how the vastly disruptive technological breakthroughs of our time will affect our lives, our economies, and our society. “We need to shift the focus of some of the most talented designers away from things that are already working pretty well but serve a few people, to the things that are badly broken that affect entire communities and cultures.”"
