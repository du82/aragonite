["https://offscreenmag.com/blog/offscreen-diversity"]
title = "Yes, Offscreen (too) has a diversity problem"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. A few weeks ago, when I was still in the middle of wrestling through the content for issue No12, there was a point when I realised that the line-up on the cover would be uncomfortably homogeneous: Everyone is white. Five blokes, one woman. I once again hadn’t delivered on my own promise of promoting diversity. And it weirdly snuck up on me, too. About a month prior to that I had confirmed an encouraging list of three women and three men, all of whom had assured me that they were interested and would be able to make time for an interview. All of my candidates seemed excited to be on the cover of a print magazine. But, of course, it didn’t take long for my hopes of finally getting a more balanced line-up to crumble. When people drop out, they usually don’t email me with a clear “Sorry, I can’t do it!”. I understand that everyone is really busy. So part of my process is that I frequently I follow up via email and Twitter over several weeks, treading the fine line between reminding them of deadlines and being too pushy. Typically I get “I’m on it!” or “I will start this weekend!” responses until eventually they either send me a brief note (“Too busy after all, sorry!”) or they simply stop replying. That’s the reality of doing long-form interviews over the internet. The line-up I had worked so hard on fell through once again. (In fact, there was a moment when it was unclear whether Ariel Waldman would be able to finish the interview, which would have meant that we’d be left with 100% dudes on the cover.) With more than half of my line-up not responding, I was already running late and getting really anxious about it all. You may remember my blog post about being stuck in The Swamp. Well, that was it. Of course, after 11 issues I somewhat anticipated these problems so I already had a list of folks I contacted to ‘fill in’. But telling busy people that you want to do a 5000-word interview and an extensive photoshoot with them on short notice often results in nothing but a friendly 'maybe we can make it work for the next issue’. And so I frantically went through my contacts and my contacts’ contacts to find worthy replacements…"
