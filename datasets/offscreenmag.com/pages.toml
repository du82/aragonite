["https://offscreenmag.com/blog/topic:letters/page:2"]
title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Thank you so much for the offer, I actually buy my copies at an independent magazine kiosk in Santa Monica, Ca since I’m a bit impatient when it comes to shipping haha. I wanted to say thank you for making such an amazing magazine. As someone who lives in the growing “Silicon Beach” part of southern California and works for a few tech companies, this magazine has given me so much confidence in pursuing more opportunities in tech. I love how personal your magazine feels. I read a lot of independent magazines from Hello Mr. to Human Being, The Happy Reader, The Great Discontent, Saturdays, Monster Children, Cereal, and the recently published Avaunt. What I like most about yours and other publications with similar dimensions is that it’s the perfect size to take around but also to leave out on the coffee table. I know you take careful time in choosing the paper and I have to say that hard work doesn’t go unnoticed, I would buy the magazine for the paper quality and smell alone. Those smaller details that may go unnoticed if sitting on a shelf amongst other widely spread commercial magazines are exactly the reasons why I seek yours out and only buy directly from you or from an independent seller where I know the money keeps you both in business. I really appreciate the colors you choose, the fonts you use, the advertisements sections, and my favorite: the side notes. Thank you so much for putting this out and continuing to share the behind the scenes processes that go into the creation of the magazine. All the emails you share, blog posts you write, and just every interaction to keep the magazine human makes me as a reader truly feel as if I’m supporting a friend by buying, reading and admiring their work. I hope you’re doing well! I just wanted to send you a picture of me reading my Offscreen issue 10 with my four-month old, who happens to sort of be named after you. My wife and I were trying to think of names one day and an issue of Offscreen was on the coffee table and I remembered meeting you at XOXO. I asked her what she thinks of “Kai”. We were trying to find a name that works easily in English, Chinese and Japanese and it fit the bill. The name made the short list, then the list and in October of last year little Kai was born :-)"
