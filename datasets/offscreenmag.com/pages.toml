title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. It's been seven years since I started working on the first issue of Offscreen. And today I'm happy to announce the release of issue 20! To celebrate, issue 20 is printed with a special metallic Pantone colour throughout. It looks surreal. You don't want to miss this one! We're also dedicating eight pages in the back of the issue to revisiting all of our previous interviewees to find out what they've been up to. Issue 20 will start shipping in the next 48 hours. To be part of the first big batch leaving our warehouse, make sure you order your copy today. As a subscriber you will automatically receive the new issue, but it’s worth checking your account occasionally anyway to make sure that your shipping details are up-to-date. The access link to your account can be found in the confirmation email you received after your initial order. Can’t find the email? Request a new link on my.offscreenmag.com. This issue would not have been possible without the support of our generous sponsors: Bakken & Bæck, Harvest, Help Scout, Hover, SiteGround, Made by Many, Simplecast, and Ueno. And of course, a big 'thank you' to all Patrons of this issue. A special shout-out to Kieran O'Hare who conducted the interviews and helped with editing the issue. (Hire him if you need editing help!) Don't forget to share your feedback and photos via Twitter and Instagram once you’ve received your copy in the mail. Any questions, just contact us. Enjoy your Offscreen time! In time for the lovely spring weather here in Germany, issue 19 launches today and will start shipping early next week. To be part of the first big batch leaving our warehouse, make sure you order your copy today. As a subscriber you will automatically receive the new issue, but it’s worth checking your account occasionally anyway to make sure that your shipping details are up-to-date. The access link to your account can be found in the confirmation email you received after your initial order. Can’t find the email? Request a new link on my.offscreenmag.com."
