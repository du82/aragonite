["https://offscreenmag.com/blog/indiecon-hamburg"]
title = "IndieCon Hamburg"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. In case you haven’t heard, IndieCon is a two-day conference happening in Hamburg, Germany where magazine makers (some international, but most from Germany) meet to discuss the challenges and opportunities around independent print publishing. It’s an event that targets industry ‘insiders’, with a mix of existing publishers (small and large), aspiring publishers and some general media folks. This year, the organisers added an additional third day and a public element to it: the Indie Mag Day – a flea-market-style trade zone for anyone to discover, buy, and swap magazines of all kinds. IndieCon has only happened twice, but it’s quickly become one of my favourite events of the year. Malte, Urs, Arne and all the friendly volunteers behind it have created something very special. They realised that there is no existing platform for this new wave of indie magazine makers to connect. IndieCon provides this platform in a smart, unpretentious way, while cheekily telling the larger media world to take note. It manages to briefly put the spotlight on the hidden creativity that can be found in small publishing projects. Thank you for putting on a great event, guys! For me, it was the added Indie Mag Day on Sunday that made the event extra special. Set in an old, run-down warehouse, publishers and stockists presented hundreds of magazines – from small local zines to larger international titles. And what would have been an amazing event for being able to meet likeminded publishers alone, the massive turnout of curious readers, buyers and collectors made it all the more successful for everyone involved. There was an extremely positive vibe in the air: finally, a place for magazine aficionados to geek out! Just like last year, I had many wonderful conversations throughout the weekend. I met a lot of smart, creative people and learned a few things about magazine making along the way. There were two points of discussion that came up several times – on and off stage – that I want to briefly comment on here:"
