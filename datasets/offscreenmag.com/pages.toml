["https://offscreenmag.com/blog/meet-ivana-mcconnell"]
title = "Meet our editorial assistant Ivana McConnell"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Meet Ivana McConnell, who’s written an essay for issue 10 and recently took on the role of editorial assistant for Offscreen (next to her main job) to help me with the upcoming issue. Ivana: My name is Ivana McConnell and right now I’m based out of Vancouver, after stints in Toronto, Glasgow, and Edinburgh. I’m an apologetic Canadian with a weakness for typography, and as of lately I’m Offscreen Magazine’s editorial assistant. My day job is that of interaction designer; when I’m not doing that or working on Offscreen, I’m probably either rock climbing or doing some sort of exercise. It helps me stay even-keeled, and listening to a podcast or some music while cycling helps me turn my brain off for a little while; something I find incredibly hard to do. I’m also trying to make time to learn how to draw letters, properly. It’s my ambition to one day design a typeface. Other than that, I’m usually enjoying a good conversation over a pint or a coffee (depending on the time of day) with my wife, or being dragged around the neighbourhood by our hyperactive jack russell terrier. Aside from the usual (Gmail, Skype, etc.), I’m not much of a tools person; I try a lot of them but nothing seems to stick. What does, I adore: Overcast for podcast discovery and listening, Clear and Captio to get tasks done, Byword to write, and the Longform app for great reads. Also, my wife and I recently had to spend six months apart due to work and a big move, and Evernote and Avocado turned out to be lifesavers. Lies. I think reports of the medium’s death are exaggerated and, in fact, it’s managed to reincarnate and reinvent itself into something that both complements and contrasts the digital, always-on world we live in. It can, like Offscreen, become an excuse to unplug from that digital world or, in some cases, allow us to connect to it in a different way. They encourage us to engage with the world a little bit differently; to create or read them is an act of commitment much different to reading or writing a blog post. There’s an honesty about it all — we know that a printed book or magazine isn’t collecting data on us while we’re reading it — and reading is a focused act that, in today’s world, requires just a little bit more devotion than it used to. We can’t share it with a click, we have to talk about it."
