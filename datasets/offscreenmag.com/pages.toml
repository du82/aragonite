["https://offscreenmag.com/blog/indie-magonomics"]
title = "Indie Magonomics – making a sustainable indie print magazine"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Update – July 2020: A revised, updated version of this long post is now available as a printed booklet and PDF. I’ve come to the publishing world by way of digital/web design. Until launching the inaugural issue of Offscreen I had no prior experience in designing or publishing printed media. Even after producing fifteen issues of Offscreen, I still consider myself a noob in this field – there is still so much to learn! This post is a collection of lessons I’ve learned about the business side of making Offscreen. Before you dive into this very long post, it’s worth noting that Offscreen is largely a one-man show. Therefore, my process probably looks different to that of most of my publishing colleagues. I’m sure people with a long career in traditional print publishing that are part of a bigger team have a very different approach. Every publication is unique. I believe Offscreen is in the very special position of being a print publication for digital folks. While many magazines rely on traditional distribution channels (i.e. retail) for most of their sales, I can directly approach my readers and sell a magazine to them where they already are: online. In addition, Offscreen is a magazine that consists largely of first-person stories, opinion pieces, and interviews that I collect by collaborating with my contributors directly online. As such, I rarely commission writers or journalists. These are all factors that impact the bottom line – how I make money, where I spend it. All this is to say that what works for me, might not work for you. Obviously, there is no golden bullet when it comes to creating a sustainable print publication. Everyone has their own approach. This is mine. Just like on the web, content is king. You don’t have a magazine if you have nothing to say. Leaving the definition of content aside, the food for thought served to your readers is what defines your magazine. Not the paper, not the typeface, not the cover."
