["https://offscreenmag.com/issues/24"]
title = "Offscreen Magazine Issue 24"
description = "Interviews with Ali Alkhatib, Jutta Treviranus, Xiaowei Wang, and Jillian C. York"
full_description = "Ali Alkhatib Algorithmic injustice: the expert on human-computer interaction exposes the biases deeply rooted in Big Tech’s AIs. Jutta Treviranus The inclusive design visionary on why diversity is our greatest asset and inclusion our greatest challenge. Xiaowei Wang ‘Modernity gone off the rails’: making sense of the intertwined systems connecting Shenzhen and Silicon Valley. Jillian C. York The free speech writer and activist grapples with the impossible problem of moderating the world’s speech. “The dilemma that it feels like we’re in now is that we have all of the same problems we had before, but now they’re more technically obscure.” Ali Alkhatib describes himself as ‘an anthropologist shouting at engineers’. But voices like his, it seems, must often strain to be heard above the din of computer science’s feverish quest to find the answer to all the world’s problems by endlessly sorting through data. As the interim director of the Center for Applied Data Ethics at the University of San Francisco, he maintains that algorithmic systems are being deployed into our world so quickly and so pervasively that they are now eroding the very institutions that hold our societies together. Exploring this dilemma through his conviction that ‘technical problems are social problems’, Ali works to bridge the gap between disciplines and communities. He stresses the vital importance of our lived experience – making it possible for those most affected by tech to join in the conversation about our future. He makes the most explicit plea we’ve ever published that society must emphatically assert its right to demand more accountability from the tech giants. The burden is on us, in turn, to radically transform the ways we think about and care for each other. “We need diversity – and we need fragility too – because it compels us to create a system that will work for us at the times when we’re fragile or vulnerable.” Jutta Treviranus is a true design visionary whose mission is to ensure that the many complex systems we build leave no one behind. As the founder and director of the Inclusive Design Research Centre, and professor at OCAD University in Toronto, she is a leading expert on empowering and responding to human uniqueness – wherever and however it occurs. From the advent of the personal computer, through the evolution of the online world, to the AIs that are exploding into our lives today, Jutta works tirelessly to make technology accessible for everyone. But beyond the promise of inclusive design to enable ‘outliers’ to overcome barriers, she offers us a compelling invitation: if we integrate long-term thinking into our design practices, we can create powerful systems to protect us from the unpredictable but inevitable changes that we’ll face as individuals and as a society. In so doing, we have the opportunity to use humanity’s incredible diversity as the foundation for an equitable future."
