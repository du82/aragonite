["https://offscreenmag.com/blog/uniquely-yours"]
title = "Uniquely Yours"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. There is a good chance you’re working on something new right now: an app, a game, an open-source library. You’re enjoying the challenge and the creative process. The final result, you tell yourself, will be useful to a lot of people. Then, over coffee, a well-meaning friend brings up a discovery she recently made online. “Isn’t this pretty similar to what you’re working on?” You put on a brave face, but your heart sinks. Back at home, you critically examine your idea’s doppelgänger and confirm that someone is indeed doing something very like what you’re doing. In fact, they seem further along and have already solved a few problems that had you stumped. You take a deep breath as a wave of discouragement passes over you: ‘I’ve poured so much time and effort into this!’ A strong belief in the originality of your idea had fed your confidence, but now it’s just another version of something that already exists. I recently spent a day with an inspiring book on modern architecture around the world. What struck me was the incredible variety. Just as writers strive to do with words, and artists with paint, architects work to push the boundaries of what’s possible, though they all begin with the same materials and are limited by the same physical laws. Cooking, photography, poetry – and, yes – apps and websites are all similar in that regard. Within artistic pursuits, original, significant expression can sprout from the same ingredients and constraints. We humans tend to be shortsighted, though, and that tendency is nowhere so obvious as on the internet. Whenever a new project is revealed – whether it’s a prototyping tool, a podcast, or a to-do list app – a chorus of naysayers greets it with, “Do we really need another one of those?” The answer is ‘yes’. Always yes. The web provides room for endless varieties of similar ideas to take root and co-exist, each with a unique twist. Niches thrive online. There are designers who wonder why there isn’t a prototyping tool that works the way they think. There are people waiting for the to-do list app that finally clicks for them. And there are many searching for a conference that speaks to who they are and what they stand for."
