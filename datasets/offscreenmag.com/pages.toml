["https://www.offscreenmag.com/about/faq"]
title = "Offscreen Frequently Asked Questions"
description = "Frequently asked questions, answered."
full_description = "How do subscriptions work? All of our subscription plans start with the next issue of Offscreen, paid upfront. After that, we charge your credit card about one month prior to release of every new issue (we publish 2–3 per year). Your subscription keeps going until you cancel or your credit card expires. You’re in full control through your account to which you get access after your order. Can I cancel my subscription any time? Yes, there is no minimum time period. When you subscribe you always pay for the next issue upfront and are then charged on a per-issue basis. At any time, you can change your subscription tier or cancel your subscription through your Offscreen account (check the email you receive after ordering). When do I get my supporter gift? Our little ‘thank you’ gift is automatically sent out with the third issue of your subscription (roughly after one year) – unless you’ve changed to a subscription tier that doesn’t include a supporter gift. How long does shipping take? We ship orders once weekly (usually Mondays) from our warehouse based in Berlin, Germany. Shipping within the EU usually takes 2-7 working days, to North America, Australia, and New Zealand 10-15 working days, and often longer to the rest of the world. (If you order from Brazil, expect customs to keep your magazine hostage for at least a month.) How much does shipping cost? Worldwide shipping is already included in all prices shown on our website. By the way, packaging and shipping accounts for about a third of the price we charge. What payment methods do you offer? At the end of the checkout you can choose between paying with credit card or PayPal. Due to the way our subscriptions work, PayPal is not available for ongoing subscription plans. Do you ship worldwide? Yes, we do. Make sure your shipping address is correct. If your language doesn’t use the Latin alphabet, please email us your address in Latin alphabet characters after your order. (We have to add it by law in Germany.)"
