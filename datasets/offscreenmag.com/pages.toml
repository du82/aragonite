["https://offscreenmag.com/blog/the-grip-of-now"]
title = "The Grip of Now"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I recently got a chance to visit the famous Notre Dame Cathedral in Paris. Most people know it as a Gothic church covered in gargoyles, the home of Quasimodo, or – for the architecture buffs out there – one of the first buildings in the world to use the flying buttress. While all of these tidbits of information are fascinating, what stuck with me was the history of its construction: it was started in 1163, and completed in 1345. It took almost 200 years to build, and it’s still standing 700 years later. Between five and nine builders are credited with the construction; most of them died before its completion. What an odd thing, to commit your life to something you know you’ll never see finished. No addiction to the rush of shipping to keep you going, only solidarity with those working alongside you and the vision of something greater than yourself. In the ’30s, the Empire State Building took just over a year to build. The Willis Tower in Chicago took three. The tallest building in the world, the Burj Khalifa in Dubai, took a ‘seemingly endless’ six years. In our own industry, digital projects are usually measured in weeks or months. Today’s web workers will hold between twelve and fifteen jobs in their lifetime. That averages out to around four years of commitment to each job. And this is all made even more startling when we consider how long our work lasts. Basically, it doesn’t. Apps are outdated almost immediately with the release of new hardware and operating systems. The web is flying by. Our work is fleeting. Ray Kurzweil wrote about the Law of Accelerating Returns back in 2001, suggesting that the rate of technological evolution grows exponentially. This means we won’t experience 100 years of progress in the 21st century. It will be more like 20,000 years of progress at today’s rate. His work explains why we can build amazing structures faster today than ever before. What it doesn’t explain is how this impacts us as makers: how the immediacy with which we can create changes us."
year_published = 2025
