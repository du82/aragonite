["https://offscreenmag.com/blog/topic:essays/page:2"]
title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Lurking in the shadows of your forums, passing silent judgment on your conversations, even joining in if we felt compelled to do so. You didn’t even realise it was us you were talking to, us you were so embroiled in heated debate with. We became good at disguising ourselves, donning ambiguous avatars and cryptic display names, basking in the freedom offered by anonymity. We congregated as our true selves in corners of the internet that you didn’t even know existed. Long before Pinterest and Tumblr became the designated spaces that you – you, with your anxious need to categorise and contain — would relegate us to. We were there. You didn’t really think you were the only ones who could spend hours in the solace of a dark room, illuminated only by the comforting glow of a screen, did you? Softly clacking away at a keyboard, leery of waking up a family who just couldn’t comprehend why you needed to be online at four in the morning. For a young girl growing up online, the internet was a source of sexual awakening. There was the early solicitation for age, sex, and location, and the late-night instant messaging marathons with internet boyfriends. Whether I was perusing the female-dominated, libertine world of fan fiction, or curiously poking my head into a more visceral, male-oriented landscape, I always kept my pointer carefully positioned over an exonerating browser tab, ready to pull the trigger if I heard footsteps approaching my room. The web does not discriminate in its seduction. Its siren call is a whisper of white noise with the resounding wail of a dial tone. It echoed in my ears when I was at school, at the mall, with friends, always beckoning, and insatiable in its demands for my time and attention. Yes, we were there too! Furiously scrolling and clicking in an attempt to escape the banalities of adolescent life. But few noticed. We were erased. Just as we were erased from the pages of history, like our contributions to society and our participation in the wars that toppled dynasties and drew new lines in the sand."
year_published = 2025
