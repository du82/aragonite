full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Eight months back, last December, I got to know about your work and the publication of Offscreen. I am following the journey you have undertaken since and I admire the initiative of yours in bringing to life stories and experiences of individuals whose efforts otherwise remain hidden. I came to understand about the importance and emphasis placed on human interaction, collaboration and coordination in developing something worthwhile on web and beyond and its effects on many facets of life. My life has also been enriched through an endeavour of mine since September, 2012 when I created Lucky Compiler. While chronicling the lives and creative processes of personalities from the world of art and photography I have seen how minute and often overlooked aspects defined them as a person and their careers professionally. This has also helped me in gaining deeper insights about life in general. My satisfaction lies in creating something meaningful and I thank you for creating something as significant as your publication. Published from Melbourne, printed in Berlin, read around the world: Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us. Offscreen is supported by sponsors that understand the value of unobtrusive advertising and a great reader experience. Current sponsors:"
