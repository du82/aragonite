["https://offscreenmag.com/blog/selling-sponsorships"]
title = "Selling sponsorships"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Not a week goes by without me receiving an email about the way I present sponsors in the magazine. Everyone seems to appreciate their subtlety and how well they integrate into the reading experience. In fact, quite a few other magazines used Offscreen as a source of inspiration to follow a similar sponsorship model (Intern, Wolftree, Future Perfect, and Makeshift come to mind). Of course, having sponsors is nothing unique. There are lots of other magazines that had sponsors before me and I certainly don’t claim to be the inventor here. However, it’s nice to see other titles following a similarly subtle approach and turning away from the standard (often intrusive) ad slots of traditional magazines because of Offscreen. Many of the emails I receive ask me how I find my sponsors or how I convince them to participate in Offscreen. The truth is that they don’t really need much convincing. Finding sponsors has so far been fairly easy. (knocks on wood) I believe the web community is quite unique in that way. Many web companies are used to the idea of sponsorships, because we have so many events that are funded through this support model. Also, frankly speaking, successfully operating web/tech companies usually have quite generous marketing budgets and don’t necessarily request traditional media data before they invest in a particular campaign (I think I’ve been asked for a advertising kit once, and couldn’t provide one). Also, it seems to me that companies in this industry are a lot more open to trying out new things and supporting the underdog where it fits. No matter what your title is about, finding approachable companies that align with your own values is crucial. Don’t start with the Google of your industry. Start with a company you already have close contacts with, maybe even a local one. Set your initial fee very low. Sponsoring the first issue of Offscreen cost $400 and barely made a dent in the cost of everything, but it helped establish a relationship with those companies. I got a chance to prove that Offscreen is a product worth investing in, and as a result many of those companies are still sponsoring the magazine today!"
