["https://offscreenmag.com/blog/the-apps-i-use-at-offscreen"]
title = "The apps I use (updated)"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I’m always interested in finding out what tools/apps other people use to get stuff done. In the spirit of sharing, here’s a list of current apps I use to work on Offscreen (by no means complete and in no particular order): Raindrop I'm using Raindrop to save stuff I come across online during the week and want to feature in the magazine or Dense Discovery. Harvest The invoicing software I use it to invoice stockists, sponsors, and occasional consulting clients. Google Drive Google Docs has been indispensable for me since starting Offscreen. I create around 30 separate documents (one for each contributor) with every issue. Its collaboration and editing features make working with others on content simultaneously a breeze. My goal is to move away from goal, but weening myself off G Drive has been difficult. Gmail I made the switch to using Gmail in my browser (Chrome) many years ago and still find it the most productive way to use email! (I have a paid account with Google, so no ads, more storage, custom domain name, etc.) As mentioned above, the ultimate goal is to also move my email account away from Google. Receipt Bank My book-keeping app. I can either forward email receipts or upload photos of paper receipts (through my iPhone) and it does all the categorising, finding total amounts, tax, etc automatically. All I need to do is to export a spreadsheet at the end of the quarter and send it to my accountant. Dropshare I use this little tool every day. It lives in my menu bar and I can drag’n drop anything onto its icon to either create a short-URL, upload a file or take a screenshot, and then make it available online. It’s been a super handy companion. 1Password I have no idea how I’d survive the login mayhem without my trusty 1Password app. It stores all my secret words, and therefore it’s probably the most important piece of software on this machine."
