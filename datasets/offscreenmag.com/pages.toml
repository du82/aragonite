["https://offscreenmag.com/blog/letter-to-the-editor-10"]
title = "Letter to the editor"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = '''We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I live in Richmond, Virginia, USA which is about 1.5 hrs drive south of Washington D.C. There's a wide range of stereotypes about American's but I'm probably in line with many of the young professional male ones: thirty years old, upper-middle class white male, married to my college sweet heart, with a dog and a beautiful one-year-old little girl, in a house close enough to the city center to walk around but big enough for a yard and a couple of cars. I started my own consulting firm for digital business automation this year. In many respects, I live an unremarkable and privileged American lifestyle. However, I do my best to engage with my community and strive for positive change in the world in various ways. Medical trips serving the poor in Honduras, helping Afghan refugees settle locally, simply raising a child with love and care. Nothing game-changing but I try not to just sit on my privilege like Scrooge Mcduck. Recently, Offscreen has been an integral part of my life journey... A community where I frequently have honest open conversations is my (Christian) church. That community consists of about one half young people – mostly liberal leaning – and one half old people – mostly conservative. It's this crazy microcosm of what's going on in America in a community of about a hundred people. We're brought together by our shared faith in God, but sometimes (like how much of the rest of the world views Christians and/or Americans) we look at 'the other side' and think "WTF is wrong with them?!?!". In spite of all this, our community has begun to acknowledge that the world is changing rapidly and society is becoming more divisive and one way for us to figure it all out is to talk respectfully and frequently with people we don't agree with. Often, people in this particular community bring secular topics to the table to discuss. In that spirit, I've been sharing Offscreen with folks and the ensuing conversations with people have been deeply moving.'''
