["https://offscreenmag.com/blog/back-to-work"]
title = "Back to work"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. After a busy and intense seven months I was finally able to launch the newly designed website and issue 16 in March this year. But there was little time to celebrate. In publishing, after one issue is always before the next. A couple of weeks after the big reveal, I began planning the content for issue 17. When that issue launched in July I was definitely ready for a break. And so in August my partner and I got on a plane to Europe. We caught up with family and friends in Germany, hiked through the South Tyrol region in Italy, swam in crystal clear lakes in France, and of course indulged in the region's abundant fresh food. (I occasionally posted photos on Offscreen's Instagram account.) Before taking off, I scheduled several issues of my weekly newsletter (although the Dispatch did take a two-week break in the middle of our holiday too). I tried to stay offline for much of the holidays, but couldn't avoid checking my emails every now and then and making sure Offscreen orders were being fulfilled as usual. I'm back in Melbourne now and excited to get started with issue 18. In fact, I've already confirmed three out of four interviewees. It's going to be a cracker of an issue! (Make sure you're subscribed.) Before I left I told some of you to get in touch again when I'm back from my holidays because I didn't have time to respond properly at the time. If that's you, please follow up on your email. My inbox is depressingly empty. Published from Melbourne, printed in Berlin, read around the world: Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us. Offscreen is supported by sponsors that understand the value of unobtrusive advertising and a great reader experience. Current sponsors:"
