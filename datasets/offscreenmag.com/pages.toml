["https://www.offscreenmag.com/blog/farewell"]
title = "A farewell?"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Ten years ago, I hung up my web design career to figure out how to publish a magazine. A failed Kickstarter campaign and 24 issues later, and here we are today. Over the decade I paused Offscreen multiple times – for personal reasons, for a major rebrand or, most recently, a pandemic. These breaks offer me opportunities to experiment with side projects and recharge my creative batteries. The truth is, though, that I find it harder and harder to come back to and stay motivated about Offscreen. The ‘tech world’ is the world I grew up in. It’s where I made lasting friendships and a rewarding career. It’s given me so much since I first ‘logged on’ in the late ’90s. But today it’s a world I struggle to relate to. I stopped getting excited about new startups, apps or gadgets. Even genuinely interesting projects leave me feeling blasé as they often come wrapped in a language and a business model I find off-putting. If you’ve been reading Offscreen since its early days, you would have noticed a change in attitude. As I recently wrote in the introduction of my newsletter: “The naïve optimism for tech – the notion of ‘technology equals progress’ – has been replaced by a deep-felt scepticism about fixing social problems with technological solutions.” Seeing tech-billionaire space cowboys having a blast while the world burns and inequality explodes makes it difficult for me to not let that sense of scepticism turn into full-blown anti-tech cynicism. It’s certainly not the kind of energy that leads to hopeful tech stories. That said, the magazine’s contrarian viewpoints – as told through the many voices speaking up against the Silicon Valley narrative – at the very least offer a way to make sense of it all. Still, it increasingly feels futile. I often ask myself: what’s the point of putting so much effort into a publication that preaches to the converted?"
year_published = 2025
