["https://offscreenmag.com/blog/issue-18-editors-note"]
title = "Issue 18 Editor’s Note"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. After Mills’ encouraging email, I decided to publish the editor’s note of the latest issue here. I believe it’s one of the most important Offscreen issues yet. Make sure you purchase your copy before we sell out. As the people who create technology, we love to think of ourselves as the architects of a better tomorrow, an exciting future full of positive possibilities. We often believe that the fix for major problems is a technological one: where humans fail, let the machines figure it out. Technology is, by definition, progress. Or so we thought. In the wake of global upheaval against the status quo, the tech community is coming to terms with having over-promised and under-delivered. Almost weekly, headlines about security breaches remind us that we’re now in the post-privacy age, where private data is just another commodity. Meanwhile, a cultural shift is bringing deeply entrenched gender and racial inequalities into the open. And in Silicon Valley, unicorn defectors publicly apologise for having created addictive UI patterns and shady algorithms that exacerbate social division. And just like that, the tech world finds itself on a soul-searching mission. The realisation that the ethical decisions made by its creators are baked into all technology has come as a surprise. It turns out that lifeless tools – such as a simple recommendation engine – are not as neutral or amoral as we thought. It’s become clear now that programmers, designers, and data scientists are faced with some of the most pressing ethical dilemmas of our time. This forces us to ask a vital question: are they sufficiently equipped to make decisions on behalf of millions of people? I would dare to say that we are on the cusp of a new era in technology. For the first time, we’re seeing the broad ethical ramifications of the tools we build, sparking a discussion about what author Fabio Chiusi calls ‘the human ghost in the machines.’ From academics to journalists, and investors to politicians, we’re finally starting to engage in the difficult conversations that could lead us to exciting and much- needed alternatives to the orthodoxies of the last few decades."
year_published = 2025
