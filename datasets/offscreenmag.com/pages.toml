["https://www.offscreenmag.com/issues/18"]
title = "Offscreen Magazine Issue 18"
description = "Interviews with Craig Mod, Jessica Jackley, Aral Balkan, and Erika Hall."
full_description = "Craig Mod Screen and paper, restlessness and quietude, innovation and tradition: dichotomies in the life of a storyteller. Jessica Jackley Loans that change lives: the co- founder of Kiva reflects on her success as a social entrepreneur. Aral Balkan Resisting surveillance capitalism: the cyborg rights activist fights for social justice in the digital age. Erika Hall Design, research, ethics: it all interconnects for the co-founder of Mule, a digital agency with strong opinions. “Everything is constantly being optimised to pull you back in for one more minute, one more click. All those chemical reactions in your brain that tell you to keep going – I feel that very strongly when I am online.” Craig is a digital savant in love with the analogue. In code, design, and photography, but mostly through his writing, he explores our collective struggle to find focus in a world of perpetual distraction. Rather than seeking purely commercial success, he prefers living a quiet life in a seaside town south of Tokyo – sometimes escaping to remote writing retreats around the US – where he revels in his various creative outlets while hidden from the public eye. When he’s ready, he emerges from hibernation with thought-provoking, introspective essays, books, and talks that examine the meaning of a connected life. “Money may be an obvious way to get what you need, but it is rarely the only way. I think it’s healthy and useful to have a bit of scepticism, to pause and ask if there is another way that helps you move forward.” When Kiva launched in 2005, online crowd- funding was in its infancy. Since then, this not-for-profit microfinance platform has provided over a billion dollars in tiny loans to entrepreneurs in underdeveloped regions of the world. After exiting Kiva several years ago, co-founder Jessica Jackley looks back at the turbulent early days of a social enter- prise with a truly global impact. Humble, content, and energised to do still more, she reflects on her career in philanthropy, inspired by the stories of entrepreneurial farmers, seamstresses, and goatherds."
