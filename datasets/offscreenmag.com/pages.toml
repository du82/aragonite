["https://offscreenmag.com/blog/letter-to-the-editor-6"]
title = "Letter to the editor"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I’ve been meaning to write to you to thank you for the positive impact your sweet magazine has made on my life. When I read your most recent blog post today, it seemed like the right time to send you a note. I’m a magazine fiend myself, a Kiwi living in Berlin. A couple of weeks ago I picked up Offscreen for the first time in a cafe, and found I had to wrestle my boyfriend (a web developer) to keep a hold of it. Finally, I had found magazine that he actually wants to read – thank YOU for single-handedly solving a serious problem in our relationship. Now each week when I drag him into Do You Read Me? I will no longer have to endure his sulky looks, because he will be happily reading as well! Kai Brach: relationship counsellor. So that’s the first thank you. The second one is for your blog, which I think is brilliant. I am in the process of eking out an idea for my own magazine and being able to follow along your journey and discoveries has been invaluable to me. Where else could I find musings on working alone, the actual numbers instead of the usual “we don’t make a lot” (because what is ‘a lot’?!), a brief history of typefaces, how to choose a printer. Please, please don’t stop. The last thank you is for making a mistake and keeping on going. So many people are too scared to even start a project like this for fear of making a mistake. And yet you just made one and received an outpouring of love for your project, because it is so much bigger than one silly mistake. Published from Melbourne, printed in Berlin, read around the world: Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us. Offscreen is supported by sponsors that understand the value of unobtrusive advertising and a great reader experience. Current sponsors:"
