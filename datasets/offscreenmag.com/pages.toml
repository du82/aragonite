["https://offscreenmag.com/blog/blind-spot-detector"]
title = "Blind Spot Protector"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I’m standing in the pristine lobby of a tech company. Elevator bells are dinging, up and down. Young, beautiful people slip past me on either side, clutching silver MacBooks. My heart is racing, though it shouldn’t be. I’m the interviewer, not the candidate! Still, I get nervous every time, no matter which side of the table I’m on. I have no idea what my candidate looks like, but I find him in the small crowd eventually. After confirming his name, I extend my slightly sweaty hand. “Hi! I’m Lisa,” I say, willing myself to exude confidence. I'm reminded of recent feedback: Speak up! Look confident! “How’d you get that job?” he asks. He is older and taller than me, with a salt and pepper beard. His voice booms from above. I hear my response like an echo from far away. Something about an acquisition. It sounds like an apology. Then I guide him toward the café, offer him something to drink, and politely conduct our interview. Part way through, I have to remind myself that I am not the one who’s supposed to be proving myself in this conversation. His voice is one among many others that regularly question my presence, at work and in the world. I’m often asked about my accent (though I’m sure I don’t have one), my olive skin, and my last name. To the question where I’m from, ‘Pennsylvania’ rarely suffices as an answer. I’ve been informed, usually indirectly or playfully, that my apparent age, quiet voice, small stature, femininity, and curly hair do not add up to the term ‘boss’. Even years later, I’m still reflecting on his question. Stripped of its condescending tone, it’s a valid question, and one I'm asking myself: how did I get here, and why does it matter that I am? The answer begins with how far I had to come to get here. I grew up in a rust belt town of three thousand in Pennsylvania, born to one white parent, one Puerto Rican. My dad did seasonal field work, planting trees and pruning vines. Later he worked in manufacturing. I spent most of my life feeling different and trying to make it seem like I wasn’t – among peers with more privilege, among friends with ‘matching’ parents, and starting in graduate school, mostly among men. It wasn’t until recently that I began to embrace my otherness as a competitive advantage. I don’t just look different, I am different. I see things differently than the majority of my peers in technology, and that different perspective has remarkable value."
