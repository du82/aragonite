["https://offscreenmag.com/issues/16"]
title = "Offscreen Magazine Issue 16"
description = "Interviews with Bethany Koby, Azeem Azhar, Joel Flory, Julie Zhuo."
full_description = "Bethany Koby Can her DIY tech toys enable a new generation of problem solvers to save us from ourselves? Azeem Azhar A ‘closet scientist’ explores the role of technology in a future marked by exponential change. Joel Flory The co-founder of VSCO nurtures a community that strives to defy social media’s popularity contest. Julie Zhuo Facebook’s VP of Design shares her secrets for managing one of the world’s most influential design teams. “We don’t need another ‘neutral’ toy brand. What we need is an optimistic vision and a genuine debate about what technology can be and do for our kids.” Traditional toy makers are scrambling to catch up with the evolving expectations of increasingly tech-savvy younger generations. Recognising the potential to fill this gap, branding and design consultant Bethany Koby and her partner launched a contemporary toy brand with the goal of ending the era of overly homogenised, closed- system tech gadgets. Through a range of playful DIY tech kits, now sold in retail shops around the world, Technology Will Save Us aims to provide new educational experiences that encourage kids to think more creatively about technology, thereby shaping their future (and ours) in unexpected, transformational ways. With her unique background in design, tech, and education, and a business with a controversial name, Bethany is ready to shake up the EdTech sector by starting a debate about whether technology can be the planet’s knight in shining armour. “Within entrepreneurship I think we’ve given people a freedom pass by putting entrepreneurs on a pedestal and writing hagiographies of individual successes.” Journalist, entrepreneur, analyst, investor, strategist – the list of roles in Azeem Azhar’s professional life is seemingly endless, and so is the list of his interests. Whether through seeing him speak at an event, listening to his podcast, or reading his weekly newsletter The Exponential View, his impressive breadth of knowledge combined with his ability to break down complex issues makes every encounter an invaluable learning experience. In one of his many previous careers, Azeem founded PeerIndex, a tool that applied machine learning to large-scale social graphs to make predictions about user behaviour. Today, he spends his days analysing trends at the intersection of technology, science, and economics. From new breakthroughs in artificial intelligence to advances in climate change forecasting, Azeem’s far-reaching, analytical commentary provides us with a fascinating – and sometimes disconcerting – view of the future."
