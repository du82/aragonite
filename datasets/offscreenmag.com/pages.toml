["https://offscreenmag.com/blog/back-with-issue-21"]
title = "We’re back! Issue 21 starts shipping this week."
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. After the release of issue 20 in August 2018, I’ve taken some time off from Offscreen to focus on other things, like walking across Germany, launching Dense Discovery, and doing some contract work at a lovely agency here in Melbourne. Almost exactly a year later, I’m excited to announce that Offscreen is back with a new issue and some minor changes I’m outlining below. Issue 21 will start shipping later this week. As always, to be part of the first big batch leaving our warehouse, make sure you order your copy today. As a subscriber you will automatically receive the new issue, but it’s worth checking your account to make sure that your shipping details are up-to-date. Use the link in your confirmation email from us to access your account or request a new link here: my.offscreenmag.com. As always, we relied on the generous support by our sponsors to make this issue happen: DuckDuckGo, Harvest, SuperHi, Hover, SiteGround, and Ueno. And of course, a big 'thank you' to all Patrons of this issue. You’ll notice that we’re (back to) using an uncoated paper called EnviroTop. This is in part due to our previous, coated paper not being available in the grammage we needed. But to be honest, we also kinda missed the lovely texture of uncoated paper. Just like the previous stock, EnviroTop is made from 100% recycled paper. We reduced our sponsors from eight to just six. Finding sponsors has been time-consuming and at times difficult given that businesses these days prefer to spend their ad dollars on hyper-targeted, click-based online campaigns. Removing a quarter of our funding meant that we also had to reduce our production cost, and one way to do this is to reduce the overall page count of the magazine... To achieve this we removed three regular features: the Gear section, the company profile, and the Workspace photo series. This allowed us to reduce the content from 158 pages to 128."
