full_description = "May I Ask Jonathan Downey answers our questions about drones and the opportunities they provide for companies. Interview Lisa Bettany on a fall that ended her figure skating career, creating one of the App Store’s biggest success stories, and getting back to her roots in rural Canada. Three Words to Anywhere Event organiser Chris Sheldrick gives everyone and everywhere a memorable address. The Crow & The Cave Dweller To stay small or to grow big? To do the work or to delegate the work? Aaron Mentele weighs up the pros and cons. Interview Joe Gebbia on designing for trust as a key to the sharing economy, how a set of cereal boxes helped kickstart his company, and his favourite Airbnb review. One Question We asked Ashe Dryden, Iheanyi Ekechukwu, Imriel Morgan and Tracy Chou how we can collectively improve diversity efforts in our industry. Interview Robin Hunicke on her path to becoming a professor of game design, why playing games can be a life-changing experience, and the realities of running an indie game studio. Look, No Hands! Michelle Vandy found a cure for her RSI problems in the viral response to her YouTube videos. Interview Rohan Gunatillake on moving beyond the concept of digital dualism, modernising monastic meditation techniques, and his struggle to keep career and self-worth separated. Workspace A tour around the offices of VSCO, Daily Burn, Impact Hub Berlin, Fullscreen, and Return Path. Sweet Surprise Every month, Hank Rao sends hundreds of kilos of Japanese candy to customers all over America. Published from Melbourne, printed in Berlin, read around the world: Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us. Offscreen is supported by sponsors that understand the value of unobtrusive advertising and a great reader experience. Current sponsors:"
