["https://www.offscreenmag.com/blog/topic:letters"]
title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. I wanted to send a note of thanks for the work you’ve created and shared. I’ve sticky-noted so many things in my Offscreen issues over the years. 🙂 Personally, the last year has been filled with a lot of questions and thinking about life decisions. I decided to quit my job near the end of 2019 mainly to take a break from the ASAP-ness and noise of the tech world, and now I’m in that transitional stage of looking for a new team to work alongside. Offscreen’s content is something I go back to often when thinking about my next steps. When I was getting into the web development world in a professional sense (2015), I remember seeing ‘People Behind Bits and Pixels’ on the cover. Then Issue 16’s cover had ‘The human side of technology’ on it. There was always a focus on people and their experiences. It was a nice contrast to some of the companies I came across. When it was time to choose my first employer, I knew I wanted to be part of a company whose team valued and work exemplified traits like kindness, empathy, connection and communication. Reading the stories within Offscreen was part of that decision. I think it’s safe to say that recently sometimes it feels quite heavy, globally. The last few issues have felt charged with a certain energy. A combination of a call to action, a call of warning, a call of urgency, a call to slow down, etc. They’re a good reminder that there are definitely things we need to change in not just tech, but as a collective society. They’re also a lovely reminder of hope for the future, and things that people have done/are doing to move the needle. There’s a few folks I donate to/‘patronize’ on a regular basis. Every once in a while I take some time to think about why I’m supporting these people to make sure I’m allocating resources to causes I still believe in, but I never really have to think about why I’m an Offscreen Patron. It’s an automatic ‘continue to support’. I always know that I’m supporting quality – especially of the calibre and bent that we need more of at this time."
