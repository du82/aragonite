["https://offscreenmag.com/issues/22"]
title = "Offscreen Magazine Issue 22"
description = "Interviews with Cennydd Bowles, Jenny Odell, Paul Ford, Anab Jain"
full_description = "Cennydd Bowles Calling for a new ethical awakening in technology and design – fuelled by individual and collective action. Paul Ford Deciphering the code of tech: a writer, programmer, and CEO interprets the power dynamics of today. Anab Jain ‘The future is old’: the designer and educator explores uncertainties to build future worlds we can experience now. “Design is still submissive to the idea that the solution to the world’s problems is more products, more technology, and more stuff in the world.” Design is wrong when it assumes that the solution to the problems it causes is simply more design. Cennydd Bowles is a digital product designer and futurist whose ground-breaking work, including his book Future Ethics, explores how the decisions we make and the actions we take have the potential to build better worlds for ourselves. Implicit in his work is a warning, though: the relentless cycle of more that we’ve become addicted to is a disaster in the making. From his vantage point at the nexus of design, ethics, and future studies, Bowles explains why the time for moral neutrality is over and the time for an ethical awakening is now. “We always want access to more things and more options more of the time. But then you just end up with this sort of meaningless infinity.” Our culture’s narrow definition of productivity often forces us to use up every minute of every day in a mad dash to optimise and monetise ourselves. Through her book, How to Do Nothing, multi-disciplinary artist Jenny Odell wants to change our assumptions about work, time, and value. She encourages us to question a mindset that demands ever more technology – leading us to a state of ‘meaningless infinity’ – and to focus instead upon regaining a sense of agency through a less capitalistic definition of productivity. At a time of overwhelming demand for our attention, Jenny argues that it’s vital that we do miss out sometimes, in order to create for ourselves the necessary space for observation, care, and maintenance."
