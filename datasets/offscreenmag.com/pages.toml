["https://offscreenmag.com/blog/topic:snippets/page:2"]
title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. You must have a room, or a certain hour or so a day, where you don’t know what was in the newspapers that morning, you don’t know who your friends are, you don’t know what you owe anybody, you don’t know what anybody owes to you. This is a place where you can simply experience and bring forth what you are and what you might be. This is the place of creative incubation. At first you may find that nothing happens there. But if you have a sacred place and use it, something eventually will happen Joseph Campbell on having a ‘bliss station’, in The Power of Myth (via Austin Kleon). I quite like the sound and the idea of this. Not sure how well the bliss station fits into our tiny inner-city apartment though. In the same way that the automobile allowed the horse to become a creature of leisure rather than of labour, so too has digital publishing moved traditional publishing into the realm of luxury. The content-first approach to modern publishing may turn out to be a winner, even as the business challenges for journalism remain significant and unresolved… Soon, if it’s not true already, magazine brands will matter more as marks of quality or tone than they do as gatherers and arrangers of content in a unified experience… That is the standard to which magazines of the mobile era must aspire. Making something new takes patience. But it also takes faith. Faith that everything will work out in the end. During the development of most any product, there are always times when things aren’t quite right. Times when you feel like you may be going backwards a bit. Times where it’s almost there, but you can’t yet figure out why it isn’t. Times when you hate the thing today that you loved yesterday. Times when what you had in your head isn’t quite what you’re seeing in front of you. Yet. That’s when you need to have faith."
