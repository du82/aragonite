["https://www.offscreenmag.com/blog/new-editor"]
title = "Offscreen has a new editor!"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. [KB] My previous post about a possible farewell led to some wonderful conversations with readers, many of whom offered to work with me to keep Offscreen going. (Thanks so much!) One of those conversations turned into a lengthy discussion about if and how Offscreen could transition to a new editor. After many hours on Zoom, I’m happy to announce that Offscreen will continue under new editorial guidance by Patrick Tanguay. I first came across Patrick’s work when he co-published The Alpine Review, an acclaimed, book-sized magazine that unpacked important issues through slow, reflective journalism. Patrick has since become better known as the synthesist and curator behind the excellent Sentiers, a weekly newsletter with insightful links and commentary on futurism and technology. I can’t think of a person that’s better suited to take over Offscreen’s reins than Patrick. Over time, he will inject fresh perspectives and new ideas while caring as much as I do about its loyal community of readers and its independent voice. Patrick and I will work closely together on this upcoming issue 25, after which I slowly transition into more of an advisory role, ensuring Patrick settles in comfortably over the next two to three issues. I will share some more thoughts on this transition in a later post. For now, let me hand over the mic to Patrick... [PT] Back in 2012, when we started putting together The Alpine Review, Kai was just an issue ahead of us with Offscreen and yet the publication – and Kai’s willingness to share his process ever so transparently – was already an inspiration. It’s not an exaggeration to say that it is a true honour to now get the chance to lead Offscreen’s editorial direction. In our long conversations, Kai showed once again how unwavering he is in his respect for the time and intelligence of his audience. Every decision is scrutinised around what’s best for the reader."
