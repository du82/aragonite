["https://offscreenmag.com/blog/topic:production/page:3"]
title = "Offscreen Blog"
description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. With the mill making the paper used in Offscreen on fire in November last year, I faced the difficult decision to change paper stock once again. In the weeks after the news that my previous stock type, a paper called EnviroTop, was no longer available, I was working closely with my printer to get my hands on various alternative paper samples. More than 12 different uncoated paper types were fedexed to me from Berlin and I spent hours, if not days, going over all the different options. In particular, I had my eye on a range of Munken paper – a high-quality, ultra-smooth uncoated stock that is used by some of my favourite publications, like The Travel Almanac or Underscore. Munken Paper is a joy to touch and flick through, and it would give the entire publication a premium tactility. Although I was a bit worried about the low opacity of the paper, I was ready to spend a few thousand euros more for a superior experience. If just there hadn’t been the questions about sustainability... The reason I chose EnviroTop in the first place was the fact that it was made from 100% recycled materials. Munken, however, was not. Though certified with various ‘green’ labels (the famous FSC sign is one of them), producing Munken means trees are still being chopped down and lots of energy and water goes into turning them into paper. I remember listening to a podcast about how making recycled paper sometimes actually requires a larger carbon footprint than producing paper from new trees. So I went on a research mission to find out what my best option for Offscreen was. The results aren’t very clear. It seems to depend on how the recycled paper is manufactured. While I was researching Offscreen’s environmental impact, I got word from the printer that the fire at the paper mill wasn’t as bad as initially expected and that EnviroTop could indeed be delivered with just a few weeks delay. I checked out the paper mill’s website and was positively surprised to find that the entire company is dedicated to a sustainable, low-impact paper production. Their production process is explained in detail on their site. For instance, the steam generated when boiling down recycled materials produces enough electricity to power the entire production process, making it self-sufficient. The Austria-based company has also won numerous awards for innovation and new ideas in regards to sustainable paper products."
year_published = 2025
