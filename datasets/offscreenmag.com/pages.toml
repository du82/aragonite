["https://offscreenmag.com/blog/stranger-things"]
title = "Stranger Things"
description = "Offscreen is an independent print magazine that examines how we shape technology and how technology shapes us."
full_description = "We love sharing our process of making a print magazine and building a sustainable indie publishing brand. New here? Start with our list of popular posts. Of the 185 books Bill Gates has recommended on his blog over the past eight years, only 12 are novels. During Mark Zuckerberg’s ‘year of books’ in 2015, when he crunched through twenty-three worthy tomes, works of fiction cropped up only three times. I’ve made it something of a personal project to ask the tech people I meet in my day job to name-check authors they love. Peddlers of neuroscience, behavioural economics, and organisational theory feature highly. Peddlers of make-believe do not. When I ask them why they read so little fiction, their answer boils down to the same question: why would anyone waste time on made-up stuff when there’s so much real stuff to learn about the world? Life is indeed stranger than fiction, as recent global events have proven all too well. It can feel indulgent, if not irresponsible, to spend my evenings romping through a novel about glass-blowers in fifteenth-century Venice when there are so many urgent present-day technological developments and political dilemmas to understand and have opinions on. I think we can all agree that what the people creating new technology need more of right now is the ability to step into the shoes of others who don’t think, look, or live like them. I wonder what would happen if tech folk spent less time skimming trend reports and explainer journalism and more time truly trying to understand the perspectives of others. Might we finally see more diverse and nuanced products and platforms emerge? Science tells us that this is one area in which make-believe can actually help. Several studies have proven the link between fiction and empathy. Probably the best known, conducted by psychologists David Comer Kidd and Emanuele Castano in 2013, found that reading literary fiction enhances the ability to detect and understand other people's emotions. ‘What great writers do is to turn you into the writer,’ Kidd explained. ‘In literary fiction, the incompleteness of the characters turns your mind to trying to understand the minds of others.’ Perhaps what we need to fill the empathy gap is imagination, not information."
year_published = 2025
