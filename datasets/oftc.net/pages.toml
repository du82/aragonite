["https://oftc.net/staff"]
title = "OFTC - Staff"
full_description = "Who are the OFTC Staff? Staff roles Network Operations Committee Chair Ombudsman Network Operations Committee Network Operators Network Representatives Advisors Server Sponsors Who are the OFTC Staff? The Network Staff are responsible for the maintenance and well-being of the Network and its users. When connected to our IRC network, staff are identifiable by their cloaked hostmasks: <nickname>.<role>.oftc.net. Staff are assigned to their roles during annual staff-wide elections from the 8th to the 11th of every October. Between elections, staff may be promoted, demoted, added, or removed by the Network Operations Committee, as outlined in the Network’s Constitution. The constitution also outlines the responsibilities of each staff role, and defines the rules for our elections. OFTC’s constitution is enforced by resolution 2002-07-02.iwj.5 of Software in the Public Interest’s Board of Directors. If you would like to join our staff or sponsor a server, please refer to our Application and send it via mail. Staff roles These are the people you should seek for assistance. Network Operations Committee Chair Doug Freed (dwfreed) <chair -at- oftc.net> Ombudsman Robert A. Nowak (rnowak) <ombudsman -at- oftc.net> Network Operations Committee Doug Freed (dwfreed) Melissa Draper (el) Joerg Jaspert (Ganneff) Christoph Berg (Myon) Robert A. Nowak (rnowak) Seth Arnold (sarnold) Tom Wesley (tomaw) Unit 193 (Unit193) Network Operators Anthony Velardi (avelardi) Rhosyn Celyn (cwningen) Jonathan Frederickson (jfred) Matt London (Matt) Rico Gloeckner (mc) Richie McIntosh (mcintosh) Matt Traudt (pastly) Jan Prunk (yang) Network Representatives No current NetReps Advisors Being an Advisor is an honorary and not an administrative position. David Graham (cdlu) Timothy J. Fontaine (tjfontaine) Server Sponsors The most important role on OFTC! We sincerely appreciate the generosity of each of our sponsors. Not all sponsors or servers are mentioned here. Please note that we cannot guarantee that any specific server will be accessible at any specific time. Refer to our connection FAQ for more information on connecting to OFTC. ACC Umeå U Mattias Wadenstein (maswan) helix (Umeå, Sweden) AS6453 reflection (Montreal, Quebec, Canada)coherence (Tokyo, Japan) Individual Joerg Jaspert (Ganneff) non-ircd (Helsinki, Finland)reticulum (Falkenstein, Germany) Individual Tim Warnock (TiMOiD) nucleus (Brisbane, Australia) Individual Doug Winter (winjer) kinetic (London, UK) Linode singleton (Singapore)coulomb (London, UK)resistance (Dallas, Texas, US)non-ircd (Fremont, California, US)charm (Fremont, California, US)weber (Newark, New Jersey, US) MIT CSAIL synthon (Cambridge, Massachusetts, USA) Mythic Beasts Rhosyn Celyn (cwningen) charon (London, UK) OSUOSL larich (Corvallis, Oregon, US) RCS&RDS dacia (Piteşti, Romania) Swepipe liquid (Stockholm, Sweden)"
