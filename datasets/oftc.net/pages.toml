["https://oftc.net/2021/05/23/update"]
title = "OFTC - Update"
full_description = "May 23, 2021 Privacy Policy updates - New accounts now have the flag PRIVATE turned on by default, all old accounts have this flag turned on forcefully ONCE as of now. This means that the mail address used for registration is no longer visible by default to other users, only IRCOps. We have also updated our privacy policy to include more details on which data is visible to who (including other users). Back to the archives Privacy Policy updates - New accounts now have the flag PRIVATE turned on by default, all old accounts have this flag turned on forcefully ONCE as of now. This means that the mail address used for registration is no longer visible by default to other users, only IRCOps. We have also updated our privacy policy to include more details on which data is visible to who (including other users). Founded in 2001 by members of the Open Source and Free Software communities, OFTC aims to provide those communities with better communication, development, and support infrastructure."
