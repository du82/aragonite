["https://oftc.net/2016/03/23/update"]
title = "OFTC - Update"
full_description = "March 23, 2016 The CA used to sign our IRC server certificates, SPI, has been removed from Debian’s (and other’s) ca-certificates package. This means users will now be seeing “self-signed certificate in certificate chain” errors or experiencing similar problems with SSL connections. We are moving to Let’s Encrypt certificates, but have yet to complete testing our processes. To work around the problem until we have new certificates, manually import the spi-cacert.crt certificate into your system’s or IRC client’s trust store. Back to the archives"
