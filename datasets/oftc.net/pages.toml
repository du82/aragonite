["https://oftc.net/2025/02/28/update"]
title = "OFTC - Update"
full_description = "February 28, 2025 The Matrix.org Foundation recently published a blog post stating that unless they raise temporary funding by the end of March, and also solicit further, more sustained funding in the month after that, they will start scaling back operations and discontinue running and maintaining their flagship inter-protocol bridges, including the official bridge to OFTC. In the event that they do not meet their ambitious goals, we are providing pointers below to resources so that our users can plan how to proceed, and avoid splitting their communities. While there are some forks of the matrix-appservice-irc codebase, we are not aware of any equipped to maintain this as a community fork. However, there are other options, such as Matterbridge which bridges to a variety of other protocols as well, and Heisenbridge which offers a one-to-many bridging option. The Matrix.org Foundation has indicated to us that that they will make plans for the worst-case scenario, and we will communicate further as we get more information. Back to the archives"
