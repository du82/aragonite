["https://oftc.net/FAQ/General_Questions"]
title = "OFTC - FAQ/General_Questions"
full_description = "What prompted OFTC’s creation? Isn’t OFTC’s structure awfully bureaucratic? What services does OFTC provide? Is OFTC a democracy? Whose idea was this project? I have a question, request, or comment. Who do I go to? Is there a mailing list on which users can discuss the network? I wish to complain about a staff member or the network. Who do I talk to? How is OFTC’s constitution enforced? How can I use OFTC’s various services? What happened to Mibbit’s access to OFTC? What prompted OFTC’s creation? Quite simply, the group which started OFTC was unhappy with the communications options available to Free Software and Open Source projects. We felt that a new project was required, which would devote itself to providing services to the Free Software and Open Source communities. Isn’t OFTC’s structure awfully bureaucratic? OFTC’s staff have the power to make decisions that need to be made immediately. Any decisions on policy - which include the addition of staff and servers - are made by a central administrative body known as the Network Operations Committee, with aid from users and staff. What services does OFTC provide? Currently, OFTC provides an IRC network for use. Is OFTC a democracy? Not quite. Due to the difficulty in creating an on-line voting mechanism resistant to abuse, the only voters on OFTC are those who directly contribute to OFTC itself. We are exploring options to allow regular users of OFTC’s services to vote as well, but at present, only OFTC staff run during elections, and only OFTC staff vote. Whose idea was this project? A number of members of the Open Source and Free Software communities came together and decided that there was a need for this type of project. That need had not been fulfilled, and they felt they would be able to create and administer such a project. I have a question, request, or comment. Who do I go to? All active staff members can be found on the the Staff page. You may contact them directly on our IRC servers, or you may wish to contact us through email at support. Is there a mailing list on which users can discuss the network? As of May 2021 the mailing list that had been available to users has been shut down as it saw no use for a long time. Please stop by #oftc or email support@oftc.net for inquiries. I wish to complain about a staff member or the network. Who do I talk to? The Ombudsman is in charge of dealing with all complaints against staff members or the Network as a whole. Contact the Ombudsman here. If you wish to complain about the Ombudsman, contact the network’s Chair here. How is OFTC’s constitution enforced? Software in the Public Interest holds our domain name in trust and with it has the necessary power and authority to enforce our constitution. How can I use OFTC’s various services? The only service ready for use is IRC. To use it, use your favourite IRC client to log on to irc.oftc.net. As more services become available, information will be provided about them on our project web site. What happened to Mibbit’s access to OFTC? Mibbit announced that it would shut down in August 2024. OFTC had already blocked Mibbit prior to this."
author = "OFTC"
year_published = 2025
clearnet = "https://oftc.net/FAQ/General_Questions"
