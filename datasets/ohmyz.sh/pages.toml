title = "Oh My Zsh - a delightful & open source framework for Zsh"
description = "Oh My Zsh is a delightful, open source, community-driven framework for managing your Zsh configuration. It comes bundled with hundreds of helpful functions, plugins, themes, and a few things that make you shout... OH MY ZSH!"
full_description = '''Oh My Zsh is a delightful, open source, community-driven framework for managing your Zsh configuration. It comes bundled with thousands of helpful functions, helpers, plugins, themes, and a few things that make you shout... Once installed, your terminal shell will become the talk of the town or your money back! With each keystroke in your command prompt, you'll take advantage of the hundreds of powerful plugins and beautiful themes. Strangers will come up to you in cafés and ask you, "that is amazing! are you some sort of genius?" Finally, you'll begin to get the sort of attention that you have always felt you deserved. ...or maybe you'll use the time that you're saving to start flossing more often. 😬 Oh My Zsh comes bundled with plugins that'll make your life as a software developer easier and leave you feeling like a superhero. Oh My Zsh has a vibrant community of happy users and delightful contributors. Without all the time and help from our contributors, it wouldn't be so awesome. We'll admit it. Early in the Oh My Zsh world, we may have gotten a bit too theme happy. We currently ship with 150 themes bundled. Oh My Zsh is installed by running one of the following commands in your terminal. You can install this via the command-line with either curl or wget. Not ready to jump right in? We're not offended; it's never a bad idea to read the documentation first. If you don't, we do! Oh My Zsh includes over 300 plugins, and we like to share. Here are some featured plugins: Oh My Zsh was started by the team at Planet Argon, a software consultancy that helps organizations improve their existing Ruby on Rails applications.'''
year_published = 2025
