["https://ohshitgit.com/fr"]
title = "Et merde, Git!?!"
full_description = '''Git est compliqué : c'est facile de tout foirer et foutrement impossible de réparer ses erreurs. La documentation de Git tient du problème de l'œuf et de la poule : pour y chercher comment vous sortir du bordel il faut déjà connaître le truc qu'il faut savoir pour résoudre votre problème. Voici donc quelques exemples de mauvais pas où je me suis fourré, et comment j'ai réussi à m'en tirer, tout ça en français dans le texte*. Et merde, j'ai fait un truc horrible, par pitié dites-moi que git peut voyager dans le temps !?! git reflog # liste tout ce que vous avez fait dans git, # quelle que soit la branche ! # chaque entrée correspond à un index HEAD@{index} # trouvez celui juste avant d'avoir tout cassé git reset HEAD@{index} # git est magique Ça sert pour récupérer une suppression accidentelle, ou annuler des tentatives qui ont cassé le dépôt, ou s'en sortir après une mauvaise fusion, ou simplement revenir en arrière à un point où les choses fonctionnaient correctement. J'utilise BEAUCOUP reflog. Chapeau trèèèès bas aux nombreuuuuuuses personnes qui m'ont suggéré cette technique ! Et merde, je viens de commiter et il manque une toute petite modification ! # faire votre correction git add . # ou ajouter les fichiers un à un git commit --amend --no-edit # votre dernier commit contient désormais votre modification ! # ATTENTION : ne jamais amend-er les commits publics Cela m'arrive généralement quand je commite puis lance des tests/lints... et PDM, j'ai oublié un espace après une virgule. Vous pouvez aussi faire le changement via un nouveau commit puis faire rebase -i afin de fusionner les deux commits, mais c'est minimum un million de fois plus rapide. Avertissement : Ne jamais faire un amend sur des commits déjà poussés vers une branche publique/partagée ! Uniquement ceux qui n'existent que dans votre copie locale ou vous irez au-devant de gros ennuis... Et merde, je veux corriger le message de mon dernier commit ! git commit --amend # suivre les instructions pour modifier le message de commit Encore ces règles de formatage des messages de commit. Et merde, j'ai commité sur le master alors que ça aurait dû aller sur une nouvelle branche ! # créer une nouvelle branche à partir du master actuel git branch un-nom-de-nouvelle-branche # supprimer le dernier commit du master git reset HEAD~ --hard git checkout un-nom-de-nouvelle-branche # votre commit est désormais dans cette branche :) Note : cela ne fonctionne pas si vous avez déjà poussé le commit vers une branche publique/partagée, et si vous avez essayé d'autres trucs avant. Vous devrez sans doute faire un git reset HEAD@{number-of-commits-back} au lieu de HEAD~. Bonjour tristesse. Et aussi, beaucoup beaucoup beaucoup de personnes ont proposé une méthode géniale pour que ce soit plus court que ce que j'avais réussi à faire. Merci à tous ! Et merde, je me suis trompé de branche pour mon commit ! # annuler le dernier commit, mais conserver les modifications git reset HEAD~ --soft git stash # passer sur la bonne branche git checkout nom-de-la-branche-correcte git stash pop git add . # ou ajouter les fichiers un à un git commit -m "votre message ici"; # maintenant vos modifications sont sur la bonne branche Pas mal de gens ont conseillé d'utiliser cherry-pick dans ce cas-là, donc à vous de faire votre choix et d'utiliser ce qui vous semble le plus logique ! # passer sur la bonne branche git checkout nom-de-la-branche-correcte # y récupérer le dernier commit du master git cherry-pick master # supprimer le dernier commit du master git checkout master git reset HEAD~ --hard Et merde, je fais un diff mais rien ne se passe ?! Quand vous avez modifié des fichiers, mais que diff ne renvoie rien, c'est sans doute que vous avez déjà "ajouté" ces fichiers à l'Index (stage area) et qu'il faut utiliser une option spéciale. git diff --staged Classé dans ¯\_(ツ)_/¯ (oui, je sais, c'est une fonctionnalité et pas un bug, mais c'est époustouflifiant, voire déconcertifiant la première fois où ça vous arrive !) Et merde, je veux annuler un truc genre 5 commits en arrière ! # trouver le commit que vous devez annuler git log # se déplacer dans l'historique avec flèche haut / flèche bas # une fois le commit trouvé, mémoriser son hash git revert [hash mémorisé] # git va créer un nouveau commit qui annule ce commit # suivre les instructions pour éditer le message de commit # ou contentez-vous d'enregistrer et valider Il s'avère que vous n'avez pas besoin de chercher l'ancien fichier puis copier-coller son contenu dans le fichier actuel pour annuler ce qui a été modifié ! Si vous avez commité un bug, vous pouvez annuler votre livraison d'un seul coup avec revert. Vous pouvez aussi annuler un seul fichier plutôt que le commit complet ! Mais bien entendu, ça ne serait pas vraiment du git si cela n'impliquait pas un jeu de commandes complètement différentes... Et merde, je veux annuler la modification d'un fichier ! # trouver le hash d'un commit d'avant la modification git log # se déplacer dans l'historique avec flèche haut / flèche bas # une fois le commit trouvé, mémoriser son hash git checkout [hash mémorisé] -- path/to/file # l'ancienne version du fichier est désormais dans l'index git commit -m "Super, pas de copier/coller pour annuler" Quand j'ai enfin réussi à capter le truc, c'était ENORME. ENORME ! ENAUUUUURME... Non mais sérieux ! C'est quoi ce putain de monde où on doit utiliser un checkout -- pour annuler les modifications d'un fichier ? :shakes-fist-at-linus-torvalds: Et merde, je laisse tomber. cd .. sudo rm -r depot-git-foireux git clone https://some.github.url/depot-git-foireux.git cd depot-git-foireux Merci à Eric V. pour ce conseil. Par conséquent, en cas de réclamation à cause du sudo, voyez-ça directement avec lui... Plus sérieusement, quand votre branche est devenue tellement foireuse que le plus simple c'est de revenir à l'état d'origine du dépôt distant, essayez cette méthode "homologuée git". Mais attention, c'est ferme et définitif : impossible de revenir en arrière ! # obtenir la dernière version du serveur git fetch origin git checkout master git reset --hard origin/master # supprimer les fichiers et répertoires non archivés git clean -d --force # répéter checkout/reset/clean pour chaque branche problématique *Avertissement : Ce site n'a pas pour objectif d'être une référence exhaustive. Et bien sûr, il existe d'autres façons de faire la même chose avec plus d'élégance sémantique (tic tic), mais j'en suis arrivé à ce résultat à force de tâtonnements, d'erreurs, d'un tas de jurons et de tables renversées. Puis j'ai eu l'idée loufoque de partager mes trouvailles, assaisonnées d'une bonne dose de frivolité et d'imprécations. A prendre ou à laisser... Un grand merci à tous ceux qui ont traduit le site dans d'autres langues , vous déchirez ! Michael Botha (af) · Khaja Md Sher E Alam (bn) · Eduard Tomek (cs) · Moritz Stückler (de) · Franco Fantini (es) · Hamid Moheb (fa) · Senja Jarva (fi) · Michel (fr) · Alex Tzimas (gr) · Elad Leev (he) · Aryan Sarkar (hi) · Ricky Gultom (id) · fedemcmac (it) · Meiko Hori (ja) · Zhunisali Shanabek (kk) · Gyeongjae Choi (ko) · Rahul Dahal (ne) · Martijn ten Heuvel (nl) · Łukasz Wójcik (pl) · Davi Alexandre (pt_BR) · Catalina Focsa (ro) · Daniil Golubev (ru) · Nemanja Vasić (sr) · Björn Söderqvist (sv) · Kitt Tientanopajai (th) · Taha Paksu (tr) · Andriy Sultanov (ua) · Tao Jiayuan (zh) . Avec l'aide supplémentaire de Allie Jones · Artem Vorotnikov · David Fyffe · Frank Taillandier · Iain Murray · Lucas Larson · Myrzabek Azil Si vous souhaitez aider à ajouter une traduction dans votre langue, soumettez un PR sur GitHub'''
