full_description = "Working GroupsOn this pageWorking Groups OKD is governed by working groups as set out in the OKD Working Group Charter There is a primary working group, where all the main decisions are made regarding the project. Where an area of the project needs more time or is of interest to a subset of the working group membership, then a sub-group will be formed for that specific area, The current sub groups are: Documentation working group Code-Ready Containers on OKD working group OKD virtualization working group OKD Primary Working Group​ The OKD group meets virtually every other week. Calendar link : OKD working group calendar Connection details : OKD working group meetings Agenda link : OKD working group agenda and meeting nodes Previous meeting playlist : YouTube playlist You don't need an invitation to join a working group -- simply join the video call. You may also want to join other online discussions as set out in the contributor sectionEdit this page"
