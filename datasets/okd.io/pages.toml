["https://www.okd.io/docs/project"]
title = "OKD.io | OKD Kubernetes Platform"
description = "Built around a core of OCI container packaging and Kubernetes container cluster management, OKD is also augmented by application lifecycle management functionality and DevOps tooling. OKD provides a complete open source container application platform."
full_description = "OKD.ioOn this pageOKD.ioBuilt around a core of OCI container packaging and Kubernetes container cluster management, OKD is also augmented by application lifecycle management functionality and DevOps tooling. OKD provides a complete open source container application platform. OKD 4​ $ openshift-install create cluster Tons of amazing new features Automatic updates not only for OKD but also for the host OS, k8s Operators are first class citizens, a fancy UI, and much much more CodeReady Containers for OKD: local OKD 4 cluster for development CodeReady Containers brings a minimal OpenShift 4 cluster to your local laptop or desktop computer! Download it here: CodeReady Containers for OKD Images What is OKD?​ OKD is a distribution of Kubernetes optimized for continuous application development and multi-tenant deployment OKD embeds Kubernetes and extends it with security and other integrated concepts OKD adds developer and operations-centric tools on top of Kubernetes to enable rapid application development, easy deployment and scaling, and long-term lifecycle maintenance for small and large teams OKD is also referred to as Origin in GitHub and in the documentation OKD is a sibling Kubernetes distribution to Red Hat OpenShift | If you are looking for enterprise-level support, or information on partner certification, Red Hat also offers Red Hat OpenShift Container Platform OKD Community​ We know you've got great ideas for improving OKD and its network of open source projects. So roll up your sleeves and come join us in the community! Get Started​ All contributions are welcome! OKD uses the Apache 2 license and does not require any contributor agreement to submit patches. Please open issues for any bugs or problems you encounter, ask questions in the #openshift-users on Kubernetes Slack Channel, or get involved in the OKD-WG by joining the OKD-WG google group. Get started with the Contributors Guide Read the documentation Read our charter Help Resolve an Open Issue Connect to the community​ Join the OKD Working Group Talk to Us​ Follow the public mailing lists Chat with us on Matrix Chat with us on the #openshift-users channel on Slack See more options on the OKD Working Group Communications page Standardization through Containerization​ Standards are powerful forces in the software industry. They can drive technology forward by bringing together the combined efforts of multiple developers, different communities, and even competing vendors. Open source container orchestration and cluster management at scale Standardized Linux container packaging for applications and their dependencies A container-focused OS that's designed for painless management in large clusters An open source project that provides developer and runtime Kubernetes tools, enabling you to accelerate the development of an Operator A lightweight container runtime for Kubernetes Prometheus is a systems and service monitoring toolkit that collects metrics from configured targets at given intervals, evaluates rule expressions, displays the results, and can trigger alerts if some condition is observed to be true OKD End User Community​ There is a large, vibrant end user community Become a part of something bigger​ OpenShift Commons is open to all community participants: users, operators, enterprises, non-profits, educational institutions, partners, and service providers as well as other open source technology initiatives utilized under the hood or to extend the OpenShift platform If you are an OpenShift Online or an OpenShift Container Platform customer or have deployed OKD on premise or on a public cloud If you have contributed to the OKD project and want to connect with your peers and end users If you simply want to stay up-to-date on the roadmap and best practices for using, deploying and operating OpenShift ... then OpenShift Commons is the right place for you Edit this page"
