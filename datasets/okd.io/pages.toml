["https://okd.io/docs/community/wg_virt/community"]
title = "Get involved! | OKD Kubernetes Platform"
description = "The OKD Virtualization SIG is a group of people just like you who are aiming to promote the adoption of the virtualization components on OKD."
full_description = "wg_virtGet involved!On this pageGet involved! The OKD Virtualization SIG is a group of people just like you who are aiming to promote the adoption of the virtualization components on OKD. Social Media​ Reddit : r/OKD Virtualization YouTube : OKD Workgroup meeting Twitter : Follow @OKD_Virt_SIG Getting started as a user (future contributor!) Before getting started, please read OKD community etiquette guidelines. Feel free to dive into OKD documentation following the installation guide for setting up your initial OKD deployment on your bare metal datacenter. Once it's up, please follow the OKD documentation regarding Virtualization installation. If you find difficulties during the process let us know! Please report issues in our GitHub tracker. TODO: we may switch to okd organization once it will be ready Getting started as contributor The OKD Virtualization SIG is a group of multidisciplinary individuals who are contributing code, writing documentation, reporting bugs, contributing UX and design expertise, and engaging with the community. Before getting started, we recommend that you: Join the OKD Workgroup Google Group and send a message presenting yourself and saying how you would like to contribute. Join the biweekly OKD Workgroup meetings (agenda, previous meetings recordings) Please read OKD community etiquette guidelines. (Quick summary: Be nice!) The OKD Virtualization SIG is a community project, and we welcome contributions from everyone! If you'd like to write code, report bugs, contribute designs, or enhance the documentation, we would love your help! Testing​ We're always eager to have new contributors to join improving the OKD Virtualization quality, no matter your experience level. Please try to deploy and use OKD Virtualization and report issues in our GitHub tracker. TODO: we may switch to okd organization once it will be ready Documentation​ OKD Virtualization documentation is mostly included in GitHub openshift-docs repository and we are working for getting it published on OKD documentation website Some additional documentation may be available within this SubGroup space. Supporters, Sponsors, and Providers​ OKD Virtualization SIG is still in its early days. If you are using, supporting or providing services with OKD Virtualization we would like to share your story here!Edit this page"
