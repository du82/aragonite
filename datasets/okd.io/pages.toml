["https://okd.io/docs/community/communications"]
title = "OKD Working Group Communications | OKD Kubernetes Platform"
description = "The working group issues regular communications through several different methods."
full_description = "OKD Working Group CommunicationsOn this pageOKD Working Group Communications The working group issues regular communications through several different methods. There are also a few ways to contact the working group depending on the type of communication needed. This page will help you navigate the various communication channels that the working group utilizes. E-Mail​ Reporting Addresses The working group uses several e-mail addresses to receive communications from the community based on the intent of the message. chairs@okd.io The chairs address is for messages that are related to the working group and its processes. It is intended for communications that will go directly to the working group chairs and not the wider community. security@okd.io The security address is intended for any reporting of sensitive or confidential security related bugs and findings about OKD. info@okd.io The info address is for requesting general information about the working group and its processes. Social Media​ The working group uses social media to broadcast updates about new releases, working group meetings, and community events. Twitter @okd_io Slack​ The working group maintains a presence on the Kubernetes community Slack instance. #openshift-users This channel is a good place to come for OKD-specific help with operations and usage. #okd-dev This channel is strictly for discussion surrounding OKD's organizational structure, CI/CD infrastructure, and release strategy. Please use #openshift-users for community support questions. If you are not yet a member of the Kubernetes workspace, you can request your invitation on slack.kubernetes.io. GitHub​ The working group maintains several repositories on GitHub in the OKD-Project organization. These repositories contain information and discussions about OKD and the working group's future plans. okd-project/okd discussions The okd repository discussions board is a good place to visit for researching or raising specific operational issues with OKD. okd-project/planning project board The planning repository contains a kanban board which records the current state of the working group and its related projects.Edit this page"
