["https://okd.io/docs/project/upgrade-notes/from-4-15"]
title = "Upgrading from OKD 4.15 to 4.17 | OKD Kubernetes Platform"
description = "Upgrading to OKD 4.17 for existing 4.15 clusters requires special attention and passing through 4.16."
full_description = "Upgrade NotesFrom 4.15 to 4.17Upgrading from OKD 4.15 to 4.17Please also see the 4.16 and 4.17 release blog post. There was a large gap of releases after 4.15. 4.16 and 4.17 were released concurrently based off a significantly different build process. OKD 4.16 is only intended to be used as a pass-through for clusters going from 4.15 through to 4.17. Extra care should be taken for upgrading an existing OKD 4.15 cluster to 4.17. Your cluster will need to pass from OKD 4.15, to the latest version of 4.16 before proceeding to 4.17. Upgrades should take place from the March 2024 FCOS stream of OKD (4.15.0-0.okd-2024-03-10-010116), upgrades from other versions may require additional work. tipRead these notes in conjunction with the usual Product Documentation for Upgrading 📄️ 4.15 -> 4.16 UpgradeTake a cluster from 4.15 to 4.16 before upgrading to 4.17📄️ FCOS -> SCOS MigrationOKD Node OS has changed from a Fedora to a CentOS Stream base.📄️ OKD 4.16 Known IssuesOKD 4.16 should only be used as a step-thru to 4.17📄️ Hashicorp Vault & default registry semanticsDefault registry changes effects Vault and other applicationsEdit this page 📄️ Hashicorp Vault & default registry semanticsDefault registry changes effects Vault and other applications"
