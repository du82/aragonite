["https://www.okd.io"]
title = "Kubernetes at Scale on any Infrastructure | OKD Kubernetes Platform"
description = "Bringing together 100+ components to provide comprehensive tooling for administrators and developers, we've made choices so you  don't have to. Deploy in-cloud or on-prem and join a community  embracing the latest in cloud emerging technologies."
full_description = '''So what does that mean exactly?Cloud buzzwords, right? In short, OKD is a very opinionated deployment of Kubernetes. Kubernetes is a collection of software and design patterns to operate applications at scale.We add some features directly as modifications into Kubernetes, but mostly we augment the platform by "preinstalling" a large amount of pieces of software called "Operators" into the deployed cluster.These operators then provide all of our cluster components (over 100 of them!) which make up the platform, such as OS upgrades, web consoles, monitoring and image buildingGo to Docsserver_clusterIn-cloud or on-premOKD is intended to be run at all scales from cloud to metal to edge. The installer is fully automated on some platforms (such as AWS), or supports configuration into custom environments (such as metal or labs).OpinionatedThe cloud landscape is vast. From GitOps to Service Meshes, Virtualisation to Storage, OKD integrated deployments of leading projects. Recommended Design Patterns enchance security posture and defaults include hardened configurationEmerging TechnologiesOKD adopts developing best practise and technology. A great platform for technologists and students to learn, experiment and contribute across the cloud ecosystem. For OpenShift contributors and partners our technical similarity makes us an ideal lab and development environemnt.What's in the box?Operating SystemNodes run an immutable operating system that is updated and managed through cluster APIs.KubernetesThe industry leading way to orchestrate. OKD is 100% compliant, with additional patches on some Kubernetes components to support some advanced featuresets.Cluster ComponentsFull featured web console, authentication, image registry/tooling, monitoring, node config/upgrades, networking and operator management out of the box.OKDeratorsInstallable catalog of GitOps, Storage, Mesh and Storage (+ more!) operators using leading OSS projects. Designed to work easily with you and each other.'''
