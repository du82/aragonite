["https://okd.io/blog/2021/03/16/testing-deployment-workshop"]
title = "OKD Testing and Deployment Workshop | OKD Kubernetes Platform"
description = "The OKD Working Group is hosting a virtual workshop on testing and deploying OKD4"
full_description = "OKD Testing and Deployment WorkshopMarch 16, 2021 · 3 min readThe OKD Working Group is hosting a virtual workshop on testing and deploying OKD4​ On March 20th, OKD-Working Group is hosting a one day event to bring together people from the OKD and related Open Source project communities to collaborate on testing and documentation of the OKD 4 install and upgrade processes for the various platforms that people are deploying OKD 4 on as well to identify any issues with the current documentation for these processes and triage them together. The day will start with all attendees together in the ‘main stage’ area for 2 hours where we will give an short welcome and describe the logistics for the day, give a brief introduction to OKD4 itself then walk thru a install deployment to vSphere using UPI approach along with a few other more universal best practices such as DNS/DHCP server configuration) that apply to all deployment targets. Then we will break into tracks specific to the deployment target platforms for deep dive demos with Q/A, try and answer any questions you have about your specific deployment target's configurations, identify any missing pieces in the documentation and triage the documentation as we go. There will be 4 track break-out rooms set-up for 3 hours of deployment walk throughs and Q/A with session leads: vSphere/UPI - lead by Jaime Magiera (UMich) and Josef Meier (Rohde & Schwarz) Bare Metal/UPI - lead by Andrew Sullivan (Red Hat) and Jason Pittman (Red Hat) Single Node Cluster - lead by Charro Gruver (Red Hat) and Bruce Link (BCIT) Home Lab Setup - lead by Craig Robinson (Red Hat) and Sri Ramanujam (Datto) Our goal is to triage our existing community documentation, identify any short comings and encourage your participation in the OKD-Working Group's testing of the installation and upgrade processes for each OKD release. This is community event NOT meant as a substitute for Red Hat technical support. There is no admission or ticket charge for OKD-Working Group events. However, you are required to complete a free hopin.to platform registration and watch the hopin site for updates about registration and schedule updates. We are committed to fostering an open and welcoming environment at our working group meetings and events. We set expectations for inclusive behavior through our code of conduct and media policies, and are prepared to enforce these. You can Register for the workshop here: https://hopin.com/events/okd-testing-and-deployment-workshopEdit this page"
