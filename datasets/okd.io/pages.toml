["https://okd.io/docs/community/conduct"]
title = "OKD Community Code of Conduct | OKD Kubernetes Platform"
description = "Every community can be strengthened by a diverse variety of viewpoints,"
full_description = "OKD Community Code of ConductOn this pageOKD Community Code of Conduct Every community can be strengthened by a diverse variety of viewpoints, insights, opinions, skill sets, and skill levels. However, with diversity comes the potential for disagreement and miscommunication. The purpose of this Code of Conduct is to ensure that disagreements and differences of opinion are conducted respectfully and on their own merits, without personal attacks or other behavior that might create an unsafe or unwelcoming environment. These policies are not designed to be a comprehensive set of things you cannot do. We ask that you treat your fellow community members with respect and courtesy. This Code of Conduct should be followed in spirit as much as in letter and is not exhaustive. All okd events and community members are governed by this Code of Conduct and anti-harassment policy. We expect working group chairs and organizers to enforce these guidelines throughout all events, and we expect attendees, speakers, sponsors, and volunteers to help ensure a safe environment for our whole community. For the purposes of this Code of Conduct: An event is any in-person or on-line gathering, e-mail thread, chat room, code or documentation contribution, or any situation where okd community members are invited to gather and communicate. A community member is anyone who attends okd events and/or participates in contributing or maintaining the okd project. okd community members are: Considerate: Contributions of every kind have far-ranging consequences. Just as your work depends on the work of others, decisions you make surrounding your contributions to the okd community affect your fellow community members. You are strongly encouraged to take those consequences into account while making decisions. Additionally, pinging a specific person with general questions is inconsiderate to that person. Always pose general question to the community as a whole. Patient: Asynchronous communication can come with its own frustrations, even in the most responsive of communities. Please remember that our community is largely built on volunteered time. It might take some time to receive a response to questions, contributions, and requests for support. Repeated bumps or reminders in rapid succession are not good displays of patience. Always wait patiently for a response. Respectful: Every community inevitably has disagreements, but disagreements are never an excuse for rudeness, hostility, threatening behavior, abuse (verbal or physical), or personal attacks. Always remember that it is possible to disagree respectfully and courteously. Kind: Everyone should feel welcome in the okd community, regardless of background. Please be courteous, respectful and polite to fellow community members. Additionally, you are encouraged not to make assumptions about the background or identity of your fellow community members. Always follow the xrefAnti-harassment policy. Inquisitive: We encourage okd community members to ask early and ask often. Rather than asking whether you can ask a question (the answer is always yes!), simply ask your question. You are encouraged to provide as many specifics as possible. Code snippets in the form of Gists or other paste site links are almost always needed in order to get the most helpful answers. Refrain from pasting multiple lines of code directly into the Google Group channel or emails. Instead use gist.github.com or another paste site to provide code snippets. Always remember that the only stupid question is the one that does not get asked. Helpful: The okd community is committed to being a welcoming environment for all users, regardless of skill level. Our community cannot grow without an environment where new users feel safe and comfortable asking questions. It can become frustrating to answer the same questions repeatedly; however, community members are expected to remain courteous and helpful to all users equally, regardless of skill or knowledge level. At the same time, everyone is expected to read the provided documentation thoroughly. We are happy to answer questions, provide strategic guidance, and suggest effective workflows, but we are not here to do your job for you. Always remember we were all beginners once upon a time, Anti-harassment policy​ Harassment includes (but is not limited to) the following behaviors: Offensive comments related to gender (including gender expression and identity), age, sexual orientation, disability, physical appearance, body size, race, and religion Derogatory terminology including words commonly known to be slurs Posting sexual images or imagery in public spaces Deliberate intimidation Stalking Posting others’ personal information without explicit permission Sustained disruption of talks or other events Inappropriate physical contact Unwelcome sexual attention Community members asked to stop any harassing behavior are expected to comply immediately. In particular, community members should not use sexual images, activities, or other material. Community members should not use sexual attire or otherwise create a sexualized environment at community events. In addition to the behaviors outlined above, continuing to behave in a certain way after you have been asked to stop also constitutes harassment, even if that behavior is not specifically outlined in this policy. It is considerate and respectful to stop doing something after you have been asked to stop, and all community members are expected to comply with such requests immediately. Policy violations​ Instances of abusive, harassing, or otherwise unacceptable behavior may be reported by contacting codeofconduct@okd.io. If a community member engages in harassing behavior, organizers or working group chairs may take any action deemed appropriate. These actions may include but are not limited to warning the offender and expelling the offender from an event. The OKD working group leaders might determine that the offender should be barred from participating in the community. Event organizers and working group leaders will be happy to help community members contact security or local law enforcement, provide escorts to an alternate location, or otherwise assist those experiencing harassment to feel safe for the duration of an event. We value the safety and well-being of our community members and want everyone to feel welcome at our events, both online and in-person. We expect all community members to follow these policies during all of our events. The okd Community Code of Conduct is licensed under the Creative Commons Attribution-Share Alike 3.0 license. Our Code of Conduct was adapted from Codes of Conduct of other open source projects, including: Ansible Contributor Covenant Elastic The Fedora Project OpenStack Puppet Labs Ubuntu Edit this page"
year_published = 2025
clearnet = "https://okd.io/docs/community/conduct"
