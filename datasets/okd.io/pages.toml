full_description = "wg_docsDocumentation SubgroupOn this pageDocumentation Subgroup The Documentation working group is responsible for improving the OKD documentation. Both the community documentation (this site) and the product documentation. Joining the group​ The Documentation Subgroup is open to all. You don't need to be invited to join, just attend on of the bi-weekly video calls: Calendar link : OKD working group calendar Agenda link : Documentation working group agenda and meeting nodes Product Documentation​ The OKD product documentation is maintained in the same git repository as Red Hat OpenShift product documentation, as they are sibling projects and largely share the same source code. The process for making changes to the documentation is outlined in the documentation section Community Documentation​ This site is the community documentation. It is hosted on github and uses a static site generator to convert the Markdown documents in the git repo into this website. Details of how to modify the site content is contained on the page Modifying OKD.io.Edit this page"
