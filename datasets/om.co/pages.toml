full_description = "February 28, 2025 Skype is dead. What happened? Microsoft is shutting down Skype. It will go offline in May 2025. “We’ve learned a lot from Skype over the years that we’ve put into Teams as we’ve evolved teams over the last seven to eight years,” Jeff Teper, president of Microsoft 365 collaborative apps and platforms, said in an interview with CNBC. “But we felt like now is the time because we can be simpler for the market, for our customer base, and we can deliver more innovation faster just by being focused on Teams.” (CNBC) It makes me incredibly sad, but I am not surprised. The writing was on the wall. Skype has been dying a slow death for a long time. As far back as 2018, it was obvious what lay in store. At the time, I wrote about the great Skype vanishing. Skype, was once a beloved product, one that I loved… Continue readingContinue reading Skype is dead. What happened? On Technology 9 comments February 23, 2025 What You See Is “Not” What You Get! As February winds down, it’s the perfect time to send the latest edition of my monthly letter. It’s been a busy month, both personally and professionally. This is reflected in how often I have written (or not written). The reason doesn’t matter; whenever I have spare time, I end up either reading or listening to a book or long feature articles. It’s good to take your social media time and reallocate it to reading books. I’ve also been watching a bit of television. Sometimes, it’s good to be part of the cultural zeitgeist, for it triggers thoughts worth writing about. Take, for example, “Apple Cider Vinegar,” a Netflix series inspired by Australian wellness influencer and con woman Belle Gibson. The series examines how Gibson used social media to gain fame through lies about her medical problems and promote a false narrative around cancer. Gibson leveraged her… Continue readingContinue reading What You See Is “Not” What You Get! A Letter From Om, On Technology 0 comments February 11, 2025 AI, China & Copium When it comes to technology in general, and artificial intelligence in particular, it has been surreal to watch events unfold. From politicians in technology backwaters to opportunists and fashion billionaires, everyone has jumped on the “AI” version of Shinkansen. And if that wasn’t enough, the arrival of DeepSeek has unleashed a wave of fear, nationalism, and old-fashioned protectionism. DeepSeek makes two major points. First, as noted earlier, DeepSeek represents more than just a product — it embodies a different way of thinking that challenges the conventional approach to AI. It’s not about a specific company, but about demonstrating that others can also leapfrog the big boys with clever thinking. Second, for the past ten years, the Chinese have been relentlessly focused on their “Made in China 2025” initiative. It shouldn’t come as a surprise that the technology gap between the U.S. and… Continue readingContinue reading AI, China & Copium On Technology 7 comments"
