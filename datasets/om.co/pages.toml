description = "Microsoft is shutting down Skype. It will go offline in May 2025. “We’ve learned a lot from Skype over the years that we’ve put into Teams as we’ve evolved teams over the last seven to eight years,…"
full_description = "Sarah Williams says: February 28, 2025 at 10:46 am Skype’s a great loss, especially to those wanting to maintain international connections without incurring colossal phone bills. But it just didn’t keep pace with the march of social media and how those platforms expanded from basic messaging boards to the interactive versions we have today, i.e. live phone calling via electronic devices and people’s willingness to pay internet bills = primary communication. Owning a data supply is now more important than owning a landline or even a bog standard mobile phone. Sorry Skype – loved you for a long time. Loading... Reply Om Malik says: February 28, 2025 at 11:08 am Skype is what happens to when cool startups end up at boring big companies where founders have checked out. Loading... Reply Chaz Ubell says: February 28, 2025 at 11:36 am I do remember using Skype during the aughts after giving up on other non-voice based chat platforms (i’m looking at you AIM). It was so minimal but full featured. Loading... Reply Om Malik says: March 1, 2025 at 10:24 am Yeah, we all used it so much for so many things. Loading... Reply Dwight Silverman says: February 28, 2025 at 12:42 pm Om, “…but for now, let’s call it what it is. Microsoft bought and effectively killed Skype. ” Yeah but a LOT OF TIME passed between “Microsoft bought” and “killed Skype.” Microsoft did nurture it at first, long enough for it to, as you pointed out, kill the long-distance phone business. So it had a good life – 14 years with MSFT. The saddest part is that Teams, which is an abomination and a still-weak attempt to clone Slack, was sent to dispatch the victim. Loading... Reply Om Malik says: March 1, 2025 at 10:24 am Dwight, respectfully I disagree. This one falls on Microsoft’s feet. They basically lied to Microsoft-ify Skype into an enterprise app and it really didn’t adapt to that market. They missed the point of Skype — Whatsapp has shown that non-enterprise can be a big market for communication apps. Look at what happens over WA in places like india and the African continent. It was Slack’s opportunity. The product line was managed by line cooks not chefs. Anyway, it is gone for now. Loading... Reply"
