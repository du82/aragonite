full_description = "Nikhil says: February 11, 2025 at 7:04 pm Agree 100%. Sharing a piece I wrote about America’s dying competitive edgeD Loading... Reply Tiru says: February 12, 2025 at 4:42 am “the US will become an island surrounded by a global internet run by Chinese software.” The above comment accurately reflects trends across various industries, including automotive, renewable energy, and solar. BYD cars are seen worldwide, except in the U.S. Loading... Reply Om Malik says: February 12, 2025 at 9:42 am I don’t think that is is a problem. The problem is that we are not exposed enough to the rest of the world’s work and assume we are the best. This will be the challenge. I have taken a ride in a BYD EV. For the price, they run circles around Tesla and most definitely around the Germans. Loading... Reply Paul says: February 12, 2025 at 5:45 am I think it’s broken into two pieces. basic AI tools as a commodity, and then the more nuanced approach of designing effective focused systems that can make use of it. Its that second part that is intriguing because too much of the coverage is focused on general tools, not single issue specific tools (like understanding an x-ray) that will have a better return on investment. Loading... Reply Om Malik says: February 12, 2025 at 9:43 am Paul, What you say is 100 percent correct. Sadly honest, logical thinking around “automation” argument doesn’t get you valued at insane valuations. Sadly, these days US tech starts with valuations and not value. Loading... Reply Dana F. Blankenhorn says: February 12, 2025 at 5:47 am The success of DeepSeek shows what can be done by a small, focused team. It’s a lesson in entrepreneurship that somehow America forgot, thanks to the enormous cash dumped into AI over the last four years. The fact that DeepSeek did this doesn’t mean the Chinese Cloud Emperors can outdo it, although they might match it. https://www.danablankenhorn.com/2025/01/the-lesson-of-deepseek.html Loading... Reply Om Malik says: February 12, 2025 at 9:45 am Amen to that Dana. Also, even if it is a big team — China has no shortage of engineering talent — it is still taking a different approach. I am not dismissing any of the charges levied against them. The reality is that they have shed the light on a different way of thinking — to me that is more interesting. Loading... Reply"
