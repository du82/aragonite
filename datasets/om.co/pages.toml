full_description = "February 23, 2025 What You See Is “Not” What You Get! As February winds down, it’s the perfect time to send the latest edition of my monthly letter. It’s been a busy month, both personally and professionally. This is reflected in how often I have written (or not written). The reason doesn’t matter; whenever I have spare time, I end up either reading or listening to a book or long feature articles. It’s good to take your social media time and reallocate it to reading books. I’ve also been watching a bit of television. Sometimes, it’s good to be part of the cultural zeitgeist, for it triggers thoughts worth writing about. Take, for example, “Apple Cider Vinegar,” a Netflix series inspired by Australian wellness influencer and con woman Belle Gibson. The series examines how Gibson used social media to gain fame through lies about her medical problems and promote a false narrative around cancer. Gibson leveraged her… Continue readingContinue reading What You See Is “Not” What You Get! A Letter From Om, On Technology 0 comments January 14, 2025 Wait, is it 2025 already? I can’t believe that it is 2025, and it is already two weeks old. And yes, like you, I too feel it has already been a lot. Never in my wildest imagination had I contemplated a nightmare scenario that many Angelenos, including so many of my friends and former colleagues, are currently dealing with on a minute-by-minute basis. Apart from staying in touch with them, I can’t do much to alleviate their situation. But when it is time to rebuild, like all Californians, I will do my best and more. I have tried my best to stay off social platforms. They are now anti-social amplifiers of negative energy, feeding off an unquenchable thirst for attention. It was quite evident in some of the things that were being said on various platforms as the fires raged. I won’t lie — I have a special kind of disdain for those who gloat,… Continue readingContinue reading Wait, is it 2025 already? A Letter From Om, On Technology 12 comments"
