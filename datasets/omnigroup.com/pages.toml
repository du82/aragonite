title = "OmniGraffle for Mac Release Notes"
full_description = "In-App Purchases — In-app purchases have been streamlined to only offer perpetual OmniGraffle 7 licenses for all new purchases. Groups and Lines — Fixed a bug where subgroups of lines end up with the wrong group bounds when rotated. Tables — Fixed a bug where Tables containing size-to-fit cells with wrapping text would end up with corrupted layout after duplication. Lines — Fixed a bug where the resizing of multiple lines could fail to save. Stability — Fixed a crash when trying to run an Omni Automation script called by AppleScript with the evaluate javascript command. PSD Export — Photoshop export now uses run-length encoding to reduce file size. AppleScript — Fixed AppleScript access to a layer’s filtered list of shapes, lines, groups, and subgraphs."
