full_description = "The Omni Show: The Return of Dr. Luc Beaudoin by Andrew Mason July 10, 2024 Share: In this episode of The Omni Show, we’re joined by Dr. Luc Beaudoin, adjunct professor of education at Simon Fraser University and head of CogSci Apps. We discuss the importance of contextual computing and the concept of ubiquitous linking, which aims to make the operation of copying and using links universal across applications and devices. Dr. Beaudoin digs into the psychological benefits of this approach, emphasizing how it can extend cognitive capabilities and streamline workflows. The Omni Group’s apps, such as OmniFocus and OmniOutliner, can also support cognitive productivity by helping users organize and manage their tasks and information effectively. Achieve more of your goals when you download Omni Software for Mac, iPhone, iPad, Apple Watch, and Apple Vision Pro —and if you have any questions or feedback, email support@omnigroup.com. Our amazing Support Humans are standing by, ready to help. Enjoy!"
