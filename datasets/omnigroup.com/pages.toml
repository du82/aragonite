full_description = "The Omni Group makes and supports awesome apps for Mac, iPad, iPhone, Apple Watch, Apple Vision Pro, and the web. We’re an employee-owned company founded in beautiful Seattle, Washington, with employees based across the Pacific Northwest and beyond. We started in the early ’90s as a consulting company. Our focus on the NeXT platform allowed us, a few years later, to move easily to Mac OS X and iOS. We’ve contributed to the success of those platforms, and we’ve been fortunate in sharing in their phenomenal growth. The Omni Group, like our software, is designed for the long haul — we recently celebrated our 30th anniversary. We believe our success is due to our simple philosophy: we respect our customers and provide long-term support. We try to keep the office fun: serious but not somber. We treat each other with respect, and we cultivate pride in our work. We enjoy working with smart, talented, and passionate people who share our philosophy of respect for customers. And we have fun making and supporting high-quality apps that help people get their work done. Omni’s distinctive productivity applications have won three Macworld Editors’ Choice awards, a MacUser UK “Maxine” award, Macworld Expo Best of Show, two Mac Observer Editors’ Choice Awards, an iPhone Alley Editors’ Choice award, and five Apple Design awards. © 1994–2025 The Omni Group; Apple, MacBook, the Apple logo, iPad, iPhone, Apple Watch, and App Store are trademarks of Apple Inc., registered in the U.S. and other countries and regions. Apple Vision Pro is a trademark of Apple Inc."
