full_description = "July 9, 2024 Omni Automation Install Links Now Available Everywhere “Look, Tap, and Approve!” Install Links for Omni Automation plug-ins were originally developed in response to early experiences with the Apple Vision Pro. We like them so much, we implemented them across all platforms—first in OmniFocus and OmniPlan, and now also in OmniGraffle and OmniOutliner! June 26, 2024 The Omni Show: Post-WWDC Roadmap Update In this episode of the Omni Show, we have a special post-WWDC roadmap update with Ken Case, the CEO of the Omni Group. Ken expands on his most recent blog post, where shares valuable updates from Apple WWDC developer conference. Omni Roadmap 2024 — Post-WWDC Update Apple's annual developer conference (WWDC) always brings exciting news about what will be coming to their platform, and this year's news about Apple Intelligence is no exception! After briefly reflecting on the app updates we've shipped already this year, we look ahead to what Apple Intelligence brings to the platform and how that affects our development roadmap for future updates. June 26, 2024 June 17, 2024 The Omni Show: How Brian Hogan Uses OmniFocus In this episode, we interview Brian Hogan, the Director of Developer Education at Temporal Technologies. He shares how Omni software allows him to manage his workload and template his lesson plans to teach more effectively. We also discuss the value of capturing tasks for accountability, using the Eisenhower Matrix to prioritize, and utilizing OmniFocus to create clarity. June 5, 2024 OmniFocus 4.3 Now Available OmniFocus 4.3 is now available—universally across Mac, iPhone, iPad, Apple Watch, and Apple Vision Pro! This release introduces support for device Focus Filters, a new Favorite Perspective shortcut, and much more. June 3, 2024 The Omni Show: How Jamie Thingelstad Uses OmniFocus Today, we have a really smart, inspiring guest, plus we’re excited to share a new experiment we're trying out: our very first video episode of The Omni Show! We plan to try some more experimental episodes in video format; so, we would love to hear any feedback you might have. If you enjoy the video version of the show, we’d appreciate a “like” and a “subscribe”."
