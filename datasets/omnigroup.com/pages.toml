["https://omnigroup.com/mission"]
title = "Mission - The Omni Group"
description = "Creators of Mac, iPad, and iPhone productivity software. Proud to bring you OmniFocus, OmniOutliner, OmniGraffle, and OmniPlan."
full_description = "We build software to help people accomplish more every day. We believe that being productive isn't just about getting more work done; it's about doing better quality work in less time, freeing up time and mental energy to spend on other things in our lives. At the Omni Group, one of our inspirational touchpoints is a quote from a 1990 interview with Steve Jobs, filmed shortly after he launched NeXT: I think one of the things that really separates us from the high primates is that we’re tool builders. I read a study that measured the efficiency of locomotion for various species on the planet. The condor used the least energy to move a kilometer. And, humans came in with a rather unimpressive showing, about a third of the way down the list. It was not too proud a showing for the crown of creation. So, that didn’t look so good. But, then somebody at Scientific American had the insight to test the efficiency of locomotion for a man on a bicycle. And, a man on a bicycle, a human on a bicycle, blew the condor away, completely off the top of the charts. And that’s what a computer is to me. What a computer is to me is it’s the most remarkable tool that we’ve ever come up with, and it’s the equivalent of a bicycle for our minds. Steve’s notion of a bicycle for our minds—a tool which we can leverage to dramatically increase our mental effectiveness—inspires us to build the apps we build here at Omni. For computers to assist us in our pursuits, they need software applications. As developers of productivity apps, it’s our role to design and build apps that empower our customers. At the Omni Group, our goal is to make the absolutely best software that we can make. Rather than seeking growth and profits at all costs, we've carefully and intentionally built a sustainable, self-funded and bootstrapped business. This gives us the freedom to focus on the platforms that make developers and users the most productive: Mac, iPhone, iPad, and Apple Watch. It also gives us the time we need to make our software the best it can be on those platforms—so we can ship software when it's ready, rather than needing to ship early because we're running out of funding from investors."
