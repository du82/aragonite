["https://omnigroup.com/releasenotes/omnifocus/4.5.2"]
title = "OmniFocus 4 for All Platforms Release Notes"
full_description = "OmniFocus 4.5.2 for All Platforms OmniFocus 4.5.2 includes more powerful notifications on iPhone and iPad, a new Apple Watch complication, improvements to Smart Match, updates to our Shortcuts actions (including an all-new Sync action), better VoiceOver support for repeats, enhanced keyboard navigation on iPad, a new Omni Automation API, and a collection of bug fixes. All Platforms Omni Automation — Omni Automation can be used to change the color of a custom perspective icon. Shortcuts — Sync OmniFocus action has been added. In-App Purchases — In-app purchases have been streamlined to offer perpetual OmniFocus 4 licenses for all new purchases. Shortcuts — Find Actions has a new “Item Type” filter, which supports filtering by action, group, or project. Shortcuts — Find Projects filter for “Folder” now supports both “is” and “is not”, which apply to projects directly inside the selected folder. Shortcuts — Quick Entry, Quick Open, and Sync OmniFocus actions are grouped under a new Application header. Smart Match — Smart Match has been updated to prioritize consecutive letters over consecutive words, as well as words over non-contiguous capital letters, improving results when assigning projects and tags. Tips — Updated “Hide feature tips” label in settings. Custom Perspectives — Tagged actions inside of groups now display consistently whether or not “Preserve Hierarchy” is enabled. Estimated Duration — Estimated Duration consistently uses minutes by default, instead of hours, even when “Latest Start” notifications are enabled. Forecast — Actions added to groups will no longer appear to be duplicates of the selected action. Genmoji — Genmoji in notes can be copied and pasted more reliably, and use consistent spacing. Genmoji — Genmoji in notes display in previews for unselected rows. Mac Sync — Changes received from other devices are integrated more quickly. (The app still waits for a pause in editing, to avoid interrupting edits in progress.) Defer Dates — Defer Date field in the Outline now immediately updates. Forecast — Piano key date tiles at the top of the Outline highlight correctly when dragging an item across, rather than remaining purple. Settings — Sync Settings load consistently, resolving an issue which could block editing of sync account settings. Sync — Windows and tabs consistently restore when incorporating sync changes, resolving an issue which could unexpectedly close open windows or tabs. Tips — Synced changes to the “Hide feature tips” setting immediately updates the checkbox on Mac, in addition to updating the setting."
