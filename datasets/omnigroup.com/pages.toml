full_description = "We appreciate working with reviewers, press, media, podcasters, bloggers, authors and publishers worldwide. Below you’ll find information, guidelines and artwork which you may find useful. If you have any other requests – such as scheduling an interview, getting a review package or being added to the press list – please reach out to pr@omnigroup.com. Most press releases are sent when we’re announcing either a new product or a major update to an existing product. Alternately, or in addition, you can sign up for the Omni Newsletter, and you can read our blog, which has an RSS feed. This package contains app icons for press, media, bloggers and publishers. They’re free to use when referencing the Omni Group software and company. Please refer to the trademark guidelines. This package contains screen shot images. They’re free to use when referencing the Omni Group software and company, with the attribution “Image courtesy of the Omni Group.” If you’re looking for a particular screenshot to use as well, just ask — we might have something for you. If you use an Omni Group product in a book, publication, magazine, or whatever, we’d request that you include an attribution. Something along the lines of: Specific application icons and application names of the Omni Group are trademarked. You’re welcome to use each name (ex: OmniPlan) in your publication, article, book, or review. For extensive use, commercial use, or use of our product proximate to your commercial product (a conference, app, book, etc.), please ensure that a trademark attribution notice is included in the credit section giving notice of the Omni Group’s ownership of its trademark(s). For example, “OmniFocus and the OmniFocus icon are trademarks of the Omni Group.” Another example, “OmniGraffle is a trademark of the Omni Group.” Please don’t misrepresent the purpose or idea of the application. In the text of an advertisement, brochure, or other material, please use the appropriate trademark symbol (IM, ® the first time the Omni Group trademark appears. If you are unsure, or you have any questions, just ask - we’ll be happy to clarify or help figure out how to handle a particular situation. We also reserve the right to withdraw permission, if needed."
