full_description = "February 24, 2025 The Omni Show: How Rosemary Orchard Uses OmniFocus In this episode of The Omni Show, we sit down with Rosemary Orchard, a renowned productivity expert and co-host of TWiT.tv’s iOS Today, to explore how she optimizes her workflow with OmniFocus. February 10, 2025 The Omni Show: Omni Group’s 2025 Roadmap In this episode of The Omni Show, we sit down with Ken Case, CEO of the Omni Group, to dive into this year's 2025 Omni Roadmap Blog Post. Ken shares insights on remote work, automation improvements, and getting the inner-workings in Omni apps ready for Apple Intelligence. Omni Roadmap 2025 One of our traditions is to set aside some time at the beginning of each year to reflect on the past and to share plans for the future: our roadmap. Learn more about our plans for OmniGraffle 8, document links that can be synced across devices and shared between team members, new features coming to OmniFocus 4, and Apple Intelligence. January 29, 2025 January 27, 2025 The Omni Show: How Robert Pope Uses OmniFocus In this episode, we hear from Robert Pope, IT Director at the Online Learning Consortium (and avid OmniFocus user). Robert shares how he uses OmniFocus to build a comprehensive workflow for task and project management, by applying the principles of GTD (Getting Things Done), and integrating with tools like Jira. December 30, 2024 The Omni Show: How Rick Manelius Uses OmniFocus Rick Manelius, founder of Atomic Form, joins The Omni Show to discuss how he integrates productivity tools like OmniFocus into his multifaceted life as a tech entrepreneur and family man. Rick delves into the innovative work of Atomic Form, which is transforming the way digital art, NFTs and their historical provenance are not only preserved, but also experienced and appreciated. December 16, 2024 The Omni Show: How Victor Savkin Uses OmniFocus In this episode, Victor Savkin, CTO at NX and ex-Googler, discusses his approach to productivity and task management. Get a behind-the-scenes look at how OmniFocus has been instrumental in managing his complex workload and responsibilities. From exploring his passion for tooling to reflecting on how design and ergonomics influence quality, this episode unearths Victor’s unique insights and experience in the software space."
