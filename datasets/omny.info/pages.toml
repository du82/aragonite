["https://omny.info/faq/how-omny-works"]
title = "How OMNY Works"
description = "OMNY website"
full_description = "Frequently Asked QuestionsHow OMNY WorksHow does OMNY work?With OMNY, you can use your own contactless credit, debit card, or reloadable prepaid or pre-tax benefit card, smart device, wearable or an OMNY card to pay the fare. Just choose your preferred payment method, tap at an OMNY reader, and go!Where can I use OMNY?OMNY is available at all subway stations, MTA-operated buses, Hudson Rail Link, the Roosevelt Island Tram, and AirTrain-Howard Beach and AirTrain-Jamaica stations in New York City. More transit providers will be added soon. OMNY supports full-fare and reduced-fare pay-per-ride options, including free transfers and fare capping.What are all the ways I can pay with OMNY? With OMNY, you can use your own contactless credit, debit, or reloadable prepaid card, the digital wallet supported by your smart phone, smart watch, or wearable, or an OMNY card. Cards issued on the Visa®, Mastercard®, American Express®, Discover®, UnionPay, and JCB networks are accepted today. Digital wallets on your smart device are supported today, including Google Pay™, Apple Pay®, and more. Learn more about contactless cards and digital wallets. You can also use cash to buy a new OMNY card or reload an existing OMNY card at more than 2,000 retail locations across the New York metropolitan area. OMNY card availability may vary by retailer. Find a retail location near you. What forms of payment does an OMNY vending machine accept?The OMNY vending machine accepts credit and debit cards (including international cards) from banks and financial institutions. The machine also accepts cash and dispenses change. Mobile wallets (Apple Pay, Google Pay, etc.) are also accepted. About cash: machines can return cash in denominations of $1 bills and $5 bills. Coins will also be dispensed. The return value will be subject to the availability at the OMNY vending machine. For example, if the change is $5.00 and the machine is out of $5 bills, it will issue five $1 bills instead. The maximum amount of change the machine can return is $9.95.Does the OMNY vending machine accept EBT cards as a payment method?An EBT card can be used as a payment method for a new card purchase as well as reloading an existing card at an OMNY vending machine. Note: This is different in the retail network, where a customer can use their EBT card to reload an OMNY card but cannot use it to purchase a new card.Can I use my transit benefit card with OMNY?If your transit benefit provider has issued you a contactless credit, debit, or reloadable prepaid card, you should be able to use that card at an OMNY reader and register it in your OMNY account. This mainly depends on whether the contactless card is NFC-enabled. Please contact your transit benefit provider for more information about the contactless card capabilities, as well as to determine if their products can also be supported in digital wallets.Can I use my pre-tax transit benefit card to purchase an OMNY card?You can purchase an OMNY card with your pre-tax transit benefit card through the OMNY vending machines located in subway stations. Pre-tax transit benefit cards are not currently accepted at retail locations where OMNY cards are sold; however, they can be used to reload existing OMNY cards online or through the OMNY Call Center. Important: If you load transit benefit funds to an OMNY card, you won't be able to tap for others. Note: If your pre-tax transit benefit card has a contactless symbol you can tap the OMNY reader today to pay your fare. You may also be able to add your pre-tax transit benefit card to a digital wallet on your phone or smart device. Check with your transit benefit provider.How do I know if my card is contactless and can be used with OMNY?Contactless cards have this symbol on the front or back. If you see this symbol on your card, you can tap it at OMNY readers in subway stations and on buses to make fare payments and enter the system. Learn more about contactless cards.How do I know if my smart device can be used with OMNY?Digital wallets are mobile applications that allow you to make payments with smart devices, such as your smart phone, smart watch, or wearable. Like contactless cards, smart devices also use contactless technology. Before you can make fare payments with your smart device at OMNY readers, you will need to add your bank card to your digital wallet. Learn more about digital wallets.Do I always have to use the same payment method with OMNY?You can choose between as many payment methods as you prefer. Keep in mind that only one payment method can be used to pay each fare at a single time. Important: You must use the same payment method throughout each individual trip to qualify for benefits like free transfers and fare capped rides. For example, if you tap your contactless card to ride the subway, you must tap that same contactless card to obtain your free transfer to a local bus. You cannot switch between your contactless card and other payment methods and still obtain your free transfer. If you switch between payment methods during an individual trip, your transfer will be treated as a new trip, and you will be charged for your transfer.I have multiple contactless cards in my physical wallet. Which card will be charged if I tap my physical wallet on an OMNY reader?To ensure that the fare is charged to your preferred payment method, please remove your card from your physical wallet and tap it on the OMNY reader. This will prevent you from accidentally charging other cards in your physical wallet. OMNY is a contactless payment system and will accept payment from any NFC-enabled contactless card. Since OMNY does not know which card is your preferred payment method, the system will charge your fare to the first card that it reads.I have multiple cards in my digital wallet. Which card will be charged if I tap my smart device on an OMNY reader?To ensure that the fare is charged to your preferred payment method, please select the card in your digital wallet that you want to use and tap your smart device on the OMNY reader. Depending on the digital wallet you are using, and the number of cards in your digital wallet, you may need to select a default card.How do I register for OMNY as a new Reduced-Fare customer?You can apply by mail. In-person applications are briefly suspended, and the online application is not currently available. As the MTA transitions Reduced-Fare customers from MetroCard to OMNY, new customers who apply by mail may experience longer processing times of up to three months before receiving a Reduced-Fare OMNY card. If you need access to the Reduced-Fare program right away, you can receive in-person assistance and a Temporary Reduced-Fare MetroCard at: A station booth at any subway station Our Customer Service Center in Lower Manhattan One of our mobile sales buses or vans Check back at mta.info/reduced-fare more updates on Reduced-Fare enrollment soon.Will I still be able to use my Reduced-Fare MetroCard once I switch to OMNY?When you switch to OMNY, you can keep using your Reduced-Fare MetroCard until you spend down any remaining value or the card has expired, and then use OMNY for all future trips. Once your MetroCard expires, you will be fully switched to OMNY.How do I get a Reduced-Fare OMNY card?Existing Reduced-Fare MetroCard customers will receive OMNY cards in the mail starting in December. New applicants can apply by mail. In-person applications are briefly suspended, and the online application is not currently available. We will resume accepting in-person applications at our Customer Service Center in Lower Manhattan in December, followed by other locations. Check back soon for the exact dates. As the MTA transitions Reduced-Fare customers from MetroCard to OMNY, new customers who apply by mail may experience longer processing times of up to three months before receiving a Reduced-Fare OMNY card. Once you have your OMNY card, you can add value online through an optional OMNY account or at participating stores.What are OMNY readers?OMNY readers are the face of the MTA’s new contactless fare payment system. OMNY readers serve as point-of-sale terminals, allowing you to pay your fare and enter the system – all in a split second. Click here to learn more about OMNY readers, including what the OMNY reader screens mean. We have designed OMNY readers with various features to ensure that accessibility standards are achieved. Learn more about accessibility.Can I see my fare on the OMNY reader?The fare charged to your payment method is not displayed on the OMNY reader screen. For more information on your fare history, please contact OMNY Customer Service by calling 877-789-6669 during the hours of 8 am to 8 pm Monday - Friday, and 8 am to 5 pm Saturday - Sunday or email us at customersupport@omny.info.How do I know if my payment method was charged?Your fares are currently charged individually for each trip. You will see each charge on the statement associated with your payment method. Important: Your payment method will be authorized the first time it is tapped on an OMNY reader. This will trigger an authorization amount depending on your payment method. This authorization amount is temporary and will be reversed when the actual fare is charged to your payment method.How can I get my blocked payment method accepted again?Contact your bank to resolve any issues with your credit or debit card account. Then contact OMNY Customer Service by calling 877-789-6669 to reauthorize any unpaid fares and restore your card in the OMNY system. Note: It can take up to 15 minutes for your card to be restored after the issue has been resolved.What can I do if my payment was not accepted at the OMNY reader?If you tap your contactless card or smart device and the OMNY reader indicates that the payment was not accepted, you will need to use another payment method to pay for your ride. Your payment may not be accepted for a few reasons. For example, if your payment method has been blocked by your bank or by the MTA, or your smart device is damaged, then you will not be able to use that payment method at any OMNY reader until the issue is resolved. To resolve an issue with your card, please contact your bank. In the meantime, you can use another card, including a card in your digital wallet, or MetroCard. If you are having trouble with your digital wallet, you may need to remove your card from your digital wallet and add it back in. It is possible that your payment method has been blocked if we have not received payment for a prior fare. Until payment is received for that fare, that payment method will remain blocked, even if you use other payment methods in the meantime. You can register for an OMNY account or sign in to troubleshoot issues with your payment method.What should I do if I have an issue when performing a transaction at the OMNY vending machine?You can call OMNY Customer Service at 877-789-6669 for assistance seven days a week: from 8 a.m. to 8 p.m. Monday to Friday, and 8 a.m. to 5 p.m. Saturday and Sunday. You will be asked to provide information from your receipt concerning your transaction. If you do not have a receipt, we can still help. You will be asked to provide the machine number, which is located on the lower right of the OMNY vending machine; please also note the date, time, and station where you attempted to make your transaction.Can I still receive free transfers with OMNY?Yes. The same free transfer rules that apply to MetroCard also apply to OMNY. Your free transfer will not be visible on the OMNY reader screen. Your free transfer will be determined at the end of each day before your payment method is charged. Important: Transfers are valid within two hours of the initial fare payment. Important: You must use the same payment method throughout each individual trip to qualify for benefits like free transfers. For example, if you tap your contactless card to ride the subway, you must tap that same contactless card to obtain your free transfer to a local bus. You cannot switch between your contactless card and other payment methods and still obtain your free transfer. If you switch between payment methods during an individual trip, your transfer will be treated as a new trip, and you will be charged for your transfer. Important: If you travel with multiple riders, you can perform pass-backs to pay for yourself and up to 3 additional riders, including free transfers. You will need to tap multiple times for multiple riders seeking to receive free transfers. For example, if you travel with 3 additional riders, you will need tap 4 times on the first leg of your trip and 4 times for free transfers on the second leg of your trip.Can I receive free transfers with OMNY on the Roosevelt Island Tram?Yes, you will receive free transfers between the Roosevelt Island Tram and subway/bus when you tap to pay the fare with OMNY. Note that free transfers are only available between Roosevelt Island Tram and MTA subways or local, limited and Select Bus Service buses.Can I still pay for multiple riders with OMNY?Yes. The same pass-back rules that apply to MetroCard also apply to OMNY. You can tap and pay for yourself and up to 3 additional riders with the same payment method on a single trip. You will need to tap your payment method for each person that is riding with you. Each tap will result in a full-fare charge. Each person will also be eligible for free transfers. Taps and transfers cannot be moved between OMNY and MetroCard. Important: If you are using a new payment method, you will not be able to perform pass-backs when you use that payment method for the first time. This is because the system must have a record of your payment method before you can perform pass-backs. Important: You are limited to tapping and paying for yourself and 3 additional riders with the same payment method at a single OMNY reader. You may continue using the same payment method at a different OMNY reader. However, if you do so, the 4 free transfers associated with the original 4 taps will be forfeited. If you are traveling with more than 3 additional riders, it is recommended that you use multiple payment methods to prevent the forfeiture of free transfers. Each payment method can support up to 4 riders and 4 free transfers on a single trip.Can I switch between my contactless card and my smart device during my trip?You must use the same payment method throughout each individual trip to qualify for benefits like free transfers. For example, if you tap your contactless card to ride the subway, you must tap that same contactless card to obtain your free transfer to a local bus. You cannot switch between your contactless card and other payment methods and still obtain your free transfer. If you switch between payment methods during an individual trip, your transfer will be treated as a new trip, and you will be charged for your transfer.Can I switch between OMNY and MetroCard during my trip?You mus"
