["https://omny.info/system-rollout"]
title = "System Rollout"
description = "System Rollout"
full_description = "System rolloutOMNY is available throughout New York City OMNY is available at all subway stations and on all buses, allowing you to tap and go throughout New York City. You can use OMNY with your own contactless card or smart device. OMNY currently supports a full-fare, pay-per-ride option for now, including free transfers. New York City Subway You can use OMNY at all subway stations in New York City, and at Staten Island Railway locations where fares are collected. New York City Bus OMNY is currently available on all MTA-operated local, limited, and express buses in New York City, including Select Bus Service routes. For now, OMNY readers located at rear doors will only be operational for Select Bus Service routes with all-door boarding. Access-A-Ride OMNY will be offered for paratransit services during the next phases of the rollout. Access-A-Ride customers will be able to use OMNY as a payment method for paratransit trips. Cash will continue to be accepted as well. Click here to learn more about Access-A-Ride. Additional information will be provided in the coming months. Long Island Rail Road and Metro-North Railroad OMNY will expand to commuter rail during the next phases of the rollout. Customers traveling on Long Island Rail Road or Metro-North Railroad will have access to a new mobile ticketing experience in the OMNY mobile app which will eventually replace eTix. In addition, new physical tickets will be sold at vending machines and ticket offices throughout the region. Additional information will be provided in the coming months."
year_published = 2025
