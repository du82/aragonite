["https://omny.info/faq/account-management"]
title = "Account Management"
description = "OMNY website"
full_description = "Frequently Asked QuestionsAccount ManagementWhat is an OMNY account?An OMNY account centralizes and unifies your experience with the MTA’s new fare payment system. An OMNY account brings together your trips and charges, and offers you many self-service tools, allowing you to manage your account quickly and easily. By registering for an OMNY account, you gain more control of your everyday experience.Do I need to create an OMNY account to use OMNY?Creating an OMNY account is not required. However, there are many benefits available to you by registering for an OMNY account, including tracking your progress toward reaching the 7-day fare cap. Register for an OMNY account today.What are the benefits of an OMNY account?A secure OMNY account allows you to manage your payment methods, track your progress toward reaching the 7-day fare cap, reload your OMNY card, receive account notifications, ask questions to OMNY Customer Service representatives, and more. Enhancements and new features will continue to be added to OMNY over time, which will provide even more benefits to customers with OMNY accounts. Click here to register for an OMNY account. If you need help registering for an OMNY account, contact OMNY Customer Service by calling 877-789-6669.Can I see MetroCard activity in my OMNY account?MetroCard and OMNY are two separate systems, so it is not possible to view MetroCard activity in your OMNY account.How do I add a payment method to my OMNY account?You can add a payment method by logging into your OMNY account. Simply sign in to your OMNY account, access the Wallet page, and select Manage Payment Methods.What are the personal funds and pre-tax benefits on my OMNY account?Within the OMNY card details, under Balance, there are two types of funds: personal funds and pre-tax benefits. Any value you add to your OMNY card with your personal bank card will be loaded to your personal funds. If you add value to your OMNY card using your transit benefit card it will be loaded to your pre-tax funds balance. Note: If your balance becomes negative due to insufficient funds for your trip, that negative balance will be reflected in your personal funds balance. To resolve this, you can pay the negative balance using a personal bank card or cash (not your transit benefit card). You can do this through an OMNY vending machine, your OMNY account, the OMNY Digital Assistant, or by calling OMNY Customer Service at 877-789-6669. Once you’ve paid the negative balance, you’ll need to add more funds to your OMNY card in order to use your card again.Can I add my smart phone, smart watch, or wearable to my OMNY account?With OMNY, you can use your own contactless credit, debit, or reloadable prepaid card, as well as digital wallets supported by your smart phone, smart watch, or wearable. If you use a digital wallet, the card in your digital wallet must be added to your OMNY account first, and all associated trip charges made using your digital wallet will then be captured in your account. Important: When you use a digital wallet, the associated card number may not show up in your OMNY account. Instead, the device primary account number (DPAN) or virtual account number associated with your digital wallet may appear. If you see a card number in your OMNY Wallet that you do not recognize, this may be your DPAN or virtual account number.Do I need to set up a PIN?Establishing a Personal Identification Number (PIN) is not required. However, if you set up a four-digit PIN, you can use it to manage your OMNY account in many ways, such as checking your trip history by contacting OMNY's automated telephone system 24/7 by phone at 877-789-6669. You can set up or change your PIN by logging into your OMNY account and selecting Account Settings.What is the minimum dollar value I can load onto my OMNY card?You can load a minimum of $1.00 at participating OMNY retailers (visit omny.info/retail to find a store near you), or by calling OMNY Customer Service at 877-789-6669. You can also reload your OMNY card online at omny.info ($5.80 minimum for online reloads).What is the maximum dollar value I can load onto my OMNY card?You can store up to $315 on your OMNY card. Note: There is a maximum value load of $136 per 72-hour period.What if I forgot my username for my OMNY account?If you registered for your OMNY account using an email address, then your email address is your username. If you forgot the email address that you entered during the account registration process, contact OMNY Customer Service by calling 877-789-6669. You may be asked to provide identifying information for account security purposes. Once this step is completed, you will be provided with the email address that was used during the account registration process.What if I forgot my password for my OMNY account?If you forgot your password, you can reset it online or by phone. To reset your password online, select the Sign In button at the top of each page, and you will be directed to the account sign-in page. Simply click on the “Forgot password?” link, follow the steps shown, and you will receive an email containing instructions for resetting your password. To reset your password by phone, contact OMNY Customer Service by calling 877-789-6669.What if I forgot my PIN for my OMNY account?If you forgot your PIN, you can reset it online or by phone. To reset your PIN online, simply log into your OMNY account, and select Account Settings. To reset your PIN by phone, contact OMNY Customer Service by calling 877-789-6669.What if I see a charge that I do not recognize?You may notice pre-authorization dollar amounts charged to your bank card. These amounts are used as temporary placeholders during payment processing. Your account will only be charged for the actual amount of the fare. If you are ultimately charged an amount that you do not recognize or did not authorize, please contact OMNY Customer Service by calling 877-789-6669 during the hours of 8 am to 8 pm Monday - Friday, and 8 am to 5 pm Saturday - Sunday.Why do I see a pending charge when I should receive a free trip or transfer?You may see a pending charge after tapping your phone or smart device on the OMNY reader, which is a temporary placeholder for the trip. The fare will not post to your account if the tap is for a free transfer or free ride. Note: Pending charges are bank card issuer-related matter and not an OMNY issue. For any questions concerning pending charges please contact your bank card issuer directly. How do I dispute a charge?If you did not authorize a charge, or you believe you have been charged incorrectly, please contact OMNY Customer Service at 877-789-6669 Monday through Friday 8am to 8pm or Saturday to Sunday 8am to 5pm. Important: You must dispute a charge within 90 days. We strongly recommend that you contact us first, as excessive disputes or claims filed through your bank or financial institution may result in your card or device being blocked from use with OMNY. While it is your right to file a dispute with your credit card issuer, you will often get a faster resolution by speaking with a member of our OMNY Customer Service team. How do I suspend or reactivate a payment method on my OMNY account?You can suspend or reactive a payment method at any time. This option is useful if you have misplaced your card or want to stop using your card temporarily. Simply log into your OMNY account, view the OMNY Wallet page, and see all cards associated with your OMNY account. After you follow the steps shown, you will receive an email confirming the suspension or reactivation of your card.What if my credit card, debit card, or mobile device is lost or stolen?Contact your bank first to cancel or pause your card in order to prevent unauthorized transactions. To block the payment method from OMNY usage specifically, you can suspend the card through your OMNY account, or, if you don’t have an OMNY account, contact OMNY customer service at 877-789-6669. You can always unsuspend your card from the OMNY system if you find it later.What if my OMNY card is lost or stolen?The best way to protect the balance on your OMNY card if it’s ever lost or stolen is to link it to a free and secure OMNY account (visit OMNY.info/register). Through an OMNY account, you can suspend the card anytime and transfer the balance to a replacement card. OMNY Customer Service can also perform these actions for you if you have an OMNY account. If you don’t have an OMNY account, we suggest you keep a record of your 18-digit card number, CVV number and expiration date (on the back of your card). This will allow OMNY Customer Service to help protect your balance in the future. How can I keep my OMNY account safe and secure?We are committed to keeping your personal information safe and secure. Please review the OMNY Privacy Policy to learn more about how we collect, use, disclose, retain, and protect your personal information. You can help, too! Here are some ways that you can help to protect your personal information while using OMNY: Change your password and PIN periodically. Avoid using the same password and PIN that you use for your other services. Avoid sharing your personal information with anyone else. Avoid saving your login credentials in web browsers on public computers. Browse other topicsGeneral informationHow OMNY worksFare capHelpful linksWant to check your trips and charges?Create an OMNY accountSign in to your OMNY accountWant to learn more about OMNY readers?View the OMNY readers pageWant to know when OMNY is coming to you?View the system rollout pageHave questions?Contact us"
year_published = 2025
