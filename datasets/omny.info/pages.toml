["https://www.omny.info/fares"]
title = "Weekly Fare Cap"
description = "Fare capping at MTA"
full_description = "Weekly fare capAn even better weekly fare discount Say hello to an easier, more equitable way to pay your fare: the 7-day fare cap with OMNY! Pay for 12 rides in a 7-day period and any additional rides are free. And, unlike with MetroCard, you don’t have to pay upfront. Just tap and pay as you go. Use the same device or card all 7 days and you’ll automatically ride free after your 12th paid fare. No need to pre-pay like when you buy a 7-Day Unlimited pass on MetroCard. Tap with your own mobile wallet enabled device or contactless bank card, or your OMNY card, and you pay only for the trips you take. No sign-ups needed - just tap. The more you ride, the sooner you’ll earn free trips. How it works Tap your card or device for full-fare and Reduced-Fare OMNY trips on New York City Transit subways and local, limited and Select Bus Service buses. Tap the same way every time to get fare capping benefits. If you tap a card, use that same card for every tap. If you tap a device, make sure you always use the the same device and the same card in your mobile wallet. Customers will automatically receive free, unlimited rides for the rest of the week once they have paid $34 in fares (or $17 for registered Reduced-Fare customers). The seven-day period begins whenever you make your first tap of the week. If you spend $34 within seven days, you ride free for the rest of the seven-day period. If you spend less, you only pay for the rides you take. The cap resets every seven days and restarts with your next tap. Express buses, group trips, and transfers do not count toward the cap. Earning a weekly pass: example Once you’ve paid $34 for fares in a 7-day period, you can ride free for the rest of the week. Here’s an example: A rider uses the subway to get to and from work, and takes it on weekends to go into Manhattan to meet friends. They also use the local buses in their neighborhood to run errands. They use their smartphone to pay the fare, so each ride is $2.90. After they have paid $34 in fares — the rest of the rides for the week will be free! Tracking your trips You can track your progress toward reaching free rides through a free and secure OMNY account, where you can also manage your travel cards, and more. Register for an OMNY account Frequently asked questions View all FAQs"
