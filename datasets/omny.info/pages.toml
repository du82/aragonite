["https://omny.info/become-a-retailer"]
title = "OMNY"
description = "OMNY website"
full_description = "Become an OMNY card retailerMTA riders are switching from MetroCard to the OMNY card. You should too. MetroCard is going away and OMNY is taking its place as the way to pay subway and bus fares. Start selling OMNY cards to enjoy benefits like: No upfront payments, unlike with MetroCard Commission on each sale Commission on each reload, even if the card was bought somewhere else Your business listed on the OMNY retail locator, which is advertised in subways and buses Official in-store advertising materials provided upon request Potential to increase foot traffic and sales Your customers get a better deal with OMNY than with a 7-Day MetroCard. With the OMNY fare cap, customers will never pay more than $34 in a 7-day period. OMNY card users get to keep any funds they don’t use, unlike 7-Day MetroCard users. Serve your customers and support your New York community with the OMNY card today. How to apply There is no cost for your store to participate. All you need is an internet connection and a barcode scanner, which can be provided if you don’t have one. Please email your contact details to TollandTransit@lnComm.com, including the best time to reach you. You will receive a response with further instructions. OMNY card sale commissions It’s simple: You get $0.50 for every OMNY card sold and 1.25% of your customers’ reload value on their existing cards. Any OMNY card holder can visit a retailer to add value to their cards. This includes reduced-fare seniors and people who bought their cards at MTA vending machines. About your commission Commissions are automatically deducted during the purchase process. New OMNY retail merchant applicants must meet the following criteria to be eligible for commissions on orders: Applicant must operate a visible retail store accessible to the public. The retail store must have clearly posted operating hours. It is recommended that merchants prominently display OMNY signage and materials on the premises. Merchants must sell OMNY cards to the public during posted hours. The physical address must be on file with OMNY for listing on this website, making it easier for customers to locate their retail store. Merchants should be located in the New York Metropolitan Area, unless otherwise approved by OMNY. Inventory Please maintain adequate card inventory on display in your store. To order additional inventory, contact your product provider, account manager, or email lnComm at omnyretailer@incomm.com."
