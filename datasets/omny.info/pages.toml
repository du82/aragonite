["https://www.omny.info/how-omny-works"]
title = "How OMNY Works"
description = "How OMNY works"
full_description = '''How OMNY worksWhat is OMNY? OMNY is the contactless fare payment system for public transportation in the New York region. Simply use your contactless credit or debit card, smart phone, wearable device, or an OMNY card to tap and go. OMNY is accepted across subways, buses, paratransit, and other regional services. And yes, the MetroCard will eventually be phased out. So, let's get you tapping! How to use OMNY Use a smart phone (with mobile wallet enabled), a wearable, or a contactless credit or debit card, or an OMNY card to pay your fare at subway turnstiles, AutoGates, and onboard buses (including Select Bus Service). Simply tap one of them on the OMNY reader. Benefits of OMNY include: Free transfers – Use the same card or device for both legs of your trip to get a free transfer. Free trips – Pay for 12 rides using the same card or device in a 7-day period, and all additional rides within the week are free. Learn more here. The screen will say "GO" and turn green if the tap was successful. Need help setting up a mobile wallet so you can tap with a phone or smart device? Learn how now. OMNY for Reduced-Fare Attention MTA Reduced-Fare customers: your half-fare benefit is moving to OMNY! Look for your new Reduced-Fare OMNY card in the mail soon and check this page for updates. Continue to use your Reduced-Fare MetroCard in the meantime. If you already made the switch to OMNY, you can continue to tap and go without interruption using your same card or device. Where can I use OMNY? OMNY is accepted on MTA buses, subways, Staten Island Railway, Roosevelt Island Tram, Hudson Rail Link, and AirTrain-Howard Beach and AirTrain-Jamaica stations with more services to follow. OMNY cards are available at many retail locations throughout the region and at OMNY vending machines in subway stations. Find one here. First ever tap with a credit or debit card? You can't pass it back (yet) If this is your first time tapping a particular bank card on any OMNY reader, you can't use it to pay for other riders on the same trip yet. This is because your bank must approve the transaction before any other fares are paid. Instead, use a separate payment method for everyone on your first trip. Approval generally takes only a few minutes, so you should be able to tap for up to four people on your next trip. However, using separate cards or phones allows everyone in your group to earn free rides. When each person pays for 12 rides using their same card or phone within seven days, any additional rides within the seven days are free, automatically. No sign-ups or apps needed, just tap. Learn more here.'''
year_published = 2025
clearnet = "https://www.omny.info/how-omny-works"
