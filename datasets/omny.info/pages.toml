["https://omny.info/accessibility"]
title = "Accessibility"
description = "Accessibility"
full_description = "AccessibilityWe are committed to providing quality service to all customers. We have incorporated various features at subway stations, on buses, on the website, and with our customer service operation to make OMNY accessible to all customers. OMNY readers OMNY readers installed at station turnstiles, AutoGates, and onboard buses allow customers to tap their own contactless cards or smart devices, or OMNY cards, to make fare payments. OMNY readers can also be used to exit the subway through the AutoGates. Customers are not charged a fare to exit through the AutoGate. We have designed OMNY readers with the following features to make sure that customers of all abilities will know if their contactless cards and smart devices have been accepted or declined: Screen prompts with large text and images Screen colors that create clear visual contrast Audible tones LED lights OMNY website The OMNY website was designed for easy navigation across different browsers, computers, and mobile devices, and supports both desktop and mobile experiences. We have minimized animation and flash graphics to enhance readability. OMNY customer service OMNY customer service is equipped with interactive voice response and automated call distributor capabilities. Customers can enter responses via phone key entry or by voice to obtain information without the need to speak directly with an OMNY customer service representative. Additional information Click here for more information about accessibility related to other services provided by the MTA. More information about accessibility related to OMNY will be available as the new system is rolled out and features are enhanced or added."
year_published = 2025
