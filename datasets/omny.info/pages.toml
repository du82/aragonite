["https://www.omny.info/omny-card"]
title = "OMNY Card"
description = "OMNY website"
full_description = "OMNY CardThe OMNY card: Pay with cash (or card), tap and go Buy or reload an OMNY card at OMNY vending machines or at select stores across the city. OMNY vending machines are rolling out to all subway stations, with many already available. Use a machine to buy and reload your card with ease on your way to the turnstiles. You can also check your current balance before you tap. Has a new machine arrived at your station? Check the map below. You can also buy and reload an OMNY card at participating Walgreens, CVS, 7-Eleven, CFSC Check Cashing, and Payomatic stores, as well as many bodegas and independent pharmacies. Visit our retail locator and enter your location to find a store near you. Want more OMNY card convenience? You can also reload your OMNY card online by linking it to a free and secure OMNY account. You can even set up automatic reloads so your balance never drops below an amount that you set. That means you will never have to worry about a low balance or stand in line at a vending machine again. Plus, if you ever lose your OMNY card, you can sign in to your account to protect your balance. Register for an OMNY account and link your OMNY card today."
