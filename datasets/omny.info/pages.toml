title = "General Information"
description = "OMNY website"
full_description = "Frequently Asked QuestionsGeneral InformationWhat does “OMNY” mean?OMNY, which stands for One Metro New York, is based on the concept of unifying fare payments and ticketing across multiple modes of transportation. We believe that transportation is an essential service that connects communities and brings the diversity and energy of New York together. OMNY is the newest way to experience all that our region offers.When will MetroCard be phased out?MetroCard will continue to be available until all comparable services are offered with OMNY. What is OMNY?OMNY is the MTA’s new fare payment system. OMNY will be phased in over time and will unify fare payments and mobile ticketing across subway, bus, and commuter rail, resulting in a seamless experience for customers. Learn more about OMNY.Will OMNY cost more than MetroCard?The fares are the same for MetroCard and OMNY.Can I still ride with the MTA if I do not have a contactless card or a smart device?Yes. You can use an OMNY card – a contactless transit card – to tap and go throughout the system. Learn more about OMNY cards. You can also use MetroCard until the OMNY rollout is complete.Can I use cash with OMNY?If you prefer to pay in cash, you can use either a reloadable prepaid card or an OMNY card. If you use a reloadable prepaid card, you can prepay your card with cash at locations where reloadable prepaid cards are sold. You can also use cash to buy a new OMNY card or reload an existing OMNY card at more than 2,000 retail locations across the New York metropolitan area. OMNY card availability may vary by retailer. Find a retail location near you. You can still use cash with MetroCard while the OMNY rollout continues. Cash will continue to be a payment option for Access-A-Ride when paratransit services are supported in OMNY.Is there an OMNY card?Yes. You can buy a new OMNY card or reload an existing OMNY card at more than 2,000 retail locations across the New York metropolitan area. You can also reload an OMNY card online through an OMNY account as well as through the OMNY call center. The OMNY card costs $5 to purchase and must be loaded with a minimum of $1 at the time of purchase.Can I use OMNY to purchase commuter rail tickets?Not yet. OMNY will expand to commuter rail during the next phases of the rollout.Can I see my trips and charges on the OMNY website?This feature has been removed while we evaluate new tools to serve our customers. Please contact OMNY Customer Service by calling 877-789-6669 during the hours of 8 am to 8 pm Monday - Friday, and 8 am to 5 pm Saturday - Sunday or email us at customersupport@omny.info.What can I do at an OMNY vending machine?You can purchase a new OMNY card (for a $1 new card fee), load your OMNY card, check the balance on your OMNY card and purchase a Single Ride ticket ($3.25). All purchases made at an OMNY vending machine are final. Prefer to skip the vending machine? You don’t need an OMNY card to ride. Use your own contactless credit, debit, or mobile wallet to pay the fare without a fee. Simply tap the OMNY reader and go.Can I check my OMNY card balance on the OMNY vending machine?Yes. Simply tap your OMNY card on the OMNY card reader and your balance will be displayed.Can I translate the OMNY website into a language other than English?To translate the OMNY website into a different language, go to the bottom of the page and select your preferred language using the Google Translate feature.What languages can OMNY Customer Service representatives support?OMNY customer service representatives can support many languages when you call. OMNY Customer Service representatives can also utilize a third-party interpreter service when a particular language skill is not available at the time of your call. The third-party interpreter service can support over 300 languages.Can I use OMNY to pay for the Roosevelt Island Tram?Yes! Simply tap your own contactless credit or debit card, smart device, or OMNY card on the OMNY reader to pay the fare. These are the same OMNY readers as those on MTA subways and buses and work the same way.What is the fare for the Roosevelt Island Tram?The fare for the Roosevelt Island Tram is $2.90 for full fare customers and $1.45 for reduced fare customers – the same as the fares for subway and for local, limited, and Select Bus Service buses.How much do I pay when I tap on the Hudson Rail Link?When you use the OMNY reader on the Hudson Rail Link, you’ll be charged the same fares as on MTA local buses: $2.90 for full fare riders and $1.45 for reduced fare riders. Free transfers to or from subways or local buses are included within two hours of paying your fare. Plus, with the OMNY fare cap, you’ll never pay more than $34 in a seven-day period.Can I use OMNY to pay for AirTrain JFK?Yes! Simply tap your contactless credit or debit card, smart device, or OMNY card on the OMNY reader to pay the fare at the AirTrain-Howard Beach and AirTrain-Jamaica stations. No more waiting in line at the vending machines. Select gates at each station are dedicated to OMNY while MetroCard remains available. You will be charged the full AirTrain fare of $8.50 for each tap. Note: You can pay for up to four riders at AirTrain OMNY readers. Note: If you are connecting between Airtrain JFK and the MTA subway or bus, you’ll need to tap separately for each service (there is no dual fare entry at Howard Beach at this time).Can I purchase an OMNY card at the AirTrain JFK Howard Beach and Jamaica stations?OMNY cards are not available for purchase at either station at this time. However,you can purchase an OMNY card at participating retail locations around the city.Can I use my CUNY ASAP | ACE OMNY card for public transportation?Yes. If you’re a part of the CUNY ASAP|ACE program, and you’re registered for classes, you qualify for an OMNY card. The CUNY ASAP|ACE OMNY card allows you to ride subways, local buses, Staten Island Railway (SIR), and the Roosevelt Island Tram for free during school sessions. Can I use my CUNY ASAP | ACE issued OMNY card during intersessions?While your OMNY card will not provide free, unlimited rides between semesters, you can add personal funds to your ASAP | ACE-issued OMNY card to use it to pay the fare and ride public transit during intersessions. Be sure to add enough funds to cover the cost of the full fare.Can I use my CUNY ASAP | ACE issued OMNY card for transit modes not covered by my semester pass?Yes, you can add personal funds to your CUNY ASAP | ACE-issued OMNY card to use it to pay for transit modes not covered by your semester pass, such as Express Bus, NICE Bus, Westchester Bee-Line and AirTrain JFK. You will need to add your own funds to use these transit modes whether you ride during the semester or during intersessions. Make sure you have enough funds to cover any full fare trips you may take. Will my information be kept private?We are committed to keeping your personal information safe and secure. Please review the OMNY Privacy Policy to learn more about how we collect, use, disclose, retain, and protect your personal information.Browse other topicsHow OMNY worksAccount managementFare capHelpful linksWant to check your trips and charges?Create an OMNY accountSign in to your OMNY accountWant to learn more about OMNY readers?View the OMNY readers pageWant to know when OMNY is coming to you?View the system rollout pageHave questions?Contact us"
