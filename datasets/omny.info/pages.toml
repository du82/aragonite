25rem; --size-36: 2.25rem; --size-40: 2.5rem; --size-48: 3rem; --size-64: 4rem; --size-80: 5rem; --size-96: 6rem; --size-112: 7rem; --size-128: 8rem; --size-160: 10rem; --size-184: 11.5rem; /* used for logo */ --size-200: 12.5rem; --size-224: 14rem; --size-296: 18.5rem; /* login flow btns */ --size-304: 19rem; /* payment cards */ --size-320: 20rem; --width-half: 50%; --width-third: 33.33333%; --width-two-thirds: 66.66667%; --width-quarter: 25%; --width-three-quarters: 75%; --width-fifth: 20%; --width-two-fifths: 40%; --width-three-fifths: 60%; --width-four-fifths: 80%; --width-sixth: 16.66667%; --width-five-sixths: 83.33333%; --width-full: 100%; --login-container-size: 50rem; /*used for page takeovers*/ --page-container-size: 64rem; /* 1024px */ /* typography.module.css */ --text-xs: .75rem; /* 12px */ --text-sm: .875rem; /* 14px */ --text-base: 1rem; /* 16px */ --text-lg: 1.125rem; /* 18px */ --text-xl: 1.25rem; /* 20px */ --text-2xl: 1.5rem; /* 24px */ --text-3xl: 1.875rem; /* 30px */ --text-4xl: 2.25rem; /* 36px */ --text-5xl: 3rem; /* 48px */ --text-6xl: 3.375rem; /* 54px */ --font-hairline: 100; --font-thin: 200; --font-light: 300; --font-normal: 400; --font-medium: 500; --font-semibold: 600; --font-bold: 700; --font-extrabold: 800; --font-black: 900; --leading-loose: 1.5; --leading-tight: 1.2; } body { font-family: Helvetica, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; color: #4a4a4a; } .ContainerDiv { padding: 1rem; background-color: white; line-height: 1.5; max-width: 1024px; margin: auto; } @media (min-width: 48em) { .ContainerDiv { padding: 2rem; } } @media (min-width: 62em) { .ContainerDiv { padding: var(--size-48); } } .ContainerDiv h1 { margin: 0px; padding-bottom: 3rem; } .ContainerDiv h2, .ContainerDiv h3 { font-weight: var(--font-bold); line-height: var(--size-24); margin-bottom: var(--size-20); } .ContainerDiv h2 { margin-top: 3rem; margin-bottom: 0; max-width: 50rem; font-size: 1.5rem; } .ContainerDiv :global(.first) { margin-top: 1rem; } .ContainerDiv h3 { font-size: var(--size-16); padding-top: 20px; font-size: 1.25rem; } .ContainerDiv p span { display: inline-block; height: var(--size-16); } .ContainerDiv p svg { width: var(--size-16); } .ContainerDiv a { font-weight: bold; color: var(--color-mobile-nav-blue); cursor: pointer; } .ContainerDiv ul { padding: 0 var(--size-20) var(--size-20) var(--size-20); margin-top: 0; } .ContainerDiv li { padding-top: var(--size-16); } .ContainerDiv :global(.partner-logos) { display: flex; flex-wrap: wrap; } .ContainerDiv :global(.partner-logos) img { padding: 2rem 3rem 0 0; } .ContainerDiv :global(.pb-0) { padding-bottom: 0; margin-bottom: 0; } /* see git history for numbering like 2. 2.1. 2.2. 3. */ These OMNY Terms of Service ("OMNY Terms of Service") apply to the OMNY services and technology (collectively, the "OMNY Services") provided to you by the Metropolitan Transportation Authority and our affiliates and subsidiaries (collectively, the "MTA", "we", "us", or "our"). The term "OMNY Services" includes, by way of example, the following: (i) the OMNY website (the "Website"); (ii) the OMNY mobile application (the "OMNY App"); (iii) the OMNY fare payment services, including OMNY fare payment readers and other related technology (the "OMNY Fare Payment System"); and (iv) the OMNY customer support services ("OMNY Customer Service"). To assist you in using the OMNY Services and to ensure a clear understanding of the relationship arising from your use of the OMNY Services, we have created these OMNY Terms of Service and the OMNY Privacy Policy. These OMNY Terms of Service apply to anyone that accesses or uses the OMNY Services (collectively, "you" and "your"). PLEASE READ THESE OMNY TERMS OF SERVICE CAREFULLY BEFORE YOU ACCESS OR USE THE OMNY SERVICES. BY ACCESSING OR USING THE OMNY SERVICES, YOU AGREE TO BE BOUND BY THESE OMNY TERMS OF SERVICE. IF YOU DO NOT WISH TO BE LEGALLY BOUND BY THESE OMNY TERMS OF SERVICE, THEN PLEASE DO NOT ACCESS OR USE THE OMNY SERVICES. Your Agreement to these OMNY Terms of Service. These OMNY Terms of Service set forth the terms and conditions under which you agree to use our OMNY Services. For the avoidance of doubt, these OMNY Terms of Service apply to all users of the OMNY Services, including those who create an OMNY account (each, an "OMNY Account"), visitors to the Website, OMNY App users, and customers who use the OMNY Fare Payment System. By accessing or otherwise using our OMNY Services, you acknowledge that you have read these OMNY Terms of Service and agree to be legally bound by them. We may also confirm your agreement to be bound by these OMNY Terms of Service by asking you to click an "I accept" or similar button when you use certain portions of our OMNY Services. If you are agreeing to these OMNY Terms of Service on behalf of a company or other legal entity ("Your Organization"), then (i) you represent and warrant that you have authority to act on behalf of, and to bind Your Organization, and (ii) for the purposes of these OMNY Terms of Service, the term "you" means Your Organization on whose behalf you are acting. For example, by accessing the OMNY Services (a) on any computer, mobile phone, tablet, console, or other device, (b) via a social media platform or search engine, or (c) through use of a digital wallet on a smart device such as a mobile phone or wearable or contactless credit, debit or prepaid card, you conﬁrm that you have read, understood, and agreed to be legally bound by these OMNY Terms of Service, whether or not you registered for an OMNY Account. Your OMNY Account. Creation of an OMNY Account. Our OMNY Services include the ability to create and use an OMNY Account. Customers are not required to create an OMNY Account in order to use the OMNY Fare Payment System, though certain OMNY Services are only available to those with an OMNY Account. There are certain beneﬁts to creating an OMNY Account, including access to older transaction histories. You must be 18 years of age or older in order to create an OMNY Account, and by creating an OMNY Account, you represent and warrant to the MTA that you are at least 18 years old at the time of registration. As further set out in the OMNY Privacy Policy, you must provide us with certain information, including Personal Information, in order to create an OMNY Account. OMNY Account Password. OMNY Accounts are only available to users who have completed the account registration process and create an OMNY Account password. If you created an OMNY Account, then please understand that we will treat anyone who uses your password as "you". We will provide this user with all of the rights and privileges that we provide to you, and we will hold you responsible for user activities associated with your OMNY Account and password. We therefore recommend that you maintain your OMNY Account and password in confidence, and that you do not share your OMNY Account and password with anyone who might pretend to be you with respect to your use of the OMNY Services (including your OMNY Account). Please notify OMNY Customer Service immediately if you suspect that someone is using your OMNY Account and password in an inappropriate manner. Overview of the OMNY Fare Payment System. The Transit Fares. Current fares collected using the OMNY Fare Payment System are set out in the MTA's fare policies and applicable law. Our fares are subject to change in accordance with MTA's fare policies and applicable law. For information regarding current fares and fare policies related to the OMNY Services, visit www.mta.info. OMNY Payment Methods. Customers may pay their subway and bus fare via the OMNY Fare Payment System by using any of the compatible "OMNY Payment Methods": (i) contactless credit, debit, or prepaid card; (ii) digital wallet on a smart device, such as a smart phone or a wearable (for example, Apple Pay, Google Pay, Samsung Pay, and Fitbit Pay); and (iii) the MTA-issued OMNY contactless fare payment card (an "OMNY card"). The MTA may enable additional OMNY Payment Methods in the future. How to Use OMNY. You may use an OMNY Payment Method with the OMNY Fare Payment System by "tapping" or holding your OMNY Payment Method up to an OMNY Fare Payment System reader. Except for permitted transfers, you will be charged the applicable fare to the account linked to your OMNY Payment Method each time you tap. To ensure proper functioning, you should remove your contactless credit, debit or prepaid card from your wallet or other card holder before you tap. You should only tap using the OMNY Payment Method you wish to use to pay a fare via an OMNY Fare Payment System reader. The MTA is not responsible for your failure to properly adhere to the instructions set out in these OMNY Terms of Service or other instructions available via the OMNY Services. Only One OMNY Payment Method Allowed at a Time. You may only use one OMNY Payment Method to pay a fare via an OMNY Fare Payment System reader – you cannot split a fare among different OMNY Payment Methods or between an OMNY Payment Method and the MetroCard®. If an OMNY Payment Method is declined, you may try another OMNY Payment Method or, in the alternative, use a MetroCard.® When the MTA may Block Your Access to OMNY. We may temporarily or permanently block your access to the OMNY Services, in certain circumstances, including: Temporary Block. We may temporarily block your use of a specific OMNY Payment Method to access the OMNY Services if: (i) such OMNY Payment Method is reported to the MTA as lost, stolen, or damaged; (ii) there are insufficient funds associated with the OMNY Payment Method, and additional funds have not yet been cleared; (iii) there is suspicion of fraudulent or other illegal activity in connection with the use of such OMNY Payment Method; or (iv) such OMNY Payment Method is declined by the ﬁnancial institution when the MTA submits the charge to such financial institution. Permanent Block. We may permanently block your use of a specific OMNY Payment Method to access the OMNY Services if: (i) there is verified fraudulent or other illegal activity in connection with the use of such OMNY Payment Method; or (ii) such OMNY Payment Method is reported stolen to the MTA. How to Remove a Temporary Block to Your OMNY Payment Method. A temporary block can be removed by calling OMNY Customer Service using one of the methods set out in Section 16 (How to contact OMNY Customer Service) after you have resolved any issues with your OMNY Payment Method. Intellectual Property. As between you and us, all information, software, artwork, text, video, audio, pictures, logos, and other content available on or through the OMNY Services (except for User Content), including all associated intellectual property rights (collectively, the "OMNY Services Content"), is the property of the MTA or its licensors, is protected by copyright and other intellectual property laws, or is included based on principles of "fair use". The MTA and its licensors retain all rights with respect to OMNY Services Content except those expressly granted to you in Section 5 (Limited Grant of Rights to You) below. The MTA name and logo, the OMNY name and logo, "OMNY.info", and other trademarks, service marks, and logos that we use, and any proprietary product or service names contained in the OMNY Website and/or OMNY App, are protected by copyright or are trademarks of the MTA and may not be copied, imitated or used, in whole or in part, without the MTA's prior written permission. Third party trademarks that appear in connection with the OMNY Services are the property of their respective owners. You agree not to duplicate, publish, display, distribute, modify, or create derivative works from the OMNY Services Content, or other material displayed in connection with the OMNY Services, without the express written permission of the MTA. Limited Grant of Rights to You. Provided you comply with these OMNY Terms of Service, we grant you the limited right to access the OMNY Services in order to: (i) learn more about the OMNY Services and the MTA; (ii) create an OMNY Account; (iii) register for email or text notiﬁcations and alerts and other materials the MTA may make available from time to time; (iv) submit inquiries and User Content to us; (v) participate in and receive those OMNY Services that we make available to you; (vi) access other information that we make available through our OMNY Services; (vii) download and use the OMNY App in compliance with its available features and functionality; and (viii) download and print pages from our Website, provided that (a) you, and anyone with whom you share the print outs, use the print outs for your personal use, and (b) you do not alter any copyright, trademark, or other proprietary notices as they appear on the print outs (collectively, the "Permitted Uses"). Apart from the Permitted Uses, you shall not use, copy, modify, distribute, sell, duplicate, create derivative'''
