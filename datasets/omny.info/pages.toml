t) { margin-top: 1rem; } .ContainerDiv h3 { font-size: var(--size-16); padding-top: 20px; font-size: 1.25rem; } .ContainerDiv p { margin-bottom: 0; } .ContainerDiv p span { display: inline-block; height: var(--size-16); } .ContainerDiv p svg { width: var(--size-16); } .ContainerDiv a { font-weight: bold; color: var(--color-mobile-nav-blue); cursor: pointer; } .ContainerDiv ul { padding: 0 var(--size-20) 0 var(--size-20); margin-top: 0; } .ContainerDiv li { padding-top: var(--size-8); } .ContainerDiv :global(.partner-logos) { display: flex; flex-wrap: wrap; } .ContainerDiv :global(.partner-logos) img { padding: 2rem 3rem 0 0; } .ContainerDiv :global(.pb-0) { padding-bottom: 0; margin-bottom: 0; } .ContainerDiv .indent { margin-left: 1em; } .ContainerDiv ol { counter-reset: section; list-style-type: none; } .ContainerDiv ol li { text-indent: -2em; padding-left: 2em; } .ContainerDiv ol li .no-hang { text-indent: 0; padding-left: 0; } .ContainerDiv ol > li::before { counter-increment: section; content: counters(section, ".") ". "; } The Metropolitan Transportation Authority and our affiliates and subsidiaries (collectively, the "MTA", "we", "us" or "our") respects your privacy. This privacy policy and agreement (the "OMNY Privacy Policy") describes the MTA's privacy practices regarding our collection, use, and treatment of information that you may provide when you use the OMNY services and technology (collectively, the "OMNY Services"), which includes: (i) the OMNY website (the "Website"); (ii) the OMNY mobile application (the "OMNY App"); (iii) the OMNY fare payment services, including the OMNY fare payment readers (the "OMNY Fare Payment System"); and (iv) the OMNY customer support services ("OMNY Customer Service"). This OMNY Privacy Policy applies to anyone using our OMNY Services ("you" and "your"), including casual visitors to our Website who do not create an OMNY Account, users who create an OMNY Account, guest users of the OMNY App, and anyone else accessing our OMNY Services. Your Consent. Please read this OMNY Privacy Policy carefully. By accessing or otherwise using our OMNY Services, you acknowledge and agree that you have read this OMNY Privacy Policy and agree to be legally bound by it. We may also confirm your agreement to be bound by this OMNY Privacy Policy by asking you to click an "I accept" or similar button when you access or use certain OMNY Services. If you do not agree with the terms of this OMNY Privacy Policy then do not access or use our OMNY Services. Types of Information We Collect. We collect a few categories of information via our OMNY Services: Personal Information. We use the term "Personal Information" to mean any information that identifies you as an individual, and any other information that we associate with it. Personal Information you may provide to us through your access or use of the OMNY Services includes: Your name, age, photograph, email address, date of birth, and password; Your other contact information, including mailing address (including postal code and country of residence), and phone number; Payment information and identity verification information, such as credit card or other payment card information, and the last four digits of your Social Security number; Any disabilities that may qualify you for a special program; Any special program account number and/or card ID issued to you by the MTA, and other information relating to your participation in a special program; Other identifying information that you elect to provide to the MTA through the OMNY digital assistant on the Website; and Geolocation information. Online Activity Information. We also collect technical and device-related information through certain OMNY Services, and third party analytics tools that we use (collectively, the "Online Activity Information"). Examples of Online Activity Information includes: Device identifiers, such as cookies; Device information, such as hardware and software settings; IP addresses and log information, such as your device's name, the type and version of your web browser, and referrer addresses that can function to identify a user device; Tracking information that we, or a third party, may collect. If any of your Online Activity Information is associated with Personal Information, then we will treat such associated Online Activity Information as Personal Information. Otherwise, we treat Online Activity Information as Anonymous Information. Anonymous Information. In addition to Personal Information, we may also collect (i) information that does not identify you or your devices, and (ii) de-identified Personal Information that no longer identifies you (collectively, "Anonymous Information"). Information that meets either of these criteria might include, for example, demographic information and statistical information (e.g., page views and hit counts). We use Anonymous Information for our operations and, since Anonymous Information does not include Personal Information, we do not treat it as such. How We Collect this Information. We collect the above information through the following means and technologies: Registration; Linked Accounts. When you register in order to create an account with us (an "OMNY Account"), you must provide us with certain Personal Information in order to create an OMNY Account. We will use this information to set up your OMNY Account, authenticate your sign-on information, and to manage other functionalities relating to your account. As further explained below, you may also link an OMNY contactless fare payment card, a credit card or other payment card (each, an "OMNY Payment Method") with your OMNY Account. Participation in Special Programs. When you apply to participate in certain programs available through the MTA, we will collect certain Personal Information in order to determine your eligibility. For example, if you would like to participate in the MTA's Reduced Fare Program, then we will collect Personal Information about you, including your name, age, address, contact information, and any qualifying disabilities that may qualify you for participation in the Reduced Fare Program. Payment Information. We collect your credit card, other payment card information, or banking information when you purchase a fare product through our OMNY Services, register an OMNY Payment Method in your OMNY Account, or otherwise use an OMNY Payment Method to access our OMNY Services (for example, by tapping a credit card or phone at a reader). Such information may include the credit or debit card primary account number and expiration date, and bank account number and routing number. Additionally, we may collect the card brand (e.g., Visa, MasterCard), and/or the card type (e.g., credit, debit, pre-paid, contactless, transit benefit, etc.). For any transaction, the method by which the OMNY Services authenticate your OMNY Payment Method varies, but may include, for example, your PIN, billing ZIP code, or full billing address. Note that your financial institution may provide us with updated financial information in order to complete contemplated transactions. Questionnaires and Surveys. We may invite you and/or allow you to participate in surveys and questionnaires, which we may post or otherwise provide to you from time to time. You are free to choose whether you participate in a survey or questionnaire. We may ask that, in addition to providing your responses, you also provide Personal Information. In these instances, we may use any information that you provide to us for the purposes for which you submit the information. We may also add your Personal Information to your customer profile. Survey and questionnaire information may be used for the purposes of monitoring, improving the OMNY Services, or publicly posting your responses to surveys or questionnaires. User Content. As further set out below, we may give you the ability through the OMNY Services to engage with us and others in public exchanges or to publicly display information via the OMNY Services, such as comments and feedback about the OMNY Services (collectively, "User Content"). The OMNY Terms of Service provides additional details about your rights and obligations related to User Content. We are not responsible for Personal Information you decide to include in User Content. If you include any Personal Information relating to others in your User Content, then you represent that you have full permission and authority to do so. User Content Provided to Us for Internal Use. We may provide you with the ability to submit User Content to us (either directly or through a third party service) for our internal operations. For example, we may ask you to provide us with additional feedback when you submit responses to our surveys. If you provide us with such User Content, then we will protect it in accordance with this OMNY Privacy Policy, and we will inform you when asking for information that it is only for our internal purposes. User Content Provided to Us for Public Consumption. We may give you the ability, for example, through the Website, OMNY App, or a third party social media platform, to engage with us and others in public exchanges by providing User Content, which may include opportunities for you to provide comments, reviews, recommendations, and other input. Please understand that, if you include Personal Information in such User Content, then others will be able to read, collect, republish, and otherwise freely use the information. We are not responsible for Personal Information that you decide to include in such User Content, and we will not take down, remove, or edit User Content, except as required by applicable law. Correspondence. We may collect information about you that you provide when you request information from us or otherwise correspond with us including, for example, when using the Contact Us feature on our Website. Device Configuration. We may collect certain information in order to determine whether your computer/device is supported by our systems. This information may include your operating system and browser, the presence of any software that our Website or OMNY App may require to operate with your computer/device, or other third party software on your computer/device. IP Addresses; Logs. We may automatically receive and record information in our server logs from your browser, including your IP address (the Internet address of your computer), your computer's name, the type and version of your web browser, referrer addresses, and other generally accepted log information. We may also record page views (hit counts) and other general statistical and tracking information, which will be aggregated with that of other users in order to understand how our Website is being used, and for security and monitoring purposes. Location Information. Certain OMNY Services, such as the Website and OMNY App, may request your current location, which, if selected, could determine your geographic location. We w'''
