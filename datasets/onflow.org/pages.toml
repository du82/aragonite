description = "Ethereum (ETH) remains one of the most widely used cryptocurrencies, but high transaction fees and network congestion often push users to explore alternative chains. Flow blockchain, a high-performance Layer-1 blockchain, provides a developer-friendly and cost-effective ecosystem for users and decentralized applications (dApps). Bridging ETH to Flow blockchain enables users to leverage Flow's low gas fees, fast transactions, and seamless smart contract execution."
full_description = "Blog | DevelopersAllEcosystemDeveloperEducationEngineeringFEATUREDDevelopers・November 26, 2024Vitalik Buterin and Dieter Shirley Discuss Crypto's Next Killer AppThe cofounders of Ethereum and Flow discuss how decentralized apps find mainstream success during the Flow World Tour in ThailandDevelopers・December 12, 2024Build Superior EVM Apps with CadenceSuperior Web3 apps start with reimagining UX. Flow’s EVM compatibility + Cadence enable seamless atomic transactions, reducing friction & unlocking new possibilities. Developers・December 1, 2024The Flow World Tour is in Asia and OnlineFrom December 1st to 31st, developers across Asia compete online to build the next killer app on Flow. Developers・November 26, 2024Vitalik Buterin and Dieter Shirley Discuss Crypto's Next Killer AppThe cofounders of Ethereum and Flow discuss how decentralized apps find mainstream success during the Flow World Tour in ThailandDevelopers・November 21, 2024Flow Makes Record-Breaking Appearance at ETHGlobal BangkokWith 99 apps built on Flow and over 2000 builders, nearly one-third of ETHGlobal winners were Flow projects.Developers・November 8, 2024Create Next-Gen Games in Bangkok During The Flow World TourFlow is home to games that scale to millions, like NBA Top Shot, with great UX and and features like true randomness empowering devs to create the next killer app.Developers・October 31, 2024Join Flow and Ethereum Cofounders in Chiang Mai for the Flow World TourJoin the cofounders of Flow, Ethereum, and MetaMask in Chiang Mai for the next stop on the Flow World Tour.Developers・October 23, 2024Flow Was the Most Built On L1 Network at ETHGlobal San FranciscoAt ETHGlobal San Francisco, Flow was the most built on L1 network, and one of the most popular choices for developersDevelopers・October 17, 2024Crescendo Update Downtime Deep DiveAn analysis of the Crescendo upgrade on Flow, the downtime it caused, and how it was resolved.Developers・September 24, 2024Transforming Smartphones into Hardware Wallets with Secure Enclave on FlowFlow empowers developers to use Secure Enclave technology to create transform phones into wallets with an enhanced user experienced and security. Developers・September 19, 2024Cadence Empowers Flow Community RewardsHow Cadence enabled Flow Community Rewards, a system for incentivizing participation and enhancing engagement within the Flow ecosystem.Developers・May 16, 2024Introducing a new smart contract migration toolGet Ready for Crescendo with this community built Smart Contract Migration Tool - CadenceUpgrader by BluesignDevelopers・May 13, 2024Cadence Migration: A Detailed Guide for Developers on FlowAs we prepare for the most significant network evolution on the Flow blockchain, understanding every phase of the migration process is crucial. We're opening the gates to... Developers・November 8, 2023On-chain Randomness On FlowFlow has just released a breakthrough on-chain random number generator that goes live today! Developers・October 31, 2023How we could have prevented this Solidity Vulnerability: The DAOWelcome to my series of blogs about common and high-profile vulnerabilities in Solidity smart contracts. In this series, I’ll explain how different vulnerabilities have been exploited in Solidity smart contracts and how choosing languages like Solidity actually sets developers up for difficulty from the beginning. Developers・September 12, 2023September 2023 Cadence CompetitionStarting this month we're hosting monthly Cadence coding competitions to help developers learn blockchain engineering using the Cadence smart contract language. Each month will focus on a new topic in Cadence and is supported by workshops and weekly drop-in sessions to help accelerate your learning! Check it out! Developers・August 24, 2023Celebrating the winners of the Flow to the Future hackathonThe Flow Foundation is delighted to reveal the winners of the Flow to the Future hackathon, a global competition where ambitious Web3 builders competed for more than $500,000 in prizes by building decentralized applications that push the boundaries of current blockchain capabilities using Cadence. Developers・June 15, 2023Unity SDK 2.0: Supercharge game development with Wallet Connect, iOS, and moreDevelopers・June 13, 2023The Flow fundamentals behind trusting where you buildIn this post, we’ll reaffirm some of Flow’s core attributes that help to keep the network distributed, accessible, secure, and compliant so developers can remain focused on their projects.Developers・June 8, 2023Guest Post: Implementing the Bored Ape Yacht Club smart contract in CadenceIn this post, Jacob Tucker walks you through how he implemented the BoredApeYachtClub NFT smart contract in Cadence, the smart contract language used by the Flow blockchain and popular platforms like NBA Top Shot and Ticketmaster.Developers・June 2, 2023Flow to the Future: Revving up for our next global hackathonThe Flow to the Future hackathon is a global competition for Web3 builders to compete for more than $500,000 in prizes by pushing the boundaries of decentralized applications that leverage sophisticated on-chain logic. It kicks off on June 15 and will last for an entire month, concluding on July 15. All pioneers of the Web3 world are welcome to join in unlocking the full potential of on-chain logic to create dApps that are more sophisticated, innovative, and accessible to mainstream consumers, disrupting traditional centralized models.Developers・May 17, 2023Introducing the Network Overview dashboard for the Flow networkMetrika has unveiled the latest addition to its suite of tools for the Flow Network: the Network Overview dashboard. This dashboard is designed to provide transparency and valuable insights into the health and performance of the network. It is the first public facing dashboard providing real-time insights of key metrics of the Flow network.Developers・May 12, 2023Supercharging innovation with the Flow Incubation Program pilotWe’re thrilled to introduce the Flow Incubation Program, which will provide the support standout teams on Flow need to successfully navigate the journey to becoming sustainable businesses. An inaugural cohort will kick off a pilot of the program – which will take the place of the hackathon launchpad phase – with teams selected from the recent Flow Hackathon. Developers・March 22, 2023On Keys and Code: Account Abstraction and the Race to 1 Billion UsersJoin guest author Brian Astrove in exploring account abstraction within the context of onboarding mainstream users to Web3.Developers・March 20, 2023Hybrid Custody on Flow – the best of app custody and self custodyDevelopers on Flow can create a hybrid of app custody and self custody that provides the full benefits of both, removing friction from the user experience and paving the way for the mainstream adoption of Web3.Developers・March 20, 2023DEMO: Experience Walletless Onboarding + Account Linking in actionFlow introduces consumers to Web3 through Walletless Onboarding and Account Linking to provide a familiar, accessible experience for users as they engage with apps and the broader ecosystem.NextMore from FlowEcosystem・February 24, 2025How to Bridge ETH to Flow BlockchainEthereum (ETH) remains one of the most widely used cryptocurrencies, but high transaction fees and network congestion often push users to explore alternative chains. Flow blockchain, a high-performance Layer-1 blockchain, provides a developer-friendly and cost-effective ecosystem for users and decentralized applications (dApps). Bridging ETH to Flow blockchain enables users to leverage Flow's low gas fees, fast transactions, and seamless smart contract execution.Ecosystem・February 25, 2025Stablecoins on Flow: A Complete GuideFlow blockchain offers a robust ecosystem for stablecoins, enabling seamless transactions, DeFi participation, and financial stability within the network. Whether you're looking to acquire, use, or farm stablecoins on Flow, this guide will walk you through the best options available.Ecosystem・February 24, 2025Discover Yield Farming on FlowYield farming on Flow presents an exciting opportunity for users to earn passive income by providing liquidity to decentralized finance (DeFi) protocols. As Flow continues to gain traction in the blockchain ecosystem, platforms like KittyPunch and Increment.fi are leading the charge, offering innovative liquidity pools and farming strategies tailored to both risk-averse and high-yield investors.Ecosystem・February 14, 2025Flow and OpenSea: A New Era for Onchain Consumer Apps and Digital AssetsFlow has solidified its position as the premier blockchain for on-chain consumer applications, earning the trust of industry-leading brands such as the NBA, NFL, Disney, and Ticketmaster. Now, with its integration into OpenSea—the world’s largest NFT marketplace—Flow is expanding its ecosystem, bringing unmatched efficiency, interoperability, and innovation to the Web3 space.Ecosystem・February 12, 2025January 2025 Recap: Flow Expands Interoperability, Partners, and HackathonsJanuary kicked off 2025 with a plethora of new activity on Flow. Most notably this was marked by the growth of new Defi initiatives, new integration partners expanding interoperability and multiple hackathons that expanded the reach and possibilities of the Flow ecosystem. Let’s dive into some of the biggest highlights. Ecosystem・December 9, 2024November 2024: Dev Usage Grows, Rewards Store Launches, and MoreIn November, Flow broke usage records at ETHGlobal, reached TVL highs, and launched the Rewards Store at store.flow.comVisit the Blog"
