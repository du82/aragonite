title = "Flow Makes Record-Breaking Appearance at ETHGlobal Bangkok"
description = "With 99 apps built on Flow and over 2000 builders, nearly one-third of ETHGlobal winners were Flow projects."
full_description = 'SHAREDevelopers・November 21, 2024Flow Makes Record-Breaking Appearance at ETHGlobal BangkokBy Flow・TeamThe Flow World Tour brings the best developers from around the world together to create the next killer app on Flow. As the most built-on layer one blockchain at ETHGlobal Singapore and ETHGlobal San Francisco, Flow arrived at ETHGlobal Bangkok with a special focus on gaming applications. ETHGlobal Bangkok HighlightsA record-breaking 99 applications built on Flow, doubling the previous hackathon record1 in 4 of all submissions to judges were built on Flow. Flow projects secured three winning spots from ETHGlobal Over 2,000 builders participated in the largest ETHGlobal event to dateFlow judges chose winners in two categories:Most Killer App PotentialBest Gaming AppPrevious category focuses included DeFi in Singapore, Sports in San Francisco, and Social in Chiang Mai.Award-Winning Projects on FlowETHGlobal recognizes the top projects at every hackathon. In Bangkok, three of these projects were built on Flow, with each receiving top awards from both Flow and ETHGlobal. DAO GenieRecognized as the Flow project with the Most Killer App potential at ETHGlobal Bangkok, DAOGenie bridges the gap between digital communities and real-world impact through innovative governance solutions. Transforming community decisions into tangible actions using AI agents for automated execution, DAOGenie streamlines the often complex process of DAO governance to make it more accessible and efficient for community members to participate in decision-making. Built by Trevor Keith and Riley.LootGOOne of the award-winners for Best Gaming App on Flow, LootGO introduces an exciting "walk-to-earn" mechanism to the world of memecoins. Gamifying cryptocurrency collection through physical activity, LootGO users can discover loot boxes during their walks, building their crypto portfolio while enjoying a free-to-play blockchain experience that encourages both physical activity and crypto engagement. Developed by @yukiw_eth, @pjijin_, @pavvannn, @AbilSavio, and @ehteshaxm.MetalootOne of the projects recognized as the Best Gaming App on Flow, Metaloot is a comprehensive launchpad that brings on-chain capabilities to both players and developers by enabling seamless integration between games and the Flow blockchain. With in-game items stored onchain, Metaloot ensures true player ownership and cross-game item compatibility to open up new possibilities for interoperable gaming experiences. Built by @vanha1010 and @complexiasc.Most Killer App Potential on FlowAt ETHGlobal Bangkok, these projects were recognized for having the Most Killer App Potential.DAOGenie — 1st Place (ETHGlobal winner!)Simplifies DAO governance by transforming community decisions into actionable outcomes using AI-powered automation. Hundred2One — 2nd PlaceA prediction market platform reimagining community engagement. Hundred2One enables users to wager on outcomes across diverse scenarios, from sports to current events, fostering a gamified environment for knowledge sharing and decision-making.SocialBounty — 3rd PlaceBridging brands and communities, SocialBounty offers a decentralized platform for users to monetize their social influence. By participating in brand campaigns, creators earn rewards while brands gain access to authentic, grassroots promotion.Crop Cash — 4th Place (tie)Empowering small-scale farmers with decentralized finance tools, Crop Cash offers direct-to-consumer sales options and transparent transaction tracking, transforming the agricultural economy.Sounds Good — 4th Place (tie)A decentralized platform for audio creators to mint, share, and monetize their work directly with fans, Sounds Good elevates the value of independent artistry.Best Gaming App on FlowEvery stop of the Flow World Tour has focused on a special category. At ETHGlobal Bangkok, it was gaming, and these projects were the best on Flow. Raize is a mintable AI agent that plays poker on your behalf. Each agent is different, and they learn with each win and loss.Chain of Thrones is a medieval strategy game that combines blockchain mechanics with immersive storytelling. Players can conquer territories, forge alliances, and own their unique game assets to make every victory truly theirs.LootGO (ETHGlobal winner!) gamifies physical activity with a “walk-to-earn” mechanism, allowing users to discover loot boxes during their walks, combining fitness with cryptocurrency collection.Metaloot (ETHGlobal winner!) is a launchpad enabling seamless on-chain integration for games, ensuring true ownership of in-game items to foster interoperable gaming experiences.Best Developer FeedbackFlow was built by developers, for developers. That’s why the team gave special awards to six devs for their feedback, with Hydrofy winning “Best Developer Feedback” and several hundred dollars. Want to build the next killer app?ETHGlobal Bangkok demonstrates the growing appeal of Flow to developers, and the network’s increasing capability to support innovative, user-centric applications. With record-breaking participation and groundbreaking projects, Flow developers are shaping the future of consumer crypto at developers.flow.com.‍Related ContentDevelopers・December 12, 2024Build Superior EVM Apps with CadenceSuperior Web3 apps start with reimagining UX. Flow’s EVM compatibility + Cadence enable seamless atomic transactions, reducing friction & unlocking new possibilities. Developers・December 1, 2024The Flow World Tour is in Asia and OnlineFrom December 1st to 31st, developers across Asia compete online to build the next killer app on Flow.'
