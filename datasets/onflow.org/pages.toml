["https://onflow.org/categories/education"]
title = "Education | Insights and Resources on from Flow Blog"
description = "Ethereum (ETH) remains one of the most widely used cryptocurrencies, but high transaction fees and network congestion often push users to explore alternative chains. Flow blockchain, a high-performance Layer-1 blockchain, provides a developer-friendly and cost-effective ecosystem for users and decentralized applications (dApps). Bridging ETH to Flow blockchain enables users to leverage Flow's low gas fees, fast transactions, and seamless smart contract execution."
full_description = "Blog | EducationAllEcosystemDeveloperEducationEngineeringFEATUREDEducation・February 2, 2021How to grow a community around your projectIn the decentralized world, communities can make or break any startup. To create trust in a trustless environment is a cumbersome but well worth task. This guide seeks to provide the reader with some of the necessary understanding.Education・October 15, 2024How boxes and keys work in Flow RewardsUse Flow to earn boxes and keys, and combine them for points to spend on unique rewards like cars, concerts, and more.Education・October 1, 2024How to Redeem Your Flow RewardsIt takes about 30 seconds to collect your rewards from the Flow Community Rewards program.Education・August 6, 2024Part 2: Supercharging EVM apps on FlowEvolve EVM apps on Flow! Discover how Flow’s integration with the Ethereum Virtual Machine boosts empowers developers through the native transaction and account models.Education・July 12, 2024Part 1: Supercharging EVM apps on FlowEnhance your decentralized apps with EVM on Flow! Discover how Flow’s integration with the Ethereum Virtual Machine boosts scalability, reduces transaction costs, and enables seamless cross-chain interoperability. Education・October 13, 2022Guide: Fungible Tokens on FlowHow do fungible tokens work on Flow? Learn all about it inside and find our in-depth Fungible Tokens on Flow guide!Education・September 16, 2021Inside Flow: The Multi-Node Architecture that Scales to MillionsBy introducing the paradigm of pipelining through specialised node types, Flow’s multi-node architecture provides higher levels of throughput and decentralisation than existing solutions, while significantly enhancing ease of development, user experience and digital asset security , without relying on sharding or layer 2 solutions. It’s the blueprint for future-proof consumer-grade blockchain protocols.Education・May 5, 2021Flow Partnerships: Insights into MusicWhat kind of experiences do artists and labels across the music industry want to create with blockchain technology, how do different elements of music fit into what kind of NFTs can be created, and what should builders be thinking about as they consider opportunities in this space? Learn all about it.Education・February 2, 2021How to grow a community around your projectIn the decentralized world, communities can make or break any startup. To create trust in a trustless environment is a cumbersome but well worth task. This guide seeks to provide the reader with some of the necessary understanding.Education・January 21, 2021Supply chain management and blockchain technologyThe supply chain management industry has for long struggled with various problems reducing the efficiency with which a product gets to the end user’s hands. Causing global disruptions, the 2020 pandemic further exposed these issues, to which blockchain technology may be the needed answer.Education・January 7, 2021How to fund a blockchain startup?In every startup’s journey, a moment comes when the question “How to fund it?” demands an answer. The answer will necessarily be different depending on the industry the startup finds itself in, and this dependence seems to play an even larger role when referring to the blockchain space.Education・November 27, 2020Flow Port is HereYour portal to the decentralized world of Flow is here. We are excited to announce that Flow Port is now available.Education・September 3, 2020Using Ledger Nano with FlowLedger Nano devices safely store their user’s private keys enabling them to interact with the decentralized world in a safe and secure manner. Fortunately, Flow Blockchain, and the dApps built on it, support the use of Ledger Nano devices to sign transactions.Education・May 27, 2020Flow at Consensus: Distributed: Roadmap and Mainstream AdoptionFlow team and partners hit the Foundations stage this year at Consensus: Distributed to present why we built Flow and how it will lead mainstream crypto adoption.More from FlowEcosystem・February 24, 2025How to Bridge ETH to Flow BlockchainEthereum (ETH) remains one of the most widely used cryptocurrencies, but high transaction fees and network congestion often push users to explore alternative chains. Flow blockchain, a high-performance Layer-1 blockchain, provides a developer-friendly and cost-effective ecosystem for users and decentralized applications (dApps). Bridging ETH to Flow blockchain enables users to leverage Flow's low gas fees, fast transactions, and seamless smart contract execution.Ecosystem・February 25, 2025Stablecoins on Flow: A Complete GuideFlow blockchain offers a robust ecosystem for stablecoins, enabling seamless transactions, DeFi participation, and financial stability within the network. Whether you're looking to acquire, use, or farm stablecoins on Flow, this guide will walk you through the best options available.Ecosystem・February 24, 2025Discover Yield Farming on FlowYield farming on Flow presents an exciting opportunity for users to earn passive income by providing liquidity to decentralized finance (DeFi) protocols. As Flow continues to gain traction in the blockchain ecosystem, platforms like KittyPunch and Increment.fi are leading the charge, offering innovative liquidity pools and farming strategies tailored to both risk-averse and high-yield investors.Ecosystem・February 14, 2025Flow and OpenSea: A New Era for Onchain Consumer Apps and Digital AssetsFlow has solidified its position as the premier blockchain for on-chain consumer applications, earning the trust of industry-leading brands such as the NBA, NFL, Disney, and Ticketmaster. Now, with its integration into OpenSea—the world’s largest NFT marketplace—Flow is expanding its ecosystem, bringing unmatched efficiency, interoperability, and innovation to the Web3 space.Ecosystem・February 12, 2025January 2025 Recap: Flow Expands Interoperability, Partners, and HackathonsJanuary kicked off 2025 with a plethora of new activity on Flow. Most notably this was marked by the growth of new Defi initiatives, new integration partners expanding interoperability and multiple hackathons that expanded the reach and possibilities of the Flow ecosystem. Let’s dive into some of the biggest highlights. Developers・December 12, 2024Build Superior EVM Apps with CadenceSuperior Web3 apps start with reimagining UX. Flow’s EVM compatibility + Cadence enable seamless atomic transactions, reducing friction & unlocking new possibilities. Visit the Blog"
