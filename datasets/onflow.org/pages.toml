["https://onflow.org/post/the-flow-world-tour-is-in-asia-and-online"]
title = "The Flow World Tour is in Asia and Online"
description = "From December 1st to 31st, developers across Asia compete online to build the next killer app on Flow."
full_description = "SHAREDevelopers・December 1, 2024The Flow World Tour is in Asia and OnlineBy Flow・TeamAfter emerging as the network of choice for builders in Singapore, San Francisco, and Bangkok, the Flow World Tour is in Asia for a whole month! This December, developers online and across Asia will compete to create the best applications on Flow, with prizes awarded for the best Telegram integration and most promising killer app concept. Flow will also be hosting in-person events in the following cities:ChengDu, ChinaJarkarta, IndonesiaKolkata, IndiaKuala Lumpur, MalaysiaThe online hackathon runs from December 1-31, 2024, and is open to developers worldwide. Prize categories include:Best Telegram IntegrationMost Promising App ConceptBest Developer FeedbackFlow welcomes developers of all experience levels to explore the network’s capabilities and build something new. Participants can sign up here. Why Flow is Ideal for Telegram IntegrationsAn application built on Telegram is accessible to the platform’s one-billion-plus users. Flow stands out for its ability to handle large-scale applications without the typical blockchain growing pains. When NBA Top Shot launched on Flow in 2020, it proved the network could support hundreds of thousands of users simultaneously while keeping transaction costs remarkably low (around $0.00001237 per transaction even during peak times).What makes Flow different is how it handles complex operations. The only blockchain built from the ground up for consumer applications, the multi-node architecture of Flow spreads out the work of processing transactions, which means your application stays responsive even as more users join. For developers, this translates to building without worrying about sudden spikes in fees or system slowdowns.The App to Learn From on FlowIn 2017, CryptoKitties launched on the Ethereum blockchain, accounting for roughly 25% of transactions on the network at peak times. That experience led to the creation of Flow, and in 2024, those lessons were showcased when the sequel to CryptoKitties launched as a telegram integration on Flow. Now boasting over 150,000 players, CryptoKitties: ALL THE ZEN! allows users to build a collection of upgradeable digital cats, and check in often to collect the in-game currency, ‘Zen’ which can be used to level up a clowder, and increase idle Zen accumulation. The game has proven so popular that Rally.xyz hosted a commemorative NFT giveaway that 10-15% of the active playerbase participated in! Why Build on FlowWhether you're new to blockchain development or an experienced builder, Flow offers what you need to succeed:Access development tools and documentationSupport for both Solidity and Cadence, the world’s most powerful smart contract languageMassive scale at low cost, and the ability to create applications that aren’t possible on other blockchainsGet StartedReady to build? Here's how to join:Review the Flow developer documentationRegister to participateStart building your projectSubmit your creation by December 31, 2024The Flow World Tour represents more than just a competition — it's an opportunity to shape the future of consumer web3. Whether you're interested in gaming, social platforms, sports, or something entirely new, Flow provides the tools to bring your vision to life.Join developers across Asia this December, and help build the next generation of web3 applications.Related ContentDevelopers・December 12, 2024Build Superior EVM Apps with CadenceSuperior Web3 apps start with reimagining UX. Flow’s EVM compatibility + Cadence enable seamless atomic transactions, reducing friction & unlocking new possibilities. Developers・November 26, 2024Vitalik Buterin and Dieter Shirley Discuss Crypto's Next Killer AppThe cofounders of Ethereum and Flow discuss how decentralized apps find mainstream success during the Flow World Tour in Thailand"
