["https://onflow.org/post/january-2025-recap-flow-expands-interoperability-partners-and-hackathons"]
title = "January 2025 Recap: Flow Expands Interoperability, Partners, and Hackathons"
description = "January kicked off 2025 with a plethora of new activity on Flow. Most notably this was marked by the growth of new Defi initiatives, new integration partners expanding interoperability and multiple hackathons that expanded the reach and possibilities of the Flow ecosystem. Let’s dive into some of the biggest highlights."
full_description = "SHAREEcosystem・February 11, 2025January 2025 Recap: Flow Expands Interoperability, Partners, and HackathonsBy Chris Jones・Flow integrates LayerZero to Expand Cross-Chain InteroperabilityDeFi Volume on Flow Continues to GrowAI Hackers Building on FlowNBA Top Shot partners with Sotherbys Auction HouseJanuary kicked off 2025 with a surge of new activity on Flow. This was seen in the growth of new DeFi initiatives, new integration partners expanding interoperability and multiple hackathons that expanded the reach and possibilities of the Flow ecosystem. Let’s dive into some of the biggest highlights.LayerZero and Stargate Launch on FlowThe Flow ecosystem saw a major leap in interoperability with Stargate powered by LayerZero launching on Flow. This unlocks seamless access to over 100 other blockchains, enabling users to move assets across chains instantly, making Flow more interconnected and interoperable than ever.This integration enables cheap and efficient asset transfers across the Flow ecosystem. Developers and users alike now benefit from Flow’s secure, high-throughput infrastructure with unparalleled access to decentralized finance (DeFi) and cross-chain applications.Flow is home to some of the most recognizable brands in crypto—NBA Top Shot, CryptoKitties, NFL ALL DAY. A consumer-grade chain built for scale.Now, all of crypto is connected to Flow.LayerZero links Flow to 100+ chains, bringing the broader crypto economy into contact with… pic.twitter.com/GDTfXUDeZn— LayerZero (@LayerZero_Core) February 6, 2025 Axelar Bridging Is Live On FlowAnother significant milestone in January was the launch of Axelar’s Interchain Amplifier on Flow. This development connects Flow to Axelar’s rapidly growing network of 70+ blockchains, further enhancing Flow’s capabilities in cross-chain composability and liquidity. Axelar’s integration enables decentralized applications (dApps) on Flow to seamlessly interact with other chains, boosting Flow’s presence in the wider Web3 ecosystem.With Axelar now live, developers can build apps on Flow that tap into cross-chain functionalities, providing users with a frictionless experience across multiple ecosystems.New DAO Tooling, Trading Bots, Data Analytics and more Flow continues to attract innovative platforms and protocols, solidifying its reputation as the go-to blockchain for scalable consumer applications. Here are some key new arrivals this month:Tally: Flow’s DAO ecosystem now has access to Tally’s robust on-chain governance tools, enabling efficient and scalable decision-making for decentralized organizations.Noves: Noves simplifies complex transactions by translating them into clear, human-readable information, helping retail users gain insights into their digital assets.SudoCatBot: This new Telegram-based bot simplifies Flow EVM trading, allowing users to create wallets, fund them, and trade tokens seamlessly within the messaging app.StableKitty: Developed by KittyPunch, StableKitty is a new trading venue dedicated to stablecoins (currently $6M TVL) and other DeFi tokens on Flow.These new platforms highlight Flow’s focus on developer-friendly infrastructure and usability, making it easier than ever for both builders and users to engage with the network.DeFi Growth Accelerates with $10M in Monthly Swapped VolumeThe DeFi sector on Flow experienced rapid growth, with protocols such as Trado, More Markets, and KittyPunch leading the way. Trado surpassed $10 million in swapped volume this month, reflecting increased user activity and liquidity. Additionally, KittyPunch farms now boast over $3.5 million in locked liquidity, further bolstering Flow’s expanding DeFi ecosystem.LayerZero and Axelar are set to further boost Flow’s DeFi momentum by enhancing cross-chain liquidity and innovation.Hackathon Highlights: Asia Online, ETHGlobal Agentic Hackathons & ETH DenverThe Asia Online Hackathon, part of the Flow World Tour, concluded in early January with over 350 participants and 72 project submissions. This virtual event, which ran throughout December, showcased the creativity and talent within the Flow developer community. Ten winners emerged with apps that spanned gaming, DeFi, and AI, reinforcing Flow’s commitment to fostering innovation in Web3.The full list of winners and their projects will be published later this week—stay tuned!After this, Flow took center stage as a sponsor at the ETHGlobal Agentic Virtual Hackathon. Focused on AI agents, this event awarded $10,000 in prizes across three tracks:Best AI Agents for ConsumersBest Plugins to Eliza on FlowBest No-Code AI Agent LauncherDevelopers demonstrated the potential of AI-driven applications on Flow, with projects that integrated seamlessly into consumer experiences.Following these successful hackathons, Flow is heading to Denver, Colorado as a key sponsor for the ETH Denver hackathon. Starting on February 23rd, the event will bring together blockchain developers from around the world to compete and innovate across various tracks. Flow Scholars will gain exclusive access to team-hosted events, collaboration opportunities, and a chance to represent the ecosystem. Anyone can apply to be a Flow Scholar, but most spots are already filled—apply quickly if you want a chance to join!‍Alongside the Scholars and core team members, there will also be a Flow Crypto Castle, open for anyone for co-working, socializing, meet-up events, and more. More details on ETHDenver plans will be shared soon.With Flow's growing prominence in interoperability and AI-driven applications, ETHDenver promises to be another milestone in community engagement and innovation. These hackathons underscore Flow’s dedication to supporting builders and pushing the boundaries of what’s possible with blockchain technology.Exciting Activity on NBA TopShot and MFLFlow continues to showcase why it’s the home of Sports in Web3 in 2025, with NBA Top Shot and MFL kicked off the year with impressive milestones. NBA Top Shot partnered with Sotheby’s auction house for an exciting auction of a series of rare NBA Top Shot Rookie Debut Moments, attracting high-profile bids and further cementing Flow’s position as a leader in digital sports memorabilia.Meanwhile, MFL set a new record for registered teams for its upcoming Season 3, highlighting the ongoing demand for sports collectibles and fantasy gaming on Flow. The MFL team has been making big moves in 2024, so they’re certainly one to watch over the coming months.Rewards Store Updates: Two Rolexes Claimed and More Prizes In StoreThe Rewards Store saw two Rolex watches claimed with Rewards points last month, proving just how exciting it is to engage in the Flow ecosystem. Points, which are earned through a combination of Keys and Boxes, are rewarded to those active in the ecosystem across various platforms. You can see more information on how to start earning Rewards Store Points here. There are a wide range of rewards that can be unlocked, including physical goods, on-chain items, and exclusive experiences. Check it out for yourself at store.Flow.Com.What’s Next for FlowAs 2025 gets started, Flow is poised for continued growth and innovation. With interoperability at an all-time high, new partnerships flourishing, and developer engagement surging, Flow is well-positioned to lead the next wave of blockchain adoption.Stay tuned for more updates, and visit developers.flow.com to start building on Flow today!Related ContentEcosystem・February 20, 2025How to Bridge ETH to Flow BlockchainEthereum (ETH) remains one of the most widely used cryptocurrencies, but high transaction fees and network congestion often push users to explore alternative chains. Flow blockchain, a high-performance Layer-1 blockchain, provides a developer-friendly and cost-effective ecosystem for users and decentralized applications (dApps). Bridging ETH to Flow blockchain enables users to leverage Flow's low gas fees, fast transactions, and seamless smart contract execution.Ecosystem・February 18, 2025Stablecoins on Flow: A Complete GuideFlow blockchain offers a robust ecosystem for stablecoins, enabling seamless transactions, DeFi participation, and financial stability within the network. Whether you're looking to acquire, use, or farm stablecoins on Flow, this guide will walk you through the best options available."
