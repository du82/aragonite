["https://onflow.org/core-protocol"]
title = "Core Protocol | Flow Governance"
description = "Flow has pioneered a new paradigm of multi-role architecture that solves the core scaling problems of today’s blockchains without sharding."
full_description = "Core ProtocolScaling without sharding, while maintaining composability and decentralizationFlow has pioneered a new paradigm of multi-role architecture that solves the core scaling problems of today’s blockchains without sharding.Core Protocol VisionData Availability VisionPrimer Modular blockchain system orchestrated by a holistic protocolMulti-role architecture is a horizontally scalable network that solves the common scalability & security issues with a protocol-native data availability stack, proposer builder separation, separation of compute, consensus & settlement – all without sharding. A permissionless network with separation of concerns orchestrated by a holistic protocol opens the door to massive scale for novel composable applications.Learn more Horizontally-scaling data availability pioneering modular Data Availability ShardsIn Flow, the mempool for incoming transactions is horizontally distributed across independent clusters of specialized validators [Collectors]. Thereby, the number of transactions the Flow network can ingest is by orders of magnitude higher than the load any individual validator could handle. This solves the foundational hurdle of monolithic blockchains where the overall system's capacity is capped by the number of transactions an individual validator can handle (typically the 33-percentile of the slowest validators).Learn more Censorship & MEV resistance via Proposer Builder SeparationUnlike other blockchains where validators are incentivized for preferential treatment of certain transactions to the disadvantage of the average user (commonly referred to as miner-extractable value [MEV]), Flow natively provides censorship & MEV resistance which is achieved by designating specific validators for building transaction bundles that are separated from the validators proposing blocks (Consensus nodes).Learn more Protocol-native rollups and settlement on the order of seconds With designated validators for transaction execution, Flow horizontally scales natively within the layer-1 protocol. Other chains commonly work around the fundamental scaling limitations of their layer-1 protocol by outsourcing scalability to a fragmented ecosystem of L2s - rollups, side chains, state channels, etc. Flow’s scaling without sharding approach provides superior developer experience, improves composability and interoperability of the entire ecosystem.Learn more Built for unmatched scalability & efficiency with separation of consensus & computeStandard blockchains bundle consensus and execution while Flow decouples them. Separation of concerns significantly reduces redundant effort which will allow Flow to scale to thousands of times higher throughput and petabytes of state data at lower cost while maintaining a shared execution environment for all operations on the network. This enables better composability and sovereignty for applications built on Flow.Learn more Stay up to date with the latest news on Flow.Stay up to date with the latest news on Flow.Thank you! You're all set.Oops! Something went wrong while submitting the form."
