full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Open and inclusive to the entire music community (not just students), join us Friday, May 30 through Saturday, May 31 on Berklee College of Music’s campus in Boston for an unforgettable two days of live music, learning sessions, and networking events! Join us Friday, May 30 through Saturday, May 31 on Berklee College of Music’s campus in Boston for Berklee Onsite 2025! Onsite is two days of live music, learning sessions, and networking events, giving you the opportunity for face-to-face connections with Berklee instructors, students, and advisors you might normally only get to interact with online. Zahili Gonzalez Zamora is an award-winning pianist and composer whose work fuses Afro-Cuban traditions with jazz innovation. Her trio, MIXCLA, has wowed audiences at Monterey and Montreal Jazz Festivals. A Berklee alum and Piano Department faculty member, she graduated summa cum laude in 2017 with a dual degree in Jazz Composition and Jazz Piano Performance. Rodney Alejandro has written, produced, and performed with icons like Quincy Jones, Roger Daltrey, and Stevie Wonder. A former member of the Script, he shaped their live sound as musical director. From chart-topping hits to TV scores (The Shield), his expertise fuels Berklee’s Songwriting Department. In 2024, he was nominated for his first Grammy. The first female chair of a collegiate film scoring department, Alison's scoring credits range from documentaries for PBS and the History Channel to national television ads, independent films, live action and animated shorts, theater, and multimedia museum installations for the Smithsonian Institution and the Harvard Museum of Natural History. A legendary producer and engineer, Prince Charles Alexander has worked with Mary J. Blige, the Notorious B.I.G., Sting, and more, earning multiple Grammys and more than 40 Platinum and Gold certifications. A former Virgin Records artist, he was an early innovator in digital production, blending funk, R&B, and hip-hop with emerging studio technology."
