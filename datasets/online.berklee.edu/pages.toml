["https://online.berklee.edu/courses/arranging-small-ensemble-and-horns"]
title = "Arranging: Small Ensemble and Horns Course - Berklee Online"
description = "Develop your writing and arranging skills for small and large ensembles and learn techniques that you can apply to both live instrumentation and sequences."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Whether you are writing for jingles, soundtracks, or pop songs, knowing how to write/arrange for smaller bands and larger ensembles is crucial to your success. Arranging: Small Ensemble and Horns explores the properties of the trumpet, trombone, and alto, tenor, and baritone saxophones and approaches the techniques and melodic embellishments that will give you a basic understanding of writing/arranging for these horns as a section. In this music arrangement course, you will focus on applying writing processes for two-, three-, four-, and five-part horn combinations; skills that can be applied to both live instrumentation and sampled or synthesized sounds. You really can't write effective sequenced parts without knowing what real players would characteristically play on these instruments. This music arrangement course will provide you with a greater understanding of the possibilities and sounds that the horns as a section can add to your arrangement. Prerequisite Courses, Knowledge, and/or Skills Completion of Arranging 1: Rhythm Section or equivalent knowledge and experience is required. Recommended experience in a DAW of choice. Student Deals After enrolling, be sure to check out our Student Deals page for various offers on software, hardware, and more. Please contact support@online.berklee.edu with any questions. Below are the minimum requirements to access the course environment and participate in Live Classes. Please make sure to also check the Prerequisites and Course-Specific Requirements section above, and ensure your computer meets or exceeds the minimum system requirements for all software needed for your course. Composer, producer, educator, orchestrator and arranger Jerry Gates has been a music industry professional for over thirty-five years. At Berklee College of Music, he teaches in the Contemporary Writing and Production Department and has taught most of the core classes in that major. He has authored Arranging For Horns through Berklee Press and Hal Leonard Publishing and has self published All Twelve: Dodecaphonic Sources For Contemporary Composition."
