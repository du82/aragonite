title = "Genre Survey for Songwriters: Analysis and Application Course - Berklee Online"
description = "This course explores top examples of representative songs from different popular music genres, as defined by Billboard.com, with the goal of analyzing and understanding the musical components that determine the nature of these genres, resulting in a successful songwriting process, according to music industry standards."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 The goal of this course is to get a professional understanding of the music and production choices within a wide variety of genres in the music industry. You will explore and analyze typical consumption patterns within these genres, which will inform your choices so you will be able to apply them in your own personal music projects. The course will explore the creative process within genres as defined by Billboard.com, using Production Analysis and Critical Listening techniques defined by Berklee College of Music’s Music Production and Engineering Department. Prerequisite Courses, Knowledge, and/or Skills Completion of Songwriting: Melody, Songwriting: Harmony, Arranging for Songwriters: Instrumentation and Production in Songwriting, Songwriting Tools and Techniques, Music Demo Production for Songwriters, and Topline and Vocal Production or equivalent knowledge and experience is required. Students should be able to: Student Deals After enrolling, be sure to check out our Student Deals page for various offers on software, hardware, and more. Please contact support@online.berklee.edu with any questions. Below are the minimum requirements to access the course environment and participate in Live Classes. Please make sure to also check the Prerequisites and Course-Specific Requirements section above, and ensure your computer meets or exceeds the minimum system requirements for all software needed for your course. Prince Charles Alexander is a sought-after music producer and audio engineer whose clients include Mary J. Blige, Destiny's Child, Faith Evans, the Notorious B.I.G., Usher, Boyz II Men, Brandy, Babyface, Sting, Aretha Franklin, Brian McKnight, Donnie McClurkin, and others. Alexander has garnered more than 40 Platinum and Gold certifications from the RIAA and has multiple Grammy Awards and nominations. He teaches Advanced Production and Mixing at Berklee, and created the Commercial Record Production minor in that department, for which he received the Don Wilkins Excellence in Curriculum Development Award from Berklee's Professional Writing and Music Technology Division in 2013. Alexander also teaches production and engineering for Berklee Online, is co-creator of the Vocal Production course for Berklee Online, and for ten concurrent years, was also an adjunct instructor at New York University's Clive Davis Institute of Recorded Music."
