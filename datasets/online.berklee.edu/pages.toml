full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Credit Card Payments via credit card may be made online. The following major credit cards are accepted: American Express, Discover, MasterCard, and Visa. Personal Check, Cashier’s Check, or Money Order Payments made by check may be subject to processing delays, so we encourage you to choose one of our alternate payment methods. Please contact finance@online.berklee.edu or 617-747-2146 ext. 5 for additional check payment instructions. All checks should be made payable to Berklee College of Music with the negotiable amount in U.S. currency. If a student makes payments with a personal check and the check is returned, Berklee Online charges a $50 processing fee. Notice of the returned check will be sent to the student. If the return payment creates a debit balance on the account, a hold will be placed on the student account, which blocks academic schedule changes, and all future registrations until complete restitution of funds is made. Berklee Online reserves the right to require future payments in the form of a certified check, money order, or credit card, and the student will no longer be able to use personal checks as a form of payment. Berklee Online will not redeposit personal checks that have been returned and requires that full payment be made within five business days of the notice being issued. Wire Transfer Berklee Online has partnered with Flywire to streamline the wire payment process for our students. You will be able to log into your Flywire account at any time to track the progress of your payment, and you will also be notified via email or text when your payment is received by Berklee Online. Flywire processes both international and domestic wire transfers. Before initiating your transfer, please take note of your student ID in order to help ensure your payment is posted to the correct account. Your ID can be found from your home page."
