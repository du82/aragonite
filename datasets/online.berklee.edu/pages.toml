["https://online.berklee.edu/courses/culminating-experience-in-songwriting-1"]
title = "Culminating Experience in Songwriting 1 Course - Berklee Online"
description = "Culminating Experience in Songwriting 1 is the first of two intensive directed study classes focused on proposing and executing a portfolio of original material recorded at a professional level as well as a business and career plan."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Prerequisite Courses, Knowledge, and/or Skills Completion of Music Career Strategies: Brand Identity Development for Artists, Songwriters, and Producers, Songwriting Tools and Techniques, Music Demo Production for Songwriters, and Songs Unmasked: Techniques and Tips for Songwriting Success is required. Student Deals After enrolling, be sure to check out our Student Deals page for various offers on software, hardware, and more. Please contact support@online.berklee.edu with any questions. Below are the minimum requirements to access the course environment and participate in Live Classes. Please make sure to also check the Prerequisites and Course-Specific Requirements section above, and ensure your computer meets or exceeds the minimum system requirements for all software needed for your course. Bonnie Hayes has more than 35 years of experience as an educator, songwriter, producer, performer, and recording artist. During her career, she has been signed to five record deals and five writing deals, and toured as a side musician with Billy Idol and Cris Williamson. She has written songs for Bonnie Raitt, Cher, Bette Midler, David Crosby, Robert Cray, Adam Ant, and Booker T. & the MG’s, and produced more than 40 records. She designed and implemented the youth program for the Blue Bear School of Music in San Francisco, and has taught piano, guitar, theory, songwriting, and composition to thousands of students at institutions throughout the US. Michael Sempert’s music is equal parts heart and craft, lifeblood and elegant design. He has composed original scores for award-winning indie films including Love in Dangerous Times, Roads to Olympia, and Sex Weather. His collaboration with Austin, Texas–based filmmakers on the indie feature films A Room Full of Nothing and Homestate yielded original film scores rooted in cosmic American music. His scoring work with auteur filmmaker Jon Garcia draws from analog, synth-based ambient music."
