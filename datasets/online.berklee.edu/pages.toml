["https://online.berklee.edu/about/undergraduate-certificate-programs-tuition-and-fees"]
title = "Undergraduate Certificate Programs Tuition and Fees - Berklee Online"
description = "Undergraduate Certificate Programs Tuition and Fees"
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Tuition and fees for each undergraduate certificate program are listed within the program pages which can be found here. The registration and technology fee is $175 per certificate program. To reserve your seat in a certificate program, you must submit this one time non-refundable and non-transferable registration fee of $175. 1. Full payment up front: Students pursuing an undergraduate certificate program can opt to pay the full tuition amount up front and receive a savings of 10% on tuition. In addition to tuition, a one-time non-refundable registration and technology fee of $175 will be charged at the time of enrollment in the certificate program. 2. Pay per Semester: Students can opt to pay for each course prior to the semester they wish to take the course. The one-time $175 non-refundable registration and technology fee will be due at the time of enrollment in the certificate program. By paying tuition promptly, you will ensure enrollment in the course of your choice and timely delivery of all required course materials. Please see the course requirements for necessary books and materials. In some cases, students may be required to purchase course materials from one of our music industry partners. The prices charged may include an educational discount which we are pleased to offer our students. Undergraduate students can change their payment option from per semester to full payment at any time during their first semester by sending a request to the Berklee Online Registrar’s Office at registrar@online.berklee.edu. The 10% discount will be deducted from any unpaid courses. It will not be applied to any courses already paid. Undergraduate students wishing to change their payment option from full payment to per semester need to do so prior to making a payment towards tuition. Requests to change a payment option should be sent in writing to the Berklee Online Registrar’s Office at registrar@online.berklee.edu."
