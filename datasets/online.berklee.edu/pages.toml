["https://online.berklee.edu/courses/keyboards-for-live-performance-techniques-and-technology"]
title = "Keyboards for Live Performance: Techniques and Technology Course - Berklee Online"
description = "The focus of this keyboard course is on live performance, providing students with software and hardware tools to achieve professional results in this particular setup. We will discuss different keyboard artists and their techniques, and keyboardist’s best practices for a successful professional career."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 This Keyboards for Live Performance course is an exploration of all things keyboard in live performance. The course uses a computer-driven keyboard rig with acoustic and electric pianos, organ, synthesizers, synth bass, strings, and brass. You will develop an understanding of keyboard hardware, computer technology and software, basic synthesis, sound design, sampling, music theory with regards to soloing, time-feel and groove, keyboard hand independence and technique, authentic ways to perform string and horn parts, musical styles, and effective performance skills. You will learn from iconic keyboardists and keyboard artists by listening to their musicality, keyboard sound production, and watching their performances. We will also discuss the history of keyboards, synths and software synths, as well as the innovations that served keyboard advancements (MIDI, computers, internet, DAWs, and VSTs). You will learn how to edit sound parameters to imitate the original recordings, but also to create new sounds for keyboard features and solos. And you will learn how to create splits and layers to be able to cover more than one keyboard part in a song using one keyboard. Most importantly, every week, you will record a compelling live visual and musical performance synthesizing (yes, pun intended) your understanding of the week's topics. You will present your newly acquired skill sets via unedited video performances, which will include demonstrations of creative musical arrangements of existing song material and impressive solo keyboard features. The course will support an understanding of a professional keyboardist's responsibilities and best practices. We'll emphasize continuing professional development and growth for success and longevity as a live performing keyboardist. Prerequisite Courses, Knowledge, and/or Skills Completion of Piano Scales 101, Piano Chords 101, Piano and Keyboard Techniques for Session Musicians and one of the following: Intermediate Keyboard, Blues and Rock Keyboard Techniques or Pop/Rock Keyboard, or equivalent knowledge and experience is required. Students should be able to:"
