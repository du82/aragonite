full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 With Berklee Online, you can study what you want, when you want, and where you want, with recognized experts in contemporary music education. You can participate in several ways: Berklee Online is accepting applications for our master’s degree programs. These unique 36-credit offerings include a Master of Arts in Music Business, Master of Music in Music Production, Master of Arts in Songwriting, Master of Music in Film Scoring. Earn a master’s degree from Berklee Online and you’re eligible to walk in the graduation ceremony at Berklee’s Boston campus. Read full details about our online graduate programs. Berklee Online is currently accepting applications for our Bachelor of Arts degree program. Our 120-credit, fully accredited online degree is offered in a variety of majors, including: Music Production, Guitar Performance, Music Business, Songwriting, Interdisciplinary Music Studies (Create Your Own Major), Music Composition for Film, TV, and Games, Electronic Music Production and Sound Design, and Songwriting and Producing Music. Earn a bachelor’s degree from Berklee Online and you’re eligible to walk in the graduation ceremony at Berklee’s Boston campus. Read full details about our online music degree programs. Earn professional credentials and marketable skills when you enroll in a multi-course certificate program. You can obtain an undergraduate certificate in subjects such as songwriting, music production, arranging, theory, harmony, ear training, electronic music production, guitar, bass, keyboard, drums, voice, music theory, contemporary writing, home recording, and music business. Graduate certificates include programs in music business and music production. Choose a program that best fits your time frame and needs, from 6- and 12-month intensive programs, to longer 2+-year programs that will help you develop complete mastery in your area of interest."
