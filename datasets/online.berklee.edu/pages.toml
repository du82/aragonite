description = "Founded in 2002, Berklee Online is the premier innovator and largest provider of worldwide music education, offering more than 75,000 students from 144 countries the renowned curriculum of Berklee College of Music, at a fraction of the cost."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Learn how to harness evidence-based music therapy techniques that will help you cope with life’s stressors. With 200+ music courses, 50+ certificate programs, eight undergraduate programs, and four graduate majors, Berklee Online has a track for you. With the same faculty who teach at Berklee's Boston campus, plus music industry professionals, your instructors are literally some of the best in the business. All courses cap at 20 students, providing a tight-knit learning experience with your classmates and instructor. Experience Berklee Online's award-winning learning platform, and master musical techniques and concepts through video lectures, exercises, interactive quizzes, and Live Chats with leaders of the music industry. Whether you're looking to take a few classes, earn a certificate, or pursue a degree program, Berklee Online can help you reach your musical goals, however they may evolve. Learn more about tuition costs, types of financial aid, and other opportunities. Financial aid staff and counselors are available to help you at 1-617-747-2274 or financialaid@berklee.edu with any questions you may have. We know that completed college credits mean time, effort, and money spent. Request an unofficial transfer evaluation to learn approximately how many of your completed college credits will transfer to our degree program. Someone from our Transfer Evaluation Team will have an answer for you within 7-10 business days. If you left Berklee College of Music prior to completing your bachelor's, you now have new opportunities to complete your degree. Learn your options by filling out the Degree Completion Inquiry Form. Berklee Online provides a wealth of music education opportunities for today's aspiring musicians. Here's a quick look to help you decide which offering is right for you. With instructors who are not just experts but trailblazers in their fields, our team has shaped the sound of countless artists, from emerging talents to chart-topping superstars."
