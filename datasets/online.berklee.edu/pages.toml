title = "Berklee Online General Policies"
description = "Berklee Online General Policies"
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Berklee Online is committed to creating usable, equitable, and inclusive learning environments while providing equal educational opportunity and full participation for students with disabilities outlined by Section 504 of the Rehabilitation Act of 1973 and Title II of the Americans with Disabilities Act of 1990. Accommodations are determined on an individual, case-by-case basis. A student’s accommodation plan will remain in place for the duration of their time at Berklee Online. If a student would like to request a change to their accommodation, they may contact Berklee Online Accessibility Resources for Students to request that change. Please note, that accommodations on file with the campus are not transferred to Berklee Online. Campus students must complete the Berklee Online accommodation process to receive course accommodations for their online courses. ​​It is the responsibility of a student with disabilities to complete the following steps to be considered for accommodations at Berklee Online. 1. Students with disabilities who desire to access accommodations for their online courses shall initiate their request by completing the Berklee Online Accessibility Resource for Students Request Form here before or during the first two weeks of the course. Reasonable accommodation requests will be reviewed continually through the beginning of week 10 of the semester; any accommodation request submitted after the deadline will be reviewed and processed for the following semester. Accommodations are not retroactive and only start once approved and processed. 2. You will be asked to submit documentation of your disability or disabilities and outline the specific needs and course accommodations. Please see the supporting documentation guidelines below. 3. After the completed form and documentation have been reviewed, the Office of Berklee Online Accessibility Resources for Students will contact the student regarding appropriate next steps. Students are highly encouraged to contact instructors to facilitate the implementation of the identified accommodation."
