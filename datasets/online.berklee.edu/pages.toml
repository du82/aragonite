["https://online.berklee.edu/courses/live-event-sound-engineering-and-concert-mixing-201"]
title = "Live Event Sound Engineering and Concert Mixing 201 Course - Berklee Online"
description = "This intermediate live mixing and concert production course is designed to introduce the basic concepts and techniques of live concert mixing."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 This course will introduce the fundamentals of mixing audio for live events and productions, while preparing you to be active, professional live sound mixing engineers. We’ll begin with the basics, discussing the basic elements of a sound system. From there we’ll move on to signal flow and electrical signal flows through a live audio system. We’ll also work with offline console software to build show files. We’ll dive into signal processing including EQ and dynamic and time based effects, discussing how and when to apply these practices. This course also discusses the differences between a front of house (FOH) engineer and a monitor engineer. You’ll learn mixing in both contexts and how each requires a certain set of skills. In addition, a large part of this course includes training your ears to hear certain frequencies. This skill is imperative when mixing so you can understand how to adjust a mix effectively to achieve the best live sound possible. Finally, throughout the course, you will develop an understanding of what it means to be a professional in this field. Student Deals After enrolling, be sure to check out our Student Deals page for various offers on software, hardware, and more. Please contact support@online.berklee.edu with any questions. Below are the minimum requirements to access the course environment and participate in Live Classes. Please make sure to also check the Prerequisites and Course-Specific Requirements section above, and ensure your computer meets or exceeds the minimum system requirements for all software needed for your course. Amanda Davis is an audio engineer, educator, production manager, singer and musician based in Memphis, TN. She is a proud graduate of Chicago’s Roosevelt University (2008; Bachelors of Arts in Music in Vocal Performance) and SAE Institute, Atlanta (2010; Music Recording and Production). After graduating from SAE, Davis was hired as the Institute’s first female Lab Supervisor and first female Music Theory instructor. In 2013, Emmy-winning artist Janelle Monáe handpicked Davis to serve as her Front of House Engineer. Canadian indie/pop duo Tegan and Sara recruited Amanda to serve as their FOH engineer in 2016. In the fall of 2017, she was named Production Manager on Tegan and Sara’s The Con X tour. In 2020, Amanda returned to her native Memphis, working out of David Porter’s 4U Recording studio, to record, mix and co-produce Kortland Whalum’s A Love Letter extended play project and TANGELA’s Splendid Mind EP. Tegan and Sara also entrusted Amanda with mixing duties for their Tonight in the Dark We’re Seeing Colors album; a special Record Store Day vinyl release of live recordings from their 2019 Hey I’m Just Like You Tour. As a front of house engineer, Amanda’s touring and live show roster includes: Janelle Monáe, Tegan and Sara, Olivia Newton John, Nipsey Hussle, SWV, Jidenna, Jon Batiste, Chloe and Halle, Olivia Rodrigo, Summer Walker, Lil Durk, Audrey Nuna, Jazmine Sullivan and Ella Mai."
year_published = 2025
