title = "Commercial Vocal Production Course - Berklee Online"
description = "Develop the skills necessary to create vocal-focused recordings that are contemporary and commercially viable. You will explore voice as an instrument that is naturally expressive, but can also be technologically processed."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 In this course, you will develop the skills necessary to create vocal-focused recordings that are contemporary and commercially viable. You will explore the voice as an instrument, one that is naturally expressive and harmonically complex, and that can be technologically processed. You will also master microphone placement for various types of vocalists, choirs, and backing vocals; analyze the use of phase, panorama, delay, reverb, and vocal modulation in contemporary music compositions; and apply Auto-Tune, Melodyne, and the vocoder effectively to edit vocal recordings in production. You will develop and implement strategies that enhance vocal performances using natural and artificial techniques and processing. Prerequisite Courses, Knowledge, and/or Skills Completion of Critical Listening 1, Music Production Analysis, Audio Fundamentals for Recording, Critical Analysis of Music Production Techniques, and Advanced Mixing Techniques or equivalent knowledge and experience is required. In order to be successful in this course, you should have the following background prior to enrolling: Student Deals After enrolling, be sure to check out our Student Deals page for various offers on software, hardware, and more. Please contact support@online.berklee.edu with any questions. Below are the minimum requirements to access the course environment and participate in Live Classes. Please make sure to also check the Prerequisites and Course-Specific Requirements section above, and ensure your computer meets or exceeds the minimum system requirements for all software needed for your course. Prince Charles Alexander is a sought-after music producer and audio engineer whose clients include Mary J. Blige, Destiny's Child, Faith Evans, the Notorious B.I.G., Usher, Boyz II Men, Brandy, Babyface, Sting, Aretha Franklin, Brian McKnight, Donnie McClurkin, and others."
