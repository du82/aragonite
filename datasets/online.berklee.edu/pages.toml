["https://online.berklee.edu/about/leadership-team"]
title = "Leadership Team - Berklee Online"
description = "Leadership Team"
full_description = '''Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Debbie Cavalier was the co-founder of Berklee Online in 2002, and has been instrumental in transforming the online school of Berklee College of Music into a worldwide music education powerhouse. Under Debbie’s leadership, Berklee Online has achieved many landmark firsts in the world of online education: in 2013 it became the first online music school to offer MOOCs; in 2014 it became the first online music school to offer bachelor’s degrees; in 2017 it became the first school to offer an online bachelor’s degree in guitar; and in 2018 it became the first online music school to offer online master’s degree programs in music production and film scoring. Berklee Online boasts a 97 percent student satisfaction rate among its degree students, a benchmark that Debbie and her team have increased each year. Her dedication to music education is also reflected in the 100+ music education methods books and arrangements she has written for Carl Fischer, First Act, Alfred Publishing, and Warner Bros. Publications. She holds a Master's degree in Education from Cambridge College and continues to further her studies in music, business, and distance learning. Debbie also leads the children’s/family music group Debbie & Friends, and is a Grammy award-winning songwriter with her song entitled “Walk Away” which was featured on the 2011 Best Children’s album, All About Bullies. Known for their original cartoon music videos, Debbie & Friends has more than 22 million views on their YouTube channel, and growing. Debbie was a Director on AVID's ACA Executive Board from 2019 to 2022 and recently served on the UPCEA Board of Governors and the Boston Higher Education Innovation Council. In her spare time, Debbie is a volunteer musician with the “Musicians On Call” organization, singing Debbie & Friends songs bedside to brave young patients at Boston's "Floating Hospital for Children" at Tufts Medical Center.'''
year_published = 2025
