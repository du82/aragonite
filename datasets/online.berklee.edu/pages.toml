full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 If you have completed at least 30 credits in the Bachelor of Arts degree program, we strongly encourage that you supplement your learning with an internship that aligns with your career goals. You can earn three elective credits for your internship by completing the Internship in Music Entertainment course. Your internship should run during the semester in which you are enrolled in the course and involve a minimum of 200 work hours over 12 weeks, in addition to the work assigned in the course. Please note that it is imperative, as an intern, that you are enrolled in academic credits and/or receive a wage for your work per the US Department of Labor’s Fair Labor Standards Act (FSA). We recommend that you apply to 15-20 internship positions. We also recommend that you begin your internship search at the beginning of the semester prior to the semester in which you wish to intern. It may take a full 12 weeks to secure your internship. Any Bachelor of Arts degree student who has completed at least 30 credits in their program. The Internship Advisor will confirm your eligibility. The internship course is three credits and will usually satisfy a company's internship credit requirement. Most companies include the credit requirements in their internship postings. Yes, students may take the course more than once to extend their internship or undertake a different internship. The internship course is currently $515 per credit x 3 = $1,545—the same cost as other three-credit courses. Email advisors@online.berklee.edu with any additional questions you have, or call 1-866-BERKLEE ext. 1 (international students should call 1-617-747-2146 ext. 1). Take our online school for a test drive with our free sample course, featuring 12 lessons from our most popular courses. Founded in 2002, Berklee Onlin