title = "Enrolling in an Undergraduate Certificate Program - Berklee Online"
description = "Enrolling in an Undergraduate Certificate Program"
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Select the undergraduate certificate program that is right for you. Once you have selected the program, click on the “Enroll” button to proceed to the next step. Once you have paid your registration and technology fee, you will choose the courses you wish to take for your first semester. You will have the option to pay for your program in full at that time and save 10% off the total tuition, or only pay for your first semester. After you have completed this step, you can then move on to your “My Home” page and schedule the remainder of your courses as well as keep up to date with all of our latest news and curriculum offerings. Please note: Students are responsible for reviewing the course description, syllabus, and requirements for each course within the program before enrolling. By enrolling, the student accepts responsibility for reading, understanding, and conforming to all Berklee Online policies, procedures, and dates. For more information see Academic Policies. Students can enroll and participate in more than one certificate program. Students interested in enrolling in multiple programs with similar requirements should contact the Berklee Online Registrar’s Office at registrar@online.berklee.edu for approval prior to enrolling in the additional programs. Some limitations may apply based on the number of overlapping courses as well as the courses themselves. Substitution of courses will only be allowed if the substitution does not alter the academic integrity of the programs. Any course taken as a requirement or elective for one program cannot be used to fulfill an elective or requirement in a second program of the same or lower level. To enroll in more than one certificate program, visit online.berklee.edu and click on one of the certificate programs you are interested in pursuing and follow the steps outlined. After you have completed your initial enrollment you will click on the additional program you wish to pursue and again follow the steps outlined. Students will be required to pay the $175 registration and technology fee for each program they wish to enroll."
