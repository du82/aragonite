["https://online.berklee.edu/courses/culminating-experience-in-songwriting-2"]
title = "Culminating Experience in Songwriting 2 Course - Berklee Online"
description = "Culminating Experience in Songwriting 2 is the second of two intensive directed study courses focused on proposing and executing a portfolio of original material recorded at a professional level as well as a business and career plan. In this second phase, you will focus on creating market-ready final recordings and designing next steps in bringing your product to market."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 All Master of Arts in Songwriting students complete a culminating experience or thesis project. This experience is meant to be exactly as named: the culmination of your work in the program, the experience through which you synthesize all you have learned. The culminating experience helps to shape your next steps in the profession and in your career. In short, the culminating experience provides an opportunity for you to complete unique and original professional work. Through the culminating experience, you make a creative contribution to the profession and/or define and solve a problem that exists in the profession. Regardless of the form that the project takes, the culminating experience represents the highest expression of your learning at the graduate level. In this course, you will finalize the culminating experience for which you completed the proposal and began work in OSONG-693 Culminating Experience in Songwriting 1. You will spend the first half of the semester revising and putting the finishing touches on your project, based on the feedback you receive from your instructor. You will also learn some of the foundational principles of creating effective presentation materials and some crucial public speaking and presentation skills. You will draw on all of this material when you present your culminating experience project to your instructor and, if you opt for a live presentation, the other members of your graduating class. You may present your CE2 Final Project in one of two ways; present in a live web conference, or you can create a presentation video that you will post on a community board where all Culminating Experience 2 instructors and students can view and comment on your project. Finally, you will draft and complete the reflective essay that is a required piece of the final culminating experience, as well as prepare your project and essay for an optional archiving process."
