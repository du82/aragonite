title = "Online Undergraduate Degree Completion - Berklee Online"
description = "Learn more about Undergraduate Degree Completion for Online Undergraduate Music Degrees from Berklee Online."
full_description = '''Sheri Becker Alexander New Jersey, USA Guitar and Ukelele Instructor "I always regretted not finishing my Berklee degree, especially since I was short only one class. I came to realize there was nothing standing in my way, especially since I could complete my degree remotely. I can now finally say after 40 years, 'I have my degree from Berklee!'" Sheri's Story Started Berklee in 1975 as a Music composition major but a medical emergency in her last semester prevented her from completing her degree Led a rich musical career in New Jersey and New York City as a professional solo guitarist, singer and instructor Encouraged by an online Berklee instructor and Sheri's daughter who was attending Berklee at that time, Sheri returned to complete her Berklee degree Was able to complete her Bachelor of Music degree remotely by switching to the Professional Music Major Emma Thurston Massachusetts, USA "Even after two decades in an industry that I loved, I always dreamed of finishing what I started at Berklee, but it was never a practical choice until the Degree Completion Program through Berklee Online came along." Emma's Story Began her Berklee studies on campus in 1995 and completed 4 semesters as a Music Education major Left campus to raise her daughter and pursue a career in music retail Was able to apply previously completed coursework towards her degree in Interdisciplinary Studies at Berklee Online In 2019, while running a company, raising a family and continuing to play music, she graduated with her Bachelor's degree at last! Wilson Pierre Florida, USA "Berklee has helped me grow as a professional musician each day. I'm thankful for the faculty teaching strategy, the students, the staff, etc. It gives me a sense of purpose and it inspires me to develop my skills and be better at other things in life besides music too. I highly recommend this program if you are interested in taking your music journey to the next level." Wilson's Story Moved to Boston to attend campus in the Performance major in 2018 Had to leave campus before finishing his studies due to financial strain Returned to his campus degree remotely by switching to the Professional Music major Was able to maximize online and remote campus coursework from his completion plan to graduate with his Bachelor of Music degree!'''
