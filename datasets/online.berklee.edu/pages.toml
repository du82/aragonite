full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 We recognize that our students often have considerable previous learning, work, and life experiences in their chosen area of study. Through prior learning credit, you can earn up to 30 credits toward the Bachelor of Arts degree program. To be eligible for prior learning credits, you must be enrolled in our degree program. You will be asked to create a portfolio that describes and demonstrates how your previous learning equates to the learning outcomes of specific courses within the degree program. If your prior learning experiences cover multiple courses, you can submit all requested credit in a single portfolio. Introduction: Describe your background and professional experience. Briefly touch on areas such as your training, personal life, volunteer experiences, military service, or career. Introduce the course(s) for which you will be seeking credit. The introduction should be no more than one page long. Learning Outcomes: For each course, list each learning outcome and provide supporting information on how you have mastered it. You can include a mix of your experiences and training. Note that academic credit will not be awarded for simply stating your experience, but showing what you have learned as it relates to the learning outcomes of the course(s). Use the following questions as a guide to describe your learning for each outcome: The deadline for submitting your portfolio is Sunday of the third week of each semester. Your portfolio will be reviewed by the Prior Learning Committee, which consists of the Associate Dean and faculty members. Once your portfolio has been submitted and reviewed, any changes you wish to make to the coursework you are seeking credit for or the supplementary documentation provided will be at the Committee’s discretion. You will receive notification of awarded credits during week six of the semester. If you have any questions regarding the prior learning evaluation process, please reach out to priorlearning@online.berklee.edu."
