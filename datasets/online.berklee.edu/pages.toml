title = "Compositional Approaches to Film Scoring Graduate Certificate - Berklee Online"
description = "Train to think like a filmmaker and cultivate the critical thought to create artful and commercially viable film scores. Through the courses in this graduate certificate program, you’ll learn to balance original artistic expression with filmmakers’ visions. You’ll analyze, compose, and stylistically adapt scores for film, and study the dimensions of music that you can employ to support a film, whether it’s the narrative structure, setting, or the lives of the characters on the screen."
