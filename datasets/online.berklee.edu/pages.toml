["https://online.berklee.edu/courses/music-video-production"]
title = "Music Video Production Course - Berklee Online"
description = "In this course you’ll acquire the skills to produce high-quality music videos that tell the story of a song in a visually compelling way."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 At their best, music videos are mini movies that visually capture the emotional context of a song and can even expand on the story of the song’s lyrics. In this course you’ll acquire the skills to produce high-quality music videos that tell the story of a song in a visually compelling way. Through the use of standard movie-production teams, schedules, lighting, camera, and post-production techniques, you’ll gain real-world experience on video productions before applying these techniques in your own productions. The class experience includes analysis of music video examples, hands-on practice in standard film roles, technical exercises with cameras and software, and creative experiments with innovative filming and post-production techniques. Prerequisite Courses, Knowledge, and/or Skills Students should have a basic knowledge of video editing and be able to: Student Deals After enrolling, be sure to check out our Student Deals page for various offers on software, hardware, and more. Please contact support@online.berklee.edu with any questions. Below are the minimum requirements to access the course environment and participate in Live Classes. Please make sure to also check the Prerequisites and Course-Specific Requirements section above, and ensure your computer meets or exceeds the minimum system requirements for all software needed for your course. Simon C.F. Yu is a New York City-based director, editor, photographer, and musician who has produced hundreds of videos for musicians since 2010. His passion for music and video began early, as he was born into a family of musicians and film directors in Hong Kong. This early immersion in art inspired him to become a specialist working in both fields. As a musician, he has toured with hip-hop legend Lauryn Hill as lead guitarist, performed with well-known Chinese artist Eric Mo, led his own band—the Exotic Experiment and r.O.T.i.—released three albums and performed around the world. As a filmmaker, he has worked with Grammy-winning artists Snarky Puppy, Terri Lyne Carrington, Steven Feifke, and many more on their music videos. Simon also directed and edited Rock and Roll Hall of Famer David Crosby’s Lighthouse Band Live at The Capitol Theater DVD. His work has been seen on networks like HBO Latino, and shows like The Late Show with Stephen Colbert, Late Night With Seth Meyers, and NYC Life."
