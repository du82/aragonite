description = "Learn more about Graduate Degree Tuition & Financial Aid for Online Graduate Music Degrees from Berklee Online."
full_description = "Manage Your Stress with Music This Masterclass will introduce you to strategies that will help you soothe, motivate, and modulate your feelings. Wed., March 5, only $99 Students are encouraged to contact One Stop Student Services with any questions they may have regarding financial aid at 1-617-747-6777 or onestop@berklee.edu. The cost of attendance comprises charges billed directly to the student by Berklee Online as well as indirect costs that go along with attending school. For students receiving financial aid, the total cost of attendance reflects the maximum amount you can receive in scholarships, grants, and loans. ** Film Scoring course fee applied to OCOMP-599, OCOMP-637, OCOMP-693, and OCOMP-695. The $750 fee for OCOMP-599 and OCOMP-637 will cover the cost for students to have their scores performed by a live orchestra. The $500 fee for OCOMP-693 and OCOMP-695 will cover the cost of the one-on-one instruction provided in these courses. * Songwriting course fee is applied to OSONG-693 and OSONG-695 and will cover the cost of the one-on-one instruction provided in these courses. There is a $150 late payment fee assessed per semester by the finance department for all payments submitted after the tuition due date. Due dates can be found at https://online.berklee.edu/degrees/about/graduate-degree-academic-calendar. The one-time comprehensive fee is a one-time fee charged to all entering students. The fee is assessed to cover costs associated with supporting online learning technology that augments the students’ academic experience. As a courtesy to our degree students, we offer a flexible payment plan each semester through our partner Nelnet Campus Commerce (Nelnet). This plan allows students and families to pay their tuition and fees in smaller installments. The plan requires a $25 enrollment fee and a deposit of one-third of the payment plan balance upon enrollment as well as automatic payments for subsequent installments. Berklee Online graduate degree students who are US citizens or eligible noncitizens are strongly encouraged to apply for federal financial aid by submitting the Free Application for Federal Student Aid (FAFSA). The FAFSA is an online application used to determine your eligibility for federal student aid, including federal grants, loans, and some state funds."
