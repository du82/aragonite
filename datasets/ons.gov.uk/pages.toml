["https://ons.gov.uk/economy/nationalaccounts/balanceofpayments/bulletins/uktrade/december2024"]
title = "UK trade - Office for National Statistics"
description = "Total value of UK exports and imports of goods and services by current price, chained volume measures and implied deflators."
full_description = '''1. Main points The value of goods imports decreased by £1.2 billion (2.6%) in December 2024, because of a fall in both EU and non-EU imports. The value of goods exports remained stable in December 2024, with a rise in exports to non-EU countries offset by a fall in exports to the EU. The total goods and services trade deficit widened by £4.2 billion to £10.0 billion in Quarter 4 (Oct to Dec) 2024, because imports increased while exports decreased. The trade in goods deficit widened by £3.7 billion to £53.8 billion in Quarter 4 (Oct to Dec) 2024, while the trade in services surplus is estimated to have narrowed by around £0.5 billion to £43.8 billion. Total imports of goods and services fell by £7.9 billion (0.9%) in 2024, while annual total exports rose by £6.1 billion (0.7%), which saw the total annual trade balance narrow by £14.0 billion to a deficit of £25.1 billion. ! Please note that all trade figures exclude non-monetary gold (NMG) and other precious metals unless otherwise stated. This is because movements in NMG, an important component of precious metals, can be large and highly volatile, distorting underlying trends in goods exports and imports. Trade statistics in this bulletin are in value terms (current prices) not inflation-adjusted terms (chained volume measures) unless otherwise stated. HMRC data feed noticeHis Majesty's Revenue and Customs (HMRC) is an important supplier for detailed trade data. There are differences in scope and coverage of trade data between HMRC and Office for National Statistics (ONS) publications.During our routine quality assurance, an error was identified in the data that HMRC delivered to us relating to the January 2023 reference period onwards. HMRC has identified and resolved the cause of the error in the data feed and we have worked together to investigate its impact, with the extraction error predominantly affecting non-EU countries, particularly goods imports from China and Japan. There is minimal impact to United States goods imports data.We are currently undertaking further processing and working towards correcting the data feeding into UK trade estimates in the Balance of Payments and Quarterly National Accounts releases publishing on 28 March 2025 and the UK Trade release publishing on 11 April 2025. This is the earliest practical opportunity in line with the National Accounts Revision Policy.Preliminary investigations suggest that when the correction is made, there will be a level shift in trade in goods imports data. It is expected that this will have minimal impact on quarterly GDP growth rates but needs to be considered alongside any standard revisions to other components of GDP.Caution is advised when using imports data. Preliminary indicative estimates of this impact are available in Table 4 in Section 14: Data sources and quality. As these are indicative impacts, which we are still working through our systems, we would recommend users continue to use the headline trade figures included in this release. Back to table of contents 2. Monthly trade in goods The value of total imports of goods in "current prices", which are not adjusted for inflation (as explained in Section 13: Glossary), fell by £1.2 billion (2.6%) in December 2024. Imports from the EU decreased by £0.8 billion (3.3%), while imports from non-EU countries fell by £0.4 billion (1.8%) (Table 1 and Figure 1).Total exports of goods remained stable in December 2024, as a £0.5 billion (3.5%) rise in exports to non-EU countries was offset by a £0.5 billion (3.6%) fall in exports to the EU.Imports from the EU were £4.2 billion higher than from non-EU countries in December 2024, while exports to the EU were £1.5 billion lower than to non-EU countries. Table 1: Total imports of goods fell while exports remained stable in December 2024 Monthly UK trade in goods, excluding precious metals, current prices, seasonally adjusted, EU and non-EU ExportsImportsBalance Total trade in goods: December 2024 vs November 2024Value (£bn)28.845.7-16.9 Change (£bn)0.0-1.21.2 % Change0.0-2.6 EU: December 2024 vs November 2024Value (£bn)13.624.9-11.3 Change (£bn)-0.5-0.80.3 % Change-3.6-3.3 Non-EU: December 2024 vs November 2024Value (£bn)15.220.8-5.6 Change (£bn)0.5-0.40.9 % Change3.5-1.8 Source: UK trade statistics from the Office for National Statistics Download this table Table 1: Total imports of goods fell while exports remained stable in December 2024 .xls .csv Figure 1: The increase in exports to non-EU countries was offset by a decrease in exports to the EUEU and non-EU goods imports and exports, excluding precious metals, current prices, seasonally adjusted, December 2021 to December 2024 Embed code Embed this interactive Copy After removing the effect of inflation by calculating "chained volume measures" (explained in Section 13: Glossary), total goods imports decreased by £1.5 billion (3.0%) in December 2024 (Figure 2). This decrease was primarily because of a £0.9 billion (3.5%) fall in imports from the EU, while imports from non-EU countries fell by £0.6 billion (2.5%).Total goods exports decreased by £0.1 billion (0.3%) in December 2024, after the effect of inflation was removed. This was because exports to the EU decreased by £0.6 billion (3.9%), mostly offset by a £0.5 billion (3.3%) increase in exports to non-EU countries.Figure 2: Imports of goods from both EU and non-EU countries fell in value and inflation adjusted terms in December 2024Imports and exports of goods, excluding precious metals, current prices (CP) and chained volume measures (CVM), seasonally adjusted, EU and non-EU, December 2021 to December 2024 Embed code Embed this interactive Copy Back to table of contents 3. Monthly trade in goods by commodity Goods importsThe value of imports from the EU decreased by £0.8 billion (3.3%) in December 2024. This was because of a £0.5 billion fall in imports of machinery and transport equipment, and £0.2 billion falls in imports of both material manufactures and miscellaneous manufactures (Figure 3). The fall in imports of machinery and transport equipment was because of reduced imports of cars from Germany, and the falls in material manufactures and miscellaneous manufactures were because of small falls from multiple countries and commodities.The value of imports from non-EU countries decreased by £0.4 billion (1.8%) in December 2024. This fall was primarily because of a £0.4 billion decrease in imports of material manufactures, with reduced imports from China and Switzerland. There were also small falls of £0.1 billion in imports of both food and live animals and miscellaneous manufactures. These falls were partially offset by a £0.2 billion rise in fuel imports, driven by increased imports of gas, refined oil and crude oil from the United States.Figure 3: Imports of machinery and transport equipment from the EU fell in December 2024, following an increase the previous monthEU and non-EU goods imports by commodity, current prices, seasonally adjusted, December 2022 to December 2024 Embed code Embed this interactive Copy Goods exportsThe value of exports to the EU decreased by £0.5 billion (3.6%) in December 2024. This was the result of a £0.4 billion fall in exports of machinery and transport equipment and small falls in exports of most other commodities. The decrease in machinery and transport equipment was because of reduced exports of mechanical power generators to Germany and France (Figure 4).The value of exports to non-EU countries increased by £0.5 billion (3.5%) in December 2024, because of a £0.4 billion rise in exports of material manufactures and a £0.3 billion rise in chemicals exports. These rises were both linked to increased exports to the United States, with the rise in chemical exports the results of increased exports of medicinal and pharmaceutical products and organic chemicals. These rises were partially offset by a £0.2 billion fall in exports of machinery and transport equipment, driven by reduced exports of cars to the United States.Following the United States presidential election in November 2024, President Donald Trump has announced plans to apply tariffs on goods imports to the United States. Exports of goods to the United States rose by £0.5 billion (10.7%) in December 2024, the first full month of trade data following the election. This could potentially be an indicator of traders adapting their behaviour ahead of any tariffs being implemented, however it is important to note that monthly data can be erratic, so movements should be treated with caution. We published our UK trade with the United States article in January 2025, and will continue to monitor trends in future releases.Figure 4: Exports to the EU fell while exports to non-EU countries rose in December 2024EU and non-EU goods exports by commodity, current prices, seasonally adjusted, December 2022 to December 2024 Embed code Embed this interactive Copy Back to table of contents 4. Monthly trade in services Early estimates suggest that imports of services increased by £0.4 billion (1.5%) in value terms in December 2024, while exports of services increased by around £0.5 billion (1.2%) (Figure 5). There was little difference between trade in services trends in value and inflation-adjusted terms in December 2024. After removing the effect of inflation, imports of services increased by £0.4 billion (1.5%), while exports of services increased by £0.4 billion (1.2%).Monthly figures for trade in services for December 2024 are estimated from Quarter 4 (Oct to Dec) 2024 data, using additional data sources. Our UK Trade Quality and Methodology Information (QMI) has more detail on how our trade in services statistics are compiled.The S&P Global UK Services PMI for December recorded marginal rises in business activity across the services sector. However, business confidence fell to a two-year low, because of concerns over the outlook for sales alongside rising costs, specifically the increase in staffing costs associated with the policy changes announced in the budget. There was a notable increase in inflationary pressures in services, with the latest rise in prices noted as the steepest recorded since March 2024.Figure 5: Imports and exports of services are estimated to have increased in both value and inflation adjusted terms in December 2024Imports and exports of services, current prices (CP) and chained volume measures (CVM), seasonally adjusted, December 2021 to December 2024 Embed code Embed this interactive Copy Notes: Monthly figures for trade in services for December 2024 are estimated from Quarter 4 (Oct to Dec) 2024 data, using additional data sources. Early estimates of trade in services are revised in line with the National Accounts Revisions Policy. Back to table of contents 5. Quarterly trade in goods and services Total imports of goods increased by £0.5 billion (0.4%) in Quarter 4 (Oct to Dec) 2024, compared with Quarter 3 (July to Sept) 2024 (Table 2). Goods imports from the EU increased by £0.3 billion (0.3%), and goods imports from non-EU countries rose by £0.2 billion (0.4%).Exports of goods decreased by £3.2 billion (3.5%) in Quarter 4 2024. This fall was primarily because goods exports to non-EU countries decreased by £2.1 billion (4.5%), while goods exports to the EU decreased by £1.1 billion (2.5%).Early estimates indicate that imports of services increased by around £2.3 billion (3.2%) in Quarter 4 2024, compared with Quarter 3 2024, while exports of services rose by an estimated £1.8 billion (1.5%). Table 2: Total imports increased while exports decreased in Quarter 4 (Oct to Dec) 2024 Three monthly UK trade, excluding precious metals, current prices, seasonally adjusted, EU and non-EU ExportsImportsBalance Total trade: Quarter 4 (Oct to Dec) 2024 vs Quarter 3 (July to Sept) 2024Value (£bn)206.3216.2-10.0 Change (£bn)-1.32.8-4.2 % Change-0.61.3 Total trade in goods: Quarter 4 (Oct to Dec) 2024 vs Quarter 3 (July to Sept) 2024Value (£bn)86.4140.1-53.8 Change (£bn)-3.20.5-3.7 % Change-3.50.4 Total trade in goods, EU: Quarter 4 (Oct to Dec) 2024 vs Quarter 3 (July to Sept) 2024Value (£bn)42.176.7-34.6 Change (£bn)-1.10.3-1.4 % Change-2.50.3 Total trade in goods, non-EU: Quarter 4 (Oct to Dec) 2024 vs Quarter 3 (July to Sept) 2024Value (£bn)44.263.4-19.2 Change (£bn)-2.10.2-2.3 % Change-4.50.4 Total trade in services: Quarter 4 (Oct to Dec) 2024 vs Quarter 3 (July to Sept) 2024Value (£bn)119.976.143.8 Change (£bn)1.82.3-0.5 % Change1.53.2 Source: UK trade statistics from Office for National Statistics Download this table Table 2: Total imports increased while exports decreased in Quarter 4 (Oct to Dec) 2024 .xls .csv Back to table of contents 6. Quarterly trade in goods by commodity Goods importsImports of goods from the EU increased by £0.3 billion (0.3%) in Quarter 4 (Oct to Dec) 2024 compared with Quarter 3 (July to Sept) 2024. This increase was because of £0.4 billion rise in chemicals, and small increases of £0.1 billion in imports of food and live animals and crude materials. This was partially offset by a £0.3 billion fall in fuel imports. (Figure 6).The rise in chemicals was because of increased imports of medicinal and pharmaceutical products from Italy, while the fall in fuels was because of reduced imports of refined oil from the Netherlands.Imports from non-EU countries increased by £0.2 billion (0.4%) in Quarter 4 2024, because of rises of £0.5 billion in imports of miscellaneous manufactures and fuels, and a £0.3 billion rise in food and live animals. This was offset by a £1.1 billion fall in imports of machinery and transport equipment.The rise in miscellaneous manufactures was because of small changes across multiple countries and commodities and the rise in fuels was mainly because of increased imports of gas from Norway and the United States. The fall in machinery and transport equipment was because of decreased imports of aircraft from the United States.Goods exportsExports to the EU decreased by £1.1 billion (2.5%) in Quarter 4 2024, because of a £0.7 billion fall in exports of machinery and transport equipment, a £0.3 billion fall in fuel exports and a £0.2 billion fall in chemical exports.The decrease in machinery and transport equipment was because of small changes across multiple countries and commodities, and the decrease in fuels was because of reduced exports of gas to Belgium.Exports to non-EU countries decreased by £2.1 billion (4.5%) in Quarter 4 2024, largely because of a £1.2 billion fall in exports of machinery and transport equipment and a £0.7 billion fall in material manufactures. There were also falls of £0.2 billion in fuel and chemical exports.The fall in machinery and transport equipment was because of reduced exports of cars to China, and the fall in material manufactures was because of reduced exports to India.Figure 6: Exports of machinery and transport equipment from both the EU and non-EU countries fell in Quarter 4 2024Changes in imports and exports by g'''
