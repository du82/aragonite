title = "Who does the UK trade with? - Office for National Statistics"
description = "Total value of UK exports and imports of goods and services in current prices, chained volume measures and implied deflators."
full_description = 'The start of trade negotiations between the UK and the EU moved a step closer in December.The UK Government set out its strategy for trade policy after Brexit in a paper published in October, which goes beyond trade with the EU and its 27 member countries.In addition, since the referendum in June 2016, the government has signalled it is looking to strengthen ties with countries outside the EU like China, India, the United States, Australia and New Zealand.But what do we know about our current trade with the world?Explore the trade relationship between the UK and the rest of the world in our interactive map.UK trade with the rest of the world, imports and exports, 1999 to 2016 Embed code Embed this interactive Copy Download the dataThe EU remains an important UK trade partnerBeing a member of the EU allows the UK to trade freely with 27 other countries. In 2016, the EU1 accounted for 48% of goods exports from the UK, while goods imports from the EU were worth more than imports from the rest of the world combined.But the share of UK exports of goods and services going to the EU has fallen, from 54% in 2000 to 43% in 2016.Most of the decline in the EU’s share of UK exports is due to goods, not services. However, when comparing UK goods trade with EU and non-EU countries, trade in gold (excluding gold held as reserves by the Bank of England) can have a large impact2.How much does the UK trade with the EU and the rest of the world?UK Imports, 2016 Embed code Embed this interactive Copy Download the dataUK Exports, 2016 Embed code Embed this interactive Copy Download the dataAlmost half (48%) of UK goods exports went to the EU in 2016. UK goods exports to the EU were worth £145 billion in 2016, or 7.4% of GDP.Motor vehicles and parts is the largest product group by value of exports: the UK exported £18 billion of motor vehicles (and trailers) to the EU in 2016. The next largest product group exported to the EU is chemicals and chemical products, £15 billion in 2016.Meanwhile, 37% of UK service exports went to the EU in 2016, down from 40% in 2015. Financial services contributed more than a quarter of the UK’s services exports to the EU (£27 billion out of £90 billion).Love thy neighbour?UK trade relationships are usually stronger with neighbouring countries, as well as countries with large economies. China and the US are large economies and important UK trading partners, even accounting for their distance from us.However, distance is important. The value of the UK’s trading relationship with Ireland is higher than the value of UK trade with Italy or Spain, even though the total size of Ireland’s economy is much smaller than Italy’s or Spain’s.How does geography impact UK exports and imports to the rest of the world?UK Exports by distance from UK, 2016 Embed code Embed this interactive Copy Download the dataUK Imports by distance from UK, 2016 Embed code Embed this interactive Copy Download the dataThe UK runs a trade deficit (we import more than we export) with the biggest economies of the European Union.The UK has a trade surplus (we export more than we import) with 67 territories, including Ireland, Switzerland, the United Arab Emirates, Saudi Arabia, Australia and Brazil.UK trade deficit and surplus by country, 2016 Embed code Embed this interactive Copy Download the dataNotes: The downloadable data relating to this figure, UK trade deficit and surplus by country, 2016 was incorrectly linked to the previous figure. This has now been corrected, the figure and everything else in this release has not been affected. The largest trade deficit is with Germany. In 2016 the UK imported £75 billion in goods and services from Germany, and sold £49 billion.Although the UK has a trade deficit with Germany, France and the Netherlands3, they are the second, third and fourth most important destinations for UK exports."Special relationship" with the USThe US is the country from which the UK earns the most through trade. Exports to the US in 2016 were worth £100 billion, more than twice as much as exports to any other country.With imports from the US totalling £66 billion, the UK ran a trade surplus with the US of £34 billion in 2016 (by far the highest globally)4.While the value of UK exports to the EU has fallen between 2011 and 2016 (from £243 billion to £236 billion), the UK is increasingly exporting to the US. Exports to the US rose by more than 26% over the same period.That being said, as a union of 27 other countries, the EU still had a much greater share of UK exports than the US in 2016 (43% compared with 18%). A report in the FT showed how for almost every category of goods exported, the EU was by far a bigger market than the US.Our trade relationship with the US has strengthened in recent yearsUK trade with the US and rest of the world, imports and exports, 1999 to 2016 Embed code Embed this interactive Copy Download the dataSign up for email alertsIf you like our Visual.ONS content and would like to see more, please sign up to our email alerts, selecting ‘stories and infographics’ under preferences.Footnotes Croatia joined the EU in 2013. In 2000 and 2001 data are for non-UK EU26 and from 2002 onwards data are for non-UK EU 27 Gold is an erratic commodity, so trade in gold is often highly volatile. We’re currently looking at ways to publish additional trade statistics that exclude non-monetary gold. The Rotterdam effect: It has been argued that the pattern of trade between the UK and other countries has been distorted by the location of big international ports such as Rotterdam. The Rotterdam effect is the situation where goods which are initially exported to one country are then re-exported somewhere else. An ONS article estimated that 50 per cent of all goods exported to the Netherlands were re-exported to non-EU countries. It also estimated that the Rotterdam effect would account for around four percentage points of the UK’s exports of goods. These effects were calculated to illustrate the possible size of the Rotterdam effect and does not imply that a different data series should be produced or used. In their official statistics, the US reports a trade surplus with the UK. Countries reporting different trade balances with each other is a well known international phenomenon, which affects all countries. There are multiple reasons such as measurement differences, conceptual differences and different data sources. We have conducted some analysis of the UK’s trade asymmetries, engaged in bilateral meetings with other National Statistical Institutes (NSIs) to understand some of the potential reasons for differences and we are working with an academic to develop possible models that might lead to improvements. This will be an area of ongoing focus within our development plan'
