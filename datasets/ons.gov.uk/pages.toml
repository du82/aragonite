["https://ons.gov.uk/economy"]
title = "Economy - Office for National Statistics"
description = "UK economic activity covering production, distribution, consumption, and trade of goods and services. Individuals, businesses, organisations and governments all affect the development of the economy."
full_description = "Economy UK economic activity covering production, distribution, consumption, and trade of goods and services. Individuals, businesses, organisations and governments all affect the development of the economy. Highlighted content Understanding the UK economy In this section Economic output and productivity Manufacturing, production and services indices (measuring total economic output) and productivity (measuring efficiency). Environmental accounts How the environment contributes to the economy, the impact that the economy has on the environment, and how society responds to environmental issues. This page also hosts the development of natural capital accounts. Government, public sector and taxes How the relationship between UK public sector income and expenditure leads to changes in deficit and debt. Gross Domestic Product (GDP) Gross domestic product (GDP) estimates are the main measure of UK economic growth based on the value of goods and services produced during a given period. GDP estimates are produced monthly, quarterly and annually as part of the revisions cycle to ensure the timely release of data throughout the year. Our GDP monthly estimate consists of output data and is our most timely official estimate of economic growth. The two publication stages for quarterly estimates are our GDP first quarterly estimate and our quarterly national accounts, which include data on output, expenditure and income. Gross Value Added (GVA) Estimates of regional gross value added (GVA), which is the value generated by any unit engaged in the production of goods and services. Figures available for local authorities and NUTS regions. Inflation and price indices The rate of inflation is the change in prices for goods and services over time. Measures of inflation and prices include consumer price inflation, producer price inflation and the House Price Index. Investments, pensions and trusts Net flows of investment into the UK, the number of people who hold pensions of different types, and investments made by various types of trusts. National accounts The national accounts framework brings units and transactions together to provide a simple and understandable description of production, income, consumption, accumulation, and wealth. Regional accounts Accounts for regions, sub-regions and local areas of the UK, allowing comparisons between regions and against a UK average. Including regional gross value added (GVA) and regional gross disposable household income. Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
year_published = 2025
clearnet = "https://ons.gov.uk/economy"
