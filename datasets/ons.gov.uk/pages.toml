title = "International trade - Office for National Statistics"
description = "Trade in goods and services across the UK's international borders, including total imports and exports, the types of goods and services traded and general trends in international trade."
full_description = '''International trade Trade in goods and services across the UK's international borders, including total imports and exports, the types of goods and services traded and general trends in international trade. On this page: Time series Dataset Publications Methodology View all content related to this topic: All data All publications Spotlight <![endif]--> <img class="img-sparkline js--hide" src="/economy/nationalaccounts/balanceofpayments/timeseries/ikbj/mret/sparklineimage" alt="Total Trade (TT): WW: Balance: BOP: CP: SA between 1997 JAN and 2024 DEC "> <!--[if gt IE 8]><!--> Total Trade (TT): WW: Balance: BOP: CP: SA £ -2,816 m 2024 DEC Release date: 13 February 2025 Next release: 14 March 2025 View this data More data International trade in UK nations, regions and cities: 2022 What's in the bulletin? In 2022, the UK total trade deficit was driven by a deficit in England, despite there being a surplus in Wales, Scotland and Northern Ireland. The total trade balance in England decreased substantially from 2021 to 2022 by £61.9 billion to a deficit of £40.3 billion, driven by increased trade in goods imports to the South East. The value of services exports from London was higher than any UK region in 2022. Read this statistical bulletin More publications UK services trade by business characteristics Breakdown of UK trade in services by business characteristics (size and ownership), industry and region, on a balance of payments basis using a new experimental dataset. Back to top Time series related to International trade Total Trade (TT): WW: Balance: BOP: CP: SA <![endif]--> <img class="img-sparkline js--hide" src="/economy/nationalaccounts/balanceofpayments/timeseries/ikbj/pnbp/sparklineimage" alt="Total Trade (TT): WW: Balance: BOP: CP: SA between 1955 Q1 and 2024 Q3 "> <!--[if gt IE 8]><!--> £ -4,869 m 2024 Q3 Release date: 23 December 2024 Next release: 28 March 2025 Total Trade (TT): WW: Imports: BOP: CP: SA <![endif]--> <img class="img-sparkline js--hide" src="/economy/nationalaccounts/balanceofpayments/timeseries/ikbi/pnbp/sparklineimage" alt="Total Trade (TT): WW: Imports: BOP: CP: SA between 1955 Q1 and 2024 Q3 "> <!--[if gt IE 8]><!--> £ 213,915 m 2024 Q3 Release date: 23 December 2024 Next release: 28 March 2025 Total Trade (TT): WW: Exports: BOP: CP: SA <![endif]--> <img class="img-sparkline js--hide" src="/economy/nationalaccounts/balanceofpayments/timeseries/ikbh/pnbp/sparklineimage" alt="Total Trade (TT): WW: Exports: BOP: CP: SA between 1955 Q1 and 2024 Q3 "> <!--[if gt IE 8]><!--> £ 209,046 m 2024 Q3 Release date: 23 December 2024 Next release: 28 March 2025 Trade in Goods (T): EU: Balance: BOP: CP: SA <![endif]--> <img class="img-sparkline js--hide" src="/economy/nationalaccounts/balanceofpayments/timeseries/l87q/qna/sparklineimage" alt="Trade in Goods (T): EU: Balance: BOP: CP: SA between 1997 Q1 and 2024 Q3 "> <!--[if gt IE 8]><!--> -33,545 2024 Q3 Release date: 23 December 2024 Next release: 13 February 2025 Trade in Goods: EMU(19): Balance: BOP: CP: SA <![endif]--> <img class="img-sparkline js--hide" src="/economy/nationalaccounts/balanceofpayments/timeseries/n3c4/mret/sparklineimage" alt="Trade in Goods: EMU(19): Balance: BOP: CP: SA between 1997 JAN and 2024 DEC "> <!--[if gt IE 8]><!--> £ -9,687 m 2024 DEC Release date: 13 February 2025 Next release: 14 March 2025 Trade in Goods (T): Non-EU: Balance: BOP: CP: SA <![endif]--> <img class="img-sparkline js--hide" src="/economy/nationalaccounts/balanceofpayments/timeseries/l87k/qna/sparklineimage" alt="Trade in Goods (T): Non-EU: Balance: BOP: CP: SA between 1997 Q1 and 2024 Q3 "> <!--[if gt IE 8]><!--> -15,688 2024 Q3 Release date: 23 December 2024 Next release: 13 February 2025 View all time series related to International trade Back to top Datasets related to International trade International trade in services Detailed breakdown of annual trade in UK services estimates, analysed by country, product and industry. UK trade in goods by classification of product by activity time series Quarterly and annual time series of the value of UK imports and exports of goods grouped by product. Goods are attributed to the activity of which they are the principal products. UK trade time series Monthly value of UK exports and imports of goods and services by current price, chained volume measures and implied deflators. UK Balance of Payments – The Pink Book time series Annual time series data for the UK Balance of Payments. Balance of payments time series Quarterly summary of balance of payments accounts including the current account, capital transfers, transactions and levels of UK external assets and liabilities. Trade in goods: all countries, seasonally adjusted The annual, quarterly and monthly goods export and import figures for all countries with the UK. View all datasets related to International trade Back to top Publications related to International trade Statistical bulletins International trade in UK nations, regions and cities: 2022 Estimated value of exports and imports of goods and services for 2022 for International Territory Levels 1, 2 and 3, and city regions. Includes EU and non-EU split along with data for top 20 partner countries. These are official statistics in development. Ship crossings through global maritime passages: January 2022 to April 2024 Estimates of the volume of maritime crossings through six global maritime passages between January 2022 and April 2024, broken down by ship type. The analysed passages are: the Strait of Dover, Suez Canal, Bab-Al Mandab Strait, Strait of Hormuz, Cape of Good Hope and Taiwan Strait. These are official statistics in development. UK trade: December 2024 Total value of UK exports and imports of goods and services in current prices, chained volume measures and implied deflators. UK Trade in Goods by Classification of Product by Activity CPA(08): Quarter 2 (April to June) 2015 The value of UK exports and imports of goods grouped by industry. Goods are attributed to the industry of which they are the principal products. International trade in services, UK: 2018 Product, industry and geographical annual breakdowns of imports and exports of services, excluding travel, transport and banking sectors. View all related statistical bulletins Articles Recent trends in UK trade volumes and balances Analysis of recent trends in UK trade volumes and balances. Who does the UK trade with? Explore the UK's trade relationships through interactive maps, charts and analysis. View all related articles Back to top Methodology related to International trade International trade in services QMI View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom.'''
