description = "Quarterly and annual time series of the value of UK imports and exports of goods grouped by product. Goods are attributed to the activity of which they are the principal products."
full_description = "Dataset UK trade in goods by classification of product by activity time series Notice 13 February 2025 During the ONS’s routine quality assurance, an error was identified in the data that HMRC delivered to the ONS relating to the Jan 2023 reference period onwards. The ONS is currently undertaking further processing and working towards correcting the data feeding into UK trade estimates in Balance of Payments and Quarterly National Accounts releases scheduled for 28 March 2025 and the UK trade release scheduled for 11 April 2025, the earliest practical opportunity in line with the National Accounts Revisions Policy. Further information can be found in our UK trade statistical bulletin. Users are advised to exercise caution when using imports data. Preliminary indicative estimates of this impact are available in Table 4 in the UK trade statistical bulletin. As these are indicative impacts, which we are still working through our systems, we would recommend users continue to use the headline trade figures included in this release. Contact: UK Trade team Release date: 13 February 2025 Next release: 11 April 2025 Dataset ID: MQ10 About this Dataset Quarterly and annual time series of the value of UK imports and exports of goods grouped by product. Goods are attributed to the activity of which they are the principal products. Edition in this dataset csv (3.6 MB) xlsx (2.7 MB) structured text (7.0 MB) Previous versions of this data are available. View all data related to International trade Contact details for this dataset UK Trade team trade@ons.gov.uk"
