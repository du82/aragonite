title = "People Matters - Office for National Statistics"
full_description = "As the UK’s largest producer of official statistics, the work that we do and the data we publish make a real difference. We’re responsible for sharing data and analysis about some of the most important issues facing the UK. When you join the Office for National Statistics (ONS), you’re starting a career that counts.We know that we can only deliver this important work by employing the right people and supporting our colleagues. That’s why we’ve built a brilliant place to work where you will have everything you need to be your best.Our people priorities include activity to continue to strengthen all that we do to attract, develop, retain, support and reward our people so that together we can successfully deliver our strategic outcomes.You can view our People Survey scores and Gender Pay Gap reports also.We are very proud to have been recognised externally, with awards and accreditations including: Glassdoor’s Best Employer for Work Life Balance award; won two years in a row “Mature” (highest rating) across all four pillars of the Smarter Working Maturity Assessment Gold for the ONS Customer Contact Centre at the Welsh Customer Contact Centre for best “In House Contact Centre” “Highly commended” in the Civil Service Commission “Mark of Excellence” awards for the inclusion initiatives we have built into our recruitment processes Glassdoor Employees’ Choice Awards, 21st in the UK’s Top 50 Best Places to Work 2023 renewal of our Disability Confident Leader status until 2026 received the overarching ‘Beyond Smarter Working’ award at Smarter Working Live You can find out more about working at the Office for National Statistics by visiting our careers site."
