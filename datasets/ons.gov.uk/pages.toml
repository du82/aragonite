["https://ons.gov.uk/economy/economicoutputandproductivity/productivitymeasures/articles/productivityintheconstructionindustryuk2021/2021-10-19"]
title = "Productivity in the construction industry, UK - Office for National Statistics"
description = "An investigation into productivity growth and its drivers for the UK construction industry."
full_description = '''1. Main points Average productivity levels in the construction industry have remained consistently below the UK average and have grown more slowly until recently. Civil engineering has consistently been the most productive sub-industry within construction; specialised construction activities has been the least productive. The construction industry's workforce has become older and better educated since 1997. There has been strong investment growth relative to the number of workers in the industry, outpacing investment per hour worked in the rest of the market sector. A greater proportion of the construction industry's expenditure on goods and services has moved towards purchasing services and away from purchasing materials. Back to table of contents 2. Productivity industry spotlight articles Understanding the level and growth of productivity in an industry is necessary to understand its competitiveness, growth potential and contribution to the economy. This is especially true for construction, which has long been thought to have a lower level of productivity than comparable industries, and slower growth in productivity relative to the rest of the economy.Those views are supported by considerable research and official data. Official estimates of the productivity of the construction industry are produced by the Office for National Statistics (ONS). Like other official economic statistics, the definition of the industry is governed by the Standard Industrial Classification (SIC) 2007, and the measurement of the industry's output follows international guidance (see Section 12).This article is the first in a new series of productivity industry spotlight articles, which aim to examine productivity and related data for an industry, in order to tell the productivity story of the industry and identify opportunities to improve our statistics. Back to table of contents 3. Productivity Productivity in the construction industry dragged down both the level and growth of UK productivity for many years prior to the 2008 financial crisis (Figure 1). Since then, labour productivity has grown slightly faster in the construction industry than in the economy as a whole. However, the level of productivity in construction remains below the UK average. Figure 1: Productivity has changed little in the construction industry in the past 50 years Output per hour worked and multi-factor productivity, construction industry and market sector, UK, 1970 to 2020 <!--[endif]--> <img src="/chartimage?uri=/economy/economicoutputandproductivity/productivitymeasures/articles/productivityintheconstructionindustryuk2021/2021-10-19/3a7e2c46&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – Labour productivity and multi-factor productivity Notes: Multi-Factor Productivity is the unexplained growth in output after accounting for growth in capital and labour inputs. Download this chart Figure 1: Productivity has changed little in the construction industry in the past 50 years Image .csv .xls The growth of productivity has differed little across parts of the construction industry since 1997. Figure 2 shows that all the construction sub-industries saw little or negative growth in output per hour worked between 1997 and 2020, with productivity in the construction of buildings industry falling most. Architectural and engineering services, a related sub-industry (part of the professional services industry), saw a similar fall over the period. Figure 2: Productivity growth has been slow in construction industries compared with the whole economy Output per hour worked, construction industry and sub-industries and whole economy, UK, 1997 to 2020, index 1997 = 100 <!--[endif]--> <img src="/chartimage?uri=/economy/economicoutputandproductivity/productivitymeasures/articles/productivityintheconstructionindustryuk2021/2021-10-19/91c05cc8&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – Labour productivity Notes: Industry division 71 (architectural and engineering services) is included, although it is not part of industry section F (construction) in the Standard Industrial Classification (SIC) 2007. This reflects its close relationship with activity in the construction industry. Download this chart Figure 2: Productivity growth has been slow in construction industries compared with the whole economy Image .csv .xls There is considerable variation in productivity levels between firms and across sub-industries of the construction industry. Figure 3 shows that the highest level of productivity in construction is in civil engineering, which is above the UK average, and has generally been around twice as high as specialised construction. Figure 3: Only the civil engineering industry is above the whole economy in levels of productivity Output per hour worked, construction industry and sub-industries, UK, 1997 to 2020, level relative to whole economy, index UK = 100 <!--[endif]--> <img src="/chartimage?uri=/economy/economicoutputandproductivity/productivitymeasures/articles/productivityintheconstructionindustryuk2021/2021-10-19/945ba154&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – Labour productivity Notes: Industry division 71 (architectural and engineering services) is included, although it is not part of industry section F (construction) in the Standard Industrial Classification (SIC) 2007. This reflects its close relationship with activity in the construction industry. Download this chart Figure 3: Only the civil engineering industry is above the whole economy in levels of productivity Image .csv .xls Productivity in the construction industry was volatile during 2020, as the industry was greatly affected by the coronavirus (COVID-19) restrictions in response to the pandemic. Taking the year as a whole, output per hour was 2% higher in 2020 than in 2019, as output fell less than hours worked. This was particularly notable in the specialised construction activities sub-industry, where output fell by 16% and hours fell by 20%.The increase in output per hour worked in construction in 2020 could also reflect a composition effect, with higher productivity activity continuing while lower productivity activities paused. For example, a relative shift towards civil engineering activity, or towards large construction firms and away from sole traders.The Construction statistics, Great Britain bulletin, published alongside this article, provides an overview of recent changes to the industry. Back to table of contents 4. Pay Average labour income per hour worked is lower in construction than the rest of the economy, in line with economic theory since productivity is also lower. This relationship is shown in Figure 4, where total employee compensation (including wages and other costs of employment, such as employee taxes and pension payments) per hour worked is consistently higher for the whole economy than it is for the construction industry. Figure 4: Labour income per hour worked is persistently lower in the construction industry than the rest of the economy Total labour costs per hour worked, construction industry and whole economy, UK, Quarter 1 (Jan to Mar) 1997 to Quarter 2 (Apr to June) 2021 <!--[endif]--> <img src="/chartimage?uri=/economy/economicoutputandproductivity/productivitymeasures/articles/productivityintheconstructionindustryuk2021/2021-10-19/c3eaa899&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – Supply and use tables, and labour productivity hours worked Notes: This measure is preferred over Average Weekly Earnings (AWE) which only includes wages and salaries, and does not include self-employed workers. This measure will be introduced in the Unit Labour Costs release on 3 Nov 2021. Download this chart Figure 4: Labour income per hour worked is persistently lower in the construction industry than the rest of the economy Image .csv .xls Back to table of contents 5. Output The volume of output in the construction industry is estimated to have risen more slowly than the whole economy since 1997 (Figure 5). In real terms, gross value added in the construction industry increased just 12% in the 22 years to 2019 (0.5% per year on average), compared with the whole economy which saw a 53% increase (2.0% per year on average). This in part reflects the larger fall in construction output during the 2008 to 2009 recession than for the economy overall. Figure 5: Real output has increased slowly in construction compared with the rest of the economy Gross value added, chain volume measures (CVM), construction industry and sub-industries and whole economy, UK, 1997 to 2020 <!--[endif]--> <img src="/chartimage?uri=/economy/economicoutputandproductivity/productivitymeasures/articles/productivityintheconstructionindustryuk2021/2021-10-19/eb14dbaa&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics ¬– GDP(O) low level aggregates table Download this chart Figure 5: Real output has increased slowly in construction compared with the rest of the economy Image .csv .xls The growth in the volume of output has been broadly consistent across all construction sub-industries. The volume of output for specialised construction activities and construction of buildings follows a similar trend to the number of dwellings built each year. Figure 6 shows that the pattern of growth before, during and after the financial crisis for specialised construction activities and construction of buildings is similar to that of the number of dwellings built. By contrast, the volume of output for civil engineering steadily increases. Figure 6: Real output is cyclical in construction industries related to housebuilding, and more steady for civil engineering Gross value added (CVM) and number of dwellings built, UK, 1997 to 2019, index 1997= 100 <!--[endif]--> <img src="/chartimage?uri=/economy/economicoutputandproductivity/productivitymeasures/articles/productivityintheconstructionindustryuk2021/2021-10-19/e2566bb3&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – UK housing statistics Notes: Construction sub-industry 41 is not just related to housebuilding; for dwellings completed information see House building, UK: permanent dwellings started and completed. Download this chart Figure 6: Real output is cyclical in construction industries related to housebuilding, and more steady for civil engineering Image .csv .xls Back to table of contents 6. Goods and services Raw materials, goods and services (intermediate consumption) are inputs into production, like labour and capital. This expenditure is deducted from output to calculate gross value added, the numerator in our productivity calculations.Intermediate consumption includes sub-contracting expenses, which is common in the construction industry. Over 50% of intermediate consumption is sub-contracting expenses, by far the highest of any industry in the UK economy. The figure rose in the late 1990s to the level it is today. A high degree of subcontracting could be good or bad for productivity in the industry: it could lead to increased specialisation of tasks and competition, but also increase fragmentation and higher communication costs.To look at trends in purchases of other products, we have deducted sub-contracting expenses from total intermediate consumption.The construction industry is spending proportionally more on services and less on materials than it used to. For example, the proportion of the industry's total intermediate spending on rubber and plastic products has decreased from 10.6% to 2.9% between 1997 and 2018. Other materials like glass and paint have also decreased as a proportion of total intermediate consumption (Figure 7). Over the same period, the share spent on architectural and engineering services has increased, along with computer programming and consultancy-related services. Figure 7: Construction industry is spending proportionally more on business services, and proportionally less on materials Percentage point difference in intermediate consumption shares for selected products between 1997 and 2018 <!--[endif]--> <img src="/chartimage?uri=/economy/economicoutputandproductivity/productivitymeasures/articles/productivityintheconstructionindustryuk2021/2021-10-19/616026d0&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – Supply and use tables Download this chart Figure 7: Construction industry is spending proportionally more on business services, and proportionally less on materials Image .csv .xls The shift in purchases towards services and away from materials might suggest increased efficiency in using materials, or less wastage of raw materials. The increased proportion spent on services could reflect increased planning or pre-construction design work and could also reflect increased complexity of building projects. This trend mirrors the changes in the industry's labour composition; see Section 7. Back to table of contents 7. Labour input In 1997, almost 1.9 million people worked in the construction industry, 700,000 being self-employed. By 2019 that had risen to 2.3 million with 900,000 self-employed people, maintaining a steady share of UK employment.Total hours worked in the construction industry increased by 23% between 1997 and 2019, compared with 20% in the economy as a whole over the same period. During this time, the composition of hours worked in construction shifted towards older and more educated workers.An increasing share of total hours worked in the construction industry are by older people (50 years and over). Figure 8 shows that until the financial crisis, hours worked increased steadily for all age groups. During the financial crisis hours worked fell for those under 50 years, before marginally increasing thereafter. In contrast, the number of hours worked by those aged 50 years and above stayed broadly flat during the financial crisis before rising again in the post-financial crisis period. Figure 8: The number of hours worked by workers 50 years and over has increase substantially, while for younger workers there is little growth Total weekly hours worked per quarter by age group, construction industry, UK, Quarter 1 (Jan to Mar) 1997 to Quarter 2 (Apr to June) 2021 <!--[endif]--> <img src="/chartimage?uri=/economy/economicoutputandproductivity/productivitymeasures/articles/productivityintheconstructionindustryuk2021/2021-10-19/b2fe5a8d&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – Quality-adjusted labour input Download this chart Figure 8: The number of hours worked by workers 50 years and over has increase substantially, while for younger workers there is little growth Image .csv .xls Despite growth in the industry and labour mark'''
year_published = 2025
