title = "GDP first quarterly estimate, UK - Office for National Statistics"
description = "First quarterly estimate of gross domestic product (GDP). Contains current and constant price data on the value of UK goods and services."
full_description = '''1. Main points UK gross domestic product (GDP) is estimated to have grown by 0.1% in Quarter 4 (Oct to Dec) 2024, following no growth in the previous quarter. The services sector increased by 0.2% in output terms for Quarter 4 2024; construction also grew, by 0.5%, while production fell by 0.8%. There were falls in expenditure terms in net trade and gross fixed capital formation for Quarter 4 2024 that were offset by a large increase in change in inventories. Nominal GDP is estimated to have increased by 1.1% in Quarter 4 2024, mainly driven by an increase in compensation of employees. Real GDP per head is estimated to have fallen by 0.1% in Quarter 4 2024. Real GDP increased by 0.9% across 2024, while real GDP per head fell by 0.1%. This release includes revisions to Quarter 1 (Jan to Mar) to Quarter 3 (July to Sept) 2024; growth in real GDP in Quarter 1 2024 has been revised up 0.1 percentage points, while growths in Quarter 2 (Apr to June) and Quarter 3 2024 are unrevised. Back to table of contents 2. Headline GDP figures UK real gross domestic product (GDP) is estimated to have increased by 0.1% in Quarter 4 (Oct to Dec) 2024, following unrevised no growth in the previous quarter (Figure 1). Real GDP is estimated to have increased by 1.4%, compared with the same quarter a year ago.GDP is estimated to have grown by 0.4% in December 2024 because of growth in services and production, as shown in our GDP monthly estimate, UK: December 2024 bulletin. This follows an unrevised increase of 0.1% in November 2024 and an unrevised fall of 0.1% in October 2024.This release includes revisions to data from Quarter 1 (Jan to Mar) to Quarter 3 (July to Sept) 2024 because of updated and revised source data. This is in line with the National Accounts Revisions Policy. We have also reviewed the balancing of the three approaches to measuring GDP from 2024 onwards based on these new data.The quarterly path of real GDP at an aggregated level is unrevised from Quarter 2 (Apr to June) to Quarter 3 2024, with an upward revision of 0.1 percentage points in Quarter 1 2024. There have been some revisions to individual components of GDP. For more information, see Section 7: Revisions to GDP.Early estimates of GDP are subject to revision (positive or negative). For more information, please refer to our GDP revisions in Blue Book: 2024 article. The GDP growth vintages from 2023 onwards are shown in Table 4. Figure 1: Real GDP is estimated to have increased by 0.1% in Quarter 4 2024, following no growth in the previous quarter UK, Quarter 1 (Jan to Mar) to Quarter 4 (Oct to Dec) 2024 <!--[endif]--> <img src="/chartimage?uri=/economy/grossdomesticproductgdp/bulletins/gdpfirstquarterlyestimateuk/octobertodecember2024/2d004d53&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: GDP first quarterly estimate from the Office for National Statistics Notes: Q1 refers to Quarter 1 (Jan to Mar), Q2 refers to Quarter 2 (Apr to June), Q3 refers to Quarter 3 (July to Sept) and Q4 refers to Quarter 4 (Oct to Dec). Chart shows the quarter-on-previous-quarter growth (%). This release includes revisions to Quarter 1 to Quarter 3 2024. Quarter 4 2024 has been published for the first time. Download this chart Figure 1: Real GDP is estimated to have increased by 0.1% in Quarter 4 2024, following no growth in the previous quarter Image .csv .xls We also produce estimates of GDP per head (or per capita), which divides UK GDP by the total UK population. Further information on this is available in our Trends in UK real GDP per head: 2022 to 2024 article. This is one proxy indicator of welfare, rather than production, which reflects a country's living standards. It captures the volume of goods and services available to the average person.Real GDP per head is estimated to have fallen by 0.1% in Quarter 4 2024. This is up 0.4%, compared with the same quarter a year ago. Our first estimate shows that there was a slight fall in GDP per head of 0.1% in 2024.We have updated the population estimates for 2023 and 2024, as announced in our National Accounts Revision Policy: updated February 2025. This is in line with our National population projections: 2022-based bulletin, published on 28 January 2025, and uses migration statistics from our Long-term international migration, provisional: year ending June 2024 bulletin.See Section 6: Real GDP per head for more information. Table 1: Headline national accounts indicators for the UK% growth GDP (Chained volume measures)GDP per head (Chained volume measures) [Note 3]GDP (Current market prices)GDP implied deflator Seasonally adjusted 20240.9-0.14.83.8 Q1 20240.80.61.91.0 Q2 20240.40.21.20.8 Q3 20240.0-0.31.41.4 Q4 20240.1-0.11.11.0 Source: GDP first quarterly estimate from the Office for National Statistics Notes Percentage change on previous period. Q1 refers to Quarter 1 (Jan to Mar), Q2 refers to Quarter 2 (Apr to June), Q3 refers to Quarter 3 (July to Sept) and Q4 refers to Quarter 4 (Oct to Dec). Population figures for 2023 and 2024 are consistent with the 2022-based interim population projections published on 28 January 2025. Download this table Table 1: Headline national accounts indicators for the UK .xls .csv Nominal GDP is estimated to have increased by 1.1% in Quarter 4 2024, mainly driven by an increase in compensation of employees. Nominal GDP is estimated to have increased by 5.7%, compared with the same quarter a year ago.The implied GDP deflator is the broadest measure of inflation in the domestic economy, reflecting changes in the price of all goods and services that make up GDP. The GDP deflator covers the whole of the domestic economy, not just consumer spending. It also reflects the change in the relative price of exports to imports. For more information on the implied GDP deflator, see our Measuring price changes of the UK national accounts: February 2023 article.The implied price of GDP rose by 1.0% in Quarter 4 2024, mainly driven by higher prices in both government and household consumption. The GDP implied deflator grew by 4.2%, compared with the same quarter a year ago (Figure 2). Figure 2: The implied price of GDP increased by 4.2% in Quarter 4 2024, compared with the same quarter a year ago Quarter-on-quarter a year ago contributions to growth in the implied price deflator, UK, Quarter 1 (Jan to Mar) to Quarter 4 (Oct to Dec) 2024 <!--[endif]--> <img src="/chartimage?uri=/economy/grossdomesticproductgdp/bulletins/gdpfirstquarterlyestimateuk/octobertodecember2024/b213cb3d&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: GDP first quarterly estimate from the Office for National Statistics Notes: Q1 refers to Quarter 1 (Jan to Mar), Q2 refers to Quarter 2 (Apr to June), Q3 refers to Quarter 3 (July to Sept) and Q4 refers to Quarter 4 (Oct to Dec). Component contributions do not sum to total because of rounding. An increase in import prices contributes negatively to the implied GDP deflator, while a decrease in import price contributes positively to the implied GDP deflator. Download this chart Figure 2: The implied price of GDP increased by 4.2% in Quarter 4 2024, compared with the same quarter a year ago Image .csv .xls The three approaches to measuring GDPReal annual GDP in 2024 is now estimated to have increased by 0.9%, following growth of 0.4% in 2023.The three approaches to measuring GDP are closely aligned (Figure 3). However, there can still be uncertainty at the component level at this stage in the 2023 and 2024 production cycle until these data have been confronted through the supply and use tables (SUTs) framework. For those periods that have not yet been fully balanced in the SUTs framework, the annual growth reflects an average of the estimates to the three approaches. This uncertainty may be for various reasons and is discussed in Section 10: Data sources and quality. Figure 3: Real GDP is estimated to have increased by an average 0.9% in 2024 UK, Three approaches to measuring GDP and average GDP growth, 2023 and 2024 <!--[endif]--> <img src="/chartimage?uri=/economy/grossdomesticproductgdp/bulletins/gdpfirstquarterlyestimateuk/octobertodecember2024/9ba1a5cc&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: GDP first quarterly estimate from the Office for National Statistics Notes: Chart shows the year-on-previous-year growth (%). Growth rates are rounded to one decimal place. Download this chart Figure 3: Real GDP is estimated to have increased by an average 0.9% in 2024 Image .csv .xls Back to table of contents 3. Output Output is estimated to have increased by 0.1% in Quarter 4 (Oct to Dec) 2024, following no growth (unrevised) in the previous quarter. GDP is estimated to have grown by 0.4% in December 2024 because of growth in services and production, as shown in our GDP monthly estimate, UK: December 2024 bulletin. This follows an unrevised increase of 0.1% in November 2024 and an unrevised fall of 0.1% in October 2024.The services sector increased by 0.2% in the latest quarter. Construction output also grew, by 0.5%, while production fell by 0.8%. Early estimates show that 11 out of 20 of the subsectors grew across Quarter 4 2024, which is down from 12 in the previous quarter.ServicesServices output increased by 0.2% in the latest quarter, following unrevised no growth in Quarter 3 (July to Sept) 2024. Services output is estimated to have increased by 1.7%, compared with the same quarter a year ago. Non-consumer-facing services (business-facing services) increased by 0.2% in Quarter 4 2024, while consumer-facing services increased by 0.1%.The services sector increased by 1.3% across 2024. Non-consumer-facing services increased by 1.6%, while consumer-facing services fell by 0.2%.Figure 4 shows 8 out of 14 services subsectors contributed positively to growth in Quarter 4 2024. The largest positive contributor to growth was human health and social work activity, which increased by 0.9%. For more information, see the subsection on Consumption of government goods and services in Section 4: Expenditure.The second largest positive contribution to growth was from the professional, scientific and technical activities subsector, which grew by 0.9%. Within this subsector, seven out of eight of the industries contributed positively to growth.The largest negative contributor to growth in Quarter 4 2024 was administrative and support service activities, which fell by 1.4%. This was largely driven by a 5.3% fall in employment activities.More detail on services can be found in our Index of Services, UK: December 2024 bulletin. Figure 4: 8 out of 14 services subsectors contributed positively to growth in Quarter 4 2024 UK, contributions to services growth, Quarter 3 (July to Sept) and Quarter 4 (Oct to Dec) 2024 <!--[endif]--> <img src="/chartimage?uri=/economy/grossdomesticproductgdp/bulletins/gdpfirstquarterlyestimateuk/octobertodecember2024/1781f44f&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: GDP first quarterly estimate from the Office for National Statistics Notes: Components contribution may not sum to total because of rounding. Download this chart Figure 4: 8 out of 14 services subsectors contributed positively to growth in Quarter 4 2024 Image .csv .xls Total services growth in Quarter 1 (Jan to Mar) and Quarter 2 (Apr to June) 2024 have both been revised up 0.1 percentage points and Quarter 3 2024 is unrevised. The revisions in these two quarters are mainly because of late and updated Monthly Business Survey returns and other updated source data.ProductionThe production sector is estimated to have fallen for the fifth consecutive quarter, with a 0.8% decline in Quarter 4 2024. Production output is estimated to have fallen by 1.7%, compared with the same quarter a year ago. Production output fell by 1.7% for 2024 as a whole.The fall in production was largely driven by a 0.7% decline in manufacturing and a 2.5% decline in mining and quarrying. Electricity, gas, steam and air conditioning supply decreased by 0.7%. Water supply; sewerage, waste management and remediation activities increased by 1.2%.Manufacturing output fell by 0.7% in Quarter 4 2024 and declined by 0.7% in 2024. Figure 5 shows that there have been falls in 7 out of 13 of the subsectors in the latest quarter. The largest negative contributions from the manufacture of transport equipment, which fell by 2.3%, and the manufacture of pharmaceuticals, which fell by 4.0%.The manufacture of transport has fallen for three consecutive quarters, mainly because of a decline in the manufacture of motor vehicles and motorcycles. Anecdotal evidence from the Society of Motor Manufacturers and Traders (SMMT) showed a fall in vehicle production, as described in their news update on UK manufacturing.Further detail on production can be found in our Index of Production, UK: December 2024 bulletin. Figure 5: There were falls in 7 out of 13 manufacturing subsectors in Quarter 4 2024 UK, contributions to manufacturing growth, Quarter 3 (July to Sept) and Quarter 4 (Oct to Dec) 2024 <!--[endif]--> <img src="/chartimage?uri=/economy/grossdomesticproductgdp/bulletins/gdpfirstquarterlyestimateuk/octobertodecember2024/ff34cd28&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: GDP first quarterly estimate from the Office for National Statistics Notes: Components contribution may not sum to total because of rounding. Download this chart Figure 5: There were falls in 7 out of 13 manufacturing subsectors in Quarter 4 2024 Image .csv .xls Production output growth has been revised down by 0.2 percentage points in Quarter 1 2024 and revised up by 0.1 percentage points in Quarter 3 2024. This was mainly driven by manufacturing, and the mining and quarrying subsectors. These changes reflect late and updated Monthly Business Survey returns and updated seasonal adjustment models.ConstructionConstruction output is estimated to have grown by 0.5% in Quarter 4 2024, following a 0.4% increase in the previous quarter. The level of construction output was 0.9% higher in Quarter 4 2024 than the same quarter a year ago and increased by 0.4% in 2024.New work increased by 1.2% in Quarter 4 2024 and repair and maintenance fell by 0.4%. The largest contributor to the increase within new work came from private new housing, which grew by 1.3%. The largest negative contributor in repair and maintenance came from private housing repair and maintenance, which fell by 2.5%.Further detail on construction output growth rates can be found in our Construction output in Great Britain: December 2024, new orders and Construction Output Price Indices October to December 2024. Back to table of contents 4. Expenditure Looking at the expenditure approach to measuring gross domestic product (GDP), there were falls in net trade and gross fixed capital formation in the latest quarter. These falls were offset by a large increase in gross capital formation: other, specifically change in inventories and the expenditure '''
