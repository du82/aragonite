title = "Housing - Office for National Statistics"
description = "Property price, private rent and household statistics."
full_description = "Housing Property price, private rent and household statistics. On this page: Dataset Publications Methodology View all content related to this topic: All data All publications Spotlight Private rent and house prices, UK: February 2025 What's in the bulletin? Average UK private rents increased by 8.7% in the 12 months to January 2025 (provisional estimate); this is down from 9.0% in the 12 months to December 2024. Average rents increased to £1,375 (8.8%) in England, £780 (8.4%) in Wales and £995 (6.2%) in Scotland, in the 12 months to January 2025. In Northern Ireland, average rents increased by 8.3% in the 12 months to November 2024. Read this statistical bulletin More publications Housing affordability in England and Wales: 2023 What's in the bulletin? In 2023, full-time employees in England could expect to spend around 8.3 times their annual earnings buying a home. The equivalent figure in Wales is 6.1 times their annual earnings. At the national level, these ratios are similar to 2022, and represent a return to the pre-coronavirus (COVID-19) pandemic trend after a large increase between 2020 and 2021. In the 318 local authorities (LAs) in England and Wales, housing affordability improved in 237 (75%) since 2022, worsened in 77 (24%), and stayed the same in the remaining 1%. Read this statistical bulletin More publications How are monthly mortgage repayments changing in Great Britain? How are average house prices and changing interest rates affecting monthly mortgage repayments across Great Britain? Back to top Datasets related to Housing House price to workplace-based earnings ratio Affordability ratios calculated by dividing house prices by gross annual workplace-based earnings. Based on the median and lower quartiles of both house prices and earnings in England and Wales. Residential property sales for administrative geographies: HPSSA dataset 6 Number of residential property sales in England and Wales, by property type and administrative geographies. Annual data. Median house prices for administrative geographies: HPSSA dataset 9 Median price paid for residential property in England and Wales, by property type and administrative geographies. Annual data. House price to residence-based earnings ratio Affordability ratios calculated by dividing house prices by gross annual residence-based earnings. Based on the median and lower quartiles of both house prices and earnings in England and Wales. Towns and cities analysis Statistics on towns and cities in England and Wales with a focus on housing and deprivation. Disability and housing Housing outcomes for disabled people in the UK aged 16 to 64 years, with analysis by age, sex, impairment type, country and region using Annual Population Survey (APS) data. View all datasets related to Housing Back to top Publications related to Housing Statistical bulletins Short-term lets through online collaborative economy platforms, UK: year to Quarter 2 (Apr to June) 2024 Number of guest nights, nights, and stays for short-term lets offered via online collaborative economy platforms for the year to Quarter 2 (Apr to June) 2024. Housing affordability in England and Wales: 2023 Data on house prices and annual earnings to calculate affordability ratios for national and subnational geographies in England and Wales on an annual basis. Index of Private Housing Rental Prices, UK: January 2024 An experimental price index tracking the prices paid for renting property from private landlords in the UK. UK House Price Index: December 2023 Monthly house price inflation in the UK, calculated using data from HM Land Registry, Registers of Scotland, and Land and Property Services Northern Ireland. Private rental affordability, England and Wales: 2023 Private rent prices by country and English region, expressed as a percentage of gross monthly income of private renting households. Part of our additional measures of housing affordability series. Housing, England and Wales: Census 2021 Accommodation type, tenure, rooms and bedrooms, central heating and car or van availability in England and Wales, Census 2021 data. View all related statistical bulletins Articles Research Outputs: Subnational stock of secured deposits held by the Tenancy Deposit Protection schemes in England Using data from Tenancy Deposit Protection (TDP) scheme providers to estimate the number of dwellings that have tenancies with a secure deposit held. How are monthly mortgage repayments changing in Great Britain? How are average house prices and changing interest rates affecting monthly mortgage repayments across Great Britain? Monthly mortgage repayments up 61% for average semi-detached home in the UK We summarise some key trends from our newly launched mortgage repayments calculator tool Private rental prices development plan, UK Overview of our plans for the statistical development of rental prices statistics, including a timeline for development. The cost of living alone As the number of one-person households continues to rise, analysis reveals the financial situation and personal well-being of those living alone. How green is your street? Have you ever wondered how green your street is compared with your neighbourhood, or your city? The Data Science Campus at Office for National Statistics is experimenting with a new way of analysing how green cities are. View all related articles Back to top Methodology related to Housing Valuation Office Agency property attribute data: quality assurance of administrative data used in Census 2021 House price statistics for small areas QMI Household Satellite Account (experimental) Admin-based statistics for property floor space, feasibility research: England and Wales Admin-based accommodation type statistics for England and Wales, feasibility research: 2011 View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
