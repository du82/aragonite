["https://ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/bulletins/uklabourmarket/latest"]
title = "Labour market overview, UK - Office for National Statistics"
description = "Estimates of employment, unemployment, economic inactivity and other employment-related statistics for the UK."
full_description = '''1. Other pages in this release Average weekly earnings in Great Britain Earnings and employment from Pay As You Earn Real Time Information, UK Employment in the UK Labour market in the regions of the UK Vacancies and jobs in the UK Back to table of contents 2. Main points Latest dataEstimates for payrolled employees in the UK decreased by 14,000 (0.0%) between November and December 2024 but rose by 44,000 (0.1%) between December 2023 and December 2024.Payrolled employees fell by 3,000 (0.0%) over the quarter but rose by 106,000 (0.3%) over the year, when looking at October to December 2024. This is the period comparable with our Labour Force Survey (LFS) estimates.The early estimate of payrolled employees for January 2025 increased by 21,000 (0.1%) on the month and increased by 49,000 (0.2%) on the year to 30.4 million. The January 2025 estimate should be treated as a provisional estimate and is likely to be revised when more data are received next month.Increased volatility of LFS estimates, resulting from smaller achieved sample sizes, means that estimates of change should be treated with additional caution. We recommend using them as part of our suite of labour market indicators, alongside workforce jobs (WFJ), Claimant Count data, and Pay As You Earn (PAYE) Real Time Information (RTI) estimates.The UK employment rate for people aged 16 to 64 years was estimated at 74.9% in October to December 2024. This is above estimates of a year ago, and up in the latest quarter.The UK unemployment rate for people aged 16 years and over was estimated at 4.4% in October to December 2024. This is above estimates of a year ago, and up in the latest quarter.The UK economic inactivity rate for people aged 16 to 64 years was estimated at 21.5% in October to December 2024. This is below estimates of a year ago, and down in the latest quarter.The UK Claimant Count for January 2025 increased on the month and is up on the year, at 1.750 million.The estimated number of vacancies in the UK decreased by 9,000 on the quarter to 819,000 in November 2024 to January 2025. Vacancies decreased on the quarter for the 31st consecutive period but are still above pre-coronavirus (COVID-19) pandemic levels.Annual growth in employees' average regular earnings excluding bonuses in Great Britain was 5.9% in October to December 2024, and annual growth in total earnings including bonuses was 6.0%. HM Revenue and Customs Pay As You Earn (PAYE) Real Time Indicators (RTI) pay data showed a similar annual growth rate when compared with Average Weekly Earnings (AWE) total earnings including arrear payments.Annual growth in real terms, adjusted for inflation using the Consumer Prices Index including owner occupiers' housing costs (CPIH), was 2.5% for both regular pay and total pay in October to December 2024.There were an estimated 52,000 working days lost because of labour disputes across the UK in December 2024. ! This bulletin includes data from business and social surveys, as well as data from administrative sources. It includes a combination of accredited official statistics and official statistics in development and therefore, we advise the consideration of this when using. Read more in Section 7: Data sources and quality. Back to table of contents 3. Trends and considerations around comparisons In this section, we supply additional commentary to help users assess the different sources of data we publish on employment and related indicators.Figure 1 shows the annual growth rates in a selection of our different employment indicators, with annual growth rates giving a more stable, longer-term view on changes. The Labour Force Survey (LFS) is our survey of households, while Workforce Jobs (WFJ) is based mainly on business surveys for employee jobs, with the LFS covering self-employed jobs. HM Revenue and Customs Pay As You Earn (PAYE) Real Time Indicators (RTI) data are derived from administrative tax records and only cover payrolled employees.Each of these sources is collected and processed in different ways so we do expect differences in levels (for example, jobs versus people). Divergent trends between individual periods are also possible. Further detail on how best to compare these different sources can be found under the subheading "Coherence of data sources" in Section 7: Data sources and quality, and in our Comparison of labour market sources article. Figure 1: Annual growth rates for employee jobs and payrolled employees are broadly coherent Annual growth rates, employment indicators, seasonally adjusted, UK, July to September 2022, to October to December 2024 <!--[endif]--> <img src="/chartimage?uri=/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/bulletins/uklabourmarket/february2025/fc587230&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Labour Force Survey (LFS) and Workforce Jobs (WFJ) from the Office for National Statistics, and Pay As You Earn Real Time Information (RTI) from HM Revenue and Customs Notes: Three-month averages of RTI payrolled employees have been used here for comparability. Workforce Jobs are published for the months of March, June, September and December. For presentational purposes they have been plotted against the middle month of the time period shown, that is, September plotted against August to October. Download this chart Figure 1: Annual growth rates for employee jobs and payrolled employees are broadly coherent Image .csv .xls There have been ongoing challenges in assessing the coherence between these statistics in recent months. Annual growth ranges from 0.3% for payrolled employees up to 1.7% for LFS employees, for the datasets available in the latest period. Annual growth in the latest measures from RTI has continued to slow. Estimates from LFS are still affected by increased volatility and base effects, as we are comparing with periods of low response rates.As outlined in our previous Labour market overviews, the longer-term broad coherence between RTI and WFJ, when looking at annual change, suggests that these sources are likely provide a more reliable estimate of employment, particularly for employees. These sources continue to indicate that we have seen a sustained moderation of growth in employees over the last year. RTI and WFJ also show less volatility than the LFS over the same time period.Despite these coherence challenges, the LFS continues to be the sole source of data for unemployment, economic inactivity and self-employment, and provides a range of breakdowns that are only possible from LFS data.We are continuing to improve the quality of the LFS, building on our work to date. This has led to an increase in the achieved sample from 44,338 individuals in October to December 2023, to 63,069 individuals in October to December 2024, as shown in our LFS performance and quality monitoring report: October to December 2024 methodology.We continue to advise caution, particularly when interpreting change in the LFS. We encourage users to make use of a wide range of data sources, where possible. Back to table of contents 4. Latest indicators at a glance Embed code Embed this interactive Copy Back to table of contents 5. Data on labour market Summary of labour market statistics Dataset A01 | Released 18 February 2025 Labour market statistics summary data table, including earnings, employment, unemployment, redundancies and vacancies, Great Britain and UK, published monthly.Earnings and employment from Pay As You Earn Real Time Information, seasonally adjusted Dataset | Released 18 February 2025 Earnings and employment statistics from Pay As You Earn (PAYE) Real Time Information (RTI), seasonally adjusted. These are official statistics in development.A guide to labour market data Methodology | 18 February 2025 Summary of labour market datasets, providing estimates of employment, unemployment, average weekly earnings, and the number of vacancies. Tables are listed alphabetically and by topic. View all related data on our related data page.Alternatively, Nomis provides free access to the most detailed and up-to-date UK labour market statistics. Back to table of contents 6. Glossary Average weekly earningsAverage weekly earnings (AWE) is calculated using information based on the Monthly Wages and Salaries Survey (MWSS).AWE measures money paid by employers to employees in Great Britain before tax and other deductions from pay. The estimates are not just a measure of pay rises, because they also reflect, for example, changes in the overall structure of the workforce. More high-paid jobs in the economy would have an upward effect on the earnings growth rate.Economic inactivityPeople not in the labour force are not in employment but do not meet the internationally accepted definition of unemployment. This is because they have not been seeking work within the last four weeks or they are unable to start work in the next two weeks. The economic inactivity rate is the proportion of people aged between 16 and64 years who are not in the labour force. The Labour Force Survey estimates are official statistics in development.EmploymentEmployment measures the number of people in paid work or who had a job that they were temporarily away from (for example, because they were on holiday or off sick). This differs from the number of jobs because some people have more than one job. The employment rate is the proportion of people aged between 16 and 64 years who are in employment. The Labour Force Survey estimates are official statistics in development.UnemploymentUnemployment measures people without a job who have been actively seeking work within the last four weeks and are available to start work within the next two weeks. The unemployment rate is not the proportion of the total population who are unemployed. It is the proportion of the economically active population (people in work and those seeking and available to work) who are unemployed. The Labour Force Survey estimates are official statistics in development.Claimant CountThe Claimant Count is an official statistic in development that measures the number of people who are receiving a benefit principally for the reason of being unemployed. Currently, the Claimant Count consists of those receiving Jobseeker's Allowance and Universal Credit claimants in the "searching for work" conditionality group.VacanciesVacancies are defined as positions for which employers are actively seeking recruits from outside their business or organisation. The estimates are based on the Vacancy Survey. This is a survey of businesses designed to provide estimates of the stock of vacancies across the economy, excluding agriculture, forestry and fishing (a small sector for which the collection of estimates would not be practical).Pay As You Earn Real Time InformationThese data come from HM Revenue and Customs' (HMRC's) Pay As You Earn (PAYE) Real Time Information (RTI) system. They cover the whole population, rather than a sample of people or companies, and they will allow for more detailed estimates of the population. The PAYE RTI statistics are official statistics in development (previously called experimental statistics) because the methodologies used to produce the statistics are still in their development phase.In June 2023, the Office for Statistics Regulation (OSR) published an assessment report of HMRC and Office for National Statistics (ONS) statistics on earnings and employment from PAYE RTI. HMRC and the ONS developed an action plan for focusing on the six requirements and published an update on progress on 9 December 2024.A more detailed glossary is available in our Guide to labour market statistics methodology. Back to table of contents 7. Data sources and quality The estimates presented in this bulletin contain uncertainty. For more information, see our Uncertainty and how we measure it methodology.Information on revisions is available in our Labour market statistics revisions policy.Information on the strengths and limitations of this bulletin is available in our Labour market overview, UK: April 2021 bulletin.Further information is available in our Guide to labour market statistics methodology.Accredited official statisticsOn 7 June 2024, the Office for Statistics Regulation (OSR) introduced the new accredited official statistics badge, to denote official statistics that have been independently reviewed by the OSR. Accredited official statistics comply with the standards of trustworthiness, quality and value in the Code of Practice for Statistics.This UK labour market bulletin includes a combination of accredited official statistics and official statistics in development (until September 2023, these were called "experimental statistics"). Read more about the change in our Guide to official statistics in development.The following labour market outputs are accredited official statistics: Labour disputes (rapid review completed by the OSR in February 2023) Vacancy statistics (reviewed by the OSR in April 2022) Workforce jobs (WFJ) (reviewed by the OSR in April 2022) The following labour market outputs are official statistics in development: Labour Force Survey (LFS) estimates ONS Claimant Count Earnings and employment from Pay As You Earn Real Time Information Labour Force SurveyWe have been facing the challenge of falling response rates for household surveys, as have other comparable countries. This issue became more acute in the LFS data collected for August 2023. The LFS estimates due to be published in October 2023 were suspended because of quality concerns. We developed a comprehensive plan to address these concerns and reintroduce LFS, as described in our Labour Force Survey: planned improvements and its reintroduction methodology. We reinstated reweighted LFS estimates into our monthly publication from February 2024, as described in our Impact of reweighting on LFS key indicators: 2024 article.In December 2024, we carried out a further LFS reweighting exercise, based on 2022 mid-year estimates. The population estimates used do not consider the most recent estimates of migration published by the Office for National Statistics (ONS) in November 2024.As external sources suggest that recent increases in LFS measures of employment are likely to be overstating underlying employment growth, we expect that underlying changes in the other labour market statuses will also be affected. For example, the more modest growth we see in alternative employment sources may indicate that unemployment and economic inactivity may have moved less than the LFS has recently suggested.It is likely that some of the recent movements in LFS estimates are also being affected by the increased sample size and changes in data collection methods introduced over the last year, in addition to any underlying changes in the labour market.The wave structure of the LFS means that any changes in sampling can take a substantial amount of time to fully feed through the survey. We intervi'''
