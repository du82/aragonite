title = "Crime and justice - Office for National Statistics"
description = "Crime levels and trends based primarily on the Crime Survey for England and Wales (CSEW) and police recorded crime data."
full_description = "Crime and justice Crime levels and trends based primarily on the Crime Survey for England and Wales (CSEW) and police recorded crime data. On this page: Dataset Publications View all content related to this topic: All data All publications Spotlight Crime in England and Wales: year ending September 2024 What's in the bulletin? 4.5% of people aged 16 years and over had experienced domestic abuse in the last year (approximately 2.2 million victims) 2.8% (around 1.4 million people) had experienced stalking, a 0.6 percentage point decrease from 3.4% (1.6 million victims) 2.2% (approximately 1.0 million people) had experienced sexual assault Read this statistical bulletin More publications Domestic abuse in England and Wales overview: November 2024 What's in the bulletin? The Crime Survey for England and Wales estimated that 2.3 million people aged 16 years and over (1.6 million women and 712,000 men) experienced domestic abuse in year ending (YE) March 2024. There was no substantial change in the prevalence of domestic abuse experienced in the last year, compared with the previous year. The police recorded 851,062 domestic abuse-related crimes in England and Wales in YE March 2024; a decrease compared with the previous year (911,248), which, in part, reflects recent changes in police recording practices. Read this statistical bulletin More publications Crime trends in England and Wales and how we measure them Exploring the different ways we measure crime, which measure is best for different crime types, and some of the trends that emerge Back to top Datasets related to Crime and justice Nature of crime: violence Annual data from the Crime Survey for England and Wales (CSEW), including when and where incidents happened and the victim's perception of the incident. Drug misuse in England and Wales - Appendix table Data from the Crime Survey for England and Wales (CSEW) on the extent and trends of illicit drug use. Offences involving the use of weapons: data tables Data tables relating to offences involving weapons as recorded by police and hospital episode statistics. The nature of violent crime: appendix tables Data from the Crime Survey for England and Wales (CSEW) on violence with and without injury, and harassment, and police recorded crime on violence against the person and sexual offences. Nature of crime: fraud and computer misuse Annual data on the nature of fraud and computer misuse offences. Data for the year ending March 2021 and March 2022 are from the Telephone-operated Crime Survey for England and Wales (TCSEW). Nature of fraud and computer misuse in England and Wales: appendix tables Data from the Crime Survey for England and Wales (CSEW) and the National Fraud Intelligence Bureau (NFIB), including numbers of incidents and characteristics of victims. View all datasets related to Crime and justice Back to top Publications related to Crime and justice Statistical bulletins Crime in England and Wales: year ending September 2024 Crime against households and people aged 16 years and over, using data from police recorded crime and the Crime Survey for England and Wales (CSEW). Domestic abuse in England and Wales overview: November 2024 Figures on domestic abuse from the Crime Survey for England and Wales, police recorded crime, and other organisations. Experiences of harassment in England and Wales: December 2023 Estimates on the experiences and nature of harassment from the Crime Survey for England and Wales (CSEW). Sexual offences in England and Wales overview: year ending March 2022 Data on sexual offences from the year ending March 2022 Crime Survey for England and Wales, police recorded crime, and victim services. View all related statistical bulletins Articles Crime trends in England and Wales and how we measure them Exploring the different ways we measure crime, which measure is best for different crime types, and some of the trends that emerge Improving crime statistics for England and Wales – progress update Latest update on the progress being made to improve crime statistics for England and Wales. The nature of violent crime in England and Wales An overview of the extent of violent crime in England and Wales, including long-term trends, use of weapons, and victim characteristics. Drug misuse in England and Wales An overview of the extent and trends of illicit drug use. Data are from the Crime Survey for England and Wales. Crime in England and Wales, victim characteristics Risk of victimisation using Crime Survey for England and Wales (CSEW) data, including crime experiences of non-household populations using administrative data. Homicide in England and Wales Analyses of information held within the Home Office Homicide Index, which contains detailed record-level information about each homicide recorded by police in England and Wales. View all related articles Back to top Methodology related to Crime and justice Action plan for improving the quality of police recorded crime statistics in England and Wales Exploring diverging trends between the Crime Survey for England and Wales and police recorded crime Crime in England and Wales QMI User guide to crime statistics for England and Wales: March 2024 Crime Survey for England and Wales data quality review: June 2024 Measuring drug-related homicide methodology: February 2024 Transformation of the Crime Survey for England and Wales - Discovery research on the redesign of multi-mode questions View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
