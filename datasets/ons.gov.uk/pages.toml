["https://ons.gov.uk/economy/inflationandpriceindices"]
title = "Inflation and price indices - Office for National Statistics"
description = "The rate of inflation is the change in prices for goods and services over time. Measures of inflation and prices include consumer price inflation, producer price inflation and the House Price Index."
full_description = '''Inflation and price indices The rate of inflation is the change in prices for goods and services over time. Measures of inflation and prices include consumer price inflation, producer price inflation and the House Price Index. On this page: Time series Dataset Publications Methodology View all content related to this topic: All data All publications All statements and letters Spotlight <![endif]--> <img class="img-sparkline js--hide" src="/economy/inflationandpriceindices/timeseries/l55o/mm23/sparklineimage" alt="CPIH ANNUAL RATE 00: ALL ITEMS 2015&#x3D;100 between 1989 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> CPIH ANNUAL RATE 00: ALL ITEMS 2015=100 Change over 12 months 3.9 % 2025 JAN Release date: 19 February 2025 Next release: 26 March 2025 View this data More data Consumer price inflation, UK: January 2025 What's in the bulletin? The Consumer Prices Index including owner occupiers' housing costs (CPIH) rose by 3.9% in the 12 months to January 2025, up from 3.5% in December 2024. On a monthly basis, CPIH was little changed in January 2025, compared with a 0.4% fall in January 2024. The Consumer Prices Index (CPI) rose by 3.0% in the 12 months to January 2025, up from 2.5% in the 12 months to December 2024. Read this statistical bulletin More publications How is inflation affecting your household costs? Use our inflation calculator to see how increases in the cost of living have affected you in the past year. Back to top Time series related to Inflation and price indices CPIH ANNUAL RATE 00: ALL ITEMS 2015=100 Change over 12 months <![endif]--> <img class="img-sparkline js--hide" src="/economy/inflationandpriceindices/timeseries/l55o/mm23/sparklineimage" alt="CPIH ANNUAL RATE 00: ALL ITEMS 2015&#x3D;100 between 1989 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 3.9 % 2025 JAN Release date: 19 February 2025 Next release: 26 March 2025 CPIH INDEX 00: ALL ITEMS 2015=100 Index, 2015 = 100 <![endif]--> <img class="img-sparkline js--hide" src="/economy/inflationandpriceindices/timeseries/l522/mm23/sparklineimage" alt="CPIH INDEX 00: ALL ITEMS 2015&#x3D;100 between 1988 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 135.1 Index, base year = 100 2025 JAN Release date: 19 February 2025 Next release: 26 March 2025 CPI ANNUAL RATE 00: ALL ITEMS 2015=100 Change over 12 months <![endif]--> <img class="img-sparkline js--hide" src="/economy/inflationandpriceindices/timeseries/d7g7/mm23/sparklineimage" alt="CPI ANNUAL RATE 00: ALL ITEMS 2015&#x3D;100 between 1989 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 3 % 2025 JAN Release date: 19 February 2025 Next release: 26 March 2025 CPI INDEX 00: ALL ITEMS 2015=100 Index, 2015 = 100 <![endif]--> <img class="img-sparkline js--hide" src="/economy/inflationandpriceindices/timeseries/d7bt/mm23/sparklineimage" alt="CPI INDEX 00: ALL ITEMS 2015&#x3D;100 between 1988 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 135.4 Index, base year = 100 2025 JAN Release date: 19 February 2025 Next release: 26 March 2025 RPI All Items: Percentage change over 12 months: Jan 1987=100 Not a National Statistic. Change over 12 months <![endif]--> <img class="img-sparkline js--hide" src="/economy/inflationandpriceindices/timeseries/czbh/mm23/sparklineimage" alt="RPI All Items: Percentage change over 12 months: Jan 1987&#x3D;100 between 1948 JUN and 2025 JAN "> <!--[if gt IE 8]><!--> 3.6 % 2025 JAN Release date: 19 February 2025 Next release: 26 March 2025 RPI All Items Index: Jan 1987=100 Not a National Statistic. Index, 1987 = 100 <![endif]--> <img class="img-sparkline js--hide" src="/economy/inflationandpriceindices/timeseries/chaw/mm23/sparklineimage" alt="RPI All Items Index: Jan 1987&#x3D;100 between 1987 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 391.7 Index, base year = 100 2025 JAN Release date: 19 February 2025 Next release: 26 March 2025 View all time series related to Inflation and price indices Back to top Datasets related to Inflation and price indices Consumer price inflation tables Measures of monthly UK inflation data including CPIH, CPI and RPI. These tables complement the consumer price inflation time series dataset. Consumer price inflation time series Comprehensive database of time series covering measures of inflation data for the UK including CPIH, CPI and RPI. Consumer price inflation item indices and price quotes Price quote data (for locally collected items only) and item indices that underpin consumer price inflation statistics, giving users access to the detailed data that are used in the construction of the UK’s inflation figures. The data are being made available for research purposes only and are not an accredited official statistic. From October 2024, private school fees and part-time education classes have been included in the item indices file. Index of Private Housing Rental Prices, UK: monthly estimates Rental price statistics historical data time series (indices and annual percentage change). These are official statistics in development. House price data: quarterly tables Quarterly house price data based on a sub-sample of the Regulated Mortgage Survey. View all datasets related to Inflation and price indices Back to top Publications related to Inflation and price indices Statistical bulletins Consumer price inflation, UK: January 2025 Price indices, percentage changes, and weights for the different measures of consumer price inflation. Producer price inflation, UK: January 2025 Changes in the prices of goods bought and sold by UK manufacturers, including price indices of materials and fuels purchased (input prices) and factory gate prices (output prices). Private rent and house prices, UK: February 2025 The Price Index of Private Rents (PIPR) measures private rent inflation for new and existing tenancies. The UK House Price Index measures house price inflation. Household Costs Indices for UK household groups: October to December 2024 Household Costs Indices, 12-month growth rates, expenditure shares and contributions for UK household groups and all-households. These are official statistics in development. Index of Private Housing Rental Prices, UK: January 2024 An experimental price index tracking the prices paid for renting property from private landlords in the UK. UK House Price Index: December 2023 Monthly house price inflation in the UK, calculated using data from HM Land Registry, Registers of Scotland, and Land and Property Services Northern Ireland. View all related statistical bulletins Articles Cost of living latest insights The latest data and trends about the cost of living. Explore changes in the cost of everyday items and how this is affecting people. What are your wages worth? Use our calculator to find out if your salary is keeping pace with inflation. What's in the basket of goods? 70 years of shopping history Explore how the basket of goods has changed over the decades and how the ONS calculates inflation. Train tickets and hybrid cars: understanding spending habits New data shows the effect of strikes on train ticket sales, and the most popular second-hand cars in Great Britain Consumer prices development plan An update on the proposed development plan for consumer price statistics. Includes the rationale for our priorities and their potential impact. Transformation of consumer price statistics An update on the programme of transformation across consumer price statistics, including identifying new data sources, improving methods and developing systems. View all related articles Back to top Methodology related to Inflation and price indices Consumer Price Inflation (includes all 3 indices – CPIH, CPI and RPI) QMI Retail sales Users and uses of consumer price inflation statistics: July 2018 update View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom.'''
