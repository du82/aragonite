["https://ons.gov.uk/aboutus"]
title = "About us - Office for National Statistics"
description = "The Office for National Statistics (ONS) is the UK’s largest independent producer of official statistics"
full_description = "About us We are the UK’s largest independent producer of official statistics and its recognised national statistical institute. We are responsible for collecting and publishing statistics related to the economy, population and society at national, regional and local levels. We also conduct the census in England and Wales every 10 years. What we do Our main responsibilities are collecting, analysing and disseminating statistics about the UK's economy, society and population Careers Career opportunities and information about working for us Transparency and governance Information about our structure and spending, and how you can make a Freedom of Information request for other information Contact us Our contact details and office locations Using public data to produce statistics We collect and process your data safely and securely to publish statistics that benefit us all. We are independent of ministers and instead report through the UK Statistics Authority to Parliament and the devolved administrations of Scotland, Wales and Northern Ireland. We are the executive office of the UK Statistics Authority, who are responsible for promoting and safeguarding the production and publication of official statistics which serve the public good.CommercialONS has a dedicated Commercial Services team, which is responsible for Procurement, Contract Management and Commercial Intelligence.If you are interested in becoming an ONS supplier, or bidding for an ongoing Procurement, please register your details at our portal.Alternatively please email us at pu.customer.services@ons.gov.uk.All contracts over £10,000 will be added to Contracts Finder, as mandated by the Public Contracts Regulations 2015."
