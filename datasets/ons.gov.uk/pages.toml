title = "Gross Domestic Product (GDP) - Office for National Statistics"
description = "Gross domestic product (GDP) estimates as the main measure of UK economic growth based on the value of goods and services produced during a given period. Preliminary, secondary and final estimates of GDP released over a quarter as data becomes available."
full_description = '''Gross Domestic Product (GDP) Gross domestic product (GDP) estimates are the main measure of UK economic growth based on the value of goods and services produced during a given period. GDP estimates are produced monthly, quarterly and annually as part of the revisions cycle to ensure the timely release of data throughout the year. Our GDP monthly estimate consists of output data and is our most timely official estimate of economic growth. The two publication stages for quarterly estimates are our GDP first quarterly estimate and our quarterly national accounts, which include data on output, expenditure and income. On this page: Time series Dataset Publications Methodology View all content related to this topic: All data All publications Spotlight GDP quarterly national accounts, UK: July to September 2024 What's in the bulletin? UK real gross domestic product (GDP) is estimated to have shown no growth in Quarter 3 (July to Sept) 2024, revised down from the first estimate increase of 0.1%. The quarterly path of real GDP at an aggregate level is unchanged from Quarter 1 (Jan to Mar) 2023 to Quarter 1 2024, however, there have been downward revisions of 0.1 percentage points in Quarter 2 (Apr to June) and Quarter 3 2024. Within the output approach to measuring GDP, there was no growth in the services sector in the latest quarter, whilst a 0.7% increase in construction was offset by a 0.4% fall in production. Read this statistical bulletin More publications GDP monthly estimate, UK: December 2024 What's in the bulletin? Monthly real gross domestic product (GDP) is estimated to have grown by 0.4% in December 2024; this is largely because of growth in the service sector, following an unrevised growth of 0.1% in November 2024. Real GDP is estimated to have grown by 0.1% in the three months to December 2024, compared with the three months to September 2024, mainly because of growth in the services sector. Monthly services output grew by 0.4% in December 2024, following growth of 0.2% in November 2024 (revised up from 0.1% growth in our previous publication), and grew by 0.2% in the three months to December 2024. Read this statistical bulletin More publications Back to top Time series related to Gross Domestic Product (GDP) Gross Domestic Product: chained volume measures: Seasonally adjusted £m Chained Volume Measures (CVM) <![endif]--> <img class="img-sparkline js--hide" src="/economy/grossdomesticproductgdp/timeseries/abmi/qna/sparklineimage" alt="Gross Domestic Product: chained volume measures: Seasonally adjusted £m between 1955 Q1 and 2024 Q3 "> <!--[if gt IE 8]><!--> £ 639,452 m 2024 Q3 Release date: 23 December 2024 Next release: 13 February 2025 Gross Domestic Product: Quarter on Quarter growth: CVM SA % Chained Volume Measures (CVM) <![endif]--> <img class="img-sparkline js--hide" src="/economy/grossdomesticproductgdp/timeseries/ihyq/qna/sparklineimage" alt="Gross Domestic Product: Quarter on Quarter growth: CVM SA % between 1955 Q2 and 2024 Q3 "> <!--[if gt IE 8]><!--> 0 % 2024 Q3 Release date: 23 December 2024 Next release: 13 February 2025 Gross Domestic Product: q-on-q4 growth rate CVM SA % Chained Volume Measures (CVM) <![endif]--> <img class="img-sparkline js--hide" src="/economy/grossdomesticproductgdp/timeseries/ihyr/qna/sparklineimage" alt="Gross Domestic Product: q-on-q4 growth rate CVM SA % between 1956 Q1 and 2024 Q3 "> <!--[if gt IE 8]><!--> 0.9 % 2024 Q3 Release date: 23 December 2024 Next release: 13 February 2025 Gross Domestic Product at market prices: Current price: Seasonally adjusted £m Current Prices (CP) <![endif]--> <img class="img-sparkline js--hide" src="/economy/grossdomesticproductgdp/timeseries/ybha/qna/sparklineimage" alt="Gross Domestic Product at market prices: Current price: Seasonally adjusted £m between 1955 Q1 and 2024 Q3 "> <!--[if gt IE 8]><!--> £ 712,652 m 2024 Q3 Release date: 23 December 2024 Next release: 13 February 2025 Gross Domestic Product: quarter on quarter growth rate: CP SA % Current Prices (CP) <![endif]--> <img class="img-sparkline js--hide" src="/economy/grossdomesticproductgdp/timeseries/ihyn/qna/sparklineimage" alt="Gross Domestic Product: quarter on quarter growth rate: CP SA % between 1955 Q2 and 2024 Q3 "> <!--[if gt IE 8]><!--> 1.2 % 2024 Q3 Release date: 23 December 2024 Next release: 13 February 2025 Gross Domestic Product: q-on-q4 growth quarter growth: CP SA % Current Prices (CP) <![endif]--> <img class="img-sparkline js--hide" src="/economy/grossdomesticproductgdp/timeseries/ihyo/qna/sparklineimage" alt="Gross Domestic Product: q-on-q4 growth quarter growth: CP SA % between 1956 Q1 and 2024 Q3 "> <!--[if gt IE 8]><!--> 4 % 2024 Q3 Release date: 23 December 2024 Next release: 13 February 2025 View all time series related to Gross Domestic Product (GDP) Back to top Datasets related to Gross Domestic Product (GDP) Monthly gross domestic product by gross value added Gross value added (GVA) tables showing the monthly and annual growths and indices as published within the monthly gross domestic product (GDP) statistical bulletin. Contributions to monthly GDP Contributions to growth within monthly gross domestic product (GDP), UK Revisions triangles Comparison of gross domestic product (GDP) first estimates against estimates published later. Monthly GDP and main sectors to four decimal places Monthly index values for monthly gross domestic product (GDP) and the main sectors in the UK to four decimal places. Health volume adjustments and contribution to GDP growth Volume estimates for the NHS Test and Trace services and vaccine programmes and their impact on real GDP. GDP output approach, Blue Book 2023 indicative data Detailed industry level data. Includes monthly low-level aggregates of output gross value added (GVA) on a chained volume measure. Seasonally adjusted. View all datasets related to Gross Domestic Product (GDP) Back to top Publications related to Gross Domestic Product (GDP) Statistical bulletins GDP monthly estimate, UK: December 2024 Gross domestic product (GDP) measures the value of goods and services produced in the UK. It estimates the size of and growth in the economy. Regional economic activity by gross domestic product, UK: 1998 to 2022 Annual estimates of economic activity by UK country, region and local area using gross domestic product (GDP). Estimates are available in current market prices and in chained volume measures and include a full industry breakdown of balanced regional gross value added (GVA(B)). GDP quarterly national accounts, UK: July to September 2024 Revised quarterly estimate of gross domestic product (GDP) for the UK. Uses additional data to provide a more precise indication of economic growth than the first estimate. GDP first quarterly estimate, UK: October to December 2024 First quarterly estimate of gross domestic product (GDP). Contains current and constant price data on the value of goods and services to indicate the economic performance of the UK. Business investment in the UK: October to December 2024 provisional results Estimates of short-term indicators of investment in non-financial assets; business investment, and asset and sector breakdowns of total gross fixed capital formation. GDP, UK regions and countries: July to September 2022 Quarterly economic activity within the countries of the UK (England, Wales, Scotland and Northern Ireland) and the nine English regions (North East, North West, Yorkshire and The Humber, East Midlands, West Midlands, East of England, London, South East and South West). View all related statistical bulletins Articles Summary of changes to data table structure in Blue Book 2023 Changes to the structure of tables within Blue Book 2023 to meet accessibility standards. Coronavirus and the impact on output in the UK economy Analysis of growth for the production, services and construction industries in the UK economy between February 2020 and August 2021, highlighting the impact of the coronavirus (COVID-19) pandemic. The role of labour costs and profits in UK inflation Analysis of trends in unit labour costs and unit profits as contributions to domestic inflation using the national accounts and the income approach to GDP. The 2008 recession 10 years on A decade after the beginning of the recession, how has the UK economy recovered? What is GDP? Find out more how Gross Domestic Product is used to measure the size and health of a country’s economy. GDP and me What's GDP go to do with you and me? Find out how your spending and work can affect GDP. View all related articles Back to top Methodology related to Gross Domestic Product (GDP) Gross and net measures of the UK economy Improvements to non-market adult social care output in the National Accounts Output approach to gross domestic product (GDP) Gross domestic product (GDP) QMI Quarterly Acquisitions and Disposals of Capital Assets Survey QMI Communicating the UK Economic Cycle View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom.'''
