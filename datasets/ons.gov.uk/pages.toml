title = "Construction development - Office for National Statistics"
description = "Description of the improvements that have been incorporated into construction output, as part of Blue Book 2017, including the impact of the changes."
full_description = '''1. Main points For the Quarterly National Accounts: April to June 2017 publication, improvements have been implemented to construction output from Quarter 1 (Jan to Mar) 2010, leading to revisions. These are as a result to improvements in nominal data, output price indices and seasonal adjustment. The annual growth rate for 2016 has been revised from 2.4% to 3.8%. There are implied revisions rounded to one decimal place of 0.1 percentage points to the output approach to gross domestic product (GDP) in three quarters, assuming all other components are equal: a negative revision to Quarter 1 (Jan to Mar) 2015; and an upward revision for Quarter 2 (Apr to June) 2016 and Quarter 4 (Oct to Dec) 2016. Back to table of contents 2. Introduction This article will describe the improvements that have been incorporated into Construction output statistics, as part of the Blue Book 2017, and show the impact of the changes. These changes are the receipt of additional survey data, nominal data size band adjustments, improvements to the Construction Output Price Indices, and a review of seasonal adjustment.Construction output statistics are published monthly, and follow the standard revisions policy for national accounts. As a result, within the Quarterly National Accounts publication, and Blue Book 2017, Construction output is open to revisions for the entire monthly series. This is back to January 2010, when the monthly construction survey was introduced, replacing the previous quarterly survey.This survey collects output by sector from businesses in the construction industry within Great Britain. The survey’s results are used to produce seasonally adjusted monthly, quarterly and annual estimates of output in the construction industry at current price and at chained volume measures (removing the effect of inflation).A common cause for revisions is the return of late data to the survey. Returns for businesses that have not responded are imputed and it is likely that there will be a difference between the imputation and the late returned value. Under the revisions policy, the 2016 reference period has not been open for revision for over six months, since the Construction output publication for January. This has allowed time for a number of late returns to be received, particularly for the latter months of 2016.Nominal data can also be revised by changes in classifications and statistical methods. As it is not possible to survey every business in the population, it is necessary to weight the data from the sample of businesses to provide estimates for the full population. These weights depend upon the size band classification of the business and this classification has been reviewed for some businesses.Construction Output Price Indices (OPIs) are used in the production of chained volume measures for construction output, to remove the effects of price change. They are used by both Construction output and Construction new orders, to deflate the nominal data.In December 2014, the Department for Business, Innovation and Skills (BIS) announced the suspension of its publication of Construction Price and Cost Indices (CPCIs). This led to the suspension of the National Statistics status for Construction output, new orders, and prices. In April 2015, responsibility for the production of the CPCIs transferred from BIS to Office for National Statistics (ONS). We produced an interim solution for construction price indices in June 2015, which have been used for deflation from the January 2014 reference period onwards. These are available in the quarterly Construction output price indices articles. A work plan was published in December 2015, outlining the work plan for the development of these indicesThe Construction output series is seasonally adjusted using a seasonal adjustment software tool called X-13ARIMA-SEATS. Eurostat guidelines on seasonal adjustment indicate that short time series (three to seven years) can be unstable, and the Construction output monthly series is now just seven and a half years in length. There is potential for large revisions to the seasonally adjusted data as more data becomes available and the series matures. The seasonal adjustment model for construction output is reviewed annually. Back to table of contents 3. Nominal data improvements The receipt of late data, and adjustments as a result of size band reclassifications, are both causes of revisions in the latest data.Late returnsRevisions to nominal data can be made for a variety of reasons, but one of the most common reasons is the receipt of late responses to surveys. These responses will replace the value that had previously been imputed for the business, and a difference between these two values will have an impact on the nominal data totals in a number of ways: individual impact on nominal data total for the period in question impact on impute for business in subsequent periods (if no returned data) impact on the imputation link for businesses still being imputed for the period in question By following the national accounts revision policy, it is not possible for construction output to take on all late responses each month. These responses are held, until that period becomes part of the open period. Table 1 shows the last time that the most recent months were open for revision. Table 1: Most recent publication that a reference period was open for revision .b1{white-space-collapsing:preserve;} .t1{border-collapse:collapse;border-spacing:0;} .r-cd031c0a-c797-4b0f-9630-958f295999e6-1{height:15.0pt;} .r-cd031c0a-c797-4b0f-9630-958f295999e6-2{height:30.0pt;} Reference PeriodMost recent open publication January 2016Construction output in Great Britain: January 2017 February 2016 to October 2016Construction output in Great Britain: January 2017 November 2016Construction output in Great Britain: January 2017 December 2016Construction output in Great Britain: January 2017 January 2017Construction output in Great Britain: April 2017 February 2017Construction output in Great Britain: April 2017 March 2017Construction output in Great Britain: April 2017 April 2017Construction output in Great Britain: June 2017 May 2017Construction output in Great Britain: June 2017 June 2017Construction output in Great Britain: June 2017 Source: Office for National Statistics (function(){function c(){var b=a.contentDocument||a.contentWindow.document;if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'91c70854fbe5c5a5',t:'MTc0MTMxODQxOS4wMDAwMDA='};var a=document.createElement('script');a.nonce='';a.src='/cdn-cgi/challenge-platform/scripts/jsd/main.js';document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})(); Download this table Table 1: Most recent publication that a reference period was open for revision .xls (27.1 kB) Figure 1 displays the percentage of returned forms for construction period, at the most recent open publication, as listed in Table 1, compared with the latest data. Figure 1: Percentage of cleared returned forms, monthly construction survey Great Britain, January 2016 to June 2017 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/articles/constructiondevelopment/impactofimprovementstoconstructionstatistics/a6a25e91&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics Notes: Cleared returned forms indicate that a response has been received from a business and has been accepted and processed. These rates differ from the published Construction output response rates, which just represent the amount of responses that have been received from businesses. Download this chart Figure 1: Percentage of cleared returned forms, monthly construction survey Image .csv .xls Where upward revisions have taken place in previous periods, this can lead to an increase in level for the most recent periods – regardless of whether there are also other revisions in these periods. In the monthly publications, construction output is constrained to the closed period by growth rate. This ensures that the monthly growth rates are correct, but can have an impact on the monthly levels and quarterly series.For this publication, the months of November and December 2016 have had the largest upward revisions, as a result of processing the additional data. Across these two months, nearly 600 forms have been returned and cleared. In 53% of cases, the returned value was higher than the previously imputed value, compared with 44% of cases where it was lower. There is a net increase from returns replacing imputations as a result of these percentages, and this is the largest net cause for the overall upward revision, along with the consequential impact on the continued imputations.Size band adjustmentsThe monthly construction survey is sent to all businesses with 100 or more employees, as well as businesses with low employment and exceptionally large turnover. This is defined as an annual turnover of £60 million or more, with a minimum amount of 10 employees. A sample is made of all other businesses with fewer than 100 employees and their responses are multiplied by sampling weights, to account for the entire population. These weights are usually larger for the lowest 0 to 4 employees category, as only a small proportion of these businesses are included in the sample.Analysis of this low employee category has found that from December 2014 to June 2016, a number of joint-venture businesses were included in the sample. These are partnerships between two larger companies, whose work is focused on the infrastructure sector. These businesses returned larger values than other low employment businesses, but were receiving the same sampling weights, resulting in an over-estimate of infrastructure work. These businesses have now been re-categorised as “low employment, and exceptionally large turnover businesses", to prevent sampling weights from being applied incorrectly. Back to table of contents 4. Impact on nominal data series Figures 2 and 3 display the latest versions of the nominal data series for the infrastructure sector and all construction work respectively.The size band adjustments affect the infrastructure series from November 2014 to June 2016, causing downward revisions across the period. The annual current price growth rate for 2015 has been revised downwards from 33.2% to 22.7% as a result. Figure 2 highlights the impact this has had on the time series. The similarity in series for recent months shows that the late returns have not had a notable impact on infrastructure. Figure 2: Comparison of construction output, infrastructure new work, current price, non-seasonally adjusted series Great Britain, January 2014 to June 2017 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/articles/constructiondevelopment/impactofimprovementstoconstructionstatistics/c0e19404&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics Download this chart Figure 2: Comparison of construction output, infrastructure new work, current price, non-seasonally adjusted series Image .csv .xls The impact of those adjustments on the all work series is that the 2015 annual current price growth rate is reduced from 6.5% to 5.3%. The impact of late returns becomes clear in the second half of 2016 and into 2017, as seen in Figure 3. Figure 3: Comparison of construction output, all work, current price, non-seasonally adjusted series Great Britain, January 2014 to June 2017 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/articles/constructiondevelopment/impactofimprovementstoconstructionstatistics/dc80af07&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics Download this chart Figure 3: Comparison of construction output, all work, current price, non-seasonally adjusted series Image .csv .xls Back to table of contents 5. Price indices improvements Information on the current methods used to compile the interim Construction Output Price Indices (OPIs) is available. To measure price change for the new work projects, price changes for three categories of inputs are measured: labour, materials, and plants. A set of weights is then applied to combine these components together, to create the overall indices. Repair and maintenance indices only include the labour and materials series. A limitation of this approach is that it assumes that input costs move in the same way as output prices, meaning that the margins of construction companies are constant, and zero, through time.The Construction Statistic Development Programme work plan highlighted three approaches for developing improvements to these indices:• creation of a tender price index (TPI) using administrative sources with a view to converting to an output price index (OPI)• using available data on construction inputs to create an input price series with a view to converting to an OPI• collecting data from businesses, either through a survey or an administrative source, on output pricesAdministrative data sources were investigated, with a view to developing a hedonic regression approach for creating a tender price index; alongside the option of conducting a survey on prices. Having reviewed the options available, and with agreement of the Construction Statistics Steering Group , the most viable approach has been to focus on the input cost indices and their conversion into output price indices. The following improvements have now been implemented:• new weights for the labour, materials and plant combinations• revised methodology of the labour component for the new work indices• review of the processes used in the materials component for the new work indices• a new method for calculating the materials component for the housing repair and maintenance series• the introduction of a plant component for repair and maintenance indices• incorporation of a mark-up for profit margin, following collaboration with Dr. Xuxin Mao of University College London (UCL)As a result of these changes, although further improvements are still planned, we no longer consider the OPIs to be an interim method.Labour, materials and plant weightsThe weights for combining together the labour, materials and plant components of the price indices are determined using data from the Annual Business Survey (ABS). Table 2:'''
