full_description = "Activity, size and location UK businesses broken down by location, industry, legal status and employment, and UK enterprise levels measured by turnover. On this page: Dataset Publications Methodology View all content related to this topic: All data All publications Spotlight UK business; activity, size and location: 2024 What's in the bulletin? The number of businesses in the UK registered for Value Added Tax (VAT) and/or Pay as You Earn (PAYE), as of March 2024, was 2.72 million, a decrease of 0.1% from March 2023. The number of companies continued to rise and they now represent 75.6% of total UK businesses, while the proportion of sole proprietors has decreased to 14.6% and that of partnerships has decreased to 6.1%. The number of transport and storage businesses grew strongly in 2020 and 2021 but has decreased since, down 9.1% in 2024. Read this statistical bulletin More publications Business demography, quarterly, UK: October to December 2024 What's in the bulletin? The number of businesses added to the Inter-Departmental Business Register (IDBR) (business creations) in the UK in Quarter 4 (Oct to Dec) 2024 was 65,450, a fall of 8.5% on Quarter 4 2023. The number of business creations in Quarter 4 2024 is the lowest since the start of the quarterly data series in Quarter 1 2017. There was a decrease in creations in 13 out of 16 main industrial groups in Quarter 4 2024 compared with Quarter 4 2023, with the most significant falls coming from the transport and storage, and business administration and support services industries. Read this statistical bulletin More publications Back to top Datasets related to Activity, size and location Business demography, UK Annual data on births, deaths and survival of businesses in the UK, by geographical area and Standard Industrial Classification 2007: SIC 2007 groups. Business demography, quarterly, UK Business births and deaths from the Inter-Departmental Business Register with high-level breakdowns by industry and region. Quarterly official statistics in development. UK business: activity, size and location Numbers of enterprises and local units produced from a snapshot of the Inter-Departmental Business Register (IDBR) taken on 8 March 2024. View all datasets related to Activity, size and location Back to top Publications related to Activity, size and location Statistical bulletins Business demography, quarterly, UK: October to December 2024 Business creations or births and closures or deaths from the Inter-Departmental Business Register (IDBR), with high-level breakdowns by industry and region. These are official statistics in development. UK business; activity, size and location: 2024 UK businesses broken down by legal status, industry, region, employment and turnover size bands. Business demography, UK: 2023 Annual change in the number of UK businesses broken down by sector of the economy. View all related statistical bulletins Articles Multiple business registrations at a single postcode, UK Business demography explainer covering additional information on the impact of multiple registrations at a single postcode. View all related articles Back to top Methodology related to Activity, size and location Business demography QMI Annual Business Survey (ABS) Monthly Business Survey QMI UK business; activity, size and location QMI View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
