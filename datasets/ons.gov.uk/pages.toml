title = "Business services - Office for National Statistics"
description = "Size and growth of the UK non-financial business economy as measured by the Annual Business Survey (ABS), and the value of e-commerce and the adoption and use of information and communication technologies (ICTs) by UK businesses."
full_description = "Business services Size and growth of the UK non-financial business economy as measured by the Annual Business Survey (ABS), and the value of e-commerce and the adoption and use of information and communication technologies (ICTs) by UK businesses. On this page: Dataset Publications Methodology View all content related to this topic: All data All publications Spotlight Business insights and impact on the UK economy: 6 March 2025 What's in the bulletin? In late February 2025, more than a third (36%) of businesses with 10 or more employees reported that their staffing costs (including wages, bonuses, national insurance (NI) and pension contributions) had increased over the last 3 months, up 5 percentage points compared with late November 2024, and up 2 percentage points compared with late February 2024. In late February 2025, around two-thirds (67%) of businesses with 10 or more employees expected their staffing costs to increase over the next 3 months, up 26 percentage points from late November 2024; some businesses commented that increases in employer NI contributions and the national living wage in April 2025 were contributing factors to this. When asked in late February 2025, nearly half (49%) of businesses with 10 or more employeWhen asked in late February 2025, nearly half (49%) of businesses with 10 or more employees reported they would adapt to future rises in employment costs by increasing prices, while 26% reported they would reduce their number of employees, both up 9 percentage points compared with late September 2024; 32% reported that they would absorb the costs within their profit margins, broadly stable over the same period. es reported they would adapt to future rises in employment costs by increasing prices, while 26% reported they would reduce their number of employees, both up 9 percentage points compared with late September 2024; 32% reported that they would absorb the costs within their profit margins, broadly stable over the same period. Read this statistical bulletin More publications Non-financial business economy, UK (Annual Business Survey): 2022 results What's in the bulletin? In 2022, approximate gross value added (aGVA) at basic prices of the UK non-financial business economy was estimated to be £1,592.7 billion; an increase of £217.0 billion (15.8%) compared with 2021. The non-financial services sector, which accounted for over half (56.2%) of total aGVA in 2022, increased by £128.2 billion (16.7%) to £894.6 billion; professional, scientific and technical activities saw the largest increase in aGVA of £27.0 billion (13.8%), from £195.4 billion to £222.3 billion. Total turnover and purchases of the UK non-financial business economy were estimated to be £4,931.3 billion and £3,356.6 billion, respectively; an increase of £808.5 billion (19.6%) and £611.5 billion (22.3%) compared with 2021. Read this statistical bulletin More publications Back to top Datasets related to Business services Business impact of coronavirus, analysis over time, UK: Waves 2 to 5 panel The indicators and analysis presented in this article are based on selected responses over time from the new voluntary fortnightly business survey, which captures businesses responses on how their turnover, workforce, prices, trade and business resilience have been affected in the two week reference period. This data relates to the period 23 March 2020 to 17 May 2020 (Wave 2 to Wave 5). Non-financial business economy, UK: Sections A to S Size and growth within UK non-financial business sectors, as measured by the Annual Business Survey, by four-digit Standard Industrial Classification 2007. Non-financial business economy, regional results: Sections A to S Annual data on business turnover, approximate gross value added (aGVA), purchases and employment costs, from the Annual Business Survey. Two-digit Standard Industrial Classification 2007 group by region or country. Foreign-owned businesses in the UK: business count, turnover and aGVA, from the Annual Business Survey Annual estimates of foreign-owned businesses by industry group, section, employment and turnover group, and country breakdown. Non-financial business economy, regional results: quality measures Annual data on quality measures for business turnover, approximate gross value added (aGVA), purchases and employment costs, from the Annual Business Survey. Annual Business Survey exporters and importers Exporters and importers of goods and services in Great Britain by employment size and turnover size. View all datasets related to Business services Back to top Publications related to Business services Statistical bulletins Non-financial business economy, UK (Annual Business Survey): 2022 results Size and growth within the UK non-financial sectors, as measured by the Annual Business Survey. Energy, goods and services used by UK businesses: 2022 Expenditure on energy, goods and services used as inputs to UK business processes by product type and industry. Estimates from the 2022 Annual Purchases Survey. Non-financial business economy, UK (Annual Business Survey): 2017 provisional results Size and growth within the UK's non-financial business sectors: non-financial services, distribution, production, construction and agriculture. Non-financial business economy, UK (Annual Business Survey): 2016 regional results Size and growth within the UK's non-financial business sectors: non-financial services, distribution, production, construction and agriculture. View all related statistical bulletins Articles Foreign-owned businesses in the UK non-financial business economy Annual estimates of the number of foreign-owned businesses, turnover and approximate gross value added (aGVA) in the UK non-financial business economy for 2021 and revised estimates for 2020, from the Annual Business Survey (ABS). View all related articles Back to top Methodology related to Business services Annual Purchases Survey QMI Annual Purchases Survey: technical report Annual Business Survey (ABS) View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
