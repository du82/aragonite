title = "Construction output in Great Britain - Office for National Statistics"
description = "Short-term measures of output by the construction industry in December 2024, contracts for new construction work, and the Construction Output Price Indices."
full_description = '1. Main points Construction output is estimated to have increased by 0.5% in Quarter 4 (Oct to Dec) 2024 compared with Quarter 3 (July to Sept) 2024; this came solely from an increase in new work (1.2%), as repair and maintenance fell by 0.4%. Monthly construction output is estimated to have fallen by 0.2% in volume terms in December 2024; this came solely from a fall in repair and maintenance (1.8%) as new work grew by 1.1%. At the sector level, five out of the nine sectors fell in December 2024; the main contributors to the monthly decrease were non-housing repair and maintenance, and private housing repair and maintenance, which fell by 1.8% and 1.4%, respectively. Total construction new orders fell by 2.4% (£231 million) in Quarter 4 2024 compared with Quarter 3 2024; this quarterly decrease came solely from infrastructure new work and private industrial new work, which fell by 23.5% (£496 million) and 19.7% (£197 million), respectively. Annual construction output increased by 0.4% in 2024 compared with 2023; this is the fourth consecutive year of annual growth. The annual rate of construction output price growth was 3.0% in the 12 months to December 2024. Back to table of contents 2. Construction output in December 2024 Quarterly construction output is estimated to have grown by 0.5% in Quarter 4 (Oct to Dec) 2024. This was driven by growth in November 2024, up by 0.6% (revised from 0.4%), and followed no growth (0.0%) in October 2024 (revised from a fall of 0.3%).Monthly construction output is estimated to have fallen by 0.2% in volume terms in December 2024. Figure 1: The monthly all work construction output index in December 2024 saw a decrease on the month, coming solely from a fall in repair and maintenance (1.8%) as new work grew by 1.1% Monthly all work index, chained volume measure, seasonally adjusted, Great Britain, January 2010 to December 2024 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/bulletins/constructionoutputingreatbritain/december2024newordersandconstructionoutputpriceindicesoctobertodecember2024/ab033a30&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Construction output and employment data from the Office for National Statistics Download this chart Figure 1: The monthly all work construction output index in December 2024 saw a decrease on the month, coming solely from a fall in repair and maintenance (1.8%) as new work grew by 1.1% Image .csv .xls Anecdotal evidence received from returns for our Monthly Business Survey for Construction and Allied Trades (MBS) suggested a negative effect of seasonal weather decreasing output. The Met Office confirmed in their Monthly climate summary (PDF, 5.9MB) that December 2024 saw unsettled weather, with Storm Darragh bringing heavy rain and gales.Detailed growth rates Table 1: Construction output main figures, Great Britain, December 2024Seasonally adjusted, chained volume measure, £ million and percentage change Type of workValue £ millionMost recent month on the previous monthMost recent month on yearMost recent three-months on three-monthsMost recent three-months on year Total all work17,744-0.21.50.50.9 Total all new work9,9711.11.91.2-0.7 Total repair and maintenance7,773-1.81.0-0.42.9 New housing Public436-3.5-19.9-7.8-14.9 Private3,2412.36.21.33.9 Other new work Infrastructure2,4711.0-0.40.0-5.6 Public10000.711.84.36.8 Private industrial6523.00.56.42.3 Private commercial2,170-0.10.31.5-1.8 Repair and maintenance Public housing842-3.514.81.020.1 Private housing2,940-1.4-5.9-2.5-4.1 Non-housing3,991-1.84.00.85.4 Source: Construction output and employment data from the Office for National Statistics Download this table Table 1: Construction output main figures, Great Britain, December 2024 .xls .csv Quarter-on-quarter construction output growth in Quarter 4 2024Construction output grew by 0.5% (£241 million) in Quarter 4 2024. The quarterly growth came solely from an increase in new work (1.2%), as repair and maintenance fell by 0.4%. Figure 2: All work saw a rise in Quarter 4 2024 (0.5%) Contributions to quarterly growth (Quarter 4 (Oct to Dec) 2024 compared with Quarter 3 (July to Sept) 2024) chained volume measure, seasonally adjusted, Great Britain, percentage points <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/bulletins/constructionoutputingreatbritain/december2024newordersandconstructionoutputpriceindicesoctobertodecember2024/42c4b57e&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Construction output and employment data from the Office for National Statistics Notes: Please note that sector estimates may not sum because of rounding. Download this chart Figure 2: All work saw a rise in Quarter 4 2024 (0.5%) Image .csv .xls Of the nine sectors, six saw increases in Quarter 4 2024, with the largest contributors being private new housing and public other new work. These sectors grew by 1.3% (£127 million) and 4.3% (£121 million), respectively. Figure 3: The quarterly data series saw three periods of consecutive growth Quarter-on-quarter contributions to all work growth, chained volume measure, seasonally adjusted, Great Britain, Quarter 1 (Jan to Mar) 2021 to Quarter 4 (Oct to Dec) 2024 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/bulletins/constructionoutputingreatbritain/december2024newordersandconstructionoutputpriceindicesoctobertodecember2024/218d74a2&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Construction output and employment data from the Office for National Statistics Notes: Please note that sector estimates may not sum because of rounding. Download this chart Figure 3: The quarterly data series saw three periods of consecutive growth Image .csv .xls Month-on-month construction output growth in December 2024The 0.2% fall in construction output in December 2024 represents a decrease of £40 million in monetary terms compared with November 2024, with five out of the nine sectors seeing falls on the month. The volume in December 2024 was £17,744 million. Figure 4: All work saw a fall on the month in December 2024 (0.2%) with five out of the nine sectors showing decreases Contributions to monthly growth (December 2024 compared with November 2024), chained volume measure, seasonally adjusted, Great Britain, percentage points <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/bulletins/constructionoutputingreatbritain/december2024newordersandconstructionoutputpriceindicesoctobertodecember2024/8b36c26a&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Construction output and employment data from the Office for National Statistics Notes: Please note that sector estimates may not sum because of rounding. Download this chart Figure 4: All work saw a fall on the month in December 2024 (0.2%) with five out of the nine sectors showing decreases Image .csv .xls Non-housing repair and maintenance, and private housing repair and maintenance were the largest negative contributors to the monthly decrease in December 2024, decreasing by 1.8% (£74 million) and 1.4% (£41 million), respectively.Year-on-year change in construction output in 2024Total annual construction output increased by 0.4% in 2024 compared with 2023. This is the fourth consecutive year of annual growth.The annual increase in 2024 was solely because of a rise in repair and maintenance, which rose by 8.5%, as new work decreased by 5.3%.At the sector level, four of the nine sectors saw an increase in annual growth in 2024. Non-housing repair and maintenance, and private housing repair and maintenance were the largest positive contributors, growing by 8.5% and 7.0%, respectively. The main negative contributor to annual growth was infrastructure new work, which fell by 9.3%. Figure 5: Annual growth saw an increase in 2024, coming solely from an increase in repair and maintenance (8.5%), as new work fell by 5.3% Year-on-year contributions to all work growth, chained volume measure, seasonally adjusted, Great Britain, 2011 to 2024 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/bulletins/constructionoutputingreatbritain/december2024newordersandconstructionoutputpriceindicesoctobertodecember2024/2cd5ab59&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Construction output and employment data from the Office for National Statistics Download this chart Figure 5: Annual growth saw an increase in 2024, coming solely from an increase in repair and maintenance (8.5%), as new work fell by 5.3% Image .csv .xls Back to table of contents 3. New orders in the construction industry in Quarter 4 2024 In Quarter 4 (Oct to Dec) 2024, total construction new orders decreased by 2.4% (£231 million) compared with Quarter 3 (July to Sept) 2024. This follows a decrease of 23.7% in Quarter 3 2024 compared with Quarter 2 (Apr to June) 2024.Quarter 4 2024 showed the lowest level of total construction new orders (£9,268 million) since Quarter 2 2020 (£6,024 million). More information can be found in our New orders in the construction industry dataset.Other new orders (that is, non-housing) was the sole contributor to the decrease in Quarter 4 2024, falling by 9.1% (£671 million). This came from infrastructure new orders, which fell by 23.5% (£496 million) and was driven by decreases in electricity, harbours and railways. The other contributor to the fall in other new work was private industrial new orders, which decreased by 19.7% (£197 million).Housing new orders saw an increase of 21.2% (£442 million). This came predominantly from private new housing, which increased by 24.0% (£438 million). Public new housing also increased by 1.6% (£4 million). Figure 6: Total new orders saw a decrease (2.4%) in Quarter 4 2024 compared with Quarter 3 2024 Components of work, new orders, constant prices, seasonally adjusted, Great Britain, Quarter 2 (Apr to June) 2017 to Quarter 4 (Oct to Dec) 2024 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/bulletins/constructionoutputingreatbritain/december2024newordersandconstructionoutputpriceindicesoctobertodecember2024/716f273d&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics and Barbour ABI Download this chart Figure 6: Total new orders saw a decrease (2.4%) in Quarter 4 2024 compared with Quarter 3 2024 Image .csv .xls Table 2: Construction new orders main figures, Great Britain, Quarter 4 (Oct to Dec) 2024Seasonally adjusted volume, £ million and percentage change Type of workValue (£m)Most recent quarter on previous quarterMost recent quarter on a year earlierMost recent year on year All new work9,268-2.4-0.13.5 All new housing2,52821.2-10.9-13.7 Public2661.6-43.5-29.9 Private2,26224.0-4.4-11.1 All other work6,741-9.14.711.1 Infrastructure1,619-23.5-4.513.7 Public1,3571.48.715.4 Private industrial803-19.7-12.8-9.0 Private commercial2,9620.115.116.0 Source: Office for National Statistics and Barbour ABI Download this table Table 2: Construction new orders main figures, Great Britain, Quarter 4 (Oct to Dec) 2024 .xls .csv Back to table of contents 4. Construction output price indices in December 2024 Prices in the construction industry, as estimated by our Construction Output Price Index (OPI), increased to 3.0% in the 12-month period to December 2024. Figure 7: Annual construction output price growth in December 2024 was 3.0% Annual rate of construction output price growth, percentage change, UK, January 2014 to December 2024 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/bulletins/constructionoutputingreatbritain/december2024newordersandconstructionoutputpriceindicesoctobertodecember2024/05893ef8&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Construction output price indices data from the Office for National Statistics Download this chart Figure 7: Annual construction output price growth in December 2024 was 3.0% Image .csv .xls Back to table of contents 5. Data on construction in Great Britain Output in the construction industry Dataset | Released 13 February 2025 Monthly construction output for Great Britain at current price and chained volume measures, seasonally adjusted by public and private sector. Quality measures, including response rates.Output in the construction industry: subnational and subsector Dataset | Released 13 February 2025 Quarterly non-seasonally adjusted type of work and regional data at current prices, Great Britain.Construction output price indices Dataset | Released 13 February 2025 A summary of the Construction Output Price Indices (OPIs) from January 2014 to December 2024, UK.New orders in the construction industry Dataset | Released 13 February 2025 Quarterly new orders at current price and chained volume measures, seasonally adjusted by public and private sector. Quarterly non-seasonally adjusted type of work and regional data.Construction statistics annual tables Dataset | Released 22 November 2024 The construction industry in Great Britain, including value of output and type of work, new orders by sector, number of firms and total employment.Output in the Construction Industry – Customise my data Dataset | Released 13 February 2025 Customise My Data (CMD) is our new way of providing filterable, explorable data suitable to individual user needs. Back to table of contents 6. Glossary Construction output estimatesConstruction output estimates are monthly estimates of the amount of output chargeable to customers for building and civil engineering work done in the relevant period, excluding Value Added Tax (VAT) and payments to subcontractors.Seasonally adjusted estimatesSeasonally adjusted estimates are derived by estimating and removing calendar effects (for example, leap years such as 2020) and seasonal effects (for example, decreased activity at Christmas because of site shutdowns) from the non-seasonally adjusted estimates.Value estimatesThe value estimates reflect the total value of work that businesses have completed over a reference month.Volume estimatesThe volume estimates are calculated by taking the value estimates and adjusting to remove the impact of price changes. Back to table of contents 7. Data sources and quality Quality and methodologyMore quality and methodology information (QMI) is available in: our Construction output QMI our Construction output price indices (OPIs) QMI our New orders in construction QMI Reasons for revisions to construction output in this releaseThis release contains revisions to construction output estimates from January 2024 onwards, and is consistent with the National Accounts Revisions Policy. Revisions in this release are a result of: revisions in the nominal data; this includes revisions to the survey data revisions to seasonal adjustment factors, which are re-estimated every mon'
