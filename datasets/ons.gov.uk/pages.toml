full_description = "Construction industry Construction of new buildings and repairs or alterations to existing properties in Great Britain measured by the amount charged for the work, including work by civil engineering companies. On this page: Dataset Publications View all content related to this topic: All data All publications Spotlight Construction output in Great Britain: December 2024, new orders and Construction Output Price Indices, October to December 2024 What's in the bulletin? Construction output is estimated to have increased by 0.5% in Quarter 4 (Oct to Dec) 2024 compared with Quarter 3 (July to Sept) 2024; this came solely from an increase in new work (1.2%), as repair and maintenance fell by 0.4%. Monthly construction output is estimated to have fallen by 0.2% in volume terms in December 2024; this came solely from a fall in repair and maintenance (1.8%) as new work grew by 1.1%. At the sector level, five out of the nine sectors fell in December 2024; the main contributors to the monthly decrease were non-housing repair and maintenance, and private housing repair and maintenance, which fell by 1.8% and 1.4%, respectively. Read this statistical bulletin More publications Construction statistics, Great Britain: 2023 Statistics on the construction industry, including value of output, new orders by sector, number of firms and total employment, and construction Output Price Indices. Read this article More publications Back to top Datasets related to Construction industry Output in the construction industry – revisions triangle (one-month growth) Revisions triangles for monthly construction output indices in Great Britain. Output in the construction industry: all-work summary An all-work summary of monthly construction output in Great Britain at current price and chained volume measures, seasonally adjusted by public and private sector. Output in the construction industry Monthly construction output for Great Britain at current price and chained volume measures, seasonally adjusted by public and private sector. Quality measures, including response rates. Output in the construction industry: index categories and their percentage weights Construction output work types and their percentage of all construction work in Great Britain. Contains monthly, quarterly and annual data. Output in the construction industry – revisions triangle (three-month growth) Revisions triangles for monthly construction output indices in Great Britain. Construction statistics annual tables The construction industry in Great Britain, including value of output and type of work, new orders by sector, number of firms and total employment. View all datasets related to Construction industry Back to top Publications related to Construction industry Statistical bulletins Construction output in Great Britain: December 2024, new orders and Construction Output Price Indices, October to December 2024 Short-term measures of output by the construction industry in December 2024, contracts awarded for new construction work in Great Britain and a summary of the Construction Output Price Indices (OPIs) in the UK for Quarter 4 (Oct to Dec) 2024. Construction Output Price Indices (OPIs), UK: January to March 2020 A summary of the Construction output Price indices (OPI's) in the UK for Quarter 1 (January to March) 2020. Non-financial business economy, UK (Annual Business Survey): 2017 provisional results Size and growth within the UK's non-financial business sectors: non-financial services, distribution, production, construction and agriculture. View all related statistical bulletins Articles Price movements in construction materials and plant hire, UK Price movements of construction materials and plant hire between 2019 and 2021 and their causes: a brief overview of construction in the UK, construction output indices and how these are computed, and construction inputs and their price movements and the factors behind them. Productivity in the construction industry