["https://ons.gov.uk/economy/inflationandpriceindices/articles/pricemovementsinconstructionmaterialsandplanthireuk/2019to2021"]
title = "Price movements in construction materials and plant hire, UK - Office for National Statistics"
description = "Price movements of construction materials and plant hire between 2019 and 2021 and their causes."
full_description = '1. Main points Producer Price Inflation (PPI) inputs into construction continue to have an upward push on construction output prices in 2021. Increased construction output is pushing demand for construction inputs thereby increasing prices of inputs. Global prices trends of commodities such as iron and copper are pushing up construction input prices; iron ore prices have soared by 97% in July 2021 compared with the previous year. Global supply chain disruptions are impacting on the availability and price of construction inputs. Back to table of contents 2. Construction output prices in the UK Figure 1: Construction output prices have been increasing since December 2019 Construction all work, prices, non-seasonally adjusted, UK, January 2015 to June 2021 <!--[endif]--> <img src="/chartimage?uri=/economy/inflationandpriceindices/articles/pricemovementsinconstructionmaterialsandplanthireuk/2019to2021/e8da4e75&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics - Construction output prices Download this chart Figure 1: Construction output prices have been increasing since December 2019 Image .csv .xls Figure 1 shows the construction output prices up to June 2021. The annual rate of growth of construction output prices in June 2021 was 3.8%. Construction output prices have been increasing since December 2019 making that 19 consecutive months of positive monthly growth.Construction output has however fallen. Monthly construction output fell for the third consecutive month in June 2021 by 1.3% (Figure 2). This is the largest monthly decline since December 2020 when output fell 2.2%. The peak-to-trough fall in construction output between March and July 2020 was substantially larger relative to the 2008 to 2009 recession. The recovery was however quicker, and the industry has continued to recover in the second half of 2020 and 2021. Figure 2: Construction output fell for the fifth consecutive month in June 2021 Monthly index, all work, chained volume measure, seasonally adjusted, January 2015 to August 2021 <!--[endif]--> <img src="/chartimage?uri=/economy/inflationandpriceindices/articles/pricemovementsinconstructionmaterialsandplanthireuk/2019to2021/6407acde&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statictics Download this chart Figure 2: Construction output fell for the fifth consecutive month in June 2021 Image .csv .xls Back to table of contents 3. Changes to construction inputs over time The construction industry uses various inputs. To understand what these inputs are this article will rely on supply and use tables to help us identify which sectors provide intermediate consumption for the construction sector. The top six sectors that provide the construction sector with goods that go into its production process are: other non-metallic mineral products for domestic market fabricated metal products, except machinery and equipment for domestic market wood and products of wood and cork, except furniture; articles of straw and plaiting electrical equipment for domestic market other mining and quarrying products for domestic market rental and leasing services of construction and civil engineering machinery and equipment Other non-metallic mineral products for domestic marketOther non-metallic mineral products for domestic market consists of the following components: glass and glass products for domestic market refractory products for domestic market clay building materials for domestic market other porcelain and ceramic products for domestic market cement, lime and plaster for domestic market articles of concrete, cement and plaster for domestic market cut, shaped and finished stone for domestic market other non-metallic mineral products for domestic market Figure 3: Other non-metallic mineral products for the domestic market have been rising from 2019 to 2021 Other non-metallic mineral products for domestic market, UK, January 2019 to September 2021 <!--[endif]--> <img src="/chartimage?uri=/economy/inflationandpriceindices/articles/pricemovementsinconstructionmaterialsandplanthireuk/2019to2021/a5f8df0b&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics - Producer Price Index Download this chart Figure 3: Other non-metallic mineral products for the domestic market have been rising from 2019 to 2021 Image .csv .xls Figure 3 shows the price index for other non-metallic mineral products from 2019. The annual average index for other non-metallic mineral products for domestic market has consistently been on the rise from 2009 to 2020. The second-largest annual price rise since records began was recorded in 2019 at 3.12%.Month-on-month, prices have increased, with the highest monthly prices recorded in September 2021 as shown in Figure 3. Articles of concrete, cement and plaster for domestic market make up the largest input of this index followed by glass and glass products for domestic market, and other non-metallic mineral products for domestic market coming third.Bills of quantities for various construction projects indicate concrete is one of the largest weighted inputs into construction. It is the largest weighted input for apartment blocks, roads and bridges, and the second-largest weighted input for detached housing and private industrial.Articles of concrete, cement and plaster for domestic market saw a year-on-year increase of 4.3% and 5.1% in May 2021 and June 2021 respectively making it the highest increase of components in the index in 2021.Other non-metallic mineral products for domestic market is the second-largest component of this index. Its largest component is bituminous mixtures based on natural and artificial stone materials and bitumen, natural asphalt or related substances for domestic use, which was at its highest price between June 2021 and August 2021, where prices were up 1.9% compared with previous periods in 2020.Bills of quantities used in determining weights indicate asphalt and concrete account for 77% of inputs into road construction. Asphalt is derived from crude oil and is primarily used in road construction. Globally, crude oil prices have rebounded from their lowest in March 2020 but are still below their pre-pandemic high. This price rise has in turn affected the cost of asphalt by pushing up its price.Fabricated metal products, except machinery and equipment for domestic marketFabricated metal products, except machinery and equipment for domestic market consists of the following components: structural metal products for domestic market tanks, reservoirs and containers of metal for domestic market steam generators, except central heating hot water boilers for domestic market forging, pressing, stamping and roll-forming services of metal; powder metallurgy for domestic market treatment and coating services of metals; machining for domestic market cutlery, tools and general hardware for domestic market other fabricated metal products for domestic market Figure 4: Fabricated metal products, except machinery and equipment for domestic market have been rising in price since December 2020 Fabricated metal products, except machinery and equipment for domestic market, UK, January 2019 to September 2021 <!--[endif]--> <img src="/chartimage?uri=/economy/inflationandpriceindices/articles/pricemovementsinconstructionmaterialsandplanthireuk/2019to2021/981315ce&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics - Producer Price Index Download this chart Figure 4: Fabricated metal products, except machinery and equipment for domestic market have been rising in price since December 2020 Image .csv .xls Figure 4 shows the price index for fabricated metal products, except machinery and equipment for domestic market from 2019. The index has risen since December 2020, peaking in September 2021.Structural metal products for domestic market are the largest component of the index, closely followed by treatment and coating services of metals, machining for domestic market. Steel work and metal joinery are the largest weighted inputs into private industrial and the second-largest weighted into bridge construction projects. Structural metal products for domestic market had the steepest prices of the components that go into the index. August 2021 and September 2021 saw price rises of 13.4% and 15.7% respectively compared with similar periods in 2020. Structural metal products are influenced by steel prices, which are on the rise in turn pushing up the price of structural metal products. According to data from the London Metal exchange (LME) from January 2019 till June 2021, the price of steel rebar was at its highest in May 2021 peaking at US $780 per tonne. Globally, steel prices have been on the increase. Steel prices have increased in response to an increase in iron ore, which is one of its major components. The price of iron ore is at the highest it has ever been. As at July 2021 price of steel per tonne stood at US $214.55, making this a 97% rise compared with a similar period in 2020.Supply chain issues have also affected the price of steel. According to the Financial Times, material supplies have been hit by the rise of shipping costs (paywall) as a result of the coronavirus (COVID-19) pandemic and the lack of capacity in Chinese ports. This has also contributed to steel prices rising.Prices of treatment and coating services of metal; machining for domestic market have been rising albeit at a slower pace. They increased by 0.36% and 0.27% year-on-year to April 2021 and May 2021 respectively. This price rise can also be attributed to price increases of steel and other metals which form the main intermediate inputs into the sector.Wood and products of wood and cork, except furniture; articles of straw and plaiting materials for domestic marketThis index consists of the following: wood, sawn and planed for domestic use. products of wood, cork, straw and plaiting materials Figure 5: Wood and products of wood and cork, except furniture; articles of straw and plaiting materials for domestic market have been on the increase since April 2020 Wood and products of wood and cork, except furniture; articles of straw and plaiting materials for domestic market, UK, January 2019 to September 2021 <!--[endif]--> <img src="/chartimage?uri=/economy/inflationandpriceindices/articles/pricemovementsinconstructionmaterialsandplanthireuk/2019to2021/8861250a&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics - Producer Price Index Download this chart Figure 5: Wood and products of wood and cork, except furniture; articles of straw and plaiting materials for domestic market have been on the increase since April 2020 Image .csv .xls Products of wood, cork, straw and plaiting materials account for over 80% of this index while wood, sawn and planed for domestic use account for over 15%.Prices of products of wood, cork, straw and plaiting materials have been on the increase since April 2020, with 17 consecutive months of price increase peaking in September 2021, an increase of 25.1% from September 2020.Wood, sawn and planed for domestic use has also seen price rises of 42.6% for the period September 2020 to September 2021.Timber prices have been on the rise worldwide occasioned by reduced exports from some of the world’s top timber producers. Anecdotal evidence suggest timber merchants are having difficulties with their supply chain and demand. According to the Forestry Commission, 60% of all wood in the UK is used in construction. The Forestry Commission figures also indicate that the UK imports about 80% of its timber, with 20% being produced locally. According to Timber Trade Federation, which is a trade body for timber importers, merchants, agents and manufacturers, these timber imports are from countries such as the United States, Sweden, Latvia, Estonia, France, Canada, Germany, Brazil, Finland and Cameroon. Timber price rises can be understood through supply and demand. UK timber production has largely been consistent over the last few years but demand for wood and products of wood has increased over the same period. There has been a surge in UK housebuilding, with about 165,420 units built in 2018 and 178,310 in 2019, most of which are using timber frames. Imports of wood and wood products have been on the increase in the last few years to meet demand. However, international demand for timber and timber products has also been on the increase. Countries such as the United States, Russia and Canada have had wildfires, which have curtailed timber production affecting supply in a market where demand is high. This has pushed up prices.There is also anecdotal evidence of demand being driven by a resurgence in DIY and home improvements because of people being stuck at home and taking on DIY projects, helped further by the increase in disposable income for many households. According to the Timber Trade Federation, this has contributed to increased demand for timber.Timber merchants reported an increase in demand for wood during the lockdown period. This is further shown in the construction output repair and maintenance data, which have bounced back quicker than new work, with growth of 41.3% in Quarter 2 (Apr to June) 2020. Repair and maintenance private housing was the main contributor to this strong recovery.Electrical equipment for domestic marketElectrical equipment for domestic market consists of: electric motors, generators, transformers and electricity distribution and control apparatus for domestic market batteries and accumulators for domestic market wiring and wiring devices for domestic market electric lighting equipment for domestic market domestic appliances for domestic market other electrical equipment for domestic market Figure 6: Electrical equipment for domestic market is at an all-time high Electrical equipment for domestic market, UK, January 2019 to August 2021 <!--[endif]--> <img src="/chartimage?uri=/economy/inflationandpriceindices/articles/pricemovementsinconstructionmaterialsandplanthireuk/2019to2021/2b108954&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics - Producer Price Index Download this chart Figure 6: Electrical equipment for domestic market is at an all-time high Image .csv .xls Prices of electrical equipment for domestic market are at an all-time high. The average annual price growth rate has been positive for the last 10 years. Year-on-year, September 2021 saw the highest price growth rate of 5.5%.The top three indices by weight that make up this index are: electric motors, generators, transformers and electricity distribution and control apparatus for domestic market wiring and wiring devices for domestic market domestic appliances for domestic market Prices for the three components have also been on the increase driven by among other'
year_published = 2025
