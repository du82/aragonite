title = "Business births, deaths and survival rates - Office for National Statistics"
description = "Demography of UK businesses: active businesses, new registrations for VAT and PAYE (births), cessation of trading (deaths), and duration of trading (survival rates)."
full_description = "Business births, deaths and survival rates Demography of UK businesses: active businesses, new registrations for VAT and PAYE (births), cessation of trading (deaths), and duration of trading (survival rates). On this page: Dataset Publications View all content related to this topic: All data All publications Spotlight Business demography, UK: 2020 What's in the bulletin? Between 2019 and 2020 the number of UK business births decreased from 390,000 to 358,000, a birth rate of 11.9% in 2020 compared with 13.0% in 2019. The number of UK business deaths decreased from 324,000 to 316,000 between 2019 and 2020, a death rate of 10.5% compared with 10.8% in 2019. London had both the highest business birth rate at 14.0%, and death rate at 12.1%. Read this statistical bulletin More publications Business investment in the UK: July to September 2022 provisional results What's in the bulletin? Business investment fell by 0.5% in Quarter 3 (July to Sept) 2022. The level of business investment in Quarter 3 2022 is 8.4% below where it was in Quarter 4 (Oct to Dec) 2019, the quarter before the coronavirus (COVID-19) pandemic; gross fixed capital formation (GFCF) levels are 0.8% above that same quarter. Whole economy investment, which includes business and public sector investment, increased by 2.5% in Quarter 3 2022 and was 5.8% higher than in the same quarter a year ago. Read this statistical bulletin More publications Back to top Datasets related to Business births, deaths and survival rates Business demography, UK Annual data on births, deaths and survival of businesses in the UK, by geographical area and Standard Industrial Classification 2007: SIC 2007 groups. View all datasets related to Business births, deaths and survival rates Back to top Publications related to Business births, deaths and survival rates Statistical bulletins Business demography, UK: 2023 Annual change in the number of UK businesses broken down by sector of the economy. Business investment in the UK: October to December 2024 provisional results Estimates of short-term indicators of investment in non-financial assets; business investment, and asset and sector breakdowns of total gross fixed capital formation. View all related statistical bulletins Articles Business investment in the UK Analysis of UK business investment broken down by asset type. Foreign-owned businesses in the UK non-financial business economy Annual estimates of the number of foreign-owned businesses, turnover and approximate gross value added (aGVA) in the UK non-financial business economy for 2021 and revised estimates for 2020, from the Annual Business Survey (ABS). View all related articles Back to top"
year_published = 2025
clearnet = "https://ons.gov.uk/businessindustryandtrade/changestobusiness/businessbirthsdeathsandsurvivalrates"
