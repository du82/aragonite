full_description = "Transparency and governance We are working towards releasing more information about our organisation, to improve the transparency and accountability of government. We publish details of our structure and spending, and you can make a Freedom of Information request for other information. Statistics for the public good UK Statistics Authority five year strategy 2020 to 2025 and the ONS Strategic Business Plan. Leadership team Our leaders and their roles and responsibilities. Freedom of Information (FOI) You can ask us for all of the information we have on any subject you choose. Declarations Our energy consumption, business expenses and hospitality registers. ONS Government Major Projects Portfolio data Detailed information about projects on the Government Major Projects Portfolio (GMPP). Pre-release access Details of exceptional pre-release access granted to ONS statistics. Data protection Privacy information for data subjects. Data strategy How we use and manage data, while providing the best standard of statistical information for the public. ONS Evaluation The ONS’s vision for evaluation, embedding best practice and supporting evaluations across government through the Analysis Function and Integrated Data Service. COVID-19 Infection Surveillance Digital (CISD) Advisory Board The CISD Advisory Board makes scientific and analytical recommendations to the ONS. The Office for National Statistics’ Revisions Policy and Correction of Errors Policy Guidance on our central Revisions and Correction of Errors policies, including definitions and why they are used."
