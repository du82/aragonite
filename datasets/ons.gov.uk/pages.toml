["https://ons.gov.uk/businessindustryandtrade/internationaltrade/bulletins/ukservicestradebybusinesscharacteristics/2016to2018"]
title = "UK services trade by business characteristics - Office for National Statistics"
description = "Breakdown of UK trade in services by business characteristics (size and ownership), industry and region, on a balance of payments basis using a new experimental dataset."
full_description = '1. Main points Of businesses with known characteristics, large foreign-owned businesses (that is, those with 250 or more employees) traded more than any other business type, exporting and importing £46.0 billion and £24.8 billion of services in 2018, respectively. In 2018, foreign-owned businesses exported £96.3 billion and imported £49.9 billion of services, whereas domestically owned businesses exported and imported less, at £69.8 billion and £33.5 billion, respectively. In 2018, large businesses exported £70.5 billion and imported £37.7 billion of services, medium businesses exported £34.8 billion and imported £13.7 billion, and small businesses exported £25.6 billion and imported £11.5 billion. All business sizes exported more to non-EU countries than EU countries in 2018, whereas only large businesses imported more from non-EU countries than EU countries. In 2018, small domestically owned businesses traded more than small foreign-owned businesses, whereas large foreign-owned businesses traded more than large domestically owned businesses. Of the top 10 services exporting and importing industries, as defined in our trade in services by industry release, imports and exports were both mainly driven by large businesses in 2018. Back to table of contents 2. UK exports and imports of services by ownership and size This is a new experimental release looking at the value of services trade by business characteristics (that is, by size and ownership status) on a balance of payments (BoP) basis. Additional breakdowns are available by industry and region. This release is accompanied by a rich dataset to help users explore which types of businesses contribute most to the trade in services aggregates, which industries they are in and which regions they trade with.Trade in services undertaken by businesses that we have not been able to link characteristics to are not included in this analysis and have been excluded from total trade in services for the purpose of percentage of total calculations. The following analysis reflects trade in services by businesses with known characteristics only. At most, businesses with unknown characteristics accounted for 57.4% of total services exports and 68.1% of total services imports in 2018, though the percentage of unknown may be lower in some tables (see Measuring the data).OwnershipExcluding businesses with unknown characteristics, foreign-owned UK businesses contributed the most to UK exports and imports of services (Figure 1). Foreign-owned businesses exported £96.3 billion of services in 2018 compared with £69.8 billion of services exports by domestically owned businesses. Both domestically owned and foreign-owned businesses exported more to non-EU countries than EU countries: domestically owned businesses exported 63.2% of their services to non-EU countries, while foreign-owned businesses exported 57.9%.The same pattern was observed for imports in 2018; foreign-owned businesses imported £49.9 billion of services, compared with £33.5 billion imported by domestically owned businesses. Both foreign-owned and domestically owned businesses imported more from non-EU countries than EU countries: foreign-owned businesses imported 50.7% of their services from non-EU countries, while domestically owned businesses imported 56.3%. Figure 1: Foreign-owned UK businesses contributed the most to UK exports and imports of services UK exports and imports of services split by domestic and foreign-owned businesses and EU and non-EU countries, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/ukservicestradebybusinesscharacteristics/2016to2018/93946ed9&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – UK trade in services Download this chart Figure 1: Foreign-owned UK businesses contributed the most to UK exports and imports of services Image .csv .xls SizeExcluding businesses with unknown characteristics, large businesses exported more than small and medium-sized businesses, exporting £70.5 billion of services in 2018 (Figure 2). Medium-sized businesses exported a lesser £34.8 billion, followed by small businesses, which exported £25.6 billion. All business sizes exported more to non-EU countries than EU countries, with approximately 60% of exports for each business size going to non-EU countries.Large businesses also imported more than small and medium-sized businesses, importing £37.7 billion in 2018, followed by medium-sized and small businesses, which imported £13.7 billion and £11.5 billion, respectively. Large businesses were the only business type to import more from non-EU countries than EU countries, with 57.5% of their imports coming from non-EU countries in 2018. Medium-sized businesses and small businesses imported 45.9% and 47.6% of their services from non-EU countries, respectively. Figure 2: Large businesses traded more than small and medium-sized businesses UK services exports and imports by business size and region, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/ukservicestradebybusinesscharacteristics/2016to2018/3dd195e2&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – UK trade in services Download this chart Figure 2: Large businesses traded more than small and medium-sized businesses Image .csv .xls Ownership by sizeExcluding businesses with unknown characteristics, large foreign-owned UK businesses contributed the most to UK trade in services in 2018 (Figure 3). These businesses were responsible for 36.5% (or £70.7 billion) of total trade (exports plus imports) by businesses with known characteristics in 2018, with £46.0 billion exported and £24.8 billion imported. In 2018, foreign-owned large UK businesses traded 88.6% more than domestically owned large UK businesses (exports plus imports).Large businesses also contributed the most to trade in services by domestically owned businesses. In 2018, these businesses were responsible for 19.4% (or £37.5 billion) of total services trade by businesses with known characteristics, comprising £24.5 billion in exports and £13.0 billion in imports.Medium-sized businesses contributed 25.0% (or £48.5 billion) of total UK trade in services in 2018, with domestically owned businesses and foreign-owned businesses contributing evenly (£24.6 billion and £23.9 billion, respectively).Small businesses contributed least to total UK trade in services, being responsible for 19.1% (or £37.1 billion) of total trade by businesses with known characteristics. Of this, £23.0 billion was attributed to domestically owned businesses and £14.1 billion to foreign-owned businesses. Domestically owned small businesses traded 63.5% more than foreign-owned small businesses in 2018. Figure 3: Large foreign-owned businesses were the largest driver of UK trade in services in 2018 UK services exports and imports by ownership and size, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/ukservicestradebybusinesscharacteristics/2016to2018/a1a7da0d&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – UK trade in services Download this chart Figure 3: Large foreign-owned businesses were the largest driver of UK trade in services in 2018 Image .csv .xls Back to table of contents 3. The top 10 services exporting and importing industries Trade in services undertaken by businesses that we have not been able to link characteristics to are not included in this analysis and have been excluded from total trade in services for the purpose of percentage of total calculations. The following analysis reflects trade in services by businesses with known characteristics only. At most, businesses with unknown characteristics accounted for 57.4% of total services exports and 68.1% of total services imports in 2018, though the percentage of unknown may be lower in some tables (see Measuring the data).ExportsOur UK trade in services by industry, country and service type: 2016 to 2018 publication presented the 10 largest services-exporting industries. Figure 4 breaks this data down further by business size, with unknown and aggregated suppressed values included to remain consistent with the industry publication. The largest services-exporting industry in 2018 was the financial services activities industry (industry 64), which exported £55.8 billion of services. As the majority of this industry is not measured by International Trade in Services Survey (ITIS), limited business characteristics data are available. Other than the wholesale trade industry (industry 46), the remaining services-exporting industries in the top 10 (where business characteristics data are available) were mainly large businesses. Exports by the wholesale trade industry were dominated by medium-sized businesses. Figure 4: Of the top 10 services-exporting industries, large businesses generally exported the most Top 10 services-exporting industries by size, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/ukservicestradebybusinesscharacteristics/2016to2018/c6f196fc&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – UK trade in services Download this chart Figure 4: Of the top 10 services-exporting industries, large businesses generally exported the most Image .csv .xls ImportsOur UK trade in services by industry, country and service type: 2016 to 2018 publication presented the 10 largest services-importing industries. Figure 5 breaks this data down further by business size, with unknown and aggregated suppressed values included to remain consistent with the industry publication. The largest services-importing industry in 2018 was the financial services activities industry (industry 64), which imported £27.1 billion of services. As the majority of this industry is not measured by ITIS, limited business characteristics data are available. Other than the wholesale trade (industry 46) and telecommunications (industry 61) industries, the remaining services-importing industries in the top 10 (where business characteristics data are available) were mainly large businesses. Imports by the wholesale trade industry were dominated by medium-sized businesses, whereas the majority of imports by the telecommunications industry were by small businesses. Figure 5: Of the top 10 services-importing industries, large businesses generally imported the most Top 10 services-importing industries by size, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/ukservicestradebybusinesscharacteristics/2016to2018/76ad8a35&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – UK trade in services Download this chart Figure 5: Of the top 10 services-importing industries, large businesses generally imported the most Image .csv .xls Back to table of contents 4. UK services trade data UK trade in services by business characteristics Dataset | Released 10 March 2020 Breakdown of UK trade in services by business characteristics on a balance of payments (BoP) basis using a new experimental dataset. Back to table of contents 5. Glossary Domestic ownershipDomestic ownership is where the ultimate controlling parent is based in the UK.Foreign ownershipForeign ownership is where the ultimate controlling parent is based outside the UK.Unknown ownershipUnknown ownership is where the location of the ultimate controlling parent cannot be determined.Business sizeThere are four categories of business size: small (0 to 49 employees), medium (50 to 249 employees), large (250 or more employees) and unknown (the number of employees cannot be determined). Back to table of contents 6. Measuring the data The dataset for the trade in services analysis released alongside this bulletin was compiled by combining microdata within our existing trade in services by industry dataset that has been sourced via the International Trade in Services Survey (ITIS) with the Office for National Statistics (ONS) Inter-Departmental Business Register (IDBR). The IDBR contains additional business characteristics information, such as the number of employees and whether owned by a domestic or foreign ultimate parent company.Quality and methodology information for the existing trade in services by industry dataset can be found in Section 8 of the latest release.International Trade in Services Survey (ITIS)The main data source for our trade in services statistics is ITIS. This is the only data source that we collect at a business-level. Therefore, all estimates of services trade by business characteristics relate only to data collected via ITIS. Remaining services trade have been allocated to “unknown” characteristics, in line with Eurostat international best practice for measuring services trade by business characteristics.ITIS collects company-level microdata on exports and imports of services products. Office for National Statistics (ONS) ITIS data are compliant with the latest international standards, as outlined in the Manual on Statistics of International Trade in Services 2010 (MSITS 2010).Breakdowns are available by product, industry and geographical region, and products are classified using the Extended Balance of Payments Services classification (EBoPS 2010). ITIS consists of 52 products and 17 product groups, and it is the main source of UK trade in services data, covering most industries. However, it has several exceptions such as: travel transport banking and other financial institutions higher education charities most activities within the legal profession The quarterly sample is made up of approximately 2,200 businesses, and the annual sample is made up of approximately 15,500 businesses. The survey data from both the quarterly and annual results are combined to produce the annual ITIS estimates and are used as a main data source to compile total trade in services estimates.For industries that ITIS measures, a direct industry breakdown can be found using the industrial classifications of responding businesses. All businesses sampled to complete ITIS are sampled from the IDBR, which contains records of the Standard Industrial Classification (SIC) of each business. ITIS service type by country data are then broken down into industries using this business-level SIC information and are therefore considered robust.ITIS does not stratify based on employment count or ownership status. Therefore, although we have assumed the sample is representative of these characteristics, we cannot be certain.More quality and methodology information on strengths, limitations, appropriate uses, and how the data were created is available in the ITIS QMI.Inter-Departmental Business Register (IDBR)This release presents trade in services'
