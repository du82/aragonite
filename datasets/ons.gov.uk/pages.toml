description = "UK manufacturing and other production industries (such as mining and quarrying, energy supply, water supply and waste management), including total UK production output, and UK manufactures' sales by product and industrial division, with EU comparisons."
full_description = '''Manufacturing and production industry UK manufacturing and other production industries (such as mining and quarrying, energy supply, water supply and waste management), including total UK production output, and UK manufactures' sales by product and industrial division, with EU comparisons. On this page: Time series Dataset Publications Methodology View all content related to this topic: All data All publications Spotlight <![endif]--> <img class="img-sparkline js--hide" src="/economy/economicoutputandproductivity/output/timeseries/k27q/diop/sparklineimage" alt="B-E: PRODUCTION: CVM: annual &amp; monthly gr between 1948 FEB and 2024 DEC "> <!--[if gt IE 8]><!--> B-E: PRODUCTION: CVM: annual & monthly gr 0.5 % 2024 DEC Release date: 13 February 2025 Next release: 14 March 2025 View this data More data UK manufacturers' sales by product: 2023 What's in the bulletin? The total value of UK manufacturers' product sales was £456.1 billion in 2023, an increase of £17.2 billion (3.9%) from £438.9 billion in 2022. The manufacture of food remained the largest division and represented 20.8% of total manufacturers' sales in 2023. The manufacturing of motor vehicles division showed the largest value increase, up by £9.6 billion (22.0%) in 2023 to £53.3 billion; motor vehicles (above 1,500 cubic centimetres (cc) engine) with a spark ignition internal combustion engine saw the largest value increase for any single product in 2023, rising by £4.0 billion (23.4%) to £21.2 billion. Read this statistical bulletin More publications Back to top Time series related to Manufacturing and production industry B-E: PRODUCTION: CVM: annual & monthly gr <![endif]--> <img class="img-sparkline js--hide" src="/economy/economicoutputandproductivity/output/timeseries/k27q/diop/sparklineimage" alt="B-E: PRODUCTION: CVM: annual &amp; monthly gr between 1948 FEB and 2024 DEC "> <!--[if gt IE 8]><!--> 0.5 % 2024 DEC Release date: 13 February 2025 Next release: 14 March 2025 IOP: B-E