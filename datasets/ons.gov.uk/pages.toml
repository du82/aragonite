["https://ons.gov.uk/businessindustryandtrade/constructionindustry/methodologies/newordersinconstructionqmi"]
title = "New orders in construction QMI - Office for National Statistics"
description = "Quality and Methodology Information for new orders in construction, detailing the strengths and limitations of the data, methods used, and data uses and users."
full_description = "1. Output information National Statistic Survey name New orders in the construction industry Frequency Quarterly How compiled Administrative data Geographic coverage Great Britain Sample size N/A Last revised 9 August 2019 Back to table of contents 2. About this Quality and Methodology Information report This quality and methodology information (QMI) report contains information on the quality characteristics of the data (including the five European Statistical System dimensions of quality) as well as the methods used to create it.The information is this report will help you to: understand the strengths and limitations of the data learn about existing uses and users of the data reduce the risk of misusing data help you to decide suitable uses for the data understand the methods used to create the data Back to table of contents 3. Important points Data are sourced from Barbour ABI who web scrape planning application data from all local authorities in England, Scotland and Wales; this method allows identification of planning applications as soon as they are published, while projects outside the planning application process are captured via investigations from Barbour’s in-house team of researchers. These data are then validated firstly by Barbour ABI and supplied to the Office for National Statistics (ONS), who also further validate, and quality assure the data before new orders in the construction industry estimates are published. New orders in the construction industry are published by ONS every quarter and allow a more forward-looking snapshot of both current confidence and potential future activity in the construction industry in Great Britain. The current method to compile new orders data has been used since Quarter 2 (Apr to June) 2013; however, a longer time series going back to the 1958 is published under different methodologies. As of March 7 2019 the statistics are now re-designated as National Statistics. Back to table of contents 4. Quality summary OverviewThe new orders in construction dataset measures the value and volume of new orders of main contractors by type of work and region. The main users of these data are industry analysts of the UK construction industry, trade associations and other government departments.The data are primarily sourced from local authorities in England, Scotland and Wales by a private company called Barbour ABI. These local authorities are monitored daily to identify planning applications as soon as they are published. Additional contract sources are also monitored to collect details of public sector tenders and new orders as they are placed. Barbour ABI’s telephone research team speak to a minimum of 10,000 contractors every year about work they are bidding for, or are already actively involved in.From Quarter 2 (Apr to June) 2013, we stopped collecting data using the quarterly survey of contracts and new orders (also known as the New Orders Survey). The first published estimates using the Barbour ABI data took place in September 2013. Estimates of new orders in current and constant prices and on a seasonally and non-seasonally adjusted basis are published in the Construction output and new orders statistical bulletin. This also includes supporting commentary around the latest figures. The new orders dataset is also published every quarter alongside the statistical bulletin.Uses and usersThe data published in the Construction output in Great Britain and new orders statistical bulletin are used by a variety of different stakeholders. These include: industry analysts requiring estimates of the value of new orders in the construction industry in Great Britain trade associations making comparisons and forecasting trends in the construction industry other government departments in helping to inform policies, including the Department for Business, Energy and Industrial Strategy (BEIS), Bank of England (BoE), HM Treasury (HMT) and the Ministry of Housing, Communities and Local Government (MHCLG) Strengths and limitationsStrengths of the new orders dataAll planned projects are collected and validated by Barbour ABI. This allows a near census of all planned projects greater than £100,000 in value or projects with two or more houses for residential schemes to be used within the dataset. This allows a better coverage of project-level data than could previously be obtained when the data were collected via the Office for National Statistics (ONS) survey prior to Quarter 2 (Apr to June) 2013. An additional factor of the change in data source was the improved sub-national granularity the Barbour ABI dataset provides in comparison with the survey data.Projects outside of the planning process are included via follow-up telephone phone calls by Barbour ABI’s in-house team of researchers.Projects are researched by Barbour ABI’s UK-based researchers with expert knowledge of the UK construction industry and good contacts with the main construction contractors within the sector. This allows individual projects to be tracked from order placed to completion.All projects are coded to the ONS taxonomy for the 23 types of work (for the full taxonomy, please see Annex 1).The detailed level of data available from Barbour ABI allows the output data to be modelled to a subnational and sub-sector level, which would otherwise not be possible.While we are reliant on an administrative data source to produce these statistics, it is widely accepted that Barbour ABI are industry experts in this type of data collection.Limitations of the new orders dataProjects costing less than £100,000 are not included in the new orders dataset.While revisions due to changes in seasonal adjustment factors can be seen in the constant price, seasonally adjusted data, no revisions are applied to the raw new orders dataset supplied by Barbour ABI. This is because the data are a point-in-time estimate of new orders within the industry. It should be noted that projects can change value for legitimate reasons from their initial valuation. These reasons could include changes in specification of projects as they are being constructed, initial under or over estimation of project costs when the order was first placed or a change in the contractor undertaking the project.Only projects in Great Britain are captured in the dataset. Therefore, Northern Ireland projects are not included.A detailed comparison of the difference between new orders data and construction output is described in the article Construction statistics development: Understanding the gap between construction output and new orders, published on 30 October 2018.For further information as to the assessment of Barbour ABI suitability in use of ONS construction statistics, please see the Quality assurance of administrative data used in construction statistics.Recent improvementsOver the recent period there have been numerous improvements to the new orders data.The first is the change of data source from ONS survey to administrative data supplied by Barbour ABI. More information can be found in the Announcement of Changes to New Orders in the Construction Industry article published in 2013. The improvement in the variables collected in the new orders dataset since this change has also resulted in further improvements in the model to estimate subnational and subsector work. For further information, please see the Construction development: improvements to regional and subsector level estimates article published on 4 June 2018.The second change is clarity over how new orders data should be interpreted and used. An article has been published highlighting the difference between new orders and output data in the ONS construction data. The article Construction statistics development: Understanding the gap between construction output and new orders, published on 30 October 2018, describes the purpose of both datasets and explains the reasons as to why the all new work output series can be different to the all work new orders series. Back to table of contents 5. Quality characteristics RelevanceNew orders data are regularly assessed as part of an ongoing quality assurance programme from the Office for Statistics Regulation (OSR). Previous consultation details are captured in this section.In 2013, a consultation asked for input from users to understand the datasets produced for new orders in the construction industry. The results of the consultation are available.The statistics have also been assessed against the standard set out in the statutory Code of Practice for Statistics. The first UK Statistics Authority assessment to assess the suitability of the output was conducted in 2012. The findings from the assessment can be found within assessment report 170.The next UK Statistics Authority assessment of the relevance of the statistics was assessed in 2014. The findings from the assessment can be found within assessment report 280. New orders statistics have recently been re-assessed by OSR. This consultation also covers the Office for National Statistics’ (ONS’s) Construction Output and Construction Output Price Indices. The public consultation closed for responses as of December 2017. As a result of the work programme to develop and improve the statistics as of March 7 2019 the statistics have been re-designated as National Statistics status.All issues relating to the collection and dissemination of new orders in construction industry statistics are discussed with users via two separate forums: the Consultative Committee on Construction Industry Statistics (CCCIS) – this is a joint forum that meets biannually and consists of members of the industry, academics, the Department for Business, Energy and Industrial Strategy (BEIS) and ONS the Construction Statistics Steering Group – this is a group of other government departments, industry experts and academics who provide comment and input into recent development work on the outputs and statistical products; due to the nature of data being discussed, all attendees are required to sign a confidentiality declaration to ensure data are not discussed and disclosed outside of this forum ReliabilityAssessing the difference between the first published estimate and the final revised figure provides an indication of reliability. While the current price, non-seasonally adjusted series supplied by Barbour ABI is unrevised period-on-period, it is possible to see revisions in the constant price, seasonally adjusted series due to revisions in the seasonal adjustment.More information on new orders in the construction industry revisions are published each quarter in the statistical bulletin in the form of revisions triangles for the quarter-on-quarter growth rates.Output qualityWhilst these statistics do not adhere to any European legislation, so comparability across countries is not possible, it is worthwhile to note that new orders data have been assessed against the UK Statistics Authority guidance for quality assurance of administrative data. The guidance for scoring and the actual scores achieved against these criteria can be found within Tables 1 and 2 within the link. Using this guidance an A1 score was rated against the criteria, with the main reasoning being “the risk of quality concern and public interest profile has been set as “low” due to the small contribution that new orders in construction statistics feed into the index of construction output (less than 0.01%).”Coherence and comparabilityTo understand the comparability of new orders data it is worthwhile to understand the history of the data and discontinuities in terms of the data collection. The new orders survey began in 1955, with the Board of Trade (later the Department for Trade and Industry (DTI)). Responsibility later transferred to the Department for Business, Enterprise and Regulatory Reform (BERR) before its amalgamation with the Department for Innovation, Universities and Skills (DIUS) to create the Department for Business, Innovation and Skills (BIS), now the Department for Business, Energy and Industrial Strategy (BEIS).Survey responsibility was transferred to Office for National Statistics (ONS) in March 2008. The subsequent redevelopment of the new orders statistics has meant that a revised back series of data at sector level to 1958 and at subnational and sub-sector level to 1985 has been produced. These are available in the new orders dataset. For further information as to the work undertaken by ONS when the statistics transferred to us, please see this article Development of construction statistics (PDF, 135KB) published in March 2010.There are further discontinuities at the disaggregated level between Quarter 1 (Jan to Mar) and Quarter 2 (Apr to June) 2013 caused by the change in source data. Statistical tests carried out by ONS have proven the Barbour ABI data to be cumulatively comparable with the previous survey data, although short-term discontinuities have been accepted due to the increase in coverage from the new data source and the resultant increase in quality. There are no strategies in place to create a back series prior to Quarter 2 2013 based on data received by Barbour ABI.As noted in the Recent improvements section, the Announcement of Changes to New Orders in the Construction Industry article further explains the change of data source in 2013 from the ONS survey to the administrative data supplied by Barbour ABI.Coherence with construction output dataSince the ONS survey ceased being collected in 2013, there is no alternative ONS data source to act as a comparable data source for new orders in the construction industry. However, new orders are often interpreted by users as a good indicator of the future construction output data. While this is a sound assumption, it is advised that new orders are not used in this manner for a variety of reasons. Differences between the new orders and output data are further explored in Construction statistics development: Understanding the gap between construction output and new orders, published on 30 October 2018 and are detailed in this section.There is a difference in coverage between new orders and output data. All projects costing under £100,000 or a single residential property are not included in the new orders dataset, whereas, if sampled, would be included in the monthly construction output data. It should also be noted that whilst grossing weights are applied to the units in the monthly output sample to provide full estimates for the overall population of construction businesses, no weighting is applied to the new orders dataset to account for this undercoverage. Changes in specification (either projects adding in additional project requirements or downsizing the specification from initial estimations) can lead to overspend or underspend on budgets, which can mean a discrepancy between the initial estimate and later estimates of the new order. These later valuations would be the value, if sampled, that would be"
year_published = 2025
clearnet = "https://ons.gov.uk/businessindustryandtrade/constructionindustry/methodologies/newordersinconstructionqmi"
