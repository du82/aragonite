["https://ons.gov.uk/businessindustryandtrade/itandinternetindustry"]
title = "IT and internet industry - Office for National Statistics"
description = "Internet sales by businesses in the UK (total value and as a percentage of all retail sales) and the percentage of businesses that have a website and broadband connection. These figures indicate the importance of the internet to UK businesses."
full_description = "IT and internet industry Internet sales by businesses in the UK (total value and as a percentage of all retail sales) and the percentage of businesses that have a website and broadband connection. These figures indicate the importance of the internet to UK businesses. On this page: Dataset Publications Methodology View all content related to this topic: All data All publications Spotlight Internet users, UK: 2020 What's in the bulletin? 92% of adults in the UK were recent internet users in 2020, up from 91% in 2019. Almost all adults aged 16 to 44 years in the UK were recent internet users (99%), compared with 54% of adults aged 75 years and over. While there has been little change in internet use for adults aged 16 to 44 years in recent years, the proportion of those aged 75 years and over who are recent internet users nearly doubled since 2013, from 29%, to 54% in 2020. Read this statistical bulletin More publications E-commerce and ICT activity, UK: 2019 What's in the bulletin? In 2019, e-commerce sales by businesses in the UK non-financial sector with 10 or more employees were £668.9 billion, rising from £639.7 billion in 2018. These e-commerce sales comprised electronic data interchange (EDI) sales of £334.0 billion and website sales of £334.9 billion in 2019; while websales have more than trebled since the 2009 value of £110.6 billion, EDI sales have shown lower growth, rising just over a quarter from £264.5 billion in 2009. E-commerce sales were dominated by businesses with 1000 or more employees; their sales of £368.5 billion were more than half the total value of sales by all businesses with 10 or more employees (£668.9 billion). Read this statistical bulletin More publications Back to top Datasets related to IT and internet industry Internet users Internet use in the UK annual estimates by age, sex, disability, ethnic group, economic activity and geographical location, including confidence intervals. E-commerce and ICT activity Use of information and communication technology (ICT) and e-commerce activity by UK businesses. Annual data on e-commerce sales and how businesses are using the internet. Values of e-commerce sales: historic data Historical annual data (2008 to 2010) on values of sales and purchases using information and communication technology. Employees' use of computers and the internet: historic data Historical annual data (2006 to 2010) on employees using computers and the internet for work in the UK. Businesses' use of ICT: historic data Historical annual data (2006 to 2010) on UK businesses with e-commerce sales and information and communication technology purchases by size, location and industrial sector, type of connection and maximum speed. View all datasets related to IT and internet industry Back to top Publications related to IT and internet industry Statistical bulletins Internet users, UK: 2020 Internet use in the UK; annual estimates by age, sex, disability and geographical location. E-commerce and ICT activity, UK: 2019 Use of information and communication technology (ICT) and the value of e-commerce activity by UK businesses. View all related statistical bulletins Articles Sustainable Development Goals data update, UK Our fifth annual report on progress made towards measuring the global Sustainable Development Goal indicators in the UK. View all related articles Back to top Methodology related to IT and internet industry E-commerce QMI View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
