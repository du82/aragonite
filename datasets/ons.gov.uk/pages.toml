title = "People, population and community - Office for National Statistics"
description = "Residents of the UK, population changes, how we spend our money, and data on crime, relationships, health and religion. Statistics that help us build a detailed picture of how we live."
full_description = "People, population and community Residents of the UK, population changes, how we spend our money, and data on crime, relationships, health and religion. Statistics that help us build a detailed picture of how we live. In this section Armed forces community Information about the armed forces community, including those who have previously served in the armed forces (veterans) and their families, to help support the Armed Forces Covenant. Births, deaths and marriages Life events in the UK including fertility rates, live and stillbirths, family composition, life expectancy and deaths. Crime and justice Crime levels and trends based primarily on the Crime Survey for England and Wales (CSEW) and police recorded crime data. Cultural identity How people in the UK identify in terms of ethnicity, sexual identity, religion and language, and how this has changed over time using a diverse range of data sources. Education and childcare Early years' childcare, school and college education, higher education and adult learning, including data and analysis on qualifications, personnel, and safety and well-being. Elections Analysis of the number of people registered to vote, including comparisons over time and between the UK constituent countries. Health and social care Life expectancy, health inequalities, disability and addiction as well as access to and expenditure on private and public healthcare systems. Household characteristics The composition of households, including those who live alone, overcrowding and under-occupation, as well as internet and social media usage. Housing Property price, private rent and household statistics. Leisure and tourism Tourism to the UK, and UK residents travelling abroad, reasons for travel and money spent. The statistics on UK residents travelling abroad are an informal indicator of living standards. Personal and household finances Income and earnings, spending and saving, and wealth and debt. These statistics help build a picture of how living standards and inequality have changed. Population and migration Size, age, sex and geographic distribution of the UK population, including data on international migration, migration within the UK, changes in the population and the factors driving these changes. Measuring progress, well-being and beyond GDP Exploring progress in the UK using statistics on economy, environment and society Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
