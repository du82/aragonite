title = "Retail industry - Office for National Statistics"
description = "Sales by retailers in Great Britain directly to end consumers, including spending on goods (in store and online) (Retail Sales Index) and spending on services (Index of Services). The industry as a whole is used as an indicator of how the wider economy is performing and the strength of consumer spending."
full_description = '''Retail industry Sales by retailers in Great Britain directly to end consumers, including spending on goods (in store and online) (Retail Sales Index) and spending on services (Index of Services). The industry as a whole is used as an indicator of how the wider economy is performing and the strength of consumer spending. On this page: Time series Dataset Publications View all content related to this topic: All data All publications Spotlight <![endif]--> <img class="img-sparkline js--hide" src="/businessindustryandtrade/retailindustry/timeseries/j5c4/drsi/sparklineimage" alt="RSI:Value Seasonally Adjusted:All Retailers inc fuel:All Business Index between 1996 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> RSI:Value Seasonally Adjusted:All Retailers inc fuel:All Business Index 106.7 Index, base year = 100 2025 JAN Release date: 21 February 2025 Next release: 28 March 2025 View this data More data Retail sales, Great Britain: January 2025 What's in the bulletin? Retail sales volumes (quantity bought) are estimated to have risen by 1.7% in January 2025. This follows a fall of 0.6% in December 2024 (revised down from a fall of 0.3% in our last bulletin). Food store sales volumes grew strongly in January 2025, following falls in recent months. More broadly, sales volumes fell by 0.6% in the three months to January 2025, compared with the three months to October 2024, but rose by 1.4%, compared with the three months to January 2024. Read this statistical bulletin More publications Back to top Time series related to Retail industry RSI:Value Seasonally Adjusted:All Retailers inc fuel:All Business Index <![endif]--> <img class="img-sparkline js--hide" src="/businessindustryandtrade/retailindustry/timeseries/j5c4/drsi/sparklineimage" alt="RSI:Value Seasonally Adjusted:All Retailers inc fuel:All Business Index between 1996 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 106.7 Index, base year = 100 2025 JAN Release date: 21 February 2025 Next release: 28 March 2025 RSI:Value Seasonally Adjusted:All Retailers ex fuel:All Business Index <![endif]--> <img class="img-sparkline js--hide" src="/businessindustryandtrade/retailindustry/timeseries/j468/drsi/sparklineimage" alt="RSI:Value Seasonally Adjusted:All Retailers ex fuel:All Business Index between 1988 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 109.2 Index, base year = 100 2025 JAN Release date: 21 February 2025 Next release: 28 March 2025 RSI:Volume Seasonally Adjusted:All Retailers inc fuel:All Business Index <![endif]--> <img class="img-sparkline js--hide" src="/businessindustryandtrade/retailindustry/timeseries/j5ek/drsi/sparklineimage" alt="RSI:Volume Seasonally Adjusted:All Retailers inc fuel:All Business Index between 1996 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 98.7 Index, base year = 100 2025 JAN Release date: 21 February 2025 Next release: 28 March 2025 RSI:Volume Seasonally Adjusted:All Retailers ex fuel:All Business Index <![endif]--> <img class="img-sparkline js--hide" src="/businessindustryandtrade/retailindustry/timeseries/j467/drsi/sparklineimage" alt="RSI:Volume Seasonally Adjusted:All Retailers ex fuel:All Business Index between 1988 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 98.5 Index, base year = 100 2025 JAN Release date: 21 February 2025 Next release: 28 March 2025 RSI:All retail inc fuel:All Business:VAL SA:% change on same month a year ago <![endif]--> <img class="img-sparkline js--hide" src="/businessindustryandtrade/retailindustry/timeseries/j5bs/drsi/sparklineimage" alt="RSI:All retail inc fuel:All Business:VAL SA:% change on same month a year ago between 1997 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 2 % 2025 JAN Release date: 21 February 2025 Next release: 28 March 2025 RSI:All retail inc fuel:All Business:VOL SA:% change on same month a year ago <![endif]--> <img class="img-sparkline js--hide" src="/businessindustryandtrade/retailindustry/timeseries/j5eb/drsi/sparklineimage" alt="RSI:All retail inc fuel:All Business:VOL SA:% change on same month a year ago between 1997 JAN and 2025 JAN "> <!--[if gt IE 8]><!--> 1 % 2025 JAN Release date: 21 February 2025 Next release: 28 March 2025 View all time series related to Retail industry Back to top Datasets related to Retail industry Retail Sales Index time series A first estimate of retail sales in value and volume terms for Great Britain, seasonally and non-seasonally adjusted. Retail sales pounds data Total sales and average weekly spending estimates for each retail sector in Great Britain in thousands of pounds. Retail Sales Index A series of retail sales data for Great Britain in value and volume terms, seasonally and non-seasonally adjusted. Retail Sales Index internet sales Internet sales in Great Britain by store type, month and year. Retail sales, business analysis The extent to which individual businesses in Great Britain experienced actual changes in their sales. View all datasets related to Retail industry Back to top Publications related to Retail industry Statistical bulletins Retail sales, Great Britain: January 2025 Retail sales rise as food stores recover, according to a first estimate. Non-financial business economy, UK (Annual Business Survey): 2017 provisional results Size and growth within the UK's non-financial business sectors: non-financial services, distribution, production, construction and agriculture. View all related statistical bulletins Articles Estimated Effect of the Budget on Consumer Prices Index and Retail Prices Index The purpose of this article is to give the estimated impact of implementing measures announced in the March 2016 budget, previous budgets and pre-budget reports on the Consumer Prices Index (CPI), CPIH - a measure which includes owner occupiers’ housing costs, and the Retail Prices Index (RPI). View all related articles Back to top Methodology related to Retail industry Retail Sales Index (RSI) QMI View all related methodology Explore local statistics Find, compare and visualise statistics about places within 