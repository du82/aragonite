full_description = '''Leisure and tourism Tourism to the UK, and UK residents travelling abroad, reasons for travel and money spent. The statistics on UK residents travelling abroad are an informal indicator of living standards. On this page: Dataset Publications Methodology View all content related to this topic: All data All publications Spotlight Improving our travel and tourism statistics: February 2025 update Update on our progress towards planned improvements to our travel and tourism statistics, including official statistics in development. Read this article More publications Travel trends: 2023 Annual estimates of completed international visits to and from the UK, and earnings and expenditure associated with these visits. Read this article More publications Back to top Datasets related to Leisure and tourism Overseas travel and tourism – table of contents Tool to locate the datasets of Overseas travel and tourism estimates. Estimates of overseas residents’ visits and spending Quarterly estimates of overseas residents’ visits and spending. Also includes data on nights, purpose, region of UK visited and mode of travel. Breakdowns by nationality and area of residence are covered. The Quarter 4 (Oct to Dec) versions of this dataset are on a different webpage under the name "Overseas travel and tourism, quarterly". Estimates of visits and spending abroad Quarterly estimates of visits and spending abroad. Also includes data on nights, purpose, country visited and mode of travel. The Quarter 4 (Oct to Dec) versions of this dataset are on a different webpage under the name "UK residents visits and expenditure abroad, quarterly". Overseas travel and tourism, monthly Monthly estimates of overseas residents’ visits and spending and visits and spending abroad by UK or Great Britain residents. Also includes data on purpose of visit, area visited by UK residents and area of residence for overseas residents. Travelpac: travel to and from the UK Estimates of international visits with details on traveller age and sex, trip purpose, length, and spending. From the International Passenger Survey (IPS). Travel trends estimates: overseas residents in the UK and UK residents abroad Annual estimates of visits and spending for UK residents abroad and for overseas residents visiting the UK. View all datasets related to Leisure and tourism Back to top Publications related to Leisure and tourism Statistical bulletins Overseas travel and tourism, provisional: April to June 2024 Estimates for overseas travel and tourism, including visits, spending, number of nights, and purpose of visit. View all related statistical bulletins Articles Travel trends Annual estimates of completed international visits to and from the UK, and earnings and expenditure associated with these visits. Young people expect high pay and leisure time from self-employment As the number of young people working for themselves continues to rise, analysis reveals a gap between expectations and reality. Overseas travel and tourism, provisional Quarterly estimates of visits to the UK by overseas residents, air visits abroad by UK residents and spending estimates by travellers, using the International Passenger Survey and administrative sources of passenger travel covering April to December 2020. Holidays in the 1990s and now Since the 1990s, we're going on more holidays... but they're shorter than they used to be. Explore three decades of changing tourism habits. Improving our travel and tourism statistics Update on our progress towards planned improvements to our travel and tourism statistics, including official statistics in development. Leisure time in the UK An article looking at how much leisure time people in the UK take, and how that differs according to various aspects such as age or gender. This analysis gives an insight into the nation’s work-life balance, and also how much people enjoy their leisure time. View all related articles Back to top Methodology related to Leisure and tourism View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom.'''
