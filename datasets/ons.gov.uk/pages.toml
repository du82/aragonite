["https://ons.gov.uk/businessindustryandtrade"]
title = "Business, industry and trade - Office for National Statistics"
description = "Activities of businesses and industry in the UK, including data on the production and trade of goods and services, sales by retailers, characteristics of businesses, the construction and manufacturing sectors, and international trade."
full_description = "Business, industry and trade Activities of businesses and industry in the UK, including data on the production and trade of goods and services, sales by retailers, characteristics of businesses, the construction and manufacturing sectors, and international trade. In this section Business UK businesses registered for VAT and PAYE with regional breakdowns, including data on size (employment and turnover) and activity (type of industry), research and development, and business services. Changes to business UK business growth, survival and change over time. These figures are an informal indicator of confidence in the UK economy. Construction industry Construction of new buildings and repairs or alterations to existing properties in Great Britain measured by the amount charged for the work, including work by civil engineering companies. International trade Trade in goods and services across the UK's international borders, including total imports and exports, the types of goods and services traded and general trends in international trade. IT and internet industry Internet sales by businesses in the UK (total value and as a percentage of all retail sales) and the percentage of businesses that have a website and broadband connection. These figures indicate the importance of the internet to UK businesses. Manufacturing and production industry UK manufacturing and other production industries (such as mining and quarrying, energy supply, water supply and waste management), including total UK production output, and UK manufactures' sales by product and industrial division, with EU comparisons. Retail industry Sales by retailers in Great Britain directly to end consumers, including spending on goods (in store and online) (Retail Sales Index) and spending on services (Index of Services). The industry as a whole is used as an indicator of how the wider economy is performing and the strength of consumer spending. Tourism industry Tourism and travel (including accommodation services, food and beverage services, passenger transport services, vehicle hire, travel agencies and sports, recreational and conference services), employment levels and output of the tourism industry, the number of visitors to the UK and the amount they spend. Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
