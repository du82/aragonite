["https://ons.gov.uk/businessindustryandtrade/constructionindustry/articles/constructionoutputpriceindicesopis/quarter1januarytomarch2016"]
title = "Construction Output Price Indices (OPIs) - Office for National Statistics"
description = "Quarterly construction output price indices (OPIs) used in the production of chained volume measures (CVMs) for Output in the Construction Industry."
full_description = '''1. Introduction Since taking responsibility for the Construction Price and Cost Indices (CPCIs) on 1 April 2015, the Office for National Statistics (ONS) has developed an interim construction output price index (OPI). This index was put together in a short time frame and uses our existing data sources, the majority of which are National Statistics, so that users can be assured of the quality of the source data.The results for the interim construction price index were published for the first time on 12 June 2015. This article provides a quarterly update to these results and includes data to March 2016. The data in this release (Quarter 1 2016) incorporates updated 2015 Output in the Construction Industry data to weight new work and repair and maintenance. The new weights affect the data from January 2015 onwards. For more information please see the background notes within this release.Information about the methods used to compile the interim construction OPIs, as well as the results of our user survey and plans for the future development of price indices for construction, were published on 28 September 2015 . Back to table of contents 2. Headline results The interim construction OPI for all construction rose 1.7% in the year to March 2016, down from an increase of 2.3% in the year to February 2016.The interim construction OPI for all new work increased 2.2% in the year to March 2016, down from an increase of 3.2% in the year to February 2016. Public non-housing and private commercial are seeing the largest movements where prices for both increased by 2.3% in the year to March 2016.The interim OPI for all repair and maintenance increased by 0.7% in the year to March 2016, up from a 0.6% increase in February 2016. This increase is mostly accounted for by the housing repair and maintenance sector, which saw an increase of 0.8% in the year to March 2016.Prices continued to rise in the year to March 2016 for all work types. Back to table of contents 3. All construction Overall, prices in the construction industry, as estimated by the interim construction OPI, have risen between January 2014 and March 2016. There is an upward trend evident across all new work, and repair and maintenance sectors when compared with the same month a year ago (Figure 1). The peaks and troughs seen in the all new work index were driven by the earnings component of the OPI, which is sourced from the Average Weekly Earnings index for construction. Figure 1: Interim construction output price indices (2005=100), UK January 2014 to March 2016 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/articles/constructionoutputpriceindicesopis/quarter1januarytomarch2016/622a612d&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics Download this chart Figure 1: Interim construction output price indices (2005=100), UK Image .csv .xls Annual growth rates in the interim construction OPI were positive throughout the January 2014 to March 2016 period (Figure 2) except for 1 instance where prices were lower than in the same month of the previous year. This occurred in the new work index in April 2014 when the index fell 0.3% on the year. Repair and maintenance work shows positive year-on-year growth in all periods. Figure 2: Construction output price annual percentage change, UK January 2014 to March 2016 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/constructionindustry/articles/constructionoutputpriceindicesopis/quarter1januarytomarch2016/9779ce94&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics Download this chart Figure 2: Construction output price annual percentage change, UK Image .csv .xls Back to table of contents 4. New work The interim OPI for all new construction work increased 2.2% in the year to March 2016. These changes were a result of increases in output prices in all sectors (Table 1). Table 1: New work output price indices, UK, March 2016 (percentage change) .b1{white-space-collapsing:preserve;} .t1{border-collapse:collapse;border-spacing:0;} .r1{height:13.8pt;} .r2{height:17.25pt;} UK SectorPercentage change annualmonthly Housing (public & private)2.20.4 Infrastructure1.90.3 Public non-housing2.30.0 Private industrial2.00.4 Private commercial2.30.0 All new work2.20.2 Source: Office for National Statistics (function(){function c(){var b=a.contentDocument||a.contentWindow.document;if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'91c70862a911c5a5',t:'MTc0MTMxODQyMS4wMDAwMDA='};var a=document.createElement('script');a.nonce='';a.src='/cdn-cgi/challenge-platform/scripts/jsd/main.js';document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})(); Download this table Table 1: New work output price indices, UK, March 2016 (percentage change) .xls (25.1 kB) All sectors show positive annual growth in March 2016. Public non-housing and private commercial are both seeing the largest movement with annual increases of 2.3%. Back to table of contents 5. Repair and maintenance The interim OPI for all repair and maintenance increased 0.7% in the year to March 2016. Much of this increase was accounted for by a rise in the housing repair and maintenance sector, which saw output prices increase by 0.8% on the year (Table 2). Table 2: Repair and maintenance construction output price indices, UK, March 2016 (percentage change) .b1{white-space-collapsing:preserve;} .t1{border-collapse:collapse;border-spacing:0;} .r1{height:13.8pt;} .r2{height:17.25pt;} UK SectorPercentage change annualmonthly Housing R&M0.80.3 Non-housing R&M0.50.2 All repair & maintenance0.70.3 Source: Office for National Statistics Download this table Table 2: Repair and maintenance construction output price indices, UK, March 2016 (percentage change) .xls (24.6 kB) Back to table of contents .Background notes Use within ONSThese interim construction OPIs were used to deflate Output in the Construction Industry for the first time in the April 2015 release, published on 12 June 2015. Further details on the impact of using these indices have been published in a separate article. Linking to previous seriesThe Construction Price and Cost Indices (CPCIs) were previously published by the Department for Business, Innovation and Skills (BIS) and were published for the last time in September 2014, with the release suspended in December 2014. Responsibility for these statistics transferred to us on 1 April 2015, as previously announced.Users wishing to link the BIS CPCIs (prior to 2014) and our new construction OPIs (from 2014 onwards) to create longer-running time series, have many options. One approach would be to use a linking factor (based on a common time period) similar to the process suggested to link Producer Price Index series on different price bases as described on page 2 of this question and answer paper.Further guidance on using indices in indexation clauses is also available. De-designation as National StatisticsThe Construction Price and Cost Indices were de-designated as National Statistics in December 2014, after their suspension, as detailed in a letter from Ed Humpherson, Director General for Regulation. Experimental StatisticsThese statistics have been published on an experimental basis to involve users in their development. As a result, improvements to methods may result in revisions to the series. Full details of any revisions will be released alongside the revised data. Revisions policyThe interim construction OPIs are dependent on the revisions policies associated with their component series. For routine revisions, such as inclusion of late respondent data and monthly re-estimation of seasonal adjustment factors, the interim construction OPIs will be open to revisions for a period of 5 months, in line with PPI, its main component.Non-routine revisions may also occur, for example, as a result of reviews and updates of methodologies of component series. When historic changes to component series arise, their impact on the construction OPI series will be assessed and any changes highlighted to users. Changes in this releaseThis release (Quarter 1 2016) incorporates updated 2015 Output in the Construction Industry data to weight new work and repair and maintenance, which have become available since the previous publication in February 2016. The changes affect the series back to 2015. Incorporating this newer information has had minimal impact on the interim construction OPIs. Back to table of contents'''
author = "hewitm"
year_published = 2025
clearnet = "https://ons.gov.uk/businessindustryandtrade/constructionindustry/articles/constructionoutputpriceindicesopis/quarter1januarytomarch2016"
tags = [".background", ".xls", "2016,", "2016.", "accept", "annual", "april", "business,", "change,", "changes"]
language = "en"
internal-references = ["none"]
external-references = ["analysisfunction.civilservice.gov.uk", "careers.ons.gov.uk", "code.statisticsauthority.gov.uk", "consultations.ons.gov.uk", "cqc.org.uk", "explore-local-statistics.beta.ons.gov.uk", "gov.uk", "in-tendhost.co.uk", "instagram.com", "legislation.gov.uk", "nationalarchives.gov.uk", "nomisweb.co.uk", "ombudsman.org.uk", "ons.ent.sirsidynix.net.uk", "statisticsauthority.gov.uk", "statsusernet.org.uk", "statsusernetwork.ons.gov.uk", "surveys.ons.gov.uk", "twitter.com", "w3.org"]

["https://ons.gov.uk/businessindustryandtrade/internationaltrade/bulletins/internationaltradeinservices/2018"]
title = "International trade in services, UK - Office for National Statistics"
description = "Product, industry and geographical annual breakdowns of imports and exports of services, excluding travel, transport and banking sectors."
full_description = '1. Main points The total UK trade in services surplus (excluding travel, transport and banking) widened to £93.2 billion in 2018; this was an increase of 11.7% from 2017. Total UK exports of services (excluding travel, transport and banking) rose by 14.3% in 2018 to £185.3 billion; imports of services increased by 17.0% to £92.1 billion. By region, Europe continued to be the largest export and import markets of UK businesses in 2018, accounting for 51.4% and 56.2% respectively. Financial services continued to be the largest service product exported globally, with £21.7 billion worth exported by UK businesses (excluding travel, transport and banking industries) in 2018. Back to table of contents 2. Things you need to know about this release The 2018 International trade in services (ITIS) bulletin provides a detailed breakdown of annual trade in services estimates, analysing data by country, product, and industry. These data are sourced from our International Trade in Services Survey.The ITIS Survey is the main source of UK services trade data, although it is important to note that the survey does not cover the whole UK services economy. The travel, transport and banking industries are not covered by the ITIS Survey, as these data are obtained from other sources such as the International Passenger Survey and the Bank of England. Any reference to trade in services within this bulletin therefore means services excluding travel, transport and banking.Estimates for the overall level of trade in services, including these industries, are published in our annual Pink Book, monthly UK trade publications, and quarterly UK trade in services by partner country publications. Comparing the ITIS Survey data with the annual estimates of total trade in services published in Pink Book 2019, ITIS contributed approximately 52.6% and 45.7% respectively of the total trade in services export and import estimates for the UK in 2018 (Figure 1). Figure 1: International trade in services contributed 52.6% of the total trade in services export estimates in 2018 Percentage contribution of Trade in Services Survey to total trade in services, UK, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/internationaltradeinservices/2018/f7254aeb&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – International Trade in Services Survey Download this chart Figure 1: International trade in services contributed 52.6% of the total trade in services export estimates in 2018 Image .csv .xls Statistics presented in this bulletin include some estimates for businesses operating in the financial services industry, and values of exports and imports of financial services products. The exclusion of banks and other related financial intermediaries means that these estimates only capture part of UK trade in financial services. Reported trade for the “financial services” industries only capture exports and imports of businesses involved in non-banking activities, such as: businesses operating and supervising financial markets security and commodity contract brokers who deal on behalf of others auxiliary financial services such as transaction processing, settlement, and advisory services businesses involved in auxiliary insurance and pension activities such as risk, evaluation, and sales fund management services Financial services products exported or imported by businesses operating in industries unrelated to financial services are also included. Back to table of contents 3. The total UK trade in services surplus increased in 2018 The UK has run a trade in services balance (excluding travel, transport and banking) surplus for many years, where the value of UK exports has exceeded the value of UK imports. The services surplus widened 11.7% in 2018, from £83.4 billion in 2017 to £93.2 billion.UK exports of services continued to follow an upward trend in 2018, increasing £23.2 billion, or 14.3%, from £162.1 billion in 2017 to £185.3 billionUK imports of services also continued to rise, increasing by £13.4 billion, or 17.0%, from £78.7 billion in 2017 to £92.1 billion in 2018. Figure 2: The trade in services surplus continued to widen in 2018 Total trade in services (excluding travel, transport and banking), 2001 to 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/internationaltradeinservices/2018/c848724e&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – International Trade in Services Survey Notes: All values are at current prices (see the quality and methodology section for a definition). Download this chart Figure 2: The trade in services surplus continued to widen in 2018 Image .csv .xls Back to table of contents 4. UK trade in services with Europe continued to drive trade growth in 2018 Europe has traditionally been a major destination for UK exports of services (excluding travel, transport and banking). This trend continued in 2018, with UK services exports to Europe accounting for 51.4% of the total.UK exports of services to Europe increased by 17.6% in 2018, from £80.9 billion in 2017 to £95.2 billion. This was driven by increases in UK service exports to the EU, which increased by £10.1 billion to £72.6 billion, largely because of increased exports to Ireland, Sweden, the Netherlands, and Austria.By geographical region, the Americas continued to be the second-largest destination for UK services exports in 2018, accounting for 27.8% of the overall total. Exports to the Americas increased by 12.3% in 2018, from £45.9 billion in 2017 to £51.5 billion. The United States (US) was the largest contributor to this increase, rising by £5.2 billion to £43.4 billion.Europe also continued to be a major source of UK service imports in 2018, accounting for 56.2% of the overall total. Imports from the continent increased by 26.3% from £41.0 billion in 2017 to £51.8 billion. This was driven by increased service imports from the EU, which increased by £9.2 billion to £43.2 billion. Ireland, Sweden and France were the largest contributors to this increase.The Americas remained the second-largest regional source for UK service imports in 2018, accounting for 25.3% of the total. Imports from the region increased by 2.7% from £22.7 billion in 2017 to £23.3 billion. The increase was largely driven by a rise in service imports from the US, which grew by £1.3 billion to £21.0 billion. Figure 3: UK trade in services with Europe continued to drive trade growth in 2018 UK trade in services (excluding travel, transport and banking) by continent, 2012 to 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/internationaltradeinservices/2018/735ec819&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – International Trade in Services Survey Notes: All values are at current prices (see the quality and methodology section for a definition). Geographical groupings can be found in the quality and methodology section. Download this chart Figure 3: UK trade in services with Europe continued to drive trade growth in 2018 Image .csv .xls Back to table of contents 5. Financial services was the largest UK service export in 2018 UK exports of services by productFinancial services continued to be the single largest service product exported from the UK. UK exports of financial services have been increasing annually since 2014; this trend continued in 2018 with exports increasing by 8.6% from £20.0 billion in 2017 to £21.7 billion.Though financial services was the largest service type exported, UK exports of business management, and management consulting services showed the largest product level growth in 2018, increasing by 48.8% from £11.1 billion in 2017 to £16.6 billion. Figure 4: Financial services was the largest UK service export in 2018 Top 10, UK trade in services (excluding travel, transport and banking) exports by product, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/internationaltradeinservices/2018/78f43a2b&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – International Trade in Services Survey Notes: All values are at current prices (see the quality and methodology section for a definition). Download this chart Figure 4: Financial services was the largest UK service export in 2018 Image .csv .xls UK imports of services by productServices between related enterprises (services between businesses within the same group, for example parent companies, branches, associates, subsidiaries or affiliates) remains the single largest service product imported to the UK in 2018, with imports steadily increasing annually. In 2018, imports of this service product increased 19.4%, from £14.1 billion in 2017 to £16.8 billion.Business management, and management consulting services was the second-largest service product imported to the UK in 2018, as well as having the largest year-on-year increase, rising by 53.3% from £5.9 billion in 2017 to £9.1 billion in 2018. Figure 5: Services between related enterprises was the largest UK service import in 2018 Top 10 UK trade in services (excluding travel, transport and banking) imports by product, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/internationaltradeinservices/2018/52d98833&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – International Trade in Services Survey Notes: All values are at current prices (see the quality and methodology section for a definition). Download this chart Figure 5: Services between related enterprises was the largest UK service import in 2018 Image .csv .xls Back to table of contents 6. UK exports and imports of services were dominated by the professional, scientific & technical activities, and information & communication industries in 2018 UK exports of services by industryThe professional, scientific and technical activities, and information and communication industries continued to be the dominant industries responsible for exporting services (excluding travel, transport and banking) in 2018. These industries accounted for a combined 54.8% of UK services exports.Exports by the professional, scientific and technical activities industries increased by 20.0%, from £45.0 billion in 2017 to £54.0 billion in 2018. This was driven by increased exports of legal services, which rose £1.5 billion to £6.6 billion, and business management and management consulting services, which grew by £1.1 billion to £5.9 billion.Service exports by the information and communication industry increased 11.3% from £42.7 billion in 2017 to £47.5 billion in 2018. Exports of business management and management consulting services saw the largest year-on-year growth within the industry from £3.3 billion in 2017 to £5.2 billion. Figure 6: Professional, scientific and technical activities was the dominant industry in exports in 2018 UK trade in services (excluding travel, transport and banking) exports by industry, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/internationaltradeinservices/2018/171cfa0b&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – International Trade in Services Survey Notes: All values are at current prices (see the quality and methodology section for a definition). Download this chart Figure 6: Professional, scientific and technical activities was the dominant industry in exports in 2018 Image .csv .xls UK imports of services by industryThe information and communication, and professional, scientific and technical activities industries continued to be the dominant industries for services imports (excluding travel, transport and banking) in 2018. These industries accounted for a combined 55.0% of total UK imports of services.Imports by the information and communication industry increased by 11.1% from £25.1 billion in 2017 to £27.9 billion in 2018. This was driven by increased imports of services between related enterprises, which rose £0.7 billion to £6.4 billion, and advertising, market research and public opinion polling services, which grew by £0.6 billion to £1.6 billion. Imports of services by the professional, scientific and technical activities industry increased by 19.6% from £19.0 billion in 2017 to £22.8 billion. The increase was largely driven by business management & management consulting services, which rose £1.1 billion to £3.0 billion, and services between related enterprises, which grew by £0.8 billion to £3.2 billion. Figure 7: Professional, scientific and technical activities was the dominant industry in imports in 2018 UK trade in services (excluding travel, transport and banking) imports by industry, 2018 <!--[endif]--> <img src="/chartimage?uri=/businessindustryandtrade/internationaltrade/bulletins/internationaltradeinservices/2018/6dea9b13&width=&hideSource=true" alt="" /> <!--[if gt IE 8]><!--> Source: Office for National Statistics – International Trade in Services Survey Notes: All values are at current prices (see the quality and methodology section for a definition). Download this chart Figure 7: Professional, scientific and technical activities was the dominant industry in imports in 2018 Image .csv .xls Back to table of contents 7. Quality and methodology Basic quality informationThe International trade in services Quality and Methodology Information report contains important information on: how the output was created the strengths and limitations of these data and how they compare with related data users and uses of the data the quality of the output including the accuracy of data AccuracySample surveys are used instead of censuses because the process of conducting a census would be too lengthy and costly to be viable. When observing a sample instead of a whole population, sampling error can be introduced. While each sample is designed to produce the most accurate estimate of the true population value, a number of equal-sized samples covering the population would generally produce varying population estimates. Standard errors are an estimate of the sampling error and provide a measure of the precision of the estimate. A low standard error indicates a precise estimate. To aid comparison, the standard error is also expressed as a percentage of the total value, allowing the standard error to be put in context. Table 1: Standard errors, 2018 ExportsImports IndustriesEstimate (£ million)Standard error (£ million)Relative Standard error (%)Estimate (£ million)Standard error (£ million)Relative Standard error (%) Total ITIS185,3014,388292,10817642 Manufacturing15,806156112,0361281 Wholesale and Retail18,664152489,803124413 Information'
