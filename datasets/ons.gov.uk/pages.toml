["https://ons.gov.uk/cookies"]
title = """
Cookies  - Office for National Statistics"""
full_description = "Cookies on ONS.GOV.UK Cookies are files saved on your phone, tablet or computer when you visit a website. We use cookies to store information about how you use the ons.gov.uk website, such as the pages you visit. Cookie settings We use 2 types of cookie. You can choose which cookies you're happy for us to use. We use JavaScript to set most of our cookies. It appears that JavaScript is not running on your browser, so we are unable to change your cookie settings. To change this you can try: reloading the page turning on JavaScript in your browser Without JavaScript we will only set cookies that are strictly necessary. Cookies that measure website use We use Google Analytics and Hotjar to measure how you use the website so we can improve it based on user needs. Google Analytics and Hotjar set cookies that store anonymised information about: how you got to the site the pages you visit on ons.gov.uk and how long you spend on each page what you click on while you are visiting the site the way in which you interact with a page whether you have participated in a Hotjar survey Regardless of your choice, we do not allow Google or Hotjar to use or share the data about how you use this site. On Off Strictly necessary cookies These essential cookies do things like remember your progress through a form. They always need to be on to allow the website to function properly. Find out more about cookies on ons.gov.uk Save change"
