["https://ons.gov.uk/peoplepopulationandcommunity/wellbeing"]
title = "Measuring progress, well-being and beyond GDP - Office for National Statistics"
description = "Exploring progress in the UK using statistics on economy, environment and society"
full_description = "Measuring progress, well-being and beyond GDP Exploring progress in the UK using statistics on economy, environment and society On this page: Dataset Publications Methodology View all content related to this topic: All data All publications Spotlight Measuring progress, well-being and beyond GDP in the UK: November 2024 What's in the bulletin? The UK’s climate is changing: there were increases between two 30-year periods (1961 to 1990 and 1991 to 2020) in the average UK temperature by 0.8 degrees Celsius, rainfall by 7.3% and sunshine by 5.6%. Despite a long-term decline in the abundance of UK priority species from a baseline index of 100.0 in 1970 to 36.6 in 2021, this has remained relatively stable since 2016 Around 6 in 10 (57%) adults in Great Britain reported climate change and the environment as an important issue for the UK, when asked in October 2024. Read this statistical bulletin More publications Public opinions and social trends, Great Britain: January 2025 What's in the bulletin? The following information is from data collected from 8 January to 2 February 2025, based on adults in Great Britain. When asked about the important issues facing the UK today, the most commonly reported issues were the NHS (86%), the cost of living (86%), the economy (71%), crime (60%), housing (57%), climate change and the environment (57%), and immigration (54%). Younger adults aged 16 to 29 years were more likely than older adults to report the cost of living, housing, employment, education and EU exit as important issues; older adults aged 70 years and over were more likely than younger adults to report the NHS, the economy, crime, immigration and international conflict. Read this statistical bulletin More publications UK Measures of National Well-being Dashboard An overview of well-being in the UK on an individual, community and national level. Considers change across 59 measures of well-being, grouped by 10 topic areas. Back to top Datasets related to Measuring progress, well-being and beyond GDP UK Measures of National Well-being The UK’s progress across 10 topic areas of national well-being. Breakdowns by UK country and region, age and sex, including quality information where available. Estimates of quarterly greenhouse gas emissions Estimates of greenhouse gas emissions using the Chow-Lin regression-based temporal disaggregation method, quarterly data. Household satellite account, UK Biennial data on the output, intermediate consumption and gross value added of home produced services. Annual personal well-being estimates Annual estimates of life satisfaction, feeling that the things done in life are worthwhile, happiness and anxiety in the UK, by national, country, regional, county, local and unitary authority level and personal characteristics including analysis on the characteristics that are most likely to impact personal well-being. Experiences of NHS healthcare services in England Experiences of local GP services, NHS treatment waiting lists, dentistry and pharmacy services, analysing data from the Health Insight Survey commissioned by NHS England. These are official statistics in development. Children's well-being measures The latest data for the measures of children’s well-being, complementing the UK Measures of National Well-being. View all datasets related to Measuring progress, well-being and beyond GDP Back to top Publications related to Measuring progress, well-being and beyond GDP Statistical bulletins UK Environmental Accounts: 2024 Measuring the contribution of the environment to the economy, impact of economic activity on the environment, and response to environmental issues. UK natural capital accounts: 2024 Estimates of the financial and societal value of natural resources to people in the UK. Personal well-being in the UK: April 2022 to March 2023 Estimates of life satisfaction, worthwhile, happiness, and anxiety, by select geographies including local authority level and individual characteristics and circumstances. Public opinions and social trends, Great Britain: January 2025 Social insights on daily life and events, including experiences of loneliness, hopefulness for the future, well-being and general health as well as attitudes to important issues, from the Opinions and Lifestyle Survey (OPN). Crime in England and Wales: year ending September 2024 Crime against households and people aged 16 years and over, using data from police recorded crime and the Crime Survey for England and Wales (CSEW). Health in England: 2015 to 2021 Insights into England’s health during the coronavirus (COVID-19) pandemic at national, regional and local authority level, using the Health Index. View all related statistical bulletins Articles Which skills are employers seeking in your area? Explore which jobs are advertised the most in your UK local authority area, and how many local residents have the relevant skills to fill them UK inclusive wealth and income accounts Estimates and analysis of economic progress, including a broader range of economic activities and assets than gross domestic product (GDP), like unpaid household services, ecosystem services, and more. Inclusive capital stock, UK Bringing together estimates of productive capital, natural capital and human capital, this article gives a picture of the UK’s inclusive capital stock for 2019 and 2020. Overview of human capital estimates in the UK National estimates of human capital stock in the UK for years between 2004 and 2020. Includes full and employed human capital estimates for each year. Exploring loneliness in children, Great Britain Analysis of children's (aged 10 to 15 years) reporting of loneliness and perception of their circumstances from The Children’s Society Household Survey. Energy efficiency of housing in England and Wales Insights on the energy efficiency and central heating main fuel type for new and existing homes by property type, tenure, and property age for national and subnational geographies. View all related articles Back to top Methodology related to Measuring progress, well-being and beyond GDP Inclusive Income methodology Natural Capital Measuring UK greenhouse gas emissions UK Measures of National Well-being user guide Personal well-being in the UK QMI Personal well-being frequently asked questions View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
