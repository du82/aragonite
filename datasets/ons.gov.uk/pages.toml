full_description = "This accessibility statement applies to the www.ons.gov.uk website, which is run by the Office for National Statistics (ONS). It was last reviewed in March 2024. The next review will take place in October 2024. The ONS aims to be inclusive in all that we do. We want everyone who visits our website to have a positive experience, and easily find and use the information they need. To help you, we have made our website simple to understand and more user-friendly, so you can: change colours, contrast levels and fonts zoom in up to 300% without the text spilling off the screen navigate most of the website using just a keyboard navigate most of the website using speech recognition software listen to most of the website using a screen reader, including the most recent versions of JAWS, NVDA and VoiceOver If you have a disability, AbilityNet has advice on making your device easier to use.How accessible the website isWe know some parts of the ONS website are not fully accessible: some tables do not have row headers the file names of some downloadable files are not easy to read or understand some content embedded into web pages, such as data visualisations, may not be accessible, particularly for users where JavaScript is disabled our web page content is accessible but some of our web pages give you the option to download a PDF copy of the web page content; these PDFs are not fully accessible some content on the website is available only in PDFs and these are not fully accessible some Excel documents may not be accessible and may be difficult to use with screen readers and keyboard-only navigation the interactive pop-up polls we use to collect feedback on some pages are not fully accessible the web chat service on our general and statistical enquiries page is not fully accessible How to request content in an accessible formatIf you need information from the ONS website in a different format, please contact us and tell us: the web address (URL) of the content your name and email address the format you would like the information provided in We will reply within five working days to let you know when we will be able to provide the information. We will consider each request but may not be able to provide an alternative accessible format on every occasion. Any personal data provided as part of the request will be stored in line with our privacy notice.If you cannot view the maps on our office locations page, please call or email us for directions.Reporting accessibility problemsWe are working to meet accessibility standards across our website. If you experience any difficulty in accessing our website, please contact us.Enforcement procedureThe Equality and Human Rights Commission (EHRC) is responsible for enforcing the Public Sector Bodies (Websites and Mobile Applications) (No. 2) Accessibility Regulations 2018 (the “accessibility regulations”). If you contact us with a complaint and you are not happy with our response, contact the Equality Advisory and Support Service (EASS).We will update this statement once work is complete to review the website in line with the changes introduced in WCAG version 2.2, which came into effect in October 2023. Technical information about the website’s accessibilityThe Office for National Statistics is committed to making the ONS website accessible, in accordance with the Public Sector Bodies (Websites and Mobile Applications) (No. 2) Accessibility Regulations 2018.Compliance status of the websiteThe ONS website is partially compliant with the Web Content Accessibility Guidelines version 2.1 AA standard due to the non-compliances and the exemptions listed below. Non-accessible content on the websiteThe content listed below is non-accessible for the following reasons.Non-compliance with the accessibility regulationsTablesSome tables do not have table row headers when needed, so you cannot navigate using the headers. This is because of the publishing tool we currently use. This fails WCAG 2.1 success criterion 1.3.1: info and relationships and we are currently working to resolve this issue.File namesThe file names of some downloadable files are not easy to read or understand. This fails WCAG 2.1 success criteria 3.1: readable and 3.2: predictable. We have ensured that all newer download file names are now readable and are currently working to resolve the issue for older download files.PDF copies of HTML pagesOur web page content is accessible. Many of our web pages give you the option to download a PDF copy of the web page content. These PDFs are not fully accessible. This fails WCAG 2.1 success criteria: 1.1.1: non-text content 1.3.1: info and relationships 2.1.1: keyboard 2.4.1: bypass blocks 2.4.2: page titled 2.4.4: link purpose (in context) 2.4.9: link purpose (link only) 3.1.1: language of page Interactive pop-up pollsThe interactive pop-up polls we use to collect feedback on some pages of the ONS website are not fully accessible. These are provided by a third party. We use these polls to gather valuable user feedback that helps us to improve the website and its content. We have identified the following accessibility issues in line with WCAG 2.1 guidelines and success criteria: the button to expand and collapse the poll does not have a corresponding accessible name; this fails 1.3.1: info and relationships and 4.1.2: name, role, value the expandable functionality of the pop-up poll and its elements is not indicated; this fails 1.3.1: info and relationships and 4.1.2: name, role, value the incorrect role is applied to the poll component; this fails 4.1.2: name, role, value the error handling for the pop-up does not identify the error to the user or provide instructions or suggestions for a way to correct it; this fails 3.3.1: error identification and 3.3.2: labels or instructions although users can access all elements when interacting with the poll using keyboard-only commands, user focus is taken to the top of the page once a question within the poll has been answered; this fails 2.4.2: focus order the rating scale information in the questions is not accessible for screen-reader users; this fails 1.3.1: info and relationships, 1.3.2: meaningful sequence and 3.3.2: labels or instructions the skip button within the pop-up poll does not clearly describe its purpose; this fails 2.4.6: headings and labels users cannot change the text spacing to improve their reading experience; this fails 1.4.12: text spacing We are working with the third-party supplier to resolve these issues. If we cannot resolve these issues, we will explore the use of other accessible feedback options. If you want to give us feedback about the website without using pop-up polls, please email us at sharedcustomercontactcentre@ons.gov.uk.Data in Statistical Data and Metadata eXchange (SDMX) formatOur UK National Summary Data Page (NSDP) contains data published in the Statistical Data and Metadata eXchange (SDMX) format. Data on this page are chosen by the International Monetary Fund (IMF) and published in the SDMX format. This is part of a requirement to be consistent with the Special Data Dissemination Standard (SDDS) Plus. The SDMX links on our NSDP are presented in table cells. This fails WCAG 2.1 success criteria: 1.3.1: info and relationships 2.4.4: link purpose (in context) 2.4.9: link purpose (link only) We are currently developing a new way to present SDMX datasets that both meets accessibility requirements and our obligations to the IMF.Web chat serviceThe web chat service on our general and statistical enquiries page is not fully accessible. This service is provided by a third-party supplier. It allows users to contact our Customer Contact Centre directly with any queries they may have. The accessibility issues for the web chat service, and the WCAG 2.1 success criteria they relate to, are: some images are missing alt text (1.1.1: non-text content and 2.4.4: link purpose (in context)) some links open content in a new window (1.1.1: non-text content and 2.4.4: link purpose (in context)) some content bleeds through for some screen reader users (2.4.3: focus order) some forms and buttons are not labelled (1.3.1: info and relationships) some areas do not meet the minimum contrast requirements (1.4.11: non-text contrast) remaining character count is not announced when using an input field (4.1.3: status messages) some status updates are not announced (4.1.3: status messages) We are currently working with the third-party supplier to resolve these issues. Disproportionate burdenData visualisations Our website contains thousands of data visualisations. Since 23 September 2020, all new data visualisations have been produced in line with the relevant WCAG guidelines for web content. We ensured that any data visualisations produced prior to this date, and which equated to 95% of page views for the 12 months before 23 September 2020, were made accessible. This means there are a number of historical data visualisations that may not be fully accessible. We have looked at the resources required to make all historical data visualisations on the website accessible compared with their use and believe that this would be a disproportionate burden. We are currently developing a process for decommissioning historical data visualisations that are no longer well used. Some of our embedded data visualisations will not load or function correctly for users where JavaScript is disabled. This is because of the PymJS software that we use to render the iframes responsively on the website. This is a constraint of our current publishing system and process, and it will be a requirement to address this issue in future systems. The data and commentary displayed within any embedded data visualisations is accessible through other formats, such as the accompanying Excel downloads and the HTML content on the bulletin or article page. We have looked at the resources required to resolve this issue for all current and historical data visualisations and believe that this would be a disproportionate burden.Content published in PDF only Our website contains some historical content that is PDF-only. The accessibility regulations do not require us to make PDFs or other documents published before 23 September 2018 accessible if they are not essential to providing our services. Any PDFs published after 23 September 2020 that are essential for providing our services are in line with the relevant WCAG guidelines. This means that some PDF-only content published before this date may not be fully accessible. We have looked at the resources needed to make all historical PDF-only content on the website accessible compared with their use and relevance. We believe that this would be a disproportionate burden. Data tables published in PDFs Many of our web pages give you the option to download a PDF copy of the HTML web page content. Some of these PDFs contain additional data tables at the end of the PDF that are not presented on the web page. The data tables in these PDFs are not fully accessible. In all instances, the data tables are accessible through the related data button on the web page and by accessing the relevant accompanying datasets. We have looked at the resources needed to make the data tables within these auto-generated PDFs accessible. We believe that making them accessible would be a disproportionate burden. Excel documents Our website contains many Excel documents, including historical and previous versions of datasets. These may contain data tables that are difficult to use with screen readers and keyboard-only navigation. We have been making improvements to the accessibility of our Excel files since September 2020 to bring them in line with the Government Analysis Function's accessibility guidance on releasing statistics in spreadsheets, focusing on our regular and high-profile releases and latest editions of data. We have also been engaging with stakeholders and key user groups, where necessary, to understand how any changes to our dataset files and structures would affect their processes. We have looked at the resources needed to make all historical and previous versions of Excel documents on the website accessible. We believe that making them accessible would be a disproportionate burden. We will ensure that dataset accessibility is a requirement for any future publishing systems and processes. Content that is not within the scope of the accessibility regulationsPDFs and other documents published before 23 September 2018The accessibility regulations do not require us to make PDFs or other documents published before 23 September 2018 accessible if they are not essential to providing our services. For example, we do not plan to make the PDFs on the Beyond Census 2011 reports and publications page accessible as the newest document was published in January 2015 when the Beyond 2011 project closed.What we are doing to improve accessibilityWe are currently working to resolve the issues identified in this accessibility statement. We are also working with others across the ONS to make accessibility central to the way we create content and documents, so they can be used by everyone. Preparation of this accessibility statementThis statement was prepared on 19 September 2020. We last reviewed and updated it on 22 March 2024. The ONS website was last tested on 19 May 2020 against the WCAG 2.1 AA standard. The Digital Accessibility Centre Limited (DAC) did the test. DAC carried out manual testing with people with a range of disabilities on desktop, mobile and tablet devices. The testing consisted of a series of tasks where they got to use the majority of page and content types on the ONS website."
year_published = 2025
clearnet = "https://ons.gov.uk/help/accessibility"
