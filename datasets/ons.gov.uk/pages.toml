full_description = "Improving lives through data When you join the Office for National Statistics (ONS), you’re starting a career that counts. Find your role The work that we do and the data we publish make a real difference. We’re responsible for sharing data and analysis about some of the most important issues facing the UK. Learn more about what we do Putting people at the heart of everything we do. The work we do truly matters. We know that we can only deliver this important work by employing the right people and supporting our colleagues. That’s why we’ve built a brilliant place to work where you will have everything you need to be your best. Find out more about life at the ONS “It’s not just about what the ONS wants from you. They will invest in you as much as you invest in them, and that’s something that I think is brilliant!” Jack – Senior Research Officer See our colleague stories Find where you belong We might have statistics in our name but at the ONS we offer plenty of different roles. Find one that works for you. Digital and data Join one of our specialist teams, using the latest technology and techniques to process data. Operational delivery Working as a field interviewer, or in one of our office roles, you will play an important part in delivering our work across the organisation. Analytical roles Join the experts who help us to create official statistics that make a real difference. View all job roles Our benefits Your well-being “The ONS offers help and support to make sure that my time in work is a positive experience.” Cath, Strategic Resourcing Partner Your work your way “Flexible working means a healthy balance between my work and home life.” Oliver, Principal Research Officer Your pension “The Civil Service pension scheme offers fantastic benefits for me and my loved ones.” Sonia, Head of Government Digital and Data Academy Find out more about our benefits"
