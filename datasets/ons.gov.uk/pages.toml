full_description = "Using the ONS websiteYou agree to use this website only for lawful purposes. You must also use it in a way that does not infringe the rights of, or restrict or inhibit the use and enjoyment of, this site by anyone else.We update our content all the time. We can change or remove content at any time without notice.Read more about how we are ensuring fair and equal access to our site and its content in our Fair use policy. Linking to and from the ONS websiteWe welcome and encourage other websites to link to this website.You must contact us for permission if you want to either: charge your website’s users to click on a link to any page on this website say your website is associated with or endorsed by the ONS This website links to websites that are managed by other organisations. We do not have any control over or endorse the content on these websites.We are not responsible for: the protection of any information you give to these websites any loss or damage that may come from your use of these websites or any other websites they link to You agree to release us from any claims or disputes that may come from using these websites. You should read all terms and conditions, privacy policies, and end user licences that relate to these websites before you use them.Using ONS contentMost content on this website is subject to Crown copyright protection and is published under the Open Government Licence (OGL). Some content is exempt from the OGL – check the list of exemptions.Reproduction of information is subject to the terms of the OGL and the UK Government Licensing Framework.We make most of the content on this website available through feeds for other websites and applications to use. The websites and applications that use our feeds are not our products, and they might use versions of our content that have been edited and stored for later use (“cached”).We do not give any guarantees, conditions or warranties about the accuracy or completeness of any content used by these products. We are not liable for any loss or damage that may come from your use of these products.The most up-to-date version of our content will always be on the ONS website.DisclaimerWhile we make every effort to keep our content up to date, the ONS is not responsible for how the information is used, how it is interpreted or what reliance is placed on it. We do not provide any guarantees, conditions or warranties that the information will be: current secure accurate complete free from bugs or viruses We do not publish advice. You should get professional or specialist advice before doing anything on the basis of our content.We are not liable for any loss or damage that may come from using the content published on the ONS website. This includes: any direct, indirect or consequential losses any loss or damage caused by civil wrongs (“tort”, including negligence), breach of contract or otherwise the use of the ONS website and any websites that are linked to or from it the inability to use the ONS website and any websites that are linked to or from it This applies if the loss or damage was foreseeable, arose in the normal course of things or you advised us that it might happen.This includes (but is not limited to) the loss of your: income or revenue salary, benefits or other payments business profits or contracts opportunity anticipated savings data goodwill or reputation tangible property intangible property, including loss, corruption or damage to data or any computer system wasted management or office time We may still be liable for: death or personal injury arising from our negligence fraudulent misrepresentation any other liability that cannot be excluded or limited under applicable law Cookies and privacyWe collect data about how you use our website to help us to improve it and make sure we are meeting the needs of our users. Detailed information on how we do this, what is collected and how we protect it is provided in our Privacy and Cookies guidance. By using this website, you agree to us collecting this information and confirm that any data you provide are accurate.Security, viruses and hackingThis website uses security measures to protect the material we control from loss, misuse and alteration. However, we do not accept responsibility for any alteration or manipulation of our data once these have been released on the website.You must make sure that the way you use this website does not expose you to the risk of viruses, malicious computer code or other forms of interference that can damage your computer system. We are not responsible for any loss, disruption or damage to your data or computer system that might happen when you use this website.When using this website, you must not introduce viruses, trojans, worms, logic bombs or any other material that is malicious or technologically harmful. You must not try to gain unauthorised access to this website, the server on which it is stored or any server, computer or database connected to it.You must not attack this website in any way. This includes denial-of-service attacks. We will report any attacks or attempts to gain unauthorised access to this website to the relevant law enforcement authorities and share information about you with them.Governing lawThese terms and conditions are governed by and construed in accordance with the laws of England and Wales. Any dispute you have that relates to these terms and conditions, or your use of this website (whether it be contractual or non-contractual), will be subject to the exclusive jurisdiction of the courts of England and Wales.GeneralWe are not liable if we fail to comply with these terms and conditions because of circumstances beyond our reasonable control.We might decide not to exercise or enforce any right available to us under these terms and conditions. We can always decide to exercise or enforce that right at a later date. Doing this once will not mean we automatically waive the right on any other occasion.If any of these terms and conditions are held to be invalid, unenforceable or illegal for any reason, the remaining terms and conditions will still apply.Changes to terms and conditionsPlease check these terms and conditions regularly as they may change at any time without notice. The “last updated” date at the beginning of this page will change if this happens."
