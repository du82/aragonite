full_description = "Programmes and projects We run major programmes designed to deliver new statistics, improve our IT infrastructure, improve access to our data and develop our staff. These form part of our priorities for the next 5 years. Census and Data Collection Transformation Programme (CDCTP) This is a priority programme within the ONS Portfolio. Ambitious, Radical, Inclusive Economic Statistics (ARIES) This is a priority programme within the ONS Portfolio. Integrated Data Service (IDS) This is a priority programme within the ONS Portfolio. The future of population and migration statistics in England and Wales (FPMS) This is a priority programme within the ONS portfolio. Corporate Systems Improvement Programme (CSIP) The CSIP aims to modernise and future-proof our approach to corporate services and processes. Coronavirus (COVID-19) Infection Survey Information on what the Coronavirus (COVID-19) Infection Survey (CIS) is and why it was created. Pandemic Preparedness Toolkit project Learning from COVID-19 and preparing for the next pandemic. Data Science Campus Building world-leading expertise in the innovative application of data science Administrative Data Research UK (ADR UK) collaboration Our partnership with ADR UK to provide researchers with administrative data. Sustainable Development Goals Measuring and reporting UK progress towards the Sustainable Development Goal indicators Economic statistics transformation The Economic Statistics Transformation Programme is central to our strategy for improving economic statistics. International, Regional and City Statistics Information on projects relating to subnational statistics in the UK and overseas. Includes the European City Statistics project, NUTS framework and OECD territorial indicators International Development Team Leading the provision of high quality technical assistance by ONS to build the capacity of statistical systems in developing countries. The ONS and media partnerships How we work with media partners to make statistics more accessible, engaging and easier to understand. ONS Centres The Office for National Statistics (ONS) Centres focus on filling evidence gaps and producing incisive analysis that illuminates the key policy challenges of the age. ONS Local ONS Local analytical advisory service is helping to improve access to subnational data, statistics, and analysis across the UK and devolved administrations to inform evidence-based decisions locally. Analysis Function RAP Strategy 2023 implementation plan How we will work towards implementing the Reproducible Analytical Pipelines (RAP) strategy. Public Services Productivity Review Reviewing and improving the methods for measuring public service productivity, as commissioned by HM Treasury. Standards for official statistics on climate-health interactions Developing a transparent and globally usable framework and technical platform for official statistics on climate change, environment and health. Transformation of labour market statistics The ongoing transformation of our Labour Force Survey and updates and plans for the development of the new Transformed Labour Force Survey. Reference Data Management Framework A process used by the Office for National Statistics to safely link data."
