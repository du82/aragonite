["https://ons.gov.uk/businessindustryandtrade/constructionindustry/methodologies/constructionoutputqualityandmethodologyinformation"]
title = "Construction output QMI - Office for National Statistics"
description = "Quality and Methodology Information for construction output in Great Britain, detailing the strengths and limitations of the data, methods used, and data uses and users."
full_description = "1. Output information National Statistic Survey name Construction Output in Great Britain Frequency Monthly How compiled Survey and Administrative data Geographic coverage Great Britain Sample size 8,000 Last revised 9 August 2019 Back to table of contents 2. About this Quality and Methodology Information report This quality and methodology report contains information on the quality characteristics of the data (including the European Statistical System five dimensions of quality) as well as the methods used to create it.The information in this report will help you to: understand the strengths and limitations of the data learn about existing uses and users of the data understand the methods used to create the data help you to decide suitable uses for the data reduce the risk of misusing data Back to table of contents 3. Important points Data are sourced from the Monthly Business Survey for Construction (also known as the Construction Output Survey) and Value Added Tax (VAT) returns, which collect value of work broken down by type of work from businesses in the construction industry within Great Britain; the survey’s results are used to produce estimates for Construction output in Great Britain. Data are published in current prices and chained volume measures (removing the effect of changes in price) on both a non-seasonally and seasonally adjusted basis; these series are available on a monthly, quarterly and annual basis. Data since Quarter 1 (Jan to Mar) 2010 have been published by the Office for National Statistics, however, longer time series are published under different methodologies for the period pre-2010; under these different methodologies it is possible to view current price, non-seasonally adjusted data from 1955 and chained volume measure, seasonally adjusted data from 1997. As of 7 March 2019, the statistics are now re-designated as National Statistics. Data at subnational and sub-sectoral are also published; this split is modelled from ONS new orders in construction data. Since December 2017, VAT turnover data have been used to estimate the output of selected small and medium-sized businesses; while less timely than the survey data, VAT turnover data provide an improvement in quality due to the increased number of businesses with actual data in comparison with the survey. Back to table of contents 4. Quality summary The survey measures the value and volume of output in the construction industry each month. The Monthly Business Survey for Construction was introduced from January 2010, replacing the earlier Quarterly Inquiry of Activity for Construction and Allied Trades, and the Building and Civil Engineering Employment and Output Inquiry.The survey collects output by sector from businesses in the construction industry within Great Britain. In 2008, the responsibility of these statistics transferred from the Department of Business, Enterprise and Regulatory Reform (BERR), now the Department for Business, Energy and Industrial Strategy (BEIS), to the Office for National Statistics (ONS).The Inter-Departmental Business Register (IDBR) is used as the sampling frame to select 8,000 businesses each month, which are sent a questionnaire to be completed and returned to the ONS. Returns for businesses that do not respond are imputed and the data are weighted to provide estimates for the full population. Statistical disclosure control methodology is applied to avoid identifying any individual organisations.Value Added Tax (VAT) turnover data sourced from Her Majesty’s Revenue and Customs (HMRC) have also been used to inform construction output estimates from December 2017. While less timely than the survey data, it provides improved estimates of small and medium-sized businesses due to the amount of businesses with VAT data in comparison with the numbers sampled on the survey.Construction output is defined as the amount chargeable to customers for building and civil engineering work done in the relevant period excluding VAT and payments to subcontractors.The survey’s results are used to produce non-seasonally and seasonally adjusted monthly, quarterly and annual estimates of output in the construction industry at current price and at chained volume measures (removing the effect of changes in price). The estimates are widely used by private and public sector institutions, particularly by the Bank of England and Her Majesty’s Treasury, to assist in informed decision-making and policy-making. Construction output is an important economic indicator and is also therefore used in the compilation of the output approach of gross domestic product (GDP). Based on the current gross value added (GVA) weight, construction equates to 6.0% of the economy.Data at subnational and sub-sectoral level are also published in current prices on a non-seasonally adjusted basis. This information is not collected directly from the Construction Output Survey for logistical and burden reasons. Instead, this split is modelled from new orders data via project-level information collected from Barbour ABI. These data map the specific duration of projects, and factor in the project start date and lag time from the order being placed to the project commencing. Please note these statistics are not badged as National Statistics.The Monthly Business Survey questionnaire is split into five sections, as detailed in Table 1. Table 1: Monthly Business Survey – Construction questionnaire Section AThis section asks for information on housing work with a breakdown of new work and repair and maintenance. Within this section we also ask for a split of work for public sector clients (questions 5 and 6) and work for private sector clients (question 7 and 8). Section BThis section asks for information on infrastructure with a breakdown of new work and repair and maintenance. Section CThis section asks for information on non-housing work excluding infrastructure with a breakdown of new work and repair and maintenance. Within this section we also ask for a split of work for public sector clients (questions 15 and 16) and work for private sector clients (question 17 to 19). Section DThis section asks for information on the total value of work. This is the sum of sections A to C. Section EThis section provides users with a comments box and asks for contact details. Source: Office for National Statistics Download this table Table 1: Monthly Business Survey – Construction questionnaire .xls .csv Uses and usersThe data published in the Construction output statistical bulletin are used by a variety of different users. These include: national accounts, where estimates are fed into the GDP monthly estimate and quarterly GDP as part of the first quarterly estimate and quarterly national accounts estimates Eurostat, to comply with statutory requirements as part of the short-term statistics regulation and to allow comparison and analysis of competitive performance across all member states across the EU industry analysts requiring estimates of the construction industry output of Great Britain trade associations making UK and international comparisons other government departments in helping to inform policies – these other government departments include: Department for Business, Energy and Industrial Strategy (BEIS), Bank of England (BoE), HM Treasury (HMT) and the Ministry of Housing, Communities and Local Government (MHCLG) Strengths and limitationsStrengths of the construction output dataTimeliness of the survey – the estimates for the latest reference month are published approximately six weeks after the end of the period.Type of work breakdown allows users to analyse trends in specific work types – the types of work published in the release are described in Annex 1 and in Types of construction work (PDF, 77.3KB).Time series availability – a monthly chained volume measure, seasonally adjusted series is available from January 2010 to present and the survey also provides construction output in non-seasonally adjusted current prices from 1955 to present.Coverage of larger businesses – businesses with greater than or equal to 100 employees, or 10 to 99 employees with turnover greater than or equal to £60 million per year, are sampled period-on-period; this allows a high coverage in terms of turnover within the industry.Response rates to the survey – at the time of the latest monthly construction output publication, the approximate response rate for the latest month is nearly 80% based on turnover coverage; these response rates are published within Table 11 of the output in the construction industry dataset in the statistical bulletin each month.Based on the Eurostat guidance, the methodology used to measure the industry is an “A method”; this is the best possible method available and compared with other member states across the EU; we are the only member state to adhere to the A method methodology.Our survey is the largest and broadest-ranging survey of the construction sector both across government and within the private sector.Limitations of the construction output dataQuestion definition for the value of work supplied by businesses. The questions surveyed on the questionnaire ask for a business to return the value of work for a specific period. Whilst the question is clear in terms of what to include and exclude as part of this definition, along with contact details for businesses to contact the office to query their returns, it is sometimes the case that there can be inconsistency as to what is provided. For example, within the questions asked, payments to subcontractors are specifically asked to be excluded to avoid double-counting. This is because if we also sample the subcontractor we may have this work captured twice, that is, by the contractor and subcontractor.Clarity between the types of work breakdown. Some businesses are involved in multiple types of work in the construction industry and sometimes across both the public and private sector. Therefore, the ability to break down this work undertaken to the definitions we survey on the questionnaire is sometimes difficult to provide. This information is also sometimes not always collected by the business and in a manner that is easily to hand.Coverage of businesses under the Value Added Tax (VAT) and Pay As You Earn (PAYE) threshold. The sampling frame used in the production of the Construction output estimates is the Inter-Departmental Business Register (IDBR). The IDBR is a comprehensive list of UK businesses used by government for statistical purposes covering 2.6 million businesses in all sectors of the UK economy. It does not cover very small businesses (those without employees and/or with turnover below the tax threshold) and some non-profit making organisations. Therefore, in the survey, the published estimates would not include estimates of unrecorded output. This is work carried out by sole proprietors who do not pay PAYE and are below the VAT threshold and therefore will not feature in the sample.Exclusion of UK Standard Industrial Classification 2007: SIC 2007 41.1 “development of building projects”. In terms of the UK SIC 2007 section F construction, the survey has full coverage apart from UK SIC 2007 41.1 “development of building projects”. This is consistent with other national statistical institutes and originates in the type of activity this SIC undertakes. Property developers tend to subcontract work to other businesses in the construction sector that carry out the actual building activity. Businesses are asked to exclude any subcontracted work to avoid any double-counting. Output does not include payments made to architects or consultants from other firms – this would cover engineers and surveyors. Output would, however, include wages paid to such people if they were directly employed by the business.Recent improvementsIn recent years there have been numerous improvements to construction output in Great Britain estimates. These are detailed in this section.Following the announcement by the UK Statistics Authority on 7 March 2019, Great Britain construction output statistics have been re-designated as National Statistics in accordance with the Statistics and Registration Service Act 2007 and signifying compliance with the Code of Practice for Statistics. This assessment also covered Construction Output Price Indices and Construction new orders. This means the independent regulator has judged that these statistics provide the highest levels of “trustworthiness, quality and value”.As part of the ongoing Office for National Statistics (ONS) Construction Statistics Development Programme to regain the National Statistics status, we have worked closely with the Construction Statistics Steering Group (CSSG) and the Consultative Committee on Construction Industry Statistics (CCCIS). These groups provide a forum for the ONS to engage with main users of construction statistics on the development of ONS-published construction statistics, including other government departments, industry experts and academics, to identify areas for improvement.We have recently published a series of methodological articles to help communicate these recent improvements.Construction development: Impact of improvements to construction statistics, published on 29 September 2017. This article details improvements to the output price indices, including the incorporation of a mark-up for profit margin, a revised methodology for the labour series, new weights and data sources, and a full review of the methodology used. For further information, please see the Construction Output Price Indices Quality and Methodology Information report.Improvements to construction statistics: addressing the bias in early estimates of construction output, published on 4 June 2018. This article addresses the upward bias in early construction output survey data, which was achieved by improving imputation methodology to impute data for businesses that have not yet returned their survey responses, along with a further adjustment to address additional bias in early estimates. For further information on the impact of these methodological changes, please see Impact of the improvements to construction statistics, published on 29 June 2018.Construction development: improvements to regional and sub-sector level estimates, published on 4 June 2018. This article highlights improvements made to the model used to estimate subnational and sub-sectoral level output estimates, by improving the assumptions used using project-level data sourced from Barbour ABI. This results in subnational and sub-sectoral level data that are more reflective of what is happening within the economy.Construction statistics development: improving the understanding of new orders in the construction industry and the gap between output and new orders, published on 30 October 2018, provides analysis to improve the understanding of the uses of and coherence between ONS construction output and new o"
