["https://ons.gov.uk/businessindustryandtrade/internationaltrade/methodologies/internationaltradeinservicesqmi"]
title = "International trade in services QMI - Office for National Statistics"
description = "Quality and methodology information for the International Trade in Services Survey data: strengths and limitations of the data, methods, data uses and users."
full_description = '''1. Output information National Statistic: yes Survey name: International Trade in Services Data collection: survey data Frequency: annual How compiled: survey Geographic coverage: UK Related publications: Annual International Trade in Services Back to table of contents 2. About this Quality and Methodology Information report This quality and methodology report contains information on the quality characteristics of the data (including the European Statistical System five dimensions of quality) as well as the methods used to create it. The information in this report will help you to: understand the strengths and limitations of the data learn about existing uses and users of the data understand the methods used to create the data help you to decide suitable uses for the data reduce the risk of misusing data Back to table of contents 3. Important points International Trade in Services (ITIS) data measure the value of transactions of UK businesses by country of origin and destination. ITIS data are based solely on survey data. ITIS data are based on a quarterly sample of approximately 2,200 businesses and an annual sample of approximately 27,200 businesses. The annual results are supplemented by information collected via the Annual Business Survey (ABS). Data are collected by both industry and product on a geographical basis. The ITIS surveys are the main source of data for UK trade in services. ITIS data are an important element of the UK's balance of payments (BoP) and contribute towards the measure of gross domestic product (GDP). The surveys do not provide full coverage of the UK economy; excluded sectors are: travel and transport, banking and other financial institutions, higher education, and most activities in the legal professions. ITIS data are not seasonally adjusted. Back to table of contents 4. Quality summary OverviewInternational Trade in Services (ITIS) shows the import and export activity of UK companies overseas and is the main source of information for UK trade.The ITIS survey collects company-level microdata on exports and imports of services products. The Office for National Statistics' (ONS) ITIS data are compliant with the latest international standards, as outlined in The Manual on Statistics of International Trade in Services 2010 (MSITS 2010) (PDF, 3.45MB).Breakdowns are available by product, industry and geographical region. Products are classified using Extended Balance of Payments Services classification (EBOPS 2010). There are 52 products and 17 product groups.The International Trade in Services (ITIS) survey is the main source of UK trade in services data, covering most industries but with a few exceptions: travel transport banking and other financial institutions higher education charities most activities within the legal profession Data for the excluded industries are obtained from other sources and are not included in this dataset. Statistics presented are not seasonally adjusted.The quarterly sample is made up of approximately 2,200 businesses and the annual sample is made up of approximately 27,200 businesses. The survey data from both the quarterly and annual results are combined to produce the annual ITIS estimates and are used as a main data source to compile total trade in services estimates.In 2009, the ITIS survey incorporated the Film and Television survey, which was discontinued as a standalone survey in 2008. The ITIS survey is also supplemented by information collected via the Annual Business Survey (ABS) in relation to amounts paid or received for the imports or exports of services. Care is taken during the sampling and estimation process to avoid duplication between surveys.ITIS data are collected by both industry and product on a geographical basis, by collecting data for the countries to which services are exported, and from where they are imported. These data are primarily used in the compilation of the services account for the UK's balance of payments (BoP), which in turn contributes towards the measure of UK gross domestic product (GDP). The ITIS estimates are published annually.Uses and usersThe results of the annual and quarterly ITIS survey represent a main element of the BoP account and of GDP. The results are published in detail in the ITIS annual publication. The results from the ITIS survey make up approximately 66% of total exports and 60% of total imports of the trade in services account for 2021.As a condition of membership to the International Monetary Fund (IMF), the UK is obliged to provide detailed trade in services information. The Organisation for Economic Cooperation and Development (OECD) also requires a detailed geographical breakdown of trade in services products to allow for international analysis and comparison. The geographical data also allow the analysis of bilateral asymmetries between member states to take place. As such, businesses taking part in the ITIS survey are required to respond under the Statistics of Trade Act 1947.The data are also used by the ONS Supply and Use Production Branch within national accounts. Tables are provided containing industrial and non-industrial service breakdowns. They use the weighted flows of the industry and product matrix data from ITIS for the analyses of industrial and non-industrial services supplied by the ABS.Finally, since 2019, the Subnational Trade team has been using the ITIS dataset to compile the subnational trade in services dataset, which provides experimental estimated value of exports, imports and balance of services for International Territorial Level: ITL1, ITL2, ITL3, and city regions, including industry and partner country.Government and business users also use the data for economic assessment. Department for Business and Trade (DBT) states that the ITIS survey is the only source of product detail for UK services and is essential for UK regional exports analyses. DIT also use the ITIS survey data to monitor the competitiveness of UK businesses and to gain a better understanding of the level of service exports.In addition, the Scottish Government (SG) also show significant interest in the survey results to supplement Scotland's Global Connections Survey (GCS). The Department for Culture, Media and Sport (DCMS) use the ITIS data in one of their main outputs, the Creative Industries statistical bulletin.Strengths and limitationsStrengths Product-level detail is published at both world total and sector level. The ITIS survey is the only source of product detail for UK services and is essential for UK regional exports analyses.Limitations ITIS data are not representative of the whole economy; travel, transport and banking sectors are excluded. Only select countries are published, not a full geographic breakdown. Some published tables contain high volumes of suppressed data as a result of disclosure being applied. Sector-only estimates are published, not industry-level estimates. It is a sample survey, not a census. Recent improvementsIn the 2019 annual sample, regional boosts for Wales and Scotland were introduced to the sample to increase the representation of those regions. These boosts have also been funded up to the 2022 sample, but it is not certain if these will be included in future years.An additional sample boost was funded by the Office for National Statistics (ONS) subnational trade team for the 2021 sample to increase the representation of subnational trade. This boost has also been funded up to the 2022 sample, but it is not certain if it will be included in future years.For 2020 collection onwards, the ITIS sample was expanded to include microbusinesses (those with an employment count below 10). This covers Great Britain and Northern Ireland. Data from microbusinesses are not yet included in official trade in services statistics, but the impact of this change on balanced gross domestic product (GDP) estimates is expected to be published in autumn 2025.For 2021 collection onwards, the ITIS sample has been expanded to include new industries (notably in the financial sector and higher education). For 2022 collection onwards, the ITIS sample has also expanded to cover transport and travel industries. The data covering these industries are not yet included in official trade in services statistics but are expected to be included in autumn 2025 for education and finance, and transport and travel. Back to table of contents 5. Quality characteristics of the international trade in services data This section provides a range of information that describes the quality and characteristics of the data and identifies issues that should be noted when using the output.RelevanceThe International Trade in Services (ITIS) data are a major source of data for UK trade, which is a main economic indicator because of the importance of international trade to the UK economy.The conceptual framework of the ITIS data corresponds to that of the International Monetary Fund (IMF) Balance of Payments Manual sixth edition (BPM6). It is also compliant with the latest international standards, as outlined in The Manual on Statistics of International Trade in Services 2010 (MSITS 2010) (PDF, 3.45MB). Both provide objective and coherent international standards to make data for the UK and other countries comparable, reflecting the needs of international and domestic users.The UK economic territory excludes the Channel Islands and the Isle of Man, which have their own fiscal and monetary authorities. BPM6 was compiled in close co-operation with Eurostat, the Organisation for Economic Cooperation and Development (OECD), the United Nations and the World Bank.The ITIS data, as a component of UK trade data, form part of the broader system of UK National Accounts. The international standard for national accounts is the System of National Accounts 2008 (SNA08) jointly published by the same organisations. The EU published its own version of SNA08, European System of National Accounts 2010 (ESA 2010), upon which the UK's National Accounts are based. BPM6, SNA08 and ESA 2010 are consistent.The main users of the ITIS dataset are: the Department for International Trade (DIT) (now the Department for Business and Trade), the Scottish Government (SG), the Welsh Government (WG), the Northern Ireland Statistics and Research Agency (NISRA) and the Department for Culture, Media and Sport (DCMS).Accuracy and reliabilityThere is no simple way of measuring the accuracy of ITIS statistics, that is, the extent to which they measure the underlying "true" value for a particular period. Non-sampling errors are not easy to quantify and include errors of coverage, measurement, processing and non-response. Various procedures and checks are made to ensure these errors are minimised.As ITIS is based on survey responses, the Office for National Statistics' (ONS) systems validate these entries and prompt confirmation of suspect data are sought. Standard errors are an estimate of the sampling error and provide a measure of the precision of the estimate. A low standard error indicates a precise estimate. To aid comparison, the standard error is also expressed as a percentage of the total value, allowing the standard error to be put in context. Table 1: Standard errors, 2021 revised ExportsImports IndustriesEstimate (£ million)StandardError (£ million)RelativeStandardError (%)Estimate (£ million)StandardError (£ million)RelativeStandard Error (%) Total ITIS203,973 4,368 2117,713 2,351 2 Section A-B, D-EOther Non Services1,178 81 72,348 132 6 Section CManufacturing15,632 543 313,461 331 2 Section FConstruction1,141 91 82,153 415 19 Section GWholesale/Retail Trade16,837 845 516,820 856 5 Section HTransportation and Storage2,066 - 0733 - 0 Section IAccommodationand Food Services202 3 1636 17 3 Section JInformationand Communication55,716 2,550 533,115 1,506 5 Section KFinancial andInsurance Activities41,919 1,999 513,120 1,150 9 Section LReal Estate Activities717 95 13282 21 7 Section MProfessional, Scientificand Technical Activities52,467 2,219 428,809 759 3 Section NAdministrative andSupport Service Activities9,835 915 94,450 565 13 Section O-QPublic Administration,Educationand Health2 1 3137 15 40 Section R&SArts, Entertainmentand Recreation andOther Service Activities6,260 1,337 211,750 82 5 Source: Office for National Statistics Download this table Table 1: Standard errors, 2021 revised .xls .csv Coherence and comparabilityCoherence is the degree to which data that are derived from different sources or methods, but refer to the same topic, are similar. Comparability is the degree to which data can be compared over time and domain, for example, geographic level.Every effort is made to ensure that the series are comparable over time. International standards (BPM6) are used in the production of ITIS data; therefore, figures published by the UK should be comparable with other countries. UK representation in international working groups help ensure that the UK is synchronised with any changes along with other countries.Accessibility and clarityAccessibility is the ease with which users are able to access the data, also reflecting the format in which the data are available and the availability of supporting information. Clarity refers to the quality and sufficiency of the release details, illustrations and accompanying advice.The annual survey data are published in the publication International Trade In Services, which is available from the ONS.Our recommended format for accessible content is a combination of HTML webpages for narrative, charts and graphs, with data being provided in usable formats such as CSV and Excel. Our website also offers users the option to download the narrative in PDF format. In some instances, other software may be used, or may be available on request.Available formats for content published on our website but not produced by us, or referenced on our website but stored elsewhere, may vary. For further information please refer to the contact details at the beginning of this report. From the 2022 publication (covering 2021 data) onwards, the ITIS dataset will be published in accessible format allowing computed-assisted reading technologies.For information regarding conditions of access to data, please refer to: terms and conditions (for data on the website) copyright and reuse of published data accessibility Access to microdata can be requested via the Secure Research Service (SRS).Further queries can be addressed to the ITIS public enquiry team by email to: itis@ons.gov.uk.Timeliness and punctualityTimeliness refers to the lapse of time between publication and the period to which the data refer. Punctuality refers to the gap between planned and actual publication dates.The Annual ITIS dataset is published on our website 13 months after the end of the reference year.For more details on related releases, our release calendar provides 12 months' advance notice of release dates. Publication dates for ITIS are fixed, but, in the unlikely'''
year_published = 2025
