full_description = "Dataset Balance of payments time series Notice 23 December 2024 Because we have temporarily paused full processing of Foreign Direct Investment (FDI) survey data, recent FDI-related estimates are subject to more uncertainty than usual, and users should be cautious when interpreting recent FDI data in the balance of payments (BoP) statistics. The estimates for all quarters since (and including) Quarter 3 (July to Sept) 2023, are based on quarterly survey data but with simpler processing than normal. Estimates for quarters in 2021 and 2022 are based on full processing of survey data but have not yet been updated to reflect the latest data from the 2021 and 2022 annual FDI surveys. Estimates will be updated after full processing resumes and will be reflected in the accounts in 2025, in line with the latest National Accounts Revisions Policy. Contact: UK Balance of Payments team Release date: 23 December 2024 Next release: 28 March 2025 Dataset ID: PNBP About this Dataset Quarterly summary of balance of payments accounts including the current account, capital transfers, transactions and levels of UK external assets and liabilities. Edition in this dataset csv (597.0 KB) xlsx (489.8 KB) structured text (691.4 KB) Previous versions of this data are available. View all data related to Balance of payments Contact details for this dataset UK Balance of Payments team bop@ons.gov.uk +44 1633 456106 Publications that use this data Balance of payments, UK"
