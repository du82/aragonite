full_description = '''Total Trade (TT): WW: Balance: BOP: CP: SA Source dataset: UK trade time series (MRET) View other variations of this time series Correction 20 October 2017 An error has been found in the August 2017 Trade in goods MRETS (all BOP EU 2013) timeseries dataset. This affects the series BQHS, BQHQ, CLAS and CLAK for all time periods. This does not affect any other series or aggregates in the MRETS dataset or the UK trade statistical bulletin. The series have now been corrected, we apologise for any inconvenience. Please contact trade@ons.gov.uk for more information. View superseded version 11 May 2018 A small error in the trade in goods excluding oil and erratics import price indices occurred in the UK Trade: March 2018 publication tables and related time series dataset due to a processing error. The error impacted the trade in goods excluding oil and erratics import price index (series ELBA) for the period January 2018 to March 2018 in Table 3, the trade in goods excluding oil and erratics import price index growth rate in Table 4 and the trade in goods excluding oil and erratics import price indices for EU and non-EU (series SHCM and SHEB) in Table 6. This had no impact on any other series or commentary in the UK trade: March 2018 publication. The price series have now been corrected and ONS apologises for any inconvenience this may have caused.You can see all previous versions of this data on the previous versions page. View superseded version 11 July 2018 An error has been found in the trade in goods excluding oil, trade in goods excluding erratics and trade in goods excluding oil and erratics chained volume measures (CVMs) for the period January 2017 to March 2018 and related implied deflators (IDEFs) for the period January 1998 to March 2018 published on 10 July 2018. This was due to a processing error and does not affect any other series or aggregates in the MRETS dataset or the UK trade statistical bulletin. The time series affected are: BOXT, BPIT, BQAN, ELBD, BOXV, PBIV, BOVT, BPGT, BOVU, BPGU, BOVV, BPGV. The series have now been corrected.We apologise for any inconvenience caused. View superseded version 11 September 2018 A minor error has been identified with an EU crude oil deflator and the associated chained volume measure series in January 2018. The error was due to a system processing issue and does not affect any other outputs within this release or any other releases. The two series affected have now been corrected.SEAN - EU(2004):BOP:IM:deflator:SA:Crude oil: SITC 333 SEAW - EU(2004):BOP:IM:CVM:SA:Crude oil: SITC 333 View superseded version 15 November 2018 A small error has occurred in some time series within the UK Trade publication Table 18 'UK Trade in Oil' due to a processing issue. The table and series affected were: Table 18 UK Trade in Oil CDIDs: BOQM, BPBN, BQBH and BQAX. The errors related to the period January 2017 to June 2018. Table 18 UK Trade in Oil CDIDs: BQNI, BOQN, BQNJ, BQBH, BQAX, BQAY. The errors related to the 3-month and 12-month ended series.We have now corrected this error and apologise for any inconvenience View superseded version 15 November 2018 A small error has occurred in some time series within the UK Trade publication Table 18 'UK Trade in Oil' due to a processing issue. The table and series affected were: Table 18 UK Trade in Oil CDIDs: BOQM, BPBN, BQBH and BQAX. The errors related to the period January 2017 to June 2018. Table 18 UK Trade in Oil CDIDs: BQNI, BOQN, BQNJ, BQBH, BQAX, BQAY. The errors related to the 3-month and 12-month ended series.We have now corrected this error and apologise for any inconvenience View superseded version 12 February 2021 There has been a minor error identified with the rounding process for a number of monthly total trade series in 2020. This has resulted in rounding discrepancies of about £1m when the annual figure are compared with the 12 month aggregate, and similarly when the quarterly figure are compared with the 3 month aggregate. The series affected are:IKBH, IKBI, IKBK, IKBL, IKBM, CPLX, CPLY, CTVP, CTVQ, FSA2, FSA3, FSIJ, FSIG.This does not impact any of the key points and messages in this release or any other data series.This has now been corrected. We apologise for any inconvenience this may have caused. View superseded version 13 April 2022 We have corrected an error in Trade in goods: Trade Publication Tables. This affected Table 11, Table 16 and Table 24 only. Within these tables, we have corrected the Monthly Exports figures for Trade in Services and Total Trade, for the months from October 2021 to February 2022. View superseded version 24 June 2022 We have corrected an error in UK trade time series. The June 2017 value for BOQM and BPBN, has now been corrected. There has been no change to series other than BOQM and BPBN. We apologise for any inconvenience caused. View superseded version 14 June 2023 We have identified an error in MRET: UK trade time series where data published for January, February and March 2023 were incorrect. This error occurred because of human error and has now been corrected.This error only affects MRET: UK trade time series. View superseded version Contact: UK Trade team Release date: 13 February 2025 View previous versions Next release: 14 March 2025 Series ID: IKBJ What's this? Units: £ m Filters Use these filters to interact with the following chart of data. Show data as Chart Table Frequency Month Quarter Year Time period All Last 10 years Last 5 years Custom Custom time period From Month Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec Quarter Q1 Q2 Q3 Q4 Year To Month Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec Quarter Q1 Q2 Q3 Q4 Year Chart Period Value <![endif]--> <div class="tiles__content"> <img class="js--hide image-responsive" src="/economy/nationalaccounts/balanceofpayments/timeseries/ikbj/mret/linechartimage" alt="Total Trade (TT): WW: Balance: BOP: CP: SA"> </div> <!--[if gt IE 8]><!--> Download this time seriesTotal Trade (TT)