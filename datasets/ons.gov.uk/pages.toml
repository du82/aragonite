["https://ons.gov.uk/aboutus/contactus/officelocations"]
title = "Office locations - Office for National Statistics"
description = "Details of our offices in Newport, Titchfield, London, Darlington, Manchester and Edinburgh"
full_description = "NewportGovernment Buildings Cardiff Road Newport South Wales NP10 8XGOur headquarters are to the south west of Newport, south Wales, just off Junction 28 of the M4. Railway station: Newport, two and a half miles. Buses: 30 from Newport Friars Walk bus station and X15 from Newport Market Square bus station stop next to the site entrance in Cardiff Road. 31A, 31C, 35 and 36 from Newport Friars Walk bus station stop in Duffryn close by.TitchfieldSegensworth Road Titchfield Fareham Hampshire PO15 5RRThe Titchfield office is located midway between Portsmouth and Southampton, near Junction 9 of the M27. Railway station: Fareham, three miles. Buses: 28 and 28A pass the site, X5 close by. London2 Marsham Street London SW1P 4DFOur London office is in the Home Office building in Marsham Street, central London, close to Westminster and Victoria. Railway station: London Victoria, half a mile. Underground: Victoria (Circle, District and Victoria lines), half a mile; Westminster (Circle, District and Jubilee lines), half a mile. Buses: 88 to Marsham Street, 11, 24, 26, 148 to Victoria Street, 3, C10 to Horseferry RoadDarlingtonDarlington Economic Campus Feethams House Feethams Darlington DL1 5ADManchesterThe Tootal Buildings 56 Oxford Street Manchester M1 6EUOur Manchester offices are on the first floor of Broadhurst House and second floor of Lee House inside the Tootal Buildings in Oxford Street. Railway station: Oxford Road, 300 yards; Manchester Piccadilly, half a mile Tram: St Peter’s SquareEdinburghUK Statistics Authority Queen Elizabeth House 1 Sibbald Walk Edinburgh EH8 8FTPlease note driving in central Edinburgh is not recommended. There is no car park facility but limited ‘pay and display’ on-street parking is available. Railway stations: The office is a ten minute walk from Edinburgh Waverly railway station and 20 minute walk from Edinburgh Haymarket. Buses: Lothian buses 3, 5, 7, 14, 29, 30, 31, 37, 33, 35, 45, 49, and 51 stop on South Bridge, which is a 5 minute walk from the office."
