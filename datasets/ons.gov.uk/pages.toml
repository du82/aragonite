full_description = "Business innovation Research and development in the UK carried out or funded by business enterprises, higher education, government (including research councils) and private non-profit organisations. On this page: Dataset Publications View all content related to this topic: All data All publications Spotlight Business enterprise research and development, UK: 2023 What's in the bulletin? Expenditure on research and development (R&D) performed by UK businesses was £50.0 billion in 2023, an increase of £1.4 billion since 2022 (2.9%). The Pharmaceuticals product group made the largest contribution (£8.7 billion) to the total of business R&D performed in 2023 (17.4% of total R&D performed by UK businesses). London had the largest regional value of business R&D performed in 2023, at £11.0 billion (22.0%); this was followed by the East of England at £9.7 billion (19.5%) and the South East at £8.5 billion (16.9%). Read this statistical bulletin More publications Back to top Datasets related to Business innovation Foreign direct investment involving UK companies (directional): inward Annual statistics on the investment of foreign companies into the UK, including for investment flows, positions and earnings. Foreign direct investment involving UK companies (directional): outward Annual statistics on the investment of UK companies abroad, including for investment flows, positions and earnings. Gross domestic expenditure on research and development time series Annual estimates of national research and development (R&D) spending in the UK from the public and private sectors: business enterprise, government, higher education and private non-profit organisations. Business investment time series Detailed breakdown of business investment by industry and asset, in current prices, chained volume measures, non-seasonally adjusted and seasonally adjusted. Business enterprise research and development, UK (designated as accredited official statistics) UK estimates of an