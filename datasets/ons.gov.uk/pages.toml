["https://ons.gov.uk/peoplepopulationandcommunity/armedforcescommunity"]
title = "Armed forces community - Office for National Statistics"
description = "Information about UK armed forces veterans from Census 2021."
full_description = "Armed forces community Information about the armed forces community, including those who have previously served in the armed forces (veterans) and their families, to help support the Armed Forces Covenant. On this page: Dataset Publications View all content related to this topic: All data All publications Spotlight UK armed forces veterans, England and Wales: Census 2021 What's in the bulletin? In 2021, 1,853,112 people in England and Wales reported that they had previously served in the UK armed forces (3.8% of usual residents aged 16 years and over). Of the UK armed forces veterans in England and Wales, 76.3% (1.4 million people) previously served in the regular forces, 19.5% (361,000 people) in the reserve forces, and 4.3% (79,000 people) served in both the regular and reserve forces. 37,000 UK armed forces veterans (2.0%) lived in communal establishments and the remainder (slightly over 1.8 million, 98.0%) lived in households. Read this statistical bulletin More publications Suicides in UK armed forces veterans, England and Wales: 2021 What's in the bulletin? In 2021 in England and Wales, out of 5,175 suicides in those aged 16 years and over, 253 suicides occurred in UK armed forces veterans. Of the 253 UK armed forces veteran suicides occurring in 2021, 93.7% (237) were male and 6.3% (16) were female. Overall, after accounting for age, there was no evidence of a difference in the rate of suicide between male UK armed forces veterans and the male general population. Read this statistical bulletin More publications Back to top Datasets related to Armed forces community GP and dentist registrations, weighted estimates, Veterans' Survey 2022, UK UK armed forces veterans and GP and dentist registrations, type of registrations and reason for not being registered by personal and service-related characteristics. Health, weighted estimates, Veterans' Survey 2022, UK UK armed forces veterans, disability and whether a veteran required a personalised care plan, by personal and service-related characteristics. Well-being, weighted estimates, Veterans' Survey 2022, UK How often UK armed forces veterans felt lonely, and the average combined score on the loneliness scale by personal and service-related characteristics. Veterans’ awareness and use of, and satisfaction with, health and well-being services, weighted estimates, Veterans’ Survey 2022, UK Estimates by personal and service-related characteristics from Op COURAGE, Veterans First Point, Veterans NHS Wales and Op RESTORE (Veterans Trauma Network). Suicides in UK armed forces veterans, England and Wales UK armed forces veteran suicide statistics in England and Wales. Including method of suicide, cause of death and suicide rate in male veterans. Annual data. These are official statistics in development. View all datasets related to Armed forces community Back to top Publications related to Armed forces community Statistical bulletins UK armed forces veterans, England and Wales: Census 2021 UK armed forces veterans population who have either previously served in the regular forces, reserve forces or both, Census 2021 data. View all related statistical bulletins Articles Characteristics of UK armed forces veterans, England and Wales UK armed forces veteran population from Census 2021 data, includes population age, where people were born, religion, ethnic group, legal partnership status and general health. UK armed forces veterans data, England and Wales Datasets on the topic of UK armed forces veterans and supporting information. View all related articles Back to top Methodology related to Armed forces community UK armed forces veterans quality information for Census 2021 View all related methodology Explore local statistics Find, compare and visualise statistics about places within the United Kingdom."
year_published = 2025
clearnet = "https://ons.gov.uk/peoplepopulationandcommunity/armedforcescommunity"
