["https://onshape.com/en/features/onshape-vision"]
title = "Onshape Vision | Immersive CAD and Spatial Computing"
description = "Find out how the Onshape Vision app for the iPad extends the power of cloud-native CAD and PDM to Apple Vision Pro, a new wearable spatial computer."
full_description = "At last, product designers can extend the power of their CAD and PDM system to the immersive world of spatial computing. Apple Vision Pro is a wearable device that seamlessly blends lifelike digital content with users’ real physical environments. Users can intuitively explore 3D CAD models with their hands, eyes, and voice – there are no external buttons or controls. The Onshape Vision app transforms flat computer models into virtual life-size products that designers can hold, pull apart and inspect as if they were already built. The app works in sync with Onshape’s cloud-native CAD and PDM system, enabling any changes in the product model to be updated in real time within the infinite canvas of Apple Vision Pro. Onshape Vision enhances the way distributed product development teams collaborate and conduct design reviews. When brainstorming and sharing feedback with colleagues, participants from multiple locations can explore realistic 3D models of their products as if they were working together in the same room. Interacting with technology has never felt more natural! Visualize your product in the context of how and where it will be used. For example, does your machine fit on the factory floor where you intend to install it? Are the electrical contacts in the correct location? Does it work in concert with other machines nearby? Viewing your product at full scale – or shrinking it down so it fits on your physical workspace – can encourage new perspectives and help identify potential improvements. You can have the virtual model sit in front of you on a table and reference it as you make CAD changes. You can more effectively review and discuss features of your design with the “real thing” sitting on the conference table. Closely inspect digital parts, visually explaining your ideas with more impact. Communicating with Apple Vision Pro feels far more natural than the traditional video conferencing experience. When examining your products with colleagues anywhere in the world, you’ll feel as though you are all working in the same room. You can also type comments directly into the Onshape Vision app, just like you do when creating your original CAD models."
author = "Onshape, a PTC Business"
year_published = 2025
clearnet = "https://onshape.com/en/features/onshape-vision"
