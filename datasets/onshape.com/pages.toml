["https://onshape.com/en/features/bill-of-materials"]
title = "Onshape Bill of Materials (BOM) | Onshape"
description = "Explore Onshape's Bill of Materials feature for dynamic, cloud-native management of parts and materials directly alongside CAD models."
full_description = "BOMs are essential in mechanical design for tracking components, estimating costs, managing the supply chain, and facilitating collaboration. They help with the quality control process, streamline production planning, assist in documentation for compliance, and are pivotal in product lifecycle management, making them indispensable for efficient project execution. Onshape's BOM integration allows the data to be edited within the Assembly model, ensuring real-time updates between the model and BOM tables. Its cloud-native architecture ensures all stakeholders –from purchasing to assembly techs– have accurate design and BOM data on their devices. This guarantees details are up-to-date, avoiding inaccuracies and mistakes. Incorporate essential non-geometric items like adhesives, lubricants, and paint into the BOM directly from a predefined company inventory. Define bulk items with details such as quantity, units, and application parts. Enrich your 3D model by adding diverse elements to reflect design intent and enhance realism. Manage BOM data the way you want, with options for hierarchical or flattened views. Customize tables by adding or removing columns to show any component property, with in-place editing for efficient data entry. Tailor BOM views by highlighting or erasing specific rows and columns to suit viewer preferences. Save custom views with the assembly, enabling unique data column sets for each project, ensuring flexibility and precision in data presentation. Onshape offers a BOM API for clients with complex, multi-discipline needs, allowing the creation of custom apps to utilize BOM table data. This enables the export of data directly to ERP systems via the BOM API, catering to advanced customization and efficiency in managing BOM data. Collaboration is at the heart of what Onshape delivers, and this extends to BOM management. Cloud-native CAD collaboration and built-in PDM accelerate time to market, facilitate teamwork, and encourage product innovation. Real-time updates to parts in your design reflect immediately in both the model and CAD BOM for all authorized users, ensuring seamless coordination and instant access to the latest design changes."
