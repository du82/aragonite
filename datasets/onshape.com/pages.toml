["https://www.onshape.com/en/resource-center/tech-tips/tech-tip-how-to-use-onshapes-bill-of-materials-bom-templates"]
title = "Tech Tip: How to Use Onshape’s Bill of Materials (BOM) Templates"
description = "Learn how to use Onshape’s Bill of Materials (BOM) templates to control company standards and decrease human error when generating documentation and metadata."
full_description = "As we generate engineering design data, we also generate a lot of massively valuable metadata. Defining material, projects, and part numbers is an instrumental part of any successful design. To manage all this information, you are likely using Onshape’s dynamic Bill of Materials (BOM). In this tech tip, we will look at how to better use the BOM and our newest template functionality. To add columns within a BOM, the first thing you need to consider is what metadata you want to include and the order you would like it displayed. These factors are also going to be different interdepartmentally. Let's look at a purchasing use case. Now that the columns are correctly added, let’s create a template so that we can use our purchasing BOM standard throughout our company. Once you create a template, it is usable across your entire organization. Ensuring that everyone has access to the right templates will reduce the likelihood of errors by empowering users to implement the company standard. Once you develop these templates, you can always edit their names or remove them from your company by going to the preferences in Company Settings: With Onshape’s BOM templates, you can help your team work faster and more accurately. Give them a try!"
