full_description = "10/27/2022 How Premier Custom-Built is Customizing Onshape Company From the 2022 Onshape Research Symposium. Premier Custom Built, an industry leader in custom cabinetry, is streamlining their design and manufacturing workflows using Onshape. To fit the needs of their highly customized process, they have created a library of over 100 custom features using FeatureScript to automate the design and developed a REST API integration for exporting manufacturing information in a familiar format. From the 2022 Onshape Research Symposium. Premier Custom Built, an industry leader in custom cabinetry, is streamlining their design and manufacturing workflows using Onshape. To fit the needs of their highly customized process, they have created a library of over 100 custom features using FeatureScript to automate the design and developed a REST API integration for exporting manufacturing information in a familiar format."
