["https://onshape.com/en/resource-center/tech-tips/tech-tip-comparing-design-changes"]
title = "Tech Tip: Comparing Design Changes"
description = "Onshape's Compare command provides both a visual and a list-based comparison between two different iterations of a CAD design. Read more."
full_description = "Designs evolve over time, involving many design iterations. To manage these iterations, Onshape has built version management into its core. Saving a version to capture a milestone in your design is simple. But how can we compare these different versions created over time? With a recent update, Onshape added the Compare command. Compare is a great way to get both a list and a visual reference of all the changes between Versions, Workspaces, or even moments in History in a Part Studio. To use Compare, select the Compare command from the dropdown menu in the Versions Manager or History menu. The Compare command gives both a visual, as well as a list-based comparison. This allows you to not only see the changes in the graphics, but also see the specific differences in features between the two versions you are comparing. Explore more Tech Tips to get the most out of Onshape's intuitive CAD platform. More Tech Tips"
