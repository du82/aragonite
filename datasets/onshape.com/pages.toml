["https://onshape.com/en/resource-center/case-studies/premier-custom-built"]
title = "Premier Custom-Built Embraces Digital Transformation While Preserving Old-School Craftsmanship | Onshape"
description = "Learn how luxury cabinetry manufacturer Premier Custom-Built creates industry-specific custom CAD features to modernize its design process in Onshape."
full_description = '''Luxury furniture manufacturer uses Onshape’s custom CAD features to automate repetitive design tasks Pennsylvania furniture manufacturer Premier Custom-Built makes custom cabinetry for luxury homes and yachts, designing every job from scratch. The engineering team was looking to create a paperless manufacturing floor, aiming to migrate the product specs currently in 3-ring binders to 3D CAD models. Premier was also seeking a way to automate repetitive design tasks to speed up time to market. "One of the things we frequently talk about at Premier is this idea of having a single source of truth. And that's the logic behind using a cloud‑native platform. What we are aiming to do is make our product models the single source of truth." Their makeshift museum is small but symbolic, including a sample of nearly every generation of computer used to run the business since its founding in 1991. The most talked-about artifact is the boxy Apple Macintosh Classic, which was the first computer used by company founder Marlin Horst, father of current CEO Sheldon Horst. “The display serves as a reminder that technology is always changing and we should not assume we’ve reached the finish line,” says software engineer Chad Stoltzfus. “It encourages us to keep trying to jump over the current hurdles and push on.” Premier Custom-Built is based in Lancaster County, Pennsylvania – also known as Pennsylvania Dutch Country or Amish Country – which has a centuries-old tradition of woodworking originally fostered by the region’s Swiss-German immigrants. “Craftsmanship is the center of what we do,” notes Premier CEO Sheldon Horst. “And I believe that as the generations continue, that preserving the craft will require the right technology to operate effectively.” At the center of the luxury cabinetry company’s digital transformation strategy is cloud-native Onshape, PTC’s product development platform that unites advanced CAD tools with built-in data management, real-time collaboration and business analytics.'''
author = "Onshape, a PTC Business"
