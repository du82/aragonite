["https://onshape.com/en/features/branch-merge-cad"]
title = "Branch and Merge for CAD Design | Onshape"
description = "Branch and merge your CAD designs to explore more design variations."
full_description = "Onshape enables a new paradigm of working for CAD designers, where multiple engineers can experiment simultaneously with design variations without fear of disrupting each other's work. This enables fair collaboration and conflict-free environments where the best ideas win. Branching and merging workflows enable teams to be more agile by allowing experimentation on different design options without compromising the ongoing design effort. As ideas on different branches mature and become viable, they can be selectively merged back into the main design branch. With a unique cloud-native architecture, Onshape delivers a data-driven, built-in PDM solution. Unlike legacy CAD software, exploring designs in Onshape does not result in multiple copies of files, so you never have to deal with the file-management hassles of duplication, or moved or renamed files. Unique to Onshape, branching and merging works without forced PDM check-in and check-out restrictions, enabling teams to safely work faster in independent workspaces without ever having to wait for CAD access. In Onshape, you do your modeling in workspaces, regardless of whether you are working with parts, assemblies or drawings. The process of creating a new workspace from a version of your CAD model is called branching. A branch is not another file or a copy to maintain. Rather, it’s a pointer to the original CAD model version where the branch originated. Team members can explore alternative ideas without affecting others by creating branches and selectively merging the best elements from multiple designs back into the main design. When working with lots of branches and changes across many different Part Studios, assemblies, drawings and other tabs, it is sometimes difficult to know exactly what effect a merge will have on your Document. When you start a merge operation, Onshape will provide you with a new interface to help you understand the effects of merging one branch with another. This will make it possible to allow for selective merge operations at the solid or surface level."
