["https://onshape.com/en/resource-center/tech-tips/configuring-imported-geometry"]
title = "Configuring Imported Geometry - Onshape"
description = "Learn how to use Onshape to make powerful model adjustments, capturing direct edits as features and enabling configurations for versatile design options."
full_description = "SolidTranslate is here to bridge the gap between SOLIDWORKS and Onshape, facilitating the manipulation of design data significantly. But what are your options to modify and manipulate imported geometry from other CAD systems? Onshape’s Powerful Direct Editing Tools Onshape offers robust tools for making design adjustments. When you import a STEP, IGES, or Parasolid file to Onshape, you are left with a simple solid that does not have any parametric features. Parametric CAD is creating 3D models using parameters, relationships, and constraints while manipulating designs with focus on defining how the model should behave when modifications occur. When you directly edit the model (for example, adjusting fillets or moving faces), or perform boolean operations (Extrude, Sweep, or Pattern), these changes are captured as features. Parameters are automatically created in these features, which makes the geometry more intelligent. One of the benefits of parametric modeling is that feature suppression is configurable. Turn on and off features to achieve the desired geometry. In the example below, directly edited features are suppressed. Additionally, you can use variables to directly edit features and then configure them to create different sizes, angles, or face patterns. By leveraging the power of parametric features to create configurations, you turn your simple imported solid into an intelligent and flexible model with alternative design options. This Tech Tip helped you learn how to use Onshape to make powerful model adjustments, capturing direct edits as features and enabling configurations for versatile design options. Watch the video below for this Tech Tip in action: Interested in learning more Onshape Tech Tips? You can review the most recent technical blogs here. Onshape Events Register for real-time and on-demand events hosted by Onshape experts. Browse Events"
