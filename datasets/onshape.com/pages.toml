description = "Learn about Onshape's world-class support, in-app feedback tools, and our award-winning online training portal."
full_description = "If you have specific questions with regard to using Onshape, you can search previously posted questions and solutions provided by the greater Onshape Community via our Forums. If you can't find a relevant answer, post a question of your own. The Onshape forums are frequented by expert Onshape users and Onshape staff from all areas of the company, not just support, so questions are answered swiftly. If you have a paid subscription, feel free to ask your question direct to Onshape support. Support tickets are created directly inside the Onshape interface, making it easier for you to explain the exact nature of the problem you are experiencing. Once a support ticket is generated, you will receive email notifications to keep you informed every step of the way as your issue is logged, changes status or is resolved in the latest update of the Onshape software. You can review your support tickets at any time, check the status on open issues, add more information or voice your level of satisfaction. See here for a step by step guide on how to create a support ticket. In addition to providing a text description, you can use Onshape's built-in feedback tool to capture any part of your screen, highlight areas of interest and add comments and markups to communicate your issue clearly. This screenshot is automatically added to the ticket, so Onshape's support staff are able to see the issue you are experiencing without requiring access to your Document. For a more complex or Document specific issue, you can share your Document directly with Onshape Support using a simple toggle switch. Sharing your Document enables the support staff to see first-hand what the issue is and, in most cases, solve the problem more quickly. Sharing gives Onshape's dedicated support team access to your Document for a limited time only. No other Onshape employees have access to your data and you can revoke the share at any time. Onshape’s Learning Center offers self-paced video training, technical briefings and instructor-led courses. The self-paced videos cover Onshape essentials for sketching, parts, assemblies and drawings, plus many advanced topics. Technical briefings offer advice and techniques on more in-depth design and data management processes. Instructor-led courses, consisting of live, web-based training are available for a small fee. Each learning pathway includes exercises and course completion certificates."
