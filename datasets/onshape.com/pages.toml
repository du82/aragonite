["https://onshape.com/en/resource-center/tech-tips/frames-points-work-cell"]
title = "Tech Tip: Using Points to Easily Build Frames"
description = "In today’s Tech Tip, learn how to use the Onshape Frames point-to-point feature and how to build the base for a work cell!"
full_description = "We introduced Onshape Frames nearly a year ago and since then, we’ve been building up the toolset with more powerful features. In this Tech Tip, you will learn about: How to build frames point to point, and How to create the base for a work cell. Building Frames Point to Point Did you know that you can create frame structures by using points in Onshape? When working on a set of frames you can utilize your sketch geometry in more ways than one. Usually, users tend to think only lines can be used in the construction of structures, leading to a lot of potentially unnecessary planes and sketches. Onshape’s Frame tool allows you to utilize points in the creation of your frame structures. In the example below, you can see how, with three simple sketches (all of which are the same, simply offset from each other), you can generate a lot of useful structural geometry. Creating a Base for a Work Cell To make this example more valuable, let's use these three sketches to build the core infrastructure for a work cell. One of the main benefits of this workflow is the speed with which we can work as we utilize our design intent to construct highly editable and configurable frame systems. By the end of this quick tutorial you will be able to build something like this: Take a look at the video below to better understand how to combine frame functionality! Interested in learning more Onshape Tech Tips? You can review the most recent technical blogs here. More Tech Tips"
