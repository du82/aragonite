title = "Education Plan Privacy Notice | Onshape"
description = "Privacy Notice for the Onshape Education Plan."
full_description = "In addition to meeting the eligibility requirements set forth in the Privacy Policy and EULA, to use Onshape Education plans, you must be: For Onshape Educational accounts, Onshape does not collect personal information from students for commercial purposes. PTC’s Onshape Education Plan’s processing of personal information is compliant with COPPA and FERPA. Where an account has been set up by a school on behalf of a child, personal information will be shared with the school, to enable the school to administer the account and monitor progress in the use of Onshape. As with any SaaS or online product, it is necessary for Onshape to collect and process certain personal information relating to the student. When using Onshape Education, the following categories of personal information will be collected: (A) Identifiers such as a real name, alias, postal address, unique personal identifier, online identifier Internet Protocol address, email address, account name, social security number, driver’s license number, passport number, or other similar identifiers. (F) Internet or other electronic network activity information, including, but not limited to, browsing history, search history, and information regarding a consumer’s interaction with an Internet Web site, application, or advertisement. (J) Education information, defined as information that is not publicly available personally identifiable information as defined in the Family Educational Rights and Privacy Act (20 U.S.C. section 1232g, 34 C.F.R. Part 99). A student, parent or legal guardian of a student may request access to a student’s personal information, and student created content and the correction of any erroneous information or the deletion of the student’s account from the Onshape platform. To do so, a written request should be sent to the Onshape team at privacy@onshape.com. The request must include the child’s name and email address and details of the relationship between the requester and the student. Onshape will require verification of the requester’s identity and proof of relationship and verification of parental rights of the student where the request is not made by the student directly."
