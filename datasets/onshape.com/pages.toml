["https://onshape.com/en/resource-center/tech-tips/creating-frames-with-custom-profiles"]
title = "Tech Tip: Creating Frames with Custom Profiles"
description = "This Tech Tip is about creating custom frame profiles using the Frames feature in Onshape and using them to create framed and welded designs with detailed cutlists."
full_description = "Hopefully, by now, you’ve all had the chance to check out Onshape’s Frames functionality and all the benefits it can provide to you. The Frames feature was added a few months ago to Onshape and has been taking the community by storm ever since. Many times your designs will use the multitude of frame profiles fitting 8020, AISC, ANSI, AS, and ISO standards that are provided with the tool. For any instance where you need a custom profile for your frames, Onshape has you covered as well! Custom Profiles for Frames For one-off designs, create your custom profile as a sketch inside a new Part Studio in the document that you are working in. Custom profiles can also be created in separate documents and then linked to the document that you are working on. This can especially come in handy if you want to build a common library of reusable profiles for your company. Remember, linking to a specific version of a document allows you to make small changes to these custom profiles if needed without having to worry about unintentional changes to any previously created documents that also reference these profiles. The custom profiles that you create can be tagged to include pertinent information about them for use in your cut list. The Tag Profile feature allows you to fill in a frame standard and description for your custom profile, along with the ability to add in any additional metadata columns about the profile that you would like to have in the cut list. Building Frames with a Custom Profile Once you’ve completed your profile, it’s time to create your frame! In the Frames feature, choose the custom profile from its location and start building. The Frames feature works the exact same way using custom profiles as it does with its default profiles. Add a cut list to your model to see all cut information about your frame, including any custom metadata that you added when tagging your profile. Learn more by watching the video below: If you would like to learn more about Frames, check out this webinar put on by Onshape’s own Jay Tedeschi and Joshua Newth! As always, stay tuned for the next Onshape Tech Tip next week, and until then, check out the library of past Tech Tips! More Tech Tips"
