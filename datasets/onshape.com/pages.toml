["https://onshape.com/en/features/release-management"]
title = "Release Management for CAD Design | Onshape"
description = "Release Management is a set of automated workflows in Onshape for managing release procedures and to revision control parts, assemblies and drawings. Learn how these tools are built directly into Onshape's design and version control system, requiring no additional products, installs or IT management."
full_description = "Release management is the process of managing design changes, ensuring that only approved design updates are used downstream. It provides data traceability and helps ensure quality and adherence to business standards. Onshape streamlines release management tasks so you can shorten release processes from days to a few minutes. Set up automation for standard release and approval workflows, including teams, roles, and preferences, in just a few steps. Onshape’s flexible part-numbering generates part numbers and revision schemas, streamlining the design and approval process. Manage revision control for parts, assemblies, and drawings, tracking their status in real-time—whether in-progress, released, or rejected. Balancing data control with flexibility and collaboration is crucial in release management. Onshape ensures continuous data access, allowing uninterrupted work during the creation and approval stages. With this, you can support engineering change orders (ECO) seamlessly, sharing assemblies, drawings, and data without blocking access. Onshape enables you to work efficiently from any device even mobile devices through the Onshape Mobile App. With this level of access, you can approve and release designs even on the go. Stay updated with live notifications. Built-in change detection, alerts, and visual cues keep teams aware and informed about new versions of parts or assemblies, ensuring the correct revision is always in use. Additionally, approvers and observers are automatically notified whenever a design undergoes changes or requires review, streamlining communication in the approval process. Onshape simplifies the process of identifying the revision of a CAD model, ensuring you share the correct CAD with manufacturing every time. Visual cues and filters show a part's release status, saving valuable time. Onshape Publications lets you collate released designs from multiple Documents for easy, secure sharing with external suppliers and manufacturing partners."
