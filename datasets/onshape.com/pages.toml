["https://onshape.com/en/resource-center/tech-tips/quickly-access-document-history"]
title = "Tech Tip: How to Quickly Access Document History"
description = "Learn how to quickly access Document history without opening a Document in Onshape."
full_description = "One of the most powerful features of Onshape is the built-in data management tools that record every change made to any project data, which makes it easy to understand who did what and when in the design. To view the Document history, select the “Versions and history” icon in the toolbar within a Document. Here you see every action taken on this Document going all the way back to the moment it was created. But have you ever run into a situation where you need to access the Document history to restore it to a previous point in time, for example, without going into the Document itself? Why waste time waiting for the Document to open when you can do what you need to do from the Documents page? The entire Document history can also be accessed from the Onshape Documents page by selecting a document and clicking the “Versions and history” icon on the panel on the right. Here, you can easily perform different actions such as Restore, Branch or edit Properties, saving you time as you work, and giving you the freedom to have more fun! You can also access a full-screen version of the Document history by right-clicking a Document and selecting “Versions and history”. This approach is a lot more convenient in some situations than opening a Document and waiting for the loading process to complete. To see how this works in real-time, check out the video below. For more on Onshape’s data management tools, check out these related Tech Tips: Tech Tip: How to Selectively Remove Unwanted Actions in Your Onshape Document History Tech Tip: How to Easily Restore a Document Tech Tip: URL Tips for Onshape Documents Tech Tip: Comparing Design Changes Tech Tip: A Guide to Successful Merging in Onshape To find more useful tips for using Onshape, check out some of our recent technical blogs. Explore More Onshape Tech Tips Tech Tips Home"
