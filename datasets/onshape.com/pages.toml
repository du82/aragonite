["https://www.onshape.com/en/resource-center/ebooks/agility-and-consensus-in-dfm-reviews"]
title = "Agility and Consensus in DFM Reviews | Onshape"
description = "Read this managers guide for soliciting stakeholder feedback during design for manufacturing (DFM) process."
full_description = 'This guide offers suggested ways to improve communication within your supply chain. Feedback from DFM reviews impacts everything, including manufacturing, costs, timing and eventual customer satisfaction which is why it’s so critical to be a good listener. Asking the right questions can help balance agility with consensus in creating the best manufacturing process possible to bring your product to market. "Making sure our vendors have the most up-to-date drawings provides immediate savings. Anytime we get a manufacturing mistake, it could cost several thousand dollars... the clarity that Onshape gives us in our communications with vendors is invaluable.” Most product design teams are isolated during the design process and do not have enough contact with other departments. When the flow of information and feedback are restricted, it can lead to problems with the final product. This is where cross-functional design comes in. Cross-functional design is the process of having members from different departments involved in the product’s lifecycle. As a result, product designers work better when they have input from other team members on different aspects of their process, like engineering, marketing or sales. Only Onshape makes it easy for design teams and manufacturing teams to easily and securly communicate and collaborate in real-time at any phase of the design process. With Onshape you can easily share models via a URL, providing assembly line team members with real-time access to current models. Removing the communication and collaboration barrier, here are some question you can ask to streamline the DFM review process. DFM reviews focus on reducing production time and costs while ensuring products meet requirements, regulation, and quality standards. Here are some questions your can ask of assembly and installation team your manufacturing suppliers and production teams during DFM reviews Are there better materials to use, such as more sustainable