["https://onshape.com/en/resource-center/tech-tips/add-metadata-standard-content"]
title = "Tech Tip: How to Add Metadata to Standard Content in Onshape"
description = "Learn how to edit metadata for Standard Content to ensure consistency in part numbering schemes for your company."
full_description = '''Onshape’s approach to Standard Content greatly simplifies the insertion of basic hardware, like nuts, bolts, screws, and washers, into a CAD model. Onshape’s Standard Content is available to everyone. No special packages or add-ons are required. It’s also much easier to use; each piece of Standard Content has a built-in Mate Connector that makes inserting easy – and you can insert several items at once by selecting a face. But most importantly, everyone in your company uses the same parts with the same metadata. If you edit the Part Number and Description for a piece of Standard Content, that change is instantly reflected throughout your company. Editing Standard Content Properties Previously, editing metadata for Standard Content in Onshape was limited to the Part Number and Description fields. However, with a recent update, you can edit all metadata associated with your Standard Content. While inserting Standard Content, you will notice a new icon that allows you to edit properties. Clicking on this icon brings up the properties dialogue, similar to the one used throughout Onshape. For Onshape Professional and Enterprise users with administrative privileges, an additional feature allows numbering schemes to be defined beyond released objects. You will find a new option for numbering schemes by accessing the company settings. Here, you can specify your preferred numbering scheme for released objects, Standard Content, and items. By selecting the "Sequential number generation" and configuring your numbering scheme, you can set up automatic part number generation for Standard Content, similar to what is done for released objects. To summarize the process: Access the company settings in Onshape. Locate the numbering schemes option. Choose the "Sequential number generation" option. Define your preferred numbering scheme for Standard Content. Save the changes. By following these steps, you can ensure that part numbers for Standard Content are auto-generated consistently, aligning with your company's numbering conventions. For more, check out our latest Tech Tips for more design best practices.'''
author = "Mehul Gala"
year_published = 2020
