["https://onshape.com/en/resource-center/case-studies/black-swift-technologies"]
title = "Black Swift Technologies Creates Research Drones Tough Enough for Volcanoes | Onshape"
description = "Learn how the Black Swift Technologies engineering team stopped their CAD version control “nightmares” when they switched to cloud-native Onshape."
full_description = '''R&D team credits Onshape’s Branching and Merging capabilities for enabling more design experimentation Black Swift Technologies designs and manufactures unmanned aircraft systems (UAS) for scientific missions in extreme conditions, such as monitoring and assessing the Arctic landscape, wildfires, tornadoes, hurricanes and volcanoes. The BST product development team switched to cloud-native CAD after being frustrated by the version management capabilities of file-based CAD - specifically the ability to return to an earlier iteration of a drone design. With its previous on-premise CAD system, BST engineers were forced to recreate earlier work, wasting time that could be spent on new designs. “We also like the flexibility to be able to switch around between different computers and not having to worry about licensing. If someone’s computer is down, we can just log in to another computer. We’re constantly pushing the edge of what’s possible in our industry and Onshape helps us keep moving forward.” Based in Colorado, Black Swift Technologies designs and manufactures unmanned aircraft systems (UAS) for scientific missions in extreme conditions, such as monitoring and assessing the Arctic landscape, wildfires, tornadoes, hurricanes and volcanoes. The company frequently works with government agencies such as NASA, the National Oceanic and Atmospheric Administration (NOAA) and the United States Geological Survey (USGS), focusing on building better models of turbulent environments that provide more accurate predictions of danger levels or of an event’s severity and progression. “Our products are being used to improve models of hurricanes and wildfires,” notes Jack Elston, founder and CEO of Black Swift Technologies. “It's exciting to help support research which can have a significant impact on safety and preventing property loss." When designing their aircraft, BST engineers need to consider the resistance to extreme temperatures, high winds and unpredictable atmospheric conditions.'''
