description = "Onshape Inc. develops the only product design platform that combines 3D CAD, PDM, collaboration and analytics tools in the cloud."
full_description = "To start learning Onshape, create an account and click on any of these resources to help you get started in our learning center, for free. If you are an educator, click here to Jump to Educator Resources Explore key concepts involved in modeling parts and assemblies in a feature-based parametric CAD system. Learn fundamental CAD concepts specific to Onshape including navigation, sketching, part studios, and assemblies. This YouTube playlist will teach you how to use general CAD and Onshape-specific tools, such as modeling, analysis, sharing and shortcut features. As an educator, you can now fulfill CTE requirements with the Onshape Certified Associate exam. As a student, you can demonstrate your CAD proficiency to colleges and prospective employers. Read our blog “Why Students Should Take the Certified Onshape Associate Exam” for information on the benefits of being Onshape certified and the resources available to help you prepare for the exam. As an educator, learn how to use Onshape in the classroom with our Learning Center and integrate it into your curriculum using resources from some of our partners. To access the Learning Center, you must sign up for a FREE Onshape account. Intro to CAD is a set of curriculum resources educators can use to teach CAD. It is appropriate for students new to CAD at the high school or college/university level. Teachers - learn how to implement Onshape in your classroom and integrate it into your teaching workflows. Take your robotics team to the next level and help them design a champion robot with our Onshape robotics curriculum. Find and participate in discussions with other educators and Onshape experts about Onshape curriculum, best practices, classroom setup and more. Engineering byDesign™ (EbD)™ is a set of curricula developed by The International Technology and Engineering Educators Association (ITEEA) in partnership with PTC/Onshape. Take your students from novice to certification-ready with tutorials fr