["https://onshape.com/en/resource-center/what-is-new/simulation-publications-ar-view"]
title = "What’s New: Simulation, Publications, AR View - Onshape"
description = "In this October 10, 2022, update, find highly requested improvements to Onshape’s toolset, including FEA capabilities, AR view on mobile, and much more!"
full_description = "Autumn is in full swing, and so is Onshape. In this update, we reveal some highly anticipated swaths of functionality that are revolutionary new ways to get your work done. Onshape Simulation Beta, Publications, AR View, and many other highly requested improvements to general CAD functionality are now available. Check it out! Onshape Simulation Beta The time is here to introduce cloud-native Onshape Simulation – a fast, easy, and accurate (FEA) Finite Element Analysis solution that provides structural analysis built right into Onshape Assemblies. This provides meaningful mechanical guidance early and often as you iterate on your designs. Fast, Cloud-Compute Easy to use, if you can build an Assembly, you can run a simulation. Accurate, proprietary, and validated technology. Simulation works with key Onshape features such as configurations, variables, branching and merging, and sharing. Simulation respects your Assembly mates with groundbreaking, fast visualization of part connections. And it has body-centric loading and interactions. Onshape Professional Publications Onshape Publications are a novel way to share exactly the right CAD design information and the exact PDM state of data that you wish to share with your extended design and manufacturing teams. This new type of Document in Onshape collates design information, including Part Studios, Assemblies, Drawing, and other file data without the full version history. This also reduces the need to export packaged copies of files when sharing with non-CAD users, providing the benefit of up-to-date information using Onshape's dynamic sharing capabilities. General Improvements Drill Tip Angle Setting the drill tip angle in the Hole tool now has options for standard drill tip sizes as well as Flat and Custom angles. Also of note, if using a Hole Table, the number of hole instances will be tracked independently if the same size hole is used with a different drill tip angle. Split Face With 3D Curve 3D Curves can now be used as tools to split faces in a Part Studio. Tangency Propagation There are some conditions where auto-tangency is not the desired outcome. New in this update, users can control whether they want to allow for auto-extension of tangency or not. Auto-Reconnect Onshape will now gracefully reconnect if a temporary internet outage is encountered. Drawings Improvements Conjugate Angle Support in Smart Dimension The Smart Dimension tool allows for Conjugate Angle Dimensions, which were previously supported only when using the Line to Line Angular Dimension tool. Render Studio Improvements Stylized Render Mode Stylized (non-photorealistic) rendering mode is now available in the view drop-down menu for creating a large variety of marketing images. Virtual Ground Settings The user experience has been improved to simplify environment dome and virtual ground settings. Background Color The user experience has been improved to move the background image and color settings to the view drop-down menu. iOS and iPadOS Improvements AR View For iPhone and iPad users, the Onshape App now provides natively built-in Augmented Reality viewing of live designs within Onshape Part Studios and Assemblies. This functionality is powered by PTC's very own Vuforia product. Simply enable the AR View mode in the view pull-down menu or via the view-only heads-up toolbar. No need to re-export to AR formats for every design change. If your design updates, so do the view on-screen. Publications Now available on iOS, Onshape Publications allow users a novel way to share exactly the right CAD design information and the exact PDM state of data that you wish to share with your extended design and manufacturing teams. This new type of Document in Onshape collates design information, including Part Studios, Assemblies, Drawing, and other file data without the full version history. On mobile, Publications are view-only. Allow User to Pick STEP Version STEP file format selection is now available on mobile during the Export function. Intersection Curve Full support for the creation of Intersection Curves in the Part Studio is now available on mobile. Android Allow User to Pick STEP Version STEP file format selection is now available on mobile during the Export function. Publications Also on Android, Onshape Publications, which are a novel way to share exactly the right CAD design information and the exact PDM state of data that you wish to share with your extended design and manufacturing teams. This new type of Document in Onshape collates design information, including Part Studios, Assemblies, Drawing, and other file data without the full version history. On mobile, Publications are view-only. Intersection Curve Full support for the creation of Intersection Curves in the Part Studio is now available on mobile. Learning Center Updates The training team has been working hard to keep the videos in the Learning Center up-to-date with all the great improvements to Onshape: Advanced Part Design course: Update to the Variables video to include the measure option. Part Design Using Part Studios course: Updates to the Sweep video to include sweeping a profile in the middle of a path. Document Management course: A new video on Where Used for Professional and Enterprise users. Understanding Curves course: Update to the Projected curve video to include projecting a sketch onto a face or surface, and new videos on Beizer curves and Intersection curves. Detailed Drawings course: Update to Dimension video to include jogs, plus Separated Hole callout and Ordinate dimension to their own videos. Please take a moment to try out these new features and improvements and leave your comments in the Forum post. For a detailed list of all the changes in this update, please see the changelog. Explore What's New Remember: The updates listed here are now live for all users when creating new Documents. Over the next few days, these features will also be available in Documents created before this update."
author = "Michael LaFleche"
year_published = 2022
