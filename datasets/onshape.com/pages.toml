full_description = "When migrating your designs into Onshape, ensuring proper metadata transfer is a crucial step. Onshape’s bi-directional Bill of Materials (BOM) makes this process quick and easy by allowing you to copy and paste directly from a spreadsheet. The most important part of this process will be ensuring consistent formatting of rows and columns. Thanks to Onshape’s BOM Templates, formatting can be standardized to ensure all relevant fields are filled in. Once you’re set up, copy the empty fields from your spreadsheet software of choice: Then just simply paste it into your BOM using keyboard shortcuts. And that’s it! This simple trick can help save you lots of time and make your life easier.Interested in learning more Onshape Tech Tips? You can review the most recent technical blogs here."
