["https://onshape.com/en/resource-center/tech-tips/tech-tip-exclude-parts-or-assemblies-from-the-bom"]
title = "Tech Tip: Exclude Parts or Assemblies from the BOM"
description = "Wondering how to exclude parts or subassemblies from your BOM? Learn how with this Tech Tip from Onshape."
full_description = "Last year, we announced the Simultaneous Bill of Materials functionality in Onshape. It gave users an automatically created, real-time updating BOM that you can interact with directly in your assembly. And as more and more users adopt this new feature, one of the more common questions we get is, “How do I exclude part or subassemblies from my BOM?” Let’s take a look. One of the easiest ways to exclude parts or subassemblies from the BOM is to right-click on them in the BOM table in the assembly. In the right-click context menu, you will see the option to “Exclude from BOM.” Another option is to edit the part or assembly properties. In the properties dialog, you will see a checkbox to “Exclude from BOM.” Once a part or subassembly has been excluded, it can be included again by either unchecking “Exclude from BOM” in the properties dialog, or by choosing the “Show excluded” option in the BOM table and right-clicking the part or subassembly you want to include, and then choosing “Include in BOM.” So that’s all it takes to exclude parts or assemblies from your BOM in Onshape. Give it a shot! More Tech Tips"
author = "Cody Armstrong"
