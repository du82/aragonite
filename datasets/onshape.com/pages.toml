["https://onshape.com/en/resource-center/tech-tips/use-parts-build-frames"]
title = "Tech Tip: How to Use Parts to Quickly Build Frames"
description = "Did you know the Onshape Frame tool allows you to select the edges of parts and surfaces? Learn about it in today’s Tech Tip."
full_description = "Onshape’s Frames functionality facilitates the efficient design of welded structures. Designers can specify a path to create groups of industry-standard tubes, channels, and beams with various corner treatment and trimming options. However, building the underlying skeleton with multiple sketches and curves might take time and effort. But did you know the Frame tool also allows you to select the Edges of Parts and Surfaces? Using the edges of 3D parts and surfaces as skeleton geometry is a powerful and time-saving technique. Use Solid Modeling to Build Skeleton Geometry Utilize traditional modeling tools such as Extrude and Fillet to represent and map out the necessary design. Use part faces to position sketches and build additional references. Split is a helpful tool for producing symmetric edges or calculating compound angles. The resultant solid models are robust and simplify visualizing the final design. Generate the Frame After completing the skeleton, construct the remaining geometry using the Frames toolset. Optionally clean up the Part Studio by deleting the skeleton parts afterward. Pro Tip: Check out the Frames Fundamentals course at the Onshape Learning Center. This technique is a highly effective way of creating structures. Incorporating this strategy with Custom features makes complex geometry like a geodesic dome straightforward. Watch the video below to see how it works in real-time. Interested in learning more Onshape Tech Tips? You can review the most recent technical blogs here. Try Onshape Professional Free Trial"
