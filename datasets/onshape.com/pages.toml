["https://onshape.com/en/resource-center/case-studies/gks-packaging"]
title = "GKS Packaging Creates Eco-Friendly Bagging Machines for Supermarket Produce"
description = "Learn why GKS Packaging product engineers rely on cloud-native Onshape to streamline their modular machine designs."
full_description = 'Based in the Netherlands, GKS Packaging specializes in cost-effective packaging machine solutions for a wide variety of products, ranging from garden-fresh vegetables to medical supplies to hardware fasteners. All of its machines are designed and built modularly, using some of the same modules across multiple products. The GKS team was seeking a better way of managing its design changes amongst multiple engineers. The company was also seeking a cloud-native platform to reduce IT overhead. “Before Onshape, you would install updates and just keep your fingers crossed. We’re no longer losing a half day or longer to update our computers. We’re no longer buying a high-performance workstation every three or four years just to run CAD." Meeting the surging retail demand for paper food packaging over plastic, the eco-friendly LEAF is a leaf-shaped VFFS machine that produces bags out of 100% recyclable and compostable paper stock. The film roll frame is completely constructed out of recycled ocean plastic, a gesture to raise awareness about global pollution. The machine is also built with stainless steel and other recyclable materials. The LEAF’s translucent door panels are illuminated with a blue, green or red LED glow to designate its operational status. It’s a behind-the-scenes light show that sticks out in a production line landscape of mostly grey. “We didn’t just modify an existing machine to achieve ‘acceptable’ results. We definitely wanted the LEAF to stand out from the pack,” says Ivo Geukes, owner of GKS Packaging. “I’m personally a huge fan of Apple and Tesla designs. Design doesn’t cost you any more, per se, you just need to be a little more creative.” “We could build our machines the same way our competitors do, but then you don’t have your own look and personality. When somebody sees our machines, I want them to immediately know it’s a GKS machine,” he adds. Based in the Netherlands, GKS Packaging specializes in cost-effective modular packaging solutions for a wide variety of products, ranging from garden-fresh vegetables to medical supplies to hardware fasteners. The company also designs and builds weighing systems, dosing systems, conveyor belts, and platforms to customer specifications.'
