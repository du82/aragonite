["https://onshape.com/en/features/product-data-management"]
title = "Data Management for CAD Design | Onshape"
description = "Learn how Onshape’s Cloud-Native CAD and PDM provide a complete, searchable, and secure product development platform with built-in version control and release management tools."
full_description = "Product Data Management (PDM) software centralizes CAD information so engineers can efficiently store, search, and manage their design data. Onshape's PDM is built into its cloud-native CAD platform, serving as a foundation for all its CAD workflows. This modern approach simplifies data management and makes design data accessible to those who need it. Onshape's built-in PDM stores all CAD data in Documents. These can contain assemblies, drawings, BOMs, media like images, videos, or PDFs. Onshape Documents centralize data and keeps a tracking of the entire access and edit history so users can easily revert back to an any previous state of the design. Onshape helps teams iterate, discuss, and find solutions quickly through branching and merging which enables multiple engineers to work on the same design concurrently, without conflict. Branching creates independent workspaces for individuals to explore ideas without fear of disrupting others' work. Teams can easily manage design conflicts with tools to compare and merge selective changes into the main design. Onshape accelerates release processes from hours or days to mere minutes by automatically organizing design data and eliminating the need to locate CAD files. Set up release processes in just a few steps, including review and approval workflows, roles, and company preferences. Additionally, Onshape makes it easy to share the correct, approved design with your extended manufacturing team and eliminate the need for CAD version-specific viewing tools through Publications. Onshape’s Where Used is a powerful tool for tracking where a part has been used in an assembly. It can also help you locate instances where custom features have been applied. Can’t remember a name or part number? Simply search by property values to find any Part, Assembly, Drawing, or Document. Extend your data management benefits with the Onshape-Arena Connection, which integrates CAD, PDM, and PLM in the cloud. The Connection enables real-time sharing of design information between engineering and operations teams while eliminating the complexities, administrative burdens, and excessive costs associated with traditional PLM integrations."
