["https://onshape.com/en/features/simulation"]
title = "Online Simulation Software | Onshape"
description = "Rapidly investigate stress, deformation and natural frequencies of parts and assemblies leveraging the power of cloud computing with Onshape."
full_description = "Onshape Simulation is the easiest and fastest way to examine meaningful structural analysis results such as stress, displacement and natural frequencies, as you create and iterate in the Onshape design environment. With simulation built into Onshape’s cloud-native architecture, you can build better quality products faster with mechanical feedback that stays in sync with your assembly throughout the product development process. Onshape Simulation supports linear static and modal analyses - the most fundamental tools in a structural analyst's toolbox. Expert mechanical guidance is now available for you to use early and often in the design process. Design better products faster as you interactively visualize stress, deformation, and natural frequencies to ensure designs meet their factors of safety and avoid mechanical resonance. Onshape delivers simulation in the assembly environment, so you can easily simulate full assemblies, not just parts. Assembly mates – such as fastened, revolute, slider and more – automatically translate into simulation kinematics, dramatically simplifying your FEA analysis while ensuring an accurate physical representation of your assembly. Onshape Simulation is easy and efficient for full assembly analysis and does not require defeaturing or meshing. You can apply loads and constraints directly to either full parts or individual part faces. Be agile and get to a final design faster, change your assembly configuration, modify a part or update a global variable and without any additional effort simulation results refresh automatically. Seamlessly switch between visualizing stress analysis results and editing your part in the context of your CAD assembly allowing you to iterate quickly with informed mechanical guidance. Simulation is built into the familiar Onshape Assembly environment and directly uses the full assembly's parts, materials and mates offering a unified and efficient FEA experience. As part of your Onshape Document, simulations are version controlled with built-in product data management (PDM) and can be securely shared instantly with other users for better collaboration and better decisions."
