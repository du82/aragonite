title = "Cumulative updates during OOBE: Never mind… – Out of Office Hours"
description = "Remember the change planned for October to start installing updates during OOBE?  The one that didn't have any controls?  The one that interrupts the Autopilot user-driven flow by rebooting the computer in the middle of the process? Well, the Microsoft post announcing this has been updated to say that it has been postponed until they…"
full_description = "Windows 11 Cumulative updates during OOBE: Never mind… By Michael Niehaus on September 20, 2024 Remember the change planned for October to start installing updates during OOBE? The one that didn’t have any controls? The one that interrupts the Autopilot user-driven flow by rebooting the computer in the middle of the process? Well, the Microsoft post announcing this has been updated to say that it has been postponed until they can make some improvements: Update September 20, 2024: We’ve heard your feedback regarding the Windows update experience during the OOBE, and while we understand the importance of keeping devices updated from the start, we’re committed to implementing this change in the best way for IT admins to manage their environments. This change has been postponed. Updates will continue to not be applied during OOBE for Autopilot devices until we’ve established the right mechanisms for IT admins to properly manage and adhere to update policies. We appreciate your patience and understanding as we strive to enhance the Windows enrollment experience. Stay tuned for more updates! One step forward, one step back. Ah well, one of these years we’ll be able to update Windows during the Autopilot process without using a script. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-1638745181-67c3ef6e3707c', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Discover more from Out of Office Hours Subscribe to get the latest posts sent to your email. Type your email… Subscribe Share this:TweetEmailMastodonLike Loading... Related Categories: Windows 11 Tagged as: Intune, Windows 11, Windows Autopilot, Windows Update"
