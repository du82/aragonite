["https://oofhours.com/2024/10/30/finally-a-standalone-version-of-connected-cache-for-delivery-optimization"]
title = "Finally, a standalone version of Connected Cache for Delivery Optimization – Out of Office Hours"
description = "If you are using Windows 10 or 11 (i.e. everyone), you are using Delivery Optimization (DO) to download all sorts of things -- see Phil Wilcock's post for a good overview of where DO is used. In an ideal world, everything would be downloaded once from the internet and then pulled from peers in the…"
full_description = '''Windows 11 Finally, a standalone version of Connected Cache for Delivery Optimization By Michael Niehaus on October 30, 2024 • ( 13 Comments ) If you are using Windows 10 or 11 (i.e. everyone), you are using Delivery Optimization (DO) to download all sorts of things — see Phil Wilcock’s post for a good overview of where DO is used. In an ideal world, everything would be downloaded once from the internet and then pulled from peers in the same location, but we’re not in an ideal world. There are plenty of things that can be done to improve peering. But in those cases where there are no peers, you might want another tool to help. That’s where the Microsoft Connected Cache (abbreviated to MCC) comes in. This has been included with SCCM for some time, so you could check a box to add it to a ConfigMgr distribution point, but if you weren’t using SCCM you were out of luck. Now, with the release of the preview version of a standalone version of MCC, you don’t need SCCM anymore. That said, it’s also no longer as simple as just a checkbox. The full details are in the preview documentation. Let’s start with the high-level requirements: You must be licensed for Windows 10/11 E3/E5/F3/A3/A5 (or Microsoft 365 E3/E5/F3/A3/A5) in order to use it. That follows a trend (e.g. AutoPatch) of linking cloud-based services to Windows/M365 subscriptions. You need an Azure subscription (and someone who has access to it) to register your MCC hosts. You can’t just install it and point clients to it; you have to register it, and configure it to be tied to that registration. There will be no charges to that Azure subscription (there is no Azure consumption and no cost to register MCC devices). You can run it on Windows 11 or Windows Server 2022 (or higher), or on Linux. On Windows, it will use the Windows Subsystem for Linux (WSL), running inside an Ubuntu container. If you haven’t used WSL yet, no big deal, because you don’t have to interact with that container yourself. If using Windows on Hyper-V, you’ll need to enable nested virtualization for WSL to work. Port 80 must not be in use on the machines this is installed on — so don’t put it on an SCCM server or anything else running with a web server on port 80. I’ll leave it to the documentation for the details of “how” to install it. Issues I found on my first try: Not reading all the docs first. That was especially true for the port 80 requirement: I tried to install MCC on my existing SCCM server and failed miserably. This was also true for specifying a local service account: one parameter specifies the account name (e.g. “COMPUTERNAME\MCCAccount”) while the other specifies a PowerShell credential with the same account details and the account’s password — if you don’t specify those correctly, you’ll get some head-scratching errors. Running the installation PowerShell script using PowerShell 7. This didn’t work right because the scheduled tasks that the installation creates weren’t created with the proper paths to the PowerShell executable. (Microsoft may have already fixed this, but just in case, it’s easy enough to run the script from PowerShell 5.1.) Guessing what rights were needed for a local service account. The docs didn’t explicitly state what rights were needed, so I didn’t give it any. That failed (not surprisingly). Instead of trying to figure out the “proper” rights, I just added the account into the local Administrators group and called it a day — obviously not a best practice, but it suffices until the Microsoft docs can be more prescriptive on that. Once you have it installed, be sure to check back into the Azure portal since you can use it to monitor the activity through your MCC device(s). Not a lot of activity through mine yet (not surprising since no clients are point to it); that’s a task for a later date. At the end of the day, MCC is a DO-specific proxy server that caches any downloaded peerable content (so it doesn’t help with the non-peerable/HTTPS issues). It’s worth checking out the preview. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-1638745181-67c3ef7c15abb', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Discover more from Out of Office Hours Subscribe to get the latest posts sent to your email. Type your email… Subscribe Share this:TweetEmailMastodonLike Loading... Related Categories: Windows 11 Tagged as: Azure, Delivery Optimization, Intune, MCC, microsoft, PowerShell, security, Windows, Windows 10, Windows 11, Windows Autopilot, Windows Subsystem for Linux, WSL'''
