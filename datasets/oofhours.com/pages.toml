["https://oofhours.com/2024/09/16/cumulative-updates-will-be-installed-during-oobe-like-it-or-not"]
title = "Cumulative updates will be installed during OOBE, like it or not – Out of Office Hours"
description = "A while back, I noticed that updates were installing at the end of the Autopilot process, after device ESP had completed and before the user signed in. Per Microsoft's post, this is now going to happen on all Windows 11 devices starting soon: https://twitter.com/IntuneSuppTeam/status/1835759039755538499 The summary: Affects Windows 11 22H2 and above. All MDM-enrolled devices,…"
full_description = "Windows Autopilot Cumulative updates will be installed during OOBE, like it or not By Michael Niehaus on September 16, 2024 • ( 7 Comments ) A while back, I noticed that updates were installing at the end of the Autopilot process, after device ESP had completed and before the user signed in. Per Microsoft’s post, this is now going to happen on all Windows 11 devices starting soon: 📣 Important changes to the @Windows enrollment experience coming soon.➡️ Learn more: https://t.co/jBM4dCOivJ#MSIntune #Windows— Intune Support Team (@IntuneSuppTeam) September 16, 2024 The summary: Affects Windows 11 22H2 and above. All MDM-enrolled devices, Autopilot or not. Updates install at the end of OOBE, Devices will reboot after installing updates. Autologon will not happen after the reboot because credentials are not saved; the user will have to sign in again. At the moment, there are no controls available for this. Depending on how long the OOBE process (e.g. device ESP) takes, WUfB deferral policies may or may not apply. Autopatch device configuration may or may not be complete either. So which update will be installed? Assume it will be the latest available, but it is possible through deferrals and Autopatch rings that an earlier update is installed. Here’s what this will look like: This starts on Patch Tuesday in October, so it’s less than a month away. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-1638745181-67befcb7bdff0', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Discover more from Out of Office Hours Subscribe to get the latest posts sent to your email. Type your email… Subscribe Share this:TweetEmailMastodonLike Loading... Related Categories: Windows Autopilot Tagged as: Intune, Microsoft Intune, Windows, Windows 11, Windows Autopilot DanZi says: September 17, 2024 at 12:20 am Hi Michael, would this mean the updater script will be rendered useless, or with it the reboot can be supressed and the user won’t have the bad experience LikeLiked by 1 person"
