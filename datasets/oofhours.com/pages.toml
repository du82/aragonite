["https://oofhours.com/2024/11/22/all-done-at-live-360-tech-con"]
title = "All done at Live 360! Tech Con – Out of Office Hours"
description = "Six conferences in one week, and boy am I tired. Well, really it was six events in one, all in the same place (Orlando) at the same time. But it was still tiring -- 12+ hours of sleep later and I'm now functional again. This was the second year in a row that I presented…"
full_description = "Miscellaneous All done at Live 360! Tech Con By Michael Niehaus on November 22, 2024 Six conferences in one week, and boy am I tired. Well, really it was six events in one, all in the same place (Orlando) at the same time. But it was still tiring — 12+ hours of sleep later and I’m now functional again. This was the second year in a row that I presented at TechMentor, one of the six events at the Live 360! event. TechMentor is the IT pro-focused event, so it’s no surprise that I presented on OS deployment, Windows Autopilot, PowerShell. Since you can attend sessions from any one of the events, I also attended quite a variety of sessions, including on SQL Server (Buck Woody‘s session on vectors made my head hurt), Visual Studio (Mads Kristensen‘s session was a refreshing view of how to build products that people love), and other topics (Billy Hollis’ closing comments on Microsoft product manager “that’s great feedback” behaviors was spot on). But most of my time was spent within the TechMentor event sessions, including PowerShell sessions from James Brundage (“dark arts” indeed — stay away from my computer), a Winget session from Kevin Kaminsky, a Group Policy + Intune session from Jeremy Moskowitz, a session from John O’Neill Sr. that I could best summarize as “building a network in a suitcase (a.k.a. Starlink in a box)”, and a Windows tips-and-tricks session from Sami Laho (yes, the one where he admitted he’s old after no one claimed to know Mark Minasi). And thanks to everyone for the good hallway and lunch conversations. With any luck, I’ll see you at upcoming TechMentor events including one in Redmond at Microsoft’s headquarters (August 2025), or next year’s Orlando event (November 2025). __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-1638745181-67c3ef9124948', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Discover more from Out of Office Hours Subscribe to get the latest posts sent to your email. Type your email… Subscribe Share this:TweetEmailMastodonLike Loading... Related Categories: Miscellaneous"
