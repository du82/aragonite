["https://oofhours.com/2024/11/26/cmpivot-crashing-on-startup-maybe-its-config-file-is-messed-up"]
title = "CMPivot crashing on startup?  Maybe it’s config file is messed up. – Out of Office Hours"
description = 'Sometimes I would like to try something and have it "just work." Today was not one of those times. The task was simple: I want to try to use CMPivot to query information from my VMs. Step #1: Launch CMPivot from the ConfigMgr admin console. Nothing happens. Checking the event log on the computer, I…'
full_description = '''Microsoft Configuration Manager CMPivot crashing on startup? Maybe it’s config file is messed up. By Michael Niehaus on November 26, 2024 • ( 2 Comments ) Sometimes I would like to try something and have it “just work.” Today was not one of those times. The task was simple: I want to try to use CMPivot to query information from my VMs. Step #1: Launch CMPivot from the ConfigMgr admin console. Nothing happens. Checking the event log on the computer, I can see that it is crashing: OK, it’s struggling to read JSON settings from somewhere. That’s also confirmed in the CMPivot.log: But that doesn’t help with what settings. After a few ProcMon traces, I could narrow it down to the %AppData%\Microsoft\ConfigMgr10\CMPivot.dat file. Weird, because that file is not a JSON file, it’s a binary file: But it was the last thing that was read before the crash, so it’s involved somehow. Let’s try deleting it, since it should get recreated anyway. And presto, CMPivot launches again: Problem solved, right? Not completely. If I close CMPivot (without even doing anything), it will rewrite the file as expected. But when I then try to open CMPivot again, it crashes again — the same error. So each time I want to use it, I need to delete the file before launching it. Sigh. Granted, this may only be occurring in the Tech Preview 2405 release that I am presently running. And maybe the next tech preview release will fix it (within the next 10 days please, since the preview build is getting near the end of its 180-day validity — we need a new build). __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-1638745181-67c3ef958a266', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Discover more from Out of Office Hours Subscribe to get the latest posts sent to your email. Type your email… Subscribe Share this:TweetEmailMastodonLike Loading... Related Categories: Microsoft Configuration Manager'''
