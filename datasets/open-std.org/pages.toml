["https://open-std.org/JTC1/SC35/WG6"]
title = "ISO/IEC JTC1/SC35/WG6"
full_description = "ISO/IEC JTC1/SC35/WG6 is formed to develop user interfaces for people with special needs, including the elderly and disabled. Work is limited to the area of ISO/IEC JTC1. The first work items were on icons and symbols, concentrated, but not limited, to visually and hearingly impaired persons. Newer work items are on framework to determine accessibility and on accessibility setting. The working group ISO/IEC JTC1/SC35/WG6 is one of seven working groups for SC35 User Interfaces. More information on SC35 is at http://comelec.afnor.fr/iso/iso/ceijtc1sc35 If you want further information, or want to participate, please contact your national member body or one of the contact addresses of the WG."
