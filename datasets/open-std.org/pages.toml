["https://open-std.org/CEN/TC304"]
title = "CEN/TC304"
full_description = "CEN/TC304 was established in 1992 by the European Committee for Standardization (Comit� Europ�en de Normalisation, CEN) with the following scope: Standardization in the field of information technology as applied to character sets, to ensure that European requirements are satisfied. The work will be in the areas of the identification, manipulation and coded representation of character data and in its input, interchange and rendition by electronic means. The work includes other localization-aspects of Information and Communication Technology, such as string representations reflecting date and time conventions, currency notations and other cultural aspects of IT in Europe. CEN/TC304 is in a dormant stage, initially with 3 projects, now only one remains. TR 14381, European Fallback Rules and TS 1923, European Character Repertoires and their Coding - 8 bit single byte coding have been adopted and published. For EN 14603, Alphanumeric glyph image set for optical character recognition OCR-B - Shapes and dimensions of the printed image only one voting remains. CEN/TC 304 webmaster, Keld Simonsen, keld@dkuug.dk Comments are welcome! We can be reached at listadm@dkuug.dk"
