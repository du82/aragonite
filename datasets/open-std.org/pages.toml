["https://open-std.org/open-std-def"]
title = "Åbne standarder"
full_description = 'Formålet med åbne standarder er at sikre "interoperabilitet" (at systemer kan samarbejde problemfrit) mellem uafhængige produkter. Dette sikrer fri konkurrence på et frit marked og gør det samtidig betydeligt nemmere for brugerne af produkterne at anvende dem i nye sammenhænge på nye måder til gavn for samfundet, som derved får fuld udnyttelse af de aktuelle teknologier. Det er derfor nødvendigt at blive enige om en fælles definition af åbne standarder, der kan anvendes af alle. Et produkt, der hævder at basere sig på åbne standarder, skal for alle snitflader der er nødvendige for interoperabilitet og for at kunne integreres i og interagere med omverdenen, kunne henvise til den fuldstændige tekniske dokumentation, der er nødvendig for at skabe interoperable produkter. Det er et krav for at sikre denne interoperabilitet og for at mindske mulighederne for tekniske problemer i interaktionen mellem forskellige produkter, at standardens præcise navn/ betegnelse samt fuldstændige og udførlige dokumentation er let tilgængelig. Dokumentationen skal være offentligjort på almindelig vis. Kravet tilgodeser, at det er teknisk muligt at implementere standarden med den maksimale grad af interoperabilitet, og at alle der er interesserede i at implementere standarden uhindret kan de få fat i standarden. Der må ikke følge nogen bånd med på anvendelse og implementation af standarden. Det må f.eks. ikke være forbundet med afgifter at anvende den eller distribuere et produkt, der implementerer den. Der må ikke være politiske begrænsninger som f.eks. diskrimination overfor nationalitet, køn, race eller religion på anvendelse eller implementation. Anvenderen må ikke skulle forpligte sig ved indgåelse af specifikke juridiske aftaler/kontrakter for at kunne anvende eller implementere standarden. Kravet tilgodeser at ingen udelukkes fra samfundets infrastruktur for eksempel p.g.a. økonomiske, kulturelle eller politiske forhold og at ingen producent udelukkes fra at lade sine produkter være anvendelige i infrastrukuren.'
