["https://open-std.org/JTC1/SC22/WG11"]
title = "ISO/IEC JTC1/SC22/WG11 - Binding techniques"
full_description = "ISO/IEC JTC1/SC22/WG11 is the international standardization working group working on binding techniques for programming languages: how to make specifications independent of programming languages, and then apply these specifications to the programming languages. The working group was created in 1987, held 26 meetings and was disbanded by the SC22 Plenary resolution 11-05 in Copenhagen on September 20th, 2011. The meetings gives the complete list of meetings with links to the meeting reports, the documents pages has references to many (older and newer) documents. Note: the responsibility for ISO/IEC 11404:2007 - General Purpose Datatypes (GPD) is transeferred to JTC 1/SC 32/WG 2. If you want further information please contact your national member body or one of the WG11 addresses. At the time of the first (then still ISO/TC97/SC22) WG11 documents (August 1986) there was already an interim convener (Mr. Don Nelson, USA), and work was going on The work on this project already started in 1984 in the US. The purpose of the document is 'to classify language binding methods, reporting on particular instances in detail, and to produce suggested guidelines for future language binding standards'. The initial editor was Ms. Madeleine Sparks, in 1987 Mr. Don Nelson took over that task. The TR was published in 1993 as TR 10182 – Guidelines for Language Bindings. Work Item 22.16 - Specification for a Model for Common-Language Independent Procedure Calling Mechanisms This project was started by the X3T2 committee in the US; it's ISO history dates back to early 1985. The NWI proposal was approved in July 1986 (SC22 N211). The initial project editor was David Joslin (UK), later followed by Ken Edwards (US, August 1989). A first working draft was circulated in January 1992 (SC22 N1082). One of the key parts, common to the language-independent procedure calling mechanisms, the language-independent data types and the Remote Procedure Calling specification as developed by SC21, was the Interface Definition Notation (IDN); in other to harmonize this common part several meetings were held co-located with the SC21 RPG group. The standard was published in 1995 as ISO/IEC 13886 - Language-Independent Procedure Calling."
