title = "Checkbox (Explainer) | Open UI"
full_description = 'View ResearchCheckbox (Explainer)OverviewSection titled OverviewThe <checkbox> element is a control that allows the user to select a binary “checked” state, either checked or unchecked. The <checkbox> also supports a second binary “indeterminate” state.Use CasesSection titled Use%20CasesThe <checkbox> control is primarily leveraged to indicate a binary state. For example, many forms use a checkbox to indicate that a user has accepted terms of service or to opt in or out of email communcations.Prior Art/ExamplesSection titled Prior%20Art/ExamplesCheckbox inputKoliBriWAI-ARIA CheckboxWHATWGDesignSection titled DesignAPISection titled APIPropertiesSection titled PropertiesAttribute NameTypeDefault ValueDescriptioncheckedboolfalseControls whether the checkbox is checked or unchecked.indeterminateboolfalseControls whether the checkbox has a determinable state.defaultCheckedboolfalseThe initial value for checked. Defaults to false.valuestring"on"The value of the checkbox.autofocusboolfalseGet focus by default.disabledboolfalsePrevents the user from interacting with the control. Defaults to false.formstringnullAssociates the element with a form in the document whose id is this value.namestring""Specify the name of the control for purposes of form submission.requiredboolfalseIndicates that the checkbox is invalid unless checked.readonlyboolreadonlyIndicates that the checkbox is not interactive but its value should still be submitted with the form.EventsSection titled EventsEvent NameDetail TypeBubblesComposedCancellableDispatch BehaviorchangenonetruetruefalseFired when the checkbox’s value is committed by the user.inputnonetruetruefalseFired when the checkbox’s value changes.AnatomySection titled AnatomyShow slotsDOM StructureSection titled DOM%20Structure<oui-checkbox> <label part="label"> <slot name="label"></slot> </label> <div part="indicator"> <slot name="indicator"></slot> </div> </oui-checkbox>SlotsSection titled SlotsSlot NameDescriptionFallback ContentlabelAdd custom markup for the control’s labelEmptyindicatorContent to indicate the checkbox is in a checked or indeterminate stateElement with checked and indeterminate indicatorsCSS PartsSection titled CSS%20PartsSlot NameDescriptionlabelThe control’s labelindicatorIndicates the checkbox is in a checked or indeterminate stateBehaviorSection titled BehaviorAccessibilitySection titled AccessibilityStates and InteractionsSection titled States%20and%20InteractionsState GroupStatesInitial StateDescriptionInteraction/Transitioncheckedtrue/falsefalseWhen true, associates the control with the parent form data and displays the control with a checked appearance if not also indeterminate.User click. Controlled programmatically.indeterminatetrue/falsefalseWhen true, displays the control with an indeterminate appearance.No interaction. Controlled programmatically.disabledtrue/falsefalseWhen true, disables the control, preventing user interaction and displaying the control with a disabled appearance.No interaction. Controlled programmatically.readonlytrue/falsefalseWhen true, the control’s checked value cannot be changed by user interaction.No interaction. Controlled programmatically.KeyboardSection titled KeyboardKeyboard users can operate the <checkbox> as follows:<checkbox> is eligible for document focus.<checkbox> is eligible for autofocus when the autofocus attribute is present on the host.<checkbox> can be the target of click events (when not disabled) either through mouse click, user tap, or keyboard space key press.Form inputSection titled Form%20inputControl is eligible for all native from capabilities including:Form submissionForm validationForm state restorationUse with Assistive TechnologySection titled Use%20with%20Assistive%20TechnologyImplements the checkbox role per the HTML AAM spec.'
