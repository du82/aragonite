title = "Home | Open UI"
full_description = "Open UISection titled Open%20UIThe purpose of the Open UI, a W3C Community Group, is to allow web developers to style and extend built-in web UI components and controls, such as <select> dropdowns, checkboxes, radio buttons, and date/color pickers.To do that, we’ll need to fully specify the component parts, states, and behaviors of the built-in controls, as well as necessary accessibility requirements, and provide test suites to ensure compatibility. We’ll also implement polyfills for our extensible web UI controls.Today, component frameworks and design systems reinvent common web UI controls to give designers full control over their appearance and behavior. We hope to make it unnecessary to reinvent built-in UI controls, but for those who choose to do so, we expect that these design systems will benefit from Open UI’s specifications and test suites.Long term, we hope that Open UI will establish a standard process for developing high-quality UI controls suitable for addition to the web platform.For complete outline of goals and process view our full charter.ContributeSection titled ContributeOpen UI wouldn’t be possible without the support of our awesome community! Get involved on Discord and Github."
