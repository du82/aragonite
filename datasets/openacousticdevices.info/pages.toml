["https://www.openacousticdevices.info/audiomoth"]
title = "AudioMoth | Open Acoustic Devices"
full_description = "ProductsHow to BuyGetting StartedDesktop AppsMobile AppsResourcesAudio QualityaudiomothAudioMoth | HydroMoth | AudioMoth Dev | MicroMoth | USB Microphone | Cases | Accessories AudioMoth AudioMoth is a low-cost, full-spectrum acoustic logger, based on the Gecko processor range from Silicon Labs. Just like its namesake the moth, AudioMoth can listen at audible frequencies, well into ultrasonic frequencies. It is capable of recording uncompressed audio to microSD card at rates from 8,000 to 384,000 samples per second and can be converted into a full-spectrum USB microphone. ​ EFM32 Gecko processor Capable of recording at sample rates up to 384kHz Records uncompressed WAV files to microSD card Can be converted into a full-spectrum USB microphone Powered by 3 x AA batteries Analog MEMS microphone Analog pre-amplifier with adjustable gain Measures just 58 x 48 x 15 mm Configurable USB interface Onboard real-time clock keeps track of time in UTC Exposed header for 3.5mm jack mic from version 1.2.0 onwards ​ Click Getting Started for help setting up a new AudioMoth. ​ A manual containing all AudioMoth information for offline use is available here.HydroMothHydroMoth HydroMoth is a variant of the standard AudioMoth specifically designed to be deployed in the underwater case. Re-positioned LEDs for improved visibility in the underwater case Improved 32.768 kHz MEMS oscillator to reduce clock drift In-built magnetic reed switch, which enables recordings to be started and stopped in wet conditions without opening the case. Compatible with all AudioMoth software An application note containing examples of HydroMoth deployments is available here.AudioMoth Dev AudioMoth Dev is a variant of the standard AudioMoth 1.2.0 designed as a development board for skilled users to integrate into other boards and products. ​ Power socket (JST-PH) supporting 3.7 - 6V batteries All controls, indicators and IO ports broken out to 5 JST-PH style headers 3.5 mm jack socket for external electret condenser microphones Compatible with all AudioMoth software The AudioMoth Dev datasheet is available here.audiomothdevMicroMoth ​ MicroMoth is a micro-size variant of the standard AudioMoth 1.1.0 open-source design, while maintaining full compatibility with all versions of the existing firmware. ​ Power socket (JST-PH) supporting 3.7 - 6V batteries Measures just 32 x 24 mm Weighs just 5g (excluding battery) Compatible with all AudioMoth software The MicroMoth datasheet is available here.umothUSB MicrophoneAudioMoth USB Microphone ​ AudioMoth USB Microphone is a variant of the standard AudioMoth 1.2.0 design which removes many of the components which aren't needed when an AudioMoth is being used as a USB microphone. It's designed to specifically run the AudioMoth USB Firmware and uses an identical audio front-end to the AudioMoth 1.2.0 and AudioMoth Dev variants. ​ 3.5 mm jack socket for external electret condenser microphones Supported by Windows, Mac, and Linux (including Raspberry Pi) Measures just 40 x 35 mm Compatible with the AudioMoth USB Microphone firmware and the AudioMoth Live App ​ An application note describing the use of the AudioMoth USB Microphone is available here.How to buyCasesIPX7 Waterproof Case The AudioMoth IPX7 Waterproof Case is designed specifically for AudioMoth (without the 3.5mm socket). It can also be used with HydroMoth. The case is made from injection-moulded polycarbonate and comes with an adjustable velcro strap, which makes securing AudioMoth simple and easy. The case is compact and resilient and will house AudioMoth for extended periods of time in a wide variety of terrestrial environments. ​ Injection-moulded polycarbonate protective case Sealed using an easy-to-use clasp and compression o-ring Rain hood designed to prevent water pooling Opening protected by a waterproof GAW334 acoustic vent Comes with a removable adjustable velcro strap Available in green ​ An application note describing the IPX7 Waterproof Case is available here.Underwater Case The AudioMoth Underwater Case is designed specifically for HydroMoth. It can also be used with AudioMoth (without the 3.5mm socket). While all versions of AudioMoth will fit inside the case, we recommend version 1.2.0 to minimise self-noise in recordings. The case is made from injection-moulded polycarbonate and comes with an adjustable velcro strap, which makes securing AudioMoth simple and easy. The case is compact and resilient and will house AudioMoth for extended periods of time at depths of 30-60m.​ ​ Injection-moulded polycarbonate protective case Sealed using an easy-to-use clasp and compression o-ring Submersible underwater case Tested to a depth of 30m for 2 months Comes with a removable adjustable velcro strap Available in frosted transparent ​ An application note describing the use of the Underwater Case is available here.AudioMoth USB Microphone Case The AudioMoth USB Microphone Case is designed specifically for AudioMoth USB Microphone. The case is made from injection-moulded polycarbonate with an accessible polycarbonate switch, protecting the device during hand-held applications. ​ Injection-moulded polycarbonate protective case Opening protected by a splashproof GAW112 acoustic vent Available in green and blue ​​ An application note describing the use of the AudioMoth USB Microphone Case is available here. AudioMoth Dev Case The AudioMoth Dev Case is a waterproof injection moulded enclosure for AudioMoth Dev that supports full hardware configuration flexibility, with integrated mounts and slots that enable the use of external microphones, GPS, large batteries and custom auxiliary boards. ​ Injection-moulded polycarbonate protective case Sealed using two easy-to-use clasps and compression o-ring Rain hood designed to prevent water pooling Opening protected by a waterproof GAW334 acoustic vent Comes with two removable adjustable velcro straps. Comes with D-cell battery holder and connecting cable Slot available for the AudioMoth GPS Board Slot available for custom 26 x 24 mm auxiliary board M16 cable gland opening with installed cap ​ ​ An application note describing the AudioMoth Dev Case is available here.AccessoriesAudioMoth GPS Board The AudioMoth GPS Board is a hardware module that extends AudioMoth with a connected GPS module and magnetic switch. The AudioMoth GPS Board comes in two variants, using different GPS modules: the PA1616S module that uses GPS satellites only, and the PA1616D module that uses both GPS and GLONASS satellites. ​ Connects to AudioMoth Dev using the GPIO and power JST sockets Can also be soldered to standard AudioMoth (version 1.1.0 onwards) Automatically supported by the standard AudioMoth firmware Also compatible with the AudioMoth-GPS-Sync firmware ​ An application note describing the use of the AudioMoth GPS Board with the standard firmware is available here. An application note describing the use of the AudioMoth GPS Board for synchronised recordings is available here.AudioMoth GPS Hat The AudioMoth GPS Hat is a variant of the AudioMoth GPS Board. It has the same electronic design but is in a different form factor. ​ Soldered to AudioMoth (version 1.1.0 and 1.2.0) using the exposed GPIO pads Automatically supported by the standard AudioMoth firmware Also compatible with the AudioMoth-GPS-Sync firmware ​ See the AudioMoth GPS Board application notes above for more details. ​Subscribe Stay informed about future updates and upcoming AudioMoth group purchases. SubmitPrivacy Policy"
