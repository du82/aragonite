["https://www.openacousticdevices.info/usb-microphone"]
title = "Alternative Firmware | openacousticdevices"
description = "AudioMoth USB Microphone firmware and supporting software"
full_description = "AudioMoth USB MicrophoneAudioMoth GPS SyncAudioMoth LabsAudioMoth USB MicrophoneAudioMoth GPS SyncAudioMoth Filter PlaygroundAudioMoth USB MicrophoneAudioMoth USB Microphone turns any AudioMoth device into a USB microphone. This allows you to plug your AudioMoth into a computer or Raspberry Pi and record audio at sample rates up to 384 kHz. The firmware provides all the same filter options as the standard AudioMoth firmware and supports external microphones if using AudioMoth 1.2.0 or AudioMoth Dev. To use the firmware, select it from the Firmware menu within the AudioMoth Flash App. You can also download the binary directly here. You can revert to the standard AudioMoth firmware at any time by selecting AudioMoth Firmware Basic from the Firmware menu. The microphone is configured using the associated AudioMoth USB Microphone App which can be downloaded below. ​Current version: 1.2.4macOSWindows64-bit LinuxAdditional Linux installation stepsThe firmware operates in a similar way to the standard AudioMoth firmware: ​ USB/OFF: When the switch is set to USB/OFF the sample rates, gain and filter options can be set through the AudioMoth USB Microphone App above. The green LED will light when USB is connected. ​ DEFAULT: When the switch is set to DEFAULT the device will enumerate as a USB microphone implementing the set sample rate and gain. The green LED will flash at a rate determined by the sample rate (identical to that of the standard AudioMoth firmware). ​ CUSTOM: When the switch is set to CUSTOM the device will again enumerate as a USB microphone implementing the sample rate and gain settings as above, and also the requested filter and advanced settings. The red LED will flash at a rate determined by the sample rate (identical to that of the standard AudioMoth firmware). You can switch between DEFAULT and CUSTOM whilst recording to see the effect of these settings. ​ The AudioMoth will run on power from the USB connector and does not need to have batteries installed. ​ For more information see the application note here."
year_published = 2025
