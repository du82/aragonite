["https://www.openacousticdevices.info/application-notes"]
title = "Application Notes | openacousticdevices"
full_description = "Application Notes2025An Injection Moulded Case for AudioMoth Dev First published: 22/01/2025 ​ The AudioMoth Dev Case is a waterproof injection moulded enclosure for AudioMoth Dev that supports full hardware configuration flexibility, with integrated mounts and slots that enable the use of external microphones, GPS, large batteries and custom auxiliary boards. ​​​2024New Support for GPS Synchronisation in the Standard Firmware First published: 19/11/2024 ​ Previous versions of the AudioMoth standard firmware supported using GPS modules to set the internal clock time and to geolocate recordings. New configuration features allow greater control of when GPS fixes are acquired, and a new tool automates the processing of recordings to generate WAV files that are synchronised to GPS time. ​ Measuring the Accuracy of AudioMoth GPS Synchronisation First published: 27/08/2024 ​ The AudioMoth-GPS-Sync firmware uses the pulse-per-second (PPS) output of a GPS module to generate recordings that are synchronised to GPS time. This application note describes experiments feeding the same 1kHz sine wave from a signal generator to four GPS-synchronised AudioMoth demonstrating synchronisation to better than 1us --- much less than the interval between the samples and far exceeding that which is typically necessary for sound source localisation. ​ Creating an AudioMoth Play Desktop App First published: 06/08/2024 ​ AudioMoth Play is a web app that allows users to view, listen to, and export clips from existing AudioMoth recordings. Google Chrome allows users to create desktop apps which run a local version of a website or web app. This can be done with AudioMoth Play to produce a progressive web app that can be run in the field without an internet connection. ​ Configuring the AudioMoth USB Microphone from the Command Line First published: 03/06/2024 ​ Version 1.3.0 of the AudioMoth USB Microphone firmware supports an additional USB HID interface that allows the microphone to be configured from the command line whilst acting as a USB microphone. ​​2023Using the AudioMoth Live App with the AudioMoth USB Microphone First published: 26/06/2023 ​ The AudioMoth Live App is a desktop/laptop app which takes audio from any USB microphone and displays a live scrolling waveform and spectrogram, with options to make continuous recordings, monitor the audio input, or apply a heterodyne bat detector to the input. ​Using AudioMoth GPS Sync to Make Synchronised Recordings First published: 09/01/2023 Audiomoth GPS Sync allows AudioMoth to generate synchronised WAV files that are aligned with GPS time. ​2022Using HydroMoth to Make Underwater Recordings First published: 25/06/2022 HydroMoth is a variant of the standard AudioMoth designed specifically for making underwater recordings with the AudioMoth underwater case.Using AudioMoth with Filtered and Triggered Recordings First published: 11/05/2022 ​ The most recent versions of the AudioMoth firmware (version 1.8.0) and configuration app (version 1.7.0) introduce two new functionalities: the ability to apply low-pass, band-pass or high-pass filters on the device, and the ability to reduce recorded file size by applying an amplitude threshold.Using the AudioMoth USB Microphone Firmware and Hardware First published: 25/04/2022 ​ The new AudioMoth USB Microphone firmware (AudioMoth-USB-Microphone) allows all existing AudioMoth hardware versions to be used as configurable USB microphones with a sample rate of up to 384kHz.Using the AudioMoth GPS Board and Hat First published: 01/02/2022 ​ From firmware version 1.7.0 all AudioMoth devices greater than 1.0.0, and all MicroMoth and AudioMoth Dev devices, are compatible with external GPS boards which can synchronise acoustic events across devices. ​​2021AudioMoth Triggered T.WAV File Format First published: 04/01/2021 ​ Version 1.4.0 of the AudioMoth firmware introduced a file format for triggered recordings that allows silent periods between periods of audio content to be en-coded within a standard WAV file. ​​2020Acoustic Configuration using AudioMoth Chime First published: 28/11/2020 ​ AudioMoth is capable of receiving acoustically encoded data via its microphone. This document describes a robust protocol for this data transfer, called AudioMoth Chime, that is included in the standard AudioMoth firmware from version 1.5.0 onwards Using AudioMoth with External Electret Condenser Microphones First published: 17/11/2020 ​ From hardware version 1.2.0 using firmware version 1.5.0 on-wards, AudioMoth is compatible with external electret condenser mono microphones, commonly known as plug-in powered (PIP) microphones. AudioMoth Temperature Measurement First published: 06/06/2020 ​ The AudioMoth micro-controller contains a factory-calibrated temperature sensor. This sensor has not been used in previous versions of the AudioMoth firmware. However, version 1.4.0 adds a temperature measurement at the start of each recording with the results written to the comments section of the WAV file header.An Injection Moulded Case for AudioMoth First published: 21/05/2020 ​ While lightweight ziplock bags can be used to deploy AudioMoth for short periods of time in mild conditions there is a clear need for a more robust solution for long-term deployments. To address this need we have developed a waterproof injection moulded case specifically designed for AudioMoth."
