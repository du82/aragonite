["https://www.openacousticdevices.info/press"]
title = "Press | openacousticdevices"
full_description = "PressIf you're a journalist interested in producing a story on AudioMoth or any Open Acoustic Devices projects, we're happy to make time for a discussion. Email us at theteam@openacousticdevices.infoAudioMoth in the News2023BBC - Our Changing Planet ​ An episode of the BBC documentary series featuring HydroMoth being used to monitor reefs.BBC - Supersenses ​ An episode of the BBC Radio 4 podcast about how conservationists use sound to protect animal habitats. Evelyn Piña Covarrubias is interviewed about our use of AudioMoth in Belize.2021Science - Ecology in the age of automation ​ AAAS Science article about how biodiversity sampling is being driven by small, low-power computing devices; advances in wireless communications; and an explosion in automated data-recognition algorithms in the field of machine learning. BBC iPlayer - Highlands Rewilding ​ BBC Countryfile episode showing AudioMoth being used to as part of the Natural Capital Laboratory in Scotland.The Economist - All kinds of new technology are being used to monitor the natural world ​ Article on how new technology, such as AudioMoth, are being used to help monitoring and protect biodiversity. Wall Street Journal - Better data, cheaper tech promise to unlock nature's secrets ​ Article by Jackie Snow on how conservationists hope newly launched open-source tools will lend more insight into endangered species and the effects of climate change.Journal of Open HW - Open hardware provides a better chance for scientific reproducibility ​ Article by Andrew Hill and Alasdair Davies on how open hardware provides a better chance for reuse, data reproducibility and access.2020BBC iPlayer - Inside the Bat Cave ​ BBC documentary showing AudioMoth being used to discover the secret world of one of the most endangered and least understood animals on earth – bats. The Guardian - New sensor offers a window into the secret lives of Britain's rarest bats ​ Article by Phoebe Weston on how AudioMoth was used to identify 1.7 million bat calls. 2019BBC - Endangered bats: The manicure helping to save a species ​ Article by Helen Briggs with picture showing AudioMoth PressWightLink - Wightlink helps to plot the journey of one of the Isle of Wight’s most special seasonal visitors ​ Wight Link press release by Karen Woods where Adrain Bicker describes using AudioMoth to monitor bat migrationHackerfarm - Tech 4 Good : AudioMoth ​ Article in the Tech 4 Good series where Hackerfarm reviews and discusses technology designed for humanitarian, development, or environmental applicationsSilicon Labs - Open Acoustic Devices takes low power to new heights for wildlife conservation ​ Blog by Lance Looper describing how the Silicon Labs processor lowers the power for acoustic monitoring2018Chinadialogue - Five technologies to save wildlife from traffickers ​ Article by Catherine Early introducing technology built in collaborations between conservationists and tech developers.RSEC blog - Optimization of sensor deployment for acoustic detection and localization in terrestrial environments ​ Article and video introducing our recent paper on sensor optimisationMedium Article - Acoustic monitoring made affordable with AudioMoth ​ Article by Holly Baines discussing how AudioMoth is manufactured and supported at a low costSparkfun Blog - Scaling Open-Source Conservation Technology ​ Article by Megan Arnold describing how AudioMoth has been scaled to enable global conservation projectsMongabay Latam Article - Acoustic monitoring: a new system to fight against hunting and illegal logging ​ Article by Yvette Sierra Praeli describing how acoustic monitoring can be used to prevent poachingMongabay Article - ‘AudioMoth’ device aims to deliver low-cost, power-efficient monitoring of remote landscapes ​ Article by Mike Gaworecki describing the Methods in Ecology and Evolution publication2017WWF Conservation Technology - Acoustic Monitoring for Conservation and Ecological research ​ PDF report by WWF describing the guidelines of using acoustic monitoring, featuring a case study using AudioMoth BES Press Release - Listening in: Acoustic monitoring devices detect illegal hunting and logging ​ Press release by Sabrina Weiss describing Evelyn Piña Covarrubia's presentation at the ‘Ecology Across Borders’ conference in GhentOxford Sparks Podcast - Where have all the cicadas gone? ​ Podcast asking Prof Alex Rogers, Peter Prince and Andrew Hill: Where have all the cicadas gone?New Scientist Article - Hanging on: In search of the bat that returned from the dead ​ Article by Ollie Wearn using AudioMoth to monitor the Cuban greater funnel-eared batMedium Article - Listening to the mountain: Using audio recorders to monitor forest birds in Kenya ​ Article by Ciira Maina using early prototypes of AudioMoth to monitor the forest birds in KenyaNew Scientist Article - Drones listen in on bats to reveal their in-flight secrets ​ Article by Chris Baraniuk using AudioMoth to monitor bats by droneJournal of Animal Ecology Press - New technologies for listening to bats ​ Article by Simon Hoggart using AudioMoth to monitor bats in Madeira BBC - The search for Britain's only native species of cicada ​ Article by Chris Baraniuk introducing an early version of AudioMoth to monitor the New Forest cicada"
