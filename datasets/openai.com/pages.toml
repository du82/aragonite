-4o$5.00 / 1M input tokens$2.50 / 1M cached input tokens$20.00 / 1M output tokensGPT-4o$5.00 / 1M input tokens$2.50 / 1M cached input tokens$20.00 / 1M output tokensGPT-4o mini$0.60 / 1M input tokens$0.30 / 1M cached input tokens$2.40 / 1M output tokensGPT-4o mini$0.60 / 1M input tokens$0.30 / 1M cached input tokens$2.40 / 1M output tokensAudioAudioGPT-4o$40.00 / 1M input tokens$2.50 / 1M cached input tokens$80.00 / 1M output tokensGPT-4o$40.00 / 1M input tokens$2.50 / 1M cached input tokens$80.00 / 1M output tokensGPT-4o mini$10.00 / 1M input tokens$0.30 / 1M cached input tokens$20.00 / 1M output tokensGPT-4o mini$10.00 / 1M input tokens$0.30 / 1M cached input tokens$20.00 / 1M output tokensAssistants APIBuild assistant-like experiences with our tools.PriceAssistants API is not priced separately. Tokens are billed at the chosen language model's input and output rates. The API supports GPT-4o and GPT-4o mini.Chat Completions APIBuild text-based conversational experiences.PriceChat Completions API is not priced separately. Tokens are billed at the chosen language model's input and output rates. The API supports GPT-4o, GPT-4o mini, o1, and o1-mini.Explore detailed pricing(opens in a new window)FAQWhich model should I use?We recommend that developers use GPT‑4o or GPT‑4o mini for everyday tasks. GPT‑4o generally performs better on a wide range of tasks, while GPT‑4o mini is fast and inexpensive for simpler tasks. Our o1 reasoning models are ideal for complex, multi-step tasks and STEM use cases that require deep thinking about tough problems. We recommend experimenting with all of these models in the Playground⁠(opens in a new window) to explore which models provide the best price performance trade-off for your usage.Do you offer an enterprise package or SLAs?We offer different tiers of access to our enterprise customers that include SLAs, lower latency, and more. Please contact our sales team⁠ to learn more.Will I be charged for API usage in the Playground? Yes, we treat Playground usage the same as regular API usage. You will be billed at the per-token input and output prices mentioned above.How will I know how many tokens I’ve used each month?A token is a mathematical representation of natural language. Log in to your account to view your usage tracking dashboard⁠(opens in a new window). This dashboard will show you how many tokens you’ve used during the current and past billing cycles.How can I manage my spending on the API platform?You can set a monthly budget in your billing settings⁠⁠(opens in a new window), after which we’ll stop serving your requests. There may be a delay in enforcing the limit, and you are responsible for any overage incurred. You can also configure an email notification threshold to receive an email alert once you cross that threshold each month. We recommend checking your usage tracking dashboard⁠(opens in a new window) regularly to monitor your spend.For customers managing work with Projects, you can set and manage billing restrictions per project⁠(opens in a new window)⁠ in the Dashboard.Is access to the API included in ChatGPT Plus, Team, Enterprise or Edu?No, OpenAI APIs are billed separately from ChatGPT Plus, Team, Enterprise and Edu. ChatGPT subscription pricing can be found at openai.com/chatgpt/pricing/⁠. How is pricing calculated for images?Images are converted to text tokens and processed at the same text token prices.Vision pricing calculatorSet modelgpt-4ogpt-4o-minio1-2024-12-17gpt-4o-2024-05-13gpt-4.5-preview-2025-02-27Set widthpxbySet heightpx=$0.000638Low resolution=$0.000638Price per 1M tokens (fixed)$2.50512 x 512 tiles1 x 1Total tiles1Base tokens85Tile tokens170 x 1 = 170Total tokens255Total price$0.000638Start creating with OpenAI’s powerful models.Get startedContact sales"
