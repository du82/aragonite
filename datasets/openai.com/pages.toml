["https://openai.com/brand"]
title = "OpenAI Design | OpenAI"
description = "Language and assets for using the OpenAI brand in your marketing and communications."
full_description = '''Design GuidelinesWelcome to OpenAI's Brand Guidelines. This resource provides clear guidance on our branding—including logo usage, language, and the assets you need for your marketing and communications efforts.Contact IntroductionThe "OpenAI" name, the OpenAI logo, the "ChatGPT" and “GPT” brands, and other OpenAI trademarks, are property of OpenAI. These guidelines are intended to help our partners, resellers, customers, developers, consultants, publishers, and any other third parties understand how to use and display our trademarks and copyrighted work in their own assets and materials.LogoWordmarkOur wordmark is the most direct distillation of our visual philosophy. It is crafted with OpenAI Sans, with the 'O' formed as a perfect circle.While it can freely scale in size, the balance and proportions are fixed to give consistency across our range of products, services and departments. It can also appear in different forms depending on context and degree of recognition our branding has at a given time or geographic location.Our primary wordmark requires prescribed clear space and should NOT be used with the Blossom.Dos and Don’ts: WordmarkDON'T stretch or alter wordmark in any wayDON'T use the Blossom as the primary brandingDON'T crop wordmarksDON'T use wordmarks as masksDON'T use any unapproved variationsDON'T use any effects or texturesBlossomThe Blossom logo is more than just a visual symbol; it represents the core philosophy that guides our approach to design and innovation. At its heart, the logo captures the dynamic intersection between humanity and technology—two forces that shape our world and inspire our work. The design embodies the fluidity and warmth of human-centered thinking through the use of circles, while right angles introduce the precision and structure that technology demands.Use the prescribed spacing to let the Blossom breathe.By using our logos, you agree to our Marks usage terms.Download logosDos and Don’ts: BlossomDON'T add any colors to the BlossomDON'T use the Blossom as the primary brandingDON'T add any unauthorized elementsDON'T use the Blossom over a busy imageDO use the established spacing rulesDO use the Blossom with lots of open spaceHow to use our LogosDo:Use the logo only when it directly relates to OpenAI services.Follow OpenAI’s style guides and usage terms.Use the logo exactly as provided and acknowledge that it belongs to OpenAI.Don’t:Use the logo without permission or outside OpenAI’s terms.Misrepresent your relationship with OpenAI, imply endorsement, or confuse users about sponsorship.Use the logo more prominently than your own or in unrelated contexts.Place the logo on tangible merchandise, promotional items, or modify it in any way.Incorporate the logo into your own branding, trademark, or design a similar logo.GalleryBrand partnershipsWhen pairing the wordmarks with partner logos, maintain balanced spacing and clear hierarchy. Avoid placing logos too close to one another, ensuring sufficient space to preserve clarity and visual impact. Ensure each logo is displayed at an appropriate size, uses its approved color format, and is not distorted or altered in any way. All co-branded materials must undergo an approval process by both brands to guarantee consistency and adherence to branding standards.Dos and Don’ts: Brand partnershipsDON'T add any colors to the partnership lockup DON'T use the wordmark as very different sizesDON'T use the blossom with the partnership lock-upDON'T use the partnership lockup over a busy imageDO use the established spacing rulesDO strive to have the wordmarks be the same height DownloadTypographyOpenAI Sans blends geometric precision and functionality with a rounded, approachable character. Subtle modifications, such as smoother curves and bespoke letterforms, give it a friendly and circular appearance.The typeface is available in five core weights—Light, Regular, Medium, Semibold and Bold—each paired with a corresponding italic style. OpenAI Sans also features unique alignment and glyph refinements tailored for clarity and versatility in both digital and print applications. Its OpenType features, such as ligatures, tabular figures, and case-sensitive punctuation, provide added functionality for professional use.Designed to represent OpenAI’s brand ethos, the font strikes a balance between technological precision and humanistic warmth, embodying a future-forward and inclusive tone. The design choices reflect its role in supporting OpenAI’s mission of benefiting all of humanity.Get access to OpenAI Sans through our full design guidelines⁠(opens in a new window)Dos and Don'ts: LanguageGPTsCustom versions of ChatGPT can be created for specific purposes with instructions, expanded knowledge, and custom actions.API DevelopersActive OpenAI developers may truthfully identify the OpenAI technology they use. ModelsUse the proper model names when referring to specific models, and date-based versions when referring to OpenAI models.Non-partnershipsOpenAI has official partnerships and specific language regarding them, as well as non-partnership language guidance.Content attributionNo attribution is required when publishing text or images generated by an OpenAI model. However, we encourage use of the following language:ContactFor legal inquiries, please contact legal@openai.com⁠⁠.For everything else, including permission requests for the use of our logos, questions about these guidelines, or communications that go beyond the cases outlined above, please contact partnercomms@openai.com⁠⁠.Press releasesWhen mentioning our company in press materials, please identify OpenAl as an Al research and deployment company. OpenAl's mission is to ensure that artificial general intelligence—AI systems that are generally smarter than humans—benefits all of humanity.If announcements, blogs, or other communications go beyond the cases outlined above, or if you have questions about our guidelines, reach out to OpenAI's Partner Communications team at partnercomms@openai.com⁠⁠.Usage termsThe term "Marks" includes anything we use to identify our goods or services, including our names, logos, icons, and design elements. By using OpenAl's Marks, you agree that we own them and that any goodwill generated by your use benefits us.Permission to use our Marks is limited in the following ways:Only use our Marks if they adhere to these brand guidelines.﻿﻿The permission we grant is non-exclusive (we can give it to others) and non-transferrable (you cannot give it to others).﻿﻿Do not feature our Marks more prominently than your own company's name or marks.﻿﻿We may update the guide, and changes must be made in accordance with our updates within a reasonable time.﻿﻿We can review the use of our Marks and require changes if needed.﻿﻿We may terminate permission to use our Marks at any time, and usage must stop promptly.Please ensure your app follows all OpenAl usage policies. If your project leverages our APIs or models (e.g. GPT‑4 or DALL·E 3), you may choose to reference a specific model but be precise and accurate.We do not permit model names in app titles because there is concern that it confuses end users. It also triggers our enforcement mechanisms. GPTs are custom versions of ChatGPT, so it's important not to simply reference GPT in your app descriptions (we do not permit our GPT brand to be used in app, product, developer or company names).'''
