["https://openai.com/index/announcing-the-stargate-project"]
title = "Announcing The Stargate Project | OpenAI"
description = "Announcing The Stargate Project"
full_description = "January 21, 2025CompanyAnnouncing The Stargate ProjectShareThe Stargate Project is a new company which intends to invest $500 billion over the next four years building new AI infrastructure for OpenAI in the United States. We will begin deploying $100 billion immediately. This infrastructure will secure American leadership in AI, create hundreds of thousands of American jobs, and generate massive economic benefit for the entire world. This project will not only support the re-industrialization of the United States but also provide a strategic capability to protect the national security of America and its allies.The initial equity funders in Stargate are SoftBank, OpenAI, Oracle, and MGX. SoftBank and OpenAI are the lead partners for Stargate, with SoftBank having financial responsibility and OpenAI having operational responsibility. Masayoshi Son will be the chairman.Arm, Microsoft, NVIDIA, Oracle, and OpenAI are the key initial technology partners. The buildout is currently underway, starting in Texas, and we are evaluating potential sites across the country for more campuses as we finalize definitive agreements.As part of Stargate, Oracle, NVIDIA, and OpenAI will closely collaborate to build and operate this computing system. This builds on a deep collaboration between OpenAI and NVIDIA going back to 2016 and a newer partnership between OpenAI and Oracle.This also builds on the existing OpenAI partnership with Microsoft. OpenAI will continue to increase its consumption of Azure as OpenAI continues its work with Microsoft with this additional compute to train leading models and deliver great products and services.All of us look forward to continuing to build and develop AI—and in particular AGI—for the benefit of all of humanity. We believe that this new step is critical on the path, and will enable creative people to figure out how to use AI to elevate humanity.We want to connect with firms across the built data center infrastructure landscape, from power and land to construction to equipment, and everything in between.Update on January 31, 2025: For more details on our plans and priorities, interested potential partners can review our Request for Proposals (RFP)⁠(opens in a new window) focused on land and power, or our Request for Qualification (RFQ)⁠(opens in a new window) for architecture/engineering firms for site design services.PartnershipsGlobal Affairs2025AuthorsOpenAI , SoftBank"
