full_description = '''Rekor Scout® enables automatic license plate and vehicle recognition on most IP, traffic, and security cameras. Leverage advanced vehicle recognition in your parking operations to seamlessly automate access control, accept contactless payments, locate offenders, and increase revenue. Because our license plate and vehicle recognition is easily integrated into existing systems via Rekor CarCheck®, enhanced functionality is available to any parking operation. Fast, contactless payments have never been simpler because customers connect their license plate to their payment method. Quickly allow paying customers to enter and exit your parking facility, while easily refusing non-paying and flagged vehicles. Deep-dive into facility analytics by identifying low and peak volume periods on a daily, weekly, or monthly basis. In addition to recognizing vehicles for access, payment and reporting, we also offer AutoNotice, a connected platform to manage inventory and handle permit & citation issuance. AutoNotice is an all-inclusive solution that enables the simple management of all aspects of parking operations, from a single dashboard. "Rekor's platform is a robust parking, permit and violation management solution that our customers will benefit from when using with SecurePark's mobile enforcement solutions. It is easy to integrate, highly scalable and the licensing supports our SaaS based subscription model, making it affordable for all budgets." With a large inventory of state-of-the-art devices and software platforms that are easy to deploy, Rekor is ready to level up your organization. OpenALPR is a solution suite built by Rekor Systems, Inc. that specializes in license plate and vehicle recognition technology.'''
