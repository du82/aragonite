title = "Law Enforcement Solutions - OpenALPR by Rekor"
description = "By ensuring law enforcement agencies receive actionable real-time intelligence, our suite of LPR solutions allows officers to accelerate investigations."
full_description = "Rekor Scout® enables automatic license plate and vehicle recognition on most IP, traffic, and security cameras. By ensuring law enforcement agencies receive actionable real-time intelligence, our suite of LPR software allows officers to accelerate investigations and close more cases, faster. Because our license plate and vehicle recognition solutions are flexible and affordable, law enforcement agencies are able to save time, resources, and ultimately, lives. Customize local and shared hotlists to receive alerts the moment a vehicle of interest is detected by a deployed camera. Even without a known plate, officers can search for vehicles of interest based on color, make, model and state of origin. By leveraging IP cameras already installed in your jurisdiction, advanced LPR can be deployed quickly and affordably. Don't take it from us, take it from those that are using our solutions every single day to make their communities safer. Before selecting Rekor Edge Max™ camera systems and Scout software, the Mt. Juliet Police Department and IT professionals conducted rigorous testing and an extensive review of the Rekor systems against other leading license plate recognition systems. After testing was completed, the Rekor solutions clearly outperformed competitors. With a large inventory of state-of-the-art devices and software platforms that are easy to deploy, Rekor is ready to level up your agency. OpenALPR is a solution suite built by Rekor Systems, Inc. that specializes in license plate and vehicle recognition technology."
