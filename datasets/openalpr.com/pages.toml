full_description = ".navbar-logo.white-logo { display:none; } .navbar-logo.dark-logo { display:block; } .nav-link { color: #000; } .hamburger-icon { color: #000; } .filled-nav { background: #fff; } .search-icon { filter: invert(1); } @media(max-width:991px) { .nav-menu { background: #fff; } .nav-link { color: #000; } } SolutionsSoftware PlatformsAccess roadway intelligence using our full-featured software platforms.Systems and ServicesCapture roadway data with our AI-driven systems and Traffic Services team.DevelopersUse roadway data through standalone applications, APIs, and SDKs.Rekor Discover®for Urban MobilityCapture comprehensive vehicle and traffic analytics.ApplicationsClass, Count, and Speed →Vehicle Insite →Rekor Command®for Transportation ManagementIdentify effecting events and highlight roadway zones at risk to create safer roads.Rekor Scout®for Public SafetyDetect license plates and vehicles with key characteristics and pinpoint location.Rekor Edge Flex™Capture 6 lanes of high-speed roadway data for short-term traffic studies.Rekor Edge ProAccurately recognize license plates and vehicles up to 75 feet away.Rekor Edge Max™ (CCS)Capture 6 lanes of high-speed roadway data for long-term traffic studies.Rekor Edge Max™ (LPR)Accurately recognize license plates and vehicles up to 300 feet away.Rekor Traffic ServicesWith 30+ years of expertise, our dedicated Traffic Services team combines traditional and AI-driven approaches to deliver precise traffic data collection. Our global reach ensures tailored solutions for clients everywhere.Vehicle Recognition SDKLPR and Vehicle Recognition Code LibraryIntegrate LPR and vehicle recognition into your apps with direct access to our robust APIs.Rekor CarCheck®LPR and Vehicle Recognition APIAnalyze images of vehicles and receive plate number and vehicle variables in JSON format.Rekor AutoNotice™Contactless Compliance ApplicationIdentify vehicles in violation of road regulations and laws to automate notice management.Software PlatformsRekor Discover®for Urban MobilityCapture comprehensive vehicle and traffic analytics.ApplicationsClass, Count, and Speed →Vehicle Insite →Rekor Command®for Transportation ManagementIdentify effecting events and highlight roadway zones at risk to create safer roads.Rekor Scout®for Public SafetyDetect license plates and vehicles with key characteristics and pinpoint location.Systems and ServicesRekor Edge Flex™Capture 6 lanes of high-speed roadway data for short-term traffic studies.Rekor Edge Max™ (CCS)Capture 6 lanes of high-speed roadway data for long-term traffic studies.Rekor Edge ProAccurately recognize license plates and vehicles up to 75 feet away.Rekor Edge Max™ (LPR)Accurately recognize license plates and vehicles up to 300 feet away.Rekor Traffic ServicesOur dedicated Traffic Services team delivers precise traffic data collection.DevelopersVehicle Recognition SDKLPR and Vehicle Recognition Code LibraryIntegrate LPR and vehicle recognition into your apps with direct access to our robust APIs.Rekor CarCheck®LPR and Vehicle Recognition APIAnalyze images of vehicles and receive plate number and vehicle variables in JSON format.Rekor AutoNotice™Contactless Compliance ApplicationIdentify vehicles in violation of road regulations and laws to automate notice management.ResourcesIndustry InsightsExplore thought-provoking articles and listen to engaging podcasts.Customer StoriesSee how our customers are improving their workflows.EventsConnect with Rekor at illuminating in-person and virtual events.Funding AssistanceGet federal funding application assistance from our dedicated team.Building with AWSLearn how Rekor's products and solutions are enhanced by AWS.Technical DocumentationImplement Rekor’s products and services using our detailed docs.Help CenterReceive assistance from Rekor's support team. From troubleshooting to best practices, we're here to help you achieve your desired outcome.Open a ticketCompanyContact UsGet in touch with our team for inquiries about our company and solutions.NewsroomStay up-to-date with the latest news about our vision for the future.About UsLearn what makes Rekor's AI-driven solutions so unique and powerful.PartnershipsJoin the Rekor Partner Network to innovate and grow the industry.CareersExplore exciting opportunities with a disruptive force in artificial intelligence.Security and TrustUnderstand how privacy is respected and personal data is controlled.Rekor’s Vehicle Insite Application Deployed in the Phoenix Metropolitan AreaRekor Systems today announced that its Vehicle Insite application, a part of its Rekor Discover® platform, is being utilized in a 90-site study across the Phoenix metropolitan area.February 26, 2025Press ReleaseInvestor RelationsContact UsLearn how the Mt. Juliet Police Department improves community safetyBefore selecting Rekor Scout®, MJPD and IT professionals conducted rigorous testing and an extensive review of Rekor's ALPR and other leading LPR systems. After testing was completed, Rekor Scout clearly outperformed competitors.OrganizationMt. Juliet, TN Police DepartmentIndustryLaw EnforcementLocationMt. Juliet, TennesseeSolution(s) usedRekor Scout®Rekor Edge Max™ for ALPR Download PDFAboutLocated just outside of Nashville, Tennessee the Mt. Juliet community has seen tremendous growth over the last decade, with over 35,000 residents who now call it home. The Mt. Juliet Police Department (MJPD) has 79 full-time employees and nearly 50 volunteers who are committed to the safety of residents and visitors by providing the best possible service and being community strong.ChallengeAccording to MJPD Captain Tyler Chandler, vehicle burglaries were on the rise across the Nashville region. The major problem was that vehicle theft offenders were fleeing Nashville to suburban Mt. Juliet. Captain Chandler sought to find an ALPR solution to further assist law enforcement with keeping the community safe. The challenge for MJPD was two-fold. Not only was there a need to protect citizens and apprehend criminals but also a need to educate residents about how ALPR technology would benefit the community.SolutionAfter vigorous testing of top ALPR companies across the industry, MJPD selected Rekor to helm the Guardian Shield Program. Guardian Shield is the community’s ALPR program which alerts law enforcement on vehicles associated with a crime and on a hotlist. Alert information is generated from data entered in the National Crime Information Center (NCIC) database. Thirty-seven locations were identified to deploy fixed Rekor Edge Max cameras and Rekor Scout® software. These systems were installed at every entrance and exit for major intersections in the Mt. Juliet community.“Rekor simply performed the best, they had the best alert times, and they picked up through all types of different weather and lighting conditions. The back-end software and their customer service, the sales team - everything was Top Notch and that's when we decided to go with Rekor.” - Capt. Tyler ChandlerAnother factor in the decision to choose Rekor was the department’s desire for a company that would work to ensure their needs were met whether its changing programming or adjusting technology to make it work. Additionally, the Rekor Scout platform is web-based, user-friendly, and does not require IT to install software on different departmental systems.“Everything we're going to now is web-based. That's one of the reasons why we chose Rekor, as it was super easy to log in and use. You show the officers how to log in and where to click around and they immediately get it.” - Capt. Tyler ChandlerResultsMJPD saw immediate and drastic results from implementing Rekor Scout as the driving technology behind their Guardian Shield Program. Because while crime was up across the Nashville region, Mt. Juliet experienced a decrease – up to 48% in some areas. Additionally, with real-time alerting of vehicle detections, officers can prepare for a stop before the encounter, making potentially dangerous situations safer for them and the community.Between April 2020 and August 2021, MJPD received and acted on the following notifications:Primary Alert: 81 Stolen Cars; 41 Stolen Plates; 3 Stolen Trailers; and 23 Wanted Persons.Secondary Alerts: 5 Stolen Cars; 39 Wanted Persons; 44 Drug Involvement; and 32 DL Violations.Capt. Chandler recalled one instance when a murder suspect was passing through the community. The system alerted on the suspect's tag as being a wanted person through the National Database. The suspect had been evading Marshalls with the Tennessee Bureau of Investigations and MJPD was able to apprehend the suspect due to the alert.The department also addressed the need for residents to understand what the Guardian Shield Program is and how it operates. Law enforcement holds ongoing meetings to educate and inform residents about the program’s benefits, in addition to sharing successful alerts on their social media channels to demonstrate the true value of the program and the difference it is making. The community’s response has been tremendously positive.“We really gained support when the community saw what it was doing for them, that we were getting TBI Most Wanted murderers out of the community that vehicle burglaries and stolen vehicles had dropped by nearly half. We've used the system to investigate a lot of crimes and take people who've committed crimes on our citizens into custody and gain restitution and justice for those victims.” - Capt. Tyler ChandlerContinued PartnershipBuilding upon the success of Rekor’s initial ALPR system deployment in 2020, MJPD added 11 cameras at the end of 2021 to bring the total number of Rekor-powered systems to 50. The goal was to cover gaps, capture everything, and make it a more solid form of protection.ConclusionMJPD has set a high standard for thoughtful ALPR program deployment, complete with frequent and transparent communications with their constituents. Rekor is proud to be in partnership with MJPD and shares in its mission to keep officers and the community safe.CASE STUDIESPowered by RekorCentral Texas Regional Mobility Authority (Mobility Authority)Learn how Central Texas toll roads achieved faster incident response timesThe Mobility Authority leverages Rekor Command® to revolutionize traffic management, ensuring faster incident detection, seamless collaboration, and safer, more efficient roadways amidst rapid regional growth and infrastructure expansion.Winchester, VirginiaLearn how Winchester, Virginia enhanced public safety and urban mobilityWhile initially a traffic-focused pilot, Winchester, VA quickly found powerful performance with Rekor Scout®. The technology is used daily to monitor and respond to public safety incidents in real-time.Nevada Highway Patrol (NHP)Learn how the Nevada Highway Patrol is proactively managing trafficNevada Highway Patrol (NHP) selected Rekor Command® because it is fully cloud-based, features live maps, and is accessible to NHP users through their mobile digital computers, tablets, and desktops.Want the future of roadway intelligence delivered directly to your inbox?Newsletter Sign Up* Email addressThank you for subscribing! Stay tuned for all of the latest Rekor news!Oops! Something went wrong while submitting the form.PlatformsRekor Discover® for Urban MobilityClass, Count, and SpeedVehicle InsiteRekor Command® for Transportation ManagementRekor Scout® for Public SafetySYSTEMS & SERVICESRekor Edge Flex™ (Classification)Rekor Edge Max™ (Classification)Rekor Edge Pro (ALPR)Rekor Edge Max™ (ALPR)Rekor Traffic ServicesDevelopersVehicle Recognition SDKRekor CarCheck® ALPR APIRekor AutoNotice™ for Contactless ComplianceResourcesIndustry InsightsCustomer StoriesEventsFunding AssistanceBuilding with AWSTechnical Documentation Help Center CompanyInvestor RelationsNewsroomAbout UsPartnershipsCareersSecurity and TrustContact UsPoliciesPrivacy PolicyEnd User License AgreementTerms of ServiceAccessibility Statement© {year} Rekor Systems, Inc. All Rights Reserved.6721 Columbia Gateway Dr, Suite 400, Columbia, MD 21046 .footer-section { background-color: #181B32; color: #fff; } .footer-section .newsletter_box { background-color: #2B2D42; } .footer-section .newsletter_arrow-icon, .footer-section .footer_logo, .footer-section .font-awesome-brand { display: none; } .footer-section .newsletter_arrow-icon-white, .footer-section .footer_logo-white, .footer-section .font-awesome-brand-white { display: block; } .footer-section .newsletter-input { background-color: #464959; color: #fff; } .footer-section .newsletter-input::placeholder { color: #fff; } .footer-section .footer_terms-divider { background-color: #fff; } .footer-section .social-box { border-color: #fff; } .social-box:hover { background-color: #414563; } .footer-next-page-icon { filter: invert(1); }"
