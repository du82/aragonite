["https://openalpr.com/software/scout"]
title = "Rekor Scout® - OpenALPR by Rekor"
description = "Rekor Scout® enables accurate automatic LPR and vehicle recognition on nearly any IP, traffic, or security camera. Detection results are displayed in-browser."
full_description = '''Rekor Scout® enables automatic license plate and vehicle recognition on most IP, traffic, and security cameras. Recognize vehicle color, make, model, direction of travel, and license/number plate in nearly 70 countries. Even identify the issuing state in the US, Canada, and Mexico! By upgrading existing IP cameras with Scout, you gain access to an accurate vehicle recognition solution without needing to purchase expensive new equipment. Identify vehicles of interest through advanced alerting, searching, and monitoring. Review high quality images and video clips of vehicle detections. Scout allows homeowners to increase safety and receive alerts to thwart criminals and keep their loved ones safe. Additionally, Scout's vehicle recognition allows homeowners to automate common tasks such as garage door opening, turning on/off lights, and locking/unlocking doors. The adoption of business security systems has increased significantly over the past few decades. Scout can take existing, under-powered IP cameras and add advanced license plate and vehicle recognition capabilities to help bolster security and insights. AI-driven ALPR allows officers to accelerate investigations and close more cases, faster. Scout provides highly accurate, flexible, and affordable vehicle recognition to ensure law enforcement agencies receive actionable intelligence that saves time, resources and ultimately lives. You will receive an email. Click on the link to verify your email and activate your account. Login to the dashboard and walk through our “Getting Started” wizard. Select "Rekor Scout®" as your preferred product, then select your plan and enter your billing information to subscribe. Once you have selected your preferred plan and entered your payment information, billing will begin after your initial trial period and be charged monthly or yearly, depending on the plan chosen. Both Basic and Pro plans allow for one camera connection, whereas additional cameras are charged for based on daily usage.'''
