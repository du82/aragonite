["http://www.openalpr.com/software/carcheck"]
title = "Rekor CarCheck® - OpenALPR by Rekor"
description = "CarCheck is an API that analyzes still images of vehicles from over 80 countries and responds with the license plate, as well as vehicle make, model, and color."
full_description = '''Rekor Scout® enables automatic license plate and vehicle recognition on most IP, traffic, and security cameras. Because CarCheck is REST-based, it works with any programming language on any OS. The endpoints are described in the REST API documentation. For maximum flexibility and control, CarCheck can analyze images sent from a local machine, server, or even any web-based URL. When you send vehicle image data to the CarCheck API, we analyze that image and return JSON data describing the license plate and vehicle. Leverage CarCheck's advanced vehicle recognition in your parking operations business to seamlessly automate access control, accept contactless payments, locate late/no-payment offenders, and increase overall revenue. Whether you operate a car wash or an automotive service center, CarCheck's license plate and vehicle recognition allows you to quickly identify and process customers to decrease wait times while also increasing customer satisfaction. Design a custom application using CarCheck and leverage advanced AI and machine learning to solve your business challenges. And because our license plate and vehicle recognition is easily integrated into existing applications via crucial capabilities are available to any software developer. Our sales representatives are standing by to help craft a plan to fit the needs of your business. We currently have clients processing 100+ million recognitions per year and are adept at deploying enterprise-level volume and mixing-and-matching feature sets. Get in touch and we will be more than happy to help. You will receive an email. Click on the link to verify your email and activate your account. Login to the dashboard and walk through our “Getting Started” wizard. Select "Rekor CarCheck®" as your preferred product, then select your plan and enter your billing information to subscribe. You will be automatically charged once you have selected your plan and entered your payment information. Recurring charges will occur every month or year, depending on the plan chosen.'''
