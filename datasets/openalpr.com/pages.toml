epends on accurate Automated License Plate Recognition (ALPR) to lookup vehicles and easily manage their customer database, identify unlimited car wash subscribers, and speed up the car wash queue on high volume days. Without accurate ALPR, there is no affordable alternative to automatically connect business data with customer data. This loss of connection has a direct negative financial impact on their business.PriceOne of the major considerations for evaluating Rekor was price. With a Rekor CarCheck® plan starting at $29 per month and the variety of the additional pricing tiers, Waves Car Wash is able to pay based on how many vehicles and license plates they are reading per month.DecisionSelecting CarCheck was easy. Waves purchased their own IP cameras, placed them in prime locations, and easily integrated CarCheck with their customer database. These decisions have grown unlimited car wash subscribers and increased revenue.“It has been great working with the team at Rekor. The software integration was easy and we are able to utilize a full suite of features.” - Adam Korngold, Owner, Waves Car WashCASE STUDIESPowered by RekorCentral Texas Regional Mobility Authority (Mobility Authority)Learn how Central Texas toll roads achieved faster incident response timesThe Mobility Authority leverages Rekor Command® to revolutionize traffic management, ensuring faster incident detection, seamless collaboration, and safer, more efficient roadways amidst rapid regional growth and infrastructure expansion.Winchester, VirginiaLearn how Winchester, Virginia enhanced public safety and urban mobilityWhile initially a traffic-focused pilot, Winchester, VA quickly found powerful performance with Rekor Scout®. The technology is used daily to monitor and respond to public safety incidents in real-time.Nevada Highway Patrol (NHP)Learn how the Nevada Highway Patrol is proactively managing trafficNevada Highway Patrol (NHP) selected Rekor Command® because it is fully cloud-based, features 