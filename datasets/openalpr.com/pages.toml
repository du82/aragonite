description = "Tire Profiles uses Rekor CarCheck for vehicle data lookup when a vehicle is scanned anywhere in a service facility. Without accurate license plate recognition, there is no way to automatically connect vehicle data with customer data."
full_description = ".navbar-logo.white-logo { display:none; } .navbar-logo.dark-logo { display:block; } .nav-link { color: #000; } .hamburger-icon { color: #000; } .filled-nav { background: #fff; } .search-icon { filter: invert(1); } @media(max-width:991px) { .nav-menu { background: #fff; } .nav-link { color: #000; } } SolutionsSoftware PlatformsAccess roadway intelligence using our full-featured software platforms.Systems and ServicesCapture roadway data with our AI-driven systems and Traffic Services team.DevelopersUse roadway data through standalone applications, APIs, and SDKs.Rekor Discover®for Urban MobilityCapture comprehensive vehicle and traffic analytics.ApplicationsClass, Count, and Speed →Vehicle Insite →Rekor Command®for Transportation ManagementIdentify effecting events and highlight roadway zones at risk to create safer roads.Rekor Scout®for Public SafetyDetect license plates and vehicles with key characteristics and pinpoint location.Rekor Edge Flex™Capture 6 lanes of high-speed roadway data for short-term traffic studies.Rekor Edge ProAccurately recognize license plates and vehicles up to 75 feet away.Rekor Edge Max™ (CCS)Capture 6 lanes of high-speed roadway data for long-term traffic studies.Rekor Edge Max™ (LPR)Accurately recognize license plates and vehicles up to 300 feet away.Rekor Traffic ServicesWith 30+ years of expertise, our dedicated Traffic Services team combines traditional and AI-driven approaches to deliver precise traffic data collection. Our global reach ensures tailored solutions for clients everywhere.Vehicle Recognition SDKLPR and Vehicle Recognition Code LibraryIntegrate LPR and vehicle recognition into your apps with direct access to our robust APIs.Rekor CarCheck®LPR and Vehicle Recognition APIAnalyze images of vehicles and receive plate number and vehicle variables in JSON format.Rekor AutoNotice™Contactless Compliance ApplicationIdentify vehicles in violation of road regulations and laws to automate notice management.Software PlatformsRekor Discover®for Urban MobilityCapture comprehensive vehicle and traffic analytics.ApplicationsClass, Count, and Speed →Vehicle Insite →Rekor Command®for Transportation ManagementIdentify effecting events and highlight roadway zones at risk to create safer roads.Rekor Scout®for Public SafetyDetect license plates and vehicles with key characteristics and pinpoint location.Systems and ServicesRekor Edge Flex™Capture 6 lanes of high-speed roadway data for short-term traffic studies.Rekor Edge Max™ (CCS)Capture 6 lanes of high-speed roadway data for long-term traffic studies.Rekor Edge ProAccurately recognize license plates and vehicles up to 75 feet away.Rekor Edge Max™ (LPR)Accurately recognize license plates and vehicles up to 300 feet away.Rekor Traffic ServicesOur dedicated Traffic Services team delivers precise traffic data collection.DevelopersVehicle Recognition SDKLPR and Vehicle Recognition Code LibraryIntegrate LPR and vehicle recognition into your apps with direct access to our robust APIs.Rekor CarCheck®LPR and Vehicle Recognition APIAnalyze images of vehicles and receive plate number and vehicle variables in JSON format.Rekor AutoNotice™Contactless Compliance ApplicationIdentify vehicles in violation of road regulations and laws to automate notice management.ResourcesIndustry InsightsExplore thought-provoking articles and listen to engaging podcasts.Customer StoriesSee how our customers are improving their workflows.EventsConnect with Rekor at illuminating in-person and virtual events.Funding AssistanceGet federal funding application assistance from our dedicated team.Building with AWSLearn how Rekor's products and solutions are enhanced by AWS.Technical DocumentationImplement Rekor’s products and services using our detailed docs.Help CenterReceive assistance from Rekor's support team. From troubleshooting to best practices, we're here to help you achieve your desired outcome.Open a ticketCompanyContact UsGet in touch with our team for inquiries about our company and solutions.NewsroomStay up-to-date with the latest news about our vision for the future.About UsLearn what makes Rekor's AI-driven solutions so unique and powerful.PartnershipsJoin the Rekor Partner Network to innovate and grow the industry.CareersExplore exciting opportunities with a disruptive force in artificial intelligence.Security and TrustUnderstand how privacy is respected and personal data is controlled.Rekor’s Vehicle Insite Application Deployed in the Phoenix Metropolitan AreaRekor Systems today announced that its Vehicle Insite application, a part of its Rekor Discover® platform, is being utilized in a 90-site study across the Phoenix metropolitan area.February 26, 2025Press ReleaseInvestor RelationsContact UsLearn how Tire Profiles efficiently processes auto service customersTire Profiles uses Rekor CarCheck for vehicle data lookup when a vehicle is scanned anywhere in a service facility. Without accurate license plate recognition, there is no way to automatically connect vehicle data with customer data.OrganizationTire Profiles, LLCIndustryAutomotive ServiceLocationIrving, TexasSolution(s) usedRekor CarCheck® Download PDFAbout Tire ProfilesTire Profiles, LLC, is the automotive industry’s leading tire and alignment laser diagnostic technology company serving auto dealers and tire retailers around the world.Tire Profiles ProductsTreadSpec™ drive-over system is designed for high volume service drive lanes, typically found at new car dealers. TreadSpec is a completely automated, zero-labor system.GrooveGlove™, a cloud-based, wireless, handheld tool, allows a vehicle scan anywhere in the service facilityVehicle Identification and InformationTire Profiles customers rely on the correct identification of each vehicle scanned by TreadSpec™ and GrooveGlove™. Meaning, these products depend on accurate License Plate Recognition (LPR), which is then used for VIN and vehicle data lookup. Without accurate LPR, there is no way to automatically connect Tire Profiles data with customer data. This loss of connection has a direct negative financial impact on customers.Tire Profiles Original LPR VendorThe initial vendor provided a hardware-based solution for the TreadSpec™ drive-over system. Each system required an expensive (one-time) license plus a specific, and very expensive, IP camera. When the GrooveGlove™ handheld scanner was introduced, a cloud-based solution was needed, which the previous vendor developed and released as a commercially available product. However, this new cloud-based LPR product came with a monthly fee for each customer, regardless of volume. Additionally, the accuracy was only about 57% in the US and 51% in Europe.Search for a New LPR VendorWith the combination of high price and insufficient accuracy, Tire Profiles started to explore alternative LPR solutions. After reviewing available options, they implemented a parallel test using Rekor CarCheck®. This allowed a direct comparison between Rekor and the previous vendor.ResultsThe results were as follows:US: 162 Plates Current Vendor Correct: 92 – 56.8% Rekor Correct: 152 – 94.4%EU: 188 Plates Current Vendor Correct: 95 – 50.5% Rekor Correct: 166 – 88.3%PriceOne of the other major considerations for evaluating Rekor was price. A fixed monthly price of $2000 (for up to 1 million plates per month) allows continued growth without the burden of linear expense growth.DecisionSelecting Rekor and CarCheck was easy. Even if pricing could have been restructured with the previous vendor, there was no way they could address the product’s accuracy issues in a reasonable amount of time.“It has been great working with the team at Rekor. As LPR is a critical component in our line of products, we needed the ability to manage and monitor (LPR) servers in North America, South America, Europe, and the Pacific Rim. To this end, Rekor worked out an arrangement with us where we host our own instances of CarCheck servers.” - Jeff Hislop, CTOConclusionIn a direct comparison, using the same set of images, CarCheck was 65% more accurate than the previous vendor. On top of that, the pricing model for CarCheck provided a much lower cost.CASE STUDIESPowered by RekorCentral Texas Regional Mobility Authority (Mobility Authority)Learn how Central Texas toll roads achieved faster incident response timesThe Mobility Authority leverages Rekor Command® to revolutionize traffic management, ensuring faster incident detection, seamless collaboration, and safer, more efficient roadways amidst rapid regional growth and infrastructure expansion.Winchester, VirginiaLearn how Winchester, Virginia enhanced public safety and urban mobilityWhile initially a traffic-focused pilot, Winchester, VA quickly found powerful performance with Rekor Scout®. The technology is used daily to monitor and respond to public safety incidents in real-time.Nevada Highway Patrol (NHP)Learn how the Nevada Highway Patrol is proactively managing trafficNevada Highway Patrol (NHP) selected Rekor Command® because it is fully cloud-based, features live maps, and is accessible to NHP users through their mobile digital computers, tablets, and desktops.Want the future of roadway intelligence delivered directly to your inbox?Newsletter Sign Up* Email addressThank you for subscribing! Stay tuned for all of the latest Rekor news!Oops! Something went wrong while submitting the form.PlatformsRekor Discover® for Urban MobilityClass, Count, and SpeedVehicle InsiteRekor Command® for Transportation ManagementRekor Scout® for Public SafetySYSTEMS & SERVICESRekor Edge Flex™ (Classification)Rekor Edge Max™ (Classification)Rekor Edge Pro (ALPR)Rekor Edge Max™ (ALPR)Rekor Traffic ServicesDevelopersVehicle Recognition SDKRekor CarCheck® ALPR APIRekor AutoNotice™ for Contactless ComplianceResourcesIndustry InsightsCustomer StoriesEventsFunding AssistanceBuilding with AWSTechnical Documentation Help Center CompanyInvestor RelationsNewsroomAbout UsPartnershipsCareersSecurity and TrustContact UsPoliciesPrivacy PolicyEnd User License AgreementTerms of ServiceAccessibility Statement© {year} Rekor Systems, Inc. All Rights Reserved.6721 Columbia Gateway Dr, Suite 400, Columbia, MD 21046 .footer-section { background-color: #181B32; color: #fff; } .footer-section .newsletter_box { background-color: #2B2D42; } .footer-section .newsletter_arrow-icon, .footer-section .footer_logo, .footer-section .font-awesome-brand { display: none; } .footer-section .newsletter_arrow-icon-white, .footer-section .footer_logo-white, .footer-section .font-awesome-brand-white { display: block; } .footer-section .newsletter-input { background-color: #464959; color: #fff; } .footer-section .newsletter-input::placeholder { color: #fff; } .footer-section .footer_terms-divider { background-color: #fff; } .footer-section .social-box { border-color: #fff; } .social-box:hover { background-color: #414563; } .footer-next-page-icon { filter: invert(1); }"
