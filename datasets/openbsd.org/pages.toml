["https://openbsd.org/support.html"]
title = "OpenBSD: Support and Consulting"
full_description = 'OpenBSD has attracted a critical mass of developers, support organizations and consultants such that it is now safe to commit to using OpenBSD in your projects. The following individuals and organizations have indicated that they are able to provide support as indicated. However, the OpenBSD Project does not necessarily endorse any of these. Please contact each site directly. These entries are arranged geographically by country, so that you can find a consultant near you. Algeria Argentina Australia Belgium Brazil Canada Czech Republic Finland France Germany Indonesia Ireland Italy Japan Latvia Mexico Netherlands Norway Philippines Poland Portugal Russian Federation Singapore Sweden Switzerland UAE USA Ukraine United Kingdom If you want to submit your own entry, the format is quite rigid; please use this template. Do not just copy and paste plain text from your browser! If you want your website to be listed, make sure it can actually be viewed on OpenBSD, and does not require any proprietary software. When you think your entry is ready, mail it to misc at openbsd.org, with a Subject: line containing the word "support" and either the word "new" or "update." Note that we may at any time, and without notification, remove your entry if it is found to be inaccurate, if your website is broken, or if there is no mention of OpenBSD on it. If this happens, just re-submit your entry after the situation is corrected if you want to be listed again.'
