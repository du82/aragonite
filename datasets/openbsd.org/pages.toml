["https://openbsd.org/faq/faq17.html"]
title = "OpenBSD FAQ: Virtual Private Networks (VPN)"
full_description = '''The ikectl(8) utility also allows you to maintain a simple X.509 certificate authority (CA) for IKEv2 peers. An IKEv1 server (isakmpd(8)) is also available and, coupled with npppd(8), it allows you to build an IKEv1/L2TP VPN where IKEv2 can't be deployed. Native WireGuard support is also available via the wg(4) device. As the manual explains, it can be configured the same way as all other network interfaces in OpenBSD. From that point, let's assume that server1 has a public IP of 192.0.2.1 and an internal network on 10.0.1.0/24, and that server2 has a public IP of 198.51.100.1 and an internal network on 10.0.2.0/24. To enable the initiator to reach the responder, the isakmp UDP port should be open on the responder. If one of the peers is behind NAT, the ipsec-nat-t UDP port should also be open on the responder. If both peers have public IPs, then the ESP protocol should be allowed. Depending on the use case, as all traffic will go through the responder, one must ensure the initiator is configured to use a DNS server it can reach (possibly one on the responder). As with the previous example, exchanging the default-provided RSA public keys is enough to set up a simple authentication between the responder and the initiator: /etc/iked/local.pub on the first system ("server1") should be copied to /etc/iked/pubkeys/fqdn/server1.domain on the second system ("roadwarrior"). Then, /etc/iked/local.pub on the roadwarrior system should be copied to /etc/iked/pubkeys/fqdn/roadwarrior on the first. Replace "serverX.domain" with your own FQDN. The responder iked.conf(5) creates flows from any destination to the dynamic IP leases from the address pool, which will be decided at runtime, and tags the packets with ROADW: It also needs to allow IPsec from any host (since clients might connect from anywhere), allow traffic tagged ROADW on enc0 and apply NAT to it: Gracefully stopping the VPN on the initiator can be achieved using ikectl decouple (iked is still running, pending ikectl couple so that it reconnects to the responder) or with ikectl reset sa && rcctl stop iked to permanently stop iked and ensure no flows are left behind.'''
year_published = 2025
clearnet = "https://openbsd.org/faq/faq17.html"
