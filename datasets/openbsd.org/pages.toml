["https://openbsd.org/errata28.html"]
title = "OpenBSD 2.8 Errata"
description = "the OpenBSD CD errata page"
full_description = "Patches for the OpenBSD base system are distributed as unified diffs. Each patch contains usage instructions. All the following patches are also available in one tar.gz file for convenience. 1. A symlink problem was discovered in the KerberosIV password checking routines /usr/bin/su and /usr/bin/login, which makes it possible for a local user to overwrite any file on the local machine. 2. It is possible to specify environment variables in telnet which will be passed over the to the remote host. This makes it possible to set environment variables on the remote side, including ones that have special meaning on the server. It is not clear at this time what the impact is, but we recommend everyone to upgrade their machines immediately. In addition to a source code patch, new xlock binaries have been created for each architecture listed below. Place these binaries at /usr/X11R6/bin/xlock and chmod 4755 /usr/X11R6/bin/xlock."
year_published = 2025
