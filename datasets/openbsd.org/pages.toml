["https://openbsd.org/faq/faq6.html"]
title = "OpenBSD FAQ: Networking"
full_description = '''The netstart(8) script configures network interfaces at boot time using hostname.if(5) files, where "if" is replaced by the full name of each interface. The example above would use the file /etc/hostname.fxp0, containing the following options: Even though it's possible to completely reconfigure networking on a running OpenBSD system, a reboot is recommended after any significant changes. In this example, two aliases are added to the interface dc0, which was configured as 192.168.0.2 with a netmask of 255.255.255.0. The following cards support Host-based Access Point (HostAP) mode, permitting them to be used as a wireless access point: Another option to consider: use a conventional NIC and an external bridging wireless access point for the OpenBSD-based firewall. At runtime, automatic access point selection can be temporarily overridden with the ifconfig nwid command: It is not possible to assign an IP address directly to a bridge interface. The IP address should be added to one of the member interfaces, but we cannot use a physical interface as the link might be down, in which case the address would not be reachable. Fortunately, there is the vether(4) (virtual Ethernet) driver that can be used for this purpose. We will add it to the bridge, assign the IP address to it and make dhcpd(8) listen there. The route(8) command is used to add/change/delete routes in the routing table. The -mpath argument is used when adding multipath routes. Since the mygate(5) file does not yet support multipath default routes, the above commands should be added to the bottom of the hostname.if(5) files for the fxp1 and fxp2 interfaces. The /etc/mygate file should then be deleted. Now try a traceroute to different destinations. The kernel will load balance the traffic over each multipath route. It's worth noting that if an interface used by a multipath route goes down (i.e., loses carrier), the kernel will still try to forward packets using the route that points to that interface. This traffic will of course be blackholed and end up going nowhere. It's highly recommended to use ifstated(8) to check for unavailable interfaces and adjust the routing table accordingly.'''
