["https://openbsd.org/report.html"]
title = "OpenBSD: Problem Reports"
description = "OpenBSD problem report page"
full_description = '''If nothing looks like it addresses your problem, then please become acquainted with sendbug(1) before submitting a bug report. Always provide as much information as possible. Try to pinpoint the exact problem. Give clear instructions on how to reproduce the problem. Try to describe it with as much accuracy and non-confusing terminology as possible, especially if it is not easy to reproduce. Describing problems by saying "it crashes" or "I get strange interrupt issues on this one box that I built" is not helpful. Communicate with others (on the mailing lists or any other forum where knowledgeable users congregate) to confirm that the problem is new and preferably repeatable. Please try to make sure it is not a local problem created by using broken or unsupported hardware, or by using unsupported build options or software. Please don't start fixing problems that require significant work until you are sure you understand them, especially during our release periods when we must not change major sections of code. If you are going to write significant amounts of code, mention it on the mailing lists to make sure no one else is already working on the problem (saving duplication of effort). Note: In case of fatal errors, the error message provided might not contain all the information available. In that case, also look at the output in the system log files, such as those stored in /var/log. Also, if you are dealing with an application that has its own log files, such as httpd, check for errors where it keeps its logs. Do not be afraid if your bug report becomes rather lengthy. That is a fact of life. It's better to report everything the first time than us having to squeeze the facts out of you. On the other hand, if your input files are huge, it is fair to ask first whether somebody is interested in looking into it. If possible, use the sendbug(1) command to help generate your bug report. It will automatically include some useful information about your hardware that helps diagnose many issues. This tool requires that your system can properly send email. If you cannot use sendbug on a functional OpenBSD machine, please send your bug report to bugs@openbsd.org.'''
year_published = 2025
clearnet = "https://openbsd.org/report.html"
tags = ["always", "create", "current", "essential", "include", "information", "message,", "openbsd", "output", "panic"]
language = "en"
