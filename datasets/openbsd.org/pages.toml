["https://openbsd.org/faq/faq5.html"]
title = "OpenBSD FAQ: Building the System from Source"
full_description = "New users should be running either -stable or a release. That being said, many people do run -current on production systems to help catch bugs and test new features. A recent snapshot is usually all you need to run -current. If you wish to build it from source, starting from the latest snapshot is required. Check the following -current and using snapshots page for any configuration changes or extra steps needed to build from source. It is possible that you may uncover bugs in snapshots. This is one of the reasons why they are built and distributed. If you find a bug, make sure it is reported. Make sure you have the closest available binaries installed. This is either OpenBSD x.y if you want to build OpenBSD x.y-stable, or the latest snapshot if you wish to build -current. If you want to fetch xenocara or ports as this user, you must create the directories and set their permissions manually. The instructions on making a release are in release(8). The release process uses the binaries created in the /usr/obj directory in the building process above. Note: if you wish to distribute the resulting file sets by HTTP(s) for use by the upgrade or install scripts, you will need to add an index.txt file that contains the list of all the files in your newly created release. Create a filesystem on /dest with the noperm mount(8) option set. The corresponding fstab(5) line might look like this: To simplify life for OpenBSD users, a meta-build called Xenocara was developed. This system converts X back into one big tree to be built in one process. As an added bonus, this build process is much more similar to the build process used by the rest of OpenBSD than the previous versions were. The official instructions for building X exist in the xenocara/README file and in step 5 of release(8). You will probably find it best to repair or replace the components that are causing trouble, as problems may show themselves in other ways in the future. By default, kernel tags for each architecture are located in /sys/arch/$(machine)/. These files can be created with make tags from /sys/kern. You may want to run make links as root to place a symlink to your architecture's kernel tags file in each directory and in /var/db/."
year_published = 2025
