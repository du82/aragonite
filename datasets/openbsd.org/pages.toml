["https://openbsd.org/hppa.html"]
title = "OpenBSD/hppa"
description = "the OpenBSD/hppa page"
full_description = 'OpenBSD/hppa runs on a large set of the 32-bit Hewlett Packard Precision Architecture workstations and servers (HP PA-RISC). A subset of the 64-bit models are supported in 32-bit mode, as well. A mailing list dedicated to the OpenBSD/hppa port is available at hppa@openbsd.org. To join the OpenBSD/hppa mailing list, send a message body of "subscribe hppa" to majordomo@openbsd.org. Please be sure to check our mailing list policy before subscribing. The current port maintainer is Mark Kettenis (kettenis@openbsd.org). Others are definitely welcome to contribute! This project was started in those days when the only open source operating systems for HP PA-RISC computers were Lites and MkLinux. These two sources were a major supply of information and code for initial development of the OpenBSD/hppa port. HPBSD is encumbered by HP proprietary code and USL licensing and is not publicly available. One of the major direct benefits from previous porting efforts (besides the code, of course) was support for HP PA-RISC in GCC and binutils, which allowed quick building of a cross-tools environment for development. Later on, Hewlett-Packard decided to sponsor a Linux port to the PA-RISC family, which actually resulted in some proprietary documentation being released, even though their target was a different class of 9000 machines back then. Currently, all the supported systems boot multi-user. In addition to the release, full snapshots are made periodically, and work is ongoing to provide better hardware support. The following systems are very unlikely to be supported since they either have incompatible firmware (the 3000s) or almost completely undocumented I/O subsystems (the 8x7s). Convex PA-RISC systems (NUMA supercomputing clusters consisting of one or more 8-way SMP nodes with PA7100 or PA7200 CPUs) are unlikely to be ever supported. All other HP 9000 6xx, 8xx and 9xx server systems will probably never be supported by this port since they are of 1.0 PA-RISC architecture, which is substantially inferior to the 1.1.'
year_published = 2025
clearnet = "https://openbsd.org/hppa.html"
