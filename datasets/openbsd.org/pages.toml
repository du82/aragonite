["https://openbsd.org/22.html"]
title = "OpenBSD 2.2"
description = "OpenBSD 2.2"
full_description = '''All applicable copyrights and credits are in the src.tar.gz, sys.tar.gz, xenocara.tar.gz, ports.tar.gz files, or in the files fetched via ports.tar.gz. Following this are the instructions if you had purchased a CDROM set instead of attempting to do an alternate form of install. The instructions for doing an ftp (or other style of) install are very similar; the CDROM instructions are left intact so that you can see how much easier it would have been if you had purchased a CDROM instead. Please refer to the following files on the two CDROMs for extensive details on how to install OpenBSD 2.2 on your machine: Quick installer information for people familiar with OpenBSD, and the use of the new "disklabel -E" command. If you are at all confused when installing OpenBSD, read the relevant INSTALL.* file as listed above! Play with your BIOS options, and see if you can enable booting off a CD; try using CD1. If not, write CD1:2.2/i386/floppy22.fs to a floppy, then boot that. If you are mixing OpenBSD with another operating system, you will surely need to read the INSTALL.i386 document. To make a floppy under MS-DOS, use /2.2/tools/rawrite.exe. Under Unix, use "dd if=<file> of=/dev/<device> bs=32k" (where device could be "floppy" or "rfd0c" or "rfd0a"). Use properly formatted perfect floppies with NO BAD BLOCKS or you will lose. Using CD1, tell the BOOT ROM to load the file CD1:\2.2\arc\bsd.rd. If that does not work, create a MS-DOS filesystem using your vendor's arc setup program, copy CD1:2.2/arc/bsd.rd to there and attempt to boot it. To boot off CD1, type "boot cdrom 2.2/sparc/bsd.rd", or "b sd(0,6,0)2.2/sparc/bsd.rd" depending on your ROM version. Alternatively, write CD1:2.2/sparc/floppy22.fs to a floppy and boot it using "boot fd()" or "boot floppy" depending on your ROM version. Finally, a third alternative is to write CD1:2.2/sparc/kc.fs and CD1:2.2/sparc/inst.fs to two separate floppies. Then insert "kc.fs", and boot as described above. As soon as the floppy drive ejects a floppy, insert "inst.fs". Answer a bunch of questions. Reboot from the "kc.fs" floppy. This time, when the floppy is ejected simply re-insert "kc.fs" again and answer a different set of questions.'''
year_published = 2025
clearnet = "https://openbsd.org/22.html"
