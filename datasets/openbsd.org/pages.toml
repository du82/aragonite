["https://openbsd.org/faq/pf/anchors.html"]
title = "OpenBSD PF: Anchors"
full_description = "Anchors can be nested, which allows for sub-rulesets to be chained together. Anchor rules will be evaluated relative to the anchor in which they are loaded. For example, anchor rules in the main ruleset will create anchor attachment points with the main ruleset as their parent, and anchor rules loaded from files with the load anchor directive will create anchor points with that anchor as their parent. Rules can be loaded into an anchor using the same syntax and options as rules loaded into the main ruleset. One caveat is that, unless inline anchors are being used, any macros that are used must also be defined within the anchor itself. Macros that are defined in the parent ruleset are not visible from the anchor. Since anchors can be nested, it's possible to specify that all child anchors within a specified anchor be evaluated: Each anchor, as well as the main ruleset, exists separately from the other rulesets. Operations done on one ruleset, such as flushing the rules, do not affect any of the others. In addition, removing an anchor point from the main ruleset does not destroy the anchor or any child anchors that are attached to that anchor. An anchor is not destroyed until it's flushed of all rules using pfctl(8) and there are no child anchors within the anchor."
year_published = 2025
