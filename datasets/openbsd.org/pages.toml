["https://openbsd.org/mail.html"]
title = "OpenBSD: Mailing Lists"
full_description = '''Mailing lists are an important means of communication among users and developers of OpenBSD. With the exception of announce, the lists are not moderated (but see below). We deliberately restrict the number of different mailing lists. This helps reduce the amount of cross-posting and makes sure that the information gets distributed to a wide audience. The OpenBSD lists use spamd(8) and SpamAssassin to keep down the spam volume, but things do sneak through from time to time — deal with it. In addition, the list server also has regex-based rules to reject emails based on some common spam and virus telltales. If you get spam through one of the OpenBSD mailing lists, you don't need to send a copy to the list owner — chances are he's already seen it. Also, please do not submit spam received through the mailing lists to spamcop, as this will result in the list server being added to their RBL. Complaining about and commenting upon spam on the list proper is counter-productive, as it generates more traffic than the spam itself. Note that if you are sending mail from a dynamic IP address, you will probably not be able to post to the mailing lists. In this case, you should use a smart host mail configuration that utilizes your ISP's mail server. See the examples in smtpd.conf(5) for how to do this. These lists are for technical discussions of aspects of OpenBSD. They are NOT for beginners or average users, they are not for problem reporting (unless you are including a good fix) and they are not for installation problems. If you have any question about if a message should be posted to any of these lists, it probably should not. Use misc instead. If you want to be sent a complete list with all mailing lists available at openbsd.org, send the command lists in the body of a message to majordomo@openbsd.org. To subscribe to a given list, send mail to majordomo@openbsd.org with a message body of "subscribe mailing-list-name" (where mailing-list-name is the name of your preferred list).'''
year_published = 2025
