["https://openbsd.org/42.html"]
title = "OpenBSD 4.2"
description = "OpenBSD 4.2"
full_description = '''All applicable copyrights and credits are in the src.tar.gz, sys.tar.gz, xenocara.tar.gz, ports.tar.gz files, or in the files fetched via ports.tar.gz. This is a partial list of new features and systems included in OpenBSD 4.2. For a comprehensive list, see the changelog leading to 4.2. Following this are the instructions which you would have on a piece of paper if you had purchased a CDROM set instead of doing an alternate form of install. The instructions for doing an FTP (or other style of) install are very similar; the CDROM instructions are left intact so that you can see how much easier it would have been if you had purchased a CDROM instead. Quick installer information for people familiar with OpenBSD, and the use of the "disklabel -E" command. If you are at all confused when installing OpenBSD, read the relevant INSTALL.* file as listed above! Play with your BIOS options to enable booting from a CD. The OpenBSD/i386 release is on CD1. If your BIOS does not support booting from CD, you will need to create a boot floppy to install from. To create a boot floppy write CD1:4.2/i386/floppy42.fs to a floppy and boot via the floppy drive. Use CD1:4.2/i386/floppyB42.fs instead for greater SCSI controller support, or CD1:4.2/i386/floppyC42.fs for better laptop support. NOTE: some older BIOSes appear to have problems booting CD1. A workaround can be found on the 4.2 errata page. If you can't boot from a CD or a floppy disk, you can install across the network using PXE as described in the included INSTALL.i386 document. To make a boot floppy under MS-DOS, use the "rawrite" utility located at CD1:4.2/tools/rawrite.exe. To make the boot floppy under a Unix OS, use the dd(1) utility. The following is an example usage of dd(1), where the device could be "floppy", "rfd0c", or "rfd0a". Make sure you use properly formatted perfect floppies with NO BAD BLOCKS or your install will most likely fail. For more information on creating a boot floppy and installing OpenBSD/i386 please refer to this page.'''
