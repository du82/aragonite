full_description = '''All applicable copyrights and credits are in the src.tar.gz, sys.tar.gz, xenocara.tar.gz, ports.tar.gz files, or in the files fetched via ports.tar.gz. This is a partial list of new features and systems included in OpenBSD 3.7. For a comprehensive list, see the changelog leading to 3.7. Following this are the instructions which you would have on a piece of paper if you had purchased a CDROM set instead of doing an alternate form of install. The instructions for doing an FTP (or other style of) install are very similar; the CDROM instructions are left intact so that you can see how much easier it would have been if you had purchased a CDROM instead. Quick installer information for people familiar with OpenBSD, and the use of the "disklabel -E" command. If you are at all confused when installing OpenBSD, read the relevant INSTALL.* file as listed above! Play with your BIOS options to enable booting from a CD. The OpenBSD/i386 release is on CD1. If your BIOS does not support booting from CD, you will need to create a boot floppy to install from. To create a boot floppy write CD1:3.7/i386/floppy37.fs to a floppy and boot via the floppy drive. Use CD1:3.7/i386/floppyB37.fs instead for greater SCSI controller support, or CD1:3.7/i386/floppyC37.fs for better laptop support. If you can't boot from a CD or a floppy disk, you can install across the network using PXE as described in the included INSTALL.i386 document. To make a boot floppy under MS-DOS, use the "rawrite" utility located at CD1:3.7/tools/rawrite.exe. To make the boot floppy under a Unix OS, use the dd(1) utility. The following is an example usage of dd(1), where the device could be "floppy", "rfd0c", or "rfd0a". Make sure you use properly formatted perfect floppies with NO BAD BLOCKS or your install will most likely fail. For more information on creating a boot floppy and installing OpenBSD/i386 please refer to this page. The 3.7 release of OpenBSD/amd64 is located on CD2. Boot from the CD to begin the install - you may need to adjust your BIOS options first. If you can't boot from the CD, you can create a boot floppy to install from. To do this, write CD2:3.7/amd64/floppy37.fs to a floppy, then boot from the floppy drive.'''
