["https://openbsd.org/faq/upgrade76.html"]
title = "OpenBSD Upgrade Guide: 7.5 to 7.6"
description = "OpenBSD Upgrade Process for 7.5 -> 7.6"
full_description = 'Read through and understand this process before attempting it. For critical or physically remote machines, test it on an identical, local system first. After upgrading the sets, the system will reboot with the upgraded kernel and run sysmerge(8) during boot. In some cases, configuration files cannot be modified automatically. Run Sometimes, you need to perform an upgrade of a machine for which the normal unattended or interactive upgrade process is not possible. The old packages opensmtpd-extras should be removed and the appropriate tables installed from the opensmtpd-table-* packages. For example, the passwd table is in the opensmtpd-table-passwd package. Once the new tables are installed, no changes to the configuration are needed. For AMD hardware, the driver is included in the xbase set so there is nothing extra to install, but there have been reports of some problems - if affected, you may need to disable hardware acceleration in the relevant software. For VLC, go to Settings, Tools, Prefs., Input/Codecs, and set "hardware acceleration" to disable.'
year_published = 2025
