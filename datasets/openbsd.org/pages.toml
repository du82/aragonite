["https://openbsd.org/anoncvs.html"]
title = "OpenBSD Anonymous CVS"
description = "How to get OpenBSD updates via Internet using Anonymous CVS"
full_description = "Anonymous CVS is a method of keeping your local copy of the OpenBSD source tree up to date with respect to changes made to current OpenBSD sources. In addition to following the bleeding edge of development, it is also possible to track the errata patches of a release. Anonymous CVS works directly against a central source code repository. This means that you have the full set of CVS commands available to control merging and updating your changes with other source changes, performing diffs, change histories and other queries against the central repository. In the event that the changes can't be completely merged, CVS provides annotated changes to your local copy and preserves an unmodified copy of your version. CVS is the source code control system used to manage the OpenBSD source tree. It implements a central repository for all officially released source code and changes, while permitting developers to maintain local copies of the source code with their working changes. While you can download the entire source tree from an AnonCVS server, you can save time and bandwidth by pre-loading your tree with the source tarballs. This is particularly true if you are running -stable, as relatively few files change between the release and -stable. The source files for download from the mirrors are separated into two files to reduce the download time for those wishing to work with only one part of the tree. The kernel sources are in sys.tar.gz and the userland sources are in src.tar.gz. The following commands assume you have followed these instructions to give a non-root user write access to the src, ports and xenocara directories. cvs(1) was designed to be a simple way to retrieve and update your sources. You must first decide whether you want to track -current or a -stable branch. The current tree has all of the up to the minute changes, whereas the -stable branch contains the sources for the release plus the patches from the errata and lesser issues already applied. For more information on the flavors of OpenBSD, see here."
year_published = 2025
clearnet = "https://openbsd.org/anoncvs.html"
tags = ['"reposync', "-r1.1", "-r1.5", "-shc", "/home/cvs", '/home/cvs"', "/tmp", "/tmp/patch", "/tmp/ports.tar.gz", "/tmp/src.tar.gz"]
