external-references = ["80d.org", "aja.com", "allard.nu", "amd.com", "bsd.si", "bulabula.org", "cm-gouveia.pt", "efc.ca", "enseeiht.fr", "ftp.openbsd.org", "ihp.fr", "kbug.gr.jp", "lesliealexander.com", "lists.nycbug.org", "monkey.org", "oreilly.com", "savannah.nongnu.org", "tedunangst.com", "theregister.co.uk", "tuhs.org"]

["https://openbsd.org/29.html"]
title = "OpenBSD 2.9"
description = "OpenBSD 2.9"
full_description = 'All applicable copyrights and credits are in the src.tar.gz, sys.tar.gz, xenocara.tar.gz, ports.tar.gz files, or in the files fetched via ports.tar.gz. This is a partial list of new features and systems included in OpenBSD 2.9. For a comprehensive list, see the changelog leading to 2.9. Following this are the instructions which you would have on a piece of paper if you had purchased a CDROM set instead of doing an alternate form of install. The instructions for doing an ftp (or other style of) install are very similar; the CDROM instructions are left intact so that you can see how much easier it would have been if you had purchased a CDROM instead. Quick installer information for people familiar with OpenBSD, and the use of the "disklabel -E" command. If you are at all confused when installing OpenBSD, read the relevant INSTALL.* file as listed above! Play with your BIOS options to enable booting from a CD. The OpenBSD/i386 release is on CD1. If your BIOS does not support booting from CD, you will need to create a boot floppy to install from. To create a boot floppy write CD1:2.9/i386/floppy29.fs to a floppy and boot via the floppy drive. If you are planning on dual booting OpenBSD with another OS, you will need to read the included INSTALL.i386 document. To make a boot floppy under MS-DOS, use the "rawrite" utility located at CD:/2.9/tools/rawrite.exe. To make the boot floppy under a Unix OS, use the dd(1) utility. The following is an example usage of dd(1), where the device could be "floppy", "rfd0c", or "rfd0a". Make sure you use properly formatted perfect floppies with NO BAD BLOCKS or your install will most likely fail. For more information on creating a boot floppy and installing OpenBSD/i386 please refer to FAQ4.1. The 2.9 release of OpenBSD/sparc is located on CD2. To boot off of this CD you can use one of the two commands listed below, depending on the version of your ROM. If your sparc does not have a CD drive, you can alternatively boot from floppy. To do so you need to write "CD2:2.9/sparc/floppy29.fs" to a floppy. For more information see FAQ4.1. To boot from the floppy use one of the two commands listed below, depending on the version of your ROM.'
