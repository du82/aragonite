["https://openbsd.org/groups.html"]
title = "OpenBSD: User Groups"
full_description = '''The continuing growth of OpenBSD depends on attracting new users, developers, software suppliers, and consultants. One means of reaching new users is via users groups, where people can exchange experiences, ideas, free software, and find out that there are others with similar problems and solutions. The following user groups are either specific to OpenBSD or at least to the BSD family of systems. However, the OpenBSD Project does not necessarily endorse any of these. Please contact the User's Group directly. These entries are arranged geographically by country, so that you may more readily find a users' group near you. Argentina Australia Austria Brazil Canada Germany Ghana Hungary Iran Japan Norway Poland Slovenia Sweden USA If you want to see your group listed, the format is quite rigid; please use this template (do not just copy and paste plain text from your browser!). When you think it's ready, mail it to misc at openbsd.org, with a Subject: line containing the word "groups" and either the word "new" or "update".'''
year_published = 2025
