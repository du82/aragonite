["https://openbsd.org/lyrics.html"]
title = "OpenBSD: Release Songs"
description = "the OpenBSD release song lyrics page"
full_description = "Every 6 months the OpenBSD project has the pleasure to release our software with artwork and a matching song. Theo and some other developers mutate a theme (from a classical setting, a movie, or some genre) into the fishy world of Puffy, to describe some advance, event or controversy the project went through over the previous six months. To match the art released with the historical CD sets, we joined up with some musicians we know to make at least one song. Once there was a Wizard so old and wise that he asked Mother Night for a new enterprise falling asleep his wish was heard and by Merlin's beard what a strange world he entered In this world existed only zeros and ones never had a Wizard seen such duality, not once He approached one of the zeros and said Who are you? I'm a zero yes, I see, but what do you do? The zero said I am the beginning and the end Never had our Wizard met such a strange friend He did not understand at all what he saw and walking on this time met another strange fella he approached the one and said: Who are you? I'm One Yes, I see, but what do you do? The one said: I am everything in between The Wizard could not believe what his eyes had just seen He sat down on a stone feeling tired and alone missing his friends in the binary unknown silent and sad he played with his beard suddenly, a little fish appeared! The Wizard said: you are not a zero or a one? No, I'm a fish, come swim with me, come They swam together and dived deep into the ocean until they found the place where it once all began The little fish took a small rake and starting raking the sand and the Wizard was amazed by the waves of this new friend he said Little fish, who are you? I'm a gardener, don't you see? Well, yes, but what do you do? The little fish - without stopping - calmly made clear My task is important, this is what I do here, the sand contains crucial information which I need to order before the rising of the sun. Suddenly, from far, a big whale appeared The Wizard, frightend, quickly hid behind his beard The whale opened his mouth but instead of swallowing our friend released from his tongue piles and piles of new sand. The Wizard, startled, opened his mouth but the fish said No no no, no questions allowed, we do not need to know where he comes from or goes for a little mystery is what gives us purpose. Finally something the Wizard could understand he had found the mystery underneath the beginning and the end he had dived way below everything in between and saw the biggest whale he had ever seen He said My dear fish, what you do, I can see, is raking the maritime soil of mystery from now on, I will protect you, your sand, and your shells, coming back every year to update my spells. They said their goodbyes and the Wizard returned to his nice and warm bed, with all his lessons learned He was happy that he now understood this strange place and could protect his new friends for the rest of his days"
year_published = 1995
clearnet = "https://openbsd.org/lyrics.html"
