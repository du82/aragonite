["https://openbsd.org/faq/faq1.html"]
title = "OpenBSD FAQ: Introduction to OpenBSD"
full_description = "The maintainers of OpenBSD support the project largely from their own pockets. This includes the time spent programming for the project, equipment used to support the many ports, network resources used to distribute OpenBSD to you, and the time spent answering questions and investigating users' bug reports. The OpenBSD developers are not independently wealthy, and even small contributions of time, equipment and resources make a big difference. In general, if you know the name of a command or a manual page, you can read it by executing man command. If you don't know the name of the command, or if man command doesn't find the manual page, you can search the manual page database by executing apropos something or man -k something, where something is a likely word that might appear in the title of the manual page you're looking for. You can find several archives, other guidelines and more information on the mailing list page. Subscriptions can be easily managed via the web interface. The OpenBSD mail server uses spamd(8) for greylisting, so it may take half an hour or so before the mail server accepts your bug report. Please be patient. After submitting a bug report, you may be contacted by developers for additional information or with patches that need testing. You can also monitor the archives of the bugs@openbsd.org mailing list - details on the mailing list page. OpenBSD has a constant need for several types of support from the community. If you find OpenBSD useful, you are strongly encouraged to find a way to contribute."
