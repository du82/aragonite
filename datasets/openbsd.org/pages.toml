["https://openbsd.org/faq/faq16.html"]
title = "OpenBSD FAQ: Virtualization"
full_description = "Using vmctl(8)'s -L flag creates a local interface in the guest which will receive an address from vmd via DHCP. This essentially creates two interfaces: one for the host and the other for the VM. The following line in /etc/pf.conf will enable Network Address Translation and redirect DNS requests to the specified server: Create a vport0 interface that will have a private IPv4 address as defined above. In this example, we'll use the 10.0.0.0/8 subnet. The Ethernet network will be switched between the real network, the host, and the VM using veb(4). Because veb(4) disconnects interfaces added as ports from the IP stack, any IP configuration on the real interface has to be moved to a vport(4) interface for the host to be able to participate in the network. In this example em0 is the interface connected to the real network. Note: If the host interface (em0 in the above example) uses automatic address configuration (eg, DHCP), it may rely on the MAC address of the interface to get a particular IP address assigned. In this situation the MAC address from em0 can be assigned to vport0 so it can use it on the real network. Virtual machines can be connected to a real network but isolated from the host by omitting the vport interface in the configuration above."
year_published = 2025
clearnet = "https://openbsd.org/faq/faq16.html"
