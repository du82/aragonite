["https://openbsd.org/faq/current.html"]
title = "Following -current and using snapshots"
full_description = '''Active OpenBSD development is known as the -current branch. These sources are frequently compiled into releases known as snapshots. Aggressive changes are sometimes pushed in this branch, and complications can arise when building the latest code or upgrading from a previous point in time. Some of the steps for getting over these hurdles are explained on this page. Make sure you've read and understand how to build the system from source before using -current and the instructions below. In general, it's far easier to use snapshots, as developers will have gone through much of the trouble for you already. You should always use a snapshot as the starting point for running -current. This process typically consists of running sysupgrade(8) with the -s flag. Alternatively, download (and verify) the appropriate bsd.rd file from the /snapshots/ directory of your preferred mirror, boot from it, and choose (U)pgrade at the prompt. Any installed packages should then be upgraded after booting into the new system. Upgrading to -current by compiling your own source code is discouraged for everyone except for experts, as difficult build-time crossing-points can occur often, and no assistance will be provided. In case of failure, use a snapshot to recover. There was a major update to PostgreSQL 17.2. Use pg_upgrade as described in the postgresql-server pkg-readme or do a dump/restore. The MinIO Gateway and the related filesystem mode entered a feature freeze in July 2020. In February 2022, MinIO announced the deprecation of the MinIO Gateway. Along with the deprecation announcement, MinIO also announced that the feature would be removed in six months time. The MinIO port has been update to a version where the MinIO Gateway and the related filesystem mode code have been removed. Deployments still using the standalone or filesystem MinIO modes that upgrade to that latest version will fail to start. The last MinIO version supporting the filesystem mode (0.20221024) is still available as a package. If you "pkg_add minio" you'll be offered a choice of versions. The upstream project provides a procedure to migrate to a new Single-Node Single-Drive deployment .'''
year_published = 2025
clearnet = "https://openbsd.org/faq/current.html"
