["https://openbsd.org/faq/faq7.html"]
title = "OpenBSD FAQ: Keyboard and Display Controls"
full_description = '''Note that you can use a serial console for install without doing this step, as the system is running in single user mode, and not using getty for login. On some platforms and some configurations, you must bring the system up in single user mode to make this change if a serial console is all you have available. Some systems may be able to operate without a video card in the machine, but certainly not all -- many consider this an error condition. Others are capable of redirecting all BIOS keyboard and screen activity to a serial port through a configuration option, so the machine can be completely maintained through the serial port. Your results may vary. When using this feature, some BIOS implementations may prevent the boot loader from seeing the serial port, thus the kernel will not be told to use it. There may be a BIOS option "Continue Console Redirection after POST." This should be set to OFF, so the boot loader and the kernel can handle their own console. On some systems, the serial ports are labeled ttya, ttyb, ttyh0 or ttyh1. It is not necessary to make any changes to /etc/ttys to use a serial console in multi-user mode. Some sparc64 systems interpret a BREAK signal on the console port to be the same as a STOP-A command. This kicks the system back to the Forth prompt, stopping any application and operating system at that point. This is handy when desired, but unfortunately, some serial terminals at power-down and some RS-232 switching devices send something the computer interprets as a break signal, halting the machine. Test before you go into production. If you have a keyboard and monitor attached, you can still force the serial console to be used instead by using the following commands at the ok prompt: Unfortunately, serial console is not directly possible on most MacPPCs. While most of these machines do have serial hardware, it isn't accessible outside the machine. Fortunately, a few companies offer add-on devices for several Macintosh models which will make this port available for use as a serial console.'''
year_published = 2025
clearnet = "https://openbsd.org/faq/faq7.html"
