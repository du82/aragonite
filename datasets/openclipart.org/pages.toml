title = "9 supreme shapes - Openclipart"
full_description = "window.addEventListener( 'load', function() { (adsbygoogle = window.adsbygoogle || []).push({}); }) 9 supreme shapes by 10binary - uploaded on April 29, 2011, 8:34 pm this is one of the coolest things yet. It almost competes with the chessboard in it's awesomeness. Each of the shapes I could go on forever about but it would be more important to describe how I did it.Starting with the top going clockwise, I made the 4 supreme regular polygons. They are the most well known polygons.The next four shapes I'm unsure if they have a name, but they are created by the gaps between different numbers of circles. They may not be as well known as the regular polygons. Since they are curved instead of straight edged, they could be called polycurves.Last but certainly not least, the circle is in the center. It's not a polygon or a polycurve, but it's the most commonly occuring shape in the universe as far as I know. Also I had to include it since the polycurves were made from circle gaps. 2 Log into OpenClipart × Email support@openclipart.org for Lost Password or Account Issues. Thankyou. Don't have an account? Join Now Tags curve hexagon circle pentagon polycurve polygon shape square supreme triangle Safe for Work? Yes Download Images SVG (Source Vector) PNG (Bitmap) Small Medium Large PDF (Print) Librarian Tools Google Reverse Image Search This Image Comments 0 Comments. Please login to comment or add your own remix."
