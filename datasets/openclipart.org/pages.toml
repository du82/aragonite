["https://openclipart.org/privacy"]
title = "Privacy Policy"
full_description = "Privacy PolicyWhat information do we collect?Information is collected from you when you register on our site. When registering on our site, you may be asked to enter your name and e-mail address. Your name may be your real name, or an assumed artist name. You may visit our site anonymously and choose not to register. How do we use your information?Information collected from you may be used in one of the following ways, but is not limited to personalization of your experience, processing of transactions, or sending of periodic emails. The email address you provide may be used to send you information, respond to inquiries, and/or other requests or questions. Your information, whether public or private, will not be sold, exchanged, transferred, released, or given to any other company for any reason whatsoever, without your consent, other than for the express purpose of managing your clipart. CookiesOur site uses cookies. Cookies are small files that are transferred to your computer's hard drive via your web browser, which enables recognition of your browser and to capture and remember certain information. Cookies can be disabled in your browser. Data Collection Through CookiesWe may periodically collect anonymous usage data whether by first or third party for the purpose of analysis or marketing. Collection is done anonymously and is not tied to any identifiable information. Disclose of informationWe do not sell, trade, release, or otherwise transfer information partially or in its entirety to any third party unless pursuant of an investigation of suspected unlawful, harmful, or otherwise illegal activity (including enforcement of our site's policies, protection to our rights, property, and/or safety or the rights, property, and/or safety of others), or strictly required to by law as a direct result of such proceedings as a court order or a legal process. California Online Privacy Protection Act ComplianceYour personal information will not be distributed to outside parties without your consent. As part of the California Online Privacy Protection Act, all registered users of our site may make any changes to their information at anytime by logging into their account and editing their profile. Terms and ConditionsYou may view our Terms and Conditions which establish the use, disclaimers, and limitations of liability governing the use of our website here. ConsentBy using our site, you consent and are in agreeance with our privacy policy. ChangesShould our privacy policy ever be changed, updated, or expanded, any revisions to will be posted on this page. Contacting Us If any questions should arise you may contact us using the below information: Fabricatorz Foundation 21 Hollenberg CtSuite Team Air Express Bridgeton, Missouri 63044 email: support@openclipart.org"
