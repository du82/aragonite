lective is made possible by an international team of people who are committed to community-control of technology. Connect with us.Get in touchGet to know us.Browse stories, blog posts, resources, and get support from the community.Explore and learnRead more about how we operate and what projects we have for the present and future.Read our blogInfo for financial sponsorsCase studiesHelp and supportLearn more about how it all works: our philosophy and business model.Visit the support pageRead through our documentationDiscordPricing and Business ModelJoin the movementCollective finances. Collective technology. Collective power.Get started now for free!Get started now!Read our storiesOpen Collective aims to foster transparency and sustainability in communities around the world, see how you could.Subscribe to our newsletterWe send updates once a month.Subscribe"
