description = "Make your community sustainable. Collect and spend money transparently."
full_description = "Support projects & communitiesSupport projects & communitiesJoin these great founders and sponsors supporting Collectives.Join these great founders and sponsors and support amazing initiatives. Transparent contributions and all the tools you need to get rid of the paperwork. All in one place.Discover CollectivesSupport communities and help them grow.The Open Collective platform enables fiscal sponsor entities to host unincorporated groups, giving them a legal structure you can engage with.TransparencyYou can directly see the impact of your contributions, in real time, because Collective budgets are transparentInvoices & ReceiptsGiving money to unincorporated communities, movements, and projects can be an accounting nightmare. Open Collective solves that problem with documentation for each transaction.We’ll take care of the paperworkThe Fiscal Host of the Collective you want to support is an established legal entity who can engage with your vendor systems and purchase order processes, and meet documentation requirements like tax forms and signing agreements.ReportingIn addition to monthly reports, Collectives can post regular updates about their progress and the impact your support is having, plus you can peek at their budget any time—it’s like reporting that writes itself!Plus, get a consolidated monthly invoice for all your contributions on the platform—your accountant will thank you!More featuresDiscover the possibilities of our features.Bulk PaymentsInstead of paying by credit card to each Collective, you can send a single payment to the Fiscal Host for credit to your Organization on the platform. Then you can use this balance to fund as many Collectives as you wish.BackYourStackDiscover your Open Source dependencies and support them.Learn more Sustainers kit:We know making the case up the chain is not always easy. For all you heroes inside companies, we put together some resources to help you succeed.Give the gift of givingCreate gift cards—for employees, clients, recruitment candidates, event attendees—so your community can be empowered to support the Collectives they care about, with your Organization as the recognized funder.Learn More"
