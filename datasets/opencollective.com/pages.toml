ctive collective Red de Democratie (transfer ...Debit from All For Climate to A4C Treasury • March 6, 2025-€78.73EURCompleted Added funds #837374View Details Platform settlement (Platform Share) for Februaryfrom OFi Technologies to All For Climate • March 6, 2025-€13.60 EURPending€Today’s balance€43,860.41 EURTotal income€266,075.05 EURTotal disbursed€222,214.64 EUREstimated annual budget€57,498.09 EURConnectLet’s get the ball rolling!News from All For ClimateUpdates on our activities and progress.❄️ All For Climate Christmas Break ❄️Dear all, As the year draws to a close, we are happy to announce our winter break from December 21st to January 12th. Thank you for your patience, all operations will resume on January 13th.... Read morePublished on December 13, 2024 by MarcoA4C Newsletter: Announcements, workshops, and much more!Hello, Climate Champions! 🌍 We’re back with some exciting announcements, and important statements as we continue our journey towards climate action and collective change. In this edition, we’ll be covering:... Read morePublished on November 8, 2024 by NiallCommunity Assembly 15/10 - Round-upDear collectives We want to thank everyone who joined our autumn Community Assembly on October 15. For those who could not attend, the notes are available... Read morePublished on October 25, 2024 by BabetteView all updates →ConversationsLet’s get the discussion going! This is a space for the community to converse, ask questions, say thank you, and get things done together.+Create a ConversationA4C Cooperation AgreementPublished on January 21, 2025 by XR Belgium Finance CircleHello, If you have recently joined Open Collective, with All for Climate (A4C) as your Fiscal Host, you will have received a request to sign their "Collaboration Agreement" (copy attached). If you have been with A4C for a while you will be...+ 3 7How to Check NCVT ITI Result 2025Published on January 5, 2025 by AlexanderIt's really helpful to know exactly how to check the NCVT ITI result