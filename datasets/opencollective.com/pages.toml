ink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}.css-1hyfx7x{display:none;}.css-16n3y0y-indicatorContainer{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-transition:color 150ms;transition:color 150ms;color:hsl(0, 0%, 80%);padding:8px;box-sizing:border-box;padding-top:0;padding-bottom:0;}.css-16n3y0y-indicatorContainer:hover{color:hsl(0, 0%, 60%);}.css-8mmkcg{display:inline-block;fill:currentColor;line-height:1;stroke:currentColor;stroke-width:0;}Contributions received1487Amount collected$1,486,123.60Tiers# of ContributionsAmountrecurring806$1,096,317.50one-time681$389,806.10View all contributions →AboutYou'll be helping Babel's maintainers manage a project used by most of the world to compile their JavaScript (including most frameworks like React, Ember, Vue) with more than 28 million downloads/week.The funds are generally intended to be used to:Support part/full-time maintainers: most core team members contribute in their spare time, and being able to focus on work would go well with less burnout and a sustainable future for the project as a whole.Allow us to meet in-person as well as attend conferences and TC39 (the committee that specifies JavaScript) meetings which are every 2 months at various companies around the world. This allows us to be involved in the process that moves various JavaScript proposals forward, allowing us to understand and take part in that discussion and be an implementer (similar to other browsers).Babel helps you write the latest version of JavaScript, and is helping shape the future of the language itself. It's used at Facebook, Google, Netflix, and hundreds of other companies.When your target browsers (Chrome, Firefox, Safari, IE) don't support certain features natively, it helps you compile it down to a supported version.In short, developers want to take advantage of the latest syntax in JavaScript before it's implemented in browsers, now. Because the version of JavaScript depends on the client's browser, we can't rely on the fact they are using an up to date browser.Babel abstracts the browser away so that you can worry about writing your application rather than trying to figure out what features are supported in each one.Our teamDaniel TschinderCore ContributorThanks!Henry ZhuCore ContributorLogan SmythCore ContributorBrian NgAdminSven SAULEAUCore ContributorNicolò RibaudoAdminThanks to all the sponsors that make all of thi...Jùnliàng HuángAdminThank you for sponsoring open source.liuxingbaoyuAdminContact Collective"
