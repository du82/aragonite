title = "Climate Sessions - Open Collective"
description = "Canal de difusió artística sobre l'emergècia climàtica"
full_description = '''Climate SessionsCOLLECTIVEcommunityFiscal Host: All For ClimateCanal de difusió artística sobre l'emergècia climàticaThis is Climate Sessions's pageClimate SessionsAboutContributeAll ways to contributeProjectsBudgetTransactionsExpensesConnectUpdatesSubmit ExpenseContactActionsSubmit expenseContactAbout• Per a contribuïr en el projecte, llisca cap abaix! — To contribute, scroll down! •CATALÀClimate Sessions és un canal de difusió artística a Youtube i Instagram sense ànim de lucre, amb l'objectiu de fer divulgació sobre l'emergència climàtica i ecològica i les seves dimensions socials. Climate Sessions és un projecte independent que forma part del teixit de moviments ecologistes de Barcelona, i que col·labora estretament amb la Xarxa per la Justícia Climàtica.La iniciativa neix de la necessitat de fer arribar el discurs ecologista i la consciència climàtica al públic general, en un llenguatge que acompanyi i a la vegada transcendeixi la comunicació política i la divulgació científica: el de l'art i la cultura. Gravem sessions en directe amb artistes compromesos, produïm contingut audiovisual per acompanyar campanyes activistes i dinamitzem mobilitzacions amb l'ànim d'enriquir els missatges polítics i com a via d'exploració de noves maneres de pensar, ser i viure en un món ferit.Des de Climate Sessions som conscients de la relació d'inter-dependència entre els ecosistemes globals i les vides de les persones i tots els éssers que els habitem. Creiem que, en el context d'emergència climàtica greu en què ens trobem, és necessari informar i conscienciar la ciutadania sobre els impactes a què ens enfrontem, però també inspirar accions, respostes i canvis. Estem convençudes que la cultura i l'art són eines imprescindibles en aquest procés.ENGLISHClimate Sessions is a non-profit ecologist artistic broadcasting channel on Youtube and Instagram. Our goal is to share and produce artistic content about the climate emergency.Climate Sessions is an independent project that actively collaborates with ecologist movements in Barcelona, including the youth movement Fridays for Future.Climate Sessions is born from the need to take the ecologist awareness and discourse to the general public, in a language that both accompanies and transcends political communication, activism and scientific divulgation: from culture, art and emotions. We record live sessions with committed artists, produce audiovisual content to boost activist campaigns and dinamize mobilizations, with the aim to enrich political messages but also to explore new ways of being, thinking and living in a damaged world.From Climate Sessions we are aware of the inter-dependence between global ecosystems and the lives of the people and beings who inhabit them. We think that, in the current context of climate emrgency, it is essential to inform and increase the consciousness on ecology and to inspire actions, responses and social change. We strongly believe that art and culture are powerful tools in this quest.Support us if you think the same way.Instagram: https://www.instagram.com/climatesessions/Youtube: https://www.youtube.com/channel/UCekYgN7YDmOlufR5f8eGvoQOur teamTomeu AspaAdminQui no té un all, té una ceba!BirchAdminI got that nickname in high school :')Martí SoléAdminRecorda que si es fonen els Pols, el Pare Noel ...Gabriel CagideAdminAlexis RossellAdminContact CollectiveContributeBecome a financial contributor.Financial ContributionsRecurring contributionBackerBecome a backer for €5.00 per month and support usStarts at€5 EUR / monthContributeLatest activity byBe the first one to contribute!Recurring contributionSponsorBecome a sponsor for €100.00 per month and support usStarts at€100 EUR / monthContributeLatest activity byBe the first one to contribute!Custom contributionDonationMake a custom one-time or recurring contribution.ContributeLatest activity byAll ways to contribute →ProjectsSupport the following initiatives from Climate Sessions.ProjectClimate Sessions - Season 2Music, dance and climate justiceSee MoreLatest activity by+ 39View all projects →Climate Sessions is all of usOur contributors 7Thank you for supporting Climate Sessions.All contributorsTeamFinancial contributorsTomeu AspaAdminQui no té un all, té una ceba!BirchAdminI got that nickname in high school :')Martí SoléAdminRecorda que si es fonen els Pols, el Pare Noel ...Gabriel CagideAdminAlexis RossellAdminGitCoin Grant...€1,197 EURClaude€20 EURBudgetTransparent and open finances.AllExpensesTransactionsRefund of "Monthly financial contribution to Climate Sess...Debit from Climate Sessions - Season 2 to Eduard • March 4, 2025-€10.00EURCompleted Contribution #505993View Details Jokersfrom sumayyah to Climate Sessions • March 2, 2025-€500.00 EURPendingMonthly financial contribution to Climate Sessions - Seas...Credit from Eduard to Climate Sessions - Season 2 • March 1, 2025+€10.00EURRejected Contribution #505993View Details €Today’s balance€529.94 EURTotal raised€1,179.66 EURTotal disbursed€649.72 EUREstimated annual budget--.-- EURConnectLet’s get the ball rolling!News from Climate SessionsUpdates on our activities and progress.Presentation of the members!Hello! We are Birch and Martí, cofounders and members of Climate Sessions. Both of us are musicians and activists in climate movements like Fridays for Future and Exctinction Rebelion. Our goal is to encourage artists to be part of or colla... Read morePublished on October 21, 2021 by Tomeu AspaView all updates →'''
