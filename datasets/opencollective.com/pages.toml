full_description = "Make your community sustainableCommunity is about trust and sharing. Open Collective lets you manage your finances so everyone can see where money comes from and where it goes. Collect and spend money transparently.Create a CollectiveWatch VideoWhat's great about Open Collective?What's great about Open Collective?Money management made simple, plus great tools for community engagement, budget reporting, and fiscal sponsorship.What can you do with Open Collective?Accept donations and sponsorships, celebrate your supporters, pay expenses, and keep everyone up to date — all in one place.Collect MoneyCollect MoneyReceive funds by credit card, Paypal, or bank transfer, and record everything in your transparent budget. Define different ways people can contribute with customizable tiers and rewards.Spend MoneySpend MoneyAnyone in your community can submit expenses. Once approved, pay in one click with Paypal or bank transfer. All transactions are public in your transparent budget (with personal information kept private).Manage MoneyManage MoneyCreate Collectives for different projects for easy budget tracking. No need for messy spreadsheets! Automatic monthly reports make accounting a breeze.How to use Open CollectiveDiscover our features.Share your budgetReceive ContributionsManage ExpensesEngage your communityCelebrate your supportersGet monthly reportsShare your budgetShare your budgetEveryone can see where money comes from and where it goes. Clarity and accountability without any spreadsheets or extra work! Learn more ...Everyone can see where money comes from and where it goes. Clarity and accountability without any spreadsheets or extra work! Learn more ...Receive ContributionsReceive ContributionsAccept payments by credit card, bank transfer, and Paypal. Define custom tiers and set goals to motivate your supporters to give. Learn more ...Accept payments by credit card, bank transfer, and Paypal. Define custom tiers and set goals to motivate your supporters to give. Learn more ...Manage ExpensesManage ExpensesContributors and vendors can easily submit receipts and invoices. You approve or reject them, and once paid your balance updates automatically. Learn more ...Contributors and vendors can easily submit receipts and invoices. You approve or reject them, and once paid your balance updates automatically. Learn more ...Engage your communityEngage your communityPost Updates to engage supporters and share your progress and the impact of their funding. Use Conversations as a community discussion forum. Learn more ...Post Updates to engage supporters and share your progress and the impact of their funding. Use Conversations as a community discussion forum. Learn more ...Celebrate your supportersCelebrate your supportersLeaderboard of your top funders, plus highlight how your whole community contributes in different ways. Leaderboard of your top funders, plus highlight how your whole community contributes in different ways. Get monthly reportsGet monthly reportsA summary of your group’s activities, progress on your budget goals, new contributors, and expense details, with all transaction data and receipts/invoices attached. A summary of your group’s activities, progress on your budget goals, new contributors, and expense details, with all transaction data and receipts/invoices attached. ←→Share your budgetShare your budgetEveryone can see where money comes from and where it goes. Clarity and accountability without any spreadsheets or extra work! Learn more ...Everyone can see where money comes from and where it goes. Clarity and accountability without any spreadsheets or extra work! Learn more ...Do you need a Fiscal Host for your community?Do you need a Fiscal Host?Are you looking for somewhere to hold and distribute money for your project? We can help!Fiscal Hosts handle banking, taxes, accounting, legal, liability, and payments for you.These are our Fiscal Hosts:Find the right Fiscal Host for you:Open Source CollectiveFor open source projectsApply Open Collective EuropeFor EU-based groupsApply Discover more Become a Fiscal HostSupport your community with fundholding and fiscal sponsorship services.Know moreAre you ready to make your community sustainable?Create a CollectiveWho is using Open Collective?Communities around the world are using Open Collective. Find out more about them!Open Source ProjectsBabel CollectiveMore than 2,500 open source communities use Open Collective to receive money from companies and individuals.MeetupsWomen Who CodeNearly 100 chapters of Women Who Code use Open Collective to raise money locally and allocate funding throughout their network.MovementsExtinction Rebellion BelgiumMany local XR groups are using Open Collective to be transparent, engage their communities, and cover their expenses.←→Open Source ProjectsBabel CollectiveMore than 2,500 open source communities use Open Collective to receive money from companies and individuals.MeetupsWomen Who CodeNearly 100 chapters of Women Who Code use Open Collective to raise money locally and allocate funding throughout their network.MovementsExtinction Rebellion BelgiumMany local XR groups are using Open Collective to be transparent, engage their communities, and cover their expenses.Discover moreWe are open in every wayWe not only help you be transparent, we are too!DiscordCome meet the team, chat with the community, and share your questions and stories.Join our Discord →DocumentationSupport your community with fundholding and fiscal sponsorship services.View our documentation →Open Source codeOur code is open source. You can contribute! Check it out on GitHub.See our code base →BlogCase studies, news, and how groups around the world use Open Collective.Visit our blog →Open FinancesWe operate as an Open Collective ourselves, with transparent budgets.See our Collectives →Open CompanyOur metrics, financials, and other documents are public.See our public company →Contribute to the platform!Open Collective is free for charitable initiatives. We rely on generosity of contributors like you to make this possible.DonateJoin the movementCollective finances. Collective technology. Collective power.Get started now for free!Get started now!Read our storiesOpen Collective aims to foster transparency and sustainability in communities around the world, see how you could.Subscribe to our newsletterWe send updates once a month.Subscribe"
