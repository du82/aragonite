["https://opencollective.com/become-a-host"]
title = "Open Collective - Make your community sustainable. Collect and spend money transparently."
description = "Make your community sustainable. Collect and spend money transparently."
full_description = "Fiscal sponsorship has never been easierFiscal sponsorship has never been easierOpen Collective is purpose-built to streamline your processes, reduce overhead, increase transparency, and enable your organization to hold and manage funds for more projects in less time. Learn more.Join as a Fiscal HostWho are Fiscal Hosts?Nonprofits and charitiesWho want to enable unincorporated projects that further their mission areas to receive grants and donations under their umbrella. Networks of groups or chaptersWho want to enable local fundraising while operating a single common legal entity, such as meetups and social movements. Grantmakers and funding institutionsWho want to lower the barriers for unincorporated projects and informal initiatives, while ensuring robust oversight. Any entity with a bank accountWho runs multiple projects and wants to use the Open Collective platform features for transparent budget tracking, combining revenue streams, expense payment management, and community engagement. Fiscal sponsorship service providersIn their chosen geography or industry area. Learn more about fiscal hosting.What are the benefits to host with us?Accept donations and sponsorship, celebrate your supporters, pay expenses, and keep everyone up to date — all in one place.Reduce overheadWhen you’re managing funds for multiple projects or groups, it's easy to get overwhelmed by complex spreadsheets and countless email threads. Open Collective automates budget tracking, reporting, expense processing, and payments, making your job a lot easier.Increase capacityOpen Collective makes it possible for you to offer more services to more projects in less time. Large numbers of transactions won’t overwhelm you, because the platform automates most of the work, and also collects any fund holding fees you set.A better experienceReporting is automatic and real-time, so everyone can see the up to date budget at any time. Projects can have more direct control over their funds, while fiscal sponsors can ensure everything is done according to their policies.Keep track of all the budgetsKeep track of all the budgets Create Collectives for as many projects as you need, in a few clicks, at no extra cost. Each has its own page for fundraising, budget tracking, and community engagement. Incoming payments are added to the balance of the right Collective. No spreadsheets required!Easy expense managementEasy expense managementTo withdraw funds, payees submit expenses through the platform, with associated invoices and receipts. Easily view and approve expenses through your admin dashboard—payment via bank transfer or Paypal is built-in, so you can pay in a single click.Combine funding sourcesCombine funding sourcesCollectives can seek support through diverse channels while tracking everything in one budget. Crowdfunding, credit card payments, and event ticket sales are built-in, and you can easily credit funds coming in by any other means to the right budget.In-depth reportsIn-depth reportsNo need to spend time creating reports for funders—it’s all documented automatically and transparently as you go. In addition, you'll receive a consolidated report every month with all transactions and documentation included. Your accountant will thank you!Who is using Open Collective?Communities around the world are using Open Collective. Find out more about them!Women Who Code“Whenever we start a new meetup chapter, we pair it with an Open Collective so they have the means to raise money under our umbrella.“Social Change Nest“We have been able to support over 150 Mutual Aid groups to get going quickly by providing them with fiscal hosting back office support.“Open Source Collective“We provide financial and legal infrastructure for thousands of open source projects. We’re an API between the world of distributed collaboration and the world of accounting and invoices.“All for Climate“A fiscal sponsor for your local climate justice group, we act as a shared administrative back office so that local groups can focus on their actions.“←→Women Who Code“Whenever we start a new meetup chapter, we pair it with an Open Collective so they have the means to raise money under our umbrella.“Social Change Nest“We have been able to support over 150 Mutual Aid groups to get going quickly by providing them with fiscal hosting back office support.“Open Source Collective“We provide financial and legal infrastructure for thousands of open source projects. We’re an API between the world of distributed collaboration and the world of accounting and invoices.“All for Climate“A fiscal sponsor for your local climate justice group, we act as a shared administrative back office so that local groups can focus on their actions.“Discover more hostsJoin the movementOpen Collective makes fiscal sponsorship shine. Grantees and project participants will love the simplicity and accessibility, and you’ll love the huge reduction of overheads.Join as a Fiscal HostGet started now!Read our storiesOpen Collective aims to foster transparency and sustainability in communities around the world, see how you could.Subscribe to our newsletterWe send updates once a month.Subscribe"
