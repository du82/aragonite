["https://opencve.io/privacy-policy"]
title = "OpenCVE - Opensource Vulnerability Management Platform"
description = "OpenCVE - Opensource Vulnerability Management Platform"
full_description = "OpenCVE is the Opensource Vulnerability Management Platform. We aggregate recognized public sources and prioritize vulnerabilities to alert cyber teams as soon as possible. We collect information about you when you input it into our Site or the Service or otherwise provide it directly to us. We collect information about you when you register for an account, create or modify your profile, and set preferences for the Service. For example, you may provide your contact information, including your first and last name, email address, and password when you register for the Service. We keep track of your preferences when you select settings within the Service, including marketing and notification settings. Instead of creating a user account, you can log in via your account with other platforms (currently not available). We will not collect the password that you use for the relevant platform, but we may collect details from your account with the platform, such as username and email address. You may choose to provide us with information when you contact us about our Service or otherwise interact with us. For example, you may choose to submit information regarding a problem you are experiencing with our Service and send us screenshots to help in resolving the problem. You may submit your contact information to register for our events, to subscribe to receive marketing communications from us, or to make an inquiry through our Site. You may also provide content to us when you participate in a survey, contest, promotion, sweepstake, activity, or event, including via social media and other content platforms. If you register for a paid Service, we will collect purchase information, such as the Service plan that you purchase and information related to refunds, credits, and cancellations, and your billing address and payment information. Please note that any payment information you provide is sent directly to a third-party payment processor. We have no access to and do not store your payment information."
