["https://opendatascience.com/evolving-trends-in-data-science-insights-from-odsc-conference-sessions-from-2015-to-2024"]
title = "Evolving Trends in Data Science: Insights from ODSC Conferences"
description = "Over the past decade, data science has undergone a remarkable evolution, driven by rapid advancements in machine learning, artificial intelligence, and big data technologies. Analyzing nearly a decade’s worth of conference sessions from 2015 to 2024 reveals fascinating shifts in focus areas, popular frameworks, and emerging trends that have shaped..."
full_description = "Over the past decade, data science has undergone a remarkable evolution, driven by rapid advancements in machine learning, artificial intelligence, and big data technologies. Analyzing nearly a decade’s worth of conference sessions from 2015 to 2024 reveals fascinating shifts in focus areas, popular frameworks, and emerging trends that have shaped the field. This blog dives deep into these changes of trends in data science, spotlighting how conference topics mirror the broader evolution of data science. In the early years, data science conferences predominantly focused on foundational topics like data analytics, visualization, and the rise of big data. Tools like Python, R, and SQL were mainstays, with sessions centered around data wrangling, business intelligence, and the growing role of data scientists in decision-making. By 2017, deep learning began to make waves, driven by breakthroughs in neural networks and the release of frameworks like TensorFlow. Sessions on convolutional neural networks (CNNs) and recurrent neural networks (RNNs) started gaining popularity, marking the beginning of data science’s shift toward AI-driven methods. Between 2018 and 2019, deep learning dominated the conference landscape. Researchers and practitioners explored complex architectures, from transformers to reinforcement learning, leading to a surge in sessions on natural language processing (NLP) and computer vision. Framework wars were in full swing: while TensorFlow initially led the pack, PyTorch emerged as a strong contender, especially within the research community. Graph analytics also carved out a niche during this time, with interest in knowledge graphs and graph neural networks growing steadily. The global shift to remote work during the pandemic accelerated interest in MLOps—a set of practices for deploying, monitoring, and scaling machine learning models. Sessions on CI/CD pipelines, model monitoring, and tools like Kubeflow and MLflow spiked in popularity. Simultaneously, concerns around ethical AI, bias, and fairness led to more conversations on Responsible AI. Topics such as explainability (XAI) and AI governance gained traction, reflecting the growing societal impact of AI technologies."
author = "ODSC Team"
year_published = 2025
