["https://opendatascience.com/introducing-the-topic-tracks-for-odsc-east-2025-spotlight-on-gen-ai-ai-agents-llms-more"]
title = "Introducing the Topic Tracks for ODSC East 2025: Spotlight on Gen AI, AI Agents, LLMs, & More - Open Data Science - Your News Source for AI, Machine Learning & more"
description = "As AI continues to advance at an unprecedented pace, the demand for cutting-edge skills and practical knowledge has never been greater. At ODSC East 2025, we’re excited to present 12 curated tracks designed to equip data professionals, machine learning engineers, and AI practitioners with the tools they need to thrive..."
full_description = "As AI continues to advance at an unprecedented pace, the demand for cutting-edge skills and practical knowledge has never been greater. At ODSC East 2025, we’re excited to present 12 curated tracks designed to equip data professionals, machine learning engineers, and AI practitioners with the tools they need to thrive in this dynamic landscape. Whether you want to master generative AI, deploy AI agents, or streamline your machine learning pipelines with MLOps, ODSC East 2025 has something for you. Generative AI has captured the world’s attention with tools like ChatGPT, DALL-E, and Stable Diffusion revolutionizing how we create content and automate tasks. This track will help you go beyond the hype to develop hands-on skills in building and deploying generative AI models in your organization. Who Should Attend: Machine Learning Engineers, Data Scientists, Developers, and Product Managers eager to implement generative AI in their work. AI agents are transforming how businesses operate by performing complex tasks independently, improving productivity and decision-making. This track dives into the design, development, and deployment of intelligent agents that leverage LLMs and machine learning. Who Should Attend: Data Scientists, Developers, AI Architects, and ML Engineers seeking to build cutting-edge autonomous systems. Large language models (LLMs) and retrieval-augmented generation (RAG) have become foundational to AI development. This track will cover the latest techniques, tools, and applications to help you deploy more accurate, reliable, and contextually aware language models. Who Should Attend: NLP Specialists, ML Engineers, Data Scientists, and AI Researchers interested in the future of LLMs. Stay ahead of the curve with insights into the future of AI. This track brings together industry pioneers and leading researchers to showcase the breakthroughs shaping tomorrow’s AI landscape. Who Should Attend: Senior Data Professionals, AI Researchers, Business Leaders, and Developers planning for the future of AI."
author = "ODSC Team"
year_published = 2025
