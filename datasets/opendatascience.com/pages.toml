["https://opendatascience.com/announcing-the-first-speakers-updates-for-the-odsc-east-2025-gen-aix-summit"]
title = "Announcing the First Speakers & Updates for the ODSC East 2025 Gen AiX Summit - Open Data Science - Your News Source for AI, Machine Learning & more"
description = "Dive deep into all things generative AI adoption and implementation with the GenAi X Summit, co-located with ODSC East this May. Featuring two days of talks and panels from world-class industry and AI experts, this summit will explore best practices for harnessing the power and potential of Generative AI. Check..."
full_description = "Dive deep into all things generative AI adoption and implementation with the GenAi X Summit, co-located with ODSC East this May. Featuring two days of talks and panels from world-class industry and AI experts, this summit will explore best practices for harnessing the power and potential of Generative AI. Check out our first-announced speakers below! Build the knowledge and skills necessary to harness the power of AI at the GenAi X Summit, co-located with East 2025 this May 13th-14th. Join industry experts, researchers, and practitioners for 2 days of talks and panels covering a wide range of topics from Agents and Automation to Ethics and Governance. Get a 2-day business pass for access to GenAI X Summit’s talks and panels, ODSC Keynotes, the AI Expo and Solution Showcase Talks, and extensive networking events. Or get a 3-day business pass to expand your access to Data Engineering Summit talks and workshops and ODSC East talks. This exclusive round-table discussion brings together 20-25 business leaders, data scientists, and AI experts from diverse industries. As AI transitions from concept to real-world application, this forum will delve into its transformative potential while tackling the unique challenges companies face in adoption and implementation These invite-only round-table sessions will take place during ODSC East, happening May 13-15, 2025, at the Boston Convention & Exhibition Center. Stay tuned in the coming weeks for more information on this exciting opportunity. Also new to ODSC East 2025, the Executive Track is an exclusive, invite-only part of the Gen Ai X Summit. In a half-day roundtable format, attendees will learn how to move from ideation to implementation and get their AI ideas off the ground into actionable, deliverable results. This track also includes breakfast, lunch, and networking. Chen Wang is a leading force in AI innovation and strategic partnerships, currently shaping the future of AI applications as the Lead Alliance Solution Architect at AI21 Labs. With a distinguished career spanning key roles at IBM and DataRobot, he has been instrumental in advancing AI adoption across industries. His deep technical expertise, backed by a Ph.D. in Physics from NYU, extends from AI modeling techniques to deep learning and time series forecasting. Chen’s work at the intersection of AI research and industry partnerships makes him a must-hear speaker for anyone looking to understand the real-world impact of cutting-edge AI solutions."
