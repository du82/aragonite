["https://opendatascience.com/join-the-open-data-science-contributor-community"]
title = "Join the Open Data Science Contributor Community"
description = "Do you want to write for data science blogs? Scroll through our FAQs and style guide to see how you can join the open data science contributor community!"
full_description = "Do you want to write for data science blogs? Do you want your ideas shared to thousands of members of the data science community? Do you have interesting experience or tech insights? Then you’re probably in the right place. Scroll through our FAQs and style guide to see how you can join the open data science contributor community! Basically anyone can contribute as long as you’re able to produce quality work that fits our audience and subject areas. Our audience is composed of data scientists of all levels, including entry-level employees, mid-level “in the weeds” scientists, managers and decision makers, academics, researchers, and more. We do not post fluff and aim to create technical content, largely designed for mid-level data scientists or decision makers/management. First, read and search through our website to make sure your idea hasn’t already been written. If something similar has already been created but you want to keep that topic, try to come up with a new angle that we haven’t yet covered. Then, reach out to our blog team (blogs@odsc.com) with as much information as you can provide. This should, at least, include your idea, your background/experience level with the topic, and your expected completion date. From there, we’ll look at your pitch and get back to you in a timely manner if we’re able to move forward. Note: You must send a pitch before you send an article directly, otherwise the topic may not resonate with our audience. We do not accept content that has been published on another site already. There are a few different ways that we receive content to post on the site, after your article has been approved to write. All authors get credit for their writing with a by-line. If you’re submitting an article for the first time, please include your full name, a headshot, and a short bio (up to 180 characters), so we may create a profile for you. When your article is posted, readers will be able to click on your name, see that information, and read anything else you’ve written for us."
