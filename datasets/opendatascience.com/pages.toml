["https://opendatascience.com/data-driven-decision-making-with-explainable-machine-learning"]
title = "Data-Driven Decision-Making with Explainable Machine Learning - Open Data Science - Your News Source for AI, Machine Learning & more"
description = "Editor’s note: Patrick Hall of HallResearch.ai and GWU is a speaker for ODSC East 2025 this May 13th to 15th. Be sure to check out his talk, “Explainable AI for Decision-Making Applications,” there! Decades of research and practice in statistical and machine learning (ML) have led up to this moment...."
full_description = "Editor’s note: Patrick Hall of HallResearch.ai and GWU is a speaker for ODSC East 2025 this May 13th to 15th. Be sure to check out his talk, “Explainable AI for Decision-Making Applications,” there! Decades of research and practice in statistical and machine learning (ML) have led up to this moment. Brace yourself–because I’m not going to say chatbots, agents, and AGI. I’m talking about the advent of sophisticated, highly performant, and nearly fully transparent ML models for decision-making and decision support. I know I’m old-fashioned, and most practitioners will continue to use black-box unexplainable ML. Why wouldn’t they? It’s easy, makes it hard to question their implementations, and makes them look great in test data. Many so-called data scientists are even okay with asking a chatbot for classifications these days. However, if you’re really a scientist, you’re obligated to do better than that for decision support applications. We can build transparent, robust, verifiable systems with reproducible results that elegantly enable appeal and override. Moreover, some of us must meet regulatory requirements, explain our systems to attorneys and policymakers, and be sure that our predictions are as correct as possible for high-impact use cases. Chatbots and black boxes don’t hold up well in these circumstances. Intrigued? If this interests you, I’m offering my explainable ML workshop at this year’s ODSC East conference. I’ve offered variants of this workshop for banks and government agencies in multiple countries and on popular online platforms. Now, I’ll be doing it in person in Boston this May. Here’s what I plan to cover in the workshop: This workshop isn’t for everyone, and it’s out of sync with the current and crushing generative AI hype cycle. So, I’d be thrilled to see you there. If you do attend, I promise to offer workable ML solutions for people and organizations and an alternative perspective to the loud, omnipresent, but often hollow, talk tracks that dominate the discourse in our field right now."
author = "ODSC Community"
year_published = 2025
year_updated = 2025
