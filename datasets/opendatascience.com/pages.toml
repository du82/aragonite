["https://opendatascience.com/modern-technology-and-the-foundation-of-data"]
title = "Bill Inmon on Modern Technology and the Foundation of Data"
description = "Editor’s note: Bill Inmon is a speaker for ODSC East 2025 this May 13th to 15th! Be sure to check out his talk, “Building AI’s Foundation: The Critical Role of Data Architecture,” there! Modern technology – AI, ChatGPT, ML – is great. Modern technology has tremendous potential. Modern technology is..."
full_description = "Editor’s note: Bill Inmon is a speaker for ODSC East 2025 this May 13th to 15th! Be sure to check out his talk, “Building AI’s Foundation: The Critical Role of Data Architecture,” there! Modern technology – AI, ChatGPT, ML – is great. Modern technology has tremendous potential. Modern technology is built and serviced by vendors who make great promises about what the future can look like. But there is an Achilles heel to all modern technology. That Achilles Heel is that ALL modern technology depends on the assumption that there is a solid foundation of data on which to operate. Modern technology depends on a solid foundation of data, and modern technology depends on the premise that the foundation of data is available, complete, and accurate. Yet there is no such foundation of data that exists in the corporation that is believable. The underlying foundation of data is a pig sty in most corporate environments. There are many reasons why the underlying foundation of data in the corporation is in such a terrible state of repair. In order to understand how the underlying foundation of data got to be so disorganized and scattered, consider the evolution of the data found in the corporation. In the beginning were applications. Applications were designed to suit the needs of a department or small collection of users. Soon, in the corporation there were a very large number of applications. And with this large number of applications arose a problem with the believability of data. In one application element ABC had a value of 20. In another application ABC had a value of 0. In another application ABC had a value of 675. Trying to make informed decisions on this motley and contradictory collection of values was impossible. Furthermore, trying to rectify what value was actually correct was even more difficult. Certain organizations in the corporation – accounting, marketing, finance, and sales – needed to look across the corporation and create an enterprise-wide view of data. These organizations could not do it based on a collection of applications."
author = "ODSC Community"
year_published = 2025
