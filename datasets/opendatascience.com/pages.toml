["https://opendatascience.com/just-do-something-with-ai-bridging-the-business-communication-gap-for-ml-practitioners"]
title = "Bridging the Business Communication Gap for ML Practitioners"
description = "Editor’s note: Stephanie Kirmer is a speaker for ODSC West this October 29th-31st. Be sure to check out her talk, “Just Do Something with AI: Bridging the Business Communication Gap for ML Practitioners,” there! It’s an increasingly common experience among data scientists – you’re minding your own business, getting your..."
full_description = "Editor’s note: Stephanie Kirmer is a speaker for ODSC West this October 29th-31st. Be sure to check out her talk, “Just Do Something with AI: Bridging the Business Communication Gap for ML Practitioners,” there! It’s an increasingly common experience among data scientists – you’re minding your own business, getting your job done, and your boss’s boss walks into your office or drops into your Slack DMs. “Do we have AI in the product? What’s your plan for making our product AI-powered?” (That’s if you don’t just get ambushed with this question in a big meeting in front of a bunch of executives.) Of course, none of these is the best approach if your goal is to benefit your own career and also to effectively support the business. (If your goal is something else, then this article is not for you.) Who is asking you for this, and what is their motivation? What are their priorities for the business, and how does AI fit in? As a data scientist, I’ve spent a career thinking about why people are asking for a specific machine learning solution and determining whether that will actually serve their goals or not. It’s not reasonable for those of us in the field to assume that everyone else in the business understands the deep inner workings of machine learning. It’s normal that they may have some misconceptions about what the right ML tool is for their problem, through no fault of their own. I’m a big believer in educating your organization about the essentials of machine learning and data science, even people who don’t work on tech teams or rarely collaborate with you. This is because, first, I think everyone should have a foundational level of science literacy in order to better understand our society and economy, and I have the ability to help with that. Second, selfishly, having colleagues who understand ML and AI better will make my job easier in just such situations as this. I’d actually recommend your first question be “What results are we hoping to achieve with AI?” Asking this may lead the requester to reconsider the wisdom of the idea if it isn’t well thought out. If they do have a business reason for this, however, you’ll start to get some insight into that. There may very well be a business problem occurring that really needs to be solved. However, if they just say “Everyone has AI now” and look at you blankly, then you have my permission to just say “No” and go back to work."
author = "ODSC Community"
year_published = 2024
