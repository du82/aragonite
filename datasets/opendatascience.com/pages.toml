title = "Announcing the First Keynotes for ODSC East 2025 - Open Data Science - Your News Source for AI, Machine Learning & more"
description = "The long wait is over! Our first group of world-class Keynote Speakers for ODSC East 2025 is confirmed! In the rapidly developing fields of AI and data science, innovation is constant, and constantly advances by leaps and bounds. Our renowned Keynote Speakers will help you navigate this ever-changing (and exciting)..."
full_description = "The long wait is over! Our first group of world-class Keynote Speakers for ODSC East 2025 is confirmed! In the rapidly developing fields of AI and data science, innovation is constant, and constantly advances by leaps and bounds. Our renowned Keynote Speakers will help you navigate this ever-changing (and exciting) landscape. Regina Barzilay is a trailblazer at the intersection of AI and healthcare, revolutionizing how machine learning is applied to drug discovery and cancer detection. As the School of Engineering Distinguished Professor for AI and Health at MIT and a core member of CSAIL, her groundbreaking work in natural language processing and deep learning has earned her prestigious accolades, including a MacArthur Fellowship and the first-ever $1 million AAAI Squirrel AI Award for AI’s Benefit to Humanity. Her pioneering research has transformed oncology and chemistry, proving the real-world impact of AI on saving lives. Manuela Veloso is a pioneering force in artificial intelligence and robotics, currently leading AI Research at JPMorgan Chase and serving as the Herbert A. Simon University Professor Emerita at Carnegie Mellon University. Her illustrious career spans groundbreaking research in AI, robotics, and autonomous agents, with a focus on creating AI systems that seamlessly integrate with human activities. As a co-founder of RoboCup, she has propelled advancements in AI and robotics through this international robot soccer competition. With over 250 scientific publications and a legacy of leadership in AI research, Veloso’s insights continue to shape the future of technology. Professor Eric Xing’s pioneering research in machine learning and statistical methodology has significantly advanced automated learning and decision-making across artificial, biological, and social systems. Beyond academia, Prof. Xing co-founded Petuum Inc., a company dedicated to democratizing AI technology, which was recognized as a World Economic Forum Technology Pioneer in 2018. His extensive publication record and leadership in AI research make him an influential figure shaping the future of technology."
