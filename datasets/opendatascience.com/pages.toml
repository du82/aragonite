["https://opendatascience.com/deep-learning-for-financial-trading-with-sofien-kaabar"]
title = "Podcast: Deep Learning for Financial Trading with Sofien Kaabar"
description = "Learn about cutting-edge developments in AI and Data Science from the experts who know them best on ODSC’s Ai X Podcast. Each week we release an interview with a leading expert, core contributor, experienced practitioner, or acclaimed instructor who is helping to shape the future of the AI industry through..."
