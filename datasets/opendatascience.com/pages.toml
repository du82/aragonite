["https://opendatascience.com/microsoft-is-urging-trump-reconsider-bidens-ai-diffusion-rule-amid-global-ai-race"]
title = "Microsoft is Urging Trump Reconsider Biden’s AI Diffusion Rule Amid Global AI Race"
description = "Microsoft is calling on the Trump administration to revise a Biden-era AI export rule, warning that the restrictions could weaken U.S. technological leadership and hand China a strategic advantage in the global AI race. The company argues that the AI Diffusion Rule, introduced by the Biden administration, places unnecessary limitations..."
full_description = "Microsoft is calling on the Trump administration to revise a Biden-era AI export rule, warning that the restrictions could weaken U.S. technological leadership and hand China a strategic advantage in the global AI race. The company argues that the AI Diffusion Rule, introduced by the Biden administration, places unnecessary limitations on American AI exports to key allied nations. As written, the rule categorizes countries such as Switzerland, Poland, Greece, Singapore, India, Israel, and Saudi Arabia as “Tier Two” partners, imposing strict caps on the amount of AI computing power they can receive from U.S. firms. Microsoft contends that this approach is driving these countries to seek AI infrastructure elsewhere—potentially boosting China’s influence in the sector. “Customers in Tier Two countries now worry that an insufficient supply of critical American AI technology will restrict their opportunities for economic growth,” Microsoft stated. The company warns that if these restrictions remain, the unintended consequence will be to “encourage Tier Two countries to look elsewhere for AI infrastructure and services.” Microsoft, which plans to invest $80 billion in AI infrastructure this year—more than half of it in the U.S.—says its ability to expand domestically depends on securing overseas markets. The company points to its $700 million data center expansion in Poland as an example of how global investments also benefit American workers. The project has supported jobs in Lafayette, Indiana, where advanced electrical generators are manufactured for export. At the heart of Microsoft’s concerns is the broader economic impact. The AI Diffusion Rule, designed to safeguard national security by preventing adversaries from acquiring cutting-edge AI capabilities, includes strict provisions to ensure chips are deployed only in secure, certified data centers. Microsoft supports these measures but argues that the additional quantitative limits placed on allies are unnecessary and counterproductive."
author = "ODSC Team"
year_published = 2025
year_updated = 2025
