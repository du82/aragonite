["https://opendns.com/privacy-policy"]
title = "Privacy Statement | OpenDNS"
description = "OpenDNS Online Privacy Policy."
full_description = '''Cisco Online Privacy Statement Cisco Systems, Inc. and its subsidiaries (collectively "Cisco") are committed to protecting your privacy and providing you with a positive experience on our websites and while using our products and services ("Solutions"). This Privacy Statement applies to Cisco websites and Solutions that link to or reference this Privacy Statement and describes how we handle Personal Data and the choices available to you regarding collection, use, access, and how to update and correct your Personal Data. Additional information on our Personal Data practices with respect to Cisco Solutions may be provided in Solution specific privacy data sheets and maps, offer descriptions, or other notices provided prior to or at the time of data collection. Certain Cisco websites and Solutions may have their own privacy documentation describing how we handle Personal Data for those websites or Solutions specifically. To the extent a specific notice for a website or Solution differs from this Privacy Statement, the specific notice will take precedent. If there is a difference in translated, non-English versions of this Privacy Statement, the U.S.-English version will take precedence. What is Personal Data? "Personal Data" is any information that can reasonably be used to identify an individual, or otherwise make an individual identifiable, and may include name, address, email address, phone number, login information (such as account number and password), social media account information, or payment card number. The types of Personal Data we may process depend on the business context and the purposes for which it was collected. It may include: Contact, subscription, and account/registration details, as well as online identifiers; Login credentials where we require an account be made; Communications content (such as audio, video, text), social media and discussion forum, or other communications details when you interact with Cisco; Financial Information (such as bank account details or credit card information); Details of an individual's business and other interests and opinions (such as information held in a customer relationship management database); and Information about the user and usage of our websites and Solutions, including System Information such as device identifiers and telemetry (such as IP or MAC address) when such data is linked or tied to a specific individual’s device. If we link other data with your Personal Data, we will treat that linked data as Personal Data. Collection and use of your Personal Data We may collect data, including Personal Data, about you as you use our websites and Solutions and interact with us. We also acquire Personal Data from trusted third-party sources and engage third parties to collect Personal Data on our behalf, in accordance with applicable laws. We may use your Personal Data for the purposes of operating and helping to ensure the security of our business; delivering, improving, and customizing our websites and Solutions; sending notices, marketing, and other communications; and for other legitimate purposes permitted by applicable law. We collect Personal Data for a variety of business reasons, such as: Customer relationship management and administration; Order processing, including billing and payment; Asset recovery and product returns and replacements; Creating and managing user accounts; Provisioning websites and Solutions and enabling the use of certain features; Analyzing, personalizing, improving accuracy, and enhancing user experience, communications, and interactions; Sending communications to you, including for marketing or customer satisfaction purposes, either directly from Cisco or from our partners; Managing communications preferences. You can modify your communication preferences at any time. See Your choices and selecting your communication preferences below; Contract performance, Solution delivery, and customer service; Managing job applications; Administering online education, testing, and certifications; Facilitating conferences, webinars, and other events; Protecting Cisco, our users, websites and Solutions, and others. If you choose to provide Cisco with a third party's Personal Data (such as name, email, and phone number), you represent that you have the third party's permission to do so. Examples include forwarding reference or marketing material to a friend or sending job referrals. Third parties may unsubscribe from any future communication following the link provided in the initial message or by submitting a Privacy Request. In some instances, Cisco and the third parties we engage may automatically collect data through cookies, web logs, web beacons, and other similar applications. Please read the Use of cookies and similar technologies section below for more information. Your privacy rights We need your help to keep your Personal Data accurate and up to date. We provide options to access, correct, suppress, or delete your Personal Data: You can view or edit your Cisco.com Personal Data and preferences online by using the Cisco Profile Management Tool. When Cisco is acting as a "data controller," you can exercise your rights of access and request corrections, suppression, objection, and deletion under applicable data protection laws directly with Cisco as described in the specific website and Solution documentation or by submitting a request through the Privacy Request form. When Cisco is acting as a "data processor," and you wish to exercise your rights of access and request corrections, suppression, or deletion, Cisco will direct you to the data controller under the applicable data protection laws. If you need additional assistance, or help with accessing, correcting, suppressing, or deleting your Personal Data, please feel free to contact us directly. We will respond to your request within 30 days or as appropriate under applicable data protection laws. If we are unable to honor your request or need more time, we will provide you with an explanation. Your choices and selecting your communication preferences We give you the option to receive a variety of information related to our business, programs, websites, and Solutions. You can manage your communication preferences at any time through the following methods: By following the instructions included in each promotional email from us to unsubscribe from that mailing. By completing and submitting this form or by contacting us via mail at: Cisco Systems, Inc., Privacy Office, 170 West Tasman Dr., San Jose, CA 95134, USA. Please be sure to include your name, email address, the communication received, method of delivery (such as post, email, phone call, text), and any additional information about the material you no longer wish to receive. For short message service (“SMS”) messages, reply "STOP," "END," or "QUIT" to the SMS text message you have received. These choices do not apply to service notifications or other required communications that are considered part of certain programs, websites, and Solutions which you may receive periodically unless you cancel or stop use in accordance with its terms and conditions. With your permission, your Personal Data may be shared with third parties (such as Cisco business partners or vendors) so that they may inform you about websites, programs, products, or services that may be of interest to you. To opt out of Cisco sharing with third parties for their marketing purposes, please submit a Privacy Request. By using or engaging with our websites or Solutions, or otherwise providing Personal Data to us, you agree that we may communicate with you regarding security, privacy, and administrative issues relating to your use. For example, if we learn of a security system's breach, we may attempt to notify you by posting a notice on our websites, sending an email, or otherwise contacting you. Disclosing your Personal Data Personal Data may be processed by third parties for the purposes of operating our business; delivering, analyzing, improving, securing, and customizing our websites and Solutions; sending marketing and other communications related to our business; and for other legitimate purposes permitted by applicable law(s); or otherwise with your consent. Personal Data may be disclosed in the following ways: Within Cisco and any of our worldwide subsidiaries for the purposes of data processing, such as marketing, business operations, compliance, security, website or Solution functionality, or storage. With business partners, service vendors, authorized third-party agents, or contractors to provide a requested website, Solution, service, or transaction. Examples include processing of orders and credit card transactions, hosting websites, hosting seminar registration, assisting with sales-related efforts or pre/post-sales support, and providing customer support. With Cisco business partners or vendors, so that they may share information with you about their products or services. To opt out of Cisco sharing with third parties for their marketing purposes, please submit a Privacy Request. In connection with, or during negotiations of, any merger, sale of company assets, consolidation or restructuring, financing, or acquisition of all or a portion of our business by or to another company. In response to a request for information by a competent authority or third party if we believe disclosure is in accordance with, or is otherwise required by, any applicable law, regulation, or legal process. With law enforcement officials, government authorities, or other third parties as necessary to comply with legal process or meet national security requirements; protect the rights, property, or safety of Cisco, our business partners, you, or others; or as otherwise required by applicable law. In aggregated, anonymized, and/or de-identified form that cannot reasonably be used to identify you. If we otherwise notify you and you consent to the sharing. Security of your Personal Data We take reasonable and appropriate steps to protect the Personal Data entrusted to us and treat it securely in accordance with this Privacy Statement. Cisco implements physical, technical, and organizational safeguards designed to protect your Personal Data from accidental or unlawful destruction, loss, alteration, and unauthorized disclosure or access. We also contractually require that our suppliers protect such information from accidental or unlawful destruction, loss, alteration, unauthorized disclosure, or access. Retention and disposal of Personal Data We will retain your Personal Data as needed to fulfill the purposes for which it was collected. We will retain and use your Personal Data as necessary to comply with our business requirements and legal obligations, resolve disputes, protect our assets, and enforce our rights and agreements. We will not retain Personal Data in identifiable form when the purpose(s) for which the Personal Data was collected have been achieved and there is no legal or business need to retain such Personal Data. Thereafter, the data will either be destroyed, deleted, anonymized, and/or removed from our systems. Use of cookies and similar technologies Cisco uses automatic data collection tools, such as cookies, embedded web links, pixels, tags, and web beacons. These tools collect certain standard information that your browser sends to us (such as Internet Protocol [IP] address, MAC address, clickstream behavior, and telemetry). These tools help make your visit to our websites and Solutions easier, more efficient, and personalized. We also use the information to improve our websites and Solutions, provide greater service and value, better understand your potential interest in our websites and Solutions, and provide you with more relevant ads and other content. We partner with third parties to display advertising on our website and to manage our advertising on other sites. Our third-party partners may use cookies or similar technologies to provide you with advertising based on your browsing activities and interests. Where this type of third party advertising is disabled, generic, non-personalized ads will continue to be displayed. For more information, or if you would like to opt out of interest-based advertising, see How Cisco Uses Automatic Data Collection Tools. To update your cookie preferences, click the "Cookies" link at the bottom of any page on this website. Additionally, you may be able to use other tools to control cookies and similar technologies. For example, you may have controls in your internet browser to limit how the websites you visit are able to use cookies. Automated decision-making We process Personal Data using both manual and automated methods of processing. Automated methods are often used to assist our manual methods in accordance with applicable laws. Where an individual's rights and legitimate interests may be impacted by such automated decision-making, we will provide the impacted individual the opportunity to inquire about the decision or request manual review. Manual review may be conducted by Cisco employees or trusted third-party business partners working on Cisco's behalf. Linked websites We may provide links to other third-party websites and services that are outside Cisco's control and governed by the respective third party’s privacy policy, not by this Privacy Statement. We encourage you to review the privacy statements posted on the websites you visit and in the applications you use. Forums and chat rooms If you participate in a discussion forum, local communities, or chat room on a Cisco website, you should be aware that the information you provide there (such as your public profile and comments) will be made broadly available to others and could be used to contact you, to send you unsolicited messages, or for purposes neither Cisco nor you have control over. Also, please recognize that individual forums and chat rooms may have additional rules and conditions. Cisco is not responsible for the Personal Data or any other information you choose to submit in these forums. To request removal of your Personal Data from our blog or community forum, please submit a Privacy Request. In some cases, we may not be able to remove all Personal Data and comments. In such cases, we will provide you with a response and explanation. Children's privacy Cisco encourages parents and guardians to take an active role in their children's online activities. Cisco does not knowingly collect Personal Data from children without appropriate parental or guardian consent. If you believe that we may have collected Personal Data from someone under the applicable age of consent in your country without proper consent, please let us know using the methods described in the Questions, comments, and how to contact us section and we will take appropriate measures to investigate and address the issue promptly. International transfer, processing, and storage of Person'''
year_published = 2025
