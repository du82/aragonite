title = "About OpenDNS - Network Security for Enterprise"
description = "Our goal is to help the world connect with confidence on any device, anywhere, anytime."
full_description = "Improving the internet since 2006 OpenDNS was founded in 2006 with the mission to provide a safer, faster, and better internet browsing experience for all users. Initially, OpenDNS provided a recursive DNS service for use at home, and in 2009 introduced a service for the enterprise market. In 2012, OpenDNS launched an enterprise security product, called Umbrella. Its rapid success and customer adoption led to OpenDNS being acquired by Cisco in 2015. Today, our OpenDNS-branded products are designed to provide consumers with safer, faster, and more reliable internet in their homes. Our enterprise security product, is now branded Cisco Umbrella. To learn more about Cisco Umbrella, visit umbrella.cisco.com Social Media Twitter YouTube Facebook LinkedIn"
