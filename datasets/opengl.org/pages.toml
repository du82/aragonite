["https://opengl.org"]
title = "OpenGL - The Industry Standard for High Performance Graphics"
full_description = "It has been a while in the making but we are very excited to launch the new Vulkan website to the community. Don’t worry, Vulkan is still maintained and owned by The Khronos Group; we just felt that it had outgrown its old website now that it has been five years since the Vulkan 1.0 launch. The original Vulkan website was designed for the launch of a cutting edge new API that would, initially, have limited official materials and community content. The old website performed that role admirably, but Vulkan has come a long way and we now have a large and increasing amount of tools, libraries, educational material, and news to showcase that a single page website cannot handle. The new website allows us to gather all these currently disparate internal and community resources in a single, easily navigable place. Our primary goal with the new vulkan.org site was to place key resources prominently to allow developers to quickly and easily find what they need. With this in mind, each page has buttons in the banner leading straight to the most essential and popular resources. If you need the Vulkan Specification, SDK or Guide you can just jump straight there, no digging needed. The new site has a whole page dedicated to Vulkan tools and support, giving developers access to SDKs, profilers, debuggers, libraries, language bindings, game engines and frameworks all easy to navigate to through a series of quick buttons. This is a huge improvement and it let’s developers discover new tools or quickly find their go to favorites. Vulkan is enjoying a boom in adoption by world class developers and we want to make sure we are showcasing this exciting content to our visitors. As such you’ll notice much more prominent use of imagery across the site that will be updated as time goes on and new content is available. There is also now a dedicated “Made with Vulkan” showcase which is a living list of Vulkan content and reveals just how powerful and versatile the API is. If you have a Vulkan project that you would like to let us know about, please use the linked form on the Made with Vulkan page above the showcase."
