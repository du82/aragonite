["https://opengl.org/resources/benchmarks"]
title = "OpenGL Newsgroups and Mailing Lists"
full_description = "The Graphics and Workstation Performance Group (SPEC/GWPG), a committee of the non-profit Standard Performance Evaluation Corporation, creates standardized performance evaluation benchmarks for systems running professional applications based on the OpenGL API. SPECgpc Overview The Graphics Performance Characterization (SPECgpcSM) organization began in 1993 as SPECopc (OpenGL Performance Characterization), an ad-hoc project group aimed at establishing graphics performance benchmarks for systems running under OpenGL. The group joined SPEC in the summer of 1994. The non-profit SPECgpc project is providing unambiguous methods for comparing graphics performance across vendor platforms, operating systems, and windowing environments. SPECgpc Benchmarks The SPECgpc project group develops and distributes SPECviewperf®, which measures the 3D graphics performance of systems running under OpenGL, DX and eventually other application programming interfaces (APIs). For more information on the latest version of SPECviewperf, visit the SPEC/GWPG website. SPECapc Overview SPEC/GWPG's Application Performance Characterization Group (SPECapcSM) was formed in 1997. The group addresses graphics and workstation performance evaluation based on actual software applications. The non-profit SPECapc project provides clear methods for evaluating and comparing the performance of computers across vendor platforms and configurations. SPECapc's benchmarks are application-based, representative of end-user needs, and measure total system performance -- graphics, I/O and CPU. SPECapc benchmarks SPECapc benchmarks require that users have the correct version and build of the application software in order to run the benchmarks. SPECapc benchmarks are continuously updated, and represent primarily CAD/CAM, digital media and visualization applications. For information on current SPECapc benchmarks, visit the SPEC/GWPG website. SPECwpc Overview The Workstation Performance Characterization (SPECwpcSM) project group measures the performance of workstations running algorithms used in popular applications, but without requiring the full application and associated licensing to be installed on the system under test. The SPECwpc benchmark is easy to install and run, but still rigorous enough to provide meaningful, repeatable data for performance evaluation. SPECwpc seeks applications, algorithms and workloads that are representative of those used by typical workstations customers in CAD/CAE, Digital Media & Entertainment, Finance, Health Sciences, Energy, and other professions. SPECwpc benchmarks The SPECwpc project group develops and distributes the SPECwpc benchmark, which measures all key aspects of workstation performance based on diverse professional applications. For more information on the latest version of SPECwpc, visit the SPEC/GWPG website. Downloading SPEC/GWPG benchmarks Visit the SPEC/GWPG download page to acquire any of the organization's current benchmarks. SPEC/GWPG benchmarks are free to non-commercial entities and are available for a licensing fee to commercial entities, defined as any commercial enterprise (except SPEC/GWPG members) that engages in marketing, developing, testing, consulting for and/or selling computers, computer services, graphics devices, drivers or other systems or components in the computer marketplace."
