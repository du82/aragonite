full_description = 'openHAB Artwork # Our Logo Our logo is our most recognizable asset. We therefore ask you to respect our trademark policy when you reuse it - please read through it in detail and do not hesitate to reach out to us in case of any doubts. We provide different versions of our logo, e.g. with or without the "openHAB" text, a vertical and a horizontal version as well as versions for light and dark backgrounds. The logos are provided in different formats like svg, eps, ai and png. Wherever possible, please prefer the vector formats over png to avoid pixelation. A special version is the "works with openHAB" logo, which is intended to be used by 3rd-parties to show that their software, system or product is compatible with openHAB. # Downloads Download the openHAB Logos Download the "works with openHAB" Logos Copyright © 2025 by the openHAB Community and the openHAB Foundation e.V. Privacy policy | Imprint'
