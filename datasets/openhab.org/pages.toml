["https://openhab.org/addons/integrations/homekit"]
title = "HomeKit Add-on - System Integrations | openHAB"
description = "This is an add-on that exposes your openHAB system as a bridge over the HomeKit protocol."
full_description = '''# HomeKit Add-on This is an add-on that exposes your openHAB system as a bridge over the HomeKit protocol. Using this add-on, you will be able to control your openHAB system using Apple's Siri, or any of a number of HomeKit enabled iOS apps. In order to do so, you will need to make some configuration changes. HomeKit organizes your home into "accessories" that are made up of a number of "characteristics". Some accessory types require a specific set of characteristics. HomeKit integration supports following accessory types: Switchable Outlet Lighting (simple, dimmable, color) Fan Thermostat Heater / Cooler Lock Security System Garage Door Opener Motorized Door Motorized Window Window Covering/Blinds Slat Valve Faucet / Shower Speaker SmartSpeaker Microphone Air Quality Sensor Contact Sensor Leak Sensor Motion Sensor Occupancy Sensor Smoke Sensor Temperature Sensor Humidity Sensor Light Sensor Carbon Dioxide Sensor Carbon Monoxide Sensor Battery Filter Maintenance Television Irrigation System # Quick start install homekit addon via UI add metadata to an existing item (see UI based configuration) scan QR code from UI->Settings->HomeKit Integration open Home app on your iPhone or iPad create new home add accessory scan QR code from UI->Setting-HomeKit Integration click "Add Anyway" follow the instruction of the Home app wizard Add metadata to more items or fine-tune your configuration using further settings # Global Configuration You can define HomeKit settings either via mainUI or via $OPENHAB_CONF/services/homekit.cfg. HomeKit works with default settings, but we recommend changing the pin for the bridge. This will be used in iOS when pairing without QR Code. The pin code is in the form "###-##-###". Requirements beyond this are not clear, and Apple enforces limitations on eligible pins within iOS. At the very least, you cannot use repeating (111-11-111) or sequential (123-45-678) pin codes. Other settings, such as using Fahrenheit temperatures and specifying the interface to advertise the HomeKit bridge are also illustrated in the following sample: org.openhab.homekit:port=9123 org.openhab.homekit:pin=031-45-154 org.openhab.homekit:useFahrenheitTemperature=true org.openhab.homekit:networkInterface=192.168.0.6 org.openhab.homekit:useOHmDNS=false org.openhab.homekit:blockUserDeletion=false org.openhab.homekit:name=openHAB org.openhab.homekit:instances=1 org.openhab.homekit:useDummyAccessories=false Some settings are only visible in UI if the checkbox "Show advanced" is activated. # Overview of all settings Setting Description Default value networkInterface IP address or domain name under which the HomeKit bridge can be reached. If no value is configured, the add-on uses the primary IP address configured for openHAB. If unsure, keep it empty (none) port Port under which the HomeKit bridge can be reached. 9123 useOHmDNS mDNS service is used to advertise openHAB as HomeKit bridge in the network so that HomeKit clients can find it. openHAB has already mDNS service running. This option defines whether the mDNS service of openHAB or a separate service should be used. false blockUserDeletion Blocks HomeKit user deletion in openHAB and as result unpairing of devices. If you experience an issue with accessories becoming non-responsive after some time, try to enable this setting. You can also enable this setting if your HomeKit setup is done and you will not re-pair ios devices. false pin Pin code used for pairing with iOS devices. Apparently, pin codes are provided by Apple and represent specific device types, so they cannot be chosen freely. The pin code 031-45-154 is used in sample applications and known to work. 031-45-154 useFahrenheitTemperature Set to true to use Fahrenheit degrees, or false to use Celsius degrees. Note if an item has a QuantityType as its state, this configuration is ignored and it's always converted properly. false name Name under which this HomeKit bridge is announced on the network. This is also the name displayed on the iOS device when searching for available bridges. openHAB instances Defines how many bridges to expose. Necessary if you have more than 149 accessories. Accessories must be assigned to additional instances via metadata. Additional bridges will use incrementing port numbers. 1 useDummyAccessories When an accessory is missing, substitute a dummy in its place instead of removing it. See Dummy Accessories. false # Item Configuration After setting the global configuration, you will need to tag your openHAB items (opens new window) for HomeKit with accessory type. For our purposes, you may consider HomeKit accessories to be of two types: simple and complex. A simple accessory will be mapped to a single openHAB item, e.g. HomeKit lighting can represent an openHAB Switch, Dimmer, or Color item. A complex accessory will be made up of multiple openHAB items, e.g. HomeKit Thermostat can be composed of mode, and current & target temperature. Complex accessories require a tag on a Group Item indicating the accessory type, as well as tags on the items it composes. A HomeKit accessory has mandatory and optional characteristics (listed below in the table). The mapping between openHAB items and HomeKit accessory and characteristics is done by means of metadata (opens new window) If the first word of the item name match the room name in Home app, Home app will hide it. E.g. item with the name "Kitchen Light" will be shown in "Kitchen" room as "Light". This is recommended naming convention for HomeKit items and rooms. # UI based Configuration In order to add metadata to an item: select desired item in mainUI click on "Add Metadata" select "Apple HomeKit" namespace click on "HomeKit Accessory/Characteristic" select required HomeKit accessory type or characteristic click on "Save" # Textual configuration Switch leaksensor_metadata "Leak Sensor" {homekit="LeakSensor"} The tag can be: full qualified: i.e. with accessory type and characteristic, e.g. "LeakSensor.LeakDetectedState" shorthand version: with only either accessory type or characteristic, e.g. "LeakSensor", "LeakDetectedState". if shorthand version has only accessory type, then HomeKit will automatically link all mandatory characteristics of this accessory type to the openHAB item. e.g. HomeKit window covering has 3 mandatory characteristics: CurrentPosition, TargetPosition, PositionState. Following are equal configuration: Rollershutter window_covering "Window Rollershutter" {homekit="WindowCovering"} Rollershutter window_covering "Window Rollershutter" {homekit="WindowCovering, WindowCovering.CurrentPosition, WindowCovering.TargetPosition, WindowCovering.PositionState"} If the shorthand version has only a characteristic then it must be a part of a group which has a HomeKit accessory type. You can use openHAB group to define complex accessories. The group item must indicate the HomeKit accessory type, e.g. LeakSensor definition Group gLeakSensor "Leak Sensor Group" {homekit="LeakSensor"} Switch leaksensor "Leak Sensor" (gLeakSensor) {homekit="LeakSensor.LeakDetectedState"} Switch leaksensor_battery "Leak Sensor Battery" (gLeakSensor) {homekit="LeakSensor.BatteryLowStatus"} # Complex Multiple Service Accessories Alternatively, you may want to have a choice of controlling the items individually, OR as a group, from HomeKit. The following examples defines a single HomeKit accessory with multiple services that the Home app will allow you to control together, or drill down and control individually. Note that AccessoryGroup doesn't expose any services itself, but allows you to group other services together underneath it. Also note that when nesting accessories, you cannot use the shorthand of naming only a characteristic, and not its accessory type, since it would be ambiguous if that item belongs to a secondary service, or to the primary service it's nested under. Group:Switch:OR(ON,OFF) gLight "Light Group" {homekit="AccessoryGroup"} Switch light1 "Light 1" (gLight) {homekit="Lighting"} Switch light2 "Light 2" (gLight) {homekit="Lighting"} You can also group additional accessories directly under another accessory. In this example, HomeKit will show three separate light controls. As this is somewhat confusing that Home will allow controlling all members as a group, and you also have the group as a distinct switch inside the HomeKit accessory, this is not a recommended configuration. Group:Switch:OR(ON,OFF) gLight "Light Group" {homekit="Lighting"} Switch light1 "Light 1" (gLight) {homekit="Lighting"} Switch light2 "Light 2" (gLight) {homekit="Lighting"} You can also mix and match accessories: Group gFan {homekit="Fan"} Switch fan1 "Fan" (gFan) {homekit="Fan.Active"} Switch fan1_light "Fan Light" (gFan) {homekit="Lighting"} Another way to build complex accessories is to associate multiple accessory types with the root group, and then define all of the individual characteristics on group members. When using this style, you cannot have multiple instance of the same accessory type. Group FanWithLight "Fan with Light" {homekit = "Fan,Lighting"} Switch FanActiveStatus "Fan Active Status" (FanWithLight) {homekit = "Fan.ActiveStatus"} Number FanRotationSpeed "Fan Rotation Speed" (FanWithLight) {homekit = "Fan.RotationSpeed"} Switch Light "Light" (FanWithLight) {homekit = "Lighting.OnState"} or in MainUI: Finally, you can link one openHAB item to one or more HomeKit accessories, as well: Switch occupancy_and_motion_sensor "Occupancy and Motion Sensor Tag" {homekit="OccupancySensor,MotionSensor"} You can even form complex sensors this way. Just be sure that you fully specify additional characteristics, so that the addon knows which root service to add it to. Group eBunkAirthings "Bunk Room Airthings Wave Plus" { homekit="AirQualitySensor,TemperatureSensor,HumiditySensor" } String Bunk_AirQuality "Bunk Room Air Quality" (eBunkAirthings) { homekit="AirQualitySensor.AirQuality" } Number:Dimensionless Bunk_Humidity "Bunk Room Relative Humidity [%d %%]" (eBunkAirthings) { homekit="HumiditySensor.RelativeHumidity" } Number:Temperature Bunk_AmbTemp "Bunk Room Temperature [%.1f °F]" (eBunkAirthings) { homekit="TemperatureSensor.CurrentTemperature" } Number:Dimensionless Bunk_tVOC "Bunk Room tVOC [%d ppb]" (eBunkAirthings) { homekit="AirQualitySensor.VOCDensity" [ maxValue=10000 ] } A sensor with a battery configured in MainUI: The Home app uses the first accessory in a group as the icon for the group as a whole. E.g. an accessory defined as homekit="Fan,Light" will be shown as a fan and an accessory defined as homekit="Light,Fan" will be shown as a light in the Home app. You can also override the primary service by using adding primary=<type> to the HomeKit metadata configuration: Group FanWithLight "Fan with Light" {homekit = "Light,Fan" [primary = "Fan"]} on in MainUI: Unusual combinations are also possible, e.g. you can combine temperature sensor with blinds and light. It will be represented by the Home app as follows: Note that for sensors that aren't interactive, the Home app will show the constituent pieces in the room and home summaries, and you'll only be able to see the combined accessory when viewing the accessories associated with a particular bridge in the home settings: # Dummy Accessories OpenHAB is a highly dynamic system, and prone to occasional misconfigurations where items can't be loaded for various reasons, especially if you're using something besides the UI to manage your items. This is a problem for HomeKit because if the bridge makes a connection, but accessories are missing, then the HomeKit database will simply remove that accessory. When the accessory does come back (i.e. because you corrected a syntax error in an .items file, or openHAB completes booting), all customization of that accessory will be lost - the room assignment, customized name, custom icon, status/home screen/favorite preferences, etc. In order to work around this, the HomeKit addon can create dummy accessories for any accessory it has previously published to HomeKit. To enable this behavior, turn on the useDummyAccessories setting. OpenHAB will then simply present a non-interactive accessory for any that are missing. The openHAB log will also contain information whenever a dummy accessory is created. If the item backing the accessory is later re-created, everything will sync back up and nothing will be lost. You can also run the console command openhab:homekit listDummyAccessories to see which items are missing. Apple devices may or may not show "Not Responding" for some or all accessories when there are dummy accessories, since they will no longer be backed by actual items with state. It's recommended that you resolve this state as soon as possible, since HomeKit may decide your entire bridge is being uncooperative, and remove everything itself. If you actually meant to remove an item, you will need to purge the dummy items from the database so that they'll disappear from the Home app altogether. In order to do so, run the console command openhab:homekit pruneDummyAccessories. Alternatively, disabling, saving, and then re-enabling useDummyAccessories in the addon settings will have the same effect. # Accessory Configuration Details This section provides examples widely used accessory types. For complete list of supported accessory types and characteristics please see section [Supported accessory type](#Supported accessory type) # Dimmers The way HomeKit handles dimmer devices can be different to the actual dimmers' way of working. HomeKit Home app sends following commands/update: On brightness change Home app sends "ON" event along with target brightness, e.g. "Brightness = 50%" + "State = ON". On "ON" event Home app sends "ON" along with brightness 100%, i.e. "Brightness = 100%" + "State = ON" On "OFF" event Home app sends "OFF" without brightness information. However, some dimmer devices for example do not expect brightness on "ON" event, some others do not expect "ON" upon brightness change. In order to support different devices HomeKit integration can filter some events. Which events should be filtered is defined via dimmerMode configuration. Dimmer dimmer_light "Dimmer Light" {homekit="Lighting, Lighting.Brightness" [dimmerMode="<mode>"]} Following modes are supported: "normal" - no filtering. The commands will be sent to device as received from HomeKit. This is default mode. "filterOn" - ON events are filtered out. only OFF events and brightness information are sent "filterBrightness100" - only Brightness=100% is filtered out. everything else sent unchanged. This allows custom logic for soft launch in devices. "filterOnExceptBrightness100" - ON events are filtered out in all cases except of brightness = 100%. Examples: Dimmer dimmer_light_1 "Dimmer Light 1" {homekit="Lighting, Lighting.Brightness" [dimmerMode="filterOn"]} Dimmer dimmer_light_2 "Dimmer Light 2" {homekit="Lighting, Lighting.Brightness" [dimmerMode="filterBrightness100"]} Dimmer dimmer_light_3 "Dimmer '''
year_published = 2025
