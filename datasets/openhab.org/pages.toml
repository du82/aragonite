["https://openhab.org"]
title = "openHAB"
description = "openHAB - a vendor and technology agnostic open source automation software for your home"
full_description = '''empowering the smart home a vendor and technology agnostic open source automation software for your home Get Started ➜ Try It ➜ Why openHAB? Integrate Everything With its pluggable architecture openHAB supports more than 400 different technologies and systems and thousands of devices! Automate with Ease Use a powerful and flexible engine to design rules, with time and event-based triggers, scripts, actions, notifications and voice control. Runs Everywhere Run your server on Linux, macOS, Windows, Raspberry Pi, Docker, Synology... Access it with apps for the web, iOS, Android and others. 3d printed case by sumpfing Set up your own openHAB system in just a few steps Try the provided hassle-free "openHABian" image for the Raspberry Pi and other devices. Flash an SD card, boot, and enjoy your up-to-date openHAB setup with conveniently pre-configured system settings and software. Learn How ➜ No Cloud Required... openHAB runs on your hardware, doesn't require any cloud service to work, keeps your data privately at home and talks directly to your local devices whenever possible. At the core of our philosophy is that you always remain in control. ...but Cloud-Friendly Integrations are available for the most popular cloud-based smart home platforms, including Google Assistant, Amazon Alexa, Apple HomeKit and more. Use the openHAB Cloud connector with the free myopenhab.org service or host your own. More than 3000 supported things! Browse All Add-ons ➜ 100% Open Source. 100% Reliable. openHAB is developed in Java™ and built on top of Apache Karaf™, an industry-grade OSGi® runtime. openHAB and its development are supported by the openHAB Foundation, a registered non-profit organisation. Without having a company behind openHAB, it will always stay absolutely vendor-neutral and never lock you in. Ready to join the community? The vibrant openHAB community contributes examples and tutorials on a daily basis and is happy to help you! 23000+ discussions 240000+ posts 22000+ members Showcase ➜ Join Us ➜ Let's Meet Up! Next event See All Events ➜ openHAB is the Best home automation app according to crowdsourced software recommendations on Copyright © 2025 by the openHAB Community and the openHAB Foundation e.V. Privacy policy | Imprint We use cookies for analysis and insights. Privacy Policy Reject Accept'''
