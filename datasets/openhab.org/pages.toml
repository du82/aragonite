full_description = "the openHAB Blog What's going on around openHAB, from the maintainers and the community FOSDEM 2025 Recap Florian Hotze and Felix Hertweck posted on Wednesday, 5 February 2025 Read more ➜ openHAB 4.3 Release Florian Hotze and others posted on Sunday, 15 December 2024 Read more ➜ openHAB @ Linux Magazine Florian Hotze posted on Saturday, 12 October 2024 Read more ➜ openHAB 4.2 Release Florian Hotze and others posted on Sunday, 7 July 2024 Read more ➜ openHAB 4.1 Release Florian Hotze and others posted on Friday, 22 December 2023 Read more ➜ openHAB 4.0 Release Florian Hotze and others posted on Sunday, 23 July 2023 Read more ➜ FOSDEM 2023 is over. It was a blast. Stephan Luckow posted on Wednesday, 8 February 2023 Read more ➜ openHAB 3.4 Release Kai Kreuzer posted on Monday, 19 December 2022 Read more ➜ openHAB 3.3 Release Dan Cunningham posted on Monday, 27 June 2022 Read more ➜ openHAB 3.2 Release Kai Kreuzer and others posted on Monday, 20 December 2021 Read more ➜ openHAB 3.1 Release Kai Kreuzer posted on Monday, 28 June 2021 Our summer release openHAB 3.1 is out! It improves many details over 3.0 and again comes with a huge list of new add-ons. Read more ➜ openHAB 3.0 Release Kai Kreuzer and Yannick Schaus posted on Monday, 21 December 2020 The next major release has arrived with openHAB 3! This is exciting news for our community, as it makes openHAB more modern, simpler and yet more powerful. Read more ➜ openHAB 2.5 Release Kai Kreuzer posted on Sunday, 15 December 2019 A full year has passed since openHAB 2.4 and a lot has happened meanwhile. A new release is overdue and we are happy to announce the new 2.5 release to all of you today! Read more ➜ Smart Home Day @ Hochschule Darmstadt 2019 Jerome Luckenbach posted on Thursday, 18 July 2019 Why should we – as the openHAB community – be present at events? Stephan Luckow posted on Thursday, 6 June 2019 My call to action for our community: Keep in mind (at every occasion) that we have marketing goals. Let's turn interested people into amateurs and turn amateurs into community members. Let's grow the community! Read more ➜ openHAB 2.4 Release Kai Kreuzer posted on Sunday, 16 December 2018 As for the past few years, the openHAB maintainers have decided to do a new release just in time for the holiday season, which is the busiest time of the year in our community. So what could be more welcome than a brand new stable release? Read more ➜ MQTT Arrives in the Modern openHAB 2.x Architecture David Graeff posted on Sunday, 16 December 2018 openHAB 2.4 brings a few noticeable features, one of them is a new way of integrating your MQTT devices. What is MQTT actually? And how does the new implementation differ from what was already available? Read more ➜ Smart Home Day @ EclipseCon Europe 2018 Kai Kreuzer posted on Monday, 29 October 2018 Building the New openHAB Website Yannick Schaus posted on Saturday, 2 June 2018 openHAB 2.3 Release Kai Kreuzer posted on Monday, 28 May 2018 Time flies! The last openHAB release is already more than 5 months old and much has happened since then. It is therefore clearly time to pack and ship all the nice new updates as a stable release: Here comes openHAB 2.3! Read more ➜ openHAB 2.2 Release Kai Kreuzer posted on Monday, 18 December 2017 Smart Home Day @ EclipseCon Europe 2017 Kai Kreuzer posted on Tuesday, 31 October 2017 Smart Home Day 2017 Kai Kreuzer posted on Sunday, 28 May 2017 openHAB 2 has arrived! Kai Kreuzer posted on Monday, 23 January 2017 The openHAB Foundation is Ready for Takeoff! Kai Kreuzer posted on Thursday, 15 December 2016 Since the inception of the idea to start a nonprofit organization around openHAB, some time has passed and we have been working intensively on making it happen! Today, I am very proud to be able to announce that the openHAB Foundation e.V. is up and running and has successfully taken over all sorts of supportive operation for the community. Read more ➜ openHAB 2.0 beta3 Release Kai Kreuzer posted on Sunday, 22 May 2016 Copyright © 2025 by the openHAB Community and the openHAB Foundation e.V. Privacy policy | Imprint"
