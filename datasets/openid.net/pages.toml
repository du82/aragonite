title = "OpenID - OpenID Foundation"
description = "Our mission is to lead the global community in creating digital identity standards that are secure, interoperable, and privacy-preserving."
full_description = "DISCOVER What is OpenID DISCOVER What is OpenID HOW OpenID Works HOW OpenID Works JOIN The OpenID Foundation JOIN The OpenID Foundation Our mission is to lead the global community in creating identity standards that are secure, interoperable and privacy-preserving. Founded in 2007, the OpenID Foundation (OIDF) is a global open standards body committed to helping people assert their identity wherever they choose. We are global vibrant community where identity peers and thought leaders convene to craft the identity ecosystems of tomorrow. Enable real-world identity use cases Find an existing working group, explore all the specifications you can develop with, and certify your implementation using our processes and tools in your journey to adopting open and interoperable identity standards. FIND A WORKING GROUP What are OpenID Working Groups FIND A WORKING GROUP What are OpenID Working Groups EXPLORE SPECIFICATIONS What are OpenID Specifications EXPLORE SPECIFICATIONS What are OpenID Specifications CERTIFY YOUR IMPLEMENTATION What is Self-Certification CERTIFY YOUR IMPLEMENTATION What is Self-Certification Stay up to-date and engage with community experts Expand your knowledge base through our news, whitepapers, and presentations plus engage with community experts at our annual events which you will find by visiting our calendar at the top of the page. NEWS OPIN joins OIDF Board via ... More News NEWS OPIN joins OIDF Board via ... More News EVENTS Attend the OIDF Workshop prior ... More Events EVENTS Attend the OIDF Workshop prior ... More Events PAPERS OpenID Foundation Announces New Whitepaper ... More Papers PAPERS OpenID Foundation Announces New Whitepaper ... More Papers"
