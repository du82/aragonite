full_description = "An Outreach Workshop for Open Banking Chile Mike Leszcz, OpenID Foundation Operations Director This was a hybrid event with some CMF and ecosystem members participating in person in Santiago. OIDF was very fortunate to have founding member and long-time board member, John Bradley with Yubico, representing OIDF in person. The goal of the workshop was to introduce Read More » NIST 800-63 Feedback Sessions Mark your calendars for the OpenID Foundation’s NIST SP 800-63-4 (2nd Public Draft) feedback sessions. In these workshops, we will discuss the draft, gather community inputs, and form the OIDF’s formal response. In support of that effort there are two Zoom Workshops planned on the 19th and 20th September and Read More » OIDF to Co-Host Mobile Drivers License Hackathons Image sourced from Chat GPT The OpenID Foundation is proud to co-host two Hackathons with the California Department of Motor Vehicles (DMV) in support of their Mobile Drivers License (mDL) pilot. What is the Project? In 2021, the California legislature authorized the DMV to start an mDL pilot, and since Read More » Registration Open for OpenID Foundation Hybrid Workshop at Microsoft on Monday, October 28, 2024 Workshop Overview OpenID Foundation Workshops provide technical insight and influence on current digital identity standards while offering a collaborative platform to openly address current trends and market opportunities. This OpenID Foundation Workshop includes a number of presentations focused on 2024 Foundation key initiatives as well as updates from active work Read More » AI for Identity Standards The OpenID Foundation recently convened a panel on Artificial Intelligence and Identity Standards. The panelists included: Nancy Cam-Winget, Cisco Kaelig Deloumeau-Prigent, Netlify Mike Kiser, SailPoint Geraint Rogers, Daon Gail Hodges, OpenID Foundation (moderator) This summary draws out general themes and comments are not attributed to individuals or their organizations. Technology Read More »"
