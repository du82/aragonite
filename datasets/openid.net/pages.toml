description = "The OpenID Foundation will be holding a hybrid workshop on Monday, 7th April 2025, just ahead of the Spring 2025 Internet Identity Workshop (IIW). This hybrid event will take place both in person at Google’s facility in Sunnyvale, CA, and online making it accessible to participants worldwide. Event Details:📅 Date: Monday, April 7th, 2025🕒 Time: 12:30 -"
full_description = "Attend the OIDF Workshop prior to IIW Spring 2025 on 7th April 2025 Published February 20, 2025 The OpenID Foundation will be holding a hybrid workshop on Monday, 7th April 2025, just ahead of the Spring 2025 Internet Identity Workshop (IIW). This hybrid event will take place both in person at Google’s facility in Sunnyvale, CA, and online making it accessible to participants worldwide. Event Details:📅 Date: Monday, April 7th, 2025🕒 Time: 12:30 - 16:00 PST📍 Location: Google, 242 Humboldt Ct, Sunnyvale, CA 94089🚪🚶Room: Zebra Shark💻 Virtual Option: Details on how to join virtually will be emailed to registrants nearer the timeThis meeting is an excellent opportunity for the community to engage with fellow experts, share updates, and collaborate on the latest advancements in across the OIDF specifications and Community Groups. With IIW just around the corner, it’s the perfect chance to align efforts and gain valuable insights before the main workshop begins. Agenda Highlights:Update on OIDF's strategic aims for 2025Working group updatesDiscussion on emerging Digital ID trendsWhy Attend?Engage with leading experts in the industry Shape the future and weigh in on the work of the FoundationPrepare for IIW with discussions relevant to the upcoming workshop Whether you plan to join us in Sunnyvale, CA or virtually, we look forward to your participation in shaping the next phase of digital identity standards.All registered participants will receive a link to participate virtually prior to the workshop.This is an after-lunch workshop with beverages and snacks provided to those attending in person.The Foundation’s Note Well Statement can be found here and is used to govern workshops. We will publish the full agenda soon. In the meantime, you can get ahead and guarantee your place by registering your place today!Please register Via Eventbrite HERE Tagged Workshop"
