["https://openid.net/certification/third-party-support-certification-policy"]
title = "Third-Party Support Certification Policy - OpenID Foundation"
description = "Third-Party Support Certification PolicyThird-Party Support Certification Policy and Available Consultants. The OpenID Foundation operates the certification program utilizing a self-certification approach to provide a low cost, efficient process to provide assurance of compliance with profiles of OpenID specifications. PURPOSEThe OpenID Foundation operates the certification program utilizing a self-certification approach to provide a low cost, efficient"
full_description = "Third-Party Support Certification Policy Third-Party Support Certification Policy and Available Consultants. The OpenID Foundation operates the certification program utilizing a self-certification approach to provide a low cost, efficient process to provide assurance of compliance with profiles of OpenID specifications. PURPOSE The OpenID Foundation operates the certification program utilizing a self-certification approach to provide a low cost, efficient process to provide assurance of compliance with profiles of OpenID specifications.The Foundation employs a team of subject matter experts to continually upgrade and maintain the conformance test suites. Since inception, the Foundation has significantly subsidized the certification program to encourage robust and trusted deployments of OpenID Foundation specifications. Certification fees do not cover the cost of operating the certification program.The certification program team is not resourced to provide consulting services or specific guidance on OpenID specifications, but rather, is narrowly focused on helping those seeking certification understand the process, from performing the tests and interpreting the results through to submitting your self-certification request. If you or your organization require expertise in understanding OpenID specifications or how to successfully configure and deploy, there is a non-exclusive list of consultants available to assist you below, some of whom are also contractors on the OpenID Certification team. You’re free to hire them or any others you choose on a private basis to help you (or to do all the deployment and certification work yourself). Any such contract relationship is solely between you and the contractor and does not involve the OpenID Foundation, nor does it grant you any special status with respect to your need to meet the objective certification program criteria to achieve certification. If an entity chooses to contract with an existing Certification team contractor for assistance in submitting a certification request, then that entity’s certification request will be reviewed and processed by another member of the Certification team. CONSULTANTS The list of consultants below are current OpenID certification program subject matter experts that are available to provide expertise in successfully deploying and certifying to profiles of OpenID specifications. Edmund JayAbout: Edmund Jay is a current member of the ODF Certification team and has been involved with OpenID specifications work for over 10 years. He is experienced in identity, security, and privacy standards implementations.Successful OpenID Certifications: Current member of OpenID certification team with extensive experience with both OpenID Connect and Financial-grade API conformance tests and certifications.Languages Fluent: EnglishContact: edmund_jay@hotmail.com emobixAbout: Founded by Joseph Heenan, he has assisted 40+ banks around the globe and a range of vendors in architecting, implementing, deploying and certifying their OpenID Connect and FAPI compliant solutions. He regularly speaks at industry conferences, leads the OpenID Certification team, and helped write many of the relevant standards. He co-founded a consultancy in Glasgow that specialises in all areas of security/software, with a particular focus on authentication/authorization and also mobile apps.Successful OpenID Certifications: Current member of OpenID certification team with extensive experience with both OpenID Connect and Financial-grade API conformance tests and certifications.Languages Fluent: EnglishContact: joseph@emobix.co.uk SBOsoftAbout: Founded by Serkan Özkan, a former member of the OIDF certification team and former Ping Identity employee (https://www.linkedin.com/in/serozkan/), SBOsoft provides software development and consultancy services.Successful OpenID Certifications: Current member of OpenID certification team with extensive experience with both OpenID Connect and Financial-grade API conformance tests and certifications.Languages Fluent: Turkish, EnglishContact: info@sbosoft.net"
