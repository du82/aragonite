ve it a spin at https://openid.net/certification/logout_rp_testing/! This joins that OP logout certification that launched in August 2019, which is described at https://openid.net/certification/logout_op_testing/. Both are in pilot mode, and so certifications are currently available at no cost to OpenID Foundation members. If you’ve […]"
