["https://openid.net/foundation/members/members"]
title = "The OpenID Foundation"
description = "The OpenID Foundation"
full_description = "Foundation > Members OpenID Foundation Membership The OpenID Foundation (OIDF) was formed in June 2007 to help promote, protect and enable the OpenID technologies and community. This entails managing intellectual property, brand marks as well as fostering viral growth and global participation in the proliferation of OpenID. The OIDF does not dictate the technical direction of OpenID; instead it will help enable and protect whatever is created by the community. If you (or your organization) would like to help OpenID make the Internet a better place, become involved and join the Foundation. The OpenID Foundation Member Agreement for review. Benefits of Individual Membership Vote on OpenID workgroups, specifications, and community board members of the OpenID Foundation Use the OpenID Foundation Member logo and signature on your blog, email, website, apps Show your support for OpenID as a community-driven, user-centric identity for the Internet Way to leverage financial support for an important grassroots community Become part of the momentum of OpenID adoption and visibility Benefits of Company/Organizational Membership Use the OpenID Foundation Member logo on your company website, blog, and other marketing materials Display your corporate logo/name on the OpenID Foundation website and promotional materials Propose, lead, and participate in OpenID technical and marketing work groups Vote on ratification of OpenID specifications and recommendations Be eligible for inclusion in OpenID Foundation press releases and industry events Opportunity to meet, exchange views, collaborate with peer organizations in innovative, open source efforts Log In with Your OpenID Note: Login loop issue If you are seeing this message after logging in, it’s likely that the OpenID cookies are too big. Until we are able to correct the underlying cause, you can work around this situation in any of the following ways: delete your openid.net cookies and try again, delete all your cookies and try again, try again using an in-private browser window, try again in a different browser. We’re sorry for the inconvenience! Join Today! Contribute to the continued growth and adoption of OpenID, making the Internet a better place. Join the Foundation today!"
