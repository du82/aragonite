title = "Death and the Digital Estate Community Group"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Death and the Digital Estate (DADE) Community Group The Death and the Digital Estate Community Group (DADE CG) enables interested parties to develop the use cases that support an individual’s right to choose what happens to their digital data upon their death or disablement. Death and the Digital EstateOVERVIEW Death and the Digital EstateREPOSITORY Death and the Digital EstatePARTICIPATION AGREEMENTS What is Death and the Digital Estate (DADE)? Today, the world lacks a comprehensive set of consent-driven tools to allow individuals to determine how their digital data is handled upon their death or disablement. Humans’ online presence and digital data is part of their “digital estate,” which includes writing, images, photographs, audio, video, code, and other digital artifacts stored locally or in the cloud by or on behalf of its owner. Although solutions do exist, such as legacy contacts on Apple or Facebook, they are not universal and must be individually configured per service provider, creating barriers to their broad usage.The loss of control over one’s digital footprint can lead to misuse or abuse of the deceased’s likeness through the production of deepfakes using video, audio, and writing samples. In some cases, the deceased’s accounts may be quickly removed from major platforms, leading to the loss of a thought leader’s writings. Or, a social media platform may not recognize the death of the deceased, leading others to interact with the profile as if the user was alive. None of these outcomes are desirable.The Death and the Digital Estate Community Group (DADE CG) will allow interested parties to develop the use cases to support an individual’s right to choose what happens to their digital data upon their death or disablement. All use cases must be broadly applicable to a global audience, respect global cultural and religious traditions, and consider the perspectives of users, their legacy contacts, and service providers. The identified use cases will be leveraged to develop high level data flows to inform future protocol work. The DADE CG will not develop any protocols, nor will the CG develop any use cases that are well established in law or practice today, such as managing the deceased’s real property or monetary assets.The long term vision beyond the DADE CG is to establish a Work Group to develop protocols and guidance for service providers to enable users to manage their digital estates. The vision includes user-centric, centralized mechanisms for determining the handling of the user’s data, enabling both coarse and fine-grained controls to share, place data in escrow, delete data, delegate access to credentials/data/services in a way that protects the individual’s privacy rights.The OpenID Foundation Board approved the DADE CG charter in September 2024 and the group is now forming. Contributors will need to sign a Participation Agreement, which is under development, and join the DADE CG mailing list and #DADE Slack Channel.The GitHub repo may also be used to capture relevant resources.Meetings have not yet been scheduled. Community Group Chairs Dean H. Saxe (Beyond Identity)Eve Maler (Venn Factory)Mike Kiser (SailPoint) Participation Join the mailing list.Participants need to sign a Participation Agreement Meeting Schedule Bi-Weekly on Fridays, beginning November 15 20247AM Pacific TimeJoin Meeting View Calendar"
year_published = 2024
year_updated = 2025
clearnet = "https://openid.net/cg/death-and-the-digital-estate"
