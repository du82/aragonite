["https://openid.net/cg/australian-digital-trust-community-group"]
title = "Australian Digital Trust Community Group - OpenID Foundation"
description = "Australian Digital Trust Community Group The Australian Digital Trust Community Group has been established to enable members of the Australian community to collaborate on identity topics.Australian Digital TrustOVERVIEWAustralian Digital TrustREPOSITORYAustralian Digital TrustPARTICIPATION AGREEMENTS What is the Australian Digital Trust Community Group The Australian Digital Trust Community Group (ADT CG) fosters cooperation among professionals focused on"
full_description = "Australian Digital Trust Community Group The Australian Digital Trust Community Group has been established to enable members of the Australian community to collaborate on identity topics. Australian Digital TrustOVERVIEW Australian Digital TrustREPOSITORY Australian Digital TrustPARTICIPATION AGREEMENTS What is the Australian Digital Trust Community Group The Australian Digital Trust Community Group (ADT CG) fosters cooperation among professionals focused on digital identity and trust ecosystems in Australia.The Australian Digital Trust Community Group (ADT CG) provides a neutral platform for professionals to collaborate on current and future Australian digital identity and trust ecosystems. Its purpose is to facilitate discussion on local initiatives, with the overarching objective of improving awareness and driving uptake of interoperable, standards-based digital trust services. Activity relating to digital identity and trust in the Australian market is accelerating at pace, with consumer-facing services available across both the public and private sectors. This increase in activity calls for a forum to create transparency over the diverse set of interests at play, fostering positive outcomes for all parties.To achieve its objective, the Community Group will convene stakeholders and provide networking opportunities amongst Australian industry participants with a focus on the following broad areas:Australian digital trust initiatives, use cases, and best practices (business).Australian standards usage (technical). Data sharing use cases and standards (business and technical)Ecosystem-specific and economy-wide fraud requirements (business and technical).Increased adoption of digital trust services for everyone’s benefit.The Community Group – initiated by a group of local practitioners – will explore these specific topics through meetings of its members and other stakeholders. A topic roadmap will be agreed by the Community Group at its first meeting and continuously updated as learnings transpire and new challenges arise. Elaboration and discussion of each topic will run concurrently, with information and insights from shared back to the wider community.Specific deliverables will be agreed by the Community Group for each topic, which may include whitepapers, blog posts, events, and recommendations to support interoperability and alignment across the broader ecosystem.Additionally, the Community Group will determine whether through the establishment of an Australian OIDF chapter its objectives can be better achieved, and should be recommended to the OIDF Board.Membership of the Community Group is open to all, inclusive of individuals from technology and service vendors, all industry sectors, representatives of consumer groups, as well as federal and state governments. Community Group members are not required to join OIDF (although we recommend it). The only requirement is to sign a participation agreement, which you can review here.To get involved, please join the mailing list. We look forward to welcoming you! Community Group Chairs Dima Postnikov Victoria Richardson Dave HylandBrad CarrOlaf Grewe Participation Join the mailing list.Participants need to sign a Participation Agreement Meeting Schedule Weekly on Monday’s at 5pm AEDTJoin Meeting View Calendar"
year_published = 2025
year_updated = 2025
