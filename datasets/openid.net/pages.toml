title = "Foundation Leadership - OpenID Foundation"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "OpenID Foundation Leadership Executive Director Gail Hodges Linkedin Gail Hodges joined the OpenID Foundation as Executive Director in May 2021. She is also the Founder of the Future Identity Council, a global non-profit that seeks to empower citizens with mobile identity credentials that are private, secure, and easy to use. Read more… The council is government-led and partners closely with the private sector to ensure that this “public good” reaches its full potential. Gail previously worked at Apple for 5 years, where she led Business Development for a range of new Identity and Payment services, setting up new ecosystems and business models to achieve scale. She led the government roll out of Core NFC, which allows Apple devices to read chip-based ID cards. She also led Latin American markets for Apple Pay, and developed the platform for domestic payment networks to join Apple Pay. Prior to joining Apple, Gail was SVP and Global Head of Digital Payments for HSBC Holdings based in London, and previously Head of HSBC’s Premier and Advance Card portfolios. Prior to HSBC, Gail ran the UK Centurion and Platform Card Portfolios, and was part of the Strategic Planning group at American Express. Gail holds an MBA from Harvard Business School, and a B.A. in Public Policy from Princeton University. Counsel Tom Smedinghoff Linkedin Tom Smedinghoff has been practicing technology law for over four decades, including as a partner in the global law firms of Baker & McKenzie LLP and Locke Lord LLP and now as a consultant. Read more… He is internationally recognized for his work in developing digital legal policy both in the U.S. and internationally, most notably regarding e-commerce and identity management. As a member of the U.S. Delegation to the United Nations Commission on International Trade Law (UNCITRAL), he helped to negotiate the 2022 UNCITRAL Model Law on the Use and Cross Border Recognition of Identity Management and Trust Services, the 2005 United Nations Convention on the Use of Electronic Communications in International Contracts, and the 2001 UNCITRAL Model Law on Electronic Signatures. A longstanding leader in the American Bar Association (ABA), Tom founded and chairs its Identity Management Legal Task Force (in the ABA Business Law Section) and previously served as Co-Chair of the ABA Cybersecurity Legal Task Force and Chair of the ABA Science & Technology Law Section. Tom has authored and co-authored numerous books and articles on e-commerce, identity management, privacy, and cybersecurity topics, including serving as editor and lead contributing author of the first book on Internet law titled ONLINE LAW: THE LEGAL GUIDE TO DOING BUSINESS ON THE INTERNET (Addison Wesley, 1996). Operations Director Mike Leszcz Linkedin Mike Leszcz is the Operations Director at the OpenID Foundation where he is responsible for the Foundation’s operations working in close coordination with the board of directors and the Executive Director. Read more… Mike was the part of the OpenID Foundation team that launched the award-winning certification program in 2015. He also works closely with global ecosystems adopting OpenID specifications and certification to operationalize these relationships. Prior, Mike was Program Manager at the Open Identity Exchange (OIX) as well as held senior strategic business development positions with leading organizations focused on data analytics and business intelligence solutions. Mike has a B.S. from the Robert H. Smith School of Business at the University of Maryland. Technical Director Mark Haine Linkedin Mark Haine is an engineer and entrepreneur who has focussed his career on building solutions that enable business and mitigate risk in financial services. Read more… Through Considrd.Consulting Ltd. Mark and his team are providing strategic security consultancy to a range of clients. He has also taken on a leadership role in the OpenID Foundation as Co-Chair of the eKYC & Identity Assurance Working Group and co-author of OpenID Connect for Identity Assurance. Mark also contributes to other communities including the W3C and OpenAPI, serves as a board member of the Open Identity Exchange and is board advisor to two technology startups.Mark was close to developments in Open Banking and has been directly involved in Open Banking UK as senior security architect, member of the standards team, and identity product owner. He has also helped a number of other organisations navigate the complexities of opening up access to their data and services via APIs. Mark holds a B.Eng. from the University of Southampton in Electronic Engineering. Mark’s goal is to help organisations succeed by influencing projects in a ways that improve outcomes for people. Standards Specialist & Certification Director Joseph Heenan Linkedin Joseph Heenan is an engineer & architect with a focus on OpenData ecosystems and Digital Identity. Read more… Joseph is an active member/contributor to many OpenID Foundation working groups, including the FAPI group that defined the security profile used in the UK OpenBanking specifications and leads the OpenID Foundation Certification Team. He is a co-chair of the Digital Credentials Protocol working group that is developing the standards being adopted across the world for Digital Wallets / Verifiable Credentials, frequently speaks at conferences and is also the CTO of Authlete. He led the development & successful deployment of the conformance suite for the UK OpenBanking security profile and assisted many of the largest UK (CMA9) banks with achieving compliance to the UK specification, and now has a focus on doing the same with for every other OpenID Foundation standard standard. He’s a seasoned software engineer & architect with over 25 years’ experience, who started writing mobile apps before mobile apps existed and went on to co-found a successful mobile software development consultancy based in Glasgow (UK) in 2010. Joseph lives in Glasgow with his wife, they love traveling to Japan and between them, they’ve fostered over 200 cats for the Cats Protection charity. Marketing Director Elizabeth Garber Linkedin Elizabeth is an industry thought-leader, entrepreneur, and evangelist. Membership Director Paul Briault Linkedin PauI is a Cybersecurity veteran of over 30 years. Read more… He was responsible for Digital Identity Policy for the UK when he was in the UK Government’s Cabinet Office in the early 2000’s as well as holding key security advisory roles across public sector. He then went on to work in sales and senior leadership roles in enterprise companies such as HP, EMC (for RSA Security), Entrust and CA Technologies. Since 2017 he has run his own companies offering a range of advisory and delivery services to his clients. His core skills lie in business development and strategic revenue growth and more recently he has helped and advised startups and scale ups in the Cyber and AI space developing their go-to-market models. Consultant Nick Mothershaw Linkedin Nick is a long-standing leader in the Digital Identity community. Read more… Nick has expert knowledge of Identity and Fraud techniques, solutions, and standards across a wide variety of sectors and jurisdictions. Previously, Nick was Chief Identity Strategist at the Open Identity Exchange, providing thought leadership, guides, presentations and stakeholder influencing to drive forward the definition and adoption of Digital ID and Digital Wallets around the globe. Nick is also CEO of Select ID, a Digital ID connections marketplace that enables financial services firms to select from a range of Digital ID providers to increase customer onboarding rates and inclusion through single commercial contracts and secure technical connections. Select ID allows end users to select which Digital ID provider best meets their needs to digitally prove their identity. Nick was previously Director of ID and Fraud at Experian where he was responsible launch and operation of a full “Identity as a Service” solution which was the first live example of a Digital ID being seamlessly interoperable across public and private sector. Consultant Gareth Narinesingh Linkedin Gareth Narinesingh is a digital identity evangelist Read more… Gareth Narinesingh is a digital identity evangelist with a strong conviction that reusable identity will transform peoples’ lives for the better. He has extensive experience in digital identity sales and product management and before this built his career in regulatory consulting, banking supervision and various financial market roles. Gareth’s career ambition is to activate the early-stage global digital ID ecosystem through bridging trust with the concept and the technology so that everyday people around the world can transact and engage more safely online. This is why he is delighted to bring his specialist subject matter expertise in reusable digital identity as part of the OIDF team. Press and Media Serj Hallam Linkedin Serj has nearly 25 years of experience in comms, media, and PR. Read more… Serj is a communications professional with nearly 25 years of experience in PR, media relations, crisis management and copywriting. She began her PR career in universities – The Nottingham Trent University, then the University of Derby – before joining the global data and technology company, Experian.Having held key several roles over the years, Serj progressed to Head of EMEA PR at Experian and worked directly with leadership teams to map out and deliver strong communications strategies aligned to commercial objectives. She successfully collaborated with, managed and motivated teams across the globe on proposition launches and thought leadership programmes.Serj later left Experian to set up her own PR business. Her clients included global corporates, local and global non-profits, and high-growth fintechs. She helped them find, nurture and tell their stories, crafting compelling narratives that showcased thought leadership and encapsulated their values and unique selling points. Events Stephanie Meli Linkedin Stephanie has over 25 years of experience in marketing, communications, and events. Read more… With over 25 years of experience in marketing, communications, and event management, Stephanie has spent the last 19 years running her own company, offering comprehensive marketing support to small and medium-sized businesses.She has extensive experience in member management; organizing members meetings, NFPs’ annual conferences, regular board meetings, including venue management and speaker coordination, as well as general member communications.She was the Operations & Membership manager for the Open Identity Exchange and continues to consult for another NFP membership organization in the healthcare sector on a part time basis. Previously, she has supported several local owner managed businesses in crafting and executing marketing plans, producing promotional materials, coordinating with design agencies, and handling media inquiries.Prior to this she spent eight years at Alias Systems Ltd, where she held the role of NEMEA Marketing Manager. She developed marketing strategies, managed large-scale (+1000 attendee) events, and worked closely with strategic partners such as HP, IBM, and NVidia to maintain business growth and brand presence.Highly motivated and hands-on, she thrives on delivering projects to tight deadlines and within budget. Whether managing accounts, coordinating membership activities, or ensuring smooth event execution, she takes pride in driving successful outcomes for clients. Press and Media Sophie Bennani-Taylor Linkedin Sophie is a PhD student at Oxford and a freelance research consultant. Read more… Sophie Bennani-Taylor is a DPhil (PhD) student at the Oxford Internet Institute and a freelance research consultant. Her doctoral research examines digital identification systems used in the field of international development. Sophie’s DPhil is fully funded by the Grand Union Doctoral Training Partnership and is supervised by Professors Victoria Nash and Loren LandauSophie has conducted freelance research with organisations including UNHCR, the European Centre for Privacy and Cybersecurity, and Harvard Berkman Klein Centre for Internet & Society. Her expertise lies at the intersection of technology and migration. Prior to returning to academia, Sophie worked as a Digital Ethics Consultant and co-founded Sopra Steria’s Digital Ethics practice. As a researcher and consultant, Sophie has worked with a range of governmental, private, and non-profit organisations to anticipate and respond to their ethical challenges when working with technology. Certification Team Marcus Almgren Linkedin Marcus Almgren is an engineering manager and software developer at Signicat, one of the major providers of digital identity solutions in Europe. Read more… He is a long-time professional within the domains of electronic identity, digital signature, identity assurance and KYC, with many years of experience working with authentication and authorization protocols. Domingos Creado Linkedin Domingos Creado is a identity and access management professional with 10 years acting as consultant and advisor roles. Read more… He has more than 20 years on software development industry as software architect on different domains from logistics, telecom, manufacturing, intelligent cities, and financial. Thomas Darimont Linkedin Thomas Darimont is a digital identity consultant with ten years of experience in consulting and open-source. Read more… He has over 20 years of experience in the software development industry, working as a software engineer and architect across different domains, including retail, automotive, telecom, manufacturing, finance, and insurance, with a focus on flexible and secure authentication and authorization systems. Edmund Jay Linkedin Edmund Jay is an experienced software developer with over 20 years experience in information security, digital rights management, and standards development. Read more… He has been involved identity and privacy standards for over 10 years and is a contributor to the OpenID Connect, FAPI and dependent specifications. He was an early implementer of OpenID Connect and participated in interoperability tests that were critical for the initial OpenID conformance tests. Alan Smillie Linkedin Alan Smillie is a software developer at Emobix, a software consultancy in Europe with a focus on mobile. Read more… He has more than 30 years experience in many areas ranging from embedded systems to mobile application development."
year_published = 2023
year_updated = 2024
