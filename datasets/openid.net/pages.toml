title = "Guidelines and Policies - OpenID Foundation"
description = "Organizational Documents and Policies This page contains all OpenID Foundation organizational documents, policies and processes. Organizational Documents OpenID Foundation Articles of IncorporationOpenID Foundation Bylaws Antitrust Policy The OpenID Foundation (OIDF) Antitrust Policy, and any applicable U.S. and international antitrust and competition law, governs the conduct of all attendees and participants in all OIDF-sponsored activities, including"
full_description = "Please reference the Directed Funding Policy: http://openid.net/wordpress-content/uploads/2021/10/OIDF-Policy-Directed-Funding-Final-10-07-2021.pdf Organizational Documents and Policies This page contains all OpenID Foundation organizational documents, policies and processes. Organizational Documents OpenID Foundation Articles of IncorporationOpenID Foundation Bylaws Antitrust Policy The OpenID Foundation (OIDF) Antitrust Policy, and any applicable U.S. and international antitrust and competition law, governs the conduct of all attendees and participants in all OIDF-sponsored activities, including meetings or events. Each attendee is responsible for knowing the contents of the OIDF Antitrust Policy and for complying with it. Attendees must not use meetings or events as a forum for anticompetitive conduct, or otherwise engage in any discussions which might give rise to an allegation of violation of antitrust laws. Certification Conformance Testing Disclosure and Reporting Policy Certification Conformance Testing Disclosure and Reporting Policy (“Policy“) sets forth the rules and requirements that govern the disclosure and reporting by the OpenID Foundation (“OIDF”) of the identity of, and the results achieved by, individuals and entities that use OIDF conformance testing software and related services (“Testing Services”). Contribution Agreement To ensure that OpenID Foundation community develops specifications that are freely implementable, the Foundation requires all contributors to sign its standard form Contribution Agreement. The Contribution Agreement incorporates by reference both the OpenID Intellectual Property Rights Policy (IPR Policy) and OpenID Process Document. Directed Funding Policy The OIDF Directed Funding Program provides a mechanism whereby OIDF members can help to advance the mission of OIDF by making contributions to OIDF that are designated for a specific purpose of interest to the OIDF member for the benefit of the OIDF and its membership. What is the OIDF Directed Funding Program? The OIDF Directed Funding Program provides a mechanism whereby OIDF members can help to advance the mission of OIDF by making contributions to OIDF that are designated for a specific purpose of interest to the OIDF member for the benefit of the OIDF and its membership (such funds referred to as “Directed Funds”). Contributions of Directed Funds are used by OIDF to fund projects for the specific purpose designated by the OIDF member subject to the policies of OIDF as same may be amended from time to time, or to pay for OIDF-run conferences or similar events to advance the specific purpose designated by the OIDF member.OIDF is a nonprofit trade association described in Section 501(c)(6) of the Internal Revenue Code of 1986, as amended, and exempt from federal income tax under Section 501(a). All Directed Funds for programs must be consistent with its legal obligations as a nonprofit. Accordingly, additional restrictions may be necessary to ensure that their is no adverse impact on the OIDF continuing to be an organization described in Section 501(c)(6) that is exempt from federal income tax. Who can contribute to the OIDF Directed Funding Program? OIDF members in good standing can contribute Directed Funds to the OIDF Directed Funding Program. How are Directed Funds treated? All contributions of Directed Funds are irrevocable donations to OIDF. OIDF shall have the sole and absolute discretion to accept or reject Directed Funds. All Directed Funds may be used or disbursed by OIDF for the specific purpose(s) for which they were received, subject to the restrictions, if any, designated by the OIDF member. Directed Funds may be accepted by OIDF subject to a memorandum of understanding between OIDF and the OIDF member. How are Directed Funds maintained and accounted for? All contributions of Directed Funds will be received, held by OIDF, and separately accounted for on its books and records as Directed Funds. Directed Funds, however, may be co-mingled with the general OIDF funds. To ensure transparency, reports of expenditures of Directed Funds will be made available to OIDF members upon reasonable request. What directed funding options are available to OIDF members? Any OIDF member may make a contribution of Directed Funds for a specific project. In addition, more than one member may, join together, to make a series of contributions to fund a project, such as, for example, via a matching funds program. Are there are any restrictions on the OIDF member’s designated use of Directed Funds? Directed Funds will be accepted by OIDF only for purposes that advance the mission of OIDF, and that benefit its members and the identity community generally, as determined in the sole discretion of OIDF. Contributions will not be accepted for purposes designed to solely benefit any OIDF member(s), for purposes designed to provide an OIDF member with a competitive advantage over other entities, subject to any restrictions unacceptable to OIDF, or under circumstances that may cause OIDF to cease to be an organization described in Section 501(c)(6) of the Internal Revenue Code of 1986, as amended, and exempt from federal income tax under Section 501(a). In all cases, the use of Directed Funds will be subject to the requirement that all work products and other deliverables produced through the expenditure of Directed Funds be owned by OIDF, be subject to the OIDF IPR policy, and be made publicly available on the OIDF website. What is the role of OIDF regarding Directed Funds? OIDF will, first, make a determination of whether or not the proposed project to be funded by Directed Funds is consistent with the requirements set forth in Paragraph 6 of this FAQ, and any other policies of OIDF. If the project meets the requirements of OIDF, OIDF shall accept the Directed Funds. OIDF may, in its sole and absolute discretion, enter into a memorandum of understanding with the member(s) making the contribution.OIDF shall receive and retain Directed Funds for the use and purposes for which they are accepted. Thereafter, OIDF shall use or apply such funds for the purpose designated by the OIDF member. OIDF shall have the sole and absolute discretion to determine the manner and method of conducting the project for which funds were received. The OIDF member who contributes Directed Funds may make such recommendation as it desires for OIDF consideration. OIDF shall conduct such due diligence and review of any recommendations as it deems appropriate. In no event shall any contributor of Directed Funds have the ability to require that any vendor, supplier, contractor or other party to be retained by OIDF to complete the project. All decisions pertaining to same shall be in the sole and absolute discretion of OIDF, which discretion shall be final and not subject to review.OIDF shall have no responsibility to the OIDF member contributing Directed Funds for the ultimate deliverables or outcome resulting from the Directed Funds and shall not be liable for the services or work products to be provided under any project involving the use of Directed Funds. OIDF shall not be a guarantor as to the final work product in any case.In conducting any project involving the use of Directed Funds, OIDF reserves the right to deduct from the Directed Funds reasonable sums incurred for out-of-pocket expenses by OIDF, and a reasonable administrative fee for undertaking the project. How much control can the OIDF member exert over the use of the Directed Funds? Subject to the requirements set forth in Paragraph 7 of this FAQ, the OIDF member contributing Directed Funds may designate a specific project on which the Funds are to be spent, recommend person(s) or entity to whom Directed Funds will be paid, specify the general category or subject matter for which the Directed Funds should be used, as well as other related requirements specified in a memorandum of understanding negotiated between OIDF and the OIDF member at the time the Directed Funds are contributed. Notwithstanding the foregoing, in the event that subsequent to the acceptance of Directed Funds OIDF determines that the project may cause OIDF to cease to be an organization described in Section 501(c)(6) of the Internal Revenue Code of 1986, as amended, and exempt from federal income tax under Section 501(a), OIDF shall have the sole and absolute right to terminate such project. In such event, all unused funds will remain the property of OIDF and available for future projects. The OIDF member shall not have a right to receive a refund of its contributions. How will work product and other deliverables be used? All work products resulting from the use of any Directed Funds will be owned by OIDF and subject to the IPR policy of OIDF. OIDF will make such work product freely available on its website. In no case will ownership of, access to, or use of any such work product be restricted to or by any OIDF member. Can an OIDF member terminate a project? An OIDF member can request that OIDF terminate a specific project, and OIDF will use reasonable efforts to do so, consistent with its commitments to the service providers involved. In the event of any such termination, all unused funds will remain with OIDF and available for future projects. The OIDF member shall not have a right to receive a refund of its contributions. What is the responsibility/liability of OIDF to the OIDF member for performance of the project? OIDF takes on only the general obligation to use the funds for the general purpose specified by the OIDF member, subject to the limitations and conditions described in this FAQ, any applicable memorandum of understanding, and such policies of OIDF as amended from time to time, and to administer the disbursement of funds in accordance with that purpose. OIDF does not take on any responsibility for achieving any specific result or deliverable, or for insuring that any resulting work product or services are acceptable to the OIDF member. What happens to Directed Funds that are not used for a particular project? All Directed Funds will be applied for a specific purpose. If a project under which such funds are expended does not exhaust the funds, the remaining funds will be contributed to the OIDF general fund to be used at the sole discretion of OIDF, unless a memorandum of understanding negotiated between OIDF and the contributing OIDF Member or Chapter at the time the Directed Funds are contributed specifies that such excess funds will continue to be maintained in a segregated account (i) for the specific purpose originally designated, or (ii) for an additional project(s) within the scope of the designated purpose. Directed Funds are not refundable. Are there any other restrictions or requirements for the OIDF Directed Funding Program? All directed funding programs must be consistent with the legal obligations of OIDF and its members under applicable antitrust and fair business practice laws and regulations.NEW! Conformance profiles for OPs and RPs implementing the Form Post Response Mode entered the pilot phase in June 2018. They are Form Post OP and Form Post RP. Please give them a try!Certification to conformance profiles in the pilot phase is open to all OpenID Foundation members. Members interested in “testing the tests” should send a note to certification@oidf.orgasking to be part of the certification pilot phase for new profiles. Where can I get more information about the OIDF Directed Funding Program? Please reference the Directed Funding Policy: http://openid.net/wordpress-content/uploads/2021/10/OIDF-Policy-Directed-Funding-Final-10-07-2021.pdf No fee is required for certifications to conformance profiles in the pilot phase, since for those we are still “testing the tests”. Payment will be required for new certifications to those profiles once the pilot phase has been completed and the profiles reach general availability. Community Group Participation and Guidelines Community Groups (CGs) are open to the public, including organizations and individuals. Generic Participation Agreement (PA)Community Group Operating RulesAustralian Digital Trust Community Group Participation AgreementDeath and the Digital Estate Community Group Participation AgreementGlobal Assured Identity Network (GAIN) POC Participation Agreement Intellectual Property Rights Policy The OpenID Intellectual Property Rights Policy (IPR Policy) defines the intellectual property rights and obligations of Contributors and specifies certain procedures relating to Contributions proposed to the OpenID Foundation for the creation of Specifications and the generation of Implementers Drafts and Final Specifications as outlined in the OpenID Process Document. Learn more here. Member Agreement The OpenID Foundation Member Agreement for review. You are encouraged to join the Foundation using the online process by clicking on the “Join now” button here. Open-Source Project Certification Policy Open-Source Project Certification Policy. The OpenID Foundation encourages open-source projects to certify their deployments of OpenID specifications based on available conformance tests. The Foundation recognizes that many open source projects are developed and maintained by both individuals as well as not for profit organizations that have limited budgets. OpenID® Copyright License Copyright (c) 2013 The OpenID Foundation.The OpenID Foundation (OIDF) grants to any Contributor, developer, implementer, or other interested party a non-exclusive, royalty free, worldwide copyright license to reproduce, prepare derivative works from, distribute, perform and display, this Implementers Draft or Final Specification solely for the purposes of (i) developing specifications, and (ii) implementing Implementers Drafts and Final Specifications based on such documents, provided that attribution be made to the OIDF as the source of the material, but that such attribution does not indicate an endorsement by the OIDF. Read more The technology described in this specification was made available from contributions from various sources, including members of the OpenID Foundation and others. Although the OpenID Foundation has taken steps to help ensure that the technology is available for distribution, it takes no position regarding the validity or scope of any intellectual property or other rights that might be claimed to pertain to the implementation or use of the technology described in this specification or the extent to which any license under such rights might or might not be available; neither does it represent that it has made any independent effort to identify any such rights. The OpenID Foundation and the contributors to this specification make no (and hereby expressly disclaim any) warranties (express, implied, or otherwise), including implied warranties of merchantability, non-infringement, fitness for a particular purpose, or title, related to this specification, and the entire "
