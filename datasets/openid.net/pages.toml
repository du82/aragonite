title = "AuthZEN Working Group - OpenID Foundation"
description = "AuthZEN Working Group - Overview AuthZEN will focus on specific areas of interoperability by documenting common authorization patterns, define standard mechanisms, protocols and formats for communication between authorization components, and recommend best practices for developing secure applications.AuthZEN Working GroupOVERVIEWAuthZEN Working GroupCHARTERAuthZEN Working Group SPECIFICATIONSAuthZEN Working GroupREPOSITORY What is theAuthZEN Working Group? The purpose of the"
full_description = "AuthZEN Working Group - Overview AuthZEN will focus on specific areas of interoperability by documenting common authorization patterns, define standard mechanisms, protocols and formats for communication between authorization components, and recommend best practices for developing secure applications. AuthZEN Working GroupOVERVIEW AuthZEN Working GroupCHARTER AuthZEN Working Group SPECIFICATIONS AuthZEN Working GroupREPOSITORY What is theAuthZEN Working Group? The purpose of the AuthZEN WG is to provide standard mechanisms, protocols and formats to communicate authorization related information between components within one organization or across organizations, which may have been developed or sourced from different entities.Centralized authentication services have revolutionized identity management and security best practices by removing the burden of repeatedly implementing identity lifecycle management within individual applications and by giving users a more seamless and consistent authentication experience. Protocols such as SAML and OIDC facilitate this approach to single sign-on and federated environments.Authorization capabilities are in need of a similar paradigm shift to enable applications to better support more fine-grained, dynamic authorization than what is afforded by today’s commonly used pattern of embedding entitlements into OAuth2 bearer tokens after user authentication. This is not a new idea and we already have various approaches to implementing externalized authorization – commonly called “P*P” architectures (PIP, PDP, PEP, etc.). Examples include architectures based on IDQL, OPA/Rego, XACML and Zanzibar. Deploying any of these authorization architectures can be challenging from implementation complexity, granularity, and scalability perspectives; interoperability between different architectures and between different implementations are particularly challenging. The purpose of this WG is to explore how to improve the deployability, scalability and interoperability of dynamic, fine-grained authorization schemes to better meet the needs of modern information security best practices. In particular, we need to make authorization easy for an organization to deploy and operate authorization capabilities across their entire application estate, including both SaaS services and internally developed applications (whether they be on-prem or in the Cloud).Note that this is not necessarily an effort to define yet another authorization architecture or runtime policy language. Instead, the WG will develop OpenID Foundation Final Specifications which leverage existing architectures and protocols as much as possible. Where appropriate, the WG intends to collaborate with international standards development organizations, such as ISO/IEC JTC 1, ITU-T, and IETF, for recognition of these OpenID Foundation specifications. News, Events, and Presentations AuthZEN interop websiteInterview on the IDPro ShowPresentations: KubeCon NA (November 2024):AuthZEN: the OpenID Connect of Authorization video and slides IIW 39 (October 2024):The Laws of AuthorizationOpenID AuthZEN: the “OIDC” of authorization Authenticate (October 2024):AuthZEN: standards for modern authorizationAuthZEN: interop read-out Identiverse (May 2024):OpenID AuthZEN interop read-out BlogsAuthZEN Authorization API 1.0 Implementer’s Draft ApprovedOpenID AuthZEN, One Year In: A RetrospectiveOpenID AuthZEN Implementer’s Draft and Why it MattersAuthZEN Work Group Announces Authorization Interop Results Working Group Chairs David Brossard (Axiomatics)Allan FosterOmri Gazitt (Aserto)Gerry Gebel (Strata Identity)Sean O’Dell (Disney) The chairs can be reached at openid-specs-authzen@lists.openid.net Participation To monitor progress and connect with working group members, join the mailing list.To participate in or contribute to a specification within the working group requires the submission of an Intellectual Property Rights (IPR) contribution agreement. You can complete this electronically or by paper at openid.net/intellectual-property. Be sure to specify, in the working groups box, the exact name: Meeting Schedule Regular Meetings Weekly Tuesday call that alternates between 11:00 PT (19:00 UTC) and 15:00 PT (23:00 UTC) Zoom software is available on Mac, PC, iPhone, and Android Phone. Join Meeting Meeting Minutes View Calendar"
