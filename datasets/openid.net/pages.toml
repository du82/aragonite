["https://openid.net/intellectual-property"]
title = "OpenID Foundation Contribution Agreements - OpenID Foundation"
description = "To ensure that OpenID Foundation community develops specifications that are freely implementable, the Foundation requires all contributors to sign its standard form Contribution Agreement."
full_description = "OpenID Foundation Contribution Agreements To ensure that OpenID Foundation community develops specifications that are freely implementable, the Foundation requires all contributors to sign its standard form Contribution Agreement. The Contribution Agreement incorporates by reference both the OpenID Intellectual Property Rights Policy (IPR Policy) and the OpenID Process Document. The OpenID Intellectual Property Rights Policy defines the intellectual property rights and obligations of Contributors and specifies certain procedures relating to Contributions proposed to the OpenID Foundation for the creation of Specifications and the generation of Implementers Drafts and Final Specifications as outlined in the OpenID Process Document. The OpenID IPR Policy also includes a grant to the Foundation and others of a copyright license in all Contributions submitted by the contributor, as well as a patent non-assertion agreement. Both the copyright license and the patent non-assertion agreement are critically important for ensuring that the contributor does not have a basis for bringing a legal claim against others for implementing OpenID specifications. Accordingly, please note that the OpenID Foundation does not accept any changes to the Contribution Agreement, the IPR Policy, or the Process Document. Because of the need for all work group contributors and all specification users to be subject to the same rights and obligations, and to provide assurance and clarity regarding those rights and obligations, it is critically important that all work group contributors agree to and are governed by the same terms regarding the issues covered by those documents. Contribution AgreementElectronic Complete the OpenID FoundationContribution Agreement electronically. Enter DocuSign Contribution AgreementHardcopy Complete the OpenID Foundation Contribution Agreement by paper. Download PDF Additionally, review the OpenID Meeting “Note Well” Statement – OpenID Meeting “Note Well” Statement – PDFPlease email completed hardcopy PDF agreements to help@oidf.org. On March 1, 2012, the OIDF board unanimously approved a statement for inclusion in specifications whereby the OIDF explicitly grants a license to implementers. The board also reaffirmed that under the IPR policy, the patent promise applies only to the working groups listed in the IPR contribution agreements and not to all work of the foundation. This was a reaffirmation and not a change to the IPR policy. Specification License Out Resolutions Board Approved March 1, 2012 Download PDF Patent Promise Limitation Affirmation Board Approved March 1, 2012 Download PDF Executed Contribution Agreements This page contains a list of companies, entities, and individuals that have executed one or more Intellectual Property Contribution Agreements. If you require a copy or proof of agreement, please email help@oidf.org to obtain more information. 0-9 A B-C D-F G-J K-M N-Q R-S T-U V-Z 0-9 1&1 Mail & Media Development & Technology GmbH All WGs Contributiuon Agreement10x Banking All WGs Contribution Agreement360kompany AG eKYC & IDA WG Contribution Agreement42 Crunch FAPI WG Contribution Agreement A Abhimanyu Yadav OpenYOLO WG Contribution AgreementAbhimanyu Yadav All WGs Contribution AgreementAbhishek Pamecha OpenID AB/Connect Contribution AgreementAdam Cooper All WGs Contribution AgreementAdorsys Gmbh & Co. KG FAPI WG Contribution AgreementADP FastFed WG Contribution AgreementAdvance HIE Resources HEART WG Contribution AgreementAgileBits Account Chooser-Open YOLO WG Contribution AgreementAhmet Soormally All WGs Contribution AgreementAlejandro Perez Mendez R&E WG Contribution AgreementAlen Horvat All WGs Contribution AgreementAlex Chalmers All WGs Contribution AgreementAlex Olivier All Work Groups Contribution AgreementAlex Bilbie OpenID AB Connect Contribution AgreementAlex Plekhov R&E WG Contribution AgreementAlexander Taffe AB/Connect WG Contribution AgreementAlexandre Babeanu All WGs Cont