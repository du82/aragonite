description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "What is openmediavault? openmediavault is the next generation network attached storage (NAS) solution based on Debian Linux. It contains services like SSH, (S)FTP, SMB/CIFS, RSync and many more ready to use. Thanks to the modular design of the framework it can be enhanced via plugins. openmediavault is primarily designed to be used in small offices or home offices, but is not limited to those scenarios. It is a simple and easy to use out-of-the-box solution that will allow everyone to install and administrate a Network Attached Storage without deeper knowledge. Download Features Running out-of-the-box Debian Linux OS Web based administration Easy system updates via Debian package management Volume management S.M.A.R.T. Link aggregation Wake On Lan IPv6 support Email notifications File sharing Snapshot support of shared folders Extendible via plugins More features Latest news New updates available Posted: 16. February 2025 openmediavault 7.7.0 Update locale files. Several UI improvements. Refactor the RPC to umnount file systems to be able to get rid of non-existing file systems. Issue #1912: Fix pinning of backports repository. Issue #1918: Improve processing of tokenized strings. openmediavault-apt 7.0.2 Issue #1912: Fix Bookworm backports example. openmediavault-k8s 7.4.4 Update the recipe ingredients. openmediavault-usbbackup 7.1.2 Update locale files. 0 comments New updates available Posted: 30. January 2025 openmediavault 7.6.0 Update locale files. Add option to disable the automatic installation of security updates. openmediavault-apt 7.0.1 Update locale files. Relocate page to “System | Update Management | Settings” section. openmediavault-owntone 7.1.0 WARNING … This update is based on a new container image with different settings and database paths. No migration is done by the plugin. Because of that you will loose your music collection. The best approach is to uninstall the plugin and re-install it with the new plugin version. Then reconfigure the service to re-index your music collection. Update locale files. Make use of the official container image. 0 comments More news"
