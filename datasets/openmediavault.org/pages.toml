full_description = "New updates available 16. February 2025 openmediavault 7.7.0 Update locale files. Several UI improvements. Refactor the RPC to umnount file systems to be able to get rid of non-existing file systems. Issue #1912: Fix pinning of backports repository. Issue #1918: Improve processing of tokenized strings. openmediavault-apt 7.0.2 Issue #1912: Fix Bookworm backports example. openmediavault-k8s 7.4.4 Update the recipe ingredients. openmediavault-usbbackup 7.1.2 Update locale files. Categories News New updates available 30. January 2025 openmediavault 7.6.0 Update locale files. Add option to disable the automatic installation of security updates. openmediavault-apt 7.0.1 Update locale files. Relocate page to “System | Update Management | Settings” section. openmediavault-owntone 7.1.0 WARNING … This update is based on a new container image with different settings and database paths. No migration is done by the plugin. Because of that you will loose your music collection. The best approach is to uninstall the plugin and re-install it with the new plugin version. Then reconfigure the service to re-index your music collection. Update locale files. Make use of the official container image. Categories News New update available 24. January 2025 openmediavault 7.5.2 Update locale files. Fix database migration issue introduced by issue #1875. Issue #1898: When IPv6 is deactivated, the environment variable OMV_NGINX_SITE_WEBGUI_LISTEN_IPV4_ADDRESS isn’t taken into account when deploying the nginx configuration. Categories News New update available 17. January 2025 openmediavault 7.5.1 Improve the quick disk wiping feature. Increase the amount of data wiped at the head and tail of the device from 4 to 10 MiB to ensure that all metadata/signatures are removed. Issue #1890: Improve parsing of the SMART attribute flags field. This will fix the display of the temperature for some devices. Categories News New updates available 10. January 2025 openmediavault 7.5.0 Try to prevent connection errors when installing plugins or package updates via UI. Issue #1875: Add option to select the Wi-Fi frequency band. Issue #1878: Fix netplan config parsing errors. Issue #1883: Modify the hint for the extended attributes setting in the SMB share form. Enable them by default. openmediavault-k8s 7.4.3 Take the proxy settings into account when cloning the recipes repository. Categories News"
