nter1Velocity1X Coordinate1X Value1Y Coordinate1Y Value1Z Value1dlEarfcn1pci1plmnID1rsrp1rsrq1subFrameNumber1sysFrameNumber1Operations 7E15R91RW62W2TypeBoolean13Float62Integer46Objlnk1Opaque7String17Time9Undefined21Unsigned Integer1ResourceIDNameOperationsTypeRange & EnumerationUnitsSubmitterDescription4000ObjectInstanceHandleRObjlnkOMAThe object link is used to refer an Instance of a given Object. An Object link value is composed of two concatenated 16-bit unsigned integers following the Network Byte Order convention. The Most Significant Halfword is an Object ID, the Least Significant Halfword is an Object Instance ID. An Object Link referencing no Object Instance will contain the concatenation of 2 MAX-ID values.4001ObjectVersionRStringOMALWM2M Object versioning label.4010LogClassRWInteger255OMA Define the Log Event Class: 0: generic (default) 1: system 2: security 3: event 4: trace 5: panic 6: charging [7-99]: reserved [100-255]: vendor specific 4011LogStartEOMAActions:a) Start data collection(DC)b) LogStatus is set to 0 (running)c) DC is emptied (default) or extended according arg'0' value Arguments definitions are described in the table below.4012LogStopEOMAActions: a) Stop data collection(DC) b) 1st LSB of LogStatus is set to "1"(stopped) c) DC is kept (default) or emptied according arg'0' value Arguments definitions are described in the table below. 4013LogStatusRInteger8-BitsOMAData Collection process status: Each bit of this Resource Instance value defines specific status: 1st LSB 0=running, 1=stopped 2nd LSB 1=LogData contains Valid Data 0=LogData doesn't contain Valid Data 3rd LSB 1=Error occurred during Data Collection 0=No error [4th -7th ] LSB:reserved 8th LSB: vendor specific.4014LogDataROpaqueOMARead Access on that Resource returns the Data Collection associated to the current Object Instance. 4015LogDataFormatRWInteger255OMA when set by the Server, this Resource indicates to the Client, what is the Server preferred data format to use when the LogData Resource is returned. when retrieved by the Server, this Resource indicates which specific data format is used when the LogData Resource is returned to the Server 0 or Resource not present : no specific data format (sequence of bytes)1 : OMA-LwM2M TLV format2 : OMA-LwM2M JSON format3: OMA-LwM2M CBOR format[4..99] reserved [100..255] vendor specific data format4016LogDataIncremental OpaqueOMALog data collected since the last Send operation described for the LogDataIncremental Minimum Send Interval resource, or since that interval has been set to a positive value if the first Send operation has not yet been performed. The data shall have the same format as the LogData resource, but its collection and emptying is independent from it and from the LogStart/LogStop logic. This resource may only be included in a Send operation payload. Attempting to access it via the Device Management and Service Enablement Interface shall result in generating the Method Not Allowed error.4017LogDataIncrementalMinimumSendIntervalRWUnsigned IntegerOMAMinimum number of seconds between consecutive Send operations containing the LogDataIncremental resource. If this resource is zero or not present, then LogDataIncremental shall never be sent in a Send operation. If set to a positive number, a Send operation containing the LogDataIncremental resource shall be performed after the specified number of seconds since the previous one or when a new log information is generated, whichever happens later, and the data collection shall be atomically emptied upon successful delivery. If the LwM2M client is connected to multiple servers, this resource SHOULD be handled independently for each server.Showing 1 to 10 out of 177 items1234567…18ObjectsVendor Bulk ReservationsTable of ContentsResourceID ClassesOMNA LwM2M ResourcesUseful links Newsletter F.A.Q Contact Us'''
