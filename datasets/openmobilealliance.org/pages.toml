["https://openmobilealliance.org/ucifi"]
title = ""
full_description = "uCIFI Joins OMA! uCIFI in OMAuCIFI and OMA: Advancing Open IoT StandardsuCIFI has joined Open Mobile Alliance (OMA) to strengthen interoperability and standardization for smart cities and utility IoT applications. This collaboration ensures seamless device communication, a unified data model, and enhanced cross-vendor compatibility.Discover how uCIFI within OMA fosters innovation, cross-industry synergy, and the development of scalable IoT solutions. Join us in shaping the future of open IoT standards!Join Our Webinaron March 6th, 07:00 am PSTJoin Now SCWG!Smart City Working Group (SCWG)Sign Up for OMA NewsletterFormer uCIFI MembersThe uCIFI® data model vision will continue with certification programs under OMA. A new “Smart City” Working Group will be specifically created within the OMA work program and the uCIFI® data model and trademark will continue to be kept and developed by the Smart City Working Group (SCWG) at the OMA.Ask Me Anything (AMA) WebinarSCWG AMA webinar - March 6th at 07:00 am PT / 15:00 GMT, the SCWG will host an AMA webinar, that will:Provide an overview of the uCIFI initiative for individuals who may not be familiar with its objectives and activities.Outline the methods of participation in uCIFI for those who have previously engaged with the initiative.Conduct a question-and-answer session in an Ask Me Anything format, allowing attendees to pose queries.Register for AMA WebinarSmart City Working GroupWe’re excited to launch the Smart City Working Group (SCWG), a major step toward advancing interoperability, innovation, and standardization in smart urban development. This new initiative within Open Mobile Alliance (OMA) is dedicated to shaping the future of connected cities by fostering seamless, efficient, and scalable solutions.As part of its mission, the group will maintain and evolve the uCIFI® data model and trademark, reinforcing its role as a cornerstone for open, interoperable smart city applications.Bringing together industry leaders, municipalities, and technology providers, the Smart City Working Group provides a collaborative platform to drive real-world urban transformation.As part of its mission, the group will maintain and evolve the uCIFI® data model and trademark, reinforcing its role as a cornerstone for open, interoperable smart city applications worldwide.Join us in shaping smarter cities for a better future!For any enquiries, please contact community@omaorg.org.Become an OMA member!"
