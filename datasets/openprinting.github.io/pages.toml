["https://openprinting.github.io/OpenPrinting-News-Windows-Protected-Print-vs.-Scanning-under-Windows"]
title = "OpenPrinting News - Windows Protected Print vs. Scanning under Windows - OpenPrinting"
description = "Windows Protected Print protects you from scanning"
full_description = "OpenPrinting News - Windows Protected Print vs. Scanning under Windows 1 minute read Around a year ago I reported here about Microsoft’s plans to make printing under Windows more secure, going the same way as we are going with the New Architecture in CUPS 3.x, an all-IPP print environment without printer drivers, only supporting modern, driverless IPP printers. In Windows it is especially important to get rid of printer drivers, as they are closed-source code pieces running in system or even kernel level. For Windows Protected Print (WPP) Windows does not use CUPS, but Mopria instead, and they do not have a concept for non-driverless legacy printers, whereas we have the Printer Applications (which can also be used under Windows). Microsoft’s plans were reported about in a blog on Microsoft’s community forum, where I also left some comments. Now, some weeks ago, I read new comments there where many users complained that with the 24H2 update of Windows 11, which introduced Windows Protected Print, scanning on the multi-function printers ceased to work, while printing is working. Modern multi-function devices which do driverless IPP printing also do driverless scanning, using at least one of the standard protocols eSCL or WSD, but it seems that Microsoft did not take care of that when implementing Windows Protected Print. Also on The Register got reported that with the update 24H2 of Windows 11 several users of Canon multi-function printers reported scanning not to work any more, despite Microsoft already having issued fixes. Microsoft promised to fix the bug by end-January, but they already left their users without scanning working for many weeks. But for the seasoned WSL tinkerer (Warning: Command line use required!) it should be solvable. Proceed as described here for legacy printers, but instead of (or in addition to) installing a Printer Application, install SANE (Scanner Access Now Easy): sudo apt install sane-backends sane-airscan sane-utils and then use the scanimage command. Enter man scanimage for how to use it. I hope this makes Windows 11 SANE for the time being. We will soon have Scanner Applications which emulate driverless scanners (eSCL, WSD), but note that current Windows has especially problems with those. And as usual: Stay updated on Mastodon: #OpenPrinting and @till@ubuntu.social. Or discuss on our mailing lists: Development: printing-architecture AT lists DOT linux DOT dev (Archive) Users: printing-users AT lists DOT linux DOT dev (Archive) Subscribing/Unsubscribing instructions Or on the Telegram OpenPrinting chat Updated: January 20, 2025 Comments Twitter Facebook LinkedIn Previous Next"
