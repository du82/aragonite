title = "OpenPrinting News - Google Summer of Code 2025 - The Linux Foundation is accepted as mentoring organization - OpenPrinting"
description = "The LF is in and so OpenPrinting as part of it will mentor again."
full_description = "OpenPrinting News - Google Summer of Code 2025 - The Linux Foundation is accepted as mentoring organization 1 minute read Now it is official and we do not need to tell any more to any interested contributor candidate “If we get accepted …”. We welcome contributors for OpenPrinting for the 17th time now! Already near the end of 2024, well before applying as mentoring organization for 2025, even before all of our GSoC 2024 projects have been completed, we have already watched out for contributors for this year, giving them onboarding materials, first assignments, talked about our fields of work with them … A month ago, before the application window for mentoring organizations opened, we published our project ideas list. This brought in another bunch of people contacting us to express that they want to get a GSoC contributor in our organization, some have even brought their own idea. If you like to participate in the GSoC as a contributor for OpenPrinting, please contact us ASAP (contact info below and on the project idea list) and do not wait for the official application window. We need to know you and your skills, we need to involve you in our developer community, we also will help you to write your proposal, … If you just post a proposal without contacting us before, your chances to get selected are not very high … We also need mentors, if you like to help us mentoring our contributors please tell us and also which projects/areas you want to mentor for. So please speak up and be a part of an amazing GSoC with us! And as usual: Stay updated on Mastodon: #OpenPrinting and @till@ubuntu.social. Or discuss on our mailing lists: Development: printing-architecture AT lists DOT linux DOT dev (Archive) Users: printing-users AT lists DOT linux DOT dev (Archive) Subscribing/Unsubscribing instructions Or on the Telegram OpenPrinting chat Updated: March 1, 2025 Comments Twitter Facebook LinkedIn Previous Next Common Print Dialog Backends Second Generation - Seventh Beta Release! 3 minute read Seventh beta with many fixes for bugs found during GSoC 2024, API improvements, support for CUPS instances, and explanation how CPDB works."
