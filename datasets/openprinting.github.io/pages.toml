["https://openprinting.github.io/current"]
title = "OpenPrinting - What are we doing currently? - OpenPrinting"
description = "OpenPrinting Project Leader"
full_description = "On this page The New Architecture for printing and scanning CUPS CUPS 2.5.x CUPS 3.x cups-filters 2.x Printer Applications PAPPL pappl-retrofit Native Gutenprint Printer Application Native HPLIP Printer Application Braille Printer Application Reviving legacy printers under Windows Scanner Applications GNOME Control Center - “Printers” module The print dialogs Optimizing DNS-SD browsing Distribution-independent packaging Printer Application look-up via the OpenPrinting web site This page represents the state of August 2022 Even after having achieved many nice things in the last 21 years there is always a lot to do, especially currently, on the way to the New Architecture for printing and scanning, to make everything completely standards-conforming and get rid of obsolete methods and technologies. Also there has been a lot of development of the systems and environments for which we provide the print functionality. Our work will continue to improve software integration. For example, there will be continued work on the printer setup tools and print dialogs of different desktop environments and applications, packaging methods like Snap, Flatpak, Docker, …, new forms of OS distributions (immutable core, all-Snap, …), … In addition we need to improve on things like CI and automated testing of our code. There will also be some work on documentation needed, especially for the APIs of our libraries. For all this we are always in search for contributors of the community. Therefore we are once reaching out by presenting on several conferences, like the OpenPrinting micro-conferences on the Linux Plumbers Conference (2019, 2020, 2021, 2022), Linux App Summit, GUADEC, …, and also internet platforms, like Ubuntu on Air (YouTube channel). And second, we are participating in the Google Summer of Code (GSoC) every year, having 5-8 3-month projects each year and some of the contributors continue to work with us voluntarily. I am leading OpenPrinting as my day job, thanks to my full-time employment at Canonical, the company behind Ubuntu, right for doing that. Thanks a lot to Canonical for supporting printing on Linux and other POSIX-style operating systems this way. Of additional help for us is also general funding, for conference travel, printers and supplies for our contributors, or even our own internships, at any time in the year. For this we accept donations/funding via the Linux Foundation’s LFX Croudfunding. YouTube Video of the Ubuntu Office Hours with Till Kamppeter, Aveek Basu, Divyasheel Kumar, and Pranshu Kharkwal, hosted by Monica Ayhens-Madon The New Architecture for printing and scanning Emphasis of our work at OpenPrinting is the New Architecture. 6 of our 7 GSoC contributors this year are working on it and also Michael Sweet’s and my work are focused on it. Subject of the New Architecture is getting a streamlined, standards-conforming printing and scanning workflow without obsolete methods and technologies and integrating well into modern operating system and network environments. YouTube Video of the Ubuntu Desktop Team Indaba with Till Kamppeter and Michael Sweet, hosted by Heather Ellsworth and Monica Ayhens-Madon For 22 years now, since its 1.0 launch, CUPS uses principally the same architecture: PostScript was the standard job format as printers usually used with UNIX were PostScript devices. Capabilities of a printer are described by a PPD (PostScript Printer Description) file. The PPD file describes all user-settable options, resources (trays, paper sizes, resolution, quality, color, …) in a static text file. To cover non-PostScript printers the PPD file format got extended (by Michael Sweet) to specify a filter to generate the printer’s native format. Filters use Ghostscript (or Poppler) to convert PostScript input. Print queues were manually created, with drivers (= PPDs + filters) assigned to them. We especially want to get rid of the PPD files, because … In 1984 Adobe stopped development on PPDs (and also PostScript), so we started with an obsolete (but useful) format right away. In 2006 we abolished PostScript as print job format and replaced it by PDF. PPD files can represent user-settable options only as enumerated choice or boolean. Ugly workarounds for things like passwords or color adjustment are needed, implemented in CUPS and Foomatic. As CUPS was always following the standards of the Printer Working Group (PWG), a consortium of printer, OS, general IT, … industry with which OpenPrinting works closely together and with Michael Sweet (author of CUPS) actively developing on the Internet Printing Protocol (IPP) for decades, we follow them even more to create an all-IPP CUPS without the legacy of PPD files and driver filters. These are exactly the established standards of driverless IPP (IPP Everywhere, AirPrint, Mopria) with print destinations advertising themselves via DNS-SD (also known as mDNS, ZeroConf, BonJour), communicating via pure IPP and using common data formats for print jobs (PDF, PWG Raster, Apple Raster, PCLm). CUPS 3.x will not support PPD files from the ground up. The CUPS Snap does not allow adding PPDs and filters as it consists of an immutable file system image in a security sandbox. Now only driverless IPP printers are supported. No manually created CUPS queues: IPP printer discovered, temporary queue automatically created (exception, CUPS sharing daemon). Filtering only for driverless standard formats: PDF, PWG Raster, Apple Raster, PCLm output, no need to add filters Current CUPS architecture New CUPS architecture This will not only eliminate any obsolete technologies and methods, but it will also integrate much better in modern system environments, operating systems with with immutable core file system or distribution-independent, sandboxed packaging, like Snap, Flatpak, or Docker. This is due to the fact that components only interact via IP-based protocols like IPP and DNS-SD and no files or one component have to be installed in the file system of another, especially no binary executable files. So every component can be in its own sandbox and have its own immutable file system. Most modern printers, even the cheapest ones as manufacturers want to allow printing from smartphones, do driverless IPP printing, most commonly AirPrint but currently also Mopria. So they work perfectly under Linux and alike operating systems, currently and also after the transition to the New Architecture. But we will not drop or exclude legacy and specialty printers which do not do driverless IPP and therefore need a driver. There will be no printer drivers based on PPD files, and filter executables any more, but a completely new format, the Printer Applications. These are emulations of driverless IPP printers which internally convert the job data to the printer’s native format and pass it on to the physical printer. This way CUPS only needs to deal with driverless IPP printers and manual creation of print queues (with drivers) is not needed any more. As modern multi-function devices do not only provide driverless IPP printing but also driverless eSCL (or WSD) network scanning. We go a similar way for scanning, creating Scanner Applications and so eliminate the need of SANE drivers which are libraries, dynamically linked by the application which scans, which is even worse for distribution-independent, sandboxed packaging. This way we can also create distribution-indpendent sandboxed packages for scanner and multi-function device drivers. This way the New Architecture also helps printer/scanner manufacturers who for some reason cannot or do not want to go driverless, can easily create and distribute drivers for their devices. CUPS CUPS is the standard print environment in Linux and other POSIX-style oprating systems for more than 20 years now.It is the daemon managing print queues with appropriate printer drivers, receiving, queueing, spooling, and printing print jobs from applications, sharing print queues on the netwok, … With CUPS having moved from Apple to OpenPrinting, developemnt, especially of new fetures, has resumed. We do annual feature releases again and bug fix releases as needed inbetween. Michael Sweet has presented a roadmap for the further development o CUPS on the Linux Plumbers Conference 2021 (slides) and on the OpenPrinting Summit/PWG meeting 2022 (slides). CUPS 2.5.x Its development is supposed to start soon and it is scheduled to be released towards the end of 2022. This is the last series in the 2.x generation, still supporting the current architecture based on print queues with PPD files and printer-model-specific filters (aka drivers). The main new feature here is full support for OAuth authotization and OpenID authorization servers. There are IPP attributes to support OAuth (from slide 28 on). Especially also an interface (most probably D-Bus) bewtween cups and the a GUI tool for the user authentication is planned to be created. OAuth authentication should replace the more awkward Kerberos which requires root access. Also there are several free software implementations of OAuth support, especially also Michael Sweet’s own mOAuth. CUPS 3.x The next generation of CUPS implements the New Architecture: Classic printer drivers based on PPDs and printer-model-specific filters are not supported any more. In adition, the CUPS project gets split into various smaller modules: libcups, commands, local server, sharing server. Release is scheduled for the end of 2023, meaning that until then all related software, like cups-filters, all printer drivers, print dialogs, printer setup tools, … needs to be prepared for the New Architecture, which is subject of most of our work currently. Michael Sweet has already started the development on the new libcups3. Planned splitting of the project is as follows: libcups CUPS library Commands Command line interface: lp, lpstat, cancel, lpinfo, lpadmin, … Local Server In case one only needs print functionality on the local machine and does not want to share out print queue to other machines, a simple user daemon (not running as root), the local server is used. Queues are automatically set up temporarily on discovered IPP printers, as current CUPS daemons already do. Manual queue creation is not supported, also no PPDs and no adding of filters. There is no web interface. The daemon is accessed through the usual domain socket and will get a new D-Bus API for GUIs connecting printing, authentication, and notifications. The daemon does listen on port 631. Profiles can be created to acces printers and servers outside the DNS-SD-discoverable local network. Sharing Server If print queues are supposed to get shared out to the network, the sharing server is used. It listens on port 631 for remote clients inquiries, and behaves as a standard IPP printer on the network. It has a web interface and can be configured similar to current (2.x) CUPS daemons. cups-filters 2.x cups-filters provides filters (to convert data formats for printing) and backends (to communicate with printer hardware) for use with CUPS under non-Mac operating systems. The project originates in Apple (owner of CUPS that time) outsourcing the filters which were not used by Mac OS to OpenPrinting back in 2011. With the replacement of classic printer drivers consisting of PPD files and filter executables by Printer Applications we are also changing the architecture of cups-filters, in the new 2.x generation. The first time when I mentioned that the architecture of cups-filters needs to get changed and that for this I would start a cups-filters 2.x generation was in March and April 2020. Development started mid-2020 (2 years ago) with creating a libppd containing all PPD support functionality of libcups (in libcups3 it will get removed) for retro-fitting classic drivers and PostScript PPDs in July. The next step was turning all the individual filter executables into library functions, the filter functions, for being easily used by Printer Applications, starting in August and with this separating the cups-filter 1.x development into its own branch. These changes have been all performed already and have been made use of in the printer-driver-retro-fitting Printer Applications. To finalize cups-filters 2.x, the support for PPD files in the filter functions has been completely separated from libcupsfilters and moved into libppd, so that libcupsfilters can be installed without installing libppd and so distributions do not need to keep the PPD-file-retro-fitting library in their standard installation. Currently we are in the phase of final testing, code clean-up and separating the projects: libcupsfilters, libppd, cups-filters-legacy (the filter executabls), and cups-browsed, to allow the release of cups-filters 2.0b1, in the coming weeks. Printer Applications As mentioned earlier Printer Applications are the new format for printer drivers, emulations of IPP printers, to turn the all-IPP New Architecture into reality. They also can be easily put into sandboxed, distribution-independent packages like Snaps, for easy distribution of printer drivers by hardware manufacturers. We already have retro-fitted the drivers for ~10000 printer models, the drivers which are usually available in Linux distributions into 4 Printer Applications and put up those in the Snap Store, to not lose any printer support when switching to the New Architecture, but there are still a lot of things to do. PAPPL Michael Sweet’s PAPPL is the base for all currently available Printer Applications, the 4 retro-fitting ones of OpenPrinting and also Michael Sweet’s LPrint and hp-printer-app. It provides everything which every Printer Application needs: A daemon which emulates an IPP printer A web interface to configure the printers (drivers, loaded media, default settings … Advertising the printers via DNS-SD Receiving Apple/PWG Raster jobs and images and feeding the pixels into the actual driver Handling certificates and encryption … This makes it much easier to create a Printer Application and one only needs to add the driver itself, what turns the jobs into the printer’s native format, and what tells the outside world about the capabilities of the printer. PAPPL is nearly complete and currently Michael Sweet has added support for supply level readout and for localization of option and choice strings. PAPPL is under continuous development. pappl-retrofit pappl-retrofit is based on PAPPL and provides everything that Printer Applications which retro-fit classic CUPS drivers need: Convert PPD file collections into human-readable lists of supported printers Convert PPD options into printer IPP attributes and web interface options Manage installable accessories (like trays) and reflect the accessory configuration in the option lists Poll accessory configuration and default settings from the printer Manage list of loaded media for media-ready IPP attribute This reduces the effort of programming for creating a Printer Application to a minimu"
author = "Till Kamppeter"
year_published = 2025
