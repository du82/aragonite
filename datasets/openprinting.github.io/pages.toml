["https://openprinting.github.io/about-us"]
title = "About Us - OpenPrinting"
description = "Learn more about OpenPrinting"
full_description = "OpenPrinting How did this all begin? Our principal achievements What we are currently doing A Brief History Before 2006, linuxprinting.org and Free Standards Group’s OpenPrinting WorkGroup were working on the printing architecture for Linux. Till Kamppeter was the manager of linuxprinting.org and FSG’s OpenPrinting WG was led by Tom Hastings, Michael Sweet, Ira McDonald, Claudia Alimpich, Glen Petrie, and Norm Jacobs. linuxprinting.org was known as the de facto standard repository for printer drivers on Linux. In parallel, FSG’s OpenPrinting workgroup designed standard APIs for the Linux/Unix printing workflow. In July 2006 linuxprinting.org merged with FSG’s OP WorkGroup and Till Kamppeter was hired to lead OpenPrinting. On January 22, 2007, the FSG and the Open Source Development Labs(OSDL) merged to form The Linux Foundation. Now, OpenPrinting is a free software organization under The Linux Foundation. Major Roles OpenPrinting Works on the development of new printing architectures, technologies, printing infrastructure, and interface standards for Linux and UNIX-style operating systems. Collaborates with IEEE-ISTO Printer Working Group (PWG) on IPP projects. Is working with SANE to make driverless scanning a reality. Maintains cups-filters which allows CUPS to be used on any Unix-based (non-macOS) system. Is responsible for the Foomatic database. Is working on the Common Print Dialog Backends project. Takes care of integrating the printing infrastructure with all types of operating systems (classic distro, immutable distro, …) and software distribution technologies (Snap, Docker, …) Our Code of Conduct: Code of Conduct"
