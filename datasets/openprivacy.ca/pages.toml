full_description = "1.3 If there is a conflict between these Bylaws and the Act or the regulations under the Act, the Act or the regulations, as the case may be, prevail. 2.1 A person may apply to the Board for membership in the Society, and the person becomes a member on the Board’s acceptance of the application. 2.4 A member is not in good standing if the member fails to pay the member’s annual membership dues, if any, and the member is not in good standing for so long as those dues remain unpaid. (b) is deemed not to be a voting member for the purpose of consenting to a resolution of the voting members. 2.6 A person’s membership in the Society is terminated if the person is not in good standing for 6 consecutive months. (f) business arising out of a report of the directors not requiring the passing of a special resolution. 3.3 A notice of a general meeting must state the nature of any business, other than ordinary business, to be transacted at the meeting in sufficient detail to permit a member receiving the notice to form a reasoned judgment concerning that business. (b) if the Board has not appointed an individual to preside as the chair or the individual appointed by the Board is unable to preside as the chair, (iii) one of the other directors present at the meeting, if both the president and vice-president are unable to preside as the chair. 3.5 If there is no individual entitled under these Bylaws who is able to preside as the chair of a general meeting within 15 minutes from the time set for holding the meeting, the voting members who are present must elect an individual present at the meeting to preside as the chair. 3.6 Business, other than the election of the chair of the meeting and the adjournment or termination of the meeting, must not be transacted at a general meeting unless a quorum of voting members is present. 3.7 The quorum for the transaction of business at a general meeting is 3 voting members or 10% of the voting members, whichever is greater. 3.8 If, within 30 minutes from the time set for holding a general meeting, a quorum of voting members is not present,"
year_published = 2025
