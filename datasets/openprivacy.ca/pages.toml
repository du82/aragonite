description = "The Open Privacy Research Society is a non-profit Canadian group based in Vancouver, British Columbia. We believe that moral systems enable consent. Our society exists to invent, create, build, test, publish, deploy, promote, and to encourage the development of such systems"
full_description = "Call for Board Member Nominations 01 Jan 2024 We are open to nominations for new people to join the Open Privacy Research Society’s Board of Directors! In particular, we are looking for individuals who have experience in fundraising and organizational capacity building. But if you think you have a skill you can bring to the Open Privacy board then we really want to hear from you. Read More 2022 End Of Year Report 28 Nov 2023 Read More Discreet Log: July 2023! 14 Jul 2023 Welcome to Discreet Log for July 2023! Discreet Log is our regular digest providing a summary of the research, projects and tools that we work on at Open Privacy. In this edition we want to tell you about the release of Cwtch Beta 1.12, new updates to Repliqate, and an update on our 2023 fundraising goal. Read More Discreet Log: April 2023! 04 May 2023 Welcome to Discreet Log for April 2023! Discreet Log is our monthly digest providing a summary of the research, projects and tools that we work on at Open Privacy. In this edition we want to tell you about how to test new features in Cwtch Nightlies, and introduce you to the new Cwtch developer documentation! Read More Discreet Log: March 2023! 04 Apr 2023 Welcome to Discreet Log for March 2023! Discreet Log is our monthly digest providing a summary of the research, projects and tools that we work on at Open Privacy. In this edition we want to tell you about all the exciting new Cwtch Development Logs that have been released this month - including the Cwtch Beta 1.11 release, and updates on the Cwtch Stable roadmap, new volunteer documentation, and more! Read More Discreet Log: February 2023! 28 Feb 2023 Welcome to Discreet Log for February 2023! Discreet Log is our monthly digest providing a summary of the research, projects and tools that we work on at Open Privacy. In this edition we want to tell you about all the exciting new Cwtch Development Logs that have been released this month - including news of UI Testings, and updates on reproducibility, and automation, of Cwtch bindings! Read More Discreet Log: January 2023! 31 Jan 2023 Welcome to Discreet Log for January 2023! Discreet Log is our monthly digest providing a summary of the research, projects and tools that we work on at Open Privacy. In this edition we want to tell you about all the exciting new Cwtch Development Logs that have been released this month - including news of Cwtch Stable and Reproducible Builds! -and how to follow Cwtch updates across social media. Read More Discreet Log #35: Cwtch 1.10 Released! 16 Dec 2022 Welcome to Discreet Log 35! A regular update providing a look into the research, projects and tools that we work on at Open Privacy. This edition we want to tell you about all the exciting new features in Cwtch 1.10. Read More Discreet Log #34: Scaling Cwtch Connections 15 Nov 2022 Welcome to Discreet Log 34! A regular update providing a look into the research, projects and tools that we work on at Open Privacy. This edition we want to tell you about some upcoming changes to connection management for Cwtch 1.10, the ongoing Cwtch Bug Bash list, updated build containers, and a new article about P2P communications featuring Cwtch! Read More Discreet Log #33: Cwtch 1.9 Released! Privacy is Consent T-shirts have been shipped! 16 Sep 2022 Welcome to Discreet Log 33! A regular update providing a look into the research, projects and tools that we work on at Open Privacy. This edition we want to tell you about all the exciting new features in Cwtch 1.9, Privacy is Consent t-shirts, and some recent reporting of vulnerabilities in the email client Thunderbird. Read More 2021 End Of Year Report 01 Aug 2022 Read More Discreet Log #32: Cwtch Documentation 03 Jun 2022 Welcome to Discreet Log 32! This week we want to tell you exciting information about the new Cwtch Handbook; and a video and comments from a recent panel on Privacy and Human Rights featuring Dan Ballard, our Director of Engineering. Please consider donating or volunteering to help us continue our research and development of surveillance resistant software. Read More Discreet Log #31: Privacy is Consent 20 May 2022 Welcome to Discreet Log 31! We are well into Open Privacy’s 2022 fundraising drive! We’ve gotten some wonderful new supporters, but currently not enough to support all our staff continuing on through the year. We’re still looking at how we can keep pursuing our goals with reduced capacity. Please consider donating or volunteering to help us continue our research and development of surveillance resistant software. Read More Discreet Log #30: Future Plans for Cwtch 04 May 2022 We have kicked off Open Privacy’s 2022 fundraising drive! We’ve gotten some wonderful new supporters, but currently not enough to support all our staff continuing on through the year. We’re still looking at how we can keep pursuing our goals with reduced capacity. Please consider donating or volunteering to help us continue our research and development of surveillance resistant software. Read More Discreet Log #29: Cwtch 1.7 and Update Bot! 22 Apr 2022 We have kicked off Open Privacy’s 2022 fundraising drive! We’ve gotten some wonderful new supporters, but currently not enough to support all our staff continuing on through the year. We’re still looking at how we can keep pursuing our goals with reduced capacity. Please consider donating or volunteering to help us continue our research and development of surveillance resistant software. Read More Discreet Log #28: Message Text Formatting 08 Apr 2022 We have kicked off Open Privacy’s 2022 fundraising drive! We’ve gotten some wonderful new supporters, but currently not enough to support all our staff continuing on through the year. We’re still looking at how we can keep pursuing our goals with reduced capacity. Please consider donating or volunteering to help us continue our research and development of surveillance resistant software. Read More Discreet Log #27: Cwtch Android Improvements 25 Mar 2022 We have kicked off Open Privacy’s 2022 fundraising drive! We’ve gotten some wonderful new supporters, but currently not enough to support all our staff continuing on through the year. We’re still looking at how we can keep pursuing our goals with reduced capacity. Please consider donating or volunteering to help us continue our research and development of surveillance resistant software. Read More Discreet Log #26: Cwtch Translations and Donate Bitcoin via BTCPay 10 Mar 2022 We have kicked off Open Privacy’s 2022 fundraising drive! We’ve gotten some wonderful new supporters, but currently not enough to support all our staff continuing on through the year. We’re still looking at how we can keep pursuing our goals with reduced capacity. Please consider donating or volunteering to help us continue our research and development of surveillance resistant software. Read More Discreet Log #25: Notifications, Cwtch 1.6.1, Fundraising 25 Feb 2022 We have kicked off Open Privacy’s 2022 fundraising drive! We’ve gotten some wonderful new supporters, but currently not enough to support all our staff continuing on through the year. We’re starting to look at how we can keep pursuing our goals with reduced capacity. As such, we will be changing the format of Discreet Log to lighten the writing load on staff and as a reflection of reduced development speed and capacity going forward. Read More Discreet Log #24: 4 Years of Open Privacy! Cwtch 1.6! We need your Support! 11 Feb 2022 Four years ago today, on February 11th 2018, we officially incorporated the Open Privacy Research Society. The work that we do couldn’t exist without an active and amazing base of supporters, like you, who enable our mission - researching and developing privacy enhancing technologies focused on those people and communities that need them most. To celebrate our 4th year anniversary I would like to invite you to review the amazing work that you helped support over the last few years - and once again ask for your help and support to help us continue our mission in 2022. Read More Discreet Log #23: Improving Cwtch testing using Cucumber/Gherkin scripts 28 Jan 2022 As a small team producing a complex application, automated testing is an important part of the Cwtch development process, providing confidence that new features or fixes aren’t breaking old ones that we may not always think to test manually. In previous posts, we’ve talked about how we use widget testing, integration testing of the Cwtch backend library, and fuzzing to accomplish this. What we’ve been lacking to date, however, is a wide-ranging (feature complete) frontend integration test. This week’s Discreet Log will talk about how we’re accomplishing that alongside the 1.6 release using Gherkin scripting. Read More Discreet Log #22: Building on Cwtch - A Vision for 2022 10 Dec 2021 This week we have been putting the finishing touches on Cwtch Beta 1.5, a much larger release than its predecessors due to the new features and significant refactors that have been planned in. I wanted to take a moment away from pull requests and fuzz testing to talk to you about the future of Cwtch and present to you a vision for the future of surveillance resistant applications. Don’t worry, there isn’t a single blockchain or NFT in sight! Read More Discreet Log #21: Coming Soon: Image Previews and Links! 26 Nov 2021 Cwtch Beta 1.5, slated for release in mid-December, includes a number of quality-of-life improvements that users have been asking for. Some are even already available in nightlies, such as the clickable links experiment. This post will give you a small preview of what’s coming and, in Discreet Log tradition, talk about some of the technical choices we made and try to answer questions you might have about the implementation. Read More Discreet Log #20: Cwtch Servers Experiment 11 Nov 2021 Our 1.4 Release of Cwtch now includes a new experiment: hosting and management of Cwtch Servers inside the Cwtch app. What are Cwtch Servers and What are They For? Traditionally messengers have solved offline delivery with centralized servers which, as a side effect, must collect metadata to operate. In a step towards decentralization some federated services like Mastodon or Matrix, do technically allow anyone to run their own server, but the setup is usually a barrier to everyone doing it, and still results in metadata collection by the service operator. Directly messaging a contact in Cwtch is done peer to peer over Tor v3 onion servers. This is optimal as there are no intermediary services used. However, this comes with a major constraint: both parties must be online. If we want offline message delivery, we need some form of shared infrastructure to support it. Cwtch servers are designed to be untrusted. Which means that don’t learn anything about the messages they are hosing or the profiles or groups those messages are associated with. Cwtch servers can be hosted privately, for efficient, small group communication, or shared publicly to allow people without the resources access to private, shared, infrastructure. Read More Discreet Log #19: Cwtch Roadmap (1.4 to 1.7) 29 Oct 2021 Early last week the Open Privacy Executive Team met up to work in person for the first time since the start of the pandemic. On the agenda was organizational planning, Cwtch development and building out a new roadmap. For this week’s Discreet Log, I would like to present an overview of our plans for the next 6 months and invite you to help us support further development on truly decentralized and surveillance resistant technology. Read More Discreet Log #18: libCwtch in Rust 12 Oct 2021 LibCwtch is our interface (API) library to Cwtch, which was started over 3 years ago as a Go language project. Since then we have started using Flutter and Dart to build our front end UI which meant we needed a more language agnostic interface to Cwtch so we created libCwtch, which is some wrapper functionality around Cwtch and it compiles to a C library that any language can access via FFI. The first language binding we made for libCwtch was Dart which is currently built into our cwtch-ui. At some point we’d like to find the time to break the Dart bindings out into a standalone Dart package that anyone can use to access libCwtch from Flutter/Dart. Since starting work with Go 3 years ago our interest in working in Rust has been growing so it was the logical next language we would look at to create bindings for. Read More Discreet Log #17: Filesharing FAQ 01 Oct 2021 Welcome to Discreet Log! A fortnightly technical development blog to provide an in-depth look into the research, projects and tools that we work on at Open Privacy. For our 17th edition Erinn Atwater answers some questions about the new filesharing feature in Cwtch 1.3. Today’s release of Cwtch 1.3 includes support for a new experimental feature: file sharing! Windows, Mac, Linux and Android users can enable the File Sharing experiment from the global settings panel. Files are sent peer-to-peer directly over Cwtch/tor connections. In this week’s Discreet Log, I thought I’d answer some questions about the finer points of how it all works. Read More Discreet Log #16: Cwtch Secure Development Handbook 17 Sep 2021 Welcome to Discreet Log! A fortnightly technical development blog to provide an in-depth look into the research, projects and tools that we work on at Open Privacy. For our 16th edition Sarah Jamie Lewis talks about recent updates to the Cwtch Secure Development Handbook. Over the years Cwtch has evolved from a single codebase proof-of-concept to an ecosystem that spans several subcomponents, historical and current UI front-ends, platform-specific code and multiple language bindings (more on that in a few weeks). Keeping track of the privacy and security risks, mitigations and concerns in addition to all the other complexity is a job that is too big for any one codebase, issue tracker or wiki. That is why, a few years ago, I started maintaining the Cwtch Secure Development Handbook. Recently the handbook has undergone a few updates, and that is what I want to talk about this week. Read More Discreet Log #15: Cwtch Comes to MacOS 03 Sep 2021 Open Privacy just released Cwtch Beta 1.2 and one of the biggest new features was an full new MacOS port. Read More 2020 Financial Statements - Notice to the Reader 25 Aug 2021 Read More 2020 End Of Year Report 25 Aug 2021 2020 End Of Year Report Read More Discreet Log #14: Lockbox Case Study 19 Aug 2021 Fighting back against tech abuse and surveillance is (unfortunately) an ever-ongoing job, and every once in a while our developers need to come up from the privacy mines to take some much-needed R&R. While Erinn is on staycation (traveling the cyberverse to sample the latest cryptodelicacies and witness hot new mathematical attractions), we thought we’d share with you a recent case study we wrote following last year’s engagement creating the Lockbox encrypted form app to power a local"
