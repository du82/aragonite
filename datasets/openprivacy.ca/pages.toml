title = "Discreet Log: July 2023! | Open Privacy Research Society"
description = "July 2023: Cwtch Beta 1.12, Reproducible Builds, New Repliqate Updates, Help us reach out 2023 fundraising Goal, and more!"
full_description = "Discreet Log: July 2023! 14 Jul 2023 Welcome to Discreet Log! A regular update providing a look into the research, projects and tools that we work on at Open Privacy. Welcome to Discreet Log for July 2023! Discreet Log is our regular digest providing a summary of the research, projects and tools that we work on at Open Privacy. In this edition we want to tell you about the release of Cwtch Beta 1.12, new updates to Repliqate, and an update on our 2023 fundraising goal. Help us reach our 2023 Fundraising Goal! Our 2023 fundraising goal reflects the reductions we made to staff and operations last year. This year we are only looking to raise $60,000 to support active research and development in projects like Cwtch, as well as maintain our existing projects and infrastructure. We could not do our work without you. One of the most effective ways you can support us is by setting up a recurring donation on Patreon or Paypal. Thanks to recurring support and individual donations we are already expecting to reach 66% of the target! We would like to extend a huge thank you to everyone who has helped support Open Privacy over the years. For more information about donating to Open Privacy and claiming a thank you gift please visit our Donate page. Cwtch Beta 1.12 and Cwtch Stable Roadmap Update The Cwtch Dev Team ended June with two big releases. The first was Cwtch Beta 1.12. Cwtch 1.12 is the culmination of the last few months of effort by the Cwtch team, and includes many foundational changes that pave the way for Cwtch Stable including new features like profile attributes, support for new platforms like Tails, and multiple improvements to performance and stability. Last week, the team also released the latest Cwtch Stable Roadmap Update looking back on the goals set out in January and March, and plotting a course towards a full Cwtch Stable candidate release later this summer! Reproducible Builds In their latest devlog the Cwtch team discuss how the Cwtch UI is currently built, the changes they have made to Cwtch UI to make future distributions verifiable, and the next steps they will be taking to make all Cwtch builds reproducible. Repliqate Updates As part of our ongoing effort towards making all parts of Cwtch reproducible and verifiable, we have also improved Repliqate, an Open Privacy tool that makes it easy to construct isolated build environments, powered by Qemu and a standard cloud image distribution. The latest version of Reqpliate now allows for optional KVM acceleration, and features several fixes designed to speed up building and analysis. New Social Media As we announced in the January Discreet Log, you can now follow both Open Privacy and Cwtch on Mastodon! Open Privacy: https://hachyderm.io/@openprivacy Cwtch: https://fosstodon.org/@cwtch In addition, we have recently launched a Cwtch.im Instagram for some of the more visual aspects of Cwtch development. Stickers! Donations of $5 or more receive stickers as a thank-you gift, and $25 or more gets you one of our new sticker sheets! For more information about donating to Open Privacy and claiming a thank you gift please visit our Donate page."
