title = "Cwtch Alpha 0.3.1 | Open Privacy Research Society"
description = "Today we are proud to announce and release Cwtch Alpha 0.3.1"
full_description = "Cwtch Alpha 0.3.1 17 Dec 2019 Today we are proud to announce and release Cwtch Alpha 0.3.1! Featuring a first cut of profile management. Profile Management and UI improvements When you start Cwtch, you will be greeted with the new profile management screen Any profiles with no password (like the default auto created one of previous versions) will be automatically loaded. You can enter passwords to load further profiles stored with those profiles. Cwtch will not show unloaded profiles. You can create new profiles, setting your name, and choosing a password. We also now support deleting profiles. Additional Improvements On top of all these nice UI additions, further changes included in this release are: contact lists are now sorted by most recent activity! a network connection monitor which will inform of underlying network issues improved state management for Android builds. On to 2020 Cwtch is still in active development. Some existing Android issues around state will be more obvious with this release and one of our main priorities in the new year will improving this flow. Beyond that, we have a laundry list of small tasks and ideas for Cwtch. In the new year we’ll be revisiting groups and server performance with Tapir. As always, this ongoing work is only possible thanks to our amazing supporters. Please consider donating to ensure a future where technology is rooted in consent. Join Us on Cwtch We encourage those interested to join our Cwtch Alpha discussion group using the following invite: torv3CiA2NmI0NmM4OGMxNDc1ZGUxODE5YWYyYTk1ZDM5NTQ4ZBIgDSFY2mxYJiSJs0b442hFChzaHB5B8EERcFqLAkpb5kAaODJjM2ttb29ibnlnaGoyenc2cHd2N2Q1N3l6bGQ3NTNhdW8zdWdhdWV6enB2ZmFrM2FoYzRiZHlkIkBgg+E0T4YKtxnw57sHQbuG3C6myjU2aS496O4n3jpzQu8iT25NReJnuwqv9ER93wE1N9g1f7WY8JCtx0bnvyQK For those who are more adventurous, please check out our continuous Windows, Android and Linux builds. These get updated after every approved pull request, and are likely to be much less stable than versioned builds. https://build.openprivacy.ca/files/. The Open Privacy Staff"
