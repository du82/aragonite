["https://openprivacy.ca/research/OPTR2019-01"]
title = "Token Based Services - Differences from Privacy Pass | Open Privacy Research Society"
description = "The Open Privacy Research Society is a non-profit Canadian group based in Vancouver, British Columbia. We believe that moral systems enable consent. Our society exists to invent, create, build, test, publish, deploy, promote, and to encourage the development of such systems"
full_description = "Token Based Services - Differences from Privacy Pass Published: 12 December 2019 Technical Report: OPTR2019-01 An approach to allow anonymous peers to (pre-)purchase services from anonymous servers based on Privacy Pass Authors Erinn Atwater - Open Privacy Research Society Sarah Jamie Lewis - Open Privacy Research Society Abstract We outline an approach to allow anonymous peers to (pre-)purchase services (e.g. message hosting) from anonymous servers based on Privacy Pass. Service providers offer the purchase of “tokens” that can be later redeemed for services in a similar way to how prepaid cards work. Separating the act of purchasing tokens from using them provides several advantages over purchasing the services directly, even if we assume the purchasing method is completely metadata resistant. This separation allows us to amortize the latency and transaction fees associated with cryptocurrency transactions over several tokens, reducing friction after the initial investment. Also, because tokens are unlinkable and fungible, peers can share tokens across devices or even between group members, opening up the services to a wider audience while preserving the privacy of individual users. When considering payment channels that do not offer strong privacy protections, separating acquisition and redemption provides another tool for enabling peers to manage risks to their anonymity. This paper outlines the differences of our protocol from the original Privacy Pass paper and – except where specified – uses the same notation as that paper. It is prerequisite reading for understanding what follows. Versions 12 December 2019 Bibtex @TECHREPORT{OPTR2019-01, AUTHOR = {Erinn Atwater and Sarah Jamie Lewis}, TITLE = {{Token Based Services - Differences from Privacy Pass}}, NUMBER = {OPTR2019-01}, INSTITUTION = {Open Privacy Research Society}, ADDRESS = {Vancouver, Canada}, MONTH = {December}, YEAR = {2019}, URL = {https://openprivacy.ca/research/OPTR2019-01/}, CONTACT = {contact@openprivacy.ca} }"
