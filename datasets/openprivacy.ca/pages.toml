["https://openprivacy.ca/discreet-log/37-february-2023"]
title = "Discreet Log: February 2023! | Open Privacy Research Society"
description = "February 2023: Cwtch Bindings, Android Reproducible Builds, Automated UI Testing"
full_description = "Discreet Log: February 2023! 28 Feb 2023 Welcome to Discreet Log! A regular update providing a look into the research, projects and tools that we work on at Open Privacy. Welcome to Discreet Log for February 2023! Discreet Log is our monthly digest providing a summary of the research, projects and tools that we work on at Open Privacy. In this edition we want to tell you about all the exciting new Cwtch Development Logs that have been released this month - including news of UI Testings, and updates on reproducibility, and automation, of Cwtch bindings! Cwtch UI Testing One of the main threads of work that needed to be complete early in the Cwtch Stable roadmap was integrating UI tests into our build pipelines, in addition to expanding their scope. Because this work is ongoing we have taken to releasing periodic updates: Notes on Cwtch UI Testing Notes on Cwtch UI Testing II This effort has already started to pay off, catching bugs that would have been difficult to find any other way - and we expect this work to continue through March. Making Cwtch Android Bindings Reproducible In mid-February, we continued our previous work on reproducible Cwtch bindings, uncovering the final few sources of variation between our Repliqate scripts and our docker/drone builds, leading to fully reproducible builds for Cwtch Android bindings! Autogenerating Cwtch Bindings The C-bindings for Cwtch evolved as part of Cwtch UI development. After two years of prototyping, development, new features, and revisiting first implementations we have reached the point where we have a good understanding of what the bindings need to do, and how they should do it. At the end of February we released a first cut of a workflow to automatically generate these bindings: cwtch-autobindings. New Social Media As we announced in the January Discreet Log, you can now follow both Open Privacy and Cwtch on Mastodon! Open Privacy: https://hachyderm.io/@openprivacy Cwtch: https://fosstodon.org/@cwtch In addition, we have recently launched a Cwtch.im Instagram for some of the more visual aspects of Cwtch development. Stickers! Donations of $5 or more receive stickers as a thank-you gift, and $25 or more gets you one of our new sticker sheets! For more information about donating to Open Privacy and claiming a thank you gift please visit our Donate page."
