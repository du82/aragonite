["https://openprivacy.ca/people/dan-ballard"]
title = "Dan Ballard | Open Privacy Research Society"
description = "The Open Privacy Research Society is a non-profit Canadian group based in Vancouver, British Columbia. We believe that moral systems enable consent. Our society exists to invent, create, build, test, publish, deploy, promote, and to encourage the development of such systems"
full_description = "Dan Ballard Summary I am a programmer and researcher focusing on security and privacy through decentralization, building accessible tools that everyone can use, and new social tools that are safer and more capable of supporting complex humans and their interactions. As a developer I have a focus on the product side of things, making process and code excellent and accessible to get it into the hands of as many people as possible and make them happy. I also have a deep ops and infrastructure background running all manor of Linux and BSD servers and services for the last 15+ years. My work at Open Privacy is focused on: Cwtch: a metadata resistant messaging system Open Infrastructure: infrastructure and tooling to make our development lives easier, more reliable, and better (such as our code storage and build pipeline) and contributing them back to the community. Tidbits I run a tor relay node. I’ve helped run a few Cryptoparties (Vancouver and University of the Fraser Valley). Relevant Writing Capitalism Compromises Design: Often I get asked variations on why I am working at Open Privacy, why it is a non-profit instead of a start up, why our work is Open Source, and more. This was a quick overview of the philosophy behind why I helped start Open Privacy and exactly why we did it the way we have and why I don’t see any other way we could operate. Android Onion Dildonics In conjunction with Sarah Jamie Lewis’ work on Sex Tech Privacy Research I built a prototype Android app that could connect over Tor to an Onion Dildonics server. This was built on top of my previous work “Ricochet Mobile”. Android Onion Dildonics Code Ricochet Mobile I’ve been interested in getting metadata resistant messaging onto mobile for a while now. Once I had been introduced to Ricochet I was immediately interested in pursuing ways to get it onto Android. I started a few experimental research projects to see what it might look like to get a Tor using app onto Android, and one written in Go no less. While this code was experimental and did not proceed too far, it influenced, informed, and sped up work on getting Cwtch onto mobile. Ricochet Mobile: An attempt at getting a ricochet client to work with Tor on android. This attempt worked in conjunction with Orbot go Ricochet Mobile: Pursuing an approach using gomobile to make a libRicochetGo bindings available on mobile, this was a wrapper/bridge library to a Java android app"
