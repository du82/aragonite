["https://openprivacy.ca"]
title = "Open Privacy Research Society"
description = "The Open Privacy Research Society is a non-profit Canadian group based in Vancouver, British Columbia. We believe that moral systems enable consent. Our society exists to invent, create, build, test, publish, deploy, promote, and to encourage the development of such systems"
full_description = "Technology should prioritize consent and anti-surveillance. No one party should be able to exert power over the whole system. Most current systems are centralized, and control over all actions is in the hands of a single organization. We are building a new generation of decentralized and consensual systems, where you control your interactions with others, with no third party mediating or interfering. It is vital to understand the risks faced by underrepresented, persecuted, or victimized communities. Only through that understanding can we build systems that empower, rather than oppress. Many systems are designed and deployed by those with privilege and, intentionally or not, mostly for people like themselves. We are conducting research and outreach to understand the needs of marginalized communities, to adapt and create tools that are better suited to their needs and to keep them safe and empowered. The only way to build a robust system is to open it up to the world. Processes and protocols should be well documented and free for anyone to inspect and comment on. We produce open and freely accessible research. We build free and open source software. We are an open organization with open governance. We are open to nominations for new people to join the Open Privacy Research Society’s Board of Directors! In particular, we are looking for individuals who have experience in fundraising and organizational capacity building. But if you think you have a skill you can bring to the Open Privacy board then we really want to hear from you. The Open Privacy Research Society is a non-profit society based in Vancouver, Canada. We research, build and deploy technology that serves marginalized communities. We acknowledge that the land on which we work is the unceded territory of the xwməθkwəy̓əm (Musqueam), Skwxwú7mesh (Squamish), Stó:lō and Səl̓ílwətaʔ/Selilwitulh (Tsleil- Waututh) People."
