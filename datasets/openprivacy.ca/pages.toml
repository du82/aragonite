["https://openprivacy.ca/research/HowNotToProveYouElectionOutcome-Addendum"]
title = "Addendum to How not to prove your election outcome | Open Privacy Research Society"
description = "The Open Privacy Research Society is a non-profit Canadian group based in Vancouver, British Columbia. We believe that moral systems enable consent. Our society exists to invent, create, build, test, publish, deploy, promote, and to encourage the development of such systems"
full_description = "Addendum to How not to prove your election outcome Published: 29 March 2019 The use of non-adaptive zero knowledge proofs in theScytl-SwissPost Internet voting system, and its implications for decryption proof soundness Authors Sarah Jamie Lewis - Open Privacy Research Society Olivier Pereira - UCLouvain – ICTeam, B-1348 Louvain-la-Neuve, Belgium Vanessa Teague - The University of Melbourne, Parkville, Australia Abstract This note extends our earlier analysis of the use of the weak Fiat-Shamir transform in the Scytl-SwissPost Internet voting system. Here we show that a cheating client can perform essentially the same attack we described in “How not to prove your election outcome.” In the client case, this involves submitting a nonsense vote while successfully faking a proof that its partial return codes match the vote. The effect would be that the voter would receive exactly the right return codes as if their vote had been properly cast, but at decryption time the vote would be nonsense that would not be counted. Note Since the above abstract was written SwissPost & Scytl have confirmed our analysis, and the entire evoting program was suspended after it was determined that this flaw impacted Individual Verifiability in systems currently in use in Switzerland. Full Text: https://sarahjamielewis.com/evoting/HowNotToProveElectionOutcomeAddendum.pdf"
