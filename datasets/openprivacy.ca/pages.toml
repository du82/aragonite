["https://openprivacy.ca/proposals/adopt-shatter-secrets"]
title = "Adopt Project - Shatter Secrets | Open Privacy Research Society"
description = "The Open Privacy Research Society is a non-profit Canadian group based in Vancouver, British Columbia. We believe that moral systems enable consent. Our society exists to invent, create, build, test, publish, deploy, promote, and to encourage the development of such systems"
full_description = "Shatter Secrets uses strong cryptography to distribute “shares” of a decryption key to people on the other side of an international border so as to technically prevent their compelled disclosure. Existing approaches are subject to subtle weaknesses in their protocol, such as allowing border agents to intercept secrets during transmission, or employ social engineering against remote confidantes. Our approach uses threshold cryptography so that some minimum number of designated secret keepers must meet physically in person at the destination before the protected information can be recovered, with special care taken in its design to prevent common compulsion techniques and social engineering vectors. This work will be done in partnership with journalists and activists in Iran, Venezuela, and Zimbabwe, with a focus on user research to explore their needs, workflows, and use cases, as well as subsequent evaluation of our tool. The Open Privacy Research Society is a non-profit society based in Vancouver, Canada. We research, build and deploy technology that serves marginalized communities. We acknowledge that the land on which we work is the unceded territory of the xwməθkwəy̓əm (Musqueam), Skwxwú7mesh (Squamish), Stó:lō and Səl̓ílwətaʔ/Selilwitulh (Tsleil- Waututh) People."
