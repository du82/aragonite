["https://openprivacy.ca/research/UniversalVerifiabilitySwissPost"]
title = "Ceci n’est pas une preuve | Open Privacy Research Society"
description = "The Open Privacy Research Society is a non-profit Canadian group based in Vancouver, British Columbia. We believe that moral systems enable consent. Our society exists to invent, create, build, test, publish, deploy, promote, and to encourage the development of such systems"
full_description = "Ceci n’est pas une preuve Published: 12 March 2019 The use of trapdoor commitments in Bayer-Groth proofsand the implications for the verifiabilty of the Scytl-SwissPost Internet voting system Authors Sarah Jamie Lewis - Open Privacy Research Society Olivier Pereira - UCLouvain – ICTeam, B-1348 Louvain-la-Neuve, Belgium Vanessa Teague - The University of Melbourne, Parkville, Australia Abstract The implementation of the commitment scheme in the SwissPost-Scytl mixnet uses a trapdoor commitment scheme, which allows an authority whoknows the trapdoor values to generate a shuffle proof transcript that passesverification but actually alters votes. We give two examples of details of howthis could be used. The first example allows the first mix to use the trapdoors to substitute votes for which it knows the randomness used to generate theencrypted vote. The second example does not even require knowledge of therandom factors used to generate the votes, and could be used by the last mixin the sequence. Note Since the above abstract was written SwissPost & Scytl have confirmed our analysis, and the entire evoting program was suspended after we reported a 3rd critical flaw which impacted Individual Verifiability. Full Text: https://sarahjamielewis.com/evoting/UniversalVerifiabilitySwissPost.pdf"
