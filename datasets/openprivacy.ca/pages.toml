full_description = "As per the Societies Act, a society's minutes are comprisied of passed resolutions and attending directors. 2022 Jul 13 Vote: Changes to Executive Director Position Passed Proposition: To increase the salary of the Executive Director to $34.60/hour and to reduce the hours of this position from 40 to 10. Conflict of Interest: Sarah Jamie Lewis, Erinn Atwater Ayes: Dan Ballard, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo, Norman Shamas, Kit 2021 Jul 29 AGM: Release 2020 End of Year Report and Financial Report Passed Proposition: Publicly Release 2020 End of Year Report and Financial Report Ayes: Dan Ballard, Erinn Atwater, Cecylia Bocovich, Cynthia Khoo, Norman Shamas, Sarah Jamie Lewis, Yuan Stevens, Kit 2020 Jul 31 AGM: Release 2019 End of Year Report and Financial Report Passed Proposition: Publicly Release 2019 End of Year Report and Financial Report Ayes: Dan Ballard, Erinn Atwater, Cecylia Bocovich, Cynthia Khoo, Norman Shamas, Sarah Jamie Lewis, Yuan Stevens, Kit May 15 Vote: Proposal to extend the staff designer's contract indefinitely Passed Proposition: Extend the 6 month design contract for the staff designer , Marcia, indefinitely and increase the position’s salary by 10% Ayes: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo, Norman Shamas, Kit May 15 Vote: 10% salary increase for executive committee Passed Proposition: Increase salary of the executive committee (Sarah Jamie Lewis , Erinn Atwater, Dan Ballard) by 10% Conflict of Interest: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard Ayes: Cecylia Bocovich, Yuan Stevens, Cynthia Khoo, Norman Shamas, Kit Jan 22 Vote: Proposal for adding Kit to the Board Passed Proposition: Adding Kit to the Open Privacy Board Ayes: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo, Norman Shamas 2019 Nov 01 Vote: To increasee the Director of Engineering's salary Passed Proposition: Open Privacy will increase the hourly wage of the Director of Engineering to $20.78 an hour Ayes: Erinn Atwater, Cecylia Bocovich, Sarah Jamie Lewis, Yuan Stevens, Norman Shamas Conflict of Interest: Dan Ballard (Director of Engineering) Absent: Cynthia Khoo Nov 01 Vote: To increase the Research Director's salary Passed Proposition: Open Privacy will increase the hourly wage of the Research Director to $16.62 an hour Ayes: Dan Ballard, Cecylia Bocovich, Yuan Stevens, Norman Shamas Conflict of Interest: Sarah Jamie Lewis (Indirect), Erinn Atwater (Research Director) Absent: Cynthia Khoo Nov 01 Vote: To allocate budget for and begin search for office space Passed Proposition: Open Privacy will allocate $33,000 for the purpose of seeking office space for the period of 2 years. This budget may also be used for furnishing the office. Ayes: Dan Ballard, Erinn Atwater, Cecylia Bocovich, Sarah Jamie Lewis, Yuan Stevens, Norman Shamas Absent: Cynthia Khoo Nov 01 Vote: To allocate $8000 for a hardware procurement budget Passed Proposition: Open Privacy will allocate $8000 for purchasing server and development hardware for Open Privacy staff and organizational needs. Ayes: Dan Ballard, Erinn Atwater, Cecylia Bocovich, Sarah Jamie Lewis, Yuan Stevens, Norman Shamas Absent: Cynthia Khoo Nov 01 Vote: To hire a staff designer Passed Proposition: Open Privacy will hire a staff designer for 10 hours a week paid at $20.78 an hour. The initial contract will be for 6 months. Ayes: Dan Ballard, Erinn Atwater, Cecylia Bocovich, Sarah Jamie Lewis, Yuan Stevens, Norman Shamas Absent: Cynthia Khoo Sep 23 Vote: To approve and release Open Privacy's 2018 End of Year Report Passed Proposition: The Open Privacy executive committee produced a 2018 End of Year Report. This vote is to approve the report and release it publicly. Ayes: Dan Ballard, Erinn Atwater, Cecylia Bocovich, Cynthia Khoo, Sarah Jamie Lewis, Yuan Stevens, Norman Shamas Resultant Publications: 2018 End of Year Report Blog / Releasing Our 2018 Financial Statements & End of Year Report Sep 23 Vote: To release Open Privacy's 2018 Notice to Reader to the public Passed Proposition: Open Privacy commissioned a Notice to Reader for 2018 in lieu of a full Audit. The vote is to approve releasing the report publicly. Ayes: Dan Ballard, Erinn Atwater, Cecylia Bocovich, Cynthia Khoo, Sarah Jamie Lewis, Yuan Stevens, Norman Shamas Resultant Publications: Notice to Reader 2018 Blog / Releasing Our 2018 Financial Statements & End of Year Report Jul 29 Vote: To increase staff pay to meet new BC minimum wage and backpay to date of increase Passed Proposition: BC has increased its minimum wage from $12.65 to $13.85 as of June 1st, 2019. We vote to increase staff pay to that level to be inline with the law and backpay employees to the start of June to that level (approx $288 each). Ayes: Dan Ballard, Erinn Atwater, Cecylia Bocovich, Cynthia Khoo, Sarah Jamie Lewis, Yuan Stevens Absent: Norman Shamas Mar 19 Vote: Commission a Notice to Reader engagement for 2018's Financial report Passed Proposition: Give the Executive Committee authority to commission a Notice to the Reader engagement in line with the estimate of $2000 as provided by Smythe CPA. The engagement is to ensure our accounting processes are in line with best practices, and while it would not constitute a formal audit of our financial accounts, it would allow us to publicly present financial statements and submit our annual report. Ayes: Dan Ballard, Erinn Atwater, Cecylia Bocovich, Cynthia Khoo, Norman Shamas, Sarah Jamie Lewis Abstain: Yuan Stevens 2018 Sep 10 Vote: Adopt Shatter Secrets project Passed Proposition: Adopt project proposal - Shatter Secrets Ayes: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo, Norman Shamas Sep 10 Vote: Proposal for funding for OpSec project Passed Proposition: Funding Proposal - Op Sec Ayes: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo, Norman Shamas Sep 10 Vote: Job Proposal - Research and Funding Director Passed Proposition: Job Proposal - Research and Funding Director Ayes: Dan Ballard, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo, Norman Shamas Absent: Sarah Jamie Lewis, Erinn Atwater Notes: In discussion title was adjusted from “Research Director” to “Research and Funding Director” Jul 12 Vote: Job Proposal - Director of Engineering Passed Proposition: Job Proposal - Director of Engineering Ayes: Sarah Jamie Lewis, Erinn Atwater, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo, Norman Shamas Absent: Dan Ballard Jul 12 Vote: Job Proposal - Executive Director Passed Proposition: Job Proposal - Executive Director Ayes: Dan Ballard, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo, Norman Shamas Absent: Sarah Jamie Lewis, Erinn Atwater Jun 06 Vote: Proposal for adding Norman Shamas to the Board Passed Proposition: Adding Norman Shamas to the Open Privacy Board Ayes: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo May 08 Vote: Proposal for funding Cwtch development Passed Proposition: Funding Proposal - Cwtch Ayes: Cecylia Bocovich, Yuan Stevens, Cynthia Khoo Absent: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard May 08 Vote: Proposal for funding executive committee Passed Proposition: Funding Proposal - Executive Committee Ayes: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard, Cecylia Bocovich, Yuan Stevens, Cynthia Khoo Apr 07 Vote: Add Cynthia Khoo to the Board Passed Proposition: Add Cynthia Khoo to the Open Privacy Board Ayes: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard, Cecylia Bocovich, Yuan Stevens Apr 04 Vote: Endorse the Manila Principles Passed Proposition: To endorse the Manila Principles Ayes: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard, Yuan Stevens Abstains: Cecylia Bocovich Apr 04 Vote: Add Yuan Stevens to the Board Passed Proposition: Add Yuan Stevens to the Open Privacy Board Ayes: Sarah Jamie Lewis, Erinn Atwater, Dan Ballard, Cecylia Bocovich Mar 29 Vote: Submit brief to CRTC Fairplay consultation Passed Proposition: Submit a brief to CRTC’s Fairplay consultation Dan Ballard: Aye Sarah Jamie Lewis: Aye Erinn Atwater: Aye Cecylia Bocovich: Aye Mar 16 Vote: Add Cecylia Bocovich to the board Passed Proposition: Add Cecylia Bocovich to the Board of Open Privacy Dan Ballard: Aye Sarah Jamie Lewis: Aye Erinn Atwater: Aye Feb 18 Vote: Final logo choice Passed Proposition: Use the eye zipper logo that has been our consistent favourite in informal polling during the logo design contest Dan Ballard: Aye Sarah Jamie Lewis: Aye Erinn Atwater: Aye Feb 13 Vote: What bank to use for banking Passed Proposition: Use Royal Bank as the bank of Open Privacy Dan Ballard: Aye Sarah Jamie Lewis: Aye Erinn Atwater: Absent Feb 11 Vote: Make Minutes Public Passed Proposition: Make meeting minutes public Erinn Atwater: Aye Dan Ballard: Aye Sarah Jamie Lewis: Aye Feb 11 Vote: Hire out logo production Passed Proposition: Use 99Designs to produce a logo Erinn Atwater: Aye Dan Ballard: Aye Sarah Jamie Lewis: Aye Addendum: No locks or keys. Color prefernce is pinks and purples Feb 11 Vote: Director Positions Passed Proposition: Director positions to be assigned as follows: Sarah Jamie Lewis as President, Erinn Atwater as Vice President, Dan Ballard as secretary and treasurer Erinn Atwater: Aye Dan Ballard: Aye Sarah Jamie Lewis: Aye Jan 01 Vote: Name Proposition Passed Proposition: The society should be henceforth known as the “Open Privacy Research Society” Erinn Atwater: Aye Dan Ballard: Aye Sarah Jamie Lewis: Aye"
