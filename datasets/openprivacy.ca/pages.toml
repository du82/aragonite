full_description = "This website, https://openprivacy.ca (the “Site”) is operated by the Open Privacy Research Society (“We” or “Us”). Open Privacy (for short) is a non-profit organization, legally incorporated. Open Privacy is strongly committed to protecting your privacy online. As an organization, we’re also strongly committed to data security to ensure our own channels of communication are safe and secure. By default, as much as we can, we do not collect personal information. Where we do, we try to do it as minimally as possible. We will never re-purpose that data or sell it. We will never share your information without your consent and we will always tell you why first, when or before we ask. We may be forced to comply with the exceptions to this under certain circumstances listed in BC PIPA. We do not track or log IPs of visitors to our website, or other ancillary sites and utilities we host. We do not use any third party analytics and tracking. Cookies are only required on parts of the website that require logging in. In the case of donations, they are mediated through third parties, each with their own privacy policy: When given, we will store the name given on donations in our private accounting records for as long as we need to keep those, typically 7 years. Open Privacy may provide links to third party web sites, and other web sites may provide links to the Site. Third party web sites operate according to their own terms of use and privacy policies. Open Privacy has no control over such third party web sites, and by using this Site, you acknowledge and agree that Open Privacy is not responsible for the availability of such third party sites, and does not endorse and is not responsible or liable for any content, advertising, products or other materials on or available from such sites. You further acknowledge and agree that Open Privacy will not be responsible or liable, directly or indirectly, for any damage or loss caused or alleged to be caused by or in 