full_description = "Cwtch Alpha 0.1.5 26 Jul 2019 Today we are pleased to release Cwtch Alpha 0.1.5. Changes in this new release include: A progress spinner in the UI for groups indicating when they are connected but syncing with the server Chat text bar is locked until a peer to peer connection is established, or a group is synced Minor improvements in “performance” in that we removed a few threads that poll for events and replaced them with events and event handlers We encourage those interested to join our Cwtch Alpha discussion group using the following invite.  For those who are more adventurous, please check out our continuous Windows, Android and Linux builds. These get updated after every approved pull request, and are likely to be much less stable than versioned builds. https://build.openprivacy.ca/files/. The Open Privacy Staff"
