full_description = "Discreet Log: March 2023! 04 Apr 2023 Welcome to Discreet Log! A regular update providing a look into the research, projects and tools that we work on at Open Privacy. Welcome to Discreet Log for March 2023! Discreet Log is our monthly digest providing a summary of the research, projects and tools that we work on at Open Privacy. In this edition we want to tell you about all the exciting new Cwtch Development Logs that have been released this month - including the Cwtch Beta 1.11 release, and updates on the Cwtch Stable roadmap, new volunteer documentation, and more! Help us reach our 2023 Fundraising Goal! Our 2023 fundraising goal reflects the reductions we made to staff and operations last year. This year we are only looking to raise $60,000 to support active research and development in projects like Cwtch, as well as maintain our existing projects and infrastructure. We could not do our work without you. One of the most effective ways you can support us is by setting up a recurring donation on Patreon or Paypal. Thanks to recurring support we are already expecting to reach 58% of the target! We would like to extend a huge thank you to everyone who has helped support Open Privacy over the years. For more information about donating to Open Privacy and claiming a thank you gift please visit our Donate page. Cwtch Beta 1.11 and Cwtch Stable Roadmap Update The Cwtch Dev Team ended March with two big releases. The first was Cwtch Beta 1.11. Cwtch 1.11 is the culmination of the last few months of effort by the Cwtch team, and includes many foundational changes that pave the way for Cwtch Stable including new reproducible and automatically generated bindings, as well as support for two new languages (Slovak and Korean), in addition to several performance improvements and bug fixes. On March 31st the team also released the latest Cwtch Stable Roadmap Update looking back on the goals set out in January, and plotting a course towards a full Cwtch Stable