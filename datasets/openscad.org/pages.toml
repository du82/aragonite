title = "OpenSCAD - Downloads"
full_description = '''macOS System requirements: OS X 10.9 or newer OpenSCAD 64 bit Intel - dmg package - ?? MB sha256 - sha512 OpenSCAD is also available on MacPorts (check version): $ sudo port install openscad OpenSCAD is also available on Homebrew (check version): $ brew install openscad Windows System requirements: Windows 7 or newer on x86 32/64 bit OpenSCAD x86 (32-bit) - exe installer - ?? MB asc - sha256 - sha512 OpenSCAD x86 (32-bit) - zip package - ?? MB asc - sha256 - sha512 OpenSCAD x86 (64-bit) - exe installer - ?? MB asc - sha256 - sha512 OpenSCAD x86 (64-bit) - zip package - ?? MB asc - sha256 - sha512 Linux Debian / Ubuntu / Kubuntu OpenSCAD is available in the repositories of most recent distributions. $ sudo apt-get install openscad Fedora OpenSCAD is available in Fedora official repositories. To install, run the following command: # yum install openscad If you want the MCAD library: # yum install openscad-MCAD openSUSE OpenSCAD is available from software.opensuse.org Arch Linux # pacman -S openscad Other Linux OpenSCAD x86 (64-bit) - AppImage - ?? MB asc - sha256 - sha512 OpenSCAD ARM (64-bit) - AppImage - ?? MB asc - sha256 - sha512 App Stores BSD NetBSD (>=6.1) Set up pkgin and run this command: # pkgin install openscad FreeBSD (>=10) # pkg install openscad OpenBSD OpenSCAD is available for amd64, i386 and macppc in OpenBSD packages: # pkg_add openscad Other Systems It's possible to build OpenSCAD on other systems as long as a C++ compiler and the prerequisite software libraries are available. Source Code OpenSCAD source code - tgz archive - ?? MB asc - sha256 - sha512 You can also access the latest source code on github: openscad/openscad on github Docker Docker images are provided at Docker Hub in the openscad/openscad repository. Release 2021.01, based on Debian Buster Release 2019.05, based on Debian Buster Release 2015.03, based on Debian Stretch Development snapshot, based on Debian Bookworm Images are currently available for platforms linux/amd64 and linux/arm64. For more details see the overview page on Docker Hub. Development Snapshots macOS System requirements: macOS 11 "Big Sur" or newer, universal build supporting Intel and Apple Silicon systems. OpenSCAD 64 bit Universal - dmg package - ?? MB sha256 - sha512 Windows System requirements: Windows 10 (64-bit), or newer, Intel/AMD system (ARM based systems are not supported). OpenSCAD x86 (64-bit) - exe installer - ?? MB sha256 - sha512 OpenSCAD x86 (64-bit) - zip package - ?? MB sha256 - sha512 Linux - AppImage Please try the automatically built snapshots first if you are running a supported distribution (see below), the following AppImage builds are still experimental. The ARM 64-bit (aarch64) AppImage is built and tested only for Raspberry PI OS 64-bit (which may still be in beta test). OpenSCAD x86 (64-bit) - AppImage - ?? MB sha256 - sha512 OpenSCAD ARM (64-bit) - AppImage - ?? MB sha256 - sha512 Linux - Snap Or install with # snap install openscad-nightly To use Gamepads or supported 3D Mouse devices (like the SpaceMouse series from 3D Connexion) the following command is needed to allow the snap package access to the joystick interface. # snap connect openscad:joystick snapd:joystick Linux - Flatpak Note that this is not automatically updated as with most other nightly builds, but instead is manually selected builds. Setup beta repository # flatpak remote-add --user --if-not-exists flathub-beta \ https://flathub.org/beta-repo/flathub-beta.flatpakrepo Install OpenSCAD beta version # flatpak install --user flathub-beta org.openscad.OpenSCAD WebAssembly Many thanks to Dominick (DSchroer) for making this possible. Build instructions and examples can be found in the openscad-wasm repository on github The ZIP package contains an experimental build based on this work for WebAssembly allowing OpenSCAD to run inside a web browser. Right now it's a bit slow and there's no support for preview, fonts or a built-in GUI. Some of those things will hopefully be supported or improved soon, however GUI support is unlikely to be added. Try it out at https://ochafik.com/openscad or start with a slightly bigger example. OpenSCAD WebAssembly - zip package - ?? MB asc - sha256 - sha512 Linux - Distribution Packages The packages are automatically built based on the master branch on github. Note: The packages are called "openscad-nightly" so it's possible to install the development snapshot packages in parallel to the release version from the official repositories. Debian / Ubuntu packages built on OpenSUSE build service The release key must be added to the apt key-ring so apt-get, apt and other tools can validate the packages. Key ID: 75F3214F30EB8E08 (valid till 2025-07-09) Key UID: home:t-paul OBS Project <home:t-paul@build.opensuse.org> Fingerprint: 5F4A 8A2C 8BB1 1716 F294 82BB 75F3 214F 30EB 8E08 NOTE: If you get errors about an expired key valid till 2023-06-14, please re-import the key. # wget -qO- https://files.openscad.org/OBS-Repository-Key.pub | sudo tee /etc/apt/trusted.gpg.d/obs-openscad-nightly.asc After the key is added, the repository URL needs to be configured. This can be done by creating a new file /etc/apt/sources.list.d/openscad.list with the URL specific to the distribution. The repository links below are shown as https, please check for your installation if https is supported. In Debian/Ubuntu this is usually handled by the apt-transport-https package. OBS also supports HTTP links, but it's recommended to use https whenever possible. Debian 11 (Bullseye) deb https://download.opensuse.org/repositories/home:/t-paul/Debian_11/ ./ Debian 12 (Bookworm) deb https://download.opensuse.org/repositories/home:/t-paul/Debian_12/ ./ Debian Testing deb https://download.opensuse.org/repositories/home:/t-paul/Debian_Testing/ ./ Debian Unstable deb https://download.opensuse.org/repositories/home:/t-paul/Debian_Unstable/ ./ Raspbian 11 (64-bit only) deb https://download.opensuse.org/repositories/home:/t-paul/Raspbian_11/ ./ Raspbian 12 (64-bit only) deb https://download.opensuse.org/repositories/home:/t-paul/Raspbian_12/ ./ Ubuntu 22.04 (x86_64, aarch64) deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_22.04/ ./ Ubuntu 23.04 (x86_64, aarch64) deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_23.04/ ./ Ubuntu 23.10 (x86_64, aarch64) deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_23.10/ ./ Ubuntu 24.04 (x86_64, aarch64) deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ ./ openSUSE packages built on OpenSUSE build service openSUSE Leap 15.3 (64-bit only) https://download.opensuse.org/repositories/home:/t-paul/openSUSE_Leap_15.3/ openSUSE Leap 15.4 (64-bit only) https://download.opensuse.org/repositories/home:/t-paul/openSUSE_Leap_15.4/ openSUSE Tumbleweed https://download.opensuse.org/repositories/home:/t-paul/openSUSE_Tumbleweed/ Fedora packages built on OpenSUSE build service Fedora 34 (x86_64, armv7l, aarch64, ppc64le) https://download.opensuse.org/repositories/home:/t-paul/Fedora_34/ Fedora 35 (x86_64, armv7l, aarch64, ppc64le) https://download.opensuse.org/repositories/home:/t-paul/Fedora_35/ Fedora 36 (x86_64, armv7l, aarch64, ppc64le) https://download.opensuse.org/repositories/home:/t-paul/Fedora_36/ Fedora 37 (x86_64, armv7l, aarch64, ppc64le) https://download.opensuse.org/repositories/home:/t-paul/Fedora_37/ Fedora Rawhide (x86_64, i586) https://download.opensuse.org/repositories/home:/t-paul/Fedora_Rawhide/ Arch Linux To install OpenSCAD from git on Arch Linux the openscad-git pkgbuild is available on AUR. Prior Releases Prior releases are available at files.openscad.org Signature Releases are signed with GnuPG The OpenSCAD Developers <dev@openscad.org> Key ID: 0x8AF822A975097442 Fingerprint: B3C9 4B42 50DC 097E 9FFF 8177 8AF8 22A9 7509 7442 Download: openscad-signing-key_0x8AF822A975097442.asc'''
