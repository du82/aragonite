title = "OpenSCAD - Community"
full_description = "Discussion Talk with users and developers, show things you made, ask questions Mailing list Join the community on the Mailing list Bug reports Report bugs and request features on github Get Involved Users subscribe to the mailing list or forums or join our IRC channel and contribute to the user community by answering requests and take part in discussions Report bugs, improve or validate bug reports on the github issue tracker Improve the documentation (it's a wiki) Web developers Improve the website - it's a github repository Programmers Fix bugs - good ones to get started are tagged Good First Issue Write (better) tests Implement new features Refactor or clean up code Donations We accept sponsorships as well as individual donations For sponsorship opportunities, please contact info@openscad.org For donations, we have an Open Collective account Please do not use BountySource for now, their status is unknown and it's unclear if they still process bounties as expected! Forum / Mailing List Mailing list info Mailing list archive Posting via the web interface of the mailing list may require creating a new login via https://lists.openscad.org/register using the same email address that was used for the mailing list subscription before. Discussion / Talk to Humans / IRC Channel Join via the libera.chat web gui (KiwiIRC) Connect with an IRC client to #openscad on irc.libera.chat +6697 (TLS) Additional documentation on how to connect can be found at https://libera.chat/guides The Matrix room got disconnected due to issues with the bridge Deportalling from Libera.Chat. Unfortunately there is no solution yet for reconnecting the existing room, a ticket with Matrix support is so far unanswered. If you can help fixing this issue, please reach out. Social Media Mastodon: @OpenSCAD@fosstodon.org Bluesky: @openscad.bsky.social Other OpenSCAD Thingiverse group OpenSCAD subreddit Facebook: OpenSCADAcademy"
