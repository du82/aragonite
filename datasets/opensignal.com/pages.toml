["https://opensignal.com/2025/02/19/a-otima-experiencia-movel-e-motivo-de-comemoracao-no-carnaval-do-rio-de-janeiro/dt"]
title = "A ótima experiência móvel é motivo de comemoração no Carnaval do Rio de Janeiro | Opensignal"
description = "O Carnaval é um dos maiores e mais icônicos festivais do mundo, comemorado de várias formas em dezenas de países. O Rio de Janeiro é reconhecido por sediar a maior dessas celebrações, atraindo milhões de foliões e dezenas de milhares de turistas anualmente. Com essa mistura vibrante de artistas e participantes dançando a noite toda, será que as redes móveis do Rio conseguem acompanhar o ritmo?"
full_description = "February 19, 2025 by Rupert Bapty Get our latest reports straight to your inbox. Subscribe Share this article O Carnaval é um dos maiores e mais icônicos festivais do mundo, comemorado de várias formas em dezenas de países. O Rio de Janeiro é reconhecido por sediar a maior dessas celebrações, atraindo milhões de foliões e dezenas de milhares de turistas anualmente. Com essa mistura vibrante de artistas e participantes dançando a noite toda, será que as redes móveis do Rio conseguem acompanhar o ritmo?Neste relatório, analisamos como a experiência do usuário nas três operadoras nacionais de rede móvel (MNOs) do Brasil - Claro, TIM e Vivo - muda durante o Carnaval. Usando dados da semana do festival de 2024, avaliamos qual operadora apresentou o melhor desempenho no Rio de Janeiro. Além disso, comparamos esses resultados com um período de quatro semanas antes do evento para avaliar o impacto do congestionamento da rede causado pelo afluxo de frequentadores do festival.Principais conclusões:Durante o Carnaval do ano passado, a TIM teve a melhor experiência geral no Rio de Janeiro. A TIM foi a líder absoluta em quatro das seis métricas analisadas — Experiência de Confiabilidade, Qualidade Consistente, Experiência de Vídeo e Experiência de Vídeo ao Vivo. Além disso, a TIM compartilhou a Experiência de Cobertura com a Claro. A Claro teve as velocidades médias de download mais rápidas durante o Carnaval. A Claro entregou as velocidades médias de download mais rápidas, tanto em geral quanto em redes 5G — com as velocidades médias de download 5G da Claro se aproximando de 400Mbps. Em todo o Rio, nossos usuários TIM 5G se conectaram ao 5G na maioria dos lugares. A TIM teve a melhor experiência de cobertura 5G durante o festival, marcando 8,23 pontos em uma escala de 10 pontos. Além disso, nossos usuários da TIM tiveram a melhor experiência conjunta de streaming de vídeo em uma conexão 5G, compartilhada com a Claro.Todas as três redes foram resilientes durante o Carnaval, com velocidades médias de download 5G aumentando em todos os setores. Em comparação com as quatro semanas anteriores, a Qualidade Consistente aumentou durante o Carnaval tanto para a Claro quanto para a Vivo — a TIM permaneceu estável — enquanto a Experiência de Confiabilidade caiu ligeiramente. As operadoras brasileiras fizeram investimentos significativos para aprimorar suas redes. As operadoras alocaram R$ 1,5 bilhão para melhorar as redes antes das Olimpíadas do Rio de Janeiro em 2016, com a maioria das atualizações permanecendo como acessórios permanentes. Mais recentemente, a América Móvil, controladora da Claro, anunciou um investimento de US$ 7,7 bilhões na Claro Brasil entre 2024 e 2029 - fundamental para manter a competitividade com a Vivo, que recebeu quase US$ 2 bilhões em 2023, e a TIM, que investe cerca de US$ 1 bilhão anualmente. Esses investimentos são necessários para ajudar não apenas os usuários locais, mas também o crescente setor de turismo. Com um grande número de moradores do Rio dependendo dos gastos durante o Carnaval e da renda do turismo, um bom desempenho móvel é vital para atrair as multidões. Do Sambódromo aos icônicos blocos e bandas, o Rio ganha vida durante o Carnaval, com as redes móveis tão movimentadas quanto as ruas - lidando com o aumento de fotos, vídeos e chamadas compartilhadas. A TIM informou que, no Sambódromo da Marquês de Sapucaí, cerca de 40 terabytes de dados foram compartilhados em sua rede, com mais de 47% em sua rede 5G durante as duas noites de desfiles do ano passado. Apesar do aumento da demanda, as atualizações e os preparativos da rede garantiram um desempenho tranquilo durante as festividades. Embora todas as operadoras tenham apresentado bons resultados, a TIM se destacou, ficando em primeiro lugar em quatro das seis métricas analisadas e compartilhando o primeiro lugar em uma.A liderança absoluta da TIM significa que seus usuários puderam confiar mais em sua rede para tarefas comuns, como chamadas de vídeo e uploads de mídia social, além de desfrutar da mais alta qualidade de vídeo transmitido, seja ao vivo ou sob demanda. A Claro e a TIM compartilharam a vitória em Experiência de Cobertura, com uma cobertura quase completa da cidade. A experiência de cobertura representa a experiência que os usuários recebem quando viajam em áreas onde eles esperam encontrar cobertura. Além disso, a Claro teve as velocidades médias de download mais rápidas no Rio, 2 Mbps à frente de seus pares. Essas pontuações são todas mais altas do que as observadas nacionalmente pouco antes do Carnaval - no entanto, as pontuações estão melhorando rapidamente em todo o país, especialmente a da Qualidade Consistente. Os usuários da Claro, TIM e Vivo viram um aumento notável no desempenho ao comparar a experiência 5G dos usuários com sua experiência móvel geral, no entanto, uma ótima experiência 5G só é possível se os usuários puderem encontrar uma conexão 5G de forma confiável. No Rio, a TIM foi a primeira em Experiência de Cobertura 5G, marcando 8,23 pontos em uma escala de 10 pontos e demonstrando ampla cobertura. A Claro não ficou muito atrás da TIM, ficando atrás por apenas 0,2 pontos. Essa métrica reflete a proporção de locais onde os usuários da Opensignal com um dispositivo compatível com 5G e uma assinatura conseguiram se conectar ao 5G.Durante o Carnaval, nossos usuários da TIM e da Claro observaram a melhor experiência de streaming de vídeo 5G, tanto sob demanda quanto para eventos ao vivo. As pontuações da experiência de vídeo 5G das duas foram cerca de 15 a 20 pontos mais altas do que suas pontuações gerais, colocando-as na extremidade superior da categoria Muito bom (68-78). Da mesma forma, para a experiência de vídeo ao vivo 5G, as pontuações da TIM e da Claro as elevaram para a categoria Excelente (58 ou acima), com os usuários, em média, capazes de transmitir vídeo a pelo menos 1080p com baixos tempos de carregamento, pouca paralisação e uma compensação ao vivo satisfatória quando conectados ao 5G. Com a grande quantidade de vídeos compartilhados sobre os desfiles e o Sambódromo, uma imagem nítida é vital para capturar a vibração.As velocidades de download do 5G destacam claramente o impacto das implementações do 5G na banda de 3,5 GHz, com as velocidades médias de download do 5G para as três MNOs excedendo suas pontuações gerais em mais de 300 Mbps - superior a dez vezes mais. Embora todas as três operadoras tenham alcançado velocidades impressionantes, a Claro se destaca, aproximando-se de 400 Mbps e estabelecendo um alto padrão de desempenho. Como a Claro também ficou em primeiro lugar na Experiência de Velocidade de Download, isso significa que nossos usuários tiveram as velocidades médias de download mais rápidas durante o Carnaval no Rio na rede da Claro. Assim como no streaming de vídeo, as velocidades de download extremamente rápidas melhoram a experiência do Carnaval, permitindo que os participantes compartilhem momentos, transmitam conteúdo e permaneçam conectados durante as festividades. As redes das três operadoras foram notavelmente resistentes ao fluxo de foliões, com a experiência do usuário durante o Carnaval sendo semelhante ao que foi visto quatro semanas antes. A qualidade consistente aumentou tanto para a Claro quanto para a Vivo, com a pontuação desta última subindo mais de nove pontos percentuais. A pontuação da TIM não sofreu grandes alterações, permanecendo à frente de seus pares, com 74,6%. Da mesma forma, nossos usuários do Rio de Janeiro viram suas velocidades médias de download 5G aumentarem em todas as três operadoras, com a Vivo novamente apresentando o maior aumento - de 16 Mbps. Esse aumento indica como as operadoras podem lidar com uma mudança nos hábitos dos usuários durante o Carnaval. Com os usuários se reunindo em áreas relativamente pequenas, as operadoras podem planejar com antecedência, instalando torres de celular permanentes ou temporárias nesses locais e garantindo que o espectro 5G de maior capacidade seja alocado, como a TIM fez para o evento Rock in Rio de 2024. No entanto, a Experiência de Confiabilidade - medida da Opensignal da capacidade dos usuários de se conectarem e concluírem com êxito tarefas (básicas) nas redes das operadoras - caiu para todas as três MNOs durante o período do Carnaval. Isso provavelmente se deve ao fato de os usuários terem um pouco mais de dificuldade para se conectar a uma rede durante as festividades.Enquanto o Brasil se prepara para o Carnaval de 2025, as três operadoras móveis nacionais do país estão bem equipadas para lidar com as demandas do evento. No Rio, Claro, TIM e Vivo demonstraram um forte desempenho de rede durante o Carnaval do ano passado, com a experiência do usuário resiliente ao aumento da demanda. A Opensignal observou que as redes se mantiveram sob pressão em outros grandes eventos, incluindo as Olimpíadas na França, o Hajj no Reino da Arábia Saudita e a Eras Tour de Taylor Swift na Austrália, Japão e Cingapura.Para saber mais sobre a experiência nacional de nossos usuários brasileiros, leia nosso mais recente relatório de experiência de rede móvel. Para se manter atualizado sobre todos os insights e artigos da Opensignal, inscreva-se em nossa newsletter. ©2025 Opensignal, Limited - All rights reserved. Opensignal Limited retains ownership of this insight including all intellectual property rights, data, content, graphs & analysis. Reports and insights produced by Opensignal Limited may not be quoted, reproduced, distributed, published for any commercial purpose (including use in advertisements or other promotional content) without prior written consent. Journalists are encouraged to quote information included in Opensignal reports and insights provided they include clear source attribution. For more information, contact [email protected]. Previous Next"
