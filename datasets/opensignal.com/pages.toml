["https://opensignal.com/2025/02/27/global-mobile-network-experience-awards-2025/dt"]
title = "Global Mobile Network Experience Awards 2025 | Opensignal"
description = "Definitions"
full_description = "February 27, 2025 by Andrey Popov Get our latest reports straight to your inbox. Subscribe Share this article Sam Fenwick and Andrey Popov IntroductionIn today’s world, connectivity is critical. Operators continue to compete to offer subscribers the best mobile experience and invest to improve their networks’ reliability and performance. At the same, growing 5G adoption is increasing the proportion of users who benefit from the superior experience that 5G provides, boosting the overall experience observed by our users. However, this evolution is not just about adding new technology – it is also about transitioning away from older ones. Operators worldwide are increasingly shutting down their legacy 2G and 3G networks to improve energy efficiency, simplify network management and repurpose valuable spectrum bands to improve the 4G and 5G experience of their users. According to GSMA Intelligence, operators are planning to shut down 61 2G or 3G networks in 2025. The transition varies by market, depending on regulatory decisions, network strategies, and spectrum availability. For a deeper look at spectrum refarming trends, see our recent analysis on spectrum strategies and network sunsetting in APAC, the Middle East, and Europe. In this report, Opensignal’s sixth Global Mobile Network Experience Awards, we analyse the difference in the overall mobile experience seen by our users on different operators across the globe across the first 180 days of H2 2024 (1st July - 27th December 2024) — to better inform users, operators and regulators. We award operators the titles of Global Winners and Global Leaders for outstanding user experience and recognize the operators on which our users have seen the greatest improvement in mobile experience between H2 2023 and H2 2024 as Global Rising Stars. This is the first time we have included Reliability Experience, which measures the ability of Opensignal users to connect to and successfully complete (basic) tasks on operator’s networks. It analyzes how much Opensignal users’ experience is affected by the radio access and core network, along with issues that prevent them from connecting to the internet even if they have a connection to their operator’s network. Reliability matters a great deal to consumers - In Opensignal’s Q4 2024 U.S. Household survey, when asked to pick their key factors when choosing a mobile operator, 58% of respondents selected reliability - the second most popular choice after cost (67%) and far ahead of speed (19%). The other metrics included in this report are a mixture of traditional speed-based measures (Download Speed Experience and Upload Speed Experience), together with three of Opensignal’s experiential metrics — Video Experience, Games Experience and Voice App Experience. The latter three use mean opinion score methodology to infer our users’ experience when streaming on-demand mobile video, playing multiplayer mobile games and using over-the-top voice applications over cellular connections from the technical parameters we measure. This choice of metrics allows us to provide a comprehensive view of the global mobile experience. To recognize the challenges in providing connectivity and to allow for more meaningful comparisons, we continue to split operators into two groups. The large land area group contains operators from markets with a land area of more than 200,000km2 while the small land area group consists of operators whose home market is below this threshold. Key Findings: Japan’s au is in first place for Reliability Experience, Games Experience and Voice App ExperienceOur au users observe the most reliable experience in the large land area group. In addition, they enjoy the best overall experience in the group when playing multiplayer mobile games and using over-the-top voice applications such as LINE or WhatsApp. Au is therefore a Global Winner for Reliability Experience, Games Experience and Voice App Experience.The fastest mobile download speeds globally are with T-Mobile USA and SK Telecom T-Mobile is the sole Global Winner in the large land area group, as our users on its network saw average overall download speeds of 152.5Mbps in H2 2024, well ahead of second-placed Telenor Norway’s 127Mbps. In the small land area category, South Korea’s SK Telecom retains the top spot, winning this time with a score of 155.7Mbps. SK Telecom is also a joint Global Winner for Upload Speed Experience alongside fellow South Korean operator LG U+, given their statistically tied scores of 23.3-23.7Mbps.South Korean operators dominate in the small land area groupSK Telecom has achieved an impressive feat; it is a Global Winner in the small land area group in all six categories. It wins two of these – Download Speed Experience and Reliability Experience – outright. Another South Korean operator, LG U+ shares the top spot with it for Games Experience, Upload Speed Experience and Voice App Experience. SK Telecom is also a Global Winner for the Video Experience award alongside Odido in the Netherlands and 3 Denmark, as their scores are statistically tied.Telenor Norway is a Global Winner for Video Experience and Upload Speed ExperienceOur users on Telenor’s network observe the best experience in the large land area group, when streaming on-demand mobile video and also enjoy the fastest upload speeds. As a result, Telenor Norway is the Global Winner for Video Experience and Upload Speed Experience in the large land area group. It wins the former with a score of 75.3 points on a 0-100 point scale and comes top for Upload Speed Experience with 19.3Mbps.Malaysian and Venezuelan operators shine as Global Rising Stars in the large land area groupVenezuela’s Movilnet is a Global Rising Star in all three categories for which we have calculated year-on-year (YoY) percentage changes in our users’ scores — Download Speed Experience, Upload Speed Experience, and Video Experience. In addition, our Movilnet users saw the largest improvement in the large land area group across all three metrics. Movilnet’s local rivals, Movistar and Digitel are Global Rising Stars in two and one categories apiece. Malaysia’s Maxis and Unifi are Global Rising Stars for Download Speed Experience, while Maxis is the only Malaysian operator to earn this recognition for Upload Speed Experience. Our Maxis and Unifi users saw the second and third highest YoY percentage improvement in their group for Download Speed Experience, with increases of 78.1% and 77.8%, respectively.In the small land area group, Teletalk Bangladesh doubles network speeds and takes three Global Rising Star awards In the small land area group, Teletalk is the only operator to be recognized by Opensignal as a Global Rising Star in all three categories — Download Speed Experience, Upload Speed Experience and Video Experience. Within this group, our Teletalk users observe the largest year-on-year (YoY) percentage improvement in average download and upload speeds — 116.7% and 103.4%, respectively. Teletalk is in second place for the YoY percentage improvement in Video Experience scores, with an improvement of 16.9%, with our Liberty Puerto Rico users seeing the largest increase of 18.8%. Table of Contents: DefinitionsLarge land area group: this contains operators from markets with a land area of more than 200,000km2. Referred to in the previous Global Awards as Group I. Small land area group: this consists of operators from markets with a land area below 200,000km2. Referred to in the previous Global Awards as Group II. Division: a combination of land mass group and metric, e.g. “Large land area group - Download Speed Experience”. Global Winners: the operator(s) that place first for a division. Where there are multiple Global Winners in a division this is because one or more operators have overlapping confidence intervals with the highest scoring operator before ranks are calculated and therefore share the same rank. Global Leaders: those operators in a division that have the same or better rank (determined using confidence intervals) as the operator with the 10th highest score (before calculating ranks), provided the latter is not a Global Winner. This means that in some cases it is possible for there to be no Global Leaders in a division. Global Rising Stars: the five operators for each division that have shown the best relative increase (shown in percentage terms) in their scores between H2 2023 and H2 2024. Award TablesLarge land area groupJapanese operators have performed strongly in the large land area group. Au is a Global Winner in three categories (Reliability Experience, Games Experience and Voice App Experience). It is also a Global Leader for Video Experience. SoftBank is a Global Leader in four categories, while NTT docomo and Rakuten Mobile are Global Leaders in three categories. In addition to being a Global Winner for both Upload Speed Experience and Video Experience, Norway’s Telenor is a Global Leader for Download Speed Experience, Games Experience and Reliability Experience. Its local rivals, Telia and ice are both Global Leaders in four categories.While no Finnish operators have obtained the top spot this time around, DNA is a Global Leader in all six categories, while Telia comes close with five and Elisa scoops up four Global Leader accolades.As well as being the Global Winner for Download Speed Experience in the large land area group, T-Mobile USA is also a Global Leader for Upload Speed Experience. No other U.S. operators earn global recognition this time around, but further north, Canada’s Bell and TELUS are Global Leaders for Download Speed Experience. Small land area groupThe success of South Korea’s operators is clear to see. In addition to SK Telecom being a Global Winner in the small land area group — either jointly or outright — in all six categories, LG U+ shares the top spot with it for Games Experience, Upload Speed Experience and Voice App Experience, while also being a Global Leader in the three remaining categories. While KT is not a Global winner this time around, it is a Global Leader in three categories — Download Speed Experience, Games Experience and Voice App Experience.Over in Singapore, Singtel and StarHub are both Global Leaders in three categories. Both operators earn this recognition for Download Speed Experience and Games Experience, but Singtel is a Global Leader for Voice App Experience, while StarHub is one for Video Experience.Chunghwa is the only Taiwanese operator to earn recognition this time around, being a Global Leader for Download Speed Experience and a Global Rising Star for Upload Speed Experience.In addition to being a Global Winner for Video Experience alongside SK Telecom and 3 Denmark, Netherlands’ Odido is a Global Leader in four categories, while Vodafone Netherlands is one for Video Experience and Reliability Experience.3 Denmark is a Global Winner for Video Experience, while the other three Danish operators (TDC, Telenor and Telia) are Global Leaders in this category. Both Telenor and Telia Denmark are Global Leaders across four categories apiece, while 3 is a Global Leader for Download Speed Experience.Czechia’s three operators (O2, T-Mobile and Vodafone) are all Global Leaders for Voice App Experience. O2 is also one for Games Experience, while T-Mobile Czechia earns the same recognition for Reliability Experience. Index of categoriesThe Global Winners and Leaders - large land area groupDownload Speed ExperienceUpload Speed ExperienceVideo ExperienceGames ExperienceVoice App ExperienceReliability ExperienceThe Global Winners and Leaders - small land area groupDownload Speed ExperienceUpload Speed ExperienceVideo ExperienceGames ExperienceVoice App ExperienceReliability ExperienceThe Global Rising Stars - large land area groupDownload Speed ExperienceUpload Speed ExperienceVideo ExperienceThe Global Rising Stars - small land area groupDownload Speed ExperienceUpload Speed ExperienceVideo ExperienceSummary of resultsSummary Category results Large land area group — Download Speed Experience — Global Winners and LeadersBack to topOur T-Mobile USA users observe the fastest overall download speeds (measured across all generations of mobile technology) in the large land area group — an impressive 152.5Mbps. Only one other operator in this group has a Download Speed Experience score above 100Mbps this time around — Telenor Norway with 127Mbps. India’s Jio narrowly falls short of this mark, placing in third with 97Mbps.Looking further down the chart all three of Finland’s operators — DNA, Elisa and Telia are Global Leaders in this division. Two out of three of Norway and Canada’s operators earn the same recognition — Telia and Telenor in Norway, along with Bell and TELUS in Canada. Large land area group — Upload Speed Experience — Global Winners and LeadersBack to topTelenor Norway is the sole Global Winner in the large land area group for overall Upload Speed Experience — doing so with a score of 19.3Mbps. Global Leaders DNA Finland and Telia Norway share second place with statistically tied scores of 17.9-18.5Mbps. Vodafone Oman and Rakuten Mobile follow in fourth and fifth place, respectively, with 17.3Mbps and 16.4Mbps. As Norway’s ice is also a Global Leader for Upload Speed Experience, all three of the market’s operators are either a Global Winner or Global Leader for Upload Speed Experience. T-Mobile is the only North American operator to be recognized in this report as a Global Leader for Upload Speed Experience, doing so with a score of 14Mbps.While download speeds traditionally have received more focus and attention from operators and consumers than upload speeds, this is changing, given that social media encourages users to upload photos and videos, particularly during concerts and other large scale events. Improving the uplink is a focus of 5G Advanced and users can therefore expect their Upload Speed Experience to improve as this new technology is rolled out. Like all Opensignal’s overall experience metrics, Upload Speed Experience also reflects 5G adoption and the proportion of time users spend on legacy technologies (2G and 3G). Large land area group — Video Experience — Global Winners and LeadersBack to topOur Telenor Norway users have the best overall experience in the large land area group when streaming on-demand mobile video over cellular connections — with a score of 75.3 points on a 100-point scale. Only operators from four markets — Norway, Finland, Japan and Sweden have been recognized as Global Leaders in this division. This list includes ice Norway, Telia Finland and Telia Norway, which share second place with statistically tied scores of 74-74.2 points.The Global Leaders for Video Experience also include all three Finnish operators — DNA, Elisa and Telia, two out of four of Japan’s national operators, au and SoftBank, and Sweden’s Tele2 and Telenor. Telenor Norway and all the Global Leaders in this division place in the Very Good (68-78) category"
