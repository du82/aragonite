["https://opensky-network.org/community/blog/item/10-welcome-to-opensky"]
title = "Welcome to OpenSky"
description = "Welcome to our small corner of the air tracking world, the goal of this post is to bring together some of the information scattered around on our web page, which has organically grown over the past 10 years. Yes, we know it could look a bit more modern but we never came around to modernising it. Ple..."
full_description = "Welcome to our small corner of the air tracking world, the goal of this post is to bring together some of the information scattered around on our web page, which has organically grown over the past 10 years. Yes, we know it could look a bit more modern but we never came around to modernising it. Please also check out our Frequently Asked Questions for some more comprehensive information. The OpenSky Network started in 2012 as a research project between armasuisse (Switzerland), University of Kaiserslautern (Germany), and University of Oxford (UK).The original paper describing the concept was published at IPSN 2014 -- it might feel a bit dated after such a long time! In 2015, the independent OpenSky Network association was founded to guarantee the continuous development of the network towards a completely open air traffic control sensor network with worldwide coverage. We are a registered non-profit association registered in Switzerland (OpenSky Network e.V.). The stated mission of the OpenSky Network Association is to improve the security, reliability and efficiency of the air space usage by providing open access of real-world air traffic control data to the public. The members of the association are scientists, with a long-standing interest in aircraft tracking. As a non-profit association, we are not a commercial company, in particular not a Limited company. We do not have a fancy app (sadly!) or premium subscription models. We have not been focused specifically on the hobby of aircraft tracking (i.e., military etc.) and do not offer the best tools to do this (yet?) but the data is there, all the same. As stated above, we are interested in collecting, storing and distributing as much aircraft data as possible. We started with ADS-B only, added the entirety of Mode S, then FLARM. Recently, we have started an open beta for collecting and transcribing Voice data, supporting the EU Horizon 2020 project ATCO2. The data (we collected and stored Petabytes by now) is offered completely to any research institution for free using our Impala shell which enables fast queries across the whole dataset. Live data is available to anyone (within reason) using our REST API. We also offer a crowdsourced and downloadable aircraft database."
author = "Martin Strohmeier"
year_published = 2025
