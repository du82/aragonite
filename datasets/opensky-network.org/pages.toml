["https://opensky-network.org/community/projects/36-dump1090-opensky-feeder-debian-gnu-linux"]
title = "Dump1090 OpenSky Feeder (Debian GNU/Linux)"
full_description = '''OpenSky Feeder for Dump1090 (Debian GNU/Linux) Note: If your device is a Raspberry Pi and you want to run the feeder on that device you should checkout this article. This article describes how to feed your data into the OpenSky Network if you already have dump1090 running on a machine in your network. You can install the feeder on the same machine or on another machine in the network, running Debian GNU/Linux or Ubuntu. Right now, we offer binary packages for the architectures i386, amd64, armhf and arm64. Obtaining and installing the feeder Basically there are two ways: You can download and install a .deb file. This is easier and faster. Alternatively you can add the OpenSky repository and use apt to install the feeder. This is easier to maintain as the software is updated automatically with every system update. Download and install a .deb file Download the right .deb file depending on your system's architecture: i386: wget https://opensky-network.org/files/firmware/opensky-feeder_latest_i386.deb amd64: wget https://opensky-network.org/files/firmware/opensky-feeder_latest_amd64.deb armhf: wget https://opensky-network.org/files/firmware/opensky-feeder_latest_armhf.deb arm64: wget https://opensky-network.org/files/firmware/opensky-feeder_latest_arm64.deb Then install the feeder: sudo dpkg -i opensky-feeder_latest_%YOUR_ARCH%.deb To update the package, just repeat these steps. You can also refer to the Changelog to see if there are any updates. Add the OpenSky repository to apt The OpenSky repository is using https, thus you need to install that transfer methodsudo apt-get install apt-transport-https You also need the GPG key of the OpenSky Network which verifies the integrity of the archiveswget -O - https://opensky-network.org/files/firmware/opensky.gpg.pub | sudo apt-key add - Add the opensky repositorysudo bash -c "echo deb https://opensky-network.org/repos/debian opensky custom > /etc/apt/sources.list.d/opensky.list" Update aptsudo apt-get update Install the feedersudo apt-get install opensky-feeder Now the feeder is updated everytime you usesudo apt-get updatesudo apt-get upgradeor something similar Configuration and further instructions After installing, you will be prompted some questions about your receiver setup. If dump1090 is not running on the same machine you just installed the feeder, you will need to enter the IP address of the dump1090 device within your network. For reconfiguration and some more information, refer to this article.'''
author = "Markus Engel"
year_published = 2025
clearnet = "https://opensky-network.org/community/projects/36-dump1090-opensky-feeder-debian-gnu-linux"
tags = ["apt-get", "configuration", "dump1090", "feeder", "further", "install", "installing", "instructions", "machine", "note:"]
