title = "Publications"
full_description = 'Citing OpenSky Network If you create a publication (including web pages, papers published by a third party, and publicly available presentations) using any data from the OpenSky Network, cite the original OpenSky paper as follows: Matthias Schäfer, Martin Strohmeier, Vincent Lenders, Ivan Martinovic and Matthias Wilhelm. "Bringing Up OpenSky: A Large-scale ADS-B Sensor Network for Research". In Proceedings of the 13th IEEE/ACM International Symposium on Information Processing in Sensor Networks (IPSN), pages 83-94, April 2014. You can additionally mention our URL, where appropriate: The OpenSky Network, https://opensky-network.org Publications using the OpenSky Network The following list contains over 600 publications created from research using OpenSky Network data. The purpose of this list is to provide insights into past uses of OpenSky Network data. You can read a detailed breakdown and analysis of the type of publications over the years. Please let us now about any new or old publications that we have missed! [Vico25] Joaquin Vico Navarro, Juan Vicente Balbastre Tejedor and Juan Antonio Vila Carbó. A New Association Approach for Multi-Sensor Air Traffic Surveillance Data Based on Deep Neural Networks. Sensors 25(3), February 2025. URL, DOI BibTeX@article{Vico25, author = "Vico Navarro, Joaquin and Balbastre Tejedor, Juan Vicente and Vila Carbó, Juan Antonio", title = "A New Association Approach for Multi-Sensor Air Traffic Surveillance Data Based on Deep Neural Networks", journal = "Sensors", volume = 25, year = 2025, number = 3, month = "Feb", article-number = 931, url = "https://www.mdpi.com/1424-8220/25/3/931", issn = "1424-8220", doi = "10.3390/s25030931" } [Gu25] Haogao Gu, Jifan Li, Wanying Sun, Mengting Li, Kathy Leung, Joseph T Wu, Hsiang-Yu Yuan, Maggie H Wang, Bingyi Yang, Matthew R McKay and others. Optimizing Global Genomic Surveillance for Early Detection of Emerging SARS-CoV-2 Variants. arXiv preprint arXiv:2502.00934, February 2025. URL BibTeX@article{Gu25, title = "Optimizing Global Genomic Surveillance for Early Detection of Emerging SARS-CoV-2 Variants", author = "Gu, Haogao and Li, Jifan and Sun, Wanying and Li, Mengting and Leung, Kathy and Wu, Joseph T and Yuan, Hsiang-Yu and Wang, Maggie H and Yang, Bingyi and McKay, Matthew R and others", journal = "arXiv preprint arXiv:2502.00934", year = 2025, month = "feb", url = "https://arxiv.org/pdf/2502.00934v1" } [Wang25] Fengyi Wang, Guanghui Zhu, Hongqing Ding, Pengfei Zhang, Chunfeng Yuan and Yihua Huang. Boosting Temporal Graph Learning From Perspectives of Global and Local Structures. IEEE Transactions on Neural Networks and Learning Systems, February 2025. URL BibTeX@article{Wang25, title = "Boosting Temporal Graph Learning From Perspectives of Global and Local Structures", author = "Wang, Fengyi and Zhu, Guanghui and Ding, Hongqing and Zhang, Pengfei and Yuan, Chunfeng and Huang, Yihua", journal = "IEEE Transactions on Neural Networks and Learning Systems", year = 2025, publisher = "IEEE", month = "Feb", url = "https://ieeexplore.ieee.org/abstract/document/10869485" } [Li25] Duan Li, Xinyuan Guo, Xinhuan Shu, Lanxi Xiao, Lingyun Yu and Shixia Liu. RouteFlow: Trajectory-Aware Animated Transitions. arXiv preprint arXiv:2502.08076, February 2025. URL BibTeX@article{Li25, title = "RouteFlow: Trajectory-Aware Animated Transitions", author = "Duan Li and Xinyuan Guo and Xinhuan Shu and Lanxi Xiao and Lingyun Yu and Shixia Liu", journal = "arXiv preprint arXiv:2502.08076", year = 2025, month = "feb", url = "https://arxiv.org/pdf/2502.08076" } [] Applying Gaussian Process Machine Learning and Modern Probabilistic Programming to Satellite Data to Infer CO2 Emissions. Environmental Science & Technology, February 2025. URL, DOI BibTeX@article{, jeong25 author = "Jeong, Seongeun and Hamilton, Sofia D. and Johnson, Matthew S. and Wu, Dien and Turner, Alexander J. and Fischer, Marc L.", title = "Applying Gaussian Process Machine Learning and Mod