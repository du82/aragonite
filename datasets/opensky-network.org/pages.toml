["https://opensky-network.org/community/blog/item/1-do-military-aircraft-use-ads-b-automatic-dependent-surveillance-broadcast"]
title = "Do Military Aircraft use ADS-B?"
description = "Yes, they do, at least partially, but there are massive differences between countries. Let’s add some data to this popular question, shall we? This is from our recent paper at the 36th Digital Avionics Systems Conference [1]. We collected ADS-B and Mode A/C/S data from over 6000 aircraft operated by..."
full_description = "Let’s add some data to this popular question, shall we? This is from our recent paper at the 36th Digital Avionics Systems Conference [1]. We collected ADS-B and Mode A/C/S data from over 6000 aircraft operated by militaries all over the world (with a strong focus on Europe/the US) using the The OpenSky Network. The key plot to answer the question is the following: As we can see, the military ADS-B adoption rate varies between around 10% in Israel to 90% in Saudi Arabia. Here, you see the share of aircraft which use Mode S only or additional comms, ACAS, ADS-B, or all three. Finally, we know that military aircraft can switch off ADS-B when they choose to. This happens regularly, some only really seem to use it en-route in “safe” airspaces but switch it off for their approach to make it ever so slightly harder to see where they land (well, not really but that’s another story). But for that, and other information such as ADS-B equipage per aircraft type, you’ll have to read the full paper. [1] Matthias Schäfer, Martin Strohmeier, Matthew Smith, Markus Fuchs, Vincent Lenders, Marc Liechti and Ivan Martinovic. OpenSky Report 2017: Mode S and ADS-B Usage of Military and other State Aircraft. In IEEE/AIAA 36th Digital Avionics Systems Conference. September 2017."
author = "Martin Strohmeier"
year_published = 2025
