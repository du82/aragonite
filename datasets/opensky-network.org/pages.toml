["https://opensky-network.org/community/blog/itemlist/category/1-posts-on-academic-research-done-with-opensky"]
title = "Research"
full_description = '''You can now feed voice data to OpenSky -- our public feeding interface is finally live! Go to https://ui.atc.opensky-network.org/ to set up your receiver and also see your receiver's stats. In principle, you can use a similar setup to your traditional ADS-B receiver but you will generally need two different setups to feed both ADS-B and VHF at the same time. Please note that this requires a separate user account for the moment, this will be remedied in the future when we will move the old accounts to the new system. Right now, you will also have to let us know through our contact form that you are planning to feed. This will also be consolidated soon. Although in everyday life people prefer texting over calling, it is the opposite in aviation. Tactical information exchange between air traffic controllers (ATCOs) and pilots is still done over analog radio voice channels. For this purpose the VHF (Very High Frequency) band between 118MHz and 136MHz is used. The band is divided into 8.33kHz channels. This site is interfacing Opensky Network's Air Traffic Communication (ATC Platform), which has been set up to collect voice recordings through a network of volunteers. The recordings are automatically transcribed and stored on our infrastructure. Of course there is also a handy API available! Our mission has remained the same over the years - that is, to improve security, reliability, efficiency and sustainability of the air space usage by providing open access of real-world air traffic control data to the public and are available for use for our users. So if you have a specific use case where either recordings or their transcripts are useful, do send us an email This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak62ca29e8b42c6f89be43eb35ea503d81').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy62ca29e8b42c6f89be43eb35ea503d81 