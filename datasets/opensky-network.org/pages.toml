["https://opensky-network.org/about/about-us"]
title = "About Us"
full_description = "The OpenSky Network About The OpenSky Network is a non-profit association based in Switzerland. It aims at improving the security, reliability and efficiency of the air space usage by providing open access of real-world air traffic control data to the public. The OpenSky Network consists of a multitude of sensors connected to the Internet by volunteers, industrial supporters, and academic/governmental organizations. All collected raw data is archived in a large historical database. The database is primarily used by researchers from different areas to analyze and improve air traffic control technologies and processes. The main technologies behind the OpenSky Network are the Automatic Dependent Surveillance-Broadcast (ADS-B) and Mode S. These technologies provide detailed (live) aircraft information over the publicly accessible 1090 MHz radio frequency channel. The OpenSky Network started in 2012 as a research project between armasuisse (Switzerland), University of Kaiserslautern (Germany), and University of Oxford (UK). In 2015, the independent OpenSky Network association was founded to guarantee the continuous development of the network towards a completely open air traffic control sensor network with worldwide coverage. Our mission remains to openly support global air traffic research on a non-profit basis as evidenced, among many other efforts, on our Social Impact page. Please refer to our FAQ and Terms of Use, Publications, join our Discord or email us at contact [at] opensky-network.org for more information (we are not a credit card company!). Credits The circle icons in the footer are taken from http://martz90.deviantart.com/art/Circle-Icons-Pack-371172325. Thanks to Martin Kníže for these beautiful icons. The background icons in the dark boxes are taken from http://graphicloads.com. Thanks for the free icons! Logo"
