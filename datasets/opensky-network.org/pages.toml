["https://opensky-network.org/community/projects/19-android-recorder"]
title = "Android-based Mode S/ADS-B Recorder"
full_description = '''Mode S and ADS-B Recorder for Android Introduction In this project, we developed an Andoird App for recording ADS-B in mobile or remote scenarios. Recording ADS-B messages in such scenarios is challenging as most existing receivers often need a dedicated power source, have a large form factor and also need a more complex setup with a network interface. The basic setup for using this App looks like this: The GNS 5890 receiver has the size of an USB stick. It is powered over the USB port and has a low power consumption < 0.5W. The receiver can be connected via an OTG cable to most Android smart phones and tablets. This device therefore is a good candidate if you want to do ADS-B measurements in (very) remote places. You have the following settings: The main emphasis is on recording Mode S/ADS-B messages for further analyis. Along with the raw messages, meta data such as timestamps and the GPS position is stored. The App also displays some live statistics such as number of visible planes and received message per plane: Example scenarios are: Mobile setups Inside an airplane On a car or on a mountain: Implementation As part of this project, we developed a USB CDC ACM driver for using the USB device in Android. The data received by the dongle is processed, the CRC will be checked, the ICAO extracted and the current time stamp attached. The data gets then inserted into an SQLite database. By benchmarking the App, we found that the application is able to continuously process more than 5000 messages per second (depending on the phone's hardware). The resulting file contains the following tables: flights, flight_state, messages, position. The entries in table flight_state are created periodically and describe the data received for each flight. For more details, open the database file and have a look at the database schema (e.g. with the query "SELECT sql FROM sqlite_master"). The relations between the tables are as depicted in the following image: Downloads/Material Github repository with the code APK of the application for installation The application is also introduced in this bachelor thesis (in German) Contact Markus Gräb (This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak22ca91e67e2487f430973c9c8b253090').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy22ca91e67e2487f430973c9c8b253090 = 'm_gr&#97;&#101;b11' + '&#64;'; addy22ca91e67e2487f430973c9c8b253090 = addy22ca91e67e2487f430973c9c8b253090 + 'cs' + '&#46;' + '&#117;n&#105;-kl' + '&#46;' + 'd&#101;'; var addy_text22ca91e67e2487f430973c9c8b253090 = 'm_gr&#97;&#101;b11' + '&#64;' + 'cs' + '&#46;' + '&#117;n&#105;-kl' + '&#46;' + 'd&#101;';document.getElementById('cloak22ca91e67e2487f430973c9c8b253090').innerHTML += '<a ' + path + '\'' + prefix + ':' + addy22ca91e67e2487f430973c9c8b253090 + '\'>'+addy_text22ca91e67e2487f430973c9c8b253090+'<\/a>'; )Matthias Schäfer (This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak485c070e0bd5078c6e5277fcd1718388').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy485c070e0bd5078c6e5277fcd1718388 = 'sch&#97;&#101;f&#101;r' + '&#64;'; addy485c070e0bd5078c6e5277fcd1718388 = addy485c070e0bd5078c6e5277fcd1718388 + 'cs' + '&#46;' + '&#117;n&#105;-kl' + '&#46;' + 'd&#101;'; var addy_text485c070e0bd5078c6e5277fcd1718388 = 'sch&#97;&#101;f&#101;r' + '&#64;' + 'cs' + '&#46;' + '&#117;n&#105;-kl' + '&#46;' + 'd&#101;';document.getElementById('cloak485c070e0bd5078c6e5277fcd1718388').innerHTML += '<a ' + path + '\'' + prefix + ':' + addy485c070e0bd5078c6e5277fcd1718388 + '\'>'+addy_text485c070e0bd5078c6e5277fcd1718388+'<\/a>'; )'''
