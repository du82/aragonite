title = "OpenSky Workshop 2015"
full_description = '''The 3rd OpenSky Workshop(November 26-27th, 2015) Since its creation in 2013, the OpenSky Network has quickly evolved to a large-scale air traffic control data collection and sharing platform. With now more than 30 sensors operated by volunteers across the globe, the OpenSky Network is today greatly contributing towards the vision of a more efficient, secure and reliable operation of the airspace by providing open accessibility of air traffic control data to the public. Following the successful workshops in 2013 and 2014, the third instance of the OpenSky workshop will be hosted in Oxford (UK) during two consecutive days in November 2015. The event is open to all current contributors of the network (sensor operators, system developers and administrators, and researchers) as well as to any interested party that wishes to get involved to the OpenSky Network in the future. The workshop will serve as a forum to discuss ideas and present ongoing research activities around the OpenSky Network. Participants are invited to actively contribute to the program by presenting at the workshop. In addition to that, the workshop will include technical talks on OpenSky's architecture and data at first hand. Program The final program of the workshop is available for download here: PDF. We will have four sessions. On Thursday, the first session provides insights in OpenSky as an organization and a system. In the afternoon session, latest results of our contributors research will be presented. Friday is dedicated to security-related research topics, ranging from physical layer security to anomaly detection in air traffic patterns. Call for Presentations The workshop invites presentations from the community. The workshop is interested in presentations that can foster discussions and provide inputs for the future development and research around OpenSky. Potential presenters are free to choose any topic for their presentations, but the presentations should be related 