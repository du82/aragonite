["https://opensky-network.org/events/workshop17"]
title = "OpenSky Workshop 2017"
full_description = '''The 5th OpenSky Workshop Since its launch in 2013, the OpenSky Network has quickly evolved to a large-scale air traffic control data collection and sharing platform. With now more than 700 sensors operated by volunteers across the globe and more than 2000 users, the OpenSky Network is today greatly contributing towards the vision of a more efficient, secure and reliable operation of the airspace by providing open accessibility of air traffic control data to the public. Following the successful workshops in the last years, we are proud to announce the fifth instance of the OpenSky workshop. This two-day event will take place in Kaiserslautern (Germany) in November 2017. The event is open to all contributors of the network (sensor operators, users, system developers and administrators, and researchers) as well as to any interested party that wishes to get involved to the OpenSky Network in the future. The workshop will serve as a forum to discuss new ideas, the network itself, and research activities around the OpenSky Network. Participants are invited to actively contribute to the program by presenting their projects at the workshop. As in the last years, there will be many opportunities to get to know the community during the social activities around the workshop program. Programme Thursday, 23/11/17 09:00 AM - 09:30 AM Welcome & Introduction 09:30 AM - 10:30 AM Session 1: New Data Sources Expanding the View on Avionics Communication: The Mode S Uplink Daniel Moser, ETH Zurich A Flarm Receiver for the OpenSky Network Giorgio Tresoldi, ETH Zurich 10:30 AM - 11:00 AM Break 11:00 AM - 12:00 PM Session 2: Aircraft Tracking Models A general aircraft multi-lateration framework with independent non-synchronized receivers Fabio Ricciato, University of Ljubljana Development of a community driven, open, reference trajectory dataset Enrico Spinielli, EUROCONTROL 12:00 PM - 01:30 PM Lunch 01:30 PM - 02:30 PM Session 3: Data Integrity and Trust OpenSky Feeder: The Good, the Bad and the Ugly Markus Fuchs, SeRo Systems Using Trust to Detect Attacks on and Optimise ADS-B Based Air Traffic Surveillance Kai Jansen (Ruhr-Universität Bochum) and William Seymour (University of Oxford) 02:30 PM - 03:00 PM Break 03:00 PM - 04:00 PM Session 4: Security and Privacy ADS-B system’s performance improving by the use of crowd-sourced sensors network Mauro Leonardi, University of Rome "Tor Vergata" New Challenges to Aviation Privacy raised by Large-scale Sensor Networks Martin Strohmeier, University of Oxford 04:00 PM - 05:00 PM OpenSky Award Ceremony 07:00 PM - End Dinner in Kaiserslautern City Friday, 24/11 09:30 AM - 10:30 AM Session 5: Use Cases A case study for safety risk assessment using Mode S data Xavier Olive, ONERA (The French Aerospace Lab) Sensordata distribution within Eurocontrol (SURNET and ASTERIX) Rui Pinheiro, Skysquitter 10:30 AM - 11:00 AM Break 11:00 AM - 12:00 PM Session 6: Receivers Towards a new advanced ADSB receiver in GNURadio: design, first implementation, lessons learned and outlook Blaz Repas, University of Ljubljana Nanosecond-precision Time-of-Arrival Estimation for Mode S Signals with low-cost SDR receivers Roberto Calvo, IMDEA Networks Institute Call for Presentations The workshop invites presentations from the community. The workshop is interested in presentations that can foster discussions and provide input for future development and research around OpenSky. Potential presenters are free to choose any topic for their presentations, but the presentations should be related to the OpenSky network in a wider sense.Proposals including a presentation title and short abstract should be submitted no later than October 1st 2017 by email to This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak7ebc2d031a41967f739ec1af4d0a6775').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy7ebc2d031a41