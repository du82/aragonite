["https://opensky-network.org/community/projects/11-project-solar-powered-ads-b-receiver"]
title = "Solar-powered ADS-B Receiver"
full_description = '''Building A Solar-powered ADS-B Receiver Project Goal The goal of this project is to develop a completely autonomous ADS-B receiver for OpenSky that can be deployed in unattended areas where there is no power and wired network infrastructure available. The sensor shall be powered by a solar panel and send its data to OpenSky over a wireless connection such as 4G or WLAN. 1st Prototype Our first prototype was based on the following equipment: a Radarcape from Jetvision as ADS-B receiver. The receiver consumes approximately 4 W. A Yeti 400 battery from Goal Zero. The battery has a capacity of 400 Wh and costs $460. A AS 50 C photovoltaic panel from Sunset. The solar panel can deliver a maximum power of 50 W. Contact Vincent Lenders (This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloakebe25458a113e6346ac468fbabc59d46').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addyebe25458a113e6346ac468fbabc59d46 = 'l&#101;nd&#101;rs' + '&#64;'; addyebe25458a113e6346ac468fbabc59d46 = addyebe25458a113e6346ac468fbabc59d46 + '&#111;p&#101;nsky-n&#101;tw&#111;rk' + '&#46;' + '&#111;rg'; var addy_textebe25458a113e6346ac468fbabc59d46 = 'l&#101;nd&#101;rs' + '&#64;' + '&#111;p&#101;nsky-n&#101;tw&#111;rk' + '&#46;' + '&#111;rg';document.getElementById('cloakebe25458a113e6346ac468fbabc59d46').innerHTML += '<a ' + path + '\'' + prefix + ':' + addyebe25458a113e6346ac468fbabc59d46 + '\'>'+addy_textebe25458a113e6346ac468fbabc59d46+'<\/a>'; )'''
