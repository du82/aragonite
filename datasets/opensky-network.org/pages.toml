["https://opensky-network.org/data/data-tools"]
title = "Data Tools"
full_description = '''Data Tools provided by the OpenSky Community On this page, we will collect and briefly introduce some of the OpenSky-related tools provided by our extraordinary community, covering different functionalities in the main data science languages Python, R and Matlab. Principally, these are tools to access and process data either via our Impala shell (acess request required), our live API or our prepared datasets. Naturally, the OpenSky Network Association does not maintain these tools and thus cannot give any support. For further questions on any of these, you should ask the respective maintainer or try our forum. Pretty much all of these tools are developed as open source, so you can help improve them and report any bugs. This list is work in progress, if you want to add your OpenSky tool or know of one that should be on this page, please write us atThis email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloaka8581c64a8b01b35f096d385ce1e250a').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addya8581c64a8b01b35f096d385ce1e250a = 'c&#111;nt&#97;ct' + '&#64;'; addya8581c64a8b01b35f096d385ce1e250a = addya8581c64a8b01b35f096d385ce1e250a + '&#111;p&#101;nsky-n&#101;tw&#111;rk' + '&#46;' + '&#111;rg'; var addy_texta8581c64a8b01b35f096d385ce1e250a = ' c&#111;nt&#97;ct@&#111;p&#101;nsky-n&#101;tw&#111;rk.&#111;rg';document.getElementById('cloaka8581c64a8b01b35f096d385ce1e250a').innerHTML += '<a ' + path + '\'' + prefix + ':' + addya8581c64a8b01b35f096d385ce1e250a + '\'>'+addy_texta8581c64a8b01b35f096d385ce1e250a+'<\/a>'; Further reading suggestions for better understanding of the air traffic data we use include: https://atmdata.github.io/ https://mode-s.org/decode/ https://github.com/openskynetwork All data tools: 1. traffic – Air traffic data processing in Python 2. pyModeS + pyOpenSky 3. em-download-opensky + em-processing-opensky 4. R-based Wrappers: openSkies, osn, openskyr 5. ADSbDataParser 6. Stone Soup 7. Other Wrappers (C#, Typescript, Perl, Go, Rust) 1. traffic – Air traffic data processing in Python Developer: Xavier Olive, Onera Description: The traffic library helps working with common sources of air traffic data. It provides a Python interface for our Impala shell among many other functions. Its main purpose is to provide data analysis methods commonly applied to trajectories and airspaces. When a specific function is not provided, the access to the underlying structure is direct, through an attribute pointing to a pandas dataframe. The library also offers facilities to parse and/or access traffic data from open sources of ADS-B traffic like the OpenSky Network or Eurocontrol DDR files. It is designed to be easily extendable to other sources of data. Source: https://github.com/xoolive/traffic Scientific Paper: Xavier Olive and Luis Basora. A Python Toolbox for Processing Air Traffic Data: A Use Case with Trajectory Clustering. In Proceedings of the 7th OpenSky Workshop 2019. November 2019, 73–84. 2. pyModeS + pyOpenSky Developer: Junzi Sun, TU Delft Description: pyModeS is a Python library designed to decode Mode-S (including ADS-B) message. It can be imported to your python project or used as a standalone tool to view and save live traffic data. pyOpenSky is a compatible interface for our Impala database, providing the options to: Query raw and ADS-B messages from OpenSky Impala database. Decode OpenSky Comm-B information automatically using pyModeS. The pyopensky connects the pyModeS decoder and OpenSky-network raw Mode-S data. It aims at making the Enhance Mode-S information form OpenSky network more accessible for researchers. It can automatically retrieve and download data in rollcall_replies_data4 table from the OpenSky Impala database, and then decodes several common Mode-S Comm-B message types. Sources: https://github.com/junzis/pyopenskyhttps://github.com/junzis/pyModeS Scientific Papers: Junzi Sun and Jacco Hoekstra. Integrating pyModeS and OpenSky Historical Database. In Proceedings of the 7th OpenSky Workshop 2019. November 2019, 63–72. 3. em-download-opensky + em-processing-opensky Developer: MIT Lincoln Labs Description: The em-download-opensky repository is a collection of shell scripts and MATLAB code to query the OpenSky Network Impala database and download crowdsourced observations of aircraft. The download data can then processed using the em-processing-opensky repository. Additionally, this software is a MATLAB and shell alternative to the Python-based Xavier Olive's traffic and Junzi Sun's pyModeS repositories. The shell scripts can be used independent of the MATLAB software. The software also enables queries based on AGL altitude, aerodromes, airspace class, and time zone. Although this is not a one-to-one MATLAB alternative to the Python repositories, as each repository queries the Impala database slightly different. For example, Olive's traffic software can query the Impala historical database based on an optional geographic footprint of an airspace or user defined shape with MSL altitude; whereas em-download-opensky generates custom bounding boxes based on AGL altitude. Some of the functionality might be useful for US-focused users. Sources: https://github.com/Airspace-Encounter-Models/em-download-openskyhttps://github.com/Airspace-Encounter-Models/em-processing-opensky 4. R-based Wrappers: openSkies, osn, openskyr Developers: Rafael Ayala, Okinawa Institute of Science and Technology Graduate University (openSkies) Enrico Spinielli, Eurocontrol (osn) Luis Gasco, Universidad Politécnica de Madrid (openSkyR) Description: There are several R-based wrappers available from different developers, providing access to either our live API or the Impala shell. openSkies is the most currently maintained and released on CRAN. It aims to provide the data structures and functionalities required to analyze and visualize aviation data in R. The package provides a system of classes with associated methods representing the most common entities related to aviation data, such as aircrafts, airports, flights or routes. It also includes a client interface to the OpenSky live API and Impala Shell, and a decoder of ADSB messages Finally, functions to process and plot aircraft and flight data are also provided. A full, detailed list of the available features can be found in the manual and the vignette of the package. Sources: https://github.com/Rafael-Ayala/openSkieshttps://github.com/espinielli/osnhttps://github.com/luisgasco/openskyr 5. ADSbDataParser Developers: L.L. Schmidt and C. Bloemer-Zurborg, Institute of Flight Guidance, TU Braunschweig Description: The ADSbDataParser can be used to filter and preprocess ADS-B data and is especially adapted to historic traffic data with format state_vectors_data4 of The OpenSky Network. The data parser is developed using Java technology and m-files are provided to use the parser within MATLAB. Sources: https://github.com/LSchmidt-TUBS/ADSbDataParser 6. Stone Soup Developers: Paul Thomas and Steven Hiscocks, UK Defence Science and Technology Laboratory Description: Stone Soup is a software project to provide the target tracking and state estimation community with a framework for the development and testing of tracking and state estimation algorithms. It includes an interface to the OpenSky REST API. Sources: https://github.com/dstl/Stone-Souphttps://stonesoup.readthedocs.io/en/v0.1b5/ Scientific Paper: David Last, Paul Thomas, Steven Hiscocks, Jordi Barr, David Kirkland, Mamoon Rashid, Sang Bin Li, and Lyudmil Vladimirov. "Stone Soup: announcement of beta release of an open-source framework for tracking and state estimation." In Signal Processing, Sensor/Information Fusion, and Target Recognition XXVIII, vol. 11018, p. 1101807. International Society for Optics and Photonics, 2019. 7. API Wrappers for other Languages Developers: Steve Berdy, Raed Chammam, Curtis Poe, Navid Yaghoobi, Luke Newcomb Description: Assortment of further (API) wrappers for other languages Sources: C#: https://github.com/steveberdy/OpenSkyTypescript: https://github.com/raed667/opensky-apiPerl: https://github.com/Ovid/opensky-apiGo: https://github.com/navidys/gopenskyRust: https://lib.rs/crates/opensky-network'''
