["https://opensky-network.org/community/blog/item/3-is-there-any-working-intrusion-detection-system-for-ads-b"]
title = "Is there any working intrusion detection system for ADS-B?"
description = "Tl;dr: Not that we know of. At least not deployed anywhere outside a lab. Some proposals have been floated, however. This post was inspired by the recent report by the US Congress Government Accountability Office on ADS-B, which was discussed in many articles around the web, such as this one, for ex..."
full_description = "Tl;dr: Not that we know of. At least not deployed anywhere outside a lab. Some proposals have been floated, however. This post was inspired by the recent report by the US Congress Government Accountability Office on ADS-B, which was discussed in many articles around the web, such as this one, for example: GAO: Pentagon, FAA Lag In Addressing ADS-B Risks Let’s have a look at the source, these are quotes from the GOA’s actual document, citing some of the work from contributors here at OpenSky: [1] While NORAD and DOD officials told us that they will benefit from information provided by ADS-B technology, NORAD, DOD, and professional organizations’ documents and officials also noted that electronic warfare-and cyber-attacks—and the potential divestment of secondary-surveillance radars as a result of reliance on ADS-B—could adversely affect current and future air operations. For example, a 2015 Institute of Electrical and Electronics Engineers article [2] about ADS-B stated that ADS-B is vulnerable to an electronic-warfare attack—such as a jamming attack […] According to the article in the 2015 Institute of Electrical and Electronics Engineers publication, adversaries could use a cyber-attack to inject false ADS-B messages (that is, create “ghost” aircraft on the ground or air); delete ADS-B messages (that is,make an aircraft disappear from the air traffic controller screens); and modify messages (that is, change the reported path of the aircraft). The article states that jamming attacks against ADS-B systems would be simple, and that ADS-B data do not include verification measures to filter out false messages, such as those used in spoofing attacks. FAA officials stated that the agency is aware of these possible attacks, and that it addresses such vulnerabilities by validating ADS-B data against primary- and secondary-surveillance radar tracks. Both FAA and DOD have identified a potential solution to address this vulnerability. However, this solution has not been tested and as of November 2017, no testing has been scheduled."
author = "Martin Strohmeier"
year_published = 2025
