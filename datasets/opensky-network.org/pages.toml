["https://opensky-network.org/about/social-impact"]
title = "Social Impact"
full_description = "Our Social Impact In fulfilling its core mission, OpenSky has supported countless academic research institutions since it's inception. As of 2023, more than 350 academic papers have been published, which can be accessed on our Publications page. Beyond our original mission, we have been freely contributing our data to the greater social good. Dozens of non-profit institutions, NGOs and journalists have been using our flight data for everything from internal research to publicly released analyses. Example use cases range from gauging Covid-19-related impact to investigative journalism. You can find some more information about these developments in a recent paper and video published at our 8th OpenSky Symposium. In the following, you can see examples of these institutions that have received access to our flight data for the benefit of civil society. If your institution, too, has interesting non-profit use cases, please use our Apply for Data Access page! Journalists Bellingcat Center for Public Integrity Civil Forum for Asset Recovery Financial Times Der SPIEGEL Investigative Journalism Education Consortium Journalistes Solidaires Süddeutsche Zeitung Syria Direct Tagesanzeiger The Globe and Mail Supra-National Institutions International Air Transport Association (IATA) International Monetary Fund (IMF) United Nations (e.g., Sanctions Committee, Statistics Office) World Bank World Trade Organisation National Institutions Bank of England Banque de France Danish National Bank INSEE MITRE Reserve Bank of New Zealand Statistics Denmark US Department of Agriculture NGOs Bauhaus Luftfahrt e. V. British Gliding Association globalwitness Institute for Scientific Interchange SkyTruth"
