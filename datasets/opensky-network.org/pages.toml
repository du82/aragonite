["https://opensky-network.org/community/events/18-opensky-workshop-2016"]
title = "OpenSky Workshop 2016"
full_description = '''The 4th OpenSky Workshop Since its launch in 2013, the OpenSky Network has quickly evolved to a large-scale air traffic control data collection and sharing platform. With now more than 100 sensors operated by volunteers across the globe, the OpenSky Network is today greatly contributing towards the vision of a more efficient, secure and reliable operation of the airspace by providing open accessibility of air traffic control data to the public. Following the successful workshops in 2013, 2014, and 2015, we are proud to announce the fourth instance of the OpenSky workshop. The two-day workshop will take place in Oxford (UK) in November 2016. The event is open to all contributors of the network (sensor operators, system developers and administrators, and researchers) as well as to any interested party that wishes to get involved to the OpenSky Network in the future. The workshop will serve as a forum to discuss new ideas, the network itself, and research activities around the OpenSky Network. Participants are invited to actively contribute to the program by presenting their projects at the workshop. In addition to that, the workshop will include technical talks on OpenSky's architecture and data at first hand. As in the last years, there will be many opportunities to get to know the community during the social activities around the workshop program. Programme Thursday, 24/11 09:00 AM - 09:30 AM Welcome & Introduction 09:30 AM - 12:00 PM Session 1: Applications OpenSky's Past, Present, and Future (50')Matthias Schäfer Detection of GPS Jammers and Spoofers via ADS-B Reports (25')Kai Jansen Retrieving Meteorological Information From OpenSky's Data (25')Vincent Lenders 12:00 PM - 01:30 PM Lunch 01:30 PM - 04:30 PM Session 2: Data Sources & Sensors WX: Impact on Aviation and where to get this information (50')Rui Pinheiro First Insights on Receiving SATCOM (25')Daniel Moser On Mode S Downlink Reception (50')Michael Arndt 04:30 PM - 05:00 PM OpenSky Award Ceremony 06:00 PM - End Oxford City (Guided Tour) Friday, 25/11 09:00 AM - 12:30 PM Session 3: Data Processing & Privacy OpenSky Backend Stories (25')Markus Fuchs 3D MLAT of Aircraft Trajectories from lossy ToA measurements (50')Fabio Ricciato Analysing the Privacy Implications of Flight Tracking (50')Martin Strohmeier Investigating Security & Privacy in ACARS - the Frankenstein of Avionic Communications (25')Matt Smith 12:30 PM - 02:00 PM Lunch 02:00 PM - 05:00 PM Discussion Session Incentives for Feeders and Users Useful External Data Sources Call for Presentations The workshop invites presentations from the community. We are interested in presentations that can foster discussions and provide input for future development and research around OpenSky. Potential presenters are free to choose any topic for their presentations, but the presentations should be related to the OpenSky network in a wider sense. Presentations can be either 25 or 50 minutes long. Proposals including a presentation title, short abstract, and the desired slot duration should be submitted no later than October 1st 2016 by email to This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak22973761e63ed08e70173c19bd339895').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy22973761e63ed08e70173c19bd339895 = 'w&#111;rksh&#111;p16' + '&#64;'; addy22973761e63ed08e70173c19bd339895 = addy22973761e63ed08e70173c19bd339895 + '&#111;p&#101;nsky-n&#101;tw&#111;rk' + '&#46;' + '&#111;rg'; var addy_text22973761e63ed08e70173c19bd339895 = 'w&#111;rksh&#111;p16' + '&#64;' + '&#111;p&#101;nsky-n&#101;tw&#111;rk' + '&#46;' + '&#111;rg';document.getElementById('cloak22973761e63ed08e70173c19bd339895').innerHTML += '<a ' + path + '\'' + prefix + ':' + addy22973761e63ed08e70173c19bd339895 + '\'>'+addy_text22973761e63ed08e70173c19bd339895+'<\/a>'; . Attendance will be limited to 20 people to facilitate lively discussions at the workshop. The organizers reserve the right to reject submitted proposals if they do not fit into the program. Registration If you want to attend the workshop (with or without presentation), please register by email to This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak4daecd20eccac5dc73983fb0566e24cf').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy4daecd20eccac5dc73983fb0566e24cf = 'w&#111;rksh&#111;p16' + '&#64;'; addy4daecd20eccac5dc73983fb0566e24cf = addy4daecd20eccac5dc73983fb0566e24cf + '&#111;p&#101;nsky-n&#101;tw&#111;rk' + '&#46;' + '&#111;rg'; var addy_text4daecd20eccac5dc73983fb0566e24cf = 'w&#111;rksh&#111;p16' + '&#64;' + '&#111;p&#101;nsky-n&#101;tw&#111;rk' + '&#46;' + '&#111;rg';document.getElementById('cloak4daecd20eccac5dc73983fb0566e24cf').innerHTML += '<a ' + path + '\'' + prefix + ':' + addy4daecd20eccac5dc73983fb0566e24cf + '\'>'+addy_text4daecd20eccac5dc73983fb0566e24cf+'<\/a>'; . The number of attendees is limited to 20. Early registrations and presenters will be preferred. Venue The workshop will take place in the Robert Hooke Building, Parks Road, Oxford OX1 3PR, in the Department of Computer Science of the University of Oxford, UK. The University is located in the city center of Oxford and easily accessible from the main London airports by bus or train. Important dates Presentation titles due: October 1st 2016 Notification of acceptance: October 15th 2016 Program announcement: October 24nd 2016 Workshop dates: November 24-25th 2016 Organizing Committee Local Chair: This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak248c3073348c402d7631653def93be40').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy248c3073348c402d7631653def93be40 = 'm&#97;rt&#105;n&#111;v&#105;c'