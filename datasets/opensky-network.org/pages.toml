title = "OpenSky: Air Traffic Data for Scientists"
description = "OpenSky has been founded by scientists for scientists. The mission of our non-profit association since 2014 has been to support open global air traffic research by universities and other not-for-profit institutions. We can confidently state that this has been an increasingly successful endeavour. In..."
full_description = "OpenSky has been founded by scientists for scientists. The mission of our non-profit association since 2014 has been to support open global air traffic research by universities and other not-for-profit institutions. We can confidently state that this has been an increasingly successful endeavour. In this blog post, I want to briefly look back on recent developments, illustrating the growing influence of OpenSky and air traffic data in general on research of all sorts and our new efforts (helped by our impressive community) in supporting more of these attempts with even better and more tools and data. But everything is only possible thanks to our feeders and supporters around the globe! If you want to improve air traffic research around the world for the common good, do join us! This analysis is just a fraction of the data we have analysed in a recent resarch paper [1]. The figure illustrates the growing number of publications over the past few years based on OpenSky data and divides it also into the most popular research areas over time. The gray bars illustrate the overall growth trend, which strongly accelerated by 2018 with 22 publications, 144% more than in the previous year. This trend continued in 2019 with a 118% increase. For this year (as of November 2020), 54 publications have been counted, ensuring a new record before the year has ended. We can break down our analysis further by taking a look at the different scientific subfields in which OpenSky’s data have been used. We identified four large recurring themes: machine learning (ML, 16 papers overall), air traffic management (ATM, 50 papers), (cyber) security (36 papers),and Earth sciences (8 papers). Smaller areas, subsumed under ‘Others’, include research on noise, high-performance computing, sensor networks, and visualization, among others. From the trends ofthe subfields, we can see that security was the largest area of OpenSky data use in the early years up to and including 2018, reflecting the interests of the original community."
author = "Martin Strohmeier"
year_published = 2025
