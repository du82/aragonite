["http://www.opensky-network.org"]
title = "The OpenSky Network - Free ADS-B and Mode S data for Research"
full_description = "Registration currently suspended - new website soon! Our registration for new users is currently suspended, while we are moving to a new user management system and a new website. Expect great things very soon! Eurocontrol PRC - OpenSky Data Challenge: Winners announced! Together with Eurocontrol's Performance Review Commission ran a new aviation data challenge, predicting the actual take off weights of aircraft. All information and the winners can be found on the PRC Data Challenge website. 12th OpenSky Symposium in Hamburg: November 07/08, 2024 We had a great time at the 12th OpenSky Symposium in Hamburg! Check out the details on the Symposium website. Proceedings and videos coming soon, see you next year in Sweden! About the OpenSky Network The OpenSky Network is a non-profit community-based receiver network which has been continuously collecting air traffic surveillance data since 2013. Unlike other networks, OpenSky keeps the complete unfiltered raw data and makes it accessible to academic and institutional researchers. With over 30 trillion ADS-B, Mode S, TCAS and FLARM messages collected from more than 7000 sensors around the world, the OpenSky Network exhibits the largest air traffic surveillance dataset of its kind. The mission of our non-profit association is to support open global air traffic research by universities and other not-for-profit institutions. You can find more information on our blog! Aircraft Database Find and track aircraft with our comprehensive database. You can also add and update information! Enter » Unfiltered live API Our live API comes with Java and Python bindings, but it can be used with any language that supports JSON-based REST APIs. Read more » OpenSky Explorer Browse through historical air traffic with our OpenSky Explorer. OpenSky Explorer » Air Traffic Statistics See up-to-date statistics on air traffic and our network on our Network Facts page. See Statistics »"
