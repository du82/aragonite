full_description = '''Sources This database is built and maintained from the following sources: Official aircraft registries Various Basestation.sqb files Crowdsourced and manually collected data from various supporters. openflights.org ICAO Doc 8643 You can add your information directly on the website, just click on "Add airframe" or "Edit airframe"! We may accept additional aircraft data in any format (CSV, BaseStation.sqb, ...). Just contact This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak64dce3874196b0709623e33fc46ff8e2').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy64dce3874196b0709623e33fc46ff8e2 = 'c&#111;nt&#97;ct' + '&#64;'; addy64dce3874196b0709623e33fc46ff8e2 = addy64dce3874196b0709623e33fc46ff8e2 + '&#111;p&#101;nsky-n&#101;tw&#111;rk' + '&#46;' + '&#111;rg'; var addy_text64dce3874196b0709623e33fc46ff8e2 = 'c&#111;nt&#97;ct' + '&#64;' + '&#111;p&#101;nsky-n&#101;tw&#111;rk' + '&#46;' + '&#111;rg';document.getElementById('cloak64dce3874196b0709623e33fc46ff8e2').innerHTML += '<a ' + path + '\'' + prefix + ':' + addy64dce3874196b0709623e33fc46ff8e2 + '\'>'+addy_text64dce3874196b0709623e33fc46ff8e2+'<\/a>'; for further instructions. Citation and Use The aircraft database is unlicensed, as such does not fall under our terms of use. We don't do support or provide guarantees of any type for it. It is just 'as is'. It is crowdsourced, so anybody can help us improve it! If you create a publication (including web pages, papers published by a third party, and publicly available presentations) using data from the OpenSky Network data set, you should cite the original OpenSky paper as follows: Matthias Schäfer, Martin Strohmeier, Vincent Lenders, Ivan Martinovic and Matthias Wilhelm. "Bringing Up OpenSky: A Large-scale ADS-B Sensor Network for Research". In Proceedings of the 13th IEEE/ACM International Symposium on Information Processing in Sensor Networks (IPSN), pages 83-94, April 2014. You can additionally mention our URL, where appropriate: The OpenSky Network, https://opensky-network.org'''
