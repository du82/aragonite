full_description = '''Support our mission Help us protect the Open Source Definition Donate and join as full member to gain the right to vote 2024 was a great year for us, thanks to the contribution of our members Become a member of the Open Source Initiative Name // Putting these functions directly in template for historical reasons. function useAmountOther(mainPriceFieldName) { var currentFocus = CRM.$(':focus'); CRM.$('input[name=' + mainPriceFieldName + ']:radio:unchecked').each( function () { if (CRM.$(this).data('is-null-option') !== undefined) { // Triggering this click here because over in Calculate.tpl // a blur action is attached CRM.$(this).prop('checked', true).trigger('click'); } } ); // Copied from `updatePriceSetHighlight()` below which isn't available here. // @todo - consider adding this to the actions assigned in Calculate.tpl CRM.$('#priceset .price-set-row span').removeClass('highlight'); CRM.$('#priceset .price-set-row input:checked').parent().addClass('highlight'); // Return the focus we blurred earlier. currentFocus.trigger('focus'); } function clearAmountOther(otherPriceFieldName) { cj('#' + otherPriceFieldName).val('').trigger('blur'); } At OSI we are driven by a burning passion for open source. We believe that knowledge should be freely accessible, and technology should be open for all. By becoming a member, you will have the opportunity to vote to elect board members. Your support will enable us to continue advocating for open source values, fighting for software freedom, and ensuring that open source remains a driving force in the digital world. Remember, every voice counts, and every contribution matters. Join us as a member today and help us build a brighter and more open future! Membership will last 12 months. New Membership If you have a discount code, enter it here Apply Membership * Supporting - $ 50.00 Professional - $ 300.00 Basic - $ 0.00 Please renew my membership automatically. Membership will renew automatically. Donate more $ Total Amount var thousandMarker = ','; var separator = '.'; var symbol = '$'; // moneyFormat is part of a temporary fix. it should // not be expected to be present in future versions // see https://github.com/civicrm/civicrm-core/pull/19151 var moneyFormat = '$ 1,234.56'; var optionSep = '|'; // Recalculate the total fees based on user selection cj("#priceset [price]").each(function () { var elementType = cj(this).attr('type'); if (this.tagName == 'SELECT') { elementType = 'select-one'; } switch(elementType) { case 'checkbox': cj(this).click(function(){ calculateCheckboxLineItemValue(this); display(calculateTotalFee()); }); calculateCheckboxLineItemValue(this); break; case 'radio': cj(this).click( function(){ calculateRadioLineItemValue(this); display(calculateTotalFee()); }); calculateRadioLineItemValue(this); break; case 'text': cj(this).bind( 'keyup', function() { calculateText(this); }).bind( 'blur' , function() { calculateText(this); }); //default calculation of element. calculateText(this); break; case 'select-one': calculateSelectLineItemValue(this); cj(this).change(function() { calculateSelectLineItemValue(this); display(calculateTotalFee()); }); break; } display(calculateTotalFee()); }); /** * Calculate the value of the line item for a radio value. */ function calculateCheckboxLineItemValue(priceElement) { eval( 'var option = ' + cj(priceElement).attr('price') ) ; optionPart = option[1].split(optionSep); price = parseFloat(0); if (cj(priceElement).prop('checked')) { price = parseFloat(optionPart[0]); } cj(priceElement).data('line_raw_total', price); } /** * Calculate the value of the line item for a radio value. */ function calculateRadioLineItemValue(priceElement) { eval( 'var option = ' + cj(priceElement).attr('price') ); optionPart = option[1].split(optionSep); var lineTotal = parseFloat(optionPart[0]); cj(priceElement).data('line_raw_total', lineTotal); var radionGroupName = cj(priceElement).attr("name"); // Reset all unchecked options to having a data value of 0. cj('input[name=' + radionGroupName + ']:radio:unchecked').each( function () { cj(this).data('line_raw_total', 0); } ); } /** * Calculate the value of the line item for a select value. */ function calculateSelectLineItemValue(priceElement) { eval( 'var selectedText = ' + cj(priceElement).attr('price') ); var price = parseFloat('0'); var option = cj(priceElement).val(); if (option) { optionPart = selectedText[option].split(optionSep); price = parseFloat(optionPart[0]); } cj(priceElement).data('line_raw_total', price); } /** * Calculate the value of the line item for a text box. */ function calculateText(priceElement) { //CRM-16034 - comma acts as decimal in price set text pricing //CRM-19937 - dollar sign easy mistake to make by users. var textval = parseFloat(cj(priceElement).val().replace(thousandMarker, '').replace(symbol, '').replace(separator, '.')); if (isNaN(textval)) { textval = parseFloat(0); } eval('var option = '+ cj(priceElement).attr('price')); optionPart = option[1].split(optionSep); addprice = parseFloat(optionPart[0]); var curval = textval * addprice; cj(priceElement).data('line_raw_total', curval); display(calculateTotalFee()); } /** * Calculate the total fee for the visible priceset. */ function calculateTotalFee() { var totalFee = 0; cj("#priceset [price]").each(function () { totalFee = totalFee + cj(this).data('line_raw_total'); }); return totalFee; } /** * Display calculated amount. */ function display(totalfee) { // totalfee is monetary, round it to 2 decimal points so it can // go as a float - CRM-13491 totalfee = Math.round(totalfee*100)/100; // dev/core#1019 Use the moneyFormat assigned to the template as an interim fix // to support forms using a currency other that the site default. Also make sure to // support various currency formatting options, // temporary measure - pending // our preferred fix. // see https://github.com/civicrm/civicrm-core/pull/19151 var totalFormattedFee = CRM.formatMoney(totalfee, false, moneyFormat); cj('#pricevalue').html(totalFormattedFee); cj('#total_amount').val( totalfee ); cj('#pricevalue').data('raw-total', totalfee).trigger('change'); if (totalfee < 0) { cj('table#pricelabel').addClass('disabled'); } else { cj('table#pricelabel').removeClass('disabled'); } if (typeof skipPaymentMethod == 'function') { // Advice to anyone who, like me, feels hatred towards this if construct ... if you remove the if you // get an error on participant 2 of a event that requires approval & permits multiple registrants. skipPaymentMethod(); } } CRM.$(function($) { showHideAutoRenew( null ); }); function showHideAutoRenew( memTypeId ) { var priceSetName = "price_"+'5'; var considerUserInput = ''; if ( memTypeId ) considerUserInput = false; if ( !memTypeId ) memTypeId = cj('input:radio[name='+priceSetName+']:checked').data('membership-type-id'); //does this page has only one membership type. var renewOptions = {"autoRenewMembershipType_1":1,"autoRenewMembershipType_8":1,"autoRenewMembershipType_6":0}; var currentOption = eval( "renewOptions." + 'autoRenewMembershipType_' + memTypeId ); if (memTypeId === undefined) { currentOption = 0; } var autoRenew = cj('#auto_renew_section'); var autoRenewC = cj('input[name="auto_renew"]'); var forceRenew = cj("#force_renew"); var readOnly = false; var isChecked = false; if (currentOption == 0 ) { isChecked = false; forceRenew.hide(); autoRenew.hide(); } if ( currentOption == 1 ) { forceRenew.hide(); autoRenew.show(); //uncomment me, if we'd like //to load auto_renew checked. //isChecked = true; } else if ( currentOption == 2 || currentOption == 4) { autoRenew.hide(); forceRenew.show(); isChecked = readOnly = true; } if ( considerUserInput ) isChecked = autoRenew.prop('checked' ); //its a normal recur contribution. if ( cj( "is_recur" ) && ( cj( 'input:radio[name="is_recur"]:checked').val() == 1 ) ) { isChecked = false; autoRenew.hide(); forceRenew.hide(); } autoRenewC.attr( 'readonly', readOnly ); autoRenewC.prop('checked', isChecked ); } CRM.$(function($) { //keep read only always checked. cj( "#auto_renew" ).click(function( ) { if ( cj(this).attr( 'readonly' ) ) { cj(this).prop('checked', true ); } }); }); CRM.$(function($) { var orgOption = $("input:radio[name=org_option]:checked").attr('id'); var onBehalfRequired = '$onBehalfRequired'; var onbehalfof_id = $('#onbehalfof_id'); var is_for_organization = $('#is_for_organization'); selectCreateOrg(orgOption, false); if (is_for_organization.length) { showHideOnBehalfOfBlock(); is_for_organization.on('change', function() { showHideOnBehalfOfBlock(); }); } function showHideOnBehalfOfBlock() { $('#on-behalf-block').toggle(is_for_organization.is(':checked')); if (is_for_organization.is(':checked')) { $('#onBehalfOfOrg select.crm-select2').removeClass('crm-no-validate'); } else { $('#onBehalfOfOrg select.crm-select2').addClass('crm-no-validate'); } } $("input:radio[name='org_option']").click( function( ) { var orgOption = $(this).attr('id'); selectCreateOrg(orgOption, true); }); onbehalfof_id.change(function() { setLocationDetails($(this).val()); }).change(); if (onbehalfof_id.length) { setLocationDetails(onbehalfof_id.val()); } function resetValues() { // Don't trip chain-select when clearing values $('.crm-chain-select-control', "#select_org div").select2('val', ''); $('input[type=text], select, textarea', "#select_org div").not('.crm-chain-select-control, #onbehalfof_id').val('').change(); $('input[type=radio], input[type=checkbox]', "#select_org div").prop('checked', false).change(); $('#on-behalf-block input').not('input[type=checkbox], input[type=radio], #onbehalfof_id').val(''); // clear checkboxes and radio $('#on-behalf-block') .find('input[type=checkbox], input[type=radio]') .not('input[name=org_option]') .attr('checked', false); } function selectCreateOrg( orgOption, reset ) { if (orgOption == 'CIVICRM_QFID_0_org_option') { $("#onbehalfof_id").show().change(); $("input#onbehalf_organization_name").hide(); } else if (orgOption == 'CIVICRM_QFID_1_org_option') { $("input#onbehalf_organization_name").show(); $("#onbehalfof_id").hide(); reset = true; } if ( reset ) { resetValues(); } } function setLocationDetails(contactID , reset) { resetValues(); var locationUrl = '' + contactID; var submittedOnBehalfInfo = ''; var submittedCID = ""; if (submittedOnBehalfInfo) { submittedOnBehalfInfo = $.parseJSON(submittedOnBehalfInfo); if (submittedCID == contactID) { $.each(submittedOnBehalfInfo, function(key, value) { //handle checkboxes if (typeof value === 'object') { $.each(value, function(k, v) { $('#onbehalf_' + key + '_' + k).prop('checked', v); }); } else if ($('#onbehalf_' + key).length) { $('#onbehalf_' + key ).val(value); } //radio buttons else if ($("input[name='onbehalf[" + key + "]']").length) { $("input[name='onbehalf[" + key + "]']").val([value]); } }); return; } } $.ajax({ url : locationUrl, dataType : "json", success : function(data, status) { for (var ele in data) { if ($("#"+ ele).hasClass('crm-chain-select-target')) { $("#"+ ele).data('newVal', data[ele].value).off('.autofill').on('crmOptionsUpdated.autofill', function() { $(this).off('.autofill').val($(this).data('newVal')).change(); }); } else if ($('#' + ele).data('select2')) { $('#' + ele).select2('val', data[ele].value); } if (data[ele].type == 'Radio') { if (data[ele].value) { var fldName = ele.replace('onbehalf_', ''); $("input[name='onbehalf["+ fldName +"]']").filter("[value='" + data[ele].value + "']").prop('checked', true); } } else if (data[ele].type == 'CheckBox') { for (var selectedOption in data[ele].value) { var fldName = ele.replace('onbehalf_', ''); $("input[name='onbehalf["+ fldName+"]["+ selectedOption +"]']").prop('checked','checked'); } } else if (data[ele].type == 'AdvMulti-Select') { var customFld = ele.replace('onbehalf_', ''); // remove empty value if any $('#onbehalf\\['+ customFld +'\\]-f option[value=""]').remove(); $('#onbehalf\\['+ customFld +'\\]-t option[value=""]').remove(); for (var selectedOption in data[ele].value) { //