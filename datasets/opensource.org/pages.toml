full_description = "How the election of Affiliate director works Page created on January 27, 2022 | Last modified on February 28, 2025 Eligibility Affiliate organizations must join OSI one week or more before the opening of nominations to participate in that election. Affiliates may nominate any individual as a candidate. This individual need not be an OSI member. Candidates are required to participate in two mandatory educational sessions held by the Board before the voting starts. Refer to the elections page for this year’s timeline. Nomination Affiliate representatives will nominate candidates via the online form (now closed). Each Affiliate organization may nominate only one candidate. Eligible and approved candidates will have their personal candidate profile page posted on the OSI web site. Members of OSI and Affiliate representatives will be able to ask questions of each candidate before the election concludes. OSI may host additional events or forums where candidates and members may get to know each other. A person can only be a candidate in the Affiliate Election, or in the Individual Election, but may not run in both in the same year. Voting for Affiliate Board Members After the close of nominations, the list of Affiliate representatives will be added to the voting software. OSI staff will send instructions on how to vote to all representatives. Each representative gets one vote in the Affiliate election. Representatives who are also current full individual members may also vote in the individual election. Voting will be open for 10 days, usually including two weekends. Results will be announced within five days of the close of voting. Carlo Piana About Carlo is a lawyer based in Milan, Italy, practicing IT law, active for almost 25 years in advocacy and activism for digital freedoms. He has been involved in the…Meet the candidate Ruth Suehle About Ruth Suehle is director of the open source program at SAS, where she is building the analytics company’s open source program office. She began her career in web development,…Meet the candidate Nadia Jiang Nadia Jiang is a passionate open-source advocate and an expert in Developer Relations (DevRel). She currently leads Open Source Growth at Ant Group. Prior to this, she co-founded and served as COO of SegmentFault, the largest developer Q&A community in China. She is also a PMC Member of Apache Answer.Meet the candidate Bradley Kuhn Bradley M. Kuhn is the Policy Fellow and Hacker-in-Residence at Software Freedom Conservancy and editor-in-chief of copyleft.org. Kuhn began his work in the software freedom movement as a volunteer in 1992, when he became an early adopter of Linux-based systems, and began contributing to various Free Software projects, including Perl. He worked during the 1990s…Meet the candidate Norbert Preining About Norbert Preining has been involved in the Open Source movement for more than 30 years, contributing to and leading of a variety of projects, like TeX Live, Debian, EventYay,…Meet the candidate"
