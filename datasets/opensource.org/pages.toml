full_description = "THE open source ai definition 1.0 We have released the first stable version of the Definition. Read version 1.0 How to participate The OSAID co-design process is open to everyone interested in collaborating. There are many ways to get involved: Join the working groups: be part of a team to evaluate various models against the OSAID. Join the forum: support and comment on the documents, record your approval or concerns to new and existing threads. Follow the weekly recaps: subscribe to our newsletter and blog to be kept up-to-date. Watch the town hall recordings to learn more about the process. Join the workshops and scheduled conferences: meet the OSI and other participants at in person events around the world. Endorse the Open Source AI Definition: have your organization added to the list of supporters of the OSAID. Public Town Halls Our Executive Director, Stefano Maffulli hosted a series of public Town Halls to share process updates and have an open discussion with participants. These sessions were held between January and October 2024. Watch the recordings Oct 18Aug 23Apr 5Oct 11Jul 26Mar 22Oct 4Jun 28Mar 8Sep 27Jun 14Feb 23Sep 20May 31Feb 9Sep 13May 3Jan 26Sep 6Apr 19Jan 12, 2024"
