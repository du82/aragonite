title = "Open Standards Requirement for Software – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Open Standards Requirement for Software Page created on July 24, 2006 | Last modified on July 24, 2006 The Requirement An “open standard” must not prohibit conforming implementations in open source software. The Criteria To comply with the Open Standards Requirement, an “open standard” must satisfy the following criteria. If an “open standard” does not meet these criteria, it will be discriminating against open source developers. No Intentional Secrets: The standard MUST NOT withhold any detail necessary for interoperable implementation. As flaws are inevitable, the standard MUST define a process for fixing flaws identified during implementation and interoperability testing and to incorporate said changes into a revised version or superseding version of the standard to be released under terms that do not violate the OSR. Availability: The standard MUST be freely and publicly available (e.g., from a stable web site) under royalty-free terms at reasonable and non-discriminatory cost. Patents: All patents essential to implementation of the standard MUST: be licensed under royalty-free terms for unrestricted use, or be covered by a promise of non-assertion when practiced by open source software No Agreements: There MUST NOT be any requirement for execution of a license agreement, NDA, grant, click-through, or any other form of paperwork to deploy conforming implementations of the standard. No OSR-Incompatible Dependencies: Implementation of the standard MUST NOT require any other technology that fails to meet the criteria of this Requirement. Posted July 24, 2006"
