["https://opensource.org/press-mentions/deepseek-goes-beyond-open-weights-ai-with-plans-for-source-code-release"]
title = "DeepSeek goes beyond “open weights” AI with plans for source code release – Open Source Initiative"
description = '''It's currently unclear whether DeepSeek's planned open source release will also include the code the team used when training the model. That kind of training code is necessary to meet the Open Source Initiative's formal definition of "Open Source AI," which was finalized last year after years of study. A truly open AI also must include "sufficiently detailed information about the data used to train the system so that a skilled person can build a substantially equivalent system," according to OSI.'''
