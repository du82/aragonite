full_description = "February 21, 2025 DeepSeek goes beyond “open weights” AI with plans for source code release Ars Technica It’s currently unclear whether DeepSeek’s planned open source release will also include the code the team used when training the model. That kind of training code is necessary to meet the Open Source Initiative’s formal definition of “Open Source AI,” which was finalized last year after years of study. A truly open AI also must include “sufficiently detailed information about the data used to train the system so that a skilled person can build a substantially equivalent system,” according to OSI. August 27, 2024 Debate over “open source AI” term brings new push to formalize definition Ars Technica The Open Source Initiative (OSI) recently unveiled its latest draft definition for “open source AI,” aiming to clarify the ambiguous use of the term in the fast-moving field. The move comes as some companies like Meta release trained AI language model weights and code with usage restrictions while using the “open source” label. This has sparked intense debates among free-software advocates about what truly constitutes “open source” in the context of AI. August 25, 2023 10X coders beware: Meta’s new AI model boosts coding and debugging for free Ars Technica July 18, 2023 Meta launches Llama 2, a source-available AI model that allows commercial applications [Updated] Ars Technica"
