full_description = "Associations Page created on December 21, 2018 | Last modified on April 11, 2024 To further our mission of advocating and safeguarding open source software, its development, and communities, we partner with a diverse range of organizations, fulfilling various roles and capacities. We do this through education, collaboration, and infrastructure support, upholding the Open Source Definition (OSD), and guarding against the misuse of the open source movement’s principles. A list of our partner organizations can be found here. The CONSUL Foundation supports the CONSUL platform, a complete tool enabling citizen participation for open, transparent, and democratic government. OSI is a member of the Advisory Board of the Consul Democracy Foundation. The Digital Public Goods Alliance is a multi-stakeholder initiative that accelerates the attainment of the sustainable development goals by facilitating the discovery, development, use of, and investment in digital public goods. OSI is a member of the Alliance and participates in its AI Community of Practice. ETSI is the recognized European Standards Organization dealing with telecommunications, broadcasting, and other electronic communications networks and services. OSI is an Associate Member of ETSI. OW2 is a global open source software community, working to promote the development of middleware, generic business applications, cloud computing platforms and foster a vibrant community and business ecosystem. OSI is an Associate of OW2 and OW2 is an Affiliate of OSI."
