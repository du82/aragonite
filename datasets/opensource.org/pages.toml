full_description = "Justin Colannino Justin Colannino Director Board Member Candidacy Period: January 21, 2020 – October 31, 2025 Type of Seat: Appointed Justin has more than a decade of experience as a lawyer representing clients at the intersection of Open Source software communities and for-profit enterprises. A published computer scientist in a past life, he currently works at Microsoft running a small team that oversees legal processes to enable open source, standards, and open machine learning engagement at massive scale. Justin is an active participant in Open Source software communities. In addition to his volunteer work as a board member for the Open Source Initiative, he provides pro bono legal advice to other popular community-driven charities and regularly speaks publicly to educate developers, students, and lawyers about Open Source law and innovation."
