["https://opensource.org/ai"]
title = "The Open Source AI Definition — by The Open Source Initiative"
description = "A multi-stakeholder process to define an “Open Source AI”."
full_description = '''"LLM360 finds that OSI’s Open Source AI definition is a meaningful, reasonable, and holistic standard which will have positive reverberations throughout the community. The definition clarifies the unique challenges surrounding open source AI including the expectations for disseminating code, data, and accessibility requirements. This definition propels the open source ecosystem and aligns with LLM360’s mission for community owned AI. Our team is thrilled and excited to fully support OSI’s efforts on advancing the Open Source AI definition." Hector Zhengzhong Liu, LLM360 "Coming up with the proper open-source definition is challenging given restrictions on data, but I'm glad to see that the OSI v1.0 definition requires at least that the complete code for data processing (the primary driver of model quality) be open-source. The devil is in the details, so I'm sure we'll have more to say once we have concrete examples of people trying to apply this Definition to their models." Percy Liang, Director of Center for Research on Foundation Models, Stanford University “Facilitating an Open ecosystem is an important part of our approach at Intel. An open approach to AI can foster greater collaboration across the community, drive innovation and enhance transparency. We applaud OSI’s efforts to expand their definition to include AI models and datasets. OSI’s creation of a first revision of the definition, can help industry continue to evolve and iterate.” Arun Gupta, Vice President and General Manager, Open Ecosystem, Intel "We welcome OSI's stewardship of the complex process of defining open source AI. The Digital Public Goods Alliance secretariat will build on this foundational work as we update the DPG Standard as it relates to AI as a category of DPGs" Liv Marte Kristiansen Nordhaug, CEO of the Digital Public Goods Alliance "Transparency is at the core of EleutherAI’s non-profit mission. The Open Source AI Definition is a necessary step towards promoting the benefits of open source principles in the field of AI. We believe that this definition supports the needs of independent machine learning researchers and promotes greater transparency among the largest AI developers." Aviya Skowron, Head of Policy and Ethics at Eleuther AI'''
year_published = 2025
clearnet = "https://opensource.org/ai"
