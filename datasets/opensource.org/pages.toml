title = "Open Source AI Definition Endorsements – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = '''Endorser organizations These organizations endorse the Open Source AI Definition. Add your name to the list. Add your name to the list Thank you for your interest in endorsing the OSAID. Being an endorser means your name and organizational affiliation will be appended to list of supporters of Version 1.0 of the Open Source AI Definition. Please leave this field empty. Your name Your email Your institution Your role Endorsement type IndividualInstitutionalBoth Your message (optional) This form uses Akismet to reduce spam. Learn how your data is processed. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Statements of support Aaron HarperIssyroo FarmsAbdelghani AchahoudInnovation for Change - Middle East & North AfricaAkshay JainHindalco Industries Ltd."I am working within the organisation to create AI which integrates with machines and man from a manufacturing stand points . Having Open source definitions in Manufacturing is of utmost important from the point of worker safety and protections as workers within our org takes decisions based on how AI functions. Open source AI help my team develope and explain model behaviour to end workers and this in turn , based on worker feedbacks our models improve. I want to sponsor and be a part of this initiative so that I can passionately advocate openess to AI algorithms and model behaviour to make manufacturing safer for workers."Alan ClarkSUSE"SUSE applauds the progress made by the Open Source Initiative and its Open Source AI Definition. The efforts are culminating in a very thorough definition, which is important for the quickly evolving AI landscape and the role of open source within it. We commend the process OSI is utilizing to arrive at the definition and the adherence to the open source methodologies. Clarity and consensus drive collaboration, and we believe this definition will drive open source AI forward."Alessandro de Oliveira FariaOpenSUSEAlex Gastone MkwizuSEEDE Group ( XR )"I am a firm believer in building sustainable open-source projects that solve problems and are tailored to the local context, giving them the power to scale and create a global impact. I champion the concept of innovating locally and globally at the same time."Alexander WiechertElastic2lsAlexandros MelidisOpen Technologies Alliance - GFOSSAlyssa WrightBloomberg"Bloomberg supports the Open Source Initiative’s initial efforts to begin establishing a clearer definition for open source AI. This timely initiative is crucial as we and others navigate the rapid evolution of artificial intelligence models and increasing pace of adoption of this technology across enterprises. As an open source-first company, we hope that a common framework and definition for open source AI systems, data, code, models and weights will help foster more collaboration, faster innovation, and increased transparency within the AI community. We look forward to working with the OSI and others in the community to shape the future of open source AI for the benefit of all."Andrea ZandaROMBO AI"This is a sensitive matter for me and my organization, as we are working on publishing an AI model for legal purposes as open source."Andres GuadamuzUniversity of SussexAnivar A AravindFoodhubAnselmo A. PerettoOPERSOL"I’m proud to support the Open Source AI Definition because it puts transparency and collaboration at the heart of AI development. Open-source principles are key to making sure AI is accessible to everyone and evolves in a way that benefits society as a whole."Anuradha WeeramanVerdentra"We applaud and fully endorse the OSI initiative for bringing definition to Open Source AI and for leading the Open Source cause at this pivotal time. As the field evolves rapidly, the network effects of collaboration within the broader technology community as a result of this framework will surely fuel further innovation and advancement."Ariel JoloNerdearla / SysarmyArmando J. ManzuetaMinistry of Public Administration of the Dominican RepublicArnaud BRANArun GuptaOpen Ecosystem, Intel"Facilitating an Open ecosystem is an important part of our approach at Intel. An open approach to AI can foster greater collaboration across the community, drive innovation and enhance transparency. We applaud OSI’s efforts to expand their definition to include AI models and datasets. OSI’s creation of a first revision of the definition, can help industry continue to evolve and iterate."Arvind NarayananPrinceton UniversityAstor Nummelin CarlbergOpenForum EuropeAudrey TangTaiwan Government"Open Source embodies the spirit of collaborative diversity that drives our digital age forward. By fostering open models and transparent practices, we can accelerate understanding of AI risks, enhance public scrutiny, and lower barriers for responsible innovation. I fully endorse the Open Source AI Definition as a vital step towards this pluralistic future."Aviya SkowronEleuther AI"Transparency is at the core of EleutherAI’s non-profit mission. The Open Source AI Definition is a necessary step towards promoting the benefits of open source principles in the field of AI. We believe that this definition supports the needs of independent machine learning researchers and promotes greater transparency among the largest AI developers."Ayah BdeirMozillaBart de WitteHIPPO AI FoundationBastien Guerrycode.gouv.fr"As a long-time Free Software advocate, I believe that the Open Source AI Definition provides a solid foundation for promoting AI systems that are easier to use, share, and improve."Camilo PintoDiego Portales UniversityCarnegie Mellon UniversityCarnegie Mellon UniversityChalermchai RodsangiamCurtis HayesCivic ActionsCyril BlaeckeDilolabsDan SidsayaMEST AfricaDaniel DavisTrustGraphDaniel KwanKismet XYZ Inc"We're a group of scientists and entrepreneurs from www.kismetxyzlabs.com who endorse this v1.0 Open Source AI definition."David LippertGeorge Washington University OSPODavid MansetInternational Telecommunications Union (ITU)Davide SbettiWürth Phoenix"I strongly believe in open source and open science. As an AI enthusiast, I have no doubt about the benefits such an approach could have to this field."Diego KuonenStatoo Consulting & University of Geneva, SwitzerlandDiomidis SpinellisAUEB & TU Delft"Clear and widely-adopted reference definitions of open-source AI, models, and weights will further the goals and benefits of the open source software, open content, and open data movements."Donald WatkinsDGW Enterprises LLCDr. Ignatius EzeaniLancaster UniversityEmily ChenKaiyuanshe"Kaiyuanshe, as the first member of OSI in China, we support RC1. My personal as individual, I also endorse of OSAID RC1."Esben KranApart ResearchFabrizio DegniENIA - Ente Nazionale per l'Intelligenza ArtificialeFang LiuGeorgia Tech UniversityFernando Eugenio CorreaMercadoLibreFrancisco L. BenítezFIDESOL (ICT Technological Centre)Francisco SerradillaUniversidad Politécnica de Madrid"In a hyper-regulated world, I believe that the open dissemination of research and models will multiply the benefits of Artificial Intelligence by allowing it to be applied to problems that its initial developers never imagined."Frank KarlitschekNextCloudGarvit KothariNeurobridge Tech"At Neurobridge, we endorse Open Source AI because it fosters transparency, innovation, and collaboration. By giving everyone the freedom to study, modify, and share AI systems, Open Source AI unlocks the full potential of this technology for society. It allows developers, deployers, and end-users alike to build upon and improve AI tools openly, ensuring they are accessible, adaptable, and accountable. We believe this approach paves the way for more inclusive, responsible, and impactful AI that benefits all."George C. G. BarbosaFundação Oswaldo CruzGeorgia Tech OSPOGeorgia Tech OSPOGerardo LisboaESOP - Associação de Empresas de Software Open Source Portuguesas"The Open Source and Free Software ecosystem is a dynamic community of diverse organizations and individuals constantly innovating and improving, and, as such, has wholeheartedly embraced the artificial intelligence (AI) movement with all its potential for good, imprecisions and ethical misgivings, just as it has done with all previous technological advances. Given the indefiniteness and abuse surrounding Ai, it was therefore necessary to reach a clear and concise agreement on the meaning of Open Source in the context of Ai. The community is very grateful to the Open Source Initiative for starting the discussion and helping create a consensus around this definition. Given the indefiniteness and abuse surrounding Ai, it was therefore necessary to reach a clear and concise agreement on the meaning of Open Source in the context of AI. The community is very grateful to the Open Source Initiative for starting the discussion and helping create a consensus around this definition."Gilbert BrownE4 LogicsHenry WangOpen Network"Open is committed to supporting the Open Source AI Definition (OSAID), which we believe aligns with both our values and those of the broader Open Source Community. OSAID will guide the development of AI systems that are verifiable, transparent, and reproducible—benefiting all, as Open Source Code has done since its inception. A huge thank you to everyone involved in this effort!"Ismael Carrasco"The Open AI concept must fulfill the Open source standard definition, to avoid the missleading use of the "Open" term, used by some very well known companies."Jake SalomonCircuit"At Circuit, we believe that open-source AI is fundamental to building a responsible and resilient AI ecosystem. Open access to AI research and technology promotes transparency, collaboration, and innovation by allowing organizations and individuals to audit, understand, and contribute to developments in AI. This openness aligns with our mission to empower users with all of the world's knowledge, activated to help drive wise decision making. We see open-source AI as essential to fostering diverse perspectives and empowering community-driven progress, ensuring that AI serves the needs of many rather than the few."Jean-Pierre LorreLINAGORAJoël Gombinopsci.aiJohn BoggeroITIPJonathan SchneiderModerne, Inc."The Open Source AI Definition is a pivotal step towards fostering a more transparent, collaborative, and equitable AI landscape. This definition will play a critical role in shaping the future of AI by ensuring that open source remains a cornerstone of its development. We are proud to support this initiative and its commitment to transparency, accessibility, and community-driven progress."Jörg WittkewitzFernUniversität in HagenJoseph WolffeRacks Systems"It is essential to provide an unambiguous definition by an independent expert 3rd party such as OSI, to provide a yardstick to measure against."Joshina RamakrishnanWeavez TechnologiesJuan M CasanuevaSocialTICJustin TorreHelicone AIKenza BouzoubaaNabla"At Nabla, we believe in the power of AI to transform healthcare by empowering clinicians and improving patient outcomes. The Open Source AI Definition (OSAID) is a crucial step toward ensuring transparency, flexibility, and trust in AI systems. By setting up clear requirements for system scope and allowed usages, OSI is enabling companies like ours to build responsible, adaptable and better understood tools – ultimately leading to safer, more effective healthcare solutions."Kevin HarerimanaCarnegie Mellon University AfricaKristen RatanStrategies for Open ScienceKristina PodnarNativeTrust Consulting, LLC"Since the early 1980s, open source has benefited society, business, and the consumer. By applying the same principles of open access, transparency, and collaboration to AI, we foster a future where innovation knows no limits and the benefits can be shared by all."Laura HerasmeLeandro Colombo ViñaMercado LibreLiam Esteban PrinceSopra SteriaLilly ChenFSH TechLily PolancoNew.blicio.us"The Open Source AI Definition is a crucial step towards ensuring AI systems are transparent, collaborative, and accountable to the public. By mandating the core freedoms of open source - to use, study, modify, and share AI systems - this definition lays the foundation for a future where AI is developed in the open, with the input and oversight of the broader community."Liv MarteDigital Public Goods Alliance"We welcome OSI's stewardship of the complex process of defining open source AI. The Digital Public Goods Alliance secretariat will build on this foundational work as we update the DPG Standard as it relates to AI as a category of DPGs"Luana HelsingerButwhaiLuca CerinaEindhoven University of TechnologyLuigi BellioAkera Software EngineeringMaisa Pires AmaralLerian"As a professional in Law and Compliance with a deep interest in AI, I fully support the Open Source AI Definition. I see tremendous potential in making AI accessible through open models, code, and data, fostering innovation, fair competition, and accountability. Aligning AI development with openness and transparency ensures responsible adoption and builds tr"Marco MancaSCImPULSE FoundationMark CollierOpen Infrastructure Foundation"This effort you and OSI team have been driving is really important and I’m a believer that time is becoming of the essence. Inevitably it will need to evolve but putting a stamp on it soon is important. We have to define what open source means in the context of AI models in order to preserve the permissionless innovation aspect that created so much value with open source software licenses. The definition is both pragmatic and challenging, and is an excellent first step in a fast-moving area."Martin DougiamasMoodleMasao DahlgrenCenter for Strategic and International StudiesMcKenzie Lloyd-SmithMindPort Inc."We applaud OSI's thoughtful approach to defining Open Source AI, which preserves the core freedoms of open source while addressing the unique complexities of AI systems. At MindPort, we recognize the importance of a clear, shared and agreed upon definition that promotes transparency, autonomy, and improvement. This is essential for advancing the field through meaningful research, innovation and collaboration. We believe this definition will serve as a crucial foundation for fostering an ecosystem where AI can be developed, scrutinized, and improved upon by the broader community, ultimately leading to more robust and trustworthy AI systems."Merlijn SebrechtsGhent University - imecMike MilinkovichEclipse FoundationMoise KameniHydro-QuébecNadia JiangKAIYUANSHENathan ClarkFidelity InvestmentsNguyen Hong QuangVietnam Free and Open Source Software AssociationNina ShamsiNortheastern UniversityOdyssee NdayisabaContinuity Group, LtdOscar MullinMercadoLibre"Open Source generative AI models are one of the keys to the advancement of the field. By enabling a community of developers and researchers to collaborate and evolve these models in a responsible way, we can greatly benefit a wide range of applications"Paola MasuzzoonData"onData'''
