["https://opensource.org/blog/metas-llama-license-is-still-not-open-source"]
title = "Meta’s LLaMa license is still not Open Source – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "February 18, 2025 OSI opinion Jordan Maris Meta’s LLaMa license is still not Open Source A year ago we called on Meta to stop calling Llama 2 “Open Source.” Since then, Meta has released new versions of Llama with new licensing terms that continue to fail the Open Source Definition. Llama 3.x is still not Open Source by any stretch of the imagination. Despite that, Meta keeps on falsely promoting Llama as “Open Source.” You can help us stop that now: call on Zuckerberg and Yann LeCunn to change the Llama license and comply with the Open Source Definition. There is no need to bring up the new Open Source AI Definition v.1.0 to evaluate if the Llama 3 model series and its Llama 3.x community licences convey basic freedoms to their users. We agree with the Free Software Foundation’s recent evaluation that the Llama 3.1 Community Licence agreement fails in spectacular ways at granting basic rights: Fails at freedom 0, the freedom to use the model for any purpose Fails at the Open Source Definition point 5, discriminates against users Fails at the Open Source Definition point 6, restricts fields of endeavour These restrictions were already clear in the license used by Llama 2. The newer versions of Meta’s Llama community licence impose even more restrictions, like excluding any persons in the European Union from using the model without explanation; and all of the restrictions from the previous licences remain. We are disheartened to see a couple of individuals entangling their criticisms of the Open Source AI Definition with Meta’s abuse of the term Open Source referring to Llama. The OSAID did not create any confusion about the proprietary nature of Llama; in fact, Meta’s open washing, and our response to it, predate the OSAID entirely. These individuals are supporting Meta’s open washing efforts, and sowing fear, uncertainties and doubts within the community. What you can do about it At a time when Meta is trying to redefine Open Source for their own benefit and at the expense of our freedom, we call on the whole Open Source community to unite and call out Meta’s open washing. OSI will continue to fight back against open washing with public statements, events, and educational work with the Open Source and AI communities, lawmakers, and businesses. Get ready to vote for OSI’s board of directors in 2025"
year_published = 2025
year_updated = 2025
