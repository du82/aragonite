["https://opensource.org/blog/publication/techcrunch"]
title = "TechCrunch – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "February 16, 2025 Open source LLMs hit Europe’s digital sovereignty roadmap TechCrunch In traditional software, the perennial struggle between open source and proprietary revolves around the “true” meaning of “open source.” This can be resolved by deferring to the formal “definition” as per the Open Source Initiative, the industry stewards of what are and aren’t legitimate open source licenses. More recently, the OSI has formed a definition of “open source AI” February 8, 2025 Why the ‘spirit’ of open source means much more than a license TechCrunch “The point of having definitions is to have criteria that can be scored, and focusing on licensing is how that is accomplished,” Maffulli said in a statement issued to TechCrunch. “The global community and industry have come to rely on the Open Source Definition and now the Open Source AI Definition as objective measures that they can rely on.” January 28, 2025 Hugging Face researchers are trying to build a more open version of DeepSeek’s AI ‘reasoning’ model TechCrunch Technically, R1 is “open” in that the model is permissively licensed, which means it can be deployed largely without restrictions. However, R1 isn’t “open source” by the widely accepted definition because some of the tools used to build it are shrouded in mystery. Like many high-flying AI companies, DeepSeek is loathe to reveal its secret sauce. January 12, 2025 Open source licenses: Everything you need to know TechCrunch There are two broad kinds of licenses that meet the formal open source definition as laid out by the Open Source Initiative (OSI). November 26, 2024 Ai2 releases new language models competitive with Meta’s Llama TechCrunch While there’s no shortage of “open” language models to choose from (see: Meta’s Llama), OLMo 2 meets the Open Source Initiative’s definition of open source AI, meaning the tools and data used to develop it are publicly available. The Open Source Initiative, the long-running institution aiming to define and “steward” all things open source, finalized its open source AI definition in October. But the first OLMo models, released in February, met the criterion as well."
