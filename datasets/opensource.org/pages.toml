["https://opensource.org/board"]
title = "OSI Board of Directors – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "OSI Board of Directors Page created on July 24, 2006 | Last modified on January 19, 2024 The Open Source Initiative (OSI) is managed by a member-elected board of directors that is the ultimate authority responsible for the organization as a California public benefit corporation, with 501(c)3 tax-exempt status. Current composition The ten person OSI board is composed of: Four directors elected by OSI Individual Members for two-years terms. Four directors elected by OSI Affiliate Members for three-years terms. Four directors appointed for two-years terms by the board itself. Directors who have served for five or more years may not run for the Board, until they have been off of the board for one year or more. The results of elections for both Individual and Affiliate member board seats are advisory with the OSI Board making the formal appointments to open seats based on the community’s votes. Responsibilities of OSI Board Directors The board’s responsibilities include oversight of the organization, supporting the executive director and staff. The board approves the budget, sets strategic direction and defines goals in line with the mission. OSI Directors are expected to work actively and pro-actively as a member of the board, OSI and open source community. It is understood directors are volunteers, and each will be engaged in professional and personal responsibilities outside OSI. For different reasons, related to work, college/university, family, etc. there will be periods of time where a director will be busy and/or can not commit to the demands of the board or community, either as much as one would like or as much as is needed. However, this should be the exception, not the rule. Each board member is expected to sign the Board member agreement. Back to the current board of directors page"
