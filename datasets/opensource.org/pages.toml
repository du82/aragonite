full_description = "Bylaws Page created on July 24, 2006 | Last modified on August 21, 2023 AMENDED AND RESTATED BYLAWS OF OPEN SOURCE INITIATIVE A California Nonprofit Public Benefit Corporation ARTICLE I NAME Section 1. NAME. The name of this corporation is Open Source Initiative. ARTICLE II OFFICES Section 1. PRINCIPAL OFFICE. The principal office for the transaction of the activities and affairs of the corporation (principal office) is located at 702 Marshall Street, Suite 301, Redwood City, California 94063 in San Mateo County. The board of directors may change the principal office from one location to another. Any change of location of the principal office shall be noted by the secretary on these bylaws opposite this Section, or this Section may be amended to state the new location. Section 2. OTHER OFFICES. The board may at any time establish branch or subordinate offices at any place or places where the corporation is qualified to conduct its activities. ARTICLE III PURPOSES AND LIMITATIONS Section 1. GENERAL PURPOSES. This corporation is a nonprofit public benefit corporation and is not organized for the privategain of any person. It is organized under the Nonprofit Public Benefit Corporation Law for public educational purposes. Section 2. SPECIFIC PURPOSES. Within the context of the general purposes stated above, this corporation shall: (1) educate thepublic about the advantages of open source software; (2) encourage the software community to participate in open source software development; (3) identify how software users’ objectives are best served through open source software; (4) persuade organizations and software authors to distribute source software freely they otherwise would not distribute; (5) provide resources for sharing information about open source software and licenses; (6) assist attorneys to craft open source licenses; (7) manage a program to allow use of one or more marks in association with open source software licenses; and (8) advocate for open source principles. Section 3. LIMITATIONS. This corporation shall not, except to an insubstantial degree, engage in any activities or exercise anypowers that are not in furtherance of the purposes of this corporation, and the corporation shall not carry on any other activities not permitted to be carried on (a) by a corporation exempt from federal income tax under Section 501(c)(3) of the Internal Revenue Code of 1954 or the corresponding provision of any future Unites States internal revenue law, or (b) by a corporation, contributions to which are deductible under Section 170(c)(2) of the Internal Revenue Code of 1954 or the corresponding provision of any future United States internal revenue law. No substantial part of the activities of this corporation shall consist of carrying on propaganda, or otherwise attempting to influence legislation, and this corporation shall not participate in or intervene in (including publishing or distributing statements) any political campaign on behalf of any candidate for public office. No part of the net earnings of this corporation shall inure to the benefit of any of its directors, trustees, officers, private shareholders or members, or to individuals. On the winding up and dissolution of this corporation, after paying or adequately providing for the debts, obligations, and liabilities of the corporation, the remaining assets of this corporation shall be distributed to such organization (or organizations) organized and operated exclusively for educational purposes which has established its tax-exempt status under Section 501(c)(3) of the Internal Revenue Code of 1954 (or the corresponding provision of any future Unites States internal revenue law) and which has established its tax-exempt status under Section 23701d of the California Revenue and Taxation Code (or the corresponding provision of any future California revenue and tax law). The corporation will distribute its income for each tax year at such time and in such manner as not to become subject to the tax on undistributed income imposed by Section 4942 of the Internal Revenue Code of 1954 or corresponding provisions of any later federal tax laws. The corporation will not engage in any act of self-dealing as defined in Section 4941(d) of the Internal Revenue Code of 1954, or corresponding provisions of any later federal tax laws. The corporation will not retain any excess business holdings as defined in Section 4943(c) of the Internal Revenue Code of 1954, or corresponding provisions of any later federal tax laws. The corporation will not make any investments in such manner as to subject it to tax under Section 4944 of the Internal Revenue Code of 1954, or corresponding provisions of any later federal tax laws. The corporation will not make any taxable expenditures as defined in Section 4945(d) of the Internal Revenue Code of 1954, or corresponding provisions of any later federal tax laws. ARTICLE IV MEMBERS Section 1. MEMBERSHIP. This corporation shall have no members. ARTICLE V DIRECTORS Section 1. GENERAL CORPORATE POWERS. Subject to the provisions and limitations of the California Nonprofit Public BenefitCorporation law and any other applicable laws, the corporation’s activities and affairs shall be managed, and all corporate powers shall be exercised, by or under the direction of the board. Section 2. SPECIFIC POWERS. Without prejudice to the general powers set forth in Section 1 of this Article, but subject to the same limitations, the directors shall have the power to: Appoint and remove, at the pleasure of the board, all the corporation’s officers, agents, and employees; prescribe powers and duties for them that are consistent with law, with the articles of incorporation, and with these bylaws; and fix their compensation and require from them security for faithful performance of their duties; Change the principal office or the principal business office in California from one location to another; and cause the corporation to be qualified to conduct its activities in any other state, territory, dependency, or country and conduct its activities within or outside California; Adopt and use a corporate seal; and alter the forms of the seal and certificates; Borrow money and incur indebtedness on behalf of the corporation and cause to be executed and delivered for the corporation’s purposes, in the corporate name, promissory notes, bonds, debentures, deeds of trust, mortgages, pledges, hypothecations, and other evidences of debt and securities. Section 3. AUTHORIZED NUMBER AND QUALIFICATIONS. The board of directors shall consist of at least 5 but no more than 21 directors until changed by amendment to these bylaws. The exact number of directors shall be fixed, within those limits, by a resolution adopted by the board of directors. Any member of the board, except an employee who is serving as a member of the board, who has served six consecutive years on the board will not be eligible for election to the board until one year has passed from the last day of such member’s term. Section 4. RESTRICTION ON INTERESTED PERSONS AS DIRECTORS. No more than forty-nine percent (49%) of the personsserving on the board may be interested persons. An interested person is (a) any person compensated by the corporation for services rendered to it within the previous 12 months, whether as a full-time or part-time employee, independent contractor, or otherwise, excluding any reasonable compensation paid to a director as a director; and (b) any brother, sister, ancestor, descendant, spouse, brother-in-law, sister-in-law, son-in-law, daughter-in-law, mother-in-law, or father-in-law of such person. However, any violation of the provisions of this paragraph shall not affect the validity or enforceability of any transaction entered into by the corporation. Section 5. ELECTION, DESIGNATION, AND TERM OF OFFICE. (a) Commencing with the term starting April 1, 2015, each director shall be designated by a resolution of the board as serving either a three year term or a two year term. Except as provided below, the director shall serve until a successor has been elected by the board of directors. Thereafter, each successor director shall be elected by a majority of the board of directors. Each director, including a director elected or appointed to fill a vacancy, shall hold office until expiration of the term for which elected or appointed, and until a successor has been elected and qualified. (b) In the event of a director’s elected term having expired and two or more meetings of the Board or ninety (90) calendar days (whichever is less) having passed since the expiry of the director’s term without a new director having been elected, the term of such director shall be terminated. (c) A director may be removed from the Board at any time prior to the expiry of such director’s term for any reason by a vote of two thirds of the authorized members of the Board or if less than all of the authorized members of the Board have been elected, then a quorum of the elected Board members at two meetings of the Board, the second of which shall be more than forty five (45) days after the first Board meeting and for which a vote of a majority of the authorized members of the Board if less than all of the authorized members of the Board have been elected, then a quorum of the elected Board members at such second meeting of the Board . A director may be removed from the Board at any time prior to the expiry of such director’s term for cause as defined in a resolution of the Board by a vote of two thirds of the authorized members of the Board or if less than all of the authorized members of the Board have been elected, then a quorum of the elected Board members then elected at a single meeting of the Board. Section 6. EVENTS CAUSING VACANCY. A vacancy or vacancies on the board shall exist on the occurrence of the following: (a)the death or resignation of any director, (b) the declaration by resolution of the board of a vacancy in the office of a director who has been declared of unsound mind by an order of court or convicted of a felony, or, if the corporation holds assets in charitable trust, has been found by a final order or judgment of any court to have breached a duty arising under Section 7238 of the California Corporations Code; (c) the increase of the authorized number of directors, or (d) a removal or resignation as provided in this Article. Section 7. RESIGNATIONS. Except as provided below, any director may resign by giving written notice to the chairman of the board, if any, or to the president or the secretary of the board. The resignation shall be effective when the notice is given unless it specifies a later time for the resignation to become effective. If a director’s resignation is effective at a later time, the board may elect a successor to take office when the resignation becomes effective. Section 8. FILLING VACANCIES. Vacancies on the board may be filled by a majority of the directors then in office, whether or not less than a quorum, or by a sole remaining director. Section 9. NO VACANCY ON REDUCTION OF NUMBER OF DIRECTORS. No reduction of the authorized number of directors shall have the effect of removing any director before that director’s term of office expires. Section 10. PLACE OF DIRECTORS’ MEETINGS. Meetings of the board shall be held at any place within or outside California that has been designated by resolution of the board or in the notice of the meeting or, if not so designated, at the principal office of the corporation. Section 11. DIRECTORS’ MEETINGS BY TELEPHONE OR OTHER ELECTRONIC MEANS OF COMMUNICATION. Any meeting may be held by conference telephone or by other electronic means of communication, as long as all directors participating in the meeting can hear one another or read what each other is saying. All such directors shall be deemed to be present in person at such a meeting. Section 12. INITIAL DIRECTORS’ MEETING. The board shall hold a regular meeting for purposes of organization, election of officers, and the transaction of other business. Notice of this meeting is not required. Section 13. OTHER REGULAR MEETINGS. Other regular meetings of the board may be held without notice at such time and place as the board may fix from time to time. Section 14. AUTHORITY TO CALL SPECIAL MEETINGS. Special meetings of the board for any purpose may be called at any time by the chairman of the board, if any, the president or any vice president, or the secretary or any two directors. Section 15. MANNER OF GIVING NOTICE OF SPECIAL MEETINGS. Notice of the time and place of special meetings shall be given to each director by one of the following methods: (a) by personal delivery of written notice; (b) by first-class mail, postage prepaid; (c) by telephone, either directly to the director or to a person at the director’s office who would reasonably be expected to communicate that notice promptly to the director; (d) by telegram, charges prepaid; or (e) by electronic mail. All such notices shall be given or sent to the director’s address, telephone number, or electronic mail address as shown on the records of the corporation. Section 16. TIME REQUIREMENTS FOR NOTICES OF SPECIAL MEETINGS. Notices of special meetings sent by first-class mail shall be deposited in the United States mails at least four days before the time set for the meeting. Notices given by personal delivery, telephone, telegraph or electronic mail shall be delivered, telephoned, given to the telegraph company, or transmitted by electronic mail at least 48 hours before the time set for the meeting. Section 17. CONTENTS OF NOTICES OF SPECIAL MEETINGS. The notice of a special meeting shall state the time of the meeting, and the place if the place is other than the principal office of the corporation. It need not specify the purpose of the meeting. Section 18. QUORUM FOR DIRECTORS’ MEETINGS. Four directors shall constitute a quorum for the transaction of business, except to adjourn; provided however if less than all of the authorized directors have been elected, no less than one fifth of the authorized number of directors or two (2) whichever is greater. Every action taken or decision made by a majority of the directors present at a duly held meeting at which a quorum is present shall be the act of the board, subject to the more stringent provisions of the California Nonprofit Public Benefit Corporation Law, including, without limitation, those provisions relating to (a) approval of contracts or transactions between the corporation and one or more directors or between the corporation and any entity in which a director has a material financial interest, (b) creation of and appointments to committees of the board, and (c) indemnification of directors. A meeting at which a quorum is initially present may continue to transact business, despite the withdrawal of directors, if any action taken or decision made is approved by at least a"
