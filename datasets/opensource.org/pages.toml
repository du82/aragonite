["https://opensource.org/history"]
title = "History of the OSI – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "History of the OSI Page created on September 19, 2006 | Last modified on September 19, 2006 Development based on the sharing and collaborative improvement of software source code has a history essentially as long as software development itself. In the late 1990s, interest and participation in this phenomenon increased markedly with mainstream recognition of Linux in publications like Forbes and the release of the Netscape browser’s source code. OSI was formed in 1998 as an educational, advocacy, and stewardship organization at this important moment in the history of collaborative development. Coining “Open Source” The “open source” label was created at a strategy session held on February 3rd, 1998 in Palo Alto, California, shortly after the announcement of the release of the Netscape source code. The strategy session grew from a realization that the attention around the Netscape announcement had created an opportunity to educate and advocate for the superiority of an open development process. The conferees believed the pragmatic, business-case grounds that had motivated Netscape to release their code illustrated a valuable way to engage with potential software users and developers, and convince them to create and improve source code by participating in an engaged community. The conferees also believed that it would be useful to have a single label that identified this approach and distinguished it from the philosophically- and politically-focused label “free software.” Brainstorming for this new label eventually converged on the term “open source”, originally suggested by Christine Peterson. Two of those present at the Palo Alto meeting (Eric Raymond and Michael Tiemann) would later serve as presidents of OSI, and other attendees (including Todd Andersen, Jon “maddog” Hall, Larry Augustin, and Sam Ockman) became key early supporters of the organization. Adoption of the term was swift, with early support from figures in the community, like Linus Torvalds, and from an April 1998 Free Software Summit attended by many key individuals, including the founding figures of sendmail, Perl, Python, Apache, and representatives from the IETF and Internet Software Consortium. Founding The Organization OSI was jointly founded by Eric Raymond and Bruce Perens in late February 1998, with Raymond as its first president, Perens as vice-president, and an initial Board of Directors including Brian Behlendorf, Ian Murdock, Russ Nelson, and Chip Salzenberg. OSI was conceived as a general educational and advocacy organization to execute the same mission agreed on at the Free Software Summit held in April 1998. At the launch meeting, the original Board accepted this general mission and decided to focus specifically on explaining and protecting the “open source” label. Some early activism was done as well, with OSI supporting a petition to encourage the US government to use open source software in Jan. of 1999. Assessing Licenses One of the first tasks undertaken by OSI was to draft the Open Source Definition (OSD), and use it to begin creating a list of OSI-approved licenses. The Open Source Definition was originally derived from the Debian Free Software Guidelines (DFSG). Bruce Perens had composed the original draft of the DFSG, and it was edited, refined, and approved as formal policy by the Debian developer community in 1997. The Open Source Definition was then created during the launch of the OSI in Feb. 1998 by revising the DFSG and removing Debian-specific references. By Oct. 1999, OSI had published its first formal list of approved licenses. The OSI license list, updated many times since then, has remained the canonical list of open source licenses and is referred to by many third parties, including governments and standards bodies. In 2004 the OSI added clause 10 to the OSD to deal with some issues surrounding click-wrap licensing. Otherwise the OSD has been stable since its inception, with only minor wording clarifications in other clauses. Also in 2004, due to a marked increase in the number of open source licenses, OSI launched a campaign to reduce the growth in the number of open source licenses. This resulted in the 2006 publication of a License Proliferation report, and recategorization of the license list into groupings of licenses based on usage as well as content. OSI’s report and process helped bring wider awareness to the overall problem of license proliferation and reduce the creation and use of new licenses. Other Advocacy The original Board’s most notable success was to successfully position the OSD as the gold standard of open-source licensing, and the OSI as a standards body trusted both by the developer community and the worlds of business and government. That design was largely achieved by the end of the 1990s, and OSI has since focused on becoming one of the free and open source developer community’s two principal advocacy organizations, along with the Free Software Foundation. Much of OSI’s advocacy takes the form of quiet persuasion rather than public activism – offering background to reporters, policy suggestions to politicians, and business cases to executives. OSI’s hard-earned reputation for pragmatism and accessibility has helped it cope with threats to the community’s interests before they reached the point of becoming visible crises. For example, along with Creative Commons, Software Freedom Law Center, and others, OSI helped file an amicus curiae brief supporting Open Source licensing in the important Jacobsen v. Katzer lawsuit. It also worked with the Free Software Foundation to convince antitrust entities to require open source-friendly licensing of the CPTN patents. OSI’s advocacy has also taken other forms, such as creating the Open Standards Requirements for Software in 2006 and working to push governments to refer to them when doing their own open standards work. Building The Organization The goal of the original Board was to build a sustainable institution to represent the open-source community and exercise stewardship of the Open Source Definition. To this end it adopted bylaws (most recently revised in 2011), achieved IRS recognition as a 501(c)3 nonprofit (in 2003), and set out trademark guidelines. Having worked steadily to broaden its base, OSI became a truly international organization in 2005 with the accession of directors from Europe, South America, Japan, and India. It further deepened its ties to the community in 2011 and 2012, by initiating an affiliates program, electing directors nominated by those affiliates, and launching an individual membership program. The OSI’s “Keyhole Logo” The OSI logo, which combines the “O” of open and a keyhole, for unlocking source code, was created by Colin Viebrock. Further Reading on Open Source History Wikipedia’s Open Source Initiative page. OSI co-founder Eric Raymond’s Cathedral and the Bazaar. This paper, describing key differences between traditional development models and the decentralized model typical of open source, was published around the time of the Netscape source code release and remains widely read and influential. Steven Levy’s Hackers and John Markoff’s What the Dormouse Said. Both books cover the historical and cultural roots of software development, particularly the early days when status was earned in part by sharing source code. “Open Sources: Voices from the Open Source Revolution”. Written shortly after the founding of OSI, this book has contributions from many people involved in the early history of open source and related movements. Linux Weekly News’ annual timelines, starting with the first timeline in 1998. LWN was founded in the same year as OSI, and its annual timelines have often mentioned OSI. Sociologist Christopher Kelty’s Two Bits. Available to read online under a Creative Commons license, this book covers the early history of Free and Open Source software from a more academic perspective. Last revised Oct. 2018."
