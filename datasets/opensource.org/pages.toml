["https://opensource.org/affiliates/about"]
title = "Become an OSI Affiliate – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Become an OSI Affiliate Page created on May 22, 2012 | Last modified on April 19, 2024 What is an OSI Affiliate organization? The OSI Affiliates are organizations committed to public support for open source software and the role OSI plays therein. The current Affiliate membership is a whos-who of the world of open source software. How does my organization become an OSI Affiliate? Thanks for asking! Please review the Affiliate Agreement: if your organization meets the requirements, simply send us an email introducing your organization, and why you’re interested in joining the OSI via our contact form. We will follow up with more information on how to submit your signed application and how we can verify your organization is eligible. If you have any questions, please feel free to get in touch. Why Affiliates? The OSI has transitioned from its original governance model of volunteer and self-appointed directors to one driven by our membership. Our high-level objectives in doing so are to provide a broad meeting place communities of all kinds which depend upon and implement the mission of OSI, with the continuing aim of stewarding the license list and the Open Source Definition safely beyond undue influence by special interests, and in the longer term, of creating serendipity among communities so software freedom flows and grows. Who can join? OSI Affiliates include government-recognized non-profit charitable and not-for-profit industry associations, academic institutions (K12 & higher education) and user groups and communities, anywhere in the world. Why should we join? The OSI has reached a significant milestone in its history. As well as the benefit of associating your organization with OSI, your affiliation allows your organization to participate in the process of defining the future means by which OSI achieves its mission, both by joining in discussions about proposed changes and policies and by guiding the selection of members of its Board of Directors. What is the commitment? As an OSI Affiliate, your organization’s commitment would be: To express public support for open source and for the OSI To appoint a delegate to act on behalf of their group in OSI business and give direction to that delegate. While delegates will be welcome to also participate in working groups, we anticipate this delegated role involving a minimal time commitment by default. To make annual contributions towards the running of OSI where possible. How can Affiliates become more involved with OSI? In addition to its long-standing role as the standard-bearer for OSI Approved licenses, the OSI has established roles in education and open source advocacy. Replicating the success of the volunteer groups which have evaluated proposed open source licenses over the years, each new activity is supported by a volunteer group. A growing role for OSI as a coordination point for education and a meeting point for advocates for open source principles also represents opportunities for greater and more diverse participation in OSI-related activities. What about me? I don’t represent any of these organizations. A program for individual open source advocates has been established. Please see our members page for more information. I need more information before we can make a decision. OK, that’s reasonable. Please contact us so we can help you. How does my organization sign up? Thanks for asking! Please review the Affiliate Agreement: if your organization meets the requirements, simply send us an email introducing your organization, and why you’re interested in joining the OSI via our contact form. We will follow up with more information on how to submit your signed application and how we can verify your organization is eligible. If you have any questions, please feel free to get in touch."
