title = "Open source LLMs hit Europe’s digital sovereignty roadmap – Open Source Initiative"
description = "In traditional software, the perennial struggle between open source and proprietary revolves around the “true” meaning of “open source.” This can be resolved by deferring to the formal “definition” as per the Open Source Initiative, the industry stewards of what are and aren’t legitimate open source licenses. More recently, the OSI has formed a definition of “open source AI”"
