["https://opensource.org/board-member/sayeed-choudhury"]
title = "Sayeed Choudhury – Open Source Initiative"
description = "Sayeed Choudhury is the Associate Dean for Digital Infrastructure and Director of the Open Source Programs Office (OSPO) at Carnegie Mellon Libraries. He is the Director of a Alfred P. Sloan Foundation grant for coordination of University OSPOs and a Co-Investigator for the Black Beyond Data Project. He is the Software Task Force Leader and member of the Steering Committee for the Research Data Alliance (RDA) - US."
full_description = "Sayeed Choudhury Sayeed Choudhury Vice Secretary Board Member Candidacy Period: January 18, 2024 – October 1, 2027 Type of Seat: Appointed Sayeed Choudhury is the Associate Dean for Digital Infrastructure and Director of the Open Source Programs Office (OSPO) at Carnegie Mellon Libraries. He is the Director of a Alfred P. Sloan Foundation grant for coordination of University OSPOs and a Co-Investigator for the Black Beyond Data Project. He is the Software Task Force Leader and member of the Steering Committee for the Research Data Alliance (RDA) – US. Choudhury was a President Obama appointee to the National Museum and Library Services Board. He was a member of the National Academies Committee on Forecasting Costs for Preserving, Archiving, and Promoting Access to Biomedical Data and a member of the National Academies Board on Research Data and Information. He was also a member of the Blue Ribbon Task Force on Sustainable Digital Preservation and Access. He has testified for the Research Subcommittee of the Congressional Committee on Science, Space and Technology. He was a member of the board of the National Information Standards Organization, OpenAIRE2020, DuraSpace, the ICPSR Council, Digital Library Federation advisory committee, Library of Congress’ National Digital Stewardship Alliance Coordinating Committee, Federation of Earth Scientists Information Partnership (ESIP) Executive Committee and the Project MUSE Advisory Board. Choudhury was a member of the ECAR Data Curation Working Group. He has been a Senior Presidential Fellow with the Council on Library and Information Resources, a Lecturer in the Department of Computer Science at Johns Hopkins and a Research Fellow at the Graduate School of Library and Information Science at the University of Illinois at Urbana-Champaign. He is the recipient of the 2012 OCLC/LITA Kilgour Award. Choudhury has served as principal investigator for projects funded through the National Science Foundation, Institute of Museum and Library Services, Library of Congress’ NDIIPP, Alfred P. Sloan Foundation, Andrew W. Mellon Foundation, Open Society Foundation, Microsoft Research, and a Maryland based venture capital group. Choudhury has published articles in journals such as the International Journal of Digital Curation, D-Lib, the Journal of Digital Information, First Monday, and Library Trends and presented at various open-source events hosted by the United Nations, Open Forum Europe, Open Ireland Network, and the Linux Foundation. Previously, he was Associate Dean for Digital Infrastructure, Applications, and Services and Hodson Director of the Digital Research and Curation Center at the Sheridan Libraries of Johns Hopkins University (JHU), where he led the JHU Library team that supported the Covid-19 dashboard and launched the JHU’s open source programs office (OSPO), the first of its kind within a US university."
year_published = 2024
year_updated = 2024
