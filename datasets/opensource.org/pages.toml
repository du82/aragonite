["https://opensource.org/authority"]
title = "International Authority & Recognition – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "International Authority & Recognition Page created on April 21, 2015 | Last modified on September 7, 2022 The Open Source Initiative (OSI), Open Source Definition (OSD) and OSI Approved Open Source Licenses are internationally recognized, and affirmed by the world’s leading open source software projects and companies. Many governments, international non-profit organizations, multi-national corporations and global open source communities rely on the OSI, the OSD, and OSI Approved Open Source Licenses for identifying computer software as “Open Source Software.” The authority of the Open Source Initiative, the recognition of the Open Source Definition, and the acceptance of the License-Review Process, which together yield approved Open Source Software licences, is the standard for identifing Open Source Software, development communities, and distribution models, and is affirmed through the support of OSI Affiliate Members (international non-profits, open source projects and foundations), acknowledgement by OSI sponsors, and referenced by government policy and practice. The (partial but growing) index below serves as a resource for organizations, seeking references from government authorities as precedence for adopting existing internationally recognized standards and or, establishing the authority of the Open Source Initiative, the Open Source Definition and/or OSI Approved Open Source Licenses. You can contribute to this body of knowledge by contacting us with details. References to the OSI by Nation Australia Government Australian Commonwealth Australian Capital Territory New South Wales Queensland South Australia Business Atlassian Canada Government Federal Government Netherlands Education Academic Journals People’s Republic of China Government Hong Kong Republic of China (Taiwan) Government Sweden Education United Kingdom Education Government United States of America Education Foundations Government Federal Government California Florida Hawaii Massachusetts Michigan Nevada New York Oregon Texas Virginia Washington U.S. Press Australia Government Australian Commonwealth A Guide to Open Source Software for Australian Government Agencies Department of Finance and Administration, Australian Government Information Management Office June, 2011 The Open Source Initiative (OSI), an organisation established to promote open source software, has developed an Open Source Definition (OSD) as follows… (Pg. 4) Keep this list up to date in the agency’s source repository, and use the Open Source Initiative and Free Software Foundation websites to verify compatibility between licences. (Pg. 38) The Free Software Foundation is emphatic that it does, while the Open Source Initiative thinks the situation is unclear. (Pg. 40) For example, in the absence of a clear judicial ruling to the contrary, it would be unwise to adopt a practice in opposition to advice given from the Free Software Foundation or the Open Source Initiative. (Pg. 40) A list of open source licences managed by the Open Source Initiative is available at http://www.opensource.org/licenses. (Pg. 47) Open Source Initiative (OSI): A not-for-profit corporation formed to educate about and advocate for the benefits of open source software and to build bridges among different constituencies in the open source community. It also provides licences for open source software.Source: http://www.opensource.org (Pg. 55) With the exception of the Commonwealth Coat of Arms and material sourced from the Open Source Initiative, the material sourced from the book titled The Open Source Alternative: Understanding Risks and Leveraging Opportunities by Heather Meeker, the material sourced from the Free Software Foundation and where otherwise noted, all material presented in this document is provided under a Creative Commons Attribution 3.0 Australia (http://creativecommons.org/licenses/by/3.0/au/) licence. (Pg. ii) A Guide to Open Source Software for Australian Government Agencies Department of Finance and Administration, Australian Government Information Management Office April, 2005 At present, the primary arbiter of what constitutes open source software is the Open Source Initiative. (Pg. 9) While many in the open source industry would prefer to restrict further fragmentation in licensing, there is no mechanism to prevent new licences being added to the list maintained by the Open Source Initiative. (Pg. 40) All licences certified by the Open Source Initiative (OSI) as compliant with the Open Source Definition share important characteristics. (Pg. 41) For a full list of OSS licences, see the Open Source Initiative website: www.opensource.org (Pg. 44) Australian Government Intellectual Property Manual Attorney General’s Department, Commonwealth of Australia 2012 Standard Creative Commons licences are not designed for use with software. However, there are a number of alternative standard, open content licences that are specifically designed for use with software. Creative Commons recommends considering licences made available by the Free Software Foundation (http://www.fsf.org/) or the Open Source Initiative (http://www.opensource.org/). Agencies are encouraged to seek expert advice if they are considering publically releasing software and/or underlying code. (Pg. 90 ) Creative Commons licences do not contain terms relating to the use of source or object codes. There are other open content licences specifically designed for software, these would be considered if the Commonwealth owns copyright in the software and the author agency determines that providing open access to the underlying code is appropriate. See for example the licences available through the Free Software Foundation http://www.fsf.org/ and the Open Source Initiative http://www.opensource.org/ (Pg. 185 ) Guidelines on Licensing Public Sector Information for Australian Government Agencies Attorney General’s Department, Commonwealth of Australia 2012 See for example the licenses available through the Free Software Foundation (http://www.fsf.org/) and the Open Source Initiative (http://www.opensource.org/) Intellectual Property Management Guide for Cooperative Research Centres CRC Branch of the Department of Industry, Innovation, Science, Research and Tertiary Education, Commonwealth of Australia June 2012 Open Source Initiative: Open source licences for software and other copyright material (including a directory of licences such as the GNU General Public Licence) http://www.opensource.org (Pg. 37) “Joint Standing Committee on Electoral Matters 2014 Submission” JSCEM Request for Submissions, Parliament of Australia, Commonwealth of Australia 2014 Eric Raymond, president of the Open Source Initiative, says open-sourcing the code could eliminate obvious errors and insider tricks. (Pg. 16) “Open Source Software” AUSGEO News, Geoscience Australia September, 2004 Further reading…Open Source Initiative: www.opensource.org SourceIT User Notes, Specific Clauses: Licence Contract – Commercial off-the-shelf Software Department of Finance and Administration, Australian Government Information Management Office December 2012 Open source software is computer software which is defined by several specific attributes that relate to its licensing and legal framework. For guidance on what constitutes open source software, refer to the Open Source Initiative. The Initiative sets out various rights and obligations for developers, distributors and users of open source software. These rules define the basic licence conditions under which software must be released to be considered ‘open source’. (Pg. 13) Capital Territory Government Procurement (Principles) Guideline 2002 DI2002-58 Australian Capital Territory 2004 In this section…Open Source Definition means the document of that name published by the Open Source Initiative… (Pg. 8) Open Source Initiative means the non-profit incorporated organisation of that name dedicated to managing and promoting the Open Source Definition for the good of the community. (Pg. 8) Government Procurement (Principles) Guideline Amendment Act 2003 (A2003-63) Australian Capital Territory 2003 In this section…Open Source Definition means the document of that name published by the Open Source Initiative… (Pg. 3) Open Source Initiative means the non-profit incorporated organisation of that name dedicated to managing and promoting the open source definition for the good of the community. (Pg. 3) Legislative Assembly for the ACT: 2003 Week 14 Hansard 10 December 2003 Open Source Initiative means the non-profit incorporated organisation of that name dedicated to managing and promoting the open source definition for the good of the community. (Pg. 5205) MINUTES OF PROCEEDINGS LEGISLATIVE ASSEMBLY FOR THE AUSTRALIAN CAPITAL TERRITORY 10 December 2003 Open Source Definition means the document of that name published by the Open Source Initiative, as in force from time to time (Pg. 1074) Open Source Initiative means the non-profit incorporated organisation of that name dedicated to managing and promoting the open source definition for the good of the community. (Pg. 1074) New South Wales The Geoscientific Data Warehouse Geological Survey of New South Wales, Quarterly Notes, New South Wales Department of Trade and Investment, Regional Infrastructure and Services August 2013 According to the Open Source Initiative ‘open source’ means more than access to the source code. The distribution terms of the software ideally should comply with ten criteria that are listed by the Open Source Initiative (http://opensource.org/osd-annotated). (Pg. 5) Open Source Initiative a non-profit corporation dedicated to promoting open source software. (Pg. 20) Queensland Open Source Software Policy Queensland Department of Public Works, Queensland Government Chief Information Office 31 October 2009 This QGEA Policy states the Queensland Government’s direction in regards to Open Source Software (OSS), as defined by the Open Source Initiative (OSI) South Australia Open source software suitable for use in Australian and New Zealand schools Department of Education and Children’s Services South Australia June 2004 Abbreviations OSI: Open Source Initiative (Pg. 3) The most common ‘copyleft’ open source software licences are Open Source Initiative (OSI) compatible licences such as the GNU GPL and the most common ‘non-copyleft licence is the Berkeley Software Distribution (BSD) licence (Pg. 10) The Open Source Initiative (OSI) credentials open source software licences that can then use the phrase: ‘Certified Open Source Software’ to accompany their software (Pg. 10) Open Source and the LG System Inc. Offerings Local Government Association of South Australia 2006 The Open Source Initiative (OSI) was formed in February 1998 by Eric S. Raymond and Bruce Perens. (Pg. 5) Prominent projects and organizations…The Open Source Initiative (Pg. 11) Business Atlassian Open Source Project License Request Atlassian Pty Ltd, 2018 Atlassian supports and believes in the Open Source movement…Atlassian software is free for any Open Source project to use. Your open source project must meet the following criteria to be approved: The project is licensed under a license approved by the Open Source Initiative. Atlassian Blog, Status page open source vs. paid guide By Blake Thorne, Atlassian Pty Ltd, June 28, 2018 For more on supporting open source projects, check out the Open Source Initiative. Canada Government Federal Government Unmanned Ground Vehicle Software Development Environment Defense Research & Development Canada Published: 2004 Accessed: August, 2018 The Open Source Model: The open source model has numerous advantages over the consumer and industrial models, but before expanding on these advantages it is first necessary to define the open source model. Open Source Definition: The Open Source Initiative (OSI) is a non-profit corporation dedicated to managing and promoting open source software. They define open source as having the following attributes: 1. Free redistribution, 2. Source code, 3. Derived works, 4. Integrity of the author’s source code, 5. No discrimination against persons or groups, 6. No discrimination against fields of endeavor, 7. Distribution of license, 8. The license must not be specific to a product, 9. The license must not restrict other software, and 10. The license must be technology neutral. A detailed explanation of the significance of each of the attributes can be found on the Open Source Initiative website. Free and Open Source Software Licensing Primer Natural Resources Canada Published: 2012 Accessed: August, 2018 The Free Software Foundation (FSF) and the Open Source Initiative (OSI) publish the two most widely accepted definitions of free and open source software. The OSI’s ‘Open Source Definition‘ describes ten criteria for open source software. Where an open source license meets these criteria, it becomes ‘OSI Approved’. Restrictive (non-FOSS) licenses can also create incompatibilities… because the non-commercial requirement complies with neither the Free Software Foundation’s definition of Free Software, nor the Open Source Initiative’s definition of Open Source Software. Free and Open Source Software Licensing Primer Natural Resources Canada Published: 2012 Accessed: August, 2018 Appendix 1, Glossary: ‘Open Source Software’ (OSS) – Software released under a license that grants everyone broad rights to freely run the software, modify it, and redistribute it. Under the definition set out by the Open Source Initiative (OSI), a license must meet ten criteria relating to these rights in order to meet the definition of open source; however, the term is often used more broadly and is commonly used interchangeably with the term free software. Accessibility Procurement Pilot: Call for Proposals (CFP) Public Works and Government Services Canada Published: 2018 Accessed: August, 2018 Public Works and Government Services Canada offers the following information: Proprietary solutions will not be accepted… As per article 4.6 of the Call for Proposals, “Solutions developed (not pre-existing) for either challenge must be licensed under the MIT License. Where Bidders are leveraging existing open source projects, adopting the parent license of the open source software project is acceptable, where the license is approved by the Open Source Initiative. A list of approved licenses is available at the Open Source Initiative’s web page.” The Netherlands Education Academic Journals Software Impacts Elsevier B.V. 2019 Accessed: June, 2016 The software must adhere to a recognized legal license, such as OSI-approved licenses. People’s Republic of China Government People’s Republic of China A Game Between Freedom and Rights for the Software Field National People’s Congress Published: 2005 Accessed: June, 2016 Open source software is a branch of free software. It is an idea about software development and spread put forward for business software developers to keep a f"
