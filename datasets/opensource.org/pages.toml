full_description = "OSAID Timeline Deep Dive: AI Podcasts 2022 Welcome to Deep Dive: AI (Stefano Maffulli – July, 2022) Copyright, selfie monkeys, the hand of God (Pamela Chestek – Aug 16, 2022) Solving for AI’s black box problem (Alek Tarkowski – Aug 23, 2022) When hackers take on AI: Sci-fi – or the future? (Connor Leahy – Aug 30, 2022) Building creative restrictions to curb AI abuse (David Gray Widder – Sep 6, 2022) Why Debian won’t distribute AI models any time soon (Mo Zhou – Sep 13, 2022) How to secure AI systems (Bruce Draper – Feb 9, 2023) Deep Dive: AI Panels 2022 Exploring the business side of AI (Astor Nummelin Carlberg, David Kanter, Sal Kimmich, Stella Biderman, Alek Tarkowski – October 11, 2022) Exploring the society side of AI (Kat Walsh, Luis Villa, Carlos Muñoz Ferrandis, Kit Walsh – October 13, 2022) Exploring the legal side of AI (Pamela Chestek, Jennifer Lee, Danish Contractor, Adrin Jalali – October 18, 2022) Exploring the academia side of AI (Chris Albon, Ibrahim Haddad, Mark Surman, Amy Heineike – October 20, 2022) Deep Dive: AI Webinars 2023 Deep Dive: AI Webinar Series (September, 2023) The Turing Way Fireside Chat: Who is building Open Source AI? (Jennifer Ding, Arielle Bennett, Anne Steele, Kirstie Whitaker, Marzieh Fadaee, Abinaya Mahendiran, David Gray Widder, Mophat Okinyi) Operationalising the SAFE-D principles for Open Source AI (Kirstie Whitaker, David Leslie, Victoria Kwan) Commons-based data governance (Alek Tarkowski, Zuzanna Warso) Preempting the Risks of Generative AI: Responsible Best Practices for Open-Source AI Initiatives (Monica Lopez) Data privacy in AI (Michael Meehan) Perspectives on Open Source Regulation in the upcoming EU AI Act (Katharina Koerner) Data Cooperatives and Open Source AI (Tarunima Prabhakar, Siddharth Manohar) Fairness & Responsibility in LLM-based Recommendation Systems: Ensuring Ethical Use of AI Technology (Rohan Singh Rajput) Challenges welcoming AI in openly-developed open source projects (Thierry Carrez, Davanum Srinivas, Diane Mueller) Opening up ChatGPT: a case study in operationalizing openness in AI (Andreas Liesenfeld, Mark Dingemanse) Open source AI between enablement, transparency and reproducibility (Ivo Emanuilov, Jutta Suksi) Federated Learning: A Paradigm Shift for Secure and Private Data Analysis (Dimitris Stripelis) Should OpenRAIL licenses be considered OS AI Licenses? (Daniel McDuff, Danish Contractor, Luis Villa, Jenny Lee) Copyright — Right Answer for Open Source Code, Wrong Answer for Open Source AI? (McCoy Smith) Should we use open source licenses for ML/AI models? (Mary Hardy) Covering your bases with IP Indemnity (Justin Dorfman, Tammy Zhu, Samantha Mandell) The Ideology of FOSS and AI: What “Open” means to platforms and black box systems (Mike Nolan) OSAID Conferences and Meetings 2023/2024 June, 2023 First OSAID Meeting (Jun. 2023 – San Francisco) Towards a definition of “Open Artificial Intelligence” (OSI Board members, Mozilla Foundation, Creative Commons, Wikimedia Foundation, Internet Archive, Linux Foundation Europe, OSS Capital) July, 2023 FOSSY (Jul. 13-15, 2023 – Portland) Workshop – Defining Open Source AI (Stefano Maffulli) Campus Party Brazil (Jul. 25-29, 2023 – Sao Paulo) The future of Artificial Intelligence: Sovereignty and Privacy with Open Source (Nick Vidal, Aline Deparis) Open Source Congress (Jul. 27-28, 2023 – Geneva) Panel: Does AI Change Everything? What is Open? Liability, Ethics, Values? (Stefano Maffulli, Joanna Lee, Satya Mallick, Mohamed Nanabhay, Ibrahim Haddad) Defining “Open” AI/ML (Stefano Maffulli) September, 2023 Open Source Summit Europe (Sept. 19-21, 2023 – Bilbao) Panel Discussion: Why Open Source AI Matters: The EU Community & Policy Perspective (Justin Colannino; Astor Nummelin Carlberg; Ibrahim Haddad; Sachiko Muto; Stefano Maffulli) Interview: The New Stack (Stefano Maffulli, Alex Williams) Interview: TFiR (Stefano Maffulli, Swapnil Bhartiya) Nerdearla (Sept. 26-30, 2023 – Buenos Aires) Celebratin