["https://opensource.org/trademark"]
title = "OSI Trademark Guidelines – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "OSI Trademark Guidelines Page created on July 21, 2009 | Last modified on May 22, 2024 Table of Contents Open Source Initiative Trademark Policy Usage That Does Not Require Written Permission Noncommercial and community web sites Business web sites Promotional events Publications Usage that Require Prior Written Approval Distributing software under a license approved by OSI (“OSI Approved License”) Software distributed solely under OSI Approved Licenses Software distributed under OSI Approved Licenses and software not licensed under OSI Approved Licenses separately on same physical medium Software distributed under OSI Approved Licenses and software not licensed under OSI Approved Licenses separately on same website Domain names Non-software goods Unapproved Use Proper Trademark Use Trademark Usage Guidelines Logo Usage Guidelines Download OSI logos and marks (different sizes and formats) You can also download this document as PDF and ODT. 1. Open Source Initiative Trademark Policy OSI, Open Source Initiative, and OSI logo (“OSI Logo”), either separately or in combination, are hereinafter referred to as “OSI Trademarks” and are trademarks of the Open Source Initiative. Except as provided in these guidelines, you may not use the OSI Trademarks or any confusingly similar mark as a trademark for your product, or use the OSI Trademarks in any other manner that might cause confusion in the marketplace, including but not limited to in advertising, on websites, or on software. OSI protects the OSI Trademarks on behalf of the entire open source community. In fact, the law obligates trademark owners to police their marks and prevent the use of confusingly similar names by third parties. If you have questions about this policy, please contact the Trademark Supervisor by enquiring at http://opensource.org/contact. OSI’s logo in different sizes and resolutions, some suitable for print, can be found here. Please follow our logo usage guidelines. 2. Usage That Does Not Require Written Permission Below are the guidelines for use of the OSI Trademarks where, as long as you are in compliance with the guidelines, no advance written permission is necessary. In all cases, use is permitted only provided that: the use is only in connection with promoting the use of software licenses approved by OSI which are definitively determined by the current list of licenses on the website of OSI (http://www.opensource.org/). Such licenses are defined as “OSI Approved Licenses”. the use of the term “Open Source” is used solely in reference to software distributed under OSI Approved Licenses. the use is not disparaging to OSI, OSI Approved Licenses or software distributed under OSI Approved Licenses the use does not imply sponsorship or endorsement by OSI. proper trademark symbols are used in connection with the OSI Trademarks and the trademark attribution statement must appear as explained in Proper Trademark Use the Logo Usage Guidelines are strictly observed 2.1. Noncommercial and community web sites In the past, community members have inquired whether it is permissible to show support for OSI by: placing the OSI Trademarks on a personal web site or blog to support open source software making a page on a social networking web service to support open source software linking to the OSI website to provide information or show support for open source software The guidelines relating to such usage are set forth in this section. It is permissible to use the OSI Trademarks on websites to show your support for the open source software, provided that: where possible, the design logo hyperlinks to the OSI website, http://opensource.org/, or if that is not possible, the site includes a prominent link to the OSI website at http://opensource.org/. proper trademark symbols are used in connection with the OSI Trademarks and the trademark attribution statement must appear as explained in Proper Trademark Use the Logo Usage Guidelines are strictly observed the site indicates clearly that it is not affiliated with or endorsed by OSI; in addition, where possible: the site must include the text “This site is not affiliated with or endorsed by the Open Source Initiative” prominently on any page that includes the OSI Trademarks, and if the OSI Trademarks appear in a page header or any area that is designed to be presented on more than one page, the notice must also be designed to be presented on all of those pages as well. (i.e., if the OSI Trademarks appear in a site-wide header, the informational text must appear in that header or an identically site-wide footer.) the site does not use visual styling that could be confusing to viewers or visitors as to whether the site is hosted by or on behalf of OSI. A copy of the use of the OSI Trademarks is provided to the Trademark Supervisor within seven (7) days of its initial use, for example by sending a URL or other copy of such use. 2.2. Business web sites In the past, community members have inquired whether it is permissible to show support for OSI by: displaying a link to the OSI website using the OSI Trademarks from a business web site displaying the OSI Trademarks as part of a business that provides software licensed under OSI Approved Licenses The guidelines relating to such usage are set forth in this section. It is permissible to use the OSI Trademarks on business web sites, provided that: the web site has non-OSI primary branding the design logo hyperlinks to the OSI website, http://opensource.org/ the use does not imply sponsorship or endorsement by OSI the use of the OSI Trademarks does not imply an association with nor any form of endorsement by OSI nor does it apply to any software which is not licensed under the OSI Approved Licenses proper trademark symbols are used in connection with the OSI Trademarks and the trademark attribution statement must appear as explained in Proper Trademark Use the Logo Usage Guidelines are strictly observed the site does not use visual styling that could be confusing to viewers or visitors as to whether the site is hosted by or on behalf of OSI A copy of the use of the OSI Trademarks is provided to the Trademark Supervisor within seven (7) days of its initial use, for example by sending a URL or other copy of such use 2.3. Promotional events In the past, community members have inquired whether it is permissible to use the OSI Trademarks to promote free and open source software events such as OSCON or community free software trade show. The guidelines relating to such usage are set forth in this section. It is permissible to use the OSI Trademarks in such promotional events, provided that: the use does not imply sponsorship or endorsement by OSI the use of the OSI Trademarks does not imply an association with or endorsement of the event of the goods distributed at such event proper trademark symbols are used in connection with the OSI Trademarks and the trademark attribution statement must appear as explained in Proper Trademark Use the Logo Usage Guidelines are strictly observed A copy of the use of the OSI Trademarks is provided to the Trademark Supervisor within seven (7) days of its initial use, for example by sending a URL or other copy of such use If you would like to make some non-software goods to give away or sell at the event and don’t already have a license to do so, see Non-software goods. 2.4. Publications It is permissible to use the OSI Trademarks in the title and content of a publication, provided that: the use is clearly in reference to the OSI or software licensed under a OSI Approved Licenses the use does not imply sponsorship or endorsement of the publication by OSI proper trademark symbols are used in connection with the OSI Trademarks and the trademark attribution statement must appear as explained in Proper Trademark Use the Logo Usage Guidelines are strictly observed A copy of the use of the OSI Trademarks is provided to the Trademark Supervisor within seven (7) days of its initial use, for example by sending a URL or other copy of such use 3. Usage that Require Prior Written Approval 3.1. Distributing software under a license approved by OSI (“OSI Approved License”) 3.1.1. Software distributed solely under OSI Approved Licenses In the past, community members have inquired whether it is permissible to use OSI Trademarks to identify software. The guidelines relating to such usage are set forth in this section. It is permissible to use OSI Trademarks on and in conjunction with media or a website that includes only software which is licensed under OSI Approved Licenses, provided that: proper trademark symbols are used in connection with the OSI Trademarks, and the trademark attribution statement appears as explained in Proper Trademark Use 3.1.2. Software distributed under OSI Approved Licenses and software not licensed OSI Approved Licenses separately on same physical medium In the past, community members have inquired whether it is permissible to use the OSI Trademarks to identify media that contains software licensed under OSI Approved Licenses as well as includes other software that is not licensed under OSI Approved Licenses (“Other Software”) in a separate area of the media for use by the recipient. The guidelines relating to such usage are set forth in this section. Community members may use OSI Trademarks on and in conjunction with media that contains software licensed under OSI Approved Licenses and Other Software, provided that: the Other Software is labeled and distributed in a way that clearly indicates it is not part of the software licensed under the OSI Approved Licenses provided on the media or is endorsed by OSI, it is clear who is responsible for the Other Software proper trademark symbols are used in connection with OSI Trademarks as explained in Proper Trademark Use the Logo Usage Guidelines are strictly observed a copy of the use of the OSI Trademarks is provided to the Trademark Supervisor within seven (7) days of its initial use, for example by sending a URL or other copy of such use 3.1.3. Software distributed under OSI Approved Licenses and software not licensed OSI Approved Licenses separately on same website In the past, community members have inquired whether it is permissible to use the OSI Trademarks to identify websites that contains software licensed under OSI Approved Licenses as well as other software that is not licensed under OSI Approved Licenses (“Other Software”) in a separate area of the website for use by the recipient. The guidelines relating to such usage are set forth in this section. Community members may use OSI Trademarks on and in conjunction with such a website that contains software licensed under OSI Approved Licenses and Other Software, provided that: the software licensed under the OSI Approved Licenses must be provided on a separate section of the website and Other Software is not distributed from such part of the website the part of the website through which the Other Software is distributed and is labeled and distributed in a way that clearly indicates it is not part of the software licensed under the OSI Approved Licenses provided on the website or is endorsed by OSI, it is clear who is responsible for the Other Software proper trademark symbols are used in connection with OSI Trademarks as explained in Proper Trademark Use, and the Logo Usage Guidelines are strictly observed a copy of the use of the OSI Trademarks is provided to the Trademark Supervisor within seven (7) days of its initial use, for example by sending a URL or other copy of such use 3.2. Domain names In the past, community members have inquired whether it is permissible to use the OSI Trademarks, including the terms “OSI” or “Open Source Initiative,” in an Internet domain name. It is not permissible without written permission of OSI. 3.3. Non-software goods In the past, community members have inquired whether it is permissible to use OSI Trademarks on non-software goods such as T-shirts, stickers, and pens. Community members may request from the Trademark Supervisor designated by the Board of Directors of OSI a license to use the OSI Trademarks on non-software related goods or services, by enquiring at http://opensource.org/contact. The Trademark Supervisor will be responsible for reviewing samples of the goods and services and managing the relationship. 4. Unapproved Use The following uses of the OSI Trademarks are not approved under any foreseeable circumstances. Violations of the Logo Usage Guidelines or Trademark Usage Guidelines Any use outside these guidelines not by explicit written permission Except as set forth herein, OSI retains and reserves all rights to the OSI Trademarks and their use, including the right to modify these guidelines. These guidelines (except for trademark licenses executed for non software goods) may be amended from time to time at the discretion of OSI and such changes will be effective ten (10) days after the changes are posted. OSI may provide you with notice of such changes, but need not do so. You are responsible for checking this site for any changes. 5. Proper Trademark Use One of the purposes of OSI is to encourage the use of OSI Approved Licenses for software to enable the public to come to trust the use of OSI Trademarks. To achieve this purpose it is important that software licensed under OSI Approved Licenses can quickly be identified. OSI has chosen the OSI Logo to identify such software and is granting usage rights in the OSI Logo (and the other OSI Trademarks) as previously described in this document in order to assure widespread availability. 5.1. Trademark Usage Guidelines Guideline Use examples When using the OSI Trademarks you must provide the proper trademark symbols and a trademark attribution statement. Acceptable: Use for the first instance of the OSI Logo include the ® mark, and include the statement “The OSI logo trademark is the trademark of Open Source Initiative.” Unacceptable: Never using the ® mark for OSI Logo, nor a trademark statement per the guidelines. Always distinguish trademarks from surrounding text with at least initial capital letters or in all capital letters. Acceptable: Open Source Initiative Unacceptable: open source initiative Never pluralize a trademark. Never use “a” or “the” to refer to an instance of the trademark. Always use a trademark as an adjective modifying a noun, or as a singular noun. Acceptable: This software is licensed under an Open Source Initiative approved license. Unacceptable: I put Open Source Initiative software on AcmeCo’s server. Never use a trademark as a possessive. Instead, the following noun should be used in possessive form or the sentence reworded so there is no possessive. Acceptable: Many software programs licensed under OSI’s approved licenses are easy to use. Unacceptable: OSI’s software is easy to use. Never translate a trademark into another language. Acceptable: N/A Unacceptable: [Iniciativa De Código Aberto] Never alter"
