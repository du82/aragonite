title = "Data Governance in Open Source AI – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "February 3, 2025February 7, 2025 Alek Tarkowski Data Governance in Open Source AI Data Governance in Open Source AI Artificial intelligence (AI) is changing the world at a remarkable pace, with Open Source AI playing a pivotal role in shaping its trajectory. Yet, as AI advances, a fundamental challenge emerges: How do we create a data ecosystem that is not only robust but also equitable and sustainable? The Open Source Initiative (OSI) and Open Future have taken a significant step toward addressing this challenge by releasing a white paper: “Data Governance in Open Source AI: Enabling Responsible and Systematic Access.” This document is the culmination of a global co-design process, enriched by insights from a vibrant two-day workshop held in Paris in October 2024. Download white paper ABOUT Dr. Alek Tarkowski is the Strategy Director at Open Future. He holds a PhD in sociology from the Polish Academy of Science. He has over 15 years of experience with public interest advocacy, movement building, and research into the intersection of society, culture, and digital technologies. The OSI is the authority that defines Open Source, recognized globally by individuals, companies, and by public institutions. Open Future is a European think tank that develops new approaches to an open internet that maximize societal benefits of shared data, knowledge and culture. ACKNOWLEDGEMENTS The publication of this white paper was possible thanks to grant number 2024-22486 from the Alfred P. Sloan Foundation. LICENSE @ 2025 Alek Tarkowski, Open Future and Open Source Initiative This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 International license."
