title = "Affiliate organization: qualifications and criteria – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Affiliate organization: qualifications and criteria Page created on November 1, 2014 | Last modified on March 29, 2023 The OSI recognizes three types of organizations as elegible for OSI Affiliate organization: non-profit organizations, educational institutions and user communities. Non-Profit Organizations Qualifications Please provide references for (these may be hyperlinks)… Currently recognized as a (or application submitted for) non-profit / not-for-profit (or equivalent) by the national government were organized. Mission statement describing purpose and goals. Documentation formalizing organization, e.g. by-laws. Publicly available release of a product(s) or service(s). Use of an OSI approved open source license (software development projects only). Documented approach for participation by the public. An active community: Methods for current and interested individuals/organizations to join and participate in your community Active participation from multiple contributors, i.e. individuals and organizations other than founders (contributions may be other than programming/technology) References from other open source projects, ideally a current OSI Affiliate organization. Criteria OSI Agreement has been signed and submitted. Cover letter including interest in Affiliation; proof of qualification. Educational Institutions Qualifications Please provide references for… Institution is currently recognized and in good standing by an appropriate accreditation body. Evidence of institutional/departmental authority to affiliate with external organizations. Mission statement describing purpose and goals of institution/department. Documentation by the institution recognizing organization (academic and administrative departments only), e.g. organizational chart. Publicly available release of a product(s) or service(s) in line with the goals, values and mission of the OSI. Examples of software used and/or supported within the institution/department with an OSI approved open source license. An active community: Methods for current and interested individuals/organizations to join and participate in your community Active participation from multiple contributors, i.e. individuals and organizations other than founders (contributions may be other than programming/technology) References from other open source projects, ideally a current OSI Affiliate organization. Criteria OSI Agreement has been signed and submitted. Cover letter including interest in Affiliation; proof of qualification. User Communities Qualifications Please provide references for… Founding documentation formalizing organization, e.g. by-laws. Association memberships, partnerships, etc. (if applicable) with international, national, professional and/or affiliated organizations. Mission statement describing purpose and goals. Publicly available release of events/activities, e.g. meetings, conferences, etc. Documented approach for participation by the public. An active community: Methods for current and interested individuals/organizations to join and participate in your community Active participation from multiple contributors, i.e. individuals and organizations other than founders (contributions should be other than programming/technology) References from other open source projects, ideally a current OSI Affiliate organization. Criteria OSI Agreement has been signed and submitted. Cover letter including interest in Affiliation; proof of qualification."
