title = "Press mentions – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "February 21, 2025 DeepSeek goes beyond “open weights” AI with plans for source code release Ars Technica It’s currently unclear whether DeepSeek’s planned open source release will also include the code the team used when training the model. That kind of training code is necessary to meet the Open Source Initiative’s formal definition of “Open Source AI,” which was finalized last year after years of study. A truly open AI also must include “sufficiently detailed information about the data used to train the system so that a skilled person can build a substantially equivalent system,” according to OSI. February 16, 2025 Open source LLMs hit Europe’s digital sovereignty roadmap TechCrunch In traditional software, the perennial struggle between open source and proprietary revolves around the “true” meaning of “open source.” This can be resolved by deferring to the formal “definition” as per the Open Source Initiative, the industry stewards of what are and aren’t legitimate open source licenses. More recently, the OSI has formed a definition of “open source AI” February 8, 2025 Why the ‘spirit’ of open source means much more than a license TechCrunch “The point of having definitions is to have criteria that can be scored, and focusing on licensing is how that is accomplished,” Maffulli said in a statement issued to TechCrunch. “The global community and industry have come to rely on the Open Source Definition and now the Open Source AI Definition as objective measures that they can rely on.” February 5, 2025 Why Mark Zuckerberg wants to redefine open source so badly ZDNET OSI executive director Stefano Maffulli told me. “If only Meta’s license would remove the restrictions, we’d be more in sync. As it stands now, Llama is a liability for any developer; too opaque to be safe to use and with a license that ultimately leaves Meta in charge of their innovations. February 3, 2025 Red Hat’s take on open-source AI: Pragmatism over utopian dreams ZDNET Fontana also warns against overreach in defining openness, advocating for minimal standards rather than utopian ideals. “The Open Source Definition (OSD) worked because it set a floor, not a ceiling. AI definitions should focus on licensing clarity first, not burden developers with impractical transparency mandates.”"
