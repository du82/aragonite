full_description = "Conflict of Interest Policy Page created on May 7, 2013 | Last modified on March 3, 2023 Each Board Director serving the Open Source Initiative (OSI) owes the organization a fiduciary responsibility to act in the best interests of the OSI. As all OSI Board Directors are volunteers, and that many are employed at organizations heavily involved in open source, instances may arise where there is a conflict of interest. In order to provide transparency to the community we serve, and help the organization identify and resolve potential conflicts, the below Conflict of Interest policy and Disclosure Statement have been adopted. If a potential conflict of interest should arise, OSI Board Directors may recuse themselves from a decision. 2019 Board Conflict of Interest & Financial Interest Disclosure Statements This Policy on Conflicts of Interest was adopted by the Board in January of 2019. CONFLICT_OF_INTEREST_POLICY_FINALDownload"
