title = "Chris Aniszczyk – Open Source Initiative"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Chris Aniszczyk Chris Aniszczyk he/him Board Member Candidacy Period: March 19, 2024 – March 19, 2026 Type of Seat: Individual Chris Aniszczyk is an open source technologist with a passion for building a better world through open collaboration. He’s currently a CTO at the Linux Foundation focused on developer experience and running the Cloud Native Computing Foundation (CNCF). At the Linux Foundation, he helped start a variety of open source foundations, from GraphQL Foundation, TODO Group to the FinOps Foundation and more! In a previous life, he created the Twitter OSPO and led their open source efforts. For many years he served on the Eclipse Foundation’s Board of Directors representing the committer community and the Java Community Process (JCP) Executive Committee. In his younger years, he bootstrapped a open source consulting company, made many mistakes, lead and hacked on many eclipse.org and Linux related projects. How will you contribute to the board Chris has extensive experience in sustainability around open source foundations, from creation to fundraising to operation. He built up CNCF to be one of the fastest growing open source foundations of all time in terms of revenue and impact. I’d contribute that experience to help scale OSI to the next level and to a healthier mix of professional staff (supporting volunteers). Why you should be elected I believe that we are at an inflection point in open source where partly, open source is everywhere and extremely successful. However, there are issues around what does open source mean in a new era of generative AI, intelligent cloud development environments and supply chain security, the OSI should be at the forefront of defining and protecting open source in these fields. Furthermore, a simple realistic goal would be to expand OSI’s fundraising to help further professionalize the organization so it can be sustained into the next decade. Finally, selfishly, I simply would like to pay it forward, I have benefited from OSI’s stewardship of open source licensing in my career and I’d like to ensure that OSI lasts into the next decade of open source."
