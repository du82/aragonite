full_description = "As part of our Deep Dive:AI, the Open Source Initiative (OSI) gathered a diverse collection of leaders to collaborate in drafting a definition for “Open Source AI.” Speakers from law, academia, NGOs, enterprise, and the Open Source community shared their thoughts on pressing issues and offered potential solutions in our development and use of AI systems. Watch the recordings of the Deep Dive webinars October 14, 2023 Challenges welcoming AI in openly-developed open source projects October 14, 2023 The Ideology of FOSS and AI: What “Open” means relating to platforms and black box systems October 14, 2023 Federated Learning: A Paradigm Shift for Secure and Private Data Analysis October 14, 2023 Perspectives on Open Source Regulation in the upcoming EU AI Act October 14, 2023 Fairness & Responsibility in LLM-based Recommendation Systems: Ensuring Ethical Use of AI Technology October 14, 2023 Copyright — Right Answer for Open Source Code, Wrong Answer for Open Source AI? October 14, 2023 Should we use open source licenses for ML/AI models? October 14, 2023 Operationalising the SAFE-D principles for Open Source AI October 14, 2023 Open source AI between enablement, transparency and reproducibility October 14, 2023 Opening up ChatGPT: a case study in operationalizing openness in AI October 14, 2023 Data privacy in AI October 14, 2023 Covering your bases with IP Indemnity October 14, 2023 Preempting the Risks of Generative AI: Responsible Best Practices for Open-Source AI Initiatives October 14, 2023 Data Cooperatives and Open Source AI October 14, 2023 Should OpenRAIL licenses be considered OS AI Licenses? October 14, 2023 Commons-based data governance Media sponsors Techstrong AI Supported by .wp-block-osi-sponsors-list { border-top: 0 !important; } .entry-content h2 { margin-top: 0 !important; } OSI’s efforts wouldn’t be possible without the support of our sponsors and thousands of individual members. Become a sponsor or join us today! OSI’s work wouldn’t be possible without the support of the thousands of individual members."
