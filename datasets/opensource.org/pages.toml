emoveClass().addClass('cmsmessagebox').css({"color":"#000","backgroundColor":"#FFC","border":"1px solid #c93"}).text(check).fadeIn("slow"); //check the username exists or not from ajax var contactUrl = "https://members.opensource.org/join/?civiwp=CiviCRM&q=civicrm%2Fajax%2Fcmsuser"; var checkUserParams = { cms_name: cj("#cms_name").val(), ts: "1740892401", sig: "VuJg_ab5fc36bfab692e01f4b630b08790824", for: 'civicrm/ajax/cmsuser' }; cj.post(contactUrl, checkUserParams ,function(data) { if ( data.name == "no") {/*if username not avaiable*/ cj("#msgbox").fadeTo(200,0.1,function() { cj(this).html(notavailable).addClass('cmsmessagebox').css({"color":"#CC0000","backgroundColor":"#F7CBCA","border":"1px solid #CC0000"}).fadeTo(900,1); }); } else if ( data.name == "error") {/*if username not avaiable*/ cj("#msgbox").fadeTo(200,0.1,function() { cj(this).html(errorMsg).addClass('cmsmessagebox').css({"color":"#CC0000","backgroundColor":"#F7CBCA","border":"1px solid #CC0000"}).fadeTo(900,1); }); } else { cj("#msgbox").f'''
