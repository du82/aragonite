["https://openssl.org/faq"]
title = "FAQ | OpenSSL"
description = """
Who governs or controls each project? Each project independently chooses its own governance model. Refer to each project page for details as to how the project is governed.
Why have other projects adopted the OpenSSL Mission? Other Projects have adopted the OpenSSL Mission because they collectively have common values and support the OpenSSL Mission statement. The projects also benefit from shared communication channels, access to shared resources such as test systems, staff and collaborative opportunities with FIPS140 testing laboratories."""
full_description = "FAQ Who governs or controls each project? Each project independently chooses its own governance model. Refer to each project page for details as to how the project is governed. Why have other projects adopted the OpenSSL Mission? Other Projects have adopted the OpenSSL Mission because they collectively have common values and support the OpenSSL Mission statement. The projects also benefit from shared communication channels, access to shared resources such as test systems, staff and collaborative opportunities with FIPS140 testing laboratories. Support from the Foundation and the Corporation is available for all projects under the OpenSSL Mission on an opt-in (voluntary) basis. Who controls the OpenSSL Mission? The Foundation and the Corporation both operate under the OpenSSL Mission and are responsible for any updates or changes to the Mission."
