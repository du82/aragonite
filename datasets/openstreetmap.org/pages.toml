["https://openstreetmap.org/diary/fi"]
title = "Diary Entries in Finnish | OpenStreetMap"
description = "OpenStreetMap is a map of the world, created by people like you and free to use under an open license."
full_description = "Susisaaren tietojen lisäys valmistui 27.2. 2025 Posted by Aurorakiitäjä on 27 February 2025 in Finnish (Suomi). Susisaaren tietojen lisäys valmistui 27.2. 2025. Lisäykset päasiassa Wikidata-tietokannan liittämistä ja lisäksi eräitä paikkatietoja lisätty kartalle. Suurin puuttuvista oli bastioni Hamilton. Comment on this entry Send a message to the author No comments Pyöräpysäköintipaikkojen kartoituskauden 2024 tuloksia Posted by Barro on 26 November 2024 in Finnish (Suomi). Nyt sää alkaa olla sen verran kylmä, ja välillä luminen, että voidaan todeta, että on aika siirtää pyöräpysäköintipaikkojen kartoitus talvilevolle ja jatkaa urakkaa isommassa määrin sitten, kun pakkaset ovat taas väistyneet. Kauden 2024 projektina itselläni oli seuraavanlaisia asioita läpikäytävänä omalta tarkastelualueeltani: Käydään määräpuutteelliset pyöräpysäköintialueet läpi ja täydennetään niihin olennaisimmat tiedot. Tarkistetaan pyöräpysäköintialueet, joihin ei ole koskettu sitten vuoden 2018 alun jälkeen, että onko mikään merkittävästi muuttunut. Käydään juna-asemien pyöräpysäköintimahdollisuudet läpi. Aloitetaan koulujen ja päiväkotien pyöräpysäköintimahdollisuuksien läpikäynti. Tästä tuli kirjoitettua Päiväkotien ja koulujen pyöräpysäköintitilanne -artikkelissa vähän pidemmälti. Näissä projekteissa huomiona se, että kun merkitsen pyöräpysäköintimahdollisuuksia kartalle, en ota huomioon kiekonväännintelineiden olemassaoloa. Paitsi jos kyseinen pysäköintialue on jonkun muun lisäämä kartalle. Tähän syynä se, että kyseiset telineet on huonompi vaihtoehto pyörän pysäköinnin suhteen kuin kiinnittää pyörä aitaan tai tolppaan. Ja eivät toimi suunnitellusti isolle osalle pyörätyypeistä, jotka ei osu siihen yhteen platoniseen ideaaliipyörätyyppiin, jolle kyseinen telinemalli on mitoitettu. Huomiota kiinnittäneitä asioita Kartoituskauden aikana jotkut asiat kiinnitti huomiota positiivisessa määrin. Kuva 1: Satoja kaksikerrostelineitä Kaisantunnelin pyörätallissa. Kaksikerrostelineitä (esimerkki kuvassa 1) on lähdetty hankkimaan juna-asemille oikein urakalla. Näissä on samat ongelmat käytön suhteen kuin kiekonväännintelineissä, mutta niiden määrät tulee kuitenkin kirjattua kartalle. Helsingin kaupunki on lisäksi saanut valtiolta avustusta juna-asemien pyöräpysäköinnin parantamiseksi, joka on toteutettu isoilta osin näitä kaksikerrostelineitä, runkolukittavia pyörätelineitä ja laatikkopyörille suunnattuja telineitä käyttäen. Kuva 2: Laatikkopyörille tarkoitettu pyöräteline Huopalahden juna-asemalla. Rahtipyörille suunnattuja telinetyyppejä on alkanut löytymään muutamilta juna-asemilta. Esimerkki tällaisesta on Huopalahden asemalta kuvassa 2, jossa tyypillisempien runkolukittavien telineiden lisäksi löytyy myös tällainen laatikkopyörille tarkoitettu teline. Kuva 3: Katettu kiekonväännintyyppinen pyöräteline päiväkodin vieressä. Päiväkotien, koulujen ja muiden oppilaitosten pyöräpysäköinnistä tuli tehtyä vähän isompi urakka. Siinä tuli todettua, että erityisesti päiväkotien pyöräpysäköintitilanne on huono. Kuvassa 3 on esimerkki yhdentyyppisestä heikohkonpuoleisesta telineratkaisusta päiväkodin edustalla. Pyöräpysäköintimäärien kehitys Pyöräpysäköintimäärien kehitys OpenStreetMapin datassa on ollut vuoden 2024 kartoituskaudella ollut voimakkaan nousujohteista. Talven jäljiltä kun lähdin käymään paikkamääräpuutteisia pyöräpysäköintialueita läpi, niin tämä antoi hyvän pohjan viimevuotisen datan päälle täydentämiselle (kuva 4). Kuva 4: Paikkamääräpuutteellisten pyöräpysäköintialueiden määrä OpenStreetMapin tietokannassa vuodesta 2021 lähtien tarkastelualueella. Kuvan 4 kuvaajasta näkyy, että OpenStreetMapin dataan on tullut talven mittaan muiden kartoittajien ansiosta pyöräparkkeja tasaista tahtia, joita sitten lämmenneiden säiden myötä sai täydennettyä tiedoiltaan kattavammaksi. Kuva 5: Pyöräpysäköintipaikkojen kehitys telinetyypeittäin vuodesta 2021 OpenStreetMapin tietokannassa tarkastelualueella. Kuvassa 5 näkyy kehitys sen suhteen, että miten eri tyyyppisten pyöräpysäköintipaikkojen määrä on kehittynyt ajan myötä. Epäilen, että safe_loops-tunnisteella olevat runkolukituksen tarjoavat kiekonväännintyyppiset pyörätelineet ovat merkittävästi yleistyneet datassa. Todennäköisesti datan keräämisen ja keräämisen laadun paranemisen seurauksena. two-tier-tunnisteella olevat kaksikerroksiset kiekonväännintyyppiset pyörätelineet ovat pääasiassa lisääntyneet sen takia, että niitä on alkanut ilmestymään merkittäviä määriä juna-asemille. Loppupohdintoja Runkolukittavia telineitä alkaa olla sellainen määrä pääkaupunkiseudulla OpenStreetMapin tietokannassa, että olen voinut omilla reissuillani jo muutamaan otteeseen hyödyntää aikaisemmin tehtyjä kartoituksia. Eli ainakin omassa käytössäni tästä tehdystä työstä alkaa hiljalleen olla yllättävää hyötyä. Pitää vain toivoa, että pääkaupunkiseudun julkiset ja yksityiset toimijat alkaa korvaamaan olemassaolevia heikkolaatuisia telineitään monikäyttöisemmillä runkolukittavilla telineillä. Jotta jossain vaiheessa voisi vain mennä pyörällä uusiin paikkoihin ilman, että tarvitsee turvautua OpenStreetMapin dataan löytääkseen pätevän paikan pyörällensä. Comment on this entry Send a message to the author No comments"
