["https://openstreetmap.org/diary/es"]
title = "Diary Entries in Spanish | OpenStreetMap"
description = "OpenStreetMap is a map of the world, created by people like you and free to use under an open license."
full_description = "Centro Posted by Vicente_74 on 24 February 2025 in Spanish (Español). . Location: Candelario Ríos, Cadereyta Jiménez, Nuevo León, México Comment on this entry Send a message to the author No comments MAPA DE RECORRIDO PARA AGENCIA DE VIAJES Posted by Oferta en viajes on 22 February 2025 in Spanish (Español). Buenas tardes, soy Osvaldo y estoy buscando ayuda para colocar un mapa de ruta en el itinerario de viaje de mi agencia de viajes. la idea es por ejemplo: DÍA 01 MÉXICO – LONDRES DÍA 02 - PARÍS DÍA 03 - ZURICH DÍA 04 - PARÍS DIA 05 - PARIS-MEXICO Y DEBAJO UN MAPA QUE UNA CADA DESTINO CON UNA LINEA. el problema es que no estoy inmerso en este tema y deseo que me ayuden para lograrlo. utilizo Worpress y el tema Hello Elementor. muchas gracias por su atención Comment on this entry Send a message to the author 1 comment Please use the Imagery Offset Database Posted by mdelatorre on 14 February 2025 in Spanish (Español). Imagery Offset Database Todo mapeador aficionado debería saber que todas las imágenes obtenidas de forma remota (por ejemplo, imágenes satelitales y fotografías aéreas) y otras fuentes, excepto las trazas GPS, suelen estar mal alineadas con respecto a la realidad. Como resultado, el cartógrafo debería poder alinear las imágenes en su editor preferido utilizando trazas GPS. El proceso lleva entre 5 y 10 minutos y, debido a la precisión del GPS, los resultados varían. No es tan malo si eres el único cartógrafo en cientos de kilómetros a lo largo de cientos de años, pero para la cartografía cooperativa, incluso una variación de un metro importa. Un análisis del problema reveló dos posibles soluciones, ambas igualmente efectivas. La base de datos de desplazamientos y el complemento de desplazamientos implementan ambas; no se excluyen, sino que se complementan entre sí, lo que permite al mapeador verificar los desplazamientos no solo con trazas GPS, sino utilizando un método de alineación alternativo. Cada objeto en la base de datos OSM tiene coordenadas (en grados en la proyección WGS84/EPSG:4326), una fecha de creación, un autor y una descripción, que ayudan a determinar la aplicabilidad y la cobertura de un desplazamiento. Es una buena práctica utilizar esta base de datos en nuestro mapeo de cada área. Si te interesa aprender a usar este mecanismo puedes leer: https://wiki.openstreetmap.org/wiki/ES:Imagery_Offset_Database Comment on this entry Send a message to the author 1 comment"
