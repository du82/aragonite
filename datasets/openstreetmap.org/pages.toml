title = "Diary Entries in Brazilian Portuguese | OpenStreetMap"
description = "OpenStreetMap is a map of the world, created by people like you and free to use under an open license."
full_description = "MAPEDUCAÇÃO - Programa que visa mapear as escolas e instituições de ensinos públicas e particulares começou no Município de Jacobina. Posted by Melhorias no Piemonte on 1 March 2025 in Brazilian Portuguese (Português do Brasil). O objetivo deste programa é a identificação e o mapeamento de todas as escolas da Região Piemonte Norte da Chapada Diamantina, para que, dessa forma, as escolas ganhem maior visibilidade no mapa e se tornem mais fáceis de serem encontradas, o que é especialmente necessário no período de matrícula. O programa teve início em Jacobina e, até o momento, temos as seguintes instituições mapeadas: Instituto Federal de Educação Ciências e Tecnologia (IFBA) - Campus Jacobina; Colégio Modelo Luís Eduardo Magalhães; Serviço Social de Comércio (SESC) - Unidade Jacobina Colégio Gilberto Dias de Miranda / COMUJA Centro Municipal de Educação Infantil (CMEI) Mãe Iazinha Colégio Municipal Carlos Gomes da Silva Além, destas, estas são outras instituições que estão no processo de mapeamento ou na lista de espera: Se você precisa do mapeamento de alguma instituição com urgência, entre em contato que adiantamos o processo da solicitada. Colégio Municipal Pedro Daltro (EM MAPEAMENTO) Escola Municipal Antônio Alves da Silva (EM MAPEAMENTO) Escola Municipal Leolino Ferreira da Silva (EM MAPEAMENTO) Universidade do Estado da Bahia (UNEB) - Campus IV Faculdade Ages Centro Educacional Deocleciano Barbosa Núcleo Territorial de Educação do NTE 16 Centro Territorial de Educação Profissional do Piemonte da Diamantina II Escola Núbia Maria Mangabeira Guerra Colégio Municipal Elvira da Costa Pinto Dias Pires Location: Féliz Tomaz, Jacobina, Região Geográfica Imediata de Jacobina, Região Geográfica Intermediária de Feira de Santana, Bahia, Região Nordeste, Brasil Comment on this entry Send a message to the author No comments Dados do MapBiomas no OpenStreetMap e sugestão de etiquetagem Posted by pedro_tharg on 26 February 2025 in Brazilian Portuguese (Português do Brasil). Last updated on 27 February 2025. Dados do MapBiomas no OpenStreetMap e sugestão de etiquetagem 📄 Resumo Neste texto discorro sobre a minha experiência mapeando vegetação de Caatingas no OpenStreetMap no município de Cuité, Paraíba, através dos dados do MapBiomas. Apresento um modelo de etiquetagem semelhante ao meu diário anterior focado nos dados ambientais do IBGE, mas dessa vez voltado para os dados sobre vegetação brasileira produzidos pelo Projeto MapBiomas. O intuito é ser um suporte para quem tiver interesse em mapear áreas vegetadas no OpenStreetMap sem a necessidade de criação de novas tags e utilizando o que já está documentado na Wiki. A tabela com a etiquetagem sugerida pode ser visualizada no Google Planilhas. ❓ Os dados do MapBiomas podem ser utilizados no OpenStreetMap? Sim. Através de e-mails, o usuário Matheus Gomes conseguiu uma autorização explícita do MapBiomas para o uso no OpenStreetMap. Originalmente, a licença do projeto é CC-BY-SA, contudo a equipe autorizou a utilização dos dados mesmo com a incompatibilidade com a licença ODbL. A conversa está documentada na wiki. 🌎 O que é o MapBiomas e quais são as características dos dados? Segundo o próprio site, o MapBiomas é: “(…) é uma iniciativa do Observatório do Clima, co-criada e desenvolvida por uma rede multi-institucional envolvendo universidades, ONGs e empresas de tecnologia com o propósito de mapear anualmente a cobertura e uso da terra do Brasil e monitorar as mudanças do território.” É importante destacar que os dados de cobertura e uso do solo do MapBiomas possuem resolução espacial de 30 m e podem ser baixados em formato raster (GeoTiff) em diversos níveis como bioma, município ou estado através de script no Google Earth Engine. Mais informações de como realizar o download estão nas informações sobre as Coleções e a metodologia do projeto é descrita na visão geral da metodologia. 💻 Processamento dos dados para o uso no OpenStreetMap A primeira etapa foi baixar os dados de cobertura do solo a nível de município através do script no Google Earth Engine. Este vídeo do canal GeoAplicada explica bem como fazer isto. Com o arquivo obtido é um raster, foi preciso vetorizar o arquivo. Para isso, usei o QGIS. Com o arquivo vetorizado, foi possível exportar cada tipo de cobertura de solo para um GeoJSON tomando o cuidado de identificar a cobertura correta através dos Códigos de Legenda do MapBiomas. Como meu foco era vegetação nativa, exportei apenas os códigos correspondentes à Formação Savânica e à Formação Campestre, visto que correspondem a maior parte do município. 📍 Mapeamento no OpenStreetMap e porque não fiz importação massiva dos dados Devido a resolução espacial dos vetores gerados, optei por não importar a geometria exatamente do Mapbiomas. Preferi utilizar apenas como camada de fundo no JOSM e redesenhar as geometrias utilizando imagens áereas do Bing, verificando e subindo pouco a pouco para o OpenStreetMap. Foi um trabalho cansativo e demorado, mas é preciso fazer essa verificação para que a geometria seja mais coerente com o existente. Isso evitou também conflito com geometrias de vegetação já presentes no OpenStreetMap, como as do Banco de Dados e Informações Ambientais do IBGE, e a criação de multipolígonos com açudes, lavouras e etc. 📝 O modelo de etiquetagem Para as tags de vegetação, utilizei método semelhante à minha proposta anterior de correspondência com os dados do IBGE, permitindo uma maior diversidade nas características da vegetação e um rastreamento de onde vieram aqueles dados. A etiquetagem sugerida para cada classe do MapBiomas está descrita no Google Planilhas. Por conhecimento da região e experiência em mapeamento de vegetação, optei por não mapear algumas classes com base no Mapbiomas, principalmente as lavouras, pois a resolução espacial do projeto e outros fatores podem identificá-las incorretamente. O mesmo vale para tipos de vegetação nativa. O conhecimento local do mapeador nestes casos é sempre muito importante! ⏳️ Antes e depois do mapeamento Embora ainda não tenha concluído totalmente o mapeamento, este é o resultado para o município de Cuité, Paraíba. Município de Cuité no OpenStreetMap antes e depois dos dados de vegetação do Mapbiomas 2022. Tamanho completo E aqui um exemplo de uma vegetação local com bastante informação nas etiquetas. 🍂 🌿🌴🌵 Sugestões e opiniões são sempre bem-vindas! 🌳🌲🌻🍃 Comment on this entry Send a message to the author No comments"
