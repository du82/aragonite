title = "Users' Diaries | OpenStreetMap"
description = "OpenStreetMap is a map of the world, created by people like you and free to use under an open license."
full_description = "Turquie 2025 Posted by Nicooolas on 1 March 2025 in French (Français). Turquie 2025 ## Istanbul Location: Atikali Mahallesi, Fatih, İstanbul, Région de Marmara, Turquie Comment on this entry Send a message to the author No comments 12 Fishpond Ter., Barnegat, NJ 08005 Posted by Jeanmarie McSpedon on 1 March 2025 in English. New Listing in Mirage Comment on this entry Send a message to the author No comments Henderson, Nebraska, A small town missing details Posted by Canyon Runner on 1 March 2025 in English. Started picking out small towns which have no detail, and started to add some details. This is Henderson, Nebraska. Currently trying to get all the buildings outlined. Location: Henderson, York County, Nebraska, United States Comment on this entry Send a message to the author No comments MAPEDUCAÇÃO - Programa que visa mapear as escolas e instituições de ensinos públicas e particulares começou no Município de Jacobina. Posted by Melhorias no Piemonte on 1 March 2025 in Brazilian Portuguese (Português do Brasil). O objetivo deste programa é a identificação e o mapeamento de todas as escolas da Região Piemonte Norte da Chapada Diamantina, para que, dessa forma, as escolas ganhem maior visibilidade no mapa e se tornem mais fáceis de serem encontradas, o que é especialmente necessário no período de matrícula. O programa teve início em Jacobina e, até o momento, temos as seguintes instituições mapeadas: Instituto Federal de Educação Ciências e Tecnologia (IFBA) - Campus Jacobina; Colégio Modelo Luís Eduardo Magalhães; Serviço Social de Comércio (SESC) - Unidade Jacobina Colégio Gilberto Dias de Miranda / COMUJA Centro Municipal de Educação Infantil (CMEI) Mãe Iazinha Colégio Municipal Carlos Gomes da Silva Além, destas, estas são outras instituições que estão no processo de mapeamento ou na lista de espera: Se você precisa do mapeamento de alguma instituição com urgência, entre em contato que adiantamos o processo da solicitada. Colégio Municipal Pedro Daltro (EM MAPEAMENTO) Escola Municipal Antônio Alves da Silva (EM MAPEAMENTO) Escola Municipal Leolino Ferreira da Silva (EM MAPEAMENTO) Universidade do Estado da Bahia (UNEB) - Campus IV Faculdade Ages Centro Educacional Deocleciano Barbosa Núcleo Territorial de Educação do NTE 16 Centro Territorial de Educação Profissional do Piemonte da Diamantina II Escola Núbia Maria Mangabeira Guerra Colégio Municipal Elvira da Costa Pinto Dias Pires Location: Féliz Tomaz, Jacobina, Região Geográfica Imediata de Jacobina, Região Geográfica Intermediária de Feira de Santana, Bahia, Região Nordeste, Brasil Comment on this entry Send a message to the author No comments"
