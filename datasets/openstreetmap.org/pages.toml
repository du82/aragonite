full_description = '''Turquie 2025 Posted by Nicooolas on 1 March 2025 in French (Français). Turquie 2025 ## Istanbul Location: Atikali Mahallesi, Fatih, İstanbul, Région de Marmara, Turquie Comment on this entry Send a message to the author No comments Entretenir les relations associatedStreet Posted by jbcharron on 9 February 2025 in French (Français). La France est un des rares pays dans le monde à utiliser les relations associatedStreet. Utiliser les relations nécessite de mettre en place des règles de contrôles qualité pour assurer un fonctionnement optimal lors de la réutilisation des données par des outils tiers notamment les GPS. Des contrôles existent déjà dans JOSM, Osmose et Pifomètre: https://osmose.openstreetmap.fr/fr/issues/open?item=xxxx&source=409876 https://josm.openstreetmap.de/wiki/Help/Preferences/Validator https://josm.openstreetmap.de/wiki/Rules/FranceSpecificRules https://bano.openstreetmap.fr/pifometre/adresses_osm_sans_rue.html Je vous propose quelques requêtes Overpass qui vous permettront d’améliorer les relations associatedStreet dans votre région (les requêtes sont compatibles avec le chargement de données dans JOSM depuis Overpass Turbo): Rechercher toutes les relations associatedstreet (au lieu d’associatedStreet) [out:xml][timeout:25]; {{geocodeArea:Ain}}->.searchArea; relation["type"="associatedstreet"](area.searchArea); (._;>;); out meta; Lien Overpass Turbo Rechercher toutes les relations associatedStreet sans tag name [out:xml][timeout:25]; {{geocodeArea:Ain}}->.searchArea; relation["type"="associatedStreet"][!"name"](area.searchArea); (._;>;); out meta; Lien Overpass Turbo Rechercher toutes les relations associatedStreet qui ont un rôle spécifique (potentiellement une faute de frappe ou un rôle invalide, à récupérer dans la liste disponible sur taginfo) [out:xml][timeout:25]; {{geocodeArea:Ain}}->.searchArea; relation["type"="associatedStreet"](if:count_by_role("strteet") > 0)(area.searchArea); (._;>;); out meta; Lien Overpass Turbo Rechercher toutes les relations associatedStreet dont au moins un membre n’a pas de rôle [out:xml][timeout:25]; {{geocodeArea:Ain}}->.searchArea; relation["type"="associatedStreet"](if:count_by_role("") > 0)(area.searchArea); (._;>;); out meta; Lien Overpass Turbo Bon jardinage Location: Quartier de l'Amphithéâtre, Le Sablon, Metz, Moselle, Grand Est, France métropolitaine, 57000, France Comment on this entry Send a message to the author 1 comment'''
