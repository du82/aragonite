["https://openvoiceos.org"]
title = "Home"
description = "Home page of OVOS"
full_description = '''Open Voice OSOpenVoiceOS is a community-driven, open-source voice AI platform for creating custom voice-controlled ​interfaces across devices with NLP, a customizable UI, and a focus on privacy and security.About Us🎉 OpenVoiceOS Foundation is now live! Click here for the press releaseWhy Open Voice OS?Community DrivenPowered by developers around the globe from various Linux and Foss communities, an open platform for developers interested in making cutting-edge voice assistance technology available to everyone.Multi-platformEmbedded headless device or single board computers with screens to build a do-it-yourself smart speaker, Open Voice OS is the open community playground for all platforms to come and experiment at.Experimental at CoreHave an experimental feature you want users to experience before landing them into any of the Linux-based open-source voice assistant projects upstream? Open Voice OS is the platform.DIYOpen Voice OS being a community platform is open to all developers and contributors wanting to support a specific device or a platform.Getting started Installing OVOS couldn't be simpler! Just give our installer a try, and you're all set. We offer two main ways to install OVOS - Docker and Python. Python Virtual Environment If you are a developer, and would like to fiddle with the code, this is the way to go.DockerIf you want a super stable and easy way to run OVOS, Docker is the way to go.To get started, simply copy and paste the following command in your terminal:$sh -c "curl -s https://raw.githubusercontent.com/OpenVoiceOS/ovos-installer/main/installer.sh -o installer.sh && chmod +x installer.sh && sudo ./installer.sh && rm installer.sh"Copy to clipboardOwn a Raspberry Pi or Mycroft® Device ?Our Prebuild Image is a stripped-down Linux OS designed to host the open-source voice assistant Open Voice OS, catering specifically to embedded systems, low-spec headless devices, and small touch-friendly screens.Download NowFrequently Asked QuestionsQ: How did Open Voice OS started?Open Voice OS started as MycroftOS. Over time, more Mycroft community members joined the project, and it was renamed to OpenVoiceOS to avoid trademark issues. Initially, Open Voice OS focused on bundling Mycroft-core and creating companion software, but due to contributions not being accepted upstream, we now maintain an enhanced reference fork of Mycroft-core with extra functionality while keeping all companion software Mycroft-core (dev branch) compatible. You can think of Open Voice OS as the unsanctioned "Mycroft Community Edition".Q: What is the relationship between Open Voice OS and Mycroft?Both projects are fully independent. Initially, Open Voice OS focused on wrapping Mycroft-core with a minimal OS, but as both projects matured, Open Voice OS-core was created to include extra functionality and make Open Voice OS development faster and more efficient. Open Voice OS has been committed to keeping our components compatible with Mycroft, and many of our changes are submitted to Mycroft to include in their projects at their discretion.Q: Does Open Voice OS work offline?By default, ovos-core does not require a backend internet server to operate. Some skills can be accessed (via command line) entirely offline. The default speech-to-text (STT) engine currently requires an internet connection, though some self-hosted, offline options are available. Individual skills and plugins may require internet, and most of the time you will want to use those.Q: How can I contribute to Open Voice OS?Open Voice OS is a community project and we welcome contributions of all kinds. You can contribute by testing, reporting bugs, writing documentation, creating skills, or even contributing code. We have a dedicated section in our documentation that explains how to get started with contributing to Open Voice OS.Got a question that isn't answered here? Check out our Full FAQHave a question or need help?Feel free to reach out to us. Whether you have a question or want to contribute to the project, we would love to hear from you.GitHubDocumentationDiscussionMatrixEmailAre you an business or organization looking to integrate Open Voice OS into your products? Check Contact Form to get in touch with us.Want to be a part of Open Voice OS check Contribution Page to learn more.'''
year_published = 2025
