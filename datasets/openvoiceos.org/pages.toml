["https://openvoiceos.org/friends"]
title = "Friends"
description = "OpenVoiceOS is part of a larger ecosystem of FOSS voice technology, we work closely with the following projects and communities."
full_description = "Friends of Open Voice OSOpenVoiceOS collaborates with a wide range of projects within the FOSS voice technology ecosystem. Explore our friends and their contributions below.HiveMindHiveMind is a community-developed superset or extension of OpenVoiceOS. With HiveMind, you can extend one (or more, but usually just one!) instance of OpenVoiceOS to as many devices as you want, including devices that can't ordinarily run OVOS!WebsiteSource CodeTigreGóticoTimely bug fixes and chat support for OVOS are kindly sponsored by TigreGótico, official OVOS R&D partner providing Enterprise support for anything OpenVoiceOS.WebsiteSource CodeSmart'GicBuilding smart things with magic and love! We have Smart'Gic to thank for our ovos-installer and ovos-dockerWebsiteSource CodeNeonGeckoNeon was one of the first projects ever to adopt ovos-core as a library to build their own voice assistant, Neon works closely together with OVOS and both projects are mostly compatible.WebsiteSource CodeProyecto IleniaILENIA is a common and coordinated project between BSC-CNS (AINA project), CENID (VIVES project), HiTZ (NEL-GAITU project) and the University of Santiago de Compostela (NÓS project), which aims to generate digital resources that allow developing applications in the different languages ​​of Spain. The ILENIA Project collaborates with OVOS, facilitating product localization and promoting the integration of their linguistic models.WebsiteSource CodeKoninklijke VisioVisio offers information and advice, but also various forms of research, guidance, rehabilitation, education, work and living. These services are available for people who are visually impaired or blind, even if they also have an intellectual, physical or other sensory disability.WebsiteSource CodeMycroftMycroft AI started it all, it was one of the first ever FOSS voice assistants and is the project OVOS descends from. Most applications made for mycroft will work in OVOS and vice-versa.WebsiteSource CodeSecret Sauce AISecret Sauce AI is a coordinated community of tech minded AI enthusiasts working together on projects to identify blockers and improve open source tools and pipeline components in the AI assistant pipeline. This is not a voice assistant project in and of itself, rather Secret Sauce AI helps assistant projects come together as individuals and solve problems faced by the entire community.WebsiteSource Code"
year_published = 2025
