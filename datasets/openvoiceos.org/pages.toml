["https://openvoiceos.org/about"]
title = "About Us"
description = "About Open Voice OS"
full_description = '''About Open Voice OSMeet OpenVoiceOS, a newcomer in the smart speaker scene, offering a different choice from the usual options like Amazon Echo and Google Home. With OpenVoiceOS, you have control over your data and can customize your smart speaker experience. It's designed to respond accurately to your commands, whether you speak or touch the screen. OpenVoiceOS is open-source, meaning anyone can help improve it, and it can run offline for added privacy. If you're looking for a smart speaker that puts you in control, OpenVoiceOS might be the one for you.Open Voice OS is a part of a larger ecosystem of FOSS voice technologies.Check Friends ProjectsHistoryMycroftAI Kickstarter LaunchAugust 2015MycroftAI company launches Kickstarter for their Mark-1 based on a Raspberry Pi3.MycroftAI Mark 1 ReleaseSeptember 2017MycroftAI Mark 1 is released and Kickstarter campaign fulfilled.MycroftAI Mark 2 Kickstarter LaunchJanuary 2018MycroftAI launches second Kickstarter campaign for their Mark 2 device.First GUISeptember 2018The first GUI saw the day of light in a cooperation between MycroftAI and BlueSystems based on KDE framework.MycroftOS CreationOctober 2018Peter Steenbergen (j1nx) creates "MycroftOS", the first version of what will eventually become the OpenVoiceOS framework.Neglect of Community ContributionsEarly 2020MycroftAI as a company starts to neglect community contributions.Renaming to OpenVoiceOS - Mycroft EditionOctober 2020MycroftOS was renamed to OpenVoiceOS - Mycroft Edition due to trademark issues enforced by MycroftAI.Formation of OpenVoiceOS TeamOctober 2020Casimiro Ferreira (Jarbas), Aditya Mehra (AIX), and Peter Steenbergen (j1nx) join forces as Python developer, GUI/QT KDE developer, and Linux OS developer respectively.NeonCore recreated on top of OVOS and relicensed under a FOSS license"October 2021NeonCore recreated on top of OVOS and relicensed under a FOSS licenseDaniel McKnight Joins OpenVoiceOSNovember 2021Daniel McKnight, NeonAI's lead developer, joins the team.MycroftAI LayoffsNovember 2022MycroftAI lays off most of their staff. Only a skeleton crew remains.MycroftAI Partners with NeonAIFebruary 2023MycroftAI partners up with NeonAI to take over the Mark 2 fulfillments and not much later ends its business.OpenVoiceOS FundraiserMarch 2023OpenVoiceOS starts fundraiser to form a non-profit foundation legal entity.Aditya Leaves OpenVoiceOSApril 2023Aditya leaves OpenVoiceOS.Mycroft Forums MoveJanuary 2024Mycroft forums move to Open Conversational AI.OpenVoiceOS get's out of betaNovember 2024OpenVoiceOS get's out of beta and is ready for the masses.OpenVoice Foundation EstablishedFebuary 2025OpenVoice Foundation is established as a non-profit foundation legal entity.'''
