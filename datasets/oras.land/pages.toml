title = "Use the ORAS command line | OCI Registry As Storage"
description = "To list available commands, either run oras with no parameters or execute oras help:"
full_description = 'ORAS CommandsUse the ORAS command lineVersion: 1.2Use the ORAS command line To list available commands, either run oras with no parameters or execute oras help: Usage: oras [command]Available Commands: attach [Preview] Attach files to an existing artifact blob Blob operations completion Generate the autocompletion script for the specified shell cp Copy artifacts from one target to another discover [Preview] Discover referrers of a manifest in a registry or an OCI image layout help Help about any command login Log in to a remote registry logout Log out from a remote registry manifest Manifest operations pull Pull files from a registry or an OCI image layout push Push files to a registry or an OCI image layout repo Repository operations resolve [Experimental] Resolves digest of the target artifact tag Tag a manifest in a registry or an OCI image layout version Show the oras version informationFlags: -h, --help help for orasUse "oras [command] --help" for more information about a command.Edit this page'
year_published = 2025
