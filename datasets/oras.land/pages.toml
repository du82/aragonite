full_description = "Announcing ORAS v1.2.0 - OCI Spec v1.1.0 support, formatted output, and more!May 29, 2024 · 4 min readORAS CommunityThe ORAS project maintainers are proud to announce ORAS CLI v1.2.0 and ORAS-go v2.5.0. These two releases are ready for production use. ORAS CLI v1.2.0 introduces OCI Spec v1.1.0 support, formatted output, brand-new terminal experience with progress bar, and more! This article walks you through the notable features and how these enhancements benefit ORAS users as well as the cloud-native ecosystem.Tags:orasartifactRead more Lightweight Registry with Oras OCI-Layouts and Object Storage in The CloudOctober 14, 2023 · 9 min readORAS CommunityORAS Lightweight Cloud Registry​ Setting up a centralized cloud OCI registry is sometimes too much for small scale tests and proof of concepts! What if I told you there was a lightweight alternative?Tags:orascommunityRead more ORAS Welcomes New Owners, Maintainers, and Thanks Emeritus OwnersMarch 24, 2023 · 3 min readORAS CommunityWelcomes new owners and maintainers​ With a supermajority vote from the existing ORAS Organization Owners, we are excited to announce that Terry Howe and Andrew Block have been accepted as new ORAS Organization owners. In addition, Billy Zha and Feynman Zhou been accepted as ORAS subproject maintainers.Tags:orascommunityRead more ORAS 0.15 - A Fully Functional OCI Registry ClientMarch 21, 2023 · 6 min readFeynman ZhouORAS MaintainerYi ZhaORAS Contributor, Microsoft Azure Product ManagerThe OCI Registry As Storage (ORAS) project maintainers announced two releases of v0.15 for the ORAS CLI recently. ORAS v0.15.0 introduces four new top-level commands and new options to manage tags and repositories for advanced use cases. Three weeks later, ORAS 0.15.1 also released with a few known bug fixes. Since the release of v0.15, ORAS CLI has evolved into a fully functional OCI registry client.Tags:orasartifactRead more Bundle, test and deploy Gatekeeper policies as OCI imageFebruary 13, 2023 · 7 min readMathieu BenoitDevRel Engineer, GoogleORAS (OCI Registry As Storage) is an important tool out there for working with OCI artifacts and OCI registries. As one of the users and advocates of ORAS, I witnessed the growing trend in both user adoption and contributions in 2022. In this blog post I will share an end-to-end scenario with OPA Gatekeeper policies and ORAS, from including the steps from bundling to deployment. Policies are rules expressed in YAML that not only afford meeting governance requirements, but also improve the security of Kubernetes workloads and clusters. Policy engines like OPA Gatekeeper, Kyverno or even the new Kubernetes's Validating Admission Policies feature help write and enforce such policies. Once the policies are written, however, how do we easily and securely share them with different projects and teams? How do we deploy them across the fleet of clusters? How do we evaluate them as early as possible in CI/CD pipelines?Tags:orasRead more"
