title = "monthnotes – orbific weblog"
description = "Strange stories and interesting things"
full_description = "Monthnotes: January 2025 January mostly went well, considering how burned out I was in December. I started the year by swimming in Gaddings Dam on New Years Day. Despite the wind and rain, I managed a short dip. I’ve not been wild swimming for a while, and I’m looking forward to going back when it’s warmer. January has mostly been about resetting things: getting up to speed with my new client; decluttering the house; thinking about the year ahead. There have been lots of irritations – a leak, a flat tyre, a lost Kindle (which was not backed up) and so on. The local train companies have also been bad, inflicting some awful journeys on me – a 90-minute return from Blackpool that took over 6 hours, featuring taxi, bus and 2 miles on foot due to a closed road. But, as tiring and frustrating as some things were, I’m building momentum and generally happy. I walked 377,040 steps in January, an average of 12,163 daily, with my largest count being 23,245 when I walked to Todmorden and back. I made little impact on the weight I put on in December. My diet continued to be poor for most of the month but I finally got a grip on it, because it made seeing a personal trainer feel like a weird findom kink. The steps continue as a maintenance dose – I’m thinking of committing to a decent 30,000 step hike in February to get the blood flowing. The difficulty will be finding the time. Resisting the cakes at the office is challenging The January blues struck for my writing, with ideas coming slowly. I’ve also been trying to make writing feel like less of an obligation. For years, I’ve set a daily target of writing for an hour. I decided to stop this, as my goal is not really how long I write for, but how much I enjoy it and whether things are being published. So far, removing that daily goal feels positive. I did consider stopping/slowing the substack too, but decided a weekly email is overall a good thing. I like having a flow of work into the world. I’ve made more effort to go to writing events, attending a workshop and a local writer’s group. I also published a new zine in a very limited 23-copy edition as a Horkos pledge. I want to do more zines with words and photos. I’ve managed a little more reading than usual this month, including Jenny Hval’s Paradise Rot, which I received as a Christmas present from Naomi. Another gift was A Brief History of Intelligence from Tom, which turned around my thinking on a lot of topics. I also finally read Will Ashon’s Chamber Music, a set of essays around the Wu-Tang Clan. I watched Muriel’s Wedding which was great, apart from not committing to the obvious lesbian romance. Red Rooms was impressively dark. I also started watching the Oscar nominees; Nickel Boys was a great piece of work, even if I didn’t like it personally. A gallery tag on a tree turns the landscape into art I tried to spend less time on social media but found myself drawn back. It’s too easy as a default activity when I’m working on my personal laptop. I’m loving Mastodon, but Bluesky and Instagram just feel draining. I wondered if I should delete my accounts but I feel resistant, as if I will be losing something. So much of my life is caught up in a sunk cost fallacy. It’s the same with my walking streak – it feels like I would lose something if I just stopped, even though that’s ridiculous. The political discourse has added to the stress on social media; but the current situation is hard to understand. I can’t believe that Elon Musk would make what looked like a Nazi salute, and then feel no need to provide a denial or explanation. At the same time, the US media and establishment is pretending that the attack on the Capitol on January 6th 2021 was acceptable. After all the cinematic propaganda about the strength of US institutions, it’s unsettling to see how fragile they actually are. The world feels like it doesn’t make sense. New statues have been added to the Hebden Bridge grotto. Things are back how they should be. I’ve been frustrated with Spotify recently, but it has turned up an incredible artist, Midwife. I’ve been playing her recent record on repeat – how can I not fall in love with an album called No Depression in Heaven, whose lead track is Rock N Roll Never Forgets? In the past I’ve found shoegaze/dreampop less haunting or tuneful than I would like; but this is perfect. The fearsome Spine Race came through the centre of town this year I’ve been finding Spotify wearisome. It’s no longer easy to find new music, and the app constantly tries to manipulate my behaviour. All I want is to listen to music and, maybe, podcasts. It’s frustrating that I am restricted to the one official client. Ed Zitron’s Never forgive them is a great screed, and really struck home: “at the drop of a hat, hundreds of millions of people’s experience of listening to music would change based on the whims of a multi-billionaire, with the express purpose being to force these people to engage with completely different content as a means of increasing engagement metrics and revenue”. I’m still enjoying work, even though I’m finding it tricky. I’ve been playing with React at home, and wrote a blog post on whether Java has a future. David Lynch died on January 16th. I didn’t feel sad about it. He lived to 78 and made some great, uncompromising work – this seems to be a pretty good life. Also, given the announcements about his health, this was also not unexpected. I’m mostly grateful that he delivered Twin Peaks: The Return, one of the greatest pieces of art I’ve seen. I re-read Garth Ennis’s 90s comic book Preacher. I loved this at the time but a lot of the edgelord elements are uncomfortable 30 years later. The book’s racism and homophobia is vile, and the machismo feels ridiculous. But, under the bullshit, is a well-told tale about friendship. Also, I was amused to learn that I say “sure thing!” in meetings as it’s what Arseface says. I’m still actively terrified about nuclear war, and the New York Times piece The Secret Pentagon War Game That ​Offers a Stark​ Warning for Our Times hasn’t helped. I listened to Live through This and thought about how sad I was at the time it was released; such a contrast with how content I feel now. I’ve been focussed on relaxing and doing less, but this doesn’t seem to have made me less effective. To think, I could have done this at any time in my life. There was a Humble Bundle with 45 volumes of a comic book I read in the 90s. I decided not to buy it, as I wouldn’t have time to read more than a few of those collections. Maybe I’m growing wiser. I’ve been making my own stir fry sauces. It turns out to be dead easy and they taste better than the shop-bought ones. Posted on February 8, 2025Author orbificCategories monthnotesLeave a comment on Monthnotes: January 2025"
