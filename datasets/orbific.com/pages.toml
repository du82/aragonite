["https://orbific.com/monthnotes-december-2024"]
title = "Monthnotes: December 2024 – orbific weblog"
description = "Strange stories and interesting things"
full_description = "Monthnotes: December 2024 December was a long, worn-out month where I counted the days till my Christmas break. I always exhaust myself as the year ends, but this was worse then usual. I was happy enough, just burning out. It took about ten days to recover after finishing work. Christmas itself was wonderful. I cooked for my family the Saturday before, then had Rosy and Olive staying for the day itself. We had lots of delicious food, including an amazing vegan cheese selection from Honestly Tasty, and caught a couple of classic Christmas movies at the Hebden Bridge Picture-house. I then had a quiet, wholesome New Years Eve. Cameras with thermal printers are so cool The trickiest part of December was adjusting to my new work client. It’s an exciting project but the scale of everything is overwhelming. On top of that, the weekly trip to the client site is a round-trip of 5½ hours. I’d budgeted for this, but it was still a shock. I’m finding ways to improve my commute (one being to leave on the quieter 5.56 train) but there is some way to go. Despite an irregular schedule, I’ve continued my gym visits and daily steps. I walked a total of 374,259 steps, a daily average of 12,073. My peak was 17,476 steps. My fitness came second to work/celebrations and I put on 1.4 pounds which needs to come off in January. I’ve talked about my writing in 2024 elsewhere, but December was particularly busy. I gave a seminar at Chichester Uni, released the Mycelium Parish News and did a live event for the Parish News Launch. The Advent Calendar was being read throughout the month, and I think it’s the best project I’ve done – work has now started on next year’s. Having so many things happen in the same month was hard work and, as usual, nothing was marketed as well as it deserved. But I feel inspired and have some interesting ideas for future projects. We took Rosie to the pub but she got scare and hid from some other dogs. Reading for December was mostly finishing books I’d started in previous months. Three books from the month made it onto my best-of-the-year list: Ben Edge’s book on folklore was entertaining, even when going over familiar ground; Daisy Johnson’s Hotel was on of the best horror short story collections I’ve read; and the Michael Lewis book Going Infinite was a gripping book about Sam Bankman-Fried, a subject I’d not thought I would be so interested in. The paths in the woods by my house are often re-routed by fallen trees. So many of the books I’m buying are 99p offers from Kindle. If I wait long enough, everything I want to buy turns up there. Knowing this has stopped me buying hardbacks sometimes – it’s frustrating to pay full price a week or two before being offered a bargain. This can’t be good for the publishing industry. Isn’t this an amazing piece of moss? Last month, I received a couple of awards for my contributions at work. This sort of thing used to make me very cynical, but my response to my current job is very different. I love both the client and internal work, especially the conference I helped put on a few weeks ago. This is close to being the longest I’ve had a single job, and I’m amazed at my continued enthusiasm. But I do need to pace myself better. It took me over a week to clear all the piled things on my desk – which I wish I’d done sooner, given how calm I felt straight after. I tend to clutter my house easily, and I need to do something about that. I read a good forum discussion on house clearances and it made me realise how many things I’m keeping for no reason. I should be using the fancy glasses, not keeping them safe for who-knows-what. My flickr account is still live! Maybe I will start posting there again. (But perhaps I should look for a federated image service instead?) Spotify Wrapped was disappointing this year. In the past it’s suggested interesting patterns about what I listen to. This year’s just felt like engagement bait. A taxi driver asked me what my religion was – not something I’ve been asked in a long time, and I struggled to explain maltheism. I’ve continued to avoid reading news and I don’t feel like I’m missing much. I picked up a cheap copy of Far Cry 6 at the town market and it seemed underwhelming. As much as I love some video games, I find many of them banal. I completed a re-watch of Twin Peaks Season 1 and was surprised at how many scenes I didn’t remember at all, even after seeing the series several times. Simon Indelicate’s piece Metrics are the Thief of Joy is essential reading. I gave a tarot reading last week. My recall of the cards is sloppy but it was great fun. I really need to have another try at learning this. Posted on January 3, 2025Author orbificCategories monthnotes"
year_published = 2025
