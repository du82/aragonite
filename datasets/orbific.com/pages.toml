title = "A New Year: 2024/2025 – orbific weblog"
description = "Strange stories and interesting things"
full_description = "A New Year: 2024/2025 2024 has been the best year of my life so far. The future might be a scary place – not least because, at some point, I die there – but, for now, I appreciate how fortunate I am. I live somewhere beautiful, I have a job I love, and I’m happy with my writing. Living in a small town has made a huge contribution to my quality of life. I worried at first that I would be isolated but instead I feel calmer and happier. This suggests that I was finding Brighton far more stressful than I’d realised. I’ve now had my current job for two years and in February this will be the longest I’ve had a single job. I find myself eager to become a better programmer and to deepen my involvement. Work has changed from being a toad squatting on my life to something that makes me happy (although work/life balance is still sometimes tricky). I’ve written elsewhere about my writing, how happy I am with that currently, and my creative plans for next year. Reading back on last year’s post, I was complaining about the number of headaches I had. This year I have suffered far fewer. It looked like one of the main triggers was dehydration, which was easily fixed. This has been a huge improvement. Things won’t be this good forever, but I hope they stay this way for a long time. But there are things I am looking to work on. Social Media I’ve been frustrated with social media for a long time but I continue to read it. It’s definitely not worth the time spent. I need to stop social media being a default activity when I open my laptop. Social media no longer works for me as a way of communicating with people – particularly as most sites have now removed the option of receiving notifications via email. As soon as I visit the sites I’m distracted by the streams. I do enjoy writing posts for social media and sharing photographs, but it’s hard not to get caught by the distraction machine. The only place that I don’t find too noisy is Mastodon. While this is a small network, I still find it satisfying – not least because the lack of an algorithm reduces the incentives for people to make engagement bait. The main reason creatives give for not leaving social media is that it will limit their promotion – but given how bad some sites have become for this, I’m not convinced it’s a big loss. I’ll still keep the accounts open, but try to reduce my check-ins to every few days. Health and Fitness I’m making progress with my fitness – I ended 2023 having put on a lot of weight over that year and removed it in 2024. My back and shoulders are less tight, feeling better than I ever imagined they could. I’m stronger and have more energy. Having a gym membership and personal trainer has been an important commitment. But I don’t feel I’m getting value for money, particularly as the cost of living rises. I need to focus more on the training, making sure I am eating properly and doing exercise outside the gym. One positive about the training is that my hip is getting stronger, which means I can get back to running. Obviously, I’d love to set an ambitious goal for 2025, but let’s pick something modest – I want to be doing regular 5k runs by the Summer. Clutter and Burnout I ended work in December feeling very burned out; and throughout the year I’ve pushed myself too hard. I need to find ways to use my energy more efficiently. Part of this is just reducing the clutter in my life. I tidied my study after Christmas and suddenly everything felt much simpler. It’s easy to let things pile up and chaos seems to take a constant toll on me. The other aspect of this is over-committing and stressing about this. I’ve decided to stop using a daily to-do list app, switching instead to weekly lists, allowing me a little more flexibility. I’m also going to try reducing the amount of things I commit myself to. The days I enjoy most are the ones I allow myself to float a little – which also tend to be the days that I achieve most. I also want to spend a little more time disconnected from networks. Back in October I found waiting somewhere while low on phone battery. It was the first time I’d sat quietly in months – no devices, no notebooks. I was amazed at the thoughts that emerged and realised there was a part of myself that I had suppressed. I need to make more space for that. So, in summary, my goals for 2025 are: Stop wasting time with social media Exercise outside the gym Build up my running Prioritise calm by reducing clutter and commitment Posted on January 1, 2025Author orbificCategories Miscellaneous"
year_published = 2025
clearnet = "https://orbific.com/a-new-year-2024-2025"
