full_description = "Mycelium Parish News 2024 available to buy The Mycelium Parish News for 2024 has been printed, and will be launched in Sheffield on Saturday 14th December. The zine is now listed on etsy for pre-order with copies for just £2.30 (£5 outside the UK) and will be send out next weekend. This is the third time I’ve produced the Parish News with my friend Dan Sumption of Peakrill Press. The Mycelium Parish News is a collection of strange and interesting culture and events from over the last year, including podcasts, books, albums and more. This year’s text is significantly longer than the previous two issues. We’re pleased that we’ve kept the price down to £2.30 – including postage and packing – as we want to get this into as many people’s hands as possible. As with last year, we have a print run of 300 copies, after which this edition will be posted online. You can see our previous issues at the Internet Archive. The 2025 edition is already underway (a mere 270 words so far) – get in touch if there’s anything you think we should add! Posted on December 8, 2024Author orbificCategories Discordianism, Mycelium"
