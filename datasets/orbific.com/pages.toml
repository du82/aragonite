title = "My Favourite Books of 2024 – orbific weblog"
description = "Strange stories and interesting things"
full_description = "My Favourite Books of 2024 I read 55 books in 2024. Looking back, there were some obvious great ones that stood out. In alphabetical order by title, the ten best are below: I wrote a long post on Jess Richards’ Birds & Ghosts and deleted it. Birds and Ghosts is beautifully written and technically impressive. It also made me very sad. Folklore Rising by Ben Edge looks like it’s going to be a story of a man’s ‘quest’ to explore English folklore. Edge somehow salvages this unpromising concept, partly through his artwork. His accounts of folk rituals are sometimes uncomfortable – while Edge is sometimes treated as an insider, there are more occasions where he is threatened as an outsider. Edge produces a good survey of folklore and current thinking around it. I didn’t expect much when starting Going Infinite, Michael Lewis’ book on Sam Bankman-Fried. I was soon gripped by the bizarre story about how quickly someone can become a billionaire, and how suddenly that can fall apart. I was most surprised to finish the book convinced that SBF was mistreated by the justice system. It was interesting to see a discussion of Peter Singer and Effective Altruism, something I want to follow up more. Daisy Johnson’s Hotel was a beautiful book of fragile ghost stories set in a hotel. Despite this being a small book, Johnson finds many ways to explore the concept and the opening chapter is virtuosic. Live through this by Patty Schemel was another grunge biography. I already knew parts of Schemel’s story from her 2011 movie Hit So Hard. This edition was a UK release of Schemel’s biography and it tells a horrifying story about addiction, stripped of the cliches and bravado found in many other rock books. Nuclear War: A Scenario by Annie Jacobsen is terrifying and remarkable. It lays out how bad a nuclear war might be. While it’s possible that this is a very worst case scenario, the book is an urgent warning. I’ve had nightmares since reading it, and can only hope that the forthcoming Denis Villeneuve movie helps grow a movement against nuclear weapons. I tend to feel intimidated by Booker Prize winners but Paul Sampson’s Prophet Song was very readable and terrifying. Translated from the Dutch, We Had to Remove this Post by Hanna Bervoets was a short, literary novel that produced a strong sense of dread as it described the lives of online content moderators. Nostalgia is death, but Uncommon People is the best book I’ve read so far on Britpop. Rather than retelling the mainstream story Miranda Sawyer picks up some of the stranger elements of the genre, before its mainstream co-option. Wicked and Weird by Buck 65 is an unconventional biography, full of tall tales. I’d rather read a biography where things are made up than boring. Alongside my prose reading, I’ve been enjoying the new series from Kieron Gillen and Caspar Wijngaard, The Power Fantasy, which has completed its first arc. The book using superheroes as an allegory for nuclear diplomacy, producing a book where the characters have to avoid coming into conflict. It’s a gripping and horrifying work. It’s been a tricky year for reading, and I’ve found myself bogged down in unrewarding books at times. My top ten feels a little weaker than recent years too, despite a few exceptional books. As ever, I need to be more eager to discard books that aren’t rewarding. Posted on December 31, 2024Author orbificCategories Books"
