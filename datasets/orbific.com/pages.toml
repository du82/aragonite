title = "social-media – orbific weblog"
description = "Strange stories and interesting things"
full_description = "From social media back to the real world I’ve become increasingly convinced that social media – in its corporate, algorithmic form – is harmful. Not just politically, as we’re seeing from gamergate going global; but in the way it removes energy from the offline world. Last year I gave a couple of talks where I referred to Hakim Bey’s book Immediatism. Bey talks about the need for unmediated artistic interactions, but stresses the importance of these being in person: To be “too busy” for the Immediatist project is to miss the very essence of Immediatism. To struggle to come together every Monday night (or whatever), in the teeth of the gale of busyness, or family, or invitations to stupid parties—that struggle is already Immediatism itself. Succeed in actually physically meeting face-to-face with a group which is not your spouse-&-kids, or the “guys from my job,” or your 12-step Program—& you have already achieved virtually everything Immediatism yearns for. An actual project will arise almost spontaneously out of this successful slap-in-the-face of the social norm of alienated boredom. There is something alienating and banal about corporate social media. It feels like Guy De Bord’s vision of the spectacle taken to the extreme: “The spectacle is not a collection of images, but a social relation among people, mediated by images.” More than anything I wonder about how this corporate social media is draining the energy that should be used for in-person encounters. I’m not thinking of tedious nostalgia, like saying people don’t talk to strangers because of their phones. I’m thinking of things like conversations about shared interests happening online and never reaching the real world. In the last episode of Panic World podcast, Magdalene Taylor described seeing a group of women in a bar browsing Tinder while, nearby, a group of men were doing the same thing. That’s an example of what I’m thinking about – real-life conversations that are short-circuited by the internet. This month, I deleted my Instagram and deactivated my Bluesky account. It was hard – how will I keep up with the world? How will I promote my own work? The opportunity cost of leaving feels massive. But, at the same time, I definitely won’t find what I am looking for online. I want a way out of that alienated boredom. The Internet has been valuable for putting groups in touch with each other – it’s allowed geographically scattered marginalised communities to make contact and organise. But I think there is something unhealthy about the current form. I am disengaging to look for something better. PS – you can still find me on mastodon and letterboxd. Posted on February 22, 2025February 22, 2025Author orbificCategories social-mediaLeave a comment on From social media back to the real world"
