title = "orbific weblog – Page 2 – Strange stories and interesting things"
description = "Strange stories and interesting things"
full_description = "Monthnotes: November 2024 November has been very much over-committed, but I just about kept up with everything. In the second half of the month I flirted with burnout. The combination of running a training course at work and my personal deadlines put me under too much pressure. I slowed down enough to get through, but that’s something to be careful about. November in the valley has featured a lot of weather Despite the hard work, November was good for getting things done. The Secret Project – a horror advent calendar – went out after a few months of work (and a lot of folding). The text of the 3rd Mycelium Parish News zine was completed. I spoke at an event in London. And, best of all, after 13 years work, True Clown Stories has been published. It looks really good! Photo by Dan Sumption November was cold, made a little more frustrating by the fact I was supposed to be in Spain for part of it, but my business trip was cancelled. We had snow in the valley followed by an abrupt rise in temperature that melted it all, overwhelming the drainage. The town was almost flooded, with disaster averted by inches. Amidst all November’s chaos, I struggled to keep up with training. My weight lurched upwards and concerted effort was needed to keep it on track for an overall gain of just 0.1 pounds over the month. The steps continued despite the dark and cold for a total of 358,596, averaging 11,953 a day. The highest was a mere 19,948 on my trip to London. It’s been a struggle, but I’m pleased that I mostly adhered to training. The big world news was the US election. I was awake most of that night, watching the results. I gave up around dawn and went for a walk on the moors, which gave me a little perspective. As bad as the result feels, there’s nothing I can do about it. I’m annoyed that the news sources I’d read gave me no idea of the size of the victory, which suggested that I was not as well-informed by them as I had thought. Like many people, I had no idea why anyone would vote for Trump against Harris, despite half the electorate thinking he was a sensible choice. I felt that the media had flattered my prejudices rather than explaining the world to me. I immediately cut down my social media use and filtered terms related to the election. The noise on some platforms was insufferable with a large number of people stoking fear with their takes. The three weeks or so I’ve spent without reading the news is the longest I’ve done in my life, but I’m feeling better for it. I have considered using Wikipedia’s current events portal to keep up with things. Fending off burnout has meant a few very early nights in November (as in 6pm early) and making more time to read. I enjoyed Andrew Michael Hurley’s Barrowbeck, a collection of linked short stories about a fictional valley-town located near Hebden Bridge. Nicholas Royle’s book on second-hand books, Shadow Lines was a fun light read, which mentioned John Shire and Colin Lyall, my favourite booksellers. 2-Tone comics, my local shop, recommended Beneath the Tree, Where Nobody Sees, a book about a serial killer in a town of cute anthropomorphic animals. This took the concept to some clever, uncomfortable places. I also enjoyed Kieron Gillen’s We Called Them Giants. In the middle of the month, Muffy and I went to the Thought Bubble convention. This was mostly overwhelming, but I picked up some interesting things to read. Meanwhile, Keiron Gillen’s The Power Fantasy has justified the cost of reading it in single issues with some excellent cliff-hangers. I watched a few movies this month, but Maxxxine was the only one I loved, mainly because Mia Goth is so engaging. I enjoyed how Love Lies Bleeding joyfully went too far. While I didn’t love The Substance it was an amazing cinema experience. The audience perceptibly reacted to some of the unpleasantness, and a few people walked out near the end, which amazed me, given what they’d made it through to that point. But I guess that ending was A Lot. My main project at work came to an abrupt end, and it was sad to say farewell to an excellent team. After running a training course, I’ve started my new project which promises some exciting challenges. I was also pleased to be chosen as ’employee of the month’ in my local office. After so many years of hating work, I love my current job, even after two years. I’m not sure if the twenty-something me would be pleased or scornful, but I’m happy. Piss Flowers I spent a lovely afternoon in the Tate Modern with Kate Shields. I was delighted to see Piss Flowers by the Helen Chadwick. I’ve always remembered this appearing in Private Eye‘s Pseuds Corner, and being unsettled by this mockery of her artist’s statement. I hadn’t realised it was a major piece of work, so I was amazed to encounter it all those years later. We also visited Anthony McCall’s Solid Light exhibition. The display gave it little context and it’s hard not to take it as an example of ‘instagrammable art’. Solid Light – good visuals though As well as all my other writing, I worked on NaNoGenMo, where you use November to try writing software to produce a novel. My attempt was producing an oral history. The resulting text has the blandness of much LLM output and is not engaging enough to read in itself – although it’s still remarkable how easily LLMs produce plausible text. It was good to think about how LLMs work, and I very much enjoyed tinkering with a software project. I headed into London for the opening of an exhibition at the All Good Bookshop, the final act of a collective I’ve been involved in since 2019. Due to reasons I couldn’t stay for the full event, but I did give an introductory speech. It’s been an interesting project to be involved with, and its dissolution had me thinking more about the importance of Immediatism. Shrine to Donnie As pleased as I am with my work in November, I did take on more than I should have done. I want to do NaNoGenMo, the Mycelium Parish News and an advent calendar again next year, so I need to reduce their overlap. I’m also looking forward to mid-January, when I’ve cleared my last deadline and I can simply focus on playing with my writing. So, that’s November. It was a tough month, but I’m pleased with everything I achieved. I’m also glad that I managed to handle the deadlines sensibly, and rested as much as I needed to. December has some hectic commuting, but I’m excited about my (mandatory) vacation over Christmas and getting some rest. At the start of the month, I visited an amazing event which included Justin Hopper’s talk The Great Satanic Swindle. Getting the last train home meant missing the last 10 minutes, so hopefully I can catch it again. I loved Blindboy’s podcast on The Miserable Blood-Drenched History of Jaffa Cakes, which explored a simple object’s links to colonialism. My lack of news is not helping with my nuclear war paranoia. I’m not sure how everyone is so calm about this. A new shop in town, Mother, is producing some excellent bread, good enough to have me and others queueing for when it opens. Posted on December 1, 2024December 31, 2024Author orbificCategories monthnotesLeave a comment on Monthnotes: November 2024"
