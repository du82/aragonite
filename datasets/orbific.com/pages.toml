full_description = 'The problem with science fiction The LOLCat bible makes me very happy. The Adoration of the magi, for example, becomes something very strange and very funny: "After dat dey waz about to IM king herod den wun of dem sayd “o, actuly, I hasd a dream at nait timez n ceiling cat wuz like “hey sup d00d.” n I wuz liek “nm, u?” n he wuz like “nm but d00d get dis, king herod r liez tbh. He iz lookin for jesus so he cn pwn him wtf!!!?” Den I woke up bt srsly ceiling cat sed dat.” So teh other waiz d00ds saied “o wtf, I haet dat n00b king herod wtf is hiz problem” n dey all goed bak to der home in d eats bi a moar differnt way." – Mathew 2:12. This is what’s wrong with science fiction. Imagine going back to 1992 and showing this to someone, trying to explain why it’s funny. The way the world’s turning out is always a suprise. No wonder William Gibson is retreating to the present day. Posted on October 20, 2007Author James BurtCategories UncategorizedLeave a comment on The problem with science fiction James on a horse Here is a photo from Saturday’s horse-riding. Yes, I realise the helmet is not particularly flattering. Posted on October 19, 2007Author James BurtCategories UncategorizedLeave a comment on James on a horse The Great Omani is Dead I found a very sad story in today’s Argus: Ron Cunningham, known as the Great Omani, died surrounded by family and friends at his home in Norfolk Square, Brighton. He performed his final stunt- a fire-eating trick- for a film crew a week before he died… Johanna and I met the Great Omani a few years back, on his birthday. He’d been performing one of his farewell performances and we arrived too late. Despite that he came downstairs in the pub, chatted and signed our books. I was very glad to meet him. The article includes a brief poem: "They lay the Great Omani in his boxThey have done it up with nails instead of locksBut at his funeral do not fearChances are he won’t be there Posted on October 17, 2007Author James BurtCategories UncategorizedLeave a comment on The Great Omani is Dead'
