["https://orbific.com/author/admin"]
title = "orbific – orbific weblog"
description = "Strange stories and interesting things"
full_description = "Best Picture Nominees 2025 As with last year, I set out to watch the ten Best Picture Oscar nominees before the ceremony. I’d seen just two of them when the list came out and collecting the other eight has been fun. Most of these were films I wouldn’o’t have watched otherwise and I’ve liked trying something different. I’m not much good at predictions but I do think The Brutalist stands a very strong chance. However, I think I’m Still Here was the best of the ten – I would also be delighted to see The Substance become the first body horror best picture winner. Below is a list of all ten movies, in order of how satisfied I’ll be if they win the Oscar, starting from the one I liked least. Links go to my letterboxd reviews. Emilia Perez felt like a car crash, with overly simplistic politics and boring songs. I have no idea how this was put forward. Dune: Part 2 was epic science fiction story, but I found it unengaging. Too self-consciously epic, with nothing much behind the spectacle. I felt cheated by Wicked when over two-hours of run-time ended with ‘to be continued’. Up to then, I’d been enjoying it – far more than I’d expected. Like Dune: Part 2, Conclave was a fantasy movie set in a strange world. Beautifully made with a great performance from Ralph Fiennes. A Complete Unknown was entertaining, despite the mumbled dialogue, but felt like a fairly standard biopic. There’s a lot I disliked about The Substance, but it produced an intense reaction in the cinema audience I saw it with. I’d be delighted if something this extreme wins. Anora was a great movie which went to some unexpected places, with a great ending. I didn’t enjoy Nickel Boys, and I’m a little disappointed at myself for that. It tells an important story, and was beautifully made, but didn’t work for me. At over three-and-a-half hours, The Brutalist felt self consciously epic, and has stuck in my head since I saw it. Guy Pearce’s supporting role was excellent. But I’m Still Here was my favourite of the ten. The story, about a political murder, is heartbreaking, but what stood out most was the portrayal of a family enduring through difficult times. Fernanda Torres was incredible. Very glad I got to see this in the cinema. Posted on March 1, 2025Author orbificCategories MiscellaneousLeave a comment on Best Picture Nominees 2025"
