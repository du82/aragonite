full_description = "Mycelium Parish News 2024 available to buy The Mycelium Parish News for 2024 has been printed, and will be launched in Sheffield on Saturday 14th December. The zine is now listed on etsy for pre-order with copies for just £2.30 (£5 outside the UK) and will be send out next weekend. This is the third time I’ve produced the Parish News with my friend Dan Sumption of Peakrill Press. The Mycelium Parish News is a collection of strange and interesting culture and events from over the last year, including podcasts, books, albums and more. This year’s text is significantly longer than the previous two issues. We’re pleased that we’ve kept the price down to £2.30 – including postage and packing – as we want to get this into as many people’s hands as possible. As with last year, we have a print run of 300 copies, after which this edition will be posted online. You can see our previous issues at the Internet Archive. The 2025 edition is already underway (a mere 270 words so far) – get in touch if there’s anything you think we should add! Posted on December 8, 2024Author orbificCategories Discordianism, MyceliumLeave a comment on Mycelium Parish News 2024 available to buy Mycelium Parish News 2023 I’ve just published a new zine, The Mycelium Parish News 2023, in association with Dan Sumption of Peakrill Press. The Mycelium Parish News is a collection of things that have happened in our particular corner of UK counter-culture over the last year and features a list of podcasts, books, websites, events and more. It’s available on Etsy for just £2.30 including postage (£5 for overseas). What is the mycelium? It’s the word coined by Daisy Campbell for a loose network of creative people, across the UK and beyond, which emerged from a knot of discordians, KLF fans, Robert Anton Wilson afficionados, arts labs and magicians. We’ve also included lots of links that will be interesting to people we know. One inspiration for this is the counter-culture readers in the 90s, where you could pick one up and find half-a-dozen links that might change your life. We print the zine as a hard copy as we think it’s important to have a physical artefact of the year, and we work to keep it as cheap as possible. Once we’ve distributed the print copies we will put the PDF on the Internet archive (you can currently read last year’s edition). And, yes, we are already collecting things for the 2024 edition. Posted on December 16, 2023December 16, 2023Author orbificCategories Discordianism, WritingLeave a comment on Mycelium Parish News 2023"
