["https://orbital.nyc/code-of-conduct"]
title = ""
full_description = "We aspire to create a safe, inclusive, supportive and harassment-free environment that enables people to be their best selves. We expect everyone who uses our physical or online spaces—whether they’re a member, guest or program participant—to follow this Code of Conduct. Anyone who violates this code of conduct may be sanctioned or expelled at the discretion of the program directors and admins. Be polite and friendly. If you may have misunderstood something, gently ask for a clarification. Respect others when they do the same. Own your actions. Ensure that your behavior does not have a negative impact, regardless of intent. If you have wronged someone, take care to make amends. Know that acceptance and forgiveness is not owed to you. Look out for others. Create boundaries to your own behavior and consider how you can create safe space for others. If you are unsure if something is appropriate behavior, it probably isn’t. Each person you interact with can define where that line is for them. Impact matters more than intent. Anyone asked to stop any harassing behavior is expected to comply immediately. Orbital prioritizes marginalized people’s safety over privileged people’s comfort. The administrators will not act on complaints regarding: If you are being harassed, notice that someone else is being harassed, or have any other concerns, immediately contact the admins: We will respect confidentiality requests for the purpose of protecting victims of abuse. At our discretion, we may publicly name a person about whom we’ve received harassment complaints, or privately warn third parties about them. We will not name harassment victims without their affirmative consent. We reserve the right to reject any report we believe to have been made in bad faith. Reports intended to silence legitimate criticism may be deleted without response."
year_published = 2025
