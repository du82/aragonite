title = "CATIE"
full_description = "This bilingual brochure is intended to accompany HIV self-test kits. It includes visual instructions and a plain-language explanation of how to administer the test and interpret the results. Individuals interested in HIV self-testing can order HIV self-test kits from I’m Ready (Canada-wide) or from GetaKit (Ontario) Ce dépliant bilingue est conçu pour accompagner les trousses d’autotest du VIH. On y trouve des instructions visuelles ainsi que des directives en langage clair sur la façon de faire le test et de lire les résultats. Toute personne qui désire se procurer des trousses d’autotest du VIH peut en commander à partir du site J’AGIS (livrées dans tout le Canada) ou bien de GetaKit (pour l’Ontario uniquement). Register Frequently Asked Questions about CATIE's Ordering Centre Distribution and Collection Policies * Please note that some resources available through the Ordering Centre contain language, information and images related to sexuality and drug use, and may not be intended for people of all ages. CATIE ensures that these resources, developed to help prevent the transmission of HIV, hepatitis C and other infections, are written and reviewed by health experts for content accuracy. Organizations ordering these materials must review them to determine that the content is appropriate for their intended audience. Production of this website has been made possible through a financial contribution from the Public Health Agency of Canada."
