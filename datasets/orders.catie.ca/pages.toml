["https://orders.catie.ca"]
title = "CATIE"
full_description = "Did you know that hepatitis C is a leading cause of liver disease in Canada? The CATIE Ordering Centre offers a range of publications on hepatitis C prevention, testing, treatment and post-cure liver care. Read more about the liver in Hepatitis C: An In-Depth Guide The CATIE Ordering Centre distributes HIV and hepatitis C resources free-of-charge to frontline service providers across Canada. For help with finding resources or placing orders, please visit our FAQ page. The CATIE Ordering Centre is mandated to provide resources for healthcare providers and community-based organizations. We sometimes receive requests from educational institutions, and have therefore provided a list of resources that are more appropriate for these environments Introducing our new online tool to build your own posters and postcards about HIV testing. Choose from six messages and 10 images. Introducing Where to?, our new website connecting people with HIV, hepatitis C, sexual health and harm reduction services (formerly known as HIV411/HCV411). Our new and improved online directory has over a thousand listings across Canada, from testing and PrEP services to harm reduction and treatment services. Register Frequently Asked Questions about CATIE's Ordering Centre Distribution and Collection Policies * Please note that some resources available through the Ordering Centre contain language, information and images related to sexuality and drug use, and may not be intended for people of all ages. CATIE ensures that these resources, developed to help prevent the transmission of HIV, hepatitis C and other infections, are written and reviewed by health experts for content accuracy. Organizations ordering these materials must review them to determine that the content is appropriate for their intended audience. Production of this website has been made possible through a financial contribution from the Public Health Agency of Canada."
