title = "Navigating the California AI Transparency Act: New Contract Requirements"
description = "Companies that create or produce a generative AI system with more than 1 million monthly users face new contracting requirements."
full_description = "Sarah Schaedler Partner, Technology & Innovation, Technology Transactions San Francisco D+1 415 773 5474 E[email protected] See my bio Haley Flora Managing Associate, Technology Transactions, Strategic Advisory & Government Enforcement (SAGE) Silicon Valley D+1 650 614 7319 E[email protected] See my bio Companies that create or produce a generative AI system with more than 1 million monthly users face new contracting requirements intended to help California users identify AI-generated content. On September 1, 2024, California adopted the California AI Transparency Act (SB 942). This legislation is the first law to include specific contractual requirements related to watermarking AI-generated content. Given California’s influence, similar laws could soon emerge in other states, making it crucial for businesses to understand and adapt to these new regulations. The California AI Transparency Act will take effect on January 1, 2026. It targets “Covered Providers,” defined as entities that create or produce a Generative AI (GenAI) system that has over 1,000,000 monthly users and is publicly accessible in California. GenAI systems are those capable of generating synthetic content. The Act excludes providers of nonuser-generated video game, television, streaming, movie, or interactive experiences. Additionally, the Act’s requirements only apply to image, video, or audio content, and do not apply to text. Currently, the Act applies to audio, image, and video content and not text. However, future legislation may introduce similar requirements for text-based content. Additional guidance from state legislators and the Attorney General may be released prior to the Act’s effective date. Staying informed and proactive will help businesses navigate the evolving landscape of AI regulation. The California AI Transparency Act is a key component of the expanding AI regulatory landscape in California, and companies should incorporate it into their compliance framework to stay ahead of requirements."
year_published = 2025
clearnet = "https://orrick.com/en/Insights/2025/01/Navigating-the-California-AI-Transparency-Act-New-Contract-Requirements"
