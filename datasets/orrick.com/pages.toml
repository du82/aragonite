title = "ICOP to Acquire Atlantic GeoConstruction Holdings"
description = "ICOP, a leading European underground engineering company has agreed to acquire Atlantic GeoConstruction Holdings, Inc."
full_description = "Fabio Fauceglia Partner, Mergers & Acquisitions, Private Equity Milan D+39 02 4541 3800 E[email protected] See my bio Spencer Cohen Partner, Mergers & Acquisitions, Private Equity New York D+1 212 506 3502 E[email protected] See my bio I.CO.P. S.p.A. Società Benefit (“ICOP”), a leading underground engineering company listed on Euronext Growth Milan and a key player in Europe’s special foundations and microtunneling sector, recently announced its agreement to acquire Atlantic GeoConstruction Holdings, Inc. (“AGH”) a U.S. leader in geotechnical solutions. Expected to close in April 2025, this cross-border acquisition marks a pivotal moment in ICOP’s global expansion, enabling ICOP to enter and compete in the U.S. market and significantly accelerating its growth. In line with the company’s IPO strategy, this deal strengthens ICOP’s capabilities as a global leader in foundation engineering, allowing it to expand capabilities, enhance competitiveness and drive sustainable innovation. Fabio Fauceglia and Spencer Cohen led the Orrick team that advised ICOP. The team included Leonardo Pinta, Stephen Chao, Kyle Zhu, Catherine Conners, Chiara Iannuzzi, Jason Flaherty, Karen Cannon, Steve Malvey, Kimberly Loocke, Craig Falls, Danielle Mangogna, Jeanine McGuinness, Allison Bradham, Matthew Coleman, Carly Owens, Sue Cowell, Jennifer Criss, Jose Lamarque, Ramon Galvan, Nicole Walsh, Emily Lewis, Christopher Giles and Millay Kogan. He regularly represents strategic and private equity buyers as well as families and entrepreneurs in M&A transactions in a variety of sectors including, energy, oil& gas, industrials, automotive, composite materials, food and technology. Among its notable transactions, Fabio led the international team assisting General Electric on its $4.3 billion acquisition of the aviation business of Avio S.p.A. (European Private Equity Deal of the Year). He received a Master’s Degree from Columbia University in New York and is qualified both as a New York and Italian lawyer. He has been included in the 50 Italian Best Lawyers List by Legal Community."
