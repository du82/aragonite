["https://orrick.com/en/Insights/2025/01/Navigating-Carbon-Capture-in-Indonesia-A-Key-Step-Forward"]
title = "Navigating Carbon Capture in Indonesia: A Key Step Forward"
description = "Regulators have taken a significant step forward in the evolving landscape of carbon capture and storage (CCS) in Indonesia."
full_description = "Michael Tardif Partner, Renewable Energy, Energy Singapore D+1 415 773 5485 E[email protected] See my bio Ari Bessendorf Partner, Data Centers, Renewable Energy Singapore D+1 415 773 5700 E[email protected] See my bio Deska Widianto Senior Associate, Energy & Infrastructure, Banking & Finance Singapore D+65 69908404 E[email protected] See my bio Regulators have taken a significant step forward in the evolving landscape of carbon capture and storage (CCS) in Indonesia. Indonesia's Minister of Energy and Mineral Resources (MEMR) has introduced regulation No. 16 of 2024 on the Implementation of Carbon Storage Activities within a Carbon Storage Permit Area in Relation to Carbon Capture and Storage Activities (MEMR 16/2024). It provides a structured framework for non-production sharing contract (PSC) contractors to engage in carbon capture and storage beyond traditional oil and gas work areas. The regulation complements an existing regulation on the implementation, capture and storage of carbon as well as the capture, use and storage of carbon in the upstream oil and gas, namely MEMR Regulation No. 2 of 2023 on the Implementation, Capture and Storage of Carbon as well as the Capture, Use and Storage (CCUS) of Carbon within the Upstream Oil and Gas Business (MEMR 2/2023). The new regulation also highlights the government's commitment to broadening the scope of CCS initiatives. It also opens the door for more diverse players in the CCS field, fostering innovation and competition. However, the regulatory landscape remains complex, with distinct processes for PSC contractors and non-PSC entities. While PSC contractors can integrate CCS into their existing operations with relative ease, non-PSC entities must navigate a more intricate process involving auctions, tenders and licensing. MEMR 16/2024 and other measures provide a comprehensive regulatory framework that seeks to balance state control with private sector involvement to enhance Indonesia's CCS capabilities and contribute to global emission reduction efforts."
year_published = 2025
clearnet = "https://orrick.com/en/Insights/2025/01/Navigating-Carbon-Capture-in-Indonesia-A-Key-Step-Forward"
