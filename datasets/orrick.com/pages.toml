description = "Orrick’s Shannon Yavorsky shares tips to navigate AI governance in a new blog post for The L Suite, a community for in-house counsel, chief legal officers and general counsel."
full_description = 'Shannon Yavorsky Partner, Cyber, Privacy & Data Innovation, Technology Transactions San Francisco; London D+1 415 773 5731 E[email protected] See my bio A company can face legal challenges – to mention just one example – if it uses AI to generate product code that copyright can’t protect. That’s also true if a company processes sensitive client data or confidential business information through an LLM without an enterprise license agreement. Orrick’s Shannon Yavorsky shares tips to navigate AI governance in a new blog post for The L Suite, a community for in-house counsel, chief legal officers and general counsel. The post features insights from a webinar that featured Yavorsky and Laura Belmont, General Counsel at Civis Analytics. She advises public and private companies across several sectors, including life sciences and health technology, financial services, private equity, insurance, social media and technology on a range of EU and U.S. federal and state privacy laws. Shannon’s strategic counseling advice includes, but is not limited to: Shannon also helps clients undertake comprehensive privacy, cybersecurity and AI risk assessments, evaluates privacy, security and AI risks in corporate transactions and drafts and negotiates data-related contracts. She advises clients on cross-border data transfers, data breaches and developing global privacy and AI compliance programs. Please do not include any confidential, secret or otherwise sensitive information concerning any potential or actual legal matter in this e-mail message. Unsolicited e-mails do not create an attorney-client relationship and confidential or secret information included in such e-mails cannot be protected from disclosure. Orrick does not have a duty or a legal obligation to keep confidential any information that you provide to us. Also, please note that our attorneys do not seek to practice law in any jurisdiction in which they are not properly authorized to do so. By clicking "O