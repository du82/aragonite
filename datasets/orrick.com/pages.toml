["https://orrick.com/en/Insights/2025/02/California-Battery-Fires-Mitigating-Commercial-Risks-in-BESS-Transactions"]
title = "California Battery Fires: Mitigating Commercial Risks in BESS Transactions"
description = "California regulators are adopting stricter measures and proposing sweeping reforms and legislation that could impact utility-scale BESS development."
full_description = "Patrick Ferguson Partner, Renewable Energy, Solar Energy San Francisco D+1 415 773 5762 E[email protected] See my bio Rohit Sachdev Partner, Energy, Infrastructure San Francisco D+1 415 773 5813 E[email protected] See my bio Eric Stephens Partner, Renewable Energy, Mergers & Acquisitions San Francisco D+1 415 773 5529 E[email protected] See my bio Battery energy storage systems (BESS) are an essential component of California’s leading energy transition strategy, enabling the state to integrate renewable energy production, stabilize the grid and ensure a reliable energy supply. California now hosts over 13 GW of installed BESS capacity—more than 20% of its peak demand—and is projected to contract over 52 GW by 2045. In recent years, several high-profile BESS fires have intensified scrutiny, including incidents at the 139 MW Valley Center Energy Storage Facility in 2022 and 2023, the 20 MW Kearny South Energy Storage Facility in 2024 and the 250 MW Gateway Energy Storage Facility in 2024. The latest major fire, which occurred on January 16, 2025, at the 300 MW Moss Landing Energy Storage Facility, triggered a decisive regulatory shift. California regulators are now adopting stricter measures and proposing sweeping reforms and legislation that could significantly impact utility-scale BESS development. Below are some key trends and risks that developers should consider as they navigate this evolving landscape. In California, BESS projects typically require discretionary county permits—including conditional use and building permits—subject to compliance with the California Fire Code. Recent fires have led to increased scrutiny, longer permitting timelines and more stringent conditions—a trend that is likely to accelerate in the wake of the Moss Landing incident. At the state level, the California Public Utilities Commission (CPUC) is expected to vote in February on new safety measures aimed at strengthening fire prevention protocols for BESS facilities. Developers must closely monitor these changes to ensure compliance and mitigate potential risks. They should also prepare for ongoing compliance costs once projects come online and begin to operate on the grid."
year_published = 2025
