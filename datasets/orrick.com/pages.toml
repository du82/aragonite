["https://orrick.com/en/Insights/2025/01/Section-45V-Clean-Hydrogen-Tax-Credits-Final-Regulations-Released"]
title = "Section 45V Clean Hydrogen Tax Credits: Final Regulations Released"
description = "The U.S. Department of the Treasury and IRS have released final regulations for tax credits for the production of clean hydrogen under Section 45V of the Internal Revenue Code."
full_description = "The U.S. Department of the Treasury and Internal Revenue Service (IRS) have released final regulations or tax credits for the production of clean hydrogen under Section 45V of the Internal Revenue Code. The industry has eagerly awaited the final regulations, which provide more defined guidance and greater investment certainty. Placed in service: The 45V credits are available for facilities that are placed in service after December 31, 2022, and that begin construction before 2033. Taxable years: The final regulations are immediately effective and apply to taxable years beginning after December 26, 2023 (when the proposed regulations were published). For taxable years beginning after December 31, 2022, and on or before December 26, 2023, taxpayers may choose to apply the rules of Treasury Regulations Sections 1.45V-1, -2 and -4 through -6 provided taxpayers follow them in their entirety in a consistent manner. The regulations retain the “three pillars” to ensure that facilities claiming the 45V credit lead to emission reductions, but relax their application as described below. The final regulations retain requirements that the electricity used to produce the clean hydrogen comes from new, clean sources rather than from existing sources. However, the final regulations added these new options to prove incrementality: The final regulations push back the hourly matching requirement for EACs from 2028 to 2030, allowing annual matching until 2030. EACs must come from the region that corresponds to the balancing authority to which the hydrogen facility and the facility the EACs come from are electrically interconnected (rather than geographically located). The balancing authorities are in a table in the final regulations. The regulations permit interregional delivery under certain circumstances. The regulations clarify that the scope of a facility is the single production line that results in the lifecycle GHG emissions rate used to determine the 45V credit (including any carbon capture equipment or purification equipment located at the facility, if applicable)."
year_published = 2025
