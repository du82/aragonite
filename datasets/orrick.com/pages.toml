full_description = "Emily S. Tabatabai Partner, Cyber, Privacy & Data Innovation, Technology Companies Group Washington, D.C.; Houston D+1 202 339 8698 E[email protected] See my bio Speaking Engagement | September.23.2024 - September.24.2024 | 11:30am - 12:30pm (Pacific Standard Time) Emily Tabatabai will co-lead a panel on “Enforcement and Litigation Trends” at the “U.S. State Privacy Crash Course: What Is New and What Is Next” half-day workshop during the 2024 IAPP Privacy Security Risk Conference. The panel will explore recent enforcement and litigation trends from California, Texas and other states helping to read between the lines of guidance from Connecticut and other states. Emily provides strategic counseling and advice on privacy, consumer protection and online safety matters to clients across industries, including retail, ecommerce, mobile apps, gaming, social media, advertising technology (adtech), financial services, education, business services and technology. She also represents clients subject to regulatory investigations, including before the FTC and States Attorneys General, Congressional committees and other regulatory agencies and groups. Emily provides proactive compliance guidance, and regulatory investigation defense, on a variety of privacy and consumer protection laws, including: Emily is a frequent speaker on data privacy matters, with a particular focus on children’s privacy (COPPA), student data privacy and EdTech and online safety laws for kids and teens. She has been featured as an “Up and Coming” Privacy & Data Security attorney by Chambers USA and Chambers Global. Clients tell Chambers, “She’s been an excellent partner. She has a very good understanding of the practical realities of implementing privacy policies for large companies.” Citing her expertise in the field of educational privacy, student data and EdTech matters, Chambers reports that clients regard her as “very knowledgeable and truly an expert in this space,” with some saying, “On the student data side, she is unmatched,” and The Legal 500 notes that Emily “is the first port of call for child- and student-directed service providers for compliance advice with COPPA, SOPIPA and CalOPPA regulations.”"
