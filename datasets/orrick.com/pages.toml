full_description = "Irena Royzman, Ph.D. Partner, Intellectual Property, Patents New York D+1 212 506 3518 E[email protected] See my bio The New York Intellectual Property Law Association is hosting their event, “Biologics & Biosimilars: Hot Topics” with Orrick’s Irena Royzman moderating on Wednesday, February 5. Speakers will include the below: With a Ph.D. in biology from MIT and the Whitehead Institute, where she was a NSF fellow, Irena represents plaintiffs and defendants in their most complex pharmaceutical and biotech patent cases. Over the last 20 years, pharmaceutical and biotechnology innovators have relied on Irena again and again for cases involving small molecules, biologics, recombinant DNA technology, gene therapy, gene editing, manufacturing processes, formulations and drug-eluting medical devices, including numerous multi-billion dollar cases involving many of the world’s best-selling drugs. Irena has significant experience in litigation under the Hatch-Waxman Act and the Biologics Price Competition and Innovation Act (BPCIA), as well as inter partes review (IPR) proceedings, license disputes and matters with parallel ex-U.S. litigation and proceedings in foreign patent offices. Irena also helps life sciences companies and organizations develop the law in the most important cases for the biopharma industry. She has been principal counsel on numerous amicus briefs to the United States Supreme Court and the Federal Circuit in key biopharma cases. For plaintiffs, Irena has successfully defended generic challenges to patents protecting blockbuster medical therapies, including multi-billion dollar cancer, antiviral and anti-psychotic drugs. She has also represented an innovator in some of the first cases under the BPCIA, including the first involving an antibody. For defendants, she defeated a $530 million claim of patent infringement of a competitor’s biotech patent, obtaining dismissal of all claims and discovery sanctions against the patent owner. In another high-stakes case, she obtained summary judgment of noninfringement and exclusion of plaintiff’s experts under Daubert as well as a full award of attorneys’ fees."
