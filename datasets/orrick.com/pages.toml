full_description = "Thora Johnson Partner, Life Sciences & HealthTech, Cyber, Privacy & Data Innovation Washington, D.C. D+1 202 339 8463 M+1 410 375 0017 E[email protected] See my bio Georgia C. Ravitz Partner, FDA & Healthcare Regulatory, Life Sciences & HealthTech Washington, D.C. D+1 202 339 8651 E[email protected] See my bio Amy M. Joseph Partner, FDA & Healthcare Regulatory, Life Sciences & HealthTech Boston D+1 617 880 2230 E[email protected] See my bio Thora works with medical device, pharmaceutical, biotech and digital health companies, helping them navigate the increasingly complex patchwork of state and federal health privacy laws. One client described her to the Legal 500 as a “very practical” advisor providing “exceptional guidance” on health information privacy and HIPAA compliance matters. Her breadth and depth of experience enable Thora to assist clients in harnessing the power of artificial intelligence and executing data-sharing arrangements, all while protecting health data. As a result, Thora spends much of her time counseling pioneering startups and high-growth companies on responsible innovation in healthcare and life sciences. Thora brings extensive experience counseling clients, including Fortune 500 companies and brick and mortar providers, on the Health Insurance Portability and Accountability Act (HIPAA) and other state and federal health privacy and regulatory compliance regimes including: Thora routinely helps companies and large employers prepare for and respond to privacy and security incidents involving health information. She also defends clients in government investigations initiated by the OCR, OIG, DOJ, FTC and State AGs, among others. Georgia also has extensive experience in assisting clients with product recalls, crisis management and government enforcement. Her practice in this sector includes assisting manufacturers, distributors, retailers and importers on all types of FDA regulated products including pharmaceuticals, medical devices and software, wearables, health and wellness products, cosmetics, cell and plant based foods, conventional foods, ag tech, compounded drugs, and dietary supplements."
