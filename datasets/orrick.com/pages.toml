description = "Current Statement of Policy on Equal Employment Opportunity and Affirmative Action"
full_description = "It is the policy of Orrick, Herrington & Sutcliffe LLP to provide equal employment opportunity to all employees and applicants for employment and to comply with all applicable federal, state and local laws. This Policy covers all aspects of employment including: recruitment, hiring, promotion, compensation, training, discipline, termination and other terms and conditions of employment. The Policy applies to all qualified employees and applicants for employment without regard to race, color, religion, creed, sex (including pregnancy), gender (including gender identity and expression), sexual orientation, national origin, ancestry, citizenship status, age, marital status, genetic information, physical or mental disability, medical condition, veteran status and all other categories protected by federal, state or local laws, ordinances or regulations. Orrick will also undertake, through affirmative action efforts, to increase employment opportunities for minorities, women, veterans and individuals with disabilities. Orrick also has an audit and reporting system that tracks and measures the effectiveness of Orrick’s affirmative action program and shows where additional action is needed to meet Orrick’s objectives. Additionally, Orrick ensures that all employment decisions are based only on valid job requirements. Orrick will not discharge or in any other manner discriminate against employees or applicants because they have inquired about, discussed, or disclosed their own pay or the pay of another employee or applicant. However, employees who have access to the compensation information of other employees or applicants as a part of their essential job functions cannot disclose the pay of other employees or applicants to individuals who do not otherwise have access to compensation information, unless the disclosure is (a) in response to a formal complaint or charge, (b) in furtherance of an investigation, proceeding, hearing, or action, including an investigation conducted by the employer, or (c) consistent with Orrick’s legal duty to furnish information."
