["https://orrick.com/en/Events/2024/12/December-Bond-Buyer-Webinar"]
title = "Maximizing TIFIA TOD: Financing Housing Developments with Federal Funding"
description = """
The U.S. Department of Transportation&rsquo;s effort to boost affordable housing has faced&nbsp;hurdles. Despite the potential of programs such as the Transportation Infrastructure Finance and Innovation Act (TIFIA) loan program to build major infrastructure and affordable housing, high costs and certain regulatory requirements have hindered their performance.
&nbsp;
Join our upcoming webinar where legal and government professionals will discuss current obstacles to funding, how to tap into available TIFIA funding for housing near public transportation and explore alternative financing solutions to make funding more accessible and spur development."""
full_description = "Justin Cooper Partner, Public Finance, Housing Finance San Francisco; Sacramento D+1 415 773 5908 E[email protected] See my bio Matthew Neuringer Partner, Infrastructure, Transportation Finance New York D+1 212 506 5290 E[email protected] See my bio The U.S. Department of Transportation’s efforts to promote affordable housing have encountered several challenges. While initiatives like the Transportation Infrastructure Finance and Innovation Act (TIFIA) loan program have the potential to finance large-scale infrastructure and housing projects, rising costs and complex regulations have obstructed their success. Join Orrick's Justin Cooper and Matthew Neuringer as they speak with Larry Flood, Senior Advisor at the U.S. Department of Housing and Urban Development (HUD), and Adam Cray, Vice President Municipal Advisor Single Family, Multifamily at CSG Advisors on an upcoming webinar, hosted by The Bond Buyer. This program will touch on current challenges in securing funding, strategies for accessing TIFIA funds for housing projects near public transit, and explore other financing methods to expand funding access and encourage development. Justin is on the Board of Directors of the California Housing Consortium and is a past Chairman of the Bond Buyer's California Public Finance Conference. He speaks frequently at conferences and other industry events. Justin is known in the affordable housing community in particular for being a solution-oriented lawyer who understands the business fundamentals of affordable housing and real estate finance as well as being fully versed in the applicable laws and regulations. He frequently collaborates with developers and other participants in the development of new financial structures and products designed to lower overall financing costs for housing providers and thereby increase both the supply and quality of available affordable housing. Matthew is recognized nationally and globally by Chambers USA, where clients describe him as “smart, organized and responsive and offers really good insight on key issues” and “he is an encyclopedia of PPP and he does an excellent job of leading tricky conversations and getting to a point where all parties agree.”"
year_published = 2025
