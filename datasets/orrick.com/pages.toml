description = "Orrick launched in Boston on January 1, 2019. Boston is a natural, strategic fit for us, as a firm focused on serving the tech & innovation, energy & ..."
full_description = "Combatting Rare Pediatric Disease: Ipsen to Sell Priority Review Voucher 2 minute read | October.10.2024 Telehealth Transformation: Innovating Mental Health CareLife Sciences Snapshot – Q1 2025 11 minute read | February.19.2025 Financial Times Names Teresa Hill the Most Innovative Practitioner of the Year for Leadership in Data Centers and Decarbonization 1 minute read | December.11.2024 Orrick launched in Boston on January 1, 2019. Boston is a natural, strategic fit for us, as a firm focused on serving the tech & innovation, energy & infrastructure and finance sectors globally. Our founding teams in Boston focus on cyber, privacy & data innovation – both litigation and advisory work – and intellectual property. Our cyber, privacy and data innovation team supports clients with the full range of advisory, litigation and enforcement needs, whether it’s navigating precedent-setting data breaches or guiding clients through the evolving patchwork of privacy and cybersecurity laws. Our top-tier trademark, copyright & media litigation team, including David Hosp, Mark Puzella, Sheryl Koval Garko and Caroline Simons, brings deep trial experience and has worked to protect some of the most recognizable brands in the world. They have assisted companies at all stages with developing comprehensive strategies to avoid litigation where possible, and to succeed in litigation when necessary. They have litigated several of the most complex and closely watched trademark and copyright cases of recent years. The team also has extensive experience in related areas of litigation, including trade secret and false advertising class action disputes. Our corporate team, led by Gregg Griner, counsels life sciences and tech companies in all stages of the corporate life cycle, from startups to public companies. We advise on formations, employment and compensation, equity and debt financings, commercial transactions, corporate governance, mergers, acquisitions, divestitures, joint ventures, strategic partnerships and initial and follow-on public offerings. We represent both domestic and foreign venture capital and private equity firms in their investments in early- and later-stage companies, and in complex leveraged transactions and restructurings. We also act for leading investment banks in their underwriting of public equity and debt offerings."
