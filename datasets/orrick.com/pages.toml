full_description = "Section 48 Energy Investment Tax Credit: Final Regulations Released 10 minute read | December.19.2024 John Eliason Partner, Tax, Renewable Energy Washington, D.C. D+1 202 339 8546 E[email protected] See my bio The U.S. Department of Treasury has released final regulations for the Section 48 Tax Credit, also known as the Investment Tax Credit (ITC). While the rules maintain the core framework of the previously proposed guidance, the final regulations provide important clarifications and other helpful changes which will be of interest to market participants seeking to maximize the availability of these valuable federal income tax benefits. Join Orrick’s John Eliason, Wolf Pohl and Mark Christy for a candid discussion as we explore these latest developments. John advises major financial institutions (tax equity investors and infrastructure funds), lenders, developers, and sponsors, particularly those in the wind, solar, storage, biomass and energy tech space. He helps clients structure financings for their projects to take advantage of federal and state tax incentives, like the Federal production tax credit (PTC), energy investment tax credit (ITC) and accelerated depreciation (MACRS and “bonus”) using partnership flips, sale-leasebacks, public/private partnerships, and other structuring options. He has been particularly focused on providing clients with the latest guidance and opportunities relating to the Inflation Reduction Act, including with respect to Section 6418 tax credit transfers and Section 6417 direct pay opportunities. Recognized by Chambers USA and Chambers Global in Band 2 for Projects: Renewables & Alternative Energy, clients describe John as “extremely knowledgeable, flexible and can put technical jargon into plain terms.” Client sources also state “he knows the tax equity markets very well and is very commercial.” Prior to law school, John founded an information management company based in Austin, Texas. He is also a veteran of the Texas Army National Guard."
