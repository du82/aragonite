title = "The Sedona Conference - Global Regulation of AI: Implications for Cross-Border Data Transfers, Privacy, and Data Security"
description = "Join us at the Sedona Conference where Dr. Christian Schröder will moderate the Global Regulation of AI discussion."
full_description = "Dr. Christian Schröder Partner, Cyber, Privacy & Data Innovation, Technology Transactions Düsseldorf D+49 211 3678 7269 E[email protected] See my bio Join us at the Sedona Conference where Dr. Christian Schröder will moderate the Global Regulation of AI discussion. Dr. Schröder, along with a panel of expert attorneys, academics, and regulators, will delve into emerging regulatory frameworks worldwide, focusing on the European Union’s Artificial Intelligence Act (AI Act), set to take effect in 2026. The panel will also explore key regulatory AI-related developments in Brazil, Canada, the U.S., China, Taiwan, South Korea, the UAE, and the UK. Additionally, they will discuss significant guidance from international organizations such as the OECD’s AI Principles, the Council of Europe’s Framework Convention on Artificial Intelligence, Human Rights, Democracy and the Rule of Law, and UNESCO’s Recommendation on the Ethics of AI. Christian helps clients consider the privacy and artificial intelligence implications of new technology, supports their compliance programs, and helps them stay ahead of enforcement trends. One particular focus of his work deals with internal data transfer agreements, external data transfers with external providers, and product launches that comply with international data protection standards, as well as privacy requirements for connected cars. Furthermore, Christian provides guidance on privacy and data protection considerations for developing, acquiring, using, licensing and selling technology, data and intellectual property, including M&A transactions and IP focused joint ventures. He supports companies on the set-up of webshops, outsourcings, license agreements, in cases of trademark or unfair and deceptive trade practice issues, as well as on hard and software license and information technology (IT) project agreements. Christian maintains strong working relationships with German data protection authorities and EU regulatory authorities with jurisdiction over privacy and data security matters. He effectively defends companies in cybersecurity and privacy-related investigations initiated by EU regulatory authorities. He also engages with authorities on behalf of clients and helps clients avoid proceedings and possible litigation. When litigation can't be avoided, Christian vigorously defends his clients."
