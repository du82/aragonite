full_description = "“Orrick appreciates that work-life balance is an essential part of overall health and happiness of team members.” “People genuinely care about you here. They take the time to get to know you as a person, and they go above and beyond to integrate you as part of the team to make a meaningful impact.” Join our U.S. Professional Staff Talent Community to stay up to date on the latest happenings at Orrick. They collaborate with lawyers on cases and deals and bring diverse employment and academic backgrounds. Our largest staff team helps power the Global Operations & Innovation Center in Wheeling, West Virginia, the first center of its kind at a U.S.-based law firm. For many roles, we focus less on whether you’ve worked in a law firm and more on your commitment to innovating, thinking creatively and providing exceptional client service. We offer comprehensive health and wellbeing benefits for the whole family, including 16 weeks off for staff and lawyers who are new parents (more for those who give birth) plus generous time-off and retirement plans. Fortune ranks Orrick as one of the 100 Best Companies to Work For. Financial Times consistently has named us a Top 3 Most Innovative Law Firm. Paralegals work on sophisticated platforms like Orrick CaseStream, a customized case-management system that helps us manage complex litigation, and MAPE 2.0, a blend of interconnected tech tools, new roles, workflow and process changes that helps us better serve clients in mergers and acquisitions. We emphasize teamwork, innovate in everything we do and view leadership as making the people around you better. Discover flexibility, training and access to the best tech in an unstuffy, inclusive culture that stresses collaboration and respect. Please do not include any confidential, secret or otherwise sensitive information concerning any potential or actual legal matter in this e-mail message. Unsolicited e-mails do not create an attorney-client relationship and confide