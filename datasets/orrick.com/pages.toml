description = "Consistent with our commitment to help our clients achieve their sustainability goals, we are focused on the sustainability of our global operations."
full_description = 'Consistent with Orrick’s commitment to supporting our clients in achieving their sustainability goals, the firm is focused on the sustainability of our own global operations. This includes establishing a science-aligned greenhouse gas (GHG) emissions reduction target to reduce Scope 1 and Scope 2 GHG emissions by 42% by 2030 from a 2022 baseline. We consider this target science-aligned because it requires a 4.2% annual linear reduction between 2020 and 2030 – and thus aligns with scientific recommendations from the UN Intergovernmental Panel on Climate Change to limit Earth’s warming to 1.5 degrees Celsius above pre-industrial levels. We are advancing progress toward this target by opting into green power purchase programs for our offices where feasible, reducing square footage per team member, implementing energy efficiency measures in connection with new office buildouts, and purchasing renewable energy credits to address a portion of Scope 2 GHG emissions, all under the oversight of our Chief Sustainability Officer. We are also grateful for the opportunity to advise companies and funds pursuing the world’s most innovative decarbonization strategies. During the 24 months leading up to June 2024, our team has helped clients direct $78B toward energy transition, including through: Please do not include any confidential, secret or otherwise sensitive information concerning any potential or actual legal matter in this e-mail message. Unsolicited e-mails do not create an attorney-client relationship and confidential or secret information included in such e-mails cannot be protected from disclosure. Orrick does not have a duty or a legal obligation to keep confidential any information that you provide to us. Also, please note that our attorneys do not seek to practice law in any jurisdiction in which they are not properly authorized to do so. By clicking "OK" below, you understand and agree that Orrick will have no duty to keep confidential any infor