["https://orrick.com/en/News/2024/10/Orricks-Rene-Kathawala-Named-Human-Trafficking-Legal-Centers-Advocate-of-the-Year"]
title = "Orrick’s Rene Kathawala Named Human Trafficking Legal Center’s Advocate of the Year"
description = "The Human Trafficking Legal Center presented Orrick Pro Bono Counsel Rene Kathawala with The Advocate of the Year Award."
full_description = "The Human Trafficking Legal Center presented Orrick Pro Bono Counsel Rene Kathawala with The Advocate of the Year Award at the organization’s annual gala. This award recognizes Rene’s remarkable decadelong commitment to pro bono advocacy on behalf of trafficking survivors, including leading a team of more than 100 Orrick lawyers and staff involved in this work. Most recently, Rene led Orrick’s team in publishing a series of practice legal guides for prosecutors and advocates to address the worldwide problem of sexual abuse of children by perpetrators traveling abroad. “Child sexual exploitation in travel and tourism plagues communities across the globe, and accountability for the perpetrators is all too rare,” Rene observed. The Orrick guides, co-published with The Human Trafficking Legal Center, focus on holding perpetrators from countries outside the United States accountable in their home jurisdictions for extraterritorial crimes. The guides’ impact is real: they have been downloaded nearly 1,000 times since publication, and thousands more have been distributed by the center. Rene and team created the guides both through extensive research into the laws of each foreign jurisdiction and their experience winning in federal court for trafficking survivors. These teams have also won T visas for survivors to remain safely in the country. Thank you, Rene, for your leadership. Rene works with other pro bono counsel and legal services nonprofits to increase the quantity and quality of pro bono representation that is being provided to indigent clients in each of the cities worldwide where Orrick has a presence. In addition, he supervises and directly works on cases in such diverse areas as immigration law, family and matrimonial law, housing law, public benefits law, employment law counseling, impact litigation and nonprofit advice and counseling. Rene has worked on many substantial matters in the federal and state systems over his career that are reported as precedent. He also works with firm attorneys to strengthen the firm's innovative Impact Finance team that he founded and that provides representation in diverse transactional areas to nonprofit, for profit and hybrid organizations dedicated to providing basic services to poor persons around the world in areas including microfinance, water, education, energy, housing and health."
year_published = 2025
