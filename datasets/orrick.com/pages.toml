["https://orrick.com/en/Insights/2025/03/Orrick-2025-Global-Offshore-Wind-Report-Decarbonization-Goals-Buoy-Offshore-Wind"]
title = "Orrick's 2025 Global Offshore Wind Report: Decarbonization Goals Buoy Offshore Wind"
description = "Global momentum toward decarbonization has fueled steady growth in offshore wind."
full_description = "Adam Smith Partner, Energy, Renewable Energy London; Singapore M+44 7921 108 554 E[email protected] See my bio Evan Stergoulis Partner, Energy, Renewable Energy London D+44 20 7862 4605 E[email protected] See my bio Minako Wakabayashi Partner, Renewable Energy, Infrastructure Tokyo D+81 3 3224 2926 E[email protected] See my bio Paul Zarnowiecki Partner, Energy & Infrastructure, Renewable Energy Washington, D.C. D+1 202 339 8452 E[email protected] See my bio Forecasters see the industry growing 28 percent worldwide in the five years ending in 2028. They expect developers to add 138 GW of capacity in that time, spurred on by decarbonization commitments and energy-transition innovations. The goal of world leaders to triple renewable capacity by 2030 sets the stage for growth for the next few years, but challenges remain. Inflation, supply-chain constraints and increased capital costs have buffeted the sector in recent years. Some obstacles have receded, but lingering inflation and uncertain public support in some markets may affect the investment and development landscape, including in the United States where recent changes in federal policy may delay some future offshore project development. Against this backdrop, Orrick’s Global Offshore Wind Report for 2025 delves into trends and developments from more than 30 countries. The report details market-specific regulatory frameworks, including details on licensing and permitting. Investors, developers and other market participants also can consult the report to: The report provides information from 31 countries, from offshore wind pioneers like Denmark to development leaders in China to more recent market entrants in places such as Colombia, Estonia and the Philippines. Our global offshore wind team is collaborating on a range of mandates across Asia, Europe and the United States. Some of our credentials are included in the report. We are proud to assist our clients with their significant projects in the offshore wind sector and look forward to continuing this work and helping move the sector forward in the years to come."
