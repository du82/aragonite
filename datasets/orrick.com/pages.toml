full_description = 'Giji John Partner, Responsible Business, Mergers & Acquisitions Houston; Singapore D+1 713 658 6630 E[email protected] See my bio Michael Tardif Partner, Renewable Energy, Energy Singapore D+1 415 773 5485 E[email protected] See my bio Minako Wakabayashi Partner, Renewable Energy, Infrastructure Tokyo D+81 3 3224 2926 E[email protected] See my bio Partners from Orrick’s Singapore office with deep experience in the South-East and South Asia energy markets will discuss recent developments, trends and challenges, with practical advice based on their recent real-world experience in the region. This event will be particularly valuable for business and in-house legal team members at Japanese companies investing in energy projects or looking to acquire power, including through corporate PPAs, in the region. *This event is hybrid; you can participate either in-person (limited seats on a first come first-served basis) or virtually (connection details to be presented upon registration). Karthik has a strong focus on the renewable energy sector with extensive experience in solar, onshore and offshore wind, biomass, and waste-to-energy projects across the region. Karthik is highly regarded in the market for his in-depth regulatory knowledge and significant transactional experience. Clients laud him for his commercial approach and deep regional background. He has extensive experience advising developers, sponsors, borrowers and financial institutions, including banks and multilateral lending institutions, on a wide range of renewable energy projects in jurisdictions such as Bangladesh, India, Indonesia, Sri Lanka, Singapore, Taiwan, Vietnam, Thailand, Myanmar, Philippines, China and Australia. Karthik is a top-ranked lawyer in the Chambers Global and Asia Pacific directories as well as by Legal 500 and India Business Law Journal. Clients describe him as a “top-notch lawyer” and is “known for his project finance capabilities, particularly in the renewable energy segment.” They also note that he “deeply understands the business needs and stakeholder expectations and has time and again proven to have our 100% confidence in his counsel.” Clients extol his India-focused project finance practice, commending him for his "second to none" knowledge of Indian law and practice and noting a particular acquisition of an Indian company where "his ability to understand unique local issues" was "amazing."'
