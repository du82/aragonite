description = "Our Seattle office counsels the Pacific Northwest&rsquo;s leading companies in high-stakes litigation, public policy matters, and corporate transactions."
full_description = "Anthropic Raises $3.5 Billion to Advance AI Development and Expand Compute Capacity 1 minute read | March.03.2025 Telehealth Transformation: Innovating Mental Health CareLife Sciences Snapshot – Q1 2025 11 minute read | February.19.2025 Total Access Japan - Top 5 Takeaways from Recent Data Breaches and Enforcement Actions October.29.2024 Our White Collar team is one of the go-to practices in the market. Audit committees of Fortune 250 companies call on our team to conduct internal investigations in regard to the Foreign Corrupt Practices Act (FCPA), accounting, compensation and other issues. We also serve as counsel in investigations by state and federal authorities, and in related criminal and civil litigation. Our Seattle Public Policy team is led by Rob McKenna, who served two terms as Washington State's Attorney General and represents a range of clients in State AG investigations, regulatory issues, and litigation. Aravind Swaminathan is co-head of our global Cyber, Privacy & Data Innovation practice. He resides in Seattle and formerly served as Assistant U.S. Attorney for the Western District of Washington, where he led the agency’s cybercrime outreach program. Our Seattle team advises technology companies in corporate and IP matters. We are a Microsoft panel firm, and our Seattle team is active in patent litigation for the company. We have also represented Microsoft in numerous strategic investments, including its recent participation in Uber’s capital raise; its serial acquisitions of Havok, a Dublin-based leading provider of 3-D physics; and Solair, an Internet of Things (IoT) software start-up based in Bologna. Our Public Finance team represents Washington and Alaska issuers, among others, and underwriters and public-private partnerships (P3). We’re active in financings for power, transportation, water and other issuers, including for P3 projects nationwide. Our Supreme Court & Appellate team is one of the most respected appellate practices in the country and has become a destination for bet-the-company and industry-changing appeals. We have an excellent track record in high-stakes and high-value corporate disputes, drawing from a strong team of appellate attorneys with extensive experience in the Supreme Court and wider federal courts of appeal."
