["https://orrick.com/en/News/2024/09/Pro-Bono-Win-for-Veterans-Highlighted-in-National-Law-Journal"]
title = "Pro Bono Win for Veterans Highlighted in National Law Journal"
description = "Orrick associate's precedent-setting pro bono appellate win for veterans in Federal Circuit is featured in National Law Journal"
full_description = "Jonas Wang Senior Associate, Supreme Court & Appellate Washington, D.C. D+1 202 339 8484 E[email protected] See my bio Mel Bostwick Partner, Supreme Court & Appellate, Intellectual Property Washington, D.C. D+1 202 339 8483 E[email protected] See my bio Jonas told the publication that associates can capitalize on pro bono service to gain appellate argument experience. “[U]nfortunately due to the lack of legal counsel available for a lot of these cases—criminal appeals, immigration appeals, veterans appeals—it can be more common for oral argument opportunities to come to associates through the pro bono route,” Jonas told NLJ. “But it is no less valuable than any other kind of experience because you are still before those judges. I think there’s no better experience than getting those early pro bono arguments.” Jonas has represented clients in the technology sector in federal and state courts across the country, with argument experience in the federal courts of appeals. Before joining Orrick, Jonas served as a law clerk to Judge Beverly B. Martin of the U.S. Court of Appeals for the Eleventh Circuit and Judge Analisa Torres of the U.S. District Court for the Southern District of New York. A graduate of Yale Law School, Jonas was an Articles and Essays Editor for the Yale Law Journal and a member of the Veterans Legal Services Clinic. Jonas previously served as a staff attorney at a leading nonprofit and litigated in federal district and appellate courts challenging adverse effects from criminal fines and fees. Mel’s practice capitalizes on two of her passions: technology and great writing. As an appellate lawyer, she has the opportunity to help companies protect their innovations and their intellectual property. She is adept at translating complex technology and intricate legal issues into a clear and simple presentation that judges of any background can understand. Mel brings these skills to bear in representing clients on appeal to the Federal Circuit and before the Supreme Court, and also in partnering with trial teams to address legal and strategic problems in district court, the ITC, and the PTAB. She also regularly advises technology clients on difficult IP and strategic issues facing their companies."
