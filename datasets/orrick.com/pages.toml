["https://orrick.com/en/Events/2024/05/Navigating-Risks-from-Across-the-49th-Parallel"]
title = "Navigating Risks from Across the 49th Parallel: Insights for Canadian and U.S. Companies"
description = "As the threat of IP litigation continues to rise, companies operating in Canada and the U.S. face unique challenges. Join Orrick, Osler and CLO panelists from ONxpress Operations and ToolsGroup for a thought-provoking conversation that explores the dynamic landscape of cross-border IP litigation."
full_description = "Tim Carroll Partner, U.S. International Trade Commission, Trade Secrets Litigation Chicago D+1 312 924 9891 E[email protected] See my bio Laura A. Wytsma Partner, Intellectual Property, Patents Los Angeles D+1 213 612 2389 M+1 626 840 5831 E[email protected] See my bio As the threat of IP litigation continues to rise, companies operating in Canada and the U.S. face unique challenges. Join Orrick, Osler and CLO panelists from ONxpress Operations and ToolsGroup for a thought-provoking conversation that explores the dynamic landscape of cross-border IP litigation. From navigating the nuances of IP disputes and litigation risks facing businesses today, to the intricacies of multijurisdictional disputes and attorney-client privilege considerations, our panelists offer tailored insights for both American and Canadian businesses. This recorded session uncovers strategies for leveraging the unique advantages and challenges of IP litigation across the U.S.-Canada border. Gain essential knowledge to empower your legal team in effectively managing disputes, protecting IP rights and maximizing opportunities in the North American market. To apply for CLE credit in New York, a completed New York Self-Study affirmation must be sent to Jane Gracey. Completing the evaluation form is optional. This transitional continuing legal education course has been approved for a maximum of 1.0 credit hour, of which 0.5 credit hours can be applied toward the areas of professional practice requirement and 0.5 credit hours can be applied toward the area of ethics. To apply for CLE credit in California, you must complete a California Self-Study Form and keep it for your records. You do not need to submit this form to anyone. Completing the evaluation form is optional. This continuing legal education course has been approved for a maximum of 1.0 credit hour, of which 0.5 credit hours can be applied to the general requirement and 0.5 credit hours can be applied to the ethics requirement. A completed General Self-Study Form must be sent to Jane Gracey. Orrick, Herrington & Sutcliffe LLP will do our best to obtain credit if applicable, but we cannot guarantee that CLE credit will be approved in your jurisdiction. Orrick, Herrington & Sutcliffe LLP is an accredited MCLE provider in the states of New York and California."
