["https://orrick.com/en/Insights/2024/12/Section-48-Energy-Investment-Tax-Credit-Final-Regulations-Released"]
title = "Section 48 Energy Investment Tax Credit: Final Regulations Released"
description = "The U.S. Department of the Treasury and IRS have released final regulations for the energy investment tax credit under Section 48 of the Internal Revenue Code."
full_description = "The U.S. Department of the Treasury (Treasury) and Internal Revenue Service (IRS) have released final regulations for the energy investment tax credit (ITC) under Section 48 of the Internal Revenue Code, which was significantly revised and expanded by the Inflation Reduction Act (IRA). The regulations in effect at the time the IRA passed had not been revised since 1987, so Treasury focused significant time and attention to drafting final regulations that address several issues arising from the new IRA provisions as well as technological advancements. The final ITC regulations follow previous IRA final regulations regarding the prevailing wage and apprenticeship (PWA) requirements and tax credit transfer rules. For property that begins construction on or after January 1, 2025, the “tech-neutral” clean energy investment credit under Section 48E is available. Proposed regulations for Section 48E were released in June, but final regulations have not yet been released. The Section 48E credit adopts a tech-neutral approach to property placed in service at a qualified electricity generating facility for which the anticipated greenhouse gas emissions rate is not less than zero. Overall, Treasury has emphasized a function-oriented, rather than technology-oriented, approach to determining the equipment or components that may constitute ITC-eligible energy property. For this reason, with some exceptions, Treasury declined to add specific examples of energy property that some commenters requested (see below for revisions to qualified biogas property). The final rules adopt the proposed rules’ approach in characterizing energy property as including a unit of energy property that is an integral part of energy property. Orrick observation: Treasury’s emphasis on function rather than form provides flexibility for future advances in technology. With respect to solar energy property, the regulations treat the unit of energy property as all the solar panels connected to a common inverter. Prior guidance did not explicitly say what constitutes a unit of energy property for solar energy property."
year_published = 2025
