full_description = "California Battery Fires: Mitigating Commercial Risks in BESS Transactions 5 minute read | February.06.2025 The Sedona Conference - Global Regulation of AI: Implications for Cross-Border Data Transfers, Privacy, and Data Security July.10.2024 Our nationally recognized teams focus on white collar defense and corporate investigations, employment and commercial litigation, public policy and insurance regulation, municipal finance, and municipal restructuring. We represent leading public and private companies as well as the state of California and local governments. Our Sacramento team has a distinguished trial record. Our trial lawyers secured a $52.8 million judgment for Sierra Railroad in a trade secrets case that was named one of the top results of the year by Daily Journal and Law360. Our results in complex wage-and-hour cases and other employment matters for clients such as CVS, AT&T and Sears helped us earn Employment Litigation Department of the Year accolades from The Recorder three times in a row. Our White Collar team handles corporate investigations and criminal matters for major international companies. Our Public Policy team helps a wide array of clients – from disruptive tech startups to Fortune 50 stalwarts – when they face vexing regulatory and statutory barriers to their business success. We clear those barriers by deploying a unique mix of nationwide expertise working with state legislative, executive branch, regulatory and justice departments. The team develops and implements cutting-edge strategies that integrate public policy advocacy with litigation to solve problems and bring law in line with innovation. Our Public Finance team serves as bond, disclosure and underwriter’s counsel for the state of California, local governments, special districts and nonprofit organizations. We also play a leading role in our national Health Care Finance practice, working with many of the largest health care systems throughout the country. Our Municipal Bankruptcy practice represents institutional and governmental creditors and debtors involved in complex restructurings, both in and out of bankruptcy court. Our team was twice named Dealmaker of the Year by The American Lawyer for precedent-setting work helping the cities of Stockton and Vallejo seek bankruptcy relief."
