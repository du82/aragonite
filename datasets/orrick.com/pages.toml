full_description = "Anthropic Raises $3.5 Billion to Advance AI Development and Expand Compute Capacity 1 minute read | March.03.2025 Orrick's 2025 Global Offshore Wind Report: Decarbonization Goals Buoy Offshore Wind 2 minute read | March.04.2025 Orrick Recognized for Suriname’s “Sovereign Restructuring of the Year” by LatinFinance 1 minute read | February.06.2025 The office is also home to teams that align with the sectors and subject matters areas Orrick is known for globally, including a focus on technology, energy and infrastructure, intellectual property and finance. Our multidisciplinary Strategic Advisory & Government Enforcement (SAGE) group features alums from Congress, DOJ, SEC, FTC, CFPB and other regulatory and policymaking entities. We deliver business-focused advice, drawing perspectives from financial services regulatory and enforcement, white collar, privacy and cybersecurity, competition, public policy, trade and technology transactions. We go to trial—and win—for our clients with a team The American Lawyer recognized as finalists for the 2023 Litigation Department of the Year. Our D.C. team handles a diverse docket with a deep bench drawn from former prosecutors, regulators and clerks to the nation’s highest courts. We’ve built our firm by attracting top talent that aligns with our global sector focus on technology, energy and infrastructure, finance and life sciences. Our D.C. office reflects this strategy and serves clients in almost every industry segment and practice area that Orrick is known for. A dedication to public service drives many who live and work in the Capital Region. Lawyers and staff in our D.C. office demonstrate this shared commitment through pro bono legal services, advocacy and volunteerism. We are leading supporters of numerous legal aid organizations and other community organizations. Through the Orrick Cares program, we’ve partnered with local elementary schools, supported the Washington Humane Society, and supported initiatives in underserved communities throughout the District. We also created a national Veterans’ Legal Career Fair, a one-of-its-kind annual event that connects legal employers nationwide to lawyers who are veterans or active-duty service members preparing to transition out of the military."
