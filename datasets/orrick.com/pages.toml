["https://orrick.com/Locations/Orange-County"]
title = "Orange County"
description = "Our Orange County team focuses on providing corporate, finance, litigation and IP support to businesses based in California and worldwide."
full_description = "Navigating the California AI Transparency Act: New Contract Requirements 4 minute read | January.31.2025 The Sedona Conference - Global Regulation of AI: Implications for Cross-Border Data Transfers, Privacy, and Data Security July.10.2024 Financial Times Names Teresa Hill the Most Innovative Practitioner of the Year for Leadership in Data Centers and Decarbonization 1 minute read | December.11.2024 Corporate, M&A and Private Equity. Our Orange County corporate team advises companies, PE funds and family offices in tech, medical devices, beauty, health care, consumer products and manufacturing. We work with companies at all stages in the corporate lifecycle, including M&A and private equity, securities transactions, reorganizations and other corporate matters. Public Finance. Orange County is home to several members of our nationally dominant public finance team, which represents the State of California and its municipalities in raising capital and funding innovative public projects. Intellectual Property. Our Orange County team members have engineering backgrounds and deep knowledge of the challenges confronting the medical device, biotechnology, electronics and telecommunications industries. We understand the complex issues STEM companies face when protecting their most innovative work. We have extensive experience representing biomedical and IT startups, entrepreneurs, venture capitalists and other players in the high-growth space. Nearly all members of our Orange County IP team are registered to practice before the U.S. Patent and Trademark Office, and we frequently advocate for clients before the Patent Trial and Appeal Board. We collaborate with colleagues across the United States and in China, Japan and Taiwan, with a particular focus on serving Taiwan-based businesses in electronics and technology. Commercial Litigation. Our Orange County litigators represent clients in complex commercial litigation across the United States at both the trial and appellate levels, including in consumer class actions, unfair competition, trade secrets theft and product liability claims. Our team has handled disputes over a broad range of subjects, from amplifiers and art to school construction. Recently we’ve successfully defended Xponential Fitness against an Anti-SLAPP motion and helped BBB Industries with a trade secret dispute. And we’re at the forefront of the new wave of “cost of insurance” litigation, acting for institutional investors that invest in life insurance in the secondary markets."
