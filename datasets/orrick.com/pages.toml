["https://orrick.com/en/Events/2024/11/Effective-Management-of-Employee-DSAR-Requests"]
title = "Effective Management of Employee DSAR Requests: Practical Strategies and Compliance Insights"
description = "Explore the intricacies of handling employee data subject access requests (DSARs), using the UK process as a model while incorporating key EU considerations."
full_description = "Laura L. Becking Partner, Employment Law & Litigation, Compensation & Benefits New York D+1 212 506 5113 E[email protected] See my bio Adele Harrison Senior Associate, Cyber, Privacy & Data Innovation, Internal Investigations London D+44 20 7862 4600 E[email protected] See my bio We will examine common scenarios where employee DSARs are received, identify trends, and discuss practical approaches for companies to address these requests. This session will emphasize the critical intersection of data privacy and employment law. Her practice is unique in the market. In addition to leading Orrick’s Global Employment & Equity Compensation practice; she is also integrated into the firm’s top-tier employment practice and compensation and benefits practice, enabling her to offer comprehensive solutions for the modern workplace. Her strategies extend beyond regulations and compliance, into the company’s overall culture and societal nuances of their local workforce. By blending these elements, her targeted plans address a wide range of issues, including hiring, performance management, terminations, discrimination, reclassification, HR data privacy compliance, employee handbooks and policies. She also helps implement employee equity and other compensation and benefits arrangements outside the United States, and covers all aspects of securities, foreign exchange and tax filings triggered by such rollouts. Whether working with a pre-IPO start-up or an international corporation, Laura remains focused on her client’s human capital. Laura’s distinctive approach places her in high demand for corporate transactions, in particular IPOs and acquisitions. She advised on the employment and/or equity compensation aspects of a leading global technology company and a multinational digital communications technology conglomerate’s global acquisitions; various global transactions for GoPro, Sabre, and a U.S. social media company; the pre- and post-merger integration for DigiCert’s acquisition of Symantec’s Website Security Business; as well as the global acquisitions and global tender offers for a large number of pre-IPO clients. She has also advised companies such as Alcon, Pinterest, Elasticsearch, GitHub, Nvidia, Optimizely, Scale, Twist, Viasat, and Vice on global employment and equity compensation matters and transactions."
