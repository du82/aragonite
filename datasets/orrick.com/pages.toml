full_description = 'Novel Bond Offering Provides More Affordable Housing in Portland, Oregon at Lower Cost 3 minute | January.24.2025 The Sedona Conference - Global Regulation of AI: Implications for Cross-Border Data Transfers, Privacy, and Data Security July.10.2024 World Trademark Review 1000 Names Orrick as a Top Trademark Practice in the US 2 minute read | February.26.2024 We provide guidance to Portland’s emerging tech companies and businesses in renewable energy and power, and help leading companies protect IP assets. Our Public Finance team in Portland represents the State of Oregon, the Port of Portland, and many local governments, hospitals and senior living communities in connection with the financing of public infrastructure, housing, education and economic development projects. Our team helped write the legislation that created Oregon Health and Science University (OHSU) as a public corporation, enabling OHSU to issue its own revenue bonds. We continue to serve as bond counsel to the university. Our Indian Tribal Finance team, described as a "finance giant" in Chambers USA 2015, counsels Native American tribes regionally and across the United States. The group also counsels financial institutions and investment banks doing business with state and local governments, nonprofit institutions, and tribal governments and enterprises. Members of our Technology Companies practice in Portland work with lawyers in the Bay Area and beyond to support Portland’s fast-growing tech market. Our Portland Intellectual Property team provides counseling and litigation services, including U.S. and international trademark and copyright work, conflict resolution, and branding. Our Pacific Northwest Employment team, with members in Portland and Seattle, specializes in litigating and providing tailored employment counseling for technology and other cutting-edge companies while addressing the unique legal landscape in Oregon and Washington. Our Portland Energy team represents sponsors and developers in the construction and term-loan financing of projects using renewable hydroelectric and gas-fired sources, as well as other energy and infrastructure projects. This team is part of Orrick’s leading global practice, with key hubs in Houston and London, that covers all energy assets.'
