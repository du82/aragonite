full_description = "Official Committee of Unsecured Creditors Secures a Significant Settlement in Chapter 11 Cases of Liquidating Supply, Inc. (f/k/a Supply Source Enterprises, Inc.) and its Affiliates 1 minute read | October.29.2024 White House to Expand Restrictions on Chinese Investment While Streamlining Investment Reviews for Allies 3 minute read | February.24.2025 New Duties on Imports from Canada, Mexico and China – What Companies Need to Know – Update 4 minute read | February.04.2025 Orrick has been active in China for decades. Our lawyers in Beijing counsel Chinese, Asian and international clients on a wide range of cross-border transactions, commercial and intellectual property litigation and regulatory matters, drawing on Orrick’s global strengths in the technology, energy & infrastructure, finance and life sciences sectors. We support Chinese private and state-owned enterprises on cross-border M&A, capital markets, venture capital and energy transactions in Southeast Asia, Europe, the Americas and Africa. Our leading IP litigation practice is recognized by the Chinese Ministry of Foreign Commerce as a “preferred U.S. law firm” for Chinese companies facing patent infringement claims before the U.S. International Trade Commission (ITC). Our International Trade team helps clients navigate the complex challenges related to international trade and investment. We support clients in working with the Chinese regulatory authorities to obtain the required approvals, clearances and licenses and have worked on some of the highest profile foreign investment transactions to come before the Committee on Foreign Investment in the United States (CFIUS). Leading Chinese and multinational tech companies, private equity and venture capital firms turn to us for growth and investment strategies. We represent major Chinese state-owned and private enterprises on inbound and outbound M&A and corporate venture investments, IP and data strategies. Our tech sector experience - auto