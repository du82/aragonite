["https://orrick.com/en/News/2024/11/Documentary-Highlights-Successful-Six-Year-Human-Rights-Fight-for-Pro-Bono-Client"]
title = "Documentary Highlights Successful Six-Year Human Rights Fight for Pro Bono Client"
description = "The Accidental Spy, a new documentary, tells the story of Blerim Skoro, an Orrick pro bono client who waged a lengthy fight to remain in the U.S."
full_description = '''The Accidental Spy, a new documentary, tells the story of Blerim Skoro, who came to the U.S. decades ago from war-torn Kosovo, became an undercover operative for the CIA and eventually wound up in a fight to avoid deportation. It’s also a love story about Blerim, his wife and his daughters and their fight to help him remain in the U.S. We were honored to represent Blerim for more than six years as he navigated the immigration system. The film’s U.S. premier is this weekend in Washington, D.C. Here are two excerpts from the documentary – the first scene captures a conversation with Pro Bono Counsel Rene Kathawala, who describes how Orrick got involved in Blerim’s case. And this second clip shares a dramatic 2022 scene with Blerim, his family and Rene as an immigration judge blocks the government from moving forward with deportation. Rene works with other pro bono counsel and legal services nonprofits to increase the quantity and quality of pro bono representation that is being provided to indigent clients in each of the cities worldwide where Orrick has a presence. In addition, he supervises and directly works on cases in such diverse areas as immigration law, family and matrimonial law, housing law, public benefits law, employment law counseling, impact litigation and nonprofit advice and counseling. Rene has worked on many substantial matters in the federal and state systems over his career that are reported as precedent. He also works with firm attorneys to strengthen the firm's innovative Impact Finance team that he founded and that provides representation in diverse transactional areas to nonprofit, for profit and hybrid organizations dedicated to providing basic services to poor persons around the world in areas including microfinance, water, education, energy, housing and health. Based on his long-standing commitment to access to justice issues, Rene has been appointed to serve as co-chair of the New York City Bar Association Race Equity in the New York State Courts Working Group, co-chair of the Association of Pro Bono Counsel Transactional Law Working Group, as member of the New York City Bar Association Right to Counsel Task Force, as member of the New York City Bar Association Family Court Judicial Appointment & Assignment Process Work Group, as member of Sanctuary for Families' Narkis Golin Initiative, and as member of the Kids in Need of Defense's New York Advisory Committee. In recognition of his exemplary work in family law, United States District Judge Bloom appointed Rene as a special master in a federal court family law matter in 2014 in the Eastern District of New York in case number 07-cv-02565-ARR-LB, styled Garmhausen et al v. United States Department of Justice et al. Rene also appeared in a documentary with wide release, called "The Accidental Spy," about his pro bono immigration client, Mr. Blerim Skoro, for whom Rene spent six-years in the New York City immigration court and gained deferral of removal under the Convention Against Torture for the client.'''
