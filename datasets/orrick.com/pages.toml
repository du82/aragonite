full_description = 'Orrick, Herrington & Sutcliffe LLP and its affiliates (listed in the Affiliates section below) ("Orrick", "we", "our", or "us") are committed to respecting your privacy. This Privacy Notice sets out how we collect and process your personal information in the course of operating our business. We collect data about users of our websites, blogs, mobile sites, or applications; about individuals that attend events organised or hosted by us; and about our clients (where these are natural persons) or their employees, agents and representatives (collectively referred to as "you" in this Privacy Notice). We may collect data that identifies or is associated with you ("personal information") when you access our websites, blogs, mobile sites, applications, widgets and other interactive features, when you register or attend an event organised or hosted by us, or when you otherwise contact us ("Public Services"). We may also collect personal information about you when we provide legal services or market our legal services ("Legal Services") to you, your employer, or any other person that has authorised you to communicate with us regarding the provision of Legal Services. We may choose or be required by law to provide different or additional disclosures relating to the processing of personal information about residents of certain countries, regions or states. Please refer to the following disclosures that may be applicable to you: The identity of the data controller of the personal information we hold about you will depend on if you are engaging with Orrick, Herrington & Sutcliffe LLP or any of our affiliates, or if you access, use or receive our Public Services or Legal Services. Please refer to our list of Offices below to determine who the applicable data controller is for the office you are engaging with. The EU General Data Protection Regulation 2016/679 (“EU GDPR”) requires organisations which are subject to the EU GDPR and are not established in the EEA, to designate a representative in the EEA to act on its behalf regarding EU GDPR compliance, and to deal with any supervisory authorities or data subjects in this respect. Similarly, the UK GDPR (which is the UK law version of the EU General Data Protection Regulation by virtue of section 3 of the European Union (Withdrawal) Act 2018 and as amended by Schedule 1 to the Data Protection, Privacy and Electronic Communications (Amendments etc) (EU Exit) Regulations 2019) also requires organisations which are subject to the UK GDPR and are not established in the UK, to designate a representative in the UK to act on its behalf regarding UK GDPR compliance, and to deal with any supervisory authorities or data subjects in this respect. Annex 1 specifies which Orrick offices have appointed a representative in accordance with the EU / UK GDPR to act on its behalf if, and when, they undertake data processing activities which engage the applicable law.'
