description = "We work at our Global Operations & Innovation Center (GOIC) with one goal in mind: delivering the most effective, efficient services to our clients. ..."
full_description = 'When our GOIC opened in Wheeling in 2002, it was the first global insourcing center within a major U.S. law firm. Today, it is the most developed of any firm. Our GOIC team is home to our career associate program and innovative client services, such as Orrick Analytics and many others. And it continues to serve as the hub of the firm’s administrative operations. We’ve been fortunate to attract, retain and inspire extraordinary talent at our GOIC over its nearly 15 years. We’ve become an employer of choice in the Greater Pittsburgh and Ohio Valley regions by following these few key principles: Our staff at the GOIC supports more than 25 Orrick offices worldwide. The services we offer include IT, knowledge management, lawyer development, human resources, finance, graphic design, marketing and client intake. The GOIC is home to dozens of full-time career associates who are fully integrated into our global practices. Eighteen of our practices have career associates on their teams. These lawyers bring the highest quality and efficiency to client services, such as due diligence, research, drafting and Ediscovery. We offer our clients a number of innovative services that are staffed from our GOIC. While each of these services addresses a different legal and compliance need, they have some common elements: state-of-the-art technology, scalability (often globally), and exceptional project management and teamwork. These services include: We like to think that our office is the perfect blend of our local culture and the Orrick spirit. Our home, a refurbished factory, trades on the storied history of the former Wheeling Stamping Company. But when you enter our Wheeling office, you’ll also immediately feel the spirit and commitment to providing top-notch client services that exemplifies our firm. Our Wheeling team is committed to the firmwide Orrick Cares initiative and works to make our community a better place. We participate in many events, from the annual Clean Crawl, which brings together teams of volunteers to paint curbs and plant flowers throughout Wheeling’s Centre Market district, to the 2015 Pittsburgh Marathon’s "Run for a Reason." We’re proud to have ongoing partnerships with innovative local events such as Show of Hands, a quarterly community dinner that educates residents about ways to get involved with creative projects happening in Wheeling. We also have a long-standing relationship with Ohio Valley nonprofit Youth Services System, with team members regularly volunteering and participating in fundraising events.'
