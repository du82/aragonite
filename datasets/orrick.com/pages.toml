title = "EU Inc. Envisions New Startup Structure"
description = "A petition calling for a new pan-European corporate structure for startups has been sent to the EU Commission with 13K+ signatures."
full_description = "Christopher Grew Partner, Technology Companies Group, Fintech London D+44 20 7862 4763 E[email protected] See my bio Patrick Driscoll Senior Associate, Technology Companies Group, Mergers & Acquisitions London D+44 20 7862 4600 E[email protected] See my bio James Badge Managing Associate, Technology Companies Group, Technology & Innovation London D+442078624600 E[email protected] See my bio A petition calling for a new pan-European corporate structure for startups has been sent to the EU Commission with 13K+ signatures. “We managed to make this an urgent matter in Brussels,” petition backers said. “Now we need to make sure the implementation is right.” Advocates envision EU Inc. as a new company vehicle that would apply in EU countries as well as in the UK and Switzerland. Orrick has supported the effort. The goal is one corporate structure that would transcend national boundaries, a move that proponents say will strengthen the European startup eco-system. The proposal would “streamline incorporation, management processes, and fundraising for innovative businesses across Europe,” EU Inc. says. Drawing from his comprehensive experience, network and passion for all things geek, Chris forms an integral part of the European tech ecosystem. Chris advises companies in venture capital transactions, public offerings and cross-border mergers and acquisitions. He also advises high-growth companies, investment banks, and venture capital firms on fundraising, international business operations and transactions. As noted in the engagements below, Chris works closely with those powering the next generation of technology, from revolutionary AI companies to influential investors. His track-record and industry-wide reputation were noted in the most recent Legal 500 edition, which describes Chris as “excellent,” accompanied with a band 1 ranking in venture capital investment by Chambers and Partners 2021. Patrick advises companies with often transformative technologies across a number of sectors – including Enterprise Software, Consumer Marketplaces, Fintech, Web3, EdTech, Media, Cleantech, Healthcare and Life Sciences. He has supported companies in formation, through growth stages, to those scaling their operations across geographies, on a wide range of private equity transactions, M&A, joint ventures and corporate restructurings."
