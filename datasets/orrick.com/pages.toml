title = "Bay Area San Francisco and Silicon Valley"
description = "Our founding office opened in San Francisco in 1863. That makes us the second-oldest Bay Area private company after our client Levi Strauss & Co."
full_description = "Anthropic Raises $3.5 Billion to Advance AI Development and Expand Compute Capacity 1 minute read | March.03.2025 Corporate Transparency Act Beneficial Reporting Back in Effect – Stay Tuned 3 minute read | February.20.2025 Final Regulations Released for the Clean Electricity Low-Income Communities Bonus Credit Program 4 minute read | February.20.2025 Our clients reflect the California economy and its global influence. We represent the world’s leading public tech companies and more than 1,600 startups, including some of the most exciting disruptors. We act for renewable energy pioneers, Fortune 500 companies, financial institutions and funds, and the state of California and its municipal entities. Our local practice mirrors our global focus: advising the technology, energy & infrastructure and finance clients in their highest-stakes transactional, litigation and compliance matters. We practice at the heart of the technology ecosystem, providing comprehensive support for tech companies at every stage of the corporate life cycle. Our practice for both public and private tech companies encompasses financing, M&A, corporate governance, IP asset protection, cybersecurity, executive compensation and employment. We offer one of the premier IP, litigation and compliance teams for the tech sector. And we do it all globally, enabling us to scale with our clients. We represent public companies in U.S. and cross-border investments, working with our tech-focused lawyers in 25 markets worldwide. In recognition of the broad nature of our practice, Law360 has recognized our team as one of four Technology Groups of the Year globally for the past two years. We’re especially focused on helping disruptors address the complex legal and policy issues that their innovative models often raise. We’ve completed some of the most successful financing rounds for unicorns such as Pinterest, Stripe, 23andMe, SoFi, Prosper and many others. And The Recorder named us 2016 Corporate Department of the Year for Emerging Companies. We’ve also closed a string of tech IPOs and follow-on offerings. And we’ve helped our tech clients execute landmark sales, including Nest’s sale to Google and Yammer’s sale to Microsoft. Recently, we advised Cruise Automation, a leader in the development of driverless car technology, in its acquisition by General Motors."
