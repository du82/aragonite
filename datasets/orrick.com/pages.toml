["https://orrick.com/en/Insights/2025/01/Employment-Contracts-Digital-Employment-Contracts-in-Germany-When-is-a-Wet-Ink-Signature-Required"]
title = "Legal Ninja Snapshot: #Employment Contracts: Digital Employment Contracts in Germany – But When is a Wet Ink Signature Still Required?"
description = "Digital employment contracts in Germany: relying solely on headlines about digital employment contracts can lead to legal issues"
full_description = '''Benedikt Migdal Partner, Technology Transactions, Intellectual Property Düsseldorf D+49 211 3678 7164 E[email protected] See my bio Marianna Karapetyan Senior Associate, Employment Law & Litigation Düsseldorf D+49 211 3678 7127 E[email protected] See my bio Ilona Schütz Managing Associate, Technology Companies Group, Mergers & Acquisitions Düsseldorf D+49211367870 E[email protected] See my bio With the new year, the Fourth Bureaucracy Reduction Act ("BEG IV") brings more flexibility by replacing the need for written form and qualified electronic signatures with text form in many situations, enabling companies to embrace digital workflows. However, some key exceptions still require traditional written form or a qualified electronic signature. Previously, employment contracts had no formal requirements and could be agreed upon digitally, via email, or even verbally. Yet, the German Evidence Act required employers to provide the employee written (i.e., wet ink signatures) documentation of the essential terms of the employment contract. This became crucial after 2022, when a law was introduced, that non-compliance could result in fines. The initial requirement for written documentation faced criticism, and BEG IV addresses this by allowing essential contract terms to be documented in text form (like email, PDF or digital signatures such as Docusign) as long as the document can be sent to the employee electronically, is accessible to the employee, can be stored and printed, and the employer requests the employee to acknowledge receipt. This change simplifies administration and supports digital workflows, particularly benefiting start-ups using modern tools. However, depending on what you want to stipulate in an employment contract, some parts of employment contracts might still need to be in written form (i.e., wet ink signatures or qualified electronic signatures). These include important clauses often found in employment contracts of technology companies, like post-contractual non-competition agreement (nachvertragliches Wettbewerbsverbot), assignments of the right of use an employee's work in a way that are not known at the time of the employment contract, and fixed-term employment contracts.'''
year_published = 2025
