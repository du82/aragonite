title = "Orrick Energy Storage Update 2024: A Global Portrait of Surging Growth"
description = "The Orrick Energy Storage Update 2024 explores global battery storage market trends."
full_description = '''Rohit Sachdev Partner, Energy, Infrastructure San Francisco D+1 415 773 5813 E[email protected] See my bio Les Sherman Partner, Energy, Infrastructure San Francisco D+1 415 773 5570 E[email protected] See my bio In the United States, developers installed 8.7 GWs of battery storage capacity in 2023, a 90% increase from the prior year. The global storage market grew by 110 GWhs of energy storage capacity in 2023, an increase of 149% from the previous year. Investment in the global storage sector grew 76% in 2023, to $36 billion. In Orrick Energy Storage Update 2024, we present the latest trends and issues accompanying this sector growth and maturity, including: Rohit has extensive experience in the solar, wind, energy storage, and biofuel sectors, and has advised on numerous award-winning transactions. He is recognized by Chambers USA and Chambers Global in the Projects: Renewables & Alternative Energy category. Rohit’s clients describe him as “excellent,” “knowledgeable,” “timely in his work,” “commercially-oriented,” “very plugged into the market” with a “great demeanor." In recent years, Rohit's practice has focused particularly on project development and project M&A transactions. He has successfully negotiated many GWs of "physical" and "virtual" PPAs and tolling agreements, as well as a variety of construction, supply and other development arrangements. Rohit has also represented clients on the purchase and sale of renewables projects in various U.S. jurisdictions, as well as joint venture and other project asset arrangements. He has particularly focused on the development, financing and sale of domestic and international energy storage projects, including stand-alone, hybrid, front-of-meter and behind-the-meter projects. Rohit co-leads Orrick’s South Asian Inclusion Network and served as a Fellow for the Leadership Council on Legal Diversity. He started his legal career at an international law firm in New York, where he focused on project development and project finance transactions across the globe. Prior to law and business schools, Rohit was an investment banking analyst at Credit Suisse in San Francisco where he provided M&A and financial advisory services to technology companies in Silicon Valley.'''
