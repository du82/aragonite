title = "Global Recruitment Privacy Notice"
description = "This Recruitment Privacy Notice explains how we process your personal information when you apply for a position with us, or otherwise provide information in relation to a role or work placement at Orrick."
full_description = "This Recruitment Privacy Notice explains how we process your personal information when you apply for a position with us, or otherwise provide information in relation to a role or work placement at Orrick. This Recruitment Privacy Notice is not a contract and does not create any legal rights or obligations. This Recruitment Privacy Notice is also not intended to replace other notices or disclosures we may provide to you in connection with your application for a job or eventual role with us, which will supersede any conflicting disclosures contained in this Recruitment Privacy Notice. When we use the terms 'Orrick', 'we', 'our' or 'us', we are referring to the Orrick entity to which you submit your application and consequently acts as the data controller of your personal information. A list of Orrick entities can be found under 'Affiliates' at https://www.orrick.com/en/Privacy-Notice. The types of personal information we collect, and its use, will vary depending on the nature of the position or role you are applying for and the location of the respective Orrick entity. For applications submitted to an Orrick entity in the EU, London and Switzerland, the table in Annex II sets out the categories of personal information we collect about you and how we use that information. The table also provides the legal basis which we rely on to process your personal information. For applications submitted to Orrick entities in China, Japan, the United States and Singapore, you should refer to the relevant region-specific disclosures in Annex I. When we collect such information from you, we will inform you if the information is mandatory or optional. If you do not provide any information which is marked as mandatory, we may be unable to process your application. During the recruitment process, we may use artificial intelligence recruitment software to process the applications that we receive. The software will evaluate job applications against the advertised job criteria and return prioritised recommendations for the relevant position. The automated recommendations returned by the software, together with our recruitment team's evaluation of each individual candidate on their own merits, will be used to make an informed decision during the recruitment process. Our recruitment team does not reject candidates based on automatically generated recommendations and you will not be subject to a decision based solely on the automated processing of your personal information."
