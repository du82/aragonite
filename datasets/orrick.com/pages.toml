title = "Cookie Notice"
description = "Cookie Notice"
full_description = "Unless otherwise expressly stated, terms in this Cookie Notice have the same meaning as defined in our Privacy Notice. This Cookie Notice supplements the information contained in our Privacy Notice by explaining how Orrick, Herrington & Sutcliffe, LLP, its affiliates and subsidiaries (collectively, “Orrick,” “we,” “us,” “our”) and our business partners and service providers use cookies and related technologies in the course of managing and providing our online services and our communications to our users. It explains what cookies are and how we use them, as well as users’ rights to control our use of them. Cookies are small data files, which are downloaded to an individual’s browsing device (such as a computer or smartphone) when they visit a website. Cookies allow us and our third-party partners and providers to collect certain information about an individual’s interactions with our email communications, websites and other online services. We and our third-party partners and providers may also use other, related technologies to collect this information, such as web beacons, pixels, embedded scripts, location-identifying technologies and logging technologies (collectively, “cookies”). We and our third-party partners and providers may use cookies to automatically collect certain types of usage information when an individual visits or interacts with our email communications, websites and other online services. For example, we may collect log data about an individual’s device and its software, such as IP address, operating system, browser type, date/time of visit, and other similar information. We may collect analytics data or use third-party analytics tools such as Google Analytics to help us measure usage and activity trends for our online services. Cookies do lots of different jobs, like helping website operators understand how their website is being used, letting a user navigate between pages efficiently, remembering a user’s preferences, and generally improving browsing experience. Cookies can also help ensure the advertisements an individual sees online are more relevant to their interests."
