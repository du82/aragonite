title = "New York"
description = "Our New York office is a reflection of the city itself. Fast-moving. Socially conscious. A hub for sophisticated finance. And never afraid to fight for the right cause."
full_description = '''Corporate Transparency Act Beneficial Reporting Back in Effect – Stay Tuned 3 minute read | February.20.2025 Law360 Highlights Orrick's Infrastructure Team as Construction Practice Group of the Year 1 minute read | February.06.2025 We act for Wall Street and the Fortune 100 in complex transactions and high-stakes trials and appeals. We help finance major infrastructure projects, and we’re leaders in structured and municipal finance. We counsel tech companies at all stages of the corporate life cycle, from startups through mature enterprises, and play a leading role in New York’s growing tech ecosystem. Yet, culturally, we’re connected to our California roots, focusing on teamwork and enjoying our work and each other (and never taking ourselves too seriously). It’s a great environment in which to practice law. Visit our office and you’ll see war rooms set up for trial prep. In 2016, we were named Intellectual Property Litigation Department of the Year and a finalist for Litigation Department of the Year by The American Lawyer. Our New York litigators defend high-stakes disputes involving intellectual property, employment, securities, product liability, antitrust and other commercial claims. Our New York IP team handles patent, trademark, copyright and trade secrets matters for clients in tech, life sciences and other sectors. And our top-tier Supreme Court and Appellate practice, based in our New York, San Francisco and Washington, D.C., offices, has been named to National Law Journal’s Appellate Hotlist four times, in recognition of our "deep bench, diverse cases, high-profile clients and presence in the nation’s highest court." We also counsel on international investigations and white collar matters. We act for Wall Street’s leading institutions, funds and fintech companies and help our clients innovate in the fast-paced financial markets. Our New York Public Finance team is part of our top-ranked U.S. practice. As bond counsel to the Trust for Cultural Resources of the City of New York, we have participated in financing the city’s most iconic cultural institutions, including the Museum of Modern Art, the American Museum of Natural History and Carnegie Hall. Our Structured Finance team is consistently ranked among the top legal advisors for ABS, CMBS and esoteric transactions and has pioneered securitizations of new asset classes such as oil & gas and renewable energy assets. Our creditor-side Restructuring practice has counseled on some of the most significant bankruptcy cases and out-of-court restructurings. Our Private Credit team is one of the largest alternative credit practices in the U.S. with over 20 private credit fund clients. Our sophisticated New York Real Estate team works in lockstep with our top-ranked California team, advising private equity funds and other real estate investors on complex investments in New York and around the globe.'''
