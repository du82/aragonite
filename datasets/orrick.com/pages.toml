["https://orrick.com/en/Insights/2025/01/A-Conversation-with-Crux-Residential-Solar-Tax-Credits-Offer-Risk-and-Reward"]
title = "A Conversation with Crux: Residential Solar Tax Credits Offer Risk and Reward"
description = "Tax Credit Buyers and Sellers face unique challenges when they assess potential transfer of residential solar investment tax credits, but they may experience unique rewards."
full_description = "John Eliason Partner, Tax, Renewable Energy Washington, D.C. D+1 202 339 8546 E[email protected] See my bio Alejandra Garcia Earley Partner, Renewable Energy, Power Chicago D+1 312 924 9825 E[email protected] See my bio Tax Credit Buyers and Sellers face unique challenges when they assess potential transfer of residential solar investment tax credits, but they may experience unique rewards. Orrick’s John Eliason and Alejandra Garcia Earley discussed the market with Katie Bays of Crux for Crux Connects, a series of interviews with energy finance experts. Orrick has worked closely with Crux on dozens of tax credit transfer transactions since the launch of the market in 2023. John advises major financial institutions (tax equity investors and infrastructure funds), lenders, developers, and sponsors, particularly those in the wind, solar, storage, biomass and energy tech space. He helps clients structure financings for their projects to take advantage of federal and state tax incentives, like the Federal production tax credit (PTC), energy investment tax credit (ITC) and accelerated depreciation (MACRS and “bonus”) using partnership flips, sale-leasebacks, public/private partnerships, and other structuring options. He has been particularly focused on providing clients with the latest guidance and opportunities relating to the Inflation Reduction Act, including with respect to Section 6418 tax credit transfers and Section 6417 direct pay opportunities. Recognized by Chambers USA and Chambers Global in Band 2 for Projects: Renewables & Alternative Energy, clients describe John as “extremely knowledgeable, flexible and can put technical jargon into plain terms.” Client sources also state “he knows the tax equity markets very well and is very commercial.” Prior to law school, John founded an information management company based in Austin, Texas. He is also a veteran of the Texas Army National Guard. Alejandra advises sponsors, lenders and agents on all aspects of a project, from drafting, negotiation and review of traditional project documents, including EPCs, O&Ms and MSAs through procuring construction financing and term loans for the operation and maintenance of the asset. Her tax equity practice includes drafting and negotiating the traditional tax equity partnerships (for PFlip and TFlip structures) documentation, tax credit transfer agreements and advising construction and back leverage lenders in connection with tax equity portfolios."
