full_description = "Joseph Perkins Partner, Technology Companies Group, Blockchain and Virtual Currency Silicon Valley D+1 650 289 7188 E[email protected] See my bio Hiroki Sugita Partner, Mergers & Acquisitions, Technology Companies Group Tokyo D+81 3 3224 2953 E[email protected] See my bio As our kick-off event for 2025, we would like to invite you to an exclusive “Trends in US Venture Capital & Ask Me Anything (AMA)!” hybrid seminar. This event is designed to provide you with the latest and most relevant information to help you navigate through the complexities of the relevant laws in the respective countries. We will start with a brief update on the “Trends in US Venture Capital” by Joseph Perkins, in-person from our Tokyo office, followed by an AMA session and networking time, where Joseph and Hiroki Sugita will be available to answer all your questions so that you can have a confident start whether you’re an entrepreneur, investor or just part of a startup team. You are welcome to submit questions to Orrick Tokyo Marketing ([email protected]) ahead of time so that it can be addressed during the event. In the fast-paced and unprecedented blockchain and cryptocurrency markets, Joseph helps companies develop innovative and comprehensive legal strategies to achieve their goals of bringing to market disruptive and transformative technologies. From DAO and NFT creation, general corporate and fundraising strategies, to navigating complex and changing regulatory regimes, Joseph has become a go-to advisor for companies in the blockchain and virtual currency ecosystem. As a member of Orrick’s Technology Companies Group, Joseph assists cutting-edge technology companies and investors with general corporate counseling, private venture capital financing, and M&A services. Joseph has had the opportunity to work with some of the most iconic companies in Silicon Valley, advising on corporate strategy and fundraising matters. Joseph plays a key role in connecting the Silicon Valley and Japan tech and venture ecosystems. He advises Japanese technology companies and corporate venture capital funds, leveraging his Silicon Valley background to support their growth. Fluent in Japanese, Joseph maintains strong ties to Japanese businesses and collaborates closely with Orrick’s Tokyo practice."
