["https://orrick.com/en/Insights/2025/02/Writing-the-Constitution-for-Your-New-Private-Equity-or-VC-Fund"]
title = "Writing the Constitution for Your New Private Equity or VC Fund: Strategy, Culture, Decision-Making, Budget, and Data Ownership"
description = "Guide to Structuring Your VC or PE Fund: Strategy, Culture, Decision-Making, Budget &amp; Data Ownership&mdash;key insights from David Teten &amp; Dolph Hellman."
full_description = "Dolph Hellman Partner, Funds, Banking & Finance San Francisco D+1 415 773 5678 E[email protected] See my bio by David Teten (Founder, Versatile VC; Venture Partner, Coolwater Capital; Chair, PEVCtech.com) and Dolph M. Hellman, Esq. (Partner, Orrick, Herrington & Sutcliffe LLP; Chair, Orrick’s Private Investment Fund’s Group) Part of a series on structuring the team and legal infrastructure of a new private equity/VC fund (remaining issues to be released in the coming weeks): If you are launching your own investment management firm, we recommend designing a “constitution”: a set of documents covering the firm’s goals, legal obligations, and principles for handling disagreement. The most important documents for a new firm are the agreements governing the general partner entity and the management company entity, which may include co-founding partners, anchor investor, and early employees. These entities are essential for managing the fund and profits, and complying with legal and tax requirements. However, forming your new fund also typically requires making important decisions about firm strategy, culture, how you make decisions, budget, data ownership, and other issues. These agreements may be inappropriate, unfeasible, or unwise to put in your signed legal documents. It’s hard to address these issues in such a black & white way that they’re readily enforceable. However, that doesn’t mean these issues are unimportant. Any agreement can be renegotiated if the parties are willing. That said, the process of negotiating the initial design of the firm, even though it will inevitably change, is a valuable forcing function. Part of the challenge is that the best partnerships are made of complementary, heterogeneous people. It requires more upfront work to structure the partnership among a diverse group, but the group becomes a more valuable team once launched. Brian Cohen, Chairman, Six Point Ventures, observed, “Multiple partners with different primary skill sets are mandatory. Otherwise there is too much second-guessing and not enough professional trust.”"
