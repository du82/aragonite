["https://orrick.com/en/Insights/2025/02/EDBP-Opinion-on-AI-Models-and-Personal-Data-Has-Implications"]
title = "EDBP Opinion on AI Models and Personal Data Has Implications for Contracts Between AI Model Developers and Downstream Integrators"
description = "The European Data Protection Board (EDPB) has issued an opinion on certain data protection aspects related to processing personal data in AI models."
full_description = "Julia Apostle Partner, Technology Transactions, Cyber, Privacy & Data Innovation Paris D+33153537500 E[email protected] See my bio Rami Kawkabani Senior Associate, Technology & Innovation, Technology Transactions Paris D+33 1 5353 8157 E[email protected] See my bio The European Data Protection Board (EDPB) has issued an opinion on certain data protection aspects related to processing personal data in AI models. The opinion came after the Irish supervisory authority raised questions to the EDPB related to the anonymity of data in AI models, the appropriateness of legitimate interest as a legal basis and the consequences of unlawfully processing personal data in AI model development. A significant aspect of the EDPB opinion is the detailed exploration of how legitimate interests may serve as a valid legal basis for processing personal data for training AI models. But the opinion offers other valuable insights into the position of the EDPB on the intersection between model training and data protection. This note focuses on a narrow aspect of the opinion, namely the impact of due diligence obligations that downstream integrators (which could, for instance, include a developer of a text- or image-generating AI system, with a bespoke user interface based on a licensed existing AI model, or a developer of an automatic navigation system based on a licensed existing AI model) have on contracting processes between model developers and downstream integrators. Opinions from the EDPB typically address specific questions or issues raised by supervisory authorities, the European Commission or others. They interpret or clarify aspects of the GDPR. Although they represent a useful source of information and guidance for authorities and organisations subject to oversight, opinions are non-binding and should not be treated as regulatory guidance. One of the issues addressed in the EDPB opinion is the impact of unlawful data processing during the development of an AI model on the lawfulness of the subsequent processing or operation of that AI model, specifically when the personal data is retained and processed by another controller during deployment."
year_published = 2025
clearnet = "https://orrick.com/en/Insights/2025/02/EDBP-Opinion-on-AI-Models-and-Personal-Data-Has-Implications"
