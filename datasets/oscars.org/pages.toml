["https://oscars.org/about/join-academy"]
title = "Academy Membership | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "WHOAcademy membership is limited to film artists working in the production of theatrically-released motion pictures. The Academy has 19 branches, for the crafts ranging from Actors to Writers, and the Artist Representatives category, for individuals who work in motion pictures as a representative.The requirements for each branch and category can be found by clicking here.HOW The Academy’s membership process is by sponsorship, not application. Candidates must be sponsored by two Academy members from the branch to which the candidate seeks admission.Additionally, Academy Award nominees are automatically considered for membership and do not require sponsors.Nominees and sponsored candidates are reviewed by branch committees and recommendations for membership are considered by the Academy’s Board of Governors. The Board decides which individuals will receive invitations.Membership Review takes place annually in the spring. The current cycle deadline to sponsor a candidate is Friday, November 22, 2024.SPONSORSHIP INSTRUCTIONS Sponsoring a candidate for membership in the Academy is a serious commitment. Please make sure you are confident the candidate has truly “demonstrated exceptional achievement in the field of theatrical motion pictures” before you agree to sponsor an individual.It is important to be familiar with the admission criteria of your branch (or category, if you are sponsoring someone as an Artist Representative. Click here for branch and category requirements. Please note:Candidates for branch membership must be sponsored by members of the branch in question. Artist Representatives candidates must be sponsored by at least one Artist Representatives member, with a 2nd sponsor from any branch. Artist Representatives may only sponsor Artist Representatives.NEW MEMBERS PROPOSAL PROCESSA candidate for membership must be sponsored by two members of the branch for which the individual qualifies. One sponsor should initiate the sponsorship process on the Academy member site. Please review your branch’s requirements before submitting a candidate for consideration.After the two sponsors have completed the online process, the proposed candidate will receive an email requesting additional information. Once completed, the Member Relations and Awards Department will be in touch if any additional information is required.Membership reviews take place once a year, in the spring. Each candidate who receives a favorable endorsement from the appropriate Branch Executive Committee will be submitted to the Board of Governors for final approval and invitation to membership."
year_published = 2024
year_updated = 2024
