lars, historians, and industry professionals.CONTACTprivate.events@oscars.org Floor Plan Image Corporate Membership & Rates PRIVATE EVENT RENTAL RATESBASE RATE: $12,000Base rate includes eight hours for setup, event, and strike (Bob Hope Lobby and West Patio only)Labor: base rate includes standard security, facilities/custodial, and event production supportDiscounts will be applied based on Corporate Membership levelADDITIONAL ON-SITE HOURS: $1,500CORPORATE MEMBERSHIPCorporate Membership provides vital, year-round support for groundbreaking exhibitions, robust programming, illuminating educational initiatives, the collection and preservation of significant film objects, and more, all while gaining access to unique benefits available exclusively to Corporate Members. In addition to private event hosting privileges, perks include employee admission and engagement and VIP invitations to exhibitions and private events.To learn more about Corporate Membership, please contact museumpartnerships@oscars.org."
