title = "Gold Rising | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "Image The Academy is committed to inspiring young artists and creating meaningful opportunities for underrepresented communities to engage with the world of film. Central to this mission is the Academy Gold Rising Talent Development Program, an immersive eight-week summer experience designed to equip college juniors, seniors, recent graduates and young professionals with the skills, knowledge and connections needed to succeed in the film industry. Participants gain unparalleled access to industry leaders and Academy members, opening doors to career pathways and professional networks within the film world. ABOUT PRODUCTION TRACK INTERNSHIPS/PARTNER COMPANIES HOW TO APPLY"
