["https://oscars.org/press/clip-request"]
title = "Clip request | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "USE OF A.M.P.A.S. CLIPS/STILLSIf you wish to use a clip and/or still from any Academy Award Presentation, The Governors Awards, The Scientific and Technical Achievement Awards, The Student Academy Awards or any other Academy event or Academy owned property you must complete an A.M.P.A.S. Clip/Still Licensing Submission Form. If it is for news and editorial use ONLY, complete an A.M.P.A.S. Clip/Still Licensing Submission Form for News/Editorials Use Form.Please note: We do not provide quotes for license fees unless and until a request is approved We do not provide screeners License fees are set according to use Physical elements will not be prepared until a license agreement has been signedNothing contained herein shall constitute an offer or permission to use the material. All requests are subject to A.M.P.A.S.’ internal review and approval process and any and all third party approvals where applicable. No permission will be deemed binding until the appropriate approvals have been obtained and a license agreement is executed by both parties, if at all. News and Editorial Use onlySUBMITAll other uses SUBMIT"
