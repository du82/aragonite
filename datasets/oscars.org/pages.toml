["https://oscars.org/gold-rising/about"]
title = "ABOUT | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = '''/*&amp;lt;![CDATA[*/ .testimonial-column { float: left; width: 50%; padding: 50px; text-align: center; } .testimonial-column img { max-width: 225px; height: auto; } .testimonial-column p { text-align: justify; } .testimonial-row:after { content: ""; display: table; clear: both; } @media screen and (max-width: 600px) { .testimonial-column { width: 100%; padding: 20px; } } /*]]&amp;gt;*/ The Gold Rising program offers unprecedented access to the film industry and the Academy membership, and there are two ways for college juniors, seniors, recent graduates and young professionals to participate. Participants interested in behind-the-camera careers can be a part of the program’s Production Track. Students from around the world can apply for an internship with one of our partner companies.Academy Gold Rising 2024 was supported by grants from The James Irvine Foundation, JPMorgan Chase, Snap Foundation, Dwight Stuart Youth Fund and Ruderman Family Foundation. Additional support was provided by Gold tier partner, The Walt Disney Company.Other funding generously provided by the Los Angeles County Department of Arts and Culture, and Leon Silverman.In-kind support was provided by 424 Post, Disney Digital Studio Services, Harbor Picture Company, Panavision, Exceptional Minds, Filmmakers Academy, Los Angeles Film School and New York Film Academy. “Being able to meet with professionals is amazing and such a great learning opportunity. But, meeting those other 99 students over zoom or in person was the best part about this experience. I not only made friends, but I was able to collaborate and learn from some extremely talented people my age!” - Bailey Dell'Erba, SUNY Plattsburgh“I gained an understanding of different career paths within the industry, and the diversity of the paths amongst all those who ended up in them. I gained a strong community of friends and future collaborators.” – Ananya Shah, University of Southern California“This program has been the most important shift in my career as a filmmaker thus far and I am sure it will prove to be one of the most pivotal events in my career as a whole.” – Andile Sithole, Los Angeles Film School“ I feel a better sense of community through this program and better understanding of what I want to do in entertainment.” – Rebecca Avalos, University of California - Davis“The kindness, humility and generosity of the Gold Rising Team exceeded my expectations. When they say "we have your backs" they absolutely mean it. And that means the world. Additionally the speakers truly humanized the industry for me with their own kindness.” – Anvita Gattani, New York University“I never thought I would meet such a tight-knit community of like-minded and passionate individuals who all share an insatiable love for film and television. It quite literally is the best thing that has ever happened to me!” - Christopher Mi, Berklee College of Music“Everything exceeded my expectations from the panels to the class as a whole. I was blown away by my class’s passions and willingness to learn from each other.” – Niya Butler, Louisiana State University and Agricultural and Mechanical College“Gold Rising has helped me grow, heal and find a confidence in myself that has been missing for a few years. The lasting impact it has made on my life, my family's lives and those of my Gold Rising peers is invaluable.” - Sejal Moosapeta, Stanford University'''
year_published = 2024
year_updated = 2024
