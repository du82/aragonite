["https://oscars.org/academy-history-and-structure"]
title = "ACADEMY HISTORY AND STRUCTURE | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "With a global membership of more than 10,500 of the most accomplished film industry artists and leaders, an acclaimed film museum, the expansive Academy Collection, and world-renowned awards for cinematic achievements, the Academy of Motion Picture Arts and Sciences is the home of an expertise and reach that is unparalleled.The Academy recognizes and celebrates all aspects of the film industry and the diverse, talented people who make movies. The Academy inspires young artists and creates opportunities for underrepresented communities to engage with the film world; preserves our film history; curates vital and thoughtful programs and initiatives about cinema’s past, present and future; and connects global audiences through their shared love of cinema.The Academy was founded in May 1927 as a nonprofit corporation by 36 members including production executives and film luminaries of the time. Today, the Academy campus in the Los Angeles area includes the Academy Museum of Motion Pictures, a headquarters building at 8949 Wilshire Boulevard, and the Margaret Herrick Library and Academy Film Archive, which house components of the Academy Collection.Membership in the Academy is by invitation of the 55-person Board of Governors, the governing body of the Academy, and is limited to those who have distinguished themselves in the motion picture industry. The criteria for admittance include a body of work in motion pictures that reflects the high standards of the Academy, an achievement of unique distinction, or making an outstanding contribution to the motion picture arts or sciences.Members representing the many professional areas within the motion picture industry are organized into 19 branches – Actors, Animation, Casting Directors, Cinematographers, Costume Designers, Directors, Documentary, Executives, Film Editors, Makeup Artists and Hairstylists, Marketing and Public Relations, Music, Producers, Production and Technology, Production Design, Short Films, Sound, Visual Effects and Writers.Janet Yang was re-elected as president of the Board of Governors in August 2024. The Board of Governors also appoints a chief executive officer to supervise the administrative activities of the Academy. CEO Bill Kramer and a staff of more than 700 currently conduct the Academy’s day-to-day business."
year_published = 2025
year_updated = 2025
