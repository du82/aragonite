full_description = "Image The Student Academy Awards is an international student film competition. Each year, college and university film students from all over the world compete for awards and cash grants, with films being judged in the following categories:Animation, Documentary, Live Action Narrative and Alternative/Experimental.Past Student Academy Award winners have gone on to receive 67 Oscar nominations and have won or shared 15 awards. Past SAA winners include Pete Docter, Robert Zemeckis, Patricia Riggen, Patricia Cardoso and Spike Lee.In partnership with Rolex, the 51st Student Academy Awards took place at the ODEON Luxe Leicester Square in London on Monday, October 14. Watch the livestream here. How to Apply Ceremonies"
