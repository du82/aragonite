["https://www.oscars.org/film-archive"]
title = "Academy Film Archive | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "Image A core part of the Academy Collection, the Academy Film Archive is dedicated to the preservation, restoration, documentation, exhibition and study of motion pictures. The Academy Film Archive holds over 250,000 items, including all of the Academy Award-winning films in the Best Picture category, all the Oscar-winning documentaries and many Oscar-nominated films in all categories. It contains one of the most diverse and extensive motion picture collections in the world, including the personal collections of such filmmakers as Tacita Dean, Cecil B. DeMille, Barbara Hammer, Alfred Hitchcock, Jim Jarmusch, Penelope Spheeris, George Stevens, Gus Van Sant, and Fred Zinnemann.More information on the Academy Collection, including Academy Film Archive assets, can be found here. Visit/Loans/Licensing Contact Oral Histories"
