["https://oscars.org/awards/representation-and-inclusion-standards"]
title = "Representation and Inclusion Standards | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "The Academy of Motion Picture Arts and Sciences representation and inclusion standards for Oscars® eligibility in the Best Picture category are designed to encourage equitable representation on and off screen to better reflect the diverse global population.Submitting a confidential Academy Inclusion Standards form (RAISE) and meeting TWO out of FOUR of the standards will be required in order for the film to be deemed eligible for Best Picture consideration: STANDARD A: ON-SCREEN REPRESENTATION, THEMES AND NARRATIVESA film can achieve this standard by meeting the criteria in at least ONE of the following areas:A1. Lead or significant supporting actors from underrepresented racial or ethnic groupsAt least one of the lead actors or significant supporting actors submitted for Oscar consideration is from an underrepresented racial or ethnic group in a specific country or territory of production.This may include:• African American / Black / African and/or Caribbean descent• East Asian (including Chinese, Japanese, Korean, and Mongolian)• Hispanic or Latina/e/o/x• Indigenous Peoples (including Native American / Alaskan Native)• Middle Eastern / North African• Pacific Islander• South Asian (including Bangladeshi, Bhutanese, Indian, Nepali, Pakistani, and Sri Lankan)• Southeast Asian (including Burmese, Cambodian, Filipino, Hmong, Indonesian, Laotian, Malaysian, Mien, Singaporean, Thai, and Vietnamese)A2. General ensemble castAt least 30% of all actors not submitted for Oscar consideration are from at least two underrepresented groups which may include:• Women• Racial or ethnic group• LGBTQ+• People with cognitive or physical disabilities, or who are deaf or hard of hearingA3. Main storyline/subject matterThe main storyline(s), theme or narrative of the film is centered on an underrepresented group(s).• Women• Racial or ethnic group• LGBTQ+• People with cognitive or physical disabilities, or who are deaf or hard of hearing STANDARD B: CREATIVE LEADERSHIP AND PROJECT TEAMA film can achieve this standard by meeting the criteria in at least ONE of the following areas:B1. Creative leadership and department headsAt least two of the following creative leadership positions and department heads—Casting Director, Cinematographer, Composer, Costume Designer, Director, Editor, Hairstylist, Makeup Artist, Producer, Production Designer, Set Decorator, Sound, VFX Supervisor, Writer—are from an underrepresented group and at least one of those positions must belong to someone from an underrepresented racial or ethnic group.Underrepresented groups may include:• Women• Racial or ethnic group• LGBTQ+• People with cognitive or physical disabilities, or who are deaf or hard of hearingUnderrepresented racial or ethnic groups may include:• African American / Black / African and/or Caribbean descent• East Asian (including Chinese, Japanese, Korean, and Mongolian)• Hispanic or Latina/e/o/x• Indigenous Peoples (including Native American / Alaskan Native)• Middle Eastern / North African• Pacific Islander• South Asian (including Bangladeshi, Bhutanese, Indian, Nepali, Pakistani, and Sri Lankan)• Southeast Asian (including Burmese, Cambodian, Filipino, Hmong, Indonesian, Laotian, Malaysian, Mien, Singaporean, Thai, and Vietnamese)B2. Other key rolesAt least six (6) other crew/team and technical positions (excluding Production Assistants) are from an underrepresented racial or ethnic group. These positions include but are not limited to First AD, Gaffer, Script Supervisor, etc.B3. Overall crew compositionAt least 30% of the film’s crew is from at least two underrepresented groups, which may include:• Women• Racial or ethnic group• LGBTQ+• People with cognitive or physical disabilities, or who are deaf or hard of hearing STANDARD C: INDUSTRY ACCESS AND OPPORTUNITIESA film can achieve this standard by meeting the criteria in at least ONE of the following areas:C1. Paid apprenticeship and internship opportunitiesThe film’s distribution or financing company has paid apprenticeships or internships that are from the following underrepresented groups and satisfy the criteria below:• Women• Racial or ethnic group• LGBTQ+• People with cognitive or physical disabilities, or who are deaf or hard of hearingThe major studios/distributors are required to have substantive, ongoing paid apprenticeships/internships inclusive of underrepresented groups (must also include racial or ethnic groups) in most of the following departments: production/development, physical production, post-production, music, VFX, acquisitions, business affairs, distribution, marketing and publicity.The mini-major or independent studios/distributors must have a minimum of two apprentices/interns from the above underrepresented groups (at least one from an underrepresented racial or ethnic group) in at least one of the following departments: production/development, physical production, post-production, music, VFX, acquisitions, business affairs, distribution, marketing and publicity.C2. Training opportunities and skills development (crew)The film’s production, distribution and/or financing company offers training and/or work opportunities for below-the-line skill development to people from the following underrepresented groups:• Women• Racial or ethnic group• LGBTQ+• People with cognitive or physical disabilities, or who are deaf or hard of hearingSTANDARD D: AUDIENCE DEVELOPMENTTo achieve Standard D, the film must meet the criterion below:D1. Representation in development, marketing, publicity, and distributionThe studio and/or film company has multiple (more than one) in-house senior executives or hired consultants belonging to at least two underrepresented groups on their creative and development, marketing, publicity, and/or distribution teams. At least one individual must belong to an underrepresented racial or ethnic group.Underrepresented groups may include:• Women• Racial or ethnic group• LGBTQ+• People with cognitive or physical disabilities, or who are deaf or hard of hearingUnderrepresented racial or ethnic groups may include:• African American / Black / African and/or Caribbean descent• East Asian (including Chinese, Japanese, Korean, and Mongolian)• Hispanic or Latina/e/o/x• Indigenous Peoples (including Native American / Alaskan Native)• Middle Eastern / North African• Pacific Islander• South Asian (including Bangladeshi, Bhutanese, Indian, Nepali, Pakistani, and Sri Lankan)• Southeast Asian (including Burmese, Cambodian, Filipino, Hmong, Indonesian, Laotian, Malaysian, Mien, Singaporean, Thai, and Vietnamese)All categories other than Best Picture will be held to their current eligibility requirements. Films in the specialty feature categories (Animated Feature Film, Documentary Feature, International Feature Film) submitted for Best Picture/General Entry consideration will be prompted to participate in the Representation and Inclusion Standards process.For more information, and to submit the information needed to facilitate the Representation and Inclusion Standards review process, visit RAISE.oscars.org."
