["https://oscars.org/news"]
title = "News | Oscars.org | Academy of Motion Picture Arts and Sciences"
description = "Doja Cat, Cynthia Erivo, Ariana Grande, LISA of Blackpink, Queen Latifah and RAYE will participate in showstopping performances celebrating the filmmaking community and some of its legends at the 97th Oscars®, executive producer and showrunner Raj Kapoor and executive producer Katy Mullan announced today.  The show also will feature a special appearance by the Los Angeles Master Chorale.  Hosted by Conan O’Brien, the Oscars will air live on ABC and stream live on Hulu on Sunday, March 2, 2025, at 7 p.m. ET/4 p.m. PT, with the official live red carpet show airing at 6:30 p.m. ET/3:30 p.m. PT."
full_description = "News DOJA CAT, CYNTHIA ERIVO, ARIANA GRANDE, LISA OF BLACKPINK, QUEEN LATIFAH AND RAYE TO PERFORM AT 97TH OSCARS® Image Posted Monday, February 24, 2025 - 10:00 Doja Cat, Cynthia Erivo, Ariana Grande, LISA of Blackpink, Queen Latifah and RAYE will participate in showstopping performances celebrating the filmmaking community and some of its legends at the 97th Oscars®, executive producer and showrunner Raj Kapoor and executive producer Katy Mullan announced today. The show also will feature a special appearance by the Los Angeles Master Chorale. Hosted by Conan O’Brien, the Oscars will air live on ABC and stream live on Hulu on Sunday, March 2, 2025, at 7 p.m. ET/4 p.m. PT, with the official live red carpet show airing at 6:30 p.m. ET/3:30 p.m. PT.READ MORE STARS CONTINUE TO LINE UP FOR THE 97TH OSCARS® Image Posted Wednesday, February 19, 2025 - 05:30 Joe Alwyn, Sterling K. Brown, Willem Dafoe, Ana de Armas, Lily-Rose Depp, Selena Gomez, Goldie Hawn, Connie Nielsen, Ben Stiller and Oprah Winfrey will present at the 97th Oscars®, executive producer and showrunner Raj Kapoor and executive producer Katy Mullan announced today. Nick Offerman will serve as the announcer for this year’s show. Hosted by Conan O’Brien, the Oscars will air live on ABC and stream live on Hulu on Sunday, March 2, 2025, at 7 p.m. ET/4 p.m. PT, with the official live red carpet show airing at 6:30 p.m. ET/3:30 p.m. PT.READ MORE HOLLYWOOD STREET CLOSURES FOR 2025 OSCARS® WEEK Image Posted Friday, February 14, 2025 - 10:00 To ensure public safety, support security strategies and facilitate the production of this year’s Oscars®, the Academy of Motion Picture Arts and Sciences and the City of Los Angeles have finalized street closure plans around the Dolby® Theatre at Ovation Hollywood.READ MORE OSCARS® GOVERNORS BALL RETURNS FOR 66TH YEAR Image Posted Thursday, February 13, 2025 - 11:00 The Governors Ball, the Academy of Motion Picture Arts and Sciences’ official post-Oscars® celebration, which will immediately follow the 97th Oscars ceremony on Sunday, March 2, returns for its 66th year. For details on this year’s ball, including décor renderings and sustainability efforts, visit the press kit here (registration is required).READ MORE MORE STARS TAKE THE STAGE TO PRESENT AT THE 97TH OSCARS® Image Posted Tuesday, February 11, 2025 - 05:20 Halle Berry, Penélope Cruz, Elle Fanning, Whoopi Goldberg, Scarlett Johansson, John Lithgow, Amy Poehler, June Squibb and Bowen Yang will present at the 97th Oscars®, executive producer and showrunner Raj Kapoor and executive producer Katy Mullan announced today. Hosted by Conan O’Brien, the Oscars will air live on ABC and stream live on Hulu on Sunday, March 2, 2025, at 7 p.m. ET/4 p.m. PT, with the official live red carpet show airing at 6:30 p.m. ET/3:30 p.m. PT.READ MORE 97TH OSCARS® NOMINEES DETERMINED FOR ANIMATED FEATURE FILM, DOCUMENTARY FEATURE FILM AND BEST PICTURE CATEGORIES Image Posted Monday, February 10, 2025 - 14:30 The Academy of Motion Picture Arts and Sciences announced today the designated Oscar® nominees that were yet to be determined in the Animated Feature Film, Documentary Feature Film and Best Picture categories at the time of the 97th Oscars® Nominations Announcement that took place on Thursday, January 23. Across 23 awards categories, there are a total of 220 individual nominees, not including the five countries nominated for International Feature Film.READ MORE OSCAR® WINNERS ROBERT DOWNEY JR., CILLIAN MURPHY, DA’VINE JOY RANDOLPH AND EMMA STONE RETURN TO THE OSCARS® STAGE Image Posted Tuesday, February 4, 2025 - 10:00 Academy Award® winners Robert Downey Jr., Cillian Murphy, Da’Vine Joy Randolph and Emma Stone will present at the 97th Oscars®, executive producer and showrunner Raj Kapoor and executive producer Katy Mullan announced today. All return to the Oscars stage after winning last year in their respective acting categories. Hosted by Conan O’Brien, the Oscars will air live on ABC and stream live on Hulu on Sunday, March 2, 2025, at 7 p.m. ET/4 p.m. PT, with the official live red carpet show airing at 6:30 p.m. ET/3:30 p.m. PT.READ MORE 97TH OSCARS® PRODUCTION TEAM ANNOUNCED Image Posted Monday, February 3, 2025 - 11:00 The Oscars® executive producer and showrunner Raj Kapoor and executive producer Katy Mullan today announced members of their production team for the 97th Oscars, hosted by Conan O’Brien and airing live on ABC and streamed live on Hulu on Sunday, March 2, 2025, at 7 p.m. ET/4 p.m. PT.READ MORE AMELIA DIMOLDENBERG RETURNS FOR SECOND YEAR AS ACADEMY’S OFFICIAL SOCIAL MEDIA AMBASSADOR AND RED CARPET CORRESPONDENT FOR THE 97TH OSCARS® SEASON Image Posted Tuesday, January 28, 2025 - 11:00 UK comedian, broadcaster, and producer Amelia Dimoldenberg will serve as the face of the 97th Oscars® social media campaign in the role of Social Media Ambassador and Red Carpet Correspondent, having previously served in this role for the 96th Oscars season. In this capacity, she will participate in multiple key events throughout the awards season, including hosting interviews with nominees and talent on the Oscars red carpet. The Oscars will air live on ABC and broadcast outlets worldwide on Sunday, March 2, 2025, at 7 p.m. ET/4 p.m. PT, with the official live red carpet show airing at 6:30 p.m. ET/3:30 p.m. PT.READ MORE 14 ACHIEVEMENTS TO BE HONORED WITH SCIENTIFIC AND TECHNICAL AWARDS® Image Posted Monday, January 27, 2025 - 11:30 The Academy of Motion Picture Arts and Sciences announced today that 14 scientific and technical achievements, represented by 37 individual award recipients, will be honored at its annual Scientific and Technical Awards ceremony, which has been rescheduled to Tuesday, April 29, 2025, at the Academy Museum of Motion Pictures.READ MORE"
