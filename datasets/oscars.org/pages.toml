["https://oscars.org/footer/careers"]
title = "Careers | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "/*<![CDATA[*/ .field.field--name-field-attached-view.field--type-viewreference.field--label-hidden { display: none; } /*]]>*/ The Academy is a nonprofit organization with approximately 650+ employees.The Academy has four buildings throughout the Los Angeles area – the Academy headquarters and the Fairbanks Center for Motion Picture Study in Beverly Hills, the Pickford Center for Motion Picture Study in Hollywood, and the Academy Museum of Motion Pictures in Los Angeles. Search and Apply for Jobs Equal Employment Opportunity The Academy is committed to equal opportunity in employment and to creating, managing and valuing diversity in its workforce. Maintaining a diverse workforce is vital to the Academy. Accordingly, the Academy enforces a strict policy that prohibits discrimination in hiring, training, compensation, promotion, transfer, or termination, whether on the basis of race, color, national origin, religion, sex, disability, age, veteran status, sexual orientation or genetic information. This includes a workplace that is free of all forms of harassment. And, to help foster diversity, the Academy utilizes programs that ensure fairness of opportunity, pay, and growth to all applicants and employees. Every employee of the Academy is required to follow this policy and to preserve the Academy’s commitment to diversity."
