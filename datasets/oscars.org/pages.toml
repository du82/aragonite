["https://oscars.org/about/board-of-governors"]
title = "Board of Governors | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = '''/*&amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;lt;![CDATA[*/ .view-committee { display: none !important; } h2.gold-text { padding-bottom: 10px; margin-bottom: 30px; margin-top: 50px; border-bottom: 1px solid #c79f27; } .view-board-of-governors h3 { margin: 0 0 20px; } /*]]&amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;amp;gt;*/ Representing all branches of the Academy, the 55-person Board of Governors is responsible for the governance, corporate oversight, and strategic direction of the Academy. Governors have a fiduciary responsibility to the Academy and preserve the institution’s financial health while ensuring fulfillment of the Academy’s mission.The board approves annual goals and the annual budget presented by the CEO, and it approves policies concerning governance, membership and awards. Governors generally attend 7-10 board meetings annually and serve on a board committee. Governors also serve on their branch’s executive committee and are expected to attend Academy events throughout the year.CEO Bill Kramer oversees a staff of more than 700 who conduct the Academy’s day-to-day business. Officers 2024 - 2025President - Janet YangMs. Yang, a member of the Producers Branch since 2002, began her career in China working on Steven Spielberg's Empire of the Sun. Her extensive film and TV producing credits include The Joy Luck Club, The People vs. Larry Flynt, High Crimes, Dark Matter, Zero Effect, and the Academy Award-nominated animated film Over the Moon. She won an Emmy for the HBO film Indictment: The McMartin Trial.Vice President/Secretary - Howard A. RodmanMr. Rodman wrote the films Joe Gould's Secret, August, and Savage Grace. He is past president of the WGAW, professor at USC’s School of Cinematic Arts, and an artistic director of the Sundance Screenwriting Labs.Vice President/Treasurer - Donna GigliottiDonna Gigliotti is one of only fifteen women to win an Academy Award for Best Picture in 95 years of Oscar history. She received the 1998 Oscar for producing Shakespeare In Love. She received three additional Academy Award nominations for Best Picture: Hidden Figures (2016), Silver Linings Playbook (2013), and The Reader (2008). She is President of Tempesta Films, a film production company based in New York.Vice President - Lynette Howell TaylorMs. Howell Taylor has produced over 25 films in the last 15 years, including Bradley Cooper's A Star is Born, which received 8 Academy Award nominations. Most recently, she produced The Accountant 2 for Amazon. Her film credits include Captain Fantastic, The Accountant, and Blue Valentine. Ms. Howell Taylor is a governor of the Producers Branch and also produced the 92nd Academy Awards.Vice President - Lesley BarberLesley Barber is best known for her score for Kenny Lonergan’s Oscar-winning Manchester by the Sea. Her other credits include Late Night, Mansfield Park, Irreplaceable You, How To Change The World, and You Can Count on Me amongst others.Vice President - DeVon FranklinMr. Franklin, a member of the Executives Branch, is the former SVP of Production for Columbia Pictures Entertainment and now runs his own production company, Franklin Entertainment. He has produced the hit films Breakthrough, The Star, and Miracles from Heaven. He is also a New York Times bestselling author and minister.CEO - Bill KramerPrior to becoming the Academy's CEO in 2022, Mr. Kramer was the Director and President of the Academy Museum of Motion Pictures, which opened under his leadership. He has also served in senior fundraising and external relations roles at the Sundance Institute, Brooklyn Academy of Music, California Institute of the Arts, Columbia University School of the Arts, and Rhode Island School of Design.Governors 2024 - 2025Actors BranchMarlee MatlinMarlee became the first Deaf actor to win an Academy Award for Best Actor in her debut performance in Children of a Lesser God. She went on to star in Walker, Hear No Evil, and the Oscar winning Best Picture, CODA. Marlee was an Executive Producer of the Oscar nominated Live Action Short Feeling Through, and was the first Deaf person in the Directors Guild of America.Lou Diamond PhillipsLou Diamond Phillips has in excess of 150 film and TV credits including La Bamba, Stand and Deliver, and Young Guns, garnering numerous accolades including an Independent Spirit Award and nominations for two Emmys, a Golden Globe, and a Tony. He has served on the SAG-AFTRA National Board, SAG Foundation Board, and Advisory Boards for CAPE, ACT Today, and The University of Texas at Arlington.Rita WilsonRita Wilson has acted in over thirty films including Asteroid City, Kimi, Sleepless in Seattle, It’s Complicated, Runaway Bride, Mixed Nuts, Jingle All the Way, and That Thing You Do. She produced A Man Called Otto, My Big Fat Greek Wedding 1 and 2 (2003 Producers Guild Visionary Award), and executive produced the Mamma Mia franchise. Her song "Til You’re Home" was shortlisted for Best Song for the Oscars in 2023.Animation BranchJinko GotohJinko Gotoh is an award-winning producer. Her screen credits include Oscar nominated Klaus, The LEGO Movie 2: The Second Part, The Little Prince, Oscar nominated The Illusionist, Oscar winning Finding Nemo, and Dinosaur. She started her animation career on Space Jam.Marlon WestMarlon West is an award-winning animator, Head of Effects, and VFX Supervisor at Walt Disney Feature Animation Studios. His credits include The Lion King, Pocahontas, The Hunchback of Notre Dame, Hercules, Tarzan, Fantasia 2000, Atlantis: The Lost Empire, The Princess and the Frog, Winnie the Pooh, Frozen, Moana, Frozen 2, and Encanto.Casting Directors BranchRichard HicksMr. Hicks’ nearly 30-year career as a casting director includes over 80 motion pictures, including Hell or High Water, Zero Dark Thirty, Gravity, and Lars and the Real Girl. Richard is an Emmy winner, a past president of the Casting Society (CSA), and a graduate of RADA.Kim Taylor-ColemanMrs. Coleman has been a casting director for over 20 years. Feature credits include Space Jam: A New Legacy, Cheaper by the Dozen, Da 5 Bloods, Harriet, BlacKkKlansman, and Tyler Perry's films and television shows. Television credits include Lovecraft Country, The Good Lord Bird, and Genius: Aretha. She received an Emmy nomination for American Crime.Debra ZaneMs. Zane has been a casting director for over three decades. Her feature credits include Cocaine Bear, The Hunger Games franchise, The Planet of the Apes franchise, Dreamgirls, Catch Me If You Can, Traffic, Galaxy Quest, and American Beauty. Debra is a graduate of Sarah Lawrence College.Cinematographers BranchDion BeebeAustralian-born cinematographer. Nominated twice, Beebe won the Oscar for his work on Memoirs of a Geisha. A two-time BAFTA winner, Dion’s other credits include Collateral, Chicago, Into the Woods, and Edge of Tomorrow.Paul CameronPaul Cameron’s groundbreaking work has established his place in the canon of cinematography. He has directed multiple episodes of Paramount+’s Special Ops: Lioness and HBO’s Westworld. His DP credits include Man on Fire, Reminiscence, Pirates of the Caribbean, Collateral, Swordfish, and Gone in Sixty Seconds. Cameron is a one-time BAFTA Winner, and also has won Emmy, Clio and AICP awards.Ellen KurasOscar nominated for her film The Betrayal/Nerakhoon, Ms. Kuras is a two-time Primetime Emmy winner. Her cinematography credits include Eternal Sunshine of the Spotless Mind, Blow, Summer of Sam, Swoon, and Pretend It’s a City and as a director, Ozark, Catch 22 and Terminal List. Her feature directorial debut, Lee, starring Kate Winslett, will be released in 2024.Costume Designers BranchRuth E. CarterTwo-time Oscar-winner for Black Panther and Black Panther: Wakanda Forever, Ms. Carter makes history as the first African-American to win the Costume Design category and most winning African-American woman in Academy history. A four-time Oscar-nominee, including Malcolm X and Amistad, Ms. Carter has 58 feature film credits including Do the Right Thing, What’s Love Got To Do With It, The Butler, and Selma. She also received the Costume Designers Guild Career Achievement Award.Eduardo CastroMr. Castro’s film credits include Bird on a Wire, Sugar Hill, The Perez Family, Kama Sutra: A Tale of Love, Bride & Prejudice, and he is the recipient of 5 Costume Designers Guild Awards, including the Career Achievement Award in 2013.Daniel OrlandiEmmy-winning Daniel Orlandi’s credits include Logan, The Blindside, Frost/Nixon, Ford v Ferrari, and The DaVinci Code. He was nominated for the BAFTA for Saving Mr. Banks and was nominated for 3 Costume Designers Guild Awards.Directors BranchPatricia CardosoMs. Cardoso is a former archaeologist and anthropologist. She won a Student Academy Award for The Water Carrier. Her directorial work includes Real Women Have Curves (National Film Registry, Sundance Audience Award), El Paseo de Teresa, and Queen Sugar. She is a professor at UC Riverside and was the head of Sundance’s Latin American program.Ava DuVernayMs. DuVernay’s directorial work includes Best Picture nominee Selma, Best Documentary nominee 13th, A Wrinkle In Time, Middle Of Nowhere, I Will Follow, Queen Sugar and her Emmy Award winning series When They See Us. She amplifies the work of Black artists, people of color and women of all kinds through her multi-platform arts collective, ARRAY.Jason ReitmanMr. Reitman is the Oscar-nominated director of Juno, Up In The Air, Thank You For Smoking, Young Adult, Tully, and Ghostbusters: Afterlife. He is the producer of Whiplash, Jennifer's Body, and the series Casual. He has received one Grammy Award and four Academy Award nominations. He is also the co-creator of the LACMA Live Read series.Documentary BranchChris HegedusChris has directed, shot, and edited documentaries for over forty years including the Oscar-nominated film The War Room. She received a DGA Award for Startup.com, Emmy awards for Elaine Stritch at Liberty, and an Emmy-nomination for Unlocking the Cage. Other feature credits include Moon Over Broadway, Kings of Pastry, and Depeche Mode 101.Simon KilmurrySimon Kilmurry is a documentary producer & executive producer. He has received a Primetime Emmy, 17 News & Doc Emmys, and eight Peabodies. Most recent films: Desperate Souls, Dark City and the Legend of Midnight Cowboy (Venice & Telluride Festivals 2022), My Name is Andrea (Tribeca 2022), and El Equipo (Hot Docs 2022). He was executive director of IDA (2015-21) and the executive producer of “POV” on PBS (2007-15).Jean TsienMs. Tsien has been working in documentaries for four decades as an editor, producer and consultant. Her producing credits include the 2024 Oscar-nominated documentary short Island In Between, and the 2021 Primetime Emmy Award winner 76 Days. She is a recipient of the 2018 Art of Editing Mentorship Award presented by Sundance Institute, and the 2020 DOC NYC Lifetime Achievement Award.Executives BranchPam AbdyPamela Abdy serves as Co-Chair and CEO of Warner Bros. Motion Picture Group, encompassing Warner Bros. Pictures, New Line Cinema, and Warner Bros. Pictures Animation.Donna GigliottiDonna Gigliotti is one of only fifteen women to win an Academy Award for Best Picture in 95 years of Oscar history. She received the 1998 Oscar for producing Shakespeare In Love. She received three additional Academy Award nominations for Best Picture: Hidden Figures (2016), Silver Linings Playbook (2013), and The Reader (2008). She is President of Tempesta Films, a film production company based in New York.Hannah MinghellaHannah Minghella serves as the Head of Feature Animation and Family Film at Netflix. Previously she was the President of Motion Pictures at Bad Robot where she produced the Oscar winning adaptation of Charlie Mackesy’s book The Boy, the Mole, the Fox and the Horse for AppleTV+ and the BBC as well as The Blue Angels documentary for IMAX and Amazon. Most recently, Minghella produced David Robert Mitchell’s upcoming movie for WB. Prior to Bad Robot, Minghella spent 14 years at Sony Pictures Entertainment, most recently as President of TriStar Pictures.Film Editors BranchNancy RichardsonNancy Richardson’s credits include Stand and Deliver, To Sleep with Anger, Selena, Thirteen, Lords of Dogtown, Twilight, Step Up, and Fighting with my Family. She has served as a Creative Advisor for the Sundance Directors Lab several times. She has also been a professor at UCLA’s Department of Film, Television and Digital Media for 20 years.Stephen RivkinMr. Rivkin’s feature editing credits include Avatar: The Way of Water, the original Avatar, for which he received an Oscar nomination, Alita: Battle Angel, the first three films of the Pirates of the Caribbean franchise, Ali, The Hurricane, and Robin Hood: Men in Tights.Terilyn A. ShropshireMs. Shropshire is an award-winning editor whose feature credits include: The Old Guard, Beyond the Lights, The Secret Life of Bees, Talk to Me, Love and Basketball, and Eve’s Bayou. She is a Sundance Institute/Adobe Mentorship Award recipient for her commitment to supporting our future rising stars in the craft.Makeup Artists and Hairstylists BranchHoward BergerMr. Berger won an Oscar for his makeup work on The Chronicles of Narnia: The Lion, the Witch and the Wardrobe and was nominated for Hitchcock. His other feature credits include The Amazing Spiderman 2, Lone Survivor, Kill Bill 1 & 2, Dances With Wolves, and Concussion.Linda FlowersMs. Flowers’s credits include Midway, There Will Be Blood, The Social Network, Hunger Games, Catching Fire, Iron Man 2, Lemony Snicket’s A Series of Unfortunate Events, Angels and Demons, and films 3, 4, 7 & 8 in the Fast and the Furious franchise.Gerald QuistGerald Quist has been a makeup artist in the motion picture Industry for over 40 years. His film credits include Star Trek VI : The Undiscovered Country, Mr. Holland’s Opus, Tropic Thunder, Drive, The Way Back, Fast and Furious and The Sixth Sense. He's the recipient of 5 Primetime Emmy Awards and 17 Emmy Nominations, and has been a member of the Makeup Artists and Hairstylists branch of the Academy since 2009.Marketing and Public Relations BranchMegan ColliganMegan Colligan was most recently the President of IMAX Entertainment. Prior to joining the company, Ms. Colligan served in executive roles at Paramount Pictures, spearheading many of Paramount’s most successful franchise properties and overseeing Paramount’s Home Entertainment division.David DinersteinDavid Dinerstein won an Academy Award for producing Summer Of Soul. He was a studio executive at 20th Century Fox, Paramount Pictures and Miramax Films. He has been involved in the production, marketing or distribution on over 200 films including Pulp Fiction, American Hustle, Her, The Illusionist, The Ice Storm, You Can Count On Me, The Full Monty, Paris Is Burning and Hustle & Flow.Laura C. KimMs. Kim was most recently EVP, Marketing at Participant where she oversaw marketing on speci'''
