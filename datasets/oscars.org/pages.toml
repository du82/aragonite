["https://oscars.org/gold-rising/how-apply"]
title = "HOW TO APPLY | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "There are two ways to become a part of Gold Rising.For students interested in behind-the-camera careers, click here to learn more about Production Track.For students interested in applying to an internship, click here.Stipends are provided for students living and attending schools outside California.Details:While our partner companies may have different start and end dates for their internships, the 2025 Gold Rising program will run from June 16 through August 7, 2025. Interns who work directly for the Academy work a minimum of 20 hours per week. Hours vary for interns employed by participating partner companies. All internships are paid.Applications open: November 19, 2024 Eligibility requirements: Community college, trade school and university undergraduates from the class of 2023 to 2026 and graduate students in good academic standing are eligible.For any questions, email goldrising@oscars.org."
