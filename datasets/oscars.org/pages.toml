["https://oscars.org/oscars/voting"]
title = "Voting | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "Image VOTING PROCEDURESAll eligible Academy members participate in Oscars voting. Best Picture nominations are determined by eligible members from all 19 Academy branches. In other categories, the nominations are determined by members of a specific branch or voters who meet eligibility requirements. All rounds of Oscars voting are done by secret online ballot tabulated by the independent accounting firm of PricewaterhouseCoopers.For more information, please refer to the key dates. PRELIMINARY VOTING PROCESSPreliminary voting precedes nominations voting and pertains to 10 award categories.Eligible voting members, typically of the corresponding branch, are invited to participate in the preliminary voting round. All eligible and qualified entries are voted on by a secret online ballot when determining the category’s shortlist. Each category with the preliminary voting round may have special rules and procedures as outlined in the Rules & Eligibility page.The shortlisted titles are announced via an Academy press release. In the event a shortlisted achievement is declared ineligible by the Academy, it shall not be replaced, and the category will remain with one less shortlisted film. AWARD CATEGORIES WITH PRELIMINARY VOTING: Animated Short Film Documentary Feature Film Documentary Short Film International Feature Film Live Action Short Film Makeup and Hairstyling Music (Original Score) Music (Original Song) Sound Visual EffectsNOMINATIONS VOTING PROCESSAll 23 award categories are voted on in the nominations voting round. Most categories are voted on by eligible voting members of the corresponding branch; however, certain categories may be open to members across all voting branches. Entries are voted on by a secret online ballot. Each category may have special rules and procedures as outlined in the Rules & Eligibility page. Best Picture nominations are determined by eligible members from all 19 Academy branches.Results are announced live via global livestream on Oscar.com, Oscars.org, the Academy’s digital platforms (TikTok, Instagram, YouTube, Facebook), ABC’s Good Morning America, and ABC News Live, Disney+ and Hulu.In the event a nominated achievement is declared ineligible by the Academy, it shall not be replaced, and the category will remain with one less nomination. FINALS VOTING PROCESSAll eligible Academy members may participate in Oscars voting in the final round. Members may vote in all 23 award categories. The winners are announced live on the Oscars broadcast on ABC and streamed live on Hulu."
