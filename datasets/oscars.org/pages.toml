["https://oscars.org/academy-film-archive/about-archive"]
title = "Visit/Loans/Licensing | Oscars.org | Academy of Motion Picture Arts and Sciences"
description = "The Archive’s facility at the Pickford Center for Motion Picture Study includes a fully equipped access center where staff and visitors alike may schedule appointments for on-site viewing. Research conducted at the Archive has ranged from scholarly studies of early sound films to fact-checking for Oscar preview issues of major entertainment magazines. Academy members, scholars, and the general public who have a legitimate research interest in materials held by the Academy may arrange viewing appointments through the Archive’s access center.Please read the following access policies and procedures carefully before inquiring about a viewing appointment:Research appointments will not be made to show materials that are available through other means.Every reasonable effort should be made by researchers to ascertain whether materials are available for viewing, rental, purchase, or loan through other outlets before requesting a viewing appointment at the Archive. The many college, university and public library collections in the Los Angeles area, as well as independent video stores, are good sources for foreign films, documentaries, short subjects, and other hard-to-find titles.Moving image materials in the Archive’s collection are available for on-site viewing only at the Pickford Center facility. The Archive does not distribute reference copies of materials in the collection.The Archive provides on-site access to past Academy Awards® show broadcasts and related footage. Questions about obtaining or licensing footage from previous Academy Awards show broadcasts should be directed to the Academy’s Legal Department at (310) 247-3000.Researchers are welcome to use laptops or handheld computers as well as pen or pencil and paper for taking notes. However, cellular reception is poor in the access center, and making or taking cell phone calls while other patrons are present is prohibited. No personal recording equipment may be used at any time in the access center.Food and drink, including water bottles, represent a potential hazard to materials and equipment and are not permitted in the access center.Viewing appointments must be made a minimum of 36 hours in advance. Significantly longer lead times may apply for some requests. No walk-in visitors will be accommodated. All collection materials require a minimum of 24 hours for climatization before they may be made available for viewing in room-temperature viewing environments; in addition, most film materials require a general physical inspection and other preparations before they may be viewed.Viewing appointments are booked on a first-come, first-served basis, and should be made as far in advance as possible. Researchers with limited schedules or those coming from out of town to view materials at the Archive are strongly advised to consult the access center and reserve viewing time before finalizing travel arrangements.Access to materials held by the Archive is not guaranteed. Researchers may need to obtain advance written permission from donors or depositors for access to restricted collections. The Archive may also restrict access to materials at its discretion on the basis of physical condition, preservation status, or other considerations.In some cases, the Archive is the sole repository for a unique film print or other copy. Under these circumstances, the Archive may restrict access to that material until a viewing copy can be made.The Archive welcomes inquiries about the collection, but at this time most records are searchable by film title only. Researchers should accurately note the title(s) of interest and release year, plus additional information if known, to ensure the fastest possible reply. An online catalog of the Archive's holdings, along with those of the Academy's Margaret Herrick Library, can be found here.The Academy has the following policies in place to keep you and our staff safe:Face Masks: All visitors ages 2 and up are also strongly encouraged to wear a face mask in the Academy's indoor spaces.Symptom Check: Visitors are required to self-certify they are free of COVID-19 symptoms before entering the building. Please do not visit the Academy if you’re feeling sick or are experiencing COVID-19 symptoms (such as cough, shortness of breath, difficulty breathing, fever, chills, or any other symptoms), or if you have had contact with anyone confirmed or suspected of having COVID-19. Please note that visitors displaying COVID-19 symptoms will not be allowed to enter.​To request information or schedule a viewing appointment via e-mail: Viewing request form"
full_description = "Image Visiting Loan Policies Licensing Materials The Archive’s facility at the Pickford Center for Motion Picture Study includes a fully equipped access center where staff and visitors alike may schedule appointments for on-site viewing. Research conducted at the Archive has ranged from scholarly studies of early sound films to fact-checking for Oscar preview issues of major entertainment magazines. Academy members, scholars, and the general public who have a legitimate research interest in materials held by the Academy may arrange viewing appointments through the Archive’s access center.Please read the following access policies and procedures carefully before inquiring about a viewing appointment:Research appointments will not be made to show materials that are available through other means.Every reasonable effort should be made by researchers to ascertain whether materials are available for viewing, rental, purchase, or loan through other outlets before requesting a viewing appointment at the Archive. The many college, university and public library collections in the Los Angeles area, as well as independent video stores, are good sources for foreign films, documentaries, short subjects, and other hard-to-find titles.Moving image materials in the Archive’s collection are available for on-site viewing only at the Pickford Center facility. The Archive does not distribute reference copies of materials in the collection.The Archive provides on-site access to past Academy Awards® show broadcasts and related footage. Questions about obtaining or licensing footage from previous Academy Awards show broadcasts should be directed to the Academy’s Legal Department at (310) 247-3000.Researchers are welcome to use laptops or handheld computers as well as pen or pencil and paper for taking notes. However, cellular reception is poor in the access center, and making or taking cell phone calls while other patrons are present is prohibited. No personal recording equipment may be used at any time in the access center.Food and drink, including water bottles, represent a potential hazard to materials and equipment and are not permitted in the access center.Viewing appointments must be made a minimum of 36 hours in advance. Significantly longer lead times may apply for some requests. No walk-in visitors will be accommodated. All collection materials require a minimum of 24 hours for climatization before they may be made available for viewing in room-temperature viewing environments; in addition, most film materials require a general physical inspection and other preparations before they may be viewed.Viewing appointments are booked on a first-come, first-served basis, and should be made as far in advance as possible. Researchers with limited schedules or those coming from out of town to view materials at the Archive are strongly advised to consult the access center and reserve viewing time before finalizing travel arrangements.Access to materials held by the Archive is not guaranteed. Researchers may need to obtain advance written permission from donors or depositors for access to restricted collections. The Archive may also restrict access to materials at its discretion on the basis of physical condition, preservation status, or other considerations.In some cases, the Archive is the sole repository for a unique film print or other copy. Under these circumstances, the Archive may restrict access to that material until a viewing copy can be made.The Archive welcomes inquiries about the collection, but at this time most records are searchable by film title only. Researchers should accurately note the title(s) of interest and release year, plus additional information if known, to ensure the fastest possible reply. An online catalog of the Archive's holdings, along with those of the Academy's Margaret Herrick Library, can be found here.The Academy has the following policies in place to keep you and our staff safe:Face Masks: All visitors ages 2 and up are also strongly encouraged to wear a face mask in the Academy's indoor spaces.Symptom Check: Visitors are required to self-certify they are free of COVID-19 symptoms before entering the building. Please do not visit the Academy if you’re feeling sick or are experiencing COVID-19 symptoms (such as cough, shortness of breath, difficulty breathing, fever, chills, or any other symptoms), or if you have had contact with anyone confirmed or suspected of having COVID-19. Please note that visitors displaying COVID-19 symptoms will not be allowed to enter.​To request information or schedule a viewing appointment via e-mail: Viewing request form Requirements Prospective borrowers should first ensure that they meet the required criteria, then submit a completed Venue Report and/or Loan Request form (available below in PDF format):Academy Film Archive1313 Vine StreetLos Angeles, CA 90028Attn: Print loan requestsFax: +1 310.247.3032Email: filmarchive@oscars.orgLOAN REQUEST VENUE REPORTThe Academy Film Archive is a member of the International Federation of Film Archives and abides by their internal rules regarding loan of materials to FIAF member archives. Institutions that can demonstrate that they meet the Academy Film Archive’s basic requirements for print loans may be permitted to borrow prints from the collection for exhibition. Borrowers assume full responsibility for replacement or repair of damaged, lost, or stolen prints. Replacement of damaged or lost materials may potentially cost thousands (or even tens of thousands) of dollars.Criteria for Archival Print Loans A completed Loan Request form should be filed no less than 6 weeks in advance of the screening date (8 weeks for international loans). All new borrowing institutions must account for an additional 7-10 days to account for processing.First-time borrowers must submit a Venue Report for their organization prior to requesting film prints. FIAF archives with ‘member’ status are not required to complete a Venue Report, but should be sure to indicate their membership status in their initial request. FIAF associate members must have a current venue report on file to be considered for loan requests.If the requesting organization has borrowed materials from the Academy in the past, please list the loan date(s), title(s) of films most recently borrowed, and the name of any Academy staff member(s) with whom previous print loan arrangements were made.Previous borrowers may be asked to fill out and return a Venue Report if we do not have a current (within 5 years) copy on file.Borrowers must represent or act on behalf of a film archive, festival, museum, or other cultural institution. Loans will not be made to commercial venues or through third parties.All Archive prints must be screened on multi-projector (changeover) systems. Archive prints may not be shown on platter projection systems or built-up in any way.Archive prints may not be cut or altered in any way, including - but not limited to - the cutting of frames, scribing of cue marks, or addition of cueing tape. All films must be handled and screened by qualified professionals. Proof of projectionists’ qualifications may be requested before loans to new venues will be approved.Written proof of copyright clearance for all films to be screened must be obtained by the borrower and furnished with the formal loan request. The Academy will not undertake rights research or copyright clearance on borrower's behalf, nor will we loan prints without proof of rights clearance.Borrowers are entirely responsible for shipping and return costs, as well as insurance. Please be aware that you may be required to submit proof of insurance with your loan request.Borrowers assume full responsibility for replacement or repair of damaged, lost, or stolen prints and must notify us immediately if any damage has occurred before and after screening.The Academy will not consider requests from venues that do not comply with the above criteria. Compliance with the above restrictions does not guarantee approval of requests for print loans. The Academy reserves the right to refuse loan requests due to donor/depositor restrictions, insufficient notice, lack of copyright clearance, damage to films previously loaned, or preservation and other concerns. The Academy will also not lend prints that are available through commercial distributors or other sources, and prospective borrowers should be prepared to indicate which other sources have been consulted before they request prints from the Archive’s collection. The Academy Film Archive will limit the number of print loans of feature-length films to twenty titles a month.70mm prints are currently unavailable for loan.The Archive does not lend its best existing print of Academy Award nominated and winning titles. In some circumstances, the Archive may be able to make collection materials available for licensing or reuse in new projects. Procedures for requesting and licensing materials are outlined below. Please note the Archive reserves the right to refuse to duplicate any collection material because of preservation concerns, copyright restrictions, or other considerations. Send licensing inquiries to footage@oscars.org.Please note, if you wish to use a clip and/or still from any Academy Award Presentation, The Governors Awards, The Scientific and Technical Achievement Awards, The Student Academy Awards or any other Academy event or Academy owned property you must complete an A.M.P.A.S. Clip/Still Licensing Submission Form. If it is for news and editorial use ONLY, complete an A.M.P.A.S. Clip/Still Licensing Submission Form for News/Editorials Use Form.InquiryYou must first make an informal inquiry to the Archive to find out if the material is available. If you are or will be in Los Angeles, you may make an appointment for on-site viewing.Duplication Request If the material is available, you must then make a duplication request in writing with the following information:Title of the itemNature of your projectReason for your interest in the itemIf the Archive does not own the rights to the material, and you have already obtained permission from the rightsholder, include that written clearance from the rightsholder for the Archive to share the footage.If the Archive accepts the request, you will be sent an invoice for the standard access fee of $125 per item. If the Archive does not own a video master of the material, you may pay for a transfer to be done at an approved lab. The standard access fee of $125 per item is nonrefundable and does not apply to materials transferred at your expense.Masters will remain the property of the Archive. The Archive will release materials directly to and from the designated lab, but all lab charges will be billed directly to you. The Archive will not reimburse those lab charges in the event that you elect not to use the footage.When access fee is paid (or the transfer is complete), the Archive will provide you with an access copy with visible timecode. All access copies remain the property of the Academy Film Archive and must be returned after use.Licensing RequestIf you wish to license material, you must make a license request in writing with the following information:Title of the item, collection ID number and reel/tape numberTimecode in and out points, with a description of each shotClearance from the rightsholder allowing the Archive to share broadcast-quality clips with you, or if Academy owns the rights, the form of license you are requestingDistribution plansDesired formatDeadline for the materialThe Archive will then review your request, and if approved, the broadcast-quality clip(s) will be provided to you in the format of your choice. Licensing rates will be discussed when you submit your request.If the licensed footage is used in a project, you must provide the Archive with a DVD copy of the project upon its completion.The Archive will provide the best image quality possible for each piece of film or video segment. However, image quality may vary depending upon the condition of the source material.The Archive will process requests for licensing and duplication approximately 3 to 5 weeks from the date of receipt. Rush services are not available. Visiting The Archive’s facility at the Pickford Center for Motion Picture Study includes a fully equipped access center where staff and visitors alike may schedule appointments for on-site viewing. Research conducted at the Archive has ranged from scholarly studies of early sound films to fact-checking for Oscar preview issues of major entertainment magazines. Academy members, scholars, and the general public who have a legitimate research interest in materials held by the Academy may arrange viewing appointments through the Archive’s access center.Please read the following access policies and procedures carefully before inquiring about a viewing appointment:Research appointments will not be made to show materials that are available through other means.Every reasonable effort should be made by researchers to ascertain whether materials are available for viewing, rental, purchase, or loan through other outlets before requesting a viewing appointment at the Archive. The many college, university and public library collections in the Los Angeles area, as well as independent video stores, are good sources for foreign films, documentaries, short subjects, and other hard-to-find titles.Moving image materials in the Archive’s collection are available for on-site viewing only at the Pickford Center facility. The Archive does not distribute reference copies of materials in the collection.The Archive provides on-site access to past Academy Awards® show broadcasts and related footage. Questions about obtaining or licensing footage from previous Academy Awards show broadcasts should be directed to the Academy’s Legal Department at (310) 247-3000.Researchers are welcome to use laptops or handheld computers as well as pen or pencil and paper for taking notes. However, cellular reception is poor in the access center, and making or taking cell phone calls while other patrons are present is prohibited. No personal recording equipment may be used at any time in the access center.Food and drink, including water bottles, represent a potential hazard to materials and equipment and are not permitted in the access center.Viewing appointments must be made a minimum of 36 hours in advance. Significantly longer lead times may apply for some requests. No walk-in visitors will be accommodated. All collection materials require a minimum of 24 hours for climatization before they may be made available for viewing in room-temperature viewing environments; in addition, most film materials require a general physical inspection and other preparations before they may be viewed.Viewing appointments are booked on a first-come, first-served basis, and should be made as far in advance as possible. Researchers with limited schedules or "
