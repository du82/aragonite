["https://oscars.org/gold-rising/tracks"]
title = "TRACKS | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "The Academy Gold Rising Production Track is available for students from community colleges, state schools, trade schools and various film schools who have a specific behind-the-camera career focus on cinematography, costume design, film editing, production design, sound or visual effects. Those interested in directing or producing should apply to the Production Assistant (PA) Track. These tracks may vary from year to year. Students in these tracks will have the opportunity to get hands-on experience shooting a short film or other project, as well as possible on-set experience, health and safety regulations permitting. Students interested in the Production Track are also encouraged to apply for an internship with one of our partner companies. 2025 Gold Production Track applications are now open, click here to apply. This year we are accepting applicants for the following tracks:CinematographyFilm EditingProduction Assistant (PA)SoundStudents must be in the graduating class of 2025, 2026 or have graduated within the last two years.If selected, recipients will need to be in New York or Los Angeles for in-person events during the program. All participants will be responsible for any travel and all other expenses; however, a stipend will be provided."
