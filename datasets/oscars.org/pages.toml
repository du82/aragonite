title = "Oral Histories | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "The Academy’s Oral History Project (OHP) records, collects and preserves audio and video interviews with the individuals who form the rich fabric of filmmaking history – production and costume designers, documentarians, executives, actors, animators, technicians, composers, and more. Some of these assets also include a video component, and transcripts are available on request.For more information on the OHP assets, please contact OralHistories@oscars.org. Oral Histories The Academy’s Oral History Project (OHP) records, collects and preserves audio and video interviews with the individuals who form the rich fabric of filmmaking history – production and costume designers, documentarians, executives, actors, animators, technicians, composers, and more. Some of these assets also include a video component, and transcripts are available on request.For more information on the OHP assets, please contact OralHistories@oscars.org."
