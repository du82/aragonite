description = "View the latest announcements and press releases."
full_description = "Legitimate and verifiable members of the media may register on the Academy Press Office to receive Academy press releases, access photos from Academy events and request Academy Awards media credentials (when available). The Academy Press Office is not for members of the general public. GET NEWS Latest Academy News View the latest announcements and press releases. Press Photos Images in the press photo area are provided by the Academy of Motion Picture Arts and Sciences for use by legitimate members of the press and media only. GET ACCESS Press List Sign Up Sign up to the Academy Press List to get the latest news and receive press releases. OSCARS MEDIA CREDENTIALS APPLICATION The application period for both in-person and virtual coverage opportunities at the 97th Oscars is now closed GET MORE Academy Awards Databases The Academy Awards Database contains the record of past Academy Award winners and nominees, including Scientific and Technical Award winners. Basic and advanced search options are available as well as an option to browse statistics. Press Kits Contains information about the Academy as an institution, its membership, its history, an explanation of voting procedures, information about the producers, hosts and other key participants in the telecast, approved artwork of the Oscar statuette... Clip and Still Request Request use of clip and/or still from any Academy Award Presentation, The Governors Awards, The Scientific and Technical Achievement Awards, The Student Academy Awards or any other Academy event or Academy owned property. Contact Academy Communications Department 8949 Wilshire Boulevard, 5th Floor Beverly Hills, California 90211-1972 +1 310.247.3090 Telephone +1 310.271.3395 Fax publicity@oscars.org"
