["https://oscars.org/learn/science-technology"]
title = "Science and Technology Council | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "The Academy's Science and Technology Council is the driving force behind the Academy’s scientific and technological initiatives. As a strategic advisory body, the Council champions scientific research and technological development in filmmaking. By drawing on the diverse perspectives of the Academy’s global membership, and through dynamic collaborations with industry leaders and educational partners, the Council:Fosters inclusive dialogues about the science and technology of filmmaking that benefit the motion picture industry and audiences worldwide.Promotes scientific and technological advancements that empower filmmakers to achieve their creative visions. Helps to preserve important cinematic technologies and artifacts.Drives the continuous evolution and impact of cinematic storytelling. Key Sci-Tech Council initiatives include:The Academy Color Encoding System - https://acescentral.com/The Academy Digital Preservation Forum - https://academydigitalpreservationforum.org/The Council also is a member of the Academy Software Foundation, a project of The Linux Foundation - https://www.aswf.io.For more information on the Sci-Tech Council, please contact councilinfo@oscars.org."
year_published = 2024
