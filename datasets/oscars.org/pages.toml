["https://www.oscars.org/how-to-watch"]
title = "How To Watch The Oscars"
description = "Find out where to watch the Oscars on air and online. Want to watch the Oscars? Watch on ABC.COM and the ABC app. Tune in to the 97th Oscars through your TV provider or via livestream. Catch the Ceremony at 7:00 PM ET | 4:00 PM PT."
full_description = "When to Watch Tune in to the 97th Oscars at the new time of 7:00pm EDT / 4:00pm PDT / 11:00pm GMT / 7:00am CST. Follow the Oscars season journey across Oscar.com, Oscars.org, or on the Academy’s Instagram, YouTube, TikTok and Facebook to learn more about this year's nominees and show! How to Watch See it for free over-the-air on your local ABC station and streaming live on Hulu for the first time. If you’re a cable or satellite subscriber, ABC is part of your lineup. Stream It Subscribe instantly with streaming services like Hulu Live TV, YouTubeTV, AT&T TV and FuboTV– many of these services offer a free trial as well. Watch on ABC.COM and the ABC app by authenticating with your provider Select your tv provider TV provider may vary based on zip code. watching outside the U.S. Outside of the U.S.? The show is broadcast in more than 200 territories worldwide. Click Here to check your international local listings. YOUR OSCARS SUNDAY SCHEDULE VIEW NOW THE OSCARS PRESHOW 6:30 PM ET | 3:30 PM PT THE 97TH OSCARS 7PM ET | 4PM PT The star lineup includes Stephanie Beatriz, DJ Khaled, Jennifer Garner, H.E.R., Tiffany Haddish, Tony Hawk, Bill Murray, Elliot Page, Kelly Slater and Shaun White, Halle Bailey, Ruth E. Carter, Sean “Diddy” Combs, Kevin Costner, Jamie Lee Curtis, Woody Harrelson, Anthony Hopkins, Samuel L. Jackson, Lily James, Daniel Kaluuya, Zoë Kravitz, Mila Kunis, Lady Gaga, John Leguizamo, Simu Liu, Rami Malek, Shawn Mendes, Lupita Nyong’o, Rosie Perez, Tyler Perry, Chris Rock, Tracee Ellis Ross, Naomi Scott, Wesley Snipes, Uma Thurman, John Travolta, Yuh-Jung Youn and more! HIDE Explore A.frame A.frame is the digital magazine for the Academy of Motion Picture Arts and Sciences. Subscribe to our newsletter Get the latest features direct from the Academy every week, delivered to your inbox."
year_published = 2025
clearnet = "https://www.oscars.org/how-to-watch"
