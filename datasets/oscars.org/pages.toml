["https://oscars.org/about/accessibility"]
title = "Accessibility | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "Accessibility at the AcademyThe Academy is committed to providing accessible events, spaces, and experiences for all Academy members, staff, Academy Museum visitors, guests, and audiences.Following are core components of our accessibility work.Meetings and EventsThe Academy is dedicated to ensuring that all special events and meetings are accessible and create a sense of belonging for all. All in-person and virtual meeting and special events, including the Oscars, Governors Awards, and Academy Museum Gala, include the following:Onsite accessibility team to support inclusive, accessible guest and visitor experience.Lactation rooms.Wheelchairs for guest use.Accessible seating and parking.In-theatre assistive listening devices.Captioned video and clip packages.Live ASL interpreters for public events.All-gender inclusive restrooms.Accessible stages.The ability for all guests and attendees to reach out to accessibility@oscars.org to confidentially communicate accessibility-related questions and event needs.Captions for Zoom meetings and events.In-person hospitality/etiquette training for staff to provide guidance on how to interact with and support guests with accessibility needs and accommodations throughout event season.Live captions connected to any videos and broadcast services.In addition, the Oscars pre-show and main show are made accessible for blind and partially sighted audiences through live audio descriptions services. The Oscars also include an ASL Livestream on YouTube, enabling viewers to create their own second screen experience to accompany the live broadcast.Academy Museum Galleries, Programs, Services, and SpacesThe Academy Museum is deeply committed to making its collection, galleries, programs, and services accessible to all audiences.Please visit here for details on accessibility at the Academy Museum. For general inquiries, specific questions, or concerns, please email academymuseum@oscars.org.Academy Accessibility ERGThe Academy Accessibility Employee Resource Group is centered on awareness, acceptance, advocacy, and action and aims to empower employees with disabilities. All are welcome as we strive to amplify disabled voices and increase accessibility initiatives across the Academy.Academy Membership, Awards Administration, and Talent DevelopmentThe Academy has created the Disability and Accessibility Affinity Group for Academy Members, which is focused on increased awareness and advocacy of people with disabilities in the film community. The group aims to build community among Academy members while encouraging industry shifts related to accessibility, employment, and accurate representation of people with disabilities.All films submitted for Academy Awards consideration to be placed on the Academy Screening Room are required to provide closed captioning. The Academy Screening Room also supports audio descriptions.In our Academy Gold talent development program for emerging filmmakers, the Academy hosts an annual Destigmatizing Mental Health for Emerging and Practicing Filmmakers panel and provides mental health resources and disability support services for all participants."
