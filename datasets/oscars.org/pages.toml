["https://www.oscars.org/library"]
title = "Academy Library | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "Image A core part of the Academy Collection, the Academy Library, also known as the Margaret Herrick Library, is one of the world’s preeminent research facilities dedicated to preserving the artform and industry of motion pictures. Its holdings, amassed since 1928, contain over 52 million items, including books, photographs, scripts, posters, production records, costume design drawings, and so much more. Located in Beverly Hills, the library is open to the public and is used year-round by students, scholars, historians and industry professionals.More information on the Academy Collection, including Academy Library assets, can be found here. Visit/Policies Resources Contact"
