description = "location 8949 Wilshire BoulevardBeverly Hills, CA, 90211aboutThe Samuel Goldwyn Theater is a world-class theater custom-designed to present films at maximum technical accuracy with state-of-the-art projection equipment and sound system. The theater’s 1,010 seats also have been specially designed and placed to create a movie-viewing environment that is ideal in terms of acoustical quality, sightlines and comfort.The Samuel Goldwyn is available April through December and Monday through Friday evenings only. Theater rentals must be centered around screenings. We cannot accommodate awards shows, religious services or memorials.A certificate of insurance is required for all rentals.CONTACTChris RoginskiVice President of Eventscroginski@oscars.org"
