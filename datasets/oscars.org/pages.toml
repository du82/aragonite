full_description = "Image The Academy Talent Development & Inclusion Initiative is pleased to offer the Academy Gold Fellowship for Women designed for emerging women filmmakers. The fellowship combines direct financial support with personalized mentorship, access to once-in-a-lifetime networking opportunities, and lifelong career advancement support via the Gold Alumni Program. Currently, alumni of Academy Gold programs who identify as women, as well as Gold Rising partner company nominees, are eligible to apply. The 2024 fellowship is now closed to applications.The Academy currently awards two Fellowships annually, one in the U.S. and one internationally. For more information about the Fellowship, please contact FellowshipSubmissions@oscars.org. YearGold Fellowship for Women FellowAward2024SHADI KARAMROUDINON-U.S.2024RAHA AMIRFAZLIUS2023JULY JUNGNON-U.S.2023ERICA ENGUS2022OLEKSANDRA KOSTINANON-U.S.2022KARISHMA DUBEUS2021WAAD AL-KATEABNON-U.S.2021KELLY KALIUS2020MAÏMOUNA DOUCOURÉ NON-U.S.2019MOUNIA MEDDOURNON-U.S.2019AISLINN CLARKENON-U.S.2019ELIANA PIPESUS2018ETHOSHEIA HYLTON NON-U.S.2018GEETA MALIKUS"
