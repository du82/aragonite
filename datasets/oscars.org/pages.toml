["https://www.oscars.org/about/sustainability"]
title = "Sustainability | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = "The Academy’s Sustainability CommitmentThe Academy is dedicated to sustainable practices throughout our programs, buildings, and initiatives. Some key components of this commitment follow.Academy Museum LEED CertificationIn October of 2020, the Academy Museum was awarded a LEED Gold Certification by the U.S. Green Building Council. Short for “Leadership in Energy and Environmental Design,” a LEED designation is a globally recognized symbol of sustainability achievement. The world’s most widely used green-building rating system, LEED provides a framework for healthy, highly efficient, cost-saving green buildings.Designed and built to be environmentally responsible, the Academy Museum contains the following components:High-performance indoor environmental systemsSolar power systemsWaste reduction programsEasy public transportation accessRide-share pickup and drop-offBicycle racksFlow-conscious water fixturesA stormwater reuse system for landscaping irrigationNatural ventilation on its bridges and terracesMaximized natural daylightingHigh-efficiency LED lightingGreen cleaning and integrated pest control programsRadiant heating and coolingSolar-tracked automated shading and ventilationAll Academy FacilitiesThe Academy Museum is the Academy’s third adaptive reuse project. All of these projects have extended the lifespan of existing structures, reduced waste, conserved resources, and created a smaller carbon footprint than new buildings.In addition, all four of the Academy’s Los Angeles buildings have:Eliminated the use of plastic water bottlesWater refill systemsNew LED lights attached to motion sensors in place of antiquated fixtures Codified systems of waste disposal including a new composting program to reduce landfill wasteClean Air Commuter ProgramThe Academy offers a robust Clean Air Commuter Program for Academy employees. It is designed to help our employees decrease carbon emissions, cut commuting expenses, and minimize environmental impact. This is a voluntary program for employees who choose to walk, bike, carpool, or take public transportation to commute to the workplace for work-related activities.Employees can participate in the Pave Commute App, which provides tracking and incentives for commuting to work without the use of a single occupancy vehicle. In addition, the Academy offers free EZ transit passes for LA metropolitan area-based employees that commute to work via public transportation. And employees who work in our London and New York offices and who utilize public transportation for commuting are reimbursed for expenses.Oscars, Governors Awards, Governors Ball, and other Special EventsThe Academy is committed to operating as an environmentally responsible organization and ultimately reaching carbon neutrality. Our collective efforts around our special events are designed to account for our emissions, improve waste diversion, and pilot new organizational programs and technologies in line with best practices. These efforts include:Tracking and measuring our overall carbon emissions and environmental impactEducating event guests and staff about the benefits of sustainable fashion via our Global Sustainable Style GuideEliminating single-use plastic water bottles and encouraging reuse by providing water refill systems and canned water bottles where necessaryEnding paper ticketing and using digital tickets and parking passesWorking with vendors, suppliers and partners that are committed to sustainabilityOffering menus with 50% plant-based and vegetarian dishesServing food that is responsibly sourced, sustainably farmed, or listed on the Monterey Bay Aquarium Seafood Watch recommendation listDonating excess food to Chefs to End HungerComposting non-donated foodUtilizing energy-efficient LED lights and battery-operated LED candlesEnsuring that all lighting, audio, rigging equipment and furniture are rented or repurposedEnsuring that rechargeable batteries are used and recycled in all headsets, comteks, transmitters, and microphonesUtilizing plastic, metal, glass, paper, and cardboard that can be recycledUtilizing Rent-The-Runway for all employees to help encourage attire rentalEnsuring all floral arrangements are created in reusable glass vases, and that the floral foam used is biodegradableComposting all fresh flowers and greeneryWorking with Earth Angel Sustainable Production Services to support Academy events on waste collectionEnsuring at least 50% of fabrication and packing materials are reused, recycled or compostedReusing hardware and plywood subflooring Sustainability Style GuideAs part of the Academy’s commitment to sustainability, we are pleased to issue our Sustainability Style Guide.Awards MaterialsAs an awards organization, the Academy is deeply committed to supporting a sustainable awards process. The Academy does not permit physical awards materials to be sent to Academy members. This includes screenplays, screening invitations, and film advertisement flyers. In addition, the mailing of DVDs and CDs to Academy members is banned. We now offer a digital platform for first run films in consideration for an Oscar on our members only app, the Academy Screening Room."
year_published = 2025
year_updated = 2025
