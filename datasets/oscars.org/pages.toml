full_description = '''ACTORS From Academy Bylaws:Article III, Section 1. Membership shall be by invitation of the Board of Governors. Invitations to active membership shall be limited to those persons active in the motion picture arts and sciences, or credited with screen achievements, or who have otherwise achieved distinction in the motion picture arts and sciences and who, in the opinion of the Board, are qualified for membership.To be considered for invitation to membership in the Actors Branch of the Academy, a candidate must:(a) have a minimum of three theatrical feature film credits, in all of which the roles played were scripted roles, one of which was released in the pastfive years, and all of which are of a caliber that reflect the high standardsof the Academy,and/or(b) have been nominated for an Academy Award in one of the acting categories,or(c) have, in the judgment of the Actors Branch Executive Committee,otherwise achieved unique distinction, earned special merit or made an outstanding contribution as a motion picture actor. ANIMATION From Academy Bylaws:Article III, Section 1. Membership shall be by invitation of the Board of Governors. Invitations to active membership shall be limited to those persons active in the motion picture arts and sciences, or credited with screen achievements, or who have otherwise achieved distinction in the motion picture arts and sciences and who, in the opinion of the Board, are qualified for membership.Members of the Animation Branch are filmmakers, artistic craftspeople, and those who have made notable contributions to the field. To be considered for invitation to membership, an individual must:(a) have met one of the following minimum number of screen credits in a key creative supervising, directing or lead role* on theatrical films of a caliber which, in the opinion of the Animation Branch Executive Committee, reflect the high standards of the Academy.• two screen credits at Tier 1 for Animated Feature Films• three screen credits at Tier 2 for Animated Feature Films• four screen credits at Tier 1 for Animated Short Filmsand\or(b) have been nominated for an Academy Award in the Animated Feature Film or Animated Short Film category.or(c) have, in the judgment of the Animation Branch Executive Committee, otherwise achieved unique distinction, earned special merit or made an outstanding contribution to animation.**Proposals must be accompanied by a letter from each sponsor which specifies under which requirement or tier the candidate qualifies and how the candidate reflects the high standards of the Academy.* Key creative supervising, directing or lead roles are defined as follows: Animated Feature Films:• 2 credits at Tier 1• 3 credits at Tier 2Animated Short Films:• 4 credits at Tier 1Please note many of the below job title examples may only apply to CGI animation, but equivalent job titles across various mediums will be considered equally under the appropriate Tier that the sponsor letters specify.TIER 1Creatively oversees the film from start to finish. Develops processes and tools and manages other artists to achieve the overall vision of the film. Coordinates and prioritizes efforts and communication across the entire film. Responsible for the overall delivery of the film against budget and schedule.Job titles include:● Director ● Producer ● Head of Story ● Editor ● Production Designer ● VFX Supervisor ● ScreenplayTIER 2Executes the creative vision and plan for the film at the interdepartmental level. Responsible for resource management, both fiscal and human, to achieve the overall look and delivery of the film.Job titles include, but are not limited to:● Head of Character Animation ● Character Animator Lead ● Supervising Animator ● Animation Director ●Head of Layout ● Director of Photography ● Head of Lighting ● Lighting Supervisor ● Compositing Supervisor● Head of Effects Animation ● Character Design Supervisor ● Art Director ● Co-Director**Candidates with job titles that fall outside Tier 1 and Tier 2 may be considered under the “C” clause for their overall outstanding contribution to animation. ARTIST REPRESENTATIVES From Academy Bylaws:Article III, Section 1. Membership shall be by invitation of the Board of Governors. Invitations to active membership shall be limited to those persons active in the motion picture arts and sciences, or credited with screen achievements, or who have otherwise achieved distinction in the motion picture arts and sciences and who, in the opinion of the Board, are qualified for membership.To be considered for Artist Representatives membership in the Academy, a candidate must: (a) have a minimum of ten years experience as an agent representing at least one Academy Award nominated client at an official ATA recognized company.or(b) have a minimum of ten years experience as a manager representing at least one Academy Award nominated client and must have been directly involved in putting together the film that resulted in their clients’ Academy Award nomination.or(c) have a minimum of ten years experience as an entertainment lawyer representing at least one Academy Award nominated client and must have been directly involved in negotiating the client’s deal that resulted in their Academy Award nomination.or(d) have, in the judgment of the Artist Representatives Subcommittee, achieved unique distinction, earned special merit, or made an outstanding contribution to the arts or sciences of motion pictures as a representative.Candidates must be proposed by two current members of the Academy, one of which is part of the Artist Representatives classification. Proposals must be accompanied by a letter from each sponsor which addresses, as specifically as possible, how the candidate meets one or another of the requirements above. Once being officially proposed, all candidates will be required to submit a personal statement and full client list for the committee’s review.SPECIAL NOTE:To keep membership active, members must continue to serve in the motion picture industry for a period of no less than twenty years, said length of service to include the years prior to membership as well as those subsequent to joining the Academy.In the event a member leaves the industry to take up employment in a non-entertainment industry field of endeavor or takes a hiatus from working status prior to completing the required years of service, the candidate will be designated for membership status change to Emeritus, said change to become effective one year after notification.Emeritus status members are exempt from paying dues and can still attend Academy screenings, but do not have voting status and cannot serve on an Academy committee.In the event a member who has been moved to Emeritus status resumes employment in the motion picture industry, the candidate may request to return to Active status. CASTING DIRECTORS From Academy Bylaws:Article III, Section 1. Membership shall be by invitation of the Board of Governors. Invitations to active membership shall be limited to those persons active in the motion picture arts and sciences, or credited with screen achievements, or who have otherwise achieved distinction in the motion picture arts and sciences and who, in the opinion of the Board, are qualified for membership.To be considered for invitation to Academy membership in the Casting Directors Branch of the Academy, a candidate must:(a) must have a minimum of eight years experience as Casting Director on theatrical feature films,and(b) be primarily responsible for and have screen credit as Casting Director on at least ten theatrical feature films of a caliber which, in the opinion of the Review Committee, reflect the high standards of the Academy,and/or(c) have, in the judgment of the Review Committee, otherwise achieved unique distinction, earned special merit or made an outstanding contribution as a Casting Director.Optional letters of recommendation from filmmakers will be accepted. CINEMATOGRAPHERS From Academy Bylaws:Article III, Section 1. Membership shall be by invitation of the Board of Governors. Invitations to active membership shall be limited to those persons active in the motion picture arts and sciences, or credited with screen achievements, or who have otherwise achieved distinction in the motion picture arts and sciences and who, in the opinion of the Board, are qualified for membership.The Cinematographers Branch Executive Committee will consider extending membership to individuals who meet the requirements listed below. For branch membership, the credits "Director of Photography" and "Cinematographer" are assumed to be synonymous. While the role of "Director of Photography" or "Cinematographer" can vary significantly from project to project, the following definition of "Cinematographer" is intended to further clarify the branch requirements. The “Cinematographer,” also known as the "Director of Photography," is an artist whose canvas is the motion picture medium. They are responsible for visualizing and making artistic and technical decisions in bringing the director's vision to the film. The cinematographer closely collaborates with the director and all craft departments, and oversees the camera, grip, and electric departments in directing the visual elements, which include lighting, framing, composition, camera motion, camera angles, capture medium and camera selection, lens choices, depth of field, color, exposure, filtration, and computer-generated elements. Cinematographers also collaborate virtually with animators, compositors, layout artists, and digital artists, all working together towards the director's goal. It is generally accepted that feature films have one Director of Photography or "principal" Cinematographer who serves as the director's chief visual partner. To be considered for invitation to membership in the Cinematographers Branch of the Academy, a candidate must:(a) have two theatrical feature film credits as Director of Photography or Cinematographer of a caliber which, in the opinion of the executive committee, reflects the high standards of the Academy. Credits should be inclusive of all film genres, and can be films released theatrically, on streaming services and/or screened at a major film festival,or(b) have screen credit as Director of Photography or Cinematographer on a picture nominated for the Academy Cinematography Award,and/or(c) have, in the judgment of the Cinematographers Branch Executive Committee, otherwise achieved unique distinction, earned special merit or made an outstanding contribution as a motion picture cinematographer.Proposals must be accompanied by a letter from each sponsor which addresses, as specifically as possible, how the candidate meets one or another of the requirements above. COSTUME DESIGNERS From Academy Bylaws:Article III, Section 1. Membership shall be by invitation of the Board of Governors. Invitations to active membership shall be limited to those persons active in the motion picture arts and sciences, or credited with screen achievements, or who have otherwise achieved distinction in the motion picture arts and sciences and who, in the opinion of the Board, are qualified for membership.To be considered for invitation to membership in the Costume Designers Branch of the Academy, a candidate must:(a) have at least five years’ experience in the motion picture industry, and have screen credits as Costume Designer on at least four feature films of a caliber which, in the opinion of the executive committee, reflect the high standards of the Academy,and/or(b) have screen credit on a picture nominated for the Costume Design Award,or(c) have, in the judgment of the Costume Designers Branch Executive Committee, otherwise achieved unique distinction, earned special merit or made an outstanding contribution within the candidate's field of endeavors.Proposals must be accompanied by a letter from each sponsor which addresses, as specifically as possible, how the candidate meets one or another of the requirements above.12/2017 DIRECTORS From Academy Bylaws:Article III, Section 1. Membership shall be by invitation of the Board of Governors. Invitations to active membership shall be limited to those persons active in the motion picture arts and sciences, or credited with screen achievements, or who have otherwise achieved distinction in the motion picture arts and sciences and who, in the opinion of the Board, are qualified for membership.To be considered for invitation to membership in the Directors Branch of the Academy, a candidate must:(a) have a minimum of two directorial credits, at least one of which is from the most recent ten years, on theatrical feature films of a caliber which, in the opinion of the executive committee, reflect the high standards of the Academy,and/or (b) have directorial screen credit on a picture nominated for the Academy Directing Award, for the Academy Best Picture and/or for the Academy International Feature Film Award.or(c) have, in the judgment of the Directors Branch Executive Committee, otherwise achieved unique distinction, earned special merit or made an outstanding contribution as a motion picture director. DOCUMENTARY From Academy Bylaws:Article III, Section 1. Membership shall be by invitation of the Board of Governors. Invitations to active membership shall be limited to those persons active in the motion picture arts and sciences, or credited with screen achievements, or who have otherwise achieved distinction in the motion picture arts and sciences and who, in the opinion of the Board, are qualified for membership.To be considered for invitation to Academy membership in the Documentary branch of the Academy, a candidate must:(a.i) Tier 1 (Directors / Producers)To be considered for invitation to Academy membership in the Documentary Branch of the Academy, it’s recommended that a candidate has at least 10 years of experience in the non-fiction field. Candidates must have a minimum of two director and/or producer credits on documentary feature films (one of which must have been within the last five years) of a caliber which, in the opinion of the executive committee, reflect the high standards of the Academy. Credits should be from films released theatrically, and/or screened at a major film festival,or(a.ii) Tier 2 (Cinematographers / Film Editors)To be considered for invitation to Academy membership in the Documentary Branch of the Academy, it’s recommended that a candidate has at least 10 years of experience in the non-fiction field. Candidates must have a minimum of five cinematographer and/or film editor credits on documentary feature films (one of which must have been within the last five years) of a caliber which, in the opinion of the executive committee, reflect the high standards of the Academy. These credits must be principal position screen credits. Credits should be from films released theatrically, and/or screened at a major film festival,(a.iii) Tier 3 (Docum'''
