full_description = "Image Library Databases Index to periodical articles This database contains in-house indexing to selected journals in the library's periodical collection. Journals indexed here can be requested at the library's Reference Desk. Motion Picture Scripts Database This database is an inventory of the motion picture script holdings of eight Los Angeles-area libraries. It is limited almost exclusively to the screenplays of produced films; that is, films which were actually made. MHL DIGITAL COLLECTIONS This database provides public access to a selection of digitized materials from the holdings of the Margaret Herrick Library. Awards Databases ACADEMY AWARDS DATABASE The Academy Awards Database contains the record of past Academy Award winners and nominees, including Scientific and Technical Award winners. Basic and advanced search options are available as well as an option to browse statistics. ACCEPTANCE SPEECH DATABASE This searchable database contains over 1,500 onstage acceptance speeches given by Academy Award winners and acceptors. Many records include links to video clips. Library Catalogs Academy Collection Provides access to Academy holdings, including the Margaret Herrick Library's Graphic Arts, Photograph and Special Collections, Core Collection (books, periodicals, scripts and Production Files) and the Academy Film Archive's moving image catalog."
