title = "Anti-Piracy Statement | Oscars.org | Academy of Motion Picture Arts and Sciences"
full_description = 'OSCARS.ORG TERMS AND CONDITIONS OF USEThe Oscars.org web site ("Site"), including, without limitation, The Official Academy Awards® Database, Scientific and Technical Awards Database, and Motion Picture Credits Database, are Copyright ©2018 by Academy of Motion Picture Arts and Sciences. All rights reserved. Neither the Site nor any part thereof may be reproduced or copied in any form or by any means without the express written consent of the Academy of Motion Picture Arts and Sciences.Regulations for using Intellectual Properties of the Academy of Motion Picture Arts and Sciences PREAMBLESince their inception in 1929, the “©Oscar®” Awards of the Academy of Motion Picture Arts and Sciences have enjoyed increasing international recognition. Today they are among the most respected and sought-after prizes bestowed anywhere.Their prestige, long acknowledged within the motion picture industry, has grown over the years because the public recognizes the Oscar as an award based solely on artistic and technical achievement and because care has been taken to preserve the integrity of the Oscar symbol. Specifically, the Academy has carefully limited reproductions of the Oscar statuette and references to the annual Academy Awards presentation in promotions and advertising.The purpose of these Regulations is to set a code of fair practice for all forms of advertising pertaining to the annual Academy Awards presentation, and for other uses of the Academy’s intellectual properties.The Academy does not wish to restrict the benefits film producers, distributors and exhibitors may derive legitimately from publicity associated with the annual Academy Awards presentation, but desires to equalize these benefits and ensure that:the rights of past and future Academy Award recipients are fully protected,no false claims of Academy Award consideration are made in any advertising medium,the public is not misled by any statement or implication that any achievement has won or been nominated for an Academy Award when that is not so, andthe necessary legal protection is provided for the trademark and copyright owner, i.e., the Academy.The Academy, as the copyright owner of the Academy’s “Oscar” statuette, and owner of its trademarks and service marks, including “OSCAR®,” “OSCARS®,” “ACADEMY AWARD®,” “ACADEMY AWARDS®,” “OSCAR NIGHT®,” “A.M.P.A.S.®” and the federally registered “Oscar” design mark, is required to protect its properties against unauthorized uses and infringements.Please adhere to the spirit as well as the letter of these rules.'
