["https://www.osso.nl/blog/2021/recap2021"]
title = "recap 2021 – OSSO B.V"
full_description = "recap 2021 Written by Walter Doekes Published on 2021-12-24 2021 – het jaar waarin alles ingehaald wordt. Zo eindigde de recap van vorig jaar. Iets té optimistisch naar nu blijkt. De pandemie duurt voort en heeft zijn weerslag gehad op allerlei processen. Contact met onze klanten speelde nu noodgedwongen nog vaker digitaal af. Maar de OSSO-workflow kon grotendeels gehandhaafd blijven. Hier volgen wat downs en (gelukkig vooral) ups van het afgelopen jaar. Challenges 😢 Onze gewaardeerde collega Edgar besloot werk aan te nemen dat dichter bij huis was. Minder reistijd is inderdaad lekker. We gaan je missen! En onze kersverse collega Sander werd toegelaten bij de studie in Amsterdam, en verliet ons dus ook. We vernemen van ’m dat de studie pittig doch superinteressant is. We zijn blij voor je! Ondertussen werd de wereld geplaagd door chiptekorten vanwege de vraag- en aanbodschokken in de economie. Dit zorgt ervoor dat we niet alle hardware op tijd geleverd krijgen – we wachten bijvoorbeeld nog op een stapel EPYC Milan servers die we in maart besteld hebben. Gelukkig hebben we met vooruitziende blik al vroeg wat forser ingeslagen en lopen we niet tegen acute problemen aan. OSSO team wins 🎉 De ISO27001 en NEN7510 audit ging dit jaar in één keer goed zonder afwijkingen. We hebben nieuwe technieken aan onze portfolio toegevoegd, waaronder Loki en Vault. Iedereen is bedreven in het gebruik van Ansible en Salt is nagenoeg uitgefaseerd. Voor onze Kubernetes stack is het beheer verbeterd en hebben we meer tooling om de beveiliging te verbeteren en te monitoren. Alex heeft het Certified Kubernetes Administrator (CKA) examen gehaald. In één keer. We hadden ook niet anders verwacht.. Ronald is teruggekomen uit Australië en computert weer mee. Jeej! Jordi en Rona hebben beiden een gezinsuitbreiding gekregen. Gefeliciteerd! (En óók dít jaar doorgekomen zonder botbreuken of blessures tijdens team-uitjes 👌) Een verbeterd netwerk ✨ Het OSSO core netwerk bestaat alleen nog uit nieuwe Juniper routers. Ons 100Gbit op Cumulus gebaseerde Closso netwerk is volledig in productie en door het gehele team te beheren. Nu inclusief NAT-gateways en load balancers. Alle netwerken en hosts in het nieuwe netwerk zijn in Netbox gedocumenteerd. De meeste servers zijn aangesloten met 25Gbit/s over fiber. Een hele hoop legacy is opgeruimd (Okay, bijna dan.) 🗑️ Alle data is over naar het nieuwe OpenStack Swift-cluster en aan het cluster is nu een cold-storage optie toegevoegd, voor data die minder snel/vaak opgehaald hoeft te worden. Bijna alle klanten zijn over naar de nieuwe generatie load balancers en NAT-gateways. Alle oude VM hypervisors zijn opgeruimd. Veel hardware is uitgezet en vervangen door sneller, nieuwer en zuiniger. Dat geldt ook voor de datadragers: bijna alle spinners en SSDs zijn vervangen door nog snellere NVMEs. Het nieuwe kantoor is nu nog beter 🍔 De ruimte in ons dubbelkantoor stelt ons in staat veilig de 1,5 meter te waarborgen. Ons originele kantoor is nu voorzien van een keuken met kookplaat en vaatwasser. Dit stelt ons nog beter in staat ook de gezelligheid te waarborgen. Verder ↗️ We gaan vol vertrouwen 2022 in, met nog meer focus op private cloud-oplossingen en altijd een stapje vóór als het gaat om beveiliging. En weet, ook in 2022 kunnen we een nieuwe collega SRE gebruiken. Wij wensen onze klanten en leveranciers een goed 2022 toe! 👍 – Walter"
