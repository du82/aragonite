title = "About – OSSO B.V"
full_description = "We are OSSO. We are open source minded and security aware. Here’s a listing of our team. Below it is a listing of roles, in case you need to contact someone specifically. Point of contact for sales, finance, and management related matters. Operations team. Specialisations: High availability architecture, host based security, information security, networking. Supports customers getting to the right solutions in infrastructure design. Point of contact for open source projects and GDPR related matters as our Data protection officer. Also wears the technical half of the Security Officer hat. Specialisations: Software Engineering, VoIP, inner work^H^H^H^Hfeelings of relational databases, when things get low level and complex. Software Engineering. Mostly internal projects such as tooling and integration. Specialisation: Software Engineering and System Engineering, and digging up the Right Fix instead of simply *what works.* Operations team. SRE lead. Lead on development such as Managed Kubernetes and IaaS components. Specialisation: System Engineering, Software Engineering, Kubernetes. Operations team. Specialises in smooth upgrade processes, Ansible automation, writing exhaustive reports, blackout scenario restores, and being a team player. Guardian of Accreditation. Wears the other half of the Security hat. Handles accreditation and compliance or makes sure that her colleagues do the necessary paperwork. Also in team HRM and office management. Does not know the difference between TCP and UDP (yet), but we love her nonetheless. First point of contact for many customers and a key member of the operations team. Has joined Jordi in team Happy Customer. Maintains an unexplained affinity for Sweden. Operations team, software engineering, and aspiring problem solver. Enthusiastic and eager to learn, Seppe thrives on tackling new challenges and diving headfirst into tasks. Passionate about Saab cars and mechanical tinkering, he brings the same curiosity and drive to SRE and in-house software projects."
