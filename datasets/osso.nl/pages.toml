["https://osso.nl/blog/2020/recap2020"]
title = "recap 2020 – OSSO B.V"
full_description = "recap 2020 Written by Walter Doekes Published on 2020-12-16 (I’m sorry, this time the recap is in Dutch instead of English. If you’re reading this, you’re probably Dutch anyway, so it won’t be a problem.) COVID-jaar 2020 is een vreemd jaar geweest, maar voor OSSO was het ook een goed jaar. Waar 2020 nog in mineur begon, omdat we eind 2019 nog een dierbare collega verloren aan een emigratiewens naar het land van de kangoeroes, hebben we in 2020 twee nieuwe collega’s mogen verwelkomen. Sander kwam in februari ons team versterken. (Eerste post van Sander in onze Slack.) Hij kwam binnen als stagair networking, maar had binnen de kortste keren onze harten veroverd door zijn enorme leergierigheid, zin om dingen op te pakken en zijn tomeloze doorzettingsvermogen. Ondanks wat we die jongen bedolven onder een enorm nieuw project, is ie niet geknapt. Kudos! Rona kwam onuitgenodigd in juni. We wisten toen nog niet dat een office manager zo veel meerwaarde kon brengen. (Eerste post van Rona in onze Slack.) Zelf had ik in eerste instantie mijn bedenkingen bij atechnisch personeel. Maar Rona heeft haar nut intussen driedubbel en dwars bewezen. Als een spin zit ze ondertussen overal tussen om de planning, administratie en ISO/NEN-certificatietrajecten in goede banen te leiden. Tof! Herman is een zoon rijker. Gefeliciteerd met Iwan! Ruben van 2hip heeft een tijd bij ons op kantoor gezeten. Gezellig! Hij heeft nu een eigen stek in Roden gevonden. Onze samenwerking blijft onveranderd goed. We hebben het kantoor van de buren geannexeerd, waardoor de werkruimte in het OSSO-kantoor in de MediaCentrale is verdubbeld. Dit maakte het nog makkelijker om de anderhalve meter afstand te bewaren. Wat heeft 2020 ons verder gebracht? Een verdere stap in de richting van automatisch geconfiguereerde netwerken. Kubernetes is en blijft springlevend in 2020 en 2021. Net als het platform evolueren wij mee met de ontwikkelingen op dit en aanverwante gebieden. (Kleinere en veiliger containers, certificaatbeheer, etc..). Onze samenwerking en de korte lijntjes met onze klanten zijn onveranderd goed. Nu had ik me voorgenomen om in elk geval niet onder te doen voor de recap van 2019 of die van 2018. Ik denk dat dat is gelukt 😁 Onze ISO27001- en NEN7510-certificeringen zijn uiteraard verlengd. Er zijn flinke stappen gemaakt met het verhuizen van legacy systemen naar ons nieuwe Cumulus network. Op een supergezellige BBQ bij Alex na, helaas geen dikke team-building excercises in 2020. (Kwade tongen zouden beweren dat dit wel zo veilig is na de gewonden van de motorcross van 2017.) Die houden we tegoed voor voor 2021 – het jaar waarin alles ingehaald wordt. En, ondanks de versterkingen van 2020 zijn we nog steeds op zoek naar een nieuwe collega SRE. Wij wensen onze klanten en leveranciers een Corona-vrij, gezond en bovenal gezellig 2021 toe! 👍 – Walter"
year_published = 2024
