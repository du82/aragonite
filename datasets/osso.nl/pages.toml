["https://osso.nl/kubernetes"]
title = "Kubernetes – OSSO B.V"
full_description = "You should run your workload where it makes sense. Be it from a cost perspective, technical criteria, security requirements, or level of available support. By eliminating black boxes or mystery noisy neighbours, we can see every layer in the infrastructure and don’t try to be mysterious about it either. We build on open source and open networking and we’re open about our infrastructure architecture as well. We optimize for stable long lived kubernetes clusters with a relatively steady load pattern. To handle (un)expected growth, we can easily double or triple the nodes in a cluster in a short time. Due to different levels of scaling, very short lived clusters/capacity demands are not cost effective in our infrastructure. For example use cases that need large amounts of resources (e.g. 50-5000 nodes for a day) are better off in the public cloud. We can facilitate high bandwidth and fast interconnects (up to 10Gbit/s) to public clouds such as (GCE, AWS, Azure) or almost any other datacenter located party in the Netherlands. We make extensive use of Slack for communication with our customers (using shared channels). This allows for easy communication, sharing of code, issues, updates, etc., as well as sharing the occasional joke every now and then :-)"
