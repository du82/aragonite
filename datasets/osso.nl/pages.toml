title = "gpg-agent / ssh / ed25519 / agent refused – OSSO B.V"
full_description = '''gpg-agent / ssh / ed25519 / agent refused Written by Walter Doekes Published on 2024-01-23 After putting in all the work to get ED25519 OpenPGP keys in my Yubikey smart card, I was slightly frustrated that the SSH support "sometimes" didn't work. I thought I had tested that it worked, but today it didn't. $ ssh my_server sign_and_send_pubkey: signing failed for ED25519 "cardno:000612345678" from agent: agent refused operation walter@my_server: Permission denied (publickey). That's odd. Adding some debug to the gpg-agent — debug 1024 in gpg-agent.conf — got me this: DBG: chan_10 -> SERIALNO DBG: chan_10 <- S SERIALNO D2760001240103040006123456780000 DBG: chan_10 <- OK DBG: chan_10 -> GETINFO card_list DBG: chan_10 <- S SERIALNO D2760001240103040006123456780000 DBG: chan_10 <- OK DBG: chan_10 -> SERIALNO --demand=D2760001240103040006123456780000 DBG: chan_10 <- S SERIALNO D2760001240103040006123456780000 DBG: chan_10 <- OK DBG: chan_10 -> GETATTR $AUTHKEYID DBG: chan_10 <- S $AUTHKEYID OPENPGP.3 DBG: chan_10 <- OK DBG: chan_10 -> GETATTR SERIALNO DBG: chan_10 <- S SERIALNO D2760001240103040006123456780000 DBG: chan_10 <- OK DBG: chan_10 -> READKEY OPENPGP.3 DBG: chan_10 <- [ 44 20 28 31 ...(83 byte(s) skipped) ] DBG: chan_10 <- OK DBG: chan_10 -> GETATTR $DISPSERIALNO DBG: chan_10 <- S $DISPSERIALNO 000612345678 DBG: chan_10 <- OK ssh request handler for request_identities (11) ready ssh request handler for sign_request (13) started DBG: chan_10 -> SERIALNO --demand=D2760001240103040006123456780000 DBG: chan_10 <- S SERIALNO D2760001240103040006123456780000 DBG: chan_10 <- OK detected card with S/N D2760001240103040006123456780000 DBG: chan_10 -> SETDATA 3021...> DBG: chan_10 <- OK DBG: chan_10 -> PKAUTH D459... scdaemon[898750]: app_auth failed: Invalid value DBG: chan_10 <- ERR 100663351 Invalid value <SCD> smartcard signing failed: Invalid value ssh sign request failed: Invalid value <SCD> When I tried a different server, things did work: ... DBG: chan_10 -> SERIALNO --demand=D2760001240103040006114652250000 DBG: chan_10 <- S SERIALNO D2760001240103040006114652250000 DBG: chan_10 <- OK detected card with S/N D2760001240103040006114652250000 DBG: chan_10 -> SETDATA 3021...> DBG: chan_10 <- OK DBG: chan_10 -> PKAUTH D459... DBG: chan_10 <- [ 44 20 1d 30 ...(52 byte(s) skipped) ] DBG: chan_10 <- OK No explanations to be found here. But the different server did provide the clue that the OpenSSH version was involved. I tried a few different OpenSSH versions: trusty - 1:6.6p1-2ubuntu2.13 - Accepted publickey ... ED25519 de:14:... bionic - 1:7.6p1-4ubuntu0.7 - Accepted publickey ... ED25519 SHA256:lKE... focal - 1:8.2p1-4ubuntu0.9 - Accepted publickey ... ED25519 SHA256:lKE... jammy - 1:8.9p1-3ubuntu0.6 - <failure> And in fact (tested with a bit of SSH key forwarding) using an older client against the newer server also worked. OpenSSH client side debugging started turning up interesting differences after the third -v: -- OpenSSH_8.9p1 Ubuntu-3ubuntu0.6, OpenSSL 3.0.2 15 Mar 2022 -- -- debug1: Reading configuration data /home/walter/.ssh/config -- -- debug3: kex names ok: [diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1] -- ... 1. debug1: Connecting to old_server port 22. 2. debug1: Connecting to my_server port 22. 3. debug1: Connecting to rsa_server port 22. 4. debug1: Connecting to hostkey_server port 22. -- debug3: set_sock_tos: set socket 3 IP_TOS 0x10 -- -- debug1: Connection established. -- ... -- debug1: Local version string SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6 -- 1. debug1: Remote protocol version 2.0, remote software version OpenSSH_8.2p1 Ubuntu-4ubuntu0.9 2. debug1: Remote protocol version 2.0, remote software version OpenSSH_8.9p1 Ubuntu-3ubuntu0.6 3. debug1: Remote protocol version 2.0, remote software version OpenSSH_8.9p1 Ubuntu-3ubuntu0.6 4. debug1: Remote protocol version 2.0, remote software version OpenSSH_8.9p1 Ubuntu-3ubuntu0.6 1. debug1: compat_banner: match: OpenSSH_8.2p1 Ubuntu-4ubuntu0.9 pat OpenSSH* compat 0x04000000 2. debug1: compat_banner: match: OpenSSH_8.9p1 Ubuntu-3ubuntu0.6 pat OpenSSH* compat 0x04000000 3. debug1: compat_banner: match: OpenSSH_8.9p1 Ubuntu-3ubuntu0.6 pat OpenSSH* compat 0x04000000 4. debug1: compat_banner: match: OpenSSH_8.9p1 Ubuntu-3ubuntu0.6 pat OpenSSH* compat 0x04000000 Server 1 was an older server, server 2, 3 and 4 are the new server, with: (2) failure, (3) an RSA key, and (4) a forced ssh-ed25519 host key algorithm. The log continues.. -- debug2: fd 3 setting O_NONBLOCK -- 1. debug1: Authenticating to old_server:22 as 'walter' 2. debug1: Authenticating to my_server:22 as 'walter' 3. debug1: Authenticating to rsa_server:22 as 'walter' 4. debug1: Authenticating to hostkey_server:22 as 'walter' -- debug3: send packet: type 20 -- -- debug1: SSH2_MSG_KEXINIT sent -- -- debug3: receive packet: type 20 -- -- debug1: SSH2_MSG_KEXINIT received -- -- debug2: local client KEXINIT proposal -- 1. debug2: KEX algorithms: curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,sntrup761x25519-sha512@openssh.com,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256,ext-info-c,kex-strict-c-v00@openssh.com 2. debug2: KEX algorithms: curve25519-sha256,ext-info-c,kex-strict-c-v00@openssh.com 3. debug2: KEX algorithms: curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,sntrup761x25519-sha512@openssh.com,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256,ext-info-c,kex-strict-c-v00@openssh.com 4. debug2: KEX algorithms: curve25519-sha256,ext-info-c,kex-strict-c-v00@openssh.com 1. debug2: host key algorithms: ecdsa-sha2-nistp256 2. debug2: host key algorithms: ecdsa-sha2-nistp256 3. debug2: host key algorithms: ecdsa-sha2-nistp256 4. debug2: host key algorithms: ssh-ed25519 The difference here is me explicitly setting the HostKeyAlgorithms=ssh-ed25519 for server 4. Some more uninteresting logs.. -- debug2: ciphers ctos: chacha20-poly1305@openssh.com,aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com -- -- debug2: ciphers stoc: chacha20-poly1305@openssh.com,aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com -- -- debug2: MACs ctos: umac-64-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha1-etm@openssh.com,umac-64@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512,hmac-sha1 -- -- debug2: MACs stoc: umac-64-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha1-etm@openssh.com,umac-64@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512,hmac-sha1 -- -- debug2: compression ctos: none,zlib@openssh.com,zlib -- -- debug2: compression stoc: none,zlib@openssh.com,zlib -- -- debug2: languages ctos: -- -- debug2: languages stoc: -- -- debug2: first_kex_follows 0 -- -- debug2: reserved 0 -- -- debug2: peer server KEXINIT proposal -- 1. debug2: KEX algorithms: curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256 2. debug2: KEX algorithms: curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,sntrup761x25519-sha512@openssh.com,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256,kex-strict-s-v00@openssh.com 3. debug2: KEX algorithms: curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,sntrup761x25519-sha512@openssh.com,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256,kex-strict-s-v00@openssh.com 4. debug2: KEX algorithms: curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,sntrup761x25519-sha512@openssh.com,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256,kex-strict-s-v00@openssh.com 1. debug2: host key algorithms: rsa-sha2-512,rsa-sha2-256,ssh-rsa,ecdsa-sha2-nistp256,ssh-ed25519 2. debug2: host key algorithms: rsa-sha2-512,rsa-sha2-256,ecdsa-sha2-nistp256,ssh-ed25519 3. debug2: host key algorithms: rsa-sha2-512,rsa-sha2-256,ecdsa-sha2-nistp256,ssh-ed25519 4. debug2: host key algorithms: rsa-sha2-512,rsa-sha2-256,ecdsa-sha2-nistp256,ssh-ed25519 -- debug2: ciphers ctos: chacha20-poly1305@openssh.com,aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com -- -- debug2: ciphers stoc: chacha20-poly1305@openssh.com,aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com -- -- debug2: MACs ctos: umac-64-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha1-etm@openssh.com,umac-64@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512,hmac-sha1 -- -- debug2: MACs stoc: umac-64-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha1-etm@openssh.com,umac-64@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512,hmac-sha1 -- -- debug2: compression ctos: none,zlib@openssh.com -- -- debug2: compression stoc: none,zlib@openssh.com -- -- debug2: languages ctos: -- -- debug2: languages stoc: -- -- debug2: first_kex_follows 0 -- -- debug2: reserved 0 -- 1. 2. debug3: kex_choose_conf: will use strict KEX ordering 3. debug3: kex_choose_conf: will use strict KEX ordering 4. debug3: kex_choose_conf: will use strict KEX ordering This could be something. will use strict KEX ordering is only seen on the newer servers. -- debug1: 