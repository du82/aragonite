["https://osso.nl/blog/2021/chromium-snap-wrong-fonts"]
title = "chromium snap / wrong fonts – OSSO B.V"
full_description = '''chromium snap / wrong fonts Written by Walter Doekes Published on 2021-01-05 So, since a couple of weeks my snap-installed Chromium browser on Ubuntu Focal started acting up: suddenly it chooses the wrong fonts on some web pages. The chosen fonts are from the ~/.local/share/fonts/ directory. Look! That's not the correct font. And it's even more apparent that the font is off when seeing the source view. Bah. That's not even a monospaced font. A fix that appeared to work — but unfortunately only temporarily — involves temporarily moving the custom local fonts out of the way and then flushing the font cache: $ mkdir ~/.local/share/DISABLED-fonts $ mv ~/.local/share/fonts/* ~/.local/share/DISABLED-fonts/ $ fc-cache -rv && sudo fc-cache -rv Restarting chromium-browser by using the about:restart took quite a while. Some patience had to be exercised. When it finally did start, all font issues were solved. Can we now restore our custom local fonts again? $ mv ~/.local/share/DISABLED-fonts/* ~/.local/share/fonts/ $ fc-cache -rv && sudo fc-cache -rv And another about:restart — which was fast as normal again — and everything was still fine. So yes, apparently, we can. However, after half a day of work, the bug reappeared. A semi-permanent fix is refraining from using the the local fonts directory. But that's not really good enough. Appently there's a bug report showing that not only Chromium is affected. And while I'm not sure how to fix things yet, at least the following seems suspect: $ grep include.*/snap/ \ ~/snap/chromium/current/.config/fontconfig/fonts.conf <include ignore_missing="yes">/snap/chromium/1424/gnome-platform/etc/fonts/fonts.conf</include> This would make sense, if current/ pointed to 1424, but current/ now points to 1444. Here's a not yet merged pull request that look's promising. And here, there's someone who grew tired of hotfixing the fonts.conf and symlinked all global font conf files into ~/.local/share/fonts/. That might also be worth a try... A more permanent solution? $ mkdir -p ~/snap/chromium/common/.config/fontconfig $ cat >>~/snap/chromium/common/.config/fontconfig/fonts.conf <<EOF <fontconfig> <include>/etc/fonts/conf.d</include> </fontconfig> EOF I settled for a combination of the linked suggestions. The above snippet looks like it works. Crosses fingers... Three weeks later... Or at least, for a while. It looks like a new snap-installed version of Chromium broke things again. When logging in after the weekend, I was presented with the wrong fonts again. This time, I: fixed the symlinks, removed the older/unused 1444 snap revision, reran the fc-cache flush, and restarted Chromium. Permanent? No! TL;DR (Months later by now.. still a problem.) It feels as if I'm the only one suffering from this. At least now the following sequence appears to work reliably: new Chromium snap has been silently installed; fonts are suddenly broken in currently running version; sudo rm /var/snap/chromium/common/fontconfig/* ; shut down / kill Chromium (make sure you get them all); start Chromium and reopen work with ctrl-shift-T. (It's perhaps also worth looking into whether the default Chromium fonts are missing after snapd has been updated ticket has been resolved.)'''
