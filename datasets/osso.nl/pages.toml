["https://osso.nl/blog/2021/migrating-vm-interfaces-eth0-to-ens18"]
title = "migrating vm interfaces / eth0 to ens18 – OSSO B.V"
full_description = "migrating vm interfaces / eth0 to ens18 Written by Walter Doekes Published on 2021-08-06 How about finally getting rid of eth0 and eth1 in those ancient Ubuntu VMs that you keep upgrading? Debian and Ubuntu have been doing a good job at keeping the old names during upgrades. But it's time to move past that. We expect ens18 and ens19 now. There's no need to hang on to the past. (And you have moved on to Netplan already, yes?) Steps: rm /etc/udev/rules.d/80-net-setup-link.rules update-initramfs -u rm /etc/systemd/network/50-virtio-kernel-names.link Update all references in /etc to the new ens18 style names. Reboot."
