["https://otherkat.com/performances/2021-10-23-shedding-femme-at-detritus.html"]
title = "kat"
full_description = "shedding femme at Detritus, Tension Fine Art Gallery (2021) Cutting away pieces of a patchwork connecting old clothes, shedding femme introspectively invited us to consider the selves we are constructed from, and the process of snipping our way free. The piece took the form of two segments. The first involved the artists performing in solitude, slowly cutting away the fabric. Later in the evening the piece was revisited, allowing the audience to take part in aiding the performer to cut away the patchwork dress. Throughout the performance a microphone was hung from the ceiling, taking the sounds from the audience and the cuts being made and grandulating the sounds through a custom software called MagSpect built by myself."
