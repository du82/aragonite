["https://otherkat.com/performances/2019-04-11-x-body-with-zhi-xu.html"]
title = "kat"
full_description = "X-Body with Zhi Xu at The Place Theatre, London (2019) “X-Body” is the first large-scale dance work completed for Zhi Xu’s practice-led PhD at Brunel University London. It explores choreographically the qualities that constitute a ‘Chinese dancer-body’, and therefore experiments with how a Chinese dancer-body inhabits/constructs digital/technological environments. X-Body focuses on codified movements, but also links up with live camera, real-time processing in Max/MSP/Jitter and Isadora, and live sound synthesis. Sound direction by Kat Macdonald. Choreographer: Zhi Xu Dancers: Jiajie Zhou, Miziying Wang, Rumeng Li, Limeihui Zhu, Zhi Xu Music: Kat Macdonald, Alva Noto, Kiyoshi Yoshida Installation and costume design: Zhi Xu Camera/software operation: Johannes Birringer, Haein Song Lighting and technical direction: Graeme Shaw Premiere: April 11th, 2019, Artaud Performance Centre, London."
year_published = 2025
clearnet = "https://otherkat.com/performances/2019-04-11-x-body-with-zhi-xu.html"
