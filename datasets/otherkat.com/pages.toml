["https://otherkat.com/performances/2022-03-21-a-river-of-no-one-with-the-dap-lab"]
title = "kat"
full_description = "a river of no one with the DAP Lab at The Telepresence Stage (2022) A real-time/live mix telepresence performance by DAP-Lab. Available to watch here. a river of no one is a meditation on the current climate crisis, linking regions and continents in a subtle & intimate exploration of “hydrocommons,” a shared ecological water and plant culture that needs to be imagined as a flow in which all life, not just human life, participates. The new dance/music work showcases dancer/choreographer Zhi Xu, based in Bath, UK, along with London-based trans-femme artist, Kat Macdonald, whose work focuses on the expression of transness in modern society through a diverse range of media. The two artists, performing live from their home studios in front of green screens, collaborate with Johannes Birringer and Michèle Danjoux, co-directors of DAP-Lab (Design and Performance Lab), also in their studios in London and Leicester. Directed by Johannes Birringer & Michèle Danjoux. Performed by Kat Macdonald & Zhi Xu. Music by Kat Macdonald / Choreography by Zhi Xu. Videography by Johannes Birringer & Michèle Danjoux. Additional performance by Athina Bargkaoui & Johannes Birringer. (c) DAP-Lab 2022 Technical direction: Randall Packer with Gregory T. Kuhn (Third Space Network). The Telepresence Stage performance workshop is funded by the UK Arts & Humanities Research Council UKRI/AHRC COVID-19 Response Project: ‘Collaborative Solutions for the Performing Arts: A Telepresence Stage’)."
