full_description = "Your Post Goes Against Our Community Guidelines: an I Love Or Hate Everyday (2022-2023) retrospective by Kat Macdonald (27/11/2023) 0 - Oversharing: an opening plea Hi! Welcome to a look at a piece that took up over a full year of my life. I’ve tried to make this document fun to read while also following a vaguely academic format while I explore my thoughts on I Love Or Hate Everyday, a durational art piece that took place on Instagram throughout 2022-2023. This document will likely be updated and revised multiple times before I decide enough is enough and just post the thing to my website. It’s worth noting, much of this is unfiltered. I wanted a very honest and direct account of the work, that takes into account elements of its creation that can be rather heavy. If you’d rather avoid that level of insight then it’s best not to keep reading. If you are reading this, thank you. If you supported the work during its creation, thank you. If you click off this, admittedly overlong, explanation of my Instagram selfies, thank you. A variable amount of love, Kat 1 - Family tree To start, the piece was heavily inspired and based on the work One Year Performance 1980-1981 by Tehching Hsieh in so far as I would be happy to see it described as a pastiche. The aesthetic similarities are obvious with both works revolving around documenting, via photography, the development of a person over the course of a year. The twist of I Love Or Hate Everyday is the modernised element of hosting the piece ‘live’, using Instagram as my digital art gallery, following elements of the trends of social media platforms. Much of the early thinking around the work was a series of what-if statements sprouting off from Hseih’s work. What does the introduction of a live day-by-day viewing of the work add to the piece? What does it mean to be performed by a white, trans-feminine lesbian? What does my body say in this space? What does it mean if the aesthetics evolve with the piece? What do I wear (if anything) and what does that say that’s different from the original work? From these questions, much of the early piece was born. Another inspiration was the work of Hito Steyerl in Duty Free Art (2015). Speaking around the topic of pattern recognition, the politics of photography and algorithmic censorship on online platforms, she writes “Undesirable body parts thus become elements of a new machine-readable image-based grammar that might usually operate in parallel to reputational and control networks”. Within this context, I wanted to explore my status as a reputationally “undesirable body” creating art on a social media platform and how through this lens, I could analyse how algorithmic censorship models and users self-flag queer and trans bodies as unacceptable for their platform, when nudity can no longer be used as the excuse. What is the edge between acceptable queer bodies, and what is not and could I bring that into the textural nature of the work. This point became more convoluted by subjective ideas of an ‘undesirable body’ as the work went on but this will be covered later in the paper. The final underpinning of the work, to keep it at an easy three, was that of gender and social scholar Julia Serano in her rallying cry of a book, Sexed Up (2022). In a more generalised exploration of the sexualisation of trans-feminine bodies, I wanted to explore the boundary of sexualised art as it applies to the transness of my body. If a ‘female’ nipple is unacceptable (for Instagram’s nudity policy), but a ‘male’ nipple is allowed on the platform, where does that leave my body and how much, if at all, does it come into the censoring of the work? Additionally, how would the sexualisation of my body play into the work, with particular regard to its general audience? 2 - Under the surface In April 2022, I had just finished the final performance of a river of no one with the Design and Performance (DAP) lab, a piece that had exhausted me and reignited old wounds and insecurities. The piece, a Brighton University-funded research project into the creation of art under COVID-19 constraints, had been not only artistically challenging but emotionally exhausting. From being misgendered every rehearsal by an indifferent tech team to having to adapt my entire approach to live sound, due to the delay and compression of the live audio on the round trip it did during rehearsals to the United States and back again, my enthusiasm for creation was spent. Additionally, I have always been uncomfortable under the glare of a camera and a work necessitating a ‘panoptic’ approach to rehearsals didn’t aid my already faulting body image issues. Old insecurities had festered and my way of dealing with discomfort has always been a somewhat misguided approach of tackling the issue directly until I feel comfortable with it. And so this work was born, a somewhat over-intellectualised ‘fuck you’ to society, family and systems that had told me I was ‘unphotogenic’ and ‘undesirable’. 3 - Making art during a cognitive strike Another consideration of the work was its reflection on my period of artistic slump. Coming off the back of a river of no one (2022) and having felt mostly burnt out balancing job hunting, a low-paying but physically exhaustive job working at a local supermarket and my struggles with chronic pain, I needed to carve out time for art in my life. With no space to work on large, labour-intensive projects and having only a handful of hours to devote in a given week, I thought the challenge of a work that took no more than an hour (on average) every evening, was perfect to foster creative energy in my own dwindling reserves. At the same time, my confidence dipped. To put it in blunt terms, I felt my voice wasn’t worth hearing and that there were people more qualified/ diverse/ clever/ privileged (/ insert excuse as to how I was lesser) who had more interesting perspectives on art than my own. I became afraid of my voice and its impact. While this project didn’t always have the best outcomes for me, one thing I will say is that, at a time when most of my life went through huge social and emotional changes, this work picked me up, dusted me off and showed me I am valuable and my voice is worth hearing. 4 - The method The project began involving 6 basic core rules: the taking a live photo (taken within approximately 5 hours of being posted) of myself, nude or semi-nude, including at least either my face or my chest. a censor bar in the image (usually censoring the chest) with a written statement of either “love” or “hate”. the written statement in the censor bar will attempt (where possible) to be based upon a summation of subjective feelings towards my body within a given day. a photo will be posted each and every day. the project will end after a full 365 days of photos. if the piece begins to enable harmful behaviours, the piece will be cancelled. These rules would change throughout the project for both artistic and subjective reasons. I Love Or Hate Everyday would be carried out with a malleability towards elements of the work to prevent from the project causing emotional duress and harm. These rules evolved over time, eventually landing on the following: the taking a live photo (taken within approximately 5 hours of being posted) of myself, nude or semi-nude, including at least either my face or my chest. a censor bar in the image (usually censoring the chest) with a written statement of either “love”, or “hate” and two occasions of “???” with the intensity, size and capitalisation varying. the written statement in the censor bar will attempt (where possible) to be based upon a summation of subjective feelings towards my body within a given day. a photo will be posted each and every day, where possible, with rest days included to allow for mental health breaks. the project will go on for as long as is manageable, or until Instagram flags enough images to remove the art piece from the platform. if the piece begins to enable harmful behaviours, the piece will be placed on hiatus or cancelled. 5 - The ritual The action of the piece went as follows; every evening I would start with setting the lighting and stripping off, testing several poses in the camera before setting on a style or rough position I would like to explore. From there I would begin taking photos, setting a timer of normally 5-10 seconds to allow me to get into position each time. Following an average of 3-6 photos, I would review what I had and see if anything stood out to me. This would repeat until I had a photo I was happy with, that conveyed the emotional value I believed was representative of my current mood. I would then edit the photo to add a sensor bar, add my daily emotion and adjust the brightness of the photo to add depth and play with contrast. Once settled, this would then be added to an Instagram post with the following text: Day (number): (emotion between ‘love’ or ‘hate’) #iloveorhateeveryday #art #body #transfemme #transgender #durational #performance #lgbt #dyke #queer #love The main post would then be shared to my ‘story’ with the addition of a song and lyrical choice that reflected either of the following conditions: Deliberated: Resonated with me emotionally that day. Conveyance: Resonated with the current mood I was looking to amplify in the image. Holistic: This happened to be the song I was listening to while taking the photo. If the photo was flagged by Instagram, a screenshot would be taken of the “Your post goes against our community guidelines” alert and posted in its sted. 6 - Spoilt for choice The choice to allow me to curate the image I chose to post, taking multiple and making a choice as to which I preferred, was an early decision that saved a host of insecurity, even if it did require further time devoted to it each evening. I originally considered its overall impact on the authenticity of each image but having the capability to curate each evening felt like something too important to give up. Playing into the themes of modernising, to hold myself to standards likely set due to the point-shoot-develop nature of photography during the 80’s I believed the curational process of each evening to be in keeping with the modern trends of self-portraits on platforms such as Instagram. Social spaces seem to critique the ‘artificiality’ of a curated existence portrayed on platforms such as Instagram, however, who are we to judge? To curate is a human instinct and is far from a retrospective act. If I spent every evening, testing poses, doing my makeup, preening and double-checking before taking my photo, what stops that from slipping into a real-time form of curation? Am I not just front-loading the process? If I, even subconsciously, chose to eat foods that don’t leave me bloated or spend too much time in the rain for fear my makeup might run for the evening, is that not just as artificial? I felt the sacrifice was worth any costs towards authenticity. 7 - Pretentious phases The work quickly fell into several distinct phases that can neatly be cut into Underconsidered (days 1-99), Experimental (days 100-153), Reactive (days 154-216), Naturalistic (days 217-303), Comfort (days 304-374) and Coda (days 375-400), forgive me my pretension. Rather than looking at this from a purely aesthetic distinction, I would rather consider the mindset I had in creating the work as a boundary line between each of its phases. Obviously, elements of this changed day by day, but broadly speaking I feel it can be easier to surmise from this perspective. Underconsidered - days 1-99 This period of the piece is characterised by a naive consideration of the piece and its wider impact. To start, all photos during this period were taken in a room with minimal to no lighting, with only the flash of the camera to capture the image and while I’m sure somewhere in the world this would be a flattering angle to view yourself from, that was very much not my feelings at the time. The intent was to capture a rawness to the work which I believe was successful, however, the damage this began causing to my sense of self and body image, likely stuck with me for the rest of the work. An interesting addition to this phase was my own physical limitations as a performer. During the course of day 2 of the piece, I dislocated my shoulder and broke several ribs in a fall, leaving me limited in my ability to interact with any more dynamic posing and giving a lasting strain that carried through for at least the first 30 days. Experimental - days 100-153 Bored with the consistency present in the aesthetic of the Underconsidered era, I wanted to experiment further with the imagery of the piece and give myself some relief from the harsh flashes of my camera. During this phase I took a more adaptive and creative approach to lighting within the work, playing with shadow and full-body photos to try to create a work that was more visually distinctive, however, ultimately diluting the naturalised nature of the piece. Creating something that felt rather vapid and shallow to me now. Reactive - days 154-216 Having endured a major breakup and several other effecting incidents, this period is accented by my lesbian itinerant living situation (swapping between the sofa and the bed) causing a lack of consistency in my ability to replicate the lighting conditions of the Experimental era. This forced a sense of realism back into the imagery that ended up fostering a return to form for the piece that I feel now better characterises the overarching theme of a piece following someone’s development over a year. In some ways, the isolation of the work grounded me. The breakup severed several core social connections in my life and after being kicked from a local art show I was working on (including an in-progress showing of I Love Or Hate Everyday) I felt adrift without the previous community of artists I had found a home in. I took comfort in the small consistencies and rituals of the piece. Naturalistic - days 217-303 Empowered by the accidental naturalism of the Reactive phase, I wanted to take that further into the work and embrace the work’s secondary position in my life. It was during this period that I began taking rest days to try to improve my mental health and give the work less impact on my life. Bouncing between staying with friends and people I was sleeping with, the social tax was exhausting, 1-2 am bedtimes followed by 6 am wake-ups for work and I burnt out. Adding even 10 minutes (minimum) extra to take, edit and upload a photo began to drain both my confidence and my constitution. Comfort - days 304-374 Having long since sunk into the routine of the piece, and making a move towards correcting my circadian rhythms, the Comfort stage was an almost overly familiar segment of the piece, where it had sunk into a nightly routine that felt as natural as brushing my teeth. During this era, I made the choice to extend the work for as long as it co"
