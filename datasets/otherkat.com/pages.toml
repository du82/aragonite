["https://otherkat.com/portfolio"]
title = "kat"
full_description = "portfolio of notable works shedding at Gallery Puzić, Saarbruken (2024) shedding is a reworking of the piece shedding femme from 2021 in collaboration with artist Agnes Cameron. An examination of the ways in which feminine archetypes around fashion and presentation can entangle and constrain us, even lead us to a lost concept of the self. This piece was currated by Johannes Birringer at Gallery Puzić in Saarbruken, Germany. mourning for a dead moon with the DAP Lab at Artaud Performance Centre (2019) Mourning for a dead moon is multimedia dance work addressing the climate crisis, performed by the Design and Performance lab (DAP-Lab), Directed by Johannes Birringer, with garment design/art direction by Michèle Danjoux. Dancers/choreography by Zhi Xu, Macarena Ortúzar, Yoko Ishiguro, and Johannes Birringer; music/sound performance and live processing: Kat Macdonald, with Louie Marlow,and instrumental performer Helenna Ren. Lighting by Charles Manister; Video/graphics programming by Johannes Birringer; additional electronics by Maria Dada. Premiere: December 7, 2019, Artaud Performance Centre, London. I Love Or Hate Everyday (2022-2023) A long form 400 day durational piece, exploring digital censorship, sexuality and digial personhood. The piece was featured in a variety of publications including Country and Home Magazines June 2022 issue. Full autoethnography describing the piece, available here. Link To Full Work shedding femme at Detritus, Tension Fine Art Gallery (2021) Cutting away pieces of a patchwork connecting old clothes, shedding femme introspectively invited us to consider the selves we are constructed from, and the process of snipping our way free. The piece took the form of two segments. The first involved the artists performing in solitude, slowly cutting away the fabric. Later in the evening the piece was revisited, allowing the audience to take part in aiding the performer to cut away the patchwork dress. Throughout the performance a microphone was hung from the ceiling, taking the sounds from the audience and the cuts being made and grandulating the sounds through a custom software called MagSpect built by myself."
