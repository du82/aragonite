["https://ourdecline.com/whatis/rules/rule13.htm"]
title = "Attitude to Violence: Matrism v Patrism"
description = "The crucial role of the community's attitude towards violence, IMPLIED by G R Taylor in his explanation of Matrism/Patrism"
full_description = "Rage An Important Element Of Everyone Rage is a part of every human in their reaction to frustration and danger; it is the instinctive response that allows us to overcome difficulties and face danger. However this powerful impulse, like all other impulses, is blind, and needs to be controlled. Selfish Prone To Random Violence The selfish find controlling all impulses difficult, which means they are liable to panic and violence. Lacking the sense of restraint imposed by a code of duty they are prone to outbursts of rage triggered by the least incident. This susceptibility means that in the general course of living they are a danger to themselves as well as others, through acts of random violence. However the selfish are also cowardly, which means without the intoxication of rage they recoil from the dangers of violence, even that required to meet their community's need for violence. And this abhorrence of violence is widespread throughout society from child rearing to sport. Dutiful Employ Necessary Violence Whereas the dutiful suppress the private rage inspired by the mundane activities of daily life. Instead they channel this emotion into fulfilling the community's need for violence, a repression which they ease by watching public displays of violence in the media and on the sports field. This reveals the important role filled by violent sports, as well as how the controlled rage keeps order in society and promotes communal vigour. Example Of Ancient Rome Ancient Rome demonstrated the connection between violent displays and social vigour by matching its removal of violence from public displays in the Arena — replacing mortal combat among gladiators with chariot races — with a decline in the fighting spirit of the Romans. To Recoil From Essential Violence Is To Embrace Insanity To recoil from necessary violence is to recoil from truth. And to recoil from truth is to embrace insanity."
year_published = 2025
clearnet = "https://ourdecline.com/whatis/rules/rule13.htm"
