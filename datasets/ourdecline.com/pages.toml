["https://ourdecline.com/whatis/chap12.htm"]
title = "Why people exist as one of two types"
description = "Why there are two sorts of people, and how this must create two sorts of community (2000)"
full_description = '''My approach to the task of understanding why communities gain, then lose, intelligence is guided by a citizen of ancient Greece. Witnessing the growing friction between Athens and Sparta, Thucydides decided to monitor the events. He believed his record would allow people to decide just how the looming hostilities started, what events triggered them, and who was responsible; an invaluable unbiased history for people to read and therefore learn. His survival of the subsequent war allowed him to publish "The Peloponnesian War", but only after a Mayor review. The young enthusiastic author had become older and wiser. He no longer felt that his careful narration revealed why the war started. The decisions by particular people and the sequence of events were incidental to the whole process. He was now convinced that as long as there were competing groups like Athens and Sparta, human nature would make the outbreak of hostilities inevitable. The reason lay not in events but in our psyche. It is my belief that the same view can be taken with civilization. The secret of understanding this phenomenon lies not just in the study of ancient events, but primarily in understanding ourselves and our community. As every person carries the reason for war within themselves, so we must carry the reason for the rise and fall of societies. The search for understanding must start with observing the people I knew best. Irene My relative's success in obtaining promotion within the public service appalled me: her attitude reflected only her desire for importance and wealth. She cared naught about anything but herself. Achieving the ostensible aims of the job, benefiting the department, improving the community and being worthy of her success were irrelevant. Every effort and resource was poured into advancing her career; white-anting rivals while winning the affections of her bosses and gaining general acclaim. Irene's attitude is the very opposite of what is required in a position wielding authority; she is unconcerned with any matter other than self aggrandisement, and displays all the attributes of a parasite. Her decisions can only reflect what is best for Irene, regardless of the cost to the community. (see also A Modern Mother)'''
year_published = 2025
clearnet = "https://ourdecline.com/whatis/chap12.htm"
