["https://ourdecline.com/aginatur/index.htm"]
title = "Against Nature': TV series denouncing environmentalism"
description = "Channel 4 television series denouncing environmentalism, broadcast in December 1997 as a 3 part program"
full_description = "Against Nature begins by exposing the absence of scientific rigour behind notions such as the greenhouse effect and global warming. It goes on to contrast densely populated, industrialised First World countries (much hated by the Greens), which have clean air, clean water and long life expectancies, with sparsely populated, largely pre-industrial countries (much loved by the Greens), which have polluted water, terrible air and far shorter life expectancies. The second programme exposes the myth of overpopulation and points to the barbarism and racism of environmentalist plans to reduce population levels in the Third World. The last programme in the series identifies environmentalism as the new enemy of science, taking over from religion. It argues that Green scaremongering about genetics and fertility has led to valuable scientific research being stopped."
