["https://ourdecline.com/smartboard/shop/ransford/chap10.htm"]
title = "Natalia: Chapter 10 of 'The Great Trek'"
description = "Natalia: Chapter 10 of 'The Great Trek'"
full_description = "One cannot help feeling it to be extremely unfair that when after much anguish and grief the Voortrekkers had at last secured their position in Natal, it was immediately threatened by the rooineks. For a new British governor at the Cape had resolved on a military occupation of Durban. From the very beginning of the Great Trek the colonial authorities had shown concern about the way Cape Colony was being denuded of wealth and people. As Sir Benjamin D'Urban pointed out a little petulantly to Whitehall, 'It is a matter of deep regret that a large proportion of the farmers who have emigrated are of the oldest and most respectable of the districts to which they belonged, and are in themselves, as a brave, patient, industrious, orderly and religious people, an incalculable loss to the Colony in whatever way they may be regarded—whether as the cultivators, the defenders, or the tax-contributors of the country which they have quitted, and from which they have naturally carried away all their property and possessions, as well as such movables as of cattle, sheep and horses.' But the counter-measures which had been taken were both timid and vacillating. Admittedly the promulgation of the Cape of Good Hope Punishment Act in 1836 had implied that the emigrants could not unilaterally dissolve their allegiance to the Crown and that Britain might still legally assert her authority over them below the 25th degree of latitude South, but no attempt had been made to apply these provisions. This was a law without teeth, and it certainly had done nothing to prevent the best type of settler from leaving the Colony. But a more forward slant to government thinking became apparent in 1838 after Sir George Napier had replaced D'Urban at the Cape. He was concerned less with the weakening of the Colony by the massive Afrikaner emigration than with the treatment the trekkers might mete out to the Africans whose land they were in the process of appropriating, and he feared too that disturbances would follow which might involve the Cape's eastern frontier. He believed it to be in British interests to conclude a peace between the Boers and Dingaan, and, moved by humanitarian motives rather than political reasons, Napier on his own initiative made up his mind to occupy Durban. This step would provide him with a position of strength from which to act as mediator, and it would embarrass the Afrikaners. 'One of my principal motives in taking possession of Natal,' the Governor explained later, 'was to mark my disapproval of the emigrants' proceedings by throwing such impediments in their way as I could.' For by controlling their only supply port Napier believed he could bring effective pressure to bear on the trekkers, and persuade them against continuing the struggle with the Zulus."
author = "Oliver Ransford"
year_published = 2025
clearnet = "https://ourdecline.com/smartboard/shop/ransford/chap10.htm"
