["https://ourdecline.com/signs/sue.htm"]
title = "Official attempt to limit compensation payouts"
description = "Australian Federal government try to limit compensation payouts and halt the dramatic increase in public liability insurance premiums (23/1/2002)"
full_description = "The Government is proposing to stop the dramatic increase in public liability insurance premiums with the creation of a national accident compensation scheme with fixed payouts. The scheme, bitterly opposed by the legal profession, could mean the end of a person's right to sue for unspecified personal injury damages. As a lawyer himself, Small Business and Tourism Minister Joe Hockey must be aware that, in taking on the legal profession, the Federal Government is setting its sights on a formidable foe. Mr Hockey has acknowledged the role of the collapse of HIH and September 11 on skyrocketing premiums which in some cases have pushed insurance charges up more than 700 per cent in a year. However, he has also laid a portion of the blame squarely on so-called greedy lawyers. A former lawyer, Mr Hockey says the Australian legal system has taken on some of the more unsavoury aspects of the legal system in the US. That is, lawyers offering a no-win, no-fees system are prompting a public armed with frivolous claims to become litigious. Mr Hockey said that this has helped to boost public liability claims from 55,000 per annum in 1998 to 88,000 in 2000. The strain on the industry is reflected by insurance companies in 2000 collecting $300 million less in premiums than they paid out. What's at stake, says Mr Hockey, is the Australian love of the outdoors. The Federal Government's scheme would be similar to a New Zealand system whereby businesses pay a levy into a government-controlled compensation fund and put a cap on the level of benefits. Its supporters say that it would also reduce costly, time-consuming litigation, and quickly identify and deal with unjustified claims. However, Australian Plaintiff Lawyers' Association president Rob Davis said that the proposals were 'silly'. He said that only small businesses and the insurance companies would receive any benefit out of a national compensation scheme. Yet the problem remains that thousands of small businesses around the country have either gone, or are on the verge of going, out of operation because of insurance premiums. The situation is especially acute in the tourism industry. Personal liability premiums for businesses such as horse riding have increased by more than 700 per cent in the past year. Even in laid-back small businesses such as Snowy Mountains Fly-fishing Adventures, premiums have risen from $600 to $2500, or 317 per cent. The Big Banana, at Coffs Harbour in NSW, has had its insurance jump from $39,900 to $140,000 in one year."
author = "Gold Coast Bulletin"
year_published = 2025
clearnet = "https://ourdecline.com/signs/sue.htm"
