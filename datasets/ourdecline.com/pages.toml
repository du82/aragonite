["https://ourdecline.com/usa/toll.htm"]
title = "911 — Final Death Toll Of The Attack"
description = "Newspaper articles revealing the reducing death toll of the attack upon the World Trade Centre in the USA on 11/9/2001 (8/8/2011)"
full_description = '''This attack was a Barbarian Raid signalling the start of hostilities that will only cease when the citizens of Western Civilisation have all been killed or enslaved. In this war Nuclear weapons compel an unwelcome choice upon the citizens of Western Civilisation: genocide or suicide. For example, following the threat by Iran (who is now (circa 2006) building nuclear weapons) to "wipe Israel off the map", should the Israelis wait to see if their cities disappear in a flash, or should they make the Iranian cities disappear first? World Trade Centre fatalities drop by 40 —Grant McCool, The Courier-Mail 31st October, 2003 In New York the September 11, 2001, death toll has dropped by 40 to 2985 after investigators found fraud, duplication and people once thought dead, city officials said yesterday. The official death toll has fluctuated frequently since two hijacked passenger planes were flown into the 110-storey twin towers of the World Trade Centre at a time when tens of thousands were normally in the vicinity of the lower Manhattan complex. Since the tragedy, it has been discovered some people invented the names of people to fraudulently claim compensation from the city. New York police have arrested 40 people falsely claiming they lost loved ones. Other names removed yesterday included people whose relatives said they were near the towers at the time but can give little more information. In and around the twin towers there were 2752 deaths, while 189 people died when a plane was flown into the Pentagon. Another 44 were killed when a hijacked jet crashed into a field in Pennsylvania. The official tolls do not include 19 hijackers linked to Saudi-born Islamic militant Osama bin Laden's Al-Qaeda, the global network Washington blamed for a series of attacks on US interests abroad and at home since the mid-1990s. The destruction of the twin towers was so great that medical officials have only been able to positively identify the remains of 1527 victims. Days after the attacks that caused the collapse of the soaring towers, officials feared the number of people killed would be more than 6000.'''
