["https://ourdecline.com/cooray/rights/chap98.htm"]
title = "The Meritocracy won by Affirmative Action"
description = "The changes to the meritocracy in Australia achieved by affirmative action applied in Universities (1985)"
full_description = '9.8.1 The Principle Of Merit The principle of merit in determining responsibility for the management of human affairs at various levels of operations is as old as human society. Under this principle, there is some kind of selection procedure by which the most effective person is sought to perform a particular task. Indeed, in a more primitive form, the same principle has been at work in the natural selection process in biological evolution, promoting the propagation and thriving of those individuals and groups which, through adaptation, have responded most appropriately to the demands of their ecologies. In the human context, the application of this principle tends to ensure that the most effective individual will perform particular tasks, each according to his talents; and to set in train a process of incentives to encourage aspiring individuals to develop their skills so that their life chances might be maximised. Nowhere has this principle of merit been more securely enshrined, nor more widely cherished, than in our educational systems. Seldom, however, has the merit principle been free from an encroaching distortion. Especially in times gone by, a nepotism, perpetrated by some in power, has contrived that others than the "best" available might assume various roles for which they are not the most apt. This has particularly applied to those people who have acquired patrons, by good fortune or inheritance. But for such a distortion of the merit principle, the ancient Chinese might have crossed the threshold leading to growth and an industrial revolution. They were probably thwarted by excessive nepotism. With the present industrial revolution, however, and its product the computer revolution, has come a greater pressure for efficiency produced by the heightened competition in a developing capitalist world; so that, although instances of nepotism are still to be found, they are both less common than formerly, and more likely to yield at least partially to the principles of merit, in response to the pressures of the play of market forces. Though the most successful competitors usually receive the greatest rewards, so too does society at large benefit; but there is an important exception to this assertion: unless special provision is made on their behalf, the handicapped and disabled may fall victims to the relentlessness of these economic forces.'
author = "LJM Cooray"
year_published = 2025
clearnet = "https://ourdecline.com/cooray/rights/chap98.htm"
