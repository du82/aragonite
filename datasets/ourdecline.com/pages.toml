["https://ourdecline.com/decline/orwell1.htm"]
title = "Politics And The English Language"
description = "An essay by George Orwell explaining the direct relationship between politics and the use of language in a community (1946)"
full_description = "Most people who bother with the matter at all would admit that the English language is in a bad way, but it is generally assumed that we cannot by conscious action do anything about it. Our civilization is decadent, and our language — so the arguments runs — must inevitably share in the general collapse. It follows that any struggle against the abuse of language is a sentimental archaism, like preferring candles to electric light or hansom cabs to aeroplanes. Underneath this lies the half-conscious belief that language is a natural growth and not an instrument which we shape for our own purposes. Now, it is clear that the decline of a language must ultimately have political and economic causes: it is not due simply to the bad influences of this or that individual writer. But an effect can become a cause, reinforcing the original cause and producing the same effect in an intensified form, and so on indefinitely. A man may take to drink because he feels himself to be a failure, and then fail all the more completely because he drinks. It is rather the same thing that is happening to the English language. It becomes ugly and inaccurate because our thoughts are foolish, but the slovenliness of our language makes it easier for us to have foolish thoughts. The point is that the process is reversible. Modern English, especially written English, is full of bad habits which spread by imitation and which can be avoided if one is willing to take the necessary trouble. If one gets rid of these habits one can think more clearly, and to think clearly is a necessary first step towards political regeneration: so that the fight against bad English is not frivolous and is not the exclusive concern of professional writers. I will come back to this presently, and I hope that by that time the meaning of what I have said here will have become clearer. Meanwhile, here are five specimens of the English language as it is now habitually written. These five passages have not been picked out because they are especially bad — I could have quoted far worse if I had chosen but because they illustrate various of the mental vices from which we now suffer. They are a little below the average, but are fairly representative samples. I number them so I can refer back to them when necessary:"
year_published = 2025
clearnet = "https://ourdecline.com/decline/orwell1.htm"
tags = ["1946modern", "acid", "april", "bad", "baker,", "british", "civilization", "communism", "criticism", "decadent"]
language = "en"
internal-references = ["none"]
external-references = ["google.com", "lulu.com"]

["https://ourdecline.com/signs/prlyss.htm"]
title = "Legal Absurdity Introduced Into School Sports (2012)"
description = "Front page of the Courier-Mail 23/4/2012, announcing the suing of a school girl for a mundane an unavoidable trivial accident on the tennis court (23/4/2012)"
full_description = '''A 13-YEAR-OLD schoolgirl is being sued by a classmate over a tennis court mishap at one of Queensland's top private schools in the latest blow to playground fun. The legal claim, over a bruised eye, has raised concerns that "litigation-crazy" parents could threaten the future of school sport by forcing up insurance costs. It may also force parents to take out third-party accident insurance for their children. Several Queensland schools have already banned activities including tiggy, red rover and cartwheels because of injury fears. The legal stoush has embroiled the daughters of a leading Gold Coast cardiologist and an architect, and the prestigious Somerset College. Cardiologist Guy Wright-Smith said he was "gobsmacked" to receive the damages claim, addressed to his 13-year-old daughter Julia, at his rooms on Friday. The claim alleges Julia had hit classmate Finley Enright-Burns in the eye with a tennis ball during a tennis lesson at the Mudgeeraba school last October. It alleges Julia was "smashing" balls back to Finley on the baseline when the incident happened. Finley did not go to hospital but is alleged to have suffered an eye injury which needed medical treatment. The claim, filed on behalf of Finley by her architect father Paul Burns, also names Somerset College and its Jay Deacon's Tennis School as defendants. The claim says the tennis school failed to provide adequate supervision or protective eye-wear and allowed Julia and Finley to stand too close together — and Julia to hit two balls at once. Somerset College also breached its duty of care, the claim alleges. Dr Wright-Smith said Julia and Finley were friends and the claim had come "out of the blue. I called my lawyer immediately," he said. Lawyer Bill Potts, who is not acting for the Wright-Smiths, said such lawsuits threatened the future of school sport by forcing up insurance costs.'''
year_published = 2025
