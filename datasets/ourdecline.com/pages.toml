["https://ourdecline.com/whatis/chap15.htm"]
title = "The Two Modes Of Australian Society"
description = "The two modes of the Australian society (circa 2001) explaining the change from manners and order to rudeness and chaos"
full_description = '''Professor Toynbee's claim Gordon Rattray Taylor was not the only author to realise society existed in one of two modes, Professor Arnold Toynbee made a similar claim in "A Study Of History" where he explains all civilisations grow then breakdown. And in Chapter 27 of his work he refers to a witness of the actual time when our civilisation changed modes: Describing them as 'growth' and 'breakdown', 'organic' and 'critical', or 'patrist' and 'matrist', does not convey their true nature, the human race has better, more exact words: 'good' and 'evil'. Terms selected not to invoke some supernatural agency, but to emphasis their essential character and impact upon humanity. The Good Mode The good mode is where citizens have been taught to be unselfish and to subordinate their animal natures to the demands of the society. This process is the traditional rearing of children to create dutiful citizens, which is essential for the survival of the society. The law reflects citizens' private beliefs Citizens are obedient to the law, and its officers because they believe it is for the best, whatever it costs them personally. And this code of behaviour is not just that upheld by the courts, but is dictated by tradition. These rules set out acceptable behaviour for all social intercourse, and impose stability and reason upon the society. Everyone knows what is expected, and what is unacceptable; what is good and what is bad. This allows the notion of justice — the penalising of those who breach codes of conduct — and the concept of duty — fulfilling the demands of law, written and unwritten. The family the building block of the society Western Civilisation has been given its character and vitality by the choice that male and female mate for life, and together raise their offspring. We chose to make the monogamous family the basis of our society, with the father the head of the household. From this small organisation everything else followed, with society being the co-ordination and co-operation of quantities of such groups. Tradition, through manners, customs and laws, establishes individual roles and obligations, making it clear just what the society expects from a person, depending on their sex and age and role.'''
year_published = 2025
clearnet = "https://ourdecline.com/whatis/chap15.htm"
tags = ["20th", "australia", "century", "kinds", "modes", "society", "turn"]
language = "en"
internal-references = ["none"]
external-references = ["bibleinterp.com", "cluborlov.blogspot.sg", "corbettreport.com", "dl.dropboxusercontent.com", "freemindfilms.com", "freethoughtblogs.com", "freeyurko.bizland.com", "google.com", "homeliving.blogspot.com", "lulu.com", "nytimes.com", "richardcarrier.blogspot.com", "richardcarrier.info", "telegraph.co.uk", "thechangeseekers.com", "users.tpg.com.au", "yourkeylink.com", "youtube.com"]

