["https://ourdecline.com/whatis/chap14.htm"]
title = "Two Modes of Society: Unselfish or Selfish"
description = "Why societies exist in two modes: either they pursue truth and prosper, or deny truth and falter (October 2011)"
full_description = '''Either Selfish Or Unselfish Clarification of the theory of Matrism/Patrism reveals that societies and individuals both have an understanding that can be classified as selfish or unselfish. This is further confirmed by considering the way understanding functions and how this gives rise to the two different types: selfish and unselfish. With the society's type being merely a reflection of that of the majority of its citizens. The Values Of The Minority Type Despised The adoption of selfish or unselfish values by the society is reinforced by the resentment the two types feel towards each other. For just as the honest despise the dishonest, the dishonest despise the honest; so the selfish will stigmatize the unselfish just as the unselfish will stigmatize the selfish. Differing Impact The differing impact of the selfish as opposed to the unselfish dominated society can best be understood by consideration of a police force. Hypothetical Example Of A Police Force To be an effective enforcer of the law, the individual officer must place duty ahead of self-interest; he must constantly ignore bribes while regularly placing life and limb in jeopardy. The reward for officers is modest pay with occasional public recognition of bravery, with the most capable winning promotion. This fills the senior echelons of the service with experienced and dedicated staff, who enhance the efficiency of the force. And this supplies justice by rightly inflicting penalty upon those citizens who clearly break the law. And though all the police will not be dedicated and brave, those who are not will be despised and persecuted. A Selfish Police Force Whereas when selfishness dominates, the opposite must apply. Most officers will place themselves ahead of the demands of duty and always be ready to accept the easiest solution. Risks will be avoided, while bribery and corruption will be rife, with those few officers who attempt to be dedicated being generally regarded as dangerous fools to be thwarted and ejected from the service. (Readers unable to visualise this effect should view the ABC television production:"The Scales Of Justice". This is a dramatised explanation why all cops must be crooked in a crooked force, or be outcasts.) Senior echelons must be staffed by those who care the least about the betrayal of justice and the most about their private gain, so the more senior the rank the greater the corruption. All resulting in a police force that can only pretend to do its duty as it protects the people it should prosecute, while being indifferent to safeguarding the innocent as it suppresses the truth. Inevitably the public will lose faith in their police and the laws that they are meant to uphold.'''
year_published = 2025
clearnet = "https://ourdecline.com/whatis/chap14.htm"
tags = ["kinds", "modes", "selfish", "society", "unselfish"]
