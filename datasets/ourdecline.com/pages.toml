["https://ourdecline.com/smartboard/shop/ransford/chap2.htm"]
title = "The Afrikaner Debate: Chapter 2 of 'The Great Trek'"
description = "The Afrikaner Debate: Chapter 2 of 'The Great Trek'."
full_description = "As things turned out, during the first eleven years of the French revolutionary wars, the Cape Boers were governed by four separate administrations. In 1795 as we have seen, the original Dutch East India Company gave way to a British Government; after the Peace of Amiens of 1802, the Colony reverted to Dutch rule, when the short-lived Batavian Republic came into being; finally, when the war broke out a year later, the British Government decided that it must again make sure of this key to India, and it dispatched a large fleet to the Cape in 1805. During the anxious months when the battles of Trafalgar and Austerlitz were being fought, sixty-three ships sailed southwards through the Atlantic; a combined service exercise in a style strangely predictive of the Second World War followed: after a skirmish in the dunes of Blaauwberg Strand the burghers submitted to superior arms and the second British occupation of the Cape began, From now on the Boers were ruled by a succession of governors and officials whose standards of values were utterly different from their own. They were disciplined by autocratic foreigners who made no attempt to hide their feelings that the Dutch colonists were a tiresome responsibility conferred on them by the necessity of maintaining a naval station on the way to India. And what made things worse was the way these arrogant British were far more inclined to listen to criticism and denunciations of the Boers than to sit down and hear the colonists' even perfectly legitimate complaints. That was not all: in the wake of unsympathetic officials came a host of Christian missionaries who were determined to preach the fashionable doctrine of brotherly love and racial equality to anyone who would listen to them. With their advent the whole impact of contemporary English liberalism and Negrophilism, buttressed as it was by central authority, fell suddenly on the Boers. The missionaries' teachings were, of course, repugnant to a white race not only convinced of its superiority to the Hottentots and Bantu, but which genuinely believed that its very existence depended on subjugating these inferior beings who had harmed them so often. And, indeed, one cannot help but feel a good deal of sympathy for the Boers on this matter, especially as the missionaries were earnest irritable men who had no experience in dealing with a multi-racial society, and who seemed to reserve all their charity for its coloured members. Many of the missionaries came from the artisan class and had received the call during the British evangelical revival: for instance, John Philip, who was particularly loathed by the Afrikaners, had been a mill hand before entering the Church, while Robert Moffat of Kuruman had begun life as a gardener. This sort of background inevitably led them to display a narrowness of vision which might have been avoided by a wider education, and, however praiseworthy their purpose, however splendid their new awareness of the equality of men, it is sad that the missionaries did not express their opinions about the Boer attitudes to the coloured people more tactfully, and avoided other of their more patronising criticisms. But, however badly they had been received by the Dutch Colonists, the missionaries certainly had the ear of the Cape Government, and it was mainly due to their agitation that the British authorities in 1828 passed an ordinance which released all Hottentots from any legislation that enforced discrimination on account of colour. Pass laws and child apprenticeship were all abolished and there is no doubt that the Boers were correct in claiming that Hottentot vagrancy, with its concomitant evil of stock-theft, thereafter increased immeasurably. What rankled even more was the enrolment of Hottentots as soldiers to enforce the Colony's laws, and the way Hottentot servants were allowed—even encouraged—to make official complaints about the treatment meted out to them by their masters. In matters of this sort the Hottentots were all too often abetted by the missionaries; one of whom took credit for causing the arrest of no less than twenty white farmers for the maltreatment of their servants. We must remember, too, that to answer such a charge in court meant that a man had to leave his wife and children unprotected on an isolated farm for days and weeks at a time, and we can sympathise with the shocked surprise of one of them who, on receiving a summons to a distant magistracy, groaned 'My God! Is this the way to treat a Christian?'"
author = "Oliver Ransford"
year_published = 2025
clearnet = "https://ourdecline.com/smartboard/shop/ransford/chap2.htm"
