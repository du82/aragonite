full_description = "Understanding: is the bestowing of meaning upon the form the senses detect to discover purpose, which is won using knowledge: the acquired experience of cause and effect. Meaning, is created by applying beliefs about Right and Wrong, what to do and what not to do, which is discovering Purpose. Knowledge is the remembered observations of Cause and Effect (Science) revealed by the experience of the understanding. They are collected and refined throughout the life of the understanding and stored in memory. This accumulation of knowledge allows the recognition of patterns in the knowledge, which allow the development of Abstract Tools that enhance the power of the understanding, such as: Recognition of truth from falsity, Logic and Mathematics."
