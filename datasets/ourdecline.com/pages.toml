full_description = "Inevitably a nation of timid citizens demands a government that shrinks from unpleasant truths and resolute action; one that abhors violence. The result is: The Loss Of The Military Spirit Edward Gibbon noted in his History Of The Decline And Fall Of The Roman Empire, that the decline of Rome was inevitable following their loss of military spirit, meaning the Romans became cowardly. Our cowardly society is now repeating the example of the Ancient Romans."
