["https://ourdecline.com/burke/gains.htm"]
title = "Achievements Of the French Revolution"
description = "Edmund Burke's revelation of what the French Revolution achieved for France, from Part 1 of 'Reflections Of The Revolution In France' (1790)"
full_description = "Gains Of France Compute your gains: see what is got by those extravagant and presumptuous speculations which have taught your leaders to despise all their predecessors and all their contemporaries, and even to despise themselves, until the moment in which they became truly despicable. By following those false lights, France has bought undisguised calamities at a higher price than any nation has purchased the most unequivocal blessings! France has bought poverty by crime! France has not sacrificed her virtue to her interest, but she has abandoned her interest, that she might prostitute her virtue. All other nations have begun the fabric of a new government, or the reformation of an old, by establishing originally, or by enforcing with greater exactness, some rites or other of religion. All other people have laid the foundations of civil freedom in severer manners, and a system of a more austere and masculine morality. France, when she let loose the reins of regal authority, doubled the licence of a ferocious dissoluteness in manners, and of an insolent irreligion in opinions and practices; and has extended through all ranks of life, as if she were communicating some privilege, or laying open some secluded benefit, all the unhappy corruptions that usually were the disease of wealth and power. This is one of the new principles of equality in France. Example Of France France, by the perfidy of her leaders, has utterly disgraced the tone of lenient council in the cabinets of princes, and disarmed it of its most potent topics. She has sanctified the dark, suspicious maxims of tyrannous distrust, and taught kings to tremble at (what will hereafter be called) the delusive plausibilities of moral politicians. Sovereigns will consider those, who advise them to place an unlimited confidence in their people, as subverters of their thrones; as traitors who aim at their destruction, by leading their easy good-nature, under specious pretences, to admit combinations of bold and faithless men into a participation of their power. This alone (if there were nothing else) is an irreparable calamity to you and to mankind. Remember that your parliament of Paris told your king, that, in calling the states together, he had nothing to fear but the prodigal excess of their zeal in providing for the support of the throne. It is right that these men should hide their heads. It is right that they should bear their part in the ruin which their counsel has brought on their sovereign and their country. Such sanguine declarations tend to lull authority asleep; to encourage it rashly to engage in perilous adventures of untried policy; to neglect those provisions, preparations, and precautions, which distinguish benevolence from imbecility; and without which no man can answer for the salutary effect of any abstract plan of government or of freedom. For want of these, they have seen the medicine of the state corrupted into its poison. They have seen the French rebel against a mild and lawful monarch, with more fury, outrage, and insult, than ever any people has been known to rise against the most illegal usurper, or the most sanguinary tyrant. Their resistance was made to concession; their revolt was from protection; their blow was aimed at a hand holding out graces, favours, and immunities."
author = "Edmund Burke"
year_published = 2025
clearnet = "https://ourdecline.com/burke/gains.htm"
