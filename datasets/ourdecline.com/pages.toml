["https://ourdecline.com/toynbee.htm"]
title = "Arnold Toynbee author of 'A Study of History'"
description = "Biography of Arnold Toynbee C.H., author of 'A Study of History', taken from the cover of the 1972 London edition"
full_description = '''Arnold Toynbee, C.H., was born in London, 1889. He has been professor of Modern Greek and Byzantine history (1919–1924), Director of Studies at the Royal Institute of International Affairs (1925–1955), and Research Professor of International History in the University of London. His first book was published in 1915 and he has been a prolific author ever since. The first volume of his magnum opus, A Study of History, was published in 1934, and it was completed with the publication of the twelfth volume in 1961. In a review in the Manchester Guardian, Noel Annan described Dr Toynbee as "a genuinely civilized, dispassionate cosmopolitan" and went on to attribute the outcry against 'A Study of History' from some of its critics to their rage at "his refusal to be a propagandist."'''
