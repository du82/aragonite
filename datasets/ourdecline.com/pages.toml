["https://ourdecline.com/feedback/fdbk2005.htm"]
title = "Response to 'A Study Of Our Decline' (2005)"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2005"
full_description = "Dear Philip, What you say about the nature of community is true. I am stunned at its truth and in awe of the power of your thinking. Well done, in my humble opinion. I am no intellectual, but I see a truth when I see it. I am writing a masters thesis about the benefits of the community to the individual, based in positive psychology, which has proposed that a way to personal fulfillment is by joining an organization that helps others. I have lived in an intentional community for 18 years in the 1970s and 1980s. I found that the personality of the community had much in common with the elements you have described. Like an individual, a community can be full of problems. Of course, their are communities that do not espouse violence, but service to others instead. Nonetheless, I believe that it would be useful for everyone to be aware that the elements you express exist everywhere in some way. In this way we may be wiser about our involvements and what to expect. The definitions you gave for communal understanding which is expressed and refined by conversation were extremely helpful to me and have provided a clear picture of what a community is. Another important truth is that of the closed-mindedness of a community to personal expressions of the truth. How these may be ignored at best or persecuted at worst. These ideas are very helpful to me in my research for a foundation by which to understand what makes a community. If I may use you as a reference for this definition it would be appreciated. Thank you for your work, Your writing is a wake-up call. I am one of those fools, fearful of my own incompetence and the dangers that I will bring to innocent people - whether in software development or in raising up my future children. I do not wish to contribute to a declining civilization, and although there is only futility in lighting a candle in the maw of darkness I find that your writings are a comfort. This is one of those rare sites where the text is far more important than the visual effects. Here I can surround myself with thoughts and contemplate. Here I may find some kindred ideas on what is good, and on the sort of life worth living."
