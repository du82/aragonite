["https://ourdecline.com/signs/chap8.htm"]
title = "The law: from protector to persecutor"
description = "How the continual corruption and reversal of the function of law has made the courts agents of insanity"
full_description = "Every weekend during the summer I used to drive my four children to the beach. Naturally we journeyed with all the windows open to offset the Queensland summer heat. The stream of fresh air created by the motion of the car, cooled and refreshed the passengers. Otherwise, without air-conditioning, the car would have quickly become an oven. As my children matured this arrangement became less satisfying. My eldest daughter became a petulant and perverse teenager, who began to make family life a misery. She started to demand we keep the car windows shut to stop the wind disturbing her hair. And when this absurd request was ignored she sulked. Upon arrival at the beach Ruth would refuse to leave the vehicle and instead insisted upon moping in the back seat all day. This upset the other children who began to question the need for adequate ventilation in the car. Of course the sensible parents ignored their daughter's tantrums, and safe-guarded the family interests. Succumbing to the odious dictates of the girl would have been like submitting to any other blackmail. The initial demand would have merely been the first of a series. Ruth would have become a tyrant, indulging her whims at the family expense. It would have been an injustice to reward this anti-social behaviour with anything but contempt. Legal Support Of Tyranny It is clear that the legal community has taken the opposite attitude, if an individual takes exception to general behaviour then public behaviour must be amended. If someone objects to other staff smoking, then smoking has to be forbidden for all staff. Naturally, having set this precedent, they have unleashed a barrage of similar insane claims. We can no longer smoke at work, or when we travel, or in a growing list of venues. And this is just the beginning, for we are going to be subject to the caprice of every malcontent. Rewarding Cranks Every social misfit must now feel encouraged to tyrannise society. By successfully suing authority they can indulge their foibles and win a large financial reward. The only requirement is to discover a medical condition that can be blamed upon someone else, then enlist the help of the legal profession. The disease of Asthma (or the material Asbestos) seems ideal as its applications are almost inexhaustible. Smoke, perfume, fumes, dust, pollen can provide an enterprising barrister with a job for life. Our justice corporation no longer protects society from cranks, but the reverse."
year_published = 2025
clearnet = "https://ourdecline.com/signs/chap8.htm"
tags = ["'signs", "atkinson", "persecutor", "protector", "reversed", "senility'"]
language = "en"
