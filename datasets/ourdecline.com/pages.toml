["https://ourdecline.com/feedback/feedback.htm"]
title = "2003 Response to 'A Study Of Our Decline'"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' 2003"
full_description = '''Thanks for developing such a great and thoughtful site. The theory of decline is thought provoking. It incorporates so much of what is happening in the U.S. and Europe, and seems well grounded in history. I especially appreciate the revision of Taylor's theory, since the critics find it easy to brush off the latter as outdated sexism. The key really is the duty and common values versus selfishness. The overall theory is a great and unique contribution to our collective understanding. The online library is also great. It is wonderful to have the classics so accessible. Please create a few extra hours in the day so we can fit it all into. Thanks very much. I am impressed by the content of your website. I also enjoy your writing. You have a systematic quality that reminds me of German authors, although not quite so obsessive-compulsive. hello, Philip, I feel I am addressing a fellow spirit. For the second time, I've encountered your pages on bigpond.com, and enjoyed agreeing with so many of your observations. Like yourself, I've encountered bullying, & the usual sort of petty social ostracism and contumely experienced, possibly not so particularly in this country, by the egregious person. After 70 years of this, I am completely philosophical about it. However, being the father of a second batch of hatchlings, find myself in a life and death struggle now to prevent the unconscionable depredations of various bureaucrats, "educationists" etc. whilst work towards home-schooling, and complaints, if I am forced that far , to the Administrative Appeals Tribunal. It is perhaps not any coincidence I find your pages again right at this moment, as the legal system reveals itself again to be a walking-dead institution of double-think, hypocrisy and perversion. I assume, and hope, your status is to be as "free" as it is is possible to be in these times. You may be interested to gloss the pages of www.rhfinc.org of which I am an associate and researcher. I may ask our webmaster to put a link to your pages on our site, if this is alright with you?..Y.s.'''
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/feedback/feedback.htm"
