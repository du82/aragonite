["https://ourdecline.com/signs/tunstall.htm"]
title = "How Arthur Tunstall enraged the Tyrants"
description = "Media item listing why Arthur Tunstall was attacked by the tyrants of Political Correctness (2/2/2006)"
full_description = '''Arthur Tunstall has never been one to hold back an opinion. Lock up the bleeding hearts, warn the feminists, Kiwis, disabled athletes — and Cathy Freeman... Arthur Tunstall, 84 this week, has been invited as an official guest to next month's Commonwealth Games — his 11th — and he's extremely pleased no one will have any trouble understanding him. Returning to a well-worn refrain, Tunstall, the secretary of Boxing NSW, is glad no Tower of Babel is needed in Melbourne. Perry Crosswhite, chief executive of the Australian Commonwealth Games Association, allowed himself an "Oh dear", before confirming that Tunstall, who was not invited to Manchester four years ago, would be back. Auckland in 1990 probably wasn't the most diplomatic place to suggest New Zealand be considered the seventh and eighth states of Australia. Four years later came his public rebuke of Cathy Freeman for carrying both Aboriginal and Australian flags on her victory lap in Canada, and his description of disabled athletes as an embarrassment. Nor was a speech to the Olympic Writers and Photographers' Association in 1998 the best place to crack jokes about Aborigines and Jews. This week, Tunstall sent his 39th letter to NSW Sports Minister Sandra Nori appealing against the ban that bars boys from boxing until they turn 14. He expects the same reply: when the Government changes policy, they'll let him know. But women? That's a different matter.'''
