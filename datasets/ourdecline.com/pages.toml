["https://ourdecline.com/duty/index.htm"]
title = "The Discarding Of Duty (20-Nov-18)"
description = "How social decline reverses the demands of duty by persecuting and assaulting dutiful citizens. From 'A Study Of Our Decline' by P Atkinson (20-Nov-18)"
full_description = "Duty demands upholding tradition so discovering identity and purpose. The dutiful aspire to become a father who provides for his family, while keeping them in order. Or an obedient, faithful wife who cherishes and honours her husband as she nurtures her offspring. Or a child who respects and obeys elders. However, as tradition is discarded under the impact of selfishness, so is identity and purpose thus replacing communal order with increasing chaos. And, just as hatred of truth is dissembled so is hatred of duty; which is demonstrated in no uncertain manner by contemporary and historical examples. The inevitable result is the appearance of citizens with no sense of duty, which means that those citizens who feel obliged to do their duty are taking grave risks. As demonstrated by: Duty Now Illegal It is the duty of every citizen to uphold their community, which is its traditions and its racial character — its sanity and its identity — against all other communities. Otherwise the community will no longer exist but be replaced by a mass of insane humanity with no distinct racial character: a universal state; a result which is now compelled by law with the adoption of multiculturalism; thereby making it illegal to be dutiful."
