["https://ourdecline.com/cooray/constit/index.htm"]
title = "The Constitution & The Law In A Free Society"
description = "The Role Of The Constitution And The Law In A Free Society"
full_description = "The essential characteristic of the liberal theory of the state is the idea that the authority and power of the state are limited. Milton Friedman has this to say about the role of government in Capitalism and Freedom (Chicago, 1962): James Madison, the most influential of the draftsmen of the American Constitution, identified (in 'The Federalist', no 51) the main problem confronting the draftsmen of a constitution thus: The role of a constitution is to provide scope for good government, while at the same time placing limitations on the powers of the governors. The doctrine of the separation of powers, involving a system of checks and balances, is basic to liberal constitutionalism. The system of checks and balances begins with the separation through a constitution of judicial, executive and legislative powers. However, it goes much further. It operates also within each branch of the state, in the division of powers between state and federal governments and the distribution of powers between the state, other institutions and individuals in the community. Within the legislative sphere, power is distributed between the component parts of parliament (Senate, House of Representatives and the Governor-General). The power of each House is diffused among its many members. A majority is necessary for the House to act. Each House has a different constituency and/or is elected at periodic intervals and is therefore constrained by the necessity of being responsive to the electorate. Within the executive sphere ministers, besides having a duty to govern in the interests of the whole nation, are obliged to work with a public service. The impartiality of the public service (undermined in recent years) acts as a brake upon favouritism, corruption, discontinuity, nepotism and inefficiency. On the other hand, executive decision making and policy determination remain in the hands of the ministry. Under the Westminster system the ministry is further constrained by the reserve powers of the Crown and by ministerial responsibility to Parliament."
year_published = 2025
