["https://ourdecline.com/impact/national.htm"]
title = "The collapse of nationality: the universal state"
description = "The European Union is the 'Universal State' predicted by Toynbee in 'A Study Of History' and marks the collapse of nationality.(25/8/2015)"
full_description = '''The replacement of the separate countries of Europe with a single state — The European Union — was predicted by Professor Arnold Toynbee in "A Study Of History" (1952) as part of the decline of a civilisation. Toynbee observed that as a civilisation collapsed, the separate countries making up the civilisation merged into one unit — a universal state: Toynbee thereby predicted the transition of Europe from a number of quarrelling nations, into a single community known as 'The European Union', but Toynbee also made it clear that such unity was a symptom of disintegration not growth: Why Universal States Appear While Toynbee was accurate in his observations he had no clear idea of the mechanism involved. He did not know that a community is a unique shared understanding held by a particular racial group, which can only exist as long as the majority of its citizens are unselfish. For the moment the majority become selfish, traditions are discarded along with concern for their racial character. That is, the community loses both its sanity and its racial identity: its nationality. The citizens of Western Civilisation no longer pride themselves on being white Christians, and their once separate nations have become merely a mass of insane humanity with no religion or distinct racial character: a universal state. The Nature Of The Citizens Of A Universal State The Englishman with the stiff-upper lip who eats stodgy food and plays cricket; the humourless German who eats cabbage and sausages; the excitable, verbose, Frenchman who drinks wine; they have all been replaced by citizens with no sensible tradition. The political borders which previously separated peoples with separate, distinct notions of duty and justice — a nationality — have become meaningless lines on a map indicating where these nations once were; for now all these once different peoples have become united by selfishness, which is concerned not about religion or race but self-interest — a rabble; whose only borders are those set by geography.'''
year_published = 2025
clearnet = "https://ourdecline.com/impact/national.htm"
tags = ["'impact", "atkinson", "collapse", "decline'", "nationality", "state", "universal"]
language = "en"
internal-references = ["none"]
external-references = ["google.com", "lulu.com"]

["https://ourdecline.com/cooray/btof/chap30.htm"]
title = "The nature of Coercive Utopians(Social Activists)"
description = "Coercive Utopians are a danger to society because they know what is best for everyone so ruthlessly try to impose their absurd notions on society"
full_description = 'The most dangerous enemies of civilisation are not necessarily evil people. They are idealists (subject to qualifications stated below) who wish to use the police power of big government to impose their views and perspectives on others. They often do not enjoy majority support among the public. They reject the evolved experience of the ages. This is what distinguishes the coercive utopian from those who advocate restrictions on freedom in the liberal tradition. The phrase "coercive utopian" is a more apt description than "reformist". It does not however apply to all reformists. It applies to those who seek to use the power of the law beyond acceptable limits (see sections 5.4, 16, 18 and 26). It does not apply to those who seek to remove necessary restrictions on freedom. Reformists (so-called) often do not enjoy community support for their legislatively imposed and bureaucratically or judicially enforced changes. They therefore hide their real aims and introduce coercive measures gradually and incrementally so that people do not know what is happening and the opposition is divided and diluted. Modern coercive utopians have developed to a fine art the ability to hide the reality of what they are doing under the cloak of moderation. Their efforts in this respect have been assisted by the general failure of liberal and conservative politicians (a few exceptions apart) and people who believe in liberal values, to mount an effective counter attack. Thus, the coercive utopians are idealists (subject to qualifications stated below), who wish to impose their views and perspectives on others. They want to use the authority of government to achieve their ends. An important distinguishing mark of the coercive utopian is his preference for regulation as against education. The preference of the true liberal is for education (not indoctrination) and public debate which can bring about change. The changes of the past have come from philosophers and idealists who changed the values of people and the actions of people not so much through regulation (though regulation has a place, see sections 5.4, 16, and 26)but through educating people to voluntarily change and move forward. The reformists of the nineteenth century and before sought to achieve reform by repealing existing legislation (such as the feudal laws which enabled employers to exploit employees) or extending narrowly conceived legislation (such as the right to vote). The reformists of the pre-twentieth century era did not wish or need to establish bureaucracies to effect reform. They did not call themselves "reformists". Later generations evaluated their work and labelled them "reformists". In the modern State, self styled reformists are establishing bureaucracies and restricting freedom. If freedom of expression and the spirit of free inquiry (severely curtailed in the media and education systems) survive, future generations will not be able to point to much productive reform emanating from bureaucracies. They will focus on the great deal of counter-productive activity.'
author = "LJM Cooray"
year_published = 2025
clearnet = "https://ourdecline.com/cooray/btof/chap30.htm"
tags = ["achievement", "australian", "coercive", "cooray", "utopians"]
language = "en"
internal-references = ["none"]
