["https://ourdecline.com/decline/jobs/football.htm"]
title = "Litigation A New Football Risk (1/9/1999)"
description = "A newspaper article revealing a new sporting danger, the risk of legal action following sports action, as a footballer is charged with assault following a tackle in September 1999"
full_description = "A RUGBY league player was left with a fractured neck after being tackled by an opponent, it was alleged in the Brisbane District Court yesterday. A jury was hearing a case against Shaun Lawrence Taylor who is charged with causing grievous bodily harm to Warren Petty, 26, during a lower division rugby league game. The trial heard Petty allegedly suffered a serious neck injury during a match last year between his team Banyo and Taylor's team Balmoral. It was alleged Taylor caused the Injury when he tackled Petty during the game at the Banyo rugby league grounds in northern Brisbane. Orthopaedic surgeon Paul Pincus, who examined Petty on March 25, told the court he believed Petty fractured his neck as a result of the tackle. He was led, to the conclusion by symptoms Petty described he had after the match and after examining a CT scan of the injury. Dr. Pincus said that without treatment Petty would have suffered permanent injury to his health. Cross-examined by barrister Dan Boyle, for Taylor, Dr Pincus said fractures of the neck usually did not occur in legal tackles but he conceded there could be circumstances where they could occur. Touch judge Sean Sutcliffe told the court he was the only official touch judge on duty for the match. He said he saw a Banyo player on the ground attempting to rise as if to play the ball when a Balmoral player came in. Sutcliffe said the Balmoral player appeared to hit the Banyo player with a forearm and he ran straight on to the field to talk with the referee. The Balmoral player was sent from the field for 10 minutes while the Banyo player received treatment. Cross-examined by Mr Boyle, Sutcliffe said he was not certain where the initial point of contact had been. However, he was sure it was somewhere from the back of the shoulder blades up to the back of the top of the head. Sutcliffe told Mr Boyle he made no recommendation to the referee about a sin-bin or send-off because it was not his job to make such decisions. Dr Richard Slaughter, who examined a CT scan of Petty's Injury, told the court he found a fracture of the vertebrae at the junction of the neck and chest. He said it was not surprising that such a fracture could have been missed by an earlier conventional X-ray."
