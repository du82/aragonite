["https://ourdecline.com/smartboard/shop/ransford/chap1.htm"]
title = "Trekboers: Chapter 1 of 'The Great Trek'"
description = "Trekboers: Chapter 1 of 'The Great Trek'."
full_description = "By the end of the eighteenth century a new breed of men had evolved in South Africa — the Trekboers. No people quite like them had ever existed before. Descended from white colonists who had settled at the Cape of Good Hope after 1652 when the Dutch East India Company established a staging post there, they had quickly espoused themselves to their strange new environment and became an integral part of Africa. The earliest colonists were of Dutch stock, but many settlers of German origin had joined them later, and after the revocation of the Edict of Nantes in 1685 De Kaap had accepted a considerable infusion of French Huguenot refugees. By 1800 the white colonists numbered rather less than 40,000, and were so connected by marriage that they more resembled a gigantic family living on its ancient estate than a polyglot community scraping a livelihood from one of the world's most out-of-the-way places. The first colonists dug in at the Cape, hemmed in on one side by the sea and on the other by tiered rows of mountains which divided them from an unknown continental interior; rather uneasily they realised that it must stretch all the way to Egypt and the Mediterranean. In their bridgehead at the butt end of Africa they felt themselves to be hostages not only to the tribesmen and savage animals which they knew must inhabit this interior, but also to the whims of their masters, the Council of Seventeen, who, from Amsterdam, governed the far-reaching empire of the Dutch East India Company. The Seventeen ruled their subjects despotically. The rank and file of the white settlers at De Kaap were employed only as soldiers and producers of fresh fruit and vegetables from the Company's gardens to supply the crews of its merchantmen. They were excluded from all responsible and professional positions which the Seventeen invariably filled with Hollanders. At the completion of their contracts very few men could afford to pay their passage back to Europe, and after taking their discharge there was at first little hope of these 'free burghers' finding employment except as tradesmen and tavern keepers. But in 1657, since difficulty was being experienced in obtaining supplies of grain from the local Hottentots, the Council at the Cape allowed a handful of settlers to set up as farmers (Boers in the Dutch tongue) along the Liesbeeck stream which ran into Table Bay beside the infant village of De Kaap."
author = "Oliver Ransford"
year_published = 2025
