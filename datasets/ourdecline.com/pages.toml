["https://ourdecline.com/signs/chap10.htm"]
title = "The Crumbling Of Order In Australia"
description = "The continuous crumbling of order occurring in the Australian community at the end of the twentieth, and start of the twenty-first, century"
full_description = "Communities need order, order needs discipline, and discipline needs self-restraint reinforced by punishment of failure, with those charged with punishing transgressors protected from retaliation by their victims. —A self-evident truth. Understanding Order; Queues a simple example Queuing is a necessary part of civilized life, and everyone is required to perform this function, from waiting to be served at a counter to waiting at a red light in traffic. If citizens did not demonstrate the self-restraint needed for queuing, the whole community would be plunged into chaos and collapse. Nevertheless, this essential practice depends upon two factors If some citizens started to ignore their obligation to wait their turn, and went straight to the front of the queue, and were always served, then the queue would inevitably dissolve into a quarrelling mob, the service being sought would falter, and everybody would lose. To prevent this disorder occurring, the people who show contempt for others by ignoring the rules must be publicly punished, which is the function of authority, to uphold the rules and allow peace to reign. But this imposition of order requires that the agents of authority be powerful and respected; able to enforce the rules while invulnerable to their victims' wrath. This simple example reveals the importance of order for everyone, and its necessary ingredients of self-restraint and respect. If either of these qualities fail, then so does order, and inevitably, the community. General Lack Of Respect Disrespectful Neighbours Deep sleep was disturbed by rhythmic pounding; loud music was pulsating from the flat below; a quick glance revealed it was three in the morning. My enraged wife leapt out of bed to hammer a complaint upon our floor, their ceiling. Immediately the volume increased. Incensed by such flagrant contempt, pausing only to grab a dressing gown, the enraged matron stormed off to the offending neighbour. Above the music Margaret could be heard banging on the miscreants' door, yelling threats and curses. Suddenly the disco ceased, lights were extinguished and silence reigned. Screamed challenges to face their victims were unanswered. The erring occupants played possum, too frightened to answer their door."
