["https://ourdecline.com/aginatur/prog2.htm"]
title = "The Myth Of Over-Population (1997)"
description = "The tyranny employed by environmentalists as part of their promotion of the myth of over-population, part2 of 'Against Nature' television series (1997)"
full_description = "As the world's population nears six billion, most of us believe that there are already too many people on the planet. The second programme in this series presents arguments that there aren't enough. Introduction Although many Greens believe the entire world to be overpopulated, the problem is always considered worse in the Third World, where, they say, humans are encroaching on the habitats of trees and animals. The programme also shows that environmentalists have legitimised pressure on Third World countries to reduce population as a condition for aid. Western measures to control population in Africa are highly controversial. US AID has this year given Kenya $13.5 million for family planning, compared to $4 million in humanitarian assistance. One environmental organisation is even suggesting withholding food aid to Africa in order to keep numbers down— letting people starve, in other words. However, it can be argued that Africa is underdeveloped precisely because it is underpopulated. How can you justify building schools, hospitals or roads if there are not enough people to support them? And if there are more people, there will be more ideas, which in turn will lead to better technology and an improved quality of life. In the West, every indicator of quality of life has improved as the population has grown. The superfluous four million — and the rest Over the last 35 years, the population of the Earth has doubled. Next year it will expand by 86 million people— that's three babies a second, or another Birmingham every four days, or another UK every seven months. Today there are almost six billion people in the world, and environmentalists argue that this is already unsustainable. Professor Norman Myers, of Green College, Oxford, puts the optimum world population at two billion or less. Further population growth over the next few decades, it's argued, will be disastrous. Brent Blackwelder, Chairman of Friends of the Earth, agrees, arguing that many of the world's conflicts are caused by scarcity of natural resources."
author = "Paula Snyder and Peter Millson"
year_published = 2025
clearnet = "https://ourdecline.com/aginatur/prog2.htm"
