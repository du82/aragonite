["https://ourdecline.com/pc.htm"]
title = "Origin and Nature of political correctness"
description = "The origin and nature of the eruption of tyranny known as Political Correctness (PC) (27/9/2020)"
full_description = "When did Political Correctness Start? Political Correctness (PC) is the communal tyranny that erupted in the 1980s. It was a spontaneous declaration that particular ideas, expressions and behaviour, which were then legal, should be forbidden by law, and people who transgressed should be punished. (see Newspeak) It started with a few voices but grew in popularity until it became unwritten and written law within the community. With those who were publicly declared as being not politically correct becoming the object of persecution by the mob, if not prosecution by the state. The Odious Nature of Political Correctness Political Correctness is a tyranny that demands tradition be abandoned, as 'sexist, racist, bigoted' etc. , which is whatever the younger generation resents. Following the adoption of Political Correctness, people no longer know how to be a father, mother, wife, husband, son, daughter or citizen, as these duties were revealed by tradition. Now people just know what behaviour they must not display if they wish to avoid persecution. Hence, by discarding tradition the society is discarding duty and social order, so embracing chaos. Clear Inspiration for Political Correctness The declared rationale of this tyranny is to prevent people being offended; to compel everyone to avoid using words or behaviour that may upset homosexuals, women, non-whites, the crippled, the stupid, the fat or the ugly. This reveals not only its absurdity but its inspiration. The set of values that are detested are those held by the previous generation (those who fought the Second World War), which is why the terms niggers, coons, dagos, wogs, poofs, spastics and sheilas, have become heresy, for, in an act of infantile rebellion, their subject have become revered by the new generation. Political Correctness is merely the resentment of spoilt children directed against their parent's values. The Origins of Political Correctness A community declines when the majority of its citizens become selfish, and under this influence it slowly dismantles all the restraints upon self-indulgence established by manners, customs, beliefs and law: tradition. (See the law of reverse civilisation) as each subsequent generation of selfish citizens inherits control of the community, it takes its opportunity to abandon more of the irksome restraints that communal wisdom had installed. The proponents of this social demolition achieve their irrational purpose by publicly embracing absurdity through slogans while vilifying any who do not support their stance. The purpose of the slogan is to enshrine irrational fears, or fancies, as truth through the use of presumptuous words, so public pronouncement:"
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/pc.htm"
tags = ["atkinson", "correctness", "political"]
language = "en"
