["https://ourdecline.com/cure.htm"]
title = "Can a Declining Civilisation Be Saved?"
description = "Why a declining Civilisation cannot be saved, and how it is both foolish and dangerous to try to save it(3/2/2016)"
full_description = "Mental Decay Has Already Occurred If you were to observe your aging mother attempt to boil water by placing an electric kettle on a gas cooker, you would immediately know that she was losing her mind. And that it would be futile to try to remedy her mistake by instruction or demonstration. The act would be unmistakable evidence of mental decay for which there is no possible treatment (the loss of memory means loss of brain tissue), and her condition would only get worse. And what is true for the individual is also true for the community. The behaviour that reveals social decline is undeniable evidence that the communal mind has already decayed. Decline is Communal SenilitySocial decline is the impact of a growing deterioration in the understanding of the community; the community is losing its mind along with its strength and becoming senile: Impossibility of repair A senile community is like a senile person: though the mind is rotten, the body may appear intact, still have strength and vitality, and so lend itself to the notion of being curable. But the simple truth is that the understanding that occupied the body is now dead. Nothing can bring it back. It is possible in theory for a diseased brain to be repaired by replacement of some or all of that organ, but this would not return the lost memory or lost personality and would create a new understanding — a treatment that could only be done by another intact understanding. Though such an option may be open to a senile person among friends and relatives, it is unavailable to a senile community. Sanity and strength permanently lost The impact of senility, increasing mental confusion and decreasing strength, which must become fatal to the community, are impossible to repair: Nothing Left to Save When the symptoms of social decline appear the people who gave the civilisation energy, intelligence and made it an asset to humanity, no longer exist in any numbers. Their place has been taken by a race of foolish cowards, who can only dissipate the accumulated wealth and wisdom they have inherited. Though the true character of these new citizens will initially be disguised by the restraints imposed by their inheritance of customs, manners and beliefs, these will be rapidly discarded by the impatience of subsequent generations."
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/cure.htm"
