external-references = ["none"]

["https://ourdecline.com/educate/unis.htm"]
title = "Universities swap truth for Dogma and Thuggery"
description = "Media item revealing that Universities are centres of dogma and thuggery (10/5/2017)"
full_description = '''Three months ago, riots broke out at the University of California at Berkeley over a planned talk by the provocative journalist Milo Yiannopoulos. Last month the outspoken polemicist Ann Coulter cancelled her planned talk on that campus after the university said it couldn't guarantee her safety. I was invited to Berkeley last week to talk about the Arab-Israel conflict at its Hillel centre for Jewish students. In the light of the uproar over controversial speakers, however, Hillel decided it was too dangerous for me to speak there. So I was disinvited. I ended up speaking with no advertising or publicity in a "safe house" to which students were invited individually. In effect, they had to be coaxed to venture out. This is because reaction against pro-Israel speakers on campus is now so violent that many Jewish students at Berkeley are too frightened to attend any such presentations. I'm in America on a speaking tour, talking to a variety of groups about the assorted political convulsions taking place throughout both the West and the Middle East. In the US, one campus after another is now being dragged into a spiral of violence, intimidation and censorship. When Heather MacDonald, a distinguished academic and critic of Black Lives Matter, tried to speak at Claremont McKenna College in California last month students ringed the building, chanting abuse and banging on the windows. She eventually fled through the kitchen into a police van outside. At Middlebury College in Vermont in March a professor was admitted to hospital after being attacked when she tried to shield the social scientist Charles Murray, the author of a study on racial differences in intelligence, who was being driven out of a lecture hall by a violent mob. According to a survey by "Spiked" magazine, more than nine out of 10 British universities restrict free speech in some way, clamping down on ideas, literature or guest speakers that fall foul of one shibboleth or another. The Wall Street Journal reported that in a survey of 800 US college students, 51% supported speech codes. Dozens of people invited to speak on campus have had their invitations withdrawn or their presentations disrupted, while university staff have been harassed with accusations of racism, micro-aggression or cultural insensitivity.'''
