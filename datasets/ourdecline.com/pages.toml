["https://ourdecline.com/french.htm"]
title = "Our Civilisation's fall began with the French Revolution"
description = "Why the French revolution was the start of the decline of Western Civilisation"
full_description = 'Arnold Toynbee, in his "A Study of History" saw the French Revolution as the point when our civilisation stopped growing and started breaking down. By comparing numerous civilisations, Toynbee was able to identify the eruption of a class war as the common preliminary of social disintegration, and he explained that the explosion of civil violence was a result of the tyranny of the ruling class: While the rhetoric of the French revolutionaries may support Toynbeeʼs view about their king, an English contemporary denied this was the truth. Edmund Burke in Reflections on the Revolution in France made the opposite claim, stating: And he made it clear in "Thoughts of French Affairs" that this subversion of legal and constitutional government was inspired by private ambition: But he readily accepted there would be widespread support for the extinction of the monarchy throughout Europe. Nor did he feel that the movement could be halted, declaring that the "Spread of Dangerous Opinions" and "The General State of Rottenness" would become so widespread as to be considered as normal, for under the heading "What is to be done?" he stated: The real nature of the French Revolution is revealed by its principles, which Burke explained in "Reflections on the Revolution in France" as: The Nature of Pure Democracy And Burkeʼs denunciation of this "natural government" in his essay leaves no doubt that he considered this declaration by the people of their desire to be ruled by the "occasional will" of the majority, to be the worst form of rule, unrestrained and unaccountable: "All persons possessing any portion of power ought to be strongly and awfully impressed with an idea that they act in trust: and that they are to account for their conduct in that trust to the one great Master, Author, and Founder of society. This principle ought even to be more strongly impressed upon the minds of those who compose the collective sovereignty, than upon those of single princes. Without instruments these princes can do nothing. Whoever uses instruments in finding helps, finds also impediments. Their power is therefore by no means complete; nor are they safe in extreme abuse. Such persons, however elevated by flattery, arrogance, and self-opinion, must be sensible, that, whether covered or not by positive law, in some way or other they are accountable even here for the abuse of their trust. If they are not cut off by a rebellion of their people, they may be strangled by the very janissaries kept for their security against all other rebellion. But where popular authority is absolute and unrestrained, the people have an infinitely greater, because a far better founded, confidence in their own power. They are themselves, in a great measure, their own instruments. They are nearer to their objects. Besides, they are less under responsibility to one of the greatest controlling powers on earth, the sense of fame and estimation. The share of infamy, that is likely to fall to the lot of each individual in public acts, is small indeed; the operation of opinion being in the inverse ratio to the number of those who abuse power. Their own approbation of their own acts has to them the appearance of a public judgment in their favour. A perfect democracy is therefore the most shameless thing in the world. As it is the most shameless, it is also the most fearless. No man apprehends in his person that he can be made subject to punishment. Certainly the people at large never ought: for as all punishments are for example towards the conservation of the people at large, the people at large can never become the subject of punishment by any human hand."'
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/french.htm"
