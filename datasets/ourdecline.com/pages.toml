["https://ourdecline.com/decline/pitt/defenc99.htm"]
title = "Tony Pitt's Australian Defence Report 1999"
description = "An ex-Australian warrant officer's view of the state of Australia's defences in 1999. Cited by 'A Study Of Our Decline' by P Atkinson"
full_description = '''The Ready Reserve This cache of 1,157 Bren guns and 415,000 303s (plus ammunition) was put in storage after World War II in case we were invaded. It took three years to unpack, clean, check, oil and repack the weapons, and then it was time to do it all again. I watched the storeman, acting under orders, dumping them on the Barrier Reef, cutting them up in pallet loads and sending them to Sims Metal. By 1991 most had been destroyed. The remainder, 100,000 303s 8,300 Brens, 3,000 Vickers, and all remaining Owen guns went to "overseas tender only" (Aust 30/5/91). This left us with 110,000 of the L1A1, 7.62mm self loading rifles and 37,000 Steyr 5,56mm rifles. The Self Loading Rifles (SLRs) In 1994 the government ordered that these 110,000 rifles be melted down at BHP (Australia's largest steel producer). Each rifle was worth $4,000 secondhand. That left us with (by then) 67,000 Steyrs. The 5.56mm/.223cal The Steyr was 5.56mm or .223cal a virtual toy by military weapon standards. It was touted the killer weapon as was the Armalite 223. The British commandos used that in the Falkland war. In the debriefing the commandos reported that the .223cal was no use in war. In their words, It was after the Australian "government" were aware of this inadequacy that they dumped the SLRs and armed Australians with a known ineffective calibre weapon. The Steyr The Steyr proved to be defective. The Army issued an order No. 7196-94. This indicated that the Steyr should not be used on rapid fire for long because plastic parts melted. The Saudis tried the Steyr and rejected it because it could not handle the dusty conditions. It was also reported that the tiny .223cal was no good in the tropical wet either. It didn't take many drops of water down the barrel to make the gun unsafe to the operator. The optical sight fogs up in the jungle and, since the rifle has no other sight, the soldier is in deep trouble. Australian Defence Industries (ADI) The Federal Government decided that the gun legislation to disarm Australia applied to our armed services. If you can't believe that read this report from the Financial Review 1/12/97.'''
author = "Tony Pitt"
year_published = 2025
clearnet = "https://ourdecline.com/decline/pitt/defenc99.htm"
