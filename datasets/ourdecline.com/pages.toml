["https://ourdecline.com/feedback/fdbk2002.htm"]
title = "Response to 'A Study Of Our Decline' (2002)"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline'(2002)"
full_description = '''Mr. Atkinson I have found your study to be informative, but online reading is somewhat cumbersome to me, is there any way to get a hardcopy of your observations? Dear Philip, I am a 43 year old businessman, who works from home, and with my wife and 4 kids. And love my life. I have found your work thus far lucid, rational and consistent. It appears systematic, well researched and lacking obvious agenda's and bias. Indeed consistent with my own Biblical Worldview. Something rarely encountered in comtemporary Christian thinking, of which I am one. And I want to congratulate you on it. Regards Jamie Bowman,Mitcham Melb. PS are you familiar with Rushdoony's work "Law and Liberty", or Dennis Peacocke's material? ssmith15@bigpond.net.au I found your essays interesting reading. Would you have an essay that critiques feminism and its part in the decline of civilisation. Hello: I admire your web documentary on Blacks . Living in America I am upset about how distortedly race behaviour is being reported in USA. Keep up your good work! Mr. Atkinson My compliments, sir, on your observations and comments. Thank you for taking your time to think and to write as you have. As are you, many/most of the thoughtful, aware, perceptive men I meet are systems analysts, or, in some similar way, have successfully worked around computers. Greetings Philip; A great web site, I've been over it several times, you succintly state what I've felt with out being able to define it, I mean I didn't see the rats around me, but I saw the droppings, if you know what I mean. You have a brash and effective writing style, with a touch of humour. I grew up in Sydney, but now live on the North Coast of NSW, I was in Sydney recently and it was really awful, it felt so different, it had lost it's raffishness, and sense of community, these had been replaced by a sense of property and capital gains madness. Units and cheaply built townhouses had mushroomed like skin cancer, and scout/brownie/community halls were derelict, or gone. I would be interested to know when this rot really got underway, was it evident here when you first came to Oz, and are things the same, or not quite so bad in the UK/Europe as yet.? Once again, well done!'''
