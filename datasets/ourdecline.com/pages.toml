["https://ourdecline.com/decline/badlaws.htm"]
title = "Bad Laws Prompted By Political Correctness"
description = "The absurd nature of the laws prompted by Political Correctness (22/11/2015)"
full_description = "The Need For Freedom Of Expression Anxieties and suspicions inevitably occur in societies and these give rise to accumulating resentment until they are expressed by word or deed. Announcing sentiments that mount a verbal attack upon the source of such concerns releases the tension for both the speaker and a sympathetic audience. This may upset some people but it is much better that feminists are lampooned rather than lynched or that Jews be the subject of jokes rather than pogroms. Consequence Of Unnecessary Censorship The inevitable result of unnecessary censorship is a build up of silent resentment. The quickest way to force someone who talks into someone who acts, is to compel silence upon a subject that worries them; then, like steam in a pressure cooker, it is merely a matter of time before their suppressed anxieties erupt into action. The inevitable consequence of legislation that forbids any spoken, or written, expression of hatred, must be violence. By forbidding the expression of racial hatred the law is promoting racial violence. So the first persons who should be prosecuted under such laws are the people who enacted the laws, as they are committing the very crime the laws proscribe, inciting racial violence. Which means the laws are absurd. The welter of laws enacted throughout the Western world in response to the public clamour to suppress unpopular sentiments include: And are a denial of the right to criticise. (See also the return of heresy trials and Paul Fromm's letters) Impact Of These Laws A society can only survive by upholding its reverence for its own race, religion and traditions against all other societies by violence, including the use of genocide, which are the very things proscribed by these laws. The popular demand for these laws is an attack upon the ability of society to exist!"
author = "Philip Atkinson"
year_published = 2025
