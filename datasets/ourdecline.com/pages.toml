["https://ourdecline.com/moral2/phlsphy.htm"]
title = "Philosophy Defined (01-May-19)"
description = "Philosophy defined as 'the study of how truth is created',so converting it into a science (16/01/2019)"
full_description = "Today anyone can call themselves a philosopher and announce any claim as a philosophical truth, and no one can say that the author is not a philosopher nor the claim is not a philosophical truth; which means philosophy is useless. Philosophy is useless because it lacks a useful definition, so to make philosophy useful I have advanced the simple definition that philosophy is the study of how understanding creates truth, for understanding is the source of all meaning. And without understanding there is no reality, no truth and no meaning. Thus, to allow philosophy to become a science, I suggest the following self-evident truths be adopted : The adoption of these truths convert Philosophy into a useful tool: a science. This science of philosophy explains not only understanding, language, reality, and truth, but also society: a shared understanding. These explanations allow a better understanding of ourselves by revealing why humanity behaves the way it does in forming a civilisation (a dominant society) and why such a society waxes (refines its understanding) then wanes (loses its understanding). Although the new science of philosophy significantly improves human understanding it reveals our current society is waning so condemning most citizens as fools, who naturally resent such a judgement. Most contemporary citizens insist upon ignoring the new science, and if they are pressed to recognise it, will persecute its proponents."
