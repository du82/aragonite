["https://ourdecline.com/feedback/fdbk2009.htm"]
title = "Response to 'A Study Of Our Decline' (2009)"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2009"
full_description = '''Hi, Just dropped in on your writings, thought your short biography was brutally honest — truth is sacrosanct, I feel that very strongly in what you say, and agree that it needs to be said, or we will never move beyond it. Thanks for injecting some honest critical thought into this world, it is both laudable and inspiring. My heartfelt thanks I want to thank you very much for your website ourcivilisation.com. which I discovered about 2 weeks ago and am so very impressed by everything I have read so far. It's a masterpiece. I loved reading your concluding comments, that as sad as it is to verify our civilization's decline, there is the matter of truth at hand and to speak the truth and to acknowledge the truth is the higher right in our lives. These are my words restating what I heard from you words. Well, I wanted you to know that I am very appreciative of all your study and hard work which brought forth your website. If from time to time, when I have a question may I email you? My husband wants to know what I am to do with all this information that I'm gleaning from reading your postings. To date, I haven't found the best answer to his question. I know that reading your postings helps me to understand what is taking place and to feel more pity rather than anger at the process. But I know there's another reason why I immediately sensed after reading just one of your postings that so many of my "life-questions" had been answered. I believe it's because your site speaks truthfully and truth has enormous power since (I believe) all truth comes from God. The real God, the true God, The One Who use to be worshipped by Western Civilization before He was deposed by us, in favor of ourselves. It is very sad but to everything there is a lifespan and you have captured so precisely the full spectrum of our civilization's decline. Thanks again for such an amazing website. A Letter from France You know, I do have to say that I first I was a sceptic about some of the ideas on this site, but I now see that most of the things mentioned here are actually happening. I am a student living in Paris (I'm a Franco-American), and I can tell you that you're pretty accurate. Never-ending new laws strip away our civil liberties, but people don't care much about the community anymore. People, in general, are less and less helpful. Multiculturalism means that I can be persecuted for any stupid remark I make, whether educated or not — I am afraid that most of the time I have to conceal my political opinions to myself. I feel that France, in general, is becoming increasingly foreign to it's culture and moving more and more into a Western Style generic consumerist state. The privatization of national enterprises, which run worse than their nationalized counterparts (do the some 30 suicides at Orange, formerly France Telecom, ring a bell?), is a good example of some of these destructive changes. It's not like it matters anyway, as many people don't care much for nationalized companies. Graffiti invades every corner of this town (even on touristic monuments). As a regular subway user, I have to deal with an increasing amount of people who jump across ticketing barriers, people who play loud music on their phones (I once asked one of them politely to turn their volume down, and of course, I ended up being the one at fault), people degrading public owned materials, and the like. I don't feel that we are nearly as cohesive, in terms of a culture, than before. Multiculturalism has introduced an invisible barrier between immigrants and native French (as you may have seen, some of these tensions rose in 2005 and 2006). You cannot even travel to some suburbs (referred to infamously as banlieues here) because they are simply too dangerous to go to. The socialist run system that most of Western Europe is using is slowly failing as people care less and less about this socialism and community and prefer caring more and more about themselves. We are so advanced in our technological age, yet we have less and less time to do things, and yet we seem to become dumber. Mobile phones make us available 24 hours a day, 7 days a week; computers make sure we never miss a day at work (or at school, for that matter); and it give us less and less free time to enjoy. And although we have less and less time to enjoy, it seems that we are becoming dumber and dumber. The Bac system (used to get the French equivalent of an exam-based secondary education diploma), gets less and less challenging every year as the curriculum is adapted to students who simply don't care about being educated, as they are distracted by this technology. I am in a Prépas class in France (about 5% of students that go into tertiary education choose this course of action, as it is a very intensive course in math, physics, especially in my course of action taken), and we have spent the last 3 months (200 pages of math notes) simply catching up with what a Terminale (12th grade) student knew in 1970. I don't know what to do. I don't know what to say. I don't know what to think the world of tomorrow, spiraling into a darker, and steeper decline will look like. I complain and try to help fix things, but I alone and too small to make a difference, and authorities have become too incompetent to properly listen to me. People vote for other people in politics as celebrities, not as thinkers. We don't care about one another, each of us living in our little isolated corners. And before we know it, an equivalent of George Orwell's 1984 will be right under out feet, except it will be more isolated than ever.'''
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/feedback/fdbk2009.htm"
tags = ["decline", "responses", "study"]
language = "en"
internal-references = ["none"]
external-references = ["google.com", "homeliving.blogspot.com", "lulu.com"]

