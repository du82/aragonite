["https://ourdecline.com/signs/chap9.htm"]
title = "Our Community's Retreat From Reason"
description = "Examples of the community discarding reason in the late 20th and early 21st century"
full_description = "European Reason Failing In The 1930s These sentiments not only applied to the European governments leading up to the Second World War, but naturally to the people they represented. The very rise of the Third Reich is the story of a Nation losing sense, for the people who flocked to the Nazi rallies demonstrated a complete and utter disregard for reason and morality. Nazism was never a concept, but a series of promises and slogans that were merely irrational excuses to indulge in prejudice and wishful thinking. The population of Nazi Germany had decided to give control of their actions to their feelings, rather than their intelligence. Rise Of Nazis Still Not Understood Fest's words make it clear that by the late 1930s reason was a vanishing quality in Europe. The subsequent judgement at Nuremberg by the victorious allies, which placed the blame for the Holocaust upon the shoulders of a few bad men in Germany, and has never been contradicted, is proof that comprehension has continued its sad decline. Our public inability to recognise that Germany had gone mad, and that nations do become gripped by lunacy, reveals significant shortcomings in existing communal awareness; we just can't grasp what really happened, for apart from a few unusual individuals, we have lost the ability to understand reality. Intellect Is A Tool Intelligence is the critical element that allows mankind to dominate all other species, and underpins the rise of civilisation. It allows the invention of tools, the development of technology that gives the all-important power to the community. It inspires our social organisation, allows the formation of complex communities, resolves problems and gives us purpose. Without it we would be beasts, merely another chattering ape. Nevertheless, possession of the ability to reason does not guarantee reasonable results. Intellect is just like any other tool; it may be used or abused. Application Of Intellect Depends Upon Character Comprehension is a fruit of applied reason, but the quality of this product depends entirely upon the craftsman. If the wielder of the tool is lazy, ill-disposed, has a hidden purpose, or plain misguided, then the final result must be less than perfect. Knowing the chances of being attacked by a shark are remote can only be used by the bold. The cowardly will not be able to overcome their anxiety. The joy of diving off rocks into deep cool water will be denied to those incapable of overcoming the notion that a five metre white pointer may be lurking just out of sight. Conversely being aware the chances of winning the lottery are remote will not prevent the fanciful from purchasing tickets. The effective exercise of our special talent needs discipline and determination to resist the eroding influences of our hopes and fears."
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/signs/chap9.htm"
tags = ["'signs", "newspeak", "reason", "retreat", "senility'"]
language = "en"
