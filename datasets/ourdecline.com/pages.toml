["https://ourdecline.com/cooray/rights/chap813.htm"]
title = "Property Ownership In Australia (1995)"
description = "An explanation of property ownership in Australia, revealing who owns it, and how they own it. (1995)"
full_description = '''The question 'Who owns Australia?' is asked and answered in Issue No 38, March 1985, 'Common Sense' by Viv Forbes. He points out that governments control 72% of the land in Australia, aboriginals 13% and 15% is held in private freehold. The figures are said to be based on the best information available. The reason for this is that governments, which are the biggest landlords in Australia, are very slack in accounting for and utilising the land they control. The figures include leasehold land as government land because the government is the owner and the lessee can be dispossessed at any time by government. The issue of 'Common Sense' focuses on the effect of government ownership. The following extracts from this issue (which continue to end of chapter) demonstrate the extent to which ultimate government title to leasehold land and government regulation in relation to freehold land stifle development and productive use. 1 Who owns Australia? A recent article in the Courier Mail 9th February 1985 was entitled "The People Who Own Australia". The article was illustrated by a big greedy hand grasping the continent, and a picture of Malcolm Fraser on "Nareen". A subtitle blared "The Land Barons". The story talked about people like the Falkiners, R.M. Williams, Rupert Murdoch, the Kidmans and Prince Leonard of Hutt. Another story in 'The Australian' 2nd February 1985 devoted a whole page to "the quiet millionaire who has just acquired Victoria River Downs", the biggest cattle property in the world. The stories were eye-catching but, like so much modern journalism, misleading. Here are some real leads for sensational but accurate journalism. The biggest landlord in Australia is the Department of Lands and Surveys in Perth which owns 211 million hectares (equal to 176 times the area of the giant Victoria River Downs — 176 VRD's). Over in Queensland, a three man unelected Land Commission presides over some 135 million hectares, or 113 VRD's. Down in NSW, the Western Lands Commission is landlord to 1450 properties containing over 30 million hectares or 25 VRD's of land. In ACT, virtually all land is owned by the government, who is thus landlord to every home, office, factory and business in a city of 250,000 people. Even the great VRD itself is leasehold land, owned by the Department of Lands in Darwin whose empire totals 80 million hectares, or 67 VRD's. Table 1 shows that governments own 72% of Australia and another 13% is owned and controlled by governments or quasi-government land councils or trusts on behalf of aboriginal people. These then are the real land barons in Australia. Private freehold land covers no more than 15% of Australia and maybe as low as 10% — surely the lowest proportion of private land ownership outside the comrade societies.'''
author = "LJM Cooray"
year_published = 2025
clearnet = "https://ourdecline.com/cooray/rights/chap813.htm"
