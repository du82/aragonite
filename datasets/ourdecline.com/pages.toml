["https://ourdecline.com/nuclear/index.htm"]
title = "A necessary, safe nuclear reactor"
description = "The  Integral Fast Reactor is necessary and Safe: an interview with Dr Charles Till (30/1/2001)"
full_description = '''PBS: Talk about when you decided to go into nuclear power, and about the vision as it looked back then. Till: Oh, it was the field of the time. It was a field where you could be assured of doing something important, something for your time, is how I thought of it, that energy is the basis of our society, and nuclear energy was to be the way of the future. Till: No. Remember, this was the late 1950s. The word "environment" was not even used much then, nor in fact really was the word "energy" much in the all encompassing sense that we use it now. It was, though, the unlimited amounts of energy. It wasn't the fact that nuclear, as I later came to believe, was also the best form of energy environmentally. But it was simply that the humankind is going to need vast amounts of energy in the future. Here was the way. Till: Yes, of course it was ... If nuclear energy was to provide the amount of energy that the dream said it would, the vision said it would, then you'd have to recycle it in order to use the resource in effect over and over again. Till: Simply that once the fuel has been used, and used to the maximum extent it can, which generally takes about three years, that you take it out and process it in a manner that allows you to take all of the useful elements out of it and recycle them back into the reactor bed. Simple as that. PBS: What is the concept of the Integral Fast Reactor (IFR), and how [does] it address the issue of waste and of using energy and so forth? Till: Well, the IFR was a concept that we worked on for some ten years. And it was an outgrowth really of the studies that were caused by the Carter administration in the late '70s, where we looked at all the various kinds of reactors, types of fuel, processes for dealing with the waste, and so on. And it became obvious to us that one could put a total reactor concept together that would at the same time give you safety of a kind that reactors today don't have, that would allow complete recycling of the fuel, and thus extension of the ability to produce energy (very roughly, by a factor of 100), and also a waste product that did not contain the most dangerous elements. So with one concept you attack all of the principal real issues that there are for the use of nuclear energy.'''
author = ""
year_published = 2025
