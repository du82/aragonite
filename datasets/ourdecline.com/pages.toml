["https://ourdecline.com/usa/invade.htm"]
title = "The Mexican invasion of the USA"
description = "Why the stream of Mexican illegal immigrants flooding into the USA should be considered a Mexican invasion (28/11/2001)"
full_description = '''Since the 9/11 terrorist attacks, support for the United States has poured in from around the world, but the response from Mexico has been decidedly lukewarm. A Gallup poll reported that 78 percent of Mexicans oppose contributing troops to a multinational coalition, and we have seen no indication that Mexico will modify its oil policy of acting like a member of OPEC. While there is no evidence that the 9/11 terrorists entered over the Mexican border, the trial in El Paso of an Iraqi smuggler produced evidence that he alone brought more than 1,000 Middle East illegals into the United States via that route, charging his clients $10,000 to $15,000 each. Border Patrol agents have confirmed the increase in illegal aliens coming from the Middle East across our southern border and the fact that Arabs pay up to $50,000 each for a "coyote" to smuggle them into the United States. The 9/11 events have temporarily shelved the foolish proposals to grant amnesty to three million Mexicans illegally living in our country. Unfortunately, there is no indication that Mexico has retreated from its longtime goal of opening the U.S. border. In Chicago on July 27, 1997, then Mexican President Ernesto Zedilla told the National Council of LaRaza, "I have proudly affirmed that the Mexican nation extends beyond the territory enclosed by its borders." He announced a Mexican constitutional amendment that purports to allow Mexicans to retain their Mexican nationality even though they become U.S. citizens (which is contrary to the U.S. naturalization oath). When President Vicente Fox came to the United States this year, he reiterated this line, proclaiming that "the Mexican nation extends beyond the territory enclosed by its borders" and includes migrants living in the United States. He called for open borders and endorsed Mexico's new dual citizenship law. Some Mexicans use the term "reconquista," which is Spanish for reconquest, to describe their desire to see California, New Mexico, Arizona and Texas acquired by Mexico and named the new country of Aztlan. They are teaching their youth that the United States "stole" those areas from Mexico and that they should be "returned."'''
