["https://ourdecline.com/impact/drive.htm"]
title = "Impact Of Social Decline on Driving"
description = "Why the experience of driving clearly reveals the inability of most citizens to act in their own interests"
full_description = "To drive a vehicle, which is an essential task for most citizens, demands the universal adoption of a driving code to allow the safe efficient flow of traffic. A key part of this driving code is that the gap between following motor vehicles must be at least two seconds if a collision is to be avoided should a leading vehicle suddenly stop. To be closer than the two seconds from the vehicle in front is to place both vehicles in jeopardy, so it is a breach of the highway code, which is described as 'tailgating'. Not only is this practice illegal and dangerous but it provides no benefit, so its practitioners are not sane. Nevertheless, to drive is to be 'tailgated' for the vast majority of drivers do not keep a safe distance from the vehicle in front. That is, even if you drive at 110 kph on a motorway, you will quickly discover yourself being closely followed by vehicles that would crash into you should you suddenly brake. Not only is the requirement for the two-second gap ignored, but if a driver should dare slow down so that the gap between the vehicles approaches two-seconds, he would immediately become the target of 'road-rage': following drivers would throw violent tantrums with uncertain results. The everyday experience of driving clearly reveals that the vast majority of citizens no longer have the ability to accept any truth that they find inconvenient, even if it is as mundane as 'keep a two-second gap between moving vehicles', and to uphold such truth is to risk being assaulted."
