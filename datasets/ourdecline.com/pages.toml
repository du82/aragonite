["https://ourdecline.com/violence.htm"]
title = "Society's Need for Violence"
description = "An explanation of the vital role that violence plays in the life of a society(July 2011)"
full_description = "Violence is the Foundation of All Order Violence is the threat, or act, of hurting, injuring, maiming, or killing, and is the way people are controlled so it is the foundation of all authority. This simple truth is not immediately obvious to citizens living in a peaceful society because of their private experience. The occasional outbursts of violence they observe are often the result of crime, which suggests to many citizens that violence is only the tool of the desperate or deluded. They overlook the fact that such criminals can only be arrested and brought before the courts by the use of violence. Violence is Essential for Law and Order The truth that the law is only maintained by the tacit threat of violence is forgotten by most citizens who rarely breach any major law, and are willing to pay the fines imposed by the official discovery of their misdemeanours such as speeding. Even those who steal or murder generally accept the notion that public discovery will demand private penalty. However the reality is that without the threat, or actual use, of violence by law officers, the law would be ignored. People can only enjoy their property and liberty within a society because of the society's readiness and ability to inflict violence upon lawbreakers. Violence is Essential for Land Title The reality is that your continued ownership of your house rests upon the violence that you can obtain and direct from the authority of the law. And this dependence upon violence for ownership is not just restricted to a house but extends to a country. Our society can only retain ownership of its country by being able to defend its claim against any other contending society. That is, a nation must be ready and able to inflict violence upon other nations if it wishes to retain ownership of its land. Violence is Essential for Civilisation The notion of title, or right of ownership, is an invention of communal understanding. So when a society defends title it is defending its understanding. And this violent defence is not just necessary for the idea of title, but for all of a society's beliefs. If a society is to assert itself then it must be ready and able to use violence: wage war. The blessing of Roman civilisation was only obtained for the world by the military might of Roman arms. Pax Romana rested upon the ability and determination of the Roman people to inflict terrible violence upon all who opposed them. The Roman Empire was built by the murder and intimidation of all those peoples who resisted Roman rule, and this was done by the example of the wholesale slaughter of such peoples (barbarians). The consul Julius Caesar in his campaign against Germans who had invaded Gaul in 55 BC, slaughtered four hundred and sixty thousand men women and children; virtually exterminating the Tenchteri and Usipetes. But from the time the Romans revealed reluctance to inflict irresistible violence upon the barbarians, their empire was doomed. In AD 376 the emperor Valens had to choose between allowing the barbarous Gothic nation to be slaughtered by the Huns on the banks of the Danube, or accede to their pathetic pleas for mercy and admit them into the Roman Empire. He chose to be merciful, and paid for this mistake with his life. The rescued Goths quickly changed from refugees to invaders and destroyed the Roman army at the battle of Hadrianople in AD 378. The victors then proceeded to lay waste to the Roman Empire and eventually became the new rulers of Italy."
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/violence.htm"
tags = ["caesar", "consul", "defined", "julius", "need", "society", "society's", "violence"]
language = "en"
internal-references = ["none"]
external-references = ["lulu.com"]

["https://ourdecline.com/decline/frommexp.htm"]
title = "The Persecution Of Paul Fromm"
description = "The persecution of a director of the Canadian Association for Free Expression, Mr Paul Fromm"
full_description = '''St Patrick's Day Update by Paul Fromm It's St. Patrick's Day, the time for the wearing of the green, but I'm still seeing red. On March 8, I received word that, after more than 16 months of deliberation, a 3-man arbitration panel had ruled 2-1 against me. My union, the Ontario Secondary School Teachers' Federation (OSSTF) had grieved my firing, in February. 1997, by the Peel Board of Education. Justice here, is both slow and denied. Over the past five years, many of you, including many of you who assisted me financially in this battle, have asked me for an update. I've often thought that I sounded, at meetings like a broken record: The hearings are over, but they're still deciding. Let me offer a brief chronology of events. I was a teacher since 1973, teaching Latin, English, writing and journalism to adolescents and, for the past five years to adults. Robert Lee, a former Director of Education, had called me "an exemplary teacher." I received consistently high praise and evaluations for my work. Furthermore, my work was so in demand that, since 1991, I regularly taught both summer school and night school. I had a really full plate, along with my political and family commitments. I must also point out that I never taught politics in the class. Despite days of testimony, no evidence or allegation was ever brought forward that I had taught inappropriate or partisan material or that I had ever discriminated against a student, despite the fact that many of my classes were made up of 50% or more visible minorities. 1991. The Canadian Jewish Congress and other censorship groups engineer extensive press coverage and demand that the Peel Board fire me. My offence? I had heckled radical Indian leader Rodney Bobiwash at a public meeting. He was demanding a whole series of repressive actions, including denying Toronto meeting halls to "racists". Asking how far would you go, I heckled, "Scalp 'em?" This professional Indian grant chaser and his pro-censorship allies were not amused. The Board reprimanded me.'''
author = "Paul Fromm"
year_published = 2025
clearnet = "https://ourdecline.com/decline/frommexp.htm"
