["https://ourdecline.com/chatter.htm"]
title = "The crucial role of Conversation"
description = "The crucial role that conversation plays in the development of communal understanding (2002 March)"
full_description = 'An Explanation Why the Ancient Greeks Were So Clever To explain why ancient Greeks were so clever that they "showed for the first time what the human mind was for", H.D.F. Kitto states: Conversation Moulds Understanding Conversation is the casual exchange of opinions that occurs as part of daily life. This exchange is crucial not only to the community but to the individual. These communications not only mold communal but also individual understanding. It is not just the apparatus of the community that receives its direction from these transactions, but the individual. By communicating an individual (and a community): People who stop using words lose the ability to speak in words, and as words are understanding, this suggests our ability to think clearly needs exercise through communicating with others, otherwise it atrophies. Impact of Restraint on Conversation The free exchange of opinions is clearly essential for the creation and maintenance of sane, clear thinking individuals, and thus sane, clear thinking communities. While some inhibition upon expression is necessary for keeping order, these limits must be kept to a minimum and be decided by common law. Once censorship is imposed by any other mechanism it threatens the sanity of the community. Arbitrary and irrational limitations such as those demanded by the proponents of Political Correctness can only result in the creation of a demented community; a society whose thinking is crippled by threat or violence.'
