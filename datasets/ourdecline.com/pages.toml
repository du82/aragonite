["https://ourdecline.com/public/chap4.htm"]
title = "A Bureaucracy Administered By Bounders (2006)"
description = "The result of promoting the selfish to positions of trust and authority (1999 September)"
full_description = '''Folly In our democratic community (circa 2000) the single requirement that controls whether our executives adopt a course of action is not "is it wise" but "is it popular", the crucial quality that guarantees politicians their jobs. The inevitable result is folly. Less formidable to its enemies Neglect Of Our Defences. Reflecting public disinterest Australia's military forces have been reduced to a token force that cannot even detect the presence of an invader, even if that invader is unarmed refugees. Boats sail hundreds of kilometres across the open sea and come ashore unknown to those agencies charged with our protection, their arrival only reported when seen by incredulous citizens. Not For The First Time On Saturday, March 13th, 1999, the headlines of The Courier-Mail reported that 22 people had been arrested after a newsagent warned customs that a 35 metre steel boat packed with Asians had grounded on a suburban Cairns beach. A warning prompted when some of those aboard made their way to his shop at Holloway beach to call a taxi. At first Mr Bruce Sharples thought they were tourists, but became suspicious when he heard about the abandoned boat, and noticed his customers were wet. Nor The Last Time On Monday, April 4th 1999, the front page of The Courier-Mail reported that 53 illegal immigrants had been rounded up from the rusty Chinese hulk that had landed on Scotts Head beach near Coffs Harbour on Saturday 2nd April 1999. In this case a farmer notified the authorities when three wet and frightened men, without baggage, came to her door and employed poor English to indicate they wanted to use the telephone. Mrs Ettelson allowed them to use one phone while she used another to alert the police. Public Reaction To Invaders It must be noted that the public reaction (circa 2000) to the appearance of these boat people was not anxiety that our defences were failing, but anxiety about the welfare of our invaders. And a great deal of expense and effort was placed into separating the intruders into two groups; those who deserved our pity and those who did not, that is, identifying them as genuine refugees or not. The genuine were allowed to invade, only the ungenuine were thwarted and sent home, at our expense. Military efficiency was only a concern should one of these invasion boats sink without being detected, and so allow the awful prospect of our intending invaders drowning.'''
