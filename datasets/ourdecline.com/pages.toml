["https://ourdecline.com/author.htm"]
title = "Philip Atkinson, author of 'A Study Of Our Decline'"
description = "A brief biography of Philip Atkinson, the author of 'A Study Of Our Decline' and the first philosopher"
full_description = "Philip Atkinson was born in Newcastle-upon-Tyne, England, on the 7th June 1947, the result of a wartime marriage between a state registered nurse and a Captain in the Royal Army Ordinance Corps. His father had been educated at Cambridge University before working for some years for the foreign office in Africa. The head of the house was an ardent supporter of George Orwell and so a socialist, hence after winning the position as lecturer in History at Kings College, Newcastle, planted his family among the proletariat, the heroes of Nineteen Eighty-Four. This meant his middle-class wife and three children lived for the next fourteen years on a new council estate in the company of resettled slum dwellers. And this action, inspired by inverted snobbery, had a lasting impact upon his spouse and offspring, especially his middle-child. Like all children, I wanted to be accepted by my peers and be part of the gang of small boys who lived in the street. They were my heroes, I hung on every word they said, and did all I could to win their approval. Their contemptuous treatment of me I accepted as only natural because I was the youngest and weakest. They were tough and clever, while I was puny and inexperienced. But one day this all changed. To my delight, a boy smaller and younger than me moved to the street, and I knew that it would only be a matter of time before I could demonstrate my superiority to the newcomer. And when the gang resolved to have a boxing competition, I felt that this was my chance. Previously I would have been omitted from such a competition as being too weak to match in a fight, but now there was a possible partner, and as the gang split up into matched pairs I was pitted against the new boy. And when it was our turn to box, I gently, but firmly, displayed my clear superiority. Alas, when the judges, the oldest boys, declared the result, it was not me, but the new boy, who was deemed the winner. I was stunned. For some time afterwards I struggled to understand this decision. I knew that I had won the fight, but this was not enough; it was not my stature nor strength but some innate personal quality that condemned me. It was clear that regardless of what I did, I would never win the respect of my peers, so I stopped trying. But I also knew the judges had lied, so to understand their motive I started to look closely at my erstwhile heroes and began to see their undeniable flaws. They were not rational; they had rejected me out of prejudice. While they were all larger than me, I found they only presented a threat as a group. Alone, they not only left me in peace, but seemed a little nervous at my presence. And in games that required strategy, I found it was easy to best them. My esteem for my peers became replaced by contempt and planted the seed of suspicion in my mind that my whole community was of the same calibre — foolish cowards. A notion that experience rarely confounded but often confirmed, so insensibly I became a social exile."
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/author.htm"
