["https://ourdecline.com/feedback/fdbk2016.htm"]
title = "Response in 2016 to 'A Study Of Our Decline'"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2016"
full_description = '''Dear Mr. Atkinson, I stumbled upon your web site when doing a search on "what motivates people to become socialists." I have only scratched the surface of the content on your site, but I am amazed at how much in sync we appear to be. I have often described myself as a long term optimist, but short term pessimist. I am deeply concerned about the future of America and find it more and more difficult to see an ability of this country to end the decline it's in. The long term optimism is slowly turning into a belief in the inevitable decline of the United States. To be very clear, my personal feeling is that the inexorable shift toward socialism in this country is the immediate source of the decline. The longer term issue is that the left, which harbors the socialist view, owns our public education (read "indoctrination") system, they own the media, both news and entertainment, and they own the judiciary (read "legislation from the bench"). How can this mold be broken? Of course, the election of Donald Trump is something of a reaction to this trend, but I fear a populist is not the answer. Regarding our being in sync, the more I look into socialism, the harder I find it to understand why apparently intelligent people choose that philosophy, hence the reason for my internet search. It's not just socialism, but the blind acceptance of political correctness, open borders, all things being racist, etc., etc. Maybe there is a certain mass insanity settling in. I am not prepared to accept that all is lost, and I won't live to find out anyway. I do fear for the future of my children and grandchildren, but I will try to hold on to that long term optimism and will pray for sanity to return. — Sincerely, Mr. Atkinson — I'm a frequent reader of your web site. Today I came across the following, which seems in harmony with your ideas: Perhaps the observation will be of interest to you "... when your civilization is collapsing, civilized people become a liability" see http://cluborlov.blogspot.sg/2016/06/negative-interest-rates-are-coming-to.html#more I hope you keep thinking and writing. I am very grateful for your ideas. Best regards,'''
author = "Philip Atkinson"
year_published = 2025
