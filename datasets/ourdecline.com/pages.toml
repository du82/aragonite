["https://ourdecline.com/cooray/btof/chap9.htm"]
title = "The Family; Chapter 9 of 'The Australian Achievement' (1996)"
description = "A discussion of the family and its importance to western civilisation, chapter 9 of 'The Australian Achievement' by Dr Mark Cooray (1996)"
full_description = 'The family has been an important part of western civilisation, indeed, of all civilisations and of primitive cultures too. Parental care and nurture is important even in the animal world (particularly among those closest to man - apes and monkeys). The family provides meaning, continuity and purpose in the lives of individuals. It provides a nurturing and protective environment in which children can progress to adulthood and the best environment for the care of the aged, the disabled and the young. Monogamous Marriage And Family George Gilder in Wealth and Poverty New York (1982) pp 88-89, 90-91,92, persuasively outlines the importance of the family: "Indeed, after work the second principle of upward mobility is the maintenance of monogamous marriage and family. Adjusting for discrimination against women and for child-care responsibilities, married men work between two and one-third and four times harder than married women, and more than twice as hard as female family heads. The work effort of married men increases with their age, credentials, education, job experience, and birth of children, while the work effort of married women steadily declines. Most important in judging the impact of marriage, husbands work 50 percent harder than bachelors of comparable age, education, and skills. The effect of marriage, thus, is to increase the work effort of men by about half. Since men have higher earning capacity to begin with, and since the female capacity-utilization figures would be even lower without an adjustment for discrimination, it is manifest that the maintenance of families is the key factor in reducing poverty. A married man, on the other hand, is spurred by the claims of family to channel his otherwise disruptive male aggressions into his performance as a provider for a wife and children. These sexual differences alone, which manifest themselves in all societies known to anthropology, dictate that the first priority of any serious program against poverty is to strengthen the male role in poor families ...'
author = "LJM Cooray"
year_published = 2025
clearnet = "https://ourdecline.com/cooray/btof/chap9.htm"
tags = ["'the", "achievement'", "australian", "cooray", "family"]
language = "en"
