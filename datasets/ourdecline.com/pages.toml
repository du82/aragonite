["https://ourdecline.com/duty/kessing/index.htm"]
title = "The persecution of Allan Kessing"
description = "Allan Kessing describes his persecution for doing his duty as a customs officer (April 2011)"
full_description = "I joined Customs in 1990 and retired in 2005. My first three years were on the wharves then two at Sydney airport. In January 1997 I was approached to join a new intelligence section analysing sea and air cargo where I remained until returning to the airport in 2001. In 2002 I was recruited by the Air Border Security unit because of my previous experience to analyse the large amount of material it had accumulated over the years that had never been brought together. It took me a couple of months just to read and try to collate and the picture that emerged was one of accumulated abuses of Customs regulations, theft, smuggling and systemic criminality. Long time failures had been set in concrete during the run-up to the Olympics and many new rorts and abuses had been accreted on since then. As a result I was asked to write a risk analysis specific to one area: private security staff employed by the privatized airport corporation. This was completed and forwarded to the Customs airport manager in early 2003. It was met with shock and horror at the implications and rejected out of hand as impossible to implement for a number of commercial and operational reasons. I was then directed to prepare an overall report on the workings of the airport that are beyond the public view, the so-called 'sterile areas' which are restricted to employees issued with an Air Security Identification Card. I took a random cross section of persons holding these ID and this report was completed in August 2003. Like its forerunner this was also rejected. This caused considerable dissatisfaction, not to say anger within the unit with talk of resigning or sending the reports to other senior officers, even plain envelopes to newspapers. Shortly afterwards the unit was told that it was to be abolished and a rear guard action was fought without success. I was due to retire early in 2003 and had only stayed on to write the longer report because I felt committed to completing an important and worthwhile task."
year_published = 2025
