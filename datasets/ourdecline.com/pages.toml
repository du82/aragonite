["https://ourdecline.com/moral2/moral8.htm"]
title = "How to recognise good from evil"
description = "Why recognising good from evil must be a cultural decision, which makes cultures clash(13/9/2016)"
full_description = "A Professor's View On the evening of Thursday, 30th March 2000, I attended a lecture by Professor Paul Wilson at Bond University advertised as Evil In The New Millennium. From the start of the talk the learned criminologist confessed that he did not know how to define evil, but this did not prevent him from immediately classifying some acts as evil, with genocide considered an ultimate evil. This was illogical but it reflects the contemporary (circa 2000) popular approach to this subject, people cannot say what evil is but they know it when they see it. This is an admission that evil is felt rather than recognised, with the nature of an event decided by emotion rather than reason. A Rational View No decision should be dictated by emotion, only by reason, otherwise it is likely to be wrong. If evil is to be correctly diagnosed it must be by applying a disciplined understanding. The Dean of Humanities claim that genocide is evil does not withstand historical consideration. Genocide has been used to establish a rule of law among savages for it was only by mass slaughter that Julius Caesar was able to extend Pax Romana over Gaul. And it was this technique that extended Roman civilisation throughout the world. For the Romans the use of genocide was not evil but essential for securing and protecting their property and lives, and therefore a good act. Certainly the fall of Rome can be directly ascribed to Roman failure to inflict genocide upon the Goths, for these tribes eventually ravaged the Latin empire. And they only did so because the Romans failed to countenance the mass slaughter of their enemies. Trapped between the advance of the Huns and the river Danube, a natural boundary of the Roman Empire, the Gothic nation faced extinction. Their attempts to force entry into the empire had already been repulsed with heavy losses, so they begged for, and received, from the emperor Valens, permission to enter the Roman world. This act of mercy, the admission of a huge number of unconquered tribes of barbarians into the precincts of the Roman empire, lead inevitably to the destruction of the empire and the fall of Rome. So it is untrue to state that the act of genocide is always evil, just as it is untrue to say that the act of mercy is always good. No act is evil or good in itself but must be judged on the circumstances."
year_published = 2025
clearnet = "https://ourdecline.com/moral2/moral8.htm"
tags = ["'role", "evil", "morality'", "recognising"]
language = "en"
