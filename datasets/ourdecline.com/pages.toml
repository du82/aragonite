["https://ourdecline.com/cooray/cooray.htm"]
title = "Dr L J Mark Cooray (30/5/1938-29/7/2014)"
description = "A short autobiography of Dr Mark Cooray (30/5/1938 —  29/7/2014)"
full_description = "L J M Cooray LLB(Hons) (Ceylon), Phd (Cambridge), Phd (Colombo) studied and worked in Universities in Sri Lanka, England and Australia for 38 years. He resigned from Macquarie University (Sydney, Australia) in 1995. He was born in Sri Lanka. He is now an Australian citizen. He has lived and worked in Australia for 27 years. Dr Cooray resigned from employment in 1995. His time since then has been devoted entirely to voluntary work and receiving understanding and writing a number of books which examine public issues. Dr Cooray, during 38 years in Universities, through the grace of God, authored 14 books, 65 articles in learned academic journals and over 500 articles in popular journals and newspapers. These articles and books have been published and he has lectured and delivered learned papers in every continent. Dr Cooray is now working on a 14 volume series on human values, human duties and spirituality and life, including one book on what shapes and affects the growth and development of character, on the inside and the outside. Therefore with renewed vigour (youth renewed like the eagle's), during the years ahead, through the grace of God, 14 books are being written. L J M Cooray had an outstanding career in School. His form master, Mr E F C Pereira in his last years at Royal College, the leading school in Sri Lanka, said he was the best student he came across in thirty years as a teacher. He obtained a first class honours degree from the University of Ceylon in 1961. Only nine students (1948 to present have ever obtained a first class degree) He was offered in 1963 prestigious and well endowed maintenance and tuition scholarships to study at the University of Cambridge in the UK and Harvard University in the US. He was also nominated for a Rhodes Scholarship to the University of Oxford. He chose the University of Cambridge where he obtained a degree of doctor of Philosophy in 1968. He later obtained a second doctors degree from the University of Colombo. Dr Cooray is an author of 14 books, 65 articles in learned academic journals and over 500 articles in popular journals and newspapers. His articles and books have been published and he has lectured and delivered learned papers in every continent. His writings have been quoted by the House of Lords, by the Indian Supreme Court, by the Sri Lankan High Court, Court of Appeal and Supreme Court and in the Parliament of Australia. Former Chief Justices of Australia, Sir Garfield Barwick and Sir Harry Gibbs and Justice C G Weeramantry of the International Court of Justice in Hague are among those who have highly commended his writings."
