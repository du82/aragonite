["https://ourdecline.com/smartboard/shop/ransford/chap5.htm"]
title = "Vegkop: Chapter 5 of 'The Great Trek'"
description = "The 1st battle between the Boers and the Matabele: Vegkop: Chapter 5 of 'The Great Trek'(1968)"
full_description = "Riding south towards his headquarters at Sand river Potgieter passed scores of trekkers who had already heard that the Matabele were on the war-path and were withdrawing hastily from their exposed positions along the Vaal. The veld was filled with their hurrying wagons and herds of cattle, bellowing as they were urged forward by mounted men. At Sand river which he reached on 2 September 1836 Potgieter discovered that the most prudent of his people had already retired towards Blesberg where the second wave of the Great Trek was now arriving. Had Potgieter decided to go back with them everything afterwards in course of the Voortrekker story would have been different, worse probably, but certainly different. But Potgieter had no intention of retreating any farther. He ordered his remaining followers to go into laager. One party did so on the banks of the Vet river while Potgieter himself took his wagons to an easily defensible site he had noted some seventeen miles south of modern Heilbron. Here he would pit his forty available fighting men against the whole strength of the Matabele army. In meeting the Matabele challenge head on, Potgieter was of course staking his life and those of his kinsfolk on the superiority of a few men's muskets fired from a wagon laager over the assegais of several thousands of warriors. Looking at it dispassionately he was betting on an extremely thin chance, for we must remember that in 1836 the tactical advantages of fighting from a laager had only rarely been demonstrated, and he would be outnumbered by a fantastic margin. The site he chose on which to fight stood immediately below one of the few elevations that stand out of the plain separating the Vaal and Sand rivers. It is a low koppie about a thousand yards long and with two strata of reddish rock running round its mimosa-studded slopes. It is so shaped that it reminds the modern visitor of a slag heap. This strangely unimpressive hill which Potgieter was to clothe so splendidly with immense renown was always afterwards to be known as Vegkop—the fight hill. An active man can climb Vegkop within five minutes and from the top he will see the undulating veld stretching for many miles into the distance, and a scout stationed there would be able to give long warning of the approach of a Matabele impi. From its base on the south the ground falls gently away to a shallow spruit [rivulet] and is so devoid of cover as to provide a perfect killing ground to marksmen like the Boers. Here Potgieter placed his laager."
author = "Oliver Ransford"
year_published = 2025
