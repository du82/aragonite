["https://ourdecline.com/signs/deadsens.htm"]
title = "The Death Of Common Sense by Philip Howard (1994)"
description = "How the American legal system is paralysing and impoverishing the society it is meant to protect (1994)"
full_description = '''In the winter of 1988, Mother Teresa's nuns of the Missionaries of Charity walked through the snow in New York's South Bronx in their saris and sandals looking for abandoned buildings to convert into homeless shelters. They found two, which New York offered them at $1 each. The nuns set aside $670,000 for the reconstruction, then, for a year-and-a-half, they went from hearing room to hearing room seeking approval for the project. Providence, however, was no match for law. New York's building code requires a lift in all new or renovated multiple-storey buildings of his type. Installing a lift would add upwards of $130,000 to the cost. Mother Teresa didn't want to devote that much money to something that wouldn't really help the poor. But the nuns were told the law couldn't be waived even if a lift made no sense. The plan for the shelter was abandoned. In a polite letter to the city, the nuns noted that the episode "served to educate us about the law and its many complexities." What the law required offends common sense. After all, there are probably over 100,000 walk-up blocks of flats in New York. But the law, aspiring to the perfect abode, dictates a model home or no home. Today (circa 1996), laws control much of Americans' lives: fixing potholes, running schools, regulating day-care centres and the workplace, cleaning up the environment — and deciding whether Mother Teresa gets a building permit. The US regulatory system has become an instruction manual, telling citizens exactly what to do and how to do it. The laws have expanded like floodwaters breaking through a dyke — drowning the society they were intended to protect. In 1993, at a primary school in Long Island. the local fire chief appeared around Halloween dressed as Officer McGruff. the police dog that promotes safety. He noticed all the student art tacked to the walls. Within days. McGruff had done his duty: the art was gone. No-one had ever heard of a fire caused by children's art. The school principal, accused of permitting a legal violation, suggested that he had used a rule of thumb "on how much to decorate."'''
author = "Philip Howard"
year_published = 2025
clearnet = "https://ourdecline.com/signs/deadsens.htm"
tags = ["commonsense", "communal", "death", "diagnosing", "howard", "insanity", "philip"]
language = "en"
