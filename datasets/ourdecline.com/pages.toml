["https://ourdecline.com/signs/pvc.htm"]
title = "Greenpeace lie in an attempt to ban PVC (1999)"
description = "Newspaper article exposing the Greenpeace lie designed to generate a scare campaign to ban PVC (20/11/1999)"
full_description = '''THIS week my wife gave birth to our second child. It was a particularly painful and traumatic birth, beginning in the morning with an attempted induction and finishing towards midnight with a caesarean delivery. I spent a great deal of the day standing or sitting next to a metal pole near my poor wife's head. From the pole hung the plastic bags used to send drugs, blood and other fluids into a patient by way of a drip connected to the arm. The drip is one of the most frequently used and one of the most beneficial inventions of medical science. Throughout the day and the night these drips sent various life-giving substances into my wife's body. By coincidence, in recent weeks I've been looking at Greenpeace's attempts to shut down the world chlorine industry. Chlorine is the world's most widely used industrial chemical, and some 35 percent of it goes to the manufacture of a plastic that has become known colloquially as PVC. In recent years, Greenpeace has attacked the use of PVC in children's soft toys and teething rings, forcing many companies and stores to stop making or stocking them. Last week the European Union announced that it would be seeking an "emergency ban" on such products because of the danger they posed to children. Now Greenpeace has turned its attention to the use of PVC in medical products, mainly intravenous bags as described above, tubing, syringes and catheters. According to spokespeople for the organisation, a chemical named phthalate leaches from the PVC plastic into the liquids which come into contact with it, thereby entering the patient's body. If Greenpeace is to be believed, my wife — and my daughter — are now contaminated by "toxic chemicals" which might one day cause cancer and genetic damage and harm their hearts, livers, lungs, reproductive tracts and kidneys. You can imagine the trauma I went through, having to decide whether the short-term advantages of these drips were worth the long-term risk of turning my loved ones into toxic time bombs.'''
author = "Michael Duffy"
year_published = 2025
clearnet = "https://ourdecline.com/signs/pvc.htm"
tags = ["attempt", "greenpeace"]
language = "en"
