["https://ourdecline.com/smartboard/shop/jepsonrw/chap3.htm"]
title = "Thought And Language from 'Clear Thinking'  by R W Jepson"
description = "Chapter 3, 'Thought And Language ' from the book 'Clear Thinking ' by R W Jepson ."
full_description = "THINKING, as we have seen, is a process which in a practical problem obviates or postpones the necessity for overt action: it saves us the trouble of actually handling tools or materials — we need only picture them in the mind's eye. Therefore thinking is impossible without symbols of some kind to represent these tools and materials. And when we are dealing with a theoretical problem, such symbols are even more indispensable, because we want some means of representing not only concrete objects, but also abstract conceptions — qualities, relationships, associations, and so forth. The symbols most commonly used in thinking are Words. Words are not the only symbols used by thinkers, and so it cannot be said that they are absolutely essential to thinking. But they make thinking much easier; they enable us to label not only concrete objects and abstract qualities, but also classes, distinctions, similarities, relations and combinations; they make it easy to recognise these when they form part of larger wholes, and thus facilitate the analytic and synthetic operations noted in Stages 2 and 5 of the thinking process. As symbols, they are convenient, manageable, compact, and portable; they are capable of expressing fine shades of ' meaning'; and they are producible in speech and writing both for our own use and for communication to others. In these qualities lie their virtues and advantages, and, as we shall see later, their vices and their drawbacks. But when we come to express our thoughts and communicate them to others in speech or writing, these labels by themselves are inadequate. They must, with the aid of other word-symbols, be fitted into the framework of language units, i.e., sentences, paragraphs, etc., before their significance can be understood, in fact before the thinking represented by them can be clearly conveyed. Thus it comes that language which already serves the primary purposes of expressing our feelings, influencing the activity of others, and establishing sociable relations with them, is also used as a conscious vehicle of knowledge and thought. The fact that it does serve all these purposes also has its difficulties and drawbacks."
author = "R W Jepson"
year_published = 2025
clearnet = "https://ourdecline.com/smartboard/shop/jepsonrw/chap3.htm"
