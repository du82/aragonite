["https://ourdecline.com/decline/fathers.htm"]
title = "When wives stop obeying husbands"
description = "What happens when wives stop being the property of their husbands"
full_description = '''This conference was called by Governor Wilson because of the widespread concern about crime, educational failure, drugs, social decay, etc. and the perception that these are connected with family breakdown, in particular with the erosion of the weakest link in the family, the father's role. Anthropologist Margaret Mead has emphasized that, unlike the mother's role, which is biologically based, the father's role is a social creation. Male dogs and cats have no reproductive importance after their minuscule sexual performance is over. The emergence of a similar male rolelessness in the inner cities was becoming apparent some decades ago and is now becoming obvious in the larger society. At present the law appears to be less concerned with how to strengthen families than with how to provide for ex-families or fatherless families created by illegitimacy. It is becoming better understood that these fatherless families breed most of the criminal and underachieving classes. Many politicians think the problem is one of punishing the male criminals generated by such fatherless families — building more prisons, hiring more police, passing "three-strike" laws, squeezing money out of ex-husbands ("deadbeat dads") for the purpose of subsidizing ex-wives or ex-girlfriends and "their" children. Success in providing for these fatherless families means there will be more of them, that fathers will become still less needed and less motivated, and in consequence there will be further weakening of families and more of the resulting pathology this conference is concerned about. The weakening of male motivation means less male productivity, less male willingness to undertake family responsibilities, more fatherless families, more fatherless children, more crime, less economic growth. A society which cannot motivate its men to be family providers will deteriorate, as ours is doing. A society which threatens husbands with a fifty percent divorce rate combined with virtually automatic loss of children and home and property is forfeiting this motivation.'''
author = "Dr Daniel Amneus"
year_published = 2025
