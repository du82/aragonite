["https://ourdecline.com/aginatur/ddt.htm"]
title = "Insecticide DDT should never have been banned"
full_description = '''To many, the green movement still seems a harmless enough nature cult, not to be taken too seriously. But evidence and arguments have been emerging to suggest otherwise with increasing momentum and effect. The environmental lobby now stands charged with direct responsibility for millions of needless deaths, mostly of children in the Third World, from malaria. At issue is the banning of DDT. Bjorn Lomborg, of The Skeptical Environmentalist fame; puts the basic science briskly. and that its disuse has been a scandal of public policy. Author Michael Crichton, in an address to the Commonwealth Club in San Francisco, claimed that The junkscience.com website sees the ban as a tool for First World bureaucrats to pursue the goal of zero population growth in the developing world. DDT was banned after Rachel Carson, in Silent Spring (1962), accused it of a range of dangers to human health (notably cancer), to the ecosystem and to thinning the eggshells of bald eagles. Lapkin cites plausible authority that The scientific and moral crux is that the relative harmlessness of DDT has long been established. One late-1950s study involved researchers feeding a man 35mg of DDT a day for two years with no ill effects. Lapkin quotes Donald Roberts, an eminent professor of tropical medicine, as saying: Why then did the US Environmental Protection Agency ban DDT in 1972? The simple answer is that the environmental movement spawned by Carson's catastrophic predictions prevailed over empirical research. Far worse is Crichton's terrible charge: According to junkscience.com, a population control official at the Agency for International Development blithely summed it up as "rather dead than alive and riotously reproducing". Crichton's very persuasive argument is that ecological pieties are just that; religious convictions immune to rational scrutiny. Compared with such vitally important definers of personal identity, what do outcomes vaguely apprehended (if at all), let alone distant deaths, matter?'''
author = "Christopher Pearson"
