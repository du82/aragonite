["https://ourdecline.com/usa/index.htm"]
title = "Ending the Race Crisis in the 21st Century (1999)"
description = "The social decay overtaking America depicted as a 'race crisis' followed by four suggested solutions."
full_description = '''America in year 2000 has emerged as the sole superpower of the world. This may change in the next century. America's Euro- white historical race identity and its unique tradition of self- reliant freedoms, which created our national strength, are now being torn out at the roots: America is rapidly plunging into central-control statism and a mainly non-white nation. Our still-strong economy and welfare benefits attract the world's poor or oppressed as never before, millions immigrating annually — mainly from non-white lands. With federal laws firmly enforcing racial integration, America's races mix workably with each other's conflicting cultures. Or so it seems as portrayed in Government propaganda and the liberal media such as TV's cleverly-crafted programs exuding harmonious race-mixing. This rich racial diversity is today unquestioned Government dogma. But beneath America's complacent veneer are raw realities: out-of-control non-white immigration, rising racial friction, rampant black and Latino gang crime, violent and dumbed-down schools, unwed welfare mothers, widespread social dysfunctions and an ever-mushrooming national debt. Much of this is studiously kept unreported in the major media. For example, a rare attack by a deranged "white supremacist" is dramatized for many hours on TV (reinforcing white "racist" shame); but unreported are Justice Department statistics proving black-on-white violence 50 times more frequent than white-on-black. Unwed mothers, living in promiscuity and on Government welfare, are portrayed as "disadvantaged" rather than a moral scandal. Our bankrupting national debt of $5 trillion pays for social disorders such as gun violence in schools and illegitimacy that didn't even exist a few decades ago. (1) Skillfully indoctrinated by ceaseless media slant, the public is deluged with and absorbs massive misinformation. Driven by misinformation and Government-enforced racial integration, Euro-whites are rapidly surrendering their country to alien cultures.'''
