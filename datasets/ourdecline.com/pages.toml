["https://ourdecline.com/decline/loss/noshame.htm"]
title = "The Rudeness now endemic in Australia(2000)"
description = "Media items revealing the destruction of manners in Australia by young adults (2000)"
full_description = '''These reports not only reveal the erosion of manners and decency, but also the reluctance of the reporters to recognize and condemn rudeness. Instead the authors behave like ineffectual parents and try to discover excuses for the inexcusable behaviour of progeny. TV shows spattered with four-letter words, T-shirts covered with obscenities, chat shows which specialise in greed and ignorance.'Have we no shame?' by John Humhreys The Sunday Mail 26/9/1999 DURING a hot afternoon in the first days of spring, I was opening the windows of my house in what estate agents call a "highly sought-after" street. What I saw shocked me. A pretty young girl was leaving the house opposite wearing the teenager's uniform of T-shirt and jeans, but on the front of the T-shirt in large thick letters were the words "(Expletive) You". What really dismayed me was that so many grown-ups can no longer be bothered to be even mildly outraged. We have passed through the so-called permissive society and moved into the "Why bother?" society. Why bother to make a I fuss about the offensive T-shirt or swearing youngsters or the lout with his boots on the train seat or even the grown-up lout bellowing into his mobile phone three inches from your ear? It will make no difference and, anyway, standards have changed, haven't they? Well perhaps. What really matters is that attitudes have changed. Let's go back, for a moment, to the beginning of the permissive society. Sexual intercourse may not really have begun in 1963 but it was a darned sight less problematic after the Pill arrived. No more furtively sneaking down side streets to buy questionable magazines and condoms without the unimaginable embarrassment of asking the stern-faced woman behind the counter at the chemist. Now it was up to the girls, and the boys were suitably appreciative. That's what it was mostly about: A sexually permissive society. If most adults were shocked by it all, that was the whole point. They were probably a bit jealous, too. "Kids today! Don't know they are born." And they had a point. People of my parents' generation, who'd survived the horrors of the Depression and war without the cushion of a welfare state, were entitled to look at these feather-bedded youngsters enjoying sexual liberation, and a buoyant economy with jobs for all, and shake their heads. But many secretly approved.'''
year_published = 2025
clearnet = "https://ourdecline.com/decline/loss/noshame.htm"
