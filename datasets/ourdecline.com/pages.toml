["https://ourdecline.com/feedback/fdbk2011.htm"]
title = "Response in 2011 to 'A Study Of Our Decline'"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2011"
full_description = '''Eat fat, get slim — Thank you for posting Eat fat, get slim. I've only discoverd your site today through a low-carb bulletin board online. I've read a lot of diet books in the past 6 years and none put it quite as simply as this book. And to think of all the money I've wasted over the years trying to find a diet for me, this diet. And you posted it for us to read freely! It's too bad the publishers stopped you from posting the book about exercise because i was looking forward to that. I look forward to reading the rest of the books on your site. A word of thanks — I just recently stumbled across this website and let me say, it is refreshing. There are not very many sites that focus on the truth, or even go into how our civilization is slowly becoming animals again. I don't really like it how people say it's limited to the United States or the West - because I'm sure as everyone knows that if the West falls, so does the east. The politically correct jargon has become global, and your articles clearly point this out. It disproves the Global Warming and overpopulation myths and speaks out against the Feminist and homosexual agenda. I have found myself alienated for daring to suggest that said theories and agendas are incorrect and inhumane. The result of doing so has lead me to be called "one-sided", "ignorant", and naive. In Canada, we are one of the countries to fall hook, line, and sinker for hateful ideologies and we have, so far, lost our sense of nationalism and pride. Just like our neighbour to the south, we too are becoming stupid and silly. Not one person dares to have any individualism or thoughts of their own, and instead absorb misinformation and treat it as the truth. An example: My history class. It isn't so much a history class than it is a victimhood class. It only focuses on the "hardships" of women, and how they weren't "treated as people". During a debate I spoke up about this issue, and was promptly called a sufragette, even though I am strongly opposed to feminism and my opinions never implied I was for that ideology. My teacher - a female, of course - tends to go on and on about this alleged victimhood and continues to talk about this lie so flawlessly, I begin to doubt whether or not she actually thinks she's lying. This isn't the first or last instance, either. My drama teacher is a LGBT fanatic, going as far as to suggest ludicrous statistics such as: "10% of people are straight, the other 10% are gay, and the rest are bisexual". I am not sure where she got that ludicrous attempt at science, but either way it left me flabbergasted. My teachers last year were also LGBT and feminist supporters and made it their life to continue to spread misinformation and indoctrinate us. I am in my last year of high school now, and frankly, I have learned nothing important. I am beginning to think that university is the same. As for the societal degeneration, I have noticed a lot on the Internet that young girls such as myself have gone from innocent individuals to completely insane and selfish. They continue to ruin art and literature with their filth, and have become so coddled that they do not think they are doing any wrong. The emergance and acceptance of fetishes such as paedophilia, BDSM, incest, bestiality, and these anime and furry cultures have finally placed the final nail in the coffin. This isn't limited to the U.S. ( as some ignorantly believe), but this is a worldwide occurence. The decay of disclipline and the acceptance of mediocrity and mentally disturbed individuals have truly proved that the younger generations have no future. It is truly a shame how the Internet has given us a lot, but has taken away so much. I believe that the Internet has retarded our thinking and critical processes and makes learning temporary and difficult. After all, political correctedness rules the Internet. How many people of the newer generations can go without a day without their phones? They do not read, but if they do, it is that "manga" garbage. They do not create "art", but disgusting pornography for their sick fetishes. Solutions for this are generally impossible. As the younger generations become more depraved and fewer in number, we cannot depend on them to continue the legacy of humanity. As soon as the planet hits the massive depopulation trend, this problem will become even worse. It's hard to provide for a civilization when an extremely small chunk of it is young, an even smaller part decent, and an even smaller part intelligent and displaying some form of normalcy.'''
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/feedback/fdbk2011.htm"
tags = ["decline", "public", "response", "responses", "study"]
language = "en"
internal-references = ["none"]
external-references = ["none"]

["https://ourdecline.com/feedback/index.htm"]
title = "Public response to 'A Study Of Our Decline' (07-Mar-19)"
description = "The response to the theory of civilisation, with an invitation to add your response (07-Mar-19)"
full_description = '''This study not only advances human understanding by revealing the human condition and the nature of civilization, but is crucial to everybody for it reveals the senile condition hence the inevitable grim future of our society. Thus, everybody should be made aware of my explanation. If my theory is flawed, then it is equally important that the flaw be pointed out, so people are not misled by my theory. However, in over a decade the only exception to the silence by Churches, Government, Schools, Journalists, Universities, et al, has been the occasional bluster —"you are wrong" — or innuendo — "you should study more." No-one has pointed out any mistakes in my presumptions, or any error in my logic, whereas my work highlights the failures in the presumptions of the community — no-one knows what civilisation is, or what a community is or how understanding works; as well as flaws in the logic of communal thinking — most people do not know how to recognise right from wrong, and no-one realises the significance of this failure that most people are insane! Lunatics cannot accept any truth that contradicts their fears and fancies because they are slaves to their fears and fancies. Citizens can no more accept that their civilisation is senile than they can speak plainly. Hence the 'silence'. Western Civilisation is now a Universal State — a mass of insane humanity who can do nothing sensible — so being ignored is fortunate for my well-being as my work is full of unpopular truths, which our senile community can only respond to by either ignoring or persecuting the author. As there is no other sane community, Humanity is sinking into the next Dark Age, which my work will have to survive if it is ever to be considered by a sensible community: a remote possibility. Thus, to give myself some reward for clarifying centuries of traditional confusion about the nature of philosophy, I announced (2013) that I must be the First Philosopher.'''
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/feedback/index.htm"
tags = ["civilisation", "response", "silence", "theory"]
language = "en"
internal-references = ["none"]
external-references = ["none"]

["https://ourdecline.com/feedback/fdbk2004.htm"]
title = "Response in 2004 to 'A Study Of Our Decline'"
description = "E-mails responding to the theory of civilisation 'A Study Of Our Decline' in the year 2004"
full_description = '''Greetings from the U.S.A. I would like to thank you for putting on-line such a valuable and thorough resource. The book, "Clear Thinking", which you put online, has been a big help to me in the last year. Even more valuable than these classics which you have so generously put online are your original articles, which serve a dual purpose for me: in the first place, you articulate so well many things that many people might think, or at least might approach in their mental meanderings, and secondly, you put the classic works in their proper contexts. Everyday that I spend in the University simply obviates the validity of what you maintain. Good stuff! Thanks. Excellent work! Keep up the brilliant work, you have very elequently articulated the way I would describe our civilization today. You have no idea how much better I feel knowing that I am not alone or insane, someone out there really is aware of the truth. Thank you very much for creating this site and all the research you have done. I will be sharing your site with anyone & everyone. Our civilization is very ill, and needs our help and other people I think, inherently know it, but need a push in the right direction. Again thank you & God bless. This study is a God-send. It defines all the feelings that I have when it comes to our declining society that I haven't been able to define myself. It is depressing to see where we our headed but understanding the influences around us will empower us to provide our children with better tools to defend themselves from this decline. My sincerest gratitude to the author(s) of this study. It is truly brilliant. RE:Education In America — You work is excellent and right on the mark. I have two young children in school in the USA. I am frustrated that as a general rule teachers who are not responsible for "language arts" instruction will not correct my daughters' mistakes in punctuation and grammar. Even the "language arts" instructors are reluctant to do so. The response I have received when addressing that failure is that such correction will inhibit the children from writing because their self-esteem will be damaged. What a load of bull! As a consequence, it is only through my personal efforts (I insist my daughters allow me to review their papers before they turn them in) that my children are making any progress at all in those vital areas. In addition, as an employer I am constantly appalled by the inability of job applicants with secondary school educations to be able to put together a single coherent and error free sentence! This is, of course, a direct result of our present education system.'''
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/feedback/fdbk2004.htm"
tags = ["america", "arguments", "atkinson", "communal", "courage", "decline", "education", "liberty", "life", "lucid"]
