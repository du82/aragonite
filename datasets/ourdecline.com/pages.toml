["https://ourdecline.com/smartboard/shop/tilleyaa/index.htm"]
title = "Beginning of modern English prose"
description = "The Essay and the beginning of modern English prose by A.A. Tilley about the rise of English literature"
full_description = "Introduction PERHAPS the most important literary achievement that falls within the period covered by this volume is the creation of a prose style, which, in structure if not in vocabulary, is essentially the same as that of today. Caroline prose, the prose of Milton and Taylor, of Browne and Clarendon, had produced, in the hands of genius, some of the noblest passages in our literature. But, at the restoration, men began to feel the need of an instrument upon which the everyday performer might play — an instrument suited to an age of reason, possessing, before all things, the homely virtues of simplicity, correctness, lucidity and precision. These qualities, indeed, were not unknown to English prose before the restoration. They are to be found in private letters, not meant for the public eye. Above all, they are to be found in the writings of the veteran Hobbes, who, like Bacon and Ben Jonson, with both of whom he had literary relations, disdained all superfluity of ornament, and was content to make his prose a terse and pregnant expression of a clear and vigorous intellect. But even Hobbes is by no means free from the besetting sins of the older prose — careless construction and trailing relative clauses. Demand for Simplicity and Clearness The new prose was the work of a multiplicity of causes, all more or less reflecting the temper of the age. One of these was the growing interest in science, and the insistence of the new Royal Society on the need of a clear and plain style for scientific exposition. So writes Sprat, the first historian of the Royal Society. Almost at the same time, in December 1664, his colleagues gave effect to their views by appointing a committee for the improvement of the English language, which included, besides himself, Waller, Dryden and Evelyn. (1) Doubtless, it was out of this committee that the idea arose of founding an English academy for the 'improvement of speaking and writing' on the model of the French one. This idea was discussed at three or four meetings held at Gray's inn, where, in addition to the above, Cowley and the duke of Buckingham, also members of the Royal Society, were present. But, in consequence of the plague and 'other circumstances intervening,' the plan 'came to nothing.' (2)"
author = "A.A. Tilley"
year_published = 2025
clearnet = "https://ourdecline.com/smartboard/shop/tilleyaa/index.htm"
