["https://ourdecline.com/cooray/mabo/chap15.htm"]
title = "Australian White Settlement In Perspective (1995)"
description = "A clear perspective of white settlement in Australia, by Dr Mark Cooray (1995)"
full_description = "It is fashionable in certain quarters to argue that white settlement devastated a utopian Aboriginal society and replaced it with two centuries of racism, murder, oppression and neglect. Those who make such arguments almost always present a sanitised version of traditional Aboriginal society; fail to acknowledge the great developments of white settlement; and judge the past by the standards of the present. There was nothing utopian about traditional Aboriginal society, which was characterised by tribal warfare, violent punishments, sexism, superstition, and famine. The Aboriginals were essentially a stone age society, failing during a period of 50,000 years to develop any form of writing, agriculture or wheeled transport. White settlement brought to Australia all the advantages of one of the greatest civilisations in history: democracy, law, philosophy, art, literature, science, technology, agriculture and music. All these factors have been developed over 200 years to produce a nation which is the envy of the world. The distinguished historian Paul Johnson wrote: At the same time it cannot be denied that many Aborigines suffered severely because of white settlement. But it is not acceptable or intellectually honest to judge the actions of the past by the standards of the present. The White settlement of Australia occurred only a few months before the French Revolution, which was, of course, characterised by the bloody murder of hundreds of people simply because of their social status. That example illustrates the historical epoch in which the white settlement of Australia occurred, The pursuit of political policy by violence was universally accepted. And that is not to suggest that the white settlers of Australia set out to murder every Aboriginal. The evidence does not support such a conclusion, except in isolated cases. Moreover, much Aboriginal suffering was the result of unintended consequences of white settlement, such as alcoholism and disease. There are four main benefits of white settlement. Firstly, the white people have not only augmented, but actually replaced most of the indigenous foods. Secondly, the coming of the white settlers had done away with the periods of starvation in a land prone to droughts. Thirdly, the white authorities have broken down the geographical barriers between the lands of local groups. For the very first time in Aboriginal history, black people could wander about freely in Australia, without any danger of being killed when they crossed any sacrosanct local group borders. Fourthly, some inhuman and brutal customs have been abolished."
author = "LJM Cooray"
year_published = 2025
clearnet = "https://ourdecline.com/cooray/mabo/chap15.htm"
