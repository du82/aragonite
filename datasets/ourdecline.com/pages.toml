["https://ourdecline.com/feedback/fdbk2006.htm"]
title = "Response to 'A Study Of Our Decline' (2006)"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2006."
full_description = '''Very Profound —I found your web site and find it very enlightening. I plan on studing it further and hope to be able to master its content. Thank you for providing the truth to a world which has become barren and afraid of it. Thank you for making it so clear, consized. It is frightening - but seems to be true (which is even more frightening) I've been thinking on this cultural decay-topic for some time, came up with some ideas, but kept saying no to my own conclusions, till now, when like R.W. Emerson said: "In every work of genius we recognize our own rejected thoughts: they come back to us with a certain alienated majesty" (the genious being your essay) Scary to see that there is not much to do but to build a small fortress around me and my family to protect them - temporarily only , until we all are forced to go back to the cultural level of our invaders — all in the name of equality. Too bad equality means the least common denominator, not the increasing of standards.... Invaders are breaking into my castle as we speak... shall I enjoy my last glass of wine before they reach my quarters and hang me... ? Or shall I cry out the truth — just to be hung by my own neighbors in the name of tolerance? Ok, i go, get the wine - and my grandfather's sword... I will use both - not that it would make any difference, but just for me. Like a wounded lyon facing the hunters chasing him: I know. They are a mob, so they won't know my reasons — but their leaders will — so hope it will frighten them just a bit. Well, I've read almost everything on your site. I appreciate the service you've done the community by making such a wealth of knowledge available. I've been accused before of being overly wordy: which I wasn't aware was actually a legitimate crime against society until I read your page on language. I've decided that your explanation of why clear, efficient expression is essential in language makes sense and have committed myself to more brevity. I've always felt that my wordiness was necessary to being utterly clear. That is not the case though, right? When four words will do as well as ten, stick with the four—seems to be your suggestion.'''
author = "Philip Atkinson"
year_published = 2025
