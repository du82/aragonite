["https://ourdecline.com/whatis/gunlaws.htm"]
title = "The anti-social effect of banning guns (2003)"
description = "Media article explaining the anti-social effect of laws forbidding citizens from owning guns (31/5/2003)"
full_description = "GUN control is one of those things, like motherhood, that most people agree with. Most people in cities, anyway. They believe that if you reduce the number of guns in a society, the amount of armed crime will shrink. This is a truly beautiful idea. Unfortunately, it is wrong. US economist John Lott is the author of a 1998 book called More Guns, Less Crime (University of Chicago Press). He had hardly ever touched a gun before being given a class to teach on the subject of gun control. Reading through the literature, he discovered the arguments for gun control were not supported by the evidence. So he looked at the experience of each of the 3000 US counties where a law permitting any law-abiding citizen to carry a concealed handgun had been introduced or withdrawn. Then he looked to see if violent crime had gone up or down afterwards. What Lott found was that the right to carry concealed handguns reduces the general level of murder, rape, robbery and other violent crime. Many more such crimes are stopped with guns than are committed with them. Those who benefit most are the relatively weak: the old and women. In several public schools, massacres had been averted by staff and other adults with their own guns, before the police arrived. Lott concluded his book by asking: Will allowing law-abiding citizens to carry concealed handguns save lives? The answer is yes, it will. He went out and brought himself a 9mm Ruger. Lott is now a senior research scholar at Yale Law School. Interviewed in Reason magazine in 2000, he noted the hypocrisy of political leaders such as Chicago Mayor Richard Daley who argue that there's no benefit from owning guns. Yet, says Lott, he has a whole set of full-time (armed) bodyguards following him every place he goes. He won't even think about visiting some of the more dangerous areas in Chicago without his bodyguards. But there are poor people who live in those areas, who live there at great risk, and he's not willing to let them own guns to protect themselves."
