["https://ourdecline.com/prose.htm"]
title = "The Lesson of Literature"
description = "Why the history of English literature is the diary of the rise then decline of English speaking civilisation (25/2/2013)"
full_description = "Why the history of English literature is the diary of the rise, then decline, of English-speaking civilisation. Literature is the Record of an Understanding As use of language is the exercise of understanding, the literature of a community is the record of the nature of that community's understanding at the time. So the rise, then decline of the English-speaking public's understanding—which is the rise, then decline of English-speaking civilisation—is reflected by the history of English literature. Literature Reveals the Start of a Civilisation Chaucer is recognised as the father of the English language, which became a national tongue in the latter part of the 14th century, marking the beginning of English civilisation. The gradual rise of the community's ability to think clearly is demonstrated by the improvement from the awkward verse of Chaucer, to the brilliant prose of such writers as Edmund Burke, Edward Gibbon, Locke and Hume published in the eighteenth century. (Also see The Essay And the Beginning of Modern English Prose by A.A. Tilley.) Literature Reveals the Golden Age of A Civilisation The Concise Oxford English Dictionary (1938) defines Augustan as: 'connected with the reign of Augustus Caesar; best period of Latin literature'; which reveals that the Golden Age of Ancient Roman civilisation was the age of Augustus. But the Oxford English Dictionary also states that Augustan may be applied to 'any national literature', and the Augustan period of English literature was 1660–1780, which means this period was the Golden Age of English civilisation. English Literature Now Declining The decline of English civilisation is confirmed by the subsequent deterioration of its literature to the present day. W. H. Hudson stated in English Literature of the XIXth Century: Modern Use of English Condemned The use of English in contemporary works stands condemned by the textbooks of the twentieth century that set down the correct use of English needed for clear understanding. These works include Plain Words (1948) and The Complete Plain Words (1954) by Sir Ernest Gower, and Modern English Usage (1926) and The King's English (1908) by Fowler. The growing vagueness creeping into modern expression was also condemned by George Orwell in Politics and the English Language (1946). The very existence of these works show that people in the twentieth century were concerned that the popular use of language was becoming less precise and harder to understand. And this group included England's department of the Treasury, who commissioned Sir Ernest Gower to write books meant to repair the poor use of English by their own staff. Fowler revealed in 'Modern English Usage' that the use of words with no sensible meaning was becoming popular, especially with the young!"
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/prose.htm"
tags = ["atkinson", "lesson", "literature"]
language = "en"
internal-references = ["none"]
external-references = ["none"]

["https://ourdecline.com/personal/chap2.htm"]
title = "Management by self-seekers"
description = "My experiences suggested that modern (circa 1980) Australian managers were concerned not about efficiency but keeping their jobs (9/1/2001)"
full_description = "My experiences at work (circa 1980), which suggested Australian managers were concerned not about efficiency but themselves. The Management Myth When I entered the work force at eighteen I believed that managers were unselfish bold leaders, concerned solely with their duty and their charges; who were selected from the most able, having won selection by repeated demonstrations of superior ability; with the position of privilege they enjoyed reflecting their onerous responsibility. Thirty years of work experience has completely reversed this opinion, convincing me that modern executives are cowardly, self-serving, popularity seekers desiring only to further themselves at any price, with the more senior the rank the less competent the occupant. Ability Irrelevant My first lesson was that betraying an inability to perform your delegated duties at a junior level is no bar to promotion to a more senior position of trust. Demonstrated Incompetence Commercial computerisation was in its infancy when I started work in the computer department of Queensland's Brisbane City Council (1972). Computer programming was an open challenge, with the results reflecting the ability of the programmers, among whom was an officer who was as short in modesty as he was in talent. It fell upon his shoulders to resolve a sudden failure in the Regulated Parking system. This application was a source of revenue for the Council, which no longer flowed. As this condition continued for some days, despite his best efforts, he was forced to hand over the problem to another. Within five minutes it was resolved. Wins Reward This public show of incompetence was viewed with delight by the officer's peers. They all felt that this meant one less in the race for promotion, but this was not the case. It was explained by the manager that this officer was close to completing a university degree, and such a qualification would automatically give him preference over any other applicant for promotion. Though unstated, it was implicit that this worker's demonstrated inability to carry out his job was naught compared to the possession of a degree."
year_published = 2025
clearnet = "https://ourdecline.com/personal/chap2.htm"
