["https://ourdecline.com/senility.htm"]
title = "The Difference Between Communal Insanity & Senility"
description = "The difference between communal insanity and senility demonstrated by a simple example (September 2007)"
full_description = "The difference between insanity and senility is the difference between the German nation in the 1930s under the rule of Hitler, when it behaved as a lunatic and the German nation now (circa 2007). It is vigour: a lunatic has energy and purpose, whereas a senile understanding has neither. During Hitlerʼs reign the German nation attempted to conquer the world, but now the German nation is unable to resist being invaded by other nations. This difference in the two states of the German nation is the result of the corruption of German tradition that has occurred since the 1930s. A Definition of Communal Senility Hence communal senility may be defined as the inability to resist unarmed invaders."
