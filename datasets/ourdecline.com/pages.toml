["https://ourdecline.com/aginatur/iceage.htm"]
title = "The Ice Age Cometh by Andrew Kenny (14/7/2002)"
full_description = '''A new ice age is due now, but you wont hear it from the green groups, who like to play on Western guilt about consumerism to make us believe in global warming. THE Earth's climate is changing in a dramatic way, with immense danger for mankind and the natural systems that sustain it. This was the frightening message broadcast to us by environmentalists in the recent past. Here are some of their prophecies. The scare about global cooling was always the same: unprecedented low temperatures; the coldest weather recorded; unusual floods and storms; a rapid shift in the world's climate towards an icy apocalypse. But now, the scare is about global warming. To convert from the first scare to the second, all you have to do is substitute "the coldest weather recorded" with "the warmest weather recorded". Replace the icicles hanging from oranges in California with melting glaciers on Mt Everest, and the shivering armadillos with sweltering polar bears. We were going to freeze but now we are going to fry. What facts have emerged to make this dramatic reversal? Well, none really. The most reliable measurements show no change whatsoever in global temperatures in the past 20 years. What has changed is the perception that global warming makes a better scare than the coming ice age. A good environmental scare needs two ingredients. The first is impending catastrophe. The second is a suitable culprit to blame. In the second case, the ice age fails and global warming is gloriously successful. It is not the destruction itself of Sodom and Gomorrah that makes the story so appealing but the fact that they were destroyed because they were so sinful. One of the real threats to mankind is the danger of collision with a large asteroid. It has happened in the past with catastrophic effect, and it will probably happen again. But there are no conferences, resolutions, gatherings, protests and newspaper headlines about asteroid impacts. The reason is that you cannot find anyone suitable to blame for them. If you could persuade people that President Bush or the oil companies were responsible for the asteroids, I guarantee there would be a billion-dollar campaign to "raise awareness" about the asteroid danger, with sonorous editorials in all the papers.'''
author = "Andrew Kenny"
year_published = 2025
clearnet = "https://ourdecline.com/aginatur/iceage.htm"
