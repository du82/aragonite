["https://ourdecline.com/moral2/moral6.htm"]
title = "How Infancy Decides Morality"
description = "How infancy decides whether a person becomes moral, by revering 'us', or immoral, by revering 'me' (04-May-20)"
full_description = 'A Choice For Life The decision to be selfish or unselfish is not just a choice of the moment but is a fundamental part of character, as it is one of the first, if not the first, value that is formed by the developing mind of a baby. Nature delivers the infant with an incomplete set of values along with the ability to request succour. The history of the results of infantile demands insensibly teaches the first lessons of life, which is what is most important "me" or "us". And once set this becomes the parent for all subsequent decisions about right and wrong, which is why character is set for life by 3 years of age. Inevitable Results Of An Undisciplined Upbringing Adults who allow their basic desire to pamper children dominate the way they rear their offspring, such as by feeding on demand, are placing the baby in control and insensibly teaching: — this is Selfishness: the pursuit of self-indulgence won by feigned emotional responses to others, regardless of the inevitable denial of truth; restrained only by convenience, which is immoral behaviour. Inevitable Results Of A Disciplined Upbringing Whereas if the child learns it has to adapt its wishes to meet the demands of the parents, such as four-hourly feeding, then the lessons taught are: — all which must insensibly teach reverence for the community and its beliefs, which is Unselfishness: the pursuit of duty, showing respect, being obedient and upholding right over wrong (justice), all founded upon truth, which is moral behaviour. And once these values are learnt they become the parent of all other values and so control the understanding of the future adult. The subsequent personality must be either be selfish or unselfish, depending upon this early education. We All Like To Be Thought Unselfish At a more mature stage in life many selfish people may wish to be thought unselfish, but this springs from self-seeking motives and is part of being self-centred; for well before the age of reason has been reached, this question has been irrevocably decided by childhood.'
year_published = 2025
