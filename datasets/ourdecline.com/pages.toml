["https://ourdecline.com/feedback/fdbk2010.htm"]
title = "Response in 2010 to 'A Study Of Our Decline'"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2010"
full_description = '''Kudos — So glad I stumbled onto your site. I — a 1952 vintage — have reached many of the same conclusions you have and it would appear we have had pretty similar life experiences. Thanks so much for taking the time to write... It has encouraged me no end! Novelization — Dear Mr. Atkinson, I have been reading your website for about a year now, and I love the ideas- but I've tried to share the site with others, and they don't seem interested, so I've decided to try to encapsulate your theories in a novel/graphic novel. The basic plot is that two characters are traveling through a land and each city or region demonstrates one point of your theory. I was wondering where you would start with this, and if you had any suggestions about the organization of it. Brilliant! — Dear Mr. Atkinson, I discovered your writings while looking up crime statistics as related to Black on White crime. I would like to thank you for confirming some of my observations, as it relates to the state of our western civilization. May I say that you are both brilliant and fearless in your observations? Indeed you are both. Such is the state of political correctness here in the U.S., that I am finding it more and more difficult to express my opinions in "polite company" lest I be branded as some sort of "old crank", or worse yet, a racist, which is literally a crime worse than murder here in the U.S. I am 60 years old and recently quit my job with a large multi-national corporation, simply because I found it impossible to function within the framework of insanity that I had to deal with. Your philosophy I find, exactly coincides with my own, although I lack your brilliant ability to state it in such a coherent manner. Your breadth of research and grasp of the nature of our present situation is truly remarkable. I will continue to explore your work with great interest. Hello Phillip, I have been reading your book online, I'm very happy to find this kind of information, as it is something I have been thinking about and that you talk in a very clear way. I can understand what is happening in our society today, what I have noticed mainly is that most people are not willing to take responsibility of their actions, they are not willing to be honest, to tell the truth to themselves and this is continuously taking us in a decline. What you say about morality is totally true, there's no a clear understanding of what morality is, why is it good for us as a society and why it is so important. Our society values are mostly rotten and now have been changing the new generations, not leaving a place for changing the evolution of communities to a positive and altruistic unselfish nature. Anyway, as I have concluded some of the same things you are writing, I think that is not as negative to say that there's no way back. The way is a return to morality which comes from observation, observation of ones own nature and the laws of nature which apply in each one of us. Understanding by the own experience how wisdom works and why is good for us. I found this answer in this short article which I invite you to read: http://www.dhamma.org/en/art.shtml So I think there's a hope, and is based in morality, control over the mind and wisdom... all helping to eradicate selfishness from the core. I'm talking you from my own experience. Thanks for sharing your observations in this amazing book.'''
