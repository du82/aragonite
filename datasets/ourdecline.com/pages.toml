["https://ourdecline.com/decline/example/hansonp.htm"]
title = "Paulin Hanson's maiden speech (10/9/1996)"
description = "Pauline Hanson's maiden speech delivered in the federal Australian parliament on 10th September, 1996"
full_description = "Mr Acting Speaker, in making my first speech in this place, I congratulate you on your election and wish to say how proud I am to be here as the Independent member for Oxley. I come here not as a polished politician but as a woman who has had her fair share of life's knocks. My view on issues is based on commonsense, and my experience as a mother of four children, as a sole parent, and as a business woman running a fish and chip shop. I won the seat of Oxley largely on an issue that has resulted in me being called a racist. That issue related to my comment that aboriginals received more benefit than non-Aboriginals. We now have a situation where a type of reverse racism is applied to mainstream Australians by those who promote political correctness and those who control the various taxpayer funded 'industries' that flourish in our society servicing Aboriginals, multiculturalists and a host of other minority groups. In response to my call for equality for all Australians, the most noisy criticism came from the fat cats, bureaucrats and the do-gooders. They screamed the loudest because they stand to lose the most — their power, money and position, all funded by ordinary Australian taxpayers. Present governments are encouraging separatism in Australia by providing opportunities, land, moneys and facilities available only to Aboriginals. Along with millions of Australians, I am fed up to the back teeth with the inequalities that are being promoted by the government and paid for by the taxpayer under the assumption that Aboriginals are the most disadvantaged people in Australia. I do not believe that the colour of one's skin determines whether you are disadvantaged. As Paul Hasluck said in parliament in October 1956 when he was Minister for Territories: Hasluck's vision was of a single society in which racial emphases were rejected and social issues addressed. I totally agree with him, and so would the majority of Australians. But, remember, when he gave his speech he was talking about the privileges that white Australians were seen to be enjoying over Aboriginals. Today, 41 years later, I talk about the exact opposite — the privileges Aboriginals enjoy over other Australians. I have done research on benefits available only to Aboriginals and challenge anyone to tell me how Aboriginals are disadvantaged when they can obtain three and five per cent housing loans denied to non-Aboriginals."
year_published = 2025
clearnet = "https://ourdecline.com/decline/example/hansonp.htm"
tags = ["10/9/1996", "aboriginal", "aboriginals", "act", "arthur", "atsic", "australian", "calwell", "chip", "delivered"]
