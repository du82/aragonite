["https://ourdecline.com/decline/example/rot.htm"]
title = "Social demolition won by political correctness"
description = "The impact of political correctness imposed upon a station in Australia (22/7/2000)"
full_description = "Something bad happened here. There are two dead horses, still alive with the stink of decay, down in the mechanics' inspection pit. Just outside the workshop, a complete horse skeleton rests neatly on its side. At a bore, 500m from the homestead, the bones of cattle lie scattered on the ground. Some say up to 2000 head of cattle and 100 horses might have perished on Ngulupi station, just inside the West Australian border in the Tanami Desert. One person claims to have seen dead cattle lying along the fence. They'd tried to push across to Mongrel Downs on the Northern Territory side. Aboriginal trust land is coloured yellow on the maps, sometimes adding to the impression that it is nothing but useless desert. Yet the Tanami gets good rains and even now, late in July, the Ngulupi paddocks are green. It is remote land, not bad land. Two or three years back, Ngulupi was finally abandoned by its Aboriginal owners. The homestead, built by Paliottine missionaries 30 years ago from locally quarried rocks, is now home to bats, crows and snakes. It is trashed. So are the four or five stockmen's homes in the surrounding village, and the school. Two brand new windmills lie on their sides, never erected. Perkins and Ford diesel generators — big enough to power three cattle stations — stand wasted in their sheds. The walk-in cool room and freezer have new power units attached to them, but they lie idle, deteriorating. The stockyards, with lights to work the cattle by night, still stand, because they would never fall. They were fashioned from the old north-south rail line. A former manager and his Aboriginal staff went to Pine Creek, nearly 1000km away, to unbolt the track. What happened to the horses and cattle can be surmised. These were neither brumbies nor scrubbers that roam wild and find their own water, but station animals that hung near the bores they knew. The cattle knew they were near water, so they waited. But the bore wasn't working, because no one was looking after it."
year_published = 2025
