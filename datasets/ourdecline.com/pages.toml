["https://ourdecline.com/impact/lunatics.htm"]
title = "Environmentalism: The new superstition"
description = "The inspiration and nature of the dogma of environmentalism, which is the modern version of fear of angering the Gods. (08-Feb-21)"
full_description = "Most Citizens Now Lunatics The replacement of mainly unselfish with selfish people has changed the character of the community from polite and sane, to rude and insane: most citizens are now lunatics who are: With A New Religion And A New God: The Environment Even though selfish citizens only worship self, they know only that they must obey their fears and fancies. This lunacy, which is endemic throughout the towns and cities of Western Civilization, has resulted in a new religion — the worship of a god called 'The Environment', which is the notion of reality allowed by an understanding corrupted by their shared fears and fancies. They fear the planet [self] is being destroyed by people doing what they, the environmentalists, do not like, so they fancy the planet [self] can only be saved by forcing people to do what they, the environmentalists, do like. Hence environmentalists are very important people whose every-day activities are crucial to saving the planet, which puts them above the law for they cannot allow legal trivia to hinder their efforts to save the planet, and all those who oppose them must be enemies of the planet. Universal Dogma of Environmentalists: Their Tyranny In the contemporary version of the fear of angering the Gods, to avoid the impending doom of Global Catastrophe Environmentalists demand:"
