["https://ourdecline.com/signs/tyranny.htm"]
title = "Tyranny demanded by complaining citizens (2002)"
description = "Newspaper article revealing the explosion of rules and regulations demanded by complaining citizens August 2002."
full_description = '''YOUR home is your castle —or is it? One thing's for sure, it is under attack from a growing list of rules and regulations. A bombardment of government "no no's", with hefty penalties to ensure adherence, is changing the way we live. On almost every front, home-owners are seeing their personal freedoms eroded for the common good. In Brisbane, backyard burning is out; knocking down trees in certain areas is out; and advertising your car on the street is out. Other planned restrictions include a ban on new open fire places and hot-water systems, and a crackdown on jetties, pontoons and swimming pools from the shores of the Brisbane River's upper reaches. University of Queensland local government specialist Doug Tucker said the daunting array of restrictions was a reflection of our increasingly urban society. Mr Tucker said most rules were in place for a legitimate reason, usually to stop residents ruining the quality of life of others in the neighbourhood. Local Government Association of Queensland executive director Greg Hallam said councils were only reacting to community pressures. Mr Hallam said the issues that really irked the community were those that impacted on amenity, such as noise and air quality. But Mr Hallam conceded it was not always an easy task. "One person's treasure is another person's poison," he said. Mr Hallam said councils were limited in the powers they had, and many of the laws administered by local authorities, were in fact introduced by the state. Brisbane Liberal councillor Carol Cashman said it was the fines linked to rules and regulations which most upset the community. "I think there could be a case for more warnings before fines are issued," she said. Councillor Cashman said as Brisbane's density increased so would the number of complaints, particularly in relation to noise.'''
author = "Lachlan Heywood"
