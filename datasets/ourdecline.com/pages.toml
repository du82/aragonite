external-references = ["none"]

["https://ourdecline.com/decline/badmum.htm"]
title = "Typical modern mother: a child worshipper"
description = "A typical example of a modern mother, bullying her spouse while revering and indulging her off-spring (March 2003)"
full_description = "On May 7th 1999, Irene gave birth to a girl. This was after more than 10 years of marriage and a reverse of previous determination to pursue a career. The baby was immediately installed as the mistress of the house by the doting parents, who indulged the infant's every whim. The entire household became dominated by the needs of the baby; shopping could only be done when the baby was awake and fed; there was to be silence when the child was asleep and no loud distractions during feeding; travelling in the car could only be conducted during the time that baby was asleep; and this with some effort. The child could not be placed into a hot car, the engine had to be started and the air-conditioner run some moments before the baby was strapped into her special crib on the back seat. The once neat and tidy home became covered in toys; a pile was maintained in the lounge that the child continuously spread throughout its realm without restriction. Discipline was rarely, if ever, employed. Whatever the offspring did was reason for praise and encouragement; whether she banged her spoon on her plate and interrupted adults in conversation, or dragged a plastic chair over the floorboards, generating sufficient noise to interfere with guests viewing television, all were reasons for maternal joy. This was emphasised by the choice of toys, which included a device that played a loud phrase of pop music whenever it was touched. And the baby often touched the toy, which the mother never removed from the child's reach, regardless who was visiting the house. Not even the remote control for the television was placed out of the child's reach. This lack of restraint was naturally extended to the homes the new parent visited. If the new daughter opened a cupboard and pulled out its contents, this was a demonstration of initiative. If she grabbed her grandmother's wool while she was knitting, this was to be seen as showing an intelligent interest. And when the grandfather separated the infant from the wool, this was seen as an assault upon the precious child, and reason to berate the aged parent."
author = "Philip Atkinson"
year_published = 2025
