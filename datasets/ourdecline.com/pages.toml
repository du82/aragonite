["https://ourdecline.com/decline/example/medcheat.htm"]
title = "How The Media Cheats (2004)"
description = "Description of the methods used by the media upon Bill Sizemore to suppress his views (April 2004). Cited by 'A Study of Our Decline' by P Atkinson"
full_description = "Have you ever seen or heard a conservative interviewed on a television or radio news show and thought to yourself: That was pretty weak. Surely, he could have found something better to say than that. I confess that I used to make remarks like that myself, but I am not so quick to do so anymore. I have learned from experience that often, the real reason our side sounds so weak or our arguments have no real punch, has nothing to do with who's doing the speaking for our side. The real problem is, the game is rigged. Over the years, I have done literally thousands of interviews with newspaper, television, and radio reporters. I want to communicate, based on my personal experience, how the system actually works, or more specifically, how the game is fixed in favor of the other side. You see, the quote you heard on the nightly news or read in your morning newspaper was probably the weakest four-second statement the conservative made in an interview that probably lasted somewhere in the neighborhood of 15 minutes. During the course of that 15-minute interview, our guy probably reeled off some real zingers. It is quite likely that he or she even waxed eloquent at times. If you would have been there, you would have been proud. The problem is, it was all for naught. You see, the public rarely sees, hears, or reads the really good stuff that conservatives say. The good stuff all gets edited out before the story is published or broadcasted. Here's how it works: During the interview, our side makes its case, employing great passion and logic, explaining carefully all the merits of our position. Then, after the interview is concluded, the reporter heads back to the station or newsroom, where he or an editor reviews the interview and chooses which four-second to eight-second segment to actually use in the story. Because the ones choosing which quote will actually be used in the story tend to be liberals, the quotes representing our side of the story tend to be weak or mediocre. When you deal with the liberal media, you should know up front: They don't want our side to come across as reasonable or persuasive. That's not why they are conducting the interview. They are conducting the interview with the conservative, because they want to make it appear to the public that both sides were given the chance to make their case, but the conservatives just couldn't."
author = "Bill Sizemore"
year_published = 2025
clearnet = "https://ourdecline.com/decline/example/medcheat.htm"
