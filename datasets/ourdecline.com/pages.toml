["https://ourdecline.com/mltcult.htm"]
title = "Multiculturalism: its nature and origin"
description = "The nature and origin of multiculturalism, its hatred of truth, and its inevitable impact upon society (18/5/2017)"
full_description = "Implicit in this claim is that beliefs about good and bad are universal, which is untrue. Judgement about good-and-bad must reflect beliefs about right-and-wrong, which vary from culture to culture. For example, the following beliefs are held by different cultures, which consider them right so are Good But which are considered wrong so are judged as bad in Australia and are forbidden by Australian law. Hence there is no universal agreement on good and bad, and the cited belief is nonsense because it denies the existence of culture. Australian Law is Australian Culture The single set of values that reign in Australia is Australian culture, which is the law of the land, and anybody attempting to inflict opposing cultural values will suffer legal penalty; which means that to uphold law and order the values of other cultures must be denied. Indeed, Australian society does not only forbid practices that contravene Australian common law, but have extended Commonwealth statutes precisely to proscribe behaviour that has no impact upon ourselves, but which is considered unacceptable. Our multicultural regime has judged female excision as too awful to allow, even though it is practised by millions throughout the world and affects only those belonging to alien cultures. This prohibition is a clear admission that there are barbaric practices that cannot be allowed, which is a claim that there are people who practice barbarism, Barbarians, who must be resisted: a contradiction of their own Multicultural creed. Cultures Do Not Mix; They Clash The difference in understanding between cultures makes different cultures enemies, who will struggle to impose their wills upon each other. Western civilisation itself is made up of similar but different cultures who themselves have constantly strived to dominate one another, often through war. The inevitable impact of multiculturalism upon Australia, and all the other countries that adopt it, is cultural suicide. By allowing the people of different cultures to enter Australia, Australians are allowing their culture, which is their society, to be overrun by alien cultures (Barbarians)."
author = "Philip Atkinson"
year_published = 2025
