["https://ourdecline.com/law/vpo.htm"]
title = "Announcing another new law for Brisbane 'VPO'(August 2002)"
description = "Full page advertisement announcing another new law for the citizens of Brisbane, Australia, concerning the protection of certain vegetation  (August 2002)"
full_description = "In response to Brisbane residents rating a 'clean and green' city as one of our highest priorities, Brisbane City Council has introduced the Natural Assets Local Law (Interim) to protect vegetation on around 50,000 hectares of private and public land. The Local Law is effective from today and penalties do apply to landowners and businesses that remove or interfere with protected vegetation without approval from Council. This law will expand the area of protected vegetation across the city by 60 percent to cover more of our city's rarest bushland areas, wetlands, waterway corridors and even some trees in new suburbs. As part of Councils vision for a 'clean and green' city in 2010, this new Local Law will assist us—Council and the community working together— to protect our natural assets for future generations. With more people wanting to live in Brisbane, there is greater pressure on the city's natural areas for development. Since the introduction of Vegetation Protection Orders (VPO) by Council 11 years ago, VPOs have helped to reduce the rate of clearing across Brisbane by half. This was a significant improvement, but we can do better. We need stronger measures to protect our most valuable vegetation, so that future generations can enjoy the benefits we've come to expect from living in such a unique and beautiful city. This new Local Law will help us to protect vegetation and provide the critical steps required to achieve an ecologically sustainable Brisbane. Who will be affected and how? You may be affected if you own land near a river, waterway, or wetland, in a bushland area or in an Emerging Community Area (as designated under City Plan 2000). Landowners and/or occupiers with vegetation protected under the new Local Law will be required to consult with Council prior to clearing trees and other vegetation on their property, or face severe penalties. The Local Law applies from today. If you are unsure, check with Council before you interfere with vegetation. Local Laws to protect vegetation are not new and exist in most cities and states in Australia. Sydney introduced laws protecting vegetation more than 30 years ago and Melbourne 20 years ago."
