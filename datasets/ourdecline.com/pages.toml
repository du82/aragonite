["https://ourdecline.com/aids/hivexist/index.htm"]
title = "There is no HIV virus: Dr Papadopulos"
description = "Interview (1997) with Dr Eleni Papadopulos raising serious doubts about the existence of the retrovirus HIV"
full_description = '''Dr. Eleni Papadopulos is a biophysicist and leader of a group of HIV/AIDS scientists from Perth in Western Australia. Over the past decade and more she and her colleagues have published many scientific papers questioning the HIV/AIDS hypothesis. This interview by Christine Johnson looks at this work and especially her group's views on the AIDS virus itself. ELENI: No. In the papers published in Science by those two research groups, there is no proof of the isolation of a retrovirus from AIDS patients.(1,2) ELENI: I think the easiest way to begin is to ask the question, "What is a virus?". The answer is quite simple. A virus is microscopic particle that reproduces itself inside a cell... ELENI: They may but there's a very important difference. Bacteria are not obliged to replicate inside a cell. Viruses must. You see, what bacteria take from the cell, or from an inanimate source of food and energy, is all turned into the next generation of bacteria inside the bacterial cell itself. That's also how our own cells replicate. But viruses can't do that. The virus particle is really no more than a few proteins strung around a piece of RNA or DNA but without the machinery needed to replicate. ELENI: It has to get inside the cell. To do this the protective envelope of the viral particle fuses with the cell membrane and then the particle passes inside. Once inside, using the cellular metabolic machinery, the virus particle is disassembled. Then, using the same machinery, separate pieces of new virus are synthesised. Finally, all the viral components are put together and out come the new virus particles. ELENI: The virus either destroys the cell or in the case of retroviruses the virus particles have a more orderly exit by budding out of the cell membrane. But that's not what happens with HIV. Unlike retroviruses, HIV is said to destroy the cells. ELENI: To prove the existence of a virus you need to do three things. First culture cells and find a particle you think might be a virus. Obviously, at the very least, that particle should look like a virus. Second, you have to devise a method to get that particle on its own so you can take it to pieces and analyse precisely what makes it up. Then you need to prove the particle can make faithful copies of itself. In other words, that is can replicate.'''
author = "Christine Johnson"
year_published = 2025
clearnet = "https://ourdecline.com/aids/hivexist/index.htm"
tags = ["autumn", "christine", "continuum", "eleni", "interview", "johnson", "papadopulos-eleopulos", "virus"]
