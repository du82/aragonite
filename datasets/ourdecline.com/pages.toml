["https://ourdecline.com/person/index.htm"]
title = "Rewarding the worst, penalising the best"
description = "Why and how social decline rewards the worst, while penalising the best, citizens"
full_description = "Once The Worst Were Stigmatized When a community is waxing those individuals who indulge their desires at the cost of their duty, earn public odium. They become branded as cowards, liars, cheats, etc and suffer public persecution if not judicial penalty. Such people find themselves justly shunned and despised, if not imprisoned or executed, by their fellows. These unfortunates are able to enjoy the company of their fellows only by dissembling their true nature. But as long as they live, their inability to resist temptation will expose them to the constant threat of shame and disgrace; a danger that can only be minimised by avoiding social intercourse and the demands of ambition. Even when old age eventually calms their vices, the threat of social odium that would accompany public discovery of their history will compel them to remain social outcasts. Now The Best Are Stigmatized Whereas in a waning community the opposite is true. Those few citizens who refuse to collaborate in the destruction of their community by denying truth while embracing tyranny quickly discover they must adopt social exile if they are to avoid social stigma. If they cannot bring themselves to comply with the silly demands of their senile community such as becoming: —they will be stigmatized. The only defence against the risk of persecution or prosecution is withdrawal from the company of their peers and subsisting, if necessary, by a menial job. The Best Become Confused And Isolated Even when the sensible find others who share their doubts about the truth of particular popular beliefs, it is almost certain that this will be one of the few areas they can agree upon; for while the silly are united by their unrestrained feelings, which spawn popular hysteria, the sensible have no such bond. Indeed, an essential element for bonding is shared beliefs about right and wrong, which is now almost impossible to find among the sensible following the general discarding of the authority of the church. Hence, sensible citizens cannot refine their understanding by conversation with their sensible peers so can never be sure that they are not deluded in some way. Though they know their community is deluded they do not know how they should react to this, which leaves them confused and alone."
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/person/index.htm"
tags = ["atkinson", "best", "penalising", "rewarding", "worst"]
language = "en"
internal-references = ["none"]
external-references = ["none"]

["https://ourdecline.com/ozone/king.htm"]
title = "The Nonsense That is Ozone-Depletion"
description = "Why the banning of Chlorofluorocarbons is paranoid nonsense, by Ken Ring (2009)"
full_description = '''"Cancer threat as deadly UV rays build up" reported the New Zealand Herald on September 10th 2006. Referring to a "disturbing new study" the writer reported a finding that "increases in UV radiation over summer have occurred because of ozone depletion caused by pollution". Unfortunately, these claims are false on all counts. In order to simply understand the relationship between UV (sunshine), ozone and oxygen (air), think about what you see when you go to the beach. The order of things is: The boundary where the water hits the beach is called surf, and in the upper atmosphere, the boundary where the sunlight hits the air is termed the ozone layer, because in that region ozone is produced as a result of the UV acting on the oxygen, in other words where the sunlight hits the air. Just as the surf cannot in any way protect the land from the sea, ozone cannot 'protect' the air and our environment that is below it from UV. A result cannot be defined as a protector. To lament that ozone depletion is taking away "our protection" is the same as crying that surfers are wearing down the surf, and as the surf is all there is holding back the ocean, when the surf goes (due to human behavior) the water will flood over the land and destroy mankind. As with so many theories, threads are tied together to build a case. The case is then launched to the media to attract attention. The attention is then added to by 'further findings', 'disturbing new studies' and 'concerns'. The end result is the willing granting of research funds to research "the problem". If the Cancer word can be attached, so much the better for the case. The public will donate any amount of money for cancer research. It only wants to see the case for it spelled out in a conclusive-sounding way. The Case We do know that ozone exists. We know that there are two ozone depletion zones: over each of the Earth's poles. We know the depletion zone over Antarctic is bigger than that over the Arctic. We have found that CFCs [Chlorofluorocarbons] which are man-made substances commonly used in refrigeration and aerosol cans, contain chlorine. And we know that chlorine can destroy ozone.'''
author = "Ken Ring"
year_published = 2025
clearnet = "https://ourdecline.com/ozone/king.htm"
tags = ["depletion", "nonsense", "ozone", "ring"]
language = "en"
