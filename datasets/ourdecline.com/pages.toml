["https://ourdecline.com/feedback/fdbk2012.htm"]
title = "Response in 2012 to 'A Study Of Our Decline'"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2012"
full_description = '''You are extremely gifted I am but a lowly man of little importance to those of whom I live and work. I have chosen to be what I am. I am happy for that which I have chosen. Through my chosen position in life, I change people. My profession is a County Drug Court Field Officer. I help to supervise about 110 felon's who are addicts. I was born in 1951 in Ohio, U.S.A. I share a common background with your personal life and did not pursue a university degree for much the same reason as you. However, I have vast amounts of experience and am well read. Recently, I was given a task to assess our department in a recent survey conducted by our department supervisors. At the end of the assessment, I was asked what I thought our department needed to become better at what we do. My answer was, we had no moral component being taught to our clients. We needed moral and spiritual guidance to be taught, as well as drug treatment guidance, if we wanted any chance to change the character of our participants. Of course, I have been ignored. However, I believe in steady perseverance, which will lead to some acknowledgment, and I am arming myself with knowledge. This led me to you and your web page. My belief is that God lead me to you. I believe you ring of truth. I will continue to read and learn. Thank you, very interesting stuff on your site Hi Philip, Do you have a blog? I hope you do - your stuff is very interesting and applies to the UK too! Do you still write? Keep reading you Year after year I keep reading you. I can see that little by little many get to see the same truth that you saw decades ago. But the pace is so slow that it can't reverse the trend. Will in the end a squad of soldiers defend our civilization? If it is so, old as I will be, I will stand by them. appreciation of the ideas on your website Philip Atkinson I am so glad to have found your website. [ by pure chance ]. How can you analyse so many things so accurately? I am an American citizen now living in England. Why on earth don't you return to England? For some time, I have been hoping to write a book titled "The Rise and Fall of Western Civilization" A forlorn hope. I have the ideas; but lack a command of the language that seems to come so naturally to you. Besides, you have already written almost all of what I would put into my ----> PART II = THE AGE OF INSANITY. I was born long before you, back in the almlost-forgotten age of reason. PART I = THE AGE OF REASON ( 15 JAN 1610 TO 6 AUGUST 1945 ) Beginning with Galileo and ending with a bang---a big bang..'''
