["https://ourdecline.com/signs/stemcell.htm"]
title = "Benefits of stem-cell research unavailable in West (2007)"
description = "Media item revealing that to obtain the miraculous benefits of stem-cell research you must go outside of Western Civilisation (5/4/2007)"
full_description = '''A BRISBANE woman who was paralysed in a car accident is walking again after receiving controversial stem-cell treatment in India. Australian doctors told mother-of-three Sonya Smith 18 months ago that she would spend the rest of her life in a wheelchair. Her spine was broken after she was crushed by her car when the handbrake failed and it rolled down a hill. But after eight weeks of embryonic stem-cell injections, Mrs Smith, 45, is now able to stand with the aid of callipers and has regained bowel and bladder control. She says she has recovered "deep sensation" in her thighs and feet and has been able to swing her legs. Mrs Smith heard about the treatment from her sister, who lives in India, where medical guidelines are less stringent. Phil Smith, 44, said yesterday that his wife's recovery had been "amazing". Mr Smith, an editor with Channel 7 in Brisbane, spoke from the family home in Bardon where the couple live with their daughters, Kirsty, 10, Holly, 8, and Carly, 7. He said his wife would be coming home next month for Holly's birthday. Mrs Smith is one of more than 300 patients who have been treated in New Delhi by controversial stem-cell pioneer Dr Geeta Shroff. The treatment, forbidden in Australia, involves collecting stem cells from embryos and injecting them into injured or diseased patients. Critics [Lunatics] have described the treatment as irresponsible and unethical, but Dr Shroff shrugged off the skepticism. Dr Shroff claims to have an "inexhaustible" bank of stem cells from a single embryo, which she uses to treat Alzheimer's, Parkinson's and motor neurone disease. She has never submitted her work for international scrutiny. Australian legislation was passed last year allowing scientists to clone human embryos to extract stem cells, but only for research. This month, state MPs will vote on whether to allow the practice in Queensland. Mrs Smith, a teacher aide at Petrie Terrace State School, urged governments to do more to make the treatment available in Australia.'''
author = "Hannah Davies"
year_published = 2025
