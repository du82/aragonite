["https://ourdecline.com/decline/example/masskill.htm"]
title = "deliberate media lies about Kosovo & East Timor (1999)"
description = "An unheralded but crucial newspaper article refuting the previous many media-wide death rate claims in Kosovo and East Timor. Cited by  'A Study Of Our Decline' to reveal the distortion of truth in media reports (November 1999)"
full_description = '''THIS year we have seen claims involving wildly wrong death estimates used to rouse emotions and create public support for political and military action in Kosovo and East Timor. It's worth having a look at this process, not necessarily to criticise the actions that resulted, but simply to remind ourselves of how activists use the media to manipulate our feelings. Readers will recall that the foreign staff of the United Nations and the international media fled East Timor in early September in fear of their lives, although not one had been killed. It is these people who, once they reached other countries, have been foremost in exaggerating the number of deaths. In September the term "genocide" was widely used to describe what was then happening in East Timor, and people were talking about thousands of deaths. Such claims often occurred alongside efforts to push the Government to intervene. wrote one journalist in The Sydney Morning Herald on September 7. A week later Amnesty International announced: I can still recall the powerful effect such statements, suggesting a death rate of at least 336 people a week, had on me and others. According to the head of the UN war crimes investigation team, John Bevan, the atrocities "at this stage look like they could amount to a systematic genocide". On September 26 there were reports that Interpol was expected soon to issue arrest warrants against Indonesians on "charges relating to the planned extermination of 12,000 people". These were the figures, and the rhetoric, driving public opinion around the time Australia decided to send troops to East Timor. EAST TIMOR'S Bishop Carlos Belo this week claimed that up to 1000 people died in the Suai church massacre alone. Dreadful as this was, others put the figure much lower, at several dozen. The East Timor Human Rights Commission says it has found evidence of 384 killings in Dill in the three weeks to October 22. What was the reality? Interfet, which now controls the whole country, says it has found 108 corpses, although there may be more. East Timor for some weeks has been full of journalists actively seeking stories of death and atrocity, but they have found nothing to inflate the Interfet figure.'''
year_published = 2025
