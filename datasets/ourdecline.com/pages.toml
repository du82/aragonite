["https://ourdecline.com/moral2/moral8n.htm"]
title = "The Nature Of Wisdom (02-Dec-17)"
description = "Wisdom is the sane use of knowledge, and how morality determines sanity(02-Dec-17)"
full_description = "Knowledge Is The Realm Of Science Discovering cause and effect is the result of experience, and the memory of this experience is knowledge, which is used to reveal truth from falsehood and is the realm of science. Knowledge Lacks Meaning Knowledge does not supply meaning, for while it reveals that seeing a man lose his head is seeing a man die, it does not reveal the meaning of this death. Deciding if this death was right or wrong is a function of the observer's understanding, and this meaning only exists within that understanding. Meaning Is Created By Morality By applying his moral code to what he observes, a man can judge if he is observing a crime or justice or an accident. It is the man's moral code that supplies meaning. Every Man Has A Religion The moral code that a man uses to create meaning by recognising right from wrong, is the fixed foundation of the man's understanding and so controls the man. That is, every man is a disciple of his morality, which is his religion, so every man has a religion. Feelings Are The Religion Of The Selfish A selfish man worships himself, which is why the God of the selfish allows them to do as they feel, for their feelings, which are irrational and erratic, are their God, which is insanity. An Unselfish Moral Code Is The Religion Of The Unselfish The God of the unselfish is their unselfish moral code, which demands they control their feelings and condemns failure to resist feelings as sin, which is sanity. Upholding Communal Sanity Is The Role Of The Church The shared unselfish moral code is not only the basis for communal understanding, but the sanity of the community, and needs an agency to uphold and maintain; which is the church. Hence the role of the church is to judge what is right (virtue) and what is wrong (sin), and so uphold communal sanity. The Teachings Of The Church SHOULD Be Unvarying As a moral code is the essential and permanent foundation of an understanding, the recognition of sin should be constant and the claims of Revelations should endure; unlike scientific theories which must vary in the light of new discoveries. Although scientific advancements may obscure the truth and require refinement in Church teachings, such changes are only to the interpretation of, not changes to, the axioms of morality."
