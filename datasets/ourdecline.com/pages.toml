["https://ourdecline.com/idoabout.htm"]
title = "how to live in a declining civilisation"
description = "What a clear-thinking citizen can try to achieve in a declining community(21/12/2016)"
full_description = "Nothing Can Halt the Collapse of Western Civilisation Nothing can be done to halt the decline of a civilisation; it is an irreversible, inevitable process that occurs with every civilisation. Concerned citizens must learn to live in a hell called heaven without losing hope. The community is now senile and can no longer do anything sensible, so it is futile to try to: Sensible Citizens Must Learn to Live among Lunatics Sensible citizens must discover how to live in a community full of people who are slaves to their feelings and so lack shame, honour and the ability to think clearly: lunatics who deliberately discard all tradition to embrace delusion, so winning poverty, chaos, violence and communal senility. It is also the duty of all unselfish citizens to silently endure the increasing excesses of our senile community to avoid accelerating our demise. And to resist the tyranny demanded by— his society, which is trying to rob and enslave him;—and inflicted by terrorists who are trying to enslave or kill him. To escape poverty, slavery and sudden death, citizens should evade both these tyrannies the best way they can. Life is for living, and despite the ever-present growing shadow of decline, citizens should enjoy those fruits of civilisation that are still available, rather than lament those that are lost. Always remember that during decline time makes everything worse; so it could be that our present will be regarded by the future as a golden age, when poverty, chaos, death and destruction were not commonplace. Consolation: Justice is Done It is difficult to endure the constant stream of lies and glaring injustice without a desire to use violence to rectify both, but the minority of unselfish citizens should try to console themselves with the notion that regardless of whether a community is waxing or waning, justice is done: when the multitude is unselfish (virtuous) they win increasing wealth and order, but when the multitude is selfish (sinful) they win increasing poverty and chaos; which is the message of religion: virtue wins heaven while sin wins hell."
author = "Philip Atkinson"
year_published = 2025
