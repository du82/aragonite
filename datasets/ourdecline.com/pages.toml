["https://ourdecline.com/decline/ghpc.htm"]
title = "Glen Hoddle Sacked as England's Soccer Coach"
description = "Glenn Hoddle sacked as England's National Soccer Coach for being politically incorrect (February 1999)"
full_description = '''Yesterday, England's soccer coach Glenn Hoddle was tossed out of the ground by the sport's administrators after he suggested the lot of disabled people was due to karmic energy stemming from past lives. Hoddle never had a chance. Every-one lined up against him, including the buttoned-down Prime Minister, New Labour's Tony Blair. Blair weighed in after his minister with responsibility for the disabled said Hoddle had made remarks many would find "deeply insulting". The Prime Minister said if the coach was correctly quoted (which he disputes) it would be difficult for him to hold his job. The fact is a ballooning number of lost souls probably agree with Hoddle — all those characters who gather around the New Age stalls at the Riverside markets or live in various hinterlands from the Tweed to the Bloomfield. In London poor Glenn Hoddle was a New Age fringe dweller — he once wanted to bring a spiritualist to an English team camp — who should have stuck to soccer (although he wasn't too hot in that arena either).'''
