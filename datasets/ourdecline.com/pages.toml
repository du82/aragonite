["https://ourdecline.com/smartboard/shop/ransford/chap6.htm"]
title = "Pillar of Smoke by Day: Chapter 6 of 'The Great Trek'"
description = "Pillar of Smoke by Day: Chapter 6 of 'The Great Trek'"
full_description = "During 1836 things moved rather slowly for the discontented Boer farmers remaining in Cape Colony. It was as though fate wished to give them a chance for second thoughts about the emigration they were contemplating. Then suddenly the situation changed: the two victories of Vegkop and Mosega may have been small things as battles go, but they had tremendous local importance: they injected new resolve and energy into those who were wavering, so that in 1837 what had been a spiritual restlessness became a mass migration, and a trickle of emigrants grew into a flood. During the next two years more than 6,000 Afrikaners went rumbling northwards in their wagons through the Colony and crossed over the Orange river. There they followed the tracks in the veld worn by Potgieter's oxen and scored by the wheels of Maritz's wagons. The world seemed full of golden opportunity that New Year; yet of that 6,000 more than 500 were to die very shortly, for the most part from massacre and battle. The trek was no longer a migration in the normal sense, it had become something larger, and resembled one of the great military movements which marked the decline of the Roman empire. For these Voortrekkers were not continuing their forebears' centuries-old quest for new farm land: they intended to subjugate the indigenous people living beyond the Orange and turn their country into a state where their own social and political ideas might be practised and perpetuated without outside interference. The trekkers were uncertain about the way the British authorities would react to their departure. Naturally they hoped that official opinion would accede to it willingly. After all no other state was proposing to colonise or pacify the region beyond the Orange, or even to bring Christianity to it; and being so close at hand the trekboers seemed the logical people to undertake these tasks. In any case this was a peaceful secession and not an armed rebellion. And in fact, obedient to Whitehall's constant cries for retrenchment the Cape government at the time was setting its face against extending British responsibilities in South Africa. The official reaction to the emigration was thus confused and ineffective; admittedly the Cape of Good Hope Punishment Act which was passed in the August of 1836 made the trekkers liable to punishment for crimes committed south of latitude 25° south, but this was no more than an empty gesture since there existed no means of enforcing it. No attempt was made to declare the emigration illegal. The Lieutenant-Governor of the eastern province went so far as to announce that"
author = "Oliver Ransford"
year_published = 2025
