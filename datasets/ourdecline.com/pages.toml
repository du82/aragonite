["https://ourdecline.com/decline/hndmrsh.htm"]
title = "Hindmarsh Island wrongs redressed by Court(1998)"
description = "The judicial redress taken against the media for its lies about the Hindmarsh bridge project (Novemebr 1998)"
full_description = '''LAST Thursday, the Hindmarsh Island developers were awarded $110,000 in a major libel case. Judge Lowrie of the South Australian District Court found that Tom and Wendy Chapman had been "grossly" defamed by anti-bridge anthropologist Dr Neale Draper and the Green Left Weekly magazine. The Chapmans became embroiled in arguments about Aboriginal beliefs and found themselves at the centre of a possibly unprecedented storm of lies and allegations in the early l990s. They have already won payouts through five defamation cases, have seven others pending and are planning more. Their lawyer has an extraordinary number of documented cases of alleged libel about them which appeared in the print or electronic media. Hindmarsh Island matters because it marked the turning of the tide against the many white people around Australia who for years got their kicks by manipulating Aborigines and their beliefs. The dispute began because middle class whites in Adelaide with holiday houses on the island didn't want a bridge to be built, as it would have brought in more people and disturbed their privileged tranquillity. They enlisted the aid of various environmental groups and scientific research was misrepresented to come up with dodgy arguments against the bridge. When this failed, the whites decided to try the Aboriginal angle and enlisted the aid of some members of the local Ngarrindjerri tribe. They changed the name of their protest group to the Aboriginal name for the island, Kumerangk. When even this wasn't getting anywhere, a white anthropologist said to them: "It would be nice if there was some women's business." Shortly after (as the subsequent royal commission found) secret women's business was fabricated. The most interesting part of the story is what happened next. About a dozen Ngarrindjerri women went public pointing out that neither they nor any of the many anthropologists who'd studied their tribe for 150 years had ever heard of "secret women's business" (which in fact exists in central Australia but not in coastal South Australia).'''
year_published = 2025
