["https://ourdecline.com/aginatur/prog1.htm"]
title = "Absence of scientific rigour in 'environmentalism'"
description = "An expose of the lack of scientific rigour in environmentalist ideology, Television broadcast by a Channel 4, UK, in 1997"
full_description = "The first programme in the series presents arguments that global warming is a myth and that the environment in the developed world is improving. Environmentalists hanker after a pre-industrial idyll, but conditions in the Third World are harsh and millions die every year because of unclean water and smoke from indoor fires. The Greens oppose major development projects, but many local people want the electricity and clean water they will bring. Many resent the interference and hypocrisy of Western environmentalists, who have all the benefits and comforts of industrialisation. The program hears both from those who criticise the environmental movement and from the Greens themselves. Introduction Most people in the Third World lack the basic amenities of modern life that we in the West take for granted: clean drinking water and a reliable supply of electricity. And Third World governments are eager to industrialise in order to catch up with the West. But environmentalists say that if they do this, the future of the planet will be imperilled. In the name of preserving nature, environmentalists have challenged the old ideas of progress and economic development. But in doing so, they have been accused of needlessly consigning millions of people in the Third World to poverty and early death. The Shadow Of The Enlightenment The attempt by man to understand and to conquer nature was at the heart of Enlightenment thinking. A scientific, rational understanding of the physical world was a means of changing nature to serve our needs and desires better. But these Enlightenment ideas of rationalism and progress have been called into question by environmentalists. They have led, they say, to the monstrous creation of modern industrial life, with its factories and cars, chemicals and fumes. Gregg Easterbrook, author of A Moment on the Earth, a critique of environmental thinking, agrees. He argues that the idealisation of nature common in the environmental movement is a modern luxury that has, paradoxically, been made possible by development."
author = "Paula Snyder and Peter Millson"
