["https://ourdecline.com/bread.htm"]
title = "The Faltering Quality of Bread (2001) by R Harris (2001)"
description = "An extract from 'Slim Forever' by Dr Robert Harris, concerning the quality of contemporary (2001) bread"
full_description = "Give Us Our Daily Bread Bread has been referred to as the staff of life, but that was before the advent of modern production techniques. In the early days of milling, flour was produced by crushing the whole grain between stone rollers. The stone rollers were usually driven by wind, water or oxen power and moved slowly without generating heat. Vitamins and minerals are easily destroyed by heat, but the cold crushing techniques of times past guaranteed that most of the nutrients, including the germ, were retained. Not so today. Flour is milled by discarding the germ and the cellulose outer layer and crushing the grain between high-speed steel rollers. Unlike the coarse-ground, whole-grain flour produced by stone grinding, the flour we eat today is an extremely fine white powder. This the miller achieves by subjecting the grain to multiple crushings in a series of machines, each with progressively finer roller settings. The heat generated by the steel rollers is capable of destroying any vitamins and minerals normally found in the grain, producing a finished product of lifeless, off-white starch. Approximately 60 approved chemicals are used in the making of flour and bread. Although no single manufacture uses all 60 additives, eight or more are commonplace. For example, fresh flour is less than snow white and has a strong odour. To overcome these marketing deterrents, the flour is gassed in special ovens using chlorine dioxide. The chlorine not only bleaches and matures the flour, it forms compounds such as dichlorostearic acid which remain in the flour. Chlorine dioxide destroys vitamin E, and reacts with certain proteins to form methionine sulfoxide which is known to cause central nervous system damage in humans. If chlorine dioxide is not used, bleaches such as benzoyl peroxide and nitrogen peroxide may be added, together with maturing agents such as potassium bromate, potassium iodate and azocarbonamide. Bread made from fresh stone-ground flour is heavy and prone to drying and crumbling, a characteristic undesirable in todayʼs commercially-produced bread. Bakers are able to keep their product moist by adding polyoxyethlene monostearate, which has the property of absorbing and retaining water. Water retention in the flour causes the bread to stand up and remain soft, but this chemical also causes cancer in laboratory rats. Ethoxylated mono- and diglycerides are also added to produce the desirable quality of softness in bread."
author = "Dr Robert Harris"
year_published = 2025
clearnet = "https://ourdecline.com/bread.htm"
