["https://ourdecline.com/decline/jobs/yacht.htm"]
title = "Litigation risk threatens Yacht Race"
description = "Media item about the actual and possible cancellation of two yacht races in Australia (21/7/1999)"
full_description = '''Queensland's premier yacht race, the Brisbane to Gladstone, is in danger of being scrapped next year due to litigation fears arising from the ill-fated Sydney-Hobart classic. The bi-annual Australia to New Caledonia yacht race, due to start simultaneously from Brisbane and Sydney next month, has been scrapped as a "culture of litigation" engulfs the state's yachting fraternity. Organisers of the Brisbane to Gladstone race say they are concerned about the legal ramifications in the event of injury or death. The QCYC, which had organised the Australia to New Caledonia race, cancelled the event, claiming regulations governing yacht racing were "in limbo" following the Sydney-Hobart disaster. But the QCYC believes the guidelines are complex and have not yet been adopted by the sport's governing body, the Australian Yachting Federation. Mr Gidlow said the club could have run the Australia to New Caledonia event on existing safety guidelines, but would have risked legal action from competitors. Brisbane naturopath Alan Profke, who was to have skippered his 53-foot yacht in the race, said legal concerns could kill off the sport in Queensland. Dr Profke said he and his six-man crew were intending to sail to New Caledonia anyway, after all the time, effort and money spent preparing the yacht.'''
