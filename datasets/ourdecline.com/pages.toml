["https://ourdecline.com/decline/loss/fword.htm"]
title = "The judicial sanctioning of obscenity (1/9/1999)"
description = "Newspaper article revealing a magistrate's ruling that sanctions the use of obscenity (1/9/1999)"
full_description = '''Movie stars, rap singers and television hosts say it. And you don't have to be an expert lip-reader to know footballers say it all the time. But Dubbo magistrate David Heilpern's comments have provoked anger from teachers afraid he is sending the wrong message to children. Mr. Heilpern made his controversial comments after dismissing offensive language charges against a young man in the central New South Wales town who told police to "f.. off". This comes after The Panel's (a television show) Rob Stitch let fly with the f-word on air and channel Ten received only two complaints.'''
