["https://ourdecline.com/inspire.htm"]
title = "Introduction to 'A Study of Our Decline'"
description = "Introduction to the Atkinson theory of civilisation 'A Study of Our Decline', including the inspiration for the work (2007)"
full_description = "In 1990 society threw me on the scrap heap of unwanted middle-aged men and released me from the bondage of work. The enforced leisure allowed contemplation of all those disconcerting experiences that daily toil had previously forbidden, and insensibly I became a full-time student of my community. The inspiration for the book occurred while walking in the Blue Mountains (in 1991) during a conversation with a friend. He knew that I had written a paper explaining how the nation could get huge benefits from a simple countrywide computer network (before the appearance of, and nothing like, the Internet) and my time was spent in trying to sell the proposal. He asked about my success and, without thinking, I replied that some people liked my proposition, some didnʼt, but no one in authority did. The truth of this last statement led me silently to consider why this was so. Certainly every bureaucrat who had been approached rejected the submission out of hand. An attitude completely contradicting the publicised calls, by the then Prime Minister Keating, to make Australia the smart country by advancing new ideas. Somehow the media rhetoric and reality were, as usual, completely different. The clever solution that promised to enrich our nation by utilising modern technology was of no interest to officialdom. No official had been able to point out a flaw in the suggestion, so until now the blanket refusal was interpreted as indifference, a temporary failure in marketing, but this did not explain why these people took longer to grasp the ideas than everyone else. Possibly my feeling that these officers were just uninterested was not the complete truth, maybe they were stupid. Perhaps a lack of intelligence was an essential qualification for officialdom. This idle notion was rejected but immediately replaced by another. It was not that incompetence was a qualification, but ability meant disqualification, some process worked against the promotion of competent people into decision-making roles. Any officer who may have given serious consideration to bold and sensible innovations would long since have been weeded out of the service; discouraged and alienated until they gave up or resigned. Considering this idea was like discovering the key to a puzzle, it seemed to explain everything."
year_published = 2025
clearnet = "https://ourdecline.com/inspire.htm"
tags = ["decline", "introductionto", "study"]
language = "en"
internal-references = ["none"]
external-references = ["bibleinterp.com", "cluborlov.blogspot.sg", "corbettreport.com", "dl.dropboxusercontent.com", "freemindfilms.com", "freethoughtblogs.com", "freeyurko.bizland.com", "google.com", "homeliving.blogspot.com", "lulu.com", "nytimes.com", "richardcarrier.blogspot.com", "richardcarrier.info", "telegraph.co.uk", "thechangeseekers.com", "users.tpg.com.au", "yourkeylink.com", "youtube.com"]

