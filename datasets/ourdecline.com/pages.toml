["https://ourdecline.com/usa/racewar.htm"]
title = "The USA Race War of Black v White (1995)"
description = "Media item using published American department of Justice crime statistics to compare  Black-race versus White-race crime (1995)"
full_description = "The longest war America has ever fought is the Dirty War, and it is not over. It has lasted 30 years so far and claimed more than 25 million victims. It has cost almost as many lives as the Vietnam War. It determined the result of last year's congressional election. Yet the American news media do not want to talk about the Dirty War, which remains between the lines and unreported. In fact, to even suggest that the war exists is to be discredited. So let's start suggesting, immediately. No matter how crime figures are massaged by those who want to acknowledge or dispute the existence of a Dirty War, there is nothing ambiguous about what the official statistics portray: for the past 30 years a large segment of black America has waged a war of violent retribution against white America. And the problem is getting worse, not better. In the past 20 years, violent crime has increased more than four times faster than the population. Young blacks (under 18) are more violent than previous generations and are 12 times more likely to be arrested for murder than young whites. These breathtaking disparities began to emerge in the mid-1960's, when there was a sharp increase in black crime against whites, an upsurge which, not coincidentally, corresponds exactly with the beginning of the modern civil rights movement. Over time, the cumulative effect has been staggering. Justice Department and FBI statistics indicate that between 1964 and 1994 more than 25 million violent inter-racial crimes were committed, overwhelmingly involving black offenders and white victims, and more than 45,000 people were killed in inter-racial murders. By comparisons 58,000 Americans died in Vietnam, and 34,000 were killed in the Korean war. When non-violent crimes (burglary, larceny, car theft and personal theft) are included, the cumulative totals become prodigious. The Bureau of Justice Statistics says 27 million non-violent crimes were committed in the US in 1992, and the survey found that 31 per cent of the robberies involved black offenders and white victims (while only 2 per cent in the reverse)."
author = "Paul Sheehan"
year_published = 2025
