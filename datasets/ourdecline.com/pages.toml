["https://ourdecline.com/students.htm"]
title = "Concerns of university students (2015)"
description = "Media article revealing the ludicrous tyranny demanded by university students (28/12/2015)"
full_description = '''The United Nations, which decides these things, thought that 2015 was an appropriate time to recognise Thomas Edison's world-changing invention, 135 years after his light bulb was patented. Sadly, the UN's celebration never caught on." It may have been the least popular international year concept since 2008 (the International Year of the Potato) and 1985 (the International Year of the United Nations). Instead, 2015 was dominated by micro-aggressions, safe spaces, trigger warnings, privilege checks and other concerns of the global university student community. It was, to borrow a phrase from internet genius David Burge, the International Year of Screaming Campus Garbage Babies. This movement is not confined to the US. In Australia, too, garbage babies are screaming about the tiniest perceived injustices. Worse still, people actually listen to them. Last year, for example, Sydney University cancelled a Mexican-themed staff Christmas party following a complaint from Eden Caceda, an office-bearer with the university's Autonomous Collective Against Racism. The fact that it actually is a costume evidently never occurred to the university's timid staff, who subsequently suffered through a dreary party that had no theme at all. Eden's success, repeated at universities around the world, emboldened whiners to take even further steps throughout 2015 towards their colourless, uniform nirvana. They don't like costumes. They don't like diversity. They don't like speakers with whom they disagree, as retired British military officer Colonel Richard Kemp discovered when he visited Sydney University this year, only to be shouted down by pro-Palestinian academics and students. They don't even like applause, according to this message from Oxford University's Women's Campaign during a British student conference in March: Just the thing to calm delicate student sensibilities, and also a good way to alert observers they're in the company of idiots. US writer Christine Rousselle responded:'''
year_published = 2025
