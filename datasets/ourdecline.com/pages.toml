["https://ourdecline.com/smartboard/shop/gowerse/complete/chap8.htm"]
title = "How to choose the precise word (1954)"
description = "Choosing the precise word, from the 'The Complete Plain Words', a guide to the use of English by Sir Ernest Gowers"
full_description = '''The Lure Of The Abstract Word THE reason for preferring the concrete to the abstract is clear. Your purpose must be to make your meaning plain. Now if, as we have seen, even such concrete words as ship, gold and money have a penumbra of uncertainty round them, an incomparably larger one surrounds all abstract words. If you use an abstract word when you might use a concrete one you are handicapping yourself in your task, difficult enough in any case, of making yourself understood. (27) Unfortunately the very vagueness of abstract words is one of the reasons for their popularity. To express one's thoughts accurately is hard work, and to be precise is sometimes dangerous. We are tempted to prefer the safer obscurity of the abstract. It is the greatest vice of present-day writing. Writers seem to find it more natural to say "Was this the realisation of an anticipated liability?" than "Did you expect to have to do this?"; to say "Communities where anonymity in personal relationships prevails" than "Communities where people do not know one another". To resist this temptation, and to resolve to make your meaning plain to your reader even at the cost of some trouble to yourself, is more important than any other single thing if you would convert a flabby style into a crisp one. As Mr. G. M. Young has said, an excessive reliance on the noun at the expense of the verb will, in the end, detach the mind of the writer from the realities of here and now from when and how and in what mood the thing was done and insensibly induce a habit of abstraction generalisation and vagueness. To what lengths this can go may be illustrated by these two examples: The first, which relates to the building of vehicles, means, I suppose, that in order to produce the vehicles quickly it is important to agree on a standard body. The meaning of the second is past conjecture. The perpetrator of it is an economist, not an official. Here are some less extreme examples of the habit of using abstract words to say in a complicated way something that might be said simply and directly:'''
author = "Sir Ernest Gowers"
year_published = 2025
clearnet = "https://ourdecline.com/smartboard/shop/gowerse/complete/chap8.htm"
tags = ["'the", "abstract", "accommodation", "adjectival", "affect", "alternative", "appendage", "appreciate", "appropriate", "choice"]
language = "en"
