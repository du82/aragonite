["https://ourdecline.com/nature/chap11.htm"]
title = "What is declining when a civilisation declines"
description = "What is actually declining when a civilisation is said to be declining"
full_description = '''Professor Mark Cooray was so appalled at the communal decay he witnessed that he wrote "The Australian Achievement" published in April 1988. The work explains in detail how the institutions responsible for the evolution of Western civilisation are being destroyed; that society is deliberately abandoning the ideas and enterprise that lifted Australia out of the grinding poverty of two hundred years ago, and instead is adopting practices that must return us to penury. While the author is meticulous in his examination of the process of collapse, he is vague about its inspiration. Why a people elect to accept nonsense instead of sense is left unanswered. This is unlike the author of "The Hellmakers", who claims it is all a socialist plot. In his 1988 publication John Grover confirms our community is going insane, but cannot discover a sane explanation. Both these works share distinct similarities to an essay completed over two hundred years ago by Edmund Burke. The 'conspirators' of "The Hellmakers" and the 'coercive utopians' of "The Australian Achievement" seem very like the 'social critics' of "Reflections On The Revolution Of France"; all are deluded advocates of social change whose proposals fail to withstand serious consideration. (Why such social engineers must always be dangerously wrong is explained by Joseph Butler. ) Had these authors read "A Study Of History" published in 1954, they would have known just what process they were observing. The dissolution of society is clearly described in that part of the work headed "The Disintegration Of Civilizations". Professor Arnold Toynbee's scholarly treatise, based upon consideration of numerous civilisations, sets out the symptoms and prognosis of our condition, and it leaves no doubt that our society is disintegrating. A fate we have been slowly succumbing to ever since the French Revolution, which Toynbee claimed marked the start of our slide into decay. (A fact presumably unrealised by the French government that recently celebrated the 200th anniversary of the event.) Unfortunately professor Toynbee still failed to explain what exactly is expiring, and why.'''
year_published = 2025
