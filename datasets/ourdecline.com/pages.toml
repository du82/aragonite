["https://ourdecline.com/feedback/fdbk2013.htm"]
title = "Response in 2013 to 'A Study Of Our Decline'"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2013"
full_description = '''Mr Atkinson — genius Dear Mr Atkinson Your writings are magnificent and to the point, and anyone who argues with your observations is clearly in need of help. On the dumbing down of our society . . . I live in New Zealand. I have lived here for 22 years, but I come from Scotland. Every time I turn the radio or TV on someone is SHOUTING at me. I feel as if I am under siege, that they think I am deaf or stupid. Advertisers talk to you as if you are a child, as if they are telling you a fairy story. It is unbelievable. The other night I was in McCafe having a cup of coffee in the corner (I don't associate much with society in general, for obvious reasons). A group came in, accompanied by much babble and excitement. It seemed that the young fellow in the cap and gown had just earned his degree. Not only that, it was an honours degree. You can imagine how pleased he was — as were his mates and family. He sat down near me. His mates and others went to the counter to arrange coffee, etc. He saw me reading a book, about Christopher Marlowe. The book was called 'The Man Who Was Shakespeare,' by Calvin Hoffman. The young man leaned over and looked at the title. He leaned back again and nodded to himself. I said: "Are you familiar with Shakespeare?" The university graduate looked like a deer in the headlights, as if I was playing some kind of a trick on him. He bit his lip and looked into my eyes. "Shakespeare," he said. "Mmmm, I've heard of that." THAT? Here he is with his honours degree and he isn't familiar with perhaps the greatest writer the English language has ever known. Meanwhile, Barack Hussein Obama and his Marxist legions continue to dumb down our society, to drag us down to the lowest common denominator, to root out any excellence and originality and replace it with political correctness,..... Hello Mr. Atkinson, this is K.S. You and I talked a bit through email a few years ago when I was in the military. I just recently checked back to read updates to your site. Your work continues to be one of the most influential books in my life, and I recently changed my diet for the better when reading the information about the High Fat low Carb Diet. Reading your book gives me great pleasure as it confirms my thoughts on society. Despite the pessimistic message, I find myself laughing often when reading your direct language exposing insanity. I find some kind of dark humor that goes with plainly speaking about the stupidity of society. Your work is so accurate and entertaining for me to read, I often wonder why you have not attempted to make videos on the subject and post them online. While the policy of most websites to ban "hate speech" may deter you, often I see "politically incorrect" topics on youtube and elsewhere. I hope you are doing well, and I would love to discuss more about your philosophy in opposition to others. Lately I have been exposed to less pessimistic forms of philosophy, mainly in the form of the backlash against Feminism, and I would like to get your views on what I have read to help clear things up. Appreciate your contributions,'''
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/feedback/fdbk2013.htm"
tags = ["atkinson", "decline", "public", "response", "responses", "study"]
language = "en"
internal-references = ["none"]
external-references = ["google.com", "homeliving.blogspot.com", "lulu.com", "yourkeylink.com"]

["https://ourdecline.com/law/ripper.htm"]
title = "Jack The Ripper identified by criminologist Dr Gareth Norris  (21/11/2015)"
description = "'Jack the Ripper'  was Whitechapel meat cart driver Charles Allen Lechmere, claims criminologist Dr Gareth Norris  (21/11/2015)"
full_description = "Jack the Ripper was a meat cart driver in Whitechapel, whose legitimately blood-spattered appearance helped him evade justice, a criminologist has claimed. Dr Gareth Norris from Aberystwyth University believes 'carman' Charles Allen Lechmere, whose early route to work coincided with locations of Ripper killings, should be considered a suspect. Lechmere was found leaning over victim Mary Ann 'Polly' Nichols' body on Buck's Row in Whitechapel on August 31, 1888 and told police he had only been there a few minutes. But research has revealed that he lied to police about his name, calling himself Cross, and it was likely that he was with her body for about nine minutes. He also passed Hanbury Street, Dorset Street and Mitre Square at roughly the same times as the Ripper killings — while another happened in Berners Street, where his mother lived. It is a theory that joins many others in relation to the string of murders during a three-month period in 1888 when six women were killed on the streets of London's Whitechapel. Their throats were slashed and bodies mutilated but no one was ever caught and 'the Ripper's' identity remains one of the world's greatest crime mysteries. In the years that have passed since the killing spree, many high-profile suspects have been suggested including Prince Albert Victor, the grandson of Queen Victoria and Sir William Gull, the Queen's doctor. Dr Norris, who worked with TV producer David McNab and Swedish journalist Christer Holmgren in a new Channel 5 documentary about the killer, drew up a profile of the likely murderer. He predicted that Jack the Ripperwould have been local and able to walk the streets in the early hours without being suspected. He added that because of his job as a meat cart driver, Lechmere would have been 'routinely covered in blood'. Dr Norris said investigations in Lechmere's life showed his mother was 'a pivotal figure' for him and he lived very close to her. But two months before the Ripper killings he moved further away to a new address while his daughter remained living with his mother."
author = "Daily Mail"
