["https://ourdecline.com/signs/fear.htm"]
title = "Media exhorting Australians to stop being foolish cowards (2/10/2005)"
description = "Newspaper article exhorting Australians to stop being foolish cowards (2/10/2015)"
full_description = '''It's fear, not science, that's robbing Australia of so many opportunities. So lets bury a green myth by building a nuclear waste dump. WE need to dig this hi-tech dump of Bob Hawke's, and not just to bury nuclear waste. We need it also to bury the green unreason which has held up great ideas like this for far too long. Hear it already, the hyperventilating over this suggestion from the former Labor prime minister for a nuclear waste dump that would be worth billions. But enough, please. Green myths have too often won out over science and it's already cost us a fortune. Where do we even start to count these losses? With, say, genetically modified food crops? Why not? Scientists agree GM crops such as canola are safe and useful. Our Gene Technology Regulator approved GM canola for use. Yet, spooked by nothing more than green believers and their technophobic dupes in the media, our state governments have banned them. Result? We're losing so many sales to GM-hip countries such as Canada that the Australian Bureau of Agricultural and Resource Economics last, month warned these bans may cost us $3 billion over 10 years. That's gold-plated idiocy. Or figure, as uranium prices soar, what we've lost in sales by stopping more than three uranium mines from opening, to placate Earthworshippers who think nuclear power is a crime against nature. Add the millions we'll spend on taking scarce water from farmers to send it instead down the Murray to "save" the river from "dying" —when the water in fact is as sweet now as it was 60 years ago. Why have scientists taken this assault on their traditions so meekly? Why hasn't the Australian Academy of Science fought this rising superstition? Where has anyone been who claims to value reason? Well, it's time to fight back. Let this battle over the nuclear waste site be the Waterloo of the greens. The plan pushed this week by Hawke is not new, of course. Pangea, an international company, proposed the very same thing in 1999, figuring a waste facility would earn an astonishing $2 billion a year.'''
author = "Andrew Bolte"
year_published = 2025
