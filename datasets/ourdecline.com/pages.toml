["https://ourdecline.com/feedback/fdbk2014.htm"]
title = "Response in 2014 to 'A Study Of Our Decline'"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2014"
full_description = '''Impressed As a young man surrounded by a society that strikes me as absolutely abhorrent I take great pleasure in reading your writings. Politically incorrect as society would claim them to be, it has become increasingly apparent to myself that everything that you say is true. I do not remember how I first stumbled across your writings, but that I bookmarked them immediately and read through them slowly and carefully over the duration of a long time. If there was anything I disagreed with, I could not remember it. I do not know if it is something that concerns this era alone, but I feel that stupidity ultimately prevails over intelligence via sheer force of numbers. I have convinced others to read various pages of your writing and they agree- but there is no particular enthusiasm for them to read of their own initiative. An intelligent mind will seek knowledge of its own initiative, and enjoys absorbing both facts and opinions. One of the most difficult things in expressing yourself, must be to get others to listen to you in the first place. "Survival of the fittest" is a concept I am increasingly believing is false. If anything, it is quite the contrary. An example of this is the high birth rates of third-world nations- while the first-world is spiralling into negative population growth. If stupidity in fact prevails over intelligence in the long term, it can only mean one thing- the world regresses overall. I agree with your pessimistic opinion of democracy, I feel that because democracy empowers the "average person" who is devoid of intellectualism, it must therefore empower stupidity further. It is a phenomena of sorts that exists in far more than just Australia. Immigration and liberalism in my opinion lead towards division- and yet these are being perceived as beneficial. The situation all around is insanity- and the most insane aspect is that very few can see it. It is as though the very "values" society has, are in fact the keys to its very destruction. You are completely right about the concept of a new "Dark Age". If western society collapses, it is the end of civilisation for wherever else it may be. As rich as nations like Qatar may be, their artificial economy is entirely western dependent. Asian corporations create nothing more than poor copies of western products. If we were to decline, they will collapse with us. Low birth rates and high suicide rates reinforce my belief that these nations are already in decline. There is a general lack of innovation anywhere outside of society derived from Europe. Morality has been thrown away both by the sheer level of atheism found in the west, but also by religion itself, as you had mentioned. The spirit of the age seems as though, to be "moral" is in fact to have no view of morality- almost anything goes. To be "immoral" is to criticize those who one perceives as having no morals (except the kinds that society deems as racist, etc.) It coincides with your writings about a society in which matriarchal views have gained prominence, and that ultimately matriarchal views are entirely nonsensical, but appear right to the masses who follow them as though righteous. It may very well be, that civilisation as we know it may not persist any more than a few generations more, if not collapsing sooner. One only has to visit the local Centrelink branch or similar place in which society's worst congregate, for the strongest sense of that hopelessness- whether, the large number of non-whites in comparison to whites who use these services, or that the taxpayer end up paying for their parasitic lifestyles, or the ridiculous under-staffing. It all points in the same direction- downwards. The education system is much the same way, as a 19 year old I am confronted with it for my entire life so far. Most of the sensible people I have spoken to from around your age acknowledge the 1960s as the time when society began to noticeably commence decaying. Yet even your own generation is not devoid of fools. I cannot comprehend how people who have lived between 70-80 years are somehow content with all that things have shaped to be. It is a great shame that what reads to me as truth would be perceived by the people of today as reactionary, dangerous material, and your claims about talent being rejected in favour of vile trash are only reinforced by the fact that your writings are not popular- while so much filth abounds on the internet, which is. Philosophy may not have won you popularity or wealth, the usual things desired by humans, but it is truly a remarkable achievement regardless.'''
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/feedback/fdbk2014.htm"
tags = ["atkinson", "decline", "public", "response", "responses", "study"]
language = "en"
internal-references = ["none"]
external-references = ["google.com", "homeliving.blogspot.com", "lulu.com", "yourkeylink.com"]

["https://ourdecline.com/whycare.htm"]
title = "Impact of decline on a civilisation"
description = "The general impact of a civilisation's decline upon society and its institutions"
full_description = "When a civilisation declines it goes into reverse with all the wealth, power and wisdom realised by its rise being discarded at an ever increasing rate until dissolution. The people will discover that: Tyranny and injustice will reign as delusion triumphs while the society loses its racial identity and dissolves into impotence. But this will never be generally recognized because the source of the disease is the waning of citizens' comprehension. A decay made obvious by the disappearance of plain speaking. Such a society is no longer engaged in creating a human heaven on earth, but is earnestly constructing the very opposite where:"
