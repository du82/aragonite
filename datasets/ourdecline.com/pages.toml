["https://ourdecline.com/aids/not/yurko.htm"]
title = "Alan Yurko Not Guilty Of Murdering His Son(2003)"
description = "Report by Dr Al-Bayati refutes the evidence used to declare a father guilty of shaking his baby son to death (January 2003)"
full_description = '''ORLANDO, Florida— Mohammed Al-Bayati, Ph.D., recently published a report that identifies the cause of the injuries that led to the 1997 death of Baby Alan. Dr. Al-Bayati's findings support the beliefs of vaccine damage experts and activists from all over the world; that Baby Alan died of complications resulting from the administration contraindicated vaccines—not from being shaken to death by his father. Dr. Al-Bayati, a toxicologist and pathologist, enjoys international acclaim for his ground-breaking research into the toxicological roots of AIDS. Now he has become the latest member in a growing body of scientists and lay people who are part of the Yurko Project. The baby's father Alan Yurko was sentenced to life plus ten years in prison for shaking his baby to death. Yurko's conviction and sentence is symptomatic of a national trend that has, in potentially hundreds of cases, wrongfully imprisoned parents for shaken baby syndrome (SBS) as a cover for vaccine damage. One day in Nov., 1997, Baby Alan, born in a weakened state after a difficult pregnancy just two and one half months before, stopped breathing. Yurko rushed his son to the hospital where he died a few hours later. Dr. Al-Bayati found that Baby Alan had been given high doses of sodium bicarbonate and heparin, which caused cardiac arrest and internal bleeding—symptoms similar to SBS. Dr. Al-Bayati explored the toxicological aspects of the unfortunate baby's case because the child did not develop SBS-like symptoms until after he was admitted to the hospital. Aside from Dr. Al-Bayati's thorough investigation into the cause of Baby Alan's death being consistent with the facts of the case that prove Yurko's innocence, his inquiries bring to light certain discrepancies that indicate prosecutorial misconduct. "They sent an innocent man to jail," commented Dr. Al-Bayati after he had conducted an investigation into the baby's death — something Dr. Al-Bayati claims was not done by the attending medical examiner.'''
year_published = 2025
