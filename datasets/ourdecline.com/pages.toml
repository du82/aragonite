["https://ourdecline.com/decline/hndmrsh2.htm"]
title = "Court Contradicts Royal Commission"
description = "Verdict by federal court about 'Secret women's business' at Hindmarsh Island, contradicts the Royal Commission(2001)"
full_description = '''A FEDERAL Court case has failed to resolve the saga of Hindmarsh Island bridge, secret women's business and a $20 million fight for compensation. Marina developers indicated yesterday they would consider an appeal to the Full Court of the Federal Court after Justice John von Doussa dismissed their compensation claim. Hindmarsh Island marina developers Tom and Wendy Chapman had sought $20 million compensation to cover losses sustained when construction of the bridge — to link Hindmarsh Island, 80km south of Adelaide, with the South Australian mainland — was banned by the federal government in 1994, a decision later overturned in court. Justice von Doussa also ruled that Aborigines did not fabricate secret women's business to prevent the bridge being built. Much of the protracted debate over the original planning and construction of the bridge had centred on an elderly woman from the Ngarrindjeri tribe, Doreen Kartinyeri, who is also an Aboriginal family historian at the SA Museum. She wrote of Aboriginal women's "secret business" related to the site — business not to be divulged outside women's circles —and claimed the site was sacred to Aboriginal women. The claims of the site's sacred nature prompted the then federal Aboriginal affairs minister Robert Tickner to cancel construction of the bridge. A later royal commission found the claims of secret women's business were fabricated. The Chapmans had maintained since 1989 that the future of their company, Binalong, depended on a bridge being built to replace a ferry from the mainland to the island. The Chapmans' marina was valued at more than $16.5 million, but when construction of the bridge was banned, the marina's value plunged and it was eventually sold for less than $1 million.'''
