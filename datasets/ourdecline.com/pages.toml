["https://ourdecline.com/economy/wealth.htm"]
title = "The Wealth Of A Community"
description = "A brief explanation of the nature of communal wealth (April 2009)"
full_description = '''What Is Wealth? Wealth is the ability to fulfil wants, which is a function of understanding and assets, with an asset being something that understanding employs to provide a benefit. To a primitive nomad, who lives by reaping nature's bounty, enough land to feed a family can extend hundreds of square miles, whereas a farmer could feed a family from a few acres of the same land. The different wealth obtained by the nomad and the farmer, is the difference in their understanding. That is, an asset is something given value by understanding: the more powerful the understanding the greater the benefits, the weaker the understanding, the less the benefits. Hence: Communal Wealth So Communal Wealth is the ability of the community to fulfil its wants, which is determined by the community's assets and how those assets are used, which in turn must reflect the strength of the community's understanding. The Division Of Labour Adam Smith in his work "The Wealth Of Nations" made it clear that wealth was created not just by human toil, but how that toil was applied. He explained how huge gains were made by breaking down a manufacturing task into its separate stages and giving each worker just one stage. And he illustrated this claim with the example of the manufacture of pins. In book one, chapter one, he revealed how ten men working separately could manufacture perhaps 20 pins each a day, a total of 200 pins a day. But by giving each worker a different task in the manufacturing process of the same pin, together they could easily create 48,000 pins a day! What Mr Smith did not clarify was that this division of labour was not inherent in work, but was achieved by the community's improved understanding of the manufacturing process. Example Of Australia When Aboriginals were the sole occupants of Australia, the wealth they realised through much toil was barely enough to feed, cloth and shelter a few stone-age tribes. Now that Western civilisation occupies Australia, its wealth is sufficient to feed, clothe and shelter millions as well as provide these citizens with a life of ease, at a cost of much less individual toil.'''
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/economy/wealth.htm"
tags = ["atkinson", "community", "wealth"]
language = "en"
internal-references = ["none"]
external-references = ["lulu.com"]

["https://ourdecline.com/moral2/moral1.htm"]
title = "Morality is misunderstood by society"
description = "The role of morality is misunderstood by the society (October 2004)"
full_description = '''An Address By The Devil Once a smartly dressed middle-aged matron would have regaled her audience with impressive respectability, but at the Manly writer's club in 1992, her talk was about her marital infidelity. She extolled the delights of allowing a strange male to grope her, as she stood in her garden only a few paces away from her husband in the sitting room. Nothing could compare to the bliss of illicit sex enacted in those stolen moments. The ensuing sordid affair gave her life a new dimension. Deceiving her husband, betraying her word, destroying her good name, ignoring the welfare of the children, nothing was too high a price for having such a good time. Immorality Popular It was like an address from an agent of the devil promoting sin: "discover the deep satisfying pleasure that comes from breaking the Ten Commandments". The beaming enthusiastic lady did not realise the same argument could be advanced for every crime. Her joy was naught compared to the ecstasy of the rapist or the thrill of the murderer. An ignorance shared by her enthralled listeners, all old enough to have known better. The loud long applause from mature adults, the average age must have been around 55, was undeniable evidence of their support. Confirmation that not only was moral restraint resented, but that people just did not understand the nature of the subject, or the implications of accepting sin as desirable. Its Role Crucial But Untaught One of the roles of Communal Morality is to identify sin and so apply restraints to our individual natures for the benefit of others; we forego private pleasure as evil temptations so the community prospers, and consequently the individual prospers. For example, despite the reward that may be gained by lying, truth is an essential quality for the community and we must all strive to tell the truth. But if we discard these limits and indulge our desires, while the individual enjoys an immediate release, the community suffers, and inevitably the individual suffers. This is obvious; nevertheless the lack of understanding of even this simple role of morality is just part of the common ignorance about the nature of morality, which is untaught in schools or universities, despite its crucial importance.'''
year_published = 2025
clearnet = "https://ourdecline.com/moral2/moral1.htm"
tags = ["'role", "misunderstood", "morality", "morality'"]
language = "en"
