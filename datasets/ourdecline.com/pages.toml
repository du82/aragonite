["https://ourdecline.com/die.htm"]
title = "Example of communal decline"
description = "A simple example of communal decline revealed in a letter describing life in post-apartheid South Africa(1998)"
full_description = '''When a country begins sliding into oblivion it really is the little things that get to you. You wake up in the morning and turn to see what time it is. The clock is off. The electricity is off again. Sometimes for a few minutes, sometimes for a few hours, but it seems to happen more regularly than before. You pick up the phone at work to make a call. Nothing. Your neighborhood is without telephone service again. You breathe a sigh of relief—at least if all the phones are out, they'll do something relatively soon to fix it. If it's just your own line, it can take days before they'll do anything. After the power comes on, you turn on the television to watch a favorite program, and hope you get the right sound with the right picture. Sometimes you get the sound of one show with the picture of another. Sometimes it's just the one or the other. Or a radio station instead of the soundtrack. You've read the papers—a large number of the "old" employees have walked out of the broadcasting studios. They couldn't take it anymore. And since television is an arm of the government, their replacements are appointed politically, not because of their experience or ability. You drive home after going out for dinner. Entire neighborhoods are without street lights. Well, to be more accurate, they are without lights that work. And the lights have been out for months. The city has said it won't fix them. These are the little things in South Africa today. These are the things that annoy. The big things are too frightening even to consider. Kafkaburg For two years I couldn't get a water/electricity/tax bill from the city of Johannesburg. Water and electricity are socialist enterprises here. I didn't have an account number, nor did I know how much to pay. I tried calling the bureaucrats, but no help there: they said they'd get back to me, but they didn't. On September 25th, they showed up to turn off my electricity for failure to pay. The city workers refused to show identification, wouldn't say whose account they were turning off, and wouldn't show any legal authorization to do so. In fact, they told me they didn't have to speak a language I understood (English). I called the police. I have a videotape of these civil servants telling me they aren't obligated to identify themselves, and that if I refused to allow them on the property they had the right to tear down my gate. When I asked one of them for anything that would show them to be city workers, he replied, "This isn't America, you know."'''
author = "Jim Peron"
year_published = 2025
clearnet = "https://ourdecline.com/die.htm"
