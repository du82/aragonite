["https://ourdecline.com/whatis/chap16.htm"]
title = "Why A Society Becomes Senile by P Atkinson (11-Jun-20)"
description = "How a society stops accumulating, and starts shedding, wisdom and so becomes senile (11-Jun-20)"
full_description = "A Society Has A Life Cycle The evidence of history suggests that a society is a life form as it shares the same life cycle of any other living creature; it is born, matures into a prime then declines into senility. The difficulty is understanding how a thing generated by the minds of people behaves in this fashion. The Sanity of Society is its Traditions A society arises insensibly from the accidents of existence. People living similar lives close to each other will develop a shared way of life, that is, a shared set of traditions that embody their shared beliefs, which is their shared sanity: this is the way the society is organised, its laws, manners and customs. The Birth Of The Society—The Start Of Language The formation of tradition must also include a common way of expressing ideas, a language, which itself is the shared understanding of these citizens. Hence the appearance of a language is the start, or birth, of the shared understanding, which is the society. Traditions Taught By Family The traditions adopted by the society become the lessons the parents must teach the children to continue the society. The traditional relationship between citizen and government must be the traditional way the child learnt to treat the parent, because how a child relates to its parents is how it understands authority. Improvement In Understanding Wins Improvement In Tradition As with every understanding the accumulation of experience will improve understanding, and this improvement must first appear in the sentiments of the citizens, before these improvements can be given reality by changes to institutions, manners, customs, and laws: the traditions of the society Improved Traditions Allow Further Improvements Until It Reaches A Prime:'A Golden Age' The society will embark upon an ever-improving cycle of gaining wisdom and strength by refining and extending its traditions. This improvement will be revealed in its improving customs, manners, laws and institutions but especially in its use of language, which will become more precise and clear. When this clarity of expression reaches its zenith, then the communal understanding is at its peak, which is the Golden Age of the Society."
year_published = 2025
clearnet = "https://ourdecline.com/whatis/chap16.htm"
tags = ["becomes", "decline", "discards", "senilewhen", "society", "study", "tradition"]
language = "en"
