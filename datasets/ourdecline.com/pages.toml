["https://ourdecline.com/cooray/hmlssyth/index.htm"]
title = "Homeless Youth, the root causes are ignored"
description = "Why spending more public money is not the solution to the problem of homeless youth, by Dr Mark Cooray (1995)"
full_description = "That there is no social problem which cannot be cured by a large injection of taxpayers' money is the prevailing viewpoint in government, bureaucracy and the churches. Therefore, the plight of homeless children can be quickly alleviated if only more public funds were spent. PROFESSOR L.J.M. COORAY, Editor of Public Affairs Media Probe, argues that while such an approach might soothe troubled consciences, it will do nothing to fix the problem. The family has been an important part of Western Civilisation, indeed, of all civilisations and of primitive cultures too. Parental care and nurture is important even in the animal world (particularly among those closest to man - apes and monkeys). The family provides meaning, continuity and purpose in the lives of individuals. It provides a nurturing and protective environment in which children can progress to adulthood. It is the best environment for the care of the aged, the disabled and the young. The breakdown of the family poses serious problems for society. Traditionally, the family has played an important part in the maintenance of law and order. It is not possible to have policemen on every street. Control which parents traditionally exercised over children (a control which is no longer effective in the same way) helped to maintain law and order. The breakdown of the family and the decay of discipline in the schools which the progressivists (so-called) have engineered has contributed in a very large measure to the growth of teenage vandalism, crime, drugs and alcoholism. The escalation of these problems from the 1960s onwards corresponds to the decline of the family and familial discipline and to the growth of permissiveness. The decline of the importance of the family unit creates not only social consequences but also economic effects. When these primary services are greatly reduced, or even totally disappear, they do not cease to be essential. Children have to be fed, cared for and educated. The sick must be treated, the old must be assisted."
author = "LJM Cooray"
year_published = 2025
clearnet = "https://ourdecline.com/cooray/hmlssyth/index.htm"
