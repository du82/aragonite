["https://ourdecline.com/signs/chap6.htm"]
title = "A Creeping Paralysis of Australian Society"
description = "The growing social paranoia that is paralysing Australian society, and how it is replacing freedom and fun with fear and stagnation (06-Jun-18)"
full_description = "The Effect Of Paranoia— as joy is crushed by anxiety, invention dies with freedom, and initiative stalls alongside industry. Frozen By Fear Nuclear power has the potential to supply all our Nation's energy, water and military needs, however our citizens are concerned not with the promise of this marvellous technology, but the problems that it may create. These reservations have obtained the level of superstitious fear, making the technology taboo. Our society is neither able to build power stations, nor can it develop weapons which would make up for the inadequacies of our military forces, nor can it attempt to develop and refine the technology that promises such power and wealth. Rural Decay — retreat from difficulty Agriculture feeds the nation so it is a crucial concern for every Australian, yet when in the 1950s atomic power offered desalination as an affordable, fabulous solution to Australia's perennial droughts, our nation chose to ignore it. Instead of grasping the opportunity to turn our arid drought-stricken continent into arable farmland and boost the wealth of the nation, if not the whole world, Australians did what they have always done, wait for rain. By choosing to wait for rain instead of acting to get the essential water, the Australian community demonstrated it has lost the ability to overcome problems. The inevitable result being a retreat from all problems, which is why there is a general exodus from the rural areas (Rural Decay), where life is harder, to the cities, where life is much easier. And this retreat is in every aspect of communal life including procreation, where the number of children being born is shrinking along with the size of the population: a decay that is seen also in Europe, Russia, and Japan. Condemned By The Electorate We have been condemned by the electorate, that faceless tyrant who decides the futures of politicians and their parties; a creature whose whimsical opinion is cited as the final arbiter of right and wrong, and is itself beyond criticism. Nevertheless, the fabulous entity created by democracy is a coward, and our community is enjoying the inevitable results of being ruled by fear, a creeping paralysis as we allow the possibility of peril to deter us from all action, and growing tyranny as citizens suffer the inevitable oppression caused by exchanging freedom with its risks, for compulsory safety with its boredom and stagnation."
