description = "The inquisition has re-appeared in the 21st century with jail sentences for the heresy of contradicting Political Correctness"
full_description = "Sexual Hysteria The sexual hysteria underlying the Spanish Inquisition has now re-appeared in our civilisation; when once to be accused of casting spells meant an almost certain guilty verdict, the same result is now obtained by accusations of sexual acts with minors. There is no presumption of innocence, but the reverse: see the cases of Cardinal Pell, Harris, Hughes, Brabham and criminologist Paul Wilson Political Hysteria The following three cases reveal that, even without sexual concerns, the judicial procedure has become an instrument of tyranny concerned with enforcing the adoption of the irrational notions of Political Correctness. This means that, like the Inquisition, to be charged is to be guilty, for the court is there to penalise anyone who contradicts official madness, so neither truth nor reason can be used in defending the accused. Brick layer Brad Love was jailed for eighteen months for complaining to his Member of Parliament about immigration in Canada, spring 2003 Ernst Zündel, after being arrested in the USA in 2003, illegally deported to a Canadian goal and held in solitary confinement, was then deported to a German goal in 2005 where he was tried (June 2006) for inciting racial hatred. And in Mannheim, Germany, on Thursday 15th February 2007 the 67-year-old was convicted of 14 counts of incitement and sentenced to the maximum of 5 years in prison. British historian David Irving was found guilty in Vienna, Monday 20 February 2006, of denying the Holocaust of European Jewry and sentenced to three years in prison. Irving is an authority on the murder of the Jews in Europe during the Second World War, having visited the sites, studied original documents and interviewed people involved. The crime of 'Denying the Holocaust' is that of contradicting the Austrian government's version of the genocide, for which truth is no defence. The recreation of the irresistible insane monster of the Inquisition is clearly revealed by David Irving's open letter (7th April 2007):"
