["https://ourdecline.com/decline/example/qlder.htm"]
title = "Brisbane City Council bullies home owners (7/5/2000)"
description = "A newspaper article  revealing Brisbane City Council's tyrannical  treatment of Queenslander home-owners (7/5/2000)"
full_description = '''OWNERS of old Queenslander homes who allow them to fall into disrepair could be fined under moves by Brisbane City Council to protect them from demolition. The council is considering radical measures which would lead to city officials preventing owners from neglecting historic homes or bulldozing them for units or subdivisions when they became unsound. Deputy Mayor and Urban Planning Committee chairman Tim Quinn said the council could introduce stronger powers to ensure owners looked after the pre-World War II structures. These would be in addition to council controls introduced in 1995 relating to their removal or demolition. But doubts remain about the council's capacity to force people to outlay large sums of money to maintain the properties. Built between 1860 and 1945, the unique Queenslander-style timber homes are considered a crucial part of the state's identity. A lawyer specialising in town planning, Mark Ruddy, said the council would need to amend the town plan to create some sort of "non-compliance" offence. Controls on the removal and demolition of character houses were introduced by the council in 1995, but Councillor Quinn said obliging people to take "reasonable care" of them would not be easy. Councillor Quinn said the council was concerned that some owners and developers were allowing Queenslanders to slowly run down until they were beyond repair. Council Opposition Leader Michael Caltabiano said council was using a "big stick" approach rather than encouraging people to look after properties through rate rebates and other incentives. Architect Kevin Hayes, who works mostly on character houses, said the buildings were "maintenance intense" and any plan to penalise owners would impact on those who could least afford it. A lot of old people live in old Queenslanders and they do not have much money," he said. Mr Hayes said it often cost more for major renovations on a Queenslander than to build a new house. And he said the council had to be careful not to destroy the "flexibility" of the houses.'''
author = "Lachlan Heywood"
year_published = 2025
