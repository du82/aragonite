["https://ourdecline.com/smartboard/shop/ransford/chap0.htm"]
title = "Introduction to 'The Great Trek'"
description = "Introduction to 'The Great Trek' by Oliver Ransford (1968)"
full_description = "'Their adventures and exploits form one of the most singular chapters of modern history, and deserve a clearer record than has yet been given to them.' So in 1875 wrote the brilliant English historian James Anthony Froude of the South African Voortrekkers. Since that date many fine accounts of the history of the Voortrekkers have been written, notably by M. Nathan and E. W. Walker. But the story needs retelling for the general reader's benefit if only because the Great Trek led to the development of the Afrikaner nationalism which so concerns Black Africa today. The Great Trek was an abrupt bound into the continental interior by settlers mainly of Dutch origin living in Cape Colony at the beginning of the Victorian era. Within the space of twenty years their advance had doubled the area of effective white occupation of South Africa, and by thrusting themselves among the Bantu the Voortrekkers had greatly increased the sub-continent's race problem. The march into the wilds was made by a few thousand men armed with muskets and Bibles, together with their women and children. It was opposed by the two most powerful military empires in southern Africa: together they constituted a far more formidable obstacle than the Red Indian nations which impeded the contemporary advance of the American frontiersmen towards the Pacific. Yet Hollywood has still to chronicle the struggles of the trekkers, perhaps because in the past cinemagoers have been conditioned to see nothing discreditable in dispossessing Sioux, Cherokees and Seminoles of their land, yet keen with pity over the injustices of Black Africa. The central fact which gives structure to the inception and course of the Great Trek was the Dutch colonists' insistence on continuing to live according to the pattern established by their immediate colonial forebears. Its design prescribed three fundamental requisites:each burgher was entitled to 6,000 acres of grazing land: governmental control must be minimal; and (most important of all) the Divinely appointed gulf which separated white Christian people from coloured heathens should be maintained."
author = "Oliver Ransford"
year_published = 2025
