["https://ourdecline.com/decline/example/egwish.htm"]
title = "Simple arithmetic denied by popular fancy"
description = "Date of the start of the 21st century set by popular fancy instead of simple arithmetic"
full_description = "On the evening of December 31st, 1999, in its coverage of the celebrations welcoming in the New Year, the media in the Western world proclaimed: Even Boris Yeltsin, the then president of Russia, announced he was resigning today (31st December, 1999) But the year 2000 is NOT the start of the 21st century nor the start of a new millennium, for it is sanity to always start counting from 1 so it is simple arithmetic to calculate that: These simple truths have been denied by popular opinion in the English speaking world, which insists upon giving significance to the change in the appearance of the date (from 1999 to 2000) rather than the use of simple arithmetic."
