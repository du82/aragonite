["https://ourdecline.com/smartboard/shop/ransford/chap11.htm"]
title = "The High Veld: Chapter 11 of 'The Great Trek'"
description = "The High Veld: Chapter 11 of 'The Great Trek'"
full_description = "During the years when the main trekker effort had been concentrated in Natal, the overberg Boers had enjoyed modest prosperity in a less spectacular fashion. Following the fights at Mosega and Kapain, Hendrik Potgieter had come to look upon the high veld almost as his personal property and after his brief appearance in Natal on the Vlug Commando he had thankfully returned over the Berg, humbled by the Zulus and condemned by a large section of his fellow Afrikaners as a traitor. Since then Potgieter had remained aloof from all the dramatic events which had led to the inauguration of the republic of Natalia and to its ultimate overthrow by the British. It is as well if at this point we take a look at the situation on the high veld to which Potgieter returned after his unhappy experience with the Vlug Commando in 1838. The country between the Orange and Vet rivers had long been settled by heterogeneous communities of Bantu, Bushmen, Griquas and trekboers as well as by Voortrekkers who had dropped out early from the mainstream of the Great Trek. On the other hand the country north of the Vet to as far as the Zoutpansberg was dominated by Potgieter's adherents. They lived at places which had been selected for their water, soil, pasture and timber. On and around these nuclear sites Potgieter now schemed to build the autocratic state of his dreams. With the instinct of a born dictator he proposed to set up a country governed by himself alone; the coloured inhabitants who wished to remain in contact with the whites there were to be segregated, but must give their services to the Boer farmers for a reasonable wage; they were also to be prohibited from vagrancy and among other strictures were not allowed to possess guns. Potgieter in short had been caught up in a pattern of government which a later generation of Afrikaners would label as apartheid. Potgieter went about his task with expediency and skill. His men had taken their last look at Natal from the top of the Berg on 14 May 1838, after which he headed due west to his headquarters on the Sand river. Now that the Matabele had been driven away Potgieter could make his plans with complete confidence. He intended to live on amicable terms with the African tribesmen remaining in his domain, renew his search for a route to a Portuguese port which would be beyond British control, and gradually extend his influence over the whole of the high veld. To this end during the remainder of 1838 he made treaties of friendship with local African potentates including Sekwati who ruled the powerful Bapedi tribe. Then in June he entered into an arrangement with the Bataung chief Makwana by which for the bargain price of 38 head of cattle he bought the enormous tract of land between the Vet and the Vaal over which the chief asserted a rather dubious sovereignty. However implausible this may seem, the transaction at least gave some semblance of legality to Potgieter's claim to have become lord and master of this first large section of the high veld."
author = "Oliver Ransford"
year_published = 2025
clearnet = "https://ourdecline.com/smartboard/shop/ransford/chap11.htm"
