["https://ourdecline.com/theend.htm"]
title = "The end of Western Civilisation (25/8/2015)"
description = "How Western Civilisation will end as its enfeebled countries become too weak to resist invasion so are overrun by other cultures (3/4/2015)"
full_description = "How our decaying Civilisation will end, as its enfeebled countries become too weak to resist invasion and become overrun by other cultures. The Roman Wall I was born in England, in the city of Newcastle-upon-Tyne, which is proud of its long history that can easily be traced back to the period of ancient Rome's occupation of Britain. There are many vestiges of the occupation but the most famous remains are those of Hadrian's Wall. This was a stone wall extending from the east coast to the west coast of England, built to protect the Roman occupied country south of the wall from raids by northern barbarians, or so I was taught. I have never questioned this explanation until recent events caused me to consider another purpose for Hadrian's Wall. Barrier Only to Unarmed Invaders The Roman wall would never have stopped an attacking army, unless it was manned along its whole length. But to garrison the wall in such a fashion would be to undermine the ability of the Roman army to confront a barbarian host, who would invariably outnumber them. Dispersing its soldiers along an 80-mile front could not, and was not meant to, repel a mass attack, but to overcome a problem that Western Civilisation is now facing. It was erected to stop the steady stream of migrants from the barbarian ruled areas entering the Roman Empire. And this was done because even though the barbarians entered the Empire peacefully, they did not come to help the Roman Empire, but to exploit it. They did not want to become citizens of Rome but to retain their own culture within the Roman community, which made them a liability to the Roman Empire. Declining Culture Vulnerable to Parasites The impact of the intrusion of an alien culture upon a failing culture is similar to a parasitic attack suffered by any failing creature. Though the citizens of a declining community are slowly losing their attachments to their own community, they still feel some sense of obligation towards it. It is their community, full of their own kind, which is their tribe, so regardless of their growing indifference to their society's tradition, they still feel a concern for its welfare. Whereas migrants from alien cultures have no such concerns; they are among strangers with a different culture. These invaders have not come to improve their host's society, but their own, at the expense of their host. Hence such invading minority communities are parasites upon their host community."
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/theend.htm"
tags = ["ages", "civilisation", "dark", "decline'", "ofwestern", "study"]
language = "en"
