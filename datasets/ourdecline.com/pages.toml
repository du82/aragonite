["https://ourdecline.com/law/theforce.htm"]
title = "The state of the NSW police force(25/2012)"
description = "The state of the NSW police force described by Miranda Devine in 'The Telegraph'"
full_description = "Sydney in the wee hours is a bloody, violent place where drugs, alcohol, testosterone and all-night drinking establishments create a lethal alchemy. This is the dark frontier where police try to impose order and protect the weak. But bouncers, along with former and serving officers, say the police force has become so risk-averse and politically correct it is incapable of fulfilling its most basic function, to stop bad guys hurting good guys. Increasingly, a private security industry is taking over the frontline response to street violence, with bouncers and guards conservatively outnumbering police two to one. Now bouncers complain that they are shouldering the burden of a violent society, with few protections. They claim police response is inadequate, that officers often lack the physical capability to restrain violent, out of control thugs fuelled up on alcohol and drugs. Rob, who has worked up and down the Central Coast, from the Crowne Plaza at Terrigal to The Establishment on George St, gives an example of a brawl between two men at a nightclub in Newcastle, one of whom weighed more than 120kg. Rob claims similar scenarios are a regular occurrence and brute force is the most effective way to quell or prevent violence. Former and serving police also complain that the lowering of physical requirements for recruits has left them at a disadvantage against drunks and street thugs who respond only to primitive brute force. A generation ago male police recruits were expected to be at least 175cm tall and 73 kg, with an ample chest circumference. Preferential recruitment of women has led to a rapid feminisation of the force, up from 20 per cent in 2000 to 27 per cent in 2010. In NSW fitness requirements were updated in 2010. Recruits are required to pass six physical capacity tests including agility, core strength, 25 push-ups, and a beep test. Rob's observation is that many new-age police, while perhaps better educated than their predecessors, The flip side of the story are other cases when bouncers have over-reacted, killing or seriously injuring violent patrons. Lawsuits have made pubs and clubs more wary about employing brute force. And there is another school of thought that women are better placed to defuse violent situations, and less likely to provoke troublemakers into macho displays of aggression."
