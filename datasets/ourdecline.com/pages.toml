["https://ourdecline.com/smartboard/shop/festjc/chap20.htm"]
title = "Professor NSDAP; by J C Fest (1999)"
description = "The role of opportunism and conformity that German intellectuals adopted while Hitler was publicly preaching popular nonsense from 'The Face Of The Third Reich' by J C Fest (1999)"
full_description = "'I say yes!' proclaimed Gerhart Hauptmann in spring 1933 in a public declaration. The upsurge of feeling that swept the nation and spread like an epidemic, sparing only those who stood very firm, let loose a wave of confessions of loyalty towards the new holders of power, in which the bitter protests and helpless disgust of those who were persecuted or actually driven out of the country went almost unheard. Faced with the thousands of spontaneous expressions of approval—fragments of a large-scale capitulation—one asks oneself in amazement what were the causes of the success which the blatantly anti-intellectual movement of National Socialism enjoyed among poets and thinkers. This success casts grave doubts upon the proposition that the high-ranking officers and big industrialists had shown themselves the weakest points in withstanding the regime's seduction and blackmail; for unquestionably Setting aside pure opportunism, all sorts of misapprehensions played a part in this strange alliance, and many people were quickly forced to realize that they had hallooed before they were out of the dark wood. But that deeper common element, which alone makes possible misapprehension in the field of ideas, was doubtless also present here, and Thomas Mann had good reason to write to Ernst Bertram: This weakness and readiness to capitulate can be understood only against a background of complex motivations connected with the whole position and function of intellectuals in modern society, which again and again explains the susceptibility of these classes to totalitarian solutions. Among these motivations are the ambivalent attitude of intellectuals to power and their tendency to embrace utopian systems or ideological concepts per se. (3) Even more important in the present case was the pervasive uncertainty about values, opinions and truths which gave the face of the age an unmistakably pre-totalitarian look and was expressed, but at the same time threatened, by National Socialism. If the movement and later the regime was defined as 'the dawn of a new era' and a 'turning point in time', this was its own self-evaluation; yet there was a germ of truth in it. For National Socialism was a radical new departure yet with a history going back much further than the history of the NSDAP. It was not merely a ruthless exploitation of the fears of a nation which for the most part felt its loss of status, or the brilliant utilization of the nation's 'emotional distress' for its own ends; it was not merely its slogans which secured the mass influx into the movement; rather it was the whole anti-rational uproar that accompanied it from its sectarian beginnings to the triumphant mass hysteria of the later years and, exactly like its totalitarian counterpart on the left, exercised such a stupefying effect on large sections of the intelligentsia."
