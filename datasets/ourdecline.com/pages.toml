["https://ourdecline.com/cooray/lawmoral/index.htm"]
title = "The relationship between Law and Morality"
description = "The relationship between Law and Morality by L J M Cooray (1989)"
full_description = 'Recently a pastor informed his congregation that Christians can no longer seek to impose their moral values on a society which does not accept Christianity. The second part of the statement, at least, is quite wrong. While Church membership and attendance has sharply decreased, the Roy Morgan Study of the Values of the Australian People demonstrates that 80% believe in God. Should Christians seek to impose their moral values on law and society? There are some who are forcibly and aggressively arguing that Christian values must be expelled from law, society and politics. Gareth Evans (now Senator Evans) is reported in The Sydney Morning Herald, May 7th, 1976, as stating at a convention of the South Australian Council for Civil Liberties that children wanted a right to sexual freedom and education and "protection from the influence of Christianity". If law is not based on morality, on what can it be based? The irony and hypocrisy of those who argue that Christian morality must be exorcised from law and society are that, at the same time, they are arguing for new laws based upon their own particular moral base. The pastor who made the statement referred to above has been deceived and is blissfully unaware of "the new morality" which the opponents of Christian morality are committed to secular humanism, permissiveness, anti-Christianism, material equality and distributive justice enforced through law. Christian morality, derived from the Ten Commandments, underlies the common law. Criminal law is based on the Ten Commandments, which also underlie the law of contract and the law of civil wrongs. The common law inherited by the British Colonies on the Australian continent and by the Commonwealth established in 1901, was developed over many centuries by British judges, who reacted to particular human situations on the basis of Christian values. Such a consensus exists in the modern Western community and in the Australian community. A major problem of our times, however, is that elites in politics, society, media, and even in religious organisations, have turned their backs on the traditional conceptions of right and wrong. The laws passed by Parliament have undermined morality.'
author = "LJM Cooray"
year_published = 2025
clearnet = "https://ourdecline.com/cooray/lawmoral/index.htm"
tags = ["australian", "cooray", "decline", "morality"]
language = "en"
internal-references = ["none"]
external-references = ["lulu.com"]

["https://ourdecline.com/phlsphy.htm"]
title = "Philosophy is the study of how truth is created"
description = "A clarification of philosophy as 'the study of how truth is created', suggested to repair the inadequacy of the understanding of philosophy"
full_description = "Today, anyone can call themselves a philosopher and announce any claim as a philosophical truth, and no one can say that the author is not a philosopher nor the claim is not a philosophical truth; which means philosophy is useless. Philosophy is useless because it lacks a useful definition; so to make philosophy useful, I have advanced the simple definition that philosophy is the study of how understanding creates truth, for understanding is the source of all meaning; without understanding there is no reality, no truth and no meaning. Thus to allow philosophy to become a science I suggest the following self-evident truths be adopted: The adoption of these truths convert Philosophy into a useful tool — a science. This science of philosophy explains not only understanding, language, reality, and truth, but also society— a shared understanding. These explanations allow a better understanding of ourselves by revealing why humanity behaves the way it does in forming a civilisation (a dominant society) and why such a society waxes (refines its understanding) then wanes (loses its understanding). Although the new science of philosophy significantly improves human understanding it reveals our current society is waning so condemning most citizens as fools, who naturally resent such a judgement. Most contemporary citizens insist upon ignoring the new science, and if they are pressed to recognise it, will persecute its proponents."
