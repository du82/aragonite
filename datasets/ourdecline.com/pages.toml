["https://ourdecline.com/signs/chap7.htm"]
title = "Technology Making Society Worse"
description = "How technology has changed from a powerful servant into a terrifying tyrant that is paralysing and impoverishing the community (10/12/2015)"
full_description = "Making Things Worse Not Better Technology is the artificial enhancement of human power. It should make us stronger and smarter, however our demented community is discovering that it now has the opposite effect. Nuclear power has terrified and paralysed its creators, while the improved cleverness and flexibility of our machines have caused social chaos and economic stagnation. Australia—A Nuclear Free Zone (1990s) All over this country are signs announcing the existence of nuclear free zones, erected by councils to announce the unpopularity of nuclear technology. Our nation has no nuclear power generating stations, or nuclear weapons, despite our growing need for energy and the inadequacy of our military. Such concerns have been ignored by the electorate in favour of conventional (old) technologies. Any government that tried to ignore this prejudice would be deposed by a wave of public hysteria from a trembling electorate. The End Of The Need To Work —OFF-LINE Benefits Of Technology Thwarted By Our Attitude To Employment My job for fifteen years (1975 - 1990) had been to write computer programs to make people redundant. I was not alone; throughout the western world an army of programmers have been working night and day to get rid of as many jobs as possible. Each job discarded meant improved productivity, and reduced costs. Because of our work, businesses throughout the world have become much more efficient, able to supply better goods and services, at a cheaper price. However it would seem we have wasted our time. Industry and commerce cannot utilise our improvements because there is no demand. There is no demand because people have no money. Nobody has any money, because so many people are out of work. Luddites' Fear The possibility of the loss of employment was first realised during the onset of the machine age. The invention and application of the steam engine heralded the industrial revolution. It dramatically extended the power and ability of the community. No longer was human strength and endurance the limiting factor in achievements. Machines could be constructed to work harder faster cheaper and more reliably than any group of people, however the initial implementation of machines meant mass unemployment and their use was bitterly opposed. People felt that such innovations were permanently robbing the community of jobs. The Luddite movement spontaneously formed which protested this change and attacked the new machinery along with its owners."
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/signs/chap7.htm"
