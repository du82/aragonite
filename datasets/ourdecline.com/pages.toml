["https://ourdecline.com/reverse.htm"]
title = "the law of reverse civilisation (6/10/2014)"
description = "The law of reverse civilisation reveals the waxing and waning of a civilisation is decided by the way children are reared"
full_description = "When a civilisation declines, it has stopped getting stronger and cleverer, but has started to become sillier and weaker; it has gone into reverse. This waning is the result of a reversal in the nature of authority; instead of authority ruling its charges, its charges rule authority. A change in authority only won by a rebellion when power is forcibly wrested from the traditional rulers and placed in the hands of the agents of 'the occasional will of the people'–Democracy. An act which Toynbee noted in his work 'A Study Of History'as a class war and the inevitable signal of the start of the decline of a civilisation. Decline is inevitable because the reversal of authority has an immediate and crucial impact on the process by which a community constantly renews itself: the way it rears its children. Then, instead of parental authority demanding obedience and respect, so insensibly teaching that community needs are more important than private wants (sanity), it is ruled by children's wants, so insensibly teaching that private wants are more important than community's needs (insanity). With the inevitable increasing lunacy of offspring, as advertised by schools and law courts, eventually winning social collapse. Hence:"
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/reverse.htm"
tags = ["'civilisation", "civilisation", "defined'", "ofreverse"]
language = "en"
internal-references = ["none"]
external-references = ["none"]

["https://ourdecline.com/english/plain.htm"]
title = "How to write plain English"
description = "A brief explanation of how an author should write plain English. (from The King's English by Henry Frowde, M.A, the 2nd edition (1908))"
full_description = '''ANY one who wishes to become a good writer should endeavour, before he allows himself to be tempted by the more showy qualities, to be direct, simple, brief, vigorous, and lucid. This general principle may be translated into practical rules in the domain of vocabulary as follows:— These rules are given roughly in order of merit; the last is also the least. It is true that it is often given alone, as a sort of compendium of all the others. In some sense it is that the writer whose percentage of Saxon words is high will generally be found to have fewer words that are out of the way, long, or abstract, and fewer periphrases, than another; and conversely. But if, instead of his Saxon percentage's being the natural and undesigned consequence of his brevity (and the rest), those other qualities have been attained by his consciously restricting himself to Saxon, his pains will have been worse than wasted; the taint of preciosity will be over all he has written. Observing that translate is derived from Latin, and learning that the Elizabethans had another word for it, he will pull us up by englishing his quotations; he will puzzle the general reader by introducing his book with a foreword. Such freaks should be left to the Germans, who have by this time succeeded in expelling as aliens a great many words that were good enough for Goethe. And they, indeed, are very likely right, because their language is a thoroughbred one; ours is not, and can now never be, anything but a hybrid; foreword is (or may be) Saxon; we can find out in the dictionary whether it is or not; but preface is English, dictionary or no dictionary; and we want to write English, not Saxon. Add to this that, even if the Saxon criterion were a safe one, more knowledge than most of us have is needed to apply it. Few who were not deep in philology would be prepared to state that no word in the following list (extracted from the preface to the Oxford Dictionary) is English: — Dr. Murray observes that these 'are now no less "native", and no less important constituents of our vocabulary, than the Teutonic words'.'''
author = "Henry Frowde"
year_published = 2025
clearnet = "https://ourdecline.com/english/plain.htm"
