["https://ourdecline.com/define.htm"]
title = "Society Defined And Explained"
description = "The first ever useful definition and explanation of society, illustrated with analogy and example (11-Dec-23)"
full_description = "A Shared Understanding of the meaning and use of words is essential for citizens to communicate. A Shared Understanding of beliefs about right and wrong is essential for citizens to share purpose so act as one creature. Hence a society (community) is a Shared Understanding, whose citizens' use of language is the exercise of this understanding, and whose behaviour is dictated by its citizens' beliefs about right and wrong: its morality. All Human achievements are first thoughts before they become things. Hence, the creations of a society (community) such as cities, governments, armies, as well as communal achievements such as conquests and discoveries,everything that goes to make a society, must spring from a society's thoughts. Hence: A Society(Community) is that group of a race of people sharing beliefs that allow a single shared understanding, which insensibly incorporates the racial character of the group. Hence all societies, from tribes to nations, are founded by a particular race with a unique understanding that is: Thereby forming a single powerful creature, whose sanity is its Tradition upheld by violence inflicted upon: A Society's Mind is similar in operation to an individual mind, except that audible conversation replaces silent thoughts, but the mechanism of understanding is the same — ideas, expressed in words, which are filtered by a code of values to determine which should become reasons for action. If a man is an irrational vegetarian crank whose conversation is mainly tirades against imaginary persecutors, then it is this process that will decide the man's future—whether as a despised social outcast, or as an absolute monarch, like Hitler. This does not mean that everyone believes what is popular, but unpopular ideas are ignored. Consequently: Lifespan Of Society A society exists as long as it can maintain its shared understanding through successive generations. And as all understandings are based upon a set of beliefs about right and wrong, this demands rearing children to revere the religion of their parents. For the moment the faithful become the minority, the society has lost its shared beliefs about right and wrong, which are tradition, so tradition is forcibly discarded. Whereupon the Populus stop being an ordered and disciplined citizenry, restrained by revered tradition but become a mob who revere only themselves and their opinions, restrained only by their fears and fancies. Then the society becomes increasingly chaotic, deluded and impotent as:"
