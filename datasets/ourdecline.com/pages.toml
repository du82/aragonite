external-references = ["none"]

["https://ourdecline.com/law/cake.htm"]
title = "Banning Lamington Drives and Cake Stalls (29/2/04)"
description = "Newspaper announcing the forbidding of Lamington drives, cake stalls, fetes, BBQ's etc. without a license (February (2004)"
full_description = '''THE traditional cake stall, a major fundraiser for churches and schools for decades, is facing the knife from health regulators. The state Government and city councils are loath to publicise it, but tough new regulations make it illegal for charities to sell food not cooked in a registered kitchen. Proof of the crackdown could be found on state polling day when few schools or churches booked tables to fill with lamingtons and fairy cakes. Father Sandy Marshall, in the most recent newsletter for St Peter's Parish at Wynnum in Brisbane, said: Anglican Archdiocese general manager Peter Read said one interpretation of the regulation was that any food sold must be prepared in a commercial kitchen where there were facilities such as stainless steel benches for cleanliness. Brisbane City Council health committee chairman David Hinchliffe said councils were placed in a difficult position where they were required to enforce the law. He hoped the problem would be resolved when the Government amended the Food Hygiene Act next year. In the meantime, councils might be liable for legal action if someone became ill from eating food from a stall that was not licensed. Country Women's Association state president Lyn Kelman said a ban on cake stalls would mean a massive loss of income for the volunteer group, adding that their landmark Gregory Terrace headquarters in inner-Brisbane was "built on cake stalls". CWA cooking co-ordinator Audrey McKay said the loss of cake stalls would be "the loss of an institution".'''
author = "Paul Weston and Jessica Lawrence"
