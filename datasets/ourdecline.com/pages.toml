["https://ourdecline.com/feedback/indexuni.htm"]
title = "The Futility Of Talking To Contemporary Citizens"
description = "The Futility Of Talking To 21st Century Citizens, revealed by Richard Carrier's Response to the definition of Philosophy"
full_description = '''P.A.: Dear Sir, To claim you are a published philosopher is to claim you know you are a philosopher, so can you please tell me how you know you are a philosopher? Dear Sir, Thank you for responding to my question but your reply is unhelpful. It is innuendo to cite a work in answer to a question for this is merely grandstanding: if you know the work contains the answer then why not just supply the answer? Otherwise the suspicion must be that you do not know the answer but are pretending that it is present in the cited work. Philosophy is the pursuit of truth, and as truth only exists in an understanding, then to discover how truth is created requires studying how an understanding creates truth; so philosophy must be the study of understanding. I would be grateful if you would acknowledge you cannot refute my claim, or else please refute it. R.C.: I linked to all the places where I answer the question. Pointing you to the answer you asked for is not "innuendo." — You can choose to go read my answer, or not. — Consider which decision constitutes a concern for understanding. — Richard C. Carrier, Ph.D.— http://www.richardcarrier.info Dear Sir, Thank you for your reply but it is unhelpful. Innuendo is the use of hints that suggest a claim, but make no actual clear claim. You make no clear claim but imply that your answer is in many places; which is innuendo. If you know what philosophy is, then why do you not tell me rather than claiming the answer is somewhere else? Further, in response to my clear and simple definition of philosophy, you remain silent even though you are invited to refute or acknowledge you cannot refute my claim. R.C.: No. I answered the question already. I pointed you to where. That's not innuendo. That's telling you where the answer is you are looking for. — This way I don't have to constantly repeat myself. I've already answered the question. Go read the answer. If the first one isn't enough, read the next. And so on. — Do your homework. Read the answer. Or else admit you don't actually care what the answer is. Those are your options. — Richard C. Carrier, Ph.D.'''
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/feedback/indexuni.htm"
