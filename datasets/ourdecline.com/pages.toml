["https://ourdecline.com/popltn/japan2.htm"]
title = "Japanese Population Shrinking (1/12/2015)"
full_description = '''Like hundreds of other small towns in Japan, Ogawa village in Nagano prefecture has seen shops close and schools shrink over the years despite efforts to attract new residents. The streets are mostly deserted and many homes sit vacant. Those are the natural consequences of Japan's demographic decline. But one company, Ogawa No Sho, has turned to the community's healthy seniors in a bid to keep the local economy alive, hiring them to make and sell "oyaki", a traditional dumpling considered the region's soul food. Nearly half of the company's 81 employees are more than 60 years old. The oldest, 91-year-old Chikayoshi Gonda, has been working at the company since it was founded almost three decades ago. He comes in three days a week, flipping dumplings in a large iron pan while chatting with customers at Oyaki-mura, or the Oyaki village restaurant where employees serve freshly baked dumplings and soba noodles to tourists. The dumpling business appears to be thriving. The company ships around 5 million dumplings annually across Japan and operates a couple of wholly owned shops. Of Japan's 1719 municipalities, 797 are suffering from depopulation. Looking more closely, the government counts around 65,000 smaller hamlets and communities facing the impact of the rural exodus. Dozens disappear every year after the last remaining residents die or relocate, leaving behind untended houses and farmland. While Japan's high life expectancy has somewhat mitigated the impact of a low birthrate on the total population, depopulation is expected to accelerate in the coming decades. Rural, greying villages like Ogawa, which have already seen many of its residents migrate to larger cities like Tokyo, are feeling the pain more acutely. A 2014 report by the Japan Policy Council think tank forecast that by 2040, the number of female residents of child-bearing age will drop by at least 50% if current trends continue in about half of Japan's towns and villages. It described them as "facing extinction".'''
author = "The Australian"
year_published = 2025
clearnet = "https://ourdecline.com/popltn/japan2.htm"
