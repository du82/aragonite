["https://ourdecline.com/smartboard/shop/ransford/chap9.htm"]
title = "Blood River: Chapter 9 of'The Great Trek'"
description = "Battle of Blood River: Chapter 9 of 'The Great Trek' by Oliver Ransford (1968)"
full_description = "During the Great Trek many amazing episodes occurred, but I am willing to put high on the list of their achievements the fact that the emigrants stayed on in Natal after the Great Murder. Never was the faith, courage and endurance of the Afrikaners better demonstrated than during the weeks which followed the twin massacres of Kwa Matiwane and Bloukrans. The trekkers, scattered in their bloody wagon-camps throughout upper Natal, were plunged into a situation filled with peril and uncertainty. They were left leaderless and dispirited. The number had been literally decimated. Everyone was hungry and half out of his mind with sorrow and apprehension. The encampments were filled with desperately wounded men, orphaned children and widows. The emigrants' fighting strength had suffered particularly severely. Of the 720 men capable of carrying a musket who had descended the Berg, 116 were dead. Ammunition was depleted. Provisions were running low and much of the stock looted. And no one knew when another Zulu attack might not descend on them and overwhelm the survivors in their camps. This was Gert Maritz's great hour; it was now that this sickly man, who had always been thought of as something of a dilettante, showed his mettle. Maritz went from camp to camp consoling the bereaved, encouraging the remaining fighting men and telling them of his plans for vengeance. A few faint-hearted Afrikaners refused to be comforted; announcing that ever since they had entered Natal things had been going wrong, they trekked back to the high veld. But the vast majority of the trekkers simply refused to abandon the country; the womenfolk were particularly intransigent; Cilliers notes that it was 'those who were the most in distress, the widows and orphans, had the least inclination to return to the Colony'. To some extent no doubt they were influenced by the fact that to go back tamely to the safety of the Cape would condemn themselves to living on charity, whereas if the trekkers remained in Natal they might in the end defeat Dingaan and regain their stolen livestock. But what weighed far more with the women was a refusal to give up the absorbing dream of living in their own independent state; they were sustained still by a deep and mystic passion for personal freedom. And somehow despite all that had happened to the maatschappij its people still felt themselves to be the special favourites of Heaven whose faith now was being tested. To return over the Berg, they believed, would be to fail their loved ones lying on the slopes of Kwa Matiwane and in scattered graves along the Bloukrans and Bushman's rivers."
author = "Oliver Ransford"
year_published = 2025
