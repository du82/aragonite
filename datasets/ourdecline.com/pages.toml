["https://ourdecline.com/signs/banelec.htm"]
title = "Tyranny licensed by the slogan 'Sustainability' (2004)"
description = "Newspaper article informing Queenslanders that the slogan 'sustainability' means energy saving devices to be compulsory in all new houses (11/12/2004)"
full_description = "THE State Government will make energy-saving devices compulsory in all new homes, units and townhouses in a bid to cut household energy use by 40%. Environment-friendly devices will include water-efficient shower roses and toilets, rainwater tanks, and solar and gas power. More than 100 houses a day are built in Queensland and the aim is to introduce devices that could also save homeowners money and therefore encourage sales. Legislation is expected to be introduced into Parliament in the second half of next year. Environment Minister Desley Boyle said the Government had moved to adopt five measures likely to deliver significant energy savings. Ms Boyle said as Australia's fastest-growing state, Queensland would need up to 40,000 new houses a year for at least five years. Queensland Master Builders director of housing Peter Osterhage said some of the items were already in use but the changes would add to the cost of homes, although it had not yet been quantified. Costs would be further increased in 2006 when Building Code of Australia Energy efficiency provisions were introduced. Heat pumps work like a refrigerator in reverse, absorbing heat from the air and transferring it to the water. Mr Osterhage said some of the regulations would be a concern in regional areas where domestic gas was not available. Design changes include wider roofing eaves, compulsory installation of insulation and ways to improve airflow through rooms. Ms Boyle has released a paper, Towards Sustainable Housing in Queensland, that is open for comment until February 18."
