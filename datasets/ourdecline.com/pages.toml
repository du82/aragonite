["https://ourdecline.com/educate/index.htm"]
title = "The decline of education (19/1/2016)"
description = "The decline of education as despised teachers fail to teach essential subjects; as revealed by numerous published warnings(19/1/2016)"
full_description = '''A Public Declaration Of Ignorance On Saturday, 11th November 2000, the Brisbane paper The Courier-Mail reported that a Harvard history student did not know that there had been two world wars. In an article titled "History lost in the past" journalist Peter Charlton claimed that in answer to a question posed by distinguished historian Simon Schama to his history seminar about the different foreign policy of Italy in World War I and World War II, one student replied: An answer that contradicts any claim of historical education about the twentieth century, as well as revealing an inability to perform simple arithmetic. The nature of the two world wars has so dominated the twentieth century, that not to know there were two world wars is not to know twentieth century history. While claiming in the year 2000 that the years 1914-1918, or 1939-1946, belonged to the last century, is to expose an inability to perform simple arithmetic. Either error contradicts the notion that this student has been educated, while the student's presence in a prestigious American university that demands an entrance exam, must raise grave doubts about the integrity of the American education system. The enormity of the student error raises doubt about the quality of education, and this suspicion is confirmed by the large number of works condemning the abysmal state of the education system in the western world. Competent Workers Disappearing And by the year 2016 employers are finding it difficult to recruit literate staff who can do simple sums.'''
author = "Philip Atkinson"
year_published = 2025
