["https://ourdecline.com/feedback/fdbk2008.htm"]
title = "Response to 'A Study Of Our Decline' (2008)"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2008."
full_description = '''If I said you're brilliant would I be out of line? I found you by accident from another reader. I'm very impressed and you, very intelligently, put forward what many are thinking and know intuittively what's happening/unfolding. I'm a 30-something white collar worker with a Bachelor's and surrounded by baying sheeple. One of my majors was History (and still is, ofcourse, always in pursuit of its understanding) in university. I'm very familiar with Gibbon, Durants, Machiavelli, Sun Tzu, von Clausewitz, Toynbee and more specialized works like Pendell's "Sex and Civilization". I think and know if western civilization is to continue to survive men have to grow balls and "freedom" and liberty has to be valued again along with our heritage. It may be "revived" through a authoritarian regime but our civilization, alas, as how we know it is doomed........so be it. What will surface I don't know. The historical record is clear and constantly evolving. That all said, I liek what you wrote beause it is very logical and introspective/analytical. Only a man and one who works specifically with logic (computer trouble shooting) could write like that. You remind me of the early 19th century to early 20th century authors who were, to me, some of the best ever produced unhampered by PCness and a stong ethos behind them. And, thank you. Please don't stop, we need more truth tellers like you. I can't stop agreeing with everything that is being said. I am a teacher (second year in) and am at my wits end everyday. Everything that is said about children and the failing role of parents is so spot on its scares me. the filth and the rudeness that I have to put up with everyday is so frightening — because it's almost becoming normal. As if — yes — this is how young people should be behaving. Sometimes I think this mess we are in is part of a big plot because it's just too incredible to believe. In my spare time from work, I use the computer to try and educate myself about various topics. Discovering your site has inspired me to propogate/stimulate intelligent discussion concerning human behavior. I appreciate the time and effort you're spending on this analysis and want to thank you. From this observer, the seed you're planting will take root and hopefully grow for the betterment of mankind.'''
