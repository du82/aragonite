["https://ourdecline.com/impact/arts.htm"]
title = "The Battle Against Beauty And Truth by M Medved (1991)"
description = "'The Battle Against Beauty And Truth' a critic's denouncement of the popular replacement of meaningful stories with lurid nonsense (1991)"
full_description = '''Last YEAR'S critically acclaimed "art film" The Cook, the Thief, his Wife & Her Lover is not an experience for the delicate of stomach. It begins with a naked man being restrained while the main character gleefully urinates over him. It ends with that same character slicing a cooked and elegantly prepared human corpse in a horrifyingly vivid scene of cannibalism. In between, we see a woman's cheek pierced with a fork, and two naked bodies squirming in the back of a truck filled with rotting, maggot-infested garbage. There is, in short, unrelieved ugliness, horror and depravity at every turn. Naturally, the critics loved it. When some of my esteemed fellow film critics began using words like brilliant and excellent to describe this pointless and pretentious piece of filth, I not only attacked the film on America-wide TV but also transgressed an unwritten rule of my profession — I attacked my fellow critics. In particular, I objected to the tendency to describe the picture as a raunchy black comedy without giving prospective moviegoers a better indication of the vivid brutality it contained. There was a predictable firestorm. One letter writer admitted not having seen the film but protested at my "unfair" attack on it. "Your job is to tell us if a movie is skilful or not," she informed me. "Please stay off your moralistic high horse." In other words, it's fine for me to talk about a film's sloppy or competent editing, about a convincing or unconvincing performance, but heaven forbid that I should address its moral content! Defenders of today's popular culture are so obsessed with superficial skill and slick salesmanship that they ignore the more important issues of soul and substance. Theirs is, at its very core, a war against standards, a war against judgment. In every realm of artistic endeavour, we see the rejection of traditional standards of beauty and truth. Ugliness has been enshrined as a new standard. We accept the ability to shock as a replacement for the old ability to inspire. Consider the obscenity trial in America last October of The 2 Live Crew, those poetic souls whose lyrics exalt the brutalization of women. One of the expert witnesses who helped secure the rap group's acquittal was a professor of literature. He claimed that aspects of their work were "refreshing and astonishing." He likened their use of profanity to that of Shakespeare, Chaucer and James Joyce.'''
