["https://ourdecline.com/feedback/fdbk2007.htm"]
title = "Response to 'A Study Of Our Decline' (2007)"
description = "E-mails responding to the theory of civilization 'A Study Of Our Decline' in the year 2007."
full_description = '''Dear Phillip, —I've just read your interesting biographical essay which reminded me a bit of the life, or rather the death, of Socrates. He too was a vicitm of Political Correctness. Like you, I was born in the UK and emigrated to the Antipodes, to New Zealand in my case. I am currently working in the UAE which, despite its difficulties and limitations, cannot claim to suffer from PC. Is NZ the most politically correct nation on earth? How could we measure it? Certainly the university syndrome you mention is chronic in NZ. Thanks for posting your refreshing views. Yours sincerely, Dear Mr. Atkinson,—Thank you ever so much for writing "A Study of Our Decline". Your insights and conclusions are refreshingly frank and ring true. In recent years I have come to love and revere the Truth. Your work is an island of solid ground in a world awash with deceit and delusions. I do not want to seem presumptuous or be rude, but I thought that you may find intellectual reinforcement in the recent work of Professor David Sloan Wilson. He effectively illuminates the biologic roots of good and evil. Thank you so much for your site. I return to it from time to time to prove to myself I am not insane. I find myself wondering lately how it is that enough progress occured to even carry civilization as far as it has come... Over the past year I have had to heed your warning to resist urges to stop the decline many times due to outbursts of noise, indecency etc... I have increasingly had my fill of it and I am only thirty years old. In any case, it is nice to see someone put together something that so crystal clearly and precisely echos so many of my own thoughts and sentiments. It is truly a pleasure and I wish you the best during these times. Sincerely, Merry Christmas Dear Mr. Atkinson, After reading two of your cheery articles about our declining civilization ravaged by barbarian (i.e. Mexican or Arab) war bands (as predicted by the great historian Toynbee in 1952), all I can say is, "Merry Christmas". From having lived in Phoenix, Arizona, for 26 years, I personally lived among the Mexican war bands in neighborhoods that went from being prosperous and peaceful to being overrun by crime, drugs, welfare, prostitution, garbage in the streets, gangs, and shootings in broad daylight. I have since conversed with other recent refugees from Phoenix, who tell similar horror stories about the nightmare that Phoenix now is. We have a choice: either mobilize the US Army, or watch the southwestern United States be annexed to Mexico and ruled by armed, Mexican gangs and their Arab allies. — Merry Christmas'''
