["https://ourdecline.com/whatis/chap13.htm"]
title = "Why the surge of random violence? Matrism explained"
description = "Why random violence has erupted in the community at the end of the 20th century as predicted by G.R Taylor's theory of 'Matrism/Patrism'"
full_description = '''An explanation of the random violence that has erupted in the community at the end of the twentieth century, which was predicted by G.R Taylor's theory of Matrism/Patrism. Australian Thrill Killing On Sunday 28th April 1996 Martin Bryant won the attention of the Western world by having the time of his life. Shooting everyone he met as he wandered through Port Arthur, Tasmania, he enjoyed a wonderful thrill of exultation and power, and gained a level of satisfaction that he had never experienced before, and is unlikely to experience again. Predicted By Taylor Such inane acts of violence are predicted by the book "Sex In History", as an inevitable part of a 'Matrist' community. The author's 1950s prophecy has come true, however Taylor's explanation that the killer behaved in this fashion because — "he identified with his mother sexually, and failed to develop a super-ego" — raises more questions than it answers. A more lucid explanation is that the murderer was just indulging his whims, which were totally unfettered by any sense of moral restraint. Indeed, he was doing no more than most of his fellow citizens already do — give free reign to their immediate desires regardless of the results. The fact that wanton behaviour does not generally result in the violent deaths of 35 people is incidental; the motives and considerations employed by Bryant were no different in principle from those of the over-whelming majority of our 1996 community. Public Reaction Reveals Public Character The general and hysterical reaction to this massacre, a demand to ban all guns, revealed a widespread lack of faith in the self-discipline of gun owners; a tacit confession by the populace to an inability to resist temptation. Their reaction to thrill killing was not one of disbelief, despite the rhetoric, but the opposite. They knew all too well that should they feel the desire to kill, should they lust after the thrill of murder, then they would jump at the chance; and the only way they could see of protecting themselves from people like themselves, was to make such weapons unavailable. A stance that ignored the fact that such legislation could only disarm the law-abiding and so empower the criminal.'''
year_published = 2025
clearnet = "https://ourdecline.com/whatis/chap13.htm"
tags = ["dutiful", "kinds", "random", "self-indulgent", "surge", "violence?"]
language = "en"
