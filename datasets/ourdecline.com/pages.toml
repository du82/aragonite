["https://ourdecline.com/weight/index.htm"]
title = "Insane Tinkering with Weights & Measures"
description = "How imperial measure, which reflected  the experience of the ages, was replaced with metric, so  defeating commonsense"
full_description = '''SURELY the most irritating excuse produced for the European Commission's banning of British Imperial weights and measures is the claim that feet and inches, gallons and pints, pounds and ounces do not belong in the "modern world". This claim has never cut much ice. The USA put Neil Armstrong on the moon using Imperial measurements and continues to use feet and inches in designing space satellites. The most modern desk-top publishing computer programmes use fractions of an inch to measure letter sizes, and electronic weighing scales in supermarkets display pound and ounces on digitalised readouts. What is not so well known is that it is in fact the metric system, which is outmoded and flawed, seriously hampering efficient practices of measuring, division and tallying. The problem with metric is that every unit is based on the number ten. In weight, for example, there are 10 mg in 1 cg, 10 cg in 1 dg, 10 dg in 1 g, 10g in 1 Dg, 10Dg in 1hg, 10 hg in 1 kg, 10 kg in 1 Mg, and so on. Although metric's decimal structure is much acclaimed by supporters of conversion, the rigidity of constant multiplications of ten frequently means that metric measures overshoot desirable or useful proportions. Take the experience of the metric system in the building industry as an example. Metric fails to produce any intermediate unit between the decimetre (4 inches) and the metre (40 inches) and so deprives builders of the Imperial foot, used throughout history and suitable for a wide range of building needs such as planning grids. As a result, the building trade sector, both in Britain and in Europe, has created the "metric foot" of 30 centimetres together with larger units of 120 or 90 centimetres (metric yards) into which metric feet may divide. Metric in the building industry survives because the metre can be discarded in favour of measures that reproduce the very Imperial units metric was intended to replace. Cans of soft drink provide another example of metric inefficiency. Drink cans cannot be produced in metric units because there are no metric measures available that reflect normal drinking quantities. The litre is much too big and the centilitre is much too small. Instead, the canning industry has had to divide the litre by about a third and produce a non-standard metric measure of "330 millilitres" in order to produce a suitable quantity. The figure of 330 millilitres does not constitute an exact third of a litre because no metric measure can be divided by three without producing an infinitely recurring decimal(3.333333 etc). Thus, three cans of Coke make 0.99 litres, not one litre. Rather than streamlining our system of measurement, metrication disrupts it.'''
author = "Anonymous"
year_published = 2025
clearnet = "https://ourdecline.com/weight/index.htm"
tags = ["anonymous", "exchange", "imperial", "insane", "measure", "metric"]
