["https://ourdecline.com/aginatur/sealevel.htm"]
title = "Sea Levels not rising except in IPCC lies"
description = "Sea Levels Not Rising: an interview with Dr. Nils-Axel Mörner past president(1999-2003) of the INQUA Commission on Sea Level Changes and Coastal Evolution"
full_description = "Dr. Nils-Axel Mörner was interviewed by Associate Editor Gregory Murphy on June 6. The interview here is abridged; a full version appeared in Executive Intelligence Review, June 22, 2007. Question: I would like to start with a little bit about your background. I am a sea-level specialist. There are many good sea-level people in the world, but let's put it this way: There's no one who's beaten me. I took my thesis in 1969, devoted to a large extent to the sea-level problem. From then on I have launched most of the new theories, in the '70s, '80s, and '90s. I was the one who understood the problem of the gravitational potential surface, the theory that it changes with time. I'm the one who studied the rotation of the Earth, how it affected the redistribution of the oceans' masses. And so on. I was president of INQUA,an international fraternal association, their Commission on Sea-Level Changes and Coastal Evolution, from 1999 to 2003. And in order to do something intelligent there, we launched a special international sea-level research project in the Maldives, because that's the hottest spot on Earth for (this topic) — there are so many variables interacting there, so it was interesting, and also people had claimed that the Maldives — about 1,200 small islands — were doomed to disappear in 50 years, or at most, 100 years. So that was a very important target. I have had my own research institute at Stockholm University, which was devoted to something called paleogeophysics and geodynamics. It's primarily a research institute, but lots of students came, I have several Ph.D. theses at my institute, and lots of visiting professors and research scientists came to learn about sea level. Working in this field, I don't think there's a spot on the Earth I haven't been in! In the northmost, Greenland; and in Antarctica; and all around the Earth, and very much at the coasts. So I have primary data from so many places, that when I'm speaking, I don't do it out of ignorance, but on the contrary, I know what I'm talking about. And I have interaction with other scientific branches, because it's very important to see the problems not just from one eye, but from many different aspects. Sometimes you dig up some very important thing in some geodesic paper which no other geologist would read. And you must have the time and the courage to go into the big questions, and I think I have done that."
