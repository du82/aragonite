["https://ourdecline.com/aginatur/prog3.htm"]
title = "Paranoia paralyzing scientific research"
description = "Environmentalists are the new enemy of science, part of a TV series broadcast by Channel 4 UK, in 1997"
full_description = "Professor Robert White is medical adviser to the Pope. He is also the only man to have successfully performed a head transplant. Throughout the world, science is advancing into uncharted territory — artificial wombs, male pregnancy, cloning, and human/animal hybrids. To scientists, this is progress. But environmentalists argue that these developments epitomise science gone mad. They point to the BSE crisis and claim that tampering with nature will lead to disaster. New ethics committees are being set up to monitor potentially immoral areas of research, such as cloning, and funding bodies are withholding grants from politically sensitive projects. Meanwhile, governments are passing legislation to ban research involving practices of which they disapprove, such as using tissue from aborted foetuses. Increasingly, scientists feel pressured into abandoning work in contentious areas such as genetics and fertility. Just how much valuable research has been prevented? Art and science: the curse of Frankenstein Scientific progress is at the heart of the attempt by humans to improve their lot. But human action has been discredited in the late 20th century, and a new pessimism about the future, which is reflected in films and books, has called into question the value of scientific progress. Books and films have always demonised scientists — from Mary Shelley's Frankenstein to B-movies like Dr Satan's Robot. But today film-makers and writers believe they are providing serious cautionary tales about the real threat posed to society and the environment by the excesses of modern science. Gattaca, a chilling tale of a society corrupted by genetic science, is to be released in March in cinemas all over Britain. And Gattaca is only the most recent of a wave of films that portray science out of control, wreaking havoc on society and the environment and upsetting the delicate balance of nature. The Island of Dr Moreau, released last year, featured a scientist who creates beasts that are half animal, half human."
author = "Paula Snyder and Peter Millson"
