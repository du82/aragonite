["https://ourdecline.com/warning.htm"]
title = "A warning from 'A Study of Our Decline'"
description = "A warning to readers of 'A Study of Our Decline', reminding them ignorance is bliss (February 2007)"
full_description = "This work is an attempt to explain why Civilisation is the blossoming then shrivelling of the shared understanding known as society, which is the gaining then losing of wealth, order, knowledge, security, identity and purpose. Using short words and simple arguments a suggestion is advanced that appears to make the whole matter so clear that anyone can understand what it is, why it appears and why it goes wrong — a feat that seems to significantly improve our understanding of humanity and our private selves. Pursuing truth carries the risk that revelations will not be pleasant, which seems to be the case here, for there is little to gladden the heart in discovering that humanity is sinking into a new dark age. That is, for the next few centuries humanity will deliberately replace wealth, order, knowledge and purpose with poverty, superstition, chaos and futility. Nevertheless, the author is convinced that by understanding our fate, the sane can direct their energies into useful rather than useless causes, and perhaps even allow some citizens of Western Civilisation to become the first citizens to learn what civilisation is."
year_published = 2025
clearnet = "https://ourdecline.com/warning.htm"
tags = ["decline'", "readers", "study", "warning"]
language = "en"
