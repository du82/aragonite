["https://ourdecline.com/indexjp.htm"]
title = "プレイン・イングリッシュによる文明の定義・説明（2019年1月16日"
description = "文明を「人間理解が開花し、そして枯凋すること」と定義することにより、文明に関してこれまでのあらゆる研究が省略してきた部分を修復する文明説明（最終改訂：2019年1月16日）"
full_description = "文明は人類最大の偉業である。なぜなら、それは地球上最強の生物だからだ。文明の理解、力、感覚は生物学の制限を受けないため、その達成に対する潜在性には限界が無い－ただし、文明が“もうろく”するまでは。 それ故、文明は人間理解の開花（これは富、秩序、知識、安全性、明白なアイデンティティー及び賢明な目的を実現する）、そしてそれに続く人間理解の委縮（上記の反対を実現する）とみなすことができる。文明の盛衰はその言語使用に現れる。なぜなら、言葉の使用はすなわち理解の実践だからだ。 本論文では文明、人間コミュニティー、そして理解の性質を簡単に説明する。我々の文明の現状及び陰鬱な未来の解説であり、2000年前後にオーストラリア社会を突然襲った変化に関する研究の結果である（以下を参照）。 トーストマスターズを訪問して私の理論をご自身で検証してみてください。"
author = "Philip Atkinson"
year_published = 2025
clearnet = "https://ourdecline.com/indexjp.htm"
tags = ["文明の理論"]
language = "en"
internal-references = ["none"]
external-references = ["none"]

