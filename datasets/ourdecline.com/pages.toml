["https://ourdecline.com/cooray/rights/chap97.htm"]
title = "The Moens Affair & The Human Rights Commission"
description = "An edited version of an article from 'The Age' newspaper about the Moens Affair and the Human Rights Commission in Australia."
full_description = "When Belgian-born law academic Dr Gabriel Moens was appointed by the Human Rights Commission to prepare a report assessing the merits and demerits of affirmative action, the Fraser Government was still in office. But 18 months later, when he submitted a report generally critical of the concept, the Hawke government, in association with 31 employers, had already begun a trial program of what some say amounts to reverse discrimination in favour of women. And there was talk of eventually including Aborigines and ethnic minorities and extending it to all employers with more than 100 staff. The report, which questions many of the basic principles underlying affirmative action, was rejected. The Human Rights Commission refused to publish the 254 page report and accused Dr Moens of not meeting usual standards of scholarship and objectivity. That has angered Dr Moens and his colleagues, one of whom describes the report as one of the most comprehensive ever written on the arguments for and against affirmative action. The problem is the report's verdict: It's not one that the influential feminists and their supporters in the Hawke administration want to hear. Dr Moens says: Dr Moens came to Australia in 1975 after working at universities in Belgium and Salzburg, Austria and talks about the lack of co-operation from ethnic and feminist groups and the pressure applied to the Human Rights Commission by feminists to have him sacked before he even began his work. They had discovered that his thesis completed in 1982, was critical of the sorts of affirmative action that they were promoting. He mentions the then Attorney-General, Senator Evans, who admitted to Parliament that in May 1983, only five weeks after Dr Moens began the project, he wrote to the Human Rights Commission, at the request of the Minister assisting the Prime Minister on the status of women, Senator Susan Ryan, and questioned the appropriateness of Dr Moens to undertake the study. Dr Moens says that the letter was outrageous and grossly improper. Affirmative action was launched in the US in the 1960s, he says, primarily to assist blacks to increase their numbers in the workforce, and particularly in positions of power and influence. In the 1970s, it spread to include women and members of ethnic minorities. The bureaucracy was compelled by Presidential executive order to recruit more members of groups which were poorly represented in government jobs in relation to their numbers in the community and large private employers were commanded to join the program."
author = "Ross Warneke"
year_published = 2025
clearnet = "https://ourdecline.com/cooray/rights/chap97.htm"
