["https://ourdecline.com/moral2/moral2.htm"]
title = "Morality Is The Foundation Of Understanding"
description = "How understanding is permanently founded upon preset beliefs about right and wrong(17-Apr-18)"
full_description = '''Morality Creates Meaning To realise the meaning of any event requires applying our set of values about right and wrong. That is, was a man's death a good or a bad thing? Was the event an accident, a crime or the execution of justice? Our morality dictates our realisation of meaning. Meaning Supplies Purpose By supplying meaning, an understanding can aspire to achieve those aims that are good, while avoiding those that are bad, and thus acquires a purpose for existence. A definition of life: "I think therefore I am alive" As all living things must have the purpose to survive, they must have a morality and think, hence thinking is an essential part of being alive. The philosopher Reneé Descartes (1596-1650) stated "I think therefore I am", which is not correct. If a man dies and hence stops thinking, he still is, even if it is just as a corpse. So as things exist even though they do not think, then Descartes words should have been "I think therefore I am alive". Morality Must Be Preset As beliefs about right and wrong are arbitrary, that is, they cannot be arrived at by logic, for to judge right from wrong demands an existing belief about right and wrong. Hence, beliefs about right and wrong must exist before an understanding can realise meaning and purpose; so must be set as part of the creation of every understanding. Morality Is Permanent Morality cannot be changed by reason because to use reason means applying values, which are the preset morality. This makes it impossible for people to change their founding morality. They may wish others to think they have changed their morality, but they are powerless to change their intentions, only their behaviour. A selfish person may wish to be thought unselfish but they can only form this desire if they are selfish, and nothing can reverse this crucial and early value. Creating Human Values In humans the set of values supplied at birth are extended by experience and upbringing; primitive instincts are built upon to form a sophisticated and complex set of beliefs. The strongest of these additions are formed in the first seven years of life (see "Early Warning") and become the immutable foundations of personality.'''
year_published = 2025
clearnet = "https://ourdecline.com/moral2/moral2.htm"
tags = ["'role", "alive", "essential", "foundation", "morality", "understanding"]
language = "en"
