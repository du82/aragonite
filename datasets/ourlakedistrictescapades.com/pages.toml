["https://ourlakedistrictescapades.com/2024/11/03/walk-lanercost-priory-and-hadrian-wall-cumbria-england"]
title = "Walk Lanercost Priory and Hadrian Wall – Cumbria, England – Our Lake District Escapades"
description = "Short walk passing by the old Lanercost Priory and the ruin of the Hadrian Wall. Version française disponible."
full_description = "Walk Lanercost Priory and Hadrian Wall – Cumbria, England Published on 3 November 202416 February 2025 by Mélodie Short walk passing by the old Lanercost Priory and the ruin of the Hadrian Wall. Une petite randonnée passant par l’ancien prieuré de Lanercost et les ruines de l’ancien mur d’Hadrian. Information to walk Lanercost Priory and Hadrian Wall: Distance: 5.5 km Duration: 2h Ascent: +108m Level: Easy Car Park: Just after Lanercost old bridge, little car park on the side of the road, Beckside, Lanercost, Brampton CA8 2HG, free Dog Friendly: Unfortunately there are several stiles without dog gates. You will need to carry your dog to pass these stiles. Also several fields with livestock. Download PDF and GPX Files of the Walk river Irthing End of September we decided to visit the North of Cumbria with a walk around Lanercost Priory and following the Hadrian Wall. It is an area near Carlisle / Brampton that we hadn’t visited before. Fin Septembre nous avons décidé de visiter le nord de Cumbria en faisant une randonnée autour du prieuré de Lanercost et en suivant l’ancien mur d’Hadrian. C’est un coin près de Carlisle / Brampton que nous n’avions pas encore visité. Find a great walk to Talkin Head near Brampton here fields After parking by the old bridge just before Lanercost priory, we took the path that follows the river Irthing before going through several fields to join Burtholme hamlet. There were some cows in the fields but they were a bit far from the path so they didn’t disturbed us. However we encountered two high stiles with no dogs gate which tested Skye’s jumping skills. Fortunately he did manage to jump over. Après avoir garé la voiture à côté du vieux pont juste avant le prieuré de Lanercost, nous avons pris le sentier qui suit la rivière Irthing avant de traverser plusieurs champs pour rejoindre le hameau de Burtholme. Il y avait plusieurs vaches dans les champs mais elles étaient loin donc elles ne nous ont pas embêté. Mais nous avons dû passer deux échelles assez hautes qui n’avaient pas de porte pour les chiens ce qui a testé les talents de sauteurs de Skye. Heureusement il a réussit à sauter par dessus. more fields We continued on the road to cross Burtholme hamlet and took the direction of the Hadrian wall. We left the road to go through the fields where again Skye had to jump over several high gates as either the gates were locked or the stiles were not really dog friendly. We also encountered several cows that were very intrigued by us and started to walk towards us. Unfortunately I am very scared of cows and Skye is as well not confortable with them. So while Matt carrying Marcus tried to move the cows away, Skye and I rushed to the exit of the fields. Marcus was very happy to see the cows so close. Nous avons continué sur la route pour traverser le hameau de Burtholme et avons prit la direction du mur d’Hadrian. Nous avons laissé la route pour marcher à travers champs où une fois encore Skye a dû sauter plusieurs fois au dessus de hautes échelles car soit les portails étaient fermés à clés soit les échelles n’avaient pas de porte pour les chiens. Nous avons aussi rencontré pleins de vaches qui étaient intrigués de nous voir et marchaient vers nous. Malheureusement j’ai peur des vaches et Skye n’est pas non plus très confortable en leur présence. Donc pendant que Matt qui portait Marcus chassé les vaches, Skye et moi nous sommes dépêchés de sortir du champ. Marcus quant à lui était très content de voir les vaches d’aussi près. along the Hadrian Wall After that little adventure, we joined the Hadrian wall, which is not visible at all on this section and we followed it until seeing the sign indicating Lanercost Priory. Before leaving the Hadrian wall, we stopped at a picnic area to have lunch. The area was very quiet and we didn’t see a lot of people. Walking down to Lanercost Priory on the road, the saw severals sheep in the fields which entertained Marcus. Après cette petite aventure, nous avons rejoint le mur d’Hadrian, qui n’est pas visible à cet endroit et l’avons suivi jusqu’à voir le panneau indiquant le prieuré de Lanercost. Avant de quitter le mur d’Hadrian, nous nous sommes arrêtés manger sur une petite aire de pique nique. L’endroit est très calme et nous n’avons pas vu beaucoup de monde. Descendant sur la route vers le prieuré de Lanercost, nous avons vu plein de moutons dans les champs ce qui occupa Marcus. For a lovely walk on the Hadrian Wall visit this post Lanercost Priory in the distance We decided to not visit Lanercost Priory nor to stop at the famous Lanercost cafe as Marcus was starting to be a bit grumpy and wanted to nap. So we just followed the path that goes around the priory before reaching the river, where we took right to find the car park. From the path we had a great view of the cemetery and some of the inside of the Priory. Lanercost Priory was founded by Robert de Vaux between 1165 and 1174, to house the Augustinian canons. Being close to the Scottish border it had been attacked several times through the centuries and was used as a base for the English army on their way to Scotland. Indeed it was used by Edward I in 1300 on his way to siege Caerlaverock Castle. If you are interested in seeing a bit more of the inside of the priory I invite you to read Sharon’s blog post. Nous avons décidé de ne pas visiter le prieuré de Lanercost ou de nous arrêter dans le fameux café car Marcus commençait a être impatient et voulait faire une sieste. Nous avons donc juste suivit le sentier qui tourne autour du prieuré avant d’arriver à la rivière, où nous avons pris à droite pour rejoindre le parking. Le sentier offre une belle vue sur le cimetière et un peu de l’intérieur du prieuré. Le prieuré de Lanercost a été créé entre 1165 et 1174 par Robert de Vaux pour les augustins. Etant proche de la frontière avec l’Ecosse il fût souvent attaqué au cours des siècles et servit de base pour l’armée anglaise en route pour l’Ecosse. D’ailleurs il a été utilisé par Edward I en 1300 alors qu’il était en route pour faire le siège du chateau de Caerlaverock. Si vous êtes intéressé par l’intérieur du prieuré, je vous invite à lire l’article de Sharon. Find Sharon’s blog post about Lanercost Priory here. You wan also find our visit of Caerlaverock Castle here. path going to the priory To conclude, it was a ok walk that is not really popular but definitely it is not one of my favourite walks in Cumbria. Unfortunately, it is not really a dog friendly as it is only accessible for small dogs that can be carried or dogs that can jump high. Also the only highlight of the walk is the priory as the Hadrian Wall is not visible on that section. So I would just recommend to visit the Priory and stop for a drink at the cafe. Pour finir, cette randonnée était ok avec pas beaucoup de monde mais ce n’est définitivement pas une de mes randonnées préférés en Cumbria. Malheureusement elle n’est pas vraiment accessible aux chiens car il faudra porter les petits chiens ou alors il faut un chien qui saute haut. L’attrait de cette randonnée est le prieuré car le mur d’Hadrian n’est pas visible sur cette portion. Donc je recommanderai de juste visiter le prieuré et de vous arrêter au café. Have you visited Lanercost Priory before or the Hadrian Wall? Avez vous déjà visité le prieuré de Lanercost ou le mur d’Hadrian? Find all our walks in Cumbria on this page. Partager :Click to share on Pinterest (Opens in new window)Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window)Click to share on LinkedIn (Opens in new window)Like Loading... Related Categories Hiking•Tags Angleterre, Cumbria, England, Hiking, Hiking in Cumbria, Randonnée"
