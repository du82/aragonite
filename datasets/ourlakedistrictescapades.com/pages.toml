["https://ourlakedistrictescapades.com/2024/10/24/poem-2-a-marcus"]
title = "Poem 2 – A Marcus – Our Lake District Escapades"
description = "Poem written in french by Nicole Somprou and translated in English."
full_description = "Poem 2 – A Marcus Published on 24 October 202426 December 2024 by Mélodie En début d’année, je vous disais que j’avais envie de partager avec vous des articles sur diverses sujets et pas seulement nos randonnées. Ma mère écrit des poèmes comme loisirs et il y a quelques mois je vous en avais partagé un. At the beginning of the year I was telling you that I wanted like to share with you different type of posts and not just discuss walk. My mother sometimes writes poem as her hobby and a couple of months ago I shared one with you. Lisez son premier poème publié sur le blog ici. Pour ce deuxième poème elle a trouvé son inspiration lors de notre visite en France cet été et en voyant son petit fils. Nous espérons que vous aimerez. For this second poem, she was inspired by our visit to France this summer and seeing her grandson. We hope you will like it. Au fond c’est quoi un au revoir ?C’est ton sourire qui s’affirmePar-delà les étoiles qui braisillent de joie,il scintille sur les yeux de ta maman.Vos regards qui se cristallisentcomme des concrétions dans un jardin de cristal.Au fond c’est quoi un au revoir ?C’est une caresse qui graviteComme une marionnette autour de sa chevelure de jais.Vos baisers sur ta main qui palpitentDans les velours du silenceEt mes pas droits vers l’automne s’éternisentOù mon cœur s’achemine, ivre, vers le renouveau.Au fond c’est quoi un au revoir ?La ronde des sourires d’un bonheur inachevé.L’anneau d’espérance serti de joie, Une danse des âmes qui déracine les émotions.Un futur proche. Deep down what is a goodbye?It’s your smile that asserts itselfBeyond the stars that burn with joy,it sparkles in your mother's eyes.Your gazes which crystalliselike concretions in a crystal garden.Deep down what is a goodbye?It’s a caress that gravitatesLike a puppet around her jet-black hair.Your kisses on your throbbing handIn the velvets of silenceAnd my steps straight towards autumn drag onWhere my heart moves, drunk, towards renewal.Deep down what is a goodbye?The round of smiles of unfinished happiness.The ring of hope set with joy, A dance of souls that uproots emotions.A near future. Text and photo by Nicole Somprou, all right reserved. English translation by Our Lake District Escapades. Partager :Click to share on Pinterest (Opens in new window)Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window)Click to share on LinkedIn (Opens in new window)Like Loading... Related Categories Miscellenous•Tags nature, poem"
