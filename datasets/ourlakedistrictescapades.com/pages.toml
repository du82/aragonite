["https://ourlakedistrictescapades.com/2024/10/20/randonnee-dans-les-marais-fresnier-depuis-savenay-loire-atlantique-france"]
title = "Randonnée dans les marais Fresnier depuis Savenay – Loire Atlantique, France – Our Lake District Escapades"
description = "Petite randonnée familiale facile pour découvrir le lac de Savenay et les marais de Fresnier. Accessible aux chiens. English version available."
full_description = "Randonnée dans les marais Fresnier depuis Savenay – Loire Atlantique, France Published on 20 October 202415 December 2024 by Mélodie Petite randonnée familiale facile pour découvrir le lac de Savenay et les marais de Fresnier. A lovely familial walk to discover the lake of Savenay and the marshes of Fresnier. Information pour faire cette randonnée dans les marais de Fresnier, Savenay: Distance: 9 km Duration: 2h40 Niveau: Facile Parking: Parking “des bonnes sœurs”, Rte du Lac, 44260 Savenay, France, Gratuit Accessible aux poussettes: Non Accessible aux chiens: Oui Télécharger le fichier GPX et PDF Download the GPX file and PDF Lac de Savenay / Mabille Cet été nous sommes rentrés deux semaines et demi en France pour les vacances. Cette fois-ci nous avons décidé de prendre le tunnel sous la Manche au lieu du ferry pour tester. Pour être honnête ce je sais pas ce qui est le mieux. Les deux ont leur inconvénients et avantages (Peux être qu’il faudrait que je fasse un article dessus). This summer we went back to France for two weeks and half for our holiday. This time we have decided to take the tunnel under the sea instead of the ferry to test. To be honest, I am not sure which option I prefer. Both way have their own advantages and disadvantages (maybe I should write a blog post about this). Trouvez toutes les informations pour voyager au Royaume-Uni avec son chien ici. Barrage Nous avons commencé nos vacances en passant quelques jours chez les parents de Matt à côté de Nantes. L’un des matins avant qu’il ne fasse trop chaud, nous avons décidé d’aller visiter les Marais de Fresnier qui se situent à Savenay (une petite ville proche de chez les parents de Matt). We started our holiday by spending a couple of days at Matt’s parents near Nantes. One of the morning before it was too hot, we decided to visit the marshes of Fresnier that are located near Savenay (a small city near Matt’s parents). La randonnée que j’ai trouvé sur le site de Visorando commençait du lac de Savenay, que nous avons suivi pendant un petit moment avant d’aller vers les Marais. I found a walk in the Visorando website that was starting from the lake of Savenay, that we followed for a short time before going to the marshes. Tour pour observer les oiseaux Le lac de Savenay, aussi appelé lac de la vallée Mabille, est au milieu d’une base de loisirs contenant un accrobranche, une piscine, camping et pleins de sentiers de randonnées. Il y a également des tours d’observation pour oiseaux. C’est un endroit très agréable pour se promener en famille. The lake of Savenay, also called lake of the Mabille valley, is situated in a middle of an outdoor activity center containing a Go Ape, a swimming pool, campsite and several walking paths. There are as well several towers to observe the birds. It is really a nice area to walk in family. Il est possible de juste marcher autour du lac mais ce jour là nous avions envie d’explorer un peu plus, la matinée était belle et Marcus avait l’air bien dans le sac à dos. Ainsi à la fin du lac au lieu de remonter de l’autre côté du lac nous sommes partis tout droit en direction de la campagne et des marais. It is possible to just walk around the lake but that day we wanted to explore a bit more as the morning was beautiful and Marcus was well in the backpack. So at the end of the lake instead of walking back on the other side of the lake we went straight across the countryside to reach the marshes. Marais Cette partie de Loire Atlantique entre Cordemais et St Nazaire est réputé pour ses marais. Les marais de Fresnier sont un endroit spécial où les marcheurs et cyclistes côtoient les vaches et oiseaux tout en étant entouré d’une végétation spécifique des marécages. Mais les stars des lieux ce sont les cigognes qui ont élu résidence en haut des poteaux électriques. Certaines restent maintenant toute l’année et partagent ces lieux avec les hérons et autres oiseaux. This area of Loire Atlantique between Cordemais and St Nazaire is famous for its marshes. The marshes of Fresnier are a special place where the walkers and cyclists stand along the cows and birds while between surrounded by a marsh vegetation. But the stars of the place are the storks who have elected residence at the top of the electric posts. Some of the storks now stay all year around and share the place with the heron and other birds. Lisez nos articles sur l’Algarve au Portugal pour voir plus de cigognes. C’est par ici. Vue sur la campagne Vu qu’il était maintenant pratiquement 11h, que le soleil commençait à brûler et l’atmosphère était suffocant, nous avons décidé de raccourcir la randonnée et de repartir vers la voiture. Le chemin du retour se fît en longeant l’autre rive du lac qui était à l’ombre. L’après midi les températures atteignirent les 35C. As it was nearly 11h, that the sun was starting to burn and the atmosphere was suffocating, we decided to shorten the walk and walk back to the car. The way back was along the other side of the lake, which was in the shade. During the afternoon we reached a temperature of 35C. Connaissez vous cet endroit de Loire Atlantique? Do you know this area of the Loire Atlantique? Retrouvez tous nos articles de nos voyages en France sur cette page. Pour nos aventures au Royaume-Uni c’est par ici. Partager :Click to share on Pinterest (Opens in new window)Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window)Click to share on LinkedIn (Opens in new window)Like Loading... Related Categories France•Tags Dog friendly, France, Hiking, Loire atlantique, Randonnée"
