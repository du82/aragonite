["https://ourlakedistrictescapades.com/2024/09/29/road-trip-to-roa-island-and-bardsea-cumbria-england"]
title = "Road trip to Roa Island and Bardsea – Cumbria, England – Our Lake District Escapades"
description = "Short road trip to visit Roa Island and the beach of Bardsea in the South of the Lake District. Dog friendly. Version française disponible."
full_description = "Road trip to Roa Island and Bardsea – Cumbria, England Published on 29 September 20245 November 2024 by Mélodie A short road trip to visit Roa Island and the beach of Bardsea in the South of the Lake District. Petit road trip pour visiter l’île de Roa et la plage de Bardsea dans le sud de Park National du Lake District. Little boatyard on Roa Island On saturday morning beginning of July, Marcus woke up very early so we decided to put everyone in the car and go for a little road trip to visit the South of the Lake District. We don’t really know that area of Cumbria as it is a good 1h30 from our house. Un samedi matin début Juillet, Marcus se réveilla très tôt donc nous avons décidé de mettre tout le monde dans la voiture et de partir pour un petit road trip pour visiter le sud du Lake District. Nous ne connaissons pas vraiment cette partie de Cumbria car c’est à environ 1h30 de chez nous. Morecambe bay from Roa Island Looking at the map, we decided to drive to Barrow in Furness and then took the A5087 to follow of the Morecambe bay. Arriving in the little village of Rampside, we decided detour by Roa Island. We had never heard of Roa Island before that day, so we didn’t know what to expect. We parked at the little car park just after the bridge to go exploring on foot. En regardant la carte, nous avons décidé de conduire en direction de Barrow in Furness puis de prendre la A5087 pour suivre les bord de la baie de Morecambe. Arrivant au petit village de Rampside, nous avons décidé de faire un détour par l’île de Roa. Nous n’avions jamais entendu parler de Roa Island avant ce jour-là et n’avions donc aucune attente. Nous nous sommes garés sur le petit parking après avoir traversé le pont pour aller explorer à pied. RNLI base and Piel Island in front Roa Island is situated at the southermost point of the Furness Peninsula in Cumbria but it was before part of Lancashire. Until 1847, Roa was a true island, only accessible by boat and it was in 1840 that John Abel Smith decided to build a causeway that was finished in 1846. Currently, around 100 people live on Roa Island. The island is small but still nice for a little stroll to observe the sea. There is a little tearoom, a RNLI base and a ferry crosses several times a day to Piel Island. We were considering visiting Piel Island that day but that would have mean waiting a good hour for the first ferry and it was very windy. We will have to go back. Roa Island est situé le plus au sud de la péninsule de Furness en Cumbria et cette région faisait avant partie du département de Lancashire. Jusqu’en 1847, Roa Island était une vrai île car elle était seulement accessible en bateau et ce ne fût qu’en 1840 que John Abel Smith décida de construire une chaussée qui fût fini en 1846. De nos jours, environ 100 personnes vivent sur Roa Island. L’île est petite mais très agréable pour une promenade et observer la mer. Il y a un petit salon de thé, une base des secours maritime et un ferry qui amène plusieurs fois par jour sur l’île de Piel. Nous avons pensé visité Piel Island ce jour la mais cela voulait dire attendre une bonne heure avant la première traversée et il y avait pas mal de vent. Nous allons devoir y retourner. Houses on Roa Island Instead, we went back on the A5087 to drive towards Bardsea and then Ulverston. This road is lovely with great views on the Morecambe Bay. It has several parkings along it to stop and enjoy a walk on the beach. In one of them, we decided to stop to eat our sandwiches in the car while watching the sea. After this quick lunch, we went to explore the beach. The beach is very long with open view on the Morecambe bay and in the far distance Morecambe. There are some little sand dunes before accessing the sandy beach, which made a perfect play area for Skye as he was jumping up and down them. Unfortunately, the tide was coming so we only walked on the beach for a short distance before going back to the car. It was as well very windy and a bit cold. A la place de Piel Island, nous sommes repartis sur la A5087 et avons conduit en direction de Bardsea et puis Ulverston. La route est très joli avec de magnifiques vues sur la baie de Morecambe. Il y a plusieurs parkings le long de la route pour s’arrêter et profiter d’une promenade sur la plage. Sur l’un des parkings, nous nous sommes arrêtés pour manger nos sandwiches dans la voiture tout en regardant la mer. Après ce rapide lunch, nous sommes partis explorer la plage. La plage est assez longue avec une vue sur la baie de Morecambe et Morecambe au loin. Il y a des petites dunes de sable avant d’accéder la plage de sable, ce qui en fit un parfait endroit pour Skye. Il s’amusa à sauter et descendre de ces petites dunes. Malheureusement, la marée était en train de montée et nous n’avons pas pu marcher qu’une petite distance avant devoir repartir vers la voiture. Il faisait aussi assez froid et il y avait pas mal de vent. Beach near Bardsea We finished the day by driving through Ulverston before driving back home. It was a little road trip but very enjoyable and we discovered a new area of Cumbria. We will definitely go back to visit Piel Island and also do some walks around Bardsea and Ulverston. Pour finir la journée, nous avons traversé Ulverston avant de rentrer à la maison. C’était un petit road trip mais tout de même très agréable et nous avons découvert un nouvel endroit de Cumbria. Nous allons définitivement y retourner pour visiter Piel Island et aussi faire randonnées dans les environs de Bardsea et Ulverston. Have you been to Roa Island? Avez vous déjà visité Roa Island? Find more activities to do in Cumbria on this page and all our explorations of UK on this one. Partager :Click to share on Pinterest (Opens in new window)Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window)Click to share on LinkedIn (Opens in new window)Like Loading... Related Categories Activities•Tags Activities in Cumbria, Angleterre, Cumbria, Dog friendly, England, road trip"
