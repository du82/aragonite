  Summer Entertainment Guide: What to Watch and Read this Summer!











































  

  
  
                    
                                                                                                                                
                            
                        Armand and Louis in Interview With a Vampire                  

  


  





  The summer entertainment season is upon us! Many of our favorite TV shows are back, and there are a few movies we're excited about as well. Not to mention a flood of truly incredible books by many of our favorite authors. Here's our select guide to the stuff we're most pumped about this summer, and all the latest trends in entertainment.





















  
  












  Notes, citations, & etc.We're still waiting to learn who the next James Bond is going to beThe Outside Scoop podcastDeadpool and Wolverine is one of a handful of big movies this summerBorderlands is directed by Eli Roth and starring Cate BlanchettFuriosa is out now (and already tanked, sigh)The Crow starring Bill Skarsgård is finally hereInside Out 2 is also here!Doctor Who is also backInterview With the Vampire season two  is rocking our world.We Are Lady Parts returns on May 30 on PeacockStar Wars: The Acolyte is the long-awaited show from Leslye Headland (Russian Doll)Other new TV shows: House of the Dragon, Orphan Black: Echoes, The Umbrella AcademyBooks discussed include Escape Velocity by Victor Manibo, Archangels of Funk by Andrea Hairston, Yoke of Stars by R.B. Lemberg, The Book of Elsewhere by Keanu Reeves and China Mieville, The Stardust Grail by Yume Kitasei, Rakesfall by Vajra Chandrasekere, Navigational Entanglements by Aliette de Bodard, The Dead Cat Tail Assassins by P. Djeli Clark, The Mercy of Gods by James S.A. Corey, Glass Houses by Madeline Ashby, and Blackheart Man by Nalo Hopkinson





















  
  




  Charlie Jane AndersMay 30, 2024




  
