full_description = "Episode 146: Transcript Episode: 146: We Don’t Give a F*ck About CanonTranscription by KeffyCharlie Jane: [00:00:00] Annalee, we've been doing this podcast for nearly six years. Annalee: [00:00:05] I mean, is it really six years? Because I feel like we were in cryosleep for part of that time and like we had some AIs that like our uploads were doing it for a couple of years.Charlie Jane: [00:00:15] I mean, I think that the virtual versions of us were doing the podcast and that counts, you know?Annalee: [00:00:19] Okay. Yeah. Charlie Jane: [00:00:21] It's been since 2018. We've been doing it for six years. We're closing in on 150 episodes and it's like a lot to listen to. That's like, I don't even know how many hours that is. That's a lot of hours.Annalee: [00:00:31] never going to go listen to all of them, but I will make my upload listen to everything.Charlie Jane: [00:00:35] Okay. Annalee: [00:00:35] Over and over again. Charlie Jane: [00:00:38] Yeah, yeah, yeah. People sometimes ask me like, which episodes of our opinions are correct they should definitely check out like, which are the most important episodes of the podcast. Annalee: [00:00:46] Mm hmm. The most important are obviously all of the ones where we got to talk about pudding.Charlie Jane: [00:00:56] Pudding.Annalee: [00:00:56] I mean, people don't realize, how much of a through line pudding really is in this show.Charlie Jane: [00:01:02] Pudding is in the proof. Yeah, yeah. So, the point is, you're developing the OOAC canon. There are certain episodes that are part of the canon of the podcast. And then certain things are no longer canonical. Like, you know, there might've been a time five years ago when we expressed some opinions that we later realized are not as correct as we thought they were.Annalee: [00:01:21] The butterscotch pudding opinion.Charlie Jane: [00:01:23] I know, the butterscotch pudding opinion. That was terrible. And so, you know, there's some things that are more canonical about the podcast, some things that are less, and that makes me wonder, like why the heck do people love to argue about canon so freaking much? [00:01:37] And what does it mean to say that a story is canonical or that it's canonized? Is it a saint? Do we have to like bow to it every time we look at that story? [00:01:47] So today we're going to talk about the whole idea of canon and why it's such a weird thing to think about. And later in this episode, we'll be talking about tsunamis that happen on inland bodies of water, like lakes or creeks. And we'll be talking to Dr. Aggeliki Barberopoulou, who's a professor at Tufts University who has been researching the tsunamis triggered by the 2002 Denali earthquake in Seattle. [00:02:11] Okay. So, you're listening to Our Opinions Are Correct, and I'm Charlie Jane Anders. I'm a science fiction writer. I sometimes write comics. My most recent publication is a trade paperback of a mini-series called New Mutants: Lethal Legion. Annalee: [00:02:26] Dun, dun, dun. I'm Annlee Newitz. I'm a science journalist who writes science fiction. And my forthcoming book coming in June is called Stories Are Weapons: Psychological Warfare and the American Mind. And it is a nonfiction book. But I do talk quite a bit about science fiction in it. Charlie Jane: [00:02:46] So for our Patreon supporters, we'll be doing a mini episode next week where we talk about our favorite stories that will not or should not be considered canon. Like, you know, our favorite fanfic, our favorite weird media tie-in books, or just, stories that were kind of disavowed by the creators later on.Annalee: [00:03:04] And by the way, did you know that this podcast is entirely independent? Yeah, it's funded by you instead of billionaires who are eating weird space acorns that they genetically engineered out of their own DNA. That's right. We avoid all of that stuff because you are helping us through Patreon. And if you join our patreon at any level, whether it's five bucks or 20 bucks, you're just helping to make this podcast happen. [00:03:33] Plus you get mini episodes, you get to hang out with us in our Discord channel and hear more of my opinions about pudding. So, think about it, all of that could be yours for a few bucks a month, and anything you give goes right back into making our opinions more correct. So, find us at www.patreon.com/ouropinionsarecorrect.Charlie Jane: [00:03:55] I gotta say I'm really craving pudding now. All right, Annalee: [00:03:57] All right, let's start the Pudding Show! [00:04:06] [OOAC theme plays. Science fictiony synth noises over an energetic, jazzy drum line.]Charlie Jane: [00:04:35] Today we're going to be talking about the idea of canon. and you know there's actually two meanings to the word canon when it comes to science fiction and fantasy and I don't like either of them. So, the first meaning of canon usually has a the in front of it like the canon and it's this idea that there are particular works of science fiction and fantasy that are like essential or seminal that you can't claim to know about the genre unless you've read or seen certain things. [00:05:01] The other use of canon refers to continuity between a long-running or expansive series like which power ranger stories really happened and did every single episode of the Star Trek animated series really happen to Captain Kirk and Mr. Spock? And you know, it's funny, when I first started talking about the idea for this episode, I thought that I was just talking about canon as in continuity, whereas Annalee, you thought that we were talking about the canon as in essential works, and that made me realize that those two ideas are fundamentally kind of the same thing.Annalee: [00:05:36] Okay, I am prepared to hear your argument here. Why are they the same thing?Charlie Jane: [00:05:42] They’re both about what counts and what matters, and they're both about attempting to kind of corral an ever-expanding list of works into some semblance of order. And because there's an ever expanding list of works, like, more books are being published all the time, there's more Star Trek episodes all the time, goal becomes harder and harder to achieve, and they ultimately come down to, both versions of canon, ultimately come down to controlling something that you cannot control, that nobody can control. And the only purpose for this is really to kind of have a bunch of pointless fights that nobody can ever win. [00:06:18] So, okay, first of all, let's talk about the canon. Annalee, I'm going to send you a quote from a blog post from a few years ago from friend of the pod, John Scalzi. Annalee: [00:06:30] Who is, I would say, part of the canon. So this is what, Scalzi writes. [00:06:35] “As a practical matter, the science fiction canon is already dead. There are at least two generations of adults now and two generations of genre writers who didn't grow up on it and fundamentally don't care about it. Long gone are the days where a kid's first introduction to the genre was a Heinlein or Asimov novel, smuggled out of the adult section of the library or bookstore like Samizdat. [00:06:58] “The kids these days? They got their start reading genre through the YA section. They don't care about the canon. And why should they? What they grew up with was sufficient for what they needed, to be entertained when they became readers and fans, and to be inspired if they became creators or writers.” [00:07:14] So, I think that Scalzi is partly right here. I do think that there are many versions of what the canon is and that, you know, we don't have to start every discussion of science fiction anymore by saying like, no, we're not going to be talking about Arthur C. Clark and Isaac Asimov. Thank you very much. [00:07:37] But I think now, there's a new canon. The canon is evolving, but there's still institutions like the SF Masterworks series or American Library editions where certain writers are kind of elevated. [00:07:56] There's also the system of awards, for example, where certain writers get awards and I'm not just talking about like the Hugos and the Nebulas, which are sort of within the science fiction community awards, but like things like, getting like a major literary award, which some science fiction writers do, and I think is kind of a big deal. Octavia Butler got a MacArthur Genius Award, and I think she was the first science fiction writer to get one.Charlie Jane: [00:08:27] I think so, yeah.Annalee: [00:08:29] And, yeah, and so, and that was this big moment. So I think we do have a canon, or the canon, but it's shifting, it's changing, but.Charlie Jane: [00:08:42] It's fluid. Annalee: [00:08:45] It's more fluid, and I think realistically all canons are actually quite fluid, even if you teach in a literature department, you know that things that were considered part of the literary canon 50 years ago are now not as much anymore. And of course there's new authors who've entered, like Toni Morrison, like nobody would teach an English literature class that dealt with the 20th century and neglect Toni Morrison unless they were fools. Charlie Jane: [00:09:08] Very true, yeah. Annalee: [00:09:12] Yeah, but, but 50 years ago, of course, or even 30 years ago, that wouldn't have been the case.Charlie Jane: [00:09:16] Yeah, I mean, it's so true what you say about the SF Masterworks. It's so true. I'm looking at my shelves. I've got a bunch of those. I've got a bunch of these American, Library of America. Books of like Le Guin specifically, but at the same time if someone loves science fiction fantasy and hasn't read Le Guin I'm not gonna give them shit about it. I'm not gonna be like, well, you don't really know the genre. I’ll just be like well, you've got a treat in store for you whenever you get around to Le Guin because obviously she's amazing. But you could also just have read people who were influenced by her. [00:09:47] I think the thing that I like about what Scalzi says here is that every generation finds speculative fiction in its own way and kind of defines its own sense of what the canon is and like, you know, it's interesting. Scalzi wrote that blog post in like 2020, I think, and back then it was like, oh, people are finding… The kids are finding it through YA and like, it's already changed since then. Now it's TikTok. Annalee: [00:10:05] Yeah. Charlie Jane: [00:10:06] And now it's like romantasy, like books like Fourth Wing by Rebecca Yarros, which is, I double checked, it's not a YA book. It's actually marketed as an adult book. Annalee: [00:10:15] Rebecca Yarros was a, is a romance writer. Charlie Jane: [00:10:20] Right. Annalee: [00:10:20] That's kind of her jam. It's actually a really fun novel. I'm reading it right now.Charlie Jane: [00:10:23] Yeah, I know. And like, so, okay, Annalee. You have been a humanities professor in the past, and you're actually becoming one again, and when you think about questions of the canon, does this bring back some memories for you?Annalee: [00:10:35] Yes. It brings back a lot of traumatic memories from the 1990s when there was this moment, kind of like today in the United States where there were a lot of conservative attacks on higher education and a lot of hand-wringing over the fact that students were reading Black authors instead of reading like important white men from 2000 years ago, among other things. [00:11:02] And it really was like a kind of moral panic over what happens when the old literary canon often the canon that was codified in the early 20th century. So it was, like, a lot of things like Greek and Roman works, and European writing. What happens when that goes away? Like, does that mean that suddenly now nobody is educated and nobody really has critical thinking skills? [00:11:31] But luckily there were some really amazing pieces of writing and thought that came out of that period inspired partly by a scholar named Stuart Hall, a British scholar of cultural studies. He founded what's called the Birmingham School and he was arguing along with a lot of other critics that you know, we can apply critical thinking skills and, and the kind of readerly analysis, to almost anything in pop culture. [00:12:02] He famously wrote a series of essays about the astrology column in a local publication. And of course, he also wrote about literature. He wrote about, his own experiences as a Caribbean British guy dealing with, like, the British canon, but also coming from, a colonized place. [00:12:22] And so he was really interested in this idea that you can't really have a canon because in order to really understand your culture you have to appreciate the fact that people are participating in that culture from many different places, from many different positions, and also that what audiences love to watch or read is important to understand. [00:12:47] Like, so we should read Fourth Wing as well as reading, you know, Dickens, you know? Like, why don't we read Rebecca Yarros right alongside Charles Dickens and kind of figure out How these stories, say something about us as humans.Charlie Jane: [00:13:02] Yeah, and I did a little research about this, and it seems like the first idea of codifying a literary canon gets its most basic expressions in the mid-18th century. And there's a scholarly paper that we can link to in the show notes about that. people in the mid-18th century were really concerned with the question of, like, which authors were going to be quoted by Star Trek villains? Because they basically chose like Shakespeare and Milton were like the two authors. They were like, these are like the authors everybody has to read. [00:13:30] And of course, you know, you get to the Star Trek and like, that's what Khan and like various Klingons love to quote Shakespeare and Milton as well. And so that was the thing that they were really worried about the 18th century.Annalee: [00:13:42] But also Melville.Charlie Jane: [00:13:43] They didn't have Melville yet in the mid-18th century, but yes. That's true that Melville also is up there. Annalee: [00:13:49] I know, but that's funny that they were like, that was how they broke canon. They were like, oh, we're going to let like one American white guy be part of our canon.Charlie Jane: [00:13:55] Mm-hmm. Part of the Star Trek villain canon. [00:13:57] I feel like that is an important criteria. Like has this author been quoted by a Klingon general or by Khan? [00:14:05] But yeah, so, but I think that the canon first becomes like politicized and like a thing that we like yell about, in the 1960s which is the start of people starting to champion works by marginalized creators. And that's when the idea of the canon gets set in stone and to quote Jean Luc Picard, “To oppose something is to maintain it.”Annalee: [00:14:26] Yeah, I wonder if, and I would just add that Stuart Hall starts his career in the 1960s, so that he's kind of part of this revisionist view. And I think there might be something to the idea that in sp"
