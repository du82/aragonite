  Episode 166: Manufacturing Loneliness











































  

  
  
                    
                                                                                                                                
                            
                        cover art from Clipping’s album “Splendor and Misery”                  

  


  





  Are we getting toxic messages from speculative fiction about what it means to be alone? We're tackling troubling tropes and eviscerating myths about where loneliness comes from. Later in the episode, we're joined by Peter Pomeransev, a researcher who studies authoritarianism and propaganda. He’s the author of How to Win an Information War, and he offers us some tantalizing ideas about how to defeat fascist propaganda.





















  
  












