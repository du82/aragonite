                        Red at left: Annalee Newitz. Pink at right: Charlie Jane Anders. Photo credit: Sarah Deragon                  

  


  


 


  Annalee NewitzAnnalee writes science fiction and nonfiction. Most recently, they are the author of the novel The Terraformers, and the bestselling nonfiction science book Four Lost Cities: A Secret History of the Urban Age. Their other books include Future of Another Timeline, the Lambda Award-winning novel Autonomous, and the LA Times Book Prize-nominated book Scatter, Adapt, and Remember: How Humans Will Survive a Mass Extinction. They are a columnist for New Scientist, and their science journalism has appeared in the New York Times, Slate, the New Yorker, the Washington Post, the Atlantic, On the Media, Science Friday, and elsewhere. They were the co-founder of io9, and the editor-in-chief of Gizmodo. They were the recipient of a Knight Science Journalism Fellowship at MIT, and have a Ph.D. in English and American Studies from UC Berkeley.They’re also hard at work on a nonfiction book about psychological war in the U.S. for W.W. Norton, called Stories are Weapons.Follow them on Twitter or visit their website.Charlie Jane AndersCharlie Jane Anders is the author of the Unstoppable trilogy: Victories Greater Than Death, Dreams Bigger Than Heartbreak, and Promises Greater than Darkness. Recently she co-created a new Marvel superhero, Escapade, and is writing about her adventures in The New Mutants. Her other books include Never Say You Can’t Survive, The City in the Middle of the Night and All the Birds in the Sky, which won the Nebula, Crawford and Locus awards. She also wrote a novella called Rock Manning Goes For Broke and two short story collections called Even Greater Mistakes and Six Months, Three Days, Five Others. Her short fiction has appeared in Tor.com, Boston Review, Tin House, Conjunctions, the Magazine of Fantasy and Science Fiction, Wired Magazine, Slate, Asimov's Science Fiction, Lightspeed Magazine, ZYZZYVA, Catamaran Literary Review, McSweeney's Internet Tendency, and tons of anthologies. Her story "Six Months, Three Days" won a Hugo Award. She hosts the long-running Writers With Drinks reading series in San Francisco.She is also working on a new adult novel.Follow her on Twitter or visit her website.Veronica SimonettiVeronica Simonetti is the audio engineer, editor, and producer for Our Opinions Are Correct. As a freelancer, she’s mixed a number of other shows including America Dissected from Crooked Media and Please, Go On from The Washington Post. She’s the producer and editor of Rebecca Minkoff’s Superwomen. Veronica  mixed season two of Crooked’s Rubicon, and recently wrapped mixing for the first season of New Rules of Business and of Machine Visions. In addition to working on podcasts, Veronica has a large library of credits in music, audiobooks, and voiceovers. Some of the highlights include recording for Meklit Hadero, Kiran Gandhi, and Divi Roxx. She worked with Cleve Jones to record his book, When We Rise and has recorded voiceovers for National Geographic and Adobe. Veronica had the delight of preserving tapes for the Georgia O’Keeffe Museum and some of her fondest memories from Indiana University include recording Joshua Bell and many of the IU jazz ensembles. Veronica has been featured in Audio Media International Magazine, SoundGirls, and MassiveMusic. Follow her on Instagram or visit her website.Our Opinions Are Correct logo design is by Stephanie FoxMusical interludes are by Chris Palmer





















  
  



                         
      
  

  

  
    
              
  
  




