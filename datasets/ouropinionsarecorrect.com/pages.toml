  Episode 159: When Fiction Becomes a Microaggression (with Evelyn Douek)











































  

  
  
                    
                                                                                                                                
                            
                        In season two of Star Trek: The Next Generation, Dr. Pulaski insists on mispronouncing Data’s name, signifying that she doesn’t see him as a real person.                  

  


  





  When someone disrespects you in a subtle way, with plausible deniability, it can do just as much damage as overt bigotry. So we're talking about microaggressions — what they are, and how science fiction explores them but also perpetuates them. And later in the episode, we talk to Stanford professor Evelyn Douek about what's next for content moderation on the internet.





















  
  












  Notes, citations, & etc.Evelyn Douek is an Assistant Professor of Law at Stanford Law School.She co-hosts the Moderated Content podcast with Alex StamosThe poet laureate, Ada Limon wrote a poem in honor of the Europa Clipper last yearThe term “microaggression” was coined by Chester M. PiercePierce helped to create a new TV show called Sesame StreetPsychologist Derald Wing Sue wrote a series of papers about microaggressions in the 2000sHe came up with a taxonomy of microaggressions and wrote an influential book called Microaggressions in Everyday LifeA recent trend toward fantasy of manners showcases the power of microaggressionsOne recent example: To Shape a Dragon’s Breath by Moniquill Blackgoose





















  
  




  Charlie Jane AndersSeptember 5, 2024




  
