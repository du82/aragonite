sts the long-running Writers With Drinks reading series in San Francisco.She is also working on a new adult novel.Follow her on Twitter or visit her website.Veronica SimonettiVeronica Simonetti is the audio engineer, editor, and producer for Our Opinions Are Correct. As a freelancer, she’s mixed a number of other shows including America Dissected from Crooked Media and Please, Go On from The Washington Post. She’s the producer and editor of Rebecca Minkoff’s Superwomen. Veronica  mixed season two of Crooked’s Rubicon, and recently wrapped mixing for the first season of New Rules of Business and of Machine Visions. In addition to working on podcasts, Veronica has a large library of credits in music, audiobooks, and voiceovers. Some of the highlights include recording for Meklit Hadero, Kiran Gandhi, and Divi Roxx. She worked with Cleve Jones to record his book, When We Rise and has recorded voiceovers for National Geographic and Adobe. Veronica had the delight of preserving tapes for the Georgia O’Keeffe Museum and some of her fondest memories from Indiana University include recording Joshua Bell and many of the IU jazz ensembles. Veronica has been featured in Audio Media International Magazine, SoundGirls, and MassiveMusic. Follow her on Instagram or visit her website.Our Opinions Are Correct logo design is by Stephanie FoxMusical interludes are by Chris Palmer





















  
  



                         
      
  

  

  
    
              
  
  




