full_description = '''Damned If You Don’t Damned If You Don’ta film by Su Friedrich 42 minutes, B&W, USA, 1987, 16mm Languages: English, German Synopsis “‘Damned If You Don’t’ is Friedrich’s subversive and ecstatic response to her Catholic upbringing. Blending conventional narrative technique with impressionistic camerawork, symbols and voice-overs, this film creates an intimate study of sexual expression and repression. Featuring Peggy Healey as a young nun tormented by her desire for the sultry irresistible Ela Troyano. Plus Bonus Films RULES OF THE ROAD a film by Su Friedrich 31 minutes, Color, USA, 1993, 16mm ‘Rules of the Road’ is the story of a love affair and its demise through one of the objects shared by the couple: an old beige station wagon with fake wood paneling. Through spoken text, popular music and images from the streets of New York, ‘Rules of the Road’ takes a somewhat whimsical, somewhat caustic look at how our dreams of freedom, pleasure, security, and family are so often symbolized by the automobile. FIRST COMES LOVE a film by Su Friedrich 22 minutes, B&W, USA, 1991, 16mm Friedrich’s film is a sumptuous and deeply felt examination of the timeless ritual of marriage. Gorgeous footage of four traditional weddings captures the emotional ambiguities of a cultural event with which everyone is familiar. Reviews “‘Damned If You Don’t‘ is a real prize. Beautifully shot in black and white, it blends conventional narrative technique with impressionistic camerawork, symbols and voice-overs to create an intimate study of sexual expression and repression. The film is as hypnotic as a dream.” Andrew Rasanen, BAY WINDOWS “The film energizes feminist deconstruction by locating it within a context of at least two forms of (redirected) film pleasure: the excitement of melodramatic narrative and the sensuous enjoyment of cinematic texture, rhythm and structure.” Scott MacDonald, FILM QUARTERLY “Passionate, genuinely innovative…a lyrical evocation of the mystery of memory and the development of sexual identity.” Amy Taubin. THE VILLAGE VOICE Read more reviews Buy DVD+DSL w/ppr $450 Rights in perpetuity Buy DVD w/PPR $350 Schedule a Screening and Host a Filmmaker Q&A Home Video Streaming + DVD for Personal Use Buy Su Friedrich Collection 15 films – 1 low price Film’s Official Website ×Rent Damned If You Don't Your Name* First Last Email* Organization*Website* Planned Event Date (this can be changed)* MM slash DD slash YYYY Approximate Audience Size*What film do you want to show?*Is your screening in person or virtual? In Person Virtual Would you like to invite the filmmaker for a Q&A? Yes! That's exciting No thanks. Maybe next time Still thinking about it CAPTCHA Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 1, 'https://outcast-films.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_1').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_1');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_1').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_1').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_1').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_1').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ jQuery(document).scrollTop(jQuery('#gform_wrapper_1').offset().top - mt); }, 50 );if(window[