full_description = "Privacy Policy2020-10-21T10:01:23-04:00 Privacy PolicyOutcast Films is committed to protecting the privacy of our customers and website visitors. Currently, we do not collect or require “cookies” when visiting our website. Our internet service provider does provide us with the date and time when a visitor accesses our site, the visitor’s IP address and if a visitor followed a link from a previous site. Outcast Films does track visitor traffic and usage to help us improve our site’s effectiveness. Our site does does not automatically collect names and/or email addresses. When placing an order, a customer’s information resides on a secure server that only selected personnel have access to via encrypted password. All transactions, including with credit cards, are routed through SSL (Secure Socket Layers). We only record specific information (name, mailing address, email address, telephone number, billing information) only when given to us voluntarily by a customer. Outcast Films may use that information to alert you to new releases, special offers, updated information, and new services. Customers may opt out of such notifications at any time. We do not sell, rent, share or transfer names and addresses to any third parties. If you have any questions about our privacy policy, please contact us at info@outcast-films.com."
