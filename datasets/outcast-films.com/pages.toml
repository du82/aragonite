full_description = '''By Blood By BloodA film by Marcos Barbery & Sam Russell 53 minutes, color, USA, 2015 DVD includes: Closed Captions, Chapter Markers, Bonus Scenes Synopsis By Blood tells the story of the “freedmen”—African Americans who trace their lineage to freed slaves who became members of various tribes, including the Seminole and Cherokee Nation—in this troubling documentary. 150 years later, the Cherokee and Seminole Nations, now wealthy tribes with land, casinos and business holdings, continue to deny tribal rights to Freedmen descendants arguing that they are not members of their tribe “by blood.” Reviews “***By Blood is a troubling documentary. A thought-provoking film—with extras including bonus scenes—this is recommended. Video Librarian, Feb/March 2018 Read the full review here Buy DVD+DSL w/ppr $450 Rights in perpetuity Buy DVD w/PPR $350 Schedule a Screening and Host a Filmmaker Q&A Home Video Streaming + DVD for Personal Use Film’s Official Website Awards WINNER BEST DOCUMENTARY San Diego Black Film Festival WINNER BEST DOCUMENTARY Tulsa American Film Festival Screenings Cleveland International Film Festival Big Sky Documentary Film Festival Pan African Film Festival Reel World Film Festival San Diego Black Film Fest New Orleans Int. Film Festival Vail Film Festival Roxbury Int. Film Festival Tulsa American Film Festival Dead Center Film Festival Bare Bones Int. Film Festival ×Rent By Blood Your Name* First Last Email* Organization*Website* Planned Event Date (this can be changed)* MM slash DD slash YYYY Approximate Audience Size*What film do you want to show?*Is your screening in person or virtual? In Person Virtual Would you like to invite the filmmaker for a Q&A? Yes! That's exciting No thanks. Maybe next time Still thinking about it CAPTCHA Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 1, 'https://outcast-films.com/wp-content/pl