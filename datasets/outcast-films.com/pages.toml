full_description = '''Hide and Seek Hide and Seeka film by Su Friedrich 65 minutes, B&W, USA, 1996, 16mm DVD includes: English and Spanish Subtitles, Scene Selections, Two Bonus Films “Gently Down the Stream” and “But No One” Synopsis ‘Hide and Seek’ tells the story of Lou, a twelve year old girl coming to terms with her budding sexuality in the mid 1960’s. Her bittersweet tale is skillfully interwoven with clips from a wide array of scientific and educational films, as well as interviews with adult lesbians who recount their adolescent attractions to girls, how they felt when they first heard the word lesbian, where they fit in the butch/femme continuum, and their thoughts about how they became baby dykes. ‘Hide and Seek’ is for every woman who’s been to a slumber party and every man who wonders what went on at one. Plus Bonus Films GENTLY DOWN THE STREAM a film by Su Friedrich 14 minutes, B&W, USA, 1981, 16mm “‘Gently Down the Stream’ can be described about as easily as you can hold on to a handful of water. When the last image leaves the screen, you may not be able to say what you’ve seen, but you know what you’ve felt.” Stuart Klawans, The Nation BUT NO ONE a film by Su Friedrich 9 minutes, B&W, USA, 1982, 16mm “The visual material of ‘But No One’ corresponds to the waking world of the filmmaker, but it is cast in the form of a dream. Its compact constellation of repeated images is satisfying, an important part of Friedrich’s ongoing exploration of film’s ability to work like dreams and convey a unique, personal vision.” Janet Cutler, Women’s Experimental Cinema: Critical Frameworks Reviews “‘Hide and Seek’ is rueful, funny, multifaceted and sharply intelligent.”Stuart Klawans, THE NATION “‘Hide and Seek’ is ‘A Girl’s Own Story’ for lesbians. Friedrich has woven a rich and provocative tapestry that assaults complacent assumptions about pubescent desire and lesbian identity, all the while raising important questions about the representation of racial and sexual fantasy life…Thoroughly engaging from beginning to end.” Yvonne Rainer, filmmaker and Professor, UNIVERSTIY OF CA, IRVINE Buy DVD+DSL w/ppr $450 Rights in perpetuity Buy DVD w/PPR $350 Schedule a Screening and Host a Filmmaker Q&A Home Video Streaming + DVD for Personal Use Buy Su Friedrich Collection 15 films – 1 low price Film’s Official Website ×Rent Hide and Seek Your Name* First Last Email* Organization*Website* Planned Event Date (this can be changed)* MM slash DD slash YYYY Approximate Audience Size*What film do you want to show?*Is your screening in person or virtual? In Person Virtual Would you like to invite the filmmaker for a Q&A? Yes! That's exciting No thanks. Maybe next time Still thinking about it CAPTCHA Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 1, 'https://outcast-films.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_1').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_1');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_1').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_1').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_1').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_1').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ jQuery(document).scrollTop(jQuery('#gform_wrapper_1').offset().top - mt); 