full_description = '''Shored Up Shored UpA film by Ben Kalina 84 minutes, color, USA, 2013 DVD includes: Closed Captions, Chapter Markers, Subject Selections Synopsis When Superstorm Sandy devastated the East Coast, it was a wake up call to a new reality. “Shored Up” takes us to the heart of this climate change controversy, following communities in New Jersey and North Carolina where politics, economics and science collide. Beginning 3 years before Sandy hit and following the debates over beach replenishment and other attempts to hold back the sea, “Shored Up” is a convincing call for action along our coasts. As the oceans rise and storms flood our towns and cities, we have a choice to make: do we continue to develop as we have in the past, ignoring clear risks and danger? Or, do we allow science to guide our policies for the future…before it’s too late? Reviews “Highly Recommended. ‘Shored Up’ excels at showing the conflicting interests at play. It provides a great overview of the effects that climate change is having on coastal communities and provides a disturbing portrait of how those who have economic interests in these areas have their heads in the sand, so to speak.” EMRO Read the full review here “Recommended. ‘Shored Up’ features an impressive array of interviewees on all sides of the issue, but clearly represents the view that this problem—exacerbated by climate change—will only worsen, and that serious fact-based discussion should become an urgent priority among decision-makers and the general public.” Frank Swietek, Video Librarian Read the full review here “Efforts to restore beaches with costly sand-reclamation projects are wiped out when devastating storms hit the region. Experts debate questions of who should finance beach-replenishment projects and the wisdom of continuing to develop and build houses on endangered coastal regions. This thought-provoking video sparks discussion for environmentalists and those directly affected by beach erosion.” Booklist Review Read the full review here Read more reviews Buy DVD+DSL w/ppr $450 Rights in perpetuity Buy DVD w/PPR $350 Schedule a Screening and Host a Filmmaker Q&A Home Video Streaming + DVD for Personal Use Film’s Official Website ×Rent Shored Up Your Name* First Last Email* Organization*Website* Planned Event Date (this can be changed)* MM slash DD slash YYYY Approximate Audience Size*What film do you want to show?*Is your screening in person or virtual? In Person Virtual Would you like to invite the filmmaker for a Q&A? Yes! That's exciting No thanks. Maybe next time Still thinking about it CAPTCHA Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 1, 'https://outcast-films.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_1').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_1');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_1').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_1').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_1').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_1').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ jQuery(document).scrollTop(jQuery('#gform_wrapper_1').offset().top - mt); }, 50 );if(window['gformInitDatepicker']) {gformInitDatepicker();}if(window['gformInitPriceFields']) {gformInitPriceFiel