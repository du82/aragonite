full_description = '''Sink or Swim Sink or Swima film by Su Friedrich 48 minutes, B&W, USA, 1990, 16mm DVD includes: English, French, Spanish and German Subtitles, Scene Selections, and Two Bonus Films “Cool Hands, Warm Heart” and “Scar Tissue” Synopsis A contemporary classic and a landmark in autobiographical filmmaking, “Sink or Swim” is an unflinching account of the highly charged relationship between a daughter and her father. Through a series of twenty-six short stories, a young girl chronicles the childhood events that shaped her ideas about fatherhood, family relations, work and play. As the stories unfold, a dual portrait emerges: that of a father who cared more for his career than for his family, and of a daughter who was deeply affected by his behavior. Working in counterpoint to the forceful text are sensual black and white images that depict both the extraordinary and ordinary events of daily life. This formally complex and emotionally intense film is fraught with tension, ambivalence and love. Plus Bonus Films COOL HANDS, WARM HEART 16 minutes, Color, USA, 1979, 16mm “Filmed on the streets of New York’s Lower East Side, ‘Cool Hands, Warm Heart’ creates a unusually original vision. Friedrich builds on proverbs, metaphor, and the principles of a radical feminist imagination, creating a world in which women’s private rituals become public spectacles.” B. Ruby Rich, author, Chick Flicks SCAR TISSUE 12 minutes, B&W, USA, 1978, Super 8 “…powerful and economic. Setting out to film street activity, Friedrich ends up with basically two images – women’s legs skittering in high heels, and men’s midsections, hands folded self-righteously across stuffed shirts or planted belligerently in pockets¯the film left me with a yen to see one of those heels planted splat in the middle of one of those bellies.” Amy Taubin, The Village Voice Reviews “Tough-minded and touching…affecting and accessible.” Caryn James, New York Times “Wonderfully accessible…funny and sad. Splendid.” Janice Berman, New York Newsday “Proudly personal and triumphantly artisanal, as accessible as it is uncompromising.” J. Hoberman, Premiere Buy DVD+DSL w/ppr $450 Rights in perpetuity Buy DVD w/PPR $350 Schedule a Screening and Host a Filmmaker Q&A Home Video Streaming + DVD for Personal Use Buy Su Friedrich Collection 15 films – 1 low price Official Film Site ×Rent Sink or Swim Your Name* First Last Email* Organization*Website* Planned Event Date (this can be changed)* MM slash DD slash YYYY Approximate Audience Size*What film do you want to show?*Is your screening in person or virtual? In Person Virtual Would you like to invite the filmmaker for a Q&A? Yes! That's exciting No thanks. Maybe next time Still thinking about it CAPTCHA Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 1, 'https://outcast-films.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_1').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_1');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_1').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_1').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_1').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_1').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ jQuery(document).scrollTop(jQuery('#gform_wrapper_1').offs