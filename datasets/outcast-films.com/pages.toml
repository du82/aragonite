full_description = '''15 to Life 15 to Life: Kenneth’s StoryA film by Nadine Pequeneza 52 minutes, color, Canada, 2014 DVD includes: Closed Captions, Chapter Markers, Bonus Scenes Synopsis The United States is the only country in the world that routinely condemns children to die in prison. This is the story of one of those children, now a young man, seeking a second chance in Florida. At age 15, Kenneth Young received four consecutive life sentences for a series of armed robberies. Imprisoned for more than a decade, he believed he would die behind bars. Now a U.S. Supreme Court decision could set him free. “15 to Life: Kenneth’s Story“ follows Young’s struggle for redemption, revealing a justice system with thousands of young people serving sentences intended for society’s most dangerous criminals. Reviews “Highly recommended…this is a powerful and disturbing documentary.” ~ Video Librarian Read the full review here “Recommended. This thought-provoking program will stir discussions about the criminal-justice system and the prevalence of teenagers “serving sentences intended for society’s most dangerous criminals.” ~ Booklist Read the full review here “Recommended . This cutting edge film will bring the viewer into a discussion and evaluation of whether our nation’s juvenile justice system needs to be revised or modified when it comes to adult waiver. Waiver is the procedure of adjudicating a minor as an adult and exposing them to the full extent of the adult criminal process and correctional system. America’s juvenile system is only slightly over 100 years old, but may be in need of revision. ~ EMRO Read the full review here “Harrowing. . . . Depicts a justice system that only perpetuates the sort of violence it was intended to keep in check.” ~ Nina Liss-Schultz, Mother Jones Buy DVD+DSL w/ppr $450 Rights in perpetuity Buy DVD w/PPR $350 Schedule a Screening and Host a Filmmaker Q&A Home Video Streaming + DVD for Personal Use Film’s Official Website ×Rent 15 to Lif