full_description = '''The Ties That Bind The Ties That Binda film by Su Friedrich 55 minutes, B&W, USA, 1984, 16mm DVD includes: English and German subtitles, Chapter Markers and Bonus Film “The Lesbian Avengers Eat Fire, Too” Synopsis “The Ties That Bind” is a powerful meditation on political responsibility and personal loss as seen through the story of the filmmaker’s mother, who grew up in Nazi Germany. Using rare archival footage, extensive interviews and critical commentary, Friedrich constructs a fearless dialogue between past and present, between mother and daughter. “The Ties That Bind” engages in a profound search for an understanding of history, and challenges us in our responsibility for the present. THE LESBIAN AVENGERS EAT FIRE, TOO a film by Su Friedrich, co-directed by Janet Baus 55 minutes, color, USA, 1993, Video This film documents the first year of actions by The Lesbian Avengers, a group of bold and brazen New York City activists fighting for recognition and equal rights for lesbians everywhere. We recruit! Plus Bonus Feature Film Reviews “‘The Ties That Bind’ is one of the most moving and profound films about the mother-daughter relationship. Blending documentary and experimental modes, Friedrich investigates her mother’s background as a German citizen during WWII–an issue that has vexed her daughter during her youth. While her mother is shown on-screen and is heard acoustically, the filmmaker remains “silent” but voices her thoughts through titles scratched into the film emulsion. In so doing, Friedrich creates a beautiful and powerful film in the tradition of Michelle Citron’s earlier ‘Daughter Rite.’ Lucy Fischer, Professor, University of Pittsburgh “The best of New Directors/New Films…The film is an original, a moving and courageous tribute from a child to a mother’s beleaguered memory.” David Edelstein, Village Voice “On every level, Friedrich’s films are resonant with thought and craft.” Scott MacDonald, Film Quarterly Buy DVD+DSL w/ppr $450 Rights in perpetuity Buy DVD w/PPR $350 Schedule a Screening and Host a Filmmaker Q&A Home Video Streaming + DVD for Personal Use Buy Su Friedrich Collection 15 films – 1 low price Official Film Site ×Rent The Ties That Bind Your Name* First Last Email* Organization*Website* Planned Event Date (this can be changed)* MM slash DD slash YYYY Approximate Audience Size*What film do you want to show?*Is your screening in person or virtual? In Person Virtual Would you like to invite the filmmaker for a Q&A? Yes! That's exciting No thanks. Maybe next time Still thinking about it CAPTCHA Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 1, 'https://outcast-films.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_1').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_1');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_1').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_1').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_1').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_1').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ jQuery(document).scrollTop(jQuery('#gform_wrapper_1').offset().top - mt); }, 50 );if(window['gformInitDatepicker']) {gformInitDatepicker();}if(window['gformInitPriceFields']) {gformInitPriceFields();}var current_pag