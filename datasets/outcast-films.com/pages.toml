full_description = '''Riot Acts Riot ActsA film by Madsen Minax 72 minutes, color, USA, 2009 DVD includes: Closed Captions, Chapter Markers, Bonus Scenes Synopsis “Riot Acts” is a “trans-fabulous” rockumentary representing the multi-dimensional lives of transgender and gender variant musicians. A first-hand perspective of the intersections between gender performance and stage performance, “Riot Acts” suggests that identities and bodies are undeniably political, and the journey within a trans experience isn’t always one of tragedy, but one of creativity and joy. Reviews “What director Madsen Minax doesn’t do is label the performers. ‘Riot Acts’ spotlights and identifies the names of a wealth of artists…but the movie never tries to shoehorn them into the biology-is-destiny square pegs of mainstream mediaspeak…’Riot Acts’ is one of those few documentaries that succeeds because of what it choose not to tell you.” Baltimore City Paper “‘Riot Acts’ enthusiasm is infectious!”Jason Barker, London Lesbian & Gay Film Festival “‘Riot Acts’ discusses the realities of being a trans musician with the kind of candidness that only a ‘by us for us’ project allows…!” Baltimore Radar Read more reviews Buy DSL w/ppr $450 Rights in perpetuity Schedule a Screening and Host a Filmmaker Q&A Home Video Streaming for Personal Use ×Rent Riot Acts Your Name* First Last Email* Organization*Website* Planned Event Date (this can be changed)* MM slash DD slash YYYY Approximate Audience Size*What film do you want to show?*Is your screening in person or virtual? In Person Virtual Would you like to invite the filmmaker for a Q&A? Yes! That's exciting No thanks. Maybe next time Still thinking about it CAPTCHA Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 1, 'https://outcast-films.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_1').on('load',functi