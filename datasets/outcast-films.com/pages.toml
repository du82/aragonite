full_description = "More Reviews The Odds of Recovery More Reviews – The Odds of Recovery “Over the years, Friedrich has blazed a path for a different kind of filmmaking—and a different kind of filmgoing experience. Lyrical, poetic, passionate and innovative, Friedrich’s films are among the most rewarding cinematic delicacies you’ll ever find.”Jenni Olson, Bay Area Reporter “…the deft interplay of voices, words and images creates a steady accretion of metaphors and insights that are sharp and multilayered. While Friedrich effectively critiques Western medicine and demonstrates exhilarating filmmaking skills, its true achievement is as self-portraiture, boldly revealing a woman in all her difficult, naked complexity.” Holly Willis, LA Weekly Return to The Odds of Recovery 2017-02-21T16:46:00-05:00"
