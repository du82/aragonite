["https://outcast-films.com/about-us"]
title = "About Us | Outcast Films"
full_description = "About Us2021-09-14T18:48:29-04:00 ABOUT USOutcast Films is a film distribution company focused on environmental and social justice issue films. We work with teachers, librarians, and community leaders to educate and empower their audiences on issues that impact all of us. Founded in 2004, Outcast Films has worked with acclaimed directors, first-time filmmakers, and Academy Award® winning producers including David Heilbroner and Kate Davis (Say Her Name: The Life and Death of Sandra Bland, Southern Comfort); Su Freidrich (Sink or Swim, Hide and Seek, The Ties That Bind); Rachel Boynton (Our Brand is Crisis, Big Men); and Deia Schlosberg (The Story of Plastic, How to Let Go of the World and Love All the Things Climate Can’t Change); and many more. Through our films, we connect viewers and filmmakers to generate dialogue and effect positive change for a better world. Learn more about our collection of films here. For sales and screening inquiries, email us at – info@outcast-films.com KEY PERSONNEL: Vanessa Domico – Founder/PresidentVanessa brings over 25 years of business experience in both the corporate and non-profit sectors. After receiving her BS in Film Studies from the University of Pittsburgh and a MFA in Photography from Cornell, Vanessa transitioned to the business side of filmmaking by joining the team of WMM (Women Make Movies), first as the Marketing and Distribution Director and eventually holding the position of Deputy Director. Vanessa has worked hard to raise awareness around important social justice and environmental issues including tolerance, racism, rising sea levels, and basic human rights. Most recently, Vanessa worked with Academy Award nominated filmmakers David Heilbroner and Kate Davis on their HBO Documentary Films release “Say Her Name: The Life and Death of Sandra Bland” and the Academy Award nominated documentary short “Traffic Stop.” VIRTUAL INTERNSHIPSMARKETING INTERNOutcast Films is currently seeking a qualified intern with strong work ethics and communication skills to assist us in our marketing and promotion outreach. MARKETING INTERN JOB DESCRIPTION: Researching print and online publications including journals, books, articles, and blogs Organize and collate contact information and mailing lists into contact management systems Assist in the distribution or delivery of marketing materials Provide support to social media efforts Perform extensive online subject area research REQUIREMENTS: For all internships, the candidates must have excellent communication, computer and writing skills; Should have excellent organizational skills and be detail oriented; Insightful knowledge of progressive environmental and social issues a big plus! We also require that you have a faculty adviser support you so that they can assist Outcast Films in making this the best educational experience for you. This is an excellent opportunity for anyone studying film, communications or marketing. Because all of our internships are virtual, you can work from wherever you like, whenever you like, as long as you have access to a computer. All Outcast Films internship positions are unpaid, however, there are some perks involved especially if you live in NYC. Work hours are flexible but requires a minimum of 4 hours/week or a minimum of 200 total hours. Please send cover letter and resume by email to info@outcast-films.com. No phone calls please. Don’t forget to tell us to which internship you are applying!"
