full_description = '''Growing Up Coy Growing Up CoyA film by Eric Juhola 82 minutes, color, USA, 2015 DVD includes: Closed Captions, Chapter Markers, Deleted Scenes Synopsis In a highly conservative Colorado town, a pink-loving, pig-tailed six-year-old girl named Coy becomes the unlikely poster child for transgender rights, in a 2013 landmark case that is reverberating in state courts across the country. Although she was born as a boy in a set of triplets, Coy’s gender identity was evident even as a toddler, leading her parents, Kathryn and Jeremy, to accept her early on as the girl she wished to be. At first their school is very supportive, but midway through Coy’s first-grade year, they ban her from using the girls’ bathroom. Infuriated and fearing for their child’s safety, Kathryn and Jeremy decide to fight the school’s decision (which defies Colorado’s anti-discrimination law), despite the further attention they know it will draw to Coy’s gender status. They engage the Transgender Legal Defense and Education Fund, led by civil rights attorney Michael D. Silverman, who take their case, and the international media firestorm it generates is fast and often extremely furious. For a family with five children under the age of nine—including the triplets, a very young child, and a daughter with severe cerebral palsy—the strain is enormous. Throughout Eric Juhola’s intimate documentary, we feel the fraught tension between Kathryn and Jeremy’s need to protect their privacy and their child’s innocence and the need to fight for Coy’s rights—as well as the rights of the “thousands of Coys out there.” Joanne Parsont, Framline Reviews “The film could not be timelier, with transgender issues at the fore…” Read the full review Cara Buckley, New York Times “…beyond becoming an important historical document, the film provides unique insight into what anyone who dares to stand up for their rights must endure when their fight becomes public” Stephen Saito, The Moveable Feast “A sympathetic, of-the-moment doc…” The Hollywood Reporter “…urgent viewing…more than a simple advocacy film…” Nigel Smith, The Guardian Read more reviews Buy DVD+DSL w/ppr $450 Rights in perpetuity Buy DVD w/PPR $350 Schedule a Screening and Host a Filmmaker Q&A Home Video Streaming + DVD for Personal Use Film’s Official Website Past screenings Human Rights Watch Festival Film Frameline Film Festival Austin Gay & Lesbian Int’l Film Festival Atlantic Film Festival Palm Springs Gay & Lesbian Film Festival Raindance Film Festival BendFilm Festival Vancouver International Film Festival New Orleans Film Festival Tallgrass Film Festival Louisville LGBT Film Festival Mezipatra Queer Film Festival Ojai Film Festival Rainbow Visions Film Festival Mix​ ​Brasil Festival of Diversity Denver Film Festival Rocky Mountain Women’s Film Festival NewFest at The Center Presents Utah Film Center ×Rent Growing Up Coy Your Name* First Last Email* Organization*Website* Planned Event Date (this can be changed)* MM slash DD slash YYYY Approximate Audience Size*What film do you want to show?*Is your screening in person or virtual? In Person Virtual Would you like to invite the filmmaker for a Q&A? Yes! That's exciting No thanks. Maybe next time Still thinking about it CAPTCHA Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 1, 'https://outcast-films.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_1').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_1');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_1').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confir