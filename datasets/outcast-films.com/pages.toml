full_description = "The Films of Su Friedrich The Films of Su FriedrichTHE FILMS OF SU FRIEDRICH 7 VOLUME COLLECTION OF 15 FILMS IS NOW AVAILABLE ON DVD+DSL FOR ONE LOW COST! StreamBuy DVDVolume 1 THE TIES THAT BIND (55 mins, 1984) A powerful and meditative film on the political responsibility and personal loss as seen through the story of the filmmaker’s mother who grew up in Nazi Germany. with Bonus Film: THE LESBIAN AVENGERS EAT FIRE, TOO co directed with Janet Baus (55 mins, 1993) StreamBuy DVDVolume 2 DAMNED IF YOU DON’T (42 mins, 1987) Friedrich’s subversive and ecstatic response to her Catholic upbringing. with Bonus Films: RULES OF THE ROAD (31 mins, 1993) FIRST COMES LOVE (22 mins, 1991) StreamBuy DVDVolume 3 SINK OR SWIM (48 mins, 1990) A contemporary classic and a landmark in autobiographical filmmaking, SINK OR SWIM is an unflinching account of the highly charged relationship between a daughter and her father. with Bonus Films: COOL HANDS, WARM HEART (16 mins, 1979) SCAR TISSUE (6 mins, 1979) StreamBuy DVDVolume 4 HIDE AND SEEK (65 mins, 1996) The story of Lou, a twelve year old girl coming to terms with her budding sexuality in the mid 1960’s. with Bonus Films: GENTLY DOWN THE STREAM (14 mins, 1981) BUT NO ONE (9 mins, 1982) StreamBuy DVDVolume 5 THE ODDS OF RECOVERY (65 mins, 2002) Friedrich turns the camera on herself as a way to analyze her chances for a happier, healthier life. with Bonus Film: THE HEAD OF A PIN (21 mins, 2004) StreamBuy DVDVolume 6 SEEING RED (27 minutes, 2005) In this, one of her most deeply personal films to date, Friedrich takes a look back at her evolution both as a woman and as an artist, tackling her own insecurities via several on-camera diary entries. StreamBuy DVDGUT RENOVATION (81 minutes, 2012) A documentary of small changes evolves into an historical record of New York. The resulting film is a melancholy, essayistic requiem for a neighborhood and an entire way of life; it also provides a case study of the rapid gentrification of our cities. Institutional Purchase All 15 Films Buy DVD+DSL w/PPR $995 Rights in perpetuity Home Video $109 All 15 Films DVDs for Personal Use Only Stream Individual Films Personal Use Only 2022-02-23T17:34:25-05:00"
