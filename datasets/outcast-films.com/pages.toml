["https://outcast-films.com/how-to-order"]
title = "How to Order | Outcast Films"
full_description = "How to Order2024-05-30T10:08:59-04:00 QUICK LINKS DSL Terms Online Orders Sales Tax Shipping Information Why We Charge for Screenings How Screenings Work Host Your Own Screening Commercial Screenings Corporate and Government Screenings Non-profit and Community Group Screenings What is PPR? Copyright and Usage Information How to OrderThank you for your interest in Outcast Films and our collection of award-winning titles. Below you will find useful information on how to place a DVD or DSL (digital site license) order, stream a film online, and how to rent a film for a screening. If you have additional questions, please feel free to contact us at info@outcast-films.com and we will be more than happy to assist you. PREVIEWS: We offer all our institutional buyers, programmers and members of the press free online previews for all our films. Please email with your inquiry and we will send you the link and password to watch the film online. DVD + DSL ORDERS FOR INSTITUTIONAL BUYERS: All our films are available on DVD and have closed captions. You may also purchase a Digital Site License (DSL) along with the DVD as a value package. Outcast Films offers institutional buyers streaming licenses in perpetuity of a film purchased at full list price. When you purchase the DVD+DSL, you will be sent a DVD as well as an email with a link and password so that you can download the film from our Vimeo account. You will have several file options to download the film which should accommodate most file storage systems. DSL TERMS OF AGREEMENT: The licensing institution must purchase a fully licensed copy of the film(s) for their permanent collection at list price. Content may not be altered or edited in any manner. Digitized material is for synchronous or asynchronous streaming only and content may not be copied to any other format or used for any purpose not outlined in this agreement. The Digital Materials covered by the DSL must be hosted on a single, password- protected server under the jurisdiction of your school without the ability of a user to download the file. Licensees may then deliver the contents of these files via password-protected digital streaming only to registered students, accredited researchers, faculty, and staff of that institution and the occasional walk-in user. This license is for synchronous (live) or asynchronous (multiple-user, video-on- demand format) streaming access only. Any copying, editing, or altering of the Digital Materials, wholly or in part, by any persons or automated processes (except to accomplish the transfer the Materials from Licensor to your school and for your school to mount the Materials on its streaming media system) is strictly prohibited. The term of this license shall be in perpetuity. THE FILM MAY NOT BE UPLOADED OR BROADCAST TO AND FROM YOUTUBE, FACEBOOK, VIMEO, ZOOM, OR ANY OTHER COMMERCIAL STREAMING PLATFORM. The film and video content of the Digital Materials is protected by United States copyright law. Duplication, reproduction, alteration, television broadcast or cablecast (except for on-campus closed circuit), loaning for a fee, leasing, sublicensing to others or use for any commercial purposes (i.e., charging admission) is strictly prohibited without express written permission from Licensor. Nothing in this Agreement shall be interpreted to diminish the rights and privileges of the Licensee or Authorized Users with respect to any of the Licensed Materials, including exceptions or limitations to the exclusive rights of copyright owners, such as fair use, under Section 107 of the U.S. Copyright Act. Any breach of the above terms will result in immediate cancellation. SALES TAX: We are required by law to collect sales tax for all orders shipped to Pennsylvania only. If you are a Pennsylvania accredited tax exempt organization, you must email us your ST-119 (http://www.tax.ny.gov/pdf/current_forms/st/st119_2_fill_in.pdf) tax exempt form. If we do not have your ST119 on file, we must charge you sales tax. Sales tax charges will not be reimbursed after the invoice has been paid, so please send us the form at the time you place your order. If you have already submitted your form, it will be kept on file for future use. ON-LINE ORDERS: Order DVDs and DSLs online with PayPal using our secure shopping cart. SHIPPING INFORMATION: All orders will be shipped within 3 business days on receipt of order. If you would like expedited shipping, rush charges will apply. See below for details. Domestic Shipping Information: Free shipping on orders of $350 or more. For orders under $350, 1 DVD = $5 flat. For each additional DVD add $3. Please note: The Su Friedrich Collection (15 films on 7 DVDs) will count as 7 DVDs so the shipping charge will be $25. Rush Shipping: Please add $75 for 2 day shipping. International Shipping: All international orders must be prepaid in U.S. dollars in advance of shipment. Additional shipping fees for international orders will apply. Please add $25 for the first title and $8 for each additional title. Canadian orders add $12. International 2 day rush service is available for an additional $150. Sorry, there is no international overnight shipping available. WHY WE CHARGE FOR SCREENINGS:Outcast Films’ core mission is to connect producers and their films with audiences to generate dialogue and foster progressive change. The fees we charge for screenings help to support these filmmakers so that they can continue making new films. We understand some organizations may have limited funds to pay for screenings, and that is why we are glad to work with you directly to accommodate your budget. To get started for scheduling your in-person or virtual event, find the film you want, and select the “Schedule a Screening” button. Someone will be in touch with you within 24 hours. HOW SCREENINGS WORK:We offer two options for our screenings: 1) Live Virtual Events, where Outcast Films staff will oversee producing and managing your virtual screening in collaboration with you. 2) Host Your Own Screening, an option where you rent a film for an in-person or virtual screening. If hosting a virtual screening, Outcast Films will make the film available to you on our Vimeo streaming platform. HOW LIVE VIRTUAL EVENTS WORK: Outcast Films offers live virtual events for all non-profit organizations, institutions, corporations, and government agencies. A Live Virtual Event is produced from the Outcast Films studio offices with the capability of broadcasting the live stream out to an unlimited global audience. Live Virtual Events include streaming the film and a live Q&A with the filmmaker. Optional features include organizing online panel discussions for up to 4 people, live graphics, live audience chat and poll questions. Costs are determined by the specifics of your event, but there is a minimum $1500 fee. If you would like to arrange for a private, exclusive Live Virtual Event, please send your inquiry to info@outcast-films.com. HOST YOUR OWN SCREENING:Host Your Own screenings can be either virtual or in-person. Your event must be scheduled at least three weeks in advance of your planned event date. If hosting a virtual screening, Outcast Films will make the film available to you on our Vimeo streaming platform. Outcast will give you a link and password after payment is received and at least 1 week prior to your screening. The password will be activated 3 days prior to your event and will stay active 3 days after your planned event date. You will be able to share the link and password with your members as soon as you receive it from Outcast. If you would like to arrange a Q&A with the filmmaker via a platform such as Zoom, please let us know when you complete the request form. Additional fees will apply to help support the filmmakers, which is a mandate of our mission. All final costs will be determined by the specifics of your event. To get started for scheduling your in-person or virtual event, find the film you want, and select the “Schedule a Screening” button. Someone will be in touch with you within 24 hours. BUDGET CONCERNS?If you work for a small non-profit, faith-based organization, activist or impact group, or are a K-12 administrator or teacher, you may qualify for one of our multi group live events which can be found on our Events calendar. To get started, select the specific screening you want, then fill out the information requested so you can reserve your organization’s spot for the event. We will respond to your RSVP within 24 hours to confirm the booking and give you follow-up information about how to access the event. If you do not see an event date that works for you on our Events calendar, please send us an email to info@outcast-films.com to learn how to organize your own multi group event. COMMERCIAL SCREENINGS:If you are interested in having a commercial screening, that includes charging admission, please send your inquiry to info@outcast-films.com. CORPORATE & GOVERNMENT SCREENINGS:If you are a corporation or government agency interested in having a screening, find the film you want, and select the “Schedule a Screening” button. Someone will be in touch with you within 24 hours. NON-PROFIT AND COMMUNITY GROUPS:If you are an activist or impact organization, community group, faith-based organization or other non-profit group and want to use the film for educational purposes within your organization, you must rent the film with a non-commercial Public Performance Rights (PPR) license. WHAT IS PPR?Public Performance Rights (PPR) are the legal rights to show a film in public. According to U.S. Copyright Law (Title 17, United States Code, Section 110), a public performance is any screening of a film that occurs outside of the home, or at any place where people are gathered who are not family members, such as in a school, library, auditorium, classroom or meeting room. Unless DVDs are sold or rented with public performance rights or are licensed for public performance, they should be considered home use only and should be restricted to private showings in the home to a “normal circle of a family and its social acquaintances”. For complete information about copyright information and PPR, please visit the U.S. Copyright Law website here: http://www.copyright.gov/title17/92chap1.html#110 COPYRIGHT AND USAGE INFORMATION:United States Copyright Law protects all films and media distributed by Outcast Films. Duplication, reproduction, alteration, television broadcast, cablecast, loaning for a fee, leasing, sublicensing to others or use for commercial purposes is strictly prohibited without written permission from Outcast Films. U.S. Copyright Law, including the teacher exemption, does not apply to streaming films and online access. If you would like to stream the film in your classroom, you must purchase the DSL (digital site license). Please note: that a DSL is for educational institutions only. Non profits, corporations and government agencies must send their inquiry to this email address: info@outcast-films.com. Back to top"
