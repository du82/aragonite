["https://outflux.net/blog/archives/2014/01/27/fstack-protector-strong"]
title = "-fstack-protector-strong «  codeblog"
full_description = 'January 27, 2014 -fstack-protector-strong Filed under: Blogging,Chrome OS,Debian,Security,Ubuntu,Ubuntu-Server — kees @ 2:28 pm There will be a new option in gcc 4.9 named “-fstack-protector-strong“, which offers an improved version of “-fstack-protector” without going all the way to “-fstack-protector-all“. The stack protector feature itself adds a known canary to the stack during function preamble, and checks it when the function returns. If it changed, there was a stack overflow, and the program aborts. This is fine, but figuring out when to include it is the reason behind the various options. Since traditionally stack overflows happen with string-based manipulations, the default (-fstack-protector), only includes the canary code when a function defines an 8 (--param=ssp-buffer-size=N, N=8 by default) or more byte local character array. This means just a few functions get the checking, but they’re probably the most likely to need it, so it’s an okay balance. Various distributions ended up lowering their default --param=ssp-buffer-size option down to 4, since there were still cases of functions that should have been protected but the conservative gcc upstream default of 8 wasn’t covering them. However, even with the increased function coverage, there are rare cases when a stack overflow happens on other kinds of stack variables. To handle this more paranoid concern, -fstack-protector-all was defined to add the canary to all functions. This results in substantial use of stack space for saving the canary on deep stack users, and measurable (though surprisingly still relatively low) performance hit due to all the saving/checking. For a long time, Chrome OS used this, since we’re paranoid. :) In the interest of gaining back some of the lost performance and not hitting our Chrome OS build images with such a giant stack-protector hammer, Han Shen from the Chrome OS compiler team created the new option -fstack-protector-strong, which enables the canary in many more conditions: local variable’s address used as part of the right hand side of an assignment or function argument local variable is an array (or union containing an array), regardless of array type or length uses register local variables This meant we were covering all the more paranoid conditions that might lead to a stack overflow. Chrome OS has been using this option instead of -fstack-protector-all for about 10 months now. As a quick demonstration of the options, you can see this example program under various conditions. It tries to show off an example of shoving serialized data into a non-character variable, like might happen in some network address manipulations or streaming data parsing. Since I’m using memcpy here for clarity, the builds will need to turn off FORTIFY_SOURCE, which would also notice the overflow. #include <stdio.h> #include <stdlib.h> #include <string.h> struct no_chars { unsigned int len; unsigned int data; }; int main(int argc, char * argv[]) { struct no_chars info = { }; if (argc < 3) { fprintf(stderr, "Usage: %s LENGTH DATA...\n", argv[0]); return 1; } info.len = atoi(argv[1]); memcpy(&info.data, argv[2], info.len); return 0; } Built with everything disabled, this faults trying to return to an invalid VMA: $ gcc -Wall -O2 -U_FORTIFY_SOURCE -fno-stack-protector /tmp/boom.c -o /tmp/boom $ /tmp/boom 64 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA Segmentation fault (core dumped) Built with FORTIFY_SOURCE enabled, we see the expected catch of the overflow in memcpy: $ gcc -Wall -O2 -D_FORTIFY_SOURCE=2 -fno-stack-protector /tmp/boom.c -o /tmp/boom $ /tmp/boom 64 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA *** buffer overflow detected ***: /tmp/boom terminated ... So, we’ll leave FORTIFY_SOURCE disabled for our comparisons. With pre-4.9 gcc, we can see that -fstack-protector does not get triggered to protect this function: $ gcc -Wall -O2 -U_FORTIFY_SOURCE -fstack-protector /tmp/boom.c -o /tmp/boom $ /tmp/boom 64 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA Segmentation fault (core dumped) However, using -fstack-protector-all does trigger the protection, as expected: $ gcc -Wall -O2 -U_FORTIFY_SOURCE -fstack-protector-all /tmp/boom.c -o /tmp/boom $ /tmp/boom 64 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA *** stack smashing detected ***: /tmp/boom terminated Aborted (core dumped) And finally, using the gcc snapshot of 4.9, here is -fstack-protector-strong doing its job: $ /usr/lib/gcc-snapshot/bin/gcc -Wall -O2 -U_FORTIFY_SOURCE -fstack-protector-strong /tmp/boom.c -o /tmp/boom $ /tmp/boom 64 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA *** stack smashing detected ***: /tmp/boom terminated Aborted (core dumped) For Linux 3.14, I’ve added support for -fstack-protector-strong via the new CONFIG_CC_STACKPROTECTOR_STRONG option. The old CONFIG_CC_STACKPROTECTOR will be available as CONFIG_CC_STACKPROTECTOR_REGULAR. When comparing the results on builds via size and objdump -d analysis, here’s what I found with gcc 4.9: A normal x86_64 “defconfig” build, without stack protector had a kernel text size of 11430641 bytes with 36110 function bodies. Adding CONFIG_CC_STACKPROTECTOR_REGULAR increased the kernel text size to 11468490 (a +0.33% change), with 1015 of 36110 functions stack-protected (2.81%). Using CONFIG_CC_STACKPROTECTOR_STRONG increased the kernel text size to 11692790 (+2.24%), with 7401 of 36110 functions stack-protected (20.5%). And 20% is a far-cry from 100% if support for -fstack-protector-all was added back to the kernel. The next bit of work will be figuring out the best way to detect the version of gcc in use when doing Debian package builds, and using -fstack-protector-strong instead of -fstack-protector. For Ubuntu, it’s much simpler because it’ll just be the compiler default. © 2014 – 2017, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (33) 33 Comments What’s the deal with register locals? I though the “register” keyword was pretty much ignored by modern C compilers. Or is it just being used as an heuristic for crufty old code? Comment by pdw — January 27, 2014 @ 4:36 pm I don’t remember the reasoning right now. I’ll ask Han Shen. :) Comment by kees — January 27, 2014 @ 4:43 pm Why not just enable -fstack-protector-strong by default in upstream GCC. There is no reason for this not to be the default in every distribution of GCC, otherwise user-compiled binaries are vulnerable on Debian. Comment by Paul Wise — January 27, 2014 @ 7:03 pm Shouldn’t it be “local variable’s address used as part of the *left* hand side of an assignment” instead? Or do I misunderstand something? Comment by Nikolai Kondrashov — January 27, 2014 @ 10:58 pm This is an interface nitpick deep from the peanut gallery. Have you considered a “valued argument”, i.e. -fstack-protector=foo (where foo in {regular, strong, all})? Seems more extensible. Comment by tomás zerolo — January 28, 2014 @ 12:17 am Han Shen told me it was to catch unusual ways to get a reference to the frame address, with things like “register unsigned rsp __asm__(“rsp”);”, etc. Comment by kees — January 28, 2014 @ 12:41 pm I’d love to see this become the upstream gcc default. All it needs is someone with the time and interest to convince upstream to do it, and to fix any upstream test failures that might result from the change. It wasn’t a “valued argument” because there wasn’t an expectation for these various modes. As a result, I suspect leaving the behavior as it was seemed like the best way forward. Comment by kees — January 28, 2014 @ 12:44 pm Meh, but a function defining a “register uint32_t h;” for use in a tight inner loop should probably not be penalised like that… the “asm” is what triggers the trick, really. Comment by mirabilos — January 29, 2014 @ 1:33 am fstack-protector-all can protect all the fuctions ,even the local static vars,but the local static vars are not in the stack ,right? Comment by Jessica — December 26, 2014 @ 1:57 am Is there any other flag which makes fstack protection disable even after using fstack protection flag?? Comment by Arvind — January 4, 2015 @ 11:03 pm Why -fstack-protector doesn’t work with threads??? Comment by Arvind — January 9, 2015 @ 4:58 am -fstack-protector works fine with threads. The glibc canary is per-process, so each thread has the same canary check. There isn’t a way to turn it off at run time since it’s built into the machine code being executed. Comment by kees — February 3, 2015 @ 1:46 pm […] protects against stack buffer overflows, but additionally provides coverage for more array types, as the original only protected character arrays. Stack-protector-strong was implemented by Han […] Pingback by Protecting Android with more Linux kernel defenses | Debeelop – Native App Developer Team — July 27, 2016 @ 1:56 pm […] protects against stack buffer overflows, but additionally provides coverage for more array types, as the original only protected character arrays. Stack-protector-strong was implemented by Han […] Pingback by Protecting Android with more Linux kernel defenses – Find Bravo — July 27, 2016 @ 2:00 pm […] protects against stack buffer overflows, but additionally provides coverage for more array types, as the original only protected character arrays. Stack-protector-strong was implemented by Han […] Pingback by Protecting Android with more Linux kernel defenses | Operating System Candy — July 27, 2016 @ 4:21 pm […] protects against stack buffer overflows, but additionally provides coverage for more array types, as the original only protected character arrays. Stack-protector-strong was implemented by Han […] Pingback by Protecting Android with more Linux kernel defenses – Buy App Reviews — July 27, 2016 @ 4:31 pm […] protects against stack buffer overflows, but additionally provides coverage for more array types, as the original only protected character arrays. Stack-protector-strong was implemented by Han […] Pingback by 