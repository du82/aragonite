title = "jabber to IRC bridge «  codeblog"
full_description = "July 30, 2006 jabber to IRC bridge Filed under: Inkscape,Networking — kees @ 11:16 am I wrote a Jabber to IRC bridge a while back. It’s currently being used to bridge communication between the #inkscape freenode channel and the inkscape Jabber conference room. I’ve finally gotten around to cleaning up (read: getting configurable variable out of the script into a .conf file) and publishing it. It’s a bit fragile since the POE/Jabber code seems to explode once in a while, and it doesn’t like losing connections with the Jabber server, but it works most of the time. Several people had asked me for copies of it, so there it is. Please don’t laugh at it/me too hard. Just send me lots of patches. :) © 2006, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (3) 3 Comments Any help with how can I get it to work? I am trying but it’s not working. what prerequisites do I need to install it? Comment by barlas — September 30, 2006 @ 11:31 pm for a rather solid solution you may want to look into the IRC gateway of the psyc guys.. http://about.psyc.eu/Gateway … when you install that you can access it via jabber MUC protocol. Comment by passerby — June 3, 2007 @ 5:13 am I have had a little trouble getting all it’s dependencies met. I am not sure where to find POE::Component::PubSub.pm for fc14 Any pointers would be appreciated. Net Nut Comment by Net Nut — August 11, 2011 @ 11:33 am"
