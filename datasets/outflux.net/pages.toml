title = "catching up on Stargate «  codeblog"
full_description = "May 16, 2006 catching up on Stargate Filed under: Blogging,Health — kees @ 10:50 pm I’ve been catching up on Stargate SG-1 ever since Bryce recommended it. I’d been resisting it, but with no more Firefly, Farscape, or StarTreks left to watch, it was inevitable. At one point during my catch-up, I realized that I was watching 4 separate time-lines of the show. SciFi was showing new episodes on Fridays, a set of 3-in-a-row on Mondays, and a third chronology running Tue, Wed, Thu. On top of this, Fox(?) was playing re-runs on Fridays as well. About 30 episodes in, I totally lost it, and could not keep things straight. (“What? Where’d Daniel Jackson go? Who’s this guy?”) To my rescue was my ever-faithful epguides.com to serve as a base check-list for which shows I’d seen already, and the fantastic Stargate Wiki Episode Guide to help me remember which I’d already seen. (They even have full transcripts of the episodes! That’s dedication!) It looks like very few of season 2 has aired, so I will have to turn to either the library or Netflix to fill the gaps. Once SG1 is gone, I will have to switch my daily exercise routine back to Buffy the Vampire Slayer. :) © 2006, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (1) 1 Comment i highly reccomend ‘odyssey 5’ it was a scifi show that aired in 2002… dvd is out and dvdrips aplenty. and i had never heard of it! damn showtime buired it! Comment by compn — July 2, 2006 @ 9:55 pm"
