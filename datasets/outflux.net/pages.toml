title = "Networking «  codeblog"
full_description = 'December 10, 2014 Open EVSE Filed under: Blogging,Networking,Ubuntu,Vehicles — kees @ 12:53 pm Needing a new car, and wanting to never purchase another gas-fuelled motor, I bought a Nissan LEAF. (Trivia: LEAF appears to be a backronym for “Leading, Environmentally friendly, Affordable, Family car”.) This vehicle has effectively a 22kWh battery and goes maybe 80 miles on a charge, which is more than enough for running errands. The 15-Amp (“Level 1”) EVSE (Electric Vehicle Supply Equipment) that comes with the LEAF plugs into a standard wall socket. It tells the car’s charger to draw only 12A, so it doesn’t pop the house’s circuit. This will fully charge the batteries in about 20 hours, which is not sufficient for daily use. The thing on the end that plugs into the LEAF is the J1772 connector. You’ll note it is not just an extension cord, even though it feeds the car AC power. The EVSE communicates with the vehicle to negotiate a charging current. Then the LEAF’s on-board charger takes the AC the EVSE makes available, converts it to DC, and stores it in the batteries. (My model LEAF also has a second plug for DC fast charging, which uses an entirely different connector: CHAdeMO.) Most folks with an Electric Vehicle end up installing a “Home Charger”. (Though calling it a “charger” is a misnomer since, as mentioned, the charger is in the car.) This is actually a “Level 2” wall-mounted EVSE, which uses a dedicated high-amperage circuit. Like the Level 1, it has communication logic to do the protocol negotiation with the vehicle. However, the price of Level 2 EVSEs is crazy high (low-end $1000, high-end $3000), and that doesn’t even include the cost of getting the dedicated circuit run by an electrician. To make matters worse, none of the standard EVSEs are Open Source, and only the high-end ones have remote access, etc. Luckily, I am hardly the first person to notice this, and since I’m so “late” to the EV world, there are several Open projects for building one’s own EVSE. I went with OpenEVSE, since I can build it (so I understand all the components in the system), and I can change/improve the firmware (like adding a wifi board). Under Ubuntu, I was up and running after installing the arduino and avrdude packages. Now I can charge from empty in under 8 hours, since the 30A unit charges at 24A nominal. While I was at it, I 3D printed a socket to hold the J1772 plug when it’s not in the car. © 2014 – 2015, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on Open EVSE November 26, 2013 Thanks UPS Filed under: Blogging,Debian,Networking,Ubuntu,Ubuntu-Server — kees @ 8:25 pm My UPS has decided that every two weeks when it performs a self-test that my 116V mains power isn’t good enough, so it drains the battery and shuts down my home network. Only took a month and a half for me to see on the network graphs that my outages were, to the minute, 2 weeks apart. :) In theory, reducing the sensitivity will fix this… © 2013 – 2015, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on Thanks UPS November 10, 2010 TARPIT iptables target Filed under: Blogging,Debian,Networking,Security,Ubuntu,Ubuntu-Server — kees @ 9:21 am Want to use a network tarpit? It’s so easy to set up! Thanks to jpds for this whole post. :) sudo module-assistant auto-install xtables-addons-source sudo iptables -p tcp ... -j TARPIT Though no such thing exists for IPv6 yet. Here it is watching over the SSH port: iptables -N INGRESS-SSH iptables -A INPUT -p tcp --dport 22 -m state --state NEW -j INGRESS-SSH iptables -A INGRESS-SSH -p tcp --dport 22 -m state --state NEW -m recent --name SSH --set iptables -A INGRESS-SSH -p tcp --dport 22 -m state --state NEW -m recent --name SSH --update --rttl --seconds 60 --hitcount 4 -j LOG --log-prefix "[INGRESS SSH TARPIT] " iptables -A INGRESS-SSH -p tcp --dport 22 -m state --state NEW -m recent --name SSH --rcheck --rttl --seconds 60 --hitcount 4 -j TARPIT © 2010, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on TARPIT iptables target February 9, 2010 easy example of filesystem capabilities Filed under: Blogging,Debian,Networking,Security,Ubuntu,Ubuntu-Server — kees @ 11:15 am Instead of using setuid programs, the goal for the future is to use fine-grained capabilities. For example, here is /bin/ping: $ ls -la /bin/ping -rwsr-xr-x 1 root root 35680 2009-11-05 00:41 /bin/ping $ ./ping 127.0.0.1 PING 127.0.0.1 (127.0.0.1) 56(84) bytes of data. 64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.041 ms … $ sudo setcap CAP_NET_RAW=ep /bin/ping $ getcap /bin/ping /bin/ping = cap_net_raw+ep $ ./ping 127.0.0.1 PING 127.0.0.1 (127.0.0.1) 56(84) bytes of data. 64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.041 ms … $ dmesg | tail -n1 [212275.772124] warning: `/bin/ping’ has both setuid-root and effective capabilities. Therefore not raising all capabilities. The best part is that the kernel will choose the set of least privileges when both setuid and capabilities exist. Easy way to transition! © 2010, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (6) January 24, 2010 Google is wardriving Filed under: Blogging,Debian,General,Networking,Security,Ubuntu,Web — kees @ 8:28 pm So, a while back, Google started providing location services. This seemed pretty cool, but I kind of ignored it until recently when I was playing with my Android’s location API. With the GPS off, and no cell towers visible (my basement gets terrible cell service), my phone knew within about 500 feet of where it actually was. All I was connected to was my wifi. Bottom line: it seems that Google, among other methods, is likely wardriving while photographing for Street View. They are now able to pinpoint wifi access points if they happened to see it while driving through your city. I’m really rather astonished that no one is freaking out about this; I’m a bit unnerved. I implemented the location-of-your-wifi API quickly, so I could terrify myself further. You can do lookups via my location website too, if you want. UPDATE: yeah, it would seem to be crowd-sourced wifi and cell tower triangulation data. I should say “Google is WarCrowding”. © 2010, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (25) January 13, 2009 ETOOMANYCERTS Filed under: Debian,Networking,Ubuntu,Ubuntu-Server — kees @ 10:46 pm After upgrading an Ubuntu mail server from Hardy to Intrepid, two users could no longer connect via SSL to send email though sendmail. One was using msmtp and the other was using Outlook Express. The msmtp issue was tracked down as a supposed deficiency in msmtp. However, this left Outlook, which is neigh-impossible to debug. From the Debian msmtp bug linked from the Ubuntu bug, it seemed that the root cause was the server sending too much data during the initial connection. Packet captures of an Outlook connection seemed to back this up: Outlook negotiated STARTTLS fine, and then just never responded to the SSL handshake. It seems that something (openssl? sendmail?) changed between Hardy and Intrepid so that instead of using the /etc/ssl/certs/ca-certificates.crt file just for verification, its contents were now being sent during the SSL handshake. (I reduced the number of configured certs with “sudo dpkg-reconfigure ca-certificates“, and checked on the size of the handshake with “openssl s_client -connect server:port | wc -l“.) It spewed 143 certs sent at every connection. Unsurprisingly, it seems some clients were choking on it (I would like to note that Thunderbird behaved correctly). In the end, I configured my sendmail’s CAfile (“confCACERT”) to aim at just a single CA (the CA used to sign the server’s SSL key), and that fixed both msmtp and Outlook. How fun. © 2009 – 2010, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (4) November 3, 2008 days since last incident… Filed under: Blogging,Debian,Networking,Security,Ubuntu,Ubuntu-Server — kees @ 11:15 am If I made one of those work-site signs that tracked “Days since last incident”, and made one for “Days since last in-the-wild remote-root worm” for Windows and Linux, what would they each say? 0 and 7304 respectively? Update: while the post was tongue-in-cheek (everyone suffers when any large subset of computers is being attacked), I should lower the Linux days count to 2783 (for L10n on March 23, 2001, which is slightly newer than Ramen on January 17, 2001). Thanks for everyone’s comments. :) © 2008, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (3) August 5, 2008 dbus session access from remote Filed under: Blogging,Networking,Ubuntu — kees @ 8:49 pm In order to turn off the music playing on my desktop (in audacious) from my laptop in another room, I must figure out the DBUS session, and set it up before using the audacious session management control (like “--play-pause“). $ ssh MACHINE "set -x export DISPLAY=:0.0 PID=\$(pidof audacious) if [ -z \"\$PID\" ]; then rhythmbox-client --pause else export \$(xargs -0 -n1 /proc/\$PID/environ | grep ^DBUS_SESSION_BUS_ADDRESS=) audacious --play-pause fi" (Updated to shorter version, thanks Kirikaza.) © 2008 – 2010, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (4) December 18, 2007 force sendmail to deliver a specific item from the queue Filed under: Networking,Ubuntu — kees @ 8:11 pm In case I or someone else ever needs this trick again, here’s my quick solution to work around QueueAge limits, and only force a specific queue id to get delivery retried: /usr/sbin/sendmail -v -o MinQueueAge=0 -qI${ID_GOES_HERE} © 2007, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (2) September 28, 2007 CUPS banner template variables Filed under: Networking,Ubuntu — kees @ 5:51 pm A while back, I wanted to design some banner pages for a shared network printer that would show the name of the host that sent the request (none of the standard CUPS banners report this). It was easy enough to define a custom banner page: <Printer lj4200> ... JobSheets shared-banner none ... </Printer> Then, I could drop a modified banner into /usr/share/cups/banners with the filename “shared-banner”. The banner is just a regular PostScript file, so I could muck around with it. While looking at the “standard” banner, I saw some PS variables being used that had been defined by CUPS: ... (Job ID: ) RIGHT 2 copy % Copy X & Y moveto ({printer-name}-{job-id}) show ... I couldn’t find documentation on the available variables, but managed to track down some of the list at cupsGetJobs2 in cups/utils.c: job-id job-priority job-k-octets job-state time-at-completed time-at-creation time-at-processing job-printer-uri document-format job-name job-originating-user-name None of these had the sending host listed, so I continued searching. Additional ones are defined in scheduler/ipp.c, including: printer-name job-id job-billing job-hold-until job-sheets job-media-sheets-completed job-originating-host-name “job-originating-host-name” did the trick for my banner: ... (Host: ) RIGHT moveto ({job-originating-host-name}) show ... I’ve seen some other partial lists, but I haven’t found an official complete list. It’d be handy to see this documented better, since some variables aren’t valid until after the job is processed (job-sheets), so it’s only valid in the trailing banner, not the leading banner. © 2007, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (1) December 7, 2006 filtering email body URLs with whois Filed under: Networking,Ubuntu — kees @ 10:21 pm I use SURBL filtering for my inbound email. It’s very handy except when my domain receives the leading edge of a new spam campaign. Whenever spam with a URL got through the filters, I’d go look it up and discover that it was added to the block lists about 20 minutes after I got the email. I’d think to myself, “dang, if only I had greylisted that email”. Well, I got to thinking: all the URL-based spam campaigns have one thing in common: the domains they’re spamming have been recently registered. So now I greylist any email whose body contains a recently registered domain in a URL. It gets delayed just long enough that the SURBLs catch up, and when it is finally reattempted, it gets permanently rejected. Unfortunately, I have not found a common API for querying the registrars for a domain’s creation date, so I wrote an insane script to make a best-effort guess: $ ./whois-created kernel.org 2>/dev/null ‘kernel.org’ created on: 1997-03-07 $ ./whois-created outflux.net 2>/dev/null ‘outflux.net’ created on: 2000-03-17 $ ./whois-created hosteije.net 2>/dev/null ‘hosteije.net’ created on: 2006-12-01 Any URLs with kernel.org or outflux.net I’d let through, but I’d greylist anything mentioning hosteije.net (which is now listed on the SURBLs). Most of my email filtering is based on some heavily modified MIMEDefang code (which handles hooking to my script and doing the greylisting), but I’m figuring this sort of thing should live in some optional routine in SpamAssassin so more people can benefit. © 2006, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on filtering email body URLs with whois September 9, 2006 metalink Filed under: kernel.org,Networking — kees @ 10:47 am I’ve been watching metalink for a while now, and was urged to write about it, so I am! If you want to download something large that isn’t available via bittorrent, you can still get the distributed download benefits of bittorrent. Basically, metalink-aware downloaders split up your download across many mirrors of the resource you want, using existing protocols. Bittorrent is great for “new releases” or other similiar things that are currently “in demand” by a large number of people. For older stuff, especially large trees of files, as found on many mirrored archives, you won’t find a bittorrent, and metalink can really distribute and speed up the download. OpenOffice is using it, and I hope to figure out a way to incorporate it into kernel.org directly. There are already places hosting auto-generated metalink files for various projects, including the linux kernel. I’m hoping kernel.org can publish more complete metalink files since we should be able to build them more easily, having the list of which mirrors are in which countries, their access mechanism, and if they carry bz2, gz, or both. We’ve talked about it briefly, but haven’t finalized the plans yet. You can even generate your own metalink files online. Another blog has other details, so I hope I’ve not been too redundant. :) © 2006, Kees Cook. This wor'
