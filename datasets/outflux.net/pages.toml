title = "frontline assembly samples «  codeblog"
full_description = "June 4, 2006 frontline assembly samples Filed under: Blogging,Multimedia — kees @ 8:08 am Every once in a while, I hear something in a movie and yell, “Hey! That’s in a Frontline song!” This time it was while catching a portion of the The Abyss, where a big chunk of gear misses falling on their habitat, and they kind of laugh nervously. Well, that nervous laugh was looped for about for about 30 seconds at the start of “Victim of a Criminal” from Millennium. I found it at about the same time I thought to put “Frontline Assembly samples” into Google, which gave me this page, which is a list of all the samples that they used. Robocop, Aliens, and the one that haunted me for a while before this Abyss incident: Stargate and “send in the probe”. This is what my brain is filled with: sound effects. Great. :) © 2006, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (4) 4 Comments Brilliant! I’ve been looking for a site like you found for a long time… ‘Contact’, ‘Alien’, ‘Depeche Mode – Dangerous’… I’ve always heard them samples in ‘Synthetic Forms’. Just needed validation! I think there is a ‘Brain Storm’ or ‘Matrix’ sample in there, too. Listen! Comment by hal09thou — December 1, 2008 @ 9:57 pm THOSE, God darnit! Sheesh…… Comment by hal09thou — December 1, 2008 @ 10:16 pm heh, yeah I did that with “No Escape”, which is sampled several times in “mortal” off of Hard Wired. Comment by polerin — April 10, 2009 @ 2:42 pm Thank you for having the answer to the question I was asking just now! I was watching that scene and I knew I knew it from some FLA song, just didn’t know which one. Comment by Ian Gilman — March 15, 2016 @ 9:47 pm"
