title = "freaky screen locking «  codeblog"
full_description = "October 6, 2005 freaky screen locking Filed under: General — kees @ 8:54 pm This afternoon, for no reason at all, I was annoyed that my music didn’t pause when I locked my screen. So I fixed that. Tonight, I checked my RSS feeds and discovered that Corey did exactly the same thing today. I think that’s really freaky. Inter-city Open Source Mind-Meld. Only I did mine with xscreensaver and xmms: #!/bin/bash xmms –pause xscreensaver-command lock What I want now is a way to get xmms to unpause after I unlock my screen. :) I thought of a horrible hack for xscreensaver to do this, but I’m hoping there’s some other way. © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on freaky screen locking No Comments No comments yet."
