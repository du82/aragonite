title = "open clip art is everywhere «  codeblog"
full_description = "July 22, 2005 open clip art is everywhere Filed under: Inkscape — kees @ 8:36 am Although I’m only a user of the Open Clip Art Library, I’m close to the people involved in it since many of them are also involved in Inkscape. As a result, I’m always on the look-out for new places where OCAL is mentioned or OCAL art is used. Today while innocently reading Groklaw‘s response to Dvorak’s misunderstanding of the Creative Commons licenses, I saw OCAL mentioned as the first in a list of examples of useful CC-tagged sites. Very cool. :) (This post, I think, has my highest ratio of links to words yet.) © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on open clip art is everywhere No Comments No comments yet."
