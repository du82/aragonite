["http://outflux.net/unix/software/sts"]
title = "Linux SCSI Terminal Server driver"
full_description = '''This software allows Linux to use the Central Data/Digi SCSI Terminal Servers (and even the rare Motorola OEM versions). The picture to the right shows (top to bottom) 4 Central Data ST-1620s, 1 Motorola STS-S8P, and 5 Motorola STS-S16Ps. Too bad I can only put 7 on a SCSI chain at a time. :) Aug 12, 2000: It works! Thanks to Digi's ELS driver being nothing more than a FAS command pipe on top of all the TTY/serial code, I just ported my userspace tool to a EL/STS pipe. :) Sep 21, 2000: Whoops, I forgot to release the STS unit table that Digi sent me. If you have other STSs that are not part of my patches, you can get your unittab settings from this sts_unittab.c file. Jan 19, 2001: I've gotten around to checking in with Digi again, and it looks like they put their latest version of the ELS drivers up, which includes my bug fix! :) I've re-ported my changes to this new version of the driver. Their changes include much better packaging, and a lot of code clean-ups. Feb 9, 2001: Ah! Robert gave me source code for the CenData firmware updater! Woo-hoo! So, I've started working on a version for Linux, re-using my scsi generic code from the STS driver. I figured I'd do a full rewrite because the majority of the "cdupdate" code is written to use the "/dev/stsdiag" file, which doesn't exist. That and I wanted another excuse to use "mmap". Feb 16, 2001: The 2.4.x port wasn't complete. Looks like 2.4 also cleaned up their TTY code so that when cdscsid (or cdetherd) would reconnect to the ELS driver, the "read" and "write" functions weren't set, so the "select" call never returned for the els device. So that's been corrected. I also finished changing the SCSI address code around so that "Host.Chan.ID.LUN" can be used instead of /dev/sg*. Everything appears to work again, so I've released version "2_cjc_2" now. I still need to put the FAS_GLOBAL code in, but I just didn't feel like it today. For the safest results, people should download the userspace code, run that once, and then load cdscsid. That'll make sure your STS gets at least one FAS_GLOBAL.'''
