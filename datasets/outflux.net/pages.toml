title = "phrase from nearest book meme «  codeblog"
full_description = "November 11, 2008 phrase from nearest book meme Filed under: Blogging,Debian,General,Ubuntu — kees @ 12:42 pm Meme from Jono: Grab the nearest book. Open it to page 56. Find the fifth sentence. Post the text of the sentence in your journal along with these instructions. Don’t dig for your favorite book, the cool book, or the intellectual one: pick the CLOSEST. My result: “The term linear just means that each output bit of the mixing function is the XOR of several of the input bits.” – Practical Cryptography, Niels Ferguson, Bruce Schneier. © 2008, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (5) 5 Comments here’s mine :) http://blog.paniq.org/2008/11/phrase-from-nearest-book-meme.html Comment by paniq — November 11, 2008 @ 2:39 pm Mine is: “This modification may empower us to detect more body parts than just head, neck, and feet and additionally would be more robust (regarding image artefacts). (from “Medical Image Computing and Computer-Assisted Intervention –MICCAI 2006, uni presentation research, not the most gripping of reading!) Comment by tomh — November 11, 2008 @ 4:39 pm “Then come with me.” I like it… Comment by hal09thou — December 1, 2008 @ 10:12 pm “Sie blickte zu Boden und lauschte ergeben der nicht enden wollenden Messe.” – and, when restricting to english books, the book that was closest only had 49 pages ;-) Comment by Bookah — December 22, 2008 @ 12:11 pm “This register, in turn, points to anarray of 1024 32-bit values called the page directory.” Rootkits: Subverting the Windows Kernel by Greg Hoglund and James Butler Comment by Kelson — February 21, 2009 @ 7:30 am"
