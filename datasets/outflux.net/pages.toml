full_description = "September 16, 2005 song tagging Filed under: Multimedia — kees @ 6:03 pm Jimmac you are my hero! I was just complaining about needing to tag a lot of my early music rips so they would be sensible in MythTV (and on my iPod), and poof, there’s the answer in my RSS feed reader. tagtool is exactly what I was looking for. It’s going to take me about 10 minutes to tag a little over 5000 mp3s. And for 9 minutes and 30 seconds of that, I’m going to be looking up publication years, which is the only thing not in the pathname that’s going to get sucked into the ID3 tag. Great, great tool! © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (1) 1 Comment For the really obsessive compulsive, there’s always MusicBrainz. Not quite as fast, but definately more perfectionistic. Comment by Bob Aman — September 19, 2005 @ 3:32 pm"
