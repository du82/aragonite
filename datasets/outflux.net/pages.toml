["https://outflux.net/blog/archives/2005/08/16/art-thoughts-on-aug-16-2005"]
title = "art thoughts on aug 16, 2005 «  codeblog"
full_description = "August 16, 2005 art thoughts on aug 16, 2005 Filed under: General — kees @ 7:11 pm I saw a mention of the Portland Time-Based Art festival. Looks to be a pretty wild mix of all kinds of performance art. I’ve got to check it out, but it looks a bit pricey (minimum: $125). Portland’s 94.7FM “alternative” radio station is great. (They even have live streaming.) I’ve been especially impressed with the 6PM “Cocktail Mix” by Gustav. His personal collection of electronica is very nice. I’ve never heard Messiah played anywhere other than my stereo or very rarely at clubs. A few weeks ago, he played it. So cool. They’re also running a NIN remix contest I’m pondering entering. I’m not really sure what sort of open software I should use to cook it, though. © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (2) 2 Comments While not terribly stable, LMMS is fairly functional. http://lmms.sourceforge.net/ I’ve had a lot of fun playing with it but must make sure to save often. Comment by Benji Park — August 17, 2005 @ 5:52 am Thanks, that looks pretty cool! I also found this page, after I made my blog post: http://linux-sound.org/one-page.html#loopers Comment by kees — August 17, 2005 @ 6:14 am"
