["https://outflux.net/blog/archives/2005/10/16/mythtv-button-sounds"]
title = "mythtv button sounds «  codeblog"
full_description = "October 16, 2005 mythtv button sounds Filed under: Multimedia — kees @ 11:51 am Well, I’ve discovered that my “slow to respond” UI was entirely due to the lirc “repeat” settings. I’ve eliminated (“repeat=0”) the repeat settings for the Esc, Up, Down, Left, Right, Space, and Return buttons. I discovered this only after seeing that ircat was just as slow to respond. I’ve hacked together a “make noise” script (named “irnoise”) that runs along with mythfrontend: #!/bin/bash export SOUNDS=~mythtv/sounds ircat mythtv | while read NAME; do case “$NAME” in Return|Space) SOUND=select.wav ;; *) SOUND=default.wav ;; esac #echo “$NAME: $SOUND” aplay -q “$SOUNDS”/”$SOUND” done This gives me my “boop” and “click” noises for all remote buttons. Yay! Since I couldn’t find the official TiVo noises, and I don’t feel like taking my TiVo apart right now, I just grabbed some noises I found online. From the “MiscWAVs.zip”, I used “THUD.WAV” and “BTN_DWN.WAV”: sox src/THUD.WAV -t wav -c 1 -s -w -r 48000 default.wav resample sox src/BTN_DWN.WAV -t wav -c 1 -s -w -r 48000 -v 2 select.wav resample normalize-audio -m default.wav select.wav Not a lot of complaints left with my MythTV installation. :) © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (3) 3 Comments Hey – I just found your script for adding noises to the myth GUI. It seems like such a good idea, I can’t believe it’s not built in. Trouble is, I can’t figure out how to get it set up. Would you be interested in walking a newb through the process? Thanks, Brian Comment by Brian — December 4, 2005 @ 11:49 pm Hey – I just figured your script out, but now I’m getting all sorts of DSP errors, not to mention than when it does work, I get tons of beeping after I stop watching a recording. I am figuring these are all of the stored beeps from when my soundcard was processing the video. Any way to get around this that you know, or do you think this is a flaw in my soundcard? Brian Comment by Brian — December 5, 2005 @ 1:37 am Hi Brian! I’m glad you like the sound script. :) In an earlier post (the one mostly about fonts) I talk about switching from the default OSS audio drivers to the ALSA drivers. (Honestly, I’m shocked that MythTV defaults to OSS.) With ALSA, you won’t get the same “stacking” of sounds, or any of the other problems. OSS is buggy like that, but ALSA works great for this; it’s one of the reasons I switched. Comment by kees — December 5, 2005 @ 8:30 am"
