["https://outflux.net/blog/archives/2011/09/12/5-years-with-canonical"]
title = "5 years with Canonical «  codeblog"
full_description = 'September 12, 2011 5 years with Canonical Filed under: Blogging,Debian,General,Security,Ubuntu — kees @ 9:58 am This month, I will have been with Canonical for 5 years. It’s been fantastic, but I’ve decided to move on. Next week, I’m going to start working for Google, helping out with ChromeOS, which I’m pretty excited about. I’m sad to be leaving Canonical, but I comfort myself by knowing that I’m not leaving Ubuntu or any other projects I’m involved in. I believe in Ubuntu, I use it everywhere, and I’m friends with so many of its people. And I’m still core-dev, so I’ll continue to break^Wsecure things as much as I can in Ubuntu, and continue working on getting similar stuff into Debian. :) For nostalgic purposes, I dug up my first security update (sponsored by pitti), and my first Ubuntu Security Notice. I’m proud of Ubuntu’s strong security record and how far the security feature list has come. The Ubuntu Security Team is an awesome group of people, and I’m honored to have worked with them. I’m looking forward to the new adventures, but I will miss the previous ones. © 2011, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (14) 14 Comments Congratulations Kees! Keep up the great work! Comment by jduck — September 12, 2011 @ 10:29 am Will miss seeing your name on the security updates… ChromeOS sounds like a lot of fun, enjoy it! Comment by Jonathan Carter — September 12, 2011 @ 10:59 am It has a great pleasure working with you over the years. Thanks so much for your friendship and all the hard work you’ve done on Ubuntu. Rest assured our team will continue the great tradition you’ve helped establish, and I look forward in to working with you in the Ubuntu community. Best of luck on your new endeavor! :) Comment by Jamie Strandboge (jdstrand) — September 12, 2011 @ 11:09 am Hey Kees, good luck @Google :) And thanks for all your work on Ubuntu Security. You were one of the reasons I decided to use Ubuntu as our Server OS for my old company. Hopefully, you are still be active on the Ubuntu security, ’cause I admire your work and your knowledge. Greetings from .de, Stephan aka \sh Comment by sadig — September 12, 2011 @ 11:16 am You’ve been awesome to work with. You’ve been one of the most approachable people on the team and we’re all better because of it. Hope to see you at future UDSes! Comment by Jorge — September 12, 2011 @ 11:27 am Good luck Kees, thanks for all your hard work! Comment by Kyle Bader — September 12, 2011 @ 2:10 pm All the best, Kees! It has been a pleasure working with you when our paths have crossed. Enjoy Google! :-) Comment by Jono Bacon — September 12, 2011 @ 2:50 pm Thanks for all your tireless work, and cheerful attitude. Hope you have a lot of fun at Google, and find time for your disassembler one day. Comment by Elliot Murphy — September 12, 2011 @ 6:33 pm Good luck =) Comment by Marco Rodrigues — September 13, 2011 @ 3:01 am Kees, I’ve enjoyed working with you during my (relatively short) time at Canonical and, whilst it’s kinda sad to see you go, I wish you all the best in your new job. I hope we’ll still see you around at UDS occasionally, and I look forward to working with you in the Ubuntu community :) Comment by Chris Coulson — September 13, 2011 @ 6:07 am Happy to see you’ll still be around in the Ubuntu community. All the best Kees! Comment by David Planella — September 13, 2011 @ 9:23 am Good luck !! Comment by Muharem Hrnjadovic — September 14, 2011 @ 12:15 pm Bummed to see you go – but I comfort myself by knowing that the companies that pay us are just a means to the inevitable end of world domination. Good luck Kees! Comment by dann frazier — September 14, 2011 @ 2:16 pm Wow…have fun on Chrome OS!!! Good luck with Google. Comment by John Pugh — September 15, 2011 @ 5:06 am'
