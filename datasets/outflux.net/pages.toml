title = "Larson Scanner on Arduino «  codeblog"
full_description = "October 7, 2009 Larson Scanner on Arduino Filed under: Blogging,Embedded,Ubuntu — kees @ 8:58 am Inspired by the Larson Scanner project, I finally broke out my Arduino and ported the code from the ATtiny to the ATmega. (The Arduino IDE runs fine with openjdk-6.) I’m sure the power usage is terrible, but I wasn’t after long battery life. I wanted my very own Cylon eye. Since I was successful with porting the code and wiring up the Arduino, I figured I’d see if the tiny Arduino-clone called the “DorkBoard” would work with it too. Later in the weekend I grabbed a AAA-battery holder and hooked that up so the eye is untethered from the USB power source. Next up, coding the pesky self-awareness. © 2009 – 2015, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (3) 3 Comments Are you sure those little red wires are needed? Seems like on all my breadboards the rails up the sides are continuous, or go halfway across the board, despite the apparent gaps the plastic covering implies. I could be mistaken though, or your breadboard could be different than mine. Easy enough to test with an ohm-meter. Comment by SteveC — October 7, 2009 @ 1:54 pm Kees, great to see some Arduino hacking. It’s reminded me that I need to find some quality time to do some more hacking on my Arduino that I got from Steve Conklin. I’m still a beginner: http://smackerelofopinion.blogspot.com/search/label/arduino – but I have some grand plans… Comment by Colin King — November 3, 2009 @ 3:21 pm I was checking out the scanner, wired it up and tried to download it in Arduino 21 to a Duemilinova board, but I get a compile error “In function ‘void cylon()’:LarsonScanner:72: error: ‘light_visible’ was not declared in this scope”. Any thoughts or comments? Thanks! Comment by Rob S. — December 4, 2010 @ 4:17 pm"
