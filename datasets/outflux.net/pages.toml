full_description = "October 7, 2006 art-creation pyramid scheme Filed under: Blogging,Inkscape — kees @ 12:35 pm Gib started a meme I think sounds like fun. If you’re one of the first 5 people who comment on this post, I’ll create an original piece of art for you, but only if you promise to offer the same deal in your own blog. (And I urge you to release it under a Creative Commons Share-Alike license while you’re at it.) I’ll likely be using inkscape to get it done, since I need an excuse to play more with the tile cloner and tessellation filters. © 2006, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (2) 2 Comments First Comment! :) http://scislac.deviantart.com/journal/10355866/ Comment by ScislaC — October 9, 2006 @ 8:30 pm Do it! Comment by Jon Phillips — October 10, 2006 @ 10:16 am"
