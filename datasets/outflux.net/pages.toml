["http://outflux.net/unix/camera"]
title = "Sony Cybershot DSC-F505"
full_description = '''Since I run Linux everywhere except for my Win95 laptop for work, I was forced to use the serial interface under Win95 to download the images. I worked with gphoto and tried to improve the DSC-F505 driver. After a bunch of work, it was still not great. It still had trouble with error recovery, and re-initializing the camera. As a result, I continued to use the Win95 tool to download images. However, it took well over an hour to download 90 images at 1024x768 (400k per image roughly, at 115200bps kinda sucks). March 2000 I started working with Linux USB development to find out how far I was from being able to use my camera with USB. As it turns out, the USB "mass storage" device driver was very stable (devel kernel 2.3.51), and just needed some more information about what the Reduced Block Commands were (which I found on the T10 Web Site). After "adding" the RBC support, the camera reported various SCSI errors, which I tracked down to incorrectly detected return values in the usb-storage code. After putting in the changes to correct that, I was immediately able to see, mount, and read from the camera's memory stick filesystem! I quickly bundled my changes to the usb-storage driver and posted them. As it turned out, Matt Dharm had been working on exactly the same portion of the code, and didn't need my patch. Oh well, maybe I'll get my name into the Linux Kernel some other way. :) April 2000 Woohoo! Paul got me another battery and the 64M Memory Stick for my birthday! It's going to take a lot of work to fill this Stick up. May 2000 As far as I know, the 2.3.99-pre7 kernels and later support RBC correctly. Some people have been having trouble with the usb-storage almost working correctly. In those situations, using the "UHCI Alternate Driver (JE) support" (uhci.o) instead of the "UHCI (Intel PIIX4, VIA, ...) support" (usb-uhci.o) seems to do the trick for fixing the problems. June 15, 2000 (whoops, I forgot to add this entry on time) The DSC-S30 is working with the following "unusual device" entry:'''
