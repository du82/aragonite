title = "General «  codeblog"
full_description = "May 16, 2005 writing for OSCon Filed under: General — kees @ 6:56 pm Aaaagh. I’ve got 30 days to write two full presentations for OSCon! AAaaaaa! In other news, I got a few crash bug patches accepted into Wine. That was cool. © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on writing for OSCon May 12, 2005 hey, it’s thursday Filed under: General — kees @ 4:29 pm On my way to work Today the odometer in my car rolled across 223344. That was pretty cool. RSS for kernel.org I was bothered that I couldn’t add the kernel.org list of latest Linux kernel versions to my RSS aggregator, so I modified the detection scripts to spit out an RSS feed. Whee! Bug fixes I got a small patch against mp3cd yesterday. So I took the moment to release a “stable” version, since I’ve been using the “devel” branch for about 6 months now. That sounds pretty stable to me. :) © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on hey, it’s thursday January 28, 2005 learning autoconf Filed under: General — kees @ 7:09 pm I think I’ll never actually learn all the various functions in autoconf. It feels like this endless road that I can’t see the end of. Any time I do something new in autoconf, I have to go re-read some part of the autoconf manual, and try things a few times before I get the desired result. Today, for example, I got Inkscape to identify which version of libgc is on the system. © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on learning autoconf « Newer Posts"
