["https://outflux.net/blog/archives/2005/08/04/oscon-2005-doppelganger"]
title = "oscon 2005 doppelganger «  codeblog"
full_description = "August 4, 2005 oscon 2005 doppelganger Filed under: General — kees @ 10:52 am Wednesday I met my doppelganger. I had people walking up to me all day saying, “Hi Zak!” and I’d look at them and explain that I was someone else less famous, named Kees. Normally I think I’m just being paranoid thinking people are looking at me all the time. However, today, it seemed to be true. People would kind of slowly orbit me, trying to get a look at my face and my name badge. Eventually I started telling people “Hi! I’m not Zak.” By the end of the day, I had finally met him, and we had a good laugh. There is also Dan at the LTC that shares similar features, and all three of us had our picture taken together. (I hope they read this blog and send me photos!) © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (5) 5 Comments Hi Kees, I will make sure that you get a copy of the photos that I manage to get. Cheers! –zak Comment by Zak Greant — August 5, 2005 @ 10:32 pm Back from OSCON … and quite tired. In brief: * enjoyed a great event * attended some great sessions * missed both “The State of the Onion” and Why the Lucky Stiff’s talk. :# * officially started with the Mozilla Foundation (but am… Trackback by Polymorph — August 6, 2005 @ 12:22 am Dan, meet Zak. Zak, meet Kees. While at OSCON, I finally met Zak Greant, the EZ Systems developer and former MySQL Community Advocate from Vancouver who Chris Shiflett had mistaken me for at php|tropics. In an apparent attempt to forge his own identity, Zak had shaved his goatee and gr Trackback by Coffee|Code — August 7, 2005 @ 10:38 pm I will send the photos round when I get home tonight :) Comment by Laura — August 8, 2005 @ 8:28 pm Photo now linked from my blog. Nice to meet you Kees. Comment by Laura — August 9, 2005 @ 4:26 am"
