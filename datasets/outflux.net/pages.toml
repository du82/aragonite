title = "OSDL drops staff coders «  codeblog"
full_description = "December 4, 2006 OSDL drops staff coders Filed under: General — kees @ 10:33 pm News clippings about OSDL‘s RIF: first official report, another other early report, as seen on Slashdot, some more details, and the most brutal. Two months ago, I jumped on a fantastic opportunity and took a job with Canonical (leaving OSDL none too soon, it seems). I’m disappointed that OSDL laid off so many of my friends. I had been visiting the office on and off so I could continue to participate in the daily lunchtime board games. It’s the end of an era. Games played during lunch: UNO Quiddler Carcassonne: Hunters and Gatherers Chez Geek (and 2 and 3) Chez Grunt Dominos Puerto Rico Munchkin Guilloitine Fluxx Kill Doctor Lucky Early American Chrononauts Poker Polarity Illuminati Ticket to Ride Europe India Rails Thurn and Taxis Dread Pirate Axis + Allies British Rails BattleStar Galactica © 2006, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (1) 1 Comment Very crummy, regarding the layoffs. :( That’s a great list of games, though. My FIL is hugely into the Rails games, so it’s become a tradition to play at family gatherings when we can. We bought him Lunar Rails not long ago, which is set on the [colonized] moon, tweaks a few of the standard rules here and there, and has this funky 3D-mapped-to-2D setup. Comment by jenn-ay — December 6, 2006 @ 12:40 pm"
