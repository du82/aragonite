["https://outflux.net/blog/archives/2014/05/07/linux-security-summit-2014"]
title = "Linux Security Summit 2014 «  codeblog"
full_description = "May 7, 2014 Linux Security Summit 2014 Filed under: Blogging,Chrome OS,Debian,General,Security,Ubuntu,Ubuntu-Server — kees @ 10:31 am The Linux Security Summit is happening in Chicago August 18th and 19th, just before LinuxCon. Send us some presentation and topic proposals, and join the conversation with other like-minded people. :) I’d love to see what people have been working on, and what they’d like to work on. Our general topics will hopefully include: System hardening Access control Cryptography Integrity control Hardware security Networking Storage Virtualization Desktop Tools Management Case studies Emerging technologies, threats & techniques The Call For Participation closes June 6th, so you’ve got about a month, but earlier is better. © 2014, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (1) 1 Comment Not sure I can make it this year, but this looks to be a fantastic summit. Comment by cprofitt — May 8, 2014 @ 4:12 am"
