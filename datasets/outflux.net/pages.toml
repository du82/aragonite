title = "too lazy to recompile «  codeblog"
full_description = '''May 27, 2010 too lazy to recompile Filed under: Blogging,Debian,Multimedia,Ubuntu — kees @ 9:13 pm I have a camera that takes .MP4 files. MythTV’s Gallery plugin has a static list of extensions it recognizes. MP4 is not one of them. I can rename all my files (which is wrong — they’re MP4s not something else), or I can edit the source and recompile. Or, since I want to watch them RIGHT NOW, I can binary-edit the shared library and replace something I’ll not have any of (WMV) with MP4. # strings -a /usr/lib/mythtv/plugins/libmythgallery.so | grep WMV *.WMV # sed -i -e 's/\.WMV/.MP4/' /usr/lib/mythtv/plugins/libmythgallery.so Ta-da. Just need to make sure I don’t change the size of the binary. :) (Oddly, I’m not too lazy to open a bug and propose a patch.) © 2010, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (4) 4 Comments I feel dirty for you :-p Comment by shivan — May 28, 2010 @ 12:08 am sed – the fastest compiler on earth ;-) Comment by Dmitrijs Ledkovs — May 28, 2010 @ 12:57 am Oh that is hideous! Kludge! Nice hack though. Comment by Mackenzie — May 28, 2010 @ 11:32 am Awesome :) Comment by Charlie — May 28, 2010 @ 12:42 pm'''
