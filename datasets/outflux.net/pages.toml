title = "General «  codeblog"
full_description = '''January 13, 2015 barcode consolidation Filed under: Blogging,Debian,General,Security,Ubuntu — kees @ 5:33 pm I had a mess of loyalty cards filling my wallet. It kind of looked like this: They took up too much room, and I used them infrequently. The only thing of value on them are the barcodes they carry that identify my account with whatever organization they’re tied to. Other folks have talked about doing consolidation in various ways like just scanning images of the cards and printing them all together. There was a site where you typed in card details and they generated barcodes for you, too. I didn’t want to hand my identifiers to a third party, and image scanning wasn’t flexible enough. I wanted to actually have the raw numbers, so I ended up using barcode. I didn’t use the Debian nor Ubuntu package, though, since it lacked SVG support, which was added in the latest (cough March 2013) version. I used the Android Barcode Scanner app, and just saved all the barcodes and their encoding details to a text file, noting which was which. For example: Albertsons "035576322436","UPC_A" Multnomah County Library "01237035218482","CODABAR" Supportland "!0000005341632030145420","CODE_128" ... I measured the barcode area, since some scanners can’t handle their expected barcodes being resized, (that’s another project: find out which CAN handle it), and then spat out SVG files. I compared the results to my actual cards, since some times encodings have different options (like dropping checksum characters, “-c” below): barcode-svg -S -u in -g 1.5x0.5 -e upc-a -b '035576322436' > albertsons.svg barcode-svg -S -u in -g 2x0.5 -e codabar -c -b '01237035218482' > library.svg barcode-svg -S -u cm -g 4.5x1 -e code128 -b '!0000005341632030145420' > supportland.svg ... With Inkscape, I opened them all and organized them onto a wallet-card-sized area, printed it, and laminated it. Now my wallet is 7 cards lighter. More room for HID cards or other stuff: © 2015, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on barcode consolidation June 13, 2014 glibc select weakness fixed Filed under: Blogging,Chrome OS,Debian,General,Security,Ubuntu,Ubuntu-Server — kees @ 11:21 am In 2009, I reported this bug to glibc, describing the problem that exists when a program is using select, and has its open file descriptor resource limit raised above 1024 (FD_SETSIZE). If a network daemon starts using the FD_SET/FD_CLR glibc macros on fdset variables for descriptors larger than 1024, glibc will happily write beyond the end of the fdset variable, producing a buffer overflow condition. (This problem had existed since the introduction of the macros, so, for decades? I figured it was long over-due to have a report opened about it.) At the time, I was told this wasn’t going to be fixed and “every program using [select] must be considered buggy.” 2 years later still more people kept asking for this feature and continued to be told “no”. But, as it turns out, a few months later after the most recent “no”, it got silently fixed anyway, with the bug left open as “Won’t Fix”! I’m glad Florian did some house-cleaning on the glibc bug tracker, since I’d otherwise never have noticed that this protection had been added to the ever-growing list of -D_FORTIFY_SOURCE=2 protections. I’ll still recommend everyone use poll instead of select, but now I won’t be so worried when I see requests to raise the open descriptor limit above 1024. © 2014, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on glibc select weakness fixed May 7, 2014 Linux Security Summit 2014 Filed under: Blogging,Chrome OS,Debian,General,Security,Ubuntu,Ubuntu-Server — kees @ 10:31 am The Linux Security Summit is happening in Chicago August 18th and 19th, just before LinuxCon. Send us some presentation and topic proposals, and join the conversation with other like-minded people. :) I’d love to see what people have been working on, and what they’d like to work on. Our general topics will hopefully include: System hardening Access control Cryptography Integrity control Hardware security Networking Storage Virtualization Desktop Tools Management Case studies Emerging technologies, threats & techniques The Call For Participation closes June 6th, so you’ve got about a month, but earlier is better. © 2014, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (1) December 20, 2013 DOM scraping Filed under: Blogging,Debian,General,Ubuntu,Ubuntu-Server,Web — kees @ 11:16 pm For a long time now I’ve used mechanize (via either Perl or Python) for doing website interaction automation. Stuff like playing web games, checking the weather, or reviewing my balance at the bank. However, as the use of javascript continues to increase, it’s getting harder and harder to screen-scrape without actually processing DOM events. To do that, really only browsers are doing the right thing, so getting attached to an actual browser DOM is generally the only way to do any kind of web interaction automation. It seems the thing furthest along this path is Selenium. Initially, I spent some time trying to make it work with Firefox, but gave up. Instead, this seems to work nicely with Chrome via the Chrome WebDriver. And even better, all of this works out of the box on Ubuntu 13.10 via python-selenium and chromium-chromedriver. Running /usr/lib/chromium-browser/chromedriver2_server from chromium-chromedriver starts a network listener on port 9515. This is the WebDriver API that Selenium can talk to. When requests are made, chromedriver2_server spawns Chrome, and all the interactions happen against that browser. Since I prefer Python, I avoided the Java interfaces and focused on the Python bindings: #!/usr/bin/env python import sys from selenium import webdriver from selenium.common.exceptions import NoSuchElementException from selenium.webdriver.common.keys import Keys caps = webdriver.DesiredCapabilities.CHROME browser = webdriver.Remote("http://localhost:9515", caps) browser.get("https://bank.example.com/") assert "My Bank" in browser.title try: elem = browser.find_element_by_name("userid") elem.send_keys("username") elem = browser.find_element_by_name("password") elem.send_keys("wheee my password" + Keys.RETURN) except NoSuchElementException: print "Could not find login elements" sys.exit(1) assert "Account Balances" in browser.title xpath = "//div[text()='Balance']/../../td[2]/div[contains(text(),'$')]" balance = browser.find_element_by_xpath(xpath).text print balance browser.close() This would work pretty great, but if you need to save any state between sessions, you’ll want to be able to change where Chrome stores data (since by default in this configuration, it uses an empty temporary directory via --user-data-dir=). Happily, various things about the browser environment can be controlled, including the command line arguments. This is configurable by expanding the “desired capabilities” variable: caps = webdriver.DesiredCapabilities.CHROME caps["chromeOptions"] = { "args": ["--user-data-dir=/home/user/somewhere/to/store/your/session"], } A great thing about this is that you get to actually watch the browser do its work. However, in cases where this interaction is going to be fully automated, you likely won’t have a Xorg session running, so you’ll need to wrap the WebDriver in one (since it launches Chrome). I used Xvfb for this: #!/bin/bash # Start WebDriver under fake X and wait for it to be listening xvfb-run /usr/lib/chromium-browser/chromedriver2_server & pid=$! while ! nc -q0 -w0 localhost 9515; do sleep 1 done the-chrome-script rc=$? # Shut down WebDriver kill $pid exit $rc Alternatively, all of this could be done in the python script too, but I figured it’s easier to keep the support infrastructure separate from the actual test script itself. I actually leave the xvfb-run call external too, so it’s easier to debug the browser in my own X session. One bug I encountered was that the WebDriver’s cache of the browser’s DOM can sometimes get out of sync with the actual browser’s DOM. I didn’t find a solution to this, but managed to work around it. I’m hoping later versions fix this. :) © 2013, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (2) September 12, 2011 5 years with Canonical Filed under: Blogging,Debian,General,Security,Ubuntu — kees @ 9:58 am This month, I will have been with Canonical for 5 years. It’s been fantastic, but I’ve decided to move on. Next week, I’m going to start working for Google, helping out with ChromeOS, which I’m pretty excited about. I’m sad to be leaving Canonical, but I comfort myself by knowing that I’m not leaving Ubuntu or any other projects I’m involved in. I believe in Ubuntu, I use it everywhere, and I’m friends with so many of its people. And I’m still core-dev, so I’ll continue to break^Wsecure things as much as I can in Ubuntu, and continue working on getting similar stuff into Debian. :) For nostalgic purposes, I dug up my first security update (sponsored by pitti), and my first Ubuntu Security Notice. I’m proud of Ubuntu’s strong security record and how far the security feature list has come. The Ubuntu Security Team is an awesome group of people, and I’m honored to have worked with them. I’m looking forward to the new adventures, but I will miss the previous ones. © 2011, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (14) February 5, 2011 fun with game memory Filed under: Blogging,Debian,General,Reverse Engineering,Ubuntu — kees @ 5:15 pm So, I was testing a (closed source) single-player offline game recently and thought this exercise might be fun to document. I didn’t want to spend any time actually earning in-game money since I’d played it before and I wanted to just skip ahead to other aspects of the game. I was curious how straight-forward adjusting my cash might be. So, noting the in-game “bank account number” of 219393 and account balance of 3000, I dived right in. First up, what’s the memory layout of the heap look like? I looked at the brk and the mmap regions without a mapped library or file, marked with “w” in the permissions column, from /proc/PID/maps: 0827e000-08282000 rw-p 00000000 00:00 0 0a22e000–0b08a000 rw-p 00000000 00:00 0 [heap] efa59000-efd00000 rw-p 00000000 00:00 0 efd00000-efd21000 rw-p 00000000 00:00 0 Knowing these, I could use gdb’s “find” command, after attaching to the process: $ gdb /some/cool/game … (gdb) attach PID … (gdb) find /w 0x0827e000, 0x08282000, 219393 (gdb) find /w 0x0a22e000, 0x0b08a000, 219393 0xaf03d08 0xaf06ca8 No hits in the first region, but I see two hits for the account number value in the second region. Let’s start there and see what’s near them… (gdb) x/8x 0xaf03d08 0xaf03d08: 0x00035901 0x00000000 0x00000000 0x0af06ce0 0xaf03d18: 0x0af06be0 0x00000059 0x0af03d98 0x0af041e8 (gdb) x/8x 0xaf06ca8 0xaf06ca8: 0x00035901 0x00000bb8 0x00000bb8 0x0820b148 0xaf06cb8: 0x00000001 0x00000000 0x00000000 0x00000000 In that second hit, I see the value 0xBB8, which is 3000, and matches our account balance. Let’s see what happens if we just change both of those to add a bit a few orders of magnitude above the current value… (gdb) set var *0xaf06cac = 0x00100bb8 (gdb) set var *0xaf06cb0 = 0x00100bb8 (gdb) x/32x 0xaf06cac 0xaf06cac: 0x00100bb8 0x00100bb8 0x0820b148 0x00000001 (gdb) continue And presto, clicking on the bank account details in-game shows a huge account balance of 1051576 now. No need to reverse-engineer any saved games, whew. © 2011, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (9) July 23, 2010 Achievement Unlocked Filed under: Blogging,Debian,General,Ubuntu — kees @ 5:45 am I think it would be fun to add an achievement system to the Ubuntu Desktop, like is done on Steam and XBox. The tricky part is tracking various events and finding amusing correlations. For example, if your screen-saver kicks in 40 times in a single 24 hour period, you could earn the “Alternating Current” achievement, indicating that you’re being repeatedly interrupted all day long: There are all kind of things to track and correlate. Miles moved with the mouse, clicks taken, keys pressed, files opened, applications installed, buddies added, IMs received, sent, etc. There are all kinds of achievements that could be designed that could be used to help people discover how to use Ubuntu, or for just plain humor. “Achievement Unlocked: Application Deficit Disorder” when you uninstall 100 applications you installed in the prior week. I’ve been told this might all be very easy to implement with the Gnome Activity Journal (Zeitgeist), but I haven’t had a chance to investigate further. UPDATE: I can easily imagine this being tracked in CouchDB, synced between systems via UbuntuOne, and could be linked to any other remote APIs that people could dream up, including Launchpad, Forums, REVU, Identi.ca, etc. © 2010, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (41) January 24, 2010 Google is wardriving Filed under: Blogging,Debian,General,Networking,Security,Ubuntu,Web — kees @ 8:28 pm So, a while back, Google started providing location services. This seemed pretty cool, but I kind of ignored it until recently when I was playing with my Android’s location API. With the GPS off, and no cell towers visible (my basement gets terrible cell service), my phone knew within about 500 feet of where it actually was. All I was connected to was my wifi. Bottom line: it seems that Google, among other methods, is likely wardriving while photographing for Street View. They are now able to pinpoint wifi access points if they happened to see it while driving through your city. I’m really rather astonished that no one is freaking out about this; I’m a bit unnerved. I implemented the location-of-your-wifi API quickly, so I could terrify myself further. You can do lookups via my location website too, if you want. UPDATE: yeah, it would seem to be crowd-sourced wifi and cell tower triangulation data. I should say “Google is WarCrowding”. © 2010, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (25) April 19, 2009 recording from PulseAudio Filed under: Blogging,Debian,General,Multimedia,Ubuntu — kees @ 11:42 am Every PulseAudio “Sink” has a “Source” named “monitor”. This lets you attach to a given Sink and chain more stuff to it, for example, recording the audio that is playing through PulseAudio at any given moment. This is very handy for creating, for example, PubQuiz-style clips of songs, movies, etc. Here is a script to find the monitor for the most recently added Sink, record from it, and shove it through “sox” to get a WAV instead of raw sound data (requir'''
