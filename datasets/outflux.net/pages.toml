full_description = '''October 22, 2008 using hdhomerun IR with lirc Filed under: Debian,Multimedia,Ubuntu — kees @ 5:18 pm Followed the instructions and got lirc configured with my HDHomeRun’s IR: # ID=$(hdhomerun_config discover | cut -d" " -f3) # hdhomerun_config $ID set /ir/target "10.0.0.100:5000 store" # echo 'REMOTE_LIRCD_ARGS="-H udp -d 5000"' >> /etc/lirc/hardware.conf # /etc/init.d/lirc restart # /etc/init.d/gdm restart © 2008, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on using hdhomerun IR with lirc No Comments No comments yet.'''
