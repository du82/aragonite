["https://outflux.net/blog/archives/2005/05/03/nice-kernelorg-write-up"]
title = "nice kernel.org write-up «  codeblog"
full_description = "May 3, 2005 nice kernel.org write-up Filed under: kernel.org — kees @ 2:50 pm As if a blog itself wasn’t enough shameless self-promotion, I’ve just gotta share more! There’s a nice write up at Kernel Trap on how the kernel.org servers work. I’m mentioned in there since I’m one of the guys that helps keep the machine running. Mostly I manage the mirror server validations. I’m the guy that bugs the other mirror admins about falling behind, etc. The real work is done by HPA and Nathan. They’ve got some great gear in place now. I can’t wait until the next Fedora Core release; it really drives the machines hard. I think it’s great to log into a fairly responsive machine, and see a load average over 200. And then realize that that’s normal. I love it! © 2005, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments Off on nice kernel.org write-up No Comments No comments yet."
