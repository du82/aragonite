["https://outflux.net/blog/archives/2013/01/21/facedancer-built"]
title = "facedancer built «  codeblog"
full_description = "January 21, 2013 facedancer built Filed under: Blogging,Chrome OS,Embedded,Security,Ubuntu,Ubuntu-Server — kees @ 2:39 pm I finally had the time to put together the facedancer11 that Travis Goodspeed was so kind to give me. I had ordered all the parts some time ago, but had been dreading the careful surface-mount soldering work it was going to require. As it turned out, I’m not half bad at it — everything seems to have worked the first time through. I did, however, fail to order 33ohm 0603 resistors, so I have some temporary ones in use until I can replace them. This device allows the HOST side computer to drive USB protocol communication at the packet level, with the TARGET seeing a USB device on the other end. No more needing to write careful embedded code while breaking USB stacks: the fake USB device can be controlled with Python. This means I’m able to start some more serious fuzzing of the USB protocol layer. There is already code for emulating HID (Keyboard), Mass Storage, and now Firmware Updates. There’s probably tons to look at just in that. For some background on the fun to be had just with Mass Storage devices, see Goodspeed’s 23C9 presentation on it. © 2013 – 2015, Kees Cook. This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 License. Comments (1) 1 Comment Hi, I build some of them too. I ordered all the parts on DigiKey, but they are also available at mouser. Here are the P/N: RES 33 OHM 1/10W 5% 0603 SMD Mouser: 71-CRCW0603-33-E3 DigiKey: RMCF0603JT33R0CT-ND P.S. If someone need help to build them up, leave me a comment on my blog. Comment by Xatru — January 24, 2013 @ 1:11 pm"
