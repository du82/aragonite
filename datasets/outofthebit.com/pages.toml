["https://outofthebit.com/privacy.html"]
title = "OutOfTheBit Ltd"
description = "OutOfTheBit Ltd: Classic and Arcade Games"
full_description = 'OutOfTheBit Ltd ("We") are committed to protecting and respecting your privacy. This policy explains why we ask for your consent for collecting and processing your personal data (or why and in which cases we ask for your consent on behalf of third parties); what type of data we (or our partners) will collect and process and what are your rights regarding those processes. Please read this document carefully. Our apps use Game Center and Google Play Services in order to show you a Leaderboard. Therefore, we do not collect nor process any of your personal data in order to show you a Leaderboard on those games; our partners do it, instead, so please refer to Terms&Conditions/Privacy Notes from them in order to know more about how they treat your data and your rights on that regards. Your consent to collect and process, in that case, would have been gathered by those providers when you subscribed to their services. As most of our apps are free to download and play, in order to support our independent studio we show ads in our games from trusted providers and in a responsible manner. The ads providers we currently use are Google and Unity. The providers we use may vary in time and you will be notified should this happen. Those providers may show you ads according to your interests and in order to do so they need to collect and process some of your personal data. For these reasons we ask, on their behalf, for your consent to have some of your personal data collected and processed by them. Please refer to Terms&Conditions/Privacy Notes from those providers to know more about how they treat your data, what data they collect and other related information. These providers may share your data with third party ad technology providers for the sole purpose of ad personalisation. Please click here for a list of ad technology providers your data might be shared with. We ask for your consent through a message shown to you when you open our apps (usually the first time you open them or the first time you open them after the 25th of May 2018). If you do not consent or at any point you withdraw your consent, you will be shown non-personalised ads (not based on your past behavior, interests and choices). You have the right to change your mind and withdraw your consent and you can review your options from the menu of the app, opening the privacy menu and choosing the personalised ads consent option. You also have the right to review what data the ad providers hold about you, check how those data are used and ask ad providers to permanently erase your personal data. Please refer to Terms&Conditions/Privacy Notes from those providers to know more about your rights, your data and the tools they provide - https://www.google.com/policies/technologies/partner-sites. Alternatively, you can contact us writing an email to info@outofthebit.com.'
