["https://outreachy.org/docs/community"]
title = "Community Guide | Outreachy Documentation"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = '''Outreachy is a paid, remote internship program. Outreachy's goal is to support people from groups underrepresented in tech. We help newcomers to free software and open source make their first contributions. Outreachy provides internships to work open source. People apply from all around the world. Interns work remotely, and are not required to move. Interns are paid a stipend of $7,000 USD for the three month internship. Interns work with experienced mentors from open source communities. Outreachy internship projects may include programming, user experience, documentation, illustration, graphical design, or data science. Interns often find employment after their internship with Outreachy sponsors or in jobs that use the skills they learned during their internship. A FOSS community can be a small set of contributors that work together on one piece of software or one free culture project. A community can also be comprised of many different teams that each work on separate subsystems, modules, applications, libraries, tools, documentation, user experience, graphical design, and more. Each team can submit one or more intern project proposals. Outreachy cannot accept intern project proposals that don't have an associated community. A note on pronouns: The Outreachy website allows applicants, mentors, and coordinators to list their pronouns. Sometimes you may not know the gender identity of an Outreachy participant. In that case, please avoid using gender-specific language. In English, you should use gender neutral language (e.g. "person" instead of "woman" or "man"). You should use gender neutral pronouns ("they" instead of "he" or "she"). We ask that you avoid using gender-specific honorifics like "Mr", "Sir", "Mrs", "Miss", or "Ma'am". We recognize that languages other than English are heavily gendered. It may not be possible to use gender-neutral language in your native language, but we ask you to do so when communicating in English. Outreachy interns come from a wide range of backgrounds. Interns could be university students, code school graduates, people switching careers, or people coming back to tech after starting a family or other long absence.'''
