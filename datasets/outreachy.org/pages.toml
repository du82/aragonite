["https://www.outreachy.org/blog/2021-01-15/may-2021-community-cfp-open"]
title = "Call for May 2021 mentoring communities"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "Outreachy is seeking open source communities to participate in the May to August 2021 internship round. Outreachy does not require your community to provide internship funding. However, donations to Outreachy have decreased over the last few years, and we currently have a very limited budget to fund internships each cohort. We often find that FOSS communities know best what organizations or companies might have funding available. Therefore, we need your help finding additional Outreachy sponsors. We cannot assure funding for your interns, but we will try. Your help identifying fundraising leads will be a major factor in the success of this Outreachy internship cohort. In order to sustain our program, Outreachy needs to receive donations of at least $6,500 to $10,000 USD per intern we accept. This breaks down to: Outreachy is a labor intensive program. Outreachy organizers are highly involved with interns. Outreachy organizers work closely with your community's mentors to empower your interns to pursue a future in FOSS. The Outreachy organizers share tips for your interns on how to attend FOSS conferences, encourage your interns to explore careers or academic research in open source, and help them expand their network of open source contracts. Outreachy's deep support of interns, along with your mentoring partnership, means 80% of past Outreachy interns continue to contribute to open source after their internship. Outreachy organizers' deep support of interns would not be possible without funding for Outreachy's core program activities. We highly encourage organizations to donate additional funds to Outreachy program activities because additional donations helps us retain Outreachy interns in the open source community. We need your community's help to identify and convince organizations to provide donations to help Outreachy sustain our deep support of interns, and retain their amazing talent in our open source community. Please don't think about this as just finding funding for your interns for this internship cohort. This is about sustaining our program, and we ask for your help with promotion and fundraising leads."
