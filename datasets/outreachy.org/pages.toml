["https://www.outreachy.org/blog/2021-10-14/hiring-for-an-outreachy-community-manager"]
title = "Hiring for an Outreachy community manager"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = '''Outreachy is seeking a community manager to help us run our internship program! Please share this post on social media: ✨ Outreachy is hiring a community manager. ✨ You will communicate with Outreachy applicants, interns, and mentors. 📬 You will work remotely for 30 to 40 hours per week. Please apply by Oct 31! https://www.outreachy.org/blog/2021-10-14/hiring-for-an-outreachy-community-manager/ Outreachy is a paid, remote internship program. Interns work remotely with mentors from free and open source software communities for three months. Outreachy is a diversity initiative under the 501c3 non-profit Software Freedom Conservancy. Our internship program has two internship cohorts each year. Internships run from May to August and December to March. The applicants for our internships come from around the world, and from a wide variety of backgrounds. Outreachy applicants include, for example, university students, bootcamp graduates, people who are self-taught, or people switching careers. Among others, you'll work with women (both cis and trans), trans men, gender queer people, and people of color with a variety of gender identities. Outreachy and our parent organization, Software Freedom Conservancy, is an equal opportunity employer. All Outreachy participants, including Outreachy staff, are required to follow the Outreachy Code of Conduct. Your main task will be communicating with applicants, interns, and mentors. You will answer applicant questions sent in via email and through social media. You will also run text-based chats with interns and mentors. You will review intern and mentor feedback, and step in when issues arise during the internship. As time allows, we would also love help promoting Outreachy. You may increase Outreachy's presence on social media, including promoting Outreachy intern's blog posts and the work they do. You may want to create blog posts or video interviews about Outreachy interns, mentors, and alums to give Outreachy a more personal "face" to the public.'''
