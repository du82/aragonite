["https://www.outreachy.org/blog/2023-08-08/december-2023-initial-applications-open"]
title = "Outreachy December 2023 internship applications"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "We strongly recommend you read our tips for application essays before submitting your initial application. Initial applications are reviewed on a first-come-first-served basis. Don't wait until the last day to submit your application! Outreachy provides internships in open source and open science. We provide internships to people subject to systemic bias and impacted by underrepresentation in the technical industry where they are living. 💵 Paid - $7,000 USD total internship stipend 🌍 Remote - interns work remotely 🕰 3 months - internships run May to August, or December to March We invite people to apply who face systemic bias or discrimination in the technology industry of their country. Outreachy expressly invites applicants who are women (both cis and trans), trans men, non-binary people, and genderqueer people to apply. We also expressly invite applications who are residents and nationals of the United States of America of any gender who are Black/African American, Hispanic/Latin@, Native American/American Indian, Alaska Native, Native Hawaiian, or Pacific Islander. What is open source? Open source software means anyone has the freedom to collaborate with others to improve code. Open source software is code published online under a specific license. An open source license means anyone can download, modify, and share their changes to the code. Outreachy applicants will notice more open science projects this internship cohort. Outreachy received a grant from the Chan-Zuckerberg Initiative. This grant supports Outreachy running open science internships. Open science projects allow anyone to reproduce their research. This means making sure the software tools, data sets, and research papers are published under an open source license. An open source license means anyone can download, modify, and share their changes. The internship project list will not be finalized before the initial application deadline. Please submit an initial application ASAP. Submit an initial application even if you don't see a project that interests you."
year_published = 2025
