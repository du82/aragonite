["https://outreachy.org/docs/internship"]
title = "Internship Guide | Outreachy Documentation"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "Your project should be your primary focus during your internship. Unless contrary to any laws where you are located, you should dedicate 30 hours per week to your project for at least 12 weeks of the Outreachy internship's 13 week duration. Outreachy understands that interns may be temporarily interrupted from working on their project. You may get sick or have to deal with extreme weather. You may have a power outage or internet outage. Your computer may break down. You may want to spend time with your family on during a holiday or vacation. As stated above, we expect interns to work 30 hours a week for at least 12 weeks of the 13 week internship. Please let your mentor know if you are not working on the project for a short period of time. Rarely, interns work less than full-time, or cannot work for all 12 weeks. In that case, interns will need to arrange an internship extension with their mentor. Mentors recommend interns for extensions at the initial, mid-point, and final feedback dates. Outreachy organizers will confirm the extension with interns and mentors via email. Internships can be extended for up to five weeks. Internships cannot be extended for more than 5 weeks. We cannot allow an internship to be stopped and then later restarted. When an internship is extended, the feedback dates and payment dates will be shifted by the amount of the internship extension. Outreachy mentors are focused on helping interns complete their project. Some mentors provide career advice or help connecting to the larger open source community, but it is not required for mentors to do so. Please see the career development section below. Outreachy is working to improve the career development services we offer interns. We currently offer a very limited set of career development opportunities: An Outreachy internship is not a guarantee that you will find a job with an Outreachy sponsor. Some applicants pick their internship because they want to network with open source contributors who work for a particular company. However, you may end up working with open source contributors who are volunteers or work for other companies. Outreachy interns should be open to networking and working with all open source contributors, regardless of who they work for."
