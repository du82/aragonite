["https://www.outreachy.org/blog/2021-02-01/may-2021-initial-applications-open"]
title = "Outreachy May 2021 internship applications"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "The initial application system will open at Feb. 1, 2021 at 4pm UTC. Initial applications are due Feb. 22, 2021 at 4pm UTC. We strongly recommend you read our tips for application essays before submitting your initial application. Initial applications are reviewed on a first-come-first-served basis. Don't wait until the last day to submit your application! What is Outreachy? Commonly asked questions Important dates Twitter chat Student eligibility policy COVID-19 temporary time commitment policy Updated essay questions Sensitive data retention policy We invite people to apply who face systemic bias or discrimination in the technology industry of their country. Outreachy expressly invites applicants who are women (both cis and trans), trans men, non-binary people, and genderqueer people to apply. We also expressly invite applications who are residents and nationals of the United States of America of any gender who are Black/African American, Hispanic/Latin@, Native American/American Indian, Alaska Native, Native Hawaiian, or Pacific Islander. Want to hear from mentors and past interns? Have questions about applying? Join us for a Twitter chat! Each round, Outreachy has a Twitter chat to introduce the program. We encourage questions from people interested in applying to Outreachy. We also pose questions for mentors and past Outreachy interns to answer. Applicants are encouraged to ask mentors and past interns questions during and after the chat. The #OutreachyChat will happen on Feb. 8, 2021, 4 p.m. UTC. Please double check what time that is in your timezone. Please follow Outreachy on Twitter if you have a Twitter account. The Outreachy organizers will be tweeting from the @outreachy Twitter account. Outreachy organizers will pose the questions below. Applicants, mentors, and past interns will answer. Outreachy organizers will wait about 5-10 minutes between questions. The questions are prefaced with Q1, Q2, etc. You will need to reply with A1, A2, at the start of you answer. Please also use the hashtag #OutreachyChat in all your tweets related to the chat."
