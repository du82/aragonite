full_description = "The initial application system opens at Aug. 9, 2022 at 4pm UTC. Initial applications are due Aug. 29, 2022 at 4pm UTC. We strongly recommend you read our tips for application essays before submitting your initial application. Initial applications are reviewed on a first-come-first-served basis. Don't wait until the last day to submit your application! Outreachy provides internships in open source and open science. We provide internships to people subject to systemic bias and impacted by underrepresentation in the technical industry where they are living. 💵 Paid - $7,000 USD total internship stipend 🌍 Remote - interns work remotely 🕰 3 months - internships run May to August, or December to March We invite people to apply who face systemic bias or discrimination in the technology industry of their country. Outreachy expressly invites applicants who are women (both cis and trans), trans men, non-binary people, and genderqueer people to apply. We also expressly invite applications who are residents and nationals of the United States of America of any gender who are Black/African American, Hispanic/Latin@, Native American/American Indian, Alaska Native, Native Hawaiian, or Pacific Islander. The internship project list will not be finalized before the initial application deadline. Please submit an initial application ASAP. Submit an initial application even if you don't see a project that interests you. The initial application system will open at Aug. 9, 2022 at 4pm UTC. Initial applications are due Aug. 29, 2022 at 4pm UTC. The Outreachy intern project project list will not be finalized until Oct. 8, 2022. That is after the initial application deadline. Please fill out an initial application, even if you don't see a project that interests you. More projects will be added after the initial application deadline. Want to know what it's like to be an Outreachy intern? Have questions about applying? Join us for our Twitter chat and Twitter spaces! Come learn about Outreachy and find out if you're eligible to apply! Join Outreachy organizers Sage Sharp and Omotola Omotayo in a Twitter space conversation. Sage and Omotola will go over Outreachy's eligibility rules and answer commonly asked questions."
