            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "Since the beginning of Outreachy's history, Outreachy interns have been paid their $5,500 internship stipend in three amounts: an initial $500 stipend, a $2,250 mid-point stipend, and a $2,750 final stipend. Today we're making changes to the payment amounts and schedules to better support interns who are financially independent. Interns will receive a bigger initial stipend, with slightly smaller midpoint and final stipends. The total internship stipend remains $5,500 USD. Originally, Outreachy's payment schedule was the same as Google Summer of Code. Interns who started their internship would receive an initial stipend of $500 USD. In the middle of the internship, mentors would evaluate whether interns were putting in a full-time (40 hours a week) effort. Interns who were in good standing would be paid $2,250 USD. If the intern finished their internship while giving a full-time effort, they would be paid $2,750 USD. Another difference is how Outreachy and Google Summer of Code handle intern payments. Google Summer of Code interns are sent credit cards, which are loaded with the payment amount as soon as mentor feedback is processed. Outreachy's parent fiscal sponsor, Software Freedom Conservancy, has to handle payment through a variety of methods including international bank transfer and PayPal. Tracking mentor feedback and initiating transfers to 40 different people (who are potentially on different schedules due to internship extensions) takes Outreachy organizers and Conservancy staff some time. Since Outreachy interns are contractors of Software Freedom Conservancy, interns are paid on a NET-30 basis. This means that it may take up to 30 days after Outreachy organizers receive mentor feedback for interns to receive payment. The end result is that Outreachy interns don't get their initial payment until a month into their internship, and they don't receive their mid-point payment until the internship is almost over. Trying to stretch $500 USD over 10 weeks presents a financial hardship to some Outreachy interns, and we're taking steps to fix that."
