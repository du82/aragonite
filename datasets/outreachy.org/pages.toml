["https://www.outreachy.org/blog/2020-03-27/outreachy-response-to-covid-19"]
title = "Outreachy's Response to COVID-19"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "The Outreachy organizers are putting new policies in place to deal with the impact of the global crisis caused by the novel coronavirus, COVID-19. Outreachy is a paid, remote internship program. Our goal is to increase diversity in free and open source software. Outreachy applicants come from around the world. Even though Outreachy is completely remote, we're aware that applicants have been impacted by the pandemic. Primary schools and child care facilities around the world are closing. Some Outreachy applicants are parents caring for young children during these sudden closures. Universities and college dorms around the world are closing. Outreachy applicants who are students may have to move or face uncertainty about their future school term schedule. Additionally, some applicants have been cut off from mentors during internet outages related to lock-downs. The current COVID-19 crisis is underscoring the inequities in our society. People who have jobs that can be done remotely find themselves in a stable situation and able to better weather this crisis at home. However, many workers have no immediate way to earn a living without risking their lives. Outreachy provides paid remote work at this critical time to people who need these opportunities most. Getting paid home-based work to folks who face systemic bias has never been more important than it is right now. We encourage companies to sponsor Outreachy interns, and anyone whose financial situation is not impacted by the current crisis to make an individual donation. You can help us to provide more remote internships in this turbulent time. Outreachy wants to support our applicants, interns, and alums who are impacted by the global pandemic. The short summary of this blog post is: The Outreachy PLC has approved a temporary intern time commitment policy. This temporary policy applies to the May to August 2020 round: We're only asking impacted interns to commit to working 75% of their normal hours. If interns are able to work more normal hours, they will get more out of the internship. We encourage interns to work as best they can, while not burning themselves out."
year_published = 2025
