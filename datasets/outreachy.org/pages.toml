description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = '''Welcome to Outreachy! We provide documentation for applicants, interns, mentors, coordinators, and sponsors to help them understand their role. If you have a question that isn't answered here, please contact us. We welcome additions and feedback on our documentation. Feel free to file an issue or send us a pull request. Outreachy documentation is organized based on participant's role. Some information is useful to multiple types of participants. That information is duplicated in multiple sections. A note on pronouns: The Outreachy website allows applicants, mentors, and coordinators to list their pronouns. Sometimes you may not know the gender identity of an Outreachy participant. In that case, please avoid using gender-specific language. In English, you should use gender neutral language (e.g. "person" instead of "woman" or "man"). You should use gender neutral pronouns ("they" instead of "he" or "she"). We ask that you avoid using gender-specific honorifics like "Mr", "Sir", "Mrs", "Miss", or "Ma'am". We recognize that languages other than English are heavily gendered. It may not be possible to use gender-neutral language in your native language, but we ask you to do so when communicating in English. Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions. The Outreachy website is built with Django, Wagtail, bootstrap and deployed with Dokku. The code is licensed GPL v3 and can be found in the Outreachy website GitHub repo. There is a separate GitHub repo for creative works This program and all offers related to it are void where prohibited or restricted by law or where operation of the program would violate any law or right. All participants in the program must agree to the terms and conditions of the program which will be provided to the selected applicants.'''
