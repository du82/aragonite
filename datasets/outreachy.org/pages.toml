["http://outreachy.org/blog/outreachy-statistics-december-march-2017-applicants"]
title = """
Outreachy Statistics for December to March 2017 Applicants  
            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "The application period for the December to March 2017 Outreachy internships is now closed. We currently going through the intern selection process and trying to find additional sponsors for the accepted interns who applied to work on many different projects. In order to be accepted as an Outreachy intern, applicants need to make at least one contribution to the free and open source project they're applying to. During the six week application period, applicants get in contact with mentors and try to complete tasks. Some project have a longer bootstrapping process, which is why we recommend applicants start making a contribution at least three weeks before the deadline. This round, 42% of applicants made a contribution to their project. We accept around 30-50 interns each round (depending on funding). That means people who successfully make a contribution to a project have a 30% to 50% chance of getting accepted. Outreachy is a full-time, 40-hour a week internship. We have specific rules for students who apply to be an Outreachy intern to ensure they have at least seven consecutive weeks free from full-time school. Some times that means dropping credits down to half time, or using the Outreachy internship for university project or research credits. Each Outreachy round, we get enthusiastic applicants who aren't eligible due to full-time school commitments. This round, we added additional questions to our application to check credits, time off between classes, and more. After checking the answers, some students were clearly not eligible (the ineligible bar below). Some students didn't fill out all the information required, or misunderstood the questions. Some applications were blank, and some applicants stopped filling out the form once they understood they didn't meet the eligibility rules. Those applicants are all included in the 'Unknown' bar below. Outreachy mentors were told a week before the application deadline which applicants were ineligible, and which applicants needed to provide more information. Mentors could then ask their applicants to provide additional information. Only Outreachy applicants with confirmed eligibility will be accepted as interns."
