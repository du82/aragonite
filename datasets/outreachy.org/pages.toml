full_description = "Thanks for helping us promote Outreachy internships! This page lists sample tweets, emails, and posters you can use to promote the program. We welcome translations of our promotional materials into into more languages! Please send a pull request. The Outreachy logo is available in either svg or png format. Please do not recolor the Outreachy logo. We appreciate being contacted before the Outreachy logo is used in press releases. You can use this presentation that introduces open source, Outreachy, and Google Summer of Code: (pdf or odp) Outreachy internships are remote, paid ($7,000), and last three months. Outreachy supports diversity in free and open source software! Outreachy internships run from May to August and December to March. Applications open in January and August: https://www.outreachy.org/apply/ Outreachy internships are for applicants from around the world who face under-representation, and systemic bias or discrimination in the technology industry of their country. Our internships are completely remote, paid ($7,000 stipend), and last three months. Apply here: https://www.outreachy.org/apply/ I'd like to invite you to apply to an internship program called Outreachy! Outreachy provides three-month internships to work in Free and Open Source Software (FOSS). Outreachy internship projects may include programming, user experience, documentation, illustration and graphical design, or data science. Interns often find employment after their internship with Outreachy sponsors or in jobs that use the skills they learned during their internship. Outreachy internships run twice a year. The internships run from May to August and December to March. Outreachy internships are completely remote. Outreachy internships are open to applicants around the world. Interns work remotely with experienced mentors. We expressly invite women (both cis and trans), trans men, and genderqueer people to apply. We also expressly invite applications from residents and nationals of the United States of any gender who are Black/African American, Hispanic/Latin@, Native American/American Indian, Alaska Native, Native Hawaiian, or Pacific Islander. Anyone who faces under-representation, systematic bias, or discrimination in the technology industry of their country is invited to apply."
