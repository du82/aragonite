["https://outreachy.org/docs/applicant"]
title = "Applicant Guide | Outreachy Documentation"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "What is Outreachy? What is free software and open source? Eligibility Am I experienced enough? Do I have to be a programmer to apply? Do you have the type of project I'm interested in? Outreachy schedule Application period overview Initial application Legal names in Outreachy Preparing for the contribution period Finding a Mentor and an Internship Project Making Contributions How are contributions evaluated? Estimated number of interns Final application Intern announcement Internship Outreachy is a paid, remote internship program. Outreachy's goal is to support people from groups underrepresented in tech. We help newcomers to free software and open source make their first contributions. Outreachy provides internships to work open source. People apply from all around the world. Interns work remotely, and are not required to move. Interns are paid a stipend of $7,000 USD for the three month internship. Interns work with experienced mentors from open source communities. Outreachy internship projects may include programming, user experience, documentation, illustration, graphical design, or data science. Interns often find employment after their internship with Outreachy sponsors or in jobs that use the skills they learned during their internship. Free and Open Source Software (FOSS) is software that gives the user the freedom to use, copy, study, change, and improve it. We encourage you to read an introduction article about open source software. Open source projects are built collaboratively. Open source contributors work together publicly. Working publicly creates a fun collaborative community around a project. It allows anyone to make innovative changes that reach many people. Open source contributors work on a lot of different things! You can contribute by developing software. Or you might want to improve user experience by contributing design work. You can help with documentation, community management, marketing, identifying issues and reporting bugs, helping users, event organization, graphic design, and translations."
