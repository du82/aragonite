["https://www.outreachy.org/blog/2021-03-30/contribution-period-open"]
title = "Outreachy May 2021 contribution period open"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = '''We are pleased to announce that the Outreachy contribution period is open! Outreachy has approved 733 applicants to continue onto the contribution period. Outreachy received a record 3,308 initial applications for the May 2021 cohort, our largest number of applicants for any round by far. This reflects how much our program, and programs like ours are needed right now. We get into the details of our review of initial applications a little bit more below, after some practical information for this round's applicants. Approved applicants have been sent an email with next steps. Please check your spam folder, or your Promotions or Updates tab in Gmail. You can also see whether your initial application has been accepted by going to the Outreachy website dashboard: If your initial application has been accepted, please pick a project and start making contributions as soon as you can! If your initial application was not accepted, we encourage you to apply early to the next round that you're eligible for. Sign up for the Outreachy announcements mailing list for a reminder of application deadlines. If you are a student in the southern hemisphere, you are only eligible to apply for the December cohorts. We invite you to apply to the December 2021 cohort. Applications for the December 2021 cohort will open in early August 2021. If you are a student in the northern hemisphere, you are only eligible to apply for the May cohorts. We invite you to apply to the May 2022 cohort if your initial application was not accepted for this cohort. Applications for the May 2022 cohort will open in early February 2022. If your initial application was not accepted, we encourage you to take a look at our list of job opportunities from Outreachy sponsors. Outreachy organizers often get asked, "How many applicants applied last year?" The best comparison is the May 2020 cohort, since application numbers decrease during the December rounds, when students from the northern hemisphere are not eligible for Outreachy. Below is a break down of how our progress for the May 2021 cohort compares to the May 2020 cohort.'''
