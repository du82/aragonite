["https://outreachy.org/apply/rounds/2017-december-march"]
title = """
Apply | December 2017 to March 2018 Projects  
            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = '''Why apply to Outreachy? > Outreachy Eligibility Rules > Find a Mentor and Internship Project > Past Outreachy Rounds Below is a list of the communities and the projects they offer. Sometimes this project listing gets out of date, so check the community landing page for the most current projects offered. For each community, an approximate number of internship slots are listed. Please note that many communities find additional funding from the Outreachy general fund, so they may end up taking more interns than they have funding for. Don't avoid applying to a community just because it has a small number of internship slots! Please note that although communities like Mozilla and Linux Kernel often accept more interns, those communities have the most competitive projects. If you want to apply for either Mozilla or the Linux Kernel, please consider applying to a second project as well. Each project has a list of skills they would like applicants to have basic experience with. Some project mentors are willing to teach applicants and interns new skills, so it never hurts to ask mentors what skills are required and which skills are optional. People from backgrounds who are under-represented in tech often feel impostor syndrome, which makes them under-estimate their skills. If you feel you "aren't experienced enough" or you only have some of the listed skills, it's important to apply anyway! Outreachy mentors are welcoming and willing to help. Where ever possible, please try to communicate with mentors and send contributions to the public issue trackers or mailing lists that projects list on their landing pages. Some projects use a group chat tool called IRC. IRC can be a complex tool, but there are good beginner tutorials and notes on IRC etiquette and IRC clients. If you have trouble getting a hold of a mentor, you can send email to mentors@lists.outreachy.org. If you have a question about eligibility or can't find a project that you're interested in, you can send email to organizers@outreachy.org.'''
