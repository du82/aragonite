["http://outreachy.org/blog/picking-outreachy-project"]
title = """
Picking an Outreachy Project  
            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = '''The Outreachy project list has over 40 projects on it. It can be overwhelming to go through a list that big! Here's our tips for finding the project that fits you the best. In order to pick a project that fits you, first brainstorm a list of skills you have, or skills you want to learn. Although the Outreachy project list doesn't have a search function (yet!) you can use your browser's 'Find' functionality to search within the project list for those skills.Outreachy mentors have listed which skills are needed for applicants to have before they start working on a contribution. If a skill is required, you should know it before you start making a contribution to that project.Some skills are 'preferred' meaning mentors would prefer applicants to have that skill, but they're happy to accept applicants who don't have that skill. Some skills are "nice to have" meaning it would be great if applicants have this skill, but if you didn't have that skill, it would be no big deal.If you're excited about a project, but don't have the preferred or optional skills, we encourage you to try contributing anyway! Making a contribution to a project, whether it's a small documentation change or a bug fix, will help you learn the skills need. At worst, you'll have learned more about yourself, and at best you'll have a contribution to an open source project to showcase on your resume.If you think you'll need to stretch your skills a little, I encourage you give the project a try! You never know whether you'll like a project until you try talking with the project mentors and making a contribution to it. Here's the words of a former Outreachy intern about how many projects to pick:"Narrow down your project choices to two at the most... The reason you need to focus on a few projects is that this will enable you to concentrate on being a great candidate for that project. It means you will spend more time understanding the project, communicating with the mentors, and in turn making significant contributions to the project — as opposed to being everywhere and achieving half-baked progress on many projects."'''
