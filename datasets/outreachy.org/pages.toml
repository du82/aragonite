["https://www.outreachy.org/blog/2022-06-14/remembering-and-honoring-marina-zhurakhinskaya-founder-of-outreachy"]
title = "Remembering and Honoring Marina Zhurakhinskaya, Founder of Outreachy"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "It is with great sadness that we write about the death of one of the most significant contributors to Free and Open Source Software, Marina Zhurakhinskaya. Marina was a force for change and leaves a profound legacy of diversity, inclusion, equity and justice. It is impossible to imagine what Software Freedom Conservancy and Outreachy would be like without Marina. Born in Kyiv, Ukraine, Marina moved to the United States after completing high school. She was accepted at the Massachusetts Institute of Technology after less than a year in the United States and graduated from MIT with a Bachelor’s and Master’s degree in Computer Science. After working at the MIT Lincoln Laboratory for several years, she joined Red Hat, a company focused on open source solutions for the enterprise market. While at Red Hat, Marina began to contribute to the GNOME desktop, working as a developer on GNOME Shell, and then became active in the GNOME community. Marina tirelessly created and improved systems to help new people contribute to GNOME and free software, generally. She created a mentors list for GNOME as well as a newcomers' tutorial. She helped improve GNOME's participation in Google Summer of Code. In 2009, Marina reinvented a program to provide paid internships for women to contribute to GNOME. That program, which Marina carefully architected and continued to lead and collaborate on for the next decade, became GNOME's Outreach Program for Women and ultimately grew into Outreachy, an internship program for everyone subject to systemic bias and impacted by underrepresentation — one of the most important programs of Software Freedom Conservancy. Marina always cared about getting the details right. This dedication was consistently reflected in her meticulous efforts to document Outreachy's processes and to keep records of the successes of the program. Marina's caring and enthusiasm for Outreachy's participants resulted in deep relationships with many of the program's alums. Marina celebrated every conference presentation by former participants in the program, and any news of their career developments. Along with Karen Sandler, Marina refined and grew the program beyond GNOME to include more open source communities. Since Marina ran the first round of the program in 2010, 846 people have successfully completed the program."
year_published = 2025
