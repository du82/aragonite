["https://www.outreachy.org/blog/2020-08-28/december-2020-internship-applications-open"]
title = "Outreachy December 2020 internships"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "The initial application system will open at Aug. 28, 2020 at 4pm UTC. Initial applications are due Sept. 21, 2020 at 4pm UTC. Initial applications are reviewed on a first-come-first-served basis. Submit your initial application early! What is Outreachy? Important dates Student eligibility policy COVID-19 temporary time commitment policy Updated essay questions Sensitive data retention policy We invite people to apply who face systemic bias or discrimination in the technology industry of their country. Outreachy expressly invites applicants who are women (both cis and trans), trans men, non-binary people, and genderqueer people to apply. We also expressly invite applications who are residents and nationals of the United States of America of any gender who are Black/African American, Hispanic/Latin@, Native American/American Indian, Alaska Native, Native Hawaiian, or Pacific Islander. Outreachy is open to both students and people who are not students. Please see our full eligibility guidelines. Outreachy organizers understand that schools are impacted by COVID-19. Some schools may have changed their term dates. We expect school term dates to change in the following year as well. Outreachy wants to ensure students from the southern hemisphere have a fair chance at an internship. Therefore, we are sticking with our policy that northern hemisphere students are only eligible for the May to August rounds. We invite students from the southern hemisphere to apply to the Outreachy December 2020 to March 2021 round. If your university is near the equator, you are welcome to apply. We consider India to be in the northern hemisphere, regardless of where the university is located. Students in India should to apply to the May to August 2021 internships. Brazilian public university term dates have been impacted by COVID-19. Outreachy organizers have reviewed the revised term dates that are available. For this round, students must have 42 days free from school and exams during the internship period. This allows the majority of Brazilian public universities to be eligible for Outreachy."
