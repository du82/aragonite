["http://outreachy.org/blog/dispelling-outreachy-applicants-doubts"]
title = """
Dispelling Outreachy Applicants' Doubts  
            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = '''The application period for the December 2018 to March 2019 internship round is now open! The Outreachy organizers have noticed that applicants often have similar doubts about applying to Outreachy internships. This blog post should (hopefully!) help dispel some of those doubts. Outreachy's application process is a little different from other internship programs. Applicants will need to fill out an initial application and have it be approved. Then they will need to make a contribution to a free and open source project during the six-week application period. Only applicants who finish a contribution will be eligible to be accepted as an intern. One of the most common worry we hear from applicants is, "How much experience do I need to participate in Outreachy?" Applicants are concerned they don't have good enough skills to contribute to Free and Open Source Software (FOSS) communities. Many are concerned because they've never contributed to FOSS before. Outreachy organizers often get questions from applicants like, "How much experience do I need in Python?" and "What if I've never contributed to open source before?" To answer those questions, I turned to data science! I reviewed the final applications from the last Outreachy internship round (May to August 2018). I looked specifically at the applicants who were selected as an Outreachy intern. That does mean that 63% of accepted Outreachy interns had experience contributing to free software before they applied to Outreachy. However, contributions to free software projects come in many shapes and forms. A contribution might be as simple as answering a question on a mailing list, or as complex as submitting a major project feature. The good news is that 60% of the selected Outreachy interns had never made a coding contribution before they applied to Outreachy! We encourage people to apply, even if they have no experience contributing to free and open source software. Outreachy has projects for people at all skill levels. Most projects expect that you have a little experience with their required project skills, like programming, documentation, user experience, or graphical design. Many Outreachy mentors are willing to teach applicants those skills. If you're worried that you might not have enough skills, you should try making a contribution to the project. In the worst case, you'll learn something new by asking the mentor questions. In the best case, you'll learn that you are experienced enough to apply to this project!'''
year_published = 2025
