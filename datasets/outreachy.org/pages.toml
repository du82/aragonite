["https://outreachy.org/privacy-policy"]
title = "Outreachy Privacy Policy"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = '''This Privacy Statement is intended to describe the Software Freedom Conservancy's Outreachy Program's privacy practices and provide information about the choices you have regarding the ways in which information collected by Outreachy is used and disclosed. Your privacy is important to Outreachy and Software Freedom Conservancy. To better protect your privacy and to comply with various laws and regulations, we have provided this Statement explaining our information practices and the choices you can make about the way your personal information is collected, used and disclosed. To make this Statement easy to find, we have made it available on our homepage and at every location where personally-identifiable information may be requested. This Privacy Statement applies to all information collected by or submitted to Outreachy, including personal data. "Personal data" is data that can be used to identify an individual. Outreachy may also collect personal data from individuals (with their consent) at conventions, trade shows and expositions. In keeping with the open nature and spirit of Outreachy, some personal data of Outreachy mentors and coordinators is made public by default. Specifically: If you are a current or past Outreachy intern, the following data is made public by default if you have provided it: If you wish for this information to be kept private, you can opt-out of displaying this information publicly by changing your information in the Outreachy account system. If you wish to change or remove your photo, please e-mail the Outreachy organizers. We also use this personal data to provide you with information related to your account and the products or services you acquire from us, to better understand your needs and interests, to improve our service, to personalize communications, and to comply with or fulfill any contractual obligations to you. It is in Outreachy’s legitimate business interests to provide you with the information, communications, and services you request; to create a public record of the data and content produced by Outreachy’s services; and to maintain the integrity of that data and content for historical, scientific, and research purposes.'''
