full_description = "Last updated: August 18, 2021 - Added eligibility rules for graduating students. See the Student eligibility policy section below. The initial application system will open at Aug. 9, 2021 at 4pm UTC. Initial applications are due Sept. 3, 2021 at 4pm UTC. We strongly recommend you read our tips for application essays before submitting your initial application. Initial applications are reviewed on a first-come-first-served basis. Don't wait until the last day to submit your application! What is Outreachy? Commonly asked questions Important dates Twitter chat Student eligibility policy COVID-19 temporary time commitment policy Changes for this round We invite people to apply who face systemic bias or discrimination in the technology industry of their country. Outreachy expressly invites applicants who are women (both cis and trans), trans men, non-binary people, and genderqueer people to apply. We also expressly invite applications who are residents and nationals of the United States of America of any gender who are Black/African American, Hispanic/Latin@, Native American/American Indian, Alaska Native, Native Hawaiian, or Pacific Islander. The initial application deadline is earlier this year. The initial application system will open at Aug. 9, 2021 at 4pm UTC. Initial applications are due Sept. 3, 2021 at 4pm UTC. The Outreachy intern project project list will not be finalized until Oct. 8, 2021. That is after the initial application deadline. Please fill out an initial application, even if you don't see a project that interests you. More projects will be added after the initial application deadline. Want to know what it's like to be an Outreachy intern? Have questions about applying? Join us for a Twitter chat! Outreachy will run a chat on Twitter. The chat will introduce you to past Outreachy interns and current mentors. The chat will have a question and answer format. The Outreachy Twitter account will ask questions of applicants, past interns, and current mentors. We will retweet all answers. You are welcome to ask additional questions during and after the chat. You can direct your questions to the Outreachy Twitter account, or past interns or current mentors who are participating in the chat."
