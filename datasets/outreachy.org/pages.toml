["https://www.outreachy.org/blog/2022-12-05/thank-you-december-2022-mentors-and-coordinators"]
title = "Thank you December 2022 mentors and coordinators!"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "It's the 25th cohort of the Outreachy internship program, formerly known as the Outreachy Program for Women. The December 2022 internship cohort marks our 25th round of empowering women and other marginalized populations who have faced discrimination in the technical industry of their home country. Outreachy supports one-on-one mentorship and open source contribution. The success of our program would not be possible without the support of the open source and open science community coordinators and mentors who have chosen to impact lives and be a source of strength for our cause. This is a special recognition for all our mentors and mentoring organization coordinators for their hard work! Outreachy community coordinators are the essential link to connect mentors to Outreachy. Outreachy community coordinators find mentors who are experienced contributors to their open source or open science project. Community coordinators also find internship funding, coach mentors, improve onboarding documentation, and ensure applicants and interns have a good experience. Mentors are at the heart of Outreachy. We couldn't run our program without them! Mentors define a project for the intern to work on, come up with project tasks for applicants to work on, answer countless questions, and provide encouragement for both applicants and interns. Mentors also help interns connect to the larger open source and open science communities. Mentors provide essential support, feedback, and sponsorship to help interns find their next career, academic, or volunteer opportunity. Together, we will help Outreachy's 64 interns to build a career in tech. We will empower them with both technical and non technical skills through Outreachy's paid remote internship program. Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions. The Outreachy website is built with Django, Wagtail, bootstrap and deployed with Dokku. The code is licensed GPL v3 and can be found in the Outreachy website GitHub repo. There is a separate GitHub repo for creative works"
