full_description = "We invite people to apply who face systemic bias or discrimination in the technology industry of their country. Outreachy expressly invites applicants who are women (both cis and trans), trans men, non-binary people, and genderqueer people to apply. We also expressly invite applications who are residents and nationals of the United States of America of any gender who are Black/African American, Hispanic/Latin@, Native American/American Indian, Alaska Native, Native Hawaiian, or Pacific Islander. Outreachy internships run twice a year, May to August and December to March. We have some rules around which internship round you can apply to: All accepted interns must sign an intern agreement. This is a legal document that certifies you are eligible to apply for Outreachy, and that all the eligibility information you supply in your application is truthful. All accepted interns will need to fill out either a W8-BEN or a W-9 tax form. It is fraud if you sign these legal documents after supplying incorrect information. If you are concerned about these forms, please note that Outreachy has experience with people in the middle of a legal name change and transgender people who cannot change their legal name. Only Outreachy organizers and the Software Freedom Conservancy accounting team will see these legal documents. Your mentors will not see your tax form or your signed intern agreement. Please read our Applicant Guide. The Applicant Guide includes tips for getting your initial application accepted. It also includes tips for preparing for the contribution period and writing your final application. The Outreachy Internship Guide includes detailed information about the internship schedule, payment schedule, blogging schedule, and other details. The application system for Outreachy internships is currently closed. The application system will be available when the next application period opens. Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
