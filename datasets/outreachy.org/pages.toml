full_description = "Outreachy provides paid, remote, three-month internships. Outreachy's goal is to support diversity in Free and Open Source Software (FOSS). For more information about what Outreachy is and the deadlines for mentors and coordinators, read the Community Call for Participation page. This page is for potential mentors and coordinators only. If you are an Outreachy applicant, please see the application instructions or current list of projects. Coordinators find and advise mentors who want to participate in Outreachy. Coordinators also provide information about the community for the landing page shown to applicants. If you have been a community coordinator in the past but have not yet created an account on this site, or you would like to volunteer to be a new coordinator and you understand the coordinator duties, you can sign up to be a community coordinator. Durumin Gamma welcomes experienced community contributors to help out as mentors. Each mentor will need to submit an intern project proposal. The project proposal will then be reviewed and approved by the FOSS community coordinator. Additional co-mentors for the intern project will be able to sign up for the project after it has been approved by the community coordinator. All proposed intern projects need to be released under licenses that are either an OSI-approved open source license that is also identified by the FSF as a free software license, OR a Creative Commons license approved for free cultural works. Please read the additional Outreachy project requirements before submitting an intern project proposal. Outreachy applicants should not submit project proposals through this form. You need to look over the list of projects and pick a project from that list. Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions. The Outreachy website is built with Django, Wagtail, bootstrap and deployed with Dokku. The code is licensed GPL v3 and can be found in the Outreachy website GitHub repo. There is a separate GitHub repo for creative works"
