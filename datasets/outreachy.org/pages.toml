title = "Picking an Outreachy Project - December 2019 round"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "The Outreachy contribution period has been running for two weeks, but there's still time to make a contribution! Many Outreachy applicants feel intimidated at the start of the contribution period. It may take you a while to work up the courage to start on a task or contact a mentor. Our mentors are really friendly, and are happy to help you out. You've got this! Now's the time to take a deep breath, pick a project, and dive in. It's important to find a project that is still open to new applicants. There's a few projects which are closed to new applicants, listed under the 'Closed Outreachy Internship Projects' on the project list. If a project isn't in that section, mentors are still accepting new applicants. Some Outreachy projects have few interested applicants. Below you'll find a list of projects where no applicant has recorded making a contribution. If you're still looking for a project to contribute to, these projects may be a good opportunity for you! For the projects listed below, no Outreachy applicant has recorded starting a contribution. The list is up-to-date as of October 18, 2019. These projects would be ideal for applicants who are just starting their contributions. Once you've picked a project, we recommend you read our applicant guide, especially the section on finding and contacting a mentor. Then contact a mentor, ask questions about the project, and start working on your first contribution! Improve Tor’s image in the media and our communications resources, Writing and editing in English (Required), Organization (Preferred), Research (Preferred), Improve internationalization support for the Guix Data Service, Software development in general (Required), Develop an HTML drag and drop form builder for mUzima mobile application forms, Javascript (Preferred), HTML5 (Preferred), Solve all typescript and webpack issues in the codebase, Webpack (Preferred), Typescript (Preferred), Create a QR code generator to attribute projects with CC licenses, PHP, Python, Javascript, or similar general purpose programming language (Required),"
