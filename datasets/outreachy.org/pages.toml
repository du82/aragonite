["http://outreachy.org/blog/outreachy-interns-talk-about-application-process"]
title = """
Outreachy Interns Talk About the Application Process  
            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "The latest Outreachy intern cohort kicked off their internships at the beginning of the December 2018—woohoo! One of their first assignments outside of their projects was to set up a blog and write about their experience applying to Outreachy. The next round of applications opens on February 18, 2019 for the May to August 2019 internships. Applications will open in September 2019 for the December 2019 to March 2020 internships. We encourage interested folks to get more acquainted with the program and application process by reading through tips from our fabulous interns. Outreachy provides three-month internships to work in Free and Open Source Software (FOSS). Interns are paid a stipend of $5,500 and have a $500 travel stipend available to them. Outreachy internship projects may include programming, user experience, documentation, illustration and graphic design, or data science. Interns often find employment after their internship with Outreachy sponsors or in jobs that use the skills they learned during their internship. There’s a lot of resources you can take advantage of to learn more about Outreachy! You can join the announcement mailing list for an email when the application period opens. You can also follow Outreachy on Twitter (@Outreachy) for updates. Outreachy expressly invites women (both cis and trans), trans men, and genderqueer people to apply. We also expressly invite applications from residents and nationals of the United States of any gender who are Black/African American, Hispanic/Latinx, Native American/American Indian, Alaska Native, Native Hawaiian, or Pacific Islander. Anyone who faces under-representation, systemic bias, or discrimination in the technology industry of their country is invited to apply. Outreachy has a wide range of projects that fit people with different educational backgrounds. Laura Lazzati (an Outreachy intern with GNU Guix) mentions you don’t need have to have a degree in tech to apply to Outreachy. Lenka Pelechova (an Outreachy intern with Mozilla) shares that you don’t even need to be enrolled in school to apply to Outreachy."
