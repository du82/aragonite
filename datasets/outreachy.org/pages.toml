full_description = "Outreachy provides paid, remote, three-month internships. Outreachy's goal is to support diversity in Free and Open Source Software (FOSS). For more information about what Outreachy is and the deadlines for mentors and coordinators, read the Community Call for Participation page. This page is for potential mentors and coordinators only. If you are an Outreachy applicant, please see the application instructions or current list of projects. Coordinators find and advise mentors who want to participate in Outreachy. Coordinators also provide information about the community for the landing page shown to applicants. This community currently has no approved coordinator. Coordinators approve mentored projects, and communicate with both mentors and Outreachy organizers. The full list of coordinator duties can be found on here. If you have been a community coordinator in the past but have not yet created an account on this site, or you would like to volunteer to be a new coordinator and you understand the coordinator duties, you can sign up to be a community coordinator. Sign up to be notified when the coordinator finds funding and opens the call for volunteers and mentors. Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions. The Outreachy website is built with Django, Wagtail, bootstrap and deployed with Dokku. The code is licensed GPL v3 and can be found in the Outreachy website GitHub repo. There is a separate GitHub repo for creative works This program and all offers related to it are void where prohibited or restricted by law or where operation of the program would violate any law or right. All participants in the program must agree to the terms and conditions of the program which will be provided to the selected applicants."
