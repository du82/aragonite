["http://outreachy.org/blog/outreachy-applications-are-open"]
title = """
Outreachy Applications Are Open!  
            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "The Outreachy internship application period will open on Monday, February 18 at 4pm UTC! Here's everything you need to know to get ready to apply. Outreachy provides three-month internships to work in Free and Open Source Software (FOSS). Interns are paid a stipend of $5,500 and have a $500 travel stipend available to them. Outreachy internship projects may include programming, user experience, documentation, illustration and graphical design, or data science. Interns often find employment after their internship with Outreachy sponsors or in jobs that use the skills they learned during their internship. Outreachy internships are open to applicants around the world. Interns work remotely with mentors from FOSS communities. We've made some changes to the student eligibility criteria, and we know some students may not be eligible for this round. Luckily, Outreachy runs twice a year, May to August and December to March. If the timing of this internship doesn't work for you, please apply next round! For the December 2018 to March 2019 round, we had Outreachy interns blog about their application process. You should read past interns' tips for applying. We also recommend the following resources that will help you understand Free and Open Source Software in general: Check out our current list of internship projects. While the application period opens February 18, not all projects will be available then. Projects can be added until March 12. Outreachy typically has around 60 projects each round. If you don't see a project that interests you, check back each week. You can read the resources linked above to get a head start on the skills you'll need to contribute to a project.Sign up for the announcements mailing list to get a weekly email about new projects and upcoming deadlines. Google Summer of Code is another internship program for people interested in contributing to free and open source software. Google Summer of Code (GSoC) is a separate program from Outreachy. Outreachy aligns our application process with GSoC's so that we can encourage eligible applicants to apply to both programs. Google Summer of Code is an internship program for university students. Outreachy is open to both students and people who aren't students. Anyone who meets our eligibility rules can apply to Outreachy. Each program has a separate application process. You don't have to apply to Google Summer of Code in order to apply to Outreachy. Many organizations only participate in Google Summer of Code, or only in Outreachy. Sometimes organizations participate in both programs. That means you can apply to the same community under both Outreachy and Google Summer of Code. You'll have to fill out application forms for both programs, as they separate application processes.Please be aware that if you apply to the same organization under Google Summer of Code and Outreachy, there is a preference for the organization to accept you under Google Summer of Code. That's because Google pays for the Summer of Code intern's stipend, whereas communities provide their own funding for Outreachy interns.If you're accepted under Google Summer of Code rather than Outreachy, you may be paid a smaller stipend.If you apply to both programs, you'll have a greater chance of being accepted as an intern, but you risk being paid less. You should carefully consider what's right for your financial situation."
year_published = 2025
clearnet = "http://outreachy.org/blog/outreachy-applications-are-open"
