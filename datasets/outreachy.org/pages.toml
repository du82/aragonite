["http://outreachy.org/blog/outreachy-week-3-everybody-struggles"]
title = """
Outreachy Week 3: Everybody Struggles  
            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "We recently asked the Outreachy December 2018 to March 2019 interns to write about a time when they found themselves getting stuck during their internship tasks. By sharing our challenges we hope to highlight the reality that we all get stuck from time to time. Everybody struggles! Even Outreachy interns, mentors, and us organizers behind the scenes. We hope potential Outreachy applicants will read through these posts and find inspiration and confidence to apply to the next Outreachy cohort. For current and future Outreachy interns, we hope that as you read your peer's posts know that we all experience challenges as we learn. This is normal, and you belong. When people struggle, we often have to reach out and get help from others. For most of us, asking for help can be intimidating. When you're an Outreachy intern, communication with your mentor is key. If you're stuck for too long, reaching out to your mentor or your community can jump start your progress. But first you have to get over your internal doubts about asking for help. People who have impostor syndrome often feel like everyone knows more than they do. They feel like they'll be judged for knowing less. Marty Hernandez Avedon (Wikimedia intern) talks about how tech culture creates this impostor syndrome: “Tech culture heavily encourages you to pretend you are a tireless genius, so I’m going to have to drop the facade.” People with impostor syndrome are often afraid of reaching out for help. They're afraid it will call attention to the fact that they don't know something other people do. Tina Kallio (Ceph intern) worried about being seen as uninformed when they asked questions. Researching their question thoroughly helped them overcome their worries. We can run into problems even when we’re prepared to ask questions. Sometimes we get intimidated and shy in the moment. When Skanda B.K. (Mozilla intern) met his mentors for the first time, “I froze off and forgot everything I prepared to ask them.”"
year_published = 2025
clearnet = "http://outreachy.org/blog/outreachy-week-3-everybody-struggles"
