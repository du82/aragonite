["https://www.outreachy.org/blog/2022-04-15/outreachy-welcomes-new-community-manager"]
title = "Outreachy welcomes new community manager"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "Outreachy is a remote, paid internship program of Software Freedom Conservancy. Outreachy provides internships in open source and open science. Outreachy's goal is to support people who face discrimination or systemic bias and who are impacted by underrepresentation in the technical industry where they are living. Outreachy is pleased to announce that after a six month long search, we have hired our new community manager! Omotola Eunice Omotayo is an experienced community manager who has worked in diverse and inclusive teams since 2019. Omotola uses she/her pronouns. She understands how communities work, and creates an extraordinarily welcoming and safe environment for community users. She has successfully managed community's brands and online presences in the technology, business, and development world. One of Omotola's core values is empathy, and she works to understand the feelings and experiences of everyone. Before joining Outreachy, Omotola worked full-time as the media officer at Lawyers Alert Nigeria. Lawyers Alert Nigeria is a non-profit human rights organization that empowers women and vulnerable populations with the knowledge of their legal rights. At Lawyers Alert Nigeria, Omotola worked with and managed community relationships with groups of LGBTQ+ people, disabled people, people living with HIV, people affected by tuberculosis, and other marginalized populations. Omotola helped these marginalized groups promote and protect their rights. Omotola worked as a community manager at Green Ridge Foundation. Green Ridge Foundation is a Community Economic Development (CED) driven organization. The Green Ridge Foundation was created to develop an excellent pro bono culture amongst corporate professional services firms. The Green Ridge Foundation drives economic transformation across Africa by leveraging technology. Through managing the organization's online community, Omotola enhanced the economic empowerment of marginalized and vulnerable groups in Africa. Omotola volunteers her time as the community manager lead at She Code Africa. SCA is a non-profit organization that empowers women in tech across Africa. Omotola serves as the team lead, working with another community manager, two social media managers, and numerous local chapter community leaders."
