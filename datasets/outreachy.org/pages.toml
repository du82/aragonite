["https://www.outreachy.org/blog/2019-07-23/outreachy-schedule-changes"]
title = "Schedule changes for Outreachy"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "Outreachy is changing our schedule this round. The schedule changes impact applicants, mentors, and coordinators in the December 2019 to March 2020 round. Please read this post carefully! Outreachy is splitting our application process into two distinct periods: the initial application period and the contribution period. During the initial application period, applicants submit an eligibility form and essay questions (an initial application). During the contribution period, accepted applicants contact mentors and complete project tasks (contributions). The biggest change is that initial applications are due sooner, before the contribution period starts. Only applicants who have an approved initial application will move onto the contribution period. If you want to apply to Outreachy, we encourage you read our Applicant Guide. The Applicant Guide provides the most up-to-date description of our application process. The Applicant Guide includes tips for getting your initial application accepted. The initial application system opens on Aug. 20, 2019 at 4pm UTC. The deadline for initial applications is Sept. 24, 2019 at 4pm UTC. We encourage you to submit your initial application early. If your application is rejected due to not meeting our eligibility rules, you will be notified immediately on the initial application results page. If your application is rejected due to not meeting our time commitment rules, you will also be notified immediately on the initial application results page. All other applications will be reviewed by Outreachy organizers. You may get an email asking you to clarify your essay or provide more information about your time commitments. Otherwise, you won't hear from Outreachy organizers until the contribution period opens. Everyone who has an accepted initial application will receive an email. You'll be emailed when the contribution period starts on Oct. 1, 2019 at 4pm UTC. During the contribution period, you'll get in contact with mentors and work on project tasks (contributions)."
