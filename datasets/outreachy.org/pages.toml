full_description = "Twice a year, Free and Open Source Software (FOSS) communities work with Outreachy organizers to offer internships. The goal of Outreachy is to support people from groups underrepresented in tech. Interns work remotely with mentors from Free and Open Source Software (FOSS) communities on projects ranging from programming, user experience, documentation, illustration and graphical design, to data science. A coordinator for each participating FOSS community works with Outreachy organizers to track mentors, find funding, and advertise their internship projects. Outreachy interns come from a wide range of backgrounds. Outreachy is open to applicants over 18 who fit our eligibility rules. Interns could be university students, code school graduates, people switching careers, or people coming back to tech after starting a family or another long absence. Most Outreachy interns already have some exposure to using FOSS and technical knowledge, but many of them have not contributed to FOSS communities before. During our four-week contribution period, potential interns make contributions to the participating FOSS communities. This allows mentors to accurately evaluate their skills. Mentors work remotely with interns for three months. Urvika Gola, former Outreachy intern, hacks on the open source Android application, Lumicall, with former Google Summer of Code intern, Pranav Jain. (Photo CC-BY Sage Sharp.) There are two Outreachy rounds (May to August, and December to March). The timeline for mentoring orgs looks like: Outreachy applicant. During the four-week application phase, Outreachy applicants make a small contribution to 1-2 projects and then submit an application to be an intern for the project. Only applicants that complete a contribution will be considered to be accepted to be an Outreachy intern. Full statistics on how many people apply, where they apply from, and how many applicants make a contribution can be found on our latest blog post. Outreachy intern. Outreachy interns work for three months on a project with one or more mentors. Outreachy interns are not just students (unlike Google Summer of Code), but can be anyone over 18 who meets our eligibility requirements."
