["http://outreachy.org/blog/outreachy-is-hiring"]
title = """
Outreachy is hiring a part-time contractor  
            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "Outreachy is a paid, remote internship program. Interns work remotely with mentors from free and open source software communities for three months. Outreachy has a huge positive impact on the communities and people who participate in the program! Read our blog post about the applicants from the December 2017 to March 2018 round and read our alums page to understand the impact Outreachy has. The applicants for our internships come from around the world, and from a wide variety of backgrounds. Outreachy applicants include university students, bootcamp graduates, people who are self-taught, or people switching careers. Among others, you'll work with women (both cis and trans), trans men, gender queer people, and people of color with a variety of gender identities. Outreachy and our parent fiscal sponsor, Software Freedom Conservancy, is an equal opportunity employer. All Outreachy participants, including Outreachy contractors, are required to follow the Outreachy Code of Conduct. You'll be a communications specialist, working with Outreachy applicants, mentors, and coordinators. You'll promote the program to groups that focus on diversity in tech, universities, and boot camps. If you're interested, you can also become involved in contributing to the Outreachy's blog and presence on social media. This is a remote position for up to 10 hours a week. You can live anywhere in the world. The Outreachy organizers are in United States timezones, but we welcome people from all countries to apply. We may require some availability during standard United States of America west coast business hours (3pm UTC to 12am UTC). You'll invoice monthly, billing Software Freedom Conservancy, who will pay invoices on a NET-30 basis. Your hourly rate will be negotiated based on experience and location. The role is for a 3 month contract, starting September 17 through December 17. We're hoping to find a long-term contractor, so we may want to renew or expand your contract after three months. Working with the diverse Outreachy applicants is sometimes challenging. Many of our applicants don't natively speak English, and you may have to ask clarifying questions. Our applicants may be transgender, questioning, or in the middle of a name change. We'll provide mentorship on how to support these individuals, and examples of how to handle confidentiality issues. Outreachy is a higher profile effort to increase diversity and inclusivity in tech, so you may be exposed to opponents of special efforts to promote diversity."
