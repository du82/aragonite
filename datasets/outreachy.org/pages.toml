full_description = "The contribution period for the December 2019 to March 2020 round is now open! Applicants with an approved initial application will make contributions to Outreachy's internship projects. If you filled out an initial application, please check your eligibility results to see if you've been approved. In order for applicants to be eligible to be selected as an intern, applicants must make a contribution to an Outreachy project. The project is the same project you'll be interning with. You'll make a contribution by completing a small project task, like a bug fix or documentation change. Making a contribution allows you to see if the project is interesting, and mentors get to see whether you have the skills needed to be a successful intern. We find that it takes applicants at least 5 to 10 days to make their first contribution. That means it's important to pick a project to work on ASAP! Some applicants look for projects that match their current skills. Other applicants look for a project where they can learn something new. We've listed the projects below both by topic and by programming language. If you're looking for projects under a specific community, please see the full project list. Once you've picked a project, we recommend you read our applicant guide, especially the section on finding and contacting a mentor. Then contact a mentor, ask questions about the project, and start working on your first contribution! Revamp the Creative Commons FAQ so that it's easier to use, Writing in English (Required), CSS (Preferred), HTML (Preferred), Revamp CC's Platform Toolkit guide for platforms interested in offering CC licenses to users, Graphic Design (Preferred), HTML (Preferred), Writing in English (Required), Create fundraising material for DebConf20+, document the fundraising processes and support a cycle, Communication skill in English (Required), Past experience on fundraising and conference organization. (Required), Create fundraising material for DebConf20+, document the fundraising processes and support a cycle, Communication skill in English (Required), Past experience on fundraising and conference organization. (Required),"
