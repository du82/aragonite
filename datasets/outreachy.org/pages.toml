            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = '''Outreachy is a paid, remote internship program. Outreachy's goal is to support people from groups underrepresented in tech. We help newcomers to Free and Open Source Software make their first contributions. Are you new to the free software world? Outreachy is for you! The term "free software" or "open source" means that you have the freedom to use, copy, study, change, and improve a project. Examples of open source projects include software like Linux or Firefox, documentation projects like Wikipedia, or graphic design projects like OpenClipArt.org. If you're new to open source, we encourage you to read an introductory article. Open source projects are built collaboratively. Open source contributors work together publicly. Working publicly creates a fun collaborative community around a project. It allows anyone to make innovative changes that reach many people. Open source contributors work on a lot of different things! You can contribute by developing software. Or you might want to improve user experience by contributing design work. You can help with documentation, community management, marketing, identifying issues and reporting bugs, helping users, event organization, graphic design, and translations. Sometimes people work on open source in their spare time. Many contributors are employed by companies and non-profit organizations to work on open source. That includes the companies that are sponsoring Outreachy! Experience with open source is highly valuable in the professional world. Your contributions to open source provide a public portfolio for you. Employers can see your history of public collaboration, which will give them confidence when making hiring decisions. I reaaaaally don't want my @outreachy internship with @mozilla to end. The last 2 months were incredible. 💙 The amount of knowledge I've gained as an OpenSource developer being an @outreachy Intern + the conviction is something Ill cherish forever! https://t.co/sXbqbFcJFg Cannot recommend this program enough. Definitely worth participating.. Thank you @outreachy for the best 3 months https://t.co/yfsBrRJCJi'''
