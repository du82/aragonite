["https://www.outreachy.org/blog/2021-03-23/fsf-participation-barred"]
title = "Outreachy bars FSF from participation in its program"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "The Outreachy organizers lament the damage to the free software community caused by a long history of inappropriate behavior by Richard Stallman. Outreachy continues to support the statement written by Software Freedom Conservancy about the issue in September 2019. As of Monday, March 22, 2021, the Free Software Foundation (FSF) has reinstated Stallman to the FSF Board of Directors. Stallman announced his reinstatement during his LibrePlanet 2021 talk on March 21, 2021. In light of Stallman's reinstatement to the FSF board, Outreachy can no longer allow the FSF to participate as a sponsor or mentor for Outreachy applicants and interns. Outreachy will no longer allow the FSF to mentor Outreachy interns. We are proud of the work Outreachy alums accomplished as interns working with FSF. However, to protect the safety of Outreachy current applicants and future interns, we can no longer allow the FSF to mentor Outreachy interns. Outreachy is aware that Stallman sometimes participates in communities that are under the fiscal sponsorship of the FSF. Some communities under FSF fiscal sponsorship have participated as mentoring organizations under Outreachy. Outreachy has confirmed with those community leaders that these projects have a strong Code of Conduct that will be enforced, and that Stallman will not be interacting with Outreachy applicants or interns. However, funding for those communities under the fiscal sponsorship of the FSF is still subject to FSF board approval. Outreachy is concerned about Richard Stallman being reinstated to the FSF board, so Outreachy can no longer accept sponsorship from communities fiscally sponsored by the FSF. One community under FSF fiscal sponsorship was already preparing to participate in the May 2021 round. Outreachy has informed the community that we can no longer accept sponsorship from community funds held by the FSF. As a temporary solution, the Software Freedom Conservancy has offered to donate sponsorship for one Outreachy intern with that community ($6,500). Outreachy will work with the community on longer term solutions, such as invoicing sponsors for interns on behalf of the community."
year_published = 2025
clearnet = "https://www.outreachy.org/blog/2021-03-23/fsf-participation-barred"
