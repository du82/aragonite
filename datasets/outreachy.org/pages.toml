["https://www.outreachy.org/sponsor"]
title = "Sponsor Outreachy"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "Outreachy is a diversity initiative of the 501(c)(3) non-profit Software Freedom Conservancy. Donations are tax deductible. Former Firefox community coordinator, Larissa Shaprio (middle), with former Outreachy interns Maja Frydrychowicz (left) and Sara Mansouri (right). After their Outreachy internships, Maja became a Mozilla employee and Sara continued as a volunteer leader in the Firefox community. Outreachy sponsors will receive logo placement for their sponsorship level for 6 months. This means their sponsorship will be promoted for one Outreachy internship cohort. Outreachy has two internship cohorts per year. Sponsors who wish to have logo placement for 12 months will need to double their donation to sponsor two Outreachy internship cohorts. Your generous donations go to the Outreachy general fund. The Outreachy general fund sponsors internship stipends, staff to support applicants, interns, and mentors, and resources to promote our program to people who face discrimination and systemic bias in the technology industry of their country. Sponsorship is for half of a year. Sponsors are credited for either the May internship cohort or the December internship cohort. Outreachy may be able to invoice sponsors earlier or later to align with your budget deadlines. Please contact us to let us know what your invoicing deadlines are. For details on sponsorship and statistics about the program, please read our sponsor presentation: (sponsorship.pdf / sponsorship.odp) Urvika Gola, former Outreachy intern, hacks on the open source Android application, Lumicall, with former Google Summer of Code intern, Pranav Jain. Women are underrepresented in Free and Open Source Software (FOSS) development, even as compared with the number of women studying Computer Science in colleges around the world and with the number of women employed in proprietary software development. While the 2017 GitHub survey showed that participation of women in FOSS is still extremely low at 3%, Outreachy has been a major factor in increasing participation of women in communities that participate. For example, the percentage of women Linux kernel authors rose from 5% in 2005 to 9.9% in 2016, with a marked increase in 2013 when the kernel joined Outreachy. Outreachy also encourages women who are students interested in coding projects to apply for Google Summer of Code, and it played a role in increasing participation of women in Google Summer of Code from 7.1% in 2011 to 11.6% in 2018."
