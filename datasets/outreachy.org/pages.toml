["https://www.outreachy.org/blog/2024-08-14/outreachy-needs-your-help"]
title = "Outreachy Needs Your Help!"
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "As we prepare for the next Outreachy internship cohort, we ask for help from the open source community to secure Outreachy's legacy and our future. Outreachy internships have been an inclusive and welcoming introduction to open source for people who face systemic bias or discrimination in the technology industry of their country. Outreachy does much more than introduce people to open source. Outreachy also helps the open source community retain people from marginalized groups: Outreachy's future is bright, but our pathway to that future is becoming foggy. Like many diversity and open source initiatives, we are facing financial challenges, and we need the open source community's help and support. We are optimistic about facing these challenges together. We believe that we need a collective effort from the whole open source community to improve our chances of overcoming these financial challenges. We want to raise the alarm early and ask for help, so that we aren't forced to make any sudden decisions on our own. Finding funding for Outreachy has been extremely difficult this year. Funding for Outreachy comes from a variety of sources: open source community funds, non-profits, academic institutions, corporate sponsors, individual donors, and grants. This year, Outreachy donations are down across all sources of funding. Outreachy requires open source communities to secure funding for at least one Outreachy intern ($8,000 USD). In more recent rounds, due to generous grants, Outreachy was able to waive the requirement to provide internship funding for humanitarian and open science communities. Instead, these internships were funded directly from the Outreachy core activities fund. During the pandemic, we decided to fund additional internships with all types of mentoring communities. Our goal was to give much needed remote opportunities during a time when COVID-19 vaccines were a distant dream. At first, Outreachy only funded a few internships directly from our core operating budget. Our largest internship cohort ever (May 2021 cohort) had 71 interns, with only 8 of the internships funded from the Outreachy core activities budget. A year later, with the help of a large grant, Outreachy accepted 67 interns, with 22 interns funded from the Outreachy core activities budget. By the May 2023 cohort, Outreachy was funding over half our internships directly from our core activities budget."
year_published = 2025
