["https://outreachy.org/mentor/mentor-faq"]
title = """
Mentor FAQ  
            - Outreachy"""
description = "Free to share and remix: Creative Commons CC-BY, except for the individual organization logos, which are property of their respective owners, and any pictures with additional creative commons attributions."
full_description = "Please note that in order to eliminate bias in picking interns, Outreachy has some rules for mentors: Mentors should be able to commit at least 5 hours a week on most weeks from the beginning of the six-week application period through the end of the three-month internship. The application period is often more time-intensive than the internship period, because applicants will need help getting started and identifying a good first contribution they can make to the FOSS project. Having a co-mentor or a project team who can review contributions and point people in the right direction can help spread the load during the application period and internship. Each mentor will also need to accept a mentor agreement and their intern will need to accept an intern agreement. (See mentor and intern agreement examples). These agreements allow the Outreachy parent organization, Software Freedom Conservancy (Conservancy), to run the program while ensuring that your participation in the program is legally appropriate and that Conservancy holds no responsibility for any inappropriate or grossly negligent behavior of the participants. Please do not hesitate to contact us with any questions about the agreements. If you're thinking about being a mentor, you should carefully look at the mentorship timeline and determine your availability. If you're going on vacation for more than a week during the internship or you will have a heavy work load, you should consider adding a co-mentor. Co-mentors can help review intern contributions and answer questions. Each Outreachy mentor works directly with one Outreachy intern. It is very rare for mentors to work with more than one Outreachy intern. In fact, it's encouraged that mentors find a co-mentor who can help review contributions and answer questions for their interns. Co-mentors are especially helpful during the application period, when there are many applicants who need help getting started. You can decide with your co-mentor if one person is considered a primary mentor and the other person is considered a secondary mentor or if you both share the mentorship responsibilities about equally. Multiple mentors can accept a mentor agreement for the same intern and be listed as official mentors. It's the official mentor(s) responsibility to guide the intern and connect the intern with other people who can help with, review, and merge intern's contributions throughout the internship. Upon consultation with other official mentors, if any, one of the official mentors provides feedback during the internship mid-point and final review, which will determine whether an Outreachy intern is paid the mid-point and final payments."
