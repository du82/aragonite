title = "Ovelle – Pioneering the Future of Fertility with Groundbreaking Science"
description = "Computational Screening: We use advanced algorithms to identify key transcription factors in germ cell development."
full_description = '''/*! elementor - v3.22.0 - 17-06-2024 */ .elementor-heading-title{padding:0;margin:0;line-height:1}.elementor-widget-heading .elementor-heading-title[class*=elementor-size-]>a{color:inherit;font-size:inherit;line-height:inherit}.elementor-widget-heading .elementor-heading-title.elementor-size-small{font-size:15px}.elementor-widget-heading .elementor-heading-title.elementor-size-medium{font-size:19px}.elementor-widget-heading .elementor-heading-title.elementor-size-large{font-size:29px}.elementor-widget-heading .elementor-heading-title.elementor-size-xl{font-size:39px}.elementor-widget-heading .elementor-heading-title.elementor-size-xxl{font-size:59px}Pioneering Pathways to Parenthood At Ovelle, we are revolutionizing reproductive medicine to help more people experience the profound joys of parenthood. Contact Us About Us Our Mission and Challenge /*! elementor - v3.22.0 - 17-06-2024 */ .elementor-widget-text-editor.elementor-drop-cap-view-stacked .elementor-drop-cap{background-color:#69727d;color:#fff}.elementor-widget-text-editor.elementor-drop-cap-view-framed .elementor-drop-cap{color:#69727d;border:3px solid;background-color:transparent}.elementor-widget-text-editor:not(.elementor-drop-cap-view-default) .elementor-drop-cap{margin-top:8px}.elementor-widget-text-editor:not(.elementor-drop-cap-view-default) .elementor-drop-cap-letter{width:1em;height:1em}.elementor-widget-text-editor .elementor-drop-cap{float:left;text-align:center;line-height:1;font-size:50px}.elementor-widget-text-editor .elementor-drop-cap-letter{display:inline-block} Infertility affects about 1 in 7 couples (approximately 15%), with millions of women struggling to conceive. This challenge not only impacts physical health but also takes an emotional toll on individuals and relationships. Current treatments like in vitro fertilization (IVF) can be costly, invasive, and not always successful. At Ovelle, we’re developing a groundbreaking solution: in vitro gametogenesis (IVG).Think of IVG as the next generation of IVF. It’s designed to be more effective, less invasive, and potentially more affordable. Our mission is to perfect this technology, making the dream of parenthood a reality for many more families.While there’s still work to be done, we’re optimistic about the future. Our goal is simple: to bring the joy of parenthood within reach for families who may have lost hope, offering them a new path to realizing their dreams of having a baby. Our Vision for the Future At Ovelle, we're working towards a future with: Revolutionary Treatment IVG becomes the gold standard in fertility treatment - safe, effective, and widely preferred to IVF Universal Access Advanced reproductive technologies are affordable and accessible to all who desire them Fulfilled Dreams The joy of parenthood becomes a reality for millions, significantly reducing the heartache of infertility Meiosis induction from female hiPSCs Unlocking Nature's Blueprint for Human Eggs From Somatic Cells to Eggs: Our Scientific Journey Ovelle is revolutionizing fertility treatment through human in vitro oogenesis—producing eggs from somatic cells. We have developed technology to create the cell types of the ovary from human induced pluripotent stem cells (iPSCs) by manipulating expression of transcription factors and RNA-binding proteins. Notably, we are the first company to produce meiotic oogonia-like cells from human iPSCs. This is an important step towards in vitro oogenesis because activating meiosis has been a key challenge in the field. We will incorporate these meiotic oogonia-like cells into ovarian organoids to create synthetic ovaries capable of producing eggs.We know that generating eggs from stem cells is possible since nearly all women do it. We are now bringing advanced biological principles into the lab to create new possibilities for reproductive health. Our Innovative Approach At Ovelle, we’ve developed a cyclical, iterative method that accelerates in vitro gametogenesis (IVG) research: /*! elementor - v3.22.0 - 17-06-2024 */ .elementor-widget-image-box .elementor-image-box-content{width:100%}@media (min-width:768px){.elementor-widget-image-box.elementor-position-left .elementor-image-box-wrapper,.elementor-widget-image-box.elementor-position-right .elementor-image-box-wrapper{display:flex}.elementor-widget-image-box.elementor-position-right .elementor-image-box-wrapper{text-align:end;flex-direction:row-reverse}.elementor-widget-image-box.elementor-position-left .elementor-image-box-wrapper{text-align:start;flex-direction:row}.elementor-widget-image-box.elementor-position-top .elementor-image-box-img{margin:auto}.elementor-widget-image-box.elementor-vertical-align-top .elementor-image-box-wrapper{align-items:flex-start}.elementor-widget-image-box.elementor-vertical-align-middle .elementor-image-box-wrapper{align-items:center}.elementor-widget-image-box.elementor-vertical-align-bottom .elementor-image-box-wrapper{align-items:flex-end}}@media (max-width:767px){.elementor-widget-image-box .elementor-image-box-img{margin-left:auto!important;margin-right:auto!important;margin-bottom:15px}}.elementor-widget-image-box .elementor-image-box-img{display:inline-block}.elementor-widget-image-box .elementor-image-box-title a{color:inherit}.elementor-widget-image-box .elementor-image-box-wrapper{text-align:center}.elementor-widget-image-box .elementor-image-box-description{margin:0}Computational Screening: We use advanced algorithms to identify key transcription factors in germ cell development. Laboratory Validation: Our team tests these factors in stem cell cultures, observing their effects on ovarian cell formation. Data Analysis: We analyze results to refine our computational models and inform the next round of screening. This iterative process allows us to rapidly test hundreds of thousands of genetic combinations, uncover unexpected regulators of ovarian development, and continuously improve our understanding of human reproduction. By combining computational power with rigorous laboratory work, we’re advancing IVG research at an unprecedented pace. Our Team Jessica Adams Research Assistant Merrick Pierson Smela Chief Scientific Officer Travis Potter Chief Executive Officer Evan Underhill Stem Cell Scientist Join Us in Revolutionizing Fertility Ovelle is a research-first startup where scientists work together on deep and important problems.We aim to work on the cutting edge, combing the latest lab technologies and high throughput screening with a mastery of statistics and machine learning. We also foster a deep understanding of how cell differentiation and cell reprogramming can be manipulated to create viable gametes. Work at Ovelle is meaningful, important, and challenging.We’re seeking exceptional scientists who are driven by intellectual curiosity and technical excellence. Our work demands creative problem-solving, deep expertise across multiple disciplines, and an unwavering commitment to scientific rigor. At Ovelle, you’ll collaborate with fellow researchers who share your passion for solving complex biological challenges that matter Open Roles /*! elementor - v3.22.0 - 17-06-2024 */ .elementor-widget-divider{--divider-border-style:none;--divider-border-width:1px;--divider-color:#0c0d0e;--divider-icon-size:20px;--divider-element-spacing:10px;--divider-pattern-height:24px;--divider-pattern-size:20px;--divider-pattern-url:none;--divider-pattern-repeat:repeat-x}.elementor-widget-divider .elementor-divider{display:flex}.elementor-widget-divider .elementor-divider__text{font-size:15px;line-height:1;max-width:95%}.elementor-widget-divider .elementor-divider__element{margin:0 var(--divider-element-spacing);flex-shrink:0}.elementor-widget-divider .elementor-icon{font-size:var(--divider-icon-size)}.elementor-widget-divider .elementor-divider-separator{display:flex;margin:0;direction:ltr}.elementor-widget-divider--view-line_icon .elementor-divider-separator,.elementor-widget-divider--view-line_text .e