full_description = "Contact Hi, I’m Marco Arment. I run Overcast with no other employees, no VC funding, and a sustainable work-life balance (hopefully) so I can spend enough time with my family. Nice to meet you. I’m a software developer, writer, podcaster, and huge podcast fan. I talked about why I love podcasts and why I made Overcast during this XOXO 2013 presentation. Customers Technical support is not available, but I welcome your feedback. To help me handle it all, please direct it properly: @OvercastFM on Mastodon for quick comments (if you use Mastodon). feedback@overcast.fm for feedback and suggestions. I will try to read and consider every tweet and email, but I can’t respond to them all. I wish I could, but I can’t. (That’s life.) Thanks for understanding. Press and ad sales Ad pricing and current inventory Press or other business issues: business@overcast.fm No soliciting, please. Podcast publishers Your question may already be answered in Info for Podcasters."
