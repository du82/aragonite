["https://overcast.fm"]
title = "Overcast"
description = "Podcast player app for iPhone, iPad, and Apple Watch."
full_description = "Overcast® Free, simple, award-winning podcast player for iPhone, iPad, and Apple Watch. Smart Speed® Pick up extra speed without distortion with Smart Speed, which dynamically shortens silences in talk shows. Conversations still sound so natural that you’ll forget it’s on — until you see how much extra time you’ve saved. Voice Boost® Boost and normalize volume so every show is loud, clear, and at the same volume. Listen in more places, such as noisy cars, and still hear what everyone says without cranking the volume so high for quiet people that the loud ones blow your ears out. A Normal Business Hi, I’m Marco (👋). It’s just me here — no big company or investors. Overcast is a self-funded app that has sustainably succeeded on its merits and respected your privacy for the last 10 years. Free Most features are free, supported by small visual ads to promote podcasts. An annual subscription offers bonus features and can optionally hide the ads. Download now and see if it’s right for you. Info for Podcasters Overcast works with the open, standard world of podcasts with public RSS feeds. Simply add your podcast to Apple Podcasts and it’ll show up here. It’s not a separate platform, and all downloads go directly to your servers. Learn more."
