["https://overcast.fm/ads"]
title = "Overcast"
full_description = "Advertise Your Podcast Overcast ads help you grow your podcast’s audience by reaching passionate podcast listeners on their terms, natively, right in their podcast app. Your ads appear below the controls on the Now Playing screen and in the Add Podcast directory, reaching potential new listeners as they search for new podcasts. Tapping brings up a native UI with all of your episodes, inviting listeners to subscribe with a single tap. Ads run for 30 days from the date of purchase. All prices are in U.S. dollars. Purchasing an ad signifies your acceptance of the Terms of Sale below. Targeted Podcast Category Price Slots Available Estimated Performance* Taps Subscriptions All $1,900 2 3,500–5,500 $0.42 CPT 100–150 $19.00 CPA Arts $340 1 1,000–2,000 $0.23 CPT 35–45 $8.50 CPA Business $1,275 2 1,500–2,000 $0.64 CPT 40–55 $28.33 CPA Comedy $430 Sold outNotify me 2,500–3,500 $0.14 CPT 65–85 $5.73 CPA Education $460 1 1,500–2,000 $0.31 CPT 35–45 $11.50 CPA Fiction $270 3 600–850 $0.39 CPT 15–20 $13.50 CPA Health & Fitness $525 2 1,000–1,500 $0.35 CPT 30–40 $15.00 CPA History $470 3 2,000–2,500 $0.24 CPT 50–65 $8.55 CPA Kids & Family $330 3 550–850 $0.47 CPT 15–20 $16.50 CPA Leisure $400 Sold outNotify me 650–1,000 $0.47 CPT 20–25 $20.00 CPA Music $220 1 800–1,000 $0.22 CPT 25–30 $8.80 CPA News $600 Sold outNotify me 2,000–3,500 $0.20 CPT 60–85 $8.00 CPA Religion & Spirituality $350 1 700–1,000 $0.39 CPT 20–25 $14.00 CPA Science $390 Sold outNotify me 1,000–2,000 $0.26 CPT 35–45 $9.75 CPA Society & Culture $1,000 Sold outNotify me 2,500–4,000 $0.29 CPT 75–95 $11.76 CPA Sports $210 1 1,500–2,000 $0.14 CPT 35–50 $5.25 CPA Technology $500 1 1,500–2,500 $0.25 CPT 50–65 $9.09 CPA True Crime $850 Sold outNotify me 1,500–2,000 $0.57 CPT 35–50 $21.25 CPA TV & Film $320 1 1,500–2,000 $0.21 CPT 40–50 $7.11 CPA Permitted Content All titles, images, and descriptions must be appropriate for a general audience of all ages, and may not contain profane, explicit, suggestive, offensive, or sexual content. Ads will not be accepted for podcasts primarily or frequently about: Investment advice, securities or financial instruments (including cryptocurrency and NFTs), debt management, gambling, etc. Sex, sexual advice, seduction, objectification, etc. Weapons, hunting, etc. Alcohol, tobacco, cannabis, or other drug use, recreation, recovery, or treatment Content or activities that are illegal in the United States or New York Extreme or highly divisive political topics Violent, dangerous, racist, sexist, anti-LGBTQ, anti-Semitic, or otherwise offensive or hateful content False, misleading, anti-scientific, or unsubstantiated claims that may cause harm Any other content that may be considered harmful, offensive, or in poor taste by Overcast's customers Since Overcast collects no listener-demographic data, ads will also not be accepted for: Gender-specific advice or other content intended for one gender (since listener gender identity cannot be targeted) Specific regions (since listener region cannot be targeted) Non-English podcasts (since listener language cannot be targeted) This is not an exhaustive list, and the world is ever-changing. Tricky judgment calls often must be made. I’m not perfect, but I’ll do my best. Overcast reserves the right to cancel and refund any ad purchase, for any reason, at its sole discretion. Pricing The price and quantity of ads sold may change at any time. Prices automatically adjust with demand: After each ad is sold, the price increases for its category. If a category's available slots do not sell for at least two days, the price will reduce daily until one sells. The number of total slots in a category is also periodically adjusted up or down. If a category is usually sold out, its number of slots will occasionally increase. Conversely, a category often with many unsold slots may have its total reduced. Expirations, availability notifications, and most price changes happen shortly after midnight GMT. Performance Metrics Overcast shares three metrics with each ad's purchaser: Views: How many times the ad has been displayed to a user in the Overcast app. Taps: How many times a user has tapped the ad in the app to bring up your podcast’s description and episode listing. Subscriptions: How many users have subscribed to the podcast after tapping the ad. This counts the total number of people who ever subscribed, not the current number who remain subscribed. (Some subscriber loss over time is normal.) You can log into your Overcast account at any time to view ongoing performance metrics of all current and past ads, as in this example: Terms of Sale * The estimated performance metrics above are updated daily from current ad performance, but do not guarantee the performance of your purchased ads. Ad viewership varies over time, and response rates depend on the quality, content, and relevance of your ad. All sales are final. No refunds. Overcast may edit ad content for technical, layout, or style-conformance purposes, such as resizing images or performing minor copy edits if necessary. Once you purchase an ad, it must be approved by Overcast before it goes live, which typically occurs within 24 hours. Overcast reserves the right to reject an ad for any reason, such as (but not limited to) billing issues, miscategorization, quality concerns, or content. If your ad is not accepted, your payment will be refunded if possible, with the refund pro-rated if the ad has already run for a portion of its purchased duration. FAQ and Contact Q: Can we get on a call? Sorry, Overcast is a one-person company and cannot offer full-service sales relationships. The ad system is self-serve. Q: Can we get a custom proposal, invoice, or other payment method? To keep the system simple, only credit-card payments are accepted, and you will receive a simple email receipt for the payment. Please ensure that this will be sufficient for your accounting needs before purchasing. Q: Can we negotiate a discount? No. Everyone is offered the same pricing and availability. Q: Can we pre-purchase ads to be scheduled in the future? Future-dated purchases are not available. All ads are sold on a first-come, first-served basis for runs beginning immediately. Please contact business@overcast.fm with any other questions."
year_published = 2025
