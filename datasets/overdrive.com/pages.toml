["https://www.overdrive.com/policies/accessibility.htm"]
title = "Accessibility Statement | OverDrive"
description = "This accessibility statement applies to OverDrive’s websites and mobile applications, including Libby and Sora."
full_description = "OverDrive’s vision is to create “a world enlightened by reading” for everyone. This means providing a delightful, inclusive experience for all users. This accessibility statement applies to OverDrive’s websites and mobile applications, including Libby and Sora. We design our websites and apps to support screen readers, keyboard navigation, voice control, and other assistive technologies. We aim to ensure that every interactive element is expressively labeled, described, logically arranged, and has a large enough tap (or click) target area. Our products are built on web technologies, and we leverage the accessibility features of HTML, CSS, and WAI-ARIA. These web standards continue to evolve, and our products will evolve as they do. OverDrive is committed to making its websites and apps accessible in accordance with relevant regulations, including but not limited to the Americans with Disabilities Act (ADA), the U.K. Public Sector Bodies (Websites and Mobile Applications) (No. 2) Accessibility Regulations 2018, and the EU Web Accessibility Directive [Directive (EU) 2016/2102]. The Web Content Accessibility Guidelines (WCAG) define requirements for designers and developers to improve accessibility for people with disabilities. OverDrive websites and apps are partially compliant with the Web Content Accessibility Guidelines version 2.1 AA standard. OverDrive’s goal is to comply with the applicable WCAG 2.1 Level AA Success Criteria across our websites and apps. We are continually making enhancements to our products to achieve the highest possible level of compliance. We also continue to refine the usability of our products with assistive technologies through experience testing and evaluation. In the sections below, you can find highlights of the accessibility features available in our apps and on our websites. Keyboard shortcuts for the ereader and audio player, including a Commands dialog that lists all possible commands and their shortcuts Dynamic scaling of interface text, using the settings you have configured for the operating system or the browser"
