full_description = '''Get started with Libby today. Download the app for free.Have a Fire tablet? Download Libby from the Amazon Appstore. Check out the latest blog at Libby Life. Borrow & read ebooks, audiobooks, magazines, and more online from your local library for free! Libby is the library reading app by OverDrive, loved by millions of readers worldwide! There are thousands of ebooks and audiobooks, hand-selected by your library, available for reading. Explore the collection through catalog guides, subjects, featured titles, and curated lists. It's a delight to discover new books through Libby. Libby’s ebook reader makes it easy to customize how you read. You can adjust an ebook's font size, book layout, and lighting. As you read, you can also add bookmarks, create notes and highlights, and define words. Libby makes it simple to listen when, where, and how you want. Swipe on the book cover to skip backward or forward. Increase playback speed up to 3x. Set a sleep timer until the end of the chapter or for 5, 10, 30 minutes, or more. "I’m a big Libby fan because my drive to work is a heckin’ pain and I like to listen to books while I’m behind the wheel." We think Libby is the simplest way to start reading ebooks and audiobooks from your library. Don't just take our word for it though, see what everyone else is saying! “I love being able to read or listen to books from my local library but it also allows for books too expensive through Amazon, that I can read through this ereader. Well done. I LOVE reading and anywhere I can read as freely as I enjoy it; whether that’s 5 books a day or 150 a month… An e-reader be it Libby or my Kindle or both… they allow me to read my fill regardless of my inability to always get to the library or to search stacks at bookstores. I can be comfortable in my own place.” "I feel like I just re-found my love for the library again. This app helps re-connect with these amazing and free resources back inot reading books but also magazines. I know the library is free but I didn't know what an array they have for electronic resources. It is great and helpful."'''
