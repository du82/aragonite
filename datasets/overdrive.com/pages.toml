title = "Under Loch and Key by Lana Ferguson · OverDrive: Free ebooks, audiobooks & movies from your library."
description = """
A woman discovers that not all monsters are her enemy—the opposite, in fact—in this new paranormal romance by Lana Ferguson, author of The Fake Mate.Keyanna “Key” MacKay is used to secrets. Raised by a single father who never divulged his past, it’s only after his death that she finds herself thrust into the world he’d always refused to speak of. With just a childhood bedtime story about a monster that saved her father’s life and the name of her estranged grandmother to go off of, Key has no idea what she’ll find in Scotland. But repeating her father’s mistakes and being rescued by a gorgeous, angry Scotsman—who thinks she’s an idiot—is definitely the last thing she expects.Lachlan Greer has his own secrets to keep, especially from the bonnie lass he pulls to safety from the slippery shore—a lass with captivating eyes and the last name he’s been taught not to trust. He’s looking for answers as well, and Key’s presence on the grounds they both now occupy presents a real problem. It’s even more troublesome when he gets a front row seat to the lukewarm welcome Key receives from her family; the strange powers she begins to develop; and the fierce determination she brings to every obstacle in her path. Things he shouldn’t care about, and someone he definitely doesn’t find wildly attractive.When their secrets collide, it becomes clear that Lachlan could hold the answers Keyanna is after—and that she might also be the key to uncovering his. Up against time, mystery, and a centuries old curse, they’ll quickly discover that magic might not only be in fairy tales, and that love can be a real loch-mess.                                    ...read more                            

                                                    


