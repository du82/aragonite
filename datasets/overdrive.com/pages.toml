full_description = "Unlock the books your students need without stretching your budget! K-12 schools can choose from two flexible options to kickstart their journey with our student reading platform. Sora Subscriptions and customized collections go hand in hand—you can enjoy our subscriptions while also adding extra titles tailored to your school's needs! Join a product walk-through to see the platform in action and get your questions answered by our Sora experts. Sora is free to student and teachers through their participating school. K-12 schools & districts who purchase an annual subscription or a customized digital library can qualify for hundreds of free titles.* Subscription pricing is based on your enrollment size or selected grade bands and is available on our order form. The cost of a customized collection depends on the titles and quantities selected, with specific licensing and renewal terms. No problem, we can help! We understand the challenges of limited funding and assist schools in navigating grants and special funding opportunities to provide students with the digital books they need. Subscriptions offer low-cost, pre-selected bundles of ebooks and audiobooks with minimal management, making them ideal for providing a diverse range of titles to meet all students' needs. In contrast, a customized collection is more hands-on, but provides the flexibility to align your digital library with specific educational goals, such as purchasing curriculum-focused titles or class sets. Sora is exclusively available to K-12 schools and districts, both public and private, worldwide, offering kid- and teen-friendly content that’s perfect for literacy enrichment and curriculum support. For public access to free digital books, we recommend using the Libby app, which connects you to your local library's digital collection. Yes! The Sora reading platform is available to K-12 schools worldwide. Sora is supported in 13 languages, including English, Spanish, Chinese, French, German, Italian, Japanese, Korean, and more. Plus, titles are available for purchase in over 30 languages. Pricing and content availability may vary by country. Learn more about our global offerings."
