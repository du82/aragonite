description = """
Sora's home screen features any teacher-assigned reading, your notes, highlights and more.        The explore tab is where you'll browse and search your school's digital collection of ebooks and audiobooks.        Shelf is where you'll find all your borrowed books, holds, as well as your reading history.        The Me tab is where you'll find your Sora reading stats, along with achievement badges. Plus, you can customize your profile!"""
full_description = "Sora's home screen features any teacher-assigned reading, your notes, highlights and more. The explore tab is where you'll browse and search your school's digital collection of ebooks and audiobooks. Shelf is where you'll find all your borrowed books, holds, as well as your reading history. The Me tab is where you'll find your Sora reading stats, along with achievement badges. Plus, you can customize your profile! The explore tab is where you'll browse and search your school's digital collection of ebooks and audiobooks. The Me tab is where you'll find your Sora reading stats, along with achievement badges. Plus, you can customize your profile! If your school has Sora, you can download and install Sora from the Apple App Store or Google Play Store, or go to soraapp.com. Most students use their student ID or school email and password. Some schools provide a setup code. If you’re having trouble, see your school’s media specialist, librarian, or teachers for help. No! You can access your school’s Sora library anytime, anywhere, on your phone, tablet, or personal computer. Once your books are downloaded, you can read or listen to them without Wi-Fi. First search to see if your school district is on the list or ask your media specialist, librarian, or teacher if your school has Sora. If your school hasn’t started using Sora yet, share with your principal, librarian, or school board what you learned. Have them go to DiscoverSora.com to learn more. Hopefully, they will offer Sora for your school in the future."
