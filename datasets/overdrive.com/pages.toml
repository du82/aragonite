EM and Beginning Readers. Annual subscription. Unlimited access to every title. Starting price-per-list: $230-900/year. Bundle all five lists: starts at $2,000/year. Order All Access Kids All Access Magazines Our magazines package has 200+ of the most popular global titles, catered to students of all ages. All Access Magazines includes the latest issues of the most popular publications worldwide, plus back issues. Annual subscription. New titles added 3x per year. Unlimited access to every issue - no holds or waitlists! Starts at $500/year. Order All Access Magazines How Sora Subscriptions help you save Think of Sora Subscriptions as autopilot for your digital collection. Simply set your subscription preferences, and our credentialed librarians will take it the rest of the way! But don’t worry – you’ll never fly blind. Before new content is automatically added to your collection, you’ll have a preview/approval period to learn about what’s coming. If at any time you want to remove a title or add more copies, you can do so quickly and easily in OverDrive Marketplace (or ask your Sora Flight Crew for assistance!). Start Your Subscription Reviews are in: Sora Subscriptions are out of this world “We went from one bulk order a year to monthly purchases, and now our collection is always current and meeting student demand.” Angela Anthony, District Librarian, Castro Valley Unified School District (CA) “Digital comics are an excellent way for students to hone their media literacy skills by interpreting images along with text. In addition, comics support our students who struggle with text. We are excited to be providing interesting opportunities for students to see themselves in books.” Andrea Viscusi, Librarian Assistant, O2CM BOCES (NY) “I was so excited to be able to offer my students and teachers magazine access through a platform they already knew. With the variety of types of magazines, I also make sure to let my teachers know which magazines fit their subjects for possible class use.” Kate Lewallen, Head Librarian at Webb School of Knoxville (TN) Not sure if you’re ready for launch? Connect with your Sora Flight Crew to review other pricing options to get more out of Sora for your students outside of our subscription plan. Connect Now"
