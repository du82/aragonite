full_description = '''Cookies are small data file identifiers that are transferred to your device or web browser. They allow OverDrive to recognize your device or web browser when you visit or use the Services. Required cookies: OverDrive uses first party cookies (i.e. cookies set directly by OverDrive to your device) that are strictly necessary. These are essential cookies that let you move around the Services and use their features. Without these cookies, core functionality cannot be provided. You cannot object to these cookies as otherwise the Services cannot be provided. Performance and Reliability Cookies: These cookies allow us to monitor and improve the Service's performance and reliability. They alert OverDrive when the Service is not performing at expected levels. Research and Analytics Cookies: These cookies help OverDrive understand user behavior within the Services. For example, they collect information about which features of the Services are most popular. This information helps OverDrive design a better experience for all users. Some Services may use third party cookies. Specifically, some Services use New Relic (https://newrelic.com) for performance and reliability. The Libby and Sora apps use Firebase (https://firebase.google.com/). Some Services may use Google Analytics (https://analytics.google.com) for research and analytics. Some Services may also use Google Ads (https://ads.google.com), HubSpot (https://www.hubspot.com/), or similar for remarketing. OverDrive uses cookies for many purposes, such as to support the internal operations of the Services, make improvements to the Services, and to improve your experience. Some examples of how we use cookies include: If you do not want OverDrive-hosted websites to collect information through the use of cookies, you can set your web browser to block cookies. Each browser is different, so you should check your browser or device's "Help" menu to learn how to change your cookie preferences. You should note that if you block cookies from OverDrive-hosted websites, your ability to use or access certain functions may be impaired.'''
