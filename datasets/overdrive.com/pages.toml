full_description = '''Hidden Figures ebook By Margot Lee Shetterly Read a Sample Add Book To Favorites Sign up to save your library With an OverDrive account, you can save your favorite libraries for at-a-glance information about availability. Find out more about OverDrive accounts. Save Not today Format ebook ISBN 9780062662378 Author Margot Lee Shetterly Publisher HarperCollins Release 29 November 2016 Share Subjects Biography & Autobiography Juvenile Nonfiction Mathematics Multi-Cultural Find this title in Libby, the library reading app by OverDrive. Search for a digital library with this title Search by city, ZIP code, or library name Learn more about precise location detection Title found at these libraries: Loading... View more libraries... The uplifting, amazing true story—a New York Times bestseller!This edition of Margot Lee Shetterly's acclaimed book is perfect for young readers. It's the powerful story of four African-American female mathematicians at NASA who helped achieve some of the greatest moments in our space program. Before John Glenn orbited the earth, or Neil Armstrong walked on the moon, a group of dedicated female mathematicians known as "human computers" used pencils, slide rules, and adding machines to calculate the numbers that would launch rockets, and astronauts, into space.This book brings to life the stories of Dorothy Vaughan, Mary Jackson, Katherine Johnson, and Christine Darden, who lived through the Civil Rights era, the Space Race, the Cold War, and the movement for gender equality, and whose work forever changed the face of NASA and the country. ...read more Format ebook ISBN 9780062662378 Author Margot Lee Shetterly Publisher HarperCollins Release 29 November 2016 Share Subjects Biography & Autobiography Juvenile Nonfiction Mathematics Multi-Cultural Hidden Figures Copy and paste the code into your website. <div><script src="https://www.overdrive.com/media/2830082/sample-embed?slug=hidden-figures"></script></div> Close'''
