description = """
Tegan is eight months pregnant, alone, and desperately wants to put her crumbling life in the rearview mirror. So she hits the road, planning to stay with her brother until she can figure out her next move. But she doesn't realize she's heading straight into a blizzard. She never arrives at her destination. Stranded in rural Maine with a dead car and broken ankle, Tegan worries she's made a terrible mistake. Then a miracle occurs: she is rescued by a couple who offers her a room in their warm cabin until the snow clears. But something isn't right. Tegan believed she was waiting out the storm, but as time ticks by, she comes to realize she is in grave danger. This safe haven isn't what she thought it was, and staying here may have been her most deadly mistake yet.  And now she must do whatever it takes to save herself?and her unborn child. A gut-wrenching story of motherhood, survival, and twisted expectations, #1 New York Times bestselling author Freida McFadden delivers a snowbound thriller that will chill you to the bone.                                     ...read more                            

                                                    


