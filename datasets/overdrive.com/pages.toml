title = "About Sora: Where K-12 Students Read"
description = "What makes Sora, the student reading app for K-12 schools different from other digital book platforms? Easy on-boarding, wide catalog of books & much more!"
full_description = "Sora isn’t just another K-12 reading app. It’s a full-service, digital reading platform that gives students in 53,000 schools and districts across the globe an equal opportunity to succeed with literacy. With Sora, you enjoy complimentary access to a dedicated team of experts to help you achieve your reading and learning goals – all while adhering to the strictest privacy standards to protect your students’ data.​ Whether you’re adding Sora to one school building or an entire district, onboarding is easy, with streamlined, single sign-on access using your school’s existing authentication systems. Students sign in using their familiar school credentials to begin reading.​ Students can read in the most accessible and enjoyable way for them, with audiobooks, Read-Alongs, dyslexic font, adjustable lighting and text sizes, a multilingual interface and more.​ Sora can capture school- and student-level data for books read, total reading time, average time per session and more to help guide purchasing strategies and reading interventions.​ Only Sora enables students to browse and borrow titles from their local public library’s digital collection, expanding equitable access to age-appropriate ebooks and audiobooks.​ Sora is backed by the industry’s largest catalog of millions of ebooks and audiobooks from top publishers. OverDrive, a Certified B Corp, is the leading digital reading platform for public libraries and has been pioneering and perfecting digital books since 1986. ​ Sora integrates with the learning management systems and student information systems you’re already using, like Google Classroom, Schoology, ClassLink and more.​ Whether you’re adding Sora to one school building or an entire district, onboarding is easy, with streamlined, single sign-on access using your school’s existing authentication systems. Students sign in using their familiar school credentials to begin reading.​ Students can read in the most accessible and enjoyable way for them, with audiobooks, Read-Alongs, dyslexic font, adjustable lighting and text sizes, a multilingual interface and more.​"
