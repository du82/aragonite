description = '''
Now a Netflix animated film!Nimona is the New York Times bestselling graphic novel sensation from ND Stevenson, based on his beloved and critically acclaimed web comic. Kirkus says, "If you're going to read one graphic novel this year, make it this one."Nemeses! Dragons! Science! Symbolism! All these and more await in this brilliantly subversive, sharply irreverent epic from ND Stevenson. Featuring an exclusive epilogue not seen in the web comic, along with bonus conceptual sketches and revised pages throughout, this gorgeous full-color graphic novel has been hailed by critics and fans alike as the arrival of a "superstar" talent (NPR.org).Nimona is an impulsive young shapeshifter with a knack for villainy. Lord Ballister Blackheart is a villain with a vendetta. As sidekick and supervillain, Nimona and Lord Blackheart are about to wreak some serious havoc. Their mission: prove to the kingdom that Sir Ambrosius Goldenloin and his buddies at the Institution of Law Enforcement and Heroics aren't the heroes everyone thinks they are.But as small acts of mischief escalate into a vicious battle, Lord Blackheart realizes that Nimona's powers are as murky and mysterious as her past. And her unpredictable wild side might be more dangerous than he is willing to admit.Indies Choice Book of the Year * National Book Award Finalist * New York Times Bestseller * New York Times Notable Book * Kirkus Best Book * School Library Journal Best Book * Publishers Weekly Best Book * NPR Best Book * New York Public Library Best Book * Chicago Public Library Best BookFans of ND Stevenson's beloved and bestselling Nimona won't want to miss his moving memoir-in-pictures, The Fire Never Goes Out, featuring short essays, mini-comics, and photographs that span eight eventful years in ND's young adult life.                                    ...read more                            

                                                    


