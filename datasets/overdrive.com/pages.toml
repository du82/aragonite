One of New York Times' Twelve Books for Feminist Boys and Girls!This is the story of a woman who dared to dive, defy, discover, and inspire. This is the story of Shark Lady. One of the best science picture books for children, Shark Lady is a must for both teachers and parents alike!An Amazon Best Book of the MonthNamed a Best Children's Book of 2017 by Parents magazineEugenie Clark fell in love with sharks from the first moment she saw them at the aquarium. She couldn't imagine anything more exciting than studying these graceful creatures. But Eugenie quickly discovered that many people believed sharks to be ugly and scary—and they didn't think women should be scientists.Determined to prove them wrong, Eugenie devoted her life to learning about sharks. After earning several college degrees and making countless discoveries, Eugenie wrote herself into the history of science, earning the nickname "Shark Lady." Through her accomplishments, she taught the world that sharks were to be admired rather than feared and that women can do anything they set their minds to.An inspiring story by critically acclaimed zoologist Jess Keating about finding the strength to discover truths that others aren't daring enough to see. Includes a timeline of Eugenie's life and many fin-tastic shark facts!The perfect choice for parents looking for:Books about sharksInspiring nonfiction narrative booksRole model books for girls and boysKids STEM books                                    ...read more                            

                                                    


