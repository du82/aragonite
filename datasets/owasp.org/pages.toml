title = "Lifecycle events are part of the secure supply chain | OWASP Foundation"
description = "Lifecycle events are part of the secure supply chain on the main website for The OWASP Foundation. OWASP is a nonprofit foundation that works to improve the security of software."
full_description = '''Lifecycle events are part of the secure supply chain Olle Johansson and Benji Visser Tuesday, November 26, 2024 A new OWASP project - Common Lifecycle Enumeration - aims to standardize encodings of product lifecycle events, such as end-of-life, end-of-support and others. The specification will become an ECMA International standard when ready. Read more about this exciting new OWASP project! Digital products, both hardware and software have a lifecycle that mirrors human life - they are born, grow and develop, and eventually come to an end, just like ourselves. However, there are many more changes in a product’s lifecycle that need to be captured, both for commercial products and open source software. The end-of-life state will affect many users of a product in various ways and needs to be communicated in a way that supports a high degree of automation. When building a product today, we combine components from a range of upstream vendors and open source projects - a motherboard, operating system, sensors, software libraries and tools. The bill-of-materials (BOM) is a necessary tool to manage both hardware and software during the lifetime of the product. The BOM, when combined with lifecycle events, provides a foundation for automating and proactively managing each product’s lifecycle. Regulators require product lifecycle management New regulations, like the recently adopted EU Cyber Resilience Act, enforces a lifecycle management process where manufacturers are obliged to maintain security through the product’s entire lifecycle, from purchasing to decommissioning. This means manufacturers must ensure that the product and all components are secure, kept up-to-date, and free of exploitable vulnerabilities. The OWASP CycloneDX bill-of-materials standard can cover many aspects of a product, both software and hardware. But one thing that’s been missing is just the lifecycle events, like end-of-support, end-of-life and end-of-sales. For Open Source projects there are similar events covering “LTS release support”, “security fixes only”, “stable” and other variants. Monitoring the life state of a product or component is essential A manufacturer needs to be assured that components from upstream vendors and projects are supported, otherwise the manufacturer assumes full responsibility. A customer, through their IT organization, also wants to be able to plan their inventory and capture this information from all vendors. Products without any support need to be phased out in a controlled and planned way with as few surprises as possible. Lifecycle management requires a high degree of automation This exchange of information across the supply chain needs to be both enumerated in a standard format and automatically exchanged. Rest assured that OWASP is working on all fronts here. The OWASP Common Lifecycle Enumeration (CLE) project is actively working on a standard for capturing these events. This will be part of the effort to standardize OWASP standards in ECMA TC54. The summer of 2024 CycloneDX became an ECMA standard and more is on the way. A new working group, ECMA TC54 TG3, was formed in October 2024 to lead the standardization alongside working groups for the Package URL (PURL) and the Transparency Exchange API. How OWASP CLE fits into other work The CLE syntax will be adopted by the OWASP Transparency Exchange API (TEA) working group (also known as “Project Koala”) that creates a standardized set of APIs for publishing and consuming software and hardware transparency artifacts like SBOM, HBOM, VEX/CSAF vulnerability information, IN-Toto attestations, SCITT statements and much more. With TEA the interaction between customers and vendors will be highly automated. A standard API leads not only to efficient workflows, but also keeps costs for integration under control. Many vendors of platforms have shown interest in integration TEA into their systems, including OWASP Dependency Track, a leading open source platform for software transparency, license compliance and vulnerability management. If you’re interested, all are welcome to join the work in the OWASP common lifecycle enumeration project! https://owasp.org/www-project-common-lifecycle-enumeration/ Benji VisserLeader of OWASP CLE Olle E. JohanssonLeader of OWASP CycloneDX project Koala .homepage-blog img { width: 150px !important; max-width: 200px !important; border:none; } Watch Star The OWASP® Foundation works to improve the security of software through its community-led open source software projects, hundreds of chapters worldwide, tens of thousands of members, and by hosting local and global conferences. Recent News & Opinions OWASP Juice Shop leadership changes & contributor recognition Lifecycle events are part of the secure supply chain More than a Password Day 2024 A workaround for OWASP Foundation emails being blocked by Microsoft Office 365 Securing React Native Mobile Apps with OWASP MAS OWASP Email Problems (and solutions) New Articles of Incorporation and Bylaws for the OWASP Foundation! Update on the ASVS Community Meetup SecureFlag and OWASP partner to offer Threat Modeling Automation tool ThreatCanvas to Members The OWASP Foundation appoints Starr Brown as Director of Projects The OWASP Foundation Celebrates 20th Anniversary Checkmarx and OWASP Launch First-ever Global Codebashing Learning Initiative CycloneDX v1.6 Released, Advances Software Supply Chain Security with Cryptographic Bill of Materials and Attestations OWASP Data Leak Notification Traefik Labs Joins OWASP and Integrates Coraza and Core Rule Set Projects OWASP CycloneDX is ready to support your CRA compliance journey! Introducing the OWASP IoT Security Testing Guide (ISTG) OWASP appoints Jason C. McDonald as Director of Community Development OWASP joins the US AI Safety Institute Consortium (AISIC) at its launch to support collaborative efforts to safeguard AI. Trustwave Transfers ModSecurity Custodianship to OWASP Upcoming OWASP Global Events v