["https://owasp.org/blog/2024/10/30/owaspfoundation-org-emails.html"]
title = "A workaround for OWASP Foundation emails being blocked by Microsoft Office 365 | OWASP Foundation"
description = "A workaround for OWASP Foundation emails being blocked by Microsoft Office 365 on the main website for The OWASP Foundation. OWASP is a nonprofit foundation that works to improve the security of software."
full_description = '''A workaround for OWASP Foundation emails being blocked by Microsoft Office 365 Andrew van der Stock Wednesday, October 30, 2024 Over the last several months, OWASP, particularly the owasp.com domain, has been blocked from sending messages to tenants of the Microsoft Office 365 platform or those using Microsoft Defender for Office 365, where messages end up blacklisted in quarantine or never received. Organizations that have failed to receive our emails includes legal firms, our HR firm, our accountants, our European affiliate’s accountants and VAT specialists, and many others, including potential sponsors, donors, and members. This is an untenable situation, and extremely disappointing that we have been unable to resolve this issue with Microsoft. So we have to use a workaround domain, owaspfoundation.org to send emails to Microsoft 365 tenants. This is not ideal, but we have no other choice. We will never use owaspfoundation.org for any other purpose other than to get around this spam filter insanity. We will never send any marketing or other unsolicited emails from this domain, it will not be linked to our MailChimp or our accounting system. Only select staff have access to this domain, and we will only use it when all else fails. What have we done to resolve this issue? We updated and thoroughly tested our SPF and DKIM records for both owasp.com and owasp.org many months ago, and they pass with flying colors. We have tested and improved our MX records thoroughly with the Pro version of mxtoolbox.com and other DNS tools. We have tested email delivery to our friends at various firms. We have reported and have been working with Microsoft to resolve the problem, but to no avail. It is understandable that Microsoft has a very strict anti-spam policy, but it is partially underscored by an AI categorizer, which somehow learned that OWASP Foundation emails are spam, and for whatever reason, Microsoft has been unable or unwilling to untrain their spam filter. owaspfoundation.org is our last resort email platform Once we are certain that your organization is not receiving our emails, or they are always being quarantined, we will be using a new domain, owaspfoundation.org, which is hosted on the Microsoft 365 platform to communicate with you. This is not normal, and we need your help to fix the problem. What can you do? If you’re receiving email from owaspfoundation.org, please work with your IT department to whitelist owasp.com emails, as we are not able to do so on your behalf. Outlook and Exchange Online users Microsoft users need to whitelist our email domains (owasp.org and owasp.com), and click “This is not junk” on our emails that end up in quarantine or in your spam folder. This will help to improve our reputation with Microsoft, and ensure that our emails are delivered to your inbox. This is unfortunately a manual process. Review your junk mail and quarantine folders If you find an email from an owasp.org or owasp.com email address in your junk mail folder, click on the email, and then click “This is not junk” in the toolbar. You can also just drag the message back to your Inbox. This will move the email to your inbox, and will help to improve our reputation with Microsoft If you find an email in your quarantine folder, ask for it to be released, and contact your IT administrators to whitelist owasp.org and owasp.com domains (see below) You can also add the email address to your safe senders list, which will help to ensure that future emails are always delivered to your inbox. How to release emails from quarantine as a user Microsoft 365 - Exchange Online Protection (EOP) or Microsoft Defender for Office 365 If your organization uses Microsoft Office 365 or Microsoft Exchange Online, there is potentially a separate step you need to do to release the message from quarantine, and then for your administrator to add our email domains to the allow list. Once requested, please ask your admins to release the email, and add owasp.org and owasp.com to allow sender list so that they don’t need to do this for every email. Manage quarantined messages and files as an admin How to handle Legitimate emails getting blocked (False Positive), using Microsoft Defender for Office 365 Once Microsoft has resolved their spam filter training issue, the OWASP Foundation will revert solely to using owasp.com as our primary email domain. Conclusion We apologize for any inconvenience this may cause, but we have no other choice. We have tried everything else, and we are still unable to send emails to Microsoft 365 tenants. If anyone knows anyone senior enough at Microsoft who can help us resolve this issue, please contact me directly. Watch Star The OWASP® Foundation works to improve the security of software through its community-led open source software projects, hundreds of chapters worldwide, tens of thousands of members, and by hosting local and global conferences. Recent News & Opinions Lifecycle events are part of the secure supply chain More than a Password Day 2024 A workaround for OWASP Foundation emails being blocked by Microsoft Office 365 Securing React Native Mobile Apps with OWASP MAS OWASP Email Problems (and solutions) New Articles of Incorporation and Bylaws for the OWASP Foundation! Update on the ASVS Community Meetup SecureFlag and OWASP partner to offer Threat Modeling Automation tool ThreatCanvas to Members The OWASP Foundation appoints Starr Brown as Director of Projects The OWASP Foundation Celebrates 20th Anniversary Checkmarx and OWASP Launch First-ever Global Codebashing Learning Initiative CycloneDX v1.6 Released, Advances Software Supply Chain Security with Cryptographic Bill of Materials and Attestations OWASP Data Leak Notification Traefik Labs Joins OWASP and Integrates Coraza and Core Rule Set Projects OWASP CycloneDX is ready to support your CRA compliance journey! Introducing the OWASP IoT Security Testing Guide (ISTG) OWASP appoints Jason C. McDonald as Director of Community Development OWASP joins the US AI Safety Institute Consortium (AISIC) at its launch to support collaborative efforts to safeguard AI. Trustwave Transfers ModSecurity Custodianship to OWASP CycloneDX v1.6 Introduces Support for Attestations of Compliance with Any Standard, Improving Compliance and Scalability for Consumers and Vendors of Third Party Software Upcoming OWASP Global Events var events = []; $(function () { eventsyml = YAML.load('https://owasp.org/assets/sitedata/events.yml'); $.each(eventsyml, function (index) { if (this.category == 'Global') { for (e in this.events) { events.push(this.events[e]); } } }); if (events.length > 0) { var htmlstring = "<ul>"; for (evnt in events) { if (events[evnt].url) htmlstring += '<li><a href="' + events[evnt].url else htmlstring += '<li><a href="https://owasp.org/events/' htmlstring += '" target="_blank rel="noopener">' + events[evnt].name + '</a>'; if (typeof events[evnt].dates === 'undefined') { events[evnt].dates = 'TBA'; } htmlstring += "<ul><li style='list-style-type: circle;margin-top: 0px;padding:0px;margin-left:16px;'>" + events[evnt].dates + "</li></ul></li>"; } htmlstring += "</ul>"; $("#global-event-div").html(htmlstring); } });'''
