full_description = '''About the OWASP Foundation The Open Worldwide Application Security Project (OWASP) is a nonprofit foundation that works to improve the security of software. Our programming includes: Community-led open source projects including code, documentation, and standards Over 250+ local chapters worldwide Tens of thousands of members Industry-leading educational and training conferences We are an open community dedicated to enabling organizations to conceive, develop, acquire, operate, and maintain applications that can be trusted. All of our projects, tools, documents, forums, and chapters are free and open to anyone interested in improving application security. The OWASP Foundation launched on December 1st, 2001, becoming incorporated as a United States non-profit charity on April 21, 2004. For two decades corporations, foundations, developers, and volunteers have supported the OWASP Foundation and its work. Donate, Become a Member, or become a Corporate Supporter today. Our Vision No more insecure software. Our Mission To be the global open community that powers secure software through education, tools, and collaboration. As the world’s largest non-profit organization concerned with software security, OWASP: Supports the building of impactful projects; Develops & nurtures communities through events and chapter meetings worldwide; and Provides educational publications & resources in order to enable developers to write better software, and security professionals to make the world’s software more secure. Participation and Membership Everyone is welcome and encouraged to participate in our Projects, Local Chapters, Events, Online Groups, and Community Slack Channel. We especially encourage diversity in all our initiatives. OWASP is a fantastic place to learn about application security, to network, and even to build your reputation as an expert. We also encourage you to be become a member or consider a donation to support our ongoing work. Enter your email to join our Slack community Email Address Join $(function(){ $('#btn-join-slack').click(function(){ var email = $('#emailaddr').val(); $.ajax({ type: "POST", url: "https://owaspadmin.azurewebsites.net/api/owasp_slack_add_user?code=aaanp3ICdjlaVHHoAnmO06EiDh9dgrCZfkjdTeoOQLVvdesivNWUjA==&email=" + encodeURIComponent(email), dataType: "json", success: function (result, status, xhr) { if(result['ok']){ $("#div-slack-join").hide(); $("#div-slack-result").text("Thanks for joining! Be on the lookout for an email with more information."); $("#div-slack-result").show(); }else { $("#div-slack-join").hide(); $("#div-slack-result").text("Oops! Looks like something went wrong or you are already signed up."); $("#div-slack-result").show(); } }, error: function (xhr, status, error) { $("#div-slack-join").hide(); $("#div-slack-result").text("Oops! Looks like something went wrong or you are already signed up."); $("#div-slack-result").show(); } }); }); }); Core Values Open: Everything at OWASP is radically transparent from our finances to our code. Innovative: We encourage and support innovation and experiments for solutions to software security challenges. Global: Anyone around the world is encouraged to participate in the OWASP community. Integrity: Our community is respectful, supportive, truthful, and vendor neutral Contacting OWASP Most questions you might have about the OWASP Foundation can be found by searching this website. If you need to contact us directly with a request we use a ticketing system which can be accessed here. Several other common contact points include: Membership Support Chapter Support Corporate Sponsorships or Support Partnership Marketing Contact Us Our global address for general correspondence and faxes can be sent to our physical office address, at: The OWASP Foundation Inc. 300 Delaware Ave Ste 210 #384 Wilmington, DE 19801 +1 951-692-7703 (phone) EIN #20-0963503 The European legal address and VAT number is: OWASP Europe VZW c/o Sr Fiduciarire Cv Steenvoordestraat 184 9070 Destelbergen Belgium VAT: BE 0836743279 Ethical Behavior The activities, programs, and events of the Foundation conform to a number of policies set forth in our Policies & Procedures and the Code of Conduct. Additionally we expect our Board Members, Leaders, Staff, and volunteers to model the upmost in integrity, honesty, and patience with supporting our extended communities. Licensing All OWASP materials are available under an OSI-approved Open Source License or one of the latest Creative Commons licenses for most documentation projects. This website is (C) OWASP and licensed under the Creative Commons Attribution-ShareAlike 4.0 International license (CC-BY-SA 4.0) Watch Star The OWASP® Foundation works to improve the security of software through its community-led open source software projects, hundreds of chapters worldwide, tens of thousands of members, and by hosting local and global conferences. Upcoming OWASP Global Events var events = []; $(function () { eventsyml = YAML.load('https://owasp.org/assets/sitedata/events.yml'); $.each(eventsyml, function (index) { if (this.category == 'Global') { for (e in this.events) { events.push(this.events[e]); } } }); if (events.length > 0) { var htmlstring = "<ul>"; for (evnt in events) { if (events[evnt].url) htmlstring += '<li><a href="' + events[evnt].url else htmlstring += '<li><a href="https://owasp.org/events/' htmlstring += '" target="_blank rel="noopener">' + events[evnt].name + '</a>'; if (typeof events[evnt].dates === 'undefined') { events[evnt].dates = 'TBA'; } htmlstring += "<ul><li style='list-style-type: circle;margin-top: 0px;padding:0px;margin-left:16px;'>" + events[evnt].dates + "</li></ul></li>"; } htmlstring += "</ul>"; $("#global-event-div").html(htmlstring); } });'''
