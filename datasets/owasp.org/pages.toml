title = "Securing React Native Mobile Apps with OWASP MAS | OWASP Foundation"
description = "Securing React Native Mobile Apps with OWASP MAS on the main website for The OWASP Foundation. OWASP is a nonprofit foundation that works to improve the security of software."
full_description = '''Securing React Native Mobile Apps with OWASP MAS Julia Mezher Wednesday, October 2, 2024 React Native is a popular cross-platform mobile development framework that allows developers to build native-looking apps for iOS and Android using a single codebase. Like any other software, React Native apps are also vulnerable to a variety of security threats. 1. Securing each part of the app To secure a React Native app you should analyse all its parts and how they communicate. This requires an understanding of each block: React Native, iOS, and Android platforms and Bridge between them. The React Native app uses JavaScript that is run on the JS engine. Understanding native JS engines and Hermes engine from Facebook is also necessary as they have different threat vectors. Using native JS engines makes extracting minified JS code from application bundles easy, while Hermes had several reported vulnerabilities in the past. 2. Assessing React Native apps with OWASP guides It is also important to follow general mobile application security best practices, such as those described in OWASP guides. While there are no React Native-specific guides, OWASP provides guidance on how to improve the security of native apps, protecting them from common threats and vulnerabilities: OWASP Mobile Application Security Verification Standard OWASP Mobile Application Security Testing Guide OWASP Cheat Sheet Series OWASP React Native guides can be used to assess platform-specific security controls, while OWASP JavaScript guides can be used to cover most of the remaining assessment areas: OWASP Application Security Verification Standard OWASP Secure coding guide The common area for assessment in each cross-platform app is the way methods are bridged between native and non-native parts (like, how JavaScript and native code are communicating). For example, bridged methods may lack obfuscation making platform-specific security controls more visible for reverse engineers. The resilience sections of OWASP MASTG can serve as a guide to protect against reverse engineering and tampering because they describe concepts that can be applied to cross-platform apps. 3. React Native libraries: Secure choice JavaScript brings to React Native one of its most painful stepping stones: Managing a large number of dependencies and dealing with vulnerabilities in them. Integrating dependency checkers like OWASP Dependency-Check or GitHub Dependabot into the CI/CD process becomes a must-have for React Native apps. Many React Native libraries are ported from the JavaScript ecosystem, but they may not be suitable for mobile apps, especially for security-sensitive functionality. A secure React Native library is: Without vulnerabilities: The library doesn’t have known vulnerabilities and it has a reasonable history of patching known vulnerabilities. Without open security issues: Review GitHub issues and PRs to see how the maintainers respond to security issues. Actively maintained and supported by multiple people. The security-related library should be supported by people with security and cryptography expertise, and ideally audited by a third party. Optimised for mobile platforms: For example, a library with a cryptographically secure pseudorandom generator should not depend on mouse clicks (example explained). Easy-to-use API: The library has well-documented APIs that work the same on iOS and Android. Licence: Pay attention to the open-source licence, as not all open-source libraries are free to use. Tests: Make sure the library has unit and integration tests, especially if it deals with cryptography or operates highly sensitive data. Research React Native libraries and their dependencies before using them for security-sensitive functionality. 4. Seven steps to secure React Native app Find your way to a secure React Native app, by following the steps that we singled out to simplify this journey: Understand the implication of adding one more vendor (Facebook) and put trust in the security of its platform. Make sure your team has enough security expertise for iOS, Android, and React Native. Depending on data sensitivity, you may want to hire external security experts. Educate your development team about security best practices, secure coding, possibilities to automate security checks, OWASP Mobile Top-10, and OWASP MAS. Creating security controls for mobile apps as React Native apps are still mobile apps. Use OWASP MAS as a main guidance. Add security controls specific to React Native, if needed. Managing dependencies in your React Native apps, and keeping them up to date. Automated dependency analysers and code scanning is a good proactive approach. Cover security controls with tests, especially if they deal with cryptographic operations, Secure Enclave, and StrongBox Keystore Send the app for security review by third-party experts. Implement mitigations, cover them with tests, and add the issue to the regression testing checklist. Securing React Native mobile apps requires a holistic approach, applied to all aspects of the development process, from choosing secure libraries to implementing security controls. Watch Star The OWASP® Foundation works to improve the security of software through its community-led open source software projects, hundreds of chapters worldwide, tens of thousands of members, and by hosting local and global conferences. Recent News & Opinions Lifecycle events are part of the secure supply chain More than a Password Day 2024 A workaround for OWASP Foundation emails being blocked by Microsoft Office 365 Securing React Native Mobile Apps with OWASP MAS OWASP Email Problems (and solutions) New Articles of Incorporation and Bylaws for the OWASP Foundation! Update on the ASVS Community Meetup SecureFlag and OWASP partner to offer Threat Modeling Automation tool ThreatCanvas to Members The OWASP Foundation appoints Starr Brown as Director of Projects The OWASP Foundation Celebrates 20th Anniversary Checkmarx and OWASP Launch First-ever Global Codebashing Learning Initiative CycloneDX v1.6 Released, Advances Software Supply Chain Security with Cryptographic Bill of Materials and Attestations OWASP Data Leak Notification Traefik Labs Joins OWASP and Integrates Coraza and Core Rule Set Projects OWASP CycloneDX is ready to support your CRA compliance journey! Introducing the OWASP IoT Security Testing Guide (ISTG) OWASP appoints Jason C. McDonald as Director of Community Development OWASP joins the US AI Safety Institute Consortium (AISIC) at its launch to support collaborative efforts to safeguard AI. Trustwave Transfers ModSecurity Custodianship to OWASP CycloneDX v1.6 Introduces Support for Attestations of Compliance with Any Standard, Improving Compliance and Scalability for Consumers and Vendors of Third Party Software Upcoming OWASP Global Events var events = []; $(function () { eventsyml = YAML.load('https://owasp.org/assets/sitedata/events.yml'); $.each(eventsyml, function (index) { if (this.category == 'Global') { for (e in this.events) { events.push(this.events[e]); } } }); if (events.length > 0) { var htmlstring = "<ul>"; for (evnt in events) { if (events[evnt].url) htmlstring += '<li><a href="' + events[evnt].url else htmlstring += '<li><a href="https://owasp.org/events/' htmlstring += '" target="_blank rel="noopener">' + events[evnt].name + '</a>'; if (typeof events[evnt].dates === 'undefined') { events[evnt].dates = 'TBA'; } htmlstring += "<ul><li style='list-style-type: circle;margin-top: 0px;padding:0px;margin-left:16px;'>" + events[evnt].dates + "</li></ul></li>"; } htmlstring += "</ul>"; $("#global-event-div").html(htmlstring); } });'''
