["https://owncloud.org/features/active-directory-and-ldap"]
title = "Streamlined, Easy User Management: ownCloud LDAP/AD"
description = "LDAP, Microsoft Active Directory or openLDAP integrates with ownCloud to make user management a breeze!"
full_description = "Feature Active Directory and LDAP Speed up ownCloud integration and leverage existing user data through Microsoft Active Directory or LDAP N Community Edition Get started N Standard Edition Get a quote N Enterprise Edition Get a quote N ownCloud.online (SaaS) Start free trial Efficient user management is vital for the success of any enterprise, irrespective of its size. The LDAP application was designed to make user management easier and more streamlined and simplify administration, by leveraging existing authentication and user management systems. ownCloud integrates with existing user directories, Active Directory (AD) and Lightweight Directory Access Protocol (LDAP). How LDAP/AD integration simplifies user management: ownCloud is equipped with an LDAP application that makes existing users, including those from Active Directory, appear in your ownCloud user list. This completely eliminates the need to create separate ownCloud accounts for existing users, thus saving valuable time and IT workload. ownCloud users can authenticate with their existing credentials. The authentication request is handled by the Active Directory or the LDAP server, so ownCloud does not store the passwords. The application also simplifies integration by pulling users’ group memberships, quota settings, email addresses and avatar pictures through appropriate queries and filters. The LDAP application supports: LDAP groups File sharing with ownCloud users and groups Access via WebDAV and ownCloud Desktop Client Versioning, external Storage and all other ownCloud features Seamless connectivity to Active Directory, without additional configuration Primary groups in Active Directory Only-read access to your LDAP (editing or deleting users on your LDAP is not supported) Advantages of LDAP/ AD integration for user management at a glance: It integrates easily and seamlessly with the existing infrastructure, making professional user management a breeze. It allows for establishing user-specific, group-specific or universal file sharing policies as per requirement. With centrally-managed directories, users can use their account credentials for ownCloud, making way for a more streamlined user management system. It significantly reduces IT workload by eliminating the need to manage separate user accounts for specific services. It helps to maintain IT control and compliance by providing a transparent overview of login details and actions performed. Ready to get started? Schedule a demo Learn more about Active Directory and LDAP i Admin Manual  Marketplace i LDAP/AD Integration Whitepaper"
