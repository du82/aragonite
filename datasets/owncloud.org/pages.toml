["https://owncloud.org/features/file-drop-folders"]
title = "File Drop Folders - ownCloud"
description = "Let users collect data from outside contacts through File Drop Folders, ownCloud's secure public upload-only folders."
full_description = "Feature File Drop Folders Let users create public upload-only folders, in which they can collect files from outside contacts. It is handy to collect bids, proposals, homework assignments or anonymous feedback. N Community Edition Get started N Standard Edition Get a quote N Enterprise Edition Get a quote N ownCloud.online (SaaS) Start free trial Receive data the safe and easy way with File Drop Folders The Drop Folders feature enables users to make a folder available for write-only public access, meaning anyone can save into the folder, but without being able to see what’s inside. The folder can be protected with a password as well as an expiry date, so users can restrict access either to a group of people who know the password or a certain time period or both. File Drop Folders have no size limits, unlike email. ownCloud makes sure the files are safe to store and kept secure, courtesy of its Antivirus and File Firewall features. With Document Classification, files uploaded into Drop Folders can automatically be tagged and protected based on their content and other factors. The folder and the files within can be shared with other users, including with Guest Users and as Public Links, just as any other folder in ownCloud. Ready to get started? Schedule a demo Learn more about File Drop Folders: i How to get started: File Drop Folders i User Manual  Instructional Video"
