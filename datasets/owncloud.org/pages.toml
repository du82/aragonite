title = "ownCloud provides 3 OnlyOffice Integrations for secure teamwork"
description = "Let users edit office documents right inside ownCloud in real time using the office integrations with Collabora, OnlyOffice or Microsoft Office Online Server."
full_description = "Feature OnlyOffice Integration Lets users access, author, share and collaboratively edit office files directly from the ownCloud frontend in real time. M Community Edition M Standard Edition N Enterprise Edition Get a quote N ownCloud.online (SaaS) Start free trial The ONLYOFFICE application is a powerful, user-friendly and reliable tool that empowers users to access, author, share and collaboratively edit Microsoft Office files directly from the ownCloud frontend in real time. By integrating ownCloud with ONLYOFFICE, users are able to view changes made to files in real time, access the latest versions of files and thus completely eliminate the problem of version conflict that often arises when working independently on documents. Benefits of the ONLYOFFICE integration at a glance: Supports all MS Office formats (docx, xlsx, pptx, txt) Makes it easy to access, author, share and edit MS Office documents from the familiar ownCloud frontend in real time Allows files to be saved in multiple formats: docx,odt, rtf, txt, pdf, html, pptx, odp, xlsx, csv, ods Provides a transparent overview of changes made in real time, thus avoiding version conflict Improves productivity by enabling communication through comments, reviews and live chat Allows to set access rights (Full Access, Read Only, Review, Deny Access) Enables tracking and accepting/rejecting edits Saves changes automatically Ensures GDPR compliance Ready to get started? Schedule a demo Learn more about OnlyOffice Integrations i Admin Docs (WOPI)  Marketplace"
