["https://owncloud.org/features/custom-groups"]
title = "Custom Groups: Create user groups for easy filesharing"
description = "Let users create their own custom groups to quickly share data with multiple people at once. It makes teamwork more efficient and lightens your admins workload"
full_description = "Feature Custom Groups Let users create their own custom groups to quickly and easily share data with multiple people at once. It makes teamwork more efficient and also lightens admin workload. M Community Edition M Standard Edition N Enterprise Edition Get a quote N ownCloud.online (SaaS) Start free trial The ownCloud Custom Groups feature empowers users to define their own sharing groups in ownCloud without admin assistance. With the help of this application, users can create a group of users that they repeatedly share files with, for example, a team, a department or a group of contractors. How Custom Groups work The Custom Groups feature allows users to create and manage their own groups within a workplace. Members can be designated group admins to allow them to add or remove users. A group can also be hidden from a specified group of users. Moreover, administration of those groups by admins can even be disabled so that users can safely use the feature without having to trust administrators. ownCloud users can create and manage Custom Groups with only a few clicks. The groups are visible only to members of the group and ownCloud administrators can see and modify all groups of an ownCloud. Additionally, this application offers permission management capabilities to enable collaborative management of groups. A member of a group can be classified either as a ‘Member’ or a ‘Group admin’. Members can share files with the group, view the members list and leave the group. Group admins, in addition to the above, also enjoy the privilege to add and remove members, rename or delete the group and set permissions for other members of the group. To keep in mind: Custom groups are visible only to members of the group, but not to anyone outside the group; and ownCloud administrators can see and modify all custom groups of an instance. Advantages of using Custom Groups When working in larger organizations, the number of users in a collaboration platform like ownCloud quickly reaches a point where the segmentation of users becomes very relevant. In a regular workplace, creating groups is usually a job for administrators, but this approach can lead to bottlenecks and delays. By making it easy for users themselves to create groups and share files, organizations gain efficiency, increase productivity, meet organizational goals faster and significantly reduce administrative workload. Ready to get started? Schedule a demo Learn more about Custom Groups i User Manual  Instructional Video i Admin Docs  Marketplace  Github"
