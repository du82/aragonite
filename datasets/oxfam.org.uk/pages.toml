["https://www.oxfam.org.uk/donate/impact-amplified-local-partners-driving-sustainable-change/distributing-food-to-displaced-families-in-gaza"]
title = """
Distributing food to displaced families in Gaza    | Oxfam GB"""
description = "As the crisis in Gaza continues to unfold and intensify, Oxfam is working with several local organisations to provide urgent support to displaced families."
full_description = "An Oxfam staff member preparing food parcels to be distributed in North Gaza. Distributing food and clean water to families in Gaza Israel’s war on Gaza has taken a devastating toll on civilians and fuelled further Israeli escalations in violence in Lebanon and across the wider region.A temporary, fragile ceasefire is now in place in Gaza.After 15 months of bombing, death and destruction, people in Gaza have a reprieve from violence. Hostages from Israel and illegally detained Palestinians have started to be released.Hundreds of thousands of people across Gaza have made long journeys back to find what, if anything, remained of their homes. Most are arriving to find their communities destroyed, with no clean water, food or shelter.Read on to find out what our local partners are doing to support their community. Oxfam teams and partners have reached more than 1.2 million people with essential support since October 2023, including:Emergency food assistance, food parcels, cash and vouchers.Clean water and sanitation; by trucking in water and repairing badly damaged water and wastewater pipelines.First aid kits, hygiene kits, protection kits and cleaning supplies.Blankets, mattresses and sleeping mats to families forced to live in tents. Photo: PARC / Oxfam. Our partners include The Palestinian Medical Relief Society, Juzoor, The Cultural & Free Thoughts Association, Palestinian Environmental Friends, Palestine Agricultural Relief Committee, Atfaluna, The Association for Woman and Child Protection, the Economic and Social Development Centre of Palestine, and Al Bayader. Food Parcels in Gaza Oxfam and our partner Economic & Social Development Center of Palestine (ESDC) distributed vegetables baskets among internally displaced people and affected communities in Deir Al Balah and Khan Younis. The vegetable baskets included items like tomatoes, cucumbers, and lemons. Most of these items are sold in the local market for high prices that people cannot afford.In total, 2,500 vegetable baskets were distributed in Khan Younis (1,212) and the Middle Area (1,288) via ESDC. A feedback mechanism was developed to ensure those receiving the parcels could have their say on the parcels. Oxfam has continued to work to provide assistance. Shahinaz's story After being displaced from Gaza City, Shahinaz, stepped up to volunteer in a camp, determined to support her community amidst overwhelming challenges. The wet winter weather brought extra complications. Oxfam and partner Palestinian Environmental Friends - PEF assisted through the installation of sandbags, the provision of cleaning tools and personal protective equipment, including masks and gloves. Water trucks were used to fill tanks, making sure everyone had access to clean water. Additionally, they promoted good hygiene practices to keep their community safe and healthy. What's happening in gaza A 42-day (six weeks) temporary ceasefire came into effect from 19 January 2025. The next phases of the ceasefire still need to be negotiated.Israeli hostages and Palestinian detainees have started to be released.Hundreds of aid trucks have entered Gaza, bringing a small fraction of food, clean water, medical supplies, fuel and shelter to those who desperately need it. But the humanitarian need in Gaza is beyond catastrophic.Despite the resumption of some aid, the levels of destruction across the whole of Gaza, mean people have just 5.7 litres of water per person per day in the North Gaza and Rafah governorates. That's barely enough for one toilet flush.People are returning to their homes to find them turned into rubble. Many will remain living in makeshift tents and shelters, with little protection against the harsh winter weather. Babies have been dying from the cold.More than 40,000 people have been forcibly displaced in the West Bank since the Gaza temporary ceasefire came into force on 19 January.There continue to be significant challenges in distributing aid, due to extensive infrastructure damage, and the new Israeli laws restricting UNRWA from operating. It is an enormous relief that even an interim ceasefire has been agreed. This pause in hostilities is beyond overdue.” Halima Begum , Oxfam GB Chief Executive This Ramadan, embody the spirit of collective generosity and join Oxfam in working hand-in-hand with communities across the world. An Oxfam staff member preparing food parcels to be distributed in North Gaza. Donate this Ramadan Join us in fostering a future where local communities and partners lead the way. Discover More Donate your Zakat to Oxfam Let’s come together to show the true spirit of generosity. Join Oxfam and our partners in supporting the most vulnerable Muslim-majority communities worldwide. 100% of Zakat donations are spent in selected countries to help those in need. Oxfam's Zakat policy By making your Zakat payment to Oxfam, you can be sure your payment will help those suffering from poverty or extreme hardship. Reducing climate-related disaster risks in Bangladesh Dulu Begum worked with JAGO NARI to become a community leader and an outspoken advocate for reducing disaster risks."
