full_description = "Kitty Norwell/Oxfam Celebrate the life of someone you love You can create a personalised online tribute page in memory of your loved one. Create a tribute page In memory donations Home Donate now Leave a gift in your will to Oxfam We understand losing someone is incredibly difficult and we thank you for considering a memorial donation at this difficult time. Ways to Donate in Memory In memory donations are a wonderful way for you and your family to celebrate the life of someone special. Photo by WAQAR HUSSEIN/EPA-EFE/Shutterstock (13353128d) One-off donation You can leave a donation in your loved one’s name.This gift could provide emergency food, support food producers and help families overcome poverty. One-off donation Funeral collection To hold an in person funeral collection for Oxfam, please contact our supporter relations team on 0300 200 1331 and request gift aid envelopes.Or you can hold an online funeral collection and share the link. After the funeral, the page will remain as a lasting online tribute to your loved one that family and friends can visit whenever and share photos, memories and messages. Create Funeral Collection Online tribute fund Create a personalised online tribute page in memory of your loved one.Friends or family can donate online, as well as share memories, stories, photographs, and messages.You can also donate to existing tribute funds in our online tribute garden. Find Tribute. Create tribute fund Leave a gift in your Will When Nessy’s mum left a gift in her Will to Oxfam it was no surprise to Nessy. She didn’t even query that it was the right choice. Her mother stayed true to her principles and for their family it was as a powerful celebration of her life. Gifts in Wills Discover More Donate to Oxfam GB Make a charity donation to Oxfam. Donate online, by phone or PayPal. Give a one-off donation or set up a monthly donation. Save lives, donate now. Oxfam in action We are a global movement of millions of people working together to end poverty. Hear from the people who we are working with to end poverty. How to leave a gift in your Will You can choose to leave a specific sum of money (a pecuniary legacy), a share of your estate (a residuary legacy), or a specific item. Our guide covers everything you need to know."
