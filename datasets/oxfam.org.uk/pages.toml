["https://oxfam.org.uk/about-us/how-oxfam-changing"]
title = """
Oxfam: the story so far    | Oxfam GB"""
description = "Oxfam's strategy sets out our vision of a kinder world - a world less divided by borders, money, race or gender."
full_description = "Also in this section How we work Oxfam's CEO, Directors and Trustees Plans, reports and policies Working at Oxfam Keeping people safe History of Oxfam Frequently asked questions Where we work Oxfam: the story so far Tackling abuse: Information and updates The Inclusive Language Guide: When we include everyone we can overcome poverty Oxfam Scotland Oxfam: the story so far Home About us A kinder and radically better world is possible. Let's take action to make it happen. A youth group in Barishal, Bangladesh, that works with the WAVE Foundation, an Oxfam partner, on reducing disaster risks. Photo: Elizabeth Stevens/Oxfam. If we could focus on tackling inequalities and injustices effectively, I’ve no doubt this would help create a kinder, fairer world for us all.” Halima Begum, CEO Oxfam GB For a radically better world Since Oxfam first started in 1942, we’ve challenged the underlying causes of poverty, while supporting people to cope when disaster strikes. These principles are just as relevant today. But inequality is on the rise, and global challenges from climate to conflict to cost of living are reversing progress against extreme poverty. So, the same old approach cannot be the answer.In 2020 we launched a strategy that sets out how Oxfam GB believe we can best tackle poverty, in the context of these enormous challenges the world faces.This means we:Focus on where we can make the most radical difference: by tackling extreme vulnerability in the toughest places on earth, and challenging the inequalities that drive poverty.Invest in equal partnerships with communities and organisations around the world: those with the expertise and experience to drive profound positive change.Grow a global network that actively shifts spending and decision-making power to partners in the Global South.Bring together people to act in solidarity with and for each other, to help raise vital funds for partners to lead us in this work, and speak out together for a better world.And how we work is as important as what we do, so through it all is a focus on continuing to become a safe, feminist and anti-racist organisation. Read our full strategy pdf 15.3 MB Read about our commitment to safeguarding pdf 273.8 KB Read about our commitments to anti-racism, feminism and shifting power pdf 1.1 MB Oxfam GB's Decolonial Partnerships Strategy - two-page summary pdf 402.5 KB Oxfam GB's Decolonial Partnerships Strategy - full pdf 109.1 KB Read our full strategy pdf 15.3 MB Read our 'There is no them, just us' paper pdf 811.9 KB Read our Rights, Resilience and Response strategy pdf 3.9 MB Oxfam GB is one of 21 independent affiliates that make up the Oxfam confederation. The Oxfam GB Strategy shows how Oxfam GB contributes to the vision of the Oxfam International Global Strategic Framework What we do Tackling extreme vulnerabilityWe work in some of the most unstable and insecure places, where violent conflict and mass destruction caused by climate breakdown are relentless.Often with little or no government support (clean water, healthcare, social protection), people already facing poverty are forced into a situation of extreme vulnerability. An injustice that’s underpinned by rising global inequality.It takes incredible resilience and expertise to know how to cope when lives are uprooted by conflict and extreme weather. No one has more experience than people living this reality every day. So, Oxfam is led by that expertise, by affected communities and the organisations around them. Awssan Kamal Yemen has been in the midst of war for years now. We need to stand with those calling for an end to this war, and secure inclusive and lasting peace.” Awssan Kamal, Conflict & Fragility Lead for Oxfam GB Challenging global inequalities The world’s progress in overcoming poverty has always been fragile, and it risks going backwards unless we think about poverty as a system.Poverty isn’t inevitable. It is made by choices and systems that benefit people already with the most power, and ignore the needs of people who’ve been stripped of theirs. This is inequality.There are many ways that inequality causes poverty the world over. To have the biggest impact, we focus on those where we believe we can make the biggest difference. Right now, it's... Inequality in the climate crisisThe biggest polluters are being allowed to rake in huge profits while people living in poverty are left paying the highest price. This is climate inequality.We believe climate justice is possible. The biggest polluters (like the wealthiest countries, big corporations and the super rich) should be taxed to cover the costs for their climate-wrecking behaviour. This will help raise the funds urgently needed to deal with the devastating impacts of the climate crisis. Nana Kofi Acquah/Oxfam I take care of the solar pump. I make sure it stays clean. The whole community is benefitting. I’m so happy.” Joshua in Ghana Inequality in how women’s work is seen and valuedMuch of the work women do the world-over is unpaid or low paid. And that’s no accident.Entrenched views about women’s roles and abilities mean an oppressive amount of their time is spent in low-paid, informal work (like house cleaners and market stall holders) and working hard in the home for no pay at all (like caring for children).This work takes time and energy, just like any other work. And it’s invaluable to societies and economies. Yet it’s taken for granted, ignored and unvalued.We need to shift away from economies rooted in inequality and exploitation, to economies that centre the wellbeing of both people and planet. Razigah used to run a small shop, but was forced into bankruptcy. A cash transfer helped her to restart her business. She keeps prices low and margins tight, but can live independently. Image: Kaff Media / Oxfam I have a grocery shop. I started three or four years ago, when Oxfam helped me with this project... Our life improved, we buy small things that we can afford like cooking oil and other small home items.” Razigah in her grocery shop in Yemen. Speaking outWe’ll always challenge inequality, the underlying cause of poverty, wherever we see it – from social attitudes to government policies. Time and again, we’ve seen what we can achieve when we stand together with others and speak out against injustice. Let’s demand a world that benefits everyone – rising above the lie that there’s not enough to go around, acting in empathy with and for each other. Because there is no them, just us. How we'll do it Radical, lasting change will only happen if we give as much weight to how we work as to what we do.” Dhananjayan Sriskandarajah (Oxfam GB CEO, 2019-2023) Standing togetherWe work in equal and respectful partnerships with communities and organisations around the worldWe bring together people and groups in the UK to act in solidarity with and for each other.We connect people and organisations together worldwide, actively shifting power – money, decision-making, influence – to the Global SouthAnd we...Do everything we can to ensure no one is left behind, power is shared fairly, and we are held to accountIn particular, we’ll continue on our journey towards being safe, feminist and anti-racist Elizabeth Stevens/ Oxfam America Our partners will lead us In the Philippines, Oxfam has supported local partner ‘CDP’ to provide equipment and training to local women’s groups like Abante Kababayen.In this picture, Abante Kababayen (meaning ‘Forward Women’) demonstrate the equipment that helps families evacuate when cyclones threaten their communities. Also in this section How we work Oxfam's CEO, Directors and Trustees Plans, reports and policies Working at Oxfam Keeping people safe History of Oxfam Frequently asked questions Where we work Oxfam: the story so far Tackling abuse: Information and updates The Inclusive Language Guide: When we include everyone we can overcome poverty Oxfam Scotland"
year_published = 2025
