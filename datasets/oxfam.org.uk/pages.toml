erty and build a radically better world. Our Annual Report Discover More Oxfam in action We are a global movement of millions of people working together to end poverty. Hear from the people who we are working with to end poverty. About us Oxfam is a global movement of people who are fighting inequality to beat poverty together. Impact stories First hand accounts from the people we work with about the impact of Oxfam's support. Also in this section How we work Oxfam's CEO, Directors and Trustees Plans, reports and policies Working at Oxfam Keeping people safe History of Oxfam Frequently asked questions Where we work Oxfam: the story so far Tackling abuse: Information and updates The Inclusive Language Guide: When we include everyone we can overcome poverty Oxfam Scotland"
