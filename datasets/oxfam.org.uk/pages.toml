["https://oxfam.org.uk/get-involved/campaign-with-oxfam/tax-the-super-rich"]
title = """
Tax the rich: Join the fight for a fairer future    | Oxfam GB"""
description = "It’s time to tax the super-rich. Join the fight for a fairer future."
full_description = '''Call for a fairer future Tax the rich: Join the fight for a fairer future Billionaire wealth surged by $2 trillion in 2024 — three times faster than in 2023 Four new billionaires are minted every week while 3.5 billion people still live in poverty Let's all fight for a fairer future. It’s time to tax the super-rich Join us today More about this issue Tax the rich: Join the fight for a fairer future Billionaire wealth surged by $2 trillion in 2024 — three times faster than in 2023 Four new billionaires are minted every week while 3.5 billion people still live in poverty Let's all fight for a fairer future. It’s time to tax the super-rich Join us today More about this issue Tackling inequality starts with making those at the top pay their fair share. If billionaires paid a little more in taxes (it’s just a drop in the ocean for them), that money could fund healthcare, education, fair wages, and protection from the climate crisis. Let's come together and make this right.So, are you in? It’s time to tax the super-rich. Join the fight for a fairer future. The gap between the super-rich and the rest of us is out of control. At this rate, we’ll have five trillionaires in the next decade — meanwhile, from the UK to Nepal and Kenya to Brazil, people are struggling to make ends meet. In fact, poverty levels have barely budged since 1990. None of us can accept this level of inequality. A system that allows billionaires and their unchecked, unearned wealth is causing serious damage, and we're all picking up the tab: battling soaring living costs, underfunded public services, and the worst effects of the climate crisis.Here’s the thing: we don’t have to accept an unequal system that values billionaire wealth above people and the planet. There’s another way—a way that prioritises fairness, sustainability, and equality.Together, we can change the system and create a fairer world. We’ll be in touch with ways you can make a difference. From supporting our campaigns to help close the wealth gap, to helping hold world leaders to account on urgent climate action, or acting in solidarity with communities pushing for their rights. Together, we can change the system and create a fairer world, join us today. Help us reach our target Sign now Call for a fairer future You don't have to give us your email address and/or phone number (including by using autofill), but if you do, you consent to us using them to keep you updated about our projects, fundraising activities and appeals. var element grecaptcha.ready(function() { element = document.querySelector('.g-recaptcha[data-widget-uuid="5fc2352a17fd4a5ba22d0492896ff34d"]'); element.form.addEventListener('submit', recaptchaFormSubmit); }); function recaptchaFormSubmit(event) { event.preventDefault(); grecaptcha.execute('6Lcv5twUAAAAAL-FmuyEg33V6lHHmR-co5tX0UYp', {action: 'petition_submit'}) .then(function(token) { console.log("reCAPTCHA validated for 'data-widget-uuid=\"5fc2352a17fd4a5ba22d0492896ff34d\"'. Setting input value...") element.value = token; element.form.submit(); }); } First name * Required Last name * Required Email Phone number You can opt out at any time. Your information is safe and secure with us read our privacy policy. You have already signed this petition have signed Help us reach our target of by sharing it with others! Please share on'''
