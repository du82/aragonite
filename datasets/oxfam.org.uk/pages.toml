f Zakat donations are spent in selected countries to help those in need. More ways to donate Giving a donation online is just one of the ways you can support Oxfam. People's Postcode Lottery Sign up today to play with your postcode for the chance to win! Guaranteed winners every day. Pay in your fundraising Once you've raised your money you can pay it in online, over the phone or by post. Donate monthly By donating to Oxfam on a monthly basis, you are supporting our ongoing work and allowing us to plan for the future. Every penny counts We work hard to ensure that not a penny is wasted in our fight to end poverty and injustice. The Oxfam Promise Oxfam's supporters make our vital work with some of the world's poorest communities possible. We can’t do it without you. Philanthropy Whether giving a large donation or giving business advice, there are many ways for people with exceptional wealth or skills to support Oxfam. FAQs about donations Whether you're an existing donor to Oxfam or are considering making a donation, find answers below to our most frequently asked questions. Play the Oxfam Lottery Win up to £1000 every week. Plus £5000 twice a year in our bonus draw. Our powerful and fun way to help end poverty.'''
