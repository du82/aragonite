["https://oxfam.org.uk/oxfam-in-action/current-emergencies/gaza-crisis-appeal"]
title = """
Donate to Gaza Lebanon - Gaza and Lebanon Appeal    | Oxfam GB"""
description = "Donate to our Gaza-Lebanon emergency appeal. A donation from you can help our teams provide desperately needed supplies like food, water and sanitation."
full_description = '''{"event": "detail_view", "ecommerce": {"detail": {"actionField": {"list": "donation"}, "products": [{"id": "Donate to Gaza and Lebanon (Single Donation)", "name": "donation", "category": "one-off donation"}]}}, "formID": "emergencyappealpage-819", "formName": "Gaza Lebanon Crisis 2024", "CRMEventCode": ""} window.dataLayer = window.dataLayer || []; const pushDataElement = document.querySelector('#js-analytics-data'); if (pushDataElement) { const pushData = JSON.parse(pushDataElement.textContent); window.dataLayer.push(pushData); } Emergency appeal Donate to Gaza and Lebanon Home Oxfam in action Emergencies Last updated: 28 February 2025 Israel’s war on Gaza has taken a devastating toll on civilians and fuelled further Israeli escalations in violence in Lebanon and across the wider region.A temporary, fragile ceasefire is now in place in Gaza.After 15 months of bombing, death and destruction, people in Gaza have a reprieve from violence. Hostages from Israel and illegally detained Palestinians have started to be released. Hundreds of thousands of people across Gaza have made long journeys back to find what, if anything, remained of their homes. Most are arriving to find their communities destroyed, with no clean water, food or shelter.Please donate today to ​​​support people who have lost everything to this war.Your donation will help provide emergency food, clean water and hygiene kits, and repair water and wastewater networks in Gaza. And your support will help people forced to flee their homes due to the violence in Lebanon.​​ “It is an enormous relief that even an interim ceasefire has been agreed. This pause in hostilities is beyond overdue.”” Halima Begum , Oxfam GB Chief Executive Image: Oxfam A map of Gaza, Lebanon and the wider region. Donate to Gaza and Lebanon Donate now What's happening in Gaza? A 42-day (six weeks) temporary ceasefire came into effect from 19 January 2025. The next phases of the ceasefire still need to be negotiated.At least 46,000 people have been killed by the Israeli military, a third of them children.Israeli hostages and Palestinian detainees have started to be released.Hundreds of aid trucks have entered Gaza, bringing a small fraction of food, clean water, medical supplies, fuel and shelter to those who desperately need it. But the humanitarian need in Gaza is beyond catastrophic.People are returning to their homes to find them turned into rubble. Many will remain living in makeshift tents and shelters, with little protection against the harsh winter weather. Babies have been dying from the cold.There is not enough clean, safe water in Gaza. Water and sanitation systems are shattered. The situation is desperate.More than 40,000 people have been forcibly displaced in the West Bank since the Gaza temporary ceasefire came into force on 19 January.The most urgent needs in Gaza right now are water, food, medical supplies, and shelter. Read more about Gaza What's happening in Lebanon? Israeli airstrikes in Lebanon forced more than one million people to flee their homes.A 60-day ceasefire agreement in Lebanon came into effect from 27 November.People are in need of humanitarian aid. Many homes and villages have been destroyed.Lebanon can’t afford to bear the weight of this added disaster on its own. Read more about Lebanon What is Oxfam doing in Gaza? The Israeli military bombardment, destruction of infrastructure, and restriction on goods entering Gaza, has made a full-scale humanitarian response extremely difficult.Despite huge obstacles, Oxfam staff and partners are responding as best they can to scale up their humanitarian work during the interim ceasefire.Oxfam teams and partners have reached more than 1.2 million people with essential support since October 2023, including:Emergency food assistance, food parcels, cash and vouchers.Clean water and sanitation; by trucking in water and repairing badly damaged water and wastewater pipelines.First aid kits, hygiene kits, protection kits and cleaning supplies.Blankets, mattresses and sleeping mats to families forced to live in tents.Oxfam has worked in the Occupied Palestinian Territory and Israel since the 1950s to help build and protect rights to water, sanitation and hygiene, cash assistance and more.Oxfam's early recovery work will focus on immediate needs. We will continue working with local partners in the coming weeks and months, helping people get life-saving support such as clean water, food and sanitation.Our partners include:The Palestinian Medical Relief Society, Juzoor, The Cultural & Free Thoughts Association, Palestinian Environmental Friends, Palestine Agricultural Relief Committee, Atfaluna, The Association for Woman and Child Protection, the Economic and Social Development Centre of Palestine, and Al Bayader. "Life before the war was truly beautiful." - Duaa Image: Alef Multimedia Company/ Oxfam The sound of the drones constantly buzzing never leaves us.” – Duaa in her kitchen in Gaza. What is Oxfam doing in Lebanon? Oxfam is responding to humanitarian needs in Lebanon, providing essential support to people who were forced to flee due to Israeli airstrikes bombarding their homes and communities.With our partners we are providing:Clean water and sanitationEmergency cashFoodHygiene kitsMenstrual kitsOxfam and our partners are supporting internally displaced people in shelters in Beirut, Mount Lebanon and North Lebanon. What else can you do to help? While the current pause in hostilities is allowing more aid into Gaza, it must also be a starting point for accountability, justice, and lasting peace. Permanent ceasefire now Call for a permanent ceasefire, unrestricted humanitarian access and a path to justice. Sign petition Stop arming Israel Demand the UK stop all arms sales to Israel. Sign petition How to help Gaza Find out more ways to stand in solidarity and make your voice heard. Read more More on the Gaza crisis Read our latest press releases.Read frequently asked questions. How we spend your moneyFor every £1 you donate to this emergency appeal, we will allocate 9p of your donation to cover general support and running costs. There is a small chance that we will raise more money than is needed for this appeal. If this happens, we'll spend any additional funds on other Oxfam projects — wherever the need is greatest. Donate to Gaza and Lebanon Donate Discover more Gaza Crisis: Call for a permanent ceasefire now Call for a permanent ceasefire, unrestricted humanitarian access and a path to justice. Water for all With clean water on tap, food can grow, disease can be defeated and people can thrive. Food for all No-one should go to bed hungry. We work to help people put food back on their table, today and tomorrow.'''
