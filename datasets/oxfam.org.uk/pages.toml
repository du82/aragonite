description = "Leave a gift in your Will to Oxfam and show solidarity with future generations. Legacy giving is a powerful way to make a big difference."
full_description = "Leave a gift in your will to Oxfam Leaving a gift in your Will to Oxfam is a powerful way to show solidarity with future generations in the fight against poverty and injustice. Gifts in Wills make up a quarter of our public unrestricted funds. Without them we couldn’t support local communities to build sustainable livelihoods, or hold governments accountable for their actions. Joyce Koech, climate activist in Kenya. Photo: Rogers Ouma Download your free gifts in Wills guide Leave a gift in your Will and help climate activists like Joyce fight for a safer future. Download guide Leave a gift in your will to Oxfam Leaving a gift in your Will to Oxfam is a powerful way to show solidarity with future generations in the fight against poverty and injustice. Gifts in Wills make up a quarter of our public unrestricted funds. Without them we couldn’t support local communities to build sustainable livelihoods, or hold governments accountable for their actions. How to leave a gift in your Will You can choose to leave a specific sum of money (a pecuniary legacy), a share of your estate (a residuary legacy), or a specific item. Our guide covers everything you need to know. Find out more A gift of support for the next generation Read Jessy’s story and learn how your legacy gift will help young activists just like her fight for a fairer world for all of us. Read Jessy's story Information for Executors If you're an executor of somebody's Will, we’re here to help. Read through our guide or get in touch and we’ll talk you through the process. Things to think about Oxfam's free Will offer Write or amend your Will for free using our Will writing service. We’ve partnered with trusted providers to make it fast and simple, and there’s no obligation to leave a gift to Oxfam. Use our Will writing services Gifts in Wills Events Join us at one of our gifts in Wills events to find out more about this special way of supporting Oxfam. Attend an event Leave a legacy, stay in the fight You’ve been fighting for a fairer world all your life. Why stop now? Watch our campaign and stay in the fight with activists like Joyce. Leave a legacy to Oxfam Discover more Contact us Our Gifts in Wills Advisors are here to support you with any queries you might have. Meet our supporters Meet a few of the thousands of people who have chosen to leave a gift in their Will to Oxfam. In memory donations Remembering a loved one with a gift to Oxfam is a wonderful way to celebrate the life of someone special. Remember a Charity Week Remember a Charity Week aims to help raise awareness about the importance of leaving a gift in your Will. Joyce Koech, climate activist in Kenya. Photo: Rogers Ouma The future is written in your Will With a gift in your Will, no matter what the size, you can help put the power back into the hands of change makers for generations to come. Read our guide to find out how to get started and hear stories of hope powered in part by gifts in Wills. Download our gifts in Wills guide"
