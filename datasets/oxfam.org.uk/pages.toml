["https://www.oxfam.org.uk/about-us/plans-reports-and-policies/modern-slavery-act-statement"]
title = """
Modern Slavery Act statement    | Oxfam GB"""
description = "A public statement on steps Oxfam is taking to identify and prevent modern slavery in its operations and supply chains."
full_description = "Also in this section Annual Report and accounts 2023-24 Oxfam's Constitution Legitimacy and accountability Oxfam GB's Open Information Policy Corporate responsibility Information for suppliers Oxfam GB's Gender Pay Gap Oxfam's Code of Conduct Oxfam’s Zakat Advisory Panel Learning and evaluation Modern Slavery Act statement Fundraising and responding to vulnerable people Plans, reports and policies archive Oxfam's Zakat policy Oxfam's Impact: A Decade of Insight Effectiveness Reviews Food Producer Rights Modern Slavery Act statement Home About us Plans, reports and policies The UK's Modern Slavery Act 2015 requires organisations with an annual turnover of at least £36m to make a public statement on steps they are taking to identify and prevent modern slavery in their operations and supply chains. Oxfam GB advocated for this legislation to be enacted, and these statements describe the steps taken to identify, redress and mitigate modern slavery and human trafficking in our own business and supply chain operations.Oxfam continue to seek to collaborate with others to be as effective as we can in tackling all forms of human rights abuses including modern slavery and human trafficking. Our aim is to continuously improve our practices and impact over time.In our 2021 statement we published a list of our retail suppliers. If you wish to see the latest list, please follow this link to our Corporate Responsibility page Download the 2024 statement Download the 2023 statement Download the 2022 statement Download the 2021 statement Download the 2020 statement Download the 2019 statement Download the 2018 statement Download the 2017 statement Download the 2016 statement Discover More Oxfam in action We are a global movement of millions of people working together to end poverty. Hear from the people who we are working with to end poverty. Every penny counts We work hard to ensure that not a penny is wasted in our fight to end poverty and injustice. Also in this