title = """
Campaign with us | Take action now online    | Oxfam GB"""
description = "Campaign with Oxfam to make your voice heard and fight the injustices that hold the world's poorest people back."
full_description = "Demand Keir Starmer Reverses Aid Cuts Call on your MP to put pressure on the Prime Minister and reverse the harmful and immoral cuts to the UK aid budget. Email your MP Fight inequality. Beat poverty. Campaign with us Together we can harness people power to challenge unjust systems, and fight for a fairer, more equal world. Take action now Petitions are an important way to show mass support and solidarity. Petition Tax the super-rich Tackling inequality starts with making those at the top pay their fair share. Join the fight for a fairer future. Sign petition Petition Permanent ceasefire now Call for a permanent ceasefire in Gaza, unrestricted humanitarian access and a path to justice. Sign petition Open letter Tax Private Jets and Superyachts Fight climate inequality - call for fair taxes for the most polluting luxury travel. Sign open letter More ways to get involved Join the fight for climate justice Join communities around the world calling for climate justice. Add your voice Lobby your MP Do you want to create political change? Become an Oxfam constituency campaigner and start conversations with your local MP. Join now Become a student activist At university and care about social injustice? Then join a growing network of students across the UK who campaign with us to fight for a better world. Join now Campaign at a festival Campaigning at festivals is an opportunity to come along to your favourite festivals while making a real difference in the world. Sign up Make change happen Join this online course to learn what drives positive social change, and your role as a changemaker. Strengthen your skills to tackle injustice. Find out more Our campaigns Gaza Crisis The situation in Gaza and Israel is fast-moving and at times confusing. Here's what's happening, and what you can do to help. Climate justice The climate crisis isn't in the future, it's here now. Pushing people deeper into poverty. We are calling for climate justice, and a world in which we can all thrive. Inequality We are living in an inequality crisis, in the UK and around the world. A symptom of an unequal economic system. But it doesn't have to be this way."
