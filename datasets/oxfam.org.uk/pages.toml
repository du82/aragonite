["https://oxfam.org.uk/oxfam-in-action/poverty-and-inequality"]
title = """
Poverty and inequality    | Oxfam GB"""
description = "Poverty and inequality are two sides of the same coin. Inequality is rising everywhere, fuelling poverty. But together, we can demand a fairer world for everyone."
full_description = "Poverty and inequality Inequality is rising everywhere, fuelling poverty. We believe in a fairer world. We know you do too. It's a lie that there's not enough to go around. And that it's a choice between 'us' and 'them'. Together, we can demand a fairer world for everyone. A fairer world To us, a fairer world means equal job opportunities, decent education, having enough money to get by, and more.It means freedom from injustice. It means power is shared fairly – so everybody has what they need to thrive, not just survive. A world where everyone matters equally. It's something we’ve been saying since 1942. Play your part How Oxfam are tackling poverty and inequality Everyone deserves a decent life.So why isn’t this happening? We know global poverty is made by political choices that benefit people already with the most power, and ignore the needs of people who’ve been stripped of theirs. It’s powered by inequality – and it’s time that changed.That's why we partner up with organisations around the world who are embedded within the communities we work with. Through these partnerships, we’re constantly learning together and developing ways to cut poverty and inequality off at the roots. For example....Achieving a safer, peaceful worldMillions of people live in the toughest places on earth, facing violent conflict and mass destruction caused by climate change. Often with little or no government support, people already facing poverty are forced into a situation of extreme vulnerability.It's an injustice that people who’ve already been stripped of the resources and power to cope with crises, are paying the price for decisions made by the most powerful people.Ending this injustice is possible. But it'll take us all to speak out for a safer, peaceful world.A world where no one's made more vulnerable to crises than anyone else. Where lives are no longer routinely upended by violence. Where, when disasters strike, everyone has access to protection and a right to safety.It takes incredible resilience and expertise to know how to cope when lives are uprooted by conflict and extreme weather. No one has more experience than people living this reality every day.So Oxfam is led by that expertise, by the communities most affected and the organisations around them. Only then can we ensure people access what they need, when they need it. And only then can we really tackle the root causes that make people so unequally vulnerable in the first place.Working for climate justiceThe biggest polluters are being allowed to rake in huge profits while people living in poverty are left paying the highest price. This is climate inequality.We believe climate justice is possible. If the biggest polluters (like the wealthiest countries, big corporations and the super rich) cover the costs for their climate-wrecking behaviour, we can raise the funds urgently needed to deal with the devastating impacts of the climate crisis.The money is there, and there’s no time to lose. Let's rise above the lie that there’s not enough to go around. You can campaign with us and climate activists around the world calling for change. Vantha works in her greenhouse in Sambo District, Cambodia. Photo: Patrick Moran/ Oxfam Last rainy season there was a lot of rain and not enough vegetables planted due to lack of power supply. But when we got the greenhouse, it became much easier. Now I grow rice and vegetables. The income we make from vegetables is good, I will have a good life.” Vantha, together with Oxfam partner Northeastern Rural Development Organization (NRD) has set up a greenhouse with her family, growing crops they can sell. They now also have a new water system in the greenhouse, which means they can grow crops all year round. Building a fairer economyMuch of the work women do the world-over is unpaid or low paid. And that’s no accident.Entrenched views about women’s roles and abilities mean an oppressive amount of their time is spent in low-paid, informal work (like house cleaners and market stall holders) and working hard in the home for no pay at all (like caring for children).This work takes time and energy, just like any other work. And it’s invaluable to societies and economies. Yet it’s taken for granted, ignored and unvalued.We need to shift away from economies rooted in inequality and exploitation, to economies that centre the wellbeing of both people and planet.Oxfam works alongside activists and organisations worldwide who are pushing for a fairer economy – from Occupied Palestinian Territory to Kenya and UK. Many are funded through our Women’s Rights Fund ensuring partners can use money in the way they know will have the best impact.We’ve also produced reports that raise the voices of the many people experiencing this injustice. This work influences government policies and pushes for change. Being an unpaid carer, I felt that my caring story wasn't visible. Oxfam's help has enabled my voice, and the voices of carers' communities to be amplified to decision makers.” Katy, a carer in the UK. Katy has cared for her husband since 2014. How your donations have supported people living in poverty “As the shadows of war loomed... I had no choice but to sacrifice my education to provide for my family.” Nahla says.Nahla lives in Yemen, and like many people she is working in the face of war for a better future. Nahla did mobile phone repair training as part of a partnership with Tamdeen Youth Foundation.“Obtaining a certificate as a mobile technician enabled me to seize the opportunity to train in the maintenance department. I have found great success [and] continue to self-develop. If there is anything I can advise the girls living in similar circumstances [it’s] to be patient and never despair life is full of surprises and at every corner there is hope.’’Your donations have also supported George, who works with the Vanuatu Society for People with Disabilities (VSPD) and is himself disabled. Cash transfers have supported VSPD to reach more people in what he calls, “the family of people with disabilities”. “ Since we worked with the communities, we have registered every person with disabilities to the office, so the office knows the exact number of people with disabilities in every area.” George, Vanuatu Society for People with Disabilities (VSPD) “ The challenges are, people with disabilities living in remote areas don’t have the opportunity to go to a hospital, or the children to go to school, so it’s hard.” George, Vanuatu Society for People with Disabilities (VSPD) “ My aim, and the hope I have, is to make sure every child in my community goes to school.” George, Vanuatu Society for People with Disabilities (VSPD) “ I want to see that every person with disability has a home, a good place to sleep, a proper toilet and a proper place to wash their hands.” George, Vanuatu Society for People with Disabilities (VSPD) Equality for women Read more Climate change Read more Rights and Inequality in Crisis Read more"
year_published = 2025
