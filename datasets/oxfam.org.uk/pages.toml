["https://oxfam.org.uk/get-involved/campaign-with-oxfam/climate-action/meet-the-climate-activists"]
title = """
Meet the climate activists    | Oxfam GB"""
description = "In the run up to COP28, Oxfam is collaborating with climate activists from around the world who are on the front lines of the fight against climate change."
full_description = '''Also in this section Take action: demand polluters must pay Find out about climate action What is COP29 and why it is important? Image based on photos by Emmanuel Museruka/Oxfam, Fadrach Nirere/Fridays For Future Uganda, AlessandroBiascioli/Shutterstock, Shawn Exilus / Oxfam, Leslie Searles/Oxfam, Sahil Chandra/PISFCC Meet the climate activists Home Get Involved Campaign with us Climate Action In our fight for climate justice, Oxfam is collaborating with climate activists from around the world who are on the front lines of the fight against climate change. Cynthia Houniuhi, The Solomon Islands "We contribute almost nothing to this crisis, yet we pay the highest price. A price we cannot afford, yet we are forced to pay. Where is the justice in that?"Read more about Cynthia's fight for climate justice. Hilda Flavia Nakabuye, Uganda "Coming from my country Uganda, climate activism is not a choice, it’s a daily struggle."Read why Hilda says polluters must pay Marinel Ubaldo, The Philippines "I simply cannot accept that our people in the Philippines are dying because of a phenomenon – the climate crisis – that we haven’t even caused."Fighting for climate justice in the aftermath of Typhoon Haiyan Pavel Martiarena, Peru "What moves me to be here is hope, but I am also aware that we cannot live only on emotions and hopes."Read how Pavel is holding polluters to account in the Amazon region Activists previously involved with the campaign Lavetanalagi Seru, Fiji "I come from a community and a country that is at the frontlines of the climate crisis, and I’ve seen first-hand the disproportionate impacts of the climate crisis on our people and our natural ecosystem."Read more about Lavetanalagi's fight for climate justice Discover More Join the fight for climate justice Join communities around the world calling for climate justice. What are the solutions to climate change? How can we help climate change stop hitting those who have done the least to cause it first and worst? And what can we do to stop climate change? As extreme weather grips the globe the government must hold big polluters to account With extreme weather on the rise due to climate change, governments must tax the biggest polluters and make them pay for the damage caused. Also in this section Take action: demand polluters must pay Find out about climate action What is COP29 and why it is important?'''
