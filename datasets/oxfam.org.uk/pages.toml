["https://oxfam.org.uk/donate/leave-gift-your-will/free-will-writing-service"]
title = """
Free will writing service | Charity will writing    | Oxfam GB"""
description = "Use Oxfam's free Will writing service to write or amend a simple Will free of charge."
full_description = "Neil and Dorothy Cameron, (age 70’s) at their home in Edinburgh. Photo: Abbie Trayler-Smith/Oxfam Toggle quote I used the Oxfam Will service…they did the job in minimum time.” Neil Cameron Free Will writing services Home Donate now Leave a gift in your will to Oxfam Oxfam has partnered with trusted providers to offer you a free Will writing service. How would you like to write your will? Whilst there is no obligation to include Oxfam in your Will, a small gift would help cover our costs and help us with our fight to end poverty. Request a phone call Our partner, the Co-Op Legal Services will be in touch during the next three weeks to arrange your call. Request call Talk to a solicitor We’ll send you a pack in the post which contains a list of trusted participating solicitors in your area. Order your pack Arrange a home visit Our partners, The Goodwill Partnership, will be in touch in the next three weeks to arrange an appointment. Book appointment Online Make your Will online in under 30 minutes with our partner Farewill. Start your online will now What is the free Will writing service? Oxfam’s free Will writing service is an exclusive opportunity to write or update your standard single or mirror Will for free. We partner with best-in-class Will-writing providers to give expert advice, making sure your final wishes and your loved ones are well looked after. Free Will Offer FAQ How to use the free Will writing service? Online Arrow icon Make your free Will online in under 30 minutes with our trusted partner Farewill. Over the phone Arrow icon Simply request a call back from our partner. They’ll call you within three weeks to arrange a phone appointment. This service is only available in England and Wales.If you live in England, Wales or Scotland, you can also request a call back from Farewill. Your local solicitor Arrow icon Write or update your Will with one of our partnered solicitors. We can send you a pack with a list of participating firms in your area. At your home Arrow icon Make or amend your Will at home, during the week or at the weekend with one of our partners. They’ll be able to discuss your free Will in person at a time that suits you both. This service is also only available in England and Wales. Who can use the free Will writing service? The free Will writing service is available to supporters aged 18 and over, living permanently in the UK. Please note, the at home service is only available in England and Wales and the solicitor service is available in England, Wales and Scotland. If you live in Northern Ireland, you can access Oxfam Ireland’s free Will writing service. Nessy’s Oxfam Legacy When Nessy’s mum left a gift in her Will to Oxfam it was no surprise to Nessy. She didn’t even query that it was the right choice. Her mother stayed true to her principles and for their family it was a powerful celebration of her life. Do I have to leave a gift to Oxfam? We can offer our free Will writing service because Oxfam takes on the cost and although 65% of people choose to leave a gift to Oxfam, this is not a requirement. Find out why other supporters, like Neil, have chosen to include Oxfam in their Will. How does the free Will writing service work The free Will writing service is different for each of our four options. For more information on your chosen route, download our free Gifts in Wills guide. Ready to take the next step? Oxfam has partnered with trusted providers to offer you a free Will writing service. Start your free Will Want to talk to us before you start? Please get in touch with our friendly Gifts in Wills Advisors. Simply call 0300 200 1331 to speak to a member of the Supporter Relations team, or email giftsinwills@oxfam.org.uk Free Will Offer FAQs How does the free Will writing service work? Arrow icon The process is simple:You choose one of the four services we offer:- At home appointment- Over the phone- With a local participating solicitorOnline2. Start your free Will - select your chosen option and provide your contact details.3. A representative of our Will writing partner will get in touch with you and assist you in creating your Will within the next three weeks.If you chose the online option, you'll be immediately taken to Farewill's website to begin your free Will4. If you choose the solicitor route, we will send you a personalised list of local participating solicitors for you to contact. Details of how you can take advantage of our free service with them will be included.For more information on your chosen route, download our free Gifts in Wills guide. Does the service differ in different parts of the UK? Arrow icon Yes, it does. If you live in England and Wales, all four services are available to you.If you live in Scotland, the only available services are the local solicitor option and over the phone via Farewill. If you’re not using our Free Will service and want to leave a gift to Oxfam, we recommend consulting a solicitor in Scotland to ensure your Will complies with the Scottish legal system.If you live in Northern Ireland, you can access Oxfam Ireland’s free Will writing service. How easy is it? Arrow icon Once you’ve made key decisions about where you want your money and belongings to go, our Will writing service is surprisingly easy.For help getting your affairs in order download our free Will Planner.To find out the step-by-step process of our Free Will service download our free Gifts in Wills Guide or request a postal version. Tackling climate change Read Jessy's story Meet our supporters The people leaving Oxfam a gift in their Will and why In memory donations Find out more I used the Oxfam Will service…they did the job in minimum time.” Neil Cameron"
year_published = 2025
clearnet = "https://oxfam.org.uk/donate/leave-gift-your-will/free-will-writing-service"
