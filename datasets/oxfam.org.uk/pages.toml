full_description = "Yeasmin Akter (left) is learning to make dresses and hopes to continue her tailoring work from her home in the camp in Bangladesh. Image: Fabeha Monir/Oxfam The impact of our work Every day, Oxfam is helping thousands of communities around the world work their own way out of poverty. Impact stories We won't live with poverty Oxfam in action We are a global movement of millions of people working together to end poverty. Inequality Inequality is rising everywhere, fuelling poverty. We believe in a fairer world. We know you do too. Climate change Facts about droughts: The people who have done the least to cause the climate crisis are suffering the most. Communities are calling for system change not climate change. Equality for women The potential for lasting change lies in the hands of millions of women currently living in poverty. Emergencies When disasters strike, Oxfam gets there fast, making sure people can keep themselves and their families safe. The impact of our work Hear from the people who we are working with to end poverty. Transforming attitudes I'm Shylet in Zimbabwe Women's rights Read my story Gay Alliance Ukraine: community strength and togetherness I'm Anna Leonova, Executive Director of Gay Alliance Ukraine in Ukraine Emergency response Read my story Lasting change starts small I'm Magdelene Bagura, Female Pastors Network (FEMINET) founder, nurse and midwife in Sierra Leone Food Women's rights Climate change Read my story Previous Next More impact stories Oxfam in 2023/24 9.25M People reached through our humanitarian work. 475 Partner organisations worked with. 54% Of the people we worked with were women and girls. Safeguarding in action From constantly improving safeguarding policies, to installing solar lights that make refugee camps more secure, keeping people safe is a vital part of our work worldwide. Keeping people safe"
