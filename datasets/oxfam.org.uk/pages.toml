description = "We work hard to ensure that not a penny is wasted in our fight to end poverty and injustice."
full_description = '''Also in this section Play the Oxfam Lottery Donate items to your local Oxfam Donate to an emergency Leave a gift in your will Pay in your fundraising More ways to donate Donate your Zakat to Oxfam Farmers in the Philippines transplant seedlings into small paper cups with cocopeat. The vegetable nursery is part of Oxfam and Rice Watch Action Network's assistance for their Typhoon Rolly (Goni) Recovery Program. Image: Juanito Bantong/Oxfam How we spend your money Home Donate now When it comes to running a huge world-changing operation, we make every penny count. Oxfam spends all of its money directly or indirectly fighting the injustice of poverty.On average, for every £1 Oxfam spends, 80p goes on our emergency, development and campaigning work, 10p is spent on running costs, and 10p is invested to generate future income.Of the 80p spent on emergency, development and campaigning work, the breakdown is as follows:39p went towards humanitarian emergencies, 39p on longer-term development projects and 2p on campaigning and advocacy work. These figures are based on Oxfam GB’s 2023/24 Annual Report, and do not include our retail operations. How every £1 we spend breaks down Oxfam's life-changing work would not be possible without generous people like you. We appreciate every single gift we receive and we work hard to ensure that not a penny is wasted in our fight to end poverty and injustice. "My name is Pascaline, I am a public health promoter. These new hand washing kits waste less water. The kit also allows two people to wash their hands simultaneously without queuing at the handwashing station." Image: Arlette Bashizi/Oxfam 39p emergency response Your donations help provide life-saving humanitarian assistance and support people to rebuild their lives with strength and fairness in some of the toughest and most fragile places on earth. "It does not feel unmanly if I share housework with my wife. We are still equal. We need to work together and understand each other, and not to be apart until we grow old. Our love will still be the same," says Johnny. Image: Princess Taroza/Oxfam 39p development work Your donations support our work beating poverty in 81 countries, where we work as part of a confederation, in partnership with communities. We support them with the resources they need to thrive, not just survive. The Global Day Of Action saw many thousands of people marching for climate justice in cities and towns across the world. Image: Andy Aitchison/Oxfam 2p campaigning for change Your donations mean that we can challenge the underlying causes of poverty and stand together with people around the world, who are driving their own change, to speak out against the injustices that cause poverty. The first to cross the Trailwalker finish line in 2021 were the red team of The Queens Gurkha Signals, who finished in 10 hours and 19 minutes! Image: Nina Van Ginnekan/Oxfam 10p fundraising costs 10p is invested to generate future income. For every £1 that we spend on fundraising, we aim to raise £5. Volunteers like Rejuana Begum, who live in the camps, play a key role in Oxfam's programs in the Cox's Bazar camp in Bangladesh. Image: Fabeha Monir/Oxfam 10p support and running costs Just 10p in every £1 you spend is used to keep Oxfam alive, paying our staff and our running costs. Discover More Impact stories First hand accounts from the people we work with about the impact of Oxfam's support. Donate to Oxfam GB Make a charity donation to Oxfam. Donate online, by phone or PayPal. Give a one-off donation or set up a monthly donation. Save lives, donate now. Annual Report and accounts 2023-24 Last year, Oxfam and partners supported 10.99 million people to fight poverty and build a radically better world. Farmers in the Philippines transplant seedlings into small paper cups with cocopeat. The vegetable nursery is part of Oxfam and Rice Watch Action Network's assistance for their Typhoon Rolly (Goni) Recovery Program. Image: Juanito Bantong/Oxfam Also in this section Play the Oxfam Lottery Donate items to your local Oxfam Donate to an emergency Leave a gift in your will Pay in your fundraising More ways to donate Donate your Zakat to Oxfam'''
