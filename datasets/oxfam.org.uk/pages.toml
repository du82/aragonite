title = """
Give to Charity Monthly | Charity Direct Debit    | Oxfam GB"""
description = "By donating to Oxfam on a monthly basis, you are supporting our ongoing work and allowing us to plan for the future. Together we can beat poverty for good."
full_description = '''{"event": "detail_view", "ecommerce": {"detail": {"actionField": {"list": "donation"}, "products": [{"id": "Donate monthly (Recurring Donation)", "name": "donation", "category": "regular donation - monthly"}]}}, "formID": "donationcampaignpage-1106", "formName": "", "CRMEventCode": ""} window.dataLayer = window.dataLayer || []; const pushDataElement = document.querySelector('#js-analytics-data'); if (pushDataElement) { const pushData = JSON.parse(pushDataElement.textContent); window.dataLayer.push(pushData); } Help people rebuild Donate monthly Home Donate now Your monthly donation will: Help us respond quickly to emergencies around the world We help people caught up in disasters by supporting in the immediate aftermath, and being there whilst people rebuild over the long term. Help people to work themselves out of poverty Supporting local small businesses means people can earn an income, live sustainably, and provide for their families and communities. Campaign to change the things that keep people poor Whether it’s demanding governments fight climate change, providing water for all or equality for women, Oxfam campaigns to end poverty, whatever the cause. Why donate monthly to Oxfam Real and lasting change only happens over time. As a dedicated Oxfam supporter, every month, you'll not only help support more people, you’ll also be tackling the systems that trap people in poverty. Giving regularly to Oxfam also means we know what donations to expect over the months and years to come, so we can plan further into the future.This makes our work more effective. It helps us move closer to a fairer, more equal world for everyone. How to donate to charity monthly Direct debit, PayPal or Apple PayYou can set up a monthly direct debit to Oxfam by selecting an amount to give each month at the top of this page. Alternatively, you can donate by PayPal or Apple Pay.Call OxfamYou can donate by phone by contacting our Supporter Relations team on 0300 200 1300. And you can cancel at any time. Climate activist and youth leader Elizabeth holds a sapling. Credit: Armstrong Too Who your monthly donation could help £6 each month could help get food to a family of six for a year buying nutritious food like eggs, fish, aubergines, onions, garlic, chili and spinach.£9 a month could provide clean, safe water to a family of six, all year round, in DR Congo, where conflict has forced millions of people to leave their homes Discover more More ways to donate Giving a donation online is just one of the ways you can support Oxfam. Leave a gift in your Will Learn how to leave a gift in your will to Oxfam – and how you can do it for free. Donate shares By giving shares to Oxfam you are you are joining people all over the world who are working to bring lasting solutions to poverty and suffering.'''
