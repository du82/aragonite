["https://oxfam.org.uk/donate/donate-to-our-shops/donate-clothes"]
title = """
Donate Clothes to Charity | Where to Donate Clothes    | Oxfam GB"""
description = "Not sure where to donate your clothing? There are several ways to donate items to Oxfam, find out the best option for you."
full_description = "Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability 'Pre-loved Gifts' on display at Oxfam Superstore in Cowley, Oxford. Credit: Andy Doherty / Oxfam. Donate clothes by post for free Get an Oxfam donation bag to fill with clothes you want to donate Donating clothes Home Donate now Donate to our charity shops Ready to raid your wardrobe? Not sure how to donate your clothes? You're in luck! There are several ways to donate clothes to Oxfam… Donate clothes to charity at your local Oxfam shop Our high street charity shops are a great place to donate clean clothes and accessories in good condition. We can sell clothes donations and other donated items in our shops or online to generate money to help fight poverty. Find your local shop Shop front and window display at the London Road shop in Brighton. Credit: Gabi Torres / Oxfam Donate clothes to charity by post If you can't easily travel to your nearest Oxfam shop, you can donate your clothes by using our donation bags to donate clothes by post for free.Reuse one of your own bags and print off a postage label, or order one of our recycled donation bags online.Pack up your clothes.Add your Gift Aid number.Drop them off at your local DPD drop off point.You can include any of the items that Oxfam accepts with your donation.Simply order a postbag, fill it with any items you’d love to give a new lease of life, print off a label or get a digital barcode and send it back via DPD for free! Your donated items will be listed on the Oxfam Online Shop.Clothing donated to us by post will be sold mostly on Oxfam's Online Shop or at pop-up shops at festivals.Maximise the money we can raise on your designer and vintage clothing, as well as high street brands by donating by post. Donate clothes to clothes banks or textile banks You can also donate clothes and accessories to charity via one of our clothing banks. Find an Oxfam clothing bank near you. Which types of clothes can I donate to charity? Good condition, clean clothing - including children's clothing, vintage clothes, and out of season itemsShoes in pairs of all stylesAccessories, including bags, non-prescription sunglasses, belts, hats, scarves and glovesJewellery, including watchesHand made clothing What types of clothes are not accepted? We cannot accept identifiable work uniforms. These cannot be resold. We ask that you wash clothes, unless they're brand new. Can Oxfam bookshops accept clothes donations? Oxfam bookshops cannot accept donations of clothing and accessories. If your only local Oxfam shop is a bookshop, consider donating your clothing by post or find your nearest standard Oxfam shop. Ana, Shop Volunteer at our Islington shop, fills in a Gift Aid label. Credit: Emily Stein/Oxfam. Adding Gift Aid to your donated clothing and accessories Poverty is everywhere, and it affects us all. When we all work together – communities, partners, and supporters like you – we can fight and end poverty. By signing up for Gift Aid, you supercharge the impact of your donated items and become a vital part of Oxfam’s mission to end poverty and inequality worldwide. It’s simple, it’s powerful, and it boosts the value of your preloved items by 25% – at zero cost to you. Clothes recycling Together with our partners and our dedicated team in Batley, we carefully sort clothing to unlock maximum revenue from textiles that can’t be resold in our shops, while minimising landfill waste.Every item has potential to fuel our fight against poverty—whether it’s sold on Oxfam’s Online Shop, at our vibrant Festival Shops, or passed on to fashion designers who reimagine garments and give fabrics new life.Our external recycling partners collect clothes and from most Oxfam shops across the country. They sort the clothing before selling it. This helps ensure that all items are of saleable quality and are categorised to make sure they are appropriate in local markets.Even damaged or low-grade pieces find purpose, heading to recycling traders to become car soundproofing, mattress filling, and more. Andrew volunteers in the Earlsfield shop. Credit: Gabi Torres/Oxfam. Donate your Wedding Dress Oxfam has eight shops with bridal departments stocked with good quality fashionable bridal wear and accessories, new and pre-loved. Find your nearest bridal shop to donate your pre-loved bridal and occasion wear. 'Buying Second hand Clothes from Oxfam Cleared out your pre-loved clothes? If you’re looking for something new, we have a huge range of clothes and accessories for sale in our shops, and online. Buying clothes second hand is a great, sustainable way to shop that has less impact on the environment while encouraging you to be mindful about the the clothes you wear. Discover more about sustainable shopping, including our top tips, by visiting our blogOur charity shops and online shop are of full of unique second hand items that you won’t find on the high street, and by choosing to buy second hand, you’ll be saving money too! Discover More Donate items by post for free! Donating Toys and Games Find out how and where to donate children's toys, games and puzzles to charity. Donate new or used toys to Oxfam at your local Oxfam shop or by post. Donating books Donating books to Oxfam helps fund our vital work fighting poverty worldwide. Find out where to donate, what kinds of books you can donate, and what happens to your donations. Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability"
