["https://oxfam.org.uk/about-us/oxfams-ceo-directors-and-trustees"]
title = """
Oxfam's CEO, Directors and Trustees    | Oxfam GB"""
description = "The day-to-day operation of Oxfam is overseen by a corporate Leadership Team comprised of the Chief Executive and seven divisional directors."
full_description = "Also in this section How we work Oxfam's CEO, Directors and Trustees Plans, reports and policies Working at Oxfam Keeping people safe History of Oxfam Frequently asked questions Where we work Oxfam: the story so far Tackling abuse: Information and updates The Inclusive Language Guide: When we include everyone we can overcome poverty Oxfam Scotland Oxfam's CEO, Leadership and Trustees Home About us The Chief Executive Officer is responsible to Trustees for the management of Oxfam, and is supported by other members of the Strategic Leadership Team and other key roles. Oxfam's Leadership Team Halima Begum, CEO Arrow icon Halima is CEO of Oxfam GB. Much of her career has been spent working in international development with DFID (now the Foreign Commonwealth and Development Office), the British Council and LEGO Foundation, with extended overseas postings to countries including China, Nepal, Indonesia and Pakistan. Prior to joining Oxfam, she was CEO of ActionAid UK.Halima has headed major civil society, research and policy programmes in various fields, among them education, gender equality, poverty reduction, human rights, food insecurity, public health and post-conflict reconstruction, and is a well-known thought leader on civil rights and equalities.She serves on the board of Demos, and is a member of both ITV and Burberry’s Cultural Advisory Councils. Halima is also a recent serving member of the board of the National Council for Civil Liberties (Liberty) and the IPPR Commission on Health and Prosperity, as well as an expert advisor to Cambridge University and the Institute for Government's Review of the UK Constitution. Born in Bangladesh and raised in London’s East End, she has been identified as one of the most influential disabled people in the UK, and one of the most influential British South Asians. Alison Court, Chief Transformation Officer Arrow icon Alison has over 15 years of senior executive experience in transformation and technology in a variety of roles spanning commercial, public and not-for profit sectors.Alison’s skills and experience are in designing and delivering complex transformation for organisations. She has held strategic leadership, programme, project and operational roles for the Cabinet Office, Oxford Brookes University and the Open University amongst others.She joined Oxfam GB in 2020, in what was a new role responsible for driving the implementation of our new strategic vision. Later that year her role expanded to incorporate the global operations of Oxfam GB and she was appointed Chief Transformation Officer.Alison is an Independent Governor of De Montfort University. Ed Knox, Chief Operating Officer Arrow icon Ed is a chartered accountant with over 17 years' experience, mainly in financial services operations. He spent 9 years at HSBC where he worked in financial planning and analysis and HR operations before becoming Country Chief Operating Officer for Qatar, Kuwait and then Luxembourg with responsibility for Operations, Technology and Transformation amongst other things. More recently he headed up Domestic & General Insurance's global operations, leading over 3,000 people across 14 markets and supporting more than 9 million customers. Ed spent most of 2024 on parental leave as primary caregiver for his sons Arthur and Oscar.Ed also has over 5 years' experience as a charity board member and trustee, first as the Treasurer on the Board of Trustees of an animal charity in Kent (Foal Farm) and latterly as the Finance Lead on the Board and chair of the Finance Sub Committee for the Providence Row Housing Association, an organisation that offers support services and assists recovery for homeless people, often with complex needs and dependencies.Ed earned a First Class MEng from Nottingham University before becoming a chartered accountant. These foundations in Engineering and Accountancy ensure Ed is analytical, commercial and pragmatic in his approach and have supported a varied career. His formal education and broad corporate experience has been supplemented with development programmes at London Business School, Cambridge Judge Business School and Ashridge Business School Helen Wright, Chief Financial Officer Arrow icon Helen brings a wealth of finance and strategic leadership gained with organisations such as Save the Children and Comic Relief.Helen joined Oxfam as Chief Financial Officer in 2023.She qualified as an accountant at PwC, where she worked with a range of FTSE 100, private equity and owner-manager businesses and charities. In 2011 she moved into the charity sector as Director of Financial Governance at Save the Children International. Roles followed with Comic Relief, where she was Executive Director of Finance & Resources and Be the Business, a start up with a mission to improve UK productivity, where she was Chief Financial Officer.Helen is a trustee of the Outward Bound Trust and a director of Blaze Trails CIC, a Community Interest Company supporting parents to get outdoors. Jan Oldfield, Chief Supporter Officer Arrow icon Jan joined in 2021, bringing leadership experience with organisations such as Greenpeace and Save the Children and a skillset including fundraising, market research and brand development. Joyce Idoniboye, Chief People Officer Arrow icon Joyce is a strategic, dynamic and innovative HR leader and qualified coach, who provides leadership of HR activity, with a strong focus on evolving internal culture. Oxfam’s Board of Trustees Oxfam's trustees are ultimately responsible in law for the charity, its assets and activities.They form the Council of Trustees, which is the governing body of the Association of Oxfam (a not-for-profit limited-liability company). They are appointed because of their commitment to Oxfam and their experience and skills which enable them to undertake the responsibilities of trusteeship of a large and complex charity. Reports on council meetings can be found on the plans, reports and policies pages. Charles Gurassa, Chair Arrow icon Charles Gurassa has been Chair of Oxfam GB since October 2020. He has extensive senior leadership and governance experience, including managing transformative change – and a passion for Oxfam’s values and work.Charles is Chair of the Guardian Media Group, having previously been Chair of Channel 4 until 2022, and has been a Trustee of English Heritage since 2015. From 2005-2014 he served in board-level roles for the National Trust, including as Deputy Chair from 2013-14 and as Chair of National Trust Enterprises (2006-2013). Charles has also supported the Migration Museum in London as Chair since 2021 having been a Trustee since 2014 and chaired Genesis Housing Group, a housing association, from 2010-2017.Other current and recent non-executive positions include:2018 – current: Great Rail Journeys Chair2011– end 2020: EasyJet Deputy Chair2013 – 2019: Merlin Entertainments Group Senior Independent DirectorIn addition to not-for-profit and non-executive experience, Charles brings decades of executive experience, including as former chief executive of both Thomson Travel and TUI Northern Europe. He started his career as a youth worker with Youth Action York before moving into the travel and tourism sector. Charles made the decision in 2003 to step back from full-time executive roles for family reasons and since then has held a diverse range of non-executive positions.Charles lives in London but loves to spend time in Italy. His hobbies include music, theatre, tennis, and football (he’s a Chelsea fan). Annie Hudson, Deputy Chair Arrow icon Annie Hudson joined the Oxfam GB Board in January 2020 and is the lead Trustee for safeguarding. She has a professional background in social work, safeguarding and children’s services. She is Chair of the Child Safeguarding Practice Review Panel (for England). Formerly, she was Director of Children’s Services at Bristol City Council and then at London Borough of Lambeth. She was also previously Chief Executive of The College of Social Work.Earlier in her career Annie worked as a social worker, and as an academic where she researched and published on child protection and young women’s experiences of care. As Bristol's Director of Children's Services, Annie worked with the BBC on the highly acclaimed 'Protecting our Children' TV series. In 2012 she was given a national Social Worker of the Year award for her 'outstanding contribution to social work'.As Oxfam’s lead trustee for safeguarding, she chairs our Safeguarding & Ethics Committee; with many others, she has been seeking to make sure that these issues are fully integral to all aspects of Oxfam's vital and inspirational work across the world. Les Campbell, Treasurer Arrow icon Les is a chartered accountant with 40 years of experience in various finance roles in the private and public sector. He retired in 2017 as finance director in the Department for International Development. Prior to that, he was finance director at the Student Loans Company and before that, finance director at Glasgow Housing Association. His private sector roles were in British Energy, Scottish Power and PwC.He was recently a member of the Board of the International Institute for Environmental Development (IIED), the policy and action research organisation which promotes sustainable development to improve livelihoods and protect the environments on which these livelihoods are built. He has previously had non-executive roles with the Scottish Legal Aid Board, which is responsible for managing legal aid in Scotland, and with Quarriers, Scotland's leading social care charity. He chaired the audit committee in all three of these organisations.In his spare time, Les enjoys cycling and has been spotted in the Alps and the Pyrenees (though finds the hills around Glasgow much easier).Les joined the Council of Oxfam GB as Treasurer-designate in December 2018 and became Treasurer in July 2019. Andrew Hind Arrow icon Andrew has been engaged with charities and wider civil society for over 30 years and has a longstanding commitment to the INGO sector. He is a chartered accountant and was Finance Director and Deputy Chief Executive of ActionAid UK (1986-1991) and Director of Finance and Corporate Services at Barnardo's (1992-1995). He then moved to the BBC as Chief Operating Officer of BBC World Service (1995-2004). He was the first chief executive of the Charity Commission for England & Wales (2004-2010) and then editor of Charity Finance magazine (until 2015). Andrew's extensive non-executive and trustee experience includes serving as a non-executive board member of the Information Commission (2010-2015), the Professional Standards Authority for Health and Social Care (2009-2016) and Chair of the Fundraising Standards Board (2015-2016). He is a former trustee of the Diana, Princess of Wales Memorial Fund, VSO and UNICEF UK, and is author of The Governance and Management of Charities. Andrew received the Outstanding Achievement Award for longstanding commitment and service to the voluntary sector at the Charity Awards 2008.Currently, Andrew is also a Senior Visiting Fellow at Bayes Business School, London, helping to run its postgraduate MSc course in Charity Studies. Andrew is a member of Oxfam GB's Audit and Risk Committee. Dr Balwant Singh Arrow icon Balwant joined Oxfam GB as Trustee in November 2022. He has more than 30 years of experience leading philanthropic, development and humanitarian organisations and initiatives. He has worked in more than 25 countries across Asia, Africa, Europe, North and Central America, and the former Soviet Union, and lived in Singapore, the UK, Vietnam, North Iraq, Russia, Sweden, the US, India, Ireland and Switzerland.His expertise includes leadership and organisational development, strategy, governance, diversity, impact and programmes for health, HIV/AIDS, education, human rights and humanitarian response. Originally trained as a physician, he holds an MBA with top honours and a postgraduate diploma in health services management.Most recently, Balwant was the Executive Director of Sphere which establishes, promotes and reviews humanitarian standards for disasters and crises. Before that he was CEO of Kusuma Trust UK, a philanthropic foundation, for eight years. Earlier roles include Global Director of an innovative maternal and child health initiative across Africa and Asia funded by the Bill & Melinda Gates Foundation, Regional Director for South & Central Asia with Save the Children and Executive Director of Doctors of the World in New York.Balwant continues to advise, facilitate and mentor on leadership, international development, humanitarian programmes, philanthropy, governance and diversity. He is passionate about social justice, volunteers with various organisations and loves cooking, photography and travel. Hellen Grace Akwii-Wangusa Arrow icon Hellen Grace Akwii-Wangusa, a Ugandan, a mother and grandmother of 4. She was born to a teacher who was later ordained into Priesthood, and a Mother who did development work as the Mothers Unions (MU) Worker. Hellen was awarded a University Women’s Scholarship, a Fulbright Scholarship and in 2001, a Commonwealth Research Grant.Hellen’s career path started as a Lecturer at Makerere University in the Department of Literature, as well as working part-time with the Mothers Union (MU), and as a Women’s Provincial worker. After a short training at Manchester University, she was appointed to coordinate the African Women’s Economic Policy Network (AWEPON), which had chapters in 20 African countries. The focus of AWEPON was Economic policy analysis and gender-based research and advocacy. In that position, Hellen trained and secured funding for a minimum of 34 African women annually, to participate in influencing decisions and advocate for pro-poor and gender sensitive economic policies at the United Nations, The World Bank/IMF Spring Meetings and the World Economic and Social Fora.In 2004, she was appointed by UNDP to coordinate Africa Civil Society Organisations implementing Millennium Development Goals (MDGs) programmes in 16 African countries. Next, Hellen served as the Personal Representative of the Archbishop of Canterbury and the Anglican Communion Observer at the United Nations (UN).Hellen serves as the Chair of the Action Aid International Board, as an advisory member of Christian Aid International and the KARIBU Foundation-Norway, she is also a member of the Technical Task Force of the African Union.Hellen holds a BA/DipEduc from Makerere University, an MA in Modern Letters and Women’s Studies from Tulsa University, USA, an Hon. PhD in International Relations and a second Hon. PhD in Civic Law. Kerri O'Neill Arrow icon Kerri is the Chief People Officer at Ipsos UK and Ireland, a global market research and insight agency. She has 20 years of global experience in Human Resources, Corporate Responsibility and Transformational Change in key organisations, previously working at Ofcom"
