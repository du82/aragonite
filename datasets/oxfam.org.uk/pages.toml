["https://oxfam.org.uk/donate/donate-to-our-shops/donate-foreign-currency"]
title = """
Donate Foreign Currency — What To Do With Foreign Coins    | Oxfam GB"""
description = "Wondering what to do with old foreign coins? Oxfam has partnered with Cash4Coins to help use this money for charitable purposes. Find out more."
full_description = "Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability Stefanie Beck/Oxfam Donate foreign currency Home Donate now Donate to our charity shops Ever wondered what to do with old foreign coins? Did you know that your leftover foreign currency and old UK coins and notes are an easy way to raise valuable funds for Oxfam? Where do I exchange old foreign currency? Oxfam is now partnering with Cash4Coins who help charities collect foreign currency and turn them into cash through a buy back scheme.You can drop off your unwanted currency at any Oxfam branch, use Oxfam’s postal service, or send it directly to Cash4Coins via the FREEPOST service. Whichever method you choose, our service provider, Cash4Coins, will collect, sort, and count the donated currency, helping us swiftly turn your contribution into essential revenue for Oxfam's work.Please note that we are unable to acknowledge individual foreign currency donation. All our donated foreign currency is put together and collected in bulk by our service partner. Which foreign coins can I donate to Oxfam shops? You can bring in any currency from any corner of the globe, including notes! Even old UK, Irish and pre-euro European coins. We can take: We can take: All foreign coins & notesAll pre-Euro coins & notesOld British & Irish coinsAll pre-decimal coinsCommemorative coinsDamaged coins Find your local Oxfam shop About Cash4Coins - Foreign Coin & Note Donations We are the UK’s premier foreign coin exchange provider. There is £2.7bn worth of unused foreign currency lying around in the UK and millions of unspent and redundant currencies in circulation. Many individuals find that they cannot exchange foreign coins or notes and old coins.Cash4Coins provides a service that allows for the value of this currency to be used for a charitable purpose in a Simple, Fast & Headache Free - Secure & Regulated way.The process is simple, just drop in your foreign currency at any Oxfam branch, via Oxfam’s postal scheme or send it directly to Cash4Coins via the FREEPOST service and we will help convert your donations into cash raising much needed funds to the vital work Oxfam does. Discover More Shop finder Find your local Oxfam shop. Shop sustainably for new and second-hand products from your favourite brands. Donate items to your local Oxfam Have a clear-out and help beat poverty. We can turn your donations into life-changing cash. Oxfam in action We are a global movement of millions of people working together to end poverty. Hear from the people who we are working with to end poverty. Stefanie Beck/Oxfam Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability"
