["https://oxfam.org.uk/donate/leave-gift-your-will/stay-in-fight"]
title = """
We’re not done yet. Are you?    | Oxfam GB"""
description = "You’ve been fighting for a fairer world all your life. Why stop now? Leave a gift in your Will to Oxfam and stay in the fight."
full_description = "Also in this section Contact us Meet our supporters Oxfam's free Will offer How to leave a gift in your Will Information for Executors In memory donations A gift of support for the next generation Leave a legacy, stay in the fight Gifts in Wills Events Remember a Charity Week Joyce Koech, climate activist in Kenya. Photo: Rogers Ouma Fight for justice with a legacy gift Download Your Free Guide We’re not done yet. Are you? Home Donate now Leave a gift in your will to Oxfam You’ve been fighting for a fairer world all your life. Why stop now?Leave a gift in your Will to Oxfam and stay in the fight. Leave a legacy to Oxfam There are many ways to rally against injustice. We can stand in the street holding placards, sign petitions or share ideas with the people around us. We can volunteer, make regular donations, or pledge gifts in our Wills.Whichever you choose, it’s only by uniting behind a common goal and speaking with one voice that we can make the world a fairer place.If you believe a fairer world is possible, choose to stay in the fight. By leaving a gift in your Will to Oxfam you’ll leave a legacy that keeps on fighting for justice. Every contribution plays an important part in changing the systems that fuel poverty.Your legacy gift will help build much needed support for future generations of change makers like you.And you’ll be by their side – forever. Get your free gifts in Wills guide Download the guide Joyce's story Meet Joyce Koech, the climate activist who features in our film.Joyce is fighting the systems that fuel inequality and poverty in her home, Mombasa, Kenya. All around the world the climate crisis is devastating local communities who have done the least to cause it. In Kenya, climate change is causing increased droughts, flash floods, livestock diseases and armed conflicts, despite only producing 0.1% of global emissions. Joyce is raising her voice and inspiring a new generation of activists. Joyce wants a future that is “free from fossil fuels… a future that is environmentally sustainable for all.” But she knows “we must all work together to preserve [the planet] for ourselves right now and for our future generations.” Read Joyce's blog When you leave a legacy donation to Oxfam in your Will, you’re pledging to stay in the fight against injustice with Joyce – and all of us. Get your Gifts in Wills guide Face injustice head on with Oxfam We’ve been challenging injustice since 1942. Following WWII, we persuaded the UK government to send food parcels to Germany. In 1984, brilliant Oxfam supporters like you raised £12.5 million to combat famine in Ethiopia. More recently, we’ve joined some of the most marginalised people in the world to demand climate justice. We continue to make steady progress on every front.Today we’re still in the fight, rallying with people across the globe to wipe out poverty for good. It’s a goal that can only be achieved by tackling the greatest crisis of our time – climate change. The climate crisis is having the biggest impact on the people who are least responsible for it, yet they’re paying the highest price.Millions of us worldwide are speaking out about this injustice. We’re calling for climate justice, led by those facing the worst of the climate crisis right now.And we can’t do it without you. Leave a legacy gift to Oxfam. Stay in the fight. Get your free gifts in Wills guide Bimala’s innovative garlic farm Meet our supporters The people leaving Oxfam a gift in their Will and why Gifts in Wills How to leave a gift in your Will Also in this section Contact us Meet our supporters Oxfam's free Will offer How to leave a gift in your Will Information for Executors In memory donations A gift of support for the next generation Leave a legacy, stay in the fight Gifts in Wills Events Remember a Charity Week"
