["https://www.oxfam.org.uk/donate/impact-amplified-local-partners-driving-sustainable-change/reducing-climate-related-disaster-risks-in-bangladesh"]
title = """
Reducing climate-related disaster risks in Bangladesh    | Oxfam GB"""
description = "Dulu Begum worked with JAGO NARI to become a community leader and an outspoken advocate for reducing disaster risks."
full_description = "Also in this section Empowering small business owners in Bangladesh Distributing food to displaced families in Gaza Reducing climate-related disaster risks in Bangladesh Dulu in Bangladesh. Photo: Elizabeth Stevens. Reducing climate-related disaster risks in Bangladesh Home Donate now Local Partners Driving Sustainable Change Dulu Begum worked with JAGO NARI to become a community leader and an outspoken advocate for reducing disaster risks. Dulu helped inform her community of the role that women play when it comes to this issue, “Women are vulnerable in disasters, and we understand the needs and priorities of families, so we need to be included in the whole process.” With help from Oxfam partner JAGO NARI, Dulu Begum became a community leader and an outspoken advocate for reducing disaster risks. It used to be that whenever I needed money, I had to ask my husband. Now I don’t have to, and it makes me feel powerful.” Dulu describes how working has offered her financial independence for the first time. Though the community were initially uncertain of her work, they too realised that the climate is changing and these measures need to be taken to keep the people in the community safe.She states, “The high tides are unpredictable, and they wash away our crops. Rains are erratic. It used to be easier to work outside, but now with the heat, it’s much harder. The crops turn red in the scorching sun. Cyclones are more frequent, and when they hit, there’s more damage than before.”This Ramadan, amplify your impact, embody the spirit of collective generosity, and join Oxfam in working hand-in-hand with communities facing poverty. Donate this Ramadan Join us in fostering a future where local communities and partners lead the way. Discover More Zakat: Frequently Asked Questions Find answers to the most popular questions about donating Zakat to Oxfam. Distributing food to displaced families in Gaza As the crisis in Gaza continues to unfold and intensify, Oxfam is working with several local organisations to provide urgent support to displaced families. Oxfam’s Zakat Advisory Panel Oxfam’s Zakat policy is supported by a group of voluntary Islamic advisors. Also in this section Empowering small business owners in Bangladesh Distributing food to displaced families in Gaza Reducing climate-related disaster risks in Bangladesh"
