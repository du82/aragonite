full_description = "More ways to donate Giving a financial donation is just one of the ways you can support Oxfam's vital work. Thoko Chikondi/Oxfam Help the next generation fight for a fairer future Leave a gift in your Will More ways to donate Giving a financial donation is just one of the ways you can support Oxfam's vital work. Donate your Zakat to Oxfam Let’s come together to show the true spirit of generosity. Join Oxfam and our partners in supporting the most vulnerable Muslim-majority communities worldwide. 100% of Zakat donations are spent in selected countries to help those in need. People's Postcode Lottery Sign up today to play with your postcode for the chance to win! Guaranteed winners every day. In memory donations Remembering a loved one with a gift to Oxfam is a wonderful way to celebrate the life of someone special. Donate your time Our volunteers are the heartbeat of Oxfam. View current volunteering opportunities. Donate shares By giving shares to Oxfam you are you are joining people all over the world who are working to bring lasting solutions to poverty and suffering. Leave a gift in your will It’s thanks to gifts in Wills from our supporters that we’ve been here for 75 years, fighting to end poverty and injustice around the world. Charity gifts Send a life-changing gift card or eCard to a loved one and support Oxfam's vital work. Knitting for Oxfam If you're a dab hand with a set of needles, you could create a better future for people in poverty. Donate a car Oxfam offers an easy, hassle-free way to donate your vehicle, which is then quickly turned into much-needed funds for Oxfam Donate your old phones and tablets Wondering what to do with old mobile phones? You can donate or recycle your old phone at any standard Oxfam shop or online via… Payroll giving Payroll giving is a charity scheme that allows anyone in the UK who pays income tax to make regular tax-free donations to Oxfa…"
