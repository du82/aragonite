full_description = "Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability Volunteer Evelyne sorts through a rail of women's clothing at the Oxfam shop in Islington. Credit: Gabi Torres / Oxfam. What you can donate to our charity shops Home Donate now Donate to our charity shops Your unwanted items could give someone the support they need to create a future free from poverty. Find out what we can and can't turn into life-changing cash. Our charity shops in England, Wales and Scotland are now open and donations are welcome. Thank you for choosing to donate your items to Oxfam.As well as dropping items off at your local Oxfam charity shop, you can also donate items by post. What we can sell Good condition, clean clothing - including children's clothing, vintage clothes, and out of season itemsShoes in pairs of all stylesAccessories, including bags, non-prescription sunglasses, belts, hats, scarves and glovesJewellery, including watchesAntique and collectable itemsBooksMusic (CDs, vinyl, musical instruments and sheet music)DVDs and Blu-raysHomewares: china, kitchenware, ornaments, pictures, and more Soft furnishings: small rugs, linen, curtains (must be clean and in good condition) Knitted items and blanketsToys and gamesWedding dresses and accessoriesFurnitureStamps (including used stamps) and foreign coins and notesMobile phonesCamerasEphemeraAny unwanted gifts, including toiletries and beauty items (new and unused)Bedding, if in good conditionTents, if in good condition What items do charity shops not want Electrical goods that run off the mains (a few shops do accept these, so please check before donating)Medical equipmentAnything broken, dirty, incomplete or unsafeSingle computers (but we would be happy to hear from your company if you would like to donate multiple units)White goods (cookers, washing machines etc)Safety headgear (e.g. motorcycle crash helmets)There are some other items that we cannot sell for safety or legal reasons. If in doubt, please ask your local Oxfam shop before donating.Identifiable work uniforms Unsure?Please donate anything else you think will raise money for Oxfam. Be imaginative! But if you're still unsure then please ask your local Oxfam shop. Find your local Oxfam shop Discover More Donate items by post The easy way to donate items for free from home. Pack and send or request a bag for free to help raise money to fight poverty and reduce landfill. Leave a gift in your will It’s thanks to gifts in Wills from our supporters that we’ve been here for 75 years, fighting to end poverty and injustice around the world. Marks and Spencer and Oxfam’s Another Life scheme Another Life. Ordinary clothes made extraordinary. Volunteer Evelyne sorts through a rail of women's clothing at the Oxfam shop in Islington. Credit: Gabi Torres / Oxfam. Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability"
