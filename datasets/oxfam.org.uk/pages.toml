["https://oxfam.org.uk/oxfam-in-action/water-for-all"]
title = """
Water charity | Safe and clean water    | Oxfam GB"""
description = "Millions of people die each year without access to clean water. Charity donations help us to provide water on tap so food can grow, disease can be defeated, and people can thrive."
full_description = '''Image: Arlette Bashizi/Oxfam Safe, clean water saves lives Water for all With water on tap, food can grow and people can thrive. Without it, every day 1,000 children die from diarrhoea. Millions of people die each year, simply for lack of something as simple as clean water or a safe place to store it.But with access to safe water and hygiene facilities, people can protect themselves from deadly diseases. How Oxfam helps provide clean safe water We are providing clean water when disaster strikes Disease follows disasters, often killing more people than the initial emergency. So Oxfam acts quickly with others to provide clean water and sanitation, and help prevent deadly diseases spreading. We are helping millions stay safe and earn a living It’s not just taps, tanks and toilets — though with millions of litres of water pumped each year, they’re something to shout about. It’s also sharing advice in schools on how to keep clean and stay safe. Installing irrigation systems to kickstart farming, fight famine and help people earn a living. We are campaigning for access to safe water and toilets Too often, people have no choice but to drink dirty, unsafe water, and to use toilets, taps and containers that spread disease. That's why we campaign for everyone to be able to access the water we all need. The impact of our work "We know how to wash our hands, how to be safe." I'm Nur in Bangladesh Water Emergency response Health Read my story Handwashing works I'm Dr. Tolani in the United Kingdom Health Water Emergency response Read my story Transforming attitudes I'm Shylet in Zimbabwe Women's rights Read my story Previous Next More stories Mum's Magic Hands A joint initiative developed by Oxfam and Unilever using emotional nudges to encourage better handwashing practices. Visit Mum's Magic Hands Water: the bigger picture 2.2 billion 2.2 billion people do not have access to clean water at home. 800 children Every day, more than 800 children under 5 die from diarrhoea caused by dirty water. 2.3 billion 2.3 billion people lack access to basic facilities like toilets. Getting safe clean water flowing worldwide 1976 The famous Oxfam Water Tank, first deployed more than 40 years ago, is now used all over the world. 1985 Oxfam worked with Surrey University to produce the Delagua water testing kit. 1994 Oxfam provided safe drinking water for hundreds of thousands of people fleeing the Rwanda genocide. 2009 Zimbabwe: thousands of jerry cans sourced. Countless lives saved. 2010 After the earthquake in Haiti, we delivered over 300m litres of clean water to people every month 2013 These worms save lives. Oxfam's Tiger Worm Toilets turn waste into fertiliser. 2019 Our frontline staff are helping thousands of Rohingya refugees fight Coronavirus. 2020 Water for 100,000 people in Central African Republic Previous Next Close The famous Oxfam Water Tank, first deployed more than 40 years ago, is now used all over the world. Oxfam’s technical team use water tanks used by British farmers for water storage in emergencies. The first ones were put into use in 1976. Today, more than 40 years after they were invented, humanitarian agencies around the world use the Oxfam water tank. Oxfam worked with Surrey University to produce the Delagua water testing kit. In emergencies, the water we source needs to be tested before it can be used. This kit has been designed to enable local communities to check whether the water is contaminated, and make sure the chlorine level is safe for drinking. Oxfam provided safe drinking water for hundreds of thousands of people fleeing the Rwanda genocide. Between 1994 and 1996, in the largest operation in our history, Oxfam provided safe drinking water for hundreds of thousands of refugees in Tanzania and Zaire (now the Democratic Republic of the Congo) within days of their arrival - and until they went home over a year later. Zimbabwe: thousands of jerry cans sourced. Countless lives saved. In Zimbabwe in early 2009, in a country already reeling from food shortages, a cholera outbreak threatened thousands of lives. Our rapid response team got there fast. In the town of Ngoni, we provided families with hygiene kits including 20 litre jerry cans, one kilogram of soap, water purification tablets, cotton wool and pamphlets on how to prevent cholera. Simple, brilliant, life-saving solutions. After the earthquake in Haiti, we delivered over 300m litres of clean water to people every month We worked to ensure that people had access to clean, safe drinking water. In total we provided clean water and sanitation facilities to approximately 400,000 people displaced by the earthquake. These worms save lives. Oxfam's Tiger Worm Toilets turn waste into fertiliser. We first started developing our amazing Tiger Worm toilets in 2013. The worms decompose the waste and turn it into clean, safe fertiliser. Which means better sanitation and fewer health problems for poor communities and refugee camps around the world. It's just one of the ingenious ways Oxfam is helping people escape poverty, for good. Our frontline staff are helping thousands of Rohingya refugees fight Coronavirus. In Cox’s Bazaar, Bangladesh, where Rohingya people are living in extremely overcrowded conditions, we stepped up our work on hygiene promotion, soap distribution and sanitation facilities to help 70,000 refugees. Water for 100,000 people in Central African Republic To help stop the spread of the coronavirus, our teams on the field are installing 20 temporary emergency water points in the Central African capital, which will be gradually replaced by 10 permanent boreholes, so that nearly 100,000 people will have access to clean water. Previous Next Gaza Crisis Appeal Please donate to help us do everything possible to get aid to those who need it. What can you do to help? Donate to Oxfam GB Support our work Volunteer with us Volunteer Fundraise with us Raise money In my village, I made a living from farming, but here at the site, it is not possible. At least now we have water at different taps.” Nombe Bimiloko Nyota, farmer, in Democratic Republic of Congo. Donate now'''
year_published = 1994
clearnet = "https://oxfam.org.uk/oxfam-in-action/water-for-all"
