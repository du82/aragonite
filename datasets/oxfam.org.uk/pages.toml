["https://oxfam.org.uk/donate/donate-to-our-shops/donating-books"]
title = """
Donating books to charity | Where to donate books    | Oxfam GB"""
description = "Find out how to donate your used books to charity. Donate books to Oxfam at your local Oxfam shop. We love second hand books."
full_description = "Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability Volunteer Catherine sorting books at the Herne Hill Oxfam Bookshop. Credit: Emily Stein/Oxfam. Find an Oxfam shop near you Give your books a second life! Donate them to your local Oxfam shop. Donating books Home Donate now Donate to our charity shops Donating books to Oxfam helps fund our vital work fighting poverty worldwide. Find out where to donate, what kinds of books you can donate, and what happens to your donations. Where to donate books — donate to our shops Running out of shelf space or downsizing your book collection? Give your books a second life! Donate them to your local Oxfam shop.If you're unsure where to donate books, you can search for Oxfam charity shops that accept books near you with our shop finder. Find your local Oxfam shop Which Oxfam charity shops accept book donations? Most of Oxfam’s +500 high street shops accept book, but there may be times in the year when we are at capacity for accepting donations. Please use the find an Oxfam Shop near you tab to contact your nearest shop to check.If you are a UK taxpayer, you can help Oxfam make the most of your donated books for charity causes worldwide by signing up for Gift Aid. You can sign up online, or in person when you donate. This helps Oxfam raise an extra 25% on the value of your donation by reclaiming government basic rate tax.Supercharge the impact of your donated items by 25% when you sign up for Gift Aid. It costs you nothing, yet further shifts power to communities as they lead positive change. By signing up for Gift Aid, you’re contributing to a kinder and fairer world – a world less divided by borders, money, race or gender.You might not know that Oxfam is the biggest chain of second hand bookshops in Europe. So you know you're giving your donated books the best chance of finding a new home. Volunteer Kathryn prices up books in the stockroom at Oxfam's Islington Bookshop. Photo: Emily Stein/Oxfam. Volunteer Kathryn prices up books in the stockroom at the Oxfam Bookshop in Islington. Donate books by post Use our donation bags to donate books by post for free. Just follow these steps:You can reuse one of your own bags and generate a postage label, or order one of our recycled donation bags online.Pack your books.Add your Gift Aid number.Then drop them off at your local DPD drop off point.You can include any of the items that Oxfam accepts with your books for donation. Can I donate rare books? We always welcome donations of rare, antiquarian and valuable books. Our network of experienced volunteers and shop managers carefully research items of potential high value.We aim to make the most of all our donations, to get the best possible prices for valuable books, whether in our shops, on our website or through specialist auctions. Our specialist bookshops We have over 120 dedicated Books and Music high street shops in the UK.These only stock only books and music in the form of CDs, vinyl, cassettes, DVDs, Blu-rays. As well as musical instruments and sheet music.They're sorted and organised by our fantastic volunteers. So it's easy to find what you're looking for.If there isn't a dedicated Oxfam Books and Music shop in your town, then your local Oxfam shop will have a books section. Alongside clothing, accessories and homewares. Photo: Emily Stein/Oxfam. Islington Oxfam Bookshop volunteers Hardev and Kathryn. Our online book shop If you’re clearing out some space and want to refresh your book collection, you can find a huge range of books on our online shop.We have over 100,000 books in stock at any one time. From bargains under £5, to recent bestsellers, to rare and antique collectables.Books are listed online if they're unusual rare or collectors items. They may also be books that haven't sold in stores immediately, but are too valuable to recycle. Books and music on our online shop. Categories include children's books, crime fiction, and romance, as well as non-fiction like biographies, art and photography, and food and drink.Each category can be filtered into narrower subcategories. So you can browse to find exactly what you're looking for.You can also search for your favourite titles and authors.We never know what we'll receive in donations, so check back regularly to snap up bargains and hidden gems! Become a books volunteer for Oxfam Oxfam book donations are sorted and prepared for sale by our fantastic team of volunteers.We’re always keen to welcome new volunteers to help fund Oxfam’s vital work fighting poverty, whatever your reasons for volunteering.Maybe you have expert knowledge of books or are keen to learn more. Maybe you'd like to meet new people. Or to find new favourite reads.How much time you volunteer, and what you do is completely up to you. Book and Music Shop Volunteer If you’re thinking of volunteering, definitely do it! There’s more than one role in the shop that you can do, so there is something for everyone.” Alice, Till, Book sorting and Antiquarian book Volunteer at Oxfam Bookshop Bath Volunteer Linda behind the till at the Oxfam Bookshop, Islington. Photo: Emily Stein/Oxfam. Find out more about what our book shop volunteers had to say about their experiences Discover More What we can sell in our shops Your unwanted items could give someone a future free from poverty. Find out what we can and can't turn into life-changing cash. Donating Toys and Games Find out how and where to donate children's toys, games and puzzles to charity. Donate new or used toys to Oxfam at your local Oxfam shop or by post. Donate clothes Not sure where to donate your clothing? There are several ways to donate items to Oxfam, find out the best option for you. Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability"
