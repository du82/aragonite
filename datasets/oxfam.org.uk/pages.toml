["https://oxfam.org.uk/oxfam-in-action/current-emergencies/east-africa-food-crisis-appeal"]
title = """
East Africa Hunger Crisis | Donate to Africa    | Oxfam GB"""
description = "Millions of people in the East Africa countries South Sudan, Ethiopia, Somalia and Kenya are on the brink of famine. This tragedy can be averted if we act now. Donate today."
full_description = '''{"event": "detail_view", "ecommerce": {"detail": {"actionField": {"list": "donation"}, "products": [{"id": "East Africa Hunger Crisis (Single Donation)", "name": "donation", "category": "one-off donation"}]}}, "formID": "emergencyappealpage-290", "formName": "East Africa Appeal", "CRMEventCode": ""} window.dataLayer = window.dataLayer || []; const pushDataElement = document.querySelector('#js-analytics-data'); if (pushDataElement) { const pushData = JSON.parse(pushDataElement.textContent); window.dataLayer.push(pushData); } The worst hunger crisis in living memory East Africa Hunger Crisis Home Oxfam in action Emergencies More than 28 million people across Ethiopia, Somalia, South Sudan and Kenya are facing extreme hunger due to factors beyond their control – the climate crisis, conflict and the crippling cost of living. Loliwe Phiri/Oxfam We have experienced drought for over seven years. We've been surviving in this harsh environment with no water.” Seinab, Isiolo County, Kenya The crisis is getting worse World leaders have failed to do enough. Now countries are at severe risk of famine. People are losing their livelihoods, homes and family members to hunger.Women and girls are among the worst affected. We hear stories of mothers missing meals so their children can eat. Girls will sacrifice their education to look after family whilst their parents are forced to search for food. This F word is more than offensive. It's an injustice. Watch. Share. Show solidarity with people across East Africa. Share this video Support communities in East Africa Partner organisations and communities are leading the response across East Africa. By donating today you’re helping to make work like this possible:WASDA is offering people in Wajir County, Kenya, money digitally transferred to their mobile phones, so they can buy what they need.Somali Resilience Programme is offering training to help farmers adapt to a changing climate.ORDA Ethiopia is working in areas where people are displaced to provide clean water, showers, toilets, hygiene kits and money for essentials. Billy Owiti/Oxfam I have been receiving the cash for a while now… With the cash, I am able to buy groceries and feed my children.” Ebla, part of the WASDA cash scheme in Wajir, Kenya Many of our partners are small grassroots organisations. Please donate now to help them support people facing extreme hunger in their local communities. What’s the bigger picture? 90 % 90% of Somalia is in severe drought. More than 670,000 people have been forced to leave their homes in search of food and water. 31 m 31 million people in Kenya are experiencing extreme hunger and need humanitarian help. 9.4 m 9.4 million people in Ethiopia need urgent humanitarian support due to impacts of extreme drought and conflict. How we spend your donation For every £1 you donate to this emergency appeal, we will allocate 9p of your donation to cover general support and running costs. There is a small chance that we will raise more money than is needed for this appeal. If this happens, we’ll spend any additional funds on other Oxfam projects – wherever the need is greatest. Discover more About the East Africa Hunger Crisis As many as 28 million people across East Africa are at risk of extreme hunger. The crisis is of a scale not seen in the region since 2017. Emergencies When disasters strike, Oxfam gets there fast, making sure people can keep themselves and their families safe. How people can have food security Magda explains how Oxfam's partners in Indonesia are tackling the effects of climate change.'''
