full_description = '''Also in this section People's Postcode Lottery Charity gifts Donate your time Donate shares Knitting for Oxfam Donate a car Donate your old phones and tablets Payroll giving Knitting for Oxfam Home Donate now More ways to donate If you're a dab hand with a set of needles, you could create a better future for people in poverty. ClothesJumpers, cardigans and scarves can all be sold in our high street shops. Your local shop manager will be able to tell you what they can sell and roughly how much money they'll be able to make. Find your local Oxfam shopBlankets6ft by 4ft Oxfam blankets go down a storm at music festivals, selling for anything up to £35. That's enough to provide clean water for 60 people in an emergency.BuntingThis festival season we're hoping to use and sell bunting made from recycled fabrics in the Oxfam Festival Shop. If you're handy with a sewing machine, why not run up some triangles of interesting fabrics on some lengths of ribbon or cord? We'd love any lengths, any style and any colour of homemade bunting but particularly those made from old textiles.If you've knitted for us in the past, thank you. Every stitch and every turn means a better future for poor communities.Download a pattern:Hat with earflaps (PDF, 67KB)Peaked hat (PDF, 82KB)Corsage (PDF, 56KB)Hand warmers and hat (PDF, 58KB)Kim Hargreaves "Matey" hat (PDF 81KB)Kim Hargreaves "Pascale" hat (PDF 102KB)Roan hats and scarf (PDF 1.2MB)If you wish to donate items that you have knitted, you can give them to your local shop. Discover More Donate items to your local Oxfam Have a clear-out and help beat poverty. We can turn your donations into life-changing cash. More ways to donate Giving a donation online is just one of the ways you can support Oxfam. Impact stories First hand accounts from the people we work with about the impact of Oxfam's support. Also in this section People's Postcode Lottery Charity gifts Donate your time Donate shares Knitting for Oxfam Donate a car Donate your old phones and tablets Payroll giving'''
