full_description = "Also in this section People's Postcode Lottery Charity gifts Donate your time Donate shares Knitting for Oxfam Donate a car Donate your old phones and tablets Payroll giving People's Postcode Lottery Home Donate now More ways to donate The players of People’s Postcode Lottery have been supporting Oxfam GB since 2011, raising an incredible £18.7 million for us so far.Together, we’re supporting our partners leading change in some of the toughest and most fragile places on earth – responding to emergencies, rebuilding peace, tackling climate change, and defending women’s rights. Nombe about to draw water from a tap supplied with water by a system set up by Oxfam. Image: Arlette Bashizi/Oxfam Join today Postcodes against poverty Thanks to the support of players of People’s Postcode Lottery, alongside our partners, we were able to supply handwashing stations and clean water to communities we work with across nine countries – protecting people against COVID-19 and diarrheal diseases like cholera and helping keep them well.Thanks to players, we have provided vital aid to more than 2 million people affected by the Ukraine crisis, through a humanitarian response led by 40 community organisations across Ukraine, Poland, Romania and Moldova.Together with our Women’s Rights Fund partners, we have supported community-led solutions addressing women’s rights issues, including providing emergency aid, access to healthcare, support to survivors of violence, tackling the gap in mental health support for women and girls, and more. Seeing them [the women] change from having depression, anxiety, PTSD…and moving on to be champions in their own right…for us is a win.” Maureen Amuhinda (Programme Lead), Badili Africa, Kenya. Oxfam believes that poverty is an injustice that can and must be overcome – so everyone has the power to thrive, not just survive. That’s why players’ support is so important. Together, we are working with thousands of communities across the world driving positive change for a kinder and fairer world. Discover More More ways to donate Giving a donation online is just one of the ways you can support Oxfam. Get involved Get involved in any way that suits you. Set change in motion and start transforming lives today. Donate to Oxfam GB Make a charity donation to Oxfam. Donate online, by phone or PayPal. Give a one-off donation or set up a monthly donation. Save lives, donate now. Also in this section People's Postcode Lottery Charity gifts Donate your time Donate shares Knitting for Oxfam Donate a car Donate your old phones and tablets Payroll giving"
