["https://www.oxfam.org.uk/get-involved/campaign-with-oxfam/demand-keir-starmer-reverses-aid-cuts"]
title = """
Demand Keir Starmer reverses aid cuts: write to your MP now    | Oxfam GB"""
description = "Call on your MP to put pressure on the Prime Minister and reverse the harmful and immoral cuts to the UK aid budget."
full_description = '''Oxfam teams navigating flooded areas with supplies in tow to reach those in desperate need in the aftermath of flooding in Bangladesh. Photo: Oxfam. Email your MP Demand Keir Starmer reverses aid cuts The Prime Minister is reducing the international aid budget from 0.5% to 0.3% of our national income by 2027 to increase military spending. The impact on people facing conflict, poverty and disaster will be devastating. Call on your MP to put pressure on the Prime Minister and reverse these harmful and immoral cuts. More about this issue Demand Keir Starmer reverses aid cuts The Prime Minister is reducing the international aid budget from 0.5% to 0.3% of our national income by 2027 to increase military spending. The impact on people facing conflict, poverty and disaster will be devastating. Call on your MP to put pressure on the Prime Minister and reverse these harmful and immoral cuts. More about this issue Prime Minister Keir Starmer has announced plans to drastically cut the international aid budget that tackles poverty and inequality to fund an increase in military spending.There’s no getting away from the devastating impact. More children without teachers. More pregnant women without midwives. More people worldwide facing hunger and poverty.This isn’t the first time the aid budget has been cut by Governments in recent years. It was enshrined in law that the UK would spend 0.7% of Gross National Income (GNI) on international aid. And despite Labour’s election promises to reverse these cuts, they are now cutting it further from 0.5% to 0.3% of GNI by 2027.The Government says aid cuts are needed to spend more on the military to improve our national security. But cutting the aid budget makes the world less safe. International aid helps prevent conflict, saves lives and responds to the needs of people facing the harshest and most frightening of living conditions. What we’re seeing is short-term thinking that ignores the UK’s international responsibility to provide humanitarian relief.This isn’t a “difficult decision”. It is a political choice.There are many fairer ways Keir Starmer could fund more spending on defence. One would be a 2% tax on those with wealth worth £10 million or more. He could raise £24 billion per year, which would provide much more revenue than cutting the aid budget.Please stand in solidarity with people around the world now. Join us and write to your MP calling on them to pressure Keir Starmer to reverse these devastating cuts immediately. Email your MP now Email your MP Find your MP Enter your address or postcode (UK only) var element grecaptcha.ready(function() { element = document.querySelector('.g-recaptcha[data-widget-uuid="33f4662f80b84b3b9ed1da574f0b940f"]'); element.form.addEventListener('submit', recaptchaFormSubmit); }); function recaptchaFormSubmit(event) { event.preventDefault(); grecaptcha.execute('6Lcv5twUAAAAAL-FmuyEg33V6lHHmR-co5tX0UYp', {action: 'email_to_target_submit'}) .then(function(token) { console.log("reCAPTCHA validated for 'data-widget-uuid=\"33f4662f80b84b3b9ed1da574f0b940f\"'. Setting input value...") element.value = token; element.form.submit(); }); } Postcode * Required Your Details Your email address is needed for you to receive a response. If you also tick 'Yes, I'd like hear from you by email', we'll use your email to keep you updated about our projects, fundraising activities and appeals. You don't have to give us your phone number, but if you do (including by autofill), you consent to us using it to keep you updated about our projects, fundraising activities and appeals. You can opt out at any time. Your information is safe and secure with us. Read our privacy policy. First name * Required Last name * Required Email * Required Your email is needed for you to receive a response Yes, I'd like to hear from you by email Please let us know if you're also happy to hear from us by email. Phone number Message subject * Required Message content * Required Dear {contact_data~firstName} {contact_data~lastName} MP, I am writing to express my outrage at the recent announcement the UK Government made to drastically cut lifesaving UK aid. At a time when 3.6 billion people - 44% of humanity – are living in poverty, I am incredibly disappointed that the UK is stepping back from this vital work. The decision to cut the already shrunken aid budget from 0.5% to 0.3% of Gross National Income (GNI) by 2027 will have a devastating impact on the world’s most vulnerable people. It will mean more children without teachers. More pregnant women without midwives. More people worldwide facing hunger, poverty and insecurity. At a time when conflicts and climate crises are on the rise, and extreme poverty is still rife, the UK is turning its back on those that need it most. A few short months ago, the Prime Minister said: “under my leadership, the UK will lead again, tackling climate change, at home and internationally and restoring our commitment to international development”. But instead, he’s doing the opposite - pulling back on our commitment to international development and planning to reduce aid to the lowest share since 1999. At the same time, the UK continues to spend huge amounts of its international aid in the UK. If this doesn’t change, the amount the UK will genuinely spend overseas will actually be closer to just 0.1% of GNI, lower than all aid donors except Hungary. This is unacceptable and not the global leadership I expected from the Government. The Government says these aid cuts are needed to spend more on the military to improve our national security. But it’s a false dichotomy to take from aid to give to defence. This shows a fundamental misunderstanding of the power of investing in reducing poverty and inequality in helping build safer and more prosperous countries. International aid helps prevent conflict, manage climate impacts, gets people in work, and prevents diseases. Safer countries mean a more stable world, and a more stable Britain. As we know from previous aid cuts, it is usually funding for women and girls and the most marginalised groups which is disproportionately impacted. For example, during the UK aid cuts in 2021, cuts to one UN agency focussed on sexual and reproductive health were estimated to result in 250,000 more maternal and child deaths, and cuts to girls’ education were estimated to result in 700,000 fewer girls receiving an education. These new cuts come at a time when backlash against women's rights and gender justice the world over are reaching new peaks, and we need UK leadership to push back. There is also no shortage of alternative, fairer ways to raise more money. For example, a small 2% tax on people with wealth over £10 million could raise £24 billion every year. That’s far more than the entire aid budget. I would much rather money was taken from millionaires, not from those living in poverty. As well as reversing these deadly cuts, the UK must urgently show it’s still committed to being a force for good in the world by urgently committing to genuine debt relief and by supporting Global South-led initiatives to reform the tax system. On average, lower income countries spend more on debt repayments than on education and health combined. The UK has a particular responsibility to make private lenders in the UK participate in debt relief. These actions cost the UK nothing, but will help free up billions for countries to spend on life saving public services. I have always been proud that the UK has invested in and championed global development. I believe in supporting people across the world and believe the UK must play a role in this. I am so disappointed by our government’s decision and know this will have devastating consequences for millions of people and badly affect our reputation on the global stage. As my MP, I am asking you to please write to the Prime Minister to share my disappointment and concerns with him and ask him to reverse this decision immediately. Please do share your letter and any response with me. I know there will be parliamentary debates on this in the coming weeks, so please do seek every opportunity to raise this issue as much as possible. I look forward to your response on how you will stand up against these cuts. Thank you, {user_data~First Name} {user_data~Last Name} {user_data~Email} {user_data~MailingStreet} {user_data~MailingCity} {user_data~MailingPostalCode} You have already emailed your candidate have signed Help us reach our target of by sharing it with others! Please share on {"event": "campaign_info", "wagtail_campaign_type": "emailtottarget", "wagtail_campaign_id": 2624, "wagtail_campaign_name": "Demand Keir Starmer reverses aid cuts", "en_campaign_id": 349652, "en_campaign_name": "Aid cuts - MP action - Feb 2025"} window.dataLayer = window.dataLayer || []; const pushDataElement = document.querySelector('#js-analytics-data'); if (pushDataElement) { const pushData = JSON.parse(pushDataElement.textContent); window.dataLayer.push(pushData); }'''
