full_description = "Zara Canfield/Oxfam Volunteer in your local Oxfam shop From sorting donations, to getting behind the till – find the right fit for you. Apply today Volunteers are the heartbeat of Oxfam Volunteer with us Our volunteers come in all shapes and sizes. But one thing’s for sure: they all share a love for community. Whether it’s helping out at your local shop or volunteering at a music festival, there’s a role for you. Local Shops Volunteer in your local shop Find out more Online Hubs Volunteer in your local Hub Find out more Festivals Volunteer at a festival Find out more Current volunteering opportunities Duke of Edinburgh Volunteering with Oxfam You can do your Bronze, Silver or Gold DofE Volunteering section by volunteering in your local Oxfam shop. Volunteer in your local Oxfam shop Sign up to work in one of our amazing local shops. Whatever your skills or interests, you'll find the role for you. Questions about volunteering Volunteers are the heartbeat of our movement to end poverty around the world. Find everything you need to know about volunteering with Oxfam. Voluntary office roles Sparing a few hours of your time to volunteer with Oxfam can be a brilliant way to make a difference and gain valuable work experience. Volunteer in your local Oxfam Online Hub Sign up to work in one of our amazing Oxfam Online Hubs. Find your local Oxfam Hub and start your charity volunteering journey. Find out more today. View all"
