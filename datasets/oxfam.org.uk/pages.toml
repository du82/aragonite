["https://oxfam.org.uk/donate/more-ways-to-donate/payroll-giving"]
title = """
Payroll giving - Give as you earn    | Oxfam GB"""
description = "Payroll giving or 'Give as you earn' is a scheme that allows anyone in the UK who pays income tax to make regular tax-free donations to charity. Sign up today."
full_description = "Also in this section People's Postcode Lottery Charity gifts Donate your time Donate shares Knitting for Oxfam Donate a car Donate your old phones and tablets Payroll giving In the aftermath of the 2023 Türkiye–Syria earthquake Oxfam KEDV has worked with communities to meet the needs of displaced people. Here, Oxfam KEDV staff members discuss and plan how to coordinate activities. Image: Delizia Flaccavento/Oxfam Payroll giving - Give as you earn Home Donate now More ways to donate If you want to make a regular donation to Oxfam, Give as you earn is a great way to do it. It's easy to set up, it’s automatic, and because it’s a way of giving tax-free, it means your donation can go further towards fighting the injustices of poverty and inequality. What is payroll giving? Payroll Giving or Give As You Earn is a scheme that enables employers to give money from your pay directly to Oxfam, before it’s taxed. That means any tax you would have paid on your donation goes to Oxfam. It doesn't cost you a penny more, and because it comes from your pay automatically, once it's set up, you won't have to do anything. How does payroll giving work? Payroll Giving is a great way to give more to Oxfam straight from your salary. Every £5 you give to Oxfam will only cost you £4 (or £3 if you’re in a higher tax bracket) - meaning your donation will go further towards helping the causes you care about, at no extra cost to you. What are the benefits of Payroll Giving? Payroll Giving is tax-efficient: Your donations are deducted from your salary before taxes, maximising the impact of your support for Oxfam's work.Getting started is simple: Select your cause and chosen donation amount via a short sign-up form.Giving regularly to Oxfam helps in a special way too: knowing what donations we can expect over the months and years to come means we can plan further into the future and work even more effectively. How is payroll giving different to gift aid? Payroll Giving is a simple way to make regular donations straight from your salary, before tax is deducted. It's easier than claiming tax back through Gift Aid – so giving through your payroll means Oxfam can spend less time and money on admin costs, and more on the vital work we support around the world. Why set up payroll giving to Oxfam GB? Your monthly donation could fund all sorts of work led by our partners around the world. Supporting communities facing crises – from floods, to droughts, to conflict – to get the support they ask for, demand their rights, and rebuild with stronger futures. Working with campaigners, farmers, organisations and communities to fight the injustices of climate change. Joining the global call for an economy that works for everyone, including the women who overwhelmingly take on the unpaid and undervalued work that we all depend on.Speaking out with people to challenge systems that ignore, oppress, and exclude them from a future without poverty. We act in solidarity with communities and activists across 67 countries, who are leading us all together towards a more equal future for everyone, everywhere. And when you sign up for payroll giving, you'll be part of that change, around the world, every month. How to set up payroll giving It’s easy. If you want to start making donations through payroll, let your HR team know. Complete the online form.Oxfam and your employer will be notified with all the details and set everything up for you. (If your company doesn't operate a payroll giving scheme, we'll notify you, and if you would still like to still support Oxfam financially, we can discuss setting up a direct debit.)Then you can relax, knowing that with every payslip, you continue to be part of the movement to end poverty. Sign up payroll giving to Oxfam GB now Donate to Oxfam through your payroll Discover More Donate monthly By donating to Oxfam on a monthly basis, you are supporting our ongoing work and allowing us to plan for the future. More ways to donate Giving a donation online is just one of the ways you can support Oxfam. Also in this section People's Postcode Lottery Charity gifts Donate your time Donate shares Knitting for Oxfam Donate a car Donate your old phones and tablets Payroll giving"
