description = "We love catching up with our supporters and want to make speaking to us as easy as possible."
full_description = "Contact us We love catching up with our supporters and want to make speaking to us as easy as possible. Nana Kofi Acquah/Oxfam We'd love to hear from you Already know who you're looking for? Find them in our contacts directory Contact us We love catching up with our supporters and want to make speaking to us as easy as possible. Contact our team Get in touch with our Supporter Relations team and find out about more Oxfam's work and how you can support us through donations, fundraising, festivals, campaigning and more. High street shop support Find out what you can donate, share feedback, and ask any question about one of our high street shops. Information for suppliers Information for suppliers and service providers interested in working with Oxfam. Feedback and complaints Our complaints procedure and fundraising promise to you. Update your details online Update your address details Moved house? Let us know your new address and we'll update our records. Update your telephone number Changed your phone number? Let us know your new number and we'll update your details as soon as possible. Update your email details If you've changed your email address, let us know and we can update our records. Sign up for Gift Aid For each £1 you give, Oxfam could receive £1.25! It only takes a few clicks to allow us to claim Gift Aid on your donation. Cancel your Gift Aid declaration If your circumstances have changed, you can cancel your Gift Aid declaration online. Gift Aid Your Donated Items Make your donations to our shops worth 25% more when they sell with Gift Aid. Scam warning We have recently heard several reports of scams using Oxfam's name. Do not respond to these messages. Control how you hear from us Update your contact preferences for post, email, telephone and SMS. Safeguarding We are committed to continually learning and improving to protect our staff, volunteers and partners from sexual harassment and abuse. Safeguarding policies"
