title = """
Meet our supporters | Leave a gift in your Will    | Oxfam GB"""
description = "Thousands of people just like you have chosen to leave a gift in their Will to Oxfam."
full_description = '''Also in this section Contact us Meet our supporters Oxfam's free Will offer How to leave a gift in your Will Information for Executors In memory donations A gift of support for the next generation Leave a legacy, stay in the fight Gifts in Wills Events Remember a Charity Week Supporter Stories Home Donate now Leave a gift in your will to Oxfam Every year thousands of people leave a gift in their Will to Oxfam. Here are just some of our supporter stories and why they’re choosing to invest in the next generation of people fighting poverty and inequality around the world. Margo's story "The problems that need to be tackled are huge, but we can all do something. Leaving a legacy is something I can do."Read Margo's story Kate's story "I still have that sense of trust that the money would be well spent by Oxfam and will make a real difference."Read Kate's story Nicky's Story "What I’m trying to do is make the best use of the small amount I have to give."Read Nicky's story Mary's story "I trust Oxfam to use my money in the best way possible."Read Mary's story Do something now How to leave a gift in your Will to OxfamFree Will offerTalk to our gifts in Wills team More Supporter Stories Nessy's story "I know for sure that my mother’s money has been spent in the most moral way possible."Read Nessy's story Linda's story "We’re here to do more than just look after ourselves."Read Linda's story Colin and Sue's story "It’s more important than ever we support organisations like Oxfam because the world is so, so unequal and it's fundamentally unfair."Read Colin and Sue's story Neil's Story "My mum is where it all began, shop manager and then shop helper. I’m following in my mother’s footsteps."Read Neil's story Hilary's story "I’m a supporter because Oxfam shares my priorities. I've got nothing but praise for their work."Read Hilary's story Ready to take the next step? Making or amending your Will is surprisingly easy — here's everything you need to know. Gifts in Wills guide Discover More How to leave a gift in your Will You can choose to leave a specific sum of money (a pecuniary legacy), a share of your estate (a residuary legacy), or a specific item. Our guide covers everything you need to know. Leave a gift in your Will Learn how to leave a gift in your will to Oxfam – and how you can do it for free. Oxfam's free Will offer Write or amend your Will for free using our Will writing service. We’ve partnered with trusted providers to make it fast and simple, and there’s no obligation to leave a gift to Oxfam. Also in this section Contact us Meet our supporters Oxfam's free Will offer How to leave a gift in your Will Information for Executors In memory donations A gift of support for the next generation Leave a legacy, stay in the fight Gifts in Wills Events Remember a Charity Week'''
