full_description = "Impact stories Every day, Oxfam is helping thousands of communities around the world work their own way out of poverty. Here are just a few of the people who we have reached — telling their stories, in their own words. Filter by issue Filter by issue Climate change Conflicts and disasters Coronavirus response Health Emergency response Water Women's rights Food How people can have food security Climate change Honey Farming in Bangladesh Koruna is the only female honey farmer in Bangladesh and collects honey with her team in Sundarbans, the largest mangrove forest in the world. Climate change Handwashing works Health Water Emergency response Protecting refugees from coronavirus Emergency response Health Shatha in Gaza and the impact of the pandemic on women Coronavirus response Generation Next Health Coronavirus response How one community helped each other put food on the table Food Coronavirus response Climate change Transforming attitudes Women's rights Gay Alliance Ukraine: community strength and togetherness Emergency response Lasting change starts small Food Women's rights Climate change Good clean water Water Climate change Six ways to build peace Conflict causes and worsens inequality. It damages infrastructure, limits resources, and breaks communities apart. And it hits the world’s most marginalised people the hardest. Conflicts and disasters 1 2 Next Nana Kofi Acquah/Oxfam Donate to Oxfam Lasting change on a global scale starts with people just like you."
