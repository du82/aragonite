["https://www.oxfam.org.uk/get-involved/fundraise-with-oxfam/fundraising-events/march-your-way-virtual-challenge"]
title = """
Join the 31 mile virtual march for a fairer world    | Oxfam GB"""
full_description = '''Also in this section Join Team Oxfam with your own place Training, fundraising and FAQ Run for charity “Fresh Start Festive Hamper Giveaway” Terms & Conditions March Your Way virtual challenge March Your Way Join the 31 mile virtual march for a fairer world! Sign up March Your Way virtual challenge Home Get Involved Fundraise for us Charity Challenge Events What is March Your Way? March Your Way is your chance to take on a virtual fitness challenge designed to fit your lifestyle and goals.Walk, wheel, run, swim, or hike your way to 31 miles in March and join the virtual march for a fairer world.Go steady: complete a mile a day.Get adventurous: tackle five weekend hikes.Go all in: Save it all for one unforgettable ultra run.Mix it up: combine your favourite activities over the month.Take on the challenge solo, partner up with a friend, or rally a group to take on the challenge together. JOIN THE CHALLENGE ! Ready to March Your Way toward a fitter you and a fairer world? Sign Up Now HOW IT WORKS Stage 1 Sign up for March Your Way, create your fundraising page, and set your goal. Stage 2 Take on the 31-mile challenge in your own way – one mile a day or your custom plan. Share your fundraising page to raise money using our helpful resources. Stage 3 Hit your £150 fundraising target and celebrate your achievement with a medal delivered to your door! What will you march for? Find your reason for taking on the challenge March for Women and Girls Oxfam champions women's rights, supporting fair wages, leadership roles, and safety in emergencies.By providing tools and training, we empower women to build sustainable businesses that enable communities to thrive. March for Climate Justice Oxfam supports communities most impacted by climate change to adapt and build sustainable futures, while holding the powerful accountable.Through tools like drought-resistant seeds, irrigation systems, and training, Oxfam empowers people to grow food and earn a living despite extreme weather. March for Peace Oxfam works to support people affected by conflicts and emergencies, providing essential aid and helping rebuild lives.We advocate for peace, call for ceasefires, and push for lasting solutions to address the root causes of violence, ensuring communities can live in safety and dignity. What's next? Explore our fundraising resources for inspiration, tips, and tools to help you reach your goals. View our fundraising resources Join our Facebook community to connect with others taking on the challenge and to celebrate your wins together. Join our Facebook group For full details on the challenge, including rules, eligibility, and important guidelines, please make sure to read the Terms & Conditions. Terms and Conditions Frequently Asked questions What is "March Your Way"? Arrow icon "March Your Way" is a virtual challenge designed to be flexible and inclusive. Participants select an activity—such as walking, running, cycling, swimming, or climbing—and aim to complete 31 miles throughout March. You have complete freedom to split the miles into daily sessions or complete them in larger chunks. How do I participate in the challenge? Arrow icon To join, simply sign up for free, select your preferred activity, and track your progress during March. You can complete the 31 miles at your pace, whether as an individual, a couple, or part of a team. Do I have to complete a mile every day? Arrow icon Not at all! You can spread the 31 miles across the month in whatever way suits you—whether that’s completing it all in one go, over a few days, or by covering a mile a day. It’s completely flexible! Where is the challenge held? Arrow icon This is a virtual event, meaning you can participate wherever you are. Whether it’s at your local park, on a treadmill, or even in your living room, the location is up to you! Does it cost anything to sign up? Arrow icon No, registration is completely free. Fundraising FAQs How can I collect donations? Arrow icon You can collect donations using your personal fundraising page, which is linked to our JustGiving campaign. Simply share your page with friends, family, and your wider network to raise funds for this great cause. All donations made through the page automatically go to Oxfam. To get started, visit our campaign page: JustGiving - March Your Way.If you receive any cash donations, you can bank them yourself and transfer the amount to your online fundraising page. For other ways to pay in your donations please visit: https://www.oxfam.org.uk/get-involved/fundraise-with-oxfam/pay-your-fundraising/ Is there a fundraising target? Arrow icon Yes, we ask participants to raise a minimum of £150. However, feel free to set a higher target to maximize your impact! Will participants receive a medal? Arrow icon All participants will receive a participation certificate. To receive a medal, participants need to reach the minimum fundraising target of £150. Do you offer international shipping for medals? Arrow icon No, we do not offer international shipping for medals. Medals can only be delivered within the UK. International participants are encouraged to explore alternative options, such as local collection or digital recognition. Other FAQs Can I join a team? Arrow icon Yes, you can join a team! During registration, you’ll have the option to indicate if you’re part of a team. Simply select “Yes” and provide your team’s name.If it’s a new team, you can create one by selecting “Yes, I’m creating a team” and entering your chosen team's name. If you’re joining an existing team, select “No, I’m joining an existing team” and enter the team's name.Please note: Each team member must sign up individually and raise a minimum of £150 to receive their medal. While teams can work together to support each other, the fundraising target applies to each participant. Providing your team’s name also allows us to track and celebrate your team’s collective progress! Which apps can I use to track my progress? Arrow icon Once registered, you’ll receive step-by-step instructions on how to sync your fitness app (like Strava) with your fundraising page to showcase your progress.For more information on how to link your fitness tracking app to JustGiving, please visit this link. Is there an age restriction? Arrow icon There’s no strict age limit. The challenge is open to participants of all ages and fitness levels, making it ideal for families and individuals alike. Is the event accessible for people who use wheelchairs? Arrow icon Of course! This event is inclusive and welcomes participants of all abilities. Whether you use a wheelchair, adaptive equipment, or another form of mobility aid, you’re encouraged to join in whatever way works best for you. Plus, if you’re using Strava to track your progress, it has the option to select “wheelchair” as your activity type, making it easy to log your distance and be part of the challenge. More Questions What if I have more questions? Arrow icon We’re here to help! Contact us at events@oxfam.org.uk for further assistance. By participating in March Your Way, you’ll set personal goals while contributing to a fairer world. Thank you for making a difference! Also in this section Join Team Oxfam with your own place Training, fundraising and FAQ Run for charity “Fresh Start Festive Hamper Giveaway” Terms & Conditions March Your Way virtual challenge'''
year_published = 2025
clearnet = "https://www.oxfam.org.uk/get-involved/fundraise-with-oxfam/fundraising-events/march-your-way-virtual-challenge"
