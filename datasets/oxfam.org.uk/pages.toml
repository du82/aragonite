title = """
World hunger - Oxfam are getting food on the table    | Oxfam GB"""
description = "No-one should go to bed hungry. We work to help people put food back on their table, today and tomorrow."
full_description = "Chana and Sare in their aquaponics greenhouse in Sambo, Cambodia. Photo: Patrick Moran/Oxfam. Growing, providing together Food for all It's not right that 1 in 9 people go to bed hungry. Which is why we work tirelessly with our partners to help people put food back on their table, today and tomorrow. What we're doing We are fighting malnutrition in emergencies When people lose their homes, jobs, crops or livestock, they go hungry. Cash grants can tide people over in the worst of a crisis, and help keep local businesses alive. We are helping to grow food for tomorrow Supporting local small businesses to grow food and keep livestock means people can earn an income, live sustainably, and keep feeding their families and communities. We are Challenging the injustice of hunger No-one needs to go to bed hungry. But so many do. Oxfam supporters challenge the world's governments to protect and provide for the people going hungry every day. Facts about food 821 million people around the world face chronic food deprivation. 100 million The number of hungry people could be reduced by 100-150 million by giving women farmers more resources. 135 million people are facing crisis levels of hunger or worse. How can you help? Volunteer with us Volunteer Fundraise with us Fundraise Campaign with us Campaign This is a climate resilience project ... I think this project is working very well.” Chana is part of an aquaponics project in Sambo, Cambodia."
