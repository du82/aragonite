["https://oxfam.org.uk/oxfam-in-action/women-equality"]
title = """
Women's Rights - Supporting The Rights of Women    | Oxfam GB"""
description = "Oxfam GB has been fighting alongside communities for Women's Rights worldwide for many years. With your help, we can help support the rights of Women"
full_description = '''Johanna Duran Gomez, director of Fundación Mujer y Futuro, at the Sex Truck, a mobile clinic focused on reproductive health services and women’s rights in Bucaramanga, Colombia. Women's rights and gender justice Women's rights are human rights and the potential for lasting change lies in the hands of millions of women currently living in poverty. That's why we put women's rights at the heart of everything we do. Demanding equality When all women get fair living wages, decent working conditions, and their voices heard, everyone benefits. Oxfam supports women stepping into leadership roles, speaking out against harmful laws and policies, and standing up for their rights. Leading emergency response Emergency can affect women and men in dramatically different ways. Like in refugee camps, where girls and women need lighting at night and separate toilets to stay safe, secure and healthy. Standing up for women's rights is vital for keeping everyone safe. Building sustainable businesses Loans, seeds, tools and training for women help whole communities grow more food and make goods that they can market themselves, and break free from poverty. Shifting power and resources to grassroots women's organisations Donate to The Women's Rights Fund Fight for women’s rights It’s time to amplify the power of all women – leaders, disruptors, change-makers, carers.We’re living through an inequality crisis. Those in power are choosing profit over people and planet – with the most marginalised the worst affected.For a select few, climbing the steps to power is easy. Yet it’s women who are paving the way for the rest of us. Especially those from BIPOC, LGBTQIA+, working-class, disabled, refugee and/or migrant communities.They’re leaders, disruptors and change-makers. And on top of all this – the care work they do is the glue holding together every society and economy worldwide. This is true power. And now’s the time to amplify it. "My wish is for existing NGOs to understand us. Not only do they know about who has disabilities, but also the relation between disabilities and planning. It's crucial. Because upon a disaster, the number of the disabled increases." Desi in Indonesia. My wish is for existing NGOs to understand us. Not only do they know about who has disabilities, but also the relation between disabilities and planning. It's crucial. Because upon a disaster, the number of the disabled increases.” Desi, Vice President of the PBR Forum in IndonesiaOxfam acknowledges the support of the Australian Government through the Australian NGO Cooperation Program (ANCP). The power of women worldwide who are leading the change Women are leading the way. Like Magda, in Indonesia, who supports women harnessing power to fight back against the harshest impacts of the climate crisis.Or Rowena in the Phillippines. She and her community’s all-women disaster committee are restoring the forest to prevent the devastation caused by typhoons.And in Yemen, women-led organisations are calling for Yemeni women to have a seat at the table as paths to peace are being built. Elizabeth Stevens/Oxfam We are trying to protect the area from calamity.” Rowena in the Phillippines whose community’s all-women disaster committee are restoring the forest to prevent the devastation caused by typhoons. Following the recent earthquakes in Turkiye and Syria, Oxfam KEDV led our response – a long-standing women’s organisation who’ve been working with refugee and Turkish communities for years. Their understanding of the additional challenges women and girls face during crisis means gender justice is embedded from emergency response to long-term recovery. "I am deeply committed to my work, recognising that the true essence of civil society organisations is manifested during times of war and emergencies, not just during periods of calm." Fidaa Shurrab - Atfaluna for Deaf Society (Rafah, Gaza) Support women leading community work in Gaza Donate to Gaza "I am deeply committed to my work, recognising that the true essence of civil society organisations is manifested during times of war and emergencies, not just during periods of calm. Fidaa Shurrab, Director of Projects at Atfaluna for Deaf Society in Rafah. The glue that holds societies and economies together Often taken for granted, care work is the bedrock of societies around the world.And this vital work is mainly done by women, particularly those from marginalised communities.These women are the reason children grow and learn. That elderly relatives are able to live healthy and safe lives. That our homes keep running. That every society and economy functions worldwide.They are powerful. And they must no longer go ignored or overlooked. Because true power is caring about people in a world that seems not to. The narrative during the pandemic may have been an economic shutdown – yet the reality was women doing huge amounts of extra unpaid care at home, working overtime as teachers, cooks and nurses.” Anam Parvez, Head of Research, Oxfam GB. Writing on economic policies as a form of gender-based violence. Make valuing all women's work a reality Redefining work Solidarity with all women Solidarity with all women means making different choices – whether by us, those in power or global institutions.We can start to tackle the inequality crisis once the steps to power become a path towards truly valuing women.When every woman is seen, heard, and celebrated loudly.Because real power is defending against the climate crisis. Caring for loved ones. Being true to yourself.Celebrate the power of women everywhere. Caring, leading, teaching – and building a better world for us all. Women at Work charity gift cards Oxfam's Women at Work programmes support women pushing for respect, fairness and dignity at work, and to end gender-based violence in the workplace. Charity gift cards Every International Women's Day, we choose to celebrate the power of all women everywhere Every year, on International Women's Day, Oxfam GB is with every woman. Those calling out the systems of injustice that fuel poverty. Those ensuring communities are cared for. Those redefining the role women play in our world.At every turn, women are leading the way. This is real people power. Because when women are on the field, we all win the game.On International Women's Day, we call for every woman’s power to be seen, heard and valued. We choose to celebrate it. Amplify it. We choose the power of all women everywhere. Women's rights 72 % 72% of unpaid care work in households globally is done by women. 1 billion Around the world, 1 billion women lack legal protection from sexual violence. 7.9 million In 2021-22, Oxfam’s WE-Care programme reached 7.9 million people across Africa. What can you do to help? Volunteer with us Volunteer Fundraise with us Raise money Campaign with us Campaign We have been able to amplify the voices and experience of migrant women and influence decisions made at the national level.” Johanna Duran Gomez, director of Fundación Mujer y Futuro, Colombia.'''
year_published = 2025
clearnet = "https://oxfam.org.uk/oxfam-in-action/women-equality"
