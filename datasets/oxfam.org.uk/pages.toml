description = "Join us at one of our gifts in Wills events to find out more about this special way of supporting Oxfam."
full_description = "Join us at one of our gifts in wills events Register Stay in the fight. Oxfam Gifts in Wills Events. Home Donate now Leave a gift in your will to Oxfam We’re a community that spans the world, united in the fight to end poverty and inequality. We recognise that it will take all of us. And that work doesn’t end with you or me. We are hosting Oxfam’s Gifts in Wills events throughout 2025- we would love you to come. Join us to hear from colleagues from across Oxfam, bringing to life the inspiring stories from the people and communities that we stand in solidarity with. Learn how you can stay in the fight for a fairer future, and the vital role gifts in Wills play.We shall be joined by a local solicitor who will share with us their expertise regarding estate planning and Will-writing.Refreshments and lunch will also be provided at this special event, also there will be opportunities to explore the wonderful venues afterwards.Venues have been chosen to be accessible, please do let us know if you will require any accessibility support.If you would like to join us at one of these special events (spaces are limited), please register.Events are to be confirmed in Leeds and Exeter in the autumn. Join us at one of our gifts in Wills events Oxfordshire: The Crown and Thistle The Crown and Thistle is a cherished Oxfordshire landmark with a history dating back to 1605.2nd April 2025 starting at 10 am till 1pmParking available18 Bridge St, Abingdon, OX14 3HS Register Nottingham: National Justice Museum A place of history and inspiration for social justice.4th June 2025 starting at 10 am till 1pmPark and ride availableHigh Pavement, Nottingham, NG1 1HN Register London: Camden Arts Centre Vibrant and rooted in the community, this is the place to be immersed in vital and inspiring contemporary art and culture.2nd July 2025 starting at 10 am till 1pmBlue badge pre-booked parking and accessible by public transport50, Arkwright Road, London NW3 6DG Register Discover More Leave a gift in your will It’s thanks to gifts in Wills from our supporters that we’ve been here for 75 years, fighting to end poverty and injustice around the world. Oxfam's free Will offer Write or amend your Will for free using our Will writing service. We’ve partnered with trusted providers to make it fast and simple, and there’s no obligation to leave a gift to Oxfam. Download your free legacy pack We've coupled inspiration with information and put it in all into one pack to help you make your first will or amend an existing will."
