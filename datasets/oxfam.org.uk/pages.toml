["https://oxfam.org.uk/donate/donate-to-our-shops/donating-toys"]
title = """
How to donate new or used toys and games to charity    | Oxfam GB"""
description = "Find out how and where to donate children's toys, games and puzzles to charity. Donate new or used toys to Oxfam at your local Oxfam shop or by post."
full_description = "Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability Donating Toys and Games Home Donate now Donate to our charity shops Donating toys and games to Oxfam helps fund our vital work fighting poverty worldwide. Find out where to donate toys, what kinds of toys and games you can donate, and what happens to your donations. Donate toys to your local Oxfam shop If you're running out of space for outgrown toys, don't throw them away! Your unwanted toys or toy collection can be resold to help raise funds. Funds that support children and families to grow the future all over the world. You can help to reduce waste. And leave a cleaner environment for younger generations. You can use our shop finder to find your closest Oxfam shop. Find an Oxfam shop near you Gift Aid The Gift Aid scheme for UK taxpayers can help Oxfam raise an extra 25% on the value of your donation by reclaiming government basic rate tax. You can help us get the most of your donation by signing up online, or in person when you donate.Supercharge the impact of your donated items by 25% when you sign up for Gift Aid. It costs you nothing, yet further shifts power to communities as they lead positive change. By signing up for Gift Aid, you’re contributing to a kinder and fairer world – a world less divided by borders, money, race or gender. Photo: Fiona Finchett / Oxfam. Toys for sale at the Oxfam Superstore in Manchester. Donate toys by post If you can't easily travel to your nearest Oxfam store, you can use our donation bags to donate toys by post for free.Reuse one of your own bags and print off a postage label, or order one of our recycled donation bags online.Pack up the toys.Add your Gift Aid number.And drop them off at your local DPD drop off point.You can include any of the items that Oxfam accepts with your donation. Cottonbro, Pexels.com What types of toys can I donate to charity? Oxfam accepts a huge range of new and used toys:Rare and collectable toys, including vintage toysSoft stuffed toysModels, including vehicles and figuresTrainsets and car setsComputer/video gamesDolls, including ornamental and display dolls and figuresJigsaw puzzlesPlastic, wood or metal toysBoard games of all kindsBaby and preschool toysCreative and DIY craft kitsEducational toysFancy dressOutdoor toysAction figures Artem Beliaikin, Pexels.com How can I donate my children's toys? Donating children’s toys has never been easier than it is with Oxfam GB. Simply put the toys in a bag or box and take them to your local Oxfam shop. You can also donate items by post for free. Remember to sign up to Gift Aid to raise an extra 25% at no cost to you! What types of toys can we not accept? We can't accept dirty or broken toys or toys with sharp edges. We ask that you wash soft toys in particular before donation, unless they're brand new. We also can't accept incomplete toys, like sets of board games or puzzles with missing pieces. These can't be resold. Buying toys, board games and puzzles from Oxfam Cleared out your outgrown toys and need to find something new to entertain little ones? We have a huge range of toys for sale in our shops, and online. Including cuddly soft toys and all kinds of games. Discover More Donating books Donating books to Oxfam helps fund our vital work fighting poverty worldwide. Find out where to donate, what kinds of books you can donate, and what happens to your donations. Donate items to your local Oxfam Have a clear-out and help beat poverty. We can turn your donations into life-changing cash. Donate a car Oxfam offers an easy, hassle-free way to donate your vehicle, which is then quickly turned into much-needed funds for Oxfam Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability"
