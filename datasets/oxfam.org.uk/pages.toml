full_description = "Have a clear-out and help beat poverty Donate to our shops Your donations are always welcome at our charity shops in England, Wales and Scotland. Thank you for choosing to donate goods to Oxfam. You can drop off donated items to your local charity shop, donate by post, or through one of our trusted partners. Oxfam volunteer Siena receives a bag of donations at the Islington Oxfam shop. Photo: Gabi Torres / Oxfam. Gift Aid your donated items Raise a life changing 25% more with Gift Aid Sign up Have a clear-out and help beat poverty Donate to our shops Your donations are always welcome at our charity shops in England, Wales and Scotland. Thank you for choosing to donate goods to Oxfam. You can drop off donated items to your local charity shop, donate by post, or through one of our trusted partners. Donate clothes Not sure where to donate your clothing? There are several ways to donate items to Oxfam, find out the best option for you. Donating Toys and Games Find out how and where to donate children's toys, games and puzzles to charity. Donate new or used toys to Oxfam at your local Oxfam shop or by post. Donating books Donating books to Oxfam helps fund our vital work fighting poverty worldwide. Find out where to donate, what kinds of books you can donate, and what happens to your donations. What we can sell in our shops Your unwanted items could give someone a future free from poverty. Find out what we can and can't turn into life-changing cash. Donate items by post The easy way to donate items for free from home. Pack and send or request a bag for free to help raise money to fight poverty and reduce landfill. Marks and Spencer and Oxfam’s Another Life scheme Another Life. Ordinary clothes made extraordinary. Gift Aid your shop donations Tag your bag to raise a life-changing 25% more when your donated items sell thanks to Gift Aid. Donate foreign currency Wondering what to do with old foreign coins? Oxfam has partnered with Cash4Coins to help use this money for charitable purposes. Where your donation goes At Oxfam we work hard to raise as much money as possible from every item you give us, and no donated item goes to waste. Find your local Oxfam shop Our shops are always in need of donations. Have a clear-out and donate to your nearest shop today. Questions about donating to our shops Find answers to frequently asked questions about donating goods to Oxfam. Sustainability We are actively engaged in initiatives aimed at promoting more sustainable and circular approaches to clothing in the UK fashi… Maria Tate-Bright/Oxfam Find your local shop Our shops are now open and donations are welcome. Thank you for choosing to donate to Oxfam. Shop finder"
