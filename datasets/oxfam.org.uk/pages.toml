["https://oxfam.org.uk/donate/philanthropy"]
title = """
Philanthropy    | Oxfam GB"""
description = "Making a big gift to Oxfam makes a big difference. Whether it's giving a large donation or giving business advice to smallholders - there are many ways for people with exceptional wealth or skills to support Oxfam."
full_description = "Also in this section Play the Oxfam Lottery Donate items to your local Oxfam Donate to an emergency Leave a gift in your will Pay in your fundraising More ways to donate Donate your Zakat to Oxfam Amy Christian/Oxfam Toggle quote We need to be able to adapt to changes and new challenges as they come up.” Mudafa in Jordan Philanthropy Home Donate now Philanthropic giving offers you a crucial role in helping Oxfam fight poverty. Whether it's giving a large donation or giving business advice to smallholders in the developing world — there are many ways for people with exceptional wealth or skills to support Oxfam. Making a big gift to Oxfam makes a big difference Your involvement and ongoing support enables us to save lives, implement projects that put poor people in charge of their lives and livelihoods and campaign for lasting change.What's more, by making a significant gift you enable us to plan further ahead, respond with greater speed and effectiveness, remain innovative and maintain our independence.Your support can and does transform the lives of the people and communities around the world.Make a donation to Oxfam: £1000, £2500, £5000 Donate now Our approach We aim to build deep, long-term relationships with individuals, trusts and foundations who can support us with significant gifts and believe passionately that, by maximising our partnerships, we can achieve more effective, lasting change.We provide a personalised service to all our key supporters.We also host regular events and, where appropriate, can arrange for you to visit a project you have supported so you can see first hand the difference your commitment has made. Ways to give As part of the Oxfam International confederation, we work in more than 90 countries around the world, reaching millions of people each year through our emergency response and development programmes. We want the way you support us to be as tailored to your interests as our work is to the individuals and communities we work with around the world.You can therefore trust us to make the most effective use possible of your gift, whether you donate to general funds, choose to support specific or general emergency relief programmes around the world, or give to a development project that is of particular interest to you.There are a number of ways you can provide this support.Give a single giftGive a one-off donation to Oxfam and make a big difference today.Set up a regular donationMonthly donations mean we can plan further into the future. Set up a regular gift today.Donate through your charitable trust or foundationFind out more about the ways you can support us through your trust or foundation.Make a gift of sharesDonating shares to Oxfam can raise much-needed cash for our work.Give as part of a syndicateFind out more about ways of supporting Oxfam through a personal or professional syndicate.Matched givingFrom time to time we work in partnership with individuals, companies, trusts and institutional donors and raise additional funds through matched giving schemes.Make a gift in kindThere are many other ways you can support and add value to our work.To find out more about any of the above, please contact Rosalia Mendes, Philanthropy & Partnerships at rmendes1@oxfam.org.uk. Are you a higher rate taxpayer? Every £1,000 you donate could be worth over £1,700 to Oxfam*If you are a UK tax payer and you've given us permission, we can claim Gift Aid on your donation. Oxfam can only claim back the basic tax rate of 20% in Gift Aid. However, if you pay a higher rate of income tax (40% or above), you could be entitled to a tax rebate on your donation, worth the difference between the basic rate of tax and your higher rate. This extra could make a real difference to your donation. Gift Aid explained How to claim and donate your rebateYou can contact your local tax office and reclaim the tax on your donations using a P810 form. If you have any queries about your tax position, contact HMRC on 0845 9000 444 or visit their website at www.hmrc.gov.uk.* This amount assumes the donor is a 50% taxpayer and that gift aid is claimed on both the original donation and the tax rebate. Oxfam around the world 8 m Last year we helped more than 8 million people fight poverty and build a radically better world. 87 countries In 2020-21 we worked with 640 partner organisations. The Oxfam confederation works in 87 countries around the world. £230.9 m In 2021-22 Oxfam GB spent £230.9 million on charitable activities. Get in touch If you'd like to find out more about making a significant gift towards our emergency work, please contact:Naomi Lyons: Major Giving ProgrammeContact me to discuss making a significant donation towards Oxfam's work. nlyons1@oxfam.org.ukShelley Thompson: Trusts and FoundationsContact me if you'd like to discuss support to or partnership with Oxfam. sthompson2@oxfam.org.ukSee more about our Trusts & Foundations Partnership approach here. Discover More Leave a gift in your will It’s thanks to gifts in Wills from our supporters that we’ve been here for 75 years, fighting to end poverty and injustice around the world. We need to be able to adapt to changes and new challenges as they come up.” Mudafa in Jordan Also in this section Play the Oxfam Lottery Donate items to your local Oxfam Donate to an emergency Leave a gift in your will Pay in your fundraising More ways to donate Donate your Zakat to Oxfam"
