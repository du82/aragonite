["https://oxfam.org.uk/donate/donate-zakat-to-oxfam"]
title = """
Zakat Donations 2025- Pay Zakat Online    | Oxfam GB"""
description = """
Donate your 2025 Zakat to Oxfam. Let’s come together to show the true spirit of generosity. Join Oxfam and our partners in supporting the most vulnerable Muslim-majority communities worldwide.

100% of Zakat donations are spent in selected countries to help those in need."""
full_description = '''{"event": "detail_view", "ecommerce": {"detail": {"actionField": {"list": "donation"}, "products": [{"id": "Donate Zakat Today (Single Donation)", "name": "donation", "category": "one-off donation"}]}}, "formID": "zakatdonationcampaignpage-1239", "formName": "Give your 2024 Zakat", "CRMEventCode": ""} window.dataLayer = window.dataLayer || []; const pushDataElement = document.querySelector('#js-analytics-data'); if (pushDataElement) { const pushData = JSON.parse(pushDataElement.textContent); window.dataLayer.push(pushData); } Donate Zakat Today Home Donate now This Ramadan, let’s come together to show the true spirit of generosity. Join Oxfam and our partners in supporting the most vulnerable Muslim-majority communities worldwide.100% of Zakat donations are spent in selected countries to help those in need. Who does Oxfam give Zakat to? Together, we’re fostering a future where local organisations take the lead: turning initiatives into lived realities, ensuring your donation goes beyond charity. Responding in emergencies Your Zakat donation will help us respond to emergency situations in Muslim-majority communities. Read on below to see some examples of the work Oxfam supports. Promoting development Supporting specific projects that are taking place in Muslim-majority communities and tackling extreme poverty. What is Zakat Zakat, one of Islam’s Five Pillars, is a required act of charity for Muslims who can afford it. It’s a set portion of a person's wealth, given to help those in need. Zakat is usually given during Ramadan. However, it can be given at any time of year. How is Zakat calculated? Zakat is typically calculated as 2.5% of one's wealth and assets that have been held for a full lunar year and exceed the Nisab threshold. This includes savings, investments, gold, silver, and other valuables. What is My Zakat spent on? 100% of funds will be used to support tangible goods and practical support, as well as more intangible benefits such as education, training and health promotion. Funds will support the direct costs of purchasing goods and services. Your Zakat will create sustainable change We work on access to education, healthcare, food, improving people’s chances to earn a living, providing clean water and promoting women’s rights. Read on to find out about some of the work we support in Muslim communities Gaza As the crisis in Gaza continues discover how local organisations are providing urgent support to displaced families. Bangladesh Dulu Begum worked with JAGO NARI to become a community leader and an outspoken advocate for reducing climate crisis induced disaster risks. We work in partnership with the National Zakat Foundation Who are supporting our work on tackling poverty in the UK. If you would like help calculating your Zakat, the National Zakat Foundation have an online calculator service which is free and easy to use. Frequently Asked Questions Who is obligated to pay Zakat? Arrow icon Muslims who meet specific criteria of wealth and assets are required to pay Zakat. This includes individuals whose wealth exceeds the Nisab threshold, and it's obligatory for them to fulfil this duty annually. Where does Zakat money go? Arrow icon Zakat funds are distributed to those who fulfil the requirements to being a Zakat recipient. Oxfam GB ensures that 100% of Zakat donations are used efficiently and effectively to tackle the root causes of poverty and support sustainable development initiatives. Can Zakat be given to non-Muslims? Arrow icon No, all local partners and projects funded via the Zakat fund are in Muslim communities. Is Zakat the same as Sadaqah? Arrow icon Zakat and Sadaqah are both forms of charitable giving in Islam, but they have different purposes and requirements.Zakat is obligatory and has specific criteria for eligibility and calculation, while Sadaqah is voluntary and can be given at any time and in any amount. How can I pay my Zakat through Oxfam GB? Arrow icon Oxfam GB provides various convenient methods for Muslims to fulfil their Zakat obligation, including online donation platforms, bank transfers, and designated Zakat funds.Donors can specify their Zakat contribution, and Oxfam GB ensures that it is used in accordance with Islamic principles. Is my Zakat donation tax-deductible? Arrow icon In some countries, Zakat donations made to registered charitable organisations like Oxfam GB may be eligible for tax relief or deductions.Donors are encouraged to consult with local tax authorities or financial advisors to understand the tax implications of their Zakat contributions. Can I designate where my Zakat donation goes? Arrow icon While donors can specify their Zakat contribution to support Oxfam GB's various programs and initiatives, ultimately, it is allocated based on the organisation's assessment of need and priority areas to maximise impact and address poverty and injustice effectively. How does Oxfam GB ensure transparency and accountability in Zakat distribution? Arrow icon Oxfam GB is committed to transparency and accountability in all its operations, including Zakat distribution. The organisation maintains rigorous financial management and reporting processes, conducts regular audits, and adheres to best practices to ensure that Zakat funds are used efficiently, ethically, and in accordance with donors' intentions and Islamic principles. How will my donation be treated? Arrow icon An Oxfam dedicated interest free bank account (Lloyds) holds and manages any Zakat donations prior to them being sent to the designated countries. Donations will be spent within one lunar year of you making your payment. Oxfam will acknowledge receipt of all Zakat payments (online payments will be automatically acknowledged immediately, payments through other channels will be acknowledged within 72 hours).Where possible and should you wish, we will inform you of the help that has come from your Zakat donation. However, given the nature of our programmes in emergency humanitarian responses, this is often not practical or possible. Will bank charges be taken out of any Zakat donations? Arrow icon UK administrative costs are not claimed on any Zakat donation and Oxfam does not profit from interest on Zakat payments. 100% of Zakat donations are spent in selected countries to help those in need. Can Oxfam claim Gift Aid on my Zakat donation? Arrow icon Yes. If you are a UK taxpayer, Gift Aid can be claimed in the normal manner and will be allocated to Oxfam’s general unrestricted income. Please make sure you provide the requested details when making the payment. What will happen to my Gift Aid? Arrow icon Gift Aid reclaimed on your donation will be directed into Oxfam’s general unrestricted income. How Oxfam spends its general unrestricted donations. How are the donations sent to the selected countries? Arrow icon Donations will be held in the interest free bank account until such time that they are transferred to the specified country. Each country project that receives the Zakat donations will spend the funds within the lunar year on direct costs in Muslim-majority communities. Can my donation to be spent in the UK? Arrow icon Oxfam does not currently use Zakat to fund UK projects. However, we are working in partnership with the National Zakat Foundation, who are supporting our work on tackling poverty in the UK. Who did you consult when deciding to offer Zakat? Arrow icon Oxfam met and consulted with several Muslim scholars and leaders along with peers from Muslim development charities. We undertook research that included 485 interviews, ten focus groups and several extensive 1:1 interviews with British Muslims from a range of ethnicities, backgrounds, education, gender and age. If you have any questions about Oxfam's approach to Zakat, please download our full Zakat policy below or get in in touch with the Oxfam team. Oxfam's Zakat Policy pdf 1.6 MB Discover more Oxfam’s Zakat Advisory Panel Oxfam’s Zakat policy is supported by a group of voluntary Islamic advisors. Oxfam's Zakat policy By making your Zakat payment to Oxfam, you can be sure your payment will help those suffering from poverty or extreme hardship. Zakat: Frequently Asked Questions Find answers to the most popular questions about donating Zakat to Oxfam.'''
