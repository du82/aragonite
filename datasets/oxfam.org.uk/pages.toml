["https://oxfam.org.uk/about-us"]
title = """
About us    | Oxfam GB"""
description = "Oxfam is a global community of people who act for a kinder world. We believe we can overcome poverty by fighting the injustices and inequalities that fuel it"
full_description = "We won't live with poverty About us Oxfam is a global community of people who believe in a kinder, and radically better world, where everyone has the power to thrive not just survive. We believe we can overcome poverty by fighting the injustices and inequalities that fuel it. Photo: Alef Multimedia/Oxfam What we do Find out more about Oxfam's work and meet some of the people we work with. We won't live with poverty About us Oxfam is a global community of people who believe in a kinder, and radically better world, where everyone has the power to thrive not just survive. We believe we can overcome poverty by fighting the injustices and inequalities that fuel it. History of Oxfam Oxfam was established in 1942. Read the extraordinary history of an unconventional organisation, 70 years in the making. Oxfam: the story so far Our vision is of a kinder, fairer world - a world less divided by borders, money, race or gender Keeping people safe From constantly improving safeguarding policies, to installing solar lights that make refugee camps more secure, keeping people safe is a vital part of our work worldwide Working at Oxfam Oxfam is a global movement of people who won’t live with poverty, and we work together to end this injustice for everyone. Thousands of talented people commit their time to make this happen. Plans, reports and policies Detailed information about who we are, how we work and how we are doing. More about how we work How we work Oxfam is working with communities and partners towards a world without poverty. Oxfam's CEO, Directors and Trustees The day-to-day operation of Oxfam is overseen by a corporate Leadership Team comprised of the Chief Executive and seven divisi… Frequently asked questions Answers to the most common questions about Oxfam. Where we work The Oxfam confederation works in over 80 countries around the world. Oxfam GB is one of the 21 affiliates that make up the Oxf… Tackling abuse: Information and updates Oxfam is committed to keeping our staff, volunteers and the people we work with, safe. The Inclusive Language Guide: When we include everyone we can overcome poverty The Inclusive language Guide is a resource to support people in the charity sector who write in English to think about the way… Oxfam Scotland Oxfam Scotland works to influence decision-makers to build the fairer, greener, more equal country we all want to live in. We are here to help We love catching up with our supporters and want to make speaking to us as easy as possible. Get in touch"
