["https://oxfam.org.uk/donate/leave-gift-your-will/how-leave-money-oxfam"]
title = """
How to leave a gift in your will to Oxfam    | Oxfam GB"""
description = "Making or amending your Will is surprisingly easy – here’s everything you need to know."
full_description = "Also in this section Contact us Meet our supporters Oxfam's free Will offer How to leave a gift in your Will Information for Executors In memory donations A gift of support for the next generation Leave a legacy, stay in the fight Gifts in Wills Events Remember a Charity Week Toggle quote What I’m trying to do is make the best use of the small amount I have to give.” Nicky, Oxfam supporter How to leave a gift to Oxfam Home Donate now Leave a gift in your will to Oxfam Your Will is so important because it ensures that your wishes are followed, whatever happens. What can you leave to Oxfam? A share of your estateA specific sum of moneyA specific item, such as jewellery or artMaking or amending your Will is surprisingly easy – here’s everything you need to know. Gift in Wills guide Gifts in Wills FAQ What happens if I don't have a Will? Arrow icon It’s really important to have a Will and everyone should have an up-to-date one.A Will is a way of looking after the people, causes and charities that you care about after you’ve died. It’s the only way to ensure your wishes are carried out. If you die without a Will, you die intestate – this can cause added stress and financial cost to your loved ones.Many people choose to make or update their Will on the incidence of key life events, such as:Buying a houseHaving a childGetting married or divorcedIf you don’t have an up-to-date Will, the best time to make one is now. It will give you the peace of mind that you’ve provided for your loved ones, and the causes you believe in are honoured too. I don’t have a lot to leave, is leaving a gift worth it? Arrow icon Every single gift left to Oxfam, no matter how large or small, is invaluable.In these ever-changing and uncertain times your legacy gift is more important today than ever before. We rely on gifts in Wills for one quarter of our unrestricted public funding. So, thanks to people like you, the next generation of determined and passionate change makers are already fighting against the systems that make them poor – on their own terms.But there’s more to be done. And with a gift in your Will, no matter what the size, you can help put the power back into their hands for generations to come. To build a fairer, more just and radically better world for all.We hugely appreciate every gift we receive and thank you for considering leaving a gift in your Will to Oxfam. How will you use my gift? Arrow icon Your gift will help Oxfam to continue its vital work in fighting poverty, promoting justice, and protecting the rights of marginalised communities. With your support, Oxfam, with its partners can continue to provide lifesaving assistance to people affected by natural disasters, conflict, and other emergencies.We rely on gifts in Wills for one quarter of our public unrestricted funds. They are crucial in supporting our work to end the underlying causes of poverty, such as inequality and discrimination. Without them we couldn’t support local communities and organizations to build sustainable livelihoods and hold governments accountable for their actions.You can find out more about the vital work your gift could support in our annual report. How do I know that my money won’t end up in the wrong hands? Arrow icon Oxfam has a tested system of checks and balances to ensure proper use of funds, including regular internal and external audits. We publish an annual report every year where you can read about how we raise money and how it’s spent in furthering your vision of a fairer and radically better world. What happens if I change my mind? Arrow icon You’re free to change your mind at any time. You can remove or re-add Oxfam to your Will by simply amending your Will through the ordinary avenues.There’s no obligation to let us know, but if you’ve told us you’re leaving a gift, it would be helpful for us to keep a record if you’ve changed your mind. What do I need to know about making a Will in Scotland? Arrow icon We recommend consulting a solicitor in Scotland to ensure your Will complies with the Scottish legal system. Nicky’s Oxfam Legacy For Nicky, leaving a gift in her Will to Oxfam is a huge pleasure. Her continued and very strong support of Oxfam is because their values tie in closely with hers… Read Nicky's story Practical information What wording should I use to leave a legacy to Oxfam? Arrow icon If you do decide to leave a gift to Oxfam in your Will, there are three main options.A percentage of your ‘estate’ (basically, the combined value of everything you’re leaving behind)A specific sumA specific itemDepending on which gift you’d like to leave, you can ask your solicitor to use one of the following texts:For a share of your estate (residuary legacy): I give all/a share of (please state fraction/percentage) of the residue of my estate absolutely to Oxfam of Oxfam House, John Smith Drive, Cowley, Oxford OX4 2JY, Registered Charity Number 202918, to be applied by Oxfam for its general charitable purposes, and I further direct that the receipt of the Hon. Treasurer or any other proper officer of Oxfam for the time being shall be sufficient discharge to my executors.For a specific sum (pecuniary legacy): I give to Oxfam of Oxfam House, John Smith Drive, Cowley, Oxford OX4 2JY, Registered Charity Number 202918, absolutely, the sum of (amount in figures, amount in words) to be applied by Oxfam for its general charitable purposes, and I further direct that the receipt of the Hon. Treasurer or any other proper officer of Oxfam for the time being shall be sufficient discharge to my executors.For a specific item: I give to Oxfam of Oxfam House, John Smith Drive, Cowley, Oxford OX4 2JY, Registered Charity Number 202918, absolutely, (write in here whatever you wish to give) to be applied by Oxfam for its general charitable purposes, and I further direct that the receipt of the Hon. Treasurer or any other proper officer of Oxfam for the time being shall be sufficient discharge to my executors. What is Oxfam’s postal address and charity number? Arrow icon Our address is:Oxfam GBOxfam HouseJohn Smith Drive,Oxford OX4 2JYOur charity number in England and Wales is (no 202918) and in Scotland is (SC039042). Should I tell you if I’ve left a gift to Oxfam? Arrow icon If you’ve chosen to remember us in your Will, we’d love to know! That way, we can make sure to thank you properly – and keep you informed about how you’re helping to build a fairer world.You can tell us about your pledge by calling us on 0300 200 1331 or sending us an email at giftsinwills@oxfam.org.uk. Should I send Oxfam a copy of my Will? Arrow icon Please do not send us the original of your Will, as unfortunately we are not set up as an archiving facility. We advise that you keep the original of your Will in a safe place where it can be found easily when needed, such as the solicitors who drafted it, or with the Probate service (who offer a storage service), or with the National Will Safe which is affiliated to the National Will Register.We recommend that you register the location of your original Will with the National Will Register so that it can be found after you have passed away.Please do feel free to send us a photocopy or scanned copy of your Will, if you have named Oxfam GB as one of the beneficiaries in it. Here are the contact details to send it to: giftsinwills@oxfam.org.uk or post it to Oxfam House, 2700 John Smith Drive, Oxford OX4 2JY. How much will it cost to write a Will? Arrow icon You can make or amend your Will at no cost to you by using our Free Will Writing Service. We can offer this service for free because Oxfam take on the cost of Will writing. While there’s no obligation to leave a gift to Oxfam if you use this offer, 65% of people do choose to do so.We rely on gifts in Wills for a quarter of our public unrestricted funding so, we do hope that you consider leaving a percentage of your estate to Oxfam after taking care of loved ones.Your gift will help fund our vital work in fighting poverty, promoting justice, and protecting the rights of marginalized communities for years to come. Find out why other supporters, like Nessy, have chosen to include Oxfam in their Will. Can a gift to charity help me pay less inheritance tax? Arrow icon Technically, yes. Gifts to UK registered charities are exempt from Inheritance Tax. But we’d strongly recommend that you speak to a solicitor for advice on tax issues.For more information about taxation on charitable gifts in Wills please visit our Information for Executors page.Many of our supporters, who have made such a positive difference in the world during their lifetime, like their Will to reflect the values they lived by. Honouring causes dear to them means they can keep on creating the change they want to see, long into the future. I already have a Will; how do I add Oxfam? Arrow icon You can add Oxfam to your existing Will for free using our Free Will Writing Service. Simply tell your provider that you wish to amend your existing Will to add a gift to Oxfam.Alternatively, you can amend your Will to include a gift to Oxfam through other avenues such as directly with your solicitor.If you’ve chosen to remember us in your Will, we’d love to know! That way, we can make sure to thank you properly – and keep you informed about how you’re helping to build a fairer world. You can tell us about your pledge by calling us on 0300 200 1331 or sending us an email at giftsinwills@oxfam.org.uk. I’ve ordered a Gifts in Wills guide by post how long will it take to arrive? Arrow icon It usually arrives within three weeks, but this can be affected by Royal Mail delays.If it’s been more than three weeks since you ordered your guide by post and it hasn’t arrived, please call us on 0300 200 1331 or email giftsinwills@oxfam.org.uk and we will try to resolve the issue.Alternatively, you can download the online version now. I’m having trouble downloading the Gifts in Wills Guide Arrow icon If you’re experiencing issues with the download form this is likely because the form wasn't completed fully. Or because you have not entered the name that we have connected to your email address on our database. Please try to enter exactly the same name and email address that you have used with us in the past, and we will be able to process your request.If the problem persists, we are happy to request the Gifts in Wills guide on your behalf. Please call us on 0300 200 1331 or email giftsinwills@oxfam.org.uk to request your free guide.Alternatively, we are happy to book your free Will for you. Please email your full address, a telephone number and which service you would like to use to giftsinwills@oxfam.org.uk. Or you can call 0300 200 1331 between the hours of 9am -5pm, Monday to Friday and we’ll book your free Will for you. Also in this section Information for executorsOxfam’s Free Will Offer Any other questions? Simply call 0300 200 1331 to speak to one of our Gifts in Wills Advisors or email giftsinwills@oxfam.org.uk. Tackling climate change Read Jessy's story Meet our supporters The people leaving Oxfam a gift in their Will and why In memory donations Find out more What I’m trying to do is make the best use of the small amount I have to give.” Nicky, Oxfam supporter Also in this section Contact us Meet our supporters Oxfam's free Will offer How to leave a gift in your Will Information for Executors In memory donations A gift of support for the next generation Leave a legacy, stay in the fight Gifts in Wills Events Remember a Charity Week"
year_published = 2025
