["https://oxfam.org.uk/donate/leave-gift-your-will/guide-for-executors"]
title = """
Information for Executors    | Oxfam GB"""
description = "If you're an executor of somebody's Will, here's what you need to know."
full_description = "Also in this section Contact us Meet our supporters Oxfam's free Will offer How to leave a gift in your Will Information for Executors In memory donations A gift of support for the next generation Leave a legacy, stay in the fight Gifts in Wills Events Remember a Charity Week Abbie Trayler-Smith/Oxfam Toggle quote I know for sure that my mother’s money has been spent in the most moral way possible” Nessy, Oxfam supporter Information for Executors Home Donate now Leave a gift in your will to Oxfam If you’re administering an estate which includes a gift to Oxfam, or you’re adding Oxfam to a Will, we’re here to help. We hope it brings you some comfort knowing that, by remembering Oxfam in their Will, your loved one’s values live on. Their kindness will continue to create positive change – and that’s something to be really proud of.Above all, their gift will support people who are lifting themselves out of poverty – helping us all to build a fairer world. Things to think about Inheritance tax Arrow icon To find out if this is payable, check the current threshold for Inheritance Tax on the Government’s website.If the estate you’re administering is worth more than the threshold, you’ll need to ensure charitable relief is claimed from the Capital Taxes Office. More guidance on how to do this can be found on the Government’s website.If your loved one’s estate is complex for tax purposes, we would always recommend that you seek independent legal advice.If you are struggling with tax related issues when executing a Gift to Oxfam, please contact citizens advice and they’ll be able to help you. Capital gains tax Arrow icon Capital Gains Tax must be paid if the value of an asset, for example shares, has risen since the date of your loved one’s death.Charities are exempt from this tax, however. This means you’ll need to sign a Memorandum of Appropriation, which says you’re selling the donated asset (or the part which has been left to Oxfam) on our behalf. For more guidance on capital gains tax when executing a charitable gift, you can visit the Government’s website.If your loved one’s estate is complex for tax purposes, we would always recommend that you seek independent legal advice. Income tax Arrow icon Income tax is still payable on the administration of the estate. Charities can, however, recover some of this.In order for us to do this, please send us a completed HMRC form. This is available on the Government’s website, or from us.If your loved one’s estate is complex for tax purposes, we would always recommend that you seek independent legal advice Property Arrow icon If there’s property in the estate, we’d really appreciate a copy of the estate agent’s valuation.We normally ask that two valuations be done to make sure the property is being marketed at the right price. Once this has been completed, please send the valuations to executorsandwills@oxfam.org.uk. Paying a Pecuniary Gift Arrow icon For a pecuniary gift (a fixed, payable amount such as £5000), Oxfam only needs to know the name of the supporter who has left the gift.All our Will administration is dealt with at our Head Office. When you are ready to do so, please send the gift and any correspondence to the Oxfam Legacy Department.If you’d prefer to send the gift by bank transfer, please contact our gift in Wills advisors at executorsandwills@oxfam.org.uk, so that we can track the safe receipt of the gift into Oxfam’s account. Sending documents to Oxfam Arrow icon As executor of a residuary gift, we’ll need some important information from you to make sure we’re complying with charity law.Please send us:A copy of the Will, including any codicilsA brief summary of the assets and liabilities in the estateA copy of the valuations for any propertyA valuation of stocks and shares in the estateWhen the estate is finalised, a copy of the estate accounts What address should I post documents to? Arrow icon Our address is:Oxfam GBOxfam HouseJohn Smith DriveOxfordOX4 2JYOur registered charity number in England and Wales is (no 202918) and in Scotland is (SC039042). Nessy’s Oxfam Legacy When Nessy’s mum left a gift in her Will to Oxfam it was no surprise to Nessy. She didn’t even query that it was the right choice. Her mother stayed true to her principles and for their family it was as a powerful celebration of her life. Read Nessy's story Executing a Will Who should I appoint as an executor? Arrow icon You can have up to four executors to deal with your wishes. These could be friends, family, or a professional such as your solicitor. Beneficiaries of your Will can also be executors.Whoever you choose, make sure you ask their permission. I’m an executor – what should I do? Arrow icon If you’re acting as executor for someone who has left a gift to Oxfam in their Will, we can help. Please call us on 0300 200 1331 or email executorsandwills@oxfam.org.uk Can Oxfam be my executor? Arrow icon As Oxfam GB has Trust Corporation status you can choose to name Oxfam GB as an executor if needed, however please be aware that due to limited in-house capacity we will then have to instruct solicitors to deal with the estate on our behalf. For this reason we advise that you appoint solicitors or trusted individuals to administer your Will instead. We would recommend choosing at least 2 executors. Useful links If you need more information, visit:The Government’s site about being an executorThe Citizen’s Advice Bureau’s step-by-step guide Any other questions? Simply email our Gift in Wills Specialists at executorsandwills@oxfam.org.uk and one of the team will promptly respond to your query. Tackling climate change Read Jessy's story Meet our supporters The people leaving Oxfam a gift in their Will and why In memory donations Find out more I know for sure that my mother’s money has been spent in the most moral way possible” Nessy, Oxfam supporter Also in this section Contact us Meet our supporters Oxfam's free Will offer How to leave a gift in your Will Information for Executors In memory donations A gift of support for the next generation Leave a legacy, stay in the fight Gifts in Wills Events Remember a Charity Week"
year_published = 2025
