description = "By giving shares to Oxfam you are you are joining people all over the world who are working to bring lasting solutions to poverty and suffering."
full_description = "Also in this section People's Postcode Lottery Charity gifts Donate your time Donate shares Knitting for Oxfam Donate a car Donate your old phones and tablets Payroll giving Donate shares to charity Home Donate now More ways to donate By giving shares to Oxfam you are doing something really amazing - you are joining thousands of people, all over the world, who are working to bring lasting solutions to poverty and suffering. Why should I donate shares to charity? Donating shares to Oxfam can raise much-needed cash for our work and it may have tax advantages for you too. What will Oxfam do with my share donation? It is Oxfam's policy that, when we receive gifts of shares, we sell them as soon as is practicable. This is because if we held on to them their value might change and we believe that we should not speculate with gifts entrusted to Oxfam, but use them as soon as possible to support communities around the world to beat poverty. How to donate shares to Oxfam Donating shares to Oxfam can raise much-needed cash for our work and it may have tax advantages for you too. Find out more about donating or transferring shares to Oxfam.Contact us by email at giving@oxfam.org.uk or by telephone on 0300 200 1300. Get in touch Donating shares can seem a complicated business. Contact us at giving@oxfam.org.uk or by telephone on 0300 200 1300 and we will be happy to guide you through the process. Also in this section People's Postcode Lottery Charity gifts Donate your time Donate shares Knitting for Oxfam Donate a car Donate your old phones and tablets Payroll giving"
