title = """
Fundraise for Oxfam | Raise money for charity    | Oxfam GB"""
description = "Great fundraising events, ideas and inspiration to help you raise money to help people living in poverty."
full_description = "Fundraising Resources Check out our resources to help you put on your own event Find out more Fundraise for us Whether it’s bake sales, running a marathon or putting on your very own gig – there are so many great fundraising opportunities. The money you raise will go towards supporting our partners and communities who know best how to tackle the challenges they face. Take a look at some ideas below to help get you started. Thank you for beginning your fundraising journey with us, we’re so excited to have you as part of our community! Fundraise by myself Find out how to fundraise as an individual for Oxfam Fundraise as a community Find out how to fundraise as a community for Oxfam Fundraise at school or university Find out how to fundraise at school or university for Oxfam Fundraise at work Find out how to fundraise at work for Oxfam Plan your fundraising We've got loads of ideas, tips and resources to make your fundraising event a success. Charity Challenge Events Taking part in a fundraising event is a great way to help you raise money for Oxfam. Fundraising checklist Find out how to fundraise as an individual for Oxfam After your event Once you've raised your money you can pay it in online, over the phone or by post. Fundraising resources Find out how to fundraise as an individual for Oxfam Secret Supper Club Host the ultimate supper party, and unite against inequality. Frequently asked questions Can I claim Gift Aid on the funds I have raised? Arrow icon To claim Gift Aid on your fundraising, we must have the first name or initials, last name, full home address and postcode of each individual donor/sponsor. So please encourage them to tick the Gift Aid box on your sponsorship form when they sponsor you. Without these details we can't claim Gift Aid. How can I run the London Marathon, or another race, or Oxfam? Arrow icon Visit our fundraising events page to find out. I'm planning a fundraising event at my school. Can I fundraise for something specific? Arrow icon You can fundraise for a particular item in our fantastic Oxfam Unwrapped catalogue. You can buy lots of things from a school desk and chair to a whole classroom! To find out more, give our friendly Oxfam Unwrapped team a call on 0870 410 5030. (Monday to Friday – 9am to 8pm, Saturday and Sunday – 10am to 5pm).More information on educational support for fundraising in schools, including DEA guidelines. Can my fundraising go towards emergency response work? Arrow icon Yes. You can donate to or fundraise for individual emergency appeals and our emergency fund, which helps fund our humanitarian response work worldwide all year round. Can I use your logo on my mobile, product or publicity materials? Arrow icon You cannot change the logo in any way and you must ensure that you represent Oxfam correctly. Commercial organisations are not permitted to use Oxfam's name or logo without our prior written consent – contact privatesector@oxfam.org.uk if you want to get a company involved who may want to use our name. You can download the Oxfam logo here. What events does Oxfam do? Arrow icon Browse our fundraising events section to see what's on and to find something to suit you."
