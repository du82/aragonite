["https://oxfam.org.uk/donate/donate-to-our-shops/faq-about-donated-goods"]
title = """
Questions about donating to Oxfam shops    | Oxfam GB"""
description = "Find answers to frequently asked questions about donating goods to Oxfam."
full_description = "Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability Volunteer Jeff and Shop Manager Scott at the counter in Kensington Garden's Bookshop in Brighton. Photo: Gabi Torres / Oxfam. Donate clothes by post Ready to raid your wardrobe? Order your free Oxfam donation bag to fill with your pre-loved clothes and accessories. Get your free donation bag Questions about donating to our shops Home Donate now Donate to our charity shops Find answers below to frequently asked questions about donating goods to Oxfam. Can I donate clothes to Oxfam by post? Arrow icon Yes, we can accept donations of clothing and light accessories by post. Simply order a postbag, fill it with any items you’d love to go to a new home, print off a label or get a digital barcode and send it back via DPD for free! Your donated items will be listed on Oxfam Online Shop.Donate clothes by post Can Oxfam collect my donation from home? Arrow icon It is not usually commercially viable for most shop teams to collect donations from your home. However, collections can sometimes be arranged locally, so it's worth asking your local shop (contact details can be found on our Shopfinder). Our furniture shops (which you can also find through our Shopfinder) do offer a local collection service.If you have something particularly valuable to donate, please mention this when you call. Can you reclaim gift aid on goods I donate to an Oxfam shop? Arrow icon Yes, we can. Signing up to Gift Aid in your local shop or online means that every time you tag your bag of donations with your unique donor number, we can raise a life-changing 25% more from the government at no cost to you.Find out more about Gift Aid in our shops I donated an item to my local shop by mistake. Can I get it back? Arrow icon We will do our best to return any item that you have donated to Oxfam by mistake. Please contact or Retail Support Team for advice - support@oxfam.org.uk What can I give to Oxfam for recycling? Arrow icon Oxfam and its recycling partners can help turn mobile phones, gadgets and computers into money - to go towards our work around the world to end poverty. Find out more on how and what to recycle with Oxfam. How does Oxfam set prices? Arrow icon We do not set prices centrally. Oxfam is very lucky to receive so many good quality donations from the public and we believe the best way to thank our donors for their generosity is to get the best price we can for their donation (which in turn raises as much money as possible for Oxfam's work).Based on this principle, each individual shop team creates their own price list, using their judgement to decide what prices and products will best suit customers in their location. Can I donate items like clothing and blankets to help people in emergencies? Arrow icon Clothes and blankets are among the many items we can sell in our shops here to raise funds, but Oxfam does not send clothes and blankets overseas, however good their condition. This is because customs regulations, fumigation of second-hand items, transport and communications make the process of exporting second hand items very complicated, time-consuming and expensive.It is much easier to buy these items (with the money our supporters donate) in the countries where they are needed. It reduces the cost to Oxfam, helps stimulate local markets and economies, and we can be sure that the goods that we source are appropriate – both for the local environment and the local culture.There are many local initiatives in countries we work in where women knit or make clothes, and Oxfam tries to support them by buying their products and distributing them through its programmes. This ensures women can learn new skills, earn an income and support their families, buy crops, send their children to school, and get the healthcare they need.That's why making a cash donation is one of the most effective ways to support our emergency work. Contact us Not found what you're looking for? Contact us Discover More Donate items by post The easy way to donate items for free from home. Pack and send or request a bag for free to help raise money to fight poverty and reduce landfill. Gift Aid your shop donations Tag your bag to raise a life-changing 25% more when your donated items sell thanks to Gift Aid. What we can sell in our shops Your unwanted items could give someone a future free from poverty. Find out what we can and can't turn into life-changing cash. Also in this section What we can sell in our shops Where your donation goes Gift Aid your shop donations Marks and Spencer and Oxfam’s Another Life scheme Find your local Oxfam shop Questions about donating to our shops Donate items by post Donate foreign currency Donating books Donating Toys and Games Donate clothes Sustainability"
year_published = 2025
