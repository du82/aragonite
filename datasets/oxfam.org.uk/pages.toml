["https://www.oxfam.org.uk/oxfam-in-action/current-emergencies"]
title = """
Current emergencies | Support Oxfam's Emergency response    | Oxfam GB"""
description = "When conflicts and disasters strike, Oxfam gets there fast, making sure people can keep themselves and their families safe."
full_description = "Lebanese people search for their belongings in a damaged building after Israeli strikes on South Lebanon on 23 September, in the village of Al Aqbieh near Sidon, South Lebanon. Image: STR/EPA-EFE/Shutterstock Donate to Gaza and Lebanon A donation from you can help our teams respond. Donate now When an emergency hits, Oxfam is there. Emergencies We help people caught up in disasters and conflicts across the world, giving life-saving support to those most in need and helping people rebuild their communities. Emergency response When disaster strikes, we work in solidarity with communities and partner organisations on the frontline of the crisis. Donate now Gaza crisis: sign our petition Call for a permanent ceasefire, unrestricted humanitarian access and a path to justice. Sign the petition What's happening in Gaza and Israel? The situation in Gaza and Israel is fast-moving and at times confusing. Here's what's happening, and what you can do to help. Read more Other emergencies DRC Crisis Appeal Renewed fighting around the city of Goma and across North Kivu in the Democratic Republic of Congo (DRC) has displaced hundreds of thousands of people. Donate now Bangladesh Floods Appeal Over five million people have been affected by the worst flash floods in Bangladesh. Millions of people have been displaced and left many without access to basic things like food and clean water. Donate now Southern Africa Food Crisis Appeal Droughts caused by The El Nino (climate pattern) have led to a food crisis in Southern Africa. Oxfam in Southern Africa are responding with partners and local networks. Please donate what you can today. Donate now East Africa Hunger Crisis Millions of people in East Africa countries South Sudan, Ethiopia, Somalia and Kenya are facing extreme hunger – many on the brink of famine. This tragedy can be averted if we act now. Donate now Yemen Crisis Appeal Years of war and conflict in Yemen has left widespread cholera and emergency numbers of people in need of clean water and other basics. Donate now Pakistan Floods Appeal Homes, farms and infrastructure have been swept away in devasting floods. Lives have been lost. Please give whatever you can today. Donate now Syria Appeal Oxfam is committed to recommence aid delivery to Syrians as soon as the situation allows. Donate now Morocco Earthquake Appeal More than 2,900 people were killed and thousands injured in Morocco following a devastating earthquake. Oxfam's response Cyclone Mocha People were killed and infrastructure destroyed when Cyclone Mocha hit western Myanmar. Thousands of people were displaced within the country. Oxfam's response Turkey-Syria Earthquake Appeal Find out more about how Oxfam and partners are responding to the earthquakes in Türkiye (Turkey) and Syria. Oxfam's response Ukraine Humanitarian Crisis In February 2022, war started in Ukraine. Since then, people in Ukraine have faced unimaginable suffering, with no signs of stopping. Regular waves of attacks on energy infrastructure continue to cause destruction. Oxfam's response Rohingya crisis appeal Hundreds of thousands of Rohingya people fled Myanmar for Bangladesh. Oxfam is helping create long-term sustainable refugee camps there. Oxfam's response View more Fabeha Monir/ Oxfam Oxfam Emergency Response When disaster strikes, Oxfam and partners are there."
