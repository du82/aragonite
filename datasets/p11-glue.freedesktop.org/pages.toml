["https://p11-glue.freedesktop.org/p11-kit.html"]
title = "p11-kit"
full_description = "Project: p11-kit Provides a way to load and enumerate PKCS#11 modules. Provides a standard configuration setup for installing PKCS#11 modules in such a way that they're discoverable. Also solves problems with coordinating the use of PKCS#11 by different components or libraries living in the same process. Implementations and Integration Drop in compatible with any application or library that can use PKCS#11 modules. Some additional benefits are gained from integrating directly. Glib Library GTlsDatabase PKCS#11 database: Will use p11-kit to load PKCS#11 modules, and load configuration (In progress). Gck Library: Use p11-kit to load and enumerate PKCS#11 modules. Use p11-kit to parse PKCS#11 URIs (In progress). Gcr Library: Use p11-kit to load configuration for looking up and storing trust assertions (In progress). Documentation All Documentation API Reference Source Code The source code releases are available for download here: https://github.com/p11-glue/p11-kit/releases The release keyring is available for download here: https://p11-glue.github.io/p11-glue/p11-kit/p11-kit-release-keyring.gpg The source code is available via git, or browsable online. $ git clone https://github.com/p11-glue/p11-kit Contributing Mailing list: p11-glue@lists.freedesktop.org Bugs: github issue tracker Guide to building, contributor and packaging."
