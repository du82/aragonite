title = "PKCS#11 Support"
full_description = "PKCS#11 Support This project is all about using providing the glue so that different crypto libraries and apps can provide consistent experience for users and developers. This is possible because PKCS#11 is supported by so many applications. The support for PKCS#11 is not obviously not consistent across the board, but that will improve as PKCS#11 becomes more used. Here is an incomplete list (a-z): Libraries Gnome Keyring GnuTLS Java Mozilla NSS OpenSC PAM QCA Solaris Applications Empathy Evolution Firefox Google Chrome OpenSSH OpenVPN Subversion Strong Swan Thunderbird Truecrypt Patched or in Progress Glib OpenSSL"
