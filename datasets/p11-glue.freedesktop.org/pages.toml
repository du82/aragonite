["https://p11-glue.freedesktop.org/revocation-cache.html"]
title = "Common Revocation Lists"
full_description = "Project: Common Revocation Lists This is a cache of OSCP responses (via a proxy) and CRLs (via a PKCS#11 module) so applications and crypto libraries can share their queries and responses as desired. Rather than each application or library downloading and caching their own copy of the CRLs, this module and accompanying daemon, keeps track of and updates CRLs. Applications then access this information in a consistent manner. Documentation Still in proposal/conceptual stages. Source Repository No source available yet. Implementations and Integration Still being planned. Contributing Mailing list: p11-glue@lists.freedesktop.org Bugs: github issue tracker"
