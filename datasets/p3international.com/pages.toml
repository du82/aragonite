["https://p3international.com/faq/faq_telephone_recorders.html"]
title = "P3 - FAQ - Telephone Recorders"
full_description = "Home > FAQs > Molechasers P5070, P5075 & P5090 Telephone Recorders w/ Caller ID Q: What is the difference between L, T, and V for record mode on the back of the recorder? A: REC mode of the P5070/ P5090 has three settings. They are L (LINE), T (TIME), and V (VOICE ACTIVATION). LINE activation is used when the user wants to recorder a conversation from beginning to end. When the user answers the phone or picks up the handset to place a call, the recorder will start to record. When the handset is placed back down and the call discontinued the P5090 will stop recording. The P5090 only records when the LINE is activated and stops when the line is deactivated. To activate LINE activation, place the switch on L in REC MODE. TIME mode is very similar to LINE activation. The only difference is that the P5090 will only record a certain amount of time of each conversation at the beginning. The time is set by the user from1-9 minutes. The 1-9 minutes can be set in the menu of the recorder under RECORD DURATION. When the line becomes active, the P5090 will start to record and when the pre set time is finished, the P5090 will stop recording. To activate TIME mode, place the switch on T in REC MODE. If the minutes are set in RECORD DURATION but REC MODE is not set to T, TIME mode will not be active. VOICE Activation is another mode available. When the P5090 senses voice or noise through the handset, the P5090 will start recording. If there are quiet areas in a conversation, the P5090 will stop and begin again when the conversation proceeds or something is said. This is a feature used to decrease the amount of cassette used during conversation. To activate VOICE activation, place the switch on V in REC MODE. The voice sensitivity can also be adjusted which can be done underneath the recorder next to the reset button. Q: How do I connect the P5090, P5070, P5075 or P5085 to a digital phone system or a PBX? A: The P5090 is designed to record analog signals. As it cannot record digitally it cannot be connected to the digital telephone line (between the PBX and the telephone set). The unit can be used with a multi-line digital system in two ways. 1. Connect the unit directly to an analog POTS line external to the PBX. All features of the P5090 would be available to you. You would require one P5090 per line for full coverage. If the PBX uses external digital lines (ISDN, T1, etc.) this option is not available to you. 2. Connect the unit to the handset of the digital telephone set using the included handset adapter. You must use the P5090 in Voice Controlled mode or start and stop the recording manually. The P5090 would record only the connected telephone set. No other telephones would be recorded. Connected in this manner, features such as caller ID, and timer mode are not available. Q: How do I access the menu of the recorder? A: Press and hold the east key first. Now press and hold the west key. Release both keys and you are now in the menu. Q: Do these recorders have auto- reverse? A: No. When one side of the cassette is finished, you have to manually turn the cassette to the other side to continue recording. Q: Could the unit be used with cordless phones? A: Yes. Cordless phones do not interfere with the functions of the unit. The unit has to be used in Line or Time mode. Q: The problem I'm having is that when I want to record on line activation it starts recording and doesn't stop or other features are not working properly. What could possibly be the problem? A: Your problem stems from incorrect voltage settings on the back of the recorder. My suggestion is to change the voltage on the recorder. First make sure no buttons are pressed on the unit. On the back of the unit to the right are 3 voltage switches. The default setting is switch 1 up, 2 down and 3 down. This is the preset to match the line for standard telephone lines (-48VDC). If the voltages do not match between the recorder and the telephone line, the recorder may malfunction. Change switch 1 down, 2 up, and 3 down. Try the recorder. If that does not help, place switches 1 and 2 down and 3 up. Now try the recorder. Q: Can I place the recorder on a different jack from the telephone? A: Yes. You may place the recorder a different jack from the telephone as long as the jack is on the same telephone line. Q: How much recording time do I get out of a standard 60 minute cassette on extended mode? What about a 120 cassette? A: Using a 60 minute cassette on extended mode, the user can expect approximately 2.5- 3 hours of recording time. Using a 120 cassette, the user can expect over 5 hours of recording time. Q: While playing back the cassette after using Voice Activation, I noticed a set of tones and beeps. What is that? A: If you use the VCS mode during a phone call, and there is an extended moment of silence, the tape will stop recording. At this moment, a Time and Date Stamp will be placed in the cassette and the call counter will increment. During playback, the Time and Date Stamp will be displayed during the conversation. The tones and beeps are the Time and Date stamp. Q: I plugged the unit in but nothing is displayed on the LCD. What can I do? A: Simply hit the reset button. Q: Can I keep the batteries placed in the unit while using the AC adaptor? A: Do not keep the batteries in the unit while using the AC adaptor. This may cause severe damage to the unit. Use either batteries or the adaptor at any one time. Q: When using VCS, the unit frequently stops. Why? A: The VCS sensitivity need to be adjusted. Turn the unit to its underside. Using a small flathead screwdriver, turn the sensitivity screw clockwise; which will increase sensitivity. Counter clockwise will decrease sensitivity. THE FOLLOWING ONLY APPLIES TO THE P5070 AND THE P5090 Q: Why doesn’t my Caller ID work? A: The user has to have the Caller ID service activated from the local telephone company. If they do not subscribe to the service, the Caller ID feature on the recorder will not work. The Caller Id will only work in Line or Time mode. Caller ID will not work if the user is using VCS. Also, be aware that the Caller ID information is sent through your telephone line between the first and second rings. If the phone is answered before this information is sent completely, the recorder will not be able to display the information. Q: Does the name of the caller get recorder on the cassette while using the Caller ID feature? A: No. Only the time and date are stamped on the cassette. The name of the caller is stored on the LCD. Press the South key to display the Caller ID Name. Q: How do I erase the Caller Id information stored on the LCD? A: To erase all Caller ID information, when the unit is in Stand By mode with no keys pressed, Press the North key. The unit will request confirmation (RAM ERASE OK?) then press South. The unit will conform the Ram has been erased. If the LCD displays RAM FULL, follow this process. THE FOLLOWING ONLY APPLIES TO THE P5075 Q: Why don’t I see the telephone number of the calling party on the LCD? A: The P5075 does not display the telephone number of the calling party because it does not have Caller ID. The P5070 and P5090 offer Caller ID. Q: What data does the P5075 store on the cassette? A: The P5075 stores TIME and DATE of inbound and outbound calls. Dialed Numbers will be displayed on the LCD during playback. Name info is not stored on the cassette. THE FOLLOWING ONLY APLLIES TO THE P5080Q: Will this unit work on a multi- line environment (PBX) ? A: No. This unit is not compatible with multi-line systems. THE FOLLOWING ONLY APPLIES TO THE 5085 Q: How much recording time do I get out of a standard 60 minute cassette on extended mode? What about a 120 cassette? A: Using a 60 minute cassette on extended mode, the user can expect approximately 4 hours of recording time. Using a 120 cassette, the user can expect 8 hours of recording time. Home | Energy Savers | Solar Living | Animal Chasers | Problem Solvers | About P3 | FAQs | Support | Contact | Sitemap © 2018 P3 International Corporation. All rights reserved."
