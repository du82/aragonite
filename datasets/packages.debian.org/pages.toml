title = "Debian -- Details of package cd-circleprint in bookworm"
full_description = "package names descriptions source package names package contents all options [ buster ] [ bullseye ] [ bookworm ] [ trixie ] [ sid ] [ Source: cd-circleprint ] Package: cd-circleprint (0.7.0-6) Links for cd-circleprint Debian Resources: Bug Reports Developer Information Debian Changelog Copyright File Debian Patch Tracker Download Source Package cd-circleprint: [cd-circleprint_0.7.0-6.dsc] [cd-circleprint_0.7.0.orig.tar.gz] [cd-circleprint_0.7.0-6.debian.tar.xz] Maintainer: Debian QA Group (QA Page) External Resources: Homepage [sourceforge.net] Similar packages: libpostscript-simple-perl jack libcgi-formbuilder-perl libpostscript-perl a2ps genisoimage zegrapher python-pretty-yaml python3-pretty-yaml liblexical-failure-perl libgd-securityimage-perl prints round cd-labels cd-circleprint is a program to create round cd-labels written in perl, using perl-tk to produce a graphical frontend. The labels have four lines of nice curved text and an additional four fields with normal text. Each field has selectable text-size, font and colour. The background colour is also selectable. The label may also have a background image. You can squeeze the whole page if your printer doesn't generate correct circles and you can move the two labels on the sheet to accommodate different types of label sheets. The output is postscript to make it as portable as possible. Tags: Hardware Enablement: Storage, CD reader, Role: Program, Purpose: Printing Other Packages Related to cd-circleprint depends recommends suggests enhances dep: perl Larry Wall's Practical Extraction and Report Language dep: perl-tk Perl module providing the Tk graphics library sug: gv PostScript and PDF viewer for X sug: imagemagick image manipulation programs -- binaries also a virtual package provided by graphicsmagick-imagemagick-compat, imagemagick-6.q16 Download cd-circleprint Download for all available architectures Architecture Package Size Installed Size Files all 77.8 kB174.0 kB [list of file