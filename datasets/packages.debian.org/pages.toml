title = "Debian -- Details of package apt-listbugs in buster"
full_description = 'package names descriptions source package names package contents all options [ buster ] [ bullseye ] [ bookworm ] [ trixie ] [ sid ] [ Source: apt-listbugs ] Package: apt-listbugs (0.1.28) Links for apt-listbugs Debian Resources: Bug Reports Developer Information Debian Changelog Copyright File Download Source Package apt-listbugs: [apt-listbugs_0.1.28.dsc] [apt-listbugs_0.1.28.tar.xz] Maintainer: Francesco Poli (wintermute) (QA Page) External Resources: Homepage [salsa.debian.org] Similar packages: how-can-i-help reportbug-gtk debbugs devscripts reportbug lintian apt-cacher debbugs-local piuparts apt-listchanges apt-offline-gui tool which lists critical bugs before each APT installation apt-listbugs is a tool which retrieves bug reports from the Debian Bug Tracking System and lists them. Especially, it is intended to be invoked before each installation/upgrade by APT in order to check whether the installation/upgrade is safe. Many developers and users prefer the unstable version of Debian for its new features and packages. APT, the usual upgrade tool, can break your system by installing a buggy package. apt-listbugs lists critical bug reports from the Debian Bug Tracking System. Run it from within the APT session, in order to see whether an installation or upgrade is known to be unsafe. Other Packages Related to apt-listbugs depends recommends suggests enhances dep: apt (>= 0.9.11) commandline package manager dep: ruby Interpreter of object-oriented scripting language Ruby (default version) or ruby-interpreter Package not available dep: ruby-debian (>= 0.3.3) ruby interface for dpkg dep: ruby-gettext (>= 3.0.2) gettext for Ruby dep: ruby-soap4r SOAP library for the Ruby programming language dep: ruby-unicode Unicode string manipulation library for Ruby dep: ruby-xmlparser Ruby interface for the expat XML parser toolkit rec: ruby-httpclient (>= 2.1.5.2-1) HTTP client library for ruby rec: s6 small and secure supervision software suite sug: report