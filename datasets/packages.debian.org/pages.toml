title = "Debian -- Details of package cd-paranoia in bookworm"
full_description = "package names descriptions source package names package contents all options [ bullseye ] [ bookworm ] [ trixie ] [ sid ] [ Source: libcdio-paranoia ] Package: cd-paranoia (10.2+2.0.1-1) Links for cd-paranoia Debian Resources: Bug Reports Developer Information Debian Changelog Copyright File Debian Patch Tracker Download Source Package libcdio-paranoia: [libcdio-paranoia_10.2+2.0.1-1.dsc] [libcdio-paranoia_10.2+2.0.1.orig.tar.gz] [libcdio-paranoia_10.2+2.0.1-1.debian.tar.xz] Maintainer: Philippe SWARTVAGHER (QA Page) External Resources: Homepage [www.gnu.org] Similar packages: libcdio-paranoia-dev libcdio-paranoia2t64 libcdio-paranoia2 libcdio-utils jazip racon libdevice-cdio-perl sdparm cdtool mp3cd libchdr0 audio CD reading utility which includes extra data verification features cd-paranoia retrieves audio tracks from CDDA capable CD-ROM drives. The data can be saved to a file or directed to standard output in WAV, AIFF, AIFF-C or raw format. Most ATAPI, SCSI and several proprietary CD-ROM drive makes are supported; cd-paranoia can determine if the target drive is CDDA capable. In addition to simple reading, cd-paranoia adds extra-robust data verification, synchronization, error handling and scratch reconstruction capability. This version uses the libcdio library for interaction with a CD-ROM drive. The jitter and error correction however are the same as used in Xiph's cdparanoia. Other Packages Related to cd-paranoia depends recommends suggests enhances dep: libc6 (>= 2.34) GNU C Library: Shared libraries also a virtual package provided by libc6-udeb dep: libcdio-cdda2 (>= 10.2+2.0.0) library to read and control digital audio CDs dep: libcdio-paranoia2 (>= 10.2+2.0.0) library to read digital audio CDs with error correction dep: libcdio19 (>= 2.1.0) library to read and control CD-ROM Download cd-paranoia Download for all available architectures Architecture Package Size Installed Size Files amd64 36.2 kB89.0 kB [list of files] arm64 34.3 kB89.0