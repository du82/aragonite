title = "Debian -- Details of package cde in bookworm"
full_description = "package names descriptions source package names package contents all options [ buster ] [ bookworm ] [ trixie ] [ sid ] [ Source: cde ] Package: cde (0.1+git9-g551e54d-1.2) Links for cde Debian Resources: Bug Reports Developer Information Debian Changelog Copyright File Debian Patch Tracker Download Source Package cde: [cde_0.1+git9-g551e54d-1.2.dsc] [cde_0.1+git9-g551e54d.orig.tar.gz] [cde_0.1+git9-g551e54d-1.2.debian.tar.xz] Maintainers: NeuroDebian Team (QA Page) Yaroslav Halchenko (QA Page) Michael Hanke (QA Page) External Resources: Homepage [www.pgbovine.net] Similar packages: python-briefcase-doc capsule-nextflow cl-consfigurator ptex2tex backuppc cmake-qt-gui libsimde-dev snakefood cmake-curses-gui chiark-utils-bin nvidia-kernel-dkms package everything required to execute a Linux command on another computer CDEpack (Code, Data, and Environment packaging) is a tool that automatically packages up everything required to execute a Linux command on another computer without any installation or configuration. A command can range from something as simple as a command-line utility to a sophisticated GUI application with 3D graphics. The only requirement is that the other computer have the same hardware architecture (e.g., x86) and major kernel version (e.g., 2.6.X) as yours. CDEpack allows you to easily run programs without the dependency hell that inevitably occurs when attempting to install software or libraries. Typical use cases: 1. Quickly share prototype software 2. Try out software in non-native environments 3. Perform reproducible research 4. Instantly deploy applications to cluster or cloud computing 5. Submit executable bug reports 6. Package class programming assignments 7. Easily collaborate on coding projects Other Packages Related to cde depends recommends suggests enhances dep: libc6 (>= 2.14) [amd64] GNU C Library: Shared libraries also a virtual package provided by libc6-udeb dep: libc6 (>= 2.28) [i386] Download cde Download for a