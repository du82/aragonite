["https://pageandpalette.com/bookrecommendations/2025/2/4/book-night-2025"]
title = "BOOK TALK WITH ANDERSON, TYLER, STACY & CAROLYN - FEBRUARY 2025 — Page & Palette"
description = "At our quarterly Book Talk event, P&amp;P staff discuss their favorite new and upcoming releases of the season. Purchases and special orders that night receive a 10% discount!  Our last Book Talk was in February 2025, with Stacy, Anderson, Carolyn and Tyler! Here’s the list in case you missed it"
full_description = '''BOOK TALK WITH ANDERSON, TYLER, STACY & CAROLYN - FEBRUARY 2025 February 4, 2025Justin Seagull Stan At our quarterly Book Talk event, P&P staff discuss their favorite new and upcoming releases of the season. Purchases and special orders that night receive a 10% discount!Our last Book Talk was in February 2025, with Stacy, Anderson, Carolyn and Tyler! Here’s the list in case you missed it! <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007178778-RPIZTTJLND1OVLZVP2ZE/81Yh-lWCxfL._SL1500_.jpg" alt="81Yh-lWCxfL._SL1500_.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007179457-67VAC05CU04SYVGVHEJT/The%2BFavorites%2BPolish%2BEdition.jpg" alt="The+Favorites+Polish+Edition.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007270007-6OF2ZP37ZXX02ZR2N7CD/LKMEMORIAL+cover+vertical.jpg" alt="LKMEMORIAL cover vertical.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007179659-LJUB58N5AAIF8WIK6SDV/211004079.jpg" alt="211004079.jpg" /> BOOK RECOMMENDATIONS, FEBRUARY ‘25A Killing Cold by Kate Alice Marshall (Out Now) AUTHOR EVENT - FEBRUARY 6THGripping, unexpected twists, suspenseful, and fast-paced, this book is the perfect winter thriller! A simple holiday trip to meet the future in-laws turns out to be anything but cozy - creepy text messages, mysterious footprints in the snow and buried secrets revealed. Filled with truly detestable characters and an endearing protagonist, A Killing Cold is an atmospheric cat-and-mouse game I could not put down! ~ANDERSONI was easily sucked into this mystery/thriller! It kept me guessing and suspecting everyone. ~ TylerAs the snow hit Fairhope, I grabbed this book, a quilt, and went along for the ride. All that Anderson said! Such a fun read. I never knew what was happening and I LOVE it! ~StacyThe Favorites by Layne Fargo (Out Now)Wow! I loved everything about Layne Fargo's exhilarating novel, THE FAVORITES. I raced through this epic love story set within the demanding, cut-throat world of competitive ice dancing. It's an unputdownable story filled with fascinating characters and all the drama we love both on and off the ice. A must read! ~AndersonI was gasping throughout this entire book! The drama had me at the edge of my seat and screaming out loud. Such an exhilarating read and I highly recommend it to anyone. -- TylerWild Dark Shore by Charlotte McConaghy (March 4th) PRE-ORDER ONLINE FOR SIGNEDCharlotte McConaghy's debut novel Migrations blew me away, but l'm completely undone by Wild Dark Shore. It is a breathtaking look at climate change's impact on a family as they complete their final days assigned to a remote outpost near Antarctica. Lyrical, powerful, heartbreaking and hopeful, McConaghy has written an unforgettable story of a fractured family and a stranger, who bond together to survive the harshest of circumstances. -- AndersonThis is my first book that I read by Charlotte McConaghy, and wow, I'm going to have to read her other books. Typically, I enjoy books based on the writing, plot, and characters. This book did excellent with all of those aspects, but the SETTING was the best part for me. It's a fictional remote island near Antarctica and it was just so beautiful and chilling to read. -- TylerMcConaghy's third book and I have loved each one. Everyone seems to be keeping a secret on this tiny island near Antarctica inhabited only by the Salt family until Rowan washes up on their shore. McConaghy's description of nature is passionate and poetic and the mystery taut with suspense. ~CarolynMemorial Days by Geraldine Brooks SIGNED FIRST EDITION AVAILABLEI have long been a fan of Brooks' writing, but I did not expect how completely blown away by her heartrending, beautifully written memoir. She alternates between the days immediately following the sudden death of her husband, Tony, Horowitz and the time she spends on a remote Australian island three years later. She isolated herself to finally find the space to grieve, to reflect on their life together, and chart a path forward. Heartfelt, insightful and unforgettable. ~Anderson <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007356622-SIIZP9FHFEBZXWDMHD3Z/GOOD-DIRT-012925-91b6e1fec5174c6b8b7702c40744d472.jpg" alt="GOOD-DIRT-012925-91b6e1fec5174c6b8b7702c40744d472.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007356243-MVZH1AS8R7K75SU7SWIG/OIP.jpg" alt="OIP.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007355825-13TYWKHAAQO373XW0693/24113X.jpg" alt="24113X.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007355596-6I3EAC8UWHKNNV9QFXKS/81Sk%2BX6mUTL._SL1500_.jpg" alt="81Sk+X6mUTL._SL1500_.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007355134-GVB5DB63WSQW506SVA9X/rosarita-9781668082430_xlg.jpg" alt="rosarita-9781668082430_xlg.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007450034-P6OFB6L1RP5VWET6SFTE/41l7fNXLCkL._SY445_SX342_.jpg" alt="41l7fNXLCkL._SY445_SX342_.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007354716-Q1FVWF6XG4OEJ2AL28NA/the-champagne-letters-9781668061886_hr.jpg" alt="the-champagne-letters-9781668061886_hr.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007354219-IW240LU80D0BYA07XX7J/5144s63cbEL._SY445_SX342_.jpg" alt="5144s63cbEL._SY445_SX342_.jpg" /> Good Dirt by Charmaine Wilkerson SIGNED FIRST EDITION AVAILABLEThis book is rich with layers, encompassing elements of historical fiction, family drama, mystery, and romance. The story centers around a prominent Black family with a deep-rooted history. The main protagonist, Ebby, experiences a life-altering event at the age of ten when her older brother is murdered during a home robbery. The crime remains unsolved, and the family becomes widely known due to this tragedy. Fast forward to the present day: Ebby travels to France to cope with being stood up on her wedding day, but her past follows her. ~TylerDoctored by Charles PillerFraud, Arrogance, and Tragedy in the Quest to Cure Alzheimer's. Shocking, but not surprising, Piller's exposition is well documented and responsibly researched. ~ CarolynUntethered, Angela Jackson-Brown SIGNED BOOKPLATESFor those who loved Kristin Hannah's The Women, this is a perfect follow-up. Set in the Vietnam era in Troy, Alabama, Katia Daniels is the Director of the Pike County Group Home for Negro Boys, the sister of brothers fighting in Vietnam, and the anchor for her mother and the community. Katia's responsibilities are extreme; she often acts as the buffer between circumstance and disaster, yet her optimism is relentless as she navigates difficult times. And then, Seth Taylor, a former high school friend, gives her a chance to build a life for herself, and boy, I really wanted her to have joy of her own! Great for fans of Colson Whitehead's Nickel Boys. We hosted a book event for Angela in late January and she was well received. ~ StacyWhat Happened to the McCrays? by Tracey LangeI love dynamic stories about complicated families whose love for each other transcends their conflicts.Tracey Lange's latest did not disappoint! In What Happened to the McCrays?, she has captured the essence of love, loss, and redemption. High school sweethearts Kyle and Casey were married for 16 years until they're torn apart by a tragedy. Kyle leaves town but returns to take care of his ailing father, but Pottstown is the last place he wants to be after he abandoned everyone he loved. He takes a job coaching hockey at the high school to try and make amends. A remarkable read for fans of Beartown and The Connelly's of County Down! -~ AndersonRosarita by Anita DesaiThough I'm still not entirely sure what I read, the beauty of this book lies in its dreamlike quality. Set against the backdrops of Mexico and India, Desai's is a gorgeously wrought novel. During an unexpected meeting with an elderly woman named Rosartia in a park in San Miguel, a daughter learns that her mother was once a luminous artist. The story unfolds with a possible history of her enigmatic mother. The Irish Independent captured it perfectly: "There is a dreamy and wistful mood to this very short gem, lulling in its revelations and comforting in its gentle appeal." The novel delves into questions of whether we ever truly know our parents and explores identities relinquished in adulthood. Desai, a three-time Booker Finalist, demonstrates why she is highly acclaimed. Rosarita is a lovely and evocative read that lingers like a beautiful dream. ~ StacyIsola by Allegra GoodmanThis one took me by surprise! Isola is a captivating novel of historical fiction about a wealthy 16th noblewoman, Marguerite de la Rocque. When we meet Marguerite, she is a child ruled by her cousin and guardian. Roberval. Roberval loses his money and starts to sell her holdings to replenish his coffers and fund his exploration. After she displeases him during a voyage to New France, he abandons them on a desolate island to fend for themselves, taking us on her journey from noblewoman to hunter. After two years, she is rescued and brought back to France to find her former home and friends. Beautifully written, this is an epic story that will keep you riveted to the last page. ~ AndersonThe Champagne Letters by Kate MacintoshThis delightful historical fiction transports you to Paris, France. It alternates between two perspectives present day Natalie, who is recently divorced and decides to take a spontaneous solo trip to Paris and 1805 Barb-Nicole Clicquot who ran her own champagne business. The author skillfully intertwines the stories of these two strong, independent women, highlighting their struggles and life lessons. It was really inspirational and fascinating to learn more about wine, champagne, and the Champagne Queen of Reims. ~TylerThe Life Cycle of the Common Octopus by Emma KnightMotherhood, an enduring friendship and a first love are the bones of this brilliantly told story. A charming Edinburgh and Scottish countryside setting is the backdrop as first year college student Pen tries to navigate her new independence while digging for the roots of an old family secret. ~ Carolyn <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007576508-V8OBALARUZ1S5XY4C7NC/914lxrTxtPL._SL1500_.jpg" alt="914lxrTxtPL._SL1500_.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007575882-5E1SVUGNKVQJSXJFN39L/OIP+%281%29.jpg" alt="OIP (1).jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007575193-R5PIAPTFRVYKRWJHTFWK/41M3TTgIO1L._SY445_SX342_.jpg" alt="41M3TTgIO1L._SY445_SX342_.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007575251-RJKRKW2QXSF2RHF1XOJZ/OIP+%282%29.jpg" alt="OIP (2).jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007611758-SZSSV0118HDOL5NVMAEI/51bPYvOoMKL._SY445_SX342_.jpg" alt="51bPYvOoMKL._SY445_SX342_.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007647777-NQYK9SG2EBF4CKK848WC/91iWmZDlThL._SL1500_.jpg" alt="91iWmZDlThL._SL1500_.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007646698-LG80ICVXQJ25FBUIEQIY/OIP+%283%29.jpg" alt="OIP (3).jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1740007646741-WKQYYC9K8HM36V0SRI5X/9781035021758.jpg" alt="9781035021758.jpg" /> Penitence by Kristin KovalA gripping novel of literary fiction with courtroom drama and a tremendous amount of suspense.Thirteen-year old Nora shoots her older brother Nico in Lodgepole, Colorado. Will she be tried as an adult or a juvenile? Is it second or first degree murder? Nora's defense attorney will be Julian, who was Angie's first love. Alternating chapters go back to the late 90's, when Angie and Julian were together and starting their careers in New York City. I thought this was going to be a mystery of why Nora shot her beloved brother, but it was much more - an expansive, engaging story filled with complex, imperfect characters wrestling with their pasts. ~ Anderson44 Poems On Being With Each Other by Padraig O'TuamaA must-read! The opening quote? "The very foundation of interhuman discourse is misunderstanding." - Lacan. Padraig O'Tuama is a gift to the world. While I always have a pile of books on my nightstand, O' Tuama never leaves. He curates poems that speak to him and then writes his musings about each. Why this matters is because his insights about the world, the human condition, and resilience are elevating. His hopeful position will feed your optimism and belief in humankind being kind-and when it isn't, well, he's there for you when the world or people fail you too. I can't speak enough about what Padraig offers. To give you an idea of his powers for good, he led the council of Irish Affairs for Reconciliation in Northern Ireland. He sheds light on our flaws and our opportunities to heal. O'Tuama is a masterclass in being the best versions of ourselves so we can truly contribute to the human race. ~ StacyThe Heart of Winter by Jonathan EvisonI wanted to crawl inside this beautiful novel! In The Heart of Winter, Jonathan Evison crafts an intimate portrait of a 70-year marriage, one that is both expansive and wonderfully precise in its attention to life's small, defining moments. Through the story of Abe and Ruth Winter, Evison explores how love endures not through grand gestures, but through the quiet acts of showing up day after day, year after year. Lovely, heartfelt and unforgettable. ~ AndersonIngrained: The Making of a Craftsman by Callum RobinsonAs a memoir enthusiast, especially one who enjoys diving into unfamiliar worlds, I was captivated by Callum Fletcher's memoir which provides a profound glimpse into the art of woodworking. As a textile artist, I value the slow process of creation. However, Callum's approach means venturing into the woods to study decades-old trees, challenging my understanding of craftsmanship. Callum's story explores the essence of being a craftsman in today's fast-paced world. His deep connection to materials and dedication to his work highlight the timeless value of traditional craftsmanship.Revelatory! Opened my eyes to the intricate beauty of woodworking. Callum's memoir demonstrates the enduring power of art to enrich our lives. ~ StacyThe Stolen Queen by Fiona Davis SIGNED FIRST EDITION AVAILABLEI loved reading the archaeological aspects in this book, as I had studied anthropology in college. And then there's this "The Devil Wear'''
