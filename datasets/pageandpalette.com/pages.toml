["https://pageandpalette.com/events-master/2024/12/7/dont-let-the-pigeon-drive-the-sleigh"]
title = "Don't Let The Pigeon Drive The Sleigh — Page & Palette"
description = "On Saturday, December 7th at 10:00 AM, join us for a fun-filled photo op and storytime with the Pigeon from Mo Willems’ new Christmas Classic, Don’t Let the Pigeon Drive the Sleigh!    You’ll snow want the special Pigeon Christmas activities and yummy treats, too."
full_description = "Don't Let The Pigeon Drive The Sleigh Saturday, December 7, 2024 10:00 AM 11:00 AM 10:00 11:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS On Saturday, December 7th at 10:00 AM, join us for a fun-filled photo op and storytime with the Pigeon from Mo Willems’ new Christmas Classic, Don’t Let the Pigeon Drive the Sleigh!You’ll snow want the special Pigeon Christmas activities and yummy treats, too. From #1 New York Times bestselling, award-winning author and illustrator Mo Willems comes a new holiday classic.It’s the most wonderful time of the year—for driving a sleigh! ’Tis also the season—for driving a sleigh! Oh, and joy to the—driving a sleigh! The Pigeon has made a list and checked it once. Can his holiday dream come true? Or will The Pigeon be left out in the cold?You’ll share some HO-HO-HOs and HA-HA-HAs finding out in three-time Caldecott Honoree Mo Willems’ ninth Pigeon book, Don’t Let the Pigeon Drive the Sleigh!"
