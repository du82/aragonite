["https://www.pageandpalette.com/books/what-would-mama-do-by-lyla-marie-pennington-ryals"]
title = "What Would Mama Do? by Lyla Marie Pennington-Ryals — Page & Palette"
description = """
Her mother died in 1931, just days before her ninth birthday and her dad 
didn’t seem to be “into” caring for the least of his six children. She and 
her younger brother were pretty much left to their own devices to make 
their way through feeding themselves, managing their own health care, 
getting through school, and providing for their safety.

Lila and her “Buddy” struggled daily with what you and I probably never 
even think about, but their fierce love for their lost Mama, God, and each 
other saw them through.

This tale of how they survived during the war years in Fairhope, pretty 
much by themselves, will have you in tears at times and also amazed at 
their doggedness and fierce love for one another."""
