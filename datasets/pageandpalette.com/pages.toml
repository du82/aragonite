["https://pageandpalette.com/events-master/2025/1/10/fiona-davis-ticketed-author-event"]
title = "Fiona Davis - TICKETED Author Event — Page & Palette"
description = "Join us Friday, January 10th to listen to Fiona Davis talk about her newest book,  THE STOLEN QUEEN,  along with Patti Callahan Henry. The book is available for pre-sales and will come out on January 7th! This is a ticketed event, each book sale is a ticket and will guarantee a seat within the Book"
full_description = "Fiona Davis - TICKETED Author Event Friday, January 10, 2025 6:00 PM 8:00 PM 18:00 20:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us Friday, January 10th to listen to Fiona Davis talk about her newest book, THE STOLEN QUEEN, along with Patti Callahan Henry. The book is available for pre-sales and will come out on January 7th! This is a ticketed event, each book sale is a ticket and will guarantee a seat within the Book Cellar. The Stolen Queen From New York Times bestselling author Fiona Davis, an utterly addictive new novel that will transport you from New York City’s most glamorous party to the labyrinth streets of Cairo and back.Egypt, 1936: When anthropology student Charlotte Cross is offered a coveted spot on an archaeological dig in Egypt’s Valley of the Kings, she leaps at the opportunity. But after an unbearable tragedy strikes, Charlotte knows her future will never be the same.New York City, 1978: Nineteen-year-old Annie Jenkins is thrilled when she lands an opportunity to work for iconic former Vogue fashion editor Diana Vreeland, who’s in the midst of organizing the famous Met Gala, hosted at the museum and known across the city as the “party of the year.” Though Annie soon realizes she’ll have her work cut out for her, scrambling to meet Diana’s capricious demands and exacting standards.Meanwhile, Charlotte, now leading a quiet life as the associate curator of the Met’s celebrated Department of Egyptian Art, wants little to do with the upcoming gala. She’s consumed with her research on Hathorkare—a rare female pharaoh dismissed by most other Egyptologists as unimportant.That is, until the night of the gala. When one of the Egyptian art collection’s most valuable artifacts goes missing . . . and there are signs Hathorkare’s legendary curse might be reawakening.As Annie and Charlotte team up to search for the missing antiquity, a desperate hunch leads the unlikely duo to one place Charlotte swore she’d never return: Egypt. But if they’re to have any hope of finding the artifact, Charlotte will need to confront the demons of her past—which may mean leading them both directly into danger.Fiona DavisF I O N A D A V I S is the New York Times bestselling author of seven historical fiction novels set in iconic New York City buildings, including The Spectacular, The Magnolia Palace, The Address, and The Lions of Fifth Avenue, which was a Good Morning America book club pick. Her articles have appeared in publications like The Wall Street Journal and the Oprah magazine. She first came to New York as an actress, but fell in love with writing after getting a master's degree at Columbia Journalism School. Her books have been translated into over twenty languages and she's based in New York City. “In this tantalizing latest from New York Times bestselling author Fiona Davis, New York’s Metropolitan Museum of Art takes center stage in a fast-paced tale that spans from 1936 Egypt to 1978 Manhattan. Davis is known for framing stories around New York City landmark buildings, and in The Stolen Queen, the Met comes to life on the page with her trademark touch. But she also delves into Egypt’s Valley of the Kings, and into some fascinating mysteries related to both ancient Egypt and to a 20th century tragedy. You’ll fall in love with the strong Charlotte and the plucky Annie as they face the reawakening of a legendary curse and the surfacing of long-buried secrets, all to the chaotic and fascinating backdrop of Diana Vreeland’s famed Met Gala in its 1970s heyday. The Stolen Queen is a powerful ode to both the magic of New York City and the resilience of the human spirit, set both in the storied Met and in the rock-cut pharaohs’ tombs of Egypt” — Kristin Harmel, bestselling author of The Paris Daughter"
