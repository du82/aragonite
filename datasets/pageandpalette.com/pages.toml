["https://pageandpalette.com/events-master/2024/12/3/keeper-of-the-lost-cities-release-party"]
title = "Keeper Of The Lost Cities Release Party — Page & Palette"
description = "Join us for a Keeper of Lost Cities Fan Gathering! On Tuesday, December 5th at 5pm, we're celebrating the release of Book 9.5, UNRAVELED! Meet other Keeper fans, participate in themed activities, and test your knowledge on all things Keeper of the Lost Cities!    Get ready for our fan event by pre-o"
full_description = "Keeper Of The Lost Cities Release Party Tuesday, December 3, 2024 5:00 PM 6:00 PM 17:00 18:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us for a Keeper of Lost Cities Fan Gathering! On Tuesday, December 5th at 5pm, we're celebrating the release of Book 9.5, UNRAVELED! Meet other Keeper fans, participate in themed activities, and test your knowledge on all things Keeper of the Lost Cities!Get ready for our fan event by pre-ordering your copy of UNRAVELED. Visit the following link or stop by P&P!Keeper Of The Lost Cities Pre-SaleABOUT THE BOOKThe past and present unravel into staggering truths in this can’t-miss installment of the New York Times and USA TODAY bestselling Keeper of the Lost Cities series told entirely from Keefe’s point of view.Please be careful. Please be happy. And PLEASE forget all about me. It’ll be better for everyone that way.Those were the last words Keefe Sencen wrote to Sophie Foster before he ran away to the Forbidden Cities. He didn’t want to leave, but it was the only way to keep his friends safe while he figured out how to control his scary new powers and searched for answers about his past.What he found was so much more than adventures in Humanland.Where did he go? What did he do? And who did he meet while the rest of his friends worked to solve the mystery of Stellarlune? The answers go far beyond anything anyone could have ever imagined and give Keefe the power to change his destiny."
