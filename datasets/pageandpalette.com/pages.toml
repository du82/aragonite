title = "Page & Palette"
description = """
This third-generation family-owned bookstore has been a Fairhope landmark 
for over 40 years, and is also home to the coffee shop Latte Da and event 
venue and bar The Book Cellar."""
full_description = '''New Store Hours: We are open 7 days a week:Bookstore: Mon-Sun. 10AM - 5PMLatte Da Cafe: Mon-Fri 7:30AM - 5PM, Sat 8:30AM - 5PM, Sun 9AM - 4PM Book Cellar (Bar & Venue) Closes by 10PM Plot Twist Yoga Studio - https://www.mindbodyonline.com/explore/locations/plot-twist-yoga-studio-at-page-palette <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1554745236531-78S3EI5EYOUTW5JX82IS/29663148_10155836899853937_2472921133796084515_o.jpg" alt="29663148_10155836899853937_2472921133796084515_o.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1726694923261-MN8YGR3722P3RD8JVCZA/image-asset.jpeg" alt="" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1726694948601-0FB7KRKMWALKPLFSQR1E/image-asset.jpeg" alt="" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1726695014407-H1L2NU5BRX10UR4TKY8A/Common-Space-3.jpg" alt="Common-Space-3.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1726695015184-D879QFKUWHGEPTH8I7LU/Common-Space-4.jpg" alt="Common-Space-4.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1726695016337-UW7YJB8MJMEBP4Z2WB6G/Common-Space-5.jpg" alt="Common-Space-5.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1726695018506-Y394005LHQPTA0DT457G/Common-Space-6.jpg" alt="Common-Space-6.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1726695018937-6E9D3FV3BQI1X0NZNA87/Common-Space-7.jpg" alt="Common-Space-7.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1726695020766-5E1FWNG7LAF1Y9X85XVU/Common-Space-8.jpg" alt="Common-Space-8.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1563813273739-A8TXW1SQY9TH04AIVKAP/20190720_145738.jpg" alt="20190720_145738.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1563813357197-6PX1Z2OPXKEZTTP2J6AE/IMG_0385.JPG" alt="IMG_0385.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603790870-FI7C5IMTLT9DMX730Z4Y/20181120_141606.jpg" alt="20181120_141606.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603846550-VBOYDST81HAHBI938VYH/20181003_155603.jpg" alt="20181003_155603.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603399297-NOAUBV53YYTAU9CMCXGZ/20181128_124924.jpg" alt="20181128_124924.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550604157113-BFM2MQNVM7VIBXZXL9F2/20181023_115637.jpg" alt="20181023_115637.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603751694-A27929GJLAO9UI996UBY/20181127_110217.jpg" alt="20181127_110217.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550604030753-DQIVQ558IZ31V9U3PAOK/20181010_105145.jpg" alt="20181010_105145.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603999780-7BNPT4AZGNV1OUBW8L3Z/IMG_11151001002.jpg" alt="IMG_11151001002.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603331379-V4UF8Q5ZCYZBJM1QPWN2/20190118_120310.jpg" alt="20190118_120310.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550604096286-LF5EMNOHRLAV40XRIRB2/20181022_171814%280%29.jpg" alt="20181022_171814(0).jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603927900-127UZRIY9PUZAKCS0142/20181120_141834.jpg" alt="20181120_141834.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550602372369-Q9N9MYLC9UOW1EJXUOTE/thumbnail.jpg" alt="thumbnail.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550602418181-PY1SM917O89TYAQS81W0/5.jpg" alt="5.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550602436054-K3U45MU7HY6K5W5GZNKB/thumbnail2.jpg" alt="thumbnail2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1538420479594-P5ZHXOY89EJ8300T1QCS/20170509_181722.jpg" alt="20170509_181722.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1538424331776-NMZJ66GJ6XUA481GUNLU/Screen-Shot-2018-09-11-at-11.13.30-AM.jpg" alt="Screen-Shot-2018-09-11-at-11.13.30-AM.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1563813475781-9DOBDQL0TTB82P2FJ0VF/20190720_153820.jpg" alt="20190720_153820.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603356159-KQIOD95I8O7CNUP0ICD4/20190207_181612.jpg" alt="20190207_181612.jpg" /> There’s a story here.To say we’ve been open since 1968 isn’t enough. We have to give that time, dimension. Otherwise, we just come off sounding, well, old. We are seasoned and proud of it but our thinking has to be new. Hell, we’ve been through more hurricanes than Pat O’Brien’s on a Saturday, and we’re still here. Still standing.Our strength comes from a center that the big box boys just don’t have. What is it? We have a story…A story with a whole cast of characters. Millions are in the books we sell, but look more closely. You’ll find them in our aisles, behind the register and camped out in the café. You see, there’s no need to create some mystique when you’ve been around this long. It’s here.Page and Palette. There’s a story here. Go look and see what Southern Living had to say about us in their issue of some of the best Book Stores around!! It just makes our heart warm!! And an interview with Sonya & Nancye by Scenic 98!!If you’ve visited our store on a Tuesday, then you’ve probably seen our advice booth!! Sonya & Nancye, followers of the Bahai’i faith sit in the coffee shop and look forward to sharing their wisdom with all of those who are willing to accept it!! Stop by on any given Tuesday when the doctors are in and ask a question that is eating away at you!! For now, though, read more about these two sweet women, by clicking on the picture below: Upcoming Events Featured Mar 1 Mar 1, 2025 10:00 PM – 11:00 PM22:00 – 23:0010:00 PM – 11:00 PM Brown Bear Brown Bear -- Classic Storytime with Mrs. Paula Mar 1, 2025 10:00 PM – 11:00 PM22:00 – 23:0010:00 PM – 11:00 PM Mar 1, 2025 10:00 PM – 11:00 PM22:00 – 23:0010:00 PM – 11:00 PM Mar 2 Mar 2, 2025 5:00 PM – 7:00 PM17:00 – 19:005:00 PM – 7:00 PM Emily Ley - Ticketed Author Event Mar 2, 2025 5:00 PM – 7:00 PM17:00 – 19:005:00 PM – 7:00 PM Mar 2, 2025 5:00 PM – 7:00 PM17:00 – 19:005:00 PM – 7:00 PM Mar 8 Mar 8, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Signs - Book Discussion Mar 8, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Mar 8, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Mar 8 Mar 8, 2025 12:00 PM – 2:00 PM12:00 – 14:0012:00 PM – 2:00 PM Vivian Lee - Author Signing Mar 8, 2025 12:00 PM – 2:00 PM12:00 – 14:0012:00 PM – 2:00 PM Mar 8, 2025 12:00 PM – 2:00 PM12:00 – 14:0012:00 PM – 2:00 PM Mar 14 Mar 14, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Leslie Anne Tarabella - Arts & Crafts Author Signing Mar 14, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Mar 14, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Mar 15 Mar 15, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Morgan Cunningham - Arts & Crafts Author Signing Mar 15, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Mar 15, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Mar 15 Mar 15, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Amanda Marquardt -- Author Signing Mar 15, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Mar 15, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3