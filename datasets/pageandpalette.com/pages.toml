/56b14d71f8baf3f55714aca5/1718482906241-GUVN8JSLET12TA78AAWN/IMG_5237.jpeg" alt="IMG_5237.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482904422-IEWCLEGG4IB0VSWRV2TN/IMG_5232.jpeg" alt="IMG_5232.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482902296-AOAK5WZT8QQFVD4GZWGI/IMG_5273.jpeg" alt="IMG_5273.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482900143-MOOGPPCJ5J1W6A8YZ5R1/IMG_5288.jpeg" alt="IMG_5288.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482897304-3VWLJC4RWOLENUMZE83H/IMG_5244.jpeg" alt="IMG_5244.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482895025-BKBFUMUN34E8ODN5DC10/IMG_5302.jpeg" alt="IMG_5302.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482892477-AM5M9EXX2COYQQG1MC4G/IMG_5258.jpeg" alt="IMG_5258.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482890547-LZE5SBNGI1TYRU316JNM/IMG_5230.jpeg" alt="IMG_5230.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482888715-GJTSJM855P9T4LDD8MQB/IMG_5248.jpeg" alt="IMG_5248.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482886656-WKFNXEY7JCFQEK4OC9X6/IMG_5251.jpeg" alt="IMG_5251.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482884705-WNACPL8P1WR0C0DKG71G/IMG_5240.jpeg" alt="IMG_5240.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482882608-77WS595O246KE6PFZ4YT/IMG_3857.jpeg" alt="IMG_3857.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482881493-ADTAPKPI3VH132WRAOQ0/IMG_5304.jpeg" alt="IMG_5304.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482878922-RADQP4P8VRDFDQG493DA/IMG_5274.jpeg" alt="IMG_5274.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718482877102-5TE3C3BW0NC5V7CZBRPU/IMG_5277.jpeg" alt="IMG_5277.jpeg" /> "Andrews perfectly balances the second chance-romance with the twisty mystery against a beachy backdrop that will please any armchair traveler." --Publishers Weekly"A fun, heart-warming, and intriguing summer read. For readers who’d enjoy a blend of friendships (old and new), budding romance, and secrets held within the walls of a hotel that needs rescuing, as in Elin Hilderbrand’s The Hotel Nantucket." --Library JournalBook your summer escape with a "mesmerizing mix of mystery and romance" (Publishers Weekly, starred) from the New York Times bestselling author of The Homewreckers and The Newcomer.Welcome to the St. Cecelia, a landmark hotel on the coast of Georgia, where traditions run deep and scandals run even deeper. . . .Everyone refers to the St. Cecelia as “the Saint.” If you grew up coming here, you were “a Saint.” If you came from the wrong side of the river, you were “an Ain’t.” Traci Eddings was one of those outsiders whose family wasn’t rich enough or connected enough to vacation here. But she could work here. One fateful summer she did, and married the boss’s son. Now, she’s the widowed owner of the hotel, determined to see it return to its glory days, even as staff shortages and financial troubles threaten to ruin it. Plus, her greedy and unscrupulous brother-in-law wants to make sure she fails. Enlisting a motley crew of recently hired summer help—including the daughter of her estranged best friend—Traci has one summer season to turn it around. But new information about a long-ago drowning at the hotel threatens to come to light, and the tragic death of one of their own brings Traci to the brink of despair.Traci Eddings has her back against the pink-painted wall of this beloved institution. And it will take all the wits and guts she has to see wrongs put to right, to see guilty parties put in their place, and maybe even to find a new romance along the way. Told with Mary Kay Andrew’s warmth, humor, knack for twists, and eye for delicious detail about human nature, Summers at the Saint is a beach read with depth and heart.David Baldacci — Simply Lies <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684963940790-U816TX3S8E8EREKBECG3/IMG_1024.jpg" alt="IMG_1024.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684963940064-M0FOG3FEUK0KA98LBBJQ/IMG_1025.jpg" alt="IMG_1025.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684963942970-0TFAO48VICSBVYIT1687/IMG_1027.jpg" alt="IMG_1027.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684963944592-9K7ZGFLHAOFVOKATZIEJ/IMG_1035.jpg" alt="IMG_1035.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684963948882-UQWMXB4NAZAPVIABHNBK/IMG_1040.jpg" alt="IMG_1040.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684963949413-VPF4PLFFI04A1ZTFYIJW/IMG_1044.jpg" alt="IMG_1044.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684964871628-MAZG5WIX910SHTF09NFZ/IMG_1333.jpg" alt="IMG_1333.jpg" /> From the #1 New York Times bestselling author of The 6:20 Man, "Long Shadows & The Whole Truth comes a twisting new psychological thriller in which two women—one a former detective, the other a dangerous con artist—go head-to-head in an electrifying game of cat and mouse.Mickey Gibson, single mother and former detective, leads a hectic life similar to that of many moms: juggling the demands of her two small children with the tasks of her job working remotely for ProEye, a global investigation company that hunts down wealthy tax and credit cheats. When Mickey gets a call from a colleague named Arlene Robinson, she thinks nothing of Arlene’s unusual request for her to go inventory the vacant home of an arms dealer who cheated ProEye’s clients and fled. That is, until she arrives at the mansion to discover a dead body in a secret room—and that nothing is as it seems. Not only does the arms dealer not exist but the murder victim turns out to be Harry Langhorne, a man with mob ties who used to be in Witness Protection. What’s more, no one named Arlene Robinson works at ProEye. In the blink of an eye, Gibson has become a prime suspect in a murder investigation—and now her job is also on the line until she proves that she was set up. Before long, Gibson is locked in a battle of wits with a brilliant woman with no name, a hidden past, and unknown motives—whose end game is as mysterious as it is deadly.Fiona Davis — The Stolen Queen <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997416392-NWNS017LEUPYFIQL7VLO/IMG_2979.jpeg" alt="IMG_2979.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997413764-MPPWFROJD0OJNEFTFSEO/IMG_8639.jpeg" alt="IMG_8639.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997410136-QM7KPGUB16EW51SZ8CW2/IMG_8676.jpeg" alt="IMG_8676.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997405380-Y8ETYU3S9ZSCQBS25GXF/IMG_8680.jpeg" alt="IMG_8680.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997401628-CDWGIIE7U21H8Y9BKNWR/IMG_8681.jpeg" alt="IMG_8681.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997396824-6RD9IUE67OYT4MXMMBBU/IMG_8685.jpeg" alt="IMG_8685.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997393053-S3ZURRJSHW4VABNSOX9V/IMG_8691.jpeg" alt="IMG_8691.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997388331-YKLF6U05H32WF3Y8WXXW/IMG_8697.jpeg" alt="IMG_8697.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997384914-YEZ9SSBG3U96L4QGXSU0/IMG_8701.jpeg" alt="IMG_8701.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997381209-VBWIA0EOG9B31X8EBJL9/FullSizeRender.jpeg" alt="FullSizeRender.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997374750-EWZUAMEWJHALWY1USQTY/IMG_8659.jpeg" alt="IMG_8659.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997371122-0UK5ILQUY0D7QHI6DBOY/IMG_8655.jpeg" alt="IMG_8655.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997367401-RA0N2X9V6697VWTGF2FC/IMG_8674.jpeg" alt="IMG_8674.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1739997363596-8BGTAC2ZPMJTV5AWGL6P/IMG_8646.jpeg" alt="IM'
