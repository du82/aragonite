IMG_4491.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1708038614196-ID0A24J40XJVD7APPDU2/IMG_4490.jpg" alt="IMG_4490.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1708038616802-48UABSBTB5O10IOH2EDZ/IMG_4489.jpg" alt="IMG_4489.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1708038631589-IXT8BDZ0HFX3VUBYN6K2/IMG_4460.jpg" alt="IMG_4460.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1708038616878-VAWHD1BP30XFX820OOUE/IMG_4488.jpg" alt="IMG_4488.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1708038619715-NKX3JGXPOWUIBPO4RFLW/IMG_4487.jpg" alt="IMG_4487.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1708038630511-1U5CT4NJQPJAL1FEEFSD/IMG_4462.jpg" alt="IMG_4462.jpg" /> Our coffee shop serves not only coffee (from a regular old cup of Joe to a double-shot-extra foam-skim-latte with a touch of cinnamon) but also tea, ice rages, Blue Bell ice cream, and sinful pastries–all in a bookish ambiance. Enjoy a break from work or shopping, conversing with friends, or, if alone, dawdling a while with a magazine from our newsstand or taking advantage of our free wireless Internet access.Latte Da HoursOpen 7 Days a Week!Mon-Fri: 7:30am-5pmSat: 8:30am-5pmSun: 9:00am-4pm BeveragesOur TeasBlack Teas Raspberry Chinese black tea naturally flavoured with the essence of raspberry, delicious served hot or iced.Peach Black tea naturally flavoured with peach and other fruit and floral notes.Mango Black tea naturally flavoured with mangi and other tropical fruit and floral notes.Passionfruit Chinese black tea flavoured wuth the essence of passionfruit.Apricot Chinese black tea flavoured with the essence of apricot, delicious served hot or iced.Blue Lady Black tea naturally flavoured with a delicious blend of grapefruit and citrus.English Breakfast A black tea that is mellow and brisk—perfect served hot with milk or over ice with lemon.Ceylon Supreme Classic black shotty tea, delightfully strong and excellent for taking with milk or créme.Earl Grey / Decaf A traditional blend of rich black tea flowers with the natural oils of bergamot. This tea comes either caffeinated or decaffeinated.Vanilla Fully fermented black tea flavoured with select Indonesian and Tahitian vanilla beans.HerbalsPan fired Green Oxidised by way of pan roasting the organic Green Tea.Chamomile One of the most popular teas with 100% chamomile flowers. Ideal for a nightcap or calming evening.Freesia’s Garden A Citrus delight made with fruit pieces, orange peel and flowers, naturally caffeine free!!White Peony From the legendary “Big White” tea plant comes this delicate tea, rare and exquisite, known for it’s major health benefits.Peppermint Grown in Oregon, this tisane is aromatic & refreshing.New Zealand Sunnyslopes A delicious blend of kiwi, strawberry and fruit pieces, naturally caffeine free.Orange Blossom Oolong This nutty oolong is infused with the essence of an orange blossom, to create a tea that is delicately perfumed, sweet to taste.Our Specialty Lattes Mocha Latte A Latte with dark Mocha and your choice of milk!! This can also come without expresso and just serve as a hot chocolateMilky Way A Latte with Mocha and Caramel, just like your favourite candy bar!Turtle A Latte with Mocha, caramel and Hazelnut flavouring!Almond Joy A Latte with Mocha, Almond and Coconut flavouring. try it with Coconut milk!!Marble A Latte with both dark Mocha and White ChocolateShamrock A Latte flavoured with white chocolate and Irsh creamCinnamon Sarah Named after one of our dearest employees, this lightly spced latte is flavoured with cinnamon (syrup or powder) and white chocolate.White Chocolate A Latte withh white chocolate and your milk of choiceBlueberry White Chocolate A Latte with white chocolate and blueberry flavouringSteamer Any of these lattes can be made without expresso and be just as delicious if not more!!Snacks To Go With Your Beverages Featured Feb 15, 2024 Guncles Feb 15, 2024 We offer a selection of Guncles Gluten free pastries and savory goods!! As a local company, Guncles is based in Mobile and delivers fresh items to us, including: Oatmeal Creampies (original & Red Velvet), Blueberry or Raspberry Friands, Cheddar Herb or buttermilk biscuits, Oatmeal raisin cookies & chocolate chip toffee cookies!! Feb 15, 2024 Feb 15, 2024 Feb 15, 2024 Feb 15, 2024 Feb 15, 2024 Pound Cake Feb 15, 2024 We also offer Pound cake by the slice, baked fresh by Punta Clara Kitchen based in Point Clear!! We cycle between Chocolat & Vanilla, so try to catch us on your favourite cake flavour! Feb 15, 2024 Feb 15, 2024 Carrot Cake Feb 15, 2024 Also from Punta Clara Kitchen in Point Clear, we sell their carrot cake by the slice!! Feb 15, 2024 Feb 15, 2024 Cinnamon Rolls Feb 15, 2024 Feb 15, 2024 Feb 15, 2024 Scones Feb 15, 2024 Prepared elsewhere and baked in house, we offer scones! Currently we offer White Chocolat Raspberry, Blueberry & Apple Cinnamon!! Ask for it warmed, trust me! :) Feb 15, 2024 Feb 15, 2024 Muffins Feb 15, 2024 Freshly made by Fresh Market, we offer muffins!! Flavours range from Pistachio & Cinnamon chip to cranberry Orange & Blueberry Feb 15, 2024 Feb 15, 2024 Chocolat Cookies Feb 15, 2024 You may have smelled these the second you walked in as we bake a fresh batch every day!! Ask for them warm, they’re so delicious! Feb 15, 2024 Feb 15, 2024 various pastries Feb 15, 2024 We also offer various pastries such as Cinnamon Almond coffee cake, a Chocolate Almond Coffee Cake, chocolate Banana Swirl , Glazed Donuts, Peanut Butter Toffee bars, and Iced Lemon loafs! Feb 15, 2024 Feb 15, 2024 Feb 15, 2024 Feb 15, 2024'
