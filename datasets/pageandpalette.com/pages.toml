full_description = "Jessica Jones - Signing Saturday Saturday, February 22, 2025 2:00 PM 4:00 PM 14:00 16:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us at Page & Palette for Signing Saturday! On Saturday, February 22nd at 2PM, Jessica Jones will be here to discuss her book, Naked Young Woman In Front of The Mirror. Enjoy a cup of coffee or a glass of wine as you visit Jessica’s table and connect with the author of this book of poetry. We hope to see you there!Naked Young Woman in Front of the Mirror celebrates physical, mental, and emotional growth throughout the different phases of life. From the playful nature and feelings of insignificance in childhood, to the angst of teenage years, this character continues to grow into a young woman who is bold and confident in her body and in her thoughts, her sexuality and her voice. She moves on to the frailty and despair of clinging to mortal relationships. She experiences both the agony and the bliss of love, and revels in an insatiable appetite for life. Jessica Jones graduated from the University of South Alabama with a Bachelor’s in English in 2007, and a Master’s in Creative Writing in 2009. She published her first book of poetry in 2009. Her poetry awards include the Shelley Memorial Scholarship and awards by the National Federation of State Poetry Societies, Poets and Patrons Chicagoland and the Alabama State Poetry Society. She has been published in the “Birmingham Arts Journal”, Whatever Remembers Us: An Anthology of Alabama Poetry, “Oracle Fine Arts Review”, and Mise en Place. Jones has served as chair of the Alabama Poet Laureate nominations board, newsletter editor for the Alabama Writers' Conclave, and event coordinator for the Alabama State Poetry Society. She is currently the President of the Alabama Writers’ Cooperative. Her newest book of poetry is being published by Negative Capability Press in late 2024."
