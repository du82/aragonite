full_description = "Amanda Marquardt -- Author Signing Saturday, March 15, 2025 1:00 PM 3:00 PM 13:00 15:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Book OverviewDeath has a way of bringing family secrets and drama to the surface.When my grandmother passes unexpectedly, neither are in short supply. That’s why I need to get to Bull Creek for Nana’s funeral and get out. Instead, my mother continues to bring up the past and now she’s sharing secrets I didn’t even know she had.To make matters worse, a one-night stand to let off steam goes sideways, and a local cattle rancher seems set on wooing me. Every day spent in the small town threatens my resolve. And more. But when things finally seem to be coming to a close, I’m not sure what I even want anymore.What’s the cost of making it out of town for good?When Sparks Fly is perfect for lovers of small-town, cowboy romance who enjoy a side of suspense. While it will leave you on the edge of your seat, The Fallout Duet does have a guaranteed happily ever after."
