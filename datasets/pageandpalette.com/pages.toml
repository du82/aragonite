title = "Something in the Walls-Katie (Pre-Order Feb 25th) — Page & Palette"
description = """
Pre-Order the book that Katie loves that comes out on February 25th!

A child psychologist is called to a remote village to examine a teenage 
girl who claims she’s possessed by a witch, in this chilling and 
spellbindingly tense novel of psychological suspense.

She’s looking for the truth but something else is staring back.

Meet Alice, a thirteen-year-old girl claiming to be haunted by a witch. 
Enter Mina, a freshly minted child psychologist grappling with her own 
demons yet determined to heal Alice's troubled soul. But instead of 
improving, Alice’s behavior becomes increasingly inexplicable and intense. 
Bathanel, the English town where Alice lives, has a deep history of 
superstition and witchcraft.. They believe there is evil in the world. They 
believe there are ways of. . .dealing with it. And they don’t expect 
outsiders to understand.

As Mina races to uncover the truth behind Alice’s condition, the dark 
cracks of Banathel begin to show. Mina is desperate to understand how deep 
their sinister traditions go—and how her own past may be the biggest threat 
of all.

Unbearably tense, utterly propulsive, and studded with folklore and horror, 
Something in the Walls is perfect for anyone who loves Midsommar and The 
Haunting of Hill House."""
