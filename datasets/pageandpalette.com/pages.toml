["https://www.pageandpalette.com/preorders/wild-dark-shore-pre-order-signed-copy"]
title = "Wild Dark Shore (Pre-Order + Signed Copy) — Page & Palette"
description = """
Reserve a signed copy of the staff’s highly anticipated book coming March 
4th! Limited signed copies available.

Charlotte McConaghy’s debut novel Migrations blew me away, but I’m 
completely undone by Wild Dark Shore. It is a breathtaking look at climate 
change's impact on a family as they complete their final days assigned to a 
remote outpost near Antarctica. Lyrical, powerful, heartbreaking and 
hopeful, McConaghy has written an unforgettable story of a fractured family 
and a stranger, who bond together to survive the harshest of circumstances. 
-- Anderson

This is my first book that I read by Charlotte McConaghy, and wow, I’m 
going to have to read her other books. Typically, I enjoy books based on 
the writing, plot, and characters. This book did excellent with all of 
those aspects, but the SETTING was the best part for me. It’s a fictional 
remote island near Antarctica and it was just so beautiful and chilling to 
read. -- Tyler

McConaghy's third book and I have loved each one. Everyone seems to be 
keeping a secret on this tiny island near Antarctica inhabited only by the 
Salt family until Rowan washes up on their shore. McConaghy's description 
of nature is passionate and poetic and the mystery taut with suspense. 

-- Carolyn"""
