dn.com/content/v1/56b14d71f8baf3f55714aca5/1538420479594-P5ZHXOY89EJ8300T1QCS/20170509_181722.jpg" alt="20170509_181722.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1538424331776-NMZJ66GJ6XUA481GUNLU/Screen-Shot-2018-09-11-at-11.13.30-AM.jpg" alt="Screen-Shot-2018-09-11-at-11.13.30-AM.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1563813475781-9DOBDQL0TTB82P2FJ0VF/20190720_153820.jpg" alt="20190720_153820.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603356159-KQIOD95I8O7CNUP0ICD4/20190207_181612.jpg" alt="20190207_181612.jpg" /> BookstoreThis fourth-generation family-owned bookstore has been a Fairhope landmark for over 50 years. Proudly seated in the heart of the downtown community, we are a host to a range of author events from local, up-and-coming names to block-busting celebrities. In addition to new books, we also carry greeting cards, journals, and a variety of merchandise. All of this over a cup of locally roasted coffee in Latte Da or a craft cocktail with a literary twist in The Book Cellar, it's no wonder some of our customers never leave the store.Bookstore HoursOpen 7 Days a Week!Mon-Sun: 10am-5pmNeed A Reccomendation? <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684095907925-VQ2S8NUFO91C5F1BAMT4/Untitled+design+%2820%29.png" alt="Untitled design (20).png" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684095904917-S5PAWRM4EDCL4EXRNL9R/Untitled+design+%2819%29.png" alt="Untitled design (19).png" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684096814054-J33QFGAVI6UI5SFP2FN0/Untitled+design+%2818%29.png" alt="Untitled design (18).png" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684096881761-NVHFTZAG9CIN1U71R2QN/Untitled+design+%2817%29.png" alt="Untitled design (17).png" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684096928734-ADK4PMHDZS0SE6YGUMJS/Untitled+design+%2816%29.png" alt="Untitled design (16).png" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684097817449-L5GYOEISAEKVXEM7U7UZ/Untitled+design+%2811%29.png" alt="Untitled design (11).png" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684097840650-82P7E13ZP0WYSY4XP1L1/Untitled+design+%2812%29.png" alt="Untitled design (12).png" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684097900049-L1E1Z0PYYCNXHQZ875QJ/Untitled+design+%2813%29.png" alt="Untitled design (13).png" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1684097925554-7EOVAP0SVP9S57GXYUHP/Untitled+design+%2814%29.png" alt="Untitled design (14).png" /> In Our Book Store, We place our own little blurbs in our favorite books to help you make your decision!! Our tastes vary from Non-fiction favorites like Niall Williams (In Kiltumper: A year in An Irish Garden) and Augusta Kantra (Wisdom Seeds); Fiction best sellers from Patti Callahan Henry (Becoming Mrs. Lewis) to Rebecca Roanhorse (Black Sun & Fevered Star); Mystery/Thriller Favourites from C.J. Box (Treasure State) to Jacqueline Winspear (The Lady in White); Even for our local authors as well!!If You’re looking for Good recommendations, we’ve got you covered!!For even more recommendations, see our Book Recs page for recommendations from our staff! We have a Book Talk in The Book Cellar once every quarter to help you find your new seasonal obsession!!'''
