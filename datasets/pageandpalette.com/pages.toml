description = "Carla Ray, an ambitious college journalist, is given the electrifying opportunity to cover the meteoric rise of an up-and-coming rock band that is set to take the world by storm. But everything changes the moment she lays eyes on David Wells, the captivating and enigmatic lead singer of the Knights"
full_description = "Jessahme Wren - Author Signing Saturday, January 18, 2025 12:00 PM 2:00 PM 12:00 14:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Carla Ray, an ambitious college journalist, is given the electrifying opportunity to cover the meteoric rise of an up-and-coming rock band that is set to take the world by storm. But everything changes the moment she lays eyes on David Wells, the captivating and enigmatic lead singer of the Knights of Darkness. With his magnetic presence and fierce passion for music, David is everything she didn’t know she craved.As they embark on a whirlwind journey filled with late-night rehearsals and adrenaline-pumping performances, Carla finds herself drawn deeper into David’s world—and into his heart. But beneath his rugged charm lies a tempest of vulnerability, and Carla is determined to peel back the layers of his tough exterior to uncover the sensitive soul yearning to break free.Caught in a tumultuous dance of romance and excitement, Carla and David must confront their pasts. Can David mend the scars that have left Carla hesitant to love again? Will he be the one to make her feel cherished, adored, and finally free to embrace her true self? With passion igniting every moment, their connection deepens, leading them to a pivotal night that will change the course of their lives forever."
