["https://pageandpalette.com/events-master/2025/3/16/vivian-weaver-arts-amp-crafts-author-signing"]
title = "Vivian Weaver -- Arts & Crafts Author Signing — Page & Palette"
description = "Discover the untold secrets with this extraordinary tribute to Anne P. Nix, First Lady of Fairhope, Alabama as told by her closest friends and relatives.  Anne Peele Delorme moved to Fairhope, Alabama from Birmingham in 1954. She met and married the love of her life, charming and good-looking Jimmy"
full_description = "Vivian Weaver -- Arts & Crafts Author Signing Sunday, March 16, 2025 1:00 PM 3:00 PM 13:00 15:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Discover the untold secrets with this extraordinary tribute to Anne P. Nix, First Lady of Fairhope, Alabama as told by her closest friends and relatives.Anne Peele Delorme moved to Fairhope, Alabama from Birmingham in 1954. She met and married the love of her life, charming and good-looking Jimmy Nix in 1956. Within sixteen years, in 1972, Jimmy Nix, then known as Jim, was voted in as mayor of the quaint little town of Fairhope with the vital help of his tenacious wife, Anne.Together they changed Fairhope from a sleepy ole Black and White Film town into a full-blown-fabulous-cenema-technicolor-town that it is known for today.As the First Lady of Fairhope for 28 years, Anne, with her unprecedented insight, went about changing the small dull town into one of the well-known top ten coastal towns in our country. Anne had a strong influence in the political arena, when she campaigned for anyone they almost always won.Anne and Jim visited large cities throughout the nation, collected only the 'best of the best' ideas, brought them back and implemented them in Fairhope. An entire collection of beautiful street flowers were placed in beds along all city streets, atop trash receptacles, flower pots on lamp posts, and the famous roses at the Bay Front Fountain. Thanks to Anne and her friends, tree lights like those in New York and Dallas are now found in Fairhope.Not only did Anne bring about beautiful change to her beloved town, but Anne's private life was also committed to celebrating and supporting other women with breast cancer. This was evident in everything she did, often putting others before herself. Her generosity and passion drove her personal and professional endeavors to limitless successful goals in fundraising for noble causes such as The American Cancer Society.Through it all, Anne's closest confidants shared many intimate stores as well as her personal battle to survive her fight with cancer. Reflecting on her life, those closest to her remember her impressive mind, non-ending energy, and her tenacity that brought about many victorious goals for the good of all who knew and loved this amazing Lady Called Anne!"
