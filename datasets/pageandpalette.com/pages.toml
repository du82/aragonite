informative but realistic and compassionate way.  The main character goes 
through many train wreck situations in her early college years which 
ultimately lead to her discovery of having bipolar disorder.  I appreciate 
how the author presents not only the effects of the diagnosis in an honest 
way, but also the influence that close friends and family can play. Her 
books exemplify the hope and courage we all have the ability to possess.”"""
