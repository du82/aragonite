["https://pageandpalette.com/events-master/2025/3/29/terri-thompson-signing-saturday"]
title = "Terri Thompson - Signing Saturday — Page & Palette"
description = "Join us at Page &amp; Palette for Signing Saturday! On Saturday, March 29th at 2PM, Terri Thompson will be here to discuss her book,&nbsp; Story Magic. &nbsp;Enjoy a cup of coffee or a glass of wine as you visit Terri's table and connect with the author of this magical novel. We hope to"
full_description = "Terri Thompson - Signing Saturday Saturday, March 29, 2025 2:00 PM 4:00 PM 14:00 16:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us at Page & Palette for Signing Saturday! On Saturday, March 29th at 2PM, Terri Thompson will be here to discuss her book, Story Magic. Enjoy a cup of coffee or a glass of wine as you visit Terri's table and connect with the author of this magical novel. We hope to see you there!STORY MAGICA mother who has lost her faith in magic. A teen desperate for love. A living, colorful sphere of light to defeat their dark beast.. . . Because every life is a story, and every story contains magic.__________________________________Samantha O’Conor Clark lost her belief in story magic long before her husband left. Now it’s all up to her. She must stay in control. In spite of her efforts her daughter is spiraling, and a vicious beast threatens Samantha in her sleep. In the midst of it all, story calls to Samantha. She even thinks she sees Sorchae, the bright fairy from Granddad’s stories. Real or imagined, Sorchae encourages Samantha to write again. When bits of her written words bleed into real life, she’s forced to face the magic. But can she trust it when all may be lost for her daughter?Aisling Clark’s young life has been falling apart. Love must be earned and she works hard for it, but she’s getting tired. At least her boyfriend really loves her. Running away together will solve both their problems. But when life doesn’t turn out the way she expects, hope is lost. Can the bright ball of energy and light bring her back from the darkness? TERRI THOMPSONTerri loves words and has enjoyed magical realism in books and movies all her life. Imagery awakens her imagination and she hopes to share that with her readers. Her award-winning YA novella, Journey to Thélo, is available at bookstores and online retailers. Terri is a member of American Christian Fiction Writers and Pensters, Fairhope, AL."
