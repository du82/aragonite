["https://pageandpalette.com/events-master/2024/11/13/paul-brueske-author-event"]
title = "Paul Brueske - Author Event — Page & Palette"
description = "Digging All Night and Fighting All Day     The bloody two-week siege of Spanish Fort, Alabama (March 26–April 8, 1865) was one of the final battles of the Civil War. Despite its importance and fascinating history, surprisingly little has been written about it. Many considered the fort as the key to"
full_description = "Paul Brueske - Author Event Saturday, December 21, 2024 2:30 PM 4:30 PM 14:30 16:30 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Digging All Night and Fighting All Day The bloody two-week siege of Spanish Fort, Alabama (March 26–April 8, 1865) was one of the final battles of the Civil War. Despite its importance and fascinating history, surprisingly little has been written about it. Many considered the fort as the key to holding the important seaport of Mobile, which surrendered to Maj. Gen. Edward R. S. Canby on April 12, 1865. Paul Brueske’s “Digging All Night and Fighting All Day”: The Civil War Siege of Spanish Fort and the Mobile Campaign, 1865 is the first full-length study of this subject.General U. S. Grant had long set his eyes on capturing Mobile. Its fall would eliminate the vital logistical center and put one of the final nails in the coffin of the Confederacy. On January 18, 1865, Grant ordered General Canby to move against Mobile, Montgomery, and Selma and destroy anything useful to the enemy’s war effort. The reduction of Spanish Fort, along with Fort Blakeley—the primary obstacles to taking Mobile—was a prerequisite to capturing the city.After the devastating Tennessee battles of Franklin and Nashville in late 1864, many Federals believed Mobile’s garrison—which included a few battered brigades and most of the artillery units from the Army of Tennessee—did not have much fight left and would evacuate the city rather than fight. They did not. Despite being outnumbered about 10 to 1, 33-year-old Brig. Gen. Randall Lee Gibson mounted a skillful and spirited defense that “considerably astonished” his Union opponents. The siege and battle that unfolded on the rough and uneven bluffs of Mobile Bay’s eastern shore, fought mainly by veterans of the principal battles of the Western Theater, witnessed every offensive and defensive art known to war.Paul BrueskePaul Brueske, a graduate student of history at the University of South Alabama, marshaled scores of primary source materials, including letters, diaries, reports, and newspaper accounts to produce an outstanding study of a little known but astonishingly important event rife with acts of heroism that rivaled any battle of the war. It will proudly occupy a space on the bookshelf of any serious student of the war."
year_published = 2024
year_updated = 2024
