ungs with lint and shortened their lives. In return, it let them live in stiff-necked dignity in the hills of their fathers. So, when death did come, no one had to ship their bodies home on a train. This is a mill story—not of bricks, steel, and cotton, but of the people who suffered it to live. This book is not available for shipping. Please call to place an order with us at (251) 928-5295 if you would like us to ship it to you."
