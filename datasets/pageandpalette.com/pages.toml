["https://pageandpalette.com/events-master/2024/10/8/leslie-anne-tarabella-author-event"]
title = "Leslie Anne Tarabella - Arts & Crafts Author Signing — Page & Palette"
description = "We Don’t Push in Fairhope"
full_description = "Leslie Anne Tarabella - Arts & Crafts Author Signing Friday, March 14, 2025 1:00 PM 3:00 PM 13:00 15:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS We Don’t Push in Fairhope What's it like living in a charming town that is growing faster than Kudzu in July? We Don't Push in Fairhope is a delightful collection of humorous and heartwarming tales of the people and places that make Fairhope, Alabama, unique. A mix of travelogue and memoir, We Don't Push in Fairhope provides readers with an inside glimpse of a small town with quirky folks and costume-wearing dogs. Readers will learn about the Walking School Bus, teens locked in the old jail, why a cookout is not a barbecue, and the revelation that an insulated casserole tote is the best thing since Miss Mississippi discovered hot rollers. This book is a must-read stroll through a beautiful Southern town.Leslie Anne TarabellaFor over a decade, Leslie Anne’s newspaper column, Southern With a Gulf Coast Accent, covered the unique character of the Gulf Coast region. Her books, The Majorettes are Back in Town, Exploding Hushpuppies, and Bringing Christmas Home, have brought laughter and tears to readers of all ages. Leslie Anne is a polished speaker and a contributor to Wisdom Harbour, the website of New York Times bestselling author, Andy Andrews. She and her husband, Bob, have lived in Fairhope, Alabama, since 1999, where they raised their two sons."
