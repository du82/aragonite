description = """
The Spirit of Fairhope
by Dean Mosher and Megrez R. Mosher

For the first time, a book has been published that captures the Spirit of 
Fairhope. Many of Fairhope's most notable authors, Fannie Flagg, Winston 
Groom, Rick Bragg, Frank Turner Hollon, Sonny Brewer and Andy Andrews 
contributed to define their impressions of who we are as Fairhopians. 
Authored by the father-daughter team of Dean and Megrez Mosher, it blends 
Dean's deep understanding of Fairhope's history with Megrez's knowledge of 
growing up surrounded by the authors, characters and the rich lineage she 
shares through her grandparents Craig and Butch Sheldon. This volume is 
filled with stories and anecdotes of the great historical figures, 
characters and events that make Fairhope one of the most unique small 
cities in the world.

Published by Page and Palette."""
