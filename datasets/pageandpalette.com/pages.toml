["https://pageandpalette.com/events-master/2025/2/1/debby-hackbarth-author-signing"]
title = "Debby Hackbarth - Signing Saturday — Page & Palette"
description = "Join us at Page &amp; Palette for Signing Saturday! On Saturday, February 1st at 12PM, Debby Hackbarth will be here to discuss her independently published book,&nbsp; Dynamic Debby. &nbsp;Enjoy a cup of coffee or a glass of wine as you visit Sharon's table and connect with the author of"
full_description = "Debby Hackbarth - Signing Saturday Saturday, February 1, 2025 12:00 PM 2:00 PM 12:00 14:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us at Page & Palette for Signing Saturday! On Saturday, February 1st at 12PM, Debby Hackbarth will be here to discuss her independently published book, Dynamic Debby. Enjoy a cup of coffee or a glass of wine as you visit Sharon's table and connect with the author of this memoir. We hope to see you there!Dynamic Debby: Overcoming Prematurity and Poor VisionThis memoir is a remarkable compilation of prose, poetry, and a plethora of precious photographs. It tells my story and it is meant to be an encouragement for all people who struggle with visual disabilities and low vision as well as those who are smaller than most through premature birth or heredity. The font used is best for folks with challenged vision.Over the past several years, I have been able to gather photographs of my parents and their families. Many photos have already been passed onto our children and grandchildren. However, many remaining snapshots are included here to assist in telling my tale.I have recalled stories and information to the best of my memory as both of my parents and their families have passed away. If I have made errors or misrepresentations, I apologize and hope you may gather inspiration from my trek through time.Debby Hackbarth Debby Hackbarth is a retired teacher, learning specialist, and administrator. Debby's fifty years in various educational settings helped her understand that all students enjoy using their imaginations. Debby is a survivor as she was born six weeks early and developed R.O.P., so she has low vision. She knows what it means to overcome tough situations in life. First of all, Debby is a professional author who has written the Glisten Trilogy - three separate books highlighting the Fairhope Dragon - along with the companion coloring book. Debby believes people around the work are captivated by the dragons around us. The Glisten books feature the challenges and adventures of Glisten, a tiny dragon, born very early, who thrived in the beautiful climate of Baldwin County, AL. The exciting books are for sale at Page and Palette in Fairhope, AL where Debby has had author signings. She has also published poetry. Secondly, Debby is a professional artist. At Melt and More in Fairhope, she sold gnomes and other art - canvases that featured black and white sketches of animals and coastal scenes. She uses recycled wood in her creations. Finally, through her business - HAART, LLC - Debby provides private professional tutoring sessions. She is well qualified to work with students of all ages because she has been working in the field since 1972 and she has two separate Master's Degrees in Education: Special Education (Learning Disabilities) and Curriculum/Instruction (Literacy). She sells Memory Magic - a supplemental program to enhance reading, writing, and spelling skills for students of all ages."
