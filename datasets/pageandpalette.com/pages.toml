["https://www.pageandpalette.com/new-page-1"]
title = "Kids Events!! — Page & Palette"
full_description = '''RECENT KIDS EVENTS!!Adam Rubin & Liniers — The Truth About The Couch <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1714604562408-X5CLKP8D5KY7EE9FAQYB/IMG_5108.jpeg" alt="IMG_5108.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1714604564090-IRHQCL84KLESUGIF9K5U/IMG_5107.jpeg" alt="IMG_5107.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1714604566828-MCES3IBX94B7YWHCAFJL/IMG_5106.jpeg" alt="IMG_5106.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1714604568791-W10BAOTTGVO7CQPD53H6/IMG_5105.jpeg" alt="IMG_5105.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1714604570388-R1OT5ORF5KKE7ZGN3YET/IMG_5109.jpeg" alt="IMG_5109.jpeg" /> We had a fabulous time with Adam Rubin & Liniers! Giggles all around from both the kids and parents over THE TRUTH ABOUT THE COUCH. Signed copies are available at P&P, along with Dragons Love Tacos and all of their fun-filled books! After making us all laugh, exposing furniture police, and drawing up a storm, we accompanies Mr. Rubin and Liniers on their tours to J. Larry Newton School, Fairhope West Elementary and Bayside Academy to share the truth about couches!! We must all stay aware!!About the Book:Pssst! Hey. I'm here to tell ya what the furniture police don't want you to know... Listen close. I'll explain everything.Most people think couches are just for sitting, or maybe napping, and don't give it a second thought. But did you know couches can go berserk if you don't feed them a steady diet of coins, cell phones, and remote controls? And did you know some couches are grown on a farm? (Where do you think the term couch potato comes from?) Some come from two chairs who love each other very much, and some are actually aliens in disguise. And that's just the tip of the iceberg...This laugh-out-loud send-up of conspiracy theories brings Adam Rubin's trademark zany humor together with the richly expressive artwork of Macanudo creator Liniers to explore the totally, completely true (really! maybe?) history of the world's most beloved—and misunderstood—item of furniture.Katherine Applegate — The One And Only FamilyABOUT THE BOOKAn instant #1 New York Times and indie bestseller! <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718484188975-5KMSAJLXIIFQYKKS2Y0N/IMG_5193.jpeg" alt="IMG_5193.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718484078501-3VU7U5ARLTJVJHEGC3SO/IMG_5215.jpeg" alt="IMG_5215.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718484074712-PNJD0E03BYGN5KZ2Z9OC/IMG_5206.jpeg" alt="IMG_5206.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483735890-5KSDDT4827CJBVIT31W7/IMG_5226.jpeg" alt="IMG_5226.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483733286-082WDTGVC0ULZJ1X8FYB/IMG_5224.jpeg" alt="IMG_5224.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483726795-LBLV7T329L737AZ0NZXS/IMG_5221.jpeg" alt="IMG_5221.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483723187-ECOE8HXMIQ9D4L8646EC/IMG_5214.jpeg" alt="IMG_5214.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483720758-20FG790RA2EETHR6RS4L/IMG_5207.jpeg" alt="IMG_5207.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483718283-QXLPUGXPMVI0HCNRSKNS/IMG_5201.jpeg" alt="IMG_5201.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483715937-ERGRLQ49SFZIBWP19JTR/IMG_5196.jpeg" alt="IMG_5196.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483709117-FUHFHKI1Q2BNZLYI3LQ7/IMG_5194.jpeg" alt="IMG_5194.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483669706-TEMZRN3FNAFP95QKX5GG/IMG_5192.jpeg" alt="IMG_5192.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483667164-46BWG14VV7FLYJSU0C79/IMG_5206.jpeg" alt="IMG_5206.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483664015-0Z0CSBRVSK8BFPXIEISM/IMG_5215.jpeg" alt="IMG_5215.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483661041-TL917D8OLQOJY13VW6QP/IMG_5218.jpeg" alt="IMG_5218.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483659303-E5CIXJS5NF2AI8WG12I6/IMG_5211.jpeg" alt="IMG_5211.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1718483656972-DMZVVNCJ0KS6TWGPGSSO/IMG_5219.jpeg" alt="IMG_5219.jpeg" /> For more than a decade, readers have been enchanted by the modern classic The One and Only Ivan, a Newbery Award winner and a #1 New York Times bestseller, and by its bestselling sequels, The One and Only Bob and The One and Only Ruby. Powerhouse author Katherine Applegate invites readers back into Ivan’s world for one last adventure—his most exciting yet.Ivan has been happily living in a wildlife sanctuary, with his friend Ruby next door in the elephant enclosure, frequent visits from his canine friend Bob, and his mate Kinyani by his side. And in the happiest turn of all, Ivan and Kinyani have welcomed a set of twins to their family!Ivan loves being a papa, even though it can be hard sometimes. But as he navigates the joys and challenges of parenthood, he can’t help but recall his life before the glass walls of the mall circus, his own childhood in the jungle—and his own twin.In the tradition of timeless classics like Charlotte’s Web and Stuart Little, the one and only Katherine Applegate has crafted a poignant, delightful, heartbreaking, unforgettable final foray into the world of Ivan, the world’s favorite silverback.ABOUT THE AUTHORKatherine Applegate is the Newbery Medal-winning and #1 New York Times bestselling author of numerous books for young readers, including the One and Only series, the Endling series, Crenshaw, Wishtree, the Roscoe Riley Rules chapter books series, and the Animorphs series. She lives with her family in Nevada.'''
