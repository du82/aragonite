title = "Alan Samry -- Author Signing — Page & Palette"
description = "Fairhope Living writer Alan Samry’s best magazine writing is now in his new book, Mapping Fairhope: Legends, Locals, and Landmarks. The book compiles articles published in the magazine, along with the photographs that originally accompanied each story.   Everyone from newcomers to long-timers will f"
full_description = "Alan Samry -- Author Signing Sunday, March 23, 2025 11:00 AM 1:00 PM 11:00 13:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 (map) Google Calendar ICS Fairhope Living writer Alan Samry’s best magazine writing is now in his new book, Mapping Fairhope: Legends, Locals, and Landmarks. The book compiles articles published in the magazine, along with the photographs that originally accompanied each story.Everyone from newcomers to long-timers will find something to enjoy.Legends include the Fairhope Pier, People's Railroad, historic accommodations, the American Legion building, early African American schools and churches and more.The Locals section highlights the people who make up Fairhope: founding families, creatives, and difference makers, like Lynn Oldshue, Ben Raines, Skip Jones, Lisette Normann, Cecil Chrstenberry, and more. Samry also covers local events, from Arts and Crafts and Mardi Gras to Christmas traditions and the city’s best charity events.In Landmarks, Samry explores historic town plats and subdivision maps, uncovering the histories of areas like Volanta, Quail Creek, and Houstonville."
