["https://pageandpalette.com/events-master/2025/2/15/dr-kenneth-h-starkey"]
title = "Dr. Kenneth R Starkey - Signing Saturday — Page & Palette"
description = "Join us at Page &amp; Palette for Signing Saturday! On Saturday, February 15th at 1PM, Dr. Kenneth Starkey will be here to discuss his independently published book,&nbsp; Indiana Boy. &nbsp;Enjoy a cup of coffee or a glass of wine as you visit Dr. Starkey’s table and connect with the aut"
full_description = "Dr. Kenneth R Starkey - Signing Saturday Saturday, February 15, 2025 1:00 PM 3:00 PM 13:00 15:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us at Page & Palette for Signing Saturday! On Saturday, February 15th at 1PM, Dr. Kenneth Starkey will be here to discuss his independently published book, Indiana Boy. Enjoy a cup of coffee or a glass of wine as you visit Dr. Starkey’s table and connect with the author of this memoir of a sphychologist. We hope to see you there!Indiana BoyIndiana Boy: Memoir of A Psychologist is the refreshingly candid account of one’s search for inner peace and a life of meaning amidst a world of personal challenges, social change, and cultural upheaval.Dr. Kenneth Starkey Dr. Starkey was born and raised in the small Midwestern town of Columbus, Indiana. He completed his bachelor's studies through Indiana University-Purdue University of Indianapolis (Indiana) and received his master's degree from Duquesne University in Pittsburgh (Pennsylvania). He completed his doctoral training through the School of Professional Psychology at Wright State University in Dayton (Ohio). His predoctoral internship was completed through the Veteran's Administration Medical Center of Lexington (Kentucky) and his postdoctoral training through the Baptist Regional Medical Center of Corbin (Kentucky). Dr. Starkey has served as a mental health professional for over forty years and currently works as a licensed clinical psychologist alongside his wife, Dr. Pamela Starkey, through their private offices in Mobile (Alabama)."
