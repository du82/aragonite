["https://pageandpalette.com/book-buddies-book-club"]
title = "Book Buddies Book Club — Page & Palette"
full_description = '''Book Buddies Book Club!!Book Buddies is a book club that we host in the Coffee shop, led by our very own Stacy Sheehan-Wilson!! This book club enjoys discussion of various books and topics and does so in between delicious glasses of wine (or whatever you may like) in the comfort of Latte Da!! Book Buddies meets every first Tuesday of the month at 5:30. Here are the books which they are discussing for each month. *This list is subject to change* June"Sidle Creek is one of the best story collections I’ve read in a long time." - Ron Rash, New York Times bestselling author of SerenaSet in the bruised, mined, and timbered hills of Appalachia in western Pennsylvania, Sidle Creek is a tender, truthful exploration of a small town and the people who live there, told by a brilliant new voice in fiction.In Sidle Creek, McIlwain skillfully interrogates the myths and stereotypes of the mining, mill, and farming towns where she grew up. With stories that take place in diners and dive bars, town halls and bait shops, McIlwain’s writing explores themes of class, work, health, and trauma, and the unexpected human connections of small, close-knit communities. All the while, the wild beauty of the natural world weaves its way in, a source of the town’s livelihood – and vulnerable to natural resource exploitation.With an alchemic blend of taut prose, gorgeous imagery, and deep sensitivity for all of the living beings within its pages, Sidle Creek will sit snugly on bookshelves between Annie Proulx, Joy Williams, and Louise Erdrich. SeptemberThe New York Times bestseller • One of the New York Times 10 Best Books of the Year • One of NPR's Best Books of the Year • Named a Best Book of the Year by Publishers Weekly and BookPage • One of Oprah Daily's Best Novels of 2023“[A] brilliant new entry in Smith’s catalog . . . The Fraud is not a change for Smith, but a demonstration of how expansive her talents are.” —Los Angeles TimesFrom acclaimed and bestselling novelist Zadie Smith, a kaleidoscopic work of historical fiction set against the legal trial that divided Victorian England, about who gets to tell their story—and who gets to be believedTruth and fiction. Jamaica and Britain. Who gets to tell their story?In her first historical novel, Zadie Smith transports the reader to a Victorian England transfixed by the real-life trial of the Tichborne Claimant, in which a cockney butcher, recently returned from Australia, lays claim to the Tichborne baronetcy, with his former slave Andrew Bogle as the star witness. Watching the proceedings, and with her own story to tell, is Eliza Touchet—cousin, housekeeper, and perhaps more to failing novelist William Harrison Ainsworth.From literary London to Jamaica’s sugarcane plantations, Zadie Smith weaves an enthralling story linking the rich and the poor, the free and the enslaved, and the comic and the tragic. JulyShe’s out to prove that there’s no such thing as choosing happiness.Isadora Bentley follows the rules. Isadora Bentley likes things just so. Isadora Bentley believes that happiness is something that flat-out doesn’t exist in her life—and never will.As a university researcher, Isadora keeps to herself as much as possible. She avoids the students she’s supposed to befriend and mentor. She stays away from her neighbors and lives her own quiet, organized life in her own quiet, organized apartment. And she will never get involved in a romantic relationship again—especially with another academic. It will be just Isadora and her research. Forever.But on her thirtieth birthday, Isadora does something completely out of character. The young woman who never does anything “on a whim” makes an impulse purchase of a magazine featuring a silly article detailing “Thirty-One Ways to Be Happy”—which includes everything from smiling at strangers to exercising for endorphins to giving in to your chocolate cravings. Isadora decides to create her own secret research project—proving the writer of the ridiculous piece wrong.As Isadora gets deeper into her research—and meets a handsome professor along the way—she’s stunned to discover that maybe, just maybe, she’s proving herself wrong. Perhaps there’s actually something to this happiness concept, and possibly there’s something to be said for loosening up and letting life take you somewhere . . . happy.Christian women’s fictionStand-alone novelBook length: 100,000 wordsPerfect for fans of Rachel Linden, Gail Honeyman, and Linda HolmesIncludes discussion questions for book clubs October"Remarkable debut.... [a] nearly flawless tale of loss, perseverance and redemption."—Publishers Weekly, STARRED reviewSet in 1920s Mississippi, this debut Southern novel weaves a beautiful and harrowing story of two teenage girls cast in an unlikely partnership through murder—perfect for readers of Where the Crawdads Sing and If the Creek Don't Rise.Ada promised herself she would never go back to the Trace, to her hard life on the swamp and her harsh father. But now, after running away to Baton Rouge and briefly knowing a different kind of life, she finds herself with nowhere to go but back home. And she knows there will be a price to pay with her father.Matilda, daughter of a sharecropper, is from the other side of the Trace. Doing what she can to protect her family from the whims and demands of some particularly callous locals is an ongoing struggle. She forms a plan to go north, to pack up the secrets she's holding about her life in the South and hang them on the line for all to see in Ohio.As the two girls are drawn deeper into a dangerous world of bootleggers and moral corruption, they must come to terms with the complexities of their tenuous bond and a hidden past that links them in ways that could cost them their lives. August"Dazzling. . . . A hard-won love letter to readers and to booksellers, as well as a compelling story about how we cope with pain and fear, injustice and illness. One good way is to press a beloved book into another's hands. Read The Sentence and then do just that."—USA Today, Four StarsIn this New York Times bestselling novel, Pulitzer Prize and National Book Award–winning author Louise Erdrich creates a wickedly funny ghost story, a tale of passion, of a complex marriage, and of a woman's relentless errors.Louise Erdrich's latest novel, The Sentence, asks what we owe to the living, the dead, to the reader and to the book. A small independent bookstore in Minneapolis is haunted from November 2019 to November 2020 by the store's most annoying customer. Flora dies on All Souls' Day, but she simply won't leave the store. Tookie, who has landed a job selling books after years of incarceration that she survived by reading "with murderous attention," must solve the mystery of this haunting while at the same time trying to understand all that occurs in Minneapolis during a year of grief, astonishment, isolation, and furious reckoning.The Sentence begins on All Souls' Day 2019 and ends on All Souls' Day 2020. Its mystery and proliferating ghost stories during this one year propel a narrative as rich, emotional, and profound as anything Louise Erdrich has written.'''
