["https://www.pageandpalette.com/events-master/2025/3/22/amie-remington-signing-saturday"]
title = "Amie Remington - Signing Saturday — Page & Palette"
description = "Join us at Page &amp; Palette for Signing Saturday! On Saturday, March 22nd at 12PM, Amie Remington will be here to discuss her independently published book,&nbsp; The Art (and Science) of HR. &nbsp;Enjoy a cup of coffee or a glass of wine as you visit Amie's table and connect with the a"
full_description = "Amie Remington - Signing Saturday Saturday, March 22, 2025 12:00 PM 2:00 PM 12:00 14:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us at Page & Palette for Signing Saturday! On Saturday, March 22nd at 12PM, Amie Remington will be here to discuss her independently published book, The Art (and Science) of HR. Enjoy a cup of coffee or a glass of wine as you visit Amie's table and connect with the author of this legal guide. We hope to see you there!THE ART (AND SCIENCE) OF HR: A Legal Guide for New Managers, CEOs and Leaders in Between So much has changed in the past five years. Employees are in the driver’s seat now. Howthey experience your workplace can make or break you. This reality, coupled with ever-more-complex workforce issues, means your risk of making costly mistakes is higher than ever.Creating the right kind of culture—one that keeps employees engaged, builds trust, createsbelonging, and, frankly, makes them less litigious—is crucial.To create such a culture, leaders need training, and that includes training on HR issues.Therein lies the problem. Employment attorney Amie Remington says few leaders get thiskind of training. That’s why she’s created this readable, to-the-point resource for keeping youremployees engaged and your company out of trouble. For example, you’ll learn:• Common mistakes even well-meaning leaders make that could land them in hot water• Tips and tactics for creating psychologically and physically safe working conditions• Why generosity and fair pay are expressions of gratitude (and how they helpyour company thrive)• How to handle those talented “producers” who display bad behavior• The unwritten rules of social media (for example, why friending an employeecan have disastrous consequences)• How to capitalize on employees’ talents and strengths to create efficiencies,reduce turnover, and improve retention• Tips for avoiding landmines in sensitive areas like sexual harassment,microaggressions, politics, religion, and more• Guidelines for navigating the maze of state and federal laws governingworkplaces to ensure compliance and reduce riskThe Art (and Science) of HR is written for new and seasoned leaders at every level. Filledwith tips and tactics, sprinkled with compelling stories, and rounded out with helpful resourcesfor further reading, it’s a “must-have” for any company seeking to thrive in a rapidly changingworld.AMIE REMINGTONAmie Remington is an attorney with 25 years of experience in labor and employment law and human resources. She speaks nationally on how companies can create cultures of engagement and minimize their legal risk."
