["https://pageandpalette.com/events-master/2025/1/4/laura-e-denton"]
title = "Laura E. Denton — Page & Palette"
description = '''“If you do not desist your opposition to the British Arms, I shall march this army over the mountains, hang your leaders, and lay waste your country with fire and sword.” – British Major Patrick Ferguson in 1780 [“Battle of King's Mountain" by Isaac Shelby, a pamphlet published 1823]   It’s the'''
full_description = '''Laura E. Denton Saturday, January 4, 2025 12:00 PM 2:00 PM 12:00 14:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS “If you do not desist your opposition to the British Arms, I shall march this army over the mountains, hang your leaders, and lay waste your country with fire and sword.” – British Major Patrick Ferguson in 1780 [“Battle of King's Mountain" by Isaac Shelby, a pamphlet published 1823]It’s the year 1774, and the American Revolution is just beginning to break out in faraway Massachusetts. Seeking adventure and an escape from an oppressive family life, Caleb Anders leaves home and heads south into the wilderness of the American frontier, west of the Blue Ridge Mountains. He meets Nate Daniels along the way, and they become fast friends and business partners.Caleb and Nate soon discover that they must choose their own destiny – should they remain in the beautiful but rugged mountainous wilderness of Virginia, protecting their friends and neighbors from the rampaging Cherokee Indians… or ride north and strike a blow for freedom with General George Washington? Will the rigors of frontier life prepare Caleb and Nate for what lies to the east, beyond the towering mountain range that looms, deep and dark, over their shoulders?Crossing the Blue Ridge is a sprawling and inspirational Revolutionary War historical fiction novel that reintroduces the forgotten American Patriots who fought against superior British Tory forces in one of the most decisive battles in the American Revolutionary War at The Battle of King's Mountain.“The crude, spirited, hardy, determined volunteers who crossed the mountains served as proof of the spirit and resources of the country." - George Washington'''
