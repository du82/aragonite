["https://pageandpalette.com/events-master/2024/12/14/etta-lane-author-signing"]
title = "Etta Lane -- Author Signing — Page & Palette"
description = "Kelli: My life was fine. I worked, went home, and spent time with my best friend. Until I gained some unwanted attention, that is. To keep me safe, my childhood crush hides me away with him and his two roommates, who are also ridiculously attractive. Can I stay here for weeks without falling for one"
full_description = "Etta Lane -- Author Signing Saturday, December 14, 2024 1:00 PM 3:00 PM 13:00 15:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Kelli: My life was fine. I worked, went home, and spent time with my best friend. Until I gained some unwanted attention, that is. To keep me safe, my childhood crush hides me away with him and his two roommates, who are also ridiculously attractive. Can I stay here for weeks without falling for one of them... or all of them?Brian: She's my brother's best friend and the love of my life. I've been keeping an eye on her from afar for years. But when her life is in danger, I do the only thing I can... keep her safe and hidden with me. Can my heart handle having her so close, yet not having her to myself?Josh: I've always been the quiet one who prefers to be alone. Then she came along. She's a ray of sunshine in my darkness and a woman I shouldn't want. The need to keep her safe is ingrained in me, I just need to separate those feelings. Can I manage that when she is burrowing her way into my heart?Logan: Our home has been missing something for a while. We've been doing the bare minimum, surviving, but not really living. Then we took Kelli in and she pulled on all of our heartstrings. Now all I can see is her. If we keep her safe, can we just keep her?"
