["https://pageandpalette.com/books/mobile-havana-sisters-across-the-gulf-by-john-sledge-alicia-garcia-santana-chip-cooper-and-julio-a-larramendi"]
title = "Mobile & Havana: Sisters Across the Gulf by John Sledge, Alicia Garcia-Santana, Chip Cooper and Julio A. Larramendi — Page & Palette"
description = """
A sumptuously illustrated and vivid account of the deep ties that bridge 
the histories and cultures of two colorful and storied port cities

Mobile and Havana: Sisters across the Gulf presents a beautifully written 
and illustrated survey of the many historic linkages between these exotic 
port cities. Through an effortless blending of word and image, John S. 
Sledge, Alicia García-Santana, Chip Cooper, and Julio A. Larramendi, 
historians and photographers from each side of the basin, share a colorful, 
complex, and sometimes difficult story never before fully told.

Over twenty years ago, Mobile’s visionary municipal archivist Jay 
Higginbotham remarked, “Mobile, Alabama, and Havana, Cuba, have only three 
things in common. The past, the present, and the future.” This book 
demonstrates just how much that is the case."""
