["https://pageandpalette.com/events-master/2024/12/21/jim-stenson-author-signing"]
title = "Jim Stenson -- Author Signing — Page & Palette"
description = "This memoir captures the essence of light tackle fishing in its prime from Palm Beach to the Florida Keys, from the Everglades to the Ten Thousand Islands. In short, the best snook-fishing spots on the planet. Author chronicles his fishing adventures from Sanibel to the tarpon capital of the world—B"
full_description = "Jim Stenson -- Author Signing Saturday, December 21, 2024 12:00 PM 2:00 PM 12:00 14:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS This memoir captures the essence of light tackle fishing in its prime from Palm Beach to the Florida Keys, from the Everglades to the Ten Thousand Islands. In short, the best snook-fishing spots on the planet. Author chronicles his fishing adventures from Sanibel to the tarpon capital of the world—Boca Grande—to rivers like the Manatee River and the Little Manatee in Manatee County, the Myakka River in Sarasota County...About Jim:Jim Stenson attended Florida State University and has a bachelor’s degree in Information Science and a master’s in Library Science and Information Studies. He has written numerous articles and columns about fly-fishing, surfing, and the unique culture of South Florida. He was managing editor and publisher of The Contemporary Sportsman and The Contemporary Wing Shooter magazines, and the founder of Sweet Waters Adventure, an international adventure travel company catering to fly fishermen and wing shooters. He owns Integrated Digital Publishing, an outdoor marketing company specializing in graphic design, photography, web design, and video development. He lives in Mobile, Alabama."
