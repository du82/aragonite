["https://pageandpalette.com/events-master/2025/2/26/story-slam-hope-community"]
title = "Story Slam - Hope Community — Page & Palette"
description = "Get ready for another captivating evening of storytelling! We are thrilled to partner with Fairhope Storytellers to bring our community together for an unforgettable Story Slam on Wednesday, February 26, at Page &amp; Palette's Book Cellar. This year kicks off with the exciting theme, “A Change"
full_description = "Story Slam - Hope Community Wednesday, February 26, 2025 5:30 PM 7:30 PM 17:30 19:30 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Get ready for another captivating evening of storytelling! We are thrilled to partner with Fairhope Storytellers to bring our community together for an unforgettable Story Slam on Wednesday, February 26, at Page & Palette's Book Cellar. This year kicks off with the exciting theme, “A Change of Plans.” Join us as we reflect on those unexpected moments that shape our lives.**If you’re interested in sharing your story, make sure to review our storytelling guidelines and arrive early to register at 5:30 p.m. We’ll draw for storytellers at 6 p.m. The storytelling will kick off at 6:15 p.m.This event is free and open to the public. We can’t wait to see you there!Story Slam Guidelines:Stories are limited to 6 minutesStories should be personal and trueNo notes or props (music is okay)No -isms toleratedhttps://bit.ly/story-slams#storyslam #storytelling #fairhopeevents #tellyourstory #communityconnections #fairhopestorytellers #hopecommunity #sharingstories #connectingthroughstories #achangeofplans Tagged #storyslam #storytelling #fairhopeevents #tellyourstory #communityconnections #fairhopestorytellers #hopecommunity #sharingstories #connectingthroughstories #achangeofplans"
