title = "Nesting- Stacy (Pre-Order Feb 18) — Page & Palette"
description = """
Pre-order the book that Stacy loves! Nesting, by Roisín O'Donnell, comes 
out on February 18th. Secure your copy as soon as it comes out!

“A new voice in Irish Fiction, O’Donnel deserves your attention.  I cared 
about Ciara Fay the moment I met her and her journey is fraught with more 
struggles and worry than anyone should endure.  After suffering tremendous 
emotional abuse from her husband, Ciara chooses to leave with young 
daughters and a baby on the way.  She doubts her choice as he’s never hit 
her and she navigates a new world without support or employment.  By all 
outward appearances she had the perfect life, yet behind closed doors, it’s 
a different matter.  Doing all she can to provide stability and a “nest”  
for her children, this is an heroic tale of crafting a new life against the 
odds.  Wonderful characters and an intimate look at what we present to the 
world versus what it is. Also a realistic account of how difficult it is to 
leave.   A hopeful novel.” - Stacy"""
