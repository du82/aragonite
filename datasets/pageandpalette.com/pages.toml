["https://pageandpalette.com/events-master/2025/2/6/kate-alice-marshall-author-event"]
title = "Kate Alice Marshall - Author Event — Page & Palette"
description = "Join us on Thursday, February 6th, at 6 PM for an exciting event featuring Kate Alice Marshall and her latest thriller,  A Killing Cold , in conversation with our very own staff member, Stacy. This is a free event—no ticket required—though limited copies will be available if you’d like to secure you"
full_description = "Kate Alice Marshall - Author Event Thursday, February 6, 2025 6:00 PM 8:00 PM 18:00 20:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us on Thursday, February 6th, at 6 PM for an exciting event featuring Kate Alice Marshall and her latest thriller, A Killing Cold, in conversation with our very own staff member, Stacy. This is a free event—no ticket required—though limited copies will be available if you’d like to secure your own! You can pre-order here: A Killing Cold Pre-Order/Signed CopyA FREEZING COLDA woman invited to her wealthy fiance’s family retreat realizes they are hiding a terrible secret—and that she’s been there before, by the bestselling author of What Lies in the Woods.A whirlwind romance.When Theodora Scott met Connor—wealthy, charming, and a member of the powerful Dalton family—she fell in love in an instant. Six months later, he’s brought her to Idlewood, his family’s isolated winter retreat, to win over his skeptical relatives.Stay away from Connor Dalton.Theo has tried to ignore the threatening messages on her phone, but she can’t ignore the footprints in the snow outside the cabin window or the strange sense of familiarity she has about this place. Then, in a disused cabin, Theo finds something impossible: a photo of herself as a child. A photo taken at Idlewood.I’ve been here before.Theo has almost no recollection of her earliest years, but now she begins to piece together the fragments of her memories. Someone here has a shocking secret that they will do anything to keep hidden, and Theo is in terrible danger. Because the Daltons do not lose, and discovering what happened at Idlewood may cost Theo everything.KATE ALICE MARSHALLKate Alice Marshall is the bestselling author of thrillers and horror for kids and adults. Her middle grade books include the Secrets of Eden Eld trilogy and Extra Normal. In YA, she’s written the survival thriller I Am Still Alive, as well as supernatural suspense including Rules for Vanishing and The Narrow. She made her adult thriller debut with What Lies in the Woods, followed by the USA Today bestseller No One Can Know.She lives outside Seattle with her family, two very friendly (but not very smart) golden retrievers, and a growing collection of fancy pens. BOOK TALK REVIEWS The book will be released on February 4th, so you’ll have a couple of days to get a head start on this thrilling read! This book is also featured in our quarterly Book Talk, if you’d like to hear what we have to say about the book on February 4th at 6PM! Here’s a sneak peak of what our staff has to say:”Gripping, unexpected twists, suspenseful, and fast-paced, this book is the perfect winter thriller! A simple holiday trip to meet the future in-laws turns out to be anything but cozy -- creepy text messages, mysterious footprints in the snow and buried secrets revealed. Filled with truly detestable characters and an endearing protagonist, A Killing Cold is an atmospheric cat-and-mouse game I could not put down!” - Anderson“I was easily sucked into this mystery/thriller. Thrillers are a bit of a hit or a miss for me, because of characters and plotline. A solid thriller that kept me guessing and suspecting everyone.” - Tyler“As the snow hit Fairhope, I grabbed this book, a quilt, and went along for the ride. All that Anderson said! Such a fun read. I never knew what was happening and I loved it!” - Stacy"
