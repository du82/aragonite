["https://pageandpalette.com/events-master/2025/1/25/angela-jackson-brown"]
title = "Angela Jackson-Brown — Page & Palette"
description = "Sometimes family is found in the most unlikely of places . . ."
full_description = '''Angela Jackson-Brown Saturday, January 25, 2025 4:00 PM 6:00 PM 16:00 18:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Sometimes family is found in the most unlikely of places . . . In the small college town of Troy, Alabama, amidst the backdrop of 1967, Katia Daniels lives a life steeped in responsibility. At the Pike County Group Home for Negro Boys, she pours her heart into nurturing the young lives under her care, harboring a longing for children of her own. Katia's romantic entanglement with an older man brings comfort but also stirs questions about the path she's chosen.The weight of her family's history bears down on her; a twin brother is missing in action in the heart of the Vietnam War. Having lost her father to cancer, Katia took up the mantle of caretaker, ensuring her mother and brothers were looked after. Her sense of duty extends to the boys at the group home, creating a web of obligations that stretches her emotional bandwidth thin.Amidst a power struggle at work with the board, Katia finds solace in the pages of romance novels and the soothing melodies of Nina Simone. When Seth Taylor, a familiar face from her high school days, reenters Katia's life, he brings with him a breeze of nostalgia and a reminder of a time when her dreams felt less tethered. As their friendship rekindles, Katia grapples with the idea of making choices for herself, even as the realization that she can no longer have children weighs heavily on her.This novel is a poignant tale of a woman torn between the demands of her heart and the responsibilities she's shouldered for so long. Set against the backdrop of a changing South, this novel delves into the complexities of love, family, and self-discovery in a time of transformation and upheaval."Jackson-Brown (THE LIGHT ALWAYS BREAKS) delivers a touching story of a middle-aged Black woman and the burdens she shoulders during the Vietnam War . . . Jackson-Brown ably captures Katia's indomitable spirit and devotion to her family. This is worth a look." --Publishers Weekly'''
year_published = 2025
year_updated = 2025
