["https://pageandpalette.com/events-master/2025/2/9/destiny-dawn-harris-author-signing"]
title = "Destiny Dawn Harris -- Author Signing — Page & Palette"
description = "About the Book:"
full_description = "Destiny Dawn Harris -- Author Signing Sunday, February 9, 2025 2:00 PM 4:00 PM 14:00 16:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS About the Book: FROM 8,000 MILES is the true story of internet danger and the lengths one family had to go to save their daughter. Victoria left her home in the middle of the night, without telling anyone, to get on a plane for India to meet a man she had been talking to online. (Watch the book trailer on YouTube at this link: https://youtu.be/mt3Hbgc1qFY?si=myrwTBK0eyySmg1G)Destiny Harris recounts in vibrant and gut-wrenching detail the journey to rescue her twenty-one-year-old daughter who had never lived away from home before. It was a rescue that involved Homeland Security, Human Trafficking agencies, their congressman, family, friends, and an arena of social media followers who became aware of the story…some rooting for them and others siding with the love-struck couple who was “being oppressed.”The betrayal and intrigue went deeper as the Harrises flew to and from India, expecting to bring their daughter home. They saved her life, but six years later, they have not received a single text or call from Victoria.Destiny felt strongly that she needed to write her story, knowing how it could educate and serve to save other loved ones from falling into such an easy and sinister trap. Predators no longer need to come through the door, the window, or even our country, they slip in through the screens of our children and into their hearts and minds.From 8,000 Miles is a story of loss and tragedy, but also a testament to the many miracles God provided. Destiny felt God’s closeness amid her pain as He gave her the strength and love it takes to save someone who doesn’t want to be saved.From all that she has learned, Destiny started a YouTube channel, Destiny Dawn, where mothers come together to support each other and ease the pain and suffering in the world. It is a space where stories can be shared and wisdom gained because motherhood can be so joyful and, at the same time, break our hearts. Brokenheartedness is a journey and does not have to be a permanent stay. Destiny says, “We will get through it together, and you CAN come out on the other side… better.” Learn more at www.DestinyDawnOfficial.com."
