["https://pageandpalette.com/events-master/2024/12/5/signe-pike-author-event"]
title = "Signe Pike - Author Event — Page & Palette"
description = "Join us on Thursday, December 5th at 6PM to meet Signe Pike and hear all about to her newest book in the Lost Queen series, The Shadowed Land. Ms. Pike will be in-conversation with P&amp;P’s Anderson McKean.    The Shadowed Land"
full_description = "Signe Pike - Author Event Thursday, December 5, 2024 6:00 PM 8:00 PM 18:00 20:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us on Thursday, December 5th at 6PM to meet Signe Pike and hear all about to her newest book in the Lost Queen series, The Shadowed Land. Ms. Pike will be in-conversation with P&P’s Anderson McKean.The Shadowed Land Scotland, AD 580: A queen has risen. A battle has been won. Loved ones who were lost have been reunited. But in a land of power-hungry kings, peace is precarious and cannot last for long. All too soon, circumstance pulls both Britons and Scots back to their own destinies. The warrior Artúr receives a mysterious summons from his father in Dalriada. Queen Languoreth and her brother must return to Strathclyde with the dangerous former bishop Mungo in tow, determined to maintain the fragile balance between the Christians and the people of the Old Way. Meanwhile, the young priestess Angharad must travel deep into the shadowed land of the Picts, hoping to become the initiate of Briochan, a druid who practices the secret Celtic art of weather work. As they rise to meet their fates, they are pushed to impossible new frontiers: each must decide whether they are willing to do what it takes to become the heroes their harrowing days demand. Set in the sprawling historical landscape of early medieval Scotland, Pike’s critically acclaimed retelling of the Arthurian saga thrusts readers into a world of ambition, loyalty and love, revealing truths that have for too long been buried by legend.“A legend-steeped story of the real King Arthur and his contemporaries, The Shadowed Land is full of mystery and Celtic magic, shimmering lochs and verdant glens, snow-cloaked mountains and deep forests, fierce battles and fragile love. Deeply researched, sweeping, and utterly compelling, The Shadowed Land is this winter’s can’t-miss historical epic.” —Kristin Harmel, New York Times bestselling author of The Paris DaughterSigne PikeSigne Pike is the author of The Lost Queen series, which has been optioned for television, and the travel memoir Faery Tale. The series (originally a trilogy) is being developed as a television series by Made Up Stories after Bruna Papandrea won the rights in a competitive Hollywood auction in 2018.Signe Pike was born in Ithaca, NY, and graduated from Cornell University with her Bachelor of Science in Communication. She worked as an acquisitions editor at Random House and then Penguin before leaving to write her first book, a travel memoir entitled Faery Tale: One Woman's Search for Enchantment in a Modern World. Pike has researched and written about Celtic history for the past fifteen years. “When you have lived a life as long as mine, you come to understand that all gods, and all stories, are different names for the same thing. Beneath it all, there is one god with many faces, but always one god. There is one story with many variations, but always the same ending.” — Signe Pike, The Lost Queen"
