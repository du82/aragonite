["https://pageandpalette.com/events-master/2025/4/26/sandra-shaw-author-signing"]
title = "Sandra Shaw -- Author Signing — Page & Palette"
description = "About the author"
full_description = '''Sandra Shaw -- Author Signing Saturday, April 26, 2025 12:00 PM 2:00 PM 12:00 14:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS About the author Sandra Shaw calls her writing the "Weather of Words." She reads the skies as a TV morning show meteorologist. She extracts elements of mystery and soul as an author. Shaw's style mixes atmospheric layers of science and suspense, poetry and the supernatural. Sandra curates her ideas at home in South Florida where she works just as hard as a mother. She's an @aarmy athlete and a servant leader @vouschurch. Shaw is also a member of "The Arena", a group of entrepreneurs, innovators, and futurists. @thearena "SolHuBod" is her debut novel. Shaw's "Met Mystery Series" is a set of short stories under her pen name, Ziva Bristow.About Book:10 year old Mbaye Diagne doesn't see himself as an orphan. He sees himself as the leader of the SolHuBod Club. Every day is an imagined mission around the garbage-laden edges of the African refugee camp. "Hear the Unseen." That's what his dad always said about wonder. Mbaye, his two best friends, and their pet rat comb through the squalor adventurously.Yet play turns to real horror. The three accidentally stumble upon a darkness with quantum implications. It could separate the SolHuBods from the one they love most. An invisible predator hunts. It's not after what the kids know. It's after who they are: soul, human, body.Feixing twisties, a sect based on a fish, cyborg students, and masked assassins weave through a constant of childlike hope. But is it enough? Especially as they're spiraling into the fate of humanity?'''
