["https://pageandpalette.com/staff-picks/the-favorites-january-staff-pick"]
title = "The Favorites (January Staff Pick) — Page & Palette"
description = '''
The Favorites, by Layne Fargo, is the book that our staff enjoyed and chose 
for this month’s staff pick. The book is available now to purchase.

"I loved everything about this exhilarating novel. I raced through this 
epic love story set within the demanding, cutthroat world of competitive 
ice dancing filled with fascinating characters and all the drama we love 
both on and off the ice." - Anderson

To the world, they were a scandal. To each other, an obsession.

An epic love story set in the sparkling, savage sphere of elite figure 
skating about a woman determined to carve her own path on and off the ice

She might not have a famous name, funding, or her family’s support, but 
Katarina Shaw has always known that she was destined to become an Olympic 
skater. When she meets Heath Rocha, a lonely kid stuck in the foster care 
system, their instant connection makes them a formidable duo on the ice. 
Clinging to skating—and each other—to escape their turbulent lives, Kat and 
Heath go from childhood sweethearts to champion ice dancers, captivating 
the world with their scorching chemistry, rebellious style, and 
rollercoaster relationship. Until a shocking incident at the Olympic Games 
brings their partnership to a sudden end.

As the ten-year anniversary of their final skate approaches, an 
unauthorized documentary reignites the public obsession with Shaw and 
Rocha, claiming to uncover the "real story" through interviews with their 
closest friends and fiercest rivals. Kat wants nothing to do with the 
documentary. But she can't stand the thought of someone else defining her 
legacy either. So, after a decade of silence, she's telling her story: from 
the childhood tragedies that created her all-consuming bond with Heath to 
the clash of desires that tore them apart. Sensational rumors have haunted 
their every step for years, but the truth may be even more shocking than 
the headlines.

Inspired by the powerful love and hate that fuel Emily Bronte’s classic, 
Wuthering Heights, The Favorites is an exhilarating dance between passion, 
ambition, and what it truly means to win.'''
