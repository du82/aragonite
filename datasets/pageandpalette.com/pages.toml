-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550602418181-PY1SM917O89TYAQS81W0/5.jpg" alt="5.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550602436054-K3U45MU7HY6K5W5GZNKB/thumbnail2.jpg" alt="thumbnail2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1538420479594-P5ZHXOY89EJ8300T1QCS/20170509_181722.jpg" alt="20170509_181722.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1538424331776-NMZJ66GJ6XUA481GUNLU/Screen-Shot-2018-09-11-at-11.13.30-AM.jpg" alt="Screen-Shot-2018-09-11-at-11.13.30-AM.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1563813475781-9DOBDQL0TTB82P2FJ0VF/20190720_153820.jpg" alt="20190720_153820.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/56b14d71f8baf3f55714aca5/1550603356159-KQIOD95I8O7CNUP0ICD4/20190207_181612.jpg" alt="20190207_181612.jpg" /> There’s a story here.To say we’ve been open since 1968 isn’t enough. We have to give that time, dimension. Otherwise, we just come off sounding, well, old. We are seasoned and proud of it but our thinking has to be new. Hell, we’ve been through more hurricanes than Pat O’Brien’s on a Saturday, and we’re still here. Still standing.Our strength comes from a center that the big box boys just don’t have. What is it? We have a story…A story with a whole cast of characters. Millions are in the books we sell, but look more closely. You’ll find them in our aisles, behind the register and camped out in the café. You see, there’s no need to create some mystique when you’ve been around this long. It’s here.Page and Palette. There’s a story here. Go look and see what Southern Living had to say about us in their issue of some of the best Book Stores around!! It just makes our heart warm!! And an interview with Sonya & Nancye by Scenic 98!!If you’ve visited our store on a Tuesday, then you’ve probably seen our advice booth!! Sonya & Nancye, followers of the Bahai’i faith sit in the coffee shop and look forward to sharing their wisdom with all of those who are willing to accept it!! Stop by on any given Tuesday when the doctors are in and ask a question that is eating away at you!! For now, though, read more about these two sweet women, by clicking on the picture below: Upcoming Events Featured Mar 1 Mar 1, 2025 10:00 PM – 11:00 PM22:00 – 23:0010:00 PM – 11:00 PM Brown Bear Brown Bear -- Classic Storytime with Mrs. Paula Mar 1, 2025 10:00 PM – 11:00 PM22:00 – 23:0010:00 PM – 11:00 PM Mar 1, 2025 10:00 PM – 11:00 PM22:00 – 23:0010:00 PM – 11:00 PM Mar 2 Mar 2, 2025 5:00 PM – 7:00 PM17:00 – 19:005:00 PM – 7:00 PM Emily Ley - Ticketed Author Event Mar 2, 2025 5:00 PM – 7:00 PM17:00 – 19:005:00 PM – 7:00 PM Mar 2, 2025 5:00 PM – 7:00 PM17:00 – 19:005:00 PM – 7:00 PM Mar 8 Mar 8, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Signs - Book Discussion Mar 8, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Mar 8, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Mar 8 Mar 8, 2025 12:00 PM – 2:00 PM12:00 – 14:0012:00 PM – 2:00 PM Vivian Lee - Author Signing Mar 8, 2025 12:00 PM – 2:00 PM12:00 – 14:0012:00 PM – 2:00 PM Mar 8, 2025 12:00 PM – 2:00 PM12:00 – 14:0012:00 PM – 2:00 PM Mar 14 Mar 14, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Leslie Anne Tarabella - Arts & Crafts Author Signing Mar 14, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Mar 14, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Mar 15 Mar 15, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Morgan Cunningham - Arts & Crafts Author Signing Mar 15, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Mar 15, 2025 10:00 AM – 11:00 AM10:00 – 11:0010:00 AM – 11:00 AM Mar 15 Mar 15, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Amanda Marquardt -- Author Signing Mar 15, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3:00 PM Mar 15, 2025 1:00 PM – 3:00 PM13:00 – 15:001:00 PM – 3