["https://pageandpalette.com/events-master/2025/2/22/karyn-tunks-author-signing"]
title = "Karyn Tunks - Author Signing — Page & Palette"
description = "Join us at Page &amp; Palette for a meet and greet with Karyn Tunks on Saturday, February 22nd at 1 PM! She'll be here with her book,  Mardi Gras in Alabama,  just in time for the Mystic Mutts Parade. Don't miss this festive opportunity to connect with the author!   Mardi Gras in Alabama!   Foll"
full_description = '''Karyn Tunks - Author Signing Saturday, February 22, 2025 1:00 PM 3:00 PM 13:00 15:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us at Page & Palette for a meet and greet with Karyn Tunks on Saturday, February 22nd at 1 PM! She'll be here with her book, Mardi Gras in Alabama, just in time for the Mystic Mutts Parade. Don't miss this festive opportunity to connect with the author!Mardi Gras in Alabama!Follow Folly as he celebrates Mardi Gras in Alabama! Hang on tight; he wants to see every parade in Mobile and Baldwin counties. Folly has a front-row seat as he rides with kings and queens and tags along with Joe Cain. From catching throws with the crowd to joining in with the marching bands, Folly is a part of all the festivities. With bouncing rhyme and lively illustrations, author Karyn Tunks and illustrator Alexis Braud capture the unique flavor of Carnival season along Alabama’s Gulf Coast. Highlighting the best of the local revelry, Folly brings young readers along as he explores favorite Mobile-area traditions. A glossary of people, places, and things completes the introduction to the most colorful season of the year. So come along and join the fun as we celebrate Mardi Gras in Alabama in this informative picture book for locals―and those who wish they were! Karyn Tunks Dr. Karyn W. Tunks is Professor of Early Childhood and Elementary Education at the University of South Alabama. She teaches courses in Adolescent and Children’s Literature, Elementary Language Arts, and Early Childhood Education. She received her Ph.D. from Florida State University, and M.Ed. and B.S from the University of South Alabama. She has over 25 years of experience teaching preschool through graduate school. Dr. Tunks conducts research and writes on a variety of topics relevant to teaching and learning. She has written four books for early childhood teachers. Her first children’s picture book is titled, “JUBILEE!” and was published in 2012 and a second picture book, "USS Alabama: Hooray for the Mighty A!" was published in 2015.'''
