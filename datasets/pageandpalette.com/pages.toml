["https://pageandpalette.com/events-master/2024/12/17/martie-duncan-author-event"]
title = "Martie Duncan Author Event — Page & Palette"
description = "Join us and Martie Duncan for a delicious event in the Book Cellar on Tuesday, December 17th at 6pm!! This is not a ticketed event.   “I went out on the road during the  2024 Year of Alabama Food  to find the best recipes from restaurants across Alabama. My new book,  The Alabama 100 Best Recipes, R"
full_description = '''Martie Duncan Author Event Tuesday, December 17, 2024 6:00 PM 8:00 PM 18:00 20:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Join us and Martie Duncan for a delicious event in the Book Cellar on Tuesday, December 17th at 6pm!! This is not a ticketed event.“I went out on the road during the 2024 Year of Alabama Food to find the best recipes from restaurants across Alabama. My new book, The Alabama 100 Best Recipes, Restaurants & Road Trips features 100 favorite restaurant recipes plus my road trip tips on where to go and what to eat when you get there.” -Martie Duncan About Martie (Via her Website): My story? I have a love of food, weddings, travel, and the interesting people you meet along the way. I learned to cook beside my mother who was the best cook I've ever known, hands down. Although I lost her years ago, I still talk to her in the kitchen, especially when I'm using her old rolling pin or magical cast iron skillet. I was a devoted daughter to my sweet ballroom-dancing dad; I lost him recently and miss him every single day. I am a person of great faith. God is my co-pilot in life, giving me the courage to put myself out there and try new things.When I auditioned for Food Network Star Season 8, I don't know what made me think I could do it; I have no formal culinary training nor restaurant experience. I simply knew I wanted to help people celebrate life's occasions without stress and anxiety and I thought a show on Food Network would be the best way to make that happen. I was selected by Alton Brown after a months-long audition process. The show aired Summer 2012. While I did not win, the incredible moment on Food Network Star when Susie Fogelson told me "Martie, we want to see a pilot from you, too" absolutely changed my life. Since then, I have toured the state of Alabama many times to write books about Alabama food. I won an episode of Guy’s Grocery Games with my buddy Justin Warner from Food Network— where I can sometimes be seen judging episodes of Beat Bobby Flay. What's new? My fifth book will be out soon! It can be found in bookstores, restaurants, or shops across the state of Alabama. Get more info here. All my best,Martie'''
