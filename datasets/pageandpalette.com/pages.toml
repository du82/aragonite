description = "What does it mean to be different? When Johnny Cruel is born with strange appendages on his back in the 1930s South, the locals think he's a devil. Determined to protect him, his mother fakes his death, and they flee. Thus begins Johnny's yearslong struggle to find a place he belongs. From a turpent"
full_description = "Mark Mustian - Author Event Wednesday, March 26, 2025 6:00 PM 8:00 PM 18:00 20:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS What does it mean to be different? When Johnny Cruel is born with strange appendages on his back in the 1930s South, the locals think he's a devil. Determined to protect him, his mother fakes his death, and they flee. Thus begins Johnny's yearslong struggle to find a place he belongs. From a turpentine camp of former slaves to a freak show run by a dwarf who calls herself Tiny Tot and on to the Florida capitol building, Johnny finds himself working alongside other outcasts, struggling to answer the question of his existence. Is he a horror, a wonder, or an angel? Should he hide himself to live his life? Following Johnny's journey through love, betrayal, heartbreak, and several murders, Boy With Wings is a story of the sacrifices and freedom inherent in making one's own special way-and of love and the miracles that give our lives meaning."
