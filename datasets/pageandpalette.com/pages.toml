title = "Vedran Dedic -- Author Signing — Page & Palette"
description = "Born in Bosnia, a boy was uprooted by civil war and thrust into a life displaced. Arriving in a new country, not once, but twice, he faces challenges of language barriers, cultural differences, and starting over. Always an outsider, always looking for a community, a resting place, a home. The young"
full_description = "Vedran Dedic -- Author Signing Saturday, January 25, 2025 2:00 PM 4:00 PM 14:00 16:00 Page & Palette 32 South Section Street Fairhope, AL, 36532 United States (map) Google Calendar ICS Born in Bosnia, a boy was uprooted by civil war and thrust into a life displaced. Arriving in a new country, not once, but twice, he faces challenges of language barriers, cultural differences, and starting over. Always an outsider, always looking for a community, a resting place, a home. The young refugee finds solace in the beautiful game. Determined to pursue his quest for identity, he searches across continents for a football club that he sees himself in and will help him realize his dream of finding a community of like-minded people. The story explores themes of hope, perseverance, and the power of football to unite people from different backgrounds."
