full_description = "My doctoral work was with Mark Craven, developing algorithms for the EDGE project. We developed machine learning methods to discriminate toxins based on gene expression levels. The ultimate goal of the EDGE project is to make the analysis of industrial chemicals faster, cheaper, and more accurate. My dissertation is here. The source code for tools I've written for scientific computation in Java are available here, as part of my work with time series analysis. I'm from the state of Oregon in the U.S., though I was raised up and down the Pacific coast. I earned my B.A. in Computer Science/Mathematics (combined major) and Physics with Honors from Lewis & Clark College in 1999, and my M.S. in Computer Science from the University of Wisconsin in 2002. I don't teach at present, though I'm working on a Delta teaching certificate to supplement my Ph.D. In addition to extra teaching classes, I'm working on an Astronomy teaching program called cSky. My personal page is located here. In addition, <a href='social.html'>here's</a> a small attempt at social engineering."
