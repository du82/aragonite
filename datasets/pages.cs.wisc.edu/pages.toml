["http://pages.cs.wisc.edu/~aggarwal"]
title = "Nidhi Aggarwal"
description = "Nidhi Aggarwal"
full_description = "I am a PhD student at the University of Wisconsin-Madison. My research interests are in computer architecture, virtual machines, high availability systems and memory system design. My advisors are Professor Jim Smith and Professor Kewal Saluja. My thesis work is being done in collaboration with Norm Jouppi and Partha Ranganathan at HP Labs. My research focuses on highly available systems built using commodity hardware and software. Please see my resume for more information. MICRO, November 2008 Nidhi Aggarwal, Norman P. Jouppi, James E. Smith, Parthasarathy Ranganathan, Kewal K. Saluja. Implementing High Availability Memory with a Duplication Cache. To appear in the Proceedings of the 41st Annual International Symposium on Microarchitecture (MICRO-41), Lake Como, Italy, November 2008. ASPLOS, March 2008 Nidhi Aggarwal, Norman P. Jouppi, Parthasarathy Ranganathan, James E. Smith, Kewal K. Saluja. COVERT: Configurable Virtual Redundancy for Transparent High Availability on Commodity Software. In Poster Session of ASPLOS-08, Seattle, Washington, March 2008.[ pdf] HPCA, February 2008 Nidhi Aggarwal, Jason F. Cantin, Mikko H. Lipasti, James E. Smith. Power Efficient DRAM Speculation. In Proceedings of the 14th International Symposium on High-Performance Computer Architecture (HPCA-08), Salt Lake City, Utah, February 2008. [ pdf] IEEE Computer, June 2007 Cover Feature. Invited journal paper based on the ISCA 2007 paper. Nidhi Aggarwal, Parthasarathy Ranganathan, Norman P. Jouppi, James E. Smith. Benefits from Isolation in Commodity Multicore Processors. IEEE Computer, June 2007.[ pdf] ISCA, June 2007 Nidhi Aggarwal, Parthasarathy Ranganathan, Norman P. Jouppi, James E. Smith. Configurable Isolation: Building High Availability Systems with Commodity Multicore Processors. In Proceedings of the 34th Annual International Symposium on Computer Architecture (ISCA-34), San Diego, California, June 2007.[pdf] SELSE, April 2007 Nidhi Aggarwal, Parthasarathy Ranganathan, Norman P. Jouppi, James E. Smith, Kewal K. Saluja, George Krejci. Motivating Commodity Multi-Core Processor Design for System Level Error Protection. In Proceedings of the 3rd Workshop on Silicon Errors in Logic System Effects (SELSE-3), Austin, Texas, April 2007. [ pdf]"
