title = "Adwait Tumbde"
full_description = "Adwait Tumbde Graduate Student Computer Sciences Department University of Wisconsin, Madison Contact Information 7370 Computer Sciences Department of Computer Sciences University of Wisconsin-Madison 1210 West Dayton Street Madison, WI 53706-1685 USA 608-890 0019(office) adwait at cs dot wisc dot edu I am a graduate student in the Department of Computer Sciences. I work with Prof. Michael Swift on manageability of the operating systems. I have also worked with Prof. David DeWitt and Prof. Jeffrey Naughton on managing the operational data of a computational grid (Condor) in a relational database. Before coming to Madison, I received B.Tech. degree from National Institute of Technology, Trichy (better known as REC Trichy), India. Resume Updated on 02/25/07 [txt] [doc] [pdf] Projects Configuration Data Management System We recently submitted a position paper on configuration data management system[pdf]. Course Work Advanced Operating Systems Advanced Topics in Database Systems Machine Learning Advanced Computer Networks Data Models and Languages Computer System Modeling Fundamentals Introduction to Bioinformatics Technological Enterpreneurship Teaching CS 764 - Advanced Topics in Database Systems Jan 2006 - May 2006 CS 302 - Introduction to programming Jan 2005 - Dec2005 Menu Home Projects Course Work Teaching RESUME"
