["http://pages.cs.wisc.edu/~aanjneya"]
title = "Mridul Aanjaneya"
full_description = "I will be joining the Department of Computer Science at Rutgers University as a tenure-track Assistant Professor starting Fall 2017. Previously, I was a postdoctoral researcher in the Department of Computer Sciences at the University of Wisconsin-Madison. I have a Ph.D. in Computer Science from Stanford University, where I was advised by Prof. Ronald Fedkiw. During graduate school, I also worked as a consultant in the Spatial Technologies team at the Nokia Research Center. Prior to joining Stanford, I graduated from the Indian Institute of Technology Kharagpur with a B. Tech. in Computer Science and Engineering. As an undergraduate, I also spent two wonderful summers as a research intern in the GEOMETRICA team at INRIA Sophia Antipolis. I am interested in the areas of computer graphics, scientific and high-performance computing, computational physics, robotics, biomechanics, computational geometry and their applications in the physical sciences and engineering. Some of my recent work has focused on pushing the limits of current numerical algorithms for capturing small scale details in solid and fluid simulations by leveraging accelerations both at the algorithmic and systems level. More broadly, I am interested in the design of next generation algorithms that can facilitate interdisciplinary collaboration with researchers in engineering and medicine for understanding phenomena that are intractable by current means. Outside of work, I enjoy running, rock climbing, hiking, watching movies, and playing piano. Power Diagrams and Sparse Paged Grids for High Resolution Adaptive Liquids Mridul Aanjaneya*, Ming Gao*, Haixiang Liu, Christopher Batty and Eftychios Sifakis (*Joint first authors) ACM Transactions on Graphics, (SIGGRAPH proceedings), 36, 4, (2017) A scalable Schur-complement fluids solver for heterogeneous compute platforms Haixiang Liu, Nathan Mitchell, Mridul Aanjaneya and Eftychios Sifakis ACM Transactions on Graphics, (SIGGRAPH Asia proceedings), 35, 6, 201:1-12 (2016) Inside Front Cover Image"
