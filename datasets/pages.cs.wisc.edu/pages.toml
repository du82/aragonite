["http://pages.cs.wisc.edu/~acurtis"]
title = ""
full_description = "Diagnosis and staging of many types of cancer rely in part on evaluation of nuclear characteristcs such as size and shape. As such, automated techniques for segmenting nuclei are key for cancer image analysis pipelines. The current gold standard for diagnosis and staging is manual evaluation of slides by eyeballing these nuclear characteristics, leading to issues of poor reproducibility. Multiple techniques for automated nuclei segmentation exist [3-5] and are becoming more common in the research and clinical setting. We aimed to implement one of these techniques and to evaluate it on a data set of certain tissue type that it has not been evaluated against in the literature (to our knowledge). In this project, we aimed to implement a marker-controlled watershed segmentation algorithm [1] and evaluate it on a set of colon cancer images which have already had their nuclei labeled. Ultimately, this is a marker-controlled watershed approach [11] that uses fast radial symmetry transformation (FRST) [2] to generate the markers. (These steps are explained in Implementation Details.) We implemented the segmentation algorithm in MATLAB. To evaluate this implementation, we identified a data set published by the Tissue Image Analytics Lab at the University of Warwick (see Files for a link). This data set contains 100 cases, each of which contains a 500x500px whole-slide tissue image as well as a set of human-labeled nuclei centroids (x, y coordinate of each centroid). We set up an evaluation pipeline that involved taking the whole-slide image and running it through segmentation, producing a labeled image of nuclei. We then compared our results against this labeled images to measure the overall recall and precision of the segmentation. We implemented the algorithm described in [1] as accurately as we reasonably could based on the text. This involved six approximately independent steps to accomplish: The goal of this step is to remove irrelevant structures while maintaining the overall nuclear morphology. Since the tissues are stained using hematoxylin and eosin (H&E) [9], we used color deconvolution [8] to separate only the hematoxylin channel, which stains the nuclei. We used CellProfiler [10] to perform color deconvolution. We then used morphological opening and closing by reconstruction (imerode/imdilate/imreconstruct in MATLAB) to smooth the nuclear structures."
