["http://pages.cs.wisc.edu/~ace"]
title = "Adam Everspaugh"
full_description = '''PhD, University of Wisconsin—Madison v1 = 'adam.everspaugh'; v2 = 'gmail.com'; document.write('<a href=\"mailto:' + v1 + '@' + v2 + '\">'); document.write(v1 + '@' + v2 + '</a>'); In August 2017 I completed my PhD and became a Principal Engineer at the predictive analytics company, Uptake, where I focus on cryptography. Adam Everspaugh, Samuel Scott, Kenneth Patterson, and Thomas Ristenpart. Crypto 2017. Paper (full version): [PDF] Adam Everspaugh, Rahul Chatterjee, Samuel Scott, Ari Juels, and Thomas Ristenpart. USENIX Security 2015. Paper (full version): [PDF] Slides: [PDF] Stephen Checkoway, Matt Fredrikson, Ruben Niederhagen, Adam Everspaugh, Matt Green, Tanja Lange, Thomas Ristenpart, Daniel J. Bernstein, Jake Maskiewicz, and Hovav Shacham. USENIX Security 2014. Paper: [PDF] Adam Everspaugh, Yan Zhai, Robert Jellinek, Thomas Ristenpart, and Michael Swift. IEEE Security and Privacy 2014. Paper (full version): [PDF] Slides: [PDF] Data, scripts, and tools that were used to derive the results in the paper Not-So-Random Numbers in Virtualized Linux and the Whirlwind RNG, including an instrumented Linux kernel and entropy estimation tools. Adam Everspaugh had the honor of earning a PhD at the University of Wisconsin Computer Sciences Department researching topics in computer security under the excellent advising of Professors Thomas Ristenpart and Michael Swift.'''
