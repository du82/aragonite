["http://pages.cs.wisc.edu/~agarwalt"]
title = "Tejaswi Agarwal"
full_description = "Namaste! I am Tejaswi Agarwal, a senior engineering lead at Uber Technologies Inc., San Francisco (since 2019). At Uber - I work on large scale distributed systems and real time platforms that serve over 1M+ requests per second and 150M+ users globally. In the past I've worked at Oracle Inc in Redwood City, USA in the database resource manager team, where I was responsible for building the first data import pipeline for the Oracle Cloud Database. Previously, I received my Master of Science at the University of Wisconsin, Madison. I was also visiting researcher at the Unviersity of Missouri-Columbia and I obtained my undergraduate degree in computer science from VIT University-India. Parallel algorithms, distributed computing and building systems at scale are broadly the areas which really interest me. My research has won awards at prestigious international conferences including ICS and HPDC. Note: This website has is currently being updated. News April 2021 - Served in the Artifact Evaliation (AEC) Technical Program Committee at EuroSys '21. June 2020 - Mentor at Hackbright Academy - a leading gender equity coding bootcamp. April 2019 - Started working at Uber Technologies Inc. in the systems platform team. June 2016 - Started working at Oracle Inc. in the Database resource management team. My work involves building novel techniques to import data in the Oracle Cloud. August 2014 - Started graduate school in Computer Science at the University of Wisconsin-Madison. August 2014 - Our paper on cluster scheduling is accepted at HiPC'14. August 2014 - Won the ACM Student Research Competition at Parallel Architectures and Compilation Techniques, PACT 2014 in Edmonton, Canada. December 2013 - Started working at the Networking and Parallel Systems Lab, University of Missouri, Columbia with Prof. Michela Becchi . September 2013 - Summer Internship featured in 'The Hindu' Newspaper. Click here to read the article. June 2013 - Won the Best Poster Award at HPDC 2013 in New York. May 2013 - Research poster on Image Noise Removal using GPUs accepted at HPDC 2013, Eugene, Oregon, USA. April 2013 - Research poster on Hypergraph Image modelling using GPUs accepted at ICS 2013, Eugene, Oregon, USA. February 2013 - Undergraduate teaching assistant for the Microprocessors and Interfacing, CSE213 course for Winter 2012 semester. December 2012 - Selected for the prestigious MITACS Globalink Research Intern at the University of Calgary, Alberta, Canada for summer 2013 with Prof. Diwakar Krishnamurthy. February 2012 - Summer 2012 at IIT-Madras with Prof. Kamakoti at RISE lab."
