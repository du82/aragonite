["http://pages.cs.wisc.edu/~abedi"]
title = "Ali Abedi | UW-Madison"
full_description = 'I am an Assistant Professor in the Department of Computer Sciences at the University of Wisconsin-Madison. Prior to joining UW-Madison, I was a postdoc at UC Berkeley and Stanford University, advised by Professors Anant Sahai and Sachin Katti. I received my PhD from the University of Waterloo, advised by Professor Tim Brecht. My research area is computer systems and networking with a special focus on wireless networking/sensing, and low-power and low-cost networking for Internet of Things (IoT) devices. My Curriculum Vitae (Updated October 2024). Email: abedi{at}cs.wisc.edu Twitter GitHub LinkedIn Address: Computer Sciences room 6355 1210 W. Dayton Street University of Wisconsin-Madison Madison, Wisconsin 53706-1613 "Polite" wireless protocols: privacy/security consequences I found a loophole in the Wi-Fi standard that allows forcing a Wi-Fi device to continuously transmit packets. The discovery of this loophole has led to several interesting studies that look at the privacy and security consequences: HotNets 2020, MobiCom 2022, IEEE IoT Journal 2023, IEEE Sensors Journal 2023 Learn more Automatic evaluation of RF sensors without supervision RF sensors are a key building block of a variety of wireless systems from spectrum monitoring to environmental sensing. We design systems that automatically evaluate these sensors using "signals of opportunity" without any human supervision: HotNets 2023 Learn more Low-power and battery-free networking for IoT Billions of new IoT devices will be shipped in the near future. To make them zero maintenance and to lower their environmental pollution impact, it is desirable to eliminate the battery or make their batteries last for tens of years. We have designed low-power and battery-free networking solutions for the 2.4 GHz WiFi and 24 GHz mmWave bands: SIGCOMM 2019, HotNets 2019, SIGCOMM 2020, MobiCom 2021 Learn more'
year_published = 2025
clearnet = "http://pages.cs.wisc.edu/~abedi"
