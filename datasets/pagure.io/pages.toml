["https://pagure.io/389-ds-portal"]
title = "Overview - 389-ds-portal - Pagure.io"
full_description = "This is a small, self contained web portal to allow users to perform some limited self service steps such as changing their name, password or other details. It is not inteded to replace the cockpit administration console or lib389 cli tools. It is only for limited self-service actions. This project is NOT COMPLETE and NOT PRODUCTION READY yet. Please contact the 389 team if you are interested in this and testing it. Be ware that there are current possible security issues in the code base that make it not-feasible for production deployment. We believe that all people should be respected and welcome in our communities. As such we follow the Fedora Code of Conduct: The 389 Directory Server Self Service Portal is subject to the terms detailed in the license agreement file called LICENSE. Late-breaking news and information on the 389 Directory Server and related projects are available on our wiki page: For Fedora/RHEL testing (not in a container) you need to create virtual environment to ensure python3 is used:"
