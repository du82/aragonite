["https://pagure.io/mroche/aap-network-environment"]
title = "Overview - mroche/aap-network-environment - Pagure.io"
full_description = "This is a quick guide on creating a custom execution environment for managing network devices on AAP 2.x. A custom execution environment (EE) is needed when the default environments don't provide the necessary collections and their dependencies your projects require. There are three types of dependencies handled by EEs: collections, Python libraries, and host packages. The dependency files can be named however you want, but they need to follow the syntax the build system uses. Ansible Galaxy dependencies are specified in the standard requirements.yml format, Python in Pip compatible format, and system packages in the bindep format. Depending on the collections you are using, specifying Python and system dependencies manually may not be necessary. For example, the cisco.ios collection provides its own requirements.txt and bindep.txt files that the ansible-builder tool will use in resolving the necessary dependencies. If a collection doesn't provide these file itself, or you need other dependencies outside the scope of the collections you will need to specify them yourself. In this repository all of the collections follow best practice and describe the dependencies they need, so the inclusion of python.txt and system.txt is purely academic. With the dependencies set, the execution environment needs to be configured. The two main sections are the build_arg_defaults and dependencies sections. For the build arguments, its recommended to specify the Base (runtime) and Builder (creation) images to use when generating your execution environment. As we are deploying on AAP we will use the Red Hat supported AAP 2.1 base and builder images that use Ansible 2.12. These images are based on UBI 8 and as such can be used without a Red Hat subscription. However, it is possible that a host package dependency may not be included in the UBI repositories, hence the recommendation to run the builder on an entitled system. This is the case for this project, which will try to pull in libssh-devel which is only avaialble in the full RHEL repositories."
year_published = 2025
clearnet = "https://pagure.io/mroche/aap-network-environment"
