["https://pagure.io/pagure"]
title = "Overview - pagure - Pagure.io"
full_description = "With pagure you can host your project with its documentation, let your users report issues or request enhancements using the ticketing system and build your community of contributors by allowing them to fork your projects and contribute to it via the now-popular pull-request mechanism. If you have any questions or just would like to discuss about pagure, feel free to drop by our Matrix room. The name Pagure is taken from the French word 'pagure'. Pagure in French is used as the common name for the crustaceans from the Paguroidea superfamily, which is basically the family of the Hermit crabs. There are several options when it comes to a development environment. They are: Docker Compose, Vagrant, and manual. Choose an option below. Docker Compose will provide you with a container which you can develop on. Install it with these instructions. Once all the containers have started, you can access pagure on http://localhost:5000. To stop the containers, press Ctrl+C. Once the containers are up and running, run this command to populate the container with test data and create a new account: An example Vagrantfile is provided as Vagrantfile.example. To use it, just copy it and install Vagrant. Instructions for Fedora: If you get this error Block in synced_folders: Internal error. Invalid: sshfs, when you run vagrant up , you need to install vagrant sshfs plugin, which can be done by: The default Vagrantfile forwards ports from the host to the guest, so you can interact with the application as if it were running on your host machine. vagrant-hostmanager will automatically maintain /etc/hosts for you so you can access the development environment from the host using its hostname, which by default is pagure-dev.example.com. You can choose not to use this functionality by simply not installing the vagrant-hostmanager plugin, but if you want Pagure to provide valid URLs in the UI for git repositories, you will need to adjust Pagure's configuration found in ~/pagure.cfg on the guest."
year_published = 2025
clearnet = "https://pagure.io/pagure"
tags = ["code", "compose", "container", "docker", "documentation", "manually", "name", "pagure", "running", "source"]
