["https://pagure.io/fedora-infrastructure/issue/10291"]
title = "Issue #10291: Postfix complain on some host about its config - fedora-infrastructure - Pagure.io"
full_description = "While this doesn't impact much, I guess it would be nice to get it fixed since that mean the config is no F34 ready, and this generate useless churn in the log. Metadata Update from @mohanboddu: - Issue priority set to: Waiting on Assignee (was: Needs Review) - Issue tagged with: low-gain, low-trouble, ops Hi @misc, I recently joined the fi-apprentice group and thought I would have a go at this, if you don't mind? I haven't worked with postfix before, and have limited experience with ansible so far, so I am not sure of the best way to start, and would be grateful for a steer from someone if possible? In the meantime, I have started having a search around for the error online, and I noticed a lot of the responses refer to the following settings within the main.cf file: smtpd_recipient_restrictions = smtpd_relay_restrictions = So I made a script to pull the above settings from the relevant config files, so that they could be checked, and I noticed that the smtpd_relay_restrictions settings within the main.cf.gateway config file were a little different to the other files, would this have anything to do with it? So that's a kinda old ticket I opened, but I think the error is on the lack of smtpd_relay_restrictions in some config file. To correct that, I would start by getting a F34 host (a non connected VM would work), install postfix and deploy the same config, eg. copying the main.cf and reload, and see if the error can be reproduced. The error was on one proxy (proxy34.fpo) if that help to find the exact config being used, assuming it didn't change since. And yes, that's in one of those file. Not sure which one, and as the error message show, it doesn't say which config. From your investigation, this seems correct for smtpd_recipient_restrictions. However, I would verify the default value smtpd_relay_restrictions on F34 (there is a command to display default, I think that's postconf, the exact command and arguments are left as a exercise to the reader :p ) I have looked into this some more now, and done some testing on a VM as suggested. I have collated my notes and vm configurations etc. into a repo, and saved them here for reference, and hopefully reproduction (if required):"
year_published = 2025
clearnet = "https://pagure.io/fedora-infrastructure/issue/10291"
tags = ["@aheath1992", "@kevin", "@mohanboddu", "assignee", "blocking", "code", "depending", "describe", "easyfix", "fedora-infrastructure"]
language = "en"
