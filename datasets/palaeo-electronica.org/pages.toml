["https://palaeo-electronica.org/content/2025/5401-drishti-and-amira-visualizations"]
title = "Drishti and Amira visualizations"
description = "Drishti and Amira – different visualizations exemplified by the early Cambrian Chengjiang arthropod Leanchoilia illecebrosa from China"
full_description = "Article Search Drishti and Amira visualizations Drishti and Amira – different visualizations exemplified by the early Cambrian Chengjiang arthropod Leanchoilia illecebrosa from China Michel Schmidt, Roland R. Melzer, Huijuan Mai, Xianguang Hou, and Yu Liu Article number: 28.1.a5https://doi.org/10.26879/1358Copyright Palaeontological Association, January 2025 Author biographiesPlain-language and multi-lingual abstractsPDF version Submission: 13 November 2023. Acceptance: 18 December 2024. ABSTRACT Virtual paleontology plays a pivotal role in elucidating the morphology of ancient arthropods. Since 2015, the open-source volume rendering software Drishti, has been employed to uncover concealed morphological features preserved within fossils dating back to the early Cambrian Chengjiang biota, approximately 518 million years old and located in southwest China. Also another program, Amira, has emerged as a potent tool for such investigations. In this study, we undertake a comparative analysis of both programs to comprehensively assess their technical capabilities regarding visualization modes and associated challenges. We selected the extensively studied megacheiran arthropod, Leanchoilia illecebrosa, as a model species and demonstrated how various rendering options, including volume rendering, surface rendering, and isosurface rendering, can be implemented in each program. Furthermore, we showcased the visual outcomes of specific operations such as slicing (utilizing clipping planes and orthoslices) as well as direct volumetric modifications (MOP carve and paint). Our findings indicate that Drishti excels in volume visualization due to its ability to produce realistic and organic graphical representations. In contrast, Amira offers rapid generation of (iso)surface models, which can serve as meshes for subsequent 3D model-based analyses. Both programs prove to be suitable for the analysis of pyritized fossils and enable the depiction of diverse morphological visualizations. However, it is important to note that each program possesses its own set of advantages and limitations. This comparative study aims to explore these characteristics and provide a valuable resource for researchers in selecting the most appropriate tool for their specific scientific purposes. Michel Schmidt. Yunnan Key Laboratory for Palaeobiology, Yunnan University, North Cuihu Road 2, Kunming 650091, People’s Republic of China and MEC International Joint Laboratory for Palaeobiology and Palaeoenvironment, Yunnan University, 2 North Cuihu Road, Kunming 650091, People’s Republic of China and Ludwig-Maximilians-Universität München, Biocenter, Großhaderner Str. 2, 82152 Planegg-Martiensried, Germany and MEC International Joint Laboratory for Palaeobiology and Palaeoenvironment, Yunnan University, 2 North Cuihu Road, Kunming 650091, People’s Republic of China. michel.m.schmidt@outlook.com Roland R. Melzer. MEC International Joint Laboratory for Palaeobiology and Palaeoenvironment, Yunnan University, 2 North Cuihu Road, Kunming 650091, People’s Republic of China and Bavarian State Collection of Zoology, Bavarian Natural History Collections, Münchhausenstr. 21, 81247 Munich, Germany and Ludwig-Maximilians-Universität München, Biocenter, Großhaderner Str. 2, 82152 Planegg-Martiensried, Germany and GeoBio-Center, Ludwig-Maximilians-Universität München, Luisenstr. 37, 80333 Munich, Germany. melzer@snsb.de Huijuan Mai. Yunnan Key Laboratory for Palaeobiology, Yunnan University, North Cuihu Road 2, Kunming 650091, People’s Republic of China and MEC International Joint Laboratory for Palaeobiology and Palaeoenvironment, Yunnan University, 2 North Cuihu Road, Kunming 650091, People’s Republic of China. Huijuan.Mai@ynu.edu.cn Xianguang Hou. Yunnan Key Laboratory for Palaeobiology, Institute of Palaeontology, Yunnan University, 650500 Kunming, Yunnan, China and MEC International Joint Laboratory for Palaeobiology and Palaeoenvironment, Yunnan University, 650500 Kunming, Yunnan, China. xghou@ynu.edu.cn Yu Liu. Yunnan Key Laboratory for Palaeobiology, Yunnan University, North Cuihu Road 2, Kunming 650091, People’s Republic of China and MEC International Joint Laboratory for Palaeobiology and Palaeoenvironment, Yunnan University, 2 North Cuihu Road, Kunming 650091, People’s Republic of China. (Corresponding author) Yu.liu@ynu.edu.cn Keywords: arthropod; virtual palaeontology; Leanchoilia; comparison; Cambrian; morphology Final citation: Schmidt, Michel, Melzer, Roland R., Mai, Huijuan, Hou, Xianguang, and Liu, Yu. 2025. Drishti and Amira – different visualizations exemplified by the early Cambrian Chengjiang arthropod Leanchoilia illecebrosa from China. Palaeontologia Electronica, 28(1):a5. https://doi.org/10.26879/1358 palaeo-electronica.org/content/2025/5401-drishti-and-amira-visualizations Copyright: January 2025 Palaeontological Association. This is an open access article distributed under the terms of the Creative Commons Attribution License, which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited. creativecommons.org/licenses/by/4.0 INTRODUCTION Virtual paleontology involves the study of fossils through interactive digital visualizations and employs non-invasive, non-destructive methods to reveal the internal anatomical structures of fossils (Garwood et al., 2010; Cunningham et al., 2014; Sutton et al., 2014; Yin and Lu, 2019). Computed tomography (CT), one of the techniques, has proven to be an essential tool for examining morphology and hidden structures, making it one of the most used techniques in virtual paleontology for analyzing suitable fossils (Sutton et al., 2014). In particular, the application of micro-computed tomography (μ CT), a specialized form of CT designed for smaller objects, has significantly advanced the understanding of the morphology of numerous invertebrate fossils over the past decade (Liu et al., 2015, 2016, 2020a, b, 2021; Chen et al., 2019; Zhai et al., 2019a, b, c, 2022; Ou et al., 2020; Jin et al., 2021; Schmidt et al., 2020, 2021a, 2022a, 2024; Zhang, M. et al., 2022; Zhang, X. et al., 2022; O’Flynn et al., 2024). However, visualizing 3D volumetric data obtained from μ CT scans poses certain challenges, leading to the development of various protocols for this purpose (e.g., Semple et al., 2019; Buser et al., 2020), which have influenced the direction of virtual paleontology (Sutton et al., 2014; Keklikoglou, 2019). A wide range of open-source (e.g., SPIERS, IrfanView, ParaView, ImageJ, 3DSlicer, Blender, MeshLab) and commercial (e.g., VG Studio Max, Mimics, Imaris, VoluMedics) software applications for 3D visualization are available. Most of these programs are well-equipped for image segmentation and rendering both volume and surface models. The selection of specific software often depends on factors such as the availability of programs at different research institutions, the budget aspect, and first of all the type of fossil preservation. The renowned Chengjiang Lagerstätte, a remarkable fossil site located in Southwest China and dating back 518 million years, is recognized for its exceptional fossil preservation (Gaines et al., 2012; Hou et al., 2017). This extraordinary preservation allows for detailed X-ray computed 3D studies in the realm of virtual paleontology (Liu et al., 2015). Recent research has uncovered intricate 3D structures within various arthropods from Chengjiang, which are vital for understanding their limb morphology and evolutionary history (Zhao et al., 2017; Chen et al., 2019; Zhai et al., 2019a, b, 2022; Liu et al., 2021; Schmidt et al., 2020, 2021a, 2022a, 2024; Zhang, M. et al., 2022; Zhang, X. et al., 2022), as well as their ontogeny and ecological roles (Liu et al., 2016, 2020a; Zhai et al., 2019c; O’Flynn et al., 2024). Most of these investigations have employed an open-source software called Drishti, which consists of three components (Drishti Import, Drishti Paint, and the Drishti renderer) and provides a variety of volume rendering techniques and tools, enhancing the realistic and organic appearance of scanned and volume-rendered specimens (Limaye, 2012; Hu et al., 2020, 2024). Amira (Thermo Fisher Scientific, 2018) is another useful 3D visualization software for processing μ CT data (Stalling et al., 2005; Ruthensteiner, 2008). It has been utilized to uncover new morphological characteristics in Cambrian arthropods (Cheng et al., 2011), particularly concerning Chengjiang arthropods (Liu et al., 2015; Schmidt et al., 2020, 2021a). However, it is important to note that this software is commercial, unlike Drishti. The financial aspect should be considered when deciding which program to use for μ CT data analysis. This program has nonetheless established a strong reputation in biological research (Kudryashev et al., 2011, 2012; Meisslitzer-Ruppitsch et al., 2011) and has played a crucial role in reconstructing the morphology of both living (Frase and Richter, 2013; Jaszkowiak et al., 2015; Keiler et al., 2015) and extinct species (Gunz et al., 2009; Lukeneder et al., 2014), enabling the visualization of both internal and external anatomical features. Drishti and Amira are software applications specifically designed for the scientific visualization of volumetric data. They transform two-dimensional image data, such as TIFF files, into three-dimensional volumes, which can then be manipulated through cropping, slicing, painting, and converting into surface models. It is important to note that each program has its own unique advantages and limitations. Our main goal is to provide an overview of these differences, serving as a valuable resource to help researchers choose the most suitable tool for their specific scientific needs. For our comparative approach on visualization, we have selected the extensively studied megacheiran arthropod, Leanchoilia illecebrosa (Liu et al., 2007, 2014, 2016, 2020b, 2021), as our model species. We employ this model to juxtapose the various procedures involved in rendering, aiming to delineate discrepancies in the visualization outcomes achieved through the utilization of Drishti and Amira, and we elucidate disparities in the graphical outputs. Additionally, we outline the general processing steps necessary for creating 3D models of fossils from μ CT data using Drishti, as this software is more commonly used compared to Amira in the μ CT-based analysis of the ventral morphology of arthropods from the Chengjiang biota. MATERIALS AND METHODS Drishti (Limaye, 2012) and Amira (Thermo Fisher Scientific, 2018) renderings are demonstrated using two specimens of Leanchoilia illecebrosa from the Chengjiang biota. These specimens were obtained from the Yu´ anshan Member, Chiungchussu Formation, Eoredlichia-Wutingaspis trilobite biozone, Cambrian Series 2, Stage 3, Yunnan Province, China, and are housed at the Yunnan Key Laboratory for Palaeobiology in Kunming, China. While Specimen YKLP 11422-arthro has been previously documented in Liu et al. (2020b), the other specimen, YKLP 11439-arthro, is presented for the first time in this study. The μ CT scans of these specimens were conducted at the Yunnan Key Laboratory for Palaeobiology, Kunming, utilizing the Xradia 520 Versa system (Carl Zeiss X-ray Microscopy, Pleasanton, USA). The scanning parameters included a beam strength of 40 kV/3 w, a LE3 filter, and a resolution of 458 µm. Volumetric data were stored in TIFF stacks. We employed Drishti version 2.7 (https://github.com/nci/drishti/releases) and Amira version 6.3 (https://www.thermofisher.com/de/de/home/electron-microscopy/products/software-em-3d-vis/amira-software.html) for our data processing. In Drishti, the TIFF stacks were imported into Drishti Import to produce a. pvl.nc file, which was subsequently loaded into Drishti renderer. The volumetric data were processed in high-resolution mode, with Transfer Functions optimized for the best visualization properties. Segmentation of individual appendages was carried out after loading the.pvl.nc file into Drishti Paint, employing various tools. The exported files were reloaded into Drishti renderer for visualization purposes. In Amira, the TIFF stacks were directly imported into the program’s main interface. For specific tasks, the respective fields were linked to the TIFF stack. Amira version 6 provides two distinct modules for volume visualization: the “Volren” and the “Volume Rendering” modules, both of which facilitate volume visualization. In this study, we opted for the “Volren” module for volume rendering. To clarify the key technical terms in the context of scientific data visualization, we provide the following definitions (Thermo Fisher Scientific, 2018): Volume rendering (“Volren”): This term encompasses a range of techniques applied to 3D data sets (scalar fields) to project them as 2D projections. Isosurface rendering: This method offers a rapid means of reconstructing polygonal surface models of the entire object, enabling the analysis of arbitrary scalar fields sampled on distinct grids. Surface rendering: This process involves the manual or (semi-)automatic generation of mesh models for specific regions through segmentation, using various tools (e.g., brush, lasso, magic wand, threshold, etc.) Segmentation: This refers to the assignment of labels to image voxels, aiding in the identification and separation of objects within a three-dimensional image. RESULTS AND DISCUSSION Processing Features: a Comparison In our examination of both Drishti and Amira, we first highlight disparities in the processing procedures (Figure 1) before delving into a detailed comparison of their respective visualization modes and mesh reconstruction capabilities. Processing in Drishti. In the case of Drishti, volumetric data, which may include TIFF stacks or any of the 13 supported volumetric data formats, is initially imported into the dedicated Drishti Import module for conversion into.pvl.nc files (processed volume files). In contrast, Amira permits the direct import of volumetric data, either through a simple drag-and-drop process or by importing the data directly into the program. In both instances, specifying the voxel size proves advantageous, although this parameter can also be adjusted subsequently, either in the crop editor (Amira) or in the settings (Drishti). Following this initial step, Drishti-generated.pvl.nc files are further processed within the Drishti renderer itself. This environment offers a range of options, including morphological operations (MOP), measurement tools, and the ability to adjust clipping planes, among others. Notably, these operations primarily pertain to work in volume rendering mode. The resultant surface triangle-mesh formats can subsequently be exported from the Drishti renderer in various file formats (e.g.,.ply or.stl files). Conversely, in the Drishti Import,.pvl.nc files generated earlier can be transferred to another distin"
