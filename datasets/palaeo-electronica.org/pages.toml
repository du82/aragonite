["https://palaeo-electronica.org/content/2025/5428-spatangoid-echinoid-burrows"]
title = "Spatangoid echinoid burrows"
description = "Paleoecology and taphonomy of spatangoid echinoid-produced burrows (Scolicia) in slope and basin floor deposits from the Eocene of Cuba"
full_description = '''Article Search Spatangoid echinoid burrows Paleoecology and taphonomy of spatangoid echinoid-produced burrows (Scolicia) in slope and basin floor deposits from the Eocene of Cuba Jorge Villegas-Martín, Renata G. Netto, Reinaldo Rojas-Consuegra, and Jordi M. de Gibert Article number: 28.1.a4https://doi.org/10.26879/1271Copyright Paleontological Society, January 2025 Author biographiesPlain-language and multi-lingual abstractsPDF version Submission: 20 January 2023. Acceptance: 20 December 2024. ABSTRACT The morphological variability in the preservation of the trace fossil Scolicia is mainly taphonomic and results from different factors. However, only a few papers have discussed this issue using a taphonomical approach. In addition, although Scolicia is commonly present in deep-sea and shelf ichnoassemblages, its record in slope deposits is scarce. Herein, variations in the preservation of Scolicia are discussed in slope and basin floor contexts from the Eocene Capdevila Formation, western Cuba. The studied specimens come from two outcrops located in the Artemisa and Pinar del Río regions. The burrows were assigned to Scolicia prisca, Scolicia isp. var. vertebralis, and Scolicia isp. var. laminites. The observed variations in the diagnostic features of Scolicia reflect the wide variation expected in burrows made by spatangoid echinoids. Furthermore, we demonstrated that S. vertebralis could be a preservational variant of S. prisca and that S. prisca could be produced as furrows by extant echinoids, and not necessarily represent eroded burrows. In the Artemisa section, Scolicia is associated with basin floor deposits in bathyal context and form part of the Nereites ichnofacies. In the Pinar de Río section, Scolicia occur in shallower slope deposits and is included in the impoverished Cruziana ichnofacies. Their presence in slope deposits could be due to different factors, such as the predominance of sandy substrates, high sedimentation rate, and good oxygenation, which also led to an absence of trace fossils of the Zoophycos ichnofacies, which is typical of slope settings. Jorge Villegas-Martín. 1 Technological Institute of Paleoceanography and Climatic Changes – itt OCEANEON, Unisinos University, Av. Unisinos, 950, 93022-000, São Leopoldo, Rio Grande do Sul Brazil; jvillegasmartin@gmail.com and Ichnos Research Group, Geology Graduate Program, Unisinos University, Av. Unisinos 950, 93022-000, São Leopoldo, Rio Grande do Sul Brazil. (Corresponding author)Renata G. Netto.Ichnos Research Group, Geology Graduate Program, Unisinos University, Av. Unisinos 950, 93022-000, São Leopoldo, Rio Grande do Sul Brazil. nettorg@unisinos.brReinaldo Rojas-Consuegra. Centro de Investigación del Petróleo. Churruca No 481, Cerro, La Habana, Cuba, CP 12000. rojas@ceinpet.cupet.cuJordi M. de Gibert. Deceased on September 23, 2012. Keywords: trace fossils; Scolicia preservational variations; Capdevila Formation; early Eocene Final citation: Villegas-Martín, Jorge, Netto, Renata G., Rojas-Consuegra, Reinaldo, de Gibert, Jordi M. 2025. Paleoecology and taphonomy of spatangoid echinoid-produced burrows (Scolicia) in slope and basin floor deposits from the Eocene of Cuba. Palaeontologia Electronica, 28(1):a4. https://doi.org/10.26879/1271 palaeo-electronica.org/content/2025/5428-spatangoid-echinoid-burrows Copyright: January 2025 Paleontological Society This is an open access article distributed under the terms of Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0), which permits users to copy and redistribute the material in any medium or format, provided it is not used for commercial purposes and the original author and source are credited, with indications if any changes are made. creativecommons.org/licenses/by-nc-sa/4.0/ INTRODUCTION Spatangoids constitute a large group of irregular echinoids and key bioturbators that rework the substrate during deposit-feeding activity and locomotion in modern shallow to deep marine settings (e.g., Bromley et al., 1997; Thompson and Riddle, 2005). The burrowing activity of extant spatangoid echinoids is well-known from natural observations and aquarium experiments (Nichols, 1959; Chesher, 1963; Howard et al., 1974; Bromley et al., 1997; Belaústegui et al., 2017), resulting in distinctive bioturbation structures that characterize the ichnogenera Scolicia (De Quatrefages, 1849), Cardioichnus (Smith and Crimes, 1983), Bichordites (Plaziat and Mahmoudi, 1988), and Sursumichnus (Uchman et al., 2022). Scolicia is interpreted as the grazing activity of spantagoid echinoids with double drainage tubes (e.g., Ward and Lewis, 1975; Bromley and Asgaard, 1975; Smith and Crimes, 1983; Bromley et al., 1997; Belaústegui et al., 2017), while Bichordites represents those produced by spantagoids with a single drainage tube (e.g., Plaziat and Mahmoudi, 1988; Villegas-Martín et al., 2014; Belaústegui et al., 2017). Cardioichnus is a heart-shaped depression (e.g., Smith and Crimes, 1983; Kappus and Lucas, 2019; Naimi et al., 2021), indicating a resting behavior, and can occur associated with Bichordites and Scolicia, forming compound trace fossils (e.g., Smith and Crimes, 1983; Mayoral and Muñiz, 2001; Bernardi et al., 2010; Belaústegui et al., 2017; Kappus and Lucas, 2019). Sursumichnus is also related to resting traces associated with Scolicia burrows (Uchman et al., 2022). The ichnogenus Scolicia includes a variety of morphologies that were originally attributed to distinct ichnogenera and, posteriorly, re-assigned to it after careful ichnotaxonomic revisions; examples include specimens assigned to Psammichnites Torell, 1870, Subphyllocorda Götzinger and Becker, 1932, and Palaeobullia Götzinger and Becker, 1932, among others (e.g., Häntzchel, 1975; Ksiażkiewicz, 1970, 1977; Smith and Crimes, 1983; Plaziat and Mahmoudi, 1988; Uchman, 1995; Belaústegui et al., 2017). Nevertheless, some complex morphological features can still be recognized as different preservational variations of Scolicia. This variability in the Scolicia preservation is mainly taphonomic and results from factors such as the burrow position within the sediment bed, erosion, and lithological variability (Plaziat and Mahmoudi, 1988; Uchman, 1995; Gibert and Goldring, 2008). However, only a few papers discussed this topic with respect to taphonomy (Bromley and Asgaard, 1975; Smith and Crimes, 1983; Plaziat and Mahmoudi, 1988; Uchman, 1995; Fu and Werner, 2000). Distinct preservational variations of Scolicia represent the most common trace fossil recorded in upper slope and basin floor (bathyal context) deposits of the Eocene Capdevila Formation, in western Cuba (Villegas-Martín, 2009; Villegas-Martín et al., 2014). Although Scolicia has been registered exclusively in marine settings, ranging from shelf to deep sea areas (e.g., Tchoumatchenco and Uchman, 2001; Wetzel, 2008; Giannetti, 2010; Riahi et al., 2014; Villegas-Martin et al., 2014; Carmona et al., 2020), its occurrence in slope deposits is uncommon so far (Fu and Werner, 2000; Wetzel, 2008; Demircan and Uchman, 2017). The presence of Scolicia in both shallower slope and basin floor deposits in western Cuba opens a window to discuss the triggers that potentially control the distribution of spatangoid burrows in distinct marine benthic regions. Thus, the aim of this paper is twofold: (i) to discuss the taphonomic control in the variability of Scolicia morphologies; and (ii) to evaluate the paleoecological parameters that favor spatangoid distribution throughout the sea bottom. GEOLOGICAL SETTING The Scolicia specimens studied herein come from two sections of the Capdevila Formation: i) the Artemisa section (near La Habana, Artemisa Province), which is part of the Havana-Matanzas Anticlinal infill; and ii) the Pinar del Río section (Pinar del Río Province), which is part of the sedimentary infill of Los Palacios and Bahía Honda basins (e.g., Brönnimann and Rigassi, 1963; Albear and Iturralde-Vinent, 1985; Bralower and Iturralde-Vinent, 1997; García-Delgado and Torres-Silva, 1997; Gordon et al., 1997) (Figure 1). Foraminiferal associations and nannofossil zonations (NP-11 and NP-12 ODP zones, Site 865) place the Capdevila Formation deposits mainly in the Eocene (Brönnimann and Stradner, 1960; Brönnimann and Rigassi, 1963; Bralower and Iturralde-Vinent, 1997). The Capdevilla Formation mainly consists of mudstones, limestones, siltstones, and massive and parallel-laminated fine to very coarse-grained sandstones, which can be intercalated with marls, carbonates, and matrix- or grain-supported conglomerates (e.g., Brönnimann and Rigassi, 1963; Piotrowski, 1987; Brust et al., 2011; Villegas-Martín et al., 2014). Tuffites and carbonatic concretions have also been reported at some localities (Piotrowski, 1987; Brust et al., 2011). Scolicia is preserved in medium- to fine-grained sandstones in the middle part of the Artemisa section. In the Pinar del Río section, Scolicia occurs in medium- to fine-grained parallel stratified sandstones (Figure 2) that characterizes the middle and upper part of the sedimentary succession (Villegas-Martín et al., 2014). Microfossils, corals, echinoderm fragments, bivalves, brachiopods, and small fragments of macroscopic plants and red algae encompass the paleontological record of the Capdevila Formation (Cushman and Bermudez, 1949; Brönnimann and Stradner, 1960; Brönnimann and Rigassi, 1963; Piotrowski, 1987; Bralower and Iturralde-Vinent, 1997; Brust et al., 2011). Preliminary ichnological studies in the Artemisa region revealed the existence of a diverse trace fossil assemblage including Cosmorhaphe isp., Helminthorhaphe isp., Ophiomorpha isp., Paleodictyon isp., Planolites isp., ? Psammichnites isp., Scolicia isp., and Thalassinoides isp. (Villegas-Martín, 2009; Rojas-Consuegra et al., 2018). These deposits have been assumed to be a bathyal marine sequence formed during an active tectogenesis period. Turbiditic currents carried massive amounts of terrigenous materials into the basin, forming a flysch deposits (Albear and Iturralde-Vinent, 1985; Lex, 2013). The deposits of the Capdevila Formation in the Pinar del Río section, otherwise, represent upper slope to shelf settings, based on sedimentological, micropaleontological, and ichnological data (Brust et al., 2011; Villegas-Martín et al., 2014). The trace fossil assemblage is dominated by Scolicia prisca and S. isp. var. laminites, with subordinate Asterosoma isp., Bichordites monastiriensis, Ophiomorpha isp., Palaeophycus isp., Rhizocorallium isp., and Thalassinoides isp. (Figure 2). Dense indistinct bioturbation was observed on some beds. Rhizobioturbation on the top of sandy beds bearing Bichordites attests to shallower marine conditions (Villegas-Martín et al., 2014; Villegas-Martín and Netto, 2017). MATERIALS AND METHODS The specimens analyzed in this study mainly occur in the sandstone beds of the Capdevila Formation from western Cuba (Villegas-Martín, 2009; Rojas-Consuegra and Villegas-Martín, 2009; Villegas-Martín et al., 2014) (Figure 1). These sandstone beds crop out on La Habana-Pinar del Río national highway, around 4.5 km N to the Guanajay village (22º57'57.83" N, 82º41'23.13" W), in the Artemisa Province (La Habana-Matanzas Anticlinal), and at the northeast from the Pinar del Río city (Pinar del Río Province), close to the Pinar fault (22º23'16.8" N, 83º47'10.4" W), which constituted the tectonic boundary between the Guaniguanico mountains and the Los Palacios Basin. Part of the analyzed material comprises specimens observed exclusively in the field (mostly from the Pinar del Río section) and previously studied by Villegas-Martín et al. (2014). Most of the studied specimens from the Artemisa section, previously studied by Villegas-Martín (2009) and Rojas-Consuegra and Villegas-Martín (2009), are housed in the paleontological collection of the National Museum of Natural History (MNHNCu) in La Habana, Cuba (samples MNHNCu-96.001287, MNHNCu-96.001291, MNHNCu-96.001292, MNHNCu-96.001294, MNHNCu-96.001295, MNHNCu-96.001296, MNHNCu-96.001297, MNHNCu-96.002933, MNHNCu-96.003567, MNHNCu-96003689). Those assigned to Scolicia without an ichnospecific definition by Villegas-Martín (2009) were revised in this work. The analyzed trace fossils were characterized through direct observations of the specimens in the collection and in situ at the outcrops in the study area. The distinct morphologies were grouped based on their morphology and toponomy, using the classification proposed by Seilacher (1964) and Savrda (2007). The ichnotaxonomical approach followed the revisions made by Smith and Crimes (1983), Plaziat and Mahmoudi (1988), and Uchman (1995). Furthermore, the terminology used to describe the Scolicia specimens is based on the descriptions by Plaziat and Mahmoudi (1988) and Uchman (1995) (see Figure 3). THE ICHNOGENUS SCOLICIA AT THE CAPDEVILA FORMATION Except for Bichordites, recorded by Villegas-Martín et al. (2014) in Pinar del Río section, all the Scolicia group morphologies found in the Capdevila Formation deposits can be assigned to the ichnogenus Scolicia. These show bilobate and trilobate morphology, a meniscate infill (backfill structure), two parallel sediment strings at each side of the burrow floor, and a flat or concave up ridge between the strings (e.g., Smith and Crimes, 1983; Plaziat and Mahmoudi, 1988; Uchman, 1995; Belaústegui et al., 2017). Three different morphologies prevail among these specimens and can be assigned to: Scolicia prisca, Scolicia vertebralis, and Scolicia isp. var laminites. In the case of the Scolicia vertebralis, we demonstrated that this ichnospecies is a preservational variant de Scolicia, and thus named as Scolicia isp. var vertebralis in this work. Scolicia prisca de Quatrefagues, 1849 The specimens ascribed to Scolicia prisca are the most abundant among the studied material (MNHNCu-96.001292, MNHNCu-96.001294, MNHNCu-96.001297, MNHNCu-96.002933, MNHNCu-96.003567), and occur in fine- to medium-grained sandstone beds in the Artemisa and Pinar de Río (Figure 2) sections and carbonate beds in the Artemisa section. The structures are characterized by an epichnial trilobate furrow in a longitudinal section formed by two convex lateral slopes and a bottom. Slightly inclined convex asymmetric ribs compose the backfill structure that covers the slopes, more noticeable in some portions. The upper margins of the lateral slopes are elevated above the bedding surface, in general. The bottom is characterized by a convex central ridge-like structure usually covered by asymmetric fine transverse ribs perpendicular to the long axis and showing two sediment parallel strings/rows at each side (Figure 4). The convex ridge varies in width and height (e.g., Smith and Crimes, 1983; Plaziat and Mahmoudi, 1988; Uchman, 1995). The furrows show a straight to slightly meandering trajectory, with a predominance of the latter. The furrow width varies along the structure and the length '''
