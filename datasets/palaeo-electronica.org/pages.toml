["https://palaeo-electronica.org/content/2025/5451-menispermites-in-northern-asia"]
title = "Menispermites in Northern Asia"
description = "The morphological diversity and distribution of the genus Menispermites (Magnoliopsida) in the Cretaceous of Northern Asia"
full_description = "Article Search Menispermites in Northern Asia The morphological diversity and distribution of the genus Menispermites (Magnoliopsida) in the Cretaceous of Northern Asia A.A. Zolina, L.B. Golovneva, and A.A. Grabovskiy Article number: 28.1.a9https://doi.org/10.26879/1441Copyright Palaeontological Association, February 2025 Author biographiesPlain-language and multi-lingual abstractsPDF version Submission: 21 August 2024. Acceptance: 5 February 2025. ABSTRACT Eleven species of Menispermites from Kazakhstan, Siberia, North-East of Russia and Sakhalin distributed from the upper Albian up to Maastrichtian–Danian were restudied based on original materials and published data to analyze their morphological diversity and stratigraphic and geographical occurrence. English diagnoses of five species are presented for the first time. A new species, M. temlyanensis Zolina, Golovneva et Grabovskiy, sp. nov. from the Maastrichtian–Danian Tanyurer Formation of Chukotka is described. The greatest number of species is confined to the North-East of Russia. In this territory, short-lived species with limited ranges predominated. M. sibiricus had the widest geographical and stratigraphic range: from Kazakhstan to Chukotka and from the Cenomanian to Coniacian. In other regions of Northern Asia, the stratigraphic distribution of Menispermites was limited. In Kazakhstan and Siberia, it is known from the Cenomanian to Turonian. On Sakhalin, Menispermites was recorded from the Campanian to the Maastrictian–Danian. The greatest number of species and morphological diversity of Menispermites occured in the Cenomanian–Turonian of the North-East of Russia. A.A. Zolina. Komarov Botanical Institute, Russian Academy of Sciences, 197022, prof. Popov str. 2, St. Petersburg, Russia. azolina@binran.ru L.B. Golovneva. Komarov Botanical Institute, Russian Academy of Sciences, 197022, prof. Popov str. 2, St. Petersburg, Russia. golovneva@binran.ru A.A. Grabovskiy. Komarov Botanical Institute, Russian Academy of Sciences, 197022, prof. Popov str. 2, St. Petersburg, Russia. agrabovskiy@binran.ru Keywords: new species; Menispermites; Menispermaceae; Ranunculales; North-East of Russia; paleogeography Final citation: Zolina, A.A., Golovneva, L.B., and Grabovskiy, A.A. 2025. The morphological diversity and distribution of the genus Menispermites (Magnoliopsida) in the Cretaceous of Northern Asia. Palaeontologia Electronica, 28(1):a9. https://doi.org/10.26879/1441 palaeo-electronica.org/content/2025/5451-menispermites-in-northern-asia Copyright: February 2025 Palaeontological Association. This is an open access article distributed under the terms of the Creative Commons Attribution License, which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited. creativecommons.org/licenses/by/4.0 INTRODUCTION The genus Menispermites Lesquereux was described from the Albian–Cenomanian Dakota Formation, USA (Lesquereux, 1874). The leaves are characterized by lobate or unlobate, usually peltate leaves with actinodromous venation and numerous primary veins. Menispermites originally included three species (Lesquereux, 1874). One of them, M. obtusilobus Lesquereux, was chosen later as a type species (Knowlton, 1919). This species has broadly ovate, trilobate peltate leaves with obtuse apex, low pelta, truncate base and crenate margin. Menispermites were widely distributed in the Late Cretaceous and Paleogene. Nowadays this genus includes more than 30 fossil species. About 15 of them are known from North and South America (Lesquereux, 1874, 1892; Hollick, 1930; Berry, 1916; Hollick, 1930; Bell, 1956, 1962; Doyle and Hickey, 1976; Doria, et al., 2008; Guzmán-Vázquez et al., 2018; Del Rio et al., 2021). In the Upper Cretaceous deposits of Europe, the genus was represented by M. summesbergeri Herman et J. Kvaček from the lower Campanian Grünbach Formation (Herman and Kvaček, 2010). More than 10 species were described from Northern Asia (Vachrameev, 1952; Kryshtofovich and Baikovskaya, 1960; Budantsev, 1968; Zhilin, 1974; Krassilov, 1979; Shilin, 1986; Herman and Lebedev, 1991; Philippova and Abramova, 1993; Golovneva, 2006; Golovneva et al., 2011; Moiseeva, 2014; Golovneva, 2019). The greatest number of Menispermites species comes from the Albian and Cenomanian. The latest Cretaceous and Paleogene representatives are less numerous. Menispermites have a significant morphological resemblance to leaves of modern genus Menispermum L. (Menispermaceae, Ranunculales), that are characterized by a mostly entire margin, actinodromous primary and brochidodromous secondary venation (Ortiz et al., 2007; Doria et al., 2008). The oldest clearly attributed fossil evidence of Menispermaceae is an endocarp of the extant genus Stephania Loureiro found in the lower Paleocene of Patagonia (Jud et al., 2018). Endocarps of different Menispermaceae (Stephania, Palaeosinomenium Chandler and Tinospora Miers) were also found in the lower Paleocene of Paris Basin, Europe (Kara et al., 2023). Since the Eocene, endocarps of Menispermaceae are abundant in Europe and North America (Chandler, 1964; Collinson, 1983; Manchester, 1994; Mai, 1995; Jacques and De Franceschi, 2005). The earliest record, which was interpreted as Menispermaceae wood, comes from the latest Cretaceous–early Paleocene Deccan Intertrappean beds, India (Bonde, 1997). This material is characterized by alternating rings of phloem and xylem that resemble modern lianas. Therefore, the Paleogene records of Menispermites are usually assigned to the family Menispermaceae and this attribution is confirmed by findings of corresponding reproductive structures in the same deposits (Doria, et al., 2008; Guzmán-Vázquez et al., 2018; Del Rio et al., 2021). But the attribution of Cretaceous finds of Menispermites to Menispermaceae is debatable. Indeed, the leaves of Menispermites are also similar to leaves of some modern representatives of Nymphaeaceae and Piperaceae. However, the Cretaceous representatives of these families differ rather well from Menispermites. Besides, the relationships of the Cretaceous finds with modern families Nymphaeaceae and Piperaceae is also questionable, as is the relationships of Menispermites and Menispermaceae. Thus, some authors consider Menispermites as a morphological taxon of unclear systematic position (Herman et al., 2016). The first endocarps with affinity to Menispermaceae were recorded from the Turonian of Europe (Knobloch and Mai, 1984) and were attributed to the genus Prototinomiscium Knobloch et Mai. However, endocarps of Prototinomiscium do not have a well-developed condyle, and this makes the assignment of this genus to Menispermaceae doubtful (Herrera et al., 2011; Wefferling et al., 2013). Actually, many Cretaceous genera have characters that preclude their direct assignment to the extant families. For example, small actinomorphic pistillate flowers of Callicrypta chlamydea Krassilov et Golovneva from the Cenomanian Timmerdyakh Formation of the Lena-Vilyui depression are characterized by a significant similarity to the flowers of Menispermaceae but also share diagnostic features with several other ranunculid families (Krassilov and Golovneva, 2004). Floral and fruit morphology of the early eudicot Ranunculaecarpus quinquecarpellatus Samylina from the lower-middle Albian Buor-Kemyus Formation of the North-East of Russia support possible affinity of this species to extant Ranunculaceae, but it is distinguished from modern members of the family by some features of the perianth and pollen (Manchester et al., 2018). Similarity of Menispermites with Menispermaceae in leaf morphology and association of Paleogene representatives of Menispermites with reproductive structures of Menispermaceae suggest that the Cretaceous representatives of this genus could also be related to ancestral forms of Menispermaceae. Their detailed study could allow us to consider their taxonomic affinity more precisely. Unfortunately, many Cretaceous species, especially from North America, are represented by fragmentary material, have nomenclature problems and need reinvestigation. The Cretaceous records of Menispermites from Northern Asia are represented by numerous whole leaves. In this paper, we attempt to analyze changes in the morphological diversity and stratigraphic and geographical distribution of the genus Menispermites at the end of the Early Cretaceous and during the Late Cretaceous. In addition, we describe a new species, M. temlyanensis Zolina, Golovneva et Grabovskiy, sp. nov. from the Maastrichtian–Danian Tanyurer Formation of Chukotka. MATERIAL AND METHODS Species of Menispermites from Northern Asia were restudied based on original material and published data. Full and abbreviated names of institutions, where studied specimens of Menispermites are stored, are given in Table 1, and all localities are shown in Figure 1. Four species of Menispermites come from the upper Albian–lower Turonian Krivorechenskaya Formation, Grebenka River, Anadyr River basin (Philippova and Abramova, 1993; Golovneva et al., 2015): M. minutus (Kryshtofovich) Shczepetov, Herman et Belaya, M. vasetskii Philippova, M. marcovoensis Philippova, and M. orientalis Golovneva. The last species was also found in the upper Turonian–Coniacian Zarya and Arman formations of the Magadan Region, and in the lower Coniacian Poperechnenskaya Formation, Pekulney Ridge, Chukotka (Philippova, 2010; Golovneva et al., 2015). M. ginterensis Herman is present in the Cenomanian Ginter Formation in the northeastern part of the Koryak Upland (Herman, 1988; Moiseeva, 2010). Leaves of M. sibiricus (Heer) Golovneva were originally described from the Cenomanian–Turonian Simonovo Formation of Eastern Siberia under the name Acer sibiricum Нееr (Heer, 1878; Golovneva, 2006; Golovneva and Nosova, 2012). Later, this species was also found in the Cenomanian Timmerdyakh Formation of the Lena-Vilyui depression (Golovneva, 2006), in the Cenomanian Altykuduk Formation and in the Turonian Zhirkindek Formation of Kazakhstan (Vachrameev, 1952; Shilin, 1986; Golovneva, 2006), in the upper Turonian–Coniacian Valizhgen Formation of northwestern Kamchatka (Herman and Lebedev, 1991), and in the upper Turonian–Coniacian Chingandzha and Arman formations of the Magadan Region (Golovneva et al., 2011; Herman et al., 2016; Golovneva, 2019), In this paper, we also referred to this species leaves from the Coniacian Poperechnenskaya Formation. Two species of Menispermites were described from Sakhalin Island. М. sachalinensis Kryshtofovich ex Zhilin comes from the Campanian Zhonk’er Formation (Kryshtofovich and Baikovskaya, 1960; Zhilin, 1974; Krassilov, 1979). М. favosus Krassilov was reported from the Maastrichtian–Danian Boshnyakovo Formation (Vachrameev, 1966; Krassilov, 1979). M. lebedevii Moiseeva comes from the Santonian–Campanian Emuneret Formation, Enmyvaam River, Chukotka. A leaf fragment of Menispermites, described as М. cf. sachalinensis (Moiseeva and Sokolova, 2007) was found from the Campanian Barykov Formation of the Ugolnaya Bay, North-East of Russia. Leaves of the new species, M. temlyanensis, sp. nov., were collected by A. Grabovskiy from the Tanyurer Formation, distributed in the northern part of the Pekulney Ridge and between the Pekulney Ridge and the Zolotoy Ridge near Anadyr town, Chukotka. This formation is 550–2200 m thick and consists of andesites, pyroxene and olivine basalts, tuffs and volcano-sedimentary deposits (Zvizda et al., 1974). In the lower part of the section, there are beds of conglomerates with interlayers of coaly siltstones and grey sandstones. Plant fossils are confined to the volcano-sedimentary layers in the base of the Tanyurer Formation, which are exposed in the road quarry near Ugolnye Kopi settlement (Figure 2). The meaning of Latin abbreviations using in chapter “Systematic Palaeontology” is given in Table 2. The terminology follows Ellis et al. (2009), except we use 'entire' in the sense of being unlobed. Photographs of the specimens were made using a Canon 6D camera with low angle illumination. Registry New species name Menispermites temlyanensis Zolina, Golovneva et Grabovskiy, described in this paper, is registered with a unique PFN number in the Plant Fossil Names Registry, hosted and operated by the National Museum, Prague for the International Organisation of Palaeobotany. SYSTEMATIC PALAEONTOLOGY Class MAGNOLIOPSIDA Brongniart, 1843 MAGNOLIOPSIDA incertae sedis Genus MENISPERMITES Lesquereux, 1874 Menispermites sibiricus (Heer) Golovneva Figure 3A–G, Figure 4E 1878 Acer sibiricum Heer, p. 46, pl. 10, figure 4b, 5a, pl. 12, figure 1b. 1878 Nymphaeites tener Heer, p. 44, pl. 13, figure 7. 1952 Menispermites kryshtofovichii Vachrameev, p. 194, pl. 14, figure 5, 6, pl. 15, figure 6, text-figure 41. 1955a Menispermites sibiricus (Heer) I. Lebedev non rite publ., p. 199, pl. 30, figure 1. 1955b Cissites sibirensis I. Lebedev, p. 203, pl. 31, figure 4. 1962 Menispermites sibiricus (Heer) I. Lebedev non rite publ. p. 258, pl. 49, figure 1. 1962 Menispermites simonovskiensis I. Lebedev, p. 258, pl. 65, figure 2. 1962 Menispermites tschulimensis I. Lebedev, p. 258, pl. 49, figure 5. 1968 Menispermites ribesifolius Budantsev, p. 11, pl. 2, figure 3. 1968 Menispermites stellatus Budantsev, p. 12, pl. 2, figure 4. 1974 Menispermites kryshtofovichii Zhilin, p. 99, pl. 37, figure 5, pl. 40, figure 7. 1974 Protoacerophyllum sibiricum (Heer) Iljinskaja, p. 151, text-figure 96, figure 4. 1975 Menispermites sp., Philippova, p. 64, pl. 9, fig. 1; text-figure 3. 1986 Menispermites kryshtofovichii Shilin, pl. 8, figure 2, 4, pl. 9, figure 1. 1986 Menispermites syrdariensis Shilin, p. 113, pl. 9, figure 3, pl. 10, figure 4. 1991 Menispermites kryshtofovichii Vachrameev; Herman and Lebedev, p. 67, pl. 2, figure 5, text-figure 13. 2006 Menispermites sibiricus (Heer) Golovneva, p. 1733, pl. 1, figure 1–3; 2010