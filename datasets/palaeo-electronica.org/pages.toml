title = "John Day Fossil Tracks"
description = "Following their footsteps: Report of vertebrate fossil tracks from John Day Fossil Beds National Monument, Oregon, USA"
full_description = "Article Search John Day Fossil Tracks Following their footsteps: Report of vertebrate fossil tracks from John Day Fossil Beds National Monument, Oregon, USA Conner J. Bennett, Nicholas A. Famoso, and Daniel I. Hembree Article number: 28.1.a11https://doi.org/10.26879/1413Copyright Paleontological Society, February 2025 Author biographiesPlain-language and multi-lingual abstractsPDF version Submission: 1 June 2024. Acceptance: 20 February 2025. ABSTRACT John Day Fossil Beds National Monument (JODA) preserves an exceptional geologic record stretching from the upper Eocene to the upper Miocene (50-6 Ma) of Oregon. These strata contain countless well-preserved vertebrate body fossils for which JODA is famous. While great emphasis has been placed on the study of the body fossils of JODA, comparatively little work has been done on vertebrate and invertebrate tracks recovered from the area. Four specimens with vertebrate tracks are known from JODA, which detail the behaviors of at least four separate types of trackmaker. These include avian and possible lacertiform reptile tracks from the Eocene upper Clarno Formation (50-39 Ma) and superimposed feliform tracks and a tridactyl ungulate track from the Oligocene Turtle Cove Member of the John Day Formation (31-26 Ma). We used commercially available software (Agisoft Metashape Professional) to produce 3-dimensional and digital elevation models (DEMs) of each track surface. The models allow digital preservation and remote study of the specimens, enable an enhanced resolution of surface features, and provide the means to acquire more accurate measurement of the tracks and trackways. The Clarno Formation tracks are the only evidence to suggest that both birds and lizards were present in the John Day Basin during the Eocene, providing a greater knowledge of faunal diversity at this time. The John Day Formation tracks bear resemblance to animals already known from the Turtle Cove Member from body fossils, such as false sabertooth cats (nimravids) and odd-toed ungulates (perissodactyls). Combined with the body fossil record, the JODA tracks provide important insights into the fauna, environment, and behaviors of taxa through the Eocene and Oligocene of Oregon. Conner J. Bennett. Earth and Environmental Sciences, Utah Tech University, 225 S. University Ave., St. George, Utah 84770, USA. connerjbennett@gmail.com Nicholas A. Famoso. John Day Fossil Beds National Monument, U.S. National Park Service, 32651 Highway 19, Kimberly OR, 97848, USA and Department of Earth Science, University of Oregon, 1272 University of Oregon Eugene, Oregon 97403, USA. nicholas_famoso@nps.gov Daniel I. Hembree. Department of Earth and Planetary Sciences, University of Tennessee Knoxville, Knoxville, Tennessee 37996, USA. dhembre2@utk.edu Keywords: Tracks; Clarno; John Day Formation; Oligocene; Eocene Final citation: Bennett, Conner J., Famoso, Nicholas A., and Hembree, Daniel I. 2025. Following their footsteps: Report of vertebrate fossil tracks from John Day Fossil Beds National Monument, Oregon, USA. Palaeontologia Electronica, 28(1):a11. https://doi.org/10.26879/1502 palaeo-electronica.org/content/2025/5469-john-day-fossil-tracks Copyright: February 2025 Paleontological Society This is an open access article distributed under the terms of Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0), which permits users to copy and redistribute the material in any medium or format, provided it is not used for commercial purposes and the original author and source are credited, with indications if any changes are made. creativecommons.org/licenses/by-nc-sa/4.0/ INTRODUCTION John Day Fossil Beds National Monument (JODA) in central and eastern Oregon is known for body fossils of upper Eocene to upper Miocene mammals which comprise a nearly continuous, 50 million-year record of mammalian evolution (Bestland et al., 1999; Hunt and Stepleton, 2004; Albright et al., 2008; Fremd, 2010; Samuels and Cavin, 2013; Maguire et al., 2018). This abundance of body fossils has caused other fossil types within the monument to remain relatively understudied. Among those are fossil tracks from the Eocene upper Clarno Formation (50-39 Ma) and the Oligocene Turtle Cove Member of the John Day Formation (31-26 Ma). While not prevalent in the John Day basin, fossil tracks provide data on trackmaker behaviors made during the life of the living organism, which cannot be defined in detail by using body fossils alone (Lockley and Hunt, 1995). When used in tandem with the body fossil record, tracks can also improve interpretations of faunal diversity, often providing evidence of ancient organisms in strata where body fossils are rare (Irmis, 2005). Key aspects of fossil tracks and associated trace fossils also provide information on ancient habitats (Hogue, 2018). Fossil tracks similar to those at JODA have previously been described from the Eocene deposits of the Chuckanut Formation (49.9 Ma) of Washington (Mustoe, 2002) and the Green River Formation (56-38 Ma) of Utah, Wyoming, and Colorado (Moussa, 1968; Scott and Smith, 2015; Hogue, 2018; Lockley et al., 2021). The Chuckanut Formation contains very few body fossils, but a relative abundance of diverse fossil tracks which record the occurrence of several types of birds, turtles, plantigrade and digitigrade perissodactyl mammals. The Green River Formation is also well known for a diverse and abundant supply of fossil tracks (Scott and Smith, 2015) while also preserving numerous, well-preserved body fossils. By using the body fossil record and the fossil track record within the Green River Formation, further conclusions can be drawn concerning the overall diversity of organisms of the Eocene. While work has been done to describe the fossil tracks from both the Chuckanut and Green River formations, the JODA tracks have only been mentioned twice before, with both instances wrongly attributing the John Day Formation tracks to the Clarno Formation and neglecting to mention the actual Clarno Formation tracks entirely (Lockley and Hunt, 1995; Santucci et al., 1998). Due to this inaccurate attribution, it is necessary to properly describe the JODA tracks and attribute them to their proper formations. In order to describe the JODA tracks, each was rendered as a photogrammetric model to identify surface features which are difficult to discern through visual study alone. Rendered models help to describe each sample and any possible behaviors they preserve, while also digitizing fossil track specimens for remote study (Lallensack et al., 2020). This provides easy access to the data each specimen holds while also assisting in monitoring the condition of the fossil tracks in the future (Lockley et al., 2022). GEOLOGIC SETTING Four formations are recognized within JODA: Clarno (50-39 Ma), John Day (31-25 Ma), Mascall (16-12 Ma), and Rattlesnake (8-6 Ma) (Dillhoff et al., 2009). However, the only tracks recovered have come from the Clarno and John Day formations (Figure 1). The apparent absence of tracks from the Rattlesnake and Mascall formations is likely a result of either the lithology or the depositional environment of each formation. The Rattlesnake Formation is dominated by matrix-rich conglomerates and gravel deposits (Merriam et al., 1925; Samuels and Zancanella, 2011; Samuels and Cavin, 2013), which are not conducive to preservation of fossil tracks. The Mascall Formation possesses layered tuff beds and lacustrine deposits (Maguire et al., 2018), which may be conducive to the preservation of tracks. The apparent absence of tracks within the Mascall Formation may be due to either collection bias or the lacustrine environment represented by these deposits may have been too deep for terrestrial vertebrate tracks to be preserved. The upper section of the Clarno Formation is composed of mudstones capped by the Member A welded tuff of the Big Basin Member of the John Day Formation, whereas the lower section is composed of lahar deposits with interbedded shales and mudstones (Bestland et al., 1999; Wheeler and Manchester, 2002). The Clarno tracks, JODA 1535 and 1536, were found on pieces of interbedded shales from the lower section. These shales are stratigraphically below lahars, which causes deformation in these beds making it difficult to locate and identify tracks. The John Day Formation is currently subdivided into seven members: Big Basin, Turtle Cove, Kimberly, Haystack Valley, Balm Creek, Johnson Canyon, and Rose Creek (Retallack et al., 2000; Hunt and Stepelton, 2004; Albright et al., 2008). Two of the specimens described in this study, JODA 251 and 283, are likely from the A/B Tuff of the Turtle Cove Member (29.75 Ma) (Albright et al., 2008). The exact locality of JODA 251 and 283 was not properly documented, leading to their stratigraphic context being inferred as the A/B Tuff. The Turtle Cove Member consists of about 400 m of predominantly volcaniclastic mudstones and volcanic tuffs that Albright et al. (2008) divided into 14 lithostratigraphic subunits (A-K2) with 10 dated tuffs including the Picture Gorge ignimbrite (PGI) - a super-volcanic event bed related to the Yellowstone Hotspot (Seligman et al., 2014). The PGI is between subunits F and G. The Turtle Cove fauna is assigned to the Whitneyan (Wh2) and Arikareen (Ar1 and Ar2) North American Land Mammal Ages (NALMAs). METHODS Vertebrate tracks were found within the monument on specimens JODA 1535, 1536, 251 and 283. JODA 1535 and 1536 were found in the Clarno Formation (50-39 Ma). JODA 251 and 283 were found in the Turtle Cove Member of the John Day Formation (31-25 Ma). The Clarno Formation tracks were collected through a Bureau of Land Management funded survey in 1987, and the Turtle Cove Member samples were donated to JODA by Larry McGraw in 1979, shortly after JODA was established in 1975. Each JODA specimen was documented through rendered photogrammetric models using Agisoft Metashape Professional (version 1.7). Photographs were taken using a Nikon D810 digital camera and Nikon AF Micro NIKKOR 60 mm lens. Models were rendered from photographs taken of each specimen, using standard techniques outlined by Lallensack et al. (2022). Adequate image overlap, having roughly 60-70% overlap between images, is essential to provide Metashape with enough data to link together the entire model. In addition, tracks and tracksites require images to be captured perpendicular to the surface. Shadows within photographs will not register in the model, creating holes in the final product. Because of this, proper lighting of a surface is essential to capture as much detail as possible. Proper positioning and full capture of scale bars within images is required to ensure proper scaling information. Model types used in this study include 3-Dimensional Mesh and Digital Elevation Models (DEMs). Each surface was rendered as a 3D Mesh model for remote study and accurate measurement. DEM models helped to visualize subtle shifts in surface elevation through color change, allowing small details to be observed. Screenshots taken from photogrammetric models were then measured in ImageJ (version 1.53t) to provide interdigital angle measurements using the techniques from Sarjeant et al. (2002). Pace data were measured using the ruler tool through Agisoft Metashape (version 1.8). Institutional Abbreviations. JODA = John Day Fossil Beds National Monument, Kimberly, OR, USA; JDNM = Locality number for John Day Fossil Beds National Monument. RESULTS JODA 1536 Material. JODA 1536 preserves two tracks (A1 and A2) from the Clarno Formation (JDNM-66, Hanson’s Bird Tracks) in the Clarno Unit (Wheeler County) of JODA (Figure 2; Table 1, Table 2, Table 3). Also present are four ovoid impressions clustered below A2, as well as several well-preserved sinusoidal trails (Figure 2B). 3D mesh models of JODA 1536 (A) part (https://doi.org/10.17602/M2/M454455) and JODA 1536 (B) counterpart (https://doi.org/10.17602/M2/M454460) are available through MorphoSource. Description. The tracks are small, with a mean length of 21.2 mm and a mean width of 15.8 mm. The mean angles between digits II-III, III-IV, and II-IV are 28.9°, 30.5°, and 62.2° respectively. The distance between the two tracks is approximately 40.2 mm. Both A1 and A2 lack webbing between digits. Digit claw impressions on A1 are pointed and slightly oblique to the digit direction. A1 is more detailed than A2 because digit claws and pads are difficult to discern in A2. The ovoid impressions have a short axis between 2-3.5 mm in diameter and a long axis between 2-5 mm in diameter, of which the long axis is parallel to the orientation of A1 and A2 (Figure 2B). Three of the ovoid impressions are clustered roughly 5 mm from digit II of A2, with the smallest of the ovoid impressions outlying this concentration, approximately 18.3 mm from digit II of A2. The trails have smooth surfaces, possess a meandering sinusoidal morphology, have very shallow depths, and lengths ranging from 1.60-5.25 cm (Figure 2B). The trails are abundant along the margins of the specimen, and less common toward the center. JODA 1535 Material. JODA 1535 preserves three possible tracks (L1, L2, L3) from the Clarno Formation (JDNM-66, Hansen’s Bird Tracks) in the Clarno Unit (Wheeler County) of JODA (Figure 3; Table 1, Table 2, Table 3). 3D mesh models of JODA 1535 (A) part (https://doi.org/10.17602/M2/M454449) and JODA 1535 (B) counterpart (https://doi.org/10.17602/M2/M454444) are available on MorphSource. Description. L1 preserves the most detail of the three tracks, with five claw-like impressions. Digit V of L1 is significantly smaller and located distally to digits I-IV; digit III is the longest of the impressions (Table 1, Table 2, Table 3). Digit V is oriented almost perpendicular to the long axis of L1, while the remaining digits are roughly parallel to the long axis of L1. The toe claw impressions of L1 curve proximally toward the trackmaker, showing drag marks from motion of the foot during locomotion. The remaining two impressions are incomplete; L2 only includes three digit impressions (likely from digits II-IV), while L3 preserves only partial impressions of digits I-V. The morphology of L2 and L3 differs from that of L1, in that each digit impression is roughly equidistant and oriented perpendicular to the long axis of the tracks. It is important to note that both L2 and L3 may represent a different trackmaker. No pace data could be collected from L2 and L3 due to the incomplete nature of these tracks. JODA 283 Material. JODA 283 preserves four tracks (F1, F2, F3, F4), with F1-F2 and F3-F4 each representing a pair of superimposed impressions, likely from the A/B Tuff of the Turtle Cove Member of the John Day Formation (JDNM-8, Sheep Rock) in the Sheep Rock Unit (Grant County) of JODA (Figure 4, Table 1, Table 2, Table 3). A 3D mesh of JODA 283 is available on MorphoSource (https://doi.org/10.17602/M2/M454313). Description. T"
