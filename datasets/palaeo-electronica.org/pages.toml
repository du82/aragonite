["https://palaeo-electronica.org/content/2025/5441-holocene-bryozoans-from-japan"]
title = "Holocene bryozoans from Japan"
description = "Unveiling the cheilostome bryozoan fauna of Daidokutsu submarine cave (Okinawa, Japan) over the last 7,000 years"
full_description = "Article Search Holocene bryozoans from Japan Unveiling the cheilostome bryozoan fauna of Daidokutsu submarine cave (Okinawa, Japan) over the last 7,000 years Emanuela Di Martino, Antonietta Rosso, Paul D. Taylor, Ruby W.T. Chiu, Kazuhiko Fujita, Akihisa Kitamura, and Moriaki Yasuhara Article number: 28.1.a7https://doi.org/10.26879/1433Copyright Palaeontological Association, February 2025 Author biographiesPlain-language and multi-lingual abstractsPDF version Submission: 30 July 2024. Acceptance: 11 January 2025. ABSTRACT The study of marine bryozoans in Japan dates to the late 1800s, with research primarily focusing on Pleistocene and Recent faunas in shallow-water shelf habitats. This paper aims to address gaps in the study of Holocene bryozoan assemblages from cave habitats in Japan by examining the cheilostome bryozoan fauna of a sediment core (Core 19) spanning the last 7,000 years extracted from Daidokutsu cave, a submarine cave on Ie Island, Okinawa. The study describes and illustrates using scanning electron microscopy, 63 cheilostome bryozoan species, comprising 17 anascan-grade and 46 ascophoran-grade cheilostomes, and introduces three new genera and 30 new species, a significant proportion consistent with previous studies on other Japanese bryozoan faunas. Additionally, we transfer the family Crepidacanthidae from Mamilloporoidea to Adeonoidea. This research establishes a critical taxonomic foundation for future ecological studies aimed at understanding the responses of the bryozoan community in this cave habitat to environmental and climate changes through the Holocene. The inclusion of bryozoan data expands the multi-taxon approach that was previously focused on other groups of organisms (ostracods, molluscs, foraminifera), thus providing a more comprehensive understanding of the historical biodiversity and ecological dynamics of the region. Emanuela Di Martino. Dipartimento di Scienze Biologiche, Geologiche e Ambientali, Università di Catania, Corso Italia 57, 95129, Catania, Italy. (Corresponding author) emanuela.dimartino@unict.it; ORCID: 0000-0002-3892-4036 Antonietta Rosso. Dipartimento di Scienze Biologiche, Geologiche e Ambientali, Università di Catania, Corso Italia 57, 95129, Catania, Italy. rosso@unict.it; ORCID: 0000-0001-5565-9513 Paul D. Taylor. Natural History Museum, Cromwell Road, London, SW7 5BD, UK. p.taylor@nhm.ac.uk; ORCID: 0000-0002-3127-080XRuby W.T. Chiu School of Biological Sciences, and Swire Institute of Marine Science, The University of Hong Kong, Kadoorie Biological Sciences Building, Hong Kong, China. rubychiu@ymail.com; ORCID: 0000-0001-6663-9526 Kazuhiko Fujita. Department of Physics and Earth Sciences, Faculty of Science and Tropical Biosphere Research Center, University of the Ryukyus, Okinawa, 903-0213, Japan. fujitaka@sci.u-ryukyu.ac.jp; ORCID: 0000-0002-9833-007X Akihisa Kitamura. Institute of Geosciences, Shizuoka University, Shizuoka, 422-8529, Japan. seakita@ipc.shizuoka.ac.jp; ORCID: 0000-0002-9928-3746 Moriaki Yasuhara. School of Biological Sciences, Area of Ecology and Biodiversity, Swire Institute of Marine Science, Institute for Climate and Carbon Neutrality, Musketeers Foundation Institute of Data Science, and State Key Laboratory of Marine Pollution, The University of Hong Kong, Kadoorie Biological Sciences Building, Hong Kong, China. yasuhara@hku.hk; ORCID: 0000-0003-0990-1764 Keywords: Taxonomy; new species; new genera; Holocene; Cheilostomatida Final citation: Di Martino, Emanuela, Rosso, Antonietta, Taylor, Paul D., Chiu, Ruby W.T., Fujita, Kazuhiko, Kitamura, Akihisa, and Yasuhara, Moriaki. 2025. Unveiling the cheilostome bryozoan fauna of Daidokutsu submarine cave (Okinawa, Japan) over the last 7,000 years. Palaeontologia Electronica, 28(1):a7. https://doi.org/10.26879/1433 palaeo-electronica.org/content/2025/5441-holocene-bryozoans-from-japan Copyright: February 2025 Palaeontological Association. This is an open access article distributed under the terms of the Creative Commons Attribution License, which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited. creativecommons.org/licenses/by/4.0 https://zoobank.org/6E7554EF-C09B-4860-AC2A-FA1A6FD53B03 INTRODUCTION In his review of bryozoan diversity in Japanese waters, Hirose (2017) noted that the study of marine bryozoans in Japan dates to the H.M.S. Challenger expedition of 1873-1876 (Busk, 1884), while Ortmann (1890) produced the first major report on these benthic animals. As of 2008, over 1,000 bryozoan species were estimated to inhabit Japanese waters (Scholz et al., 2008). The most studied regions from north to south, include Hokkaido and the Kurile Islands, which host 185 species of cheilostome bryozoans (e.g., Mawatari, 1956; Mawatari and Mawatari, 1981; Grischenko et al., 2007); Tohoku (NE Japan), with 51 species on the Pacific side (e.g., Okada, 1928, 1929; Okada and Mawatari, 1937), and 27 species on the Sea of Japan side (e.g., Hayami, 1973); Tokyo Bay and Sagami Bay/Sea, with 179 species (e.g., Ortmann, 1890; Yanagi and Okada, 1918; Okada, 1934; Okada and Mawatari, 1935, 1936); the Noto Peninsula (Sea of Japan, middle Honshu) with 92 species (e.g., Mawatari, 1962; Sakakura, 1935); the Kii Peninsula (Pacific Coast, middle Honshu) with 144 species (e.g., Mawatari, 1952); the Ogasawara Islands, with 94 species (e.g., Silén, 1941); the Korea (Tsushima) Strait, between the East China Sea and the Sea of Japan, with 40 species (e.g., Okada, 1923); the Seto Inland Sea, with 14 species (e.g., Okada, 1934; Okada and Mawatari, 1938); Shikoku (Pacific coast), with four species (e.g., Ortmann, 1890; Okada and Mawatari, 1938); Kyushu, between the East China Sea and the southern part, with 63 species (e.g., Silén, 1941, 1947); and Okinawa, including Nansei Islands, with 26 species (e.g., Mawatari, 1987), and Sesoko Island, with 52 species (Dick and Grischenko, 2017). The most thoroughly investigated habitats are nearshore shelf regions, with fewer studies conducted in both intertidal sandy bottoms and deep waters (Hirose, 2017). In their review of Pleistocene bryozoans from Japan, Dick et al. (2008) reported 334 cheilostomes from four main regions: the Boso Peninsula, on the Pacific side of central Honshu with c. 145 species (e.g., Sakakura, 1935, 1938; Arakawa, 1995); SW Hokkaido and N Honshu near the Tsugaru Strait, with c. 129 species (e.g., Kataoka, 1957; Hayami, 1971, 1973, 1975); the Noto Peninsula, with c. 26 species (Hayami, 1975); and Niigata, in central Honshu, Sea of Japan, and Kikai-jima Island in the Nansei Archipelago south of Kyushu, with c. 133 species (e.g., Kataoka, 1961). The palaeoenvironments for these occurrences are shallow-water shelf habitats. Many habitats and specific time intervals remain unexplored, including submarine caves of Holocene age (the last c. 11,700 years). This paper aims to address this gap by describing and illustrating the taxonomy of 63 species of cheilostome bryozoans, found in a sediment core spanning the last 7,000 years, extracted from a dark, oligotrophic submarine cave on the east coast of Ie Island, Okinawa, Japan. We introduce three new genera and 30 new species. Descriptions and illustrations of the cyclostome species from the same samples will be presented in a separate work currently in preparation. This study establishes the taxonomic foundation necessary for an ecological investigation into the ecosystem-scale response of the cave fauna to environmental and climate changes through most of the Holocene. Previous research in this cave has focused on ostracods, larger benthic foraminifera, and bivalves (Kase and Hayami, 1992; Hayami and Kase, 1993, 1996; Tabuki and Hanai, 1994, 1999; Kitamura et al., 2007a, b; Yamamoto et al., 2009, 2010; Omori et al., 2010; Chiu et al., 2016, 2017). The inclusion of bryozoan data will extend this multitaxon approach to a new group, for which substantial information on cave assemblages exists from other regions of the world (e.g., Harmelin, 1986, 1997, 2000, 2003; Rosso et al., 2013a, b, 2018a, 2019, 2021a). MATERIAL AND METHODS Material used for this study was sorted from 62 samples (Table 1), each corresponding to 1 cm section of a sediment core (Core 19) obtained from a depth of 29 m inside the Daidokutsu submarine cave (26.72ºN, 127.83ºE; see Yamamoto et al., 2009; Chiu et al., 2017, figure 1A, B) on the east coast of Ie Island, Okinawa, Japan (Kitamura et al., 2007). The sampling site of Core 19 was located approximately 32.5 m from the entrance of the cave (see Chiu et al., 2017, figure 1C, for more details on the sampling site). The core, which was 5 cm in diameter and 233 cm long, covers approximately the last 7,000 years based on radiocarbon dating (Yamamoto et al., 2009; Kitamura et al., 2013). The samples were wet-sieved using a 63 µm sieve, dried, and then dry-sieved using 150 µm, 250 µm, 500 µm, and 1 mm sieves. Bryozoans were picked from the > 500 µm size fractions. Scanning electron microscopy was conducted on selected, uncoated specimens using low-vacuum scanning electron microscopes (SEMs) in back-scattered mode, a LEO VP-1455 and a JEOL IT500 at the Natural History Museum, London, UK (NHMUK), a Tescan Vega 2 LMU at the Department of Biological, Geological and Environmental Sciences of the University of Catania (Italy), and a Hitachi TM4000plus Tabletop at the Natural History Museum, University of Oslo, Norway. Morphometric measurements were taken from SEM images using the image processing program ImageJ (available at https://imagej.nih.gov/). Each measurement is given in the text as the mean value plus or minus standard deviation, observed range, number of specimens used and total number of measurements made (the latter two values enclosed in parentheses). Abbreviations for the measurements are: AvCyL, avicularium cystid length; AvCyW, avicularium cystid width; AvL, avicularium length; AvW, avicularium width; AvOpL, avicularium opesia length; AvOpW, avicularium opesia width; AZL, A-type zooid length; AZW, A-type zooid width; AZOpL, A-type zooid opesia length; AZOpW, A-type zooid opesia width; BZL, B-type zooid length; BZW, B-type zooid width; BZOpL, B-type zooid opesia length; BZOpW, B-type zooid opesia width; CryL, cryptocyst length; CryW, cryptocyst width; FoD, foramina diameter; FoN, foramina number; GymL, proximal gymnocyst length; KzL, kenozooid length; KzW, kenozooid width; LatGymW, lateral gymnocyst width; LyW, lyrula width; OpL, opesia length; OpW, opesia width; OpesL, opesiule length; OpesW, opesiule width; OvL, ooecium length; OvW, ooecium width; PeL, peristome length; ScuL, scutum length; ScuW, scutum width; SinL, orifice sinus length; SinW, orifice sinus width; VibrL, vibraculum length; VibrW, vibraculum width; ZL, zooid length; ZW, zooid width. The synonymy lists provided are not exhaustive. They include the original paper in which the species was first described, and in cases where the species names are currently accepted under a different combination, any subsequent work first adopting the new nomenclature. They also encompass works that specifically mention the presence of the species in Japan, along with those providing SEM micrographs. Three of us (EDM, AR and PDT) were responsible for the systematic part of this paper and are to be considered the authors for the new taxa described. All specimens, including type and figured specimens, are deposited in the collections of the Palaeontological Museum (PMC) of the Department of Biological, Geological, and Environmental Sciences of the University of Catania (Italy), under the catalogue numbers reported for each species. SYSTEMATIC PALAEONTOLOGY Phylum BRYOZOA Ehrenberg, 1831 Class GYMNOLAEMATA Allman, 1856 Order CHEILOSTOMATIDA Busk, 1852 Superfamily THALAMOPORELLOIDEA Levinsen, 1902 Family THALAMOPORELLIDAE Levinsen, 1902 Genus THALAMOPORELLA Hincks, 1887 Thalamoporella sp. 1 Figure 1 Figured material. PMC EDM-Collection J.H.B.119a, sample 19206 (Figure 1A-B) and sample 19084 (Figure 1C-E); Core 19, Daidokutsu cave, Okinawa, Japan, Holocene. Description. Colony encrusting, multiserial, unilaminar. Autozooids distinct, outlined by a thin rim of smooth gymnocyst, rectangular to hexagonal, elongate (mean ZL/ZW 1.49). Cryptocyst extensive, consisting of a raised, wide (27-64 µm), rope-like rim along proximal and lateral zooidal margins, convex, sloping towards the centre of zooid frontal surface between opesia and opesiules, slightly depressed and flat below opesiules, coarsely granular (granule diameter 14-29 µm), with a few, sparse pseudopores concentrated mainly in the proximal portion (pseudopore diameter 5-10 µm); pierced by two symmetrical, elliptical opesiules placed in the distal third of the zooid, just below the proximal margin of opesia. Gymnocyst reduced, visible distally and laterally to the opesia, usually more extensive laterally, reaching width of 43-76 µm; in a single zooid a preserved adoral tubercle of c. 33 µm in diameter. Opesia eye-shaped, occupying the distal third of zooidal length (mean OpL/ZL 0.30). A single heterozooid observed, lozenge-shaped, shorter than autozooid, symmetrical; cryptocyst coarsely granular, imperforate, lacking condyles or pivotal bar; distal margin triangular, opesia oval; sibling zooids not torqued towards heterozooid. Ovicells not seen. Measurements (µm). ZL 569±43, 514-653 (2, 12); ZW 381±48, 272-449 (2, 12); OpL 172±12, 149-187 (2, 12); OpW 203±16, 166-224 (2, 12); OpesL 75±12, 56-92 (2, 12); OpesW 54±5, 47-62 (2, 12); AvL 453 (1, 1); AvW 262 (1, 1); AvOpL 207 (1, 1); AvOpW 147 (1, 1). Remarks. Typically, vicarious avicularia in Thalamoporella have a prominently elevated rostrum with smooth lateral ‘wings’, and robust condyles or a complete crossbar. These characteristics, however, are absent in the single heterozooid observed, raising the possibility that it might be a kenozooid. Kenozooids, which are polymorphs that often form to fill geometric gaps within the colony, are common in species of Thalamoporella. Examples include the middle Miocene T. polygonalis Di Martino, Taylor and Portell, 2017 from Florida, and the Recent T. lanceolata Soule, Soule and Chaney, 1999 from Fiji and Samoa. The Recent Thalamoporella stapifera Levinsen, 1909 from Indonesia bears the closest resemblance in overall appearance and autozooid size range to the Okinawan species. However, the absence of more detailed features, such as the clear presence of vicarious avicularia, prevents further comparison and identification at the species level. Family STEGINOPORELLIDAE Hincks, 1884 Genus STEGINOPORELLA Smitt, 1873 Steginoporella sp. 1 Figure 2 Figured material. PMC EDM-Collection J.H.B.120a, sample 19210; Core 19, Daidokutsu cave, Okinawa, Japan, Holocene. Description. Colony erect, forming cylindrical branches of up to at least 15 longitudinal series of autozooids; maximum diameter of the available branch 3.95 mm. Zooids dimorphic (A- and "
