full_description = "About PEPatronage programScope of workEthics StatementOwnershipEditorsWebmasterHow to donate to support PE Article Search About PE Sponsors and Patrons Founded in 1997, Palaeontologia Electronica (PE) is the longest running open-access, peer-reviewed electronic journal and covers all aspects of palaeontology. PE uses an external double-blind peer review system for all manuscripts. Copyright of scientific papers is held by one of the three sponsoring professional societies at the author's choice. Reviews, commentaries, and other material is placed in the public domain. PE papers comply with regulations for taxonomic nomenclature established in the International Code of Zoological Nomenclature and the International Code of Nomenclature for Algae, Fungi, and Plants. SPONSORS The sponsors of Palaeontologia Electronica are: Society of Vertebrate Paleontology Palaeontological Association Paleontological Society Paläontologische Gesellschaft PATRONAGE PROGRAM PE is personally supported by our patrons: GOLD Julien Louys, Norman MacLeod, Andrew A. Farke, Dale Greenwalt, R. Timothy Patterson, Anthony E. Aldridge, the Lauer Foundation, Andrew Bush, Joachim Haug, Isobell Lawrence SILVER Michael Archer, Catherine Badgley BRONZE Ben Grace, Josep Alexandre Morales For more information and how to support the PE Patron Program, see sidebar or this page. OPEN ACCESS JOURNAL PE is an open access journal. There are no fees for authors such as submission fees or article processing fees. Costs for the journal are covered by PE Sponsors and the PE Patron Program. Users have the right to read, download, copy, distribute, print, search, or link to the full texts of articles in this journal, and to use them for any other lawful purpose as per the license each sponsor chose. Archive for PE is graciously provided by the Internet Archive Copyright: Coquina Press, August 2024"
