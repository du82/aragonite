["https://palaeo-electronica.org/content/2025/5415-xrf-characterization"]
title = "XRF characterization"
description = "Noninvasive elemental XRF characterization of mudstone lagerstätten for provenance identification: Advantages and limitations"
full_description = "Article Search XRF characterization Noninvasive elemental XRF characterization of mudstone lagerstätten for provenance identification: Advantages and limitations Alejandro Gil-Delgado, Jordi Ibáñez-Insa, Albert Sellés, Xavier Delclòs, Àngel Galobart, Matías Reolid, David Cruset, Soledad Álvarez, and Oriol Oms Article number: 28.1.a3https://doi.org/10.26879/1415Copyright Paleontological Society, January 2025 Author biographiesPlain-language and multi-lingual abstractsPDF version Submission: 3 June 2024. Acceptance: 18 December 2024. ABSTRACT The objective of this study is to explore the utility of portable X-ray fluorescence (pXRF) techniques in identifying the geochemical signature of various classical fossil sites within museum collections. The motivation for this research stems from the challenges posed by the Montsec lithographic limestones collection, which has been dispersed globally since the last century. In some cases, tracing the Montsec origin of certain pieces has proven to be unclear. To achieve this goal, we have examined 17 different lagerstätten sites characterized by distinct carbonate lithology and chronology, using various sample sets. The aim is to determine the feasibility of distinguishing each site through pXRF. The result indicate that this goal is achievable in many sites, such as Ockley or Daohughou, where differentiation is clear. However, in some instances, more sensitive XRF instruments or even other non-destructive techniques are required, as seen in the case of Solnhofen site and Montsec lithographic limestones. Nonetheless, even in these cases, some level of differentiation is possible through non-invasive pXRF. Furthermore, within the context of museum collections, we are examining the impact of resin used for fossils conservation (such as Paraloid ® -B72) on the detection of compositional signatures. It is noted that resin treatments can bring about changes, such as masking calcium detection and introducing iron into the obtained data. Alejandro Gil-Delgado. Departament de Geologia, Facultat de Ciències, Universitat Autònoma de Barcelona, Edifici Cs, 08193 - Cerdanyola del Vallès, Catalonia, Spain. alejandro.gil@uab.cat and Museu de la Conca Dellà, Lleida, Spain. Jordi Ibáñez-Insa. Geosciences Barcelona (GEO3BCN-CSIC), 08028 Barcelona, Catalonia, Spain. jibanez@geo3bcn.csic.es Albert Sellés. Museu de la Conca Dellà, Lleida, Spain and Institut Català de Paleontologia Miquel Crusafont, 08201, Sabadell, Spain. albert.selles@icp.cat Xavier Delclòs. Departament de Dinàmica de la Terra i de l’Oceà, Facultat de Ciències de la Terra, Universitat de Barcelona, 08028, Barcelona, Spain. xdelclos@ub.edu and Institut de Recerca de la Biodiversitat (IRBio), Universitat de Barcelona, 08028, Barcelona, Spain. Àngel Galobart. Museu de la Conca Dellà, Lleida, Spain and Institut Català de Paleontologia Miquel Crusafont, 08201, Sabadell, Spain. angel.galobart@icp.cat Matías Reolid. Departamento de Geologia, Universidad de Jaén, Campus Las Lagunillas sn, 23071 Jaen, Spain. mreolid@ujaen.es David Cruset. Geosciences Barcelona (GEO3BCN-CSIC), 08028 Barcelona, Catalonia, Spain. dcruset@geo3bcn.csic.es Soledad Álvarez. Geosciences Barcelona (GEO3BCN-CSIC), 08028 Barcelona, Catalonia, Spain. salvarez@geo3bcn.csic.es Oriol Oms. Departament de Geologia, Facultat de Ciències, Universitat Autònoma de Barcelona, Edifici Cs, 08193 - Cerdanyola del Vallès, Catalonia, Spain. joseporiol.oms@uab.cat Keywords: geological heritage; fossil-record; X-ray fluorescence; lithographic limestone; geochemistry Final citation: Gil-Delgado, Alejandro, Ibáñez-Insa, Jordi, Sellés, Albert, Delclòs, Xavier, Galobart, Àngel, Reolid, Matías, Cruset, David, Álvarez, Soledad, and Oms, Oriol. 2025. Noninvasive elemental XRF characterization of mudstone lagerstätten for provenance identification: Advantages and limitations. Palaeontologia Electronica, 28(1):a3. https://doi.org/10.26879/1415 palaeo-electronica.org/content/2025/5415-xrf-characterization Copyright: January 2025 Palaeontological Association. This is an open access article distributed under the terms of the Creative Commons Attribution License, which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited. creativecommons.org/licenses/by/4.0 INTRODUCTION The study of the fossil record provides relevant information about the ecosystems of the past and, therefore, about the history of life on Earth and how it evolved. Unfortunately, the clues provided by fossils are frequently not clear enough due to poor preservation, scarcity of specimens, and/or lack of paleobiological information. Thus, the localization and detailed investigation of the so-called fossil Lagerstätten sites are of paramount importance to achieve significant progress in the field of evolutionary paleontology. The term ‘Lagerstätte’ is a German word used in sedimentary geology to define any rock body that contains a unique wealth of paleontological information, either in a qualitative or quantitative sense (Seilacher et al., 1985; Behrensmeyer, 2021). Given the importance of Lagerstätten sites and the invaluable information they provide, many scientific institutions worldwide have been devoted to their thorough investigation since the very birth of the discipline. Examples of well-known classic sites include the famous Upper Jurassic localities of Solnhofen (Bavarian region of Altmühltal, Germany), Canjuers (Haute Provence, France) or the Cretaceous site of La Pedrera de Meià (southern Pyrenees of Lleida, Spain), among many others of different chronologies and locations around the planet. Unfortunately, early research on many of these sites was performed before the development of modern collection methodologies. In addition, communication issues among members of international teams were frequent during those times. Thus, although Lagerstätten sites yielded numerous exceptional fossil collections scattered over museums and institutions around the world, there is currently an underlying problem with the classification of many of the available fossils. More recently, some collections have been enriched with samples obtained by amateur collectors and vendors and even after spoliation of the sites, which adds another layer of difficulty to the correct provenance identification of the specimens. In the case of sites with similar lithologies and appearance, such as those composed by carbonate mudstones (as in the case of the sites mentioned above, i.e., Solnhofen, Canjuers and La Pedrera de Meià), the problem is even worse. It can be hypothesized that the issue of provenance identification could be addressed by analyzing the rock matrix of fossils through geochemical analytical techniques. For example, inductively coupled plasma mass spectrometry (ICP-MS) measurements could offer pertinent compositional information about the major and trace elements of samples composed of carbonate mudstones, which could be complemented with data on the characteristic δ18O and δ 13C isotopic signatures. For instance, the trace elements’ quantity in the samples could allow researchers to distinguish samples from different locations. However, ICP-MS and stable isotope analyses would imply the partial destruction of the samples, which is particularly problematic for unique holotypes or specimens with a delicate degree of conservation that cannot be easily subjected to mechanical extraction methods. An ICP-MS study on a large number of samples would be highly expensive and involve a significant bureaucratic burden (and, most likely, permission to extract material would not be granted by many institutions). In contrast, pXRF provides a much more accessible option due to its cost-effectiveness, operational simplicity, and efficiency compared to ICP-MS or stable isotope techniques, making it a far more practical analytical solution for many institutions. Portable X-Ray Fluorescence (pXRF) is a fast and powerful analytical tool that provides multielemental data of inorganic materials in a rapid and non-destructive manner. It is widely used in various fields, including applied geochemistry and stratigraphy (Lemière, 2018; Ibáñez-Insa et al., 2017), archaeology and cultural heritage (Madariaga et al., 2016; Biagetti et al., 2021), or environmental research (Rouillon and Taylor, 2016). Since pXRF can be easily employed in museums and institutions to virtually analyze any type of sample and material, it is clear that this technique might provide useful information about the origin of unidentified (or dubious) fossil specimens. In some cases, this technique might even allow one to unambiguously identify the provenance of the samples. In the present work, we explore the usefulness of pXRF as a fast and non-destructive means to identify the origin of fossil specimens from Lagerstätten sites. For this purpose, pXRF measurements on samples containing fossils from 17 different carbonate mudstone Lagerstätten sites have been performed. The objective of these measurements is to assess, in combination with multivariate statistical methods, whether the multielemental information obtained by pXRF may allow one to constrain, and even identify, the origin of fossil specimens. Our data and analysis suggest that pXRF may provide highly relevant information for this type of provenance studies. MATERIALS AND METHODS The main characteristics of each of the 17 sampled Lagerstätten sites (Figure 1) can be found in the Appendix (Table 1). This study is based on the in situ measuring of 37 samples housed in different institutions. It should be emphasized that La Pedrera de Meià (LPM acronym) fossil site is the ultimate focus of this study. The ongoing research performed in this site laid the groundwork for the present paper by highlighting the need to properly identify the origin of samples that might be dubiously attributed to LPM. This site is in the Montsec range, in the Lleida province (NE Spain). It is part of the formation ‘Lithographic limestones with Plants and Vertebrates of the Pedrera de Rúbies’ (Peybernès and Oertli, 1972), which is included in ‘the Montsech Charophyte Limestone Ensemble’ (Peybernès, 1976). The lithographic limestones of LPM are dated from the Uppermost Hauterivian to Lower Barremian (around 125.77 My) (Martín-Closas and López-Morón, 1995). Other sites such as La Cabroa site and El Reguer site, among a minimum of four more outcrops of smaller extension (Gil-Delgado et al., 2023a,b), also belong to this unit. These Barremian sites that are the focus of this work are interpreted as the result of a coastal-lake system sedimentation (Barale et al., 1984; Martínez-Delclòs, 1991) within the frame of the Early Cretaceous NE Iberoarmorican island. All the other carbonate mudstone sites from around the world included in this study are indicated in the map of Figure 1. In the case of European fossil sites, they are distributed throughout the continent. In the Iberian Peninsula, there are other Lagerstätten sites beyond Montsec: Alcover (Tarragona), Rubielos de Mora (Teruel), and Las Hoyas (Cuenca). Other than those in the Iberian Peninsula, the other European notable sites include Cerin, Canjuers, the Aix-en-Provence site of “Les Plâtrières” (all in France), the Ockley site of Smokejacks Brickworks (UK), and the famous Solnhofen and Kelheim sites, both in Germany. The studied Asian sites include the Lebanese localities of Hakel, Hadjoula, and Sahel Alma; the Karatau site in Kazakhstan; and the Chinese site of Daohugou. Finally, samples from the American continent come from the Brazilian Crato Formation and the Wyoming outcrops of the Green River Formation. The studied samples are housed in the following museums and universities. The lithographic limestones rock samples from LPM were collected during the last paleontological campaigns that began in 2019 and are stored at the Universitat Autònoma de Barcelona stratigraphy department (acronyms R, C and additionally samples from Las Hoyas, LH). On the other hand, the limestone samples from around the world were provided by the curator of the natural collection at the Museu de la Ciència CosmoCaixa (Barcelona), Dr. Alejandro Pérez Jiménez, who granted access to the lithographic fossil pieces (samples acronym as MCFO). Additionally, pieces from the Museu Blau de Barcelona (samples acronym as MGB), and pieces from the Universitat de Barcelona (acronyms Crn, Kr, Mnt-Alc, Ock, RMr, Dhg, Slnh, Crt-Brs and Aix-), were included in this study. The list of the investigated samples with their corresponding reference names can be found in the Appendix Table 1. Non-destructive pXRF measurements were performed on all the samples investigated in this work. The measurements on all samples were acquired by using a Bruker Tracer-IV Geo instrument coupled to a tripod (see Figure 2). This analyzer is a portable energy-dispersive (EDS) device that is equipped with a 40 kV rhodium (Rh) X-ray generator and a large area (30 mm2) silicon drift detector. The size of the analyzed area on the sample is around 8 mm2. The instrument is easily controlled through a portable digital assistant (PDA), which allows one to set up the experimental conditions of the analyses and which also displays the quantitative (elemental) data. The measurements were acquired by using one of the internal calibrations set up in the instrument, the so-called “Precious Metals” method as provided by the manufacturer. Typical integration times of 120 s were used. This internal calibration was selected because it allows one to excite and detect XRF signal from the most relevant elements in the limestones, which is achieved by applying high voltages to the X-ray tube. However, in order to analyze the XRF results we did not rely on the semiquantitative data provided by the built-in calibration, since it is clearly not expected to provide reliable results for the limestones. Instead, we extracted the intensity of the observed XRF peaks from the registered spectra (see Ibáñez-Insa et al., 2017 for details). The intensity data thus obtained was normalized to the intensity of the Compton peak. The resulting values can be found in Table 2 of the Appendix. These values enabled us to estimate the relative content, from sample to sample, of different elements, including P, S, Ca, K, Ti, Mn, Fe, Rb, and Sr, among others, and to perform subsequent statistical treatment of the resulting daa. On the other hand, X-Ray micro-fluorescence (μ-XRF) compositional mappings were also obtained from a few samples (Figure 3). The mappings were conducted at Centro de Instrumentación Científico-Técnica CICT (Jaén University, Spain). An energy dispersive X-Ray micro-fluorescence spectrometer was used to map qualitative elemental abundance of samples. Samples were excited using an X-ray tube with a rhodium anode, with a maximum fork work excitation intensity of 50 kV and 600 μA (30W). The X-ray optics relied on polycap"
