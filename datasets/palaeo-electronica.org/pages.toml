full_description = '''Article Search Everyone’s Favorite Fossil Fish Gets a New Look Case Vincent Miller As a young Russell Engelman walks through the visitor hall of the Cleveland Museum of Natural History, there are countless wonders on display. Gems, dioramas, and dinosaur fossils surround him. But his eyes are fixed on one fossil in particular: The skull and body armor of a giant fish, Dunkleosteus. Dunkleosteus is an arthrodire, one of a large group of armored fishes which dominated the oceans during the Devonian Period, between 420 and 360 million years ago. And while Engelman is impressed by the skull and bladed jaws in front of him, he cannot help but wonder where the rest of the animal is. He would later learn that most of the skeleton of Dunkleosteus (and other arthrodires) is made of cartilage, a soft material which usually does not fossilize. As a result, most of what Dunkleosteus’ body looks like was a mystery. Read more … Terror Bird Discovery Shakes Up What We Know of Ancient Antarctica Case Vincent Miller Dr. Carolina Acosta Hospitaleche is over 3,000 kilometers (2,000 miles) away from home, on an island off the coast of Antarctica. She and her team have flown across the ocean to a research base, received supplies from a dedicated research logistics team, flown once more in a helicopter to their camp site, and assembled the tents and radio system that will be their lifeline in the event a storm hits. Now they are making the most of their time in the field, taking advantage of the relatively hospitable summer weather with the knowledge that any fossils left at the surface will likely not survive the harsh winter storms. As she digs through the sediment of the La Meseta Formation, from about 10 million years after the extinction of the non-avian dinosaurs, she stumbles on a claw large and curved enough to make any Velociraptor blush. Dr. Acosta Hospitaleche recognizes what she’s found immediately: a terror bird. Read more … New Megalodon Body Reconstruction Revamps an Iconic Shark Megalodon Shark Conrad Wilson Megalodon (aka Otodus megalodon) has enjoyed a recent rise to fame. Even before its star turn, Megalodon was a standout. Almost all sharks are harmless – not Megalodon. With an estimated total length of 15-20 meters (already longer than a school bus) and vast jaws set with immense teeth, the prehistoric shark has the chops to take the lead in any creature feature. It first flirted with fame following the release of the notorious pseudo-documentary “Megalodon: The Monster Shark Lives” in 2013. But Megalodon truly swam into the mainstream in 2018 when it starred in the eponymous blockbuster “The Meg” opposite Jason Statham. Read more … Texas IS beaver country Mark Nikolic Inspiration can come from anywhere, and for Steve May, a research associate at the University of Texas’ Jackson School of Geosciences, inspiration came in the form of a Buc-ee’s billboard. For those uninitiated (or those not from Texas), Buc-ee’s is a famous chain of gas stations and travel centers with a number of world records and an iconic, red-capped beaver mascot. Read more … Florida gators, but make them way older and cuter Mark Nikolic How do you tell the difference between an alligator and a crocodile? Read more … Sealed in the past: new Australian fossil seals Mark Nikolic Long considered one of the world’s most livable cities, Melbourne (Naarm/Narrm in the Boonwurrung and Woiwurrung languages) is the cultural capital of Australia and home to brilliant scenery and beautiful beaches. New fossils described in Palaeontologia Electronica from the beaches of the suburb Black Rock suggest that seals also found Melbourne particularly livable, and for longer than previously thought. Read more … Dinosaurs: how their family history tells the story of evolution Hannah Bird Dinosaurs are one of the most widely studied extinct organisms, with their incredible diversity capturing the imaginations of generations of enthusiasts and scientists. One of these diversity traits is the evolution from bipedality (two limbs for walking) to quadrupedality (four limbs), with new research identifying when this important change happened. This shift occurred at least four times within dinosaurs, but probably the least understood of these is within iguanodontians. Read more … Symbiotic relationships: finding a home BByBy Hannah BirdHannah Bird Symbiotic relationships, where two organisms closely co-exist, are usually considered beneficial for both parties. But when one takes advantage of the other, parasitism dominates. Remarkably, both of these relationships can be seen in the fossil record from millions of years ago. Read more … When ocean giants collide Hannah Bird Picture a face-off between a giant shark and small whale in the Miocene oceans 15 million years ago and you may think you know the ending. But fossil remains found in the Calvert Cliffs, Maryland, USA, reveal a different story – one of tenacity and survival. Read more … Flying into the past: Diptera from Eocene Montana Hannah Bird Whilst indulging in a summer picnic or barbeque we may consider flies bothersome, but have you ever contemplated their evolution? Incredibly, many of their genera have astonishing longevity, establishing themselves in the Middle Triassic (247 to 237 million years ago) and with some living species existing for millions of years. There are 161 families of flies today, living in almost all environments on Earth. Perhaps it’s time to regard them a little more kindly and that is exactly what researchers from the Smithsonian Institution, Washington, D.C., and their collaborators, have done for the last decade. Read more … Amateur Fossil Collectors are Essential to Paleontology In Memory of Dr. Patrick Getty Story in a Skeleton – A Phytosaur Fighting Infection A South Carolina Shark Nursery, Or How I Learned to Quit Worrying and Love "Baby Shark" 5 New Discoveries About Sharks of the Past We're Gonna Need a Bigger Megalodon: Estimating Body Size in Extinct Sharks Here There Be Dragon(flies): Odonata in Oligocene Germany A Fossil Collection Inspection: Examining Anthropogenic Bias in Fossil Collections A "Cave" Undertaking: Raptor Pellets Shed Light on Cuba’s Recent Past Fossil Spiders from an Ancient Lake Page 1 of 8 1 2 3 4 5 6 7 8'''
