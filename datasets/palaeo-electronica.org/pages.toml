title = "Review Handbook of Paleoichthyology"
description = "A Review of Handbook of Paleoichthyology Volume 8a: Actinopterygii I, Palaeoniscimorpha, Stem Neopterygii, Chondrostei"
full_description = "Article Search Review Handbook of Paleoichthyology A Review of Handbook of Paleoichthyology Volume 8a: Actinopterygii I, Palaeoniscimorpha, Stem Neopterygii, Chondrostei Reviewed by Russell K. Engelman, Nicholas Gardner, and John-Paul M. Hodnett Article number: 27.3.R1October 2024 Author biographiesPDF version Hans-Peter Schultze, Kathryn E. Mickle, Cecile Poplin, Eric J. Hilton, and Lance Grande, 2021. Verlag Dr. Friedrich Pfeil, München, 299 pp. US$293.50, hardcover, ISBN: 978-3-89937-272-4. Palaeoniscoids, an informal term referring to a paraphyletic group of largely Paleozoic stem-neopterygian fishes, have generally gotten the short end of the stick in paleoichthyology. These fishes are typically overshadowed by Paleozoic placoderms, sarcopterygians, and chondrichthyans, as well as their geologically younger neopterygian (especially teleost) descendants. As a result, it is a pleasant surprise to see Handbook of Paleoichthyology Volume 8a: Actinopterygii I, Palaeoniscimorpha, Stem Neopterygii, Chondrostei, a volume wholly devoted to these underappreciated taxa, as well as the few Meso-Cenozoic lineages of non-neopterygian ray-finned fishes (i.e., bichir, sturgeons, and paddlefishes). The book itself is very high quality. The binding is nice; the pages are crisp. This is typical and expected of most books in this series, and it is delightful to see adherence to the same quality standards of the prior decades when many other printing houses are cutting corners in physical publishing. The first 42 pages of the book are a review of ray-finned fish anatomy. This section focuses on the various bones of the skull, the different body shapes and morphologies exhibited by palaeoniscoids, and associated terminology, which is illuminating as the significant body shape disparity seen in palaeniscoids is underappreciated compared to teleosts. Although Paleozoic actinopterygians are often characterized as morphologically homogeneous Cheirolepis- or Kentuckia-like taxa, a mere glance at Figures 1 and 3 of this volume will dispel that notion. The section on paleobiology (“Habitat and Adaptations”, pp. 45-49) is brief, focusing on whether certain palaeoniscoid taxa occur in freshwater or marine environments, but which can be forgiven due to the general dearth of research on their life habits. For more in-depth discussions of palaeoniscoid paleobiology, readers will want to refer to Williams (1990) and Chevrinais et al. (2017) for their role in trophic structures, Pearson and Westoll (1979), Poplin and Lund (2000), and Friedman et al. (2018) on feeding behavior, and Williams and Lucas (2013) and Fletcher et al. (2014) on locomotory behavior and habitat. The book contains copious life reconstructions, with almost every page containing at least one whole body reconstruction or skull illustration. These reconstructions are mostly high quality, and literature figures have been redrawn to give them all a very consistent feel. A very nice touch are the additions of “scale windows” on most of these reconstructions. Readers will have a good idea of the overall scalation pattern of each taxon, while not being overwhelmed by the intricate and often complicated patterning of palaeoniscoid scales. While the book has large numbers of life reconstructions of palaeoniscoids, it has perhaps 3-5 photographs of actual fish fossils outside of the section on chondrosteans, which conceals how many of the reconstructions have been retro-assembled from the preserved fossils and what palaeoniscoid fossils look like in their original state. For example, the figured image of Bluefieldius mercerensis Mickle, 2018, is spectacular. However, palaeoniscoid fossils are quite often “splattered” (e.g., ‘Fubarichthys’; Lowney, 1980; Lowney in Frickhinger, 1991) and require a significant amount of expertise to put back together. However, we acknowledge that additional photography would likely add significant reproduction costs to an already expensive book, and could represent an opportunity for future researchers. The poorly resolved nature of stem-actinopterygian taxonomy (Henderson et al., 2023) challenges this book’s organization. The authors fully acknowledge this limitation (p. 64). This makes it challenging to use this text for identifying fossils, as the taxa are organized alphabetically for a significant portion of this text (pp. 73-225), with almost 89 pages (pp. 136-225) of ‘Palaeoniscimorpha incertae sedis’. Readers must flip through the book and hope to see a recognizable taxon. Until palaeoniscoid taxonomy can be better resolved, this was organized as well as it could be. Most of the diagnoses in the book focus entirely on cranial characters (which is unsurprising: Mickle, 2015). However, the vast majority of palaeoniscoid fossils encountered in the field and lab are scale patches or isolated scales. The actual section on scale anatomy (pp. 39-41) is very brief. Obviously, the use of “scale taxa” is best approached cautiously, but a table showing what scale features occur in what taxa would have been beneficial. There is also no key to help refer fossils at the genus- or species-level or even higher-level groups. This greatly limits the utility of the book in identifying palaeoniscoid material, making it mostly useful for palaeoniscoid specialists, rather than Paleozoic fish researchers more broadly. As researchers that had hoped to use this volume to identify palaeoniscoid material, we were left wanting more. Future work could explore the interspecific, intraspecific, and intra-individual variation of palaeoniscoid scale morphology, as a standalone volume. This book still fills a gap as palaeoniscoids have lacked a general review, which is what will draw most readers to this text. The sections on stem-neopterygians and chondrosteans are worthy of reading as well as a resource for those interested in delving into this topic. It is appreciable that despite chondrostean anatomy and evolution already being extensively published elsewhere (e.g., Findeis, 1997; Hilton and Grande, 2006; Hilton et al., 2011), that the section on chondrosteans is lavishly documented, providing detailed illustrations and photographs of the skeletal anatomy of these fishes. The quality of the treatment of sturgeons, paddlefishes, and their extinct relatives is comparable to what has already been published for other living non-teleost actinopterygians: bowfins (Grande and Bemis, 1998) and gars (Grande, 2010). In summary, this book is a must-have for any researcher working on Paleozoic actinopterygians. It will primarily benefit workers who need a reference for palaeoniscimorphs, as well as a general review of chondrosteans and stem-neopterygians. The book and its illustrations are high quality making it a worthwhile consideration for any paleoichthyologist’s bookshelf. REFERENCES Chevrinais, M., Jacquet, C., Cloutier, R. 2017. Early establishment of vertebrate trophic interactions: Food web structure in Middle to Late Devonian fish assemblages with exceptional fossilization. Bulletin of Geosciences, 92:491–510. http://www.geology.cz/bulletin/contents/art1651 Findeis, E. 1997. Osteology and phylogenetic interrelationships of sturgeons (Acipenseridae). Environmental Biology of Fishes, 48:73-126. https://doi.org/10.1023/A:1007372832213 Fletcher, T., Altringham J., Peakall J., Wignall P., and Dorrell R. 2014. Hydrodynamics of fossil fishes. Proceedings of the Royal Society B, 281:20140703. https://doi.org/10.1098/rspb.2014.0703 Frickinger, K.A. 1991. Fossilien Atlas. Fische. Melle, Mergus. Friedman, M., Pierce, S. E., Coates, M., Giles, S. 2018. Feeding structures in the ray-finned fish Eurynotus crenatus (Actinopterygii: Eurynotiformes): implications for trophic diversification among Carboniferous actinopterygians. Earth and Environmental Science Transactions of the Royal Society of Edinburgh, 109, 33-47. https://doi.org/10.1017/S1755691018000816 Grande, L. 2010. An empirical synthetic pattern study of gars (Lepisosteiformes) and closely related species, based mostly on skeletal anatomy. The resurrection of Holostei. Copeia, 10:1-871. https://www.jstor.org/stable/20787269 Grande, L. and Bemis, W. 1998. A comprehensive phylogenetic study of amiid fishes (Amiidae) based on comparative skeletal anatomy. An empirical search for interconnected patterns of natural history. Society of Vertebrate Paleontology Memoir, 4:1-690. https://doi.org/10.1080/02724634.1998.10011114 Henderson, S., Dunne, E., Fasey, S., and Giles, S. 2023. The early diversification of ray-finned fishes (Actinopterygii): hypotheses, challenges and future prospects. Biological Reviews, 98:284-315. https://doi.org/10.1111/brv.12907 Hilton, E.J., and Grande, L. 2006. Review of the fossil record of sturgeons, family Acipenseridae (Actinopterygii: Acipenseriformes), from North America. Journal of Paleontology, 80:672--683. https://doi.org/10.1666/0022-3360(2006)80[672:ROTFRO]2.0.CO;2 Hilton, E., Grande, L., and Bemis, W. 2011. Skeletal anatomy of the shortnose sturgeon, Acipenser brevirostrum Lesueur, 1818, and the systematics of sturgeons (Acipenseriformes, Acipenseridae). Fieldiana Life and Earth Sciences, 2011:1-168. https://doi.org/10.3158/2158-5520-3.1.1 Lowney, K.A. 1980. Certain Bear Gulch (Namurian A, Montana) Actinopterygii (Osteichthyes) and a reevaluation of the evolution of the Paleozoic actinopterygians. Unpublished PhD thesis, New York University, New York City, USA. https://www.proquest.com/dissertations-theses/certain-bear-gulch-namurian-montana/docview/303023402/ Mickle, K. 2015. Identification of the bones of the snout in fossil lower actinopterygians-a new nomenclature scheme based on characters. Copeia, 103:838-857. https://www.jstor.org/stable/24642302 Mickle, K. 2018. A new lower actinopterygian from the Upper Mississippian Bluefield Formation of West Virginia, USA. PeerJ, 6:e5533. https://doi.org/10.7717/peerj.5533 Pearson, D.M. and Westoll, T.S. 1979. The Devonian actinopterygian Cheirolepis Agassiz. Earth and Environmental Science Transactions of the Royal Society of Edinburgh 70:337–399. https://doi.org/10.1017/S0080456800012850 Poplin, C. and Lund R. 2000. Two new deep-bodied palaeoniscoid actinopterygians from Bear Gulch (Montana, USA, Lower Carboniferous). Journal of Vertebrate Paleontology 20:428–449. https://doi.org/10.1671/0272-4634(2000)020[0428:TNDBPA]2.0.CO;2 Williams, S.C., Lucas, S.G. 2013. Taphonomy and palaeoecology of Pennsylvanian fishes from the Kinney Brick Quarry, New Mexico, USA. New Mexico Museum of Natural History and Science Bulletin 59:371–389. Williams, M.E. 1990. Feeding behavior in Cleveland Shale fishes, p. 273–287. In Boucot, A.J. (ed.), Evolutionary biology of behavior and coevolution. Amsterdam: Elsevier. https://doi.org/10.1016/B978-0-444-88034-5.50013-3"
