["https://palaeo-electronica.org/content/2025/5439-glossary-of-tetrapod-tracks"]
title = "Glossary of tetrapod tracks"
description = "Glossary of fossil tetrapod tracks"
full_description = "Article Search Glossary of tetrapod tracks Glossary of fossil tetrapod tracks Jens N. Lallensack, Giuseppe Leonardi, and Peter L. Falkingham Article number: 28.1.a8https://doi.org/10.26879/1389Copyright Society of Vertebrate Paleontology, February 2025 Author biographiesPlain-language and multi-lingual abstractsPDF version Table of Contents Submission: 8 March 2024. Acceptance: 26 December 2024. ABSTRACT The terminology used in fossil tetrapod track research has expanded and evolved considerably in recent decades. The main drivers of this change are conceptual and methodological advances, the emergence of distinct subfields such as hominin track research, and increased interdisciplinarity. This growing lexicon has led to confusion and conflict, as long-standing usage of terms has been questioned (e.g., the term “preservation”) or conflicts with the terminology of related fields such as invertebrate ichnology and biomechanics (e.g., the terms “elite track/trace” and “pace gait”). In addition, the definition of a number of key terms, including the term “track” itself, has remained vague. The present glossary provides a comprehensive review of the terminology used in tetrapod track research. In addition to documenting past usage of terms, we aim to provide a standard terminology that is 1) precisely defined, unambiguous, and consistent; 2) compatible with terminology used in related fields; 3) reflects current knowledge and is not misleading, and 4) is easily understood and follows traditional usage as much as possible. In addition to terminology, we also aim to briefly explain and discuss the concepts and methods behind each term, and, where appropriate, refer the reader to the relevant literature. Jens N. Lallensack. Departamento de Ciência da Computação, Universidade Federal de Minas Gerais, Belo Horizonte, MG, Brazil. jens.lallensack@posteo.de Giuseppe Leonardi. Istituto Cavanis, Dorsoduro 898, 30123 Venezia, Italy and Universidade Federal do Rio de Janeiro, CCMN, Instituto de Geociências - Geology Department, Cidade Universitária, Ilha do Fundão, 21949-900 Rio de Janeiro, RJ, Brazil. leonardigiuseppe879@gmail.com Peter L. Falkingham. School of Biological and Environmental Sciences, John Moores University Liverpool, Merseyside, UK. P.L.Falkingham@ljmu.ac.uk Keywords: terminology; ichnology; fossil footprints; trackways; definitions; palaeontology Final citation: Lallensack, Jens N., Leonardi, Giuseppe, and Falkingham, Peter L. 2025. Glossary of fossil tetrapod tracks. Palaeontologia Electronica, 28(1):a8. https://doi.org/10.26879/1389 palaeo-electronica.org/content/2025/5439-glossary-of-tetrapod-tracks Copyright: February 2025 Society of Vertebrate Paleontology. This is an open access article distributed under the terms of the Creative Commons Attribution License, which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited. creativecommons.org/licenses/by/4.0 INTRODUCTION The field of fossil tetrapod track research has grown steadily over the last few decades. Increased knowledge and methodological advances have led to an ever-increasing pool of terminology. Distinct sub-fields have emerged, such as the study of dinosaur tracks or the study of fossil hominin tracks. Each of these subfields uses slightly different approaches and conventions, especially in ichnotaxonomy, and has developed specialised and sometimes conflicting terminology. More importantly, tetrapod track research has become increasingly interdisciplinary, with integrative approaches involving body fossils, modern animals, sedimentology, biomechanics, soil mechanics, tectonics, statistics, experiments and computer simulations, and, in the case of fossil hominin tracks, even forensics. These developments also bring challenges, as specialised terminology is no longer widely understood across the broader field of ichnology. The increasing interdisciplinarity has also led to collisions between traditional ichnological terminology and modern terminology “borrowed” from outside of the field. This can include identical words that convey different meanings, as is, for example, the case with the terminology of quadrupedal gaits. Traditional ichnological terminology was greatly influenced by the “Glossary and Manual of Tetrapod Footprint Palaeoichnology” (Leonardi et al., 1987), which contained a comprehensive list of terms in eight languages as well as a discussion of terms and methods. Given the ever-growing pool of terminology, Leonardi et al. (1987) discussed only a fraction of the terms currently in use, and some of their definitions are becoming a growing source of confusion due to conflicting definitions from related fields of study – an inevitable consequence of the increasing interdisciplinarity. A few attempts at updated glossaries have since been made (Vintaned and Liñan, 1996; Marty et al., 2016), although the only systematic attempt in English (Marty et al., 2016) was limited to dinosaurs and focused on a few central terms rather than attempting to be exhaustive. As a result, no comprehensive glossary is available that adequately reflects current terminology. The purpose of our present contribution is therefore three-fold: First and foremost, we aim to provide a comprehensive review of the existing terminology used in tetrapod track research. We focus on terms that are specific to this field of study or that take on new meanings, including subtle differences in definitions between fields that have not yet been formally documented. We also discuss terms that are important in the context of tetrapod ichnology for other reasons but are not strictly ichnological terms. We aim to include all such terms, including those specific to particular subfields, and only omit terms that have not yet found application beyond the work of the author who first introduced them. We do not include names of ichnotaxa. Unlike Leonardi et al. (1987), we restrict ourselves to the English language, as publications in other languages are much rarer than they were three decades ago. However, we would welcome future translations of this work, either formally or informally. Second, we aim to provide a standard terminology that is ideally 1) precise, unambiguous, and consistent; 2) compatible with terminology used in related fields; 3) reflects current knowledge while not being misleading, and 4) follows traditional usage of terms as closely as possible. We will give preference to the most used terms in the literature that meet these criteria and will avoid introducing new terms whenever possible. To arrive at such a standard terminology, we will 1) point out any ambiguities and logical problems that may be associated with certain terms, and 2) make recommendations as to which terms should be used. While we do not seek to abandon redundant terminology that may have become an integral part of ichnological history, we hope that these discussions will at least raise awareness of the many pitfalls and urge authors to be clear about the meaning of the terms they use. Third, following the tradition established by Leonardi et al. (1987), we aim to provide not only precise definitions of terms, but also concise introductions to key concepts and methods, including some general suggestions for the study of tracks. Where appropriate, we will also refer the reader to the most relevant literature. The terms discussed are organised into a total of 277 numbered entries. Each of these entries represents a distinct concept and may discuss a single term or a related group of terms. For example, the entry “track” covers not only the term “track” and its synonyms (e.g., “footprint”, “ichnite”), but also similar but distinct concepts such as “track volume” and “maximum zone of deformation”. Terms that, in the judgment of the authors, are particularly important and/or distinct are bolded for quick access, but such bolding is used sparingly to maximise practical value. The entries themselves are divided into ten separate sections. Each section may contain subtopics to group similar terms and is accompanied by overviews that briefly introduce broad topics. The glossary includes a Table of Contents, which lists all the terms discussed in alphabetical order and synonyms that may be useful. There is also a number indicating the entry in which a given term is primarily discussed. As these files are electronic, readers can always use CTRL F or COMMAND F to find any topic. TABLE OF CONTENTS The Table of Contents lists the terms and synonyms included in this glossary in alphabetical order, indicating the number of the glossary entry in which the term is primarily discussed. To avoid redundancy, this index excludes synonyms and spelling variations if they are similar to and in the same alphabetical position as the main entry (e.g., “trotting gait” and “trotter” vs. “trot”). Alphabetical terminology in the Table of Contents is linked to the numbered terminology below. BASIC TERMINOLOGY This glossary deals with tetrapod tracks and associated impressions of the body. Tracks are generally the most common type of tetrapod trace fossil. Although most of our knowledge of fossil tetrapods is based on body fossils, tracks are an important complementary source of information. Tracks record the activity of the trackmakers at a particular point in their life, and therefore record behaviour and posture (Lockley, 1991). Tracks are common in the fossil record (an individual may leave many tracks during its life but only a single skeleton) and typically record the entire surface of the undersides of the feet. In contrast, complete pedal skeletons are rare, and soft tissues are preserved only in exceptional cases. Finally, because of their different preservation potential, tracks often occur in rock units devoid of bones, filling important gaps in the fossil record. Tracks can also help to date stratigraphic units. At the same time, the use of tracks as a source of information can be limited by 1) difficulties in distinguishing anatomical information from the effects of substrate properties, foot kinematics (foot movements), and post-formational alteration; 2) difficulties in trackmaker identification; and 3) time averaging of tracksites. It is both a major challenge and an opportunity for future studies to improve on these issues. 1 Recognising tetrapod tracks. Distinguishing genuine tetrapod tracks from other structures is not always unequivocal (see Lallensack et al., 2022c, and references therein). Most commonly, tetrapod tracks have been confused with arthropod trackways, especially those of limulids (horseshoe crabs; Figure 1A); fish feeding traces (or nests; Figure 1B); and weathering pits (Figure 1C-D) (Lucas, 2015; Breithaupt et al., 2021; Lallensack et al., 2022c). The most reliable criterion is a regular trackway morphology with predictable track positions. Tetrapod trackways also show alternating foot placement (rather than side-by-side placement as in arthropod trackways), and, in quadrupeds, a differentiation into pes and manus tracks based on size and/or shape (Lucas, 2015; Lallensack et al., 2022c). Track morphology can provide strong evidence if it is consistent across multiple tracks and matches the known anatomy of the trackmaker (Lucas, 2015). Evidence can also be provided by deformation structures, such as asymmetric displacement rims and downward deflection of subsurface layers seen in cross section; the latter distinguish tracks from erosional features or human carvings (Lallensack et al., 2022c). For criteria to distinguish tracks in cross-section from similar soft-sediment deformation structures such as load casts and ball-and-pillow structures, see, e.g., Jackson et al. (2009) and Carvalho et al. (2022). Finally, the stratigraphic, temporal, and environmental context must be considered. 2 Trace fossil (synonym: ichnofossil). The fossilised (i.e., pre-Holocene) result of activity an organism left behind by modifying a substrate (cf. Bertling et al., 2006). More inclusive terms that are not restricted to ancient traces are “ichnospecimen”, “Lebensspur” (German for “life trace”), and “biogenic structure”. The ICZN defines the term “work of an animal” (International Commission on Zoological Nomenclature, 1999). The term “biogenic sedimentary structure” refers to fossil and modern traces produced in unconsolidated sediments (Frey 1973). Common types of tetrapod trace fossils include tracks; skin impressions; coprolites (fossil faeces) and other material from the digestive tract (see Hunt and Lucas, 2012); urolites (or “uroliths”), i.e., nonliquid urinary excrements as well as sediment structures formed by the impact and flow of liquid urine (see Fernandes et al., 2004); bite marks; burrows; and nests (but not eggs, e.g., Frey, 1973). “Body fossils” (sometimes termed “somatofossils”), in contrast, are remains of the organism itself, such as bones and teeth, or impressions thereof. The term “trace fossil” also does not apply to tool marks (e.g., role marks left by shells) and other structures that do not directly record organism activity (Frey, 1973). 3 Ichnology. The scientific study of traces of biological activity. Researchers who study traces are known as “ichnologists”. Palaeoichnology (also “paleoichnology” or “palichnology”) is the study of trace fossils, as opposed to neoichnology, the study of modern traces. A distinction is also made between invertebrate ichnology and vertebrate ichnology (or “tetrapod ichnology”), as these two fields differ in their aims and approaches (e.g., Lockley, 2007; Minter et al., 2007). Vertebrate ichnology includes traces of tetrapods (a taxon that includes all amphibians and amniotes) as well as fish and fish-like animals such as placoderms, and is therefore more inclusive than “tetrapod ichnology”. Another distinction is made between “marine ichnology” and continental ichnology, which encompasses freshwater and terrestrial settings (e.g., Hasiotis, 2002). The field of ichnology, and neoichnology in particular, is poorly defined outside the geosciences, and traces are often studied by workers of related fields who may not consider themselves ichnologists (e.g., biologists, archaeologists, or forensic scientists) (Baucon et al., 2012). 4 Impression. Generic term for an indentation left by an object in a substrate. A common synonym is “imprint”. When used as a modifier, “mark” is sometimes used interchangeably with “impression”, although this depends on the term in question: “pes impression” and “skin impression” are common terms, whereas “pes mark” or “skin mark” are not in use. Conversely, “claw mark” and “drag mark” are more common than the alternative terms “claw impression” and “drag impression”. In general, we observe that “impression” is usually connotated with a more or less vertical movement of the object, while “mark” is most often used for relatively small accessory traces (e.g., “claw m"
