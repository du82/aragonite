["https://palaeo-electronica.org/content/2025/5431-trimming-down-perucetus"]
title = "Trimming down Perucetus"
description = "Further trimming down the marine heavyweights: Perucetus colossus did not come close to, much less exceed, the tonnage of blue whales, and the latter are not ul"
full_description = "Article Search Trimming down Perucetus Further trimming down the marine heavyweights: Perucetus colossus did not come close to, much less exceed, the tonnage of blue whales, and the latter are not ultra-sized either Gregory S. Paul and Asier Larramendi Article number: 28.1.a6https://doi.org/10.26879/1435Copyright Palaeontological Association, January 2025 Author biographiesPlain-language and multi-lingual abstractsPDF version Submission: 5 August 2024. Acceptance: 26 December 2024. ABSTRACT Extrapolating from skeletal/total mass ratios, the gigantic Paleogene whale Perucetus colossus has been estimated to have massed 85 to 341 tonnes, approaching and even exceeding the blue whale (Balaenoptera musculus). Such a large variation in body mass lacks the precision needed for analytical accuracy and is therefore not of technical value. Despite sufficient remains for a much more accurate volumetric model, none was produced for robust testing their procedure. A subsequent paper downscaled Perucetus to 60 to 70 tonnes as the most probable estimate. To better assess the question, we have produced multiview profile-skeletals for Perucetus and other large marine mammals in the most extensive such effort to date. These include the first accurate restorations of a number of large marine mammals. Perucetus is restored using the proportions of heavy boned pachycetine basilosaurs. Cross comparisons and attempts to illustrate the extinct whale's realistic volume leave no doubt that the Perucetus holotype did not reach the cetacean heavyweight category. A length of 15 to 16 m and a mass of 35 to 40 tonnes is more in line with its known anatomy. This result was affirmed by recalculations of skeletal/total mass relationships in large pachyosteosclerotic marine mammals, which suggest the method can produce useful estimates if conducted properly. Although their initial size expansion was remarkably rapid, basal cetaceans did not balloon to super whale dimensions just a few million years after the initial evolution of the fully marine forms. Evolution of extremely large body size exceeding 50 tonnes did not occur until the late Neogene. The biggest whale of all time, the blue, is not likely to exceed ~30 m and 200 tonnes. It is emphasized that anatomical knowledge translated into technical volumetric models remains the most critical means of restoring the mass of extinct organisms. Gregory S. Paul. 3100 St Paul St 604, Baltimore, MD 21218, USA. GSP1954@aol.com Asier Larramendi. Eofauna Scientific Research, Beloka 5, 2 eskubi, Donostia 20009, Basque Country, Spain. larramendi.asier@eofauna.com Keywords: body mass estimation; basilosaurids; cetaceans; water displacement; graphic double integration; skeletal restoration Final citation: Paul, Gregory S. and Larramendi, Asier. 2025. Further trimming down the marine heavyweights: Perucetus colossus did not come close to, much less exceed, the tonnage of blue whales, and the latter are not ultra-sized either. Palaeontologia Electronica, 28(1):a6. https://doi.org/10.26879/1435 palaeo-electronica.org/content/2025/5431-trimming-down-perucetus Copyright: January 2025 Palaeontological Association. This is an open access article distributed under the terms of the Creative Commons Attribution License, which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited. creativecommons.org/licenses/by/4.0 INTRODUCTION It has long been understood that the extant blue whale (Balaenoptera musculus) is the largest living animal, if not of all time. Blue whales and other gigantic whales evolved in response to the optimal feeding conditions created by the ice-age oceans during the late Neogene period (Slater et al., 2017). However, the view that the blue whale is possibly the largest animal of all time was challenged twice in 2023. Paul and Larramendi (2023) explained that fragmentary remains suggest that the sauropod dinosaurs of the Jurassic and Cretaceous rivaled blue whales at 110 to 170 tonnes. That result was derived from the gold standard of most reliably estimating masses of extinct creatures, anatomically rigorous volumetric modeling. Then, Bianucci et al. (2023) contended that at estimated masses of 180 to 340 tonnes based on living cetaceans’ skeletal fractions, the partial remains of the gigantic Paleogene stem-whale Perucetus colossus “fall in or exceed the body mass distribution of the blue whale, therefore challenging the blue whale’s title of heaviest animal that ever existed.” This conclusion received wide coverage in the science news media. But the appearance of a super-sized whale so shortly after the first tiny cetaceans would be an evolutionarily extraordinary event. Skeptical of that possibility, Motani and Pyenson (2024) used a combination of volumetric modeling and skeletal/total mass calculations to show that Perucetus colossus could not have been as large as blue whales. Motani and Pyenson (2024) then went on to estimate that the latter reached 270 tonnes at 33 m, in contrast to the ~30 m and ~200 tonnes maximum arrived at by others for Balaenoptera musculus (McClain et al., 2015). Bianucci et al. (2023) used novel, elaborate skeletal/total mass extrapolations to estimate the mass of the Perucetus colossus with very inconsistent results, varying from 85 to 341 tonnes. That the results cover such very large plus-minus factor should cast doubt on their procedure, at least as conducted by Bianucci et al. (2023). That the preserved vertebrae and especially ribs of P. colossus are smaller in dimensions that those of B. musculus further reduces confidence in the Bianucci et al. (2023) results. Modern scientific methods for reconstructing masses through volumetric models based on precise skeletal restorations have been developed over recent decades to produce results avoiding outcomes from improper anatomical models or methodologies, like limb bone strength, which do not apply to marine tetrapods (Paul 1997, 2019; Larramendi, 2016; Brassey, 2017; Larramendi et al., 2021; Motani et al., 2023; Romano et al., 2023; Motani and Pyenson, 2024). When restoring the mass of a taxon known only from very incomplete remains, it is critical to as accurately as possible restore and model it and any available relations for purposes of comparison and extrapolation. In particular, extraordinarily high mass estimates must always be documented by and shown to be plausible with technical profile-skeletals. This benchmark method is used to further test the Bianucci et al. (2023) and the Motani and Pyenson (2024) methods and results. In order to do so, the most extensive effort to date to accurately restore the body forms and masses of extant giant whales based on mounted skeletons and photographs is conducted. Aside from addressing issues regarding modern cetaceans in Motani and Pyenson (2024), this is itself an issue of importance because there has yet to be a consensus on the appearance of living mega cetaceans such as the blue whale. While the results herein support one of the two cited papers much more than the other, they raise issues with both. ABBREVIATIONS Institutional Abbreviations LML Long Marine Laboratory at the University of California, Santa Cruz NHMB Natural History Museum Barcelona, Barcelona MNHN Museum national d’Histoire naturalle, Paris MSC Museo de las Salinas del Carmen, Carmen MUSMED Museo di Storia Naturale del Mediterranean, Livorno NHMW Natural History Museum Vienna, Vienna SCF Senda de los Cetáceos de Fuerteventura, Morro Jable SMNKU State Museum of Nature, Kharkiv National University, Kharkiv UZMH Finnish Museum of Natural History, Helsinki ZMUC University of Copenhagen Zoological Museum, Copenhagen Other Abbreviations Ca, caudal; GDI, graphic double integration; L, lumbar; ln, natural logarithm; NSG, neutral specific gravity; SG, specific gravity; SF, skeletal fraction; T, thoracic; WD, water displacement. PLUS/MINUS ERROR RANGES MUST BE REASONABLY NARROW TO HAVE PRACTICAL VALUE A basic, core goal of science is to narrow +/- errors to zones narrow enough to make them of practical use. For example, in chronostratigraphy, error margins can be as small as a few percent (Renne et al., 2013). Estimating the masses of organisms cannot be as precise as radiometric dating, as the mass of a given healthy adult individual can fluctuate up to 10% daily due to feeding, drinking, and defecation, and by 25% or more seasonally due to environmental and physiological factors (Paul, 1997, 2019; Lister and Stuart, 2010, 2015; Larramendi, 2016; Christiansen et al., 2018). Because the Bianucci et al. (2023) results vary fourfold for a particular individual they do not provide a mass estimate sufficiently constrained to be of practical use, and are potentially misleading. This variability is even greater than that typically seen when estimating body masses of terrestrial vertebrates from the strength of their proximal limb bones, where the +/- errors can exceed twofold. (Paul, 1997, 2019; Larramendi, 2016; Brassey, 2017; Romano et al., 2023). It also exceeds the range of estimated body masses for living cetaceans calculated via length-weight regression equations, where the real weights fall close to the regression lines and typically within the prediction intervals (Bigg and Wolman, 1975; Lockyer, 1976; Mikhalev, 2019). However, this method cannot be directly applied to extinct species. In contrast, recent volumetric modeling has an error range of about a fifth combined plus or minus in complete skeletons, quantitatively adequate for the biological purpose (Paul 1997, 2019; Larramendi, 2016; Romano et al., 2023). BIANUCCI ET AL. (2023) PROCEDURE AND REMARKS Bianucci et al. (2023) aimed to estimate the body mass of the Perucetus colossus type skeleton (MUSM 3248), which displayed an exceptionally wide range of potential masses, spanning from 85 to 341 tonnes. To achieve this, they employed a two-step approach. On one hand, they established a bivariate relationship between the dry skeletal mass and the body mass of various extant aquatic mammals, including whales and sirenians. On the other hand, they estimated the dry skeletal mass of P. colossus by relying on the scanned type skeleton of the late Eocene Cynthiacetus peruvianus (MNHN.F.PRU10) and adjusting its proportions to match those of P. colossus. As a result, they determined the skeletal mass of P. colossus, ranging from 5.3 to 7.6 tonnes, depending on the total vertebral number assumption. The lowest skeletal mass was derived assuming 12 thoracic and 15 lumbar vertebrae for Perucetus colossus, a reasonable possibility. However, the upper estimates assume a very high thoracic and lumbar number observed in Cynthiacetus peruvianus, which is highly improbable in pachyosteosclerotic species (see Uhen, 2001, Gingerich et al., 2022). The highest body mass estimate (341 tonnes) was derived by combining the highest skeletal mass estimate (7.6 tonnes) with the lowest SF (the ratio of skeletal dry mass to total body mass) from their database found in the extant cetacean Mesoplodon europaeus. On the contrary, for the lowest body mass estimate of P. colossus, they utilized the mean SF of 6.25%, which was derived from 11 adult extant Trichechus manatus sirenians (Bianucci et al., 2023, supplementary data 2). However, if one employs the most extreme SF (8.14%) found in T. manatus from the dataset, as they did for whales, the lower-end estimate for the body mass of P. colossus would have decreased to 65 tonnes. They also attempted to estimate a potential mean body mass of 180 tonnes for P. colossus, relying on the mean SF of 3.6% found in whales. Nevertheless, it is important to note that their procedures have several issues, which will be discussed in detail below. Perucetus colossus Skeleton Volume The actual volume of the skeleton of Perucetus colossus remains uncertain due to missing data. Nonetheless, Bianucci et al.’s (2023) approach, using Cynthiacetus peruvianus as a reference, is reasonable with the current available data. For instance, the mean lumbar vertebral volume of C. peruvianus is 3.29 liters (calculated from Bianucci et al., 2023, supplementary data 4), constituting 2.74% of the total vertebral column volume. On the other hand, the mean lumbar vertebral volume of P. colossus, based on the four most complete lumbar vertebrae, is 72 liters (calculated from Bianucci et al., 2023, supplementary data 4). Assuming a similar ratio between C. peruvianus and P. colossus, therefore, the vertebral column volume would be 2,628 liters. This result aligns with the estimated values for P. colossus provided by Bianucci et al. (2023), which range from 2,270 liters in their conservative model, which assumes 12 T and 15 L to 2,720 liters in their maximum estimate, which assumes 20 T and 17 L (Bianucci et al., 2023, supplementary table 22). On the other hand, they estimate a ribcage volume that should comprise from 24 to 40 ribs that falls within the range of 543 to 1,280 liters in their two P. colossus models. Although a very rough approximation, when multiplying the 16-liter posterior rib volume, which are usually smaller compared to the middle section ribs in basilosaurids (Bianucci et al., [2023], supplementary table 1) by 24, it yields 384 liters supporting their conservative model. However, the assumption of a 37 thoraco-lumbar vertebrae configuration as in C. peruvianus, for their most liberal model, very likely far exceeds the most credible vertebral number in a pachyosteosclerotic species like P. colossus (see Uhen 2001; Gingerich, 2022). Thus, their maximum estimate far surpasses the potential skeletal volume of P. colossus. Moreover, the upper estimate (1,280 liters), where the ribcage accounts for nearly half of the vertebral volume, may be excessive. Unlike P. colossus, the extant Dugong dugon, which lacks pachyostosis in its skeleton (Buffrénil et al., 2010), still exhibits notably massive ribs in comparison to its vertebral column (Figure 1I). Consequently, the ratio of rib volume to vertebral column volume is likely higher in extant sirenians than in basilosaurids, particularly with respect to pachyostotic species. According to Bianucci et al. (2023), in the skeleton SMNS-Z-MAM-1288 of D. dugon, ribs account for approximately 52% of the vertebral column volume (calculated from Bianucci et al., 2023, supplementary table 11). So, applying a similar percentage to P. colossus appears excessive. Despite that, with the current data on hand, the conservative estimation can give a good idea of the approximate skeletal volume for P. colossus; however, any result should be taken with caution. Using Extant Whales’ Dry Skeletal Mass as a Proxy to Estimate Perucetus Mass The use of derived whale skeletons to estimate the body mass of Perucetus colossus is inherently highly problematic. The morphometrics and specializations of living whales and P. colossus are widely distinct. Living whales’ skele"
