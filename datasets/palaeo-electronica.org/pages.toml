["https://palaeo-electronica.org/content/review-transition-from-pemsats-to-ojs"]
title = "Review: Transition from PEMSATS to OJS"
description = "Transition from PEMSATS to OJS"
full_description = "Article Search Review: Transition from PEMSATS to OJS Transition from PEMSATS to OJS Diana Elizabeth FernándezPE 27.3.3eOctober 2024 We would like to inform our contributors and readers that Palaeontologia Electronica is officially transitioning from using PEMSATS to the Open Journal Systems (OJS) platform for manuscript tracking. This change is part of our ongoing efforts to improve the submission and publication processes, ensuring a more streamlined and user-friendly experience for all. OJS offers a number of key advantages over the previous system: Improved user experience: OJS features an intuitive interface that simplifies manuscript submission and review processes for both authors and reviewers, reducing the time and effort needed to navigate the system. Manuscript status tracking: Authors can easily track the progress of their manuscripts throughout the submission and review process, all the way to publication. Integration with global repositories: OJS works seamlessly with indexing services and repositories, ensuring that published research is widely accessible and easy to discover. Customizable workflows: The flexibility of OJS allows the editorial team to tailor workflows to better suit the needs of the journal, optimizing efficiency in handling submissions, peer reviews, and revisions. Sustainability and scalability: The open-source nature of OJS makes it a sustainable long-term solution, with continuous updates that ensure it adapts to the evolving needs of scholarly publishing. Cost: PEMSATS was a custom-built database by our own editor, Mark Sutton. Databases are much like dogs and age at least seven years for every human year, so this one was past its prime and was ready for retirement. OJS is part of the Public Knowledge Project at Simon Fraser University, and is available free of charge, a critical factor for any journal managed and published by volunteer editors and with no fees for authors. In conjunction with this transition, the instructions for contributors have also been revised, summarized, and simplified, making it easier for authors to follow the submission guidelines. We appreciate your understanding and cooperation during this transition and are confident that OJS will enhance the efficiency and accessibility of our journal. Starting October 1st, Palaeontologia Electronica will only accept submissions through this new site (https://palaeo-electronica.org/ojs/index.php/pe/login). Thank you for your continued support."
author = "Diana Elizabeth Fernández"
year_published = 2025
clearnet = "https://palaeo-electronica.org/content/review-transition-from-pemsats-to-ojs"
