full_description = "PalArch's Journals publish three journals namely “The Journal of Archaeology of Egypt / Egyptology” “PalArch's Journal of Vertebrate Palaeontology” and “PalArch's Journal of Archaeology of Northwest Europe”. PalArch Journals are aimed at archaeologists and scientists with specific interests in advancing the development and application to all areas of archaeology, Egyptology, Palaeontology, (Functional) Morphology,Museology, Paleoecology, Paleoichnology, Phylogeny, Preparation/conservation, Taphonomy, History of science, Architecture, Art history of scientific techniques and methodologies. Focus articles, original research papers and major review articles of wide archaeological significance are published in this journal. The journals offer an international forum for scientists from a wide variety of scientific backgrounds who share a mutual interest in developing and applying scientific methods to inform major debates by enhancing the accuracy and reliability of scientific knowledge derived from archaeological research. PalArch's Journals are interested in the following papers: • Highlight groundbreaking science • Overview of studies with far-reaching applicability. • Introducing significant developments in archaeology in research methods and techniques; • Discussing issues of general interest • Shaping of global debates Journals PalArch's Journal of Archaeology of Egypt / Egyptology www.PalArch.nl accepts multidisciplinary papers with topics such as:All Fields of Management, Social Sciences, Arts, and Humanities Aerial archaeological survey, Archaeological techniques, theory etc., Education, Law, Economics, Accounting, Finance, Human Resource Management, Marketing, Architecture, Epigraphy, History of science, sociology, psychology, Morphology, Museology, Papyrology, Philology, Preparation/conservation, Religion, Underwater archaeology, English Literature, Mathematics View Journal Current Issue PalArch's Journal of Vertebrate Palaeontology Submissions are accepted on all vertebrates from all geological eras and areas. If there is doubt whether a paper can be submitted or not, please contact the responsible managing editor first.PJVP accepts papers with topics such as:•(Functional) Morphology•Museology•Paleoecology•Paleoichnology•Phylogeny•Preparation/conservation•Taphonomy Articles from Latest Issue Comments on “Ornithocheirus hilsensis” Koken, 1883 – One of the earliest dinosaur discoveries in GermanyJahn Jochen HornungNiedersächsisches Landesmuseum Hannover, Willy-Brandt-Allee 5, D-30169 Hannover, Germany View Journal Current Issue PalArch's Journal of Archaeology of Northwest Europe The Journal publishes contributions from prehistory to the Medieval Period.PJANE accepts papers with topics such as:• Aerial archaeological survey• Archaeological techniques, theory etc.• Archaeozoology, -botany• Architecture• Art history• History of science• Museology• Preparation/conservation• Underwater archaeology View Journal Current Issue"
