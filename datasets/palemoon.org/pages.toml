["https://palemoon.org/langpacks.shtml"]
title = "Pale Moon Add-ons - Language Packs"
full_description = "We are currently working as a community to bring you more languages for Pale Moon. To be informed of progress (or to help out!), please go to the following forum topic dedicated to localization. If you prefer to have the Pale Moon user interface in your native language (not US-English), then these language packs can help you! They are originally based on the Mozilla Firefox language packs, with additional translations and improvements done by our community translators for Pale Moon. Pale Moon will not be released with installers in individual languages, but installing these language packs on top of the US-English browser will pretty much have the same effect. Important: These language packs are for the latest versions of the browser. They will not work on older versions. If you are using an older version of the browser, please update to the current version first. If you for whatever reason decide you need to use an older version of the browser, please go to the archived versions page and download the appropriate language pack for your browser version. Important note: These language packs are provided AS-IS. We, the authors of the actual Pale Moon browser, are not the authors of these language packs, and cannot provide support for the actual contents of them. This is a community effort! If you have any feedback on them, please either get involved on our CrowdIn project directly or go to the forum. Can't find your language? We're sorry but these are the only languages that actually have a complete translation and have support from (near-)native speakers. We cannot support any other languages without a dedicated community translator for a language. Other languages are in the works but not complete yet. Site design and Branding © 2025 Moonchild Productions - All rights reserved Any other content, brand names or logos are copyright or trademark to their respective owners. Policies: Cookies - User Content - Privacy."
year_published = 2025
