["https://www.palemoon.org/legal.shtml"]
title = "Pale Moon legal considerations"
description = "Legal information"
full_description = '''The Pale Moon browser is open source and free software. This means that it is not only available for download free of charge, but you have access to the source code and may modify and redistribute our software subject to certain restrictions. Our source code is for the most part covered by the Mozilla Public License v2.0, but various parts and libraries included in the browser carry different licensing, and as a whole this project has a hybrid licensing model which is governed by various licenses outlined in about:license in the browser itself. Please make sure you understand the licensing involved before publishing derivative works. For more details about the Open Source nature of our code base, please read the applicable source code license. To get a complete overview of which part of this software is covered by which free software license, type about:license in the address bar. Although our source code is provided under a free software license, it is very important to note that we strictly enforce our trademark (™) rights, in order to be able to protect our users against people who use the marks to commit fraud. Our trademarks include, among others, the names Pale Moon™ and "Your Browser, Your Way"™, as well as the Pale Moon™ logo, Goanna™ name and logo, Goanna Runtime Environment™, GRE™ and other project and product names. This means that, while you have considerable freedom to redistribute and modify the software's core code, there are tight restrictions on your ability to use the names and logos in ways which fall in the domain of common trademark law, even when these trademarked names and assets are included in the source tree and built into binaries that we provide for distribution. In addition, we do use some of Mozilla's trademarks in our communication, like Mozilla's trademarks of Firefox® and XUL™. We honor and respect these trademarks to belong to their respective owners and use them to refer to specific products and technologies incorporated in, or in relation to, our work (nominative use).'''
