["https://palemoon.org/commander.shtml"]
title = "Pale Moon Commander add-on"
full_description = '''Pale Moon Commander is an extension designed for the Pale Moon web browser. It is a configurator, meaning it will provide a user-friendly interface to advanced preferences that would otherwise require manual editing of parameters, which can be cumbersome and time-consuming to do. Clicking this menu item will open the preferences window that has been added by installing the add-on. Using Pale Moon Commander to change advanced preferences is potentially dangerous and can leave your browser profile in a potentially unusable state. If you don't know what a setting is for, don't touch it. A number of the preferences made accessible through the add-on can prevent proper operation of the browser. Because all the add-on does is change preferences, you can, at all times, reset the preferences by starting Pale Moon with the SHIFT key depressed, and selecting "Reset preferences to Pale Moon defaults". Of course this will also reset any other modified preferences you may have. Using the Reset feature in the add-on itself will have a similar result. Use of this add-on is at all times at your own risk. I do not give warranty or guarantees, and it is provided "as-is" although I've done my best to make sure it works as-intended.'''
