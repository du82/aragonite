ted to discussions among maintainers. The idea is similar to the birds of a feather or unconference sessions of other conferences. But focussed on open source maintainers and contributors. And we scheduled … Read more 2019 pandas user survey Source: pandas blog | Author: pandas team | Published: Aug 22, 2019 Pandas recently conducted a user survey to help guide future development. Thanks to everyone who participated! This post presents the high-level results. This analysis and the raw data can be found on Read more GeoPandas now uses the pandas ExtensionArray interface Source: Joris Van den Bossche - pandas | Author: Joris Van den Bossche | Published: Aug 13, 2019 Short summary: the upcoming 0.6.0 release of GeoPandas will feature a refactor based on the pandas ExtensionArray interface. Although this change should keep the user interface mostly stable, it enables more robust integration with pandas and allows for more upcoming changes in the future. And given the invasive code changes under the hood, testing is very welcome! Read more pandas: The two cultures Source: datapythonista blog - pandas | Author: Marc | Published: Jul 22, 2019 Leo Breiman was a distinguished statistician at UC Berkeley, known among other things for his major contributions to CART (decision trees), and ensemble techniques, mainly bootstrap aggregation. Combining both, he was able to define one of the most popular machine learning models even today (18 years after the publication of … Read more pandas extension arrays Source: pandas blog | Author: pandas team | Published: Jan 04, 2019 Extensibility was a major theme in pandas development over the last couple of releases. This post introduces the pandas extension array interface: the motivation behind it and how it might affect you Read more Inaugural NumFOCUS Awards and New Contributor Recognition Source: pandas Archives - NumFOCUS | Author: Admin | Published: Sep 27, 2018 The post Inaugural NumFOCUS Awards and New Contributor Recognition appeared first on NumFOCUS. Read more The Worldwide Pandas Documentation Sprint: A Closer Look Source: pandas Archives - NumFOCUS | Author: Admin | Published: Mar 27, 2018 The post The Worldwide Pandas Documentation Sprint: A Closer Look appeared first on NumFOCUS. Read more #pandasSprint write-up Source: datapythonista blog - pandas | Author: Marc | Published: Mar 22, 2018 The past 10th of March took place #pandasSprint. To the best of my knowledge, an unprecedented kind of event, where around 500 people worked together in improving the documentation of the popular pandas library. As one of the people involved in the organization of the event, I wanted to write … Read more Activity on the pandas github repo during the March 10 documentation sprint Source: Joris Van den Bossche - pandas | Author: Joris Van den Bossche | Published: Mar 13, 2018 Last weekend, Marc Garcia and many others organised a world-wide pandas documentation sprint (https://python-sprints.github.io/pandas/). The goal was to improve the pandas API documentation, and I have to say, it was a great success! Read more Why pandas users should be excited about Apache Arrow Source: Wes McKinney - pandas | Author: Wes McKinney | Published: Feb 22, 2016 I'm super excited to be involved in the new open source Apache Arrow community initiative. For Python (and R, too!), it will help enable Substantially improved data access speeds Closer to native performance Python extensions for big data systems like Apache Spark New in-memory analytics functionality for nested / JSON-like data There's plenty of places you can learn more about Arrow, but this post is about how it's specifically relevant to pandas users. See, for example: "Python and Hadoop: A State of the Union" "Introducing Apache Arrow: A Fast, Interoperable In-Memory Columnar Data Structure Standard" "Introducing Apache Arrow: Columnar In-Memory Analytics" Read more NumFOCUS Announces New Fiscally Sponsored Project: pandas Source: pandas Archives - NumFOCU