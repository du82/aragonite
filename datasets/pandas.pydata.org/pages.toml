["https://pandas.pydata.org//community/blog/pandas-1.0.html"]
title = "pandas - Python Data Analysis Library"
full_description = "pandas 1.0 Today pandas celebrates its 1.0.0 release. In many ways this is just a normal release with a host of new features, performance improvements, and bug fixes, which are documented in our release notes. But it’s also something a bit more — a milestone for the project beyond just the commits. We wanted to take some time to reflect on where we've been and where we're going. Reflections The world of scientific Python has changed a lot since pandas was started. In 2011, the ecosystem was fragmented: a standard rich data structure for statistics and data science had yet to emerge. This echos a similar story for NumPy, which consolidated array efforts that were previously fragmented. Over the subsequent years, pandas emerged as a de facto standard. It’s used by data scientists and analysts and as a data structure for other libraries to build on top of. StackOverflow cited pandas as one of the reasons for Python being the fastest growing major programming language. Today, the ecosystem is in another phase of exploration. Several new DataFrame implementations are cropping up to fill needs not met by pandas. We're working with those projects to establish shared standards and semantics for rich data structures. Community and Project Health This release cycle is the first to involve any kind of grant funding for pandas. Pandas received funding as part of the CZI’s Essential Open Source Software for Science program. The pandas project relies overwhelmingly on volunteer contributors. These volunteer contributions are shepherded and augmented by some maintainers who are given time from their employers — our institutional partners. The largest work item in our grant award was library maintenance, which specifically includes working with community members to address our large backlog of open issues and pull requests. While a “1.0.0” version might seem arbitrary or anti-climactic (given that pandas as a codebase is nearly 12 years old), we see it as a symbolic milestone celebrating the growth of our core developer team and depth of our contributor base. Few open source projects are ever truly “done” and pandas is no different. We recognize the essential role that pandas now occupies, and we intend to continue to evolve the project and adapt to the needs of the world’s data wranglers. Going Forward Our roadmap contains an up-to-date listing of where we see the project heading over the next few years. Needless to say, there's still plenty to do. Check out the release notes and visit the installation page for instructions on updating to pandas 1.0."
