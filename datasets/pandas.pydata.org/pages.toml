title = "What’s new in 1.5.3 (January 18, 2023) — pandas 2.2.3 documentation"
full_description = 'What’s new in 1.5.3 (January 18, 2023)# These are the changes in pandas 1.5.3. See Release notes for a full changelog including other versions of pandas. Fixed regressions# Fixed performance regression in Series.isin() when values is empty (GH 49839) Fixed regression in DataFrame.memory_usage() showing unnecessary FutureWarning when DataFrame is empty (GH 50066) Fixed regression in DataFrameGroupBy.transform() when used with as_index=False (GH 49834) Enforced reversion of color as an alias for c and size as an alias for s in function DataFrame.plot.scatter() (GH 49732) Fixed regression in SeriesGroupBy.apply() setting a name attribute on the result if the result was a DataFrame (GH 49907) Fixed performance regression in setting with the at() indexer (GH 49771) Fixed regression in to_datetime() raising ValueError when parsing array of float containing np.nan (GH 50237) Bug fixes# Bug in the Copy-on-Write implementation losing track of views when indexing a DataFrame with another DataFrame (GH 50630) Bug in Styler.to_excel() leading to error when unrecognized border-style (e.g. "hair") provided to Excel writers (GH 48649) Bug in Series.quantile() emitting warning from NumPy when Series has only NA values (GH 50681) Bug when chaining several Styler.concat() calls, only the last styler was concatenated (GH 49207) Fixed bug when instantiating a DataFrame subclass inheriting from typing.Generic that triggered a UserWarning on python 3.11 (GH 49649) Bug in pivot_table() with NumPy 1.24 or greater when the DataFrame columns has nested elements (GH 50342) Bug in pandas.testing.assert_series_equal() (and equivalent assert_ functions) when having nested data and using numpy >= 1.25 (GH 50360) Other# Note If you are using DataFrame.to_sql(), read_sql(), read_sql_table(), or read_sql_query() with SQLAlchemy 1.4.46 or greater, you may see a sqlalchemy.exc.RemovedIn20Warning. These warnings can be safely ignored for the SQLAlchemy 1.4.x releases as pandas works toward compatibility with SQLAlchemy 2.0. Reverted deprecation (GH 45324) of behavior of Series.__getitem__() and Series.__setitem__() slicing with an integer Index; this will remain positional (GH 49612) A FutureWarning raised when attempting to set values inplace with DataFrame.loc() or DataFrame.iloc() has been changed to a DeprecationWarning (GH 48673) Contributors# A total of 19 people contributed patches to this release. People with a “+” by their names contributed a patch for the first time. Emma Carballal Haire + Irv Lustig JHM Darbyshire Joris Van den Bossche Marc Garcia Marco Edward Gorelli MarcoGorelli Matthew Roeschke MeeseeksMachine Natalia Mokeeva Pandas Development Team Patrick Hoefler Richard Shadrach Tsvika Shapira + William Ayd aneesh98 jakirkham + jbrockmendel silviaovo +'
