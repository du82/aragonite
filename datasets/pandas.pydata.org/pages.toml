["https://pandas.pydata.org/pdeps/0007-copy-on-write.html"]
title = "pandas - Python Data Analysis Library"
full_description = '''PDEP-7: Consistent copy/view semantics in pandas with Copy-on-Write Created: July 2021 Status: Implemented Discussion: #36195 Author: Joris Van den Bossche Revision: 1 Abstract Short summary of the proposal: The result of any indexing operation (subsetting a DataFrame or Series in any way, i.e. including accessing a DataFrame column as a Series) or any method returning a new DataFrame or Series, always behaves as if it were a copy in terms of user API. We implement Copy-on-Write (as implementation detail). This way, we can actually use views as much as possible under the hood, while ensuring the user API behaves as a copy. As a consequence, if you want to modify an object (DataFrame or Series), the only way to do this is to directly modify that object itself . This addresses multiple aspects: 1) a clear and consistent user API (a clear rule: any subset or returned series/dataframe always behaves as a copy of the original, and thus never modifies the original) and 2) improving performance by avoiding excessive copies (e.g. a chained method workflow would no longer return an actual data copy at each step). Because every single indexing step behaves as a copy, this also means that with this proposal, "chained assignment" (with multiple setitem steps) will never work and the SettingWithCopyWarning can be removed. Background pandas' current behavior on whether indexing returns a view or copy is confusing. Even for experienced users, it's hard to tell whether a view or copy will be returned (see below for a summary). We'd like to provide an API that is consistent and sensible about returning views vs. copies. We also care about performance. Returning views from indexing operations is faster and reduces memory usage. The same is true for several methods that don't modify the data such as setting/resetting the index, renaming columns, etc. that can be used in a method chaining workflow and currently return a new copy at each step. Finally, there are API / usability issues around views. It can be challenging to know the user's intent in operations that modify a subset of a DataFrame (column and/or row selection), like: >>> df = pd.DataFrame({"A": [1, 2], "B": [3, 4], "C": [5, 6]}) >>> df2 = df[["A", "B"]] >>> df2.loc[df2["A"] > 1, "A"] = 1 Did the user intend to modify df when they modified df2 (setting aside issues with the current implementation)? In other words, if we had a perfectly consistent world where indexing the columns always returned views or always returned a copy, does the code above imply that the user wants to mutate df? There are two possible behaviours the user might intend: Case 1: I know my subset might be a view of the original and I want to modify the original as well. Case 2: I just want to modify the subset without modifying the original. Today, pandas' inconsistency means neither of these workflows is really possible. The first is difficult, because indexing operations often (though not always) return copies, and even when a view is returned you sometimes get a SettingWithCopyWarning when mutating. The second is somewhat possible, but requires many defensive copies (to avoid SettingWithCopyWarning, or to ensure that you have a copy when a view was returned). Proposal For these reasons (consistency, performance, code clarity), this PDEP proposes the following changes: The result of any indexing operation (subsetting a DataFrame or Series in any way, i.e. including accessing a DataFrame column as a Series) or any method returning a new DataFrame or Series, always behaves as if it were a copy in terms of user API. We implement Copy-on-Write. This way, we can actually use views as much as possible under the hood, while ensuring the user API behaves as a copy. The intent is to capture the performance benefits of views as much as possible, while providing consistent and clear behaviour to the user. This essentially makes returning views an internal optimization, without the user needing to know if the specific indexing operation would return a view or a copy. The new rule would be simple: any series/dataframe derived from another series/dataframe, through an indexing operation or a method, always behaves as a copy of the original series/dataframe. The mechanism to ensure this consistent behaviour, Copy-on-Write, would entail the following: the setitem operation (i.e. df[..] = .. or df.loc[..] = .. or df.iloc[..] = .., or equivalent for Series) would check if the data that is being modified is a view on another dataframe (or is being viewed by another dataframe). If it is, then we would copy the data before mutating. Taking the example from above, if the user wishes to not mutate the parent, we no longer require a defensive copy just to avoid a SettingWithCopyWarning. # Case 2: The user does not want mutating df2 to mutate the parent df, via CoW >>> df = pd.DataFrame({"A": [1, 2], "B": [3, 4], "C": [5, 6]}) >>> df2 = df[["A", "B"]] >>> df2.loc[df2["A"] > 1, "A"] = 1 >>> df.iloc[1, 0] # df was not mutated 2 On the other hand, if the user actually wants to modify the original df, they can no longer rely on the fact that df2 could be a view, as mutating a subset would now never mutate the parent. The only way to modify the original df is by combining all indexing steps in a single indexing operation on the original (no "chained" setitem): # Case 1: user wants mutations of df2 to be reflected in df -> no longer possible >>> df = pd.DataFrame({"A": [1, 2], "B": [3, 4], "C": [5, 6]}) >>> df2 = df[["A", "B"]] >>> df2.loc[df2["A"] > 1, "A"] = 1 # mutating df2 will not mutate df >>> df.loc[df["A"] > 1, "A"] = 1 # need to directly mutate df instead This proposal also extends to methods In principle, there's nothing special about indexing when it comes to defensive copying. Any method that returns a new series/dataframe without altering existing data (rename, set_index, assign, dropping columns, etc.) currently returns a copy by default and is a candidate for returning a view: >>> df2 = df.rename(columns=str.lower) >>> df3 = df2.set_index("a") Now, generally, pandas users won't expect df2 or df3 to be a view such that mutating df2 or df3 would mutate df. Copy-on-Write allows us to also avoid unnecessary copies in methods such as the above (or in the variant using method chaining like df.rename(columns=str.lower).set_index("a")). Propagating mutation forwards Thus far we have considered the (more common) case of taking a subset, mutating the subset, and how that should affect the parent. What about the other direction, where the parent is mutated? >>> df = pd.DataFrame({"A": [1, 2], "B": [3, 4]}) >>> df2 = df[["A"]] >>> df.iloc[0, 0] = 10 >>> df2.iloc[0, 0] # what is this value? Given that df2 is considered as a copy of df under this proposal (i.e. behaves as a copy), also mutating the parent df will not mutate the subset df2. When do mutations propagate to other objects and when not? This proposal basically means that mutations never propagate to other objects (as would happen with views). The only way to modify a DataFrame or Series is to modify the object itself directly. But let's illustrate this in Python terms. Consider that we have a DataFrame df1, and we assign that to another name df2: >>> df1 = pd.DataFrame({"A": [1, 2], "B": [3, 4]}) >>> df2 = df1 Although we have now two variables (df1 and df2), this assignment follows the standard python semantics, and both names are pointing to the same object ("df1 and df2 are identical"): >>> id(df1) == id(df2) # or: df1 is df2 True Thus, if you modify DataFrame df2, this is also reflected in the other variable df1, and the other way around (since it's the same object): >>> df1.iloc[0, 0] 1 >>> df2.iloc[0, 0] = 10 >>> df1.iloc[0, 0] 10 In summary, modifications are only "propagated" between identical objects (not just equal (==), but identical (is) in python terms, see docs). Propagation is not really the proper term, since there is only one object that was modified. However, when in some way creating a new object (even though it might be a DataFrame with the same data, and thus be an "equal" DataFrame): >>> df1 = pd.DataFrame({"A": [1, 2], "B": [3, 4]}) >>> df2 = df1[:] # or df1.loc[...] with some indexer Those objects are no longer identical: >>> id(df1) == id(df2) # or df1 is df2 False And thus modifications to one will not propagate to the other: >>> df1.iloc[0, 0] 1 >>> df2.iloc[0, 0] = 10 >>> df1.iloc[0, 0] # not changed 1 Currently, any getitem indexing operation returns new objects, and also almost all DataFrame/Series methods return a new object (except with inplace=True in some cases), and thus follow the above logic of never modifying its parent/child DataFrame or Series (using the lazy Copy-on-Write mechanism where possible). Copy / view behaviour in NumPy versus pandas NumPy has the concept of "views" (an array that shares data with another array, viewing the same memory, see e.g. this explanation for more details). Typically you create views as a slice of another array. But other indexing methods, often called "fancy indexing", do not return views but copies: using a list of indices or a boolean mask. Pandas, being built on NumPy, uses those concepts, and also exposes the behaviour consequences to its users. This basically means that pandas users, to understand the details of how indexing works, also need to understand those view / fancy indexing concepts of numpy. However, because DataFrames are not an array, the copy/view rules still differ from NumPy's rules with current pandas. Slicing rows generally gives a view (following NumPy), but slicing columns doesn't always give a view (this could be changed to match NumPy however, see "Alternatives" 1b below). Fancy indexing rows (e.g. with a list of (positional) labels) gives a copy, but fancy indexing columns could give a view (currently this gives a copy as well, but one of the "Alternatives" (1b) is to have this always return a view). The proposal in this document is to decouple the pandas user-facing behaviour from those NumPy concepts. Creating a subset of a DataFrame with a slice or with a mask would behave in a similar way for the user (both return a new object and behave as a copy of the original). We still use the concept of views internally in pandas to optimize the implementation, but this becomes hidden from the user. Alternatives The original document and GitHub issue (Proposal for future copy / view semantics in indexing operations - #36195) discussed several options for making the copy/view situation more consistent and clear: Well-Defined copy/view rules: ensure we have more consistent rules about which operations result in a copy and which in a view, and then views result in mutating the parent, copies not. a. A minimal change would be to officialize the current behaviour. This comes down to fixing some bugs and clearly documenting and testing which operations are views, and which are copies. b. An alternative would be to simplify the set of rules. For example: selecting columns is always a view, subsetting rows is always a copy. Or: selecting columns is always a view, subsetting rows as a slice is a view otherwise always a copy. Copy-on-Write: The setitem operation would check if it's a view on another dataframe. If it is, then we would copy our data before mutating. (i.e. this proposal) Error-on-Write: The setitem operation would check if it's a subset of another dataframe (both view of copy). Only rather than copying in case of a view we would raise an exception telling the user to either copy the data with .copy_if_needed() (name TBD) or mark the frame as "a mutable view" with .as_mutable_view() (name TBD). This document basically proposes an extended version of option 2 (Copy-on-Write). Some arguments in favor of Copy-on-Write compared to the other options: Copy-on-Write will improve the copy/view efficiency of methods (e.g. rename, (re)set_index, drop columns, etc. See section above). This will result in lower memory usage and better performance. This proposal can also be seen as a clear "well-defined rule". Using Copy-on-Write under the hood is an implementation detail to delay the actual copy until it is needed. The rule of "always copy" is the simplest "well-defined rule" we can get. Other "well-defined rule" ideas above would always include some specific cases (and deviations from the NumPy rules). And even with clear rules a user still needs to know the details of those rules to understand that df['a'][df['b'] < 0] = 0 or df[df['b'] < 0]['a'] = 0 does something differently (switched order of column/row indexing: the first mutates df (if selecting a column is a view) and the second doesn't). While with the "always copy" rule with Copy-on-Write, neither of those examples will work to update df. On the other hand, the proposal in this document does not give the user control over whether a subset should be a view (when possible) that mutates the parent when being mutated. The only way to modify the parent dataframe is with a direct indexing operation on this dataframe itself. See the GitHub comment with some more detailed argumentation: https://github.com/pandas-dev/pandas/issues/36195#issuecomment-786654449 Disadvantages Other than the fact that this proposal would result in a backwards incompatible, breaking change in behaviour (see next section), there are some other potential disadvantages: Deviation from NumPy: NumPy uses the copy and view concepts, while in this proposal views would basically not exist anymore in pandas (for the user, at least; we would still use it internally as an implementation detail) But as a counter argument: many pandas users are probably not familiar with those concepts, and pandas already deviates from the exact rules in NumPy. Performance cost of indexing and methods becomes harder to predict: because the copy of the data doesn't happen at the moment when actually creating the new object, but can happen at a later stage when modifying either the parent or child object, it becomes less transparent about when pandas copies data (but in general we should copy less often). This is somewhat mitigated because Copy-on-Write will only copy the columns that are mutated. Unrelated columns won't get copied. Increased memory usage for some use cases: while the majority of use cases will see an improvement in memory usage with this proposal, there are a few use cases where this might not be the case. Specifically in cases where pandas currently does return a view (e.g. slicing rows) and in the case you are fine with (or don't care about) the current behaviour of it being a view when mutating that subset (i.e. mutating the sliced subset also mutates the parent dataframe), in such a case the proposal would introduce a new copy compared to the current behaviour. There is a workaround for this though: the copy is not needed if the previous object goes out of scope, e.g. the variable is reassigned to something else. Backward compatibility The proposal in this docum'''
