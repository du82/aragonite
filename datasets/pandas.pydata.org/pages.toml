title = "Contributing to the code base — pandas 3.0.0.dev0+1979.g57fd50221e documentation"
full_description = '''Contributing to the code base# Table of Contents: Code standards Pre-commit Optional dependencies Backwards compatibility Type hints Style guidelines pandas-specific types Validating type hints Testing type hints in code using pandas Testing with continuous integration Test-driven development Writing tests Using pytest Test structure Preferred pytest idioms Testing a warning Testing an exception Testing involving files Testing involving network connectivity Example Using hypothesis Running the test suite Running the performance test suite Documenting your code Code standards# Writing good code is not just about what you write. It is also about how you write it. During Continuous Integration testing, several tools will be run to check your code for stylistic errors. Generating any warnings will cause the test to fail. Thus, good style is a requirement for submitting code to pandas. There are a couple of tools in pandas to help contributors verify their changes before contributing to the project ./ci/code_checks.sh: a script validates the doctests, formatting in docstrings, and imported modules. It is possible to run the checks independently by using the parameters docstrings, code, and doctests (e.g. ./ci/code_checks.sh doctests); pre-commit, which we go into detail on in the next section. In addition, because a lot of people use our library, it is important that we do not make sudden changes to the code that could have the potential to break a lot of user code as a result, that is, we need it to be as backwards compatible as possible to avoid mass breakages. Pre-commit# Additionally, Continuous Integration will run code formatting checks like ruff, isort, and clang-format and more using pre-commit hooks. Any warnings from these checks will cause the Continuous Integration to fail; therefore, it is helpful to run the check yourself before submitting code. This can be done by installing pre-commit (which should already have happened if you followed the instructions in Setting up your development environment) and then running: pre-commit install from the root of the pandas repository. Now all of the styling checks will be run each time you commit changes without your needing to run each one manually. In addition, using pre-commit will also allow you to more easily remain up-to-date with our code checks as they change. Note that if needed, you can skip these checks with git commit --no-verify. If you don’t want to use pre-commit as part of your workflow, you can still use it to run its checks with one of the following: pre-commit run --files <files you have modified> pre-commit run --from-ref=upstream/main --to-ref=HEAD --all-files without needing to have done pre-commit install beforehand. Finally, we also have some slow pre-commit checks, which don’t run on each commit but which do run during continuous integration. You can trigger them manually with: pre-commit run --hook-stage manual --all-files Note You may want to periodically run pre-commit gc, to clean up repos which are no longer used. Note If you have conflicting installations of virtualenv, then you may get an error - see here. Also, due to a bug in virtualenv, you may run into issues if you’re using conda. To solve this, you can downgrade virtualenv to version 20.0.33. Note If you have recently merged in main from the upstream branch, some of the dependencies used by pre-commit may have changed. Make sure to update your development environment. Optional dependencies# Optional dependencies (e.g. matplotlib) should be imported with the private helper pandas.compat._optional.import_optional_dependency. This ensures a consistent error message when the dependency is not met. All methods using an optional dependency should include a test asserting that an ImportError is raised when the optional dependency is not found. This test should be skipped if the library is present. All optional dependencies should be documented in Optional dependencies and the minimum required version should be set in the pandas.compat._optional.VERSIONS dict. Backwards compatibility# Please try to maintain backward compatibility. pandas has lots of users with lots of existing code, so don’t break it if at all possible. If you think breakage is required, clearly state why as part of the pull request. Also, be careful when changing method signatures and add deprecation warnings where needed. Also, add the deprecated sphinx directive to the deprecated functions or methods. If a function with the same arguments as the one being deprecated exist, you can use the pandas.util._decorators.deprecate: from pandas.util._decorators import deprecate deprecate('old_func', 'new_func', '1.1.0') Otherwise, you need to do it manually: import warnings from pandas.util._exceptions import find_stack_level def old_func(): """Summary of the function. .. deprecated:: 1.1.0 Use new_func instead. """ warnings.warn( 'Use new_func instead.', FutureWarning, stacklevel=find_stack_level(), ) new_func() def new_func(): pass You’ll also need to Write a new test that asserts a warning is issued when calling with the deprecated argument Update all of pandas existing tests and code to use the new argument See Testing a warning for more. Type hints# pandas strongly encourages the use of PEP 484 style type hints. New development should contain type hints and pull requests to annotate existing code are accepted as well! Style guidelines# Type imports should follow the from typing import ... convention. Your code may be automatically re-written to use some modern constructs (e.g. using the built-in list instead of typing.List) by the pre-commit checks. In some cases in the code base classes may define class variables that shadow builtins. This causes an issue as described in Mypy 1775. The defensive solution here is to create an unambiguous alias of the builtin and use that without your annotation. For example, if you come across a definition like class SomeClass1: str = None The appropriate way to annotate this would be as follows str_type = str class SomeClass2: str: str_type = None In some cases you may be tempted to use cast from the typing module when you know better than the analyzer. This occurs particularly when using custom inference functions. For example from typing import cast from pandas.core.dtypes.common import is_number def cannot_infer_bad(obj: Union[str, int, float]): if is_number(obj): ... else: # Reasonably only str objects would reach this but... obj = cast(str, obj) # Mypy complains without this! return obj.upper() The limitation here is that while a human can reasonably understand that is_number would catch the int and float types mypy cannot make that same inference just yet (see mypy #5206). While the above works, the use of cast is strongly discouraged. Where applicable a refactor of the code to appease static analysis is preferable def cannot_infer_good(obj: Union[str, int, float]): if isinstance(obj, str): return obj.upper() else: ... With custom types and inference this is not always possible so exceptions are made, but every effort should be exhausted to avoid cast before going down such paths. pandas-specific types# Commonly used types specific to pandas will appear in pandas._typing and you should use these where applicable. This module is private for now but ultimately this should be exposed to third party libraries who want to implement type checking against pandas. For example, quite a few functions in pandas accept a dtype argument. This can be expressed as a string like "object", a numpy.dtype like np.int64 or even a pandas ExtensionDtype like pd.CategoricalDtype. Rather than burden the user with having to constantly annotate all of those options, this can simply be imported and reused from the pandas._typing module from pandas._typing import Dtype def as_type(dtype: Dtype) -> ...: ... This module will ultimately house types for repeatedly used concepts like “path-like”, “array-like”, “numeric”, etc… and can also hold aliases for commonly appearing parameters like axis. Development of this module is active so be sure to refer to the source for the most up to date list of available types. Validating type hints# pandas uses mypy and pyright to statically analyze the code base and type hints. After making any change you can ensure your type hints are consistent by running pre-commit run --hook-stage manual --all-files mypy pre-commit run --hook-stage manual --all-files pyright pre-commit run --hook-stage manual --all-files pyright_reportGeneralTypeIssues # the following might fail if the installed pandas version does not correspond to your local git version pre-commit run --hook-stage manual --all-files stubtest in your python environment. Warning Please be aware that the above commands will use the current python environment. If your python packages are older/newer than those installed by the pandas CI, the above commands might fail. This is often the case when the mypy or numpy versions do not match. Please see how to setup the python environment or select a recently succeeded workflow, select the “Docstring validation, typing, and other manual pre-commit hooks” job, then click on “Set up Conda” and “Environment info” to see which versions the pandas CI installs. Testing type hints in code using pandas# Warning pandas is not yet a py.typed library (PEP 561)! The primary purpose of locally declaring pandas as a py.typed library is to test and improve the pandas-builtin type annotations. Until pandas becomes a py.typed library, it is possible to easily experiment with the type annotations shipped with pandas by creating an empty file named “py.typed” in the pandas installation folder: python -c "import pandas; import pathlib; (pathlib.Path(pandas.__path__[0]) / 'py.typed').touch()" The existence of the py.typed file signals to type checkers that pandas is already a py.typed library. This makes type checkers aware of the type annotations shipped with pandas. Testing with continuous integration# The pandas test suite will run automatically on GitHub Actions continuous integration services, once your pull request is submitted. However, if you wish to run the test suite on a branch prior to submitting the pull request, then the continuous integration services need to be hooked to your GitHub repository. Instructions are here for GitHub Actions. A pull-request will be considered for merging when you have an all ‘green’ build. If any tests are failing, then you will get a red ‘X’, where you can click through to see the individual failed tests. This is an example of a green build. Test-driven development# pandas is serious about testing and strongly encourages contributors to embrace test-driven development (TDD). This development process “relies on the repetition of a very short development cycle: first the developer writes an (initially failing) automated test case that defines a desired improvement or new function, then produces the minimum amount of code to pass that test.” So, before actually writing any code, you should write your tests. Often the test can be taken from the original GitHub issue. However, it is always worth considering additional use cases and writing corresponding tests. We use code coverage to help understand the amount of code which is covered by a test. We recommend striving to ensure code you add or change within Pandas is covered by a test. Please see our code coverage dashboard through Codecov for more information. Adding tests is one of the most common requests after code is pushed to pandas. Therefore, it is worth getting in the habit of writing tests ahead of time so this is never an issue. Writing tests# All tests should go into the tests subdirectory of the specific package. This folder contains many current examples of tests, and we suggest looking to these for inspiration. As a general tip, you can use the search functionality in your integrated development environment (IDE) or the git grep command in a terminal to find test files in which the method is called. If you are unsure of the best location to put your test, take your best guess, but note that reviewers may request that you move the test to a different location. To use git grep, you can run the following command in a terminal: git grep "function_name(" This will search through all files in your repository for the text function_name(. This can be a useful way to quickly locate the function in the codebase and determine the best location to add a test for it. Ideally, there should be one, and only one, obvious place for a test to reside. Until we reach that ideal, these are some rules of thumb for where a test should be located. Does your test depend only on code in pd._libs.tslibs? This test likely belongs in one of: tests.tslibs Note No file in tests.tslibs should import from any pandas modules outside of pd._libs.tslibs tests.scalar tests.tseries.offsets Does your test depend only on code in pd._libs? This test likely belongs in one of: tests.libs tests.groupby.test_libgroupby Is your test for an arithmetic or comparison method? This test likely belongs in one of: tests.arithmetic Note These are intended for tests that can be shared to test the behavior of DataFrame/Series/Index/ExtensionArray using the box_with_array fixture. tests.frame.test_arithmetic tests.series.test_arithmetic Is your test for a reduction method (min, max, sum, prod, …)? This test likely belongs in one of: tests.reductions Note These are intended for tests that can be shared to test the behavior of DataFrame/Series/Index/ExtensionArray. tests.frame.test_reductions tests.series.test_reductions tests.test_nanops Is your test for an indexing method? This is the most difficult case for deciding where a test belongs, because there are many of these tests, and many of them test more than one method (e.g. both Series.__getitem__ and Series.loc.__getitem__) Is the test specifically testing an Index method (e.g. Index.get_loc, Index.get_indexer)? This test likely belongs in one of: tests.indexes.test_indexing tests.indexes.fooindex.test_indexing Within that files there should be a method-specific test class e.g. TestGetLoc. In most cases, neither Series nor DataFrame objects should be needed in these tests. Is the test for a Series or DataFrame indexing method other than __getitem__ or __setitem__, e.g. xs, where, take, mask, lookup, or insert? This test likely belongs in one of: tests.frame.indexing.test_methodname tests.series.indexing.test_methodname Is the test for any of loc, iloc, at, or iat? This test likely belongs in one of: tests.indexing.test_loc tests.indexing.test_iloc tests.indexing.test_at tests.indexing.test_iat Within the appropriate file, test classes correspond to either types of indexers (e.g. TestLocBooleanMask) or major use cases (e.g. TestLocSetitemWithExpansion). See the note in section D) about tests that test multiple indexing methods. Is the test for Series.__getitem__, Series.__setitem__, DataFrame.__getitem_'''
