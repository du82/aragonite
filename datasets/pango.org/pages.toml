title = "The GTK Project - A free and open-source cross-platform widget toolkit"
description = "GTK is a free and open-source cross-platform widget toolkit for creating graphical user interfaces."
full_description = "PangoPango is a library for laying out and rendering of text, with an emphasis on internationalization. Pango can be used anywhere that text layout is needed, though most of the work on Pango so far has been done in the context of the GTK widget toolkit. Pango forms the core of text and font handling for GTK.The name comes from the Greek Παν (“Pan”), meaning “all”, and the Japanese 語 (“Go”), meaning “language”.FeaturesPango is designed to be modular; the core Pango layout engine can be used with different font backends. There are three basic backends, with multiple options for rendering with each:Client side fonts using the FreeType and fontconfig libraries. Rendering can be with Cairo or Xft libraries, or directly to an in-memory buffer with no additional libraries.Native fonts on Microsoft Windows. Rendering can be done via Cairo or directly using the native Win32 API.Native fonts on MacOS X, rendering via Cairo.As well as the low-level layout rendering routines, Pango includes PangoLayout, a high-level driver for laying out entire blocks of text, and routines to assist in editing internationalized text.Complex-text support is provided by HarfBuzz, on all platforms.The integration of Pango with Cairo provides a complete solution with high quality text handling and graphics rendering.DocumentationAPI reference for PangoAPI reference for Cairo integrationAPI reference for FreeType2 integrationAPI reference for Fontconfig integrationPango markup documentationSourcesThe Pango source is available on GNOME’s GitLab instance at: https://gitlab.gnome.org/GNOME/pangoYou can download the release archives from: https://download.gnome.org/sources/pangoReporting issuesIf you have an issue using Pango, open a topic on GNOME’s Discourse instance under the “pango” tag.You can report bugs on the project’s GitLab issue tracker."
author = "The GTK Team"
year_published = 2025
clearnet = "https://pango.org"
