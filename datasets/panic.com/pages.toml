["https://panic.com/sync"]
title = "Panic Sync"
full_description = "Not all Panic apps are available in the App Store, which means no iCloud. And the type of data Panic syncs doesn’t lend itself well to Dropbox or file sync solutions. We wrote our own sync server out of necessity—to give you the best sync experience possible. There’s a lot we can do now that we couldn’t do before. We can sync data across applications. We can give you access to your data and control the authorization of devices. And since we control both sides of the equation, we can troubleshoot problems much more effectively. No system is perfect, and if somebody tells you their server is hacker-proof, they're a charlatan. On the other hand, security through obscurity is not security. So we're here to tell you, in absolute detail, how we designed and built Panic Sync. We want you to be able to make a truly informed decision on if it meets your standards. With the release of Transmit 5, all Panic apps support Panic Sync. (Legacy support varies, so check here for details.) Note: While Nova, Transmit, Coda, and their iOS counterparts share sync data, Prompt 2 currently only shares sync data with other copies of Prompt 2. Learn more about sync data types — and other Panic Sync topics — at Panic Help."
year_published = 2025
