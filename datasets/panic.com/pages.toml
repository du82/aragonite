title = "Panic Jobs"
description = "Panic is seeking someone who can bring their python software development experience to potentially all three of these areas! You would be responsible for contributing to and maintaining our growing flock of Flask and Django web applications."
full_description = "We love creating amazing products in a fulfilling and positive way. Do you? Located in beautiful, rainy, extremely beautiful Portland, Oregon, we're an independent software company with about 30 employees and a lot going on. Founded in 1997 as a fully self-funded, independent, and sustainable business, our award-winning macOS and iOS apps, thoughtful games, and a brand new game platform are loved by users around the world. Our product philosophy: to create absolute best-of-class applications and tools that people need to use every day, and to experiment with new and uncertain ideas that can generate inspiration. Balancing both keeps our work interesting. We currently ship a very powerful web development IDE for macOS; Prompt, a wonderful SSH client for iOS, macOS, and visionOS; and Transmit, the most powerful app for transferring files on macOS. We also publish video games — Firewatch in 2016, Untitled Goose Game in 2019, and Thank Goodness You're Here! in 2024, and many others. On top of all that, we make a handheld video game console called Playdate. Employee Benefits In addition to base salary, we offer all employees: Flexible vacation policy Guideline 401(k) plan with non-elective 8% contribution (we contribute 8% of your salary to your 401(k) regardless of how much you choose to contribute individually) Comprehensive medical, dental, vision, life, and long-term disability insurance Health Savings Account fully-funded employee portion with monthly company contributions, OR a PPO plan Reasonable, life-compatible hours Paid parental leave Free office gym access and once-a-week off site fitness training session We're located in Portland, Oregon, and are hiring only for in-person positions. Inclusion & Diversity Yes!! We still believe in DEI. Today, our team (and often our industry) is missing the voices of a lot of people who could make our wonderful apps even better. We want that to change. We want to broaden our team to include folks whose diverse backgrounds and experiences will inspire and guide our products to new heights. We highly encourage women, people of color, and other resilient populations to apply for our open positions. We work hard to foster an environment at Panic that empowers individuality, empathy, and innovation, and we’re looking forward to what you’ll bring to the table. Encouragement If you read our job posting qualifications, and feel like you’re really, really close to hitting them all, but you’re missing one — or maybe you aren’t super confident or are prone to imposter syndrome and a voice is telling you to walk away — please consider pushing through and applying. None of us here are perfect geniuses or have it together 100% — we’re all just doing the best job we can, and we’re confident you can do that too. In fact studies show that women, people of color, and other resilient populations are less likely to apply if they don’t think they meet all requirements. Panic values these candidates and we want everyone who applies to be successful! Reach out if you have any questions! Current Openings Jr. Web Services Engineer Panic is seeking someone who can bring their python software development experience to potentially all three of these areas! You would be responsible for contributing to and maintaining our growing flock of Flask and Django web applications. This posting will remain open until filled. Apply Now Internships We are currently only accepting internship applications via The Script."
