title = "Panic Sync"
full_description = "Panic製品で取り扱うデータを複数のデバイスとAppで同期するためのもっとも簡単でセキュアな方法。 すべてのPanic製品がApp Storeで利用可能、という訳ではありません。すなわちそのような製品はiCloudが利用できません。またいくつかの製品で取り扱うデータはDropboxなどで同期するのに不向きです。よって私たちは、私たち自身で考えうるベストな同期機能を提供しようと考えました。 それにより、今までできなかったことをご提供できるようになりました。例えば、アプリケーションを跨いだデータの同期。認証されたデバイス間でのあなたのデータ同期を可能にします。さらにサーバ、デバイス両面からメンテナンスできるため、もしもの時も瞬時に対応致します。 ここではPanic Syncがどのようにデータを処理しているかについて、技術的な情報をお知らせします。 派生キーはユーザデバイスから送信されません。ユーザがデバイスを新たに追加した際、新しいデバイス上で同じ方式およびマスターパスワードを用い再生成します。 その他、より詳しい解説やよくある質問と回答をライブラリに準備しております: Panic Sync: よくある質問と回答 Transmit 5がリリースされたことにより、すべてのPanic製アプリがPanic Syncをサポートしています。（より詳しいサポート状況は、ライブラリ: Panic Sync必要環境をご参照ください。） 注意: CodaおよびTransmitについては相互にそれぞれのデータを共有することが可能です。一方、現在のPrompt 2は他のアプリとデータは共有されません。より詳しくは、ライブラリ: 同期されるデータの種類についてをご参照ください。また合わせて、ライブラリ内のPanic Syncに関するトピック一覧もご参照ください。"
