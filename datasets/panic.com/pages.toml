title = "Prompt 3"
description = "The best SSH app for iOS and macOS."
full_description = '''It’s the terminal app that aims to please. Reboot some servers while surfing. Quickly tweak a website at your desk. It’s lovely, fast, and eager to save the day the moment you need it. That’s why we call it Prompt. A beloved iOS app since 2011, Prompt 2 had 4,131 reviews and a ★★★★★ App Store rating from happy users. We hope you’ll join them and enjoy the zippy and powerful Prompt 3. Watch Our Nice Promotional Video! New Features Are Waiting For You! Mac & iOS. When you buy Prompt, you’ll get both the mobile and desktop apps. No joke. We give you two apps for the price of one! The Mac version even supports local shells Superfast SSH. We retooled the text engine in Prompt 3 so your scrolling and terminal emulation speeds are up to 10x faster. You can even enable optional GPU acceleration! MOSH & ETERNAL TERMINAL. Use these two new connection types for mega-stable terminals even if your network connection is garbage Clips. Quickly insert your most frequently used commands and text snippets with a tap or a click. Even sync them between devices Customizable. Make Prompt perfect with new themes, fonts, and a very configurable iOS Keyboard that makes touchscreen typing fun PANIC SYNC. Easily sync your servers, keys and passwords on any device running Prompt on Mac or iOS. It's free, secure, and easy MORE SECURITY. Encrypt your favorites with FaceID/TouchID and the secure enclave. Use YubiKey devices for easy two-factor safety JUMP HOSTS. Access corporate servers while still maintaining corporate security. Be a hero and fix the server, even at the beach IMPROVED EMULATION. Complex terminal tasks like tmux, which demand accurate emulation and speed, now render even more accurately MOUSE SUPPORT. That’s a thing? Really. Use your mouse to interact with TUI-based apps running through the terminal. Mousetastic! AND YES, A DARK ICON. What more can we say Some Nice Screenshots to Look At! Need Help With Prompt? We’re Here. <div class="email-link" class="hardwrapped"> <a href="mailto:prompt@panic.com?subject=Question%20about%20Prompt%203"> prompt@panic.com </a> </div> Category Question Problem Report Feature Request Other Subject How can we help? Your Name Your Email Attach a file... Include diagnostic data Prompt Version macOS Version'''
