title = "Διπλή διάκριση για το Papaki στα e-volution awards 2019! - Papaki Blog"
description = "Ένα Gold και ενα Bronze βραβείο στα φετινά e-volution Awards, που για 8η χρονιά επιβράβευσαν τις βέλτιστες πρακτικές στο ηλεκτρονικό εμπόριο και επιχειρείν!"
full_description = "Νέα! 14 Δεκεμβρίου 2018, από Marieta Christopoulou Μοιράσου το Την Τετάρτη 12 Δεκεμβρίου είχαμε γιορτή! Κλείσαμε εισιτήρια, βάλαμε τα καλά μας και δώσαμε ραντεβού στο Athenaeum InterContinental, για να παρακολουθήσουμε από κοντά τα e-volution awards, τη διοργάνωση που επιβραβεύει τις βέλτιστες πρακτικές στο ηλεκτρονικό εμπόριο και επιχειρείν. Δεν γινόταν να λείπουμε, γιατί φυσικά είχαμε θέσει κι εμείς υποψηφιότητες! Περισσότερα από 500 υψηλόβαθμα στελέχη της αγοράς παρευρέθηκαν στην τελετή απονομής! Ο παρουσιαστής των βραβείων Παναγιώτης Χατζηδάκης μας καλωσόρισε λίγο μετά τις 8 μ.μ. και ο Πρόεδρος της Κριτικής Επιτροπής καθ. Γεώργιος Δουκίδης, Διευθυντής του Εργαστηρίου Ηλεκτρονικού Εμπορίου ELTRUN του Οικονομικού Πανεπιστημίου Αθηνών, ανέβηκε στη σκηνή για να μας γνωστοποιήσει μεταξύ άλλων ότι φέτος η διοργάνωση κατέγραψε ρεκόρ συμμετοχών! Επίσης, όπως ανέφερε ο κ. Δουκίδης, είχε την πολυπληθέστερη Κριτική Επιτροπή στην ιστορία της, αποτελούμενη από 30 μέλη! Πώς τα πήγαμε λοιπόν με τέτοιο συναγωνισμό και πώς μας αξιολόγησε αυτή η επιτροπή; Η αγωνία μας ήταν μεγάλη και η χαρά μας ακόμα μεγαλύτερη όταν στη λήξη της διοργάνωσης βρισκόντουσαν στο τραπέζι μας δύο βραβεία: Ένα Gold, στην κατηγορία Best in B2B της ενότητας Ηλεκτρονικό Εμπόριο & Επιχειρείν και ένα Bronze, στην κατηγορία Υπηρεσίες & Υποδομές Ηλεκτρονικού Επιχειρείν με το Μanaged WooCommerce! Best in B2B Στη σκηνή παραλαμβάνοντας το Gold από τον κ. Μιχάλη Μωραΐτη To πρώτο βραβείο που παραλάβαμε, μαζί με το αδερφάκι μας την ΤοpHost υπό την ομπρέλα της Enartia, ήταν για την ευρεία γκάμα λύσεων που προσφέρουμε σε όλες τις επιχειρήσεις που επιθυμούν να έχουν online παρουσία. Δηλαδή: Mεταπώληση domain names από επιχειρήσεις με online δραστηριότητα. Μεταπωλητής του Papaki μπορεί να γίνει κάθε επαγγελματίας που ασχολείται με το το web design, την κατασκευή ιστοσελίδων, το online marketing, κλπ. Λαμβάνει από το Papaki ένα σύνολο εργαλείων τα οποία μπορεί να ενσωματώσει στο website του για να παρέχει με τη σειρά του άμεση-online δυνατότητα κατοχύρωσης domain name! Corporate Domain Names υπηρεσίες του Papaki, που απευθύνονται σε μεγάλους οργανισμούς, με ευρύ portfolio domain names που έχουν υψηλές ανάγκες διαχείρισης. Ολοκληρωμένες λύσεις για κάθε μικρή επιχείρηση που επιθυμεί να έχει μία απλή online παρουσία μέσα από το website της, είτε μιλάμε για ένα eShop ή για ειδησεογραφικό portal. Στο Papaki κάθε επιχείρηση έχει τη δυνατότητα να επιλέξει μόνη της, online, τη λύση που ανταποκρίνεται στις ανάγκες της. Από τη στιγμή της επιλογής, η ενεργοποίηση γίνεται άμεσα από εμάς (πολύ άμεσα!), ενώ φυσικά το τμήμα εξυπηρέτησής μας είναι διαθέσιμο για ό,τι σχετικό χρειαστεί! “Αυτό το βραβείο ανήκει σε πάνω από 70 άτομα και την κουλτούρα τους. Είμαι σίγουρος ότι θα μας δώσει δύναμη να προσφέρουμε ακόμα μεγαλύτερο value στους πελάτες μας”, ανέφερε ο Φρανκ Μαούνης, Πρόεδρος και Co-Founder της Enartia, παραλαμβάνοντας αυτή τη χρυσή επιβράβευση! Bronze για το Managed WooCommerce Τα βραβεία μας! Μετά τις ομαδικές φωτογραφίες, βρεθήκαμε και πάλι στη ροτόντα μας, και απολαύσαμε το βραβείο μας με πολλά χαμόγελα και κλικ. Συνεχίσαμε να παρακολουθούμε τις βραβεύσεις των σημαντικότερων e-shops και e-agencies της χώρας, μέχρι που κληθήκαμε και πάλι στη σκηνή! Αυτή τη φορά θα παραλαμβάναμε το Βronze βραβείο στην κατηγορία Υπηρεσίες Υποδομών, για το Managed WooCommerce Hosting του Papaki! Πρόκειται για την 1η ολοκληρωμένη λύση φιλοξενίας eShop παγκοσμίως, σχεδιασμένη αποκλειστικά για WooCommerce sites. Η υποδομή στην οποία πατάει η λύση του Papaki είναι πρωτοποριακή. Συνδυάζει cloud servers στην Amazon και Docker για μέγιστη διαθεσιμότητα, “έξυπνα” αυτόματα updates (AI) για μεγαλύτερη ασφάλεια και την υλοποίηση in-house τεχνολογίας cache για μέγιστη ταχύτητα – γιατί φυσικά και η ταχύτητα φόρτωσης ενός eShop επηρεάζει τις αγορές που πραγματοποιούνται! Εκτός όμως από τα παραπάνω, ένα πλεονέκτημα του Managed WooCommerce είναι η ευκολία με την οποία δημιουργείται ένα ολοκληρωμένο eShop, καθώς ανοίγει νέους ορίζοντες και ευκαιρίες σε χρήστες ανεξαρτήτως επιπέδου τεχνικών γνώσεων! Ανανεώνουμε το ραντεβού… Ομαδική φωτογραφία των φετινών νικητών! Με τα βραβεία μας στα χέρια, συνεχίσαμε γεμάτοι ικανοποίηση να παρακολουθούμε την βραδιά η οποία ήταν γεμάτη χαμόγελα ανθρώπων που κάνουν τα αδύνατα δυνατά για να βελτιώσουν τη ψηφιακή εμπειρία κάθε χρήστη! Χειροκροτήσαμε δυνατά τις ομάδες, τις καινοτομίες και κάθε μικρό ή μεγαλύτερο βραβείο, γιατί ξέρουμε τι προσπάθεια κρύβεται πίσω από κάθε τέτοια διάκριση. Αξίζει να σημειωθεί ότι φέτος για πρώτη φορά η διοργάνωση εισήγαγε και την απονομή Platinum Awards, για τις υποψηφιότητες που συγκέντρωσαν τον υψηλότερο μέσο όρο βαθμολογίας από την Κριτική Επιτροπή, ανάμεσα στο σύνολο των νικητών στην εκάστοτε ενότητα! Απονεμήθηκαν συνολικά 5 Platinum Awards. Tα δύο απέσπασαν οι εταιρείες Sleed και Cosmos Sport και από ένα οι cosmoONE, Παπαστράτος – IQOS, και AEGEAN – SAPIENT – ATCOM. Τα e-volution 2019 έκλεισαν με την απονομή του “E-Commerce Agency of the Year” στην εταιρεία ΑΤCOM και του “Best Greek e-shop by GRECA” στο Aegeanair.com, το οποίο θα εκπροσωπήσει την Ελλάδα στα European E-Commerce Awards. Ένα μεγάλο μπράβο σε όλους, και φυσικά… ραντεβού του χρόνου, γιατί δε σταματάμε εδώ! Τα βραβεία που προστέθηκαν στη συλλογή μας, απλά μας ενθαρρύνουν ακόμα περισσότερο να γίνουμε καλύτεροι, έχοντας πάντα προτεραιότητά μας εσένα. Ετικέτες b2bE-volutionManaged WooCommerce"
author = "Marieta Christopoulou"
