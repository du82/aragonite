description = "Διάβασε τους αναλυτικούς όρους χρήσης για τις υπηρεσίες και το site του Papaki, ώστε να ενημερωθείς πλήρως σχετικά με τις πολιτικές μας."
full_description = "Όροι Χρήσης των υπηρεσιών του Papaki Τελευταία αναθεώρηση: 14 Φεβρουαρίου 2025 1. Εισαγωγή 1.1 Το Papaki, που από εδώ και στο εξής θα αναφέρεται ως η «Εταιρία», είναι ένας δικτυακός τόπος διάθεσης προϊόντων και υπηρεσιών μέσω του Διαδικτύου που δημιούργησε η εταιρία «Enartia Μονοπρόσωπη Α.Ε.», που εδρεύει στο Ηράκλειο Κρήτης, στη διεύθυνση Επιστημονικό & Τεχνολογικό Πάρκο Κρήτης/Ίδρυμα Τεχνολογίας & Έρευνας, Ν. Πλαστήρα 100, Βασιλικά Βουτών, 70013, με ΑΦΜ 999082935 και ΔΟΥ Ηρακλείου, τηλ. 2810229000. Οι κάτωθι όροι και προϋποθέσεις θα εφαρμόζονται για την χρήση του δικτυακού τόπου της Εταιρίας, ο οποίος βρίσκεται στην ηλεκτρονική διεύθυνση www.papaki.com καθώς και των υπηρεσιών που παρέχει η Εταιρία. Χρησιμοποιώντας την ιστοσελίδα ή τις υπηρεσίες που παρέχει η Εταιρία, οι χρήστες υποδηλώνουν την πλήρη αποδοχή των όρων και προϋποθέσεων που έχει θέσει ή θα θέσει στο μέλλον η Εταιρία. Η Εnartia Μονοπρόσωπη ΑΕ με ΑΦΜ 999082935 and ΓΕΜΗ: :077785727000 ανήκει στο μοναδικό μέτοχο Register S.p.Α με αριθμό μητρώου 04628270482. 1.2 Εάν κάποιος χρήστης ή εκπρόσωπος χρήστη δεν συμφωνεί με αυτούς τους όρους και τις προϋποθέσεις, τότε οφείλει να μην προβεί σε χρήση του δικτυακού τόπου και των υπηρεσιών της Εταιρίας. Οι χρήστες των υπηρεσιών της Εταιρίας ή οι επισκέπτες του δικτυακού τόπου www.papaki.com θα αναφέρονται στο εξής ως «Πελάτης», ανεξάρτητα από το αν προβούν σε παραγγελίες υπηρεσιών ή προϊόντων από την Εταιρία. 2. Δικαιώματα πνευματικής ιδιοκτησίας 2.1 Αυτή η ιστοσελίδα είναι ένα από τα επίσημα ηλεκτρονικά καταστήματα της Εταιρίας. Όλο το περιεχόμενο της ιστοσελίδας, συμπεριλαμβανομένων εικόνων, γραφικών, φωτογραφιών, σχεδίων, κειμένων, παρεχόμενων υπηρεσιών και προϊόντων αποτελούν την πνευματική ιδιοκτησία της Εταιρίας ή χρησιμοποιούνται με κατάλληλη άδεια χρήσης και προστατεύονται κατά τις σχετικές διατάξεις του ελληνικού δικαίου, του ευρωπαϊκού δικαίου και των διεθνών συμβάσεων. Όλο το περιεχόμενο της ιστοσελίδας έχει κατατεθεί σε συμβολαιογράφο. 2.2 Απαγορεύεται οποιαδήποτε αντιγραφή, διανομή, μεταφορά, μεταποίηση, μεταπώληση, δημιουργία παράγωγης εργασίας ή παραπλάνηση του κοινού σχετικά με τον πραγματικό παροχέα του περιεχομένου του διαδικτυακού τόπου. Τυχόν αναπαραγωγή, επανέκδοση, λήψη, μεταφόρτωση, ανακοίνωση, διάδοση ή μετάδοση ή οποιαδήποτε άλλη χρήση του περιεχομένου με οποιοδήποτε τρόπο ή μέσο για εμπορικούς ή άλλους σκοπούς επιτρέπεται μόνο κατόπιν προηγούμενης γραπτής άδειας της Εταιρίας ή οποιουδήποτε άλλου δικαιούχου των πνευματικών δικαιωμάτων. Τα ονόματα, οι εικόνες, τα λογότυπα και τα διακριτικά γνωρίσματα που αντιπροσωπεύουν την Εταιρία ή τρίτα μέρη συνδεόμενα με την Εταιρία και τα προϊόντα ή τις υπηρεσίες τους, είναι αποκλειστικά σήματα της Εταιρίας ή τρίτων μερών προστατευόμενα από τους σχετικούς νόμους περί εμπορικών σημάτων. Η εμφάνισή τους στον διαδικτυακό τόπο δεν θα πρέπει κατά κανένα τρόπο να εκληφθεί ως μεταβίβαση ή εκχώρηση άδειας ή δικαιώματος χρήσης τους. 3. Ευθύνη Εταιρίας 3.1 Ο Πελάτης βεβαιώνει ότι το υλικό που θα μεταφορτώνει στον server θα είναι έτοιμο και δεν θα χρειάζεται καμία επιπλέον επεξεργασία από την Εταιρία για να λειτουργήσει. Η Εταιρία έχει δικαίωμα πρόσβασης στα αρχεία, τις ιστοσελίδες και τα δεδομένα του Πελάτη έπειτα από αίτημα του Πελάτη για τεχνική υποστήριξη ή εάν χρειαστεί να διενεργηθεί κάποιος έλεγχος ή έπειτα από αίτημα των Αρχών σύμφωνα με όσα αναφέρονται και στην Πολιτική Εμπιστευτικότητας και τη Δήλωση Ασφάλειας Προσωπικών Δεδομένων. 3.2 Η Εταιρία γνωστοποιεί με email στον Πελάτη τον τρόπο με τον οποίο μπορεί να αποκτήσει πρόσβαση στο Διαχειριστικό Περιβάλλον των υπηρεσιών του (Control Panel) και για τον τρόπο δημοσίευσης των αρχείων του στο Διαδίκτυο, την εγκατάσταση των email λογαριασμών και τις πληροφορίες για τη διαχείριση των υπηρεσιών του. 3.3 Η Εταιρία θα μπορούσε κατ' εξαίρεση, να παρέχει υποστήριξη και υποδείξεις σε θέματα που δεν σχετίζονται αμιγώς με υπηρεσίες domain name ή φιλοξενίας δικτυακού τόπου (πρόσθετη Τεχνική Υποστήριξη). Ο Πελάτης αναγνωρίζει ότι η Εταιρία δεν έχει ευθύνη για την ορθότητα ή την πληρότητα αυτών των οδηγιών υποστήριξης που θα δοθούν στον Πελάτη. 3.4 Η Εταιρία δεν ασκεί έλεγχο στο περιεχόμενο των πληροφοριών που περνάνε μέσα από το δίκτυο των διακομιστών της. Επίσης, δεν εγγυάται την αξιοπιστία, την ακρίβεια ή την ποιότητα οποιασδήποτε πληροφορίας που εμφανίζεται στο διαδίκτυο διαμέσου ή εξαιτίας των υπηρεσιών της. Επιπλέον, δεν εγγυάται την εμπορική ή προσωπική φερεγγυότητα οποιουδήποτε παρουσιάζεται στο διαδίκτυο, ή την εκπλήρωση οποιονδήποτε συγκεκριμένων υποσχέσεων/προσφορών από τρίτους, και δεν είναι υπεύθυνη για οποιεσδήποτε ζημιές μπορεί να συμβούν στον Πελάτη ή σε αυτούς που συναλλάσσονται με αυτόν, συμπεριλαμβανομένου και της απώλειας δεδομένων εξ' αιτίας καθυστερήσεων, μη παράδοσης εμπορευμάτων ή διακοπής υπηρεσιών για οποιαδήποτε αιτία, λάθος ή παράλειψη. 3.5 Η Εταιρία, υπό οποιεσδήποτε συνθήκες και περιστάσεις και από οποιαδήποτε αιτία, δεν έχει καμία ευθύνη για οποιαδήποτε ζημιά προκύψει από την χρησιμοποίηση, διαθεσιμότητα ή μη διαθεσιμότητα των υπηρεσιών που προσφέρει. 3.6 Η Εταιρία αναβαθμίζει σε τακτά χρονικά διαστήματα εγκατεστημένες εφαρμογές που υπάρχουν στους servers της προκειμένου να διατηρεί τα επίπεδα ασφάλειας στο υψηλότερο δυνατό επίπεδο και να παρέχει τις πιο πρόσφατες εκδόσεις των Plesk Control Panel, PHP, MySQL, ASP.NET, Perl, Zend, ionCube κ.λπ. Είναι αποκλειστική υποχρέωση του Πελάτη, ειδικά σε περίπτωση που προκύπτουν περιστατικά ασφάλειας που θέτουν σε κίνδυνο την αξιοπιστία της υποδομής και τη διαθεσιμότητα των υπηρεσιών της Εταιρίας, να ενημερώνει αναλόγως τις ιστοσελίδες του, δίνοντας ιδιαίτερη έμφαση στις ενημερώσεις που σχετίζονται με την ασφάλεια (security updates) του κώδικα PHP, MySQL Queries, ASP.NET κ.λπ., έτσι ώστε να είναι συμβατές με τους servers της Εταιρίας και να μην τους θέτει σε κίνδυνο. Η Εταιρία δεν ευθύνεται για οποιαδήποτε απώλεια, ζημιά, ή ηθική βλάβη προκύπτει από αυτές τις αναβαθμίσεις, καθώς και από την αδυναμία ή απροθυμία του Πελάτη να προσαρμόσει τις ιστοσελίδες του με τις αναβαθμισμένες εκδόσεις των διάφορων εφαρμογών και προγραμματιστικών γλωσσών Η/Υ που έχουν εγκατασταθεί στους servers της Εταιρίας. 3.7 Η Εταιρία σε τακτά χρονικά διαστήματα παίρνει αντίγραφα ασφαλείας των αρχείων και των βάσεων δεδομένων των Πελατών που χρησιμοποιούν υπηρεσίες φιλοξενίας στους servers της. Τα αντίγραφα αυτά αποθηκεύονται καθημερινά έως και 14 ημέρες πριν την τρέχουσα ημερομηνία. Έξτρα εβδομαδιαία αντίγραφα λαμβάνονται την 15η, την 21η και την 28η ημέρα πριν από την τρέχουσα ημερομηνία. Η Εταιρία δεν φέρει καμία ευθύνη σε περίπτωση που το αντίγραφο ασφαλείας δεν είναι ενημερωμένο ή δεν μπορεί να χρησιμοποιηθεί. Ο Πελάτης είναι υποχρεωμένος να τηρεί αντίγραφο ασφαλείας των αρχείων και των βάσεων δεδομένων. Το αντίγραφο ασφαλείας που τηρεί ο Πελάτης θα πρέπει να μεταφορτώνεται στον προσωπικό υπολογιστή του Πελάτη. Σε περίπτωση που ο Πελάτης ζητήσει ανάκτηση αρχείων, η Εταιρία θα παραδώσει τις υπηρεσίες / τα προϊόντα μέσα σε λίγα λεπτά από την στιγμή της εξόφλησης. Σε κάποιες περιπτώσεις, λόγω της φύσης της υπηρεσίας, η παράδοση μπορεί να καθυστερήσει μερικές ώρες ή ημέρες. Ο Πελάτης αναγνωρίζει ότι η διαδικασία restore από backup ενδέχεται να αλλοιώσει το περιεχόμενο του site ή να το επαναφέρει σε προηγούμενη έκδοση. Η Εταιρία δεν ευθύνεται έναντι των πελατών / χρηστών για ζημιές που τυχόν προκύψουν από την εκτέλεση ή μη της παραγγελίας τους ή από την μορφή παροχής της υπηρεσίας. Επίσης επιφυλάσσεται ως προς το χρόνο παράδοσης των υπηρεσιών backup / restore στις περιπτώσεις ανωτέρας βίας. 3.8 Η Εταιρία έπειτα από εισαγγελική παρέμβαση ή αίτημα των αρμόδιων Αρχών θα ακολουθήσει τις νόμιμες διαδικασίες για επιβολή του νόμου και μπορεί να αποκτήσει πρόσβαση σε δεδομένα που αφορούν τον χώρο, τα αρχεία, τα email και το περιεχόμενο του Πελάτη. Αυτό μπορεί να οδηγήσει την Εταιρία σε αποκάλυψη όλων των πληροφοριών που έχουν δοθεί στην Εταιρία, συμπεριλαμβανομένων των πληροφοριών που βρίσκονται στους διακομιστές της Εταιρίας, των αρχείων και των βάσεων δεδομένων του Πελάτη. 3.9 Η Εταιρία δεν ευθύνεται για ζημιές που μπορεί να προκύψουν από την εκτέλεση ή μη της παραγγελίας του Πελάτη, ή από τη μορφή παροχής της υπηρεσίας. Επίσης επιφυλάσσεται ως προς τον χρόνο παράδοσης των προϊόντων/ υπηρεσιών στις περιπτώσεις ανωτέρας βίας. 3.10 Ο Πελάτης αναγνωρίζει ότι η Εταιρία μπορεί να προσαρμόζει τις υπηρεσίες και τα προϊόντα που του παρέχει μέσω τρίτων προμηθευτών, βάσει των προδιαγραφών του εκάστοτε προμηθευτή. Ο Πελάτης αναγνωρίζει ότι η Εταιρία δεν είναι υπεύθυνη και εκτεθειμένη στον ίδιο, ή οποιονδήποτε τρίτο, για οποιεσδήποτε αξιώσεις προκύπτουν από την παροχή αυτών των προϊόντων / υπηρεσιών. 3.11 Συμφωνητικό παροχής υπηρεσιών - Service Level Agreement (SLA) Η παρούσα συμφωνία περιγράφει την εγγύηση διαθεσιμότητας των υπηρεσιών της Εταιρείας. Η εγγύηση ισχύει για κάθε πελάτη της εταιρείας που δεν έχει ανεξόφλητα χρέη κατά τη διάρκεια της περιόδου μη διαθεσιμότητας των υπηρεσιών. Μορφή και διαδικασία εφαρμογής της εγγύησης Η εταιρεία έχει ως κύριο στόχο να παρέχει το περιεχόμενο του φιλοξενούμενου ιστοχώρου διαθέσιμο (uptime) για πρόσβαση από οποιοδήποτε μέρος του κόσμου, κάθε στιγμή. Ο χρόνος διακοπής της υπηρεσίας ορίζεται ως απώλεια όλων των πακέτων από την εταιρεία προς τους παροχείς backbone providers. Ο στόχος της Εταιρείας είναι να κρατήσει τη μέση απώλεια πακέτων σε διάρκεια 0,1% ή λιγότερο, κατά τη διάρκεια ενός ημερολογιακού μήνα, όπως μετριέται από της Εταιρείας. Ο χρόνος διακοπής μετριέται μετά από την κοινοποίηση από τον πελάτη της μη λειτουργίας, την στιγμή που γίνεται η διακοπή, μέσω του συστήματος ticketing της εταιρείας. Εάν είναι αδύνατη η πρόσβαση στο ticketing system, τότε η κλήση πρέπει να γίνει τηλεφωνικά προς το Τμήμα Εξυπηρέτησης. Οι διαχειριστές της εταιρείας θα καθορίσουν το τέλος του χρόνου διακοπής. Εάν η μέση απώλεια πακέτων υπερβεί το 1%, η εταιρεία θα παρέχει πίστωση στον πελάτη σε μορφή χρόνου συνδρομής της υπηρεσίας, σύμφωνα με τους παρακάτω πίνακες. Πιστώσεις Webhosting, Semi-Dedicated Hosting και Reseller Hosting Σε περίπτωση που η διαθεσιμότητα της υποδομής που εξυπηρετεί το πακέτο φιλοξενίας σας είναι μικρότερη από 99,9% κατά τη διάρκεια ενός ημερολογιακού έτους, το Papaki θα πιστώσει το πακέτο φιλοξενίας σας ως εξής: Ετήσια λειτουργία Πίστωση 99% έως 99,9% Πίστωση 10% 98,99% - 97% Πίστωση 30% 96,99% ή λιγότερο Πίστωση 100% Περιορισμοί Ο Πελάτης δεν θα λάβει οποιαδήποτε πίστωση για οποιαδήποτε αποτυχία, δυσλειτουργία ή μη διαθεσιμότητα του ιστοχώρου του που προκαλείται ή συνδέεται με: α. περιστάσεις πέρα από τον λογικό έλεγχο της Εταιρείας συμπεριλαμβανομένων, χωρίς περιορισμό, δραστηριότητες κυβερνητικές, πόλεμος, εξεγέρσεις, δολιοφθορές, ένοπλης σύγκρουσης, αποκλεισμού, πυρκαγιάς, πλημμύρας, απεργίας ή άλλης διαταραχής εργασίας, της διακοπής ή της καθυστέρησης στη μεταφορά, απρόσιτη ή διακοπή ή καθυστέρηση στις τηλεπικοινωνίες ή τις υπηρεσίες τρίτων, επιθέσεις χάκερ ή ιών, αποτυχία του λογισμικού τρίτων (συμπεριλαμβανομένου, χωρίς περιορισμό του λογισμικού ecommerce, πυλών πληρωμής, συνομιλίας, στατιστικών ή ελεύθερων scripts) ή ανικανότητα να ληφθούν οι πρώτες ύλες, οι προμήθειες, ή η ενέργεια που απαιτείται για τη χρήση του κατάλληλου εξοπλισμού για την παροχή αυτού του SLA. β. Προγραμματισμένης ή επείγουσας συντήρησης και βελτίωσης του τεχνολογικού εξοπλισμού της εταιρίας. γ. Θέματα με τον DNS, FTP, POP, IMAP ή SMTP πρόσβαση πελατών. δ. Ψεύτικες αναφορές για μη λειτουργία συστημάτων της Εταιρείας. ε. Πράξεις ή παραλείψεις του πελάτη (ή με άλλες πράξεις ή παραλείψεις που εγκρίνονται από τον πελάτη), συμπεριλαμβανομένων χωρίς περιορισμό των ακόλουθων: της προσαρμογής ή της επέμβασης σε scripts (π.χ. CGI, Perl, HTML, ASP, κ.λπ..), οποιασδήποτε αμέλειας, σκόπιμης κακής μεταχείρισης ή χρήσης των υπηρεσιών με παραβίαση των όρων της Εταιρείας και των διατάξεων της αποδεκτής πολιτικής χρήσης. στ. Παράδοση ή μετάδοση ηλεκτρονικού ταχυδρομείου ή webmail. ζ. Διακοπές λειτουργίας αλλού στο διαδίκτυο που εμποδίζουν την πρόσβαση στον Πελάτη. Η Εταιρεία δεν είναι αρμόδια για τους browsers ή τους DNS οι οποίοι μπορούν να κάνουν αδύνατη την εμφάνιση της υπηρεσίας στον Πελάτη. Επίσης η Εταιρεία δεν είναι αρμόδια για προβλήματα που προκύπτουν εξαιτίας της ποιότητας πρόσβασης στο internet από τον παροχέα που έχει επιλέξει ο Πελάτης. Eταιρεία θα εγγυηθεί μόνο εκείνες τις περιοχές που είναι υπό έλεγχο της, δηλαδή: τους servers, τους δρομολογητές των servers και την σύνδεση αυτών με το Διαδίκτυο. Εγγύηση αντικατάστασης υλικού σε 240 λεπτά (για τους servers που παρέχεται SLA) Η Εταιρεία εγγυάται τη λειτουργία όλων των ενοικιαζόμενων/αγορασμένων τμημάτων υλικού και θα αντικαταστήσει οποιοδήποτε αποτυχημένο συστατικό χωρίς κάποια οικονομική επιβάρυνση για τον πελάτη. Η αντικατάσταση του υλικού θα αρχίσει μόλις προσδιορίσει η Εταιρεία την αιτία του προβλήματος. Η αντικατάσταση του υλικού είναι εγγυημένη για να είναι πλήρης μέσα σε 240 λεπτά από τον προσδιορισμό του προβλήματος. Σε περίπτωση που παίρνει περισσότερο από 120 λεπτά για να αντικατασταθεί το ελαττωματικό υλικό, η Εταιρεία θα επιστρέψει στον πελάτη την αμοιβή μιας ημέρας ανά ώρα που δεν λειτουργεί το σύστημα (μέχρι 100% της μηνιαίας αμοιβής πρόσβασης του πελάτη). Αυτή η εγγύηση αποκλείει το χρόνο που απαιτείται για να επανοικοδομηθεί οποιαδήποτε σειρά RAID. Περιορισμός Ευθύνης – Εξασφάλιση - Αποζημίωση Η Εταιρία καταβάλει σημαντικές προσπάθειες ώστε ο δικτυακός της τόπος να συμπεριλαμβάνει ακριβείς και ενημερωμένες πληροφορίες. Εντούτοις, δεν δεσμεύεται ως προς την ακρίβεια, την χρονική εγγύτητα και την πληρότητα του περιεχομένου που δημοσιεύεται και κατά συνέπεια δεν φέρει οποιασδήποτε φύσεως ευθύνη. Συγκεκριμένα, η Εταιρία οφείλει να ελέγχει τον δικτυακό της τόπο ως προς την ορθότητα της λειτουργικότητας και της εμφάνισης του για τις δύο (2) πιο πρόσφατες εκδόσεις των πλέον δημοφιλών περιηγητών (όπως για παράδειγμα Goolge Chrome, Mozilla Firefox, Safari και Internet Explorer). Η Εταιρία δεν ευθύνεται για οποιαδήποτε μεταβολή προκύψει στη λειτουργικότητα ή το περιεχόμενο του δικτυακού της τόπου, εξ' αιτίας της χρησιμοποίησης από τον Πελάτη παλιότερης έκδοσης των παραπάνω περιηγητών, ή οποιουδήποτε άλλου περιηγητή. Ο Πελάτης συμφωνεί ότι θα υπερασπιστεί έναντι παντός δικαστηρίου, θα εξασφαλίσει, θα κρατήσει μακριά από κάθε κίνδυνο, από όλες τις απαιτήσεις, απώλειες, χρηματικές διεκδικήσεις και ευθύνες, την Εταιρία και θα την καλύψει έναντι κάθε χρηματικού κόστους συμπεριλαμβανομένων και τυχόν δικηγορικών αμοιβών. Επίσης, θα την καλύψει από οποιαδήποτε υπόθεση ή διεκδίκηση λόγω ζημίας ή βλάβης ή οποιασδήποτε άλλης αιτίας εγείρει o ίδιος ο Πελάτης, ή ο οποιοσδήποτε τρίτος, εναντίον της Εταιρίας, ή του ιδίου στην περίπτωση τρίτων, εξαιτίας των δραστηριοτήτων ή άλλων πράξεων του ή των περιεχομένων και πληροφοριών που κινήθηκαν μέσω των server της Εταιρίας ή λόγω δυσλειτουργίας οποιουδήποτε διακομιστή μας, με ή χωρίς τη συναίνεση του Πελάτη ή συνεργαζόμενου με αυτόν προσώπου. Επιπροσθέτως, ο Πελάτης ρητώς δηλώνει και"
