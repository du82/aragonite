["https://papaki.gr/el/privacy-policy.htm"]
title = "Προστασία Προσωπικών Δεδομένων | Papaki"
description = "Τα προσωπικά δεδομένα των πελατών μας είναι εξαιρετικά σημαντικά για εμάς. Διάβασε εδώ την αναλυτική Πολιτική Προστασίας Προσωπικών Δεδομένων του Papaki."
full_description = "Πολιτική Εμπιστευτικότητας και Ασφάλειας Προσωπικών Δεδομένων Διευκρινήσεις για την επεξεργασία προσωπικών δεδομένων (ως Υπεύθυνου και Εκτελούντα την Επεξεργασία, σύμφωνα με τον Γενικό Κανονισμό Δεδομένων Ε.Ε. 2016/679) 1. Γιατί η Εταιρία θα επεξεργαστεί τα Δεδομένα Προσωπικού Χαρακτήρα (ΔΠΧ) και τα Ειδικής Κατηγορίας Δεδομένα Προσωπικού Χαρακτήρα (ΕΚΔΠΧ) του Πελάτη; Με την αγορά υπηρεσιών/προϊόντων που πραγματοποιεί ο Πελάτης μέσω της ιστοσελίδας της Εταιρίας, δηλώνει ότι θέλει να αναλάβει η Εταιρία για λογαριασμό του την ολοκλήρωση μιας εργασίας ή τη μεσολάβηση ανάμεσα στον Πελάτη και σε κάποιον τρίτο για την ολοκλήρωση μιας εργασίας με την ιδιότητά της η Εταιρία ως πάροχoς υπηρεσιών διαδικτύου. Η Εταιρία, βάσει των πληροφοριών/δεδομένων που δηλώνει ο Πελάτης στην ιστοσελίδα της/φόρμα παραγγελίας, θα πρέπει να τον εντάξει σε μια ομοιογενή κατηγορία και να υπολογίσει, βάσει των δηλώσεών του, το κατάλληλο και αναλογικό για τον Πελάτη προϊόν/υπηρεσία. Για να γίνει αυτό, είναι αναγκαίο να δηλώσει ο Πελάτης τα συγκεκριμένα ΔΠΧ ή/και τα ΕΚΔΠΧ που αναφέρονται στα σχετικά πεδία της φόρμας παραγγελίας. Τα στοιχεία αυτά είναι αντικειμενικά ουσιώδη για την εκπλήρωση του σκοπού και τη λειτουργία της παρεχόμενης υπηρεσίας. Η σωστή και ολοκληρωμένη πληροφόρηση για τα στοιχεία που ζητά η Εταιρία συνιστούν υποχρέωσή του Πελάτη από τον νόμο. Είναι πιθανό ανακριβής ή ελλιπής πληροφόρηση για τα στοιχεία που ζητά η Εταιρία να θεμελιώσει δικαίωμα να ζητήσει η Εταιρία ακόμα και την ακύρωση ή καταγγελία της παρεχομένης υπηρεσίας οποιαδήποτε χρονική στιγμή. Για όσο χρόνο θα παραμένει σε ισχύ η σύμβαση παροχής υπηρεσιών, η Εταιρία θα επεξεργάζεται τα δεδομένα του Πελάτη που είναι απαραίτητα για τη λειτουργία της, με βάση τη ρητή συγκατάθεση που θα μας χορηγήσει ο Πελάτης στο παρόν στάδιο μέσω της παραγγελίας υπηρεσίας/προϊόντος ή σε τυχόν άλλο μεταγενέστερο στάδιο. Kαταχώριση Ονόματος Χώρου Για την καταχώριση ενός ονόματος χώρου ο πελάτης πρέπει να παράσχει ορισμένα προσωπικά στοιχεία: Στοιχεία επικοινωνίας: Το όνομα, η ταχυδρομική διεύθυνση, ο αριθμός τηλεφώνου και η διεύθυνση ηλεκτρονικού ταχυδρομείου του καταχωρίζοντος. Επαλήθευση ταυτότητας: Ορισμένοι καταχωρητές ενδέχεται επίσης να ζητήσουν από τον καταχωρίζοντα να προσκομίσει πρόσθετα έγγραφα για την επαλήθευση της ταυτότητάς του, όπως ταυτότητα ή διαβατήριο. Πρόσθετο σημείο επαφής: Ορισμένα μητρώα ενδέχεται να απαιτούν από τον καταχωρίζοντα να παράσχει ένα ή περισσότερα σημεία επαφής, τα οποία θα είναι υπεύθυνα π.χ. για τις διοικητικές ή τεχνικές πτυχές της καταχώρισης ονόματος χώρου. Τα προσωπικά δεδομένα του καταχωρίζοντος πελάτη θα χρησιμοποιηθούν για τους ακόλουθους σκοπούς: - Επαλήθευση της ταυτότητας και των στοιχείων επικοινωνίας - Τιμολόγηση και έκδοση τιμολογίων για την καταχώριση του τομέα - Παροχή υποστήριξης και εξυπηρέτηση πελατών - Κοινοποίηση σημαντικών πληροφοριών σχετικά με την καταχώριση και την ανανέωση του τομέα Ο καταχωρητής τομέων, ως η οντότητα που είναι υπεύθυνη για τη διαχείριση της καταχώρισης των ονομάτων τομέων, είναι υπεύθυνος για τη συλλογή και την αποθήκευση των προσωπικών δεδομένων του καταχωρίζοντος πελάτη σύμφωνα με τους ισχύοντες νόμους και κανονισμούς και μπορεί να μοιράζεται τα δεδομένα του καταχωρίζοντος με άλλους καταχωρητές προκειμένου να καταχωρηθεί ένας τομέας. Το μητρώο, είναι η οντότητα που είναι υπεύθυνη για τη διατήρηση της βάσης δεδομένων των καταχωρημένων ονομάτων τομέων, θα λάβει από τον καταχωρητή τα προσωπικά δεδομένα του καταχωρίζοντος. Το μητρώο χρησιμοποιεί αυτές τις πληροφορίες για να διατηρεί ακριβή και ενημερωμένα αρχεία των καταχωρημένων ονομάτων τομέα και για να διασφαλίζει τη συμμόρφωση με τους σχετικούς νόμους και κανονισμούς. Ο καταχωρητής και το μητρώο ενδέχεται επίσης να υποχρεούνται να κοινοποιούν τα προσωπικά δεδομένα στον ICANN (Οργανισμός Διαδικτύου για την Εκχώρηση Ονομάτων και Αριθμών) στο πλαίσιο της διαδικασίας συμμόρφωσης με τις πολιτικές του ICANN. 2. Σε τι είδους επεξεργασία των δεδομένων μου θα προβεί η Εταιρία; Αφού ο Πελάτης προβεί στην παραγγελία προϊόντος /υπηρεσίας, συμπληρωμένη σε όλα τα πεδία, η Εταιρία θα προχωρήσει, για τους λόγους που προαναφέρθηκαν, σε κάθε πράξη ή σειρά πράξεων επεξεργασίας των δεδομένων του Πελάτη και με τη βοήθεια αυτοματοποιημένων μέσων όπως π.χ. συλλογή, καταχώρηση, οργάνωση, διόρθωση, αποθήκευση, προσαρμογή, μεταβολή, ανάκτηση, αναζήτηση πληροφοριών. Η Εταιρία κάνει χρήση αυτοματοποιημένων μέσων για την ολοκλήρωση της παραγγελίας και την παροχή της υπηρεσίας. Μέσω αυτών των αυτοματοποιημένων μέσων, η Εταιρία δύναται να λαμβάνει αποφάσεις πιο σύντομα, με μεγαλύτερη ακρίβεια, διαφάνεια και συνέπεια. Ωστόσο, στις περιπτώσεις αυτές, πραγματοποιούνται τακτικοί σχετικοί έλεγχοι από αρμόδιους υπαλλήλους της Εταιρίας. Η Εταιρία στα πλαίσια προστασίας των εννόμων συμφερόντων, πραγματοποιεί συχνά ελέγχους, μέσο πιστοποιημένων αυτοματοποιημένων μέσων, για λόγους αποτροπής απάτης σε βάρος της. Ειδικά, πραγματοποιούνται οι εξής επιμέρους επεξεργασίες προς το σκοπό συμμόρφωσής της Εταιρίας με προβλέψεις της ευρωπαϊκής και ελληνικής νομοθεσίας: έλεγχοι (και αυτοματοποιημένοι) για να αποτραπεί η χρήση των προϊόντων για σκοπούς ξεπλύματος χρήματος ή/και χρηματοδότησης της τρομοκρατίας. πραγματοποιούνται έλεγχοι και αποστέλλονται στοιχεία και δεδομένα προς το σκοπό συμμόρφωσης της Εταιρίας με τη διοικητική συνεργασία των κρατών-μελών της Ευρωπαϊκής Ένωσης στον φορολογικό τομέα. πραγματοποιούνται έλεγχοι και αποστέλλονται στοιχεία και δεδομένα προς το σκοπό συμμόρφωσης της Εταιρίας με την πολυμερή συμφωνία Αρμοδίων Αρχών για την αυτόματη ανταλλαγή πληροφοριών χρηματοοικονομικών λογαριασμών. Για λόγους ασφάλειας και ανίχνευσης δόλιας παράνομης συμπεριφοράς, η Enartia έχει εφαρμόσει έναν αυτοματοποιημένο σύστημα ελέγχου, το οποίο κάνει χρήση cookies και άλλων παρόμοιων τεχνολογιών για την παρακολούθηση και ανάλυση ορισμένων κινήσεων των χρηστών του ιστότοπου, σε συνδυασμό με τις διευθύνσεις IP τους και άλλα δεδομένα που σχετίζονται με την περιήγηση στον ιστότοπο της εταιρείας. Συνέπεια αυτής της επεξεργασίας είναι ότι, εάν ένας επισκέπτης επιχειρήσει να προβεί σε δόλια συμπεριφορά στον ιστότοπο της Εταιρείας, για παράδειγμα προκειμένου να επωφεληθεί πολλές φορές από την ίδια προωθητική ενέργεια χωρίς να έχει το δικαίωμα να το κάνει, η Εnartia διατηρεί το δικαίωμα να αποκλείσει το εν λόγω πρόσωπο από την προώθηση ή να λάβει οποιοδήποτε άλλο κατάλληλο μέτρο για την αποτροπή της παράνομης αυτής συμπεριφοράς. Η εταιρεία κάνει χρήση cookies και παρόμοιων τεχνολογιών με στόχο την επαλήθευση και τη μέτρηση της ποιότητας και της αποτελεσματικότητας των διαδικτυακών διαφημιστικών εκστρατειών της enartia προκειμένου να βελτιωθούν οι επιδόσεις των εν λόγω των εκστρατειών, καθώς και των υπηρεσιών που προσφέρει η Enartia. Στο πλαίσιο των προωθητικών ενεργειών και προς το νόμιμο συμφέρον της Εταιρείας ενδέχεται κατ’εξαιρεση να αποστέλονται μηνύματα ηλεκτρονικού ταχυδρομείου που προωθούν παρόμοια προϊόντα ή υπηρεσίες στους πελάτες μας (soft opt-in). Η εξαίρεση αυτή μας επιτρέπει να επικοινωνούμε με τους υφιστάμενους πελάτες μας με προσφορές για προϊόντα ή υπηρεσίες που είναι παρόμοιες με αυτές που έχουν αγοράσει προηγουμένως από εμάς. 3. Για πόσο χρόνο θα κρατά η Εταιρία τα δεδομένα του Πελάτη σε αρχείο; Η Εταιρία θα κρατήσει τα δεδομένα του Πελάτη για όσο χρόνο θα διατηρείται συμβατική σχέση μεταξύ τους, τόσο σε έγχαρτη, όσο και σε ηλεκτρονική μορφή. Σε περίπτωση που, για οποιονδήποτε λόγο, αυτή διακοπεί η Εταιρία θα τα κρατήσει για όσο χρόνο ακόμα απαιτείται μέχρι να παρέλθει ο χρόνος παραγραφής τυχόν σχετικών αξιώσεων. Ωστόσο, σε κάθε περίπτωση η Εταιρία θα κρατήσει τα στοιχεία για χρονικό διάστημα μέχρι ενός (1) έτους από την λήξη της μεταξύ τους συνεργασίας. 4. Ποια δικαιώματα έχει ο Πελάτης σε σχέση με την επεξεργασία των δεδομένων του; Ο Πελάτης μπορεί να ασκήσει, κατά περίπτωση, τα εξής δικαιώματα: το δικαίωμα πρόσβασης (για να μάθει ποια δεδομένα του επεξεργαζόμαστε, για ποιο λόγο και τους αποδέκτες τους), διόρθωσης (για να διορθωθούν τυχόν ελλείψεις ή ανακρίβειες των δεδομένων), διαγραφής (δικαίωμα στη λήθη) (διαγραφή τους από τα αρχεία της Εταιρίας, εφόσον όμως η επεξεργασία τους δεν είναι πλέον απαραίτητη), περιορισμού της επεξεργασίας (σε περίπτωση αμφισβήτησης της ακρίβειας των δεδομένων κ.λπ.), φορητότητας (να λάβει ο Πελάτης τα δεδομένα του σε δομημένο και κοινώς χρησιμοποιούμενο μορφότυπο). Τα δικαιώματα αυτά ασκούνται χωρίς κόστος για τον Πελάτη, με την αποστολή σχετικής επιστολής ή e-mail στον Υπεύθυνο Προστασίας Δεδομένων, εκτός αν επαναλαμβάνονται συχνά και λόγω όγκου έχουν για την Εταιρία διοικητικό κόστος, οπότε ο Πελάτης θα επιβαρυνθεί με το σχετικό κόστος. Εφόσον ο Πελάτης ασκήσει οποιαδήποτε από τα δικαιώματά του αυτά, η Εταιρία θα λάβει κάθε δυνατό μέτρο για την ικανοποίηση του αιτήματος του Πελάτη εντός τριάντα (30) ημερών από τη λήψη του σχετικού αιτήματος, αφού ενημερώσει η Εταιρία είτε για την ικανοποίησή του, είτε για τους αντικειμενικούς λόγους που εμποδίζουν την ικανοποίησή του. Πέραν αυτών, ο Πελάτης μπορεί οποιαδήποτε στιγμή να εναντιωθεί στην επεξεργασία των ΔΠΧ και ΕΔΠΧ του για τους σκοπούς της σύμβασης παροχής υπηρεσιών, ανακαλώντας της συγκατάθεσή του. Ωστόσο, αυτό θα οδηγήσει σε λήξη της σύμβασής του Πελάτη και σε μη παροχή υπηρεσιών από την Εταιρία, επειδή (σύμφωνα και με όσα προαναφέρθηκαν) καμία υπηρεσία δεν λειτουργεί χωρίς επεξεργασία των ΔΠΧ ή/και των ΕΠΔΧ του πελάτη (υποκειμένου των δεδομένων). 5. Πώς διασφαλίζεται η ασφάλεια των δεδομένων του Πελάτη; Η ασφάλεια των δεδομένων είναι για την Εταιρία απόλυτη δέσμευση. Για να επιτευχθεί αυτό εφαρμόζονται όλα τα σύγχρονα και κατάλληλα για τους σκοπούς της επεξεργασίας τεχνικά (κρυπτογράφηση, ανωνυμοποίηση κ.λπ.) και οργανωτικά μέτρα, την ανταπόκριση των οποίων η Εταιρία ελέγχει ανά τακτά χρονικά διαστήματα. 6. Πού θα διαβιβάζονται τα δεδομένα; Τα δεδομένα του Πελάτη θα διαβιβαστούν σε τμήματα της Εταιρίας που είναι αρμόδια για την ολοκλήρωση της παρεχόμενης υπηρεσίας και για την ορθή και απρόσκοπτη λειτουργία της. Ενδεικτικά αναφέρεται το τμήμα τεχνικής υποστήριξης, η νομική υπηρεσία, το λογιστήριο κ.λπ. Τα δεδομένα του Πελάτη, ενδέχεται να διαβιβαστούν και να καταστούν προσιτά και από νομικά ή/και φυσικά πρόσωπα με τα οποία, κατά καιρούς, η Εταιρία διατηρεί συμβάσεις για την ορθή παροχή των προσφερόμενων υπηρεσιών. Επίσης, τα δεδομένα, στα πλαίσια της λειτουργίας της σύμβασης ασφάλισης του Πελάτη, μπορεί να διαβιβαστούν σε διάφορες υπηρεσίες, δημόσιες αρχές, κ.λπ. Ωστόσο, στην περίπτωση αυτή, αυτά τα νομικά ή/και φυσικά πρόσωπα θα επεξεργαστούν τα δεδομένα προσωπικού χαρακτήρα του Πελάτη αποκλειστικά για τον σκοπό παροχής υπηρεσιών προς την Εταιρία και όχι προς ίδιο όφελος, ενεργώντας ως εκτελούντες την επεξεργασία. Σε κάθε διαβίβαση η Εταιρία λαμβάνει πάντα κάθε μέτρο ώστε τα δεδομένα που θα διαβιβάζονται να είναι πάντα τα ελάχιστα αναγκαία και ότι θα συντρέχουν πάντα οι προϋποθέσεις για νόμιμη και θεμιτή επεξεργασία. Ο Όμιλος team.blue, που αποτελείται από αρκετές εταιρείες, μπορεί να βελτιώσει τον συντονισμό και την κατανομή πόρων με τον διαμοιρασμό δεδομένων στο εσωτερικά Αυτό επιτρέπει την πιο αποτελεσματική συνεργασία, τη βελτίωση προϊόντων, καμπανιών και υπηρεσιών προς τους τελικούς πελάτες. Προσωπικά δεδομένα μπορεί να μοιράζονται μεταξύ των εταιρειών του Ομίλου της team.blue για στατιστικούς λόγους στον τομέα του μάρκετινγκ, για εσωτερική διαχείριση και για λόγους αναφοράς, αλλά μόνο τα δεδομένα που είναι απαραίτητα προς τον επιδιωκόμενο σκοπό και πάντα λαμβάνοντας τα κατάλληλα τεχνικά και οργανωτικά μέτρα για την αποτροπή μη εξουσιοδοτημένης πρόσβασης ή αποκάλυψης. 7. Θα κάνει η Εταιρία επεξεργασία των δεδομένων του Πελάτη και για εμπορικούς σκοπούς; Για το χρόνο διάρκειας της επεξεργασίας που αναφέρεται παραπάνω, η Εταιρία ίσως θα επεξεργαστεί μόνο τα ΔΠΧ σας (όχι όμως αυτά των ΕΚΔΓΙΧ). Ο Πελάτης μπορεί να εναντιωθεί ανά πάσα στιγμή σε αυτή την επεξεργασία των δεδομένων του (για εμπορικούς σκοπούς) μέσω της αποστολής σχετικού αιτήματος στον Υπεύθυνο Προστασίας Δεδομένων. Στην περίπτωση αυτή, τα δεδομένα του Πελάτη δεν θα υποβάλλονται πλέον σε επεξεργασία για εμπορικούς σκοπούς. 8. Υποβολή καταγγελίας/διαμαρτυρίας; Για οποιοδήποτε θέμα αφορά την επεξεργασία των δεδομένων σας μπορείτε να απευθύνεστε στο γραφείο Υπευθύνου Προστασίας Δεδομένων (ΥΠΔ) της Εταιρίας: τηλ. 00302152155000, email: [email protected] Επίσης, ο Πελάτης διατηρεί πάντα το δικαίωμα να απευθυνθεί στις αρμόδιες αρχές, όπου μπορεί να υποβάλει τα σχετικά παράπονα. Για την Ελλάδα: Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (Κηφισίας 1-3, Т.К. 115 23, Αθήνα), είτε ηλεκτρονικά εδώ. Πολιτική Cookies Τι είναι τα cookies και γιατί τα χρησιμοποιεί η ιστοσελίδα papaki.com? Η χρήση των cookies διευκολύνει την ιστοσελίδα να απομνημονεύει πληροφορίες σχετικά με την επίσκεψή σας συλλέγοντας χρήσιμα στοιχεία για τις προτιμήσεις της αναζήτησης σας. Τα cookies βοηθούν να βλέπουμε την απόδοση και την επισκεψιμότητα της ιστοσελίδας, βελτιώνοντας την παρουσίαση και το περιεχόμενό της, σύμφωνα με τις προτιμήσεις σας. Τα cookies (ιχνηλάτες) είναι μικρά αρχεία κειμένων που αποστέλλονται στο πρόγραμμα περιήγησης που χρησιμοποιείτε και αποθηκεύονται στον υπολογιστή σας, όσο βρίσκεστε μέσα στην ιστοσελίδα μας. Σε καμία περίπτωση τα cookies δεν περιέχουν προσωπικές πληροφορίες ή πληροφορίες, οι οποίες επιτρέπουν σε οποιονδήποτε να επικοινωνήσει μαζί σας μέσω τηλεφώνου, e-mail κ.α. Επιπλέον, με τη χρήση των cookies δεν υπάρχει πρόσβαση σε έγγραφα ή σε αρχεία του υπολογιστή σας. Οι πληροφορίες οι οποίες αποθηκεύονται στον υπολογιστή σας περιέχουν στοιχεία όπως ποιες είναι οι σελίδες που επισκεφτήκατε, η ημερομηνία και η ώρα της επίσκεψης καθώς και κάποιον τυχαίο και μοναδικό αριθμό αναγνώρισής σας, ως χρήστης. Στην ιστοσελίδα μας χρησιμοποιούμε απαραίτητα, λειτουργικά, στοχευμένα cookies, cookies τρίτων μερών και cookies αποδοσης. Στα απαραίτητα cookies δε χρειάζεται η συγκατάθεσή σας. Για τις υπόλοιπες κατηγορίες cookies θα πρέπει να μας δώσετε τη ρητή σας συγκατάθεση για να μπορέσουμε να βελτιώσουμε την επίσκεψή σας στην ιστοσελίδα μας. Η Enartia χρησιμοποιεί cookies για λειτουργικούς και στατιστικούς σκοπούς, για τον εντοπισμό δόλιας συμπεριφοράς και για τη μέτρηση της αποτελεσματικότητας των διαφημιστικών εκστρατειών και υπηρεσιών. Έχετε τη δυνατότητα να ενεργοποιήσετε ή να απενεργοποιήσετε την εγκατάσταση cookies στην συσκευή σας αλλάζοντας τις ρυθμίσεις στο σύστημα περιήγησης που χρησιμοποιείτε ανά πάσα στιγμή. Μπορείτε επίσης να ρυθμίσετε το σύστημα περιήγησης που χρησιμοποιείτε κατάλληλα προκειμένου να σας ενημερώνει πριν την εγκατάσταση ενός cookie στην συσκευή σας ή να ακολουθήσετε τις οδηγίες του συστήματος περιήγησης για να διαγράψετε όσα cookies έχουν ήδη εγκατασταθεί. Εάν χρησιμοποιείτε πολλές συσκευές, πρέπει να ρυθμίσετε το σύστημα περιήγησης σύμφωνα με τις προτιμήσεις σας σε κάθε μία από τις συσκευές σας. Εάν επιλέξετε να απενεργοποιήσετε όλα τα cookies, ενδέχεται να μην μπορείτε να απολαύσετε πλήρως τις διαδραστικές λειτουργίες της Ιστοσελίδα"
