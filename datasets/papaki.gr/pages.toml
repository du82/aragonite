title = "Ειδοποίηση Απορρήτου | Papaki"
description = "Σεβόμαστε τα θέματα ιδιωτικού απορρήτου και κάνουμε τα πάντα για να διαχειριζόμαστε σωστά τα δεδομένα των πελατών μας."
full_description = "Ειδοποίηση Απορρήτου Εισαγωγή To Papaki είναι μια εταιρεία παροχής υπηρεσιών διαδικτύου, η οποία παρέχει υπηρεσίες καταχώρησης domain names, web hosting, managed WordPress hosting, πιστοποιητικά SSL και άλλες σχετικές υπηρεσίες, με έδρα την οδό Σ, Βιομηχανική Περιοχή, Ηράκλειο, Κρήτη, Ελλαδα, με τηλέφωνο επικοινωνίας το +30.215 215 5000. Το Papaki είναι ευαίσθητo σε θέματα ιδιωτικού απορρήτου στο διαδίκτυο, γι’ αυτό πιστεύουμε ότι είναι σημαντικό να κατανοήσετε πώς επεξεργαζόμαστε τις πληροφορίες που μας παρέχετε. Αυτή η δήλωση απορρήτου ισχύει για πληροφορίες που συλλέγονται από τους ιστότοπους που διαχειριζόμαστε και ελέγχουμε, δηλαδή του https://www.papaki.com/ και του https://www.papaki.com/blog/. Κατά τη συνήθη πορεία των εργασιών, θα συλλέγουμε τόσο προσωπικές πληροφορίες για εσάς όσο και μη προσωπικές πληροφορίες που σχετίζονται με εσάς. Θα προσπαθούμε πάντοτε να προστατεύουμε αυτές τις πληροφορίες, να τις διατηρούμε εμπιστευτικές και να αποτρέπουμε την κλοπή τους. Χρησιμοποιούμε τόσο μη προσωπικά όσο και προσωπικά δεδομένα που μας παρέχετε ή συλλέγουμε, όπως αναφέρεται παραπάνω, για να επικοινωνήσουμε μαζί σας σχετικά με προσφορές για τις υπηρεσίες και τα προϊόντα μας και να σας γνωστοποιήσουμε αυτές τις προσφορές με αποτελεσματικό τρόπο. Για τους σκοπούς αυτούς, το προσωπικό του Papaki και οι εξουσιοδοτημένοι συνεργάτες θα έχουν πρόσβαση σε ορισμένα ή όλα αυτά τα μη προσωπικά και προσωπικά δεδομένα. Οι πληροφορίες που παρέχετε ή που σχετίζονται με εσάς δεν μοιράζονται ποτέ με κανέναν άλλο πέρα από το προσωπικό του Papaki ή τους εξουσιοδοτημένους συνεργάτες μας, εκτός εάν αυτό ορίζεται διαφορετικά. Αναγνωρίζουμε ότι η ευθύνη για το απόρρητο πληροφοριών είναι συνεχής και θα ενημερώνουμε την παρούσα Ειδοποίηση Ιδιωτικότητας (Privacy) σε περίπτωση εφαρμογής νέων πρακτικών απορρήτου ή υιοθέτησης νέων πολιτικών απορρήτου. Χρήση της ιστοσελίδας του Papaki Όπως ισχύει και για τις περισσότερες άλλες ιστοσελίδες, η ιστοσελίδα του Papaki συλλέγει αυτόματα ορισμένες πληροφορίες και τις αποθηκεύει σε αρχεία καταγραφής (log files). Οι πληροφορίες θα περιλαμβάνουν διευθύνσεις πρωτοκόλλου internet (IP), την περιοχή ή τη γενικότερη τοποθεσία από όπου ο υπολογιστής ή η συσκευή σας έχει πρόσβαση στο διαδίκτυο, τον τύπο του προγράμματος περιήγησης, το λειτουργικό σύστημα και άλλες πληροφορίες χρήσης σχετικά με τη χρήση της ιστοσελίδας του Papaki, συμπεριλαμβανομένων των σελίδων που επισκέπτεστε. Χρησιμοποιούμε αυτές τις πληροφορίες για να σχεδιάσουμε την ιστοσελίδα μας ώστε να ανταποκρίνεται καλύτερα στις ανάγκες των χρηστών μας. Μπορεί επίσης να χρησιμοποιήσουμε την IP διεύθυνσή σας για να βοηθήσουμε στη διάγνωση προβλημάτων με τον server μας και να διαχειριστούμε την ιστοσελίδα μας, να αναλύσουμε τις τάσεις, να παρακολουθήσουμε τις κινήσεις των επισκεπτών και να συλλέξουμε ευρείες δημογραφικές πληροφορίες που μας βοηθούν να προσδιορίσουμε τις προτιμήσεις των επισκεπτών, καθώς και για λόγους πρόληψης απάτης. Η ιστοσελίδα του Papaki χρησιμοποιεί επίσης cookies και web beacons. Δεν παρακολουθεί χρήστες όταν μεταβαίνουν σε ιστοσελίδες τρίτων μερών, δεν παρέχει στοχευμένη διαφήμιση σε αυτές και επομένως δεν ανταποκρίνεται στα μηνύματα Do Not Track (DNT). Δραστηριότητα ιστοσελίδας Αρχεία καταγραφής (Log Files) Όπως ισχύει για τις περισσότερες ιστοσελίδες, συλλέγουμε αυτόματα ορισμένες πληροφορίες και τις αποθηκεύουμε σε αρχεία καταγραφής. Αυτές οι πληροφορίες μπορεί να περιλαμβάνουν IP διευθύνσεις, τύπο προγράμματος περιήγησης, σελίδες παραπομπής / εξόδου, λειτουργικό σύστημα, ημερομηνία / ώρα επίσκεψης και δεδομένα clickstream. Θα συλλέξουμε, επίσης, πληροφορίες για συγκεκριμένες συσκευές (όπως την έκδοση του λειτουργικού συστήματος). Χρησιμοποιούμε αυτές τις πληροφορίες για να αναλύσουμε τις τάσεις, να διαχειριστούμε την ιστοσελίδα και να παρακολουθήσουμε τον τρόπο αλληλεπίδρασης των επισκεπτών με την ιστοσελίδα. Cookies Ένα cookie είναι ένα μικρό αρχείο που αποθηκεύεται στον υπολογιστή ενός χρήστη για σκοπούς τήρησης αρχείων. To Papaki συνήθως χρησιμοποιεί ταυτόχρονα session cookies και μόνιμα cookies. Χρησιμοποιούμε session cookies για να σας διευκολύνουμε να περιηγηθείτε στην ιστοσελίδα μας. Ένα session cookie λήγει όταν κλείσετε το πρόγραμμα περιήγησης. Ένα μόνιμο cookie παραμένει στον σκληρό σας δίσκο για μεγάλο χρονικό διάστημα και μπορεί να χρησιμοποιηθεί όταν επιστρέψετε στην ιστοσελίδα μας για να σας αναγνωρίσουμε ή/ και να σας επιτρέψουμε να συνδεθείτε, αλλά και σε ιστοσελίδες τρίτων με σκοπό το online marketing. Μπορείτε να καταργήσετε τα μόνιμα cookies ακολουθώντας τις οδηγίες που παρέχονται στο αρχείο βοήθειας του browser σας. Όταν συνδέεστε στο περιβάλλον διαχείρισης του λογαριασμού σας στο Papaki μπορείτε να επιλέξετε “Απομνημόνευση Email / Username”, ώστε μέσω ενός μόνιμου cookie να αποθηκεύεται ένα session ID για να σας αναγνωρίζουμε μεταξύ των sessions του προγράμματος περιήγησης. Μπορείτε να καταργήσετε αυτό το cookie κάνοντας κλικ στο κουμπί / link Αποσύνδεσης. Αν απορρίπτετε τα cookies, μπορείτε να συνεχίσετε να χρησιμοποιείτε την ιστοσελίδα μας, αλλά η ικανότητά σας να χρησιμοποιείτε ορισμένες περιοχές της ιστοσελίδας, όπως το control panel, οι διαγωνισμοί ή οι έρευνες, θα είναι περιορισμένη και ενδεχομένως να χρειαστεί να καταχωρίσετε ξανά κάποια προσωπικά στοιχεία. Μάρκετινγκ & Διαφήμιση, Άλλες Ιστοσελίδες Συνεργαζόμαστε με εταιρείες τρίτων, συμπεριλαμβανομένων -αλλά όχι αποκλειστικά- της Google και του Facebook, για την τοποθέτηση και παρακολούθηση διαφημίσεων σε ιστοσελίδες τρίτων. Όπως και οι περισσότεροι διαφημιζόμενοι, τοποθετούμε διαφημίσεις όπου νομίζουμε ότι θα είναι πιο συναφείς με τους πελάτες μας. Τοποθετούμε διαφημίσεις αναπτύσσοντας και χρησιμοποιώντας τα δικά μας εργαλεία μάρκετινγκ που μπορούν να συνδυάσουν online και offline πληροφορίες σχετικά με τους τρέχοντες και μελλοντικούς πελάτες μας. Οι διαφημιστικές εταιρείες διαδικτύου που παρέχουν αυτές τις υπηρεσίες έχουν τις δικές τους πολιτικές απορρήτου και δεν υπόκεινται στη δική μας δήλωση προστασίας προσωπικών δεδομένων. Πολλές από αυτές τις εταιρείες παρέχουν τρόπους για να αποφύγετε τη στοχευμένη διαφήμιση που παρέχεται από ή μέσω αυτών. Βασίζουμε αυτές τις καμπάνιες σε μη προσωπικές πληροφορίες που συλλέγονται για εσάς (π.χ. μπορεί να παρακολουθήσουμε τη δραστηριότητά σας στην ιστοσελίδα μας και στη συνέχεια να προβάλλουμε διαφημίσεις μέσω ιστοσελίδων τρίτων που σχετίζονται με τα cookies αυτών των δραστηριοτήτων) ή σε προσωπικά αναγνωρίσιμες πληροφορίες των cookies (π.χ. που σχετίζονται με ορισμένες κινήσεις που έχουν συλλεχθεί, ώστε να προσαρμόσουμε μια πιο σχετική με εσάς ενημερωτική καμπάνια). Δικαιώματα υποκειμένων δεδομένων Αυτή η ειδοποίηση απορρήτου έχει σκοπό να σας παρέχει πληροφορίες σχετικά με τα προσωπικά δεδομένα που συλλέγει το Papaki για εσάς και τον τρόπο με τον οποίο τα χρησιμοποιεί. Εάν έχετε οποιεσδήποτε ερωτήσεις, επικοινωνήστε μαζί μας στο [email protected]. Εάν επιθυμείτε να επιβεβαιώσετε ότι το Papaki επεξεργάζεται τα προσωπικά σας δεδομένα ή να έχετε πρόσβαση στα προσωπικά δεδομένα που μπορεί να έχει το Papaki για εσάς, επικοινωνήστε μαζί μας στο [email protected]. Ασφάλεια των πληροφοριών σας Για να προστατεύσουμε το απόρρητο των προσωπικών δεδομένων που διαβιβάζετε μέσω της χρήσης αυτή της ιστοσελίδας, διατηρούμε φυσικές, τεχνικές και οργανωτικές διασφαλίσεις. Ενημερώνουμε και δοκιμάζουμε την τεχνολογία ασφαλείας που χρησιμοποιούμε σε συνεχή βάση. Περιορίζουμε την πρόσβαση στα προσωπικά σας δεδομένα, μόνο στο προσωπικό που πρέπει να γνωρίζει αυτές τις πληροφορίες για να σας προσφέρει προνόμια και υπηρεσίες. Επιπλέον, εκπαιδεύουμε το προσωπικό μας πάνω στη σημασία της εμπιστευτικότητας και τη διατήρηση της ιδιωτικότητας και της ασφάλειας των πληροφοριών σας. Δεσμευόμαστε να λάβουμε τα κατάλληλα πειθαρχικά μέτρα για την επιβολή της ευθύνης εχεμύθειας του προσωπικού μας."
