$('.form-selectors input[value="1"]').attr('checked','checked'); toggleForm(1); } }); function toggleForm(id){ $('.view-abuse .views-row').hide(); $('.view-abuse .views-row-'+id).show(); window.location.hash = '#form'+id; $('.view-abuse .views-row form').attr('action','https://www.papaki.com'+window.location.pathname.replace('http:','https:')+'#form'+id); var left=50+((parseInt(id)-1)*30); //$('#arrow-movable').css('left',left+'px'); if(id!='1'){ $('.view-abuse .views-row-'+id+' fieldset.captcha .form-item').html($('.view-abuse .views-row-1 fieldset.captcha #recaptcha_widget_div').wrap('<div>').parent().html()); } } Αναφορά Περιεχομένου Στην ομάδα του Papaki, αντιμετωπίζουμε με κάθε σοβαρότητα όλες τις αναφορές παράνομης δραστηριότητας στα sites που φιλοξενούνται στους servers μας και αφοσιωνόμαστε στην έρευνα και την επίλυσή τους. Παρακάτω σας παρέχουμε 4 διαφορετικές φόρμες αναφοράς, ανάλογα με τη φύση του προβλήματος που προέκυψε. Επιλέξτε προσεκτικά την κατάλληλη φόρμα και προχωρήστε στην αποστολή της αναφοράς σας στο [email protected]. Εναλλακτικά, καλέστε μας στο 211 800 2275. Δείτε περισσότερα στους Όρους Χρήσης μας (§ 5.52). Copyright - Παραβίαση πνευματικών δικαιωμάτων Περιεχόμενο για ενηλίκους - Προσβλητικό περιεχόμενο Phishing - Ηλεκτρονικό ψάρεμα / Υποκλοπή στοιχείων Παράβαση όρων χρήσης ή άλλη παράνομη δραστηριότητα Copyright - Παραβίαση Πνευματικών Δικαιωμάτων Το email σας * Θέμα * Url σελίδας που εντοπίσατε το πρόβλημα * Είστε εξουσιοδοτημένος να ενεργήσετε εκ μέρους του νόμιμου ιδιοκτήτη του περιεχομένου * Ναι Όχι Με την παρούσα δηλώνω ότι υποβάλλω την συγκεκριμένη αναφορά με καλή πίστη. Οι πληροφορίες και οι ισχυρισμοί που περιέχονται σε αυτήν είναι ακριβείς και πλήρεις. * Ναι Όχι Προσδιορισμός περιεχομένου πνευματικής ιδιοκτησίας * Προσδιορισμός παράνομου περιεχομένου * Διεύθυνση * Τηλέφωνο * Μήνυμα Τα δεδομένα που μοιράζεσαι με το Papaki χρησιμοποιούνται μόνο για να επικοινωνήσουμε μαζί σου και με βάση τους Όρους Χρήσης. Μάθε περισσότερα στην Πολιτική Απορρήτου. CAPTCHAΑυτή η ερώτηση υπάρχει για να αποτραπούν οι αυτοματοποιημένες υποβολές spam. Περιεχόμενο για Ενηλίκους - Προσβλητικό περιεχόμενο Συμπληρώστε αυτή τη φόρμα αν συναντήσατε, ανάμεσα στα sites που φιλοξενεί το Papaki, περιεχόμενο που βρήκατε παράνομο, βλαβερό, απειλητικό, προσβλητικό, ενοχλητικό, συκοφαντικό, δυσφημιστικό, χυδαίο, άσεμνο, λιβελογραφικό, δείχνει εμπάθεια ή εκφράζει φυλετικές, εθνικές ή άλλες διακρίσεις. Η ομάδα του Papaki θα ελέγξει το περιεχόμενο, θα κρίνει εάν όντως ανήκει σε αυτές τις κατηγορίες και αναλόγως θα προβεί στις απαραίτητες ενέργειες. Το email σας * Θέμα * Αναφορά προσβλητικού περιεχομένου, περιεχομένου ενηλίκων, άσεμνου κτλ. ULR σελίδας προσβλητικού περιεχομένου * Μήνυμα Τα δεδομένα που μοιράζεσαι με το Papaki χρησιμοποιούνται μόνο για να επικοινωνήσουμε μαζί σου και με βάση τους Όρους Χρήσης. Μάθε περισσότερα στην Πολιτική Απορρήτου. CAPTCHAΑυτή η ερώτηση υπάρχει για να αποτραπούν οι αυτοματοποιημένες υποβολές spam. Phishing - Ηλεκτρονικό ψάρεμα/Υποκλοπή στοιχείων Εάν πιστεύετε ότι ένα site χρησιμοποιείται για phishing και παράνομα συλλέγει προσωπικά στοιχεία, παρακαλούμε συμπληρώστε την παρακάτω φόρμα. Η ομάδα του Papaki θα ελέγξει το περιεχόμενο, θα κρίνει εάν όντως ανήκει σε αυτήν την κατηγορία και αναλόγως θα προβεί στις απαραίτητες ενέργειες. Το email σας * Θέμα * Phishing/Υποκλοπή στοιχείων ULR σελίδας παράνομου περιεχομένου * Μήνυμα Τα δεδομένα που μοιράζεσαι με το Papaki χρησιμοποιούνται μόνο για να επικοινωνήσουμε μαζί σου και με βάση τους Όρους Χρήσης. Μάθε περισσότερα στην Πολιτική Απορρήτου. CAPTCHAΑυτή η ερώτηση υπάρχει για να αποτραπούν οι αυτοματοποιημένες υποβολές spam. Παράβαση Όρων Χρήσης ή άλλη παράνομη δραστηριότητα Εάν πιστεύετε ότι κάποιο site δε λειτουργεί σύμφωνα με τους Όρους Χρήσης του Papaki ή διατηρεί κάποια άλλη παράνομη δραστηριότητα, παρακαλούμε συμπληρώστε αυτή τη φόρμα. Η ομάδα του Papaki θα ελέγξει το περιεχόμενο, θα κρίνει εάν όντως ισχύει η παράβαση και αναλόγως θα προβεί στις απα