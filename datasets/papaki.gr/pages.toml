 των μουσικών φράσεων, το σχήμα του προϊόντος ή της συσκευασίας του. Ποια είδη εμπορικών σημάτων υπάρχουν; Υπάρχουν τρια είδη εμπορικών σημάτων: Το Εθνικό, το Ευρωπαϊκό και το Διεθνές. Το Εθνικό σήμα κατατίθεται στο Τμήμα Σημάτων του Υπουργείου Εμπορείας και Ανάπτυξης και ισχύει (δηλαδή υπάρχει και προστατεύεται) μόνο για την Ελλάδα. Το Ευρωπαϊκό Σήμα (Σήμα της Ευρωπαϊκής Ένωσης, πρώην Κοινοτικό σήμα) κατατίθεται στο Ευρωπαϊκό Γραφείο Διανοητικής Ιδιοκτησίας και έχει ισχύ στις 28 (μέχρι στιγμής) χώρες της ΕΕ, όπου και προστατεύεται. Το Διεθνές σήμα προϋποθέτει να έχει προηγηθεί κατάθεση ή καταχώριση ελληνικού ή Σήματος της ΕΕ. Με αίτηση του δικαιούχου, ο Παγκόσμιος Οργανισμός Διανοητικής Ιδιοκτησίας (WIPO) φροντίζει ώστε το ίδιο σήμα να διαβιβαστεί και να εξεταστεί ως κατάθεση σήματος σε όσες συμβαλλόμενες χώρες επιθυμεί ο δικαιούχος. Το Διεθνές σήμα δεν είναι, λοιπόν, ένα σήμα που ισχύει σε όλο τον κόσμο: είναι δέσμη εθνικών σημάτων, καθένα από τα οποία καταρχήν αντιμετωπίζεται ως κατάθεση εθνικού σήματος στις χώρες που επιλέγει ο δικαιούχος. Ποιο είδος εμπορικού σήματος μπορώ να κατοχυρώσω με το Papaki; Προς το παρόν, το Papaki παρέχει μόνο την υπηρεσία κατοχύρωσης Εθνικών σημάτων. Πόσος χρόνος χρειάζεται για να εγκριθεί η κατοχύρωση ενός εμπορικού σήματος; Η κατοχύρωση εμπορικού σήματος είναι μια διαδικασία που απαιτεί χρόνο τόσο για τη συγκέντρωση των δικαιολογητικών όσο και για τον έλεγχο από τις αρμόδιες υπηρεσίες. Από τη στιγμή που θα υποβληθεί η αίτηση κατοχύρωσης του σήματος, θα χρειαστούν περίπου 5 μήνες για να ελεγχεί και να εγκριθεί από την αρμόδια αρχή. Πόσο διαρκεί η κατοχύρωση ενός Εθνικού εμπορικού σήματος; Εφόσον κατοχυρωθεί ένα εμπορικό σήμα, αποτελεί προϊόν πνευματικής ιδιοκτησίας και περιουσιακό στοιχείο του δικαιούχου για 10 έτη. Κατόπιν, εφόσον ο δικαιούχος το επιθυμεί, θα πρέπει να προχωρήσει στη ανανέωση του εμπορικού σήματος. Τι είναι οι κλάσεις σημάτων; Τα προϊόντα και οι υπηρεσίες για τα οποία κατατίθενται τα σήματα, εθνικά, ευρωπαϊκά ή διεθνή, ταξινομούνται σύμφωνα με τη διεθνή ταξινόμηση προϊόντων και υπηρεσιών σε 45 κατηγορίες (κλάσεις). Για την κατοχύρωση ενός εμπορικού σήματος ο ενδιαφερόμενος, με τη βοήθεια της ομάδας του Papaki, θα πρέπει να επιλέξει σε ποιά/ποιες κλάσεις ανήκει το προϊόν ή η υπηρεσία που παρέχει. Κατοχύρωσε απλά και γρήγορα το εμπορικό σου σήμα με το Papaki. Κάνε την αίτηση σου!"
