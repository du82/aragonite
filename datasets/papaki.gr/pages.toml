πόρους ανά χρήστη, από ένα αντίστοιχο shared hosting πακέτο. Δωρεάν μεταφορά Με την αγορά κάθε semi dedicated hosting πακέτου, σου προσφέρουμε δωρεάν μεταφορά του site σου από άλλον πάροχο στο Papaki, από εξειδικευμένο Migration Specialist (εντός 90 ημερών από την ημερομηνία αγοράς). 3 backup ημερησίως Για να διασφαλίσουμε ότι τα δεδομένα του site σου θα είναι πάντα διαθέσιμα, στα semi dedicated πακέτα πραγματοποιούμε 3 backup κάθε μέρα, ώστε να έχει διαθέσιμα αντίγραφα ανά πάσα στιγμή. Hacked WP Cleanup Εάν το site σου έχει παραβιαστεί, η ομάδα μας αναλαμβάνει να κάνει έλεγχο και καθαρισμό σε βάθος, με μια επιπλέον χρέωση. Συμπλήρωσε τη φόρμα και θα επικοινωνήσουμε μαζί σου το συντομότερο. Φόρμα επικοινωνίας Χαρακτηριστικά Semi Dedicated Πακέτων Standard χαρακτηριστικά I/O Entry Processes MySQL Connections Plesk Platform Dedicated IP (€2.90/μήνα) Απεριόριστες MySQL databases Απεριόριστοι email λογαριασμοί Απεριόριστα Subdomains Unmetered Mailbox NVMe Web Hosting Φιλοξενία στo Βέλγιο Δωρεάν SSL Let’s Encrypt SpamExperts 3 BackUp / ημέρα Προσωπικοί Nameservers Απεριόριστα Domain Alias WordPress Toolkit WordPress / Drupal / Joomla / Magento ready FTP Πρόσβαση Error Logs File Manager Crontab Manager SSH πρόσβαση Υποστηριζόμενες Τεχνολογίες PHP MySQL HTTP/2 (Linux πακέτα) Υποστήριξη Git NGINX MySQL Caching Gzip Compression PHP Extensions Node.js AJAX Ruby / Ruby on Rails Python MySQLi / cURL / GD / Mbstring / MCrypt / PDO_MYSQL JavaScript DHTML XML Perl Το δικό σου CGI-BIN FastCGI .htaccess SSI - Server Side Includes Zend Guard Loader ionCube Παρεχόμενες Υπηρεσίες 24/7/365 Network and Web Server Monitoring Καταρτισμένη Knowledge Base SpeedCache® Προστασία των emails Εγγύηση επιστροφής χρημάτων Δωρεάν μεταφορά hosting Συχνές Ερωτήσεις Τι είναι το Semi Dedicated Hosting; Το semi dedicated hosting είναι ένας τύπος φιλοξενίας που συνδυάζει τα πλεονεκτήματα του shared και του dedicated hosting, αφού απολαμβάνεις τα πλεονεκτήματα που προσφέρει η dedicated φιλοξενία χωρίς, όμω