description = "Μάθε τα πάντα για τα badges του Papaki, δες σε ποια κατηγορία ανήκεις και απόλαυσε όλα τα προνόμια που δικαιούσαι!"
full_description = "Papaki Badges Δες άμεσα σε ποια κατηγορία χρήστη ανήκεις και βρες εύκολα εκπτώσεις και άλλα προνόμια που δικαιούσαι στο Papaki! Το μόνο που χρειάζεται για να αποκτήσεις το πρώτο σου badge, είναι να έχεις ένα domain στο Papaki και να έχεις συμπληρώσει το προφίλ σου. Δες αναλυτικά όλα τα badges στον παρακάτω πίνακα: Badge Κριτήρια Προνόμια Κριτήρια Tουλάχιστον 1 υπηρεσία Πλήρες προφίλ Κριτήρια 11-20 Domain Names Πλήρες προφίλ Προνόμια Έκπτωση στα .GR, .EU, .COM, .NET, .ORG, .INFO domains και όλα τα νέα gTLDs. Δείτε τις εκπτώσεις για το Junior Badge στον τιμοκατάλογο. 400Mb Δωρεάν Hosting (αντί 100Μb) Κριτήρια 21-30 Domain Names Πλήρες προφίλ Προνόμια Έκπτωση στα .GR, .EU, .COM, .NET, .ORG, .INFO domains και όλα τα νέα gTLDs. Δείτε τις εκπτώσεις για το Senior Badge στον τιμοκατάλογο. 400Mb Δωρεάν Hosting (αντί 100Μb) Κριτήρια 31-40 Domain Names Πλήρες προφίλ Προνόμια Έκπτωση στα .GR, .EU, .COM, .NET, .ORG, .INFO domains και όλα τα νέα gTLDs. Δείτε τις εκπτώσεις για το Dedicated Badge στον τιμοκατάλογο. 400Mb Δωρεάν Hosting (αντί 100Μb) Κριτήρια 40+ Domain Names Πλήρες προφίλ Προνόμια Έκπτωση στα .GR, .EU, .COM, .NET, .ORG, .INFO domains και όλα τα νέα gTLDs. Δείτε τις εκπτώσεις για το Superstar Badge στον τιμοκατάλογο. 400Mb Δωρεάν Hosting (αντί 100Μb) Δυνατότητα καταχώρησης στους Experts Κριτήρια Σε ορισμένους πελάτες με συγκεκριμένα κριτήρια, δίνεται το VIP badge Προνόμια Έκπτωση στα .GR, .EU, COM, .NET, .ORG, .INFO domains και όλα τα νέα gTLDs. Για το VIP ισχύουν οι εκπτώσεις του Superstar Badge. 400Mb Δωρεάν Hosting (αντί 100Μb) Δυνατότητα καταχώρησης στους Experts Προσωπικός Account Manager Επιπλέον προνόμια Οι εκπτώσεις δεν λειτουργούν συνδυαστικά με άλλες προσφορές ή κουπόνια έκπτωσης στο Papaki. Aναζήτησε και κατοχύρωσε και εσύ το δικό σου domain name στο Papaki! Κατοχύρωση"
