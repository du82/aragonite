title = "Home - papermill 2.4.0 documentation"
full_description = "Welcome to papermill¶ Papermill is a tool for parameterizing and executing Jupyter Notebooks. Papermill lets you: parameterize notebooks execute notebooks This opens up new opportunities for how notebooks can be used. For example: Perhaps you have a financial report that you wish to run with different values on the first or last day of a month or at the beginning or end of the year, using parameters makes this task easier. Do you want to run a notebook and depending on its results, choose a particular notebook to run next? You can now programmatically execute a workflow without having to copy and paste from notebook to notebook manually. Python Version Support¶ This library currently supports python 3.7+ versions. As minor python versions are officially sunset by the python org papermill will similarly drop support in the future. Documentation¶ These pages guide you through the installation and usage of papermill. Installation Installing papermill Installing In-Notebook language bindings Usage Using papermill Command Line Interface Extending papermill Extending papermill through entry points Extending papermill by contributing to it Troubleshooting NoSuchKernel Errors (using Conda) Change Log Unreleased 2.4.0 2.3.4 2.3.3 2.3.2 2.3.1 2.3.0 2.2.1 2.2.0 2.1.3 2.1.2 2.1.1 2.1.0 2.0.0 1.2.1 1.2.0 1.1.0 (This version should be avoided for several known issues fixed in 1.2.0) 1.0.1 1.0.0 0.19.1 0.19.0 0.18.2 0.18.1 0.18.0 0.17.0 0.16.2 0.16.1 0.16.0 0.15.1 0.15.0 0.14.2 0.14.1 0.13.4 (no code changes) 0.13.3 0.13.2 0.13.1 0.13.0 0.12.6 0.12.5 0.12.4 0.12.3 0.12.2 0.12.1 0.12.0 API Reference¶ If you are looking for information about a specific function, class, or method, this documentation section will help you. Reference CLI papermill.cli Command Line options Workflow papermill.engines papermill.execute papermill.clientwrap Language Translators Translators Python R Julia Scala Functions Input / Output papermill.iorw Storage Azure AWS Utilities Utils Exceptions Log Indices and tables¶ Index Module Index Search Page"
