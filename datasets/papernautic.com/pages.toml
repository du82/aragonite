full_description = "How to Make a Paper Bird Paper birds are one of the most iconic forms of paper craft. The origami crane is a ubiquitous classic, but the variety of paper bird models and designs go well beyond bird origami folds. The folding of points and corners in the art of origami lends itself to the creation of many bird-like forms, so some form of a paper bird is one of the first representational paper crafts we try as children. The elegance of bird paper models is ageless, however, and this page explores the variety and richness of this important aspect of paper art. Paper Bird Models How To Make An Easy Origami Crow The origami bird base can be used to make many models beside the good old Japanese crane, including other birds. This relatively simple origami crow is one such example and it’s a great model to keep standing on…Read more How To Make An Easy Origami Paper Crane Origami cranes are the most recognisable of the traditional Japanese folded paper models. The origami crane has become an icon for the art of paper folding itself and all the cultural artifacts that surround it. This paper bird…Read more How To Make An Easy Origami Pigeon Pretty much the first thing most people discover in origami is some sort of bird model. Usually the traditional crane, but there are a lot of origami birds, and many of them can be quite tricky for the…Read more Bird Cameo – Paper Sculpture Sketch Sculpture always brings with it a sense of agelessness, and also a sense of something that takes long hours, days and months to hew from the materials at hand. This is true, and can be even for paper…Read more"
