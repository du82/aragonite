title = "How To Make An Easy Origami Butterfly - Papernautic"
description = "Models that fold paper in an unexpected way and produce results that are a lot more impressive than the work you put in are always great. This simple origami"
full_description = "How To Make An Easy Origami Butterflyby SamirPaper Art Videos Models that fold paper in an unexpected way and produce results that are a lot more impressive than the work you put in are always great. This simple origami butterfly is one such wonder you should try your hand at. Simple Origami Butterfly Instructions Step 1 A square paper, colour-side down is where we’ll start. Fold along one diagonal of the square. Unfold and fold along the second diagonal. Step 2 Now flip the paper over and fold it in half along that central point formed by the last two folds. Step 3 Open it all up and with the colour side up, the model can now collapse into this double triangle form. Step 4 With the longest side of the triangle towards you, lift one of the corners on the side and fold it up to the top corner of the triangle. Step 5 Repeat on the other half. Step 6 Now flip it over and lift the single central corner flap towards the longest edge of the triangle and over it. Fold the central part of the line, but not the sides edges. Let those curve. Step 7 Flip it over and you’ll see a small triangle poking past the longest edge. You need to fold that back over to lock the whole thing in place. Step 8 Fold the whole thing in half along the cenral line so that our small locking triangle is also creased at the centre and remains more tightly in place. Step 9 Your lovely little origami butterfly is ready. P.S. Please subscribe to Papernautic on YouTube to keep track of the latest videos and tutorials. Tags:origamiorigami instructionsorigami videopaper insect previousHow To Make An Easy Double-Hulled Paper BoatnextHow To Make An Easy Origami Windmill"
