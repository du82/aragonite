["https://papiberlin.de/resourcen"]
title = "Eltern Ressourcen | Papi Berlin"
description = "Willkommen bei unseren Eltern Ressourcen. Hier sammeln wir Links zu Webseiten, die wir für hilfreich halten."
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Willkommen bei unseren Eltern Ressourcen. Hier sammeln wir Links zu Webseiten, die wir für hilfreich halten. Bis jetzt sind schon 104 zusammengekommen. Wenn du eine Webseite kennst, die hier fehlt, dann schreib uns doch über unser Kontaktformular oder komm in unseren Slack-Chat. Brettspiele sind eine tolle Freizeitbeschäftigung mit den Kids. Entsprechend groß ist der Markt hierzu. Welches Rad? Welches Produkt? Hier eine kleine Übersicht mit Seiten, die dir bei der Auswahl helfen. Alles rund um Bücher und Zeitschriften. Zum Vorlesen, zum vorlesen lassen, zum genießen auf der Couch. Urlaub, die schönste Zeit des Jahres. Und damit es auch wirklich funktioniert, sind hier ein paar nützliche Seiten. In Berlin gibt es sehr viele tolle Veranstaltungen für Familien. Nur was passiert wo? Hier gibt es nützliche Links dazu.'
