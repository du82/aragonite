["https://papiberlin.de/pages/corona-resources"]
title = "Corona Elternressourcen | Papi Berlin"
description = "Gründer von Papi Berlin, Softwareentwickler und Vater"
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Eltern haben gerade eine besondere Herausforderung durch Covid-19. Homeoffice, Kinder bespaßen und dabei vielleicht noch ein wenig Schulstoff pauken? Das ist schon ziemlich krass. Das wichtigste gerade ist: versucht nicht perfekt zu sein. Es ist okay, wenn das Kind mal nicht alle Hausaufgaben macht. Versucht euch Freiräume zu schaffen. Ich versuche euch hier mit einer langen Liste mit vielen Inspirationen unter die Arme zu greifen. Das Ganze ist relativ locker gruppiert, die Grenze von Vorschulkind zu Schulkind sind ja mitunter recht fließend. Danke auch an die vielen Menschen, die mir Links geschickt haben! Ganz besonders zu erwähnen ist dabei die Anna Seghers Schule für deren ausführliche Liste 💚.'
