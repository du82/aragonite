full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Alles rund um Bücher und Zeitschriften. Zum Vorlesen, zum vorlesen lassen, zum genießen auf der Couch. Ein kindgerechter Türöffner in die Welt der Bücher, intelligent, einfühlsam und ganz ohne Werbung. Ein Antiquariat und Buchhandlung in Berlin mit einer umfangreichen Sammlung von preisreduzierten Büchern. LesenMit.app prüft regelmäßig Apps und gibt euch Tipps, wie diese in Familie, Kita, Kindergarten, Hort und Schule genutzt werden können. POLLE ist ein Comic-Magazin für Kinder ab 7 Jahren. Viele wunderbare Künstler*innen aus aller Welt veröffentlichen darin ihre brandneu gezeichneten Geschichten: kurze & längere, lustige & ernste, verrückte & alltägliche. Eine Plattform für digitale Bilderbuchgeschichten in verschiedenen Sprachen für Kinder. Enthalten in deiner Bibliotheksmitgliedschaft. Eine Sammlung von Kindercomics vom Verlag Reprodukt, die eine breite Auswahl an tollen Comics für Kinder bietet. Der Verbund der öffentlichen Bibliotheken in Berlin, der einen umfassenden Zugang zu einer Vielzahl von Medien bietet. Wer Kinder hat, sollte unbedingt eine Bibliothekskarte haben.'
