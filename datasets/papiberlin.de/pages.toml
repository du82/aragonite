["https://papiberlin.de/pages/dreissigminuten"]
title = "Rezension:  Dreißig Minuten, dann ist aber Schluss! | Papi Berlin"
description = "Gründer von Papi Berlin, Softwareentwickler und Vater"
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Patricia Cammarata ist einigen von euch vielleicht schon ein Begriff. Entweder als @dasnuf auf Twitter, durch einen der vielen Podcasts, z. B. Mit Kindern Leben oder durch eines ihrer Bücher. Falls nicht: einfach mal die Links anklicken und ansehen/hören. Lohnt sich sehr. Ihr aktuelles Buch dreht sich rund um das große Thema Medienerziehung. Der Titel klingt dabei platter als der Inhalt wirklich ist. Sie erklärt sehr genau und humorvoll, warum diese starre Regel quatsch ist, wie Kinder heutzutage Medien nutzen und worauf wir Eltern aufpassen sollten. Angefangen von YouTube, über TikTok bis zum allseits gern gehörten Angstthema “Mein Kind ist Internetsüchtig!!1!” umfasst das Buch wirklich alles, was Eltern wissen sollten. Gerade jetzt wegen Corona gibt es ja bei vielen Eltern sorgen um die Zeit, die Kinder notgedrungen Medien konsumieren. Dieses Buch wird euch beruhigen und viele Tipps an die Hand geben. Bei allen Themen gibt es auch tonnenweise Links, die noch weitere Aspekte hinzufügen oder das Thema vertiefen. Alleine die sieben Seiten(!!) Quellenangabe sind es wert, das Buch zu kaufen.'
