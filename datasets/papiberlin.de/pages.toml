["https://papiberlin.de/pages/lost-in-play"]
title = "Lost in Play | Papi Berlin"
description = "Gründer von Papi Berlin, Softwareentwickler und Vater"
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Anfang des Monats fragte mich meine Tochter nach einem neuen Spiel für ihr iPad. Zum Glück wusste ich schon das perfekte Spiel, das wir gemeinsam spielen konnten: Lost in Play. Ich habe es letzten Monat ein paar Minuten gespielt und wartete darauf, dass mein Kind etwas mit mir spielen wollte. Lost in Play ist eine tolle Möglichkeit, Kinder an Point-and-Click-Abenteuer heranzuführen. Sie müssen nicht in der Lage sein lesen können; alle Figuren sprechen in einer Fantasiesprache, und schwierige Rätselabschnitte können übersprungen werden. Zusammen mit einem nahezu perfekten Hilfesystem war dieses Spiel für meine 6-jährige Tochter einfach perfekt. Sie konnte es nicht mehr weglegen und w wollte am nächsten Tag unbedingt weiterspielen. Nachdem sie das Spiel mit mir beendet hatte, hat sie es noch zwei weitere Male alleine durchgespielt. Ich musste nur bei drei Rätseln helfen, die leider nicht übersprungen werden konnten und zu schwer für sie waren. Für unsere ist das Spiel eine 5/5. Das erste Kapitel kann kostenlos im iOS-Store gespielt werden. Die Vollversion kostet 6,99 €, und zu diesem Preis ist es echt ein Schnäppchen. Es gibt keine Lootboxen oder Werbung.'
year_published = 2024
