full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Bambooland is a popular destination for birthday parties because of its accessibility and casual approach. Entdeckum offers not only experimentation courses for children but also researcher-themed birthday parties. Hurricane Factory lets up to 10 kids eat, celebrate and do a full run through the sky diving facility. MyJump offers birthday parties with a separate space, food and drinks and access to all its trampolines. With wishlists of your children, you can save yourself a lot of stress around birthdays and celebrations. No duplicate gifts, no long chats about what could be gifted.'
