["https://papiberlin.de/en/resourcen/podcast"]
title = "Podcasts (Parents) | Papi Berlin"
description = "Parenting podcasts, the perfect companion for washing dishes, cleaning up, folding laundry."
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Providing a beautiful childhood for our children is good and fine – but how do we manage not to lose ourselves in the process? How do we get through the most challenging time of our lives successfully? Grab a cushion and join us by the artgerecht campfire. Mothers and fathers tell unfiltered stories of their lives as parents. About insane luck. About normal madness. And about their dark moments. How do you best talk about challenges in family life? Many parents share the same concerns and read one parenting guide after another. Everyone has a different idea of parenting, and worries are rarely openly discussed. In the Family Council podcast, we visit the educationalist Katia Saalfrank and ask her your questions about parenting and family life. The podcast for parents with heart and mind. From A like getting dressed to Z like brushing teeth - staying in loving connection even when things get challenging at home. The Tilt Parenting Podcast is a podcast about learning disabilities, special education, ADHD, autism, giftedness, twice-exceptionality, and more. The weekly show features transformational interviews and conversations with authors, parenting experts, educators, and other parents, as well as insightful conversations between Debbie and her differently wired child, all aimed at supporting parents raising differently wired kids. The podcast from Vaterwelten.de has some nice interviews with fathers. Much love for this 👨‍👧!'
