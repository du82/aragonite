full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} ENE MENE BU ist eine Kika Sendung, bei der Kinder basteln, malen, entdecken, spielen und Geschichten erfinden. Eine kreative Plattform für Kinder, um interaktive Spiele, Animationen und mehr zu programmieren und zu teilen. Die Khan-Academy bietet viele Kurse, von der Vorschule bis zum Abitur. Khan-Academy Kids, die App für die Vorschule, ist leider momentan nur auf Englisch verfügbar. Eine Programmierplattform für Kinder, die spielerisches Lernen und die Grundlagen des Programmieren fördert. Eine Lernplattform mit digitalen Lernmaterialien und Nachhilfeangeboten für Schülerinnen und Schüler vom Duden Verlag. Eine Online-Plattform, die es ermöglicht, interaktive Geschichten, Spiele und Animationen zu erstellen und zu teilen. Eine visuelle Programmierumgebung für junge Kinder, die ihnen ermöglicht, Geschichten und Spiele zu erstellen. Einer der Klassiker im deutschen Kinderfernsehen. Natürlich auch mit eine Webseite und App mit jede Menge alter Folgen. Sofatutor bietet Schüler*innen aller Klassenstufen die Möglichkeit, digital, zeitlich flexibel und ortsunabhängig zu lernen.'
