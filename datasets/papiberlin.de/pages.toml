["https://papiberlin.de/codeofconduct"]
title = "Verhaltenskodex | Papi Berlin"
description = "Eine Community für aktive Väter in Berlin."
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Wir haben als ein wichtiges Ziel gesetzt, die größtmögliche Anzahl an Beitragenden mit den vielfältigsten und unterschiedlichsten Hintergründen einzubeziehen. Wir sehen es als unsere Aufgabe, eine freundliche, sichere und einladende Umgebung zu schaffen, unabhängig von Geschlecht, sexueller Orientierung, Befähigung, Herkunft, Religion (oder deren Nichtvorhandensein) sowie gesellschaftlichem und wirtschaftlichem Status. Dieser Verhaltenskodex umreißt unsere Erwartungen an alle Beteiligten unserer Community, sowie die Konsequenzen für inakzeptables Verhalten. Wir laden alle Teilnehmenden unserer Veranstaltungen ein, sichere und positive Erfahrungen für alle mitzugestalten. Ein zusätzliches Ziel dieses Verhaltenskodexes ist es, die Open Culture Citizenship zu stärken. Insofern ermutigen wir unsere Teilnehmenden, die Beziehungen zwischen Handlungen und deren Auswirkungen auf unsere Community zu erkennen und zu stärken. Communities spiegeln die Gesellschaften wider, in denen sie existieren. Positive Handlungen sind unerlässlich, um den vielen Formen von Ungleichheit und Machtmissbrauch in der Gesellschaft entgegenzuwirken. Wenn du Personen begegnest, die sich viel Mühe geben, unsere Community einladend und freundlich zu gestalten und alle Teilnehmenden dazu anregt, sich voll einzubringen, würden wir gerne davon hören. Inakzeptable Verhaltensweisen beinhalten: Einschüchterung, Belästigung, beleidigende, diskriminierende, abwertende oder erniedrigende Sprache und Verhalten durch jegliche Teilnehmenden in unserer Community. Dies gilt online, auf allen zugehörigen Veranstaltungen und in persönlichen Gesprächen im Rahmen unserer Community. Belästigung beinhaltet: Verletzende oder abwertende mündliche oder schriftliche Kommentare in Bezug auf Geschlecht, sexuelle Orientierung, Abstammung, Religion, Behinderung; unangemessene Verwendung von Nacktheit und/oder sexuellem Bildmaterial (inklusive Präsentationsslides); absichtliche Einschüchterung, Stalking oder Nachlaufen; belästigendes Fotografieren oder Filmen; ständige Unterbrechung von Vorträgen oder anderen Events; unangemessener Körperkontakt und unerwünschte sexuelle Zuwendung.'
