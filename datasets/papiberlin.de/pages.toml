["https://papiberlin.de/en/pages/christmas-presents"]
title = "🎄 Christmas wishes in easy mode | Papi Berlin"
description = "Founder of Papi Berlin, Software developer and father"
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Christmas is approaching. And with it the question of presents. Grandma, grandpa, all relatives and friends ask the same question: “What do your children want?”. This can quickly turn into stress. At least it always did for us. How do we distribute the wishes? What does our child want anyway? That was the reason why I built Wishlephant with my wife back then. We simply collect our child’s wishes throughout the year and pass the wish list on to every person who asks for potential gifts. Everyone can then choose what they want as a present and reserve the wish for themselves on the list. If your child is old enough, they can fill in the list with you or simply on their own. In no time at all, there’s one less thing to stress about at Christmas. When creating the lists, there are a few little things you should bear in mind to ensure that everything runs smoothly. And don’t forget: it’s best to fill the list throughout the year. Every time a wish is expressed, add it to the list. You can then simply go through the list before important events and remove anything that is no longer needed. Do you still need ideas for the wish lists? On Wishlephant you will find many suggestions for all age groups,.'
