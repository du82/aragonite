["https://papiberlin.de/en/resourcen/podcast-kids"]
title = "Podcasts (Kids) | Papi Berlin"
description = "Fortunately, there are plenty of great age-appropriate podcasts for kids."
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} You know ‘Anna und die wilden Tiere’ from television? Here in the podcast, Anna gets up close with wild animals – whether it’s horses, sharks, elephants, or snakes. You’ll learn a lot about animals that you definitely didn’t know – for example, about super-strong defense techniques against enemies or clever methods they use to get their favorite food. And by Anna’s side is always: the hyena. She tells jokes, well, they’re sometimes really bad, and… oh, just listen in! Tessa, Ella and Yassin go on a very special journey of discovery - together with doctor Toni. She has a super-special cab that can shrink to the size of bacteria. And the four of them use it to fly into the human body! Together they jet through blood vessels, tendons and even bones. In the process, they encounter wondrous creatures such as blood cells, bacteria and phagocytes. Together, Toni and the children explore the body and do their best to help. The checker for listening! Tobi, along with a child, checks three questions on a knowledge topic. Funny experiments, smart experts, and the clever database help them out. And at the end of each episode, Checker Tobi reveals a personal secret. Whether it’s about trees, fairy tales, or slime, in CheckPod, knowledge is fun and uplifting. All new episodes are always available exclusively in the ARD Audiothek one week in advance! Tina and Mischa answer the craziest kids’ questions in the Laugh Lab: Can you swim in melted chocolate? Does a kangaroo baby ever go in its mom’s pouch? Or: Can you blow clouds away? The two conduct funny experiments and get help in their quest for knowledge and answers from the kids’ guessing team and from experts. At ‘MIRA & das fliegende Haus,’ everything revolves around the truly important topics: dealing with emotions, mindfulness, self-love, sustainability, empathy, diversity, inclusion, and much more.'
