["https://papiberlin.de/pages/coworking"]
title = "Coworking für Eltern | Papi Berlin"
description = "Gründer von Papi Berlin, Softwareentwickler und Vater"
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Coworking ist die ideale Arbeitsform für sehr viele Freelancer. Doch was passiert, wenn man zusätzlich noch ein Kind hat? Dann wird es mitunter schwer, alle Bedürfnisse unter einen Hut zu bekommen. Zum Glück gibt es da Coworking-Spaces die genau darauf spezialisiert sind. Mit Kinderbetreuung. Manchmal flexibel, manchmal ein echter Kindergarten im Zimmer nebenan. Das Kind hat man so immer in seiner Nähe, falls doch etwas sein sollte. Dieses Konzept ist auch ideal für Menschen, die in ihrer Elternzeit trotzdem noch einen Tag in der Woche einen Büroplatz brauchen um an Projekten zu arbeiten. Vielleicht das Beste daran: alle Co-Worker haben die gleichen Alltagsprobleme und es entstehen so rasch sehr intensive Gespräche und Freundschaften. Neugierig geworden? Auf coworkingforparents.org haben wir alle Coworking-Büros für Eltern aufgelistet. Vielleicht ist ja auch einer in deiner Nähe?'
