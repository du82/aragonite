full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} The #1 sleep app for children in Germany - the Aumio audio play cosmos for falling asleep and relaxing. And the best part: many german health insurance companies cover the subscription costs. Keep all appointments, deadlines, applications, office visits, and to-dos during pregnancy and after childbirth stress-free in sight. Keep all appointments, deadlines, applications, office visits, and to-dos during pregnancy and after childbirth stress-free in sight. Hopefully, you’ll only need this app for a few hours, but then it’s very helpful. During contractions, you don’t want to and can’t calculate in your head how long ago the last contraction was. Baby monitor as an iOS app. Perfect for those times when you’ve forgotten the actual baby monitor 😅 Mental load is a topic that every father* should know and understand. This test can be a first assessment to improve your relationship and distribute burdens more effectively. On Spielplatztreff, you can find beautiful playgrounds near you, add playgrounds yourself, rate them, upload playground photos, and exchange ideas with other playground fans. With wishlists of your children, you can save yourself a lot of stress around birthdays and celebrations. No duplicate gifts, no long chats about what could be gifted.'
