["https://papiberlin.de/en/resourcen/digital-games"]
title = "Digital Games | Papi Berlin"
description = "Recommendations of digital games for consoles, iPads, desktops..."
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} A beautiful app for all wooden train fans. A great introduction to the “Building Games” category. Dorfromantik is a relaxing puzzle where you build a charming village landscape by placing hexagonal tiles, creating a peaceful world teeming with forests, fields, and rivers. Together with Flik and Flak, children experience a particularly educational adventure. Running, jumping, and rolling – in 36 exciting levels, various puzzles and tasks related to the theme of time await. Embark on a heartwarming puzzle adventure in a stunning Lego brick world. Follow the story of a character rebuilding their connection with someone special, using creative solutions and innovative building techniques to overcome challenges. A very nice point-and-click adventure game that gently introduces players to the genre. Reading is not necessary, and difficult cutscenes can be skipped. Hints are available if you don’t know the solution. Great for puzzling together with your child. Guide Ida, a silent princess, through impossible, Escher-inspired landscapes by manipulating the very architecture, bending reality to solve optical illusions and unveil the mysteries of her sacred journey. Sago Mini offers a collection of charming and educational apps for preschoolers, each focused on a specific theme like farm animals, the zoo, or the construction site. Through simple controls and adorable animations, they encourage exploration, discovery, and creativity in a safe and ad-free environment. Tinykin shrinks you down to the size of an ant, letting you explore a giant house filled with friendly bugs called Tinykin! Use their unique abilities to overcome obstacles, solve puzzles, and find your way back to normal size, uncovering the house’s mysterious secrets along the way. Help Swampy the alligator take a shower by guiding different types of water (clean, dirty, steamy) through colorful dirt-filled puzzles. Use your ingenuity to dig paths, avoid obstacles, and collect hidden ducks in this award-winning physics-based game.'
