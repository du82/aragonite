title = "Podcasts (Eltern) | Papi Berlin"
description = "Eltern-Podcasts, die perfekte Begleitung beim Abwasch, Aufräumen, Wäsche zusammenlegen."
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Eine schöne Kindheit für unsere Kinder ist ja gut und schön – aber wie schaffen wir es, uns selbst dabei nicht zu verlieren? Wie kommen wir gut durch die wohl herausforderndste Zeit unseres Lebens? Schnapp‘ dir ein Kissen und setze dich zu uns ans artgerecht Lagerfeuer. Mütter und Väter erzählen ungefiltert von ihrem Leben als Eltern. Vom irrsinnigen Glück. Vom ganz normalen Wahnsinn. Und von ihren dunklen Momenten. Wie spricht man am besten über Herausforderungen im Familienalltag? Viele Eltern umtreiben dieselben Sorgen, und lesen einen Ratgeber nach dem Anderen. Jeder hat eine andere Idee von Erziehung und nur selten werden Sorgen offen ausgesprochen. Im Familienrat-Podcast besuchen wir die Diplompädagogin Katia Saalfrank und stellen ihr eure Fragen rund um Erziehung und Familienleben. Der Podcast für Eltern mit Herz und Verstand. Von A wie Anziehen bis Z wie Zähneputzen - in liebevoller Verbindung bleiben, auch wenn es zu Hause mal anstrengend wird. Patricia und Caspar sind nicht nur im Social Media-Bereich aktiv, sondern haben auch noch diesen tollen Podcast 🎧 Der Tilt Parenting Podcast ist ein Podcast über Lernbeeinträchtigung, Förderpädagogik, ADHS, Autismus, Hochbegabung, doppelte Ausnahmeerscheinungen und vieles mehr. Die wöchentliche Sendung enthält Interviews und Gespräche mit Autoren, Erziehungsexperten, Pädagogen und anderen Eltern sowie aufschlussreiche Gespräche zwischen Debbie und ihrem Kind, die alle darauf abzielen, Eltern zu unterstützen, die neurodivergente Kinder aufziehen. Der Podcast von Vaterwelten.de hat sehr schöne Interviews mit Vätern. Große Liebe hierfür 👨‍👧!'
