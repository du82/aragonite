["https://papiberlin.de/resourcen/events"]
title = "Veranstaltungstipps | Papi Berlin"
description = "In Berlin gibt es sehr viele tolle Veranstaltungen für Familien. Nur was passiert wo? Hier gibt es nützliche Links dazu."
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} In Berlin gibt es sehr viele tolle Veranstaltungen für Familien. Nur was passiert wo? Hier gibt es nützliche Links dazu. Kindaling ist ein Online Freizeit-Guide für Eltern in Berlin und hilft dabei, das richtige Angebot zu finden – egal, ob Schwangerschaftsyoga und Geburtsvorbereitung, Kindersport, Eltern-Kind-Gruppen, Kreativ-Kurse, Musikunterricht oder Feriencamps. Diese Konzertreihe bietet Babys und ihren Eltern einen Event, bei dem sie Kultur gemeinsam und ganz entspannt genießen können. Der Online-Shop des Jugendkulturservice, hier gibt es viele ermäßigte Tickets für Berliner Veranstaltungen. Jeden Oktober gibt es viele tolle kostenlose Workshops/Events für Kinder. Buchbar ab September, aber seit schnell, viel ist sofort ausgebucht leider. Gute Kindermusik. Für Alle. Hörbar. Tanzbar. Wunderbar. Der Milchsalon ist – seit 2011 – eine erfrischend andere Konzertreihe, die Kinder zum Musizieren, Tanzen und Ausflippen animiert.'
