["https://papiberlin.de/resourcen/podcast-kids"]
title = "Podcasts (Kinder) | Papi Berlin"
description = "Auch für Kinder gibt es zum Glück jede Menge toller altersgerechter Podcasts."
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Ihr kennt “Anna und die wilden Tiere” aus dem Fernsehen? Auch hier im Podcast kommt Anna wilden Tieren ganz nah - egal ob Pferden, Haien, Elefanten oder Schlangen. Ihr erfahrt dabei vieles über Tiere, das ihr garantiert noch nicht wusstet - zum Beispiel über superstarke Abwehrtechniken gegenüber Feinden oder mit welchen schlauen Mitteln sie an ihr Lieblingsfutter gelangen. Und an Annas Seite ist immer: die Hyäne. Sie erzählt Witze, puh, die sind manchmal richtig schlecht und … ach, hört einfach rein! Der Checker zum Hören! Tobi checkt zusammen mit einem Kind drei Fragen zu einem Wissensthema. Lustige Experimente, kluge Expertinnen und Experten sowie die schlaue Datenbank helfen ihnen dabei. Und am Schluss jeder Folge verrät Checker Tobi ein persönliches Geheimnis. Ob es um Bäume, Märchen oder Schleim geht, im CheckPod macht Wissen Spaß und gute Laune. Alle neuen Folgen gibt es immer eine Woche vorab exklusiv in der ARD-Audiothek! Entdecke die Welt der kleinen Ente Enny und ihrem Freund Mo, dem kleinen Bär. Die Hörgeschichten eignen sich für Kinder zwischen 2 und 5 Jahren. Tina und Mischa beantworten im Lachlabor die verrücktesten Kinderfragen: Kann man in geschmolzener Schokolade schwimmen? Macht ein Känguru-Baby auch mal in den Beutel der Mama? Oder: Kann man Wolken wegpusten? Die beiden machen lustige Experimente, und bekommen auf ihrer Suche nach Wissen und Antworten Hilfe vom Kinder-Miträtsel-Team und von Expertinnen und Experten. Bei “MIRA & das fliegende Haus” dreht sich alles um die wirklich wichtigen Themen: Nämlich den Umgang mit Gefühlen, Achtsamkeit, Selbstliebe, Nachhaltigkeit, Empathie, Diversity, Inklusion und vieles mehr. Tessa, Ella und Yassin gehen auf eine ganz besondere Entdeckungsreise – zusammen mit Ärztin Toni. Die hat nämlich ein super-spezielles Taxi, das sich auf Bakteriengröße schrumpfen kann. Und mit dem fliegen die vier in den menschlichen Körper hinein! Zusammen düsen sie durch Blutbahnen, Sehnen oder sogar Knochen. Dabei treffen sie auf wundersame Gestalten wie Blutkörperchen, Bakterien und Fresszellen. Gemeinsam erforschen Toni und die Kinder den Körper und geben ihr Bestes, um zu helfen.'
