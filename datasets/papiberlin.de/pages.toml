title = "Digital Elternhelfer | Papi Berlin"
description = "Gründer von Papi Berlin, Softwareentwickler und Vater"
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Der Markt an Anwendungen und Hilfsmitteln für Eltern ist unüberschaubar groß. Von der Begleitung in der Schwangerschaft bis zum Babyphone gibt es für alles eine App. Wir haben hier mal zusammen getragen, was von anderen Eltern in der Slack-Gruppe empfohlen wurde. Unterteilt in “vor” und “nach” der Geburt. Neben den Apps haben viele übrigens auch einen geteilten Kalender. Sei es mit Hilfe von Google Calendar, Apple iCloud oder mit einem selbst betriebenen Server. Dieser geteilter Kalender ist ein wichtiger erster Schritt das Thema Mental-Load zu managen.'
