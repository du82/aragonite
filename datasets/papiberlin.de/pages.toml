["https://papiberlin.de/pages/christmas-presents"]
title = "🎄 Weihnachtswünsche im Easy-Modus | Papi Berlin"
description = "Gründer von Papi Berlin, Softwareentwickler und Vater"
full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Weihnachten naht. Und damit auch die Frage nach den Geschenken. Oma, Opa, sämtliche Verwandten und Freunde fragen die gleiche Frage: “Was wünscht sich euer Nachwuchs?”. Das kann schnell in Stress ausarten. Ist es bei uns jedenfalls immer. Wie verteilen wir die Wünsche? Was will unser Kind überhaupt? Das war der Grund, warum ich mit meiner Frau damals Wishlephant gebaut habe. Dort sammeln wir einfach das ganze Jahr über die Wünsche unseres Kindes und geben die Wunschliste einfach an alle weiter. Jede(r) kann dann aussuchen, was geschenkt wird und auf der Liste den Wunsch dann für sich reservieren. Wenn euer Kind alt genug ist, kann es natürlich auch mit euch zusammen oder einfach alleine die Liste befüllen. Schwups, gibt es einen großen Punkt weniger, der Stress macht rund um Weihnachten. Beim Erstellen der Listen solltet ihr noch ein paar Kleinigkeiten beachten, damit alles reibungslos funktioniert. Befüllt die Liste ab jetzt am besten das ganze Jahr über. Jedes Mal, wenn ein Wunsch geäußert wird, rauf auf die Liste damit. Ihr könnt dann vor wichtigen Events einfach die Liste durchgehen und alles entfernen, was nicht mehr benötigt wird. Benötigt Ihr noch Ideen für die Wunschlisten? Auf Wishlephant gibt es jede Menge Vorschläge für alle Altersgruppen,.'
