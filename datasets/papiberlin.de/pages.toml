full_description = '{"de"=>"Eine Community für aktive Väter in Berlin.", "en"=>"A community for active fathers* in Berlin."} Wir haben doch gerade unser Kind das erste Mal in die Kita gebracht, wie kann es jetzt schon in die Schule gehen 😅 ? Schon krass, wie manchmal die Zeit fliegt mit Kindern. Aber damit Ihr auch halbwegs gut vorbereitet in den Schulalltag starten könnt, hier mal ein paar Links, die uns sehr geholfen haben: Im nächsten Monat kommen auch zwei Folgen von einem unserer Lieblingspodcasts (Das Gewünscheste Wunschkind) zum Thema Schule, nämlich: Falls Ihr noch mehr Fragen rund um das Thema Schule habt, kommt doch gern in unseren Slack-Kanal, dort haben wir immer ein offenes Ohr für euch.'
