["https://par.nsf.gov/services"]
title = "NSF Public Access | Publisher Services"
full_description = "Home Services About Publisher Services What are Publisher Services? What is CHORUS? Following the issuance of the OSTP memorandum in 2013, the publishing community developed a multi-publisher portal approach, CHORUS (Clearinghouse for Open Research of the United States), to provide access to metadata for journal articles resulting from government funding. CHORUS provides a suite of services and best practices that provide a sustainable solution for agencies and publishers to deliver public access to published articles reporting on U.S. funded research. See more at: http://www.chorusaccess.org/ What is CHORUS' relationship to PAR? CHORUS is connected to PAR, which links to publishers’ articles via CHORUS-supplied metadata. In the future, Crossref's FundRef service will simplify the identification of government-funded articles which will be included in CHORUS. While PAR will link to publisher content via CHORUS for NSF-funded articles, PAR can still meet the requirements for public access and operate independently of CHORUS. This is important to note since (1) not all publishers will choose to participate in CHORUS and (2) NSF must be able to fulfill its past and future public access requirements if CHORUS is ever discontinued or if individual publishers ever discontinue their participation. What is Crossref? An association of scholarly publishers that develops shared infrastructure to support more effective scholarly communications. Crossref's citation-linking network today covers over 72 million journal articles and other content items (books chapters, data, theses, technical reports) from thousands of scholarly and professional publishers. See more at: http://www.crossref.org/ What is FundRef? A Crossref project to provide a standard way to report funding sources for published scholarly research. Publishers deposit funding information from articles and other content using a standard taxonomy of funder names. This funding data is then made publicly available through Crossref's search interfaces and APIs for funders and other interested parties to analyze. See more at: https://www.crossref.org/services/funder-registry/ What is ISSN? An International Standard Serial Number is an 8-digit code used to identify newspapers, journals, magazines and periodicals of all kinds and on all media–print and electronic. The ISSN National Centres assign ISSN to the publications issued by the publishers located in their own countries through application (http://www.issn.org/). The Public Access Solution will use this to identify publications as part of manuscript submission."
