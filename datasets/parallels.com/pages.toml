ase and are subject to the return policy of that retailer. Offer excludes renewal transactions. Using Microsoft Office on Mac FAQs Can I use Microsoft Office on a Mac using Parallels Desktop? Yes, you can use Microsoft Office 365 on a Mac with Parallels Desktop if you own or purchase the necessary license keys. Will I get Word and Excel on my Mac? You will get Word, Excel, PowerPoint, and the rest of the Microsoft Office 365 suite on your Mac if you own or purchase the necessary license keys. I have the online application version of Microsoft Office. Can I download the desktop version? Yes, you can download and use the desktop version of Microsoft Office on your Mac with Parallels Desktop. Just follow these steps: Open your Windows 11 virtual machine in Parallels Desktop. Open a web browser inside the Windows 11 virtual machine and navigate to the Microsoft Office website. Sign in with your Microsoft account that has an active Microsoft 365 subscription. Once signed in, click on the "Install Office" button. Select "Other install options" from the drop-down menu and then click on "Download" under the "Office for Windows" section. Choose the desired version of Office to download and click on "Download". Once the download is complete, locate the downloaded file and double-click to begin the installation process. Follow the on-screen prompts to complete the installation. Once the installation is complete, you are ready to use the desktop version of Microsoft Office on your Windows 11 Parallels virtual machine. Note that you may need to activate the software using your Microsoft account credentials for full access to all the features. Can I install two instances of the same Office 365 license on the same computer? Yes, you can install Microsoft Office 365 on your Windows virtual machine and the macOS side of your Mac with Parallels Desktop. Do you offer discounts to students or faculty? Parallels Desktop offers exclusive discounts for students enrolled in a qualified institution or professional educators employed at an eligible institution. Educational discounts can save users up to 50%. Start by verifying your student discount eligibility. See what you are capable of — with Parallels 200,000+ apps and integrations Run all your favorite Windows apps on Mac. See all the apps Outlook Enjoy the full functionality of Microsoft Outlook on your Mac. Excel Get all the Excel features you require on your Mac. Learn more about Excel Learn more about Microsoft Office 365 and Parallels Desktop What’s the difference between Microsoft Excel on Mac vs. Windows? Windows Excel offers more features, better support, and a more comprehensive feature set compared to the Mac version. Learn more What’s the difference between Microsoft Office 365 on Mac vs. Windows? The primary difference between Microsoft Office 365 on Mac and Microsoft Office 365 on Windows is that the Windows version offers more features, functionalities, and integrations. In addition, there are variations in the user interface based on the underlying OSs. Learn more Can I ensure that Windows file types (e.g., .xlsx or .docx) are automatically opened by the appropriate Microsoft Office 365 program? Yes, here’s how to automatically open a file from Finder in a Windows program: Learn more Access the full power and capability of Microsoft Office365 on your Mac for only $99.99 a year with Parallels Desktop Enjoy Microsoft Office365 on Mac, plus other key Windows applications without the need for a PC. Try free Buy now'''
