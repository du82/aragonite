["https://parceljs.org/features/scope-hoisting"]
title = "Scope hoisting"
description = '''In production builds, Parcel concatenates modules into a single scope. This is called "scope hoisting". Parcel also statically analyzes the imports and exports of each module, and removes everything that isn't used. This is called "tree shaking".'''
full_description = '''Scope hoisting Historically, JavaScript bundlers have worked by wrapping each module in a function, which is called when the module is imported. This ensures that each module has a separate isolated scope and side effects run at the expected time, and enables development features like hot module replacement. However, all of these separate functions have a cost, both in terms of download size and runtime performance. In production builds, Parcel concatenates modules into a single scope when possible, rather than wrapping each module in a separate function. This is called “scope hoisting”. This helps make minification more effective, and also improves runtime performance by making references between modules static rather than dynamic object lookups. Parcel also statically analyzes the imports and exports of each module, and removes everything that isn't used. This is called "tree shaking" or "dead code elimination". Tree shaking is supported for both static and dynamic import, CommonJS and ES modules, and even across languages with CSS modules. How scope hoisting works #Parcel’s implementation of scope hoisting works by analyzing each module independently and in parallel, and at the end concatenating them together. In order to make concatenation into a single scope safe, the top-level variables of each module are renamed to ensure they are unique. In addition, imported variables are renamed to match the exported variable names from the resolved module. Finally, any unused exports are removed. index.js: import {add} from './math';console.log(add(2, 3)); math.js: export function add(a, b) { return a + b;}export function square(a) { return a * a;} Compiles to something like: function $fa6943ce8a6b29$add(a, b) { return a + b;}console.log($fa6943ce8a6b29$add(2, 3)); As you can see, the add function has been renamed, and the reference has been updated to match. The square function has been removed because it is unused. This results in much smaller and faster output than if each module had been wrapped in a function. Not only are there no extra functions, but there are also no exports objects, and the reference to the add function is static rather than a property lookup. Avoiding bail outs #Parcel can statically analyze many patterns including ES module import and export statements, CommonJS require() and exports assignments, dynamic import() destructuring and property accesses, and more. However, when it comes across code that cannot be statically analyzed ahead of time, Parcel may have to "bail out" and wrap the module in a function in order to preserve side effects or allow exports to be resolved at runtime. To determine why tree shaking is not occurring as expected, run Parcel with the --log-level verbose CLI option. This will print diagnostics for each bailout that occurs, including a code frame showing what caused it. parcel build src/app.html --log-level verbose Dynamic member accesses #Parcel can statically resolve member accesses that are known at build time, but when a dynamic property access is used, all exports of the module must be included in the build, and Parcel must create an exports object so that the value can be resolved at runtime. import * as math from './math';// ✅ Static property accessconsole.log(math.add(2, 3));// 🚫 Dynamic property accessconsole.log(math[op](2, 3)); In addition, Parcel does not track re-assignments of a namespace object to another variable. Any usage of an import namespace other than a static property access will cause all exports to be included. import * as math from './math';// 🚫 Reassignment of import namespacelet utils = math;console.log(utils.add(2, 3));// 🚫 Unknown usage of import namespacedoSomething(math); Dynamic imports #Parcel supports tree shaking dynamic imports with static property accesses or destructuring. This is supported with both await and Promise then syntax. However, if the Promise returned from import() is accessed in any other way, Parcel must preserve all exports of the resolved module. Note: For the await cases, unused exports can unfortunately only be removed when await is not transpilied away (i.e. with a modern browserslist config). // ✅ Destructuring awaitlet {add} = await import('./math');// ✅ Static member access of awaitlet math = await import('./math');console.log(math.add(2, 3));// ✅ Destructuring Promise#thenimport('./math').then(({add}) => console.log(add(2, 3)));// ✅ Static member access of Promise#thenimport('./math').then(math => console.log(math.add(2, 3)));// 🚫 Dynamic property access of awaitlet math = await import('./math');console.log(math[op](2, 3));// 🚫 Dynamic property access of Promise#thenimport('./math').then(math => console.log(math[op](2, 3)));// 🚫 Unknown use of returned PromisedoSomething(import('./math'));// 🚫 Unknown argument passed to Promise#thenimport('./math').then(doSomething); CommonJS #In addition to ES modules, Parcel can also analyze many CommonJS modules. Parcel supports static assignments to exports, module.exports, and this within a CommonJS module. This means the property name must be known statically at build time (i.e. not a variable). When a non-static pattern is seen, Parcel creates an exports object that all importing modules access at runtime. All exports must be included in the final build and no tree shaking can be performed. // ✅ Static exports assignmentsexports.foo = 2;module.exports.foo = 2;this.foo = 2;// ✅ module.exports assignmentmodule.exports = 2;// 🚫 Dynamic exports assignmentsexports[someVar] = 2;module.exports[someVar] = 2;this[someVar] = 2;// 🚫 Exports re-assignmentlet e = exports;e.foo = 2;// 🚫 Module re-assignmentlet m = module;m.exports.foo = 2;// 🚫 Unknown exports usagedoSomething(exports);doSomething(this);// 🚫 Unknown module usagedoSomething(module); On the importing side, Parcel supports static property accesses and destructuring of require calls. When a non-static access is seen, all exports of the resolved module must be included and no tree shaking can be performed. // ✅ Static property accessconst math = require('./math');console.log(math.add(2, 3));// ✅ Static destructuringconst {add} = require('./math');// ✅ Static property assignmentconst add = require('./math').add;// 🚫 Non-static property accessconst math = require('./math');console.log(math[op](2, 3));// 🚫 Inline requiredoSomething(require('./math'));console.log(require('./math').add(2, 3)); Avoid eval #The eval function executes arbitrary JavaScript code in a string within the current scope. This means Parcel cannot rename any of the variables within the scope in case they are accessed by eval. In this case, Parcel must wrap the module in a function and avoid minifying the variable names. let x = 2;// 🚫 Eval causes wrapping and disables minificationeval('x = 4'); If you need to run JavaScript code from a string, you may be able to use the Function constructor instead. Avoid top-level return #CommonJS allows return statements at the top-level of a module (i.e. outside a function). When this is seen, Parcel must wrap the module in a function so that execution stops only that module rather than the whole bundle. In addition, tree shaking is disabled because exports may not be known statically (e.g. if the return is conditional). exports.foo = 2;if (someCondition) { // 🚫 Top-level return causes wrapping and disables tree shaking return;}exports.bar = 3; Avoid module and exports re-assignment #When the CommonJS module or exports variables are re-assigned, Parcel cannot statically analyze the exports of the module. In this case, the module must be wrapped in a function and tree shaking is disabled. exports.foo = 2;// 🚫 Exports reassignment causes wrapping and disables tree shakingexports = {};exports.foo = 5; Avoid conditional require() #Unlike ES module import statements which are only allowed at the top-level of a module, require is a function that may be called from anywhere. However, when require is called from within a conditional or another control flow statement, Parcel must wrap the resolved module in a function so that side effects are executed at the right time. This also applies recursively to any dependencies of the resolved module. // 🚫 Conditional requires cause recursive wrappingif (someCondition) { require('./something');} Side effects #Many modules only contain declarations, like functions or classes, but some may also include side effects. For example, a module might insert something into the DOM, log something to the console, assign to a global variable (i.e. a polyfill), or initialize a singleton. These side effects must always be retained for the program to work correctly, even if the exports of the module are unused. By default, Parcel includes all modules, which ensures side effects are always run. However, the sideEffects field in package.json can be used to give Parcel and other tools a hint about whether your files include side effects. This makes the most sense for libraries to include in their package.json files. The sideEffects field supports the following values: false – All files in this package have no side effects. string – A glob matching files that includes side effects. Array<string> – An array of globs matching files that include side effects. When a file is marked as side effect free, Parcel is able to skip the entire file when concatenating the bundle if it does not have any used exports. This can reduce bundle sizes significantly, especially if the module calls helper functions during its initialization. app.js: import {add} from 'math';console.log(add(2, 3)); node_modules/math/package.json: { "name": "math" "sideEffects": false} node_modules/math/index.js: export {add} from './add.js';export {multiply} from './multiply.js';let loaded = Date.now();export function elapsed() { return Date.now() - loaded;} In this case, only the add function from the math library is used. multiply and elapsed are unused. Normally, the loaded variable would still be needed because it includes a side effect that runs during the module's initialization. However, because the package.json includes the sideEffects field, the index.js module can be entirely skipped. In addition to size benefits, using the sideEffects field also has build performance benefits. In the above example, because Parcel knows multiply.js has no side effects, and none of its exports are used, it is never even compiled at all. However, if export * had been used instead, this would not be true because Parcel would not know what exports are available. Another benefit of sideEffects is that it also applies to bundling. If a module imports a CSS file or contains a dynamic import(), the bundle will not be created if the module is unused. PURE annotations #You can also annotate individual function calls with a /*#__PURE__*/ comment, which tells the minifier that it's safe to remove that function call when the result is unused. export const radius = 23;export const circumference = /*#__PURE__*/ calculateCircumference(radius); In this example, if the circumference export is unused, then the calculateCircumference function will also not be included. Without the PURE annotation, calculateCircumference would still be called in case it had side effects. Edit this page on GitHub'''
year_published = 2025
clearnet = "https://parceljs.org/features/scope-hoisting"
tags = ['"dead', '"tree', "2;//", "access", "accesses", "annotations", "avoid", "avoiding", "await", "bail"]
language = "en"
internal-references = ["none"]
external-references = ["bundle-buddy.com", "classic.yarnpkg.com", "cottonbureau.com", "developer.mozilla.org", "discord.gg", "flow.org", "github.com", "json5.org", "lightningcss.dev", "localhost", "nodejs.org", "nolanlawson.com", "opencollective.com", "philipwalton.com", "pnpm.io", "swc.rs", "twitter.com", "typescriptlang.org", "web.dev", "yarnpkg.com"]

["https://parceljs.org/languages/javascript"]
title = "JavaScript"
description = "Parcel includes first-class support for JavaScript, including ES modules and CommonJS, many types of dependencies, automatic transpilation for browser targets, JSX and TypeScript support, and much more."
full_description = '''JavaScript Parcel includes first-class support for JavaScript, including ES modules and CommonJS, many types of dependencies, automatic transpilation for browser targets, JSX and TypeScript support, and much more. Modules #Modules allow you to break up your code into different files, and share functionality between them by importing and exporting values. This can help you structure your code into independent parts, with well-defined interfaces for communicating between them. Parcel includes support for both ES modules and CommonJS syntax. Module specifiers are resolved as described in Dependency resolution. ES modules #ES module syntax is the standard way to import and export values between files in JavaScript. It should be preferred over CommonJS for new code. The import statement can be used to reference a value exposed by the export statement in another file. This example imports a multiply function from math.js, and uses it to implement a square function. square.js: import {multiply} from './math.js';export function square(x) { return multiply(x, x);} math.js: export function multiply(a, b) { return a * b;} To learn more about ES modules, see the documentation on MDN. CommonJS #CommonJS is a legacy module system supported in Node, and widely used by libraries on npm. If you’re writing new code, you should generally prefer ES module syntax as described above. CommonJS provides a require function, which can be used to access the exports object exposed by another file. This example uses require to load the math.js module, and uses the multiply function on its exports object to implement a square function. square.js: let math = require('./math');exports.square = function(x) { return math.multiply(x, x);}; math.js: exports.multiply = function(a, b) { return a * b;}; In addition to require and exports, Parcel also supports module.exports, as well as the __dirname and __filename module globals, and process.env for access to environment variables. See the Node emulation docs for more details. To learn more about CommonJS, see the Node.js docs. Dynamic import #Both the ES module import statement and CommonJS require function load dependencies synchronously: that is, the module can be referenced immediately without waiting for a network request. Typically, modules that are imported synchronously are bundled together into the same file as their parent, or referenced in another bundle that is already loaded. The dynamic import() function can be used to load dependencies asynchronously. This allows loading code lazily, on demand, and is a good technique for reducing the file size of the initial page load of your app. import() returns a Promise, which notifies you when the dependency has been loaded. import('./pages/about').then(function(page) { page.render()}); See the code splitting docs for more details on how to use dynamic imports. Classic scripts #One of the benefits of modules (both ES modules and CommonJS) is that they isolate functionality. This means that variables declared in the top-level scope cannot be accessed outside the module unless they are exported. This is generally a great characteristic, but modules in JavaScript are relatively recent and there are many legacy libraries and scripts that do not expect to be isolated. A classic script, is a JavaScript file that is loaded via the traditional <script> tag in HTML (without type="module") or other means such as Workers. Classic scripts treat variables in the top-level scope as globals which can be accessed even between different scripts. For example, when loading a library like jQuery, a $ variable is available globally to other scripts on the page. If jQuery were loaded as a module, $ would not be accessible unless it were assigned as a property to the window object manually. <script src="jquery.js"></script><script>// The $ variable is now available globally.$('.banner').show();</script> In addition, classic scripts do not support synchronous imports or exports via either ES modules or CommonJS, and Node emulation is disabled. However, dynamic import() is supported to load a module from within a classic script. Parcel matches browser behavior for classic scripts and modules. If you wish to use imports or exports within your code, you’ll need to use <script type="module"> to reference your JavaScript from an HTML file. For workers, use the {type: 'module'} option (see below). If this is missing, you'll see a diagnostic like the one below. import.meta #The import.meta object includes information about the module it is referenced in. Parcel currently supports a single property, import.meta.url, which includes a file:// url for the module on the file system. This URL is relative to your project root (e.g. the directory where Git is initialized) to avoid exposing any build system details. console.log(import.meta);// => {url: 'file:///src/App.js'}console.log(import.meta.url);// => 'file:///src/App.js' URL dependencies #You can reference non-JavaScript assets such as images or videos from a JavaScript file using the URL constructor. These are resolved relative to the module by using import.meta.url as the base URL parameter. The first argument must be a string literal to be recognized (not a variable or expression). This example references an image named hero.jpg in the same directory as the JavaScript file, and creates an <img> element from it. let img = document.createElement('img');img.src = new URL('hero.jpg', import.meta.url);document.body.appendChild(img); Parcel will process any files referenced by a URL dependency as it does any other dependency. For example, images will be processed by the image transformer, and you can use query parameters to specify options to resize and convert them. If no transformers are configured for a particular file type, then the file will be copied into the dist directory unmodified. The resulting file names will also include a content hash for long term cacheability in the browser. Workers #Parcel has built in support for web workers, service workers, and worklets, which allow moving work to a different thread. Web workers #Web workers are the most general type of worker. They allow you to run arbitrary CPU-heavy work in a background thread to avoid blocking the user interface. Workers are created using the Worker constructor, and referencing another JavaScript file using the URL constructor as described above. To use ES module or CommonJS syntax in a worker, use the type: 'module' option as described in Classic scripts above. Parcel will compile your worker to a non-module worker if necessary, depending on your targets and current browser support. new Worker( new URL('worker.js', import.meta.url), {type: 'module'}); Parcel also supports the SharedWorker constructor, which creates a worker that can be accessed in different browser windows or iframes. It supports the same options as described above for Worker. To learn more about web workers, see the docs on MDN. Service workers #Service workers run in the background and provide features like offline caching, background sync, and push notifications. They are created using the navigator.serviceWorker.register function, and using the URL constructor to reference another JavaScript file. To use ES module or CommonJS syntax in a service worker, use the type: 'module' option as described in Classic scripts above. Parcel will compile your service worker to a non-module worker if necessary, depending on your targets and current browser support. navigator.serviceWorker.register( new URL('service-worker.js', import.meta.url), {type: 'module'}); Note: dynamic import() is not supported in service workers. Service workers are commonly used for pre-caching static assets like JavaScript, CSS, and images. @parcel/service-worker can be used to access a list of bundle URLs from within your service worker. It also provides a version hash, which changes every time the manifest does. You can use this to generate a cache name. First, install it as a dependency into your project. yarn add @parcel/service-worker This example shows how you could pre-cache all bundles when the service worker is installed, and clean up old versions when it is activated. service-worker.js: import {manifest, version} from '@parcel/service-worker';async function install() { const cache = await caches.open(version); await cache.addAll(manifest);}addEventListener('install', e => e.waitUntil(install()));async function activate() { const keys = await caches.keys(); await Promise.all( keys.map(key => key !== version && caches.delete(key)) );}addEventListener('activate', e => e.waitUntil(activate())); To learn more about service workers, see the docs on MDN, and the Offline Cookbook on web.dev. Classic script workers #The type: 'module' option may also be omitted to treat workers and service workers as classic scripts instead of modules. The importScripts function can be used to load additional code in classic script workers, however, the code will loaded at runtime and will not be processed by Parcel. This is because importScripts resolves URLs relative to the page, not the worker script. Therefore, the parameter to importScripts must be a fully-qualified absolute URL, not a relative path. The following examples show patterns that are supported and unsupported. // ✅ absolute URLimportScripts('http://some-cdn.com/worker.js');// ✅ computed URLimportScripts(location.origin + '/worker.js');// 🚫 relative pathimportScripts('worker.js');// 🚫 absolute pathimportScripts('/worker.js'); Worklets #Parcel also supports worklets, including CSS Houdini paint worklets as well as web audio worklets. These let you hook into low level aspects of the rendering process or audio processing pipeline in the browser. Paint worklets are detected automatically using the following syntax: CSS.paintWorklet.addModule( new URL('worklet.js', import.meta.url)); Web audio worklets are not statically analyzable, so for these you can use the worklet: scheme to import a URL to the worklet file compiled for the correct environment. import workletUrl from 'worklet:./worklet.js';context.audioWorklet.addModule(workletUrl); Worklets are always modules – there are no classic script worklets. This means the type: 'module' option is not required for worklets, and importScripts is not supported. In addition, dynamic import() is not supported in worklets. Transpilation #Parcel includes support for transpiling JSX, TypeScript, and Flow out of the box, as well as transpiling modern JavaScript syntax to support older browsers. In addition, Babel is supported to enable experimental or custom JavaScript transformations. JSX #Parcel supports JSX out of the box. JSX is automatically enabled in a .jsx or .tsx file, or when one of the following libraries is defined as a dependency in your package.json: react preact nervjs hyperapp The correct JSX pragma is also automatically inferred based on the library you use. Parcel also automatically detects the version of React or Preact that is installed, and enables the modern JSX transform if supported. JSX compilation can also be configured using a tsconfig.json or jsconfig.json file. This allows overriding the runtime, pragma, and other options. See the TSConfig reference for more information. tsconfig.json: { "compilerOptions": { "jsx": "react-jsx", "jsxImportSource": "preact" }} Flow #Flow support is automatically enabled when flow-bin is listed as a dependency in your project's root package.json. You must also use a @flow directive in the files you wish to be compiled. Parcel currently uses Babel to strip flow types. If you have a custom Babel config, you will need to add the Flow plugin yourself. See Babel for more details. TypeScript #See TypeScript. Browser compatibility #By default Parcel does not perform any transpilation of JavaScript syntax for older browsers. This means that if you write your code using modern language features, that’s what Parcel will output. You can declare your app’s supported browsers using the browserslist field in your package.json. When this field is declared, Parcel will transpile your code accordingly to ensure compatibility with your supported browsers. package.json: { "browserslist": "> 0.5%, last 2 versions, not dead"} See the Targets docs for more details on how to configure this, as well as Parcel's support for automatic differential bundling. By default, Parcel supports all standard JavaScript features, as well as proposals that have shipped in one or more browsers. You can also enable support for future proposals using a tsconfig.json or jsconfig.json file. Currently, the only supported proposal is decorators, which you may be using through TypeScript. tsconfig.json: { "compilerOptions": { "experimentalDecorators": true }} More experimental features can be enabled using Babel. Babel #Babel is a popular transpiler for JavaScript, with a large plugin ecosystem. Using Babel with Parcel works the same way as using it standalone or with other build tools. Create a Babel config file such as .babelrc and Parcel will pick it up automatically. Parcel supports both project wide config files such as babel.config.json, as well as file relative configs such as .babelrc. See the Babel docs for details on configuration for more details. Note: JavaScript Babel configs (e.g. babel.config.js) should be avoided. These cause Parcel’s caching to be less effective, which means all of your JS files will be recompiled each time you restart Parcel. To avoid this, use a JSON-based config format instead (e.g. babel.config.json). Default presets #Parcel includes transpilation for browser targets (equivalent to @babel/preset-env), JSX (equivalent to @babel/preset-react), TypeScript (equivalent to @babel/preset-typescript), and Flow (equivalent to @babel/preset-flow) by default. If these are the only transforms you need in your project, then you may not need Babel at all. If you have an existing project with a Babel config containing only the above presets, you may be able to remove it. This can significantly improve build performance since Parcel’s builtin transpiler is much faster than Babel. Custom plugins #If you have custom Babel presets or plugins beyond the ones listed above, you can configure Babel to only include these custom plugins and omit the standard presets. This will improve build performance by allowing Babel to do less work and letting Parcel handle the default transformations. babel.config.json: { "plugins": ["@emotion/babel-plugin"]} Since Parcel uses Babel to transpile Flow, you'll need to keep @babel/preset-flow in your Babel config along with any custom plugins. Otherwise, your Babel config overrides Parcel's defaults. Other Babel presets listed above can be removed. @babel/preset-env and @babel/plugin-transform-runtime are not aware of Parcel's Targets, which means differential bundling will not work properly. This will likely result in unnecessary transpilation and larger bundle sizes. In additi'''
