title = "Parcel Documentation"
description = "Learn how to start a new project, or migrate an existing project to Parcel 2."
full_description = "Parcel Documentation Getting started Learn how to start a new project, or migrate an existing project to Parcel 2. Building a webapp with Parcel Learn how to set up a new web application from scratch with Parcel. Building a library with Parcel Learn how to set up a Parcel to build a JavaScript library. Migration Migrate an existing project from Parcel 1 to Parcel 2. Features Learn about Parcel's core features. Development Learn about Parcel's dev server, hot reloading, lazy mode, caching, and more. Code Splitting How to use dynamic imports and Parcel's automatic shared bundles. Resolution How dependencies are resolved, url schemes, aliases, and more. Bundle Inlining How to inline the compiled contents of one bundle inside another. Targets How to compile your source code for multiple targets. Production Minification, tree shaking, compression, content hashing, and more. Scope hoisting Dig into the details of how Parcel's tree shaking implementation works. Node emulation Using Node.js features like environment variables and builtin module polyfills. CLI A reference for all of the options available in the Parcel CLI. Parcel API Run Parcel builds programmatically to integrate into any build. Plugins Overriding and extending Parcel's defaults using plugins. Languages and Frameworks Learn how to use the most common languages and frameworks with Parcel. See the side navigation for even more. HTML The entry of most Parcel apps. From here, you can reference scripts, styles, images, and more. JavaScript Using ES modules and CommonJS, setting up transpilation, JSX, workers, and more. CSS Using CSS with Parcel, including dependencies, CSS modules, PostCSS, and more. SVG Referencing SVG from HTML, CSS, JavaScript, and JSX, including scripts and styles, and more. TypeScript Using TypeScript with Parcel, including transpilation and generating typings. Images Resizing, converting, and optimizing images. React Using React with Parcel, including Fast Refresh, styling, images, code splitting, and more. Vue Using Vue 3 SFCs with Parcel. Plugin System Learn how to customize and extend Parcel's defaults with your own plugins. Concepts Plugin System An overview of Parcel's architecture and core data structures. Authoring Plugins An introduction to Parcel's Plugin APIs, and a guide to publishing a plugin package. Diagnostics How to emit errors and logs using Parcel's unified diagnostics format. Source Maps How to work with Parcel's source maps library in your plugin. Plugin Types Transformer Compile individual source files and extract dependencies. Resolver Resolve a dependency to a file path or virtual module. Namer Determine the name of an output file. Packager Combine multiple assets together into a single output file. Optimizer Minify, optimize, and transform output files. Compressor Compress and encode output files in multiple formats. Reporter Receive events on build progress and completion. Configuration Share Parcel configuration between projects. .docs-home li img{width:1em}.card{transform:translate(var(--tw-translate-x),var(--tw-translate-y))rotate(var(--tw-rotate))skewX(var(--tw-skew-x))skewY(var(--tw-skew-y))scaleX(var(--tw-scale-x))scaleY(var(--tw-scale-y));outline-offset:2px;outline:2px solid #0000;transition-property:color,background-color,border-color,text-decoration-color,fill,stroke,opacity,box-shadow,transform,filter,-webkit-backdrop-filter,-webkit-backdrop-filter,backdrop-filter;transition-duration:.15s;transition-timing-function:cubic-bezier(.4,0,.2,1)}.card:hover,.card:focus{--tw-scale-x:1.05;--tw-scale-y:1.05;transform:translate(var(--tw-translate-x),var(--tw-translate-y))rotate(var(--tw-rotate))skewX(var(--tw-skew-x))skewY(var(--tw-skew-y))scaleX(var(--tw-scale-x))scaleY(var(--tw-scale-y));--tw-shadow:0 20px 25px -5px #0000001a,0 8px 10px -6px #0000001a;--tw-shadow-colored:0 20px 25px -5px var(--tw-shadow-color),0 8px 10px -6px var(--tw-shadow-color);box-shadow:var(--tw-ring-offset-shadow,0 0 #0000),var(--tw-ring-shadow,0 0 #0000),var(--tw-shadow)}"
