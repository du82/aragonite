title = "Parcel"
description = "Parcel combines a great out-of-the-box development experience with a scalable architecture that can take your project from just getting started to massive production application."
full_description = '''A build tool for the rest of us. Parcel starts with a great development experience, from starting a new project, to iterating and debugging, and shipping to production. No more fiddling with configuration, or spending hours to keep up with best practices – it just works! Zero config Start with an HTML file. Add a <script> tag. Maybe some CSS. How about TypeScript? SASS? Images? No problem. Parcel works out of the box just as you'd expect. Parcel supports many languages and file types out of the box, from web technologies like HTML, CSS, and JavaScript, to assets like images, fonts, videos, and more. And when you use a file type that isn't included by default, Parcel will automatically install all of the necessary plugins and dev dependencies for you! Get started → index.html ​<html> <head> <title>My First Parcel App</title> <link rel="stylesheet" href="styles.css"> </head> <body> <h1>Hello, World!</h1> <script type="module" src="app.tsx"></script> </body> </html> Dev server Parcel includes a development server out of the box. Just run parcel index.html to get started. http://localhost:1234 Hello world! Need HTTPS? Run Parcel with the --https flag, and it will automatically generate a certificate for you! Or, if you like, you can provide your own. Parcel also has a built-in API proxy, which can help simulate your production environment. Learn more → Hot reloading When you make a change, Parcel automatically updates your code in the browser – no page reload necessary! http://localhost:1234 Hello world! Greeting.tsx import React from 'react'; export function Greeting() { return <h1>Hello world!</h1>; } let e=hmrCode.querySelector(".plain-text");function t(e){return new Promise((t=>setTimeout(t,e)))}e.textContent=hmrPreview.textContent="Hello world!",hmrUnsaved.hidden=!0,async function n(a){await t(1e3);let l=e.textContent.split(" ").pop().slice(0,-1);e.innerHTML=`Hello <span class="bg-green-700">${l}</span>!`,await t(1e3);let i='<span style="width: 1px; margin-right: -1px; height: 1.2em" class="inline-block align-text-top bg-white"></span>';e.innerHTML=`Hello ${i}!`;let r="";for(let n of a)await t(Math.floor(120*Math.random())+60),r+=n,e.innerHTML=`Hello ${r}${i}!`,hmrUnsaved.hidden=!1;await t(300),hmrUnsaved.hidden=!0,e.innerHTML=`Hello ${r}!`,await t(200),hmrPreview.textContent=`Hello ${r}!`,await t(3e3),await n("Parcel"===a?"world":"Parcel")}("Parcel"); Parcel also integrates with React Fast Refresh and the Vue Hot Reloading API to automatically preserve your application state between updates. This gives you instant feedback as you make changes, without taking you out of context. Learn more → Diagnostics If you make an error in your code or configuration, Parcel displays beautiful diagnostics in your terminal and in the browser. Every error includes a syntax highlighted code frame pointing to the exact location where the error occurred, along with hints about how to fix the issue. Many diagnostics even include a documentation link where you can learn more. $ parcel index.html Server running at http://localhost:1234 🚨 Build failed. @parcel/core: Cannot resolve 'ract' from './index.js' /dev/app/index.js:1:19 > 1 | import React from 'ract'; > | ^^^^^^ 2 | 3 | function Test() { @parcel/resolver-default: Cannot find module 'ract' Did you mean 'react'? It's lightning fast. Parcel builds your code in parallel using worker threads, utilizing all of the cores on your machine. Everything is cached, so you never build the same code twice. It's like using watch mode, but even when you restart Parcel! Native performance @keyframes speedometer{0%{transform:rotate(-85deg)}10%{transform:rotate(-15deg)}40%{transform:rotate(45deg)}60%{transform:rotate(75deg)}85%{transform:rotate(90deg)}to{transform:rotate(85deg)}}@keyframes speedometer-done{0%{transform:rotate(85deg)}50%{transform:rotate(80deg)}to{transform:rotate(85deg)}} Parcel's JavaScript compiler, CSS transformer, and source maps implementation are written in Rust for maximum performance. It's 10-20x faster than other JavaScript-based tools! Parcel's JavaScript compiler is built on SWC, which handles transpiling JavaScript, JSX, and TypeScript. On top of SWC, Parcel implements dependency collection, bundling, scope hoisting, tree shaking, Node emulation, hot reloading, and more. Parcel's CSS transformer and minifier is built in Rust on top of the browser-grade CSS parser used in Firefox. It's over 100x faster than other JavaScript-based transformers and minifiers. Multi-core function e(e){for(let t=0;t<20;t++){let t=40*Math.random()+60,r=t>90?"to-red-500":t>70?"to-yellow-500":"to-yellow-300",a=document.createElement("div");a.className=`bg-gradient-to-t from-green-400 via-yellow-400 ${r} mr-1 rounded-t-sm`,a.style.width="20px",a.style.marginRight="5px",a.style.height=t+"%",e.appendChild(a)}}e(bars1),e(bars2),e(bars3),e(bars4),e(bars5),e(bars6),e(bars7),e(bars8); @keyframes bars{0%{transform:translate(0)}to{transform:translate(-100%)}}@keyframes bars-2{0%{transform:translate(0)}to{transform:translate(-200%)}}@keyframes bars-loop{0%{transform:translate(100%)}to{transform:translate(-100%)}}@media (prefers-reduced-motion){#bars1,#bars2,#bars3,#bars4,#bars5,#bars6,#bars7,#bars8{animation:none!important}} Parcel is designed around a multi-core architecture that parallelizes work across all of your cores and takes full advantage of modern hardware. Transforming individual source files is parallelized, as well as packaging and optimizing output bundles. All of this is completely automatic and does not require any work by plugin authors or other tools that integrate with Parcel. Reliable caching Everything Parcel does is cached – transformation, dependency resolution, bundling, optimizing, and everything in between. This means the dev server restarts instantly, and the same code is never built twice. dashboard.js profile.js package.json dashboard.css profile.css .postcssrc @keyframes fade-in-2{0%{opacity:.3}to{opacity:1}}@keyframes fade-in-3{0%{opacity:0}to{opacity:1}}@keyframes caching-fade-out{0%{opacity:1}to{opacity:.3}} Parcel automatically tracks all of the files, configuration, plugins, and dev dependencies that are involved in your build, and granularly invalidates the cache when something changes. It integrates with low-level operating system APIs to determine what files have changed in milliseconds, no matter the project size. Lazy dev builds browser /dashboard /profile dashboard.js react.js profile.js In development, Parcel can defer building files until they are requested in the browser. This means you only need to wait for the page you're actually working on to build! If your project has many entries or code split points, this can massively reduce dev server startup time. And when you do request a page, Parcel is smart enough to eagerly build all of the dependencies of that page at once, without waiting for them to be requested as well – no network waterfalls! Learn more → Automatic production optimization. Parcel optimizes your whole app for production automatically. This includes tree-shaking and minifying your JavaScript, CSS, and HTML, resizing and optimizing images, content hashing, automatic code splitting, and much more. Tree shaking Parcel supports tree-shaking both ES modules and CommonJS out of the box! It statically analyzes the imports and exports of each module, and removes everything that isn't used. Tree shaking even works across dynamic import() boundaries, shared bundles, and even across languages! If you use CSS modules, unused classes will be removed automatically. Learn more → index.js import {add} from './math'; console.log(add(2, 3)); math.js export function add(a, b) { return a + b; } export function square(a) { return a * a; } .unusedCode,.unusedCode>*{animation:.5s ease-out 2s forwards fade-out}@keyframes fade-out{to{--tw-text-opacity:1;color:rgb(75 85 99/var(--tw-text-opacity))}} Minification Parcel includes minifiers for JavaScript, CSS, HTML, and SVG out of the box! Just run parcel build index.html, and your whole application will be built and optimized automatically. Learn more → 542 KB let e=2*parseInt(progress.getAttribute("r"))*Math.PI;progress.style.strokeDasharray=`${e} ${e}`;let t,r=2187,s=32.42,a=r,i=()=>{size.textContent=(a>1024?a/1024:a).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2,style:"unit",unit:a>1024?"megabyte":"kilobyte"}),size.classList.remove("text-green-600","dark:text-green-500","text-yellow-600","text-red-600","dark:text-yellow-400","dark:text-red-500"),a>1024?size.classList.add("text-red-600","dark:text-red-500"):a>128?size.classList.add("text-yellow-600","dark:text-yellow-400"):size.classList.add("text-green-600","dark:text-green-500"),progress.style.strokeDashoffset=e-(r-a)/2154.58*e,a<=s&&(progress.parentElement.setAttribute("hidden","true"),size.textContent="✨ "+size.textContent)};function n(e){return new Promise((t=>setTimeout(t,e)))}new IntersectionObserver((async()=>{cancelAnimationFrame(t);let e=async()=>{a-=Math.random()*(a>1024?30:a>256?20:5)+(a>256?10:2),a=Math.max(a,s),i(),a>s&&(await n(a>1024?5:a>256?20:50),t=requestAnimationFrame(e))};a=r,i(),progress.parentElement.removeAttribute("hidden"),await n(800),t=requestAnimationFrame(e)}),{threshold:1}).observe(size),i(); Image optimization Parcel supports resizing, converting, and optimizing images! Just pass query parameters for the format and size you need when referencing the image file in your HTML, CSS, JavaScript, etc. and Parcel will take care of the conversion and optimization process. You can even request multiple sizes or formats of the same source image for different devices or browsers! Learn more → index.html <picture> <source type="image/webp" srcset="image.jpg?as=webp&width=400, image.jpg?as=webp&width=800 2x"> <source type="image/jpeg" srcset="image.jpg?width=400, image.jpg?width=800 2x"> <img src="image.jpg?width=400" width="400"> </picture> Compression Compress your app before you deploy using Gzip and Brotli. Learn more → Code splitting When multiple parts of your application depend on the same common modules, they are automatically deduplicated into a separate bundle. This allows commonly used dependencies to be loaded in parallel with your application code and cached separately by the browser! Code splitting is also supported for CSS. If you import CSS from your JavaScript, a sibling CSS bundle will be produced and loaded in parallel with the JS bundle. Learn more → Dashboard Profile React Lodash Content hashing dashboard.js react.js dashboard.a96cdf.js Parcel automatically includes content hashes in the names of all output files. This enables long-term browser caching, because the output is guaranteed not to change unless the name does. Parcel also resolves all referenced bundles relative to their parent using a manifest in each entry. This means that changes to referenced bundles don't invalidate the cache for their parents as well, and output files can be moved between locations without rebuilding. Learn more → Ship for any target. Parcel automatically transforms your code for your target environments. From modern and legacy browser support, to zero config JSX and TypeScript compilation, Parcel makes it easy to build for any target – or many! Transpilation Parcel transpiles your JavaScript and CSS for your target browsers automatically! Just declare a browserslist in your package.json, and Parcel takes care of transpiling only what's needed. In addition to standard JavaScript, Parcel automatically handles JSX, TypeScript, and Flow, along with Node.js features like process.env and fs.readFileSync – no configuration needed! When it comes to CSS, Parcel supports transpiling modern syntax features like lab() colors, logical properties, and CSS nesting syntax, as well as automatically adding the necessary vendor prefixes for your browser targets. And if you need more advanced control, or support for custom transforms, just add a .babelrc or .postcssrc and it'll be picked up automatically. Learn more → function DogName(props) { return ( <span> {props.dog?.name ?? 'Buddy'} </span> ); } function DogName(props) { var ref, ref1; return /*#__PURE__*/ React.createElement( "span", null, (ref1 = (ref = props.dog) === null || ref === void 0 ? void 0 : ref.name) !== null && ref1 !== void 0 ? ref1 : "Buddy" ); } Differential bundling When you use <script type="module">, Parcel automatically generates a nomodule fallback for old browsers as well, depending on your browser targets. This results in much smaller bundles for a majority of users in modern browsers, while still supporting older browsers as well! Learn more → ​<script type="module" src="app.js"></script> ​<script type="module" src="app.c9a6fe.js"></script> <script nomodule="" src="app.f7d631.js"></script> Workers Parcel supports web workers, service workers, and worklets out of the box! Just use the standard browser APIs and Parcel will automatically follow the dependency. It even generates native ES module workers when possible, depending on your browser targets! Learn more → App.js let worker = new Worker( new URL('./worker.js', import.meta.url), {type: 'module'} ); navigator.serviceWorker.register( new URL('./sw.js', import.meta.url), {type: 'module'} ); Libraries Parcel can build libraries for multiple targets at once! For example, your source code can be compiled to a modern ES module, a legacy CommonJS module, and a TypeScript definition file all automatically. Just add the relevant fields to your package.json and Parcel takes care of the rest. You can even build a whole monorepo of packages in a single command! 🤯 parcel build packages/* Learn more → package.json { "name": "my-great-library", "version": "1.0.0", "source": "src/index.js", "module": "dist/module.js", "main": "dist/main.js", "types": "dist/types.d.ts" } Scalable from small websites to massive applications. Parcel requires zero configuration to get started. But as your application grows and your build requirements become more complex, it's possible to extend Parcel in just about every way. Simple configuration?! Configuring Parcel is like a breath of fresh air. .parcelrc is a simple JSON-based config format that uses globs to match your source files to build pipelines. You can extend the default config and add plugins to handle custom file types, or override and extend the defaults. Learn more → Extends Start with the default config, or a community preset. Transformers Compile individual source files and extract dependencies. Resolvers Resolve a dependency to a file path or virtual module. Namers Determine the name of an output file. Packagers Combine multiple assets together into a single output file. Optimizers Minify, optimize, and transform output files. Compressors Compress and encode output files in multiple formats. Reporters Receive events on build progress and completion. .parcelrc { "extends": ["@parcel/config-default"], "transformers": { "*.svg": ["@parcel/transformer-svg-react"] }, "resolver'''
