full_description = "nevver nevver Jon Adams Source: instagram.com 921 notes Jun 2nd, 2020 Open in app Facebook Tweet Pinterest Reddit Mail Embed Permalink thethirdbear 55 notes May 30th, 2020 Open in app Facebook Tweet Pinterest Reddit Mail Embed Permalink nevver nevver James Baldwin Source: goo.gl 133,217 notes May 30th, 2020 Open in app Facebook Tweet Pinterest Reddit Mail Embed Permalink nuclearbummer 69 notes May 27th, 2020 Open in app Facebook Tweet Pinterest Reddit Mail Embed Permalink nevver nevver David Fullerton Source: instagram.com 285 notes May 20th, 2020 Open in app Facebook Tweet Pinterest Reddit Mail Embed Permalink After weeks of whatever-they-have-left quarantine beer, the good stuff is starting to come back around. #mahbeer https://www.instagram.com/p/B_swacrpFCS/?igshid=1kxppeixwmq7h mahbeer 9 notes May 2nd, 2020 Open in app Facebook Tweet Pinterest Reddit Mail Embed Permalink blackcraft66six blackcraftrock Pearl Jam 1,311 notes Apr 23rd, 2020 Open in app Facebook Tweet Reddit Mail Embed Permalink king-casablancas moonimmune parislemon New album is great. the strokes music 5,125 notes Apr 22nd, 2020 Open in app Facebook Tweet Reddit Mail Embed Permalink blackswaneuroparedux blackswaneuroparedux Nobody ever lives their life all the way up except bullfighters.Ernest Hemingway, The Sun Also Rises 107 notes Apr 21st, 2020 Open in app Facebook Tweet Pinterest Reddit Mail Embed Permalink nytimes.com Everyone You Know Just Signed Up for Netflix The streaming giant added nearly 16 million new subscribers in the first three months of the year. Edmund Lee on Netflix’s bonkers numbers:More than 15.7 million people signed up for Netflix in the first three months of the year, when the coronavirus started to disrupt daily life around the world. That was a record for the streamer, according to its first quarter earnings announcement on Tuesday.Netflix has 182.8 million subscribers, making it one of the world’s largest entertainment services. It added 2.3 million in the United States and Canada in the first quarter for a total of 69.9 million, and added 13.5 million internationally.Of those:Netflix’s original programming continued to draw audiences. More than 29 million households tuned into the third season of “Ozark,” a crime drama starring Jason Bateman. The reality show “Love Is Blind” drew 30 million watchers. But the surprise hit was “Tiger King,” a wildly popular documentary series about a tiger breeder and zookeeper in Oklahoma who ultimately landed in prison. The surreal saga was viewed by 64 million subscribers.64 million subscribers watched Tiger King. And how many people watched with others in their households? For what was basically throw-away cheap trash TV. It’s incredible. This is the power of Netflix – on steroids in the time of COVID.I also love this quote:The company acknowledged that it had fared well during the crisis, but said it expected “viewing to decline and membership growth to decelerate as home confinement ends, which we hope is soon.” netflix tiger king streaming 11 notes Apr 21st, 2020 Open in app Facebook Tweet Reddit Mail Embed Permalink"
