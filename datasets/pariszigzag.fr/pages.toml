["https://www.pariszigzag.fr/paris-au-quotidien/actualites-paris/exposition-tresors-banlieues-gennevilliers"]
title = "Cette fascinante exposition célèbre la créativité en banlieue dans un parcours exceptionnel – Paris ZigZag | Insolite & Secret"
description = '''Après une première édition, "Trésors de Banlieues : Couronnes d'Humanité" revient à Gennevilliers honorer la richesse artistique des banlieues.'''
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Cette fascinante exposition célèbre la créativité en banlieue dans un parcours exceptionnel (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Rodin et Rosa Bonheur côtoyant le street art et des sculptures de métal pour raconter des luttes et des métamorphoses, c’est l’expérience aussi inattendue qu’enrichissante que propose cette exposition gratuite de 250 œuvres explorant la créativité et la diversité des territoires urbains. Direction pour cela les Hauts-de-Seine, pour réaliser que la banlieue est avant tout un terrain fertile pour l’art. Un voyage fascinant dans le monde de l’art et de la banlieue Après le succès de la première édition en 2019 à la Halle des Grésillons, “Trésors de Banlieues : Couronnes d’Humanité” fait son retour à Gennevilliers (Hauts-de-Seine), mais cette fois à l’Usine Chanteraines, un espace transformé pour mettre en lumière la richesse artistique et humaine des banlieues. Pour cette nouvelle et seconde édition, l’exposition change donc de lieu mais s’annonce comme une nouvelle exploration de la créativité et la diversité des territoires urbains. Décrit comme une “page blanche”, le local industriel de 1200 m² a été transformé et sublimé par les fresques murales du street artiste Kanos, mais aussi d’autres artistes urbains comme Sifat, Jo Ber ou Dams. Voir cette publication sur Instagram Une publication partagée par Otsi de Gennevilliers (@otsigennevilliers) Au programme, un voyage à travers 250 œuvres, issues de collections publiques rarement dévoilées, à travers plusieurs formes d’art : peinture, sculpture, photographie, bande-dessinée ou encore design. Dans cette volonté d’honorer la richesse artistique et humaine des banlieues, ce sont 70 collectivités partenaires d’Île-de-France comme Osny, Sarcelles, Ecouen, La Courneuve ou encore Nanterre qui participent à cet événement culturel, contre 53 en 2019. Afin de rendre hommage à la créativité de ces territoires tout en questionnant les représentations stéréotypées des banlieues, l’événement culturel se dévoile à travers 11 axes narratifs, comme “l’enfance en banlieue”, “le bestiaire en banlieue” ou encore “la banlieue dans la lumière des impressionnistes”, chacune des thématiques illustrant la diversité des récits et des patrimoines locaux. Voir cette publication sur Instagram Une publication partagée par Alex Kanos (@ikanografik) Une édition sous le signe de l’hommage et du partage En 2019, la première édition de Trésors de Banlieue s’était révélée être un grand succès, attirant plus de 22 000 visiteurs et révélant au public l’immense richesse culturelle et artistique des banlieues françaises. Parmi les œuvres exposées cette année, le public pourra notamment découvrir “Le Trotiniste” de Boldi, le buste en bronze “La France” d’Auguste Rodin ou la toile “Scène de canotage” de Ferdinand Gueldry. Une édition également placée sous le signe de l’hommage à Coluche. Figure emblématique de la solidarité pour l’ouverture du premier centre des Restos du Cœur en décembre 1985, le célèbre humoriste sera honoré, notamment grâce à la présence de la statue À Coluche de Guillaume Werle, inaugurée à Montrouge en 2011. Pour célébrer une idée devenue un mouvement national, incarnant l’espoir et la générosité au service des plus démunis, des photographies des premières distributions des Restos du Cœur et un retour sur le parcours de Coluche seront également de la partie. Voir cette publication sur Instagram Une publication partagée par Franck Monnacelo (@franck_monnacelo) Transformée en terrain de jeu créatif et véritable laboratoire d’expression artistique, où les scolaires pourront s’inspirer des œuvres présentes pour créer les leurs, l’ancienne usine des Chanteraines promet également de vibrer grâce à une programmation éclectique. Chaque samedi de mars à avril, le site est en effet appelé à se transformer en scène vivante où les disciplines artistiques dialogueront entre elles. Ainsi, il sera possible d’écouter la pianiste renommée Nima Sarkechik performer en résonance avec les œuvres exposées ou explorer les sonorités futuristes à travers l’étonnant instrument qu’est le Cristal Baschet avec le compositeur Marc Chouarain. L’exposition “Trésors de Banlieues : Couronnes d’Humanité” est donc à découvrir gratuitement du 15 février au 13 avril 2025 à Gennevilliers, au sein de l’Usine Chanteraines. L’expo est donc accessible en entrée libre, du mardi au dimanche de 9h à 18h30. Voir cette publication sur Instagram Une publication partagée par Otsi de Gennevilliers (@otsigennevilliers) Trésors de Banlieues : Couronnes d’Humanité Du 15 février au 13 avril 2025 Usine Chanteraines 92 avenue du Général de Gaulle 92230 Gennevilliers À lire également : Un avenir enfin radieux pour la Cité du Cinéma avec une ouverture au grand public attendue pour 2026 Image à la une : Street Art © Trésors de Banlieues : Couronnes d’Humanité (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chape