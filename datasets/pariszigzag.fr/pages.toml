title = "Savez-vous qu’un ancien abri anti-atomique se cache dans Paris ? Il abrite désormais un… – Paris ZigZag | Insolite & Secret"
description = "Savez-vous qu'un ancien abri anti-atomique se cache dans Paris ? Il abrite désormais un..."
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Savez-vous qu’un ancien abri anti-atomique se cache dans Paris ? Il abrite désormais un… (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Dissimulé à 26 mètres de profondeur sous le Laboratoire central des ponts et chaussées, ce vestige méconnu de l’entre-deux-guerres s’étend sur près de 650 m² sous nos pieds. Plongeons ensemble dans les souterrains de la capitale pour découvrir sa fascinante histoire : on vous emmène à l’abri Lefebvre ! Un ancien abri anti-atomique Construit entre 1937 et 1939, l’abri Lefebvre est conçu à l’origine comme un abri de défense passive pour le ministère des Travaux publics et des Transports. Situé au 58 boulevard Lefebvre, dans le 15ᵉ arrondissement, il pouvait protéger environ 90 personnes en cas debombardements aériens. Mais en avril 1964, face à la menace nucléaire croissante, l’abri est transféré au Secrétariat général de l’aviation civile et subit d’importantes rénovations pour devenir un abri anti-atomique. Sa surface est alors portée à 950 m², et il est équipé d’un système de ventilation innovant actionné par des vélos, permettant de renouveler l’air en cas de coupure électrique ! On y accède enfin par un escalier à double révolution assez remarquable. Abri Lefebvre © Neverends.net De l’abandon à la renaissance numérique Après avoir été opérationnel jusqu’en 1991, l’abri Lefebvre est laissé à l’abandon et subit des dégradations. En septembre 2012, il est achété par la société Online (aujourd’hui Scaleway) pour y construire un centre de données, le « DC4 ». Apèrs de long travaux, il est ainsi transformé en un data center moderne, hébergeant notamment les données du service de cloud nommé C14. Avant sa transformation définitive, il a accueilli des événements culturels inédits : en novembre 2013 avec l’agence WATO qui y organise une soirée sur le thème de la Libération de Paris, et en janvier 2014 avec une exposition éphémère d’art numérique offrant aux visiteurs une expérience immersive dans ce lieu chargé d’histoire ! On peut dire que l’abri Lefebvre illustre parfaitement la capacité de Paris à transformer ses vestiges historiques en infrastructures modernes, tout en préservant la mémoire du passé… Abri Lefebvre © Agence Wato À lire également : Connaissez-vous les stations fantômes du métro parisien ? Crédit photo de une : Abri Lefebvre © Neverends.net A. C. (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardin japonais d’Europe fête ses 40 ans avec... Actualités 5 musées chaleureux où passer l'hiver Les prochaines visites guidées /* Media query pour les �crans de petite taille */ .o-gallery.listvisitesingle { justify-content:center; } @media (max-width: 600px) { .o-gallery.listvisitesingle { flex-direction: column; /* Aligne les �l�ments en colonne */ justify-content: flex-start; /* Aligne les �l�ments au d�but du conteneur */ align-items: center; /* Centre les �l�ments horizontalement */ height: auto; /* Ajuste la hauteur du conteneur */ } } 02 mars 10h30 La face cachée de Montmartre 02 mars 11h00 Le Marais hors des sentiers battus 02 mars 11h00 Le Père Lachaise insolite Voir toutes nos activités'''
