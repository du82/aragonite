title = "Au pied de la Tour Eiffel, cette brasserie sublime les produits du terroir avec un menu à 39€ – Paris ZigZag | Insolite & Secret"
description = "Au pied de la Tour Eiffel, cette brasserie sublime les produits du terroir avec un menu à 39€"
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Au pied de la Tour Eiffel, cette brasserie sublime les produits du terroir avec un menu à 39€ (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Imaginez-vous attablé face à la Tour Eiffel, savourant un plat délicat où les saveurs végétales, terriennes et marines dansent en parfaite harmonie… Bienvenue chez FRAME, la brasserie branchée du Pullman Paris Tour Eiffel, qui vient d’accueillir un nouveau chef de talent : Alexandre Willaume ! Frame © AxelleC / Zigzag Un cadre unique Ce qui nous a tout de suite séduit chez Frame c’est son décor luxuriant, à la fois grandiose et apaisant, où l’on se sent comme dans une petite jungle urbaine à certains endroits. Et puis cette vue sur la Tour Eiffel, qui scintille chaque soir et transforme votre dîner en un instant magique… On aime aussi la cuisine ouverte où l’on admire la brigade en pleine action, un vrai spectacle pour les yeux avant la fête des papilles ! Sans oublier la bulle transparente sur la terrasse, un incroyable cocon d’hiver où l’on savoure un tea time d’exception. Frame © AxelleC / Zigzag Un chef, une philosophie Depuis décembre 2024, le chef Alexandre Willaume a pris les commandes des cuisines de Frame avec une mission claire : proposer une cuisine moderne, engagée et toujours aussi gourmande. Végétarien de cœur, il sublime les produits marins et végétaux, tout en mettant à l’honneur certaines viandes avec un profond respect de l’animal. Son credo ? Du goût, du local, du saisonnier, et surtout, du plaisir ! Et cela se ressent dans chaque assiette. En entrée, on se laisse tenter par un réconfortant velouté de châtaigne au curry vert et lait de coco, amande et miso, fève de tonka. En plat on craque pour le château filet de bœuf rôti, Komatsuna, pommes gaufrettes et son délicieux condiment chimichurri, ou pour la généreuse côte de cochon “Noir de Bigorre” laquée et son originale mousseline de patates douces et pop corn espelette. Et s’il vous reste de la place pour le dessert, vous pouvez faire le tour de France des fromages ou vous laisser porter par la sélection du chef pâtissier ! Frame © AxelleC / Zigzag On vous recommande donc vivement cette adresse à la fois chic et décontractée pour un déjeuner d’affaires, un dîner romantique ou une escapade culinaire entre amis. Le menu déjeuner à 39 € (entrée + plat ou plat + dessert) vous permet de goûter au talent du chef à prix doux, tandis que la carte vous invite à un voyage gustatif où chaque plat raconte une histoire. Frame 28 rue Jean Rey, 75015 Paris Infos pratiques et réservations ici À lire également : Un tea time d’exception dans la bulle d’hiver du Frame Crédit photo de une : Frame © Instagram @framebrasserie A. C. (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jard