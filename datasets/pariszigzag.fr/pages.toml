title = "Dans le sud de la France, ce village aux nombreux vestiges médiévaux mène à la cascade du Paradis – Paris ZigZag | Insolite & Secret"
description = "Non loin de Toulouse, ce village médiéval vaut le détour pour une visite de son patrimoine architectural en partie classé."
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Dans le sud de la France, ce village aux nombreux vestiges médiévaux mène à la cascade du Paradis (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Non loin de Toulouse, ce village médiéval vaut le détour pour une visite de son patrimoine architectural en partie classé, et de ses sites naturels abritant notamment la cascade du Paradis. Des lieux classés Occupée depuis plusieurs millénaires, la commune de Burlats détient encore aujourd’hui un exceptionnel patrimoine architectural. Entre le pavillon d’Adélaïde appartenant à l’ancien prieuré, ou encore la maison d’Adam et l’ancienne collégiale de Saint-Pierre, classées aux monuments historiques, ce village proche de Toulouse vaut le détour. Pour s’y rendre, il faut précisément aller dans le Sidobre, un territoire granitique qui s’étend à l’est de Castres. Burlats – © Adobe Stock Trois édifices remarquables Parmi le patrimoine architectural de Burlats se trouve donc le pavillon d’Adélaïde, une maison romane du XIIe siècle qui évoque la vicomtesse d’Albi sans que celle-ci ne l’ait pourtant habitée avec certitude. L’édifice est composé de cinq grandes fenêtres qui illuminent la pièce et offrent une belle vue sur la région. Burlats – © Adobe Stock Autre édifice remarquable : la maison d’Adam, datant du XIIe siècle aussi, qui était une dépendance du prieuré, et non loin de là s’aperçoivent aussi les ruines de l’ancienne église. En effet, l’abbaye de Castres avait décidé de fonder un prieuré à Burlats, et de faire de l’église Saint-Pierre une collégiale, le 22 février 1318, mais celle-ci a été détruite pendant les guerres de Religion. L’église a toutefois été classée, mais par manque de fonds, elle n’a jamais été reconstruite. Vers le Paradis Situé aux pieds du mont Paradis, Burlats est aussi connu pour offrir de jolies randonnées au sein de ses sites naturels, comme le chaos de la Rouquette, la grotte Saint-Dominique, le lac du Lézert ou encore le saut de la Truite. Parmi ses sentiers, on découvre après une trentaine de minutes de marche la cascade dite du “Paradis”, située sur le ruisseau d’Aiguebelle. Un vrai lieu de quiétude. Burlats – © Adobe Stock À lire également : Ce village de caractère retient l’attention avec son église gothique au clocher pointu Image à la une : Burlats – © Adobe Stock (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardin japonais d’Europe fête ses 40 ans avec... Actualités 5 musées chaleureux où passer l'hiver Les prochaines visites guidées /* Media query pour les �crans de petite taille */ .o-gallery.listvisitesingle { justify-content:center; } @media (max-width: 600px) { .o-gallery.listvisitesingle { flex-direction: column; /* Aligne les �l�ments en colonne */ justify-content: flex-start; /* Aligne