["https://www.pariszigzag.fr/insolite/histoire-insolite-paris/rue-du-pelican-paris"]
title = "À Paris, la rue du Pélican avait à l’origine un nom bien plus coquin – Paris ZigZag | Insolite & Secret"
description = '''C'est dans le 1er arrondissement de Paris qu'une voie médiévale dénommée la "rue du Pélican" avait autrefois un nom bien plus coquin.'''
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture À Paris, la rue du Pélican avait à l’origine un nom bien plus coquin (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> C’est dans le 1er arrondissement de Paris, en plein cœur du quartier des Halles, qu’une ancienne voie médiévale est dénommée la “rue du Pélican”. Mais ce terme est une déformation d’un nom bien plus coquin. Une ancienne voie des Halles La rue dite du “Pélican” se trouve dans le quartier des Halles (1er). Cette voie de 62 mètres commence au 11 rue Jean-Jacques-Rousseau et se termine au 8 rue Croix-des-Petits-Champs. Tracée en 1305, elle est située à l’origine en dehors des murs de l’enceinte de Philippe-Auguste. À l’époque, elle est alors connue pour appartenir aux lieux malfamés de la capitale, où se retrouvaient brigands, prostituées et vagabonds… ce qui explique l’évolution de sa toponymie ! La rue du Pélican Un nom d’oiseau… Pélican vous fait penser à l’oiseau ? Il s’agit plus justement de la transformation… d’un nom d’oiseau faisant référence à la fréquentation de la rue en question. En effet, cette voie faisait partie de celles où la prostitution a été rendue légale par Saint-Louis. Ainsi, l’argot a rapidement inspiré le nom de “rue du Poil-au-Con” ! La rue du Pélican Et ce nom semble avoir été gardé durant plusieurs siècles, jusqu’à l’année 1792, au moment de la Révolution française. La voie est alors renommée “rue Purgée“, puisque les prostituées y ont alors été chassées. Plus tard, en 1800, elle devient plus sérieusement la “rue de la Barrière-des-Sergents”, puisque l’ancienne barrière de ce nom était située non loin de là. Jusqu’au Pélican C’est finalement en 1806 que cette voie du centre de Paris devient, par déformation de son nom d’origine, la “rue du Pélican“. Aux premières pages de son roman Guignol’s Band, Louis-Ferdinand Céline y fait d’ailleurs référence : un maquereau y indique alors qu’il ne peut s’occuper que d’un petit nombre de prostitués, et rappelle à son interlocuteur qu’il “n’est pas le Pélican”. La rue du Pélican À lire également : Chat-qui-Pêche, Gît-le-Coeur, Brisemiche… les drôles de noms des voies parisiennes (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardin japonais d’Europe fête ses 40 ans avec... Actualités 5 musées chaleureux où passer l'hiver Les prochaines visites guidées /* Media query pour les �crans de petite taille */ .o-gallery.listvisitesingle { justify-content:center; } @media (max-width: 600px) { .o-gallery.listvisitesingle { flex-direction: column; /* Aligne les �l�ments en colonne */ justify-content: flex-start; /* Aligne les �l�ments au d�but du conteneur */ align-items: center; /* Centre les �l�ments horizontalement */ height: auto; /* Ajuste la hauteur du conteneur */ } } 02 mars 10h30 La face cachée 