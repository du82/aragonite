["https://www.pariszigzag.fr/insolite/histoire-insolite-paris/gare-orsay-paris"]
title = "Savez-vous où menait autrefois la gare du musée d’Orsay ? – Paris ZigZag | Insolite & Secret"
description = "Avant l'ouverture le musée d'Orsay en 1986  se trouvaient un palais, puis une gare desservant plusieurs grandes villes de France."
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Savez-vous où menait autrefois la gare du musée d’Orsay ? (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Ouvert en 1986, le musée d’Orsay possède la plus importante collection de peintures impressionnistes et postimpressionnistes au monde. Mais avant lui se trouvaient un palais, puis une gare desservant plusieurs grandes villes de France. À l’origine, le palais De 1810 à 1838, ce territoire proche de la Seine est occupé par un important chantier : celui du palais d’Orsay, édifié à l’initiative de Napoléon Ier sur les plans de l’architecte Jacques-Charles Bonnard, puis Jacques Lacornée (ces plans sont d’ailleurs aujourd’hui conservés au musée Carnavalet. À son ouverture, l’édifice a ensuite été occupé par le Conseil d’État au rez-de-chaussée, puis par la Cour des comptes au premier étage. Toutefois, lors de la Commune de Paris (1871), il est entièrement incendié. Félix Duban, Palais d’Orsay De Paris à Orléans L’édifice ayant été ravagé, ses ruines sont démolies pour construire un nouveau bâtiment. De 1898 à 1900, la gare d’Orsay est alors construite par l’architecte Victor Laloux. Celle-ci est alors érigée pour pouvoir accueillir les visiteurs de l’Exposition universelle de Paris, tout en prolongeant les lignes de la Compagnie d’Orléans en plein cœur de Paris. La gare d’Orsay La nouvelle gare, dite “gare d’Orléans“, est alors composée d’une impressionnante verrière à structure métallique. Sur sa façade, trois statues monumentales Jean-Baptiste Hugues, Laurent Marqueste et Jean-Antoine Injalbert représentent respectivement les trois principales destinations de la Compagnie, que sont les villes de Bordeaux, Toulouse et Nantes. Dans la salle des départs ou les différents salons du bâtiment, on trouve également des peintures de Fernand Cormon, Gabriel Ferrier ou Benjamin Constant. De la gare au musée Dès les années 1920, les quais de la gare d’Orsay deviennent trop courts et ne permettent plus le transport de grandes lignes ferroviaires. Aussi, l’édifice est limité au trafic de banlieue en 1939 et les autres lignes sont reportées à la gare de Paris-Austerlitz. Puis, le trafic est peu à peu abandonné. Le président de la République française Valéry Giscard d’Estaing lance alors le projet de transformer l’ancienne gare pour en faire un musée des arts du XIXe siècle, idée conservée lors de l’élection de François Mitterrand. Le 9 décembre 1986, le musée d’Orsay ouvre ses portes. Musée d’Orsay © dbrnjhrj, Adobe Stock À lire également : Pourquoi une statue de rhinocéros se trouve-t-elle sur le parvis du musée d’Orsay ? Image à la une : La gare d’Orsay au début du XXe siècle (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardin japonais d’Europe fête ses 40 ans avec... Actualités 