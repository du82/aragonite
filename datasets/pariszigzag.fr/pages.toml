description = "Amateurs de fruits de mer ou de viande exquise, le Sébillon est fait pour vous !"
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Cet élégant restaurant ouvert il y a 110 ans propose des fruits de mer et des viandes exquises ! (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Cet élégant restaurant est un incontournable du département des Hauts-de-Seine, et il se trouve à seulement une trentaine de minutes du centre de Paris ! Amateurs de viande exquise et de fruits de mer en tout genre, vous risquez d’avoir un coup de coeur pour cet établissement et son savoureux menu ! L’élégance d’une brasserie parisienne Saviez-vous que cela fait déjà 110 ans que le Sébillon a ouvert ses portes ? Porté par le groupe Joulie, ce restaurant réussit l’exploit de nous faire revivre le charme des brasseries parisiennes loin du tumulte parfois agaçant de la capitale ! Dans cet établissement d’exception, retrouvez une décoration élégante alternant les touches de noir et de marron avec un service irréprochable au déjeuner ou en soirée. Voilà un incontournable qu’il ne faut pas manquer ! © le Sébillon Un menu gourmand et raffiné L’élégance du Sébillon a largement contribué à assoir la réputation de l’établissement, mais figurez-vous que sa carte aussi ! Crevettes, langoustines, saumon, foie gras, filet de daurade, tartare de boeuf… C’est simple : il n’y a pas un seul met auquel vous pouvez songer qui ne serait pas inscrit sur le menu ! Évidemment, nous vous conseillons de goûter le plat le plus réputé du restaurant : leur gigot d’agneau ! Faites-nous confiance, vous ne le regretterez pas ! © Le Sébillon Des services d’exception Le Sébillon a tout de l’élégance des brasseries parisiennes puisque son service est tout simplement irréprochable. Du service voiturier jusqu’à la vente à emporter, vous aurez l’impression de vous évader de Paris le temps d’un repas. Alors, n’attendez plus : réservez ! © Le Sébillon Le Sébillon 20 avenue Charles de Gaulle 92 200 Neuilly Plus d’info ici ! Photo à la Une : © Le Sébillon À lire également : Quelles sont les meilleures adresses de Paris pour savourer un menu enfant ? (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardin japonais d’Europe fête ses 40 ans avec... Actualités 5 musées chaleureux où passer l'hiver Les prochaines visites guidées /* Media query pour les �crans de petite taille */ .o-gallery.listvisitesingle { justify-content:center; } @media (max-width: 600px) { .o-gallery.listvisitesingle { flex-direction: column; /* Aligne les �l�ments en colonne */ justify-content: flex-start; /* Aligne les �l�ments au d�but du conteneur */ align-items: center; /* Centre les �l�ments horizontalement */ height: auto; /* Ajuste la hauteur du conteneur */ } } 02 mars 10h30 La face cachée de Montmartre 02 mars 11h00 Le Marais hors des sentiers battus 02 mars 11h00 Le Père Lachaise insolite Voi