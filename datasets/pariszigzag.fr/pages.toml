title = "Magma, l’adresse gastronomique où la cuisine française rencontre l’excellence japonaise à Paris – Paris ZigZag | Insolite & Secret"
description = "Magma, l'adresse gastronomique où la cuisine française rencontre l'excellence japonaise à Paris"
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Magma, l’adresse gastronomique où la cuisine française rencontre l’excellence japonaise à Paris (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Sous la houlette du talentueux chef Ryuya Ono, cette table d’exception nichée dans le 11e arrondissement nous a tapé dans l’oeil. Fusionnant la précision des techniques japonaises avec la richesse du terroir français, elle crée des mariages subtils et une alchimie parfaite… On vous emmène chez Magma ! Une cuisine vivante et audacieuse Dès l’arrivée des amuse-bouches, on remarque la délicatesse et l’originalité des associations que concocte le chef au gré des arrivages et de ses inspirations. Ici, pas de superflu : chaque ingrédient est choisi avec exigence et travaillé avec une précision digne d’un orfèvre ! La mer et la volaille sont au centre des créations, sublimées par des produits nobles comme le lieu jaune ou le pigeon. Le tout, dans une démarche responsable où tout est optimisé pour limiter le gaspillage. Magma © AxelleC / Zigzag Un chef d’exception Originaire de la préfecture de Yamaguchi au Japon, Ryuya Ono est un passionné de gastronomie française. Fort d’une expérience acquise aux côtés de grands noms comme Bruno Verjus (Table) ou Sota Atsumi (Maison), il a su développer une cuisine raffinée et pleine de saveurs inattendues… À l’image de son dessert à la poire pochée et au chocolat avec une glace au Bleu d’Auvergne ! Chez Magma, chaque plat est une véritable mise en scène, où les produits locaux et de saison sont les acteurs principaux d’une pièce gastronomique en perpétuel renouveau. Magma © AxelleC / Zigzag Une cave entre nature et terroirs du monde Le sommelier Lorenzo Di Giosaffatte propose une sélection pointue de vins naturels et de cuvées d’exception, explorant aussi bien les terroirs français qu’internationaux. Le midi, le menu entrée plat dessert est à 38€ en semaine, 50€ le weekend, 70€ en 5 temps. Le soir, le menu en 5 temps est à 70€ et en 8 temps à 110€. On vous recommande vivement l’accord mets vins, à 60€ pour 5 verres assortis et 90€ pour 7 verres assortis. Et si vous êtes plus curieux, tentez l’accord mets-sakés qui s’avère plein de surprises ! Les Semaines du Saké au restaurant Magma © AxelleC / Zigzag Magma 9 Rue Jean-Pierre Timbaud, 75011 Paris Infos pratiques et réservations ici Crédit photo de une : Magma © Instagram @magma_paris A. C. (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardin japonais d’Europe fête ses 40 ans avec... Actualités 5 musées chaleureux où passer l'hiver Les prochaines visites guidées /* Media query pour les �crans de petite taille */ .o-gallery.listvisitesingle { justify-content:center; } @media (max-width: 600px) { .o-gallery.listvisitesingle { flex-direction: column; /