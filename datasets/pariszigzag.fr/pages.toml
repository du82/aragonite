["https://www.pariszigzag.fr/insolite/lieux-insolites/chapelle-saint-patrick"]
title = "Que fait cette superbe chapelle irlandaise à Paris ? Méconnue, elle se cache dans le quartier… – Paris ZigZag | Insolite & Secret"
description = "Que fait cette superbe chapelle irlandaise à Paris ? Méconnue, elle se cache dans le quartier..."
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Que fait cette superbe chapelle irlandaise à Paris ? Méconnue, elle se cache dans le quartier… (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Naturellement située dans la rue des Irlandais, cette chapelle inattendue se cache dans le Collège des Irlandais : un ensemble de bâtiments abritant des salles d’exposition, une médiathèque, une bibliothèque patrimoniale avec plus de 8000 ouvrages anciens, mais aussi une quarantaine de chambres accueillant des étudiants irlandais ou des artistes en résidence. Aujourd’hui, on vous en dit plus sur ce lieu insolite et méconnu des Parisiens ! Le Centre Culturel Irlandais Situé dans le Quartier Latin, cet édifice n’est pas seulement une belle vitrine de la culture irlandaise, il a aussi évolué avec Paris au gré des événements historiques qui ont marqué la capitale. Le Centre Culturel Irlandais est en effet installé dans le Collège des Irlandais, ancienne résidence d’une communauté irlandaise de prêtres, séminaristes et étudiants, dont les origines remontent à 1578… L’entrée du Centre culturel et ses hautes portes toujours surmontées du nom de Collège des Irlandais (© un petit pois sur dix) Une histoire itinérante Le parcours de la communauté irlandaise à Paris trouve son origine dans la seconde moitié du XVIe siècle : le schisme anglican, au cours duquel l’Église d’Angleterre rompt avec l’autorité du pape et l’Église catholique romaine, entraîne la dissolution des abbayes, couvents et monastères en Irlande. Cette résolution pousse de nombreux prêtres et étudiants catholiques à rechercher un enseignement sur le continent. Ces derniers fondent alors plusieurs collèges irlandais à travers l’Europe, en Espagne, en Italie, mais aussi en France. En 1578, le Père John Lee établit ainsi la première communauté d’étudiants irlandais dans la capitale française au sein du Collège de Montaigu. En 1677, le roi Louis XIV leur accorde le droit de s’installer de manière permanente au Collège des Lombards, institution initialement fondée en 1330 pour y loger des étudiants italiens située rue des Carmes. De ce premier collège irlandais, ne reste aujourd’hui que la chapelle devenue l’Église Saint Ephrem des Syriens. Le Collège des Lombards sous le crayon de Léon Leymonnerye en 1877 (© Musée Carnavalet) Installation rue du Cheval Vert, future rue des Irlandais Un siècle plus tard, en 1769, Laurence Kelly, préfet du Collège des Lombards, achète un hôtel particulier à quelques pas de là, rue du Cheval Vert. Le bâtiment, inauguré en 1775, ainsi que sa belle cour intérieure où il fait bon flâner en été, sont l’oeuvre de l’architecte-paysagiste François-Joseph Bélanger. L’une des deux ailes ajoutées à la bâtisse abrite encore aujourd’hui la jolie Chapelle Saint-Patrick, petit trésor architectural dont la particularité est d’offrir des bancs d’église disposés, non pas face à l’autel, mais face à face ! La chapelle érigée en l’honneur de Saint Patrick (© un petit pois sur dix) Le Collège des Irlandais pleinement inscrit dans l’histoire de Paris Après avoir à nouveau perdu leur lieu de résidence pendant la Révolution française, les étudiants et prêtres irlandais se réinstallent au Collège des Irlandais en 1805. Deux ans plus tard, la rue est renommée rue des Irlandais par décret napoléonien. Entre le XIXe siècle et le 18 octobre 2002, date de l’inauguration du centre, l’histoire de cet édifice remarquable embrasse alors pleinement celle de la France et de sa capitale. Pendant la guerre franco-prussienne de 1870-1871, le Collège des Irlandais est converti en hôpital de campagne et accueille plus de 300 soldats français blessés au combat. 45 ans plus tard, la Grande Guerre pousse des milliers de réfugiés des fronts de l’Est vers la capitale et plusieurs centaines d’entre eux sont accueillis dans les locaux de l’institution irlandaise. La bibliothèque patrimoniale du Centre culturel irlandais où sont conservés près de 8000 ouvrages anciens (© CCI) Devenu un abri à la disposition de l’armée américaine au sortir de la Seconde Guerre mondiale, le Collège des Irlandais laisse place quelques mois plus tard à un séminaire polonais, accueillant notamment des clercs rescapés des camps de concentration. Les religieux polonais y élisent domicile jusqu’en 1997, année durant laquelle le gouvernement irlandais rachète la grande bâtisse afin d’y établir le Centre Culturel Irlandais en 2002, digne successeur de l’héritage multiséculaire du Collège des Irlandais. Plus d’infos sur le Centre Culturel Irlandais ici Et pour découvrir tous les secrets du Quartier Latin c’est par là A lire également : Connaissez-vous la chapelle de la Congrégation du Saint-Esprit, cachée dans le quartier latin ? (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardi