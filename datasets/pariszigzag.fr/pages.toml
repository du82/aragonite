["https://www.pariszigzag.fr/paris-au-quotidien/actualites-paris/grand-prix-formule-1-paris"]
title = "L’idée folle d’un Grand Prix de Formule 1 dans les rues de Paris pourrait-elle devenir réalité ? – Paris ZigZag | Insolite & Secret"
description = "Selon le patron de l'écurie Alpine, la capitale devrait être la destination idéale pour accueillir de nouveau un Grand Prix en France..."
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture L’idée folle d’un Grand Prix de Formule 1 dans les rues de Paris pourrait-elle devenir réalité ? (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Malgré de nombreuses critiques et méfiances, la récente tenue des Jeux Olympiques et Paralympiques a démontré que Paris était une ville capable d’accueillir un événement sportif de grande ampleur, avec le nombre colossal de personnes que cela implique. De quoi peut-être donner des idées à certains qui voient bien plus loin qu’une étape du Tour de France ou un match de NBA… comme de la Formule 1 par exemple ? Un Grand Prix en pleine ville comme à Monaco ? Lors de la cérémonie F175 à Londres, Flavio Briatore a exprimé son souhait de voir la Formule 1 revenir en France, avec Paris comme ville-hôte. Selon le consultant de l’écurie Alpine, la capitale offre en effet les infrastructures nécessaires pour accueillir un tel événement, contrairement au Castellet. “Évidemment, ce ne sera pas un Grand Prix dans Paris en passant sous la tour Eiffel, mais ça serait magnifique. Aujourd’hui, avec tous les sponsors derrière la F1 et tous les gens qui travaillent autour, il faut impérativement des capacités hôtelières importantes. Et ce n’est pas le Castellet qui peut les offrir. Paris, oui”, a notamment déclaré Briatore. 🔵 Flavio Briatore aimerait que la France ait de nouveau un Grand Prix de F1 ! “Tout le monde veut un Grand Prix en France, la F1 manque à la France ! Un ParisGP ce serait top.” “La F1 mérite un Grand Prix à Paris là où il y a toute la capacité hôtelière pour accueillir tout… pic.twitter.com/U1WJpF6cTe — PG_10FanpageFr 🇫🇷 (@PG10_FanactuFr) February 19, 2025 Des bolides lancés à plus de 350 km/h dans les rues de la capitale ? Une idée pas tout à fait nouvelle, puisque l’organisation d’un Grand Prix en région parisienne avait déjà été discutée. Cela remonte à 2010, alors que le GP de France avait disparu après la saison 2008, avec un projet d’un circuit proche de Disneyland Paris, à Marne-la-Vallée, qui n’a finalement pas vu le jour. Les amateurs de sensations fortes et de vitesse avaient toutefois pu prendre leur mal en patience, avec la tenue de courses de Formule E dans la capitale de 2016 à 2019. Si l’étape hexagonale a disparu du calendrier de la Formule 1 depuis 2023, Briatore est donc formel : ce ne doit pas être à Magny-Cours, “où il n’y a quasiment rien”, ni sur le circuit Paul-Ricard du Castellet, qui est “impossible avec les problèmes de circulation”. Des obstacles d’ordre économique et écologique Loin d’être passée inaperçue, cette proposition n’a pas tardé à relancer le débat sur l’organisation d’un Grand Prix en France. Entre l’Hexagone et la Formule 1, il s’agit pourtant d’une longue histoire dont le dernier épisode remonte déjà à 2022, sur le Circuit Paul-Ricard. Avant le Castellet, apparu dès les années 1970, la discipline-reine s’est produite sur d’autres circuits mythiques comme Reims-Gueux, Rouen-Les-Essarts, Le Mans, Charade ou Dijon-Prenois, sans oublier Magny-Cours de 1991 à 2008. Si l’absence d’un tel événement en France déplaît à beaucoup, le sujet soulève de nombreux problèmes politiques, écologiques et économiques. Voir cette publication sur Instagram Une publication partagée par Artiste Auteur Compositeur Interprète (@y_rem) Si le Castellet semble à ce jour le seul circuit en France à même d’accueillir une épreuve de cette envergure, Magny-Cours, jugé trop difficile d’accès, nécessiterait des investissements particulièrement importants. Un dernier point qui ne joue également pas en faveur du choix de Paris, d’autant plus quand on sait qu’il a fallu près d’un demi-milliard de dollars pour adapter Las Vegas à la venue de la F1. Quelques mois après l’organisation des Jeux Olympiques et Paralympiques, pas sûr qu’un tel projet soit donc parmi les priorités. Enfin, au vu des efforts de la Ville de Paris pour lutter contre la pollution, favoriser la mobilité douce et limiter la circulation automobile, débloquer des fonds publics pour soutenir la Formule 1 serait un énorme pas en arrière. À lire également : Le plus grand jardin japonais d’Europe fête ses 40 ans avec une immersion dans l’Empire du Soleil Levant Image à la une : Grand Prix de Formule E Paris © AFP (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardin japonais d’Europe fête ses 40 ans avec... Actualités 5 musées chaleureux où passer l'hiver Les prochaines visites guidées /* Media query pour les �crans de petite taille */ .o-gallery.listvisitesingle { justify-content:center; } @media (max-width: 600px) { .o-gallery.listvisitesingle { flex-direction: column; /* Aligne les �l�ments en colonne */ justify-content: flex-start; /* Aligne les �l�ments au d�but du conteneur */ align-items: center; /* Centre les �l�ments horizontalement */ height: auto; /* Ajuste la hauteur du conteneur */ } } 02 mars 10h30 La face cachée de Montmartre 02 mars 11h00 Le Marais hors des sentiers battus 02 mars 11h00 Le Père Lachaise insolite Voir toutes nos activités'''
