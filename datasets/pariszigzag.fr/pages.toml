["https://www.pariszigzag.fr/insolite/lieux-insolites/chapelle-notre-dame-rugby"]
title = "Découvrez la chapelle la plus insolite de France qui célèbre l’Ovalie – Paris ZigZag | Insolite & Secret"
description = "Au cœur des Landes, à Larrivière-Saint-Savin, se cache un lieu insolite et unique en France : la chapelle Notre-Dame du Rugby."
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Découvrez la chapelle la plus insolite de France qui célèbre l’Ovalie (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Au cœur des Landes, à Larrivière-Saint-Savin, se cache un lieu insolite et unique en France : la chapelle Notre-Dame du Rugby. Cette chapelle singulière, dédiée aux amoureux du ballon ovale, est bien plus qu’un édifice religieux, elle incarne un hommage vibrant à la grande famille du rugby, mêlant ferveur spirituelle et passion sportive. View this post on Instagram A post shared by ovalgg (@rugbystoric) Une chapelle pas comme les autres L’histoire de Notre-Dame du Rugby débute dans les années 1960, sous l’impulsion de l’abbé Michel Devert. Ce prêtre landais, grand amateur de rugby, décide de transformer une ancienne chapelle en ruine en un sanctuaire dédié à trois joueurs disparus, Jean Othats, Raymond Albaladejo et Émile Carrère dans un accident de la route. Grâce à la générosité des clubs et des passionnés, l’édifice renaît et devient un lieu emblématique où se croisent foi et tradition rugbystique. Dès l’entrée, l’atmosphère est unique : les murs de la chapelle sont ornés de maillots, de ballons et de plaques commémoratives rendant hommage aux clubs. Parmi les vitraux, certains représentent des scènes de mêlée ou de passes, sublimant ainsi l’esprit du rugby à travers l’art religieux. View this post on Instagram A post shared by Axelle B (@axattaks) Un sanctuaire empli d’émotion Les visiteurs ressentent immédiatement la force symbolique du lieu. On y trouve des maillots de clubs locaux et internationaux, mais aussi des tenues de légendes du rugby, offertes en hommage par des équipes du monde entier. Chaque objet raconte une histoire, souvent marquée par la fraternité et le respect, des valeurs chères à ce sport. Un espace d’exposition jouxtant la chapelle permet de découvrir encore plus d’anecdotes et d’objets historiques liés à l’histoire du rugby. Ce musée vivant attire autant les amateurs de sport que les curieux en quête de patrimoine insolite. Un lieu unique en son genre Aujourd’hui encore, Notre-Dame du Rugby reste un lieu de pèlerinage pour les passionnés du ballon ovale. Des cérémonies y sont organisées, notamment avant les grands tournois, et nombreux sont les joueurs et supporters qui viennent s’y recueillir ou simplement ressentir l’âme du rugby. Insolite, touchante et chargée d’émotion, cette chapelle landaise est une étape incontournable pour qui veut découvrir l’histoire d’un sport ancré dans l’identité du Sud-Ouest. Crédit photo de une : © Tourisme Landes (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardin japonais d’Europe fête ses 40 ans avec... Actualités 5 musées chaleureux où passer l'hiver Les prochaines visites guidées /* Media