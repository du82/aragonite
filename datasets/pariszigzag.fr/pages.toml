["https://www.pariszigzag.fr/paris-au-quotidien/actualites-paris/cite-cinema-grand-public-2026"]
title = "Un avenir enfin radieux pour la Cité du Cinéma avec une ouverture au grand public attendue pour 2026 – Paris ZigZag | Insolite & Secret"
description = "Au cœur d'un nouveau projet mené par Seine & Watts, le complexe francilien accueillera notamment des expositions et événements d'entreprise."
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Un avenir enfin radieux pour la Cité du Cinéma avec une ouverture au grand public attendue pour 2026 (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Rivaliser avec les célèbres studios Pinewood de Londres pour les tournages de grande ampleur, tel était l’ambitieux projet de Luc Besson, grande figure du cinéma français, en imaginant la Cité du Cinéma dans une partie de l’ancienne centrale électrique de Saint-Denis au début des années 2000. Après des années d’investissement, la Cité du Cinéma avait finalement vu le jour en 2012. Mais des affaires juridiques et économiques ont finalement eu raison de l’école de scénariste et réalisateur au cœur de la cité, gratuite et sans condition de diplôme, et donc de la renommée de cette cité. Une cité bientôt accessible à tous La question qui se posait désormais était de savoir ce qu’il pourrait advenir de ce gigantesque complexe aux portes de Paris. Après des semaines de rumeurs, c’est officiel : la Cité du cinéma va bel et bien devenir un pôle d’attraction événementiel et culturel, pour abriter de nouveaux usages axés sur les industries culturelles et créatives. Au total, 12 000 m2 seront dédiés à ce nouveau projet porté par Seine & Watts, une société créée en octobre 2024 et réunissant 4 actionnaires leaders dans l’audiovisuel, la communication, la restauration et l’événementiel. Nouvel exploitant pour une durée de dix ans, qui garde par ailleurs certains locataires historiques comme l’école de cinéma Louis Lumière ou Studio de Paris qui accueille les tournages de films ou de séries comme Emily in Paris, la société Seine & Watts ambitionne d’attirer sur le site quelque 300 000 visiteurs annuels. Reportage rénovation cité du cinéma de Saint-Denis.#GrandParis#SeineSaintDenis#SaintDenis pic.twitter.com/lyRkLqxKwr — lucioleparis (@departemenparis) February 9, 2025 Dans les faits, la monumentale nef composée de verres et d’aciers sera rénovée pour accueillir jusqu’à 6 000 personnes lors de grands évènements. Après avoir passé l’entrée surplombée par des anneaux olympiques, en référence à sa reconversion l’été dernier en cantine olympique pour les athlètes du monde entier, les curieux pourront découvrir une nef attenante divisée en plusieurs étages pour accueillir un “food court” de 1000 places. Ancienne cité du cinéma oblige, la salle de cinéma de 450 places et ses sièges XXL seront conservés pour accueillir à l’avenir des projections de films, des premières réalisations et même à des spectacles de stand-up. Enfin d’autres espaces seront aménagés pour accueillir des expositions “mainstream” ou de grandes réunions d’entreprise. Nouvelle chance après l’échec de ce “Hollywood-sur-Seine” Pour que le site soit ouvert au public toute la journée, l’esplanade va également être réaménagée pour “devenir le cœur battant du quartier du village olympique”, selon Mathieu Hanotin, maire de Saint-Denis. Attendue pour avril 2026, cette ouverture au grand public entend également participer au “rayonnement” du quartier Pleyel, appelé à devenir un pôle économique majeur suite aux Jeux Olympiques et aux travaux du Grand Paris. Tandis que la station de métro Pleyel devrait devenir le nouveau hub des transports franciliens, un hôtel 5 étoiles flambant neuf a récemment vu le jour, un parc est en cours d’aménagement et d’autres projets comme une salle d’escalade sont en cours. La Cité du Cinéma bientôt ouverte aux Dionysien·nes ! ✨ Saint-Denis poursuit sa transformation avec une ambition forte : réconcilier la ville et la Seine et offrir de nouveaux lieux de vie aux habitants. 🤝 👉 Plus d’infos : https://t.co/c0YoV0xcIS pic.twitter.com/04d0b4AwCw — Ville de Saint-Denis (@VilleSaintDenis) February 6, 2025 En attendant de savoir si cette Cité du Cinéma 2.0 parviendra à tirer son épingle du jeu, le complexe proposera d’ici là des spectacles dans la grande nef, comme un avant-goût de cet ambitieux avenir. Rendez-vous en juin prochain pour venir admirer le Paris Dance Project, un spectacle de danse contemporaine dirigé par le chorégraphe star Benjamin Millepied. De quoi présager (enfin) un avenir glorieux pour cette cité jadis synonyme de déception. De cette ancienne usine électrique du début du XXe siècle, le célèbre réalisateur Luc Besson avait envisagé d’en faire un pôle cinématographique majeur aux portes de Paris. Réhabilité puis Inauguré en 2012, le complexe n’avait finalement pas réussi à se hisser à la hauteur des ambitions initiales d’un “Hollywood-sur-Seine”, les propriétaires finissant même par évincer la société de production EuropaCorp. À lire également : Quel est ce fameux chocolat Dubaï à la pistache dont tout le monde parle ? On l’a trouvé à Paris Image à la une : Cité du Cinéma © AFP (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs 