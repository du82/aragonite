description = "Ce fastueux château occitan cache des fresques Art Nouveau réalisées par des artistes parisiens"
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Ce fastueux château occitan cache des fresques Art Nouveau réalisées par des artistes parisiens (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Perché fièrement sur les hauteurs de Céret, le château d’Aubiry est bien plus qu’une simple demeure historique. C’est un véritable trésor architectural qui raconte une histoire fascinante, parsemée d’anecdotes surprenantes et de secrets bien gardés. Plongeons ensemble dans l’univers enchanteur de ce joyau du XIXᵉ siècle. Un cadeau familial au cœur des Pyrénées-Orientales À la fin du XIXᵉ siècle, l’industriel Pierre Bardou-Job, célèbre pour avoir popularisé le papier à cigarettes JOB, décide d’offrir à chacun de ses enfants un château somptueux. Pour son fils Justin, il commande le château d’Aubiry à l’architecte danois Viggo Dorph-Petersen. Les travaux s’étendent de 1893 à 1904, aboutissant à une œuvre magistrale du style néo-baroque. Ancienne carte postale du château d’Aubiry © Delcampe Des décors somptueux et des serres signées Eiffel ? L’une des curiosités les plus intrigantes du domaine réside dans ses serres monumentales. Souvent attribuées à Gustave Eiffel, ces structures métalliques aux dômes vitrés de 16 mètres de hauteur sont en réalité l’œuvre des établissements Guillot-Pelletier fils et Jouffroy d’Orléans. Serres du château d’Aubiry © Jielka Des secrets bien gardés L’intérieur du château est un véritable écrin d’Art nouveau, avec des fresques réalisées par les artistes parisiens Paul Gervais et Henry Perrault. Parmi les nombreuses pièces du château, certaines cachent des secrets étonnants. On raconte que la bibliothèque serait une réplique de celle de l’impératrice Joséphine au château de Malmaison, tandis que la salle de billard s’inspirerait de celle du palais Catherine en Russie. Des clins d’œil historiques qui ajoutent au charme mystérieux des lieux. Fresques Art Nouveau du château d’Aubiry © Occitanie Films Un château star du Cinéma Le château d’Aubiry n’a pas seulement séduit les amateurs d’architecture. En 1960, il sert de décor principal au film “L’Eau à la bouche” de Jacques Doniol-Valcroze, une comédie romantique emblématique de la Nouvelle Vague française. Plus récemment, en 2024, il accueille le tournage du “Comte de Monte-Cristo”, offrant ses somptueux décors à cette nouvelle adaptation cinématographique. Intérieur du château d’Aubiry © Occitanie Films Une nouvelle vie pour le domaine Après avoir appartenu à la famille Bardou jusqu’en 1973, le château est racheté par la famille De Pra. En 2024, le domaine s’anime avec l’événement “Les Splendeurs de Chine”, un parc à thème dédié à la culture chinoise, illuminant le parc de milliers de lanternes et attirant des milliers de visiteurs. Le château d’Aubiry est bien plus qu’un simple monument historique. C’est un lieu vivant, témoin de l’histoire, de l’art et de la culture, qui continue de fasciner et d’émerveiller tous ceux qui ont la chance de le découvrir. À lire également : Connaissez-vous le somptueux château de Dampont, en région parisienne, où a été tourné le Comte de Monte Cristo ? Crédit photo de une : Chateau d’Aubiry © Vallespir Tourisme A. C. (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de P