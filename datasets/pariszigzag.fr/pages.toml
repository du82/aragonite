title = "Perchée sur une falaise, cette cité médiévale aux paysages spectaculaire est l’un des Plus Beaux Villages de France – Paris ZigZag | Insolite & Secret"
description = "Surplombant les Gorges de l'Ardèche depuis son promontoire rocheux, la cité médiévale d'Aiguèze est l'un des Plus Beaux Villages de France."
full_description = '''Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Perchée sur une falaise, cette cité médiévale aux paysages spectaculaire est l’un des Plus Beaux Villages de France (adsbygoogle = window.adsbygoogle || []).push({}); sas.setup({ networkid: 62, domain: "//ww62.smartadserver.com" }); sas.call("std", { siteId: 66847, // pageId: 512480, // Page : 1-pariszigzag.fr/rg formatId: 439, // Format : IMU 300x600 target: '' // Ciblage }); <a href="http://ww62.smartadserver.com/ac?jump=1&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]&out=nonrich" target="_blank"> <img src="http://ww62.smartadserver.com/ac?out=nonrich&nwid=62&siteid=66847&pgname=rg&fmtid=439&visit=m&tmstp=[timestamp]" border="0" alt="" /></a> Entre ruelles pavées, vestiges médiévaux et panoramas à couper le souffle, ce village médiéval au charme intemporel, perché sur son éperon rocheux, offre une escapade hors du temps. Il est d’ailleurs classé parmi les Plus Beaux Villages de France. On vous emmène le découvrir. Un trésor médiéval au cœur des Gorges de l’Ardèche L’histoire de ce lieu fascinant et très photogénique remonte au VIIIe siècle, lorsque les comtes de Toulouse y érigèrent une forteresse stratégiquement perchée sur un éperon rocheux dominant l’Ardèche. Ce site était d’une importance capitale pour le contrôle des routes commerciales fluviales reliant le Rhône à l’intérieur des terres. Témoin des grands bouleversements de l’Histoire, le village a survécu à des épisodes tumultueux, des invasions sarrasines aux révoltes paysannes du XIVe siècle, connues sous le nom de “jacqueries”. Chaque siècle a ainsi laissé son empreinte, mêlant destructions, reconstructions et légendes. Le village d’Aigueze et les vestiges de ses fortifications © Flickr Rémi Avignon Panorama d’Aigueze dans le Gard © Flickr Avignon Pourtant, grâce à l’engagement d’un homme passionné, Monseigneur Fuzet, archevêque de Rouen et enfant du pays, ce joyau architectural a été préservé. Au début du XXe siècle, ce dernier initia de vastes travaux de restauration, assurant la sauvegarde de lieux emblématiques tels que la place du Jeu de Paume, l’église romane du XIe siècle ainsi que la Grand Rue, pavée de galets de l’Ardèche, ou encore ses nombreux puits. C’est à lui que l’on doit également la conservation du passage voûté de la “Combe aux oiseaux”, une curiosité architecturale typique de la région. Un patrimoine exceptionnel à explorer Au fil des ruelles sinueuses, le village dévoile des trésors insoupçonnés. Les vestiges de la forteresse médiévale dominent encore le paysage avec la tour sarrasine, vestige des premières tours de défense érigées par Raymond de Saint-Gilles, comte de Toulouse. L’église paroissiale, inscrite aux Monuments Historiques, fascine par son mélange d’influences : une base romane, un portail Renaissance élégant, et un clocher gothique restauré en 1915, surmonté de fresques néo-gothiques redécouvertes et restaurées au début du XXIe siècle. Maison du sculpteur à Aigueze © Flickr Rémi Avignon Les maisons en pierre claire, typiques, racontent elles aussi l’histoire du village. Leurs rez-de-chaussée médiévaux sont surmontés d’étages Renaissance ornés de fenêtres à meneaux. Parmi elles, la “maison du sculpteur” attire les regards avec ses sculptures énigmatiques représentant des figures historiques et des symboles mystérieux. Cette maison est habitée par un artiste au parcours étonnant, Robert de Wittelsbach de Traxel, dont les œuvres animent encore la vie culturelle locale. Aiguèze, classé parmi les Plus Beaux Villages de France Perché sur son éperon rocheux, le village d’Aiguèze, dont le nom signifie « eau dans le rocher », surplombe majestueusement les gorges de l’Ardèche et offre des panoramas à couper le souffle. Le chemin de ronde, vestige des fortifications, déroule un sentier pittoresque offrant des vues imprenables sur la rivière, la plaine du Rhône et, au loin, la silhouette majestueuse du mont Ventoux. Ruelles pittoresques d’Aigueze © Flickr Rémi Avignon Les environs se prêtent à des randonnées inoubliables, notamment le parcours du “Castelas”, qui suit l’ancien chemin de ronde du château fort. Ce sentier permet de découvrir la diversité des paysages environnants : garrigues parfumées, vignobles des Côtes du Rhône, et falaises spectaculaires sculptées par le temps. Après l’effort, on peut savourer des spécialités locales, telles que des miels aux arômes délicats et des vins raffinés produits sur les coteaux ensoleillés du Rhône. Non loin de là, d’autres villages parmi les plus charmants et pittoresques du Gard sont également à découvrir comme Lussan, Montclus, ou encore La Roque sur Cèze. D’autres petits joyaux dont nous parlerons sans aucun doute très bientôt ! À lire également : Bâtie sur deux rives du Lot, cette ville possède sept monuments classés à elle seule Image en Une : Village médiéval d’Aigueze © Flickr Pascal Rouve Mélina Hoffmann (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); A la Une Savez-vous où menait autrefois la gare du musée d'Orsay ? Insolite Histoires de Paris La Tour Eiffel s’illumine aux couleurs de l’Ukraine ce 24 février... Actualités L’idée folle d’un Grand Prix de Formule 1 dans les rues... Actualités Le chef Jean Imbert prend les commandes du premier restaurant gastronomique... Actualités Découvrez la chapelle la plus insolite de France qui célèbre l'Ovalie Lieux insolites Petit-déjeuner, tricot, quiz... chaque mois, les cinémas indépendants vous convient à... Loisirs Culture Le plus grand jardin japonais d’Europe fête ses 40 ans avec... Actualités 5 musées chaleureux où passer l'hiver Les prochaines visites guidées /* Media query pour les �crans de petite taille */ .o-gallery.listvisitesingle { justify-content:center; } @media (max-width: 600px) { .o-gallery.listvisitesingle { flex-direction: column; /* Ali