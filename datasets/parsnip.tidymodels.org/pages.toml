title = "Random forest — rand_forest • parsnip"
description = """
rand_forest() defines a model that creates a large number of decision
trees, each independent of the others. The final prediction uses all
predictions from the individual trees and combines them. This function can fit
classification, regression, and censored regression models.
There are different ways to fit this model, and the method of estimation is  chosen by setting the model engine. The engine-specific pages  for this model are listed  below.
ranger¹
aorsf²
h2o²
partykit²
randomForest
spark
¹ The default engine. ² Requires a parsnip extension package for censored regression, classification, and regression.
More information on how parsnip is used for modeling is at
https://www.tidymodels.org/."""
full_description = 'Random forest Source: R/rand_forest.R rand_forest.Rd rand_forest() defines a model that creates a large number of decision trees, each independent of the others. The final prediction uses all predictions from the individual trees and combines them. This function can fit classification, regression, and censored regression models. There are different ways to fit this model, and the method of estimation is chosen by setting the model engine. The engine-specific pages for this model are listed below.ranger¹ aorsf² h2o² partykit² randomForest spark ¹ The default engine. ² Requires a parsnip extension package for censored regression, classification, and regression. More information on how parsnip is used for modeling is at https://www.tidymodels.org/. Usage rand_forest( mode = "unknown", engine = "ranger", mtry = NULL, trees = NULL, min_n = NULL ) Arguments mode A single character string for the prediction outcome mode. Possible values for this model are "unknown", "regression", "classification", or "censored regression". engine A single character string specifying what computational engine to use for fitting. mtry An integer for the number of predictors that will be randomly sampled at each split when creating the tree models. trees An integer for the number of trees contained in the ensemble. min_n An integer for the minimum number of data points in a node that are required for the node to be split further. Details This function only defines what type of model is being fit. Once an engine is specified, the method to fit the model is also defined. See set_engine() for more on setting the engine, including how to set engine arguments. The model is not trained or fit until the fit() function is used with the data. Each of the arguments in this function other than mode and engine are captured as quosures. To pass values programmatically, use the injection operator like so: value <- 1 rand_forest(argument = !!value) References https://www.tidymodels.org, Tidy Modeling with R, searchable table of parsnip models See also fit(), set_engine(), update(), ranger engine details, aorsf engine details, h2o engine details, partykit engine details, randomForest engine details, spark engine details Examples show_engines("rand_forest") #> # A tibble: 6 × 2 #> engine mode #> <chr> <chr> #> 1 ranger classification #> 2 ranger regression #> 3 randomForest classification #> 4 randomForest regression #> 5 spark classification #> 6 spark regression rand_forest(mode = "classification", trees = 2000) #> Random Forest Model Specification (classification) #> #> Main Arguments: #> trees = 2000 #> #> Computational engine: ranger #>'
