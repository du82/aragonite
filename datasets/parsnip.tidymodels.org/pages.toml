["https://parsnip.tidymodels.org/articles/Examples.html"]
title = "Fitting and predicting with parsnip • parsnip"
description = """
This vignette  show how to **fit** and **predict** with different
combinations of model, mode, and engine."""
full_description = 'Fitting and predicting with parsnip Source: vignettes/articles/Examples.Rmd Examples.Rmd These examples show how to fit and predict with different combinations of model, mode, and engine. As a reminder, in parsnip, the model type differentiates basic modeling approaches, such as random forests, logistic regression, linear support vector machines, etc., the mode denotes in what kind of modeling context it will be used (most commonly, classification or regression), and the computational engine indicates how the model is fit, such as with a specific R package implementation or even methods outside of R like Keras or Stan. The following examples use consistent data sets throughout. For regression, we use the Chicago ridership data. For classification, we use an artificial data set for a binary example and the Palmer penguins data for a multiclass example. bart() models With the "dbarts" engine Regression Example (dbarts) We’ll model the ridership on the Chicago elevated trains as a function of the 14 day lagged ridership at two stations. The two predictors are in the same units (rides per day/1000) and do not need to be normalized. All but the last week of data are used for training. The last week will be predicted after the model is fit. library(tidymodels) ## ── Attaching packages ──────────────────────── tidymodels 1.2.0.9000 ── ## ✔ broom 1.0.7 ✔ rsample 1.2.1 ## ✔ dials 1.4.0 ✔ tibble 3.2.1 ## ✔ dplyr 1.1.4 ✔ tidyr 1.3.1 ## ✔ infer 1.0.7 ✔ tune 1.2.1 ## ✔ modeldata 1.4.0 ✔ workflows 1.1.4 ## ✔ parsnip 1.3.0 ✔ workflowsets 1.1.0 ## ✔ purrr 1.0.4 ✔ yardstick 1.3.2 ## ✔ recipes 1.1.1 ## ── Conflicts ──────────────────────────────── tidymodels_conflicts() ── ## ✖ purrr::discard() masks scales::discard() ## ✖ dplyr::filter() masks stats::filter() ## ✖ dplyr::lag() masks stats::lag() ## ✖ recipes::step() masks stats::step() tidymodels_prefer() data(Chicago) n <- nrow(Chicago) Chicago <- Chicago %>% select(ridership, Clark_Lake, Quincy_Wells) Chicago_train <- Chicago[1:(n - 7), ] Chicago_test <- Chicago[(n - 6):n, ] We can define the model with specific parameters: bt_reg_spec <- bart(trees = 15) %>% # This model can be used for classification or regression, so set mode set_mode("regression") %>% set_engine("dbarts") bt_reg_spec ## BART Model Specification (regression) ## ## Main Arguments: ## trees = 15 ## ## Computational engine: dbarts Now we create the model fit object: set.seed(1) bt_reg_fit <- bt_reg_spec %>% fit(ridership ~ ., data = Chicago_train) bt_reg_fit ## parsnip model object ## ## ## Call: ## `NULL`() The holdout data can be predicted: predict(bt_reg_fit, Chicago_test) ## # A tibble: 7 × 1 ## .pred ## <dbl> ## 1 20.1 ## 2 20.3 ## 3 21.3 ## 4 20.2 ## 5 19.4 ## 6 7.51 ## 7 6.44 Classification Example (dbarts) The example data has two predictors and an outcome with two classes. Both predictors are in the same units. library(tidymodels) tidymodels_prefer() data(two_class_dat) data_train <- two_class_dat[-(1:10), ] data_test <- two_class_dat[ 1:10 , ] We can define the model with specific parameters: bt_cls_spec <- bart(trees = 15) %>% # This model can be used for classification or regression, so set mode set_mode("classification") %>% set_engine("dbarts") bt_cls_spec ## ## Call: ## NULL Now we create the model fit object: set.seed(1) bt_cls_fit <- bt_cls_spec %>% fit(Class ~ ., data = data_train) bt_cls_fit ## parsnip model object ## ## ## Call: ## `NULL`() The holdout data can be predicted for both hard class predictions and probabilities. We’ll bind these together into one tibble: bind_cols( predict(bt_cls_fit, data_test), predict(bt_cls_fit, data_test, type = "prob") ) ## # A tibble: 10 × 3 ## .pred_class .pred_Class1 .pred_Class2 ## <fct> <dbl> <dbl> ## 1 Class2 0.352 0.648 ## 2 Class1 0.823 0.177 ## 3 Class1 0.497 0.503 ## 4 Class2 0.509 0.491 ## 5 Class2 0.434 0.566 ## 6 Class2 0.185 0.815 ## 7 Class1 0.663 0.337 ## 8 Class2 0.392 0.608 ## 9 Class1 0.967 0.033 ## 10 Class2 0.095 0.905 boost_tree() models With the "xgboost" engine Regression Example (xgboost) We’ll model the ridership on the Chicago elevated trains as a function of the 14 day lagged ridership at two stations. The two predictors are in the same units (rides per day/1000) and do not need to be normalized. All but the last week of data are used for training. The last week will be predicted after the model is fit. library(tidymodels) tidymodels_prefer() data(Chicago) n <- nrow(Chicago) Chicago <- Chicago %>% select(ridership, Clark_Lake, Quincy_Wells) Chicago_train <- Chicago[1:(n - 7), ] Chicago_test <- Chicago[(n - 6):n, ] We can define the model with specific parameters: bt_reg_spec <- boost_tree(trees = 15) %>% # This model can be used for classification or regression, so set mode set_mode("regression") %>% set_engine("xgboost") bt_reg_spec ## Boosted Tree Model Specification (regression) ## ## Main Arguments: ## trees = 15 ## ## Computational engine: xgboost Now we create the model fit object: set.seed(1) bt_reg_fit <- bt_reg_spec %>% fit(ridership ~ ., data = Chicago_train) bt_reg_fit ## parsnip model object ## ## ##### xgb.Booster ## raw: 51.4 Kb ## call: ## xgboost::xgb.train(params = list(eta = 0.3, max_depth = 6, gamma = 0, ## colsample_bytree = 1, colsample_bynode = 1, min_child_weight = 1, ## subsample = 1), data = x$data, nrounds = 15, watchlist = x$watchlist, ## verbose = 0, nthread = 1, objective = "reg:squarederror") ## params (as set within xgb.train): ## eta = "0.3", max_depth = "6", gamma = "0", colsample_bytree = "1", colsample_bynode = "1", min_child_weight = "1", subsample = "1", nthread = "1", objective = "reg:squarederror", validate_parameters = "TRUE" ## xgb.attributes: ## niter ## callbacks: ## cb.evaluation.log() ## # of features: 2 ## niter: 15 ## nfeatures : 2 ## evaluation_log: ## iter training_rmse ## <num> <num> ## 1 10.481475 ## 2 7.620929 ## --- --- ## 14 2.551943 ## 15 2.531085 The holdout data can be predicted: predict(bt_reg_fit, Chicago_test) ## # A tibble: 7 × 1 ## .pred ## <dbl> ## 1 20.6 ## 2 20.6 ## 3 20.2 ## 4 20.6 ## 5 19.3 ## 6 7.26 ## 7 5.92 Classification Example (xgboost) The example data has two predictors and an outcome with two classes. Both predictors are in the same units. library(tidymodels) tidymodels_prefer() data(two_class_dat) data_train <- two_class_dat[-(1:10), ] data_test <- two_class_dat[ 1:10 , ] We can define the model with specific parameters: bt_cls_spec <- boost_tree(trees = 15) %>% # This model can be used for classification or regression, so set mode set_mode("classification") %>% set_engine("xgboost") bt_cls_spec ## Boosted Tree Model Specification (classification) ## ## Main Arguments: ## trees = 15 ## ## Computational engine: xgboost Now we create the model fit object: set.seed(1) bt_cls_fit <- bt_cls_spec %>% fit(Class ~ ., data = data_train) bt_cls_fit ## parsnip model object ## ## ##### xgb.Booster ## raw: 40.8 Kb ## call: ## xgboost::xgb.train(params = list(eta = 0.3, max_depth = 6, gamma = 0, ## colsample_bytree = 1, colsample_bynode = 1, min_child_weight = 1, ## subsample = 1), data = x$data, nrounds = 15, watchlist = x$watchlist, ## verbose = 0, nthread = 1, objective = "binary:logistic") ## params (as set within xgb.train): ## eta = "0.3", max_depth = "6", gamma = "0", colsample_bytree = "1", colsample_bynode = "1", min_child_weight = "1", subsample = "1", nthread = "1", objective = "binary:logistic", validate_parameters = "TRUE" ## xgb.attributes: ## niter ## callbacks: ## cb.evaluation.log() ## # of features: 2 ## niter: 15 ## nfeatures : 2 ## evaluation_log: ## iter training_logloss ## <num> <num> ## 1 0.5524619 ## 2 0.4730697 ## --- --- ## 14 0.2523133 ## 15 0.2490712 The holdout data can be predicted for both hard class predictions and probabilities. We’ll bind these together into one tibble: bind_cols( predict(bt_cls_fit, data_test), predict(bt_cls_fit, data_test, type = "prob") ) ## # A tibble: 10 × 3 ## .pred_class .pred_Class1 .pred_Class2 ## <fct> <dbl> <dbl> ## 1 Cla