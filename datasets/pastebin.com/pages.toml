 Unlimited Unlisted Pastes PRO members can store unlimited unlisted pastes. Free users can only own 10 unlisted pastes. 9. Unlimited Private Pastes PRO members can store unlimited Private pastes. Free users can only own 10 private pastes. 10. Paste Allowance Per 24h PRO members are allowed to create up to 250 pastes per 24 hours. Free members can only create 20 pastes per 24 hours. If you need more than 250 pastes per 24 hours, please contact us. We can increase the limit at no additional cost. 11. More Alert Keywords As a PRO member we allow you to add up to 15 keywords in the 'My Alerts' service. Free members can only submit 3 keywords to be monitored. 12. Receive more Email Alerts As a PRO member we allow you to receive unlimited email alerts without having to re-submit keywords to the 'My Alerts' service. Free members have to re-enter keywords after 10 email alerts to prevent misuse of this service. 13. Archive Pages Results PRO members get up 250 results per archive page instead of the limited 25 for normal members & non-members. 14. Rich Pastes with Markdown PRO users are allowed to create Markdown pastes. With Markdown you can make text bold, italic, add images, clickable links & much more. See what is possible. 15. Site Scraping API Got blocked scraping our site? PRO users can access our custom scraping API & get their IP whitelisted. 16. Prioritized Support PRO members get access to our prioritized support form on the contact page. Also, abuse reports from PRO members get boosted to the front of the queue, resulting in faster removal times. 17. Username Changes PRO users can request changes to their username. If the username is free, it can be yours. If it's taken, it can sometimes become yours, but only if that user is "inactive". Inactive users are users who haven't logged-in in the last 6 months. 18. Private Message Any Pastebin User PRO users are able to send a private message to any Pastebin user. Only PRO users are able to initiate a message conversations, but all members are able to reply to incoming messages. Users will be notified via email when they have received a new private message. 19. CORS Headers PRO users are able to reach their content externally as CORS headers are added on their RAW pastes. 20. Supporting Current And Future Development By getting a PRO membership you support us keeping Pastebin online. Hosting tens of millions of pastes is no cheap & easy task. Your membership fee will go towards development, server & bandwidth bills. 21. Awesome PRO Badge PRO members get an awesome badge next to anything that has their name on it. It shows others that you support Pastebin! 21 great reasons to go PRO! Select your PRO plan PRO ACCOUNT Pastebin PRO accounts are currently sold out. In the near future we will make more PRO accounts available for sale. Please check back later to see if more are available.'''
