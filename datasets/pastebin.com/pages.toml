ucts, and services provided by Pastebin, specifically excluding any User-Generated Content. 3. The “Website” refers to Pastebin’s website located at Pastebin.com, and all content, services, and products provided by Pastebin at or through the Website. It also refers to Pastebin-owned subdomains of Pastebin.com 4. “The User,” “you,” and “your” refer to the individual person, company, or organization that has visited or is using the Website or Service; that accesses or uses any part of your account; or that directs the use of your account in the performance of its functions. A User must be at least 13 years of age. 5. “Pastebin,” “We,” and “Us” refer to Pastebin.com, as well as our affiliates, directors, subsidiaries, contractors, licensors, officers, agents, and employees. 6. “Content” refers to content featured or displayed through the Website, including without limitation text, data, articles, images, photographs, graphics, software, applications, designs, features, and other materials that are available on the Website or otherwise available through the Service. "Content" also includes the Service. “User-Generated Content” is Content, written or otherwise, created or uploaded by our Users. "Your Content" is Content that you create, upload or own. For avoidance of doubt, “User-Generated Content” and “Your Content” are included in the definition of “Content.” B. Account Terms Short version: A human must create your account; you must be 13 or over to create an account; you must provide a valid email address; and you may not have more than one free account. You alone are responsible for your account and anything that happens while your account is being used. You are responsible for keeping your account secure and for any use of your account when it is accessed via your login credentials. 1. Required Information You must provide a valid email address, password & user name in order to complete the signup process. Any other information requested is optional, unless you are