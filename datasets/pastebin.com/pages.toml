title = "Pastebin.com - Privacy Statement"
description = "Pastebin.com is the number one paste tool since 2002. Pastebin is a website where you can store text online for a set period of time."
full_description = '''Pastebin.com Privacy Statement UPDATED Thank you for entrusting Pastebin with your pastes and your personal information. Holding onto your private information is a serious responsibility, and we want you to know how we're handling it. The short version We only collect the minimum amount of personal information that is necessary to fulfill the purpose of your interaction with us; we don't sell it to third parties; and we only use it as this Privacy Policy describes. Capitalized terms below have the same meaning as in the Terms of Service. Of course, the short version doesn't tell you everything, so please read on for more details! List of Topics 1. What Information We Collect and Why 2. What Information We Do not Collect 3. How We Share Information We Collect 4. Our Use of Cookies and Tracking 5. How We Secure Your Information 6. Our Global Privacy Practices 7. Resolving Concerns 8. How We Respond to Compelled Disclosure 9. How You Can Access and Control Your Information 10. How We Communicate With You 11. Ads on Pastebin 12. Changes to this Privacy Statement 13. Contacting Pastebin What information Pastebin collects and why Information from website browsers We collect basic information that most websites collect when anyone visits our Website, whether they have an account or not. To do this, we use common internet technologies, such as cookies and web server logs. The information we collect in this manner includes the visitor’s browser type, language preference, referring site, additional websites requested, Internet Protocol (IP) address, and the date and time of each visitor request. We collect this information to better understand how our website visitors use Pastebin, and to monitor and protect the security of the Website. Information you provide to create an account; User Personal Information If you create an account, we require some basic information at the time of account creation. You will create your own username and password, and we will ask you for a valid email account. You also have the option to give us more information if you want to, and this may include "User Personal Information." "User Personal Information" is any information about one of our users which could, alone or together with other information, personally identify him or her. Information such as a username and password, an email address, a real name, and a photograph are examples of “User Personal Information.” IP addresses potentially can constitute User Personal Information, though they are not usually used in that manner. User Personal Information does not include aggregated, non-personally identifying information. We may use aggregated, non-personally identifying information to operate, improve, and optimize our Website and Service. We collect User Personal Information for the following purposes: ▶ To create your account, and to provide the services you request. ▶ To identify you on Pastebin. ▶ To fill out your profile and share that profile with other users if you ask us to. ▶ For security, anti-fraud, and other similar purposes when necessary ▶ To communicate with you, if you've said that's okay, and for any additional reasons you’ve said are okay. Please see our section on email communication for more information. ▶ We limit our use of your User Personal Information to the purposes listed in this Privacy Statement. If we need to use your User Personal Information for other purposes, we will ask your permission first. You can always see what information we have, how we're using it, and what permissions you have given us in your user profile. What information Pastebin does not collect We do not intentionally collect sensitive personal information, such as social security numbers, genetic data, health information, or religious information. Although Pastebin does not request or intentionally collect any sensitive personal information, we realize that you might store this kind of information in your account, such as in a paste. If you store any sensitive personal information on our servers, you are consenting to our storage of that information on our servers, which are in the United States. We do not intentionally collect information that is stored in your pastes or other free-form content inputs. Information in your pastes belongs to you, and you are responsible for it, as well as for making sure that Your Content complies with our Terms of Service. Pastebin employees do not access private pastes unless required to for security or maintenance, or for support reasons, with the consent of the paste owner. If your paste is public, anyone (including us) may view its contents. If you have included private or sensitive information in your public paste, such as email addresses, that information may be indexed by search engines or used by third parties. In addition, while we do not generally search for content in your pastes, we may scan our servers for certain tokens or security signatures. If you're a child under the age of 13, you may not have an account on Pastebin. Pastebin does not knowingly collect information from or direct any of our content specifically to children under 13. If we learn or have reason to suspect that you are a user who is under the age of 13, we will unfortunately have to close your account. Please see our Terms of Service for information about account termination. How we share the information we collect We do not share, sell, rent, or trade User Personal Information with third parties for their commercial purposes. We may make such information available to trusted third-party service providers who help us make the Website and Service available, but subject to strict requirement to limit usage to such purposes. You may request a list of such service providers, and the purpose for which your User Personal Information was shared with them, by contacting us at support@pastebin.com. We do not disclose User Personal Information outside Pastebin, except in the situations listed in this section or in the section below on Compelled Disclosure. We allow others to display advertising on Pastebin. We use various third party ad networks to facilitate this process. These third-party ad networks might make use of tracking cookies to show targeted advertisements to you. We do not share ANY information about you to these third party networks. For information about ad tracking and how to opt out, you can visit http://www.networkadvertising.org/managing/opt_out.asp We may share User Personal Information if we are involved in a merger, sale, or acquisition. If any such change of ownership happens, we will ensure that it is under terms that preserve the same confidentiality of User Personal Information as described in this privacy statement. The organization receiving any User Personal Information will have to honor any promises we have made in our Privacy Statement or in our Terms of Service. Public Information on Pastebin Much of Pastebin is public-facing. If Your Content is public-facing, third parties may access and use it in compliance with our Terms of Service. We do not sell that content; it is yours. However, we do allow third parties, such as research organizations or archives, to compile public-facing Pastebin information, excluding User Personal Information, per our Terms of Service. Your Personal Information, associated with your content, may be gathered by third parties in these compilations of Pastebin data. If you do not want your Personal Information to appear in third parties’ compilations of Pastebin data, please do not make your Personal Information publicly available. If you would like to compile Pastebin data, you may only use any public-facing Personal Information you gather for the purpose for which our user has authorized it. Similarly, projects on Pastebin may include publicly available Personal Information collected as part of the collaborative process. In the event that a Pastebin project contains publicly available Personal Information that does not belong to Pastebin users, we will only use that Personal Information for the limited purpose for which it was collected, and we will secure that Personal Information as we would secure any User Personal Information. If you have concerns about any Personal Information on Pastebin, please contact us. Our use of cookies and tracking Cookies Pastebin uses cookies to make interactions with our Website and Service easy and meaningful. We use cookies (and similar technologies, like HTML5 local storage) to keep you logged in, remember your preferences, and provide information for future development of Pastebin. A cookie is a small piece of text that our web server stores on your computer or mobile device, which your browser sends to us when you return to our site. Cookies do not necessarily identify you if you are merely visiting Pastebin; however, a cookie may store a unique identifier for each logged in user. The cookies Pastebin sets are essential for the operation of the Website, or are used for performance or functionality. By using our Website, you agree that we can place these types of cookies on your computer or device. If you disable your browser or device’s ability to accept cookies, you will not be able to log in or use Pastebin’s services. Google Analytics We use Google Analytics as a third-party tracking service, but we don’t use it to track you individually or collect your User Personal Information. We use Google Analytics to collect information about how our Website performs and how our users, in general, navigate through and use Pastebin. This helps us evaluate our users' use of Pastebin; compile statistical reports on activity; and improve our content and website performance. Google Analytics gathers certain information over time, such as your IP address, browser type, internet service provider, referring and exit pages, time stamp, and similar data about your use of Pastebin. We do not link this information to any of your personal information such as your username. Pastebin will not, nor will we authorize any third party to, use the Google Analytics tool to track our users individually; collect any User Personal Information other than IP address; or correlate your IP address with your identity. Google provides further information about its own privacy practices and offers a browser add-on to opt out of Google Analytics tracking. Certain pages on our site may set other third party cookies. For example, we may embed content, such as videos, from another site that sets a cookie. While we try to minimize these third party cookies, we can’t always control what cookies this third party content sets. Tracking "Do Not Track" is a privacy preference you can set in your browser if you do not want online services to collect and share certain kinds of information about your online activity from third party tracking services. We do not track your online browsing activity on other online services over time and we do not authorize third-party services to track your activity on our site beyond our basic Google Analytics tracking, which you may opt out of here. Because we do not share this kind of data with third party services or permit this kind of third party data collection on Pastebin for any of our users, and we do not track our users on third-party websites ourselves, we do not need to respond differently to an individual browser's Do Not Track setting. If you are interested in turning on your browser’s privacy and Do Not Track settings, the Do Not Track website has browser-specific instructions. How Pastebin secures your information Pastebin takes measures reasonably designed to protect User Personal Information from unauthorized access, alteration, or destruction; maintain data accuracy; and help ensure the appropriate use of User Personal Information. We follow generally accepted industry standards to protect the personal information submitted to us, both during transmission and once we receive it. However, no method of transmission, or method of electronic storage, is 100% secure. Therefore, we cannot guarantee absolute security. For more information, see our security disclosures. Pastebin's global privacy practices Information that we collect will be stored and processed in the United States in accordance with this Privacy Statement. If you are outside the United States, you understand and agree that you are voluntarily providing your Personal User Information directly to us per the terms of this privacy statement. We provide the same standard of privacy protection to all our users, regardless of their country of origin or location, and we are proud of the levels of notice, choice, accountability, security, data integrity, access, and recourse we provide. We deploy physical and personnel practices reasonably designed to comply with this privacy statement and to provide appropriate security for User Personal Information. Additionally, we require that if our vendors or affiliates have access to User Personal Information, they must comply with our privacy policies and with applicable data privacy laws, including signing data transfer agreements strictly limiting usage consistent with the terms of this privacy statement. In particular: ▶ Pastebin provides clear disclosure at the time of data collection, when we do collect your User Personal Information. ▶ We collect only the minimum amount of personal data necessary, unless you choose to provide more. We encourage you to only give us the amount of data you are comfortable sharing. ▶ We offer you simple methods of accessing, correcting, or deleting the data we have collected. ▶ We provide our users notice, choice, accountability, security, and access, and we limit the purpose for processing. We also provide our users a method of recourse and enforcement. Resolving Concerns If you have concerns about the way Pastebin is handling your User Personal Information, or wish to exercise any of your rights listed in this privacy statement, please let us know immediately. We want to help. You may email us directly at admin@pastebin.com with the subject line "Privacy Concerns." We will respond within 45 days at the latest. In the unlikely event that a dispute arises between you and Pastebin regarding our handling of your User Personal Information, we will do our best to resolve it. How we respond to compelled disclosure Pastebin may disclose personally-identifying information or other information we collect about you to law enforcement in response to a valid subpoena, court order, warrant, or similar government order, or when we believe in good faith that disclosure is reasonably necessary to protect our property or rights, or those of third parties or the public at large. In complying with court orders and similar legal processes, Pastebin strives for transparency. When permitted, we will make a reasonable effort to notify users of any disclosure of their information, unless we are prohibited by law or court order from '''
year_published = 2025
