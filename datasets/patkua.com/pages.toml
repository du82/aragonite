full_description = 'This page includes the highly rated talks I have given. Many are suitable for a keynote for an internal event (Get in touch if you’re interested). There are many talks that vary from levels that include everyone up to senior management teams and more. All talks are approximately 45-60 minutes though can be customised to your needs. If you’re interested in what other topics I have talked about in the past, then please look at the Past Events page. Index of Talks hide The Evolution of Engineering Management The Evolution of Engineering Excellence Secrets of a Strong Engineering Culture Cultivating High Performing Teams in Hypergrowth Scaling Architecture Decision Making Talking with Tech Leads Building Evolutionary Architectures The Well-Rounded Architect The Travel Guide to Software Systems Building High Performing Teams Systems Thinking Primer: Learning to See Tightening the Feedback Loop Geek’s Guide to Leading Teams Share this: The Evolution of Engineering Management Audience: Directors, Architects, Engineering Managers and potential Engineering Managers I’ve seen a lot of change in tech working for 20+ years and growing other leaders for 10+ years. In this keynote, I will share reflections on the evolution of engineering management, looking at what has changed, what has stayed the same and practical advice on what you can do to further increase your impact. <img decoding="async" width="1024" height="576" src="https://www.patkua.com/wp-content/uploads/2023/12/TheEvolutionOfEngineeringManagement-1024x576.png" alt="" class="wp-image-2136" srcset="https://www.patkua.com/wp-content/uploads/2023/12/TheEvolutionOfEngineeringManagement-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2023/12/TheEvolutionOfEngineeringManagement-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2023/12/TheEvolutionOfEngineeringManagement-768x432.png 768w, https://www.patkua.com/wp-content/uploads/2023/12/TheEvolutionOfEngineeringManagement-1536x864.png 1536w, https://www.patkua.com/wp-content/uploads/2023/12/TheEvolutionOfEngineeringManagement.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px"> The Evolution of Engineering Excellence Audience: Technical Managers, Architects, Tech Leads and Developers How we build software today looks vastly different from 20 years ago. Excellence in software engineering matters more than ever. Did you ever stop to wonder why? By looking at the history of engineering practices, we can learn how engineering excellence evolved and what that implies about the future. As software engineers, you will learn why it’s important to continue to hone your craft and why it’s important for tech companies to continually invest in software excellence today. <img decoding="async" width="1024" height="576" src="https://www.patkua.com/wp-content/uploads/2020/09/EvolutionOfEngineeringExcellence-1024x576.png" alt="The Evolution of Engineering Excellence" class="wp-image-1230" srcset="https://www.patkua.com/wp-content/uploads/2020/09/EvolutionOfEngineeringExcellence-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2020/09/EvolutionOfEngineeringExcellence-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2020/09/EvolutionOfEngineeringExcellence-768x432.png 768w, https://www.patkua.com/wp-content/uploads/2020/09/EvolutionOfEngineeringExcellence-1536x864.png 1536w, https://www.patkua.com/wp-content/uploads/2020/09/EvolutionOfEngineeringExcellence.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px"> Secrets of a Strong Engineering Culture Audience: C-Level, Directors, Managers, Architects and Tech Leads Engineers today have many choices about where they work. A big determinant is the engineering culture – an aspect that reaches across the full stack. As a technical leader, what can you do to influence, change and build a stronger engineering culture? In this talk, Patrick will explore the building blocks of engineering culture, share examples of how he has enabled and transformed the engineering culture of many teams and organisations and how it can positively change the full stack. Unlock the secrets of a strong engineering culture and leave with knowing what areas you can focus on, ideas on what you can implement and understand how other companies have built strong engineering cultures. <img decoding="async" width="1024" height="576" src="https://www.patkua.com/wp-content/uploads/2020/03/SecretsOfAStrongEngineeringCulture-1024x576-1.png" alt="Secrets of a Strong Engineering Culture Cover Slide" class="wp-image-731" srcset="https://www.patkua.com/wp-content/uploads/2020/03/SecretsOfAStrongEngineeringCulture-1024x576-1.png 1024w, https://www.patkua.com/wp-content/uploads/2020/03/SecretsOfAStrongEngineeringCulture-1024x576-1-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2020/03/SecretsOfAStrongEngineeringCulture-1024x576-1-768x432.png 768w" sizes="(max-width: 1024px) 100vw, 1024px"> Cultivating High Performing Teams in Hypergrowth Audience: C-Level, Directors, Managers, Architects and Tech Leads Hypergrowth companies (at least doubling in revenue every 12 months) make for a stressful environment as everything from people, process and culture go through rapid change. In this talk, Patrick will share how he was able to grow the tech team as CTO at N26 from 55 to 350+ people in under two years in a way that maximises both autonomy and alignment. He’ll discuss the explicit trade-offs in centralised versus decentralised thinking and how he managed to rapidly expand a team and still keep rapidly shipping product. He’ll share many of the challenges individuals, managers and leaders and face and what you can do to prepare for that. <img decoding="async" width="1024" height="576" src="http://www.patkua.com/wp-content/uploads/2019/11/CultivatingHighPerformingTeamsDuringHypergrowth-1024x576.png" alt="Cultivating High Performing Teams During Hypergrowth Cover Slide" class="wp-image-615" srcset="https://www.patkua.com/wp-content/uploads/2019/11/CultivatingHighPerformingTeamsDuringHypergrowth-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2019/11/CultivatingHighPerformingTeamsDuringHypergrowth-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2019/11/CultivatingHighPerformingTeamsDuringHypergrowth-768x432.png 768w, https://www.patkua.com/wp-content/uploads/2019/11/CultivatingHighPerformingTeamsDuringHypergrowth-1536x864.png 1536w, https://www.patkua.com/wp-content/uploads/2019/11/CultivatingHighPerformingTeamsDuringHypergrowth.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px"> Scaling Architecture Decision Making Audience: Managers, Architects and Tech Leads In the fast moving startup world, there’s often not a lot time to think about architecture. As I grew N26 from 55 to more than 350 people in two years, I wanted to make sure that we didn’t only grow quickly but also delivered a quality product. This talk explores how I introduced a number of practices how to decentralise and scale out architectural decision making. <img decoding="async" width="1024" height="576" src="http://www.patkua.com/wp-content/uploads/2019/11/ScalingArchitectureDecisionMaking-1024x576.png" alt="Scaling Architecture Decision Making Cover Slide" class="wp-image-617" srcset="https://www.patkua.com/wp-content/uploads/2019/11/ScalingArchitectureDecisionMaking-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2019/11/ScalingArchitectureDecisionMaking-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2019/11/ScalingArchitectureDecisionMaking-768x432.png 768w, https://www.patkua.com/wp-content/uploads/2019/11/ScalingArchitectureDecisionMaking-1536x864.png 1536w, https://www.patkua.com/wp-content/uploads/2019/11/ScalingArchitectureDecisionMaking.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px"> Talking with Tech Leads Audience: C-Level, Directors, Managers, Architects and Tech Leads As a software engineer, you will have learned that “naming things” will remain one of the most difficult tasks in our industry. This is even more confusing when it comes to roles and responsibilities for the Tech Lead role. After interviewing many people playing technical leadership roles, establishing a European-wide Tech Lead training program in his last company, and training 100+ Tech Leads around the world, Patrick will share his lessons learned about what exactly a Tech Lead is, and what it takes to make the role successful. If you currently have or would like to take on a leadership role for an engineering team, come to this session to hear some practical tips that will make you a more successful Tech Lead. <img decoding="async" width="1024" height="576" src="http://www.patkua.com/wp-content/uploads/2019/11/TalkingWithTechLeads-1024x576.png" alt="Talking With Tech Leads Cover Slide" class="wp-image-619" srcset="https://www.patkua.com/wp-content/uploads/2019/11/TalkingWithTechLeads-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2019/11/TalkingWithTechLeads-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2019/11/TalkingWithTechLeads-768x432.png 768w, https://www.patkua.com/wp-content/uploads/2019/11/TalkingWithTechLeads-1536x864.png 1536w, https://www.patkua.com/wp-content/uploads/2019/11/TalkingWithTechLeads.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px"> Building Evolutionary Architectures Audience: Architects, Tech Leads and Developers In our industry, one of the only guarantees is change. Many of today’s tools, technologies, and business models will soon cease to exist, only to be replaced by newer ones. Architects face the challenge of planning for today’s systems knowing that the problems of tomorrow will be completely different from the problems of today. Evolutionary architecture is an architectural approach that prioritises change as a first principle but balances this need with delivering value early. <img decoding="async" width="1024" height="576" src="http://www.patkua.com/wp-content/uploads/2019/11/BuildingEvolutionaryArchitectures-1024x576.png" alt="Building Evolutionary Architectures Cover Slide" class="wp-image-613" srcset="https://www.patkua.com/wp-content/uploads/2019/11/BuildingEvolutionaryArchitectures-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2019/11/BuildingEvolutionaryArchitectures-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2019/11/BuildingEvolutionaryArchitectures-768x432.png 768w, https://www.patkua.com/wp-content/uploads/2019/11/BuildingEvolutionaryArchitectures-1536x864.png 1536w, https://www.patkua.com/wp-content/uploads/2019/11/BuildingEvolutionaryArchitectures.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px"> The Well-Rounded Architect Audience: Architects, Tech Leads and Developers Being a successful architect requires more than just a good understanding of architecture. In this talk, we explore the breadth of skills and experience an architect should focus on and outlines the balance of traits that makes a well-rounded architect. <img decoding="async" width="1024" height="576" src="http://www.patkua.com/wp-content/uploads/2019/11/TheWellRoundedArchitect-1024x576.png" alt="The Well-Rounded Architect Cover Slide" class="wp-image-620" srcset="https://www.patkua.com/wp-content/uploads/2019/11/TheWellRoundedArchitect-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2019/11/TheWellRoundedArchitect-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2019/11/TheWellRoundedArchitect-768x432.png 768w, https://www.patkua.com/wp-content/uploads/2019/11/TheWellRoundedArchitect-1536x864.png 1536w, https://www.patkua.com/wp-content/uploads/2019/11/TheWellRoundedArchitect.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px"> The Travel Guide to Software Systems Audience: Architects, Tech Leads and Developers What do you reach for when you’re travelling somewhere foreign? A travel guide! In this talk, I use the analogy of the travel guide as it can apply to software systems. We explore what sort of information people should document and how to keep documentation relevant and useful as they evolve. <img decoding="async" width="1024" height="576" src="http://www.patkua.com/wp-content/uploads/2019/11/TravelGuide-1024x576.png" alt="" class="wp-image-622" srcset="https://www.patkua.com/wp-content/uploads/2019/11/TravelGuide-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2019/11/TravelGuide-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2019/11/TravelGuide-768x432.png 768w, https://www.patkua.com/wp-content/uploads/2019/11/TravelGuide-1536x864.png 1536w, https://www.patkua.com/wp-content/uploads/2019/11/TravelGuide.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px"> Building High Performing Teams Audience: Architects, Engineering Managers, Tech Leads Many technical leaders often focus on the technical side to building software including key platform or design decisions, or finding reasons to use the latest and great technologies. They forget that software is built by people. Without considering how people work together, architectural visions are wasted. In this talk, we will explore why and how technical leaders should care about well-functioning teams and look at the tools and techniques they can use to build high-performance teams. <img decoding="async" width="1024" height="576" src="http://www.patkua.com/wp-content/uploads/2019/11/BuildingHighPerformingTeams-1024x576.png" alt="Building High Performing Teams Cover Slide" class="wp-image-614" srcset="https://www.patkua.com/wp-content/uploads/2019/11/BuildingHighPerformingTeams-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2019/11/BuildingHighPerformingTeams-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2019/11/BuildingHighPerformingTeams-768x432.png 768w, https://www.patkua.com/wp-content/uploads/2019/11/BuildingHighPerformingTeams-1536x864.png 1536w, https://www.patkua.com/wp-content/uploads/2019/11/BuildingHighPerformingTeams.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px"> Systems Thinking Primer: Learning to See Audience: Everyone (including non-technical people) Systems Thinking is a non-linear way of looking at the world and is useful in all situations, be it at work, home or among friends. Systems Thinking helps explain the unusual behaviour that arises in organisations, teams and individuals. Learning to see what might be driving people’s behaviour helps you improve your ability to collaborate more effectively. This talk will leave you looking at the world from a different perspective. <img decoding="async" width="1024" height="576" src="http://www.patkua.com/wp-content/uploads/2019/11/SystemsThinkingPrimer-1024x576.png" alt="" class="wp-image-618" srcset="https://www.patkua.com/wp-content/uploads/2019/11/SystemsThinkingPrimer-1024x576.png 1024w, https://www.patkua.com/wp-content/uploads/2019/11/SystemsThinkingPrimer-300x169.png 300w, https://www.patkua.com/wp-content/uploads/2019/11/SystemsThinkingPrimer-768x432.png 768w, https://www.patkua.com/wp-con'
