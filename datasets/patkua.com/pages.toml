full_description = '<img decoding="async" width="1024" height="512" src="https://www.patkua.com/wp-content/uploads/2021/02/PolishingProductManagementSkills-2000x1000-notext-1024x512.jpeg" alt="" class="wp-image-1456" srcset="https://www.patkua.com/wp-content/uploads/2021/02/PolishingProductManagementSkills-2000x1000-notext-1024x512.jpeg 1024w, https://www.patkua.com/wp-content/uploads/2021/02/PolishingProductManagementSkills-2000x1000-notext-300x150.jpeg 300w, https://www.patkua.com/wp-content/uploads/2021/02/PolishingProductManagementSkills-2000x1000-notext-768x384.jpeg 768w, https://www.patkua.com/wp-content/uploads/2021/02/PolishingProductManagementSkills-2000x1000-notext-1536x768.jpeg 1536w, https://www.patkua.com/wp-content/uploads/2021/02/PolishingProductManagementSkills-2000x1000-notext.jpeg 2000w" sizes="(max-width: 1024px) 100vw, 1024px" /> Leadership roles are, by their nature, fuzzy. Look at the Engineering Manager role and you might see one of 5 common archetypes, or an even less common variant. During Shortcut to Tech Leadership, we explore how and why technical leadership roles evolve; looking at the factors that drive differences in the same role across teams, time and organisations. Quite frequently, technical leaders must polish their product management skills and this article will describe why and show you the resources you can use. Leaders at all levels must fill the gaps and missing capabilities in their context. For many software teams and organisations, this gap is good product management. Although companies may have people called “Product Managers”, they play the role only in title. Instead, it’s more common to find product managers acting like project managers, or worse — micromanagers who think they manage a feature factory. This common scenario requires technical leaders, who have worked with good product managers, to step up instead. The Product Engineering Manager is a great example of this at a team level but I have seen this at all levels including the executive level. For example, I often run into CTPOs (Chief Technology and Product Officers) who lead both the technology and product teams, or CTOs who spend a majority of their time acting more as the CPO. Although I know what good looks like and can quickly identify bad product processes and product managers, addressing these gaps is not the focus of the self-driven training, guided workshops and coaching services I offer. I still receive many requests for help in this area, so I offer you the resources I repeatedly point others to. Use these resources to develop and polish your product management skills, regardless of the title you may have. Books Note: I’ve tried to include books that focus exclusively on product management, product thinking or the product manager role. Although I could have included more books on leadership for product managers, or on user-centred design, I’ve tried to keep this list as short as possible. (N.B. affiliate links below) Badass: Making Users Awesome by Kathy Sierra – An underrated book that is worth getting a physical copy as its design keeps it far from being boring. This book is less about product managers and more about product thinking by focusing on the user. Focus on making your users awesome, and you’ll be on the right track. The Beautiful Mess by John Cutler – John shares a lot of very practical posts for Product Managers on his twitter account and blog. In 2020, he wrote a blog post a week on product topics and this is a great e-book that collects them all. Although he generously publishes this online, support him on Gumroad by purchasing his book. Empowered by Marty Cagan – A collection of stories about what product leaders can do to empower their teams to build successful products. Slightly more focused on leadership skills for product managers. Escaping the Build Trap by Melissa Perri – Avoid treating product and engineering like a feature factory. This book is all about shifting away from outputs and focusing on outcomes and how Product Managers can do this successfully. Hooked: How to Build Habit-Forming Products by Nir Eyal – The controversial science and psychology behind building addictive products like Facebook, Twitter, etc. Note: After unleashing this on the world, the author published a counter to this, “Indistractable: How to Control Your Attention and Choose Your Life“ How to Lead in Product Management by Roman Pilcher – A wealth of practical tips and strategies for product managers focused less on the product thinking, and more on the required skills required when leading product in an organisation of any significant size (e.g. managing stakeholders, influencing, decision making and discovering unspoken needs and interests). Inspired by Marty Cagan – A collection of stories and insights into how the world’s largest tech companies structure and staff their product organisations. The Lean Startup by Eric Ries – Applying the start-up mindset to product thinking even if you’re not working in a startup. Principles of Product Development Flow by Donald R Reinertsen – This is a book you should use as a reference, coming back to again and again for new insights into what makes a good product development process, how to organise for flow and learning. Thanks to Gergely Hodicska for the reminder! Project to Product by Mik Kersten – Provides a framework for enterprises, used to running “projects”, and how to pivot to product-based thinking. Not as relevant for newer, product-centric companies. Strong Product People by Petra Willie – The missing guide to a personal development framework for Product Managers. User Story Mapping by Jeff Patton – A deep dive into a practical technique for building a MVP, and how to build products both incrementally and iteratively. Communities Mind The Product – A large organisation publishing content, running conferences and events and offering training with a free slack community of 20K+ product-minded people. The Product Coalition – Hosted (sponsored?) by Medium.com, this community includes many written articles, podcasts and a 7K+ free-to-join slack community. Product Manager HQ – A paid for ($US25) slack community of 7K+ product managers Product School – A slack community of apparently 60K+ product-minded people 1-1 Coaching/Mentoring These are people recommended to me that offer coaching/mentoring for senior Product Mangers (Head Of, CPO, etc) Hope Gurion (@hopegrrr) – San Francisco-based, “Fearless leadership in service of great product teams.” Website: https://www.fearless-product.com/ Kate Leto (@kleto) – London-based, “Product, Org Design and Cultural Transformation Consultant.” Website: https://www.kateleto.com/ Ken Norton (@kennethn) – US-West Coast=based. Long time former Product Manager at Google, now focused on Product Leadership coaching. Website: https://www.bringthedonuts.com/ Markus Andrezak (@markusandrezak) – Germany-based, “Founder of überproduct – helps companies find and create great products” Website: http://ueberproduct.de/ Martina Hodges-Schell (@polaroidgrrl) – London-based, “Helps people make better products and orgs create a culture that enables successful product innovation.” Website: https://www.northshore.studio/ Petra Wille (@loomista) – Hamburg-based, “Product Leadership Coach based in Europe. Author of STRONG product people. Co-Organizer of MTP Engage Hamburg.” Website: https://www.petra-wille.com/ Silicon Valley Product Group (SVPG) – Many different coaching options including Product Leadership Coaching, Associate Product Manager Program Coaching, Product Management Coaching, and Product Discovery Coaching. Product Labs – Los-Angeles and Australian-based company, offering 1-1 and group coaching, training and consulting Robert Hamilton (@roberthamilton) – Santa Monica-based, “Executive coach, helping Product and Eng leaders to learn and grow” Website: https://www.accelerationcoach.com/ Teresa Torres (@ttorres) – Portland-based, “Make better product decisions: Learn a structured and sustainable approach to continuous discovery.” Website: https://www.producttalk.org/ (Offers team-coaching only) I hope you find these resources useful regardless of what role you currently play. If I missed any that are for leaders with a large product management responsibility, drop me an email and let me know (or leave a comment). Like this article? Subscribe to Level Up, for a free curated newsletter for leaders in tech offering the best reads on leadership, tech, organisations and processes. Or looking for resources more relevant to Engineering Leaders? Read Book Recommendations by Engineering Leaders now. Share this:Tweet Categories Leadership, Product Management, Resources Look AheadHow Many People Can Someone Lead?'
