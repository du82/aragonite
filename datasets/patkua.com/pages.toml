full_description = 'This pages lists all of the books that Patrick Kua has published. Scroll down to find the wide variety of topics that accelerate technical leaders. <img decoding="async" width="225" height="300" src="https://www.patkua.com/wp-content/uploads/2019/11/BuildingEvolutionaryArchitectures-300x400-225x300.png" class="wp-block-getwid-image-box__image wp-image-247" srcset="https://www.patkua.com/wp-content/uploads/2019/11/BuildingEvolutionaryArchitectures-300x400-225x300.png 225w, https://www.patkua.com/wp-content/uploads/2019/11/BuildingEvolutionaryArchitectures-300x400.png 300w" sizes="(max-width: 225px) 100vw, 225px" /> Building Evolutionary Architectures (2017) The way that we build software today continues to change as constraints and the environment continues to evolve. This book captures an intentional approach to building software systems designed for constant change. Find out more or buy a copy of “Building Evolutionary Architectures” here. <img decoding="async" width="225" height="300" src="https://www.patkua.com/wp-content/uploads/2019/11/TalkingWithTechLeads-300x400-225x300.png" class="wp-block-getwid-image-box__image wp-image-248" srcset="https://www.patkua.com/wp-content/uploads/2019/11/TalkingWithTechLeads-300x400-225x300.png 225w, https://www.patkua.com/wp-content/uploads/2019/11/TalkingWithTechLeads-300x400.png 300w" sizes="(max-width: 225px) 100vw, 225px" /> Talking with Tech Leads (2014) Interviews with a range of Tech Leads captured at different stages of their leadership journey including the struggles, challenges and tips. Find out more or buy a copy of “Talking with Tech Leads” here. <img decoding="async" width="225" height="300" src="https://www.patkua.com/wp-content/uploads/2019/11/TheRetrospectiveHandbook-300x400-225x300.png" class="wp-block-getwid-image-box__image wp-image-249" srcset="https://www.patkua.com/wp-content/uploads/2019/11/TheRetrospectiveHandbook-300x400-225x300.png 225w, https://www.patkua.com/wp-content/uploads/2019/11/TheRetrospectiveHandbook-300x400.png 300w" sizes="(max-width: 225px) 100vw, 225px" /> The Retrospective Handbook (2012) What happens when you have taken part and also participated in hundreds of retrospectives? What are common issues? How do you keep them fresh? This book provides concrete advice to those looking to maximise the value of retrospectives. Find out more or buy a copy of “The Retrospective Handbook” here. <img decoding="async" width="225" height="300" src="http://www.patkua.com/wp-content/uploads/2019/11/ThoughtWorksAnthology2-300x400-225x300.png" alt="The ThoughtWorks Anthology 2 Book Cover" class="wp-block-getwid-image-box__image wp-image-250" srcset="https://www.patkua.com/wp-content/uploads/2019/11/ThoughtWorksAnthology2-300x400-225x300.png 225w, https://www.patkua.com/wp-content/uploads/2019/11/ThoughtWorksAnthology2-300x400.png 300w" sizes="(max-width: 225px) 100vw, 225px" /> The ThoughtWorks Anthology 2 (2012) A collection of essays looking at the start of the art of software development. In this book, Alistair Jones and I contributed an essay on “Extreme Performance Testing“, an experience report from applying Extreme Programming Practices to a performance critical software system. The Pragmatic Programmers published this book. <img decoding="async" width="225" height="300" src="http://www.patkua.com/wp-content/uploads/2019/11/97ThingsEveryProjectManagerShouldKnow-300x400-225x300.png" alt="97 Things Every Project Manager Should Know Book Cover" class="wp-block-getwid-image-box__image wp-image-246" srcset="https://www.patkua.com/wp-content/uploads/2019/11/97ThingsEveryProjectManagerShouldKnow-300x400-225x300.png 225w, https://www.patkua.com/wp-content/uploads/2019/11/97ThingsEveryProjectManagerShouldKnow-300x400.png 300w" sizes="(max-width: 225px) 100vw, 225px" /> 97 Things Every Project Manager Should Know (2009) O’Reilly started a series collecting tips from various industry people. In this version, I contributed a number of tips for doing effective Project Management in a tech field. You can read it online on the Safari platform. Share this:Tweet'
