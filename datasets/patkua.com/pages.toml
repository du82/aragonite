full_description = "I ran a survey over a month ago to determine the “new normal” work mode. Over a couple of weeks, my newsletter received 100+ responses, and here are the results! Work mode Full-time in office (5 days/week) – 1% Fully remote – 31% Hybrid working – 68% Time spent in the office This question polled the average time spent in the office (actual) versus what is required/demanded by office work policies 1 day/week – 23% 2 days/week – 27% 3+ days/week – 34% ~1 every 2-3 weeks – 2% ~1 day/month – 3% Less frequent than ~1 day/month – 9% Conclusions The survey confirms my anecdotal conversations that hybrid/remote is common (and likely to stay) with 99% of respondents. I wasn’t surprised that a good number (50%) only spent 1-2 days/week in the office, but I was surprised by how many respondents spent 3+ days/week (about 1/3!) in the office! Share this:Tweet Categories Modern Organisations, Teams The Trident Model of Career DevelopmentUsing Project Aristotle To Build Highly Effective Teams"
