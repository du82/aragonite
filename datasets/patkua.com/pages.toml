title = "Coaching"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = 'Coaching makes a difference Are you a VP/Director of Engineering or CTO in a company with a tech team of 50+ people? Get support from a technical leader who has been there before through coaching. Talk through issues with someone who understands your challenges but can provide a much more independent and unbiased viewpoint. <img decoding="async" width="1024" height="512" src="http://www.patkua.com/wp-content/uploads/2019/11/Coaching-1024x512.jpg" alt="" class="wp-block-getwid-banner__image wp-block-getwid-banner__source wp-image-557" srcset="https://www.patkua.com/wp-content/uploads/2019/11/Coaching-1024x512.jpg 1024w, https://www.patkua.com/wp-content/uploads/2019/11/Coaching-300x150.jpg 300w, https://www.patkua.com/wp-content/uploads/2019/11/Coaching-768x384.jpg 768w, https://www.patkua.com/wp-content/uploads/2019/11/Coaching.jpg 1500w" sizes="(max-width: 1024px) 100vw, 1024px" />Benefit from personal or small group coaching from a technical leader who has been there before. What topics have you covered in the past? Having coached and mentored 100s of technical leaders and engineers, I have covered a huge breadth of various topics that accelerated each person’s personal journey. Some example scenarios include: How to deal with a difficult conflict or situation within the team you’re leading Where to invest for the most impact on personal growth How to increase the success and conversion rate of your recruiting process The best approaches to successful onboarding of new employees and, just as importantly, how to retain them over time Influencing non-technical stakeholders Building strong relationships with peers or people outside of your direct day-to-day relationship Discussing trade-offs in making a difficult and wide-reaching decision about topics such as organisational structure, new roles, promotion or firing and more. What sort of people do you normally coach? My goal is to support people who can enact change and make decisions for their organisation. This profile: Might be in CTO or VP Engineering level role; or Might be a Director/Senior Engineering Manager who is leading a number of other managers/teams (typically responsible for 50+ people) Understands how coaching can help them and is seeking active support Would like to have someone who has “been there before” and understands the tech industry Is willing to prepare for each coaching conversation and be responsible for any actions after each session Why coaching? Technical leaders often feel like they are working alone. You can’t discuss sensitive topics with your team as it may negatively impact them. You might not be able to discuss topics that involve your peers because they have different motivations. You don’t want to put additional pressure on your partner because you want to respect the different work-life boundaries. Where do you go for support? If you feel like you are trapped in this situation then finding coaching and mentoring support can be for you. What makes coaching successful? At the end of the day, successful coaching relies on a good, open relationship between people. Some people prefer coaches from completely different fields. Others prefer to talk to people who have “walked the path before” because people feel like the coach can build a faster context. Want to know more? Get in touch to discuss coaching options today. Share this:Tweet'
