n than I’d like the answer is yes, and at this point I’ve re-learned how to connect a Node.js app to S3 more times than I’d like. Rather tha… Read More → October 23, 2018 Building a futuristic Record Player with Glitch and Raspberry Pi Earlier this year I wanted to explore the new async/await functionality in Javascript so I started playing around with a project on Glitch (glitch.com) that would call one API after another, then generate new API call options from each cycle. I compiled a long list of potential APIs to use, but didn’t get past chaining together an API that will re… Read More → September 29, 2017 Which Wearable Arduino Should I Use For My Sewable Tech Project? This fall Mouse launched our brand new Sewable Tech Course! The course introduces learners to circuitry and electronics without the abstraction of a breadboard. In the final two projects in the course we use a wearable Arduino to prototype a DIY activity tracker. Sew-matic for DIY Wearable Goal Tracker from Mouse Create The big question we ran… Read More → June 15, 2016 How we used a chatbot to teach writing and coding! When Mouse moved into our new office in early 2015, we were excited to have space for our high school Design League program to spread out and work on assistive technology projects like 1derphone, a motorized headphone for a DJ with limited mobility. We also quickly realized we had the chance to reach more students in more ways by hosting flexibl… Read More →'''
