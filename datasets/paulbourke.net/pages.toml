["http://paulbourke.net/dataformats/ascii/index.html"]
title = """
ASCII codes, Latin character set, ANSI Standard (X3.64) Control Sequences,
VT100 commands, Mime Encode format, Mac Binary format"""
full_description = 'The following is the "official" Latin I Character set. In particular, these characters can be included in HTML documents by enclosing them as &#__;. For precise details view the source of this file. The mimencode program simply converts a byte stream into (or out of) one of the standard mail encoding formats defined by MIME, the proposed standard for internet multimedia mail formats. Such an encoding is necessary because binary data cannot be sent through the mail. The encodings understood by mimencode are preferable to the use of the uuencode/uudecode programs, for use in mail, in several respects that were important to the authors of MIME. mmencode by default uses a system previously known as "base64". Basically, consider the bytes of a file lines up one after the other in a long stream. Now move along this stream taking 6 bits at a time and encode them using some "dictionary" of printable characters. The only trick now is to know what dictionary mmencode actually uses. It is given below. For example if the current 6 bits happen to be 000001 then the letter B is written to the mmencoded file. If 111110 is encountered then + is written to the mmencoded file. There are a number of way of encoding binary file into text only files for various restrictive transmission channels. Generally they are all very similar except for the bit length they use and the dictionary that maps whatever number of bits to a printable character. The two most common alternative formats are hqx which is generally used on Macintosh systems, and uuencode which is used on UNIX. MacBinary is a binary (non-text) format that encodes Macintosh files so that they can be safely stored or transferred through non-Macintosh systems. MacBinary combines the two forks of a Mac file, together with the file information (Name, Creator Application, File Type, etc) into a single binary data stream, suitable for storage on non-Mac systems. This serves a similar purpose to BinHex, except that BinHex takes things even further and stores the file using only text characters, so that the file will be preserved on almost any system, and can be sent through Email or USENET News without loss or corruption.'
