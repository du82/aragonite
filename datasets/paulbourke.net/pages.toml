["http://paulbourke.net/dataformats/hdf/index.html"]
title = "HDF tools"
full_description = "The following is some (brief) documentation on HDF tools prepared to handle volumetric data stored as a number of slices in HDF format. If any of the following is not clear please feel free to ask for assistance/enlightenment. Note that the tools here make many assumptions of the particular data files and problem at hand, if you need more generality of additional capabilities/features then just ask. The various output volumetric files created here are formatted as per the Drishti raw format. This consists of a short header followed by the binary data. The header consists of a single byte indicating the volume data size (0 for unsigned byte, and 8 for float), followed by 3 integers (4 bytes each) indicating the volume dimensions (x,y,z). Following this is the volume data in the data format as indicated and arranged as z slices, y columns, and finally x varies the fastest. The output for the sub-sampling tools uses floats, unsigned chars are used for the threshold data. If using software that doesn't know how to read the raw data, there are 13 bytes to skip over to ignore the header. The tools can be found in ~pbourke/bin/. You may copy the binaries but it would be better to add this directory to your path, this will mean you automatically get the benefit of bug fixes and other upgrades. The HDF files involved are actually saved as HDF version 4.25. As such you need to load the module hdf4/4.2.5 (this only applies to cognac at the moment). The general assumption for the HDF files is that their name contains an indexing number starting from 0. This assumption means the specification for the slices uses the C string formatting conventions, examples are given in the usage strings below. Most of the tools here assume the collection of HDF files start with index 0 and the index values increases by 1 for each slice. Each slice must be the same dimensions. The tools here ask for the slice dimensions and for the number of slices. While this information could be derived from the HDF files and the number of them, the approach taken is used to (slightly) simplify the programming but it mostly serves as a test that each file is as expected."
year_published = 2025
clearnet = "http://paulbourke.net/dataformats/hdf/index.html"
