["http://paulbourke.net/dataformats/eeg/index.html"]
title = "Various EEG file formats and Conventions"
full_description = '''The following documents the file structure for continuous EEG files as created by SCAN version 4 (the files are still reported as version 3 as the format hasn't changed). Experience has shown that many (most) of the fields are not filled out correctly by the software. In particular, the best way to work out the number of samples is The following is my version of the "sethead.h" file, designed to make implementations on other machines easier, namely "other-endian" machines. Note that character fields are single byte, longs are 4 bytes, floats are 4 bytes IEEE format, short ints are 2 bytes. The following describes the important aspects of the EEG data files from the Department of Medical Physics and Cognitive Neuroscience Unit, Westmead Hospital, Westmead, NSW 2145, Australia. The files consist a ID line followed by a header followed by the actual data section. The ID and header is ascii/readable text while the EEG data is binary, simply a series of 2 byte signed ints (usually referred to in C as "short int"). Note that while the files have an ASCII header they must be FTPed or otherwise transferred in binary mode to preserve the EEG data part. While the mixed ASCII/BINARY nature makes dealing with these files a bit awkward at times, it is often convenient to browse the header using a text editor or just using "more". It consists of two items, a version number and offset. The offset is the number of 512 bytes chunks in the header. The previous EEG1 format differs only in that the binary data was stored in a 1's complement offset format. This consist of a number of variables providing additional quantitative and qualitative values. Most are obvious from their descriptors in square brackets []. 1 The variable's identifying name. This consists of as many as 11 characters enclosed by square brackets. The left bracket must be in the first column. In reading the variable's name, leading and trailing blanks are removed, case is ignored, and control characters are removed. 3 The dimensions of the compressed array in the form: "dimensions=3D dim1 dim2". The first dimension equals the number of channels, or else 1 (if the value is the same for each channel). The second dimension equals the number of segments, or else 1 (if the value is the same for each segment).'''
year_published = 2025
