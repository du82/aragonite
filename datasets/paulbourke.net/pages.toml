["http://paulbourke.net/dataformats/bitmaps/index.html"]
title = "A Beginners Guide to Bitmaps"
full_description = "Translation into Italian by theunbiasedreviews.com and Boutiquesetup.com Translation into Portuguese by Artur Weber and Adelina Domingos Ukrainian translation provided by Dmutro Nechuporyk This document is to serve as an elementary introduction to bitmaps as they are used in computer graphics. Bitmaps are defined as a regular rectangular mesh of cells called pixels, each pixel containing a colour value. They are characterised by only two parameters, the number of pixels and the information content (colour depth) per pixel. There are other attributes that are applied to bitmaps but they are derivations of these two fundamental parameters. Note that bitmaps are always orientated horizontally and vertically. Pixels should be considered square although they may have other aspect ratios in practice. In the majority of situations bitmaps are used to represent images on the computer. For example the following is a bitmap which has 397 pixels horizontally, 294 pixels vertically, and each pixel contains a grey value from a possible 256 different greys. Each pixel in a bitmap contains certain information, usually interpreted as colour information. The information content is always the same for all the pixels in a particular bitmap. The amount of colour information could be whatever the application requires but there are some standards, the main ones are described below. This is the smallest possible information content that can be held for each pixel. The resulting bitmap is refereed to as monochrome or black and white. The pixels with a 0 are refereed to as black, pixels with a 1 are refereed to as white. Note that while only two states are possible they could be interpreted as any two colours, 0 is mapped to one colour, 1 is mapped to another colour. In this case each pixel takes 1 byte (8 bits) of storage resulting in 256 different states. If these states are mapped onto a ramp of greys from black to white the bitmap is refereed to as a greyscale image. By convention 0 is normally black and 255 white. The grey levels are the numbers in between, for example, in a linear scale 127 would be a 50% grey level."
year_published = 2025
