["http://paulbourke.net/dataformats/bmf_2/index.html"]
title = "FleetFeet, Fleet Feet, Volumental BMF file format"
full_description = "The following defines the BMF format as used to represent foot scans by either, or both, FleetFeet and Volumental. The format specification is, as far as the author is aware, not made available publicly and what follows is a determination of the format using standard investigative methods. With the information presented here it is possible to use the feet models for purposes other than the limited capabilities of the companies products. As with all such investigations the format may be able to deal with other situations than are described here, but the information provided here deals with all the files currently examined. The files are required to define a 3D mesh which typically includes a list of the vertices and triangular faces. The faces are defined, as in other efficient formats, in reference to the vertex indices. This has the benefit of supporting shared vertices, similar to the OBJ format but unlike the STL format. This is exactly what the BMF format does, and it additionally defines a normal at each face vertex. The high level layout of the file is as follows: While not explicitly defined in the format, the units for the vertices are meters. More detail of the file format is shown in the figure below. Each data group (vertices, faces, normal) is surrounded by a start and end identifier. For example, SoV = Start of Vertices, SoF = Start of Faces, SoN = Start of Normals. The exact purpose of the SoG which is imagined to be Start of Group is unknown. It possibly allows for the identification of a different groups of faces within a single file. This is only a theory until a file is produced that has multiple face collections within the same file. The various instances of 2 byte short int values that are always 0 would only seem to serve to realign the file structure to 4 byte boundaries. The vertex indices defining the faces should only require 2 byte short ints but instead use a pair of 2 byte short ints. In all the files tested so far this second superfluous short int is always zero so it is also possible just a filler to realign to 4 byte boundaries."
year_published = 2025
