["https://paulbourke.net/stereographics/onecamerapano"]
title = "Capturing high resolution stereoscopic panorama images with a single camera"
full_description = '''The photographic capture of so called "Omnidirectional Stereoscopic Panoramas" (ODSP) has been proposed by various authors at least 25 years ago. A working camera rig was perfected by Seitz with their dual head Roundshot film camera. The author has subsequently built various dual digital camera versions. These rigs all share two features, that is, they comprise of two digital cameras along with a motor for smooth rotation. Over 20+ years ago Peleg and Ben-Ezra proposed solutions based upon a single camera. It seems counter-intuitive that one could generate a left and right image using just one camera. To understand how, consider the standard ODSP dual camera geometry below. Each camera rotates about a central axis. Many photographs are taken, each at a small angular increment, or more commonly video is recorded. Note that this is the same geometry that digitally generated ODSP pairs are created of 3D scenes using computer graphics rendering methods. From each frame of the video, a narrow slit is extracted and all these slits are stacked next to each other to form a left and right eye panorama. Normally a slight blending would be applied between each slit. A key factor in the quality of the final image is the width of the slits, if it's too wide then dog-leg effects are visible along straight edges in the scene, the effect is worse for close objects. Minimising the width of the slit is controlled by the relative frame rate and rotation speed. Increasing the frame rate reduces the slit width, increasing the rotation speed (faster rotations) also increases the slit width. Narrow slits are in general desirable as is a fast rotation time in order to reduce negative effects due to moving objects. High frame rates and fast rotations require short exposure times, in the later case it is in order to reduce image degradation due to motion blur. Not illustrated below is that in practice more than 360 degrees are captured and the two resulting images are wrapped/cropped/aligned in post to form the desired zero parallax distance.'''
year_published = 2025
clearnet = "https://paulbourke.net/stereographics/onecamerapano"
