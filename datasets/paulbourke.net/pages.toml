["http://paulbourke.net/dataformats/edan/index.html"]
title = "EDAN SE-2012 Holter recorder files"
full_description = 'The EDAN SE-2012 Holter recorder is normally configured as either a 3 or 12 channel ECG recorder. Following a recording it creates a number of files in the recording directory, typically these are as follows but there may be others generated for various types of analysis. Unfortunately the meaning of each of these files is undocumented including the contents which is largely binary data so not decipherable by casual inspection. While one can imagine the intended meaning of some of the files from their name, in the following the aim is to be able to extract the raw ECG data for analysis in other packages. The as-recorded ECG data is stored in the file called "ecgraw.dat". This is simply a binary encoding of the electrode voltages, each a short unsigned integer (2 bytes). So, for the case of 12 electrodes there are 2 x 12 bytes per time step. There is no header and the sample number or seconds are not included. The file is read until the end. One can calculate the number of samples in advance by dividing the file size by 12. Normally one would subtract 16384 from each sample to get a signed sample with zero mean. The file "patient.hea" (patient header) contains a range of information about the recording, although much of it is empty unless one takes the effort to add the additional metadata. Most of the information is not important for the exercise of extracting the recording data for analysis elsewhere. But some field are important, such as sampling frequency, filter settings and electrode names. The table below gives the offsets from the start of the file of the information deduced so far. If some of the metadata files are not available the relevant area is normally padded with ascii 0. A key piece of information not yet identified in the header is the number of electrodes. This would be useful for reading the "ecgraw.dat" file otherwise it needs to be known in advance and specified to the decoder. Despite the app listing options to record at 8,12,14,16,18 bits, the recorded files all seem to have ECG samples that are +- 256, so 9 bit or 8 bit with sign.'
year_published = 2025
clearnet = "http://paulbourke.net/dataformats/edan/index.html"
