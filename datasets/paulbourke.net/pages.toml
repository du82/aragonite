["http://paulbourke.net/dome/fishwarp"]
title = "Tools for Spherical Mirror Projection"
full_description = '''In 2003 the author developed the idea of using a spherical mirror for fulldome projection instead of the much more expensive fisheye lens options. Initially fisheye movies were pre-warped but it was quickly realised that was not a sensible approach, rather the fisheye movie should be warped during playback. Fortunately this is something that is straightforward for the graphics cards of the time and now. In 2005 the warpplayer software was developed to do exactly that, for Apple Macs. Later in 2013, a modified version of VLC was created that supports real-time warping and was available for Mac and Windows. Unfortunately the above two solutions are showing their age and the realities of the technology they were built on means they are difficult to maintain. On the Mac at least, the following is an attempt to bring things up to date and base the solution on a more stable and future-proof (as far as one can) footing. All the playback solutions below have demonstration versions, PLEASE download and test these before purchasing. If for some reason the demo version does not work for you please contact the author. Please be advised that some of the downloads are rather large, this is due to the inclusion of short fisheye movies for testing purposes. The applications are provided as gzipped DMG files. Simply double click to unzip. Double click on the the resulting DMG file to create a virtual hard drive containing the software. Create a directory at a location of your choice on your computer and copy all the items into that directory. As is the case for applications not distributed through the app store, the security features in current versions of MacOS may prevent them from running, quoting that they are from an unidentified developer. To circumvent this, choose the "Open" option in the popup menu if you right mouse click on the application, of if you don't have a three button mouse use Control left mouse click. On occassion you may be warned that the application is damaged and should be deleted, it is not damaged, this is Apples (aggressive) security policy in the latest versions of the OS. Provided with the applications is a "fixinstall" script that will remove the quarantine flags. If the problem still persists, please contact the author.'''
