["http://paulbourke.net/dataformats"]
title = "Data Formats: 3D, Audio, Image"
description = "Paul Bourke - Data Formats: 3D, Audio, Image"
full_description = '''paulbourke.net − +61 (0)433338325 − paul.bourke@gmail.com − FB − Sketchfab − Fab − YouTube − Vimeo If you have found the contents of this site useful then please consider donating to one of my vices: Cup of coffee − Can of beer − Bottle of wine The following are largely my personal collection of references to a range of data formats in use in the computer industry, some are just copies of manuals and documentation, others are my own investigations and associated reports. The largest section is on 3D geometric formats, but there are also notes on image formats, conventions and other miscellaneous data representation topics. Audio formats: AIFF, AU (SUn), WAVE. Descriptions of the minimal requirements necessary to create standard audio data files. Stereo Pair Image File Format. Format for defining stereo pair attributes proposed by VRex Inc and the interleaved format. Various EEG file formats and Conventions. Includes continuous (cnt) and average (avg) EEG format from neuroscan, EEG format as used at Westmead Hospital (Sydney), and Pauls ad-hoc ascii format for EEG. Reading binary files from PC's on "other-endian" machines, and how to read FORTRAN unformatted data files with C/C++. Compression: Delta coding and Run Length Encoding compression. Simple compression scheme for audio and images. Various character and file standards. The famous ASCII code set. Latin Character set. ANSI Standard (X3.64) Control Sequences. VT100 commands and control sequences. Description of mmencode (rad64) format. MacBinary II format specifications. CSV - Comma Separated Value files. Beginners guide to bitmaps (Historic interest only). Mostly what one needs to know about how images are stored on computers, including colour depth. Contents: Papers, Presentations, Workshops − Geometry, Surfaces, Curves, Polyhedra − Fractals, Chaos, Self similarity − Domes, Planetariums, Fisheye, Spherical Mirror − Stereographics, 3D Projection − Panorama, 360 Video − Photographic Reconstruction − Miscellaneous: Projection, Modelling, Rendering − Data Formats: 3D, Audio, Image − Texture Library − Fun, Puzzles, Travel (All pages in one place) Recent: Cultural Big Data: Nineteenth to Twenty-first Century Panoramic Visualization − Cortical Development in the Structural Model and Free Energy Minimization − Digitising the Murten Panorama. The story behind the highest resolution scan of an artwork − Capturing high resolution stereoscopic panorama images with a single camera − Removing tourists from photographs by averaging − Focus Peaking - An Algorithm − Vertical Panoramas − Symmetry in Chaos − Dome Projection and Calibration for Offaxis Fisheye Lenses − Tools for Spherical Mirror Projection Copyright: The contents of this web site are © Copyright Paul Bourke or a third party contributor where indicated. You may print or save an electronic copy of parts of this web site for personal use, permission must be sought for any other use.'''
