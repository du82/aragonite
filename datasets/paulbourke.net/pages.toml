["http://paulbourke.net/dataformats/dmo/index.html"]
title = "DMO file format"
full_description = "To create a DMO file start the game with the command line switch /r (and /l (level), /s (skill) etc.) and play as usual. If you press F10 the record (and the game) stops. You will find a file demo1.dmo in the current directory. To play it back just start the game and hide the menu by pressing ESC. In Duke Nukem 3D 1.0 and 1.1 the skill value is a bit strange: To record a skill n (1<=n<=4) game note to use /sn+1. So /s2 is ``Peace of Cake'' and /s5 is ``Damn I'm Good''. The dn3dhelp.exe hint (/sn with 0<=n<=3) is totally wrong. It is impossible to record with version 1.0 more than one level. You can't even record the summary screen at the end of each level. In version 1.1 it seems to be possible (I got it some times). Some other times I got only the recording of the last level. A DMO file records all player actions. The monster movements, re-spawn positions etc. are totally deterministic. The messages during a multiplayer game (macros and RemoteRedicule (tm)) do not appear in the DMO. A DMO file consists of a header with some organizational information and the data area with all the (compressed) game tics. The term ``game tic'' comes originally from DOOM and denotes the smallest unit of time during the game. The duration of a game tic is 1/30s. To store a game tic in a file means to store all actions, like movement, open doors, fire weapons and so on, happened during this time. Duke Nukem 3D 1.0 and 1.1 use a 9 byte main header: address type contents 0x0000 long number of game tics times number of players 0x0004 byte episode (0-3) 0x0005 byte map (0-8) 0x0006 byte skill (0-4) 0x0007 word player number The first entry in the header (number of game tics) may be zero in version 1.1 recordings. This should mean, that there is more than one level recorded. Duke Nukem 3D 1.3D uses a 24 byte main header: address type contents 0x0000 long number of game tics times number of players 0x0004 byte volume - 1 (/v parameter - 1) 0x0005 byte level - 1 (/l paramerer - 1) 0x0006 byte skill (0 .. 4) (/s parameter) 0x0007 byte MP mode (/c 1 = DukeMatch(spawn), 2 = Coop, 3 = Dukematch(no spawn)) 0x0008 short player number (1..8) 0x000A short 0x01 with /m (nomonsters), 0x00 else 0x000C long 0x01 with /t1 (respawn monsters), 0x00 else 0x0010 long 0x01 with /t2 (respawn items), 0x00 else 0x0014 long 0x01 with /t3 (respawn inventory), 0x00 else"
year_published = 2025
