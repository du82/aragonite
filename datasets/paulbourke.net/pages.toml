["http://paulbourke.net/dataformats/egdr/index.html"]
title = "MOLA Experiment Gridded Data Record"
full_description = "This is the format used for, among other things, the topographic grid data for the mare terrain databases. The files are plain ASCII with 6 columns as follows. The MOLA IEGDR is in the form of an ASCII table with one row for each latitude-longitude bin, from 90 to -90 degrees latitude and from 0 to 360 degrees longitude. The binned data include all MOLA nadir observations from the Orbit Insertion phase, plus Mapping Phase nadir observations, plus off-nadir observations of the north pole above 86 degrees latitude acquired during spring 1998 and of both poles taken in July 1999. Orbits 355 and 358 of the Orbit Insertion Phase and orbits 10709 through 10716, inclusive, of the Mapping Phase are excluded because solutions for these orbits are deemed to be poor. (Note: subtract 10000 from MOLA mapping phase orbit number to determine the equivalent MGS Project orbit number.) Also excluded are shots more than 1 degree off-nadir (except as noted above), channel 4 returns, and any returns not classified as ground returns, e.g. clouds or noise, according to the SHOT_CLASSIFICATION_CODE. Most observations have been crossover-corrected. The polar observations have not been fully corrected and may be revised somewhat, as the pointing of the instrument is not known as accurately as the range measurement. The IEGDR may be released at various grid resolutions. Examples are 1 degree latitude by 1 degree longitude bins, 0.5 by 0.5 degree bins, and 0.25 by 0.25 degree bins. The IEGDR file name is in the form IEGnnn_v.TAB, where nnn represents the bin size and v the version. For example, the first release of the 0.5 by 0.5 degree IEGDR is named IEG050_A.TAB. The areocentric coordinate system [DAVIESETAL1994B], more generally described as planetocentric, is body-centered, using the center-of-mass as the origin. Areocentric latitude is defined by the angle between the equatorial plane and a vector extending from the origin of the coordinate system to the relevant point on the surface. Latitude is measured from -90 degrees at the south pole to +90 degrees at the north pole. Longitude extends from 0 to 360 degrees, with values increasing eastward (i.e., it is a right-handed coordinate system) from the prime meridian [DAVIESETAL1994B]. This coordinate system is preferred for use in geophysical studies in which, for example, estimates of elevation or gravitational potential are generated mathematically."
