title = "WAMIT gdf 3D format"
full_description = "The GDF format is from the WAMIT software, a computer program based on the linear and second-order potential theory for analyzing floating or submerged bodies, in the presence of ocean waves. It is a plain text, human readable, format. It consists of a 4 line header which includes the number of quads that are in the file. Each quad is simply a list of each vertex, so each line(after the header) consists of 16 floating point numbers. Whether a triangle can be represented by making the last two vertices identical is unknown, probably application specific."
