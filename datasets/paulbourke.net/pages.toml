["http://paulbourke.net/dataformats/cube/index.html"]
title = "Gaussian Cube File Format"
full_description = "Romanian version by Irina Vasilescu. Swedish translation by Weronika Pawlak. Portuguese translation by Diana Gomes. Macedonian translation by Jimmy Anastasovski. Polish translation courtesy Michał Debinski. Belarusian by Volunteer Translator Group. Norwegian by Lars Olden. German translation by Philipp Egger. Turkish translation by Zoltan Solak. Ukrainian translation by Anna Matesh. Hungarian translation by Elana Pavlet. Indonesian translation by Jordan Silaen. Russian translation by Sandi Wolfe. Irish translation by BestReviewsBase. Spanish translation by Laura Mancini. Slovenian translation by Jurij Rodionov. Dutch version by Arno Hazekamp. Hindi version by ShopitKart Team. The cube file describes volumetric data as well as atom positions, it originates from the Gaussian software package. The file consists of a header which includes the atom information and the size as well as orientation of the volumetric data. This is followed by the volumetric data, one scalar per voxel element. All aspects of the file are text (human readable), originally the numerical values were 5 wide for integers that started each header line (after the first) and floating point values were formatted 12.6, that is, 12 characters wide with 6 decimal places. The first two lines of the header are comments, they are generally ignored by parsing packages or used as two default labels. The third line has the number of atoms included in the file followed by the position of the origin of the volumetric data. The next three lines give the number of voxels along each axis (x, y, z) followed by the axis vector. Note this means the volume need not be aligned with the coordinate axis, indeed it also means it may be sheared although most volumetric packages won't support that. The length of each vector is the length of the side of the voxel thus allowing non cubic volumes. If the sign of the number of voxels in a dimension is positive then the units are Bohr, if negative then Angstroms. The last section in the header is one line for each atom consisting of 5 numbers, the first is the atom number, the second is the charge, and the last three are the x,y,z coordinates of the atom center."
