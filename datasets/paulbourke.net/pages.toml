full_description = "An AL2 file begins in the very first line of the file. Every line (except comments) begins with a keyword in brackets. Comments (if any ) usually begin in the second line right after [CHEMFILE] keyword and are preceded by a semi-colon. The following is a short description of the items that can be found in an AL2 file. In addition to all above-mentioned required fields, a molecule MAY contain various kinds of properties, that are contained in the [MOLECULE] - [ENDM] block; A molecule block may also contain labelling and rendering information. Here is a brief description. There may be some additional items in the [I] - string that are used internally by the program; Advanced features are given rather briefly because many items are used internally by the program and are not supposed to be edited be the inexperienced user. This is molecule built from a prior Protein molecule. In this case amino acids become fragments. So there is a reference to the pseudo fragment library. The other information is mostly used internally by the Alchemy. This is molecule built from Fragment Libraries Components. It mainly contains reference to the fragment library from where separate fragments were obtained. The other information is mostly used internally by the Alchemy."
