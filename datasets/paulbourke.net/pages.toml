["http://paulbourke.net/dataformats/audio/index.html"]
title = "Audio File Formats"
full_description = 'This document briefly describes the minimal requirements for creating an AIFF formatted sound file of a single channel, it includes some example C source, and finally it contains the complete description of the format for version 1.3 of the specification. The header simply consists of the letters "FORM", the total size in bytes of the remainder of the file, followed by the letters "AIFF". The common chunk starts with the letters "COMM" followed by the size of the rest of common chunk, 18. The data of the common chunk consists of the number of channels, the number of samples in each channel, the size in bits of the samples, and finally the sampling rate. The sound data chunk starts with the letters "SSND" followed by the size of the rest of the data chunk in bytes. The first two fields of the sound data chunk are the offset and block size which are usually 0. The rest of the sound data chunk consists of the actual sound samples. For multiple channels the samples are in interleaved order. The Audio Interchange File Format (Audio IFF) provides a standard for storing sampled sounds. The format is quite flexible, allowing for the storage of monaural or multichannel sampled sounds at a variety of sample rates and sample widths. Audio IFF conforms to the "EA IFF 85" Standard for Interchange Format Files developed by Electronic Arts. Audio IFF is primarily an interchange format, although application designers should find it flexible enough to use as a data storage format as well. If an application does choose to use a different storage format, it should be able to convert to and from the format defined in this document. This will facilitate the sharing of sound data between applications. Audio IFF is the result of several meetings held with music developers over a period of ten months in 1987-88. Another "EA IFF 85" sound storage format is "8SVX" IFF 8-bit Sampled Voice, by Electronic Arts. "8SVX", which handles 8-bit monaural samples, is intended mainly for storing sound for playback on personal computers. Audio IFF is intended for use with a larger variety of computers, sampled sound instruments, sound software applications, and high fidelity recording devices.'
year_published = 2025
clearnet = "http://paulbourke.net/dataformats/audio/index.html"
