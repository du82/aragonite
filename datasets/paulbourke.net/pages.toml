["http://paulbourke.net/dataformats/holter/index.html"]
title = "Holter ECG .dat files"
full_description = '''A Holter recorder is an ambulatory electrocardiography device for, most commonly, measuring ECG for possibly many days. Software is provided that analyses the signals calculating various metrics common in the industry. However, the system and software is proprietary, it does not even seem to offer any facility to export the raw data in a format that is useful for independent analysis or research. In the authors opinion this is totally unconscionable behaviour, while it may be reasonable to protect algorithms and IP involved in the analysis, the raw data could reasonably be expected to be the property of the person who purchased the recording equipment, or the person whose ECG was recorded. But there is a way around this. The recorder stores the original recording in a "flash.dat" file. While parts of this file can be decoded, there are aspects that are as yet not understood. Indeed since the LX Analysis software seems to be built upon Matlab it may be that there are MatLab conventions and file writing details involved. The file would in the very least be quite inefficient to deal with for analysis. So, the very first time the LX Analysis software reads the flash.dat file it creates a bunch of other files, each containing a specific aspect of the data. One of the files so created is called "datacard.dat", this contains the ECG samples of the N channels recorded, typically 2 or 3. As long as this datacard.dat file exists then it is relatively easy, albeit messy, to extract the samples. Behind the scenes the installer of LX Analysis (this includes the free demo version) installs some utilities, one is called unpackdc (unpack data card). This creates a simple 2 byte per sample binary file per channel that is then easy to read and write in a more useful format for other software. There are international standards for recording medical data, including ECG data. Indeed one has the Holter name associated with it, namely the Holter ECG Standard, clearly they are just paying lip service to the idea of international standards if they don't even support their own format as an export option.'''
year_published = 2025
clearnet = "http://paulbourke.net/dataformats/holter/index.html"
