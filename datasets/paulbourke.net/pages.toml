["http://paulbourke.net/fractals"]
title = "Fractals, Chaos, Self Similarity"
description = "Paul Bourke - Fractals, Chaos, Self Similarity"
full_description = "paulbourke.net − +61 (0)433338325 − paul.bourke@gmail.com − FB − Sketchfab − Fab − YouTube − Vimeo If you have found the contents of this site useful then please consider donating to one of my vices: Cup of coffee − Can of beer − Bottle of wine The following is a collection of fractal, chaos and attractors by the author. It includes most known formulations, including but not limited to L-Systems, IFS (Iterated Function Systems), attractors and both 2D and 3D geometric fractals. Also included are a number of numerical solutions for computing dimensionality and other metrics. Random space filling of the plane Space filling of a plane (and a line or 3D) with an arbitrary shape. Initial concept and inspiration by John Shier. DLA (Diffusion Limited Aggregation) Diffusion Limited Aggregation in 2D and 3D. Including constrained by a surface and a software implementation. Rendering Wada-type basins of attraction Here's a party trick for over Christmas. Get 4 large shiny Christmas balls, some coloured wrapping paper, some lights from the Christmas tree, and you have you own fractal laboratory to amuse yourself with over the festive season. Fractal Dimension and Self Similarity -- Box counting fractal dimension of volumetric data -- Box counting fractal dimension of point data A particular box counting software package, Ruler or Compass Dimension, Lacunarity, Multifractal spectrum, Recurrence plots, Self Similarity. Examples of self similarity in fractals with examples from mathematics and photos of the physical world. Volumetric fractals -- Visualising volumetric fractals -- 3D volumetric fractal trajectories Including the Bedouin, Real number Mset, Quinternion set, Sine Mset, Triternion fractal, Danca volume. Noise Including 1/f noise. Fractal planets and landscapes: Methods for creating fractal planets, landscapes, and clouds. Generating noise with different power spectra laws. Including frequency synthesis and midpoint displacement and a gallery of images created using Voxel World by Dmytry Lavrov. Perlin noise and turbulence: Creating arbitrary dimensional textures and other natural effects using techniques credited to Ken Perlin."
