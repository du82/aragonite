["http://paulbourke.net/dataformats/cdf/index.html"]
title = "Cyberspace Description Format (CDF)"
full_description = "1.1. This document details a proposed standard text format for describing cyberspace decks and virtual worlds. It is based on Autodesk's internal experience using the Cyberspace Developer Kit CDF. As a result, this proposal contains some changes from the CDF found in CDK Versions 1.0 and 1.01. The specification reflects a change in focus from supporting the CDF as a proprietary developer's tool to promoting the CDF as a set of guidelines that will evolve towards an industry standard. 1.2. The purpose of the CDF is to provide a standard framework to store, retrieve, modify and exchange descriptions of cyberspace objects. These descriptions encompass object initialization, object state and object scheduling within a cyberspace simulation. 1.3. We start with a small core containing basic syntax, organizational and reference semantics. The next layer (level 2) contains semantics for creating certain classes of objects fundamental to all virtual worlds. The third layer (level 3) contains vendor-specific or experimental extensions in such a way that those extensions can be read or bypassed by a given CDF parser (see figure 1). 1.4. The CDF as an industry standard allows any number of implementations, just as today there are any number of implementations of DXF readers and writers. It gains this flexibility through layering and by allowing delegation of parsing of various resource files (such as DXF, 3DS, Inventor, OOGL, and others). For example, a given CDF parser may not itself know how to parse a 3DS file, but may delegate this task to a parser object for that capability as in figure 2. The sub-parser can either create native objects from the resource file, or rewrite it as CDF which can then be reparsed by the CDF parser. 1.5. The CDF describes cyberspace simulations, in which changing constellations of geometry and behaviour reflect some domain of interest, rather than merely assembling static geometrical scenes. Autodesk has created a large number of scene description classes in its Cyberspace Developer Kit that are expressible in CDF; however, the specification for these classes can apply equally well to a variety of class libraries. A proposed standard for these specifications is included in the second layer of the CDF."
