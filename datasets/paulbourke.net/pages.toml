["http://paulbourke.net/geometry"]
title = "Geometry, Surfaces, Curves, Polyhedra"
description = "Paul Bourke - Geometry, Surfaces, Curves, Polyhedra"
full_description = "paulbourke.net − +61 (0)433338325 − paul.bourke@gmail.com − FB − Sketchfab − Fab − YouTube − Vimeo If you have found the contents of this site useful then please consider donating to one of my vices: Cup of coffee − Can of beer − Bottle of wine The following is a random collection of various topics in geometry the author has explored or simply documented over the years. Many of the topics include source code illustrating how to solve various geometric problems, or to assist others recreating the geometric forms presented. Notes on polygons and meshes Includes Surface (polygon) simplification, Clipping a polygonal facet with an arbitrary plane, Surface Relaxation and Smoothing of polygonal data, Mesh crumpling, splitting polygons, two sided facets, polygon types, tests for clockwise and concavity, clipping line to polygons, area of a 3D polygon, area of general polygons, determining inside/outside test, intersection of a line and a facet, Eulers numbers. Notes on points, lines and planes Includes calculations for the distance between points, lines and planes. The intersection between 2 lines in 2D and 3D, the intersection of a line with a plane. The intersection of two and three planes. Notes on circles, cylinders and spheres Includes equations and terminology. Equation of the circle through 3 points and sphere thought 4 points. The intersection of a line and a sphere (or a circle). Intersection of two circles on a plane and two spheres in 3D. Distributing Points on a Sphere. The area of multiple intersecting circles. Creating a plane/disk perpendicular to a line segment. Modelling with spheres and cylinders, including facet approximation to a sphere and cylinder, rounded boxes, pipes, and modelling with spheres. Transformations and projections Methods for mapping points on a spherical surface onto a plane, stereographic and cylindrical (including Mercator) projections. Includes Aitoff map projection: Conversion to/from longitude/latitude (spherical map). Transformations on the plane. Cartesian, Cylindrical, and Spherical coordinate systems. Euler angles and coordinate transformations. Converting between left and right coordinate systems. Classification of projections from 3D to 2D and specific examples of oblique projections. Planar (stretching) distortion in the plane. Anamorphic projections and Mappings in the Complex Plane (Otherwise known as Conformal maps). 3D projection: Transforming 3D world coordinates into 2D screen coordinates. Convert spherical projection into a cylindrical projection. Uniform vector on sphere given rotation angles"
