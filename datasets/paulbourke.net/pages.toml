["http://paulbourke.net/dataformats/field/index.html"]
title = "AVS Field Data"
full_description = "This is an extremely general file format, with a wide variety of techniques for data input. Here we shall only consider a subset, please refer to the program documentation for further information. Files of this format can be read using the read field module. There are two variants: we shall consider first data-parsing mode, which is more general, and then look briefly at native mode. To input a dataset in this mode, you must first create a description file. This is a text file whose name must end in .fld, and which contains a description of the layout of the accompanying file (or files) which contain the actual data. The dataset is an n-dimensional array, each element of which may itself be an array; this data structure is known as a field. There are three types of field. The dataset contains a value for every element in the array, supplied in order with the leftmost subscript varying most rapidly. Each value supplied in the dataset it accompanied by a full set of coordinates, indicating where it belongs in the array. There does not have to be a value for each element. On each axis, there are certain indexes for which values are supplied. The values themselves are supplied in order, with the leftmost subscript varying most rapidly. One sequence of coordinates for each axis is supplied. Suppose that the dataset we have includes data for a number of points scattered over a 100x100x50 3-dimensional space. For each point, we have recorded two floating-point values, followed by three coordinates. The data are held as ASCII floating-point values in a file mydata.dat. The description file might look like this: The first five characters of the description file must be # AVS. A # character can be used to introduce a comment on any line. The ndim line specifies the number of dimensions in the array, and the dim1, dim2 and dim3 lines specify the size of the dimensions. The nspace line defines the number of coordinates for each point - often this will be the same as ndim. veclen=2 indicates that there are 2 values for each data point, and data=float specifies that these are binary values. The field=irregular line specifies what kind of field this is (see the last section)."
year_published = 2025
