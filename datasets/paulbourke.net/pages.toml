["https://paulbourke.net/papers/bigdata"]
title = "Cultural Big Data: Nineteenth to Twenty-first Century Panoramic Visualization"
full_description = "From the nineteenth-century panorama to the emergence of the digital panoramic format in the 1990s, the visualization of large images frequently relies on panoramic viewing strategies. Originally rendered in the form of epic painted canvases, these strategies are now amplified through gigapixel imaging, computer vision and machine learning. Whether for scientific analysis, dissemination, or to visualize cultural big data, panoramic strategies pivot on the illusion of immersion. The latter is achieved through human-centered design situated within a large-scale environment combined with a multi-sensory experience spanning sight, sound, touch, and smell. In this article, we present the original research undertaken to realize a digital twin of the 1894 panorama of the battle of Murten. Following a brief history of the panorama, the methods and technological framework systems developed for Murten panorama's visualization are delineated. Novel visualization methodologies are further discussed, including how to create the illusion of immersion for the world's largest image of a single physical object and its cultural big data. We also present the visualization strategies developed for the augmentation of the layered narratives and histories embedded in the final interactive viewing experience of the Murten panorama. This article offers researchers in heritage big data new schemas for the visualization and augmentation of gigapixel images in digital panoramas. Big Data, Panorama, Battle of Murten, Gigapixel image, Data visualization, 3D Augmentation, Media Archaeology, Cultural History"
year_published = 2025
clearnet = "https://paulbourke.net/papers/bigdata"
category = "SitesList"
tags = ["abstract", "century", "cultural", "data:", "keywords", "nineteenth", "panoramic", "paper", "twenty-first", "visualization"]
