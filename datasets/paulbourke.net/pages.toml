["http://paulbourke.net/dataformats/ac3d/index.html"]
title = "AC3D File Format"
full_description = '''The AC3D file format is ASCII text and is very simple to parse. It's also very easy to generate AC3D files from your own data. This document describes the structure of AC3D files. Some simple examples are included at the end. AC3D filenames usually have a '.ac' suffix. For more information about AC3D, see http://www.ac3d.org. The first four characters are always 'AC3D' the next hex number following immediately defines the internal version of the file (0xb == 11). If the version is later than the program knows about then it will probably may refuse to load it. As new versions of the AC3D file format evolve, this number is used to make the loading code backwards compatible. This is the basic structure. %f indicates a floating point value, %d an integer and %s a string (must be surrounded by quotes " if it contains spaces). Lines beginning with a '*' indicate an optional section. The tokens are case-sensitive. The indentation is used to show the structure of the file - a real AC3D file has no indentation. single line describing a material. These are referenced by the "mat" token of a surface. The first "MATERIAL" in the file will be indexed as zero. The materials are usually all specified at the start of the file, immediately after the header. Specifies the start of an object. The end of the object section must be a 'kids' line which indicates how many children objects (may be zero) follow. The parameter is the object type - one of: world, poly, group. Optional - object data. Usually the object-data string for an object. The parameter is an integer which specifies the number of characters (starting on the next line) to be read. Optional - default is no texture. the path of the texture bitmap file for the texture of the current object. Optional - default 1.0,1.0 . The texture repeat values for the tiling of a texture on an object's surfaces. The 3x3 rotation matrix for this objects vertices. Note that the rotation is relative to the object's parent i.e. it is not a global rotation matrix. If this token is not specified then the default rotation matrix is 1 0 0, 0 1 0, 0 0 1'''
year_published = 2025
