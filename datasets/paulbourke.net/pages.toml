["http://paulbourke.net/dataformats/directx/index.html"]
title = "Direct-X format"
full_description = '''The DirectX file format is an architecture- and context-free file format. It is template-driven and is free of any usage knowledge. The file format may be used by any client application and currently is used by Direct3D Retained Mode to describe geometry data, frame hierarchies, and animations. This following sections deal with the content and syntax of the file format. The file format uses the extension .x when used with the DirectX Software Development Kit (SDK). The variable length header is compulsory and must be at the beginning of the data stream. The header contains the following: Type Sub Type Size Contents Content Meaning Magic Number (required) 4 bytes "xof " Version Number (required) Major Number 2 bytes 03 Major version 3 Minor Number 2 bytes 02 Minor version 2 Format Type (required) 4 bytes "txt " Text File "bin " Binary File "tzip" MSZip Compressed Text File "bzip" MSZip Compressed Binary File Float size (required) 4 bytes 0064 64-bit floats 0032 32-bit floats Comments are only applicable in text files. Comments can occur anywhere in the data stream. A comment begins with either C++ style double-slashes "//", or a number sign "#". The comment runs to the next new line. Templates define how the data stream is interpreted—the data is modulated by the template definition. This section discusses the following aspects of a template: This is an alphanumeric name that may include the underscore character "_". It must not begin with a digit. A universally unique identifier (UUID) formatted to the Open Software Foundation's Distributed Computing Environment standard and surrounded by angle brackets "<" and ">". For example: <3D82AB43-62DA-11cf-AB39-0020AF71E433>. Template members consist of a named data type followed by an optional name or an array of a named data type. Valid primitive data types are as follows: Type Size WORD 16 bits DWORD 32 bits FLOAT IEEE float DOUBLE 64 bits CHAR 8 bits UCHAR 8 bits BYTE 8 bits STRING NULL-terminated string CSTRING Formatted C-string (currently unsupported) UNICODE UNICODE string (currently unsupported)'''
year_published = 2025
