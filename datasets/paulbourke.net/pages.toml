["http://paulbourke.net/dome/offaxisfisheyeprojection"]
title = "Dome Projection and Calibration for Offaxis Fisheye Lenses"
full_description = "Hemispherical dome projection can be achieved with both multiple data projectors as well a single projector with a fisheye lens. Single projector systems have many advantages, in particular, they are simpler and generally have a lower cost of ownership and require a simpler software stack. The often quoted advantage of multiple projector systems is higher resolution but that comes at the expense of requiring edge blending which is rarely perfect. For many applications the recent availability of 4K (and higher) projectors provides a comparable result with a single projector. Unlike the planetarium industry where single projector systems are typically located in the center of the dome. For some dome configurations, for example for small personal domes such as the iDome, the center is ideally the space occupied by the viewer. The approach then is to locate the projector and fisheye lens either above the dome or, in the case of folded optics, under the floor at the base of the dome. In all cases the fisheye lens needs to have sufficient field of view and be positioned so that the entire dome surface is illuminated. In the case where the fisheye has 180 degree field of view horizontally, it generally then has 110 degrees field of view vertically (depends on exact aspect ratio). In all cases the fisheye image to be projected onto the dome, through the lens, needs to be warped so as to provide the correct result on the dome surface. The following presents a tool by the author to facilitate this warping. The options simultaneously include offine warping, mesh generation and GLSL shaders for realtime warping. The approach is to derive the warping by parameterisng all the relevant geometric and optical properties such as lens position and angle, dome radius, projector aspect ratio and degree of truncation. The main advantage of these options is the projection hardware doesn't impact on the space in front of the dome. Folded fisheye optics. Main constraint is only a few fisheye optics companies offer this arrangement."
year_published = 2025
clearnet = "http://paulbourke.net/dome/offaxisfisheyeprojection"
