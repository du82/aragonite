["http://paulbourke.net/dataformats/3d2/index.html"]
title = "3d2 format (Stereo CAD-3D 2.0)"
full_description = "CAD-3D 2.0 stores its 3D objects in a file which can hold up to 40 objects, and contains all the information about the objects, including the lighting and colour palette used by the objects. The file is similar to the older file format, but no longer relies on the Motorola Fast Floating Point library (LIBF) for the storage of vertex coordinates. The new version stores each coordinate in a two-byte word instead of a four-byte floating-point value, saving a considerable amount of storage, as well as making the file usable more easily by programs written with different floating-point formats. The CAD-3D 2.0 3D object file uses an extension of .3D2, and is composed of two parts. The first section is a 256-byte header, which tells how many objects are included in the file, the light settings and the colour information. The second section of the file contains a repeating structure of data which defines the 3D objects in the file. In order for the palette to be useful, it must be accompanied by the colour group base array. This array indicates the index of the first colour in the group to which that colour belongs. In the following example palette, which contains a background colour of black, followed by five reds, five greens and five blues, you can see how the palette base array is used to group the colours together. The reds start at colour index 1, the greens at colour index 6, and the blues at colour index 11. The base value is used when performing shading operations, and if incorrectly set will result in odd-looking images. The object data is a variable-sized section which depends on the complexity of the object. The section repeats for each object in the file, and is structured as follows: The following structure defines the X, Y and Z coordinates for each vertex of the object. It is made up of three words and repeats the number of times specified by the vertex count word above. After all the vertices' coordinates have been read in, the next part of the file describes the triangular faces which make up the object."
year_published = 2025
