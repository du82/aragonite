["http://paulbourke.net/dataformats/fact/index.html"]
title = "FACT format"
full_description = "The Electric Image .fact format is an IFF type format. In other words it follows similar conventions as the Lightwave object file format. The IFF file metaformat is summarized as follows: The file must start with the keyword FORM and an unsigned long indicating the size of the file in bytes (excepting the 8 bytes already read). Then there must be a four byte ASCII file type ID indicating the type of IFF file. If you don't recognize the file type you can punt. Then follow chunks of data. Each chunk consists of a four byte ASCII chunk ID followed by a four-byte unsigned long indicating the length of the data in bytes to corresponding to the chunk (again excepting the 8-byte header). If you don't recognize the chunk type you can skip it. In this way, IFF files are extensible. All numerical fields in an IFF file are big-endian (the high-order bytes occur earlier in the file). The large scale structure of the file is a file header chunk identified by FORM followed by a tree-like structure of part chunks also identified by FORM. The file header chunk ID (FORM) is followed by the size and the form header ID FHDR. Then follows the FINF chunk and it's size. The FINF chunk consists of three unsigned longs indicating the number of vertices in the whole model, the number of facets in the whole model, and the number of groups (parts) in the whole model. This is followed by six floats describing the bounding box of the whole model. Last is four longs that seem to be zeroed out. The data is contained in a sequence of group header chunks with ID GRUP. The file header chunk ID (FORM) is followed by the form size and the form ID GHDR. Then follows the GINF and it's size. The GINF chunk consists of three unsigned longs indicating the number of vertices in the group, the number of facets in the group, and the number of subgroups in the group. Then there are six floats describing the bounding box of the object. After four bytes of crud there is 1 char indicating the length of the object name followed by the object name in ASCII with a bunch of null padding. The last four bytes in this chunk seem to have something in them."
year_published = 2025
clearnet = "http://paulbourke.net/dataformats/fact/index.html"
