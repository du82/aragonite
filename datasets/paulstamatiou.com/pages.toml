["https://paulstamatiou.com/how-i-made-50k-in-3-days-with-nfts"]
title = "How I made $50K in 3 days with NFTs | Paul Stamatiou"
description = "I created Crypto Mondrians, a set of code-generated art NFTs on the blockchain."
full_description = '''My code-generated NFT collection, Crypto Mondrian //DARK. I first dabbled with cryptocurrency in 2011 when I wrote an article about mining Bitcoin on AWS EC2 GPU clusters. My interest in crypto ebbed and flowed over the years before actively avoiding the space until earlier this year. It felt like there was a lot of noise and hype around volatile, speculative asset holding and not much innovation happening. It wasn’t until a few months ago that I began to take a closer look at the state of crypto and see how much the landscape has evolved. The big thing for me was seeing how the blockchain has become programmable with smart contracts, little pieces of automatically-executing code running on the blockchain. The new functionality afforded by smart contracts, along with the relative consumer ease of simply being able to connect your crypto wallet with any decentralized service and be able to quickly interact, has led to a flurry of new product developments. Most of these are categorized under the moniker dApps (decentralized applications that run on the blockchain or in a p2p capacity). A large chunk of dApps are in the so-called DeFi, or Decentralized Finance, space (yes, there's lots of terms and abbreviations in the crypto space). I wrote a brief thread about what I learned about crypto and DeFi my first few weeks diving into it. Ethereum was much more interesting to me now than Bitcoin. So much is being built on top of it with smart contracts and other Ethereum-based tokens. There are crypto-based games like Axie Infinity, robust decentralized exchanges like Uniswap and Matcha.xyz, to communities and DAOs built around their own tokens like FWB and Kong.land. There's far too much activity going on for me to accurately summarize the different types of innovation happening here and I'm definitely still learning myself. NFTs are one particular realm of the crypto community that has been experiencing stratospheric growth over the last year. By now you’ve probably heard about them in some form. It could have been the news of digital artist Beeple selling his NFT artwork for $69 million dollars. Or maybe the news of Figma founder Dylan Field selling a CryptoPunk NFT for $7.5M. NFTs are approaching mainstream status now—Paris Hilton sold her own NFTs, Jay-Z bought a CryptoPunk for $126k for his Twitter avatar and NBA player Steph Curry bought a $180k Bored Ape NFT for his Twitter avatar and even Mila Kunis and Ashton Kutcher launching NFTs that unlock TV show episodes. One thing that stands out to me about crypto now, as opposed to the last time I was involved years ago, is that you can actually do stuff with your crypto now. Before, it seemed like the most you could do was hold on to your crypto as an investment, sending it between wallets, or exchange it back to your local fiat currency. Now, people are able to spend their crypto.. largely on other crypto dApps or into the hands of creators with NFTs. And most of those people will continue investing in and building for crypto and decentralized services, so things continue growing and evolving. However, all the press around NFTs reminds me of the hype around ICOs and speculative asset hodling of meme coins.. are NFTs just the latest example of a fleeting crypto fad? What are NFTs? Digital art, collectibles, identity, tickets and more.. I didn’t really get NFTs for a long time.. and honestly I don’t even know if I fully understand them now. Can’t someone just screenshot the NFT you paid a bundle for and have the same thing you have? That's the common question you hear from anyone when they first hear about NFTs. That's like seeing the Mona Lisa in person, taking a photo, turning that into a print on your wall and saying yours is worth the same. It's not the original. With the public nature of NFTs on the blockchain, it's easy for anyone to verify who owns it, who has owned it and when it first appeared. Anyone can look up your wallet address (or more recently ENS domain name if you set one up) to see what NFTs you own. But let me take a step back for a moment.. NFTs are unique, non-fungible tokens on the blockchain. Regular cryptocurrency tokens like Ether or other Ethereum-based ERC20 tokens are fungible and can easily be traded and swapped for one another. They're all the same thing. By contrast, each NFT has a unique identifier allowing it to be paired with metadata that cannot be changed. While an NFT can be sold and transferred like any fungible token, each NFT has its own unique value and worth. This identifier also makes it possible to trace the ownership history for the NFT. It's also possible to prove the scarcity of an NFT and know how many of a certain type exist and how many can exist. Being able to programmatically prove ownership is where it gets interesting; NFTs can also be used like keys or digital tickets to unlock certain functionality, experiences, membership, events and so on. And an NFT can never be taken from you. There is no middleman. This is not like Amazon being able to remotely delete a Kindle book you purchased because they want to. No one can take your NFT from your (non-custodial) wallet. These traits of NFTs lead to some unique value propositions and capabilities. They can be used for digital art, content, collectibles and gaming but they can also be used for utilities like .eth domains like with the Ethereum Name Service or even tokenized real-world assets. NFTs are status, identity, community, self-expression, access and more. I could go on and get philosophical about the different ways NFTs provide value, but I'll leave it at that. The value of an NFT always depends on what someone is willing to pay for it. The market always wins as they say; NFTs are no exception. Fortunately, now that market is open globally 24/7/365 and has a quick payment system. Not quite like the old days of trying to sell your Magic: The Gathering cards in person and not finding any buyers (just me?). If you'd like to read up on NFTs more, I recommend checking out this NFT page on Ethereum.org, The OpenSea NFT Bible, Designing Internet-Native Economies: A Guide to Crypto Tokens, and NFTs and A Thousand True Fans. Even though NFTs have been around in some form since 2012 and then more media-focused from 2016, it's still very early. I’m sure we’ll continue see a significant evolution of how they are used and how they are valued. Right now NFTs may get a bit of a mixed reputation due to the high level speculation on collectible assets and many buyers trying to quickly flip NFTs that are part of a limited set. There are also private communities focused on investing in NFTs that have been growing, such as with PleasrDAO and Flamingo DAO. While Flamingo DAO has done very well with their NFT investments so far, having experienced a 40X gain and owning NFTs worth $1B+, they take a longer view on what NFTs can provide: The growth of NFTs is just beginning, because NFTs represent the digitization and financialization of digital property and intellectual property. Trillions of creative works swirl around the Internet and are difficult to monetize, except through licensing models. NFTs hold out the hope of bringing back to the Internet an ownership economy. Creators can create, sell, and fractionalize ownership in their works, opening up a new chapter for creative endeavor. NFTs can be: fractionalized combined into token sets used as collateral for lending and stablecoin protocols dynamic and interactive, incorporating outside data feeds Over the longer arc, NFTs hold out the hope of becoming increasingly financialized, interacting with other core blockchain-based financial primitives. They may prove to be a core primitive for decentralized identity solutions, and may increasingly serve as a cornerstone for monetizing emerging metaverses and other gaming platforms. — What is Flamingo? Whatever your thoughts are on NFTs, it's hard not to pay attention to what's happening in the space. I very often think about how the next big thing will start out looking like a toy in the context of everything happening in crypto now, like the early days of the Internet. Common types of NFT projects 10k PFPs, collectibles, games and more With the basics out of the way, lets see what types of media-focused NFTs and cryptoart are common right now. First off, we have the very popular so-called “10k PFP” collections. These are sets limited to 10,000 media assets geared towards being used as a profile picture, usually because the image looks like some kind of being: human, alien or otherwise anthropomorphized entity. There are the popular ones like CryptoPunks and Bored Apes and then there are the many derivative collections trying to capitalize on these types of sets. Owning an NFT from one of these collections has led to being a new sort of status and community. There are interesting trading card-like NFTs like Parallels and gaming NFTs like Zed. And then a section of the NFT space that I'll just call experiments because I'm not sure what else to call them. Things like Blitmap, Loot and Tunes Project that test the waters of how certain types of NFTs can invite others to build on top of them. In this case of Loot, building a whole game ecosystem with characters, loot, music and more. And of course, there's a ton of NFTs that encompass all other forms of art. It has also been inspiring to see artists adapt to the new format and reap the benefits; getting paid more easily and generously than previously. There are computer-assisted artists making 2D and 3D creations by hand and there are all sorts of artists making digital versions of their hand-made creations. There's even a painter selling NFT sketches that come paired with an offer to unlock a physical painting, shipped to whoever owns the NFT during a particular time each year. But there’s one type of NFTs that I became particularly fond of: generative art. Generative art can be defined in many ways but at a high level it's any art that was created in part or in whole with the artist being hands-off and having an automated computer system or program do the rest, leading to each creation being entirely unique. One of the popular players in this space is Art Blocks. This example below sold for 777 ETH (around $2.5M when it sold): Wow... just shocked. When I set this price (yesterday) I didn't really expect it to sell this quickly. Thank you @tylerxhobbs for your fantastic work. I will certainly reinvest this in new and upcoming artists / donate a portion to charity. 🙏🤯 https://t.co/rbaJQ73D48 — Kevin Rose (@kevinrose) August 25, 2021 Making my NFTs How I got inspired, built and listed them I knew I wanted to get involved with NFTs somehow. Over the past few months I had been seeing designers I follow experiment with and find success creating and selling their own cryptoart NFTs. Friends and family had been suggesting I do something with NFTs; I just didn’t know what. I’m a designer and developer but my forte is definitely not the type of graphic and 3D design I had seen as being common with NFTs: detailed illustrations, 3D concepting/rendering and 3D animation. I didn’t want to design another collection of PFPs. It had to be something that I could feasibly write a simple program myself with regular web and mobile languages I already know. I thought about picking up Processing, which I had last touched in college more than a decade ago, and making some art out of things like Conway's Game of Life and other cellular automata. But I didn't find that to be particularly aesthetically pleasing or how I could make it pleasing. I began thinking about modern, abstract art I like, wondering if I could do a "crypto" take on that. I like geometric art and something with simple geometric shapes would be feasible for me to code with regular web/software technologies I already know. And hopefully by being heavily inspired by existing traditional artwork, these NFTs would might already feel familiar to viewers. A few years ago I visited Amsterdam (my photoset) and visited museums like the Stedelijk Museum of modern and contemporary art where I had seen lots of De Stijl pieces. Piet Mondrian's compositions came to mind along with pieces by Gerrit Rietveld. I decided to try writing some code to generate Mondrian-inspired art that would be unique each time I ran it. But I wanted to make it feel like what crypto feels like to me at first glance. I think Mr. Robot, Shadowy super coders, dark web, The Matrix, Blade Runner, Altered Carbon, Ready Player One.. lots of neon colors, glows and darkness. After I had a general idea of what I wanted to create, I thought about how to build it. I knew I wanted to do a limited set, something under 1,000. I figured 100 would be a nice way to get started and test the waters. Just enough that I would need to have whatever code I wrote be able to export directly to PNG. I didn't want to hack around with taking screenshots for each of them. The general vibe I was going for.. bright colors seeping into generous glows. I decided to start by making a simple HTML page that used canvas and JavaScript to create the art and easily let me export the canvas. I had become familiar with canvas recently when making the Stocketa site: Spent a good chunk of the weekend building out the last bits of the new @StocketaApp website. Happy with how it's turning out... will probably deploy later tonight Used Canvas to composite JPG frames (for smaller size) using PNG masks (for alpha) for Apple-like 3d scroll effect pic.twitter.com/2OBNhIR3y8 — Paul Stamatiou (@Stammy) April 20, 2021 Stammy@Stammy·FollowSpent a good chunk of the weekend building out the last bits of the new @StocketaApp website. Happy with how it's turning out... will probably deploy later tonight Used Canvas to composite JPG frames (for smaller size) using PNG masks (for alpha) for Apple-like 3d scroll effectWatch on X After a Sunday afternoon of tinkering, I had a working concept. Every time the page loaded, a new random design would be created. I used the localStorage API to keep track of views and name each file for export, which I would simply do via a download button on the page. I was too eager to get this out and didn't spend much time on additional code to automate things. Much of the code revolves around randomly selecting the number of iterations to complete, what color palettes to use, modifying colors and the intensity of the glows. Some of them used color palettes of 3-5 colors I put together myself, while others I had the code pick from a random color and then find pentadic, tetradic or triadic colors to use or use varying alphas of a single color. Figuring out the colors took a decent chunk of time and I think there was still some room for improvement. I ended up having around 15 different color palettes I was having the code randomly select between at one point. This is what it ended up being—a simple HTML page with a few hundred lines of JavaScript and a download butto'''
