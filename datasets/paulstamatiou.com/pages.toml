title = "About | Paul Stamatiou"
description = "About Paul Stamatiou. I'm a designer who loves to build and code. I'm a huge advocate for having a high product quality bar and know that having an intimate understanding of technical constraints is a core part of elevating quality."
full_description = '''{"@context":"https://schema.org","@type":"Person","headline":"About","datePublished":"2024-08-24T00:00:00Z","dateModified":"2024-08-24T00:00:00Z","description":"I'm a designer who loves to code. I'm a huge advocate for having a high product quality bar and know that having an intimate understanding of technical constraints is a core part of elevating quality.","image":"https://paulstamatiou.com/og?title=About","url":"https://paulstamatiou.com/about","author":{"@type":"Person","name":"Paul Stamatiou"}}HelloI'm Paul, but I go by StammyGameboy '89On safari in TanzaniaI'm a designer who loves to code. I'm a huge advocate for having a high product quality bar and know that having an intimate understanding of technical constraints is a core part of elevating quality.While I obsess over the details in visual design, interaction design and code, I've done this long enough to know that successful designs encompass much more than that. They're collaborative endeavors spanning research, engineering, product, design and more. But most importantly, I know there's always compromise in the design process, and embracing pragmatism.I'm 38.661930594 years old and live in San Francisco with my wife Katherine, but previously lived in New York, Atlanta, and Houston. I have a degree from Georgia Tech in Computational Media—a hybrid of computer science and design—though I spent my first year pursuing electrical engineering.WorkMy career has been a mix of startups and large companies, design and engineering. I spent 9 years at Twitter where I primarily designed media and creation experiences, such as threads, camera, and composer.SabbaticalExploring ideas2025–▒▒▒▒Limitless (née Rewind AI)Co-Founder, Head of Design2022–2025KrakenPrincipal Product Designer2021–2022TwitterSr Staff Product Designer2013–2021Picplum (YC S11)Co-Founder2011–2013Notifo (YC W10)Co-Founder2010–2011SkribitCo-Founder2007–2010Georgia TechWeb Developer2007Yahoo!Web Developer Intern2006I tend to thrive in any environment and adapt as needed. At smaller companies I wear lots of hats and am extremely hands on designing and coding. At larger companies I spend lots of time with PM and research to ensure what's being designed matches the problem and gains executive buy-in—something learned from years at Twitter where compelling designs, prototypes, and flashy decks alone didn't get features shipped.I'm currently taking time to explore ideas and dive deeper into AI.I most recently Co-Founded and was Head of Design at Limitless.ai. Limitless is working towards personalized AI powered by everything you’ve seen, said, or heard, and creating a hardware device called the Pendant. Previously, we created a Mac app called Rewind AI. Limitless raised from investors including Sam Altman, a16z, First Round Capital, and NEA. Here's a thread of design details from a recent launch.ElsewhereI mainly use Twitter, where I like to talk about design, code and just generally things that interest me. I'm Stammy on most sites. That's been my nickname for years now. It's easier to say than my last name.Twitter: @StammyMastodon: stammy@stammy.designLinkedIn: /in/paulsInstagram: @pstamatiouWebsiteI've been publishing here since 2005 when I hosted it on a G4 Mac Mini in my dorm. Everything is designed and coded myself—no themes or templates here—in San Francisco on my MacBook Pro with the Glove80 keyboard and Studio Display with the Cursor code editor, Warp terminal, and Arc browser.Built with Next.js, hosted on Vercel, with most media served from AWS CloudFront.Uses Framer Motion, Tailwind CSS with some modified Shadcn components, as well as various custom components (such as photosets, the animated image filter at the top of this page, or components inside posts like Stocketa).I'm always exploring various typefaces, but currently use the following: Pangram Fragment Glare, Carrara by Hoftype, Averta by TDF, Source Sans 3, Argent Pixel by CF, and Server Mono Geist Mono. All fonts have had glyphs manually subset to reduce file size.Header tab icons custom made then animated myself using Lottie.View the site design timeline to see how this site has evolved.Get notified of new posts. I don't post that often. There's also RSS'''
year_published = 2025
