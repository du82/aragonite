full_description = "Paul Stamatiou is a designer who codesWelcome to my corner of the web where I write about design, code, startups and just about anything that interests me. I've designed, built and written for this site for 19 years now.I'm currently taking time to dive deeper into AI. I was most recently Co-Founder of Limitless working on personalized AI. Read more »Georgia Tech BS, CM (CS + Design)Two-time Y Combinator alumJoined Twitter design team pre-IPO, stayed 9 yearsRecently lived in NYC, currently in San FranciscoMOREPosts15 of 1,222 postsThe Startup DesignerNavigating the chaos, crafting the futureAugust 27, 2024StocketaA dive into the app I designed, built and never launched.October 16, 2023Digital clutterLearning to let go and stop hoarding terabytesApril 15, 2023Hosting your own Mastodon serverJoin the Fediverse on your own termsMarch 7, 2023MastodonThoughts on Twitter, Mastodon, and owning your dataJanuary 5, 2023CraftThoughts on elevating product qualityNovember 14, 2022Revisiting the iPodTaking a look back and using a 20 year old iPod today.August 6, 2022Crypto design challengesThoughts on design challenges facing crypto/web3 today.November 24, 2021How I made $50K in 3 days with NFTsI created Crypto Mondrians, a set of code-generated art NFTs on the blockchain.September 12, 2021Getting started with SwiftUIBuilding your own iOS app is easier than ever with SwiftUI.June 2, 2021Thoughts on email hostingSaving money when dealing with many email addresses and domainsMarch 20, 2021BuildingA few thoughts on designing and building as I reflect on what I learned in 2020.December 31, 2020The SquireA few thoughts on my new favorite pen, the BaronFig Squire.December 21, 2020Hello, RSSGetting back into RSS with a modern RSS reader.October 18, 2020Side projectsWhat side projects mean to me.October 5, 202015 of 1,222 postsGet notified of new posts. I don't post that often. There's also RSS"
