["https://paulstamatiou.com/crypto-design-challenges"]
title = "Crypto design challenges | Paul Stamatiou"
description = "Thoughts on design challenges facing crypto/web3 today."
full_description = '''It’s still early days in crypto. That’s what you’ll hear everywhere when you start digging into crypto and web3 today. For most new users this unfortunately feels a bit closer to the wild west. There are a myriad of situations where they might not know what's happening and where they don't trust the system, services or tools they're using. Early adopters face foreign terminology, complex UIs, unexpected and exorbitant fees, security issues, slow transactions, confusing errors, scams and more. That makes for one hell of an onboarding, even if you're lucky enough to have a friend showing you the way. A message like this is normal for advanced users, but can be confusing, scary and lacking guidance for newcomers. This is the state of crypto today. That can work for now—early adopters are motivated enough to jump through hoops to try something new—but this won’t scale as billions of users join the crypto ecosystem in the coming years. The state of crypto is like the Internet in 1998. But this is all known; there are many new technologies and protocols vying to evolve, change or fix things. I’m most interested in the design side of things. Can we even design truly great experiences for common activities in crypto today? Does the underlying tech have to evolve significantly first? What's the best we can do with today's technological constraints? The crypto users of tomorrow will have different motivations and expectations than the early adopters today. They won't put up with clunky, confusing, unreliable, unsafe and expensive systems. Great design—for wallets, exchanges, identity, dApps, marketplaces, DeFi and more—will be the bridge to help get us there. Everyone likes to say that in the future maybe crypto users won’t even know they’re using crypto; that the blockchain and complementary systems are just the technology powering everything behind the scenes. We can only get there if we design for trust and use that as a critical lens through which we analyze every aspect of the crypto experience today. Designing for trust So you might be thinking.. okay this is totally wrong and even the Bitcoin whitepaper established that cryptographic proof should be used instead of trust for decentralized systems. And that the ethos in the crypto community today is "Don't trust, Verify." Yea, that's all true. But what I'm talking about is one level up than the blockchain itself. I'm talking about the interfaces people interact with to do what they need to do, which may happen to be directly on or indirectly related to the blockchain. It's about elevating context and providing signals about their interactions so they can feel safer to make decisions about what actions to take and which actions to avoid. Public blockchains like those that power Bitcoin and Ethereum are permissionless. Lack of trust, centralized servers and third parties is a feature. They're entirely open networks where any participant or machine can see what's happening. While this leads to a level of trust with the ability for anyone to track and verify all transactions, that’s where the trust ends. As active web3 participants1 we regularly interact with dApps, smart contracts and more that we should not simply trust by default. But there’s also a person's trust of the blockchain itself. Ever had a transaction fail due to gas issues? Or new tokens you just sent to your wallet from your exchange not appear in a timely manner? Issues like this won't inspire much confidence in crypto for new users. A great crypto experience2 designed for trust will help you make an informed decision by elevating all the information you need, especially if that information comes from multiple places. I’ll dive into that more a bit later. Current state of crypto I'll be the first to admit that it's easy to sit here and write about how I think crypto experiences today could be improved, especially while largely ignoring technical feasibility and challenges. It's so early and it's not easy building such expansive and composable decentralized infrastructure.Unlike just about everything else we've come to expect with modern technology, popular blockchains like Ethereum are not instantaneous. In fact they're slow and worse, expensive.I mean if anything was possible, I don't think anyone would think that the best way to store all their valuable assets would be in a little Chrome extension that injects JS into a website where malicious actors could trigger phishing prompts. It's just the easiest way to quickly build things today.Lots of crypto experiences are built around existing constraints. As usage, utility and demand increases in the future, we'll be able to push on these constraints. What we can do today One of the reasons I'm so excited about web3 is that everything so desparately needs design help that almost any attention to detail anywhere in any common flow would be tremendously valued. It's like getting in on the ground floor of helping define key interactions in browsers, email clients and other core tools during the formation of Internet. You can design how people interact with anything related to the blockchain: wallets, exchanges, dApps and more. You could have a lasting impact in a ridiculously fast growing space. Crypto has been around for about a decade—long enough to prove there's something here and see growth but still nascent enough that there's plenty of things left to figure out, define and invent. How often do these opportunities come around? But I digress.. Today, we can get very familiar with the technical constraints of crypto systems and design for trust and clarity over all touchpoints of someone's journey. This article is in no way meant to be a complete overview of all design challenges in crypto. I wouldn't be able to write that; this is just meant to highlight a few areas that have been top of mind for me. There's several high-priority areas to explore starting when someone first hears about crypto to learning about how and where to use it but I'm most interested in these: Exchange experience & Onboarding As hundreds of millions of people interact with crypto for the first time, it's very likely that their first experience will be with a centralized exchange where they can exchange their local fiat currency for their first Bitcoin, Ethereum, stablecoin or other crypto asset. There's lots of responsibility and opportunity here to set new users up for success. Wallet experience For some, just holding crypto assets may be enough, but many will be drawn to all that web3 offers from various dApps to NFTs and more. A crypto wallet is the passport to web3 and making it clear how to set one up, become familiar with connecting to other services, dealing with transactions and more will be a key experience to get right. Web3 guidance & curation This is the discovery phase for slightly more advanced users that are now asking "What can I do with my crypto?" There are opportunities to help people discover what exists, what is safe to use and guide people along the way. It's 1998 and people rely on AOL or the Yahoo! homepage to show them what's out there. What's the curated search engine for crypto? There are a few projects in this space like Rabbithole.gg, Zapper.fi's Quests and Layer3.xyz, though I think most of them are a bit too complex or don't yet do a great job yet on educating behind why someone would want to do a certain task. Another interesting one is Context.app, helping with NFT discovery. I also think there's a huge opportunity around decentralized identity; I touch on that a bit in the next section. Exchange experience & Onboarding In the coming years, hundreds of millions of people will interact with cryptocurrency on-ramps—exchanges and similar services where they can receive their first cryptocurrencies and other crypto assets. For most people, this will be with a centralized exchange (CEX). Exchanges will be most people's first time truly interacting with crypto. Exchanges will need to simplify, educate and guide these new users every step of the way. Exchanges should explain the difference between different types of cryptocurrencies (including stablecoins), potential for volatility and potential for utility of each type. They should equip people with a basic understanding of security should they transfer their assets to a wallet outside the exchange. But before all that, there's a lot of opportunity to simplify the required KYC ("Know your customer") flows that require you to verify your identity. There's nothing easy about these flows as they require a tedious process of uploading photos of your id. Even small enhancements like integrated camera flows instead of requiring switching to the camera app, letting you easily resume onboarding if you're not in a place to do this yet (send me a reminder push notification in X hours) or letting you setup the rest of your account and upload your id when you can later would be welcomed. At some point these people may want to do something more than just buy or sell their crypto. Exchanges can educate around dedicated, non-custodial wallets. Even small things like transferring Ether to a new wallet can be daunting. Exchanges can also begin to set the expectation that outside the exchange, transactions are usually not instant and that depending on the service, sometimes require significant fees and time. I could go on and on. So much opportunity here. Wallet experience (Transactions) Wallets started out as only being responsible for managing and facilitating basic crypto asset transfers. Today they are responsible for a whole lot more. Modern wallets deal with showcasing NFTs, all sorts of tokens, dealing with complexities related to separate blockchains and Layer 2 assets, token swaps, connecting with dApps and more. Wallets are a frequent and primary touchpoint for interacting with countless web3 services, protocols, other wallets and more. Designing for trust inside the wallet is of prime importance. There are no gatekeepers with decentralized services; just a lot of entities you'll individually interact with. As such it’s important to make it clear exactly what’s happening each time you interact with another user, smart contract, dApp, et cetera. A core part of all wallets is a way to list transactions. Too many wallets today treat this as a list of data without much thought about what it means for the user and within the context of trust. Phantom Solana Wallet (Chrome extension) MetaMask Wallet (Chrome extension) Here are a few things I've been thinking about in regards to displaying transactions and assets: Be hyper transparent around transaction status. We expect things today to be instant but the blockchain is one of the only pieces of modern technology that can feel very slow at times. We need to take great care in displaying transaction status. The average user should never have to visit Etherscan/Polygonscan/etc just to see how much time is left with their transaction. There should never, ever be any doubt in their mind about what's happening to their money or transaction. A basic "sending/pending" state is not enough. Can you imagine not having a progress bar when you were downloading an mp3 on dialup in the '90s? Make errors actionable. One of the most frustrating things is when a transaction fails. It's annoying, sure, but with Ethereum transactions it also probably means you lost a lot of money in fees! Elevate as much of the error messaging and description as possible to the user. Suggest solutions the user can take if feasible, such as trying again but with more gas if that was the reason it failed. Show me how much money I just lost on gas with this failed transaction. Don't make me go to Etherscan to try to piece it all together; it can be rather confusing to discern on Etherscan with gas price, transaction fee, gas fee and gas usage, especially with EIP-1559. Show more context. Transaction data is far too cryptic today. Any way to add further context and humanize is needed. See if there's ways to display social proof. Who, what, where, when.. I received an NFT from an OpenSea contract, which I've used and trusted before. Or show that I swapped a token via Uniswap. Did I receive an NFT from a smart contract or another wallet? Show me a visual preview in the list of transactions, along with any indication of the other party (be it an OpenSea logo/name, or associated ENS name and avatar). This can be taken much further, but may be better suited for future solutions where your wallet may be paired with a robust knowledge graph. Inform and put the user in control. Letting a user select how much gas to pay for a transaction is not enough. What other context can be provided to help them make a decision? For example, if they are interacting with a smart contract to obtain an NFT and the contract has a ton of pending transactions, maybe the wallet could see how many NFTs are left by checking the contract's remaining supply, see how many pending transactions would be ahead of them and try to roughly estimate how much gas may be necessary before the NFT supply runs out. Or perhaps the wallet could see how many recent transactions with the smart contract with other wallets failed, potentially hinting that this contract should not to be trusted (like those scams where it tries to get people to visit a website) or has other issues. Create first-class experiences around speeding up a transaction. If I have multiple pending transactions with the same smart contract, show me how this affects the queue and the position of each. These may be contrived examples but the point remains. Approach this with a user focus, think about what people may need or want to know in the moment and try to bring it forward. Make transaction state global. Wallets today are not simple single-page apps. They often have multiple tabs or sheets, they could have various sheets and they can be closed or collapsed entirely. Most people will want to know the status of their pending transactions at all times, regardless of where they are in the wallet. Make it easy to see status from anywhere, including using actionable in-app toasts or browser/app push notifications when it makes sense. A simple analogy might be a macOS menubar app like Google Drive. At a glance I can see that it's busy syncing files or that it's all done and at rest. I don't have to go anywhere or do anything to see its state. Give me an "oh shit" undo/cancel button. It's all too easy to make a mistake. Scenarios like trying to ape into a new NFT drop unfortunately mean that speed is the only way to have a chance.. but speed also means you might not be taking the time to think through your actions. Did you accidentally approve a token on a contract you probably shouldn't have? Unfortunately, scenarios like this happen more often than they should. Wallets need an emergency resources in times like this. Perhaps modern wallets could have a sort of emergency "oh shit" button. A b'''
year_published = 2021
