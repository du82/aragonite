full_description = "PauseAI US Our proposal is simple: Don’t build powerful AI systems until we know how to keep them safe. Pause AI. Surveys of thousands of AI researchers estimate a 1 in 6 chance of human extinction from uncontrollable, superintelligent AI. Uncontrollable, superintelligent is exactly where we are headed if the AI industry gets its way. There are almost no guardrails into the development of frontier AI. AI companies are allowed to train models of any size, regardless of danger level. Some AI company CEOs have admitted there’s a chance their technology destroys humanity – but they’re willing to roll the dice anyway. Our proposal is simple: Don’t build powerful AI systems until we know how to keep them safe. Pause AI. We advocate government regulation of the chips that are necessary to train and run the most powerful AI, pausing training runs above a threshold of computing power, and international cooperation to ensure that no company or country builds unsafe AI (read the technical details of our proposal here). If we Pause AI, we can enjoy the benefits of the safe AI systems below the Pause threshold while we have the time to work to ensure that it’s safe to build even more powerful systems that could be even more beneficial. Your donations keep this work moving forward Join us in growing a grassroots movement to demand a pause on frontier AI development until it is safe to proceed. Make A Donation Take Action  We’re holding protests, social meetups, poster making parties, and handing out flyers. We’d love for you to join us. Get on our email list to get notified of what’s coming up and to join us for upcoming work to Pause AI! Stay Informed Success! First Name Email Your interests Your interests News & Events Protesting Volunteering Donating Subscribe Together We Can Pause AI Protesting The heart of PauseAI US’s programming is protesting. Even though a majority of Americans want to approach AI development cautiously, concentrated tech industry special interests who stand to profit from unfettered AI development are able to dominate the conversation if we don’t have a way to unite and show our strength. By showing up and being heard at protests, we can show the world that the people want to pause frontier AI development until it is safe. We usually protest against AGI development at the buildings of OpenAI, Anthropic, Meta, etc., although we also do supportive protests to encourage government regulation and cooperation that is on the right track, such as the AI Safety Summit Series and the UN Summit of the Future. Flyering We do Friday Flyering on the first Friday of the month as a sort of practice for protests. The stakes are lower, but we’re still getting out on the local streets sharing information and talking to the people in our communities about this important issue. This can be a great start for people who have never protested before. Drinks to follow 🙂 Social Hangouts Fun Times Thursdays are social hangouts, typically the third Thursday of the month, though they may double up with activism tasks like a sign-making party for the upcoming protest. Get Connected Join us online through social media and online chat spaces to connect with others in our grassroots movement: Join our Discord community Follow us on X (Twitter) RSVP for events on Facebook Sign up to get emails about news and events Pause AI Donate By donating to PauseAI US today, you support our efforts to bring about a global pause on frontier AI development. You help us connect grow the public voice and reach lawmakers who can help put the pause in place. And you make it possible to create more and larger protests, allowing us to reach more people to Pause AI. Donate Now About Us PauseAI US is a grassroots organization demanding a pause on frontier AI development until it is safe to proceed. We are a coalition of all types of Americans, of all political affiliations, all ages and backgrounds, from AI experts to AI novices, all belonging to the 70% of Americans who want to Pause AI. We make the voice of the people heard through protesting and lobbying. Subscribe for News & Events Success! First Name Email Your interests Your interests News & Events Protesting Volunteering Donating Sign Up Donate Contact Us Name Email Address Message Submit"
