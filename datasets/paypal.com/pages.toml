["https://paypal.com/us/cshelp/article/why-is-the-payment-i-sent-pending-or-unclaimed-can-i-cancel-it-help111"]
title = "Why is the payment I sent pending or unclaimed? Can I cancel it? | PayPal US"
description = "PayPal payments can be left unclaimed if the recipient lacks a verified account or needs to accept specific payments. Unclaimed payments can be canceled."
full_description = "If a payment you sent is pending or unclaimed, it means the recipient hasn’t received or hasn’t accepted the payment yet. The payment would be pending or unclaimed if it was sent to an email address or phone number that isn’t registered to a verified PayPal account. Check that you sent the payment to the correct email address or phone number. Or the recipient may need to set up a PayPal account or verify their account for the payment to complete. You have the option to cancel the payment. The payment would be pending or unclaimed if the recipient has opted not to automatically accept certain payments. These could be payments not in their preferred currency, or from buyers with unconfirmed addresses. You won't have the option to cancel the payment yourself. The recipient needs to accept or deny the payment within 30 days. We automatically cancel pending or unclaimed payments after 30 days and send the money back to the original payment method. Refunds to bank accounts may take up to 5 business days, while refunds to credit or debit cards may take up to 30 days. If you accept cookies, we’ll use them to improve and customize your experience and enable our partners to show you personalized PayPal ads when you visit other sites. Manage cookies and learn more"
year_published = 2025
