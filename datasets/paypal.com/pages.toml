 online with PayPal.4 Earn 5% cash back2 on your favorite monthly spending category with the PayPal Debit Card.1 Or get the PayPal Cashback Mastercard®9 to earn 3% cash back on PayPal purchases and 1.5% cash back on anything else where Mastercard is accepted. Plus, you can combine offers. Plus, roll your cash back into a high-yield PayPal Savings account to earn a current 4.00% APY.10"
