title = "How do I open a dispute with a seller? | PayPal US"
description = "To solve a problem with a PayPal purchase, contact the seller first. If that doesn't work, open a dispute within the correct dispute-filing timeframe. Escalate to a claim if needed."
full_description = "Contacting the seller is often the best way to solve a problem. You can find their contact details by going to your Activity and selecting the payment. They may be able to issue a refund or help with a return. In a Purchase Protection (Item Not Received or Significantly Not as Described) dispute, you can exchange messages with the other party in your Resolution Center to try to solve the problem. If you’re unable to settle the dispute, you can escalate it to a claim. To escalate a dispute, we often require that at least 7 days have passed since the payment date. By escalating a dispute to a claim, you’re asking PayPal to investigate and decide the outcome. A dispute will automatically close after 20 days unless it’s been escalated. Closed disputes cannot be reopened or escalated to a claim. If you accept cookies, we’ll use them to improve and customize your experience and enable our partners to show you personalized PayPal ads when you visit other sites. Manage cookies and learn more"
