["https://paypal.com/us/business/financial-services/business-loan"]
title = "Small Business Loan | SMB Loans | PayPal US"
description = "Apply for a PayPal business loan to help grow your small business. Check to see if you’re eligible today—there’s no impact on your credit score."
full_description = "Meet PayPal Business Loan, a fixed-term small business loan based on your overall business health. Loans range from $5,000 to $100,000 for first-time borrowers and up to $150,000 for repeat borrowers. If your application is approved, funds are transferred to your PayPal Business account as soon as the next business day.¹ Pay one competitively priced fixed fee you’ll know when you apply. No late fees, early repayment fees, or processing fees.² Choose a term that’s right for your business and repay automatically with predictable weekly payments. This is an invitation to apply and not an offer or commitment to provide capital. Applicants must satisfy certain requirements to be eligible.5 If approved, agree to the loan terms. The lender will then transfer funds to your PayPal Business account as fast as the next business day.6 [PayPal Business Loan] is automatic, I have a set amount automatically drafted out of the account for every payment, and I got to even choose the day.” You must complete a 5-10 minute online questionnaire to determine your business’s eligibility. Your application may take longer to complete if your identity cannot be automatically verified. Once the questionnaire is complete, estimated loan terms can be customized by adjusting the loan amount and duration to compare the costs of financing. Once you select your desired terms and complete your application, if approved, you will be prompted to electronically sign a contract including bank instructions so that payments can be debited weekly from your business checking account. If approved, funds are transferred as fast as the next business day (provided the application is approved by 5:00 PM ET on bank business days). Answering questions and evaluating different estimated loan terms will not affect your consumer credit score. Accepting an approved loan offer will trigger credit checks and other public record checks, which may impact your consumer credit score. PayPal Business Loan has weekly payments that are withdrawn from your business's bank account automatically. You provide account information and select your preferred payment day when you sign the loan contract. Automatic repayment will occur weekly on a day you choose. You won’t be able to adjust how often a payment is made."
