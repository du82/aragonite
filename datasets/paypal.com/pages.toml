["https://paypal.com/us/cshelp/article/why-is-my-paypal-debit-card-being-declined-help416"]
title = "Why is my PayPal Debit Card being declined? | PayPal US"
description = "You can manage your Card by selecting your PayPal Debit Card on your Dashboard and clicking Manage."
full_description = "Your PayPal Debit Card may be declined for various reasons. You can manage your Card by selecting your PayPal Debit Card on your Dashboard and clicking Manage. 1. You have money in your PayPal balance – The PayPal Debit Card allows you to access the money available in your PayPal balance. If the payment declines and you don't have money in your PayPal account, try adding money from your bank, let it process, and try the payment again. Don’t have money in your balance? Here are some ways you can add money to your PayPal balance to use your PayPal Debit Card: If you're withdrawing money at an ATM using your PayPal Debit Card, please make sure you have enough money in your PayPal balance to cover any fees. Please review the PayPal Debit Card Cardholder Agreement for fees. 3. Your card details are current – Make sure the card isn't expired or closed, and the billing address on your PayPal account matches what you're entering.If your card status is showing expired or closed, don't worry. o If the card status is showing expired and you have a physical PayPal Debit Card, a new card should be in the mail and delivered to the address on file. o If the card status is showing expired and you only have a digital version of the PayPal Debit Card, your digital card will automatically be reissued with a new expiration date. o If the card status is showing closed, you can request a new card by visiting www.paypal.com/debitcard. 4. Your PIN is incorrect – If you don't remember your PIN, you can reset it in your account. Here's how: 5. The transaction amount is over your daily spending limit – The standard daily spending limit for purchases is $3,000.00 USD. There is also a daily ATM withdrawal limit of $400 USD, and a daily over-the-counter withdrawal limit of $5,000 USD. The PayPal Debit Mastercard® is issued by The Bancorp Bank, N.A. (“Bancorp”) pursuant to a license by Mastercard International Incorporated and may be used everywhere Mastercard is accepted. Mastercard and the circles design are registered trademarks of Mastercard International Incorporated. Bancorp is issuer of the Card only and not responsible for the associated accounts or other products, services, or offers from PayPal."
