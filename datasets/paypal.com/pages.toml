["https://www.paypal.com/us/legalhub/paypal/privacy-states"]
title = "California, North Dakota, and Vermont Supplemental Financial Privacy Notice"
description = "California, North Dakota, and Vermont Supplemental Financial Privacy Notice"
full_description = "We may share certain types of nonpublic personal information with unaffiliated third parties (our Partners and Merchants) in order to personalize services and offers so you can have a better and more relevant experience. If you are a resident of California, Vermont, or North Dakota, we need to first obtain your consent before we share your nonpublic personal information for this purpose and to allow you to benefit from this service. This Supplemental Privacy Notice provides additional information about this data sharing and how you can consent to such sharing. Terms used herein and which are not otherwise defined are defined in the PayPal Privacy Statement or under applicable data protection laws. With your consent, we may disclose to Partners and Merchants nonpublic personal information, such as products, sizes, preferences, and styles we think you’ll like. Such disclosures are made in order to develop product recommendations that we share with Partners and Merchants to help improve your shopping experience and help make it more convenient and personalized for you. Please note, as described in our PayPal Privacy Statement, we may share your nonpublic personal information without your consent when it is necessary for us to protect our customers from risk and fraud and to comply with legal obligations, in accordance with applicable law. If you would like to consent to share your nonpublic personal information with Partners and Merchants for personalized shopping experiences as described in this Supplemental Financial Privacy Notice, adjust your privacy preference settings in the Data and Privacy Center to electronically consent to sharing. If you provide consent, it will remain in effect until you revoke or modify it, which you can do at any time. To revoke or modify your consent, which you can do at any time, log into your PayPal account and edit your preferences in the Data and Privacy setting. We will maintain a true and correct copy of your consent, including a record of the time and date you adjust your setting. You are entitled to a copy of this consent upon request by calling PayPal Customer Service at 1-888-221-1161. You may want to make a copy of this consent for your records."
