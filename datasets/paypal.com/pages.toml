title = "PayPal Payouts | Send Mass Payments | PayPal US"
description = "PayPal Payouts lets you send mass payments quickly and easily via Payouts API, Payouts Web, and more. You can even send payouts in multiple currencies."
full_description = "All you need is an email, mobile number, PayPal ID, or Venmo handle for each recipient. Set up payments with Payouts API, use Payouts Web, or manually upload a file via SFTP. Just add or convert funds in your balance to the currency for the payout. When you pay in USD, CAD, AUD, EUR, MXN, and GBP, we’ll automatically do the conversion. Review and track each PayPal Payout transaction from a single dashboard. Plus, view your entire mass payment history and download transaction details. We charge you a fee for each payment you send that’s based on the type of payout and currency in which it is sent. Payout recipients pay no fee. Fees are subject to change. You’ll need a PayPal Business account that’s linked to a bank. Then, you’ll need to request access to PayPal Payouts. Request access now. There’s no limit on the total amount of the payout. The maximum individual payment to an existing PayPal or Venmo account holder is $60,000.00 USD or its equivalent in local currency (the limit is $20,000.00 USD for new PayPal or Venmo account holders). Payouts are funded using your PayPal balance, so be sure to add enough to cover your payout total, including fees. Payouts are supported in over 156 countries in over 23 currencies. Note that currency restrictions do not allow conversion of Argentine Pesos, Brazilian Real, or Malaysian Ringgit. PayPal currency conversion rates apply should the sender or the recipient choose to convert the payments. Read more about features supported by country. You can use their email or mobile number to set up the payment. We’ll notify the recipient with a link to claim their money. If they don’t have an account with PayPal or Venmo, we’ve made it really easy for them to set one up. PayPal Payouts Advanced, our enterprise-scale solution that’s powered by Hyperwallet, may be the right fit for your business. Learn more about PayPal Payouts Advanced. Every business needs a reliable partner. From secure payment processing to helpful business insights, we’re here for you."
