["https://paypal.com/us/brc/article/build-trust-reduce-friction"]
title = "Reduce Friction & Improve the Customer Experience Journey | PayPal US"
description = "Learn how to discover obstacles in your customers' digital journey and how to design better customer experiences from the CEO of Experience Investigators."
full_description = "Think about the word friction. What does that mean to you? For your customers, friction means not getting what they need, when they need it, in a seamless and pleasant way. Friction points along your customer’s journey slow them down and chip away at the overall experience. Friction creates an interruption, or worse, an exit in the customer’s journey. The goal of business leaders today should be to reduce friction by designing proactive, positive customer experiences. The only way to do that is to understand where these points may occur and do your best to provide a journey that supports customers, reduces their effort and provides seamless ways for them to get to the next destination. And while most customer journeys are digital journeys today, it’s important to remember the way customers interact digitally is simply part of an overall experience. Customers buy tickets for experiences online, then attend the concert in person. They might purchase a product online, then receive it at their home, and then go back to the digital channel to provide a customer review. The digital experience IS the customer experience. Have you considered the pain points along your customer’s journey? How do you know where to find them? Here is one way to discover the obstacles in your customer’s digital journey and how to design better experiences. Collecting customer feedback is a fairly common practice now. Measuring the feedback with metrics like Net Promoter Score (NPS) or Customer Satisfaction Rates (CSAT) helps show patterns and identify where the journey requires improvement. For example, customers may be asked to participate in a one-question survey at the end of a specific transaction, like a customer service call. By tracking the overall CSAT rates, leaders may identify where friction lies within the journey. It’s important for leaders to review these metrics with an eye towards action. What can be done to improve the overall experience for the customer? Leaders who ask that question and track CX metrics will likely find areas where the customer experience is slow, clunky or just not very delightful. Fixing those moments can help reduce friction."
year_published = 2025
clearnet = "https://paypal.com/us/brc/article/build-trust-reduce-friction"
