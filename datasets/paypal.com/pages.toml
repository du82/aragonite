["https://paypal.com/us/cshelp/article/what%E2%80%99s-an-order-and-why-is-it-pending-help151"]
title = "What’s an Order and why is it pending? | PayPal US"
description = "An order is an agreement between a buyer and seller, authorizing PayPal to debit the buyer's account. Pending status means seller hasn't collected payment yet."
full_description = '''An order is an agreement between a buyer and a seller. It authorizes a seller to debit a buyer's PayPal account for their purchase. A "Pending" order status means that the seller received your order but hasn’t collected your payment yet. Once you place an order, your account will show a “Pending” authorization until the seller captures your payment. Once a seller processes your order, they capture the payment and charge your account. The payment will show as “Complete” and the seller then sends the item. Sellers will often complete the order within a few days. Most sellers will complete for goods payments when they’re ready to ship your item. For services, rentals, or hotel stays, sellers will complete the payment once they’ve fully delivered your purchased service. An order status can display as pending for up to 30 days. That is until it’s expired, completed, or the seller voids it. If you accept cookies, we’ll use them to improve and customize your experience and enable our partners to show you personalized PayPal ads when you visit other sites. Manage cookies and learn more'''
year_published = 2025
