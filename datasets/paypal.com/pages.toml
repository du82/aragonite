["https://paypal.com/us/digital-wallet/manage-money/direct-deposit"]
title = "Set Up Direct Deposit | Direct Deposit App | PayPal US"
description = "Set up direct deposit and get your paycheck transferred straight to your PayPal account. Find out how we can help you get your money faster on payday."
full_description = "Get your paycheck up to 2 days early.1 With Direct Deposit, it’s sent automatically to your PayPal balance.2 Use the money to send, spend, or pay bills. It’s up to you. Paychecks, government payments, and more. Decide if you want all or just part of it in your PayPal balance. We’ll walk you through the steps. It’s easier than you think. You can find all the details in the PayPal app. The PayPal Debit Card3 gives you instant access to your PayPal balance. Use it anywhere Mastercard® is accepted. Plus, get 5% cash back on eligible purchases in a monthly category of your choice.4 Or use your balance to send money5 or get a head start on your bills. Once processed, your Direct Deposit will begin within two pay cycles. We’ll notify you each time your money comes in. Direct Deposit enables you to receive a portion or all of your paycheck or government payment automatically into your PayPal balance. If you enroll in Direct Deposit with PayPal, money lands directly in your PayPal Balance account. This avoids the need for physical deposits either by standing in line at a bank or by depositing a physical check. Some of the primary benefits are that money moves seamlessly from Payer to Payee, there are no limits, no fees, and it’s free to set up with PayPal, and it’s economical for employers and eco-friendly by avoiding printing physical checks. You can easily access your money in your PayPal balance. Use the money to shop and send money5 directly from your PayPal balance. Pay anywhere Mastercard® is accepted with the PayPal Debit Card.3 Money transferred via Direct Deposit is generally available on the day that the funds are applied to your account. It can be 2 days in advance or the same day, depending on the type of funds coming in. We don’t receive money via Direct Deposit instantly; there’s some delay between the payment being initiated by the Payer and it arriving to PayPal. It’s your do-it-all digital wallet. Load up on cash back offers before you shop. Track your packages. And manage it all on the go."
