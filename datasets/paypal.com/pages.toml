title = "Learn about how PayPal protects you | PayPal Privacy Center | PayPal US"
description = "Curious about PayPal privacy? Discover how your data is protected, and learn how we protect your financial information in our privacy center."
full_description = "Your trust is important to us, so we want you to know how we collect, use, and protect your personal information. For examples of when, how, and why your personal information is used, learn more about our privacy practices. We use your name, email, and shipping address to help you make payments and purchases easily, and we don’t share your full financial information. We use your online shopping activity and purchase history to tell you about products we think you’ll like. We use your data to update you on your PayPal activity and, if you’re subscribed to news and promotions, we’ll send info about other offers and services. We use your data to help prevent fraudulent use of your account, meet anti-money laundering requirements, and help keep you and the PayPal community safe. Keep track of your privacy settings and permissions, update your personal and financial information, download a copy of your data from the app or online, and more in your data and privacy settings. Subscribe to or opt out of our marketing emails, choose how you want to get updates about your payments, and more in your notifications settings. You can access, correct, delete, or restrict our use of certain information we’ve collected while you used our services. If you used Fastlane by PayPal to check out on a merchant’s site, you can log in to Fastlane to access, change, or request deletion of your data. If you have an account with Xoom, you can manage your communication preferences in your account settings. You can request a copy, change, or deletion of your data by contacting Xoom customer service. If you closed your account, checked out as a guest, or paid a merchant who uses PayPal to process payments, you can use the privacy portal to request a copy of your data. Personal information is data such as name, business name, address, phone number, email, IP address, device information, information collected from cookies or other tracking technologies, and other information necessary to establish an account or profile."
