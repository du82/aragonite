full_description = "Discover cash back offers1 from top brands in the app and check out with PayPal. Get 5% cash back on offers in your PayPal Debit Card monthly category.2,3 Or use the PayPal Cashback Mastercard® to earn 3% cash back on top of your offers.4 Get 1%, 2%, 5% cash back1 from top brands. We’ll apply your offers when you check out with PayPal. And we’ll let you know when they’re ready to redeem. Choose your PayPal Debit Card monthly category—gas, groceries, and more—then get 5% cash back when you shop it.3 Spend anywhere Mastercard is accepted.2 Earn 3% back on your PayPal purchases.4 And 1.5% back on other purchases. Use the PayPal Cashback Mastercard anywhere Mastercard is accepted. No annual fee.5 No impact to your credit score if you're declined.6 Use points towards your next purchase.1 Redeem them for cash into your PayPal balance.7 Donate them. Or roll the cash back into a PayPal Savings account.8 Find offers from top brands. Track your PayPal Rewards points. Redeem when you’re ready. Do it all in one smart place: the PayPal app. There is no separate PayPal Rewards enrollment process. You only need an account with PayPal to start earning rewards. You can check your account to track and manage your PayPal Rewards anytime. You can use multiple offers at the same time when paying with PayPal. Use the PayPal app to find cash back offers. We'll automatically apply them when you check out. While you don't need the app to earn PayPal Rewards, it's the best way to find and maximize your cash back, manage your rewards activity, and redeem cash back when you're ready. Redeem your Rewards points for cash and other options. You can use the cash back you earn when you make eligible purchases with PayPal checkout. You can transfer cash back to your PayPal Savings account and earn a current 4.00% APY.8 Or, transfer it to your PayPal Balance, and more. Yes, you can maximize your rewards with PayPal. Link and use your eligible credit card to automatically earn your