["https://paypal.com/us/digital-wallet/manage-money/add-cash"]
title = "Add Cash | Online, In-store, or Direct Deposit | PayPal US"
description = "Add cash to your PayPal account and turn dollar bills into digital currency. Just deposit money to your account, shop, and be on your way."
full_description = "Add money to your PayPal balance your way. Set up Direct Deposit.1 Get paid back by friends. Transfer from your bank. Or add cash in stores.2 Paychecks, government payments, and more. You decide if you want the entire amount or just part of it automatically put in your balance. Split a bill. Collect rent from your roomies. Get paid back for dinner. Then get instant access to the money in your PayPal Balance account. It’s as easy as sending a money request with PayPal. Automatically add money to your PayPal balance from your linked bank account or debit card. That way, you’ll have enough balance to cover your purchases. When money hits your PayPal balance, you get instant access to it. Shop online. Use your PayPal Debit Card4 anywhere Mastercard® is accepted. Pay bills. Start a PayPal Savings5 account. Donate and more. To add cash to your PayPal balance, go to your Accounts in the PayPal app while you're at the store. Then, select Add Cash. Select the store you're in, get a barcode, and show it to the cashier at checkout. Your money will be added to your balance, usually in minutes. If you have a PayPal Debit Card, you can use it to add cash to your PayPal Balance account without generating a barcode. Provide the cash you want to add at the register and swipe your card or hand it to the cashier to swipe. The limit for adding money is $1,500.00 USD per day and $5,000.00 USD per month. The number of transactions is limited to 4 per day, 7 per week, and 20 per month. If you've reached these limits, you won't be able to add cash until the limits reset. You can add cash to your PayPal Balance account at 90,000+ locations around the US. Some retailers include Rite Aid, CVS Pharmacy, GameStop, Walmart, Dollar General, and Family Dollar. It’s your do-it-all digital wallet. Load up on cash back offers before you shop. Track your packages. And manage it all on the go."
