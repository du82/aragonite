title = "How PayPal helps sellers process and accept credit card payments | PayPal US"
description = "Find out how PayPal helps sellers to accept and process secure credit card payments for their customers."
full_description = "PayPal facilitates online payments for hundreds of thousands of e-commerce ventures, as well as traditional brick-and-mortar companies with an online presence. It allows businesses to provide secure payment options for their customers and accept credit card payments. Explore why you should use or pay with PayPal, and how it can work for you. If you sell goods online, you've probably heard of PayPal. PayPal is a payment service provider that takes care of the whole transaction from end to end. We offer an online payment processing service that enables you to accept bank, debit, or credit card payments for the items you sell. When a customer pays for their purchase, we process the payment and transfer the funds to your PayPal account. When you accept credit card payments with PayPal, you unlock the ability to reach more customers and grow your revenue. This can be especially helpful for new businesses looking to convert first-time customers. Consider: Nielsen found a 74% increase in the likelihood of shoppers completing a purchase from an unknown merchant when PayPal is present at checkout.1 PayPal has security measures in place to help keep your business safe when buyers shop with you online. For example, PayPal uses fraud detection technology built on the data of over 1 billion monthly transactions, at no additional fee. PayPal also offers chargeback protection for eligible transactions and dispute resolution services. Read on to learn how credit card processing works with PayPal so you can see how it can work for your business, too. Any business can set up online payment processing, making it safe and easy for customers to shop with you. To do so with PayPal, you’ll first create a merchant account and then link that account to your payment form. PayPal makes it easy for you to set up your PayPal merchant account— and unlike with other service providers, you won’t need to create a dedicated bank account. This is where you collect your money from your sales. With this account, PayPal can accept payments from customers on your behalf and then deposit the money into your business merchant account."
