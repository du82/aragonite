["https://paypal.com/us/brc/article/fraud-detection-powered-by-machine-learning"]
title = "Machine Learning Fraud Detection Technologies | PayPal US"
description = "In this article, learn what machine learning fraud detection technologies, like those used by PayPal, are and how they help protect your company’s assets."
full_description = "Machine learning is quickly becoming key for payment fraud detection strategies of large enterprises. By 2027, e-commerce will make up close to a quarter of total global retail sales.1 This digital transformation gives your customers the ability to pay for products when, how, and where they want. It could also expose your business to a greater risk of fraud. In one survey, 42% of respondents said their organizations are much more vulnerable to an online fraud attack due to digital transformation.2 Customers may also be concerned. One study revealed that two-thirds of consumers would switch providers due to fraud.3 This has accelerated the race to better protect customer data — and in the world of payment fraud detection, machine learning and other automated solutions have emerged as critical tools for the digital transformation. Understanding how artificial intelligence (AI) and machine learning algorithms for payment fraud detection can help you detect fraud and unlock operational efficiencies is the first step to improving your customers’ comfort levels and driving revenue. AI is a general term that refers to a computer system’s ability to mimic human cognitive functions like learning and problem-solving. It relies on math and logic to learn from new information and make informed decisions based on that information. Machine learning is a subset of AI that uses algorithms to scan vast amounts of data for patterns and insights. It then applies that learning to make increasingly better decisions. It enables programmers to improve the perception, cognition, and decision-making power of a computer system. In our day-to-day lives, AI and machine learning help us do everything from detecting email spam to anticipating traffic on our commutes. In the context of e-commerce, machine learning is a type of AI that businesses can use for payment fraud detection. There are also various subtypes within payment fraud detection machine learning. While all machine learning models help businesses in the fight against fraud, some models are especially helpful."
year_published = 2025
