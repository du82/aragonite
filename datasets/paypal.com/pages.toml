["https://paypal.com/us/cshelp/article/why-was-my-payment-sent-as-an-echeck-and-why-is-it-pending-help285"]
title = "Why was my payment sent as an eCheck and why is it pending? | PayPal US"
description = "eCheck on PayPal is a secure payment option that takes up to 7 days to clear, minimizing payment risks and used when PayPal limits other payment options."
full_description = "An eCheck is an electronic funds transfer from your bank account to another customer’s PayPal account. It usually takes between 4-7 business days to clear, but sometimes it may take longer (Saturday, Sunday, and Holidays aren’t considered business days). To manage risk, PayPal may limit the payment methods available for a transaction. This can happen for a variety of reasons: We put security measures in place to review transactions before they’re sent out to protect all parties involved. The payment may show as “pending” in your PayPal account. To view your payment status and the expected clearing date, visit your Activity and click on the transaction. If there’s insufficient money in your bank account or your bank declines the transaction when we attempt to complete the eCheck payment, we’ll try again within 3 business days. If the payment is declined a second time, we’ll cancel it. Remember, your bank may charge a fee for declined payments. If you accept cookies, we’ll use them to improve and customize your experience and enable our partners to show you personalized PayPal ads when you visit other sites. Manage cookies and learn more"
year_published = 2025
