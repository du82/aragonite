["https://paypal.com/us/brc/article/signs-of-unusual-business-account-activity"]
title = "13 Signs of Fraudulent Activity to Look Out For | PayPal US"
description = "What are the most common signs of fraud? Learn the 13 signs of potential fraud orders to mitigate risk as a seller and spot unusual buyer activity."
full_description = "Fraud can cost a business time and money — that’s why it pays to be vigilant of unusual account activity, where fraud could be lurking. Here are some telltale signs of unusual buyer activity that may suggest fraudulent intent. If you see any of the 13 signs of fraud below, you may need to take a closer look. And if you haven’t already, make sure to look at the steps to help prevent fraudulent payments. As a business owner, it’s essential to stay vigilant in detecting and preventing fraud. Some of the biggest warning signs of fraud include larger than normal orders, mismatched billing and shipping addresses, and suspicious email addresses. Read on for all 13 signs, and bookmark this list for easy access when analyzing your orders and payments. Are you seeing an abnormal number of payments from an unusual or unexpected location? While cross-border commerce is growing rapidly, and there are benefits to accessing a global market, some countries have gained a reputation for fraud. Payments from these countries may require closer scrutiny. Be cautious if you receive an order from a new customer that’s larger than your average order size, especially if it’s for a product that’s in high demand, such as electronics. For example, you receive more than 50 orders from customers outside the U.S. within a few days, when you normally receive only two international orders within a month. For example, a customer orders 50 pairs of the same shoe in various sizes. Ask yourself if it makes sense for a customer to order several of the same product. Just because a customer ships the order to another address, it doesn’t automatically indicate fraud, but a legitimate customer is more likely to ship orders to their billing address. Look at all the order details to see if anything else appears unusual. Make sure their address change makes sense. Fraudsters originally enter valid addresses so your fraud systems don’t catch them. Then, they contact you to change the address. Tip: For PayPal merchants, keep in mind that if you decide to ship to another address, the purchase will no longer qualify for PayPal Seller Protection."
year_published = 2025
