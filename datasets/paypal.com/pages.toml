["https://paypal.com/us/brc/article/how-claims-work"]
title = "Understanding disputes, claims, and chargebacks: a guide for SMBs | PayPal US"
description = "Learn the differences between disputes, claims, and chargebacks to protect your small business. Understand how to handle customer disputes effectively."
full_description = "From a simple misunderstanding to a human error, many businesses experience a customer dispute or complaint every so often. It can happen to a business of any size and in any industry. Whether the customer claims their item was not received, or they declare the transaction was unauthorized or fraudulent, customer disputes are an inevitable part of running a business. Instead of worrying about when you may face your next customer dispute, take a proactive approach by understanding the different types of credit card disputes merchants can be faced with, including claims, chargebacks, and bank reversals. Plus, get helpful tips and strategies to manage and prevent them. A dispute occurs when a customer challenges a charge that they believe is erroneous. The customer might believe that the transaction was fraudulent, that there was a billing mistake, or that they were charged for goods or services that were not delivered or were not as described. During the dispute process, the customer can ask the credit card issuer to investigate the charge and potentially reverse it. The merchant will also have a chance to respond to the dispute and provide evidence that the charge was legitimate. During the dispute process, the customer and the merchant typically communicate directly with each other to resolve the issue in a fair and mutually beneficial way. The payment process can be involved, however. The goal of the dispute process is to address issues before they escalate into a claim. It’s worthwhile for merchants to work with their customers to resolve disputes as it allows them to provide excellent customer service, solve the problem, and prevent it from worsening. It also helps businesses create loyal, long-term customer relationships and avoid negative reviews and potential legal issues. Here’s an example. Say a customer purchases a rug from an online store. Upon receiving it, they notice a large stain along the left side. The customer contacts the company to request a refund or a replacement product. However, the company does not believe the product is damaged and refuses to provide a refund or replacement. Because the customer and the merchant cannot come to an agreement, the issue may be escalated to a claim."
year_published = 2025
