["https://paypal.com/us/cshelp/article/what-is-the-paypal-debit-card-and-how-do-i-get-one-help669"]
title = "What is the PayPal Debit Card and how do I get one? | PayPal US"
description = "To request a PayPal Debit Card online, click Request Your Card on the PayPal Debit Card page, and follow the instructions. No credit check is needed since this is not a credit card."
full_description = "The PayPal Debit Card allows you to pay with your PayPal balance everywhere Mastercard® is accepted. You can earn 5% cash back each month when you use the PayPal Debit Card to make purchases in your chosen category – gas, groceries, clothing, health & beauty, or restaurants*. You’ll get a digital card instantly and you can shop with it right away. You can request a physical card in the PayPal app at no cost. Shop more places. Earn more rewards. You can add your card to your smartphone’s mobile wallet, like Apple Pay, Google Pay, or Samsung Pay, for contactless (tap-to-pay) payments. There are no fees to own or pay with the PayPal Debit Card in stores or online within the US, or when you withdraw at US MoneyPass® ATMs. Both the ATM surcharge and PayPal fees are waived. Learn more about transactions that have fees. Apple Pay is a service provided by Apple Payments Services LLC, a subsidiary of Apple Inc. Neither Apple Inc. nor Apple Payments Services LLC is a bank. Any card used in Apple Pay is offered by the card issuer. The PayPal Debit Mastercard® is issued by The Bancorp Bank, N.A. (“Bancorp”) pursuant to a license by Mastercard International Incorporated and may be used everywhere Mastercard is accepted. Mastercard and the circles design are registered trademarks of Mastercard International Incorporated. Bancorp is issuer of the Card only and not responsible for the associated accounts or other products, services, or offers from PayPal. PayPal is a financial technology company, not a bank. The Card is linked to your PayPal Balance account. See PayPal Balance Terms and Conditions. *5% cash back earned on up to $1000 of spending per month. Cash back awarded as points that can be redeemed for cash or other options. Terms apply. ATMs must display the Mastercard®, Cirrus®, Pulse® or MoneyPass® acceptable marks. Up to $400.00 USD daily withdrawal limit applies. Transactions at non-MoneyPass ATMs have a $2.50 ATM Domestic and International Withdrawal Fee. No fee for MoneyPass ATM Withdrawals in the U.S. International Transaction Fee applies for International ATM Withdrawals. ATM operator fees may also apply. See Cardholder Agreement for details."
