["https://paypal.com/us/cshelp/article/what-can-i-do-if-i-sent-a-payment-to-the-wrong-person-help175"]
title = "What can I do if I sent a payment to the wrong person? | PayPal US"
description = "To cancel a payment or initiate a refund on PayPal, follow the steps in your Activity or the Resolution Center if you've sent money to the wrong person."
full_description = '''If you sent a payment to the wrong person and the payment status shows as unclaimed, you can cancel it. Go to your Activity, find the payment, and click Cancel. If the payment status is 'completed', ask the recipient to refund you. Go to your Activity and select the payment you want refunded. Use the contact details to get in touch with the recipient and request a refund. You can also use the Chat option within the transaction to contact the recipient. If you don’t hear back from the recipient and the payment was sent as Goods and Services, you can open a dispute within the correct dispute-filing timeframe. However, you can't report a problem for payments sent as "Family and Friends". We encourage you to continue working with the recipient for a refund. If you accept cookies, we’ll use them to improve and customize your experience and enable our partners to show you personalized PayPal ads when you visit other sites. Manage cookies and learn more'''
