["https://paypal.com/legalhub/cookie-full"]
title = "Statement on Cookies and Tracking Technologies"
description = "Statement on Cookies and Tracking Technologies"
full_description = "This page is designed to help you learn more about our use of cookie and tracking technologies. This policy applies to any PayPal service that is linked to this Statement or incorporates it by reference. When you visit or interact with our sites, services, applications, tools or messages, we or our authorized service providers and third parties may use cookies, web beacons, and other similar technologies. These technologies allow our sites, services, applications, and tools to store relevant information in your browser or device. Our authorized service providers and third parties may place cookies on your device via our services. Cookies – Are small text files (typically made up of letters and numbers) placed in the memory of your browser or device when you visit a website or view a message. Cookies allow a website to recognize a particular device or browser. There are several types of cookies: Web beacons – Small graphic images (also known as “pixel tags” or “clear GIFs”) that may be included on our sites, services, applications, messaging, and tools, that typically work in conjunction with cookies to identify our users and user behavior. Similar technologies – Technologies that store information in your browser or device utilizing local shared objects or local storage and other web application software methods. These technologies can operate across all of your browsers, and in some instances may not be fully managed by your browser and may require management directly through your installed applications or device. We do not use these technologies for storing information to target advertising to you on or off our sites. We may use the terms “cookies” or “similar technologies” interchangeably in our policies to refer to all technologies that we may use to store data in your browser or device or that collect information or help us identify you in the manner described above. Depending on where you are located, we may require your consent for personal information that we collect, store, and share through use of these technologies for categories 2 through 4, obtained through a conspicuous disclosure on our website during your first visit. You can withdraw this consent through your browser settings as explained below."
