title = "PayPal Security | Protect Your Financial Data | PayPal US"
description = "Your data and money are safe. It doesn't matter if you're a shopper or a seller; PayPal security protects you against fraud with our secure encryption."
full_description = "Protecting your financial data, payments, and eligible purchases1 is what we do. Get smart security and added peace of mind when you shop and pay with PayPal. We monitor activity and transactions across PayPal and tens of millions of merchant sites globally to help protect your account and keep your data secure.2 Pay it safe across the table or globe knowing we help you spot scammers and report suspicious money requests.1 Safely shop at sites around the world and track orders straight to your doorstep. If you don't receive the item you ordered, or it shows up significantly different than described, we’ll help you get reimbursed for eligible items with PayPal Purchase Protection. Terms and limitations apply.1 Stay one step ahead of scammers with real-time early fraud alerts.2 We monitor tens of millions of merchant sites in our network to detect early signs of card fraud—often before a costly transaction occurs—and will immediately notify you if we suspect your card info may be compromised.4 Every payment is encrypted to help keep your financial details secure. If something doesn't seem right with a payment request, just block, decline, and report it in one click. Protect eligible payments1 when you send money via Goods and Services at no cost to you.3 We use the latest authentication methods and fraud and risk tools to streamline your login experience and help keep you safe. Sign in the smart way with passkey, a phishing-resistant technology that's easy to use and more secure than passwords.5 No. Any eligible debit or credit card you add to PayPal will automatically receive early fraud monitoring and real-time alerts about unusual activity we’ve detected or blocked. Use the PayPal app and enable push notifications to get real-time app notifications and review alert details right away. Learn more about early fraud alerts. Passkeys are a new secure login standard, which allows you to securely log in to PayPal without entering a password. They allow you to log in to PayPal using the same biometrics or device password you use to unlock your device. Learn more about passkeys."
