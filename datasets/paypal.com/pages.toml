["https://paypal.com/us/cshelp/article/where-is-my-refund-help130"]
title = "Where is my refund? | PayPal US"
description = "PayPal refunds original payment method. Credit cards take 1-2 cycles, debit cards take 5 days, and same day for PayPal. Check refund status on PayPal."
full_description = "We send all refunds back to your original payment method. The time it takes to receive your money varies by payment method. In some cases, refunds go to your balance account in case we are unable to credit your original payment method or when you choose balance as the destination. Within the Activity log, you will find the Refund Tracker. The Refund Tracker is a three-step tracker for your complete checkout transaction refunds funded by banks or cards (full-amount refunds that are not split between payment methods). The tracker consists of three steps, and each step has a specific meaning. When you pay with a credit card, a refund usually takes between 1 and 2 billing cycles*, depending on the card issuer.* A credit card billing cycle typically lasts 28 to 31 days. The number of days in each cycle can change, but it should be roughly one month. We’ll still send a refund to a canceled or prepaid card. Contact your card issuing company to access this money. For checkout transactions, you may use the bank reference ID shown under Activity for tracking refunds with your card issuer. When you pay with your debit card, it will generally take up to 5 business days for your refund to be completed, however, depending on your card company, some refunds may take up to 30 days. For checkout transactions, you may use the bank reference ID shown under Activity for tracking refunds with your bank. When you pay with your bank account, we’ll automatically transfer the refund to your bank account. Once issued, refunds usually take up to 5 business days to complete. Some refunds may take up to thirty days, depending on the status of the payment at the time the refund was issued. When you pay with your balance and credit card, the refund will go to your PayPal balance and credit card. Once issued, the refund will go to your balance on the same day. The refund to the card can take between 1-2 billing cycles*, depending on the card issuer.* A credit card billing cycle typically lasts 28 to 31 days. The number of days in each cycle can change, but it should be roughly one month."
year_published = 2025
