description = "PC Gamer is your source for exclusive reviews, demos, updates and news on all your favorite PC gaming franchises."
full_description = "Apparently the canceled Twisted Metal game would have been a battle royale where you could get out of your car for some reason Jody Macgregor published 2 March 25 News Twisted Metal battle royale does make sense. Today's Wordle answer for Sunday, March 2 Kerry Brunskill published 2 March 25 regular riddle Help with solving Sunday's puzzle. Steam Next Fest's most-played demo is a game almost everybody hates Jody Macgregor published 2 March 25 News Mecha Break can't catch a break. Wait a minute, Geralt of Rivia actor Doug Cockle was in Baldur's Gate 3 this whole time Ted Litchfield published 1 March 25 news Really playing against type for this one. Monster Hunter Wilds live launch coverage: Server status, hunting tips, and all the latest release day news Wes Fenlon last updated 1 March 25 Hunt begins Join us on the hunt for monster trivia, amazing player antics, and all sorts of news on Monster Hunter's first-ever day-one launch on PC. Avowed's rarest ending has only been seen by 0.2% of players and demands you make the correct choice at every major quest to not get your head chopped off Ted Litchfield published 1 March 25 news Oh, and all your companions leave because they hate you. Runescape is finally wrapping up one of its earliest storylines, 24 years after the first quest debuted Mollie Taylor published 1 March 25 news The Return to the Desert Trilogy. It turns out you can get Baldur's Gate 3's best assassin armor without killing a baby angel elephant and joining a cult, all you have to do is pickpocket a ghost Ted Litchfield published 1 March 25 news Sicko buildcrafting optimization without sicko moral choices. Paleontologist says Monster Hunter's monsters are 'a little' realistic, but if a lizard swallowed something that big it would have to sleep for a month Evan Lahti published 1 March 25 News Paleontologist and monster expert Dr. Darren Naish takes a deep dive into the creatures of Monster Hunter, rating their biological plausibility and exploring their real-world inspirations."
