title = "Articles by Evan Lahti, Strategic Director | PC Gamer"
description = "Evan LahtiSocial Links NavigationStrategic DirectorEvan's a hardcore FPS enthusiast who joined PC Gamer in 2008. After an era spent publishing reviews, news, and cover features, he now oversees editorial operations for PC Gamer worldwide, including setting policy, training, and editing stories written by the wider team. His most-played FPSes are CS:GO, Team Fortress 2, Team Fortress Classic, Rainbow Six Siege, and Arma 2. His first multiplayer FPS was Quake 2, played on serial LAN in his uncle's basement, the ideal conditions for instilling a lifelong fondness for fragging. Evan also leads production of the PC Gaming Show, the annual E3 showcase event dedicated to PC gaming."
full_description = '''Evan LahtiSocial Links NavigationStrategic DirectorEvan's a hardcore FPS enthusiast who joined PC Gamer in 2008. After an era spent publishing reviews, news, and cover features, he now oversees editorial operations for PC Gamer worldwide, including setting policy, training, and editing stories written by the wider team. His most-played FPSes are CS:GO, Team Fortress 2, Team Fortress Classic, Rainbow Six Siege, and Arma 2. His first multiplayer FPS was Quake 2, played on serial LAN in his uncle's basement, the ideal conditions for instilling a lifelong fondness for fragging. Evan also leads production of the PC Gaming Show, the annual E3 showcase event dedicated to PC gaming. Latest articles by Evan Lahti Wayne June, famed narrator of the Darkest Dungeon games, has died By Andy Chalk published 30 January 25 news Red Hook Studios said June's work "is nothing short of iconic, and deserves to be recognized and celebrated at the highest levels of our industry." news 'We will take measures to vanquish this nefarious behavior': Marvel Rivals will ban console players who use a mouse and keyboard By Evan Lahti published 14 January 25 Using third-party emulation devices to gain an advantage may get you banished to the Negative Zone, says Marvel Rivals studio NetEase Games. Games 8 bold gaming predictions for 2025 By Tyler Wilde published 3 January 25 🔮 What does the new year have in store for videogames? 🔮 Best Multiplayer 2024: Helldivers 2 By Morgan Park published 29 December 24 🏆 Reinventing the live service game—for democracy. 🏆 Best FPS 2024: STRAFTAT By Jake Tucker published 24 December 24 🏆 Our favourite shooter of the year was look all the best custom lobbies rolled into one. 🏆 Best Roguelike 2024: Caves of Qud By Lincoln Carpenter published 22 December 24 🏆 Genre-defining weirdness. 🏆 Best Survival Game 2024: Pacific Drive By Jacob Ridley published 20 December 24 🏆 On the road again. 🏆 Creative Achievement 2024: UFO 50 By Evan Lahti published 19 December 24 🏆 Everything old is new again. 🏆 'I've spent my entire career trying to recreate the feeling I had when I played D&D for the first time,' says immersive sim godfather Warren Spector, with new game Thick as Thieves going multiplayer because 'you don't play D&D alone' By Ted Litchfield published 16 December 24 news Spector described wanting to push the genre in new and interesting directions. news CDPR devs are excited 'we can finally say The Witcher 4 publicly', and laugh about trying 'to learn not to call it Polaris anymore' By Rich Stanton published 13 December 24 "This is not a codename anymore, so this is exciting." The Witcher The Witcher 4 may have familiar faces but it's an origin story: 'A new opening, a new saga, a new beginning actually' By Rich Stanton published 13 December 24 News "Ciri is so passionate about what she's doing that she will never be neutral. She will go for it." News The Witcher 4 was always going to be about Ciri, 'even when we were doing The Wild Hunt actually', but don't worry about Geralt: 'Definitely he's going to appear' By Harvey Randall published 13 December 24 News Oh yeah, it's all coming together. News Thick as Thieves is instantly one of my most-anticipated games, and every Thief fan should be backstabbing that wishlist button By Evan Lahti published 13 December 24 In the thick of it If you love multiplayer games but couldn't care less about your kill-death ratio, Thick as Thieves might be your game. In the thick of it Healthcare CEO shooting suspect Luigi Mangione has connections to the videogame industry, claims to have worked on Civilization 6 By Andy Chalk last updated 10 December 24 news Luigi Mangione has now been charged with the murder of UnitedHealthcare CEO Brian Thompson. news The PC Gamer 2024 Holiday Gift Guide By Sarah Richter last updated 9 December 24 Giftageddon Gifts for PC gamers sure to bring holiday cheer to one and all. Giftageddon Trend Watch: The 5 biggest gaming trends right now By Evan Lahti published 5 December 24 trends PC Gamer's team of 30 editors identifies the major gaming trends affecting gaming. Updated as the industry changes and as new trends emerge. trends Meet The Council By Evan Lahti published 4 December 24 Most Wanted Some of the faces of PC Gamer's special jury of gaming experts, who select the games featured in PC Gaming Show: Most Wanted Most Wanted The best indie games on PC By Jody Macgregor last updated 3 December 24 Small but mighty These are the best indie games you can play on PC. Small but mighty Here are the nominees for PC Gaming Show: Most Wanted By Evan Lahti published 14 November 24 News The list is tallied. The Council is convened once more. News RPGs are king, and 6 other things the PC Gamer Top 100 tells us about the state of PC gaming By Tyler Wilde published 14 October 24 Top 100 Breaking down PC Gamer's 2024 list of the top 100 greatest PC games. Top 100 The top 100 PC games By Phil Savage published 14 October 24 Class of 2024 Welcome to the 2024 edition of the PC Gamer Top 100—our annual list of the best PC games around. Class of 2024 Hunt: Showdown enjoys highest-ever player count after 1896 update, but player complaints about UI are pushing down its Steam review score: 'I've never seen such a bizarre reaction to so much amazing content' By Rick Lane, Evan Lahti published 16 August 24 News Off menu. News PC Gamer announces editorial staff changes and recent hirings By Evan Lahti published 31 July 24 staff Meet our new Global Editor-in-Chief, Phil Savage. staff 'This is the most polished map we've ever shipped': Hunt: Showdown 1896 director goes deep on Hunt's first new map in 3 years By Morgan Park published 25 July 24 1896 Hunt: Showdown 1896 represents the next era of Hunt, with an upgraded engine and new map coming in August. 1896 PC gaming is mainstream. Now what? By Evan Lahti published 28 June 24 opinion Openly but quietly, PC gaming has become more popular than it's ever been. Wait, when did that happen? o