full_description = '''Hardware A note on affiliate links Features By PC Gamer published 1 July 2016 How retailer links support our independent testing. When you purchase through links on our site, we may earn an affiliate commission. Here’s how it works. window.vanilla.infiniteArticlesData = []; Affiliate Links Some of our stories, such as our reviews and PC build guides, include affiliate links to stores like Amazon and Humble. Without any cost to you, these online stores share a small amount of revenue with us if you buy something through one of these links, which helps support our work evaluating PC games and components.We will always recommend the games and products we believe are the best available, always based on our own tests and research. The revenue from affiliate links—and of course you're encouraged to use whatever retailer you prefer—helps us convince the business folk upstairs to expand our test content.Check out our hardware section for the latest reviews, browse our comprehensive buying guides for advice on everything from CPUs and monitors to desk chairs, and research your next build with our complete budget, mid-range, and high-end PC build guides.Preferred Partner When you see a label saying "Preferred Partner", that means a commercial partner is offering a preferential affiliate rate to Future in exchange for greater prominence on the page, such as by highlighting a particular deal for a product that our journalists recommend. PC Gamer will only write content featuring 'Preferred Partners' when we feel it's aligned with our mission to create the best content for our audience.The text is written by a PC Gamer editor. It is not sent to the funding partner for approval. This content abides by the Editors’ Code of Practice from the Independent Press Standards Organisation. window.sliceComponents = window.sliceComponents || {}; externalsScriptLoaded.then(() => { window.reliablePageLoad.then(() => { var componentContainer = document.querySelector("#sli