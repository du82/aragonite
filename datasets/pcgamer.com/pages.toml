title = "About PC Gamer | PC Gamer"
description = "The latest Feature,/features,,features, breaking news, comment, reviews and features from the experts at PC Gamer"
full_description = '''About PC Gamer When you purchase through links on our site, we may earn an affiliate commission. Here’s how it works. window.vanilla.infiniteArticlesData = []; (Image credit: Future) Jump to: Subscriptions Contacts Key staff Editorial policies Affiliate & Advertising disclosure IPSO Privacy Community Guidelines PC Gamer is the global authority on PC games. We've been covering PC gaming for more than 20 years, and continue that legacy today with worldwide print editions and around-the-clock news, features, esports coverage, hardware testing, and game reviews on pcgamer.com, as well as the annual PC Gaming Show at E3.Visit our staff page to see the international team behind the stories and events, and keep up with us on Steam, Twitter, Facebook, and YouTube. You can also subscribe to our podcast on iTunes.SubscriptionsTo subscribe to the magazine in the US, UK, or elsewhere, visit MagazinesDirect.com.ContactsContact the editors: editors@pcgamer.comSend a confidential tip: tips@pcgamer.comUS sales: melissa.makhmaltchi@futurenet.comUK sales: tom.parkinson@futurenet.comAustralia sales: chris.ferguson@futurenet.comFor information on using our logos, quotes, and review content, click here or email licensing@futurenet.com.Future Plc office addresses window.sliceComponents = window.sliceComponents || {}; externalsScriptLoaded.then(() => { window.reliablePageLoad.then(() => { var componentContainer = document.querySelector("#slice-container-newsletterForm-articleInbodyContent-avbiWgwrjhY6y2HtXihE9E"); if (componentContainer) { var data = {"layout":"inbodyContent","header":"The biggest gaming news, reviews and hardware deals","tagline":"Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.","formFooterText":"By submitting your information you agree to the <a href=\"https:\/\/futureplc.com\/terms-conditions\/\" target=\"_blank\">Terms & Conditions<\/a> and <a href=\"https:\/\/futureplc.com\/privacy-policy\/\" target=\"_blank\">Privacy Policy<\/a> and are aged 16 or over.","successMessage":{"body":"Thank you for signing up. You will receive a confirmation email shortly."},"failureMessage":"There was a problem. Please refresh the page and try again.","method":"POST","inputs":[{"type":"hidden","name":"NAME"},{"type":"email","name":"MAIL","placeholder":"Your Email Address","required":true},{"type":"hidden","name":"NEWSLETTER_CODE","value":"XPG-X"},{"type":"hidden","name":"LANG","value":"EN"},{"type":"hidden","name":"SOURCE","value":"60"},{"type":"hidden","name":"COUNTRY"},{"type":"checkbox","name":"CONTACT_OTHER_BRANDS","label":{"text":"Contact me with news and offers from other Future brands"}},{"type":"checkbox","name":"CONTACT_PARTNERS","label":{"text":"Receive email from us on behalf of our trusted partners or sponsors"}},{"type":"submit","value":"Sign me up","required":true}],"endpoint":"https:\/\/newsletter-subscribe.futureplc.com\/v2\/submission\/submit","analytics":[{"analyticsType":"widgetViewed"}],"ariaLabels":{}}; var triggerHydrate = function() { window.sliceComponents.newsletterForm.hydrate(data, componentContainer); } if (window.lazyObserveElement) { window.lazyObserveElement(componentContainer, triggerHydrate); } else { triggerHydrate(); } } }).catch(err => console.error('%c FTE ','background: #9306F9; color: #ffffff','Hydration Script has failed for newsletterForm-articleInbodyContent-avbiWgwrjhY6y2HtXihE9E Slice', err)); }).catch(err => console.error('%c FTE ','background: #9306F9; color: #ffffff','Externals script failed to load', err)); The biggest gaming news, reviews and hardware dealsKeep up to date with the most important stories and the best deals, as picked by the PC Gamer team.Contact me with news and offers from other Future brandsReceive email from us on behalf of our trusted partners or sponsorsBy submitting your information you agree to the Terms & Conditions and Privacy Policy and are aged 16 or over.Swipe to scroll horizontallyUS130 West 42nd Street 7th Floor, New York NY 10036Row 0 - Cell 2 UKQuay House, The Ambury, Bath BA1 1UARow 1 - Cell 2 AustraliaLevel 10, 89 York Street Sydney, NSW, 2000Row 2 - Cell 2 Key staffFind the full PC Gamer staff list on our Meet the Team page.Tim ClarkSocial Links NavigationBrand DirectorWhen not steering the good ship PC Gamer, Tim spends his time complaining that all Priest mains in Hearthstone are degenerates and raiding in Destiny 2. He's almost certainly doing one of these right now. "On lunch."Evan LahtiSocial Links NavigationStrategic DirectorEvan's a hardcore FPS enthusiast who joined PC Gamer in 2008. After an era spent publishing reviews, news, and cover features, he now oversees editorial operations for PC Gamer worldwide.Phil SavageSocial Links NavigationGlobal Editor-in-ChiefPhil leads PC Gamer's UK team, but still sometimes finds the time to write about his ongoing obsessions with Destiny 2, GTA Online, and Apex Legends. He's largely responsible for the Tub Geralt thing, but still isn't sorry.Dave JamesSocial Links NavigationEditor-in-Chief, HardwareDave built his first gaming PC at the tender age of 16, and finally finished bug-fixing the Cyrix-based system a year later—when he dropped it out of the window. He's been breaking technology ever since, but at least he gets paid for it now.Tyler WildeSocial Links NavigationEditor-in-Chief, USTyler leads PC Gamer's team in North America. He joined PCG well over a decade ago, and has been a reader for much longer. Someday he'll organize his box of old demo discs, wherever it is.Editorial policiesPC Gamer has been publishing criticism and news about PC games and hardware for almost 30 years, and above all else we strive to be honest, accurate, and transparent. Our reviews policy and how we test hardware pages, as well as notes on affiliate links explain our approach to reviews and product recommendations in detail.We're not infallible, and if we make a mistake, we'll acknowledge and correct it as soon as we can. If you spot an error or have a complaint, see the contact information above to get in touch.Affiliate & Advertising disclosureWe always aim to provide unbiased editorial created by our journalists and writers. We also need to pay our teams and website costs so we make money in a number of ways. We sometimes use affiliate links to products and services on retailer sites for which we can receive compensation if you click on those links or make purchases through them. From time to time we also publish advertorials (paid-for editorial content) and sponsored content on the site. When this is the case the content is clearly marked as sponsored or promoted, so you’ll always know which content is editorial and which is not. For more details on content funding at PC Gamer, head here. Future PLC is our parent company and has an in-depth terms and conditions page with a lot more information that you can read right here.IPSO(Image credit: IPSO)PC Gamer is a member of the IPSO (Independent Press Standards Organisation) which regulates the UK print and digital news industry. We abide by the Editors' Code of Practice and are committed to upholding the highest standards of journalism. If you think that we have not met those standards and want to make a complaint, please contact legal@futurenet.com. If we are unable to resolve your complaint, or if you would like more information about IPSO or the Editors' Code, contact IPSO on 0300 123 2220 or visit www.ipso.co.ukPrivacyPC Gamer is part of Future Plc. We are both fiercely committed to protecting your privacy. Please have a look at our in-depth privacy policy to find out more.Community GuidelinesThe PC Gamer comment section is for thoughtful discussion of article topics. Together we’re developing a space where people share your passion and where you can enjoy conversations built on a foundation of respect and common interests.Our PC Gamer community team is dedicated to providing quality content—please keep that in mind and keep disagreements respectful. Not every comment needs to be a debate – it’s fine to just talk! – but please approach all disagreements in a spirit of openness and tolerance.If you feel like you’re getting too invested, take a deep breath and step away. You are never obligated to reply to a fellow commentator. If someone is breaching our rules or making the comments a less welcoming place then please use the report button so that our Community team can investigate further.Whenever someone joins the comment section here at PC Gamer they should find them welcoming and insightful. We want to build a community that you’re proud to recommend to others and we can only do that together.Please read our guidelines below to understand what is allowed and how our moderation system works.PC Gamer Community GuidelinesNote: If your post is removed, it's never a personal attack but a step to maintain a respectful and engaging community in line with our guidelines.Stay on TopicComments should be relevant to the article or discussion at hand.Posts that stray into unrelated topics like politics or religion will be removed.Respectful InteractionHealthy debate is welcome, but personal attacks, harassment, or demeaning language toward others, including staff, are not permitted.Hate speech or discriminatory language of any kind will result in a ban.Threatening BehaviourAny threats made toward staff, the subjects of articles or other users will be reviewed for what action needs to be taken and you will be banned.If a threat is deemed to be credible we will contact local law enforcement.No Self-PromotionDo not use the comments to advertise personal products or services.Attempts to drive readers to third-party sites will be deleted.Prohibited ContentDo not promote or describe illegal activities, including piracy or hacking.Users doing so will be banned.Impersonation is ProhibitedDo not impersonate other users, influencers, staff members, or any person/organization.Users doing so will be banned.Privacy MattersNever share personal identifying information like email addresses or phone numbers.Do not ask others to provide their personal information or share information (dox) anyone in our comment sections this will lead to an immediate ban.Spam PolicySpam comments will lead to an immediate and permanent ban.LanguageComments should be in English to ensure moderators can effectively enforce these guidelines.Respect Moderation DecisionsDo not publicly discuss moderator actions. If you believe you have been banned in error contact commentmoderation@futurenet.comNamesAll of the above rules apply equally to names and using abusive language, fraudulently claiming to be staff or any other misuse of your display name will lead to a ban.Our guidelines cannot cover every situation and our moderation team reserve the right to remove any comment at any time. The PC Gamer team and Future do not endorse the opinions and views shared by readers in our comment sections.Pre-moderation: When dealing with a large volume of comments it’s impossible to handle them in real time. Comments may be pre-moderated due to their content, article settings or reports by other users.If you are finding yourself to be consistently pre-moderated then it is not targeted. How you are choosing to post is getting picked up by the system or reported by other users and can usually be fixed by following our guidelines or considering how others might read what you have posted.Ban Appeals: If you wish to appeal a ban please contact commentmoderation@futurenet.com. Please include the name of the site you are posting on, your username and respectfully explain why you believe the ban should be overturned. More about gaming industry Over 30 Apex Legends voice actors refuse to sign an agreement that would see them 'give up our expertise to train the generative AI that will replace us tomorrow' PC Gamer magazine's new issue is on sale now: inZOI Latest Monster Hunter Wilds has broken into the top 10 all-time Steam record books an hour after launch, passing Baldur's Gate 3, Hogwarts Legacy and Elden Ring See more latest if (window.sliceHydrationLazy) { window.sliceHydrationLazy("relatedArticles", "relatedArticles", JSON.stringify({"headerTitle":"Most Popular","relatedArticles":[{"url":"https:\/\/www.pcgamer.com\/\/games\/action\/monster-hunter-wilds-new-cooking-system-is-a-win-for-balance-but-theres-a-meowscular-chef-shaped-hole-in-my-heart","title":"Monster Hunter Wilds' new cooking system is a win for balance, but there's a Meowscular Chef-shaped hole in my heart","imageUrl":"https:\/\/cdn.mos.cms.futurecdn.net\/WMd6oHXWbbfu3wzLkQncvd.jpg","imageAlt":"monster hunter wilds meal","index":0},{"url":"https:\/\/www.pcgamer.com\/\/games\/the-sims\/this-sims-2-mod-makes-all-your-sims-very-horny-but-thats-not-actually-the-best-part","title":"This Sims 2 mod makes all your sims very horny but that's not actually the best part","imageUrl":"https:\/\/cdn.mos.cms.futurecdn.net\/U5Zsnwkg7yecGX9rLnSaMm.jpg","imageAlt":"The Sims 2 - a sim in sunglasses and a moustache frowns","index":1},{"url":"https:\/\/www.pcgamer.com\/\/games\/rpg\/avoweds-inert-cities-remind-me-just-how-good-we-had-it-in-skyrim-and-oblivion","title":"Avowed's inert cities remind me just how good we had it in Skyrim and Oblivion","imageUrl":"https:\/\/cdn.mos.cms.futurecdn.net\/kNQGpbiuJwMAS2LW98ogdc.jpg","imageAlt":"Paradise building in the sun in Avowed","index":2},{"url":"https:\/\/www.pcgamer.com\/\/hardware\/graphics-cards\/new-leak-claims-amds-upcoming-rx-9070-xt-gpu-hits-over-3-2-ghz-and-could-be-an-overclocking-beast","title":"New leak claims AMD's upcoming RX 9070 XT GPU hits over 3.2 GHz and could be an overclocking beast","imageUrl":"https:\/\/cdn.mos.cms.futurecdn.net\/bQrYBfRGTTRsXF5sXcDRj8.jpg","imageAlt":"An Asus TUF RX 9070 XT on display at CES 2025","index":3},{"url":"https:\/\/www.pcgamer.com\/\/games\/moba\/as-a-lapsed-4-500-hour-veteran-of-dota-2-the-big-new-wandering-waters-update-has-lured-me-back-bu