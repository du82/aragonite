["https://www.pcgamer.com/author/andy-chalk"]
title = "Articles by Andy Chalk, US News Lead | PC Gamer"
description = "Andy ChalkSocial Links NavigationUS News LeadAndy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill."
full_description = '''Andy ChalkSocial Links NavigationUS News LeadAndy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill. Latest articles by Andy Chalk Warner is still talking about Hogwarts Legacy as it commits to basing its future games on 'tentpole franchises that have each generated over $1 billion' By Andy Chalk published 28 February 25 news 2024 was a "disappointing year" for Warner's games business, but it has a plan for better times ahead. news Humanity's last hope is a little robot with can-do spirit in The Last Caretaker, coming to early access this summer By Andy Chalk published 28 February 25 news The Last Caretaker is a "first-person survival shooter" that promises to ask some big questions about what it means to be human. news Meta says sorry for turning Instagram into a horror show of violence, gore, dead bodies, and other graphic content that 'should not have been recommended' By Andy Chalk published 28 February 25 news Yeah, that wasn't supposed to happen. news The BAFTAs dares to ask the internet: 'What is the most influential videogame of all time?' By Andy Chalk published 28 February 25 news You probably shouldn't write in Gamey McGameface but you can if you want to. news Civilization 7's first in-game event postponed so Firaxis can 'prioritize quality-of-life improvements' By Andy Chalk published 27 February 25 news The next Civ 7 update is scheduled to arrive on March 4. news California Fire Relief Bundle offers Tunic, Skatebird, Catlateral Damage, and hundreds of other games for just $10 By Andy Chalk published 27 February 25 news The new bundle from Itch.io is raising money to help people whose lives have been upended by the California wildfires. news Epic will give Fortnite cheaters 'a second chance' with a new, more forgiving ban policy, as long as they didn't do anything too awful or illegal By Andy Chalk published 27 February 25 news Beginning in April, cheaters will be given a one-year matchmaking ban on their first offense instead of a lifetime ban—unless they really screwed up. news Dungeonborne, the game that once threatened to steal Dark and Darker's crown, is closing in May By Andy Chalk published 27 February 25 news Being on Steam briefly gave Dungeonborne an edge over Dark and Darker, but it didin't last. news Metro 2033 dev pulls a reverse Fight Club twist: It's been two companies this whole time and one of them is changing its name and making a sci-fi shooter in a dystopian South America By Joshua Wolens published 27 February 25 News Created by Nicolas Winding Refn, in case that headline wasn't enough of a ride for you. News The Witcher 4 reveal trailer took 14 days of mocap, and CD Projekt wants you to think about what happened after it ended By Andy Chalk published 26 February 25 news A new "behind the scenes" video explores the making of The Witcher 4 cinematic revealed at the 2024 Game Awards. news Valve expands Steam's Daily Deals program from 4 games to 6, also explains what Steam's Daily Deals program is By Andy Chalk published 26 February 25 news No, it's not flash sales. news Riot walks back unpopular League of Legends changes: Hextech Chests are coming back, and the Blue Essence cost for new champions will be cut in half By Andy Chalk published 26 February 25 news Riot says changes meant to streamline League of Legends' reward systems "missed the mark." news Slack is down, and that means it's time to start playing games on company time By Andy Chalk published 26 February 25 news Take advantage while you can. news Autographed copies of Kingdom Come: Deliverance 2 collector's editions are being auctioned for charity, but it'll cost you more than 59 copies of the regular game just to get in the door By Andy Chalk published 25 February 25 news All for a good cause, though. news Get ready to get weird in Pathologic 3: Quarantine, a free 'prologue chapter' about a young doctor looking for immortality in the world's most miserable town By Andy Chalk published 25 February 25 news The Pathologic 3 prologue is set to launch in March. news Former Piranha Bytes veterans unveil their new dungeon crawler, and it's tripping my Arx Fatalis alarms in all the right ways By Andy Chalk published 25 February 25 news Cralon is a game about a guy who falls into a mine and decides to keep going down. news Warner Bros. is closing Monolith, Player First Games, and WB San Diego, and has cancelled its Wonder Woman game By Andy Chalk published 25 February 25 news Warner wants to focus its future efforts on Harry Potter, Mortal Kombat, DC, and Game of Thrones. news The Callisto Protocol studio lays off more employees, but 'remains operational' By Andy Chalk published 25 February 25 news Parent company Krafton declined to provide numbers but one former employee said "most of the devs" have been let go. news Balatro finally escapes its silly 18+ age rating, PEGI promises 'a more granular set of classification criteria' for gambling-themed games in the future By Andy Chalk published 24 February 25 news Balatro also got a new Friends of Jimbo crossover pack today, featuring Civilization 7, Fallout, and more. news Dauntless, the monster hunting game we had before Monster Hunter came to PC, will shut down in May By Andy Chalk published 24 February 25 news The announcement comes just over a month after Phoenix Labs laid off the majority of its employees. news Physical copies of Assassin's Creed Shadows leak nearly a month ahead of its release date By Andy Chalk published 24 February 25 news It's another headache for Ubisoft. news Bossa says 'disruption' in the game industry 'is not a phase, it's a fundamental transformation' of how games will be made in the future as it lays off more employees By Andy Chalk published 24 February 25 news Bossa is now focusing on the development and launch of its co-op survival game Lost Skies. news Marvel Rivals was reportedly almost cancelled because the CEO of NetEase didn't want to pay Disney for the licenses By Andy Chalk published 21 February 25 news And who can blame him, really? news Peripheral maker Corsair says Grand Theft Auto 6 is coming to PC in 'early 2026,' then immediately yoinks it back By Andy Chalk published 21 February 25 news Nothing to see here? news Peter Jason, the voice of Fallout 2's famous drill sergeant and Dizzy in the Gear of War games, has died By Andy Chalk published 21 February 25 news Jason had a long career as a character actor in film and television and frequently collaborated with John Carpenter, but to us he'll always be Sergeant Dornan. news <a href="" rel="nofollow" class="article-link" aria-label="SPONSORED_HEADLINE" target=_self> <article aria-label="Search result: SPONSORED_HEADLINE" class="search-result search-result-"> <div class="image"> <figure class="article-lead-image-wrap" data-original=""> <div class="image-remove-flow-width-setter"> <div class="image-remove-reflow-container " data-original=""> <img src="SPONSORED_IMAGE_URL" alt="" class="lazy-image-van" /> </div> </div> </figure> </div> <div class="content"> <header> <h3 class="article-name">SPONSORED_HEADLINE</h3> <p class="byline"> </p> </header> <p class="synopsis"><span class="free-text-label">SPONSORED</span> SPONSORED_STRAPLINE </p> </div> </article> </a> <a class="category-link" inert>SPONSORED</a> <!-- Cats: --> 1 2 3 4 5 6 7 8 9 Archives window.sliceComponents = window.sliceCompone