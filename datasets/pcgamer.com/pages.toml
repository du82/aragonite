title = "Articles by Christopher Livingston, Senior Editor | PC Gamer"
description = "Christopher LivingstonSocial Links NavigationSenior EditorChris started playing PC games in the 1980s, started writing about them in the early 2000s, and (finally) started getting paid to write about them in the late 2000s. Following a few years as a regular freelancer, PC Gamer hired him in 2014, probably so he'd stop emailing them asking for more work. Chris has a love-hate relationship with survival games and an unhealthy fascination with the inner lives of NPCs. He's also a fan of offbeat simulation games, mods, and ignoring storylines in RPGs so he can make up his own."
full_description = '''Christopher LivingstonSocial Links NavigationSenior EditorChris started playing PC games in the 1980s, started writing about them in the early 2000s, and (finally) started getting paid to write about them in the late 2000s. Following a few years as a regular freelancer, PC Gamer hired him in 2014, probably so he'd stop emailing them asking for more work. Chris has a love-hate relationship with survival games and an unhealthy fascination with the inner lives of NPCs. He's also a fan of offbeat simulation games, mods, and ignoring storylines in RPGs so he can make up his own. Latest articles by Christopher Livingston Based on its new trailer, I predict A Minecraft Movie will make A Trillion Dollars By Christopher Livingston published 27 February 25 News Kids are gonna like Jack Black holding up items from Minecraft, like a water bucket, while he yells the words "WATER BUCKET!" News The first gameplay trailer for PUBG creator's 'brutal' survival game shows off deadly weather and cozy cabins By Christopher Livingston published 27 February 25 Prologue: Go Wayback! enters early access this summer. Survival & Crafting Adult game dev reveals annual gamer 'kink survey' results: 'Monster Girls' are on top, but 'Tentacles dropped out of the top 25' By Christopher Livingston published 27 February 25 News Developer HotPink Games shares which kinks its players are most into in 2025 compared to other years. News The best survival games on PC By Christopher Livingston last updated 26 February 25 stay alive The best games for surviving against the odds. stay alive 'I'm an idiot': MrBeast says he lost 'tens of millions of dollars' of his own money on Amazon's Beast Games By Christopher Livingston published 25 February 25 News "I lost money. I would have more money if I didn't film it." News Andor Season 2 trailer is action-packed, but hopefully the show is still actually packed with interesting people quietly talking to each other By Christopher Livingston published 25 February 25 News The new season of Andor comes to Disney+ April 22, packing 12 episodes into just four weeks. News Sea of Thieves in space? Not quite, but Jump Ship replicates a lot of the things that make Rare's pirate sandbox so fun By Christopher Livingston published 24 February 25 Ship Shape There's no PvP and it's not open world, but it still has a lot in common with Rare's pirate sandbox. Ship Shape 'It's like Die Hard but with more comedy': Immersive FPS Skin Deep has talking cats, banana traps, and enemies you can disable by making them sneeze By Christopher Livingston published 24 February 25 News Stop space pirates as a former assassin turned "insurance commando" in the immersive sim from Blendo Games. News This open world bicycling game from the developer of Nidhogg is so chill that 'you don't really have to do any of the challenges if you don't want to' By Christopher Livingston published 24 February 25 News "You can just cruise around and appreciate the scenery," says Wheel World developer Mark Essen of Meshoff. News I am begging you not to watch this ghostly white 'faceless, anatomically accurate' robot dangling from wires and silently thrashing its sinewy limbs By Christopher Livingston published 21 February 25 News I'm not joking. Don't look at it. News Dune: Awakening: Everything we know about Funcom's survival MMO By Christopher Livingston published 20 February 25 Spicy The spice must flow in the alt-history Dune MMO. Spicy The survival game with the best car ever has sold over a million copies in a year, and is now 40% off on Steam By Christopher Livingston published 20 February 25 News Pacific Drive, the driving survival game, has gotten quite a few passengers since it launched a year ago. News HBO announces The Last of Us Season 2 release date: April 13 By Christopher Livingston published 19 February 25 News Sad Dad vs. the Mushroom Monsters, round two. News Exploit asteroids for resources using automated mining equipment as they hurtle through your space-claim in Astronomics By Christopher Livingston published 19 February 25 News Asteroid mining can be pretty chill, except for that ticking clock. News Steven Spielberg's 'reportedly UFO-related' movie doesn't even have a name yet, but it has a release date By Christopher Livingston published 18 February 25 News Let's hope it's better than the last UFO movie he did—spoiler—Indiana Jones and the Kingdom of the Crystal Skull. News The best Skyrim Special Edition mods By Jody Macgregor, Christopher Livingston last updated 16 February 25 Updated! The best Skyrim Special Edition mods are as numerous as the best mods for vanilla Skyrim. Updated! Keep Driving review: Great characters, challenging resource management, and impeccable road trip vibes By Christopher Livingston published 15 February 25 Thumbs Up A management RPG that perfectly captures the feel of a long and memorable road trip. Thumbs Up Twisted Metal Season 2 teases a character from the games so ridiculous I can't wait to see how they're gonna pull it off By Christopher Livingston published 13 February 25 News The second season of Twisted Metal comes to Peacock this summer, and Axel is coming with it. News Former GTA producer's GTA-like shooter will come out before GTA 6 By Christopher Livingston published 13 February 25 News Third-person action shooter MindsEye, from former Rockstar North president Leslie Benzies, is due out this summer. News Civilization 7 patch 1.0.1 addresses 'key areas of player-reported issues' including UI and tooltip improvements By Christopher Livingston published 12 February 25 A more "major" update focused on "the UI and other critical areas" is also in the works. Strategy There are already Civilization 7 mods that improve the UI, unlock all civs, and add 'ludicrous'-sized maps By Christopher Livingston published 12 February 25 News Modders are already coming up with ways to customize your Civ 7 experience. News Here's our first look at Karl Urban in Mortal Kombat 2 as 'Johnny ******* Cage' By Christopher Livingston published 11 February 25 News I'd have preferred Dredd 2, but it wasn't up to me. News This long-running cozy tavern life sim on Steam just added online multiplayer, so now you can design and run a medieval pub with your pals By Christopher Livingston published 10 February 25 News Travellers Rest keeps getting bigger and better. News PC Gamer's simulated Super Bowl 2025 predicts Eagles victory, player getting hit so hard he flies out of the stadium and into the parking lot By Christopher Livingston published 7 February 25 Bowled Over The Kansas City Chiefs meet the Philadelphia Eagles in our extremely accurate computer simulated Super Bowl 2025. Bowled Over Rust goes medieval with the Primitive update: siege weapons, swords and shields, and maybe a few jewel-encrusted assault rifles By Christopher Livingston published 6 February 25 News OK, so it's not as historically accurate as Kingdom Come: Deliverance 2. News <a href="" rel="nofollow" class="article-link" aria-label="SPONSORED_HEADLINE" target=_self> <article aria-label="Search result: SPONSORED_HEADLINE" class="search-result search-result-"> <div class="image"> <figure class="article-lead-image-wrap" data-original=""> <div class="image-remove-flow-width-setter"> <div class="image-remove-reflow-container " data-original=""> <img src="SPONSORED_IMAGE_URL" alt="" class="lazy-image-van" /> </div> </div> </figure> </div> <div class="content"> <header> <h3 class="article-name">SPONSORED_HEADLINE</h3> <p class="byline"> </p> </header> <p class="synopsis"><span class="free-text-label">SPONSORED</span> SPONSORED_STRAPLINE </p> </div> </article> </a> <a class="category-link" inert>SPONSORED</a> <!-- Cats: --> 1 2 3 4 5 6 7 8 9 Archives window.sliceComponents = window.sliceComponents || {}; externalsScriptLoaded.then(() => { window.reliablePageLoad.then(() => { var componentContainer = document.querySelector("#slice-container-newsletterForm-listingSidebar"); if (compone