["https://www.pcgamer.com/author/dave-james"]
title = "Articles by Dave James, Editor-in-Chief, Hardware | PC Gamer"
description = "Dave JamesSocial Links NavigationEditor-in-Chief, HardwareDave has been gaming since the days of Zaxxon and Lady Bug on the Colecovision, and code books for the Commodore Vic 20 (Death Race 2000!). He built his first gaming PC at the tender age of 16, and finally finished bug-fixing the Cyrix-based system around a year later. When he dropped it out of the window. He first started writing for Official PlayStation Magazine and Xbox World many decades ago, then moved onto PC Format full-time, then PC Gamer, TechRadar, and T3 among others. Now he's back, writing about the nightmarish graphics card market, CPUs with more cores than sense, gaming laptops hotter than the sun, and SSDs more capacious than a Cybertruck."
full_description = '''Dave JamesSocial Links NavigationEditor-in-Chief, HardwareDave has been gaming since the days of Zaxxon and Lady Bug on the Colecovision, and code books for the Commodore Vic 20 (Death Race 2000!). He built his first gaming PC at the tender age of 16, and finally finished bug-fixing the Cyrix-based system around a year later. When he dropped it out of the window. He first started writing for Official PlayStation Magazine and Xbox World many decades ago, then moved onto PC Format full-time, then PC Gamer, TechRadar, and T3 among others. Now he's back, writing about the nightmarish graphics card market, CPUs with more cores than sense, gaming laptops hotter than the sun, and SSDs more capacious than a Cybertruck. Latest articles by Dave James Nvidia RTX 5070 hands-on preview: a sneak peek at my unreleased RTX Blackwell card hitting triple digit frame rates in Cyberpunk 2077 at 1440p and Avowed at 4K By Dave James published 1 March 25 Sneak peek Yes, that's the magic of Multi Frame Generation for you, and yes there is considerable competition on the horizon. But it's looking good, at least. Sneak peek Best gaming desk in 2025: my top picks for standing, sitting and everything in between By Dave James last updated 27 February 25 Top Desks We've chosen the best gaming desks based on hours of playing on both sitting and standing desks just to see which is worth your money. Top Desks Best graphics card for laptops in 2025: the mobile GPUs I'd want in my next gaming laptop By Dave James last updated 27 February 25 Go mobile Helping you pick the right graphics silicon for your next laptop purchase. Go mobile Cheap graphics card deals this week By Dave James last updated 27 February 25 Pixel pushers We've done the hard yards sourcing the best prices for all the best graphics cards you should consider slotting into your gaming PC. Pixel pushers Best cheap gaming monitor deals today By Dave James last updated 26 February 25 Deals We've scoured the internet for the best deals on gaming monitors, so you don't have to. Deals Framework takes aim at 'janky, locked-down, disposable, underpowered, and frankly, boring' entry-level laptops with its new 12-inch touchscreen By Dave James published 25 February 25 News "This is a defining product for us, and we can't wait for you to try it." News Framework's first desktop PC is giving us the AMD Strix Halo machine we've been craving, and the opportunity to build our own By Dave James published 25 February 25 News The first modular desktop PC from Framework. What do you mean they're already modular? They're certainly not like this... News Best cheap gaming laptop deals By Dave James last updated 25 February 25 Deals Our regularly updated list of all the best gaming laptop deals you'll find today. Deals The best PC cases in 2025: These are the chassis I'd use for my next gaming build By Jacob Ridley last updated 24 February 25 Best Case You'll want the best PC case if you're building your perfect gaming PC. Best Case Best cheap gaming PC deals today By Dave James last updated 24 February 25 deal Our simple advice: don't pay full price for a gaming PC. deal Nvidia RTX 5070 Ti review (MSI Ventus 3X) By Dave James last updated 21 February 25 MSRIP A GPU with performance close to an RTX 5080 that's sadly set to be priced to oblivion. MSRIP MSI RTX 5070 Ti Gaming Trio OC Plus graphics card review By Dave James last updated 21 February 25 Gouged The poster child for the great 5070 Ti Blackwell GPU screwjob. Gouged Best 4K gaming monitors in 2025: the ultra hi-res panels I highly recommend By Dave James last updated 21 February 25 4K Vision The best 4K gaming monitor has all the bells and whistles an enthusiast could ever want or need. 4K Vision The price gouging of Nvidia's RTX 5070 Ti is utterly grotesque By Dave James published 20 February 25 Heels Every manufacturer is sniffing an opportunity to squeeze an extra chunk of cash out of PC gamers desperate for a scarce new card. And it sucks. Heels Best curved monitors for gaming in 2025: These are the bendy displays I'd plant myself in front of By Dave James last updated 19 February 25 Bendy Immerse yourself to the max with these vision-enclosing panels. Bendy Best CPU for gaming: these are the chips I recommend for gaming, productivity and peace of mind By Jacob Ridley last updated 18 February 25 Happy Cores Fire up your rig with the best CPU for gaming. More cores, more clocks, more of everything that matters. Happy Cores Best handheld gaming PC in 2025: my recommendations for the best portable powerhouses By Jacob Ridley last updated 18 February 25 Portable PC PC gaming has officially gone portable, and these handheld gaming PCs are mighty quick. Portable PC Presidents' Day PC gaming deals 2025: the best bargains available today By Dave James last updated 17 February 25 El Presidente Treat yourself this Presidents' Day with some great savings on TVs and the latest PC hardware. El Presidente Best wireless gaming mouse in 2025: These are the rodents I love getting my mitts on By Dave James last updated 17 February 25 Unbound Let go of the tethers and embrace the freedom of living life cable-free. Unbound Best gaming mouse in 2025: I've tested the very best mice and these are my top picks By Dave James last updated 17 February 25 Pinpoint The best gaming mouse for every game, budget, grip, and size. Pinpoint Best office chairs for gaming in 2025: The top seats for work and gaming that I've tried and tested By Dave James last updated 14 February 25 Take a seat Take care of your spine with the best office chairs for gaming. Take a seat Monster Hunter Wilds PC performance: From Nvidia's latest, past AMD's greatest, to Intel's failing silicon, this is what the game does to PCG's own rigs By Dave James published 13 February 25 We put our own machines through the ringer with the Monster Hunter Wilds benchmark, to lesser or greater success. Hardware Best gaming PCs in 2025: these are the rigs and brands I recommend in 2025 By Dave James last updated 13 February 25 Perfect PC Everything you need to know about buying the best gaming PC today. Perfect PC Best 14-inch gaming laptop in 2025: The top compact gaming laptops I've held in these hands By Dave James last updated 13 February 25 Smol The 14-inch form factor is the perfect nexus point between performance and portability. Smol Best gaming laptop in 2025: I've had my pick of portable powerhouses and these are the best By Dave James last updated 12 February 25 Portable powerhouses Don't compromise on power or portability with the best gaming laptops. Portable powerhouses <a href="" rel="nofollow" class="article-link" aria-label="SPONSORED_HEADLINE" target=_self> <article aria-label="Search result: SPONSORED_HEADLINE" class="search-result search-result-"> <div class="image"> <figure class="article-lead-image-wrap" data-original=""> <div class="image-remove-flow-width-setter"> <div class="image-remove-reflow-container " data-original=""> <img src="SPONSORED_IMAGE_URL" alt="" class="lazy-image-van" /> </div> </div> </figure> </div> <div class="content"> <header> <h3 class="article-name">SPONSORED_HEADLINE</h3> <p class="byline"> </p> </header> <p class="synopsis"><span class="free-text-label">SPONSORED</span> SPONSORED_STRAPLINE </p> </div> </article> </a> <a class="category-link" inert>SPONSORED</a> <!-- Cats: --> 1 2 3 4 5 6 7 8 9 Archives window.sliceComponents = window.sliceComponents || {}; externalsScriptLoaded.then(() => { window.reliablePageLoad.then(() => { var componentContainer = document.querySelector("#slice-container-newsletterForm-listingSidebar"); if (componentContainer) { var data = {"layout":"sidebar","header":"The biggest gaming news, reviews and hardware deals","headerIcon":{"svgUrl":"https:\/\/vanilla.futurecdn.net\/techradar\/media\/shared\/img\/icons\/envelope.svg","svgContents":"<svg class=\"icon-svg\" height=\"24\" viewBox=\"0 0 24 24\" width=\"24\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\"><pat