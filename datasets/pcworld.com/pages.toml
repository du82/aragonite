y that it will sunset Skype, the company that popularized voice calls over the web, in favor of its own Teams app. By Mark Hachman 2 days ago NewsNew botnet malware infects 1.6 million Android TV devices worldwideSecurity researchers have found a new variant of Vo1d that's recruiting Android TV devices to its evolving malware botnet. By Hans-Christian Dirscherl and Joel Lee 2 days ago TipHow to block all access to your PC's webcamWebcams are great for video conferencing, but they can also be misused by attackers to spy on the user. This is how you can remedy the situation. By Roland Freist 2 days ago TipShould you encrypt your PC's hard drive? The pros and cons explainedEncrypting your system's hard drive is a great way to protect your laptop if it ever gets stolen. By Friedrich Stiemer 2 days ago More stories"
