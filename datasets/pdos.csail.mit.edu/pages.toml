["https://pdos.csail.mit.edu/~neha"]
title = "Neha Narula"
full_description = "I'm a PhD student in PDOS, the Parallel and Distributed Operating Systems group at MIT, advised by Robert Morris and Eddie Kohler. My research interests are in distributed systems, particularly having to do with consistency and performance. I'm graduating soon and looking for opportunities in industry. Here is my CV. I worked for Google as a Software Engineer on Native Client, Blobstore, a system for efficiently storing and serving terabytes of large binary objects, and Froogle. I blog here to reflect on academia, systems research, the future of technology, and myself. I'm also on Twitter and Facebook, and these are the tools I use to work. Splitting and Replicating Data For Fast Transactions - Don't Give Up On Serializability Just Yet! CRAFT. Budapest, Hungary. April 24, 2015. Phase Reconciliation for Contended In-Memory Transactions. RICON. Las Vegas, NV. October 29, 2014. [slides, video] Phase Reconciliation for Contended In-Memory Transactions. OSDI. Broomfield, CO. October 5, 2014. [slides, video] Phase Reconciliation for Contended In-Memory Transactions. MIT IAP Cloud Workshop. Cambridge, MA. September 26, 2014. [slides] Consensus and Consistency: Why Should I Care? Berlin Buzzwords. Berlin, Germany. May 25, 2014. [slides, video] The Good, the Bad, and the Ugly (of Caching). All Your Base. Oxford, UK. October 18, 2013. [slides, video] Executing Queries on a Sharded Database. Strange Loop. St. Louis, MO. September 25, 2012. [slides, video] Executing Web Application Queries on a Partitioned Database. USENIX Webapps. Boston, MA. June 13, 2012. [video] Doppel. Doppel is an in-memory multicore transactional database designed to improve performance on workloads with many conflicting transactions. Doppel uses a technique called phase reconciliation; we take advantage of commutativity and executing transactions in explicit phases in order to increase concurrency. Doppel provides a dramatic performance improvement on highly conflicting workloads. Pequod. Pequod is an in-memory distributed caching layer which can automatically materialize and update the results of simple joins. It simplifies programs which manually perform incremental updates to cached objects, like Twitter timelines."
year_published = 2025
clearnet = "https://pdos.csail.mit.edu/~neha"
