full_description = "I graduated with a PhD in 2009. Previously, I was a PhD student in MIT CSAIL's Parallel and Distributed Operating Systems group. I worked primarily with Robert T. Morris and Nickolai Zeldovich. I am interested in Web security, Web platforms, cloud computing, distributed computing, and performance. In addition to computer science research, I have been involved with a number of other activities and projects over the years. Network Virtualization in Multi-tenant Datacenters. Teemu Koponen, Keith Amidon, Peter Balland, Martin Casado, Anupam Chanda, Bryan Fulton, Igor Ganichev, Jesse Gross, Natasha Gude, Paul Ingram, Ethan Jackson, Andrew Lambeth, Romain Lenglet, Shih-Hao Li, Amar Padmanabhan, Justin Pettit, Ben Pfaff, and Rajiv Ramanathan, VMware; Scott Shenker, International Computer Science Institute and the University of California, Berkeley; Alan Shieh, Jeremy Stribling, Pankaj Thakkar, Dan Wendlandt, Alexander Yip, and Ronghua Zhang, VMware. Proceedings of the 11th USENIX Symposium on Networked Systems Design and Implementation (NSDI 2014). Seattle, WA, USA. Apr, 2014. Improving Application Security with Data Flow Assertions. Alexander Yip, Xi Wang, Nickolai Zeldovich, M. Frans Kaashoek. Proceedings of the 22nd ACM Symposium on Operating Systems Principles (SOSP 2009). Big Sky, MT, USA. October 2009. Privacy-Preserving Browser-Side Scripting With BFlow. Alexander Yip, Neha Narula, Maxwell Krohn, Robert Morris. Proceedings of the ACM EuroSys Conference (EuroSys 2009). Nuremberg, Germany. March 2009. A World Wide Web Without Walls. Maxwell Krohn, Alexander Yip, Micah Brodsky, Robert Morris, Michael Walfish. 6th ACM Workshop on Hot Topics in Networks (HotNets 2007). Atlanta, GA, USA. November 2007. Information Flow Control for Standard OS Abstractions. Maxwell Krohn, Alexander Yip, Micah Brodsky, Natan Cliffer, M. Frans Kaashoek, Eddie Kohler, Robert Morris. Proceedings of the 21st ACM Symposium on Operating Systems Principles (SOSP 2007). Stevenso