full_description = "Currently a quantitative analyst at a large, old and well known hedge fund in Manhattan. Formerly a researcher in computational quantitative finance for a an equity options trading firm in Chicago, and more formerly still a research scientist at the Laboratory for Computer Science at MIT working with Frans Kaashoek in the Parallel & Distributed Operating Systems (PDOS) group and really the whole motley crew of graduate students also in NMS, ANA, and PMG. Sachin Katti, Dina Katabi, Charles Blake, Eddie Kohler, and Jacob Strauss MultiQ: Automated Detection of Multiple Bottlenecks Along a Path ACM Internet Measurement Conference, Sicily, October 2004. Rodrigo Rodrigues, Charles Blake When Multi-Hop Peer-to-Peer Routing Matters International Peer-to-Peer Systems 2004, La Jolla, December 2004. Charles Blake, Dina Katabi Cross Traffic: Noise or Data?, Bandwidth Estimation 2003, San Diego, December 2003. Charles Blake, Rodrigo Rodrigues, High Availability, Scalable Storage, Dynamic Peer Networks: Pick Two, Proceedings of the 9th Workshop on Hot Topics in Operating Systems (HotOS '03), Lihue (Kauai), Hawaii, May 2003. Dina Katabi, Charles Blake, Inferring Congestion Sharing and Path Characteristics for Packet Interarrival times, MIT TR-828, December 2001. Jinyang Li, Charles Blake, Douglas S. J. De Couto, Hu Imm Lee, and Robert Morris, Capacity of Ad Hoc Wireless Networks, Proceedings of the 7th ACM International Conference on Mobile Computing and Networking (MobiCom '01), Rome, Italy, July 2001, pages 61-69. Abstract, PostScript, PDF. Charles Blake and Steven Bauer, Simple and General Profiling with PCT, Proceedings of the USENIX 2002 Annual Technical Conference, June 2002, pages ??-??. Abstract,, PostScript, PDF, HTML, Home Page. I used work a bit on SFS -- the MIT secure/self-certifying file system. I used to caretake the exokernel project. I participate at some level in most of the various research going on at PDOS, and several other 5th floor LCS activities. In addition to systems and networks, I'm also interested in performance analysis, support tools, reflection in programming languages, search structure library design issues, and dynamic data representation runtimes. Non-CS academic interests include applied statistics (errors-in-variables methods, semiparametric estimation, learning theory, density estimation, small sample methods), quantum computation and algorithms, the philosophy of science, various areas of physics, biology, economics, and finance."
