["https://pdos.csail.mit.edu/projects/splinter-sieve.html"]
title = "MIT CSAIL Parallel and Distributed Operating Systems Group"
full_description = "Project overview As companies experience more security breaches and data leakages (intentional or unintentional), there has been a need for systems that can provide stronger guarantees in face of these breaches. The goal of this line of research is to apply cryptographic techniques practically to secure web application databases and provide strong guarantees against realistic adversaries. Projects Splinter Many online services let users query public datasets such as maps, flight prices, or restaurant reviews. Unfortunately, the queries to these services reveal highly sensitive information that can compromise users’ privacy. A user splits her query into multiple parts and sends each part to a different provider that holds a copy of the data. As long as any one of the providers is honest and does not collude with the others, the providers cannot determine the query. Splinter uses and extends a new cryptographic primitive called Function Secret Sharing (FSS) that makes it up to an order of magnitude more efficient than prior systems based on Private Information Retrieval and garbled circuits. We develop protocols extending FSS to new types of queries, such as MAX and TOPK queries. We also provide an optimized implementation of FSS using AES-NI instructions and multicores. Splinter achieves end-to-end latencies below 1.6 seconds for realistic workloads including a Yelp clone, flight search, and map routing. Sieve Sieve is a new platform which selectively (and securely) exposes user data to web services. Sieve has a user-centric storage model: each user uploads encrypted data to a single cloud store, and by default, only the user knows the decryption keys. Given this storage model, Sieve defines an infrastructure to support rich, legacy web applications. Using attribute-based encryption, Sieve allows users to define intuitively understandable access policies that are cryptographically enforceable. Using key homomorphism, Sieve can re-encrypt user data on storage providers in situ, revoking decryption keys from web services without revealing new keys to the storage provider. Using secret sharing and two-factor authentication, Sieve protects cryptographic secrets against the loss of user devices like smartphones and laptops. The result is that users can enjoy rich, legacy web applications, while benefiting from cryptographically strong controls over which data a web service can access. People Frank Wang (PhD) Cathie Yun (MEng) Prof. James Mickens (Harvard) Prof. Nickolai Zeldovich Prof. Vinod Vaikuntanathan Prof. Shafi Goldwasser Prof. Matei Zaharia (Stanford) Publications Splinter: Practical Private Queries on Public Data Frank Wang, Catherine Yun, Shafi Goldwasser, Vinod Vaikuntanathan, Matei Zaharia. NSDI’17 (Slides) Sieve: Cryptographically Enforced Access Control for User Data in Untrusted Clouds. Frank Wang, James Mickens, Nickolai Zeldovich, Vinod Vaikuntanathan. NSDI ‘16 (Slides) Publicity Sieve MIT, Harvard researchers push new way for users to control access to personal data, Computer World Could this encrypted cloud service make apps take your privacy seriously again?, ZDNet Cryptographic system would allow users to decide which applications access which aspects of their data, MIT News"
year_published = 2025
clearnet = "https://pdos.csail.mit.edu/projects/splinter-sieve.html"
