title = "MIT CSAIL Parallel and Distributed Operating Systems Group"
full_description = "Verified hardware/software systems Parfait is a framework that enables developers to build correct and secure hardware security modules (HSMs) through formal verification spanning an implementation’s hardware and software. Verifying transactional database systems vMVCC is a high-performance transaction library with a formal specification and a machine-checked proof of correctness. Perennial: verifying concurrent storage systems Perennial is a Coq framework for verifying concurrent storage systems. It supports verifying systems written in Go by translating them to Coq to complete the proof using Perennial. Metadata-private communication Vuvuzela is the first messaging system that provides strong metadata privacy while scaling to millions of users. Noria: data-flow for web applications Noria is an attempt at designing a database specifically tailored for web applications, providing automatic caching, safe and effortless schema migrations, and native support for reactive use. Biscuit: An OS kernel in a high-level language Biscuit is a monolithic, POSIX-subset operating system kernel in Go for x86-64 CPUs. We wrote it to study the performance trade-offs of using a high-level language with garbage collection to implement a kernel with a common style of architecture. Secure web-application databases The goal of this line of research is to apply cryptographic techniques practically to secure web application databases and provide strong guarantees against realistic adversaries. CSPEC: Concurrency verification with movers CSPEC is a framework in the Coq proof assistant for proving concurrent software correct using movers. The idea behind movers is to reduce the number of concurrent interleavings the programmer needs to consider. We've used CSPEC to prove a concurrent mail server correct which involves lock-free concurrency control with the file system. FSCQ: File-system verification FSCQ is the first file system with a machine-checkable proof (in the Coq proof assistant) that its implementation meets its specification and whose specification includes behavior under crashes."
