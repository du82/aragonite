["https://pdos.csail.mit.edu/projects/noria.html"]
title = "MIT CSAIL Parallel and Distributed Operating Systems Group"
full_description = "Project overview Noria is an attempt at designing a database specifically tailored for web applications, providing automatic caching, safe and effortless schema migrations, and native support for reactive use. Noria observes that, by having developers provide the set of queries their application will make in advance, the database can be smarter about how to execute those queries. In particular, it can choose to pre-compute, and incrementally maintain, the results for queries. This allows Noria to answer those queries quickly, and essentially obviates the need for application caches. Project components Streaming data model Noria is built from the bottom-up to be a streaming data system by using data-flow. This allows web applications to observe a stream of changes to the result set of queries they are interested in, which fits well with the new reactive-style web applications inspired by Meteor. Distribution and scaling The data-flow computation model used in Noria enables efficient multi-core and cross-machine implementation of the application’s set of queries. By carefully analyzing the graph, Noria can make strategic choices about what operators should be placed on which computers, what state should be materialized, and how to shard and partition the data for availability and performance. Safe schema migrations By smartly re-using this materialized state, Noria can also provide fast schema migrations. Since the raw data log is always kept, migrations can be undone easily, and queries using the pre-migration queries can still be satisfied. Furthermore, since the users only specify queries, not the underlying schema, the system can choose to internally implement the user’s queries in whatever schema it deems to be most efficient. People Jon Gjengset (PhD) Jonathan Behrens (PhD) Alana Marzoev (PhD) Lara Timbó Araújo (MEng) Gina Yuan (MEng) Samyukta Yagati (MEng) Martin Ek (NUST) Malte Schwarzkopf (Postdoc) Prof. Eddie Kohler (Harvard) Prof. M. Frans Kaashoek Prof. Robert Morris Publications Scalable fault tolerance for high-performance streaming dataflow Gina Yuan Master’s thesis, Massachusetts Institute of Technology, September 2019 Towards multiverse databases Alana Marzoev, Lara Timbó Araújo, Malte Schwarzkopf, Samyukta Yagati, Eddie Kohler, Robert Morris, M. Frans Kaashoek, and Sam Madden. HotOS XVII 2019 Noria: A new take on fast web application backends Jon Gjengset, Malte Schwarzkopf, Jonathan Behrens, Lara Timbó Araújo, Martin Ek, Eddie Kohler, M. Frans Kaashoek, and Robert Morris. ;login: The USENIX Magazine 44(1), March 2019. GDPR compliance by construction Malte Schwarzkopf, Eddie Kohler, M. Frans Kaashoek, and Robert Morris Poly 2019 Noria: dynamic, partially-stateful data-flow for high-performance web applications Jon Gjengset, Malte Schwarzkopf, Jonathan Behrens, Lara Timbó Araújo, Martin Ek, Eddie Kohler, M. Frans Kaashoek, Robert Morris OSDI’18 Multiverse databases for secure web applications Lara Timbó Araújo Master’s thesis, Massachusetts Institute of Technology, February 2018. Soup: A Flexibility-First Database Jon Gjengset, Malte Schwarzkopf, Nikhil Benesch, Eddie Kohler, M. Frans Kaashoek, Robert Morris NENS’16 Open source Noria is available on GitHub at mit-pdos/noria."
