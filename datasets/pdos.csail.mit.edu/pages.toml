["https://pdos.csail.mit.edu/projects/vuvuzela.html"]
title = "MIT CSAIL Parallel and Distributed Operating Systems Group"
full_description = "Project overview We aim to build communication systems that protect metadata (who is talking to whom) for large numbers of users. Vuvuzela is the first messaging system to provide strong metadata privacy for millions of connected users by using techniques such as mixnets and differential privacy. Alpenhorn builds on these techniques to solve the “bootstrapping problem” for metadata-private communication. Stadium, our latest system, shows how to scale these techniques horizontally over many more servers to support even more users. We are working to deploy Vuvuzela and Alpenhorn at vuvuzela.io. The code for these systems is available on Github: Vuvuzela Alpenhorn Publications Vuvuzela (SOSP ‘15): Scalable Private Messaging Resistant to Traffic Analysis. Alpenhorn (OSDI ‘16): Bootstrapping Secure Communication Without Leaking Metadata. Stadium (SOSP ‘17): A Distributed Metadata-Private Messaging System. Karaoke (OSDI ‘18): Distributed Private Messaging Immune to Passive Traffic Analysis. Yodel (SOSP ‘19): Strong Metadata Security for Voice Calls. People David Lazar Yossi Gilad Jelle van den Hooff Nirvan Tyagi Derek Leung Prof. Nickolai Zeldovich Prof. Matei Zaharia"
