full_description = '''Activity by Year PDXScholar adds works throughout the year, increasing the impact of Portland State University’s scholarship. View the repository’s growth over time, updated monthly. Total Works in the Repository Total works in PDXScholar: 36014 Works Added by Year Year Total Works Added 2025 113 2024 1920 2023 1973 2022 2276 2021 2570 2020 2438 2019 3394 2018 3469 2017 4141 2016 2698 2015 4370 2014 2754 2013 3898 // Convert year_works data into additive totals function year_sums() { var works = [3898, 2754, 4370, 2698, 4141, 3469, 3394, 2438, 2570, 2276, 1973, 1920, 113]; var sums = []; for (var w=0; w<works.length; w++) { var sum=0; for (var s=0; s<=w; s++) { sum += works[s]; } sums.push(sum); } return sums; } // Create semi-opaque version of the site's body link color for graph fill var hex = "#00759a"; function hexToRgbA(hex) { var c; if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){ c= hex.substring(1).split(''); if(c.length== 3){ c= [c[0], c[0], c[1], c[1], c[2], c[2]]; } c= '0x'+c.join(''); return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+'.2'+')'; } throw new Error('Bad Hex'); } // Generate infographic var randomScalingFactor = function(){ return Math.round(Math.random()*100)}; var lineChartData = { labels : ["2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"], datasets : [ { label: "Repository Growth By Year", fillColor : hexToRgbA(hex), strokeColor : "#00759a", pointColor : "#00759a", pointStrokeColor : "#fff", pointHighlightFill : "#fff", pointHighlightStroke : "#00759a", datasetStrokeWidth : 4, data : year_sums() }, ] } window.onload = function(){ var ctx = document.getElementById("canvas").getContext("2d"); window.myLine = new Chart(ctx).Line(lineChartData, { responsive: true, bezierCurve : false, }); }'''
