["https://pdxscholar.library.pdx.edu/about.html"]
title = "About | PDXScholar: The Institutional Repository of Portland State University"
full_description = "About PDXScholar PDXScholar, the campus repository for PSU, includes over 35,000 PSU-produced articles, presentations, videos, post-prints, and other works that have been downloaded over 15 million times. PDXScholar makes the research and creative works of Portland State University faculty, staff, and students easily discoverable and available to anyone, anywhere in the world. Our mission is to support scholarship, promote research and cross-disciplinary collaboration, provide access to digital instructional materials created by the PSU community, and record the history of the University. PDXScholar provides access to: Published scholarly articles by faculty and/or staff Open access textbooks and course materials Open access journals and conference proceedings Student projects, posters, capstones, theses, and dissertations Creative works, webinars, video/audio interviews, historical archives Over 500 other colleges and universities in a shared repository network: Browse the Digital Commons Network Our aim is to: Support the University's mission to lead the way to an equitable and sustainable future Save students money through the creation and publication of open access textbooks Support journal publishing to enhance student participation in the knowledge cycle Foster collaboration and showcase student-centered events Increase citation impact via powerful SEO for higher Google ranking Support unlimited file types: streaming media, images, data, and more Meet data management requirements for dissemination and preservation Facilitate co-creation and showcase research impacting our communities: View Featured Collections Promote and support open access where possible (fewer paywalls for researchers): PSU Open Access Publications Policy Submit Your Work Faculty and staff can use this form to submit work to PDXScholar: Submit Your Work PDXOpen: Open Access Textbooks & Open Educational Resources PDXOpen is a collection of open access textbooks and open educational resources (OER). PDXOpen: Increases student success by saving students money Provides free high-quality course-specific online textbooks Empowers instructors to engage in new pedagogical models Provides technical support for instructors to implement OER in courses Creates campus-wide partnerships to share expertise Encourages and supports the adoption, adaptation, and creation of OER Leverages the University's institutional repository for dissemination Learn More: Browse Textbooks Guide to OERs Inquire about OER Creation: Email Digital Initiatives staff Journal Hosting The Library supports open access peer-reviewed journal publishing. General Information: All journals are open access and do not charge fees. The platform does not offer subscriptions or print issues. The Library provides consulting and support for editors, authors, and readers. All articles in PSU-hosted journals have Creative Commons licenses. Features: Custom-designed website Online submission forms Tools to manage peer review Usage statistics Learn More: Browse Journals Journal Proposal Form Conference Hosting Event management tools support established and new symposiums and conferences. Features: Custom-designed website Online form for proposal submissions Schedule of events with session dates/times Multimedia support: audio/video and captions Usage statistics Learn More: Browse Events Request Hosting: Email Digital Initiatives staff Data Sharing and Preservation PDXScholar meets data preservation requirements for dissemination. Reasons to share your data: Increase research impact. NIH, NSF, and many funding agencies require data preservation. Some journals and societies require data publishing and preservation. Learn More: Guide to Data Management Inquire about data hosting: Email Digital Initiatives staff Have a suggestion or idea? Submit Our Feedback Form Still have questions? Email Digital Initiatives staff"
year_published = 2025
