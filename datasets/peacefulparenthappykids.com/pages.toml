title = "Attachment Parenting Made Easy"
description = "Attachment parenting is supported by an impressive body of research, but the basic idea is quite simple."
full_description = '''Attachment Parenting There's nothing new about Attachment parenting; parents have been doing it naturally for as long as humans have existed. Attachment parenting is based on responding to a baby’s needs, which in infancy include staying in very close proximity to the parent. Once the baby learns that her caretakers are reliably nurturing and protective, she builds on this internal security as she proceeds to the next developmental tasks of exploration, mastery of the environment, and forming relationships with others. Attachment parenting is now supported by an impressive body of academic theory and research, but the basic idea is simple and intuitively obvious. Human babies are born helpless because of their big brains. To survive, they need parents to keep them from harm’s way for many years, and to teach them survival skills. So all humans are born seeking close attachments. Our brain development, our emotional development -- even our later ability to control our tempers and delay gratification -- all depend on having our innate relationship needs met as infants. The Attachment Parenting philosophy arises from actual research; both longitudinal studies of children and their parents, and advances in understanding infant brain development. But Attachment Parenting is not a set of rules, and every parent uses it a bit differently. Parenting is an art, not a science. As always, use your own deepest wisdom to decide what's best for you and your family. Start Here: Attachment Parenting Q&A Considering Attachment Parenting but wondering about the pros and cons? Check the most frequently asked questions and see if your questions are here. You may also want to read Should I use attachment parenting? Read More Attachment Parenting Basics So how do you get started with Attachment Parenting? There are no rules, just a few guidelines to help you make the minute to minute decisions as you meet your baby's needs. Contrary to some opinions (from folks who don't practice it!), attachment parenting is actually easier than parent-centered parenting, because it creates a happier, healthier baby who is more connected to parents, and therefore more cooperative, throughout his childhood. Read More Secure Attachment: The Research Is "Attachment Parenting" a science? Yes. Read More The Continuum Concept The Continuum Concept, explained by Jean Liedloff in her book of the same name, is the idea that in order to achieve optimal physical, mental and emotional development, human beings — especially babies — require the kind of experience to which our species adapted during the long process of our evolution. We may live in the modern age, where life is very different. But our genes evolve very slowly. That means that babies are born genetically equipped for life as it was lived thousands of years ago. They aren't designed to handle what we ask of them in our modern culture. Read More Attachment Parenting Pros and Cons Should you Attachment Parent your child? Research shows that babies thrive when their attachment needs are met, so the answer is clearly yes, if we define Attachment Parenting as responding to the baby’s need for connection. But as a psychologist, I'm concerned by how controversial the idea of Attachment Parenting has become. Of course you want a Securely Attached child, but are there specific rules that will help your child develop into one? And does that mean you can't set limits? Let’s define our terms. Read More View All Articles on Attachment Parenting Parent Reviews "I read your Toddler tips yesterday and tried each suggestion, and LO! My daughter has not been fighting me! Like some kind of magic it just works!" Karina Dr. Laura is a parent whisperer! - Liz McIntosh Liz McIntosh Dr. Laura's parenting advice completely changed my relationship with my daughter, improved her self-esteem, and transformed our lives. Providing my daughter with acknowledgement of her feelings and point of view reduced her oppositional behaviors and emotional meltdowns to nearly none. - Jodie Tokatlian Dr. Laura, you have created miracles, large and small, in so many lives and our children thank you. Folks, she's brilliant. It's wonderful to have parenting experts who don't see the child as the enemy in a locked combat, for one thing. I recommend it. "I'd really recommend Laura Markham's Aha! parenting books and website for brilliantly practical ways to parent with kindness instead of punishment." - Makchoon Makchoon I have seen amazing improvement in my *very* angry 17 year-old son after acknowledging that there was a reason he was so angry and acting out. We have had several heartfelt conversations and I have seen a real change in how he treats his younger brother, and how he treats me. I know that I am a better parent thanks to Dr. Laura's inspirational words and suggestions. I love AhaParenting because there is always a "pick yourself up and try again" to it. - Chantal Harrison Chantal Harrison It's like these emails were meant for me. - Caroline Henry "Just wanted to say how much I appreciate receiving your regular emails. They've improved my parenting (and me as a person!) and made my children's lives better. Thank you!" - Andrei Andrei My daughter reacts so much better when I empathize and stay patient. And now I get to model that behavior instead of letting my frustration get the better of me. Thank YOU so much for your encouraging weekly newsletters and your Facebook posts. Since I began following your approach, I have noticed a difference in the compassion I show to myself, and how much more that helps me connect with my kids. We are all feeling a lot more overall peace! Thank you for your weekly emails and your books. They're a life line for me when I really need support during a rough patch. - Lisa Fernandez Lisa Fernandez Today I say thank you, tears streaming from my face, so proud of my little boy and all he will become. Thank you. - Jennifer B. Jennifer B Yes. It works. And the more rest I get, the more patience I have. It makes a difference. Dear Dr. Laura Markham! I am a mother of 2 boys - 16 and 7 years old. I am extremely grateful for all the emotional and relational education that you provide us and also for your incredible loving energy to support our evolution as parents, as human beings. I took your course 3 years ago. Although the challenges of the parent-child relationship change almost every year, your parenting principles are equally valuable and effective. It's hard to reprogram the emotional-behavioral pattern learned in my own childhood... so I find it very helpful to go back to your teachings to regain trust and patience as a parent every time new challenges trigger my anxiety. To have more clarity, to reset my energy. Thank you!! Janina-Madalina Dobrescu Your philosophies are the only tools we've come across which offer practical advice grounded in clearly laid out lay terminology. Our family life day-to-day is nothing short of a miracle, thanks to you! - Dana Questad Dana Questad Previous Next (function($){ $('#testimonialSidebarControls .carousel-inner .carousel-item:eq(0)').addClass('active'); }(jQuery));'''
