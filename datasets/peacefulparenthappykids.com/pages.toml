["https://peacefulparenthappykids.com/about"]
title = "About | Peaceful Parent Happy Kids"
description = "How to stop yelling a start connecting. A groundbreaking guide to raising responsible, capable, happy kids."
full_description = '''Peaceful Parent, Happy Kids Changing the world one child at a time by supporting parents. Dr. Laura Markham gives you trustworthy, effective, evidence-based guidance and a clear path towards a more connected, loving family life using proven techniques and science-rooted practical approaches that really work. Whether you’re wondering how to handle a specific challenge, just figuring out your child-raising approach, or ready to tear your hair out, you’ve come to the right place. I discovered Peaceful Parent, Happy Kids late one night when I was in despair after another day of screaming and defiance. All I can say is the most sincere thank you I have ever said. A year later, he hugs me spontaneously, tells me I am the best mom ever, and actually does what I ask him to do. None of this would have happened without you, Dr. Laura Markham. I wish every parent could be given a link to your free website when their baby is born. What is Peaceful Parent, Happy Kids? Peaceful Parent Happy Kids stands apart because of the unique integration of clear, evidence-based theory and go-to practical effectiveness that guides parents into more peaceful, loving and joyful connection with their children. We translate the latest research findings in neurobiology, development, attachment and mindfulness into actionable practices for parents engaged in the hard work of raising emotionally healthy, resilient, whole children. Do you want your child to WANT to cooperate, without yelling, bribes, threats or punishment? Would you like to connect more with your child to build a stronger, sweeter bond instead of struggling for control? Do you want to raise kids who grow up into happy, considerate, responsible, competent people? Do you consider yourself to be using some or all of the practices of “gentle” or "conscious" parenting, and want an experienced resource to consult about the challenges that emerge with each stage? Do you want to know how to raise a 21st century kid using eternal values? Do you want to feel more inspired and confident as a parent? You've come to the right place! About Dr. Laura Markham Dr. Laura Markham trained as a Clinical Psychologist at Columbia University, but she's also a mom, so she understands kids -- and parents! She uses her Ph.D. to translate proven science and child-development research into the practical solutions you need for the family life you want. Dr. Laura Markham is the author of three best-selling books that have been translated into 27 languages and continue to receive daily five-star reviews on Amazon: Peaceful Parent, Happy Kids: How to Stop Yelling and Start Connecting Peaceful Parent, Happy Siblings: How to Stop the Fighting and Raise Friends for Life Peaceful Parent, Happy Kids WORKBOOK: Using Mindfulness and Connection to Raise Resilient, Joyful Children and Rediscover your Love of Parenting Dr. Laura Markham's relationship-based parenting model, which she calls Peaceful Parenting, is rooted in research and parent-tested. She's helped thousands of families across the U.S. and Canada find transformative solutions to everything from separation anxiety and sleep problems to sass talk and cell phones. Dr. Laura Markham makes frequent TV and radio appearances and has been interviewed for thousands of articles by publications as diverse as The Wall Street Journal, The New York Times, Real Simple, Newsday, Men's Health, Redbook and Parents Magazine. She lives in Brooklyn, New York and is the proud parent of two thriving young adults who were raised with Peaceful Parenting. 170,000 parents subscribe to Dr. Laura's free weekly Parenting Tips newsletter, which you can sign up for here. Learn more about the Course that changes lives, Dr. Laura's Peaceful Parent, Happy Kids Online Course. Browse downloadable ebooks and audios. Invite Dr. Laura Markham to speak to your group! Join us on Facebook or Instagram. Connect with a Certified Parenting Coach trained by Dr. Laura Markham 3 Simple Big Ideas 1 Regulate Your Own Emotions Kids learn to manage their emotions when their parents model how it's done. That’s why Dr. Laura’s free coaching emails give you a blueprint for self-regulation, and the self-care that makes it possible. 2 Connect with Your Child From tantrums to texting, the secret of happy parenting is a close relationship with your child. Without that connection, we have little influence (”My kids won’t listen!”) and parenting becomes exhausting. 3 Coach Instead of Controlling Coach, instead of trying to control, so your child wants to cooperate with you. Sure, you need to set limits—but if you set them with empathy and respect, you’ll find your child is much more likely to comply. What Are The Benefits? Your kids will be happier, more cooperative , and well-adjusted -- a joy to parent, most of the time. You'll be happier and more relaxed. Your family life will be more meaningful and fun. Connecting puts the sweetness back into parenting. You'll raise ethical, emotionally intelligent kids who are happy, considerate, self-disciplined, responsible, and likable -- without ever having to punish! You'll give your kids a real childhood while still preparing them for 21st century life. You and your kids will have a close, loving relationship for the rest of your life. Testimonials Does this kind of parenting work? Hear what parents have to say! Yours is the best advice I've found so far on what to do when you, the parent, are angry. Most say something like, "Deal positively with your anger!" which makes me say, "Like HOW?" My strong-willed three year old almost never has a tantrum any more...he tells me what’s upsetting him and works to find a solution we can both live with. Thank you for all the wonderful information you make available for free on the Aha! Parenting website... You’ve saved my sanity! Read More Less Drama, More Love.Welcome to the work of parenting. Of course, that's where the rewards are, too.'''
