title = "Anger and Aggression"
description = "Instead of sending an angry child to their room to calm down, teaching a lesson, or demanding an apology, help your child learn to handle their anger responsibly."
full_description = '''Anger and Aggression Many parents send an angry child to her room to "calm down." After all, what else can we do? We certainly can't reason with her when she's furious. It's no time to teach lessons or ask for an apology. She needs to calm down. But it's worth considering whether that's the best option in dealing with anger. Imagine being angry at your partner. What if they said "Go calm down; come back when you can talk about this politely." Would you feel heard? Would you start to calm down? Or might you explode? What can we do instead? We can help our children learn to manage their anger responsibly. Start Here: 10 Tips To Help Your Child With Anger "The truth about rage is that it only dissolves when it is really heard and understood, without reservation." - Carl Rogers. Read More When Your Child Gets Angry: The Crash Course "Do not teach your children never to be angry; teach them HOW to be angry ." - Lyman Abbott Read More When Your Child Gets Angry: The Cheat Sheet "I agree with everything in your article When Your Child Gets Angry: The Crash Course, but I can't remember all that in the heat of the moment. Can you give us a very short version?" Great idea! Everyone needs the short version on their refrigerator. Here's the cheat sheet on what to do when your child gets angry. Read More When Your Child Hits You: A Script Read More When Your Toddler Hits You: A Script "Children naturally lean toward affection and companionship. When you see a child fiercely attacking her loved ones, you can assume that she is sitting on extremely painful feelings. An angry child is quite frightened and sad underneath her tough stance. However small the issue, she feels that something absolutely vital to her is being threatened, and she has no choice but to fight. She also feels alone. As far as she can tell, no one understands her, no one will come to her rescue, and everyone is out to hurt her. - Patty Wipfler Read More View All Articles on Anger and Aggre