description = "Parents are the most important influence on whether kids drink alcohol, and the earlier you start these conversations, the better."
full_description = '''Alcohol and Drugs Parents are the most important influence on whether kids drink alcohol, and the earlier you start these conversations, the better. Kids whose parents teach them the risks of using drugs and alcohol are half as likely to use them. Start having this conversation early. It is a topic you'll want to revisit over the years as your child reaches new levels of understanding -- and temptation. Start Here: Talking To Your Child About Alcohol: What To Ask & What To Say "Last summer a teen in my community died in a car accident after a drinking party. Can you give tips on how to talk to my kids about alcohol? They're 7 and 11." Read More View All Articles on Alcohol and Drugs Parent Reviews "I read your Toddler tips yesterday and tried each suggestion, and LO! My daughter has not been fighting me! Like some kind of magic it just works!" Karina Dr. Laura is a parent whisperer! - Liz McIntosh Liz McIntosh Dr. Laura's parenting advice completely changed my relationship with my daughter, improved her self-esteem, and transformed our lives. Providing my daughter with acknowledgement of her feelings and point of view reduced her oppositional behaviors and emotional meltdowns to nearly none. - Jodie Tokatlian Dr. Laura, you have created miracles, large and small, in so many lives and our children thank you. Folks, she's brilliant. It's wonderful to have parenting experts who don't see the child as the enemy in a locked combat, for one thing. I recommend it. "I'd really recommend Laura Markham's Aha! parenting books and website for brilliantly practical ways to parent with kindness instead of punishment." - Makchoon Makchoon I have seen amazing improvement in my *very* angry 17 year-old son after acknowledging that there was a reason he was so angry and acting out. We have had several heartfelt conversations and I have seen a real change in how he treats his younger brother, and how he treats me. I know that I am a better parent thanks to Dr. Laura's inspirational words and suggestions. I love AhaParenting because there is always a "pick yourself up and try again" to it. - Chantal Harrison Chantal Harrison It's like these emails were meant for me. - Caroline Henry "Just wanted to say how much I appreciate receiving your regular emails. They've improved my parenting (and me as a person!) and made my children's lives better. Thank you!" - Andrei Andrei My daughter reacts so much better when I empathize and stay patient. And now I get to model that behavior instead of letting my frustration get the better of me. Thank YOU so much for your encouraging weekly newsletters and your Facebook posts. Since I began following your approach, I have noticed a difference in the compassion I show to myself, and how much more that helps me connect with my kids. We are all feeling a lot more overall peace! Thank you for your weekly emails and your books. They're a life line for me when I really need support during a rough patch. - Lisa Fernandez Lisa Fernandez Today I say thank you, tears streaming from my face, so proud of my little boy and all he will become. Thank you. - Jennifer B. Jennifer B Yes. It works. And the more rest I get, the more patience I have. It makes a difference. Dear Dr. Laura Markham! I am a mother of 2 boys - 16 and 7 years old. I am extremely grateful for all the emotional and relational education that you provide us and also for your incredible loving energy to support our evolution as parents, as human beings. I took your course 3 years ago. Although the challenges of the parent-child relationship change almost every year, your parenting principles are equally valuable and effective. It's hard to reprogram the emotional-behavioral pattern learned in my own childhood... so I find it very helpful to go back to your teachings to regain trust and patience as a parent every time new challenges trigger my anxiety. To have more clarity, to reset my energy. Thank you!! Janina-Madalina Dobrescu Your philosophies are the only tools we've come across which offer practical advice grounded in clearly laid out lay terminology. Our family life day-to-day is nothing short of a miracle, thanks to you! - Dana Questad Dana Questad Previous Next (function($){ $('#testimonialSidebarControls .carousel-inner .carousel-item:eq(0)').addClass('active'); }(jQuery));'''
