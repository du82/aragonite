description = "Believe it or not, there are parents whose kids and teens talk to them, and even ask their advice! Find out how you could be one of those parents."
full_description = '''Communication Fewer than half of all sixth graders describe their family communication as positive. Worse yet, only 22% of high school seniors do. What would your kids say? Most tweens and teens regretfully report that there are things about which they can’t talk with their parents, either because their parents won’t listen, won’t understand, or will over-react. But believe it or not, there are parents whose kids who talk to them, and even ask their advice -- including teenagers! This web site is dedicated to the possibility that you could be one of those parents. Because, let's face it, your ability to parent depends on knowing what’s happening in your child’s life, and being able to influence her. And that derives directly from the depth of communication you share. Deep communication is only possible if you find ways to talk about the hard stuff, so that she feels comfortable sharing with you. But forget about having the “Big Talk,” whether about sex or anything else. Few subjects worth discussing with your child can be covered in one conversation. A rich family life means you talk about anything and everything, all the time. These discussions go on a little bit at a time, daily, for your child’s entire childhood, evolving as she does. Start Here: How to Get Your Child to LISTEN! One of the most common questions I hear from parents is: How can I get my kid to LISTEN to me? Read More 255 Conversation Starters for Family Discussions "We're going camping on vacation and I'd love to have some meaningful family discussions while we hike, but I don't even know where to begin to get the kids to open up and talk." Read More Want your child to talk to you? Become a brilliant listener! "What did you do in school today?""Nothing." Parents often ask what they can say to get their child talking. The secret isn't about what you say. It's about how you listen. Read More Can Your Child Trust You? If they can trust you with the little stuff, they’ll come to you with the big stuff. Read More How to Turn Tough Conversations Into Learning Opportunities Almost from the time our kids can talk, there are conflicts we need to work through with them: Read More Secrets of Closer Communication "By far the most important form of attention we can give our loved ones is listening... True listening is love in action." -M. Scott Peck Read More Foolproof Strategies for Getting Kids to Talk "Most families tend to rush through dinner, especially the kids. They can't wait to get back to their computers and cell phones and iPods. But they'll stick around if the conversation is interesting. And the biggest determinant is YOU. If you see yourself and your life as a crashing bore, your kids will see the same thing. But if you see your life as an endless succession of miraculous and fascinating events, your kids will be transformed by it." -Shmuley Boteach Read More How (and When) To Apologize To Your Child Most parents find themselves insisting that their child apologize to a sibling, friend or adult on a regular basis. And yet when we mess up with our child, we often resist apologizing. Read More View All Articles on Communication Parent Reviews "I read your Toddler tips yesterday and tried each suggestion, and LO! My daughter has not been fighting me! Like some kind of magic it just works!" Karina Dr. Laura is a parent whisperer! - Liz McIntosh Liz McIntosh Dr. Laura's parenting advice completely changed my relationship with my daughter, improved her self-esteem, and transformed our lives. Providing my daughter with acknowledgement of her feelings and point of view reduced her oppositional behaviors and emotional meltdowns to nearly none. - Jodie Tokatlian Dr. Laura, you have created miracles, large and small, in so many lives and our children thank you. Folks, she's brilliant. It's wonderful to have parenting experts who don't see the child as the enemy in a locked combat, for one thing. I recommend it. "I'd really recommend Laura Markham'