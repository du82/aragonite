title = "Self-Esteem"
description = "How to build high self esteem in your child, so that they see themselves as good and capable and that they are"
full_description = '''Self-Esteem High self esteem means we see ourselves as good and capable, that we're "secure" in our value or worthiness. Low self esteem means we see ourselves as not quite good enough, not measuring up. Every parent wants their children to love themselves, to be confident, happy people. There is no such thing as self esteem being too high. We cannot see ourselves as too good, too capable, too worthwhile, and that actually allows us to become more generous and caring people. Start Here: Can Your Child's Self Esteem Be Too High? "Unconditionality...a solid core of belief in yourself, an abiding sense that you're competent and worthwhile--even when you screw up or fall short--that creates a more stable form of self-esteem, which, in turn, carries a range of psychological and social advantages."-Alfie Kohn Read More Four Easy Ways to Build Your Child's Self Esteem "If you want your children to improve, let them overhear the nice things you say about them to others." – Haim Ginott Read More View All Articles on Self-Esteem Parent Reviews "I read your Toddler tips yesterday and tried each suggestion, and LO! My daughter has not been fighting me! Like some kind of magic it just works!" Karina Dr. Laura is a parent whisperer! - Liz McIntosh Liz McIntosh Dr. Laura's parenting advice completely changed my relationship with my daughter, improved her self-esteem, and transformed our lives. Providing my daughter with acknowledgement of her feelings and point of view reduced her oppositional behaviors and emotional meltdowns to nearly none. - Jodie Tokatlian Dr. Laura, you have created miracles, large and small, in so many lives and our children thank you. Folks, she's brilliant. It's wonderful to have parenting experts who don't see the child as the enemy in a locked combat, for one thing. I recommend it. "I'd really recommend Laura Markham's Aha! parenting books and website for brilliantly practical ways to parent with kindness instead of punishment." - Makchoon Makchoon I have seen amazing improvement in my *very* angry 17 year-old son after acknowledging that there was a reason he was so angry and acting out. We have had several heartfelt conversations and I have seen a real change in how he treats his younger brother, and how he treats me. I know that I am a better parent thanks to Dr. Laura's inspirational words and suggestions. I love AhaParenting because there is always a "pick yourself up and try again" to it. - Chantal Harrison Chantal Harrison It's like these emails were meant for me. - Caroline Henry "Just wanted to say how much I appreciate receiving your regular emails. They've improved my parenting (and me as a person!) and made my children's lives better. Thank you!" - Andrei Andrei My daughter reacts so much better when I empathize and stay patient. And now I get to model that behavior instead of letting my frustration get the better of me. Thank YOU so much for your encouraging weekly newsletters and your Facebook posts. Since I began following your approach, I have noticed a difference in the compassion I show to myself, and how much more that helps me connect with my kids. We are all feeling a lot more overall peace! Thank you for your weekly emails and your books. They're a life line for me when I really need support during a rough patch. - Lisa Fernandez Lisa Fernandez Today I say thank you, tears streaming from my face, so proud of my little boy and all he will become. Thank you. - Jennifer B. Jennifer B Yes. It works. And the more rest I get, the more patience I have. It makes a difference. Dear Dr. Laura Markham! I am a mother of 2 boys - 16 and 7 years old. I am extremely grateful for all the emotional and relational education that you provide us and also for your incredible loving energy to support our evolution as parents, as human beings. I took your course 3 years ago. Although the challenges of the parent-child relationship change almost every year, your parenting principles are equally 