title = "Sleep"
description = "Sleep is so important to maintain well-being for both children and parents. Here’s how to help young kids learn to relax into sleep, without leaving them to cry."
full_description = '''Sleep Sleep is incredibly important to maintain well-being for both children and parents. Sleep routines can also be a valuable time for connection. Helping children set their biological clocks, empty their emotional backpacks, and get enough exercise during the day can all help develop healthy sleep patterns. And when that isn’t enough, here’s how to help young children learn to relax into sleep, without leaving them to cry. Start Here: Help Your Toddler Learn to Put Himself to Sleep Toddlers don't seem to have an off switch. Often, when they're tired, they just reverberate faster, like an over-wound toy, until they crash. Read More Bedtime Routine for Kids Who Have a Hard Time Falling Asleep at Night Dr. Laura, My almost eight year old daughter has a very hard time falling asleep at night. Right now it is worse than ever as I am trying to get her out of the summer routine and back into a school routine. We have to wake up around 6:30 a.m. for school. I have been waking her up earlier, hoping that she will fall asleep earlier at night but it seems to be back-firing. Even though I start the bedtime routine around 8:30 p.m. she isn't falling asleep until around 10:15. It is making us both very anxious and she keeps saying "I can't sleep. My body feels too cuckoo." I've tried kid yoga videos, I scratch her back, I read books, sing, I do everything. She is now exhausted in the day and is acting very hyper-active and revved up but I know she is really just tired out. Thank you! Nina Read More Teaching Your Baby to Put Himself to Sleep How do you get your baby to go to sleep and sleep through the night?He may accomplish that milestone on his own, soon. Or he may need a little help from you to learn how to put himself to sleep, not just at bedtime but throughout the night. All humans have sleep cycles that take us into slightly wakened states during the night, and we all need to learn the skill of falling back into a deep sleep. Read More The Case Against Ferber Sleep Training I'll admit up front that I'm biased against Ferberizing, or Ferbering, as it is sometimes called. As a psychologist, I follow the research, which has convinced me that babies do better if parents respond when they cry, whether it's light or dark outside. Read More Getting Your Preschooler To Sleep Wondering how to get your three, four or five year old into bed -- and how to get him to stay there all night? You're not alone! I hear from parents all the time about their preschoolers falling asleep on the couch or in front of the TV, anywhere but their own beds. Read More Infants and Sleep Most new parents are shocked by the constant interruption of their sleep that a newborn brings to the house. But there are ways to be there when your baby needs you, and still get some rest. Read More View All Articles on Sleep Parent Reviews "I read your Toddler tips yesterday and tried each suggestion, and LO! My daughter has not been fighting me! Like some kind of magic it just works!" Karina Dr. Laura is a parent whisperer! - Liz McIntosh Liz McIntosh Dr. Laura's parenting advice completely changed my relationship with my daughter, improved her self-esteem, and transformed our lives. Providing my daughter with acknowledgement of her feelings and point of view reduced her oppositional behaviors and emotional meltdowns to nearly none. - Jodie Tokatlian Dr. Laura, you have created miracles, large and small, in so many lives and our children thank you. Folks, she's brilliant. It's wonderful to have parenting experts who don't see the child as the enemy in a locked combat, for one thing. I recommend it. "I'd really recommend Laura Markham's Aha! parenting books and website for brilliantly practical ways to parent with kindness instead of punishment." - Makchoon Makchoon I have seen amazing improvement in my *very* angry 17 year-old son after acknowledging that there was a reason he was so angry and acting out. We have had several heartfelt conversations and I have seen a real change in how he treats his younger brother, and how he treats me. I know that I am a better parent thanks to Dr. Laura's inspirational words and suggestions. I love AhaParenting because there is always a "pick yourself up and try again" to it. - Chantal Harrison Chantal Harrison It's like these emails were meant for me. - Caroline Henry "Just wanted to say how much I appreciate receiving your regular emails. They've improved my parenting (and me as a person!) and made my children's lives better. Thank you!" - Andrei Andrei My daughter reacts so much better when I empathize and stay patient. And now I get to model that behavior instead of letting my frustration get the better of me. Thank YOU so much for your encouraging weekly newsletters and your Facebook posts. Since I began following your approach, I have noticed a difference in the compassion I show to myself, and how much more that helps me connect with my kids. We are all feeling a lot more overall peace! Thank you for your weekly emails and your books. They're a life line for me when I really need support during a rough patch. - Lisa Fernandez Lisa Fernandez Today I say thank you, tears streaming from my face, so proud of my little boy and all he will become. Thank you. - Jennifer B. Jennifer B Yes. It works. And the more rest I get, the more patience I have. It makes a difference. Dear Dr. Laura Markham! I am a mother of 2 boys - 16 and 7 years old. I am extremely grateful for all the emotional and relational education that you provide us and also for your incredible loving energy to support our evolution as parents, as human beings. I took your course 3 years ago. Although the challenges of the parent-child relationship change almost every year, your parenting principles are equally valuable and effective. It's hard to reprogram the emotional-behavioral pattern learned in my own childhood... so I find it very helpful to go back to your teachings to regain trust and patience as a parent 