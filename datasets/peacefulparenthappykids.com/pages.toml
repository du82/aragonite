n beings. I took your course 3 years ago. Although the challenges of the parent-child relationship change almost every year, your parenting principles are equally valuable and effective. It's hard to reprogram the emotional-behavioral pattern learned in my own childhood... so I find it very helpful to go back to your teachings to regain trust and patience as a parent every time new challenges trigger my anxiety. To have more clarity, to reset my energy. Thank you!! Janina-Madalina Dobrescu Your philosophies are the only tools we've come across which offer practical advice grounded in clearly laid out lay terminology. Our family life day-to-day is nothing short of a miracle, thanks to you! - Dana Questad Dana Questad Previous Next (function($){ $('#testimonialSidebarControls .carousel-inner .carousel-item:eq(0)').addClass('active'); }(jQuery));'''
