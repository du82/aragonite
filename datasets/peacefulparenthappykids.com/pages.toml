title = "Babies (age 4-14 months)"
description = "Your baby's developmental tasks, your priorities, and a simple Gameplan, to make your life easier when you've got only three minutes to read before he wakes up."
full_description = '''Babies Age 4-14 months Your baby is growing up! How did that breath-taking newborn become such an adorable bundle of energy and fun? And you, how did you get to be such a confident parent, knowing -- at least most of the time -- how to comfort your baby, feed her, connect with her? Your adoration of your baby means she wants to please you, which means a happy child who cooperates even as she heads into her second year. And the intimate connection you've created with your baby lays the foundation for a rewarding parent-child relationship for the rest of her life. Next on the agenda: sitting up, crawling, and walking, all in short order. Start Here: Peaceful Parenting Your Baby: Your Game Plan Your baby is developing his own personality. What do you need to know to be a great parent? Your growing baby's developmental tasks, your priorities, and a simple Parents' Gameplan, all set up to make your life easier when you've got only three minutes to read before he wakes up. Read More Teaching Your Baby to Put Himself to Sleep How do you get your baby to go to sleep and sleep through the night?He may accomplish that milestone on his own, soon. Or he may need a little help from you to learn how to put himself to sleep, not just at bedtime but throughout the night. All humans have sleep cycles that take us into slightly wakened states during the night, and we all need to learn the skill of falling back into a deep sleep. Read More Is Your Baby Ready For Solid Foods? Feeding your baby real solid food after six months of breast milk or formula is an exciting time, for you and for him. Before you dive into this big transition, though, there are some questions you'll want to ask yourself. Read More 19 Ways To Keep Your Baby or Toddler Happy During Diaper Changes Dr. Laura, My 11 month old is really happy he's learned to sit up, explore everything in hands reach and roll during diaper changes. He gets so distraught during diaper changes when I prevent him from using these new skills. If I flip him back onto his back after he's rolled onto his tummy giggling or if I keep him from practicing his sit-up skills he turns from happy giggles to sobs and tears. And it is clear that he thinks I am being mean by not allowing him this sweet play exploration that prevents me changing his diaper... he tells me he's so frustrated in his sobs and yells of "momma". I've tried many different things to distract him or keep his attention... toys, dancing, singing, talking, music... all to no avail. He wants to sit-up, roll over and play with whatever diaper accessory I've brought his way. I hate that he hates diaper changes and have no idea what to do. The changes now trigger anxiety for him. I can totally understand his upset during certain changing times such as middle of the night wet diapers while he's hungry and sleepy. But what can I do during other times when he's clearly distressed that my changing his diaper is preventing him from newfound skills and exploring? Read More What's Best for Baby Brain Development? Dr. Laura... Now that my daughter is seven months old, I'd like to know how to best spend each day with her: how much alone play, interactive play, what activities, are there any essential toys, and so on. I pretty much follow her lead throughout the day, but I want to make sure I'm including beneficial activities for her. She is bright, and I'd like to help cultivate that without being overly structured. I'd like to ensure that every moment spent with her is a quality one. Thank you! Read More Secure Attachment: The Research Is "Attachment Parenting" a science? Yes. Read More View All Articles on Babies Parent Reviews "I read your Toddler tips yesterday and tried each suggestion, and LO! My daughter has not been fighting me! Like some kind of magic it just works!" Karina Dr. Laura is a parent whisperer! - Liz McIntosh Liz McIntosh Dr. Laura's parenting advice completely changed my relationship with my daughter, improved her self-esteem, and transformed our lives. Providing my daughter with acknowledgement of her feelings and point of view reduced her oppositional behaviors and emotional meltdowns to nearly none. - Jodie Tokatlian Dr. Laura, you have created miracles, large and small, in so many lives and our children thank you. Folks, she's brilliant. It's wonderful to have parenting experts who don't see the child as the enemy in a locked combat, for one thing. I recommend it. "I'd really recommend Laura Markham's Aha! parenting books and website for brilliantly practical ways to parent with kindness instead of punishment." - Makchoon Makchoon I have seen amazing improvement in my *very* angry 17 year-old son after acknowledging that there was a reason he was so angry and acting out. We have had several heartfelt conversations and I have seen a real change in how he treats his younger brother, and how he treats me. I know that I am a better parent thanks to Dr. Laura's inspirational words and suggestions. I love AhaParenting because there is always a "pick yourself up and try again" to it. - Chantal Harrison Chantal Harrison It's like these emails were meant for me. - Caroline Henry "Just wanted to say how much I appreciate receiving your regular emails. They've improved my parenting (and me as a person!) and made my children's lives better. Thank you!" - Andrei Andrei My daughter reacts so much better when I empathize and stay patient. And now I get to model that behavior instead of letting my frustration get the better of me. Thank YOU so much for your encouraging weekly newsletters and your Facebook posts. Since I began following your approach, I have noticed a difference in the compassion I show to myself, and how much more that helps me connect with my kids. We are all feeling a lot more overall peace! Thank you for your weekly emails and your books. They're a life line for me when I really need support during a rough patch. - Lisa Fernandez Lisa Fernandez Today I say thank you