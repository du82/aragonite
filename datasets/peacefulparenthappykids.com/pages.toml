title = "Bullying"
description = "You can't bully-proof your child, but you can support him to develop the skills to protect himself, and to seek help when he's in over his head."
full_description = '''Bullying Bullying is a repeated, purposeful abuse of power, meant to cause harm to the other person. If we don't have access to power in healthy ways, it can be hard to resist using it in unhealthy ways. You cannot bully-proof your child, but you can support him to develop the awareness and skills to protect himself when necessary, and to seek help when he's in over his head. Start Here: 12 Ways to Empower Your Child Against Bullying -- Including CyberBullying What is bullying? StopBullying.gov defines "bullying" as repeated unwanted, aggressive behavior in which a child or teen uses a real or perceived power imbalance, such as physical strength, access to embarrassing information, or popularity, to control or harm other kids. Bullying can include anything from spreading rumors to name-calling to physical aggression, but this is not simply being rude or unkind once. All children will have their feelings hurt, will be teased, will feel excluded at some point. Bullying is a repeated, purposeful abuse of power, directed at a specific target, and meant to cause harm to that person. Read More Strategies for Kids to Fend Off Bullying Most kids will at some point experience unkindness from another child. While bullying is defined as "repeated" aggressive speech or behavior, the child's response to the initial unkind words can determine whether the bully continues to target this particular child. If the aggression gives the bully what he's looking for -- a feeling of power from successfully pushing the other child's buttons -- the aggression may well escalate. Read More Talking with Teens and Preteens about Bullying I received a phone call from another mom the other day. She told me that my son was part of a group that was "teasing" her daughter at school about her weight. I asked my son about this and he said that he knew nothing about the situation. I did not get any calls from the teachers about this either. I want to believe my son. How do I address this further? Read More Using Play to Help a Child Who Has Been Bullied, Bossed Dr. Laura, I would like some inspiration with helping our 4 year old son with an issue at nursery. He and his teachers have told us he is being sidelined and bossed around by a little girl (who obviously has issues of her own.) It's preventing him from engaging in other activities and making friends. I've given roleplay and assertiveness a go. We've also made playdates with other kids. On the whole he is a well balanced child who enjoys a variety of activities. Teachers do their best to redirect. I am on a career break so we get lots of opportunity to play/ have fun/ connect with daddy, baby brother and me. We have used gentle attachment parenting techniques from birth with him. I dislike seeing him being manipulated. I would love to see him have some backbone and enjoy the simple pleasures of being 4. Read More Aggression from Other Kids: Here's How To Help Your Child Find His Voice "Dr Laura... What if it is not your own child being aggressive, but other kids? A few days ago my two year old and I were splashing in puddles when two girls with their grandparents walked past. The 3 year old walked up to my son and said 'We will kill you.' It was obvious she thought the puddles were all their's and she was lashing out with hostility." Read More View All Articles on Bullying Parent Reviews "I read your Toddler tips yesterday and tried each suggestion, and LO! My daughter has not been fighting me! Like some kind of magic it just works!" Karina Dr. Laura is a parent whisperer! - Liz McIntosh Liz McIntosh Dr. Laura's parenting advice completely changed my relationship with my daughter, improved her self-esteem, and transformed our lives. Providing my daughter with acknowledgement of her feelings and point of view reduced her oppositional behaviors and emotional meltdowns to nearly none. - Jodie Tokatlian Dr. Laura, you have created miracles, large and small, in so many lives and our children