description = "Here’s how to help your child work through mild depression, and when to seek professional help."
full_description = '''Depression Depression is usually defined as a persistent feeling of sadness, often accompanied by a sense of hopelessness, disconnection and loss of interest in the activities of daily life that were previously meaningful. Can children be depressed? The answer is clearly yes, although depression can show up differently in children than in adults. Here’s how to help your child work through mild depression, and when to seek professional help. Start Here: Depression in Children Can children be depressed? The answer is clearly yes, although depression can show up differently in children than in adults. Here’s how to help your child work through mild depression, and when to seek professional help. Read More Toddler Cries All the Time My little princess has always been a great baby/toddler, but highly sensitive and emotional. In the past few months, she's been crying at just about everything. She cries if you say hello to cheerfully when she wakes up, she cries when she sees her grandparents and cousins, she cries if someone gets too close, she cries if you give her what she wants and if you don't. She always wants me and will say "I just want to hug you". I, of course, always give her hugs and try not to let her emotionality get to me, but her constant tears can be frustrating, especially when I'm trying to do something fun that I think she would enjoy. For example, she loves dressing up like a princess, so I took her to a princess tea party with a friend and her daughter. We were the only two families there, so it wasn't like she was in a crowded situation. She cried at everything and wouldn't participate in anything. She also says "I just want to go to bed" and will lie in bed with her binky FOREVER if she's "upset" about something. Is she depressed?? I recently had another child, so I know that adds some stress to her life, but she was like this long before he arrived. She's also very picky and won't eat anything other than yogurt and peanut butter. I know that eating is a control thing, so I don't fight her and I simply don't offer unhealthy food. But, she won't feed herself the yogurt, I have to feed it to her. I recently tried to get her to feed herself and that became a huge issue. Now she says that yogurt makes her sad!! I don't want to be insensitive, how can I help her to overcome all these tears? Let me add that she didn't EVER cry as a baby... is this just her playing catch up? Read More View All Articles on Depression Parent Reviews "I read your Toddler tips yesterday and tried each suggestion, and LO! My daughter has not been fighting me! Like some kind of magic it just works!" Karina Dr. Laura is a parent whisperer! - Liz McIntosh Liz McIntosh Dr. Laura's parenting advice completely changed my relationship with my daughter, improved her self-esteem, and transformed our lives. Providing my daughter with acknowledgement of her feelings and point of view reduced her oppositional behaviors and emotional meltdowns to nearly none. - Jodie Tokatlian Dr. Laura, you have created miracles, large and small, in so many lives and our children thank you. Folks, she's brilliant. It's wonderful to have parenting experts who don't see the child as the enemy in a locked combat, for one thing. I recommend it. "I'd really recommend Laura Markham's Aha! parenting books and website for brilliantly practical ways to parent with kindness instead of punishment." - Makchoon Makchoon I have seen amazing improvement in my *very* angry 17 year-old son after acknowledging that there was a reason he was so angry and acting out. We have had several heartfelt conversations and I have seen a real change in how he treats his younger brother, and how he treats me. I know that I am a better parent thanks to Dr. Laura's inspirational words and suggestions. I love AhaParenting because there is always a "pick yourself up and try again" to it. - Chantal Harrison Chantal Harrison It's like these emails were meant for me. - Caroline Henr