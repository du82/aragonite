["https://peacefulparenthappykids.com/guide/concern-anxiety"]
title = "Anxiety"
description = "Children learn to coach themselves through anxiety-producing situations by the way you coach them, gaining confidence by facing fears and coming through them."
full_description = '''Anxiety Anxiety is a normal fear response to something we perceive as a threat. Children who are often anxious have a chronically activated alarm system. They need support to notice the thoughts that are triggering them, so they can learn to manage those thoughts. Children learn to coach themselves through anxiety-producing situations by the way you coach them, and they gain the confidence to handle new situations by having the experience of facing anxiety-inducing situations and coming through them. *** Don't miss the new mini-course Helping Your Child with Anxiety, which gives you two audios and three printables that guide you through the steps to teach your child (and yourself!) how to manage anxiety. Start Here: Helping Your Child with Anxiety Anxiety is a normal fear response to something we perceive as a threat. For your child, a threat could be anything from his brother taking his toy, to swimming lessons, to starting the new school year with a new teacher. Many age-appropriate developmental tasks like potty training and learning to sleep in their own bed are perceived by the children who are facing them as threats, and provoke an anxiety response from the child. Read More 13 Tips to Help Children Manage Social Anxiety “Probably the worst thing to do is to say, ‘Don’t be shy. Don’t be quiet.' This is not about trying to change the child’s temperament. It’s about respecting and honoring temperament and variation, and helping children navigate the world with their own instruments." - Dr. K.R. Merikangas Read More Helping Children with Phobias: Fear of Bees Dr. Laura, My six year old (mildly autistic, high anxiety, but very high functioning) has become violently afraid of bees. I'm not sure where the fear comes from; he's never been stung and his father and I have never shown any fear toward them. He has always loved the outdoors. But the new fear of bees has him in a panic and no longer enjoying time outside. Do you have any ideas of how we can help me make him comfortable and less fearful? I'm totally at a loss at how to deal with it. Thank you! Read More Anxious Child Spits Compulsively - Normal or OCD? My daughter is almost six years old and has developed this need to spit when nervous or being "grossed out". She has told me, upon my insistence that she explain, that she needs to spit if she sees the toothpaste on toothbrushes in the bathroom, a junk drawer full of stuff, a messy dresser. This happens several times a day. But also recently when she was playing violin for my parents I noticed that she had a mouthful of spit and went to spit it out right after she finished playing (that's why I am including nervousness as a cause as well). She spit the other day and I insisted on her telling me why and she confided that it was my dresser. I asked her to come over to my dresser and look at it--she got a tissue, in case she needed to spit, and I said, wait, wait, don't spit just yet--I want you to see that this dresser is just fine--feel the wood--not dirty, I handed her some objects off it and then we opened the "messy" drawer-- I took out some objects that were in there, a wrapped cough drop, some hair ties, some balm, and asked her just to hold them and see that they were not anything "gross"--she did, but clearly just wanted me to shut the drawer and also was spitting in her tissue. I am also concerned that she is now nervous about spitting in front of me. I have not reprimanded her--only insisted a few times that she let me know what it was that was bothering her--not in an angry way, but perhaps not being able to disguise my deepening concern. She does have one other "tic". When she gets wound up with an imaginary story where she is telling it or drawing it, she sort of needs a "stick" or magic marker or something to hold onto, which she twitches back and forth. Other than that, she is outgoing, loving, trusting, confident, with the "normal" bouts of the opposite of all of those traits! But I do not know if what I am doing is a correct approach or not--or if we need to see someone professionally--please help! Read More 7 year old with Bedtime Anxiety Dr. Laura, My 7 year old is afraid of the dark and of going to sleep. I have tried a million different things, but no one is getting any sleep and we both usually end up in tears, or me mad. Do we need to see a doctor? Its been months and it just seems to be getting worse. Read More Selective Mutism Diagnosis? My daughter was just diagnosed with selective mutism, although I'm not sure the diagnosis fits because she DOES talk, albeit not a lot, outside the house. The developmental pediatrician said that it is caused by anxiety, and that's what my question is about. Most of the time, my dd doesn't seem anxious. She loves going to school, has never had any separation anxiety, talks about school happily, says she's not nervous or anxious (although I'm not sure she knows what those words mean). But she does complain of frequent stomach aches and being tired and in new situations she chews on her clothing. Is this enough to diagnose anxiety? The developmental psychologist has suggested that we meet with a child psychologist. What would such a person do? Thanks. Read More View All Articles on Anxiety Parent Reviews "I read your Toddler tips yesterday and tried each suggestion, and LO! My daughter has not been fighting me! Like some kind of magic it just works!" Karina Dr. Laura is a parent whisperer! - Liz McIntosh Liz McIntosh Dr. Laura's parenting advice completely changed my relationship with my daughter, improved her self-esteem, and transformed our lives. Providing my daughter with acknowledgement of her feelings and point of view reduced her oppositional behaviors and emotional meltdowns to nearly none. - Jodie Tokatlian Dr. Laura, you have created miracles, large and small, in so many lives and our children thank you. Folks, she's brilliant. It's wonderful to have parenting experts who don't see the child as the enemy in a locked combat, for one thing. I recommend it. "I'd really recommend Laura Markham's Aha! parenting books and website for brilliantly practical ways to parent with kindness instead of punishment." - Makchoon Makchoon I have seen amazing improvement in my *very* angry 17 year-old son after acknowledging that there was a reason he was so angry and acting out. We have had several heartfelt conversations and I have seen a real change in how he treats his younger brother, and how he treats me. I know that I am a better parent thanks to Dr. Laura's inspirational words and suggestions. I love AhaParenting because there is always a "pick yourself up and try again" to it. - Chantal Harrison Chantal Harrison It's like these emails were meant for me. - Caroline Henry "Just wanted to say how much I appreciate receiving your regular emails. They've improved my parenting (and me as a person!) and made my children's lives better. Thank you!" - Andrei Andrei My daughter reacts so much better when I empathize and stay patient. And now I get to model that behavior instead of letting my frustration get the better of me. Thank YOU so much for your encouraging weekly newsletters and your Facebook posts. Since I began following your approach, I have noticed a difference in the compassion I show to myself, and how much more that helps me connect with my kids. We are all feeling a lot more overall peace! Thank you for your weekly emails and your books. They're a life line for me when I really need support during a rough patch. - Lisa Fernandez Lisa Fernandez Today I say thank you, tears streaming from my face, so proud of my little boy and all he will become. Thank you. - Jennifer B. Jennifer B Yes. It works. And the more rest I get, the more patience I have. It makes a difference. Dear Dr. Laura Markham! I am a mother of 2 boys - 16 and 7 years old. I am extremely grateful for all the emotional and relational education that you provide us and also for your incredible loving energy to support our evolution as parents, as human beings. I took your course 3 years ago. Although the challenges of the parent-child relationship change almost every year, your parenting principles are equally valuable and effective. It's hard to reprogram the emotional-behavioral pattern learned in my own childhood... so I find it very helpful to go back to your teachings to regain trust and patience as a parent every time new challenges trigger my anxiety. To have more clarity, to reset my energy. Thank you!! Janina-Madalina Dobrescu Your philosophies are the only tools we've come across which offer practical advice grounded in clearly laid out lay terminology. Our family life day-to-day is nothing short of a miracle, thanks to you! - Dana Questad Dana Questad Previous Next (function($){ $('#testimonialSidebarControls .carousel-inner .carousel-item:eq(0)').addClass('active'); }(jQuery));'''
