full_description = "« Maqina Workstations & Benchmarks Approximate Ambient Occlusion » Jan 11 American visitor went home Posted in Peach Press, Random Fluff by Margreet During the last week Nathan had a friend over; Aaron. Aaron just left today with a signed t-shirt from the whole Peach team. Be aware this is a collectors item. The one and only :) 9 Responses JoOngle Writes: January 11th, 2008 at 2:12 pm Ah the love… Gets me all warm an furry inside… rexprime Writes: January 11th, 2008 at 2:25 pm ebay? that shirt might go for $25,000,000 Nathan Letwory Writes: January 11th, 2008 at 2:26 pm That shirt will sooo expensive in 10 years :) ros Writes: January 11th, 2008 at 2:40 pm Friends need friends ;). I also wish that kind of shirt. but i know its just for friends :). Sago Writes: January 11th, 2008 at 5:00 pm haha, my name on the T-shirt is closest to his crotch!! Eric Writes: January 11th, 2008 at 6:30 pm Sago, I hope you have tried to keep that sort of humor out of the movie. :-/ … Anyway, I’ve been grasping for every bit of news I can get about the team’s progress. Anticipation is through the roof! Jan Morgenstern Writes: January 11th, 2008 at 10:37 pm “I got tackle-hugged by Nathan V. and all I got was this stupid t-shirt” chuckster Writes: January 12th, 2008 at 12:43 am seems he also went home with a “doo-rag” this is the red bandana on his head, proably from sago who is a former gang member of the bloods… JoOngle Writes: January 12th, 2008 at 7:13 pm Eric: Sago…is ….what you could say…like the icing on a cake – and you can bet the movie will have a lot of…CAKE! ;) GO SAGO!"
