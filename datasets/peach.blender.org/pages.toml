title = "Big Buck Bunny  » Blog Archive   » The use of violence in open source productions"
full_description = "« Becoming a TV star! DVD authoring last bits » Apr 23 The use of violence in open source productions Posted in Events, Random Fluff by Sacha The day after the BBB premiere Ton was a member of a panel at a conference called ‘Economies of the Commons’, where topics as ‘financing open source and open content projects’ were discussed. Before the panel started Ton gave a presentation during which he also showed material from BBB. During the panel discussion there was a question from an audience member for Ton. Taken from here: The last major topic that was raised concerned the narrative of the Big Buck Bunny film, just released by Blender. Anthony McCan asked why open source productions can’t steer clear from the use of violence, as violence evokes violence. Ton Roosendaal replied that this was the best way to show the technical abilities capable by the Blender rendering software and that creative freedom in the way these technological abilities are displayed is highly regarded. While I was listening to this on some audiostream, I understood this audience member had a North Irish background and witnessed a lot of violence in his life. I believe he just wondered if the ethical question about using violence in projects made for an entire community was raised. Unfortunately the text above mixed up Ton’s reply; it almost seems like he encourages violence! His real answer was of course that the development of Blender comes first. And in order to make a project like this work, the best artists of the community are invited and are given this creative freedom. Growing up in a world of violence is not a joke, but what worries me the most is that some people from this world are unable to distinguish real violence from the cartoony violence we know from Looney tunes and Tom and Jerry… and soon from BBB. Peace, Sacha Violence in Big Buck Bunny? I have no idea what you’re talking about… 116 Responses jim ww Writes: April 23rd, 2008 at 4:31 pm i think it is a valid question, but i think we actually need MORE cartoon violence. we need to reinforce the difference between the conscious release of anger, and the actual physical release. a simple concept, which many people cannot comprehend. maybe we can beat it into them? well, we can imagine it, anyways… Gianmichele Writes: April 23rd, 2008 at 4:31 pm Mmmmm…I can understand such a situation, but this kind of discussion usually never come to a balance. I had to say that as human we can choose…so if something is not for your taste, find something else. jim ww Writes: April 23rd, 2008 at 4:44 pm to qualify my statement further, i am a frustrated artist, constantly self editing my work, so as to not offend. which detracts from my very real anger, and compromises my emotional outlet. art is about personal expression, isn’t it? but not if it meant for general popular consumption. which creates another conflict, and possibly reinforces the point of the argument. if our art is angry, what does that say about the society which is creating it? not that we should subvert it, but that we should confront that, and ask why? or we could just make a rating system, and committees to enforce it, and further obscure what is really a simple issue. hm. i didn’t realize this was going to be a rant. sorry. perhaps you should not address complicated social issues? ha! chris Writes: April 23rd, 2008 at 4:46 pm I think that was the point of the question. If we CAN choose, why do we choose as a culture to view violence as entertainment. red Writes: April 23rd, 2008 at 4:51 pm So, let’s ban chess… It’s an abstract form of war… Manuel R. Ciosici Writes: April 23rd, 2008 at 4:52 pm I think that there is a great need for violence in movies and this is simply because that is what most people want to watch. I personally like non-violent movies, but if I were to make a movie that should impress an entire community, I would too choose violence, moderately. And as stated above, Blender development comes first and we must not forget that a great majority of games require violence and developing Blender in that way is a necessary choice. Jan Morgenstern Writes: April 23rd, 2008 at 4:57 pm It shouldn’t be left unnoted that excessive violence has a long tradition in open source culture. Open-source games like “Adventure”, “Rogue” or “Nethack” – as popular as morally depraved – routinely reward their players for a most reckless and anti-social behaviour. What’s more, users of “Linux” and other open-source systems have to put up with using self-speaking commands such as “killall” on a daily basis. Olson W. Writes: April 23rd, 2008 at 5:26 pm “I think that there is a great need for violence in movies and this is simply because that is what most people want to watch.” the question should be raised so that “why people wants violence ?” Catroonish violence is not different from “real” violence… it is just a more bearable form of. The whole problem comes from the social basis we are all raised, that praise violence and hate instead of love and cooperation. And the fact that in order to compete in the capitalist world, you HAVE to make some sort of violence. Unfortunately, blender community is not different from that point of view (see how many blender games use violent themes), and the blender instituut even cooperate with US army to virtualise battleground … so who said Ton was AGAINST violence ? He certainly not promote it, but … he is not Ghandi neither. Dusty Writes: April 23rd, 2008 at 5:26 pm Hmmmm, it is a good debate, ratings and such need to be applied to open films as much as any other. I think it unfair to say the open films insist on violence. There are many I have seen out there that do not have violence in. In big buck bunnies case it’s cartoon violence. Since the days of Tom and Jerry people have speculated that this violence is not a good influence on children, but there is a big difference between that and say a certain zombie movie that has just come out. I feel that films like The Hostel and the Hills have eyes have allot to answer for in this respect. They are violent for the sake of it and go out of their way to be twisted and disturbing. Cartoon violence is not the same as blood and gore, or the gratuitous hurting of another human being for no other reason than it makes shock impact on the viewer. Cartoon violence is comical fun that could not be achieved in real life, while screen blood and gore is where the real issue lies. Those people who try and reenact a film by killing people will always try and replicate a blood and gore film of some kind. When have you ever heard of a man killing his wife with a bowling ball because he saw bugs bunny do it? Dusty Writes: April 23rd, 2008 at 5:31 pm Wait a min? killall? LOL Linux makes us subliminal killers because we type the word kill over and over again!! Oooooo now there is a theme for an open movie! ton Writes: April 23rd, 2008 at 5:38 pm Wow, do we cooperate with the US army? Coolness, please tell me where to send the invoice! -Ton- Olson W. Writes: April 23rd, 2008 at 5:47 pm -> ton : I just remembered a quite disputed post on blendernation some time ago where Campbell told you helped him on his project with USarmy … maybe this was not true so ? Or I remember wrongly … this was titled “MetaVR uses Blender in Detailed VR Training for Baghdad Combat Studies” .. but unfortunately not anymore in the archive … ROUBAL Writes: April 23rd, 2008 at 5:53 pm If violence must be avoided in animations, I will have to redo my last one, because it shows a shark eating a small fish. But if I redo it with the shark kissing the fish, any child looking at the scene will believe that sharks are our friends, and one day he may be eaten because he will have tried to kiss a shark ! So, violence in movies can be informative and helpful !o) polka Writes: April 23rd, 2008 at 6:04 pm What a stupid debate… seriously. And what a strange question in the first place. Even IF I took the position of someone, who’s against violence in games/movies/etc. why should Open Software be required to fulfill this more than any other Software? Metsys Writes: April 23rd, 2008 at 6:13 pm I was actually thinking about this a few months ago. “A bunny gets back big time.” Every CG short film that I’ve seen on the internet that had “cartoony” violence was also quite gory. I was pretty confident that Peach wouldn’t go that route—although I’m not sure because I haven’t actually seen BBB yet, but the trailer seemed to suggest that it in fact wouldn’t—but when the characters are 3D and more realistic, the violence somehow becomes less comical and more real for some people because the characters appear to be more real. I know a lot of people bring up the argument that you need to be able to distinguish real violence from fake violence when talking about the representation of such in media. But it’s essentially redirecting the issue to the maturity of the audience and away from the creators. It does have a lot to do with the audience. You don’t want youngsters seeing some types of violence because they are learning through observation and imitation, and there are a lot of stupid teenagers (and adults) that just don’t know any better. But fake or not, it does have an effect on everyone. That’s why violence–and sex if I may add–is used as much as it is in story telling because of the psychological effect it has on us by viewing it. The effects are usually very short term and leave shortly after the scene is over, but the power of story telling and imagery is quite strong and can linger for a very long time. Our memory allows us to replay scenes on demand and even when we don’t want to, which is why the argument of “If you don’t like what you see then stop watching it,” is a weak one because they’ve already been exposed to it and have now committed what they saw to memory. Enough of the same story told over generations influences entire cultures for good and bad. Stories can become a window into parts of our world that we don’t understand very well, and people do make decisions based on it. Take the CSI Effect for example. My issue with using violence in storytelling isn’t so much that it’ll turn people into homicidal maniacs (because on it’s own it does not), but that it says a lot about the characters in my story who resort to it, and using too much of it may suggest something about my talent as a writer. Not that every story has to be pleasant, but people will judge the worth of a film by it’s intentions and execution of using violence to make the audience feel uncomfortable, getting excited through action packed scenes, or laughing at slapstick humor. Again, I haven’t seen BBB yet, but doing something cartoony like this with slapstick and everything is probably just fine. Anthony McCan’s concern might be more about wishing for more creativity out of the open source community in the art that’s produced because so much of what’s out there is violent, or why the idealism of “for everyone” isn’t reflected in the content of the film. Or it really could be because he believes that violence is bad. But either way it’s something for writers to think about. Johan Writes: April 23rd, 2008 at 6:23 pm Inevitable that someone should raise that question. I think it is difficult for entertainers to stay away from violence, because violence is a way to make something look real and exciting. ‘Danger’ also usually translates into a greater concern for the characters. I know in Samurai Jack they ducked that issue by making Samurai Jack kill robots. I think people should examine the ‘message’ of their movie and see how violence contributes or detracts from it. If all else fails- turn your villains into robots (before killing them). ROUBAL Writes: April 23rd, 2008 at 6:45 pm Action is an attractive part of movies. The first purpose of movies is to show actions before telling a story. It is for what cinema has been invented : Showing movement, and so action. The border between action and violence in movie is very narrow, and it is very difficult to stay only on the side of action without showing some violence… Mike Futcher Writes: April 23rd, 2008 at 6:45 pm You can depict violence without promoting it – there are many violent antiwar films. olme Writes: April 23rd, 2008 at 7:01 pm >> roubal It’s true that cinema shows movement, but violence is not the essence of action and there is a lots of movies without violent actions. in fact there is also other modes for the images in cinema (as analysed by philosopher Gilles Deleuze) that have not violence, and not even “movement”(!) as a motive. I think the tendency for film toward violence is more related to some kind of “frustration relief/creation” and the socio-political context that to the nature of cinema. And creators of BBB are not out of the epoch and context, so in trying to reach a broad public they express and use what is common in the hollywood cinema : action, and violence, at a certain level. (yes I was quite estonished to see those picture of Rambo-Bunny … but as I havn’t seen the movie, I can’t judge where it goes … :) ) Sam Brubaker Writes: April 23rd, 2008 at 8:11 pm If the level of violence in Big Buck Bunny is enough to raise some issues, I wonder what the feedback for Project Durian will be like… Schiz Writes: April 23rd, 2008 at 8:17 pm @Olson W. “And the fact that in order to compete in the capitalist world, you HAVE to make some sort of violence”…It’s interesting Olson, how you tie capitalism to violence. Now there is a correlation between competition and violence but don’t go sticking capitalism in there for the thrill of your socialist ego. It doesn’t matter what type of economy is churning away you will always have competition and violence. Should that ever go away there will be no human nature and in return there will be hordes of mono-zombies walking the planet. Wake up… Metsys Writes: April 23rd, 2008 at 8:50 pm @Schiz: Depending on where he’s from, referring to capitalism is simply referring to the business world in general. Saying that he’s doing it for the thrill of his socialist ego is making a huge assumption. Bringing the discussion back on topic, the point is that aggressive behavior in both entertainment—and as was suggested earlier—in real life, and even things like business, is commonplace. And I think that’s why Anthony McCan brought it up. Does violence need to be so common in open source productions, or at least as common as everywhere else? Can it steer clear from it? Can it do it some other way? I think every media can and does, but I don’t think the fact that it’s open source affects the the content any differently than if it was a studio production. Should it though? Personally I think all content producers should be more responsible in the content they create and how it’s marketed. But it would be nice to see the open content community be the first to raise the bar. Veronica Writes: April 23rd, 2008 at 9:02 pm Doesn’t open source stay for free"
