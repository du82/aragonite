title = "Big Buck Bunny  » Blog Archive   » Awesomeness, it’s a DVD!!"
full_description = "« The release! The DVD arrival wave… » May 20 Awesomeness, it’s a DVD!! Posted in Blender Institute by Sacha Today we found some DVD’s (around 2500) outside the door of the Blender Institute. So we had the idea to just bring them inside and start packing them, get them ready for shipment. All I can say is pretty awesome. Many thanks to Anne and Anja from the e-shop, some guys from the Apricot team and Martin Poirier (theeth) who are working hard to get the dvd’s out as fast as possible…… oh, and Ton too. Peach out, Sacha 44 Responses Daniel Genrich Writes: May 20th, 2008 at 2:59 pm Can’t wait! Great job :) mat Writes: May 20th, 2008 at 3:00 pm I can`t wait! It`s so cool! crazybus Writes: May 20th, 2008 at 3:00 pm *drools* Now the long mailbox wait begins. Hopefully it wont be more than two weeks before I can finally watch it and dig into the lovely production files. DJ_BOXER Writes: May 20th, 2008 at 3:00 pm I thank everyone for there hard-work on both the dvd/movie and 2.46. Awesome indeed! Gianmichele Writes: May 20th, 2008 at 3:02 pm yesssssssss vanoin Writes: May 20th, 2008 at 3:06 pm I’m love it ! It’s nice job! peter (dotblend) Writes: May 20th, 2008 at 3:23 pm finaly, cant wait!!! MrNoodle Writes: May 20th, 2008 at 3:28 pm I ll be waiting! Marcio Writes: May 20th, 2008 at 3:37 pm Hi there! Can you tell me what is the lenght of the movie in minutes? Lasphere Writes: May 20th, 2008 at 3:58 pm Super nice! :D Just can’t wait! Luiz Writes: May 20th, 2008 at 4:03 pm I shall make a video of myself opening the package when it arrives – just like the ones showing kids getting an Wii. =DD Elubie Writes: May 20th, 2008 at 4:48 pm Awesomeness, can’t wait to see it again :) Mal Writes: May 20th, 2008 at 5:05 pm Very cool!!! Lifting and packing those boxes might be the only exercise Ton etc will get until the next Open Movie ships :) dilly Writes: May 20th, 2008 at 6:18 pm Great news! :D Anyone knows if the DVD will arrive in the address that are on the account of Blender E-shop or to the account of the PayPal? I’m asking because I don’t have credit card and used the PayPal account of a friend… :P SCIBOTIC Writes: May 20th, 2008 at 6:34 pm OH SHIT! I just remembered that the address I ordered with doesn’t exist anymore. If I change it in the e-shop is that enough? DJ_Boxer Writes: May 20th, 2008 at 7:04 pm @SCIBIOTIC: You could try calling and emailing them. But you could also log in right away and change the adress in your account to a current one. freakydude Writes: May 20th, 2008 at 7:37 pm Neetooo!! I’ll be keeping an eye on my postbox… superblenderist Writes: May 20th, 2008 at 7:40 pm Great, at last XD ton Writes: May 20th, 2008 at 7:56 pm svibiotic: it was all shipped already. We also printed the address labels long ago. Can’t you contact the former address to forward it? If not, then email the [email protected] with order number and new address, they’ll ship you for free again. SCIBOTIC Writes: May 20th, 2008 at 8:26 pm @ton: I’ll see if I’m able to get it from them, but thanks for the alternative if things don’t work out. I need to change my address for the Apricot DVD I ordered as well. welefen Writes: May 20th, 2008 at 8:28 pm give me one,thank you Chris Writes: May 20th, 2008 at 8:41 pm Wow! You’ve shipped all the pre-orders already? Impressive! How long will the shipping times be to different parts of the world? DJ_Boxer Writes: May 20th, 2008 at 9:08 pm @Chris: On Blendernation.com they just posted from Ton about the shipping. :) Ed Caspersen Writes: May 20th, 2008 at 9:35 pm Can’t wait for mine to get here. You guys need another mirror for the release? My server doesn’t have a bandwidth cap. Let me know if you need another. Nicolas Writes: May 20th, 2008 at 10:43 pm Hey, I wanna watch the movie, but I live in Colombia :(. If you translate the price 34 euros to pesos is a lot 98000 pesos, and you have to plus the shipping like 20 euros… a total of 155 695 pesos :S. Maybe could someone upload somewhere the dvd iso? dusty Writes: May 20th, 2008 at 11:03 pm Ooooooh! Looks exciting! Chris Writes: May 20th, 2008 at 11:14 pm @DJ_Boxer: Thanks for the heads up. Len Writes: May 20th, 2008 at 11:20 pm Man I wish I had the money to pre-order it, but I’ll definitely order it later in the year when things are better my side. WELL DONE GUYS! Thanks for all your hard work. Also, Blender 2.46 ROCKS! Ralph Writes: May 20th, 2008 at 11:23 pm @Nicolas: U only need to wait 10 more days till u can DL the movie! Ralph Writes: May 20th, 2008 at 11:26 pm @Len: Hint for next Project. Order early, forgett about order and get surprised when things arrive. :-) sameer Writes: May 21st, 2008 at 10:36 am Congrats to the peach team. Waiting for the movie to get uploaded, too bad cannot order DVD :( wElly Writes: May 21st, 2008 at 1:21 pm gratulation for this good work ! Nicolas Writes: May 21st, 2008 at 3:05 pm Hey, It seems pretty funny :P. By the way I want to download a elephants dream DVD but I don’t find where, smobody knows? DJ_Boxer Writes: May 21st, 2008 at 3:32 pm @Nicolas: go to http://www.elephantsdream.org and click on production and there will be a link there. The files are also on the DVD with the Intro to Character Animation book by Tony Mullen. @DJ_Boxer Writes: May 21st, 2008 at 4:22 pm I can’t download, I’ve already tried it, but without succes. Mildred Writes: May 21st, 2008 at 7:14 pm congratulation… This is nice to see it is finally shipped. And, don’t work too hard. We wouldn’t want to see you exhausted. There still are many project like this one to be achieved (hopefully). :) Moarc Writes: May 21st, 2008 at 7:31 pm Show Us The Download :D MrE Writes: May 21st, 2008 at 9:45 pm OK! Are you happy now! I just got a restraining order from the police. It says that i may not harras the mailman if he doesn’t deliver a package at my adress. See what you made me into?! with your previews, teasers and “we’re sending the DVD now” topic. ARE YOU HAPPY NOW!! Gabriel Writes: May 21st, 2008 at 11:19 pm Hi,great job! When you are going to put the movie for download?;) gooberstopper Writes: May 22nd, 2008 at 3:02 am are you freaking serious, ton and crew actually will handle my personal dvd?!!! free freaking finger prints!!! i wont open it, i will just buy a frame and hang it on the wall!!! free fingerprints!!! surt Writes: May 22nd, 2008 at 4:48 am gooberstopper: I’m auctioning some of the Peach team’s unwashed undergarments on ebay if you’re interested. Quantum Anomaly Writes: May 23rd, 2008 at 8:11 pm @surt: don’t make me laugh so hard – I’m at work and people will wonder what’s going on! To the Blender Foundation: THANK YOU! You guys rock and I truly look forward to seeing what you’ve created. I’ll be camping next to my mailbox, actually. :-) wimo Writes: May 23rd, 2008 at 9:03 pm I have my copy of the DVD, I live in spain, incredible. ___ALien___ Writes: June 2nd, 2008 at 5:19 pm Unfortunately, I feel it’s my duty to everyone who wants to buy the “Introduction to character animation” by Tony Mullen to warn them that the files on the accompanying DVD i.e. ORANGE1.RAR and ORANGE2.rar that the files are corrupted and were corrupted from the source. It won’t open, and the author is using many methods to refuse to provide the files. I have opened 2 tickets with Sybex (Publisher), they also sent me another book thinking my copy was corrupted to no avail, they tried on their end and they have the same issue. I’ve read from many forums including blendernation and al, and no one seems to be able to get those 2 files (4 GB each).ALSO on orange.blender.org the link for the FULL COPY doesn’t exist, you have to manually download the files 1 by 1 which is horrible. PLEASE DON’T BUY THIS BOOK LIKE I DID IF YOU THINK YOU’LL GET THE PRODUCTION FILES FOR ORANGE. Ton, care to comment ? Best Regards"
