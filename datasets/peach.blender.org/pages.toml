full_description = '« The Making of “Big Buck Bunny”: An Open-Source Evolution on Siggraph ’08 Blu-ray version! » Jun 21 The wedding day of Enrico and Micaela Posted in Random Fluff by Margreet The whole Peach team wishes Enrico and Micaela all the best for today, because they are getting married! Have a beautiful day and of course lot’s of love for the future. Congratulazioni, tutta la fortuna per il futuro! 21 Responses Pitel Writes: June 21st, 2008 at 11:36 am I hope they won’t “multiply” like bunnies does ;) leo Writes: June 21st, 2008 at 11:53 am Viva gli sposi! Dusty Writes: June 21st, 2008 at 12:06 pm Best wishes from me and mine! :) Cathy & India Writes: June 21st, 2008 at 3:48 pm With love & best wishes!! Cathy & India xx DingTo Writes: June 21st, 2008 at 5:31 pm The best wishes for your future. Enjoy today! ms Writes: June 21st, 2008 at 5:36 pm Best wishs. Cake looks beautiful! MS Satish "ILuvBlender" Goda Writes: June 21st, 2008 at 7:40 pm Congratulations Enrico and Micaela. :)\/ Satish "ILuvBlender" Goda Writes: June 21st, 2008 at 7:41 pm Congratulations Enrico and Micaela. :) Sephiroth the Bimbo Master Writes: June 21st, 2008 at 7:47 pm Best wishes to both of you from mexico Kim Writes: June 21st, 2008 at 9:31 pm We would also like to extend our sincere best wishes to Enrico and Micaela. May you have many many “hoppy” years together. Kim, Carli & Jasmine Jan Morgenstern Writes: June 21st, 2008 at 10:10 pm Congratulations Enrico & Micaela! Best wishes for your future! macouno Writes: June 21st, 2008 at 10:54 pm Congratulations Enrico! And where’s my piece of cake? Josh Writes: June 22nd, 2008 at 12:49 am Good idea getting married on the first day of Summer! It is the longest day of the year! You can spend every second of daylight from the moment the sun rises to the moment the sun sets remembering the joy you share on this day! Best wishes! MArco Writes: June 22nd, 2008 at 12:23 pm Grande !!! Complimenti :) MrNoodle Writes: June 22nd, 2008 at 6:01 pm Live happily! Bagheera JH Ding Writes: June 23rd, 2008 at 5:36 am Best Wishes from Beijing China. 新婚快乐，白头偕老。 chuzzy Writes: June 23rd, 2008 at 2:13 pm Congratulations, the both of you :] Christian Lehmann Writes: June 24th, 2008 at 9:47 am All the best ! bullx Writes: June 24th, 2008 at 4:09 pm grande maestro, tantissimi auguri!!! EnV Writes: June 25th, 2008 at 2:54 pm WoW!! To everybody for wishes and congrats and to Margreet for posting this on the Peach blog: thanks a lot from me and Micaela. :) Martino Writes: July 17th, 2008 at 4:00 am Auguri Enrico! Ti stimiamo moltissimo per l’ottimo lavoro ed esempio che ci dai. Da parte di tutti i giovani di qua ti auguriamo tanta felicità!'
