title = "Big Buck Bunny  » Blog Archive   » BBB at CG Overdrive"
full_description = "« The DVD arrival wave… Big buck Bunny movie files released! » May 28 BBB at CG Overdrive Posted in Events by Sacha One of the benefits of being one of the creators of an open movie like BBB, is that you get to show it in different places all over the world. And that’s exactly what we want, Blender worldwide. One event I’m extremely happy about is CG Overdrive in Singapore, Asia’s biggest Computer Graphics conference (some of you might have already read about it on BlenderNation). Both me and Andy will give a ‘making of Big Buck Bunny’ presentation, and I myself am honored of being this year’s keynote speaker. As a comparison, last year’s keynote speaker was Mr Shinji Hashimoto, a producer from Square Enix. So I’m not exaggerating when I say I’m extremely honored. The topic of my keynote will be ‘the world of open source and open content’, something I’ve been getting a bit more familiar with in the last half year. For more information check out the site of CG Overdrive, you’ll see what they mean with ‘Biggest’. Also check out the site of 3dsense Media School, which supports this amazing event. I wonder if they have a job opening left? So if you happen to be in Singapore from 17 – 20 June, be sure to drop by. But don’t forget to wear a Blender t-shirt! Peach out, Sacha 22 Responses Felix Kütt Writes: May 28th, 2008 at 1:03 pm man, wish i would be there and have a blender shirt. :( Anonymous Writes: May 28th, 2008 at 1:29 pm Well done guys. Easton Writes: May 28th, 2008 at 1:54 pm Congratulations. That is a real honor. rogper Writes: May 28th, 2008 at 2:54 pm :P There’s the possibility that a part of me eventualy also drop by there. Congratulations guys! Hope that you don’t forget to film it and then post it here after ;) Dusty Writes: May 28th, 2008 at 3:04 pm Well done! And good luck with it! Cathy & India Writes: May 28th, 2008 at 3:20 pm Singapore is SOOOOOO close to Australia. So close, and yet so far…. EnV Writes: May 28th, 2008 at 9:41 pm Best wishes for the presentation, Sacha-man! And to Andy too, of course. I’m sure it’s going to be a great moment. GH! Gabriel Writes: May 28th, 2008 at 11:29 pm So,is the download going to happen tomorrow? YEAHHH loh Writes: May 29th, 2008 at 7:34 am This is amazing. I am proud of Blender. Andy Fitzsimon Writes: May 29th, 2008 at 12:08 pm Great, their website deliberately hides the cost of attendance. I’ll drop by to watch the crowd reaction to BBB. Did you guys know Siggraph-Asia will also be held in Singapore later this year ? A perfect event for Blender! Dion Moult Writes: May 29th, 2008 at 1:13 pm Bah, I can drive down to Singapore in 7 hours or so but I still can’t attend. exego Writes: May 29th, 2008 at 6:05 pm Yeah, a video from this event would be great. dani Writes: May 29th, 2008 at 9:10 pm good job guys! As a side note I spent some time reading the resumés of the speakers there: http://www.cgoverdrive.com/conference.htm I got a laugh with this one: ” In 2006, the London Metro News Paper elect Alessandro Pacciani as “one of the top prominent directors of the coming decay”. ” Although it could be I didn’t understand something… Spades574 Writes: May 30th, 2008 at 4:50 pm really well done guys. I wonder what the next genre will be? Sim Writes: June 6th, 2008 at 3:17 am I am from Singapore. I have used Blender for some freelance commercial projects, mainly for rendering and product visualisation. But I use Rhino 3D for modelling. I will be there to see the show! krissa Writes: June 22nd, 2008 at 6:23 pm u r awesome at cg overdrive.. OwO;; now im interested in 3D.. if u r really goin too teach in 3d sense i might wanna join, but sadly i also want to learn 2d animation in japan.. ;__; i’ve downloaded the blender software although im blind in 3d..im really gonna try my best to learn 3d from now on.. guiwen Writes: June 22nd, 2008 at 6:56 pm the making of BBB @ CGO 08 was great!! very funny(the NGs) and inspiring! thanks for introducing blender to all of us! was glad that i went for that conference. =) by the way, i am the girl in the CGO org. office desk! catherine Writes: June 26th, 2008 at 11:52 am Hey!!i dont think you remember me but i attended the cg Overdrive. bbb was so cool… its so you!!i mean its awesome and humorous.. but you still owe a picture huh?! lolz! thanx for sharing that to all of us there.. keep it up.. justin chua Writes: June 30th, 2008 at 7:33 pm sasha is sooo hottt! Gary Wee Writes: July 6th, 2008 at 8:55 am LOL justin! I agree.. Sacha is so so so hottt! Plus the weather here in Singapore, it’s gonna make everything hotter. Andy is awesome too~! YeeeHAAAAA!!! cyn Writes: July 6th, 2008 at 9:11 am I know u still remember me, am i right dear Sacha? haha.. yOu’re so cOol.. Welcome to SG"
