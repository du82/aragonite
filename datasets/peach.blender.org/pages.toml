title = "Big Buck Bunny   » Media Gallery"
full_description = "Feb 09 “Gosh, that we can do this too!” Posted in Events, Media Gallery, Peach Press, Uncategorized by Ton Tuesday, February 9th, 2010 The Noordbrabants Museum, one of the main modern art museums in southern Netherlands, opened recently an exhibit “Fantasy Factory”, where BBB has a permanent display. This morning, the Dutch national news paper Volkskrant posted a positive review on this exhibit, ending with some words about BBB. Freely translated: “From paper cutting to fast 3D-film” “Radically different than for example the model-handicraft from van Kaayk, is Big Buck Bunny from the Netherlands computer graphics teacher Sacha Goedegebure, a comedy about a fat rabbit taking revenge on three irritating rodents. The film – in the fastest imaginable 3D computer animation – almost seems like being produced by Blue Sky studios, the producer of Ice Age 1-2-3, so natural and precise as the rabbit hairs wave in the wind. Gosh, that we can do this too, you then think a while. And understandable that the eyes of the kids hanging in the beanbags of the theatre are glued on this Dutch rabbit humour.” Ain’t this a fun review! :) Kudos to all who made BBB of course, it’s certainly not just a Dutch film… but we knew that! -Ton- Posted in Events, Media Gallery, Peach Press, Uncategorized | 3 Comments » Jun 19 Linux Pro Italian magazine Posted in Events, Media Gallery by Margreet Thursday, June 19th, 2008 An article about Blender and the making of BBB of 8 pages has been printed in the June issue of Linux Pro Italian magazine, with short (boxes) interviews with Enrico, Sacha and Andy. (more…) Posted in Events, Media Gallery | 8 Comments » Jun 06 Complete Score Available for Download Posted in Media Gallery, Production by Jan Friday, June 6th, 2008 Wheee, my first blog post. Sorry that I’m late to the party :) The complete score is now online for your listening pleasure. It consists of 10 tracks, including the bits I did for the DVD menus, and is available both in MP3 and high-quality Ogg Vorbis formats. Grab it while it’s hot: MP3, ~192 kbps VBR, 16.2 MB ZIP Ogg Vorbis, ~224 kbps, 17.8 MB ZIP The isolated score is distributed under the terms of the Creative Commons Attribution-Noncommercial-NoDerivativeWorks 3.0 license. Thanks to Andy for the neat cover image. Enjoy! Posted in Media Gallery, Production | 55 Comments » Apr 02 Dolby mastering Posted in Media Gallery, Production by Ton Wednesday, April 2nd, 2008 We wouldn’t deserve the a score and soundtrack from Jan Morgenstern if we didn’t have at least the 35mm film provided with official Dolby Digital (5.1) sound! Although this isn’t really an “open standard”, it at least does have an obvious quality benefit… not to forget that the only (free) alternative would be simply analog stereo (or in Jan’s words: “it will sound like a crappy 70ies or 80ies movie then”). (more…) Posted in Media Gallery, Production | 28 Comments » Mar 25 Our First Film print! Posted in Media Gallery, Production by Ton Tuesday, March 25th, 2008 Wahoo! The neighbours from Filmmore provided us a test print with 1 minute of material for color tests. It was already totally exciting to hold the metal case in my own hands… for me the first film ever, a wonderful experience. :) (more…) Posted in Media Gallery, Production | 41 Comments » Jan 28 random environment, rodent & rabbit renders Posted in Development, Media Gallery, Production by andy Monday, January 28th, 2008 it’s starting to get a little rough around here… there are about 6 weeks of production time left. our fearless team of animators – sacha, william, nathan and our external keyframe shifters – are working hard to get the last couple of scenes of our movie animated. enrico and i am both working on “finals” – a little underated sounding description ton likes to give to the task of texturingmodelinglightingcompositinganddoeverythingelsetogetthemovierendered. (more…) Posted in Development, Media Gallery, Production | 72 Comments » Jan 24 See how the environment is progressing Posted in Development, Media Gallery, Peach Press, Production by Margreet Thursday, January 24th, 2008 Enrico, Andy and the technical team have been busy for a long time now to create the environment for Peach. Here you can get an impression how it is going to look like. It is getting somewhere, and of course it is not even finished yet! .ogg file Posted in Development, Media Gallery, Peach Press, Production | 15 Comments » Jan 23 Movie title? Posted in Media Gallery, Random Fluff by Margreet Wednesday, January 23rd, 2008 It’s about time that the title of the movie is going to be announced. Don’t you think so… Download the .ogg file here. Posted in Media Gallery, Random Fluff | 29 Comments » Jan 22 Still so many minutes left to animate Posted in Media Gallery, Production by Margreet Tuesday, January 22nd, 2008 Besides animating there are more things to do, like composting, lighting, the environment. Ton and Sacha made a schedule from the breakdown to have an overview of all the actions. What you see here is only 1 page. There are 7 pages like this which in the end all need to be checked off. No finals yet, but come back soon for more detailed information! In this blog post also a short reproduction of the animating. William is animating 1 shot of 2.375 seconds. He has been busy with that for at least one day. One day within the Peachteam exists at least out of 10 working hours or even more. The script is divided in several scenes. Each scene is a certain amount of seconds. In the overview you can see how many animation seconds a shot has (not even counting prop animation!) They are working on it! Download the .ogg file here. Posted in Media Gallery, Production | 36 Comments » Dec 24 fluffy puffy peach posters Posted in Media Gallery, Production by andy Monday, December 24th, 2007 hi there! well here i am again, and the characters are finally completed! as a peachy xmas holiday present we decided to publish some posters / wallpapers to decorate your desktop! (more…) Posted in Media Gallery, Production | 101 Comments » « Older Entries"
