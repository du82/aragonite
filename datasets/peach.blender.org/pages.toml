title = "Big Buck Bunny  » Blog Archive   » Project Peach is Pretty Proud to Present…"
full_description = '« just another manic friday Stages of Animation » Feb 04 Project Peach is Pretty Proud to Present… Posted in Production by Sacha Today is the day we will officially say goodbye to the work title ‘a Rabbit’s Revenge’. The title of the Peach Open Movie is: (click for 1920×960 version) So no ‘Rabbitouilli’ (legal issues), ‘Rabbitribution’ (unpronouncable) or ‘The Butterfly Effect III’ (yes, there already is a sequel). A little explanation about the title Big Buck Bunny: ‘Big’ because the main character isn’t small. ‘Buck’ is the term for a male rabbit. It’s also the name of a movie character played by an actor we used as a reference. ‘Bunny’ because…. ah, I’m not gonna explain that. Sacha 95 Responses Vincent Writes: February 4th, 2008 at 2:41 pm “Buck Bunny”, that sounds familiar ;) Very cool though :) TobiDN Writes: February 4th, 2008 at 2:49 pm Finally! I’m a little sad about your choice of title though. I kinda liked “a rabbits revenge”. Well, it’s your movie… I guess i’ll just change the title when you release the .blend’s :-D. Klangfreund Writes: February 4th, 2008 at 2:53 pm Buck Bunny, not a member of the lousy toons… Anthoni_C Writes: February 4th, 2008 at 2:59 pm Could yall tell us more about why yall choose the title? Robin Writes: February 4th, 2008 at 3:12 pm And what does it mean? I’m a non-native speaker (although at an advanced level) and I don’t understand the title. It reminds me of “Bugs Bunny” though. BlendRoid Writes: February 4th, 2008 at 3:25 pm I really like it; it’s much better than A Rabbit’s Revenge. @Robin: Well, I’m a native speaker and I didn’t catch it if it is a pun or whatever, so don’t feel bad. Though I did notice the Bugs Bunny similarity. :) Gianmichele Writes: February 4th, 2008 at 3:36 pm don’t know…it seems a little weak. Gnaw was strange yes, but original in its way… But anyway, this short is going to rock! dusty Writes: February 4th, 2008 at 3:45 pm Nice choice! meschoyez Writes: February 4th, 2008 at 4:00 pm Gnaw Bunny? Bunny Wars? Indiana Bunny and the Rodents of doom? The bunny strikes back? Bunny Balboa? Echo and the Bunnymen? dammit… you’ve chosen. SeanJM Writes: February 4th, 2008 at 5:22 pm I like it. It makes it a personal story. Christiaan "AniCator" Bakker Writes: February 4th, 2008 at 5:38 pm And now I/We want a TRAILER! JoOngle Writes: February 4th, 2008 at 5:58 pm Big Buck Bunny? \O_O/ Sometimes I wish I didn´t have such a “dirty” mind…. …parodies…here we come…literally… TheANIMAL Writes: February 4th, 2008 at 6:10 pm Rabi-tribution. THAT is how you pronounce Rabbitribution. Thats a friking AWSOME name! Big Buck Bunny simply isn’t as good. Zach Writes: February 4th, 2008 at 6:27 pm i don’t know, its just missing something. while not necessarily needing to be a parody of something, i think it could have been a little more original, ya know, a little more creativity coulda gone it to it, but whatever, im impressed by it no matter what its called Joseph Writes: February 4th, 2008 at 7:04 pm I’ll take a guess at the unnamed actor…Would it happen to be John Candy in “Uncle Buck”? :D GREAT WORK, GUYS! I CAN’T WAIT!!!! ToastBusters Writes: February 4th, 2008 at 7:05 pm >> Indiana Bunny and the Rodents of doom? Now THIS is a title that I like. I’m hesitant to comment on the actual title chosen (other than that I liked “Gnaw” better); but it’s not my film. I’m just glad to see progress, looking forward very much to launch. :) DramaKing Writes: February 4th, 2008 at 7:08 pm ‘Big Buck Bunny’ certainly makes sense, but it sounds more like a Bugs Bunny cartoon. It sounds less sublime than ‘Elephants Dream’ and has less meaning than ‘A Rabbit’s Revenge.’It may be original, but it does really make me eager to watch it. Sorry if I sound offensive. CasperN Writes: February 4th, 2008 at 7:11 pm wow I love that name! Vojtas Writes: February 4th, 2008 at 7:22 pm I was looking forward to “Gnaw” .. what the hell happend ? Big Buck Bunny isn’t as bad, but I think it should be much more original. gaalgergely Writes: February 4th, 2008 at 7:30 pm the poster is awesome! humble Writes: February 4th, 2008 at 7:34 pm no more chuck norris jokes… buck bunny ftw Though the name sucks, sry voOdKa Writes: February 4th, 2008 at 7:40 pm Bunny is Big !!! oO BlendRoid Writes: February 4th, 2008 at 8:08 pm Thanks for the explanation. I still think it’s the best title becuase it’s not a parody of something and actually IS original, just like Elephants Dream. Everybody on here seems to have forgotten what original means. Anyway, the poster is so awesome I made into my desktop! And look, the bunny is holding Blender! http://uploader.polorix.net//files/874/got%20blender.png rogper Writes: February 4th, 2008 at 8:21 pm BBB B^3 ^_^ Big Buck Bunny… I like it ^_~ Although I was hoping that it would be The Rabbit’s Revenge… It’s not particulary good but it stiks into the head and it was kind of funny to pronounce :P emu Writes: February 4th, 2008 at 8:30 pm B is not a very nice letter. What about rather using a fig tree as the main character? And … hmm. Meh, but at least it looks like going to be funny. I’m probably too adolescent for making movie names ;)) steve Writes: February 4th, 2008 at 8:46 pm I love alliterations! Roy Schulz Writes: February 4th, 2008 at 8:54 pm I didn’t comment in the blog yet since most of the time there was no real dispute and I didn’t want to be the hundredth one cheering and applauding – although there was and is a lot to applaud. Especially the lighting creates a wonderful mood. Great work! Now I see some controversy about the name so it’s time to make a comment and state my opinion: I like the name. It is better than A Rabbit’s Revenge because it doesn’t give so much of the story away. And the alliteration is a nice touch. I’m looking forward to a great movie! Paul Caggegi Writes: February 4th, 2008 at 11:08 pm I HATE alliterations. I love irony, tho. Teeny Penniless Hare? There is a reason why they didn’t ask me to come up with the title, clearly… Francisco Ortiz Writes: February 4th, 2008 at 11:08 pm Everyone is going to call him Big Buck. I like it. BB is the king! Of the hill… Maybe? :) def-con-1 Writes: February 4th, 2008 at 11:42 pm HAHA!! didnt you guys research that title?!? HAHA!! there is already a gay porn film called “Big Buck Bunny”!!! HAHA!! who ever gave you that name played a very crule joke on you guys!! Sago Writes: February 4th, 2008 at 11:52 pm def-con-1 seems to know his classics! haha Alex Writes: February 5th, 2008 at 12:05 am Why not have a competition to pick a title. That’s a lame title. And CORNY! Sorry guy’s, it could be and should be as good as the movie you are creating. Hoggaman Writes: February 5th, 2008 at 12:46 am Big Buck Bunny sounds like a nice name to me. It’s easy to remember … BiBuBu. And I guess it makes a bit more sense than name for your first brainchild. Can’t wait to see it. Moxab Writes: February 5th, 2008 at 1:04 am Great! I love that title. It’s a better title than “Elephants Dream”. No offense Ton. jazzroy Writes: February 5th, 2008 at 2:06 am i think there’s really a big amount of people non so positive about the title. this short movie is going to fail even more than ED in involving the community in its production (maybe that’s just a lesson to be learnt), at least listening to the different opinions about the title should be nice. btw, wonderful wallpaper! BlendRoid Writes: February 5th, 2008 at 3:16 am @jazzroy: Seriously, are you nuts? The community was a huge part of both films, especially in the field of coding. Personally, I’m glad they don’t ask the community to be too involved, otherwise neither of the films would be of the quality they are, if even produced. Numarul7 Writes: February 5th, 2008 at 4:07 am “Big Buck Bunny” ?! Does not sound like “Bugs Bunny” hmm… or “Big Bugs Bunny” … hmm And the main characters are bunny`s Dunno but… Warner Brothers are around the corner :D Brendan Writes: February 5th, 2008 at 5:12 am I don’t think enough credit’s being given on the name. Has anyone on here seen the movie, or even know the plot? I think it’s a creative use of alliteration and research. Much better and more creative than “A Rabbit’s Revenge” (“Revenge of the WereRabbit”, anyone…?), even though that is a fun title. And honestly, I don’t really get Bugs Bunny out of the title, although I can understand how it looks (and sounds, if you say it fast enough) kind of similar. Looks great from almost every aspect–this will definitely turn even more heads than Elephant’s Dream! seed Writes: February 5th, 2008 at 5:27 am “A Rabbit’s Revenge” was a better title. This new title is unmarketable. Andrew Theis Writes: February 5th, 2008 at 5:44 am Awesome! Threw together a quick sig for anyone that wants it: http://www.amtstudios.com/images/2008/02/peach-meet-buck.png scibotic Writes: February 5th, 2008 at 7:17 am Sorry to say but that name really does nothing for me. Sam Writes: February 5th, 2008 at 8:16 am I can’t honestly say I’m completely happy about your choice, but I suppose content is the main thing. I’ll just say this, though: If I had the choice between watching a short called “Big Buck Bunny” or a short called “Ribbitribution”, I’d choose the latter. Sam Writes: February 5th, 2008 at 8:17 am (pardon my spelling error: *Rabbitribution*) Micah Writes: February 5th, 2008 at 8:54 am I think the eyes are much better now!!! Maybe it is the new ambient occlusion? Roy Schulz Writes: February 5th, 2008 at 9:15 am quote: (pardon my spelling error: *Rabbitribution*) It seems like this title would actually be too difficult. ;) Höhrer Writes: February 5th, 2008 at 9:41 am Gnaaaaw! BBB, Nice title :) jaco Writes: February 5th, 2008 at 10:19 am I find the title a bit too “static”…it don’t tell anything about upcoming events and etc and don’t create that intrigue… Rabit revenge was a bit more gripping title, cause you can feel from title that something interesting will happen… And from title Big Buck Bunny you just understand that there will be big buck bunny in this cartoon/movie..but that’s all..,,,so it’s not very intriguing… jazzroy Writes: February 5th, 2008 at 10:57 am @BlendRoid: no, i’m not nuts :) as i said in brackets, probably not involving the community in the production was the only way to finish the movie in time with the best quality. but ton on both movies stated that the community would have had a direct role in making it, in ED it ended in just a call for some textures, in BBB probably ends up in nothing. I don’t criticize this move, but it is evident that this point is failed, so it has to be reconsidered next time. JoOngle Writes: February 5th, 2008 at 11:34 am He´s Big…. His name is Buck… And he´s a Bunny… What part of Big (insert sago brain here) Bunny don´t you understand ;o) Len Writes: February 5th, 2008 at 1:13 pm I’m not to keen on that name guys … sorry … but hey, you guys know what you’re doing so maybe I’d change my mind after seeing it. Sounds too much like Bugs Bunny to me and that’s just too old … Roksvamp Writes: February 5th, 2008 at 4:14 pm Hey Nathan, this may be a bit off-topic but do you have Scandinavian relatives? “Vegdahl” sounds quite nordic, and you look a bit like the average Swede if you ask me (I can tell, as I live there) =P RNS Writes: February 5th, 2008 at 4:26 pm Beautiful!!! I mean the the picture not the Title.I prefer ” Buck and the pack Nuts ” I was thinking about that old movie with Jimmy steward and his imaginations rabbit and the RATS Pack with frank S. MArco Writes: February 5th, 2008 at 6:20 pm I want more youtube video about the team and the studios !! Please!!! make me happy !!! Jahmaica Writes: February 5th, 2008 at 10:54 pm BIg bu bunkaslhjnny … sucks! Why not rabit revenge or even peach… now… big buck bunny… :Z cpegberts Writes: February 5th, 2008 at 11:23 pm Big Bunny Buck is a much beter name, the sound starts high then goes down and ends high. Big Buck Bunny starts high, stays high and ends low. That’s not the way film titels work. Me Writes: February 5th, 2008 at 11:57 pm Yeah, the title doesn’t seem to reflect the quality of the movie. WoOdman Writes: February 6th, 2008 at 12:25 am As a stand alone phrase big buck bunny is harsh in tone. I believe that it is because of the ‘ck’ in the middle of the title. Something like ‘Big Bullied Bunny’, or just ‘Big Buck’ already sounds a little better phonetically. You don’t want to have people miss out on this just because the name didn’t appeal to them. Do a little research into phonemes and the brain if you wish to change the title. oxigen Writes: February 6th, 2008 at 1:10 am C’mon guys, i really don’t understand what are you complaining about!? This is the only opportunity in your life for a free Big Buck! Numarul7 Writes: February 6th, 2008 at 1:54 am Haw about this tittles : Bunny`s in trouble ?! Bunny masterpiece ? The Bunny and the peach ? The Big Bunny and the Golden Peach ? Hungry Bunny`s ? Big and Puffy ? Rabittackle ? The Rabit and the Question ?! “Where it is the peach ?” `Cmon there are a ton of alternatives Thommo Writes: February 6th, 2008 at 2:04 am Don’t change the title to “Big Buck Bunny”, “Peach” was already an awesome name, simple and effective. Sam Writes: February 6th, 2008 at 3:23 am If you’re even considering changing it, I think just plain Big Buck sounds better. Just drop the Bunny. def-con-1 Writes: February 6th, 2008 at 4:37 am Rabbitribution is a great title wtf? and yes sacha my knowlege of gay porn is extensive and encyclopedic….. JoOngle Writes: February 6th, 2008 at 10:24 am Big Butt Bunny The Bunny & Nuts The Nutty Butty Bunny (argh, no..really) Jabba the NUT..(nononono..thats another…) Big Buckaroo Bunny & The Nutheads Gnawing Nuts & Big Bunnies Big Buns & Nuts (hm… I actually want to make that one) 3 nuts and a BIG Bunny I´ve gotta stop…really…. Johan Writes: February 6th, 2008 at 3:03 pm Title sucks. Luckily I can replace (re-render) the movie title with my own title ‘On hares end’. Sean Writes: February 6th, 2008 at 3:26 pm I like the title – yes, it does sort of remind me of a Bugs Bunny title, but I’m okay with that. I think it’s a nice nod (even if unintentional) to the heritage that all modern animation comes from. Can’t wait to get my DVD!! Cub Writes: February 6th, 2008 at 4:24 pm Agreed, sounds better without the ‘bunny’. Carl Complaint Writes: February 6th, 2008 at 5:35 pm “Big Buck Bunny” has the same problem as “Elephants Dream” – it’s just too ‘intelligent’. “A rabbit’s revenge” was pretty OK. Sam Allen Writes: February 6th, 2008 at 5:38 pm Well, the title’s fine with me. I could imagine that people would have wanted a better title though, considering the awesome work we’ve seen on it so far. Honourable laughs: ROFL @ meschoyez “Indiana Bunny and the Rodents of doom?” ROFL v2 @ JoOngle “3 nuts and a BIG Bunny” Harold Tovar Writes: February 6th, 2008 at 9:58 pm i think what the title is cool congratulations guys Clacky Selwog Writes: February 7th, 2008 at 12:29 am “The Bold & the'
