full_description = '« Our Animation Schedule Maqina Workstations & Benchmarks » Dec 31 Good intentions for 2008: write more blog posts! Posted in Blender Institute, Random Fluff by Ton I’ve been teaching the guys and girls here how to play the renowned Dutch student card game “Toepen”, which doesn’t have winners, but only losers. Obviously – since it’s a student game – the loser has to get everyone drinks. Here in the institute we have free drinks, so we made up penalties for each round… and I’ve lost the round with as a penalty to make a blog post with a silly picture! So here it is; the New Years Eve crew (minus Andy who takes the picture, and Enrico + William + Brecht who celebrate it at home) and with Campbell’s girls Cathy and India. On behalf of everyone: happy new year and let’s make it a great 2008! -Ton- 23 Responses Anthoni_C Writes: December 31st, 2007 at 9:28 pm First Cessen’s video now this… What a weird group… haha. EnV Writes: December 31st, 2007 at 9:29 pm Happy New Year to all! theeth Writes: December 31st, 2007 at 9:43 pm Happy New Year! César Sáez Writes: December 31st, 2007 at 11:15 pm Happy new year!!! Numarul7 Writes: December 31st, 2007 at 11:38 pm Happy New yeat!! Ton and the crew :P Vojtas_CZ Writes: January 1st, 2008 at 12:36 am Have fun with animating. And a Happey new Year. Felix Kütt Writes: January 1st, 2008 at 12:46 am well, its actually 00:47 here, but non the less, happy new year! =) meosoft Writes: January 1st, 2008 at 1:25 am Happy new year! campbell barton Writes: January 1st, 2008 at 2:11 am Hey Guys, just back from the fireworks, man they are scary! – going of all around us and really close! @theeth, remember tetrinet? we all played and made some teams, young vs old, glasses vs no glasses, aussies vs world. umm…. thats about it, Oh, and played UNO also. Walking home might not be 100% safe with all fireworks going off so sleeping here. happy new year! AniCator Writes: January 1st, 2008 at 2:32 am Sacha wearing glasses! I’m wearing lenses. inazuma Writes: January 1st, 2008 at 6:31 am Here’s to a Happy New Year! Now get back to work. ;-) K Satish "iluvblender" Goda Writes: January 1st, 2008 at 7:29 am Happy Blenderful New Year Folks. blenderian Writes: January 1st, 2008 at 7:53 am Have a wonderful and productive New Year! Erik Möller Writes: January 1st, 2008 at 12:38 pm A happy & successful 2008 to all of you! You rock – keep the furry animals coming! ;-) sam Writes: January 1st, 2008 at 1:38 pm alles gute zum neuen jahr! (best wishes for the new year!) –Sam anton vd haterd Writes: January 1st, 2008 at 2:08 pm super splendid new year Lasphere Writes: January 1st, 2008 at 8:45 pm haha Happy new year! Holiday Hawk Writes: January 1st, 2008 at 8:56 pm Happy New Year! JoOngle Writes: January 1st, 2008 at 9:52 pm Happy new year ya crazy bums! ;) Now get working! (Slap! Whip!) Vincent Writes: January 1st, 2008 at 10:48 pm Happy new year :) (And we also often played toepen with a winner where the last two would get eight cards each and… Hmm, well, I’ve quite forgotten how we did it, but we did :) ) Danny Writes: January 2nd, 2008 at 12:43 am Happy new year and all the best wishes to the peach & apricot team members! joeedh Writes: January 2nd, 2008 at 5:07 pm there wasn’t a delayed timer on the camera? :P yay new years bunnies for everyone! Joe Tom Writes: January 2nd, 2008 at 6:57 pm funny picture… ;-) what is campbell´s daughter doing? is she dancing? ;-) happy new year!!'
