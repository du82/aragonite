full_description = "« Physics Sprint Results Studio tour #2 » Oct 17 Storyboarding! Posted in Production by Ton Whee, this is totally fun! Every few hours I’m checking the boards and tables to see the movie being progressing. Making such detailed storyboards will add a lot to this project, certainly with the sketching skills of Enrico and Sacha. With this pace we’re ready in a couple of weeks! (Well, with the storyboards and animatic). Images: – Enrico drawing on new light table – Brecht hiding behind two micropolygons – William editing the animatic (I hope) – Andy decided it was time to put on a silly hat – Sacha directing – Campbell has fun anyway – The opening sequence of the movie (which now probably gets redone completely) 24 Responses Timothy Writes: October 17th, 2007 at 8:44 pm Cool, and yes, Andy’s got the “I’m and artist and that’s why I can wear this hat” look going on with that get-up. Gianmichele Writes: October 17th, 2007 at 9:27 pm Too cool! Go Enrico! But please, don’t spoil too much on the plot :D Sergeant Oreo Writes: October 18th, 2007 at 4:59 am Thanks for the pictures. Nice hat Andy! ^_^ mfoxdogg Writes: October 18th, 2007 at 7:18 am omg brecht smiled!!! :P grafixsuz Writes: October 18th, 2007 at 7:39 am Way cool guys thanks for the update… I am so glad Arno Kroner was able share his wisdom in the ways of production. I can’t wait. Just from a few of the pictures on the wall, I can see this is going to be very cool. William get back to work… Cathy Writes: October 18th, 2007 at 9:08 am Campbell, clean up your desk! Sago Writes: October 18th, 2007 at 9:59 am Cathy, tell me about it. Was he always like that? Geez, he’s like a little kid. Have to clean up behind him every frickin’ second. But honestly, he’s a cute and fun little toddler. Wouldn’t wanna miss this fella. EnV Writes: October 18th, 2007 at 10:49 am Yeah Sacha, me too, gh! Gianmichele, I’m going, I’m going… Cathy Writes: October 18th, 2007 at 11:48 am Sago, I’m afraid to say he has always been like that. He has told me he is much cleaner now! I’m not sure…… Goofster Writes: October 18th, 2007 at 11:56 am heheh, Sacha is like “hmmm, that doesn’t look right” and Enrico is like “OMG shutup you kid! I’m not doing this all over again!”. Serious question though, any problem with the age gap? Sago Writes: October 18th, 2007 at 1:50 pm Cathy, don’t worry about Campy. He’s doing fine…. for a hyperactive aussie-kid. Goofster, no problems with the age gap. Only with the sober-dutch-guy-and-weird-italian-geezer gap. Roksvamp Writes: October 18th, 2007 at 7:45 pm Looking good. Haven’t seen such a cool hat in ages ^^ Hm..do you have Elephants Dream posters all over the place? =P popolito Writes: October 18th, 2007 at 9:40 pm courage à toute l équipe !!!! AvidThrows Writes: October 18th, 2007 at 10:06 pm I think it’s about time we learn that the entire studio is fake, and has been rendered in blender. Even the people. It’s sad, because we all didn’t notice. Yeah, blender just rocks that hard. jazzroy (riccardo) Writes: October 19th, 2007 at 3:13 pm hi guys, it just seems that sago wants the rabbit go to the left, and enrico to the right, and they totally disagree.. but hey man, they both have read sooo many comics!!! just my guess, obviously….. ERM Writes: October 19th, 2007 at 9:26 pm What’s the color picture above the storyboard? Early character render? ZanQdo Writes: October 20th, 2007 at 12:38 am awesome, the Blender Institute is looking amazing :D send me one of those “micropoligons” he he Big Fan Writes: October 20th, 2007 at 12:58 am so Dr Zeus characters are in this as well (unusual hat) ;o) …but why are campbell and william looking at porn while everyone else is working Alexander Ewering Writes: October 21st, 2007 at 2:41 am Big Fan: Probably because Campbell added some options to the “PornGL” preferences (see one of his last commit messages ;-) Big Fan Writes: October 22nd, 2007 at 8:31 am thanks Alexander (…I get the feeling this movie project is going to struggle with humour even more than a Wu flash…) Big Fan Writes: October 22nd, 2007 at 10:03 am hey! I just realised I got my spelling wrong – its Dr Seuss – arrgggh! …long time ago you understand ;o) Wim Writes: October 22nd, 2007 at 2:18 pm I’m reading about dual quaternions… Are you guys making use of this feature for Peach, and if yes, any experience yet? Mark Keller Writes: October 23rd, 2007 at 11:59 pm Pity the storyboard image is so small we can’t see what’s going on . . . ;-) campbell barton Writes: October 28th, 2007 at 12:44 pm @Wim, I expect so, but there are other things in the develoment pipeline too as fair as mesh deformation goes."
