title = "Big Buck Bunny  » Blog Archive   » We’re slowly getting there…"
full_description = "« Sun network.com renders Peach We want volumetric clouds in Blender!! » Oct 27 We’re slowly getting there… Posted in Production by Sacha A good story is no certainty for a good storyboard, and a good storyboard doesn’t necessarily make a good animatic. … a nice opening sentence for my very first blogpost here, but that’s all the wisdom you’ll get from me (we know that’s not what I’m here for). After a few weeks of storyboarding by me and Enrico, and making the animatic by William, we were able to watch the full animatic on last tuesday. Things look different when you see it in a different form, and the animatic is no exception. After watching and discussing the animatic it was clear there were ‘some’ issues, and the necessary solutions varied from better timing, slight adjustments and big changes. For me this meant back to the brainstorming and storyboarding… I skipped the writing (writing sucks). And some changes were made indeed. Oh yeah. This photo shows some storyboard plates, around 175 of them. Some pretty good ones, and it’ll be more later on. They’re all rejected, taken out the last version of the storyboard. Though making changes is a lot of work, I’m getting more and more excited about the movie. Every phase shows new improvements, some small, some major. And do I see some twinkling in Andy’s eyes when we’re discussing the story? Hmm, perhaps because of some dark elements we’re putting in the story. Anyways, it’s clear we’re aiming for a total fun-packed, fully wacky entertainment rollercoaster ride…. and we’re slowly getting there. Yesterday (friday) we had our first real weekly. 2 guys from Filmmore (a post production company, 10 seconds walk from the Blender Institute) came over to drink our beer and look at what we made so far. One of them worked at NaN, in the early days he was known as Zycho in the Blender community. Both are graduated from the Film Academy, and I guess that means something, right? Though we weren’t able to show them all the new changes we made in the story, it was still helpful and refreshing to hear their opinion. We still have a lot of work to do, but this weekly made me feel we’re absolutely on the right track. Peach out, Sacha 11 Responses LoMac Writes: October 27th, 2007 at 1:52 pm Is there some sort of secret government location just north of where that Filmmore place is? cause on the Google maps its all pixelated. andy Writes: October 27th, 2007 at 2:03 pm as far as i know it’s a secret government facility for anti gravity research and testing. grafixsuz Writes: October 27th, 2007 at 3:40 pm Sacha, that is great news to hear your enthusiasm for the movie growing ever more, even though you have to toss away a lot of hard work that has been put in so far, that means that you most definitely are on the right track. Good work and great to hear from you! @lomac: yeah that is a secret government facility just north of where that Filmmore place is, and now that you know, I am going to have to kill you! Calli Writes: October 27th, 2007 at 6:39 pm Zycho! Great to hear from him. Carsten gaalgergely Writes: October 27th, 2007 at 9:08 pm andy on 27 October, 2007 at 2:03 pm as far as i know it’s a secret government facility for anti gravity research and testing ==so thats why i felt myself “elevated” when i was walking on the streets of amsterdam. phew, big relief..first i thought it was caused by the smell of freshly baked cakes with the “special” ingredient in it. Höhrer Writes: October 27th, 2007 at 11:09 pm The “10 seconds” do not seem to be an understatement :) http://maps.google.com/maps?saddr=Entrepotdok+66,+1018+Amsterdam,+Niederlande&geocode=&dirflg=&daddr=Entrepotdok+57A&f=d&sll=52.369416,4.915363&sspn=0.0045,0.007553&ie=UTF8&ll=52.367984,4.916106&spn=0.001125,0.001888&t=h&z=19&om=1 Oh and this pixelated area to the north is just the place where the Peach Movie is filmed – nothing will be rendered – it’ll be changed to look like that in post-pro ;) Werner BB Writes: October 28th, 2007 at 12:52 am The pixelated area is actually the park where Sacha sketches the top secret ideas for peach. IamInnocent Writes: October 28th, 2007 at 7:40 pm Excellent article Sacha where you made us feel the process. Thanks Gianmichele Writes: October 29th, 2007 at 11:38 am Yeahhhh…I think you’re going down the Pixar way. Making a better story is making a better foundation for the short, and it will be a easier down the road. Everything else will add to this and I’m sure it’ll look gorgeous! Digitist Writes: October 31st, 2007 at 7:05 pm Sacha, Will all the storyboard images be put on de DVD? Sago Writes: October 31st, 2007 at 7:24 pm Digitist, I think it would be great if we can put the animatic on the dvd, including deleted stuff."
