full_description = '« Linux Pro Italian magazine The wedding day of Enrico and Micaela » Jun 19 The Making of “Big Buck Bunny”: An Open-Source Evolution on Siggraph ’08 Posted in Events by Margreet The Making of “Big Buck Bunny”: An Open-Source Evolution Wednesday, 13 August, 8:30 – 10:15 am Petree Hall C In May 2008, the Blender Foundation released their second open-movie project: “Big Buck Bunny,” a funny and furry 3D short about a giant rabbit who gets even with bullying rodents. This session brings together the key people who created the movie and presents all the aspects of an open-source and open-content-based animation studio, and how this affects the creative process. The panelists showcase project files from the studio, and even recreate parts of the film on demand! This 90 minute session starts with a screening the 10-minute film and ends with a 15-minute Q&A with the audience. http://www.siggraph.org/s2008/attendees/caf/caftalks/index.php 6 Responses Sameer Writes: June 19th, 2008 at 1:51 pm All the best for Siggraph 2008 Leo Writes: June 19th, 2008 at 1:54 pm Great news! Satish "ILuvBlender" Goda Writes: June 19th, 2008 at 5:08 pm This is going to be a great session. Good luck team Peach. jzwies Writes: August 8th, 2008 at 2:34 am Big Buck Bunny was awsome, it was funny. I tried learning how to use blender but but gave up, I didn’t know blender could do such awsome animation. To this day I still don’t know how to use it. Joseph Collins Writes: July 21st, 2009 at 3:43 am I would like to broadcast your movie on the Punch television network please contact me at 1-909-486-4742 in the USA. or you may email me Joseph Collins Punch TV Network. Jaco Vosloo Writes: September 22nd, 2009 at 11:14 pm You are an awesome motivation for kids at school to try 3D rendering. It would be wonderful to have a making of video to show the kids how you got to the end result.'
