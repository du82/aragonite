title = "Big Buck Bunny  » Blog Archive   » One week before start"
full_description = "« This is not a clinic (updated) Peach started! » Sep 23 One week before start Posted in Production by Ton As you can all see, the pre-sale of dvds is going to pass the 1000 mark in a couple of days! That’s excellent, everyone here is very grateful for this support. This week is also the last chance to get a dvd ordered with discount, and with your name added to the credits. Do note that the name credit is only for those who pay before october 1! Only for bank orders we’ll allow a couple of days delay. More production news updates: The Peach project is going to be supported by the Dutch “Digital Pioneers” fund, they will cover almost all the costs for the two developers, Brecht and Campbell. That I already know for a month, but I didn’t announce it before they have it officially on their website… which is still pending. Starting October 12th, first day of the conference, I will be assisted by Margreet Riphagen. She will then become Producer in the Blender Institute, responsible for all organizational tasks involved with running this place and its projects succesfully. The best part of this news is that I then have plenty of more time for working on development again! I expect to be coding again in november latest. Really! We’ve found a hardware sponsor, Maqina! Not that we get everything for free… but with significant discounts, way below cost price for this dealer. That means we can also afford the really good stuff. Everyone gets Eizo monitors, for example! More about this company later. Tomorrow we’ll do more construction work though… two walls are going to be removed (we remove the dark room “to lock up bad coders”), to make a 2nd studio room for people to work in. -Ton- 29 Responses Gianmichele Mariani Writes: September 23rd, 2007 at 2:03 pm Man, I’m really amazed to see what you guys are coming up with. Do you know that next year, there will be a lot of people that will apply to take part in the next project ? Felix_Kütt Writes: September 23rd, 2007 at 2:46 pm mmm.. next project.. wait isn’t that the apricot? :D Ian Elsner Writes: September 23rd, 2007 at 8:24 pm I’m really excited simply to be able to follow the production, to say nothing of seeing the finished work. The discounted hardware is great news as well. All the best! Richard Writes: September 23rd, 2007 at 10:09 pm Yea, congratulations. Development seems to be going very smoothly. Good luck. LoMac Writes: September 24th, 2007 at 7:03 am I just pre-ordered my copy the other day. It was quite a fiasco, but well worth it. Pierre Writes: September 24th, 2007 at 1:39 pm I pre-order the dvd last week… I’m very happy to give my aid so.A question Mr. Ton why not to consider the audio in more languages on DVD? Es: French, Italian, Spanish, Portuguese? Good luck… ton Writes: September 24th, 2007 at 3:05 pm We will certainly look at proper translations for the dvd. Currently it looks like we’re going for a dialog-free story though. Cubedude04 Writes: September 24th, 2007 at 3:44 pm This is great news i’m really looking forward to hearing more news Olaf Writes: September 24th, 2007 at 3:56 pm Dialog free story? That’s unfortunate as quality voice acting greatly enhances the storytelling. Roksvamp Writes: September 24th, 2007 at 6:38 pm Great that you found a hardware sponsor! I’m really looking forward to follow the development of peach and, of course, to watch the movie itself in April. Keep up the good work, and good luck with everything =D JMC Writes: September 24th, 2007 at 9:39 pm yes! I am not exactly sure but I think I am the 10000th! ;) And thank you for this news! I said Writes: September 24th, 2007 at 9:52 pm From the looks of it now, it’ll seem like the movie will be like Ice Age’s “Gone Nutty”. No dialog and a similar style picture on the header. http://youtube.com/watch?v=uuqOW3o2pnM FuzzMaster Writes: September 24th, 2007 at 10:02 pm Whoo 1000 Toni Grappa Writes: September 24th, 2007 at 11:44 pm [quote] I expect to be coding again in november latest. Really![quote] Very, very good news.. Jay Writes: September 24th, 2007 at 11:47 pm 1000 !!! That’s it! Congrats for this success and much luck for the project from me!!! LetterRip Writes: September 25th, 2007 at 12:19 am Dialogue free makes a lot of sense – lip synch is costly in terms of how much animator time it takes. There have been plenty of quite good dialogue free animated shorts – the majority of Pixar shorts have been dialogue free. LetterRip mfoxdogg Writes: September 25th, 2007 at 2:35 am Great new Ton, im very happy for you guys do you have any info to share about your assistant? NoOne Writes: September 25th, 2007 at 7:33 am If the result will be anything like this http://youtube.com/watch?v=0_eZqpHDUAA , I will be very happy and pleased to my DVD order. Philip Writes: September 25th, 2007 at 2:13 pm But how will you keep the coders coding without a forbidding room to put them in when they complain about the whips? David Revoy Writes: September 26th, 2007 at 1:17 pm Congratulation for the great news ;-) It’s a pleasure to read the post here. I wish great work to all the Peach team ! joeedh Writes: September 27th, 2007 at 8:35 am Good news, wahoo! Joe grafixsuz Writes: September 27th, 2007 at 3:52 pm Well Congratulations guys. I can’t wait to see what this project will become, not just in features for blender but the whole thing. By the way, to the new producer Margreet Riphagen, welcome! I wish you all the best, and say thanks for taking such a busy role! Good luck guys, break a leg! Leodp Writes: September 28th, 2007 at 2:01 pm Apricot?? Noo, if it grows like that next project is going to be the Watermelon :-D Tynach Writes: September 30th, 2007 at 12:19 am I just paid for mine :). Can’t wait to see how this project turns out! Pierre Writes: October 1st, 2007 at 4:09 pm Hi Mr Ton and the Team… have you some news about Peach? Today is the first Day? bye bye HolgerB Writes: October 1st, 2007 at 4:53 pm Hi Peach Team! Today is your first day and I wish you all the best for the Project! Kind regards Holger Felix_Kütt Writes: October 1st, 2007 at 6:53 pm all the best , alright! ;) ERM Writes: October 17th, 2007 at 3:17 pm thanks to the commercial sponsors for helping out!"
