title = "Big Buck Bunny   » 2008 » May"
full_description = "May 30 Big buck Bunny movie files released! Posted in Blender Institute, Events, Random Fluff by Ton Friday, May 30th, 2008 We’ve collected several mirrors worldwide for a stable and – hopefully fast – hosting of the BBB movies. You can download the files in four different flavours, which will nicely work for all common video players and OSes. The download section also has Vimeo and Youtube links for streaming video. Lastly, mirrors with the DVD ROM studio files are also being added now! Have fun watching! And, thanks again for the great feedback and ongoing support. It has been a great ride for everyone here, and I definitely look forward to the next open movie… which – as promised – will not start before the Blender 2.5 project is in usable state. Most likely that’s end of 2008, early 2009. Lastly: don’t stop buying the DVD! Revenues will be used as startup financing for the next Open Movie, and hopefully I can afford to send the full Peach team to Siggraph… -Ton- Posted in Blender Institute, Events, Random Fluff | 262 Comments » May 28 BBB at CG Overdrive Posted in Events by Sacha Wednesday, May 28th, 2008 One of the benefits of being one of the creators of an open movie like BBB, is that you get to show it in different places all over the world. And that’s exactly what we want, Blender worldwide. One event I’m extremely happy about is CG Overdrive in Singapore, Asia’s biggest Computer Graphics conference (some of you might have already read about it on BlenderNation). (more…) Posted in Events | 22 Comments » May 22 The DVD arrival wave… Posted in Blender Institute, Production by Ton Thursday, May 22nd, 2008 We have shipped everything to Europe and rest of world last tuesday, May 20th. Some close Europe countries might arrive already this week friday or saturday. Dutch orders are being shipped today, and arrive friday. (Well, there’s rumours the Dutch Mail will strike…) So, we hope almost everyone can their own home-cinema premiere during the next 10 days. In the mean time we’ll build a large network of http mirrors, torrents, and streams to make sure we can do the public movie launch on May 30 or 31st. Keep tuned! In anticipation of the DVDs, we’ve upgraded the gallery with a couple of final frames from the movie. Also check the press section for a great story about BBB in today’s Netherlands largest quality news paper. Finally: please mark in the Frappr map below when you get the DVD. Makes it a review of our shipping company as well. :) http://www.frappr.com/?a=constellation_map&mapid=137440549214 Posted in Blender Institute, Production | 115 Comments » May 20 Awesomeness, it’s a DVD!! Posted in Blender Institute by Sacha Tuesday, May 20th, 2008 Today we found some DVD’s (around 2500) outside the door of the Blender Institute. So we had the idea to just bring them inside and start packing them, get them ready for shipment. All I can say is pretty awesome. Many thanks to Anne and Anja from the e-shop, some guys from the Apricot team and Martin Poirier (theeth) who are working hard to get the dvd’s out as fast as possible…… oh, and Ton too. Peach out, Sacha Posted in Blender Institute | 44 Comments » May 11 The release! Posted in Production by Ton Sunday, May 11th, 2008 The dvd gold masters were sent in time to the printer, with as aim the may 15 release. Of course the day after we sent the discs some errors were detected… like stereo sound in the ntsc movie, where 5.1 was more appropriate! New gold masters were sent, but it means that the printer needs extra days too. That means the discs get delivered here now on tuesday May 20th (confirmed date by printer). We then will ship all of them the same day. The online release of the film will then happen 10 days later, May 30 or 31. We’re already lining up great mirror websites, sufficient for everyone to watch or download the film the same day! Really curious to learn your reactions… :) -Ton- (BTW: May 17 or 18 is Blender 2.46 release. We’re going to get a good website traffic test!) Posted in Production | 60 Comments » May 02 DVD authoring last bits Posted in Blender Institute, Development by Ton Friday, May 2nd, 2008 We’re doing the last bits on the dvd set… encoding and authoring a video DVD and collecting and testing all files for the DVD-ROM is just a bit too much work to be really fun… especially for people suffering post-BBB fatigue! :) Even after about 6-8 manweeks of work on this DVD we could easily add another four or so. Nevertheless, we should now finish! Here’s a quick shortlist of what you can expect, at least: (more…) Posted in Blender Institute, Development | 50 Comments »"
