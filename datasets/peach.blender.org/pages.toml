full_description = "« Movie title? random environment, rodent & rabbit renders » Jan 24 See how the environment is progressing Posted in Development, Media Gallery, Peach Press, Production by Margreet Enrico, Andy and the technical team have been busy for a long time now to create the environment for Peach. Here you can get an impression how it is going to look like. It is getting somewhere, and of course it is not even finished yet! .ogg file 15 Responses Alexander Ewering Writes: January 24th, 2008 at 7:48 pm Pretty odd site layout today ;) nawabz Writes: January 24th, 2008 at 9:01 pm still cant get first comment, almost there!! nice. will we see those images in gallery? Felix Kütt Writes: January 24th, 2008 at 9:10 pm very nice lighting there! ;) kudos to brecht! Felix Kütt Writes: January 24th, 2008 at 9:11 pm and good luck on finishing in time to the whole team! LoMac Writes: January 24th, 2008 at 10:20 pm Looks great so far! Gianmichele Writes: January 24th, 2008 at 10:36 pm mizzeca!!! (eheh ask EnV for the meaning!). Looking forward for the first final image. Good luck everyone! Wim Writes: January 25th, 2008 at 12:52 am Keep going Peach-team! Great work! I bet Blender will get lots of attention with the Peach movie! dusty Writes: January 25th, 2008 at 10:54 am Broken link on the first image. wayne Writes: January 25th, 2008 at 1:33 pm wow… looking great guys! this movie is going to rock the world! i just hope the actual animation isn’t rushed because of deadlines. after all a beautiful environment wont improve shoddy animation :) and i hope you realise you guys are making history!!! Peng You Writes: January 25th, 2008 at 1:54 pm Hi env! Congrats to all the peach team! will all the artworks shown in the video be included in the final DVD? I hope so! bye and have good time to everyone! nawabz Writes: January 25th, 2008 at 2:09 pm i am positive its going to be on the DVD’s because the last Open Source movie had everything to the maps of characters. i only with they can record their screen when they are animating without it getting in their way ofcourse. thatll make it even more OPEN source EnV Writes: January 25th, 2008 at 9:55 pm Hi Peng You! Yes, the plans are to put everything we produced on the dvd. Anthoni_C Writes: January 27th, 2008 at 5:03 am Yall should change the background of the site to something that looks better instead of just gray. voOdKa Writes: January 27th, 2008 at 12:30 pm hum… très jolie !! very beautiful !! john Writes: May 29th, 2008 at 10:24 pm humm very wounderfoul accent non? ;)))"
