title = "Big Buck Bunny   » About"
full_description = "About License information The results of the Peach open movie project has been licensed under the Creative Commons Attribution 3.0 license. This includes all the data we’ve published online and on the DVDs, and all of the contents on this website. If any content on this site is not licensed as such, it will be clearly indicated. In short, this means you can freely reuse and distribute this content, also commercially, for as long you provide a proper attribution. The attribution is either one of the following cases 1) For this website and files on the DVD ROMs: Blender Foundation | www.blender.org 2) If you screen or broadcast the entire movie and/or documentary: Include the entire credits roll in ending. 3) If you re-use (or screen, broadcast) parts of the movie or documentary itself, or duplicate the DVDs: (c) copyright 2008, Blender Foundation / www.bigbuckbunny.org 4) Some of the texture files on the DVDs have an own Creative Commons attribution, these are indicated clearly. Excluded from the Creative Commons is: – all logos on this website (including Blender logo, Creative Commons logo) and associated trademarks – the DVD cover (inlay) and DVD disc print Examples You are free to duplicate the DVDs and distribute or sell them, but in that case you have to make your own cover art and DVD prints for it, with of course the proper attribution as mentioned above in 3). You are free to broadcast the movie and documentary on your local TV station, just include the entire credits roll too. You can re-edit parts of the movie into a video clip for your band, just include the attribution as mentioned above in 3). You can use textures and .blend files (or models, rigs, etc) from the data collection on the DVDs, also in commercial projects. Just make sure we get our short credit as mentioned above in 1). You can organize a screening in a cinema, and charge an entrance fee for it. Just include the movie credits in the screening. You can submit the movie to festivals even! Festivals can also screen the movie without our permission. It would be nice though to get a notification for it, especially when we win prizes! :) How it started As a follow-up to the successful project Orange’s “Elephants Dream”, the Blender Foundation initiated another open movie project. Again a small team (7) of the best 3D artists and developers in the Blender community have been invited to come together to work in Amsterdam from October 2007 until April 2008 on completing a short 3D animation movie. The team members will get a great studio facility and housing in Amsterdam, all travel costs reimbursed, and a fee sufficient to cover all expenses during the period. The creative concept of “Peach” was completely different as for “Orange”. This time it is “funny and furry”! The Blender Foundation and Blender community have been the main financiers for Peach. As for the previous open movie, a pre-sale campaign to purchase the DVD set in advance will be organized. Additional support from sponsors and subsidy funds has been realized as well. Peach also was the first Open Project hosted by the new Blender Institute in Amsterdam. This will make the project more independent, without much involvement of production partners, and also will ensure continuity. Peach Targets This Open movie project had as main targets: Developing tools in Blender for editing and rendering hair, fur or grass Improve character animation tools for cartoonish motion and deformation Test Blender with giant outdoor environments, with large grassy fields and many trees with leaves Further validate Blender as a professional animation creation suite And secondary: Create a great and good looking animation short, licensed freely as open content Provide content for other artists to learn from or to re-use, including documentation and tutorials And of course: Have lots of fun! Sponsors or Partners We were happy to announce as sponsor: Digitale Pioniers Rendering: Sun network.com Hardware: Maqina Computersystems Music composition and sound design: Jan Morgenstern Sound studio facilities: wavemage Contact details If you want to know more about this project, or want to discuss involvement with future Open Project in the Blender Institute, please contact Ton Roosendaal, ton at blender dot org. Donations Click on the button below, or use foundation(at)blender.org to do the payment to. Donations of 30 Euro or more: you can get your name mentioned in the movie credits, like for the DVD presale credits. Please tell us which name. Donations of 250 Euro or more: you can get your name mentioned as Main Sponsor in the movie credits."
