title = "Big Buck Bunny  » Blog Archive   » Meanwhile there are lots of things happening in the studio."
full_description = "« Mesh Deform Modifier Witness the Weekly » Nov 16 Meanwhile there are lots of things happening in the studio. Posted in Development, Media Gallery, Production by Margreet Serious business…. Short interviews with Sacha how to model a walnut, how Enrico still is trying to finish the environments, William trying to figure out what the true identity of the bunny is and Nathan is dancing with the chinchilla :) The Google movies are dark but you can also download the .ogg files. Download file of Sacha modelling Download file of Enrico creating the environment Download file of William animating the bunny Download file of Nathan rigging the chinchilla 45 Responses grafixsuz Writes: November 16th, 2007 at 6:08 pm These are so cool to watch. Looks fun! grafixsuz Writes: November 16th, 2007 at 6:09 pm Keep it up guys! Gianmichele Writes: November 16th, 2007 at 6:14 pm I almost check the blog every 30 min. I’m becoming addicted…fun stuff guys! RNS Writes: November 16th, 2007 at 6:18 pm Great job!can’t wait to see the final result. Pseudonym Writes: November 16th, 2007 at 6:57 pm I would totally give a shot at any models you guys requested. Danny Writes: November 16th, 2007 at 7:47 pm I’m checking the peach blog everyday to see if there’s something is going on. To watch this movie, you’ll making me more curious and exciting about the movie. Like Gianmichele says, I’m becoming addicted…:D Keep up the great work guys and I can’t wait to check the result! Tobias Writes: November 16th, 2007 at 8:00 pm Someone is listen to me. :) OGG-Files and not only flash. Thank you very much! ros Writes: November 16th, 2007 at 8:57 pm Great guyz. I bet ur thirsty,while ur working so hard! I wish to send u a glass of peach juice ;) Jedrzej_s Writes: November 17th, 2007 at 1:15 am Great progress ! Good luck guys !!! ccherrett Writes: November 17th, 2007 at 4:10 am don’t make a gay rabbit! stupid possibly. LoMac Writes: November 17th, 2007 at 6:11 am Gay,Girlie, Retarded Bunnies. Sounds like it’s going to be a good movie. crazybus Writes: November 17th, 2007 at 6:34 am Those video’s were great. Pink grass and a mention of much better mist were the highlights of the second video for me. Paul Writes: November 17th, 2007 at 7:27 am Looks great! Like everyone else, I’ve been checking the blog about every half hour, too.. I’ve been addicted since I heard about the beginnings of Peach! Thanks for taking the time to put these great videos online for us! It means a lot to all of us, to be able to see what’s going on behind the scenes while it’s happening. dr_oxy Writes: November 17th, 2007 at 8:24 am gay originally meant light-hearted and happy. careful about context here. He didn’t say ‘whether or not to make him gay’ he said ‘how gay to make him’. Big Fan Writes: November 17th, 2007 at 10:14 am thanks for the nice reporting margreet :o) joeedh Writes: November 17th, 2007 at 11:14 am ccherrett: you don’t want the rabbit to be happy? *gasp*!!! how could you?! Sago Writes: November 17th, 2007 at 12:53 pm dr_oxy and joeedh got it right. The word ‘gay’ should be used in its original definition. Btw, if it would fit the story, then there shouldn’t be a problem using the other definition of the word. But in this case it doesn’t fit. ccherrett Writes: November 17th, 2007 at 2:24 pm Strange….. The last time I heard the word gay used in the context proposed was in the bible. The most common use of the term today means homosexual. So speaking from a strictly logical standpoint based on what the word has become and the way the model is being animated and the other words used to describe what the character might be, I think it would be safe to say the word gay was not used in the context of happy. That is my take based on common observation and I think if we were to all stop and think about it for 2 seconds, we would all agree is the context being used. ED was so very strange that it would be nice to see something that could come out that did not have any boundaries to overcome. I would love to see a globally adopted film.It would be a big plus for blender and the whole community. Thanks for letting me share! Someone Writes: November 17th, 2007 at 3:41 pm ccherrett, opinions are good to have, but please don’t put thoughts in other people’s heads. If you would watch the movie you would clearly see the bunny walking all happily and flaps with its hands a bit. To me, that’s pretty much the definition of looking gay! campbell Writes: November 17th, 2007 at 4:00 pm Did anyone put that much thought into it? The rabbit could be a girl even. People here don’t all speak English as their first language and use ‘he’ incorrectly anyway, its hard to tell. Roksvamp Writes: November 17th, 2007 at 4:05 pm Nice reporting, I can’t believe Nathan finally confessed ;) Everything looks good, I can’t wait to see the “gay bunny” in action, and these story surprises Sacha talked about also sounds interesting. Btw, do you have any Gonda’s Gilde waffles in the pantry? My father bought some during his visit in Amsterdam and god do they taste good! =P ccherrett Writes: November 17th, 2007 at 4:07 pm campbell, hey sounds good to me. I can understand that as a possible explanation.I guess we will see what is decided upon. Someone, clearly? dr_oxy Writes: November 17th, 2007 at 4:59 pm “That is my take based on common observation and I think if we were to all stop and think about it for 2 seconds, we would all agree is the context being used.” Well well, imagine my surprise when I was suddenly informed that I hadn’t thought about it at all. Apparently I’m not one of the cool people as defined by ccherrett. :p Seriously though, don’t be so condescending about your logic leaps. Also, SaGo just confirmed it, and also confirmed part of my two seconds of thinking which was that in no way were allusions made prior to this to any kind of possibly controversial points, and that if homosexuality HAD been a plot point(or something), they wouldn’t have been allowed to say anything about it, because they’re not allowed to talk about the plot. ccherrett Writes: November 17th, 2007 at 5:25 pm dr_oxy: sorry for the 2 second thing. I should not have wrote that. Auria Writes: November 17th, 2007 at 6:45 pm You’re all crazy, having such a heated debate about the funny way the rabbit is running :P dr_oxy Writes: November 17th, 2007 at 7:00 pm No I’m not. :p All of this is of only academic interest to me, and I only commented the first time because I thought someone was misinterpreting a sentence. On that note, I haven’t commented on the movies themselves. I think they look really nice, and the animation is coming along much better than the last open project. ccherrett Writes: November 17th, 2007 at 7:19 pm the animation is top notch :) jim Writes: November 17th, 2007 at 8:56 pm Post a request for the models you need. Alexander Ewering Writes: November 17th, 2007 at 9:15 pm Well, the rabbit might look as gay as you want, but it definitely doesn’t look as gay as the hugging photo a few entries earlier ;) sozap Writes: November 17th, 2007 at 9:58 pm these videos show some cool stuff, thanks you for posting it . sago : maybe for your walnuts problem , the sculpt tool could be the good way. but I haven’t tried it . maybe a little bit of displacement mapping could help too. modelling every details precisely by hand (in the classic way) sounds crazy to me. I think this is a hard modelling case anyway. Big Fan Writes: November 18th, 2007 at 3:02 am I believe all this controversy would be cleared up if sago would admit its an elephant in drag – the feet are the give away ;o) Dion Moult Writes: November 18th, 2007 at 1:07 pm I really want to improve my own modeling and animating techniques. toontje Writes: November 18th, 2007 at 5:39 pm Remind me again why .ogg is such a superior format. It seems that I can’t play it in anything! In vlc it just renders very choppy and out of sync. In wmp with that special directshow plug in it plays without sound. In winamp it won’t play at all. AntonG Writes: November 18th, 2007 at 6:00 pm One question. I didn’t actually notice, do you use SpaceNavigator from 3Dconnexion? Any experience with it to share with us? Keep up the great work! -AntonG Fury_jin Writes: November 18th, 2007 at 6:11 pm It’s so interesting to sneak a look at your WIP. I have a lot of work to learn how to rig a character! This vids give me more motivation. Don’t forget to do some exercices between two riggings ;) campbell Writes: November 18th, 2007 at 6:29 pm @toontje – http://www.theora.org/benefits/ Being an open move its nice to support fully open standards. You could check and see if you have the latest codec, ogg-theora plays fine here on ubuntu gutsy 64bit and OSX. Mark Keller Writes: November 19th, 2007 at 3:08 am “I redid some of the-” -Nathan Some of the what? The last video cuts out in the middle of the sentence! And I like the idea of using the word ‘gay’ in its proper traditional sense (which definitely describes that rabbit). But who is Margreet? (S)he is not listed on the team page . . . Nathan Writes: November 19th, 2007 at 11:30 am Mark: I was going to say, “I redid some of the animation control widgets,” or something along those lines (I don’t remember my exact wording). Not sure why the video was cut there. margreet Writes: November 19th, 2007 at 12:46 pm I am working at the Blender Institute since October this year as a producer. And I am a she between all the guys here, but I am still hanging in there ;0) hessiess Writes: November 19th, 2007 at 9:08 pm chinchillas tail is far to small. the tail is almost as long as the whole chinchilla’s body Sago Writes: November 19th, 2007 at 9:54 pm hessies, are you talking about the short-tailed chinchilla (Chinchilla brevicaudata) or the long-tailed chinchilla (Chinchilla lanigera), cause we’re going for the first one. Btw, fur hasn’t been added yet. Calvin Writes: November 22nd, 2007 at 7:32 pm margreet: Oh that explains 1/2 of it… I was wondering which of the guys had such an amazing voice. :D margreet, if you happen to have more time, you should do more interveiws (the more the better) it was fun watching, thanks! meltingman Writes: November 24th, 2007 at 12:45 am tancks for all, the images, the technique :-). I try to made one demo and y see y take the same wai of your technique (create all the actions before).. and y’m very happy cause it’s “stimulant” for me :-P. Big love and respect for your job :-) Anthoni_C Writes: November 24th, 2007 at 10:15 pm William should make the bunny’s weight shift side-to-side while running."
