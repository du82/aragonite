lament both. Not fair! :) micah Writes: April 3rd, 2008 at 5:03 pm ardour isn’t bad! Joerg Writes: April 3rd, 2008 at 10:09 pm Ah, this makes me think about a feature-req for blender 3.0: Place mics and speakers for sourround-sound in the blender scene — cool dusty Writes: April 4th, 2008 at 4:18 pm I might not watch this on my lame PC when I get hold of it. I might get it on DVD and beg my friend to let me play it in on a decent home cinema set up he has!! Cierzo Writes: April 10th, 2008 at 2:31 pm there is a opensource alternative.Vorbis 5.1. Why not use it? ¿Open movie with “closed” audio? Sparkus Writes: April 12th, 2008 at 11:53 am Ton, this license fee you mentioned… Did you have to pay it, because the movie is printed on 35mm? Once I read, that on DVD productions there are no fees except for the encoder software. I don’t know how this complies to 35mm. Nobody Writes: May 3rd, 2008 at 12:35 pm @Sparkus As I understand the whole official fee/license thing is for theater release only. Its where they can force everyone onto contracts. Shame they don’t just accept some 6 channel vorbis stream ;) Club Penguin Cheats Writes: January 18th, 2010 at 9:06 am I might not watch this on my lame PC when I get hold of it. I might get it on DVD and beg my friend to let me play it in on a decent home cinema set up he has!"
