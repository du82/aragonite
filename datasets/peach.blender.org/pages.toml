full_description = "« An Outside Perspective A Small Outsider’s Perspective » Jan 14 Lug Radio Interview with Sacha Posted in Peach Press, Production by campbell Just writing to let you know the gents at LugRadio interviewed Sacha in the last episode; “Time Gentlemen Please” (Season 5, Episode 9) LugRadio is a Linux and free software focused podcasts, where 4 guys from the UK discuss open-source, communities and various projects For those who follow the blog closely the interview dosnt go into details but its still worth a listen. Download the OGG or MP3 from www.lugradio.org 8 Responses Olle Jonsson Writes: January 14th, 2008 at 6:16 pm Nice will defenetly listen when i get home again :D nawabz Writes: January 14th, 2008 at 8:43 pm can never be the first to reply in a post good listen AniCator Writes: January 14th, 2008 at 8:47 pm Sweet. Fury_jin Writes: January 14th, 2008 at 10:01 pm This radio is a little “trash” but this is always good for blender. You can download the interview, here (only Sacha / 13.23min) http://perso.numericable.fr/blender/14.January.2008_Interview_Sacha.ogg MattJ Writes: January 15th, 2008 at 12:04 am I don’t think LR is ‘trash’, But people who are easily offended by strong language may take issue. Fury_jin, I trust you released that under the CC Attribution-Noncommercial-Sharealike 2.5 licence to keep in agreement with their licence terms:) It was a very interesting interview. JoOngle Writes: January 15th, 2008 at 10:31 am Hilarious! :) Listen to it, it´s worth it. I was nearly killing myself in the process, it´s THAT funny! :) Felix Kütt Writes: January 15th, 2008 at 4:13 pm yup, a good listen. :) rogper Writes: January 15th, 2008 at 7:56 pm I’ve kind a feeling that the Final title of this movie will be non other then: “The Rabits Revenge working title” or TRRWT ^_^ The best 8 minutes of my day… so far :P"
