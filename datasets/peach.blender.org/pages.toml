title = "Big Buck Bunny  » Blog Archive   » Our Animation Schedule"
full_description = "« fluffy puffy peach posters Good intentions for 2008: write more blog posts! » Dec 30 Our Animation Schedule Posted in Production, Random Fluff by Nathan 8 minutes 13 scenes 154 shots 12000 frames 5 characters (plus a butterfly) 10 weeks left to animate it all …and this is what happens when you have an insane animation schedule: .ogg video file high quality (2.0MB) (Music by AcidMan: http://www.beatpick.com/AcidMan) 44 Responses FuzzMaster Writes: December 30th, 2007 at 7:41 pm Aahahahahahhahah FuzzMaster Writes: December 30th, 2007 at 7:42 pm Ahahahhaha that’s great Gianmichele Writes: December 30th, 2007 at 7:42 pm I know this schedules :) but it’s a lot of fun too…but I know you have to keep quality fairly high :P Come on guys! You can do it! RedBirdiii Writes: December 30th, 2007 at 7:48 pm Wow!! It’s been long since you post anything here.. Anyway, it’s good to see you having fun there.. but don’t forget we’re waiting for your best.. or else we’re going to ask for our money back.. :D micah Writes: December 30th, 2007 at 7:51 pm hmm, 430 frames/day… IamInnocent Writes: December 30th, 2007 at 7:52 pm Best of luck, I mean, really: but I am confident that by the end of those 10 weeks you’d become a pretty good jumper. ;) Jean JoOngle Writes: December 30th, 2007 at 7:54 pm Good – insanity is exactly what this movie needs! IamInnocent Writes: December 30th, 2007 at 7:56 pm Michah: time to change your batteries LOL It’s more like 245.837593745 frames a day, allowing 8.3244224 minutes to pee and all the WE to jump. rogper Writes: December 30th, 2007 at 7:57 pm that’s allot of shots! …didn’t expect that much. Everyone will animate? rogper Writes: December 30th, 2007 at 8:05 pm Ho! love the rope, one can see that is Top quality, very expensive for sure… not even one stumble ;) Lasphere Writes: December 30th, 2007 at 9:54 pm hahah lol! :D ddwagnz Writes: December 30th, 2007 at 11:19 pm HAHA Cessen is the weirdest one of the peach team humble Writes: December 31st, 2007 at 12:40 am Oh wow, a new, almost photorealistic character! Richard Writes: December 31st, 2007 at 1:10 am Don’t rush the animation! I would rather have the movie delayed then to have rushed animation. voOdKa Writes: December 31st, 2007 at 1:16 am Olol exxelent xD David Writes: December 31st, 2007 at 1:25 am Ahahaha, man that really made my day lol Tynach Writes: December 31st, 2007 at 2:48 am BRILLIANT!!! Falgor Writes: December 31st, 2007 at 2:51 am That’s a way to relax ;D! WTG jim ww Writes: December 31st, 2007 at 3:15 am bah-haha-ha! money back?! i just got my money’s worth right there! :) looks like team morale is still running high ( or somebody is high? ) which is encouraging. keep at it. ( i hope that gets into the ‘extras’ portion of the dvd ) Felix Kütt Writes: December 31st, 2007 at 4:13 am all that sitting that is done, ofc. some proper movement is needed too, well, from time to time.. but.. monkey back to animating, now! >:-( RNS Writes: December 31st, 2007 at 4:31 am I’m in the Dominican Rep for vacation and I’m dancing like that when is only one day left to go back to “America”oH boy!So I understand his joy__Happy New Years. LoMac Writes: December 31st, 2007 at 6:34 am Ask for my money back? I feel like I should owe you some now. Catboy85 Writes: December 31st, 2007 at 8:24 am It’s a good sign when one of the animators that Animated! Thanks for the show! voOdKa Writes: December 31st, 2007 at 11:34 am Tecktonik killer ? xD Fury_jin Writes: December 31st, 2007 at 1:06 pm If he animates this fast, the project will be done in one day! Or maybe this is the result of italian coffee? ardee Writes: December 31st, 2007 at 2:36 pm I love the hair animation on that character, very realistic. Devs need to work on the grooming tools though. margreet Writes: December 31st, 2007 at 5:26 pm you guys are crazy! Tobbe Writes: December 31st, 2007 at 5:51 pm “5 characters (plus a butterfly)” is there a secret character that you havent shown us yet? :-O or is the butterfly the fifth character? Jrom Writes: December 31st, 2007 at 8:11 pm This is excellent.. :-) Auria Writes: January 1st, 2008 at 1:54 am Well this is reminiscent of Elephants Dream. Awsome animation, but I didn’t get the plot ;) Mats Halldin Writes: January 1st, 2008 at 4:13 am Hmmm, At this moment I’m not entirely sure I really want to know that much about Blender. / Mats sam Writes: January 1st, 2008 at 1:42 pm Absolutely LOVE it! If he put a hat on the floor I’d throw him a couple coins. –Sam Sam Writes: January 1st, 2008 at 3:06 pm O.o Um.. I second the question about mysterious 5th character. shul Writes: January 1st, 2008 at 3:22 pm Happy new year. And I do want my money back, but cessen jumped all over my account Igor Writes: January 2nd, 2008 at 8:32 am Hahah, Cessen you are very funny guy!! Good luck to you all over there!! :) yoyofargo Writes: January 2nd, 2008 at 11:23 am This reminds me of around the middle of Dance of the Bashful Dwarf… except you’re not a dwarf… and you’re not naked… only in my dreams… *sigh* …only in my dreams. Rene Writes: January 3rd, 2008 at 11:27 am dude…you rock cadunico Writes: January 3rd, 2008 at 7:27 pm Hahahahahaha looks like a squirrel crazy the search for a brown psicodelic! Hahahahahahaha Very good! super wu-man Writes: January 3rd, 2008 at 8:15 pm good lord…you guys are just begging to be made fun of….man what i would do to this team if i had the time…i would be goofing on you guys at a break neck speed….ohh the possibilities…..beware….. Nathan Writes: January 3rd, 2008 at 9:11 pm super wu-man: I, for one, would love for you to goof on us. But perhaps that would take the fun out of it, eh? bjornmose Writes: January 6th, 2008 at 3:44 am well .. kids had a lot of fun .. but wife wonders if it was good to let me go for physics sprint SO +++ for entertainment — mental health. well don’t care .. get Brecht to do a dance like that.. while we’re on it hug Brecht for that sparse matrix stuff works like a charm .. gone back to code rock solid soft bodies for particles Kent Mein Writes: January 7th, 2008 at 5:47 pm Just curious how your orgainzing things in blender. Do you have a seperate blend file for each scene and a blender scene for each shot or some other standard thing ? pyrosever Writes: July 2nd, 2008 at 4:29 pm this video makes a lot more sense now."
