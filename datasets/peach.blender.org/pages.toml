full_description = "« Siggraph Los Angeles report Holland Animation Film Festival: 2 awards! » Sep 03 BBB conquers the Netherlands Posted in Events, Peach Press by Ton Here’s a list of events that will happen the next 2 months in the Netherlands around Blender and BBB. Most of this is a result of our successful BBB launch in the Netherlands, which resulted in a cumulation of invitations… I’ve stopped accepting any more now! :) To start with the most prestigious one: Netherlands Film Festival, official selection in main program Utrecht, sept 24 – oct 3, 2008 http://www.filmfestival.nl Three theatre screenings of BBB Sept 30: nominations for awards announced (we can become nominated in short film category) Oct 1: BBB screening + speaking as part of the “Re-vision, the new media effect” program Private screenings in international program for distributors, TV stations and studios. Oct 3: The grand Gala evening. Well, I’ll be going there anyway for fun! Klik! Amsterdam animation festival Amsterdam, 12-14 september 2008 http://www.klikamsterdam.nl/ Saturday 13, 20.20h: BBB screening + presentation IBC, International Broadcasting Conference Amsterdam, 12-16 september http://www.ibc.org You’ll probably see BBB on many tradeshow booths showing off HD technology! Nederlandse Stripdagen (Dutch Comic days) Houten, 27-28 september, 2008 http://www.stripdagen.nl Saturday 27, 10.00h: BBB screening + presentation PICNIC’08 (cross media conference) Amsterdam, 24-26 September 2008 http://www.picnicnetwork.org Friday 26, 10.00h: Presentation as part of Celebrating Collaborative Creativity Cinekid, international film festival for the youth Amsterdam, 18-26 october 2008 http://www.cinekid.nl/ Tuesday 21, 16.00h: BBB screening and presentation/interview Blender Conference Amsterdam, 24-26 october 2008 http://www.blender.org Three days of talks, roundtables and workshops about Blender Friday evening: BBB screening as part of festival Stifo@Sandberg Conference Amsterdam, october 31 2008 http://www.all-media.info/page.php?id=65 (official announcement still pending) Speaker in the program “Moving Movie Industry” Holland Animation Film Festival Utrecht, 5-9 november 2008 http://haff.awn.com/ BBB selected in official competition masterclass by BBB animator William Reynish (to be confirmed) 10 Responses ton Writes: September 3rd, 2008 at 6:10 pm BTW: we also have an impressive international festival line-up, will write update for that asap… Jean Montambeault Writes: September 3rd, 2008 at 7:56 pm It’ll be a nice reward for anyone who worked so hard on BBB to assist to one/many of these festivals. Hopefully it’ll also lead to more professional use since so many producers, distributors and others will be exposed to it. Every user and developer too would benefit from that. Have fun Ton :) Jean RH2 Writes: September 4th, 2008 at 2:39 am Have a good time, and good luck! J Writes: September 4th, 2008 at 2:52 am I bet you could get BBB on PBS channels. jin choung Writes: September 5th, 2008 at 7:15 am coooooooool. congratulations! really well deserved! TxRx Writes: September 10th, 2008 at 1:19 pm Diverse? In most senses yes, but any festivals outside of the Netherlands in there? I must say well done though. Looks like your going be a busy team! Jean-Sébastien Guillemette Writes: September 10th, 2008 at 5:02 pm TxRx: Ton replied this (reply#2 on this blogpost) “BTW: we also have an impressive international festival line-up, will write update for that asap…” Congrats Ton & and all the artists who worked on BBB. This is a nice reward :D tim Writes: October 5th, 2008 at 12:19 pm yo blender is so cool I 11 years old and I kan fell with blender I love it mzzl (I netherlands) the cyberdeaf Writes: October 26th, 2008 at 12:47 pm I and many other deaf people would REALLY appreciate it if you could add subtitles to this video and to the next videos/DVDs you’re planning to make. ^_^ *sigh* Eibriel Writes: October 30th, 2008 at 2:57 am Hi!! I would like to invite you to participate on the 11º Buenos Aires International Independient Film Festival from Argentina. An important festival with international recognition. Inscription -> http://www.bafici.gov.ar/inscripcion.php If you make the inscription I can burn a DVD copy and bring them to the festival. You can contact me at “tentaculo.producciones ( at ) gmail (dot) com” [I’m not part from the festival, only like your short film hahaha] Gabriel."
