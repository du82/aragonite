title = "Big Buck Bunny  » Blog Archive   » Peach Workshop FuzzCam"
full_description = "« Peach workshop started First impressions from the Peach Workshop » Aug 23 Peach Workshop FuzzCam Posted in Random Fluff by andy For your entertainment we installed a small temporary webcam in the Blender Institute. We’re not currently working in front of the computers the whole time, there’re lots of discussions and meetings going on. But maybe if you look close you can see a few familiar faces popping up! 37 Responses Felix_Kütt Writes: August 23rd, 2007 at 11:42 am why, let me guess sago but the cam up for Supa-Wu-Mon to abuse, right? :D Richard Writes: August 23rd, 2007 at 12:06 pm How often is the image updated? andy Writes: August 23rd, 2007 at 1:01 pm Felix: What’s a Supa-Wu-Mon? Richard: about every 30th second… i’m sorry but for the time being you have to refresh your browser manually to see the updates. .andy metalliandy Writes: August 23rd, 2007 at 1:48 pm Very cool. Couldn’t they have the webcam facing away from a window though? It burns my eyes. lol TheRebirthed Writes: August 23rd, 2007 at 2:36 pm The image is really updated every 30 seconds ? Because sometime it is not refresh during a hour… Is it disconnected sometime ? Drak Writes: August 23rd, 2007 at 4:06 pm @TheRebirthed: just refresh the page don’t clean cash images. use Ctrl+F5, its work here. =] ton Writes: August 23rd, 2007 at 4:10 pm The webcam software had failure, showing same image for an hour. Now it is back. Bassam Writes: August 23rd, 2007 at 4:34 pm unfortunately it happens from time to time.. I’ll keep an eye on the computer and “kick” it whenever it fails. Cubedude04 Writes: August 23rd, 2007 at 4:34 pm Experts at work =D Wish i was there TheRebirthed Writes: August 23rd, 2007 at 5:21 pm @Dark : It is what I do… but the bug of the webcam soft explain that pb . super wu-tacular Writes: August 23rd, 2007 at 5:29 pm pretty cool, what time does the chicks show up….and do….stuff.. haha, this is a great idea, i think i remember suggesting somthing like this last project…dang steal all my ideas, DANG!!! give a super hero credit for peach sake! super wu-tacular Writes: August 23rd, 2007 at 5:31 pm by the way, what is the goal of the workshop this week? are you doing concept modeling? or just going over the story and meeting each other? Felix_Kütt Writes: August 23rd, 2007 at 5:34 pm @andy: Supa-Wu-Mon is a pokemon that resembles Super Wu, you know as Wu’s so popular they had to stick sucha Pokemon into the series! :p mrunion Writes: August 23rd, 2007 at 10:01 pm We need some video of them drawing the character sketches on paper. That’d be cool! waleed Writes: August 23rd, 2007 at 11:49 pm use ustream or stickam for a video stream this is better than bictures. http://www.ustream.tv http://www.stickam.com thanks for your efforts in the project. Durden Writes: August 24th, 2007 at 11:16 am I can see you .))) Hoehrer Writes: August 24th, 2007 at 12:52 pm Oh I think this “images is not updated” business is all a ruse to cover the fact that the people currently shown in the image are chained to their seats and forced to work on Peach artwork non-stop. Werner PS: I get the same image since yesterday (or it is only slightly different) ;) Dion Moult Writes: August 24th, 2007 at 2:01 pm Haha! I’m seeing three guys staring at three computers. Gosh, I must really suck at this ;) Dion Moult Writes: August 24th, 2007 at 2:31 pm OI! oi! Turn the camera back! Bad bicycle! Whose is it anyways? It looks seriously weird. EnV Writes: August 24th, 2007 at 3:08 pm It’s Sago´s, gh! EggYolk Writes: August 25th, 2007 at 4:35 pm ZOMB its a kangaroo/dinosaur chasing a mouse, and theres an alien in the corner of the image : O Sago Writes: August 25th, 2007 at 4:38 pm It’s EnV’s, gh! joeedh Writes: August 26th, 2007 at 2:12 am Looks like like a tom and jerry scenerio, only tom is a big nasty dinorabbit :) Joe Superkoop Writes: August 26th, 2007 at 4:56 pm you guys, come on, its a wooly rabbit from the caveman days! chasing a sabertooth mouse of course. Moein Writes: August 27th, 2007 at 5:45 pm It seems you just locked the webcam on a drawing :-P I want to see more :-s Mr. Spock Writes: August 27th, 2007 at 6:16 pm Yeah, that’s all I’ve seen for a couple days. Sago Writes: August 27th, 2007 at 6:56 pm Well, the workshopweek is over and most of us are back home. Not much to film. But perhaps you can get a glance of Andy’s sideburns of death. Gh! Sago Writes: August 27th, 2007 at 10:47 pm Just to let y’all know: the drawing of the ‘dinorabbit’ we’re seeing now for more then 2 days already is just something EnV made for fun. For our actual movie we’re even going for something way cooler! Yeah, you heared me, gh! Noodlesgc Writes: September 3rd, 2007 at 10:24 pm Ok its been like a week with that dino rabbit. Does it ever change? EnV Writes: September 4th, 2007 at 9:52 am I’m afraid it’s not going to change untill the first of october… oblenob Writes: September 4th, 2007 at 5:24 pm Could we have just a bit of variation, like have the paper moved and rotated a bit? WantPictures Writes: October 1st, 2007 at 3:54 pm Ok — october, first — still the same picture oblenob Writes: October 1st, 2007 at 8:53 pm hmm what bout the proog and emo pics in the backgroung? they would be nice to see Will Writes: October 5th, 2007 at 6:32 pm I’m concerned that the only character mockup to date of the “furry” kind that is supposed to make this film different from Orange is pretty grotesque and not at all cuddly. I hope that this is a concern that will be soon put to rest because you guys do have to realise, as I often feel blenderheads do not, that something does not have to be gaunt and noir to be artistically accomplished – indeed it shows a skin-deep level of inspiration and only one of many approaches to technical accomplishment. Please prove me wrong! Noodlesgc Writes: October 8th, 2007 at 11:31 pm October 8th, lets start a gambling table to bet on how long till the image changes. amoose136 Writes: October 25th, 2007 at 6:40 pm It’s hard to say when it will change. It depends mostly on when someone feels like fixing it. However, I would like to see the camera up and running one of these days. Also, if it ever gets fixed, it would be nice if there was a link to it at the top of the web site."
