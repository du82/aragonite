full_description = "« Lug Radio Interview with Sacha Dream Team reunited as cheap inbetweeners for Peach! » Jan 15 A Small Outsider’s Perspective Posted in Production, Random Fluff by campbell Continuing in the current series of posts about “Outsider” perspectives of the Peach project, here is eight year old Australian gal India, giving her special views and comments. India and her mum Cathy have spent the last month in and around Amsterdam annoying Campbell and the Peach crew as much as humanly possible. At the end of the video is a special “Hi” to India’s Connect-4 Guru Martin (aka Theeth) who spent some time down under with Campbell and family. Download the ogg movie here 29 Responses Vincent Writes: January 15th, 2008 at 8:28 pm Aww, she’s cute :) (You can’t say she’s shy, can you? :P) Cezar Writes: January 15th, 2008 at 8:40 pm Hey! Why don’t you add some comment about Peach at the IMDb like sinopse…? I’m waiting the realise date anciously Greating from Brazil!!! Gianmichele Writes: January 15th, 2008 at 9:01 pm Ohhh funny! @Andy: that shot looks beautiful even in the bad color and light from the camera! Gian Anonyomous Writes: January 15th, 2008 at 9:04 pm Any chance of someone uploading this to YouTube? oblenob Writes: January 15th, 2008 at 9:10 pm Yes, the chances of someone uploading this to youtube are quite big, infact probably more than one person will, however I wont because I only post my own videos on youtube. cathy Writes: January 15th, 2008 at 9:56 pm The video is longer than 10 minutes, so we can’t upload it – feel free to try! TheANIMAL Writes: January 15th, 2008 at 11:41 pm So, Ton doesn’t do anything, not even mating. This was one of the funniest things i’ve ever seen. Lol at @ndy when he mentioned the bees and the birds in one sentence. God i’m immature. Genscher Writes: January 16th, 2008 at 12:45 am Quite funny and nice to watch! :) ..and that explains also why orange and also peach teams needs so much time to finish things “I…I also do nothing” ;) goofster Writes: January 16th, 2008 at 1:31 am That’s probably the most adorable video I’ve ever seen :) Lee/LohnS Writes: January 16th, 2008 at 1:39 am hahah that was great, thanks India! These outsider vids really help out since the peach team are so busy they don’t realize how interesting they are haha Hope all the aussies are enjoying Amsterdam, I sure did! Good luck all, Lee Felix Kütt Writes: January 16th, 2008 at 2:01 am ahh.. so you have a little girl that gives feedback on the level of entertainment the animation gives to the viewing public, yes? good.. :) Felix Kütt Writes: January 16th, 2008 at 2:09 am wait.. i just noticed, @ndy mentioned the ‘make cool movie now button!’ YOU’VE GOT THE MAKE COOL MOVIE BUTTON?! what else have you guy’s been hiding from us? : Egan Writes: January 16th, 2008 at 3:02 am I got a 404 error on both links to the vid. ibkanat Writes: January 16th, 2008 at 4:48 am haha that is great! Best video yet… Anonyomous Writes: January 16th, 2008 at 7:26 am @cathy You can upload videos that are well over ten minutes if you have a director (and perhaps others) account. The longest movie I’ve seen on YouTube is something like an hour and a half. thoro (Thorsten Schlüter) Writes: January 16th, 2008 at 12:49 pm That’s a very funny video… the interview style was a good idea :-). The boss seems to be a really shady person… w Writes: January 16th, 2008 at 1:48 pm you could upload it to Divx Stage6.com, unlimited length and much higher quality than youtube. (it has some very interesting documentarys on) JoOngle Writes: January 16th, 2008 at 3:52 pm @w – a very good suggestion! All peach log videos should be uploaded to stage-6, it has become my new YouTube…all the content x 100 quality AND stereo sound insteand of crappy-choppy-mono YouTube…faster download too! panzi Writes: January 16th, 2008 at 7:02 pm @Felix Kütt The button is called F12. :P Felix Kütt Writes: January 16th, 2008 at 7:42 pm @panzi: yes, i do realize that, obviously.. ;) ogg Writes: January 16th, 2008 at 11:43 pm Ton, I had no idea you were so entertaining to little children. No wonder the Peach team want to work with you! Hamed Zaghaghi Writes: January 17th, 2008 at 12:56 am It’s nice, very nice. Gianmichele Writes: January 17th, 2008 at 12:29 pm Hi guys! A question comes to my mind. Have you thought of a faster way to relight the scene, other than wait every time to render ? Something that maybe will use the GPU like Pixar’s lpic (graphics.pixar.com) or ILM’s one (see paper on: trowley.org/sig2007.html) ? brecht Writes: January 17th, 2008 at 12:43 pm Gianmichele, I’m sure it would be a great feature to have, but that’s far beyond what we have resources or time for. Gianmichele Writes: January 17th, 2008 at 12:56 pm Yeah Bretch, I thought so, too! Anyway, something similar is at the moment not present in any software I have seen. theeth Writes: January 17th, 2008 at 6:52 pm Whoa, to think that I almost missed this! A very big hello to India, camerawoman Cathy and the Peach crew! Vincent Writes: January 18th, 2008 at 10:45 am If anyone is interested in a Flash version: http://blip.tv/file/606774 If I don’t forget I’ll upload newer video’s to http://peach.blip.tv/ Mark Keller Writes: January 18th, 2008 at 8:06 pm @Anonymous – sadly, that’s not true. No matter what type of account you have, YouTube no longer allows you to upload videos over 10 minutes in length. The only people who can upload longer videos are those who were lucky enough to create an account before the limit was imposed. :-( And the documentary is great! AdemoS Writes: January 19th, 2008 at 9:43 pm The boss is nothing but HANDS! That “face” that fades in and out, is just an illusion. :P Good luck with the movie guys. GO BLENDER!"
