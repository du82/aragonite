title = "Big Buck Bunny  » Blog Archive   » Big buck Bunny movie files released!"
full_description = "« BBB at CG Overdrive Complete Score Available for Download » May 30 Big buck Bunny movie files released! Posted in Blender Institute, Events, Random Fluff by Ton We’ve collected several mirrors worldwide for a stable and – hopefully fast – hosting of the BBB movies. You can download the files in four different flavours, which will nicely work for all common video players and OSes. The download section also has Vimeo and Youtube links for streaming video. Lastly, mirrors with the DVD ROM studio files are also being added now! Have fun watching! And, thanks again for the great feedback and ongoing support. It has been a great ride for everyone here, and I definitely look forward to the next open movie… which – as promised – will not start before the Blender 2.5 project is in usable state. Most likely that’s end of 2008, early 2009. Lastly: don’t stop buying the DVD! Revenues will be used as startup financing for the next Open Movie, and hopefully I can afford to send the full Peach team to Siggraph… -Ton- 262 Responses elliott Writes: May 30th, 2008 at 2:18 pm great! Elubie Writes: May 30th, 2008 at 2:19 pm Congrats to the Peach team! The worldwide party has started now! randomnut Writes: May 30th, 2008 at 2:19 pm Yay! patar Writes: May 30th, 2008 at 2:19 pm im impressed Mal Writes: May 30th, 2008 at 2:21 pm Blender ROCKS! Dee-man Writes: May 30th, 2008 at 2:21 pm Thanks! You did great work. Hope the next Open Movie will be better than BBB and ED both. P.S. The chinchilla is perfect. =) Lethe Writes: May 30th, 2008 at 2:25 pm So, the enterprise mushroom – did it make the final cut, and if so where is it? I’ve watched it 4 times now and still haven’t seen it. Gino Writes: May 30th, 2008 at 2:32 pm Happy to discover finally the movie. Congratulations to the Peach Team Iamfrankenstein Writes: May 30th, 2008 at 2:33 pm Owh I can’t wait…. (downloading……) Dusty Writes: May 30th, 2008 at 2:35 pm Congrats guys! This is awsome!!! Joacim Writes: May 30th, 2008 at 2:37 pm I really, really enjoyed this. The humor works brilliantly, and the animation is much better than I had imagined. The way you have “blended” (hehe) it all together makes this look like a solid, whole product, as good as any Pixar short. Probably better. But then again: That’s my opinion. My only complaint is the moment when that squirrel kills the butterfly with the rock. The background sort of.. flickers. This has probably been mentioned before, but it’s my only complaint in the entire film. Good work to all of you. Robert Writes: May 30th, 2008 at 2:40 pm Need a mirror in Australia? If so, email me. Deak Writes: May 30th, 2008 at 2:40 pm Great work and hopefully a lot of people will learn heaps from it. Got the DVD last week and it’s packed with lots of nice goodies. Just to let you know, the BBB banner at the top of the page is broken under IE7 – the left side of the image is missing and the right side is pushed too much to the right cutting some of it off (compared it with FF). MrNoodle Writes: May 30th, 2008 at 2:41 pm Finally the Peach project is finished.Congratulations! studiomaxer3d Writes: May 30th, 2008 at 2:45 pm This is super exciting. I’m so glad that the people associated with Blender and this movie exist. Blender is the best. Go Ton! jonatas kerr - k3pp Writes: May 30th, 2008 at 2:46 pm Nice! Congratulations! Downloading right now! Sago Writes: May 30th, 2008 at 2:47 pm Woohoo! And like Deak says, header only shows for half. And it doesn’t link back to the main page. Chop chop, Andy and Campbell. haha Josep Writes: May 30th, 2008 at 2:49 pm Congratulations! alex Writes: May 30th, 2008 at 2:57 pm Hey congratulations!! What is the duration of the film? Giò Writes: May 30th, 2008 at 2:58 pm Great! Dusty Writes: May 30th, 2008 at 3:00 pm My god that’s funny! Well done! My kids love it! I want a sequal! Vincent Writes: May 30th, 2008 at 3:04 pm This is amazing! Really a great movie! thanks a lot and congratulations all! Be sure I’ll buy the dvd! thanks again! Beuzer0 Writes: May 30th, 2008 at 3:06 pm I’m so happy to watch the movie, it’s been a long time I was waiting for it. So funny and furry, excellent work, congratulations to you, the Blender Institute ! Hyun 현우 Writes: May 30th, 2008 at 3:12 pm That’s great! excellent works, thanks! Dion Moult Writes: May 30th, 2008 at 3:17 pm Wooh! Downloading now! 17% done at 60kbps! Cannot wait! blenderman345 Writes: May 30th, 2008 at 3:19 pm Hey I tried downloading it but all I see is alot o text flying around! Jan Morgenstern Writes: May 30th, 2008 at 3:19 pm Hey guys, just a quick heads-up: I just discovered that on stereo systems, VLC and possibly other non-QuickTime players have trouble getting the sound downmix of the H.264 version right. VLC users with stereo systems should therefore choose one of the other formats. Thomas Coopman Writes: May 30th, 2008 at 3:20 pm Very well done! I love it! I’m looking forward to the next one!!! 三两饭 Writes: May 30th, 2008 at 3:20 pm 终于放出来了，期待下一部开源电影。well done! Socceroos Writes: May 30th, 2008 at 3:22 pm Thanks for the heads-up Jan. Gen X Writes: May 30th, 2008 at 3:26 pm Oooooooooooh! Genial! despues de tanto tiempo de espera al fin veré este grandioso film. Estoy muy contento :D OoooH Great! after so many time waiting I’ll see this wonderful film. I’m so very happy :D surt Writes: May 30th, 2008 at 3:35 pm The nice big “Buy” link is gone and I can’t find any link to e-store in the site navigation. If someone’s considering buying the DVD they’ll have to hunt through the blog entries. Perhaps not the most effective way to raise revenue? Lifty Writes: May 30th, 2008 at 3:41 pm Great! I like it a lot! Vassilios Boucer Writes: May 30th, 2008 at 4:02 pm Amaaaazing! Thanks!! bov Writes: May 30th, 2008 at 4:06 pm One word – brilliant!!! Clinton Jones Writes: May 30th, 2008 at 4:10 pm Man that was so awesome. Just letting you know I wanna be part of the team on the next film. Serious Thanks for a most amazing film. swbrown Writes: May 30th, 2008 at 4:14 pm Wow – this is going to blow a lot of minds as to what’s possible with Blender. Amazing job! nihylius Writes: May 30th, 2008 at 4:25 pm Groovy. Congratulations! snailsnail Writes: May 30th, 2008 at 4:26 pm Awesome, wonderful! The film is so beautiful, and the animation is amazing. I’m still waiting for my dvd so this was the first chance I got to see it. It was fun spotting my name in the credits! Congratulations to everyone. sysiphus Writes: May 30th, 2008 at 4:30 pm thank you soooooooooooooooooooooooooooooooooooooo much for sharing this. it’s really something extraordinary to get an inside look at such a top notch production :-) i80and Writes: May 30th, 2008 at 4:36 pm Excellent movie, Blender Institute! The rendering was absolutely superb. The animation was fantastic. The story was very nicely written. Only one gripe: I really could do without that last scene after the credits. That was kinda… ugh. Carsten Ziepke Writes: May 30th, 2008 at 4:40 pm Wow – I am really impressed. Congratulation to the whole team. And thank you very much for the movie and Blender improvements. ColeZero Writes: May 30th, 2008 at 4:47 pm The rope-skipping scene was soo hilarious. I remember you Cessen, that was you..:D Nation3d Writes: May 30th, 2008 at 5:00 pm SOOOOOOOOOOOOOOOOOOOOOOoooooooooooooooooooo cool is really funny Andy Writes: May 30th, 2008 at 5:14 pm My overall impression is great. The animation is really impressive. The movie is quite short, but full of action. However the sound in movie is weak. In most actions were I would expect there to be some sound (like releasing the arrow from the bow) there is just music. (guess the ED was better in this matter) Keep the good job. Dustine Writes: May 30th, 2008 at 5:37 pm I agree the last scene after the credits could be dropped or done not so graphically. I also agree the rope skipping was hilarious!!! =D Great job all!!! Ape Writes: May 30th, 2008 at 5:48 pm Where can I get the “Commentary tracks by the creators” that comes with the DVD according to Blender e-shop? http://www.blender3d.org/e-shop/product_info.php?products_id=97 Wacky Writes: May 30th, 2008 at 5:54 pm WOW! Great… it’s like Pixar! You guys are amazing. :-D Arite Writes: May 30th, 2008 at 6:03 pm Awesome – thanks, downloading now ^_^. BlenderPython Writes: May 30th, 2008 at 6:03 pm I had to get it on the TV. My little brother and sister just watched it 5 times, in one hour!!! When will the DVD image be up? Thanks to the members of PEACH! Malcolm Zaloon Writes: May 30th, 2008 at 6:03 pm Hi i´m a XSI Lighting TD. I loved the photography of movie! Animations very well made! Music is very good! Have a lack of sound FX in some actions, but, in overall is good Sound fx. Congratulations! It´s fantastic! I wish to next movie, open INTERNATIONAL members participation. I´m Brazilian and i like to participate! Thanks for the film! I have much fun it. I have a xsi site with bug tracking like Blenderstorm. Look at: http://xsiplanet.com MartinR Writes: May 30th, 2008 at 6:10 pm Really delightful movie. The best compliment I can pay, is that I quickly stopped thinking of it as a piece of digital animation, and just enjoyed the story, the characters, and the humour. Top drawer ! dreblen Writes: May 30th, 2008 at 6:13 pm Awesome movie! Great job! Two questions: 1) Will the soundtrack be released like for Elephants Dream? 2) Will an iPod/iPhone version be made like for the trailer? Redbeer Writes: May 30th, 2008 at 6:21 pm All I can say is….wow. Really impressive piece of work. Contrary to some opinions…I liked the “slight” edginess to it. It reminded me of when cartoons were actually funny (old bugs bunny, road runner, etc.). It was like watching the warner brothers comedy edge…with a Pixar visual style. Really cool and a refreshing change. I agree somewhat on that last seen though, probably just seeing it drop on the guys head, or having the bird drop an acorn it was carrying would have been sufficient…rather than seeing it ooze out of the birds butt. Great job! I’m curious what will be available on the DVD for tutorials/documentation of the project…I may look to buy it in support. Amar Ashworth Writes: May 30th, 2008 at 6:21 pm Holy shizzlestix that was awsome!!! professional quality, tons of fun, and beautiful to boot. Four thumbs up from this familly of 2!!! way to go. Phoinx Writes: May 30th, 2008 at 6:26 pm Omg… The smallest file has 200MB? 0_0 cbrun Writes: May 30th, 2008 at 6:32 pm GREAT job all!!! Thanks Zaffo Writes: May 30th, 2008 at 6:34 pm What is the difference between the 1080p OGG torrent and the one on the DVD and the mirrors? (719,9 MB – 867 MB) squizzz Writes: May 30th, 2008 at 6:47 pm Hats off, Peach Team!!! Kris Lowet Writes: May 30th, 2008 at 6:56 pm Hi, I had seen the movie already at the Ubuntu release party in Belgium, but I still only have three words for this… great, great and great job! It is amazing what you guys have done! Kris HKL Writes: May 30th, 2008 at 7:03 pm Nice job guys! Congratulations! I was afraid to not be on the thanks because I couldn’t remember if i chek the right box but it’s ok. After something so awesome, I think for the next movie it should be very hard to do something better. Again congratulations mmbenya Writes: May 30th, 2008 at 7:08 pm Just wanted to stop by and say congratulations on an awesome short! You all did an excellent job, top notch work. Matt :) robert Writes: May 30th, 2008 at 7:09 pm the ogg form the torrent seems to cut off part way through the credits. Apart from that its GREAT! bluelife Writes: May 30th, 2008 at 7:12 pm no digg button??? no facebook etc button?? come on blender foundation/Ton ,more marketing please!! p.s.1 I believe there should be more marketing from the blender team,please forward this :P p.s.2 Saying this is great is not enough!! Christopher Webber Writes: May 30th, 2008 at 7:25 pm Fantastic! I just ordered the DVD, finished the bittorrent, and watched the video. And it’s good! Peachy-keen indeed :) Vincent Writes: May 30th, 2008 at 7:32 pm Wow. bluelife – http://digg.com/linux_unix/Second_Blender_open_movie Ralph Giles Writes: May 30th, 2008 at 7:42 pm BTW, we’ve been pleased to host a lossless copy of the movie as png and flac files at Xiph.org like we did for Elephants Dream for anyone who’s interested in doing alternate encodings. Congratulations to the movie team, it’s great to see a second open source movie! Okan Writes: May 30th, 2008 at 7:51 pm Where is the ” Making Of ” of the movie ? :) DramaKing Writes: May 30th, 2008 at 7:55 pm I noticed that all the movie files are in widescreen format. I question this choice because this is a “made for computer” film and even my widescreen monitor isn’t wide enough (1280×800)! Perhaps there needs to be a new format standard? Zaffo Writes: May 30th, 2008 at 7:57 pm The 1080p OGG torrent file is incomplete, as robert already said. You better use one of the HTTP links or use this torrent file which will give you the 1080p OGG file as it should be. http://82.168.202.132/zaffo/Big.Buck.Bunny.1080p.stereo.PROPER.THEORA.ogg.torrent Colezero Writes: May 30th, 2008 at 8:00 pm Iam currently converting a Playstaion Portable version of Big Buck Bunny. Res 720×480 H264 AAC Its about 70 MB big. Iam converting it with Avidemux for linux. Avidemux comes with enough profiles, even for PSP or IPod. bluelife Writes: May 30th, 2008 at 8:02 pm vincent I would like to see this digg by blender foundation itself and not by vinvin or whoever… p.s. yes I know I gripe but… Jan de Vries Writes: May 30th, 2008 at 8:43 pm Love it! Well done, love all the little details, changes in light and color, carefully brushed grass. Well timed animation. All lights placed so that the actors shadows fall in a pleasing way or on an important bit of scenery…etc You can really see the amounth of love and work that has gone in to this thing. The music is full of little surprises too. The 1080 p Version is eerily sharp. You should all watch that version because you can spot all the fine details there. I missed the fly on the second shot in the 720p version for instance. Congrats, i am looking forward to the Apricot game and Durian exploitation flic! Apricot DVD on order. coder Writes: May 30th, 2008 at 8:43 pm You guys are so genius! Elephants Dream was great.. but strange.. this one is just greater ;) thanks a lot for the fantastic entertainment! Digikiller Writes: May 30th, 2008 at 8:43 pm The movie is actually funny! Excellent job on all aspects of the CG. Looking forward to 2.50! ton Writes: May 30th, 2008 at 8:49 pm – When people upload/host ipod or psp versions, we’ll be happy to add these links to our download page. – The ogg issue is being looked at. – More downloads, like the dvd extras, will be added, we first want to survive the current load! FoxMan Writes: May 30th, 2008 at 8:50 pm I will try to create an AVCHD version of the 720p or 1080p mp4 + ac3 versions. My upload is not that great, but perhaps I could upload an iso somewhere if I "
