title = "Big Buck Bunny  » Blog Archive   » Pre-production updates"
full_description = "« Pre-Production Workshop Review This is not a clinic (updated) » Sep 05 Pre-production updates Posted in Development, Production by Ton More updates on the production: Development roadmap page added. This is not the final page, but based on the notes I’ve made during the workshop last week. Six month planning has been added. Oh yes, that does resemble last time! Note that horrible timing of the Siggraph festival deadline again… Arno Kroner, trainer at Disney Feature Animation, teaching at Woodbury University and showrunner of Siggraph ‘s FJORG agreed on coming to Amsterdam to organize our first week. He’s planning to do a full week workshop about all aspects of visual storytelling, storyboarding, layout, scene planning and acting. He’s also helping us now as script consultant. William Reynish came over to Amsterdam yesterday to get the full briefing, and of course we had to check on him (and he on us!). This went all great, he’s a funny guy even! Welcome to the team dude! 29 Responses Gianmichele Writes: September 5th, 2007 at 9:00 pm OK…read the roadmap. YOU’RE KIDDING RIGHT! Muaaaaa we’ll rule the woooorld!!! lloyd Writes: September 5th, 2007 at 9:04 pm it doesn’t make any sense Gianmichele Writes: September 5th, 2007 at 9:44 pm Harmonic Deformations !!! 4K capable compositor! Go ere http://graphics.pixar.com/ for a detailed paper on harmonic deformations. bydesign Writes: September 5th, 2007 at 10:48 pm I’ve been researching tree generation/plant for the past year and blender’s dupliframes are SO CLOSE to being most of the way there. If you could allow nested dupliframes, you could have a whole tree curve system that’s fully editable. At that point a script could fill in the blanks … email if you want more of the details I’ve thought through. Anon Writes: September 6th, 2007 at 7:11 am God, those features are sexy. dembel sow Writes: September 6th, 2007 at 8:28 am hello ton,this new particle systeme will support hypervoxel? thx ton Writes: September 6th, 2007 at 10:11 am Hypervoxel is a Lightwave thing right? We didn’t look at this… probably spending time on high quality smoke and fire is more for a next project. We didn’t intend to blow up the forest really. :) Cubedude04 Writes: September 6th, 2007 at 11:55 am Well i hope you blow something up. An explosion is mandatory for movies these days =P dembel Writes: September 6th, 2007 at 4:34 pm hey ton!why are you stopping coding,you seem to be so busy,i hope that you will find someone other for organisation and retur to some blender coding… thks Jan de man Writes: September 6th, 2007 at 8:22 pm What a weird replies.. I think it’s very exciting to know that someone from Disney Feature Animation is going to do a workshop. That’s some pretty big news! Somehow I really do believe this short is going to be a lot better than Elephants Dream (in terms of animation and script, the visuals and technical side were great). Ben Writes: September 7th, 2007 at 12:41 pm To the person(s) who fixes the crazy space editing with armatures and shape keys – I will seriously get them a medal. Big shiny one at that! (Other planned additions and fixes sound great too…) LoMac Writes: September 7th, 2007 at 2:45 pm I’m looking forward to the hair grooming tools. That video looked pretty neat rogper Writes: September 7th, 2007 at 10:59 pm Now that’s a Good Planning! Thanks for the pixar whitepapers site Gianmichele ^_~. Today I don’t know nothing about harmonic deformations but it seems Way Cool… so i’m gone study the thing and when blender integrats it I’ll be ready for it ^_^ Sam Writes: September 8th, 2007 at 11:49 am Very cool! Out of curiousity, who’ll be doing the voices for the characters? Digimator Writes: September 8th, 2007 at 3:30 pm Don’t worry! When 2.50 is released, it’s feature base is going to hotter than the sun! Carlos Writes: September 10th, 2007 at 2:01 pm On «Model tool needed: the inverse of “rip”, a quick method to merge/snap vertices.», for a newbie like myself, it’s an obvious tool missing.I’d suggest someth’n like:select vert1 of mesh1,then vert1 of mesh2,then vert2 of mesh1,then vert2 of mesh2, vert3 of mesh1 mesh1, vert3 of mesh2, and and only then the merge menu!Like a zig-zag stitching, the order of selection is the secret. is it possible? JoOngle Writes: September 13th, 2007 at 1:45 pm Mr. Kroner will surely be a welcome addition to this project, excellent! Matt Writes: September 15th, 2007 at 6:21 am congrats William, and good luck in the peach-squeezer! lloyd Writes: September 15th, 2007 at 9:26 am where are the updates is the project dead already i knew it :/ Sago Writes: September 15th, 2007 at 9:50 am Yeah, where are those updates? Even though the actual production starts in october, I’m just waaay to impatient to wait till then! Perhaps soon we’ll see a blogpost about how the script development went. That would be nice. EnV Writes: September 15th, 2007 at 11:03 am Yeah, where are those updates? Even though the actual production starts in october, I’m just waaay to impatient to wait till th… Damn!! Sago, you beat me, gh! dems Writes: September 15th, 2007 at 10:08 pm the peach blog is not really fun because there are no update,maybe some external person can be commited to update with information transmited by peach member Sam Writes: September 17th, 2007 at 4:50 am Dems is right. And even if nothing is happening, someone could post a joke or something. :P JK Seriously, though. It’s getting boring seeing nothing new here day after day. Richard Writes: September 17th, 2007 at 7:57 am I’ve gotta say, the sales so far are greatly beating Elephants Dream’s pre-orders. Looks like this deadline will be met. EnV Writes: September 17th, 2007 at 8:43 am Dems and Sam, you are right. What about this: 2 tomatoes are walking across the street; the first tomatoe says to the other: “Ehi, watch out for the ca…” PROOOOT! “Ehi, which ca…” PROOOOT! Peachy Writes: September 17th, 2007 at 11:05 am Two balloons are walking across the desert. Suddenly, one says to the other: hey, watch out! A cactussssssss! (hahahah… cough) Sam Writes: September 17th, 2007 at 12:08 pm Come on, guys! You can do better! Speaking of tomatoes, two tomatoes were taking a walk. One kept falling behind. Getting rather upset, the other tomato walked up to him and squished him. “Now,” he said, “Ketch Up!” Felix_Kütt Writes: September 18th, 2007 at 2:41 am what, updates, seeing the dvd sales rise is enough for me, for now.. :) just a guest Writes: December 27th, 2007 at 4:47 am Hello, Can anybody tell me in which program the “Six month planning” sheet was made? It looks a lot cooler than similar Gantt’s diagrams generated by other programs. Best regards,"
