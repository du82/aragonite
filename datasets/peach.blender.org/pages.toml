title = "Big Buck Bunny  » Blog Archive   » big big buck bunny"
full_description = "« Premiere Big Buck Bunny today! DVD & online release planning » Apr 11 big big buck bunny Posted in Random Fluff by andy 23 Responses Bov Writes: April 11th, 2008 at 6:09 pm Well done to all the team – can’t wait to see the movie myself. Cheers Cory Writes: April 11th, 2008 at 6:14 pm When will it be up for download? Philip Writes: April 11th, 2008 at 6:18 pm I’m so ready to learn from the pre-ordered DVD I ordered! Whan will it be shipped??? The poster looks great! d:) MrNoodle Writes: April 11th, 2008 at 6:30 pm Please upload it!! Ranma Writes: April 11th, 2008 at 6:34 pm We hardly beg you! *crying* Please, upload!!! *waterfall of tears* TT_TT Pitel Writes: April 11th, 2008 at 6:39 pm Me wants download! :) nawabz Writes: April 11th, 2008 at 6:58 pm ton pleeeeeeeeeese get me out of my misery Anthoni_C Writes: April 11th, 2008 at 6:59 pm Ahhhhhhhh what is the point of this tomfoolery! “Tomfoolery” hmmm… eh anyways…. Give us something else besides pre-rendered pictures! Henrique Perigo Writes: April 11th, 2008 at 7:10 pm aaaaa The movie!!! please!! rogper Writes: April 11th, 2008 at 7:18 pm I looked for a secret link to the movie somewhere nearby the image… but seams to doesn’t exist :( Although is a great big picture, It’s impressive all the fury details ;) fluetgeek Writes: April 11th, 2008 at 7:21 pm hm, i dunno why, but the way the bunny looks, reminds me of earl, from the dinos voodka2007 Writes: April 11th, 2008 at 7:46 pm What else ? Blue Bunny with a Machine Gun Writes: April 11th, 2008 at 7:53 pm awesome poster! though i just noticed that Big Buck’s (is that his name?) feet look like furry elephant feet… when’s the movie uploaded? the rest of us are dying here! i’m gunna hyperventilate or something!!! WE NEED BIG BUCK BUNNY!!!! Arite Writes: April 11th, 2008 at 10:48 pm I must say I love the rodent about to eat the acorn/chestnut in the bottom right ^_^. Great work and congratulations!! Arite. randomnut Writes: April 11th, 2008 at 10:50 pm Now that’s some teasing! Luiz Writes: April 12th, 2008 at 5:54 am =DDDDD jtlb Writes: April 12th, 2008 at 9:52 am I’m afraid you will have to wait for a whole month for the film to be uploaded… randomnut Writes: April 12th, 2008 at 10:19 am I wonder what excuse they’ll have :D LetterRip Writes: April 12th, 2008 at 10:38 am Blender Foundations policy has been first the DVDs ship to the customers who preordered, then once they have received their DVDs the video is uploaded. The DVD isn’t expected to be ready till the end of the month. So it will be awhile yet before those who didn’t make it to the premiere will get to see it. De belgische Writes: April 12th, 2008 at 11:35 am Is still possible to order the dvd? Or the number of copy is based on the number of pre-ordered dvd? Tesla Writes: April 12th, 2008 at 11:38 am @fuetgeek: yeah, it does look like earl. It’s the mouth and the eyes. We’ll have to wait till may for the dvd is what I head btw, hopefully it will be a little sooner. gego Writes: April 12th, 2008 at 2:58 pm wait a month so that the dvd’s are printed and shipped… so be patient, i am not, but i will try.. rogper Writes: April 14th, 2008 at 11:25 pm One of my all time favourite images is one that Andy made long time ago which shows one baby T-Rex happly glazing a Butterfly while the planet was being bombarded by meteors… I lost the track of that image and I don’t see it for years now, but, it’s just me or the BBB Butterfly is very identical :P"
