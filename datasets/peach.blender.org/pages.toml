full_description = "« Big Buck Bunny in CG magazine from China BBB goes Hollywood! » Jul 21 Studio harddisk online Posted in Peach Press, Production by Ton Our good friend from Torino, Gianluca “Kino3d” Faletti, has sent us a 250 GB disk, which we’ve copied our Peach studio backup on. Browse everything online here: http://blender-mirror.kino3d.org/peach/ Note that you can get here the original 4 x 16 bits OpenExr files too, straight from the renderfarm. Console-savy people will want to use wget -r (recursive) to get all of the exr in a directory. Thanks Kino! 11 Responses Dusty Writes: July 21st, 2008 at 4:51 pm Woo hoo! Klangfreund Writes: July 21st, 2008 at 11:19 pm Very noble to share this files and quite some bandwith, Kino3d. Thank you! voodka Writes: July 22nd, 2008 at 1:07 am ARRRGGG 250 GB !!! oO Anonymous Writes: July 22nd, 2008 at 2:11 am Yea, how long does did it take to copy 250GB? mangojambo Writes: July 22nd, 2008 at 2:32 am For me, never!!! lol J Writes: July 22nd, 2008 at 5:15 am ooo, out takes! Felix Kütt Writes: July 22nd, 2008 at 9:43 am very nice, indeed! :D But damn, I don’t have enough disc space to download it all. :) EnV Writes: July 22nd, 2008 at 10:34 am Great! Btw, it’s Torino, not Turino… :) DingTo Writes: July 22nd, 2008 at 12:29 pm Wow, Thank you very much for this. This is a really big adventure to discover everything. PJ Writes: August 6th, 2008 at 1:33 pm I’ve got a request for future versions: Could you make available a render in standard tv resolution 854×480 isn’t it (and in divx would be nice) CNikiel Writes: August 11th, 2008 at 8:18 am Took me 3 days 21 hours straight to download all of it on a 6000 DSL line. My DSL provider will hate me for downloading those 210GByte :-)"
