title = "Big Buck Bunny   » 2008 » July"
full_description = "Jul 21 Studio harddisk online Posted in Peach Press, Production by Ton Monday, July 21st, 2008 Our good friend from Torino, Gianluca “Kino3d” Faletti, has sent us a 250 GB disk, which we’ve copied our Peach studio backup on. Browse everything online here: http://blender-mirror.kino3d.org/peach/ Note that you can get here the original 4 x 16 bits OpenExr files too, straight from the renderfarm. Console-savy people will want to use wget -r (recursive) to get all of the exr in a directory. Thanks Kino! Posted in Peach Press, Production | 11 Comments » Jul 08 Big Buck Bunny in CG magazine from China Posted in Peach Press by Margreet Tuesday, July 8th, 2008 Today we received a copy of the CG Magazine -July 2008 #81- all the way from China. There is a review of BBB in it, as well as an interview with Ton. We can’t read it, but it must be quite impressive, because we got even two pages more than the article about Kung Fu Panda! Download the article here. Posted in Peach Press | 29 Comments »"
