title = "Big Buck Bunny  » Blog Archive   » BBB goes Hollywood!"
full_description = "« Studio harddisk online Siggraph Los Angeles report » Aug 06 BBB goes Hollywood! Posted in Blogroll, Events, Peach Press by Ton It’s SIGGRAPH week (10-15 august)! We’ve managed to get BBB screenings + peach team presentations in the theatres of three exciting Hollywood studios: Disney Feature Animation (friday) Dreamworks Animation (tuesday) Rhythm & Hues studios (wednesday) This on top of our schedule already: Sunday: Siggraph Sandbox demos, 6-8 PM Monday, three BOFs 2-6 PM Tuesday-Thursday: demos on HP booth Wednesday 8.30 PM: BBB screening and ‘making of’ Panel Four of the Peach crew artists will help me out for these 7 days, so here’s you chance to meet with Sacha, Nathan, William and Andy. It’s going to be great! Expect lots of pictures and a report here in a week -Ton- (Late news: BBB is in official selection for the prestigious Netherlands Film Festival. Whee!) 14 Responses Tyler Writes: August 6th, 2008 at 9:49 pm Yay! That’s awesome that BBB is getting some more much-deserved publicity. Dusty Writes: August 6th, 2008 at 11:06 pm WOW! Congrats guys! This is a HUGE! leap forward! Well done! J Writes: August 7th, 2008 at 1:24 am Does this mean the people who work at Disney, Dreamworks, and Rhythm & Hues watch your presentations, or is it kind of an anyone can come sort of deal? felix Writes: August 7th, 2008 at 1:45 am wow, just wow! 8) Lazza Writes: August 7th, 2008 at 11:12 am Congratulations! ton Writes: August 7th, 2008 at 1:21 pm J: the presentations are accessible for very few people, so I’ve limited it to peach crew members. It is a great networking event for the crew, and when we show up with too many people it won’t work. TristaN Writes: August 7th, 2008 at 2:13 pm Good luck guys!!! J Writes: August 7th, 2008 at 7:28 pm Thanks for the answer Ton. mwgrafx Writes: August 8th, 2008 at 6:18 pm Congrats on all your hardwork. It’s well deserved. ajit singh Writes: August 8th, 2008 at 10:13 pm wow, Good Luck to Team :) Zeb Writes: August 14th, 2008 at 3:19 am Hey Ton, and the BBB team It was really nice to meet you all Sorry again about the screening, I hope you still enjoyed the visit at the Studio. By the way if you’re fine sending me the pictures you took , that would be great ( I wish to publish a small article on BBB and your visit on my blog) Cheers Sebastien alan cocks Writes: August 17th, 2008 at 8:54 pm Torrent failure: I am acting as one of the torrent seeds, and I notice that the torrents seem to be down for some reason. From the UK at at least. main page http://www.bigbuckbunny.org/index.php/download/ for example big_buck_bunny_1080p_stereo.ogg.torrent error message: could not connect to host blender.waag.org(port 6969) Thanks and best wishes Neil Writes: August 20th, 2008 at 3:18 pm I hope these screenings went well. I’ve just seen BBB through the Drawn! blog. I loved it: great movement and characterisation. Thanks. Neil Joachim Haller Writes: August 22nd, 2008 at 9:38 am One word: awsome"
