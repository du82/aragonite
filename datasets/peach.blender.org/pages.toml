full_description = "« BBB awarded by Cyborg FF The Making of “Big Buck Bunny”: An Open-Source Evolution on Siggraph ’08 » Jun 19 Linux Pro Italian magazine Posted in Events, Media Gallery by Margreet An article about Blender and the making of BBB of 8 pages has been printed in the June issue of Linux Pro Italian magazine, with short (boxes) interviews with Enrico, Sacha and Andy. 8 Responses Felix Kütt Writes: June 19th, 2008 at 12:54 pm sweet! i want that mag now. :) blenderman345 Writes: June 19th, 2008 at 1:23 pm poor me not in english! LuigiT Writes: June 19th, 2008 at 2:12 pm NOT English, but italian! Very good :-) There is already enough material in English .. Luigi Setup Writes: June 20th, 2008 at 8:44 am Yea great new !! Where can we find it ? DramaKing Writes: June 20th, 2008 at 7:09 pm I think you click on the link. Jepessen Writes: October 10th, 2008 at 7:38 pm I’m an Italian fan of BBB, and I’ve the magazine. The article is really great!!! dave hopkins Writes: August 31st, 2009 at 7:09 am thanks dave hopkins Writes: August 31st, 2009 at 7:10 am Is this magazine available for home delivery?"
