full_description = "Sep 03 BBB conquers the Netherlands Posted in Events, Peach Press by Ton Wednesday, September 3rd, 2008 Here’s a list of events that will happen the next 2 months in the Netherlands around Blender and BBB. Most of this is a result of our successful BBB launch in the Netherlands, which resulted in a cumulation of invitations… I’ve stopped accepting any more now! :) To start with the most prestigious one: Netherlands Film Festival, official selection in main program Utrecht, sept 24 – oct 3, 2008 http://www.filmfestival.nl Three theatre screenings of BBB Sept 30: nominations for awards announced (we can become nominated in short film category) Oct 1: BBB screening + speaking as part of the “Re-vision, the new media effect” program Private screenings in international program for distributors, TV stations and studios. Oct 3: The grand Gala evening. Well, I’ll be going there anyway for fun! (more…) Posted in Events, Peach Press | 10 Comments »"
