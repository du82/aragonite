full_description = "« Awesomeness, it’s a DVD!! BBB at CG Overdrive » May 22 The DVD arrival wave… Posted in Blender Institute, Production by Ton We have shipped everything to Europe and rest of world last tuesday, May 20th. Some close Europe countries might arrive already this week friday or saturday. Dutch orders are being shipped today, and arrive friday. (Well, there’s rumours the Dutch Mail will strike…) So, we hope almost everyone can their own home-cinema premiere during the next 10 days. In the mean time we’ll build a large network of http mirrors, torrents, and streams to make sure we can do the public movie launch on May 30 or 31st. Keep tuned! In anticipation of the DVDs, we’ve upgraded the gallery with a couple of final frames from the movie. Also check the press section for a great story about BBB in today’s Netherlands largest quality news paper. Finally: please mark in the Frappr map below when you get the DVD. Makes it a review of our shipping company as well. :) http://www.frappr.com/?a=constellation_map&mapid=137440549214 115 Responses Anonymous Writes: May 22nd, 2008 at 11:51 am New Zealand here. Looks like it’ll have a long way to travel. :( jazzroy Writes: May 22nd, 2008 at 1:28 pm patiently waiting.. :) Frederick Writes: May 22nd, 2008 at 2:29 pm I wonder how many of us will actually be able to open and render the .blend files, since you had 4 GB ram machines… The files have all been checked to work in the official 2.46 release right? ton Writes: May 22nd, 2008 at 2:45 pm Yep, all were checked! We also made a couple of files not requiring too much power, in a directory ‘simple blends’. The characters themselves are also not too big. Christiaan Bakker Writes: May 22nd, 2008 at 3:06 pm Just a hint: ManCandy is broken in 2.46. Dutch: Ik hoop dat ik in oktober weer naar de Blender Conferentie kan, Ton! ;D DJ_Boxer Writes: May 22nd, 2008 at 9:03 pm I want to edit my pin and say something but I can’t. Do I have to edit on my computer where I created it? LOGAN Writes: May 22nd, 2008 at 9:43 pm Oh my, and I was under the impression that Dutch DVD’s were also send Tuesday. I feel a tear bubbling up :) Valentijn Writes: May 23rd, 2008 at 7:47 am There will be a surprise in my mailbox today…i hope If you live in Utrecht than you can check out a little exposition (23-25th of may 12:00-17:00) its a graphic design students final year from the GLU …and i made a little animation..:)….with…..blender so if you can or will you can find it at Draaiweg 51 Utrecht. Thx bart Writes: May 23rd, 2008 at 8:47 am @Valentijn: cool! I have a meeting with a client today till 12.00, I’ll come by and visit you afterwards. Will you be there? Len Writes: May 23rd, 2008 at 9:47 am Yay! I was just able to order a copy (rather late I know), maybe if I’m lucky it will get here before the online release :) CineGobs Writes: May 23rd, 2008 at 11:57 am I just received the DVD’s. :-D The DVD case was in a pretty bad shape, but fortunately the DVD’s survived. Frederik De Bleser Writes: May 23rd, 2008 at 12:26 pm I just saw the movie with some friends. It was great! Really a fantastic effort, both in the look, the story and the humor. The timing was spot-on. What a difference a script makes :-) Mark Hannessen Writes: May 23rd, 2008 at 1:12 pm I got the DVD! to bad i can’t find myself in the credits though :( Must have done something wrong.. A well, congrats for the movie, it rocked. De_Dood Writes: May 23rd, 2008 at 1:33 pm Hwoohooo, got the DVD. Now I just have to wait until tonight to watch it. crazybus Writes: May 23rd, 2008 at 1:37 pm DVD cases in bad shape, name missing from credits. Now I have to add worried to my growing impatience for it to fly across the globe. Stefan de Konink Writes: May 23rd, 2008 at 2:37 pm Got it! Put it in the player and started listening! Great music :) Stefan de Konink Writes: May 23rd, 2008 at 2:43 pm …btw will probably broadcast it on TV in the next few days :) So if you live in Nootdorp-Pijnacker, you can see the movie on TV :) MrE Writes: May 23rd, 2008 at 3:12 pm Just got it in the mail!! Can’t edit my pin from here though. Box arrived in perfect condition. The print on the DVD looks gorgeous And my name was also in the credits. So no worries crazybus. @Stefan the Konink. You mean you work for a local tv station and will broadcast it for people in the Pijnacker area? ton Writes: May 23rd, 2008 at 3:19 pm If people find the DVD in bad shape in their mailbox, please send us (use shop at blender.org) a picture of that. We have taken extra precaution to prevent damaging, I’m very suprised to get this report in already! We will send you a good DVD without hesitation. Mark: I checked your order, and the shop system tells me you didn’t select the menu item with “Add my name”… it was default set to “Not add name”. Sorry for that. For the Apricot disk order it says get a credit though. Mark Hannessen Writes: May 23rd, 2008 at 3:27 pm thanks for checking that out ton, no hard feelings ;) it’s still a great movie without my name in the credits :p Hannu Hoffrén Writes: May 23rd, 2008 at 3:36 pm Had to check the names and seems to be that I left the selection out too, since can’t find my name either. :( Ah well, at least the case’s condition was all ok. :) Will make something to eat and go watch the actual clip now. Foppe Benedictus Writes: May 23rd, 2008 at 4:23 pm Got it! Thanks! Also tried to find my name and couldn’t find it… Master Writes: May 23rd, 2008 at 4:30 pm Thanks! DVD waiting. CineGobs Writes: May 23rd, 2008 at 4:32 pm @Ton: Tried several times(from different email addresses) to email my photo of the DVD case to shop at blender.org, but every time it bounces with the message “Recipient address rejected: Mail appeared to be SPAM or forged.” panzi Writes: May 23rd, 2008 at 4:41 pm I received my DVD! :) Greetings from Austria. Stefan de Konink Writes: May 23rd, 2008 at 5:16 pm @MrE Yes :) At my previous local station (Leidschendam-Voorburg) I did the same with Elephants Dream. So probably I’ll make a nice movie night :) xvisx Writes: May 23rd, 2008 at 5:27 pm Now I think back: I should’ve picked up the dvd when I was a kilometre away last tuesday ;-), since I didn’t get the dvd today credit to the strikings at the post offices. Maybe tomorrow I’ll be lucky. :-) ton Writes: May 23rd, 2008 at 6:35 pm cinegobs: that’s weird. Why not put the image online (or use http://imagebin.org ) and then email. Alexander Ewering Writes: May 23rd, 2008 at 10:13 pm cinegobs: Wow, still someone not using xx-mail.com? :) entplex Writes: May 23rd, 2008 at 10:23 pm Any unofficial torrents up yet of the movie? UglyMike Writes: May 23rd, 2008 at 10:32 pm Yeah!! DVD arrived today, Friday 23rd, in the Brussels area of Belgium. Nice movie too. Some good gags in there. Anton Writes: May 23rd, 2008 at 11:11 pm Yes!! DVD arrived today, I really like the animatics. A little critique personally I find the music choice is to excessive. Zaffo Writes: May 23rd, 2008 at 11:29 pm The DVD arrived, and even in one piece! We had a nice 15 minutes movie night. Although it was just the PAL version, it was very detailed. I also like the html-indexes on the DVDs. Good job! @entplex: No CineGobs Writes: May 24th, 2008 at 12:11 am @Ton: I tried sending the email using my ISP’s asmtp server instead of their smtp server, and this time it didn’t bounce. It seems the normal smtp server must have been blacklisted somewhere. @Anton: I thought the music was great. It was like a cross between the music from the old Tex Avery cartoons and the music from Shrek. :) MrE Writes: May 24th, 2008 at 1:32 am @Stefan de Konink When are you going to air it? A friend of mine lives in that area and it would be fun if she can see it then. De_Dood Writes: May 24th, 2008 at 2:02 pm Watched it and loved it! Great work guys! Vassilios Boucer Writes: May 24th, 2008 at 2:11 pm I also already watched it! …and i must say Simply Amazing!!! The Music is also Great!!! Congratulations Grahame Writes: May 24th, 2008 at 2:20 pm I’m in the UK and I got mine this morning. Watched it with my little sister and we both enjoyed the movie. Personally I found the script to be much better than Elephant’s Dream which I think will help to draw a wider audience. Clemens Writes: May 24th, 2008 at 2:28 pm Hey my copy arrived. Unfortunately can’t find my name on it but that does not make it any worse. Love the movie I am checking out the bonus material right now. John Drinkwater Writes: May 24th, 2008 at 2:46 pm Got mine this morning in the UK, middle of the country too… I couldn’t stop laughing, the script and timing were genius. Really hope BBC Click picks up the film and interviews the Peach/Blender team. xvisx Writes: May 24th, 2008 at 3:52 pm What a hilarious movie! Everything works really well together. Arun Writes: May 24th, 2008 at 5:40 pm By reading all of yours comments am feeling More happy than any one of U and am feeling sad too. Sorry for Blender foundation for not Purchasing/sponsoring the BBB DVD. Because I can’t Pay such Huge amount at this moment too. The same situation I always had since Elephant Dreams release and Now. But I Promise to sponsor the next Project and get One for me too, then I will Proudly search for my name in the credits and come here and say hay where is my name ton I can’t Find it Too, and what is this, why my DVD is in Bad shape. U should have secured it specially before Packing for me. ok ok I forgive u :)send me a new DVD :). I really Miss these DVDs when ever I think about Blender. Just I want to Own One of those. . . Just One of Each. Reach the skies and never return, Let OUR BLENDER reach the top of all 3D and COMPOSITING softwares on Earth. I want to see it Happen. and finally Congratulations Peach team for another new Project(BBB) and Version(2.46) release. qubodup Writes: May 24th, 2008 at 6:23 pm Hey, I got my DVD today, very glad. I uploaded one of the AVIs to vimeo: http://www.vimeo.com/1059563 Sympodius Writes: May 24th, 2008 at 6:23 pm I just got my DVD and this is brilliant. I love the movie and things have really come a long way since Elephants Dream (which I also loved). But the really big improvement has to be the DVD-ROM stuff. This is so clearly laid out and easy to use. And the tutorials are superb. Thank you so much, guys! And well done again! qubodup Writes: May 24th, 2008 at 6:24 pm PS: A very slight review can be found here: http://freegamer.blogspot.com/2008/05/news-snippets-big-buck-bunny-aka-peach.html AntonG Writes: May 24th, 2008 at 7:03 pm Arrived here in Slovenia. Great! -AntonG Justin Writes: May 24th, 2008 at 7:14 pm Damn, there’s a lot of Justins in those credits. Justin Writes: May 24th, 2008 at 7:17 pm Ooops, yes, arrived in the UK today olivS Writes: May 24th, 2008 at 8:15 pm It reached France today. @ton: unfortunately, the BBB poster of the film you send me is in very bad condition! The package looked good at first glance, I wonder what happened during the travel… No harm though, it is still useful, don’t worry about it. dexta Writes: May 24th, 2008 at 10:09 pm The DVD arrived in Hamburg Germany. Nice Job to all … Mildred Ki'Lya Writes: May 24th, 2008 at 10:32 pm I received it Today (the 24th). And I had the opportunity to present it to a local group of friends who appreciated it. Thank you very much ! DAVARB Writes: May 24th, 2008 at 10:42 pm Awesome work men! I love the extras and attention to detail. Stefan de Konink Writes: May 24th, 2008 at 10:53 pm @MrE: after the audio cables are placed. The start of the week probably. But it will be announced on the BBS. tempy Writes: May 25th, 2008 at 12:38 am Wow, that was a great movie! Really enjoyed watching it, and will recommend it to all my friends. yelow Writes: May 25th, 2008 at 1:17 am Yes! arrived this morning in UK. Fantastic work, the HD version adds even more (of coarse) to the quality. Characters are wonderful, sound is excellent, comic timing perfect 99% and excellent ending. Well done to all who took part, thank you. btw my name was also not in the credits, did order early on well within the first 1000. No matter, helping financialy however small gives the warm fuzzy feeling along with the movie. You done the whole community proud. Haven’t yet sponsored the Apricot project because games aern’t my bag but suddenly realised that no doubt it won’t only be the game engine / CS that gets developed further so need to sponsor Apricot as well. :-) wayne Writes: May 25th, 2008 at 1:07 pm so i’m just wondering why the online release was set to be the 30th, because the torrents have already started appearing… crazybus Writes: May 25th, 2008 at 1:14 pm It was set to that date to give time for all dvd preorders to reach their destinations. The torrents are of course unofficial and therefore not subject to the official online release date. blenderman345 Writes: May 25th, 2008 at 6:14 pm Hey qubodup, what happened on the BBB Vimeo? Can’t get it? ROUBAL Writes: May 25th, 2008 at 6:27 pm Well, I can’t add my location on the map, but I have got my DVD of BBB yesterday, the 24th of May. I have already watched it more than 10 times, and really enjoyed it ! Congratuations to the whole Peach Team. Great and funny movie, fine animation, fine lightings, great music and awesome authoring. Thank you a lot Guys ! Olaf Writes: May 25th, 2008 at 7:38 pm I got the DVD friday afternoon in my mailbox (in Holland). I loved the movie, fantastic job guys, and especially the extra’s such as outtakes. The most disappointing thing for me was that my name wasn’t in the titles, I remember that I opted for being listed. Oh well, better luck next time. ZikZak Writes: May 25th, 2008 at 8:32 pm Received in my mailbox yesterday. Incredible ! I hope that people will make good use of the source material. 1O minutes of great enjoyement, my nephews enjoyed also so much your movie, it was such a pleasure to let them appreciate your work and they like your fat bunny :-) Congratulations to everyone involved, the production team of course but also every singe people who supported the project. Hannu Writes: May 26th, 2008 at 7:43 am @Olaf: Yes, the first feeling is a bit left out. But for me at least, it went away pretty soon after I got to see the movie and the material. Just wondering for the next project, would it be good idea to leave the default selection for “add my name” unchecked, so that the user is forced to choose which one he/she wants? And maybe also some kind of check list to the net, to prevent possible error selections (or even bugs) like Olaf seems to have? horace Writes: May 26th, 2008 at 9:55 am what is the reason that so many names seem to be forgotten in the credits? some bug in the shop? or is it their own mistake? missed deadline? wrong selection? panzi Writes: May 26th, 2008 at 2:23 pm @Olaf: Do your Bill contain the Text “Credits: Add my name to the Movie credits.”? I mean the sheet of paper that’s glued to the carton the movie is delivered in. You can pull it of and unfold it to see the quantity of articl"
