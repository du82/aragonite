full_description = "« Still so many minutes left to animate See how the environment is progressing » Jan 23 Movie title? Posted in Media Gallery, Random Fluff by Margreet It’s about time that the title of the movie is going to be announced. Don’t you think so… Download the .ogg file here. 29 Responses nate Writes: January 23rd, 2008 at 9:07 pm yes i think so Tomas Writes: January 23rd, 2008 at 9:07 pm Yeah, otherwise no one will be able to say “And the prize for best animated short goes to….”. So come on, don’t let us sit here in torture! fluetgeek Writes: January 23rd, 2008 at 9:18 pm hm, i don’t know why, but i’ve got the strange feeling that it’ll be gnaw. Emili Writes: January 23rd, 2008 at 9:42 pm quote from fluetgeek: “…but i’ve got the strange feeling that it’ll be gnaw” Response: gnaw :-D BlenderBoy Writes: January 23rd, 2008 at 9:44 pm I agree with Ton, don’t name the project something you can’t pronounce (gnaw is no good). Something creative BUT relevant, as ED was a little eccentric. I’m sure whatever the team decides the community will embrace. Go Peach! Zeqe Writes: January 23rd, 2008 at 9:59 pm I thought it was going to be “Breakdown”. Jay Writes: January 23rd, 2008 at 10:17 pm Ton even sang a song about gnaw: http://www.youtube.com/watch?v=w8J_Yq-o-H4 oioioi Writes: January 23rd, 2008 at 9:32 pm NUTS! Tesla Writes: January 24th, 2008 at 12:25 am haha, I agree with Ton, better think of another title that is a bit easier ToastBusters Writes: January 24th, 2008 at 1:56 am I don’t see why anyone would have trouble pronouncing “gnaw.” True, I am American (western) so it could just be an accent issue. Is it really that hard to pronounce? Meltdown Writes: January 24th, 2008 at 2:35 am Toast: Yes it is. “Proog” wasn’t easy too. Hey, Ton looks like “De Niro” at 37 seconds. :) Richard Writes: January 24th, 2008 at 5:56 am download.blender.org keeps timing out for me. Is anyone else having this problem? Meneer de Peer Writes: January 24th, 2008 at 6:33 am Same issue here, now I have to miss my daily shot of Peach, blah. Alex Writes: January 24th, 2008 at 10:04 am Can’t get on at all! Felix Kütt Writes: January 24th, 2008 at 10:58 am noes download.blender.org’s dead again? :’-( Leodp Writes: January 24th, 2008 at 1:15 pm ED… CB? Jan Writes: January 24th, 2008 at 1:46 pm Ton killed the download, ho holds all the passwords….this deadline is really getting to him ; ) Olaf Writes: January 24th, 2008 at 4:02 pm Strange. The .ogg file crashes during the last seconds on my machine. Anyone having the same problem? ton Writes: January 24th, 2008 at 4:06 pm download server was hanging, we rebooted it and all works fine again! thoro (Thorsten Schlüter) Writes: January 24th, 2008 at 4:14 pm Haha, my personal guitar god Joe Satriani made a song called “Gnaahh” :-). LOGAN Writes: January 24th, 2008 at 4:25 pm Wanna see a cool movie? Gnaw? Ok, then not :D So you call it “Nibble”, “Going Nuts”, “Just Peach”, “Pinky and other nuts”, “Not Another Pixar Clone” or you gonna make the community pick a name (which is hard without seen the movie). Gnaw. No? Hmm, maybe the name is a bit to much sounding like the Nah, as in no. Make it positive, call it Yah! :) gethezaidma Writes: January 24th, 2008 at 5:20 pm how about a combination of cute and furry? Something like “curry”? HARHARHAR Jahmaica Writes: January 25th, 2008 at 1:09 am Why not call it “Peach”, peach is nice, sounds nice, and even looks nice (the word) Mark Keller Writes: January 25th, 2008 at 8:16 am But you can’t have a movie with the same title as its codename! Actually, “Peach” is a rather cool title. There seriously ought to be a peach in it somewhere, though – like the elephant-headed cane in the last one. BrianR Writes: January 25th, 2008 at 1:42 pm “Gnaw” is no good for an Open Source project. Because GNOME developers can’t get their heads round the idea of a silent G, of course. Johan Writes: January 26th, 2008 at 1:47 pm How about ‘On hares end’? white rabbit Writes: January 27th, 2008 at 1:49 am how about ‘the slender white rabbit and his power on reality distortion’ JoOngle Writes: January 28th, 2008 at 12:18 pm Ironically we ended up naming a rodent-product Gnavz a few years ago…using Blender to create the “Gnavz” rodent character mascots for the product lineup. ;) I know it´s somewhat coincidental but to me somewhat funny :) An image I made a while back… http://www.akvarieudstyr.dk/images/Produkter/Bazig66502.jpg Club Penguin Cheats Writes: January 18th, 2010 at 9:04 am I don’t see why anyone would have trouble pronouncing “gnaw.” True, I am American (western) so it could just be an accent issue."
