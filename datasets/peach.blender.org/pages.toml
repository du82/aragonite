full_description = "« The Peach Studio Disk Edition Newspaper clippings » Apr 15 Photos premiere! Posted in Events by campbell Photos: William Maanders / CC-BY 3.0 Photos: William Maanders / CC-BY 3.0 It was fuuuun! Sacha 27 Responses Pierre Writes: April 15th, 2008 at 4:19 pm OMG, Nathan, you’re gorgeous! :D Ah la la, I can’t wait to see this film!!! Congrats to everyone who worked on this fantastic project! Gianmichele Writes: April 15th, 2008 at 5:07 pm cool photos! great work! You guys are superstars VoOdKa Writes: April 15th, 2008 at 6:27 pm good photos !!!! thank you! RNS Writes: April 15th, 2008 at 6:42 pm Great team,sad that it all ends.”The right stuff”.I wish all the best in coming days. MrNoodle Writes: April 15th, 2008 at 6:46 pm Nice limo car.You should consider selling that Big buck bunny shirt. Zimbloggy Writes: April 15th, 2008 at 6:51 pm When do we get to download Big Buck Bunny? Anthoni_C Writes: April 15th, 2008 at 7:01 pm Nathan the pig tails aren’t workin’ for ya… Month Writes: April 15th, 2008 at 7:40 pm I’m just out of the field of the camera at some of the pictures, now I don’t have any proof that I was there :( :p oh and I was told that the blue version of those tshirts is going to be sold from the eshop ( they were 15 euros for non vips) anyway nice pictures, and thanks again for creating that great animation Felix Kütt Writes: April 15th, 2008 at 10:15 pm arg in the last image there are some 2 weird guy’s i think i have seen them somewhere else on the net before.. O_O they must be famuz. :x ah, now they are all famuz. :) Roy Writes: April 15th, 2008 at 11:18 pm Nathan, do your 3d glasses indicate that you are working on a 3d version of BBB? big ups Writes: April 15th, 2008 at 11:42 pm That lady has the most ferocious mullet i have ever seen! LoMac Writes: April 16th, 2008 at 12:51 am What a momentous event. Wish I could have been there. z0man Writes: April 16th, 2008 at 2:37 am Well derserved premiere! Nice touch with the limo. It’s those kind of pictures saying, ‘You should of been here’. I regrettably wish I was there to have seen it first at the cinema. Tim Crazy Writes: April 16th, 2008 at 3:29 am LOL, nice outfit nathan madman Writes: April 16th, 2008 at 3:50 am Ton looks like Dr. House XD, but with less hair. Big Fan Writes: April 16th, 2008 at 9:10 am OMG!! there is a photo here with Enrico caught smiling ;) dusty Writes: April 16th, 2008 at 10:13 am Congrats guys, looked like a whole load of fun. :) nawabz Writes: April 16th, 2008 at 1:00 pm /wp-content/uploads/rabidrodents.png Cathy & India Writes: April 16th, 2008 at 1:15 pm Phwoar! Don’t you all look handsome in your suits – wooohooo! Congrats guys. Love youse all. Dave Writes: April 17th, 2008 at 12:58 am Ton looks really cool there. David Writes: April 17th, 2008 at 3:57 am ooohhhhh… I want the movie!!! SeeYa! Gianmichele Writes: April 17th, 2008 at 5:47 pm Hey guys, just a question. Are you using OSS to create and edit the DVD too? Which one in case ? Poopenjay Writes: April 19th, 2008 at 3:13 pm It was so nice of them to take a special needs kid out with them too (row 5 pic 2). He looks so happy. Also, I’ve seen the person in row 6 pic 3 before. Was it BgDM’s avatar? Is that girl in row 7 pic 1 eyeing up terminator @andy? Maybe laughing a bit but she’s cute. I didn’t know Alltaken’s girlfriend was there too – 4th row after Ton is smart. Sigh, such a nice event. I would say you guys deserve it but I haven’t seen the movie yet ;). Well it takes hard work no matter the outcome and you’ve all earned it over the years so congratulations on your success. Satish 'iluvblender' Goda Writes: April 27th, 2008 at 9:28 am Very nice pictures. You guys Rock!!!"
