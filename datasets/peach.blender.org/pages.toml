title = "Big Buck Bunny  » Blog Archive   » Peach DVD pre-sale campaign started!"
full_description = '« Blender Institute tour Magic Mandcandy – Can You Finish It? » Aug 01 Peach DVD pre-sale campaign started! Posted in Production by Ton As for the previous Open Movie, we depend on your help to be able to realize this project! You can do that by purchasing the DVD edition of Peach in advance. Our target is to get at least 1000 DVDs sold before the start of the project, october 1st. Everyone who orders and pays the DVD before october 1st will get a discount and his/her name credited in the movie credit roll! On the Peach DVD (two disks) you will find: The movie in best DVD quality widescreen format (versions in both NTSC and PAL) The HD version of the movie (.avi and/or .mov) Commentary tracks by the creators All .blend files, models, textures, and so on… the material used to create the movie. The original script, breakdown, storyboards Documentation and video tutorials by the team members about all technical aspects the movie; like how to re-use assets, animate characters, or add new shots. And all of that for just 29 EUR (35 USD)! Based on feedback on the Elephants Dream DVD, I’ve also decided to not spend much time on a traditional Making Of Documentary, but instead focus much more on documenting the technical side, the creation process, and providing good(video) tutorials for artists. Of course, consider this blog post as invitation to come with suggestions for valuable DVD extras. Visit the Blender e-shop for ordering the DVD. -Ton- 54 Responses thoro (Thorsten Schlüter) Writes: August 1st, 2007 at 7:12 pm Great! I ordered my copy. 1000 DVDs sold before October 1st? That should be no problem – the Elephants Dream DVDs are entertaining and very instructive and I think the Project Peach DVDs will be, too. It’s definitely worth the money. Cheers Thorsten Christiaan "AniCator" Bakker Writes: August 1st, 2007 at 8:24 pm I hope that the Peach project will get even more attention than ED. I hope there will be a Making Of video in which you explain the issues you had to solve. Buy the The Incredibles DVD, learn from the way Brad Bird makes his making ofs (I only saw these great making ofs on the DVD’s of the movies Brad made) . I wish you luck with everything. I hope I can make it to the next Blender Conference too. – AniCator Elubie (Andrea Weikert) Writes: August 1st, 2007 at 8:47 pm Great stuff! Wish you all the best luck and great fun while making the movie! I’m really digging the concept art and the banner so far, so I’m really looking forward to keeping up with your progress in the coming months! Paul Lunneberg Writes: August 1st, 2007 at 8:50 pm Just ordered mine! I’m really looking forward to this one! I’m wondering if Blue-Ray and HD-DVD versions would be possible? Just a thought… Looking forward to seeing more as this project moves on! Can’t wait to possibly meet some of the artists at Siggraph if they’ll be there too… JiriH Writes: August 1st, 2007 at 8:57 pm Great news. I have already ordered mine. Very welcomed are short technique tutorials instead of general Making of. Good luch Peach team :-) Anton Gregorn Writes: August 1st, 2007 at 9:52 pm Just done with the order. Good luck team! You can do it ;-) -AntonG Jack Reinieren Writes: August 1st, 2007 at 10:44 pm I ordered mine right away. I liked the ED DVD’s. But I found it rather fun the Making of. But that’s just my opinion. Have fun, creating a fun and furry movie :D Oxben Writes: August 1st, 2007 at 10:57 pm I just pre-ordered my copy! Good luck for the project! madman Writes: August 1st, 2007 at 11:33 pm Great! ton Writes: August 1st, 2007 at 11:46 pm A HD-DVD and Blue-ray DVD would be nice options. There’s a German company who did this for Orange, I will contact them to check for a deal… although it might be better to just leave it to them completely. Don’t forget it is open content what we make, it is free to be copied and distributed. Has a lot of benefits for everyone. :) nam Writes: August 2nd, 2007 at 12:08 am I would like to see more behind the scenes and maybe some video footages of you guys working in ur little cubicles and a small interview with the artist. Nothing helps inspires like some words from the artists’ mouth. buergi Writes: August 2nd, 2007 at 1:18 am i’ll order tomorrow, can’t wait to get it good luck for the project, have fun! kernond Writes: August 2nd, 2007 at 1:55 am An idea for a minor DVD extra: a great recipe for a peach-based dish (peach cobbler, etc.) Each project could feature something similar and maybe the recipe could be used for the official dessert/treat at the movie premiere event. FastlaneMike Writes: August 2nd, 2007 at 3:30 am I’m really looking forward to seeing the results of this project. I thoroughly enjoyed Elephants Dream and all of the extras on the DVD. I personally enjoyed the standard making-of video showing the group enjoying the time working on the project, but I agree that technical/tutorial videos would be a very welcome addition. Good luck to all on the project! I await the final outcome eagerly. RedBirdiii Writes: August 2nd, 2007 at 6:13 am Just ordered mine! I’m really exited to see this movie! A brief ‘making of’ feature won’t hurt.. as it is very interesting to know how the designers and animators work on this in the newly adopted institute.. Brian Writes: August 2nd, 2007 at 6:16 am I think a good balance would be a small making of with some fun shots during the production. It would be awesome to see some of them modeling the characters at the start. Or watch a rig being built. Not necessarily even a tutorial, but just discussion similar to what took place during the BCon2006 in the Lighting and Shading session, where it was fun interaction between members of the group, etc. Sympodius Writes: August 2nd, 2007 at 7:34 am Just ordered my copy and bought two t-shirts and a sweatshirt. I’m a little sad to see there are no blender hats left: I always rather wanted one but never seemed to have the funds at the time. Oh well. Good luck on the movie. Anton Gregorn Writes: August 2nd, 2007 at 9:40 am I cannot find RSS link for the peach blog. Anyone can help? -AntonG mikasaari Writes: August 2nd, 2007 at 11:20 am Really great news. Also pre-ordered the DVD. Technical side documentation for extras sounds excellent. What I would like to see there are like from the beginning to the end of the implementation technical documentation. What Ton had to do before the whole project, planning (which applications were used for scripting, and for organizating the whole project), What kind of equipment was used for blender side, but also for audio side (If Jan could make some simple walkthrough of his music making process and his favourite hw/sw), about planning the creatures (clay carving video clip :), argh everything ;) Alex Fraser Writes: August 2nd, 2007 at 12:55 pm Sounds great! I’d love to see ogg theora files on there too, if there’s room. Richard Writes: August 2nd, 2007 at 1:49 pm Is there any chance of a counter of DVD sales like Elephants Dream? Serge Gielkens Writes: August 2nd, 2007 at 2:22 pm I just ordered my copy. I noticed that the e-shop calculated EUR 36.77 but PayPal charged EUR 36.52. Not a big difference, but I hope that those 25 cents won’t prevent shipping… Joe Meier Writes: August 2nd, 2007 at 3:29 pm What I think would make this project even more useful to beginners would be to also include (and save) more of the intermediate design files for the characters. Elephants Dream just had the final model files, what would be great would be to get an idea of how each character was created via subsurf from just a square (or something like that). It would be greate to see a bunch of intermediate model files so those trying to learn how to model can learn from these files. Bmud Writes: August 2nd, 2007 at 5:29 pm Woot! …and THIS TIME i made SURE to check “yes please put my name in the credits”! :D Esa Oikari Writes: August 2nd, 2007 at 6:23 pm E-shop calculates taxes first and then adds postage (=36.41€). In bank transfer instructions postages are added first and taxes are calculated from price+postage (=36.77€). Latter sum is right, I think. Ton Writes: August 2nd, 2007 at 6:35 pm Esa: the shop software we use is a seven year old accumulated hack. I will try to fix this part, but we rather move to a new shop software install a.s.a.p.! Joel Writes: August 2nd, 2007 at 10:19 pm Just pre-ordered mine! I think that a time-lapse of one (or more) of the character models being modelled would be awesome!! horace Writes: August 3rd, 2007 at 6:07 am including video tutorials is a great idea! encodi Writes: August 3rd, 2007 at 8:10 am Awesome way to get contributions =D we get something in change of our help and something really cool it is. I will for sure get mine before october 1st. Just a question what license are u gonna use on the .blend files? are we gonna able to use any of the materials in our own work? Olyphant Writes: August 3rd, 2007 at 9:01 am Isnt it an idea to include ED on the dvd? @encodi quote from http://www.blender.org/blenderorg/blender-foundation/2007-plans/peach-open-movie/ “Release the movie and studio database freely licensed as Creative Commons.” I think thats no surprise. Richard Writes: August 3rd, 2007 at 11:54 am Ordered mine. There’s already 25% percent of the goal done (that’s including the pending). Looks like it may sell better then Elephants Dream. Jakub Steiner Writes: August 3rd, 2007 at 7:29 pm Wow, what a dream team! Lots of talent. 2nd round is going to be even more sweet than last time :) Javier Ariza Writes: August 4th, 2007 at 1:12 pm In which languages will be available? Voice / subs in spanish too ?? Ville Writes: August 4th, 2007 at 2:58 pm It would be great if you let people to add a subtitling of their language with the dvd-release. They could translate it from the script and send it to you. Think about it please. TiZeta Writes: August 4th, 2007 at 4:05 pm Just oredered my copy. I really like Peach project, the concept sketch are wonderful. This time it will be ever better. Best luck! Graham Hall Writes: August 4th, 2007 at 11:51 pm Just ordered my copy, don’t skimp too much on the “Making of” though…its useful for teaching Teamwork…I show MofED to prospective students! Javier Ariza Writes: August 5th, 2007 at 1:21 am something about if the movie will be in spanish? (voices or subs). Benedito Santos Writes: August 5th, 2007 at 4:19 pm I ordered my copy. This project is very wonderful. John Drinkwater Writes: August 5th, 2007 at 11:28 pm Ordered myself a copy already, I can’t wait to see the project develop as well Elephant’s Dream did. Fredster Writes: August 7th, 2007 at 1:24 pm I would really like to see this on HD DVD!! Jerome Writes: August 8th, 2007 at 5:18 pm I just can’t wait.. arrgg Mark Hannessen Writes: August 13th, 2007 at 8:20 pm just preordered it! (where already half the way with the sales, keep ik up!!) I think the main focus of the second movie should be a bit more on the story line, the graphics where already quite good in the first one. anyway, you guys keep it up! Dworak_of_sky Writes: August 14th, 2007 at 10:28 am The header remembers me Scratch in Ice Age ;) I had missed Elephant Dream, but I won’t do the same mistake with Peach: I order it as soon as I’m back home today… I ‘d have a little request: in Elephant dream, as I discoverded it, it was in english and mine wasn’t good enough to allow me to understand everthing correctly :/. So, would it be possible to include a few additionnal languages to the “preorder-pack” ? :) (even if it seems there won’t be many dialogues in this movie ^^) and now, I’m going to do some advertising about this around me :) Ruddy Writes: August 14th, 2007 at 11:00 am payment done! long live the blender foundation! Thank you to everybody who gives his/her time for this wonderful piece of software! Dave Writes: August 17th, 2007 at 7:59 pm This is looking amazing already! I can’t wait until the movie’s done. :) Dalai Writes: August 21st, 2007 at 4:51 am Hi, there is a possibility to make subtitles to extra-DVD? You know Ton’s english isn’t very clear :p (but serious, is hard for me as brazilian to understand everything) Good Luck Moein Writes: August 26th, 2007 at 8:18 am I prefer to have subtitles in DVDs as well :) Sean Writes: August 30th, 2007 at 2:02 am Digg this page, so more people will preorder the movie… http://www.digg.com/videos/animation/Peach_open_movie_DVD_pre_sale_campaign_started Pluuske Writes: September 4th, 2007 at 3:34 pm I ordered my copy yesterday. Can’t wait either… This is the first thing i’ve ordered from the Blender shop Hope it will be worth it, but it already does look great… I downloaded Blender for the first time last year, and it’s great! Sam Watterson Writes: September 12th, 2007 at 11:08 am Looking good, pre-ordering mine now, are there any blender logos we can use as links for promoting this? Mark Keller Writes: September 14th, 2007 at 12:02 am Just ordered my copy! And in addition to the HD version of the movie (.avi and/or .mov), it would be nice if there were a lower-res copy as well, for online distribution, etc. 3sie 3wiel Writes: September 25th, 2007 at 7:57 am Ordered my copy! I’d love to see plenty techical video tutorials included. Any fluids, rigid bodies etc. Love the work!! Felix_Kütt Writes: September 25th, 2007 at 8:30 am 1000 mark made! :) Joe Chinn ([-_-]) Writes: September 27th, 2007 at 2:05 am I just hope this is as good as elephants dream. The work they did with that was very good. In my opinion the standard has been set.'
