full_description = "« BBB conquers the Netherlands “Gosh, that we can do this too!” » Nov 09 Holland Animation Film Festival: 2 awards! Posted in Events, Production by Ton Big Buck Bunny is the winner of two awards: – The MovieSquad Audience Award (kids of 8-12 voted in the HAFF school program) – The HAFF Audience Award (festival visitors voted, with over 40 nominations) Festival news page Congrats to the entire team, and of course to everyone who has supported BBB! -Ton- 15 Responses Satish 'iluvblender' Goda Writes: November 9th, 2008 at 4:24 pm Congratulations to Team Peach. Blend on!!!! Wouter Writes: November 9th, 2008 at 8:52 pm Congratulations with the prizes, you’ve really earned it! Vincent Writes: November 9th, 2008 at 8:57 pm Gefeliciteerd! However, how on earth can you live with yourself after showing this to kids of 8-12 years old? I bet Kijkwijzer wouldn’t approve ;) d@nny Writes: November 9th, 2008 at 11:41 pm Congratulations to the whole peach team! Wow, 2 awards! panzi Writes: November 10th, 2008 at 1:50 am Congratulations! :) Jurjen Writes: November 10th, 2008 at 11:48 am Wow.. congratulations. You really tried to make something that would entertain lots of people. Now you have proof of that. Nice! Raaj Bharath Veeramani Writes: July 24th, 2009 at 4:14 am Very appreciative work by the Entire team.The short length of the movie adds as a plus point to the movie.Really very good work . Great job ! Yoh have done it ! sufail andros Writes: July 27th, 2009 at 7:33 am wow great work, we r now starting a animation film, we r using reference BIG BUCK BUNNY. Mike Artosi Writes: August 8th, 2009 at 5:48 pm Fantasitc!!! all I can say it’s the firs time I see a production like this. Go guys GO !!! Open source film is absolutly a new frontier. seyed Writes: August 17th, 2009 at 3:06 pm thanks for co Nacotic Writes: October 9th, 2009 at 4:02 pm nice.. crongrats for that…. BBB FTW!! i think, bbb is one of the greatest animation- shortmovie i’ve ever seen. alltime i’m watching bbb i give a big laughthing to madagascar… James Writes: October 27th, 2009 at 3:31 pm I first watched Big Buck Bunny on a television in the common area of a local technical university (Ryerson U. , Toronto, Canada)just a couple of weeks ago. I haven’t laughed out so loud in a public place in ages. Ryerson’s speciality is media of all varieties, so I think BBB is played as inspiration in the schools common areas to show what people can accomplish when they work at it. Or they might play it for a laugh. Congratulations! Herr Moose Writes: November 13th, 2009 at 2:54 pm I hadn’t seen the completed film until now – I think it is exceptionally well animated, in many scenes even better than in some “big budget” animated feature films. I hope the “big studios” have begun hiring the whole team because you guys definitely know what your’re doing! Outstanding work! notAbunny Writes: January 21st, 2010 at 2:49 pm I have seen BBB recently in an infinite loop in a Saturn in germany. just wanted to let you know Jenny Writes: March 11th, 2010 at 12:04 pm Hey ! Glad to hear it’s not over for Big Buck Bunny"
