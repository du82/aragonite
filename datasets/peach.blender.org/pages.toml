title = "Big Buck Bunny  » Blog Archive   » BBB Premiere"
full_description = "« Noodles and More The Happy Blender Institute Tour » Mar 04 BBB Premiere Posted in Production by Ton Finally an update from the producers department. Let’s start with the biggest news: the premiere date now is final and confirmed! Thursday April 10th, 2008 Cinema Studio K, Amsterdam the Netherlands Premiere event starts at 19.00, and includes dinner and party. This is actually two weeks later than the original plan… which we’ll especially need to go over all shots again for final tweaks, error fixing, and general beautifying. The premiere event has been made possible in collaboration with Creative Commons Netherlands (thanks guys!), which enables us to make this an unforgettable evening for Blender and for the open source and open content movement again. The other big news is that we’ll have a real 35mm film copy with digital sound this time! Thanks to sponsorship of our friendly neighbours of Filmmore we will even get three copies, sufficient for an efficient distribution to festivals worldwide. It also means that we can start finding cinemas in big cities for local premiere events (between april 15 and june 1). If you’re interested in organizing this, please email margreet(at)blender.org to get more information. The premiere evening will be accessible for everyone. However, if you want to be assured you can get a seat for the first screening you have to subscribe to the VIP ticket in our e-shop. This ticket only costs 30 euro and includes a glass of champagne after the film, snacks and a meal, some free drinks and first access to the party with a cool DJ. Not to mention early access to all celebs! The cinema also will do a second screening, probably around 20h. This will be freely accessible for everyone, on a ‘first come first gets in’ basis. The party is also accessible for everyone, but only after 22h. You’ll then have to take care of your own dinner and pay for own drinks. But you’re very welcome! More details about the schedule we’ll post here soon. Note: Studio K is a hip new venue, in the same block as the recently opened StayOK hostel. This hostel has an excellent name. Book early! Visit the e-shop to reserve your VIP ticket. Later more, -Ton- 33 Responses Felix Kütt Writes: March 4th, 2008 at 11:17 am O_O sweet news! :) MasterDomino Writes: March 4th, 2008 at 11:53 am Wow, great that you’ll receive 35mm-Copies of the film. Hopefully we can read something about the process of putting them to these rolls on the blog. MD JiriH Writes: March 4th, 2008 at 12:07 pm Thank you for this great news! Will there be any teaser soon? Anonymous Writes: March 4th, 2008 at 12:07 pm Are girls allowed? Sorry, I couldn’t resist. Please note; This is a reference to the Elephants Dream premiere blog post. dusty Writes: March 4th, 2008 at 1:49 pm Ooooooooo it’s getting sooooooo close now!!! Woo hoo! Rakunko Writes: March 4th, 2008 at 2:42 pm the true power of blender…will it be about the same length as the orange project? JB Reefer Writes: March 4th, 2008 at 3:16 pm It seems like you started this so long ago, and you’ve done so much great stuff in the last few months. BTW Any word of what Durian is gonna be? AstralPancakes Writes: March 4th, 2008 at 3:50 pm Durian will be Ton Roosendaal goes Jerry Bruckheimer. “No story, only explosions, fighting” :) Check the interview at http://www.blendernation.com/2008/02/03/peach-interviews-ton-roosendaal/ Sven von Brand Writes: March 4th, 2008 at 7:32 pm That’s great, can’t wait for the premier What will happen with those who bought the movie? when should they expect it to arrive, anyone bought ED? Elubie Writes: March 4th, 2008 at 8:37 pm Wohooo! Ticket ordered! Good luck peach team for your final month! Olle Jonsson Writes: March 4th, 2008 at 9:07 pm Hopefully i can gather some money to finally go to Amsterdam, For that big day :) LoMac Writes: March 4th, 2008 at 9:11 pm That’s cool that it’s on film. Was Elephants Dream ever put on film? oxiigen Writes: March 5th, 2008 at 1:46 am Yea, Great!! Congratulations Guys!! Upper Big Bold Banner is also Cool, & Changing! Nuntius Writes: March 5th, 2008 at 10:09 am Neat, it’s being released on my birthday! For those of us not able to go to the Netherlands, when will it be available online? JoOngle Writes: March 5th, 2008 at 11:29 am A pity its on a workday …if it was a weekend I´d be coming over too! Oh well – maybe next time. Have a good party! I really look forward to see the “fruits” of your hairy labour ;) Carsten Writes: March 5th, 2008 at 3:30 pm Did the “peachers” ever said a word about when the DVD will be shipped? I don´t see a thing about it in the Timeline… and i can´t wait to get the Disc.. your mom Writes: March 6th, 2008 at 2:45 am is this film going to be in 3B ? ok that was bad….. Morrris Writes: March 6th, 2008 at 9:20 am What about subtitles and translation? I did spanish subtitles for elephants dream and was hoping to be able to do them for peach. I know that’s a DVD feature, not the actual movie, but what’s up? In ED the translators were working on it BEFORE the premier. Does anybody know? Sago Writes: March 6th, 2008 at 10:43 am Hi all, if everything goes well, we hope to ship the DVD half of May. This would mean we can put it online end of May. But for now we can’t be sure. @Morris, the movie has no dialog. If the DVD needs translation for the menu’s e.g. is something we’ll look at when we start working on it. @your mom, do you… ah, forget it… Ben Writes: March 6th, 2008 at 11:48 am No dialogue eh? That actually sounds more interesting to me. Keen to see how it all pans out, once I get the dvd in Australia of course. Best of luck to all! Martin Writes: March 6th, 2008 at 1:53 pm Does anyone from Germany plan to attend the Premiere? wayne Writes: March 6th, 2008 at 4:37 pm wow… going to be awesome!!! if i had an exuberant amount of spare money i’d fly out to see it… alas, i dont :( JoOngle Writes: March 6th, 2008 at 6:51 pm I can´t get this tune out of my head. Bunny Bunny Bummy, Bunny Bunny… Must be funny.. In a bunny world. (*ABBA tune..money money money..) Mr. Heads Writes: March 6th, 2008 at 7:50 pm Very Funny!!!I will get to the DVD because I Will not go to Germany jaja I m from Ecuador Superkoop Writes: March 6th, 2008 at 7:55 pm Oh what a shame I live so far away, and that I am but a poor student with no money. :'[ Oh well, I guess I will just have to wait until end of May, and it’s exciting to see that the premiere is coming up! ^_^ NathanKP Writes: March 6th, 2008 at 8:08 pm Wow, can’t wait to see the movie. Too bad I live across the Atlantic…. NathanKP – The Ink Weaver Collection – Writing Showcase Blog Zimbloggy Writes: March 7th, 2008 at 5:45 am good… but i have to wait a whole month? darn… Kurt Writes: March 7th, 2008 at 12:47 pm When will we get to see the trailer? Morris Writes: March 8th, 2008 at 7:45 pm What?!! no Call for subtitles, no Call for Textures, no …. so I guess the community just sits around and twiddles their fingers this time :P What can we do? (already ordered DVD of course) Gianmichele Writes: March 8th, 2008 at 7:57 pm well, the community is helping with the animation. There’s a lot of people from ED and also Pepeland :D Jurriaan Writes: March 11th, 2008 at 10:50 am I’m really curious about the movie. All the stuff looks great and I have been following this blog with a lot of pleasure. Good luck and fun on finishing it! jazzroy (riccardo covino) Writes: March 11th, 2008 at 12:32 pm too sad i won’t be there.. good luck guys!! alan Writes: March 24th, 2008 at 8:00 pm i’m glad with the blender institute..really looks like a family :) ..hope your proyect ends really well.. can’t wait to watch your movie.. luck!!"
