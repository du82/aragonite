title = "Big Buck Bunny  » Blog Archive   » Meanwhile in the studio"
full_description = "« Animation! grooming time! » Dec 11 Meanwhile in the studio Posted in Production by Margreet After being cut off with the internet for almost one and a half day we are finally online again, hoera! While I am writing this I am thinking of the times internet didn’t even exists and now I feel helpless without. What happened. Anyway soon more about all the great work here in the studio :) Or see Nathan animating for a group of course participants :) 18 Responses rogper Writes: December 11th, 2007 at 4:51 pm For me is the opposite, I can only do some work when I disconnect from the net :P Gianmichele Writes: December 11th, 2007 at 5:14 pm what’s the meaning of having an internet for the computer ? I want a DSL plug into my brain :P Auria Writes: December 11th, 2007 at 5:46 pm why a picture of shoes?? 38DD Writes: December 11th, 2007 at 7:06 pm Do the shoes have carrots inside for the horse? rogper Writes: December 11th, 2007 at 7:16 pm They must be from the “group of couse participants” ;) I wonder if Japanese customs apply inside the studio… By the way lovely m&ms character :P terence Writes: December 11th, 2007 at 10:00 pm Japan is not the only country that removes shoes on entering houses. Everyone I knew growing up removed shoes when they came inside and I grew up in Canada (though my parents were from Holland, so I’m not sure if it was a Dutch thing or Canadian) Alexander Ewering Writes: December 11th, 2007 at 10:06 pm It’s just a sign of courtesy when you remove shoes when entering someone else’s house, because you actively free them from cleaning work. Just that not many people are polite or have sufficiently developed common sense or sensitivity to detect that :) (wow, what an on-topic post) – usually, those are the same who build bathrooms for EUR 90.000 and cut off halves of trees with chainsaws along a perfectly straight plane. horace Writes: December 11th, 2007 at 11:35 pm most of the times my socks are dirtier than my shoes. :p Frankie Biscuit Writes: December 12th, 2007 at 2:46 am Woah, how did this turn into a conversation about shoes?! lol What I wanna know is what does ‘hoera’ mean, where does it come from and how do you pronounce it? I hope it means Yay! Because then I can retire Huzzah! We’ve had a nice run but it’s time for a change me thinks. Egan Writes: December 12th, 2007 at 5:42 am Frankie Biscuit wrote: What I wanna know is what does ‘hoera’ mean, where does it come from and how do you pronounce it? I think that that is hoorah! spelled out phonetically (but dutch). Lamoot Writes: December 12th, 2007 at 8:15 am I love the smell of shoes in the morning. The smell, you know that inspiring smell, the whole studio. Smells like… victory. AniCator Writes: December 12th, 2007 at 8:41 am Eh… How do you pronounce ‘Hoera’ in english. Sorry. I can only say it. Something like ‘hooah’ only with an ‘r’ placed between the last ‘o’ and before the ‘a’. So it’s actually just like ‘hoorah’ it only sounds different. ‘Hoo-rah’. Something like that. Try this: http://mirror.anicator.com/hoera.mp3 Kirado Writes: December 12th, 2007 at 9:37 am @anicator.. well being dutch they probally roll there r’s.. and “oe” is pronounced, “ooo” kinda like pooh but without the “P”, ;-) so its probally.. hooo-rrrah .. but spoken much faster.. the hard part for Enlglish speakers is to learn how to roll your R’s.. just taint natural for us ;-) Sago Writes: December 12th, 2007 at 10:20 am Some people here in the studio walk on their socks. I walk on my slippers, since I almost live here. Anthoni_C Writes: December 12th, 2007 at 2:58 pm How did yall go from shoes to a word never mind, I know… humble Writes: December 12th, 2007 at 4:54 pm HEY! I have seen your fur post and now it’s gone after reloading! Give it back! ;) margreet Writes: December 12th, 2007 at 4:55 pm @anicator your pronouncation is perfect! hoera;) piet Writes: December 15th, 2007 at 12:33 pm Did sinterklaas stuff these with chocolate letters? The man must have been wearing a nosepeg! ;)"
