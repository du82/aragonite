full_description = '« Our First Film print! Dolby mastering » Mar 31 We’re (sort of) Done! Posted in Production by Nathan The Peach Team just had a too-long meeting where we reviewed our final edit of the movie. And guess what? It’s done! Well… basically. We still need to do the credits, and a few final renders are still processing. But “Big Buck Bunny” is essentially done. Yayz! Now it’s time to move on to the DVD work. We have an ambitious set of extras planned. At least, they seem ambitious from this side of the fence. But I want to be all mysterious and whatnot, so I’m not going to tell you what they are. Bwa ha ha. But I think everyone will be pleased. Wish us luck! 54 Responses maybeapreacher Writes: March 31st, 2008 at 4:23 pm woohoo, first one :-) anyway: Great work Nathan and all the other blender-heads!! You will get the rest done, I trust in you!! Pierre Writes: March 31st, 2008 at 4:25 pm Great work… guys Jos Writes: March 31st, 2008 at 4:29 pm Excellent news guys! I’m sure the movie/dvd will be a hit! jim ww Writes: March 31st, 2008 at 4:30 pm awesome! i am so proud of you all, i am really anticipating the final piece, and all of the pieces too! woo-hoo! now shake off that tingly feeling of relief, and get back to work! ; ) blood Writes: March 31st, 2008 at 4:35 pm wohooo!! congratulation guys! Gianmichele Writes: March 31st, 2008 at 4:45 pm Man this is just wonderful. Can’t wait to put my hands on the bunny eheheh it will be fun to animate :P rogper Writes: March 31st, 2008 at 4:47 pm ^_^ This time no last day stress, ha! Congratulations! Mal Writes: March 31st, 2008 at 4:56 pm Nice one – I think BBB is going to really put Blender on the map for a lot of artists who previously might have snubbed their noses at it! Hopefully the major pressure will be lifted from you all, and you’ll be able to enjoy stuff like the extras / tutorials / releasing the last pre-2.5 BBB-branded version of Blender! Blender rocks!!! Mal Vincent Writes: March 31st, 2008 at 5:05 pm Good luck :) MrNoodle Writes: March 31st, 2008 at 5:15 pm Congratulations! X-Pilot Writes: March 31st, 2008 at 5:23 pm Great work! Good luck! :) cd38 Writes: March 31st, 2008 at 5:58 pm Congratulations Peach team. Chris Sullins Writes: March 31st, 2008 at 6:31 pm Oooh, does each DVD come with a keepsake fingernail or lock of hair from one of the developers? (Collect all eight, including a rare bone fragment from Ton’s sternum!) Can’t wait for the Premiere. Elubie Writes: March 31st, 2008 at 6:46 pm Congratulations and many thanks for the hard work on the movie! Now I really can’t wait till the premiere, see you there! andy Writes: March 31st, 2008 at 7:05 pm huh? we’re done? Christiaan "AniCator" Bakker Writes: March 31st, 2008 at 7:58 pm Hahaha! Nice joke @ndy….. you must have worked too many hours.. sleep a bit and watch some jacky chan movies you’ll notice it’s done. because you’ll be able to watch the complete movies instead of only a little slice of them. Regina Goralczyk Writes: March 31st, 2008 at 8:02 pm Hallo, I congratulate to all of you!! Do you know that it´s Andy´s 23rd Birthday today? I hope you had time for a little celebration or party… Best wishes Andy´s Mom JiriH Writes: March 31st, 2008 at 8:53 pm This is great news. Congratulation guys! Have a loooong rest you deserve it! (Nathan if you will have more time now I remember your word given in BlenderArtist forum concerning Spline IK help to Aligorith as well as Squash&Stretch Ball rig :-)))))) blenderuser Writes: March 31st, 2008 at 9:00 pm Great! When the DVD will be out? Danny Writes: March 31st, 2008 at 9:11 pm Congratulations, Peach Team! I can’t hardly wait to see the movie, the dvd and the extras. And Andy.. HAPPY BIRTHDAY! shamus Writes: March 31st, 2008 at 9:19 pm congrats. I am excited for you guys and can’t wait to see the movie. RedBirdiii Writes: March 31st, 2008 at 9:34 pm Well done! and happy birthday Andy.. Superkoop Writes: March 31st, 2008 at 9:49 pm Oh now this is getting really exciting! I can’t wait to get my hands on those models, playing with them and maybe do some compositing pictures with me and the animals. Play around, give me something to do. =P And, HAPPY BIRTHDAY ANDY!!!!!!!!!!!!!!!!!!!!!!!!!!! Richard Writes: March 31st, 2008 at 9:55 pm Can’t wait to see it. Also, happy birthday Andy. Jonn Writes: March 31st, 2008 at 10:11 pm I bought the DVD back in Early Dec. it has been a long wait, mainly because I want it so bad. A watched pot never bowls. Anyhow Great work! I loved the trailer! rogper Writes: March 31st, 2008 at 10:46 pm “…a few final renders are still processing” That’s Andy Job, right :P Happy Birthday Andy! thoro (Thorsten Schlüter) Writes: March 31st, 2008 at 11:09 pm Congratulations, that’s good news – can’t wait to see it. Happy birthday, andy! Linkeltje Writes: March 31st, 2008 at 11:12 pm Congratulations!!! Can’t wait for it! O man, I adore the colors in the banner of this website. cd38 Writes: March 31st, 2008 at 11:13 pm omg @ndy’s mom is here! Welcome! [slicks back hair, sits up straight] rubicon Writes: March 31st, 2008 at 11:16 pm Yessss…. @andy: herzlichen Glühstrumpf zum Purzeltag. Das Badnerland erwartet Dich. Bmud Writes: March 31st, 2008 at 11:21 pm I see the future… “Mail, mail mail. I like mail. Let’s see what’s in the maaaaa–AHHHH! OHMYGAWPEACHBLENDERBUNNYMOVIEINTHEMAILBOX !!” and then I don’t remember what happened after that. I think i ran around in circles, hit my head on the mailbox, and passed out. So I wish I could tell you all how the movie went, but you know… accidents happen. Fredrik Writes: March 31st, 2008 at 11:54 pm Wohoo! I’m really looking forward to watch your creation :D Well done everyone, and good luck! Happy birthday to you, Andy! John Drinkwater Writes: April 1st, 2008 at 12:35 am I heard you guys don’t need localisers for the subs as there is no speech in the film… but do you need a hand translating for the DVD/Blu-ray discs? (EN-GB fan here ;)) RH2 Writes: April 1st, 2008 at 12:38 am I’m sure the movie is going to be simply awesome. 1. characters -awesome 2. environment -awesome 3. story -awesome 4. extras -awesome 5. new features-awesome But isn’t a movie over 10 minutes? Project Peach and Orange are nothing but Amazing, Awesome, High quality short productions. Hopefully in the future the blender institute will sponsor a movie longer than an hour. I can’t wait to see your effort on film. Ben Writes: April 1st, 2008 at 1:54 am I’d buy you all a hard earned beer, but I’m living halfway around the globe. Just use the preorder money for a dvd set to pay for a round! Congrats all of you! jonny Writes: April 1st, 2008 at 3:04 am Perhaps second tiny preview for us ():-) ? PLEAZ! It hasn’t to be cut like the trailer. Just a scene or a picture, or, or, …! I’m dying to see more! oddway Writes: April 1st, 2008 at 7:05 am Looking forward to getting my copy in the mail. The next project should be completely open source, including the subject/script. Like perhaps holding a script competition as well? Just an idea! Nathan Letwory Writes: April 1st, 2008 at 8:11 am @ Nathan: stop using my name. It’s confusing Cathy & India Writes: April 1st, 2008 at 9:25 am A big happy birthday (slightly belated) to our friend Andy! And congrats on finishing everyone – can’t wait to see it. Miss you all. LOGAN Writes: April 1st, 2008 at 9:59 am OMG, are they not just pulling our leg??? I bet the DVD extra’s include easter eggs like jumping people in bunny suits, the happy blender movie and a special making off hosted by that BlenderNation.com guy :P randomnut Writes: April 1st, 2008 at 1:11 pm You won’t know until you get it. Only they know what’s on it. But it’ll probably be awesome. rolf Writes: April 1st, 2008 at 1:55 pm April fools? rogper Writes: April 1st, 2008 at 2:46 pm @ rolf: Posted on 31-03-2008 ^_~ RNS Writes: April 1st, 2008 at 3:01 pm I hope a mayor studio pick this films up and add to their preview films run in theater or in DVD.Seeing the big buck bunny trailer made me feel like a kid again.thank you all wonderful blender artist and especially Ton. Timm Writes: April 1st, 2008 at 6:17 pm I want a video of Nathan disguised as a Big Buck Bunny in the extras section Gheekaru Writes: April 1st, 2008 at 7:47 pm April fool! BBB will be finished in march 2010! It’s written in the video were the name(Gnah, one more april fool) is revealed! Olaf Writes: April 1st, 2008 at 9:51 pm Congratulations guys! Hoping that you can get the DVD finished soon so we can enjoy it and you guys can get some decent shut-eye. Sam Allen Writes: April 2nd, 2008 at 3:15 pm The movie is finally complete (sort of) that’s fantastic news. bunny_fan Writes: April 2nd, 2008 at 5:20 pm Great to hear the movie’s done. Can’t wait to see it. Sympodius Writes: April 2nd, 2008 at 5:41 pm Well done everyone! Sven von Brand Writes: April 2nd, 2008 at 6:16 pm Good luck with everything, I’m looking forward on receiving my DVD ^^ And as far as I have seen, Increideble work!! flopast Writes: April 2nd, 2008 at 9:30 pm Please, if you could subtitle the bonus, because on the dvd of Elephant Dream, the making of was’nt subtitled and it was very difficult for the french who don’t speak english to undurstend it Joris Writes: April 3rd, 2008 at 1:01 pm Great news guys! To bad I couldn’t see the final result! I hope I see it soon! Gratz, Joris dusty Writes: April 3rd, 2008 at 7:58 pm Well done guys!!!! Can’t wait to see the finished result!!!'
