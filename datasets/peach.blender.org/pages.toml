["https://peach.blender.org/2008/06"]
title = "Big Buck Bunny   » 2008 » June"
full_description = "Jun 26 Singapore, CGOverdrive and 3dsense Posted in Events, Random Fluff by Sacha Thursday, June 26th, 2008 How 1 week in Singapore can change one’s ideas, goals and direction in life… It was June 15 I took a 12 hour flight to Singapore, to attend CGOverdrive 2008 as keynote speaker and representer of BBB and Blender. And I can say that my first trip to Asia is one that will be hard to forget. (more…) Posted in Events, Random Fluff | 21 Comments » Jun 25 Blu-ray version! Posted in Blender Institute, Production by Ton Wednesday, June 25th, 2008 News from Germany: authoring company Imagion completed work on the Blu-ray version of Big Buck Bunny! They’ve created a stunning HDTV (1080p 24fps) version of our movie based on the original HDR frames of the movie. The master has been sent to the factory for duplication last friday. This will take about 4 weeks, so we expect the discs here end of july. Visit the Blender e-shop to purchase a copy! Although it’s a closed format still, Blu-ray is most likely going to be the HDTV film disc format of the next decade. So, even when it was only for archiving reasons, it’s important to have BBB on this format available as well. Not to mention that the HD version of BBB is simply breathtaking to watch. As bonus, apart from the extras copied from the video dvd, Imagion agreed to add Elephants Dream on the disc as well! -Ton- Posted in Blender Institute, Production | 25 Comments » Jun 21 The wedding day of Enrico and Micaela Posted in Random Fluff by Margreet Saturday, June 21st, 2008 The whole Peach team wishes Enrico and Micaela all the best for today, because they are getting married! Have a beautiful day and of course lot’s of love for the future. Congratulazioni, tutta la fortuna per il futuro! Posted in Random Fluff | 21 Comments » Jun 19 The Making of “Big Buck Bunny”: An Open-Source Evolution on Siggraph ’08 Posted in Events by Margreet Thursday, June 19th, 2008 The Making of “Big Buck Bunny”: An Open-Source Evolution Wednesday, 13 August, 8:30 – 10:15 am Petree Hall C In May 2008, the Blender Foundation released their second open-movie project: “Big Buck Bunny,” a funny and furry 3D short about a giant rabbit who gets even with bullying rodents. This session brings together the key people who created the movie and presents all the aspects of an open-source and open-content-based animation studio, and how this affects the creative process. The panelists showcase project files from the studio, and even recreate parts of the film on demand! This 90 minute session starts with a screening the 10-minute film and ends with a 15-minute Q&A with the audience. http://www.siggraph.org/s2008/attendees/caf/caftalks/index.php Posted in Events | 6 Comments » Jun 19 Linux Pro Italian magazine Posted in Events, Media Gallery by Margreet Thursday, June 19th, 2008 An article about Blender and the making of BBB of 8 pages has been printed in the June issue of Linux Pro Italian magazine, with short (boxes) interviews with Enrico, Sacha and Andy. (more…) Posted in Events, Media Gallery | 8 Comments » Jun 11 BBB awarded by Cyborg FF Posted in Events by Margreet Wednesday, June 11th, 2008 Big Buck Bunny has been awarded for a ‘special mention’ from the jury of Cyborg FilmFestival within the section animation. BIG BUCK BUNNY of SACHA GOEDEGEBURE The Netherlands 2008 “Such mention, intends to underline the great ability with which has been completed the creation of characters animate of the work and their character animation able to absolutely return an expressiveness worthy of products commercial high-level, and such mention, wants besides, to be the occasion to underline the important value of a software 3D as Blender, with which the work has entirely been realized, and that it opens a ‘important reflection on the value of the open source and of the free software in the professional and commercial world.” thus Luisella Chiribini http://www.cyborgproduzioni.org/ Posted in Events | 15 Comments » Jun 07 Half a million streams, 400k downloads… Posted in Random Fluff by Ton Saturday, June 7th, 2008 Here’s stats from the past week: Vimeo: 300,000 Youtube 215,000 Downloads: Waag.org torrents: 102,000 Sun Microsystems network.com: 120,000 (estimate, reported 29 TB traffic) Sketchworkproductions.com: 125,000 video.blendertestbuilds.de: 55,000 Grand total: 917,000! Pretty good numbers. Without counting all the other mirrors, iso dowloads, our own dvds, and assuming more people watch a single download, we can safely estimate that over a million people have seen BBB now! -Ton- (Note; I did not include the italian mirror, which is most likely between 50 and 100k too. Waiting for their confirmation.) Posted in Random Fluff | 50 Comments » Jun 06 Complete Score Available for Download Posted in Media Gallery, Production by Jan Friday, June 6th, 2008 Wheee, my first blog post. Sorry that I’m late to the party :) The complete score is now online for your listening pleasure. It consists of 10 tracks, including the bits I did for the DVD menus, and is available both in MP3 and high-quality Ogg Vorbis formats. Grab it while it’s hot: MP3, ~192 kbps VBR, 16.2 MB ZIP Ogg Vorbis, ~224 kbps, 17.8 MB ZIP The isolated score is distributed under the terms of the Creative Commons Attribution-Noncommercial-NoDerivativeWorks 3.0 license. Thanks to Andy for the neat cover image. Enjoy! Posted in Media Gallery, Production | 55 Comments »"
