full_description = '« BBB Premiere Trailer! » Mar 12 The Happy Blender Institute Tour Posted in Blender Institute, Production, Random Fluff by andy Recently I realized that we never really made a complete Blender Institute tour after this project started. Sure, there was Ton’s first round trip waaaay back, but we needed something new, shiny and classy like this to show you how great this place actually is! Luckily Nathan, our master of rigging, animating and hugging, agreed to improvise a very sincere and pertinent guided VIP tour through the marvels of our beloved work- and living- space. Welcome to the Blender Institute! Ogg file 75 Responses JiriH Writes: March 12th, 2008 at 10:36 pm Really funny. Happy people make happy product :-))) This made my day (although it is already evening. Nathan is really cool guy!!! voOdKa Writes: March 12th, 2008 at 10:41 pm xD Merci pour la visite boiteu Writes: March 12th, 2008 at 10:44 pm Really funny!!! Thank you nathan!! Fredrik Writes: March 12th, 2008 at 11:06 pm Hilarious! :’) Nathan Writes: March 12th, 2008 at 11:21 pm Hey hey! Don’t forget Andy, who masterfully filmed and edited this! shirokoff Writes: March 12th, 2008 at 11:36 pm i’m sooo happy i’ve watched that video =) dusty Writes: March 12th, 2008 at 11:47 pm Hehehe, very funny! Well done Nathan and Andy. devspoon Writes: March 12th, 2008 at 11:53 pm oh :D this is amazing :D rogper Writes: March 13th, 2008 at 12:01 am My best Wednesday night… Ever :D Who cares about that thing called PIXAR, I didn’t see there a Italian expresso machine :P Excelente performance Nathan and excelente work Andy! Vincent Writes: March 13th, 2008 at 12:36 am This really is extremely funny :) “Also known as eppell-juice… -sep” Lovely piece of geek humour, especially the ending was great, and the super-spontaneous laughter when reading the book. Damn, I laughed out loud from behind my computer, that doesn’t happen often :) SoulVector Writes: March 13th, 2008 at 12:48 am Hehe :) Funny stuff.. Happy is happyness :) Sander Wit Writes: March 13th, 2008 at 12:57 am Thanks you guys, it really makes lot a happier and realistic impression than our first tour through your wonderful Blender Institute :) And I more and more realize of the foolishness I have committed when I visited the institute: not hugging Nathan… Sacha tried to warn me but I did not listen. I’m truly sorry Nathan. All the love and happiness is hereby wished from me to you. Sander :) PS best luck with all the work done on this project! Sander Wit Writes: March 13th, 2008 at 1:06 am Geez Sacha, I just notice you haven’t moved one inch since my last visit! Are you sure they are letting you out of that building now and than? Net nog operatie gehad aan keel, niets wilds, maar wel een verliefdheid opgelopen dat heeft geresulteerd in een relatie! Houd dus vol, er is hoop! Het beste ermee! Sago Writes: March 13th, 2008 at 1:15 am That’s great news, Sander! And thanks for sharing this with the entire world!! BlendRoid Writes: March 13th, 2008 at 2:17 am That was so funny! “Also known as ap-pel-juice…sep… in Dutch!” Genious. :) I also really cracked up about… everything else. You guys are my heroes. If I ever get to work there, I hope I work with the spiritual successors of the Peach team! (you’ll all be working at PIXAR by then, I’m sure) JoOngle Writes: March 13th, 2008 at 2:35 am Waiter… “I´ll have what he´s having” Cristo Writes: March 13th, 2008 at 5:57 am Hehe….very good, Nathan. I like the “Shut the F*** Up” room…very funny… madman Writes: March 13th, 2008 at 6:54 am Nathan looks like the Big Buck Bunny. It’s a shame… you forgot to present the blender of the kitchen. lumpycow Writes: March 13th, 2008 at 9:14 am This made me happy… now time for bed… oxben Writes: March 13th, 2008 at 10:33 am Absolutely fabulous! I’m wondering if Nathan is always so full of energy. It should be exhausting to work with him. :) Nathan, what kind of vitamins do you eat at breakfast? :) vagelis Writes: March 13th, 2008 at 11:22 am “This reminds us of how much we suck” Haha Gianmichele Writes: March 13th, 2008 at 11:25 am eheh…well at Pixar there are a lot of italian cookers :P Anthoni_C Writes: March 13th, 2008 at 1:54 pm Nathan might as well work for Blender. Feel Writes: March 13th, 2008 at 2:23 pm good to see hard-workers ….. in blender Institute XD cd38 Writes: March 13th, 2008 at 3:53 pm What a riot! I’m glad at least one of the team is having fun, or losing his mind. Christiaan "AniCator" Bakker Writes: March 13th, 2008 at 4:02 pm Who wants a .GIF of Nathan? http://mirror.anicator.com/nathan_funny.gif Fury_jin Writes: March 13th, 2008 at 4:29 pm The Peach team had found the true happiness answer. Tomorrow i’ll try to hug a big buck bunny. Maybe the first step be happy! Thx all the peach team! Pitel Writes: March 13th, 2008 at 5:38 pm Drugs are wrong, m’kay. :D pKrime Writes: March 13th, 2008 at 7:20 pm Forget BBB: I want to see “Nathan, the Movie”! Christiaan "AniCator" Bakker Writes: March 13th, 2008 at 8:23 pm Nathan! I hope I’ll meet you again, the next Blender Conference. You are inspiring. Roemer Writes: March 13th, 2008 at 8:33 pm I am so HAPPY to see you Nathan. I feel even over here the happiness. Happy greetings from The happy Hague Roemer and happy mother Christiaan "AniCator" Bakker Writes: March 13th, 2008 at 9:26 pm Nathan I looooove you!! Mark Keller Writes: March 13th, 2008 at 10:30 pm Wow, that was great. I don’t think I’ve laughed so hard all week! And AniCator – that GIF is great! Loops seamlessly! Man, I love you guys. :-) static float Writes: March 14th, 2008 at 4:57 am lol, that was hilarious. Great job, Nathan, Andy….. Keep up the good work! :D Dread Knight Writes: March 14th, 2008 at 10:10 am What are you smoking? xD Marco Writes: March 14th, 2008 at 12:10 pm Hilarious! I want a movie with Nathan as the main actor star! :D Clint Writes: March 14th, 2008 at 4:52 pm Hilarious — thanks Nathan et all! Pablo Lizardo Writes: March 14th, 2008 at 7:25 pm :D jejejej! really fun tour! thanks nathan!!! ColeZero Writes: March 14th, 2008 at 7:29 pm hahaha that was hilarious…thank you for this, both of you. You make me smile. You brought the sun on a cloudy day. steffen Writes: March 14th, 2008 at 8:28 pm is there something in the water that keeps Nathan so happy :D Tobi Writes: March 14th, 2008 at 8:30 pm Can we purchase those body parts from the e-shop? I would love to own a little piece of a very very happy person! Bmud Writes: March 14th, 2008 at 9:17 pm HEY! I read those books too. I laughed soooo hard at siggraph proceedings 2003. You guys should check out “Flight”, and yeah I’m actually not kidding about that. Dave Writes: March 14th, 2008 at 9:57 pm haha. the shut the #^@* up room. priceless. jaysan Writes: March 14th, 2008 at 10:35 pm hello congratulations for this extra realistic documentary!! this is soooo real :D it’s really a mine of inspiration David Writes: March 15th, 2008 at 3:18 am Funny!!! Hey, the Peach project is very good… great work… Trawler Writes: March 15th, 2008 at 4:32 am “Oppression and happiness: not necessarily mutually exclusive.” ‘Bout peed in my pants on that one. Dear God, that’s funny!! Omar Modesto Writes: March 15th, 2008 at 4:58 am That was a very fun tour. I’m happy that the people at the Blender Institute are kept happy so that the happy work they do gives happy results to keep the viewers happy. …so, do they, uh…really lock people inside the e-Shop room for days?! Can’t be too fun to be in there with the boxed body parts ;P Keep up the great work, guys. Napalm Writes: March 15th, 2008 at 7:07 am YOUR ENTHUSIASM MAKES KITTY SCARED!!! Happy Boy Writes: March 15th, 2008 at 8:27 am That’s good stuff. Sam Allen Writes: March 15th, 2008 at 3:22 pm Ha! That made my day. Thank you Nathan, Andy and the Blender team! I can’t say any more than that. Really. Except _maybe_ these clips would be an excellent addition as “Bonus Features” for the DVD. Superkoop Writes: March 15th, 2008 at 10:35 pm So was Nathan one of those locked in the e-shop? I’d probably be kinda strange after being locked up in a room with dead bodies too! Jairo Molina Writes: March 16th, 2008 at 6:00 am LOL, so you keep woman around for… happiness :) Thanks for visiting the Institute Andy. Obrigado! Ian Writes: March 17th, 2008 at 7:05 am Nathan has just become my favorite person on the planet. Nathan Writes: March 17th, 2008 at 12:46 pm OMG! I’m Ian’s favorite person on the planet! @_@ The guy who made SBFP!!!!!!!! AHHHHH!!!!! I love you Ian! Ian Writes: March 18th, 2008 at 11:50 am You saw SBFP!? That totally makes my day! I love you too, Nathan! Yay! Alexander Ewering Writes: March 18th, 2008 at 2:22 pm Heh… after watching this video, I think you can stop working altogether because I seriously doubt that Big Buck Bunny can get any better than this ;) Anthoni_C Writes: March 18th, 2008 at 11:00 pm Yall should keep a marijuana plant in the kitchen and be like “It especially keeps us happy.” :P Jamil Writes: March 19th, 2008 at 3:49 am Hi: I am very happy to see such a nice production coming out of such a small yet creative group. I would love it if you take a look at my senior thesis and help with any feed back. Best of luck. http://webspace.ringling.edu/~jlahham/access/jlahham.mov edi Writes: March 19th, 2008 at 12:07 pm thx for the intro! maybe you should go into sales and marketing ;-) lohborn Writes: March 19th, 2008 at 7:46 pm I showed my friend and his first words were, “Oh, is that the trailer for the new pixar movie?” lohborn Writes: March 19th, 2008 at 7:47 pm ^meant to go on the trailer post Austin Writes: March 20th, 2008 at 7:52 am Lawwwwwwwwwwwwl Nathan, what’s up man. I thought you were up there working, not ****ing around! Some dude Writes: April 2nd, 2008 at 4:50 am Ha ha, hee hee and ho ho! Awesome movie. Could be that my senses are dull and that I overlooked something, but the mention to the blade of grass made me (coincidentally) think of Bethesda. Ahh, those lovable idiots are about to butcher the Fallout series by meddling with it’s already-epic format. But, as we all know, blades of grass are VERY important. Why not whip up a game? Let’s call it Annihilation. The gameplay will horribly suck and will be bearable for a maximum of a week, but we’ll be sure to stuff it so full of eye candy that people will be too dazzled to care. No two blades of grass shall be the same! Bitching aside :) Great movie. Happy workers make happy products, ha ha! sxpert Writes: April 5th, 2008 at 8:25 am hilarious presentation ! dirkus Writes: April 5th, 2008 at 6:17 pm LoL that was quality … i now feel happy inside pindabrein Writes: May 26th, 2008 at 8:08 pm Nathan, je bent mijn held! You own dude! you guys are my heroes, if i ever get good enough, i’ll come to Amsterdam! Great work with your project (read an article about it in the Volkskrant, from thursday 22 of may, in case you guys like to look at that sort of stuff and don’t have it already.) Too long, sorry, i’m off Laterz~ XenosRDrake Writes: July 5th, 2008 at 9:52 am umm… nathan? are you on crack? because you’re OVER happy. but anyway, PIXAR is nothing compared to you guys. you’re all really HAPPY! and you use blender. that’s a plus. and you work at the blender institute. Are we (the “currently sucks at using blender” people) allowed to come visit? maybe i’ll try to get to amsterdam soon. i’m in the U.S.A., so It’s kinda far. i’ll check the calender. KFF Writes: November 1st, 2008 at 3:48 pm hahaah really cool!!! nathan is so funny. is he working in the blender institute now as a developer or did he his job from bbb?'
