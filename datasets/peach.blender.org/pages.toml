title = "Big Buck Bunny  » Blog Archive   » Studio tour #2"
full_description = "« Storyboarding! First glimpse of the animatic! » Oct 22 Studio tour #2 Posted in Production, Random Fluff by Ton Since everyone here is too busy (read lame!) to write blog stories, here’s a quick view of the studio as how I found it this sunny afternoon. I used Campbells camera, which had battery power, unlike mine, but unfortunately had no sound and no memory left on the card just when I approached Campbell… the cool trees stuff on his screen is for next time. Everyone in the studio said “hi” btw! And they all promised to post something here very soon. This week! -Ton- 30 Responses Sago Writes: October 22nd, 2007 at 7:33 pm “Everyone in the studio said “hi” btw!” No, we didn’t. “And they all promised to post something here very soon. This week!” No, we didn’t. ton Writes: October 22nd, 2007 at 7:40 pm Great, one person did now! basse Writes: October 22nd, 2007 at 7:54 pm :) evilgo. .b Richard Writes: October 22nd, 2007 at 9:07 pm Who or what smashed the glass on the door to the main room? FuzzMaster Writes: October 23rd, 2007 at 5:36 am make me proud Big Fan Writes: October 23rd, 2007 at 7:40 am thanks for the fast tour Big Ton. I think you need a reporter/publicist there. We all get bored waiting for wonderful entertaining speeches and progress reports from dead ball artistes and go away.. Gianmichele Writes: October 23rd, 2007 at 11:12 am this blog is owning me completely…eheheh! WOW Enrico how many drawings are there ? BTW just saw a special on pixar shorts, and they started just like all of you…GREAT! Felix_Kütt Writes: October 23rd, 2007 at 11:22 am bah! videos are better anyway! no need to waste your time typing too much, just grab a camera and film! :D Fury_jin Writes: October 23rd, 2007 at 11:38 am It’s a nice view of the world of animation. Thanks Ton for this tour! I’m curious about the hardware you use. CPU/GPU/RAM/OS ect… Igor Writes: October 23rd, 2007 at 1:24 pm Coool!! I hope we will be able to see all those amazing sketches and storyboards on DVD too! Good luck guys! margreet Writes: October 23rd, 2007 at 1:32 pm Yeah I think that’s the idea! campbell barton Writes: October 23rd, 2007 at 1:35 pm Computers are about 3ghz, 4gig ram. nvidia 8800 gts, Using ubuntu gutsy with gnome except for cessen who uses xfce. I develop with gedit & kdevelop and eclipse on my laptop. brecht uses vim (a mans text editor)… Documented the setup here http://wiki.blender.org/index.php/User:Ideasman42#Peach_System_Setup campbell barton Writes: October 23rd, 2007 at 1:37 pm PS, we have a mix of 2 and 4 cores, some new 8 core PC’s coming, we’ll try to make blender multithread better! Roksvamp Writes: October 23rd, 2007 at 3:29 pm Do you mostly use PCs or Macs? I saw an apple monitor in the last blog but I’m only seing PCs in the videos. =P samarthurallen Writes: October 23rd, 2007 at 4:18 pm FOCL @ cessen using Xfce (smart move) and thanks for the updates on the project! Alexander Ewering Writes: October 23rd, 2007 at 5:15 pm Hmmm, what’s the difference between “Random Fluff” and “Uncategorized”? Alexander Ewering Writes: October 23rd, 2007 at 5:15 pm BTW, it would be helpful if someone could add a .focus() to the captcha’s textfield :) Tweaking Knobs Writes: October 24th, 2007 at 12:42 am Men i cant wait to see some animation tests or something , i’ll buy the dvd when i get some money. Keep on blenging ! shirokoff Writes: October 24th, 2007 at 7:26 pm wish i could work there with you guys… Lasphere Writes: October 25th, 2007 at 8:44 am Hey thats great Ton! :D Looks like a promising movie :) btw, how to set up blender, so it works with 2 screens? Tobias Writes: October 25th, 2007 at 11:34 am Nice Video but next time please make the Video in an open Format like OGG/Theora. Alexes Writes: October 25th, 2007 at 8:12 pm You use 64bit or 32bit Ubuntu? andy Writes: October 25th, 2007 at 8:55 pm we currently use 64bit Alexes Writes: October 26th, 2007 at 10:08 am Thanks. You use home too Linux OS? Gianmichele Writes: October 26th, 2007 at 2:39 pm Any particular note on using 64 bit ? is that a choice for the amount of geometry to be rendered ? campbell barton Writes: October 26th, 2007 at 4:46 pm We chose 64bit for a few reasons, so we could overcome the 2gig limit per application that 32bit systems have. (each computer has 4gig of ram, some new PC’s will have 8gig I think) The other reason is to validate blender3d on 64bit systems, so other people can be sure blender will work well on their high end workstations. – and so we can find any 64bit bugs and fix them. Sanne Writes: October 27th, 2007 at 1:33 pm Thanks for giving attention to 64bit! As a user of 64bit Kubuntu on an Amd 64 CPU I appreciate this very much. Felgar Writes: October 30th, 2007 at 4:42 pm Why you use Ubuntu distribution, instead of another? cr4ckp0t Writes: November 18th, 2007 at 12:35 am looking verry nice any idea when u guys gonna finish it ?? BTW ton kun je me mss wat tutorials doorsture die me van blender noob naar laat maar zeggen bijna even goed als jullie maakt ik vindt enkel engelse of franse de blendercourse basics heb ik al hellemaal gedaan battery Writes: March 28th, 2008 at 5:52 am Thank you for this outstanding article."
