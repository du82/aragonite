full_description = "« We’re (sort of) Done! Woosh, the deadline passed! Or, how everything that can go wrong does… » Apr 02 Dolby mastering Posted in Media Gallery, Production by Ton We wouldn’t deserve the a score and soundtrack from Jan Morgenstern if we didn’t have at least the 35mm film provided with official Dolby Digital (5.1) sound! Although this isn’t really an “open standard”, it at least does have an obvious quality benefit… not to forget that the only (free) alternative would be simply analog stereo (or in Jan’s words: “it will sound like a crappy 70ies or 80ies movie then”). The process is as follows; – Locate a studio that has an official license to master or mix Dolby Digital. – Contact Dolby Labs and get a contract to have that studio do the mix and mastering – For a short film (10 minutes) the license fee is 300 GBP (600 usd or so) – Only after payment has been received, and contract signed, the studio gets permission to let you in! In Amsterdam there are four officially licensed studios. Those studios need to have a real theatre, complete with all seats, and a mixing table in the middle of the theatre. The concept is simple: mix the sound precisely as you want it to be heard in a cinema. The Dolby playback systems then can acoustically reproduce this experience in every Dolby Digital approved Cinema. So! Yesterday we’ve spent two hours in the studio of Cinemeta Digital, listening with awe to the great soundtrack, and to what a good theatre setup (and editor!) is able to do with your perception of sound. It was also – again – so evident that sound is half the movie, and in our case also half the fun (at least!), the gags and jokes really work so much better. :) Next deadline: tomorrow morning, 10am, all 14400 frames – converted to DPX files – on a portable disk at the Filmmore studio, for conversion (to DPX log) and then being shipped to the Nordisk lab in Norway, where the Cinevator real-time film printer is. 28 Responses oblenob Writes: April 2nd, 2008 at 8:02 pm WOW. surround sound? I have wondered how to do surround sound for my music. and audio things. but that looks amazing I cant wait to hear it on my surround sound system. Pity I shall have to watch on an 800×600 monitor though :P Pablo Lizardo Writes: April 2nd, 2008 at 8:10 pm Hey! excelent news, seems like everything is going to be perfect! i cant wait to my peach dvd arrive to me! (i´m sor far!) saludos a todos! Venom is already there?!! Vincent Writes: April 2nd, 2008 at 8:20 pm Thanks for this post, interesting to read how this works :) voodka2007 Writes: April 2nd, 2008 at 8:53 pm 10 minutes !! :) DIngTo Writes: April 2nd, 2008 at 8:56 pm Hi, thanks for this interesting article. Nice! And many thanks to Jan Morgenstern, he makes a very good job. Klangfreund Writes: April 2nd, 2008 at 9:00 pm A cosine-waveform on the faders (last picture)? You obviously had some fun in there! :) I also once generated a MIDI-stream to make a moving cosine-wave with the faders on a quite big digital audio console -> yeah, its fun ;) But I guess your console was in demo-mode since also all vu-meters show some audio-signal, which is a quite rare event. randomnut Writes: April 2nd, 2008 at 9:21 pm Good luck in the final phases and for the grand opening! Sago Writes: April 2nd, 2008 at 9:57 pm @Klangfreund, the console was indeed in demo-mode. Flickering lights and colors and moving sliders seemed to be the only thing that got Nathan excited and jumping like a little kid on speed. Felix Kütt Writes: April 2nd, 2008 at 10:55 pm looks sweet, cant wait to get the DVD! :) LoMac Writes: April 3rd, 2008 at 12:18 am That’s awesome! I hope my DVD doesn’t melt in the mail.It can get awfully hot here. Superkoop Writes: April 3rd, 2008 at 12:26 am Oh nice! This is going to be so fun to watch and hear. So it shouldn’t only be eyecandy, it should also be earcandy! YAY! ^_^ grafixsuz Writes: April 3rd, 2008 at 4:43 am All I can say is you guys must be absolutely pleased with what you