full_description = "« The Renderfarm (how it works) Noodles and More » Feb 20 Interview with Sacha about the Peach externals Posted in Blender Institute, Production, Random Fluff by Margreet For two days we have Roemer around. For school he has to do a practical assignment to focus on the future and get more information about which direction he wants to go to. And luckily he choose Blender :) He interviewed Sacha about the externals helping out the Peach team to get to movie finished on time. Download the .ogg file here. 15 Responses dusty Writes: February 20th, 2008 at 2:02 pm Good to hear about the exernal artists. dusty Writes: February 20th, 2008 at 2:04 pm Oh and good luck to Roemer wayne Writes: February 20th, 2008 at 2:25 pm good on you Roemer… blender is definetly the future! i’m at an animation college for 3 years and they teach maya but it’s my soul purpose to make sure i can do all the same things in blender as well… Goos Writes: February 20th, 2008 at 2:30 pm Haha Roemer!!! Nice interview!!! And next time you’re one of the external artists??? I understand the atmosphere is great at the Blender institute. Sago Writes: February 20th, 2008 at 2:33 pm At the moment he’s folding invoices…. we make sure he gets the full Blender Institute experience. Maybe we should let him clean the toilets?….. naaah, I already did that last thursday. Goos Writes: February 20th, 2008 at 2:51 pm Whahaha Yes that’s what I was expecting starting at the bottom, cleaning the floor with his toothbrush!!! Your spoiling him!!! RNS Writes: February 20th, 2008 at 4:20 pm I kmow this not the time or place to post this,but follow this link.http://www.tradingmarkets.com/.site/news/Stock%20 News/1106682/ And good interview wish him good luck. RNS Writes: February 20th, 2008 at 4:21 pm oops typo! Odin/Velmont Writes: February 20th, 2008 at 4:38 pm If anybody would like to write down what’s being said (quick and dirty) I’d be very glad. Not much audio around here… :-) Felix Kütt Writes: February 20th, 2008 at 4:43 pm did i hear right? pepeland(as in Mr. Lara) is one of the external contributors?!! O_O O-boy.. i cant wait to see the finished thing.. :) sander wit Writes: February 20th, 2008 at 10:22 pm sacha is quite the story-teller isn’t he.. nice to hear ye got some orange-teammembers back on the job though! good luck with it! Cathy & India Writes: February 21st, 2008 at 1:45 pm Uncle Sacha looks very tired. Take care of yourself… mike Writes: February 21st, 2008 at 7:48 pm Sacha needs to get some sleep! Joel Writes: February 22nd, 2008 at 4:40 pm No way! Daniel martinez lara ?! He’ll be a Great adition to the team =D Pepeland Writes: February 22nd, 2008 at 5:16 pm It´s a really tiny collaboration, make inbetweens in some shots. The peach team in Amsterdam are really working hard, lot of hours per day. They are making a great stuff"
