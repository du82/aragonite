full_description = "« Approximate Ambient Occlusion Lug Radio Interview with Sacha » Jan 13 An Outside Perspective Posted in Production, Random Fluff by Nathan Hello all. A friend of mine, Aaron, from the USA came to visit the Peach project last week. He put together a video and a blog post for all of you: The condensed version of a week in the life of the Peach project: .ogg video file high quality (39.6MB) It’s a couple of months before the premier and there are lots of things to do. Not only the most obvious (finishing final animation) but also finishing scene construction and render preparation so that the first of the finished shots can be shipped off to the render farm. A simple calculation revealed that at the current animation pace the project won’t be finished in time, so four external animators have been found and hopefully with their help the timeline will become reasonable again. It was in the midst of this commotion that I flew over to Amsterdam to visit my good friend Nathan (Cessen) on my Christmas break. The first day I was there the team had their weekly and, due to the pressure they’re under, I agreed to do a blog post this week: an outside perspective on the project. So over the course of the last week I stalked around with Andy’s video camera, looked over people’s shoulders, asked questions, and hung out with the team to put together a picture of where the project is, and what working on peach is like. * * * January in Amsterdam is cold and rainy but even so its citizens put on rain coats and get on their bikes to get across town in the morning. The peach team is no different. At around ten they bike the mile north across canals to the Institute. It’s blender all day six or seven days a week. The blender sequencer is even the video editor of choice here at the institute: from the animatic to documentary films on the blog. They really live and breath Blender here. William, Nathan and Brecht discuss new paradigms for rigging and animation, part of the idea being to define IK chains on the fly during animation [editor’s note: these were far-future discussions, not features for peach]. Ton shows William and Nathan the latest progress on the event refactor. We discussed the far reaching implications of this one the walk home. William talks to Ton about UI inspiration that could be gained from Modo. Lamenting the disorganization of the buttons window. Discussion at lunch or on a break is often centered on how to make Blender more usable. Since they have to work with it so much the Peach team is acutely aware of where working is a struggle against the UI and where it is a breeze. In some ways it’s as if blender is currently reverted to its very origins: in-house software. I’m still amazed how when I asked Nathan if blender had a small feature (jumping between keyframes in the action editor), he said, “No, but I should request that,” and in twenty minutes he said, “Hey Aaron, svn up, it’s ctrl+pgdwn/pgup.” Wow! The turnaround was so quick I was astonished. Apparently Nathan asks for UI changes to the animation tools rather frequently and Aligorith often gets back with the feature in an hour or less, and of course Andy is always requesting nifty new render stuff that Brecht makes and things all of a sudden become very pretty. Blender is changing based on real work experience. They may have a long way to go, but I have to say, it’s looking good. Andy’s environment renders are beautiful (even if he says he can do better), and the animation I’ve seen (from Nathan and William mostly) is looking quite nice. The story is fun, amusing, and clear. It short, I’m excited about the release and look forward to seeing its reception in the community. One thing seems quite clear after spending a week with them in the middle of the animation schedule: Animation is slow. It requires patience to do well. A single shot could take an animator half a day, a full day, or a week depending on the complexity of the shot. Imagine spending sixteen hours on the same 135 frames. Setting the scene, blocking and re-blocking, feedback, overlapping action… it’s a very calculated and technical art. Getting both acting and physics right is hard. Animators try to find creative ways to break up the problem and work in layers, building up complexity bit by bit so at each point they can fit it in their minds. It can get frustrating obsessing over the same five second shot for sixteen hours. This is why Nathan has started working on two or three shots in parallel. When you get tired of one you can return to the other with fresh eyes. William has been playing around with a different workflow based on the “pop-through” methodology of stop motion animation. The idea is to do a first quick-and-dirty rough draft mostly for getting the feel and pace, and the layer the final animation on top of that. In William’s case he makes an new instance of the character and places it over the old one, with surfaces intersecting and everything. Just another way to try to break down the problem and make it manageable. What is also clear is that the holy-grail of animation is an excellent rig. A rig that’s simple and pleasant to pose, one that you don’t have to fight with, will make the entire animation process easier, faster, and will produce better quality animation. It’s important to have a rig either built specifically or configured to fit the problem at hand. Use IK or FK where appropriate, even possibly switching mid-shot, etc. There is a real sense of family that has developed as they’ve spent so much time working together. They have fights just like a family, but also work to collaborate and live with each other. People may have different views on how to solve a given problem, but in essence they’re all working for the same good. Each week after the weekly they go out to eat, often at this good Thai place, and have beer and just hang out. I really felt the family aspect there. It was a fun and welcoming place to be. That human side to it really helps hold it together even when things get rough. Coming from the rather homogeneous culture of the States I find it fascinating to observe the culture of the Peach project. The diversity is quite amazing. How many languages are there? Dutch, Danish, English, German, Italian… Australian… ;) William will say to me and Nathan, “Hey America, come look at this…” And you can kind of tell that we all grew up in different cultures based on how we speak, our attitudes, and senses of humor… Still amid the diversity everyone works from the same great philosophy: open software, open content… me and Nathan have always been very fond of the idea that content could be created in a way which allows free distribution, just like open source. We’re starting to see this in the music industry, and Peach is really cool because it’s pioneering the idea of open film content. Isn’t it absolutely heart-warming in a very geeky way? As my stay here concluded, I reflected a bit on something Ton said earlier, “There are always going to be people who want to pick it apart and expect Pixar quality, but isn’t it just really cool that seven artists and developers can come to Amsterdam and work together like this?” The question I was thinking about is, “What is Peach about?” Well, I think it’s important to remember it’s about all the things that are happening right now. It’s about creating an amusing short movie licensed as open content. It’s about pulling the blender artist and developer communities together. It’s about giving seven talented people the chance to develop their talents, do the work they love, and further their careers. And it’s about making blender, the open source community’s 3d animation suite, as good as it can be. From Amsterdam, best wishes, Aaron (mosani) 29 Responses gaalgergely Writes: January 13th, 2008 at 9:45 pm cool post, nice video. best wishes peach team! Blubernuget Writes: January 13th, 2008 at 10:44 pm woot woot. nice vid. cant wait to watch this. yah… i thought i had more to say… nawabz Writes: January 13th, 2008 at 11:42 pm nice post. i wish i can be there peach team, would you like to have me as a visitor? ccherrett Writes: January 13th, 2008 at 11:51 pm very nice post. Feathers? brecht what else are you holding back?!?! Gianmichele Writes: January 14th, 2008 at 12:01 am Take your time guys, this is goign to really rock! Nathan Writes: January 14th, 2008 at 12:11 am Gianmichele: unfortunately, we can’t take all the time we want. We have this annoying problem called a deadline. Numarul7 Writes: January 14th, 2008 at 1:35 am “Deadline” hmm any Lifeline ?! :)) Kidding. Keep the good mood and good work, some say that the animation it is the hardest part but the post-processing it even harder… hope it will not be needed to much post-pro. Don`t let the stress be on you all …or will be seen in the animation to. Jahmaica Writes: January 14th, 2008 at 7:38 am Would be awsome, to create a real Peach Team or company, with them, as employers, working full time jobs, publicity, movies, whatever they could get their hands and money from, and still develop Blender and recruite new people to the company! That would be huge! Thats massive! Big Fan Writes: January 14th, 2008 at 8:35 am yup, well, thanks Aaron pity we have to have a visitor post the project news this project has pretty well fallen flat for audiences this time around ToastBusters Writes: January 14th, 2008 at 9:04 am “Animation is slow. It requires patience to do well. A single shot could take an animator half a day, a full day, or a week depending on the complexity of the shot. Imagine spending sixteen hours on the same 135 frames.” Welcome to animation. Man, reading this really makes me wish that I could have participated in this one. Hopefully there will be other similar projects in the future. JoOngle Writes: January 14th, 2008 at 9:59 am JoOngle make notes: – Perfect rig… – Thai food… – Little fluffy animator says that he loves Al gore? But will it blend? Nathan Writes: January 14th, 2008 at 12:08 pm Me gives Big Fan a big, sympathetic hug. joeedh Writes: January 14th, 2008 at 12:18 pm JoOngle: that’s Aligorith, not Al Gore! jess Writes: January 14th, 2008 at 12:20 pm I actually enjoy reading your news blog it’s very entertaining and not boring at all! big boo boo to you, Big Fan. Great work guys! **hugs Nathan** Virgilio Writes: January 14th, 2008 at 1:29 pm Man… everything I think of typing here sounds like I’m a fanboy… =) dusty Writes: January 14th, 2008 at 2:32 pm I just wanted to congratulate you on the best report (non-technical) that has come out of he project so far. Clearly, the project is taking up everyone’s concentration, so reports are normally hurried (and rightly so) so people can get back on with the mammoth work at hand. So it was nice to have a well written report done by clearly a very funny and nice guy. yellow Writes: January 14th, 2008 at 3:39 pm Very nice report. Aaron (Mosani) how’s that render api coming on, it looked so promising. You seemd to handle it all so well too. Felix Kütt Writes: January 14th, 2008 at 3:47 pm yeh.. go peach team, you can take down this behemoth! :) Dilly Writes: January 14th, 2008 at 5:26 pm Good look guys. You deserve the best. :) Robin Writes: January 14th, 2008 at 6:25 pm Great post. This is an exciting projekt. I hope there will be more of them. And maby one day, I can help in some way. Well I´m glad I at least could help by buying the DVD :o) ros Writes: January 14th, 2008 at 9:35 pm LOL.:)Ur the best team, guys, excellerating the Blenderworld! Marsan Writes: January 14th, 2008 at 9:50 pm Ecxellent! I saw the whole clip aswell! Big Fan Writes: January 15th, 2008 at 8:35 am ah.. Nathan.. um no thanks man..not my kinda thing…you and jess can have a private ‘bonding’ session.. seriously posting has not been so good this time – even Ton has a new years resolution…keep at it though Nathan Writes: January 15th, 2008 at 2:24 pm Big Fan: don’t mind if I do! *Me hugs Jess.* *Then me hugs Big Fan again.* Big Fan Writes: January 16th, 2008 at 8:13 am ugh! Big Fan Writes: January 16th, 2008 at 8:34 am ick! NCubed Writes: January 18th, 2008 at 4:26 pm “heart-warming in a very geeky way” Made me laugh, thanks Aaron. Doesn’t have to be geeky though, does it? I wish the rest of the world worked like the open source community. Eric Mesa Writes: January 21st, 2008 at 6:43 pm Thanks for this insight into the process. I can’t wait until it’s done! fxgogo Writes: January 28th, 2008 at 5:13 pm Lovely post, I think this project is showing some special promise."
