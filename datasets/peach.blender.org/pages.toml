title = "Big Buck Bunny  » Blog Archive   » ‘Special’  help"
full_description = "« Stages of Animation The Renderfarm (how it works) » Feb 13 ‘Special’ help Posted in Random Fluff by Sacha We’re extremely busy, but now we have someone helping us with lighting/compositing. Will it save us? See for yourself. Grab the Ogg Theora file here I guess it’ll stay with only 1 shot (out of 131)… 23 Responses BlendRoid Writes: February 13th, 2008 at 1:05 am Darn. I couldn’t hear anything they were saying. Was the person helpful? At one point it sounded like Ton said “Why would you accept crap [like this]?” Or is Ton helping with compositing there? Accursed cheap microphone noise… Inko Writes: February 13th, 2008 at 1:38 am March 2010… hehehe, good one!! Gustav Writes: February 13th, 2008 at 2:23 am Yeah the sound is horriable. I thing I manage to hear most of it, but there is a few gaps: T: And when we have light comming from the west.. north?, north! …And before we could see the lights comming from the… A: Yeah T: …and… This particles… A: Yeah T: It’s.. It’s the same shot? A: No T: No? this is scene 3, supposed to be? A: No it’s not the same shot¨ T: don’t know T: How can this work? A: We accepted it T: Uh A: we’re not going for quality, remember? T: The policy is not to accept crap? A: I know… I’ll complain to enrico when he’s back T: aaah that kind of thing T: What would you do in the ????? A: Well, I would not put ????? that have the same kind of feeling and you better just import the lights from that one T: This shot is the last so it looks like.. A: Well… A: And the sunlight is comming from behind… And then uh there should be another one, this one that’s another…..or this side, It’s also quite brith but its also a bit warmer And I think that’s it, it’s a very basic uhm.. T: Everybody can do that Pablo Lizardo Writes: February 13th, 2008 at 2:36 am jejeje good joke! Roll Writes: February 13th, 2008 at 5:14 am You’re not aiming for quality??? Then why did you sell people thousands of DVDs? You want to give us trash on the DVD because we trusted you??? Unless BBB becomes a very high quality project, nobody will ever buy anything you make in the future. Calvin Writes: February 13th, 2008 at 9:03 am Roll: It was a joke. Showing how “helpful” Ton can be. :D nailedem Writes: February 13th, 2008 at 9:13 am Roll, you and your comment to the video made my day… so early in the morning… maaaaan ^^ Ton is cool and so is rest of peach! Nathan Letwory Writes: February 13th, 2008 at 9:50 am Haha, hilarious. Odin / Velmont Writes: February 13th, 2008 at 10:20 am I didn’t understand it at all. :-( But now that I read the comments I do understand. You should really, really, really get an external mic. dusty Writes: February 13th, 2008 at 10:50 am @Roll: we’ll never buy the DVD’s again??…… Urm…… speak for yourself will ya? That comment could have been about anything. These guys are pulling stupid hours on little pay to improve the Blender product, FOR US, by making a low budget movie, with our help from DVD sales. So lay off a bit eh? That asside, Ton, you the man. So get a better mic for that camera :) Sago Writes: February 13th, 2008 at 10:56 am I quickly grabbed my digital photocamera that moment to film them. Nontheless, even with better sound quality you would hear mumbling. Some people can easily understand it, some not. @Gustav, close but not quite. ;) voOdKa Writes: February 13th, 2008 at 1:33 pm Noooo Peach is more !!! :'( Thank you Gustav ;) Omar Writes: February 13th, 2008 at 3:16 pm héhé, good joke, i Just let Ton make the tweaking in pure C, he doesn’t need widget, visual feedbacks and these power ress eaters. He doesn’t even need a true IDE, let him with the simple Blender py editor. :) Very funny. rogper Writes: February 13th, 2008 at 4:14 pm If he works for free I’ll hire him hehe :P Olaf Writes: February 13th, 2008 at 10:03 pm Ton has a weird way of speaking since I can’t understand a word he says in English. randomnut Writes: February 13th, 2008 at 11:17 pm Ton won’t stop until Blender looks like the Holosphere or he dies… Whichever comes last. At least, so it seems from the movie. Good luck with all the work you need to do, guys, and thank you all for creating the wonder which is Blender. Good luck and have fun, A random nut. MArco Writes: February 14th, 2008 at 2:11 pm I think that composite and lighting are not easy job, I doesnt have the know how to make a great lighting effect in a big project like this. If you make a video tutorial for this argoments alot of people will be able to help :) Bmud Writes: February 15th, 2008 at 12:58 am You’ve gotten to lighting already, eh? Awesome! Schnappi Writes: February 15th, 2008 at 12:39 pm Lightning is simple or at least the less time consuming aspect if you can use AO because everything gets a nice ground lightning and so even a 2 light scene can still look good. The rest can fairly easy be tweaked with the Node-System like they did in Elephants Dream. rogper Writes: February 15th, 2008 at 5:26 pm Schnappi: More or less ;) just because you can see everything that doesn’t mean that It’s lighted good. To acentuate the mood of a shot trying to make an audience realy fell the thing you still have to light very carefully. Ao is just a plus and compositor works for some shots :P Only my opinium ofcourse ;) Schnappi Writes: February 16th, 2008 at 2:40 am @rogper: thats true and of course its not an easy task but a experienced lightning director can outlight a scenery much quicker then an animator can animate in the same quality. Lightning needs much skill but most time lightning setups are fixed in a scene so if it looks good in frame 1, it will most likely still look good in frame 100, other then animation that are done frame by frame. its simply the less time consuming part in 3d animations (like drawing backgrounds for traditional 2d animations). Thossy Writes: February 16th, 2008 at 8:46 am Well, lighting is very challenging, IMHO. It requires artistic finessing, which can sometimes click quickly but may take very long to do. It also has heavy technical issues to deal with. I’ve never worked with a hair system that renders well in default lighting (maybe Blender is awesome :), characters have to remain lit correctly through drastic movements in a way that fits the light rig etc. All in all I’d say lighting is faster, right up until you hit a problem, then it becomes the most tedious part of the process. Any chance of seeing the comping layer setup, guys? sander wit Writes: February 20th, 2008 at 11:53 am He really looks serious at it, I say give hem a go :) Nice capture Sacha :) Have fun guys!"
