full_description = '« Woosh, the deadline passed! Or, how everything that can go wrong does… big big buck bunny » Apr 10 Premiere Big Buck Bunny today! Posted in Events, Production by Ton Nothing news really… apart from that all goes fine now. It’s even going to be awesome weather here today, great start of spring season. The three film copies have arrived safely. We even had a chance to sneak preview it yesterday in the theatre of Amsterdam Film Academy (wich turned out in a sneak preview event for the students of the vfx department!). So yes, we can confirm the film has images in it! Today in the premiere cinema of “Studio K” composer Jan Morgenstern will do a final sound check, and make sure the volume knobs are precisely as he intended it! Work on the dvd also progresses steadily. We have this time excellent goodies to share, of which we’ll give a preview tonight as well. Hopefully we can post here soon images and videos of the event, but for hot news you better check blendernation.com or blenderartists.org. Laters (and wish us luck!) -Ton- 56 Responses freakabcd Writes: April 10th, 2008 at 12:59 pm Good Luck :D I can’t wait to download and watch the movie, jejeje Vassilios Boucer Writes: April 10th, 2008 at 1:06 pm All the best! I can´t wait to watch the movie! Tobi Writes: April 10th, 2008 at 1:12 pm I wish you luck! And hurry up on DVD :-P Tobi Writes: April 10th, 2008 at 1:12 pm I wish you luck! And hurry up on the DVD :-P Socceroos Writes: April 10th, 2008 at 1:19 pm Well done guys. My hearty congratulations to you all. Also, a very big thanks to ALL the programmers that have been contributing their bit to this project – *great* stuff. You’re what makes this all possible. You’re really pushing adoption of blender in the mainstream. CG Artists take note! Again, well done! p.s. Can’t wait for my DVD! Mal Writes: April 10th, 2008 at 1:20 pm The best of luck to all of the BBB team!!! LoMac Writes: April 10th, 2008 at 1:35 pm Hurrah! Hope yous enjoy yourselfs. m