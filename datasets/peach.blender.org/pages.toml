title = "Big Buck Bunny   » 2008 » March"
full_description = "Mar 31 We’re (sort of) Done! Posted in Production by Nathan Monday, March 31st, 2008 The Peach Team just had a too-long meeting where we reviewed our final edit of the movie. And guess what? It’s done! Well… basically. We still need to do the credits, and a few final renders are still processing. But “Big Buck Bunny” is essentially done. Yayz! Now it’s time to move on to the DVD work. We have an ambitious set of extras planned. At least, they seem ambitious from this side of the fence. But I want to be all mysterious and whatnot, so I’m not going to tell you what they are. Bwa ha ha. But I think everyone will be pleased. Wish us luck! Posted in Production | 54 Comments » Mar 25 Our First Film print! Posted in Media Gallery, Production by Ton Tuesday, March 25th, 2008 Wahoo! The neighbours from Filmmore provided us a test print with 1 minute of material for color tests. It was already totally exciting to hold the metal case in my own hands… for me the first film ever, a wonderful experience. :) (more…) Posted in Media Gallery, Production | 41 Comments » Mar 18 Trailer! Posted in Production by William Tuesday, March 18th, 2008 To download the trailer in HD and other resolutions or find several mirrors, click here HD streaming version Posted in Production | 145 Comments » Mar 12 The Happy Blender Institute Tour Posted in Blender Institute, Production, Random Fluff by andy Wednesday, March 12th, 2008 Recently I realized that we never really made a complete Blender Institute tour after this project started. Sure, there was Ton’s first round trip waaaay back, but we needed something new, shiny and classy like this to show you how great this place actually is! Luckily Nathan, our master of rigging, animating and hugging, agreed to improvise a very sincere and pertinent guided VIP tour through the marvels of our beloved work- and living- space. Welcome to the Blender Institute! Ogg file Posted in Blender Institute, Production, Random Fluff | 75 Comments » Mar 04 BBB Premiere Posted in Production by Ton Tuesday, March 4th, 2008 Finally an update from the producers department. Let’s start with the biggest news: the premiere date now is final and confirmed! Thursday April 10th, 2008 Cinema Studio K, Amsterdam the Netherlands Premiere event starts at 19.00, and includes dinner and party. This is actually two weeks later than the original plan… which we’ll especially need to go over all shots again for final tweaks, error fixing, and general beautifying. The premiere event has been made possible in collaboration with Creative Commons Netherlands (thanks guys!), which enables us to make this an unforgettable evening for Blender and for the open source and open content movement again. The other big news is that we’ll have a real 35mm film copy with digital sound this time! Thanks to sponsorship of our friendly neighbours of Filmmore we will even get three copies, sufficient for an efficient distribution to festivals worldwide. It also means that we can start finding cinemas in big cities for local premiere events (between april 15 and june 1). If you’re interested in organizing this, please email margreet(at)blender.org to get more information. The premiere evening will be accessible for everyone. However, if you want to be assured you can get a seat for the first screening you have to subscribe to the VIP ticket in our e-shop. This ticket only costs 30 euro and includes a glass of champagne after the film, snacks and a meal, some free drinks and first access to the party with a cool DJ. Not to mention early access to all celebs! The cinema also will do a second screening, probably around 20h. This will be freely accessible for everyone, on a ‘first come first gets in’ basis. The party is also accessible for everyone, but only after 22h. You’ll then have to take care of your own dinner and pay for own drinks. But you’re very welcome! More details about the schedule we’ll post here soon. Note: Studio K is a hip new venue, in the same block as the recently opened StayOK hostel. This hostel has an excellent name. Book early! Visit the e-shop to reserve your VIP ticket. Later more, -Ton- Posted in Production | 33 Comments »"
