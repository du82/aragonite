full_description = "« Witness the Weekly Jan Morgenstern visiting Amsterdam » Nov 22 Making the animatic with Sacha Posted in Development, Media Gallery, Production by campbell Creating an animatic was the first project we worked on together, its also finished! In this interview Sacha (the director) speaks of its place in the production pipeline, how it was made and some features added to Blender that helped speedup the work flow. download the video in ogg format (better quality) 34 Responses malefico Writes: November 22nd, 2007 at 5:24 pm Dude… you are talking nonsense ! ros Writes: November 22nd, 2007 at 5:38 pm Cool. Is this some kind of add-on to the sequence editor? Fury_jin Writes: November 22nd, 2007 at 5:45 pm That’s so cool Sacha, and very useful! I hope there will be some other little tutorial like that :) Are you alone to work on the project today? ^^ Where did the team learn how to use blender? All bye themself? Or Ton give them private lesson? ;) AniCator Writes: November 22nd, 2007 at 5:47 pm Interesting…..hmm… campbell Writes: November 22nd, 2007 at 5:50 pm @ros, the next release of Blender will include these features, or you can use a recent build from http://www.graphicall.org Jacob Picart Writes: November 22nd, 2007 at 6:27 pm Is the dual monitor feature within Blender new too? Caught my eye when Sacha played back the storyboard timeline on the 2nd monitor. That’s a great function to have; storyboard feature a tremendous new tool that will certainly help our productions. Keep up the good work Peach! andy Writes: November 22nd, 2007 at 6:37 pm you can simply stretch blender across two screens. (that’s how we do it) basse Writes: November 22nd, 2007 at 7:42 pm :) it’s magical feeling when you actually start seeing first the opengl renderings appearing, and especially, when final renderings start replacing opengl ones in the animatic.. or.. crappymatic.. p.s. Ton will always think there are continuing problems. :) .b ros Writes: November 22nd, 2007 at 8:45 pm @campbell Great!I cant wait to get new version of Blender and all this new features. pablo Writes: November 22nd, 2007 at 10:07 pm That was awesome. congratulations to everyone that are working in the project. How long going to be the movie? and… when going to release a new version of Blender?… And again… excellent work!!! . Can i buy the movie from argentina? joeedh Writes: November 23rd, 2007 at 2:02 am pablo: you should be able to buy it anywhere, I imagine. Joe Satish 'iluvblender' Goda Writes: November 23rd, 2007 at 7:48 am Nice demo. Good luck Peach Team. squareline Writes: November 23rd, 2007 at 10:18 am Nice features :), it would be a nice features too, if that same frame (only the current frame) load automatically in Uv/Image editor that you see too in the Sequencer Image preview (a toggle on/off automatic load frame to Uv/Image editor) this way easily improving and mending with paint tool and save the changed things automatically. For inserting a new frame , duplicating a strip/frame and saving with different name in Uv/Image editor or automatically generate a new name with i.e with 001, 002 etc. rogper Writes: November 24th, 2007 at 1:25 am That’s the way to do good animation films ^_~ I don’t have much talent or patience for storyboards and animatics, so I kind’ a improvise along the way …and the results areee…well sometimes it works ok, but other times scenes don’t connect very well and then the result is Edition difficulties that might easily have been avoid with the making of an Animatic ^_^ Cool new features, can’t wait to try! Big Fan (Big Foot fetish) Writes: November 24th, 2007 at 3:08 am …now if only the rabbit could have his toes slid along a bit horizontally like that… :o) Sam Writes: November 24th, 2007 at 11:54 am Really cool. Can’t wait to get the next version of Blender. Man, I’d hate storyboarding. Looks like you’re working really hard, though. Keep up the good work. asdx Writes: November 24th, 2007 at 7:29 pm very cool, keep up the excellent work go linux/blender! :D Chris S Writes: November 25th, 2007 at 8:04 am Great work on the animatic features…. cannot wait to see the finished product… daveland Writes: November 26th, 2007 at 6:45 pm Learning to do this is the heart of short film making. I hope you can archive the animatic blend files at various stages and place them on the DVD so we can see the progression. Then we can go in and look at the process you used and how it fits into the blender toolset. I’ve already ordered my dvd!! dave campbell Writes: November 26th, 2007 at 11:00 pm @daveland, yes we want to do this and release on the dvd. One animatic with all hand drawings, another with opengl preview animations. @squareline, I see what your getting at, this is possible though it dosnt fit into how blender deals with images in the sequencer, it would be possible though personally Id prefer a way to load the current picture on the active strip into the gimp (or some other app) Bmud Writes: November 27th, 2007 at 6:00 pm What method is going to be used to render multiple cameras in the same scene? Sago Writes: November 28th, 2007 at 12:36 am @Bmud, we start by making sets with all the necessary camera’s. Later we’ll divide them into blendfiles for every single camera(angle). grafixsuz Writes: November 29th, 2007 at 1:23 pm @sago, this sounds like something similar to XSI’s memo cams which stores camera positions with in a scene. Though by dividing into blend files sounds like too complicated… Could a similar camera memo system be integrated? Any case, I wish you guys all the best in getting this movie done as you envision it to be. rogper Writes: November 29th, 2007 at 2:39 pm I´ve been using memo cams for 2 years now ^_^. Or I wright to a paper the LOC and ROT camera values and use them later or I put 20 cameras in a scene and choose one to render ^_~ wich gives me unlimeted memory cameras unlique the only 4 of the softimage :P OK, now serius, I would also like to have that feature in blender, but I guess it isn’t really important, is just someting that ocasionaly would be nice to have ^_~ Anthoni_C Writes: November 29th, 2007 at 3:43 pm Thursday and no new news…? grafixsuz Writes: November 29th, 2007 at 6:17 pm @rogper, agreed, not necessary but convenient. But the project and the SOC projects are gathers speed of implementation that will definitely bring alot more attention to blender than has been experienced as of the last few releases. Can’t wait for the movie though guys, wishing you luck. @Anthoni_C, they could be busy… just a thought. Bmud Writes: November 29th, 2007 at 6:28 pm @Sago: wont that take up a lot of hard drive space? Tools like the ‘Camera Changer’ python script and derivatives have been around for ages but they’ve been outmoded for a while too. Currently there’s no way to switch cameras except for making clone scenes and dumping them to the sequencer. Sago Writes: November 29th, 2007 at 7:58 pm @Bmud, we don’t have to care about hard drive space. Having separated blendfiles makes it easier for us, also because renderlayers and compositing… or something like that. brecht Writes: November 29th, 2007 at 8:59 pm Hard drive space is not a problem, also because the objects are linked anyway. The actual shot blend files should be quite small. And splitting it up into multiple blend files helps organization. If a whole scene is in one file, you can’t have multiple people working on it at the same time, or have individual versions and backups of shots. Dion Moult Writes: November 30th, 2007 at 3:48 pm Makes me feel as though I always want to latest BF from Graphicall instead of waiting for the big releases :) anton Writes: December 2nd, 2007 at 4:22 pm How did you seperate the strips , pressed I or Y ,is this possible in blender 2.45 or in the next release?"
