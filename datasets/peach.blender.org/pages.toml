title = "Big Buck Bunny  » Blog Archive   » First impressions from the Peach Workshop"
full_description = "« Peach Workshop FuzzCam Pre-Production Workshop Review » Aug 26 First impressions from the Peach Workshop Posted in Random Fluff by Nathan The workshop is over, and one of the many things we decided during the workshop was that we should be more active on our blog. Thus here I am, writing a blog entry. I’ll leave the official stuff to Ton, but my impressions during the workshop have been consistently good: this will be a cool project with awesome results. We might have to pull a few all-nighters, but we’ll make it happen. I feel great about everyone on the team. We all seem to get along really well. The only problem is that there’s so much talent here that—honestly—I feel a rather intimidated! I hope I can live up to the abilities of the rest of the team. The studio here is really nice, so if we pull some all-nighters, I don’t think I’ll mind so much. We have a nice huge room where all the workstations will go. The lighting is calm and pretty. The seats are comfortable. We have a great location looking out over the canal. We even have a kitchen! It’s great. All-in-all I’m very excited to start working on Peach in October. It will be a lot of hard work, and it will be fun. Wish us luck! Nathan Vegdahl 13 Responses Richard Writes: August 26th, 2007 at 11:35 am Good luck with the project. :-) moustady Writes: August 26th, 2007 at 11:36 am Good luck michel Writes: August 26th, 2007 at 11:40 am Nice to hear, you’ll be more active on the blog, but don’t forget about your real work :-) :-) Good luck! Gianmichele Writes: August 26th, 2007 at 11:43 am Wooooo…fantastic! Can’t wait to see what you guys will come out with! Say Hello to Enrico! Gianmichele Markus Kothe Writes: August 26th, 2007 at 12:27 pm Nice to see that it’s coming along nicely. I hope (for your own best) that the movie will bee good… realy good. Cause I pre ordered two (!) DVD’s to help you out ;) Big Fan Writes: August 26th, 2007 at 12:42 pm Nice to have you guys post. I wonder if someone extra will take on the role of publicist/reporter? I seem to remember ED blog started out well but posts dried up as things got very busy…. RedBirdiii Writes: August 26th, 2007 at 2:17 pm Has the script been thought about or not yet? Sago Writes: August 26th, 2007 at 2:43 pm @Big Fan: though I’m not exactly sure how things went during Orange, we’ll try to put more attention on the blogging and its organisation. As for now, both Nathan and Ton seem like good candidates for this. Depending on the subject/situation some others can contribute too. If needed I myself will only handle most of the trolls… so let that be a warning. ;) @RedBirdiii: a script is made. Of course during every phase (breakdown, storyboard, pre-viz,…) elements of the story will be changed to make things funnier and better. EnV Writes: August 26th, 2007 at 4:10 pm @Gianmichele: hello! @RedBirdiii: yes, the script is Sago’s, gh gh! And it’s going to be a great one. Dion Moult Writes: August 26th, 2007 at 5:15 pm I got some re-assurance from Nathan that not only will you keep us updated with your own progress, but you’ll also post up Blender related/animation-making tutorials/help information. I’m sure many like me who are running their own “mini animation project” would appreciate that. (Of course, this will also get more people to actually read your posts ;) ) Rusty Tracy Writes: August 27th, 2007 at 12:19 am Hello All, Best of luck with your project! I am looking forward to following the development. from, a new fan Jeepster[] Writes: August 27th, 2007 at 1:01 am moo :D JiriH Writes: August 27th, 2007 at 9:46 pm Good luck! It is great that you will focus on blogging so fans will be informed about every new bunny :-)) Looking forward to all your pictures and sketches from your workshop? :-)))"
