title = "Big Buck Bunny  » Blog Archive   » Magic Mandcandy – Can You Finish It?"
full_description = "« Peach DVD pre-sale campaign started! Peach workshop started » Aug 05 Magic Mandcandy – Can You Finish It? Posted in Random Fluff by Nathan Hey everyone. I’ve done a little animation test using Bassam’s Mancandy rig. This is part of a little experiment for community participation (more on that in a second). Click the the image to view the animation. You will probably notice a couple of things about it: It’s a cheap rip-off of this Pixar animation. It’s stiff and lacks life, sometimes even pausing completely. Let us ignore the first point for the sake of my reputation, and simply focus on the second. The reason it’s stiff and whatnot is because it isn’t completed animation. In fact, it’s only a block! You see, in pose to pose animation there are basically two stages: blocking and finishing. Blocking is the the stage where you lay in your poses and timing. You might have a couple breakdown poses if they’re important, and you might toss in a few important extras (like the hand wave I did), but by and large this stage is just straight poses and timing. This is where the mancandy animation is right now. Finishing is the stage after blocking where you add in all those things that… well, finish the animation. Breakdowns, arcs, overlapping action, slow-in slow-out, etc. All those things that make an animation complete. Not that you don’t think about this during the block (you should), but finishing is where you actually lay them in. So what’s this community participation thing I mentioned? Well, I’ve been toying with the idea of having people outside the core Peach team do some of the finishing for Peach’s animation. The Peach team would do the block (like my mancandy animation), but then for some shots other people would take over for finishing. This would allow us to turn out more animation of a higher quality. Please keep in mind that this is just an idea. Currently there are no plans to actually do this. I’m just toying with the idea. But as an experiment toward this end, I’m curious to see what people can do with my “Magic Mancandy” block. Here is the block: magic_mancandy.zip If you would like to try doing the finishing for this, then go for it! And if you do, please render it either as a full render or OpenGL preview from the camera angle provided, and post a link here to your movie file. I look forward to seeing what people come up with! 45 Responses Jonatas Kerr de Oliveira Writes: August 5th, 2007 at 3:10 pm That´s very interesting! I´ll try it! I will be back! (with some polished animation I hope!) hehehe Leonardo Writes: August 5th, 2007 at 3:56 pm Very nice idea! I’ll try it too… Tobias Kummer Writes: August 5th, 2007 at 6:28 pm I’ll also give it a try if I find some time to do so… But I think that’s a very cool idea! Greets, Tobi Ken Writes: August 6th, 2007 at 11:39 am This is a very good idea – however should there not be some rules. Do you work between all the poses laid down or do you have the freedom to change something that doesn’t feel right to you. Say at frame 33 you feel the pause isn’t long enough – if you make this twice as long it will obviously have a chain reaction on the remainder of the animation. My guess is you don’t change anything, but do you have the ability to change small things if it’s going to help to bring Mr Candy to life. Dion Moult Writes: August 6th, 2007 at 11:40 am I can’t try it (still need to learn a lot more) but I’m posting this to say a HUGE THANK YOU for the pose-to-pose animation link. That was coincidentally just after I decided to do some basic character animation test. Hooray for project Peach. Most people don’t know this, but I myself am working on a project similar, but it also contains a fully documented learning process. And this is one of the things that helps it! Again, thanks! Steren Writes: August 6th, 2007 at 4:57 pm I recently suggested this kind of idea to Ton, and I would be proud to contribute. We could even imagine an online call for content on a wiki, where the team asks for small help, such as objects, textures, sounds or finishing animations. I would like to model some accessories or background objects for example. Nathan Writes: August 7th, 2007 at 5:08 am Ken: there aren’t rules per se. But the block should make it unambiguous what the animation is supposed to be, and large changes to that intent shouldn’t be made. Dion: glad I could help! I’m hoping to post more information about animation technique in the future, in bite-sized pieces. Michael Fox (Mfoxdogg) Writes: August 7th, 2007 at 11:00 am Here is my attempt, i kept its snappyness and i didn’t touch his face http://dominomf.com/smcfiles/mfoxdogg_magic0001_0300.mp4 Jonatas Kerr de Oliveira Writes: August 7th, 2007 at 7:07 pm Here is my atempt for it… that´s what the time permits now… took me about 1:30 hours to do this (animation and render)… that´s ain´t good yet, but if there´s some oportunity to do some animation in the movie I would do mutch better and spend mutch more time on it… http://animacao.ufscar.googlepages.com/magic.avi http://rapidshare.com/files/47543762/magic.avi.html Jonatas Kerr de Oliveira Writes: August 7th, 2007 at 7:09 pm I almost forgot! I didn´t toutch his face too! Simon Clitherow (aphex) Writes: August 7th, 2007 at 8:25 pm I remember seeing a similar process for a commercial animation movie project, but I unfortunately forget the name… It was open for the public to see the progress but only in-house animators could actually contribute. It was all done online and on a shot-by-shot basis. Basically, the process was: 1. animator uploads a rough draft of an animation in a particular shot (a ‘digital daily’). 2. TD or other mentor animator gives feedback on what is wrong or could be improved. 3. animator uploads new and improved animation, based on comments and waits for feedback. 4. rinse and repeat, until mentor or TD declares the shot ‘complete’. Perhaps a similar system could be used for peach? Of course, it would be open to outsiders to contribute, but once a shot is ‘claimed’ or picked as best, then it should be restricted to just the mentor (in this case, bf institute animator) and the artist – which would save peoples wasted effort, etc. Just throwing my own ideas around :) Mathias Pedersen Writes: August 8th, 2007 at 12:15 pm Is there any deadline for this? I’d very much like to contribute, but I currently don’t have the time. //Mathias Nathan Writes: August 8th, 2007 at 1:05 pm There is no deadline. Just a casual experiment. :-) I’ll keep track of this comment thread for quite a while. amoose136 Writes: August 8th, 2007 at 4:56 pm I’d like to try but I when I have a computer with blender and when I don’t is very random. Cool idea, I think something like this could be used for the sound part. filoman Writes: August 8th, 2007 at 4:58 pm Great I sign in! Have a little time to lose, and already work a few with Mancandy see you later I’ll repost soon Pablo Lizardo Writes: August 8th, 2007 at 6:59 pm visit my site: http://pablo.lizardo.info This site pretend to be a reference to the graphic designer who are working with Blender. The visitors will find things like tutorials, tips, resources and much more. Digimator Writes: August 9th, 2007 at 1:31 am A sound file would be nice to have. The voice track drives the acting performance in an animation shot.I gives the animator the character’s emotions and temperment in the given shot. And also a brief description of what the character is trying to do or accomplish.These things are a must have if the experiment is going to work well. All things said,I would love to partcipate too. Digimator Writes: August 9th, 2007 at 1:37 am I stand corrected. I found the reference file in the link above. Nathan Writes: August 9th, 2007 at 7:00 am Digimator: if the acting and character isn’t conveyed in my blocking, then I’ve failed already, and perhaps I should animate another shot. Perhaps an original one. :-P That said, you cannot rely on voice acting for all acting decisions in animation. Partly because a lot of animation doesn’t have dialog, but also because even when it does you need to take the acting to a higher level than just duplicating what the voice actor does. You need to really understand the character. Of course, this is all stuff that I need to work on too. Digimator Writes: August 9th, 2007 at 1:06 pm Keep up the good work! Readability is a main ingredient in good CG. ethana2 Writes: August 10th, 2007 at 3:02 am Well, I’m of the opinion that the only art that cannot be performed largely by code is that of coding itself. Have you considered writing some kind of script that would smooth out the movements by joint angle? I would think it should be somewhat similar to drawing a curve around a set of points, except more complicated- but if it was done, it would make future choreography easier, no? It would also need to take physics into account to truly look natural… ethana2 Writes: August 10th, 2007 at 3:04 am …(perhaps even an algorithm as similar as possible to what the human brain has to do to hold a pose? –Compensate for all forces, constant recalibration, organic movement and constantly varying motion and pose result? brecht Writes: August 10th, 2007 at 3:52 pm ethana, I agree it is possible to create tools to make this stage easier. There exist also advanced algorithms for motion synthesis, enhancing motion, keeping balance, incorporating tension, etc. But the results of even the state of the art are very crude still, and in my opinion would make the motion look better to start, but only save a small part of the total time needed to tweak the motion. Herb10660 Writes: August 10th, 2007 at 11:34 pm Thanks Nathan for a great exercise. I’m a stop motion animator / director who is trying to learn a bit of CG through Blender. To have something like this to clean up is excellent training for people like me who are new to the medium. I’ve learnt loads about the principles of keyframing etc by doing this. The result is uploaded here: http://www.youtube.com/watch?v=ppaUlJOnN1Q It’s a little bit subtle but I didn’t want to change the underlying key positions too much. Goodneck Writes: August 11th, 2007 at 6:33 pm hey, great idea! here’s my attempt: http://www.ace-studios.com/images/imagesappart/mancandymagic.avi hope ya like it… Morris Writes: August 11th, 2007 at 6:41 pm haha the real problem is that he’s naked and no hair, so not much to animate. come on guys, let’s see some cloth and hair movin all around. :) I guess these peach guys probably wont have that either though, so actually, maybe this is good, but then it needs SQUASH AND STRECH. haha, ok “shut up and try it yourself, big shot” ooops sorry, just a comment..never mind… Virgilio Vasconcelos Writes: August 11th, 2007 at 10:32 pm Hey, guys! =D Well… It’s a good thing to do! That Keith Lango tutorial is really good, but he also made another one where he wrote about a better way to achieve overlaps and such: http://www.keithlango.com/tutorials/overlap/overlap.html From the intro: A number of years ago I wrote my Pose to Pose- Organized Keyframe tutorial. In it I advocate a method of achieving overlap and drag on objects that- at the time- I thought yielded decent results in a quick and easy fashion. In the ensuing years I have come to change my opinion about the merits of such a workflow. In this follow up article I hope to point out the problems with my earlier ideas and propose a better solution to the challenge of creating great overlapping action and drag in your animation.” Cheers HolgerB Writes: August 12th, 2007 at 1:26 pm Hi all, I have used the nodes editor and luminance key to combine the animations submitted. This will allow you to compare the different artwork. The Video Sequence Editor will allow you to do this frame by frame. Here is a preview pic: http://www.hapkido-clarholz.de/Holger/mancandy_combined.jpg And here is the video file: http://www.hapkido-clarholz.de/Holger/mancandy_combined.mpg joeedh Writes: August 13th, 2007 at 1:17 am my pathetic attempt: http://joeedh.googlepages.com/mancandy10001_0300.avi Joe jamie matta Writes: August 13th, 2007 at 1:25 am I would be much happier to support projects if the wider community can have opportunities to participate in some way. It also helps those who are certainly talented and would like to be involved but cant travel or only have a little time say in the weekends and evenings… Of course people participating this way need to meet a standard too. As has been said it is a way to get some experience too so the pool of eligible artists can grow ahead of the studio Also I think properly well it would raise the standard or at least extend the movie duration on what could be achieved by a small team in a small time regardless of their dedication. So yeah lots of potential Go for it :o) TinShed Writes: August 13th, 2007 at 1:45 pm Nice little exercise. Its interesting the differences in each attempt. …And my attempt http://adayman.googlepages.com/tinshed_magic_3.mp4 The blend files http://adayman.googlepages.com/tinshed_magic_mancandy.zip joeedh Writes: August 14th, 2007 at 11:27 am Heh. I forgot to render my attempt in 2.44 :/ Mancandy’s facial rigs havn’t been fixed yet for current SVN. Joe fatfinger Writes: August 14th, 2007 at 12:28 pm Nice one, here’s my attempt. http://s79.photobucket.com/albums/j124/fingapointa/Blender/?action=view&current=magicmcandyfatfinger.flv cheers McSmiffy Writes: August 14th, 2007 at 9:26 pm Here’s my effort – I spent about 3 hours tweaking, but didn’t touch the face. http://www.3d.vertexstew.co.uk/mov/mancandypeach.avi I think it could be useful to see how this process would be carried out by the Peach Team, but to be fair you’ve probably all got enough on your plates already. Even on a short clip like this, a detailed study of the process would be a good learning resource. Mike Writes: August 16th, 2007 at 2:48 am Here’s my take. Hope you enjoy! http://mbproductions.biz/wordpress/wp-content/uploads/2007/05/magic.png0001_0316.avi worlddZ Writes: August 16th, 2007 at 6:32 pm too much blocked/paused animation. need improve with more dynamism and expressivity, taking care with excessive paused poses. IMO: Blender made animations need be more professional to call new users to blender. A lack of really good animations faces blender no so much apreciated to peoples who unknow the potencial of this software. Vilem novak Writes: August 17th, 2007 at 2:41 am Hi, I’m posting my experiment. I gave about 5 or 6 hours to it. I must say that I spent most of the time with playing with timing and posing – adding some between poses etc. Sorry if this is what it wasn’t supposed to be, but because the original example wasn’t simply enough readable for me, I tried to import several little motions to show more the action.The result is a tiny bit longer. I spent less on the smoothing part, since that’s what’s supposed to come after the previous. I didn’t come to a really satisfiable result, and I think"
