full_description = "Aug 22 Siggraph Los Angeles report Posted in Blogroll, Events, Peach Press by Ton Friday, August 22nd, 2008 Friday August 8th: Disney visit Thanks to our good friend & animation consultant & trainer Arno Kroner we had a great afternoon at the Disney Animation studios; the original place were animation got about invented (well, perfected :)! There was a screening arranged in the main viewing room, and quickly after 12 PM the room quickly filled with about 70-80 people. After showing BBB (people laughed!) we did a 40 minute making-of presentation, especially showing Blender animation & compositing and the cool fact a single .blend file could manage and collect all the data for an entire movie shot. After the presentation we went for lunch and a tour around the premises. Unfortunately the studios were forbidden for us… would have loved to pick the brains of developers about Bolt’s forest rendering methods. But, I did see the office of John Lassiter! (more…) Posted in Blogroll, Events, Peach Press | 16 Comments » Aug 06 BBB goes Hollywood! Posted in Blogroll, Events, Peach Press by Ton Wednesday, August 6th, 2008 It’s SIGGRAPH week (10-15 august)! We’ve managed to get BBB screenings + peach team presentations in the theatres of three exciting Hollywood studios: Disney Feature Animation (friday) Dreamworks Animation (tuesday) Rhythm & Hues studios (wednesday) This on top of our schedule already: Sunday: Siggraph Sandbox demos, 6-8 PM Monday, three BOFs 2-6 PM Tuesday-Thursday: demos on HP booth Wednesday 8.30 PM: BBB screening and ‘making of’ Panel Four of the Peach crew artists will help me out for these 7 days, so here’s you chance to meet with Sacha, Nathan, William and Andy. It’s going to be great! Expect lots of pictures and a report here in a week -Ton- (Late news: BBB is in official selection for the prestigious Netherlands Film Festival. Whee!) Posted in Blogroll, Events, Peach Press | 14 Comments »"
