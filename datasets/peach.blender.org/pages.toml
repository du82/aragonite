full_description = "« DVD authoring last bits Awesomeness, it’s a DVD!! » May 11 The release! Posted in Production by Ton The dvd gold masters were sent in time to the printer, with as aim the may 15 release. Of course the day after we sent the discs some errors were detected… like stereo sound in the ntsc movie, where 5.1 was more appropriate! New gold masters were sent, but it means that the printer needs extra days too. That means the discs get delivered here now on tuesday May 20th (confirmed date by printer). We then will ship all of them the same day. The online release of the film will then happen 10 days later, May 30 or 31. We’re already lining up great mirror websites, sufficient for everyone to watch or download the film the same day! Really curious to learn your reactions… :) -Ton- (BTW: May 17 or 18 is Blender 2.46 release. We’re going to get a good website traffic test!) 60 Responses Jonny Writes: May 11th, 2008 at 3:47 pm First!!! Kewl. Short after my birthday (15.) the dvd will arrive!!! Jonny Bov Writes: May 11th, 2008 at 4:26 pm Looking forward to the release and I’m also looking forward to animating with some new rigs. Cheers Tom Savage Writes: May 11th, 2008 at 4:27 pm Looking forward to this! Lars Writes: May 11th, 2008 at 4:28 pm No hurry! I’d rather wait a few days / weeks more for a better product than getting a not-complete early. ;) nawabz Writes: May 11th, 2008 at 4:30 pm aaahh maan i wanted first comment getting close it means more waiting for us. but in the end im sure it will be worth it. i know blender institute is working only to get DVDs to a good standard. wait like you said people could seed the DVDs on torrents at same time they receive it. MrNoodle Writes: May 11th, 2008 at 5:09 pm I ‘ll starting the countdown! Fury_jin Writes: May 11th, 2008 at 5:46 pm No way, i have two chrismas in the same year! But this time i can see the big buck daddy! Saint Theo Writes: May 11th, 2008 at 8:02 pm Will the 2.46 version finally fix the problems on MacBooks (not MacBook Pros) with Leopard (OSX 10.5)? Blender developers have completely ignored this problem. Born Writes: May 11th, 2008 at 9:04 pm Congratulations Peach Team! And thank-you, so much, for Blender! I can hardly wait! Topher Hunt Writes: May 11th, 2008 at 10:03 pm I can’t wait – will the online release be in torrent form also? That would take a lot of the load off of the mirrors. I’m really excited about this. Anonymous Writes: May 12th, 2008 at 12:03 am When I first got my Elephants Dream DVD one of the CDs had fallen out of the case’s plastic holder resulting in several scratches on the disc. I think quite a few people also had the same issue. Are there any plans to use a sturdier case or tape down the discs while in transit? Joris Writes: May 12th, 2008 at 12:13 am Well I can’t wait! :D Thanks Zaffo Writes: May 12th, 2008 at 12:22 am I can wait, since I know this. Counting down… Luckily shipping won’t take long from A’dam (Amsterdam) to R’dam (Rotterdam). I will copy the movie to my HDD and start seeding the torrent after the official web release + uploading the torrent to all mayor torrent sites. Sven von Brand Writes: May 12th, 2008 at 5:15 am I’ve waited long, but I believe it’s worth it, you’ve done a hell of a job. Can’t wait to receive my copy!! I was hoping to get it May 12 for my birthday, but a few extra days won’t hurt. I Hope the DVD gets here (Chile) before the internet Premiere Socceroos Writes: May 12th, 2008 at 6:50 am Agh, the wait is agonizing!! I’m really looking forward to finally seeing the movie! Well done Peach Team. Steven Chan Writes: May 12th, 2008 at 7:47 am I too am wondering whether Blender 2.46 will fix the graphics glitches that make it unusable on Macbooks and Mac Minis. Any progress on this? Thanks! Kirado Writes: May 12th, 2008 at 10:07 am thanks for all the hard work.. can’t wait to see. So what ever happened about the tree and plat building system? Is the sky environment going to be in 2.46? Matthijs Writes: May 12th, 2008 at 2:40 pm For those of you who are in the Amsterdam area on May 17th, be sure to visit the Ubuntu 8.04 releaseparty at Wibautstraat 150! Big Buck Bunny will be shown there as well, free entrance! Click on my name for more info :) pvandewyngaerde Writes: May 12th, 2008 at 3:38 pm I saw it at the Ubuntu Hardy release party in Belgium. I liked it a lot, very funny tagoean Writes: May 13th, 2008 at 12:40 am Can’t hardly wait… schitterend werk gasten! ik anticipeer vol ongeduld een geweldige film! BgDM Writes: May 13th, 2008 at 1:36 pm Oh!!! I can’t wait to get my DVD. Gonna take 6-10 days to get to Canada though. But damn, will be worth the wait! BgDM Éric B.-B. Writes: May 13th, 2008 at 3:09 pm Waiting, hoping, expecting to see in on the Annecy Bonlieu movie theater from June 9th ! Vive les lapins ! http://www.annecy.org – International Animated Movies Festival Francois Joannette Writes: May 13th, 2008 at 7:17 pm Looking forward to see it. Just to late for my birthday….today…. stratus26 Writes: May 13th, 2008 at 8:29 pm Woooohhooooo ! Thanks! Voodka2007 Writes: May 13th, 2008 at 11:23 pm Youhouh !! May 30 !! :) Redneck Writes: May 14th, 2008 at 7:13 am All comments in russian ([…]The release![…]) are spam and don’t relate to Blender… P.S. Yehaaa! Will wait for the great movie! BeepMaster Writes: May 14th, 2008 at 11:36 am I wait patiently ^^ … Filemnoi Writes: May 14th, 2008 at 11:38 am Looking forward to the release. Good luck!! DJ_Boxer Writes: May 15th, 2008 at 2:56 am “No squirrels were harmed during the waiting of this movie” LOL Gianmichele Writes: May 15th, 2008 at 11:41 am almost there, almost there :D DingTo Writes: May 16th, 2008 at 9:57 am I can’t wait…the film will be so much great! It is another big milestone for Blender and for you, guys. You have made a excellent work. Keep going. btw: Delete the spam-comments… :-) Ronc Writes: May 17th, 2008 at 3:36 pm Screw mirrors, use torrents! alienkid Writes: May 17th, 2008 at 4:45 pm Aw I am going to Ireland and won’t be able to mess with the new blender ver oh well. Mal Writes: May 17th, 2008 at 7:46 pm alienkid, we recently got electricity in Ireland, so you should still be able to find a computer over here to try it out on :) Christiaan Bakker Writes: May 18th, 2008 at 9:19 am Where’s Blender 2.46!? DingTo Writes: May 18th, 2008 at 11:01 am It will come soon…we still have the 18th of May…:-) Christiaan Bakker Writes: May 18th, 2008 at 11:48 am RC4 works fine for now. :P Alexander Ewering Writes: May 18th, 2008 at 7:58 pm Be careful not to convert into a second Pavel Kanzelsberger regarding your self-proclaimed deadlines ;) Christiaan Bakker Writes: May 18th, 2008 at 8:06 pm Haha.. *smiles* It’s still not here. ? *’huh’s* Stephen Meli Writes: May 18th, 2008 at 8:35 pm I’d be willing to mirror BBB on my webspace, I have tons of bandwidth that I’m not using right now. :) Werner Höhrer Writes: May 18th, 2008 at 10:37 pm Woohoo, 2.46 is coming shortly: http://lists.blender.org/pipermail/bf-committers/2008-May/021124.html Werner Alexander Ewering Writes: May 19th, 2008 at 1:03 am Werner: It’s about time. The deadline has just slipped through in Europe :-) So, about 11 hours in left, in case the deadline was meant for Hawaii ;-) Matt Wilmshurst Writes: May 19th, 2008 at 7:56 am Alexander – Perhaps you should consider the date provided to be a delivery estimate rather than a deadline ;o) I’m sure Ton and the guys will release the new version as soon as they can. MrE Writes: May 19th, 2008 at 2:08 pm [chris crocker mode] Leave the Blender team aloooone!! [/chris crocker mode] On the other hand the With the releasedate inching closer my excitement is almost killing me and making it harder for me to withhold myself from forcing the mailman to open his bag so i can see for myself there’s no package for me. Christiaan Bakker Writes: May 19th, 2008 at 7:55 pm It’s there! 2.46! Yay! I just wonder why Mancandy’s face drivers got broken. They broke in RC3/RC4. Smiechu Writes: May 19th, 2008 at 11:50 pm Hey, wait a second. Did I understand that right? Movie will be totally free a the end of May? :D MrE Writes: May 20th, 2008 at 12:58 am Nope you misunderstood. The movie is free already. Some people just get it earlier and get the warm feeling that they contributed with it for free. Saint Theo Writes: May 20th, 2008 at 2:03 am 2.46 still has the graphics lag on MacBooks & Mac Minis. And it’s Apple’s fault, apparently. Chris Writes: May 20th, 2008 at 4:48 am Well, with shipping times, chances are those who helped fund BBB by purchasing a DVD, but don’t live in Europe, will see it online before their DVD arrives. Mildred Writes: May 20th, 2008 at 7:30 am Seems like the website test failed … On my computer the blender.org website was unavailable for few hours yesterday. I’m thinking that perhaps the blender foundation perhaps should have another web server installed with load balancing the release days … maybe to be used for other purposes afterward, so the website don’t do down. Mildred Writes: May 20th, 2008 at 7:33 am Or perhaps use static pages for the most visited ones (if that’s not already the case). In some cases it can make miracles. MrE Writes: May 20th, 2008 at 9:20 am @Chris Never thought of that. Well it’s still not to late for Ton to push forward the moment of the online release. Digitist Writes: May 20th, 2008 at 2:04 pm It’s may 20th today. So the DVD will hopefully be shipped today. Vassilios Boucer Writes: May 20th, 2008 at 2:21 pm Yeah! Today is shipping Day(I hope)!Cant wait the Postman..coming! Rouven Writes: May 20th, 2008 at 2:22 pm I guess thos blender folks over there in Amsterdam may already have bleeding fingers because of the packaging action. I see forward to the arrival of the dvd. I purchased my new 22″ Display yesterday to view it in awesome quality. I can’t wait anymore. yaniv Writes: May 23rd, 2008 at 5:51 pm i cam hardly wait!!!! it is got to be so funny its looks just a great movie!!! thanks you peach team!!!!! DJ_Boxer Writes: May 24th, 2008 at 4:55 pm @Christian: Have you tried the Face drivers on 2.46 full release? Faraz Khan Writes: October 25th, 2009 at 8:14 pm its pretty sad how the old cartoon drawings have stopped and all the shows are now animated :( lingerie Writes: October 28th, 2009 at 6:23 pm I see forward to the arrival of the dvd. I purchased my new 22″ Display yesterday to view it in awesome quality. I can’t wait anymore. Club Penguin Cheats Writes: January 18th, 2010 at 9:09 am When I first got my Elephants Dream DVD one of the CDs had fallen out of the case’s plastic holder resulting in several scratches on the disc. I think quite a few people also had the same issue."
