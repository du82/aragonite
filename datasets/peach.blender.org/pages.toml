full_description = "« Studio tour #2 Sun network.com renders Peach » Oct 25 First glimpse of the animatic! Posted in Production by Margreet Proudly present the first glimpse of the animatic: A Rabbit’s Revenge! And a short discussion of a certain part of the movie. Enjoy! Please notice the cuckoosound which I was forced to put in by Sacha, because some things we need to keep topsecret ;0) 20 Responses AntonG Writes: October 25th, 2007 at 3:51 pm Great! Keep on going! -AntonG Gianmichele Writes: October 25th, 2007 at 4:26 pm Super Great! -Gian SamArthurAllen Writes: October 25th, 2007 at 4:35 pm Hyper Super Great! -Sam grafixsuz Writes: October 25th, 2007 at 4:40 pm Awesome, I can’t wait for this baby to be finished! jim ww Writes: October 25th, 2007 at 5:56 pm what, you want to limit the head hitting? why? are you trying to redefine the cartoon bunny drama? more head hitting! whee! the development sessions look like fun. i can see that NOT using some of those brilliant ideas is the real challenge. -jim ww Kirado Writes: October 25th, 2007 at 6:39 pm hey looks interesting.. one thing, could you post videos that don’t use quicktime pulease!!! Maybe along side the quicktime ones…(divx?) I know you guys are really busy, but the latest quicktime tries to take over my computer in very nasty ways. Anyway just an idea. Thanks for keeping up the blog. Numarul7 Writes: October 25th, 2007 at 7:16 pm Post an divx version. Quicktime crash Firefox Paul Writes: October 25th, 2007 at 8:48 pm Just play quicktime files with the VLC media player. http://www.videolan.org/ Mack Writes: October 25th, 2007 at 10:42 pm Very awesome! Keep up the great work! By the way, the word is “glimpse”, not “glimp” LoMac Writes: October 26th, 2007 at 1:21 am Enjoyed!! RC Writes: October 26th, 2007 at 5:58 am Just to give you some feedback, I laughed when the acorn hit the bird on the head. Wasn’t expecting it. And I’ve seen your rabbit sketches, and he seems awfully anthropomorphic. Maybe he could be even more bunnyish? Fury_jin Writes: October 26th, 2007 at 10:27 am I love this kind of work. Dark place, but brilliant ideas! When someone give a new idea, is it some vote or something like that? Everyone in the team can give new ideas for the scenario? Nice start! Kirado Writes: October 26th, 2007 at 4:16 pm what version of quicktime you guys using. Quicktime won’t let me update nor will it play your movie.. are you using some other codec?.. any help for the non-mac codecs users please. @paul: tried doing that and it crashed VLC big time. superkoop Writes: October 26th, 2007 at 9:39 pm Hey thanks for video! And I am glad you put it in .avi too! Because I haven’t been able to watch all the videos that you put up in .mov because I have vista, and have not been able to get .mov files working at all in any program. VLC included. Again, thanks for the video, it’s looking really nice! ^_^ jesterKing Writes: October 26th, 2007 at 9:45 pm Nice animatic. The crappymatic after that really sucks big time. Keep the good stuff coming! /Nathan nerdranger Writes: October 27th, 2007 at 12:59 am I have a man-crush on sago, that baby Jahmaica Writes: October 27th, 2007 at 7:22 am wow :D great! Sago Writes: October 27th, 2007 at 11:03 am @RC, cutting down on the anthropomorphism? Nah, it’s one of my favourite isms. Besides, I don’t think Andy wants to start all over again (… he’s got 4 models done already (and they look brilliant)). @Fury_jin, good ideas are always welcome, from anyone. But having a good idea is one thing, making it fit in the story is another. Everyone’s input and opinion is extremely important, but in the end I’m the one who makes the decisions when it comes to the story and the gags…… so yeah, we’re pretty much screwed. @nerdranger, I know….. Kirado Writes: October 28th, 2007 at 6:38 pm thanks for the divx/avi version.. looking interesting. Alexander Ewering Writes: October 30th, 2007 at 2:43 am The funniest part is the censorship sound ;) (just kidding)"
