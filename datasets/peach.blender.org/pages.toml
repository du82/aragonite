full_description = "« Project Peach blog starts Peach DVD pre-sale campaign started! » Jul 28 Blender Institute tour Posted in Blender Institute, Production by Ton Here’s a quick tour in the very cool office where we’ll make the Peach Open Movie. Most of it is undecorated and unfurnished still. But, we keep that wallpaper! 22 Responses Ed Blake (Kitsu) Writes: July 28th, 2007 at 7:48 pm Very cool! Once it is better furnished you should post some (better lit) still shots. It would be cool if someone built a 3d model of it too, for use in promos, literature for any training hosted there, etc. Blender institute virtual tours :) Anonymous Writes: July 28th, 2007 at 8:20 pm Nice office… better than Bungie Software’s in ’94- http://youtube.com/watch?v=rzqHSYe6zFk Anonymous Writes: July 28th, 2007 at 8:23 pm You could probably very easily strip Blender of its features for a powerful virtual tour software package- given that Blender’s already been ported to most OS’s, such a task shouldn’t be so hard. encodi Writes: July 28th, 2007 at 8:37 pm I love the ending where he shows the electric contacts that will be used to play nintendo heh. And yea, a 3d model of the office using WASD to move around w/the blender gameengine would be cool. TOBIAS Writes: July 28th, 2007 at 8:53 pm Excellent place to work, good lighting, a wonderful landscape. Congratulations from Guatemala! Felix Kütt Writes: July 28th, 2007 at 10:28 pm sweet mon, sweet! :D Omar Writes: July 29th, 2007 at 1:58 am Congratulations Dr House… oops Ton. :) Adam Reid Writes: July 29th, 2007 at 2:10 am Looks good! Should be a very productive work environment. Especially with the STFU corner as you put it :) Every office needs a STFU corner! Adam Reid Writes: July 29th, 2007 at 2:11 am Looks good! Should be a very productive work environment. Did you say a shut the !@#$ up corner!? Every office needs one of those! ;) Alex Grace Writes: July 29th, 2007 at 4:29 am Shut the f*** up corner… the coolest corner of all time :P she Writes: July 29th, 2007 at 4:48 am pics pics pics screenshots and pics pics pics! even just for fun! terence Writes: July 29th, 2007 at 7:31 am good, I’m not the only one who thinks Ton looks like Dr. House. Kevin3D Writes: July 29th, 2007 at 2:07 pm Forget Pixar, ILM, Dreamworks… If you want to work in the field of 3D animation and be creative and have fun doing it, go work at Blender Institute, the Bauhaus of the future!! “lock up bad coders”…”shut the f–k up corner”…hilarious!! TheRebirthed Writes: July 29th, 2007 at 4:03 pm I noticed the wonderful view, the kitchen and the shower ! Where is the studio ? lol :D ! I’m sure all the team will make an other very nice film on it ! I’m waiting for some other images and videos now ! And of course the movie to ! :D ! Furry and funny ! mike pan Writes: July 30th, 2007 at 4:25 am Beautiful walkthrough, although a faster server would be nice :D TheRebithed Writes: July 30th, 2007 at 10:02 am mike pan said “a faster server would be nice” It your internet connection is maybe slow because the downloading of the video spent less than 2 minutes… SamArthurAllen Writes: August 2nd, 2007 at 2:41 pm Great walkthrough, loved the STFU corner –all that’s needed now is a BackTFU server to keep those precious renders safe. DaVince Writes: August 12th, 2007 at 1:20 pm “You could probably very easily strip Blender of its features for a powerful virtual tour software package- given that Blender’s already been ported to most OS’s, such a task shouldn’t be so hard.” Why would you want to do that? Use a script to walk through your model, done. ifabio Writes: August 28th, 2007 at 2:53 pm Nice view… I mean the cute Ton ;) tripdragon Writes: September 7th, 2007 at 9:36 pm Ah nice to hear your crazy accent again! Good luck in Peach dudes Daniele Writes: September 18th, 2007 at 11:03 pm Hey!!! Ton looks like Dr House! AHAHAHAH!! Good video guys! YOU ROCK!!! YEAH! Powers Writes: October 4th, 2007 at 12:55 pm This video is dreadful and should be removed immediately! It is very bad PR and most unprofessional. The camera is rocking and lurching and parts much too dark. Also the size is huge (35MB) and thus shows complete technological ignorance. Please remove this and make a proper clip.Blender is a Wonderful program and deserves much better! This type of stuff just makes people in CG prejudiced against Blender and does not help to make people take it seriously… Yours Sincerely and hoping for a Bright Future for BLENDER!"
