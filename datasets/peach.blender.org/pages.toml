title = "Big Buck Bunny   » Random Fluff"
full_description = "Dec 19 High Frame Rate, 4K and Stereo 3D release Posted in Blender Institute, Production, Random Fluff, Uncategorized by Ton Thursday, December 19th, 2013 Hi, Big Buck Bunny is now even more a world standard for video standards. Check this release: http://bbb3d.renderfarming.net/download.html -Ton- Posted in Blender Institute, Production, Random Fluff, Uncategorized | Comments Off on High Frame Rate, 4K and Stereo 3D release Jun 26 Singapore, CGOverdrive and 3dsense Posted in Events, Random Fluff by Sacha Thursday, June 26th, 2008 How 1 week in Singapore can change one’s ideas, goals and direction in life… It was June 15 I took a 12 hour flight to Singapore, to attend CGOverdrive 2008 as keynote speaker and representer of BBB and Blender. And I can say that my first trip to Asia is one that will be hard to forget. (more…) Posted in Events, Random Fluff | 21 Comments » Jun 21 The wedding day of Enrico and Micaela Posted in Random Fluff by Margreet Saturday, June 21st, 2008 The whole Peach team wishes Enrico and Micaela all the best for today, because they are getting married! Have a beautiful day and of course lot’s of love for the future. Congratulazioni, tutta la fortuna per il futuro! Posted in Random Fluff | 21 Comments » Jun 07 Half a million streams, 400k downloads… Posted in Random Fluff by Ton Saturday, June 7th, 2008 Here’s stats from the past week: Vimeo: 300,000 Youtube 215,000 Downloads: Waag.org torrents: 102,000 Sun Microsystems network.com: 120,000 (estimate, reported 29 TB traffic) Sketchworkproductions.com: 125,000 video.blendertestbuilds.de: 55,000 Grand total: 917,000! Pretty good numbers. Without counting all the other mirrors, iso dowloads, our own dvds, and assuming more people watch a single download, we can safely estimate that over a million people have seen BBB now! -Ton- (Note; I did not include the italian mirror, which is most likely between 50 and 100k too. Waiting for their confirmation.) Posted in Random Fluff | 50 Comments » May 30 Big buck Bunny movie files released! Posted in Blender Institute, Events, Random Fluff by Ton Friday, May 30th, 2008 We’ve collected several mirrors worldwide for a stable and – hopefully fast – hosting of the BBB movies. You can download the files in four different flavours, which will nicely work for all common video players and OSes. The download section also has Vimeo and Youtube links for streaming video. Lastly, mirrors with the DVD ROM studio files are also being added now! Have fun watching! And, thanks again for the great feedback and ongoing support. It has been a great ride for everyone here, and I definitely look forward to the next open movie… which – as promised – will not start before the Blender 2.5 project is in usable state. Most likely that’s end of 2008, early 2009. Lastly: don’t stop buying the DVD! Revenues will be used as startup financing for the next Open Movie, and hopefully I can afford to send the full Peach team to Siggraph… -Ton- Posted in Blender Institute, Events, Random Fluff | 262 Comments » Apr 23 The use of violence in open source productions Posted in Events, Random Fluff by Sacha Wednesday, April 23rd, 2008 The day after the BBB premiere Ton was a member of a panel at a conference called ‘Economies of the Commons’, where topics as ‘financing open source and open content projects’ were discussed. Before the panel started Ton gave a presentation during which he also showed material from BBB. During the panel discussion there was a question from an audience member for Ton. (more…) Posted in Events, Random Fluff | 116 Comments » Apr 11 big big buck bunny Posted in Random Fluff by andy Friday, April 11th, 2008 Posted in Random Fluff | 23 Comments » Mar 12 The Happy Blender Institute Tour Posted in Blender Institute, Production, Random Fluff by andy Wednesday, March 12th, 2008 Recently I realized that we never really made a complete Blender Institute tour after this project started. Sure, there was Ton’s first round trip waaaay back, but we needed something new, shiny and classy like this to show you how great this place actually is! Luckily Nathan, our master of rigging, animating and hugging, agreed to improvise a very sincere and pertinent guided VIP tour through the marvels of our beloved work- and living- space. Welcome to the Blender Institute! Ogg file Posted in Blender Institute, Production, Random Fluff | 75 Comments » Feb 20 Interview with Sacha about the Peach externals Posted in Blender Institute, Production, Random Fluff by Margreet Wednesday, February 20th, 2008 For two days we have Roemer around. For school he has to do a practical assignment to focus on the future and get more information about which direction he wants to go to. And luckily he choose Blender :) He interviewed Sacha about the externals helping out the Peach team to get to movie finished on time. Download the .ogg file here. Posted in Blender Institute, Production, Random Fluff | 15 Comments » Feb 13 ‘Special’ help Posted in Random Fluff by Sacha Wednesday, February 13th, 2008 We’re extremely busy, but now we have someone helping us with lighting/compositing. Will it save us? See for yourself. Grab the Ogg Theora file here I guess it’ll stay with only 1 shot (out of 131)… Posted in Random Fluff | 23 Comments » « Older Entries"
