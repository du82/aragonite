title = "Big Buck Bunny   » 2008 » January"
full_description = "Jan 11 American visitor went home Posted in Peach Press, Random Fluff by Margreet Friday, January 11th, 2008 During the last week Nathan had a friend over; Aaron. Aaron just left today with a signed t-shirt from the whole Peach team. Be aware this is a collectors item. The one and only :) Posted in Peach Press, Random Fluff | 9 Comments » Jan 05 Maqina Workstations & Benchmarks Posted in Blender Institute, Development by campbell Saturday, January 5th, 2008 So far our workstations haven’t been mentioned much, partly because it’s not as fun as furry animals but also because they don’t break down! Now the artists are working hard and don’t want to “waste time” blogging, I’ll go into some details about our workstations. Hardware At the moment we have 8 workstations… 5x Maqina C6850DC 3D Blender Workstation’s (Dual Core 3ghz, 4gig ram, GeForce 8800 GTS) 2x Maqina X5130DC Workstation’s (Quad Core 2ghz, 4gig ram, NVidia Quadro FX 1700) 1x Maqina X5345QC Workstation (8 Core 2.33ghz, 8gig ram, NVidia Quadro FX 1700) (more…) Posted in Blender Institute, Development | 89 Comments » Newer Entries »"
