title = "Big Buck Bunny  » Blog Archive   » Half a million streams, 400k downloads…"
full_description = "« Complete Score Available for Download BBB awarded by Cyborg FF » Jun 07 Half a million streams, 400k downloads… Posted in Random Fluff by Ton Here’s stats from the past week: Vimeo: 300,000 Youtube 215,000 Downloads: Waag.org torrents: 102,000 Sun Microsystems network.com: 120,000 (estimate, reported 29 TB traffic) Sketchworkproductions.com: 125,000 video.blendertestbuilds.de: 55,000 Grand total: 917,000! Pretty good numbers. Without counting all the other mirrors, iso dowloads, our own dvds, and assuming more people watch a single download, we can safely estimate that over a million people have seen BBB now! -Ton- (Note; I did not include the italian mirror, which is most likely between 50 and 100k too. Waiting for their confirmation.) 50 Responses Matteo Writes: June 7th, 2008 at 2:31 pm WOW…congratulations Dusty Writes: June 7th, 2008 at 2:48 pm 1,000,001 now! Just shown my Grandma! And she loved it! Christiaan Bakker(AniCator) Writes: June 7th, 2008 at 3:56 pm That’s great news! For both the movie and Blender. But I must say it is a really good movie too. lohborn Writes: June 7th, 2008 at 3:59 pm This is fantastic; Once again I am proud of blender. But I would be a bit cautious, I have downloaded and streamed it 7 times and only shown 2 other people kinduun Writes: June 7th, 2008 at 4:39 pm we love you ton and blender team. Though i am a little ashamed to ask when the iso dvd will be available for download? i am kinda broke. Besides having brought mancandy and ess. blender, i can’t afford the dvd any time soon.. Filipe Soares Dilly Writes: June 7th, 2008 at 4:49 pm WOW! Thats hi! :) Kinduun: I second that… :P Ton: My DVD didn’t arrive yet… Is there a way to know where he is? (like a “package track”). Someone from Brazil has already received the DVD? DingTo Writes: June 7th, 2008 at 5:10 pm Congratulations…that was fast. 1 Million views in about 1 week. You are stars. Setup Writes: June 7th, 2008 at 5:22 pm Yeah! fantastic!! I’ve already watched 6 times and… I still find it hilarious! Congrats from Belgium Ceno Writes: June 7th, 2008 at 5:32 pm I’m still spreading the link from youtube, everbody who watch the video like it :) Cheers from Brasil :) rogper Writes: June 7th, 2008 at 5:52 pm Yea! I had already calculated the statistics :) It’s awesome! Here in Portugal, in theaters, one big Hollywood movie as something about 100’000 viewers in a month :P BBB in a week beat Indiana Jones 4 in the USA. For a short movie that’s something very important ^_^ Congratulations guys! Sam Allen Writes: June 7th, 2008 at 6:24 pm Impressive statistics. Most (if not all) people I have talked to assumed that Pixar made it. That’s good. That’s /really/ good. Surprises me though that more people use Vimeo than YouTube. Kha Writes: June 7th, 2008 at 7:48 pm Congratularions!! Loved the animation!! @Felipe: I’m from São Paulo, Brazil, bought the DVD on 25/05/2008 and it arrived this friday. ton Writes: June 7th, 2008 at 7:49 pm I found isos here: http://www.archive.org/details/BigBuckBunny Please confirm if they work! tmr232 Writes: June 7th, 2008 at 10:09 pm Congrats!!!!!! Are there any interesting Blender 2.46 download stats? Kinduun Writes: June 7th, 2008 at 10:46 pm lol, went to archive.org to download the dvd iso file. At around 7 gig, it’ll take forever to download plus my download manager shows that the server on which the iso is stored on doesn’t have “resume download” support, which means if while downloading the iso file and the server connection gets lost i won’t be able to resume the download. Anyway, archive.org reports that there has been six iso downloads. As for me, Kinduun, i wait till i get paid…to buy the DVD. Much love from everybody in South Africa to ya’ll. Riste Writes: June 7th, 2008 at 11:47 pm Most impressive. The movie looks great, visually is absolutely comparable (or even better) to anything out there. Story is simplistic and in some places a bit more cruel than something pixar would do… But, I love it, my 5 year old son loves it, even my wife likes it! Great short, it shows what Blender can do. Even more, it shows that a very small team of (talented) artists can make wonders in Blender in half a time that any other project of this complexity takes. Keep up the good work. Ton, I have to say that you are true visionary of 3D art! panzi Writes: June 7th, 2008 at 11:51 pm @Kindum: You can reuse the already downloaded data with azureus. It’ll check the hashes of the already downloaded parts and resume with the rest. Matt Henley Writes: June 8th, 2008 at 12:13 am Great statistics! I got my DVD in time to show my 6 year old nephew and he loved it! I never saw it mentioned on slashdot.. was this by design? Matt Petrik Writes: June 8th, 2008 at 12:22 am Can someone give a run down of what is on each of the two disks that come from the foundation. The two downloads on archive.org seem to indicate the two DVD’s are identical except one being PAL and the other NTSC. Also on archive.org there seem to be files in the sidebar but I get errors clicking on those. In short are the two DVD’s as bought from the blender foundation identical other than PAL/NTSC format? surt Writes: June 8th, 2008 at 12:43 am Petrik: The DVD-Video content is identical, but the other DVD-ROM content (tutorials, blend files, etc.) is unique to each disc. Filipe Soares Dilly Writes: June 8th, 2008 at 12:54 am Thanks Kha!!! Muito obrigado! :D Petrik Writes: June 8th, 2008 at 1:00 am Ok so my question remains. What is the content of the two disks as they come from the Blender Foundation? Are the two iso files on archive.org the two individual DVDs as the come packaged from the blender foundation? What I’m looking for is a table of contents of the two disks so I can target my downloads to the bits I want to see. I have limited download capacity. Cuby Writes: June 8th, 2008 at 1:17 am Wow, that’s incredible numbers! Congratulations on the movie as well! It rocks. Ivan Writes: June 8th, 2008 at 3:31 am Congratulations! You should make a kind of teddy bears of the characters! They would make great gifts, collectibles, and a fun toy to play!!! all of them are very hugable. Nate Writes: June 8th, 2008 at 5:28 am does anyone know were I can get the making of video? RH2 Writes: June 8th, 2008 at 6:44 am It’s free, It should get more views than that! Plus what about the torrents? and each download could have been viewed by multiple people… Good Job! rogper Writes: June 8th, 2008 at 11:14 am Hi! So, reporting the .ISO DVD Downloading in my PC (windowsXP x64). It’s working perfectly in Firefox(downloading as I write). With Internet Explorer 7, for some reason reports this error if I try to do save target: http://img394.imageshack.us/img394/1525/isoerrorxu1.jpg and gives unknow page if I just click in the link. Because no one else said nothing, I’m guessing that is some problem of configuration with my IE7… but anyway it doesn’t work ;) Hideki Saito Writes: June 8th, 2008 at 1:13 pm While, at 319, it is nothing compared to great numbers above, I have also published BBB on, Niconico Video. (Due to interactive nature of real time commenting, it requires free registration, unless embedded version…) http://www.nicovideo.jp/watch/sm3527287 Someone else chose to do same for Elephants Dream, and that’s at 1584. http://www.nicovideo.jp/watch/sm185319 Richard Writes: June 8th, 2008 at 1:14 pm @rogper: Most built in browser download managers aren’t designed for files that large. I tried it on my IE6 which also fails. Judging from the message, it looks like it’s reading the Content-Length header and then bailing out due to the size (8059486208). dragonrebel Writes: June 8th, 2008 at 9:07 pm i also showed it to multiple people :p, we watched it on big screen, its sweeeeeeet HolgerB Writes: June 9th, 2008 at 9:41 am Hi, does anybody know which Open movie had more sucess? How many DVDs are ordered by the Prmire for BBB and ED? Thanks Holger Cathy & India Writes: June 9th, 2008 at 11:31 am A million less Cathy & India, who have been forbidden from downloading it and still haven’t received a copy (CAMPBELL!!) Satish 'ILuvBlender' Goda Writes: June 9th, 2008 at 4:01 pm Fantastic news. Its a milestone movie in Blender land. I showed it to my parents and they liked it. I also showed it on a giant screen at my workplace (world famous VFX/Animation company). People really really liked it. Way to go Team Peach. And Ton, you are the true selfless visionary that brought Blender to life. Hats off to you… And not to forget the developers, community all around the world. My total respects to you all.. – Satish Goda. Satish ILuvBlender Goda Writes: June 9th, 2008 at 4:02 pm Fantastic news. Its a milestone movie in Blender land. I showed it to my parents and they liked it. I also showed it on a giant screen at my workplace (world famous VFX/Animation company). People really really liked it. Way to go Team Peach. And Ton, you are the true selfless visionary that brought Blender to life. Hats off to you… And not to forget the developers, community all around the world. My total respects to you all.. – Satish Goda. Ramiroquai Writes: June 9th, 2008 at 6:11 pm Nice work guys!! I like the BBB!!!! Todo esto tendra sus frutos muy pronto, y en verdad gracias por el trabajo realizado. Son muy buenos con la animacion!! Saludos desde Perú! Petrik Writes: June 9th, 2008 at 9:52 pm Ok band width allmost all used up downloading PAL DVD, can we see the tutorial files as separate downloads. Gen X Writes: June 10th, 2008 at 8:55 am Excelente! Ya baje la pelicula,la produccion, el soundtrack y ahora estoy descargando la iso, solo me falta comprar el DVD para acompletar la mision… Es increible tanta belleza en el software libre un millon de felicitaciones! Excellent! Already downloaded the film, production, the soundtrack and now I’m downloading the iso, i need to buy the DVD to complete the mission… It is so incredible beauty in open source one million congratulations! manuel Writes: June 10th, 2008 at 9:27 am I downloaded the PAL .iso file twice and tried to burn it. For both downloads I tried to different burning programs (liquid cd and burn since I am working on a macbook) and it did not work. mounting the image is no problem and works fine. did anyone have the same problem? it would be nice to know, because if not… i might “sacrifice” another DVD using another computer instead. gumanoed Writes: June 10th, 2008 at 10:23 am I’ve got 480 version of BBB last week. ME and about 6 people from local LUG seen it on frayday on meeting. Thenx you guys! Greate movie! ========= russia Petrik Writes: June 10th, 2008 at 11:51 am @Manual Haven’t got around to burning it to DVD yet. Not meaning to state the obvious but you are using a dual layer DVD and DVD writer? manuel Writes: June 10th, 2008 at 2:08 pm @Petrik Well, yes of course … I managed to burn it right after I posted my last thread. i used the OS X internal “burning solution” and that way it worked. thanks anyway nik Writes: June 10th, 2008 at 3:42 pm I watched it on u tube when there were just 12 views Gaute Writes: June 10th, 2008 at 9:11 pm Very good news! I love the movie :) Jeremy from Australia Writes: June 11th, 2008 at 1:00 pm Just watched it! And absolutely loved it! Please produce more, as i love your creativity! Thank you! Al_Doug Writes: June 11th, 2008 at 3:51 pm I saw it, thenm my brother and mom saw it later – one download. Awesome! I love the music, too. It took a couple hours for me to download the middle size, but that was enough. Had trouble playing it on my home computer, though; lost of jerking. Don’t know if it’s because it’s 5 years old? I plan to build a new computer this summer just for Blender, so maybe I can watch it then. Cheers to the whole team! phunamy Writes: June 11th, 2008 at 8:20 pm I downloaded 3 different sizes, but I showed it to everyone in my family, 20+ people. They all loved it and passed on a copy of the files. Charlotte Writes: June 12th, 2008 at 3:02 am Congrats and wonderful job on the movie! I love the animations! The chinchilla creature is so adorable! It’s hard to imagine him a villain… lol. Question about the “IPod 5G 320×180, 62 MB” download link/file: the file downloads, but when I try to open it, there are only sounds, and no images/video! Is it just me, or is there a glitch with the link/file? Thanks a million! J.B. Nicholson-Owens Writes: June 15th, 2008 at 7:14 am Kinduun: Your download software is broken. wget 1.11.1 or later has no problems resuming a download from archive.org. I imagine curl would work as well. Anyone having problems with the DVD ISOs: read the tips on the archive.org website page. Not only do you not need to burn it to watch it, should you decide to burn the disc you can take steps to verify that what you have is complete and correct before you attempt burning so you don’t waste media. However, the best way to get the DVD without downloading anything is to buy the DVD set. It’s inexpensive and the money goes to a good cause and people who are treating us well. ML Writes: August 4th, 2008 at 11:30 pm I’ve tried burning the iso into a dvd and dosent work for regular dvd players -_-, instead end up jamming up the dvd player instead, anyways I have tried retying the burning through Nero and end up with message “The entered block size does not correspond to the image length. the block size may be wrong. Do you want to correct the value or ignore the problem?”, from there i have no idea what to do lol, another program i tried (and also used the 1st attemped) Alcohol 120%, with settings suggested and same effect. ML Writes: August 4th, 2008 at 11:31 pm My brother going try burning the image with his download and I’ll be back with results on that"
