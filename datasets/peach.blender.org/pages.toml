full_description = "« The use of violence in open source productions The release! » May 02 DVD authoring last bits Posted in Blender Institute, Development by Ton We’re doing the last bits on the dvd set… encoding and authoring a video DVD and collecting and testing all files for the DVD-ROM is just a bit too much work to be really fun… especially for people suffering post-BBB fatigue! :) Even after about 6-8 manweeks of work on this DVD we could easily add another four or so. Nevertheless, we should now finish! Here’s a quick shortlist of what you can expect, at least: DVD Video: PAL and NTSC discs High quality encoded film Medium quality versions of film with 5 commentary tracks 20+ minute Making Of documentary with interviews 4 Split view of entire movie as animatic + anim test + Blender UI + final render Outtakes and deleted scenes DVD-ROM: HD versions of movie and extras, 1080p and 720p, in avi and ogg All the .blend files and textures that will render the entire movie Original script and breakdown All storyboard images, test animatic versions The famous “Live edit” blend file, a sequencer setup with audio and animatics, testrenders, finals. Great toy! Test renders, animation tests Gallery with preliminary artwork, over 50 final frames, also in OpenExr Tutorials, html as well as video Documentation about how to re-use blend files Easy-to-use stripped down blender files for quick tests (or for people with humble computers!) 2.46 Blender release Videos with interviews, tours, weeklies… The entire peach.blender.org website Etcetera! Later more… -Ton- 50 Responses JiriH Writes: May 2nd, 2008 at 7:45 pm This sounds just great! Thank you very much in advance. Cannot wait for DVD delivery :-) Lasphere Writes: May 2nd, 2008 at 7:46 pm I just can’t wait!!!! Great work! And nice with tutorials! Tahts a new thing! (: Pablo Lizardo Writes: May 2nd, 2008 at 7:53 pm excelent!!!! sounds we’ll have a lot of fun with both discs!! Spamagnet Writes: May 2nd, 2008 at 7:59 pm Is that all? (Joking!) Manuel R. Ciosici Writes: May 2nd, 2008 at 8:09 pm What tools have you used for authoring? I am trying to do some authoring now and I don’t know what programs to use on linux and don’t want to use windows to author the DVD. ton Writes: May 2nd, 2008 at 8:21 pm Oops. I knew I forgot something to write about… we decided use Mac DVD authoring software. Hired someone to finish it for us even. Acquiring the knowledge to do this in Open Source (if possible even with what we want) would take far too much time. Sorry! J Writes: May 2nd, 2008 at 9:07 pm If I had to use a Mac, I’d hire someone to do it for me too. Vimal Kurup Writes: May 2nd, 2008 at 10:11 pm Great News ! But no Subtitles like we had for Elephants Dream ? dusty Writes: May 2nd, 2008 at 10:13 pm Hey you know what, after spending soooooo long on BBB it’s no wonder you want to get the DVD out and call it closer! Seriously, well done Ton and the team. You guys worked hard and deserve a break. And then, the next project(s)!!! dusty Writes: May 2nd, 2008 at 10:15 pm arrghh! Closer was supposed to say closure! Sorry! BlendRoid Writes: May 2nd, 2008 at 10:52 pm I wish so badly that I had the money to buy this! I know it’ll be online, but even on my super-high-speed-connection-of-doom, getting everything I’d want would take a long time. Not to mention that I’ll likely try to download once the site’s bandwidth has been sucked dry. :D John Drinkwater Writes: May 2nd, 2008 at 10:53 pm Awesome news Ton. It’s just such a shame Dirac support, and the newer Theora encoder, aren’t ready in time for this project (maybe next year!), both look to be incrementally better at encoding video :D In fact, I really do hope Xiph start using BBB as their test video for encoding – The Matrix must get boring after the 1000th watch through ;) …waiting for my DVD, damn it! mfoxdogg Writes: May 3rd, 2008 at 1:53 am great news ton, now that is the true meaning of open content, share everything + plus more :) LOGAN Writes: May 3rd, 2008 at 5:46 am Great new. But I start to wonder a few things. 1: why are the commentary versions less quality? It’s easy to have the same video quality with different audiotracks (where the commentaries could be lower quality. 2: why arent the making of and other extras as DVD video viewable through the video DVD? (I was sorta hoping you would) 3 avi, ogg and mov? Isnt that just burning away space of the DVD? 4 Animatic not as DVD video? 5 I hope you include the seperated channel audio tracks too. 6 curious about the etc. :) Well great news and I’m almost lying in front of the mailbox to await the DVD. (PS. If some part does have subtitles, please use Ariel like fonts in the future) Cheers ton Writes: May 3rd, 2008 at 12:40 pm 1. DVD has maximum bandwidth for streams, which has to be divided between audio and video. There are 5 commentary tracks in this stream, leaving less for video quality. 2. The “making of” is part of dvd video 3. If so, we delete it 4. Animatic is in the 4-split 5. Not in the dvd, later online 6. You ask too many questions! No subtitles in the docu nor in the commentary… the film itself is dialog-free though. campbell barton Writes: May 3rd, 2008 at 4:38 pm @John Drinkwater, Have been talking to the guys at xiph and we’ll make sure they get a hard disk with PNG’s and EXR’s as well as the 5.1 flac audio. There are also some tools missing to get an image sequence into a Ogg movie, to make the oggs we had to modify png2theora, an example program in theora’s svn repo. They are open to improving this tool for inclusion in their default install, make it easier for the next project :) some guy from germany Writes: May 3rd, 2008 at 5:13 pm KEWL! I’m looking forward to getting that thing (looking in my mail box every day :) ) BTW: Will there be a possibility to buy elephants dream again? I love that movie so much! Rui Campos Writes: May 3rd, 2008 at 11:37 pm The best solution in my opinion to encode HD Video is with x264 (H.264) inside a Matroska container. It yields excellent results for HD, with small sizes and really amazing quality. It also allows for multiple subtitles (not needed in this case unless for captioning of the commentary tracks), multiple audio tracks and it just looks awesome. If I could get a hold of the final rendered pngs I could encode it as such for anyone interested… — Rui — grafixsuz Writes: May 4th, 2008 at 3:22 am Amazed by the amount of work the BF is putting into these DVD’s to make the value worth it for all those who supported the movie by pre-ordering the DVD @Rui, of course people will be interested. You are offering a service. wuluba Writes: May 4th, 2008 at 5:32 pm hej everyone, I have a question about preordering the DVD: How can I buy this DVD WITHOUT using the Blender-Store? Even though I don’t think there is something wrong with it I just don’t feel comfortable to subscribe to it. Most likely I will only use it once in a lifetime (maybe three or four times more for the next movies) but that doesn’t justify the submition to a “noname”-internet shop. I really like to support the team and I like to have a REAL DVD of this movie but not under these circumstances. LetterRip Writes: May 4th, 2008 at 6:13 pm wuluba – it uses paypal… Tynach Writes: May 4th, 2008 at 11:10 pm YAY!!! I can’t wait to get my pre-ordered DVD in the mail! Feng Writes: May 5th, 2008 at 1:06 am Is it legal to distribute the DVD over BitTorrent? Alexander Ewering Writes: May 5th, 2008 at 3:20 am wuluba: Do you also go outside with an oxygen mask to avoid getting the flu? Koots Writes: May 5th, 2008 at 5:13 am I am wondering how many Tutorials are going to be on the DVD. Does anyone have any idea how much learning info we can expect? I already pre-ordered my DVD (back in Dec. 07) I can’t wait to get it! Carlos Writes: May 5th, 2008 at 8:08 am Wow! This is amazing. I expected getting a lot of stuff when preordering, but this is just crazy. I’m glad to see you’re throwing in some blender files for modest computers since that precisely what I own (and also I have very poor blender skills). I was seriously really looking forward to get the DVD. Now I’m really really anxious! You’re really great guys! Thank you very much for all the hard work. wuluba Writes: May 5th, 2008 at 2:06 pm Alexander: No reason of being sarcastic! But sorry, I’m not registering to any online store that you can find on the internet! It’s not that I wouldn’t trust blender it is just I don’t feel comfortable with it. I had no problems with it calling blender, I pay for the DVD and they send it through mail and after I received my DVD they forget about me. But for what reason do I have to apply to an online store which I use once in a lifetime? It just feels wrong. AntonG Writes: May 5th, 2008 at 3:04 pm wuluba, just be patient and wait for a torrent release. Will be there, trust me :) You must be joking, right? -AntonG ERM Writes: May 5th, 2008 at 3:44 pm Aw man, you guys are making the DVD so awesome I’m going to have to buy it! I didn’t buy the Elephants Dream one because by the time I heard about it, the DVD was sold out forever. Now I’m pretty darned sure that I’m going to buy this one. One question, do these blend files need some cvs (or svn) version of Blender? Didn’t you guys have the new hair code and all that? ton Writes: May 5th, 2008 at 6:49 pm – The dvds have blender 2.45.17 on it (rc3), and all blends were tested with it to render OK. – Once we send the DVDs out the CC license becomes effective, so people can put op torrents for it. – We are preparing ourselves a giant launch with many mirrors for the movie too, about 1 week after the first dvds were sent – Apart from what we already published, there are two new video tutorials on the dvd… and html tutorials. super super Writes: May 5th, 2008 at 10:54 pm just want to say happy birthday to Sacha Gooberstein (Sago). happy 35th man, hope this year will bring you less uglyness and more womens…. by the way, what is the peach gang going to do for Sacha? just a hint, a hairy naked man jumping out of a cake would make Sacha’s birthday happy indeed!….if you know what i mean…. Squamashii Writes: May 5th, 2008 at 11:38 pm Thankyou so much…a bit early…I can’t wait to get the DVD. DiThi Writes: May 6th, 2008 at 5:08 am import dvd, Blender while not dvd.release.in_home(): Blender.Draw.PupMenu(‘I WANT IT’) Blender.Draw.PupMenu(‘Whoohoo!!’) # Can’t wait, aaarrgh!!!! DiThi Writes: May 6th, 2008 at 5:12 am (damn, python indent doesn’t show up here) My pre-order back in september was worth the money :D MrNoodle Writes: May 6th, 2008 at 8:06 am Patience lads. Pierre Writes: May 6th, 2008 at 12:20 pm Hi Ton, are you working on a new project already. Are you looking for recruitment. NathanKP Writes: May 6th, 2008 at 5:52 pm That looks really good to me! NathanKP – Inkweaver Review DJ_BOXER Writes: May 6th, 2008 at 8:09 pm Everything looks to be awsome. Checking my Post box in my building daily. already have some WIP for the files. Gianmichele Writes: May 8th, 2008 at 6:08 pm So, the final day is May 15th, isn’t it ? Just a week, just a week… J.B. Nicholson-Owens Writes: May 8th, 2008 at 8:27 pm If the movie and everything else on the DVDs is licensed to share (such as the CC Attribution license), then yes, not only can you distribute copies of the DVDs, you can build on anything on the DVDs to make new things (movies, TV shows, websites, posters, etc.). Gianmichele Writes: May 8th, 2008 at 9:45 pm Hey Ton… I’ll send my reel for Durian, that’s for sure :D scardario Writes: May 8th, 2008 at 9:48 pm Thanks for such a great work!!!! you guys are making of blender one of the greatest design software out there! I hope the DVD doesn’t take to long to get to my hands. A runner Writes: May 9th, 2008 at 12:43 pm That is really aaaaaaawwwwwsommeee. I want to see Blender in the First Place of all 3D Softs on Earth. because My Friends always say that “Oh blenderrr; I’ve seen it, It’s Tuff and confusing” but I want to show them this second Movie of the Simple Opensource Software and Shut their mouths up. Even before tying the software they come to a Mistaken conclusion on my Blender, Which I don’t Like. If I had money, I would have Ordered it First of all. but unfortunately I don’t have money and even a net connection. Ok, no probs Just keep improving Blender and Hit the 3D world with Lots n Lots of surprises and features of Opensource. am waiting . . . A runner Writes: May 9th, 2008 at 12:46 pm That was not “Even before tying the software” | It is “Even before trying the software” Chainz Writes: May 9th, 2008 at 3:44 pm And I’m gonna see the movie tonight in Wrocław Cinema!!! Thanks to the Libre Graphics Meeting 2008! Yupi! Chainz Writes: May 10th, 2008 at 10:41 am Indeed! It’s a great movie! I’ve seen it yesterday – thank you LGM. Now I’m so happy, as never before. :) But I just can’t resist the feeling that Big Bunny (the character) is Ton himself – same poses, exactly same smile! Come on Ton! Tell us the truth! :) With Best Regards Chainz alexander malic Writes: May 20th, 2008 at 5:09 pm hope the iso’s will be soon downloadable via bittorrent :) thanks in advance for the great work. expecting a very very great movie. regards, alex Mike Writes: July 10th, 2008 at 7:20 am i always use Super DVD Creator to convert video formats to dvd and make dvd menu. it’s really pretty good. you can use it:http://www.sharewarecheap.com/Super-DVD-Creator_software_930.html Rigs Writes: February 19th, 2010 at 6:19 am Just received my DVDs. Great Job !! Just a quick question: The PAL movie looks better than NTSC one. Waht I mean is the character movements looks smoother in PAL movie. Is there a reason for that? Regards."
