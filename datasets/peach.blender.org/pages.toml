full_description = '« random environment, rodent & rabbit renders Project Peach is Pretty Proud to Present… » Feb 03 just another manic friday Posted in Blender Institute, Random Fluff by andy as we mentioned earlier, it’s getting quite busy over here. and now that the Apricot Team is moving in finally, it’s gonna get even more busy! Last friday we had Bart from BlenderNation over to do interviews with us… i shot a fun little timelapse video during the entire day. it’s interesting to see how often people get up from their chairs, how much coffee we drink and how crazy our heads bob around… enjoy! watch the movie in .ogg format 20 Responses BlendRoid Writes: February 3rd, 2008 at 5:04 pm Whoa, using Blender ALL DAY; that has to be fun! Oh wait, I already do that… AntonG Writes: February 3rd, 2008 at 5:25 pm hehe, cool … go go go ;) -AntonG Brian Writes: February 3rd, 2008 at 5:26 pm Ok everyone. Take a shot every time Andy gets up to get coffee. AniCator Writes: February 3rd, 2008 at 5:47 pm Man, according to the timelapse it takes a long time to render those bunnies!? @ndy deserves those cups of coffee. – AniCator Christiaan "AniCator" Bakker Writes: February 3rd, 2008 at 5:48 pm Man, according to the timelapse it takes a long time to render those bunnies!? @ndy deserves those cups of coffee. Christiaan "AniCator" Bakker Writes: February 3rd, 2008 at 5:48 pm woops double post anonymous Writes: February 3rd, 2008 at 6:10 pm I’ve found out there is a service like youtube, but with HD quality. It’s called vimeo.com. Maybe when the movie is ready you can use it to embed the video on your website. Thomas "twilight" Zimmermann Writes: February 3rd, 2008 at 6:11 pm hehe, I would like to not just use blender all day but to earn my money using blender all day long ;-) Christiaan "AniCator" Bakker Writes: February 3rd, 2008 at 7:04 pm Vimeo.com….. I saw that one on BlenderNation too. The Interview with Ton! jim ww Writes: February 3rd, 2008 at 8:09 pm ha! this needs a soundtrack. those bobbing heads and manically shifting bodies look like they are all moving to an uptempo beat. Anthoni_C Writes: February 3rd, 2008 at 8:23 pm Man, with yall working that fast yall should have the movie done in no time…. :P ha! voOdKa Writes: February 3rd, 2008 at 10:35 pm On dirait des fourmis :O anonymous Writes: February 3rd, 2008 at 11:02 pm haha I can’t believe it. It’s the last time I suggest something before clicking on the links. TheANIMAL Writes: February 4th, 2008 at 6:05 pm Funny, thing is that this was only sped up by x1.3 Moxab Writes: February 5th, 2008 at 1:00 am heh, it looks like Andy is the one working the most. Maybe it’s because you can only see his monitor. William Writes: February 5th, 2008 at 12:39 pm Well, german efficiency, you know. LoMac Writes: February 6th, 2008 at 5:26 am Frickin hilarious Bart Writes: February 6th, 2008 at 9:20 am If you look *really* hard you can see the entire movie on Andy and William’s screens! derek-hey! Writes: February 6th, 2008 at 11:44 pm lol. I know. I liked seeing the renders going up on Andy’s screen. Furious head bobs too. Francisco Ortiz Writes: February 8th, 2008 at 3:58 pm Thats awesome!'
