["https://peakbagger.com/history/history.aspx"]
title = "Site Updates and History - Peakbagger.com"
full_description = "There is now a new mapping option that allows users to see 10 GPS tracks for a peak on a map at once. You can get to these maps from a peak page, just above the list of ascents. There are also links to these maps from the “All Viewable Ascents/Attempts” page for a peak. The maps show the different GPS tracks color-coded so you can tell them apart. You can highlight and click on each track to see the date, climber name, route used, and trip report link for each track. There are two versions of this map. The “Recent Tracks” option shows the 10 most recently uploaded tracks for the peak, and will show the routes used most recently. The “Different Routes” option attempts to show tracks for as many different routes as possible, based on the route name entered by users. Since users often do not enter route names, or use different variations of a name, this map may not be super-reliable about getting different routes. In the absence of route info, it will just show recent tracks instead. First, you can now append entire lists to one of your personal lists. This can save time in creating a personal pick-and-choose list—you can add peaks from multiple other list to your new list, without having to add the individually. More info here. Also, ascent listings of recent ascents for peaks on a peak list are now available from the List page. There are two listings: one shows the 200 most recent for any peaks on the list, and the other show the most recent ascent for all peaks on the list. This can help you plan trips based on what others have been climbing recenty in the area covered by the list. The various ascent listings have been updated to better show which ones have useful content, such as trip reports, GPS tracks, and/or external links. The ascents shown on the peak page are now sorted with the most recent ones first, and icons and links show which ones might be most helpful. The “My Ascents”, “Ascents for Peak”, and “Ascent Subset pages were also updated."
year_published = 2025
