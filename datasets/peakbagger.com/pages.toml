["https://peakbagger.com/ListIndx.aspx"]
title = "Peak Lists - Peakbagger.com"
full_description = 'Welcome to the massive Peakbagger.com "List of Lists"! Page too long? Search for a list using the List Search Page Peakbaggers love lists. There are millions of peaks on the earth, but only a subset are usually considered worth "bagging": the highest, most prominent, or otherwise most special summits. Lists are central to the entire endeavor of peakbagging, and creating, organizing, and debating lists is a time-honored tradition in peakbagging circles. The goal of this web page is to host the most comprehensive collection of peak lists in the world. Note that list names above that are not hyperlinked are in development and are not yet ready for public consumption. Also, I freely admit that there are many errors in these lists. I have tried to make them as accurate as my time will allow, and have checked them over, but I make mistakes. Most common are likely to be errors of omission, leaving out a peak that should be on a list. In addition, new maps come out with new elevations, or sometimes there is conflicting information. Feel free to e-mail me (see the "Contact" link below) with any corrections, or with any new lists you would like to see added to this page. A final note--lists with over 1000 peaks on them only show the peaks climbed by a specific climber, not the entire list. If this page is for a specific climber, or if you are logged in, clicking on a big list will only show peaks that climber, or you, have climbed. Otherwise you cannot see these "big lists" due to their size.'
