["https://peakbagger.com/Contact.aspx"]
title = "Contact Page - Peakbagger.com"
full_description = 'If you have comments or questions, you can e-mail me by typing the following address into your e-mail program: The email address above can be used to notify the webmaster of any copyrighted material posted on the site, under the provisions of the Digital Millenium Copyright Act (DMCA). Any takedown notice will be addressed as promptly as possible. Please put "DMCA" in the subject of any takedown notice email. This website has no fees to view any content, and no advertisements served to logged-in users. All costs associated with running this site, including hosting fees and software purchases, come from PayPal donations and minimal ad revenue. If you find the content here useful or interesting, you can make a totally optional PayPal donation that helps keep the site running. Use the button below to donate any amount. (Note that Peakbagger.com is not a 501(c)(3) charity and and PayPal gifts made here are not tax-deductible in the USA.) Peakbagger.com is a free web site that is both a hobby and a place for me to post some of the mountain-related information I have collected over the past 30 years. The database at the core of this web site began with handwritten and typewritten lists of mountain peaks I made as a child. By 1987 the first of these, a list of high summits in the Northeastern U.S., had made it onto a computer as an elaborately formatted text file. Over the years I added more and more to this list, which by 1994 was in a spreadsheet format and had over 1000 mountains all over the world. I added peaks by hand, or from large public-domain databases like the GNIS and BGN gazetters. Eventually the list was moved into a real database system, and supporting information about ranges, lists, prominence, and isolation was fleshed out into full-fledged sub-systems. I have verified and modified data by checking what I have against a wide variety of sources, including standard reference works as well as internet newsgroups and web sites. Peakbagger.com was launched in 1997 with a very limited amount of content, and mainly served to host various trip reports of some of my climbs. The new and re-designed site, launched in April, 2004, preserved the old content, added lots more, and hooked up with the master database to provide a huge array of dynamic web pages for peaks, ranges, and lists of peaks.'
