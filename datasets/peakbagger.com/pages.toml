["https://peakbagger.com/RangIndx.aspx"]
title = "Ranges Home Page - Peakbagger.com"
full_description = '''This page is the gateway for browsing the Peakbagger.com Mountain Range Classification System (PEMRACS), a huge, consistent, hierarchical database that divides the entire land surface of the earth into ranges and subranges. There are tens of thousands of named ranges and mountain groupings on the planet, varying greatly in size, elevation span, and mountaineering interest. Often, smaller ranges are nested within other ranges, and larger ranges contain numerous sub-ranges. Comparing ranges and creating lists of range high points is difficult if all ranges in the world are treated equally. For an extreme example, any system that treats the Himalaya range of Asia and the Watchung Mountains of New Jersey as equivalent is next to useless. The core of the PEMRACS is a classification of the world's ranges into a six-level hierarchy, with the general idea that all ranges at the same level are roughly equivalent in extent and interest. The six levels are simply called Range1, Range2, and so on, down to Range6. A Range1 is equivalent to a continent, while a Range6 is a tiny massif or range of just a few peaks. The PEMRACS is set up so that every Range1 through Range5 is completely divided into between 2 and 10 non-overlapping Ranges of the next lower level. For example, a Range2 will be divided into a number of Range3s, and each one of those in turn is divided into Range4s. For example, the Rocky mountains (a Range2) is divided into Range3s like the Canadian Rockies, the Yellowstone area Rockies, and the Southern Rockies. In turn, the Southern Rockies Range3 is divided into Range4s like the Sawatch Range and the San Juan Mountains. Note that every level is chock-full of bogus ranges with bogus-sounding names like "North Eureka County Ranges" or "Shavers Fork Mountain Complex" that are needed to fill out the master outline. Very few mountains will have well-known and established range names for all six levels of ranges. Most commonly, peaks are in one or two commonly used ranges: Mount Rainier is in the Cascade Range; Mount Elbert is in the Sawatch Range of the Rocky Mountains. Some peaks might have three well-known ranges—for example, Mount Washington in the Presidential Range of the White Mountains of the Appalachian Mountains. And some peaks have no ranges at all—Kilimajaro springs to mind. So, in order to classify these peaks into all six levels, the slots missing familiar names are filled with bogus ranges.'''
year_published = 2025
clearnet = "https://peakbagger.com/RangIndx.aspx"
