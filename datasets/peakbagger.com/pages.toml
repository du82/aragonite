["https://peakbagger.com/Climber/Login.aspx"]
title = "Login Page - Peakbagger.com"
full_description = '''To create an account, you need to request an activation code. Below, enter your e-mail address and, to prevent frivolous accounts, answer a simple question: What is the highest peak on earth? This is not a trick question--just enter the common English name of the world's highest mountain, measured by elevation above sea level. Important: Double-check your email address above and make sure your email account spam filter is not blocking the activation code email. Creating an account allows you to track your climbing and hiking online. With an account you can add your ascents and hikes to a master database, entering as much or as little information as you want. The minimum is the peak you climbed and the date, or you can enter a full set of information, including statistics, a trip report, GPS track, photos, and other data. Once you have entered ascent information, this web site automatically generates nicely formatted reports of your climbs and progress made towards completing peak lists. Click here to search the list of climbers currently using the site for peak tracking, with links to their lists. This can be an excellent way to share your peakbagging adventures with family and friends. If you are not comfortable with sharing, you can elect to have your account (or just certain climbs) only visible to you when you log in. There is no extra content on this web site available to those with accounts. The only benefit is that you can enter your personal climb information, see nice reports of your data, and others can see it on the internet. If you have forgotten your password, fill in your email address below and then click the "Send Password Reset Link" button. A link to a password reset page will be sent to your email account--click on the link in the email to enter a new password.'''
year_published = 2025
clearnet = "https://peakbagger.com/Climber/Login.aspx"
