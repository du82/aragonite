["https://peakbagger.com/help/TermsOfService.aspx"]
title = "Terms of Service - Peakbagger.com"
full_description = "By the actions of accessing, browsing, and interacting with Peakbagger.com, all site users agree to the following terms and conditions: Peakbagger.com provides no warranty or guarantee of any kind and is not liable or responsible for any consequences from any use of any information or content presented on the site. The master Peakbagger.com database of peaks and associated content has thousands of errors in it, and text content, trip reports, and GPS tracks from the site's administrators and users are subjective and not necessarily authoritative. Outdoor activities such as hiking and mountain climbing are dangerous and can result in death or injury. Peaks lists on the site may change at any time and there is no guarantee of accuracy. Information uploaded to Peakbagger.com by site users, including ascent information, trip reports, provisional peaks, GPS tracks, and photographs, all becomes part of the master integrated Peakbagger.com database, which is an asset wholly owned by Peakbagger.com. Site users retain the rights to content they have uploaded and are free to continute to own and redistribute that content themselves. All data in the Peakbagger.com database and web site is copyrighted and any unauthorized attempt to copy, duplicate, mine, scrape, or otherwise take any content from the site is copyright infringment and will be pursued to the extent of the law. Peakbagger.com does not share user information (names, email addresses, browsing history, etc.) with any third parties for any reason. If a third party contacts the site administrator asking to contact a registered site user for a legitimate non-commercial purpose, then the message may be forwarded to the user, who can then choose to respond to the third party as their discresion. The only exception to the data sharing policy is for search and rescue purposes when a user's life safety is at risk while in the mountains. Peakbagger.com uses a cookie that stores a user’s name, unique site ID number, and site preferences such as preferred unit of measurement. This is only used to allow users to quickly return to the site using a specific browser without having to log in again. No other cookies are used by the site for any other reason."
