["https://peakbagger.com/Default.aspx"]
title = "Peakbagger.com Home Page"
full_description = "Peakbagger.com is a free web site that presents information and statistics about the mountain peaks and mountain ranges of the world. In addition, registered peakbaggers can log their ascents, post trip reports, and track their climbing activity. The site is based on a large dynamic database of peaks, lists, ranges, and climbers. There is now a new mapping option that allows users to see 10 GPS tracks for a peak on a map at once. You can get to these maps from a peak page, just above the list of ascents. There are also links to these maps from the “All Viewable Ascents/Attempts” page for a peak. The maps show the different GPS tracks color-coded so you can tell them apart. You can highlight and click on each track to see the date, climber name, route used, and trip report link for each track. There are two versions of this map. The “Recent Tracks” option shows the 10 most recently uploaded tracks for the peak, and will show the routes used most recently. The “Different Routes” option attempts to show tracks for as many different routes as possible, based on the route name entered by users. Since users often do not enter route names, or use different variations of a name, this map may not be super-reliable about getting different routes. In the absence of route info, it will just show recent tracks instead. These two phone apps work as a mobile interface to the same database used by Peakbagger.com, so data entered in the app will appear online here, and vice-versa. Your login information (email and password) will work on this web site, and the mobile apps. The apps have a sleek mobile interface and implement a selected subset of the full site's functionality. (Click on screenshots below to see larger images.) Download of these apps is free. An Android smartphone experience for Peakbagger users! This app is full of functionality and you can view, manage, and add your ascents on the go. An iPhone/iPad experience for Peakbagger users that is feature-compatible with the Android app! Both apps were created by the same team and are maintained in tandem."
