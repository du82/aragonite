["https://www.pearlleff.com/stem-cell-donation"]
title = "On Donating Stem Cells | Pearl Leff"
description = "Join a bone marrow registry."
full_description = '''It was my first week at a new job and my phone was ringing with an unfamiliar number. I picked it up. "Hi Pearl, this is Shannon from Gift of Life. You've been identified as a match for a bone marrow donation." What? I tried to place where I'd heard that configuration of words before. Finally, my mind pinpointed a thirty second episode that had taken place years earlier. One day in college, I had walked past a table emblazoned with a Gift of Life banner. I'd never heard of the organization, but Libby, a friend behind the table, noticed me and urged me to "Get a cheek swab! Something something bone marrow!" It sounded vaguely like a good idea and I donated blood all the time, so I quickly swabbed my cheek with the Q-tip they provided, jotted down my contact information on the package, and hurried off to my next class. Within minutes I had forgotten all about it. A lot of procedure, it turned out. Gift of Life concentrates their resources in the areas where they do the most work, but I didn't live near any of those areas. This meant that I had to drive 40 minutes to the lab that was registered with their system for each procedure, and there were a lot of procedures. A blood test to confirm the blood was a match. A physical examination. A vein check. A signature that I wasn't pregnant. A certified blood test showing that I wasn't pregnant. Another certified blood test showing that I wasn't pregnant. (I don't know what was up with that. I spent a lot of time proving and re-proving that I wasn't pregnant.) Another concern I had was that the efforts put forth would ultimately be for nothing. This was not the first time that I had received a request from Gift of Life: they had called months earlier asking me to donate white blood cells, a minor procedure. I had undergone a physical examination and blood test, only to receive a call the day before the scheduled donation informing me that the procedure had been canceled. It was a frustrating experience that left me feeling uncertain about the reliability of the process.'''
