["https://www.pearlleff.com/the-value-of-an-undergraduate-degree"]
title = "The Value of an Undergraduate Degree | Pearl Leff"
description = "College forces you to learn the things that aren't fun."
full_description = '''When I was finishing up with high school, I found myself wondering what my next steps should be. I knew I wanted to go into tech, one of the least credential-focused industries around. I also knew I was good at teaching material to myself - I'd self-studied seven Advanced Placement (AP) exams the previous year. In fact, I enjoyed the self-study process a lot more than I enjoyed slow lectures and tedious homework. It was the mid-2010s and "college dropout" was the mark of an up-and-coming genius. Headlines were questioning the need for degrees at all and billionaire Peter Thiel was awarding high school graduates $100,000 not to attend college and become entrepreneurs instead. "Not long ago, dropping out of school to start a company was considered risky," wrote the Wall Street Journal. "For this generation, it is a badge of honor, evidence of ambition and focus." You've surely had the experience of speaking to someone who is passionate about something in your field, and then realizing after a while that they have no history or context for their ideas - and that that has caused them to overlook major problems with their argument. So you're going to solve the Israeli-Palestinian conflict. Are you aware that Israel has considered trading land for peace many times, and it has only worked twice? Do you know when those times were? What factors do you think contributed to those successes, and all the other failures? What does your solution include to address those factors? Knowing your background and addressing potential criticism in advance grounds your argument and makes you much more credible. On Dr. Sean Carroll's alternative science respectability checklist for getting scientists to take your revelation seriously, the first requirement is to "acquiring basic competency in whatever field of science your discovery belongs to." People are surprisingly consistent throughout time and space, and whatever you've thought of, someone else has almost certainly thought it before. Examining what those before you thought is a powerful cheat code to be able to skip a lot of thinking yourself; instead of figuring everything out from first principles, you can instead see what other people thought, and what criticisms were leveled against them, and what happened when their ideas were put into practice. This saves you a lot of energy and allows you to build on the shoulders of those before you, anchoring your ideas into a long tradition of people trying to solve the same problem.'''
year_published = 2025
