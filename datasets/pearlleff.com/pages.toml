["https://www.pearlleff.com/staying-grounded-as-a-thinker"]
title = "Staying Grounded As A Thinker | Pearl Leff"
description = "The key to forming true beliefs is to engage with reality as much as possible."
full_description = '''Have you ever tried to reason with someone whose mind is made up? Good luck with that. You can argue until you're blue in the face, but it's rare for people to change their minds, no matter how great your arguments are. One would assume that people who had joined an extremist organization dedicated to white supremacy would cling tightly to their beliefs. But for over 200 Klansmen, the simple act of meeting a friendly black person was enough to change their views on black people as a whole. Blues musician Daryl Davis has "what some might call an interesting hobby. For the past 30 years, Davis, a black man, has spent time befriending members of the Ku Klux Klan." Davis talks about his initial experience meeting a Klansman that started it all: This is shocking and counterintuitive, but it replicates. In a similar story, the son of a KKK Grand Wizard and creator of Kids Stormfront, a junior version of the white supremacy magazine, broke away from the movement after meeting blacks and Jews in college. After an entire lifetime steeped in white supremacist beliefs, it took simple direct experience to highlight that reality did not match his theories. We all like to think we've rigorously thought out our beliefs, but most of us are not too different. We form hypotheses about how life works and about why things are the way they are, forgetting about our lack of actual experience with the thing we're drawing conclusions about. It's a problem that affects not just KKK members, but intellectuals, housewives, and every human being alive. It's why thinkers and intellectuals have a well-known tendency to become disconnected from the real world, and why academia is often sneered at as an ivory tower. There's a saying that "only the smartest people could be so stupid," an idea immortalized in William F. Buckley's quip, “I would rather be governed by the first 2,000 people in the Boston phone book than by the faculty of Harvard.” What's the solution? The antidote to inaccurate theories is always reality. But without engaging in real life and the experiences that will present counterevidence, people believe inaccurate things for a long time - possibly forever. Had these KKK members not met Daryl, who intentionally sought them out, it's not likely they would have ever changed their minds about non-white people.'''
year_published = 2025
