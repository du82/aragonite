ling.” The Revel Dashboard also tracks the engagement levels of each class. Boykin finds this particularly useful when evaluating the success of her asynchronous courses, which can often feel less engaging due to their virtual nature. When using Revel, Boykin finds that she is able to surpass these limitations and maintain an interactive learning environment. “That’s a big piece of why I use Revel – to give students that interactive component compared to them just getting another textbook and having them read chapters and writing papers about it,” she says. Intuitive Interface Additionally, Boykin praises Revel for its easy-to-navigate interface. After becoming pregnant and giving birth to twins, Boykin describes being able to manage both her newborns and her students because she uses Revel. “With its ease and flexibility, you can literally do it while handling newborns! I feel like it’s pretty intuitive. It’s not cumbersome to navigate. Even if I make mistakes, they’re easy to fix.” Overall, Boykin views Revel as an invaluable asset as she journeys toward becoming a professor. It is a platform that helps her ensure her students’ success by offering an engaging and immersive learning experience and allowing her to keep track of each student’s individual performance. Revel is not only building a path towards her students’ success, but also helping to pave the way for Boykin’s success as a professor. October 24, 2024"
