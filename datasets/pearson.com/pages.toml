full_description = '''.bg-500380601 { background-image: url('/content/dam/global-store/en-us/images/AL2043201-1-1200x600-gradient.jpg'); background-size: ; background-position: bottom; background-repeat: repeat; } @media screen and (max-width: 767px) { .bg-500380601 { background-image: url("/content/dam/global-store/en-us/images/800x970-AL2005272.jpg"); } } MyDietAnalysis A powerful learning tool that makes tracking and analyzing food intake and activity levels easy and accessible — anytime, anywhere. Get started Already registered? Use your Pearson login to sign in. Sign in to Mastering Sign in to MyDietAnalysis Forgot username or password? No account yet? Register now! Student access Educator access Need help? AskPearson Overview Benefits Student Perspective What's New Contact Us Nutrition tracking and analysis made easy MyDietAnalysis is a powerful learning tool that provides students with a clear and intuitive way to track and analyze their diet and activity choices, using the most accurate and up-to-date nutrition information available. MyDietAnalysis is powered by Trustwell (formerly ESHA) and gives students access to an extensive database of 162,250 foods that includes ethnic foods, name-brand fast foods, and convenience foods. Students practice and learn nutrition analysis through hands-on diet tracking. Unlike calorie counting apps, MyDietAnalysis helps students analyze nutrition by creating and analyzing detailed nutrition and activity reports. MyDietAnalysis is integrated directly into all Mastering Nutrition and Mastering Health courses, or it can be purchased separately. Play Privacy and cookies By watching, you agree Pearson can share your viewership data for marketing and analytics for one year, revocable upon changing cookie preferences. Disabling cookies may affect video functionality. More info... Accept Read the transcript Benefits Easy tracking Friendly visual design and cues make it easy for students to track and analyze their diet and activity choices. Diet tracking Students practice and learn nutrition analysis through hands-on diet tracking and by analyzing a variety of nutrition reports. Activity tracking The Activity Tracker gives students access to nearly 1,000 physical activities and allows them to immediately add the duration to track expended calories. Diet Tracking Close Diet Tracking dialog Activity Tracking Close Activity Tracking dialog Hands-on practice Students can personalize a variety of profiles and reports for analyzing diet and energy expenditures. Multiple profiles Students can create up to 6 profiles, and track daily food intake and activity for each profile for up to 7 days. Nutrition reports Using their tracked data, students produce and analyze a variety of detailed nutrition reports. Students also get hands-on diet analysis practice using the auto-graded Case Study Activities. Multiple Profiles Close Multiple Profiles dialog Nutrition Reports Close Nutrition Reports dialog Course tools Easily customize assignments and assign automatically graded assessments specific to your course. Track reports Instructors can easily assign reports in MyClass for easy tracking of submissions, and also submit, review, and comment on student reports. Auto-grading Instructors can easily assign personalized, auto-graded assessments within Mastering. Track Reports Close Track Reports dialog Auto-Grading Close Auto-Grading dialog Student perspective Hear what students have to say about using MyDietAnalysis and what they like most about key features like nutrition and activity tracking and reporting. Profile Creation and Activity Tracking Play Privacy and cookies By watching, you agree Pearson can share your viewership data for marketing and analytics for one year, revocable upon changing cookie preferences. Disabling cookies may affect video functionality. More info... Accept Read the transcript Nutrition Tracking and Reporting Play Privacy and cookies By watching, you agree Pearson can share your viewership data for marketing and analytics for one year, revocable upon changing cookie preferences. Disabling cookies may affect video functionality. More info... Accept Read the transcript What's new Visual design With the most extensive redesign in MyDietAnalysis history, the new design introduces a clear visual hierarchy and intuitive approach that prioritizes information, helping student comprehension and navigation. Revised written content is pared down to focus students on important content and key actions, while consistent labeling saves time. Profile set up Students can set up and edit as many as 6 profiles, and then track daily food intake and activity for each profile for up to 7 days. Visual avatars help students recognize where to enter information and where to take action, and illustrated progress reports for each profile enable students to track progress. Trackers Diet and activity trackers feature new easy-to-use search and Quick Select options plus simplified navigation for locating a section, adding information, and taking an action. In the Diet Tracker, “Find or create food” and “Add to diet” now appear on one screen, so students immediately see how added foods are building a diet. The updated serving size documentation for estimating portion sizes has been simplified. New Search, Quick select, Create, or Add recipe tabs show the options for adding foods, while the new “Add to days” feature makes it easier to copy and add foods from one day to another. Help when and where students need it Students get just-in-time support as they complete steps for each task and receive effective feedback. Updated information icons and error messages give students clear and consistent direction. The updated overview Tips provided in each section offer students additional help. Reporting Simplified report settings make it easier for students to customize and personalize reports to meet specific course needs. Reporting functions let students analyze and produce detailed nutrition and activity reports using tracked data from their different profiles. MyClass MyClass provides more effective class management tools for working with students and refining class setup. Instructors customize settings in MyClass and flag which reports are required, making it easy to track student submissions and allowing students to quickly see which assignments and reports to complete. Let’s connect You can count on your Pearson representative to help you find best-in-class solutions to ensure you’re achieving all your classroom goals. Connect with us to request a product demo, receive sample materials for your courses, and more. Connect with a Pearson representative'''
