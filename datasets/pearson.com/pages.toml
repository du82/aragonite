["https://www.pearson.com/channels/analytical-chemistry/learn/jules/ch-7-activity-and-the-systematic-treatment-of-equilibrium/activity-coefficients"]
title = "Activity Coefficients Explained: Definition, Examples, Practice & Video Lessons"
description = "Master Activity Coefficients with free video lessons, step-by-step explanations, practice problems, examples, and FAQs. Learn from expert tutors and get exam-ready!"
full_description = "In order to express the ionic strength based on the concentrations of species, we calculate its activity with the use of an activity coefficient. Now, the activity coefficient uses the units of gamma. Remember, your ionic strength is given by ac=[c∗γc]. A here represents the activity of the compound, c represents the concentration, and this gamma represents our activity coefficient. The activity coefficient is a way of testing to see if our solution behaves ideally or not. We're going to say here, if our solution is behaving ideally, for example, if we have A+B→C. If our solution is behaving ideally, that would mean that our activity coefficient equals 1. When I performed the equilibrium expression for this, it would become c, with whatever the coefficient, it becomes the power to the c divided, times aa times bb. That's if our solution is behaving ideally. Under ideal conditions, it just means that all the species dissolved within my solution all behave in the same way and have the same level of effect. It ignores differences in size and charge. But in actuality, there are differently sized ions and compounds within a solution, each of which exerts a level of influence greater or smaller than the next ion or compound. That's when your activity coefficient does not equal 1. The activity coefficient is used to see whether we have an ideal solution where all the ions are treated the same, or a non-ideal solution where they are not treated the same. The activity coefficient and ionic strength can be more closely connected and related to one another with the extended Debye-Hückel equation. This equation is log(γ)=−0.51∗z2∗ionic strength1+α, where your activity coefficient equals negative 0.51 times z2 times the square root of your ionic strength divided by 1 plus alpha, with alpha representing the size of the ion, typically done in picometers, but other length units can be used. We're going to say, as your ionic strength, which is μ, increases, that's going to cause your activity coefficient to decrease. There's an inverse relationship between the two. The greater your ionic strength, the lower your activity coefficient. As the activity coefficient approaches 1, which we call unity, then the ionic strength will approach 0. That's because, remember, when your activity coefficient is approaching 1, that means we're acting ideally. That would mean that all the ions are treated the same. Ionic strength is just looking at all the ions within a solution. If the ionic strength equals 0, that means that there is no way of differentiating the ions from one another. They all have the same level of influence. When your ionic strength is different from 0, that means that we have to take into account the different concentrations of each ion and the charges involved, which is why we've been using that formula from earlier. As the size of an ionic charge increases, the more the activity coefficient moves away from unity. So, the less likely it is going to be next to 1, equal to 1. That's because a larger charge has a greater impact and causes the solution to deviate from an ideal presence. Then finally, the smaller the ionic size or alpha, the greater the effects of the activity coefficient. That makes sense because the smaller your ionic size gets, the less of an impact and influence they have in terms of differentiating themselves within a given solution. So just realize that this is really just theoretical in terms of how ions interact with each other. In reality, there are no ideal solutions. Ions are of different shapes and charges. Therefore, they have different influences on one another within a solution. The activity coefficient is just a way of talking about this deviation from the ideal solution where everything is treated the same, even though everything is not the same. So now that we've talked about activity coefficients, let's look at example 1 in the next video where we just simply write out the solubility product expression for the following compound. So guys, this takes into account what we've learned thus far in terms of writing down the activity expression for a compound and relating KSP to that concept."
