title = "Solubilty Product Constant Explained: Definition, Examples, Practice & Video Lessons"
description = "Master Solubilty Product Constant with free video lessons, step-by-step explanations, practice problems, examples, and FAQs. Learn from expert tutors and get exam-ready!"
full_description = "So here we're going to say that solubility represents the maximum amount of solute that could successfully dissolve in a solvent. Remember, when a solute successfully dissolves within a solvent, we create a homogeneous mixture known as a solution. Now we're going to say associated with any solid, any ionic solid, is a Ksp value. This Ksp value is our solubility product constant. We're going to say here, the larger your solubility product constant, then the more soluble an ionic solid is in a solvent, so the more of it breaks up. And then we're going to say here the smaller the solubility product constant, then the less soluble an ionic compound becomes within a solvent. Just remember, if we're looking at the solubility of any ionic compound, associated with it is a Ksp value. Now that we've gotten that out of the way, click on to the next video and see how we look at example 1 when we're asked to figure out what our solubility product constant is for a hypothetical ionic compound when given its molar solubility. So here we're told we have a hypothetical compound with the formula M3X and it has a molar solubility of 0.00562 molar. We're asked, what is the value of the solubility product constant for this hypothetical ionic compound? Now, with Ksp here, we're dealing with our ionic compound. It's going to break up into its ions. The metal which is M, breaks off. This little 3 here came from the metal so its original charge was 3 plus. Remember, ions in solution are aqueous. Plus, there are 3 × negative ion. Here we have our equilibrium equation. With Ksp, we're talking about how it forms an equilibrium. And with equilibriums, we'll set up an ICE chart. So we have initial change equilibrium. Remember, we ignore solids and liquids within an ICE chart. They're breaking the whole thing up in pure water, so initially, our ions are 0 and 0. But their products are being formed, so the change is going to be plus x for this. This is a 3 here, so this is plus 3x. Bring down everything, so plus x and plus 3x. Now, Ksp is an equilibrium constant and like all other equilibrium constants, it equals products over reactants. But here when we're dealing with the saturated solution, we're going to say here that, we have our ionic compound as a solid so it's going to be ignored. Remember, we ignore solids and liquids. So Ksp will just equal products. So in this case, it will equal M3+ and X3−. The 3 here makes this 3x but it also cubes it. It make it becomes the power. We're going to plug in what we know at equilibrium for each one of these ions. So at equilibrium, M3+ is x and X− is 3x. So plug it in. So x times 3x which is cubed. So that's going to be x times 3 cubed; 3 × 3 × 3 equals 27, and then this x cubed. Multiply together gives us 27x to the fourth power. So that's what Ksp equals. Now realize here when they give us the solubility of the ionic compound, that solubility itself represents x. So all we're going to do now is plug that value in for x, so we'll write it over here. Ksp equals 27x to the fourth, so that's 27 times 0.00562 to the fourth. What you're going to do here is take that number to the fourth, then multiply by 27. So 27 is going to multiply 9.9754 × 10−10. Multiply that by 27 so that comes out to 2.69 × 10−8. And like other equilibrium constants, Ksp has no units. So it's just that number which gives us option D. Just realize here when they're telling us the molar solubility, they're giving us what x equals for the entire ionic compound. Using that is key to determining your Ksp. KSP. Now that you've seen example 1, take a look and see if you can do example 2. Here we're asked to figure out the highest molar solubility of each ionic compound given. Here we have to determine what the x variable backwards. Moving in the opposite direction to help us to isolate x for each situation. And from that, you'll be able to see which one has the highest x value and therefore the highest molar solubility."
