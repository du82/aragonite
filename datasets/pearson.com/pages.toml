["https://www.pearson.com/channels/analytical-chemistry/learn/jules/ch-6-chemical-equilibrium/the-equilibrium-state"]
title = "The Equilibrium State Explained: Definition, Examples, Practice & Video Lessons"
description = "Master The Equilibrium State with free video lessons, step-by-step explanations, practice problems, examples, and FAQs. Learn from expert tutors and get exam-ready!"
full_description = "When it comes to chemical reactions, we're going to say that many of them never go to completion. This means that reactants do not completely convert into products. As a result, reactant concentrations do not go down to 0. We're going to say that these types of chemical reactions reach a chemical equilibrium in which the forward and reverse reactions are happening. What this means is, for example, we have, 3 moles of H2 gas reacting with 1 mole of N2 gas to produce 2 moles of ammonia gas as a product. What happens is initially, all we have are reactants. Over time, those reactants will break down in order to recombine to form this product. We're going to say moving in this forward direction to make the product, we have associated with it our rate constant in the forward direction. When enough time has passed, the products have built up to a sufficient number, it will begin to break down and move in the reverse direction to reform our reactants. That has associated with it the rate constant for the reverse direction. Now when it comes to these rate constants, they're tied to the rate. Here in our forward rate and our reverse rate, we're going to say initially again we only have reactants, so we're going to start out with our forward rate in which reactants break down to form products. Realize here that over time this forward rate will decrease. That's because we're having fewer and fewer reactants that can break down, so the forward rate is slowing down. At the same time, we have no reverse rate initially because there are no products, but once our products reach a sufficient amount, it'll begin to break down and reform our reactants. When that starts to happen, we start to get a reverse rate. Over time, both of these rates will reach a number in which they are equal. When the rates become equal in both the forward and reverse direction, that is when equilibrium is established. Now with equilibrium, we have our capital K variable here which is our equilibrium constant. The equilibrium constant is equal to your rate constant in the forward direction divided by your rate constant in the reverse direction. It is also equal to products over reactants. Now remember, in the latter part of chemistry, gen chem when you guys took it, remember what's associated with our equilibrium constant is our equilibrium expression. Here we ignore solids and liquids. We're going to have here NH32 / H23 * N2. So this would represent our equilibrium expression or equilibrium equation. Now, if we had actual values for the products and reactants, we could plug them in and find a numerical value for our equilibrium constant K. By knowing what that value is, we can determine which side of the equation is favored. Is the product side favored, meaning that our reaction will move more in the forward direction to make more products, or is it favored in the reverse direction? Now if we're going to talk about that, we have to take a look here at these 3 images. Now in the first image, realize here we have our reactant A, our product B. We start out with some reactants initially, no products initially. Over time our reactants break down to form products. Realize here because of that our reactants over time are decreasing while our product is increasing. Around the 5-minute mark, we can see that their amounts reach a plateau where they stop changing. It is at that exact moment at 5 minutes where equilibrium is established. Here again remember K equals products over reactant so that's B over A. At equilibrium, it looks like B is equal to around 8, A is equal to around 1. So K here is 8. We're going to say here when K is more than 1 or greater than 1, that means that the forward direction is favored and products are favored because if you're favored in the forward direction, that means you're moving in the forward direction more so to help make more products. In this one here, we can see that our reactants are still decreasing, products are still increasing. But at the end when equilibrium is established, we still have more reactant than we do product. Here we'll say this is around 6 it looks like and then B here looks like it's around just over 4. In this situation, you can see that your K is less than 1 and that means that the reverse direction is more favored and that means your reactants are favored. So again, the magnitude for K, whether K is equal to or greater than 1, it means that products are favored. If it's less than 1, that means reactants are favored. In this last image at 5 minutes, they both meet at around 5. So K here equals 1 which means that we are at ideal equilibrium. So when K equals 1, that's when we're at ideal equilibrium. So it's equal to 1. So no direction is favored and products and reactants are both favored. Just realize that when it comes to the equilibrium of a chemical reaction, it's moving both in the forward and reverse direction. Because the rate of the forward direction and the rate of the reverse reaction gets to a value that's equal after x amount of time, at that moment chemical equilibrium can be established. As we go deeper and deeper into chemical equilibrium, we'll talk about additional topics such as equilibrium concentrations of reactants and products at the end, ice charts of course, as well as other important topics. But fundamentally remember that equilibrium cannot be established until the rate of the forward and the rate of the reverse reactions gets to an equal value."
