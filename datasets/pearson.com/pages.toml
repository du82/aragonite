full_description = "Global Permission Granting .bg568060028 { background-image: url('/content/dam/one-dot-com/one-dot-com/global/Images/landing-headers/1440x960-getty-1223604450.jpeg'); background-size: ; background-position: top; background-repeat: repeat; } @media (max-width:320px) { .bg568060028 { background-image: url('/content/dam/one-dot-com/one-dot-com/global/Images/landing-headers/1440x960-getty-1223604450.jpeg.transform/tiny-size-xs/img.jpeg'); } } @media (max-width:480px) { .bg568060028 { background-image: url('/content/dam/one-dot-com/one-dot-com/global/Images/landing-headers/1440x960-getty-1223604450.jpeg.transform/tiny-size-xl/img.jpeg'); } } @media (max-width:991px) { .bg568060028 { background-image: url('/content/dam/one-dot-com/one-dot-com/global/Images/landing-headers/1440x960-getty-1223604450.jpeg.transform/medium-size/img.jpeg'); } } @media (max-width:1199px) { .bg568060028 { background-image: url('/content/dam/one-dot-com/one-dot-com/global/Images/landing-headers/1440x960-getty-1223604450.jpeg.transform/big-size-xs/img.jpeg'); } } @media (min-width:1200px) { .bg568060028 { background-image: url('/content/dam/one-dot-com/one-dot-com/global/Images/landing-headers/1440x960-getty-1223604450.jpeg.transform/big-size-xl/img.jpeg'); } } If you would like to use content from Pearson products, for instance, in your course, workshop, organization, publication or document, you will require written permission. Please use the form below if you wish to use an extract or portion from a Pearson product. If you would like to adapt, reproduce or translate an entire Pearson product, please contact Global Rights Licensing. To request permission to use extracts from Pearson's assessment products, visit one of our regional Pearson Assessment websites. If you are having trouble accessing your purchased copy of a Pearson product or having trouble with your access codes, please contact Pearson Support. If you suspect that a Pearson product has been used without the necessary authorization, then please report the alleged infringement here: https://www.pearson.com/report-piracy.html. Make a request Guidelines Before submitting your request via the online form, please look at our guidelines below: When completing the form, please note the following items: The turnaround time for completion of your request is 2 - 3 weeks depending on the age of the product which contains the content you wish to use. Check the credits, acknowledgements, and notes on the copyright page or at the back of the publication to verify if Pearson is the publisher. Copyright for photographs, illustrations, and poems usually belongs to the photographer, illustrator, or poet rather than the publisher. Copyright for quotes made by historical or well-known figures also rarely belong to the publisher. Unfortunately, we are unable to check this material on your behalf. If the product you are requesting is out of print, please check if the content you require is available in a newer edition. If it is, request for the content from the newer edition. The online form contains all the required fields to process your request. Omission of this information will cause a delay in the processing of your request. Depending on your request type, you may have to submit a copy of your page or screen containing the requested content, as well as the acknowledgement page of the Pearson product. There are two types of requests: Educational: select this type on the form if you are using Pearson owned content in a teaching setting (physical and/or virtual) or for your studies Commercial: select this type on the form if you are wanting to republish portions of Pearson owned content If you are uncertain as to which type of request you require, please fill in the commercial request form and note this in the comments section. If you are an agent or vendor requesting permission on behalf of a third party, please ensure you complete the third party’s address under licensee details. Please do not use the requested content if a grant confirmation has not been received and a signed copy of the formal grant letter has been returned to us. Frequently Asked Questions I have an urgent request. What are your turnaround times? Our general turnaround times are 2-3 weeks for processing most requests. Requests for older titles may require 3-4 weeks for processing. If your request is urgent, please indicate the urgency and the reason in the comments section on the online form. Why do I need to provide acknowledgment pages? Acknowledgement pages list third party content used within a publication and Pearson only provides permission for the use of Pearson owned content and not for any third party owned materials. I don’t have all the details that are required. What are the minimum details needed to process a request? The minimum requirements are marked with an asterisk (*) on the online form. These details include your details, our product details, the content being requested, how and where you will be using the content and the details of the institution or company you are requesting on behalf of. Can you provide copies of the content I wish to use? No, we are not able to make copies or high-resolution files of the required content available to you. The permissions granting team are only able to provide you with the relevant permission grant to reproduce the content. Can you provide details of authors or the estates of authors for titles where the rights have reverted? We can unfortunately not assist you with author information. You will need to obtain the details of the author or his/her estate in the event that the author is deceased and request permission from them directly. I am not sure how many students will register for the course. Can you grant permission in the interim? Permission can only be granted once the number of students has been confirmed. I do not know who will publish my book. Can you grant permission in the interim? We will not be able to grant the required permission because the Publisher’s details are required to finalise the Permissions Grant. Can I request permission retrospectively i.e once the material has already been used? No, permission must be requested before using the material. Can I post content that has been approved on social media websites? No, you may not post Pearson content on social media websites. We require our content to be protected when online. If a book is out of print does it mean that it is now in the public domain and can be used without permission? No, whether a book is in the public domain needs consideration of various factors which is dependent on the country of origin too. Please consult with your permissions or legal team for further information."
