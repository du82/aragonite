full_description = "Strategies for active learning in Intermediate Macroeconomics Uncover strategies for increasing student engagement in Intermediate Macroeconomics with modular content, current news, and interactive simulations from Dr. Pierre Yared and Dr. Nicolas Vincent. April 24, 2025 1:00 PM April 24, 2025 1:30 PM Live Online Economics Today 21st Edition: The Future is Now Explore the future of economics with experts Roger LeRoy Miller and Thomas Knight. They discuss recent developments, AI's impact, and the new learning tools in the latest edition of their textbook. February 11, 2025 3:00 PM February 11, 2025 4:00 PM Duration: 60 minutes Experiential Learning: A Path to Career Readiness Join Nicole Coomber to explore how experiential learning equips students with the skills and knowledge needed for career readiness. Discover effective strategies to enhance classroom engagement. December 3, 2024 1:00 PM December 3, 2024 2:00 PM Live Online Increasing student preparedness and success with Revel By Liz Lebold “It’s the best textbook I’ve ever read because there is no fluff and it’s easy to read,” says an economics student at the University of North Carolina at Greensboro (UNCG). “You actually want to read it.” A textbook college students want to read? Unusual though it may seem, many economics students at UNCG express comments like these, ever since their professor began using Revel: Microeconomics Interactive, 1st Edition by Parkin, Bade, and Sarbaum. April 12, 2024 The top 5 Revel features you should be using By Pearson Looking for an easier, more dynamic way to inspire your students’ learning? Revel® teaching and learning platform from Pearson will feel like a joy compared to textbooks as it integrates videos and dynamic interactives into compelling digital narratives. The platform keeps your students on pace, provides a clear view of their engagement and performance, and is easily accessed from the first day of classes. It puts them in the digital driver’s seat and on a smoother road to success. Revel improves students' course grades and exam scores. In our numerous research studies, the data show that students who engage with Revel are more prepared for class and get better grades. In addition, instructors benefit when they use Revel performance data to identify struggling students. Taking a moment now to learn about Revel’s top features can help improve the learning experience for your learners of today and tomorrow. Revel’s top 5 features — 1. Educator Dashboard: offers an at-a-glance look at overall class performance. It helps instructors more easily identify and contact struggling and low-activity students, ensuring that the class stays on pace. By identifying at-risk students you can implement early intervention strategies to help them succeed in the course. 2. Embedded Assessments allow for practice and review, improving comprehension, filling learning gaps, and providing feedback. Students can practice and quiz themselves to review concepts while easily assessing their understanding to better prepare. 3. Shared Writing Assignments foster critical thinking through writing without significantly impacting your grading burden. Throughout each narrative, self-paced journaling prompts encourage students to express their thoughts without breaking stride in their reading. Assignable shared writing activities direct students to share written responses with classmates, promoting peer discussion. Essays integrated directly within Revel allow you to assign the precise writing tasks they need. 4. Shared Media Assignments enable instructors and students to post and respond to videos and other media. Students can also record and upload their own presentations for grading, comments, or peer review. Video quizzes engage students while checking their understanding of concepts. Instructors can share videos accompanied by time-stamped multiple-choice questions. 5. Instructor App enables instructors to easily view performance insights and contact struggling and low-activity students to help them get back on track – anytime, anywhere. Teaching tools to love — Inspiring active learning enables students to explore, contextualize information, and apply concepts as they read. It unlocks students’ curiosity and immerses them in subjects, reading and practicing in one continuous experience. Research shows this approach leads to higher recall of key concepts versus passive engagement alone. Notetaking, highlighting and more make learning fully digital and highly engaging, providing students everything needed for a course — through one continuous, integrated learning experience. Highlighting, note taking, and a glossary let them read and study however they prefer. Instructors can add notes, too, including reminders or study tips. Monitoring student progress allows educators to monitor student progress on assigned reading, which is a good indicator of how the class is doing. By tracking reading and having the option to make it a percentage of the final grade, they can hold students accountable and keep them on track. It's a smooth ride to the future with Revel. Read how from other instructors and the impact Revel has had in their classroom and the lives of their students: February 3, 2023"
