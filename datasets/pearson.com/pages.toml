["https://www.pearson.com/channels/anp/learn/bruce/the-blood/leukocytes"]
title = "Leukocytes Explained: Definition, Examples, Practice & Video Lessons"
description = "Master Leukocytes with free video lessons, step-by-step explanations, practice problems, examples, and FAQs. Learn from expert tutors and get exam-ready!"
full_description = "In this video, we're going to begin our introduction to leukocytes. Leukocytes are also known as white blood cells, and they can be abbreviated as WBCs. These leukocytes, or white blood cells, play a very important role in immunity to defend our bodies against pathogens, or disease-causing agents. Later in our course, we're going to do a very deep dive on immunity and many of its aspects. But for now, we're going to keep the focus specific to leukocytes and some fundamentals that you should know about them. Unlike red blood cells or erythrocytes, white blood cells or leukocytes are not confined to the blood. Although white blood cells can be found in the blood, they can use the bloodstream to travel where they are needed in the body. Many white blood cells can actually migrate out of the bloodstream into the surrounding tissues to perform their functions, unlike red blood cells, which are confined to the bloodstream. Leukocytes can broadly be categorized into two major groups based on their appearance under a light microscope after staining. These two groups are granulocytes and agranulocytes. The granulocytes, as their name implies, contain cytoplasmic granules that are easily visible under a light microscope. Agranulocytes, on the other hand, do not contain easily visible cytoplasmic granules. However, these cytoplasmic granules can still be present in agranulocytes but are not easily observed. Let's take a look at our image, where we can piece some things together. Notice on the left-hand side, we have the same test tube that we've seen before in our previous lesson videos, showing the blood separated out into its three major components: the plasma, the buffy coat, and the erythrocytes. The white blood cells are present in the buffy coat region, which is why we are highlighting that buffy coat region to indicate that this is where the leukocytes can be found. Leukocytes can be broadly categorized into two major groups based on their appearance under a microscope after staining. The first major group is the granulocytes. In all of these granulocytes, you can very easily see the cytoplasmic granules under the microscope after staining. Moving forward, when we discuss them, you can come back and fill in these interactive blanks for these three types of granulocytes that we'll discuss in more detail. The second major group of leukocytes are the agranulocytes. There are several different types of agranulocytes that we are going to cover moving forward in our lesson. What you'll notice is that these agranulocytes do not have visible cytoplasmic granules inside of them, like what you could see with the granulocytes. This categorizes them into this group, agranulocytes. As we move forward and discuss more details about these agranulocytes, you can come back and fill in these interactive blanks that you see throughout. This concludes our brief introduction to leukocytes, and moving forward we'll be able to apply these concepts and learn more about them. I'll see you all in our next video."
