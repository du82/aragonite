["https://www.pearson.com/channels/analytical-chemistry/learn/jules/ch-6-chemical-equilibrium/le-chatelier-s-principle"]
title = "Le Chatelier's Principle Explained: Definition, Examples, Practice & Video Lessons"
description = "Master Le Chatelier's Principle with free video lessons, step-by-step explanations, practice problems, examples, and FAQs. Learn from expert tutors and get exam-ready!"
full_description = "Le Chatelier's principle states that if we have a chemical reaction at equilibrium and we do something to disturb that equilibrium, the reaction will adjust by shifting either in the forward direction or reverse direction in order to minimize any changes so that it stays at equilibrium. Now, there are a lot of different things that we could do to try to disrupt this equilibrium, so we'll go through each one of the scenarios and see what effects that have on the chemical reaction itself. First, we can talk about reactants and products. We're going to say here if you are adding reactants or removing products, that means that our reaction is going to shift to the right, which means the forward direction. We'd be shifting this way. That's because if you're adding reactants, you need to get rid of the excess reactants you've just added, and the only way to do that is to move in the forward direction to get rid of it. In the opposite way, if you remove any products, you need to remake the products that you've just lost. How would you do that? Again, you would move in the forward direction or to the right to replenish and remake those products. So if we're shifting to the right, that means that wherever we're moving, we'll be increasing in amount. Here we'd expect our products to be increasing to make up for what we lost, and we'd expect here our reactants to be decreasing just in case we added reactants. So just remember, adding reactants or removing products we shift to the right. Now, if we do the opposite, we should expect the opposite result. So if I remove my reactants, I need to remake the reactants I've just lost. How would I do that? My reaction would have to move in the reverse direction or to the left to remake the reactants I've just lost. If I add additional products, how do I get rid of those additional products that I've added? Again, I'd move in the reverse direction to get rid of them. So again, under this situation, we're going to shift to the left or the reverse direction. Again, wherever we're heading, we'll be increasing an amount. So here, my reactants would be increasing an amount as a result, and my products would be decreasing an amount. So remember, adding or removing products will have some type of effect in terms of my reaction. Remember these two principles, whether you're adding or removing reactions or products determines which direction it won't shift. So come back, click on the next video, and see what happens when we adjust the pressure or volume."
