title = "Chemical Thermodynamics: Entropy Explained: Definition, Examples, Practice & Video Lessons"
description = "Master Chemical Thermodynamics: Entropy with free video lessons, step-by-step explanations, practice problems, examples, and FAQs. Learn from expert tutors and get exam-ready!"
full_description = "When we talk about entropy, we need to realize that entropy is closely related to the second law of thermodynamics. This states that molecular systems tend to move spontaneously to a state of maximum randomness or disorder. All of this is saying is when it comes to our total entropy which is also our entropy of the universe, it is ever increasing. That means that the universe itself is becoming more and more chaotic. Universes or galaxies spin out of control. Their stars eventually explode, become, supernovas and eventually become black holes. The whole nature of the universe is one of degradation and breaking down into basically nothingness and chaos. I know it sounds a bit depressing but that's the general idea behind the second law. Everything moves to a state of disorder and randomness. Here, Δsuniverse or Δstotal equals Δssystem which is our chemical reaction plus Δssurroundings. Together, following the second law of thermodynamics, this will always be greater than 0 because it's always increasing. Now, here we're going to say again the disorder chaotic behavior is classified as entropy which is our Δs variable. We're going to say here that we can talk about Δs in terms of phase changes as well. This helps us determine what the sign will be for a particular process. Now here, if we take a look, we're going from a solid to a liquid to a gas. If we're going from a solid to a liquid, we say that that phase change is called melting or fusion. If we're going from a liquid to a gas, that's vaporization. Then we can go straight from a solid to a gas which is sublimation. In these processes, we're going to say the distance between molecules are increasing because remember, in a solid, the molecules are tightly held together. In a liquid, they're around each other but they're able to fully move around. In a gas, they're very spread apart. We're going to say here we can see that we're going from a more ordered state to a less ordered state as we transition towards gases. As a result, we're going to say here that our entropy is increasing. So ΔS increases. In these processes, because they're all increasing my entropy, we see that ΔS sign will be positive. Now, if we look at it the opposite way, if we're going from gas to liquid to solid, gases are the most entropic and we're becoming more and more ordered as we move to the right. We're going to say here the distance between molecules are decreasing as they become more tightly packed as they transition to the solid state. In this case, we'd say that our entropy is decreasing. If our entropy is decreasing, that means that the sign of our entropy would have to be negative. Again, remember, entropy deals with chaos or disorder. The second law says that the natural processes or spontaneous processes of the universe is to always increase our entropy. Δsuniverse will be greater than 0. Remember, in phase changes, you can have a positive entropy or a negative entropy depending on what type of phase changes can occur. Now it is possible for us to have an entropy equal to 0, but this is hard to come by. This is our third law of thermodynamics where the entropy is equal to 0 at absolute 0. The temperature would have to be 0 Kelvin. At 0 Kelvin, all motion stops within any given object and it's at that instance that the entropy of that object is exactly 0. Now, we're going to say here that this 0 Kelvin is highly theoretical. The average temperature of the universe itself is around 2 Kelvin. This 0 Kelvin is just a theoretical number. If we were able to get to that temperature, we assume that all motion would stop. But again, we haven't been able to get to that number so that's why it's highly theoretical. Now that we understand the basic generalities of entropy, we'll move on to the next video where we talk about comparing the entropies of different compounds to one another. So click on the next video and see how we approach comparisons of entropy."
