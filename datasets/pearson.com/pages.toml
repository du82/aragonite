["https://www.pearson.com/channels/anp/learn/bruce/bones-and-skeletal-tissue/an-introduction-to-bone-and-skeletal-tissue"]
title = "An Introduction to Bone and Skeletal Tissue Explained: Definition, Examples, Practice & Video Lessons"
description = "Master An Introduction to Bone and Skeletal Tissue with free video lessons, step-by-step explanations, practice problems, examples, and FAQs. Learn from expert tutors and get exam-ready!"
full_description = "Hello, and welcome to our unit on bone and skeletal tissue. Now, before we dive in and learn any new material, I always like to remind people and orient people to the fact that bone is living dynamic tissue. I say this because, so often when we think of bones, we think of a skeleton—something that's been dead, maybe for 100 or even 1000 years, or a Halloween skeleton. It's not something that we associate with life, but bone is living tissue. It has blood in it. If you break it, it's going to bleed. It has living cells in it. Those cells reproduce and replace themselves. The skeleton you have now is different than the skeleton you had 10 years ago. Bone responds to its environment. How you use bone is going to affect its structure. Alright. So, with that in mind, what we're talking about is the skeletal system, and the skeletal system comprises approximately 206 bones. There's a little variation from person to person, and also the associated cartilage. To illustrate that, we have a person here showing us his bones. We can see the skeleton. We can see the 206 bones of the body. Now, I've told you there are 206 bones in the body, but we are not learning the 206 bones of the body in this unit. You are going to learn them later. We'll go over that later in another unit. Right now, we're talking about bone generally. What is bone? What are the types of bone? How is bone built? What does bone do? So, to start with that, let's talk about the major functions of bone. Here we have 5 major functions. It's always difficult to put a number on it because someone may count something a little differently, but this is the way I like to think of it. First up, bone supports the body. To illustrate that, we have a flying buttress on a cathedral here. Bone is the hard thing in your body that holds you up and gives you its shape. And for some things, they will only work with that structure. Your lungs, for example, need the structure of the ribs to work. Second, bone is going to protect soft organs. To illustrate this, we have a knight in armor here. That armor protects his body. Well, your body has things like your rib cage or your skull to protect the soft organs inside, and they do a pretty good job of it. Right? You can take a punch to the head. Now, you don't want to. It may hurt you, but for the most part, in the end, you'll be okay because you have a cranium that is going to protect that soft, really delicate brain inside. Another thing bone is doing is it's going to produce blood cells, and that's going to happen in the bone marrow. We can illustrate that here. We show a factory, and a factory is producing these blood cells coming out from that bone marrow, which is located inside of bones. Bone is also going to store things. Specifically, it's going to store fat or triglycerides and also minerals, specifically Ca+2. To illustrate that, we have a refrigerator filled with food, and the fat that it's going to store in your body, that's going to be in the form of another type of marrow. That calcium, well, that's just in the matrix of the bone. You have a ton of calcium, and your body can use it. Finally, bone is going to act as levers for muscles. To illustrate this, we have a little guy here, and he's lifting up something with the help of a lever. Now bones work with muscles. Muscles do one thing: they pull. What do they pull on? They pull on your bones, and when they do that as a lever, well, your arm bends. We're not going to talk about that in as much detail in this unit. In this unit, we're really going to focus on the structure of bone, how bones are built, and what bones do physiologically. I'm looking forward to it. So let's get to it."
