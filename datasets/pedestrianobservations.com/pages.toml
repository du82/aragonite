["https://pedestrianobservations.com"]
title = "Pedestrian Observations | For Walkability and Good Transit, and Against Boondoggles and Pollution"
description = "For Walkability and Good Transit, and Against Boondoggles and Pollution"
full_description = "2025-02-21 YIMBY First, Building Reform Second Last night I asked the American building reform advocates on Bluesky about different layouts and why developers don’t build them. I got different answers from different advocates about why the layout I’d just mocked of family-size apartments with two staircases isn’t being built in the US, some about regulations, but Mike Eliason said what I was most afraid of hearing: it’s doable but it’s more profitable to build small apartments. My conclusion from this is that while American and Canadian building regulations remain a problem and need to be realigned with European and Asian norms, they are a secondary issue, the primary one remaining how much housing is permitted to be built in the first place. Developers will keep building the most profitable apartment forms until they run out of the most profitable tenants. The mockup The following mockup has a scale of 1 meter = 20 pixels, so the building is overall 18 meters by 30. This is a point access block rather than a double-loaded corridor (see definitions here), but it also has two staircases, emanating from the central access block. Each floor has four apartments, each with three bedrooms and two bathrooms, the ellipses in the image denoting bathtubs. The windows are top and bottom, but not left and right; these are single-aspect apartments, not corner apartments. On Bluesky, I said the floorplate efficiency is 94%; this comes from assuming the step width and landing length are 1.1 meters each, a metrization of the International Building Code’s 44″, but to get to 94% assumes the staircase walls are included in the 1.1 meter width, so either it’s actually 90 cm width or, counting wall thickness, the efficiency is only 92.5%. The IBC allows 90 cm steps in buildings with an occupancy limit of up to 50, which this building would satisfy in practice at six stories (a three-bedroom apartment marketed to a middle-class clientele averages closer to two than four occupants due to empty nests, divorces, guest rooms, and home offices) but not as a legal limit. Regardless, 92.5% is average by the standards of European point access blocks, whose efficiency is reduced because the apartments are smaller, and very good by those of American double-loaded corridors. Now, to be clear, this is still illegal in many American jurisdictions, as Alfred Twu pointed out in @-replies. The building mockup above has two means of egress, but the typical American code also requires minimum separation between the two staircases’ access points. This is an entirely useless addition – the main fire safety benefits of two staircases are that a single fire can’t interpose between residents and the stairs if the two staircases are at opposite ends of the building, but that’s not legally required (quarter-point staircases are routine), and that the fire department can vent smoke through one staircase while keeping the other safe, which does not require separation. Nonetheless, this is not the primary reason this isn’t getting built even where it is legal, for example in jurisdictions that permit scissor stairs or have a smaller minimum distance between the two staircases, like Canada. I was hoping the answer I’d get would be about elevator costs. The elevator in the mockup is European, 1.6*1.75 meters in exterior dimensions; American codes require bigger elevators, which is by itself a second-order issue, but then installation costs rise to the point that developers prefer long buildings on corridors for the lower ratio of elevators to apartments. But nobody mentioned that as a reason. The rent issue Mike Eliason responded to my question about why buildings like the above mockup aren’t being built by talking about market conditions. The above building, with 540 m^2 of built-up area per floor, can host four three-bedroom apartments, each around 127 m^2, or it can host 16 studios, each around 29 m^2. In Seattle, the studio can rent for $1,500/month; the three-bedroom will struggle to earn the proportionate $6,000/month. It’s worth unpacking what causes these market conditions. The three-bedroom is marketed to a family with children. The children do not earn money, and, until they reach kindergarten age, cost thousands of dollars a month each in daycare fees; if they don’t go to daycare then it means the family only has one income, which means it definitely can’t afford to compete for building space with four singles who’d take four studios, or it has parents in the immediate vicinity, which is rare in a large, internally mobile country. The family has options to outbid the four singles, but they’re limited and require the family to be rather wealthy – two incomes are obligatory, at high enough levels to be able to take the hit from taxes and daycare; the family would also need to be wedded to living in the city, since the suburbs’ housing is designed entirely for families, whereas the singles take a serious hit to living standards from suburbanizing (they’d have to get housemates). In effect, the broad middle and lower middle classes could afford the studios as singles, but only the uppermost reaches of the middle class can pay $6,000/month for the three-bedroom. In economic statistics, imputation of living standards for different household sizes takes this degressivity of income – $6,000/month for a family of four is a struggle, $1,500/month for a single is affordable on the average US wage – and uses a hedonic adjustment for household sizes. example by taking the square root of household size as the number of true consumption units. To INSEE, a family of four has 2.1 equivalent consumption units; elsewhere, it’s a square root, so it has 2 consumption units. A rental system that maintains a 4:1 ratio has no way for the family to compete. The upshot is that the developers need to run out of the tenants who can most easily afford rent before they build for the rest. Normally it’s treated as a matter of distribution of units among different social classes, but here it’s a matter of the physical size of the unit. This is why YIMBY first is so important: eventually developers will run out of singles and then have to build for families. Written by Alon Levy 30 Comments Posted in Development, Urban Design, Urbanism"
year_published = 2025
