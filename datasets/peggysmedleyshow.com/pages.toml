["https://peggysmedleyshow.com/podcast"]
title = "Peggy Smedley Show"
description = "The Peggy Smedley Show is an authoritative conversation hosted by tech journalist and sustainability influencer, Peggy Smedley with market leaders, authors, consultants, analysts, and more."
full_description = "Peggy talks about the uptick in data centers and the top priorities, top challenges, and top opportunities for data centers. She says data centers will be one of the big topics of conversation for 2025—much like gen AI (artificial intelligence) was a huge topic of conversation for 2024. Tom Bradicich, chief product officer and CTO, Arete, returns to continue the discussion with Peggy Smedley around AI (artificial intelligence) and how AI integration is impacting vertical markets. He shares use cases in healthcare, automotive, and utilities. Peggy Smedley and Kristen Garrett, manager of market research, Consumer Technology Assn., talk about what consumers are going to need to age in place. She says those aged 50 and older represents 46% of the U.S. adult population, and last year we saw 11,000 people turning 65 per day. Peggy talks about the hard numbers—and the risks with third-party access to tech systems. She says we need to know this is an ongoing uphill battle that we need to continually face, sharing her four-step approach. Peggy Smedley and Tom Bradicich, chief product officer and CTO, Arete, talk about AI (artificial intelligence), outlining some of the notable breakthroughs. He gives a little history, saying AI has achieved celebrity status today. The Peggy Smedley Show is an authoritative conversation hosted by tech journalist and sustainability influencer, Peggy Smedley with market leaders, authors, consultants, analysts, and more."
