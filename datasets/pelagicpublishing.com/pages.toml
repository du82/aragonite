t to a Chapter Processing Charge (CPC) of £750 (plus VAT). The BPC/CPC is payable when you submit your manuscript. Open Access ComplianceOur Open Access process is compliant with international funders such as ERC, RCUK and the Wellcome Trust. An up-to-date list of Open Access mandates can be found at ROARMAP'
