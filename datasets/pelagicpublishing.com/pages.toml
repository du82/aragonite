["https://pelagicpublishing.com/blogs/news/night-vision-and-daylight-camera-systems-for-wildlife-author-interview"]
title = """
Night Vision and Daylight Camera Systems for Wildlife - Author Intervi – Pelagic Publishing"""
description = "Susan Young talks to us about Night Vision and Daylight Camera Systems for Wildlife.   Could you tell us a little about your background and what made you decide to write Night Vision and Daylight Camera Systems for Wildlife? My background is in physics and engineering, but for the last 8 years I have been developing po"
full_description = "Night Vision and Daylight Camera Systems for Wildlife - Author Interview by Sarah Stott on February 07, 2025 Susan Young talks to us about Night Vision and Daylight Camera Systems for Wildlife. Could you tell us a little about your background and what made you decide to write Night Vision and Daylight Camera Systems for Wildlife? My background is in physics and engineering, but for the last 8 years I have been developing portable CCTV systems based on security equipment and researching their use with Natural England, the Woodland Trust and, more recently, the Mammal Society. The systems I describe fill the very large gap between trail cameras and thermal imaging, but are not pushed by the equipment manufacturers probably because the security market is so large and they are not wildlife experts. The book was written to demystify what I believe to be an extremely valuable tool for wildlife monitoring. and to demonstrate the many advantages of the systems. Badger cubs Who is the target audience for the book? The book is divided into sections, with each section designed for a particular target audience, i.e. the naturalist, schools, ecologists and researchers. Each audience would use similar equipment, but the applications would differ. What are the main benefits of using this kind of technology in the observation of wildlife? Security equipment is reliable, designed for outdoor use and can be left unattended for long periods. The camera systems I describe have inbuilt infra-red lighting that switches on automatically in the dark, inbuilt motion detection and pre-record so that the first few seconds of motion are not missed when recording switches on. Most importantly. because of the size of the security market, the technology is advanced, and recorders incorporate video analytics that is easily set up by the user and which can dramatically reduce the time spent analysing videos. Curious fallow deer What was the biggest challenge you faced whilst writing the book? I am not an ecologist and had to be sure that the bat survey sections were accurate. I was fortunate enough to have the help of an eminent ecologist from the Mammal Society who tested the equipment and its use in her surveys, and I believe was sold on the advantages! Fox cubs in woodland Did you discover anything that particularly surprised you whilst researching the book? I am surprised by how few people realise the immense benefits of using the type of camera systems I describe - all the greater the reason for writing the book! Tawny owl on branch What has been your favourite wildlife moment captured on camera? There are two really. The first was capturing numerous videos of otters in a stream I was told had not been used by otters for years, and the second, videos showing young fallow deer playing in my garden. My absolute favourite was filming a beaver in Canada with a digital camera as this showed how easy it would be to use the camera systems described in the book! Learn more about Night Vision and Daylight Camera Systems for Wildlife here."
