osal (editor@pelagicpublishing.com) Author Discount Club Authors and Editors are entitled to buy copies of any Pelagic title at a significant discount via our website.Download Author Resources Download Book Proposal Form Download Pelagic Publishing Style Guide for Author and Editors'
