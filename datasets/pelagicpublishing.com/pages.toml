rs towards the goal of a 100% FSC Certified supply chain. Shipping To reduce our shipping footprint we consolidate large shipments and make use of short run digital printing. Both of these mean a book is stored or printed closer to where it's needed. Electrical Items Most of our computers and other electrical items are re-sold on eBay to extend their lifespan when we upgrade. Those that cannot be resold are recycled through an approporiate electrical recycler. Recycling Our shipping cartons are recyclable as is the void fill used inside our boxes. We rarely use bubble wrap as it is hard to recycle. Instead we almost always use crushed paper fill. We re-use as many supplier boxes as possible, preferring to ship stock to retailers in whole carton quantities to reduce re-boxing. Travel As much of our travel as possible is by public transport, mainly trains within the UK and Europe.'''
