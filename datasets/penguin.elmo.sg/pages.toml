title = "d0minik's Blog"
description = """
Binary Ninja Shenanigans: Control Flow Unflatteningd0minik
 published on 2023-10-29Introduction To Control Flow FlatteningControl Flow Flattening is a code obfuscation technique used to make code harder to reverse engineer. It involves transforming the control flow of a program to make it more difficult to understand and analyse. CFF removes structured code flow and is very effective at hindering static analysis efforts, while maintaining the original behaviour of a protected binary.
CFF typically has the following characteristics:
Has >= 1 state variable(s) Control flow decisions are made based on the state variable(s) State variable(s) are set to a new value, and the code flow is then “rerouted” to the intended block For the scope of this article, we shall be looking at a trivial example of a CFF-obfuscated calculator binary.Read more... Reverse-Engineering, Binary Ninja"""
full_description = "Binary Ninja Shenanigans: Control Flow Unflatteningd0minik published on 2023-10-29Introduction To Control Flow FlatteningControl Flow Flattening is a code obfuscation technique used to make code harder to reverse engineer. It involves transforming the control flow of a program to make it more difficult to understand and analyse. CFF removes structured code flow and is very effective at hindering static analysis efforts, while maintaining the original behaviour of a protected binary. CFF typically has the following characteristics: Has >= 1 state variable(s) Control flow decisions are made based on the state variable(s) State variable(s) are set to a new value, and the code flow is then “rerouted” to the intended block For the scope of this article, we shall be looking at a trivial example of a CFF-obfuscated calculator binary.Read more... Reverse-Engineering, Binary Ninja MA Playbookd0minik published on 2022-01-16This posts contains potentially helpful malware analysis techniques and know-hows and would hopefully be updated constantly 🤞. PE ExtractionTo extract PE files from memory, several methods can be used: Use Process Hacker to dump memory region into file for analysis in IDA. Use pd64 to dump modules from a running process. This is helpful for modules that are decrypted and loaded during run-time by launchers. Should output a perfectly debuggable DLL for analysis.Read more... Malware Analysis, Playbooks Flare-On 8 Challenge 10 - wizardcultd0minik published on 2021-10-19We are given a PCAP to start off with this challenge. PCAP AnalysisLooking at the TCP streams, a command injection seems to be going on. We can then see a binary named induct being requested and downloaded onto the machine. We can extract the binary out for analysis. Binary AnalysisThe binary is a golang binary and luckily for us, the symbols are not stripped. Looking at main_main, we can see that it creates a new IRC client, attempting to connect to wizardcult.Read more... Flare-on, Reverse-Engineering, Flare8"
