["https://www.pepeingrani.it/valori"]
title = "Valori - Pepe in Grani"
full_description = '''Questa sinergia ha aperto una nuova prospettiva di lavoro che ha visto la qualità e la genuinità dei prodotti al centro della filiera gastronomica. Dopo la recente apertura del palazzo del 700 che ospita Pepe in Grani, il centro storico di Caiazzo ha visto nuove aperture di strutture ricettive che hanno favorito il turismo, la rinascita di un centro storico, al tempo quasi in decadenza, "arricchendo" la microeconomia del paese. La dedizione al lavoro e la continua ricerca attraverso la sperimentazione, attualizzata con qualità assoluta, hanno portato nel mondo l'immagine di una comunità, quella caiatina, capace di reinventarsi e di portare sulle tavole il sapere e il buono del passato attraverso un disco di pasta: la stessa struttura è stata ideata e modellata grazie alle esperienze degli artigiani locali che di volta in volta hanno contribuito alla sua realizzazione. Numerose sono le attività che attestano l'impegno sociale. tra le tante assumono maggior rilievo "l'adozione" del centro sociale per disabili di Cologno Monzese a cui è stato donato un forno per pizze e di due istituti Alberghieri, quello di Piedimonte Matese e di Castel Volturno entrambi in provincia di Caserta, presso i quali conduco incontri di formazione e di dialogo con gli studenti, su incarico della associazione Ambasciatori del Gusto. Negli anni Franco ha organizzato diverse cene di beneficenza il cui ricavato è stato utilizzato per fini sociali, fra queste ricordiamo quella in occasione del terremoto di Ischia, insieme agli Chef del territorio, con il ricavato devoluto alle popolazioni colpite dal sisma (Ischia Safary 2017/2018), quelle per l'Azienda Ospedaliera di Caserta durante il periodo della pandemia del 2020 per l'acquisto di materiale occorrente su indicazione dei medici. Nel 2020 sostiene il lancio del progetto Pizzas Far Good, per promuovere internazionalmente il concetto di pizza sospesa, sostenendo l'idea che offrire una pizza a qualcuno che non si conosce possa essere qualcosa di più dell'offrire del semplice cibo: si tratta di ripristinare la fede nell'umanità, riunire le persone nella speranza, ispirandole e responsabilizzandole a fare la differenza (una pizza alla volta).'''
author = "Lascò"
year_published = 2025
