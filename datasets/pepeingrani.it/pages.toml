title = "Cookie policy - Pepe in Grani"
full_description = "Che cosa è un cookie? Un cookie è un piccolo file di testo che viene memorizzato dal computer nel momento in cui un sito web viene visitato da un utente. Il testo memorizza informazioni che il sito è in grado di leggere nel momento in cui viene consultato in un secondo momento. Alcuni di questi cookies sono necessari al corretto funzionamento del sito, altri sono invece utili al visitatore perché in grado di memorizzare in modo sicuro ad esempio il nome utente o le impostazioni di lingua. Il vantaggio di avere dei cookies installati nel proprio pc è quello di non aver più bisogno di compilare le stesse informazioni ogni qualvolta si voglia accedere ad un sito visitato in precedenza. Pepeingrani.it utilizza i cookies al fine di fornire ai propri clienti un’esperienza di acquisto modellata il più possibile intorno ai suoi gusti e preferenze. Tramite i cookies pepeingrani.it fa in modo che ad ogni visita sul sito non si debbano ricevere o inserire le stesse informazioni. I cookies vengono utilizzati anche al fine di ottimizzare le prestazioni del sito web: essi infatti rendono più facile sia il procedimento finale di acquisto che la ricerca veloce di elementi e prodotti specifici all’interno del sito. Al fine di proteggere i propri dati personali da possibili perdite e da qualsiasi forma di trattamento illecito PEPE & SF S.r.l.ha preso opportune misure tecniche ed organizzative. Per ulteriori informazioni si prega di consultare la nostra Informativa sulla privacy. Ci sono anche cookies da parte di terzi (cosiddetti third-party-cookies)? In questo caso si tratta di cookies temporanei/permanenti che saranno cancellati automaticamente alla scadenza del periodo prestabilito. Questi cookies temporanei o anche permanenti (la durata va da 14 giorni a 10 anni) vengono salvati sul tuo disco rigido e cancellati automaticamente alla scadenza del periodo predefinito. Anche i cookies delle aziende associate non contengono dati personali. Attraverso un user ID si rilevano soltanto dati sotto forma di pseudonimo. Si tratta, per esempio, di dati riguardo a quali prodotti hai visualizzato, se hai acquistato qualcosa, quali prodotti hai cercato ecc… Durante questo processo alcuni dei nostri partner pubblicitari rilevano anche informazioni su quali pagine hai già visitato o a quali prodotti ti sei interessato, questo per farti visualizzare la pubblicità che più corrisponde ai tuoi interessi. Questi dati sotto forma di pseudonimo non verranno in nessun momento collegati ai tuoi dati personali. Hanno soltanto lo scopo di aiutare i nostri partner pubblicitari a confrontarti con della pubblicità che effettivamente potrebbe interessarti."
