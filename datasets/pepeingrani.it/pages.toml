["https://www.pepeingrani.it"]
title = "Homepage - Pepe in Grani"
description = "Pepe in Grani è un luogo dove fermarsi e ragionare su un antico cibo popolare, dove un disco di pasta racconta i sapori dell’Alto Casertano"
full_description = "Un luogo in cui si incontrano sperimentazioni, artigianato, accoglienza, formazione e attenzione al territorio. Un progetto che si arricchisce negli anni, basato sulla passione per l'impasto, per un disco di pasta che racconta i sapori dell'Alto Casertano. Un ambiente intimo e confortevole dove poter trascorrere una serata tranquilla e intraprendere un viaggio enogastronomico d’eccellenza. Un ambiente dove il gusto incontra l'arte. Una sala privata con un unico tavolo circondato da installazioni artistiche dove il cibo incontra l'espressione. Location gourmet, esperienza enogastronomica coinvolgente e multisensoriale: gusti, odori e spettacolo della lavorazione dal tavolo. Esperienza tra sapori e saper fare dell'uomo attraverso percorsi degustativi. Terrazza panoramica per gustare una pizza ammirando il bellissimo tramonto sulle valli caiatine o immersi in un romantico chiaro di luna. La sala belvedere è la location ideale per una piacevole serata in compagnia."
author = "Lascò"
