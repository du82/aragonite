["https://www.pepeingrani.it/franco-pepe-ricongiunge-litalia-con-i-sei-spicchi-nord-e-sud-sul-podio"]
title = "FRANCO PEPE RICONGIUNGE L’ITALIA CON I SEI SPICCHI: NORD E SUD SUL PODIO - Pepe in Grani"
full_description = "La guida Pizzerie d’Italia 2020 premia Franco Pepe con sei spicchi. Gambero Rosso riconferma i tre spicchi per Pepe in Grani e ne riconsegna altrettanti a La Filiale - L’Evoluzione della Pizza. E’ il sesto anno che il riconoscimento viene assegnato alla pizzeria di Caiazzo e il terzo per la struttura aperta, nel marzo del 2017, all’interno de L’Albereta, ad Erbusco, nel cuore della Franciacorta. Con un punteggio di 96/100 e 95/100, Pepe in Grani e La Filiale ottengono i massimi punteggi della classifica nazionale, che premia la pizza, con un peso maggiore sulla valutazione finale (80/100), l’ambiente e il servizio. “Sento di dover dire grazie alla mia seconda famiglia che, oggi, ha condiviso con me questo importante riconoscimento. Soprattutto, li ringrazio per la professionalità e la dedizione ad un progetto che li vede protagonisti dal principio, li coinvolge pienamente e li spinge a dare sempre il meglio. Allo stesso modo, ringrazio il mio staff de L’Albereta, la famiglia Moretti e pizzaioli che ho formato personalmente e che, come dico sempre, portano la mia identità nel mio prodotto”.. Un anno intenso il 2019 per Franco Pepe, ma anche ricco di ricerca, novità e collaborazioni, finalizzate soprattutto a salvaguardare la salute del cliente, con impasti sempre più leggeri e condimenti bilanciati per un prodotto buono, ma anche sano. Le attenzioni, però, riguardano anche l’esperienza che il cliente vive durante il percorso di degustazione e, più in generale, all’interno delle due pizzerie. “In quest’ultimo anno e, in particolare, negli ultimi mesi, è cresciuta ancora la nostra attenzione per il cliente. I riconoscimenti ricevuti ci danno un’importante conferma, ma la maggiore risposta arriva dalle persone che, quotidianamente, affollano il vicolo di Caiazzo, in cui siamo posizionati, per degustare la nostra pizza. È per questo che li ringrazio e che abbiamo deciso di ricambiare questa fiducia con una cura che va oltre: ad oggi, accettiamo un numero ridotto di prenotazioni per consentire a chi ci viene a trovare di vivere un’esperienza lenta, rilassante, unica e dedicata”."
author = "Lascò"
year_published = 2025
