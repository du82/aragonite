["https://www.pepeingrani.it/team"]
title = "Il Team - Pepe in Grani"
full_description = "La ricerca costante della perfezione ha contribuito ad un grande e continuo lavoro di formazione che, anche con l’aiuto di professionisti esterni, hanno portato alla creazione di nuove figure. In Pepe in Grani la figura del pizzaiolo viene scomposta, creando così una specifica suddivisione dei ruoli. In cucina gli chef, gli impastatori, i pizzaioli, i fornai e i passisti sono tutti ingranaggi dello stesso perfetto meccanismo. In sala, dall’accoglienza alla direzione, ogni dettaglio è affidato alla cura di un personale giovane e specializzato. Traguardi raggiunti, sfide vinte. Pepe in Grani: un progetto dinamico e inclusivo. Un gruppo di lavoro ambizioso che, con passione, condivide obiettivi e non si pone limiti: un brand, una famiglia. Se leggendo queste poche righe hai percepito il fuoco che anima la nostra proiezione verso il futuro, ci farebbe piacere ricevere il tuo Curriculum. Personale di Sala Siamo alla ricerca di persone empatiche e predisposte al lavoro e alla condivisione di obiettivi di squadra. Sono gradite le candidature di operatori che hanno già acquisito, sul campo, esperienza nel settore della ristorazione. Ma ciò che non può assolutamente mancare è la forte motivazione ad apprendere ciò che Pepe in Grani è, vuole essere e sempre sarà. Miglioramento personale e crescita professionale sono le certezze che Franco Pepe riconosce a chi, in un contesto aziendale stimolante e innovativo, è capace di calarsi nel modo giusto. Mansioni - Servizio ai tavoli - Pulizia e sistemazione dei tavoli - Attività accessorie o preparatorie Richieste - Flessibilità oraria (martedì - domenica) - Professionalità e versatilità - Spirito di squadra La conoscenza dell’inglese costituisce titolo preferenziale. L’inserimento prevede un periodo di formazione e affiancamento ai responsabili d’area. L'annuncio è rivolto a candidati ambosessi, ai sensi del D.Lgs 198/2006."
