["https://www.pepeingrani.it/madrid-fusion-franco-pepe-presidente-di-giuria-per-il-concorso-la-mejor-pizza-de-espana"]
title = "Madrid Fusión, Franco Pepe presidente di giuria per il concorso  “La Mejor Pizza de España” - Pepe in Grani"
full_description = '''Un nuovo importante riconoscimento per Franco Pepe, che sarà presidente di giuria per “La Mejor Pizza de España”, concorso organizzato nell’ambito dell’edizione 2021 di Madrid Fusión Un contest importante strutturato in due differenti categorie: “pizza napoletana” e “freestyle”. Dodici i finalisti: sei per categoria. Una vetrina prestigiosa per i partecipanti ma anche per Franco Pepe, presidente di una giuria di qualità di cui sono parte ulteriori sette giurati, tra i quali Jesús Marquina “Marquinetti” (director de la Asociación Española de pizzeros artesanos), José Carlos Capel (Presidente de Madrid Fusión), Alberto Luchini (Redattore capo di Metrópoli El Mundo), Alberto Miragoli (Cientotreinta Grados), Bárbara Guerra (Presidente di 50 Top Pizza), Rosa Vañó (Presidente della Academia Andaluza de Gastronomía y Turismo) e Santiago Mora (Director General de D.O. Rueda). In viaggio verso Madrid, orgoglioso di presiedere la giuria per “La Mejor Pizza de España”, Franco Pepe ha dichiarato: «è un riconoscimento all’impegno e alla passione con cui, da sempre, vivo la mia professione. Ho accettato con convinzione l’invito di Madrid Fusión: è bello che l’onere della valutazione spetti a un pizzaiolo: è un approccio che attribuisce credibilità a un evento importante come questo di Madrid. Per me è un’esperienza nuova, a cui mi approccio con entusiasmo: sarò un presidente “consigliere”. Scherzi a parte, proverò a dare i giusti consigli ai miei colleghi: l’obiettivo, comune, è contribuire alla crescita dell’universo pizza. Nella mia valutazione peseranno anche i valori e le caratteristiche nutrizionali delle proposte dei finalisti. La pizza può essere funzionale. Può, cioè, rappresentare un elemento salutare all’interno della dieta alimentare di ognuno di noi. Ne sono convinto e, proprio in questa direzione, con il mio staff, siamo impegnati in un intenso lavoro di ricerca e sperimentazione. L'obiettivo è, appunto, proprio la valorizzazione del prodotto pizza come pasto sano e completo: affinché non sia più percepita uno "sgarro" alla dieta».'''
author = "Lascò"
year_published = 2025
