["https://www.pepeingrani.it/federico-ii-franco-pepe-chiusura-laboratorio-gastronomia-mediterranea"]
title = "Federico II, Franco Pepe alla chiusura del Laboratorio di Gastronomia Mediterranea - Pepe in Grani"
description = "Nel corso di Scienze Gastronomiche Mediterranee del Dipartimento di Agraria dell’Università degli Studi di Napoli Federico II, la ricerca trova consistenza scientifica: un bene prezioso per tutti coloro che sono impegnati ad elevare, su livelli sempre più importanti, una dimensione il più possibile innovativa e sostenibile della nostra cucina."
full_description = "Nel corso di Scienze Gastronomiche Mediterranee del Dipartimento di Agraria dell’Università degli Studi di Napoli Federico II, la ricerca trova consistenza scientifica: un bene prezioso per tutti coloro che sono impegnati ad elevare, su livelli sempre più importanti, una dimensione il più possibile innovativa e sostenibile della nostra cucina. Franco Pepe oggi ha partecipato all’evento di chiusura del corso Laboratorio di Gastronomia Mediterranea 2021. Una giornata ricca di spunti nel quale si sono registrati gli interventi di un parterre di relatori di assoluto rilievo composto, oltre al nostro Franco, dai prof. Danilo Ercolini (Direttore Dipartimento di Agraria) e Raffaele Sacchi (Corso di Laurea in Scienze Gastronomiche Mediterranee), dal dott. Achille Scudieri (Eccellenze Campane), Francesco Sposito (Chef Ristorante Taverna Estìa). Di grande impatto, inoltre, il contributo degli studenti di Scienze Gastronomiche Mediterranee: rivolgendosi a loro, Franco Pepe, nel suo apprezzato intervento, ha sottolineato come «la pizza, come afferma Antonio Pace, nasce dalla genialità. Ma la formazione e l’acquisizione di competenze tecniche sempre nuove sono, oggi, di cruciale importanza». «ad avere sempre un approccio critico, responsabile e analitico perché fare ristorazione è un atto di responsabilità»"
author = "Lascò"
year_published = 2025
