["https://www.pepeingrani.it/premi"]
title = "Riconoscimenti - Pepe in Grani"
full_description = '''"Pizzeria più votata al mondo", Top 20 best pizza in the world. 'Where to eat pizza", a cura di Daniel Young. "Migliore impasto dell'anno", 'Tre Spicchi", Premio "Margherita Sbagliata" e "Crisommola" come pizze dell'anno per il Gambero Rosso Il critico culinario e premio Pulitzer Jonathan Gold. titola un articolo su Franco Pepe per la prestigiosa rivista Food&Wine "Probably the Best Pizza in the World". Il Cappello d'Oro anno 2017 - riconoscimento alla personalità che con la sua opera ha promosso il territorio del Medio Alto Casertano - Piedi monte Matese Giugno 2019 onorificenza di Cavaliere al Merito della Repubblica Italiana con decreto del Presidente della Repubblica Sergio Mattarella. Settembre 2019 Gambero Rosso riconferma i Tre Spicchi per Pepe in Grani e la Filiale (il sesto anno per la pizzeria di Caiazzo e il terzo per la struttura in Franciacorta). Ottobre 2019 Pizzaiolo dell'anno per Food and Travel Italia con attestato di Ambasciatore del Territorio. Novembre 2019 Miglior Pizza d'Italia. Miglior Pizza Tradizionale. Miglior Pizza della Campania e Miglior Pizzaiolo dell'anno per Pizza Adwards Italia. Novembre 2019 Pepe in Grani entra nella 50 Best Discovery, tra 1200 bar e ristoranti selezionati nel mondo. prima volta per una pizzeria italiana. Giugno 2020 onorificenza di Cavaliere al Merito della Repubblica Italiana con decreto del Presidente della Repubblica Sergio Mattarella. Giugno 2020 la guida OAD Opinionated About Dining vede la pizzeria Pepe in Grani scalare la classifica fino al 1° posto nella sezione Europe Cheap Eats. Ottobre 2020 settimo attimo Tre Spicchi Gambero Rosso e premio alla Pastiera Fritta come pizza dolce dell'anno. Nata da un'idea del figlio Stefano per omaggiare il maestro pasticciere Alfonso Pepe scomparso lo stesso anno. Novembre 2020 riceve il premio "Best Practice -valorizzazione dieta mediterranea" da foodcommunity.it'''
