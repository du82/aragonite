["https://www.pepeingrani.it/authentica"]
title = "Authentica - Pepe in Grani"
full_description = "Una giornata eccezionale e intima dove l'autenticità incontra l'innovazione, dove la creatività e il lavoro di due chef e dei loro team di cucina diventano la fonte di ispirazione per la cucina del futuro. Il ciclo 'Autentica Ispirazione' propone un viaggio culinario unico, che unisce l'essenza e l'autenticità della gastronomia di ogni chef invitato/a con la maestria di Franco Pepe e delle sue pizze, elaborate con i prodotti dell'Alto Casertano. Una sessione unica di creatività e innovazione, nella pizzeria più piccola del mondo, situata a Pepe in Grani. Ad ogni sessione, Franco Pepe e il suo team esplorano i sapori e le tecniche di ogni chef invitato, per poi ispirarsi ed elevare questi sapori a nuove sfide con approcci all'avanguardia e creativi. Basta compilare il form con i propri dati, indicando, sulla base del programma (in continuo aggiornamento), fino a due preferenze (gli Chef che vorreste incontrare). In base all'ordine delle prenotazioni, che sarà rispettato con riferimento all'orario di invio mail, cercheremo di inserirvi in una delle serate scelte in fase di compilazione. In caso contrario, sarete, ugualmente, contattati dalla nostra segreteria per un'altra serata, sempre in Authentica Ispirazione. Lo spirito di Authentica Ispirazione è di entrare a far parte di questo ciclo di eventi speciali, a prescindere dallo Chef. Con questo spirito cercheremo, quindi, di dare una possibilità a tutti.Se non rientrerete nella vostra serata preferita, potrete, infatti, avere un'altra chance e vivere, allo stesso modo, un'esperienza unica tra le sole 10 persone che possono accomodarsi in sala*. Non temete: il calendario di Authentica Ispirazione è aperto e in continuo aggiornamento. Alle date e agli Chef indicati se ne aggiungeranno altri nel corso del prossimo anno. Per tutte le altre info, vi invitiamo ad attendere una nostra chiamata.*** ** Considerando il numero totale di ospiti, raggiunto il limite di prenotazioni per tutte le date stabilite, bloccheremo le mail con un apposito avviso"
