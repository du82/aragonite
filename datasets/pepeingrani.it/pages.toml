["https://www.pepeingrani.it/madrid-fusion-vince-la-qualita"]
title = "A Madrid Fusión vince la qualità: entrambe di Barcellona le pizzerie premiate - Pepe in Grani"
description = "La Mejor Pizza de España, contest nell’ambito dell’edizione 2021 di Madrid Fusión, si è concluso con due vincitori e nessun vinto."
full_description = "Perfetta l’organizzazione: La Mejor Pizza de España, contest nell’ambito dell’edizione 2021 di Madrid Fusión, si è concluso con due vincitori e nessun vinto. Perché, alla fine, tutti i partecipanti finalisti, grazie alle loro passione e qualità, hanno dimostrato quanto la pizza sia un patrimonio universale misurandosi in una competizione prestigiosa e, al tempo stesso, piacevole da vivere. Franco Pepe ha voluto onorare con la professionalità che da sempre lo caratterizza un ruolo per lui inedito: Presidente di Giuria. E così, ognuna delle pizze è stata valutata in base a criteri precisi e oggettivi declinati secondo i seguenti parametri: impasto, cottura, sostenibilità, proprietà nutrizionali, vista, olfatto, tatto e gusto. Un approccio condiviso e applicato dagli ulteriori componenti della giuria di qualità: Jesús Marquina “Marquinetti” (director de la Asociación Española de pizzeros artesanos), José Carlos Capel (Presidente de Madrid Fusión), Alberto Luchini (Redattore capo di Metrópoli El Mundo), Alberto Miragoli (Cientotreinta Grados), Bárbara Guerra (Presidente di 50 Top Pizza), Rosa Vañó (Presidente della Academia Andaluza de Gastronomía y Turismo) e Santiago Mora (Director General de D.O. Rueda). Entrambe di Barcellona le due pizzerie premiate: La Balsemina ha trionfato nel contest pizza napoletana grazie alla sua Rita, proposta estiva e alternativa a base di pomodori di stagione, mozzarella e basilico fresco e un impasto dalla lievitazione di 72 ore; Can Pizza si è invece aggiudicato la categoria freestyle con Jerry Tomato, una soluzione che è sintesi di tre differenti consistenze di pomodoro, erba cipollina e odori inebrianti. «onorato di aver presieduto una giuria di qualità e, soprattutto, di aver constatato la qualità di colleghi per cui, come per me, la pizza è una ragione di vita più che una professione. Ho visto tanta passione e un approccio costruttivo da parte di tutti: attitudini di cui tutti i pizzaioli devono pregiarsi per poter, sempre di più, migliorarsi. Madrid Fusión è difusión di una cultura che pone il cibo in una prospettiva che condivido in pieno, elevandolo ad elemento essenziale non soltanto della nostra vita biologica ma anche culturale, sociale, affettiva ed economica. Sono eventi che fanno bene alla crescita di un movimento che è sempre più internazionale, in cui il talento dei partecipanti e l’oggettività delle valutazioni attribuiscono un valore che è sostanza»."
