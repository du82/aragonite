["https://www.pepeingrani.it/la-storia"]
title = "La storia - Pepe in Grani"
full_description = '''Franco Pepe rappresenta la terza generazione di una famiglia di panificatori. La prima attività fu avviata dal nonno nel 1938, con licenza di esercizio concessa dal Potestà. C'è stata, sin da allora, una continuità lavorativa che non si è interrotta nemmeno in tempo di guerra: il nonno ha continuato a panificare, autorizzato a dare la razione di 150 gr di pane a fronte dell'esibizione della tessera. Accanto a suo padre, Stefano, Franco è cresciuto in quella che oggi è la Pizzeria in Piazza Porta Vetere, tuttora in attività, cuore pulsante della sua formazione. Con l'esperienza di due generazioni alle spalle, ispirato da una nuova visione della pizza, nel 2012 apre Pepe in Grani, un luogo in cui si incontrano sperimentazioni, artigianato, accoglienza, formazione e attenzione al territorio: un progetto che si arricchisce negli anni, basato sulla passione per l'impasto, per un disco di pasta che racconta i sapori dell'Alto Casertano. Iniziano le fasi di ampliamento del progetto Pepe in Grani, con un tassello che si aggiunge e rende l'esperienza di accoglienza al cliente ancora più speciale: due camere all'ultimo piano, progettate in coerenza con l'estetica del luogo e realizzate con il lavoro prezioso degli artigiani locali, per offrire la possibilità di soggiornare all'interno della pizzeria. Apre la sala Degustazione, uno spazio riservato composto da 3 tavoli circolari -uno dei quali affaccia sulla bocca del secondo forno attraverso un oblò-, in cui è possibile fare un percorso di degustazione abbinando le pizze ai vini del territorio. Viene inaugurata la sala Authentica, luogo di incontro e di contatto diretto tra il pizzaiolo e il pubblico, che può avere molteplici funzioni: didattica, di approfondimento, di spazio esclusivo. È stata definita la "pizzeria più piccola al mondo": un tavolo semicircolare con 8 sedute fuso con il banco di lavoro e, alle spalle, un piccolo forno a legna. Crea il menù funzionale, all'insegna dei dettami della Dieta Mediterranea. che si pone l'obiettivo di sdoganare la pizza dallo stereotipo che la vede come uno "strappo alla regola": nasce dall'esigenza di portare la salute in tavola, ponendo l'attenzione sul giusto equilibrio tra i macronutrienti -carboidrati, proteine e lipidi- presenti nella pietanza, con attenzione alla fibra alimentare, che incide sui tempi di digestione e di assimilazione contribuendo a rendere la pizza un ottimo "piatto unico".'''
author = "Lascò"
year_published = 2025
clearnet = "https://www.pepeingrani.it/la-storia"
