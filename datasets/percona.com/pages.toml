title = "About Percona - Percona"
description = "Percona has made MySQL faster and more reliable for over 3,000 consulting and support customers worldwide since 2006."
full_description = "About Percona Databases run better with Percona LET’S WORK TOGETHER By the numbers: 350 Teammates 52 Countries 4.2M+ Downloads / mo 2006 Peter Zaitsev and Vadim Tkachenko start Percona with support for MySQL 2008 Percona MySQL & Percona XtraDB Storage Engine launch 2009 Support for Maria DB & Launch of Percona XtraBackup for MySQL 2010 Launch Percona Server for MySQL, 24×7 worldwide support for MySQL 2011 Percona Toolkit is released and First Percona Live hosted in San Francisco 2012 Launch of Percona XtraDB Cluster and Percona Monitoring Plugins (a predecessor of PMM) 2013 Launch of Managed Services, First Percona University event is held in Raleigh, NC 2015 Support for MongoDB is added and Percona Server for MongoDB is launched 2016 Launch of PMM 1.0 2018 Support for PostgreSQL is added 2019 Launch of PMM 2.0, Percona Distribution for PostgreSQL, Percona Backup for MongoDB and Percona Kubernetes Operators 2020 Launch of Percona Distribution for MySQL and Percona Distribution for MongoDB 2022 Launch of Percona Platform Percona is widely recognized as a world-class open source database software, support, and services company for MySQL®, MongoDB®, and PostgreSQL® databases in on-premises and cloud environments. We are dedicated to helping make your databases and applications run better through a unique combination of expertise and open source software. Your data is the foundation of your business, and we believe it can be simpler, faster, and easier to manage. Our services and software accommodate rapid growth and application development, help you develop and deploy agile solutions and improve your ability to keep up with customer needs. We have progressively built a suite of open source database solutions that empower our customers with greater flexibility. Percona is on a mission to provide a unified approach to open source database software, support and services. At Percona, we make your database—and the applications that depend on it—better. Our Leadership LinkedIn Ann Schlemmer CEO LinkedIn Peter Zaitsev Founder LinkedIn Vadim Tkachenko Co-Founder / Technology Fellow LinkedIn Bennie Grant COO LinkedIn Eileen Doody CFO LinkedIn John Breitenfeld CRO LinkedIn Liz Warner CTO LinkedIn John Newton Board member LinkedIn Rob Young Board member In The News The CFO’s View of Open Source Companies with Eileen Doody and Karen Walker February 19, 2025 The Business of Open Source Is your data strategy ready for life after Redis? February 14, 2025 Data Centre Review The When, Why & How in Switching to Open Source Databases February 13, 2025 Solutions Review Why Knowing Who (or What) Is Behind an Open Source Solution Is Critical February 11, 2025 It Pro Today Percona Provides Broad, Enterprise-Grade Support for Open Source Redis Alternative, Valkey February 11, 2025 Database Trend and Applications Will Kubernetes ever get easier? February 10, 2025 InfoWorld Read More Be a part of our team Percona was founded on the belief that everyone should have access to scalable, secure, efficient, and resilient database software features without inflated fees or vendor lock-in. Our team members believe the same. We’re passionate about coming alongside individuals, from a range of technical and non-technical backgrounds, who are looking to make a difference in the industry. Percona is a global, remote-only organization, with colleagues in more than 52 countries. We pride ourselves on our workplace flexibility, competitive compensation, and corporate community. LET’S WORK TOGETHER"
