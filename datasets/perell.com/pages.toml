title = "Peter Thiel's Religion - David Perell"
description = "David explores how Christianity and religion shape Peter Thiel's worldview and success. Read here."
full_description = "Long Form Peter Thiel’s Religion “I am the Lord your God.” — 1st Commandment Human culture began with a murder. That culture was fueled by rage and rivalry, which led to violence. Managing that violence is the secret reason for all religious and political institutions. In The Bible, The Cain and Abel story is the first act of life after the Garden of Eden. Cain is a farmer and the older brother to Abel, who is a shepherd. Initially, Cain admires Abel. But eventually, when Cain turns envious of his younger and more successful brother, he kills him. The two brothers represent two halves of the human psyche: Abel represents the part that looks up towards the transcendent, where Cain represents the other that looks down towards death and destruction. Depending on who you ask, the significance of the Cain and Abel story ranges from nothing to everything. For some, the Christian cross is too strange to be taken seriously. It’s archaic and stuck inside a biblical world that can no longer speak to the challenges of life with iPhones, Tinder, and $12 avocado toast. But to others, religion is the foundation of human culture. Without it, peace cannot be maintained and violence will erupt like an angry volcano. What does Peter Thiel think? Is religion a superfluous add-on or the origin of everything? In this essay, we’ll explore the significance of religion and the Cain and Abel story. We’ll learn why the story is an archetype for human relationships, even in the Western world where people stiff-arm religion like it’s the Heisman trophy. We’ll study religion through the lens of Peter Thiel. He’s an investor who found wealth in PayPal, a student who found wisdom in Libertarian ideals, and a philosopher who found faith in the resurrection of Jesus Christ. Thiel was raised as an Evangelical and inherited the Christianity of his parents. But his beliefs are “somewhat heterodox.” In a profile in the New Yorker, Thiel said: “I believe Christianity to be true. I don’t feel a compelling need to convince other people of that.” Three simple statements will lead us towards our ultimate answer about the importance of religion: Don’t copy your neighbors Time moves forward The future will be different from the present Rather than focusing on Thiel’s actions, I’ve chosen to focus on his ideas. First, we’ll explore the principles of Peter Thiel’s worldview. We’ll begin by explaining Thiel’s connection to a French philosopher named Rene Girard. We’ll return to old books like The Bible, old ideas like sacrifice, and old writers like Shakespeare, and see why this ancient wisdom holds clues for modern life. Then, we’ll return to the tenets of the Christian story. We’ll cover the shift from cyclical time to linear time, which was spurred by technological development and human progress. We’ll see why the last book in The Bible,The Book of Revelation, is a core pillar of Thiel’s philosophy. Then, we’ll close with Thiel’s advice and wisdom almost as old as Cain and Abel: the Ten Commandments. Some disclaimers: I’ve never met Peter Thiel. The contents of this essay are based on public information and my own intuition. Hopefully, some of it is interesting. Inevitably, some of it is wrong. I am not a Christian and only have a basic understanding of Christian theology. If you agree with everything in this essay, I haven’t challenged you enough. I’ve also chosen an interpretation of the Bible, and especially The Book of Revelation that aligns with Thiel’s philosophy. Thiel fanatics will say I’ve only scratched the surface. Others will say I’ve gone too deep. And both might complain I’ve focused too much on his relationship with Christianity. I don’t agree with all of Thiel’s conclusions, but I admire his rigorous and independent thought. By the time you finish reading this essay, you will too. I wrote this essay because I’m fascinated by Christianity and impressed with Thiel. I’ve spent the past decade as an agnostic, just like everybody around me. But after a recent change of heart, I’m on a quest to develop my own conclusions about religion. This essay is an introduction to his ideas, but it’s not just about Thiel. It’s about modern society, human behavior, and the philosophy of religion. Let’s begin. Thiel’s Intellectual Background To understand Thiel’s ideas, we need to begin with the person who influenced Peter Thiel more than any other writer: Rene Girard. Rene Girard was a French historian and literary critic. He’s famous for Mimetic Theory, which forms the bedrock of Thiel’s worldview. Thiel studied under Girard as an undergraduate at Stanford in the late 1980s. Their relationship stretched beyond the walls of Palo Alto classrooms and became a lifelong friendship. When Girard died, Thiel spoke at the memorial service. Mimetic Theory rests on the assumption that all our cultural behaviors, beginning with the acquisition of language by children are imitative. He sees the world as a theatre of envy, where, like mimes, we imitate other people’s desires. His theory builds upon the kinds of books and people that modern people tend to ignore: The Bible, classic fiction writers such as Marcel Proust, and playwrights like Shakespeare. Mimetic conflict emerges when two people desire the same, scarce resource. Like lions in a cage, we mirror our enemies, fight because of our sameness, and ascend status hierarchies instead of providing value for society. Only by observing others do we learn how and what to desire. Our Mimetic nature is simultaneously our biggest strength and biggest weakness. When it goes right, imitation is a shortcut to learning. But when it spirals out of control, Mimetic imitation leads to envy, violence, and bitter rivalry. Mimesis is the Greek word for imitation. Imitation is not the childish, low-level form of behavior that many people think it is. Since humanity would not exist without it, humans aren’t as independent as they think they are. Early psychologists like Sigmund Freud didn’t take imitation seriously enough. In one essay, Thiel described human brains as “gigantic imitation machines.” Our capacity for imitation is unconscious. This drive towards imitation separates us from other animals, and historically, it enabled our evolution from earlier primates to humans. Imitation is linked to forms of intelligence that are unique to humans, especially culture and language. We’ve known this for centuries. In the time of Shakespeare, the word ape meant both “primate” and “imitate.” Learning and human behavior is learned through imitation. Without it, all forms of culture would vanish. As any dancer will tell you, the heart beats fastest when two people agree to imitate each other and move in perfect sync. These are the moments when time disappears; when years of trust are built in seconds of synchronicity. Thiel speaks with a religious reverence for Girard’s theory: “[Girard’s ideas are] a portal onto the past, onto human origins, and our history. It’s a portal onto the present and onto the interpersonal dynamics of psychology. It’s a portal onto the future in terms of where we are going to let these Mimetic desires run amok and head towards apocalyptic violence… It has a sense of both danger and hope for the future as well. So it is this panoramic theory… [It’s] super powerful and extraordinarily different from what one would normally hear. There was almost a cult-like element where you have these people who were followers of Girard and it was a sense that we had figured out the truth about the world in a way that nobody else did.” Thiel credits Girard with inspiring him to switch careers. Before he internalized Girard’s ideas, Thiel was on track to become a lawyer. He worked as an associate for Sullivan & Cromwell in New York City, where the hours were long and the competition was cutthroat. As Thiel recounts, all the lawyers competed for the same shared goals. They ranked themselves not by absolute progress towards a transcendent end goal, but by progress within their peer group. As Peter Thiel recounted: “When I left after seven months and three days, one of the lawyers down the hall from me said, ‘You know, I had no idea it was possible to escape from Alcatraz.’ Of course that was not literally true, since all you had to do was go out the front door and not come back. But psychologically this was not what people were capable of. Because their identity was defined by competing so intensely with other people, they could not imagine leaving… On the outside, everybody wanted to get in. On the inside, everybody wanted to get out.” Competition distracts us from things that are more important, meaningful, or valuable. We buy things we don’t need with money we don’t have to impress people we don’t like. Trapped in a never-ending rat race, lawyers climbed the corporate ladder by winning favor with partners at the top. Others engaged in small acts of sabotage against their coworkers. Law school was worse. Like lobsters in a bucket, wannabe lawyers battled for law school placement and law firm employment. Each goal led to the next. Rather than focusing their attention on the end goal of developing a legal expertise, transforming the Constitution, or rescuing the powerless from tyrannical injustice, they elbowed their peers so they could score higher than their classmates on standardized tests. The competition was zero-sum. The better one student did, the worse their peers scored. How Girard Influenced Thiel in Business Thiel sees the world at a strange angle. His contrarian streak runs through everything he does. But until now, nobody has explained the roots of his singular philosophy. His verbal tendencies double as a mirror into his mind. Listen to a Thiel interview and you’ll notice how often he reframes the question before answering. When he speaks, he skips between perspectives faster than a game of hopscotch. He says things like “One version of this is…” or “You could say that…” He has an uncanny ability to consider cultural trends and investment trades from a diversity of perspectives. Sometimes, I wonder if he sees life as a game of chess, where he plays against himself and simultaneously switches from black, to white, and back again. Listen carefully and you’ll see how often he hides answers inside of questions. By playing both sides of the board with the rigor of a Dostoyevsky novel, he sees what others miss with crystal clarity. In the words of one of his friends: “Peter is of two minds on everything. If you were able to open his skull, you would see a number of Mexican standoffs between powerful antagonistic ideas you wouldn’t think could be safely housed in the same brain.” Before playing a game, you have to know the rules. Breakthrough businesses are so innovative that people don’t have the words to describe them. He focuses on questions as much as answers, so he can identify the difference that makes the difference. For example, people still talk about Google as a search engine and Facebook as a social networking site. Both descriptions miss the point. Google succeeded because it’s a machine-powered search engine. Until Facebook, social networks mostly helped people become virtual cats and dogs. Facebook succeeded because it helped people create real identities online. 15 years after its founding, people incorrectly frame the history of social networks. He doesn’t just focus on the brushstrokes. He looks at how the painting is framed. Thiel’s companies are governed by Girard’s wisdom. Girard observed that all desires come from other people. When two people want the same scarce object, they fight. In response, as CEO of PayPal, Thiel set up the company structure to eliminate competition between employees. PayPal overhauled the organization chart every three months. By repositioning people, the company avoided most conflicts before they even started. Employees were evaluated on one single criterion, and no two employees had the same one. They were responsible for one job, one metric, and one part of the business. Thiel provided the first outside money into Facebook and still serves on the company board. His $500,000 investment was partially informed by Mimetic Theory because he saw Girard’s ideas validated by social media. As Thiel said: “Facebook first spread by word of mouth, and it’s about word of mouth, so it’s doubly Mimetic. Social media proved to be more important than it looked, because it’s about our natures.” To be sure, not all of Thiel’s investments have been successful. Thiel’s hedge fund, Clarium Capital, was unsuccessful. The fund fell 13 percent in August 2008, 18 percent in October 2008, and lost money for the third year in a row in 2009. By September 2009, the total assets under management had fallen from a peak of $7.8 billion to a mere $850 million, most of which was Thiel’s personal capital. People who work with Thiel are told to look for heterodox ideas and people with clear visions of the future. Thiel doesn’t like to be an operator because it’s a low-leverage activity. Instead of banging the keyboard himself, Thiel installs strong CEOs and leaders whose judgements are similar to his own. Time and again, these skilled operators have the agency to act without Thiel’s approval, and are encouraged to pursue bold visions of the future. They have freedom to pursue bizarre ideas and people who don’t fit the standard mold. In an epic exchange between two billionaires, Jeff Bezos said: “Peter Thiel is a contrarian, first and foremost. You just have to remember that contrarians are usually wrong.” In an email to Ryan Holiday, Peter responded as such: “Contrarians may be mostly wrong, but when they get it right, they get it really right.” Across PayPal and Facebook, Peter Thiel’s philosophy can be summarized in a single sentence: Don’t copy your neighbors. It’s like a search for keys. Instead of looking in the light, Thiel and his employees look in the dark, where nobody else is looking. Section 1: Don’t Copy Your Neighbors “Do not love the world or the things in the world. If anyone loves the world, the love of the Father is not in him. For all that is in the world—the lust of the flesh, the lust of the eyes, and the pride of life—is not of the Father but is of the world. And the world is passing away, and the lust of it; but he who does the will of God abides forever.” — 1 John 2: 15–17 Everybody imitates. We cannot resist Mimetic contagion, and that will never change. But there are bad ways to copy and good ways to copy. Bad imitators follow the crowd and mirror false idols, while good imitators copy a transcendent goal or figure. Imitation draws people together. Then, it pulls them apart like an ocean riptide. At first, two people who share the same desire will be united by it. But if they cannot share what they both desire, their relationship will transform. They’ll turn from the best of friends to the worst of enemies. Conventional wisdom says that we loathe people who are nothing like us. But when it com"
