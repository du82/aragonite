["https://perell.com/essay/saving-the-liberal-arts"]
title = "Saving the Liberal Arts - David Perell"
description = "David's essay explores why the liberal arts are valuable how to save them from obscurity. Read here."
full_description = "Long Form Saving the Liberal Arts Co-written with Jeremy Giffon “If colleges don’t change their business model, they’re going to go bankrupt,” I told my professor, two days before I graduated from college. She looked at me in disbelief. “Yeah right,” she snickered. Over four years at Elon University, I had watched the institution abandon its cardinal principles, as it transitioned from a liberal arts college and into a professional training center. Founded in 1889 to “transform mind, body, and spirit and encourage freedom of thought and liberty of conscience,” the school was built upon noble aspirations that united the community. It would provide a way for young adults to come of age by surrounding themselves with the best ideas humanity had ever produced — from the philosophy of Plato, to the sonnets of Shakespeare, to the music of Mozart. Unfortunately, by the time I graduated, the school had abandoned that original vision. All the new academic buildings centered around professional majors. Business majors and communications majors monopolized the prime real estate. Meanwhile, Liberal Arts majors were scattered around campus like trash occupying leftover space. Though I’m disheartened by its priorities, I can’t blame Elon for responding to market forces. As one of my college advisers said to me, “Elon may be the most economically driven university in the country.” The university had to stay in business. No matter how noble it wanted to be or how much it wanted to stick to its original vision, it couldn’t prioritize majors that only a few students wanted to study.1 Financially, it was a smart move. Idealistically, I detested it. 1 The original definition of vocation is more profound than the contemporary one. It’s born out of the Protestant belief that God endows each person with unique talents and an occupation for which they’re uniquely suited. The word “vocation” was first used in the 16th century to describe how God called certain people to particular kinds of work. The term goes back to 1 Corinthians 7:20, where Paul says, “Let every man abide in the same calling wherein he was called.” With so many colleges struggling financially, the shift in Elon’s curriculum is being replicated by hundreds of American universities. It’s a dilemma. They can leave their original principles behind and become full-on vocational schools. Or, they can double down on their commitment to the Liberal Arts. Right now, they’re stuck in the middle of these options. Most are turning into professional schools in order to survive. Like my alma mater, they are treating the Liberal Arts like a second-class citizen. But what’s good for their balance sheets isn’t necessarily good for the health of society. In this essay, I’ll outline a plan for saving the Liberal Arts. I’ll start with their history by going back to the origins of Western thinking. I’ll argue that we can only think about education clearly once we split it into two halves: civilized and professional. To explain why, I’ll outline the evolution of the Liberal Arts, from the ancients to where we are today. I’ll show why we’ve devalued their study by serving our wallets instead of our souls. Finally, I’ll propose a plan to create a modern Liberal Arts school with lower costs, expanded access, and students who graduate with a holistic view of the world and an appreciation for civilization’s greatest works. Section 2 – Common Vocabulary and Understanding History of the Liberal Arts In this essay, I will define the Liberal Arts as knowledge without immediate utility. It tends to be foundational, slow to change, and not the kind of knowledge that will make you a quick buck.2 2 I am also sympathetic to David Foster Wallace’s take on the subject: “I submit that this is what the real, no-bullshit value of your liberal arts education is supposed to be about: how to keep from going through your comfortable, prosperous, respectable adult life dead, unconscious, a slave to your head and to your natural default setting of being uniquely, completely, imperially alone day in and day out.” When you study the Liberal Arts, you interrogate the fundamental assumptions of society. You make sense of its default programming, from the stories we tell to the ideals we worship. By doing so, you dig beyond the facade of intellectual fashions to explore the invisible codes that govern society. The ancient Greeks defined the Liberal Arts as the knowledge required by free people to uphold their duty as citizens.3 In addition to political theory, they emphasized rhetoric, politics, philosophy, theology, abstract mathematics, and the natural sciences.4 Those were just the hard skills. They also learned to appreciate the softer sides of life, such as poetry, language, and storytelling.5 That changed with the beginning of the Industrial Revolution when schools abandoned these original Liberal Arts values. Professional demands crept into the curriculum. Schools became an assembly line. Instead of merely “educating” students, they trained them to operate machinery, follow orders, and succeed in the workplace. 3 In fact, the etymology of “idiot” comes from the Greek idiotes, which referred to a private person who was so self-centered that they didn’t consider societal matters. 4 There were seven Liberal Arts in medieval European universities. Grammar, rhetoric, and logic made up “The Trivium,” while geometry, arithmetic, music, and astronomy made up “The Quadrivium.” People have always doubted their validity, which is why the word trivial corresponds to ideas in the Trivium. 5 The Greeks saw public service as a position of honor in a way that is hard to imagine today. The knowledge that was deemed to be of necessity to the citizen was what was most important to living one’s own life successfully. Today, the Liberal Arts has been watered down so much that the modern definition is meaningless. The Association of American Colleges & Universities defines it as “an approach to college learning that empowers individuals and prepares them to deal with complexity, diversity and change.” If anybody is aware of a kind of knowledge that doesn’t deal with “complexity, diversity, and change,” please let me know. Education: A Classical Kind of Leisure Though we should develop professional schools to help people gain employment, we should not forget education’s ultimate role in nourishing the soul. The word “school” comes from the Latin word skole, which translates to leisure. It describes a place to celebrate the pursuit of knowledge. It stands in contrast to the contemporary grind of slaving through term papers and staying up all night to study for exams just so we can get into the kind of college we can brag about with bumper stickers on our SUVs. But the quest for a diploma that will unlock a prestigious job misses the ultimate point. Often, we salivate so intensely for the eventual diploma that we never stop to ask why it’s worth chasing in the first place. If we continue to value only useful skills, we’ll end up with work-obsessed technocrats who are blind to the transcendent and unfulfilled by the rat race of achievement. Or maybe, that’s what’s already happening. We can do better. An expansive vision was best described by Elena Shalneva, who wrote: “The real purpose of education is not to acquire skills. It is to develop the mind. Fill it with knowledge, yes — but also charge it with fire, like a torch, so that, long after we have left the student bench, the mind still gleams and glares and throws a challenge to the maddening mysteries of the world.” Her vision is a return to a more classical definition of leisure. But not the American kind of leisure where you veg-out by ordering Dominos, cracking open a six-pack of White Claw, and binging Netflix all weekend. It’s an active kind of leisure where you engage in meaningful conversation, contemplate enduring questions, and nurture the soul with everlasting wisdom. It’s recreation, not labor. Active, not passive. And by reminding you that there’s more to life than the physical world, her Greek-inspired definition of leisure is an invitation to lose yourself in the majesty of being. Ultimately, the Greeks saw leisure as the expression of the highest moments of the mind. Not as a means to an end, but as an end in itself. Oswald Spengler: Abandoning the Greek Model of Education In the words of Oswald Spengler, we should strive to be less like the Romans and more like the Greeks. His magnum opus, The Decline of the West was a bestseller throughout Europe in the 1920s, even though he was just a high school teacher. He argued that the two societies had little in common beyond occupying a similar geography. The Romans focused on the material world and the utilitarian over the spiritual. They saw Liberal Arts ideas as a means to an end. The Greeks were different. They valued the needs of the soul as an end in itself. They idealized a Liberal Arts Education as a way to grasp a reality beyond the stressful demands of industry. To awaken the soul at a young age, they trained children in literature, geometry, sport, and song, which is why we think of math, plays, and poetry when we think of the Greeks. Where you can understand the Greeks without studying their economic relations, the Romans can only be understood through them. The Rabbi Abraham Joshua Heschel argued that the Romans’ fall from glory came from a short-sided focus on the concrete instead of the abstract. They obsessed over theaters, monuments, aqueducts, bridges, and buildings. Instead of cherishing the nonmaterial, they cherished physical objects like the Colosseum and the Pantheon. And yet, for all its grandeur, Roman utilitarianism reflected a culture of material greed and the forfeiting of worldly wisdom. Spengler described the Romans as “unspiritual, unphilosophical, devoid of art, clannish to the point of brutality, aiming relentlessly at tangible successes.” Just when you think modern Americans are so different, consider the way we’ve devalued cultural knowledge in favor of technical know-how. Like the Romans, we praise industry and material wealth. In the late 1800s, a student wouldn’t have been admitted to Harvard without knowledge of Classical literature, algebra and plane geometry; familiarity with the laws of physics and elementary astronomy; and knowledge of the history and geography of Ancient Greece and Rome.6 We should scratch our heads at the parallels between the contemporary West and the late-stage decadence of the Roman Empire, which anticipated its collapse.7 Like the roadrunner from Looney Tunes, America has run off the cliff of tradition. Some can sense the cultural decline. It’s only a matter of time before we look down and confirm the fall. 6 I’m making a broader point about Civilized Education (which I’ll describe later in the essay), not a narrow endorsement about the specific knowledge you once needed to get into Harvard. Classical languages, for example, are not as important to me as studying history and philosophy. 7 In the words of one Yale University professor: “Somebody may decide in a few hundred years that the Dark Ages began in 1950. And that those pathetic people impressed with their little technological toys nonetheless didn’t know anything.” We should not abandon our Greek values. Though we should train students for economic prosperity, we should not lose touch with our humanity. We should embrace the transcendental as well as the tactile; what’s interesting in addition to what’s practical. To make that happen, we’ll need to separate education into two camps: civilized and professional. The Two Kinds of Education: Professional and Civilized Colleges must stop trying to do two things at once — preparing students for the workforce while also trying to teach the Liberal Arts — and failing at both.8 8 There is a reason that most American colleges want students to stick around for four years, yet the requirements for their major can be completed in a little over half the time. Unlike their European counterparts that focus exclusively on one specialized area, the American college experience is focused on personal and social development, via dorm rooms and electives alike. Historically, there have been two kinds of education: Professional Education for people who labor and Civilized Education for people who don’t have to work for a living.9 These two approaches have led to different kinds of teaching, even in the same domains. In mathematics, the working-class builders learned trade secrets while the aristocrats studied theoretical mind exercises like Euclid’s Theorem. But in the modern world, we’ve conflated the kind of education you need to make money with the kind you need to be civilized. 9 Implicitly, the point is that once people have achieved a comfortable level of wealth, they should be expected to pursue higher ends. Conventional wisdom says that more formal education is better, but we actually need less of it. The public has been sold the lie that a decade and a half on the conveyor belt of academia is the fast track to the American Dream. This is wrong. Four-year degrees are oversold, overpriced, and oversupplied. By turning a college education into a prerequisite for a “respectable” career, we’ve given universities the liberty to charge exorbitant tuition. Nassim Taleb argues that we can’t agree about what education should look like because we bundle two kinds of learning which should actually be separate. Inspired by him, we should solve our higher education problem by separating education in two parts: one that makes you employable so you can take care of your material needs and another that prioritizes the accumulated history of civilization so you can nurture your immaterial ones.10 10 Taleb’s original words are technical and liberal, but I’ve changed them to professional and civilized to match the rest of the essay. Professional Education should be inexpensive and available to everyone. Though Civilized Education shouldn’t be required, it should be accessible to those with an active interest in it. If that means young people need to focus on financial stability and making themselves useful, so be it. But higher education should no longer be a mandatory checkbox that traps people in five figures of debt, without the return-on-investment to justify the time it takes or the risks of borrowing that kind of money before you’re old enough to drink a beer. With that in mind, we need a way to think about Professional Education. Professional Education Professional Education should be short and focused. To keep pace with the changing economic landscape, it should be run by nimble organizations, mostly outside of the traditional university system. Students who want to become technicians or architects don’t also need to spend two years reading Chaucer. And yet, due to an outdated model of education, we force them to and make them pay the bill. Institutions that prepare people for e"
