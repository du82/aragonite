title = "The Ultimate Guide to Writing Online - David Perell"
description = "Think better. Grow your audience. Accelerate your career."
full_description = "Long Form The Ultimate Guide to Writing Online I was a terrible writer growing up. I got a C- in my college writing class. At one point that semester, I skipped ten of those classes in a row because I didn’t see the value in learning to write. When I told my high school writing teacher that I’d taught thousands of people to write online, she spit out her drink because she thought I was joking. If I didn’t grow up with the passion to write, where did it come from? I started writing because I was jobless and needed to turn my life around. I was an over-saturated news consumer with nothing to show for it. I loved ideas, but had nobody to talk about them with. When I brought up intellectual subjects, my friends mocked me. I was unemployed, overstimulated, and unfulfilled. Desperate for a solution, I started writing online. At the time, I was nameless and stuck on the sidelines because I didn’t have the gumption to share my ideas. I experienced a cocktail of searing emotions — envy, inspiration, fear, curiosity, rage, hope, hopelessness, excitement, and self-loathing. But with each article, things got a little better. For the first time in my life, I made use of the information I consumed. The friends I made shared my obsession with ideas. As I published, I realized that everything I wrote was a magnet to attract opportunities that felt like magic in the moment, such as a $20,000 grant from Tyler Cowen’s Emergent Ventures program and a podcast interview with Neil deGrasse Tyson, arguably the world’s most famous scientist. Five years later, I can say that writing on the Internet is among the best life decisions I’ve made. The 90 minutes I spend writing every morning is my most important habit and the activation code for just about everything good that happens to me. For years, I thought that being successful and being myself were diametrically opposed, but becoming an online writer has shown me that I can succeed by bringing out more of myself — and so can you. Writing gave me wings. It unlocked the latent potential of the Internet. You can access humanity’s best thinking, improve your own, and freely share your best ideas to a global audience. The writer’s path is no longer reserved for authors, journalists, or your aunt’s crazy Facebook rants. Anybody can walk it now. My life is devoted to helping people write online. In Write of Passage, I teach a proven system that’s built for the 21st century. Our alumni base includes some of the fastest-growing online writers in the world right now (such as Packy McCormick and Ana Lorena Fabrega). I’ve distilled the most important principles from the course into this guide. Writing from Abundance is the art of collecting ideas so you can think better and avoid writer’s block.Writing from Conversation is the art of using dialogue to identify your best ideas and double down on them. Writing in Public is the art of broadcasting your ideas to the Internet so you become a beacon for people, opportunities, and serendipity. The game of online writing rewards people who publish consistently. Though frequency is the price of entry, quality writing is a force multiplier on your success. If your ideas resonate, the number of opportunities available to you will explode. As you write, you’ll gain clarity around your Personal Monopoly — a unique online identity that emerges out of your skills, experience, and interests. As a compass, it’ll guide you towards the right people, meaningful work, and a life of freedom. By the end of this guide, you’ll have a roadmap for building one. Now, I’m going to unpack what it takes to become a successful online writer. Contents Write from Abundance Upgrade your Information DietPractice the Capture HabitBuild a Note-Taking System Write from Conversation Conversations with FriendsConversations with ReadersConversations with Editors Write in Public Engage the PublicBuild your Online HomeStart an Email Newsletter The Craft of Internet Writing Make it POPFind your Key IdeaDevelop Your Voice Personal Monopoly What is a Personal Monopoly?Where to Begin? DOWNLOAD YOUR PERSONAL MONOPOLY GUIDE Become known as the best thinker on a topic and open yourself to the serendipity that makes writing online so special. Uncover your strengths, clearly communicate your values, and start building your reputation online. Download the guide to your Personal Monopoly. Write from Abundance My Struggle with Writer’s Block I used to face crippling bouts of writer’s block. My mind would race with ideas when I was away from my desk, only to turn off whenever I sat down at my computer to write. I’d spend hours looking at my screen, only to get no writing done and leave with a blank page. It was infuriating. Fortunately, my writer’s block disappeared once I started Writing from Abundance. The premise is simple — build a bank of inspiration while you’re away from the computer and before you sit down to write. Capture your epiphanies. Save the best quotes you read. Identify ideas that resonate with you and jot them down as notes. Writing from Abundance is the art of collecting ideas so you never have to write from scratch. It’s about living a life that brims with inspiration. That inspiration can come from external sources—like social media, articles, or books. It can also come from internal sources– like dinner parties, work meetings, or shower thoughts. If you capture ideas when they’re in the forefront of your mind, you won’t have to pray for them to come back when it’s time to write. Once I learned to Write from Abundance, I saw how the practice was alive in many fields. I last saw them when I visited my tailor and asked him for help making a blazer. Instead of starting from scratch, he put a bunch of materials on the table (silk, buttons, swatches, etc.). Then he mixed and matched the possibilities until a design emerged. Your notes are like those raw materials. If you ever get stuck, you can pour them onto the page and see what materializes when your ideas collide. In order to start Writing from Abundance, there are three things to do: Upgrade your Information DietPractice the Capture HabitBuild a Note-Taking System 1. Upgrade your Information Diet FIND BETTER INGREDIENTS Most people don’t use the Internet to learn. They use it to follow pop culture and keep up with their friends. Neither of these strategies are very effective for having better ideas. Every great writer I know obsessively curates their information diet. They rightfully know that high-quality writing begins with good taste for what you consume. Writing is like cooking. If you walk into a Michelin Star restaurant and ask the chef: “What’s the fastest way to improve the quality of your food?” they’ll likely say: “Better ingredients.” At the end of the day, heaps of dressing can’t make up for stale lettuce. A salad can only be as good as the fruits and vegetables inside of it. Your experiences, conversations, and information sources contain the raw ingredients for your writing. It’s easier to have unique ideas when you read things other people don’t. Early in his career, Warren Buffett got some of his edge by going beyond the Annual Reports that everybody else was reading and picking up 10-K filings that were tough to get your hands on back then. David Epstein aims to read ten journal articles per day when he’s working on a book. Many of his best ideas come from reading papers that others won’t and synthesizing them for a public audience. Beware of too much news consumption. Yes, it’s good to be an informed citizen. But the idea that obsessively reading the news is the best way to stay informed is a lie sold to us by the propaganda machine. Most news is inconsequential. It’s entertainment dressed up as information. Though it can be good to have a general sense of what’s happening in society, you probably don’t need to be plugged into a 24/7 stream of news — or what I call: the Never-Ending Now. ESCAPE THE NEVER-ENDING NOW I once attended a comedy show with a group of friends. Since the venue was across town, we split a Chevy Suburban SUV. From the moment the driver hit the gas, everybody was on their phones. From the back row, I watched my friends scroll their social media feeds with ferocious intensity. One thing stuck out: everybody in front of me only consumed content created within the last 24 hours. No exceptions. I succumb to the same impulse. Chances are, so do you. Like hamsters running on a wheel, we live in an endless cycle of ephemeral content consumption — a merry-go-round that spins faster and faster but barely goes anywhere. The Internet is a novelty machine that pulls us away from age-old wisdom. Even though we’re just a click away from the greatest authors of all time, from Plato to Tolstoy, we default to novelty instead of timelessness. We’re trapped in a Never-Ending Now — blind to history, engulfed in the present moment, overwhelmed by the slightest breeze of chaos. Here’s the bottom line: You should prioritize the accumulated wisdom of humanity over what’s trending on Twitter. If you need timeless recommendations, I’ve spent the past five years collecting some for you. CURATE YOUR INFORMATION STREAMS How can you upgrade your information diet? Short-form: Social media is at its best when it matches you with people who share your exact interests and teach you about what you want to write about. Unfollow celebrities. Replace them with people who make you smarter and bring long-lasting joy. Medium-form: Read less of the news. Subscribe to magazines and YouTube channels that post timeless ideas. Read essays and speeches that have stood the test of time. Find people whose recommendations you consistently enjoy and subscribe to their newsletters.Long-form: Get away from your screen and read more books. If it helps, start a book club. Find classic books to read. Watch old documentaries and listen to lecture series. Crawl the Internet for college syllabuses so you can read them on your own time.1 2. Practice the Capture Habit Now that your incoming information is solid, you need a way to harness it. It’s not enough just to binge eBooks and list a stat on your website (one Write of Passage student refers to this as “Book Chugging.”) You should save the best parts of what you read, so you can easily reference them later. By capturing ideas in the moment, you can effectively start essays when they’re 80% finished. Notes are so central to my writing process that writing without them is like building a campfire without a pile of wood. Because I’m so diligent about writing ideas down, I don’t need to run back to the “forest” every time I get stuck. Instead of starting a new research process for each new article, I pull from ideas I’ve already captured in my casual reading, in conversations, and in the ordinary moments of my life. All those notes became intellectual fodder for future pieces. AMBIENT RESEARCH I call this process “Ambient Research.” By the time I sit down to write about a topic, I’ve already done most of the research I need to write about it. This method of Ambient Research is the opposite of what I learned in school. My teachers promoted Active Research, which led me to spend hours reading in the library after I picked a topic. Without notes to build upon, I had to start from scratch whenever I began an essay. Since I’m a slow reader, I had to give up my weekends for research. Being a writer doesn’t mean you have to sacrifice huge swaths of your life. You don’t need to bunker down in a library for days straight in order to find inspiration. You already consume media, have thoughts, and write ideas in group chats. When you practice the habit of capturing what’s already happening, you’ll find that you have all the material you need to start writing. Effective ambient research happens when you capture the best ideas you consume, the epiphanies you have, and the things you’ve already written to friends and colleagues. I’ll focus on each in the next three sections. SET UP ‘READ-IT LATER’ APPS Have you ever had that feeling where you have like 200 tabs open on your browser, but you don’t want to close them because you’ll lose such valuable articles that you intend to read? I’ve felt that anxiety. Luckily, there’s a solution: Read-it-Later apps. I never read articles in my web browser. When I come across an interesting article, I save it to an app that automatically downloads it to my phone so I can read it later. Saving these articles gets me out of a reactivity loop, where I read things immediately after I find them (which is what most people do). I want my reading to be much more intentional than that. The app is called Instapaper. Instead of driving myself crazy with a bunch of open browser tabs that rise up like a game of whack-a-mole, I save articles I want to read to Instapaper and open the app whenever I’m in the mood to read. Since all the articles are downloaded to my phone, I can read them on the airplane or anywhere I don’t have service. No matter what, everything I highlight automatically saves to my note-taking system. Read-it-Later apps act as a quality filter for your reading too. By saving articles to an app and refusing to instantly read things you come across on the Internet, you raise the bar for what grabs your attention. With a Read-it-Later app, whenever you sit down to read, you have hundreds of articles to choose from. You can allocate your attention to the best one. Using a Read-it-Later app showed me how many ideas I consumed not because they were important, but because it was marketed with “You have to read this!!!!” language. CAPTURE YOUR OWN IDEAS Do you ever forget ideas? Maybe you forget to write down an insight from a buzzing conversation with a friend, and two months later, when somebody asks you about what you discussed, you don’t remember zilch. The same thing used to happen to me while traveling. I’d have tons of epiphanies while walking through a new city, only to forget them once I returned home. These impressions and emotions were unique to me. No Internet search could have yielded them. Now, they’re lost to the entropy of time. The clarity of memory decays quickly, so we shouldn’t just save other people’s ideas. We should save our own ideas too. Until we have a central place to capture our best thinking, the joy of epiphany will turn into the anxiety of forgetfulness. Many of your unique and provocative ideas will come when you’re away from the computer — doing chores, driving around, or walking through your neighborhood. Ideas are fickle. That’s why so many of history’s greatest writers have walked around with a notepad. When I read about the writing processes of historians, they repeatedly talk about how they capture their impressions immediately after an interview ends, while their memories are still sharp. They know that ideas that seem obvious in the moment will be forgotten by the time they’re ready to write about them. Following their lead, whenever I have an i"
