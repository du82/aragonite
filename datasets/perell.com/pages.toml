title = "Hi, I'm David Perell."
description = "I write, host a podcast, and run a writing school called Write of Passage."
full_description = "Hi, I’m David Perell. Welcome to my online home. I write, host a podcast, and curate a collection of the best writing on Writing Examples. Join 70,000+ people who’ve chosen to follow along. As seen in Essays Most of my essays are about business, education, and what it means to be a citizen of the Internet. These essays are a record of my intellectual quest to make sense of the world. They’re the diary of my contemplative life. All Essays Latest essay Practice Analytically, Perform Intuitively The greats in every field follow this mantra to perfect their craft. Featured Peter Thiel’s ReligionYou know him as the most influential investor in Silicon Valley. But did you know that the source of his ideas is Christianity? Practice Analytically, Perform IntuitivelyThe greats in every field follow this mantra to perfect their craft. How Learning HappensThe conventional approach to learning is wrong. What would a better approach look like? How I Write Podcast Before book sales and PR buzz, your favorite writers began with two things: the blank page and an idea. Each week on How I Write, we go behind-the-scenes with today’s top writers to uncover the meta-mechanics of writing and the lifestyle behind it. You’ll be the first to hear writers deconstruct their creative process: from banging their head on the keyboard to marking the last period of their final draft. Victory. Come discover how great writing is made. And who knows? Maybe you’ll be next. Featured Writing Examples Writing Examples is a mission to inject some High Noon Chutzpah back into the world of writing. It’s a website. It’s a newsletter. It’s a one-stop-shop where modern-day writers can learn to write like the greats: how to describe a party like F. Scott Fitzgerald, how to make your audience laugh like Jerry Seinfeld, how to write a speech like John F. Kennedy Featured Notebook My notebook is where I develop my ideas in public. If my essays are finished paintings, these are my intellectual sketches. They’re a low-stakes place where I share ideas that are longer than a tweet, but too immature for a full-on essay. Explore Notes Latest note A Divine Intuition Under a secular mindset, intuition is all about you — your wants, needs, passions, and desires. A heavenly, God-inspired intuition is different. Featured The Paradox of AbundanceInformation abundance, like all markets of abundance, is bad for the average person but great for a small number of people. Intellectual LonelinessI have a confession to make: I leave most parties early because I’d rather read a book. Should You Write Every Day?When I started working out, I hated it. I wanted to gain muscle but dreaded working out. Eventually, a friend got fed up with my laziness and told me what I needed to hear: “If you want to build the habit, go to the gym every single day without fail.”"
