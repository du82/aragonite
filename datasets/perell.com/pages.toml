title = "Teaching Like a State - David Perell"
description = "David explores how teaching like a state limits teachers' effectiveness and students' learning. Read here."
full_description = "Short Form Teaching Like a State No teacher had a bigger impact on me than Miles Chen. He was my high school advisor, teacher, and golf coach. He was famous for his love of pork buns. Everybody talked about the restaurants he took us to and the Chinese food he brought to school. But people outside our golf team never experienced Miles’ wisdom, his appreciation for Asian culture, or how the games we played on the golf course laddered up to a galaxy of life lessons. Miles did his own thing. He cared little for norms. Unlike other teachers, he recognized that the bond you build with your students is more important than any material knowledge you impart to them. In class, he created his own curriculum, so his teaching was less predictable than a Cardi B interview. He rarely gave tests and reluctantly handed out grades at the end of the semester. Even though he was a triple major from UC Berkeley — painting, physics, and astrophysics — he wasn’t trapped down by rigid educational norms. He taught with the magic wand of humor, as opposed to the bureaucratic seriousness of his colleagues. To date, Miles was the only teacher who made math feel like more than symbols on a page. Through his teaching, the universe came to life as his equations twinkled like stars in the nighttime sky. Now that I’m a teacher, I want to be more like Miles. Actually, I want our entire school system to create teachers like him. When Rigidity Goes Wrong The federal government has tried to improve education by imposing rigid top-down standards. The education system has stagnated because of increased standardization. Standardized grades. Standardized tests. Standardized curriculums. And yet, educational outcomes have not improved despite the increased standardization. As Tyler Cowen showed in The Great Stagnation, there has been no significant improvement in the average reading score for 17-year-olds since 1971 or the average mathematics score since 1973¹. Despite flat test scores, America doubled its per-person education spend during that time frame. Americans are losing ground, even on standardized measures. Two out of three children don’t meet reading proficiency standards according to a test administered by the National Center for Education Statistics. Worse, 20% of American 15-year-olds still don’t have the expected reading skills of a ten-year-old. Teachers are teaching to the tests, but students still can’t pass them. Worse, the emotional side effects of modern education are worse than the disease itself. Kids aren’t meant to be locked in a classroom for 7 hours a day, 5 days a week, for 12 years of their lives. That’s not education. That’s criminal. I’m reminded of a story about Sarah, the 12-year-old daughter of a family friend. Sarah’s always struggled with self-esteem. To cope, she attends weekly therapy, takes an antidepressant called Prozac, and when the weight of emotional toil is too heavy to bear, she cuts herself. But Sarah’s mother says she’s been happier since the Coronavirus quarantine began. Without school, she’s rediscovered her love for learning. As her mother said: “Traditional learning environments can be very stressful for anxious kids. I just feel blessed within the chaos, an emotional break is good for my girls.” Sarah isn’t sick. The system is. We design our schools to drive children mad. But instead of questioning the system, we medicate children and double-down on the system that makes them miserable in the first place. In that way, we’re like pill-obsessed doctors who ignore the field of preventative health and prescribe medications faster than activists hand out flyers. Why Brasilia Failed When considering the problems with education, I’m reminded of the failure of Brasilia, the capital city of Brazil. As James Scott described in his book, Seeing Like a State, the utopian project began in 1957. The genesis of this top-down view begins with modernism, the idea that rational design would make rational societies. Modernism grew out of the order of World War II military units. Straight lines. Sharp, right angles. No room for randomness. Designers believed the modernist style would eradicate the miseries of the human condition, from hunger and disease to tyranny and inequality. In architecture, there was no room for the personal touch of a craftsman — the inverse of the Middle Ages when builders had independence and didn’t have to follow top-down master plans. But the lowly individual would not be trusted under the cold rule of modernism. Only the elites had the technical and scientific training to rationalize society, leaving no room for local knowledge or individual creativity. Inside Brazil, the modernist-inspired city of Brasilia was known as “The City of Tomorrow.” It was backed by mountains of cash and fountains of national pride. Juscelino Kubitschek, the president of Brazil when plans for the city were conceived, said the city would give Brazilians “fifty years of progress in five.” The city might have shined in photographs, but the infinity highways and sterile apartment blocks were socially lifeless. The perfect city never arrived because Brasilia was built for tower-looking architects instead of the street-walking citizens who actually lived there. Source What should we learn from Brasilia? We should not assume everything important can be measured and only what we can measure is real. The view from a map cannot capture the culture of a city. Much of what makes a culture thrive looks messy and purposeless on a map. Humans need chaos. Not everything important can be understood, so decision-making should happen at the local level. Look at a map of Amsterdam and Brasilia, and you’ll see stark differences. Amsterdam was born in the 12th century when fishermen living along the River Amstel built locks to protect themselves from floods. The name Amsterdam comes from the former name of the settlement: “Aemstelredamme,” which means “dam in the river Amstel.” Since those first settlers arrived 800 years ago, the city has evolved gradually. The city never had a central planner so the lines on a modern map of Amsterdam are hard to follow. So are the streets, where cars, cyclists, trolleys, and pedestrians compete for space. Today, tourists get lost in the labyrinth of narrow roads. Brasilia is the opposite. On paper, the lines are straight and elegant. Boxy buildings intersect with boxy parks and boxy roads. Architects who use rigidity and uniformity to organize a system like a city or a school to appeal to order often destroy what appeals to the heart. That’s why, despite its theoretical perfection, Brasilia lacks life while Amsterdam buzzes with energy. Source: Apple Maps. Nice how chaotic Amsterdam’s streets are. Inner Amsterdam was shaped as much by the canals as it was by its citizens, and the criss-cross of streets indicate the lack of a central planner. Source: Note how straight the lines are and how long the roads are, two signs of a centrally planned city built for cars instead of people. It looks like an airport map. From the perspective of a map-maker, Brasília is much cleaner than Amsterdam. In my own Write of Passage course, each student is matched with a mentor and a small group of students. Like neighborhoods in a city, each small group develops its own culture during each cohort. Some students start Slack groups. Others write together in weekly Zoom calls. All of them develop a shared language of inside jokes. Students who live in the same city take the course offline to meet for drinks in-person and edit each other’s essays. As a teacher, I want my course to feel less like the empty plazas of Brasília and more like the vibrant streets of Amsterdam. The Issue With Federal Standards Miles’ class never had a textbook. He clashed with other faculty because he never followed a traditional or standardized teaching style. Other teachers rolled their eyes, but Miles didn’t care. As a co-founder of my high school, he couldn’t be fired. Perhaps because he was safe in this way, he was able to reject the one-size-fits-all style of lectures and tests. Unlike other teachers, Miles taught with a playful style. Most teachers taught in droning lectures and measured what we learned by our ability to memorize what they said. Borrrrringgg. But Miles’ classes were fun, so I tried harder in them. Of all the astrophysics projects he assigned, my favorite was a to-scale map of the universe running from our classroom in San Francisco across the entire United States. According to my model, the outer stars stretched beyond New York City — 14.5 billion light-years away. Until then, I had never grasped the immense, ever-expanding scale of the universe. He didn’t teach astrophysics to prepare students for college. Instead, he worked to make us appreciate the vastness of space and the wonders of the nighttime sky. He made the subject material come alive. He never assigned more than three questions of homework every night, so I had time to engage with each question. Out of all my science classes in high school and college, Miles’ class was the only one I got an A in. Standardized testing is to school as Brasilia is to architecture. A top-down architecture with noble intentions but lifeless results. These top-down standards stop students and teachers from taking risks. A friend and former educator says AP teachers in some school districts receive a $50 bonus for every student who receives a score of at least a “3” on their subject’s AP exam. Students at the Success Academy charter school systems in New York score high on standardized tests at the cost of creativity and independent thinking. Their students are trained to be bureaucrats from a young age. The dogma: Follow the rules. Listen to your elders. Don’t take too many risks. One former teacher told me she was shocked at the level of anxiety students had when she asked them to choose their own essay topics because students follow directions so they can improve test scores. Far-away bureaucrats are too involved in the lives of our children. Even if their intentions are strong, the results have been disastrous. Curriculum decisions should be pushed down the ladder as far as possible. Otherwise, we’ll end up with the same one-dimensional system that’s led to rising costs and stagnant test scores. Grades: False Indicators of Learning Grades destroy curiosity. Too many kids learn for the sole purpose of raising their GPA because that’s what the system incentivizes². From an early age, I observed that my success in school depended more on my grades and less on how much I learned. In college, even though I wrote essays on my own and worked as an intern in New York City for companies like Skift, I was almost kicked out of my fraternity because my GPA was below 3.0. Likewise, my college counselors evaluated me on two metrics: grades and SAT scores. Neil deGrasse Tyson once said: “When students cheat on exams, it’s because our school system values grades more than students value learning.” Our standardized curriculum forces us to think too narrowly. I see this first-hand running a Write of Passage summer camp for 9-12-year-old kids. Students come from countries like Brazil, Panama, Argentina, Canada, India, and Pakistan. Instead of telling kids what to do, we encourage them to identify a problem and explore their own interests. During a recent cohort, they made comic books, top motion videos, games out of recycled materials, YouTube videos to raise awareness about animal cruelty, cooking tool prototypes, a scratch animation on recycling, a newsletter to save dogs in Panama, and a recipe for healthy smoothies that actually taste good. Trusting kids to express their individuality yielded the same unexpected charming diversity that makes a city like Amsterdam so special. Reflecting on her learning experience, one student said, “The stuff we learn in school has little to do with our real life. It doesn’t really matter. What matters is we pass the test so we can go on to the next grade.” In traditional school, by narrowing our focus to an incomplete but easy-to-measure optimization figure, grades distract us from learning itself. Kids are discouraged from diving down rabbit holes because they aren’t on the syllabus. But as any passionate learner will tell you, your curiosity will help you learn more than any syllabus ever will. For an example of an independent learner, consider Nassim Taleb, the author of five best-selling books including The Black Swan. At the age of 13, he set a goal to read for 30-60 hours per week. “Only the autodidacts are free,” he says. Choosing to learn on his own prevented him from becoming a “swallower” (somebody who “swallows” school material and whose knowledge is limited to what’s on a curriculum). Instead of fighting his ADHD, he ran with its tide. His natural craving for stimulation drove his scholarship. When he got bored with one book, he moved on to the next one. That way, he could get bored with a specific book, not the act of reading itself. In contrast, school taught me to hate reading. Studying Shakespeare hurt my brain, and I had no interest in Paradise Lost. But during my junior year of college, after I experienced the joy of Twitter, I stopped taking school seriously and started learning on my own instead. If a book was boring, I stopped reading it. If an assignment didn’t interest me, I did the bare minimum. Good grades became an afterthought, but my pace of learning exploded. And yet, I couldn’t prove my accelerated learning speed. My slight GPA improvement hardly reflected my newfound love for ideas. My passion for learning wasn’t the problem. Tests were. When I needed to ace an exam, I prepared not by engaging with the material but by downloading a QuizLet set and memorizing flashcards in the library. The process was so mind-numbing that Adderall pills were worth their weight in beer during finals week. More frustrating than my own scores was watching kids who spent most of their time partying receive better grades on tests. Those students were sometimes the “best” students and were often the ones who least wanted to engage in intellectual conversations. Ideas served a utilitarian purpose: getting good grades. Getting a 3.5 GPA was the benchmark, and if you hit it, you could drink guilt-free on the weekends and tell friends you were crushing it like a red Dixie cup. Grades and the Goodhart’s Law Trap Goodhart’s Law states, “When a measure becomes a target, it ceases to be a good measure.” Two famous examples come to mind. In one rat-infested city, the local government offered a bounty for rat tails. But instead of killing rats, enterprising individuals followed the incentives of the system. They captured rats, cut off the tails, released the tailless rats to breed, and turned in the tails for cash. Over time, the number of rats increased³. More famously, Soviet factories were rewarded based on the number of nails they produced. Factory managers respon"
