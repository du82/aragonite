["https://perell.com/essay/imitate-then-innovate"]
title = "Imitate, then Innovate - David Perell"
description = "Imitate, then Innovate is my motto for improving at any skill.  It’s counterintuitive, but the more we imitate others, the faster we can discover our unique style."
full_description = "Long Form Imitate, then Innovate Imitate, then Innovate is my motto for improving at any skill. It’s counterintuitive, but the more we imitate others, the faster we can discover our unique style. In the entertainment world, there’s a long lineage of comedians who tried to copy each other, failed, and became great themselves: Johnny Carson tried to copy Jack Benny, but failed and won six Emmy awards. Then, David Letterman tried to copy Johnny Carson, but failed and became one of America’s great television hosts. Reflecting on his own influences, Conan O’Brien said: “It is our failure to become our perceived ideal that ultimately defines us and makes us unique.” Modern creators do the opposite though. They refuse to imitate others and stubbornly insist on originality, which they hold as their highest virtue — even when it comes at the expense of quality. They might deny their ambition toward originality when you talk to them, but they reveal it in their actions. In general, creators spend much less time imitating their heroes than they do trying to make something new. I call it the Originality Disease — a pervasive plague that makes creators feel scared to imitate other people’s styles. The problem may be worst among writers, who speak about their craft with levels of mystery that are usually reserved for the numinous. Writers would be smart to learn from other fields, though. Quentin Tarantino Hollywood film directors come to mind because they’re seen as the essence of what creative professionalism looks like. When people look at Quentin Tarantino, they see a mad creative with a singular talent for making original movies. But Tarantino’s originality begins with imitation. He’s famous for replicating and building upon scenes from other movies, and he once said: “I steal from every single movie ever made.” Looking at Tarantino’s work, I revel in the paradox that imitation and innovation are not opposed, but operate in tandem. I don’t know about you, but I’m a “sit back, grab some popcorn, and enjoy the movie” kinda guy. Movies are pure entertainment for me. A chance to escape the world of responsibilities and enter the trance of a captivating story. I thought everybody was like this until I watched a film with a director who was the total opposite. He was attentive to all the tiny details, from the way the musical score enhanced the film’s emotional journey, to the way light moved across the actors faces, to the way camera movements foreshadowed upcoming plot developments. Listening to him reflect on the film, I had to ask: “Did we even watch the same movie?” I felt like I was stuck in flatland, while he lived in four-dimensional space.1 1 A director friend tells me that in Joker, the musical score helps us empathize with the Arthur Fleck who would eventually become the Joker. The composer Hildur Guðnadóttir used the cello in the opening scenes to create empathy with the protagonist. But then, as the Joker’s dark side and inner turmoil was revealed, the orchestra got louder and louder. The angrier he was, the bigger the orchestra became. Through it all, the music created the audience’s perception of him: simple, naive, and uncool. From him, I learned that creators consume art differently than consumers. They’re far more intentional in what they consume. Consuming art is productive work for them. Directors watch movies not just to be entertained, but also to see how they’re made. Consciously or not, they’re developing their own mental Pinterest board of ideas to borrow and build upon in their own work. George Lucas comes to mind here. To create Star Wars, he went back to the teachings of Joseph Cambell, who spent his career studying mythology and religion. Through his writings, he laid out a theory of the archetypal hero which shows up in all kinds of stories throughout history. Today, it’s known as “The Hero’s Journey.” Chances are, you’re familiar with it. While writing Star Wars, Lucas drew inspiration from Campbell’s most famous book: The Hero with a Thousand Faces. Lucas felt the triad of mythology, folklore, and fairy tales had disappeared in the West—and he wanted his new film to revive it. In order to align the story with the classical motifs that’d reverberated through so many human cultures, Lucas re-wrote his draft of Star Wars in order to align it with Cambell’s work. Lucas’ artistic originality was enhanced by an imitative respect of Campbell’s work and the recurring themes he discovered. Had Lucas suffered from the Originality Disease that plagues so many contemporary writers, Star Wars wouldn’t be what it is today. Originality Disease Where does this Originality Disease come from? I have three explanations. The first is pretty clear: misunderstanding inspiration. Some of the juiciest inspiration comes from admiring (and maybe even reverse-engineering) other people’s work. But many people think inspiration needs to strike out of thin air, like a bolt of lightning. They fear that the Muses of novelty won’t visit them if their mind is contaminated with what’s been done before. In blind pursuit of originality, they avoid studying anything that’s come before them out of a fear of tainting their minds with the stain of influence. Rather than standing on the shoulders of people who’ve come before them, they look within themselves for a breakthrough idea. The second is more subtle: fetishizing originality. I think this part of the disease comes from academia, where people do study those who’ve come before them—but only so they can do something different. Since scholarly journals insist on original contributions, academics are incentivized to study things nobody else is studying. The challenge, though, is that originality and usefulness are not the same thing. I worry that academics are so focused on checking the “nobody’s ever written about this before” box that they sometimes forget to make useful contributions to human knowledge. The third is pure conjecture: self-obsession. Perhaps our Originality Disease has its roots in Freud’s work, which still underpins our model of human psychology. To the extent that ideas like the ego and the subconscious seem trivial, it’s only because they’ve been so influential. Freud’s ideas basically went viral, and as they did, made their way to Salvador Dalí who led Europe’s surrealist painting movement. Instead of trying to capture reality like the Realists or interpret it like the Impressionists, the Surrealists went inwards and painted the landscape of their own consciousness. They rejected logic and reason in favor of dream-inspired visions. Then, the psychedelic movement of the 1960s may have entrenched us even deeper inside the internal world. As the twin movements of self-love and free expression grew, people rejected the authoritative declarations of Christianity and, in the terrifying wake of World War II, anything that smelled like orthodoxy. Instead of looking outward for answers, people turned inwards. This trend has only accelerated with the rise of therapy and meditation—fields in which many advocates insist that the self knows best and the answers are within us. We think of ourselves as tiny little islands. This is a uniquely contemporary mindset. As the pastor at a local church said to me recently, the early Christians believed that our lives were porous. Rather than buffering themselves from exterior influences, they welcomed the divine in their lives and let it grow in them like a lush springtime flower. It is said that art reflects the spirit of the times. Perhaps the thinking of our secular age has infiltrated our creative mindset too. In the world of art, our paintings are increasingly abstract in order to reflect the subjective experience of the artists who made them. So often, they aim to capture attention with the originality of shock value instead of quality. This narcissistic self-worship has people rejecting the canon. As we’ve turned inwards for inspiration, we’ve turned originality into our cardinal virtue. The alternative is a pursuit towards truth. In the words of C.S. Lewis, who is famous for the vivid imagination he presented in stories like the Chronicles of Narnia: “No man who cares about originality will ever be original. It’s the man who’s only thinking about doing a good job or telling the truth who becomes really original—and doesn’t notice it.” Lewis’ words align with the premise of Roger Scruton’s excellent documentary Why Beauty Matters.2 He opens it with the idea that before the 20th century, if you asked anybody about the purpose of creating art, they would have said: “To make something beautiful.” But beginning around the time of Duchamp’s urinal in 1917, the primary purpose of art shifted to shocking its viewer with originality instead of beauty. To capture their viewers’ attention, artists disturbed their viewers and violated taboos. Rather than pursuing the lofty goal of objective beauty, we’ve turned inward and the results have been terribly ugly. Scruton insists that our language, music, and manners have become increasingly offensive and self-centered too. He blames the decline in beauty on the self-centeredness of modernity and a nonsensical break from tradition. Fountain 1917, replica 1964 Marcel Duchamp 1887-1968 Purchased with assistance from the Friends of the Tate Gallery 1999 http://www.tate.org.uk/art/work/T07573 Don’t think I’m advocating for stasis though. I like watching humanity innovate, and valuing tradition too much can limit progress. Here, the artists of ancient Egypt come to mind. They trained to write in a rigid script, so their apprenticeships were only complete once they could cut images and symbols clearly in stone, according to the established rules. As Ernst Gombrich wrote in The Story of Art: “No one wanted anything different, no one asked him to be ‘original’. On the contrary, he was probably considered the best artist who could make his statues most like the admired monuments of the past.” Driven by a philosophy of imitation without innovation, Egyptian art didn’t change much. A thousand years later, new works that closely resembled the ancestral ones were praised equally. There was little change, little progress, and little development. It was stagnant — imitation without innovation. Doing the opposite of the Egyptians doesn’t work either. Innovation without imitation is a fool’s strategy. Just look at the historical examples. Einstein’s paradigm-shifting invention of general relativity was enabled by decades of studying classical physicists, whose ideas he later built upon. Many of the most original musicians have spent hours practicing scales in order to pick up on the creative powers of those they admire. In the world of writing, Hunter S. Thompson once hand-wrote every word of The Great Gatsby so he could feel what it’s like to write a great novel. Robert Louis Stevenson meticulously copied paragraphs he enjoyed, and once he got familiar with them, he threw the books to the other side of the room to force himself to rewrite paragraphs from memory. These days, writers are hesitant to promote these imitative strategies. Perhaps their aversion comes from how gung-ho schools are about the dreaded P-Word: plagiarism. The fear of plagiarism is injected into us in school, where we’re taught to fear anything that smells like imitation. Plagiarism was so heavily punished that I imagined it like the electric chainsaw that promised instant expulsion. Of course, plagiarism is wrong. The problem is that our tormented fear of plagiarism has clenched its claws around the things that are actually good for you. Out of excessive trepidation, we’ve lost touch with the subtle, but important distinction between stealing other people’s work without giving them credit (which is obviously a bad thing) and mirroring the style or values of a writer you admire (which should be praised and promoted). What Happened to Imitation? The etymology of the word “imitate” is one of my favorites. During the time of Shakespeare, the word “ape” meant both “primate” and “imitate.” Perhaps the etymology indicates that knowledge of imitation is core to who we are.3 2 That’s one reason why Christianity, the world’s largest religion, tells us to imitate another human being: Jesus Christ. Throughout human history, most imitative learning happened through apprenticeships. Leonardo da Vinci comes to mind. He had almost no formal schooling, but secured his first apprenticeship at the age of 14. Time in his master’s studio led him to study math, anatomy, drawing techniques, and the beauty of geometry. In true “Imitate, then Innovate” fashion, there were obvious similarities between what da Vinci observed as an apprentice and what he’d later produce on his own. In fact, one of his master’s most famous sculptures was of the young warrior David standing in triumph over Goliath. (In fact, some scholars think their master-apprentice relationship was so close that da Vinci posed for Verrocchio’s David). Given that, we shouldn’t be surprised that it resembled the one da Vinci painted later in his career and likely contributed to his fascination with Michelangelo’s statue of David. Today, things have changed. We’ve dropped apprenticeships in the name of efficiency. Instead of doing an apprenticeship, wannabe Da Vincis are training at professional art schools. With the decline of apprenticeships came the decline of imitative learning. The twin rise of the printing press and, later, mass schooling, led us to disproportionately value knowledge that could be codified in textbooks. What humanity gained in its ability to scale the transmission of facts it lost in its disproportionate focus on ideas that could travel in textbooks. The transmission of technique and tacit knowledge was lost in translation. To see what I mean, look at writing education. English class teaches you how to be a good editor because it’s the easiest thing to systematize and communicate in textbooks. That’s why we learn grammar and syntax. Though they’re useful, they don’t have much to say about the deeper but indescribable aspects of writing: idea generation, how to recognize the shape of an interesting argument, honing your style, overcoming the fear of criticism, and fighting writer’s block. Common pieces of advice like “get rid of the passive voice” are shallow, low-leverage points of instruction compared to the real, but hard-to-describe benefits of creating your own vocabulary or becoming a more observant person — both of which are better learned through imitation. What kinds of skills are best trained through imitation? The harder it is to put the core knowledge into words, the more a skill should be developed through imitative learning. Often, these skills have a bunch of subtleties that are best learned in conversation with a master, or by watching them do their work. Cooking is the ultimate example. Though I’ve bought a few cookbooks from my favorite steakhouses, the charr o"
