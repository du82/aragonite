full_description = "Essays My motto is: “Write every day.” Most of my essays are about business, education, and what it means to be a citizen of the Internet. These essays are a record of my intellectual quest to make sense of the world. They’re the diary of my contemplative life. I write two kinds of essays: short-form and long-form. If you’re new here, start with the short-form essays and work your way up to the long-form ones. Latest essay Practice Analytically, Perform Intuitively The greats in every field follow this mantra to perfect their craft. Start here with two of my favorite long-form and short-form reads. Peter Thiel’s ReligionYou know him as the most influential investor in Silicon Valley. But did you know that the source of his ideas is Christianity? Practice Analytically, Perform IntuitivelyThe greats in every field follow this mantra to perfect their craft."
