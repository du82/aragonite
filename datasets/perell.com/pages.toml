full_description = "Notebook Welcome to my intellectual lab. My notebook is where I develop my ideas in public. If my essays are finished paintings, these are my intellectual sketches. They’re a low-stakes place where I share ideas that are longer than a tweet, but too immature for a full-on essay. My notebook is like a personal Wikipedia. There are two ways to navigate it. You can either surf between the recommendations at the bottom of each note or follow the infinite scroll below. Latest note A Divine Intuition Under a secular mindset, intuition is all about you — your wants, needs, passions, and desires. A heavenly, God-inspired intuition is different."
