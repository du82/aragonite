full_description = "You can read what an author writes anywhere. But only on this show will you hear how they write. How I Write Podcast Before book sales and PR buzz, your favorite writers began with two things: the blank page and an idea. Each week on How I Write, we go behind-the-scenes with today’s top writers to uncover the meta-mechanics of writing and the lifestyle behind it. You’ll be the first to hear writers deconstruct their creative process: from banging their head on the keyboard to marking the last period of their final draft. Victory. Come discover how great writing is made. And who knows? Maybe you’ll be next. Learn to write like the greats. Creative inspiration. Expert advice. Never-before-heard stories.Get gold-star writing wisdom in your inbox every Wednesday. And start becoming the writer you’ve always known you can be. #hs_cos_wrapper_dnd_area-module-6 .form-with-text-wrapper .top_pane h5, #hs_cos_wrapper_dnd_area-module-6 .form-with-text-wrapper .top_pane h5 em { color:rgba(201,178,95,1.0); } MEET OUR guests Experts at Their Craft Great writers don’t find success. They forge it. Get an exclusive look at how the world’s best writers forged their way to success – and how you can, too. FEATURED EPISODE SAM ALTMAN Click to Watch Now RICHARD POWERS HARRY DRY ROBERT GREENE LULU CHENG MESERVEY RIVA TEZ AMOR TOWLES STEVEN PRESSFIELD MARC ANDREESSEN TIM FERRISS TED GIOIA MARK MANSON SHAAN PURI THE CULTURAL TUTOR (PT. II) DEREK THOMPSON TIM URBAN MORGAN HOUSEL NICK BILTON KEVIN KELLY ANA LORENA FABREGA SAM PARR THE CULTURAL TUTOR (PT. I) TYLER COWEN & ALEX TABARROK ALI ABDAAL GARRY TAN NEIL STRAUSS SAHIL BLOOM STEPH SMITH BRIE WOLFSON LENNY RACHITSKY CHAMATH PALIHAPITIYA HOWARD MARKS CHRIS DIXON MICHAEL MAUBOUSSIN PACKY MCCORMICK STEVEN JOHNSON DEREK SIVERS JIMMY SONI PAUL MILLERD TIAGO FORTE BYRNE HOBART SAM CORCOS JASON FRIED NAT ELIASON SCOTT GALLOWAY MARK FORSYTH ROB HENDERSON BEN THOMPSON PETER ATTIA SAM ALTMAN"
