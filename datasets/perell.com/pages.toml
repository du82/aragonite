["https://perell.com/essay/annual-review-2021"]
title = "Annual Review 2021 - David Perell"
description = "I’ll start this Annual Review by reflecting on 2021. I’ll share highlights and reflect on the goals I set at the beginning of the year. Later, I’ll outline how I plan to improve my life and set a new vision for 2022."
full_description = "Long Form Annual Review 2021 Introduction 2021 was the year of commitment. I committed to my writing, committed to my business, committed to my existing social circle, committed to my longtime hobbies, and committed to my new hometown of Austin, Texas. This posture of commitment stands in contrast to the first five years of my career, which were defined by novelty and experimentation. In those early years, I was fueled by New York City’s hustle and bustle energy and the lust for achievement that hangs in the air. Since I didn’t know what I wanted, I moved faster than the Energizer Bunny, hoping that something would eventually pay off. Only in 2021 did I discover what I was chasing career-wise. Though the pace of my progress was slower than expected, my vision for the future of my professional life has never been so clear. Instead of being a lone wolf, I now have three full-time employees and a team of 25 people who help me run Write of Passage and all the ideas I share. Instead of seeing every day as an anxiety-fueled sprint, I’ve dialed down my intensity and asked myself what a sustainable career looks like. Instead of following the ephemeral chatter of Internet culture, I’ve developed a slower and more contemplative reading practice. And instead of trying to be as prolific as possible, I’ve slowed my publishing cadence so I can spend more time with the ideas I commit to. I’ll start this Annual Review by reflecting on 2021. I’ll share highlights and reflect on the goals I set at the beginning of the year. Later, I’ll outline how I plan to improve my life and set a new vision for 2022. In the spirit of commitment, this is the same method I used in previous annual reviews from 2019 and 2020. Highlights of 2021 New long-form essays: 7 Newsletters sent: 114 Website visitors: 1,368,435 Twitter growth: 142,235 – 269,118 followers YouTube growth: 5,312 – 17,186 subscribers Email growth: 45,542 – 63,421 subscribers Favorite essay: Why You’re Christian Most popular essay: Against 3x Speed Reflecting on 2021 Goals 80,000 Email Subscribers: Email subscriber growth is the most important metric in my professional life. It’s the ultimate leading indicator for business growth, and I fell short of my own expectations this year. In 2020, my list grew by 32,000 people. This year, growth slowed and the list grew by only 20,000. Though I have email capture forms on my website and YouTube channel, linking to my email list in my tweets is by far my most effective growth tactic. I didn’t link to my email list as much this year because I didn’t tweet as many threads. Changes to Twitter’s algorithm hurt too. In 2020, almost all my biggest email growth events came from linking to a free workshop or asking people to opt into my email list. But this year, Twitter de-promoted these link posts because they take people off the platform. (They want to keep people scrolling because it increases advertising revenue).1 The good news is that Twitter’s algorithm is increasingly promoting threads, which I plan to take advantage of in 2022. To begin the year, I’m going to put a sign over my desk that says: “Strategically use Twitter to grow the email list.” 1 In 2020, my Personal Monopoly workshop with Jack Butcher led to roughly 5,000 subscribers. In 2021, my launch workshop led to only 700, even though we promoted it the same way — by linking to the workshop on Twitter. You can see how the graph has flat-lined in the past year. 40,000 YouTube Subscribers: Once again, the growth was slower than expected. I ended the year with 17,000 subscribers. It’s hard to say why. YouTubers are subject to the whims of the algorithm more than users of any other platform, with the exception of TikTok. YouTube rewards timely click-bait, exaggerated titles, and extreme controversy — none of which I want to define my videos. Balancing the incentives of the algorithm with my innate desire to produce quality videos is one of the toughest tensions in my life. Serve the algorithm too much and you become a homogenized slave to corporate incentive structures. But if you follow the path of pure expression, you’re likely to stay stuck in obscurity. Every week, we look at two metrics to assess the health of the channel: retention rate and clickthrough rate. At times, our desire to increase the metrics hurt the quality of the videos. The videos moved so fast that people didn’t have time to reflect on what I was saying. When that happened, I told my team to ignore the numbers and trust their gut for what a well-produced video looks like. Video retention, defined as the average percentage of a YouTube video that people watch, increased from 25% to 48% during the first seven months of the year. This is not an accident. Every week, we look at the metrics to see what causes people to keep watching and what causes them to drop off. Then, we double down on what works. I’ll be honest though: Graphs like this make me scared of running into Goodhart’s Law. The quality of output has improved since then. That said, the rate of subscriber growth hasn’t accelerated. Early in the year, we had an outbreak hit with How to Take Notes Like Kendrick Lamar that we haven’t been able to replicate. Something about channel strategy is off the mark, and I’m not sure what it is. Maybe we’re not submitting enough to the whims of the algorithm. But that feels like a cop-out. To encourage myself to persist, I like to remind myself that YouTube is fickle. My friend Chris Williamson has provided worthy encouragement. In February, he had more views in one hour than he did in the first six months of the channel: 100,000 subscribers and more views than in all of the previous two years combined. In June, he hit 200,000. He’s ending 2021 with more than 250,000. The same thing will happen to our channel, which will turn it into an dependable marketing channel for Write of Passage. We improved my camera setup during the first half of the year, which required a surprising amount of effort. The before-and-after images above are the result of a new camera, an upgraded lens, better lighting, a rearranged background, and new positioning inside my studio. 700 Write of Passage Students: We fell a little bit short of this goal, likely due to the slow growth of my email list and the timing of our second cohort. Revenue numbers and student totals climbed in 2020, and the summer cohort was the biggest one we’d ever had. Without thinking twice about it, we launched our second cohort of 2021 during the summer as well. But it turns out that, during normal times, people don’t take courses during the summer. People are traveling and want to spend time outside. Online education is a seasonal business, and we learned this the hard way. For the foreseeable future, we’ll run flagship cohorts in the spring or fall, and offer events in summer and during the Holidays. Two Long-Form Essays: I devoted the first half of the year to writing Saving the Liberal Arts with Jeremy Giffon. Though I’m proud of the thesis and the arguments we made, it’s too long and all over the place. At some point, I’ll either re-write it or turn individual sections into shorter essays of their own. At least writing it solidified my relationship to the Liberal Arts. It inspired me to get a Liberal Arts education of my own by launching a lecture series around the Western intellectual tradition. Maybe I’ll even start a Liberal Arts school someday. During the second half of the year, I forewent the long-form essay route and worked on a documentary about my favorite musician, Porter Robinson, instead. Long-form essays are the most rigorous intellectual work I do. They’re short enough that I don’t feel wedded to an idea but long enough to permanently shape my worldview. From a consumer perspective, the people who enjoy my long-form essays are the most loyal. They’re the kinds of people who enroll in Write of Passage, turn into real-life friends, and respond with intelligent criticism. To prepare for the documentary, I saw Porter Robinson’s Nurture live show in New York, Austin, and Dallas. I’ll be premiering it at a movie theater in Austin sometime in the spring of 2022. Work with a Philosophy Tutor: During last year’s Annual Review, I mentioned that I wanted to work with a philosophy tutor in Austin. A reader responded to connect me with a guy who was working on his PhD at the University of Texas. I started a reading group with him, and together, we explored the blind spots of the Enlightenment mindset. To do so, we read early Enlightenment thinkers like Locke and Galileo. We were on a roll when our tutor accepted a job in Dallas halfway through the year. Since everybody in the group insisted on in-person sessions, we haven’t met since then. Next year, I intend to find another local philosophy tutor and meet in person once a week. We studied philosophy outside with a view of Austin’s Lady Bird Lake. Get Tournament Good at Tennis: This goal sounded nice, but I didn’t actually want to achieve it. Besides, I’d rather devote my outdoor time to playing golf.2 2 Someday, I’d like to get good enough at tennis to serve well and pass what I call “The Vacation Test”, where, if a friend says: “Want to play tennis?” I can confidently say “Yes,” knowing that I’ll be able to hold my own. Beyond my stated goals from the beginning of the year, here’s a collection of things I accomplished and enjoyed in 2021, some of which have inspired my 2022 goals: Refined 50 Days of Writing: In 2020, I wrote 50 articles about writing in 50 days. Though it was grueling, I’m glad I did it because the articles now form the basis for the 50-day email series I use to introduce people to Write of Passage. I feel like I hit a bullseye with them because the final email in the series has a 53% open rate, which is far beyond the industry standard. After many subscribers mocked me for not mentioning Write of Passage enough, we rewrote aspects of the series. In the upcoming cohorts, we’ll see how much these changes increase enrollment. Launched the Write of Passage Podcast: If you like audio, this is the best place to learn about my writing philosophy. I’ve long been a fan of the YNAB (You Need a Budget) marketing strategy, where they educate you about the problem they intend to solve instead of advertising the product directly. Their podcast is particularly good. Most episodes are shorter than seven minutes. That’s exactly what I’ve tried to do with the Write of Passage Podcast. Each episode offers a distilled lesson about how to write online. In 2022, I plan to better promote the podcast on Twitter threads and in my email list. Zooming out, more people should create short podcast series about the topic they know best. Since you’ve already thought about what you’re going to say, you can outline each episode in short bullet points and knock out the entire project in a single weekend.Traveled: Exploring big cities is one of my favorite activities. Never is my mind more active than when I land in a new one and have to figure out its history, culture, and geography. This year, I visited New York, Los Angeles, San Diego, Montreal, Dallas, Miami, and San Francisco. Inspired by the reflections I wrote this year about some of these cities, I now plan to write posts whenever I visit a big city. Here are my essays on Montreal and San Francisco, which I wrote after visiting these cities. Montreal is a taste of Europe in North America. I fell in love with these homes during my time there. Architecturally, it feels like a mix between Amsterdam and Brooklyn. Golfed: In what was less of a goal and more of a pleasant surprise, I returned to golf this year. Between my freshman year of high school and my freshman year of college, I spent a solid 25% of my waking hours on a golf course. I stopped taking the game seriously once I quit my university golf team and barely played when I lived in New York. This year, I fell in love with the game again. To accelerate my improvement, I started working with my childhood coach again. Terry maintains the world’s largest public collection of slow-motion golf swing videos (random, I know), and today, Golf Digest ranks him as one of the top 50 instructors in America. The most important lesson I’ve learned from Terry has little to do with golf. He was one of the first instructors to use a military-grade measurement tool called TrackMan, which golfers use to measure their swings and shots. The data it provided invalidated a lot of common knowledge about the game. I started using it in high school and the more I learned about TrackMan, the more I saw how profoundly most experts misunderstood the swing. It was my first “Emperor has no clothes” moment. Since then, I’ve maintained a skepticism of authority and a thirst for knowledge. Fitness: Without realizing it, the pandemic took away a lot of my passion for fitness. Working out at home isn’t nearly as enjoyable as working out at a gym. It was only when I started working out at a gym of hardcore bodybuilders that I fell in love with weightlifting again. The second half of 2021 was the most committed I’ve ever been to lifting weights and eating properly. Lived in Oaxaca: Austin summers are unbearably hot, which makes it a perfect time to travel. In June and July, I lived with three friends in a small town in southern Mexico called Oaxaca. It’s a hub for authentic food and culture because it’s retained so much of the indigenous spirit that has been lost in other parts of Mexico. This was the daily lunch scene inside our home. The woman on the right was our housekeeper, who prepared local Oaxacan dishes for us. As you can see, Oaxaca is known for its pottery and colorful food. In Oaxaca, I lived with an artist named Marianna Phillips who captured this photo of me drawing at night. Goals for 2022 As I reflect on 2021, I’m surprised to see how few goals I achieved. When I first completed the tally, I looked myself in the mirror and said, “You should try harder next year.” But after some reflection, I no longer think that’s the solution. Since attention is finite, adding something new means you have to stop doing things you’re already doing. Plus, it’s easy to add goals but hard to take an honest look at all the ways you can use your time better. Furthermore, when I started writing Annual Reviews, everything I achieved was the result of my own time and effort. At the time, I had no employees and very little extra cash. Without much help, trying harder was the simplest way to achieve more. Now that Write of Passage is profitable and growing, I can hire people to help me push projects forward. Achieving my goals now depends more on my ability to hire and lead a team. Before I share what I want to add to my life in 2022, here’s how I plan to free up my time: Weekly All-Hands Meeting: I can no longer depend so much on one-on-one communication. It takes too much time. Instead of communicating with everybody independently, I’ll communicate announcements a"
