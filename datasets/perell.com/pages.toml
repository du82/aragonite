title = "Friday Finds Links - David Perell"
description = "From 2019-2023 I published a weekly newsletter, Friday Finds. This page is a compilation of the best links I’ve ever shared — certified bangers I can assure you won’t find anywhere else."
full_description = "Friday Finds From 2019-2023 I published a weekly newsletter, Friday Finds. This page has the best links I’ve ever shared — certified bangers I can assure you won’t find anywhere else. If you want to follow what I’m up to now, enter your email below. Business & Tech The Bill Gurley Chronicles: Many of the most successful writers of the past 30 years won’t be remembered as writers. Bill Gurley is a prime example. He’s a General Partner at Benchmark, the venture capital firm that’s backed Uber, GrubHub, OpenTable, and Zillow. You’ll notice all those companies are marketplaces. Bill Gurley was writing about marketplace economics in the 90s. He famously wanted to invest in a company like Uber, long before Travis Kalanick founded it. You can find links and summaries to all of Gurley’s writing in this two-part series about venture capital, growth, and marketplaces (part 1 | part 2). ​Finding Talent: Talk to any CEO and they’ll say that recruiting high-quality people is one of their top priorities. This is the best book I’ve read on the subject. The two authors, Tyler Cowen and Daniel Gross are two of the best talent spotters I know. Tyler runs a grant program called Emergent Ventures (I’ve received four grants). He has a knack for finding up-and-comers from around the world and enabling them with both cash and confidence. Daniel was a partner at Y Combinator and now runs a company called Pioneer, which uses video game mechanics to find up-and-coming companies. They say you can learn a lot about somebody by how they spend their downtime. One of their favorite questions to ask is: “What are the open tabs on your browser right now?” The answer hints at the other person’s innate interests and level of ambition. For some podcasts about the book, I recommend this one with Tyler and this one with both of the authors. Steve Jobs, on Hiring: A collection of short interviews with Steve Jobs about his recruiting philosophy at Apple. Two principles stand out: (1) The greatest people are self-managed, but need a common vision, which comes from leadership, and (2) Apple wouldn’t hire somebody unless they absolutely lit up when they saw the Macintosh computer. Apple also hired a number of professional managers who didn’t pan out. From this mistake, he learned the best managers are stellar individual contributors who don’t want to be managers, but take the role on to maintain their quality standards. The Bull Case for Apple (2012): An early Michael Saylor prediction about why Apple was destined to hit $2,000 per share. He believed that Apple’s stock would soar because they’d sell 1 billion devices per year and become a luxury company, which would prevent downward price pressure (which is what happened to the PC industry). Apple isn’t a utility. It’s like jewelry, a piece of clothing, or a handbag — a fashion statement and an extension of your personality. This line stands out: “If you’re going to know a subject, know the subject. Because knowing only part of the subject is just enough to hurt yourself.” The video is only 2 minutes. The Economics of Airplane Leases: Many of the airplanes you board aren’t owned by the airlines you’re flying on. Instead, they’re owned by leasing companies who rent the planes out to airlines. New aircraft are typically rented for 10-12 years. The leasing model was pioneered by Tony Ryan, who went on to start Ryanair. He saw how historically, high capital expenditures and oscillating demand crushed airline profitability. As Byrne Hobart observed, leasing companies benefit from an Iron Condor. Individual airlines have high variance. They’re constantly growing and shrinking. Meanwhile, the industry as a whole is much more stable. Leasing companies absorb some of the risks that individual airlines would face if they owned their aircraft, and in turn, generate a profit. Here’s a good introduction to the aircraft leasing model. ​Steve Jobs Speaks at MIT: In the spring of 1992, Steve Jobs spoke to the MIT School of Management. At the time, he was the CEO of NeXT. If you only watch one section, I recommend this one about consulting. From the level of the individual, he says that working as a consultant slows down learning because you only get a two-dimensional picture of what’s happening inside the company. The more you’re forced to take ownership over your decisions, the faster you’ll learn, and the more three-dimensional your understanding will be. ​How Nike Lost Steph Curry: The greatest basketball shooter of all time was under-estimated for years. I know because I under-estimated Steph too. I was a Golden State Warriors season ticket holder when he joined the NBA and I wasn’t very excited about Steph. He was constantly injured back then too. Turns out, I wasn’t the only one who took him for granted. Nike sponsored Steph Curry early in his career but lost the deal when they disrespected him in a contract renegotiation. They mispronounced his name, sent a mid-level marketing person to the meeting, and had another player’s name on the pitch slide. Oops! Since then, Steph’s been the NBA’s most valuable player two times and has appeared in the NBA finals six times. Explicitly, this is a story about Nike and Under Armour. Implicitly, it’s a story about sales, recruiting, and talent evaluation. This Twitter thread offers a good summary. You can read the full piece here. ​How Narratives Drive Prices: The public markets increasingly resemble private ones in the way that revenue multiples continue to spread. Founders who can articulate their company’s vision and persuade the public markets that they have a bright future have cheap access to capital. Elon Musk and Tesla is the perfect example. The author writes: “Thus Tesla’s PE ratio is in many ways self-fulfilling. If Tesla could get people to extend the access to capital it needs for long enough, it will be successful. If it could not, then it would have collapsed. Ironically, this means that far from Elon’s antics being distracting, his ability to maintain these high PE ratios might be the most important driver of the company’s ability to succeed.” The better a company can tell its narrative, the cheaper it can access capital and the higher its price-to-earnings ratio can become. ​Buffett’s Reading Obsession: Many people look at the way Warren Buffett reads 500 pages a day and try to do the same. The problem is that the things that made him successful on the way up aren’t the things that keep him successful now that he’s made it. This article goes into the things that made Buffett successful on the way up. He obsessed over the biographies of people he admired, interrogated executives to understand the mechanics of business, and hosted friends for a bi-annual conference in what eventually became known as “The Buffett Group.” Why Jeff Bezos Dropped Physics: No matter how talented you are, your lack of genius in a particular area is often obvious. Jeff Bezos wanted to be a theoretical physicist. But one night, while studying quantum mechanics, he realized his brain wasn’t wired to process highly abstract concepts. Upon learning that he wasn’t smart enough to be a physicist, he switched to computer science. He tells the story in this short and hilarious YouTube video. ​Own the Demand: This piece has been tattooed in my brain ever since I discovered it. With the rise of the Internet, power in the economy shifted from people who controlled supply to people who owned demand. That’s why Bill Gurley, perhaps the most successful marketplace investor of all-time, once wrote: “A lesson I have learned many times in my 20 years as a marketplace investor is that aggregating demand is the one & only key.” The lesson is simple: Have a direct relationship with your customers. If somebody gets between you and your customer, your margins will fall as customer acquisition costs rise. One statistic stands out: Google pays ~$9 billion per year to Apple to be iOS’ default search engine. Dan Wang’s Annual Letters: If you want to learn about China, this is your guy. Every year, Dan writes an Annual Letter where he reflects on his on-the-ground observations from China. He’s unique because he’s lived in each of China’s main mega-regions. Most of his observations center around the intersection of culture and technology, but they stretch from classical music to industrial policy to how political decisions shape public opinion. Here are his letters from 2021, 2020, and 2019. ​Sumner Redstone: Wealth and success are cool, but not if you turn out like this. Redstone built a chain of successful movie theaters early in his career. At 56, he was almost burned alive in a fire. Out of his miraculous survival, he ramped up his ambitions and, after a hostile takeover, became the Chairman of Viacom. But his relentless lust for power fractured his family relationships. He’s gone to court against his brother, son, nephew, wife, and granddaughter. ​CIA Field Sabotage Manual: In 1944, the CIA released a guide on how to sabotage an organization, and I can’t shake the feeling that we’re voluntarily implementing these tactics today. They sound exactly like what happens in a corporate meeting: (1) insist on doing everything through channels, (2) haggle over people’s wordings, and (3) advocate “caution.” ​The Idea Maze: This article from Balaji Srinivasan is a roadmap for entrepreneurs who want to turn an idea into a profitable business. It orbits around a concept called “The Idea Maze.” Great entrepreneurs don’t just have an idea. They have a bird’s eye view of the landscape. They’ve thought through various paths they can take their company and have an answer not just for why they’re choosing a specific path but also why they’ve rejected the alternatives. If you want to build a company, this article is for you. ​How Instant Messenger Shapes Thinking: The most meta interview you’ll ever read because it’s an interview about instant messenger which takes place on instant messenger. The best part of the interview centered around writing as a technology for thinking, as opposed to speech. When we’re talking, we hop from thought to thought. But writing asks us to freeze our thoughts, which is why it’s such an effective way to improve your thinking. The lesson is simple: Writing is useful precisely because it’s difficult. ​Trader Joe’s: A primer on my favorite supermarket, which sells more food per square foot than any other grocery store. They don’t just have customers. They have fans. Visiting the store is a little bit like thrift shopping because you always find something unexpected. It seems like every other week somebody swells with pride as they recommend some new Trader Joe’s product to me. It’s far more curated than other grocery stores too. Where typical grocery stores carry ~35,000 SKUs (stock-keeping units), Trader Joe’s only has ~3,000. Roughly 80% of those products have the Trader Joe’s name on the label too. Unlike other grocery stores, there are employees everywhere, no social media, no self-checkout lines, no customer loyalty programs, and no online ordering. ​Vibe Capitalism: The original vision of Silicon Valley tech was that we could be so efficient that we could level up and nurture our humanity. But in truth, since efficiency has no end, we knocked the soul out of the Internet. As investor Geoff Lewis explains in this 20-minute talk: “Somewhere along the way to global domination, many of us in tech traded in the goal of the good life for an efficient life without even realizing it.” Urbit: What if we could rebuild our computing infrastructure from scratch? What if a platform could guarantee privacy, allow people to customize their computing stack, and incentivize a computing environment where our emotions aren’t so manipulated? Though the vision is grand, the project is still in its early stages. And though it’s little more than a chat forum right now, this project has incredible energy around it — like Bitcoin in 2011. I recommend two introductions: this formal one and this informal one.To learn about the project’s philosophical underpinnings, I recommend this essay about digital communities and this one about Christopher Alexander’s influence. The Theory of Constraints: When I started working with Tiago Forte, I learned how the Theory of Constraints shows up all over the place. For instance, my first introduction came through this excellent multi-part series about bottlenecks and supply chains. It’s essentially a summary of The Goal by Eliyahu Goldratt (I recommend the audiobook). The theory provides an entry point to productivity, from personal tasks to global supply chains. To see how The Theory of Constraints is practically relevant, I recommend this Twitter thread about the Long Beach port and all the container ships camping out nearby. The idea that “you should always choose the most capital intensive part of the line to be your bottleneck” demands a deep think. Eugene Wei: To the extent that my work consists of betting on smart people, I’m happy to have been the first person to host a podcast interview with Eugene. He was one of the first people on Amazon’s finance team and led product at Hulu and video for Oculus at Facebook. He’s far more right-brained than the kinds of people I usually meet in Silicon Valley. For a short introduction to his thinking, I recommend this interview, which builds upon his film background and love for movies. For something more in depth, I recommend Selfies as a Second Language or his three-part essay series about TikTok’s success. ​Remystifying Supply Chains: Everybody’s life is shaped by supply chains, but few people understand them. Supply chains aren’t some distant phenomenon either. We live inside of them. They shape every aspect of our lives, from the computer you’re reading this on to the clothes you’re wearing. Here, Venkatesh Rao shows us how we should upgrade the analogies we use to think about supply chains. For a more practical look at supply chains, I also recommend a book summary called The Epic Story of Container Shipping. ​An Introduction to Thomas Sowell: An excellent introduction of Sowell’s work by Coleman Hughes. If you don’t know Sowell, he’s a Senior Fellow at Stanford University’s Hoover Institution. This essay tells the story of his life from growing up without electricity or hot water in North Carolina, to moving to Harlem in 1939, to receiving his Ph.D. in economics at the University of Chicago. ​Supporting Ambition: Receiving an Emergent Ventures grant was one of the most important moments of my career. Though it wasn’t a huge sum of cash, it was a giant stamp of approval that injected me with confidence. Tyler Cowen, an economist at George Mason who runs the program, effectively said: “I love what you’re doing and I believe in you so much that I’m going to give you a stamp of approval.” Trivial as it may seem, it was game-changing for me. It made me believe in myself, and I used that grant money to fund the first Write of Passage coho"
