["https://perell.com/essay/annual-review-2020"]
title = "Annual Review 2020 - David Perell"
description = "David's 2020 year-end review of his business. Read here."
full_description = "Short Form Annual Review 2020 Writing this Annual Review, I realize that I’m incredibly fortunate. While some people spent the quarantine alone, I moved into my childhood home and spent five months with family. While America saw the worst unemployment spike in recent history, my business grew because the pandemic normalized online learning. And while others watched their loved ones suffer from the Coronavirus, I don’t know anybody who had a bad case of it. My fortune was mostly a matter of circumstance and for that, I am blessed. This Annual Review has five parts. I’ll start with the highlights, reflect on the goals I set in last year’s Annual Review, set goals for 2021, celebrate milestones, outline what I’d like to improve, and end with a list of open questions. Highlights of the Year New Articles Published: 73 Email Newsletters Sent: 114 Website Visitors: 1,379,435 Email List Growth: 13,087 – 45,542 (348% growth) Twitter Follower Growth: 29,162 – 142,235 (487% growth) Favorite Book: Leisure: The Basis of Culture Most Popular Podcast: Balaji Srinivasan Most Popular Article: 50 Ideas That Changed My Life Reflecting on 2020 Goals 800 Write of Passage Students: We didn’t meet this goal because we originally planned to run three cohorts in 2020, but only ended up running two because everybody was so burnt out. Personally, running the July cohort was one of the most challenging months of my life, mostly because I re-designed the entire Write of Passage curriculum from scratch. Doing so required 20-30 hours of focused work per week, in addition to the demands of my usual publishing cadence and leading 300 students. But because we exceeded our financial goals for the first two cohorts, we were able to postpone the final cohort of the year and effectively pause business activities between October and December. Despite the challenges of running the course, I’m thrilled with the product we’ve built. In terms of revenue and quality, we’ve reached my five-year goals for Write of Passage in less than two years. The student experience improvements can all be traced back to the work of Will Mannon, our Director of Student Experience. Of everything he’s launched, I’m happiest about our Alumni Mentor program. In addition to three-weekday sessions and our “CrossFit for Writing” sessions on Saturdays, students opt into intimate discussion groups, hosted by one of eight alumni mentors. They’re like clubs in colleges, which offer a level of friendship beyond the standard student experience. Because of initiatives like the Alumni Mentor Program, we achieved our goal of having a 60% student completion rate.1 In addition to the Alumni Mentor Program, we launched a mechanics of writing curriculum, segmented video recordings, formalized our Saturday live writing workshops, added an Initiation Week, a student directory, a Write of Passage knowledge base, a media library, a new course forum on Circle, student-led interest groups, and invented the course roadmap diagnostic assessment that’s become standard among Cohort-Based Courses. Grade: B 120,000 Words on My Website: This year, I realized that word count is a terrible metric for my writing because it creates the wrong incentives. We know this from school, where assignment word counts degrade the quality of your writing. Good writing isn’t necessarily short, but it’s always well-compressed. Superfluous elements are removed so the essential can shine. Knowing that, I abandoned this goal towards the end of the year. The catalyst was an essay called The Tyranny of Numbers, which argues that the over-dependence on numbers is the root cause of many societal problems. Striving for 120,000 words put me at risk of Goodhart’s Law, which states that “when a measure becomes a target, it ceases to be a good measure.” Even though my word count has been correlated with my writing progress in the past, knowing about the metric encourages me to game it. Setting an explicit goal breaks the historical relationship between word count and productivity. To date, the best solution I’ve found for improving the quality and quantity of my writing is time — or the number of days I complete a 90-minute writing session. Grade: N/A Secret Biographical Essay: I planned to team up with the founder of a multi-billion dollar company to distill his worldview into a long-form essay, similar to what I did with Peter Thiel’s Religion. But it fell through at the beginning of the pandemic because the company had to shift their attention. I’m already in contact with his team to see when I can resume the project. Grade: N/A Visit Three New States and Three New Countries: The Coronavirus looked at this goal, laughed, and said: “Nope!” Grade: N/A 50 Days of 1-on-1 Time with Friends: The Coronavirus made it hard to see friends for most of the year. My highest concentration of friends is in New York City, but I only lived there for two months this year: January and February. From April to September, I lived with my sister at my childhood home in San Francisco (my parents were absent for the first few months because they were taking care of my grandmother at a retirement home in Florida, but they joined us in June). Though the pandemic made socializing difficult, I spent three months with five friends in particular. Beginning in September, we rented an Airbnb together in Austin, Texas. Together, we enjoyed all kinds of activities: tennis lessons, group dinners, tubing on Lake Travis, and lectures on topics like polling data and quantum electrodynamics. Grade: A- Goals for 2021 80,000 email subscribers: Email lists are the blocking and tackling of online business. They’re not sexy, but they’re effective. Growing mine is the most important project in my professional life. Assuming that the quality of my work continues to improve, nothing else correlates as strongly with Internet serendipity and the success of Write of Passage. The good news is that because my list grew by 348% this year, I’ll end 2020 with 45,542 subscribers. I hope to increase the absolute number of new subscribers in future years, but I don’t think I’ll ever have that kind of percentage growth again. That said, I’m disappointed by the way my growth rate slowed towards the end of the year. When it comes to growing my list, I have three core challenges: (1) I don’t enjoy the work of improving email funnels, (2) I hesitate to implement suggestions because I don’t want to degrade the reader experience on my website with pop-ups and calls-to-action, (3) I haven’t been able to customize my website because I’ve been using Squarespace until recently. In 2021, I’m going to solve all these problems. (1) I’ll hire an email growth consultant who has built six-figure email lists, (2) I’ll make sure they balance the taste of a brand marketer with the conversion mentality of a performance one, and (3) I’ll work with my website design team to reduce friction in my conversion funnel. As I do, I’ll double down on the growth tactics that already work well for me, such as sharing my free writing courses: a 5-day Twitter course, a 7-day writing one, and a 50-day writing one — all of which I deliver by email. I’ll also keep sharing my Friday Finds links page. People rave about it, and 5.86% of the people who visit become email subscribers before they leave.2 Email subscriber growth in 2020 40,000 YouTube Subscribers: I spent the second half of 2020 experimenting on YouTube. Doing so felt like a return to my past. YouTube — not writing — inspired me to start sharing ideas online. I originally wanted to be a YouTuber, but I stopped making videos when I realized that writing could help me learn faster. I’m returning to YouTube because it’s becoming such a force in my intellectual intersection of learning, knowledge work, and building online businesses. As my business partner Tiago Forte said to me recently: “The YouTube generation is financially sustainable now.” I uploaded video clips from my podcast, mini-video documentaries, and behind-the-scenes looks into my writing process. Based on view counts and subscriber goals, I wasn’t very successful. Through it all, I remained unsure about my goals for the channel. My rational mind wanted me to double-down on my Personal Monopoly and focus on writing for the Internet, while my intuitive mind wanted to focus on whatever I’m excited about. The tug-of-war is on-going, but my intuition now has the upper hand. The conventional wisdom of building a YouTube audience is so soul-deadening that it ruins the fun of making videos. Make your videos actionable, they say. Stay in your niche. Target the masses. Speak like you’re talking to a 5th grader. And if you simply follow your curiosity and wander between ideas, you won’t build a following. Dumbing down your videos may be the optimal strategy, but I refuse to pursue it. One of the driving ideas behind my work is that smart people are under-served, and geeking out on ideas that intrinsically interest you is the best way to attract those people. Thus, compared to other creators, I don’t think too much about the total addressable market for ideas, and that philosophy is going to drive my YouTube strategy. I’ve already found a part-time production manager and a team of editors to help me. Together, we’re building a creation pipeline to produce each video. The plan is to create video essays inspired by two of my favorite channels: Wendover Productions and CCK Philosophy. I like how they have B-Roll and custom animations, which shift the viewers attention from the creator and onto the ideas they’re presenting. I assume that they take between 15-20 hours to edit, and I’ll be working with a team to make the videos crisp, entertaining, and educational. I like to start projects when they’re already 80% done, and these YouTube videos are the perfect example because each one will build upon an article I’ve already written. To begin, I’m making a three-part series inspired by my long-form essay about Peter Thiel. Now that I’ll be sharing the same ideas on multiple platforms, I can invest even more energy into learning and writing which is what I enjoy doing most. To record the videos, I’m building a home video studio with decorations, a boom microphone, high-definition camera, professional lighting, and sound-proofing foam panels that’ll make it easy to produce each video.3 700 Write of Passage Students: While the rest of the world is focusing on reducing friction in the learning experience, we want to increase it. Most courses pride themselves on ease of study. In self-paced courses for example, students can learn whatever they want, wherever they want. The idea sounds appealing, but the low completion rates for online courses suggest otherwise. Most students don’t do the work and the drop-off rates are steeper than the face of El Capitan. With Write of Passage, we do the opposite. It’s expensive, not cheap; challenging, not easy; time-limited, not forever ongoing. In this vision, I’m inspired by the Navy Seals. The rite of passage of becoming one inspires memories, life-long friendships, and levels of personal growth you won’t find in friction-free courses. To increase friction, we’ve raised the price of Write of Passage. Every time we do, the experience improves because the median student is so much more committed. Cheap courses sound great until you realize that the vast majority of students never follow-through on them because the initial investment is so small. That’s why $49 courses don’t have engaged student bodies. But students show up to Write of Passage knowing that it’s going to be one of the most intense online learning experiences they’ve ever had. While internet intellectuals are up in arms about the sunk cost fallacy, big initial commitments are the motivation people need to fight through the challenges of learning a meaningful skill. When you have a group of people doing it together, outcomes improve too. It’s like the gym. Everybody knows that you don’t get ripped by paying for a membership. You have to sweat and grind through the pain, which becomes enjoyable when you have a group of committed people to motivate you. This “Soul Cycle Effect” is why people push themselves harder in a workout class than they do on their own. Next year, we’ll double-down on the Soul Cycle Effect. To ensure a group of dedicated students, we’re limiting the number of people who can enroll in Write of Passage cohorts, and our first one of the year will be capped at 350 new students. Two Long-Form Essays: I’d like to become one of the world’s best long-form essayists. Doing so is a multi-decade project. As a reader, I like long-form essays because they’re long enough to establish an emotional connection with the author but short enough to enjoy in a single evening. As a creator, they’re long enough to become an intellectual obsession but, as opposed to books, short enough to feel like a temporary stage in your life. As one writer said to me: “Choose your book carefully because you’ll be married to the ideas for a decade.” But by demanding my best thinking, each long-form essay alters the direction of my intellectual life. What the Hell is Going On set the direction for my career, The Ultimate Guide to Writing Online laid the intellectual foundation for what I teach in Write of Passage, and Peter Thiel’s Religion sparked my exploration of Judeo-Christian teachings. They’re the truffles of my intellectual life: rare, precious, and delicious when taken care of. Because they’re so long, they attract the highest quality people into my intellectual orbit. I only published two in 2020: News in the Age of Abundance and the soon-to-go-live Saving the Liberal Arts. I ran into a creative block after publishing News in the Age of Abundance, and it took six months for me to find another long-form essay worthy topic after I published it. To prevent such extended stretches of uncertainty in the future, I plan to always have my next one in the pipeline. That way, I can let my subconscious stir on the central ideas for months before I start writing it. For my next essay after Saving the Liberal Arts, I’ll be writing about how time created a culture of anxiety. I’m generating my thesis in a Twitter thread that I’ll return to once I start writing the essay. Finish My Private Pilot’s License: Every year gifts me with at least one big surprise. On a personal level, learning to fly an airplane was the biggest one this year. I’ve been mesmerized with flight since childhood. I still remember dragging my father out of bed during middle school to watch the Airbus A380 land at the San Francisco airport for the first time. My childhood room is still covered with well-created airplane magazines (Airports of the World was my all-time favorite). Learning to fly has always been the top agenda on my bucket list, but I knew I wouldn’t be able to pursue it until I left New York City, where the closest airport suitable for recreational flying is 45-minu"
