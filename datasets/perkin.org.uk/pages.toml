title = "Installing OpenBSD with softraid"
full_description = '''Jonathan Perkin about me · rss · twitter · github Installing OpenBSD with softraid Dec 15, 2011 tags: openbsd, softraid This is more of a log for me than anything else, but perhaps someone will find this useful. OpenBSD includes a software RAID implementation which supports booting in newer snapshots, and I was itching to install the latest version and use it as my file server, which has 4 750GB disks. There is a small bit of preparation work to do prior to installing, which is the bulk of this entry, most of which is based on this undeadly.org article. Grab latest amd64 snapshot, boot it, drop into (S)hell mode and set up the disks: #!/bin/sh cd /dev sh MAKEDEV sd1 sd2 sd3 sd4 sd5 for disk in 0 1 2 3 do # Clear beginning of disks.. dd if=/dev/zero of=/dev/rsd${disk}c bs=1m count=10 # ..and initialise new partition table fdisk -iy sd${disk} # # Create BSD disklabel: # # - 128m partitions at start to hold kernels for booting # - 4g spare raid on each disk for testing # - rest raid for main OS and data # - OS and /home on first two mirrored disks # - /store on second two mirrored disks # print "a a\n\n128m\n\na d\n\n4g\nraid\na e\n\n\nraid\nw\nq\n" \ | disklabel -E sd${disk} # Clear beginning of raid partitions dd if=/dev/zero of=/dev/rsd${disk}d bs=1m count=10 dd if=/dev/zero of=/dev/rsd${disk}e bs=1m count=10 done # Create RAID1 mirrors bioctl -c 1 -l sd0e,sd1e softraid0 bioctl -c 1 -l sd2e,sd3e softraid0 # Exit shell and start the (I)nstall exit As for the install, go with the sensible defaults, other than: change keyboard layout to “uk” manually configure network, enable rtsol start ntpd do not expect to run X When it comes to disk selection, choose sd4 as the root disk, and use the following layout: # partition size mount sd4a 1G / sd4b 8G swap sd4d 1G /tmp sd4e 8G /var sd4f 16G /usr sd4h rest /home then initialise sd5 with: # partition size mount sd5a 2G /altroot sd5d 8G /scratch sd5e rest /store Install the full OS, set the correct timezone, then before rebooting initialize the boot partitions and copy the kernels to them. Doing this on all of them means we can boot from any disk. #!/bin/sh for disk in 0 1 2 3 do newfs sd${disk}a mount /dev/sd${disk}a /mnt2 cp /mnt/bsd* /mnt2 umount /mnt2 done eject cd0a reboot Job done. Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dataset 17 Jan 2013 » pkgsrc on SmartOS - fixing broken builds 15 Jan 2013 » pkgsrc on SmartOS - zone creation and basic builds 10 Jan 2013 » Multi-architecture package support in SmartOS 09 Jan 2013 » Solaris portability - cfmakeraw() 08 Jan 2013 » Solaris portability - flock() 06 Jan 2013 » pkgsrc-2012Q4 illumos packages now available 23 Nov 2012 » SmartOS and the global zone 24 Oct 2012 » Setting up Samba on SmartOS 10 Oct 2012 » pkgsrc-2012Q3 packages for illumos 23 Aug 2012 » Creating local SmartOS packages 10 Jul 2012 » 7,000 binary packages for OSX Lion 09 Jul 2012 » 9,000 packages for SmartOS and illumos 07 May 2012 » Goodbye Oracle, Hello Joyent! 13 Apr 2012 » SmartOS global zone tweaks 12 Apr 2012 » Automated VirtualBox SmartOS installs 30 Mar 2012 » iptables script for Debian / Ubuntu 20 Feb 2012 » New site design 11 Jan 2012 » Set up anonymous FTP upload on Oracle Linux 09 Jan 2012 » Kickstart Oracle 