title = "Automated VirtualBox SmartOS installs"
full_description = '''Jonathan Perkin about me · rss · twitter · github Automated VirtualBox SmartOS installs Apr 12, 2012 tags: smartos, virtualbox This is a quick script I wrote to: Download the latest live ISO image of SmartOS Create a VirtualBox VM, or update an existing VM with the latest ISO Configure the VM with a zones disk, and boot it! For the first install you’ll need to: Configure the network (likely just “dhcp”) Add c0d0 as the zones disk Set a root password After that it will just update the live ISO and use existing settings. By default it will create a port forward so that you can ssh -p 8322 root@localhost into the VM. Here’s the script in full (or you can download it here): #!/bin/sh # # Configurables: # # - Disk size is in GB # - Memory size is in MB # - SSH port is the local forwarded port to the VM:22 # disksize="32" memsize="1024" sshport="8322" vmname="SmartOS" dlsite="https://download.joyent.com/pub/iso" vboxdir=$(VBoxManage list systemproperties \ | awk '/^Default.machine.folder/ { print $4 }') # # Find a suitable md5sum program. # if type md5 >/dev/null 2>&1; then md5sum='md5' column='NF' elif type digest >/dev/null 2>&1 && digest md5 /dev/null >/dev/null 2>&1; then md5sum='digest md5' column='NF' elif type digest >/dev/null 2>&1 && digest -a md5 /dev/null >/dev/null 2>&1; then md5sum='digest -a md5' column='1' elif type md5sum >/dev/null 2>&1; then md5sum='md5sum' column='1' elif type openssl >/dev/null 2>&1 && openssl md5 -hex /dev/null >/dev/null 2>&1; then md5sum='openssl md5 -hex' column='NF' else echo "ERROR: Sorry, could not find an md5 program" 1>&2 exit 1 fi # # Download MD5 file and parse it for the latest ISO image and checksum # curl -o smartos-sums.txt ${dlsite}/md5sums.txt 2>/dev/null latest_md5=$(awk '/latest.iso/ { print $1 }' smartos-sums.txt) smartos_version=$(sed -ne "/^${latest_md5}/s/.*-\(.*\).iso/\1/p" \ smartos-sums.txt) if [ -z "${smartos_version}" ]; then echo "ERROR: Couldn't determine latest version" exit 1 fi # # Download the latest ISO image and verify # mkdir -p "${vboxdir}/${vmname}" if [ ! -f "${vboxdir}/${vmname}/smartos-${smartos_version}.iso" ]; then echo "Downloading ${dlsite}/smartos-${smartos_version}.iso" curl -o "${vboxdir}/${vmname}/smartos-${smartos_version}.iso" \ ${dlsite}/smartos-${smartos_version}.iso dl_md5=$(${md5sum} "${vboxdir}/${vmname}/smartos-${smartos_version}.iso" \ | awk '{ print $'${column}' }') if [ -z "${dl_md5}" ]; then echo "ERROR: Couldn't fetch ISO image" exit 1 fi if [ "${latest_md5}" != "${dl_md5}" ]; then echo "ERROR: md5 checksums do not match" exit 1 fi fi # # Create VirtualBox VM # echo "Creating/Updating Virtual Machine" VBoxManage showvminfo "${vmname}" >/dev/null 2>&1 if [ $? -eq 0 ]; then # VM already exists, just update the ISO image VBoxManage storageattach "${vmname}" --storagectl "IDE Controller" \ --port 1 --device 0 --type dvddrive \ --medium "${vboxdir}/${vmname}/smartos-${smartos_version}.iso" else # Create the VM VBoxManage createvm --name "${vmname}" --ostype OpenSolaris_64 --register VBoxManage storagectl "${vmname}" --name "IDE Controller" --add ide # Attach the ISO image VBoxManage storageattach "${vmname}" --storagectl "IDE Controller" \ --port 1 --device 0 --type dvddrive \ --medium "${vboxdir}/${vmname}/smartos-${smartos_version}.iso" # Create and attach the zone disk VBoxManage createhd --filename "${vboxdir}/${vmname}/smartos-zones.vdi" \ --size $(echo "${disksize}*1024" | bc) VBoxManage storageattach "${vmname}" --storagectl "IDE Controller" \ --port 0 --device 0 --type hdd \ --medium "${vboxdir}/${vmname}/smartos-zones.vdi" # Set misc settings VBoxManage modifyvm "${vmname}" --boot1 dvd --boot2 disk --boot3 none VBoxManage modifyvm "${vmname}" --memory ${memsize} VBoxManage modifyvm "${vmname}" --natpf1 "SSH,tcp,,${sshport},,22" fi # # Start it up # echo "Starting Virtual Machine" VirtualBox --startvm "${vmname}" & Hopefully there will be a follow-up post which updates my pkgsrc on Solaris for SmartOS, including zone setup etc. Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dataset 17 Jan 2013 » pkgsrc on SmartOS - fixing broken builds 15 Jan 2013 » pkgsrc on SmartOS - zone creation and basic builds 10 Jan 2013 » Multi-architecture package support in SmartOS 09 Jan 2013 » Solaris portability - cfmakeraw() 08 Jan 2013 » Solaris portability - flock() 06 Jan 2013 » pkgsrc-2012Q4 illumos packages now available 23 Nov 2012 » SmartOS and the global zone 24 Oct 2012 » Setting up Samba on SmartOS 10 Oct 2012 » pkgsrc-2012Q3 packages for illumos 23 Aug 2012 » Creating local SmartOS packages 10 Jul 2012 » 7,000 binary packages for OSX Lion 09 Jul 2012 » 9,000 packages for SmartOS and illumos 07 May 2012 » Goodbye Oracle, Hello Joyent! 13 Apr 2012 » SmartOS global zone tweaks 12 Apr 2012 » Automated VirtualBox SmartOS installs 30 Mar 2012 » iptables script for Debian / Ubuntu 20 Feb 2012 » New site design 11 Jan 2012 » Set up anonymous FTP upload on Oracle Linux 09 Jan 2012 » Kickstart Oracle Linux in VirtualBox 09 Jan 2012 » Kickstart Oracle Linux from Ubuntu 22 Dec 2011 » Last day at MySQL 15 Dec 2011 » Installing OpenBSD with softraid 21 Sep 2011 » Create VirtualBox VM from the command line 14 Sep 2011 » Creating chroots for fun and MySQL testing 30 Jun 2011 » Graphing memory usage during an MTR run 29 Jun 2011 » Fix input box keybindings in Firefox 24 Jun 2011 » How to lose weight 23 Jun 2011 » How to fix stdio buffering 13 Jun 2011 » Serving multiple DNS search domains in IOS DHCP 13 Jun 2011 » Fix Firefox URL double click behaviour 20 Apr 2011 » SSH via HTTP proxy in OSX 09 Nov 2010 » How to build MySQL releases 29 Apr 2010 » 'apt-get' and 5,000 packages for Solaris10/x86 16 Sep 2009 » ZFS and NFS vs OSX 12 Sep 2009 » pkgsrc on Solaris 09 Dec 2008 » Jumpstart from OSX 31 Dec 2007 » Set up local caching DNS server on OSX 10.4'''
