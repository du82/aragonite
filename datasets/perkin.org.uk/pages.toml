title = "9,000 packages for SmartOS and illumos"
full_description = '''Jonathan Perkin about me · rss · twitter · github 9,000 packages for SmartOS and illumos Jul 09, 2012 tags: illumos, pkgin, pkgsrc, smartos Note This page is obsolete. Please see http://pkgsrc.joyent.com/ where you will find the latest package sets and improved instructions. Original Article At Joyent, we provide SmartOS users with a set of regularly updated binary packages which are tuned to work well on our operating system. The package manager we use, pkgsrc, does not yet come with native support for e.g. SMF, and so we provide a limited set of packages, ensuring that those we do we provide include such features. However, often users will want packages which are not yet included in our build set, and so to assist those users we have performed a full bulk build of the unmodified pkgsrc-2012Q2 release, which resulted in well over 9,000 binary packages to choose from. In addition, thanks to binary compatibility, these packages can also be used on your illumos distribution of choice (please let me know if this is not the case!) if your native package manager does not provide the software you want. Note that these packages do not come with SMF support, and may be different from our official packages in terms of build options, etc. Also, to avoid conflict with our official packages, these have been built under a different prefix: /opt/pkg # main prefix /etc/opt/pkg # configuration files /var/opt/pkg # transient files compared to our official packages: /opt/local # main prefix /opt/local/etc # configuration files /var # transient files To use them, run the following: # For SmartOS use the original build. $ curl http://pkgsrc.smartos.org/packages/SmartOS/2012Q2/bootstrap.tar.gz \ | gzip -dc | (cd /; sudo tar -xpf -) # For other illumos, use the updated build which should work, but has fewer # packages, and you will need to ignore warnings about x86_64 != i386. $ curl http://pkgsrc.smartos.org/packages/SmartOS/2012Q2j1/bootstrap.tar.gz \ | gzip -dc | (cd /; sudo tar -xpf -) $ PATH=/opt/pkg/sbin:/opt/pkg/bin:$PATH $ sudo pkgin -y update $ pkgin avail | wc -l 9401 $ pkgin search ... $ sudo pkgin -y install ... What’s included? Here are just a few highlights: Developer tools PHP: 5.4.4, 5.3.14 + ~100 modules for each Perl: 5.14.2 + 1,780 modules Python: 3.2.3, 3.1.5, 2.7.3, 2.6.8, 2.5.6 + ~260 modules for 2.x Ruby: 1.9.3p194, 1.9.2pl320, 1.8.7.358 + ~450 modules for each Editors: (vim 7.2, emacs 23.4 and 24.1, xemacs 21.4) Revision control: (git 1.7.10.5, mercurial 2.2.2, bzr 2.5, svn 1.6.17) Web stack Apache: 2.4.2, 2.2.22, 2.0.64, 1.3.42 + modules MySQL: 5.5.25, 5.1.63, 5.0.96 PostgreSQL: 9.1.3, 9.0.7, 8.3.18 Wordpress 3.4.1 Desktop GNOME 2.32.1 (not complete) KDE 4.8.4 (not complete) XFCE 4.6.1 evilwm 1.1.0 plus thousands of miscellaneous utilities. The long-term goal of course is to integrate all of our changes back into the upstream pkgsrc repository and eventually provide a single package repository, and we will continue to work on that endeavour. Enjoy! Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dataset 17 Jan 2013 » pkgsrc on SmartOS - fixing broken builds 15 Jan 2013 » pkgsrc on SmartOS - zone creation and basic builds 10 Jan 2013 » Multi-architecture package support in SmartOS 09 Jan 2013 » Solaris portability - cfmakeraw() 08 Jan 2013 » Solaris portability - flock() 06 Jan 2013 » pkgsrc-2012Q4 illumos packages now available 23 Nov 2012 » SmartOS and the global zone 24 Oct 2012 » Setting up Samba on SmartOS 10 Oct 2012 » pkgsrc-2012Q3 packages for illumos 23 Aug 2012 » Creating local SmartOS packages 10 Jul 2012 » 7,000 binary packages for OSX Lion 09 Jul 2012 » 9,000 packages for SmartOS and illumos 07 May 2012 » Goodbye Oracle, Hello Joyent! 13 Apr 2012 » SmartOS global zone tweaks 12 Apr 2012 » Automated VirtualBox SmartOS installs 30 Mar 2012 » iptables script for Debian / Ubuntu 20 Feb 2012 » New site design 11 Jan 2012 » Set up anonymous FTP upload on Oracle Linux 09 Jan 2012 » Kickstart Oracle Linux in VirtualBox 09 Jan 2012 » Kickstart Oracle Linux from Ubuntu 22 Dec 2011 » Last day at MySQL 15 Dec 2011 » Installing OpenBSD with softraid 21 Sep 2011 » Create VirtualBox VM from the command line 14 Sep 2011 » Creating chroots for fun and MySQL testing 30 Jun 2011 » Graphing memory usage during an MTR run 29 Jun 2011 » Fix input box keybindings in Firefox 24 Jun 2011 » How to lose weight 23 Jun 2011 » How to fix stdio buffering 13 Jun 2011 » Serving multiple DNS search domains in IOS DHCP 13 Jun 2011 » Fix Firefox URL double click behaviour 20 Apr 2011 » SSH via HTTP proxy in OSX 09 Nov 2010 » How to build MySQL releases 29 Apr 2010 » 'apt-get' and 5,000 packages for Solaris10/x86 16 Sep 2009 » ZFS and NFS vs OSX 12 Sep 2009 » pkgsrc on Solaris 09 Dec 2008 » Jumpstart from OSX 31 Dec 2007 » Set up local caching DNS server on OSX 10.4'''
