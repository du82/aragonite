["https://perkin.org.uk/posts/new-site-design.html"]
title = "New site design"
full_description = "Jonathan Perkin about me · rss · twitter · github New site design Feb 20, 2012 tags: site I am a minimalist at heart, and I love command line interfaces and text files. However, I’m also pragmatic, and so for a long time my blog has been powered by Wordpress, which made it relatively easy to manage content and design. I just didn’t want the hassle of maintaining something myself. Somewhere along the way recently I stumbled across Jekyll, and the idea of generating a static site from templates. I’d seen a few sites I liked the look of, and I loved the idea of simplifying my site (and editing posts in vim!), and so the end result is the site you see now. I pondered implementing something like disqus for comments, but honestly I get so few proper responses, compared to the hundreds and hundreds of spam attempts, that it’s not worth it - if you want to comment on a post, just use twitter (I’ll probably implement a little button to do that at some point). Also, I got rid of categories, simpler to just have tags. It’s likely I’ve messed up conversion of my old blog posts, as I did them all manually. If you spot anything obviously broken, please let me know. One of the great things of the Jekyll approach is that you can simply manage your site via github, and so if you prefer you can comment on breakages here! Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 