["http://www.perkin.org.uk/posts/create-virtualbox-vm-from-the-command-line.html"]
title = "Create VirtualBox VM from the command line"
full_description = '''Jonathan Perkin about me · rss · twitter · github Create VirtualBox VM from the command line Sep 21, 2011 tags: virtualbox As something of a follow-up post to the previous entry, here’s a quick recipe for creating a Virtual Machine using the VirtualBox command line tools: We’re using Windows Server 2008 64bit as an example, modify to taste. $ VM='Windows-2008-64bit' Create a 32GB “dynamic” disk. $ VBoxManage createhd --filename $VM.vdi --size 32768 You can get a list of the OS types VirtualBox recognises using: $ VBoxManage list ostypes Then copy the most appropriate one into here. $ VBoxManage createvm --name $VM --ostype "Windows2008_64" --register Add a SATA controller with the dynamic disk attached. $ VBoxManage storagectl $VM --name "SATA Controller" --add sata \ > --controller IntelAHCI $ VBoxManage storageattach $VM --storagectl "SATA Controller" --port 0 \ > --device 0 --type hdd --medium $VM.vdi Add an IDE controller with a DVD drive attached, and the install ISO inserted into the drive: $ VBoxManage storagectl $VM --name "IDE Controller" --add ide $ VBoxManage storageattach $VM --storagectl "IDE Controller" --port 0 \ > --device 0 --type dvddrive --medium /path/to/windows_server_2008.iso Misc system settings. $ VBoxManage modifyvm $VM --ioapic on $ VBoxManage modifyvm $VM --boot1 dvd --boot2 disk --boot3 none --boot4 none $ VBoxManage modifyvm $VM --memory 1024 --vram 128 $ VBoxManage modifyvm $VM --nic1 bridged --bridgeadapter1 e1000g0 Configuration is all done, boot it up! If you’ve done this one a remote machine, you can RDP to the console via vboxhost:3389. $ VBoxHeadless -s $VM Once you have configured the operating system, you can shutdown and eject the DVD. $ VBoxManage storageattach $VM --storagectl "IDE Controller" --port 0 \ > --device 0 --type dvddrive --medium none Finally, it’s a good idea to take regular snapshots so that you can always revert back to a known-good state rather than having to completely re-install. $ VBoxManage snapshot $VM take <name of snapshot> And, if you need to revert back to a particular snapshot: $ VBoxManage snapshot $VM restore <name of snapshot> Enjoy! Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dataset 17 Jan 2013 » pkgsrc on SmartOS - fixing broken builds 15 Jan 2013 » pkgsrc on SmartOS - zone creation and basic builds 10 Jan 2013 » Multi-architecture package support in SmartOS 09 Jan 2013 » Solaris portability - cfmakeraw() 08 Jan 2013 » Solaris portability - flock() 06 Jan 2013 » pkgsrc-2012Q4 illumos packages now available 23 Nov 2012 » SmartOS and the global zone 24 Oct 2012 » Setting up Samba on SmartOS 10 Oct 2012 » pkgsrc-2012Q3 packages for illumos 23 Aug 2012 » Creating local SmartOS packages 10 Jul 2012 » 7,000 binary packages for OSX Lion 09 Jul 2012 » 9,000 packages for SmartOS and illumos 07 May 2012 » Goodbye Oracle, Hello Joyent! 13 Apr 2012 » SmartOS global zone tweaks 12 Apr 2012 » Automated VirtualBox SmartOS installs 30 Mar 2012 » iptables script for Debian / Ubuntu 20 Feb 2012 » New site design 11 Jan 2012 » Set up anonymous FTP upload on Oracle Linux 09 Jan 2012 » Kickstart Oracle Linux in VirtualBox 09 Jan 2012 » Kickstart Oracle Linux from Ubuntu 22 Dec 2011 » Last day at MySQL 15 Dec 2011 » Installing 