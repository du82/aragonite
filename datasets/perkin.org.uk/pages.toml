title = "About Me"
full_description = "Jonathan Perkin about me · rss · twitter · github About Me Thirty-something. Married. Four kids. Living just outside London in the UK. Work I’ve been interested in computers from an early age, and am very privileged to get paid to mess around on them for a living. I work for Joyent where I am involved in pkgsrc, the packaging system used for SmartOS, our advanced open-source operating system designed for multi-tenancy environments (i.e. “Cloud Computing”). Previously I have worked as a sysadmin/developer/engineer at MySQL AB/Sun Microsystems/Oracle, the BBC, and Netcraft. My professional profile is available on LinkedIn, however if you are a recruiter, I should warn you that I am almost certainly not interested ;-) Rest As an engineer I of course love to work on technical stuff outside of the dayjob too, and you can find various open source bits and pieces I have written on GitHub. You can also find me on Twitter and Facebook doing the “social media” thing. Play I enjoy playing the piano, and you can see some really bad examples of me doing so on my YouTube profile. Share this page on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dataset 17 Jan 2013 » pkgsrc on SmartOS - fixing broken builds 15 Jan 2013 » pkgsrc on SmartOS - zone creation 