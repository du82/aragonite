title = "Goodbye Oracle, Hello Joyent!"
full_description = "Jonathan Perkin about me · rss · twitter · github Goodbye Oracle, Hello Joyent! May 07, 2012 tags: joyent, oracle, pkgsrc, smartos Back in 2001 when I started working for the BBC I was given a Sun Ultra 10 workstation running Solaris 8 and CDE to do my job. As a Linux/FreeBSD user at the time, and someone accustomed to things such as a working vi implementation, recursive grep and Window Maker, this came as something of a culture shock, and it wasn’t long before I was compiling my own software in a rapid attempt to build and configure a more usable desktop environment - or at least one I was more comfortable in. Building all that software by hand quickly became tedious, and so I was delighted to find that Christos Zoulas had written a bunch of portability glue, known as Zoularis, which allowed pkgsrc (similar to the FreeBSD ports system I was used to) to be used on Solaris. It was still early days, however, and so over the next few years I and others helped to improve Solaris support in pkgsrc. By 2004 we had over 1500 packages building on Solaris 9/SPARC using the Sun Studio compiler, and in 2010 there were 5000 packages for Solaris 10/x86, along with a native SFW package including pkgin (an “apt-get” clone), making it easy to get up and running. It was always something of a disappointment to me though that pkgsrc on Solaris wasn’t more widely deployed as I felt it provided major benefits over Blastwave or IPS. So it was great to see Filip Hajný of Joyent join the pkgsrc developers in 2009 for his work on Solaris with Joyent using pkgsrc internally. Since then they have: hired a number of fantastic engineers from the ashes of Sun Microsystems, who have ported KVM to their SmartOS descendant of Solaris, making it a clear differentiator in the cloud computing arena (DTrace+ZFS+Zones+KVM is the perfect combination for multi-tenancy environments), as well as taken stewardship of node.js and again hired the most prominent engineers involved in that project and thus over that time my desire to work there has only increased. So, I am obviously delighted to say that today is my first day working for Joyent, focusing on making pkgsrc work even better on SmartOS. It isn’t just the people and the technology which attracted me, though. A recent Twitter post by ex-Sun CEO and co-founder Scott McNealy says it well: As a long time fan of Sun (I got over the initial shock of Solaris) who was fortunate enough to work there, and as someone who experienced the fantastic company culture of MySQL AB, it is this chance to again join an engineering-driven company that “kicks butt, has fun, doesn’t cheat, loves its customers, changes computing forever” which excites me the most. Let’s just hope Joyent don’t turn out exactly the same as Sun Microsystems ;) Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dataset 17 Jan 2013 » pkgsrc on SmartOS - fixing broken builds 15 Jan 2013 » pkgsrc on SmartOS - zone creation and basic builds 10 Jan 2013 » Multi-architecture package support in SmartOS 09 Jan 2013 » Solaris portability - cfmakeraw() 08 Jan 2013 » Solaris portability - flock() 06 Jan 2013 » pkgsrc-2012Q4 illumos packages now available 23 Nov 2012 » SmartOS and the global zone 24 Oct 2012 » Setting up Samba