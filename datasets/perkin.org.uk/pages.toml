title = "7,000 binary packages for OSX Lion"
full_description = '''Jonathan Perkin about me · rss · twitter · github 7,000 binary packages for OSX Lion Jul 10, 2012 tags: osx, pkgin, pkgsrc Note This page is obsolete. Please see http://pkgsrc.joyent.com/ where you will find the latest package sets and improved instructions. Original Article For my day job I build packages for our SmartOS operating system using pkgsrc. pkgsrc is a cross-platform package manager which began life as the FreeBSD ports system and was ported to NetBSD back in 1997. Since then it has been ported to many other different systems, 19 at the current count, one of which is OSX/Darwin. For the recent pkgsrc-2012Q2 release, I have performed a full bulk build on OSX Lion, and the result is 7,374 binary packages for you to use as an alternative to brew/macports/etc. To use them, run the following: $ curl http://pkgsrc.smartos.org/packages/Darwin/2012Q2/bootstrap.tar.gz \ | (cd /; sudo gnutar -zxpf -) $ PATH=/usr/pkg/sbin:/usr/pkg/bin:$PATH $ sudo pkgin -y update $ pkgin avail | wc -l 7374 $ pkgin search ... $ sudo pkgin -y install ... pkgin is a tool similar to apt-get and allows you to easily search for and install/upgrade packages. Please let me know if you find them useful, and if you have any feedback. Enjoy! Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux