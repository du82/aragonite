["https://perkin.org.uk/posts/setting-up-samba-on-smartos.html"]
title = "Setting up Samba on SmartOS"
full_description = '''Jonathan Perkin about me · rss · twitter · github Setting up Samba on SmartOS Oct 24, 2012 tags: pkgin, pkgsrc, samba, smartos A frequent question on #smartos IRC is how to set up SmartOS as a file server. Due to the architecture of SmartOS and its focus on virtualisation, this isn’t as easy as on other systems, and some parts are simply not supported at this time (e.g. NFS). This guide, therefore, is a simple way to get Samba up and running so that you can at least use a SmartOS machine as a file server, even if it’s perhaps not the protocol you would initially choose. Create new virtual machine Let’s start by creating a VM, here is what I use locally, you may want to tweak the settings for your environment. If you already have a suitable VM configured you can just skip this step. # Import the base1.8.1 image, though any base image will suffice. $ imgadm update $ imgadm import 55330ab4-066f-11e2-bd0f-434f2462fada # I store all my VM configs in this directory $ mkdir /usbkey/vmcfg # vmadm configuration for 'store' VM $ vi /usbkey/vmcfg/store.json { "brand": "joyent", "zfs_io_priority": 30, "image_uuid": "55330ab4-066f-11e2-bd0f-434f2462fada", "max_physical_memory": 256, "quota": 750, "alias": "store", "hostname": "store", "resolvers": [ "193.178.223.141", "208.72.84.24" ], "dns_domain": "adsl.perkin.org.uk", "nics": [ { "nic_tag": "admin", "ip": "192.168.1.11", "netmask": "255.255.255.0", "gateway": "192.168.1.1" } ] } # Create the VM $ vmadm create -f /usbkey/vmcfg/store.json Install Samba package Next, log in to the VM and install the required packages. These are not currently available from the default repository, so we will use the generic illumos package set: $ zlogin <uuid> # Download and unpack bootstrap kit $ curl -s http://pkgsrc.smartos.org/packages/illumos/bootstrap/bootstrap-2012Q3-illumos.tar.gz \ | gtar -zxf - -C / $ PATH=/opt/pkg/sbin:/opt/pkg/bin:$PATH # Install latest Samba package (others are available if necessary) $ pkgin -y up $ pkgin -y install samba-3.6 Configure Samba This part will differ based on your requirements, here are a couple of simple examples. Shared guest mount with full read/write access For if you just want somewhere to share stuff on a local network with no security. # Create shared mount user and mountpoint. $ groupadd -g 500 store $ useradd -u 500 -g 500 -c "Store user" -s /usr/bin/false -d /store store $ mkdir /store $ chown store:store /store # Configure Samba $ vi /etc/opt/pkg/samba/smb.conf [global] security = share load printers = no guest account = store ; Comment out [homes] section [store] path = /store public = yes only guest = yes writable = yes printable = no Shared mount with per-user access For a bit more fine-grained control. # Create per-user accounts and mountpoint. $ groupadd -g 1000 alice $ useradd -u 1000 -g 1000 -c "Alice" -s /usr/bin/false -d /store alice $ groupadd -g 1001 bob $ useradd -u 1001 -g 1001 -c "Bob" -s /usr/bin/false -d /store bob $ mkdir /store $ chmod 1777 /store $ /opt/pkg/bin/smbpasswd -a alice $ /opt/pkg/bin/smbpasswd -a bob # Configure Samba $ vi /etc/opt/pkg/samba/smb.conf [global] security = user load printers = no ; Comment out [homes] section [store] path = /store valid users = alice bob public = no writable = yes printable = no Access will be via username and the password set with smbpasswd. Users will be able to create files and read other user files, but will only be able to modify files they created. Startup scripts Okay, so I’m lazy and whilst I should provide some SMF scripts and manifests for this, it’s simpler to just write an rc.d script! :-) $ vi /etc/rc2.d/S99samba #!/bin/sh case "$1" in start) # Start up Samba daemons /opt/pkg/sbin/nmbd -D /opt/pkg/sbin/smbd -D ;; stop) pkill -9 nmbd pkill -9 smbd ;; reload) pkill -HUP nmbd pkill -HUP smbd ;; esac Finally, start it up! $ chmod +x /etc/rc2.d/S99samba $ /etc/rc2.d/S99samba start Multicast DNS In order for shares to automatically show up in e.g. the OSX Finder, you will need to be running some kind of mDNS service on the server. The easiest solution is to simply enable dns/multicast in the zone, i.e.: $ svcadm enable dns/multicast This will then show up based on the hostname of the server, and clicking on it should show the store mount we created. All done I hope this proves useful! Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dataset 17 Jan 2013 » pkgsrc on SmartOS - fixing broken builds 15 Jan 2013 » pkgsrc on SmartOS - zone creation and basic builds 10 Jan 2013 » Multi-architecture package support in SmartOS 09 Jan 2013 » Solaris portability - cfmakeraw() 08 Jan 2013 » Solaris portability - flock() 06 Jan 2013 » pkgsrc-2012Q4 illumos packages now available 23 Nov 2012 » SmartOS and the global zone 24 Oct 2012 » Setting up Samba on SmartOS 10 Oct 2012 » pkgsrc-2012Q3 packages for illumos 23 Aug 2012 » Creating local SmartOS packages 10 Jul 2012 » 7,000 binary packages for OSX Lion 09 Jul 2012 » 9,000 packages for SmartOS and illumos 07 May 2012 » Goodbye Oracle, Hello Joyent! 13 Apr 2012 » SmartOS global zone tweaks 12 Apr 2012 » Automated VirtualBox SmartOS installs 30 Mar 2012 » iptables script for Debian / Ubuntu 20 Feb 2012 » New site design 11 Jan 2012 » Set up anonymous FTP upload on Oracle Linux 09 Jan 2012 » Kickstart Oracle Linux in VirtualBox 09 Jan 2012 » Kickstart Oracle Linux from Ubuntu 22 Dec 2011 » Last day at MySQL 15 Dec 2011 » Installing OpenBSD with softraid 21 Sep 2011 » Create VirtualBox VM from the command line 14 Sep 2011 » Creating chroots for fun and MySQL testing 30 Jun 2011 » Graphing memory usage during an MTR run 29 Jun 2011 » Fix input box keybindings in Firefox 24 Jun 2011 » How to lose weight 23 Jun 2011 » How to fix stdio buffering 13 Jun 2011 » Serving multiple DNS search domains in IOS DHCP 13 Jun 2011 » Fix Firefox URL double click behaviour 20 Apr 2011 » SSH via HTTP proxy in OSX 09 Nov 2010 » How to build MySQL releases 29 Apr 2010 » 'apt-get' and 5,000 packages for Solaris10/x86 16 Sep 2009 » ZFS and NFS vs OSX 12 Sep 2009 » pkgsrc on Solaris 09 Dec 2008 » Jumpstart from OSX 31 Dec 2007 » Set up local caching DNS server on OSX 10.4'''
