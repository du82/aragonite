title = "Fix Firefox URL double click behaviour"
full_description = "Jonathan Perkin about me · rss · twitter · github Fix Firefox URL double click behaviour Jun 13, 2011 tags: firefox, linux, osx One of the best things I find with OS X is the consistent and sane handling of keyboard and mouse bindings. Since having to move back to Linux for work I am constantly frustrated that different applications all have their own idea of what shortcuts to use. One of the biggest annoyances was the mouse click behaviour in the browser URL bar. OS X behaviour is one click to position cursor, two clicks to select a word, three clicks to select all. I rely on this behaviour a lot as I frequently copy/paste parts of URLs. Thankfully that’s one that can be fixed easily. Simply navigate to and double click on the `browser.urlbar.doubleClickSelectsAll` key to set it to false. One annoyance down, lots more to go.. Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dataset 17 Jan 2013 » pkgsrc on SmartOS - fixing broken builds 15 Jan 2013 » pkgsrc on SmartOS - zone creation and basic builds 10 Jan 2013 » Multi-architecture package support in SmartOS 09 Jan 2013 » Solaris portability - cfmakeraw() 08 Jan 2013 » Solaris portability - flock() 06 Jan 2013 » pkgsrc-2012Q4 illumos packages now available 23 Nov 2012 » Sm