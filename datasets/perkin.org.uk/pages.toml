title = "'apt-get' and 5,000 packages for Solaris10/x86"
full_description = "Jonathan Perkin about me · rss · twitter · github 'apt-get' and 5,000 packages for Solaris10/x86 Apr 29, 2010 tags: pkgin, pkgsrc, solaris Here’s how: # Install pkg_* tools and the 'pkgin' package manager $ pkgadd -d http://www.netbsd.org/~jperkin/TNFpkgsrc-x86.pkg all # Add tools to PATH $ PATH=/opt/pkg/sbin:/opt/pkg/bin:$PATH # Update package repository (akin to 'apt-get update') $ pkgin up # Search for a particular package (you can use regexp) $ pkgin search ^ap.*python # Install it $ pkgin install ap22-py25-python # Update all packages (akin to 'apt-get dist-upgrade') $ pkgin full-upgrade # How many packages are available? $ pkgin avail | wc -l 4970 Ok, so the headline might be slightly mis-leading, this isn’t really apt-get but a tool which is very similar. This is work which builds upon my previous post using pkgsrc to build binary packages on Solaris. See http://imil.net/pkgin/ for more information on pkgin. Hopefully this will prove really useful to people still using Solaris 10 and unable to use the new pkg(5) stuff in OpenSolaris. Please try it out and provide any feedback to pkgsrc-users@netbsd.org. I’m hoping to keep the packages updated for the 2009Q3 branch. Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dat