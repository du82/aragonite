title = "pkgsrc-2012Q4 illumos packages now available"
full_description = '''Jonathan Perkin about me · rss · twitter · github pkgsrc-2012Q4 illumos packages now available Jan 06, 2013 tags: illumos, pkgin, pkgsrc, smartos Note This page is obsolete. Please see http://pkgsrc.joyent.com/ where you will find the latest package sets and improved instructions. Original Article In keeping with the regular quarterly pkgsrc releases, I’m pleased to announce that packages from the pkgsrc-2012Q4 branch are now available for general illumos platforms. As usual, the quick start instructions are: $ curl -s http://pkgsrc.smartos.org/packages/illumos/bootstrap/bootstrap-2012Q4-illumos.tar.gz \ | gtar -zxf - -C / $ PATH=/opt/pkg/sbin:/opt/pkg/bin:$PATH $ pkgin -y up $ pkgin avail | wc -l 9518 $ pkgin search <package> $ pkgin -y install <package> <package...> For those interested in helping to increase the number of packages available, the bulk build report for this set is available here. It would be great to get past the 10,000 mark! Share this post on Twitter, HackerNews, Facebook or Google+ All Posts 16 Jul 2015 » Reducing RAM usage in pkgin 03 Mar 2015 » pkgsrc-2014Q4: LTS, signed packages, and more 06 Oct 2014 » Building packages at scale 04 Dec 2013 » A node.js-powered 8-bit CPU - part four 03 Dec 2013 » A node.js-powered 8-bit CPU - part three 02 Dec 2013 » A node.js-powered 8-bit CPU - part two 01 Dec 2013 » A node.js-powered 8-bit CPU - part one 21 Nov 2013 » MDB support for Go 30 Jul 2013 » What's new in pkgsrc-2013Q2 24 Jul 2013 » Distributed chrooted pkgsrc bulk builds 07 Jun 2013 » pkgsrc on SmartOS - creating new packages 15 Apr 2013 » What's new in pkgsrc-2013Q1 19 Mar 2013 » Installing SVR4 packages on SmartOS 27 Feb 2013 » SmartOS is Not GNU/Linux 18 Feb 2013 » SmartOS development preview dataset 17 Jan 2013 » pkgsrc on SmartOS - fixing broken builds 15 Jan 2013 » pkgsrc on SmartOS - zone creation and basic builds 10 Jan 2013 » Multi-architecture package support in SmartOS 09 Jan 2013 » Solaris portability - cfmakeraw(