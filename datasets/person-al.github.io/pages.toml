title = "🗨️ A Predictable Ui Is A Good One Until Generative Ai | Let’s get Person-al"
description = "We judge an interface as “good” if the user knows what to expect, and is never faced with results or feedback that seem out of the blue or confusing to them. I still think this is true, but maybe we’ll have to rethink this as we start to use more generative and emergent systems in our work. If the system is unpredictable by nature, we’ll need new interaction patterns to accommodate that. Squish Meets Structure: Designing with Language Models"
