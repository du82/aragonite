["https://person-al.github.io/%F0%9F%8C%B0/2024/01/03/the-economy-and-the-itchy-scab.html"]
title = "🌰 the economy and the itchy scab | Let’s get Person-al"
description = "Today at the grocery store a man said1 to me: “They say the economy is getting better but everything is still so expensive! I don’t know what the White House is seeing. They must have someone else shopping for them.” “I’m helping get groceries for my dad but I don’t have the money. I should ask him to pay me back but I feel bad– he’s my dad! He’s old. I want to help him out.” The wording is not exact, but these are the exact sentiments expressed over the course of our brief milk-aisle conversation. ↩"
full_description = "Wed 03 Jan 2024 🌰 the economy and the itchy scab Today at the grocery store a man said1 to me: “They say the economy is getting better but everything is still so expensive! I don’t know what the White House is seeing. They must have someone else shopping for them.” “I’m helping get groceries for my dad but I don’t have the money. I should ask him to pay me back but I feel bad– he’s my dad! He’s old. I want to help him out.” As a wound heals, it forms a scab. An itchy, painful scab is still a problem. It may not be at risk of infection, but it’s still a wound. Maybe it hurts regularly– or even restricts your movement. When journalists say “By the numbers, the economy is doing well, but people don’t feel like it.” They need to tack on one more sentence to clarify why. To show that they understand the pain. It’s not a mystery, it’s a scab. The wording is not exact, but these are the exact sentiments expressed over the course of our brief milk-aisle conversation. ↩ Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person"
