["https://person-al.github.io/%F0%9F%8C%B1/2021/06/09/nft-best-practices-necessitate-proving-data-integrity.html"]
title = "🌱 Nft Best Practices Necessitate Proving Data Integrity | Let’s get Person-al"
description = "There is a huge hole in NFTs right now: they require too much trust. NFT best practices necessitate storing a proof on the blockchain that allows the system to validate all metadata attached to the NFT."
full_description = "Wed 09 Jun 2021 Last Tended: Tue 22 Jun 2021 🌱 Nft Best Practices Necessitate Proving Data Integrity There is a huge hole in NFTs right now: they require too much trust. NFT best practices necessitate storing a proof on the blockchain that allows the system to validate all metadata attached to the NFT. The problem? all metadata in the ETH ecosystem is stored in a json file hosted elsewhere. The Ethereum blockchain itself only stores a link to the metadata. the metadata file then hosts links to the files that are “owned” by the NFT owner. This creates a series of bad outcomes: The site hosting the metadata file shuts down, you lose access to the file and never get it back. The site hosting the metadata file shuts down, you lose access to the file. A previous owner or the creator of the NFT reaches out with a copy of the file, but you have no way to validate that it is the original file. Someone hacks the site hosting the metadata files, replacing what is at that url with something else. There’s a very simple solution to this: store a validation hash of the file on the blockchain. It won’t fully solve 1, but in the event of 2 & 3, you can at least validate that the contents of the file are identical to what the NFT creator originally intended. Related: 🌱 Smart contract design is holding NFTs back because of one flaw Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person nft"
