["https://person-al.github.io/%F0%9F%97%A8%EF%B8%8F/2022/06/28/the-limitless-destructiveness-of-this-economy-is-because-a-corporation-is-not-a-person.html"]
title = "🗨️ the limitless destructiveness of this economy is because a corporation is not a person | Let’s get Person-al"
description = "Objecting to Supreme Court rulings that treat corporations as persons, Berry argues that “the limitless destructiveness of this economy comes about precisely because a corporation is not a person.” In other words, “It can experience no personal hope or remorse, no change of heart. It cannot humble itself. It goes about its business as if it were immortal, with the single purpose of becoming a bigger pile of money.” Wendell Berry’s Advice for a Cataclysmic Age"
full_description = "Tue 28 Jun 2022 🗨️ the limitless destructiveness of this economy is because a corporation is not a person Objecting to Supreme Court rulings that treat corporations as persons, Berry argues that “the limitless destructiveness of this economy comes about precisely because a corporation is not a person.” In other words, “It can experience no personal hope or remorse, no change of heart. It cannot humble itself. It goes about its business as if it were immortal, with the single purpose of becoming a bigger pile of money.” Wendell Berry’s Advice for a Cataclysmic Age Info: Source: Wendell Berry’s Advice for a Cataclysmic Age Related to: [[❔ what does the left need to do to succeed in American politics and policy]] [[🌱 business writers do themselves and their readers a disservice by not thinking about society]] We’ve passed peak corporation already — Michael Anderson, Framework Ventures [[🗨️ China has become rich and powerful thanks to capitalism … But its population is not clamouring for democracy.]] Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person"
