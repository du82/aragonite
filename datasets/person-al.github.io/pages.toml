title = "🌰 a meeting on nft art | Let’s get Person-al"
description = "The other day, I met with Commits Vortex, a fellow frequenter of the Yak Collective. I wanted feedback on 🛠️ Pathfinder, the NFT project I’ve been tossing around in my head. Some notes on the meeting:"
full_description = "Wed 08 Jun 2022 🌰 a meeting on nft art The other day, I met with Commits Vortex, a fellow frequenter of the Yak Collective. I wanted feedback on 🛠️ Pathfinder, the NFT project I’ve been tossing around in my head. Some notes on the meeting: On where the art can go: We discussed the form of Port of Detection for quite some time. The way burning is used to challenge the way we think of blockchain ownership was definitely an interesting one, but Commits Vortex noted that there were other mechanisms of the blockchain I could pull into the work: The idea of generative art that can change over time came up multiple times, with references to DeafBeaf’s generative NFT project, the French OuLiPo movement, and Manferd Werder’s Stück. Questions like: what if the vowels in the story rotated with each transaction? Decay came up a few times as well, one idea that stuck with me was opacity: the idea of an artwork growing more visible or less visible with time. While in my initial ideation I had broken the story down into chapters, Commits Vortex reminded me that I could go even further. I had briefly toyed with a Mad-Libs like idea: one NFT controlling all the character names, one all the places, etc. But we discussed going even further: NFTs controlling the level of sentences, words, or even individual letters. They also noted that I could merge the content of the textual work with the mechanics of the NFT work. If my story has specific themes, can I bring those themes into the interaction model of the NFT? On where I can go: My weakest skill, in my own estimation, is in the marketing of the art. How do I explain the concept in a way that excites people? How do I find people who are as excited by this weirdness as I am and will want to play around with whatever I build? Commits Vortex noticed that the main 🛠️ Pathfinder page reads like a technical summary, less so an artistic one. Finding the balance between the two is something I’ll have to work on. On a shifted direction: At first, the idea of adding generation into the system played fully at odds with the story I had planned for this piece. And it was hard to see how things like rotating vowels or changing opacity would play nicely with an encrypted block of text. Instead of a planned story, I needed a generated artwork. A generated poem, perhaps? When you burn the token, a line is added to the poem, the words for which are chosen based on how long the token was held, how many times it was transferred between parties, etc. This direction has a few benefits, the primary of which being that this system could exist entirely on-chain. Much like the Loot contract, I could put the entire dictionary for the poem on chain, along with the exact algorithm by which the line for the poem is constructed. Opacity could also play a factor this way. Depending on the “opacity” of the line, the algorithm may skip words or return an empty line. So that’s what I’ll be exploring next: poetry generation. We’ll see how it goes. additional resources DeafBeaf’s generative NFT project OuLiPo movement Corruption(*s) (etherscan) Loot contract midwit I could use this to generate the minting UI, as basic a UI as that would be. It would decrease the need for me to host a separate javascript situation myself. Manferd Werder’s Stück - a generative music piece from 1997 Info: Related to: 🌰 on poetry generation 🛠️ Pathfinder 🌳 NFTs change how we create [[🌰 on creating NFT art]] Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person PortOfDetection"
