title = "🌰 Servers As A Service | Let’s get Person-al"
description = "Blockchain, staking, and PoW enable a powerful new option for data centers and server farms: ghost servers. Just like a ghost kitchen producers food for someone else’s label, with blockchain you can hire a motley crew of computers from anywhere to run your code. It’s AWS meets ghost kitchen."
full_description = "Tue 22 Jun 2021 Last Tended: Wed 07 Jul 2021 🌰 Servers As A Service Blockchain, staking, and PoW enable a powerful new option for data centers and server farms: ghost servers. Just like a ghost kitchen producers food for someone else’s label, with blockchain you can hire a motley crew of computers from anywhere to run your code. It’s AWS meets ghost kitchen. The competition is steep, though. AWS is heavily subsidized at the moment: plus centralization is cheaper than decentralization. AWS wins the “ghost server” competition for now. But. Some services can eventually be cheaper on blockchain than on a centralized service. After all, 🌰 big businesses need to compete to survive, small companies hit profitability sooner and easier. Sia just needs to be profitable enough for each individual storage provider. Dropbox needs to be profitable enough for the public market. Related to: [[🗒️ Crypto]] [[blockchain]] Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person"
