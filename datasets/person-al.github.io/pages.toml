description = "As mentioned in 🛠️ poetry generator, I’ve been exploring different ways of generating text. The following interactive art piece allows you to select your own rules for how poetry should be structured, and then generate a poem of your own! Give it a try and let me know how it goes. How it works Currently the system is as follows: I have a list of words categorized by part of speech I have a mapping of parts of speech to other parts of speech (e.g. “a noun can be followed by an adverb or a verb”) For each line of poetry, the system1: picks a random starting word based on the part of speech of that word, it picks a random follow-up part of speech (e.g. “the first word was a noun, let’s find an adverb next”) based on the selected part of speech, pick a random next word go back to step 2 until the line is over You can see the javascript code itself here ↩"
full_description = "Wed 15 Jun 2022 Last Tended: Thu 30 Jun 2022 🌰 random poetry generator As mentioned in 🛠️ poetry generator, I’ve been exploring different ways of generating text. The following interactive art piece allows you to select your own rules for how poetry should be structured, and then generate a poem of your own! Give it a try and let me know how it goes. How it works Currently the system is as follows: I have a list of words categorized by part of speech I have a mapping of parts of speech to other parts of speech (e.g. “a noun can be followed by an adverb or a verb”) For each line of poetry, the system1: picks a random starting word based on the part of speech of that word, it picks a random follow-up part of speech (e.g. “the first word was a noun, let’s find an adverb next”) based on the selected part of speech, pick a random next word go back to step 2 until the line is over Soon, I’d like to surface different controls on this page to allow you to surface better algorithms than the one above. But for now, I wanted to put this up and get feedback. Let me know what you think! Change the settings below and generate some poetry! Number of lines in poem: Maximum number of words in a line: Advanced Settings: (Show/Hide) Modify the word bank I've created a list of potential words myself, but here you can change the words entirely as desired Show/Hide Table Part of speech relationships The algorithm picks words based on parts of speech as shown by the table below. (e.g. an adverb can be followed by another adverb or a verb, etc). You can add and remove parts of speech from the table below and then hit generate to change how the algorithm picks words. For examples for the parts of speech, see here Show/Hide Table Poetry: Fill out the form above to see your poem Like what you made? Send Me Your Poem or tweet at me < back to advanced settings Updates 1 July 2022: New settings! You can now create your own word dictionary 30 Jun 2022: Moved this from the main