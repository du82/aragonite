title = "🗨️ it’s not about sitting next to white people – it’s about sitting where you please | Let’s get Person-al"
description = "“I was never for integration for the sake of integration. … I didn’t define myself in juxtaposition to white people. And that was reinforced with my grandmother, which goes all the way back to ‘56 on the bus after the boycott. And she always sat in the back! I said we walked all these days … and you still sit in the back? … Maybe you are afraid of white folk! And she said ‘Gwendolyn. The bus boycott was not about sitting next to white people. It was about sitting anywhere you please.’ Gwendolyn Patton ~minute 35"
full_description = "Mon 29 Jan 2024 🗨️ it's not about sitting next to white people -- it's about sitting where you please “I was never for integration for the sake of integration. … I didn’t define myself in juxtaposition to white people. And that was reinforced with my grandmother, which goes all the way back to ‘56 on the bus after the boycott. And she always sat in the back! I said we walked all these days … and you still sit in the back? … Maybe you are afraid of white folk! And she said ‘Gwendolyn. The bus boycott was not about sitting next to white people. It was about sitting anywhere you please.’ Gwendolyn Patton ~minute 35 Info: Source: The Women Who Masterminded The Montgomery Bus Boycott Related to: 🌰 protests strengthen democracy 🌰 democracy requires active maintenance ❔ will remote work increase racism 🗨️ Black people are incorrectly assumed ‘poor’ until proven otherwise 🌳 Calculating the Wealth Distribution of Bitcoin Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person"
