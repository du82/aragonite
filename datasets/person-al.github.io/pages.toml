["https://person-al.github.io/%F0%9F%8C%B0/2021/08/10/old-rules-will-always-bend-new-technology.html"]
title = "🌰 Old rules will always bend new technology | Let’s get Person-al"
description = "Existing regulation will always bend new technology to its image a little bit. The Howie test already impacts what kinds of tokens are being launched. Sometimes I think the Howie test and fear of the SEC is part of what caused the ICO bust. ICO teams couldn’t make a strong case that their token was an investment vehicle, otherwise they had created a security. So they had to make hand-wavy claims that something something networks effects something something money. Claims that of course often didn’t stand to scrutiny. DeFi, by comparison, doesn’t have to pretend it’s not paying you."
full_description = "Tue 10 Aug 2021 🌰 Old rules will always bend new technology Existing regulation will always bend new technology to its image a little bit. The Howie test already impacts what kinds of tokens are being launched. Sometimes I think the Howie test and fear of the SEC is part of what caused the ICO bust. ICO teams couldn’t make a strong case that their token was an investment vehicle, otherwise they had created a security. So they had to make hand-wavy claims that something something networks effects something something money. Claims that of course often didn’t stand to scrutiny. DeFi, by comparison, doesn’t have to pretend it’s not paying you. It’s not a bad thing that old regulations shape new technologies. There were ICO scams and there likely would have been more if it weren’t for the SEC. Nothing is built in a vacuum, everything we do is a reaction to something that has already been done. Source: Inspired by: 🗨️ the revolution will be capitalized Related to: [[❔ does democracy allow for more experimentation]] 🌰 the thing about China and BTC is– does it matter Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person crypto, blockchain"
