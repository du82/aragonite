full_description = "Fri 09 Jul 2021 🌰 Any Class Of Content Can Move You The funniest quote from On Taste is: No one doubts that Game of Thrones can entertain its audience, but it cannot move us as King Lear does. The one is an amusement, the other an exploration of human vanity, ignorance, cruelty, and desire. The essay begins with a story of a Rembrandt piece – the pinnacle of Light and Shadow until it’s revealed to be the work of his student. Suddenly, it’s no longer the shining example of beauty it once was. So the essay begins with the admission that elitism can drive our emotional reactions to art. And now there’s the assertion that middle-class media today “cannot move us” as the middle-class media of yesteryear does. Amusing. Related to: ❔ What would a self-exploratory class in art appreciation look like Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person"
