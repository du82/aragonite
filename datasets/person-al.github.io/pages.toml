["https://person-al.github.io/%E2%9D%94/2021/07/06/what-would-a-self-exploratory-class-in-art-appreciation-look-like.html"]
title = "❔ What Would A Self Exploratory Class In Art Appreciation Look Like | Let’s get Person-al"
description = "The goal would be to help you discover what you appreciate about art. Not teach you how to appreciate what others have decided are “classics”."
full_description = "Tue 06 Jul 2021 Last Tended: Wed 07 Jul 2021 ❔ What Would A Self Exploratory Class In Art Appreciation Look Like The goal would be to help you discover what you appreciate about art. Not teach you how to appreciate what others have decided are “classics”. Conversation and explanation is key. Listening to why others appreciate art helps me appreciate art. You could start with simple cards: Dixit or Mysterio or Tarot. Have people sort into categories: “Strong Feelings About”, “Ambivalent”. Note that it’s not about what you “like”, it’s about what elicits a response from you. Bring in something you could talk about for ages. Why is it something you could talk about forever? Reflection on what others say Based on how someone speaks about a work they connected with, what does that say? What patterns do you notice in what they seem to appreciate? Do they appreciate a connection to history? Strong use of color? Art from a particular time or place? Reflect on what others say about you. What sounds consistent? What sounds inconsistent? What makes you think “Huh, I’d never thought about it like that before.” Reflect on what you say Think over your own explanations on what you like: what patterns, if any, jump out at you? How do you feel about the art others bring in? Which do you appreciate? Other questions to consider What are things you appreciate but do not like? (I’m reminded of 🗨️ it’s beautiful but I don’t like it) Inspired by: On Taste Related to: 🗨️ it’s beautiful but I don’t like it Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person art"
