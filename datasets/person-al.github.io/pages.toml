title = "❔ Why are smartphones our primary computing devices | Let’s get Person-al"
description = "In a piece in early Feb 2022, Nicholas Grous from ARK Invest posited that: Today, smartphones are our primary computing devices, thanks in part to capabilities like multi-touch that are more convenient and interactive than on desktop computers."
full_description = "Mon 21 Feb 2022 ❔ Why are smartphones our primary computing devices In a piece in early Feb 2022, Nicholas Grous from ARK Invest posited that: Today, smartphones are our primary computing devices, thanks in part to capabilities like multi-touch that are more convenient and interactive than on desktop computers. As a software developer, it’s hard to tell which device habits of mine are shared with the average person. While I spend the majority of my day on a desktop or laptop computer, my primary personal computing device is a smartphone. Due in large part to its portability and laptop-fatigue after a long work day. What intrigues me about this small assertion of Grous’ is the idea that multi-touch is smartphones’ killer feature. And that it deems them “more interactive” than a desktop computer. I would posit instead that smartphones’ killer feature is its portability. The fact that it is there with me when I need to complete a task is what makes it my primary computing device. Multi-touch, outside of gaming, is a necessary compensation of how small the device is. It’s not inherently more convenient than a keyboard and mouse once the screen becomes larger. What is your primary computing device and why? Info: Related to: [[❔ how do we build a healthy relationship with technology]] Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person"
