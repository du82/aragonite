full_description = "Mon 12 Feb 2024 🗨️ plagiarism is the currency of the internet I call it “plagiarism is the currency of the internet”: The Internet, meanwhile, isn’t just about demand — my first mistake — nor is it just about supply — my second mistake. It’s about both happening at the same time, and feeding off of each other. It turns out that the literal meaning of “going viral” was, in fact, more accurate than its initial meaning of having an article or image or video spread far-and-wide. An actual virus mutates as it spreads, much as how over time the initial article or image or video that goes viral becomes nearly unrecognizable; it is now a meme. Ben Thompson, The New York Times’ AI Opportunity Info: Source: The New York Times’ AI Opportunity [[Thompson, Ben]] Related to: [[🗨️ turn off your internet at 5pm]] [[🌰 AI and the internet]] [[🌰 the internet allows us to organize people without doing all the groundwork for a sustainable movement first]] [[🌰 how do you make the internet more lean-in]] Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person"
