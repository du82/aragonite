full_description = "Fri 19 Jan 2024 🗨️ As trickle-down economics lost its credibility, a new prop was needed to sustain the neoliberal regime politically. It came in the form of neofascism. From Why Neoliberalism Needs Neofascists: As trickle-down economics lost its credibility, a new prop was needed to sustain the neoliberal regime politically. It came in the form of neofascism. and The neofascist assault on democracy is a last-ditch effort on the part of neoliberal capitalism to rescue itself from crisis. The only solution is a decisive retreat from globalized finance. Article Thesis: Neoliberalism has failed the people. In response, corporations have partnered when neo fascists in attempt to use neofacism to retain the status quo. The problem is that neofacism cannot solve inequality, making it unpopular very quickly. This can be its downfall if we work hard to fight neofacism. Info: Source: Why Neoliberalism Needs Neofascists Related to: [[🌰 neofascism is a supportive reaction to neoliberal capitalism]] [[For the academic left, neoliberalism’s conspicuous failure conveys, spuriously, the failure of liberalism tout court]] [[🗨️ Neofascism is hampered by neoliberalism in one crucial respect- it is incapable of ending mass unemployment.]] [[🌰 the math on a wealth tax checks out]] 🌰 democracy requires active maintenance [[🌰 demands of democracy]] Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person"
