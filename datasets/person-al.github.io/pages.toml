["https://person-al.github.io/%F0%9F%8C%B0/2023/02/05/protests-strengthen-democracy.html"]
title = "🌰 protests strengthen democracy | Let’s get Person-al"
description = "When I read about Russia’s role in the Canadian convoy protests , I immediately thought of Roman concrete. Let me explain."
full_description = "Sun 05 Feb 2023 🌰 protests strengthen democracy When I read about Russia’s role in the Canadian convoy protests , I immediately thought of Roman concrete. Let me explain. This week, behavioral scientist Caroline Orr Bueno released a paper on Russia’s role in the Canadian convoy protests. Her summary and full paper are worth reading but TLDR: Russia amplifies existing dissent in democratic countries to destabilize them. In other news, scientists have finally figured out why ancient Roman concrete is so much stronger than modern concrete. The Romans knew that concrete would crack over time, so they added a brittle form of lime that reacts with water to reform. These “lime clasts” break first under pressure then quickly recrystallize, creating “self-healing concrete”.1 To an authoritarian regime, public dissent is always a risk. When the public cannot disapprove “safely”, there is only revolution left. From that perspective, it benefits Russia to support protests in others countries. However, in a healthy democracy, public demonstrations are lime clasts, not dynamite. Just as lime reacts with water to strengthen concrete, the public reacts with its representatives to strengthen democracy. That said…is our democracy healthy? Is our lime crystallizing or crumbling? In the United States at least, I can’t tell. Info: Inspired by: Russia’s Role in the Far-Right Truck Convoy Related to: 🌰 democracy requires active maintenance [[❔ does democracy allow for more experimentation]] [[🌰 demands of democracy]] [[🗨️ China has become rich and powerful thanks to capitalism … But its population is not clamouring for democracy.]] I am not an expert. I probably got some of the nuance wrong. Read the MIT article above for a more accurate explanation. ↩ Want to comment? Write your response anywhere (e.g. Twitter, your blog, etc). Make sure to include a link to this post. Then paste the URL below and hit submit to send it my way! Link to the page you're commenting on: Don't want to do that? @ me on twitter or mastodon Every post on this blog is a work in progress. Phrasing may be less than ideal, ideas may not yet be fully thought through. Thank you for watching me grow. permalink person democracy"
