description = "Shipping Forecast Rosary, originally uploaded by moleitau. A side-project I've been playing with for a couple of months now. Have prototyped it using Ponoko, and now hope to make a couple of different material explorations - maybe even into metal. It needs a bit more fine-tuning and then I'll probably put them up for a…"
full_description = "Uncategorized Shipping Forecast Rosary August 22, 2010August 22, 2010 moleitau8 Comments Shipping Forecast Rosary, originally uploaded by moleitau. A side-project I’ve been playing with for a couple of months now. Have prototyped it using Ponoko, and now hope to make a couple of different material explorations – maybe even into metal. It needs a bit more fine-tuning and then I’ll probably put them up for a limited sale on Folksy. More pictures of the work-in-progress here. Share this:ShareTwitterTumblrFacebookLinkedInLike Loading... James Burt says: August 22, 2010 at 10:27 pm Fantastic. I’m looking forward to hearing more about this project. Reply nick s says: August 23, 2010 at 4:11 am Me too. I’ve been thinking a bit about reverse atlases and communities defined by seabords, and I’m not even able to watch ‘Coast’ on the Beeb (legally). But I love the implicit analogy: like worry beads (the archetype of the rosary) the zero-hours-forty-eight shipping forecast is more than a little OCD, the equivalent of checking that the lights are off, the doors and windows are locked, and the sandwiches are wrapped up for tomorrow’s lunch. Reply Tony says: August 23, 2010 at 9:23 am The inherent Britishness of the Shipping Forecast is attractive as well. It’s a stoic element of shared cultural history, and can be immensely calming to an expat who finds it on BBC World Service. I can just imagine reciting the almost Lewis Carroll-esqe nonsense poetry of the regional names whilst flicking them around a leather cord bracelet on a long night-time journey. Reply Robb Mitchell says: August 25, 2010 at 2:02 pm Wonderful ! This given me a few ideas and the thought of using Ponoko should help me finish another half idea. Thank you Reply New Product Development with Vulpine | Newspaper Club says: July 13, 2013 at 9:27 am […] Jones revived his wonderful Shipping Forecast Rosary project. Alex Parrott, Anthony Burrill and Alex Holder from Mother all […] Reply #018 | dig your fins : daily says: July 15, 2013 at 7:31 am […] set of sixty photographs by Mark Power inspired by the Shipping Forecast. Wonder if this is any nearer […] Reply"
