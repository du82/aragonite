description = "Welcome! This is my blog, where I've been writing on experience design, technology and anything else that interests me since June 2000. Since 1995, I've worked with some amazing people and been involved in some wonderful projects. You can see more of that at my portfolio site: moleitau.work Along the way I was at the…"
full_description = "About Petafloptimism Welcome! This is my blog, where I’ve been writing on experience design, technology and anything else that interests me since June 2000. Since 1995, I’ve worked with some amazing people and been involved in some wonderful projects. You can see more of that at my portfolio site: moleitau.work Along the way I was at the BBC, Nokia, a co-founder and lead designer of Dopplr, a startup / service for intelligent travel, and a principal at BERG, a design and invention company. I’ve had things I’ve worked on end up in the V&A, MoMA and Marvel Comics… I worked at Google from 2013-2022, first at the Creative Lab in NYC and then in Google Research. I’m now Principal Designer at Lunar Energy in London. Share this:ShareTwitterTumblrFacebookLinkedInLike Loading... soobee says: September 17, 2010 at 12:33 pm Love the shipping forecast and stumbled over this page by chance. Beautiful idea. Reply On tools, their use, and how to avoid fetishizing them « Adam Greenfield's Speedbird says: March 30, 2012 at 10:25 pm […] delaying the moment I actually settle down to do what I need to. Most of us have some such ritual; Matt Jones memorably describes this process of lining up one’s pencils and notebooks (in preference to […] Reply"
