title = "Centaurs not Butlers – Petafloptimism"
description = "A couple of weeks ago when AlphaGo beat a human opponent at Go, Jason Kottke noted “Generally speaking, until recently machines were predictable and more or less easily understood. That's central to the definition of a machine, you might say. You build them to do X, Y, & Z and that's what they do. A car…"
full_description = "Academia / artificial intelligence / Futures / Sufficiently-Advanced Lifestyle / Uncategorized Centaurs not Butlers March 31, 2016April 1, 2016 moleitau8 Comments A couple of weeks ago when AlphaGo beat a human opponent at Go, Jason Kottke noted “Generally speaking, until recently machines were predictable and more or less easily understood. That’s central to the definition of a machine, you might say. You build them to do X, Y, & Z and that’s what they do. A car built to do 0-60 in 4.2 seconds isn’t suddenly going to do it in 3.6 seconds under the same conditions. Now machines are starting to be built to think for themselves, creatively and unpredictably. Some emergent, non-linear shit is going on. And humans are having a hard time figuring out not only what the machine is up to but how it’s even thinking about it, which strikes me as a relatively new development in our relationship. It is not all that hard to imagine, in time, an even smarter AlphaGo that can do more things — paint a picture, write a poem, prove a difficult mathematical conjecture, negotiate peace — and do those things creatively and better than people.” A few months back I somewhat randomly (and somewhat at the behest of a friend) applied to run a program at MIT Media Lab. It takes as inspiration the “Centaur” phenomenon from the world of competitive computer chess – and extends the pattern to creativity and design. I’m personally much more interested in machine intelligence as human augmentation rather than the oft-hyped AI assistant as a separate embodiment. My old colleague and friend Matt Webb recently wrote persuasively about this: “…there’s a difference between doing stuff for me (while I lounge in my Axiom pod), and giving me superpowers to do more stuff for myself, an online Power Loader equivalent. And with the re-emergence of artificial intelligence (only this time with a buddy-style user interface that actually works), this question of “doing something for me” vs “allowing me to do even more” is going to get even more pronounced. Both are effective, but the first sucks… or at least, it sucks according to my own personal politics, because I regard individual alienation from society and complex systems as one of the huge threats in the 21st century.” I was rejected, but I thought it might be interesting to repost my ‘personal statement’ here as a curiosity, as it’s a decent reflection of some of my recent preoccupations about the relationship of design and machine intelligence. I’d also hope that some people, somewhere are actively thinking about this. Let me know if you are! I should be clear that it’s not at the centre of my work within Google Research & Machine Intelligence but certainly part of the conversation from my point of view, and has a clear relationship to what we’re investigating within our Art & Machine Intelligence program. MASSACHUSETTS INSTITUTE OF TECHNOLOGY Tenure-Track Junior Faculty Position in Media Arts and Sciences MIT Media Lab, Cambridge, MA David Matthew Jones, B.Sc., B.Arch (Wales) Personal Statement We are moving into a period where design will become more ‘non-deterministic’ and non-human. Products, environments, services and media will be shaped by machine intelligences – throughout the design and manufacturing process – and, increasingly, they will adapt and improve ‘at runtime’, in the world. Designers working with machine intelligences both as part of their toolkit (team?) and material will have to learn to be shepherds and gardeners as much as they are now delineators/specifiers/sculptors/builders. I wish to create a research group that investigates how human designers will create in a near-future of burgeoning machine intelligence. Through my own practice and working with students I would particularly like to examine: Legible Machine Intelligence How might we make the processes and outcomes of machine intelligences more obvious to a general populace through design? How might we build and popularize a critical language for the design of machine intelligence systems? Co-designing with Machine Intelligence “Centaur Designers” In competitive chess, teams of human and non-human intelligences are referred to as ‘Centaurs’ How might we create teams of human and non-human intelligences in the service of better designed systems, products, environments? What new outcomes and impacts might ‘centaur designers’ be able to create? Design Superpowers for Non-Designers {aka “I know Design Kung-Fu”} How might design (and particularly non-intuitive expertise) be democratised through the application of machine intelligence to design problem solving? Machine Intelligence as Companion Species The accessibility of powerful mobile devices points to the democratisation of the centaur pattern to of all sorts of problem-spaces in all walks of life, globally Social robotics and affective computing have sought to create better interfaces between autonomous software and hardware agents and their users – but there is still an assumption of ‘user’ in the the relationship How might we take a different starting reference point – that of Donna Haraway’s “Companion Species Manifesto” to improve the working relationship between humans and machine intelligences Machine Intelligence in Physical Products How might the design of physical products both benefit from and incorporate machine intelligence, and what benefits would come of this? Machine Intelligence in Physical Environments How might the design of physical environments both benefit from and incorporate machine intelligence, and what benefits would come of this? Share this:ShareTwitterTumblrFacebookLinkedInLike Loading..."
