full_description = "Robot Matt Webb needs me to be human April 10, 2020 moleitauLeave a comment You should subscribe (if you’re human?) – Matt W’s blog is back, back, BACK! Station Identification March 17, 2014March 17, 2014 moleitau David Korowicz, quoted in Dan Hill’s “Dark Matter, Trojan Horses” “Just as we never consider the ground beneath our feet until we trip, these glimpses into the complex webs of inter-dependencies upon which modern life relies only come when part of that web fails. When the failure is corrected, the drama fades and all returns to normal. However, it is that normal which is most extraordinary of all. Our daily lives are dependent upon the coherence of thousands of direct interactions, which are themselves dependent upon trillions more interactions between things, businesses, institutions and individuals across the world.” And… from Dave Egger’s “The Circle” “She thought of the foxes that might be underneath her, the crabs that might be hiding under the stones on the shore, the people in the cars that might be passing overhead, the men and women in the tugs and tankers, arriving to port or leaving, sighing, everyone having seen everything. She guessed at it all, what might live, moving purposefully or drifting aimlessly, under the deep water around her, but she didn’t think too much about any of it. It was enough to be aware of the million permutations possible around her, and take comfort in knowing she would not, and really could not, know much at all.” Edited with BlogPad Pro The Betteridge Boast/Boost February 24, 2014February 24, 2014 moleitauLeave a comment I’m shamed into blogging more regularly by Mr Betteridge’s post: “Keeping writing a blog is hard work, and takes commitment, and it’s very easy to drift out of that commitment. One of the reasons that I decided to start trying to write 500 words a day is because I believed that making this kind of commitment was good for me. But it was also an attempt to avoid pouring too much of a my energy into things like Twitter, Facebook, and other social networks which – while fun, and generally positive – don’t feel like they have the permanence of my own space. This blog is older than Facebook, and I like that.” Well… strictly speaking, I don’t quite own my own words right now, I’m hosted on wordpress.com – but this blog (in its many incarnations) is older than facebook too… *checks sidebar* – It’ll be 14 years old this summer! Blimey… Thanks for the prod, Ian – I’ll try me best."
