full_description = "Sufficiently-Advanced Lifestyle Station Identification May 22, 2024 moleitauLeave a comment There’s been a lot of Her in the news. Including the assertion that most of the folk who see it as a goal to be emulated in our technologies haven’t watched the end. The end (which I did watch) if memory serves is where the AIs ‘leave’ to go hang out with the emulated ghost of Alan Watts in the Oort Cloud. And it’s ok, cos everyone then realises how alienated they’ve been by technofeudalism, and go for a picnic. Or something. I was trying to find a talk that Kevin Slavin gave, 16 or so years ago at the Architectural Association – at the launch of the BLDGBLOG book. I can’t. But again, if memory serves, it’s epic coda was the machines full of HFT algos ascending, like the end of Her, to a realm of pure lightspeed hyperfinance, uncoupled from the physical world they had been chained to. Maybe, on a good day, I think the machines, and the people who think like machines will delaminate themselves, and we’ll be left behind – but it’ll be ok, because we’ll have people like Louis Cole. Doing Louis Cole things. I mean. Share this:ShareTwitterTumblrFacebookLinkedInLike Loading... music"
