title = "Braaainnnnsssss – Petafloptimism"
description = "Posts about Braaainnnnsssss written by moleitau"
full_description = "The job of a {broader, more inclusive set of design} brain{s} is to “produce {decolonised} future{s}” February 24, 2020February 24, 2020 moleitau1 Comment Daniel Dennett, Intuition Pumps (my emboldening, below) How can meaning make a difference? It doesn’t seem to be the kind of physical property, like temperature or mass or chemical composition, that could cause anything to happen. What brains are for is extracting meaning from the flux of energy impinging on their sense organs, in order to improve the prospects of the bodies that house them and provide their energy. The job of a brain is to “produce future” in the form of anticipations about the things in the world that matter to guide the body in appropriate ways. Brains are energetically very expensive organs, and if they can’t do this important job well, they aren’t earning their keep. Matt Ward, interviewed by SpeculativeEdu Colonising the future: If Speculative Design builds competency in thinking about future alternatives, the design community needs to ensure that it is aware of the structural inequalities that allow for a privileged voice. I think it’s become painfully obvious that we don’t need any more white male billionaires telling us how the future looks, therefore by moving Speculative Design outside of the “academy” we need to make sure it’s reaching people who don’t normally have say over the future. We should aim to empower alternative views about how the world could be. It’s a great interview. Read the lot. Speaking my brains about future brains this year June 5, 2018June 6, 2018 moleitauLeave a comment Got some fun speaking gigs lined up, mainly going to be talking (somewhat obliquely) about my work at Google AI over the last few years and why we need to make centaurs not butlers. June June 12th Speaking at Cog.X in London as part of the “Cutting Edge” (!) track curated by Exponential View‘s estimable Azeem Azhar June 26th Speaking at RCA/Wallpaper ‘Business of Design, Technology, Art & Fashion Conference’ June 29th Speaking at the V&A’s “Tookit for the future” event curated by Mariana Pestana and Rory Hyde as part of The Future Starts Here exhibition. August August 31st Speaking at Frontiers Conference, Stockholm November November 16th Speaking at Material Conference, Reykjavík Then I’ll probably shut up again for a few years."
