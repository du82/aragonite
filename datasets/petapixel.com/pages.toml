["https://petapixel.com/2025/03/03/dubbelfilms-updated-stereo-is-a-refined-red-and-blue-gradient-film"]
title = "Dubbelfilm's Updated Stereo is a 'Refined' Red and Blue Gradient Film | PetaPixel"
description = "Dubbelfilm announced a new version of its Stereo 400 and Stereo 200 specialty 35mm photographic film that has a red and blue gradient."
full_description = '''Dubbelfilm’s Updated Stereo is a ‘Refined’ Red and Blue Gradient Film Mar 03, 2025 Jaron Schneider Dubbelfilm announced a new version of its Stereo 400 and Stereo 200 specialty 35mm photographic film that improves the gradient effect from red to blue and eliminates the static colors at the beginning and end. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); The Barcelona-based company produces a range of standard and specialty films, cameras, accessories, and more. Its most recent new release was a black and white film called Glitch, but Dubbelfilm has a host of other options available to analog photographers who like to experiment with different looks. The new Stereo, called “New Generation,” was improved based on what Dubbelfilm says was extensive user feedback. The company says it refined and enhanced its film to bring the “most mesmerizing visual experience” it could. Dubbelfilm describes the look of photos as having a red tint that fades to blue through the roll. The initial shots will have a “very intense” look that will become more subtle throughout, while the middle of the roll will have an “amazing transition.” Below is a contact sheet that shows how the effect transitions through the full roll: “The original ‘Stereo’ film was celebrated for its unique ability to shift from a full red to a full blue, creating vibrant and dynamic photos unlike anything else on the market. Our new and improved version focuses on perfecting the gradient effect in the middle of the film that captured the imaginations of its shooters,” Dubbelfilm says. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); “In this iteration, we’ve eliminated the static colors at the beginning and end, concentrating solely on the stunning gradient transition that made the original so special. Expect to see your images bathed in an exquisite blend of hues that evoke emotion and creativity in every frame. This continuous gradient effect creates an unparalleled, surreal experience, transforming your photographs into works of art.” Below are a few sample photos captured on Dubbelfilm Stereo New Generation, provided courtesy of the company. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); The film is available in both 200 and 400 ISO variants, both of which ship with 36 exposures per roll. Both use the standard C-41 color process, so photographers should not have a problem developing at home or using a local lab. Dubbelfilm Stereo New Generation is available for $16 at ISO 200 and $17 at ISO 400 directly through the company’s website. Image credits: Dubbelfilm Analog, News 35mmfilm, analog, dubbelfilm, dubbelfilmstereo, film, stereonewgeneration PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Photographer Buys 113-Year-Old Stereo Camera and Develops the Ancient Film It Came With Mercury Works Offers Kodak IMAX Film to Photographers for First Time Holga Medium-Format 3D Stereo Camera This 3D Stereoscopic Pinhole Camera Aims to Revive Spatial Photography /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/03/dubbelfilms-updated-stereo-is-a-refined-red-and-blue-gradient-film/'; this.page.identifier = '782713'; this.page.title = 'Dubbelfilm&#8217;s Updated Stereo is a &#8216;Refined&#8217; Red and Blue Gradient Film'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
