["https://petapixel.com/2025/03/05/this-is-the-insane-de-aging-tech-used-in-tom-hanks-movie-here"]
title = "This is The Insane De-Aging Tech Used in Tom Hanks' Movie 'Here' | PetaPixel"
description = "Here starring Tom Hanks and Robin Wright was hailed as a groundbreaking piece of cinema thanks to its AI-powered de-aging technology."
full_description = '''This is The Insane De-Aging Tech Used in Tom Hanks’ Movie ‘Here’ Mar 05, 2025 Matt Growcoot An artificially young Tom Hanks and Robin Wright in the movie Here. The crew used breakthrough AI technology to pull off the de-aging. Here starring Tom Hanks and Robin Wright was hailed as a groundbreaking piece of cinema thanks to its AI-powered de-aging technology and for its unusual camera work. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); Despite the film receiving mixed reviews, Here represents a leap forward in de-aging technology; a controversial topic in Hollywood. De-aging famous faces have cropped up in movies like Indiana Jones 5 and The Irishman. In a recent Vox video, the production visual effects supervisor on Here, Kevin Baillie, explains how the crew relied on a company called Metaphysic for real-time de-aging and up-aging to pull the film off. “It’s a very, very hard effect to pull because we look at human faces all day, every day,” says Baillie. “It’s the thing that we recognize the most.” Vox notes that the first movie to de-age actors was X-Men The Last Stand (2006) and it wasn’t very good. And until very recently, the process of de-aging was painstakingly long, labor intensive, and expensive. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); However, for Robert Zemeckis’ Here, that method would never work because of the quantity of de-aging shots involved. So, the producers turned to Metaphyic which uses AI to alter people’s appearance such as in Alien: Romulus when a late Alien actor Ian Holm was brought back to life with the technology. Baille explains that the team gathered photos of Hanks from different stages of his career and fed them into a machine learning algorithm. He likens it to giving someone a book of Tom Hanks images, asking them to study it constantly, and then asking them to imagine “Tom Hanks singing Happy Birthday to you in the moonlight.” This argument — that AI is just the same as artists using other artists’ work as inspiration — is often deployed by proponents of the technology. However, it’s not completely clear and there have been instances where AI image generators have spat out pictures identical to ones in the training data. And some photographers say AI can recreate eerily similar copies of their work. Revolutionary Technology On-Set The Metaphysic technology was able to produce live face swaps on-set, meaning the actors were able to check their performances and tweak things as they see fit. “It really brought the actor into the conversation and allowed them to use it as a tool,” adds Baille. “It was incredible walking away from the set with every shot that was going to be a face swap shot, there was already a very rudimentary version but pretty convincing version of it already done.” It’s clear that de-aging technology powered by AI is still in its infancy. But it’s a trend that’s not going away; expect to see more artificially young Hollywood stars in the future. News ai, Artificial Intelligence, deaging, generativeai, hollywood, metaphysic, moviemaking, tomhanks PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles The Camera Never Moves in Tom Hanks’ New Film ‘Here’ Tom Hanks Says AI Could Allow Him to Star in Movies After His Death Tom Hanks Crashed this Couple’s Wedding Photo Shoot in Central Park Disney Uses Atrocious CGI to Cover Up Daryl Hannah’s Butt in ‘Splash’ /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/05/this-is-the-insane-de-aging-tech-used-in-tom-hanks-movie-here/'; this.page.identifier = '783012'; this.page.title = 'This is The Insane De-Aging Tech Used in Tom Hanks&#8217; Movie &#8216;Here&#8217;'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
