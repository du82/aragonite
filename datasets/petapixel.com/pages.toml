["https://petapixel.com/2025/03/03/sigma-is-hosting-a-new-york-pop-up-to-showcase-the-bf-camera"]
title = "Sigma Is Hosting a New York Pop-Up To Showcase the BF Camera | PetaPixel"
description = "Sigma will host a pop-up space in New York City through March to give photographers a chance to see the BF camera in person."
full_description = '''Sigma Is Hosting a New York Pop-Up To Showcase the BF Camera Mar 03, 2025 Jaron Schneider Sigma will host a pop-up space in New York City through March to allow photographers to see the brand’s updated visual identity as well as get hands-on time with the new 300-600mm f/4 lens and the “radically simple” BF camera. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); Last week, Sigma’s newly-redesigned booth at the CP+ show in Yokohama gave the public its first chance to see the company’s new direction, lenses, and camera but for those in the United States who were unable to attend, the pop-up will be the next best thing. The Sigma pop-up will open at 10 AM on March 7 and run through 2 PM on Saturday March 29 and will be located at 21 Spring Street in Manhattan’s Nolita neighborhood. “[The space will] introduce the company’s elegantly updated visual identity, the radically simple Sigma BF camera, and recently announced lenses including the first-ever 300-600mm f/4 zoom lens. Celebrating the Art of Engineering and Engineering for Art, the space will showcase artwork captured with the new camera by esteemed photographers,” Sigma says. “See the new Sigma BF alongside an exhibition from photographer Sarah van Rij, and be some of the first to explore the Sigma BF, inspired by the humble beginnings of the camera obscura. Paired with Sigma I series lenses, begin a new creative journey with innovation.” Through March, the pop-up space will be open daily from 10 AM through 6 PM (with exception of the final day of the pop-up) and guests will be able to take their first look at the newly-announced Sigma BF camera. The pop-up will also heavily feature photos captured with the new camera. “On weekdays, attendees will have the opportunity to learn more about Sigma’s new products and visual identity from Sigma team members. Weekends will feature meet-and-greets with photographers, Instagrammers and influencers including Yu Shi, Max Loewenstein, Bri Hall, Ethan Barber, plus Chris Greer and Paul Daniel, co-hosts of the new PBS series View Finders, Sigma CEO Kazuto Yamaki, and others throughout the month,” Sigma says. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); Walk-ins will be welcome during opening hours, however priority admission will be given to registered attendees during special events. Tickets, which are free, that range through the full stay of the pop-up can be reserved ahead of time. Image credits: Rendering of the pop-up space provided courtesy of Sigma Equipment, News inperson, newyork, popup, sigma, sigmabf, specialevent PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Sigma’s New 14mm f/1.4 Art Lens is Tailor-Made for Astrophotography Sigma Extends Camera Gear Warranty to Cover Hurricane Victims Sigma DP2x Compact Camera Packs DSLR-Sized Foveon X3 Sensor Sigma Apologizes, Says Full-Frame Foveon Camera is Delayed Indefinitely /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/03/sigma-is-hosting-a-new-york-pop-up-to-showcase-the-bf-camera/'; this.page.identifier = '782686'; this.page.title = 'Sigma Is Hosting a New York Pop-Up To Showcase the BF Camera'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
