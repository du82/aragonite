["https://petapixel.com/2025/03/03/viltrox-25mm-f-1-7-air-review-performance-without-price"]
title = "Viltrox 25mm f/1.7 Air Review: Performance Without Price | PetaPixel"
description = "Viltrox continues to impress and its latest lens is diminutive in both size and price but the performance packs a punch."
full_description = '''Viltrox 25mm f/1.7 Air Review: Performance Without Price Mar 03, 2025 Chris Niccolls Viltrox is steadily expanding its line of lenses and I’ve committed to making 2025 the year that I review more of them. Viltrox lenses have earned a glowing reputation and I very much enjoyed the 135mm f/1.8. But the latest 25mm f/1.7 comes in at an incredibly low price of $179. Can a lens this affordable make a favorable impression or is it too good to be true? freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); Buy the Viltrox 25mm f/1.7 Air new on Amazon.comBuy the Viltrox 25mm f/1.7 Air used on KEH.com We are committed to reviewing more Viltrox lenses, especially if they turn out as good as the 25mm. Bounced light off of the downtown buildings is always fun to hunt for. Viltrox Air 25mm f/1.7 Review: How It Handles Part of the low cost of this optic is attributed to the fact that this lens is made to cover a smaller APS-C sized sensor and gives the lens a full-frame equivalent focal length of roughly 37mm. It is very compact with 52mm filter threads on the front and weighing in at only 170 grams (six ounces). It has very little in the way of tactile features, too: there is a rudimentary manual focusing ring and not much else. There is no AF/MF selector switch and no weather sealing but at least the mount is solid metal. The 25mm f/1.7 is compact and bright. It belongs on everyday-carry cameras like the Sony A6700. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); The Viltrox makes for a discreet street lens with compact proportions. The Viltrox 25mm uses an affordable stepping motor to focus the lens but it does a fantastic job shifting the lens elements quickly and quietly. The lens can also focus fairly close but this is no macro lens: close-up shots may not be magnified but they are at least sharp. Temperatures might be starting to warm up a little but I don’t want to jinx it. I could go for a tropical paradise right now but a mural painting will have to do instead. Viltrox Air 25mm f/1.7 Review: How It Shoots I had a bright and sunny day available to test this little lens so I pointed it towards the sun to get some flare examples. The coatings do a great job of controlling washed-out areas of exposure and contrast is well-maintained. Ghosting was minimal even at tight apertures. The sun stars are pretty bland, however, with no real definition, but I don’t think many users will mind on a lens like this. Flare is controlled well with minimal ghosting present. The lens isn’t designed to be rugged but it does have a metal flange mount. Note the USB-C port for firmware updates. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); Although this lens isn’t what I would call a shallow depth of field kind of lens, the bokeh is quite nice with a swirly cat’s eye look at f/1.7. However, the specular highlights are pretty distracting with onion rings and some soap bubble effect to them. This makes the background somewhat distracting when shooting at wide apertures. In most situations though, this lens is not going to deliver an ultra-shallow look to the focus so the results are acceptable for the price. Bokeh is ok but the lens does have a distracting look to highlights and harshness. The best part about the Viltrox 25mm lens was that I forgot about the hardware and simply found myself enjoying the picture taking instead. The Viltrox 25mm f/1.7 has some lateral chromatic aberration problems and you can see these purple smears quite clearly when shooting contrast-y subjects. At this price, a lens isn’t going to correct for these aberrations but remember that they are easily removable in post. It’s the longitudinal chromatic aberrations (LoCA) that are more critical because they are difficult to remove in editing. Luckily, the LoCA is pretty minimal when shooting at f/1.7 with only a slight color shift in the out-of-focus areas. The corners can get a little dark at f/1.7 but they get much better at tighter apertures. I like the sharpness of the Viltrox and the contrast is good too. Can a cheap lens be sharp? The answer is a resounding yes. The Viltrox shows good detail and contrast in the center of the frame and any improvement from stopping the aperture down is minimal. The corners are a little soft at f/1.7 and the vignetting is very apparent but this largely goes away with a tighter aperture. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'petapixel_MPU', slotId: 'petapixel_MPU_3' }]); }); The center sharpness is excellent at the widest aperture and contrasty too. I didn’t expect such a handy little lens with full autofocus to be such a good price. Incredible Performance for a Lens This Affordable What’s not to like about a cheap and cheerful lens that delivers excellent results? The lens is bare bones for sure but the results deliver excellent value for the $179 price. Viltrox has shown that it can produce premium lenses like the 135mm and useful value optics alike. I truly wish that Viltrox will produce more affordable primes in the future if they are anything like this latest little wonder. The focal length equivalent may not be my favorite but the optical results punch way above the price of the Viltrox 25mm. I hope to see a whole line of Viltrox primes lenses that keep the cost down while pushing the image quality up. Are There Alternatives? In Fujifilm X-mount, the 23mm f/2 is an option with comparable image quality, albeit at a higher price. The XF 23mm f/1.4 provides way more light for way more money. It’s a similar story with Sony when you look at its 24mm f/1.8 that comes in at twice the price. Should You Buy It? Yes. The Viltrox 25mm f/1.7 represents incredible value for the dollar and punches well above its weight. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_4' }]); }); Buy the Viltrox 25mm f/1.7 Air new on Amazon.comBuy the Viltrox 25mm f/1.7 Air used on KEH.com Equipment, Reviews apscsensor, canonrfmount, compactprime, fujifilmxmount, normallens, primelens, sonyemount, streetphotography, travelphotography, Viltroxair25mmf17 PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Viltrox Announces Affordable $176 AF 25mm f/1.7 Air APS-C Lens We Think We Know What the New Viltrox Air Lens Will Be The Compact Viltrox 56mm f/1.7 Portrait Prime Costs Only $139 Viltrox Launches $180 56mm f/1.7 Lens for APS-C Sony Cameras /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/03/viltrox-25mm-f-1-7-air-review-performance-without-price/'; this.page.identifier = '781461'; this.page.title = 'Viltrox 25mm f/1.7 Air Review: Performance Without Price'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
