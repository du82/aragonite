["https://petapixel.com/2025/03/04/reddit-founder-alexis-ohanian-joins-bid-to-buy-tiktok"]
title = "Reddit Founder Alexis Ohanian Joins Bid to Buy TikTok | PetaPixel"
description = "Reddit co-founder Alexis Ohanian has joined a bid to buy TikTok - as the app faces a divest-or-ban law in the U.S."
full_description = '''Reddit Founder Alexis Ohanian Joins Bid to Buy TikTok Mar 04, 2025 Pesala Bandara Reddit co-founder Alexis Ohanian has joined a bid to buy TikTok — as the popular video app faces a divest-or-ban law because of national security concerns in the United States. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); On Monday, billionaire Frank McCourt announced that Ohanian, the co-founder of Reddit and a venture capitalist, has joined his bid to acquire TikTok’s U.S. operations. McCourt tells Reuters that Ohanian will help promote the “Project Liberty” bid to buy the U.S. assets of TikTok, which he calls “The People’s Bid,” because of plans to run the app on technology that lets users control how their data will be used and shared. In January, Project Liberty submitted an official proposal to acquire the social media app, detailing plans to let American users control how their data is used and stored. Ohanian will join the bid to buy TikTok as a strategic adviser specializing in social media. “He has that broad portfolio of experience… of where social media was and, I think, a keen understanding of where it’s evolving,” McCourt tells Reuters. “Where he can help mostly is validating but also socializing what we’re doing.” Alexis Ohanian, the co-founder of Reddit, is seen with his wife Serena Williams. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); Ohanian co-founded Reddit with his University of Virginia roommate. He sold the platform to Condé Nast in 2006 but returned in 2014 as executive chair to oversee its revival. The internet pioneer says he is excited to work on the bid to buy TikTok and give Americans more control over their data. American social media users briefly had no access to TikTok after a law banning it on national security grounds came into effect on January 19. However, TikTok resumed services hours later and restored access to its 170 million users in the U.S. after Trump issued an executive order to delay the app’s ban. The executive order delayed TikTok’s ban for 75 days, giving the app more time to find a U.S. buyer. Microsoft was reportedly in talks with TikTok to buy the app, according to President Trump. There were also rumors that Chinese officials were weighing up selling the app to Elon Musk, but the X owner denied these claims. But it is still unclear whether ByteDance, TikTok’s China-based owner, would be willing to sell the platform, even if the deal were facilitated by Trump. Image credits: Header and center photos licensed via Depositphotos. Law, News, Technology alexisohanian, bytedance, donaldtrump, reddit, tiktok, tiktokban PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Google and Reddit Tighten Their Policies Regarding Explicit Photos Rapidly-Growing Picfair Announces Adobe Collaboration Imgur, TikTok, and Reddit Investigated Over Use of Children’s Data TikTok Denied Emergency Bid to Stop US Ban Taking Effect on January 19 /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/04/reddit-founder-alexis-ohanian-joins-bid-to-buy-tiktok/'; this.page.identifier = '782847'; this.page.title = 'Reddit Founder Alexis Ohanian Joins Bid to Buy TikTok'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
