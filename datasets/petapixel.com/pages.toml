["https://petapixel.com/2025/03/04/how-wild-horses-helped-a-photographer-rediscover-her-voice"]
title = "How Horses Helped a Photographer Rediscover Her Voice | PetaPixel"
description = "Equine photographer Katja Jensen shares how she lost her artistic voice, but found it again through the photography of horses."
full_description = '''How Horses Helped a Photographer Rediscover Her Voice Mar 04, 2025 Kate Garibaldi Equine photographer Katja Jensen describes how she lost her artistic voice and found it again through photographing horses. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); Katja Jensen’s lifetime of work began at just eight years old with her mom’s DSLR camera. She started by photographing the animals around her home: cows, cats, dogs, and, of course, horses. It was the horses that really opened her heart. Jensen described how she grew up quiet and reserved. With animals, she finally felt like herself, without judgment or expectation. “I got so intrigued by the way I could freeze a moment in time, and I loved nothing more than to have animals as my subject. I was a quiet child. With them I didn’t need to use words, and I could be myself without the fear of being too much or not enough,” Jensen explains. “To this day I still find myself most comfortable in the presence of animals. I’ve shared many moments with different horses all over the world, and the words I exchange with humans will never be a match for my silent conversations with them.” With photography as her voice, Jensen built her portfolio over decades, featuring the most stunning breeds of horses. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); Walking the line between fairy tale and cinematic, her style is undeniable. The way that she captures light displays a painterly eye for the forms of shadows on her subjects. She prefers to photograph in blue or golden hour for the color of light. Often warm, earthy, or muted in tone, the images look vibrant without being overly saturated. With the horses as her muse, Jensen finds that the best way to create is by letting the horses be horses. She gives them space so that she can work with them rather than against them. Jensen believes that’s when the real connection happens, she’s able to capture their personality and behaviors on their terms. By allowing the horses to do what they want, she is able to witness them interact with each other or the environment rather than perform. Her photo shoots combine planning and intuition, a rhythm crafted from years of experience. It starts with the first inspiration for a project: a unique horse breed she has seen, a place that would make a perfect background, then once on location, the way the light hits scenery, or a story that she can’t get out of her head. She keeps the concept fluid and responds to both the animals and the landscape. To create her photographs, Jensen desires the highest quality work and files. Her primary kit is a Canon EOS R5 with 70-200mm f/2.8 lens. Occasionally, she also uses a 100-500mm lens for extra range when working in wide open spaces. Her selection process of which images make it through culling is where her key values align. She looks for light, movement, and, most of all, emotion. In post-processing, she prefers subtle but intentional adjustments to the tones, enhancing the depth and bringing the image more in line with the mood and feeling from that day. Her goal is to create a photograph that doesn’t just show a horse but displays real emotion and makes the viewer feel something. The horse as subject is the vessel. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); It’s that search for emotion that drives Jensen and her vision. From realizing in her youth that her connection to animals allowed her to be herself, she’s also reflected on how, even as an adult, people-pleasing can affect your work. It’s when it’s just her and the horses that she makes her finest artwork. This intuitive approach and self-awareness allow her to create her emotive work. Driven by feelings, she is drawn to the magic of light to document the personality of horses. Her latest published passion project, “Spirits of the Highlands,” documents the resilient, hardy Highland ponies that make the Scottish Highlands their home. It was also an important project for her to reconnect with her voice. She explains that she artistically felt lost for a time, as many photographers do when working on spec. The grind can be overwhelming, and burnout is difficult to overcome. Jensen says that being back in the wilds, just her and the horses brought her out of her shell. She describes how this reawakening of her photography roots helped her create some of her best work yet: freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'petapixel_MPU', slotId: 'petapixel_MPU_3' }]); }); “I didn’t realize what direction my heart pulled me in until I stopped doing paid and model shoots. In those settings, there were always people around who interfered and had an opinion. My turning point was visiting a group of Highland ponies in Scotland years back and sitting with them quietly on the mountainside. “Just like when I was little, there was no one forcing me to speak. To be something or someone that perhaps I wasn’t. The ponies quietly grazed away, leaving me to sit with my emotions and finally being able to hear my heart for the first time in a long time. These ponies helped me find my voice again. They held space for me as I searched for the meaning of my photography, and they helped me create some of my most emotional photos to this day. I’ve visited them more than once since the first time, and it always feels like coming home.” Katja Jensen’s journey highlights the importance of finding time to reconnect with what made you a photographer in the first place. To honor your core values and voice, and create with your whole heart, that is when photography feels like home. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_4' }]); }); Katja Jensen’s next project documents her recent trip to Portugal in November of 2024. Reinvigorated from her work in Scotland with the Highland ponies, she photographed the proud Lusitano and native, wild Garrano ponies of the beautiful Iberian Peninsula. The collection will soon be on her website. Image credits: All photographs by Katja Jensen. Inspiration, Spotlight burnout, canonr5, equine, highlands, horse, horses, katjajensen, portugal, scotland, scottishhighlands, wildhorse, wildlife PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Wild Horse Photographer Braves Snake Bites for Breathtaking Images How to Find and Photograph Wild Horses in the US Emotive Portraits of Majestic Horses This is What Horses Look Like from Below /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/04/how-wild-horses-helped-a-photographer-rediscover-her-voice/'; this.page.identifier = '782953'; this.page.title = 'How Horses Helped a Photographer Rediscover Her Voice'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
