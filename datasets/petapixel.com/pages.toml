description = "PetaPixel Members are able to download full-resolution sample JPEG and RAW files from all of the latest cameras and lenses"
full_description = '''Update for PetaPixel Members: Download RAWs From the Lumix S1R II, Sony’s New Lenses, and More Mar 04, 2025 Jaron Schneider PetaPixel Members are able to download full-resolution sample JPEG and RAW files from all of the latest cameras and lenses we review, and today that list expands with samples captured with the Panasonic Lumix S1R II, both of Sony’s new lenses, and more. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); Become a PetaPixel Member Today When PetaPixel launched the Membership program last year, its primary benefit was the removal of ads from the site to allow for a better viewing experience. At the time, PetaPixel promised more perks would come down the road. Over the last few months, those perks have rolled out and Members get $15 off the Moment Store, 25% off the PetaPixel Merch Store, and now access to galleries of images from all the latest cameras and lenses. This week, we’ve added samples taken with the Panasonic S1R II, the Sony 16mm f/1.8G, the Sony 400-800mm f/6.3-8, and the Viltrox 25mm f/1.7 Air. The goal is to provide Members with as much information as possible so that they can make the most informed camera gear purchasing decisions. These galleries include a range of sample images of varying subjects, light conditions, and camera settings so that photographers can see what a camera or lens can produce before making a purchase. New camera galleries, such as the one for the OM-3, include sample images taken at a range of ISOs so that photographers can better understand the camera’s light-gathering capabilities. New lens galleries will include full-resolution RAW samples of PetaPixel‘s test chart at a range of aperture values to provide photographers with important performance knowledge — information that’s pivotal to making an informed buying decision. By downloading sample photos, Members are agreeing to PetaPixel’s Sample Galleries Terms of Use. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); Each gallery will include at least 25 sample photos taken in both the camera’s RAW format as well as the highest-quality JPEG. In some cases, such as is the case with the Sony 400-800mm f/6.3-8, the number of samples will be substantially larger (that gallery has well over 100 samples). The team will always do its best to show a wide range of subjects and lighting conditions, too. Where Can Members Find Sample Galleries? Sample galleries will be published on a Member’s Only page and organized first by product type and then alphabetically. The files are delivered as a ZIP folder and can be downloaded any number of times by a member. A link to Sample Galleries can be found on the website’s top navigation bar. How Much is a PetaPixel Membership? A PetaPixel Membership costs just $3 per month or $30 per year. Become a PetaPixel Member Today News panasoniclumixs1rii, petapixelmemberships, samplegalleries, Sony, viltrox PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Panasonic S1R II Boasts New 44.3MP Sensor, 40 FPS, AI AF, and 8K Video Three Months with the Panasonic S1R Panasonic’s S1R and S1 Will Be its First Full-Frame Mirrorless Cameras Panasonic Lumix S1R Wins ‘Camera of the Year’ in Japan /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/04/update-for-petapixel-members-download-raws-from-the-lumix-s1r-ii-sonys-new-lenses-and-more/'; this.page.identifier = '782703'; this.page.title = 'Update for PetaPixel Members: Download RAWs From the Lumix S1R II, Sony&#8217;s New Lenses, and More'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
