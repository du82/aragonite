["https://petapixel.com/2025/03/04/judges-smiling-photo-was-doctored-to-make-her-look-ashamed"]
title = "Judge's Smiling Photo was Doctored to Make Her Look 'Ashamed' | PetaPixel"
description = '''A judge's smiling photo was "digitally altered" for a television attack ad to make her look like she was frowning.'''
full_description = '''Judge’s Smiling Photo was Doctored to Make Her Look ‘Ashamed’ Mar 04, 2025 Pesala Bandara Judge Susan Crawford says a photo of her smiling (right) was altered to make her look like she was frowning (left) in her rival’s ad. Crawford says that the image may have allegedly been edited with AI. A judge’s smiling photo was “digitally altered” for a television attack ad to make her look like she was frowning. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); Conservative Judge Brad Schimel of Waukesha County and liberal Judge Susan Crawford of Dane County are competing in the April 1 general election for a seat on the Wisconsin Supreme Court in Madison, Wisconsin. On Wednesday, Crawford filed a complaint with the Wisconsin Ethics Commission claiming her image was doctored in a recent TV attack ad released by her rival Schimel. 🚨Susan Crawford has a record of coddling criminals.🚨 pic.twitter.com/GNE6bzLbSF — Team Schimel (@TeamSchimel) February 4, 2025 According to the Milwaukee Journal Sentinel, the ad (seen on X above) was released by Schimel’s campaign last month and is airing statewide. It features a photo of a frowning Crawford with her arms crossed and looking sternly at the camera as a narrator describes a sexual assault case and appeal that spanned the late 1990s and early 2000s. The ad claims Crawford bungled the case. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); Schimel’s spokesperson later acknowledged that the photo of Crawford in the ad had been doctored from a portrait of her smiling. Schimel’s campaign edited the image so she looked “ashamed” in the ad. “We edited the photo because we felt it would be disrespectful to the victim, who had already been traumatized by Susan Crawford’s mistake that led to her rapist’s release, to show Susan Crawford smiling when she should be feeling ashamed,” Jacob Fischer, a spokesman for Schimel, says according to the Milwaukee Journal Sentinel. However, in her complaint, Crawford claims that Schimel’s campaign may have used AI to alter her photo — potentially violating a new state law requiring disclosure of AI-edited political ads. Under this law, failing to disclose AI use in a campaign ad could lead to a $1,000 fine. “Schimel’s campaign has admitted to deceptively editing this image, and we urge the Wisconsin Ethics Commission to thoroughly investigate this dishonest and manipulated advertisement,” Derrick Honeyman, a Crawford spokesman, says regarding her complaint. But Schimel’s spokesperson Fischer has denied that Crawford’s image was edited with AI. He says that there is nothing ethically wrong with the photo-editing involved in the ad. “It’s not an AI-generated image,” Fischer tells the Milwaukee Journal Sentinel. Image credits: Header photo via Wisconsin Ethics Commission. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); Law, News, Technology ad, artificialintelligence, photoediting, photoshop PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles All The Inconsistencies and Editing Mistakes in Kate Middleton’s Photo Kate Middleton Apologizes After Admitting Editing Photo That Was Pulled by Major News Agencies Photographer Who Captured Kate Middleton This Week Denies Image is Photoshopped Behind the Viral Photo of Judge Ketanji Brown Jackson’s Daughter /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/04/judges-smiling-photo-was-doctored-to-make-her-look-ashamed/'; this.page.identifier = '782788'; this.page.title = 'Judge&#8217;s Smiling Photo was Doctored to Make Her Look &#8216;Ashamed&#8217;'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
