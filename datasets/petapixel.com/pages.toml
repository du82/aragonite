["https://petapixel.com/2025/03/04/photographer-captures-ultra-rare-white-orca-off-the-coast-of-japan"]
title = "Photographer Captures Ultra-Rare White Orca Off the Coast of Japan | PetaPixel"
description = "A nature photographer in Japan has captured photos and video of a rare white orca, despite some people calling his work fake."
full_description = '''Photographer Captures Ultra-Rare White Orca Off the Coast of Japan Mar 04, 2025 Matt Growcoot A ghostly white orca seen off the coast of Japan. | Tokuyuki Hayakawa A nature photographer in Japan has captured photos and video of a rare white orca, despite some people calling his work fake. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); Tokuyuki Hayakawa specializes in photographing killer whales in the waters off Rausu on the northern tip of Japan. He spends 40 to 50 days per year in the remote region, according to Studio Persol. But last summer, Hayakawa captured something extraordinary: a white orca. “This is the first time I’ve encountered a white orca after 15 years of photographing orcas in Rausu,” the photographer wrote on X. N. Hayakawa Hayakawa says he was stunned to see two cream-colored orcas swimming with 20-30 usual-colored killer whales as the boat he was in struggled to keep up with the pod. “My legs were shaking as I photographed the white orcas I met for the first time,” Hayakawa wrote on Instagram. “[It] looks like a golden-ish cream-colored orca synthesized into a blue sea. I still think it was a dream.” freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); ‘Fake’ However, despite the incredible captures, some online commenters have called out Hayakawa implying that his photos aren’t real. “We have received comments such as ‘Fake?’, ‘Composite?’, ‘Did they make them white with Photoshop?’, but we have done absolutely nothing of the sort,” Hayakawa wrote on Instagram. 2024.6.17 14:46北海道羅臼沖で白いシャチに遭遇しました。2021年に目撃された2頭の白いシャチと同じ個体かもしれません。発見したのは『観光船はまなす』と思われます。私が乗っていたのは『知床ネイチャークルーズ… pic.twitter.com/Fm5AisJFJ3 — 知床ドリーム (@hayakawa0622) June 17, 2024 One of the photos does make the whale look so ghostly that it looks unreal but Hayakawa’s video footage backs up the photo, proving that he really did see a white killer whale. Hayakawa also says he went back in the following days and continued to see the white orcas. It’s uncertain why the whale has creamy skin but The Dodo reports that it may be because of leucism rather than being fully albino because of the whale’s eye color. N. Hayakawa freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); N. Hayakawa “While albinism refers to the complete lack of melanin — the natural pigment that gives skin, feathers, hair, and eyes their color — leucism involves a partial loss of pigmentation,” according to Treehugger. “Animals with albinism are white or pale in color over their entire bodies but also have eyes that are pale, pink, or red in color, while animals with leucism often have partially white or patchy features with darker eyes.” In 2023, a white-colored calf named “Frosty” was filmed off the coast of southern California. And last year, PetaPixel spoke with Machi Yoshida who lives her dream capturing orcas all over the world. More of Hayakawa’s can be found on his Instagram and X/Twitter. Image credits: Photographs by Tokuyuki Hayakawa Features, Spotlight albino, japan, killerwhales, leucism, naturephotography, orca, orcas PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Japanese Photographer is Living Her Dream Capturing Orcas All Over the World Photographer Captures Rare Photos of Orcas Bathed in Light Rays Rare White Killer-Whale Calf ‘Frosty’ Filmed Off California Coast Orcas Hunting Great White Sharks Captured on Camera for the First Time /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/04/photographer-captures-ultra-rare-white-orca-off-the-coast-of-japan/'; this.page.identifier = '782607'; this.page.title = 'Photographer Captures Ultra-Rare White Orca Off the Coast of Japan'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
