["https://petapixel.com/2025/03/04/sound-and-sight-radio-networks-augment-audio-with-compelling-visuals"]
title = "Sound and Sight: Radio Networks Augment Audio With Compelling Visuals | PetaPixel"
description = "Radio remains a powerful storytelling medium that spread vital news around the world. It is especially compelling when combined with photos."
full_description = '''Sound and Sight: Radio Networks Augment Audio With Compelling Visuals Mar 04, 2025 Ken Klein Credit: Photos by Gemunu Amarasinghe, graphics by Amanda Weisbrod / Radio Free Asia If you’re looking for captivating graphics and visuals in news media, check out radio. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); NPR posts The Picture Show. Its online content February 12 featured 10 images by Getty Images photographers (Photos: See what happened at the Westminster Dog Show) Radio Free Europe/Radio Liberty closed the year with this post: How its photographers “captured their best photos of 2024.” Ernie Pyle (1900-1945) was a legendary World War II reporter known for dispatches about ordinary soldiers. NPR won the 2024 Scripps Howard Journalism Award (“Excellence in Narrative Human-Interest Storytelling, honoring Ernie Pyle”). The award announcement highlights the sight-sound combination of modern radio: “NPR reporter Elissa Nadworny and photographer Claire Harbage spent eight months traveling to different countries and continents to share stories of a kindergarten class and its teacher from Kharkiv, Ukraine. The resulting mix of audio, visual, and written reporting told the complicated stories of the children and their families after their classroom shut down, followed by trauma, changes, and fear.” NPR’s award-winning report on the aftermath of friendly fire in Iraq includes photos by Getty Images, Los Angeles Times, Roll Call, Bloomberg, and NPR staff photographers. Broadcaster Edward R. Murrow’s Legacy Since 1971, broadcast media have honored excellence via the Edward R. Murrow Awards, named for the revered journalist. Radio Free Asia (RFA) won a 2024 Murrow Award in the digital category for network radio. RFA’s multimedia report “Under the Gun in Myanmar” examined horrific conditions since a 2021 coup. This award-winning story exemplifies network radio’s use of visuals and audio to deliver engaging information. “Visual storytelling creates crucial entry points to information, making complex, critical news more accessible and engaging,” says H. Leo Kim, Creative Director at RFA. “Our team enhances content with compelling graphics and multimedia.” freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); Most of RFA’s content is delivered digitally via social media, podcasts, and online news. Shortwave radio reaches Myanmar refugee camps and closed-media areas such as North Korea. The Credits RFA’s published credit list for its Murrow Award-winning report names contributors for graphics, writing, video, visual editing, and web page: Where Did the Story Idea Come From? The story idea originated from RFA’s Creative Director Kim and Visual Project Manager Paul Nelson. They initiated an ambitious project to mark the two-year anniversary of the military coup in Myanmar, collaborating with RFA’s Burmese service, while Graphic Designer Amanda Weisbrod played a key role in crafting the data visualizations, according to Kim. Visual Journalist Gemunu Amarasinghe came up with the lead image concept, which involved printing out the faces of each junta member. Amanda Weisbrod handwrote their names and other team members added the images to a cork board with red string. This image, said Kim, captured the essence of the teamwork. RFA’S Kim and Weisbrod and photojournalist Harbage of NPR graduated from Ohio University’s School of Visual Communication. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); Kim is a former staff photographer/multimedia lead at The Virginian-Pilot and Director of Visuals and Creative Content for USA Today Network in Southwest Florida. RFA Creative Director H. Leo Kim | Photo by Gemunu Amarasinghe/RFA Seeing Is Believing Like most media awards, the Edward R. Murrow Award has multiple categories, including writing. Matt Faubion/Alaska Public Media The 2024 Murrow Award for Small Market Radio/Excellence in Writing went to Alaska Public Media for Liz Ruskin’s story on giant pumpkins grown in Alaska. Posted above Ruskin’s award-winning text is a photo of pumpkin grower Dale Marshall maneuvering a huge pumpkin toward a scale. About the author: Ken Klein lives in Silver Spring, Maryland; he is retired after a career in politics, lobbying, and media including The Associated Press and Gannett in Florida. Klein is an alumnus of Ohio University and a member of the Dean’s Advisory Council of the Scripps College of Communication. Professionally, he has worked for Fort Myers News-Press (Gannett), The Associated Press (Tallahassee), Senator Bob Graham, and the Outdoor Advertising Association of America (OAAA). Inspiration, News documentary, News, photojournalism, radio, radiofreeasia PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles MIT Algorithm May Give Us the First Real Image of a Black Hole China Caught Using Syrian War Photos to Denounce U.S. on Afghanistan Canadian Parks Ban Radio Receivers, Blame Overzealous Photographers Clever Photos of People Casting Intricate Shadows With Their Bodies /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/04/sound-and-sight-radio-networks-augment-audio-with-compelling-visuals/'; this.page.identifier = '782981'; this.page.title = 'Sound and Sight: Radio Networks Augment Audio With Compelling Visuals'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
