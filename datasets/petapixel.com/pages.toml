["https://petapixel.com/2024/09/16/rare-lost-bird-of-prey-new-britain-goshawk-is-photographed-for-the-first-time-ever"]
title = "Photographer Captures First-Ever Image of Bird of Prey 'Lost' for 55 Years | PetaPixel"
description = "A wildlife photographer captured the first-ever image of an elusive bird of prey known as the New Britain Goshawk long thought to be lost."
full_description = '''Photographer Captures First-Ever Image of Bird of Prey ‘Lost’ for 55 Years Sep 16, 2024 Pesala Bandara Tom Vierus captured the first-ever photographs of the New Britain Goshawk (above). A wildlife photographer captured the first-ever image of an elusive bird of prey long thought to be lost. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); For 55 years, the New Britain Goshawk, or Accipiter princeps, had not been seen which left many ornithologists to presume the rare bird of prey was lost. As a result, the elusive bird — which had never been photographed before and was only known to science from four specimens — was categorized as “vulnerable” on the IUCN Red List of Threatened Species. However, in March, Fiji-based wildlife photographer Tom Vierus was taking pictures of birds on the island of New Britain in Papua New Guinea on an expedition with The World Wide Fund for Nature (WWF). Unbeknownst to the photographer at the time, as he was shooting pictures, he managed to capture the first-ever image of the New Britain Goshawk. “I was on a scoping trip with WWF in Pomio [eastern New Britain], with three members of the local community guiding us through the forest, so we could better understand the presence of species,” Vierus says in a press release. “I photographed several bird species, including the New Britain Goshawk, but wasn’t aware of the significance at the time.” freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); ‘A Great Surprise’ Internationally-renowned ornithologists later confirmed that Vierus had got the first-known photograph of the bird species which had not been seen in over half a century. “It was such a great surprise to hear that this photo seems to be the first-ever of this ‘lost species’!” Vierus says. “It is wonderful to see how conservation photography can help in safeguarding areas by documenting the existing biodiversity and also a good reminder of how important visual storytelling is. “I truly hope this mostly pristine part of the world can remain as intact as possible with the help of the local communities, their already existing conservation initiatives and the support of WWF.” Vierus photographed the bird in forests that are part of the Nakanai Ranges, a rugged and remarkably biodiverse expanse of green-dotted mountains that form a section of the Sublime Karsts of Papua New Guinea, a tentative UNESCO World Heritage site. “The last documented scientific record of the [New Britain Goshawk] species appears to be a July 1969 specimen that is kept in the American Museum of Natural History in New York, USA,” John Mittermeier, Director of the Search for Lost Birds at American Bird Conservancy, says confirming the photographed bird as the New Britain Goshawk. “While there have been multiple sight-only records in the intervening years, the New Britain Goshawk seems to have eluded photo, sound, and specimen documentation for 55 years.” Image credits: All photos by WWF-Pacific/ Tom Vierus. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); News, Spotlight birdphotographer, lostspecies, wildlifephotography PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Hawk Attacking Water Balloon at 4000FPS Makes for Some Incredible Footage Rare Bird Not Seen for 140 Years Caught on Camera for First Time Photographer Captures Bird Stealing Baby Alligator From its Mother Photographer Captures Incredible Battle Between Hawk and Owl /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2024/09/16/rare-lost-bird-of-prey-new-britain-goshawk-is-photographed-for-the-first-time-ever/'; this.page.identifier = '759249'; this.page.title = 'Photographer Captures First-Ever Image of Bird of Prey &#8216;Lost&#8217; for 55 Years'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
