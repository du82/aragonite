["https://petapixel.com/2025/03/04/the-aurora-lights-could-put-on-a-dazzling-display-tonight-march-2025"]
title = "The Aurora Lights Could Put on a Dazzling Display Tonight | PetaPixel"
description = "Aurora lights could illuminate the skies as far south as New York tonight providing a wonderful opportunity for photographers."
full_description = '''The Aurora Lights Could Put on a Dazzling Display Tonight Mar 04, 2025 Matt Growcoot Aurora lights could illuminate the skies as far south as New York tonight, providing a wonderful opportunity for photographers. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); A massive blast of plasma and magnetic field from the Sun’s corona, known as a coronal mass ejection (CME), on March 1 is hurtling toward Earth and it has the potential to create a geomagnetic storm that results in a show of northern lights. Space.com reports that NOAA’s Space Weather Prediction Center predicts that the CME will graze Earth’s magnetic field on March 4 or 5. That has the potential to trigger a G1-class geomagnetic storm, the weakest category of geomagnetic storm, but still powerful enough to amplify the aurora borealis. However, space weather physicist Tamitha Skov says that G2 storm conditions may also come to pass. “Expect G1 to G2 storm conditions by March 5,” Dr. Tamitha writes on X (formerly Twitter). “Aurora may be visible down to mid-latitudes where skies are clear.” A partially Earth-directed #solarstorm is coming! Expect G1 to G2 storm conditions by March 5. #Aurora may be visible down to mid-latitudes where skies are clear. HF radio operators, GPS users, & drone pilots expect degraded signal performance, especially on Earth's nightside. pic.twitter.com/K5a72ouv8a — Dr. Tamitha Skov (@TamithaSkov) March 3, 2025 freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); If the lights do not materialize tonight, then keen photographers should keep checking the weather report as the colorful hues may show up on Wednesday night instead. NOAA’s forecast suggests that geomagnetic activity is expected to peak late on March 4 and into the early hours of March 5. The lights might be seen as far south as New York or Idaho. For anyone in a northern latitude, it may well be worth looking up at the sky tonight. Why Do Geomagnetic Storms Cause Auroras? Geomagnetic storms cause auroras by energizing and exciting particles in Earth’s atmosphere when charged solar particles collide with the planet’s magnetic field. Helping these storms is the Sun’s 11-year cycle — which is currently close to solar maximum — meaning there are currently more CMEs and more geomagnetic storms. That’s why it is worth keeping an eye out if you’re interested in snapping a photo of the auroras. In May last year, the northern lights shone spectacularly across North America and Europe. Image credits: Header photo licensed via Depositphotos. News, Space astrophotography, aurora, aurora borealis, nighttimephotography, northernlights PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Photographers on Alert After Strong Aurora Lights Predicted This Week Stunning Photos of the Aurora Lights Seen as Far South as New Mexico Photographer Shocked to See Northern Lights from Southern California PSA: Tonight Could Be a Great Chance to Photograph Auroras /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/04/the-aurora-lights-could-put-on-a-dazzling-display-tonight-march-2025/'; this.page.identifier = '782885'; this.page.title = 'The Aurora Lights Could Put on a Dazzling Display Tonight'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
