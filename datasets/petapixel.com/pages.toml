["https://petapixel.com/2025/01/02/panasonic-dc-zs99-review-a-disappointing-trend-chaser"]
title = "Panasonic DC-ZS99 Review: A Disappointing Trend Chaser | PetaPixel"
description = "The Panasonic ZS99 is hardly an innovative product and even takes a step back for every step forward. Is the whopping zoom range enough to win new users?"
full_description = '''Panasonic DC-ZS99 Review: A Disappointing Trend Chaser Jan 02, 2025 Chris Niccolls Here, we thought that the smartphone would kill the point-and-shoot digital camera. There is, instead, a steady resurgence with more and more (mostly young) people purchasing used point-and-shoot cameras. The Panasonic ZS99 aims to capitalize on the trend, offering a modernized take on an older P&S model. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); I think there are only two reasons to buy a point-and-shoot digital camera and expect a different result from a smartphone. Smartphones take stunningly good images as far as image quality goes relative to their tiny sensor sizes, so you either get a camera with a significantly larger sensor than a phone or get one with a much bigger telephoto zoom range. The Panasonic ZS99 is a brand-new design that seeks to do the latter. With the ZS99 available for $499, is its larger zoom range worth the price of admission? The ZS99 looks exactly like the older ZS80. This is good because they were always a refined and classy-looking camera series. Panasonic DC-ZS99 Review: How it Feels The ZS99 is essentially a rehash of the older ZS80. It borrows its appearance and many components, including the lens and sensor assembly, from the ZS80. The sensor is a relatively small Type 1/2.3 20-megapixel chip, probably the same sensor we have seen in multiple Panasonic point-and-shoots for years. We get the excellent 30x zoom lens from the ZS80, which provides a full-frame equivalent range of 24-720mm. Compared to a smartphone, this gives a considerable reach advantage over even a 10x telephoto camera, and most phones only feature a 3x or 5x telephoto. The grip is sufficient, and the camera is very pocketable, with no significant changes in overall look from its predecessor. The camera still has the same 3-inch 1.84-million dot LCD panel, which flips up above the camera into selfie mode. The battery is still a classic Panasonic BLG-10PP type, and the camera has a single UHS-I SD slot. Very little has changed over the years. The back panel flips up in one direction only. This is great for selfies but not much else. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); Sadly there is no EVF located on the ZS99. It used to sit in the top-left corner, and I’m sad to see it go. At least the USB connection is now a modern type-C, which complies with worldwide regulations, and the Bluetooth is now 5.0 compliant. However, this comes with a major loss as the EVF that graced the ZS80 has been removed. I consider this a huge oversight as the back LCD panel is not ideal in bright conditions and we lose the ability to bring the camera up against the face when shooting the maximum telephoto ranges to stabilize the whole platform. I constantly hear that younger generations of photographers who are used to shooting phones at arm’s length don’t care about EVFs. But this doesn’t give new shooters enough credit. Anyone who tries one will surely come to use it more often and will miss it sorely if it ceases to exist on future models. They may not know what they are missing, but that doesn’t mean they will eventually fail to appreciate the omission. We now have a modern USB-C port on the camera. The camera can also connect wirelessly to a phone via Bluetooth or Wi-Fi. I mostly spent the day looking for nice natural light and the warmth of winter sunlight. Color is vibrant and pleasant overall. I’ve always liked the color palette of Panasonic cameras. Panasonic DC-ZS99 Review: How it Shoots I always get a tinge of nostalgia when I review a compact camera. I grew up selling these products, and I treasure the opportunity to test them again all these years later. However, a big part of the nostalgic feeling is due to the cameras being essentially the same as the original models, making the overall experience a genuinely vintage one. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); To its credit, though, the ZS99 utilizes Panasonic’s DFD contrast-based autofocusing, which is snappy and precise. The camera is swift, too, and the shutter release feels good. The zoom operates with a basic rocker switch around the shutter and zooms the lens with adequate haste. There is a manual control command dial, and the ZS99 has both a front and rear dial to change settings. I could never get tight compositions like this at a distance with a smartphone. Cropping heavily on a phone will throw all semblance of detail away. The ZS99 is a convenient walk-around camera with an enormous zoom range in a small package. The lens is sharp enough for the 20-megapixel sensor but tends to flare slightly from bright light sources. I often found myself shielding the front element with my left hand in order to prevent heavy ghosting in the image. The sensor is prone to some reflections as well when pointed at the Sun. The ZS99 offers a RAW file format, but the small sensor in this camera does not deliver much dynamic range. Similarly, the ZS99 also has full manual control, but the aperture range is limited to f/8, and diffraction softens the image significantly. The depth of field doesn’t change that much either, and although shutter speeds can be set slower, there is no option for filters to help accommodate longer exposures. This is all to say that although the ZS99 does offer some creative control, there isn’t much incentive to use it, and it will probably be avoided by most users. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'petapixel_MPU', slotId: 'petapixel_MPU_3' }]); }); Video is unchanged from before, which means it is records 4K video, but only at 30 frames per second. If you are okay with lower-resolution slow motion, you caokay 60fps at 1080p and 120fps at 720p. The ZS99 has a huge zoom range, but it’s not a bright lens by any stretch. If you try to match on a smartphone what the ZS99 can do with its lens, you’ll be disappointed. The lens will flare and ghosts will appear all over the frame in bright conditions. The sensor will also reflect a rainbow pattern towards the sun. Image quality is not why people buy these cameras, although there is a certain classic charm to the vintage look of these older sensors. Colors are nice overall, but skin tones tend to take on a waxy look, and the images are over-sharpened across the board. A modern smartphone’s main camera will take a better photo in most situations, especially when it comes to dynamic range. Although a smartphone controls the look of the depth of field in a largely artificial way, especially when shooting portraits, the results are far more usable nowadays, and the ZS99 can’t come close. However, The ZS99 does a better job when competing with the 5x lens on most phones and easily dominates when the zoom is pushed anywhere beyond that mark. The ZS99 is an excellent picture taker because of its telephoto reach, and its main strength is the versatility it offers while still fitting in a pocket. Don’t worry about trying to get nice sunstars or anything. The ZS99 has some creative control, but most will use it as an automatic camera. Lots of depth of field whether you want it or not. Unlike a phone, there is no way to digitally blur the background in the camera. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_4' }]); }); Letting the shadows go dark is fine. Boosting them would be an issue with a lot of digital noise added. Panasonic DC-ZS99 Review: A Lazy Experience Panasonic is not the only one that has been guilty of rereleasing an old product with a few changes and a new name. The demand for compact digital cameras is rising, and it makes sense to modernize the products to meet the demand. Major improvements require money and extensive R&D, so it is understandable that most manufacturers are simply rehashing the back catalog. Still, I would be far more excited to see new camera designs that offer substantial improvements to image quality and functionality. Connectivity is more important than ever, but the ZS99 interfaces with a phone in much the same way the older cameras did before, so no fundamental changes there. We are left with a camera that complies with the latest USB standards but loses a significant piece of hardware, all at a $499 price, equivalent to what the older products sold for. It could be that my perspective is outdated, though, and that new users won’t care or even desire the things I wish the ZS99 had. I would buy the older ZS80 used and get the same image quality and versatility without having to give up the EVF. The ZS99 does what it is designed for well. I wish it did a little more. The shutter is very responsive on the ZS99, which makes the timing of shots more predictable and effective. Wildlife is certainly within reach of the ZS99 lens. The built-in IBIS does a good job of steadying the camera. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_5' }]); }); Are There Alternatives? The only real path to get the same kind of zoom range in a small package is the used market. The older Panasonic ZS80 or even ZS70 will provide the same lens and sensor assembly plus the addition of an EVF to compose with. The Nikon Coolpix A1000 is less detailed and slightly bulkier, but it does give a longer 35x zoom lens. I just liked the simple composition and play of light in this photo. Skin tones are okay, but any highlights can block up real quick. Luckily, I had soft, natural light for this portrait. Should You Buy It? No. I don’t think the ZS99 is desirable, but I’m probably out of touch. If you want a new camera that beats a smartphone’s zoom range handily, the ZS99 is your best bet. Equipment, Reviews cameravssmartphone, nikoncoolpixa1000, panasonicdczs99, panasonicdxzs70, panasonicdxzs80, pocketcamera, pointandshoot, pointandshootcamera, smartphone, travelcamera, vintagecamera PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Panasonic Recommits to the Point-and-Shoot with the New ZS99 This Isn’t the Compact Camera Revival We Asked For | The PetaPixel Podcast Point and Shoot Cameras are Basically Dead Panasonic in 2024: A Little Bit of Everything /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/01/02/panasonic-dc-zs99-review-a-disappointing-trend-chaser/'; this.page.identifier = '774234'; this.page.title = 'Panasonic DC-ZS99 Review: A Disappointing Trend Chaser'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
