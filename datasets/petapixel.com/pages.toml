full_description = '''Nothing Phone 3a Series Features Upgraded Cameras and Unique Styling Mar 04, 2025 Jeremy Gray Nothing, known for its aesthetically-stripped-down smartphones announced the Nothing Phone 3a and Nothing Phone 3a Pro, successors to 2023’s Nothing Phone 2. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); The new Nothing Phone 3a Pro, stylized Phone (3a) Pro, sports an upgraded camera system. With its mid-range $459 price tag, the handheld delivers relatively solid specifications and features on paper. At the heart of the rear triple camera array is a 50-megapixel Type 1/1.56 sensor paired with a 24mm equivalent f/1.9 aperture. This main camera is flanked by a 50-megapixel periscope camera with a Sony Lytia 600 Type 1/1.95 sensor and a 70mm equivalent lens. This 3x optical zoom lens also features 6x digital “lossless” zoom and 60x ultra zoom. The third camera is the ultra-wide module, which is a relative outlier. It has just eight megapixels of resolution and a small Type 1/4 sensor. The 15mm equivalent lens delivers 120 degrees of field of view. The Nothing Phone 3a Pro features a new triple camera system freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); At $459, the Nothing Phone 3a Pro competes against products like the $600 iPhone 16e and its single 48-megapixel rear camera and OnePlus 13R smartphones, which, like the 3a Pro, features 50-megapixel main and telephoto cameras and an eight-megapixel ultra-wide camera. The vanilla Nothing Phone 3a, which costs a budget-friendly $379, differs significantly from its Pro sibling regarding cameras. The standard 3a has the same 50-megapixel main camera and ultra-wide unit, but trades in an inferior 2x telephoto lens (50-megapixels, Type 1/2.74). The Nothing Phone 3a also features a 32-megapixel f/2.2 front-facing camera, while the 3a Pro instead sports a 50-megapixel unit for selfies. The Nothing Phone 3a has a different camera system than the 3a Pro Both phones feature the same 6.77-inch OLED screen, Snapdragon 7S Gen 3 chips, 12GB of RAM, and 256GB of storage. The screens deliver 120Hz variable refresh rates and peak brightness up to 3,000 nits, significantly brighter than the Phone 2a. Each also promises, in typical 2025 fashion, to incorporate a lot of artificial intelligence (AI). For mobile photographers, the phones utilize AI algorithms and processing to deliver HDR images (Ultra XDR, technically, which combines eight RAW captures into a single frame), more accurate skin tones, better night photos, and improved saturation and contrast. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); Nothing Phone 3a Pro features AI also powers a new Essential Space, which is where users can store and organize whatever information they care most about, whether that’s photos, notes, documents, or other files. Users can access this with a press of a new Essential Key on the phone. The Nothing 3a and 3a Pro are available to order now for $379 and $459. The standard 3a starts shipping next week on March 11, while the 3a Pro arrives a bit later on March 25. Image credits: Nothing Mobile, News mobile, nothing, nothingphone3a, nothingphone3apro, smartphone PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Sleek and Stylish Nothing Phone 2 Has Upgraded 50MP Cameras Nothing’s Phone 1 Has Unusual ‘Glyph’ Interface and Dual 50MP Cameras The Nothing Phone Has Over 175,000 Pre-Orders Despite No Details Nothing’s Community-Designed $400 Smartphone Glows in the Dark /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/04/nothing-phone-3a-series-features-upgraded-cameras-and-unique-styling/'; this.page.identifier = '782914'; this.page.title = 'Nothing Phone 3a Series Features Upgraded Cameras and Unique Styling'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
