title = "Polaroid's Now Generation 3 Cameras Promise Better Instant Photos | PetaPixel"
description = "The Polaroid Now Generation 3 Instant Cameras promise improved image quality thanks to better metering and autofocus."
full_description = '''Polaroid’s Now Generation 3 Cameras Promise Better Instant Photos Mar 04, 2025 Jeremy Gray Polaroid’s new Now Generation 3 and Now+ Generation 3 Instant Cameras promise sharper instant photos across varied lighting conditions. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); Starting with the standard Polaroid Now Generation 3, it is Polaroid’s classic analog instant camera offering. Compared to its predecessor, the aptly named Now Generation 2, and PetaPixel‘s pick for the “Best Classic Instant Camera,” the new model features a better light meter position, improved ranging sensor, and an upgraded two-lens autofocus system. The camera features a built-in tripod mount, works alongside filters, and features self-timer and double-exposure modes. “All in a classic Polaroid look made with 40% recycled materials,” the company explains. The Polaroid Now Generation 3 offers six usable apertures ranging from f/11 to f/64, and the lens has optical grade PC and acrylic materials. Autofocus is provided via two fixed zones (0.4 to 1.3 meters and one meter to infinity). The camera weighs about 450 grams (15.8 ounces) and works with Polaroid i-Type and 600 film. The camera features a custom-designed shutter system with a precision step motor for accurate exposures. The Polaroid Now Generation 3 Instant Camera comes in six colors: Graphite, Purple, Arctic Blue, Yellow, Pebble, and Coral The Polaroid Now Generation 3 comes in six colors (Graphite, Purple, Arctic Blue, Yellow, Pebble, and Coral) and is $120. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); The new Generation 3 Polaroid cameras promise improved image quality thanks to better exposure metering and improved autofocus. The Polaroid Now+ Generation 3 Instant Camera resembles the standard Now camera. It features the same upgraded sensors and autofocus system as its sibling and the same lens, but it adds Polaroid app connectivity so that users can connect to the camera with their smartphone and remotely control it. The Now+ features a built-in battery that recharges via USB-C to power this wireless connectivity. The Polaroid Now+ Generation 3 differs from its $20 cheaper sibling by offering wireless connectivity with a smartphone using the Polaroid app The Polaroid Now+ Generation 3 is $140, a $20 premium over its sibling, and comes in four colors. The Polaroid Now Generation 3+ sports a unified color design and a light-up “plus” button on its front. It comes in four colors: White, Coral, Arctic Blue, and Black Polaroid i-Type film comes in color and black and white varieties and starts at $16.99 per pack, which includes eight exposures. Polaroid also offers triple packs, which offer a savings of $1 per pack. Polaroid color and black and white 600 film, which differs from i-Type thanks to its included battery that is not needed for either of the new cameras, is $19.99 per pack. Image credits: Polaroid freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); Analog, Equipment, News analog, film, instantcamera, instantfilm, polaroid, polaroidcamera, polaroidinstantcamera, polaroidnowgeneration3, polaroidnowplusgeneration3 PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles Polaroid Launches Polaroid Go, The Smallest Analog Camera in the World Polaroid’s Latest Collab Puts Vintage Spin on a Modern Instant Camera Polaroid’s New I-2 is a $600 Instant Camera Packed with Features Documentary Takes an Intimate Look at the Last Year of the Polaroid Instant Era /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/04/polaroids-now-generation-3-cameras-promise-better-instant-photos/'; this.page.identifier = '782822'; this.page.title = 'Polaroid&#8217;s Now Generation 3 Cameras Promise Better Instant Photos'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
