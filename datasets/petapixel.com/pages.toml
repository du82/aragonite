["https://petapixel.com/2024/09/11/balthazar-korabs-stunning-photos-of-the-world-trade-center-twin-towers"]
title = "Balthazar Korab's Stunning Photos of the World Trade Center | PetaPixel"
description = "These incredible photos of the World Trade Centers were taken by Balthazar Korab who was commissioned by the Twin Towers' architects."
full_description = '''Balthazar Korab’s Stunning Photos of the World Trade Center Sep 11, 2024 Matt Growcoot These incredible photos of the World Trade Center were taken by Balthazar Korab who was commissioned by the Twin Towers’ architects to document the buildings. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); Twenty-three years after the towers were destroyed in the September 11 attacks, Korab’s photos taken in the mid-1970s act as important documentation. Korab’s archive is now housed by the Library of Congress which has digitized over 800 of his photographs but waiting to be worked on is a further half a million negatives. World Trade Center, New York, New York. View from below with St. Nicholas Greek Orthodox Church in foreground, 1976. Twilight view from the harbor, 1976. Entrance arches with Sphere at Plaza Fountain sculpture, 1976. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); Night view of the World Trade Center, 1976. View from the plaza, 1976. Single tower with Cloud Fortress and Sphere at Plaza Fountain sculptures, 1976. The World Trade Center with Brooklyn Bridge in front, 1976. Entrance arches with Ideogram sculpture, 1976. World Trade Center, New York, New York. Plaza. Aerial view with Sphere at Plaza Fountain sculpture, 1976. Aerial view with Sphere at Plaza Fountain sculpture and Hudson River, 1976. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); View from a New York street, 1978. Overhead view of the Entrance Sphere at Plaza Fountain sculpture, World Trade Center, New York, New York, 1976. Entrance arches with Sphere at Plaza Fountain sculpture, World Trade Center, 1976. Architect Minoru Yamasaki with a model of the World Trade Center, circa 1970s. Who Was Balthazar Korab? Korab was a Hungarian-American architectural photographer who trained as an architect in Paris and later combined his deep understanding of buildings with an artist’s eye for composition, light, and texture. “I am an architect with a passion for nature’s lessons and man’s interventions” was how Korab described himself, according to a 2013 New York Times obituray. “My images are born out of a deep emotional investment in their subject.” Korab arrived in the United States in 1955 and found employment with Eero Saarinen who commissioned him to document the architectural design process. It was this that gave him a break and he made a name for himself as one of the country’s top architecture photographers. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'petapixel_MPU', slotId: 'petapixel_MPU_3' }]); }); Keenly aware that buildings are made to interact with people, he would often include humans and natural elements in his pictures. “Korab’s portfolios contain frequent sharp reminders that architecture is always entangled in broader cultural circumstances within which it is created and by which it is transformed,” wrote John Comazzi, an associate professor of architecture at the University of Minnesota, in Balthazar Korab: Architect of Photography. The Library of Congress received a selection of his photographs relating to the work of Eero Saarineni in 2007 and Korab’s entire archive was transferred in 2011. It contains 530,000 photos shot across six decades on 35mm and 4×5 inch negatives. Analog, Features, Spotlight 9/11, balthazarkorab, history, newyork, twintowers, worldtradecenter PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles 20-Year Timelapse of the World Trade Center Took 13.3 Million Photos Unseen Photos of 9/11 Attacks Found in Old Photo Album 1970s Photos of Lower Manhattan Revealed America’s Decay Photo Series Focuses on the Expressions of Visitors at the WTC Site /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2024/09/11/balthazar-korabs-stunning-photos-of-the-world-trade-center-twin-towers/'; this.page.identifier = '758628'; this.page.title = 'Balthazar Korab&#8217;s Stunning Photos of the World Trade Center'; }; Discussion Load Comments Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x250_BTF_EndOfPosts", slotId: "PetaPixel_300x250_BTF_EndOfPosts" });'''
