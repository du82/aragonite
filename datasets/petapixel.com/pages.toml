["https://petapixel.com/2025/03/05/new-bbc-series-shines-a-light-on-wildlife-photographers"]
title = "New BBC Series Shines a Light on Wildlife Photographers | PetaPixel"
description = "The BBC is launching two new wildlife series which follows photographers who are passionate about capturing the beauty of planet Earth."
full_description = '''New BBC Series Shines a Light on Wildlife Photographers Mar 05, 2025 Matt Growcoot Photographer Nicole Carneiro (left) who features in the first episode which follows her as she captures photos of rare birds, such as this toucan (right), in Brazil’s Atlantic Forest. The BBC is launching two new wildlife series which follows photographers who are passionate about capturing the beauty of planet Earth. The first episodes have already been released. freestar.config.enabled_slots.push({ placementName: "PetaPixel_728x90_ATF_Desktop", slotId: "PetaPixel_728x90_ATF_Desktop" }); freestar.config.enabled_slots.push({ placementName: "PetaPixel_300x600_300x250_320x50_Mobile", slotId: "PetaPixel_300x600_300x250_320x50_Mobile" }); In Search of Nature and Framed in Nature are both going out on YouTube. The BBC Earth Explore and BBC Earth channels will host the six-to-eight-minute episodes released each week. One of the episodes will follow Rylee Jensen (pictured) as she visits Montana. The docuseries will follow six photographers as they capture diverse locations from Brazil’s Atlantic Forest to the snowy tundra of Yellowstone National Park, and from the coastal islands of South Carolina to the extraordinary underwater worlds in a Kenyan Marine Park. Each episode showcases the unique perspectives of local photographers and videographers. The first episode, released yesterday, follows 27-year-old wildlife photographer Nicole Carneiro as she tracks rare birds in Brazil’s Atlantic forest. Carneiro walks the viewer through her technical settings and what kind of photo she is looking for. Once she’s captured a photo, she explains her editing process and even shares her Photoshop settings. freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static' }]); }); The two series are being produced by Aurora Media Worldwide and All3Media company. “Rather than flying in an external production crew, we wanted to empower local photographers and videographers to document their world and the wildlife in it,” says Chief Content Officer of Aurora Media Worldwide Dominique Cutts. “What has emerged is an extraordinarily vibrant, intimate, and diverse series that has taken us from the snowy valleys of Yellowstone to the coral reefs of Kenya and the tea plantations of India without ever leaving our production office in London.” Director of Content at BBC Studios Digital Brand Chris Allen adds that “we are proud to celebrate and spotlight a new generation of photographers who are capturing the beauty of their local wildlife and recognise the importance of preserving and sharing it with the world.” freestar.queue.push(function(){ freestar.newAdSlots([{ placementName: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static', slotId: 'PetaPixel_728x90_300x250_BTF_Instream-posts-full_static_2' }]); }); “Their work offers a striking glimpse into the incredible diversity of global wildlife and the unique techniques that drive their craft,” he adds. News, Spotlight bbc, bbcearth, brazil, documentary, photographydocumentary PetaPixel articles may include affiliate links; if you buy something through such a link, PetaPixel may earn a commission. Related Articles BBC Offers Nature Photo Masterclasses This ‘Blue Planet II’ Prequel is a Feast for the Eyes BBC Uses Creepy Animal Spy Cameras to Get Close-Up Shots of Wildlife BBC Set to Air Photography Show Inspired by the Great British Bake-Off /** * Disqus Comment thread variables * @see https://disqus.com/admin/universalcode/#configuration-variables */ window.disqus_config = function () { this.page.url = 'http://petapixel.com/2025/03/05/new-bbc-series-shines-a-light-on-wildlife-photographers/'; this.page.identifier = '782997'; this.page.title = 'New BBC Series Shines a Light on Wildlife Photographers'; }; Discussion Load Comments Please enable JavaScript to view the <a href=