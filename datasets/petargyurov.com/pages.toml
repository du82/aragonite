title = "My Books | Petar Gyurov"
full_description = '''My Bookshelf At the start of 2022 I set myself a goal to get into the habit of reading. Following the advice from Atomic Habits, I decided to chain this new habit to an existing one: drinking my morning coffee. It has worked tremendously well. It also helps that my work does a montly book club which encourages me to read at least 1 book a month. Since I mostly read on an e-reader (and sometimes listen to audiobooks), I thought that creating a virtual bookshelf of sorts might be a fun exercise. The following is mostly pure CSS and HTML, with a little bit of Javascript to add randomisation. If you want to incorporate this into your own website you can find the repo here. 2023 The Knife of Never Letting Go PN Alchemy RS Imperium RH Roadside Picnic SS 2022 The Joy of Small Things HP Old Man's War JS American Gods NG The Ninth Metal BP The Gone World TS The Unfolding of Language GD Rich Dad Poor Dad RK The Picture of Dorian Gray OW Spin RW The Road CM The Spy Who Came in from the Cold JC The Anthropocene Reviewed JG Atomic Habits JC Bullshit Jobs DG Dune FH Inspector Calls JP Kaiju Preservation Society JS Klara and the Sun KI Permutation City GE The Curious Incident of the Dog in the Night Time MH 2021 Blink MG Freakonomics SL The Scout Mindset JG 2019 Demon Cycle - Barren PB Demon Cycle - Great Bazaar & Brayan's Gold PB Demon Cycle - Messenger's Legacy PB Other Minds PG The Chronoliths RW The Subtle Art of Not Giving a Fuck MM TWoT - The Eye of the World RJ 2018 Demon Cycle - The Painted Man PB Demon Cycle - The Desert Spear PB Demon Cycle - The Daylight War PB Demon Cycle - The Skull Throne PB Demon Cycle - Core PB Sapiens YH The Ocean at the End of the Lane NG Dark Matter BC function getRandomInt(min, max) { min = Math.ceil(min); max = Math.floor(max); return Math.floor(Math.random() * (max - min + 1)) + min; } function randomChoice(array) { return array[Math.floor(Math.random() * array.length)]; } let spines = Object.values(document.getElementsByClassName("spine")); let covers = Object.values(document.getElementsByClassName("cover")); let tops = Object.values(document.getElementsByClassName("top")); let availablePatterns = ["argyle", "tartan"]; // we could probably get these programatically let availableColours = [ "maroon", "darkgreen", "darkolivegreen", "brown", "saddlebrown", "sienna", "midnightblue", ]; // assign a random height, pattern and colour to each book spines.map(function (s, i) { let randomHeight = getRandomInt(220, 290); s.style.height = `${randomHeight}px`; s.style.top = `${280 - randomHeight}px`; let randomPattern = randomChoice(availablePatterns); s.style.backgroundImage = `var(--${randomPattern})`; let randomColor = randomChoice(availableColours); s.style.backgroundColor = randomColor; covers[i].style.height = `${randomHeight}px`; covers[i].style.top = `${280 - randomHeight}px`; tops[i].style.top = `${280 - randomHeight}px`; });'''
