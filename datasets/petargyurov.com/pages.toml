["https://petargyurov.com/about"]
title = "About Me | Petar Gyurov"
full_description = "About Me I am multidisciplinary dev who likes to dabble in everything, from design and art to backends and Dev Ops. I studied Theoretical Physics at university and have almost a decade of experience in software development. I like learning new things and working on problems that matter 🌳 I love working with Flask. I also use Figma for all my designs, slides, etc. In my spare time I like doing BJJ, coding for fun, film photography, gaming and snowboarding. I am a native Bulgarian and English speaker and I am currently learning Spanish. Keen AI 2021 - present Technical Lead Python, PyTorch, Javascript, MySQL/PostgreSQL, Docker, GCP At Keen AI we build custom computer vision solutions, typically in the energy transmission and distribution space. We identify objects, defects and data patterns and build meaningful platforms around this data. I provide technical oversight on all projects, guiding our team of devs on the architecture of each product, all the way from design to production release. The Big Wild Jul 2021 - Feb 2022 Machine Learning Developer (Volunteer) C++, Python I helped The Big Wild prototype an object detector and landmark detector for polar bears which is part of a bigger pipeline that will eventually be able to distinguish individual polar bears using face detection. The aim is to tackle the difficulties faced in polar bear tracking by providing a less invasive and less resource consuming alternative. New Zealand Department of Conservation Dec 2020 - Mar 2021 Software Developer (Volunteer) Python, Tensorflow, ElectronJS, Svelte Developed Megadetector GUI, an open source, AI-assisted solution for labeling and sorting camera trap images. The desktop application is an integral part of the data processing pipeline for conservation scientists working to save endangered species. Makely Aug 2019 - Dec 2020 Founder Python, React, PostgreSQL, Docker, AWS Makely is (was) a 3D printing platform that connects everyday people to 3D printing enthusiasts and hobbyists, allowing them to print their ideas with virtually zero knowledge of the tech. After not gaining much traction and re-evaluating my strategy, I decided to shut down the project. Splash Damage Aug 2017 - Aug 2019 Backend Engineer Python, Golang, C#, PostgreSQL, Docker, Kubernetes, AWS Developed the backend for the PC game Dirty Bomb and an another unannounced project. The live-service nature of the games required the backend(s) to be flexible, with low overhead on new features and reliable scaling. Improved the player sentiment analysis using a Naive Bayes classifier. Prototyped an analytics pipeline to handle high-throughput events for all of the company's titles. Præsto Consulting Feb 2016 - May 2017 Technical Consultant Python, Javascript, SQL Configured BI pipelines and developed custom data visualisations for large businesses such as Schneider Electric, Britvic and Madison Square Garden. Worked with a variety of large datasets, conceptually ranging from financial evaluations to athlete performance data. Echogroup Aug 2014 - Sep 2014 Junior Software Developer Python, Excel Developed a bespoke spreadsheet management software package from the ground up to handle the company’s customer information and automate the task of mailing batch and individual journals. Includes standard features such as refined searching and amending data, as well as unique and personalised sorting and comparison algorithms, encapsulated in a sleek and easy to use GUI. Royal Holloway, University of London 2012 - 2015 BSc Theoretical Physics, 1st Class Honours Python, C++ For my major project I simulated a Josephson Bifurcation Amplifier with a side exploration into the Nyquist–Shannon Sampling Theorem. Simulation written in C++ and data visualisation with Python. Top"
