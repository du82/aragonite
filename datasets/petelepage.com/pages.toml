["https://petelepage.com/blog/2020/06/github-ssh-and-2-factor-auth"]
title = "GitHub SSH and 2-factor auth | Pete LePage"
description = "I hate that using SSH & 2-factor auth means I have to auth even for for a git pull. But there’s an easier way! Change the remote used for fetch to the HTTPS url. First, verify that both push/fetch are using SSH by running git remote -v it should output something like: origin  git@github.com:petele/squoosh.git (fetch)origin  git@github.com:petele/squoosh.git (push) Then use git remote set-url origin <https url> to set the remote URL for fetch to the HTTPS url. Your repo will now push via SSH and pull via..."
full_description = "GitHub SSH and 2-factor auth By Pete LePage / On June 24, 2020 / In web development Tagged github2fareminder I hate that using SSH & 2-factor auth means I have to auth even for for a git pull. But there’s an easier way! Change the remote used for fetch to the HTTPS url. First, verify that both push/fetch are using SSH by running git remote -v it should output something like: origin git@github.com:petele/squoosh.git (fetch)origin git@github.com:petele/squoosh.git (push) Then use git remote set-url origin <https url> to set the remote URL for fetch to the HTTPS url. Your repo will now push via SSH and pull via HTTPS, and it won’t require the extra 2-factor auth to pull. Now, after running git remote -v I get… origin https://github.com/petele/squoosh.git (fetch)origin git@github.com:petele/squoosh.git (push) Share this Share Next Testing QuotaExceededError by simulating a small disk Previous Books I'm reading"
