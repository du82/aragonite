full_description = "Change to Daylight Savings Time? By Pete LePage / On July 20, 2005 / In general Tagged MSDNBlogPost Did anyone else miss this? Or am I the only one? From CBC _Currently in Canada and the U.S., daylight time runs from April through October. The exception in Canada is Saskatchewan, which keeps its clocks the same throughout the year. _ _RELATED STORY: U.S. moves to extend daylight time _ The American change, due to take effect this autumn if U.S. President George W. Bush signs it into law, could cause headaches for Canadians during March and November, the two months the two countries would be out of sync. Yay for extra daylight, but it is going to be a little weird! Share this Share Next Too Many Domains Previous Night and Low Light Colour Photography"
