description = "Well, hopefully it’ll be near you - if not, let me know in the comments where you are so we can try to get some more of these events set up! Google is holding a few developer focused hack-a-thons around the US and would like to invite you to attend. At these events, we will be covering some of the latest and greatest features of HTML5, Chrome Web Store and In-App Payments. You will learn about the end to end flow of building a web app, distributing the app and monetizing it using these APIs. You will also..."
full_description = "HTML5 Hack-A-Thon Coming To A City Near You By Pete LePage / On July 20, 2011 / In web development Tagged ConferencesCSS3HTML5HTML5 For Web DesignersChrome Web StoreHackAThonInAppPayments Well, hopefully it’ll be near you - if not, let me know in the comments where you are so we can try to get some more of these events set up! Google is holding a few developer focused hack-a-thons around the US and would like to invite you to attend. At these events, we will be covering some of the latest and greatest features of HTML5, Chrome Web Store and In-App Payments. You will learn about the end to end flow of building a web app, distributing the app and monetizing it using these APIs. You will also have the opportunity to work hands on with the APIs and ask our experts (including me) questions. I’ll be helping out in Chicago and Mountain View. For more information on the events and to register, please check out the location specific links below: New York - 8/1 - http://www.eventbrite.com/event/1892631913 Chicago - 8/3 - http://www.eventbrite.com/event/1910102167 Seattle - 8/8 - http://www.eventbrite.com/event/1910138275 Mountain View - 8/11 - http://www.eventbrite.com/event/1910202467 Image http://www.flickr.com/photos/dmitry-baranovskiy/2378867408/ Share this Share Next Google Developer Days - South America Previous Is It Time To Rethink Web Navigation?"
