full_description = 'Clarence Wall By Pete LePage / On December 17, 2024 / In Scuba Tagged dive site Body of Water: Philippine Sea GPS Coordinates Lat: 7.130053 Lon: 134.225622 Most dive magazines rate next door dive site the Blue Corner as the single best dive in the world so very often divers miss Clarence’s wall. The formation of the reef with sheer walls and moderate slope is home to large number of schooling fish which make it a truly unique experience. Clarence’s wall got his name from a boat driver name Clarence who decided to cross the surf during a storm and capsized his boat (no injuries!), for many years the remains of the small boat could be seen at 90’. Today the wreck has long gone but the name remained.ReefA vertical reef wall that runs south to north parallel to Ngemelis Island. The wall drops from 10 to 250’ feet (3 to 80 meters) or more and is covered with large variety of giant Gorgonian sea fans, hard corals and soft corals.Marine LifeClarence’s Wall and Blue Corner nearby are home to some of the largest schools of fish in the world. Very often large school of fish will move or drift from Blue corner to the wall, here you can see just about every kind of fish found in the tropical ocean. Download DiveLog Exchange file const elem = document.getElementById("dlJSON"); const siteJSON = { "Version": 1, "FileType": "DiveLogExchange", "Program": "DiveLog", "Data": [{ "ItemType": "Place", "Data": { "waterName": "Philippine Sea", "gpsLocation": { "longitude": 134.22562222222223, "latitude": 7.130052777777777 }, "name": "Clarence Wall", "comments": "Most dive magazines rate next door dive site the Blue Corner as the single best dive in the world so very often divers miss Clarence’s wall. The formation of the reef with sheer walls and moderate slope is home to large number of schooling fish which make it a truly unique experience. \n\nClarence’s wall got his name from a boat driver name Clarence who decided to cross the surf during a storm and capsized his boat (no injuries!), for many years the remains of the small boat could be seen at 90’. Today the wreck has long gone but the name remained.\n\nReef\nA vertical reef wall that runs south to north parallel to Ngemelis Island. The wall drops from 10 to 250’ feet (3 to 80 meters) or more and is covered with large variety of giant Gorgonian sea fans, hard corals and soft corals.\n\nMarine Life\nClarence’s Wall and Blue Corner nearby are home to some of the largest schools of fish in the world. Very often large school of fish will move or drift from Blue corner to the wall, here you can see just about every kind of fish found in the tropical ocean. ", "waterType": 1 } }] }; console.log(siteJSON); const filename = "clarence-wall.dlexch"; const siteString = JSON.stringify(siteJSON, null, 2); const blob = new Blob([siteString], {type: "application/json"}); blob.name = filename; elem.href = URL.createObjectURL(blob); elem.download = filename; Share this Share'
