full_description = "Slides from Armada JS By Pete LePage | On December 6, 2024 | In web development Here are the slides from my presentation on Baseline at Armada JS in Novi Sad, Serbia this week. Continue reading Scuba - Dive Sites By Pete LePage | On December 3, 2024 | In Scuba I love scuba diving. It’s my favorite hobby, it’s so peaceful, there are amazing things to see and experience. There are no outside interuptions, no cell phones, no internet, no distractions. It’s just you and the environment around you. Continue reading Slides from connect.tech By Pete LePage | On November 20, 2024 | In web development Here are the slides from my presentation on Baseline at connect.tech in Atlanta this week. Continue reading Raspberry Pi Headless Setup By Pete LePage | On August 9, 2021 | In home automation I recently had to create a new Raspberry Pi image, and thankfully you can now do it without the need to ever plug the Pi into a keyboard or monitor! Continue reading How to serve a localized web app manifest for PWAs By Pete LePage | On May 26, 2021 | In web development Do you want to serve a localized experience for your Progressive Web App (PWA) depending on the users language? Unfortunately today, there’s no built in mechanism for localizing your web app manifest. There’s some work being done in the spec, but it hasn’t landed in any browser yet. But, it’s possible to do with a little server side code. Continue reading Measure & understand how installed PWA users differ from browser tab users By Pete LePage | On August 19, 2020 | In web development Are PWA users more engaged than browser-tab users? Do they convert more? Spend more time on site? How can you tell the difference between users who opened your PWA up via the launcher (standalone/installed users) vs users in a browser tab? Great question! The easiest way to do it is by using a dimension to track standalone vs browser. Continue reading"
