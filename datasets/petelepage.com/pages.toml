full_description = "Testing QuotaExceededError by simulating a small disk By Pete LePage | On August 19, 2020 | In web development An unhandled QuotaExceededError when writing to IndexedDB or the Cache Storage API can cause user data loss. That’s why it’s critical to handle them properly. But, because modern computers typically have large hard drives, exceeding your quota can be hard to test. Continue reading GitHub SSH and 2-factor auth By Pete LePage | On June 24, 2020 | In web development I hate that using SSH & 2-factor auth means I have to auth even for for a git pull. But there’s an easier way! Change the remote used for fetch to the HTTPS url. First, verify that both push/fetch are using SSH by running git remote -v it should output something like: origin git@github.com:petele/squoosh.git (fetch)origin git@github.com:petele/squoosh.git (push) Then use git remote set-url origin to set the remote URL for fetch to the HTTPS url. Your repo will now push via SSH and pull via... Continue reading Books I'm reading By Pete LePage | On April 27, 2020 | In general Reading is critical to my mental health. Ever since I was a kid, I read, at least a little bit before I fall asleep. In fact, it’s almost a trained behavior now. If I start reading during the day, I get sleepy! What I like about reading is that it gives me an opportunity to stop thinking about the day, put all of that aside and focus on something else. Almost like “parking” my brain for the evening. I want a good book, not a great book. It needs to be something I enjoy, but easy enough to put down. If... Continue reading Seamless/GrubHub order history By Pete LePage | On August 7, 2019 | In general AKA How much have I spent on Seamless this year? Continue reading Is my PWA installed? By Pete LePage | On July 18, 2019 | In web development Update: This post is out of date. See Detect how the PWA was launched on web.dev for details on how to check if your PWA is installed, how it was launched and if the user switches between standalone and a browser tab view. I got a question via email this morning asking if there was a way for a PWA to check if it’s installed. The site wanted to know what state the app was running in, either a browser tab, or a standalone window. First, you can use the getInstalledRelatedApps() API to check if your... Continue reading"
