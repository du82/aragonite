full_description = 'Betty Bomber By Pete LePage / On December 17, 2024 / In Scuba Tagged dive site Body of Water: Chuuk Lagoon Max Depth: 24m Altitude: Sea Level GPS Coordinates Lat: 7.35195 Lon: 151.878389 Mitsubishi G4M3 Navy Type 1 Attack Bomber - This Japanese Navy tactical bomber first took to the air in 1939, with mass production starting in 1940. Her shape gave her the name "Flying Cigar", but she would also light up when shot, because of her unprotected fuel tanks. This aircraft could also carry torpedoes. It appears that the BETTY was landing at the Eten Island airstrip, but went down just a few hundred meters short, breaking off her nose, starboard wingtip, and engines, which were tossed forward nearly 100 meters off the port side. No one knows whether she was shot down or if her demise was a result of the American Operation Hailstone assault of 17-18 Feb., 1944. Download DiveLog Exchange file const elem = document.getElementById("dlJSON"); const siteJSON = { "Version": 1, "FileType": "DiveLogExchange", "Program": "DiveLog", "Data": [{ "ItemType": "Place", "Data": { "name": "Betty Bomber", "comments": "Mitsubishi G4M3 Navy Type 1 Attack Bomber - This Japanese Navy tactical bomber first took to the air in 1939, with mass production starting in 1940. Her shape gave her the name \"Flying Cigar\", but she would also light up when shot, because of her unprotected fuel tanks. This aircraft could also carry torpedoes. It appears that the BETTY was landing at the Eten Island airstrip, but went down just a few hundred meters short, breaking off her nose, starboard wingtip, and engines, which were tossed forward nearly 100 meters off the port side. No one knows whether she was shot down or if her demise was a result of the American Operation Hailstone assault of 17-18 Feb., 1944.", "gpsLocation": { "longitude": 151.8783888888889, "latitude": 7.3519499999999995 }, "waterType": 1, "maxDepth": 24.384000778198242, "photo": "iVBORw0KGgoAAAANSUhEUgAAAa4AAACMCAYAAAAk5k0TAA