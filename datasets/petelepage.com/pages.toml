title = "Chandelier Cave | Pete LePage"
description = "Body of Water:        Philippine Sea               GPS Coordinates   Lat: 7.340789   Lon: 134.450642       Chandelier Cave is a cave system made up of five (5) separate chambers. Each chamber is connected to the other and each can be entered. Important Notice: Divers, who are claustrophobic and/or have concerns about caves or diving in darkness, should avoid this dive.There are numerous stories of how Chandelier Cave was first discovered. The most believable story goes back to the post WWII era. Ordinance..."
full_description = '''Chandelier Cave By Pete LePage / On December 17, 2024 / In Scuba Tagged dive site Body of Water: Philippine Sea GPS Coordinates Lat: 7.340789 Lon: 134.450642 Chandelier Cave is a cave system made up of five (5) separate chambers. Each chamber is connected to the other and each can be entered. Important Notice: Divers, who are claustrophobic and/or have concerns about caves or diving in darkness, should avoid this dive.There are numerous stories of how Chandelier Cave was first discovered. The most believable story goes back to the post WWII era. Ordinance teams were combing the island looking for unexploded bombs and ammunition. The team found three (3) depth charges, they can still be seen to the left of the entrance. These are the same type and shape that can be found on the Helmet Wreck. While trying to remove the depth charges the entrance to the cave was discovered. Another story tells of a fisherman, who was out catching dinner one day. The fisherman saw a large fish and tried to catch it, but the fish swam toward the island and disappeared into the entrance to the cave.ReefThe mushroom-shaped rock islands of Palau were formed from limestone reefs pushed upwards, in ancient times, by underlying volcanic activity. The islands get their distinctive shape from wave and tidal action as well as that from invertebrates scraping away tiny bits of the island as they graze on algae. Over the millennium's rainwater, percolating down through the limestone eroded the interior of the islands forming, in some cases, vast cave systems. At one time, Chandelier Cave was an open-air cave not water-filled as it is today. Over time, the stalactites (limestone pinnacles hanging from the ceiling) and stalagmites (limestone pinnacles growing from the floor) slowly grew into magnificent formations resembling priceless glittering chandeliers. After the last ice age, the water level slowly rose, completely concealing the cave's entrance. The cave is comprised of five (5) chambers, four (4) are water-filled chambers (each with an air pocket) and the fifth is completely above water and connected to the last two water chambers.Marine LifeLook for soldierfish and cardinal fish hanging around the opening to the cave as well as small shrimp and crabs that cling to the sponges found along the walls. The elusive Mandarin Fish, found only in a few locations, can also reward the patient diver. Download DiveLog Exchange file const elem = document.getElementById("dlJSON"); const siteJSON = { "Version": 1, "FileType": "DiveLogExchange", "Program": "DiveLog", "Data": [{ "ItemType": "Place", "Data": { "waterName": "Philippine Sea", "gpsLocation": { "longitude": 134.45064166666666, "latitude": 7.340788888888889 }, "name": "Chandelier Cave", "comments": "Chandelier Cave is a cave system made up of five (5) separate chambers. Each chamber is connected to the other and each can be entered. Important Notice: Divers, who are claustrophobic and/or have concerns about caves or diving in darkness, should avoid this dive.\n\nThere are numerous stories of how Chandelier Cave was first discovered. The most believable story goes back to the post WWII era. Ordinance teams were combing the island looking for unexploded bombs and ammunition. The team found three (3) depth charges, they can still be seen to the left of the entrance. These are the same type and shape that can be found on the Helmet Wreck. While trying to remove the depth charges the entrance to the cave was discovered. Another story tells of a fisherman, who was out catching dinner one day. The fisherman saw a large fish and tried to catch it, but the fish swam toward the island and disappeared into the entrance to the cave.\n\nReef\nThe mushroom-shaped rock islands of Palau were formed from limestone reefs pushed upwards, in ancient times, by underlying volcanic activity. The islands get their distinctive shape from wave and tidal action as well as that from invertebrates scraping away tiny bits of the island as they graze on algae. Over the millennium's rainwater, percolating down through the limestone eroded the interior of the islands forming, in some cases, vast cave systems. At one time, Chandelier Cave was an open-air cave not water-filled as it is today. Over time, the stalactites (limestone pinnacles hanging from the ceiling) and stalagmites (limestone pinnacles growing from the floor) slowly grew into magnificent formations resembling priceless glittering chandeliers. After the last ice age, the water level slowly rose, completely concealing the cave's entrance. The cave is comprised of five (5) chambers, four (4) are water-filled chambers (each with an air pocket) and the fifth is completely above water and connected to the last two water chambers.\n\nMarine Life\nLook for soldierfish and cardinal fish hanging around the opening to the cave as well as small shrimp and crabs that cling to the sponges found along the walls. The elusive Mandarin Fish, found only in a few locations, can also reward the patient diver.", "waterType": 1 } }] }; console.log(siteJSON); const filename = "chandelier-cave.dlexch"; const siteString = JSON.stringify(siteJSON, null, 2); const blob = new Blob([siteString], {type: "application/json"}); blob.name = filename; elem.href = URL.createObjectURL(blob); elem.download = filename; Share this Share'''
