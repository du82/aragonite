["https://petelepage.com/blog/2024/11/connect-tech"]
title = "Slides from connect.tech | Pete LePage"
description = "Here are the slides from my presentation on Baseline at connect.tech in Atlanta this week. Baseline ✅ - New web features ready to use across browsers today # Knowing what new features and APIs you can safely use can be a challenge, will it work in the browsers you need to support? Baseline helps with that, giving developers a way to know whether a feature is ready to use. We’ll dive into how to use Baseline to identify which features you can confidently use in your site and which ones you’ll need to do..."
full_description = "Slides from connect.tech By Pete LePage / On November 20, 2024 / In web development Tagged Here are the slides from my presentation on Baseline at connect.tech in Atlanta this week. Baseline ✅ - New web features ready to use across browsers today # Knowing what new features and APIs you can safely use can be a challenge, will it work in the browsers you need to support? Baseline helps with that, giving developers a way to know whether a feature is ready to use. We’ll dive into how to use Baseline to identify which features you can confidently use in your site and which ones you’ll need to do more work to support and cover some of the key features now included in Baseline, and how they help you create more beautiful and capable sites and applications. Baseline gives web developers clear information about which web platform features are ready to use in their projects today. When reading an article, or choosing a library for your project, if the features used are all part of Baseline, they can trust the level of browser compatibility. By aligning with Baseline, there should be no surprises when testing your site. Baseline status information is now available on key developer resource sites such as MDN, Can I Use, and web.dev, making it easier than ever to know whether a feature is ready to use. Slides Presented at connect.tech November 20, 2024. Share this Share Next Scuba - Dive Sites Previous Raspberry Pi Headless Setup"
