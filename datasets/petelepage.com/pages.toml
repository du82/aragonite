description = "Body of Water:        Philippine Sea        Difficulty: Novice         GPS Coordinates   Lat: 7.105381   Lon: 134.246       Big Drop-Off is one of the most amazing walls dives in Palau and a must for all divers who enjoy endless colorful corals dropping from the surface to depths way beyond a diver’s reach. In this blog, we will give you a detailed look at the dive site Big Drop-Off, its location, formation, and marine life.Big Drop-Off, just what the name implies is “really big”. About 30 feet (10 meters)..."
full_description = '''Big Drop Off By Pete LePage / On December 17, 2024 / In Scuba Tagged dive site Body of Water: Philippine Sea Difficulty: Novice GPS Coordinates Lat: 7.105381 Lon: 134.246 Big Drop-Off is one of the most amazing walls dives in Palau and a must for all divers who enjoy endless colorful corals dropping from the surface to depths way beyond a diver’s reach. In this blog, we will give you a detailed look at the dive site Big Drop-Off, its location, formation, and marine life.Big Drop-Off, just what the name implies is “really big”. About 30 feet (10 meters) from the mooring buoy to the east at 35 feet (12 meters) a large chain connected to a 6 foot (2 meter) steel sphere can be seen. This chain and ball was used during WWII to prevent the Japanese from entering the waterway leading to German Channel. Lieutenant Barnum from the US Navy conducted the Operation. The chain and ball on Big Drop Off was a mystery for 40 years until newly appointed Admiral Barnum returned to Palau in 1986 and told his story.Marine LifePyramid Butterflyfish, Square Anthias, Moorish Idols, Sargent Major's, Yellowtail Fusiliers are among the myriad of fish found all along the edge and top of the reef. Blue Face, Regal, and Emperor Angelfish are easily spotted. Dwarf angelfish, such as Coral Beauty, Keyhole, and Gray's dart in and around the coral heads at the top of the reef. Clark and Blue Striped Clownfish with their host anemones are also scattered along the reef. Hawksbill Turtles like to feed and rest at the top of the reef. Turtles can be approached if you move slowly. White Tip and Nurse Sharks sleep on the sandy bottom. Download DiveLog Exchange file const elem = document.getElementById("dlJSON"); const siteJSON = { "Version": 1, "FileType": "DiveLogExchange", "Program": "DiveLog", "Data": [{ "ItemType": "Place", "Data": { "difficulty": "Novice", "waterName": "Philippine Sea", "gpsLocation": { "longitude": 134.24599999999998, "latitude": 7.105380555555556 }, "name": "