["https://peterkroener.de/weblog"]
title = "Weblog • Peter Kröner • Webtechnologie"
full_description = "Öffentliche Erklärbär-Termine 1. Halbjahr 2025 Veröffentlicht am 23. Januar 2025 Willkommen im Jahr 2025! Wie immer reist der rasende Erklärbär durch die Gegend und verbreitet Neues und Kontroverses zum Thema Frontend-Entwicklung. Ihr könnt entweder bei einem der folgenden Termine dabei sein oder mich direkt zu euch in die Firma einladen – Workshops, Code-Reviews, Beratung, ihr kennt das Programm. Für die Öffentlichkeit fest eingeplant ist für das 1. Halbjahr schon folgendes: 6. Februar, OOP Konferenz (München): Talk „Legacy-Refactoring im Web-Frontend – Standards to the Rescue!“ – ein Überblick über die Chancen, die Webstandard für Legacy-Refactoring bieten, plus ein paar Horrorstories aus der Praxis. 6. März, BASTA! Spring 2025 (Frankfurt a. Main): Talk „Mein Browser kann WAS!? Neue, unterschätzte und unbekannte Frontend-Webstandards“ – Überblick über Neuheiten aus der Frontend-Welt, von HTML und Browser-APIs bis hin zu CSS und JS. Talk „Best of the Worst – die Top 5 der schlimmsten JavaScript-Features“ – Mischung aus Comedy-Programm und Wissenswertem aus den obskureren Ecken des ECMAScript-Standards. 17. - 19. März, JavaScript & Angular Days (Unterhaching): Ganztags-Workshop „JavaScript-Upgrade für 2025 für Frontend-Entwickler:innen“ – alles, was es über JavaScript des Jahres 2025 zu wissen gibt, mit den neuesten Features, neuen Use Cases für alten Features und wilden Spekulationen über die Zukunft. Halbtags-Workshop „Go Vanilla or go Home! Natives-DOM-Hacking für das Jahr 2025“ – Vanilla-Webdev-Rundumschlag, der mit einem Basics-DOM-Refresher beginnt und diverse neue APIs demonstriert, um dann bei Web Components und DIY-Eventsystemen zu Enden Halbtags-Workshop „Async/Await 2.0: Native Streams und asychrone Iterables für's Frontend“ – Deep Dive in asynchrone Iteration, asynchrone Generators und Stream-APIs im Frontend. Eine Hirn-Kernschmelze für alle JS-Entwickler:innen, die sonst schon alles wissen. Ganztags-Workshop „Web Components für Designsysteme“: eine Co-Produktion mit Tobias Struckmeier, die die Chancen (und Hürden) für den Einsatz von Web Components im Kontext von Designsystemen von A bis Z durchdiskutiert. 25. März, Online: Live-Event „Break Free from Frameworks with Vanilla JS“ – ein halbtägiger Vanilla-Webdev-Rundumschlag, der mit einem Basics-DOM-Refresher beginnt und diverse neue APIs demonstriert, um dann bei Web Components und DIY-Eventsystemen zu Enden (auf Englisch) 9. - 11. + 14. - 16. April, Online: „JavaScript Intensiv-Schulung“ – 6 halbe Tage klassische JavaScript-Druckbetankung für Ein- und Umsteiger:innen. KW 19, JAX 2025 (Mainz): der Titel meines Talks „Auf der dunklen Seite der Macht: die schlimmste JavaScript-Funktion der Welt schreiben und verstehen“ sagt eigentlich alles. Statt am guten Beispiel lernen wir aus der übelsten Gammelfunktion, die ich zu schreiben imstande war, einiges Neues und Unbekanntes über JavaScript. 8. Mai, enterJS 2025 (Mannheim): im Talk „Crimes Against the Browser: Finsterste Frontend-Verbrechen“ nehme ich eine grauslige Sammlung an Hacks und faulen Tricks zum Anlass, ein großes Spektrum an Browser-APIs und Webstandards-Detritus zu beleuchten. 5. und 6. Juni, Webinale (Berlin): 5. Juni: Talk „Best of the Worst – The Most Awful Anti-Features in JavaScript, Ranked!“ – Mischung aus Comedy-Programm und Wissenswertem aus den obskureren Ecken des ECMAScript-Standards (auf Englisch) 6. Juni: Workshop „Go Vanilla Or Go Home! Native-DOM-Programming in 2025“ – ein ganztägiger Vanilla-Webdev-Rundumschlag, der mit einem Basics-DOM-Refresher beginnt und diverse neue APIs demonstriert, um dann bei Web Components und DIY-Eventsystemen zu Enden (auf Englisch) 12. - 16. Mai, International JavaScript Conference (London): 12. Mai: Ganztages-Event „iJS Fullstack Day: Level Up Your Full Stack Performance“ – ein ganzer Tag rund um Performance im weitesten Sinne, mit Talks, Diskussionen und es gibt sogar etwas zu gewinnen (auf Englisch) 13. Mai: Talk „Best of the Worst – The Most Awful Anti-Features in JavaScript, Ranked!“ – Mischung aus Comedy-Programm und Wissenswertem aus den obskureren Ecken des ECMAScript-Standards (auf Englisch) 15. Mai: Ganztags-Workshop „Async/Await 2.0: Native Streams and Asychronous Iterables“ – Deep Dive in asynchrone Iteration, asynchrone Generators und Stream-APIs im Frontend. Eine Hirn-Kernschmelze für alle JS-Entwickler:innen, die sonst schon alles wissen (auf Englisch) Termine unpassend, Orte alle zu weit weg und Programme nicht genehm? Ich komme auch gerne mit einem maßgeschneiderten Workshop vorbei – mich kann man ganz einfach mieten! Auch für Code-Reviews und Frontend-Feuerwehreinsätze stehe ich gerne zur Verfügung. Einfach anschreiben! Öffentliche Erklärbär-Termine Herbst 2024 Veröffentlicht am 26. August 2024 Es wird mal wieder Zeit für eine Liste öffentlicher Erklärbär-Termine! Neben dem traditionellen Konferenz-Programm im Herbst könnt ihr mich natürlich wie gehabt direkt mieten, um in eurer Firma die frohe Kunde von Zero-Dependency Web Components, neuen JavaScript-Features oder besserem TypeScript zu verkünden. 11. - 13 und 16 - 18. September online: JavaScript Intensiv-Schulung bei Workshops.de: einmal alles über JavaScript im Druckbetankungsverfahren! Die Schulung verteilt den Inhalt von drei vollen Tagen über 6 halbe Tage, damit sie weniger anstrengend wird und die Teilnehmer:innen nicht komplett in Beschlag nimmt. 21. - 24. Oktober auf den JavaScript- und Angular-Days (Berlin): 21. Oktober: der Ganztages-Workshop „JavaScript-Upgrade für 2024 für Frontend-Entwickler:innen“ (in zwei Teilen) ist das Upgrade für alle, die nicht 24/7 den JavaScript-Nachrichtenzirkus verfolgen und informiert über das Neueste (und das wenig Beachtete) aus den letzten paar ECMAScript-Updates. Dieses Mal sind unter anderem Resizable Array Buffers, Atomics.waitAsync und String.prototype.isWellFormed() neu im Programm. 22. Oktober: im Workshop „Proxies! Exotic Objects für den JavaScript-Alltag“ erschlagen wir alles rund um das Konzept der Exotic Objects in JavaScript. Wir grenzen Exotic Objects von Ordinary Objects ab, entwickeln eigene Exotic Objects mit der Proxy-API und diskutieren erschöpfend die Möglichkeiten und Limitierungen von Proxies im Alltag. 22. Oktober: bei der Veranstaltung „Best of the Worst - JavaScript-Features aus der Hölle“ handelt es sich möglicherweise um ein als Workshop getarntes Comedy-Program, dessen Titel ich einer Youtube-Show entwendet habe. 04. - 08. November auf der W-JAX (München): 05. November: wer um 19 Uhr noch Energie übrig hat, kann sich die Kurzfassung des Comedy-Programms „Best of the Worst – JavaScript-Features aus der Hölle“ geben. 06. November: die Session „Mein Browser kann WAS!? Neue, unterschätzte und unbekannte Webstandards für jedes Frontend“ bringt alle Teilnehmenden auf den neuesten Stand, was nützliche Frontend-APIs angeht, die in jedem Projekt hilfreich sein könnten – etwas weniger Web Serial API, dafür mehr Compression Streams und Co. 11. - 15. November auf der International JavaScript Conference (München): 11. November: der „IJS Fullstack Day“ ist eine Mischung als Lightning Talks, Panel-Diskussion und AMA, zu dem ich meine Outsider-Perspektive auf moderne Webentwicklung beisteuern darf! Während es viel um fancy Tools und AI gehen wird, darf ich ein wenig über Minimalismus und das Weniger-ist-Mehr-Prinzip schwafeln. 14. November: mittlerweile wissen wir alle, was sich hinter dem Titel „Best of the Worst – The 5 Most Awful Anti-features in JavaScript“ verbirgt, oder? 15. November: im Ganztages-Workshop „Next Level Web-Formulare mit Web Components“ stelle ich den von mir entwickelten Ansatz für DIY-Formularelemente vor, den Social-Media-Follower vermutlich schon kennen. 13. - 14. November auf der c't webdev (Köln): wir kennen den Inhalt des Talks „Best of the Worst“ am 13. November, also auf zum nächsten Termin... 22. - 28. November auf der .NET Developer Conference (Köln): der Ganztages-Workshop „From Zero to Frontend-Hero“ am 22. November hat, wie der Name vermuten lässt, die Frontend-Aufschlauung von Backend-Entwickler:innen zum Thema. Wir besprechen, warum semantisches HTML wichtig ist, was CSS mittlerweile alles kann, warum JS so ist wie es ist, was es mit TypeScript auf sich hat und demystifizieren Konzepte wie Full-Stack-Frameworks und Server-Side-Rendering. Termine unpassend, Orte alle zu weit weg und Programme nicht genehm? Ich komme auch gerne mit einem maßgeschneiderten Workshop vorbei – mich kann man ganz einfach mieten! Auch für Code-Reviews und Frontend-Feuerwehreinsätze stehe ich gerne zur Verfügung. Frontend ohne FOMO: ein Erfahrungsbericht Veröffentlicht am 13. August 2024 Die erste Fassung der Code.Movie-Webseite, damals noch mit dem Playground als SAAS, hatte ich vor ca. 2 Jahren gebaut und dabei alles zum Einsatz gebracht, was moderne Frontend-Entwicklung zu bieten hatte: Next.js und React sowie diverse Packages für React. Dazu zählten unter anderem Redux und React DnD, die freilich ihrerseits Ergänzungs-Packages nach sich zogen (u. a. Redux-Saga und react-dnd-html5-backend), plus natürlich allerlei weiteres Zubehör wie Linter-Plugins für Next und React. Das Endergebnis war eine moderne Webapp nach allen Regeln der Kunst – SPA, SSR, jedes Feature war dabei. Wenn ich heute die package.json von damals aus dem Archiv hole, finde ich die Liste der Dependencies auch gar nicht mal so besonders lang. Die Packages konzentrierten sich auf das Wesentliche und statt für jede Kleinigkeit NPM heranzuziehen, habe ich viel mit eigenem Code gelöst. Das Projekt litt trotz einer eher überschaubaren intrinsischen Komplexität und einem moderat dimensionierten Dependency Tree daran, dass ich permanent damit beschäftigt war, vorhandenen Code wieder und wieder neu zu schreiben, ohne viel sichtbaren Fortschritt am Projekt zu erzielen. Das könnte allein mein höchstpersönliches Versagen gewesen sein, aber es drängt sich der Eindruck auf, dass nicht nur ich dieses Problem kenne. Code als Dauer-Baustelle: eine Ursachensuche Am Dauer-Rewrite waren die Dependencies nicht unbeteiligt; von einem Tag auf den anderen wollte beispielsweise Next.js alle Pages statt in Folder A lieber in Folder B sehen und dort, wo die Dependencies wirklich gestapelt waren, gab es auch bei kleinen Updates immer wieder Kompatibilitätsprobleme. Das größere Problem saß aber in Kiel vor dem Bildschirm, denn mich hatte das Frontend-FOMO weit mehr im Griff, als mir damals klar war. Neue Versionen von Software bedeuten in aller Regel Fortschritt. Klar, manchmal bricht eine API und manchmal wird etwas verschlimmbessert, aber in aller Regel geht es vorwärts – und wer möchte nicht gern vorn mit dabei sein? Das Problem ist nur, dass Fortschritt, wenn er auf bestehenden Code trifft, nicht ohne Arbeitseinsatz eingebaut werden kann … manchmal, ohne wahrnehmbare Verbesserungen zu erzielen. In meinem Fall passierte das mehrfach: Dependency-Updates mit API-Änderungen (wie das angesprochene Next.js-Update) bringen Umbauten des betroffenen Codes mit sich. Diese können in sich eine Verbesserung darstellen, aber genauso gut einfach eine reine Umformulierung des Bestehenden ohne spürbaren Gewinn bedeuten. Dass am Ende von den eventuellen Verbesserungen etwas Wahrnehmbares bei den Nutzer:innen des Projekts ankommt, ist sehr unwahrscheinlich und war beim Next.js-Update am Ende auch nicht der Fall. Eines Tages ließ ich mich überzeugen, das Redux-Toolkit einzubauen und im Zuge dessen das gesamte bisherige State-Management der App zu ersetzen. Viel Arbeit, keine Änderung an UI oder UX. Der neue Code war im Vergleich zu meinem vorher verwendeten DIY-Redux-Toolkit deutlich weniger idiosynkratisch, aber außerhalb des Codes gab es keine wahrnehmbare Änderung. Da mit dem Code nur Menschen in Kontakt kamen, die auch schon vorher wussten, wie das System funktioniert, war dieser Umbau nicht wirklich hilfreich. Ich muss vermutlich nicht erklären, was mit dem frisch umgebauten State Management passiert ist, als ein Jahr später Signals um die Ecke kamen. Verbesserungen an UI, UX und Feature-Set: keine. Jetzt könnte man mir vorwerfen, dass ich hätte kommen sehen sollen, dass keiner dieser Umbauten mir weiterhelfen würde. Aber ich würde nicht sagen, dass mir nichts davon geholfen hat: das Next.js-Update mitzunehmen war nötig, um auch in Folge Updates mitgehen zu können und das mehrfache Neuschreiben hat das State Management ganz am Ende in einen hervorragenden Zustand gebracht! Letzteres lag vermutlich weniger an Redux-Toolkit oder Signals als eher daran, dass ich beim dritten Rewrite ein viel besseres Bild davon hatte, was ich zu erreichen versuchte … aber der Fortschritt an sich ist nicht wegzudiskutieren. Selbst wenn es keine wirklichen Verbesserungen gegeben hätte, so wäre es doch keine gute Idee gewesen, die Updates zu ignorieren, denn das frische Update von heute ist der etablierte Standard für die nächsten Updates der Dependencies von morgen. Wir müssen aber auch festhalten, dass alle genannten Updates und Verbesserungen sich nur dort manifestiert haben, wo sie eine untergeordnete Rolle spielen: im Programmcode. Code ist nicht unwichtig, aber wenn wir Frontend-Web-Apps bauen, ist das Ziel ein anklickbares Produkt, in dem eine dritte Iteration von State Management nur mittelbar eine Rolle spielt. Das dazu nötige JavaScript, CSS und HTML kann sich dabei innerhalb eines relativ breiten Qualitätskorridors bewegen, ehe es zu einem Problem wird. Nun bin ich, wie alle Hörer:innen von Working Draft wissen, weit entfernt davon, unkritisch jedem Hype hinterherzulaufen. Trotzdem war es mir, als ich mich in das React-Universum begeben hatte, nicht möglich, sich dem permanenten Neuschreiben und dem Dauer-Update von bereits Funktionierendem zu entziehen. Es gab jederzeit genug Neuerungen zum Einbau und genug Gründe (v.a. Kompatibilität aktueller und zukünftiger Dependencies untereinander) für all die Neuerungen. Am Ende hat mich das permanente Neuschreiben ausreichend genervt, um das betroffene Projekt eines Tages einfach abzubrechen. Wo kommt das ständige Neuschreiben her? Web-Frontends könnten eigentlich, wenn einmal gebaut, fast auf ewig unverändert weiter funktionieren. Browser sind gnadenlos abwärtskompatibel und wenn wir wollten, könnten wir auch heute noch Seiten aus <frameset> und document.write() zusammenbauen. Warum schreiben wir dann unsere Frontends (ganz oder in Teilen) ständig neu? Neben den zweifellos nötigen Updates (neue Features im betroffenen Frontend oder globale Neuheiten, auf die regiert werden muss – z. B. Sicherheits-Features, Responsive Design oder Dark Mode) kommt meines Erachtens viel Rewrite daher, dass die meisten Web-Apps keine Berührungspunkte mehr mit der eigentlich so stabilen Web-Plattform haben. Das ist kein Zufall, denn der Sinn und Zweck von Tools wie React ist, die Plattform wegzuabstrahieren. Die Webstandards definieren allerlei unkomfortable APIs und statt eines konsistenten Big-Picture-Designs herrscht ein wildes Durcheinander von Paradigmen und Konven"
