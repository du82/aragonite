["https://peterkroener.de/profil"]
title = "Profil • Peter Kröner • Webtechnologie"
full_description = "Ihr Webstandards-Nerd stellt sich vor Seit 2010 beschäftige ich mich schwerpunktmäßig mit Webtechnologie-Wissensvermittlung. Alles, was mit Browsern und Webstandards zu tun hat, ist mein Metier – vor allem, wenn es darum geht, Ihre Mitarbeiter mit Schulungen und Workshops auf ein neues Level zu heben! Vita 2004-2006: Als einer von drei Ge­sell­schaf­tern Designer der Webagen­tur Include Design. 2006-2011: Selbst­stän­di­ger Web­de­si­gner und Front­end­ent­wick­ler 2010: Das HTML5-Buch „HTML5: Webseiten innovativ und zukunftssicher“ erscheint bei Open Source Press. Seit 2010: Trainer für Webtechnologien 2011: Die zweite Auflage des HTML5-Buchs und das HTML5-Videotraining erscheinen 2013: Die zweite Auflage des HTML5-Videotrainings erscheint Was ich anbiete Schulungen zu JavaScript, TypeScript, Web Components und Co: für so ziemlich jeden spannenden Frontend-Standard habe ich ein Schulungs-Modul in der Schublade. Praxisübungen in verschiedenen Schwierigkeitsgraden, detaillierte Slides und unterhaltsamer Vortragsstil sind inklusive. Coaching und Workshops: ein Prototyp mit neuer Technologie soll her, aber niemand möchte, dass die Entwickler stundenlang Stackoverflow nach Informationen durchforsten? Ich betätige mich gerne als wandelndes Lexikon und Fehlendes-Semikolon-Finder, damit ein intensiver Workshop neben Wissen auch ein funktionierendes Produkt generiert. Webtech-Problemlösung: knifflige Programmierprobleme im Frontend sind mein täglich Brot! Ich helfe ihnen, performante und nachhaltige, Lösungen für ihre Web-Oberflächen zu entwickeln – stets mit beiden Beinen auf dem Boden stabiler Webstandards. Technische Schuldenberatung: der JavaScript-Code ist 100 Jahre alt, die ursprünglichen Entwickler sind nicht mehr zu finden und niemand traut sich mehr, irgendetwas zu ändern? Kein Problem – ich setze mich mit Ihren Entwicklern zusammen und erarbeite eine Strategie für die schonende Rettung ihrer Codebase. Antworten auf strategische Fragen: Framework A oder B? Stack X oder Y? Oder überhaupt Webtechnologie? Als unabhängiger Berater bin ich gerne Ihre Navigationshilfe im Frontend-Technologie-Dschungel. Kunden Mieten Sie mich! Egal, ob Sie Schulungs- oder Code-Bedarf haben: besten erreichen Sie mich mit einer E-Mail an peter@peterkroener.de. Telefonisch bin ich unter der Nummer +49 151 55994172 zu erreichen."
year_published = 2025
