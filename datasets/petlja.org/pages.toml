["https://petlja.org/sr-Latn-RS/n/zavr%C5%A1eno-17.-bubble-cup-takmi%C4%8Denje-/104719"]
title = "Petlja"
description = "U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji."
full_description = "U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Bubble Cup takmičenje je postalo prepoznatljivo među ljubiteljima algoritamskih izazova i timskog rada. Ovaj prestižni timski događaj u programiranju, namenjen srednjoškolcima i studentima uzrasta od 15 do 24 godine, privlači mlade talentovane programere iz cele zemlje. Takmičenje, koje je pokrenuto 2008. godine, ima za cilj ne samo da istakne programerske veštine učesnika, već i da promoviše komunikaciju, saradnju i inovativnost. Ove godine, finale Bubble Cup 17 takmičenja održano je 28. septembra, uživo u prostorijama Majkrosoftovog razvojnog centra u Srbiji. Tokom ovog uzbudljivog dana devetnaest ekipa je imalo priliku da pokaže svoje programerske veštine. U Premier League kategoriji studenata, prvo mesto osvojio je tim BenGIIn Klub, dok su drugo i treće mesto zauzeli timovi stefanbalaz2 i Urke. U Rising Stars kategoriji srednjoškolaca, pobedu je odneo tim 100011, dok su drugo i treće mesto zauzeli timovi Gimnazija Sombor i Kisela voda. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
