full_description = "Приручници на Петљи представљају материјале намењене учењу различитих тема. То су интерактивни онлајн материјали који у себи, поред текста и слика, садрже и примере кода који се извршава у браузеру, питалице, видее као и задатке у којима је потребно допунити код или га написати у целости, након чега решење може да се изврши и испроба у самом приручнику. Aко сте корисник са наставничким налогом, можете пратити рад ученика у приручницима. Kaко то да урадите, можете прочитати овде. Приручници на Петљи су писани тако да прате план наставе и учења за одређени разред или програм и да у њему покривају наставну тему рачунарства. Међутим, и поред тога што их препоручујемо за употребу у школској настави, приручници могу послужити и самосталном учењу свакоме ко жели да учи програмирање. У зависности од теме самог приручника, приручници се могу разликовати према типовима задатака који се у њима налазе."
