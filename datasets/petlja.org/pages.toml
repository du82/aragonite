["https://petlja.org/biblioteka/r/lekcije/beebot_prirucnik/03_osnovne_igre-index"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "У овом делу приручника издвојене су игре Пчелицом роботом, а према начину на који се у њима одређује завршна позиција при његовом програмирању. Ове игре су назване „Основне” јер је њихов принцип и сценарио могуће прилагођавати и примењивати у различитим контекстима игре и истраживањима у оквиру темама/пројеката који се развијају са децом. Ове игре бити и уводне активности у циљу истраживања дечје запитаности, послужити за уношење провокације за даље истраживање у оквиру теме/пројекта, подстицање рефлексије на процес кроз који се прошло и сл. У наредној табели дат је списак основних игара употребом Пчелице робота, а које су подељене према начину одређивања завршног поља. У истој табели се, ради бољег разумевања, налази и краћи сценарио сваке игре, који је у наставку текста прецизније описан. Завршно поље је дете слободно изабрало, нагласак је на путањи кретања. Завршно поље је одређено различитим талонима, упутствима, кодовима и сл. Као што је већ напоменуто, оно што је карактеристично за све ове игре и њихове описе јесте да их можемо разматрати као почетне идеје за друге игре коришћењем Пчелице робота. Да би оне биле смислене за дете, важно је ослушкивати децу, смишљати занимљиве наративе, повезати их са дечјим искуством и доживљеним током тренутне теме/пројекта или претходних тема/пројеката, задржати њихов игровни образац и др. Број Тематских и Картица скривалица у већини наведених игара може варирати, што одређујемо/прилагођавамо у зависности од укупног контекста игре. Такође, логично је да садржаји Тематски картица могу варирати у зависности од теме/пројекта који се развија."
year_published = 2025
