title = "Petlja"
description = "Microsoft razvojni centar u Srbiji po 11 put organizuje međunarodno timsko takmičenje u programiranju za studente i srednjoškolce - Bubble Cup."
full_description = "Microsoft razvojni centar u Srbiji po 11 put organizuje međunarodno timsko takmičenje u programiranju za studente i srednjoškolce - Bubble Cup. Microsoft razvojni centar u Srbiji po 11 put organizuje međunarodno takmičenje u programiranju - Bubble Cup. Prijave za sve zainteresovane studente i srednjoškolce su otvorene u periodu od 26. marta do 28. aprila 2018. nainternet portalu www.bubblecup.orgod 26. marta do 28. aprila 2018. godine, odnosno 48 sati pre početka druge kvalifikacione runde. „Bubble Cup“ je timsko takmičenje u programiranju i rešavanju algoritamskih zadataka, osmišljeno još 2008. godine od strane Razvojnog centra kompanije Microsoft u Srbiji. Cilj ovog takmičenja je popularizacija programiranja među mladima, privlačenje talentovanih mladih programera iz zemlje i regiona, i promovisanje timskog rada. Novina u ovogodišnjem takmičenju je uvođenje dve divizije tokom kvalifikacionih rundi. Premier Liga je divizija otvorena za studente i srednjoškolce koji ispune kriterijume učešća. Divizija Rising Stars je otvorena isključivo za timove srednjoškolaca iz Srbije, kako bi se popularizovalo programiranje u srednjim školama u Srbiji. Inicijativa za uvođenje zasebne divizije takmičenja posvećene samo srednjoškolcima iz Srbije naišla je na podršku velikog broja škola i nastavnika širom Srbije tokom predstavljanja novog formata takmičenja početkom marta. U finale takmičenja će se plasirati timovi studenata i srednjoškolaca, koji u dve online runde reše određeni broj zadataka, prema jasno definisanim kriterijumima. Finale Bubble Cup takmičenja biće održano u septembru u Beogradu. O pravilima takmičenja zainteresovani se mogu informisati na internet portalu www.bubblecup.org, putem mejla bubble@bubblecup.org, ili preko FB strane www.facebook.com/BubbleCupCompetition. Svi studentski timovi koji se plasiraju u finale Bubble Cup-a kvalifikuju se da apliciraju za podršku Microsoft razvojnog centra u Srbiji prilikom odlaska na prestižno međunarodno ACM takmičenje iz programiranja (Association for Computing Machinery Inc). Bubble Cup predstavlja odličnu pripremu za ACM, jer se svojim formatom gotovo u potpunosti poklapa sa pravilima tog takmičenja."
