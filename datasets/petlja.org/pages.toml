full_description = "Fondacija Petlja pruža dodatnu podršku nastavi u IT odeljenjima kroz materijale koji pokrivaju ključne teme računarskih nauka Autorski tim Fondacije Petlja je kreirao nove materijale za starije razrede specijalizovanih IT odeljenja kojima se pokrivaju teme poput veštačke inteligencije, funkcionalne i logičke paradigme, objektno-orijentisano programiranje, baze podataka i veb programiranje. Tokom leta naši autori su kreirali i pripremili pet novih onlajn kurseva namenjenih učenicama i učenicima specijalizovanih IT odeljenja i to: Edukativni materijali za specijalizovana IT odeljenja su kreirani u okviru projekta „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti“, kojim koordinira Program Ujedinjenih nacija za razvoj (UNDP) i na kome je Fondacija Petlja implementacioni partner, a koji se sprovodi u partnerstvu sa Ministarstvom prosvete i uz podršku Vlade Republike Srbije. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
