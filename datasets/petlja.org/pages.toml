title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Ако при креирању налога нисте добили активациони мејл (проверили сте и фолдер непожељно и остале могуће фолдере), једна ствар коју можете да покушате је ресетовање лозинке. Потребно је да одете на ову адресу. Слично, биће вам послат нови мејл са линком који ће вас одвести на страницу за промену лозинке. Не морате нужно променити лозинку (можете уписати исту), али након ресетовања, налог ће бити и потврђен. Ако и даље имате проблем, можете се обратити за помоћ коментаром loop@petlja.org. Проверите да ли сте приликом куцања лозинке наместили одговарајућу тастатуру (латинична, ћирилична, енглеска...). Проверите да ли вам је током куцања лозинке остао укључен Caps Lock. Покушајте да промените лозинку тако што ћете отићи на ову адресу. Проверите да ли сте при креирању налога употребили неки од карактера који нису дозвољени при креирању корисничког налога. Ово можете проверити на страници Креирање налога. Проверите да ли на овој страници са стране видите опције Управљање налозима, Моји кабинети, Тестови са кратким питањима. Ако их видите, ваш налог је наставнички."
