["https://petlja.org/sr-Latn-RS/n/dr%C5%BEavni-seminar-dru%C5%A1tva-matemati%C4%8Dara-srbije/104582"]
title = "Petlja"
description = "Tradicionalni Državni seminar o nastavi matematike i informatike u organizaciji Društva matematiča Srbije održava se 09. i 10. februara na Ekonomskom fakultetu u Beogradu"
full_description = "Tradicionalni Državni seminar o nastavi matematike i informatike u organizaciji Društva matematiča Srbije održava se 09. i 10. februara na Ekonomskom fakultetu u Beogradu Nastavnici matematike i informatike osnovnih i srednjih škola već znaju da u ovom periodu godine Društvo matematičara Srbije organizuje veliki državni seminar posvećen ovim naučnim disciplinama. Ekonomski fakultet u Beogradu ove godine je ugostio nekoliko stotina matematičara i informatičara iz cele Srbije. Prvi dan seminara obuhvatio je tri plenarna predavanja kao i veliki broj drugih predavanja i radionica. U plenarnom delu programa smo imali prilike da čujemo uvek zanimljivu priču o životu Mihaila Petrovića Alasa kao i predavanje posvećeno primeni matematike kroz konstrukciju frula. Treće predavanje u plenarnom delu seminara održao je i saradnik Fondacije Petlja, Dragan Mašulović autor Priručnika za analizu i prezentaciju podataka u Jupyter-u. Dragan Mašulović je govorio o primeni računarskog programiranja u nastavi matematike. Pored predavanja Dragana Mašulovića, tokom dva dana seminara svoja predavanja i radionice će održati i drugi naši saradnici poput Milene Marić, Snežane Marković, Duše Vuković, Bojane Satarić, Katarine Veljković, Jelene Hadži Purić, Jasmine Dobrić i drugih, a teme su najraznovrsnije, od objektno orjentisanog programiranja, vizuelnog programiranja, primeni robotike u nastavi do takmičenja u osnovnim i srednjim školama iz informatike. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
year_published = 2025
