["https://petlja.org/en/news"]
title = "Petlja"
full_description = "The final round of the seventeenth annual Bubble Cup competition for university and high school students was held in Belgrade, organized in collaboration with the Microsoft Development Center in Serbia. For the third consecutive year, we have organized the Summer School of Programming, which has become a traditional gathering place for students with a special interest in computer science. Over 300 students from upper elementary grades across Serbia have expressed their desire to gain knowledge and experience in the world of programming. We organized two workshops for elementary school girls in collaboration with the employees of the Microsoft Development Center Serbia. As part of a targeted support effort to schools in implementing the Digital World subject, we visited schools and conducted classes on the application of micro:bits. Spring has brought important changes in our organisation, which we believe represent a significant step towards achieving our goals. Successfully conducted training for teachers of Computer Science in the fourth grade of grammar schools for students with special abilities in computer science and informatics. From February 8th to March 25th, the Petlja Foundation organized two online training sessions on the topic of Programming for primary and secondary school teachers. The final of the 16th consecutive Bubble Cup competition for university and high school students, organized with the support of the Microsoft Development Centre Serbia, was held at the end of Septembe With the materials created for electrical engineering schools, Petlja has extended support for the teaching of IT subjects in schools The Petlja Foundation provides additional support to specialized IT classes through materials covering key computer science topics Materials for all four grades of the subject Digital World have been published on the online platform net.kabinet on the petlja.org portal. Once again, we have the opportunity to socialize in person and learn together, at the Second Summer School of Programming in Sremska Mitrovica"
