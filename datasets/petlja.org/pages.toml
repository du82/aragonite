full_description = "Групе на петљи можете направити тако што ћете отићи на овај линк и ту кликнути на дугме Направи групу. Ово ће отворити прозор у коме ћете моћи да креирате групу. Потребно је да групи дате име (то може бити име одељења на пример). Ако желите да пратите прогрес чланова те групе на Петљи потребно је да обележите да је то група за прикупљање статистике (у супротном нећете моћи да видите шта су чланови групе радили у нашим материјалима). Поље Школа није обавезно и можете га оставити празним. Ако, рецимо, имате више група са истим називом у различитим школама, ово поље вам може олакшати сналажење са тиме која је која група. Када сте ово урадили кликните на дугме Креирај и то ће направити групу. Када направите групу моћи ћете да је видите у листи ваших група. У овом тренутку ваша група је празна и постоје два начина како ваши ученици могу да приступе групи. Један је да им пошаљете линк за придруживање групи. Довољно је да ученици буду улоговани на Петљу и да оду на линк који сте им послали и придружиће се групи. Друга могућност је да им пошаљете Код за придруживање које они треба да унесу када оду на страницу Групе у контролном панелу и тамо кликну на дугме Придружи се групи."
