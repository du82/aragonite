["https://petlja.org/sr-Latn-RS/n/nova-%C5%A1kolska-godina,-novi-materijali-za-u%C4%8Denje-pro/104595"]
title = "Petlja"
description = "Od ove školske godine Računarstvo se izučava kao deo obaveznog predmeta u 7. razredu osnovne škole ali i po novom programu u 2. razredu gimnazije."
full_description = "Od ove školske godine Računarstvo se izučava kao deo obaveznog predmeta u 7. razredu osnovne škole ali i po novom programu u 2. razredu gimnazije. Fondacija Petlja je za sve osnovce i gimnazijalce pripremila nove i dodatno unapredila postojeće materijale za učenje programiranja na portalu petlja.org Na osnovu povratnih informacija od nastavnika i učenika, autorski tim Fondacije Petlja je tokom leta unapredio priručnik Programiranje grafike pomoću Pygame koji učenike 7. razreda vodi kroz osnove 2D grafike do jednostavnih animacija. Tu su i unapređeni materijali za peti, šesti i osmi razred, kao i video lekcije koje predstavljaju dodatan vid podrške nastavnicima i učenicima. Svi materijali za osnovnu školu se nalaze na lokaciji https://petlja.org/skola/osnovna Učenici 2. razreda gimnazije će od ove školske godine učiti analizu i prezentaciju podataka u Džupiter okruženju i programskom jeziku Pajton. Za njih smo spremili priručnik Računarstvo i informatika za 2. razred gimnazije pomoću kojeg želimo da ih polako uvedemo u svet podataka i donošenja zaključaka na osnovu podataka. Priručnik počinje radom u programu za tabelarna računanja Eksel i na to nadovezuje rad u okruženju za interaktivna izračunavanja Džupiter i programskom jeziku Pajton. Na kraju se obrađuju pojedine tehnike programiranja u Pajtonu u skladu sa nastavnim programom. Materijali za učenje programiranja u gimnaziji se nalaze na sledećem linku: https://petlja.org/skola/gimnazija Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
