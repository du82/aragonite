title = "Petlja"
description = """
Улогујте се да бисте започели курс                                    Улогуј се                                                        Погледај курс одмах                                                                                Преузми курс                                                        Овај курс укључује                             120 активности                                         Могућност самосталног рада                    

     Програмирање I за информатичке профиле у електротехничким школама             Овај курс је намењен ученицима електротехничких школа образовног профила Техничар информационих технологија за предмет Програмирање у I разреду, односно, образовног профила Техничар рачунара за предмет Програмирање у II разреду. Курс је такође намењен свима који желе да науче програмирање у програмском језику C. C ради на много нижем нивоу од осталих програмских језика који су данас у употреби. Због тога, C ће ти омогућити да развијаш програме високих перформанси, да боље разумеш како функционишу рачунари, па чак и да боље разумеш остале програмске језике! Уопште нису битне перформансе твог рачунарског система за програмирање у програмском језику C, нити који оперативни систем користиш. Програми из овог приручника извршаваће се на сваком рачунару, на свим оперативним системима, искомпајлирани било којим C компајлером. Битно је да се трудиш да разумеш изложене садржаје и да што више програмираш. Иако неке ствари нису јасне на почетку, немој се уплашити - након неколико урађених примера постаће јасне! Зато проучавај садржај лекција, одговарај на постављена питања, припреми рачунар, инсталирај радно окружење и што више програмирај! Овај курс Фондација Петља објавила je под лиценцом Creative Commons Autorstvo 4.0 Međunarodna Licenca (CC BY 4.0).

    


