["https://petlja.org/sr-Latn-RS/n/letnja-%C5%A1kola-programiranja-2023/104674"]
title = "Petlja"
description = "Ponovo imamo priliku da se družimo i učimo uživo, na drugoj po redu Letnjoj školi programiranja, u Sremskoj Mitrovici."
full_description = "Ponovo imamo priliku da se družimo i učimo uživo, na drugoj po redu Letnjoj školi programiranja, u Sremskoj Mitrovici. Pozivamo učenike i učenice koji su ovog leta završili peti, šesti, sedmi ili osmi razred osnovne škole da se prijave na besplatnu Letnju školu programiranja. Letnja škola programiranja će se ove godine održati u Sremskoj Mitrovici, u terminima od 28.07. do 04.08.2023. i od 23.08. do 30.08.2023. Polaznicima i polaznicama će biti obezbeđeni smeštaj i ishrana na bazi punog pansiona, u Domu učenika srednjih škola Sremska Mitrovica. Nastava će se odvijati u Mitrovačkoj gimnaziji, koja se nalazi u centru grada. Osim stručnog dela programa iz oblasti računarstva, koji će biti fokusiran na rešavanje algoritamskih zadataka u programskom jeziku Python i rad u njegovoj biblioteci za 2D grafiku Pygame, za polaznike i polaznice će biti organizovano upoznavanje i razgovori sa stručnjacima i stručnjakinjama iz IT industrije, kao i rekreativne aktivnosti poput izleta, kvizova i večeri društvenih igara. Smeštaj, ishrana i program Letnje škole programiranja su besplatni za polaznike i polaznice, dok troškove prevoza snose roditelji ili staratelji. Za prijavljivanje je potrebno da kandidat ima kreiran nalog na portalu petlja.org. Zainteresovani učenici i učenice treba da se prijave najkasnije do 05.07.2023, do 21 čas, tako što će zajedno sa roditeljem ili starateljem popuniti upitnik koji se nalazi na sledećem linku: https://petlja.org/prijavni_formular. Iako delove upitnika popunjavaju sa roditeljem ili starateljem, važno je da na pitanja iz upitnika koja se tiču dosadašnjeg susretanja sa programiranjem učenici i učenice odgovore samostalno. Nakon zatvaranja prijava 05.07.2023. godine, svi prijavljeni kandidati i kandidatkinje koji su uspešno popunili prijavni formular dobiće mejl sa dodatnim informacijama i linkom ka testu znanja iz programiranja koji će moći da urade u periodu od 06.07. u 10 časova do 08.07. u 10 časova. Test će se raditi u tekstualnom programskom jeziku Python na Petljinoj platformi. Napominjemo da Fondacija Petlja zadržava pravo da organizuje i drugi krug testiranja, kao i da kandidata ili kandidatkinju za koje se ustanovi da su prilikom testiranja prepisivali diskvalifikuje."
