full_description = "The category contains blocks which reproduce tones/melodies, the block that serves as a “trigger” for activating the program when a melody is played, as well as the block for storing the values of basic tones and their duration in milliseconds. We will have to drag the block from the category onto the work surface, and then we insert the block into it. From the drop-down lists of the given block, we will choose the tone and its duration in milliseconds. If we want to play a melody (a series of notes lasting a certain amount of time, and played one after the other) we use the block , from the drop-down list of this block we will choose the melody and how long it will last (whether it will be played once, forever, …)"
