["https://petlja.org/sr-Latn-RS/n/-zimska-%C5%A1kola-programiranja-za-osnovce-i-zimski-se/104579"]
title = "Petlja"
description = "U ponedeljak, 04. februara u prostorijama Računarske gimnazije u Beogradu počela je četvorodnevna Zimka škola takmičarskog programiranja za osnovce i Zimski seminar za nastavnike informatike"
full_description = "U ponedeljak, 04. februara u prostorijama Računarske gimnazije u Beogradu počela je četvorodnevna Zimka škola takmičarskog programiranja za osnovce i Zimski seminar za nastavnike informatike Sa ciljem popularizacije takmičarskog programiranja u osnovnim školama, Fondacija Petlja i Računarska gimnazija iz Beograda su pred početak nove sezone takmičenja iz informatike udružile snage i organizovale Zimsku školu takmičarskog programiranja za osnovce. Škola je namenjena kako dosadašnjim takmičarima okružnog, državnog ili SIO nivoa takmičenja tako i mladim matematičarima i fizičarima koji su prošle godine učestvovali na državnom nivou takmičenja iz ovih oblasti a koji bih želeli da nauče osnove programiranja u programskom jeziku Pajton. Paralelno sa Zimskom školom koja je namenjema učenicima, u Računarskoj gimnaziji se održava i Zimski seminar za nastavnike informatike u osnovnim školama. Cilj seminara je osnaživanje nastavnika koji učenike pripremaju za takmičenja. Zimsku školu pohađa 65 učenika, dok je na seminar namenjen nastavnicima informatike došlo 32 nastavnika. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
year_published = 2025
