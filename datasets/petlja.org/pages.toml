["https://petlja.org/en/library/r/lekcije/BlockBasedProgMakeCodeEng/project-task---hot-and-cold"]
title = "Petlja"
full_description = "Same as you, the programs in MakeCode can make decisions. Until now, all the programs we have created were linear programs, or more specifically, programs where commands are executed consecutively, one after the other until the end of the program. Unlike these programs, where every step, i.e. every command, is executed once, in decision-making algorithms, or more precisely, conditional (branch) algorithms some of the commands will be executed, and some won’t, which will depend on whether the condition has been fulfilled or not. We will demonstrate this concept by programming the Hot and Cold game. Based on the position of the character (player), a message is displayed how far it is from an object placed somewhere in the world. If the character is close the word Hot will be said, and if the character is far away from the object the word Cold will be said. If the character (player) is very close to the object the program will say Scorching, and if it is very far away, the program will say Freezing. Thinking about the task: To determine the distance of an object to the character (player) we need to measure the distance between them, and based on those values we will get the desired message. At the very beginning we need to define the object and place it in the world, which we will do in the on start block. We will define the position in such a way that the coordinate X has a random value from the interval 0 to 600, and the remaining two coordinates have the value Y and Z of the player. To achieve this we need to create the variables X, Y, Z (they store the coordinates of the object’s position) and Block (stores the object). We also need to set initial values for the variables we created. In the block we will define the position and the type of the object by dragging the blocks in the following manner: we define the coordinate x with the variable X, which will have the random value from the interval 0 to 600, this is achieved with the block . we define the coordinate y with the variable Y, which will have the value of the y coordinate of the player’s position in the world. This is achieved with the block ."
year_published = 2025
