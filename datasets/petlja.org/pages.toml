full_description = "Na Takprog delu Petlja portala (https://takprog.petlja.org/srednjaskola/) objavljene su informacije o ovogodišnjem ciklusu takmičenja. Dragi učenici i profesori, na Takprog delu Petlja portala (https://takprog.petlja.org/srednjaskola/) objavljene su informacije o ovogodišnjem ciklusu takmičenja. Ove godine vas očekuju neke novine, prvi put će biti 3 kruga kvalifikacija, a najbolji će imati priliku da prođu direktno na državno takmičenje! Prvi krug će početi već 21. decembra. Na sajtu možete pročitati sve informacije, i izvršiti registraciju za ovu školsku godinu. Obratite pažnju na izmene u pravilniku, i na novi program takmičenja Želimo vam puno uspeha na takmičenju, a za sva pitanja vam stojimo na raspolaganju na Algori: https://algora.petlja.org/ Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
