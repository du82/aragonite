full_description = "Да би приступио/ла такмичењу, треба да одеш на део Петљиног портала који се зове „Арена” и налази се на овом линку . Ту, међу „Активним такмичењима”, треба да изабереш оно на којем учествујеш. Неким интерним такмичењима ћеш моћи да приступиш и преко анонимног налога који ти је можда професор/ка доделио/ла на часовима у школи, али имај у виду да на званичним такмичењима нећеш моћи да се региструјеш уколико користиш анонимни налог, већ ћеш морати да приступиш такмичењу пријављен/а преко свог личног налога. Ту ћеш такође моћи да нађеш и поља која се зову „Будућа такмичења” и „Претходна такмичења”. Будућа такмичења представљају такмичења за која си пријављен/а, али још увек нису почела, а Претходна такмичења представљају такмичења на којима си учествовао/ла, али су завршена."
