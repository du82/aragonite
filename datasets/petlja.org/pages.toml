full_description = 'Kroz kurs "Šta mi to zagađuje vazduh?" naučićeš kako svako od nas ostavlja svoj otisak prilikom zagađenja planete Zemlje, koje su posledice zagađenja na životnu sredinu i zdravlje ljudi. Takođe , potrudićemo se da damo odgovor na pitanje kako svaki pojedinac može da utiče na smanjenje zagađenja. Ovo je interdisciplinarni kurs koji ovu temu obrađuje iz ugla više nastavnih predmeta, biologije, hemije i informatike. Kurs je namenjen učenicima osnovnih škola. Kroz sadržaj možeš prolaziti samostalno, saradnički sa svojim drugarima i nastavnicima. Курс је настао у оквиру пројекта ,,Школе за бољи квалитет ваздуха’’, који спроводи УНИЦЕФ у Србији уз финансијску подршку Краљевине Норвешке.'
