["https://petlja.org/zbirke"]
title = "Petlja"
description = """
Metodička zbirka zadataka iz osnova programiranja                                                        Sa rešenjma za Pajton"""
full_description = "Metodičke zbirke algoritamskih zadataka predstavljaju jedinstven put u učenju programiranja na kome se uči kroz praksu - pisanjem kodova koji treba da odgovore na zahteve postavljene u zadacima. Rešenje koje napisete za svaki od ovih zadataka možete automatski testirati na našem sistemu. Sami zadaci propraćeni su detaljno objašnjenim rešenjima, a svi glavni koncepti obrađeni u Zbirkama, bilo da se radi o osnovnim pojmovima ili naprednim tehnikama, korisnici su, pored rešenja zadataka, približeni i kroz teorijske tekstove, uglavnom smeštene na pošetke poglavlja. Zadatke u Zbirkama možete rešavati u svim programskim jezicima podržanim na Petlji, a pored toga ponuđena su rešenja i objašnjenja najvažnijih koncepata za Pajton (na osnovnom nivou učenja) и С++/С# (na svim nivoima). U ovoj zbirci nalaze se zadaci namenjeni početnim nivoima učenja programiranja i priprema za takmičarsko programiranje. Zbirka predstavlja kolekciju rešenih zadataka u tri programska jezika, Pajtonu, C++, C#. Ovu zbirku preporučujemo učenicima srednjih škola koji uče programiranje, takmičarima u osnovnim školama i svima koji samostalno žele da počnu sa učenjem algoritamskog programiranja. Ova zbirka predstavlja kolekciju rešenih zadataka fokusiranih na uvod u naprednije algoritme i strukture podataka. Zbirka je namenjena onima koji žele da se ozbiljnije posvete učenju algoritmike (takmičari, studenti) i zahteva potpuno vladanje programskim jezikom i određeno predznanje iz algoritmike. Zbirka predstavlja kolekciju rešenih zadataka koji obuhvataju odabrane algoritme i strukture podataka za rad sa grafovima, analizu teksta, algebarske algoritme (pre svega iz oblasti teorije brojeva) i geometrijske algoritme. Zbirka je namenjena onima koji su odlučili da se ozbiljno posvete izučavanju programiranja (studenti, takmičari, profesionalci...). Rešavanje ovih zadataka zahteva potpuno vladanje programskim jezikom i značajno predznanje iz algoritmike."
