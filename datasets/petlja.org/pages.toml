["https://petlja.org/en/library/r/lekcije/BlockBasedProgMakeCodeEng/makecode-and-microbit"]
title = "Petlja"
full_description = "Before we begin the story of Micro:bit programming through MakeCode, let’s get acquainted with the basic components and features of Micro:bit and the work environment. Micro:bit is a portable, user-programmable computer, which has a 32-bit ARM Cortex-M0 processor working on 16MHz with only 16KB RAM memory, as well as sensors and a screen made of 25 LEDs. It has connectors, five inputs and outputs (I/O) used to connect the Micro:bit to other devices or sensors, it also has Bluetooth, and it is powered by two AA batteries. Most importantly, it has the ability to program. Light Emitting Diode (LED) is a diode, which emits light. Micro:bit has 25 LEDs (arranged in a 5x5 grid), they are individually programmable and depending on the program, they can display text, numbers and images. On the front of the Micro:bit device, there are two buttons (labelled A and B). Pressing each button individually or both buttons simultaneously triggers the code on the device. LEDs are located on the front of the Micro:bit. In this case, they play the part of an input device. LED screen works as a basic light sensor, which can detect the intensity of the ambient light. The temperature sensor allows the Micro:bit to detect the current ambient temperature, in degrees Celsius. Accelerometer - is the component which registers movements, changes in speed and position, that is, it is possible to measure the speed of movement. With this component, the Micro:bit registers when it has been moved. It is also possible to detect other actions, such as shaking, tilting or free fall. The compass detects the earth’s magnetic field, which allows us to detect which direction the Micro:bit is facing. The compass needs to be calibrated before it can be used. “Calibrating” the compass provides a precise reading of the direction. When the calibration starts, Micro:bit will display the instruction “Draw a circle” or “Tilt to fill screen”. To calibrate the compass, you will have to follow the instruction and tilt the Micro:bit in a circle to move the dot in the center of the screen until the outline of the circle is displayed or the entire screen is filled with dots."
year_published = 2025
