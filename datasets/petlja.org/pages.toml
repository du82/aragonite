["https://petlja.org/biblioteka/r/lekcije/documentation/korisnicki_nalozi-mladji_od_15"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Према политици приватности портала petlja.org, свим лицима млађим од 15 година неопходно је да кориснички налог отвори родитељ или законски старатељ. У супротном, они сами неће моћи да отворе налог и неће моћи да користе неке функционалности портала petlja.org (као што су аутоматско оцењивање задатака, учествовање на такмичењима на нашем порталу и сл.) Ово упутство помоћи ће вам да отворите налог детету млађем од 15 година чији сте родитељ или законски старатељ. Пре него што почнете, неопходно је да и ви имате отворен налог. Ако га до сада нисте отворили, то можете учинити овде. Када сте креирали налог, потребно је да одете на свој кориснички панел. То можете урадити тако што ћете отићи на овај линк и ту изабрати опцију Додајте нови налог за дете, као на слици испод. Када кликнете на ово дугме, требало би да вам се појави прозор као овај на слици испод. У горње поље унесите корисничко име које желите да ваше дете користи, и испод упишите лозинку која ће се користити са тим корисничким именом. Неопходно је да прочитате и прихватите услове коришћења како бисте могли да отворите налог, што ћете урадити обележавањем поља Прихватам услове коришћења за своје дете. Након тога, кликните на дугме ДОДАЈ НАЛОГ и налог ће бити креиран. Када се ово деси, видећете нови налог у листи налога. Ако желите да промените корисничко име или лозинку налога који сте направили, то можете урадити кликом на точкић са десне стране и затим је потребно да на прозору за измену података унесете ново корисничко име или лозинку и кликнете на дугме ИЗМЕНИ како би налог био промењен."
