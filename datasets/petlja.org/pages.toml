title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Zaposlen u Microsoft razvojnom centru Srbija od 2010. godine i dugogodišnji stručni saradnik seminara Primenjene fizike i elektronike u IS Petnica. Diplomirao na Elektrotehničkom Fakultetu, smer Elektronika, u Beogradu gde je završio i Matematičku Gimnaziju. Pre Petlje organizovao rad portala BubbleBee. Mr Dragan Stojanović od 2008. godine je zaposlen na Računarskom fakultetu u Beogradu kao asistent. Rođen je 15.01.1954. godine u Beogradu. Osnovnu školu i gimnaziju završio je u Boru, a Elektrotehnički fakultet u Beogradu 1978. godine. Na istom fakultetu je magistrirao 1984. godine sa tezom “Određivanje parametara lavinskog proboja u p-n spojevima“. U Institutu za nuklearne nauke Vinča, Centar za permanentno obrazovanje, počeo je da radi 1979. god. Radio je na mestu asistenta, predavača, a zatim i na mestu direktora Centra. Godine 1993. prelazi u preduzeće CET Computer Equipment and Trade, doo. kao direktor preduzeća. Profesor Matematičkog fakulteta u Beogradu, na kom je diplomirao 2002. i doktorirao 2009. godine u oblasti automatskog rezonovanja. Nekoliko prethodnih godina je predsednik komisije za informatiku Društva Matematičara Srbije. Višegodišnje iskustvo u radu sa mlađom populacijom sticao je kao nastavnik Računarske i Matematičke gimnazije u Beogradu. Aktivno je od samog početka uključen u izradu nastavnih materijala na portalu Petlja. Dragan Tomić je trenutno na poziciji VP of Engineering u Databricks-u. Pre Databricks-a je radio skoro 25 godina u Microsoft-u i bio je jedan od ključnih ljudi u lokalnom razvojnom centru. Dragan je stručnjak za baze podataka, klaud servise i distribuirane sisteme. Završio je univerzitetsko obrazovanje u Americi, konkretno na University of Washington, Texas Tech University. Dok je bio na fakultetu bio je takmičar (eng. ICPC) i jedan je od pokretača Bubble Cup-a. Sa radom Petlje je upoznat od samog početka. Pored Petlje takođe je doprineo stvaranju Inicijative Digitalna Srbija, Pupin Inicijative i BIT škola za prekvalifikacije."
