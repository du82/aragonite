["https://petlja.org/sr-Latn-RS/n/budi-data-driven-/104640"]
title = "Petlja"
description = "Fondacija Petlja sa projektom Budi data driven učestvuje u programu društvene odgovornosti Svet kakav želiš, kompanije A1 Srbija."
full_description = "Fondacija Petlja sa projektom Budi data driven učestvuje u programu društvene odgovornosti Svet kakav želiš, kompanije A1 Srbija. Kompanija A1 Srbija će u okviru programa društvene odgovornosti Svet kakav želiš podržati tri projekta, po jedan iz oblasti obrazovanja, javnog zdravlja i ekologije, sa ukupnim nagradnim fondom od 10 miliona dinara. Projekti u okviru programa će dobiti 2, 3 ili 5 miliona dinara, u zavisnosti od broja osvojenih glasova. Za projekat koji smatrate najvažnijim možete glasati na stranici https://svetkakavzelis.rs/. Fondacija Petlja u programu Svet kakav želiš učestvuje sa pojektom Budi data driven čiji će rezultat biti besplatan, interaktivni kurs na temu obrade, analize i vizuelizacije podataka pomoću programskog jezika Pajton. Kurs će biti prilagođen nivou znanja srednjoškolaca i studenata netehničkih nauka, što omogućuje svakome ko je zainteresovan da zakorači u svet obrade i vizuelizacije podataka. Tumačenje podataka, donošenje zaključaka na osnovu njihove analize i odgovarajuće vizuelno predstavljanje podataka, danas su veštine koje su nezaobilazne u gotovo svim sferama života - privredi, medijima, obrazovanju, svakodnevici. Gotovo da nema fenomena koji se ne može sagledati kroz prizmu analize i obrade podataka, i to pogotovo sada, kada su sirovi podaci sve dostupniji u ogromnom broju oblasti. Koliko je bezbedno da se vakcinišem? Koliko je vazduh koji dišem čist? Kakva je ekonomska situacija u mom okruženju? Da li mogu nešto da uradim kako bi sajt koji pravim bio posećeniji? Da li su u mom okruženju muškarci i žene ravnopravni? Odgovori na ovakva pitanja kriju se, između ostalo i u podacima u podacima i zato želimo da, kroz ovaj kurs, svakome ko je zainteresovan omogućimo da, uz pomoć programerskih alata, svom aresnalu veština doda i analizu, obradu i vizuelizaciju podataka, koje će moći da koristi za bolje razumevanje svog orkuženja, bilo da se radi o poslu, društvu, prirodi ili nekoj drugoj oblasti."
