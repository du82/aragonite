full_description = "A computer needs containers for storing numbers, texts, and other information, so it can make some decisions based on that information. For example, if we want to do a weather forecast, we need variables such as temperature, time of day, days of the week, precipitation, etc. A variable can be understood as a space in the computer memory, something like a box, in which, during the execution of the program, we can store some interim values. (e.g. Number of trees planted in the world). Every variable stores a specific type of information. The first time we use it, we need to define its type (number, string (text - a string of alphanumeric characters), logical (true, false)). From that moment until the end of the program, we can only store that specific type of information in that variable. Important: Choosing the right name for the variable makes it easier to understand the programs we created. For example, if we want to store the number of player’s lives in a game, we can name the variable number_lives, which would be better than alive or number. The names of variables contain letters, numbers, and special character _(underscore), and they must always begin with a letter. In the previous example, we saw that the position of an object (character, world) is a special kind of variable, which contains three numbers that describe a particular location in the three-dimensional space. These numbers are called X, Y and Z coordinates. We will use an example of a program, which counts the number of trees planted by the character while moving around in the world, to demonstrate how we can create and use variables. Thinking about the task: Trees are planted by moving around in the world. Every time a tree is planted, the number of trees in the world rises. A variable is created in the following manner, in the category Variables (1), click on the button Make a variable (2) and type in the name of that variable in the field (3), in our case Counter . By clicking the button OK (4), you have created a variable (5):"
