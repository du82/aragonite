["https://petlja.org/raspetljavanje/1"]
title = "Raspetljavanje"
full_description = 'RasPETLJAvanje je besplatan onlajn program podrške učenju programiranja koji Fondacija Petlja realizuje u sklopu projekta „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti“, koji sprovodi Program Ujedinjenih nacija za razvoj u partnerstvu sa Ministarstvom prosvete, a uz podršku Vlade Republike Srbije. Naši predavači su mladi programeri koji se još uvek živo sećaju kako su izgledali prvi programerski koraci. Važno im je da svako ko želi, ima otvoren put ka raspetljavanju programerskih nedoumica. Verujemo da ćeš uživati slušajući ih na snimcima predavanja! "Kada nam je profesor rekao za ovaj program razmišljala sam da li da se prijavim jer nisam bila sigurna da li ću moći da pratim tempo. Sada mogu da kažem da je ovo bila jedna od boljih odluka u mom životu. Predavači su bili jako posvećeni i uvek tu da nam pomognu. Celom timu rasPETLJAvanja dugujem veliku zahvalnost za svaki red koda. rasPETLJAvanje mi je mnogo pomoglo i u školi jer se poklopilo da radimo gotovo isto što i na rasPETLJAvanju. Takođe, mnogo su mi značila predavanja na kojima smo obraćali pažnju na greške, jer sam, moram se pohvaliti, uspevala da nađem greške u kodovima. Iskreno se nadam da će biti još ovakvih aktivnosti, jer ću se ja sigurno pridružiti a do tada hvala na svemu što ste nam pružili za ova četiri meseca!" "Bilo mi je predivno na rasPETLJAvanju ali mi je jako žao što je gotovo i volela bih da bude još ovakvih Petljinih kurseva." "Mnogo mi je značilo što su se sva predavanja snimala i što smo imali playlistu, tako da sam u svakom trenutku mogla da se vratim i pogledam ukoliko sam neko od predavanja propustila." "Drago mi je što sam se prijavila za rasPETLJAvanje, naučila sam dosta korisnih stvari. Žao mi je što nisam mogla da prisustvujem svakom času jer sam februara i marta meseca imala dosta takmičenja koja su se održavala subotom, ali sam se trudila sam uvek kada imam slobodnog vremena pogledam predavanja sa prethodnog casa. Veoma je bilo zanimljivo učestvovati u rasPETLJAvanju i planiram da u toku letnjeg raspusta ponovo odradim sve zadatke."'
year_published = 2025
