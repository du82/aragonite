["https://petlja.org/en/library/r/lekcije/BlockBasedProgScratch/variables"]
title = "Petlja"
full_description = "We believe that you know multiple people can use one program and that you know this from your own experience. We create programs with the intention of making solving and performing tasks easier. We create them to have fun, relax, and connect with other people. The fact that one program can be used by multiple people, who enter their data and receive corresponding results, tells us that programming has an excellent concept of managing and using computer memory. Think of the memory of a digital device as being a huge, we mean enormous, almost endless room with rows and rows of shelves. Now, imagine that you can put data into every compartment on every shelf. Finally, imagine that you can name each of these compartments whatever you wish and, as soon as you call its name, the information in it becomes immediately available. We call these “compartments” of computer memory variables. A variable can potentially contain only one piece of information (a number, string, values true or false, etc.). Let’s look at the situation where the user enters 4 numbers, then the program adds the numbers and displays the sum. It is true that the block Ask and wait allows the user to enter a certain value, which will then be placed in the variable . Nevertheless, what happens when we need 4 answers? Q-12: The user enters the following numbers one after the other: 5, 10, 15 and 20. When the program shown in the figure runs, the sprite will say: It is obvious that we need more than one variable for the program to be able to display the correct sum. We create the variables in the category Variables, by clicking on the button Make a variable. A window will open where we can type in the name of the variable, and then we decide if we want to make it available to all sprites or only to the sprite that is active while we are creating the variable. We can also check the option that saves the variable on the server, in the data cloud. Finally, clicking the button OK creates the variable. In the figure below, we can see the block, which will become available to us once we have created the variable. With the first block, we will set the value of the variable, the second one we can use if we want to increase or decrease that value, while the third and the fourth are used to make the variable visible or to hide it."
year_published = 2025
