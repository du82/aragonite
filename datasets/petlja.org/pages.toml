description = "Fondacija Petlja je pripremila još jedan priručnik za gimnazijalce sa posebnim sposobnostima za računarstvo i informatiku"
full_description = "Fondacija Petlja je pripremila još jedan priručnik za gimnazijalce sa posebnim sposobnostima za računarstvo i informatiku Priručnik C# programiranje grafičkog interfejsa (GUI) je namenjen pre svega učenicima gimnazija u odeljenjima poznatim kao specijalizovana IT odeljenja, ali i svima koje ova tema više zanima. Zamišljen kao dopunski materijal i dodatna podrška nastavi. Primeri su pisani u programskom jeziku C# jer je to jezik koji se najčešće koristi na ovom smeru u gimnazijama. Poslednjih par decenija GUI je dominatan oblik interfejsa na dekstop i laptop računarima. Pored svoje široke primene koju GUI danas ima, on predstavlja i dobru priliku da se programiranje vežba na zanimljiviji način, pa je s razlogom našao svoje mesto u školskim programima. Zbog toga je autorski tim u Fondaciji Petlja procenio da jedan ovakav materijal treba da postoji među brojnim edukativnim resursima na portalu petlja.org i da će naći svoj put do talentovanih đaka i doprineti formiranju budućih stručnjaka u ovoj oblasti. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
