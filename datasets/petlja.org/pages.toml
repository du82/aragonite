["https://petlja.org/sr-Latn-RS/n/mikropajton-za-mikrobit-%E2%80%93-priru%C4%8Dnik-za-projektnu-n/104625"]
title = "Petlja"
description = "U okviru projekta „Škole za 21. vek“ autorski tim Fondacije Petlja je pripremio priručnik za izradu projekata koji koriste uređaj Mikrobit uz programski jezik Mikropajton"
full_description = "U okviru projekta „Škole za 21. vek“ autorski tim Fondacije Petlja je pripremio priručnik za izradu projekata koji koriste uređaj Mikrobit uz programski jezik Mikropajton Fondacija Petlja, kao partner na projektu „Škole za 21. vek“ koji sprovodi British Council, a finansira Vlada Velike Britanije radi na kreiranju edukativnih resursa za učenje programiranja u osnovnoj školi uz pomoć uređaja Mikrobit (micro:bit). Prvi priručnik Programiranje mikrobit uređaja u Mikropajtonu - priručnik za projektnu nastavu za sedmi i osmi razred koji je naš autorski tim kreirao namenjen je projektnoj nastavi u sedmom i osmom razredu osnovne škole i oslanja se na primenu Mikropajtona za upravljanje uređajem Mikrobit. U Priručniku se nalazi obilje detaljno objašnjenih primera različite težine za izradu projekata koji učenici zajedno sa svojim nastavnicima mogu da izrade. Autorski tim koji je radio na izradi Priručnika se trudio da kreira što raznovrsnije primere kako bi demonstrirali različite mogućnosti koje ovaj mali programabilni uređaj pruža. Uz primere projekata su dati i dodatni resursi namenjeni učenicima koji žele dalje da istražuju i osmisle svoje samostalne projekte i iskažu kreativnost u upotrebi Mikrobita. Pored Priručnika koji je danas objavljen, naš autorski tim će izraditi i edukativne resurse koji su namenjeni upotrebi mikrobit uređaja u okviru predmeta Informatika i računarstvo u petom razredu kao deo nastavne teme Računarstvo, kao i u okviru predmeta Tehnika i tehnologija kojem će naši materijali pokriti nastavne teme Tehnička i digitalna pismenost i Konstruktivno modelovanje. Podsetimo, „Škole za 21. vek“ je trogodišnji projekat kojim je predviđeno da sve osnovne škole na teritoriji Zapadnog Balkana do sredine 2021. godine dobiju uređaje Mikrobit koje će koristiti kako u nastavi računarstva tako i u drugim predmetima. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi."
