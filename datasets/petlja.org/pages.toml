["https://petlja.org/en/library/r/lekcije/BlockBasedProgScratch/looks"]
title = "Petlja"
full_description = "In Scratch, sprites have one or more costumes. The option to change costumes gives us the opportunity to create interesting programs and animations. For this purpose, we use the blocks from the category Looks. We will create a program called Farm, which has two sprites - a girl Avery and a Chick. We will place them in the environment of a farm (backdrop Farm). We will put the chick in the girl’s hand. The girl will “feed” the chick and watch it grow. Watch the process of creating the program, which allows the sprites to think, speak, and change their size and costumes: In addition to everything mentioned above, the block was crucial for the proper functioning of our program. Repetition is a powerful concept because it makes the code shorter, clearer, and easier to debug. By using repetition, we allowed the chick to “move”, i.e. we ensured the repetition of the command that changes the costume. The repetition blocks are located in the category Control. This category contains important blocks used for controlling the flow of the program. Create a program, which will simulate the functioning of a traffic light. Little help: The lights on a traffic light do not change at the same speed. Red and green lights stay on longer than the yellow. Watch the process of creating the program, which allows you to simulate the functioning of a traffic light: Q-4: We draw your attention to the existence of blocks that execute similar commands to the ones we have presented in this lesson. For example, the block ensures that sprite’s speech does not disappear from the stage. We assume that you can conclude what is the purpose of the block . The same way we can choose sprite’s costumes, we can also choose the stage backdrop by using the block . The blocks that allow us to show or hide a sprite are also very useful. We will use these blocks in the following lessons. We will let you discover for yourself how you can play with the color and look of your sprite by using blocks for changing the color or effect (change…), setting the color or effect (set…), as well as for deleting all graphic effects (clear graphic effects):"
