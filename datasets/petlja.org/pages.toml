["https://petlja.org/sr-Cyrl-RS/n/raspetljavanje-3.0-%E2%80%93--stara-aktivnost-u-novom-odel/104720"]
title = "Petlja"
description = "Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad."
full_description = "Припремили смо нови циклус бесплатног програма расПЕТЉАвање, овог пута са већим фокусом на менторски рад. РасПЕТЉАвање је наш бесплатан програм подршке учењу програмирања који по трећи пут организујемо у сарадњи са Програмом Уједињених нација за развој, а уз подршку Министарства просвете. Нови циклус расПЕТЉАвања фокусиран је на ученике и ученице узраста од 11 до 18 година који немају претходног искуства у програмирању. Полазници ће имати прилику да уче програмирање путем интерактивних курсева са интегрисаним видео лекцијама уз континуирану менторску подршку. На овај начин ће полазници имати прилику да лакше савладају основе програмирања. Програм расПЕТЉАвања је прошло преко 600 полазника и полазница којима смо пружили подршку у самосталном учењу програмирања у претходне две године. Ове године уводимо измене у програм и омогућићемо континуирану менторску подршку током трајања активности. Полазници и полазнице ће бити распоређени у менторске групе према узрасту и ритму савладавања градива. Задатак ментора ће бити да прате напредак полазника и полазница, а посебан акценат биће на индивидуализованом приступу учењу прилагођеном потребама сваког полазника."
