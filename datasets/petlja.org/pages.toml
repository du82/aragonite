["https://petlja.org/biblioteka/r/lekcije/beebot_prirucnik/04_vodic-index"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Постављање Играонице Пчелице робота и организовање игара у овако осмишљеном заједничком простору вртића тражи пажљиво планирање и промишљено деловање васпитача. Предложени кораци вам могу помоћи да ваша Играоница Пчелице робота постане омиљени простор за све. При планирању Играонице Пчелице робота водите рачуна о следећем: Циљ. Циљ играонице је да у оквиру заједничког развијања реалног програма у вртићу пружи нове доживљаје, искуства и сазнања деце и прошири постојећа. Професионални развој и истраживање. Потребно је да проширите сопствене професионалне компетенције, а које ће вам помоћи у разумевању начина примене Пчелице и сличних робота у оквиру интегрисаног учења деце. Ослоните се на овај приручник као први корак у том смеру. Будите спремни на даље промишљање и истраживање теорије и праксе примене Пчелице и сличних робота у непосредном раду са децом. Укључивање свих васпитача и хоризонталне размене. Како се Играоница пчелице робота планира у заједничком простору вртића, важно је да она заживи као део реалног програма у свим васпитано образовним групама које деле тај простор. Да бисте у томе успели, важно је да одржите почетне састанке са колегама васпитачима и упознате их са идејом, могућностима и начинима коришћења простора у оквиру Играонице Пчелице робота. Поделите са њима своју визију овог простора и договорите начин на који ће се она реализовати у пракси свих предшколских васпитно-образовних група. Пажљиво планирајте активно укључивање васпитача и стручних сарадника, редовне хоризонталне размене са колегама, у вртићу и шире. Трудите се да стално заједно промишљате и планирате како да изменама у простору Играонице и играма Пчелицом роботом подржите даље развијање актуелних тема/пројеката и унапређујете све процесе који се у оквиру Играонице Пчелице робота дешавају."
