["https://petlja.org/sr-Latn-RS/projekti/Podaci"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Ako si student/studentkinja treće ili četvrte godine osnovnih studija na nekom od fakulteta iz domena društveno-humanističkih nauka ili si na master studijama iz oblasti društveno-humanističkih nauka, a zanima te da naučiš nešto više o otvorenim podacima, kako da ih obradiš, analiziraš i prezentuješ uz pomoć programskog jezika Python i Jupyter okruženja, pozivamo te da se prijaviš i da nam se pridružiš na Zimskoj školi. Planirano je da na Zimskoj školi bude između 25 i 30 polaznika. Da bi se prijavio/prijavila, klikni na dugme Prijavi se na dnu strane i popuni prijavni formular. Ako pogledaš oko sebe primetićeš da su podaci svuda oko nas, danas više nego ikada. Gotovo izvesno si se do sada na osnovnim studijama susreo/susrela sa pojmovima poput uzorak, medijana, regresiona analiza, korelacija... Svi ovi pojmovi iz statistike se takođe primenjuju kada imaš velike setove podataka, a još bolje je ako su ti setovi podataka dostupni svima i u mašinski čitljivom obliku, odnosno, ako su u pitanju otvoreni podaci. Dodatno, kada imaš pred sobom baš veliki skup podataka računar ti može pomoći da te podatke struktuiraš, obradiš, analiziraš i na kraju doneseš zaključke. Čime god sutra da odlučiš da se baviš, bilo da ćeš nastaviti svoj put u nauci, obrazovanju ili privredi, veština izvođenja zaključaka na osnovu podataka će ti biti potrebna. Da bi mogao/mogla da doneseš zaključke moraćeš da znaš i kako da podatke prikupiš, obradiš i analiziraš. Konačno, i to je jednako važno, biće ti potrebna i veština da zaključke do kojih si došao/došla prezentuješ drugima na razumljiv i jasan način. Ovu Zimsku školu treba da posmatraš kao ulazak u svet analize i zaključivanja na osnovu podataka kao i sticanja osnovnih veština programiranja koja će ti kao studentu društveno-humanističkih nauka biti potrebno. To znači da ćemo te za mesec dana naučiti: Klikni na dugme Prijavi se na dnu strane i popuni prijavni formular. Za popunjavanje prijavnog formulara ti neće trebati više od 15 minuta. Rok za prijavu na Zimsku školu je nedelja, 26. januar 2020. godine do 20.00 časova . Izabrane kandidate ćemo kontaktirati do kraja januara, a prvo predavanje je zakazano za početak februara."
