["https://petlja.org/en/library/r/lekcije/BlockBasedProgMakeCodeEng/working-with-blocks-from-the-loops-category"]
title = "Petlja"
full_description = "There are processes in nature that are repeated constantly or from time to time. As in nature, in programming, sometimes it is necessary to repeat certain parts of the program several times. We have already mentioned that repeating one or more commands (blocks) is a powerful concept in programming. When some of the program commands are repeated several times, we say that the program contains loops. We have used this concept several times before. MakeCode has three types of blocks into which other blocks, whose execution needs to be repeated, can be inserted. Blocks can be repeated: We should use this block when we know the exact number of repetitions in advance (they are also called iterations). This is one of the most frequently used blocks. The running of this block is stopped when the user clicks the stop button (). We should use this block when we do not know how many times blocks inserted into the repetition block should be executed, and therefore, we want them to run until a certain condition is fulfilled. Blocks, which need to be repeated, are dragged and inserted into repetition blocks. The block, which will repeat other blocks an exact number of times, can be used to reproduce the tone C three times. The block for repeating commands will be executed an infinite number of times. The running will never stop on its own. We can stop the running by clicking on the stop button (). We used the blocks for repeating in our previous lessons when we displayed the animation of a square. Q-9: Analyze the look of the blocks. You can see that the forever block used for repeating commands indefinitely does not have the option for connecting to other blocks, other blocks cannot be added onto it. Why? The block which repeats other blocks (commands) runs until a specific condition is fulfilled. The blocks within this block are executed based on checking whether the condition is fulfilled or not. We use this block when we do not know how many times we need to repeat the commands inside it, and we want them to run until a specific condition is fulfilled."
year_published = 2025
