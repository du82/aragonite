["https://petlja.org/sr-Cyrl-RS/vesti"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Позивамо све заинтересоване наставнице и наставнике разредне наставе из школске управе Зрењанин да се пријаве на обуку за примену микробит уређаја у настави. Припремили смо нови циклус бесплатног програма расПЕТЉАвање, овог пута са већим фокусом на менторски рад. У Београду одржано финале седамнаестог по реду Bubble Cup такмичења које организујемо у сарадњи са Развојним центром Мајкрософта у Србији. Са приручником намењеним васпитачима и васпитачицама Петља проширује своју подршку и на предшколске установе. Фондација Петља наставља да пружа подршку настави програмирања у електротехничким школама. Трећу годину за редом организовали смо Летњу школу програмирања која је постала традиционално место окупљања ученика и ученица са посебним интересовањем за информатику. Преко 300 ученика и ученица старијих разреда основних школа из целе Србије изразило је жељу да стекне нова знања и искуства у свету програмирања. У сарадњи са запосленима из Мајкрософтовог развојног центра у Србији смо организовали две радионице за девојчице основних школа. Отворене пријаве за трећу по реду Летњу школу програмирања која ће се поново одржати у Сремској Митровици."
