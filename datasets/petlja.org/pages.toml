["https://petlja.org/sr-Cyrl-RS/n/zavr%C5%A1eno-17.-bubble-cup-takmi%C4%8Denje-/104719"]
title = "Petlja"
description = "U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji."
full_description = "У Београду одржано финале седамнаестог по реду Bubble Cup такмичења које организујемо у сарадњи са Развојним центром Мајкрософта у Србији. Bubble Cup такмичење је постало препознатљиво међу љубитељима алгоритамских изазова и тимског рада. Овај престижни тимски догађај у програмирању, намењен средњошколцима и студентима узраста од 15 до 24 године, привлачи младе талентоване програмере из целе земље. Такмичење, које је покренуто 2008. године, има за циљ не само да истакне програмерске вештине учесника, већ и да промовише комуникацију, сарадњу и иновативност. Ове године, финале Bubble Cup 17 такмичења одржано је 28. септембра, уживо у просторијама Мајкрософтовог развојног центра у Србији. Током овог узбудљивог дана деветнаест екипа је имало прилику да покаже своје програмерске вештине. У Premier League категорији студената, прво место освојио је тим BenGIIn Klub, док су друго и треће место заузели тимови stefanbalaz2 и Urke. У Rising Stars категорији средњошколаца, победу је однео тим 100011, док су друго и треће место заузели тимови Гимназија Сомбор и Кисела вода. Комплетну ранг листу, као и задатке са овогодишњег такмичења можете наћи овде."
year_published = 2025
