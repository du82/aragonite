full_description = "After graduating from the Mathematical Highscool, he obtained his degree from the Faculty of Electrical Engineering in Belgrade. During the first seven years of his career, he worked as a software engineer, focusing on developing large-scale software business solutions. Subsequently, he spent a decade at Microsoft, where he dedicated most of his time to physics simulation development for video games, serving as a software engineer and team leader. In September 2023, he made a significant career shift and joined Petlja's team as a development advisor. In April 2024 he bacame the foundation's director. Nebojša Vasiljević is a distinguished expert in the fields of IT and their application in education. He is currently the Director of AI at the Petlja Foundation. His deep understanding of techologies, experience in education, the IT industry and policymaking have enabled him to make a significant contribution in improving the digital literacy in Serbia, especially in regards to programming education. With his expertise in natural language processing (NLP), he contributed to steering the developmental activities of the Petlja Foundation towards the applications of generative AI. His dedication to improving the status of IT in education began during his time working as assistant minister in charge of the information society before starting at the Foundation. He finished his doctoral studies at the University of Belgrade. Katarina graduated from the Department of Sociology at the Faculty of Philosophy, University of Belgrade. After she had completed her studies, she worked at the Ministry of Trade, Tourism and Telecommunications for five years, where she led projects such as the Digital School, the Digital Hour contest and the Click Safe initiative. After the ministry, she worked at the Centre for Promotion of Science, for two and a half years. At the Centre, she worked on international projects, as well as on popularisation and decentralisation of science in Serbia. In 2017, when she started working in the Petlja Foundation, she went back to the field of information technology in primary and secondary school education. In her spare time, she is still involved in the promotion and popularisation of science."
