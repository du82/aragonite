["https://petlja.org/sr-Latn-RS/vesti"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove. Treću godinu za redom organizovali smo Letnju školu programiranja koja je postala tradicionalno mesto okupljanja učenika i učenica sa posebnim interesovanjem za informatiku. Preko 300 učenika i učenica starijih razreda osnovnih škola iz cele Srbije izrazilo je želju da stekne nova znanja i iskustva u svetu programiranja. U saradnji sa zaposlenima iz Majkrosoftovog razvojnog centra u Srbiji smo organizovali dve radionice za devojčice osnovnih škola. Otvorene prijave za treću po redu Letnju školu programiranja koja će se ponovo održati u Sremskoj Mitrovici. U okviru ciljane podrške školama u realizaciji predmeta Digitalni svet posetili smo škole i u njima održali časove za primenu mikrobita. Proleće je donelo važne promene unutar naše organizacije za koje verujemo da predstavljaju značajan korak u ostvarivanju našeg cilja. Uspešno održana obuka nastavnika i nastavnica Računarstva i informatike u četvrtom razredu gimnazija za učenike sa posebnim sposobnostima za računarstvo i informatiku. U periodu od 08. februara do 25. marta Fondacija Petlja je organizovala dve onlajn obuke za nastavnu temu Programiranje za nastavnike osnovnih i srednjih škola. Fondacija Petlja poziva nastavnice i nastavnike Računarstva i informatike koji predaju Baze podataka u spec IT odeljenjima pri redovnim gimnazijama da se prijave na obuku iz ovog predmeta. Pozivamo sve zainteresovane nastavnike i nastavnice koji predaju Informatiku i računarstvo u osnovnim školama da se prijave za novi ciklus obuka."
