["https://petlja.org/sr-Latn-RS/n/net.kabinet:-upoznavanje-sa-novom-platformom-za-on/104627"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Upoznajte se sa novom veb lokacijom u okviru koje ćete moći da kreirate svoje virtuelne / digitalne kabinete, pratite napredak učenika kroz kurseve, kreirate onlajn testove za proveru znanja, šaljete i pregledate domaće zadatke i komunicirate sa svojim odeljenjem. Prijavite se. Od kada postoje savremene škole, učenje na daljinu nikada nije bilo ovoliko dostupno ali ni značajno, kao što je to slučaj u prethodna dva meseca. Upravo to nas je dovelo do toga da od čitanja naučnih radova, blogova i predavanja ljudi koji se bave obrazovanjem o prednostima i manama onlajn učenja sada možemo da dobijemo prve utiske direktno od nastavnika, učenika i roditelja. I, kao i kod svih stvari koje su nove i mnogima nepoznate, utisci su podeljeni. Neki smatraju da onlajn učenje ne može još uvek da zameni interakciju između nastavnika i učenika, a kamoli između vršnjaka. Škola, kao što znamo, pored obrazovne ima i vaspitnu ulogu i to je vrlo važan faktor u socijalizaciji dece zbog čega je škola nezamenljiva. Međutim, jedna od glavnih prednosti učenja putem interneta je što učenici mogu da prate program u odnosu na sopstveni tempo, bilo da vole da rade unapred ili da dodatno utvrđuju gradivo. Polazeći od svih prednosti i nedostataka onlajn učenja i uzimajući u obzir važnost svih elemenata u procesu sticanja znanja, Fondacija Petlja i Inicijativa „Digitalna Srbija“ su pokrenule net.kabinet koji će na temelju materijala platforme petlja.org omogućiti učenicima da lakše i brže prate nastavu, a njihovim nastavnicima da uspešno prilagode svoje pedagoške prakse svakom svom đaku. Net.kabinet omogućava učenje programiranja na interaktivan način u kome učenik može da samostalno – ili u saradnji sa svojim nastavnikom – prolazi kroz gradivo, prati svoj napredak, radi testove i domaće zadatke u odnosu na svoj trenutni nivo znanja. Kako bismo vam predstavili šta sve net.kabinet može i koje to funkcionalnosti pruža, pozivamo nastavnike informatike iz osnovnih i srednjih škola da nam se pridruže na vebinaru u četvrtak, 14. maja od 19 časova. Vebinar će trajati 45 minuta."
year_published = 2025
