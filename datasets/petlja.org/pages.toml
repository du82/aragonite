["https://petlja.org/sr-Latn-RS/projekti/BudiDataDriven"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = 'U okviru programa društvene odgovornosti Svet kakav želiš koji je kompanija A1 sprovela u saradnji sa regionalnom kompanijom Propulsion, Fondacija Petlja učestvovala je sa projektom Budi data driven - nauči da donosiš zaključke na osnovu podataka čiji je rezultat besplatan interaktivni online kurs na temu obrade, analize i vizuelizacije podataka pomću programskog jezika Pajton i interaktivnog okruženja za obradu podataka Jupyter. Kako su tumačenje podataka, donošenje zaključaka na osnovu njihove analize i odgovarajuće vizuelno predstavljanje tih zaključaka veštine koje su danas prisutne u gotovo svim sferama života - privredi, medijima, obrazovanju, svakodnevici, projekat Budi data driven pokušao je da odgovori na sve veću potrebu za poznavanjem ovih veština. Glavni cilj projekta je da svakom zainteresovanom građaninu i građanki omogući da se upozna sa analizom i obradom podataka uz pomoć programerskih alata i da ove veštine počne da koristi za bolje razumevanje svog okruženja, bilo da se radi o poslu, društvu, ekonomiji ili nekoj drugoj oblasti. Budi Data Driven je kurs posvećen učenju obrade, analize i vizuelizacije podataka uz pomoć programskog jezika Pajton i interaktivnog okruženja za obradu podataka, Jupyter. Na primerima podataka iz četiri oblasti, umetnosti, javnog zdravlja, ekologije i sporta, čitaoci će moći da se upoznaju sa raznovrsnim tehnikama analize podataka, različitim tipovima vizualizacija i glavnim načinima za izvlačenje zaključaka iz podataka. Materijal će čitaocima i čitateljkama predstaviti neke osnovne koncepte statistike koje će im pomoći da samostalno donose zaključke na osnovu podataka, koristeći pri tom alate programskog jezika Pajton. Kurs Budi Data Driven izdala je Fondacija Petlja pod licencom Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License. Aleksandra Alorić je naučna saradnica zaposlena na Institutu za fiziku u Beogradu u Centru za izučavanje kompleksnih sistema. Diplomirala je i masterirala teorijsku fiziku na Univerzitetu u Beogradu, a doktorirala primenjenu matematiku na Kraljevskom koledžu u Londonu. Pored istraživanja u oblasti društvenih i ekonomskih kompleksnih sistema, Aleksandra voli da se bavi promocijom nauke i obrazovanjem. Jedna je od pokretačica i koordinatorki Turnira mladih fizičara, radila je na brojnim Festivalima nauke u zemlji i inostranstvu i koordinirala projektima Centra za promociju nauke. Aleksandra je do 2020. godine rukovodila i sarađivala na različitim programima u Istraživačkoj stanici Petnica, a sada je jedna od nastavnica na multidisciplinarnim master programima "Računarstvo u društvenim naukama" i "Napredna analiza podataka" Univerziteta u Beogradu.'
