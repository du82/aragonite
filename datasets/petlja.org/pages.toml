["https://petlja.org/sr-Latn-RS/petlja/fondacija"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Smatramo da je razumevanje algoritama i umeće algoritamskog izražavanja potrebno svima, a takođe je važno da oni koji su talentovani za programiranje svoj talenat prepoznaju i razvijaju. Za sticanja algoritamske pismenosti neophodan je neki vid programiranja, isto kao što se bez praktikovanja pismenog izražavanja ne može steći klasična pismenost. Programiranje ne mora biti komplikovano, rezervisano za stručnjake, a suvoparno i dosadno ostalima. Naša želja je da programiranje približimo svima: deci i njihovim roditeljima, učenicima i njihovim nastavnicima, radoznalim korisnicima tehnologije i svim ljudima koji se pitanju šta je sledeće što treba da nauče. Želimo da podignemo nivo svesti u društvu o značaju algoritamske pismenosti, te da podstaknemo različite društvene subjekte na aktivnije delovanje u smeru razvijanja i popularizacije algoritamske pismenosti i konkretno programiranja. To znači da obrazovnim institucijama pomognemo da više i bolje doprinesu razvoju algoritamske pismenosti, da u široj populaciji podižemo svest o značaju algoritamske pismenosti, podstičemo i pomažemo svakog ko želi da uči programiranje, kao i da okupimo pojedince i kompanije koje svojim resursima i angažovanjem žele da podrže razvoj algoritamske pismenosti u Srbiji. O uvođenju programiranja u škole se u našoj javnosti duži niz godina diskutuje i ova tema je iz godine u godinu dobijala sve veći značaj. Ljudi koji danas čine Petlju su se upoznali na stručnim skupovima i zajedničkim projektima gde smo se međusobno podržavali jer smo delili iste vrednosti i viziju kako vidimo savremeno informatičko obrazovanje naših đaka. Iz tog razloga možemo reči da naše interesovanje, bavljenje i popularizacija algoritamskog načina razmišljanja datira i pre formalnog osnivanja fondacije. Petlja je svojim osnivanjem pod jednim krovom obuhvatila uspešne i poznate projekte i inicijative, a pre svega portal za učenje i vežbanje programiranja BubbleBee i zvaničan sajt za takmičenje učenika srednjih škola iz programiranja u Srbiji Takprog."
