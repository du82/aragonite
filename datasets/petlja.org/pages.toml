full_description = "Фондација Петља се унапред захваљује свим донаторима на подршци и нада се да ће наставити да прати и учествује у њеном раду и активностима. Фондација Петља (у даљем тексту: Фондација) основана је 11. априла 2017. године са циљем унапређења алгоритамске писмености у Србији и регистрована у Агенцији за привредне регистре са следећим подацима: Назив: Фондација Петља Облик организовања: Фондација Матични број: 28830122 ПИБ: 109988783 Седиште: Београд (Стари Град), Косовска 1, спрат I, стан 2 Шифра и назив делатности: 9499 - Делатност осталих организација на бази учлањена Остали подаци за контакт: E-пошта: donacije@petlja.org Телефон: +381601534821 Веб сајт: https://petlja.org Новчана донација је добровољно, безусловно и бесповратно давање новца од стране донатора без очекивања повратне услуге или накнаде. Фондација се обавезује да ће користити донације у складу са циљевима утврђеним статутом Фондације. Донатор има право да повуче своју донацију у року од 30 дана од дана уплате, ако није задовољан начином на који је Фондација користи или ако има други оправдан разлог. Донатор треба да пошаље мејл Фондацији на адресу donacije@petlja.org са захтевом за повраћај донације, прецизним подацима о којој уплати се ради и разлогом повлачења донације. За уредно поднете захтеве, фондација ће вратити новац донатору на исти начин на који је плаћен, у року од 15 дана од пријема захтева. Фондација Петља је у обавези да повраћај донација извршених картичним плаћањем врши искључиво преко ВИСА, ЕЦ/МЦ и Маестро метода плаћања, што значи да ће банка на захтев Фондације Петља обавити повраћај на рачун корисника картице."
