["https://petlja.org/sr-Latn-RS/petlja/saradnici"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = 'Profesor Matematičkog fakulteta u Beogradu, na kom je diplomirao 2002. i doktorirao 2009. godine u oblasti automatskog rezonovanja. Nekoliko prethodnih godina je predsednik komisije za informatiku Društva Matematičara Srbije. Višegodišnje iskustvo u radu sa mlađom populacijom sticao je kao nastavnik Računarske i Matematičke gimnazije u Beogradu. Aktivno je od samog početka uključen u izradu nastavnih materijala na portalu Petlja. Doktorirala u oblasti Računarskih nauka. Zaposlena kao docent na Prirodno-matematičkom fakultetu Univerziteta u Kragujevcu. Preko 20 godina iskustva u pripremi učenika osnovnih škola za takmičenja iz programiranja. Dugogodišnji urednik programerske rubrike u časopisu Tangenta. Nekoliko godina radila kao tehnički urednik Matematičkog lista. Aktivni član Društva matematičara Srbije, trenutno na poziciji odgovornog urednika serija izdanja “Materijali za mlade programere”. 2007. godine je bila lider tima Srbije i jedan od organizatora Prve balkanske juniorske programerske olimpijade održane u Beogradu. U periodu 2005-2011. član Republičke komisije za takmičenja iz programiranja učenika osnovnih škola. Od 2015. drži nastavu u odeljenjima učenika srednjih škola obdarenim za računarstvo. Diplomirala na Matematičkom fakultetu 2002. godine. Profesorka matematike i računarstva od 2003. godine. Autor i koautor nekoliko stručnih radova iz oblasti primene savremenih tehnologija u nastavi matematike i računarstva. Koautor je nekolicine akreditovanih seminara od strane ZUOV-a za usavršavanje nastavnika matematike i računarstva. Recenzent jedne knjige o programskom jeziku Python. Aktivan član Društva matematičara Srbije. Zaposlena u Devetoj gimnaziji „Mihailo Petrović Alas“ na Novom Beogradu Dragan Mašulović je redovni profesor Prirodno-matematičkog fakulteta u Univerziteta u Novom Sadu. Ima bogato iskustvo u poučavanju matematike i računarstva, kako učenika i studenata koji su posebno motivisani za ove dve oblasti, tako i onih kojima su matematika i/ili računarstvo neophodne pomoćne discipline. Pored dugogodišnjeg rada na univerzitetu već više od 20 godina predaje računarske predmete u specijalnim matematičkim odeljenjima u Gimnaziji "Jovan Jovanović-Zmaj" u Novom Sadu, dok je u Istraživačkoj stanici Petnica aktivan više od 30 godina u raznim svojstvima. Bio je gostujući profesor za Diskretnu matematiku na Johanes Kepler Univerzitetu u Lincu. Na Prirodno-matematičkom fakultetu u Novom Sadu je bio šef Katedre za teorijske osnove informatike, prodekan za doktorske studije i akreditaciju, a sada je angažovan kao Koordinator radne grupe za unapređenje elektronskih servisa.'
