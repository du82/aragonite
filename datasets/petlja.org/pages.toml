title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Циљ овог упутства је да се прође кроз процесе који ће сваком ко се први пут сусреће са Пчелицом роботом помоћи да упозна начин на који се она креће, односно начин на који је програмирамо до жељеног поља. визуелног упутства за кретање робота датог уз помоћ симбола стрелица и цифара, односно кода који треба пратити, закључка, односно одговора на питање или изазов у виду текстуалне или визуелне поруке. Пре самих вежби може се деци понудити могућност да осмисле своју капицу за Пчелицу робота, како је описано у делу „Инспиративан простор за игру“. Кликните на думе „X“, затим кликните на дугме „иди напред“ 3 пута и притисните дугме „GО“. Кликните на думе „X“, затим вратите Пчелицу робота на почетну позицију са три клика на думе „иди назад“ и притиском на дугме „GО”. Затим немојте кликнути на дугме „X“, већ само на дугме „иди назад“ 3 пута и дугме „GО“. Закључак: Ако не притиснете дугме „X“ на почетку програмирања, Пчелица робот ће најпре поновити оно што сте претходно програмирали, а затим ће се кретати пратећи програм који сте последњи креирали. Кликните на думе „X“, затим кликните на дугме „окрени се лево“, па на дугме „GО“."
