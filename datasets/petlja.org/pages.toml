["https://petlja.org/sr-Latn-RS/n/me%C4%91unarodni-dan-devojaka-u-informaciono-komunikaci/104670"]
title = "Petlja"
description = "Međunarodni dan devojaka u Informaciono-komunikacionim tehnologijama se, širom sveta, obeležava četvrtog četvrtka u aprilu."
full_description = "Međunarodni dan devojaka u Informaciono-komunikacionim tehnologijama se, širom sveta, obeležava četvrtog četvrtka u aprilu. Ove godine smo u Mejkers spejsu Naučnog kluba Beograd, u prostorijama Centra za promociju nauke i mi dali svoj doprinos obeležavanju ovog važnog dana. Organizovali smo radionicu, “Kreativno kodiranje: kada tehnologija crta”, za učenice starijih razreda srednjih škola, koju je vodila dr Aleksandra Jovanić docentkinja na Fakultetu likovnih umetnosti. Ona je učenicama iz Devete gimnazije, Računarske gimnazije i Šeste beogradske gimnazije pokazala kako da samostalno stvaraju generativna dela uz pomoć računara gde će koristiti svoja znanja iz likovne umetnosti, matematike i programiranja. Nakon radionice predavanje “Vizuelno raspetljavanje podataka”, za studentkinje je održao dr Srđan Verbić profesor sa FEFA, koji je govorio o primerima dobre i loše prakse vizualizacije podataka. Studentkinje su imale priliku da čuju o različitim načinima na koje se podaci mogu pokazivati i kako da izaberu najbolji način za vizualizaciju. Ova tema je privukla studentkinje različitih usmerenja i to nam je još jedan dokaz koliko je oblast IKT-a zapravo široka i koliko je važno da podržimo žene u ovoj industriji. Na samom početku prisutne su pozdravili: v.d. direktorka Centra za promociju nauke dr Marjana Brkić, pomoćnik ministra prosvete za međunarodnu saradnju i evropske integracije Aleksandar Jović, portfolio menadžerka Programa ujedinjenih nacija za razvoj Jelena Ružičić i direktor Fondacije Petlja dr Nebojša Vasiljević. Ovaj međunarodni dan obeležava se od 2010. godine na inicijativu Republike Srbije, u organizaciji Međunarodne unije telekomunikacija (ITU), sa ciljem podsticanja učešća devojčica i devojaka u tehnološkim oblastima. Ovaj događaj je realizovan u okviru projekta „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti“, koji sprovodi Program Ujedinjenih nacija (UNDP) u partnerstvu sa Ministarstvom prosvete, uz podršku Vlade Republike Srbije."
