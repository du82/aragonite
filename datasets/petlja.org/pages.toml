full_description = "Да бисте користили ову функционалност, морате имати наставнички налог. Ако ваш налог није наставнички, погледајте овде како бисте добили наставнички налог. Рад ученика можете пратити у делу Статистика. Потребно је да приликом креирања групе, група буде обележена као група за прикупљање статистике, што је аутоматски подешено ако креирате налоге на начин који је објашњен на овом линку. Ако групу креирате у пољу Групе, обележите квадратић Група за праћење статистике. Да бисте пронашли појединачног ученика, потребно је да у пољу „Статистика” изаберете групу у којој се ученик налази. Да бисте видели постигнуће ученика морате изабрати и курс у коме се налазе задаци на које је ученик покушао да одговори. На крају, ако желите да видите постигнуће ученика у појединачној лекцији у оквиру неког курса, у последњем пољу одаберите ту лекцију. Када све одаберете како је наведено, видећете постигнуће ученика на питалицама, задацима и интерактивним тестовима који постоје у оквиру појединих курсева. Ово нису исти тестови као они које наставник генерише. Ово су интерактивни тестови који постоје у оквиру појединих курсева."
