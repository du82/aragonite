["https://petlja.org/sr-Latn-RS/n/programiranje-3-za-elektrotehni%C4%8Dke-%C5%A1kole-dostupno-/104714"]
title = "Petlja"
description = "Fondacija Petlja nastavlja da pruža podršku nastavi programiranja u elektrotehničkim školama."
full_description = "Od ove školske godine na net.kabinetu je dostupan besplatan, onlajn materijal za Programiranje 3, koji u potpunosti prati zvanični program nastave predmeta Programiranje za treći razred srednjih stručnih škola, za smer Tehničar informacionih tehnologija. Mogu ga koristiti i učenici četvrtog razreda obrazovnog profila Elektrotehničar računara. Kurs Programiranje 3 se oslanja na programski jezik C#, a obuhvata i osnove objektno-orijentisanog programiranja, kao i pravljenje Windows Forms aplikacija. Za pohađanje ovog kursa neophodan je određen nivo predznanja kod učenika i učenica. Kurs je kreirao autorski tim Fondacije Petlja predvođen Velimirom Radlovačkim kao glavnim autorom. Ovim materijalom Fondacija Petlja nastavlja da pruža podršku nastavnicima i nastavnicama u realizaciji nastave koja uključuje oblasti informacionih tehnologija. Podsećamo da su prošle godine na onlajn platformi net.kabinet objavljeni materijali za Programiranje 1 i Programiranje 2 za elektrotehničke škole, koji se mogu koristiti za obrazovne profile tehničar informacionih tehnologija i elektrotehničar računara. Edukativni materijal Programiranje 3 kreiran je u okviru projekta „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti“, koji sprovodi Program Ujedinjenih nacija za razvoj (UNDP) u partnerstvu sa Fondacijom Petlja, uz podršku Ministarstva prosvete i Vlade Republike Srbije. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
