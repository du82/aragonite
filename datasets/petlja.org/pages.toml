["https://petlja.org/sr-Latn-RS/petlja/tim"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Nakon Matematičke gimnazije diplomirao na ETF-u u Beogradu. Prvih sedam godina karijere je radio kao softver inženjer na proširivanju velikih softverskih biznis rešenja. Nakon toga je proveo 10 godina u Majkrosoftu gde je najveći period proveo na razvoju simulacije fizike za video igre kao softver inženjer i vođa tima. U septembru 2023. godine je napravio veliki zaokret u svojoj karijeri i pridružio se Petljinom timu kao savetnik za razvoj. U aprilu 2024. godine postao je direktor Fondacije Petlja. Nebojša Vasiljević je istaknut stručnjak u oblasti informacionih tehnologija i njihove primene u obrazovanju, trenutno na poziciji direktora za veštačku inteligenciju Fondacije Petlje. Njegovo duboko razumevanje tehnologije zajedno sa iskustvom u nastavi, industriji i oblikovanju javnih politika omogućili su mu da ostvari značajan doprinos u unapređivanju digitalnog obrazovanja u Srbiji, a posebno kada je u pitanju učenje programiranja. Svojom stručnošću u oblasti obrade prirodnog jezika (NLP) doprineo je usmeravanju razvojnih aktivnosti Fondacije Petlja ka primeni generativne veštačke inteligencije. Pre angažovanja u Fondaciji Petlja, bio je pomoćnik ministra zadužen za informaciono društvo, kada počinje njegova posvećenost jačanju uloge informacionih tehnologija u obrazovanju. Diplomirao je, magistrirao i doktorirao na Univerzitetu u Beogradu. Diplomirala na Odeljenju za sociologiju, Filozofskog fakulteta Univerziteta u Beogradu. Nakon toga je pet godina radila u Ministarstvu trgovine, turizma i telekomunikacija, gde je u delu obrazovanja vodila projekte poput „Digitalne škole“, konkursa „Digitalni čas“ i inicijative „Klikni bezbedno“, da bi iza rada u ministarstvu dve i po godine provela u Centru za promociju nauke radeći na međunarodnim projektima, popularizaciji i decentralizaciji nauke u Srbiji. Od kraja 2017. se vraća osnovnom i srednjem obrazovanju u domenu informacionih tehnologija kroz rad u Petlji, a promocijom i popularizacijom nauke se i dalje bavi u slobodno vreme."
