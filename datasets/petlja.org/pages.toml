["https://petlja.org/sr-Latn-RS/projekti/UNDP"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "O poslovima budućnosti i pripremi za njih, kao i o veštinama koje je potrebno da današnji đaci osnovnih i srednjih škola stiču da bi sutra bili konkurentni na tržištu rada, mnogo se govori. Značaj digitalnih kompetencija đaka u tim razgovorima postaje sve veći, bez obzira na izbor poziva. Od osnivanja 2017. godine, Fondacija Petlja je kao jedan od svojih prioritetnih ciljeva postavila popularizaciju algoritamskog načina razmišljanja i približavanje algoritama najmlađim uzrastima. Rad Petlje je najprepoznatljiviji široj javnosti kroz besplatne edukativne materijale za učenje informatike i računarstva u osnovnim i srednjim školama, a tu su još i podrška takmičenjima, obuke nastavnika i druge aktivnosti u domenu neformalnog obrazovanja. Zahvaljujući podršci nastavi informatike koju je prethodno pružala, Fondacija Petlja je od 2022. godine prepoznata kao važan partner obrazovnom sistemu na projektu Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti. Ovaj projekat sprovodi Program Ujedinjenih nacija za razvoj (UNDP) u partnerstvu sa Ministarstvom prosvete, a uz podršku Vlade Republike Srbije. Projekat polazi od premise da je razvoj digitalnih veština kroz formalno i neformalno obrazovanje neophodan za obavljanje poslova budućnosti, te da je podrška obrazovnom sistemu odgovornost svih nas. Zajedno sa partnerima na projektu, nastavljamo da sprovodimo aktivnosti kroz koje pružamo podršku učenju programiranja i razvoju algoritamskog načina razmišljanja, kao i podizanju opšteg nivoa digitalnih kompetencija u douniverzitetskom obrazovanju. Na onlajn besplatnoj platformi net.kabinet učenici i učenice od prvog razreda osnovne škole do četvrtog razreda gimnazije mogu da uče informatiku prolazeći kroz interaktivne kurseve koji su kreirani u skladu sa zvaničnim nastavnim programima. Svi kursevi i prateći materijali su u potpunosti besplatni, a interaktivne komponente u njima omogućavaju učenicima da svoje prve linije koda mogu da izvrše direktno u kursu. Kursevi obuhvataju i pitalice, kratke kvizove za proveru znanja kao i zadatke za vežbu."
