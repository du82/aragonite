["https://petlja.org/sr-Cyrl-RS/raspetljavanje"]
title = "Raspetljavanje"
full_description = "Зимски тромесечни онлајн програм расПЕТЉАвање, који организујемо од 2022. године, пружа јединствену прилику ученицима и ученицама узраста од 11 до 18 година да открију шта се све програмирањем може, као и да стекну и унапреде своје програмерске вештине. У питању је програм подршке учењу који својим трајањем омогућава континуитет, а материјалима који остају бесплатно доступни и након завршетка програма омогућава дугорочну подршку. Сваким новим циклусом расПЕТЉАвања трудимо се да програм унапредимо на основу утисака полазника и полазница програма. Зато је сваки циклус расПЕТЉАвања јединствен и открива чари програмирања из једног новог угла. Испод овог текста налазе се сличице различитих распетљаних карактера, попут робота и лисице. Сваки карактер прати један циклус расПЕТЉАвања. Кликом на сличице, отвара се посебна страница за сваки циклус расПЕТЉАвања, а на којој се налазе материјали за учење доступни свима, без обзира на узраст и то да ли су пратили један од ранијих циклуса расПЕТЉАвања или не. Откриј свој угао учења програмирања уз наше распетљане материјале. Материјали којима можеш да приступиш укључују: интерактивне курсеве, задатке за вежбање и снимке предавања. У неким циклусима расПЕТЉАвања пронаћи ћеш сва три типа материјала, а у некима само неке од наведених типова материјала. За приступ материјалима неопходно је да се улогујеш на свој налог на Петљи."
year_published = 2025
