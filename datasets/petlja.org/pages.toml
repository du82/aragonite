["https://petlja.org/sr-Latn-RS/n/letnja-%C5%A1kola-programiranja-2024-/104707"]
title = "Petlja"
description = "Otvorene prijave za treću po redu Letnju školu programiranja koja će se ponovo održati u Sremskoj Mitrovici."
full_description = "Otvorene prijave za treću po redu Letnju školu programiranja koja će se ponovo održati u Sremskoj Mitrovici. Pozivamo učenike i učenice koji ove godine završavaju peti, šesti, sedmi ili osmi razred osnovne škole da se prijave za Letnju školu programiranja, koja će se održati u Sremskoj Mitrovici, u terminima od 06.07. do 14.07.2024. i od 28.07. do 05.08.2024. Smeštaj i ishrana na bazi punog pansiona u Domu učenika srednjih škola u Sremskoj Mitrovici su besplatni za polaznike i polaznice, dok troškove prevoza snose roditelji ili staratelji. Nastava Letnje škole programiranja će se odvijati u Mitrovačkoj gimnaziji. Stručni deo programa će i ovde godine biti fokusiran na savladavanje važnih programerskih koncepata kroz rad u Python-ovoj biblioteci za 2D grafiku Pygame. Program se svake godine dopunjuje novim primerima i drugačijim predlozima projekata, što i starim polaznicima Letnje škole programiranja omogućuje novo iskustvo. Pored stručnog dela programa za polaznike i polaznice će biti organizovana predavanja stručnjaka iz IT industrije, kao i rekreativne aktivnosti poput izleta, kvizova i večeri društvenih igara. Radni jezik Letnje škole programiranja je srpski. Zainteresovani učenici i učenice treba da se prijave najkasnije do 14.06.2024. do 17:00 časova, popunjavanjem prijavnog formulara koji mogu naći ovde. Za pristup prijavnom formularu za polaznike mlađe od 15 godina potrebno je da uz podršku roditelja ili staratelja kreiraju dečiji nalog ili se uloguju na postojeći na portalu petlja.org. Polaznicima sa navršenih 15 godina, pristup će biti omogućen uz regularan nalog na portalu. Upitnik koji će pronaći u prijavnom formularu sastoji se iz dva dela. Prvi deo svi koji se prijavljuju popunjavaju zajedno sa roditeljem ili starateljem, bez obzira na godine. Drugi deo upitnika se tiče dosadašnjeg iskustva i motivacije i neophodno je da ga učenici i učenice popune samostalno. Nakon uspešnog popunjavanja formulara i zatvaranja prijava svi prijavljeni kandidati i kandidatkinje će dobiti mejl sa dodatnim informacijama i linkom ka testu znanja iz programiranja. Test će se raditi u tekstualnom programskom jeziku Python na Petljinoj platformi u periodu od 15.06. u 10 časova do 17.06. u 10 časova. Napominjemo da Fondacija Petlja zadržava pravo da organizuje i drugi krug testiranja u formi u kojoj smatra da je potrebno, uključujući i mogućnost testiranja uživo, kao i da kandidata ili kandidatkinju za koje se ispostavi da su prilikom testiranja prepisivali diskvalifikuje."
