["https://petlja.org/en/petlja/fondacija"]
title = "Petlja"
full_description = "We believe that understanding algorithms, alongside the ability of algorithmic expression, is a fundamental skill that everybody needs to have. It is also important that those who are talented for programming recognize and nurture their talent. The same way practicing reading and writing is necessary for developing traditional literacy, some form of programing practice is necessary for developing algorithmic literacy. Programming itself doesn’t have to be a complicated activity, that is exclusive to experts and boring and tiring for everybody else. Our goal is to make programming accessible to everyone – children and their parents, students and their teachers, inquisitive technology enthusiasts and everybody else with a goal to acquire a new skill crucial for their personal and professional development. By raising the public’s awareness about the importance of algorithmic literacy, we want to encourage different social entities to actively participate in the developing and promotion of general algorithmic literacy and, in particular, programming. This means that we want to help educational institutions in Serbia improve their contribution to the development of algorithmic literacy and that we want to unite all the individuals and companies that share our vision and want to help us increase algorithmic literacy through their resources and engagement. Also, our mission is to raise public’s awareness about the importance of algorithmic literacy and support anyone with a desire to learn programming. The inclusion of programming into Serbian public education system has been a burning issue and a subject to public debate for a number or years. People who make the Petlja Foundation today, met each other while attending various conferences and while working on different mutual projects where we supported each other because we shared the same values and the same vision of a modern computer science education for Serbian students. With that said, we feel that our work in computer science education and popularization of algorithmic way of thinking predates the formal establishment of the Petlja foundation."
