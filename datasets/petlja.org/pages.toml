["https://petlja.org/sr-Latn-RS/n/a%C5%BEurirani-materijali-na-petlji/104587"]
title = "Petlja"
description = "Na osnovu povratnih informacije koje smo dobili od nastavnika informatike, danas smo objavili nove, unapređene verzije naših materijala za osnovnu školu i gimnaziju."
full_description = "Na osnovu povratnih informacije koje smo dobili od nastavnika informatike, danas smo objavili nove, unapređene verzije naših materijala za osnovnu školu i gimnaziju. U sredu, 06. marta, taman kada drugo polugodište dobija svoj pun zamajac, objavili smo unapređene verzije sledećih materijala: Programiranje u Pajtonu, priručnik za šesti razred - https://petlja.org/biblioteka/r/kursevi/prirucnik-python Programiranje u Pajtonu, priručnik za gimnaziju - https://petlja.org/biblioteka/r/kursevi/prirucnik-python-gim Programiranje grafike pomoću Pygame, priručnik za sedmi razred - https://petlja.org/biblioteka/r/kursevi/pygame-prirucnik Programiranje grafike pomoću Pygame, priručnik za gimnaziju - https://petlja.org/biblioteka/r/kursevi/pygame-prirucnik-gim Zbirka kratkih pitanja iz programiranja za šesti i sedmi razred - https://petlja.org/biblioteka/r/kursevi/python-zbirka-pitanja Zbirka kratkih pitanja iz programiranja za gimnaziju - https://petlja.org/biblioteka/r/kursevi/python-zbirka-pitanja-gim Kao što naši korisnici već znaju, u Fondaciji Petlja stalno osluškujemo njihove potrebe i u skladu sa tim unapređujemo kako same materijale na Petlji tako i funkcionalnosti same platforme. Kada je reč o novim funkcionalnostima na portalu, od danas je moguće da sakrijete levi stubac u kome je sadržaj i omogućite širi prostor za unos koda. Takođe, kada je reč o samim materijalima u priručnicima za Pajton i Zbirci kratkih pitanja u poglavlju Karel robot dodali smo nove zadatke dok smo kod priručnika za Pygame metodološki revidirali primere za animacije i događaje. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji."
