title = "Petlja"
full_description = "Similar to how it is in nature (change of seasons, water circulation, day and night, the rise and fall of sea level, etc.), in programming we can repeat certain steps multiple times. As in nature, in programming, it is necessary to run parts of a program several times to complete certain tasks. For these types of programs, we say that they contain repetitions, and these repetitions are called loops. We will demonstrate repetition by creating a square-shaped pillar, the base of which is a square with sides of 5 blocks in length and 10 in height. In Minecraft, we can also use an agent for performing certain actions, such as planting and harvesting, mining, cutting down trees and building objects. The blocks which relate to the agent are located in the category : Thinking about the task: Moving forward 5 blocks and turning left and right (at a 90-degree angle) creates a square-shaped base. Moving on the z-axis allows the construction of the 10 blocks high tower. We place the agent in a specific position in the world and give it tools for building the desired object, To place the agent where we want it, we will use the block to place the agent in the desired spot. We will place the agent in the position of our character (player) moved two blocks (steps) to the left. To achieve this, we will use the variable position, which stores the current value of the character’s (player’s) position. In the beginning, the value of the variable position is the current position of the character in the world moved two blocks to the left. We will define the initial value with the block . This means that each time program starts, Minecraft sets the value of the position to the desired spot (the agent is moved two blocks to the left from the character (player)), and we can start building the square base of the pillar. From the category Variables we drag the block , into which we will insert the block that gives us the current position of the player moved two blocks to the left. Into the upper part of the block, we will drag the block . In the lower part of the block, in the x coordinate input field, we will put number 2."
year_published = 2025
