["https://petlja.org/en/library/r/lekcije/BlockBasedProgScratch/blocks"]
title = "Petlja"
full_description = "Computer programs are sets of commands, which we use to explain to the computer how to complete a certain task or solve a problem. Given that most programming languages ​​are textual, developers often type commands. In the visual programming language Scratch, we don’t write commands, but instead we use blocks, which represent them. We create programs by arranging (stacking) blocks in the appropriate order. Command blocks have notches at the top and bumps on the bottom. They are designed in a way that allows them to be connected (stacked) to other blocks. We can just drag a block from the appropriate category into the scripts area (space for programming) and connect it to other blocks, which are already there. Connecting blocks looks like magnetic attraction - as soon as we place a notch of one block close to the bump of another, it will “stick” to it, thus continuing the sequence. The bumps allow new blocks to be added. These blocks have “hats”. This means that they can only be placed at the beginning of a stack of blocks. We usually start a script with one of these blocks. On the bottom, they have bumps, which allow new blocks to be added to them. It is important for you to know that these blocks represent triggers, which start the running of scripts attached to them. For example, the block ensures that the command blocks attached to it run only when the green flag, located above the stage, is clicked. Similar to command blocks, the blocks controlling the running of the program have notches at the top and bumps on the bottom. We can put them above other blocks, as well as put other blocks below them. These blocks are also characterized by the ability to accommodate other blocks (other blocks can be put inside them). For example, the script allows our sprite to move 10 steps 10 times. Apart from their shape, these blocks are different from other blocks because they cannot be part of the script on their own. In other words, they are not added to other blocks, but they form an integral part of the block they are inserted to."
year_published = 2025
