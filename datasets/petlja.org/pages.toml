["https://petlja.org/biblioteka/r/lekcije/documentation/uputstvo_za_nastavnike-testovi_sa_kratkim_pitanjima"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Да бисте користили ову функционалност, потреебн оје да имате наставнички налог. Ако ваш налог није наставнички, погледајте овде како да добијете наставнички налог. На Петљи постоји могућност креирања тестова на основу питања из Збирки кратких питања (Збирке кратких питања из програмирања за шести и седми разред и Збирке кратких питања из програмирања за гимназију). Страници за креирање тестова са кратким питањима можете приступити помоћу овог линка или кликом на дугме Тестови са кратким питањима у контролној табли. Да бисте генерисали тест потребно је да кликнете на дугме Направи тест на страници Тестови са кратким питањима на контролној табли. Након тога отвориће се страница на којој је потребно дати назив тесту и изабрати материјал из које ће бити изабрана питања, као на следећој слици. Када изаберете материјал и притисните на дугме прикажи лекције, испод тога ће се појавити сва поглавља из одговарајућег материјала. Када изаберете поглавље, поред поглавља појавиће се три дугмета која служе избору броја лакших питања, средње тешких и тежих питања. Када изаберете број питања жељене тежине, кликните на Креирај тест и то ће направити тест са насумичним избором питања одређене тежине из изабраних лекција."
