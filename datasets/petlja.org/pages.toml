["https://petlja.org/sr-Latn-RS/lsp"]
title = "Letnja škola programiranja"
full_description = "Naš tim autora i predavača svake godine priprema program koji obuhvata rad u Pajtonovoj biblioteci za 2D grafiku Pajgejm, a polaznici i polaznice na kraju svake smene svoje znanje krunišu samostalnom izradom projekata. Jako bitan deo u procesu učenja su pauze i način na kojih ih koristimo. Zato slobodno vreme provodimo u raznoraznim sportskim aktivnostima. Ne propuštamo priliku da se dobro razgibamo uz turnire iz košarke, odbojke, šaha... Još jedan vid vannastavnih aktivnosti su i izleti na koje idemo kako bismo što bolje istražili mesto u kom boravimo. Nakon dana punog programiranja nema boljeg odmora za oči od prirode. Slobodno vreme koristimo i da čujemo i naučimo nešto korisno. Priče ljudi iz industrije, neočekivani karijerni putevi i zanimljivi hobiji. Odakle biotehnolog u IT industriji, radionice iz 3D štampe i još mnogo toga. Prvu ikada Letnju školu programiranja smo organizovali u Vršcu. Imali smo priliku da se družimo u dva termina tokom avgusta. Polaznici i polaznice su bili smešteni u „Domu učenika srednjih škola Vršac”, a nastava se odvijala u školskom centru „Nikola Tesla”, nedaleko od Doma. Dobre stvari ne treba menjati. Tako da smo sledeće godine tokom jula i avgusta odlučili da ponovimo druženje, ovog puta u Sremskoj Mitrovici. Polaznici i polaznice su bili smešteni u „Domu učenika srednjih škola Sremska Mitrovica”, a nastava se odvijala u „Mitrovačkoj gimnaziji”. Ove godine smo na istom mestu sa novim zadacima i novim izazovima. Družimo se u 2 termina: 06.07. do 14.07. i 28.07. do 05.08. “Prelepo iskustvo za dete, nova prijateljstva sa dobrom, pametnom decom koja imaju slična interesovanja. Predavači divni, srdačni, posvećeni, pedagozi! Zaista prelepo iskustvo!” „Letnja škola programiranja je za decu sjajna stvar i puni su utisaka. Skupiti ih, upoznati, razviti nova prijateljstva, a pritom upoznati ih sa nekim stvarima koje im nisu bile dostupne ranije, novim znanjima… Koncept je pravo osveženje i nov lep način rada. I zabava i rad… Evo moje dete i dalje radi na projektu koji je započeo na kampu. Šta dalje reći… Nadam se da će se ovo raditi češće i vremenom postati jedna prava tradicija o kojoj se priča. Na dobrom ste putu! Sve pohvale od srca.“"
