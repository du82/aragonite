["https://petlja.org/sr-Latn-RS/n/materijali-za-onlajn-i-oflajn-nastavu---na-platfor/104629"]
title = "Petlja"
description = "Za školsku godinu koja je pred nama na našoj onlajn platformi net.kabinet objavljeni su besplatni materijali za kompletno gradivo informatike i računarstva za osnovne škole i gimnazije."
full_description = "Za školsku godinu koja je pred nama na našoj onlajn platformi net.kabinet objavljeni su besplatni materijali za kompletno gradivo informatike i računarstva za osnovne škole i gimnazije. Fondacija Petlja i Inicijativa „Digitalna Srbija“ u maju su pokrenule net.kabinet, besplatnu onlajn platformu na našem portalu, koja na jednom mestu spaja visokokvalitetne otvorene obrazovne resurse za učenike i funkcionalnosti za lakši rad nastavnika tokom redovne ili onlajn nastave. Autorski tim Fondacije Petlja potrudio se da tokom leta, pored materijala za programiranje po kojima smo poznati, za novu školsku godinu na unapređenoj platformi kreira i materijale za preostale nastavne teme i time zaokruži kompletno gradivo za informatiku u osnovnim i srednjim školama. Polazeći od aktuelne situacije, net.kabinet je koncipiran tako da može da se koristi i u redovnoj i u onlajn nastavi za sve više razrede osnovne škole, prva tri razreda gimnazije i u okviru predmeta Programiranje za prva dva razreda specijalizovanih IT odeljenja. Gradivo je pokriveno kursevima koji se sastoje od lekcija, kratkih video-zapisa i testova za proveru znanja. Učenici mogu kroz sve kurseve da prolaze samostalno ili u saradnji sa svojim nastavnikom. Sada se sa osmim razredom zatvara ciklus uvođena obavezne informatike u osnovne škole koji je sve vreme praćen snažnom podrškom Fondacije Petlja. Počeli smo od podrške programerski orijentisanim nastavnim temama kao najkrupnijim zalogajem u reformi predmeta. Ciklus završavamo u osnaženom partnerstvu sa Inicijativom „Digitalna Srbija“, odgovarajući na izazove epidemije pokrivanjem celokupnog gradiva predmeta na sledećoj generaciji naše platforme. Da bi mogla da se koristi i kada se nastavnik sa svojim učenicima ne sreće u učionici, platforma je morala potpunije da odgovori na potrebe učenja na daljinu i blended učenja, a nastavnicima i učenicima je bilo potrebno omogućiti da na istoj platformi prođu ceo predmet, objašnjava Nebojša Vasiljević, direktor Fondacije Petlja."
