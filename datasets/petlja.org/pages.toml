["https://petlja.org/biblioteka/r/lekcije/documentation/uputstvo_za_nastavnike-mala_takmicenja"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Да бисте користили ову функционалност, морате имати наставнички налог. Ако ваш налог није наставнички, погледајте овде како да добијете наставнички налог. Петља вам нуди могућност и за креирање малих такмичења. Ово је посебно корисно зато што ова такмичења користе исто такмичарско окружење као и званична такмичења из програмирања у Србији, али су превасходно намењена за вежбање програмирања. Мала такмичења се могу користити на часовима вежби или блок наставе, за домаће задатке, на додатној настави, за припрему за такмичења и томе слично. У овом упутству биће објашњено како да као наставник креирате и користите мала такмичења. Погледајте ово упутство како бисте видели како такмичења изгледају из угла ученика. Ако одете на део Такмичења у оквиру контролне табле добићете могућност да направите мало такмичење кликом на Направи такмичење. Добићете прозор у коме ћете моћи да дате назив такмичењу и да одредите од када до када ће такмичење трајати. Када кликните на Креирај, прећи ћете на подешавање параметара такмичења. Пре свега, ако испод назива такмичења кликнете на поље Подешавање, моћи ћете да поново подесите назив, опис, почетак и крај такмичења, али имаћете и низ додатних могућности. Можете да изаберете тренутак у коме ће почети замрзавање резултата, што значи да после тог тренутка такмичари више неће моћи да виде промене у ранг листи."
