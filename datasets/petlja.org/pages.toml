["https://petlja.org/sr-Cyrl-RS/n/prvi-edukativni-materijal-za-pred%C5%A1kolske-ustanove-/104716"]
title = "Petlja"
description = "Sa priručnikom  namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
full_description = "Са приручником намењеним васпитачима и васпитачицама Петља проширује своју подршку и на предшколске установе. Поред тога што годинама уназад пружамо подршку реализацији наставе ИТ предмета у свим разредима основне школе и гимназије, као и реализацији наставе највећег дела стручних предмета у специјализованим ИТ одељењима, јако смо поносни на чињеницу да од ове године имамо прилику да пружимо подршку и васпитачима и васпитачицама. Главна ауторка приручника „Играоница пчелице робота – Бибот приручник за васпитаче“ је Наташа Анђелковић, која има вишегодишње искуство рада у предшколској установи и једна од првих васпитачица које су користиле Бибот робота у свом раду са децом, Пчелица робот (En. Bee-Bot) је дидактичко средство за интегрисано учење намењено деци предшколског узраста, и као такво ју је препознао Завод за унапређивање васпитања 2021. године. Овај приручник настоји да покаже неке од начина на које се Пчелица робот може користити у предшколским установама у оквиру различитих пројеката. Такође, приручник нуди идеје васпитачима и васпитачицама како да са децом предшколског узраста и/или њима блиским одраслим особама осмисле игру."
year_published = 2025
