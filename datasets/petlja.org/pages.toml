full_description = "MakeCode supports four basic arithmetic operations: - addition ( + ), - subtraction ( - ), - multiplication ( * ) and - division ( / ). The blocks that enable computation are called arithmetic operators. They are located in the category . You can use the result (number) returned by an arithmetic operator as an input value for blocks, which accept numbers. This can be clearly seen in the figure above. The show number … block accepts a number as an input and displays it on the screen. We put before you a more complex arithmetic expression: ( 2 + 1 ) * ( 12 - 10 ). In MakeCode, calculating the result might look like this: By analyzing the complex expression, we can conclude that it consists of smaller units - interim results. The sum of (2 + 1) is one interim result. The difference of (12-10) is the second interim result. We will get the result of the whole expression when we multiply the sum and the difference (sum * difference). In programming, it is convenient to use the interim results (interim values), which we call variables. You can think of variables as spaces in computer memory, similar to boxes, in which the interim results are stored. Variables have names. When you want to use the value of a specific variable in a program, it is enough just to indicate its name. We create variables by clicking on the Make a variable button (2) in the Variable category (1), entering the name of the variable (3), in our case the name Counter, and then click on the OK button (4). Clearly, you can present our (2 + 1) * (12 - 10) expression differently. By creating two variables: and . We will set the initial value of the Counter variable to be 0. This can be done by dragging the block from the category into the block . Q-11: Create a program, which has two variables: x and y. The set value of the variable x should be 2 (x = 2), and the set value of the variable y should be 4 (y = 4). When the program runs the block shown in the figure below, the result will be: Let’s use arithmetic operators and variables to create a program, which calculates the perimeter and area of ​​a square."
