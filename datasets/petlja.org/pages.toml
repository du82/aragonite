["https://petlja.org/en/library/r/lekcije/BlockBasedProgScratch/sound"]
title = "Petlja"
full_description = "The ability to add sound to our sprites, in addition to bubbles with thoughts and text in them, gives us the opportunity to create more dynamic and interesting programs. Scratch has a rich library of sounds, as well as the possibility to record our own voice or download sound recordings from our computer in .wav or .mp3 format. The blocks, which allow us to hear sounds, are located in the Sound category. We will upgrade the program Farm, which can be found on the link https://scratch.mit.edu/projects/326422653/, so that the girl (Avery) really says “Go, go!”, and the Chick chirps after a good meal. The first step would be to record the sound - our voice: we will make the recording and add it to the script belonging to the girl; on the recording, we should say: “Go, go!” ensure that the girl sprite is active (the thumbnail of the sprite should have a blue frame around it in the sprites list); You can listen to the recording by pressing the Play button, if you are satisfied, you should click the button Save, and if not, click the button Re-record and do it again; Blocks that allow our voice to be heard during the running of the program, will appear in the category Sound. We must not forget that the chick sprite has to be active; otherwise, the chirping sound will be added to the girl sprite. Composing music requires the addition of a new block category to the Scratch interface. This is done by clicking on the button , which is located in the bottom left corner of the screen, and then choosing the extension Music. No matter what language they speak, people from all over the world know the lullaby Frère Jacques. If you don’t know the song, look it up on YouTube, and we will help you compose it in Scratch. As our instrument, we will choose the electric piano (1), and then we will connect the notes so that, when we run the program, this famous lullaby starts playing. Remix the project Frère Jacques, which can be found on the link https://scratch.mit.edu/projects/326431999/ and add the blocks that will contribute to the “fullness of sound” (drums or the rhythm section). Use the instruments from the drop-down list of the block . By using the appropriate block from the category Sound increase the volume of each verse by 10."
year_published = 2025
