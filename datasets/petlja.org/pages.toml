["https://petlja.org/sr-Cyrl-RS/biblioteka/r/kursevi/Zbirka-python"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Збирка је превасходно посвећена почетним нивоима програмирања и почетним нивоима припреме за такмичарско програмирање. Узраст ученика којима је збирка намењена није прецизно одређен јер се програмирање не изучава систематски током школовања, због чега се ученици различитих школа у различитим узрастима сусрећу са основама програмирања. У односу на постојеће школске програме области програмирања које Збирка обухвата треба да одговарају првој и другој години учења програмирања у средњој школи. Збирка тематски покрива програм такмичења из програмирања за основну школу које организује Друштво математичара Србије, пре напредних техника програмирања, иако укључује и поједине напредне технике. Збирку могу да користе ученици свих узраста (почевши од 5. разреда основне школе) који почињу да се припремају за такмичење из програмирања, а немају значајно програмерско предзнање. Дакле, циљна група Збирке су ученици средњих школа у којима се програмирање изучава по специјализованим програмима, ученици трећег разреда гимназија природног, друштвеног и општег смера, такмичари основци, студенти који се први пут сусрећу са програмирањем, као и сви почетници заинтересовани за алгоритамско програмирање."
