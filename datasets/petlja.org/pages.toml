["https://petlja.org/sr-Cyrl-RS/net.kabinet/vazduhusvetu"]
title = "Petlja"
description = """
Ваздух у нашем свету и ван њега - покрени курс                     13 лекција"""
full_description = "Током овог курса, научићеш више о значају чистог ваздуха (добре атмосфере) на Земљи, кроз популарну идеју тераформирања Марса, где ћеш се упознати са сложеношћу и тежином овог задатка, те освестити значај тако ретке хабиталне атмосфере као што је на нашој планети. Кроз овај курс, бићеш у могућности да направиш паралелу између онога шта треба да се уради да би се евентуално формирала атмосфера на Марсу и онога шта ми све радимо, као цивилизација, да кваримо нашу добру атмосферу на Земљи. Пролазећи кроз лекције, научићеш све биолошке и физичко-хемијске процесе који су потребни за стварање као и очување добре атмосфере односно чистог ваздуха. Курс је настао у оквиру пројекта ,,Школе за бољи квалитет ваздуха’’, који спроводи УНИЦЕФ у Србији уз финансијску подршку Краљевине Норвешке."
