["https://petlja.org/biblioteka/r/lekcije/beebot_prirucnik/02_saveti-index"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Када користимо неко иновативно дидактичко игровно средство попут Пчелице робота, морамо бити свесни да смо одговорни за његову примену у складу са начином на који деца уче. Да би са успехом примењивали Пчелицу робота у непосредном раду са децом, потребно да познајемо теоријски оквир и методичке приступе на којима ћемо заснивати ту примену. Добро познавање и разумевање Основа програма предшколског васпитања и образовања у том погледу је неопходно. Како је Пчелица робот дидактичко игровно средство које је део дигиталних технологија, јасно је да морамо познавати и Смернице за примену дигиталних технологија у предшколској установи и Оквир дигиталних компетенција васпитача. Једна од основних теоријских поставки о програму у пракси упућује, поред осталог, на тезу „да је програм флексибилан оквир којим се постављају основне вредности и начела која се конкретизују у специфичном контексту кроз експериментисање и иновације, да је програм намењен даљем преиспитивању и развијању у пракси…“ (Основe програма предшколског васпитања и образовања, страна 14). Када уочимо да је примена неке иновације сврсисходна у пракси, увек је потребно да је критички разматрамо са становишта важећих теоријских основа, али можемо трагати и промишљати о сличним теоријским оквирима који би је ближе и јасније одредили."
