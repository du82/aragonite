["https://petlja.org/sr-Latn-RS/n/poziv-nastavnicima-i-nastavnicama-razredne-nastave/104721"]
title = "Petlja"
description = "Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi."
full_description = "Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Obuka za primenu mikrobit uređaja u nastavi je tematski fokusirana na nastavnu temu Algoritamski način razmišljanja u okviru predmeta Digitalni svet. Svi zainteresovani nastavnici i nastavnice razredne nastave iz školske uprave Zrenjanin mogu da se prijave putem sledećeg linka: https://forms.office.com/e/AADk7GS2bs do ponedeljka 02.12.2024. do kraja dana. PAŽNJA: Broj polaznika obuke je ograničen, te popunjavanje prijavnog formulara ne garantuje poziv za učešće na obuci. Obuka je hibridnog tipa. Prvi deo obuke obuhvata pripremni onlajn period na portalu petlja.org, tokom kojeg će polaznici imati priliku da se, uz podršku mentora, upoznaju sa materijalima kreiranim za ovu obuku. Drugi deo obuke podrazumeva dan uživo, fokusiran na rad na projektima koji će polaznicima pomoći da osveže znanje i steknu primenjivo iskustvo u radu sa mikrobitovima. Vreme predviđeno za rad je po 8 sati u okviru oba dela obuke. Cilj obuke je dostizanje višeg nivoa digitalnih kompetencija nastavnika u domenu realizacije nastavne teme Algoritamski način razmišljanja u okviru predmeta Digitalni svet uz korišćenje mikrobit uređaja, kreiranje digitalnih sadržaja i računarskih programa za rešavanje različitih problema u društvu koje se razvojem digitalnih tehnologija brzo menja. Po zatvaranju prijava polaznici će dobiti mejl sa svim potrebnim informacijama u vezi sa realizacijom onlajn dana. Za sva dodatna pitanja možete nam pisati na: obuke@petlja.org ili nas možete kontaktirati na +381601534821 Obuka nastavnika razredne nastave za primenu mikrobit uređaja se realizuje u sklopu projekta “Škole za 21. vek – druga faza”, koji sprovodi i finansira Britanski savet u saradnji sa Ministarstvom prosvete. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi."
