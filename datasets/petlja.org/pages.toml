["https://petlja.org/en/library/r/lekcije/BlockBasedProgScratch/branching"]
title = "Petlja"
full_description = "Equally useful and important is the program branching concept. Branching allows certain sets of blocks to be executed by the program, while others are not. Which commands will run depends on the fulfillment of the conditions. You should understand the condition as a statement that can be true or false. Even though, up until now, we have created programs that run commands one after the other, from the beginning until the end of the program, most of the programs contain branches. The block checks the condition an if the condition is true it runs one set of commands, and if the result is false it runs another set. One way to determine if a condition is fulfilled is to select, from the category Operators, one of the comparison operators: Q-2: The price of the ice cream is 100 coins. Analyze the scripts presented in the figure and select the correct statement. The easiest way to understand branching is to create a program that simulates a quiz. When we ask the user a question and wait for his/her answer, it is expected that we would provide feedback on whether the answer was correct or not. We can only provide information about the correctness of an answer when we determine whether the user’s response is identical to the correct answer. Even though it seems that we wrote the code correctly, and the correct answer to the question “How many legs does a dog have?” is 4, the user could answer the question by typing a string instead of a number. In other words, the correct answer to the question is not only 4, but also: It is obvious that we need to define the condition more carefully, i.e. to accept every possible correct answer. We can overcome this situation by using the logical operators, which we can find in the category Operators: In our case, the correct answer can be 4 or četiri or cetiri or four. This is why we will use the operator multiple times to define the condition. Children are used to touchscreen devices. They are not particularly skilled when it comes to using a mouse. We will help them develop this skill by creating a program with a Truck sprite and a Road as the backdrop. The truck should follow the user’s mouse pointer and go from the left side to the right side of the stage. On its way, the truck must not touch the edge of the road. If the truck touches the edge at any point, it will return to its original position (starting position at the beginning of the journey on the left side of the stage - x: -226, y: -41). For creating this program, we recommend you use the project Journey, which you can find on https://scratch.mit.edu/projects/326419371/."
