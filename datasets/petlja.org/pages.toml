title = "Petlja"
description = "Sa priručnikom  namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
full_description = "Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove. Pored toga što godinama unazad pružamo podršku realizaciji nastave IT predmeta u svim razredima osnovne škole i gimnazije, kao i realizaciji nastave najvećeg dela stručnih predmeta u specijalizovanim IT odeljenjima, jako smo ponosni na činjenicu da od ove godine imamo priliku da pružimo podršku i vaspitačima i vaspitačicama. Glavna autorka priručnika „Igraonica pčelice robota – Bibot priručnik za vaspitače“ je Nataša Anđelković, koja ima višegodišnje iskustvo rada u predškolskoj ustanovi i jedna od prvih vaspitačica koje su koristile Bibot robota u svom radu sa decom, Pčelica robot (En. Bee-Bot) je didaktičko sredstvo za integrisano učenje namenjeno deci predškolskog uzrasta, i kao takvo ju je prepoznao Zavod za unapređivanje vaspitanja 2021. godine. Ovaj priručnik nastoji da pokaže neke od načina na koje se Pčelica robot može koristiti u predškolskim ustanovama u okviru različitih projekata. Takođe, priručnik nudi ideje vaspitačima i vaspitačicama kako da sa decom predškolskog uzrasta i/ili njima bliskim odraslim osobama osmisle igru. Takođe, pripremili smo i PDF verziju priručnika za one koji žele da ga odštampaju i koriste na taj način. Priručnik možete preuzeti sa sledećeg linka. Ovaj priručnik kreiran je u okviru projekta „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti“, kojim koordinira Program Ujedinjenih nacija za razvoj (UNDP) i na kome je Fondacija Petlja implementacioni partner, a koji se sprovodi u partnerstvu sa Ministarstvom prosvete i uz podršku Vlade Republike Srbije. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji."
year_published = 2025
