["https://petlja.org/biblioteka/r/lekcije/documentation/materijali-kratka_pitanja"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Овај текст ће вам бити користан ако желите да проверавате своје познавање и разумевање градива одговарајући на питања из наших Збирки питања, а такође ће вам бити користан ако желите да као наставник укључите овај материјал у наставу. Збирке кратких питања представљају материјале који служе учењу програмирања и провери знања. Збирке кратких питања прате план наставе и учења за разреде на које се односе и покривају наставну тему рачунарство, односно програмирање. У збиркама кратких питања налазе се питања у којима ученици треба да изаберу тачан одговор од неколико понуђених, упишу тачан одговор, или поређају одговоре у одређеном редоследу. За свако питање је означен ниво коме припада: основни, виши или напредни. Питања означена зеленом вертикалном линијом са леве стране представљају основни ниво који ученици треба да савладају. За ученике који желе и могу да науче нешто више, предвиђен је виши ниво означен звездицом и жутом вертикалном линијом са леве стране. Напредни ниво, означен са две звездице и црвеном вертикалном линијом, погодан је за додатну наставу, секције и за оне који ће се припремати за такмичења."
