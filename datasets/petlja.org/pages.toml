["https://petlja.org/sr-Latn-RS/n/-obuku-za-dr%C5%BEanje-nastave-programiranja-pro%C5%A1lo-800/104568"]
title = "Petlja"
description = "Fondacija Petlja je tokom oktobra i novembra na 30 lokacija u Srbiji organizovala i sprovela obuke za nastavu iz oblasti programiranja za skoro 800 nastavnika."
full_description = "Fondacija Petlja je tokom oktobra i novembra na 30 lokacija u Srbiji organizovala i sprovela obuke za nastavu iz oblasti programiranja za skoro 800 nastavnika. Fondacija Petlja je tokom oktobra i novembra na 30 lokacija u Srbiji organizovala i sprovela obuke za držanje nastave iz oblasti programiranja za skoro 800 nastavnika informatike i računarstva osnovnih škola. Obuke su sprovedene kroz Microsoft Philanthropies inicijativu, čiji je cilj stručno usavršavanje nastavnika računarskih nauka, a podršku su pružili i Ministarstvo prosvete, nauke i tehnološkog razvoja kao i IT kompanije okupljene oko Inicijative Digitalna Srbija. Galeriju fotografija sa obuka možete pogledati na sledećoj veb stranici https://petlja.org/obuke Predmet Informatika i računarstvo je od ove školske godine dobio status obaveznog predmeta u petom razredu, dok se u šestom razredu osnovne škole izučava po novom nastavnom programu. Računarstvo i programiranje čine najkompleksniju celinu u okviru predmeta Informatika i računarstvo zbog čega su saradnici Fondacije Petlja svoju pažnju usmerili na tu oblast i savladavanje algoritamskog načina razmišljanja kao osnovnog koraka, kada je reč o učenju programiranja. U avgustu, na portalu Petlja.org, objavljeni su onlajn edukativni materijali za učenje programskih jezika Scratch i Python u skladu sa novim nastavnim programima (https://petlja.org/OsnovnaSkola). U prilog tome da među nastavnicima vlada veliko interesovanje za dodatnim usavršavanjem u oblasti držanja nastave programiranja govori i to da je inicijalno planirano da obuku prođe 450 nastavnika, a da se skoro 800 nastavnika prijavilo i prošlo obuku u ovom ciklusu. Dvodnevne obuke, koje su akreditovane od strane Ministarstva prosvete, nauke i tehnološkog razvoja i imaju status obuka od javnog značaja, održane su u 30 manje razvijenih opština širom zemlje. Program obuka osmislili su kolege sa Matematičkog fakulteta Univerziteta u Beogradu sa kog dolaze i voditelji koji su realizovali obuke."
year_published = 2025
