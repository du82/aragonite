["https://petlja.org/en/library/r/lekcije/BlockBasedProgMakeCodeEng/project-task---happy-or-sad"]
title = "Petlja"
full_description = "Until now, all the programs we have created were linear programs, more specifically, these were programs where commands are executed consecutively, one after the other until the end of the program. Unlike these programs, where every step, i.e. every command, is executed once, in decision-making algorithms, or more precisely, conditional (branch) algorithms some of the commands will be executed, and some won’t, which will depend on whether the condition has been fulfilled or not. We will demonstrate the use of decision-making blocks by creating a program, which will display different images on the EV3 screen, depending on whether the touch sensor is pressed or not. If the sensor is pressed, the EV3 is happy - a smiley face will be displayed on the screen, and if not, a sad face will be displayed on the screen. In some programs, the execution of the blocks doesn’t have to be done in the same order they were placed in the program. The decision-making blocks are used when we need to choose which stack of blocks will run. Which line (branch) will be chosen depends on whether the condition has been fulfilled or not. For the robot, whether or not the condition was fulfilled, depends on the information it receives from the sensor. To create a program which will display a smiley or a sad face, depending on whether the touch sensor is pressed or not, we need to start a new project. Into the block (located in the category ) we will drag the block from the category . Into the condition input field we will drag the block . Based on the setup of the task, when the sensor is pressed, the program should display the happy (smiley) face. We need to drag the block from the category into the branch YES. We can see that, even when we release the sensor button, the image of the happy face remains on the EV3 Brick screen. To correct this mistake, we will have to use the block . Based on the setup of the task, there is also the condition which allows a sad face to be displayed on the EV3 Brick screen when the touch sensor is not pressed. To achieve this, we need to add another branch “else” by clicking the sign . Within this branch, we will add the block that will display the sad face on the screen."
year_published = 2025
