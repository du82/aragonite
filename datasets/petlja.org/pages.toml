title = "Petlja"
description = """
Методичка збирка задатака из основа програмирања                                                        са решењима за Пајтон"""
full_description = "Методичке збирке алгоритамских задатака представљају јединствен пут у учењу програмирања на коме се учи кроз праксу - писањем кодова који треба да одговоре на захтеве постављене у задацима. Решење које напишете за сваки од ових задатака можете аутоматски тестирати на нашем систему. Сами задаци пропраћени су детаљно објашњеним решењима, а сви главни концепти обрађени у Збиркама, било да се ради о основним појмовима или напредним техникама, корисницима су, поред решења задатака, приближени и кроз теоријске текстове, углавном смештене на почетке поглавља. Задатке у Збиркама можете решавати у свим програмским језицима подржаним на Петљи, а поред тога понуђена су решења и објашњења најважнијих концепата за Пајтон (на основном нивоу учења) и С++/С# (на свим нивоима). У овој збирци налазе се задаци намењени почетним нивоима учења програмирања и припреме за такмичарско програмирање. Збирка представља колекцију решених задатака у три програмска језика, Пајтону, C++ и C#. Ову Збирку препоручујемо ученицима средњих школа који уче програмирање, такмичарима у основним школама и свима који самостално желе да почну са учењем алгоритамског програмирања."
