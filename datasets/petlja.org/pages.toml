title = "Petlja"
description = "U sredu, 07. februara Fondaciji Petlja je uručeno priznanje časopisa PC Press za najbolji srpski portal u kategoriji Obrazovanje i kultura za 2017. godinu."
full_description = "U sredu, 07. februara Fondaciji Petlja je uručeno priznanje časopisa PC Press za najbolji srpski portal u kategoriji Obrazovanje i kultura za 2017. godinu. U sredu, 07. februara u Svečanoj sali Skupštine Grada Beograda Fondaciji Petlja je uručeno priznanje časopisa PC Press za najbolji srpski portal u kategoriji Obrazovanje i kultura za 2017. godinu. Nagradu je ispred Fondacije Petlja primio direktor Nebojša Vasiljević. Dodelu priznanja „Top 50 najboljih onlajn stvari“ časopis PC Press je organizovano po 21. put u Svečanoj sali Skupštine Grada Beograda. Priznanje ovog prestižnog časopisa dobijaju domaći sajtovi, nastupi na društvenim mrežama i mobilne aplikacije koje su svojim radom obeležile godinu za nama. Priznanje se dodeljuje u sledećim kategorijama: Vesti i mediji, Poslovni i društveni servisi, Emarket, Obrazovanje i kultura, Dom i zabava, Sport i (Avan)turizam, Društvene mreže, Digital life, Mobilne aplikacije i Specijalne nagrade. Portal petlja.org je proglašen za pobednika u kategoriji Obrazovanje i kultura. U ovoj kategoriji su bili i Galerija Matice Srpske, Jugoslovenska kinoteka, Praistorija i Svet nauke. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
year_published = 2025
