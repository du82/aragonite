["https://petlja.org/sr-Latn-RS/n/devoj%C4%8Dicama-je-mesto-u-it-u-/104708"]
title = "Petlja"
description = "U saradnji sa zaposlenima iz Majkrosoftovog razvojnog centra u Srbiji smo organizovali dve radionice za devojčice osnovnih škola."
full_description = "U saradnji sa zaposlenima iz Majkrosoftovog razvojnog centra u Srbiji smo organizovali dve radionice za devojčice osnovnih škola. „MDCS kosmos- kako ga ti vidiš“ i „Hello World je veliki prasak“ su nazivi radionica koje smo u utorak, 12. juna, organizovali u okviru inicijative „Girls know IT“. Radionice kojima je prisustvovalo preko 30 učenica osnovnih škola iz Šapca i Beograda su se održale u prostorijama Razvojnog centra. Na samom početku programa prisutne su pozdravili Tanja Petrović, senior produkt menadžerka iz Majkrosoftovog razvojnog centra i Milan Simić, direktor Fondacije Petlja. Oni su podelili sa učenicama svoje karijerne puteve, iskustva rada u timovima i poslali poruku da je važno verovati u svoje sposobnosti i istraživati mogućnosti koje nove tehnologije svakodnevno donose. Učenice su imale priliku da popričaju sa petoro zaposlenih u MDCS-u o tome kako izgleda njihov radni dan, ali i o tome šta je sve potrebno da bi jedan proizvod od ideje došao do realizacije. Nakon razgovora svoje utiske su prenele na papir i u grupama napravile crteže koji su oslikavali „MDCS kosmos“ odnosno njihova očekivanja kada je rad u IT industriji u pitanju. Cilj ove radionice je bio da zainteresuje devojčice za karijeru u IT-u, odnosno da ih oslobodi strahova i predrasuda koje po ovom pitanju imaju. Druga radionica, pod nazivom „Hello World je veliki prasak“, učenicama je na konkretnom primeru pokazala da je za programiranje važan algoritamski način razmišljanja i raščlanjivanje većeg zadatka na sitnije korake. Uz pomoć svojih mentora, učenice su naučile kako rade petlje i matrice i sa novostečenim znanjem su napravile iks-oks igru u Pajtonu. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji."
year_published = 2025
