title = "Petlja"
full_description = "We will go through all of the stages together, and we will create a program in which the Minecraft environment (created world) says hello. This block has four parameters, which define how and where the message will be displayed (written) in the Minecraft world: In the text input field of the block print, we will type the desired text. In our case, this will be the message Hello, World!. In the field at, we will define the position, or more precisely the coordinates where we want the text to be displayed in our world. Minecraft is a three-dimensional world defined by three coordinates (X, Y, Z): In the field along, we can define the orientation, or more specifically, the axis along which the text is displayed (printed).  In the field of, we will choose Block of Diamond from the list, this will be the “material” which we will use to write the message. Once we have tested the program, we can conclude that it did what we wanted. Our greeting is displayed when we open our Minecraft world."
