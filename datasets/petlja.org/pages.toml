["https://petlja.org/sr-Cyrl-RS/n/programiranje-3-za-elektrotehni%C4%8Dke-%C5%A1kole-dostupno-/104714"]
title = "Petlja"
description = "Fondacija Petlja nastavlja da pruža podršku nastavi programiranja u elektrotehničkim školama."
full_description = "Фондација Петља наставља да пружа подршку настави програмирања у електротехничким школама. Од ове школске године на нет.кабинету је доступан бесплатан, онлајн материјал за Програмирање 3, који у потпуности прати званични програм наставе предмета Програмирање за трећи разред средњих стручних школа, за смер Техничар информационих технологија. Могу га користити и ученици четвртог разреда образовног профила Електротехничар рачунара. Курс Програмирање 3 се ослања на програмски језик C#, а обухвата и основе објектно-оријентисаног програмирања, као и прављење Windows Forms апликација. За похађање овог курса неопходан је одређен ниво предзнања код ученика и ученица. Курс је креирао ауторски тим Фондације Петља предвођен Велимиром Радловачким као главним аутором. Овим материјалом Фондација Петља наставља да пружа подршку наставницима и наставницама у реализацији наставе која укључује области информационих технологија. Подсећамо да су прошле године на онлајн платформи нет.кабинет објављени материјали за Програмирање 1 и Програмирање 2 за електротехничке школе, који се могу користити за образовне профиле техничар информационих технологија и електротехничар рачунара."
