["https://petlja.org/sr-Latn-RS/n/analiza-otvorenih-podataka/104643"]
title = "Petlja"
description = "Da bismo razumeli svet u kome živimo, odluke donosili na osnovu podataka, napravili smo priručnik koji vam omogućava da podatke analizirate, vizualizujete i na osnovu njih izvedete zaključke."
full_description = "Da bismo razumeli svet u kome živimo, odluke donosili na osnovu podataka, napravili smo priručnik koji vam omogućava da podatke analizirate, vizualizujete i na osnovu njih izvedete zaključke. Priručnik Analiza otvorenih podataka predstavlja novo izdanje na portalu petlja.org. Autorka priručnika Aleksandra Alorić je, koristeći setove otvorenih podataka, otvorila pitanja o dostupnosti obrazovanja, sezonalnosti gripa, javnom gradskom prevozu u Beogradu ali, na primer, da i neku knjigu možemo predstaviti kao skup podataka koji možemo da analiziramo. Cilj priručnika je da svakoga koga zanima tema analize i vizualizacije podataka ima priliku da se upozna sa osnovnim konceptima, korak po korak, koristeći programski jezik Python i interaktivno okruženje za izračunavanja Jupyter. Iako korene prikupljanja i obrade podataka možemo naći daleko u prošlosti, danas kada se govori o analizi podataka uglavnom se misli na podatke koji se nalaze u elektronskom obliku i koji su toliko brojni da je nemoguće da ih čovek bez pomoći računara sagleda, obradi i iz njih donese adekvate zaključke. Nije potrebno posebno naglašavati da se današnje moderno poslovanje ne može zamisliti bez timova ljudi čiji je posao da se bave isključivo podacima, njihovom analizom, izvlačenjem obrazaca ponašanja korisnika kako bi odluke koje kompanije donose o budućim koracima u poslovanju bile zasnovane na podacima. Takođe, pored same analize podataka, jako je važno znati i kako podatke predstaviti. Većina ljudi lakše zapamti informacije kada su one vizuelno predstavljene. Odabir da li ćemo neke podatke predstaviti kroz stubičasti ili linijski dijagram ili popularnu “piticu” je jednako važno. Time, neko ko možda ne poznaje dovoljno temu o kojoj je reč ili jednostavno nema vremena da se detaljno bavi celom analizom može da stekne prvi utisak o podacima i zaključcima koje predstavljamo. U tom svetlu, priručnik pred vama je namenjen svakome ko želi da stekne osnovna znanja o ovoj temi bez obzira da li je u srednjoj školi, na fakultetu ili negde zaposlen. Priručnik se sastoji od primera analize javno dostupnih podataka, praćenih objašnjenjima i vizualizacijama. Primeri korišćeni u Priručniku su pažljivo izabrani tako da nam svima na neki način budu poznati i bliski poput toga koji srednjoškolski smerovi su popularni ili koliko ima škola sa preko 1000 učenika i kakva je njihova geografska zastupljenost, ali i primera poput mesta na kojima se najčešće dešavaju saobraćajne nezgode. Iako možda na prvi pogled možemo intuitivno da pretpostavimo odgovore na ova pitanja, često je naša intuicija pogrešna ili nedovoljno dobra pa je daleko bolje da sve ovo potvrdimo analizirajući podatke i tek na osnovu analize izvedemo zaključke. Stoga vam preporučujemo da prolazite lekciju po lekciju, ali da se svakako ne zaustavite na primerima koje smo vam mi ponudili već i da sami istražujete neke druge podatke i vidite do kakvih novih saznanja možete da dođete."
