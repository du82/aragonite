["https://petlja.org/sr-Latn-RS/n/besplatni-kurs-fizike-u-digitalnoj-laboratoriji/104642"]
title = "Petlja"
description = "Zajedno sa Inicijativom „Digitalna Srbija“ i UNICEF-om u Srbiji kreirali smo interdisciplinarne kurseve za osnovce i srednjoškolce koji teoriju i zadatke iz fizike premeštaju u virtuelnu laboratoriju"
full_description = "Zajedno sa Inicijativom „Digitalna Srbija“ i UNICEF-om u Srbiji kreirali smo interdisciplinarne kurseve za osnovce i srednjoškolce koji teoriju i zadatke iz fizike premeštaju u virtuelnu laboratoriju Na taj način, otvoren je internet prostor koji im omogućava da simuliraju fizičke pojave, ali i da sami isprogramiraju eksperimente koji im pomažu da se uvere kako funkcioniše svet koji nas okružuje. Ovi interaktivni kursevi nazvani „Fizičke simulacije“, kao i prethodno objavljeni „Epidemija“ i „Algoritamska umetnost“, dostupni su na besplatnoj platformi net.kabinet na www.petlja.org/net.kabinet Svi znamo da je fizika svuda oko nas, a često nas pitanja koja ona pokreće iskreno zanimaju sve dok se ne suočimo sa naizgled komplikovanim i apstraktnim formulama. Sa tom svešću su nastali ovi kursevi usklađeni sa zvaničnim programima nastave i učenja, koji će svakom učeniku sedmog razreda osnovne škole i prvog razreda gimnazije omogućiti da pomoću računara prepozna i testira fizičke zakone. Kurs daje odgovore na pitanje kako radi padobran, daje priliku da ispitamo slobodan pad sa krivog tornja u Pizi ili vožnju trotineta na ledu. Zamišljeni tako da, pored glave, učenicima uposle i prste za tastaturom, kursevi „Fizičke simulacije“ će teoriju i eksperimente iz fizike oživeti na ekranu računara. Kursevi zbog svoje interdisciplinarnosti pozivaju na saradnju nastavnike fizike i informatike. Pisani su popularnim jezikom, obiluju zanimljivim ilustracijama, ponekim TikTok videom i primerima koji vode učenike u svet eksperimenata, merenja, testiranja, a samim tim i razvijanja kritičkog mišljenja. Doktorka fizike Tijana Marinković, nastavnica u Šestoj beogradskoj gimnaziji i jedna od autora kursa ističe: „Naša ideja kao autorskog tima bila je da učenicima, kroz brojne primere koje mogu da vide i iskuse gotovo svakog dana, pokažemo da je fizika daleko prisutnija u našim životima od onoga kako je većina nas doživljava. Želeli smo da se ovom naukom pozabavimo na jedan interaktivniji i savremeniji način, pružajući mogućnosti učenicima ne samo da veruju na reč, već da ono što nauče mogu da isprobaju, istestiraju i na taj način neku tvrdnju odbace ili potvrde.“"
