["https://petlja.org/biblioteka/r/lekcije/documentation/korisnicki_nalozi-kreiranje_naloga"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Иако се Петља састоји од више делова, користимо обједињени систем налога, што значи да вам је један налог довољан за пријављивање на све сервисе са доменом .petlja.org - Aрена, Tакпрог, Aлгора. Да бисте креирали налог треба да имате 15 или више година. У случају да још немате 15 година, ваш родитељ или законски старатељ треба прво да направи свој, а затим ваш налог. Погледајте Упутство за креирање налога детету млађем од 15 година. Потребно је да попуните све захтеване податке, прочитате наша Правила приватности и, ако сте сагласни са њима, обележите поље у којим потврђујете да их прихватате. Приликом креирања корисничког имена користите слова абецеде, бројеве и доњу црту (знак _). Сви остали карактери могу направити проблем приликом креирања налога. Након што се региструјете, врло брзо ћете добити имејл са линком који морате да кликнете како би ваш налог био потврђен и како бисте могли да се пријавите на наш сајт. Имејл понекад не заврши у главном фолдеру вашег имејл клијента па вас молимо да, ако не добијете одмах имејл, проверите и фолдере непожељно (spam), промоције и слично. Налоге на Петљи можете направити и тако што ћете искористити већ постојећи налог са Microsoft или Google адресом или Facebook налог. На страници https://petlja.org/sr-Latn-RS/Account/Register одаберите жељени сервис како бисте се улоговали са Microsoft, Google или Facebook налогом."
