["https://petlja.org/sr-Latn-RS/n/digitalni-svet-je-dostupan-na-net.kabinetu-za-sve-/104676"]
title = "Petlja"
description = "Na onlajn platformi net.kabinet na portalu petlja.org objavljeni su materijali za sva četiri razreda predmeta Digitalni svet"
full_description = "Na onlajn platformi net.kabinet na portalu petlja.org objavljeni su materijali za sva četiri razreda predmeta Digitalni svet Od ove školske godine, Digitalni svet po prvi put postaje obavezan predmet u četvrtom razredu osnovne škole. Time se završava ciklus uvođenja predmeta Digitalni svet u niže razrede. Za predmet Digitalni svet, autorski tim Fondacije Petlja je kreirao nove kurseve za prvi, drugi i četvrti razred koji u potpunosti prate zvanični program nastave i učenja i dostupni su na onlajn platformi net.kabinet na portalu petlja.org. Kurs za treći razred je dostupan od ranije. Svi kursevi su objavljeni kao otvoreni obrazovni resursi. Ideja uvođenja predmeta Digitalni svet u mlađe razrede osnovnih škola je da deca od malih nogu uvide da su digitalni uređaji svuda oko nas ali i da nauče kako da ih bezbedno koriste. Kao posebna tematska oblast izdavaja se Algoritamski način razmišljanja. U četvrtom razredu učenice i učenici će imati prilike da algoritme bolje razumeju uz pomoć Karel robota i time na jedan interesantan i interaktivan način savladaju neke od osnovnih koncepata u programiranju. Svi materijali su kreirani u okviru projekta „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti“, kojim koordinira Program Ujedinjenih nacija za razvoj (UNDP) i na kome je Fondacija Petlja implementacioni partner, a koji se sprovodi u partnerstvu sa Ministarstvom prosvete i uz podršku Vlade Republike Srbije Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
