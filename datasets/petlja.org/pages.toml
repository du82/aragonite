full_description = "A traffic light is a light signal device, and it has an important role in controlling traffic. Traffic lights are usually installed at intersections. The first traffic light was installed on 10 December 1868 in London; it was designed by John Peake Knight. This traffic light was operated manually by a police officer. The first interconnected traffic lights were installed in Salt Lake City. The first automatic control traffic light was introduced in the United States of America, in Huston, in 1922, and in 1927 in England. The first traffic light in Serbia was installed in Belgrade, at the intersection of King Alexander Street, King Ferdinand Street (currently Kneza Miloša Street), and Takovska street, on 4 December 1939. The color, shape and the size of light signals on a traffic light are determined by international standards: ­ - stop – red Using a Micro:bit we will build a traffic light with red, yellow and green lights turning on and off at certain intervals, just like a real traffic light. Before we start connecting the Micro:bit to the diodes, we should remember that a Micro:bit has 25 pins, five big pins - 0, 1, 2, 3V and GND. The remaining 20 pins can be used for connecting the Micro:bit to other devices. By using wires/crocodile clips, we will connect the Micro:bit via GND to any of the pins on the protoboard, so we can connect it to the GND diode. The operation of the diode requires power; we will limit the power supply by using resistors (they provide some resistance that limits the flow of current and controls the voltage in the circuit). We connect the Micro:bit via pin P0 and one of the pins on the protoboard on the left side of the resistors (figure below). We will connect the longer part (+) of the light diode to the P0 pin using crocodile clips, and the shorter one, also using crocodile clips, to the GND pin (look at the picture below). To create a code, which will allow the LEDs to turn on and off, we need to drag the block from the category Advanced - Pins into the block from the category ."
