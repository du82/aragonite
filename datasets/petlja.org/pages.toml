full_description = "Позивамо све заинтересоване наставнице и наставнике разредне наставе из школске управе Зрењанин да се пријаве на обуку за примену микробит уређаја у настави. Обука за примену микробит уређаја у настави је тематски фокусирана на наставну тему Алгоритамски начин размишљања у оквиру предмета Дигитални свет. Сви заинтересовани наставници и наставнице разредне наставе из школске управе Зрењанин могу да се пријаве путем следећег линка: https://forms.office.com/e/AADk7GS2bs до понедељка 02.12.2024. до краја дана. ПАЖЊА: Број полазника обуке је ограничен, те попуњавање пријавног формулара не гарантује позив за учешће на обуци. Ова обука је потпуно бесплатна и носи 16 бодова стручног усавршавања. Обука је хибридног типа. Први део обуке обухвата припремни онлајн период на порталу petlja.org, током којег ће полазници имати прилику да се, уз подршку ментора, упознају са материјалима креираним за ову обуку. Други део обуке подразумева дан уживо, фокусиран на рад на пројектима који ће полазницима помоћи да освеже знање и стекну примењиво искуство у раду са микробитовима. Време предвиђено за рад је по 8 сати у оквиру оба дела обуке."
