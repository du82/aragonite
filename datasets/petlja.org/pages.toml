["https://petlja.org/en/library/r/lekcije/BlockBasedProgMakeCodeEng/project-task---the-wire"]
title = "Petlja"
full_description = "We encounter motor skills issues (slower reaction time, clumsiness and inability to perform certain activities) almost daily. Many of the jobs today require a steady hand. For example, architects, welders, dentists and surgeons must have a “steady” hand for their work to be successful. Motor skills issues are especially pronounced when it comes to the non-dominant hand. Researches show that 96% of the world population uses their right hand (are right-handed). For the majority of these people, the left hand is completely neglected, and they are unable to perform many activities which require precision with this hand. One of the ways to overcome this issue is the device called the Wire; with this device, a person can practice motor skills by receiving feedback on the level of success of task execution. With the assistance of this device, everyone can practice their concentration and fine motor skills. Depending on the feedback, the user can determine whether he or she is dexterous, or whether there are some motor skill issues and more practice is required. In order to make the Wire device, first, we have to make a device comprised of the wire on which we can practice our motor skills, wooden (or some other) base and Micro:bits. Now that we are familiar with the basic characteristics and components of the Micro:bit, we can proceed with the construction of the Wire device. We should connect Micro:bits using crocodile clips to the configuration mentioned above. We will connect the first Micro:bit by connecting the grounding (GND) to the wire, using crocodile clips. The figure below shows the connection between the grounding and the Micro:bit (only for one device). Additionally, we have to connect the Micro:bit with the part of the device which tests motor skills (hook). Once the “Wire” device is constructed, it is time to create programs for each Micro:bit. Each of the four Micro:bits has to be programmed individually: ­ 1. ­The first detects and counts the mistakes made by the user 2. ­The second starts the time 3. ­The third measures the time 4. ­The fourth makes a sound when the user makes a mistake."
year_published = 2025
