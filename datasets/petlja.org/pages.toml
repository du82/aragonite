["https://petlja.org/sr-Latn-RS/n/MPNTR-i-Petlja-sporazum"]
title = "Petlja"
description = "03. oktobra 2017. godine potpisan je Sporazum o saradnji između Ministarstva prosvete, nauke i tehnološkog razvoja i Fondacije Petlja."
full_description = "03. oktobra 2017. godine potpisan je Sporazum o saradnji između Ministarstva prosvete, nauke i tehnološkog razvoja i Fondacije Petlja. U utorak, 03. oktobra 2017. godine u prostorijama Ministarstva prosvete, nauke i tehnološkog razvoja, potpisan je Sporazum o saradnji između Ministarstva prosvete, nauke i tehnološkog razvoja i Fondacije Petlja. Sporazum su potpisali ministar prosvete Mladen Šarčević i direktor Fondacije Petlja Nebojša Vasiljević. Ministarstvo i Fondacija razumeju izuzetan značaj unapređivanja nastave informatike i računarstva u osnovnim i srednjim školama kao i unapređivanja i omasovljavanje takmičenja u oblasti informatike i računarstva, a ovaj sporazum će predstavljati okvir za dalju saradnju u realizaciji prioriteta u tim oblastima. Predmet Informatika i računarstvo je od ove školske godine dobio status obaveznog predmeta za učenike petog razreda osnovne škole dok učenici šestog razreda informatiku i računarstvo uče po novom nastavnom programu izbornog predmeta. Fondacija Petlja je u koordinaciji sa Ministarstvom prosvete, nauke i tehnološkog razvoja na portalu Petlja.org objavila interaktivne materijale za učenje programiranja za peti i šesti razred koji predstavljaju podršku nastavnicima u realizaciji nastave, a učenicima u sticanju potrebnih znanja i veština. Pored toga su planirane i obuke za nastavnike informatike i računarstva. Fondacija Petlja je pripremila program stručnog usavršavanja „Nastava programiranja u petom i šestom razredu“ koji je dobio podršku Ministarstva prosvete nauke i tehnološkog razvoja i određen mu je status programa od javnog interesa. Uskoro se planiraju prve obuke, o čemu ćemo posebno detaljnije informisati javnost. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad."
