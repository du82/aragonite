["https://petlja.org/en/library/r/lekcije/BlockBasedProgScratch/scratch"]
title = "Petlja"
full_description = "Scratch is a visual programming language made for children. Programming in Scratch does not require writing commands. To create a program you can just arrange the blocks in the proper order (similar to puzzles or LEGOs). by downloading the installation file from https://scratch.mit.edu/download and installing it on your personal digital device (desktop version of the program); If we install the desktop version on our personal digital device, we will work faster and more comfortable, primarily because we won’t depend on the quality of our Internet connection, or on the occasional maintenance of the Scratch online platform (which is then unavailable). If we are programming using the Scratch online platform, we need to create our personal account. With having the account comes the ability to save our projects on the online platform and access them from any device connected to the Internet. In addition to this convenience, the Scratch online platform offers you the possibility of keeping parts of your programs in the Backpack and use them again when you need them. An additional advantage is the ability to publish programs. After publishing, your program becomes visible to other Scratch users; we call them Scratchers. Just like they can see and remix (adapt) your programs (projects), you can also see and remix theirs. You can also ask for help on the platform. Helping other Scratchers is in the spirit of this online community. The user interface of the two different versions of Scratch look almost identical; however, the online version has all the elements of the installed version and some other functionalities. On this page, we will show the elements of the Scratch online platform. Programs that are created on the Scratch online platform are called projects. Projects are created by clicking on the button Create. This will open the user interface, which looks like this: Space where we can create our programs (stack our blocks), which relate to the active sprite (character) or the stage;"
