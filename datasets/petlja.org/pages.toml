["https://petlja.org/sr-Latn-RS/n/kako-da-izbegnete/104592"]
title = "Petlja"
description = "Da li vam se dešavalo da vaši programi na testiranju prekorače dozvoljeno vreme? Želite da naučite kako da izbegnete takvu situaciju? Pogledajte Mali uvod u efikasnost."
full_description = "Da li vam se dešavalo da vaši programi na testiranju prekorače dozvoljeno vreme? Želite da naučite kako da izbegnete takvu situaciju? Pogledajte Mali uvod u efikasnost. Pošto se pribilžava okružno, a za njim i državno takmičenje iz informatike za osnovce, pripremili smo za takmičare i njihove mentore Mali uvod u efikasnost. Ovaj kratak kurs objašnjava koliko je važno da u zadacima u kojima se to traži, takmičarska rešenja budu efikasna. Prolažeći kroz kurs Mali uvod u efikasnost, čitaoci će moći da steknu predstavu o tome šta je složenost algoritma, kako se ona može odrediti u nekim slučajevima i kako se na osnovu složenosti algoritma može proceniti vreme potrebno za izvršavanje programa. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
year_published = 2025
