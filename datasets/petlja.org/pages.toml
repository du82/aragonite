title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "У збирци се излажу напредније технике програмирања, које представљају увод у изучавање алгоритама и структура података. Централне теме ове збирке су коректност и сложеност алгоритама (укључујући анализу сложености и елементарне технике побољшања сложености алгоритама), рекурзивна и индуктивна конструкција алгоритама (укључујући технике попут “подели-па-владај”, бектрекинга и динамчиког програмирања) и основне структуре података (скупови, мапе, стекови, редови, редови са приоритетом). Збирка подразумева основни нови знања из програмирања и предствља природан наставак “Методичке збирке задатака из основа програмирања”. Познавање техника изложених у тој збирци представља предуслов за израду задатака у овој збирци. Узраст ученика којима је збирка намењена није прецизно одређен. Збирка се може користити за додатну наставу и за припреме напредних нивоа такмичења у основној школи (државног и СИО), за додатну наставу и припрему основних нивоа такмичења у средњој школи (до државног), у редовној настави у другом разреду специјализованих ИТ одељења и електротехничких школа, као и у другом семестру изучавања програмирања тј. алгоритама и структура података на факултетима."
