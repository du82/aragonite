["https://petlja.org/sr-Latn-RS/projekti/interdisciplinarni_kursevi/epidemija"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Osnovna motivacija za ovaj projekat se crpela iz ideje da se na primeru tri interdisciplinarna kursa učenicima približi iskustvo koje imaju iz svakodnevnog života sa gradivom koje uče u školi, ali i da se otvore neke nove, inovativne teme koje učenicima mogu biti interesantne. Jačanje međupredmetnih kompetencija, pozvanje učenika da uzmu aktivnu ulogu u procesu učenja tako što će postavljati pitanja i istraživati dalje od onoga što je u samim kursevima ponuđeno, saradnja među nastavnicima različitih predmeta, neke su od osnovnih ideja voditelja ovog projekta. Epidemijaje kurs u kojem smo pokušali da fenomen epidemije sagledamo iz ugla više naučnih disciplina - biologije, hemije, matematike i programiranja. Kurs je namenjen učenicima drugog i trećeg razreda gimnazije, ali i svima onima koji žele da iz ugla ovih naučnih disciplina bolje sagledaju i razumeju šta se dešava u periodima kada nastupe epidemije zaraznih bolesti. Algoritamska umetnost je kurs namenjen učenicima koji žele da se kreativno izraze, ali na jedan drugačiji način - putem programiranja i uz pomoć matematike. Simulacije su kurs u kojem smo povezali fiziku i programiranje. Naime, često i potpuno neopravdano fizika se doživljava kod učenika kao teška, apstraktna nauka, a istina je zapravo da brojne fizičke pojave mi imamo u našem svakodnevnom iskustvu. Zbog toga smo kroz kreiranje simulacije koje se bave baš takvim primerima iz svakodnevnog života želeli da popularizujemo i približimo fizičke fenomene učenicima. Dodatno, želeli smo da podstaknemo učenike da kroz malo veštine u programiranju mogu da naprave i svoje simulacije pa smo uključili i informatiku u celu priču. Kurs Simulacije zapravo čine dva kursa, jedan namenjen učenicima osnovne škole, a drugi gimnazijalcima. Tokom 2020. godine bili smo svedoci pandemije koja je potpuno poremetila život na planeti a to i dalje čini. Da bismo razumeli fenomen epidemije, morali smo da se okrenemo mnogim naučnim disciplinama poput biologije, matematike, hemije, programiranja, jer je epidemija kompleksna pojava i da bismo je razumeli ne možemo je posmatrati samo iz jednog ugla."
