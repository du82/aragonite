full_description = "Fondacija Petlja sa registrovanim sedištem u Beogradu – Savski Venac, Koste Glavinića 2, I sprat, lokal L1 („Petlja“) poštuje privatnost korisnika svog portala petlja.org („Portal“) i razume značaj zaštite ličnih podataka i njihove poverljivosti. Cilj ove Politike privatnosti je da Vas, kao korisnika Portala, obavestimo koje podatke o ličnosti obrađujemo, u koje svrhe, po kom pravnom osnovu i koliko dugo to činimo, kao i koja su Vaša prava u vezi sa takvom obradom. Prihvatanjem ove politike privatnosti u svoje ime ili u ima osobe čiji ste roditelj ili staratelj dajete saglasnost na obradu vaših podataka o ličnosti odnosno podataka o ličnosti osobe čiji ste roditelj ili staratelj. U meri u kojoj je saglasnost pravni osnov za obradu Vaših Ličnih podataka, a Vi tu saglasnost odlučite da opozovete što imate pravo da učinite u svakom trenutku, Vaši Lični podaci više se neće obrađivati nakon tog opoziva osim ukoliko za njihovu obradu postoji neki drugi pravni osnov. Povlačenje saglasnosti ne utiče na zakonitost obrade Vaših Ličnih podataka koja je vršena pre tog povlačenja. Prema Zakonu o zaštiti podataka o ličnosti, podatak o ličnosti je svaki podatak koji se odnosi na fizičko lice čiji je identitet određen ili odrediv, neposredno ili posredno, posebno na osnovu oznake identiteta, kao što je ime i identifikacioni broj, podataka o lokaciji, identifikatora u elektronskim komunikacionim mrežama ili jednog, odnosno više obeležja njegovog fizičkog, fiziološkog, genetskog, mentalnog, ekonomskog, kulturnog i društvenog identiteta. Ukoliko drugačije nije naglašeno, za podatke o ličnosti za koje ovom politikom navedeno da ih obrađujemo Petlja je u ulozi rukovaoca, a u slučajevima kada je tako naglašeno Petlja može biti u ulozi obrađivača. Prilikom vaše posete Portalu, bez obzira da li ste se prijavili kao registrovan korisnik Portala ili ne, prikupljamo sledeće podatke: Kada se samostalno registrujete onda ste registrovani kao standardan korisnik i samostalno 