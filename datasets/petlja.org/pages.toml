["https://petlja.org/sr-Cyrl-RS/projekti"]
title = "Petlja"
description = """
Пројекат „Изградња кључних рачунарских компетенција – ка радној снази будућности” који спроводи Програм Уједињених нација за развој (УНДП) у партнерству са Министарством просвете, уз подршку Владе Републике Србије, има за циљ припрему ученика и ученица за послове будућности. Послови будућности захтеваће радну снагу која ће бити спремна на стално усавршавање и брзо прилагођавање променама. Ради постизања овог циља, кључно је непрестано унапређивати вештине, при чему су рачунарске компетенције на првом месту.                                    Сазнај више"""
full_description = "Пројекат „Изградња кључних рачунарских компетенција – ка радној снази будућности” који спроводи Програм Уједињених нација за развој (УНДП) у партнерству са Министарством просвете, уз подршку Владе Републике Србије, има за циљ припрему ученика и ученица за послове будућности. Послови будућности захтеваће радну снагу која ће бити спремна на стално усавршавање и брзо прилагођавање променама. Ради постизања овог циља, кључно је непрестано унапређивати вештине, при чему су рачунарске компетенције на првом месту. Курс Буди Дата Дривен настао је као резултат пројекта Буди Дата Дривен који је фондација Петља спровела у оквиру програма друштвене одговорности Свет какав желиш , који је компанија A1 спровела у сарадњи са регионалном организацијом Propulsion. Буди Дата Дривен је курс посвећен учењу обраде, анализе и визуелизације података уз помоћ програмског језика Пајтон и интерактивног окружења за обраду података, Џупајтер. На примерима података из четири области, уметности, јавног здравља, екологије и спорта, читаоци ће моћи да се упознају са разноврсним техникама анализе података, различитим типовима визуализација и главним начинима за извлачење закључака из података. Материјал ће читаоцима и читатељкама представити неке основне концепте статистике које ће им помоћи да самостално доносе закључке на основу података, користећи при том алате програмског језика Пајтон."
