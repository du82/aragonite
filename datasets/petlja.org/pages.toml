description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Fondacija Petlja se unapred zahvaljuje svim donatorima na podršci i nada se da će nastaviti da prate i učestvuju u njenom radu i aktivnostima. Fondacija Petlja (u daljem tekstu: Fondacija) osnovana je 11. aprila 2017. godine sa ciljem unapređenja algoritamske pismenosti u Srbiji i registrovana u Agenciji za privredne registre sa sledećim podacima: Naziv: Fondacija Petlja Oblik organizovanja: Fondacija Matični broj: 28830122 PIB: 109988783 Sedište: Beograd (Stari Grad), Kosovska 1, sprat I, stan 2 Šifra i naziv delatnosti: 9499 - Delatnost ostalih organizacija na bazi učlanjenja Ostali podaci za kontakt: E-pošta: donacije@petlja.org Telefon: +381601534821 Veb sajt: https://petlja.org Novčana donacija je dobrovoljno, bezuslovno i bespovratno davanje novca od strane donatora bez očekivanja povratne usluge ili naknade. Fondacija se obavezuje da će koristiti donacije u skladu sa ciljevima utvrđenim statutom Fondacije. Donator ima pravo da povuče svoju donaciju u roku od 30 dana od dana uplate, ako nije zadovoljan načinom na koji je Fondacija koristi ili ako ima drugi opravdan razlog. Donator treba da pošalje mejl Fondaciji na adresu donacije@petlja.org sa zahtevom za povraćaj donacije, preciznim podacima o kojoj uplati se radi i razlogom povlačenja donacije. Za uredno podnete zahteve, Fondacija će vratiti novac donatoru na isti način na koji je plaćen, u roku od 15 dana od prijema zahteva. Fondacija Petlja je u obavezi da povraćaj donacija izvršenih kartičnim plaćanjem vrši isključivo preko VISA, EC/MC i Maestro metoda plaćanja, što znači da će banka na zahtev Fondacije Petlja obaviti povraćaj na račun korisnika kartice. U ime Fondacije Petlja obavezujemo se da ćemo čuvati privatnost svih naših kupaca. Prikupljamo samo neophodne osnovne podatke o kupcima/korisnicima i podatke neophodne za poslovanje i informisanje korisnika u skladu sa dobrim poslovnim običajima i u cilju pružanja kvalitetne usluge. Dajemo kupcima mogućnost izbora, uključujući mogućnost odluke da li žele ili ne da se izbrišu sa mejling lista koje se koriste za marketinške kampanje. Svi podaci o korisnicima/kupcima se strogo čuvaju i dostupni su samo zaposlenima kojima su ti podaci nužni za obavljanje posla. Svi zaposleni u Fondaciji Petlja (i poslovni partneri) odgovorni su za poštovanje načela zaštite privatnosti."
