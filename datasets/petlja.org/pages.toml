description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Поред поменутих корака за стварање и одржавање Играонице Пчелице робота, морају се обезбедити почетни услови неопходни за њено функционисање. У ту сврху потребно је направити: упутство за коришћење Пчелице робота и Игралишта пчелице робота, и почетне Тематске картице и Картица скривалица, као и кутије за њихово складиштење. Да бисмо кроз простор Играонице Пчелице робота омогућили видљивост процеса учења у свим предшколским васпитано-образовним групама, потребно је да га обогатимо бројним Тематским картицама и да на паноу који поставимо у овом простору буду представљене ситуације учења које се ту и одвијају. Да би простор Играонице могао да, поред простора у којем се одигравају вођене игре васпитача, буде и простор који ће подстаћи децу више група да сама истражују и у своју игру укључују и родитеље, потребно је да овај простор обогатимо не само Тематским картицама и Картицама скривалицама већ и различитим другим природним, структурираним и полуструктурираним материјалима који ће подстаћи децу на истраживање. Тако у простору Играонице могу бити: чепови, камење, вештачко и природно лишће, штапови, шпатуле, пањићи, шкољке, коцке, даске, картони, папири и др."
