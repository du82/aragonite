["https://petlja.org/raspetljavanje/3"]
title = "Raspetljavanje"
full_description = "Ovaj ciklus rasPETLJAvanja namenjen je učenicima i učenicama koji nemaju prethodnog iskustva u programiranju. Programom je predviđeno obrađivanje osnovnih programerskih koncepata kao što su grananje, petlje, liste, funkcije… Osim razumevanja navedenih koncepata, programom je predviđeno sticanje važnih veština poput debagovanja, raščlanjivanja krupnijih problema na sitnije i postupnog rešavanja zadataka. Izabrani programski jezik je Pajton. Da bi program bio prilagođen različitim uzrastima, kreirana su dva interaktivna kursa, od kojih je jedan pisan jezikom prilagođenim osnovcima, a drugi jezikom prilagođenim srednjoškolcima. Oba kursa mogu da se prate samostalno ili uz mentorsku podršku. Program je struktuiran tako da polaznici i polaznike u toku trajanja postepeno usvajaju nove veštine kroz praktične vežbe i domaće zadatke, pri čemu im je obezbeđena mentorska podrška. Mentorska podrška se tokom tri meseca trajanja programa sastoji u nedeljnim mentorskim sesijama čiji je cilj razjašnjavanje nedoumica i definisanje daljih koraka u učenju. Mentorske sesije održavaju se u nekoliko mentorskih grupa, među kojima postoji fluktuacija polaznika i polaznica da bi se obezbedio način rada prilagođen potrebama svake od grupa. Nakon završetka programa, kursevi će biti dostupni kao otvoreni obrazovni resursi, omogućavajući svim zainteresovanim da započnu učenje programiranja. Ovaj program Fondacija Petlja realizuje u sklopu projekta „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti“, koji sprovodi Program Ujedinjenih nacija za razvoj u partnerstvu sa Ministarstvom prosvete, a uz podršku Vlade Republike Srbije."
