["https://petlja.org/sr-Cyrl-RS/petlja/tim"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Након Математичке гимназије дипломирао на ЕТФ-у у Београду. Првих седам година каријере је радио као софтвер инжењер на проширивању великих софтверских бизнис решења. Након тога је провео 10 година у Мајкрософту где је највећи период провео на развоју симулације физике за видео игре као софтвер инжењер и вођа тима. У септембру 2023. године је направио велики заокрет у својој каријери и придружио се Петљином тиму као саветник за развој. У априлу 2024. године постао је директор Фондације Петља. Небојша Васиљевић је истакнут стручњак у области информационих технологија и њихове примене у образовању, тренутно на позицији директора за вештачку интелигенцију Фондације Петље. Његово дубоко разумевање технологије заједно са искуством у настави, индустрији и обликовању јавних политика омогућили су му да оствари значајан допринос у унапређивању дигиталног образовања у Србији, а посебно када је у питању учење програмирања. Својом стручношћу у области обраде природног језика (НЛП) допринео је усмеравању развојних активности Фондације Петља ка примени генеративне вештачке интелигенције. Пре ангажовања у Фондацији Петља, био је помоћник министра задужен за информационо друштво, када почиње његова посвећеност јачању улоге информационих технологија у образовању. Дипломирао је, магистрирао и докторирао на Универзитету у Београду."
