["https://petlja.org/sr-Latn-RS/n/kako-ma%C5%A1insko-u%C4%8Denje-menja-na%C4%8Din-re%C5%A1avanja-problem/104580"]
title = "Petlja"
description = "Naučite zanimanje budućnosti i prijavite se za letnju školu mašinskog učenja u Petnici"
full_description = "Microsoft razvojni centar u Srbiji i Istraživačka stanica Petnica pozivaju sve zainteresovane studente da se prijave za učešće u internacionalnoj letnjoj školi „Petnica Summer Institute of Machine Learning“, koja će se održati u periodu od 3. do 13. avgusta 2019. godine, u Petnici. Kako naučiti mašine da probleme rešavaju „samostalno“, kako računar može da nauči da sam reši Rubikovu kocku, da prepozna govor i razume tekst, da kreira veštačke fotografije – samo su neki od zanimljivih projekata na kojima su tokom prethodnih letnjih škola radili diplomci i studenti. Učesnici će biti u prilici da se kroz intenzivna celodnevna predavanja i radionice upoznaju sa osnovama mašinskog učenja i da obogate svoje znanje, kako teorijskim tako i praktičnim radom, kroz učešće u grupnim ili individualnim projektima na odabranu temu. U tome će im pomoći inženjeri Microsoft razvojnog centra u Srbiji, profesori Univerziteta u Beogradu, i drugi renomirani predavači iz ove oblasti. Neke od tema koje će obuhvatiti ovogodišnja letnja škola su: osnove mašinskog učenja, učenje bez nadzora, konvolucione neuralne mreže, rekurentne neuralne mreže, učenje s podsticajem i brojne druge. Za letnju školu mašinskog učenja mogu se prijaviti zainteresovani diplomci i studenti osnovnih studija tehničkih i matematičkih disciplina. Ohrabrujemo i motivisane studente drugih disciplina koji žele da nauče više o mašinskom učenju, da se prijave, a poznavanje matematike i programiranja smatraće se prednošću. Konkurs za ovogodišnje učesnike „Petnica Summer Institute of Machine Learning“, otvoren je do 28. februara 2019. godine, a prijava se vrši na http://psiml.petnica.rs/apply.php Microsoft razvojni centar u Srbiji i Istraživačka stanica Petnica, 2015. godine osnovali su međunarodni seminar mašinskog učenja „PSI:ML“. Seminar je osmišljen od strane nekolicine inženjera zaposlenih u Microsoft razvojnom centru u Srbiji, koji su dugi niz godina bili saradnici u Petnici, i eksperti su u ovoj oblasti. Do sada je učestvovalo preko 100 studenata, iz Srbije, regiona, ali i zemalja EU, a neki od projekata na seminaru razvili su se u nagrađivane naučne radove."
