["https://petlja.org/sr-Latn-RS/n/budi-data-driven:-donosi-zaklju%C4%8Dke-na-osnovu-podat/104645"]
title = "Petlja"
description = "Interaktivan, besplatan, onlajn kurs Budi data driven koji je podržan u okviru programa društvene odgovornosti „Svet kakav želiš“ kompanije A1 Srbija od danas je dostupan na petlja.org"
full_description = "Interaktivan, besplatan, onlajn kurs Budi data driven koji je podržan u okviru programa društvene odgovornosti „Svet kakav želiš“ kompanije A1 Srbija od danas je dostupan na petlja.org Svakodnevno smo obasuti naslovima i tekstovima u kojima se pominju ili na graficima predstavljaju neki podaci, procenti i proseci, a na osnovu kojih se donose zaključci sa porukom šta je dobro za nas, šta je normalno ili kako treba da se ponašamo i mislimo. Istovremeno, ako odvojimo malo vremena da pronađemo izvor za navedene podatke ili navedenim zaključcima kritički pristupimo, vidimo da često nije baš sve onako kako se na nekom sajtu, društvenim mrežama, novinskom članku ili televiziji predstavlja. Međutim, u moru neistina, poluistina i senzacionalističkog izlaganja sadržaja, sve je teže razlikovati neistinu i poluistinu od verodostojnih podataka. Iz tog razloga su nam potrebni bolji alati za snalažene u savremenom svetu. Upravo smo sa kursom Budi Data Driven pokušali da ponudimo rešenje i teorijska objašnjenja, primere i alate koji predstavljaju vodič za svet analize i zaključivanja na osnovu podataka. Kurs je namenjen srednjoškolcima, studentima ali i svakome ko želi da nauči kako da analizira podatke i iz njih izvlači relevantne zaključke. Pošto znamo da slika govori više od reči, kroz kurs polaznik/polaznica će imati prilike da nauče i kako da analizirane podatke i kako da zaključke do kojih dođu i adekvatno vizuelno predstave. Konačno, da stvari još malo začinimo, sve analize su urađene u programskom jeziku Pajton, tako da će svako ko se upusti u prolazak kroz ovaj kurs imati prilike da nauči neke osnovne tehnike obrade podataka uz pomoć programerskih alata, ali i osnove zaključivanja na osnovu statističkih metoda, čije je razumevanje jako važno kada se bavimo analizom podataka. Autorski tandem koji čine Aleksandra Alorić i Dejan Pajić potrudio se da tematske celine i primeri u kursu Budi Data Driven budu poznati i bliski čitaocima i čitateljkama, a istovremeno napisani tako da ih svako može razumeti, nezavisno od stepena predznanja."
year_published = 2025
