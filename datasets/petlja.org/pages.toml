title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Kroz kurs Zagađenje vazduha naučićeš kako dolazi do zagađenja, koje su posledice zađađenja na životnu sredinu i zdravlje ljudi. Takođe , potrudićemo se da damo odgovor na pitanje kako svaki pojedinac može da utiče na smanjenje zagađenja. Ovo je interdisciplinarni kurs koji temu zagađenje vazduha obrađuje iz ugla više nastavnih predmeta, biologije, hemije, geografije, fizike i informatike. Kurs je namenjen učenicima osnovnih škola. Kroz sadržaj možeš prolsziti samostalno, saradnički sa svojim drugarima i nastavnicima. Курс је настао у оквиру пројекта ,,Школе за бољи квалитет ваздуха’’, који спроводи УНИЦЕФ у Србији уз финансијску подршку Краљевине Норвешке."
