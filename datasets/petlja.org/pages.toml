     Програмирање III за информатичке профиле у електротехничким школама             Овај курс програмирања намењен је ученицима III разреда електротехничких школа образовног профила Техничар информационих технологија. Могу га користити и ученици IV разреда образовног профила Техничар рачунара, као и сви они који желе да науче основе програмирања у програмском језику C#, основе објектно-оријентисаног програмирања и основе развоја Windows апликација. Ово није курс за почетнике! Претпоставља се да су полазници овог курса савладали основе програмирања у програмском језику C, односно да познају основне типове података, да знају да формирају изразе и наредбе, да користе наредбе гранања и наредбе циклуса, низове, показиваче, функције, стрингове, структуре, датотеке и динамичке структуре података. На почетку овог курса обрадиће се сличности и разлике програмског језика C и програмског језика C#, без задржавања на основним концептима и алгоритмима. Након тога, фокус ће бити на објектно-оријентисаном програмирању и на развоју апликација са графичким корисничким интерфејсом. Овај курс Фондација Петља објавила je под лиценцом Creative Commons Autorstvo 4.0 Međunarodna Licenca (CC BY 4.0).

    


