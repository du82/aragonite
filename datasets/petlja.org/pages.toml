description = '''
The project "Building the critical computer skills for the future ready workforce", implemented by the United Nations Development Programme (UNDP) in partnership with the Ministry of Education and with the support of the Government of the Republic of Serbia, aims to prepare students for jobs of the future. Future jobs will require a workforce that is ready for continuous improvement and quick adaptation to changes. To achieve this goal, it is essential to continuously enhance skills, with computer competencies being the top priority.                                    Learn more'''
full_description = 'The project "Building the critical computer skills for the future ready workforce", implemented by the United Nations Development Programme (UNDP) in partnership with the Ministry of Education and with the support of the Government of the Republic of Serbia, aims to prepare students for jobs of the future. Future jobs will require a workforce that is ready for continuous improvement and quick adaptation to changes. To achieve this goal, it is essential to continuously enhance skills, with computer competencies being the top priority. 21st Century Schools is a three-year project implemented by British Council and funded by the UK Government, within which by the middle of 2021 all primary schools in the Western Balkans will receive micro:bit devices that will be used in computer science and other subjects. The idea behind this very ambitious project is for students to develop critical and algorithmic thinking, and a multidisciplinary approach to problem-solving with the help of their teachers and during regular school activities. Project "Open data in social sciences" is implemented by Petlja Foundation within the United nations development program "Open data - open possibilities". This project is intended for third and fourth year undergrad students and master degree students in social sciences programes. The idea behind the "Gen-D – Nurturing a Digital Future" program is to contribute to the digital transformation in education by creating learning materials for programming, designed by the Petlja Foundation. The partner organisations from Albania, Bosnia and Herzegovina, Bulgaria, Croatia, and Serbia will work on the localization of the offered materials in order to support and improve educational standards in their respective countries. The Petlja Foundation is one of the partners on the project implemented by Propulsion powered by Microsoft through the Microsoft Philanthropies programme. International Day of Women in ICT is an initiative founded with the idea of creating a global environment that will encourage and strengthen girls and youg women to consider and start a career in the growing area of informational-comunicational technologies. This day is internationally celebrated every fourth Thursday of April.'
