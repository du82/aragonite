["https://petlja.org/sr-Latn-RS/n/kvalifikacije-za-takmi%C4%8Dare-osnovnih-%C5%A1kola/104608"]
title = "Petlja"
description = "U nedelju, 15. decembra, po prvi put, đaci osnovnih škola koji se takmiče iz programiranja će učestvovati u kvalifikacijama koje imaju pripremni karakter"
full_description = "U nedelju, 15. decembra, po prvi put, đaci osnovnih škola koji se takmiče iz programiranja će učestvovati u kvalifikacijama koje imaju pripremni karakter Društvo matematičara Srbije je ove godine uvelo novinu kada je reč o takmičenjima iz programiranja za osnovnu školu. Naime, od ove takmičarske sezone za učenike petog, šestog, sedmog i osmog razreda komisija za osnovnoškolska takmičenja je predvidela tri runde kvalifikacija sa primarnim ciljem da se učenici bolje pripreme za nastupajući ciklus takmičenja. Prva runda kvalifikacija je zakazana za nedelju, 15.12.2019. a naredne dve runde će se održati 12.01.2020. i 26.01.2020. godine. Svaka runda će počinjati u 10h i trajaće do 22h i u tom periodu će takmičari moći da pošalju svoja rešenja. Ako bismo želeli da napravimo paralelu sa sportskim takmičenjima, onda bismo ove kvalifikacije mogli da posmatramo kao pripremni turnir. Podsećamo, da bi takmičar mogao da pristupi kvalifikacijama potrebno da je ima registrovan nalog na Petlja.org. Sve informacije o samom takmičenju, načinu kako se otvara nalog, registraciji na takmičenje možete pronaći na sledećoj veb adresi: https://takprog.petlja.org/osnovnaskola Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
year_published = 2025
