["https://petlja.org/sr-Latn-RS/n/letnja-%C5%A1kola-programiranja/104647"]
title = "Petlja"
description = "Posle dugo vremena imamo priliku da se vidimo uživo i to na Letnjoj školi programiranja. Poziv za prijavu je otvoren za sve učenike starijih razreda osnovnih škola."
full_description = "Posle dugo vremena imamo priliku da se vidimo uživo i to na Letnjoj školi programiranja. Poziv za prijavu je otvoren za sve učenike starijih razreda osnovnih škola. Pozivamo učenike i učenice starijih razreda osnovnih škola da se prijave za Letnju školu programiranja, koju organizuje Fondacija Petlja, u saradnji sa Programom Ujedinjenih nacija za razvoj (UNDP) i Ministarstvom prosvete, nauke i tehnološkog razvoja, uz podršku Vlade Republike Srbije. Letnja škola programiranja će se održati u Vršcu, u terminima od 12.08 do 20.08.2022. i od 20.08 do 28.08.2022. godine. Polaznicima i polaznicama će biti obezbeđeni smeštaj i ishrana na bazi punog pansiona u „Domu učenika srednjih škola Vršac“. Nastava će se odvijati u školskom centru „Nikola Tesla“, nedaleko od Doma. Osim stručnog dela programa iz oblasti računarstva, za polaznike i polaznice će biti organizovani i razgovori sa stručnjacima iz IT industrije, kao i rekreativne aktivnosti poput izleta, kvizova i večeri društvenih igara. Smeštaj, ishrana i program Letnje škole programiranja su besplatni za polaznike i polaznice, dok troškove prevoza snose roditelji ili staratelji. Zainteresovani učenici i učenice treba da se prijave najkasnije do 21.07.2022. tako što će zajedno sa roditeljem ili starateljem popuniti upitnik koji se nalazi na sledećem linku: https://forms.office.com/r/Si1eYw5mSw a samostalno uraditi test iz programiranja u jednom od tekstualnih programskih jezika (Python/C#/C++) na Petljinoj platformi. Konačnu selekciju će obaviti stručna komisija i najkasnije do 28. jula 2022. obavestiti izabrane učenike i učenice i njihove roditelje ili staratelje. Na osnovu rezultata testa biće formirane grupe, kako bi učenici i učenice pohađali program prilagođen njihovom predznanju. Letnju školu programiranja organizuje Fondacija Petlja, u okviru projekta „Izgradnja ključnih računarskih kompetencija - ka radnoj snazi budućnosti“, koji sprovodi UNDP u partnerstvu sa Ministarstvom prosvete, nauke i tehnološkog razvoja, uz podršku Vlade Republike Srbije."
year_published = 2025
