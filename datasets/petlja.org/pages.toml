["https://petlja.org/sr-Latn-RS/n/letnja-%C5%A1kola-programiranja-za-osnovce-i-letnji-sem/104574"]
title = "Petlja"
description = "Fondacija Petlja, Majkrosoft razvojni centar u Srbiji, DMS, RAF i RG organizuju Letnju školu programiranja za osnovce i Letnji seminar za nastavnike."
full_description = "Fondacija Petlja, Majkrosoft razvojni centar u Srbiji, DMS, RAF i RG organizuju Letnju školu programiranja za osnovce i Letnji seminar za nastavnike. Fondacija Petlja u saradnji sa Majkrosoft razvojnim centrom u Srbiji, Društvom matematičara Srbije, Računarskim fakultetom i Računarskom gimnazijom organizuje krajem juna Letnju školu programiranja za osnovce i Letnji seminar za nastavnike posvećen pripremi osnovaca za takmičarsko programiranje Letnja škola programiranja za osnovce će se održati od 25. do 29. juna 2018. godine u prostorijama Računarske gimnazije i Računarskog fakulteta u Beogradu u ulici Knez Mihailova 6. Elektronsko prijavljivanje za letnju školu traje do 28. maja 2018. ili do popune slobodnih mesta. Formular za prijavu se nalazi na sledećem linku: http://rg.edu.rs/prijava-ucenici Besplatno učešće u okviru ove petodnevne letnje škole imaju svi učenici osnovnih škola koji su se plasirali na okružno takmičenje iz informatike 2018. godine, kao i svi učesnici državnih takmičenja iz informatike i matematike 2018. godine. Polaznici će biti podeljeni u grupe, osnovnu i naprednu, na osnovu prethodno urađenog testa koji će biti organizovan 26 – 28. maja na portalu https://petlja.org/ . Programom Letnje škole je planirano da polaznici svaki dan imaju po pet školskih časova posvećenih osnovama algoritama i takmičarskog programiranja. Paralelno sa Letnjom škole za osnovce, u periodu od 25. do 27. juna 2018. godine takođe u prostorijama Računarske gimnazije i Računarskog fakulteta u Beogradu, biće organizovan i Letnji seminar za nastavnike posvećen pripremi osnovaca za takmičarsko programiranje. Elektronsko prijavljivanje za Letnji seminar traje do 31. maja 2018. ili do popune slobodnih mesta. Formular za prijavu nastavnika se nalazi na sledećem linku: http://rg.edu.rs/prijava-nastavnici Pravo učešća na Letnjem seminaru imaju svi zainteresovani nastavnici, a programom je predviđeno dalje usavršavanje tehnika i algoritama primerenih različitim nivoima takmičenja, od okružnih takmičenja, pa do SIO."
