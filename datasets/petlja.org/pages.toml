["https://petlja.org/biblioteka/r/lekcije/documentation/takmicenja-takmicarsko_okruzenje"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "У овом делу можеш видети све информације о томе како изгледа такмичарско окружење на Петљи и како да користиш све функционалности које оно пружа. Ако сте наставник и желите да направите сопствено такмичење, можете погледати ово упутство. Када приступиш такмичењу, са леве стране видећеш излистане задатке. Кликом на задатак приступаш сваком појединачном задатку. Када кликнеш на било који задатак, испод текста задатка ћеш видети листу понуђених програмских језика на којима се може писати решење. Изабери језик који користиш. Када напишеш програм којим си задовољан/на и који желиш да пошаљеш, означи цео текст програма у едитору окружења у коме пишеш програме (ово врло вероватно можеш да урадиш притиском на тастере Ctrl + А), копирај (Ctrl + C), затим кликни у прозор испод текста задатка предвиђен за твоје решење и залепи свој програм (Ctrl + V). Ако текст програма означаваш мишем, води рачуна да означиш САВ ТЕКСТ програма (чест пропуст – довољно је да се изостави само први или последњи карактер текста програма и да копирани „програм” уопште не може да се изврши). Други начин да пошаљеш свој програм на тестирање је да програм учиташ из фајла са свог рачунара тако што ћеш кликнути на „Учитај” и изабрати жељени фајл. Када убациш свој програм у простор који је за то предвиђен, кликни на дугме „Пошаљи”. Ако је све у реду, поред тог дугмета треба да се појави порука да је решење успешно послато, а у десном доњем углу, појавиће се порука да ли је твој код истестиран (слика испод)"
