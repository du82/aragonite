["https://petlja.org/sr-Latn-RS/n/net.kabinet-je-spreman-za-drugo-polugodi%C5%A1te-inform/104634"]
title = "Petlja"
description = "Uoči početka drugog polugodišta su ažurirani i dopunjeni Petljini materijali za informatiku u osnovnim školama i gimnazijama na platformi net.kabinet"
full_description = "Uoči početka drugog polugodišta su ažurirani i dopunjeni Petljini materijali za informatiku u osnovnim školama i gimnazijama na platformi net.kabinet Autorski tim Fondacije Petlja je, uvažavajući povratne informacije iz nastave, ažurirao postojeće i kreirao nove otvorene obrazovne resurse koji pokrivaju drugi deo školske godine i koji su svima dostupni na platformi net.kabinet. Net.kabinet je od početka kreiran tako da svojim sadržajem i funkcionalnostima pruži podršku nastavnicima i učenicima i kada se nastava informatike odvija u školama ali i kada se odvija onlajn. Kada je reč o osnovnoj školi za svaki razred kreiran je kurs za programiranje kao osnovni preporučeni materijal od strane autorskog tima. Kursevi se sa sastoje od interaktivnih lekcija, video lekcija i kratkih kvizova za proveru znanja. Pored kursa, a kao odgovor na potrebu nastavnika, kreirane su i Zbirke kratkih pitanja koje se sastoje od niza zadataka za proveru znanja i priručnici za projektnu nastavu. Objavljivanjem materijala za peti, šesti, sedmi i osmi razred zaokružena je podrška uvođenju informatike u više razrede osnovne škole. Učenici imaju mogućnost da u svet programiranja uplove kroz blokovsko programiranje u Skreču, potom da se u šestom razredu okrenu tekstualnom programiranju u Pajtonu, sedmom nauče osnove 2D grafike i pravljenje animacija da bi u osmom zakoračili u analizu i obradu podataka. Podsećamo da su paralelno sa podrškom učenju programiranja u osnovnoj školi, kreirani i objavljeni materijali za učenike gimmnazije i specijalizovanih IT odeljenja. Na net.kabinetu se nalazi kompletno gradivo za predmet Računarstvo i informatika za prvi, drugi i treći razred gimnazije, kao i za predmet Programiranje za prvi i drugi razred specijalizovanih IT odeljenja. Svi kursevi u net.kabinetu su koncipirani tako da učenik može samostalno da prolazi kroz materijale, ali i u saradnji sa svojim nastavnikom. Nastavnici mogu da kreiraju svoj net.kabinet, da putem chat-a komuniciraju sa učenicima, zadaju domaće zadatke i kreiraju testove za proveru znanja. Koje sve mogućnosti pruža platforma net.kabinet možete pogledati u seriji jednominutnih videa koji se nalaze na OVOM linku."
