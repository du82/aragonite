["https://petlja.org/sr-Cyrl-RS/petlja/fondacija"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Сматрамо да је разумевање алгоритама и умеће алгоритамског изражавања потребно свима, а такође је важно да они који су талентовани за програмирање свој таленат препознају и развијају. За стицања алгоритамске писмености неопходан је неки вид програмирања, исто као што се без практиковања писменог изражавања не може стећи класична писменост. Програмирање не мора бити компликовано, резервисано за стручњаке, а сувопарно и досадно осталима. Наша жеља је да програмирање приближимо свима: деци и њиховим родитељима, ученицима и њиховим наставницима, радозналим корисницима технологије и свим људима који се питању шта је следеће што треба да науче. Желимо да подигнемо ниво свести у друштву о значају алгоритамске писмености, те да подстакнемо различите друштвене субјекте на активније деловање у смеру развијања и популаризације алгоритамске писмености и конкретно програмирања. То значи да образовним институцијама помогнемо да више и боље допринесу развоју алгоритамске писмености, да у широј популацији подижемо свест о значају алгоритамске писмености, подстичемо и помажемо сваког ко жели да учи програмирање, као и да окупимо појединце и компаније које својим ресурсима и ангажовањем желе да подрже развој алгоритамске писмености у Србији."
