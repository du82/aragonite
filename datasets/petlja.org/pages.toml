["https://petlja.org/en/library/r/lekcije/BlockBasedProgScratch/drawing"]
title = "Petlja"
full_description = "A new category of blocks Pen will appear in the Code tab. In this category, we have 9 blocks, which we can use for drawing on the stage. With these blocks we can erase everything we have drawn on the stage (erase all), put the pen down and up (pen down, pen up), control the color and the size of the pen easily (set pen color, change pen color, set pen size, change pen size). Initially, the sprite has the pen in the up position. To make the drawing possible, we have to put the pen down. When we think about the freehand drawing, we usually picture us drawing with a pen. This is why we will use the sprite to create a program, which will simulate the freehand style of drawing. You can find this sprite in the Sprite library. In Scratch, the sprites draw with their center. If we want to draw with the pencil’s “graphite tip”, we will have to change the center of the sprite. We can do this in the Costumes tab. When we examined sprite’s movement on the stage, we presented the block . If we run this blocks an infinite number of times (Forever), the sprite will continuously move around on the stage following the mouse cursor. Therefore, we can use this block to simulate drawing - by moving the mouse cursor around on the stage, we will “draw” on the stage. Create a program, which allows freehand drawing and ensure that the program stops running when you press the s key. Look for the appropriate blocks in the categories Events and Control. This is a great opportunity to use the blocks that allow the sprite to move with the help of arrows and upgrade them further by making the sprite draw lines of certain color and size (thickness). Analyzing the image above, we can see that it will not be hard to determine the points we need to connect to draw the boat. Create a program, which will draw the boat by using light blue lines 5 pixels thick (pen size). Don’t forget to erase everything on the stage before the drawing starts. Also, don’t forget to put the cat sprite to be a sailor on the deck of the boat."
