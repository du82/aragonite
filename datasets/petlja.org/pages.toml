["https://petlja.org/sr-Latn-RS/n/raspetljavanje-3.0-%E2%80%93--stara-aktivnost-u-novom-odel/104720"]
title = "Petlja"
description = "Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad."
full_description = "Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. RasPETLJAvanje je naš besplatan program podrške učenju programiranja koji po treći put organizujemo u saradnji sa Programom Ujedinjenih nacija za razvoj, a uz podršku Ministarstva prosvete. Novi ciklus rasPETLJAvanja fokusiran je na učenike i učenice uzrasta od 11 do 18 godina koji nemaju prethodnog iskustva u programiranju. Polaznici će imati priliku da uče programiranje putem interaktivnih kurseva sa integrisanim video lekcijama uz kontinuiranu mentorsku podršku. Na ovaj način će polaznici imati priliku da lakše savladaju osnove programiranja. Program rasPETLJAvanja je prošlo preko 600 polaznika i polaznica kojima smo pružili podršku u samostalnom učenju programiranja u prethodne dve godine. Ove godine uvodimo izmene u program i omogućićemo kontinuiranu mentorsku podršku tokom trajanja aktivnosti. Polaznici i polaznice će biti raspoređeni u mentorske grupe prema uzrastu i ritmu savladavanja gradiva. Zadatak mentora će biti da prate napredak polaznika i polaznica, a poseban akcenat biće na individualizovanom pristupu učenju prilagođenom potrebama svakog polaznika. Više o prethodna dva ciklusa rasPETLJAvanja možete pronaći na stranici posvećenoj ovoj aktivnosti, koja sadrži i dostupne materijale. Prijave su otvorene do 26.11. Svi koji žele da učestvuju mogu se prijaviti putem sledećeg formulara. Za pristup prijavnom formularu za polaznike i polaznice mlađe od 15 godina potrebno je da uz podršku roditelja ili staratelja kreiraju dečiji nalog ili se uloguju na postojeći na portalu petlja.org. Polaznicima i polaznicama sa navršenih 15 godina, pristup će biti omogućen uz regularan nalog na portalu. Prijavni formular ima dve sekcije. Prvu sekciju treba popuniti sa roditeljem/starateljem bilo da budući polaznik/ca ima navršenih 15 godina ili ne. Drugu sekciju koja se odnosi na motivaciju budući polaznik/ca popunjava samostalno."
