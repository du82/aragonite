title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Примери игара који следе су почетне идеје за организовање игара Пчелицом роботом, а у оквиру теме/пројекта повезаног са истраживањем света инсеката. Током реализације ових и сличних игара не оклевајте да их мењате заједно са децом. Такође, немојте заборавити да што више испоштујете Матрицу за анализу игара Пчелицом роботом. Пчелица робот се програмира да дође до жељеног поља на којем се налази сличица тегле. Осветљавањем тегле одштампане на папиру/картици, открива се слика инсекта који игледа као да је у њој. картице са сликама тегле и инсеката (испод картице са сликом тегле залепљена је картица инсекта који се може видети тек када се картица изложи светлости) Направити уводну причу/нарацију која ће бити у складу са претходним искуством деце. Ми смо у нашој „чаробној кутији за поруке“ пронашли „писмо из Маштограда“ чиме смо повезали ову игру са темом/пројектом који смо развијали у претходном периоду. У писму нам се обратио чувени маштоградски биолог, који нас моли за помоћ да врати тегле са инсектима. Ако успемо, помоћи ће нам да сазнамо нешто више о сваком од њих. У оквиру игре деца програмирају Пчелицу робота до одређеног поља са теглом. Узимају сличицу и окретањем те картице ка извору светлости откривају о ком инсекту је реч. Затим деца следе упутства која су добила у писму: изговарају чаробне речи и стављају картицу у нашу „чаробну кутију за поруке“. Тиме би тегле са инсектима требало да буду „враћене у Маштоград“. У наредним данима деца свакодневно завирују у кутију очекујући нову поруку, додатне информације о инсектима које су открили, нов игру и сл."
