["https://petlja.org/sr-Cyrl-RS/lsp"]
title = "Летња школа програмирања"
full_description = "Наш тим аутора и предавача сваке године припрема програм који обухвата алгоритамске задатке и рад у Пајтоновој библиотеци за 2Д графику Пајгејм, а полазници и полазнице на крају сваке смене своје знање крунишу самосталном израдом пројеката. Јако битан део у процесу учења су паузе и начин на којих их користимо. Зато слободно време проводимо у разноразним спортским активностима. Не пропуштамо прилику да се добро разгибамо уз турнире из кошарке, одбојке, шаха... Још један вид ваннаставних активности су и излети на које идемо како бисмо што боље истражили место у ком боравимо. Након дана пуног програмирања нема бољег одмора за очи од природе. Слободно време користимо и да чујемо и научимо нешто корисно. Приче људи из индустрије, неочекивани каријерни путеви и занимљиви хобији. Одакле биотехнолог у ИТ индустрији, радионице из 3Д штампе и још много тога. Прву икада Летњу школу програмирања смо организовали у Вршцу. Имали смо прилику да се дружимо у два термина током августa. Полазници и полазнице су били смештени у „Дому ученика средњих школа Вршац”, а настава се одвијала у школском центру „Никола Тесла”, недалеко од Дома."
