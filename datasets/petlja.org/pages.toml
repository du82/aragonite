["https://petlja.org/sr-Latn-RS/n/da-li-u%C4%8Destvujete-u-%C4%8Dasu-programiranja/104606"]
title = "Petlja"
description = "U nedelji od 09. do 15. decembra širom sveta se održava manifestacija pod nazivom Nedelja programiranja, a njen najpoznatiji deo je svakako akcija pod nazivom Čas programiranja"
full_description = "U nedelji od 09. do 15. decembra širom sveta se održava manifestacija pod nazivom Nedelja programiranja, a njen najpoznatiji deo je svakako akcija pod nazivom Čas programiranja Čas programiranja je prvi put organizovan 2013. godine, a osnovna ideja koja se nalazi iza ove inicijative je da se demistifikuje uvreženo mišljenje da programiranje može da nauči samo mali broj talentovanih učenika. Programiranje pored toga što razvija algoritamski način razmišljanja može biti istovremeno i zabavno i kreativno, a to je jedna od glavnih poruka koju ogranizacija Code.org koja je i pokrenula ovaj događaj želi da pošalje. Veliki broj škola u našoj zemlji svake godine učestvuje u ovoj globalnoj manifestaciji, pa verujemo da će tako biti i ove. Za sve one koji žele da organizuju Čas programiranja u nastavku je link za prijavu: https://hourofcode.com/ie Cilj ovog događaja je da se u sat vremena kroz različite formate poput predavanja, radionica i sl. promovišu računarske nauke i programiranje učenicima osnovnih i srednjih škola. U ovoj globalnoj inicijativi učešće mogu da uzmu škole, organizacije civilnog društva ili pojedinci. U Fondaciji Petlja ćemo se pridružiti ovogodišnjem Času programiranja organizovanjem dva događaja tokom kojih ćemo okupiti učenike redovnih gimnazija kao i učenike specijalizovanih IT odeljenja. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
year_published = 2025
