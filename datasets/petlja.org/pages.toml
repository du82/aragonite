["https://petlja.org/en/library/r/lekcije/BlockBasedProgMakeCodeEng/project-task---forward-and-backward"]
title = "Petlja"
full_description = "In more complex applications, it is necessary to perform an action several times, until some of the conditions for its termination are fulfilled. Loops provide the ability to repeat the same code sequence until one of the conditions for breaking it is fulfilled.7 We will first explain the loops in a simple example of the infinite movement of a robot forward and backward. We will solve this task by dividing it into two parts. The first part will consist of two blocks with which the robot will move forward and backward. Drag the block to the work surface, click on the sign + and choose the option “rotations”. Then, set the number of rotations to 1. Finally, for the robot to move forward, the value (representing power) has to be positive, we will set it to be 50. In the second block, we will set the power of the motor to be -50, so the robot can move backward. To allow the robot to move continuously (without stopping), we need to put the block presented above into an infinite loop, we will achieve this by adding the block , which will enable the robot to go forward and backward continuously (an infinite number of times), until the program is stopped by force. Connect the EV3 Brick to the computer via USB cable and download the .uf2 file to your computer by clicking the button . By dragging the file onto the EV3, it is ready to start working. We can also limit the robot’s movement; for example, we want the robot to move forward and backward three times. To do this, we will use the loop where blocks run a determined number of times. The robot will move forward and backward three times. To set the code sequence to stop after a certain number of repetitions, you need to drag the block , where we will define how many times an action should be repeated, into the block . In our case, the value will be 3. Connect the EV3 Brick to the computer via USB cable and download the .uf2 file to your computer by clicking the button . By dragging the file onto the EV3, it is ready to start working."
