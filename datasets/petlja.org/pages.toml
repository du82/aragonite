["https://petlja.org/sr-Latn-RS/n/letnja-%C5%A1kola-znanje-budu%C4%87nosti/104593"]
title = "Petlja"
description = "Fondacija Petlja u saradnji sa kompanijom GoPro i uz podršku kompanije Majkrosoft ogranizuje Letnju školu digitalnih veština namenjenu mladima iz SOS Dečijeg sela iz Centra Jaki Mladi"
full_description = "Fondacija Petlja u saradnji sa kompanijom GoPro i uz podršku kompanije Majkrosoft ogranizuje Letnju školu digitalnih veština namenjenu mladima iz SOS Dečijeg sela iz Centra Jaki Mladi U periodu od 27. do 30. avgusta u prostorijama Majkrosofta održaće se Letnja škola Znanje budućnosti – Veštačka inteligencija i Majkrosoft alati. Letnja škola se organizuje za korisnike SOS Dečijeg sela i Centra Jaki mladi koje čine mladi bez roditeljskog staranja. Polaznici Letnje škole će imati prilike da se upoznaju sa Majkrosoft alatima, osnovama programiranja kao i da čuju predavanje posvećeno veštačkoj inteligenciji. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
