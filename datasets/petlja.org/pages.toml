["https://petlja.org/sr-Latn-RS/n/%F0%9F%9A%80tiktokeri-prihvatili-izazov-da-razvijaju-algorit/104691"]
title = "Petlja"
description = "Izazvali smo 6 tiktokera i tiktokerki da zakorače u svet programiranja i rešavanja problema na jedinstven način."
full_description = 'Izazvali smo 6 tiktokera i tiktokerki da zakorače u svet programiranja i rešavanja problema na jedinstven način. Algoritamski način razmišljanja postaje neizostavna veština u današnjem svetu, omogućavajući nam da efikasno razrešavamo izazove sa kojima se susrećemo. Ovoga puta, odlučili smo se da kreiramo Izazov i pozvali smo 6 tiktokera i tiktokerki da se upuste u avanturu rešavanja zadataka i razvijaju algoritamski način razmišljanja i učenja uz Petljine kurseve. #TechTokChallenge je specijalno osmišljen izazov sa zadacima iz Petljinih kurseva koji se nalaze na net.kabinet platformi, napravljen za 6 tiktokera i tiktokerki i prilagođen njihovom nivou znanja i iskustvu. Algoritamski način razmišljanja je ključan za savremeni pristup rešavanju različitih problema i može biti veoma korisna veština u različitim oblastima. Omogućava nam efikasno, logično i strukturirano rešavanje problema, što čini srž modernog pristupa rešavanju problema. #TechTokChallenge je deo projekta "Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti", koji sprovodi Program Ujedinjenih nacija za razvoj (UNDP) u partnerstvu sa Ministarstvom prosvete, uz podršku Vlade Republike Srbije. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove.'
