full_description = "Нет.кабинет представља део сајта где се налазе курсеви које ученици могу да пролазе самосталнo или уз модерацију наставника. У курсевима се могу пронаћи различити типови садржаја - интерактивни материјали за учење, видео лекције, квизови за проверу знања. Наставник може да користи ове курсеве тако што за сваки курс који изабере, направи по један или више кабинета. У сваком кабинету наставник може да прати прогрес једне групе ученика, задаје и прегледа домаће задатке, укључује сопствене тестове и комуницира са својим ученицима. Подсећамо вас да вам за коришћење овде описаних функцоналности треба наставнички налог на Петљи. Уколико сте наставник а ваш налог на Петљи није наставнички, погледајте овде како да ваш налог постане наставнички. Такође, потребно је да имате групу у којој се налазе ваши ученици. Ако до сада нисте креирали групу, на овој страници можете видети како то да урадите. Да би направио кабинет, наставник треба да оде овде или на контролној табли кликне на Моји кабинети. На овој страници биће излистани сви направљени кабинети и наставник може да направи нови кабинет кликом на дугме Направи кабинет"
