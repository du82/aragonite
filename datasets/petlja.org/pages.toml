full_description = 'Osnovna ideja koja stoji iza projekta "Gen-D – Nurturing a Digital Future" je da se pristup učenju programiranja u ranom uzrastu koji je Fondacije Petlja trasirala u Srbiji predstavi kroz konkretne materijale partnerskim organizacijama u Albaniji, Bosni i Hercegovini, Bugarskoj i Hrvatskoj. Kreirani materijali partnerskim organizacijama mogu poslužiti kao model kurikuluma za uvođenje programiranja u njihove obrazovne sisteme. Fondacija Petlja je jedan od partnera na projektu čiji je koordinator Propulsion iz Srbije, a sam projekat se realizuje zahvaljujući sredstvima koja su odobrena od strane kompanijeMicrosoft kroz program Microsoft Philanthropies. Autorski tim Fondacije Petlja je krerao interaktivne materijale za učenje programiranja podeljene na tri nivoa: ● Nivo 1 - Prvi nivo predstavlja uvod u blokovsko programiranje uz pomoć Micro bit-a, Lego ev3 mindstorm robota i Minecraft ali i materijale za programski jezik Scrtach. ● Nivo 2 - • Drugi nivo predstavlja prelazak na tekstualno programiranje u programskom jeziku Python i učenje 2D grafike i animacija kroz Pygame biblioteku. ● Nivo 3 - • Treći nivo je posvećen analizi i prezentaciji podataka najpre kroz rad u programu za tabelarna računanja Microsoft Excel, da bi se posle nadovezao na rad u okruženju za interaktivna izračunavanja Jyputer i programski jezik Python.'
