["https://petlja.org/sr-Latn-RS/biblioteka/r/kursevi/beebot_prirucnik"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Овај приручник Фондација Петља је израдила у оквиру пројекта „Изградња кључних рачунарских компетенција - ка радној снази будућности“, који спроводи Програм уједињених нација за развој (UNDP) у партнерству са Министарством просвете, уз подршку Владе Републике Србије. Овај приручник Фондација Петља објавила je под лиценцом Creative Commons Autorstvo 4.0 Međunarodna Licenca (CC BY 4.0). Деца уче у богатој и инспиративној средини, кроз игру, и истраживање, ослањајући се на своја претходна искуства и доживљаје, кроз заједничко учешће са вршњацима и одраслима, различите начине изражавања и допринос заједницама којима припадају. Када се играју Пчелицом роботом могу истраживати, креирати, сазнавати, осмишљавати изнова и изнова своје игре, проширивати своја искуства и доживљаје, реализовати идеје, проверавати их, исправљати грешке, решавати проблеме који имају више од једног тачног одговора, сарађивати са другом децом и одраслим људима, практиковати различите концепте промишљања и приступе решавања проблема. Несумњиво је да ће се у скорој будућности појавити нове играчке и дидактичка средства која ће пратити технолошки напредак и да ћемо стално и изнова промишљати да ли су и у ком степену оне прилагођене начину на који уче деца предшколског узраста. Пчелица робот је почела да се примењује у вртићима Србије од 2015. године, у оквиру индивидуалне иницијативе васпитача и пројеката у ПУ. Она је званично добила одобрење Завода за унапређивање васпитања и образовања 2021. године као дидактичко игровно средство за интегрисано учење за децу предшколског узраста. Пчелицу робота имају и набављају вртићи и предшколске установе широм Србије, али и многих других земаља."
year_published = 2025
