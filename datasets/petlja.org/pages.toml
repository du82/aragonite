["https://petlja.org/sr-Latn-RS/projekti"]
title = "Petlja"
description = """
Projekat „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti” koji sprovodi Program Ujedinjenih nacija za razvoj (UNDP) u partnerstvu sa Ministarstvom prosvete, uz podršku Vlade Republike Srbije, ima za cilj pripremu učenika i učenica za poslove budućnosti. Poslovi budućnosti zahtevaće radnu snagu koja će biti spremna na stalno usavršavanje i brzo prilagođavanje promenama. Radi postizanja ovog cilja, ključno je neprestano unapređivati veštine, pri čemu su računarske kompetencije na prvom mestu.                                    Saznaj više"""
full_description = 'Projekat „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti” koji sprovodi Program Ujedinjenih nacija za razvoj (UNDP) u partnerstvu sa Ministarstvom prosvete, uz podršku Vlade Republike Srbije, ima za cilj pripremu učenika i učenica za poslove budućnosti. Poslovi budućnosti zahtevaće radnu snagu koja će biti spremna na stalno usavršavanje i brzo prilagođavanje promenama. Radi postizanja ovog cilja, ključno je neprestano unapređivati veštine, pri čemu su računarske kompetencije na prvom mestu. Kurs Budi Data Driven nastao je kao rezultat projekta Budi Data Driven koji je fondacija Petlja sprovela u okviru programa društvene odgovornosti Svet kakav želiš, koji je kompanija A1 sprovela u saradnji sa regionalnom organizacijom Propulsion. Budi Data Driven je kurs posvećen učenju obrade, analize i vizuelizacije podataka uz pomoć programskog jezika Pajton i interaktivnog okruženja za obradu podataka, Jupyter. Na primerima podataka iz četiri oblasti, umetnosti, javnog zdravlja, ekologije i sporta, čitaoci će moći da se upoznaju sa raznovrsnim tehnikama analize podataka, različitim tipovima vizualizacija i glavnim načinima za izvlačenje zaključaka iz podataka. Materijal će čitaocima i čitateljkama predstaviti neke osnovne koncepte statistike koje će im pomoći da samostalno donose zaključke na osnovu podataka, koristeći pri tom alate programskog jezika Pajton. Tokom 2020. godine bili smo svedoci pandemije koja je potpuno poremetila život na planeti a to i dalje čini. Da bismo razumeli fenomen epidemije, morali smo da se okrenemo mnogim naučnim disciplinama poput biologije, matematike, hemije, programiranja, jer je epidemija kompleksna pojava i da bismo je razumeli ne možemo je posmatrati samo iz jednog ugla. Upravo kurs koji se nalazi pred vama a koji su zajedničkim snagama razvili Fondacija Petlja i Inicijativa "Digitalna Srbija" u saradnji sa UNICEF-om i koji je primarno namenjen učenicima gimnazija, ima za cilj da otvori i sagleda fenomen epidemije iz ugla predmeta koji učenici gimnazije imaju u školi. Istovremeno, ovim kursom želimo da približimo školsko gradivo svakodnevnom životu i iskustvima koja su učenicima bliska.'
year_published = 2025
