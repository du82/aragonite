["https://petlja.org/en/library/r/lekcije/BlockBasedProgMakeCodeEng/makecode-and-minecraft"]
title = "Petlja"
full_description = "Minecraft is an incredibly popular, fun and creative 3D game where players can use existing tools to build structures and other tools. There are many ways that Minecraft can be used to develop creativity and problem-solving skills in players. Everything you program using MakeCode will have an immediate effect on your Minecraft world when you run the program. This is a great way to learn to program because you will be able to see the visual impact of your code right away. This immediate feedback will help you to solve problems, and allow you to see what impact changing and tweaking your code has on the game world in Minecraft! This feedback you get from the game can then be used for repeating or changing the code. In this part, you will learn how to join the Minecraft world and write codes (using MakeCode) to expand and control the Minecraft environment. Download Minecraft: Education Edition from the link: https://education.minecraft.net/get-started/download. In order to download this package, you need to access it through the account created by your school. (Ask your teacher to help you). Click on the button Create New in the dialog window Worlds. Here you can also find some already created world templates. You can create your own world by clicking the button Create New World. A window will open where you can adjust the settings for your world. For now, leave everything as you see it, except in the part Cheats, where you should slide the Activate Cheats button to the ON position, so you are able to code in Minecraft by using MakeCode. Once you have set all of the options for your new world, which you can change at any point, click on the button Create. To be able to program (code) in Minecraft, you need to type the letter “c”. The window Code Builder will appear with the list of applications you can use for coding. Choose Microsoft MakeCode: Select the option New Project from the list My Projects to create a new project. In case you want to test other programs, you can choose one of the existing examples from the Tutorials list."
