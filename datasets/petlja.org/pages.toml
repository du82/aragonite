["https://petlja.org/biblioteka/r/lekcije/documentation/uputstvo_za_nastavnike-anonimni_nalozi"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Да бисте користили ову функционалност, морате имати наставнички налог. Ако ваш налог није наставнички, погледајте овде како да добијете наставнички налог. Групу са налозима за ваше ученике можете креирати и тако што ћете на контролној табли отићи на Управљање налозима. Пре него што то урадите молимо вас да прочитате ово упутство до краја. Препоручујемо да ученици у настави користе личне налоге или налоге које су им направили родитељи (ако ученици имају мање од 15 година). Ако ипак одлучите да ученицима правите анонимне налоге, обавезно прочитајте нашу Политику приватности пре него што направите налоге зато што прављењем ових налога на себе преузимате одговорност за обраду података о личности (у складу са нашом Политиком приватности и Законом о заштити података о личности). Анонимни налози имају корисничко име попут ОЅ_00001 и Петља портал их ни на који начин не повезује са стварним идентитетом особе. На вама је да знате који ученик користи који налог уколико желите да пратите њихов рад. Анонимни налози могу бити коришћени за приступ свим деловима Петља портала осим форума Алгора, и дела сајта намењеном регистрацији за такмичења, Такпрогу. Ученици који желе да постављају питања на Алгори и да се региструју као такмичари, могу да креирају свој лични налог или им родитељи могу креирати налог, уколико су млађи од 15 година. Добићете следећу грешку ако покушате да приступите Алгори или Такпрогу са анонимним налогом:"
