["https://petlja.org/sr-Latn-RS/n/besplatni-internet-kurs-o-umetnosti-nastaloj-kroz-/104639"]
title = "Petlja"
description = 'Na platformi net.kabinet dostupan je još jedan interdisciplinarni internet kurs "Algoritamska umetnost" koji su zajedno pripremili Inicijativa „Digitalna Srbija“, Fondacija Petlja i UNICEF u Srbiji'
full_description = 'Na platformi net.kabinet dostupan je još jedan interdisciplinarni internet kurs "Algoritamska umetnost" koji su zajedno pripremili Inicijativa „Digitalna Srbija“, Fondacija Petlja i UNICEF u Srbiji Nakon što su objavili prvi besplatni internet kurs o fenomenu epidemije za srednjoškolce na srpskom jeziku, Inicijativa „Digitalna Srbija“, Fondacija Petlja i UNICEF u Srbiji pripremili su još jedan interdisciplinarni kurs namenjen srednjoškolcima pod nazivom „Algoritamska umetnost“. Kurs je nastao u mnogima neočekivanom spoju matematike i vizualne umetnosti koji je omogućila digitalna tehnologija. Uz ovaj interaktivni kurs, dostupan na besplatnoj platformi net.kabinet, učenici kroz umetnost mogu bolje i lakše da razumeju matematiku i da u formulama i kompjuterskim algoritmima otkriju nove alate za stvaranje umetničkog dela. Kurs je dostupan na www.petlja.org/net.kabinet „Algoritamska umetnost“ je prilagođena školskom programu i primarno je namenjena svakom učeniku drugog i trećeg razreda gimnazije i nastavnicima koji im predaju matematiku, informatiku i likovnu kulturu. Podjednako zanimljiva i korisna može da bude i svima ostalima koji žele da lakše savladaju matematičke probleme ili pokažu svoju kreativnost koristeći kompjuterski kod. Kurs je pisan popularnim jezikom, obiluje zanimljivim ilustracijama i primerima i uvodi učenike u neočekivane vode gde su matematika i programiranje deo sveta kreativnosti. Milena Marić, diplomirana matematičarka, gimnazijska nastavnica i jedna od autorki kursa ističe: „Naša ideja kao autorskog tima bila je da, koristeći popularni jezik i konkretne primere stavimo znanja iz matematike i informatike u novi i mnogima neočekivani kontekst. Interaktivnost ovog kursa omogućava svakom polazniku ne samo da zaviri u matematičke formule i kompjuterski kod iza postojećih umetničkih radova, već i da i sam u okviru kursa programira svoje unikatno umetničko delo, sačuva ga na računaru i podeli sa drugima.“'
