["https://petlja.org/en/library/r/lekcije/BlockBasedProgMakeCodeEng/project-task---the-house-alarm"]
title = "Petlja"
full_description = "Alarms are devices that communicate with the central control unit via an electronic network and send signals about possible movements and changes, which are detected by sensors. The principle of operation is very simple: alarm systems secure entry points, i.e. places that allow access to a home, apartment or workspace, by using sensors, which communicate with the main control unit. Sensors are usually located on doors or windows, but also on other openings that allow access inside. The House Alarm device should detect motion, as well as temperature and light level changes in the given room. If the door opens and the room temperature or the light intensity rises, the device will make a sound. To create the House Alarm device, first, we will have to make the actual (physical) device composed of the Micro:bit, which will serve as a motion sensor, the Micro:bit which will detect the change in room temperature and light level, and the Micro:bit which will make a sound when changes are detected (the Micro:bit connected to speakers or headphones must be placed about 10 meters from the sensor). ­1. The first has to detect movement. 2. The second detects changes in temperature and light level. 3. The third produces a sound when movement, changes in temperature or light level are detected in the room. Now, we want to program motion detection; more specifically, we want to register motion using the Micro:bit. When we want to establish communication (to use radio communication) between Micro:bits, all included Micro:bits must belong to the same group, i.e. the must use the same group ID. To create an ID group, we need to drag the block from the category into the block from the category . Into the space we type the desired number for the group ID. This can be any number. We will leave the number 1. This way, we have created the group with the ID 1 in which all Micro:bits will communicate. Based on the setup of the task, when a movement is registered (or in our case when the conditions are fulfilled), the Micro:bit will send a certain value by using the block ."
