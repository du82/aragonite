["https://petlja.org/en/library/r/lekcije/BlockBasedProgMakeCodeEng/working-with-blocks-from-the-logic-category"]
title = "Petlja"
full_description = "The programs we created so far were executed block by block, from the first to the last block. This kind of program execution is called sequential. In sequential (linear) execution, skipping (omitting) blocks is not possible. They are all executed once (if they are inside the block) or multiple times (if they are inside the block). However, it may happen that the task you are working on requires that you change the way the program is executed. For example, if you are creating a program that will be used by younger students to learn computation (arithmetic), you may want to run certain blocks, which you use to commend the correct answer or you may want to run completely different blocks, which provide comments for the incorrect answers. Based on whether an answer is correct or incorrect, you may have the need to run different sets of blocks. That is why we say that the program forms branches, i.e. that blocks from one branch are being executed, while the blocks from another branch are not. You make decisions every day and continue your daily activities based on them. For example, the temperature in the classroom is 30 degrees Celsius, and you want to turn on the air conditioner. Your next step would be to check the temperature in the classroom and decide if you want to turn on the air conditioner. By using a comparison operator, you can compare values ​​and determine if one is larger/smaller than the other or if they are equal. The result of the comparison may be TRUE or FALSE. Q-8: The temperature in the room is 28 degrees Celsius. Analyze the blocks given in the figure and mark the correct statement. There is a challenge in front of you, if a randomly chosen number (from the interval 0 to 100) is an even number, you should display the text “The number is even.”, and if the number is an odd number, you should display the text “The number is odd.”. When is a number even, and when is it odd? If by using integer division, we divide a number by 2, and there is no remainder, the number is considered even. If, when we use integer division to divide a number by 2, the remainder is 1, then we know that it is an odd number."
year_published = 2025
