["https://petlja.org/raspetljavanje"]
title = "Raspetljavanje"
full_description = "Zimski tromesečni onlajn program rasPETLJAvanje, koji organizujemo od 2022. godine, pruža jedinstvenu priliku učenicima i učenicama uzrasta od 11 do 18 godina da otkriju šta se sve programiranjem može, kao i da steknu i unaprede svoje programerske veštine. U pitanju je program podrške učenju koji svojim trajanjem omogućava kontinuitet, a materijalima koji ostaju besplatno dostupni i nakon završetka programa omogućava dugoročnu podršku. Svakim novim ciklusom rasPETLJAvanja trudimo se da program unapredimo na osnovu utisaka polaznika i polaznica programa. Zato je svaki ciklus rasPETLJAvanja jedinstven i otkriva čari programiranja iz jednog novog ugla. Ispod ovog teksta nalaze se sličice različitih raspetljanih karaktera, poput robota i lisice. Svaki karakter prati jedan ciklus rasPETLJAvanja. Klikom na sličice, otvara se posebna stranica za svaki ciklus rasPETLJAvanja, a na kojoj se nalaze materijali za učenje dostupni svima, bez obzira na uzrast i to da li su pratili jedan od ranijih ciklusa rasPETLJAvanja ili ne. Otkrij svoj ugao učenja programiranja uz naše raspetljane materijale. Materijali kojima možeš da pristupiš uključuju: interaktivne kurseve, zadatke za vežbanje i snimke predavanja. U nekim ciklusima rasPETLJAvanja pronaći ćeš sva tri tipa materijala, a u nekima samo neke od navedenih tipova materijala. Za pristup materijalima neophodno je da se uloguješ na svoj nalog na Petlji. Ovaj program Fondacija Petlja realizuje u sklopu projekta „Izgradnja ključnih računarskih kompetencija – ka radnoj snazi budućnosti“, koji sprovodi Program Ujedinjenih nacija za razvoj u partnerstvu sa Ministarstvom prosvete, a uz podršku Vlade Republike Srbije."
