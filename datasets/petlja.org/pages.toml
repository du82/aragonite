["https://petlja.org/biblioteka/r/lekcije/documentation/materijali-zbirka"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "Овај текст ће вам бити користан ако желите да радите задатке у нашим Збиркама, а такође ће вам бити користан ако желите да као наставник укључите овај материјал у наставу. Наше збирке можете пронаћи у оквиру Библиотеке на следећем линку: https://petlja.org/sr-Latn-RS/biblioteka#type-problems&type-problem-questions За сваки задатак у збиркама потребно је написати програм који за улазне податке у прецизно дефинисаном формату даје очекиване излазне вредности у ограниченом временском оквиру и уз ограничену употребу меморије, слично као и за такмичења на Арени. Добар део задатака у збиркама је решен и велики број задатака решен је на неколико начина. Сви начини решавања задатка детаљно су објашњени, а понуђен је изворни код који представља решење задатка у програмским језицима C++, C# и Пајтон. Поред самих задатака, управо су ова решења задатака оно што збирке може учинити врло корисном у настави, будући да су у текстовима решења објашњени неки од кључних концепата у програмирању. Доступност решења зависи од типа корисничког налога. Корисници са наставничким налогом имају приступ решењима свих задатака. Решења се могу пронаћи испод самих задатака. Обични корисници, за разлику од наставника, не могу видети решења свих задатака. Овим корисницима је омогућено да виде решења неких задатака зато што сматрамо да је потребно, уколико не могу самостално да реше неки задатак, да на овај начин помогнемо њихово учење. Међутим, како не желимо да ученици прибегну гледању решења чак и када би, уз мало труда могли и сами да реше задатак, за њих је решење сакривено и треба да кликну на дугме Погледај решење и да, затим, потврде да желе да погледају решење да би му приступили."
