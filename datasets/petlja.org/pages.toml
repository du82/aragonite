["https://petlja.org/en/library/r/lekcije/BlockBasedProgScratch/motion"]
title = "Petlja"
full_description = "You already got to know the Scratch user interface, you learned how to create sprites and determine their position on the stage. Now is a perfect time to learn how to move them by using commands (blocks) from the category Motion. These blocks will enable you to make simple games and animations. You will use these blocks when you need to program your sprite to move to a specific location (point) on the stage. We remind you that the stage is a rectangular surface 480 pixels wide and 360 pixels high. The center has the coordinates (x:0 y:0). If you want the chase to last longer, you can use the block . With this block the cat will glide for 1 second from the point (x:0 y:0) to the point (x:150 y:100). You can always see the current position of the sprite (the current values of x: and y:) below the stage, in the sprite list. Q-5: Analyze the position of the mice presented in the figure below and select the program, which will allow the cat to “catch” all the mice. So, by using the blocks for absolute motion, you tell your sprite exactly where it should go on the stage. Relative motion is not determined by the location the sprite should go to, but by the current position of the sprite. In the example where the cat was chasing the mouse, we knew the exact location of the mouse (the point in which it is located). The situations where we do not know the sprite’s location are more common. In these cases, we will use blocks for relative motion to move our sprites. When it comes to relative motion, it is very important to point (turn) the sprite in the desired direction. We achieve this by dragging the arrow around the circle of the block . It is good for you to know that direction toward 0 represents up, toward 90 is to the right, toward 180 is down, and toward -90 is to the left. You can always see the current direction of the sprite below the stage, in the sprite list in the field Direction. Q-6: Analyze the program presented in the figure, and select what you think is the direction of the sprite, as well as what will be its position after the program finished running."
