full_description = "У овом упутству можеш пронаћи информације које ће ти помоћи да у потпуности искористиш могућности које ти пружа Петљино такмичарско окружење. Било би добро да ово упутство прочиташ до краја, пошто може да ти разјасни многе нејасноће и помогне ти да оствариш боље резултате на такмичењима. Ако сте наставник и желите да направите сопствено такмичење, можете погледати ово упутство. Пре свега, да би уопште могао/ла да се такмичиш, неопходно је да имаш отворен налог на Петљи. Ако до сада ниси отворио/ла налог, то можеш да урадиш на овом линку. Имај у виду да ако имаш мање од 15 година, налог морају да ти отворе родитељи. Они то могу да ураде тако што прво направе свој налог на Петљи, а онда и теби креирају један пратећи ово упуство."
