title = "Petlja"
full_description = "Events are occurrences, which are usually results of something the user did (clicking the mouse, pressing keys on the keyboard, drag and drop, etc.). An event causes a reaction. An event in computer science is an action detected (performed) by a computer. For example, by clicking the mouse, we open an application, when it starts raining people open umbrellas. In programming, an event handler is the part of the program (function) which is activated as a result of some event. In MakeCode event handlers are blocks which usually start with the word on: We will use an event to simulate planting trees and displaying the current position of the character in the Minecraft world, by adding the command position. Thinking about the task: The character interacts with the world by moving around, i.e. trees are planted. The character plants trees by moving around the Minecraft world. Sending a message (through chat) displays the current position of the character. To start the chat, or more specifically, to trigger an event which will display character’s current position, we need to drag the block from the category to the work surface, and then type the word position into the input field of this block. Within this block, we need to add blocks that will say the current position. To say any message (e.g. My current position is:) we need to use the block from the category . The character’s (player’s) position is stored in the block from the category . Since we want to display the position of the player in chat, we need to use the block form the category . Instead of the option position, we will insert the block into the field: After testing the program, we can see that we got what we wanted. When the user presses the key T, opens the chat and types in the message position, player’s current position in the world will be displayed. Now we need to create an event for the character, which will enable it to plant trees in the Minecraft world with its movement. This will be achieved with the block . From the drop-down list of this block we will choose the option walk:"
