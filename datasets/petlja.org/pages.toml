["https://petlja.org/biblioteka/r/lekcije/beebot_prirucnik/01_o_pcelici_robotu-index"]
title = "Petlja"
description = "Fondacija Petlja je osnovana sa ciljem unapređivanja algoritamske pismenosti u Srbiji"
full_description = "„Дигитална технологија добија све значајнију улогу у животу деце, обликујући њихове свакодневне активности: начин на који проводе слободно време, комуницирају, играју и друже се са вршњацима, уче и стичу нова искуства“ - Деца у дигиталном добу, стр.12 Када размишљамо о избору иновативне играчке или дидактичког средства за децу, потребно је да промислимо, поред осталог, о томе да ли је безбедна за дете, да ли чува његову приватност, можемо ли је са успехом примењивати у складу са постојећим Основама програма предшколског васпитања и образовања и начином на који уче деца. Више о карактеристикама дигиталних уређаја и дигиталних садржаја за децу можете прочитати у Смерницама за примену дигиталних технологија у предшколској установи на линку: https://ecec.mpn.gov.rs/wp-content/uploads/2023/06/Smernice-za-primenu-digitalnih-tehnologija-u-PU.pdf Не треба заборавити да постоје програмиране и паметне играчке које нису у складу са начином на који деца уче, које све раде саме, ограничавају дечју машту, повезане су на интернет, могу да прикупљају податке о детету, допуштају само једно тачно решење и сл. С друге стране, постоје роботи за програмирање који се могу користити у различитим контекстима игре, могу бити повезани са различитим истраживањима у оквиру теме/пројеката које васпитачи развијају са децом у вртићу, који омогућавају више решења за један проблем који се поставља током игре и сл. Један од таквих робота је Пчелица робот. Поред Пчелице робота постоје и многи други роботи који имају релативно сличне могућности. Два су приказана на сликама."
