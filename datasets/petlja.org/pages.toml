["https://petlja.org/sr-Latn-RS/n/%C5%A1kolski-%C4%8Das-sa-petljom-/104588"]
title = "Petlja"
description = 'Fondacija Petlja započinje ciklus vebinara namenjenih nastavnicima informatike u osnovnim i srednjim školama pod nazivom "Školski čas sa Petljom". Prvi vebinar je zakazan za sredu 27. marta u 20.00h'
full_description = 'Fondacija Petlja započinje ciklus vebinara namenjenih nastavnicima informatike u osnovnim i srednjim školama pod nazivom "Školski čas sa Petljom". Prvi vebinar je zakazan za sredu 27. marta u 20.00h U želji da nastavimo da razvijamo dobre relacije sa nastavnicima informatike i računarstva u osnovnim i srednjim školama, a kako bismo znali da odgovorimo na potrebe i pružimo dodatnu podršku, pokrećemo seriju vebinara pod nazivom "Školski čas sa Petljom". Svakih 14 dana organizovaćemo vebinar na kome želimo da čujemo primere dobre prakse u nastavi računarstva direktno od onih koji rade u učionici. Želimo da motivišemo nastavnike da nominuju temu, predlože predavača i podele sa nama svoje iskustvo iz učionice. Tema prvog vebinara biće "Žašto nastavnik treba da predaje uz računar?" Predavanje u trajanju jednog školskog časa održaće naš saradnik prof. dr Dragan Mašulović, autor Petljinog materijala Analiza i prezentacija podataka u Jupyter-u i redovni profesor na Prirodno matematičkom fakultetu u Novom Sadu. Vebinar je zakazan za sredu, 27. marta sa početkom u 20.00 časova. Prijava za vebinar se nalazi na sledećem linku: https://forms.gle/w6uuyQPPbLamxGBs5 Rok za registraciju je sreda 27. mart u 15.00 časova. Verujemo da ovaj vid razmene iskustva i znanja može biti dragocen svim nastavnicima. Mi u Petlji pažljivo slušamo sugestije i predloge koje nam nastavnici daju. Tako su, uostalom, i nastale video lekcije i modeli pripreme časa koje su dostupe stranici Zbornica, posebno kreiranoj za nastavnike informatike https://petlja.org/zbornica Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji.'
