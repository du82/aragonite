["https://petlja.org/sr-Latn-RS/n/kadrovi-utisaka:-polaznici-i-predava%C4%8Di-o-zimskoj-%C5%A1/104619"]
title = "Petlja"
description = "Fondacija Petlja je realizovala jednomesečnu školu namenjenu studentima društveno-humanističkih nauka gde je u centru bila priča o analizi otvorenih podataka"
full_description = "Fondacija Petlja je realizovala jednomesečnu školu namenjenu studentima društveno-humanističkih nauka gde je u centru bila priča o analizi otvorenih podataka Polaznici i predavači Zimske škole otvorenih podataka za studente društveno-humanističkih nauka su podelili sa nama svoje utiske nakon završene jednomesečne škole. Projekat Zimska škola otvorenih podataka za studente društveno-humanističkih nauka je trajala mesec dana tokom kojih je 30 odabranih polaznika imalo prilike da nauči nešto više o konceptu otvorenih podataka, kako da te podatke obradi, analizira i na kraju vizualizuje uz pomoć programskog jezika Python i okruženja Jupyter. Ovaj projekat je podržan od strane projekta Otvoreni podaci – otvorene mogućnosti, koji sprovode Kancelarija za informacione tehnologije i elektronsku upravu i Program Ujedinjenih nacija za razvoj, uz podršku Svetske banke i Fonda za dobru upravu Ujedinjenog Kraljevstva. Pozivamo sve zainteresovane nastavnice i nastavnike razredne nastave iz školske uprave Zrenjanin da se prijave na obuku za primenu mikrobit uređaja u nastavi. Pripremili smo novi ciklus besplatnog programa rasPETLJAvanje, ovog puta sa većim fokusom na mentorski rad. U Beogradu održano finale sedamnaestog po redu Bubble Cup takmičenja koje organizujemo u saradnji sa Razvojnim centrom Majkrosofta u Srbiji. Sa priručnikom namenjenim vaspitačima i vaspitačicama Petlja proširuje svoju podršku i na predškolske ustanove."
