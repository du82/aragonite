title = "Hydrokultur – Ratgeber | Das Wichtigste für den Einstieg!"
description = "Lieferung enthält 1 Hydrokulturpflanze mit Topf, Wasserstandsanzeiger und Blähton SubstratPflanzenhöhe (inklusive Topf): 25 cm — Topfgröße Ø: 13 cmSie erhalten ein komplettes Hydrokultur System, neben einer Hydrokulturpflanze, einen..."
full_description = "In Hydrokultur wachsen Zimmerpflanzen ohne Erde! Kann das Natur sein? Aber ja! Schon 600 vor Christus wuchsen in den Hängenden Gärten von Babylon Pflanzen in Wasser. Durch den Wissenschaftler Justus von Liebig wissen wir heute, dass Pflanzen die Nährstoffe übers Wasser aufnehmen. Hydrokultur ermöglicht die Kultivierung von Zimmerpflanzen für jeden – auch ohne grünen Daumen! In diesem Ratgeber erfährst Du kurz und knapp: was Hydrokultur ist, wie Hydrokultur funktioniert, und die Vorteile von Hydrokulturen! Doch damit nicht genug: Zum Schluss lernst Du,wie Du Deine eigene Pflanze in Hydrokultur kultivierst und was Du dafür brauchst!Viel Spaß beim Lesen und Kommentieren! Inhalt Was ist Hydrokultur? Definition Geschichte Aufgepasst: Hydrokultur ≠ Hydroponik Wie funktioniert Hydrokultur? Vorteile von Hydrokulturen 6 Schritte zur eigenen Hydrokultur 1. Wähle geeignete Hydropflanzen 2. Der passende Hydrokultur-Topf 3. Der richtige Blähton 4. Der geeignete Hydrokultur-Dünger 5. Bepflanze Deinen Kulturtopf 6. Die richtige Bewässerung Bonus: Wartung und Pflege Literaturverzeichnis Was ist Hydrokultur? Hydrokultur ist die Kultivierung von Zimmerpflanzen im Anstauverfahren, welche mit einer Nährlösung versorgt und mit Blähton fixiert werden. Definition „Hydro“ (griech.) meint „Wasser“ und „Kultur“ (lat. cultura) „das vom Menschen geschaffene“. Sinngemäß bedeutet Hydrokultur also „Wasserkultur“. Die Deutsche Gesellschaft für Hydrokultur e. V. definiert Hydrokultur als „die Kultur erdeloser Pflanzen“. Konkreter ist der Zusatz um Gerhard Baumann, der definitorisch auch das Alltagsverständnis trifft: „Hydrokultur als Kultursystem bedeutet im deutschsprachigen Raum: Zier-Pflanzenhaltung in Blähton im Anstau-Verfahren“.1§ 1 der Satzung der DGHK Geschichte Justus von Liebig erkannte, dass Pflanzen wasserlösliche anorganische Nährstoffe verwerten. Auf dieser Grundlage gelang es 1860 Julius Sachs und Wilhelm Knop erstmals Pflanzen ohne Erde zu kultivieren. Ein neuer Forschungszweig entstand, den William Frederick Gericke 1940 durch seine Publikation „the complete guide to soiless gardening“ maßgeblich prägte. Er legte den Grundstein für den erdlosen Anbau – die Hydroponik. Der Durchbruch der Hydrokultur gelang Gerhard Baumann 1959 mit der Nutzung von Blähton. Zierpflanzen in Hydro-Töpfen erhielten Einzug in Büros und Wohnräume. Aufgepasst: Hydrokultur ≠ Hydroponik Hydrokultur wird oft mit Hydroponik (engl. Hydroponics) gleichgesetzt. Das ist falsch! Hydroponik meint die hydroponische Kultivierung von Nutzpflanzen, nicht die Kultivierung von Zierpflanzen! Wie funktioniert Hydrokultur? Eine Pflanze in Hydrokultur wächst in einem Topf – von Blähton fixiert und mit einer Nährlösung versorgt. Ein Hydrokultur-System besteht aus Übertopf und Hydrokultur-Topf. Der Übertopf dient als Wasser- und Nährstoffspeicher. Der wasserdurchlässige Innentopf wird darin eingelassen und mit Blähton befüllt. Einfacher Hydrokultur-Topf mit Übertopf Der Blähton fixiert die Pflanze und versorgt sie mit Nährlösung, in dem seine Kapillarkraft die Nährlösung hoch in den Wurzelraum transportiert. Sein Porenvolumen ermöglicht einen hohen Sauerstoffaustausch und verhindert so Wurzelfäule. Die Nährlösung ist ein Gemisch aus Wasser und darin gelösten Nährstoffen. Entweder wird die Pflanze mit einer Nährlösung gegossen oder ein fester Langzeitdünger zwischen Hydrokultur-Topf und Übertopf platziert. Dieser löst sich über Monate auf. Vorteile von Hydrokulturen Hydrokulturen sind besonders für Zierpflanzenliebhaber*innen, Urlauber*innen und Gärtner*innen ohne grünen Daumen vorteilhaft. Die wichtigsten Vorteile im Überblick: Verreise 3 Wochen in den Urlaub – ohne Deine Hydrokulturen zu pflegen. Gesundes Wachstum durch stetigen Zugang zu Wasser und Nährstoffen. Höhere Luftfeuchtigkeit und besseres Raumklima. Keine Erde und somit wenig Schmutz, Insekten oder Schädlinge. Interessante Anbaumethode für manche Allergiker. Wenig Aufwand durch seltenes Gießen und kein jährliches Umtopfen. Höheres Wohlbefinden durch den Zierwert der Pflanzen. Vermehre schnell und einfach Pflanzen als Steckling. Gesunde Pflanzen auch ohne „grünen Daumen“. Kein Problem mit Trauermücken. Einfaches Umtopfen, von Erde in Hydrokultur. 6 Schritte zur eigenen Hydrokultur Leg los und beginne noch heute mit eigenen Hydrokulturen und genieße die Vorteile einer erdlosen Anzucht! 1. Wähle geeignete Hydropflanzen Kennst Du schon Deine Wunschpflanze? Falls ja, hast Du die Auswahl zwischen allen Arten dieser Welt! Besonders gut eignen sich Grün- und Blattpflanzen, Blütenpflanzen und sogar Orchideen und Kakteen. Prüfe als Erstes den Standort der Pflanze auf sein Lichtangebot und suche die passende Pflanze in der Tabelle. Ein schattiger Platz bei lichtliebenden Pflanzen schwächt nicht nur Deine Pflanze, sondern kann zu Überdüngung führen. Schädlinge haben dann leichtes Spiel. Klicke auf den Button für eine Auswahl geeigneter Arten in Hydrokultur: Geeignete Pflanzen Tipp: Kaufe als Anfänger Pflanzen, die in Hydrokultur aufgezogen wurden! Das spart viel Zeit und Aufwand. Eine Pflanze aus Erde in Wasser zu kultivieren ist möglich, erfordert jedoch Erfahrung. EVRGREEN |Zimmerpflanze Einblatt in Hydrokultur mit weißem Topf als Set | Friedenslilie...* Lieferung enthält 1 Hydrokulturpflanze mit Topf, Wasserstandsanzeiger und Blähton SubstratPflanzenhöhe (inklusive Topf): 25 cm — Topfgröße Ø: 13 cmSie erhalten ein komplettes Hydrokultur System, neben einer Hydrokulturpflanze, einen... Bei Amazon kaufen Preis inkl. MwSt., zzgl. Versandkosten, Letzte Aktualisierung am 2.03.2025 2. Der passende Hydrokultur-Topf Für Dein erstes Hydrokultur-System ist ein Übertopf mit einem Hydrokultur-Topf inklusive Wasserstandsanzeiger am besten geeignet. Bei den vorher beworbenen Pflanzen ist ein Hydrokultur- und Übertopf direkt dabei. So bist Du auf der sicheren Seite! Angebot LECHUZA CLASSICO Color 18 weiß 13261, 19x19x17 cm* MIT BEWÄSSERUNGSSYSTEM: Das im Pflanzgefäß integrierte Original LECHUZA-Bewässerungssystem...FÜR INNEN & AUßEN GEEIGNET: Unkomplizierte Pflanzenpflege das ganze Jahr über. Pflanzgefäß mit...MADE IN GERMANY: Hochwertiger, UV- und witterungsbeständiger Kunststoff, zu 100% recycelbar,... −3,04 EUR 15,95 EUR Bei Amazon kaufen Preis inkl. MwSt., zzgl. Versandkosten, Letzte Aktualisierung am 2.03.2025 3. Der richtige Blähton Blähton fixiert die Pflanze. Durch seine raue Oberfläche entstehen Kapillarkräfte, die das Wasser in die Wurzelzone transportieren. Das Substrat ermöglichen eine ausgewogene Luftzirkulation und verhindern so Wurzelfäule. Das ist in der Anwendung und beim Kauf zu beachten: Spüle den Blähton vor der ersten Anwendung gründlich aus. Wähle eine Korngröße von 8 bis 16 mm (4 – 8 mm ist OK, aber nicht ideal). Kaufe hochwertiges Tongranulat bei einem seriösen Lieferanten. Blähton beeinflusst den pH-Wert der Nährlösung, daher ist ein guter Hydrokultur-Dünger mit pH-Puffer entscheidend! Dehner Pflanzton, 25 l, Körnung 8/16 mm* Grobkörniges PflanzgranulatMit feinporigen Körnchen aus TonSpeichern und liefern Wasser und Nährstoffe 19,99 EUR Bei Amazon kaufen Preis inkl. MwSt., zzgl. Versandkosten, Letzte Aktualisierung am 2.03.2025 4. Der geeignete Hydrokultur-Dünger Verwende nur anorganische und für Hydrokulturen hergestellte Dünger, welche die essenziellen Nährstoffe enthalten! Entweder wählst Du ein Dünger-Konzentrat oder ein Dünger-Granulat. Das Konzentrat wird mit Wasser vermischt. Das Granulat wird in den Topf gegeben und löst langsam auf. Wir empfehlen einen Flüssigdünger. Langfristig solltest Du Dich mit dem pH-Wert und EC-Wert der Nährlösung beschäftigen. Vorerst genügt ein hochwertiger Hydrokultur-Dünger, weil dieser für einen angemessenen pH- und EC-Wert sorgt – die richtige Dosierung vorausgesetzt. Angebot Mairol Hydrokulturen-Dünger Hydropflege Liquid 1.000 ml* Mairol Turbo-Aktiv-Effekt: Ausgesuchte chelatisierte Spurenelemente stehen der Pflanze unmittelbar...Hohe Ergiebigkeit: 1 Liter Hydrokulturen-Dünger reicht für 1000 l GießwasserFür Blattdüngung geeignet −0,61 EUR 14,28 EUR Bei Amazon kaufen Preis inkl. MwSt., zzgl. Versandkosten, Letzte Aktualisierung am 2.03.2025 5. Bepflanze Deinen Kulturtopf Stelle den Topfeinsatz in den Übertopf und fülle eine Schicht Blähton hinein. Die unterste Schicht muss Kontakt zur Nährlösung haben. Halte nun die Pflanze zwischen Wurzeln und Spross etwas unter der Topfkante. Fülle jetzt vorsichtig den Blähton hinein. Umso besser das Wurzelwerk im Topf ausgebreitet ist, desto mehr Sauerstoff und Nährlösung nimmt es auf. EVRGREEN | Zimmerpflanze Strahlenaralie in Hydrokultur mit weißem Topf als Set | Schefflea...* Lieferung enthält 1 Hydrokulturpflanze mit Topf, Wasserstandsanzeiger und Blähton SubstratPflanzenhöhe (inklusive Topf): 35 cm — Topfgröße Ø: 13 cmSie erhalten ein komplettes Hydrokultur System, neben einer Hydrokulturpflanze, einen... Bei Amazon kaufen Preis inkl. MwSt., zzgl. Versandkosten, Letzte Aktualisierung am 2.03.2025 6. Die richtige Bewässerung Der Gießanzeiger zeigt den maximalen und minimalen Wasserstand an. Der optimale Wasserstand liegt dazwischen. Fülle beim Eintopfen auf „Maximum“ auf. Erst wenn das „Minimum“ erreicht ist, sollte auf „Optimum“ aufgefüllt werden. Ignoriere bis auf Weiteres das Maximum. So verhinderst Du Wurzelfäule. Bei „Minimum“ genügt der Wasservorrat ein paar Tage. Kontrolliere beim Gießen, ob der Wasserstandsanzeiger schwimmt. Falls nicht, spüle ihn aus oder löse die Verkantung durch leichtes Klopfen. Hydrokultur Sets Happy-Nature Set5 Blumentopf Venus weiß 09/07 Ø 11.5cm H 08cm+KT+WA+BT+HD50* 15,99 EUR Bei Amazon kaufen Preis inkl. MwSt., zzgl. Versandkosten, Letzte Aktualisierung am 2.03.2025 Bonus: Wartung und Pflege Hydrokulturen erfordern wenig Zeit und Aufwand. Trotzdem solltest Du das über die Pflege und Wartung wissen: Reduziere in lichtarmen Monaten die Nährstoffzugabe um die Hälfte. Fülle in lichtarmen Monaten das Wasser nur bis zur Hälfte. Lasse den Wasserstand immer auf Minimum-Marke absinken. Halte den Blähton frei von Pflanzenresten, aufgrund von Fäulnis-Gefahr. Du kannst lange Triebe abschneiden und als Stecklinge nutzen. Versalzten Blähton mit warmen Wässern abspülen und wiederverwenden. Bei Bedarf hartlaubige Pflanzen mit einem feuchten Tuch abstauben – für eine bessere Fotosynthese. Bei tropischen Pflanzen sollte das Gießwasser 18 – 20 °C betragen. Vermeide organische Substrate, wie z. B. Torf. Ich hoffe, Dir hat dieser Beitrag geholfen. Ich freue mich sehr über Dein Feedback! Literaturverzeichnis1§ 1 der Satzung der DGHK"
