title = "PgBouncer - lightweight connection pooler for PostgreSQL"
full_description = "PgBouncer 1.24.0 has been released. This release contains a number of new features along with a variety of improvements and bug fixes. Highlights are: Tracking and limiting connection counts per user and database. Greatly reducing performance overhead of RELOAD on setups with TLS enabled. Prepared statement support being turned on by default. See the full details in the changelog. Download here: pgbouncer-1.24.0.tar.gz (sha256) PgBouncer 1.23.1 has been released. This release fixes two crashes that could occur since 1.23.0. If you are on 1.23.0, upgrading to 1.23.1 is strongly recommended. See the full details in the changelog. Download here: pgbouncer-1.23.1.tar.gz (sha256) PgBouncer 1.23.0 has been released. This release contains a number of new features along with a variety of improvements and bug fixes. Highlights are: User name maps can now be used in authentication configuration. In multi-process PgBouncer setups, it is now possible to do rolling restarts. Replication connections can go through PgBouncer. See the full details in the changelog. Download here: pgbouncer-1.23.0.tar.gz (sha256)"
