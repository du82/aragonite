["https://www.pgdp.net/c/credits.php"]
title = "DP: Credits"
full_description = "This software is brought to you by many volunteer developers across the world over many years. Recent developer contributions after the move to git can be seen on the project's Github Contributors page. Distributed Proofreaders is dedicated to the preservation of written works that are in the Public Domain in the United States by converting them into high-quality, freely available digital transcriptions. This is accomplished through the efforts of a supportive community of volunteers. Distributed Proofreaders follows the principles of the American Library Association Freedom to Read statement. Distributed Proofreaders was founded in 2000 by Charles Franks to support the digitization of Public Domain books. Originally conceived to assist Project Gutenberg (PG), Distributed Proofreaders (DP) is now the main source of PG e-books. In 2002, Distributed Proofreaders became an official PG site. In May 2006, Distributed Proofreaders became a separate legal entity and continues to maintain a strong relationship with PG. ©Distributed Proofreaders · Page built at 2025-03-06 22:32 EST in 0.429s · Credits · Report a Bug"
