ost-Processing Verification Guidelines Post-Processing Workbench PPVtxt Tool PPVhtml Tool Content Providing and Project Management [View List of Links] Content Providing FAQ Project Managing FAQ Content Provider and Project Manager Roles Information For New and Returning CPers and PMs Content Providing Jargon Guide Useful Links for Content Providers and Project Managers Content Providing Advice Project Management Advice Content Providers seeking Project Managers Checklists Project completeness checklist Project Comments Checklist Project Categorization Difficulty level Genre Scans Illustration scans Page scans PM Mentoring P3 skip evaluation Project hospital Project Management with Linux Release queue Special Days Type-in project WordCheck FAQ for Project Managers Music Guidelines for Project Managers A personal View of PMing All Wiki Pages Related to Content Providing All Wiki Pages Related to Project Management Overview of Distributed Proofreaders [View List of Links] Distributed Proofreaders Mission Statement Distributed Proofreaders Code of Conduct Distributed Proofreaders Privacy Policy Distributed Proofreaders Roles and Access General Workflow Diagram New Volunteer Frequently Asked Questions DP Jargon Guide DP Timeline In Memoriam: Remembrance of DPers past Promoting DP [View List of Links] PGDP promotional materials Distributed Proofreaders Branding Index of pages in DP Promotion Category DP Development [View List of Links] DP Code Development Index of pages in DP Development Category About this Wiki [View List of Links] This wiki contains a mix of official DP documentation (managed by the DP site administrators and others appointed by them) and other helpful user-created and user-maintained information. You can identify official documentation several ways: by its page name (which begins "DP Official Documenation:"), by the title on the first tab at the top of the page ("dp official documentation"), and by the light yellow page header that reads "DP Official Documentation". For information on how to search for information on this wiki, please read the How to Search the Wiki article. For information on how to edit wiki pages, please read the Editing article. The Exploration Overviews can be thought of as analogous to Tables of Contents for the Wiki. Explore the Wiki on the basis of who we are and who we know. Explore the Wiki on the basis of the status of projects. (work in progress) Explore the Wiki on the basis of books (and book-like stuff we do). (work in progress) Explore the Wiki on the basis of common questions and needs. (work in progress) The Categories form a kind of Directory or Index for the Wiki. Categories allow you to find information grouped into broad subject areas, such as Content Providing, Post-processing, Project Coordination, and Uberprojects. Searching for a simple term or topic using the search box may take you to a basic definition page for that term. That definition page will likely have links to more in-depth information. The All Articles page allows you to view alphabetical lists of all pages in the Wiki. The Recent Changes page is for the Wiki what the View Unread Posts page is for the Forums. To comment or request edits to this page, please contact lhamilton. Retrieved from "https://www.pgdp.net/w/index.php?title=Main_Page&oldid=129608"'''
