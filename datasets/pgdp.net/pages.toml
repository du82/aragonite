title = "DPWiki"
full_description = '''Main Page From DPWiki Jump to navigation Jump to search Languages: English Français This wiki page contains links that may help volunteers locate the information they need to work on the Distributed Proofreaders site. The links here include both links to official DP documentation which is managed by the DP site administrators and others appointed by them (bolded) as well as links to other helpful volunteer-created and volunteer-maintained information. Note: The content on this wiki has been created by Distributed Proofreaders volunteers over sixteen years and some of the documents will not reflect accepted policy or procedures or will no longer be up-to-date. Please use this page and the DP Official Documentation to help you find content. If in doubt about a policy or procedure that you cannot find in the content listed below or in the DP Official Documentation, please query in the Distributed Proofreader forums. Finding Information Here Official DP Documentation (managed by the DP site administrators and others appointed by them) How to Search the Wiki What is a Wiki? How to use the Wiki How to Request Support Below are selected pages topics that you may find helpful. For Beginners Beginner's Guide to Navigating DP Distributed Proofreaders Walkthrough New Volunteer Frequently Asked Questions "Getting Started" Email to New Volunteers Beginners only (BEGIN) projects Proofreading Quizzes and Tutorials The Parts of a Book FAQ Central Stop Reading and Start proofing (in the first round, P1) Certification of Volunteer Work Proofreading [View List of Links] Proofreading Guidelines Jargon related to The Guidelines Proofreading Guidelines Explanation Beginning Proofreaders' FAQs How to Proofread (Section in the DP Official Documentation area) Working with the Proofing Interface Using the Character Picker Proofing Examples Proofreading Special Accents/Characters/Languages Proofing_Chinese Proofreading Tools Proofreading Roles and Access Requirements WordCheck FAQ for Proofreaders DP-feedback -- Request Proofreading or Formatting Feedback DP Sans Mono proofreading font All Wiki Pages Related to Proofreading Formatting [View List of Links] Formatting Guidelines Formatting Guidelines Explanation What is a Foofer Welcome Email to new F1s Formatting Markup Library of Formatting Examples Formatting Examples Formatting Examples Library of Formatting Examples Gallery of Table Layouts How to Use Formatting Preview F1 Self-Evaluation Project Explanations Are you ready for F2? Self-evaluation checklist Formatting Advice Formatting Roles and Access Special Types of Formatting How to Format Poetry Formatting Music Tables Gallery of Table Layouts Turn the Tables Forum Discussion All Wiki Pages Related to Formatting Smooth Reading [View List of Links] What is Smooth Reading? Smooth Reading Access Requirements Smooth Reading FAQ Post-Processing [View List of Links] What is Post-Processing? Post-Processing Access Requirements Post-Processing FAQ DP HTML Best Practices Welcome Email to new Post-Processors Post-Processing Advice Post-Processing Jargon Easy Epub PP examples on PG Regex_Cookbook CSS Cookbook Post-Processing Tools Post-Processing Workbench Post-Processing Tools Guiguts Tutorial Ppgen Manual Images and Covers PP guide to cover pages Guide to Image Processing Use of Layers Illustration Recipe-book Post-Processing in Special Situations Music Guidelines for Post-Processors Accessibility Information and Links Distinguishing between Ae and oe ligatures Guide to Smallcaps Transcribing Greek Macintosh-specific tips Post-Processing on the Mac Creating zip Archives on the Mac Getting Ready for PPV or Direct Upload Getting your PP Project Ready for PPV Tips for PPers Trying for DU Direct Upload PP reclaims that need checking before returning to PP Pool All Wiki Pages Related to Post-Processing Post-Processing Verification [View List of Links] What is Post-Processing Verification? Post-Processing Verification Access Requirements Post-Processing Verification Guidelines Post-Processing Workbench PPVtxt Tool PPVhtml Tool Content Providing and Project Management [View List of Links] Content Providing FAQ Project Managing FAQ Content Provider and Project Manager Roles Information For New and Returning CPers and PMs Content Providing Jargon Guide Useful Links for Content Providers and Project Managers Content Providing Advice Project Management Advice Content Providers seeking Project Managers Checklists Project completeness checklist Project Comments Checklist Project Categorization Difficulty level Genre Scans Illustration scans Page scans PM Mentoring P3 skip evaluation Project hospital Project Management with Linux Release queue Special Days Type-in project WordCheck FAQ for Project Managers Music Guidelines for Project Managers A personal View of PMing All Wiki Pages Related to Content Providing All Wiki Pages Related to Project Management Overview of Distributed Proofreaders [View List of Links] Distributed Proofreaders Mission Statement Distributed Proofreaders Code of Conduct Distributed Proofreaders Privacy Policy Distributed Proofreaders Roles and Access General Workflow Diagram New Volunteer Frequently Asked Questions DP Jargon Guide DP Timeline In Memoriam: Remembrance of DPers past Promoting DP [View List of Links] PGDP promotional materials Distributed Proofreaders Branding Index of pages in DP Promotion Category DP Development [View List of Links] DP Code Development Index of pages in DP Development Category About this Wiki [View List of Links] This wiki contains a mix of official DP documentation (managed by the DP site administrators and others appointed by them) and other helpful user-created and user-maintained information. You can identify official documentation several ways: by its page name (which begins "DP Official Documenation:"), by the title on the first tab at the top of the page ("dp official documentation"), and by the light yellow page header that reads "DP Official Documentation". For information on how to search for information on this wiki, please read the How to Search the Wiki article. For information on how to edit wiki pages, please read the Editing article. The Exploration Overviews can be thought of as analogous to Tables of Contents for the Wiki. Explore the Wiki on the basis of who we are and who we know. Explore the Wiki on the basis of the status of projects. (work in progress) Explore the Wiki on the basis of books (and book-like stuff we do). (work in progress) Explore the Wiki on the basis of common questions and needs. (work in progress) The Categories form a kind of Directory or Index for the Wiki. Categories allow you to find information grouped into broad subject areas, such as Content Providing, Post-processing, Project Coordination, and Uberprojects. Searching for a simple term or topic using the search box may take you to a basic definition page for that term. That definition page will likely have links to more in-depth information. The All Articles page allows you to view alphabetical lists of all pages in the Wiki. The Recent Changes page is for the Wiki what the View Unread Posts page is for the Forums. To comment or request edits to this page, please contact lhamilton. Retrieved from "https://www.pgdp.net/w/index.php?title=Main_Page&oldid=129608"'''
