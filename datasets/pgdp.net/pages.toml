["http://www.pgdp.net/wiki/Distributed_Proofreaders_Foundation"]
title = "Distributed Proofreaders Foundation - DPWiki"
full_description = '''Distributed Proofreaders Foundation From DPWiki (Redirected from Distributed Proofreaders Foundation) Jump to navigation Jump to search < Distributed Proofreaders Foundation Table of Contents Distributed Proofreaders Foundation (DPF) Contents 1 The Distributed Proofreaders Foundation 1.1 Mission Statement 1.2 Board of Trustees 1.2.1 Board Members 1.2.2 Contact Information 1.2.2.1 E-Mail 1.2.2.2 Postal Mailing Address 1.2.2.3 Corporate Registered Agent 1.3 Donations 1.4 See Also The Distributed Proofreaders Foundation The Distributed Proofreaders Foundation (DPF) is the legal entity through which the Distributed Proofreaders organization is governed. The official title of the Foundation is Distributed Proofreaders Foundation, Inc. It is a 501(c)3 tax exempt public charity. The tax id. or EIN Number is 20-4682326 and donations are tax exempt under US Law. For information on donating to the Distributed Proofreaders Foundation please see this page. Present By-Laws may be found here. Historical By-Laws may be found here. The original Certificate of Incorporation may be found here in pdf form: click here. Mission Statement DPF's mission statement as adopted by the Board in December 2019: The mission of the Distributed Proofreaders Foundation is to govern and support Distributed Proofreaders, a supportive community of volunteers, in its mission to preserve written works, primarily books, that are in the Public Domain in the United States by converting them into high-quality, freely available digital transcriptions. Board of Trustees The history and responsibility of the Board is detailed at Board of Trustees, but the current members of the Board are also presented here. Board Members The Board members at present, office (if any), year of election, and last year of current term are Walt Farrell wfarrell, President (Trustee from 2020 until 2026) Manny Ackerman, mannyack, Secretary (Trustee from 2019 until 2025). Rich Hulse, BookBuff, Treasurer (Class 4 Trustee from 2024 until 2026). Linda Cantoni LCantoni, (Trustee from 2020 until 2026) Robert Tonsing, pterodactyl, (Trustee from 2022 until 2025). Sharon Joiner, srjfoo, (Trustee from 2024 until 2027) Dan Lowe, dlowe, (Trustee from 2024 until 2027) Greg Newby, gbnewby ('external member' Trustee from 2011 to 2014; Class 4 Trustee from January 1, 2014 until December 31, 2025). Notes: Trustee terms begin at the beginning of the annual business meeting in June in the year they are elected, and end at the beginning of the annual business meeting in the year their term ends. The DP General Manager, Linda Hamilton lhamilton, is also an ex officio (non-voting) member of the DPF Board. (Term is two years, from January 1 through December 31 of the following year. She has been in the position since 2014, and the current term ends December 31, 2025.) Contact Information E-Mail If you need to contact one of the officers you can use the links above to do so via PM if you're a DP volunteer, or you may use one of the following email addresses: President: dpf-president at pgdp.net Secretary: dpf-secretary at pgdp.net Treasurer: dpf-treasurer at pgdp.net Postal Mailing Address Distributed Proofreaders Foundation 532 Marlton Pike W #507 Marlton, NJ 08053 Corporate Registered Agent (for service of process and official mail only) Registered Agents, Inc. 525 Route 73 North, STE 104 Marlton, NJ 08053 Donations The Distributed Proofreaders Foundation welcomes (and depends on) monetary donations in order to carry out our goal of supporting the Distributed Proofreaders website and enabling the volunteers at DP to continue providing books to Project Gutenberg. If you would like to assist us in supporting Distributed Proofreaders by making a donation, please see this page for information on the contribution methods that we support. See Also If you would like to see additional information on the DP Foundation wiki pages, please make your suggestions on this page: DPFoundation talk:Distributed Proofreaders Foundation. Distributed Proofreaders To comment or request edits to this page, please contact the DPF Secretary (mannyack) or another DPF Board member, or make your suggestions on this page: DPFoundation talk:Distributed Proofreaders Foundation. Retrieved from "https://www.pgdp.net/w/index.php?title=DPFoundation:Distributed_Proofreaders_Foundation&oldid=104906" Categories: Distributed Proofreaders FoundationJargonDPF Board'''
