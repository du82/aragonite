title = "DPFoundation:Main - DPWiki"
full_description = '''DPFoundation:Main From DPWiki Jump to navigation Jump to search Distributed Proofreaders Foundation (DPF) The Distributed Proofreaders Foundation (DPF) is the legal entity through which the Distributed Proofreaders website and volunteer organization is governed and supported. The official title of the Foundation is Distributed Proofreaders Foundation, Inc. It is a 501(c)3 tax exempt public charity. The tax id. or EIN Number is 20-4682326 and donations are tax exempt under US Law. The Distributed Proofreaders website relies on the hard work of all the Distributed Proofreaders volunteers, without whom it could not function. In order to carry out our goal of supporting the site and enabling those volunteers to continue providing books to Project Gutenberg, the Distributed Proofreaders Foundation welcomes (and depends on) monetary donations. General information about DPF Information for Donors (and How to Donate) Certificate of Incorporation Treasurer's Reports The State of DPF: Annual Messages from the DPF President Distributed Proofreaders Foundation History Current and Historical By-Laws of DPF DPF Policies and Procedures DPF Long-Term Objectives Board Composition and Job Descriptions DPF Board Role and responsibilities of the Board Memorandum of Understanding for DPF Trustees Trustee Job Description Board Officer Job Descriptions - (President, Secretary, and Treasurer) General Manager Job Description To comment or request edits to this page, please contact the DPF Secretary (mannyack) or another DPF Board member, or make your suggestions on this page: DPFoundation talk:Distributed Proofreaders Foundation. Retrieved from "https://www.pgdp.net/w/index.php?title=DPFoundation:Main&oldid=124430" Category: Distributed Proofreaders Foundation'''
