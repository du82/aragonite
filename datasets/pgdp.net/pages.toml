["http://www.pgdp.net/wiki/DP_Official_Documentation:General/Privacy_policy"]
title = "Privacy policy - DPWiki"
full_description = '''Privacy policy From DPWiki < DP Official Documentation:General Jump to navigation Jump to search DP Official Documentation - General This is our current Privacy Policy (updated 11 August 2020): Privacy StatementUsage of informationWhen you register, Distributed Proofreaders will send a confirmation/introduction message to your e-mail address. You may also receive optional e-mail alerts from our discussion forums and occasional notifications and feedback related to your proofreading activities. Distributed Proofreaders may also invite you by e-mail to vote in periodic Board of Trustees elections. You may also be contacted for site-related purposes by Distributed Proofreaders administrators.Access to your informationReal Name: Each book that Distributed Proofreaders produces includes a credits line to identify the people holding certain roles (Content Provider, Image Preparer, Text Preparer, Post Processor, and Project Manager) who have worked on the book. If you take on any of these roles, you can choose (in your Preferences) how or whether you prefer to be credited. Apart from this possibility, the information you enter as your Real Name in your Preferences will be accessible only to our site administrators. E-mail Address: Your e-mail address will be accessible only to Distributed Proofreaders administrators unless you make it available to other volunteers yourself, either by telling them or sending email to them from your email client.How did you hear about us: Your answer to the "How did you hear about us?" question on the registration form is for general statistical purposes and any tie to your profile will be visible only to our site administrators.During the various production phases, your User Name and your Distributed Proofreaders work may be viewable by other volunteers. In addition, administrators and volunteers delegated to an evaluation or mentoring role will be able to review the work performed under your User Name.You have the option to make your Distributed Proofreaders statistics private so that logged-in users can see them, or anonymous so that only you and Distributed Proofreaders administrators can see them. This includes information such as the number of pages you have proofread, when you were last on the site, etc., that is viewable from your member details (personal stats) page, the sidebar on the round pages, and the Statistics Central page.Your User Name and any public information you provide in your forum profile will be accessible to other Distributed Proofreaders volunteers and to unregistered guests using the forums. Your posts on our discussion forums will be viewable by other volunteers. Certain clearly-designated forums are also viewable by unregistered guests to the forums. Your User Name and any information you post on the wiki are visible to both volunteers and unregistered guests using the wiki.Tracking informationDistributed Proofreaders tracks your User Name, the date your account was created and your last login date. If you set your statistics to "anonymous", the date your account was created and your last login date will be visible only to administrators. Otherwise, they will be visible to other logged-in users.Distributed Proofreaders automatically receives and records information from your computer and browser, including your IP address. This is accessible to our site administrators and forum moderators only.The system also tracks the number of pages you have completed, your best day ever, team memberships, proofreading roles, and the highest rank you've achieved. In your Distributed Proofreaders site profile, as mentioned above, you can control whether this information is viewable by logged-in users or only by yourself and Distributed Proofreaders administrators.Sharing InformationFor the purposes of this policy, the term "Distributed Proofreaders site administrators" includes the General Manager (GM) and the members of the GM's staff with the rank of "squirrel". "Distributed Proofreaders administrators" includes site administrators and "project facilitators". The terms "site administrator" and "administrator" refer to roles associated with the Distributed Proofreaders website.The Distributed Proofreaders Foundation is a separate organization whose Trustees may happen to also be administrators of the Distributed Proofreaders website, but often are not. Should you make a formal complaint to the Distributed Proofreaders Foundation Board of Trustees pursuant to the DP Code of Conduct, it may be necessary for Board members as part of their investigation to review details concerning your work at DP and your DP communications.Distributed Proofreaders will disclose user data in response to valid, compulsory legal processes from government agencies with appropriate jurisdiction and authority.Distributed Proofreaders never makes commercial use of information entered on or for its website. It does not share volunteer information other than as indicated above. The same policy applies to information collected at this wiki. To comment or request edits to this page, please contact lhamilton or wfarrell. Return to DP Official Documentation Menu Retrieved from "https://www.pgdp.net/w/index.php?title=DP_Official_Documentation:General/Privacy_policy&oldid=110223" Categories: DP Official DocumentationDP Official Documentation - General'''
year_published = 2025
