["https://www.pgdp.net/wiki/DP_Official_Documentation:General/FAQ_Central"]
title = "FAQ Central - DPWiki"
full_description = '''FAQ Central From DPWiki < DP Official Documentation:General Jump to navigation Jump to search DP Official Documentation - General Languages: English Français Frequently Asked Questions Introductory Information Code of Conduct Also available in: Français, Deutsch, Español All volunteers must abide by our Code of Conduct. New Volunteer Frequently Asked Questions Also available in Français Introduction to the site, general overview, beginner's questions. Welcome Back, Alumni An overview of site changes from the last few years, including the distinction between proofreading and formatting. Proofreading Interface Diagram An overview flowchart which outlines the operation of the proofreading interface. DP Privacy PolicyThe current version of the Distributed Proofreaders Privacy Policy. Smooth Reading Smooth Reading FAQ Also available in: Français List of the most frequently asked questions about Smooth Reading. Creating and Managing Projects Project Managers' FAQ Also available in: Français, Português Information for new or aspiring Project Managers. Project Managers are people who manage the progress of a particular project ("book") through this site. Content Providers' FAQ Also available in: Français, Português Overview for people who want to contribute material to be proofread on this site. Scanning FAQ Basic information on scanners and how to use them, based on our experiences. Suggestions, Bugs, and Development Translation FAQ Information on how site translations work, including how to install and edit them. Task Center Here you will find a list of feature requests and bugs. You may add tasks after searching to see that the issue isn't already there. Development Process Information and guidelines for developers. Project Gutenberg Project Gutenberg Help The massive FAQ from Project Gutenberg. For a list of more general Help topics, see the Help, How-To, Procedures, Guidance and Information page. If you find errors in a ebook at Project Gutenberg, check their Contact Information page for the email for the Errata team. DP is closely affiliated with Project Gutenberg (PG) but we cannot make changes to texts once they have been published on PG's website. To report errors in a PG text, please contact PG's Errata team. Proofreading Proofreading Guidelines Also available in: Français, Português, Español, Nederlands, Deutsch, Italiano The details of the guidelines we use for proofreading documents. Proofreading Summary Also available in: Français Printable (.pdf) two-page summary of the most commonly needed proofreading standards from the Proofreading Guidelines, done as a big example! Beginning Proofreaders' FAQs Also available in: FrançaisTo provide answers to common questions asked by proofreaders when they join Distributed Proofreaders. Proofreading Quizzes & Tutorials Try the proofreading quizzes and tutorials. They are a great walk through the basic Guidelines for beginners and an excellent refresher for old hands. Standard Proofreading Interface Help Help for the Standard Proofreading Interface. Enhanced Proofreading Interface Help Help for the Enhanced Proofreading Interface. Other official Proofreading Documentation Other Proofreading Material Formatting Formatting Guidelines Also available in: Français, Português, Nederlands, Deutsch, Italiano, Spanish The full details of the guidelines we use for formatting documents. Formatting Summary Printable (.pdf) two-page summary of the most commonly needed formatting standards from the Formatting Guidelines, done as a big example! Formatting Quiz Try the formatting quiz. It is a great walk through the basic Guidelines for beginners and an excellent refresher for old hands. Other Official Formatting Documentation Other Formatting Resource Material Post-Processing and Verification Post-Processing FAQ Also available in: Français Information for new and aspiring Post-Processors. Post-Processors process a particular project after it has been proofread and formatted on this site (combining all the pages, making them consistent, fixing problems, and submitting it to Project Gutenberg). Post-Processing Verification Guidelines Information for Post-Processing Verifiers. Other Official Post-Processing Documentation Other Post-Processing Material DP Tools DP Custom Proofreading Font Sample and download the custom DP font. WordCheck FAQ Also available in: Français Information on the WordCheck engine and interface. Contact Us General Queries For general queries, contact dphelp. Proofreading and Formatting Feedback (DP-Feedback) For feedback on proofreading and formatting, contact dp-feedback. Help with Project Formatting Instructions For help creating formatting instructions contact dp-format Report Bugs or Request Features The Task Center is the place to report bugs or request features. Report or ask for help regarding a Project Report problems with a project. To comment or request edits to this page, please contact lhamilton or wfarrell. Return to DP Official Documentation Menu Retrieved from "https://www.pgdp.net/w/index.php?title=DP_Official_Documentation:General/FAQ_Central&oldid=116292" Categories: DP Official DocumentationDP Official Documentation - General'''
