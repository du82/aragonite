full_description = '''Main Page From DPWiki Jump to navigation Jump to search Languages: English Français This wiki page contains links that may help volunteers locate the information they need to work on the Distributed Proofreaders site. The links here include both links to official DP documentation which is managed by the DP site administrators and others appointed by them (bolded) as well as links to other helpful volunteer-created and volunteer-maintained information. Note: The content on this wiki has been created by Distributed Proofreaders volunteers over sixteen years and some of the documents will not reflect accepted policy or procedures or will no longer be up-to-date. Please use this page and the DP Official Documentation to help you find content. If in doubt about a policy or procedure that you cannot find in the content listed below or in the DP Official Documentation, please query in the Distributed Proofreader forums. Finding Information Here Official DP Documentation (managed by the DP site administrators and others appointed by them) How to Search the Wiki What is a Wiki? How to use the Wiki How to Request Support Below are selected pages topics that you may find helpful. For Beginners Beginner's Guide to Navigating DP Distributed Proofreaders Walkthrough New Volunteer Frequently Asked Questions "Getting Started" Email to New Volunteers Beginners only (BEGIN) projects Proofreading Quizzes and Tutorials The Parts of a Book FAQ Central Stop Reading and Start proofing (in the first round, P1) Certification of Volunteer Work Proofreading [View List of Links] Proofreading Guidelines Jargon related to The Guidelines Proofreading Guidelines Explanation Beginning Proofreaders' FAQs How to Proofread (Section in the DP Official Documentation area) Working with the Proofing Interface Using the Character Picker Proofing Examples Proofreading Special Accents/Characters/Languages Proofing_Chinese Proofreading Tools Proofreading Roles and Access Requirements Wor