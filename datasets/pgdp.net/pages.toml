title = "DP: Privacy Statement"
full_description = 'When you register, Distributed Proofreaders will send a confirmation/introduction message to your e-mail address. You may also receive optional e-mail alerts from our discussion forums and occasional notifications and feedback related to your proofreading activities. Distributed Proofreaders may also invite you by e-mail to vote in periodic Board of Trustees elections. You may also be contacted for site-related purposes by Distributed Proofreaders administrators. Real Name: Each book that Distributed Proofreaders produces includes a credits line to identify the people holding certain roles (Content Provider, Image Preparer, Text Preparer, Post Processor, and Project Manager) who have worked on the book. If you take on any of these roles, you can choose (in your Preferences) how or whether you prefer to be credited. Apart from this possibility, the information you enter as your Real Name in your Preferences will be accessible only to our site administrators. E-mail Address: Your e-mail address will be accessible only to Distributed Proofreaders administrators unless you make it available to other volunteers yourself, either by telling them or sending email to them from your email client. How did you hear about us: Your answer to the "How did you hear about us?" question on the registration form is for general statistical purposes and any tie to your profile will be visible only to our site administrators. During the various production phases, your User Name and your Distributed Proofreaders work may be viewable by other volunteers. In addition, administrators and volunteers delegated to an evaluation or mentoring role will be able to review the work performed under your User Name. You have the option to make your Distributed Proofreaders statistics private so that logged-in users can see them, or anonymous so that only you and Distributed Proofreaders administrators can see them. This includes information such as the number of pages you have proofread, when you were last on the site, etc., that is viewable from your member details (personal stats) page, the sidebar on the round pages, and the Statistics Central page.'
