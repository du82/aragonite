["http://www.pgdp.net/wiki/DPWiki:Editing"]
title = "DPWiki:Editing - DPWiki"
full_description = "DPWiki:Editing From DPWiki Jump to navigation Jump to search You can edit nearly every page on the DP wiki, including this one! Contents 1 Starting to edit 2 Accessing a more comprehensive editing manual 3 Formatting and organizing text 3.1 Bold and italic text 3.2 Sections and their headings 3.2.1 Tables of Contents 3.3 Lists 4 Creating links 4.1 External links 4.1.1 Linking to PG etexts 4.2 Internal Wiki links 4.3 Special links to DP content 5 Transcluding information 6 Creating a page 6.1 Creating a sub-page 6.2 Creating an Author or AuthorsNotes-PGRule6 page 7 Deleting a page 8 Asking for and receiving Help! 8.1 Questions and Answers 8.1.1 Redirecting to a section of an article 8.1.2 What the heck is this \"talk\" stuff? 8.1.3 How do I reply to someone else's comment on a talk page? 8.1.4 How do I link to (and from?) the DP forums 8.1.5 How do I find or go to different namespaces? What are namespaces? 8.1.6 What do the various link colours and icons mean? 8.1.7 What do the links at the top right, like \"my talk\", do? 8.1.8 What is a \"minor edit\"? When should I tick that box? 8.1.9 Can pages be renamed? 8.1.10 How bold can one be? How get consensus? 8.2 Other useful (maybe necessary) stuff to add to this page 9 See also... Starting to edit Before you edit an article, you might like to practice these techniques in the Sandbox. In the grey bar at the top of the screen, click the Edit button. You'll then see the \"source\" of the page presented to you in an editable text-box, just like the proofreading interface. If it's a long page and you only want to edit a small bit of it, you can also click on the word Edit at the right of that section. Text you type will appear mostly as-is when you save the page, with paragraph breaks wherever you've left a blank line. You will need to login to make a change in the wiki; your regular proofing ID and password can - and should - be used for that. Note: if your regular proofing ID has an underscore \"_\" in it, send an email to db-req at pgdp dot net. Before you click on the Save Page button, you can Show Preview to make sure the page looks like you'd like. Also, before you save the page, please enter in a brief summary of what you changed! Accessing a more comprehensive editing manual For the most comprehensive information on all the innumerable ways you can edit text in a MediaWiki like this one, check out the WikiMedia editing page (this link will take you off the DP site. You may want to open the link in a new window, or a new browser tab). Bear in mind that some of the things described at the MediaWiki site are not enabled here, and some of the things we have here are not available there. We are already customizing our wiki to fit our needs, and that includes the editing syntax! Formatting and organizing text Bold and italic text To make text bold or italic, you can use the buttons on the toolbar above the text-box, which will insert some single quotes around the text that you've selected. Surrounding text with ''two single quotes'' makes italic text, while '''three quotes''' make bold text ('''''five''''' make bold italics!). Sections and their headings To divide a page into sections, you can use subheadings like this page does. Surround a word with equals signs (=) to make a heading. The greater the number of equals signs, the smaller the heading. E.g. this heading is produced by ===Sections and their headings===. In general, you should use Level 2 headings ==Like This== for main structural categories, and more equals signs for smaller subdivisions of those pieces. (The number of equals signs present is equivalent to the number in a HTML heading. E.g., ==This== is <h2>This</h2> and ===This=== is <h3>This</h3>.) If there are four or more headings on a page, and unless the TOC handling is specified explicitly, a Table of Contents will automagically appear on the page before the first heading. Tables of Contents A full description of how TOCs are handled can be found here (this link will take you off the DP site. You may want to open the link in a new window, or a new browser tab), but here's a summary. Put __NOTOC__ at the top of the page to stop a default-type TOC being added Put __FORCETOC__ at the top of the page to force a TOC just before the first section heading, even if there are fewer than four headings on the page Put __TOC__ in the page to force a TOC at that position, even if there are fewer than four headings on the page We also have some special templates, which can be used instead of any of these. {{TOC Compact A-Z}} will give you a one-line TOC for subsections named A, B, C, ... Z {{TOC Compact Month28}} will give you a TOC for subsections named 1st, 2nd, ... 28th {{TOC Compact Month29}} will give you a TOC for subsections named 1st, 2nd, ... 29th {{TOC Compact Month30}} will give you a TOC for subsections named 1st, 2nd, ... 30th {{TOC Compact Month31}} will give you a TOC for subsections named 1st, 2nd, ... 31st These are useful because the standard TOC has one line per entry, which is somewhat unwieldy in these cases. Lists An unordered list (bullets) is made with asterisks: * Spoon * Spork * Brainz becomes Spoon Spork Brainz An ordered list is made with hashes (or number signs): # Scoop out brainz with spoon # Bake 'til golden-brown # Enjoy your zombie-feast becomes Scoop out brainz with spoon Bake 'til golden-brown Enjoy your zombie-feast You can nest lists: * unordered 1 *# ordered 1a *# ordered 2a * unordered 2 *# ordered 1b *#* unordered again! *# ordered 2b becomes unordered 1 ordered 1a ordered 2a unordered 2 ordered 1b unordered again! ordered 2b Definition lists are a little more complex, involving semi-colons and colons: ;spork: a spoon with tines on the end like a fork. becomes spork a spoon with tines on the end like a fork. [edit this page to understand how this works] Hint: Don't leave blank lines separating items in ordered lists! The blank line signifies a new block: a new paragraph, or a new list. When you leave a blank, you're saying, \"This is new; start numbering over!\" Creating links External links A single set of [square brackets] is used to make a link to a resource outside DP Wiki. Inside the brackets, put the URL of the destination, a space, and the text you want the link to display as, e.g. [http://www.pgdp.net DP] would become DP. Linking to PG etexts To link to an etext at Project Gutenberg, use this shortcut: [[etext:12345]], which becomes etext:12345. To make it prettier, you can use the | character and add the title like this: [[etext:12345|My Book!]], which becomes My Book!. You can also use <pg_formats etext=\"12345\">My Book!, by Author</pg_formats>, which becomes \"My Book!, by Author -- [EPUB; HTML; Mobipocket; RDF; Text; Text (us-ascii)]\". Note that the link surrounds only the text before the first comma. To get only the formats, use a self-closed tag: <pg_formats etext=\"12345\" /> gives \"[EPUB; HTML; Mobipocket; RDF; Text; Text (us-ascii)]\". Internal Wiki links Two pairs of [[square brackets]] make a link to another page in this wiki. So, [[Main Page]] creates a link to the DP Wiki Main Page. To make a link to a particular section on a wiki page, follow the page name with a '#' and the exact section name. For example, [[Main Page#Useful Special Wiki Pages]] would create the link Main Page#Useful Special Wiki Pages. Since that link appears in a somewhat less than attractive manner, you will likely want to specify that the link display with alternative text. To change the link text of an internal link, insert a pipe, '|' (the pipe may appear as a one- or two-piece vertical line on your keyboard), and the desired text after the internal link address. For example, [[Main Page#Useful Special Wiki Pages|Handy Special Wiki Pages]] would make the link appear as Handy Special Wiki Pages. If you are linking to a section or subsection on the same page, you may omit the main page name, thus: [[#Internal links|Internal links]] would produce Internal links. Special links to DP content Because it will be quite common that someone would want to link to something that is outside the DP Wiki but still within the larger DP information system, scripting shortcuts have been developed to allow the use of special internal (instead of external) links to many of those types of items. You can find instructions and examples for these types of links at Linking to DP content housed outside DP Wiki. Some examples here: To make an easy link to Private Message a DPer, use this format: [[pm:useridnumber|username]]. For example, logista's useridnumber is 23148, so a link to PM her is [[pm:23148|logista]], which looks like logista To find your useridnumber (for our Wiki and our Forums) you can look for the \"pm\" button in your Stats page on the DP site. That button is a link, and part of the link will be &u=nnnnnnn where the nnnnnnn is your number. Or, within the forums, you can use the \"Members\" link (somewhere on the page, depending on the forum style you use), then click \"find a member\", put in your username, and put your mouse over either \"pm\" button or your username in the resulting list, and note the \"u=nnnnnn\" value as above. To make an easy link to the Project Search form, use this format: [[dp:any_foldername_within_c_root/filename|desired link label]]. For example, [[dp:tools/search.php|Search for Project]], will produce Search for Projects page. Some local extensions have been defined which can be used to display information about projects. Transcluding information Transclusion is a method of building documents by using a call to pull information into the current document from some other document or template. This technique promotes efficiency and consistency since the information in question will not be entered (and need to be updated) separately in multiple places. To see an example of transclusion used in DP Wiki, view the Edit window of any of the Jargon Guides or the LaTeX article. For more details on transclusion in general, see Wikipedia's transclusion entry. To see a detailed, and fully explained, illustration of transclusion, see Help:Jargon. While this example relates to the transclusion of jargon templates and definitions here in DP Wiki, the same process can be applied to any concept and set of Wiki pages. Creating a page Suppose you'd like to add some content, but none of the existing pages seems a good fit. The best way to create a page is first create a link to it on a pre-existing page (as discussed above), and then follow the link. You will be taken to the edit screen (or, to another page with the same name, if one existed already). Another trick for creating pages is to type the URL for the new page in your browser's URL address box, e.g., http://www.pgdp.net/wiki/New_Page and click the 'edit this page' link. Creating a sub-page Some topics lend themselves to a natural structure, like the Periodicals or the Series By Multiple Authors. In order to make this structure happen automatically, start the new subpage link (from the topic page) with a /. So, if the main page is Series By Multiple Authors, by creating a link to, say, English Men of Letters as [[/English Men of Letters]], the English Men of Letters page has an automatic link to the Series By Multiple Authors page. Sometimes these are called breadcrumbs so you can find your way home again. To avoid confusing us all about stray slashes, make the link pretty. This you do by adding a bit more information, like this: [[/English Men of Letters|English Men of Letters]]. This formatting, while I don't do it here, can make links to long-titled pages a little more appropriate to the page you're on. It could have been something like [[/English Men of Letters|That Series by John Morley, Viscount]], but would have still had the true title. Creating an Author or AuthorsNotes-PGRule6 page Lets say that you have an interest in an Author and want to see about putting some information together here in the Wiki. The most likely reason is to keep track of some works that are (or are not) in the Public Domain, or to collect notes to see about clearing some of that Authors works into the PD through the use of Rule 6 (Non Renewal). Steps to create a Rule 6 Notes Page for an Author: Search on the Wiki for the last name of the author. If the search doesn't find one... now it's time to create a page. Now we are going to search again... this is the easiest way I have seen so far to create a page. Seach for PGRule6/FirstnameLastnameNotes (Because it doesn't exist, the Wiki won't find it, but it will give you a link to create it.) Create the page and add some text Example text:\"This is the Notes Page for Clearing works by Authorfirstname Authorlastname\" Now we want this page to show up in three places... and two of those are easy and automatic. We want our page to be linked from the PGRule6 Category page. In order to make that happen, at the bottom of our page we are editing we add the following text [[Category:PGRule6|Lastname, Firstname]] We also want our page to be linked from the Authors Category page. So we will also add this text on the next line at the bottom of the text. [[Category:Authors|Lastname, Firstname]] Lastly we want our page to be listed on the primary PGRule6 Page. To do this last step we will save the page (You can come back and edit the sample text later). Now that the page is saved... look up near the top. Because we created it with the PGRule6/ part at the beginning, there is already a link up to the PGRule6 page. Click that link that says 'PGRule6' and we are now on a nice alphabetical page of authors last names. Scroll down to the L's (or what ever is appropriate for the author Lastname). Click the 'edit' link on the right hand side, and now add your page in the form * [[/FirstnameLastnameNotes|Lastname, Firstname]] (Be sure to put it in in the correct place alphbetically) That's it. You're done. Go back to the page you created and put any notes you want to appropriate to clearing that authors work. Who knows you might come back in a month (or a year) and find someone else has added to the page and is working towards getting a clearance ready for PG. Deleting a page See: DPWiki:Deleting and Merging. Asking for and receiving Help! If you get stuck, edit this page and leave a question below. You can sign any text you insert by typing 4 tildes (~~~~), which will be replaced with your username and a timestamp when you save the page. Questions and Answers Redirecting to a section of an article I've just tried to set up a redirect page Accesskey which I wanted to go directly to the Navigation section of Accessible HTML eBooks. Instead it goes to the top of the page. Is there something wrong? -- camomiletea 22:20, 16 October 2009 (PDT) Not long ago someone asked me the same question in a PM. My reply was: I read up a little on this and it looks like the MediaWiki code wasn't able to handle redirects to sections until December 2006. DP's wiki was started in late 2005 and installed in May 2"
