full_description = "This is an exploration of some problems of nonexistence, with special attention paid to Nathan Salmón’s account of merely possible and impossible objects (or entities or things). According to this account, we can refer to such objects and attribute properties to them. The terms ‘possible’ and ‘impossible’ should be understood in the familiar metaphysical sense, so that a merely possible object is one that does not exist at the actual world but exists at some metaphysically possible world (it could exist (...) even though it does not) and an impossible object is one that does not exist at any metaphysically possible world (it could not exist at all). Other nonexistents, such as objects that once existed at the actual world but no longer do, will also be discussed, but mainly by way of comparison to merely possible and impossible objects. Salmón subscribes to both the direct reference theory of names and the Millian theory of names. Section I is a preliminary discussion of these theories, contrasting them with the formerly orthodox views of Frege and Russell. Section II presents Salmón’s account of merely possible and impossible objects. Sections III and IV are an evaluation and defense of a modified version of the account. Among other things, it is argued that Salmón’s account does not slip into any problematic form of Meinongianism. However, section V questions why Salmón’s account of impossible objects would not extend to Meinong’s notorious round square. (shrink) Aristotle's Organon in Old and New Logic 1800–1950 explores the reception and interpretation of Aristotle's logic over the last two centuries. The volume covers seminal works during this period by logicians, historians of logic, and historians of philosophy, including John Lloyd Akrill, Francesco Barone, Günther Patzig, Enrico Berti, and Mario Mignucci. Contributors consider the reception of the Organon in old logic and chart the appearance of formal approaches to logic beginning with Boole. This in-depth study of Aristotelianism also covers logic (...) in Kant and Hegel, alongside the problems and projects of interpreting Aristotle in the new logic after Boole and Frege. The background of modern debates concerning induction and abduction provides further insight into Aristotelian logic during the period. By filling gaps in our understanding of Aristotelian logic, this book provides a fundamental missing link in 21st century studies of the history of Aristotelianism. It brings together scholars of both ancient and modern logic to understand the interpretation of ancient logic before and after the development of the modern, algebraic approach to logic. (shrink)"
