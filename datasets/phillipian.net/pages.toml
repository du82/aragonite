["https://phillipian.net/2025/01/24/julie-myers-ceo-of-onelove-foundation-emphasizes-relationship-behavioral-awareness-at-upperclassmen-ebi"]
title = "Julie Myers, CEO of OneLove Foundation, Emphasizes Relationship Behavioral Awareness at Upperclassmen EBI – The Phillipian"
description = "Founded in response to the tragic murder of Yeardley Love, a University of Virginia lacrosse player, by her ex-boyfriend, the OneLove Foundation’s mission is to educate students about the importance and key components of healthy relationships. Julie Myers, CEO of OneLove Foundation, delivered a speech on the signs of healthy and unhealthy relationships last Friday during upperclassmen’s winter Empathy, Balance, and Inclusion (EBI). During her talk, Myers, Love’s former coach, stressed the need for ongoing communication about relationships to help..."
full_description = "As part of her presentation, Julie Myers displayed the ten signs of both healthy and unhealthy relationships. Founded in response to the tragic murder of Yeardley Love, a University of Virginia lacrosse player, by her ex-boyfriend, the OneLove Foundation’s mission is to educate students about the importance and key components of healthy relationships. Julie Myers, CEO of OneLove Foundation, delivered a speech on the signs of healthy and unhealthy relationships last Friday during upperclassmen’s winter Empathy, Balance, and Inclusion (EBI). During her talk, Myers, Love’s former coach, stressed the need for ongoing communication about relationships to help everyone work toward building healthier and safer connections. The presentation focused on the importance of recognizing signs of unsafe behaviors. “Be accountable. It’s probably the biggest thing. If you are doing something in a relationship, friendship, intimate partner, teammate, wherever, if you are bringing negative behavior or unhealthy behavior, make sure that you own it. Don’t give them an excuse, don’t blame it on a game, don’t blame it on not getting sleep. Please don’t give bad behaviors an excuse because then you will never stop those bad behaviors,” said Myers during her presentation. Myers continued, “Everyone in this room is competitive at a pretty significant level, but just remember compete in a classroom, compete on a field, in a pool where you are, compete with your instrument, but relationships are not competitive. There should not be a dominant in the relationship. Not in a friendship, not in an intimate partner… Nobody should think they’re better, stronger, more important.” During her talk, Myers used videos to show examples of relationship abuse and provided a list of ten characteristics of healthy versus unhealthy relationships, pointing out how physical abuse is not the only way a relationship can be harmful. Sam Clare ’25 noted that the talk, though not particularly novel, served as a reminder that unhealthy relationships can take on many forms."
author = "Niki Tavakoli, Azul Cabrera"
