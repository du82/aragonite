["https://phillipian.net/2024/04/26/boys-crew-pushes-past-st-johns-prep-and-bc-high"]
title = "Boys Crew Pushes Past St. John’s Prep and BC High – The Phillipian"
description = "Following a week of record-breaking achievements, Boys Crew maintained its strong form this Saturday, beating St. John’s Prep and Boston College (BC) High. According to Spencer Salhanick ’24, B1 went into the race with a mindset of just testing its limits and competing against itself. Although strong currents presented a challenge that resulted in a slower time compared to last week, Salhanick thought the team still executed well, keeping errors to a minimum. Salhanick said, “I think we rode pretty..."
full_description = "Following a week of record-breaking achievements, Boys Crew maintained its strong form this Saturday, beating St. John’s Prep and Boston College (BC) High. According to Spencer Salhanick ’24, B1 went into the race with a mindset of just testing its limits and competing against itself. Although strong currents presented a challenge that resulted in a slower time compared to last week, Salhanick thought the team still executed well, keeping errors to a minimum. Salhanick said, “I think we rode pretty well, I think everyone was connected and in sync and getting all the timing done well, catch placement and connecting throughout the entirety of the stroke, but it was interesting because we came into this race knowing that a lot of this race was us against ourselves. We wanted to prove to ourselves that we could pull a really good race throughout completely… I think we were probably better this week.” Chris Savino ’24 highlighted B1’s record-setting performance from the previous week and mentioned that the crew aimed to surpass that achievement. They focused on maintaining speed, refining technical skills, and finishing strongly. “So we were coming off of a very successful week against Kent, and Kent is a very competitive crew, so we knew that we had the capacity to keep doing very well. I think this week we mainly just worked on kind of maintaining that speed and also fixing technical things and also improving our sprint at the end, so being able to go faster at the end of the race,” said Savino. Jonas Giannoni ’25 pointed out that due to Andover Crew’s impressive strength this year, B3 was not only competing against other B3 boats but also aiming to match up with B2 and B1. Giannoni appreciated the ambitious energy from B3. Giannoni said, “I would say the fact that, in our boat specifically, we really strived to compete with the second and the first boat, so our competitors were not only the people we were rowing against on Saturday, but it was also the second boat, so we were also like, ‘Okay guys, we got this. We need to lock in. Even if we are ahead on any other boats, we need to remember that we are competing, and we are trying to do the best that we can. So if we are ahead, we want to get more ahead, and if we are behind, we are going to get ahead.’ That was a good mentality.”"
