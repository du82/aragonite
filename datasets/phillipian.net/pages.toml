["https://phillipian.net/2024/04/25/customer-appreciation-at-paresky-commons-sausage-sub-and-ice-cream-sandwich-popup"]
title = "Customer Appreciation at Paresky Commons: Sausage Sub and Ice Cream Sandwich Popup – The Phillipian"
description = "Three tables of ice cream sandwiches and sausage subs set out by Paresky Commons were the latest of several special meal events Paresky has hosted this year. Students crowded in front of Paresky, reaching to grab a bite on their way to their next class. Karen VanAvery, Director of Food Service, described the event as a “customer appreciation event,” held annually by Paresky Commons. She stated that the event doubled as a way to show gratitude and collect feedback. “We..."
full_description = "Three tables of ice cream sandwiches and sausage subs set out by Paresky Commons were the latest of several special meal events Paresky has hosted this year. Students crowded in front of Paresky, reaching to grab a bite on their way to their next class. Karen VanAvery, Director of Food Service, described the event as a “customer appreciation event,” held annually by Paresky Commons. She stated that the event doubled as a way to show gratitude and collect feedback. “We do this because we genuinely value the relationships we have with the community at Phillips Academy. It’s our way of saying thank you for their trust and loyalty. Plus, it’s a great opportunity to connect face-to-face, gather feedback, and show everyone how much we care about their satisfaction,” wrote VanAvery in an email to The Phillipian. Mercy Okoronkwo ’27 highlighted how she enjoyed the event as it coincided with warmer weather. She mentioned how the delicious food paired with music brought people outside to socialize and spend time with their peers. “It was a good event, it was convenient because it was hot outside. I think it was enjoyable with the music and food, it really brought people outside together, and it was nice being out there and being able to talk to my friends… More music and ice cream on really hot days [would be good],” said Okoronkwo. According to Sophie Liang ’26, the event was a great way to temporarily shift from the typical routine of eating inside, but Liang noted that the majority of the food was gone by the start of sixth period lunch. She suggested that the selection for Paresky Commons meals could have included more engagement from the students. “It was a nice change from just eating inside [Paresky] Commons… Especially in Spring Term, everyone’s looking for reasons to be outside on days with nice weather… [Also,] I think this happens with all [Paresky] Commons meals, but by the time sixth lunch comes around, there’s just less food, and especially since lunch was hosted outside, I know people would walk by in free periods and take some food. By the time it got to sixth lunch, which is my lunch, some of the stuff was out… I know we’ve had a lot of Cluster dinners where the Cluster council gets to decide what food is served at Paresky Commons, it would be cool if there was some more community input in what [Paresky] Commons serves as well,” said Liang."
author = "Aden Hwang, Jenna Liang"
