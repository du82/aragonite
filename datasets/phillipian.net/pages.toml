["https://phillipian.net/2025/02/28/stomping-in-style-what-winter-boots-are-andover-students-wearing"]
title = "Stomping in Style: What Winter Boots are Andover Students Wearing? – The Phillipian"
description = "From trudging through slush to shuffling across icy paths, winter boots can be both a practical necessity and a stylish statement. The Phillipian interviewed Andover students about the footwear they are wearing throughout the winter season and how they demonstrate both purpose and flair.  Kaya Hurteau ’27 “[My boots] are pretty and they have lots of pink fluff on them. They [also] have these little shoe laces that just tie around them. My boots are also waterproof, so they’re actually..."
full_description = "From trudging through slush to shuffling across icy paths, winter boots can be both a practical necessity and a stylish statement. The Phillipian interviewed Andover students about the footwear they are wearing throughout the winter season and how they demonstrate both purpose and flair. “[My boots] are pretty and they have lots of pink fluff on them. They [also] have these little shoe laces that just tie around them. My boots are also waterproof, so they’re actually very convenient for the weather. With these I have to try to wear tighter pants or pants that aren’t flared at the bottom because otherwise my pants would get really nasty. I try to match colors [such as] wearing a pink shirt, that’ll [compliment] the pink boots. People have been joking with me about them [though], because they think they’re funny looking. It’s funny because I have this one pair of fluffy pink earmuffs that kind of match the boots so everyone’s [says], ‘Wow, it matches perfectly.’” “My boots are thick and kind of look like astronaut boots, like something you’d find on a spaceship. Personally I don’t like wearing ugly winter boots, but I find these acceptable. That’s why they’re significant to me, because they’re something that I can wear while still looking good and being warm, and not have my feet get wet. These boots say a lot about my boldness. I’m a very bold person and these boots are a big statement to any outfit, so it says a lot about my personality before I even open my mouth.” “My boots are black and leather and they go up mid-shin. My mom gave them to me, actually they’re hers, but that’s why they’re so significant. I [first] saw these boots on my mom and I was like, ‘Oh those look cute, can I have them,’ and she said yes. My inspiration for styling them mainly just comes from the stuff I have in my closet and sometimes what I see on social media. I’ll wear the boots instead of sneakers, especially during the winter. A lot of the time I’m rushing to class in the morning and I don’t want to slip on all the ice, and the boots have a lot more traction than sneakers or slippers do.”"
