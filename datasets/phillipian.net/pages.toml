title = "West Quad North가 겨울왕국 테마 이벤트로 클러스터 식사 시리즈를 시작 – The Phillipian"
description = "일련의 클러스터 식사의 일환으로 West Quad North (WQN)는 Paresky Commons에서 겨울왕국 테마의 특별한 저녁 식사를 준비했습니다. 1월 25일에 열린 이 모임에서는 영화를 기념하는 메뉴와 Lower Right에 설치된 겨울왕국 노래방이 제공되었습니다.  West Quad North의 학장인 Kit Leckerling은 코로나 팬데믹 이전의 소중한 전통을 되살린 클러스터 식사에 대해 자세히 설명했습니다. 저녁 식사 자체와 Paresky Commons 직원들에 대한 감사의 표시로 이 저녁의 중요성을 언급했습니다. “클러스터 디너는 학장팀이 팬데믹으로 인해 중단된 후 다시 재개하게 되어 매우 기쁘게 생각하는 전통입니다…” 학생 및 주거생활 부학장 Murata는 Commons..."
full_description = "일련의 클러스터 식사의 일환으로 West Quad North (WQN)는 Paresky Commons에서 겨울왕국 테마의 특별한 저녁 식사를 준비했습니다. 1월 25일에 열린 이 모임에서는 영화를 기념하는 메뉴와 Lower Right에 설치된 겨울왕국 노래방이 제공되었습니다. West Quad North의 학장인 Kit Leckerling은 코로나 팬데믹 이전의 소중한 전통을 되살린 클러스터 식사에 대해 자세히 설명했습니다. 저녁 식사 자체와 Paresky Commons 직원들에 대한 감사의 표시로 이 저녁의 중요성을 언급했습니다. “클러스터 디너는 학장팀이 팬데믹으로 인해 중단된 후 다시 재개하게 되어 매우 기쁘게 생각하는 전통입니다…” 학생 및 주거생활 부학장 Murata는 Commons 팀과 날짜를 정하고 Pine Knoll의 학장이었을 때 계획했던 클러스터 저녁의 사례를 공유하면서 이 프로젝트를 주도해 왔습니다. “저는 우리 클러스터 저녁 만찬을 통해 다른 클러스터가 어떤 저녁 만찬을 계획하는지 모두가 기대하게 되고 사람들이 이 저녁 만찬에 참석해 행사를 위해 노력해준 Commons 팀에 감사를 표할 수 있기를 바랍니다”라고 Leckerling이 말했습니다. WQN 클러스터 대표 Louis Leone ‘24는 코로나19 팬데믹이 과거 클러스터 디너에 미친 영향에 대해 설명했습니다. 몇 년 만에 처음으로 만찬 행사를 주최한 클러스터로서 공동 회장단은 물류 문제부터 학교 전체의 질병으로 인한 건강 문제까지 계획 전반에 걸쳐 수많은 도전이 있었습니다. “어둠 속에서 불빛을 비추는 기분이었지만 클러스터 학장님들이 많이 지지해 주시고 계획을 세우는 데 많은 도움을 줬습니다. 모든 것을 계획했지만 마지막 순간에 일이 틀어지는 경우가 있습니다. 수업이 취소되고 모두 집에 가라고 권유받았을 때 그런 일이 벌어졌습니다. 많은 사람들을 위해 큰 행사를 계획했는데 학교의 절반도 안 되는 사람들이 모였습니다”라고 Leone은 말했습니다."
