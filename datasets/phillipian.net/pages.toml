title = "安多福（Andover）宣布工作小组将制定 2025-2026 学年的全校手机政策 – The Phillipian"
description = "安多福拟开展从明年开始对校园内部手机使用进行监管的计划，此消息由学生事务办公室的院长在10月3日发送给全校学生的邮件中透露。为推动这一转变，学校将成立一个由学生和教职员工组成的工作小组，制定全面的手机政策。 学生事务及住宿生活主任 Susan Esty 和助理主任 David Gardner，在邮件中概述了工作小组的运作。根据公告，工作小组将评估安多福目前的手机政策，并与其他学校的政策进行比较，讨论现有研究，并在2025年夏季前完成并实施新政策。 “【这个工作小组】将在塑造安多福未来的手机使用方面发挥关键作用，并支持我们整个团体（Big Blue community）的成长、健康、学习与快乐，” Esty和Gardner在全校邮件中写道。 现在安多福还没有完整的学校的手机政策，但是许多其他的学校已实施减少学生在校期间的屏幕使用的系统性政策。Deerfield Academy 于2022年实施了一项政策，要求学生在工作日的早上8点到下午3点之间将手机留在宿舍。同样，Hotchkiss 在2023年秋季开始了禁止手机在课堂、餐厅和社区活动中的使用。 一些教师会在课堂上实施自己的规定，以减少干扰并提高学习效率。历史教学助理 M.C. Post 分享了手机如何干扰注意力，特别是在讨论型课程中。他们目前在课堂上实施了一个系统，要求学生在课堂开始时将手机放在门口。 “我离学生的年龄相对接近，因为我几乎是在两年前刚大学毕业，我知道手机在学生时期是多么令人分心。我知道学生并不想被干扰，但当手机就在身边时，【学生】很容易就会去使用它，尤其是在讨论型课程中。当手机不占用人们的注意力时，教育质量会提升。我认为在早上9点到下午5点之间完全不让学生使用手机，可以让他们更专注，”Post说。 作为工作小组的成员，学生将在新政策的制定中发挥积极作用。历史和经济学讲师 Aly Blakeney 强调了学生对于新政策制定的重要性，以及她希望工作小组在运作时能够继续保持这个价值观。 “有学生的声音非常重要，因为我们不是Z时代（Generation Z）的成员。校园成年人本质上不属于Z世代。【学生】这个群体是最清楚技术在哪方面对他们的帮助和阻碍。这绝不应该是自上而下的决定。我认为管理层并没有采取这种方式，他们在鼓励一种自下而上的全面评估，但我们确实需要在委员会中获得多样化的声音，包括学生和成年人，” Blakeney说。 向学生发出的申请简要询问了他们希望加入工作小组的原因。Jasjit Hargun ‘27 谈到他选择申请的原因以及他对工作小组的个人目标。 “促使我加入的原因是关于对手机使用实施严格限制的讨论，【从早上8点到下午5点禁止使用手机】，我认为这不是正确的做法。手机工作小组的宣传是面向那些希望限制手机使用的人，我认为如果只有这些人参与，那就不会产生一个良好的解决方案，也不会反映出学生群体的需求，” Hargun说。 Hargun继续说：“我希望能起到调节作用，不让他们【学生】在手机政策上走得过于极端，但我并不是说要完全停止所有限制，确实应该有一些限制。我希望让事情保持合理。” Blakeney提到，手机政策往往效果不佳，因为学生可以使用笔记本电脑，这同样会显示手机的通知。她建议学校应实施一项技术政策，而不是仅仅关注手机政策，并提出了一些建议和想法。 “虽然我认为手机是一个很好的起点，但这只是一个更大问题的症状。我们需要以大写‘T’来解决技术问题……我希望看到像GoGuardian这样的工具被实施……它允许教师设定课程的时间，在此期间锁定浏览器或记录学生所做的一切。如果老师后来收到电子邮件说某某人不理解这个概念，他们可以查看GoGuardian，发现 ‘哦，真有趣，这位学生在课堂上刷了半个小时的短视频。’ 它让人们承担责任，但又不会太过窥探和侵犯隐私。” 英语讲师 John Bird 谈到了执行难度以及影响课堂外手机使用的问题。 “我认为在睡觉前不应该盯着屏幕，但我们如何执行这一点呢？在课堂上我们可以执行【不使用手机政策】，但一旦你拿回手机，你就会再次查看。这就是生活。尽可能地，我们应该推广一种观念，就是将你的个性外包给手机实际上对你并不好。这是我们必须不断警告你们的事情，希望你们能听进去，” Bird说。 Translated by Angela Jin"
