["https://phillipian.net/2025/01/31/lunar-new-year-celebration-a-night-of-music-food-and-tradition"]
title = "Lunar New Year Celebration: A Night of Music, Food, and Tradition – The Phillipian"
description = "Students and faculty crowded into Kemper Auditorium to watch classmates sing and dance, performing everything from karaoke to traditional dances. With lively MCs and lion dances captivating the audience, the only thing that could distract from the talent show was the savory scent of Chinese dishes flowing in from the Underwood room, ready to be devoured after the festivities were over. Held on January 24, Andover’s Lunar New Year event was a vibrant celebration of talent and tradition. Students took..."
full_description = "Students and faculty crowded into Kemper Auditorium to watch classmates sing and dance, performing everything from karaoke to traditional dances. With lively MCs and lion dances captivating the audience, the only thing that could distract from the talent show was the savory scent of Chinese dishes flowing in from the Underwood room, ready to be devoured after the festivities were over. Held on January 24, Andover’s Lunar New Year event was a vibrant celebration of talent and tradition. Students took the stage with performances representing their Chinese classes or showcasing independent acts. Alongside the performances, a food festival — featuring dishes prepared by parents and local vendors — brought the community together through shared meals and cultural appreciation. Attendee Daniel Zhang ’28 acknowledged how the event honored Chinese traditions, celebrated diversity, and strengthened connections within the Andover community. “I would say the food festival definitely reminded me more of the spirit of the Chinese Lunar New Year Festival. I mean, people were all crowded around. I sat with my friends… [it] was just a really wholesome moment. I really enjoyed it because it was really warm inside too. I really enjoyed that warm fuzzy feeling that I’m surrounded by people who I love while celebrating my Chinese culture and heritage, while of course eating delicious food,” said Zhang. Zhang also reflected on his performance, highlighting the variety of cultural acts that contributed to the vibrant and interactive atmosphere. He compared the festival to previous events and shared his enthusiasm for his favorite performances. “[Alex Lin ’28 and I], performed “Second Last”, a Chinese piece, while doing flow ball light dancing to the singing. The performances I enjoyed the most were the ones where the whole class had a lot of energy. Additionally, a notable performance was when they played the traditional Chinese flute and the Guzheng, which is a traditional Chinese instrument, because those really exemplified the spirit of Chinese traditional cultural elements,” said Zhang."
