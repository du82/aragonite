["https://phillipian.net/2024/05/24/owhl-hosts-first-abbot-book-festival-inviting-off-campus-speakers-and-authors"]
title = "OWHL Hosts First Abbot Book Festival, Inviting Off-Campus Speakers and Authors – The Phillipian"
description = "The Oliver Wendell Holmes Library (OWHL) was bustling with speakers and students gathered around food trucks and workshops at the first-ever Abbot Book Festival. This year’s celebration, which took place on May 11, highlighted books such as “Binti” by Nnedi Okorafor and “The Disordered Cosmos” by Chanda Prescod-Weinstein and various other speakers came to share their work with the Andover community.   Anastasia Collins, Instructional Librarian and Geographer for the OWHL, was one of the key organizers of the event...."
full_description = "The Oliver Wendell Holmes Library (OWHL) was bustling with speakers and students gathered around food trucks and workshops at the first-ever Abbot Book Festival. This year’s celebration, which took place on May 11, highlighted books such as “Binti” by Nnedi Okorafor and “The Disordered Cosmos” by Chanda Prescod-Weinstein and various other speakers came to share their work with the Andover community. Anastasia Collins, Instructional Librarian and Geographer for the OWHL, was one of the key organizers of the event. Collins spoke about the process of organizing the event and noted the issues around engagement that the literary world was facing. “Right at the start of last summer, a couple of the other library folks and I were talking about multiple things around engagement in the library, engagement with the collection, but also about sort of the uptick in book bans that we’re seeing happening and what that conversation looks like, in independent schools… and someone just asked, has there ever been something like a festival book fair here. And to the best of our knowledge, there hasn’t been — for lots of reasons. Some of [these] have to do with the role that the library used to play on campus in the history of Andover. But since it hadn’t happened before, we started thinking of what it could look like today,” said Collins. A speaker at the event, K. Iver, a Writer-in-Residence at Andover, hosted a poetry reading during the Book Fair. Iver, a published author, read various works of the poetry they had written. Iver also participated in a discussion amongst faculty on some of the books displayed at the Book Fair, noting the interesting conversations that took place. “It was great. I had a little mic, and people turned up and listened. I read a poem from my book that had themes of space in it, two of them actually have space themes, and that seemed to be the prompt for the festival. I read a poem about reversing grief, or the idea of reversing grief, in a way that lets one kind of grab pleasure and joy for two if someone you miss is no longer there to experience wonderful things with you, are there ways to make them more wonderful, as if you were grabbing joy for two,” said Iver."
author = "Aden Hwang, Lucas Benardete"
