["https://phillipian.net/2025/01/24/arts-in-brief-6"]
title = "Arts in Brief – The Phillipian"
description = "[/imggallery Bad Bunny’s Debí Tirar Más Fotos Breaks Spotify Record, Climbing to No. 1 on the Billboard  On January 5, 2025, Benito Antonio Martínez Ocasio, known by his stage name as Bad Bunny, released his sixth studio album, “Debí Tirar Más Fotos.” The album quickly shattered records, becoming the fastest album by a male artist to reach one billion streams on Spotify in just 13 days.  In 2025, Martínez Ocasio will embark on his first-ever concert residency in his..."
full_description = "On January 5, 2025, Benito Antonio Martínez Ocasio, known by his stage name as Bad Bunny, released his sixth studio album, “Debí Tirar Más Fotos.” The album quickly shattered records, becoming the fastest album by a male artist to reach one billion streams on Spotify in just 13 days. In 2025, Martínez Ocasio will embark on his first-ever concert residency in his homeland, Puerto Rico, called “No Me Quiero Ir de Aquí,” running from July 11 to September 14. All 30 shows at the Coliseo de Puerto Rico quickly sold out, with over 400,000 fans set to attend. However, for Martínez Ocasio, this album represents more than just commercial success, but is instead a love letter to Puerto Rico. “At the peak of my career, I want to show the world who I am, who Benito Antonio is, and who Puerto Rico is,” he told “Variety, “Seeing this project come to life has brought me immense happiness. I’ve always been honest with my followers, and through this album, they’ll continue to learn more about me as I discover more about myself,” said Martínez Ocasio. Two sheets of yellowed paper, featuring Bob Dylan’s typewritten lyrics and handwritten edits to his 1965 hit “Mr. Tambourine Man,” are now for sale for $500,000. These papers were part of the personal collection of Al Aronowitz, a renowned rock and roll journalist and friend of Dylan, who documented the era’s music scene. For years, the Aronowitz family believed the lyrics were lost—until Myles Aronowitz, Al’s son, and his wife recently found them while sorting through his late father’s extensive collection. “He never threw anything away,” Aronowitz told “The New York Times,” after sifting through over hundreds of boxes containing his father’s archives. This discovery, along with the sale of these documents, comes at a time when Dylan is once again in the spotlight, with the release of “A Complete Unknown,” a biopic about his rise to fame. As Dylan remains a powerful influence, this newly discovered piece of history offers a glimpse into the creative process behind one of his most iconic songs, further solidifying Dylan’s legacy as one of the most influential artists of all time."
author = "Hluma Mangcu, Anya Casey"
