["https://phillipian.net/2024/11/01/you-are-not-your-politics-jane-coaston-discusses-civil-discourse-at-all-school-meeting"]
title = "“You are not your politics”: Jane Coaston Discusses Civil Discourse at All-School Meeting – The Phillipian"
description = "With the 2024 presidential election only a week away, Jane Coaston visited the Andover community during All-School Meeting (ASM) on October 25 to discuss the importance of separating personal beliefs from policy issues. As the latest guest in Andover’s Presidential Election Speaker Series, Coaston aimed to help attendees navigate political conversations in a time of growing division and to promote thoughtful dialogue about policy.  Walking down the aisles of the chapel during her speech, Coaston repeatedly highlighted the need to..."
full_description = "With the 2024 presidential election only a week away, Jane Coaston visited the Andover community during All-School Meeting (ASM) on October 25 to discuss the importance of separating personal beliefs from policy issues. As the latest guest in Andover’s Presidential Election Speaker Series, Coaston aimed to help attendees navigate political conversations in a time of growing division and to promote thoughtful dialogue about policy. Walking down the aisles of the chapel during her speech, Coaston repeatedly highlighted the need to separate one’s beliefs about policy from perceptions of candidates as individuals. She stressed that distinguishing between policy and personality leads to more meaningful conversation. Coaston elaborated on how to conduct effective conversations in an interview with The Phillipian. “Too often, you’re not even agreeing on the same set of facts. Getting your facts straight and knowing the issue really well, and also some understanding of how the other side sees the same issue is really important to even begin having these conversations… and knowing that you’re not trying to win and you’re not trying to convince them. The ideal is not to have them be, ‘Oh my God, you’re so right.’ The ideal is to have a conversation that you could have again,” said Coaston. Coaston also noted how modern politics often revolve around personal attacks due to people’s limited exposure to each other’s experiences. She elaborated on how Andover as an institution can help promote discussion that addresses and moves past different experiences. “I think a lot about encouraging class diversity because I remember one of the biggest differences I had when I was in high school was that I was a scholarship student and I went to high school with people whose parents were really rich… Class matters too, especially in a place like this, where some people are going to be coming from backgrounds that are really, really wealthy, and some people are going to be coming from backgrounds that are not,” said Coaston."
author = "Niki Tavakoli, Christian Estrada"
