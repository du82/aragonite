["https://phillipian.net/2024/12/13/girls-basketball-head-coach-jennifer-weissbach-dean-by-day-coach-by-starting-whistle"]
title = "Girls Basketball Head Coach Jennifer Weissbach: Dean by Day, Coach by Starting Whistle – The Phillipian"
description = "As a student, Girls Basketball Head Coach Jennifer Weissbach was a multi-talented athlete, scoring a thousand points in her high school basketball career and going on to play field hockey at Dartmouth College. Her successful basketball career inspired her to give back to students through coaching.  As a coach, Weissbach creates an environment that builds chemistry through a philosophy of “team first.” She hosts team dinners every week and tries her best to support the team in any fun activities..."
full_description = "As a student, Girls Basketball Head Coach Jennifer Weissbach was a multi-talented athlete, scoring a thousand points in her high school basketball career and going on to play field hockey at Dartmouth College. Her successful basketball career inspired her to give back to students through coaching. As a coach, Weissbach creates an environment that builds chemistry through a philosophy of “team first.” She hosts team dinners every week and tries her best to support the team in any fun activities athletes want to participate in. “I would say our team culture centers around prioritizing the team over yourself, working harder than you’ve ever worked before, and having fun while working hard. The specific things that we do, our captains do a great job of fostering relationships within the team. I have the team over for team dinners every week. We try to do some fun events outside of the court, such as a big holiday-themed dinner with the team. We’ll do some different activities throughout the season. But I really let the kids drive whatever fun events that they want to do. We try to support them in any way we can,” said Weissbach. According to Akari Imai ’25, Weissbach goes beyond individual basketball skills and also teaches her student-athletes how to be great teammates. Imai said, “She always encourages us to, for example, if someone on our team falls, then we always have to run and pick them up. If someone makes a mistake, we’re always positive. She builds a team culture where we are all lifting each other up. We never blame anyone. If someone makes a mistake, we’re immediately there telling them, ‘You got the next one.’ She always pushes us to be really good teammates.” Weissbach highlighted her assistant coaches Molly Creamer and Christopher Jones, Instructor in History and Social Sciences, as important members of her team, bringing vital positivity and knowledge to the team. She also loves the determination and commitment that her players have shown and believes that they are well-prepared for the season ahead."
