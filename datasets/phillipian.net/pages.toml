["https://phillipian.net/2025/02/14/girls-squash-captain-ellie-israelov-25-an-emphasis-on-mental-game-and-team-energy"]
title = "Girls Squash Captain Ellie Israelov ’25: An Emphasis on Mental Game and Team Energy – The Phillipian"
description = "Ellie Israelov ’25 has been dedicated to the sport since she first picked up a racket at age nine, transforming a casual suggestion from her dad into co-captaining the Girls Squash team. After attending a squash camp with her sister, Israelov quickly developed a passion for the game, drawn to both its physical demands and mental challenges. Now, she leads the team with dedication, focusing on building an encouraging environment and team camaraderie. For Israelov, a comeback is always possible,..."
full_description = "Ellie Israelov ’25 has been dedicated to the sport since she first picked up a racket at age nine, transforming a casual suggestion from her dad into co-captaining the Girls Squash team. After attending a squash camp with her sister, Israelov quickly developed a passion for the game, drawn to both its physical demands and mental challenges. Now, she leads the team with dedication, focusing on building an encouraging environment and team camaraderie. For Israelov, a comeback is always possible, but it takes mental toughness. The psychological aspect of squash is what drew her to the sport most, and has remained a key focus in her approach to the game. “One of my favorite things about squash, or what got me interested in it, is that the mental game is a big part of it. Especially being here, it is an individual but team sport. You kind of have to show up for yourself every time and I’m sure they say this in a lot of sports but something that I’ve always had to tell myself or my parents have told me is that the game’s never over until it’s over. You can come back even if it’s 10-love or 10-1 or 10-2, something like that. But you can’t do that unless your mental game is good,” said Israelov. Inspired by her Junior year’s captain, Israelov has striven to bring high energy and a supportive atmosphere to the team alongside Co-Captain Migyu Kim ’25. Together, they have organized team bonding activities, including team meals and a joint gathering with the Boys Squash team. “A big thing for me, coming onto the team freshman year was my captain who was really high spirited. And so, being a captain, it’s really important to me to build the team spirit and build camaraderie throughout the team. So, Migyu and I have worked together to plan team dinners and team brunches. And we even did a boys and girls team party where we got pizza and played White Elephant. The team aspect is one of my favorite parts about playing squash here,” said Israelov. According to Evelyn Kung ’26, Israelov brings an encouraging and energetic presence to the team, always motivating her teammates during matches. As Israelov’s pair partner, Kung noted her enthusiasm and coaching, both unique to her."
author = "Aaron Huang"
