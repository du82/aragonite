title = "A True Role Model: Boys Indoor Track & Field Co-Captain Jakob Kuelps ’25  – The Phillipian"
description = "For Co-Captain Jakob Kuelps ’25, effective leadership lies in acting as a role model for his teammates, holding the Indoor Track & Field community accountable, and guiding them through tough workouts. Growing up in a European household, he began his athletic journey playing soccer, then sprinting in the 100-Meter Dash. After joining a running club, Kuelps has since trained for long-distance events, which includes the 1600-Meter and 3200-Meter Races. Kuelps leads by acting as a role model and friend to..."
full_description = "For Co-Captain Jakob Kuelps ’25, effective leadership lies in acting as a role model for his teammates, holding the Indoor Track & Field community accountable, and guiding them through tough workouts. Growing up in a European household, he began his athletic journey playing soccer, then sprinting in the 100-Meter Dash. After joining a running club, Kuelps has since trained for long-distance events, which includes the 1600-Meter and 3200-Meter Races. Kuelps leads by acting as a role model and friend to his Track & Field team. He strives to be both personable while knowing when to transition the team to a more focused mood. Kuelps said, “I try to bring up people and not bog them down. I try to be supportive and try to be a captain that’s not just strict. I also try to hold people accountable, but also be funny, be there, and be on-point. I just want to be there, where people feel they can talk to me regarding things outside of practice. Track & Field is a great place to talk about Track & Field things… [But] I try to cultivate a dedicated and supportive group, where people feel like they can talk to me about anything.” According to Robert Budzinski ’26, Kuelps takes initiative, regularly leading team activities. Budzinski described the standards that Kuelps holds him and the rest of his teammates to. “He’s a pretty vocal leader. I definitely noticed during both Cross Country and now going into Track & Field season, because he was also a Cross Country Co-Captain. He takes charge a lot: he’ll lead things like warm-ups, et cetera, but he also does a real good job keeping everyone accountable. I know personally, he keeps me accountable, making sure I’m eating right and sleeping well, and all that stuff outside of practice,” said Budzinski. Andover’s running community is what Kuelps values highest. He enjoys the support that his teammates provide one another and the team’s distinctive group of athletes, whose experience in the sport ranges extensively."
