["https://phillipian.net/2025/02/28/the-relevance-of-a-century-old-play"]
title = "The Relevance of a Century-Old Play – The Phillipian"
description = "All School Meeting was abruptly halted last Friday as protesters flooded from their chapel seats to the stage. Armed with megaphones, they loudly rebuked…robot mistreatment? Fortunately, these students, including myself, were not actually protesters, but instead the cast of the Theatre & Dance Play Production (THD921) play, “Rossum’s Universal Robots” (R.U.R.). R.U.R is a play written in 1921 by Czech playwright Karel Čapek, famous for introducing the term “robot” into modern-day terminology (funnily enough, it stemmed from the Czech word..."
full_description = "All School Meeting was abruptly halted last Friday as protesters flooded from their chapel seats to the stage. Armed with megaphones, they loudly rebuked…robot mistreatment? Fortunately, these students, including myself, were not actually protesters, but instead the cast of the Theatre & Dance Play Production (THD921) play, “Rossum’s Universal Robots” (R.U.R.). R.U.R is a play written in 1921 by Czech playwright Karel Čapek, famous for introducing the term “robot” into modern-day terminology (funnily enough, it stemmed from the Czech word “robota,” which means “forced labor”). In essence, “R.U.R” explores a world where human labor is replaced by sentient “robots,” and the circumstances driving them to an eventual uprising. The version we were performing had been adapted to fit modern times by Dr. Natalya Baldyga, a History and Theatre teacher at PA. I still remember sitting around a table with the rest of the cast, doing the very first read-through of the script, and thinking: ‘Is this really a century-old play?’ “R.U.R.” opened my eyes to how long certain questions had been plaguing humanity. For example, is the pursuit of knowledge and progress eventually going to turn against us? A main concern raised within the play is whether this relief of the burden of hard labour is liberating mankind, or is dooming it to regress. Now, a century later, Čapek’s play is read through a very different lens. Dr. Rossum’s fictional man-made intelligence has been dragged out of the realm of science fiction and taken its baby steps into reality. Although we don’t have a robot workforce, the emergence of accessible artificial intelligence has sent ripples across communities, ranging from schools panicking over students using chatbots dishonestly to individuals concerned about the futures of their careers. The impacts of artificial intelligence are complicated. In the academic setting alone, it has provided a lot of convenience. Students can now use generative chatbots as a tool to enhance and further personalize their learning, such as ChatGPT to explain concepts in confusing topics or provide feedback on writing. Teachers, too, use generative AI to create quizzes and lesson plans based on an outline that they provide. However, there is another side to this coin: students can use generative AI to create work that they then submit as their own. This practice is blatantly academically dishonest and defeats the learning experience of doing that work in the first place. It is surprisingly like the issue raised in “R.U.R.”, and an issue that constantly returns to us at any technological revolution: is artificial intelligence a tool to support our learning and development, or is it a crutch that will hinder our ability to think and act without it?"
author = "Alexandra Lin"
year_published = 2025
year_updated = 2025
