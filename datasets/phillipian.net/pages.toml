["https://phillipian.net/2025/02/07/fauxever-yours-asas-mock-wedding-celebrates-diverse-african-cultures"]
title = "Fauxever Yours: ASA’s Mock-Wedding Celebrates Diverse African Cultures – The Phillipian"
description = "Rich flavors, lively music, and dazzling garments flooded the Snyder Center this past Saturday at the African Student Association’s (ASA) hosting of “Faux-Ever Yours,” a mock wedding showcasing and celebrating the diversity of African culture and tradition. Funded by the Abbot Academy Fund, ASA extended the invitations to the event to all students. ASA Co-Head Leticia Nhaule ’25 explained the motives behind a “mock wedding.” Nhaule emphasized the unique opportunity the event presented for cultural fusion. “We thought a wedding..."
full_description = "Rich flavors, lively music, and dazzling garments flooded the Snyder Center this past Saturday at the African Student Association’s (ASA) hosting of “Faux-Ever Yours,” a mock wedding showcasing and celebrating the diversity of African culture and tradition. Funded by the Abbot Academy Fund, ASA extended the invitations to the event to all students. ASA Co-Head Leticia Nhaule ’25 explained the motives behind a “mock wedding.” Nhaule emphasized the unique opportunity the event presented for cultural fusion. “We thought a wedding would be a very fun and interesting way to do this because a wedding is something a lot of people have experienced in their lives in very different ways. But the way that we do weddings in Africa is very different from in other places, as well as very central to very many African cultures, so it connects all of our cultures in different ways,” said Nhaule. The wedding was well attended by students, and community members, from all corners of campus. Attendee Ozochi Onunaku ’25 mentioned his thoughts on the reasoning behind such a large-scale, intricate, and educational event. “I’m pretty sure they wanted to show this event as a very fun, celebratory, and interactive way in which the student body can engage with African culture… It intrigues people, and it allows the ASA to have a doorway into drawing people into understanding more about different African cultures and not seeing Africa as a monolithic continent,” said Onunaku. Nhaule highlighted the goals of the event, expressing the need for an inclusive space to share and celebrate the cultural complexity among the student body. Nhaule stated this as the inspiration for the event and its scale. “African Student Association’s mission is to create a safe space where students can explore their African identities…as well as to be able to open that space up to the wider school community to [be] educated on a lot of these different cultures… The scale is very closely tied to the mission of the event because it’s that opening up to the wider school community to the fullest–to the best of our ability, creating a school-wide event,” Nhaule said."
