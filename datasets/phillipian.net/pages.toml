title = "한국의 물질주의 – The Phillipian"
description = "최근 저는 2021년 Pew Research Center의 보고서 “무엇이 삶을 의미 있게 만들까요? 17개 선진국의 관점.”을 발견했습니다. 이 설문조사에서는 17개 국가의 시민들을 대상으로 삶을 의미 있게 만드는 데 있어 가장 중요하게 생각하는 항목이 무엇인지 물었습니다. 대부분의 국가에서 ‘가족’이라고 답한 반면, 한국에서만 ‘물질적 여유’를 의미 있는 삶의 주요 요소로 꼽았습니다. 한국인으로서 이해할 수 없는 결과였습니다. 한국에서 물질만능주의가 확산되는 것을 보았지만, 한국 사회는 가족 중심적이고 사람에 대한 사랑이 많다는 사실도 알고 있었기 때문입니다. 한국 사람들은 타인에 대한 애정과 배려라는 ‘정’이라는 정서적 개념도 가지고..."
full_description = "최근 저는 2021년 Pew Research Center의 보고서 “무엇이 삶을 의미 있게 만들까요? 17개 선진국의 관점.”을 발견했습니다. 이 설문조사에서는 17개 국가의 시민들을 대상으로 삶을 의미 있게 만드는 데 있어 가장 중요하게 생각하는 항목이 무엇인지 물었습니다. 대부분의 국가에서 ‘가족’이라고 답한 반면, 한국에서만 ‘물질적 여유’를 의미 있는 삶의 주요 요소로 꼽았습니다. 한국인으로서 이해할 수 없는 결과였습니다. 한국에서 물질만능주의가 확산되는 것을 보았지만, 한국 사회는 가족 중심적이고 사람에 대한 사랑이 많다는 사실도 알고 있었기 때문입니다. 한국 사람들은 타인에 대한 애정과 배려라는 ‘정’이라는 정서적 개념도 가지고 있습니다. 식당 사장이 학생들에게 ‘더 잘 먹어라’며 밥 한 그릇을 더 주는 것, 지나가던 행인이 버스 정류장에 앉아 낙심한 사람을 위로하기 위해 시간을 내주는 것이 정입니다. 이 설문조사는 한국에 대한 저의 인식과 충돌했고, 왜 이렇게 정이 많은 사람들이 가족, 친구, 건강 등 다른 항목보다 물질적 행복을 우선시했을까 하는 의문이 생겼습니다. 호기심이 발동한 저는 여론조사 결과를 이해하기 위해 한국의 역사를 되돌아보았습니다. 현재 한국의 주요 인구는 한국 현대사의 두 가지 큰 비극을 겪은 조부모님과 부모님 세대로 구성되어 있습니다: 제 조부모 세대는 한국전쟁을 눈앞에서 경험했고, 부모님 세대는 국제통화기금(IMF) 사태의 여파를 겪었습니다. 6.25 전쟁 당시 대부분의 대한민국 국민들이 마을이 파괴되고 생명이 위협받는 등 굶주림으로 고통받았습니다. 1990년대 IMF 금융위기로 인해 많은 한국 기업들이 파산했고, 기업들은 하루아침에 직원 대부분을 해고할 수밖에 없었습니다. 많은 한국인 가족들은 생활비를 감당하지 못해 헤어져 멀리 떨어진 친척집에서 각각 몇 명씩만 데리고 살아야 했습니다. 두 시기 모두 자원과 돈이 부족해 가족들이 함께 먹지도, 함께 살지도 못했습니다. 이러한 트라우마는 한국 사회에서 물질만능주의의 한 형태로 남아 있습니다. 한국인들은 돈을 모든 것보다 우선시하는 것이 아닙니다. 많은 한국인들은 삶의 기본적인 필요와 보호를 보장하는 데 있어 돈의 중요성을 경험적으로 배웠습니다."
