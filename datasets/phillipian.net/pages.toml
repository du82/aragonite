["https://phillipian.net/2025/02/14/flash-films-a-24-hour-filmmaking-frenzy-where-creativity-knows-no-limits"]
title = "Flash Films: A 24-Hour Filmmaking Frenzy Where Creativity Knows No Limits – The Phillipian"
description = "Participants of the Andover Flash Films Festival dedicated themselves to a fierce 24-hour filmmaking challenge where exhaustion took a backseat to the thrill of creativity. This annual event, hosted by the Andover Moviemakers’ Club, pushed students to brainstorm ideas, write scripts, shoot scenes, and edit short films all while racing against the clock.  During the Flash Films Festival, students spent the night in the Oliver Wendell Holmes Library (OWHL) and worked from 9pm on Saturday, until 6 or 7am the..."
full_description = "Participants of the Andover Flash Films Festival dedicated themselves to a fierce 24-hour filmmaking challenge where exhaustion took a backseat to the thrill of creativity. This annual event, hosted by the Andover Moviemakers’ Club, pushed students to brainstorm ideas, write scripts, shoot scenes, and edit short films all while racing against the clock. During the Flash Films Festival, students spent the night in the Oliver Wendell Holmes Library (OWHL) and worked from 9pm on Saturday, until 6 or 7am the next morning. Art instructor and club advisor for Andover Moviemakers’ Junko Pinkowski noted how these time constraints, though strenuous, helped generate teamwork among participants as many students relied on collaboration to brainstorm, problem-solve, and refine their ideas. “The most rewarding part is the creative energy that emerges in such a short time. It’s incredible to see students come up with an idea on the spot and turn it into a full short film overnight. It’s also a bonding experience—when students start getting tired around 2 AM, they find ways to keep their energy up. This year, they played hide-and-seek in the library to wake themselves up before getting back to work.” said Pinkowski. Participants were encouraged to spread their artistics wings. Pinkowski also shared how she enjoyed seeing students explore topics that excited them, no matter how unconventional “There was no set theme, so participants could create whatever they wanted. Some groups made sci-fi parodies, others created visually artistic music-driven films, and we had a couple of comedies. One short film was inspired by video games, and another had a documentary style with some intense themes,” said Pinkowski. Flash Films was a fun event, aimed at allowing students to experience filmmaking in an enjoyable way. This encouraging spirit was reflected in Suvir Virmani ’25’s experience. “My favorite part is definitely the sense of community—just having fun with people. It’s not really a stressful event, and the final film itself doesn’t matter as much. It’s more about enjoying the filmmaking process,” said Virmani."
author = "Daniel Zhang, Elias Jeon"
