["https://phillipian.net/2024/10/25/matt-bellace-engages-uppers-and-seniors-on-mental-health-and-resilience-at-ebi"]
title = "Matt Bellace Engages Uppers and Seniors on Mental Health and Resilience at EBI – The Phillipian"
description = "Calling students onstage to rap and twist themselves into human chairs, Matt Bellace, psychologist and comedian, brought an interactive presentation to Uppers and Seniors for the Fall Empathy, Balance, and Inclusion (EBI) term talk. Bellace highlighted strategies for coping with stress and maintaining mental health without the use of substances, emphasizing humor as a key tool for stress relief.  Matteo Horvat ’25, who participated in Bellace’s “Guess That Song” activity, felt that the interactive elements of the presentation set it..."
full_description = "As the EBI speaker for Uppers and Seniors this term, Matt Bellace spoke on the importance of natural highs to relieve stress. Calling students onstage to rap and twist themselves into human chairs, Matt Bellace, psychologist and comedian, brought an interactive presentation to Uppers and Seniors for the Fall Empathy, Balance, and Inclusion (EBI) term talk. Bellace highlighted strategies for coping with stress and maintaining mental health without the use of substances, emphasizing humor as a key tool for stress relief. Matteo Horvat ’25, who participated in Bellace’s “Guess That Song” activity, felt that the interactive elements of the presentation set it apart from other speakers. He pointed out how Bellace’s approach of engaging directly with the audience, often venturing offstage, made the session more enjoyable and relatable. “The event was really fun. I liked the guy. He was energetic and engaged with the crowd. It seemed like people were really listening. He was an engaging speaker, [and] he was good at what he did… I liked that he incorporated the mental health aspects into popular culture references or jokes he made. Even if they came off as a little corny at moments, it was still very nice and fun to listen to. He got everyone laughing, which was good,” said Horvat. Brigitte Leschhorn, the Transitional Director of the EBI program, emphasized EBI’s need for open engaging conversations rather than just delivering information. She explained how that goal played into selecting Matt Bellace as a speaker. “EBI is often seen as just delivering content,” said Leschhorn. “We’re not saying this is the only or right way to think about mental health, gender, race, or any topic. We essentially say we will hold space as a community for this conversation. Having an engaging speaker helps decrease cortisol and increase positive feelings… A speaker like Matt Bellace provides that space for enjoyment while prompting students to consider how to find joy in life without relying on substances.”"
