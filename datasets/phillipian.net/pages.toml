["https://phillipian.net/2025/02/28/bowing-beyond-boundaries-music-instructor-angela-varo-moreno-unstrings-tradition-with-jazz-violin"]
title = "Bowing Beyond Boundaries: Music Instructor Ángela Varo Moreno Unstrings Tradition With Jazz Violin – The Phillipian"
description = "With roots in the flamenco-rich culture of Southern Spain and a career spanning classical, contemporary, and jazz music, Ángela Varo Moreno brings her unique perspective to the Andover music community. A jazz violin instructor and supervisor to the Andover-Lawrence Strings program, she combines technical precision with confident improvisation and pushes the boundaries of violin. Varo Moreno grew up in a rural part of Southern Spain in a home where music was fused into her everyday life. Influenced by her..."
full_description = "With roots in the flamenco-rich culture of Southern Spain and a career spanning classical, contemporary, and jazz music, Ángela Varo Moreno brings her unique perspective to the Andover music community. A jazz violin instructor and supervisor to the Andover-Lawrence Strings program, she combines technical precision with confident improvisation and pushes the boundaries of violin. Varo Moreno grew up in a rural part of Southern Spain in a home where music was fused into her everyday life. Influenced by her dad, a music educator, and the role of music in her family’s culture, she was immersed in flamenco from an early age. This upbringing encouraged her to embrace music education as a passion. “My dad founded the music school in my town, so I was able to receive a proper music education, even in this small town called Baena. We’re from a Romani, Andalusia [and] Dominican background, so music is deeply embedded in our culture. Music education there is not glorified, it’s more organic. It becomes part of everyday life, like the way we cook or talk. I learned flamenco and music by simply being around my grandma and mom, listening to singing, dancing, and being involved in music [as] part of the family,” said Varo Moreno. Varo Moreno’s teaching philosophy is shaped by the values of mentorship and bonding, something she was first exposed to through her family. As a private lesson instructor at Andover, she approaches teaching with a mindset toward bonding and nurturing creativity. She strives to encourage her students to express themselves through music. “When I came to the United States six years ago, I was lucky enough to be mentored by incredible people who opened my eyes and hearts… These people have defined for me what the role of a mentor is. They showed me the power of music, community, and how change happens through that. That’s what I try to bring to my students at [Andover]. It’s not about me being the teacher or an authority figure. It’s about working together, building relationships, and helping them find confidence and fall in love with jazz. I feel deeply connected to my heritage, and I work hard to ensure my voice is heard. That’s something I pass on to my students: if you work hard and stay true to yourself, you can achieve anything,” said Varo Moreno."
author = "Aden Hwang, Daniel Liu"
