["https://phillipian.net/2024/11/15/building-stronger-runners-and-stronger-bonds-coach-keri-lamberts-journey-of-empowering-girls-cross-country"]
title = "Building Stronger Runners and Stronger Bonds: Coach Keri Lambert’s Journey of Empowering Girls Cross Country – The Phillipian"
description = "Head Coach Keri Lambert first started cross country in 8th grade, joining 99 other middle schoolers on the team, including her older brothers. Lambert went on to have an excellent competitive history at Amherst College, running twelve seasons and earning seven All-Americans. She later attended Yale graduate school, serving as a graduate assistant coach for Yale’s Women’s cross country and track and field. Lambert’s passion for coaching girls cross country stems from empowering young female student-athletes to become confident in..."
full_description = "Head Coach Keri Lambert first started cross country in 8th grade, joining 99 other middle schoolers on the team, including her older brothers. Lambert went on to have an excellent competitive history at Amherst College, running twelve seasons and earning seven All-Americans. She later attended Yale graduate school, serving as a graduate assistant coach for Yale’s Women’s cross country and track and field. Lambert’s passion for coaching girls cross country stems from empowering young female student-athletes to become confident in their capabilities. Furthermore, Lambert loves to form new relationships with hardworking people and continue to connect with them throughout the season with spontaneous conversations. “My love for the sport and my strong belief that it can empower students, especially girls, to feel comfortable, strong, and capable in their bodies. Cross country also tends to attract super hard-working, thoughtful, and often quirky people, who I enjoy working with. My favorite way to connect with athletes is through conversations on easy trail runs, when we jump from topic to topic to topic, often totally unrelated to running,” said Lambert. Adding onto Lambert’s point, Ela Budzinski ’28 vividly recalls one of the conversations noting how the friendly and welcoming nature of the conversation made Budzinski, a new Junior, feel more integrated into the team. “There was one time where we were on a long run and we [Coach and I] ran together. We had a really nice conversation. It didn’t feel like I was talking to my coach. It just felt like I was talking to my friend. We really connected on running because she was a runner herself. It had a strong impact on me and I felt so welcome on the team,” said Ela Budzinski. Lambert argues that cross country is about more than just who finishes with the fastest time. She sees it as a sport that emphasizes four core values — selflessness, integrity, inclusion, and joy — all deeply connected through teamwork and sportsmanship."
