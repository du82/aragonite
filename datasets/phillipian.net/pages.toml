["https://phillipian.net/2024/09/20/co-captain-saraya-angbazo-25-couples-bubbly-energy-and-aggressive-hitting-style"]
title = "Co-Captain Saraya Angbazo ’25 Couples Bubbly Energy and Aggressive Hitting Style – The Phillipian"
description = "Co-Captain and Student Body Co-President of Andover, Saraya Angbazo ’25 began her volleyball journey during the seventh grade. After watching various volleyball games with her friends at her local high school, she loved the energetic nature of the game and became inspired to pursue the sport. According to Angbazo, her favorite aspect of volleyball stems from the excitement and chemistry she experiences with her teammates on the court. Angbazo continues to emphasize how her love for volleyball does not arise..."
full_description = "Co-Captain and Student Body Co-President of Andover, Saraya Angbazo ’25 began her volleyball journey during the seventh grade. After watching various volleyball games with her friends at her local high school, she loved the energetic nature of the game and became inspired to pursue the sport. According to Angbazo, her favorite aspect of volleyball stems from the excitement and chemistry she experiences with her teammates on the court. Angbazo continues to emphasize how her love for volleyball does not arise from the satisfaction of hitting lines or hitting cool passes, rather with excellent team chemistry. Angbazo said,“It’s just when everyone on the court is in sync and everyone just has the same goal of winning and having fun and staying positive and everyone’s on that same page. That’s when you can really feel it. It’s not physical, but you can just feel the excitement and the fun and the joy that everyone is sharing. When that comes alive, that is when you know we’re playing high-level volleyball.” Angbazo said, “Being able to really feel what other people are feeling and act as if and actually know what it feels like to be in their shoes, I think that’s really important when you’re trying to lead an entire team, or an entire school. So that is something that’s universal across the board.” Selene Xu ’27 recognized Angbazo’s encouraging nature and charisma while maintaining a strong feedback loop. Xu noted how Angabazo promotes positive team culture by being inclusive and kind to everyone on the team. “Especially last year, I was her pepper partner and I think she was really encouraging and she would always ask for feedback and give feedback, which I really like. Also I think she just motivates the team a lot and encourages everyone and she’s always so hyped for practice and games and always ready to go,” said Xu. Commenting on her strong relationship with Co-Captain Sophie Holten ’25, Angbazo believes that the pair complement each other’s energies. Having been friends and teammates for the past three years, Angbazo emphasizes how she plans to exemplify communication and strong relationships within the team."
