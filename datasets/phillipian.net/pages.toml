["https://phillipian.net/2024/11/16/academy-chamber-society-hosts-last-concert-in-graves-hall"]
title = "Academy Chamber Society Hosts Last Concert in Graves Hall – The Phillipian"
description = "Heads flipping back, bows passionately swinging, and vibrant sounds filling the air signaled the fall chamber music recital held in the Timken Room on November 9. Musical groups ranging from string quartets to wind trios walked onto the stage to showcase the work they have prepared throughout the term. This concert marked the final Chamber recital at Graves Hall, as the department prepares to move to Falls Music Center in 2025. The chamber groups, formed at the start of school,..."
full_description = "Heads flipping back, bows passionately swinging, and vibrant sounds filling the air signaled the fall chamber music recital held in the Timken Room on November 9. Musical groups ranging from string quartets to wind trios walked onto the stage to showcase the work they have prepared throughout the term. This concert marked the final Chamber recital at Graves Hall, as the department prepares to move to Falls Music Center in 2025. The chamber groups, formed at the start of school, have consistently rehearsed together throughout the fall term. In the practices leading up to the performance, musicians were able to meet new friends while practicing their musical abilities. Playing in a Beethoven clarinet quartet, Vedant Bajaj ’28 reflected on his time with the chamber society, noting how, as a new student, the program offered an opportunity to get to know the music community. “Chamber music is a very cool opportunity because it lets you bond with other people and it improves music skills that you would otherwise not learn. I’m really glad to have been able to play alongside my group and especially listen to what others prepared this term,” said Bajaj. This year, the Academy Chamber Society was led by Co-Heads, Helios Hong ’25 and Sophie Tung ’25. Working with faculty on the programming and organization behind the program, Hong discussed the efforts over the past term. Hong also performed in the concert as a part of two chamber groups, noting the growth of the group throughout the term. “I am one of the Co-Heads with Sophie. Basically, you have the option of coaching a group for every term. We also work with Mrs. [Holly] Barnes [Instructor in Music and Director of Performance] to pick a repertoire, to put groups together, and also work together on the program and the scheduling of the concert. This term, I was part of two chamber groups. The point of chamber is to play music with smaller groups of people and to learn about each other’s instrument and each other’s sound, and I definitely did that in both of my chamber groups,” said Hong."
author = "Aden Hwang, Daniel Liu"
