["https://phillipian.net/2024/03/28/girls-lacrosse-dominates-in-scrimmage-against-austin-prep"]
title = "Girls Lacrosse Dominates in Scrimmage Against Austin Prep – The Phillipian"
description = "Andover Girls Lacrosse secured a victory in their scrimmage against Austin Prep on Wednesday. The team was scheduled to partake in another scrimmage against Lexington High School on Saturday, but due to poor weather conditions, the match was canceled. According to Ellie Parker ’25, Andover had the advantage for the entirety of the Wednesday scrimmage. She highlighted how everyone contributed to the success of the match. Parker said, “We were out-competing them the whole time. After the first quarter, I..."
full_description = "Andover Girls Lacrosse secured a victory in their scrimmage against Austin Prep on Wednesday. The team was scheduled to partake in another scrimmage against Lexington High School on Saturday, but due to poor weather conditions, the match was canceled. According to Ellie Parker ’25, Andover had the advantage for the entirety of the Wednesday scrimmage. She highlighted how everyone contributed to the success of the match. Parker said, “We were out-competing them the whole time. After the first quarter, I think we were up 6 or 7 to 1. So from the beginning, we had the momentum, instead of them, that carried throughout the whole game… It was definitely a whole team effort. Everyone got in, we had a lot of different scorers, and everyone all the way from our defense to our mids to our attacks contributed to the game.” In preparation for the scrimmage, Andover honed in on offensive and defensive skills, according to Quiana Bell ’26. “On offense we wanted to work on our movement and making sure that we never kept our feet planted, working with each other, running different isolation plays from different parts of the eight-meter, setting picks off of each other. Then on the defensive end, we worked a lot on staying big, getting our sticks in the passing lane, and … working on our communication, crashing when s[omeone is coming] in the eight and especially defending the cutters when they are going through the middle…” said Bell. The scrimmage was the first unofficial interscholastic game of the season, and therefore also the first time Andover was competing against another team as one unit. Though it was early in the season, Parker mentioned that the team had already begun to better understand each others’ playing styles and strengths. “We worked on getting to know one another, and our style of play on the field because we’re a new team. So we just worked on the flow of new players and practice, and communication all over the field, not just on defense but on offense too, and playing towards each other’s strengths and just working off of one another to best set each other up in the offensive zone,” said Parker."
