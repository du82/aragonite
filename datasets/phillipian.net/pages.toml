["https://phillipian.net/2024/10/11/duke-law-professor-neil-siegel-discusses-constitution-and-political-discourse"]
title = "Duke Law Professor Neil Siegel Discusses Constitution and Political Discourse – The Phillipian"
description = "In an event planned in coordination with the History department, Dr. Neil Siegel, a professor of Law and Political Science at Duke, covered the U.S. Constitution in a conversation with Leon Calleja, Chair of the English Department. The event, held on October 9, served as part of Andover’s efforts in the broader initiative for students to engage in political discourse on campus.  Kicking off the event, Siegel explained the importance of the Constitution, a document that heavily influences the lives..."
full_description = "Dr. Neil Siegel, professor of Law and Political Science at Duke University, spoke to students and faculty about the U.S. Constitution in Tang Theatre. In an event planned in coordination with the History department, Dr. Neil Siegel, a professor of Law and Political Science at Duke, covered the U.S. Constitution in a conversation with Leon Calleja, Chair of the English Department. The event, held on October 9, served as part of Andover’s efforts in the broader initiative for students to engage in political discourse on campus. Kicking off the event, Siegel explained the importance of the Constitution, a document that heavily influences the lives of everyone in the United States, particularly in a time of polarization. “Because the U.S. is so extraordinarily diverse, the U.S. Constitution is often called our civic religion. Especially during an era in which our politics is quite polarized, it’s important to ask what binds us together as a nation. I think at the top of the list is the U.S. Constitution,” said Siegel. Siegel continued, “The Constitution is our fundamental law, the law from which all other laws either follow or are impermissible because they violate the Constitution… You’re going to be living with the consequences of how the Constitution is interpreted or misinterpreted a lot more than the people currently on the Supreme Court.” Calleja, in conversation with Siegel, who formerly clerked for Supreme Court Justice Ruth Bader Ginsburg, covered pressing topics such as recent Supreme Court cases and the constitutional framework surrounding democracy. Calleja hoped that students would leave the event with a deeper understanding of the legal and historical context that shapes contemporary governance. “In the spring of last year, we were talking about the kinds of programming the school could offer around democracy and the elections for the upcoming year… [Students can take away] their own role in how government works, where their voice fits in, and the kinds of responsibilities and obligations one has, even if that means getting a better understanding of how government works, how our laws and the Supreme Court works. The combination of just education on a part of the law and a part of our government sometimes goes under-analyzed, but hopefully motivates people to think more,” said Calleja."
