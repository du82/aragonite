["https://phillipian.net/2024/10/25/spooky-season-the-andover-communitys-favorite-fall-films"]
title = "Spooky Season: The Andover Community’s Favorite Fall Films – The Phillipian"
description = "As leaves turn a warm orange and Halloween slowly creeps up, the fall season is beginning to reach its height. We asked students around campus about their favorite fall movies. Ellie Sun ’25 My favorite fall movie is ‘Coco.’ Its theme is centered around an event in the fall and it was really interesting. The colors that it uses are all super vibrant and bright, which reminded me of the orange, brown, and muted color palette of the fall season...."
full_description = "As leaves turn a warm orange and Halloween slowly creeps up, the fall season is beginning to reach its height. We asked students around campus about their favorite fall movies. My favorite fall movie is ‘Coco.’ Its theme is centered around an event in the fall and it was really interesting. The colors that it uses are all super vibrant and bright, which reminded me of the orange, brown, and muted color palette of the fall season. I really like “The Nightmare Before Christmas.” It’s a movie that I grew up watching so whenever Halloween comes around, I remember it pretty clearly. It was also a pretty fun movie. There’s a series called the Discworld series, and in there there’s a movie called the “Hogfather.” It’s actually more of a blend between Halloween and Christmas. It’s about how Christmas is being saved by the granddaughter of the grim reaper. It’s a really interesting mix-and-match between themes, and it’s a great film. When I think of fall and Halloween movies, I’m reminded of “The Karate Kid,” especially because of that Halloween scene where they’re in the bathroom with a guy in a costume. That’s really the first movie that comes up, and “[The] Karate Kid” is just a really heartwarming story about international connections. My favorite fall movie is “The Truman Show.” It’s a good fall movie because whenever I see the leaves falling from the trees, I see the deadness inside them, and I get a chance to reflect on my empty life. When I see “The Truman Show,” I see myself in Truman, so whenever I see a single yellow leaf on the ground, I’m reminded of how his entire life has just been a cascade of lies just like how mine has been one as well — towards an unattainable, meaningless goal. My favorite fall movie is “Corpse Bride” because it’s a really nice movie to watch with your friends and yourself, and there’s a lot of good symbolism in the story. It’s good for Halloween, it’s good for a rainy day, it’s good for any occasion. I really like the overall color theme of the movie. It’s got a very bluish tint, which encapsulates the general feeling of the movie. I also like the style of animation. I really like Tim Burton’s style, so it’s definitely one of my favorites."
author = "Aden Hwang, Jenna Liang"
