["https://phillipian.net/2025/02/28/game-on"]
title = "Game On – The Phillipian"
description = "Animated by Angela Guo For many, classic video games like Subway Surfers, Candy Crush, and 2048 are a staple of their childhoods. Characterized by flashy visuals and simple, repetitive gameplay, these games captivated players worldwide, luring millions into spending countless hours to beat the next level or reach a new high score. Today, these types of games have maintained their popularity, yet acquired a new name; we now describe them with the new Gen-Z phenomenon: “brain rot.” “Brain rot” —..."
full_description = "For many, classic video games like Subway Surfers, Candy Crush, and 2048 are a staple of their childhoods. Characterized by flashy visuals and simple, repetitive gameplay, these games captivated players worldwide, luring millions into spending countless hours to beat the next level or reach a new high score. Today, these types of games have maintained their popularity, yet acquired a new name; we now describe them with the new Gen-Z phenomenon: “brain rot.” “Brain rot” — the 2024 Oxford Word of the Year — can be vaguely described as low-value, low-quality internet content that encourages hyperconsumption, to the point that it negatively affects our cognitive abilities — literally rotting our brains with overexposure to meaningless content. Every once in a while, another game becomes the new trend and takes over the internet and our campus. The frequency with which these obscure games rocket their way to virality prompt us to ask, “Why does this happen?” The appeal is simplicity. Brain rot games are designed with a elementary premise; in Block Blast, it’s to fill a row or column by dragging and dropping shapes; in 2048, it’s to swipe and merge tiles to attain a 2048 tile; in the viral watermelon game, it’s to combine matching fruits to create watermelons. More importantly, these games often have no definitive end, or a clear, attainable win condition. Instead, they feature rapid “checkpoints,” whether that’s clearing another row of blocks or passing the next obstacle, and constantly provide small dopamine rushes to keep players engaged. Furthermore, with simple mechanics and the convenience of not requiring an internet connection, these games serve as a low-commitment option to fill up brief moments of idleness. It’s easy for us to spontaneously continue or begin a new game in between classes or during late nights; but minutes quickly melt into hours and, and before you know it, you’ve spent the past hour playing Tetris. While these games seem like a harmless way to pass time, they provide a shallow sense of accomplishment that can create a cycle of addiction and procrastination."
author = "Staff Report"
