["https://phillipian.net/2025/02/14/a-history-of-head-of-school-days-from-the-first-to-the-thirty-fourth"]
title = "A History of Head of School Days, from the First to the Thirty-Fourth – The Phillipian"
description = "There is not a clear beginning to the tradition of HoSD. One origin story is from 1978, when the February Blizzard dumped 27 inches of snow on campus in a 24 hour time span. Andover canceled classes on the day of, though students expressed fury in that week’s issue of The Phillipian about not having classes canceled for longer. Additionally, Former Head of School Theodore Sizer would give students a spontaneous day off in Fall Term if the football team..."
full_description = "There is not a clear beginning to the tradition of HoSD. One origin story is from 1978, when the February Blizzard dumped 27 inches of snow on campus in a 24 hour time span. Andover canceled classes on the day of, though students expressed fury in that week’s issue of The Phillipian about not having classes canceled for longer. Additionally, Former Head of School Theodore Sizer would give students a spontaneous day off in Fall Term if the football team won Andover/Exeter from 1978 to 1981. Finally, in Winter of the 1990-1991 school year, Former Head of School Donald McNemar canceled classes for a day in response to surges of influenza. The way HoSD has been announced has also changed over the years, with each Head of School eventually using their own interests to announce it. Paul Murphy, Instructor in Mathematics, described how different Head of Schools would announce the event. “[McNemar] would walk into the dining hall the day before, and announce it in all four dining halls. Once he got up to one dining hall everyone understood what was happening, so sometimes he would sneak in, so nobody knew he was coming into the dining hall. Then Barbara Chase [Head of School from 1994-2012] changed it a little bit, because I think she didn’t like how every time she walked into the dining hall in the winter, everyone thought that there was going to be a Head of School Day. She made it so that if she came into the dining hall with her field hockey stick and waved the field hockey stick, that signaled that no classes would happen the next day. Then John Palfrey changed it to the squash racket, and then Dr. Kington has his hat that he wears,” said Murphy. This year’s HoSD was announced during the ASM as many students were already packing up to leave. Kington appeared on the balcony above the stage and lifted his hat, to cheers from the audience. Ozochi Onunaku ’25 described the scene and noted that an announcement at ASM allows everyone to celebrate together, as opposed to other announcement methods."
