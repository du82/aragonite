["https://phillipian.net/2024/10/11/andover-announces-task-force-to-create-schoolwide-cell-phone-policy-for-the-2025-2026-school-year"]
title = "Andover Announces Task Force to Create Schoolwide Cell Phone Policy for the 2025-2026 School Year – The Phillipian"
description = "Andover has unveiled plans to create and implement a policy regulating cell phone usage across campus starting next year, according to a schoolwide email sent from the Dean of Students Office to the student body on October 3. To catalyze the transition, the school will establish a task force of both students and faculty members to develop a comprehensive cell phone policy. Susan Esty, Dean of Students and Residential Life, and David Gardner, Assistant Dean of Students and Residential Life,..."
full_description = "Andover has unveiled plans to create and implement a policy regulating cell phone usage across campus starting next year, according to a schoolwide email sent from the Dean of Students Office to the student body on October 3. To catalyze the transition, the school will establish a task force of both students and faculty members to develop a comprehensive cell phone policy. Susan Esty, Dean of Students and Residential Life, and David Gardner, Assistant Dean of Students and Residential Life, outlined the logistics of the task force in the email. According to the announcement, the task force will evaluate Andover’s current cell phone policies and compare them to the policies of other schools, discuss existing research, and work through the summer of 2025 to finalize and implement the policy. “[This task force] will play a crucial role in shaping the future of cell phone usage at Andover and in supporting the growth, health, learning, and happiness of our entire Big Blue community,” wrote Esty and Gardner in the schoolwide email. Although there is currently no schoolwide cell phone policy at Andover, many other schools have implemented systems to reduce screen usage throughout the school day. Deerfield Academy adopted a policy in 2022 that requires students to leave their phones in their dorms from 8:00 a.m. to 3:00 p.m. on weekdays. Similarly, Hotchkiss banned cell phone usage in classrooms, the dining hall, and community gatherings beginning fall of 2023. Some instructors enforce their own regulations in the classroom to minimize distractions and improve learning. M.C. Post, Teaching Fellow in History, shared how phones can disrupt focus, especially in discussion-based classes. They currently implement a system where students keep their phones at the door during class. “I’m pretty proximate to a student age, just because I graduated college almost two years ago, and I know how distracting phones can be when I was a student. I know that students don’t want to be distracted, but it’s just so easy to go on your phone when you have it right there, especially for a discussion-based class. The quality of education is better when phones aren’t using people’s attention. I think just removing that all the way from students, nine to five… allows them to be more present,” said Post."
