["https://phillipian.net/2025/02/21/paul-hertz-an-artist-in-residence-who-blends-art-technology-and-activism"]
title = "Paul Hertz: An Artist-in-Residence Who Blends Art, Technology, and Activism – The Phillipian"
description = "On Friday, February 13th, the Addison Club hosted an open lunch with current artist-in-residence Paul Hertz. Hertz, a Phillips Academy alum, used this event as an opportunity to connect with Andover students and As an algorithmic artist, Hertz generates computer algorithms to create abstract visuals. Despite the rise of AI algorithmic art, Hertz has managed to pave an creative path within the algorithmic art field, particularly through the diverse computational methods he uses. “At first I hadn’t really come across..."
full_description = "On Friday, February 13th, the Addison Club hosted an open lunch with current artist-in-residence Paul Hertz. Hertz, a Phillips Academy alum, used this event as an opportunity to connect with Andover students and As an algorithmic artist, Hertz generates computer algorithms to create abstract visuals. Despite the rise of AI algorithmic art, Hertz has managed to pave an creative path within the algorithmic art field, particularly through the diverse computational methods he uses. “At first I hadn’t really come across algorithmic and generative art before other than AI art, but [Hertz’s] process was highly meticulous and also, very personalized. I was talking about post-digital art theory and how he humanizes the digital realm. I find that so compelling because I have never come across something like that before,” said Francesca Dizon ’26, board member of the Addison Club. Straying away from traditional art mediums, Hertz skillfully combines algorithmic art, with one of his long-term passions, music composition. He consistently finds ways to translate sound — and the feelings different sounds may evoke —into visual art. “I produce a lot of computer graphics using my own software. The latest ones are visualizations of audio waves. I have used simulated bird flight, regular random noise, tiling patterns and topological procedures to produce images with the computer. I continue my collaborations with musicians and composers. I have developed techniques for collaboration involving shared structures and poetic concepts that can be used in multiple media streams.” Hertz explained. No matter the media, art has always been more than simply a career for Hertz. Through his work, he has been committed to advocating for social, political, and cultural advancements. Students who attended lunch with Hertz appreciated how he was able to draw inspiration from the change he wished to see in the world. Dizon shared her experience talking to Paul Hertz, stating “he’s such a well-rounded artist. I’ve never come across art that blends so many different fields. He involved math and he aims to dismantle political, social, cultural structures. I find his work so compelling, so I learned a lot about him. It was just a really good experience to interact with different artists with different inspirations.”"
author = "Daniel Zhang, Elias Jeon"
