["https://phillipian.net/2025/02/07/the-power-of-our-spiritual-core"]
title = "The Power of Our Spiritual Core – The Phillipian"
description = "On a windy Thursday evening, I was lost in thought as I listened to Dr. Lisa Miller, a guest speaker invited to the annual Interfaith Week: a week dedicated to strengthening interfaith relations. She spoke on the connection between spirituality and neuroscience. Not long after, as swarms of students pushed out of the chapel and rushed into the drizzling weather, I found myself contemplating once more on Andrew Wilson ’12’s — a retired collegiate and Olympic swimmer — All-School Meeting..."
full_description = "On a windy Thursday evening, I was lost in thought as I listened to Dr. Lisa Miller, a guest speaker invited to the annual Interfaith Week: a week dedicated to strengthening interfaith relations. She spoke on the connection between spirituality and neuroscience. Not long after, as swarms of students pushed out of the chapel and rushed into the drizzling weather, I found myself contemplating once more on Andrew Wilson ’12’s — a retired collegiate and Olympic swimmer — All-School Meeting speech. You may be wondering, what does an Olympic swimmer have anything to do with a psychologist and researcher? Wilson spoke of how, in the past, he defined himself solely as his abilities and successes, tying his self-worth to factors that he couldn’t control, and the negative effects that had on his mental health. Meanwhile, Dr. Miller discussed how the presence of a spiritual core, a strong spiritual mindset, could shift our perspectives, helping us view ourselves as what we were inherently worth instead of our achievements. I realized that students at Andover could benefit from a stronger spiritual core, as it would pull us away from the negative habit of seeing others and ourselves for their abilities alone. In just the two terms I’ve spent at Andover so far, I feel like I’ve learned more than I have in the two years or so prior. I’ve become adept at managing my time, waking up early to get work done, and more motivated than ever by the peers around me. In spite of this, however, the more winter term has dragged on, the more I’ve felt like I wasn’t doing ‘enough.’ I began seeing myself as just my academics and my extracurriculars: my lower math level compared to those of my friends, the six-level questions I got wrong on my chemistry test, or my lack of writing awards that somehow everyone else seemed to have. It didn’t matter that I aced my tests, or that I wrote because I loved to write. By the time midterms rolled around, I was exhausted. I felt like no matter what I did, I just wasn’t good ‘enough:’ everything I was doing was wrong, and any free time I had was wasted. I felt lost. As Wilson related his own experiences during his speech, I realized I wasn’t alone in this feeling. He noted that many people in high-achieving communities such as Andover had felt like this."
