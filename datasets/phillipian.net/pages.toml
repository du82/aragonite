["https://phillipian.net/2024/09/20/makerspace-a-nest-of-creativity"]
title = "Makerspace: A Nest of Creativity – The Phillipian"
description = "Among the resources and spaces available on campus, there’s only one where you can physically create anything you could possibly think of: The Makerspace, otherwise known as “The Nest.” Whether you use the space for its advanced machines or as a hangout area, The Nest has become a hub for those interested in stretching the limits of their imagination to tinker and create.  Opened in 2015, The Nest was renovated during the 2019 OWHL renovation, doubling in size and opening..."
full_description = "Among the resources and spaces available on campus, there’s only one where you can physically create anything you could possibly think of: The Makerspace, otherwise known as “The Nest.” Whether you use the space for its advanced machines or as a hangout area, The Nest has become a hub for those interested in stretching the limits of their imagination to tinker and create. Opened in 2015, The Nest was renovated during the 2019 OWHL renovation, doubling in size and opening up more opportunities for the student body. Clubs such as Robotics and Rocketry, as well as classes such as machine learning, regularly use the space for their meetings, utilizing the vast tools that the space offers. Many students come to The Nest to take advantage of its wide selection of materials and tools to fuel their imagination. It also offers a collaborative space for students to work and meet together as a group. Nick Zufelt, Instructor in Computer Science, provided insight into the different uses for The Nest and why it is such an important resource for the student body. “The [Nest] offers lots of materials for cool projects. For example, we’re just doing a random thing here in the dorm, making a chart of who has what dorm duties to keep things organized, and it came up, ‘Oh, we need poster board, let’s go to [The Nest].’ So to a lot of students, I think that it’s a good space to spread out and work on… some big project that you couldn’t… do in [The Garver Room] or really anywhere else in the library. It does have lots of big fancy machinery when you need it, but I think that’s sort of flashier than [what] most students need most of the time. I think really simple things like paper, scissors, glue, almost sounds like the kindergarten stuff, but it’s interesting that high school [students]… [haven’t] moved beyond the needs of those things… You still have projects that need those fundamental tools, and the Makerspace is a place that allows that,” said Zufelt."
author = "Aden Hwang"
