["https://phillipian.net/2025/02/07/eliza-francis-26-curates-style-with-vintage-pieces-bold-colors-and-personal-history"]
title = "Eliza Francis ’26 Curates Style with Vintage Pieces, Bold Colors, and Personal History – The Phillipian"
description = "Bringing a retro style to life, Eliza Francis ’26 curates her outfits with intent, blending vintage treasures and hand-me-downs to craft a look that is authentically hers. Francis’ fashion is deeply rooted in her surroundings and personal history. Her wardrobe, largely composed of secondhand finds and sentimental pieces, tells a story of the people and passions that shape her identity. Growing up with limited control over her clothing choices, Francis discovered freedom of self-expression through style as she got older...."
full_description = "Bringing a retro style to life, Eliza Francis ’26 curates her outfits with intent, blending vintage treasures and hand-me-downs to craft a look that is authentically hers. Francis’ fashion is deeply rooted in her surroundings and personal history. Her wardrobe, largely composed of secondhand finds and sentimental pieces, tells a story of the people and passions that shape her identity. Growing up with limited control over her clothing choices, Francis discovered freedom of self-expression through style as she got older. To her, fashion became about more than just clothing, but about honoring her family’s history while creating something uniquely her own. “My style is a manifestation of the activities I do and the people and things I love. I tend to not fit into a singular aesthetic, but I also just try to be authentically me. I think a lot of my pieces have stories behind them. I love thrifting and I also love wearing my mother’s or my grandpa’s hand-me-downs and really treasuring those gifts and those like parts of my family and like bringing them to life in a way that is honoring them but still unique to me,” said Francis. Francis structures her outfits around staple pieces, primarily her extensive collection of Calvin Klein jeans She considers them the ultimate versatile item, suitable for any occasion. She points to jackets as another essential component of her wardrobe. “Jeans are the perfect clothing item. I wear them on airplanes. I wear them for tests. I don’t think they’re uncomfortable at all. I actually think they’re peak comfort… I love jackets. A lot of that is due to me stealing from my boyfriend’s style but I don’t pick an outfit that’s complete without a jacket and that’s probably my favorite thing to thrift. I love denim. I love big bomber jackets or ones that have random sayings on the back,” said Francis. For Francis, an outfit is not complete without a bold pop of color. Her love for red, in particular, traces back to her years as a competitive dancer, where bright lipstick was a performance staple. Now, that signature touch has become an essential part of her everyday style."
