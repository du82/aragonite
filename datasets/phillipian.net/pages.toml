title = "Andover/Exeter Spirit Spread – The Phillipian"
description = "The iconic rivalry that is Andover/Exeter (A/E) brought out hundreds of students this past weekend to compete and celebrate. From face paint, to Gunga masks, to blue accessories, see how students showed off their Big Blue spirit. Andrew Pizzi ’27 “I’m wearing a blue wig, half of my face is blue, I’ve got a blue ‘A’ and white cross. I’ve got my A/E shirt, and I’ve got four necklaces. And sunglasses… [My message is] ‘GO BIG BLUE’… I found everything..."
full_description = "The iconic rivalry that is Andover/Exeter (A/E) brought out hundreds of students this past weekend to compete and celebrate. From face paint, to Gunga masks, to blue accessories, see how students showed off their Big Blue spirit. Andrew Pizzi ’27 “I’m wearing a blue wig, half of my face is blue, I’ve got a blue ‘A’ and white cross. I’ve got my A/E shirt, and I’ve got four necklaces. And sunglasses… [My message is] ‘GO BIG BLUE’… I found everything that’s blue in my room, and I just put it on.” Nisa Khairunnisa ’25 “I was wearing a gorilla mask. That was the cream on the top… A lot of people asked whether I was Gunga. I was not Gunga. I was just a fan of Gunga. I had the mask from back when I was in Indonesia. I bought it in the zoo. That was actually before Andover, so when I came to Andover and realized the mascot was a gorilla, I realized that I had to use the mask at some point in my time here.” Chloe Abou-Ezzi ’27 “The hoodie is my cousin’s. It’s a 2024 graduate hoodie. I think it was her class merch. The sunglasses and necklaces, I got from [Susie’s], and the face paint was also from [Susie’s]… Marcela [Hernandez ’25], one of the Blue Key Heads, painted it for me… I made [a sign] for Jackie [Dill ’27]. She’s the goalie of Girls Soccer.” Serafina Shin-von Nordenflycht ’25 “I’m a Blue Key Head, so I was wearing as much spirit as possible… I always wear a fanny pack. It is the most useful part of my outfit because whenever you’re carrying a speaker or cough drops etcetera, it’s nice to have a little bag. I was wearing a blue cape as part of my spirit… and then my two most iconic pieces of clothing: I have a sparkly cowboy hat, which has stars all over it, and then I have these amazing ’70s sparkly go-go boots… When I slip those shoes on, I slip into my role as a spirit leader.” Darielys Almonte ’25 “I tried to be as blue as possible, so I wore my blue track hoodie and my blue varsity jacket with my blue Air Jordans… A key point of my outfit was my hair because I temporarily dyed my whole head blue. Not only that, it was curly, so I was walking around with blue, voluminous curls which definitely stood out… It’s okay to be different and stand out, especially at a time during A/E and spirit week. We’re trying to show how much we care for this school… You’ll never be at a school like Andover again. Be crazy and have fun!”"
author = "Maggie Shu, Alexandra Lin"
year_published = 2024
