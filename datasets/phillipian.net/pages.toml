["https://phillipian.net/2025/01/17/looking-back-and-moving-forward"]
title = "Looking Back, and Moving Forward – The Phillipian"
description = "My mother never loved New Year’s resolutions because she believed they were useless. On the contrary, I loved coming up with them. Each year, I would decide to go to the gym regularly, learn how to cook a new dish every month, or finally learn how to ride a bike. My mother would always sigh, pat me on the back, and say, “Alex, there’s no point in making a New Year’s Resolution.” My mother believed that setting a big, flashy..."
full_description = "My mother never loved New Year’s resolutions because she believed they were useless. On the contrary, I loved coming up with them. Each year, I would decide to go to the gym regularly, learn how to cook a new dish every month, or finally learn how to ride a bike. My mother would always sigh, pat me on the back, and say, “Alex, there’s no point in making a New Year’s Resolution.” My mother believed that setting a big, flashy goal for the end of the year, despite sounding nice, was daunting when one embarked on their pursuit to achieve it. She wanted me to set smaller, more manageable goals. If I hoped to accomplish something by the end of the year, I couldn’t just talk about setting a New Year’s Resolution. I had to form a plan and act on it. Therefore, you can imagine my surprise when we sat down at a cozy restaurant with some friends on the dawn of January 1, 2025, and she suddenly stated, “Let’s talk about New Year’s Resolutions!” Picture this: dim candlelight illuminated the table and faint wisps of conversation drifted by in the background. My friend and I: dazed Juniors grateful for a relaxing break after our first term in high school, looked up attentively as we waited for the food to arrive. My mother pulled up a list of questions she’d written on her phone: What was the biggest risk you’ve taken in 2024? What was the biggest challenge you’ve faced in 2024? What is the best decision you made in 2024? As we moved through the questions, I realized that I could answer most of them with one word: Andover. Although Junior Fall was probably one of my academically lightest terms at Andover, it felt like it had the steepest learning curve. Settling in at Andover wasn’t as smooth as I imagined it would be. I’d always heard friends and family talk fondly of the lifelong friends and unforgettable memories they’d made at boarding school. Stepping into the Underwood Room during New International Student Orientation, I was greeted by a sea of unfamiliar faces. While I was undoubtedly excited, I was also plagued by doubt. What if I couldn’t make friends? What if I wasn’t responsible enough to live alone? This worry lingered over me like a dreary fog throughout my first few weeks at the school. I felt lonelier than ever, and at times, utterly clueless, tearily calling my parents and friends back at home in the evenings. I had to adapt to living alone, learning the hard way to set reminders for my homework and laundry, as well as regularly forcing myself to clean up my mess of a room."
author = "Alexandra Lin"
