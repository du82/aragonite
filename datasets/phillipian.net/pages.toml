["https://phillipian.net/2024/10/24/giai-dieu-se-chia-the-repercussions-choi-nhac-vi-nguoi-dan-vung-bao"]
title = "Giai Điệu Sẻ Chia: The Repercussions Chơi Nhạc Vì Người Dân Vùng Bão – The Phillipian"
description = "Khi Florida đang dần hồi phục sau sự tàn phá của bão Helene và Milton, band nhạc jazz, “The Repercussions” của Phillips Academy Andover và Liên minh Bền vững Phillips Academy (PASC) đã biến tài năng của mình thành nguồn động viên cho những người bị ảnh hưởng bằng cách tổ chức một buổi hòa nhạc từ thiện. Buổi hòa nhạc này do Ethan Liu, một học sinh gốc Florida tốt nghiệp khóa 2026, tổ chức và mang ý nghĩa..."
full_description = "Khi Florida đang dần hồi phục sau sự tàn phá của bão Helene và Milton, band nhạc jazz, “The Repercussions” của Phillips Academy Andover và Liên minh Bền vững Phillips Academy (PASC) đã biến tài năng của mình thành nguồn động viên cho những người bị ảnh hưởng bằng cách tổ chức một buổi hòa nhạc từ thiện. Buổi hòa nhạc này do Ethan Liu, một học sinh gốc Florida tốt nghiệp khóa 2026, tổ chức và mang ý nghĩa đặc biệt với cậu ấy. Liu chia sẻ rằng cậu xem âm nhạc như một liều thuốc tinh thần và một công cụ để kêu gọi quyên góp cho nỗ lực khắc phục hậu quả thiên tai. “Sự kiện này là một buổi hòa nhạc gây quỹ để hỗ trợ những người bị ảnh hưởng sau cơn bão Helene và Milton. Những cơn bão này đã đổ bộ vào bang Florida, quê hương mình, và tàn phá khắp miền Nam nước Mỹ. Mình muốn dùng âm nhạc như một cầu nối, một cách để nâng cao nhận thức về vấn đề này và cũng như để gây quỹ cho Hội Chữ Thập Đỏ”, Liu nói. The Repercussions, band nhạc jazz do học sinh tự quản lý, là một cộng đồng gắn kết, dù luôn có sự thay đổi. Brandon Fu (tốt nghiệp khóa 2025) chia sẻ về những thay đổi của band nhạc trong thời gian bạn ấy ở Andover và cách họ duy trì hoạt động sôi nổi dù nhiều thành viên đã tốt nghiệp. Fu cũng kể về đóng góp của Liu cho buổi hòa nhạc và những kỳ vọng của bạn mình dành cho band nhạc. “Mình là đồng sáng lập của band nhạc này vào năm thứ hai, khoảng hai năm trước, cùng với một vài người bạn thân. Giờ thì gần như tất cả bọn họ đều đã tốt nghiệp cả rồi. Các thành viên ban đầu giờ đều đã mỗi người một ngả, nhưng mình vẫn duy trì band nhạc trong suốt hai năm qua. Ethan gia nhập năm ngoái, và cậu ấy thật sự rất tuyệt vời. Chính cậu ấy đã đề xuất ý tưởng tổ chức buổi hòa nhạc này, và chúng mình đã rất hào hứng. Mình rất vui vì chúng mình đã tạo nên sự khác biệt, dù là nhỏ bé, và mang đến một chút niềm vui cho mọi người”, Fu nói."
