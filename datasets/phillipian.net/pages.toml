["https://phillipian.net/2025/02/14/andover-dance-festival-celebrates-diversity-creativity-and-community"]
title = "Andover Dance Festival Celebrates Diversity, Creativity, and Community – The Phillipian"
description = "Held last Friday and Saturday, the Andover Dance Festival (ADF) brought together dancers from various groups across campus. From traditional Chinese Dunhuang dance to hip-hop routines, the show offered a diverse mix of performances that captivated the audience. Student choreographers were the backbone of the show, making the event a personal and meaningful experience for many. Julia Xu ’28, one performer in the Asian Performing Arts Club (APAC), described the festival as a meaningful opportunity to share a traditional Chinese..."
full_description = "Held last Friday and Saturday, the Andover Dance Festival (ADF) brought together dancers from various groups across campus. From traditional Chinese Dunhuang dance to hip-hop routines, the show offered a diverse mix of performances that captivated the audience. Student choreographers were the backbone of the show, making the event a personal and meaningful experience for many. Julia Xu ’28, one performer in the Asian Performing Arts Club (APAC), described the festival as a meaningful opportunity to share a traditional Chinese dance style with the rest of the Andover community. Having practiced since sixth grade, Xu was excited to showcase a style characterized by its precise and rhythmic movements. “There are different types of Chinese dance from different regions across China. And this type of dance is very specific to a region of China. I believe it’s in the western area, closer to Tibet. And it’s characterized by very sharp movements and a very specific hand shape,” said Xu. Xu continued, “I think this performance was different because it was almost fully self-choreographed by members of the group…we were trying to convey sort of a sense of mysteriousness and also fear, I guess through our facial expressions and also the sharper movements. Xu also highlighted the camaraderie and sense of community she experienced while preparing for the performance. She recalled rehearsals as being a fun and rewarding process, making many formidable bonds with others throughout the process. “The best part was probably getting to work with the other people in the group and we just had a lot of fun during rehearsals” shared Xu. “I think my favorite moment of the show was right before we went on stage for the second show. We sort of did a little huddle and some of the co-heads gave us a pep talk. And it was just a really nice moment before we went on stage and did that performance for the last time.” For many, ADF was just as much about the journey leading up to the performance as the show itself. Yumi Lai ’27, who performed in multiple groups—including Blue Strut, Hypnotiq, and Slam, as well as a solo—found the preparation challenging but made easier by the strong sense of team spirit."
