["https://phillipian.net/2025/02/21/fashion-through-the-ages-great-gatsby-themed-outfits-at-casino-night"]
title = "Fashion Through the Ages: Great Gatsby-Themed Outfits at Casino Night – The Phillipian"
description = "Last Saturday’s Casino Night inspired a variety of creative outfits, from vintage fedoras to smoking jackets and flapper headbands. This fundraiser encouraged students to channel the 1920s Great Gatsby theme with suits and gold accents; each look reflected their personal style, making the event a celebration of fashion.  Nick Lima ’25 “I wore a suit combination: a blazer and suit bottom. The beret [I wore] I got in a Dorset country store in Vermont. The sunglasses were from Costco, the..."
full_description = "Last Saturday’s Casino Night inspired a variety of creative outfits, from vintage fedoras to smoking jackets and flapper headbands. This fundraiser encouraged students to channel the 1920s Great Gatsby theme with suits and gold accents; each look reflected their personal style, making the event a celebration of fashion. Nick Lima ’25 “I wore a suit combination: a blazer and suit bottom. The beret [I wore] I got in a Dorset country store in Vermont. The sunglasses were from Costco, the tie from Hermes, shoes from Vans and I can’t remember where I got the cane from. The brains behind [this] operation were my stylistic advisors in the dorm. But, I’m just the face, and they are the brain, the machinery, [and] the muscle. I wanted to go for a little bit of James Bond, Casino Royale, the frontman from Squid Game, [mostly just] an amalgamation of those three. [I felt more] confident knowing that I was, with my stylistic advisor’s help, wearing indisputably the best outfit at Casino Night. It really affected my composure at the event.” “I saw the Great Gatsby theme, so I put on a suit and tossed on a little vest [and then] grabbed a fedora to top the outfit off. My inspiration was Leonardo De Caprio in The Great Gatsby. There are so many awesome outfits in that movie, but it was always the suit and vest [combination] that stuck out to me. The fedora is my dad’s. I’ve only seen him wear it a couple times, but I was like Casino Night, Great Gatsby theme, ’20s, might as well throw it on. I foraged a bit around in my closet and found a vest. Couldn’t find any suspenders or anything, but I’m lucky I found that fedora.” “I was wearing white shoes and a black mini skirt [and] a black tank top that had gold beading at the neckline. I also took one of the flapper headbands from downstairs and it matched my shirt. Since I saw the theme was Great Gatsby I wanted to [wear] a lot of black and gold and pearls because I thought they would match the theme best. The tank top [was actually] my friend’s, she thrifted it and it’s really vintage so I think it fits the vibe perfectly. Great Gatsby [reminded me of] short dresses and sparkles and stuff, [and] I wanted to keep going with the theme and accessorize accordingly.”"
