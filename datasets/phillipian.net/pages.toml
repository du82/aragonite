["https://phillipian.net/2024/09/14/andover-welcomes-24-new-teachers-for-the-2024-2025-school-year"]
title = "Andover Welcomes 24 New Teachers for the 2024-2025 School Year – The Phillipian"
description = "24 new faculty have joined Andover for the 2024-2025 school year. From coaching Varsity teams to living in the dorms with students, the new community members shared their excitement for the upcoming year as well as the unique benefits of working at Andover.  Many of these newcomers are a part of Andover’s Teaching Fellowship program, a program for those with little or no teaching experience. For one to two years, Teaching Fellows teach two classes a term and serve as..."
full_description = "24 new faculty have joined Andover for the 2024-2025 school year. From coaching Varsity teams to living in the dorms with students, the new community members shared their excitement for the upcoming year as well as the unique benefits of working at Andover. Many of these newcomers are a part of Andover’s Teaching Fellowship program, a program for those with little or no teaching experience. For one to two years, Teaching Fellows teach two classes a term and serve as House Counselors and coaches. They are also paired with an academic mentor, attend seminars, and meet with other teaching fellows to improve their pedagogical skills. Rachel Conley, Teaching Fellow in Chemistry, elaborated on the benefits of teaching fellows learning together as a cohort. “I have learned a tremendous amount about [the other teaching fellows], their teaching styles, and their leadership. It’s really nice to be a part of the Fellowship program because I have other fellows who are going through the exact same thing as me, despite [the fact that] they might be in Theater or English or different disciplines than I am. There is a commonality that we are all able to share and work together as one team, and that then transcends into how I teach,” said Conley. For many teachers, the arrival of new faculty brings new perspectives to their department. Marcelle Doheny, Instructor in History, noted how new faculty members’ diverse backgrounds often lead to novel developments in departmental teaching. “Some new faculty come here with a lot of teaching experience, and some people come new as teaching fellows, and they are both good because they refresh everything we know and they help us with new ideas because you can get stuck in your ways. What happens inside departments is we’re discussing courses and we’re discussing ideas. We certainly do [discuss] in the history department, so when we have new teachers come in… they come up with new ideas and new activities,” said Doheny. When asked about their favorite parts of Andover, new teachers highlighted Andover’s small class sizes and school spirit. Lorena Corbelli, Teaching Fellow in Biology, pointed out how teaching at Andover is a mutually beneficial experience."
author = "Aden Hwang, Niki Tavakoli"
