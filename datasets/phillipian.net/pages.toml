["https://phillipian.net/2025/02/21/lotw-sophie-tung-25-styles-streetwear-with-theatrical-elements"]
title = "LOTW: Sophie Tung ’25 Styles Streetwear With Theatrical Elements – The Phillipian"
description = "Donning a graphic purple long-sleeve top from Marc Jacobs’ Heaven collection, Sophie Tung ’25 styles her outfit with a set of chunky necklaces, a pleated white skirt, and thrifted heels. With a purposefully bold silhouette, the long sleeves paired with the pronounced square shoulders surround the outfit with a theatrical flair. Growing up, Tung attended a school with required uniforms, causing her to have little control over her day-to-day style. When she arrived at Andover, Tung found her chance to..."
full_description = "Donning a graphic purple long-sleeve top from Marc Jacobs’ Heaven collection, Sophie Tung ’25 styles her outfit with a set of chunky necklaces, a pleated white skirt, and thrifted heels. With a purposefully bold silhouette, the long sleeves paired with the pronounced square shoulders surround the outfit with a theatrical flair. Growing up, Tung attended a school with required uniforms, causing her to have little control over her day-to-day style. When she arrived at Andover, Tung found her chance to use fashion as a creative outlet, experimenting with bolder stylistic habits and shaping her personal aesthetic. Tung’s style is defined by bold colors and a distinctly Y2K influence, stemming from her mom’s fashion magazines. “I went to a school in Hong Kong that required us to wear school uniforms. There wasn’t a lot of freedom in that. When I got to Andover, I realized that there’s no dress code. I started to like be bolder in terms of expressing myself through style. I’ve been recently leaning towards very vibrant colors. I really like wearing one very sharp color and then paired with other very dull colors. I draw inspiration from my mom’s vintage Japanese fashion magazines. I feel like most of the stuff there is Y2K, so that is like a huge inspiration for the way I dress,” said Tung. A creative way Tung puts her outfits together is through a digital wardrobe program, inspired by the film, “Clueless.” Through having a digital archive of all of her clothing pieces, Tung is able to envision different combinations and create an efficient system of visualizing outfits. Besides this program, Tung reflects her mood and the energy she wishes to give off through her fashion. “In summer, I coded a program that has basically photos of all my clothes. It’s actually inspired by the digital wardrobe in ‘Clueless.’ I coded this system that lets you choose my outfits every day. When I’m feeling really down, I would definitely wear a lot of darker colors. When I’m feeling like I wanna be a little bit more intimidating because I’m not an intimidating person, I can only express that through my outfits,” said Tung."
