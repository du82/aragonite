["https://phillipian.net/2025/02/14/serafina-shin-von-nordenflycht-brings-ride-the-cyclone-to-the-stage"]
title = 'Serafina Shin-von Nordenflycht Brings "Ride the Cyclone" to the Stage – The Phillipian'
description = "This winter, student director Serafina Shin-Von Nordenflycht ‘25 is bringing the dark and humorous musical Ride the Cyclone to life as a part of the THD901 course. The musical is haunting yet quirky, following six high school students who recount their stories, fighting for a second chance after dying in a roller coaster tragedy, landing in limbo. For Shin-Von Nordenflycht, this production is a passionate endeavor as she hopes to fill the role of her past mentors. “In my freshman..."
full_description = "This winter, student director Serafina Shin-Von Nordenflycht ‘25 is bringing the dark and humorous musical Ride the Cyclone to life as a part of the THD901 course. The musical is haunting yet quirky, following six high school students who recount their stories, fighting for a second chance after dying in a roller coaster tragedy, landing in limbo. For Shin-Von Nordenflycht, this production is a passionate endeavor as she hopes to fill the role of her past mentors. “In my freshman year, I did a 901. I was in a 901 called ‘Girls Like That,’ and it was with the lovely director Kate Horton. She’s one of my mentors from the school. She was a senior when I was a freshman here, and she was a great director… I was like, ‘I want to be able to be that person for someone.’ I want to be the director that can take something that’s heavy–and not that heavy, I love fun things, and so I picked a more fun show. But I want to be able to bring that for people to see. And so it’s like, Andover when I’ve had role models are so important, because once I pick my role model, it makes me feel that I can reach that standard and that level.” Said Shin-Von Nordenflycht Stepping into the role of director, Shin-Von Nordenflycht reflected on her experience as a student producer working on a musical focused on teenage lives and voices. This has taken shape in her directive choices, as she expressed a deeper meaning behind her decisions, and their attachment to her personal identity. “I think the important part about being a director is having a unified idea of the show. There’s a lot of carnival themes in my show, as well as masquerade masks, and that comes from me being a student, right? It’s this idea that we put fronts up for other people, and we wear masks all the time. And constantly, I am switching my personality or switching the parts of me that I wanna share with people and the parts of me that I don’t, and I think that’s a lot of what this show is about, is about what you hide from people in life will follow you into death, and can you just live your life as you want to live it?” said Shin-von Nordenflycht."
