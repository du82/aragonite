["https://phillipian.net/2025/02/28/boys-hockey-beats-brooks-pingree-and-nmh-to-carry-a-three-game-win-streak-into-its-game-against-exeter"]
title = "Boys Hockey Beats Brooks, Pingree, and NMH, to Carry a Three Game Win Streak into its Game Against Exeter – The Phillipian"
description = "2/21 – Andover: 3, Brooks: 1 2/22 – Andover: 3, Pingree: 2 2/26 – Andover: 5, NMH: 1 Boys Hockey (16-9-3) has bounced back from last Wednesday’s tough overtime loss with three straight wins. The streak began with a 3-1 victory over Brooks on Senior Night, followed by a hard-fought 3-2 overtime win against Pingree. A dominant 5-1 road win against Northfield Mount Hermon (NMH) added to the team’s momentum, which they aim to carry into Saturday’s matchup at Phillips..."
full_description = "Boys Hockey (16-9-3) has bounced back from last Wednesday’s tough overtime loss with three straight wins. The streak began with a 3-1 victory over Brooks on Senior Night, followed by a hard-fought 3-2 overtime win against Pingree. A dominant 5-1 road win against Northfield Mount Hermon (NMH) added to the team’s momentum, which they aim to carry into Saturday’s matchup at Phillips Exeter Academy (Exeter). Tyler Miocevich ’26 reflected on the team’s mindset heading into the Brooks game after the loss against Cushing last Wednesday. He emphasized that preparation had been key to beating Brooks in regulation and Pingree in overtime. “We were reeling from our loss on Wednesday, which was a tough overtime loss. We [came] into the games knowing that they were must win games, and we had to come out of the weekend with those under our belt. The preparation towards the games reflected that. Leading into the games, we were super prepared and focused for the task of getting two wins,” said Miocevich. “They were both within a couple goals throughout the whole game so it was a lot of back-and-forth play, not getting too high when we would score, [and] not getting too low when they would score.” The game against NMH on Wednesday was much more one-sided, as Boys Hockey rolled to a 5-1 victory. Danny Collins PG ’25 played a key role with a two-point night. Kieran McIntosh ’27 also praised co-captain Peyton Militello ’25, who just recovered from Norovirus, and broke down four of the goals in the high-scoring game. “First goal, nice shot from the point by number nine, Chas Sabre [’25], Danny Collins, in the dirty area, tipped it in, took it home, first goal. Second goal, of course, Danny Collins again, pass to Alex Small [’26]. [He] dekes the goalie, goes around, shoots off the back of the goalie, in the net. Bing, bang, boom, that’s two. Third goal, a beauty scored in front of the net. Nathan Kreppner [’27] to Alex Theodore [’27]. Alex Theodore does as he does. Greasy tucks in front of the net. And fifth goal, Grayden Robertson Palmer [’25]. Empty net merchant just tucked an empty netter,” said McIntosh."
