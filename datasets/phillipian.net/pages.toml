["https://phillipian.net/2025/02/04/ivy-randalls-upcoming-directorial-debut-chicago"]
title = "Ivy Randall’s Upcoming Directorial Debut: “Chicago” – The Phillipian"
description = "This term, Ivy Randall took on the exciting challenge of leading her own THD901 project, a student-run theater production, choosing to direct the musical Chicago. Rehearsing throughout the winter term, she led a selected group of students in preparation for their culminating performance on March 2nd.  With a background in both dance and theater, Randall always wanted to direct a student performance. Randall shared that by selecting Chicago, a musical involving various dance sequences, she could combine both of her..."
full_description = "This term, Ivy Randall took on the exciting challenge of leading her own THD901 project, a student-run theater production, choosing to direct the musical Chicago. Rehearsing throughout the winter term, she led a selected group of students in preparation for their culminating performance on March 2nd. With a background in both dance and theater, Randall always wanted to direct a student performance. Randall shared that by selecting Chicago, a musical involving various dance sequences, she could combine both of her passions. “I [always] knew I wanted to do a musical that I could incorporate some dance [into] since I’ve always wanted to do a 902 and a 901. So by doing a musical, a really dance-heavy musical, it was kind of like doing both. I think that was my main factor…I was also just keeping in mind the people that I thought I might want to cast and, like, all the dancers I have,” said Randall ‘25. Andover’s department musicals typically involve a director, a music director, a choreographer, and a costume designer. Randall, however, has had to juggle all of these responsibilities. Her primary duty has been encouraging her students to find joy throughout the process. “Cast morale is probably my biggest job. My job as a director is to put on a good show. For me personally, one of my biggest goals is to also make sure that everybody is having fun with it. And in a way, I think that a good show comes from a cast that’s having fun and enjoying themselves. Because when people actually want to put in the work, you get a better show”, says Randall. One of the actors in Randall’s 901, Estelle McClory ‘28, testified to the sense of belonging that Randall fostered in the cast, and how she has stepped out of her comfort zone. From Chicago, McClory has learned to put in effort and have confidence on stage. “The biggest lesson I’ve learned so far is, sometimes you just kind of have to go out there and do your best, even if it isn’t great, you’ve got to learn how to not be afraid of making mistakes. [The biggest challenge has been] kind of getting out of my comfort zone and trying to put my all into all the work, like the dances and stuff, kind of a lot, but I really like Ivy’s directing style. She makes everyone feel like they belong, and it’s just like a nice feeling,” says McClory ‘28."
author = "Anna Tsetkov, Nina Torrens"
