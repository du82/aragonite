["https://phillipian.net/2024/05/03/girls-tennis-co-captain-lena-ciganer-albeniz-24-works-to-engage-and-excite-teammates"]
title = "Girls Tennis Co-Captain Lena Ciganer-Albeniz ’24 Works to Engage and Excite Teammates – The Phillipian"
description = "Co-Captain Lena Ciganer-Albeniz ’24 leads Girls Tennis as a teammate above all else, prioritizing her teammates’ well-being. As a leader, Ciganer-Albeniz takes initiative, organizing team bonding events off of the court, as well as constantly providing support, urging her teammates to do the same for each other. According to Ciganer-Albeniz, tennis players often try other sports and come back to tennis because they like it best. She shared that the reason why she returns to tennis is because of the..."
full_description = "Co-Captain Lena Ciganer-Albeniz ’24 leads Girls Tennis as a teammate above all else, prioritizing her teammates’ well-being. As a leader, Ciganer-Albeniz takes initiative, organizing team bonding events off of the court, as well as constantly providing support, urging her teammates to do the same for each other. According to Ciganer-Albeniz, tennis players often try other sports and come back to tennis because they like it best. She shared that the reason why she returns to tennis is because of the many aspects that go into being a successful player. “I would say it’s such a unique game. There’s really no other sport quite like it, and I feel like there’s just so much that goes into it, because you have to be insanely athletic, but also, you need good reaction. You need good technique. You need a strong mentality. There’s just so many aspects that go into it. It’s just different than, say, with soccer, for example, there is a lot of technique involved, but mostly the goal is to score. Whereas with tennis, you probably have a different goal every point, every game, and every point is so different in how you do it and its outcome,” said Ciganer-Albeniz. On the court, Ciganer-Albeniz is a strong competitor with a tough mentality, according to Mercan Draman ’26. Draman also noted that Ciganer-Albeniz constantly pushes her teammates to be the best they can be. Draman said, “She’s a really good captain. She’s pretty competitive. She always goes all out for game psyches… She’s competitive but also very sweet to us, like she forces us to be our best player… She’s very into tennis. She’ll train no matter what. Even if she’s tired, she’ll still grind really hard at practice.” In addition to her skills on court, Evelyn Kung ’26 also pointed out the strong team bond that Ciganer-Albeniz creates off the court, urging her teammates to show up for each other. “As a player, she’s definitely one of the strongest players on the team. That’s for sure. She has such great tennis skill, and she’s really good at supporting others. She and her doubles partner have a really great dynamic. And she’s a really great tennis player… She’s always on time to practice. She comes up with fun ideas for warm-ups. Like I said, she initiates team brunches and makes sure that we all show up to support our teammates. For instance, one of my teammates, [Kendra Tomala ’26], was doing the TEDx Talk this weekend and she, [Lena], was on top of it, making sure that we were all gonna be there to support her, so she’s a really great person on and off the court,” said Kung."
