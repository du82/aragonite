["https://phillipian.net/2025/01/31/senior-soloist-concert-resounding-final-notes"]
title = "Senior Soloist Concert: Resounding Final Notes – The Phillipian"
description = "Last Friday, Emily Wu ’25, Ellie Sun ’25, and Brandon Fu ’25 performed at the Senior Soloist Concert hosted in the newly-opened John Barry Hall at Falls Music Center. Wu performed various vocal tunes: “Skylark,” a jazz standard; “Little Blue,” a pop song; and “Stone or Lavender,” an R&B and Soul song. Sun performed Édouard Lalo’s Symphonie Espagnole, a violin concerto. Finally, Fu performed Carl Maria Von Weber’s Clarinet Concerto No. 2. This concert celebrated each soloists’ work following the..."
full_description = "Last Friday, Emily Wu ’25, Ellie Sun ’25, and Brandon Fu ’25 performed at the Senior Soloist Concert hosted in the newly-opened John Barry Hall at Falls Music Center. Wu performed various vocal tunes: “Skylark,” a jazz standard; “Little Blue,” a pop song; and “Stone or Lavender,” an R&B and Soul song. Sun performed Édouard Lalo’s Symphonie Espagnole, a violin concerto. Finally, Fu performed Carl Maria Von Weber’s Clarinet Concerto No. 2. This concert celebrated each soloists’ work following the senior soloist competition earlier this school year on September 25. Wu, versatile in a wide array of instruments and music genres, was satisfied with her performance, highlighting how this opportunity enabled her to show others her talent. She explained that despite her love for it, not many people have heard her singing, especially solo. Wu used this opportunity to show a new side of herself. “The concert went really well — I had a lot of fun. For a lot of people, it was the first time they’ve heard me sing or heard me sing in a solo context, so I’m really glad that they got to watch me. I did feel a little underprepared because of the time restraint. But otherwise, I think the feedback was great and everyone had a lot of fun. It was great,” said Wu. A violinist in the Academy Symphony and Chamber Orchestra and a percussionist in drumline, Sun highlights the strong relationships she has built at Andover through the music department. Sun first learned her repertoire in ninth grade after hearing her sister play the piece before her. In her senior year, she reviewed the piece and prepared it for the concert. “My sister also plays the violin, and I feel like the violin is a shared thing we both have. It feels very normal in our family to be both playing violin. When she plays a piece, it gets stuck in my head. A lot of the times I’m singing pieces that I never played. So for Lalo, it’s a piece that I heard her playing. And I thought that it was a really cool piece; that made me want to play it,” said Sun."
author = "Aden Hwang, Daniel Liu"
