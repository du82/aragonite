["https://phillipian.net/2025/02/28/black-people-got-talent-24-25-celebrating-black-creativity-at-andover"]
title = "Black People Got Talent 24-25: Celebrating Black Creativity at Andover – The Phillipian"
description = "Black creativity took center stage on February 21 as AfLatAm, the Black Student Union (BSU), and the African Student Association (ASA) hosted Black People Got Talent. Students packed Susie’s to support a diverse range of acts, including music, dance, and comedy. As part of Black History Month celebrations, the showcase provided an opportunity for students to celebrate Black culture in a joyful and supportive environment. Black People Got Talent was hosted by Maddie Redmond ’25 and Jaceil Britton ’25, who..."
full_description = "Black creativity took center stage on February 21 as AfLatAm, the Black Student Union (BSU), and the African Student Association (ASA) hosted Black People Got Talent. Students packed Susie’s to support a diverse range of acts, including music, dance, and comedy. As part of Black History Month celebrations, the showcase provided an opportunity for students to celebrate Black culture in a joyful and supportive environment. Black People Got Talent was hosted by Maddie Redmond ’25 and Jaceil Britton ’25, who kept the energy high all night with their lighthearted humor, improvised bits, and even musical moments. “Jaceil and I started prepping about a week before. We thought of our theme, which was ‘Try to Work Harder’, and picked a song to come out to. But as we tend to do, we wrote our rap minutes before the talent show started. We chose the beat and everything very quickly, which helped us get into that creative flow rather than planning too far in advance. Overall, it took about a week to plan everything” Redmond shared. Over the years, Redmond and Britton have established themselves as a classic MC duo on campus. This was their second year hosting Black People Got Talent, and the pair returned to the stage eager to have a good time and help showcase the diverse talents of Black students. Redmond continued, “It was great to get the crowd’s energy going. That’s my favorite part of being an MC [is] seeing how the crowd reacts and getting everybody involved. Any crowd interactions that night were really fun. The talent was amazing this year. The den was packed with so many people, and it was a great showing. I’m a little sad I won’t get to go to another one.” Bailey Jean-Pierre ’26, a member of a singing group “Tall, Dark, and Handsome”, decided to step outside of his comfort zone, and participate in this celebration of Black community. The preparation process included frequent rehearsals in Falls Music Center. “Honestly, we just thought it would be a fun experience. [Papa Paintsil ’26] called me two weeks ago and said, ‘Hey, there’s this one part I think you’d be good at. What do you think?’ I was interested and decided to see what it was about. We started practicing a little, and I liked the song and the rhythm, so we went for it.”"
author = "Nate Darocha, Tayla Stempson"
