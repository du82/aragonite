title = "GV Tennis Showcases Two More Dominant Performances – The Phillipian"
description = "4/27 – Andover: 8, Exeter: 1 4/29 – Andover: 9, BB&N: 0 (?) GV Tennis kept up its strong season with two dominant wins over Phillips Exeter Academy (Exeter) and BB&N this week. With the NEPSAC tournament coming up, the team looks to maintain their excellent form. Co-Captain Lena Ciganer-Albeniz ’25 observed that the team had limited time to prepare for their match against Exeter. Despite the time constraints, they continued to focus on maintaining their fitness and improving their..."
full_description = "GV Tennis kept up its strong season with two dominant wins over Phillips Exeter Academy (Exeter) and BB&N this week. With the NEPSAC tournament coming up, the team looks to maintain their excellent form. Co-Captain Lena Ciganer-Albeniz ’25 observed that the team had limited time to prepare for their match against Exeter. Despite the time constraints, they continued to focus on maintaining their fitness and improving their doubles play and consistency leading up to the game. “We had Deerfield on Wednesday, so we took Thursday off and Friday we did some very light hitting. So, honestly, we were just working on staying in shape and we did some doubles work, but nothing in particular,” said Ciganer-Albeniz. During the games, Ciganer-Albeniz valued the strong team spirit and effort displayed by all players, whether they were on the field or not. She felt this camaraderie boosted each player’s confidence, leading them to play more aggressively. Ciganer-Albeniz said, “I think the team did very well in maintaining a very positive attitude throughout all the matches. The players that didn’t have matches, because they only brought six players, they were cheering their teammates on. I mean, we were approaching the net a lot and playing aggressively, so we were kind of dominating, in a way.” Despite dealing with an injury, Mira Phan ’27 courageously persevered through her matches, as noted by Evelyn Kung ’26. Kung expressed admiration for Phan’s unwavering determination and resilience, highlighting how Phan continued to compete in the face of adversity. Kung said, “I was really proud of my teammate Mira Phan. She played really well in doubles, but she has tennis elbow right now, so her injury was sort of getting to her at the end of the match. The Exeter coach was kind of being a little difficult and not letting us swap out players once we had locked in our roster, so she had to play through the injury, and even though she didn’t finish her match, I’m still really proud of her for working through her injury.”"
