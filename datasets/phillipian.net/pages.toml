["https://phillipian.net/2025/02/28/decking-the-john-barry-hall-with-three-musical-performances"]
title = "Decking the John Barry Hall with Three Musical Performances – The Phillipian"
description = "Over the weekend, Falls Music Center became the stage for three performances from the Music Department’s ensembles and programs: the Academy Bands, the Chamber Music Society, and the Jazz Band. These performances not only demonstrated the talent of student-musicians but also signaled the music building’s potential to shape future musical endeavors. On Friday, the Academy Bands Concert featured performances from the Tuesday Band led by Peter Cirelli and the Thursday Band led by Ray Daniels. As the director, Daniels explained..."
full_description = "Over the weekend, Falls Music Center became the stage for three performances from the Music Department’s ensembles and programs: the Academy Bands, the Chamber Music Society, and the Jazz Band. These performances not only demonstrated the talent of student-musicians but also signaled the music building’s potential to shape future musical endeavors. On Friday, the Academy Bands Concert featured performances from the Tuesday Band led by Peter Cirelli and the Thursday Band led by Ray Daniels. As the director, Daniels explained the inspirations behind the chosen pieces and the atmosphere at the concert. “It’s February [and] it’s Black History Month, and I did want to do something, and this piece “Of Our New Day Begun” was the choice. This music was not easy, and that’s partly the reason we played it. I thought the ensemble did an amazing job. The energy was there. The audience really received it well and I feel like [we did] all of my goals of being an artist, an educator, and serving my audience,” said Daniels. Brandon Fu ’25, the principal clarinetist of Thursday Band, reflected on the group’s first performance in the new building, detailing the preparation and rehearsal process. “We clicked as a unit. It was a really strong performance and overall very enjoyable. It’s also the first large music department ensemble performance in Falls, which was a phenomenal experience. We have about seven or eight rehearsals per term, and we just play music for an hour and a half. We volunteer to do it at the beginning of the year, and it’s just something that we love to do as a group,” said Fu. On Saturday, the Andover Chamber Society hosted two performances featuring the variety of small ensembles that have been working together for the last term. Holly Barnes, the director of the program, discussed the range in genres and styles demonstrated in the performances. “When I choose repertoire, I choose something that will challenge the players, but also something they can accomplish in eight weeks, because that’s how many coachings they get. And then I try to think about the program, to have very different genres, so it was good to have some contemporary music, which we had at this concert, so we’re not listening to all the same composers. Everybody was really well-prepared, and it was great,” said Barnes."
author = "Matthew Wei, Chalize Sow"
