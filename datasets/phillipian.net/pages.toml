["https://phillipian.net/2024/11/08/abbot-fund-to-not-endorse-new-clubs"]
title = "Abbot Fund to Not Endorse New Clubs – The Phillipian"
description = "The Abbot Academy Fund (AAF) has recently updated its guidelines to align with new school policies, specifically excluding new clubs from receiving Abbot Grants funding. According to Marcelle Doheny, Community Liaison of the Abbot Academy Fund, the 2024 Fall Term has seen a significant number of grant applications aimed at supporting established club activities, while new clubs are advised to seek alternative funding sources.  To ensure that the awarded money is put to good use, applicants must go into thorough..."
full_description = "The Abbot Academy Fund (AAF) has recently updated its guidelines to align with new school policies, specifically excluding new clubs from receiving Abbot Grants funding. According to Marcelle Doheny, Community Liaison of the Abbot Academy Fund, the 2024 Fall Term has seen a significant number of grant applications aimed at supporting established club activities, while new clubs are advised to seek alternative funding sources. To ensure that the awarded money is put to good use, applicants must go into thorough detail about their mission on campus and why their project is financially sustainable. Doheny explained why adjustments were made to the AAF’s guidelines. “The Abbots stay in line with any changes the school makes. We have lots of club-related grants this fall, but they need to be for existing clubs not to start a club. Existing clubs can apply for grants, but the Abbots do not fund a particular club year after year. Any application needs to meet the goals of the Abbot Academy Fund. They care about creativity and innovation that cares for the needs of the school community and tries to enhance the school’s mission,” wrote Doheny in an email to The Phillipian. The updated guidelines reflect a broader emphasis on sustainable impact, guiding the AAF toward projects that demonstrate long-term viability within the school community. By prioritizing established clubs, the fund aims to support initiatives with a proven ability to endure beyond initial financial backing. Christopher Capano, Director of the Student Activities Office, elaborated on the decision and spoke on possible exceptions to the new rule. “The idea of getting an Abbot Grant to start a club didn’t seem to make sense, because we want the club to be sustainable. [However], some clubs, like I believe F-Stop has a magazine, wanted enough Abbot funding to make their first issue, and then they would make enough money to keep making the magazine by selling it after the fact. They needed that start-up money, I would call it, and then they’d keep doing it. That’s something that Abbot would do,” said Capano."
