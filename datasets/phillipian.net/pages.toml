["https://phillipian.net/2025/01/24/boys-swimming-captain-daniel-seong-25-breaking-records-and-building-bonds"]
title = "Boys Swimming Captain Daniel Seong ’25: Breaking Records and Building Bonds – The Phillipian"
description = "Boys Swimming Captain Daniel Seong ’25 began his swimming career during a YMCA summer camp at the age of seven, overcoming his fear of water. He ultimately fell in love with the sport after partaking in the YMCA Championships when he was ten. At Andover, besides his impressive strides in creating a strong team dynamic amongst Boys Swimming, he holds the school and pool record for the 100-Yard Breaststroke at 55.35 seconds.  As Captain, Seong maintains an open and friendly..."
full_description = "Boys Swimming Captain Daniel Seong ’25 began his swimming career during a YMCA summer camp at the age of seven, overcoming his fear of water. He ultimately fell in love with the sport after partaking in the YMCA Championships when he was ten. At Andover, besides his impressive strides in creating a strong team dynamic amongst Boys Swimming, he holds the school and pool record for the 100-Yard Breaststroke at 55.35 seconds. As Captain, Seong maintains an open and friendly character, answering any questions and readily accepting feedback, crafting strong connections with his fellow teammates. “My philosophy for captaining is to build close relationships with everyone on the team. I don’t want to make this mantle of being Captain make people feel intimidated by me or anything and feel scared. I want to be a captain who could be anyone’s friend, even if I’ve swam with them since Junior year, or whether they’re joining the team for the first time as a Junior this year. Someone that people can feel comfortable talking to and look for advice, not some intimidating Senior figure that they should try to avoid and be scared of,” said Seong. Seong also sets a high standard for the team, refining the smallest details and hoping to maximize the potential of a talented program. “For communicating, on the same line of thought, I’m really open with everyone and genuine and receptive if anyone wants to talk about anything. But I also do try to keep some things in order because I think this year, from what Coach [David] Fox said, it is the strongest team in our school history. So, we just want to keep up that legacy of the team and that requires people to keep focused on the little things, to make sure that we can do our best at the championship meet. So, I try to emphasize those small things, even though it can be hard throughout the season,” said Seong. Haoyu Zhang ’27 appreciates Seong’s commitment to meaningful relationships with all members of the program, new or returning. Specifically, Zhang noted Seong’s efforts in helping new members of the team feel at ease and welcomed."
author = "Aaron Huang"
