["https://phillipian.net/2024/05/24/sports-betting-is-a-booming-disaster"]
title = "Sports Betting Is a Booming Disaster – The Phillipian"
description = "In a world that is becoming increasingly digital, it is not surprising that the realm of sports betting has surged to develop in that direction. With the nationwide legalization of sports betting in 2018 almost six years in the past, hundreds of betting companies like DraftKings and FanDuels have developed fast-paced, easy-to-navigate betting applications that are only an arm’s length and a few screen taps away. The profitable and accelerating industry has generated a 10.9 billion dollar profit in 2023,..."
full_description = "In a world that is becoming increasingly digital, it is not surprising that the realm of sports betting has surged to develop in that direction. With the nationwide legalization of sports betting in 2018 almost six years in the past, hundreds of betting companies like DraftKings and FanDuels have developed fast-paced, easy-to-navigate betting applications that are only an arm’s length and a few screen taps away. The profitable and accelerating industry has generated a 10.9 billion dollar profit in 2023, a rise of almost 45 percent from 2022. Also, consider this: in 2018, just over one percent of the U.S. population had access to legal sportsbooks. Now far more than half of Americans can participate in legal sports betting. Sports betting has truly grasped a foothold within the daily lives of tens of millions of Americans. However, with growth comes issues. The main problem with the current framework of sports betting is how fast, easy, and deceiving it is. When people participate in a digitalized form of sports betting, they play a game that significantly reduces the delay between risk and reward in comparison to in real life betting, so they end up increasing their speed and frequency of wagers. Moreover, many sports bettors believe that sports betting is becoming increasingly more controllable because they have access to a lot of information and think that their own expertise and skills can win over chance. This double whammy tends to lead to unfortunate results, with overconfident players dumping and ultimately losing money at a rapid pace. There is also an issue with how frequent and mass-produced sports betting advertisements have become. Unfortunately, it is not uncommon for an unskippable DraftKings advertisement to pop up when someone is casually enjoying YouTube videos about sports. Not only does this highlight the exposure sports betting may generate for those under the age of 21 but also how prominent and interconnected sports betting is with sports. Indeed, a vast majority of sports franchises and industries have turned from anti-gambling to near-full support of it."
author = "Aaron Huang"
year_published = 2024
year_updated = 2024
