["https://phillipian.net/2024/02/23/boys-basketball-co-captain-isaiah-harris-24-brings-spirit-and-work-ethic-to-the-team"]
title = "Boys Basketball Co-Captain Isaiah Harris ’24 Brings Spirit and Work Ethic to the Team – The Phillipian"
description = "Boys Basketball Co-Captain Isaiah Harris ’24 prioritizes becoming a role model for his younger teammates and instilling his love for the sport in others. With his upbeat energy and dedication, Harris shaped the close-knit team dynamic and consistent drive for success. Harris shared the transition he has made from leading by example to assuming a stronger voice on the team. His goal is to bring spirit to Boys Basketball. Harris said, “I’d say in the past I was more of..."
full_description = "Boys Basketball Co-Captain Isaiah Harris ’24 prioritizes becoming a role model for his younger teammates and instilling his love for the sport in others. With his upbeat energy and dedication, Harris shaped the close-knit team dynamic and consistent drive for success. Harris shared the transition he has made from leading by example to assuming a stronger voice on the team. His goal is to bring spirit to Boys Basketball. Harris said, “I’d say in the past I was more of a lead by example type of person, but I’d say, in the last couple years, I’m more of a vocal person trying to get the team going.” As a Co-Captain, Harris builds team chemistry through humor, while helping create and maintain a collectively ambitious mindset for the team. “I like to joke with the guys, make sure we have that camaraderie, and at the same time, just keep that competitive edge and make sure we’re all doing what we’re supposed to do,” said Harris. Cade Rutkoske ’26 described Harris as a role model, highlighting his leadership, especially amongst the younger players. He also commended Harris for his work ethic while battling an injury. “I think he’s a great role model for people on the team, especially for the younger guys who look up to the seniors and look up to the captain. I think that’s one way he leads the team, and he’s obviously a hard worker. Earlier in the season he was going through [physical therapy] a lot to try to get healthy for the season, so his work ethic is also inspirational.” said Rutkoske. Fellow Co-Captain Robbie Nyamwaya ’24 describes the brotherly relationship he has with Harris. The idea of finding family within the team significantly boosts the team dynamic during a game. “I would say we are all brothers before teammates, so our chemistry is unmatched. We have all played with each other for a bit, so we understand how we play,” said Nyamwaya. Harris believes his persistence on the basketball court speaks to his attitude of always striving to get better and push for a better self."
