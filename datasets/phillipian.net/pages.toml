["https://phillipian.net/2025/01/17/academy-symphony-orchestra-collaborates-with-cornell-university-orchestra-in-joint-rehearsal"]
title = "Academy Symphony Orchestra Collaborates with Cornell University Orchestra in Joint Rehearsal – The Phillipian"
description = "On Monday, the Phillips Academy Symphony Orchestra collaborated with Cornell University’s Orchestra, performing repertoire for each other and then partnering up for a joint rehearsal of around 150 total students in the recently-opened concert hall in Falls Music Center. The students from Cornell’s orchestra visited Andover as a part of their Boston tour, marking the start of touring again after being shut down for the past few years. Derek Jacoby, Conductor of the Phillips Academy Symphony Orchestra and Instructor..."
full_description = "On Monday, the Phillips Academy Symphony Orchestra collaborated with Cornell University’s Orchestra, performing repertoire for each other and then partnering up for a joint rehearsal of around 150 total students in the recently-opened concert hall in Falls Music Center. The students from Cornell’s orchestra visited Andover as a part of their Boston tour, marking the start of touring again after being shut down for the past few years. Derek Jacoby, Conductor of the Phillips Academy Symphony Orchestra and Instructor in Music, explained the process of organizing this collaboration. As Cornell searched for collaborations around the Boston area, they found Andover to fit their needs. “When they contacted us originally, they were putting together their tour. They were trying to think about things that would work well for them, and they watched a Boston Symphony concert and had master classes with some Boston Symphony musicians. And so they were looking at schools in the area that seemed to match the profile of Cornell. They wrote [to us] and asked if we’d be interested in doing anything [with them],” said Jacoby. The preparation for the large rehearsal required logistical planning from both schools. From setting up rehearsal spaces to coordinating the schedule, Jacoby emphasized the different personnel and efforts that went into the collaboration. Considering how recently Falls Music Center was opened, using the new concert hall for the event took careful preparation. “[The Office of Physical Plant] and the custodial staff were hugely helpful [in] making a lot of the things possible. They gave a lot of support. The custodians, electricians, and [the] people who had built the building, everybody came together to make the logistics for it work. It was challenging to use the concert hall in a way that it hadn’t been used yet for the first time, which is a way that it was designed to be used and capable of, but everything was new, so everything was a process of making sure this works, figuring out how to get it to happen and then and then making it happen,” said Jacoby."
