["https://phillipian.net/2025/01/31/all-black-for-the-night-bassment-outfit-spread"]
title = "All-Black for the Night: Bassment Outfit Spread – The Phillipian"
description = "Last Saturday night, The Andover Edition organized the elaborate Bassment dance with a simple dress code: all-black attire. Students incorporated personal style with the theme. Some chose timeless basics, pairing versatile pieces with a classic black jean, while others experimented with silhouettes and playful accessories. Each look displays students’ individuality and ability to curate an outfit. Julia Song ’26 “I wore black Miss Me jeans, a Diesel belt, and a lace baby-doll top. There are so many options for a..."
full_description = "Last Saturday night, The Andover Edition organized the elaborate Bassment dance with a simple dress code: all-black attire. Students incorporated personal style with the theme. Some chose timeless basics, pairing versatile pieces with a classic black jean, while others experimented with silhouettes and playful accessories. Each look displays students’ individuality and ability to curate an outfit. “I wore black Miss Me jeans, a Diesel belt, and a lace baby-doll top. There are so many options for a cool outfit out there, but when there’s a boundary placed on it, like the all-black theme, I actually find that you’re able to come up with even more creative ideas that are outside of the box. For me, textures are something I experiment with, and different fabrics such as the contrast of lace and denim, and the contrast between gold jewelry and black. I think it’s really fun to go to Bassment and see how people interpreted the theme.” “I wore Chentaitai pants I borrowed from my friend, a Miu Miu top from my mom, and Doc [Martens]. I’m on the Andover Edition board so I wanted something comfortable since I would be there a while to help set up the dance and man the photo booth. Since we’re a magazine and we offer photoshoots, adding a theme to the dance was a way to make the dance more chic.” “I wore this Aritzia Contour Line tube top [that] I got from my roommate… for my bottoms, I wore this skirt from Edikted and I wear it to everything. It’s just a basic black mini skirt, it’s really easy to adjust and it’s a good material and comfortable. Something unique about my outfit was my jewelry. I like to wear the same necklace every day, and mine… has an E on it for Emily. And then for my earrings, I just got these new earrings for Christmas and they were these big hoop earrings and even though they were big hoops they weren’t uncomfortable or anything.” “I wore this pair of dark, almost between a blue and a gray, 901 90s style from Levi’s. They were really comfortable, and I usually wear those jeans to dances. Then I wore my black Malibu Sugar tank top… I knew I wanted to be comfortable since Bassment usually gets pretty crowded. I didn’t want to wear a top that’s too delicate, especially because of the moshing at Andover… Since my outfit itself wasn’t that interesting I paired it with fun accessories.”"
