["https://phillipian.net/2025/01/17/team-first-boys-squash-co-captain-will-weissman-25-focuses-on-building-community-within-seemingly-individual-sport"]
title = "Team First: Boys Squash Co-Captain Will Weissman ’25 Focuses on Building Community Within Seemingly Individual Sport – The Phillipian"
description = "Although squash matches are played individually, each result affects the team’s score. Boys Squash Co-Captain Will Weissman ’25’s continued involvement in squash stems from his appreciation for this team aspect and the relationships he has fostered. Weissman started playing squash at eight, participating in Under-11 tournaments at the Brooks School. Since then, Weissman ha participated in countless squash clinics, met many inspirational coaches and new faces, and found meaning in playing for a team. Weissman said, “What really kept me..."
full_description = "Although squash matches are played individually, each result affects the team’s score. Boys Squash Co-Captain Will Weissman ’25’s continued involvement in squash stems from his appreciation for this team aspect and the relationships he has fostered. Weissman started playing squash at eight, participating in Under-11 tournaments at the Brooks School. Since then, Weissman ha participated in countless squash clinics, met many inspirational coaches and new faces, and found meaning in playing for a team. Weissman said, “What really kept me going was the team dynamic, because when I was younger, I would do a lot of tournaments, and they got a little boring after a while [since] I was playing individually, but actually playing for your teammates and a group of guys that you got to know is more motivating.” Weissman continued, “I’ve also had a lot of great coaches. I used to know a coach named Doug Burbank, and he just found ways to make drills really interesting. There used to be a lot of clinics where I got to meet a lot of new people. And then obviously with [Head] Coach JR [John Roberts] at Andover, I’ve gotten able to build a really good relationship with him. It’s always fun going back to the courts, and getting a good hit in.” Along with Co-Captain Avery Lin ’25, Weissman creates a positive, friendly team setting, bringing together players of all experience levels. Beyond his easy-going nature, Weissman also leads by example on and off the court. “We try to create an environment where everyone feels welcome. I think it’s important that everyone gets a chance to play with one another, even if you’re on different sides of the ladder. So even if someone’s really high up on the ladder, playing number one or three or two, they should still play with some of the kids who are eight or nine so we can all come together as a community. I think what makes our team unique is that we’re all really friendly. We love hanging out outside the court [and] saying ‘Hi’ to each other, so there’s creating a really good team bond. Then for me specifically, I try my best to lead by example. I think that’s important,” said Weissman."
