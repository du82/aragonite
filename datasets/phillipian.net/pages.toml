["https://phillipian.net/2025/02/28/where-faith-meets-magic-rabbi-danny-dubins-mystical-performance"]
title = "Where Faith Meets Magic: Rabbi Danny Dubin’s Mystical Performance – The Phillipian"
description = "On Sunday, February 23, the Jewish Student Union (JSU) hosted award-winning magician and mentalist Danny Dubin. Dubin, who also serves as a rabbi, brought families and children together with a lively performance that combined the artistry of magic with the threads of Jewish faith. Whether through the excitement of magic or the sense of community in Jewish tradition, Dubin believes both paths allow people to recognize life’s everyday miracles and find deeper meaning in their lives. “In the end, both..."
full_description = "On Sunday, February 23, the Jewish Student Union (JSU) hosted award-winning magician and mentalist Danny Dubin. Dubin, who also serves as a rabbi, brought families and children together with a lively performance that combined the artistry of magic with the threads of Jewish faith. Whether through the excitement of magic or the sense of community in Jewish tradition, Dubin believes both paths allow people to recognize life’s everyday miracles and find deeper meaning in their lives. “In the end, both a rabbi and magician have the special role of helping others connect with life around them in meaningful ways,” said Dubin. “In our morning liturgy, we thank God for the daily miracles that are around us morning, afternoon, and evening. As a magician, it’s a humbling feeling to help create that sense of awe for audiences. And as a rabbi, I help others connect with God and [the] Jewish community in ways that hopefully help fill their lives with meaning and a deep sense of connection.” Having performed on both large stages, like those for Google and Microsoft, and smaller ones, such as birthday parties, Dubin focuses on creating an engaging atmosphere for his audience, regardless of age. “I cherish meeting people after shows, from the youngest to the oldest of audience members. You can tell that it’s something special for certain folks to get a chance to talk with the magician, and I view it as a special role to fulfill,” said Dubin. Sunday’s performance was a family-friendly event. The raw humor and honesty brought by the children added an element of authenticity and spontaneity which Dubin does not often encounter in his typical shows. “It was such a fun crowd! I always love it when the audiences are engaging and speaking their minds, and today was no exception” he noted. “Most of my shows are for adult audiences, so it’s always fun when there are young children present. You never know what kids are going to say, and usually, their ad-lib lines are the best parts,” said Dubin."
