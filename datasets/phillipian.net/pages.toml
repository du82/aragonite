["https://phillipian.net/2025/02/07/drama-labs-brings-a-hauntingly-brilliant-showcase-of-original-works"]
title = "Drama Labs Brings a Hauntingly Brilliant Showcase of Original Works – The Phillipian"
description = "A woman barters away her memories to a devil-like figure. A household unravels in lies, betrayal, and bloodshed. This winter’s Drama Labs delivered a night of gripping, original storytelling that left the audience mesmerized and, at times, unsettled. The two featured plays—No Refunds by Jeannie Kang (’28) and The Rabbit directed by Ashiq Kibria (’26)—were masterclasses of testing characters’ emotional limits in eerie settings. These compelling narratives were a stage for ambitious, thought-provoking theater. Written and directed by Jeannie Kang..."
full_description = "A woman barters away her memories to a devil-like figure. A household unravels in lies, betrayal, and bloodshed. This winter’s Drama Labs delivered a night of gripping, original storytelling that left the audience mesmerized and, at times, unsettled. The two featured plays—No Refunds by Jeannie Kang (’28) and The Rabbit directed by Ashiq Kibria (’26)—were masterclasses of testing characters’ emotional limits in eerie settings. These compelling narratives were a stage for ambitious, thought-provoking theater. Written and directed by Jeannie Kang ’28, No Refunds follows Nyla Birmingham, a young woman who begins selling off memories she deems unnecessary. Throughout the story, Birmingham erases the very essence of her past, culminating in a heartbreaking moment when she wakes up without any recollection of the woman who raised her. Kang’s goal was to examine how memories define us, even painful ones, and what happens when we erase the past that shaped us. “The message I wanted to convey was, what are good memories or not? All memories eventually form [a person’s] sense of self and establish [their] identity, and therefore we should cherish them regardless of the pain that they may trigger inside us,” said Kang. Kang’s biggest responsibility while making No Refunds, was ensuring her characters were complex, and felt authentic for the audience. While this was the most burdening aspect of the playwriting process, in the end it was extremely gratifying to see her characters come to life. “Another part which was slightly harder for me was the responsibility [of bringing] the characters to life…This is a world premier, the first time performing this play, which made it harder for me to determine the character’s needs and their personalities,” said Kang. She continued, “I would voice out the lines. I would be like, Emma! Jonathan! and I would speak to the characters in my heart. So it is just rewarding, exciting, but also scary as to how this will live up on the stage.”"
author = "Daniel Zhang, Elias Jeon"
