["https://phillipian.net/2024/09/19/world-in-brief-16"]
title = "World In Brief – The Phillipian"
description = "Politics – Republican Candidate Donald Trump Refuses to Face Democratic Nominee Kamala Harris in a Second Debate Two days after a face-off in which he was widely criticized for delivering a poor performance, Former President Donald Trump declared on Thursday that he would not participate in a second debate against Vice President Kamala Harris. According to the “New York Times,” although the Harris Campaign was calling for another presidential debate, Trump maintained that his victory made it unnecessary to engage..."
full_description = "Politics – Republican Candidate Donald Trump Refuses to Face Democratic Nominee Kamala Harris in a Second Debate Two days after a face-off in which he was widely criticized for delivering a poor performance, Former President Donald Trump declared on Thursday that he would not participate in a second debate against Vice President Kamala Harris. According to the “New York Times,” although the Harris Campaign was calling for another presidential debate, Trump maintained that his victory made it unnecessary to engage in a second face-off. Later that day, Trump commented in a post on “Truth Social” that Harris and President Joe Biden had “destroyed our country, with millions of criminals and mentally deranged people pouring into the USA.” He then reiterated his stance on key issues, suggesting that his previous performance had sufficiently addressed them. Harris’s campaign criticized Trump’s refusal, arguing that another debate would provide voters with more clarity on each candidate’s policies and qualifications. Three major wildfires are currently raging across Southern California. As of September 14, “Cal Fire” reports that the Bridge Fire has scorched 53,738 acres with five percent containment; the Line Fire has burned 38,417 acres, with 29 percent containment; and the Airport Fire has affected 23,519 acres, with 19 percent containment. Following the incidents, tens of thousands of residents have been evacuated, with many homes destroyed. According to the “Los Angeles Times,” the upcoming cooler temperatures should be aiding firefighting efforts, as the region’s extreme heat has been a primary cause of the fires’ expansion. While it has been established that the Line Fire was deliberately ignited, the causes of the other two fires remain under investigation. SpaceX’s Polaris Dawn mission returned to Earth on September 15 after a five-day mission, marking the first-ever commercial spacewalk. The spacecraft went up to an altitude of 1,400 km, the highest altitude reached by any aircraft since the Apollo 17 mission in 1972. Jared Isaacman, leader and founder of the civilian crew, hopes to inspire future generations. In an interview with the “New York Post,” Isaacman said that he “wasn’t alive when humans walked on the moon [and he] would certainly like [his] kids to see humans walking on the moon and Mars, venturing out and exploring our solar system.” The mission was one of the first steps of space tourism, an industry predicted to rise up to 5.2 billion dollars in the next decade according to the scientific magazine Astronomy."
