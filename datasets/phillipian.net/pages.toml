["https://phillipian.net/2025/02/21/ordinary-days-transforming-everyday-stories-through-dance"]
title = "Ordinary Days: Transforming Everyday Stories Through Dance – The Phillipian"
description = "Last Friday and Saturday night, student choreographers and dancers joined together in a production that featured emotion, storytelling, and dance. Choreographed by Seniors Alex Giarnese ’25, Jac Gordon ’25, and Tara Wei ’25, THD902’s “Ordinary Days” reflected weeks of dedication. Despite challenges with scheduling and attendance, the performance made a lasting impact on both the choreographers and the audience. Choreographer Jac Gordon ’25, felt that her hard work and dedication over the past few months ultimately paid off. The final..."
full_description = "Last Friday and Saturday night, student choreographers and dancers joined together in a production that featured emotion, storytelling, and dance. Choreographed by Seniors Alex Giarnese ’25, Jac Gordon ’25, and Tara Wei ’25, THD902’s “Ordinary Days” reflected weeks of dedication. Despite challenges with scheduling and attendance, the performance made a lasting impact on both the choreographers and the audience. Choreographer Jac Gordon ’25, felt that her hard work and dedication over the past few months ultimately paid off. The final production was an accurate representation of her, and her choreographic talents. Gordon said, “Tara, me, and Alex put in a lot of work over the term, and I think we were all very proud of the outcome. It definitely showcased who we are as people and as dancers, and I’m so proud of all three of us for coming up with the vision and the concept and the lighting and the choreography, and I think overall it was just such a great production.” “Ordinary Days” highlighted the beauty in the mundane, bringing attention to the small everyday moments that may go overlooked. The performance’s blend of heartfelt pieces – like Giarnese’s emotional work centered on grief, and Gordon’s high energy hip-hop piece–showcased the power of dance to capture both the intimate and vibrant sides of life. “I went to the performance because I had a lot of friends here both performing and also the choreographers for the performance, so I wanted to come out to support…I think my favorite part was either Alex’s last piece — that piece made me almost cry, it was so sweet— or Jac’s hip hop pieces, because those ate. Alex’s piece, all of it together was [about] grief, and the last piece was so warm. He’s one of my closest friends so seeing that, it was really sweet, and really special” shared Amina Gorman ’26. The performances’ diversity in themes and choreography allowed each piece to stand out while still feeling unified. Attendee Mia Burton ’25, highlighted how the choreographers brought their own distinct emotions and styles to the stage."
author = "Maggie Shu, Nina Torrens"
year_published = 2025
