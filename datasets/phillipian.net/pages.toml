["https://phillipian.net/2024/04/27/girls-tennis-excels-on-the-court-with-consecutive-sweeps"]
title = "Girls Tennis Excels On the Court With Consecutive Sweeps – The Phillipian"
description = "4/20 Andover: 9 Choate: 0 4/24 Andover: 5 Deerfield: 0 Despite the rainy conditions on Saturday, Girls Tennis played its first outdoor home game of the season. Andover had shutouts against Choate and Deerfield, respectively.  According to Co-Captain Lena Ciganer-Albeniz ’25, playing outdoors provided a fresh sense of passion and spirit for the team, helping push them to a strong performance against Choate. “We swept them yesterday, and I feel like we were very enthusiastic because we were going to..."
full_description = "Despite the rainy conditions on Saturday, Girls Tennis played its first outdoor home game of the season. Andover had shutouts against Choate and Deerfield, respectively. According to Co-Captain Lena Ciganer-Albeniz ’25, playing outdoors provided a fresh sense of passion and spirit for the team, helping push them to a strong performance against Choate. “We swept them yesterday, and I feel like we were very enthusiastic because we were going to play indoors because of the rain, but we cleared off the courts. We wiped them manually. We were super excited to be outside, because we haven’t played a home game outside yet this season. So, I think that was really encouraging for all of us, and we were all very focused from the very beginning, and I think we all played very well,” said Ciganer-Albeniz. Despite a slow start, Evelyn Kung ’26 ended her doubles and singles matches with skill and composure, securing two wins for the team. Kung described her performance in the match, noting the importance of staying loose and starting off strong to help win points faster.. “I could improve on putting the ball away faster, and I think that if I could have ended the point faster instead of rallying with [my opponent] as much. It would have been a lot better and made the game go a lot quicker… During doubles, me and my doubles partner were also having kind of the same issue. We were missing a lot, because we were tense at first… We were losing at first, but then as the game went on, we were able to pull it back together and win,” said Kung. Recent weeks have included lots of rainy weather, forcing the team to hold practice indoors instead. Having to train on the courts in the Snyder Center has led to certain limitations, noted Ciganer-Albeniz. However, she expressed appreciation for the consistent practice schedule that having indoor practices allowed for. “It’s less than ideal because we get two courts instead of three, and we’re nine people. But we’re grateful that we get to practice at all because I know JV and Varsity B get their practices canceled when it rains. Varsity B also had their game canceled because we were supposed to go indoors. But, the surface is pretty different. It’s much slower on the indoor courts. But, we’re pretty grateful that we get to practice at all when it rains,” said Ciganer-Albeniz."
