["https://phillipian.net/2025/02/28/a-cia-analyst-the-head-of-school-and-a-five-second-roblox-demo"]
title = "A CIA Analyst, the Head of School, and a Five-Second Roblox Demo – The Phillipian"
description = "Last Friday, Dr. Raynard Kington sat before the school, hundreds of students watching in anticipation. A click. A pause. And then—there it was. A Roblox game. For a moment, the entire student body straightened in their seats. Was this really happening? The Head of School was about to play Roblox on the big screen. But just as quickly as the moment arrived, it vanished. After barely touching the keyboard, Dr. Kington passed the computer to a volunteer, and the game..."
full_description = "Last Friday, Dr. Raynard Kington sat before the school, hundreds of students watching in anticipation. A click. A pause. And then—there it was. A Roblox game. For a moment, the entire student body straightened in their seats. Was this really happening? The Head of School was about to play Roblox on the big screen. But just as quickly as the moment arrived, it vanished. After barely touching the keyboard, Dr. Kington passed the computer to a volunteer, and the game faded into the background as the fireside chat resumed—another surface-level conversation, another wasted opportunity. This was the All-School Meeting (ASM) that promised engagement but delivered little more than an anti-climactic spectacle—brief, attention-grabbing, and ultimately empty. Andover had in front of it Dr. Jack Buckley—CIA analyst, Navy nuclear reactor engineer, former Commissioner of National Education Statistics, Senior VP at the College Board, and now VP of People Science at Roblox. This was a man who has led research shaping national education policy, redesigned the SAT, and pioneered data-driven hiring in one of the largest tech companies in the world. This ASM had all the makings of something great. A high-profile guest speaker, a new conversational format, a game projected on the big screen—everything pointed to something engaging and fresh. The game, Kaiju Cat, was meant to illustrate how Roblox uses game-based assessments in hiring. But rather than diving into how companies like Roblox are revolutionizing talent evaluation, we watched as a volunteer casually played in the background while the conversation remained frustratingly surface-level. Dr. Buckley isn’t just another corporate VP. He has served as a CIA analyst, an engineer for Navy nuclear reactors, and the Commissioner for National Education Statistics. At the College Board, he helped redesign the SAT, and now, at Roblox, he’s shaping the future of data-driven hiring. This is a man who could have spoken about leadership, education reform, analytics—or even intelligence work. He could have spoken about how data science is reshaping hiring at major companies, the future of education and standardized testing, or even lessons of discipline and grit from working in the CIA, the military, and corporate America. Instead, we got a chat that only scratched the surface—focusing on broad, predictable topics rather than taking advantage of Dr. Buckley’s expertise. Instead of diving into his work in education reform or the complexities of data-driven hiring, the conversation lingered on vague career advice and general observations about workplace culture. These were insightful but not the kind of discussion that fully utilized a speaker of his caliber."
