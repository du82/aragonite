["https://phillipian.net/2025/02/28/sustainability-scholar-sophia-tabibian-26-explores-flood-mitigation-in-pakistan"]
title = "Sustainability Scholar Sophia Tabibian '26 Explores Flood Mitigation in Pakistan – The Phillipian"
description = "Inspired by an entrepreneur from Pakistan and their work on possible flood mitigation measures in their country, Sophia Tabibian ’26 took the stage in Kemper Auditorium last Friday for her Sustainability Scholar presentation. Tabibian’s talk was titled “Financing Flood Risk Mitigation: Provincial Autonomy and Climate Investing in Pakistan.” Tabibian addressed the increasing severity of flooding in Pakistan. She explored factors behind the declining response system, including ineffective fiscal policies, mismanaged tax revenues, and language barriers. “Right now, flood warning systems..."
full_description = "Inspired by an entrepreneur from Pakistan and their work on possible flood mitigation measures in their country, Sophia Tabibian ’26 took the stage in Kemper Auditorium last Friday for her Sustainability Scholar presentation. Tabibian’s talk was titled “Financing Flood Risk Mitigation: Provincial Autonomy and Climate Investing in Pakistan.” Tabibian addressed the increasing severity of flooding in Pakistan. She explored factors behind the declining response system, including ineffective fiscal policies, mismanaged tax revenues, and language barriers. “Right now, flood warning systems have very poor infrastructure, and they also aren’t specific to the local regions. For example, there are a lot of farming communities that have their own local dialects, and it’s hard to translate the warnings into their languages. Building up the infrastructure of local warning systems specific to each community is incredibly important. What we also see is that a lot of people who leave rural areas and go into cities during floods often have no employment opportunities because the cities are just strained with so many farmers who are leaving the rural areas [and have to return to] their farms, which have been destroyed by the floods,” said Tabibian. Tabibian proposed four novel approaches in her presentation designed to combat the growing flood crisis in Pakistan. For attendee Madelyn Esposito ’27, of the four methods that Tabibian introduced, increasing educational capacity stood out the most to her. Alexis Lee ’28, who hadn’t previously learned about the drastic effect of climate change in Pakistan, found Tabibian’s presentation eye-opening and informative. Lee expressed her surprise at the fact that these issues were treated as everyday occurrences in Pakistan. “I don’t remember it ever being in the news at all… I also didn’t know the government didn’t do that much to help and that it happened so frequently. Even though it’s happened so many times, no one has really changed the infrastructure or helped with the floods being managed, so that leads to it happening over and over again,” said Lee."
author = "Sophia Tolokh, Jenna Liang"
