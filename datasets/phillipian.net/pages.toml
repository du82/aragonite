["https://phillipian.net/2025/02/07/a-bittersweet-week-boys-hockey-dominates-against-loomis-but-falls-to-deerfield"]
title = "A Bittersweet Week: Boys Hockey Dominates Against Loomis but Falls to Deerfield – The Phillipian"
description = "Boys Hockey showcased resilience and grit in an overwhelming comeback victory against Loomis Chaffee (Loomis), with all goals coming in the third period. At Deerfield, albeit a strong performance, the team lost in a physical game.  Assistant Co-Captain Charles Sabre ’25 praised the team for its performance against Loomis. After giving up a goal in the second period, the team raised its energy and responded with a dominant five-goal third period to win. “We played well throughout most of the..."
full_description = "Boys Hockey showcased resilience and grit in an overwhelming comeback victory against Loomis Chaffee (Loomis), with all goals coming in the third period. At Deerfield, albeit a strong performance, the team lost in a physical game. Assistant Co-Captain Charles Sabre ’25 praised the team for its performance against Loomis. After giving up a goal in the second period, the team raised its energy and responded with a dominant five-goal third period to win. “We played well throughout most of the game, we were following our systems well but we were not able to score. It was just one of those games. They had the first goal in the second period but then in the third period we turned up the intensity and ended the game with three regular goals and two empty net goals to finish five to one,” said Sabre. Sabre highlighted Assistant Co-Captain Peyton Militello ’25 for his reliability in the defensive zone against Loomis. Sabre specifically praised his strong checking, awareness, and ability to create opportunities on the ice. “I want to shout out Peyton Militello. He is the other assistant captain on the team and I thought he played a really solid game. Forechecking hard, backchecking hard, lifting guys sticks. He’s a very consistent player in the [defensive] zone. He knows where to support the puck and how to use his teammates, very good vision on the ice and I thought yesterday he had a particularly good game,” said Sabre. On top of that, goalie Chase Anderson ’25 praised Rui Han ’25 for his performance in the Loomis game. In his first game back from injury, Han scored a decisive, go-ahead goal and followed up with a crucial second goal to give Andover a comfortable two-goal lead. “[Rui] had a big game, first game back from his injury and he got the goal that put us in the lead and the third goal to give us a two goal lead as well. [Rui] Han was a big player for us in this game,” said Anderson. Sabre spoke highly of Anderson, praising both his leadership as a role model and his goaltending performance against Loomis. He described Anderson as a cornerstone of the team, providing a reliable presence in the net."
author = "Alex Godsey"
