["https://phillipian.net/2024/10/18/field-hockey-extends-undefeated-streak-with-back-to-back-shutouts"]
title = "Field Hockey Extends Undefeated Streak With Back to Back Shutouts – The Phillipian"
description = "10/11 – Andover: 8, St. Paul’s: 0 10/16 – Andover: 2, Middlesex: 0 Girls Field Hockey continued its impressive undefeated streak with two more wins, letting only two goals in so far this season. Last Friday, the team defeated St. Paul’s in an overwhelming victory. On Wednesday, the team traveled to Middlesex and won in yet another shutout. In the team’s game against St. Paul’s, Quiana Bell ’26 praised her teammate Molly Driscoll PG’25 for her impressive performance. By scoring..."
full_description = "Girls Field Hockey continued its impressive undefeated streak with two more wins, letting only two goals in so far this season. Last Friday, the team defeated St. Paul’s in an overwhelming victory. On Wednesday, the team traveled to Middlesex and won in yet another shutout. In the team’s game against St. Paul’s, Quiana Bell ’26 praised her teammate Molly Driscoll PG’25 for her impressive performance. By scoring four out of the eight team goals, Driscoll solidified the team’s position adding immensely to Andover’s scoreboard. “We did a good job of working together to get the ball out of the situations and then using each other for like those back-and-forth passes and shooting. Molly Driscoll had four goals out of our eight goals and they were all rockets into the net… She would be sniping the net like four times in a row,” said Bell. In preparation for the game against St. Paul’s, Sienna Glass ’27 shared drills that the team had focused on building toward for the game. Focusing primarily on improving play and confidence, Glass highlighted how more focused drills and exercises helped build team members’ specific skills. “We worked on a lot of mini-games, so we were practicing finding pockets and also driving across the circle. We also worked on big balls, which are passes all the way across the field… The drill is very articulate and helps you build confidence,” said Glass. In preparation for their game against Middlesex, Bell noted the team’s work on ball movement and creating more touches to set up better positions and pass more efficiently. She also highlighted its efforts to play more as a team and less individually, which turned out to be a factor in the team’s victory. “We’re working a lot on moving together and making sure to use each other and not just playing individually. This translated a lot to our games today because it wasn’t a game where you could play by yourself,” said Bell. In its matchup against Middlesex on Wednesday, Bell praised goalie Ellie Parker ’25, who, in the last few minutes of the game, saved three of the opponent’s shots and kept Andover on the top of the scoreboard."
