["https://phillipian.net/2025/02/14/nailed-it-what-nail-art-do-andover-students-have"]
title = "Nailed It!: What Nail Art Do Andover Students Have? – The Phillipian"
description = "From sets done by students on campus who provide nail services to trendy design inspirations taken from Pinterest, nail art is one of the many ways Andover students express their individual style. The Phillipian interviewed students on the different designs they have and what significance they play in their life.    Charlotte Tang ’27 “[My nails are] short almond nails with [a] hot pink aurora design, white stars, and silver gemstones. I got them done one or two weeks ago...."
full_description = "From sets done by students on campus who provide nail services to trendy design inspirations taken from Pinterest, nail art is one of the many ways Andover students express their individual style. The Phillipian interviewed students on the different designs they have and what significance they play in their life. “[My nails are] short almond nails with [a] hot pink aurora design, white stars, and silver gemstones. I got them done one or two weeks ago. I got this design because I was looking at Pinterest for nail inspo and I saw a couple of ideas like aurora nails, star nails, and gemstone nails, and I just combined them together because I thought it would be cute. I got them done by a senior here at [Andover], Nadia Vargas [’25].” “I did a base of purple gel and then [a] silver design with a star [on] one of my nails, and then a silver spiral. I always like to get different variations of the same shape and style, so I always do a purple color scheme of sorts with some sort of star design, so it’ll either be a star in a different color or a star in a different shade. With this one, I really wanted to keep the same kind of purple color that I normally do, but do a star and a spiral. I just keep the same base and do different variations of the design. When I’m choosing my nail designs, I know that I’m gonna do purple, so I look up different nail art designs on Pinterest.” “[My nails] are a nude pink color with a cat eye design, so the salon uses a magnet tool to create a metallic effect. I take a lot of nail inspiration from my mom because she always has her nails done, and she was telling me to try cat eye designs for the longest time and I finally did it so it feels special. They use some sort of nail polish with tiny magnets in it and then they use a tool to make the magnets go in a certain shape or have a certain effect so it looks different depending on the light.” “[My nails are] all very different. There’s stars and cherries on mine and then there’s [also] an animal print. I got them done two weeks ago. These are one of my favorite nail sets that I’ve gotten thus far in my life. I’ve gotten a lot of compliments on it, and they’re kind of funky [and] a little bit more complicated than I would usually get, but it’s really fun. I like expressing myself through my nails. I’m actually really particular about what I like on my nails, but I have a huge Pinterest board of nails and this one was what I’ve wanted for so long, but a lot of places can’t do it. So then this time around the lady was like ‘Yeah, I can do it for you.’ I got them done at Lily’s Nails downtown, but you have to ask for the manager, her name is Nancy.”"
