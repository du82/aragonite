["https://phillipian.net/2025/02/14/all-gender-nordic-skiing-dominates-on-friday-on-wednesday-hosts-its-first-home-meet-in-over-twenty-years"]
title = "All-Gender Nordic Skiing Dominates on Friday; on Wednesday, Hosts Its First Home Meet in Over Twenty Years – The Phillipian"
description = "Last Friday, All-Gender Nordic Skiing delivered a dominant performance against Rivers, Middlesex, and Belmont Hill, with the Girls team claiming first and the Boys team securing second place behind Belmont Hill. Later in the week, the team hosted its first home meet in twenty years, racing on Siberia Field behind the Snyder Center against the same three opponents from Friday. This season, Co-Captain Sage Preston ’25 has served as one of Nordic Skiing’s top competitors, consistently placing in meets. Sebastián..."
full_description = "Last Friday, All-Gender Nordic Skiing delivered a dominant performance against Rivers, Middlesex, and Belmont Hill, with the Girls team claiming first and the Boys team securing second place behind Belmont Hill. Later in the week, the team hosted its first home meet in twenty years, racing on Siberia Field behind the Snyder Center against the same three opponents from Friday. This season, Co-Captain Sage Preston ’25 has served as one of Nordic Skiing’s top competitors, consistently placing in meets. Sebastián Vermut ’27 praised her strong performances and perseverance, which culminated in a victory on Friday. “The biggest star from Friday was Sage Preston. She got the individual win for Andover. That’s really cool to watch specifically as a teammate, to see your teammate succeed. It’s also really cool for her because she’s one of the fastest skiers in the league and it’s great to finally get that win,” said Vermut. The team also delivered an impressive performance on the boys side, with its skiers placing among the top twenty. Co-Captain Luke Williamson ’25 recalled his teammates’ notable finishes that supported the team to second-place, mentioning Vermut for his personal performance and placement. “I got tenth and I think we also got sixteenth and nineteenth. We didn’t win for sure, but I think we might be second…Sebastian really stood out. He got second on the team which is his first time. He did great, putting up about a twenty-minute five [kilometer],” said Williamson. Preston highlighted the community-building aspect of Friday’s race, noting that after the event, Andover gathered with Rivers, Middlesex, and Belmont Hill for pizza. “We had a little pizza mixer afterwards so it was one of the more fun races. We had a chance to bond with the other teams. Bonding with other teams is sometimes hard, so it was just good vibes,” said Preston. Due to insufficient snow, Nordic Skiing is usually unable to host meets at Andover. On Wednesday, however, it hosted its first meet in twenty years. Vermut commented on the significance of the event, which was especially provoked by coaches’ discussions."
