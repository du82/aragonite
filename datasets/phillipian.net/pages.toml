["https://phillipian.net/2024/03/28/boys-crew-co-captain-nate-bechard-24-leads-through-commitment-and-camaraderie"]
title = "Boys Crew Co-Captain Nate Bechard ’24 Leads Through Commitment and Camaraderie – The Phillipian"
description = "Boys Crew Co-Captain Nate Bechard ’24 first started rowing during his Junior year at Andover, following in the footsteps of his father. Bechard places an importance on effort, commitment, and work ethic. He not only motivates his teammates by his own impressive performance but by sharing strategies and creating a strong team bond off the water. Bechard shared his love for the mental strength that Crew requires. He noted the beauty of a sport where you get out what you..."
full_description = "Boys Crew Co-Captain Nate Bechard ’24 first started rowing during his Junior year at Andover, following in the footsteps of his father. Bechard places an importance on effort, commitment, and work ethic. He not only motivates his teammates by his own impressive performance but by sharing strategies and creating a strong team bond off the water. Bechard shared his love for the mental strength that Crew requires. He noted the beauty of a sport where you get out what you put in. “I first fell in love with the sport because of how mentally tough it was and also the fact that rowing is a sport that has pretty much a one-to-one ratio between what you put in and what you get out. You don’t really have to have any super special talents or anything. The people who work the hardest generally succeed and I like that a lot about rowing,” said Bechard. One aspect of the team that Bechard and Co-Captain George Stoody ’24 have been working on is implementing large-scale off-season training. Bechard hopes to elevate all of the rowers around him to a higher level through inclusive team workouts. Bechard said, “This year, we’re building something really important that’s going to last for a lot longer. We grew as a program this year in terms of the off-season training, and the big role of leadership for me has been trying to get a bunch of people to work out more in the off-season because, like I said, the more work you put in, the better the team is as a whole. So as a leader, trying to raise everyone up around me to make sure all of us are putting in the work to achieve the goal that we have in our minds.” Andrew Massicotte ’25 describes Bechard as an accomplished rower who leads by example, while also sending out tips to better his teammates. Massicote shared his admiration for Bechard’s grit, determination, and integrity. Massicotte said, “He has been able to perform, and he still does perform at a very high level, and he has experience and expertise and training, and he really brings that to the team. For example, if we are doing an erg race, he will send out plans of how you should approach it, pointers on your mindset, and things like that, where he’s drawing from his experiences and sharing them with the team, and people really benefit from that… I found that he directs his energy towards improvement, and really leads by example, and people see that, and I follow in his footsteps. He’s honest about how things went, what can be improved, and what we did well.”"
