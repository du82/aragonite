["https://phillipian.net/2025/01/17/changes-in-dorm-utilities-paper-towels-removed-and-laundry-machines-replaced"]
title = "Changes in Dorm Utilities: Paper Towels Removed and Laundry Machines Replaced – The Phillipian"
description = "Multifold paper towels in all dorm bathrooms have been permanently removed this term. Originally introduced during Covid-19 to prevent sharing hand towels for health concerns, single-use paper towels have now been removed due to excessive waste and cost. In addition, all washing machines and dryers have been replaced across campus. The removal of the paper towels was a sustainability and budgetary decision, according to Susan Tsao Esty, Dean of Students and Residential Life. However, common rooms will still be stocked..."
full_description = "Multifold paper towels in all dorm bathrooms have been permanently removed this term. Originally introduced during Covid-19 to prevent sharing hand towels for health concerns, single-use paper towels have now been removed due to excessive waste and cost. In addition, all washing machines and dryers have been replaced across campus. The removal of the paper towels was a sustainability and budgetary decision, according to Susan Tsao Esty, Dean of Students and Residential Life. However, common rooms will still be stocked with paper towels. Esty explained that this decision was a response to reports from the Office of Physical Plant (OPP), reporting the high cost and waste created by paper towel usage. “I received a report that there was so much waste happening. The custodians noticed that there were those multifold paper towels. People were taking them, and then there were a bunch strewn around the bathrooms that clearly weren’t all used, even. We were replacing them really frequently and they weren’t even all being used… It was showing up in our budgets, we were having to replace them so frequently,” said Esty. Dean Yang ’27 said he believes paper towels were essential to maintain dorm bathroom hygiene. Yang suggested that an alternative way for drying hands should be provided. “It feels unsanitary because after washing our hands, they’re wet. Touching the door handle with wet hands makes it wet, which is disgusting. It’s a hygiene issue, and removing paper towels hurts the dorm’s general hygiene… They’re a necessity in our bathroom routines, like water. Just because something costs money or might be wasteful doesn’t mean it should be removed… If they remove paper towels, they should install hand dryers or an alternative for drying hands,” said Yang. While she acknowledged the convenience of having paper towels, Lisa de Boer ’26, Co-Coordinator of the Phillips Academy Sustainability Coalition (PASC), agreed with the removal. De Boer viewed the removal of the paper towels as a way to help Andover become more sustainable."
author = "Christian Estrada, Sophia Tolokh"
