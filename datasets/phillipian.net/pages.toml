["https://phillipian.net/2025/02/21/10-questions-with-dale-hurley"]
title = "10 Questions with Dale Hurley – The Phillipian"
description = "Dale Hurley is an Instructor in Mathematics and an Assistant Coach for Water Polo and Crew. He graduated from the Naval Academy where he rowed crew, and after graduating served for 7 years. Dale also rowed for the U.S. National Team where he competed in 5 Rowing World Championships.    How do you think that rowing and mathematics complement each other at all, and have skills from one helped you with the other? I would say that in general, because..."
full_description = "Dale Hurley is an Instructor in Mathematics and an Assistant Coach for Water Polo and Crew. He graduated from the Naval Academy where he rowed crew, and after graduating served for 7 years. Dale also rowed for the U.S. National Team where he competed in 5 Rowing World Championships. How do you think that rowing and mathematics complement each other at all, and have skills from one helped you with the other? I would say that in general, because I was an athlete in high school, an athlete in college, and then I continued to compete after college, I always feel like if you’re a good athlete, it’s because you’re focused on what you do. You can turn everything off and focus on what you’re doing and do it well. So, the same is true if you’re in a classroom. If you can turn everything off and focus on what you’re doing in the classroom you can do a lot. So, if you’re good at anything because of that focus, and that ability, that should translate to what you’re doing in class. It’s not necessarily the fun thing that you want to do, but it is the thing that if you practice that skill, then you can turn it on and turn it off whenever you want. So I wouldn’t regulate it to just rowing, I would regulate it to any sport or any activity. You are a big snow shoveler. Can you talk about this any why you’re such a big contributor to helping out the community? That all started back when [Abbot Cluster Dean] Taylor Washburn’s dad was here. He used to try to get the teams to go out and shovel snow. And the reason why was because [there are] people that have machines to do the walks, but they didn’t have enough people to do the walks. So, Mr. Washburn was like ‘let’s just get the teams out and we’ll do the stairs. We can do that, and you guys can go ahead and focus on your thing. You do your job, and we’ll help out with this any way we can’. It would turn out to be a really fun thing. I did it initially when he was here and then after he left I just continued doing it. It became a real team bonding thing. It especially works well when the seniors on the rowing team would sort of take over. It takes team effort. It’s like a good workout for the guys and the girls, and the more people would show up, the better it got. So, it’s always a good time, and it’s sort of a fun thing to do."
author = "Vedant Bajaj, Azul Cabrera"
year_published = 2025
year_updated = 2025
