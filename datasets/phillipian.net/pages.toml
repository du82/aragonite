["https://phillipian.net/2024/11/15/chemistry-beyond-family-girls-soccer-shuts-out-exeter-but-loses-in-playoffs-against-choate"]
title = "Chemistry Beyond Family: Girls Soccer Shuts Out Exeter But Loses In Playoffs Against Choate – The Phillipian"
description = "11/9 – Andover: 3, Exeter: 0 11/13 – Andover: 0, Choate: 1 In the 146th Andover/Exeter games, Girls Soccer (12-3-3) defeated Phillips Exeter Academy (Exeter) 3-0 on a chilly Saturday to clinch the sixth seed in the New England Preparatory School Athletic Council (NEPSAC) Girls Soccer Class A tournament. They faced third seed Choate for the second time this season in the quarterfinals on Wednesday, ultimately losing 1-0. According to Sarah Powers ’26, the team went into its game against..."
full_description = "In the 146th Andover/Exeter games, Girls Soccer (12-3-3) defeated Phillips Exeter Academy (Exeter) 3-0 on a chilly Saturday to clinch the sixth seed in the New England Preparatory School Athletic Council (NEPSAC) Girls Soccer Class A tournament. They faced third seed Choate for the second time this season in the quarterfinals on Wednesday, ultimately losing 1-0. According to Sarah Powers ’26, the team went into its game against Exeter with a positive attitude. Although having already secured a spot in the playoffs, the team put its maximum effort into heading into the postseason as strongly as possible. Powers said, “[The game] went pretty well. We were very hyped and excited for Exeter, and it was really exciting. We were really hopeful to win because we were looking forward to playoffs already. We were already guaranteed a playoff spot, but we just wanted to make sure to play hard and work together and communicate on the field so we could heighten the energy on the team and translate our skills into playoffs.” Andover had already played its regular season matchup against Choate on October 5, with the game ending in an unfortunate 2-3 loss. Going into the playoffs and once again playing Choate, Murathime Daisley ’26 noted the team’s confidence and momentum compared to its mentality before the team’s first meeting with Choate. Daisley said, “We are coming in mentally stronger because we are on a nine or ten consecutive game winning streak. When we [last] played Choate, the game before was a tough game, [so] our confidence was lower. But our confidence is much higher now. We also had a few injuries [back then]… but we are mostly all healthy now.” On Wednesday, Andover looked to rise to the occasion against the Choate team it had lost to earlier in the year. Wylie Roossien ’26 illustrated the crucial minutes in the match, such as when Andover saved a penalty only to concede a few minutes later. “About halfway into the second half, a Choate player was awarded a penalty kick in the box. With the momentum still on our side at that point in the game, this penalty kick had the chance to drastically impact the last 20 minutes. Jackie Dill [’27], our goalkeeper, was calm and collected and showed extraordinary maturity to be able to step up in that moment and come up with an incredible save under such an intense situation. In the last few weeks, Jackie must have seen hundreds of [penalty kicks] and each day performed very well, preparing her perfectly for that moment. Unfortunately, about five minutes later, another Choate player received a free kick, this time outside the box. With traffic being heavy in the eighteen-yard box, Jackie’s vision was very limited and although she got a hand to the shot, the shot was slotted hard to the far post and just barely got past her,” said Roossien."
