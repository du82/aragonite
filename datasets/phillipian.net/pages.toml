["https://phillipian.net/2025/01/10/co-captain-bodhi-beroukhim-25-leads-all-gender-wrestling-with-dedication-and-vision"]
title = "Co-Captain Bodhi Beroukhim ’25 Leads All-Gender Wrestling with Dedication and Vision – The Phillipian"
description = "As All Gender Wrestling Co-Captain, Bodhi Beroukhim ’25 drives his teammates to improve by fostering a diverse and connected environment. Emphasizing discipline and collaboration, he encourages athletes to push their limits both on and off the mat. With a mix of new athletes as well as seasoned returners, Beroukhim seeks to create strong team chemistry while also maintaining focus on his own personal development.  By utilizing the wrestling team’s co-ed structure, Beroukhim aims to nurture a diverse team environment. As..."
full_description = "As All Gender Wrestling Co-Captain, Bodhi Beroukhim ’25 drives his teammates to improve by fostering a diverse and connected environment. Emphasizing discipline and collaboration, he encourages athletes to push their limits both on and off the mat. With a mix of new athletes as well as seasoned returners, Beroukhim seeks to create strong team chemistry while also maintaining focus on his own personal development. By utilizing the wrestling team’s co-ed structure, Beroukhim aims to nurture a diverse team environment. As junior varsity and varsity boys and girls all practice together, the athletes have the opportunity to form a tight-knit community across a large group of people. “One thing is saying ‘hi’ to everyone and introducing yourself to everyone. The unique thing about wrestling is that we have one big co-ed team, so the girls wrestle with the boys, and junior varsity practices with the varsity team. That team setting allows us to form a really strong community,” said Beroukhim. Brady Haskell ’28 attests to the success of Beroukhim’s efforts in building a close sense of family. Even as a Junior, he already feels a deep bond with Beroukhim and other teammates, attributing it to the Co-Captain’s outgoing nature. “My first interaction with Bodhi was at the first practice when we were rolling out the mats. He was really welcoming to all of us and super outgoing, trying to talk to everyone. Being a Junior on varsity, Bodhi has really engaged me in the team and made sure to welcome me, really being sure not to leave anyone out. He is trying to bring people in, and it was really nice to be welcomed,” says Haskell. Julian Rios ’26, three-year member of the team and fellow Co-Captain, emphasizes Beroukhim’s efforts in consistently pushing his teammates to reach their full potential. From encouraging healthy habits to maintaining intensity during training, Beroukhim’s dedication is evident. “He helps team chemistry a lot, encourages people at our duel meets and really shows his team spirit. He gets everyone cheering for one another on the team. He’s always pushing people to eat healthier, wrestle their best, and be better in everything they do. Helping you out with the little things, he is always there and always around to teach you if you need help,” says Rios."
author = "Mathew Liu, Alex Godsey"
