["https://phillipian.net/2025/02/28/girls-swimming-diving-remains-supportive-and-energetic-despite-loss-to-exeter"]
title = "Girls Swimming & Diving Remains Supportive and Energetic despite Loss to Exeter – The Phillipian"
description = "Girls Swimming & Diving fell to Phillips Exeter Academy (Exeter) in their annual Andover/Exeter (A/E) meet last Saturday. Despite the loss, the team swam strong races, with both Varsity and Junior Varsity (JV) competing together in a supportive atmosphere. Athletes emphasized the team’s growth and camaraderie, which has continued to progress throughout the season. For this meet, Varsity and JV’s combined effort created an energetic environment on the pool deck. Nishi Amin ’28 reflected on how this helped boost morale.“Considering..."
full_description = "Girls Swimming & Diving fell to Phillips Exeter Academy (Exeter) in their annual Andover/Exeter (A/E) meet last Saturday. Despite the loss, the team swam strong races, with both Varsity and Junior Varsity (JV) competing together in a supportive atmosphere. Athletes emphasized the team’s growth and camaraderie, which has continued to progress throughout the season. For this meet, Varsity and JV’s combined effort created an energetic environment on the pool deck. Nishi Amin ’28 reflected on how this helped boost morale.“Considering the fact that we were all together was really nice because usually we have JV meets and then Varsity meets—they’re separate—but this time it was [both teams together]. So it was nice being with the whole team. Also, having both the Varsity and JV teams at the meet helped to bring up the mood and encourage the swimmers,” said Amin. Competing at Exeter presented additional challenges, as swimmers had to adjust to an unfamiliar pool environment. Djenabou Bah ’28 noted that warming up before races helped ease nerves and allowed her to focus on her performance.“In the actual event, it was kind of nerve-wracking. I wasn’t used to the different dynamics of the pool, because every pool has different [diving blocks], diving boards, and everything like that. But after warming up, I got more comfortable with it, so I could focus on the swim,” said Bah. Similarly, Camden Schopler ’27 spoke on how, despite the fact that Exeter’s pool wasn’t in the best condition, spirits remained high.“It was fun. I didn’t really like Exeter’s pool. It kind of downgraded—they had hair on the floor. But the spirit was there, everybody was up and cheering for one another. We all were cheering for the boys team. The boys team, I don’t know if they were cheering for the girls, but the girls were cheering for everybody,” said Schopler. The team has been focusing on fine-tuning technical skills, including relay exchanges and pacing strategies. Bah highlighted how the team has developed a better understanding of each other, which has contributed to more effective relay transitions.“We have been swimming a bunch of sets [as practice]. We practice relay dives, which I wasn’t even familiar with before I came here, which really helps. We also practice getting to know a connection with each other better. For example, for the [Individual Medley (IM)] relays, we would know, ‘Oh, this [is this] person’s specialty, so we should go for this lineup,’ or ‘This person needs to go for another stroke,’” said Bah."
