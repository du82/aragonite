["https://phillipian.net/2024/10/18/10-questions-with-rachel-conley"]
title = "10 Questions With Rachel Conley – The Phillipian"
description = "Rachel Conley is a new Chemistry Teaching Fellow, House Counselor in Day House, and Assistant Coach for Girls JV1 Soccer this 2024-2025 school year. Conley recently graduated with a Bachelor’s in Behavioral Neuroscience from the University of San Diego (USD). With aspirations to pursue pediatric medicine, Conley is focused on using her teaching role to develop her communication and leadership skills, while also building strong relationships with students. In her spare time, Conley loves to run, go on hikes, wind..."
full_description = "Rachel Conley is a new Chemistry Teaching Fellow, House Counselor in Day House, and Assistant Coach for Girls JV1 Soccer this 2024-2025 school year. Conley recently graduated with a Bachelor’s in Behavioral Neuroscience from the University of San Diego (USD). With aspirations to pursue pediatric medicine, Conley is focused on using her teaching role to develop her communication and leadership skills, while also building strong relationships with students. In her spare time, Conley loves to run, go on hikes, wind down with hot yoga, and ski at highway speeds. My best friend went to school here [before] she graduated in 2020… She didn’t get a graduation because of Covid[-19], but she had an incredible experience. [When] we were skiing together in Colorado, I [said to] her, “I love to teach, and I want to explore this more,” and she [said], “You have to look into the teaching fellowship program at Phillips Academy.” At my previous school, the University of San Diego, I was a Teaching Assistant (TA) for three different chemistry labs and a neuroscience class. I loved being a TA, and I had an incredible experience mentoring students: being a support system for them, not only inside the classroom, but also outside the classroom. I wanted to grow my teaching abilities and learn how to communicate higher-level information to students who were younger than me and see how much I could also learn from them and help them in their own journeys. I will be applying to medical school in June, and so this was a great opportunity for me to do what I love, which is teaching. What has your experience been like being a House Counselor? How’s the transition from living as a student to now being a House Counselor? Coming from college, where I lived with my best friends in a house on the beach, living in a dorm with 36 girls has been a big transition. I love working with adolescents, and I have this ability to mentor. I can be there for them, and I love seeing them in the hallways. I live in a very student-facing apartment: I open my door, and I see students everywhere… I’ve learned a lot, and I’ve been able to get really close to many of the girls in the dorm. I would say I love being on duty on the weekends because I’m able to talk to them more. I’ve been told a couple times that sometimes when you’re on duty, you have this opportunity to get a lot of work done, and in my case, every single time I’ve been on duty, I’ve constantly been talking to students, hanging out with them, never on my computer, and it’s just awesome to be able to be present and there for them. I feel almost like a big sister in a way, but again, someone that has to set very firm boundaries and teach them how to live as a collective."
author = "Christian Estrada, Adelyne Liu"
