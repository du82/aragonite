["https://phillipian.net/2024/10/25/jazz-for-a-cause-the-repercussions-play-for-hurricane-relief"]
title = "Jazz for a Cause: The Repercussions Play for Hurricane Relief – The Phillipian"
description = "As Florida recovers from the devastation caused by Hurricanes Helene and Milton, Andover’s jazz band, The Repercussions, and the Phillips Academy Sustainability Coalition (PASC) have turned their talents into a lifeline for those affected by hosting a benefit concert. Organized by Florida native Ethan Liu ’26, the benefit concert hit especially close to home for Liu. He described how he views music as a form of solace and as a tool to rally donations for the recovery effort. “The event..."
full_description = "As Florida recovers from the devastation caused by Hurricanes Helene and Milton, Andover’s jazz band, The Repercussions, and the Phillips Academy Sustainability Coalition (PASC) have turned their talents into a lifeline for those affected by hosting a benefit concert. Organized by Florida native Ethan Liu ’26, the benefit concert hit especially close to home for Liu. He described how he views music as a form of solace and as a tool to rally donations for the recovery effort. “The event was a fundraiser benefit concert for the aftermath of Hurricane Helene and Milton. These hurricanes came to my home state of Florida and also ravaged throughout the southern United States. I wanted to use music as a form of connection and a way to raise awareness of this matter and also raise money for the Red Cross Foundation,” said Liu. The Repercussions, a completely student-led jazz band, has been an ever-changing community. Brandon Fu ’25 explained how the band has shifted throughout his time at Andover and how it has continued to flourish despite many members graduating. He also describes Liu’s contribution to holding the concert and his hopes for the future. “I co-founded the band my sophomore year, which was about two years ago, with a couple of my good friends, almost all of whom have graduated now. All of the band from sophomore year has now moved on, but I’ve kept it going the past two years. Ethan joined last year, and that guy is crazy. He brought this idea to us to have this concert, and we were really excited to do it. We were glad that we were able to make a difference even if it was a small one and sort of brighten people’s night a little bit,” said Fu. Emily Wu ’25 reflected on the significance of the performance, noting that two of the pieces were original compositions by Liu himself. They practiced the pieces during jam sessions, incorporating the program into their daily activities. She also added that these pieces resonated with her personally, as her hometown is often affected by hurricanes as well."
