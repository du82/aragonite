["https://phillipian.net/2025/01/24/the-modern-lotus-cell-phones"]
title = "The Modern Lotus: Cell Phones – The Phillipian"
description = "On a bright Wednesday morning, I sat down at my desk in English, excited for another lesson about “The Odyssey,” the epic poem detailing Odysseus’ long-winded return home from Troy. As we discussed Odysseus’ journeys, the topic of the lotus eaters drifted into conversation. Not long after departing from Troy, Odysseus’ crew encountered a strange group of people, the “lotus eaters,” who lived off of eating lotus fruit. However, those who had eaten lotuses fell into a trance, tragically forgetting..."
full_description = "On a bright Wednesday morning, I sat down at my desk in English, excited for another lesson about “The Odyssey,” the epic poem detailing Odysseus’ long-winded return home from Troy. As we discussed Odysseus’ journeys, the topic of the lotus eaters drifted into conversation. Not long after departing from Troy, Odysseus’ crew encountered a strange group of people, the “lotus eaters,” who lived off of eating lotus fruit. However, those who had eaten lotuses fell into a trance, tragically forgetting about their dreams of returning home and being content with remaining on the island. As my English teacher asked, “What do you think would be the real-life equivalent of the lotus in ‘The Odyssey?’” Everyone immediately had one thought: phones. The iPhone was developed not so long ago. My mother only got her first iPhone when I was two years old. Before that, they simply…ceased to exist, despite how hard it is to imagine life without them. After all, they’ve made everything so convenient. Do you wish to contact somebody at a moment’s notice? Easy, you can just text them, or call them. Are you unsure of where you’re going? Simple, pull up Google Maps. Are you afraid you’ll miss a few meetings? That’s okay, just set an alarm. Are you conversing with your friends and suddenly someone brings up an actor’s name you don’t know? That’s perfectly fine, just give it a quick search, and then you’ll know who they are, what movies they’ve done, their birthday, relationships, and their mother’s maiden name. With the cell phone, we have boundless amounts of knowledge and power right at our fingertips, and it has undoubtedly made our lives much easier. Some may argue that it has even become a necessity to function in modern-day society. Before coming to boarding school, my parents regulated my device usage. They used built-in Apple features like Screen Time to limit how long I could spend on entertainment platforms and social media. I wasn’t allowed to charge devices in my room. And finally, I wasn’t allowed a cell phone. I’d always been frustrated about that. After all, cell phones made everything so much more convenient, and all my friends had one! ‘I was old enough to be trusted with a phone!’ I thought, ‘I wasn’t going to get addicted to it or anything. It can’t be that bad.’"
author = "Alexandra Lin"
