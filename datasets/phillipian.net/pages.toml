["https://phillipian.net/2024/10/18/david-shane-lowry-calls-for-more-than-a-land-acknowledgement-in-talk-hosted-by-robert-s-peabody-institute-of-archeology"]
title = "David Shane Lowry Calls for More Than a Land Acknowledgement in Talk Hosted by Robert S. Peabody Institute of Archeology – The Phillipian"
description = "On Indigenous Peoples’ Day, the Robert S. Peabody Institute of Archeology hosted a talk by David Shane Lowry, a member of the Lumbee Tribe and an Assistant Professor of Anthropology at the University of Southern Maine. His discussion centered on settler colonialism, the Land Back movement, and the importance of returning Indigenous lands to their original owners. In an interview with The Phillipian, Lowry urged students to grapple with Indigenous history in the current era, not just the past. He..."
full_description = "In commemoration of Indigenous Peoples’ Day, David Lowry spoke on the importance of returning Indigenous lands to their original owners. On Indigenous Peoples’ Day, the Robert S. Peabody Institute of Archeology hosted a talk by David Shane Lowry, a member of the Lumbee Tribe and an Assistant Professor of Anthropology at the University of Southern Maine. His discussion centered on settler colonialism, the Land Back movement, and the importance of returning Indigenous lands to their original owners. In an interview with The Phillipian, Lowry urged students to grapple with Indigenous history in the current era, not just the past. He expressed his hopes for Andover students not to shy away from uncomfortable situations. “You have to make Native and Indigenous peoples part of today. They can’t merely be part of events/politics/wars in the past. Every experience that you all at PA have with your local and national community ought to be attached to work to reverse the realities that allow you to live comfortably outside of relationships with Native and Indigenous peoples,” wrote Lowry in an email to The Phillipian. Andover does not currently have special programming for Indigenous People’s Day. Sam Clare ’25 expressed frustration with this limited recognition, noting how Andover’s land acknowledgment is only the first step in increasing student awareness. “I was interested in Dr. Lowry’s talk about land, especially because I know that PA has a land acknowledgment. What does it mean to have a land acknowledgment when we don’t necessarily do anything else? Saying ‘we know we’re on stolen land’ but not doing anything about it… We actually need to go a lot farther, beyond simple conversations and land acknowledgments, to like he mentioned, our endowments. We have so much money. What are we doing with that?” said Clare. Clare pointed out how, unlike Andover’s Martin Luther King Jr. “Day-On,” students weren’t prompted to learn about Indigenous Peoples’ Day. They mentioned that such a “Day-On” could serve as a framework for future development."
