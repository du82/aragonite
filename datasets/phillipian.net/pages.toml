["https://phillipian.net/2024/09/14/rain-showers-bring-andover-together-at-cluster-olympics"]
title = "Rain Showers Bring Andover Together at Cluster Olympics – The Phillipian"
description = "Accompanied by pouring rain, students charged into the center of Phelps Stadium in the middle of Andover’s first-ever Cluster Olympics. Crowded around the soaked cluster flags, students started impromptu waves of chants, dances, and singing, capping off the night’s festivities with a demonstration of cluster pride. The Olympics are a part of the Dean’s Office’s effort to bolster a sense of belonging on campus for all members of the Andover community. Aya Murata, Assistant Dean of Students and Residential Life,..."
full_description = "Accompanied by pouring rain, students charged into the center of Phelps Stadium in the middle of Andover’s first-ever Cluster Olympics. Crowded around the soaked cluster flags, students started impromptu waves of chants, dances, and singing, capping off the night’s festivities with a demonstration of cluster pride. The Olympics are a part of the Dean’s Office’s effort to bolster a sense of belonging on campus for all members of the Andover community. Aya Murata, Assistant Dean of Students and Residential Life, spearheaded the planning process with Tasha Bohorad ’26, crowdsourcing ideas from over 150 student leaders. “My goal was to build community, especially for the closed weekend when we traditionally haven’t had much going on Saturday. In the past, it was up to clusters to organize activities, which were mostly student-driven and didn’t involve advisors, House Counselors, or other adults. I thought that since we have this captive audience on campus during the first weekend, we should have a way to kick off the energy and foster relationship-building, which is the foundation of a strong school year,” said Murata. After students gathered in Phelps Stadium, events proceeded normally for several hours before rain suddenly broke out. Some students left the stadium, seeking shelter in the Snyder Center, while students already on the field began dancing. Marcela Hernandez ’25, a Blue Key Head, talked about how the phenomenon spread. “I started dancing in the rain with my [Abbot] Co-Presidents, Migyu [Kim] ’25 and Charles [Vest] ’25, and with Jaylen [Dayley] ’25, another Blue Key Head… and I noticed that a lot of my friends in Abbot also started dancing and singing, and when you’re singing in the rain, no one really cares, because you can’t really hear anything. So it just became a really fun environment. We all kind of invited everyone onto the field to just dance in the rain. And I haven’t felt that much school spirit, maybe ever, in such a concentrated area, and so it was just so much fun, and it was surreal… and then joining into that big mosh in the middle of the field in the rain was just such a fun experience, probably one of my highlights at Andover,” said Hernandez."
author = "William Ge, Christian Estrada, Dylan Siegel"
