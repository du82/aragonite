["https://phillipian.net/2025/01/31/brace-fellow-alice-he-25-explores-chinas-one-child-policy-and-its-impact-on-gender-dynamics"]
title = "Brace Fellow Alice He ’25 Explores China’s One-Child Policy – The Phillipian"
description = "When Brace Fellow Alice He ’25 returned to China two years ago, nearly everyone she met assumed that she and her sister were friends instead of siblings. Inspired by this experience, He examined China’s one-child policy in her presentation, titled “The Ban on Babies: How the One-Child Policy Transformed Gender Norms in China,” on January 27 in Abbot Hall.  Introduced in 1980 to curb China’s growing population, the one-child policy limited most Chinese families to having one child each. He..."
full_description = "When Brace Fellow Alice He ’25 returned to China two years ago, nearly everyone she met assumed that she and her sister were friends instead of siblings. Inspired by this experience, He examined China’s one-child policy in her presentation, titled “The Ban on Babies: How the One-Child Policy Transformed Gender Norms in China,” on January 27 in Abbot Hall. Introduced in 1980 to curb China’s growing population, the one-child policy limited most Chinese families to having one child each. He discussed how this policy affected women, compounding the preference for male children and resulting in skewed gender ratios. “Overall, much of the psychological and physiological consequences of the policy were shouldered by women. The brutal handling of women’s bodies in the name of enforcement demonstrated how officials often valued population targets over the care of both the women and the children’s health in the country,” said He. He continued, “Women were given one chance to do it right and birth a son. This placed lots of pressure on women and mothers, who sometimes committed suicide or were divorced by their husbands if they failed to bear a son. It also meant terrible consequences for the daughters under the policy, especially in rural areas… Many baby girls were abandoned and killed, and in some circumstances mothers who did keep their daughters internalized the oppression, and resented their daughters for being born.” In addition to examining the negative impacts of the one-child policy, He also shed light on some unexpected benefits that arose. He explained how the policy promoted female agency in certain parts of China. “Like much of history, the one-child policy was again not black or white, and there were certain effects of empowerment and gender equality that resulted from it. One example of it is employment and higher social status with women, in Xiangzhou, a province categorized as rural or urban… A staggering 96 percent of women said that they believed that the policy’s family planning increased their ability to work and access job opportunities, which raised their income as well,” said He."
