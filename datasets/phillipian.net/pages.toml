["https://phillipian.net/2024/11/08/field-hockey-co-captain-ellie-parker-25-an-emphasis-on-spontaneity-and-team-bonding"]
title = "Field Hockey Co-Captain Ellie Parker ’25: An Emphasis on Spontaneity and Team Bonding – The Phillipian"
description = "Field Hockey Co-Captain Ellie Parker ’25 has returned to the field with a passion and drive to play field hockey after an ACL injury prevented her from playing last year. As a goalie, Parker has a unique view of the field, allowing her to give constructive feedback to teammates. In addition to on-the-field leadership, Parker fosters a strong team community by leading team bonding events.  Parker noted how crucial it is for all voices on the team to be heard...."
full_description = "Field Hockey Co-Captain Ellie Parker ’25 has returned to the field with a passion and drive to play field hockey after an ACL injury prevented her from playing last year. As a goalie, Parker has a unique view of the field, allowing her to give constructive feedback to teammates. In addition to on-the-field leadership, Parker fosters a strong team community by leading team bonding events. Parker noted how crucial it is for all voices on the team to be heard. She strives to connect with all members on and off the field, regardless of grade. “We have a big team, and it’s super important that everyone’s voices are heard. I know sometimes people don’t necessarily lead with their voices and their actions are how they help out teammates off the field. This season we have gotten super close with everyone off the field. We have a pretty decent-sized Senior class so encouraging them to also reach out to the underclassmen on the team and knowing that we’re all here to support each other has been a super important step in our whole process of creating a super positive and respectful environment on our team. I also try to get to know everyone as much as possible, reaching out to Freshmen, Lowers, and Uppers that I might not see every day during school. I make sure I get the time to really connect with those kids, even if it’s not at practice,” said Parker. Parker also attempts to foster strong team bonds that extend outside of field hockey itself. She shared how spontaneously organizing a fun afternoon of dodgeball and swimming when a game was canceled proved to be extremely beneficial for the team. Parker said, “One Tuesday, our game against Brooks got canceled so we all played dodgeball in Borden [Memorial Gym], and then after that, we all went swimming in [the] Pan [Center]. Although some people could argue we should have practiced, honestly that was probably the best thing that could have happened to us. We had a full hour and a half with each other doing something un-field-hockey related. I’d say that was a super fun moment to compete against each other and go have fun in the pool.”"
