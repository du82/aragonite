["https://phillipian.net/2024/02/16/10-questions-with-aya-murata"]
title = "10 Questions with Aya Murata – The Phillipian"
description = "What initially drew you to the Andover community?  I attended boarding school as a high schooler. Went to Suffield Academy, which is just north of Hartford, Connecticut. I loved my boarding school experience…So, when I thought about what I wanted to do with my life…I always thought maybe if I could work in admissions at a boarding school…to help students understand and families understand that there’s this really interesting educational opportunity that is not your local public school…Through a friend..."
full_description = "I attended boarding school as a high schooler. Went to Suffield Academy, which is just north of Hartford, Connecticut. I loved my boarding school experience…So, when I thought about what I wanted to do with my life…I always thought maybe if I could work in admissions at a boarding school…to help students understand and families understand that there’s this really interesting educational opportunity that is not your local public school…Through a friend of a friend I saw the job posting for Andover in the admission office…[Actually], one of my most beloved faculty members at Suffield, the guy who taught me math and was my house counselor. They left after my 11th grade year from Suffield to come work at Andover…[Also], the woman who was the acting dean of admission and who I interviewed for my job had worked at Suffield when I had been a student…So, it just kind of felt like a perfect storm of just all the good juju in the air bringing me here. At its heart, at its core, it’s very much the same, like the same values. Yet, I think things like technology have caused various changes over time…I just think technology has changed the way, and the pandemic certainly, but it’s changed the way we engage with each other…Kids [used to have] to sort of sit with their emotions a little longer. Kids had to sort of sit with problem solving a little longer. There wasn’t this instant gratification, “I need to fix it, let me just call home and they’re going to fix it for me…” Even when I think about my time in boarding school and then sort of over time, students didn’t talk to their parents that often because it was hard to talk to your parents. I like to try to reframe the college process as one of self-discovery, self-reflection, sort of a treasure hunt or sorts, of how can I think of my Andover experience in a way as sort of a collection of how I’ve explored my curiosity whether that’s in an academic field, or an extracurricular field, in a way. Right now it feels like everyone’s on a treadmill, and someone’s making it faster and faster and everyone’s like “and then I need to put something else on” and it loses its authenticity and it totally I think loses in terms of one’s mental health and one’s sense of self…Zero in on the things that feel important to you, and then be 110%. Do that in the best way possible."
