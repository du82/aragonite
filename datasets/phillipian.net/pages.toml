["https://phillipian.net/2024/10/17/song-dynasty-annual-chinese-karaoke-night"]
title = "Song Dynasty: Annual Chinese Karaoke Night – The Phillipian"
description = "Exploding with cheers and laughter, Kemper Auditorium overflowed with energy on Friday night as students taking Chinese classes performed various songs. This annual Chinese department event featured versatile performances including beautiful duets, comedic bits, and an interactive Just Dance segment. Along with being a creative outlet for students to learn the language, the event has become synonymous with a night of laughter and bonding. To prepare for this event, Chinese classes rehearsed their songs for the past few weeks. Deviating..."
full_description = "Exploding with cheers and laughter, Kemper Auditorium overflowed with energy on Friday night as students taking Chinese classes performed various songs. This annual Chinese department event featured versatile performances including beautiful duets, comedic bits, and an interactive Just Dance segment. Along with being a creative outlet for students to learn the language, the event has become synonymous with a night of laughter and bonding. To prepare for this event, Chinese classes rehearsed their songs for the past few weeks. Deviating from a usual schedule, rehearsals, and practices livened up the regular cycle of classes. Jacob Honor ’27 described his experience preparing for his performance and how it was a great way to distract himself from typical academics. “My class performed the song ‘Ting Wo Shuo, Xie Xie Ni,’ along with a dance. For the past two weeks, we spent some time at the end of class practicing the song and the dance. I really enjoyed the time we spent practicing since it was a good change of pace from typical classes,” said Honor. With a large turnout, the event was extremely interactive and had immense audience engagement. During and between acts, members of the audience frequently laughed, cheered, and took videos. Even those who were not performing interacted with the songs, such as Frank Hu ’26, who attended despite not being involved in a Chinese class. Hu was excited to be involved in any way, through dancing and singing along with the crowd. “I thought that some of the acts where the audience could participate were really fun. For example, in ‘Geng Zhe Wo Zuo Shou,’ there were a lot of people dancing along in the crowd, and I thought that was really cool. I was misled because I didn’t realize it was a show. I thought I was pulling up to sing, but I think that it was fun either way. I was pleasantly surprised,” said Hu. The event pushed many students to go out of their comfort zone and go up on stage to perform light-hearted and comedic acts. For students who were not used to performing, the event was initially nerve-wracking. However, many students, such as Vincent Giancola ’26, eventually found fun in the event through the humorous and supportive environment."
