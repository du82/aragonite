["https://phillipian.net/2025/01/24/students-explore-haitian-culture-through-jean-appolon-expressions-mlk-day-dance-workshop"]
title = "Students Explore Haitian Culture Through Jean Appolon Expressions’ MLK Day Dance Workshop – The Phillipian"
description = "Nishi Amin | The Phillipian This Monday, during Andover’s MLK day-on, students gathered in the Pan Athletic Center for the “Jean Appolon Expressions Dance Workshop.” The workshop was led by Jean Appolon, the Artistic Director and Co-Founder of Jean Appolon Expressions. Accompanied by live drummers, the workshop explored different movements in several rhythms from Haitian Folklore. Open to everyone, the class included a wide range of participants regarding age, dance experience, and connections to Haiti. Mayen Etuk ’26 attended..."
full_description = "This Monday, during Andover’s MLK day-on, students gathered in the Pan Athletic Center for the “Jean Appolon Expressions Dance Workshop.” The workshop was led by Jean Appolon, the Artistic Director and Co-Founder of Jean Appolon Expressions. Accompanied by live drummers, the workshop explored different movements in several rhythms from Haitian Folklore. Open to everyone, the class included a wide range of participants regarding age, dance experience, and connections to Haiti. Mayen Etuk ’26 attended the workshop on Monday. She discussed how interesting it was to see an array of dance experiences within the class, as faculty members, their kids, and students alike participated. She also appreciates the fusion of different heritages from the diverse group of the workshop’s participants, who all came together to learn a traditional Haitian dance. “It was really interesting to see all these people from different dance backgrounds. I mean there were a lot of faculty kids there, faculty members, then students who also signed up because they were intrigued. So it was interesting to see those different histories or heritages melt together and perform a Haitian traditional dance,” said Etuk. Etuk is very involved in dance throughout the year. When she saw one of the workshop options was for Haitian dance, she saw a unique opportunity to expand her dance skill set and experiment with a new technique. Etuk commented on how essential it is to make the most of the choreographers who are invited to Andover, as they provide rare and exciting opportunities. “I saw a Haitian dance workshop specifically, and I was like ‘Okay, I’ve never been to one of these before.’ And I feel like when a choreographer, someone who runs dance workshops, comes to the school, I tend to want to go to them because I do dance outside of class and as a sport and an extracurricular, so I was just intrigued. That’s why I signed up for it,” said Etuk. Giuliana Cardinale ’25 also attended the workshop. She loved seeing people simply have fun and explore new forms of expression as they pushed out of their comfort zone. Cardinale had the chance to converse with Appolon, and she was captivated by hearing his history of dancing in Haiti and how he used it as a coping mechanism to respond to traumas in his life."
