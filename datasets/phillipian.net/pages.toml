["https://phillipian.net/2025/01/11/officer-wendy-a-legacy-of-warmth-and-dedication"]
title = "Officer Wendy: A Legacy of Warmth and Dedication – The Phillipian"
description = "Wendy Cogswell (Officer Wendy), the heartbeat of the Andover community for 28 years, was known for helping recover lost items, directing traffic during events, ensuring late-night campus security, and even corralling runaway dogs. Last month marked the end of Officer Wendy’s career at Andover. Appreciated by both students and faculty for her enthusiasm and friendliness, Officer Wendy will still occasionally be on campus as a part-time per diem officer. Fondly recalling her time at Andover, Officer Wendy expressed her gratitude..."
full_description = "After 28 years, Officer Wendy has retired from her duties in the Office of Campus Safety at Phillips Academy. Wendy Cogswell (Officer Wendy), the heartbeat of the Andover community for 28 years, was known for helping recover lost items, directing traffic during events, ensuring late-night campus security, and even corralling runaway dogs. Last month marked the end of Officer Wendy’s career at Andover. Appreciated by both students and faculty for her enthusiasm and friendliness, Officer Wendy will still occasionally be on campus as a part-time per diem officer. Fondly recalling her time at Andover, Officer Wendy expressed her gratitude for the supportive community and countless students and faculty who made her time memorable. In particular, she remembered recovering from encephalitis and being welcomed back with a standing ovation. Officer Wendy further reflected on some of her other favorite memories of her job. “I loved my job and the commitment I made. Becoming ‘Officer Wendy’ was special. No one calls me by my last name, even now… One of my favorite moments was greeting students at the start of school with Blue Keys, cheering, and waving them in. It showed them we were excited to welcome them as part of the community. I also enjoyed family weekends, where I could talk with parents and show them that there are people at the school who genuinely care about the students,” said Cogswell. Cogswell continued, “About 15 years ago, I had encephalitis and nearly didn’t make it. When I returned, there was a school meeting where [I was brought] to the podium to announce I was back. The standing ovation I received from the students was overwhelming. That moment solidified my love for my job and motivated me to keep giving it my all after my recovery.” Lisa Joel, Director of Athletics, recalled Officer Wendy’s friendliness, positive energy, and how much love she showed for the Andover community. She noted how Officer Wendy would show up frequently during school, ready to show up to any scenario and work it out."
author = "Christian Estrada, Ian S Kim"
