["https://phillipian.net/2024/10/04/10-questions-with-karen-douyon"]
title = "10 Questions with Karen Douyon – The Phillipian"
description = "Karen Douyon is a teaching fellow in the Theatre and Dance Department, a House Counselor in Stimson House, and the faculty advisor for Curly Hair Club. Aside from a passion for performance-based arts, Douyon enjoys tarot reading as well as making things from scratch, and her favorite play is “Bourbon at the Border.”   1. You have been teaching since you were 14. How did that journey begin and how is it impacting you now? Every summer, [my school] has..."
full_description = "Karen Douyon is a teaching fellow in the Theatre and Dance Department, a House Counselor in Stimson House, and the faculty advisor for Curly Hair Club. Aside from a passion for performance-based arts, Douyon enjoys tarot reading as well as making things from scratch, and her favorite play is “Bourbon at the Border.” 1. You have been teaching since you were 14. How did that journey begin and how is it impacting you now? Every summer, [my school] has a volunteer program called Horizons of the Jersey Shore, where they take students from Red Bank, known for a weaker school system with many low-income kids, to my old middle school for summer sessions from eight to three, teaching Math, English, Reading, Science, and Enrichment to prevent the summer slide, forgetting everything learned from the year before until the next school year, especially since many of these kids weren’t on par with their reading levels. I started as a teacher’s assistant when I was 14, fresh out of eighth grade. I’d collect the tests, lead them to recess, and bring them to lunch, but the teachers did all the work. By the time I was 16, 17, after working there every summer for two or three years, I became my own teacher with my own class… It felt really good to be a safe space for these kids because I was one of the only people who looked like them in the teaching faculty, and it felt nice to connect with them that way… My philosophy as a teacher is, ‘How can you be you in the fullest way possible?’ Because I’m gonna be me in the fullest way possible, and my mindset inspires my students to not be afraid of being loud, or not be afraid of being quiet, or not be afraid of being the person who shoots their hand up. 2. You transitioned from performing to focusing on theater and drama. Can you explain how those early experiences shaped your current love for performance and your journey in theater? I started because a girl told me I couldn’t, and I was like, “Watch me.” But, it transformed from resentment into genuine curiosity and love for the craft. It also came from the desire to follow my path. There’s a moment in every young person’s life when they stop listening to what their parents, friends, or teachers want them to do, and they choose what makes them passionate. That’s what I did. I chose the thing that made me light up, the thing that made me stay all day, be the first person there and the last to leave. I wanted to create a life around what I love, find ways to make money, and provide for myself while still pursuing my passion. Being here at Andover, it doesn’t feel like work. Even though I teach second period, it doesn’t feel like work getting up because I love seeing the work my students bring to me. It’s magical being able to learn as an actor from them."
