["https://phillipian.net/2024/02/23/girls-basketball-head-coach-jen-weissbach-uplifts-the-program"]
title = "Girls Basketball Head Coach Jen Weissbach Uplifts the Program – The Phillipian"
description = "Girls Basketball Head Coach Jen Weissbach spent countless hours shooting hoops on her driveway with her mother rebounding. An 1,000 point-scorer in high school, Weissbach went on to play Division I Field Hockey at Dartmouth University and served as one of the team’s two captains, while also playing on Dartmouth’s travel basketball team. Weissbach’s love for coaching started in high school, where she would coach at camps and clinics. Later, she returned to coaching high schoolers because of their abilities..."
full_description = "Girls Basketball Head Coach Jen Weissbach spent countless hours shooting hoops on her driveway with her mother rebounding. An 1,000 point-scorer in high school, Weissbach went on to play Division I Field Hockey at Dartmouth University and served as one of the team’s two captains, while also playing on Dartmouth’s travel basketball team. Weissbach’s love for coaching started in high school, where she would coach at camps and clinics. Later, she returned to coaching high schoolers because of their abilities to develop and mature rapidly. Previously, Weissbach served as the Head Coach of Field Hockey and Basketball at the Hill School in Pennsylvania. Weissbach said, “I think that was a way for me to start to build my passion around coaching. I’ve learned to love coaching high schoolers because I find that it’s a time when we can see so much growth and we can help them grow. We can help them learn how to work harder than they’ve ever worked before and we can help them learn how to be a great teammate, how to be a great person.” Weissbach instills three core values into her teams to create an environment based on teamwork. She helps players steer away from an “I” mindset and towards a “we” mindset as a way to promote collaboration and trust. “I value hard work. I value passion. I value commitment, and something that I’ve been trying to instill in our team is that it’s never about you. It’s always about us… It’s always about how we can continue to grow and be better and push each other as a team, as a collective unit. And my goal as a coach is to try and instill that into everything that we do,” said Weissbach. According to Akari Imai ’25, Weissbach has established a balance between being easygoing and challenging the players. Weissbach always makes herself available to help the players individually as well as a team. Imai said, “Coach Dubs [Weissbach] is a really good coach because she is funny and she is very personable, but she’s also strict on us and hard on us and pushes us when we need to be pushed… Whenever I have a problem or I want to improve on something, she’ll always give the best feedback and she’ll be really supportive and encouraging about it.”"
