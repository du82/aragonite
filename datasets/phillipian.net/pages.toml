["https://phillipian.net/2024/04/11/girls-lacrosse-faces-first-lost-of-the-season-to-nobles-dominates-deerfield"]
title = "Girls Lacrosse Faces First Lost of the Season to Nobles, Dominates Deerfield – The Phillipian"
description = "Friday 4/5 – Andover: 2, Nobles: 13 Wednesday 4/10 – Andover: 17, Deerfield: 7 On Friday, Girls Lacrosse faced a strong Noble and Greenough (Nobles) team and ultimately took its first loss of the season. However, on Wednesday, Andover was able to bounce back and take a win against Deerfield. According to Quiana Bell ’26, the team worked a lot on defense and communication going into the game against Nobles. Despite Nobles managing to score 13 goals, Bell thought that..."
full_description = "On Friday, Girls Lacrosse faced a strong Noble and Greenough (Nobles) team and ultimately took its first loss of the season. However, on Wednesday, Andover was able to bounce back and take a win against Deerfield. According to Quiana Bell ’26, the team worked a lot on defense and communication going into the game against Nobles. Despite Nobles managing to score 13 goals, Bell thought that the defense communicated and performed well, implementing what they had worked on in practice. Bell said, “Obviously, we did lose, which wasn’t the best, but I feel like the things that we worked on we did execute pretty well. Leading up to the game we worked a lot on our team defense, sliding, communicating on who’s going to ball versus double teams or triple teams… And I think, considering how well Nobles’ offense worked together, that our defense did a good job executing the things we did practice. Our slides were good, I feel like we were communicating well, and well, I feel like while the score didn’t really reflect that, it was definitely like an upgrade to what we have been doing in the past.” Lola Aguirre ’26 highlighted the team’s high energy throughout the game, even when they were down by many goals. Aguirre pointed out that everyone celebrated and applauded when Charley Drouin ’25 scored an amazing behind the back shot. “We were all very energetic going into the game. We had a team meeting before talking about the types of energy we wanted to bring to the game and how we wanted to present ourselves. So, going into the game we were very energized and we kept that up even though we were down. For example, in the third quarter when Charley had a BTB (behind the back) shot, we all cheered and congratulated her for that. So, very energetic,” said Aguirre. Bell believed that the team had difficulty transitioning the ball from defense to offense on Saturday and had some preventable turnovers. In addition, Bell thought that the team could work on offball movement on offense, creating space for teammates, and ultimately making better scoring chances."
