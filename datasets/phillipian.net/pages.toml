["https://phillipian.net/2024/03/22/students-reflect-on-changes-in-the-admissions-process-and-offer-advice-to-the-247th-class"]
title = "Students Reflect on Changes in the Admissions Process and Offer Advice to the 247th Class – The Phillipian"
description = "As the new admits join Andover for the first revisit day today, Friday, students shared their experiences and opinions on the admissions process and acclimating to Andover. While the admission of Andover’s new class is an exciting time, the process of applying can be long and arduous for many. Students recognized the tedium of the process and offered advice for the incoming class.    Louise Leone ’24, one of the five seniors featured in the Andover Admissions video welcoming new..."
full_description = "As the new admits join Andover for the first revisit day today, Friday, students shared their experiences and opinions on the admissions process and acclimating to Andover. While the admission of Andover’s new class is an exciting time, the process of applying can be long and arduous for many. Students recognized the tedium of the process and offered advice for the incoming class. Louise Leone ’24, one of the five seniors featured in the Andover Admissions video welcoming new students, provided insight and advice on entering Andover. As a student who joined as a new Upper, Leone emphasized the importance of learning to rely on the school’s various resources. “Some [students] might have a reality check because they’re used to being the best students at their school and they come here and everyone’s so brilliant, but I would say just give things time and [allow] yourself to make mistakes. Take advantage of the things that Andover has to offer, they have so many avenues where they could get good help from especially during their first year. I myself had to rely on those resources, [and] I know that if you ask for those resources you will find help here,” said Leone. Brandon Fu ’25 offered similar advice to the incoming students to experiment with campus offerings and push themselves outside of their comfort zone. “I hope [new students] enjoy themselves here and find a happy and fulfilling four years on campus. There will be ups and downs but I have faith in everyone. [One] piece of advice: try things, try everything. It’s helpful to not have a set image of who and what you’re going to be. If [you] do that, [you’re] doing [yourself] a disservice; [you’re] blocking so many doors of opportunity that are available on campus,” said Fu. Fu also mentioned the new changes that Andover has made to their admissions process. He specifically shared his opinions on the optional SSAT submission and interview. “I think the changes are good. I think test scores, while they are indicative of a student’s cognitive ability, are not the full story. As for admissions interviews optional, I think I would be okay with that change as long as there is an opportunity to see the applicant’s personality and how they see themselves on their campus. The purpose of the admission interview is to get a full picture of who that applicant is, so with the advent of online learning and online communication, if that means the interviews become optional, that would be perfectly fine,” said Fu."
author = "Aden Hwang, Cade Rutkoske"
