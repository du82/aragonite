["https://phillipian.net/2024/12/13/library-bulletin-boards-removed-after-vandalism"]
title = "Library Bulletin Boards Removed After Vandalism – The Phillipian"
description = "The Oliver Wendell Holmes Library’s (OWHL) bulletin boards have been removed for the Winter term following multiple incidents of profanity and improper drawings. The boards, first installed in the spring, were defaced four times — once at the end of the Spring term, again during the summer, and twice in the fall. Despite warnings and signs posted at the beginning of the school year, the incidents continued, leaving clubs without a designated space to hang up posters in the OWHL...."
full_description = "The Oliver Wendell Holmes Library’s (OWHL) bulletin boards have been removed for the Winter term following multiple incidents of profanity and improper drawings. The boards, first installed in the spring, were defaced four times — once at the end of the Spring term, again during the summer, and twice in the fall. Despite warnings and signs posted at the beginning of the school year, the incidents continued, leaving clubs without a designated space to hang up posters in the OWHL. Camille Torres Hoven, Director of the OWHL, noted that the OWHL’s policy is to temporarily close advertisement spaces to reset the environment. While the boards may return in the spring or next fall, Torres Hoven explained that their removal highlights the inappropriate consequences. “The bulletin board removal was disappointing. We created them to solve a problem and make things better for students. Seeing them disrespected was a letdown. We want to collaborate with students and create a space that feels like home, but that requires mutual respect,” said Torres Hoven. Jess Wallis, Research and Instructional Design Librarian, removed the boards before Fall break and explained their decision. They noted that while the majority of students are respectful, the OWHL will maintain stricter policies for student-related spaces going forward. “After one of the incidents last spring, we considered solutions like covering them with paper or removing the pins… So, we filed the felt boards to remove any writing, but eventually, we decided it wasn’t worth the risk. It’s about liability, and having something offensive in the library that we can’t monitor is unacceptable,” said Wallis. Wallis continued, “We’ll be talking internally about ways forward, but it’s clear that an unmonitored board space is not the way. Your contributions, like your events, are really valuable. I imagine Ms. Torres Hoven will talk to the Student Advisory Board and the library staff to find a mutually agreeable, monitored solution. It was necessary to take them down because we can’t have offensive content in the library, especially after four warnings.”"
