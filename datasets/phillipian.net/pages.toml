["https://phillipian.net/2025/02/28/dodgeball-tournament-at-winter-cluster-olympics"]
title = "Dodgeball Tournament at Winter Cluster Olympics – The Phillipian"
description = "Andover faculty battled head-to-head against students in an intense dodgeball match this past weekend. The exhibition match was just one attraction in this Winter’s Cluster Olympics Event.  Clusters had the opportunity to earn points by competing in a round-robin dodgeball tournament with two divisions for lower and upper classmen. Each cluster competed in the tournament, with Flagstaff emerging victorious. The event also included a range of food for students, music, and a photo booth.  Ryan Tran ’28 reflected on the..."
full_description = "Andover faculty battled head-to-head against students in an intense dodgeball match this past weekend. The exhibition match was just one attraction in this Winter’s Cluster Olympics Event. Clusters had the opportunity to earn points by competing in a round-robin dodgeball tournament with two divisions for lower and upper classmen. Each cluster competed in the tournament, with Flagstaff emerging victorious. The event also included a range of food for students, music, and a photo booth. Ryan Tran ’28 reflected on the event, commenting on the exciting atmosphere. He explained how the crowd intensified the games, contributing to the liveliness of the event. “It was really fun. There was a lot of energy going around. Some clusters were more into it than others, but overall, everyone showed a lot of enthusiasm. The games were exciting, and I think the food was a great addition. Overall, it was a really fun time… I’d definitely do it again next year. The energy, the competition, and just getting to play with friends made it a great experience,” said Tran. He continued, “The most exciting moment was when Maddie Shin [’27] won a ‘One v Three’ against Brady [Kanter ’27], Max Panda [’27], and Teo [Choi ’27]. It was intense because the odds were stacked against her, but she pulled it off with quick reflexes and smart dodging. Everyone watching was cheering, and it was one of those moments that made the tournament so exciting.” Aya Murata, event organizer and Assistant Dean of Students, took inspiration for the dodgeball tournament from a faculty-student dodgeball event that used to happen over ten years ago. After the success of Fall’s Cluster Olympics, Murata decided to attempt to revive the event. “I had low expectations and was worried. With new events, you never know. PSPA [parents of students of Phillips Academy] spent a lot on food, and I didn’t want them to feel like their effort was wasted. Also, campus engagement has been low lately. I wasn’t sure if dodgeball would appeal to students. But a couple hundred students showed up at some point during the night,” said Murata."
