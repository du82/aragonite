["https://phillipian.net/2024/10/04/students-report-bluelink-and-panet-glitches-during-scheduling-changes"]
title = "Students Report BlueLink and PAnet Glitches During Scheduling Changes – The Phillipian"
description = "Andover’s current digital platform, PAnet 2.0, first emerged in 2021, replacing the original Blackboard-based PAnet, which had been in use since 2005. Although many students do not frequent the site often, preferring Canvas for getting information and keeping track of events, some have reported crashes and heavy lag while attempting to access BlueLink and PAnet. Ashley Choi ’26 spoke about how regularly she uses the two sites. She talked about her experiences with BlueLink, mentioning how the website frequently crashed..."
full_description = "Students report that PAnet 2.0, Andover’s digital platform, experiences a multitude of crashes and lags during periods of high traffic use. Andover’s current digital platform, PAnet 2.0, first emerged in 2021, replacing the original Blackboard-based PAnet, which had been in use since 2005. Although many students do not frequent the site often, preferring Canvas for getting information and keeping track of events, some have reported crashes and heavy lag while attempting to access BlueLink and PAnet. Ashley Choi ’26 spoke about how regularly she uses the two sites. She talked about her experiences with BlueLink, mentioning how the website frequently crashed during times of high student use. “I use BlueLink a lot more often. I use it daily to check my schedule. I use PAnet less frequently. I mostly use it to check the course offerings in the Dean of Studies Office [and] to check the Paresky [Commons] menu. The one thing is that on BlueLink when there’s an update or grades are posted, it often crashes and is inaccessible for a good period of time,” said Choi. Avoiding any possibility of lags and glitches, Shota Lai ’28 took a screenshot of his schedule and set it as his phone’s wallpaper, so he could quickly check necessary information without needing to log into the system repeatedly. He talked about the importance of having easy access to his schedule during his first weeks on campus. “Instead of having to log back into the system every time to check my schedule, I took a screenshot of my course schedule and set it as my phone wallpaper. This way, I could easily check which rooms I needed to go to without opening the app or logging in again… It was hard to remember where all my classes were. Having the room numbers on my wallpaper meant I could quickly glance at my phone and figure out where I needed to go next, which saved me a lot of stress during those first few weeks,” said Lai. Azzaam Abdur-Rahman ’27 expressed his irritation whenever one of the platforms breaks and noted the added pressure that the crashes add to students navigating scheduling during the start of school. He mentioned how BlueLink crashes had started to become an expected occurrence when schedules are released."
