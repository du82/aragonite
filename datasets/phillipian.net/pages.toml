["https://phillipian.net/2025/02/28/clusterball-more-than-a-l-i-f-e-sport"]
title = "Clusterball: More than a L.I.F.E. Sport – The Phillipian"
description = "Clusterball is a winter-term recreational sport for Uppers and Seniors. Around 70 to 75 students, across eight teams, participate in competitive basketball games in the Snyder Center. This week, athletes competed in Clusterball playoffs and finals. Ultimately, the Green Team, captained by John Bancone ’25 and Denzil Pierre ’25, emerged victorious in a 17-16 overtime win.  Thomas Fritz, a Instructor in History, works alongside María Martinez, Troy Turick, and Cesar Dominique-Santos to keep track of game scores and break up..."
full_description = "Clusterball is a winter-term recreational sport for Uppers and Seniors. Around 70 to 75 students, across eight teams, participate in competitive basketball games in the Snyder Center. This week, athletes competed in Clusterball playoffs and finals. Ultimately, the Green Team, captained by John Bancone ’25 and Denzil Pierre ’25, emerged victorious in a 17-16 overtime win. Thomas Fritz, a Instructor in History, works alongside María Martinez, Troy Turick, and Cesar Dominique-Santos to keep track of game scores and break up fouls and altercations. Fritz expressed his appreciation for Clusterball because of his joy for both basketball and interacting with students. “Because we’re with the older students and there’s the need for an adult present on each of the four courts, we time the quarters, keep score, and step in if there’s any controversy that can’t be settled. That’s been minimal all season. Then, just try to get to know more students than you already know in a different context. Have fun with them, cheer them on. Be encouraging when students make good plays or fun shots. I know basketball, I played basketball in high school, I’ve coached. It’s an opportunity to do something,” said Fritz. Fritz explained that eight teams of eight to ten players are formed, then games with eight four-minute periods take place every Monday, Tuesday, Thursday, and Friday. “We spend two weeks before January just letting the teams play and trying to sort out as best we can a balanced league of eight teams while still keeping in mind some friends wanting to be together. Then a round-robin season determines seeding for us. It was 1-8, we went into the playoff round of one through eight, and now the winners will play today in the semifinals and tomorrow for the finals. It’s all for exercise and fun but there’s structure to it, at least in terms of teams, keeping score, and having a schedule,” said Fritz. Michael Williamson ’25 has participated in Clusterball since Upper year and enjoys the sport’s competitive yet low-stakes and enjoyable nature."
