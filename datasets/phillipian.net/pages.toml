["https://phillipian.net/2024/09/26/andover-returns-to-test-mandatory-admissions"]
title = "Andover Returns to Test-Mandatory Admissions – The Phillipian"
description = "For the first time since Covid-19 broke out in 2020, Andover is returning to a test-mandatory admissions policy. Beginning in Fall 2025, students will be required to submit an SSAT, ISEE, PSAT, SAT, or ACT score. Additionally, Andover has become interview optional and lifted a policy requiring students from certain towns to apply as day students. Jim Ventre, Assistant Head of School for Admission and Financial Aid, Peter Dignard, Senior Associate Director of Admission, and Jill Thompson, Associate Dean and..."
full_description = "For the first time since Covid-19 broke out in 2020, Andover is returning to a test-mandatory admissions policy. Beginning in Fall 2025, students will be required to submit an SSAT, ISEE, PSAT, SAT, or ACT score. Additionally, Andover has become interview optional and lifted a policy requiring students from certain towns to apply as day students. Jim Ventre, Assistant Head of School for Admission and Financial Aid, Peter Dignard, Senior Associate Director of Admission, and Jill Thompson, Associate Dean and Director of Admissions, explained several reasons behind this shift to test-mandatory admissions. “At Andover, standardized test results often accurately predict a student’s potential academic success in the first year at Andover as measured by grade point average. Additionally, with worldwide grade inflation, using standardized test results from different schools and regions helps ensure that students are held to the same academic standards in the admission process. Standardized testing also provides valuable data that can be used to identify where Andover may need support,” wrote Ventre, Dignard, and Thompson in an email to The Phillipian. In addition, the admissions office has broadened interview options to include in-person interviews, virtual interviews, and personal video submissions. Through this change, the admissions team aimed to increase application accessibility. “We strive to provide as many interview options as possible to applicant families so they are able to do what is most accessible to them in order to complete an application to Andover. No one should be prevented from applying because their family cannot make a trip to campus or tune in for a virtual interview,” wrote Ventre, Dignard, and Thompson in an email to The Phillipian. Some students disagreed with this new policy. Criticizing standardized tests as a limited metric, Haoyu Zhang ’27 argued that these tests do not reflect personal qualities, a factor he believed equally important in an applicant."
author = "Bailey Xu, Christian Estrada"
