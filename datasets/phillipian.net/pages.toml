["https://phillipian.net/2025/02/28/head-of-school-raynard-kington-invites-jack-buckley-for-fireside-chat-at-asm"]
title = "Head of School Raynard Kington Invites Jack Buckley for Fireside Chat at ASM – The Phillipian"
description = "Andover invited Sean P. “Jack” Buckley, Vice President of People at Roblox, to engage in a fireside chat with Head of School Raynard Kington during last Friday’s All-School Meeting (ASM). Drawing on his work with educational assessments, namely the SAT, Buckley discussed the future of standardized testing, and the use of game-based assessments to evaluate talent in professional settings.  Prior to joining Roblox, Buckley had a diverse career path, ranging from working in the U.S. Navy as a security officer..."
full_description = "Head of School Raynard Kington and Roblox Vice President Sean P. Buckley played Roblox at All-School Meeting. Andover invited Sean P. “Jack” Buckley, Vice President of People at Roblox, to engage in a fireside chat with Head of School Raynard Kington during last Friday’s All-School Meeting (ASM). Drawing on his work with educational assessments, namely the SAT, Buckley discussed the future of standardized testing, and the use of game-based assessments to evaluate talent in professional settings. Prior to joining Roblox, Buckley had a diverse career path, ranging from working in the U.S. Navy as a security officer to helping lead the redesign of the SAT as Vice President of Research on The College Board. A central focus of the ASM conversation was the thought process behind improving student achievement by making job and college evaluations more equitable. Buckley elaborated on the challenges of making standardized testing as accurate and fair as possible. “What I like to say and truly believe is that selecting people for a job or college with a standardized test is the worst way to select them, except for all the other ways. I say that because when you get rid of them, most of the other systems that people invent are not more fair. You lose the ability to even monitor them. Inevitably, people reinvent them. The more you really dig into the research of using standardized assessments correctly, you can’t find a better way to make a system more fair. You know you can’t fix something if you don’t measure it. You just have to be honest about what you’re finding,” said Buckley. Janice Wong ’27 found Buckley’s advice insightful, emphasizing how it offered an in-depth perspective on standardized assessments like the SAT. “I really liked the SAT talk and the thoughts [behind] how the SAT is formatted and the process behind it. I feel like it helps students understand the importance of the SAT and why colleges do it in the first place. However, the questions that Dr. Kington [chooses] should be more related to the student body,” said Wong."
