["https://phillipian.net/2024/02/09/west-quad-north-kicks-off-cluster-dinner-series-with-frozen-themed-event"]
title = "West Quad North Kicks Off Cluster Dinner Series With Frozen-Themed Event – The Phillipian"
description = "As part of a series of Cluster dinners, West Quad North (WQN) hosted a special Frozen-themed dinner in Paresky Commons. During the gathering on January 25, Paresky Commons offered a menu that celebrated the movie, as well as Frozen karaoke set up in Lower Right. Kit Leckerling, Dean of West Quad North, expanded on the cluster dinner as the revival of a valuable tradition from before the Covid-19 pandemic. He noted the dinner’s importance as a model for appreciation towards..."
full_description = "As part of a series of Cluster dinners, West Quad North (WQN) hosted a special Frozen-themed dinner in Paresky Commons. During the gathering on January 25, Paresky Commons offered a menu that celebrated the movie, as well as Frozen karaoke set up in Lower Right. Kit Leckerling, Dean of West Quad North, expanded on the cluster dinner as the revival of a valuable tradition from before the Covid-19 pandemic. He noted the dinner’s importance as a model for appreciation towards the dinners themselves and the Paresky Commons staff. “Cluster dinners are a tradition that the Deans’ team is excited to bring back after a pandemic-related hiatus… Ms. Murata,[ Assistant Dean of Students and Residential Life], has led us in this project, setting up the dates with the Commons team and sharing examples of cluster dinners that she planned when she was Dean of Pine Knoll. I hope that our cluster dinner will get everyone excited to see what the other clusters plan for their dinners, and that people will turn out for these dinners and express their gratitude to the Commons team for putting in the extra effort to make them happen,” said Leckerling. WQN Cluster Co-President Louis Leone ’24 explained the effects of the Covid-19 pandemic on cluster dinners in the past. As the first cluster to host a dinner in multiple years, the Co-Presidents were presented with numerous challenges throughout their planning, ranging from logistical problems to health concerns from school-wide sickness. “It was kind of like flashing a light in the dark, but the Cluster Deans were very supportive and helped us a lot [with] planning. Sometimes you plan everything, but things go sideways at the last second, which is what happened when the classes got canceled and everyone was encouraged to go home. We planned a big event for many people, and then less than half the school is here,” said Leone. Leone continued by explaining the history of cluster dinner themes, as well as how it impacted the Co-Presidents’ selection of the theme. Additionally, he added that Frozen was something that fit the current season well, allowing for more convenient decoration."
