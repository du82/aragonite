["https://phillipian.net/2024/09/17/las-lluvias-unen-a-andover-en-las-olimpiadas-de-los-barrios"]
title = "Las lluvias unen a Andover en las Olimpiadas de los Barrios – The Phillipian"
description = "Acompañados de una lluvia pesada, los estudiantes corrieron hacia el centro del Estadio Phelps en medio de los primeros Juegos Olímpicos de Andover. Agrupados alrededor de las banderas empapadas de sus barrios, los estudiantes iniciaron canciones y bailes improvisados, culminando las festividades de la noche con una demostración del orgullo de sus barrios. Los Juegos Olímpicos fueron creados por la Oficina del Decano para reforzar el sentido de pertenencia en el campus para todos los miembros de la comunidad de..."
full_description = "Acompañados de una lluvia pesada, los estudiantes corrieron hacia el centro del Estadio Phelps en medio de los primeros Juegos Olímpicos de Andover. Agrupados alrededor de las banderas empapadas de sus barrios, los estudiantes iniciaron canciones y bailes improvisados, culminando las festividades de la noche con una demostración del orgullo de sus barrios. Los Juegos Olímpicos fueron creados por la Oficina del Decano para reforzar el sentido de pertenencia en el campus para todos los miembros de la comunidad de Andover. Aya Murata, Vicedecana de Estudiantes y Vida Residencial, creó el proceso de planificación con Tasha Bohorad ’26, reuniendo ideas de más de 150 líderes estudiantiles. “Mi objetivo era crear comunidad, especialmente durante el fin de semana, cuando tradicionalmente no hemos tenido mucho que hacer los sábados. En el pasado, dependía de los grupos estudiantiles para organizar actividades, que en su mayoría no involucraron a asesores, consejeros de la casa ni otros adultos. Pensé que, dado que tenemos esta audiencia cautiva en el campus durante el primer fin de semana, deberíamos tener una manera de generar energía y fomentar relaciones, lo que es la base de un año escolar sólido”, dijo Murata. Después de que los estudiantes se reunieron en el estadio Phelps, los eventos transcurrieron normalmente durante varias horas antes de que la lluvia empezara a caer. Algunos estudiantes abandonaron el estadio y buscaron refugio en el Centro Snyder, mientras que los estudiantes que ya estaban en el campo comenzaron a bailar. Marcela Hernandez ’25, Blue Key Head, habló sobre qué ocurrió en ese momento. “Comencé a bailar bajo la lluvia con mis copresidentes [Abbot], Migyu [Kim] ’25 y Charles [Vest] ’25, y con Jaylen [Dayley] ’25, otro Blue Key Head… Noté que muchos de mis amigos en Abbot también comenzaron a bailar y cantar, y cuando cantas bajo la lluvia, a nadie realmente le importa, porque en verdad no puedes escuchar nada. Entonces se convirtió en un ambiente divertido. Todos invitamos a los estudiantes a bailar bajo la lluvia. Y nunca he sentido tanto espíritu escolar, tal vez nunca en un área tan concentrada, así que fue muy divertido y surrealista unirme a ese gran mosh en medio del campo bajo la lluvia. Fue una experiencia muy divertida, probablemente uno de mis momentos más destacados en Andover”, dijo Hernández."
author = "William Ge, Christian Estrada, Dylan Siegel"
