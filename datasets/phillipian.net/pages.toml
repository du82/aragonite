["https://phillipian.net/2025/01/11/the-history-of-the-writing-center"]
title = "The History of the Writing Center – The Phillipian"
description = "Since its founding in the late 1980s, the Writing Center has journeyed from a tucked-away corner in the basement of the Oliver Wendell Holmes Library to the basement of Bulfinch Hall to its current home in the Tang Institute. What started as a handful of students peer-editing papers, the Writing Center has expanded to host over 25 tutors, accumulating 147 hours of active sessions last fall. Andover’s Writing Center was founded riding off a wave of creating similar spaces dedicated..."
full_description = "From Monday to Tuesday, students and tutors come to the Writing Center in the Tang Institute either aid or seek help in writing, in any subject. Since its founding in the late 1980s, the Writing Center has journeyed from a tucked-away corner in the basement of the Oliver Wendell Holmes Library to the basement of Bulfinch Hall to its current home in the Tang Institute. What started as a handful of students peer-editing papers, the Writing Center has expanded to host over 25 tutors, accumulating 147 hours of active sessions last fall. Andover’s Writing Center was founded riding off a wave of creating similar spaces dedicated to providing feedback on student writing created at colleges and preparatory schools across the country. The Writing Center, though managed by the English department, supports students in writing assignments across all classes with writing including History and Philosophy & Religion classes. Kevin O’Connor, Emeritus Instructor in English, who ran the Writing Center in the early 2000s, elaborated on the motivations behind the Writing Center. He highlighted how it can serve as an important place for academic support. “Especially at a boarding school, it’s important to provide all the benefits that can be provided by an on-campus situation. [Given] the tight schedule of all students and teachers during the day, it only made sense to offer writing help in the evening during study hours. At the time in the ’80s, there was a lot of enthusiasm on a national level for institutions, both colleges and prep schools like Andover, to [have] a writing center… It also coincided with another kind of movement in English department pedagogy: teaching [the] practice of writing across the curriculum,” said O’Connor. The Writing Center has undergone many iterations, evolving from two to four nights a week, paper-based to digital, including scheduled appointments in addition to walk-ins, and changing locations three times before eventually moving to the Tang Institute following a post-Covid-19 boom in demand. Marissa Schwalm, Instructor in English and Director of the Writing Center, described the expansion of the Writing Center after the pandemic."
author = "Christian Estrada, Niki Tavakoli"
