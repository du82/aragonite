description = "First printed in 1857, The Phillipian is Phillips Academy’s weekly student newspaper. It is entirely uncensored and student run."
full_description = "First printed in 1857, The Phillipian is Phillips Academy’s weekly student newspaper. Entirely uncensored and student run, the paper is distributed every Friday from September to June. The Phillipian is 16-20 pages long and consists of five sections: News, Commentary, Sports, Arts and The Eighth Page. Each issue reports on campus news, athletics and performances, publishes insightful opinion pieces and provides original humor. Students involved in organizations covered by The Phillipian will not play any role in assigning, writing, producing, or editing content regarding said organizations. The Phillipian welcomes all letters to the Editor. We try to print all letters, but because of space limitations, we enforce a 500-word limit. We reserve the right to edit all submitted letters. Letters must be responses to articles already published by The Phillipian. We will not publish any anonymous letters. Please submit letters by the Monday of each week to phillipian@phillipian.net or to our newsroom in the basement of Morse Hall. To subscribe, email subscribe @phillipian.net, or write to The Phillipian, 180 Main Street, Andover, Mass., 01810. All contents of The Phillipian copyright © 2025, The Trustees of Phillips Academy, Inc. Reproduction of any material herein without the expressed written consent of The Trustees of Phillips Academy, Inc. and the Editorial Board of The Phillipian is strictly prohibited."
