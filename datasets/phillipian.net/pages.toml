["https://phillipian.net/2024/03/29/gui-lima-24-camd-scholar-presentation-pedagogy-of-the-brazilian-favela"]
title = "Gui Lima ’24 CaMD Scholar Presentation: Pedagogy of the Brazilian Favela – The Phillipian"
description = "Guilherme (Gui) Lima ’24 hosted his CaMD Scholar presentation titled “Pedagogy of the Brazilian Favela: Fighting a Century of Oppression Inside the Classroom” on Friday, March 22. In his presentation, Lima delved into the sensationalization and demonization of the Brazilian favela. By dismantling stereotypes about favelas, Lima portrayed a story of struggle, resilience, and innovation within the community during times of social and political oppression. Lima emphasized how education has changed the lives of many impoverished students in Brazil, giving..."
full_description = "Guilherme (Gui) Lima ’24 hosted his CaMD Scholar presentation titled “Pedagogy of the Brazilian Favela: Fighting a Century of Oppression Inside the Classroom” on Friday, March 22. In his presentation, Lima delved into the sensationalization and demonization of the Brazilian favela. By dismantling stereotypes about favelas, Lima portrayed a story of struggle, resilience, and innovation within the community during times of social and political oppression. Lima emphasized how education has changed the lives of many impoverished students in Brazil, giving them a second chance. He closed his presentation by talking about how hope will create a better future and bring a new light into favelas. “Hopelessness is despair and immobilism. Hopelessness is to accept the oppression and violence that favelas face every day. In contrast, hope is to fight stereotypes, police brutality, and historical oppression in the form of continued illegitimacy. Hope by itself won’t transform the situation in favelas, but no struggle happens without hope,” said Lima in his presentation. Being Brazilian himself, Lima reflected on why this topic sparked his interest and how a previous CaMD talk inspired him to explore his own identity more. He discussed how he was fascinated by the opportunity to dig deeper into topics that matter to him and be able to share them with a large crowd. “I’ve always really liked the CaMD Scholar program. My first [CaMD Talk] was Frank Zhao [’22]’s presentation, where he presented on three generations of Chinese students at Andover and the connections they share throughout history. It was really moving to me. The opportunity to share these topics that connect to your identity with such a large audience and to be able to do so much research and to explore at a depth… was so cool to me,” said Lima. Lima also discussed some of the challenges he faced when preparing for the presentation. Specifically, how he found trouble when thinking of the perfect way to represent stories that came from real people."
