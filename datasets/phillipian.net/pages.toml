["https://phillipian.net/2025/01/24/nordic-skiing-finds-success-in-first-classical-race-of-season"]
title = "Nordic Skiing Finds Success in First Classical Race of Season – The Phillipian"
description = "The Nordic Skiing Team found success in its first classical race of the season at Proctor Academy led by Captains Luke Williamson ’25 and Sage Preston ’25, the team exhibited strong individual performances and an encouraging culture. Sebastian Vermut ’27 noted the challenges that came with Proctor’s course. Vermut said, “It was four laps of a loop and there is a very sharp hairpin turn which — on Nordic skis — is really hard to navigate unless you’re really skilled.”..."
full_description = "The Nordic Skiing Team found success in its first classical race of the season at Proctor Academy led by Captains Luke Williamson ’25 and Sage Preston ’25, the team exhibited strong individual performances and an encouraging culture. Vermut said, “It was four laps of a loop and there is a very sharp hairpin turn which — on Nordic skis — is really hard to navigate unless you’re really skilled.” “It was definitely one of the harder races this year. It was the coldest race of the year by far. I believe the temperature was -5 degrees [Fahrenheit], and wind chill was just a major factor,” said Bria. Leading the Boys Nordic team was Luke Williamson ’25 and following close behind was a tight pack of skiers including Ansel Bartell ’28, Noah Binkowski ’26, and Sebastian Vermut ’27. Williamson noted that this tight-knit finish was encouraging and showed a lot of progress. Williamson stated “One of our racers, Sebastian, did great. I’m usually first on the team, and Ansel and Noah Binkowski are both strong, but Sebastian — this is his first year, and he’s a [Lower]. We didn’t expect him to be up there, but he was right with Ansel and Noah. It was awesome to see a newer guy on the team pushing us to ski better.” Vermut added onto Williamson’s statement, highlighting the uniqueness of finishing together alongside his teammates. “One of the coolest things I’ve been a part of in terms of races was that the second, third, and fourth spots [for team placement] were all taken by me, Noah Binkowski, and Ansel Bartell, and we finished within a couple of seconds of each other, which is really unusual,” said Vermut. A strong core on the Girls Nordic team led by Preston, Dylan Siegel ’26, and Lauren Montgomery ’25 also boosted the team’s performance. Vermut emphasized their dedication and consistency on a smaller girls roster. Vermut said, “With a really limited number of girls on the team who can actually make the Wednesday races. Sage Preston, Dylan Siegel, and Lauren Montgomery always make themselves known even with such a small group. They all had great performances at Proctor.”"
