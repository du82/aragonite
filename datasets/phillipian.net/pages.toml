["https://phillipian.net/2024/04/19/head-coach-brian-faulk-00-directs-his-coaching-with-a-hands-on-approach"]
title = "Head Coach Brian Faulk ’00 Directs his Coaching with a Hands-On Approach – The Phillipian"
description = "Andover Golf Head Coach Brian Faulk ’00 first took on golf during his childhood. Inspired by his father and grandfather, two avid and experienced golfers who extended their knowledge of the sport to him, Faulk went on to pursue golf at Andover. Although he did not play in college, he now continues to participate in many amateur and mid-amateur events during the summers. Last year, Faulk was one of 55 to qualify for the Mass-Amateur Championship, narrowly missing 76-71 in..."
full_description = "Andover Golf Head Coach Brian Faulk ’00 first took on golf during his childhood. Inspired by his father and grandfather, two avid and experienced golfers who extended their knowledge of the sport to him, Faulk went on to pursue golf at Andover. Although he did not play in college, he now continues to participate in many amateur and mid-amateur events during the summers. Last year, Faulk was one of 55 to qualify for the Mass-Amateur Championship, narrowly missing 76-71 in the par-72 course. In an email to The Phillipian, Faulk noted his appreciation for the meaningful relationships that form between coaches and players. Even though golf is an individualistic sport, Faulk views it as a chance to find community outside of the classroom and even engage in some of the tournaments that his players partake in. Faulk wrote, “I teach and coach at Andover to work with such a dynamic group of student-athletes. I enjoy not only the competition, but also the trips in the rally wagons and the opportunity to mentor students inside and outside of the classroom.” Jack McVeigh ’25 echoed Faulk’s sentiments, highlighting the genuine connections he fosters with every player. McVeigh noted that this trait sets Faulk apart as a successful coach. “Mr. Faulk is very dedicated in what he does. He cares a lot about not just how we do as a team but each one of us individually as players and as people… He is really successful as a coach and makes us a better team all together,” said McVeigh. McVeigh expanded on Faulk’s coaching style, which focuses playing real matches with his players and providing detailed and individual feedback. McVeigh said, “I’ll just say often what often happens is I’ll be playing with him and I’ll make a mistake or I’ll do something that he thinks I could do better and then he’ll, after the hole is over, just have a little chat with me about what I could have done differently in a certain scenario. So I think just being really personal with his feedback when he gives it and it has been very helpful to me this season in realizing what I can do better individually.”"
