["https://phillipian.net/2025/01/17/girls-hockey-wins-3-games-in-5-days-furthering-winning-streak"]
title = "Girls Hockey Wins 3 Games in 5 Days, Furthering Winning Streak – The Phillipian"
description = "1/11- Andover; 2, Choate; 1 1/13 – Andover; 8, Brooks; 0 1/15 – Andover; 11, K.U.A; 0 Girls Hockey (7-1-1) took on Choate on Saturday (2-1), Brooks on Monday (8-0), and Kimball Union Academy (KUA) on Wednesday (11-0). The team was victorious against all 3 teams, now on a 7 game-winning streak.  Kimberly Duplessis ’27 noted the pace and shifts in the game that helped increase the intensity on the ice. “Our game against Choate was fast-paced and aggressive. They..."
full_description = "Girls Hockey (7-1-1) took on Choate on Saturday (2-1), Brooks on Monday (8-0), and Kimball Union Academy (KUA) on Wednesday (11-0). The team was victorious against all 3 teams, now on a 7 game-winning streak. Kimberly Duplessis ’27 noted the pace and shifts in the game that helped increase the intensity on the ice. “Our game against Choate was fast-paced and aggressive. They came up on us 1-0, the first shift into the game. So that definitely increased our intensity. We fought hard throughout the game and ended up tying it up [1-1]. Then we made it 2-1 with about a minute left in the third period and snuck away with a W,” said Duplessis. Despite a lack of penalties called on Choate, Duplessis commended Molly Driscoll PG’25 for her unwavering composure. Duplessis said, “Molly Driscoll played well. There were a few times where [Choate] was hitting her and [the referees] should have called penalties. They didn’t, but she didn’t like to retaliate and she got back, and was working hard all game.” Following its game against Choate on Saturday, the Girls Hockey team took on Brooks on Monday. According to Vanessa Hall ’28, the style of play had a distinct change from Saturday to Monday, despite no practice in between. “We played well, and this game was much different than our last game, Choate, which was on Saturday. We didn’t have a practice in between, because it was Friday and we don’t have Sunday practices, but we didn’t play well at Choate, so we knew that we had to play well today to redeem ourselves. So, we just came out fast from the first puck drop, and scored quickly,” said Hall. Duplessis added on to Hall, highlighting the pacing and energy before the game and on the ice. The drive to Brooks was high energy, and once on the ice, the team managed to quickly get points within the first period. “We came out with a lot of energy. It was a very fast-paced game to start. It was three nothing going into the second period, so we were excited and we came out fast. We all played really well as a team,” said Duplessis."
