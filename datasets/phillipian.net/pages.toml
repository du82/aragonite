["https://phillipian.net/2025/02/28/class-assassin-continues-amongst-the-most-dedicated-of-contestants"]
title = "Class Assassin Continues Amongst the Most Dedicated of Contestants – The Phillipian"
description = "For weeks now, students have walked around campus with pillows taped to their chests, newspapers in their hands, and have not used their phones at all throughout the school days. For the most dedicated Class Assassin competitors, these are necessary measures to avoid being caught off guard and eliminated. Class Assassin is a long-standing game in which contestants are assigned a target in their grade. In order to eliminate their targets, students must photograph their opponents in a specific action,..."
full_description = "For weeks now, students have walked around campus with pillows taped to their chests, newspapers in their hands, and have not used their phones at all throughout the school days. For the most dedicated Class Assassin competitors, these are necessary measures to avoid being caught off guard and eliminated. Class Assassin is a long-standing game in which contestants are assigned a target in their grade. In order to eliminate their targets, students must photograph their opponents in a specific action, such as using their phone or without a specified object. Behind the scenes, Class Assassin is a large-scale operation, with emails frequently going out about new targets and challenges, and frequent updates on Instagram regarding recent eliminations. As the game progresses, challenges have become more extreme and players have become more intense. Satabhisha Sarkar ’27, a member of her class’s top eight assassins, spoke on how her approach to the game has shifted since the start of the challenge. “At first, when the rules were things like you have to be holding onto The Phillipian or you can’t be on your phone, I was like I am going to very stubbornly follow these rules… We recently hit the top 12 and that’s when [the organizers] encouraged us to figure out who the other players were,” said Sarkar. She continued, “It implied that you should now start planning around who our opponents are [and] who our potential assassins could be… We then started interacting with the [other] players a bit more, and I’ve heard of certain partnerships and interactions between players.” Class Assassin also provides a way for students to meet new people in their grade and acts as a commonality. Sarkar was one student who mentioned this, noting how it’s become integrated in many of her friendships. “It’s really something that a lot of people are following. I don’t know about other grades, but at least in the class of ’27 and in my friend group, I’ve found that a lot of people are invested in the game, even though they’re not playing, because their friends are in the game. As it gets more high stakes, people realize ‘this is serious,’ [or] ‘so and so’s a really good player.’ It gives us something to talk about, almost like a shared hobby, and kind of bridges the gap between our differences by giving us a common interest,” said Sarkar."
author = "Niki Tavakoli, Krissy Zhu"
