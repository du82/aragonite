["https://phillipian.net/2025/01/17/winter-wardrobe-essentials"]
title = "Winter Wardrobe Essentials – The Phillipian"
description = "As Winter Term approaches, students prepare for the cold by layering on their favorite winter essentials. This week, we asked Andover students about their most beloved pieces of winter clothing. Whether it be a cohesive outfit or a specific piece of clothing, there is more to clothing than what meets the eye. Anya Casey ’28 Right now, I have on a Berkley sweater, with a T-shirt underneath, sweatpants, a jacket, a scarf, gloves, thick socks, and winter boots. The coat..."
full_description = "As Winter Term approaches, students prepare for the cold by layering on their favorite winter essentials. This week, we asked Andover students about their most beloved pieces of winter clothing. Whether it be a cohesive outfit or a specific piece of clothing, there is more to clothing than what meets the eye. Right now, I have on a Berkley sweater, with a T-shirt underneath, sweatpants, a jacket, a scarf, gloves, thick socks, and winter boots. The coat was a gift from my mom’s work, the scarf I got at World Market, the shirt was a gift from when my dad was traveling, the T-shirt I got at 5-below, the sweatpants are a mystery, the boots I ordered on Amazon before a came here, and I believe I stole these socks from my brother. I think it’s always good to have a T-shirt and a sweatshirt and a jacket, so then your torso is warm. I also have a cool [hair]clip that I got at Hot Topic. [When it comes to buying winter clothes,] definitely buy thick clothing, buy sweatshirts, buy thick coats. Buy something to cover your face since that’s what gets the coldest. Buy gloves, because you lose a lot of heat in your hands, and on your head, and in your face. And always wear a T-shirt under what you’re wearing if you can, just because it adds extra layers. “I was just shopping with my mom, and I actually wasn’t shopping for [this scarf] specifically, but I came upon it and I’d been looking for a scarf that’s chunky and had neutral colors… My mom has worn a lot of scarves since I was little but I never wore them. And now after I’ve gotten closer with her, I think I’ve gotten more evolved with her style as well… I think the material is very nice and it absorbs heat so it’s very good for cold weather… It adds a lot more to an outfit, especially in the winter when you can only wear a coat.” “I have two Super Puffs, and I wear mine every day because it’s very warm and it’s also stylish because it enhances my outfits… I like my cropped one because the pockets are higher for me, so it’s easy for my hands to go in. I also feel like because it’s shorter it adds to the look… I feel like my personal style is just plain, you know what I mean? But, you know, jeans and a sweater or something, but I feel like because you can get Super Puff in a bunch of different colors and you can get it shiny, I feel like it can represent anyone’s style.”"
