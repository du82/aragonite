["https://phillipian.net/2024/10/03/quad-day-2024-a-night-to-remember"]
title = "Quad Day 2024: A Night to Remember – The Phillipian"
description = "Walking by the Quads on Saturday evening, students were bound to be drawn into the overflowing energy centered between the joint clusters. With food trucks in one corner, karaoke and games in another, and mini stations set up throughout, every attendee was able to find some form of enjoyment. This occasion is part of the annual event, Quad Day, in which various West Quad South and West Quad North dorms set up activities for the whole school to partake in...."
full_description = "Walking by the Quads on Saturday evening, students were bound to be drawn into the overflowing energy centered between the joint clusters. With food trucks in one corner, karaoke and games in another, and mini stations set up throughout, every attendee was able to find some form of enjoyment. This occasion is part of the annual event, Quad Day, in which various West Quad South and West Quad North dorms set up activities for the whole school to partake in. As students reminisced about the excitement that has arisen since this day, they looked forward to the changes and hosting of next year’s Quad Day. From student accessibility to logistical improvements, this year’s event saw a few changes. Magdalena Mercado ’26 stated that this year’s Quad Day was particularly enjoyable as more students could attend due to the time change and the more permitting weather, as opposed to last year’s rain. She also thought that the organization of activities was carried out smoothly. “This is the first time I have ever been to a Quad Day that has been hosted in the evening, which is just a more convenient time for most people. It wasn’t raining and it was pretty warm, so there were a lot of people there. Last year, the setup of things was clumped on one side, but this year, they did a good job organizing the various activities, some in front of dorms or scattered by the Quads and in the clusters. It was fun for everyone, regardless of whether a student just attended Quad Day, or helped to organize it,” said Mercado. For new students, Quad Day offered a perfect opportunity for meeting new people and socializing with recently made friends. Influenced by returning students who spoke positively of past Quad Days, Eric Myung ’28 expressed his anticipation for the event, adding that though he was not on campus, he decided to come back solely for the event. “I decided to go to Quad Day because I thought it would be a good opportunity to meet some new people and have fun with my friends. I do live in the [Quads], so it’s also very accessible for me. Though I was supposed to be out of campus for the weekend, I came back because I really wanted to see the event,” said Myung."
