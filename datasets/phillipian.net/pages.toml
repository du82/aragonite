["https://phillipian.net/2025/01/10/truly-intelligent-head-basketball-coach-terrell-ivory-draws-connection-between-coaching-and-teaching"]
title = "Truly Intelligent: Head Basketball Coach Terrell Ivory Draws Connection Between Coaching and Teaching – The Phillipian"
description = "Boys Basketball Head Coach Terrell Ivory ’00 first joined the Andover community as a postgraduate student, playing Varsity basketball. He went on to have a successful career at Davidson College and had his first basketball coaching experience with a local Amateur Athletic Union (AAU) team. After college, Ivory took his first official coaching position at Blair Academy. Ivory’s connection to the Andover community remained strong throughout his period away, as he constantly connected with his former Andover coach, Leon..."
full_description = "Boys Basketball Head Coach Terrell Ivory ’00 first joined the Andover community as a postgraduate student, playing Varsity basketball. He went on to have a successful career at Davidson College and had his first basketball coaching experience with a local Amateur Athletic Union (AAU) team. After college, Ivory took his first official coaching position at Blair Academy. Ivory’s connection to the Andover community remained strong throughout his period away, as he constantly connected with his former Andover coach, Leon Modeste (Mo). Coach Mo played a pivotal role in Ivory’s return to the Andover campus. “I had a good experience here as a student, and I played football and basketball. I enjoyed, appreciated a lot of the relationships, the connections I made with other kids, but also with the adults here. I always stayed in touch with Coach Mo. We always sort of talked it up, me coming back to be a coach. At some point, I think he decided that he was moving away from coaching basketball, and he reached out to me while I was coaching at Colgate,” said Ivory. After being drawn back to Andover, he immediately made his mark on the boys basketball program. Beyond basketball instruction, Ivory strives to teach his players skills applicable to the outside world, such as resilience and sportsmanship. “I think of coaching as being a teacher, but not necessarily in the classroom. There are a lot of things that I can do to help athletes that play for me that have nothing to do with basketball. Like, how to deal with adversity, how to be a good sport, how to be a good teammate, how to learn, how to deal with failure, how to make mistakes and learn from those mistakes. So there’s just a lot of resiliency, the ability to persevere through challenges. There’s so many things that as a coach, I feel I can help my kids with. Those things have a lot to do with basketball, but again, it’s about how those kids handle obstacles that really matter, which is life stuff,” said Ivory."
