["https://phillipian.net/2024/02/15/girls-basketball-loses-two-wins-one"]
title = "Girls Basketball Loses Two, Wins One – The Phillipian"
description = "2/9 – Andover: 36, Dexter Southfield: 84 2/10 – Andover: 40, Pingree: 37 2/14 – Andover: 38, BB&N: 50 On Friday, Andover Girls Basketball lost to a talented Dexter Southfield (Southfield) team. The team bounced back with a hard fought victory against Pingree on Saturday but then fell to BB&N this Wednesday. Its record stands at 7-0-12. According to Head Coach Jennifer Weissbach, Southfield proved to be a tough opponent for Andover. Although Dexter Southfield took control of the majority..."
full_description = "2/9 – Andover: 36, Dexter Southfield: 84 2/10 – Andover: 40, Pingree: 37 2/14 – Andover: 38, BB&N: 50 On Friday, Andover Girls Basketball lost to a talented Dexter Southfield (Southfield) team. The team bounced back with a hard fought victory against Pingree on Saturday but then fell to BB&N this Wednesday. Its record stands at 7-0-12. According to Head Coach Jennifer Weissbach, Southfield proved to be a tough opponent for Andover. Although Dexter Southfield took control of the majority of the game, Coach Weissbach praised the effort that Andover sustained until the very end. Coach Weissbach said, “ Southfield came out strong and set the tone early on. We didn’t start the way we wanted to, but I think our halftime together, we talked about how and where we get our energy from and the team responded in the third quarter really well. I was very proud of how we responded. We ended up closing out the game in a way where I think we left proud of our effort. I am excited to see all the ways in which we have to grow.” Andover maintained team morale against Pingree on Saturday, despite the hard loss the day before. That energy translated into an offensively and defensively strong game, noted Akari Imai ’25. “Our energy was really good and especially coming off of our loss on Friday, I feel like our entire team was really locked in and motivated to do well and play hard from the very beginning of the game. The first quarter of the game, I think we did really well with not only our offense, but also we had really good defense and really good energy on the bench and we just all had really high energy and we worked really hard for that win,” said Imai. Coach Weissbach applauded the team’s transitions against Pingree. In preparation for the game, the players worked on being agile and fast-paced ball movement up the court. “We’ve been working hard on running in transition, so pushing the ball up the court… I asked the team on Saturday, I said specifically, I want us to run. I want us to run hard. I want us to push the ball up the court every possession and I think we did that beautifully and it was really awesome to watch and be a part of,” said Coach Weissbach."
