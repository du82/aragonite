["https://phillipian.net/2024/10/25/wrestling-co-captains-dani-nugent-25-and-julian-rios-26-earn-all-american-status-at-2024-defense-soap-super-32-challenge"]
title = "Wrestling Co-Captains Dani Nugent ’25 and Julian Rios ’26 Earn All-American Status at 2024 Defense Soap Super 32 Challenge – The Phillipian"
description = "Co-Captains of the Wrestling team Dani Nugent ’25 and Julian Rios ’26 competed in the 2024 Defense Soap Super 32 Challenge, both earning All-American Status after finishing seventh and fourth respectively on the weekend of October 12. The Defense Soap Super 32 Challenge is a highly competitive wrestling tournament featuring top-ranked athletes from across the nation. The Andover Wrestling Program now has two of the three Massachusetts All-Americans. Rios described his pre-tournament preparations, attributing his successes to the people around..."
full_description = "At the tenth Annual Female Wrestling Tournament, Dani Nugent ’25 was named Outstanding Wrestler and won first place in her respective weight class Co-Captains of the Wrestling team Dani Nugent ’25 and Julian Rios ’26 competed in the 2024 Defense Soap Super 32 Challenge, both earning All-American Status after finishing seventh and fourth respectively on the weekend of October 12. The Defense Soap Super 32 Challenge is a highly competitive wrestling tournament featuring top-ranked athletes from across the nation. The Andover Wrestling Program now has two of the three Massachusetts All-Americans. Rios described his pre-tournament preparations, attributing his successes to the people around him. Last year, Rios competed in the Super 32 Challenge with a sprained ankle, placing 20th in the 106-pound weight class. “I owe all my coaches and my drill partners a lot to my success on the wrestling mat. I was doing the right things off the mat… I was running more often and working out on the side doing little things, eating right, getting mentally. My mental preparation was good, I wasn’t too worried about the tournament all the way until I actually got there. That helps a lot because you don’t want to build up this nervous feeling,” said Rios. Nugent joined her wrestling club, Doughboys in Lowell, last summer after competing at Nationals. Over the last year, Nugent refined her wrestling even more and has closely monitored her routine to boost her performance. “These practices [at Doughboys] have ranged from folkstyle practices with my club team, as well as private practices with my dad and a few other girls, so it’s been a lot of fine-tuning, perfecting what I’ve been working on for the past years. As well as just focusing on what’s good for my body, what I’m taking in, what I’m lifting. Overall just getting myself into a better routine than I had been in the past, which was a big factor,” said Nugent. With over 2,250 wrestlers at the tournament, Rios shared his excitement in watching other talented wrestlers compete and working with his teammates. He also appreciated the opportunity to see his efforts in training come into fruition in competition."
