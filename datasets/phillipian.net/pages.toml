["https://phillipian.net/2025/01/24/deco-on-the-techno-how-are-andover-students-decorating-their-technology"]
title = "Deco on the Techno: How Are Andover Students Decorating Their Technology? – The Phillipian"
description = "From sentimental stickers and memorabilia to showcases of artistic ability, the phone and computer cases of Andover students sport a variety of decorations. Each unique case demonstrates the distinct character of each student, becoming an integral part of many students’ identities.  Lilienne Zhang ’25 Every single [sticker] shows some facet of my identity or what I love. A lot of them have to do with animals and games, [such as] Webkinz… I’ve always been somewhat of a decorator. I like..."
full_description = "From sentimental stickers and memorabilia to showcases of artistic ability, the phone and computer cases of Andover students sport a variety of decorations. Each unique case demonstrates the distinct character of each student, becoming an integral part of many students’ identities. Every single [sticker] shows some facet of my identity or what I love. A lot of them have to do with animals and games, [such as] Webkinz… I’ve always been somewhat of a decorator. I like decorating photo cards and albums and stuff like that, so I have a lot of stickers in my room… I feel like, other than fashion and makeup, which are both ways I like to express myself, a laptop is a very easy, convenient way for people to get to know you. I have a keyboard cover that I painted when I was in fifth grade. It’s [made] with acrylic markers and acrylic paint. I painted a Chinese tiger-dancing person… some pencils, and some turtles, inspired by the phrase “Turtles all the way down.” [There] is the moon, which is Chang’e, the Chinese legend… My laptop is a really big part of my identity because I’m a writer, so it has to be “me.” I have to be able to identify with it when I see it… So, I wanted to make a new case that was actually reminiscent of who I am. This represents my personality, because I definitely love having cutesy things, but I also like wearing more simple things as well. I really like these [stickers] because sometimes I just take off stickers and give them away to people… [Giving the stickers is] very collaborative for me. The stickers here, I had a friend choose them, and then I was the one to stick them on, and I [can] give them away. It’s more than just me on this laptop, and also, it feels very comforting every time I see it, and it inspires me to do work. My friend got me this case because she knows that I did dance for 11 years and that I really enjoyed doing ballet when I did it. And I also really like it just because the design is really pretty… The wallet is mainly for functionality. So when I’m going in and out of buildings, I can scan my Blue Card or keep my debit card. I chose the blue because I wanted a neutral-ish color, and it reminded me of Andover… I feel like it’s just colorful but not too, I guess, over the top, which kind of reflects me. The ballet shoes represent the time that I did dance and how it was such a big part of my life."
author = "Maggie Shu, Alexandra Lin"
