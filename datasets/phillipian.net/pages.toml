title = "10 Questions with Nick Zufelt – The Phillipian"
description = "Nick Zufelt is an Instructor in Mathematics, Statistics, and Computer Science, a House Counselor in Stevens House, and an advisor for the BRACE Board. As a Tang Institute Fellow, Zufelt co-founded the Ethi{CS} project to introduce ethical thinking into the classroom. He received a Ph.D. in Mathematics from the University of Texas at Austin and has done extensive research on topics including manifolds and astrophysics. He enjoys game design, systems thinking, and finding meaningful connections within the Andover community.  ..."
full_description = "Nick Zufelt is an Instructor in Mathematics, Statistics, and Computer Science, a House Counselor in Stevens House, and an advisor for the BRACE Board. As a Tang Institute Fellow, Zufelt co-founded the Ethi{CS} project to introduce ethical thinking into the classroom. He received a Ph.D. in Mathematics from the University of Texas at Austin and has done extensive research on topics including manifolds and astrophysics. He enjoys game design, systems thinking, and finding meaningful connections within the Andover community. I finished my graduate degree, then I went into a postdoc in London, so I lived in London for one school year. At that time I was doing that research, and I was considering doing more research or teaching… This teaching position [at Andover] came up around the same time I was teaching myself coding because of the very possible option that I didn’t get a math position, which is fantastically hard to get. I was learning a lot of machine learning, data science, and computer science. I took a class in college about it, but I am mostly self-taught… This position came up, it was a position that was partially math, partially CS, and I jumped on it cause it sounded great. I always tell my students at the start of a CS class that the wealth of material you ought to learn on your own online is much stronger in computer science than basically any other field. You can learn to code anywhere online, and you can learn to put anything online. “So then, what are you doing in class?” I think that’s reasonable to ask and this is what I always try to talk with students at the beginning of the term. You’re getting not just access to the teacher, but access to a cohort of people, so you really need to lean into that aspect of the course if you want to get anything useful out of it at all, because you can just learn this stuff online. If you want to learn it well and learn how to collaborate and communicate with others and code, build, and think abstractly, you need a lot of the other things that complement the coding skill that most high-school students think of. But computer science is more than just learning to code."
author = "Vedant Bajaj, Christian Estrada"
