description = "In 2022, 2023 and 2024 Phil co-produced the premier symposium on Design & AI in Europe. These sold out events brought together researchers, industry, and students with world class speakers and workshops. For 2022 “Are we designing the AI we need?” We listened to inspiring keynotes by Elizabeth Churchill (Google), Matt Jones (Lunar Energy), John"
full_description = "Design & AI Symposia In 2022, 2023 and 2024 Phil co-produced the premier symposium on Design & AI in Europe. These sold out events brought together researchers, industry, and students with world class speakers and workshops. For 2022 “Are we designing the AI we need?” We listened to inspiring keynotes by Elizabeth Churchill (Google), Matt Jones (Lunar Energy), John Zimmermann (HCI Institute Carnegie Mellon University) and Caroline Sinders. For 2023 “Shaping the Future(s)” we experienced keynotes from Shalini Kurapati (CEO Clearbox.AI), Elsje van Niekerk (Co-Owner Oltmans van Niekerk), Kyle McDonald (Artist Working with Code) and Stephan Wensveen (Full professor of Constructive Design Research in Smart Products, Services and Systems, TU/e) The 2024 “Embedding the Magic and the Real” Design & AI Symposium was held in Eindhoven in tandem with the Dutch Design Week. It featured keynotes by Savannah Kunovsky (Managing Director, IDEO), Tobias Revell (Design Futures Lead, Arup), and Bas van de Poel (Co-founder and Innovation Director, Modem)."
