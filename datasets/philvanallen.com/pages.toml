full_description = "Reimagining the Goals and Methods of UX for ML/AI This article was presented as part of the 2017 Spring AAAI Symposium at Standford University – It challenges UX conventions and proposes new approaches for Machine Learning (ML) and Artificial Intelligence (AI). I discuss how designers can reimagine the goals and focus of UX for the unique potentials of autonomy. Using simple intelligence, machine learning, and unique personalities as design materials, we can shift from crafting task oriented experiences, to building diverse, autonomous ecologies that support collaborative exploration and creativity."
