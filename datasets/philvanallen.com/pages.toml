["https://philvanallen.com/portfolio/delft-ai-toolkit"]
title = "Delft AI Toolkit - Phil van Allen - Commotion.AI"
description = "The Delft AI Toolkit is a system for designing and researching smart things."
full_description = "Delft AI Toolkit The Delft AI Toolkit is a system for designing and researching smart things. It provides a visual authoring environment that simplifies the prototyping of machine learning, cognitive APIs, and other AI approaches. The node-and-connection visual graphs combine the advantages of behavior trees and dataflow models to create smart behavior in autonomous devices. The Delft AI Toolkit enables quick prototyping, experimentation and iteration of AI interactions with powerful nodes that support behavioral sequences, sensing, decision making, state management, and the simple invocation of AI techniques such as speech to text, text to speech, and visual object recognition. https://github.com/pvanallen/delft-ai-toolkit"
