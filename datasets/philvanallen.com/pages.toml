title = "Critical Prototyping – A New Approach - Phil van Allen - Commotion.AI"
description = "This article defines a new approach for prototyping that's appropriate for designing with new technologies like AI and XR. Critical Prototyping is different from a conventional product design approach, which is about refining to a final design. Instead, Critical Prototyping is oriented towards finding and inventing the new."
