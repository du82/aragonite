["https://phoboslab.org/log/2019/09/voidcall-making-of"]
title = "PhobosLab"
full_description = '''Dominic Szablewski, @phoboslab — Monday, September 23rd 2019 Voidcall – Making Of Like last year with Underrun, I participated in this year's js13kGames – a JavaScript game development competition with a file size limit of 13kb, including code, assets and everything else. My entry was Voidcall, a Real-time Strategy game. Play Voidcall – A WebGL Real-time Strategy game in 13kb of JavaScript Recently, I played the original Command & Conquer (later dubbed "Tiberian Dawn") again. I spent a whole summer of my childhood exploring the game in a friends basement. Compared to later real-time strategy games it's quite simple, yet very compelling. I set out to capture a bit of the game's essence for js13k. Squeezing everything I wanted for this game into the tiny size of 13kb was a tough challenge. Much more so than last year. The technology is quite ambitious: a 3d rendered height map, fully polygonal and textured models with smooth keyframe interpolated vertex animations, comprehensive mouse control with accurate picking and solid pathfinding. It's a lot. This article presents the various pieces of the puzzle with in-depth explanations. Everything is open source, so you can follow along on github. Terrain Generation Initially I thought about implementing the game in a simpler Canvas2D rendered view, but realized that I would need a lot of different graphics for the map (and much more for animated characters). Using a 3d rendered height map was the easier way to get a good looking terrain on the screen. The collision map: 2-octave perlin noise, converted to 1bit An initial 256x256 Canvas2D image is generated using a perlin noise function. This function produces random values with a smooth gradient for nearby pixels. The key is to layer several perlin noise values with different frequencies on top of each other. In this case each pixel is the sum two perlin noise values. You can create the broad features of the terrain with just one value at a low frequency and add finer detail with a second one at a higher frequency. for (let y = 0, i = 0; y < MAP_SIZE; y++) { for (let x = 0; x < MAP_SIZE; x++, i++) { let height = noise(x/35, y/35) + // low frequency noise(x/50, y/50); // high frequency } } While the result is visually already quite pleasing, it's not of much use for the game I wanted to build. I needed discrete distinction between walkable and un-walkable terrain for the pathfinding to work properly. So this image is converted to just 1 bit with a carefully chosen threshold. This 1 bit image becomes the initial collision map for the game logic. For the height map that is used for the graphics this collision map is further processed. The first step is a bit of blur, so we get some smooth edges around the hills again. After that a bunch of high frequency perlin noise is layered on top. The height map: blurred and detailed with high frequency perlin noise Unfortunately, the Canvas2D API does not provide a cross-browser blur function. Applying a box blur on each pixel using a convolution filter is not only computationally expensive, but also requires a bit more code than I wanted to spend on this. My solution was just to draw the height map on top of itself a bunch of times: // Cheesy blur ctx.globalAlpha = 0.2; for (let x = -2; x < 2; x++) { for (let y = -2; y < 2; y++) { // Draw the canvas onto itself with the x,y offset ctx.drawImage(canvas, x, y); } } For the details a number of perlin noise values are computed and mashed together until it looked right. The higher frequency noise is applied more strongly to the hills and less so to the valleys. for (let y = 0, i = 0; y < MAP_SIZE; y++) { for (let x = 0; x < MAP_SIZE; x++, i++) { let coarse = px[(y*MAP_SIZE+x)*4], mid = noise(x/12, y/12) * 8, fine = noise(x/30, y/30) * 4 + noise(x/10, y/10) * 2 + noise(x/5, y/5) + noise(x/3, y/3), height = coarse * 6 + // Basic map height from collision fine * 300 + // Details on everything mid * 5 + // Mids on everything (coarse * (mid+5)) * 2.5 + // Extra mids on hills (coarse * (fine+1)) * 1.5 + // Extra details on hills ((255-coarse) * mid*-1)*0.5; // Inverted mids in valleys } } Now that we have the height map, we can create the 3d geometry. For each pixel of this height map a quad (2 triangles) is created and pushed to the render buffer. Each quad is randomly textured with one of two different grass-like tiles – just enough to make it not look repetitive. The normal vector (the vector perpendicular to the surface) is computed once for each quad. This is later used for light calculations in the shader. The same normal vector is initially stored for each of the 4 vertices of the quad. This results in a flat shaded look. The final buffer for the height map contains 131k triangles consisting of 393k vertices, each described by 8 Float32 values. In total about 12 MB of data - which may sound like a lot, but your GPU laughs at these numbers. I'll talk more about how this is actually rendered later. Flat shaded terrain, without smooth normals. Interesting, but not what I was going for. Computing smooth normals turned out to be a particularly hairy problem to solve in this very size constrained code. The solution I ended up with is to walk through the otherwise final buffer, gather all normals from adjacent vertices, average them and put the averaged normals straight back into the buffer. This in place editing of the normal vectors produces quite terse code, but is otherwise horrible in every aspect. The result of all this is stored in a gl.STATIC_DRAW buffer. For the final detailing a few thousand models of rocks and trees are randomly sprinkled over the map. The 1 bit collision map is used, so that these models are only placed in the valleys. It was important for the mouse picking to work correctly to have just the height map without trees in it's own buffer. So all detailed models combined are stored in second gl.STATIC_DRAW buffer, separate from the height map geometry. The final Perlin Noise generated terrain, with smoothed normals and detail models Though the terrain generation is based on randomness, it was important for the gameplay that you always end up with the same terrain each time you load the game. So using JavaScript's built-in Math.random() would not do. Instead, the game makes use of a very simple seedable random number generator. Initializing it with the same seed value before generating the terrain always produces exactly the same result. A fun problem I encountered with my perlin noise function was that it still produced different results in different browsers. To initialize the perlin noise function an array of sequential values is shuffled using JavaScripts built-in Array.sort: p.sort(function() { return 0.5 - random_float(); }); While random_float() always correctly produced the same sequence of numbers in all browsers, browsers still implement the sort algorithm differently. So in Chrome you will end up with a different shuffled array than in Firefox. Of course MDN warns you about this: The time and space complexity of the sort cannot be guaranteed as it depends on the implementation. It's not exactly the right way to shuffle an array with an nonsensical comparator function anyway. Lesson learned. (The right way is to walk through the array and swap each element with a random other element). For the final game I just plugged in different seed values until I found a terrain that was interesting and suitable for the gameplay. Not all terrains generated with this method produce usable results. Sometimes one half of the map is completely cut off from the other half. Sometimes "islands" of unreachable terrain are generated. Terrains generated with different seed values Even though the terrain I initially settled on was quite nice, I later discovered that an area that I thought was reachable in fact wasn't. I didn't want to search for a new terrain and carefully place all game objects again. So I just fudged it by drawing a rectangle on a certain spot on the map to make a traversable path. It's the nasty secrets of game development. The final code for the terrain generation is all in map_generate(). 3D Models, Textures & Vertex Animations A lot of work has gone into making the animated models and compressing them down to a reasonable size. I'm still a doofus when it comes to 3d modeling, but the amazingly ingenious Wings3D once again saved the day. It works great with low-poly models. Turns out low-poly modeling is a lot like creating low-res pixel art: you just push things around until it looks right. The main character model – 36 vertices, 62 faces, 6 animation frames, compressed to 572 bytes The main character model is as low-poly as you can possibly get with a convincing humanoid. All limbs are just triangular and end in a single point. Still, as you previously saw with the terrain, 3d data can get absolutely huge. Even for this model, if we'd store each of the 62 faces with 3x3 Float32 values, we'd end up with 2kb of data - for a single animation frame. Now, the character model contains 6 animation frames. I looked into skeletal animations, but this would have required a lot of code to get working. So instead I opted for the simplest possible solution: vertex animations. I.e. each frame of an animation contains the whole model again. So the character model contains a full set of vertex positions for each of the 6 animation frames, but still compresses to just 572 bytes. The six different animation frames: 4x run, 1x shoot, 1x idle There's two techniques I used to get there. The first one is just common sense (and used by almost any model data format): each of the 36 vertices is shared by multiple faces. So we just store the x,y,z position for each of the 36 vertices once and use an index into the vertex positions for each of the 3 corners of a face. Furthermore, if we don't change the topology of the model in each animation frame, we just need to store the vertex positions again. The set of indices for the faces remains the same. If we restrict ourselves to a maximum of just 255 vertices, we can store each index as a single byte. Similarly, if we convert the Float32 x,y,z vertex positions to a single byte each, we can save 9 bytes per vertex. "Compressing" arbitrary precision numbers down to a set of discrete values (in this case 0–255) is called quantization. So with the x,y,z position as one byte each, we need 3 bytes to store each vertex. Similarly, with each face using 3 x 1 byte indices (one for each corner) into the vertex data, we need 3 bytes to store a single face. 36 vertices * 6 animation frames * 3 byte = 648 bytes + 62 faces * 3 byte = 186 byte = 834 bytes Not too bad, but still too much. I noticed that with models this simple, we don't actually need the 1 byte "precision" of 256 discrete values for the x,y,z positions. We can lower the resolution even more. The next logical step is to pack all 3 values into just 2 bytes or 16 bit. This leaves us with 5 bits for each x,y,z value. (Technically 5.333 bits per value. We could use the extra 1 bit to give one of the x,y,z axis more resolution, but here I didn't. The extra 1 bit is just unused.) 5 bits gives us values from 0–31. So each of the vertex positions is essentially snapped into a grid of 32x32x32 values. Of course I wanted to compress the face data similarly, but with values in the range 0–31 we wouldn't be able to address all 36 vertices. Luckily I noticed that Wings3D exports the face data with the vertex index for the first corner of each face in ascending order: f 1// 22// 2// f 2// 3// 1// f 2// 24// 18// f 3// 4// 1// f 3// 8// 6// f 4// 23// 17// f 5// 3// 6// … f 32// 35// 33// f 33// 26// 32// f 33// 34// 26// f 33// 35// 34// f 34// 32// 27// f 36// 30// 29// The exported model contains one row per face, 3 indices into the vertex data. Notice how the first index is in ascending order and increases by 2 at most. The logical conclusion is to store a 2 bit address increment for the first vertex index of each face and use 2 x 7 bit numbers for the two remaining indices. This allows us to store models with up to 127 vertices. Plenty! Of course we need to store a bit of metadata with each model: the number of vertices, faces and animation frames. Described as a C-struct, the final model format looks like this: // Retarded Model Format (.rmf): struct { uint8_t num_frames; uint8_t num_verts; // per frame uint16_t num_indices; struct { uint8_t reserved : 1; int8_t x : 5; int8_t y : 5; int8_t z : 5; } vertices[num_frames * num_verts]; struct { uint8_t a_address_inc : 2; uint8_t b_index : 7; uint8_t c_index : 7; } indices[num_indices]; } rmf_data; Of course Wings3D doesn't have an exporter for this esoteric format. Instead I exported my models in the Wavefront OBJ format. This format contains easily parsable plain text data. A simple PHP script is used to convert the OBJ format into this binary format. The game contains a total of 10 different models. All those are concatenated into a single file for easier loading and better ZIP compression, totaling in 1328 bytes. The model format is so terse that it barely ZIP-compresses (1203 bytes zipped). From left to right: tree, boulder (re-used for gibs and energy well), blade of grass (yes, really), waypoint, unit selection bracket, ship, harvester, turret, enemy, unit. The models then get textured, each with a single tile of the texture image. All the textures used in the game, 1643 bytes Because my model format doesn't contain any texture coordinates I opted for a very simple hack to lay textures over the models: the tile is just projected from the front onto the model. Essentially the x,y coordinates of each vertex are the texture coordinates. Textured Model, with the texture projected directly from the front Notice how the feet and hands of the untextured model are very pointy, ending in a single vertex. Using transparent pixels in the textures for all unit types the hand and feet are cut off, expect for the military unit where a black texture indicates the gun. To blend between the different animation frames the game just linearly interpolates between the vertex positions of the last and current frame. The frame interpolation, as well as unpacking of the face indices into vertex positions and Y-rotation of the models is all handled in JavaScript. The final code to load and render a model clocks in at just 150 lines. It's wholly unoptimized (e.g. loaded models are not cached) but it just doesn't matter for these kinds of poly-counts. Mouse Picking My game requires accurate mouse controls. I need to know exactly where the mouse cursor is, not in screen space, but in world space. Typically you'd project a ray from the mouse cursor, through the screen and onto the 3d geometry. This requires quite a bit of math that I so far avoided throughout the project. Plus, you'd need a hit-test function on the height map. Another technique – one that has fallen out of favor for modern games – is to render a specially '''
