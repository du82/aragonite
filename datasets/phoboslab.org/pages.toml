["https://phoboslab.org"]
title = "PhobosLab"
full_description = 'My name is Dominic Szablewski. I build games, experiment with JavaScript and occasionally tinker with low-level C. Read my blog below and follow me on Github or Twitter. Synthesizing Music from JSON — Monday, January 6th 2025 A tiny sound & music synth and tracker for C & JS Read › Porting my JavaScript Game Engine to C for No Reason — Sunday, August 4th 2024 A small and simple game engine for 2D games, completely written in C Read › Rewriting wipEout — Thursday, August 10th 2023 A (nearly) complete rewrite of the classic 1995 PSX game wipEout Read › QOA Benchmark Results and File Format Specification — Tuesday, April 25th 2023 The final specification for the Quite OK Audio format defines the exact format for this very simple lossy audio compression format. Read › Time Domain Audio Compression at 3.2 bits per Sample — Thursday, February 2nd 2023 QOA is a fast and simple audio compression format with a reference implementation in 400 lines of C. Read › The QOI File Format Specification — Monday, December 20th 2021 The final specification for the Quite OK Image format defines the exact format for this very simple lossless image compression format. Read › Lossless Image Compression in O(n) Time — Wednesday, November 24th 2021 QOI, the Quite OK Image format, offers 20x-50x faster image compression compared to PNG and fits in 300 lines of C Read › Q1K3 – Making Of — Monday, September 27th 2021 A "Tour de Force" of cramming the essence of Quake into 13kb of JavaScript Read › Voidcall – Making Of — Monday, September 23rd 2019 The amazing challenges of implementing a real-time strategy game in 13kb of JavaScript Read › MPEG1 Single file C library — Saturday, June 15th 2019 The what, why and how of an MPEG1 decoder in a single file C library Read › Rewriting Pagenode — Sunday, December 16th 2018 The CMS I began writing 14 years ago, now released as a library Read › Underrun – Making Of — Thursday, September 20th 2018 How I compressed a twin-stick WebGL shooter game into 13kb of JavaScript Read ›'
