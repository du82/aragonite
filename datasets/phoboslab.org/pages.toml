["https://phoboslab.org/log/2007/07/hello-world"]
title = "PhobosLab"
full_description = "Dominic Szablewski, @phoboslab — Sunday, July 8th 2007 Hello World! Phoboslab.org is live again! This site runs on a minimalist installation of my Web CMS PageNode, which however is still not ready for release. So what’s Phoboslab about? Well, I decided to separate my web design and programming works from my game level design stuff. I had this domain lying around for some years now and I still quite like it’s name, so… here is my all new blog! In case you didn’t know, Phobos Lab is the place where the first DOOM by id software is set. I hope I wont get sued…"
