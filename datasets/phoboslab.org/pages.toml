title = "PL CMDLINE"
full_description = '''PL CMDLINE is a simple "wrapper" to call a URL. Think of it like a typed shortcut to a specific website or search engine. What makes PL CMDLINE worth using, is that you can pass variables to the URL - e.g. the cmd g potatoes searches on google for "potatoes"; imdb kill bill searches for the movie "Kill Bill" on imdb.com. You can either just use PL CMDLINE with the standard set of commands, or, if you create an account, define your very own cmds to suit your needs. It's easy, fast and safe :X This website was entirely created by me, Dominic Szablewski, also it was highly inspired by YubNub. Actually it's quite the same, though mine is green :D'''
