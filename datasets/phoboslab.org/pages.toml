full_description = "Dominic Szablewski, @phoboslab — Wednesday, March 26th 2008 Asaph Beta 2 Based on the wonderful feedback I got on my last post, I just put together a new beta version of Asaph. It fixes the most common problems people had with the last one. This includes: Usage of cURL or url fopen wrappers, based on what’s available magic_quotes are now reverted automatically The RSS Feed should now display images properly Lots of smaller bugfixes Again, to install just unpack the zip, enter your database settings in lib/asaph_config.class.php, upload it to your webserver and point your browser to admin/install.php. If you already installed the previous version, just replace all the files and skip the install step, as the database layout didn’t change. Asaph version 1.0 – ZIP ~50kb – Updated: Asaph version 1.0 I have some more plans and ideas for future versions of Asaph. Don’t hold your breath though – this will take some time :)"
