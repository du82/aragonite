["https://phoboslab.org/log/2016/05/quake-for-oculus-rift"]
title = "PhobosLab"
full_description = "Dominic Szablewski, @phoboslab — Friday, May 27th 2016 Quake for Oculus Rift My Oculus Rift CV1 finally arrived last week, so of course I had to update my fork of the excellent Quakespasm engine for the new Oculus 1.4 API. While I was at it, I also fixed a number of bugs, included support for the Rift's headphones and the XBox One controller – I'd still recommend you play with mouse & keyboard, though. Controls are set up with reasonable defaults, but you can of course change everything in the options menu. There's also a new VR/HMD options menu where you can configure your preferred aim mode (e.g. decouple it from the view) and crosshair style. The game starts directly in VR Mode, disables view bobbing and sets the texture mode to NEAREST for the proper, pixelated oldschool vibe. Once you're in the game, press END or the start button on your gamepad to recenter the view. Short playthrough of the first few levels of Quake in VR Download and Source Quakespasm Rift for Windows - includes Shareware pak0, ready to play Source code on Github"
