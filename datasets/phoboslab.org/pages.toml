full_description = "Dominic Szablewski, @phoboslab — Tuesday, February 12th 2008 All Hail the New PhobosLab Doing logo design isn’t easy. Making a logo for PhobosLab felt particularly hard, because the name, despite of the very real Mars moon Phobos, is quite abstract for a weblog. Well, I settled for the real thing and actually used Phobos as a logo, as you can now see in the page header. No, it’s not the Deathstar – Phobos has a huge crater on its side, in case you’re wondering. I also pimped the stylesheet a bit, but in the end didn’t do the complete redesign I intended to. The image above was a first draft of it. Update: Yeah well, as you can see, I did do the complete redesign now."
