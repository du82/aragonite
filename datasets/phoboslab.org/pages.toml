["http://phoboslab.org/log/2014/07/xibalba-a-webgl-first-person-shooter"]
title = "PhobosLab"
full_description = "Dominic Szablewski, @phoboslab — Monday, July 28th 2014 Xibalba – A WebGL First Person Shooter More than a year ago I started to work on a project that was supposed to be released for 7DFPS – a game dev competition about making a First Person Shooter in 7 Days. I didn't meet the deadline, but the game I started back then is now finally finished. Please Enjoy: Xibalba – A WebGL First Person Shooter Xibalba is also available in the iOS AppStore The game was build on top of my HTML5 Game Engine Impact and is entirely written in JavaScript. While Impact is intended for 2D games, this first person shooter fit very naturally with the engine. Xibalba, at its heart, is just a 2D game with a 3D viewport. So all the necessary elements for the gameplay were already provided by the game engine: collision detection and response, entity management, sound playback a versatile level editor and much more. The only thing missing was a 3D view. I created a 10 minute Making Of screencast that explains the ideas and the design behind the game a bit closer. The Making Of Xibalba on Youtube The iPhone and iPad version of the game was made with Ejecta. The game also runs just fine in Mobile Safari on the current iOS 8 beta, but the browser's UI, especially in landscape mode, unfortunately hinder the gameplay quite a bit. It's much more playable in Chrome for Android. I also published the 3D Viewport part of Xibalba, along with another tiny demo game, under the name TwoPointFive – a tribute to the excellent ThreeJS library. The TwoPointFive Plugin is available on Github: github.com/phoboslab/twopointfive"
