["https://phoboslab.org/log/2008/07/iphone-code-signing-sucks"]
title = "PhobosLab"
full_description = "Dominic Szablewski, @phoboslab — Thursday, July 24th 2008 iPhone Code Signing Sucks You can already read in numerous articles why code signing sucks, so let me just join the choir. The main reasons mentioned are lack freedom and overall complication – and it was indeed easier and free to get your iPhone application up and running on a jailbroke iPhone, than it is now with the SDK. I have gone through all the hassle of code signing yesterday, just to be able to test an application on actual hardware. While other companies (Microsoft, Sun…) are opening up more and more, Apple denies itself from this movement and makes things more complicated for all of us. A very sad decision, and also one they can’t and won’t revert. Update: Also, Fucking NDA."
