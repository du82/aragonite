["https://phoboslab.org/portfolio"]
title = "Portfolio: Dominic Szablewski"
full_description = '''Songfever, at it's heart, is a tangible front-end for iTunes. Album covers are projected onto four physical objects standing on a shelf. With a scroll wheel, attached to the shelf, you can scroll through your music library in a Cover Flow like fashion. The goal was to reintroduce the aesthetic quality of a physical music collection (CDs, LPs), while maintaining the comfort of a digital one. Each of the four covers are tracked by a webcam mounted above the shelf. Their positions are translated in software in the same way the projector located relative to the webcam in the real world. When rendered in a 3D OpenGL view and projected back onto the shelf, the album covers line up with the physical objects again. Songfever was our main project in the 4th semester for "Digital Media" at the Hochschule Darmstadt. I was responsible for the programming. Visit the Songfever Website for some more photos and videos. Yuckfu is an award winning arcade game for Windows PCs, the Nintendo Gameboy Advance and the Apple iPhone, in which the player has to collect boxes, while dealing with the physics of the spacecraft he's controlling. There is no goal, other than to gain a high score. Yuckfu follows the paradigm “easy to learn, hard to master” in its purest form. The games task and mechanics can be grasped in just a few seconds, but it takes hours of play to be able to control the spaceship fast and safely. The iPhone version of Yuckfu has full 3D graphics, refined sound and music and a more precise analog control scheme that utilizes the iPhone's built in accelerometer. It is currently available on the iPhone AppStore as a free trial and a paid full version. More info about the game can be found at Yuckfu.net. I also wrote about the development process in my Yuckfu Dev Diary. The Nintendo Gameboy Advance port of Yuckfu was build for the 2004 Mbit Contest. 28 Entries were submitted to this competition and Yuckfu was picked among 9 other games to be burned on some 500 cartridges and sold to the public. The graphics and overall presentation was refined, in order to work well with the small screen.'''
