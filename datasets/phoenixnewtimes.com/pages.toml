full_description = "Thanks to our early commitment to digital journalism, phoenixnewtimes.com attracts more than 1 million monthly active users. They’re joined by more than 100,000 weekly print readers who consider the publication an unparalleled source of information and insight, from politics and business to music and the arts. Our annual Best of Phoenix issue is a must-read for residents and visitors alike, and our Top 100 Restaurants and Top 100 Bars lists have become the definitive source for exploring the city’s dynamic dining and drinking scene. We also provide the city’s most reliable coverage of the burgeoning cannabis industry. In the late 1990s, we were among the first alt-weeklies to commit to digital journalism, restructuring our workflow to publish stories web-first. That decision turned us into something we'd never been: a daily newsroom. Another change occurred in 2013, when a group of longtime employees purchased New Times' parent company, Voice Media Group, from its original owners, whose success in Phoenix had led them to build the nation's largest chain of alternative weekly publications. One result of New Times' forward-looking approach was a growing number of readers who didn't necessarily live in the Valley of the Sun but appreciated what we were doing. Whereas in the early days of print our distribution was limited to metro Phoenix –– thanks to those signature red-and-yellow newsracks! –– our stories were now available to anyone with an internet connection. Talent is one thing New Times has always had in abundance. Two of our writers have won the Livingston Award, the country's most prestigious honor for young journalists: Sarah Fenske in 2011 and John Dickerson in 2008. Today the country's most lauded publications regularly punch our writers' tickets to journalism's big leagues: In 2019, Antonia Noori Farzan left for the Washington Post, and in 2020, staff writer Meg O'Connor, was hired away by the national news website The Appeal. Food critic Patricia Escarcega, who began her career at New Times, now writes for the Los Angeles Times."
