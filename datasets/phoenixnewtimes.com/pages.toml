["https://www.phoenixnewtimes.com/about/membership"]
title = "Phoenix New Times | The Leading Independent News Source in Phoenix, Arizona"
description = ".uk-root body { text-align: center; font-family: 'Serif12', Georgia, serif; color: #000; } .uk-root .comp-page-pageheadline { padding: 0; border: 0 none; } .uk-root .comp-page-pageheadline .fdn-content-headline {..."
full_description = "A growing community of Phoenix New Times members support our newsroom by giving any amount, either through a one-time gift or recurring membership. Because of this support, we are able to continue our mission of providing free journalism to Phoenix and the surrounding communities. As an independent, local news organization, New Times' funding comes from print and digital advertising, our full-service digital marketing agency V Digital Services, and contributions from readers through this membership program. We currently have an editorial staff of ten, and in 2024, we raised enough funds through our membership program to pay for one staff writer's salary. Our online content never has a paywall and we don’t charge a subscription fee, keeping it free and accessible for all, and our websites were redesigned with less intrusive advertisements. We also continue to distribute 32,000 print papers each week around the city – free for anyone to grab from a New Times bin. A lot has changed since our founding in 1970, but one thing remains: We exist for the community. And we are supported by it. With the support of contributions from community members and organizations to cover some of the costs of journalism – like fees associated with open records requests or salaries for talented, passionate reporters – we are less reliant on advertisers to support us in a competitive industry and also less reliant on the uncontrollable, changing search and social algorithms to reach readers. With your support, our newsroom can plan for a stronger future."
