["https://phoenixnewtimes.com/restaurants/100-best-restaurants-in-phoenix-arizona-21212437"]
title = "100 best restaurants in Phoenix, Arizona | Phoenix New Times"
description = "This list spans cuisines, neighborhoods and price points and includes the top Phoenix restaurants for fine dining, budget-friendly eats and city classics."
full_description = "The top spots to open between Dec. 1, 2023 and Dec. 1, 2024 include some restaurants that made a splash, such as Uchi in Scottsdale or the modern Mexican standout Santo Arcadia. But some dishes at more under-the-radar eateries also made their way into our hearts, like the funky papaya salad at Thai Boat Noodle.PS and the fiery salsas at Taco Viva. As metro Phoenix has expanded over the decades, a handful of its restaurants have stood the test of time. All of these spots have been open for at least 15 years. Some, including Pho Thanh, Beckett's Table and Pomo Pizzeria Napoletana, hit that milestone this year. Others have been serving hungry customers since the 1970s and '80s. The oldest spot on this list, The Stockyards Steakhouse, has been home to giant steaks, and maybe a few ghosts, since 1947. If you're in the mood to celebrate, the Valley has plenty of spots worth a big spend. Some offer classic Italian romance or traditional steak and seafood. Others offer something unique. Feringhee in Chandler puts a fine-dining spin on familiar Indian flavors, Valentine celebrates all things Arizona and Lom Wong offers a regional taste of Thailand that transports you far from Phoenix. Reservation-required elegant dinners are wonderful. But they're not always what the evening — or the budget — calls for. That's where Phoenix's exceptional casual restaurants come in. Slide up to the counter, order a tray of food and tuck in with your hands. When you want to get sticky with barbecue sauce, head to Caldwell County in the East Valley, Eric's Family BBQ in the West, or Little Miss BBQ if you're somewhere between. Tacos Veganos and Earth Plant Based Cusine offer meat-free alternatives and Kabob Grill N' Go will leave you pondering how food this good can come out of a takeout container. At these Phoenix restaurants, half of the customers are regulars, the bartender probably knows your name and the neighborhood simply wouldn't be the same without it. From Mimi Forno Italiano and its consistently packed dining room in Laveen to SugarJam's blend of party brunch and seriously good Southern staples in North Scottsdale, we hope these spots continue serving neighbors and friends for years to come."
author = "Tirion Boan, Sara Crocker"
