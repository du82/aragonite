["https://phoenixnewtimes.com/about/ai-policy"]
title = "AI Policy | Phoenix New Times | The Leading Independent News Source in Phoenix, Arizona"
description = "How Voice Media Group newsrooms may use artificial intelligence in our journalism Although artificial intelligence has the potential to improve newsgathering, it also has the..."
full_description = "Although artificial intelligence has the potential to improve newsgathering, it also has the potential to harm journalists’ credibility and our relationship with our audience. As a company, Voice Media Group is approaching AI by embracing its use in ways that make sense for us through testing, human verification, and ongoing adaptation. Our newsrooms will test and utilize approved AI tools to assist for uses such as copyediting, transcribing, translation, research, story ideation, SEO, and when we ask AI questions and employ those responses within a story. Our journalists will not use artificial intelligence to write stories or generate artwork. The responsible usage of artificial intelligence is essential for maintaining trust, integrity, and sustainability in Voice Media Group’s operations. For questions or feedback about Voice Media Group’s artificial intelligence policy, please email Editorial Director Chelsey Dequaine-Jerabek at [email protected]."
