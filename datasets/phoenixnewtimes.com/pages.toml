["https://phoenixnewtimes.com/location/nile-theater-6491306"]
title = "Nile Theater | Mesa | Music Venues | Music"
description = "After spending several years as a fundamentalist church and bookstore, the historic Nile Theater has made a triumphant return as one of the Valley's premier concert halls. With both its rough-and-tumble (which contributed to the Nile's being shut down in 2002) and God-fearing days firmly in the past, this all-ages establishment in downtown Mesa has quickly re-established itself as a go-to spot to catch up-and-coming national acts and established local bands. Since reopening in 2010, the joint has already played host to such acts as BrokeNCYDE, Against Me! and The Aquabats, as well as local power pop favorites The Maine and The Summer Set. The interior of the Nile, which opened in 1924, is rustic without feeling antiquated, while the sound and acoustics are excellent, and the floor is even carpeted (which is an unusually classy touch for a concert venue). With its back-alley entrance, patrons may feel as if they're visiting a speakeasy, but, alas, once inside, the hardest drink available is a Mountain Dew."
