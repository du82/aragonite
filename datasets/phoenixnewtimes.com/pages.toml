title = "Accessibility | Phoenix New Times | The Leading Independent News Source in Phoenix, Arizona"
description = "Website accessibility is an ongoing effort and we are actively taking steps to further enhance and improve the accessibility of Voice Media Group. If you..."
full_description = "Website accessibility is an ongoing effort and we are actively taking steps to further enhance and improve the accessibility of Voice Media Group. If you have difficulty using or accessing any element of this website, please contact us through our contact form on our website, call, or email and we will work with you to provide the information, item, or transaction you seek through a communication method that is accessible for you, consistent with applicable law. At Voice Media Group, accessibility, diversity, and inclusion are important values that affect everything we do. Whether you use a screen reader, voice recognition software or another kind of assistive technology, we want to be accessible to you and easy to navigate. We set our web accessibility standards high and are working to achieve them. Our team is dedicated to ensuring our site meets all laws and guidelines and creates a usable experience for all customers. Here are some of the things we’ve done and are continuing to do to make our site easy to use for everyone: We’re working to edit the pages of to include appropriate headings, lists, paragraphs and another formatting for better usability with assistive technology. We’re adding alternative text, captions, and transcripts to images and videos so users who can’t see or hear have a text equivalent to interact with. We are developing new pages with keyboard accessibility in mind so that users can easily tab through a page to find the content they need. We are creating templates for our site to ensure consistency. Once you’re familiar with how our pages and menus work, you can expect similar functionality across the site, each time you visit. Visiting our website, is explicit acceptance of agreement to this accessibility statement, cookie policy, terms of service and privacy policy described on our website. By using this website you agree that will not be liable for any and all accessibility claims filed regarding and accessibility difficulties. By using this website you acknowledge that we take accessibility matters seriously and work to provide all information, items, transactions, or otherwise, you seek through a communication method that is accessible for you, consistent with applicable law. If you have difficulty using or accessing any element of this website, please contact us through our contact form on our website, call us at 1.888.441.0784 or email us at [email protected], and we will work with you to provide the information, item, or transaction you seek through a communication method that is accessible for you, consistent with applicable law."
