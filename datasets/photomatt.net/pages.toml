full_description = "On Lenny’s Podcast March 4, 2025PressMatt One of my must-read newsletters for the past several years has been Lenny’s Newsletter, probably best known for its writing on growth and product management, which really means it covered everything you need to create a great company. It expanded into a really well-done podcast; Lenny has always had a knack for finding the best guests and asking the best questions, so when he invited me on I was very excited. He really wanted to address some of the things that people said I wasn’t being asked, so we do touch on the WP Engine / Silver Lake attacks, but we also covered a lot of my philosophy of why open source is important, philanthropy, and why you should build a movement, not just a product. You can watch it on YouTube, or listen to it on your favorite podcast app like Pocket Casts. Some others he has done that I really enjoyed are Nan Yu from Linear, Marc Benioff from Salesforce, Katie Dill from Stripe, Mihika Kapoor from Figma, Drew Houston from Dropbox, and of course the famous Founder Mode one with Brian Chesky. One comment so far WordCamp Asia and Maha Kumbh Mela February 21, 2025AsidesMatt It’s been fantastic being in the Philippines for this year’s WordCamp Asia. We have attendees from 71 countries, over 1,800 tickets sold, and contributor day had over 700 people! It’s an interesting contrast to US and EU WordCamps as well in that the audience is definitely a lot younger, and there’s very little interest in “wpdrama” du jour, in fact I’ve had tons of amazing conversations of support and talking about the strength and growth of the community. Some of the earliest international WordCamps I went to were in Manila and Davao, back in 2008. (I’m going to share some pictures at the start of my talk.) Between that and spending lots of time in Daly City when I moved to San Francisco when I was 20 I have developed a fondness for the cuisine, creativity, family orientation, and warmth of the culture here. After this I’ll be taking a bit of time off for a trip to the big Hindu religious pilgrimage in India, the Maha Kumbh Mela, which is currently on a 144 cycle. It’s the largest human gathering in the world, with some days measured with tens of millions of people visiting. I’ll be returning to my Photomatt roots as well and bringing my big camera rig, right now a Nikon Z 7II, and two lenses: 24-70 2.8 and 70-200 2.8. View all 4 comments"
