ons Support Dedicated Servers Server Authoritative Logic via Plug-Ins Premium Dashboard and Counters Multi-layered DDoS Protection CONTACT US CCU The number of users allowed to connect to your application is defined by its CCU. For plans the CCU total is defined by the sum of peaks for all regions. Sample Month: EU peak 420 CCU, US peak 230 CCU, Other regions 0 CCU — CCU total = 420 + 230 = 650, matching 1000 CCU subscription plan. CCU Burst, Overage Don't worry about losing users - we allow you to temporarily burst your agreed CCU limit and will simply bill this CCU overage with next month's invoice according to the fees set out in your subscription agreement. After your first burst you have 48 hours to upgrade your subscription plan before we, subject to our sole discretion, may cap your number of CCU to the agreed number. For the CCU burst, the number of CCU is defined by the sum of CCU peaks over all connected regions. Traffic Calculation The included traffic depends on your subscription plan. All incoming and outgoing messages to the Photon Cloud servers count towards the traffic limit. Overage fees apply to traffic exceeding that limit. Sample: 1000 CCU plan * 3 GB incl. per CCU = 3 TB included traffic. One-Time Plans One-time plans apply to one application and for 12 months, no recurring fees. You can add 100 CCU to any other existing monthly subscription plan, e.g. 100 + 500 = 600 CCU in total. Can be applied to an app only once at a time. Monthly Active Users We assume, as rule of thumb and based on our experience, 1 CCU to match 20 daily active users (DAU). Each DAU translates to 20 monthly actives (MAU). Down- and Upgrade at any Time Downgrade and upgrade subscription plans at any time. Additional CCU are available immediately. Any fees paid but unused will be credited automatically. Termination takes effect at the end of the month. Free Support Comprehensive online docs, free samples, tutorials, video streams, assistance with non-technical issues like account activations, account management, billing and service status are free and included in all our plans. Gaming Circle Premium Support Gaming Circle is our premium development support program and includes direct chat support for all Photon products, exclusive samples, access to our Circle Discord pro community and much more. Read more here. Regions For optimum round-trip-times your application can connect the nearest region we host in. Choose from multiple regions around the globe. Still Questions? Drop us a line to get an answer :) [email protected]"
