description = "Photon Voice is fast to integrate and provides your Unity application with crystal-clear 3D audio chats. Try Photon Voice for FREE now."
full_description = "Providing users with a high-quality voice chat that Simply Works. Crystal-Clear 3D Voice Chat for Unity Games, VR/AR/MR, no matter how big your community grows. FREE DOWNLOAD FEATURES PRICING Features Games, VR & AR Photon Voice is the ideal add-on for any application and perfectly suited for VR or AR apps where a voice chat is the best choice to communicate with other users. Audio Quality Photon Voice utilizes the state-of-the-art Opus codec, co-developed by Skype, to provide the best possible audio quality. 3D Audio Sources Photon Voice allows to attach an audio source to a 3D object in Unity so you can freely place the audiostreams, e.g. in a virtual world or a FPS. Easy Setup Adding Photon Voice to your app is a breeze. Use it in conjunction with any multiplayer engine and for any multiuser app where voice communication between the users is needed. Photon Cloud Hosted in our globally distributed Photon Cloud, Photon Voice guarantees low latency and shortest round-trip times for your players’ voice communication worldwide. Global Scalability Photon Vice apps scale seamlessly and automatically in the Photon Cloud: from just a few to tens of thousands of concurrent users. Fair and transparent pricing included. Start Creating. Try Voice Now! BUILD FOR FREE Photon CloudThe Power Behind All applications you develop with our suite of Photon products will run in our Photon Cloud. Here we take care of service hosting, operations and scaling. You can fully concentrate on building your game or app! Photon Enterprise Cloud – Dedicated Servers & Custom Code Plug-Ins In a nutshell the Photon Enterprise Cloud is like our well established public Photon Cloud and adds the following features: Runs on dedicated servers, provides guaranteed service levels (SLAs) and high priority support. Another big plus: You can run your own authoritative server logic via Plug-ins. Typical Photon Enterprise Cloud scenarios are apps with 10,000 concurrent users or more, bigger game projects that need authoritative server logic or companies whose compliance policies restrict them to dedicated resources. Interested? Get in touch at [email protected]. Scalable, Reliable& Always Connects All Photon Cloud products are based on a client to server architecture, the most stable solution for multiplayer games! In peer-to-peer architectures clients often cannot connect due to NAT punch-through issues. This problem is even worse in mobile networks. With the Photon Cloud your games will always connect. Our operations team monitors servers 24/7 and can scale up required resources at any time. Whether your game needs capacity for hundreds or for hundreds of thousands of concurrent users: we scale it to your demands. PHOTON CLOUD REGIONS Hosted Where Your Players Are Low latency is an essential requirement in realtime multiplayer games. For this reason Photon Cloud is hosted in all major world regions to provide your players with a minimum latency. Games that depend on low latency, like FPS or RTS game types, connect the players to the nearest region. Games that are able to handle higher latency, like turnbased game types, can connect all players to the same region. See here for available regions and setup instructions. TRY FREE PLAN You are in Good Company. Join 800,000 Developers and Studios. Some Selected Titles of the 1,370,460 Applications Hosted in Our Cloud. Ready to Add 3D Voice Chat to Your Application? Photon Voice is fast to integrate and provides your Unity application with crystal-clear 3D audio chats on mobile, PC, consoles and XR. START FOR FREE"
