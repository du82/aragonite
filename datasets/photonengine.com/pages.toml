t for the development and successful release of your multiplayer games. Operations support for live games is not part of the Circle. Cancellation After the initial term you can cancel your Gaming Circle membership on a per month basis. Please note that you are not allowed to use any of the Circle exclusive SDKs and content after cancellation."
