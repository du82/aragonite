full_description = "世界初の決定性 マルチプレイヤーエンジン Photon Quantumは市場で唯一の100％決定性マルチプレイヤーゲームエンジンです。マルチプレイヤーゲーム制作はローカルゲーム開発と同じくらい簡単になりました。ネットコードを使わず、デフォルトでネットワーク化かつ完全同期されます。QuantumでコーディングしてUnityで表示できます。 無料で始める 機能 価格 予測・ロールバックを搭載した世界的メガヒットに対応する機能 ネットコード不要–デフォルトのマルチプレイヤー対応 Quantumでは、ネットコードを記述せずにマルチプレイヤーゲームを作成できます。ローカルのマルチプレイヤーゲームと同様、プレイヤーを数人接続させたシミュレーションを一つ制作するだけで完成です。 インプットのみで低帯域幅 ゲームクライアントが交換するのはインプットのみです。当社のPhoton Cloudを通じて高頻度でプレイヤーに配信されます。バックエンドやプラグインに接続してサーバーサイドカスタムコードを実行するには、Webhookをご利用ください。 究極のパフォーマンス実現のために最適化されたQuantum QuantumのECSアーキテクチャはそれぞれ必要なパフォーマンスを提供することで、物理が肝であるPC、コンソール、VR、モバイルでのマルチプレイヤーでも実行します。 チート保護設計 決定性のゲームでは、チートを本質的に弾きます。チート対策として最も効果的なリプレイバリデーションやサーバーレフェリーシミュレーションなどのメソッドを使用してチート行為者に対抗します。 クロスプラットフォーム決定性 QuantumでコーディングされたシミュレーションはUnityに依存しないため、どこででも実行できます。 遅延ゼロ - Eスポーツ級 すべてのローカルアクションは遅延ゼロで実行され、リモートインプットは予測＆ロールバックされます。 リプレイと観戦 リプレイはバックエンドで保存されるか、ゲーム内で使用されます（キルカムなど）。観戦モードははじめから組み込まれています。 Bot SDKアドオン ボットの存在は、ルームに人を入れたり提出するプレイヤーの代わりになったりするので、マルチプレイヤーゲームにとって非常に大きな影響を与えます。 Stumble Guysのリリースは、開発開始からわずか6週間後のことでした…モバイルで、ガンガンに物理を使用した上、ボットも入れて32人プレイを実現しています！ 大正解でした！ Olli, Founder Kitka Games 32 players１レースごと #1 50か国中 ローエンドモバイル ！ 25M デイリープレイヤー ネットコードのいらないマルチプレイヤー。今すぐ始めよう ！ ダウンロード 無料 決定性マルチプレイヤーエンジン Quantumでコーディング – Unityでレンダリング、モデリング、アニメーション ビューとシミュレーションの明確な区別 超高速決定性システム：物理・数学、パスファインディング・ステアリング、ECS、ジョブシステム・・・ 大切なのはインプットのみ。 ネットワークは開発者だけのもの 究極のパフォーマンス実現のために最適化されたQuantum ECSパフォーマンスアーキテクチャ ガベージコレクションフリーECS（エンティティコンポーネントシステム）を備えたQuantumのアーキテクチャがプラットフォーム間で必要とされているパフォーマンスを発揮します。 ティックベースシミュレーション シミュレーションの速さは、ゲームプレイと必要なパフォーマンスとの間の完璧なバランスを見つけられるよう調整できます。一般的な速さは、モバイルで30Hz、PC・コンソールで60Hz以上です。 予測、ロールバック、再シミュレーション Quantumのクライアントは他のクライアントのインプットを予測して継続的にロールバックを行い、サーバーが確認したインプットで再シミュレーションを行っています。 Unityはビュー専用 Unityは、レベルデザインのためやモデル、アニメーション、UIのレンダリングレイヤーとして使用します。シミュレーションが提供するデータが精密なため、ゲームプレイ体験に遅延が発生しません。 開発者の観点：シミュレーション１つで実現するマルチプレイヤー ネットコード不要 –デフォルト機能としてのマルチプレイヤー 各プレイヤーのインプットへローカルアクセスすることができ、シミュレーションの開発に完全に集中することができます。プレイヤーのシミュレーションへの追加は、ゲームコントローラーを差し込むような作業です。それだけでマルチプレイヤーが動き始めます。 全てのゲームモードで共有できるコードベース 全てのゲームモード（シングルプレイヤー、ローカルマルチプレイヤー、オンラインマルチプレイヤー）で、AI・ボットを含むコードベースは同じものを使用できます。 全て完全同期 Quantumの決定性システムは各クライアント上でのシミュレーションが常に同期されていて、物理、ボット、パスファインディング、アニメーションに遅延が発生しないことを保証します。 リッチな機能のゲームプレイエンジン 2Dおよび3D物理、Navmesh、またはフローフィールドパスファインディングや回避のためのライブラリ搭載。 ビジュアルエディタ有りのボットSDK・AI SDK。すべて高速でプロトタイプ作成でき、本番稼働にも対応できるほど成熟した機能です。 ネットワークの観点：後ろで交換されるインプット Photon Cloudでのインプット同期と時刻同期 プレイヤーのインプットは、送信されるとグローバルPhoton Cloudで稼働しているカスタムロジック経由で配信されます。当社のサーバーが、安定したインプットストリームと時刻同期を保証します。 基盤はPhoton Realtime Photon RealtimeがすべてのPhoton製品の基盤技術となり高速プロトコル、ロビー、マッチメイキング、ハイパースケーラブルルームアーキテクチャを実現しています。 Webhookでバックエンドを接続 Quantum 3での新機能。ルームコントロール、コンフィグレーションの精密な検証、プレイヤーデータ入力を支えるWebhook。 フルマッチのリプレイでも設定可能なエンドポイントへターンキーを送信できます。 チート保護設計 インプットのみを交換するという点で、Quantumのシミュレーションをオーソリテーティブにし、プレイヤーがほかのプレイヤーの操作による改ざんを受けないようにしています。 Quantum 3では、Webhookやサーバーから提供されるリプレイを用いて安全性をより高めています。 同期やロールバックのコンセプトが最高レベルかつ究極の高性能に到達しています。「魔法」を目の当たりにしたかのようです。 Paul Bettner, CEO (Age of Empires, Words with Friends, Wildcard Alliance) Gaming Circleに参加する 当社のプレミアムサポートやサンプルで一歩先のスタートを切ろう オンラインドキュメントで無料で使用できるためのすべてをサポートしていますが、Gaming Circleではメンバー限定リソースをご提供して開発にさらなる力をお届けします。 Gaming Circleに参加して当社エンジニアによるプレミアムサポート、メンバー限定サンプル、アルファ版・ベータ版へのアーリーアクセスなど豊富なサービスをご利用ください。 詳しく見る あなたも仲間に– Quantumを使用中の代表顧客 世界を震撼させるゲームを作成する準備はいいですか？ Quantumはマルチプレイヤーゲーム開発の方法に革命を及ぼしています。その上、開発は無料。今すぐQuantumについてご確認ください。 無料で始めよう"
