title = "Photon Industries Circle: 비지니스 컬래버레이션을 보다 심플하게 만듭니다"
description = "Photon Industries의 네트워크 솔루션은 VR, AR, PC 그리고 모바일 애플리케이션에 놀라운 기회를 제공합니다. Photon Industries Circle에 참가하세요!"
full_description = "프로페셔널한 Use Case를 위한 멀티 유저 솔루션. 컬래버레이션, 트레이닝, 디지털 트윈, 의료, 교육, 미팅 등에 대응하는 Photon SDK를 사용해 보세요. Photon Industries는 세계를 이끌어가는 게이밍 기술을 게임 이외의 영역에서도 적용하며, VR, AR, PC, 모바일, 웹을 지원합니다. JOIN NOW 특징 CIRCLE 가격 ELITE 신청하기 Circle 멤버십의 특징 최대 클래스의 멀티 유저 전문 커뮤니티로써, Photon의 모든 제품, 서비스, 서포트, 전용 라이센스 옵션을 이용하실 수 있습니다. 이러한 유연성을 최대한 활용해 보세요. 주요 Use Case 샘플 수 천만원상당의 개발 가치가 있는 템플릿들을 활용해 프로젝트를 간단하게 시작할 수 있습니다. Photon은 엑스포, 메타버스, 스테이지 등 폭넓은 영역을 커버하고 있으며, 화면 공유 및 미팅 기능도 탑재하고 있습니다. Hololens 전용 SDK Hololens 전용 SDK 2 UWP(ARM64)로 Photon Voice 및 Video를 시작해 보세요. 카메라 신호의 송신, Photon Video를 사용한 원격 비디오 씬의 프로젝션 등이 가능하게 됩니다. 이 SDK는 HologramComposition 및 싱글 패스 스트레오 렌더링에도 대응합니다. 프로커뮤니티 전 세계의 우수한 멀티 유저 소프트웨어 엔지니어가 함께하는 커뮤니티의 멤버가 됩니다! Circle 멤버 전용 스택 플로우 지식 베이스에서 많은 정보를 획득하세요. 코어 엔지니어의 서포트 Circle 커뮤니티와 스택 플로우 지식 베이스는 Photon의 리드 엔지니어가 담당합니다. SDK의 크리에이터로부터 직접 답변을 받을 수 있는 기회! 프라이빗 채널 프라이빗 채널에서는 기밀 사항이나 자신만의 과제에 대해 안심하고 상담할 수 있습니다. 프로덕션의 중요한 단계에서 개인적인 서포트를 받을 수 있습니다. PhotonVideo Video SDK로 멀티 유저의 동영상 송신 및 화면 공유를 실현. Circle 멤버에게만 제공되는 테크놀로지입니다. TAILORED FOR CORPORATE USE Photon 제품Overview Fusion 서버 권한적 상태 동기 Quantum 인풋의 결정론적 동기 Voice 완전한 이중 Voice Chat 텍스트와 바이너리 메시지 기능 Video 동영상의 브로드캐스트와 화면 공유 Photon은 안전하고 유연성있는 애플리케이션 개발을 간단하게 실현할 수 있도록 도와줍니다. 비지니스 요건에 맞춰 Photon Cloud 또는 온프레미스 형태의 서비스를 선택할 수 있습니다. 초고속 테크놀로지 Photon의 SDK 및 서비스는 최고의 퍼포먼스, 유연성, 안전성을 위해 면밀히 설계되어 있습니다. 기반 단계부터 치밀하게 계산되었습니다. 모든 엔진에 대응 Photon SDK는 Unity, Unreal Enging, Native C/C++ 등의 많은 주요 그래픽 네트워크/게임 엔진과 호환성이 있습니다. 모든 디바이스에 대응 Photon SDK는 많은 주요 디바이스 및 플랫폼에 대응하고 있어, 크로스 플랫폼 기능을 지원하고 있습니다. Photon클라우드 전 세계에서 폭넓게 사용되고 있는 Photon Cloud가 안전하고 유연하며 낮은 레이턴시의 접속을 실현합니다. 필요에 따라 프라이빗 셋업 및 엔터프라이즈 셋업도 제공해 드립니다. Need to Host Your Own Photon Server? Secure. Private. Reliable. Proven by Enterprise Customers and our own Photon Cloud. Online and Offline versions available for Fusion, Voice, Video, Realtime and PUN SDK. HOSTING OPTIONS BEST PRACTICE CODE AND PATTERNS Conference & Event Samples Photon의 컨퍼런스/이벤트용 샘플은 퍼스널라이즈된 가상 체험을 작성하는데 최적화되어 있습니다. 가상 이벤트의 여러 측면을 통합하여, 소규모에서 몇 천명에 이르는 대규모 참가자를 수용하는 일반적인 회의나 이벤트 시나리오를 시뮬레이션 합니다. Unity에서 Fusion, Voice, Video를 이용해 구축된 템플릿에는, 핸드 컨트롤 아바타 및 공간 음성 등 다양한 기능을 탑재하고 있어 프로젝트에 큰 변화를 선사할 수 있습니다. Circle 회원한정 Expo에서는 동시에 약 300명의 방문자를 수용할 수 있고, 부스 및 프라이빗 채팅 기능을 사용할 수 있습니다. 이 기능을 확장하기 위해서는 Area 기능의 이용을 검토해 보세요. 강연 세션 및 패널 등, 1000 명의 방문자를 수용하는 라이브 이벤트를 개최. 이벤트 개최중에는 마이크의 사용 및 화면 공유 컨트롤 기능을 유지합니다. Avatar Integration 데모용 아바타 셀렉션이 표시됩니다. 원하시는 아바타 시스템을 이용하실 수 있습니다. Meta Avatars 및 Ready Player Me에도 대응합니다. Area 복층 구성으로 엑스포를 확대할 수 있습니다. 예를 들어 10층 구성일 경우 약 3000명의 방문자를 수용할 수 있습니다. Conversation Bubbles 다른 사람이 들을 수 없는 프라이빗한 공간에서 최대 8명까지 대화가 가능합니다. 음성 커뮤니케이션 뿐만 아니라, 손이나 머리의 움직임까지 재현할 수 있습니다. Best Practice Code / Patterns 샘플에 나오는 best-practice의 코딩 패턴이나 이용 사례를 활용하여 고객님의 필요와 상황에 따라 커스터마이징이 가능합니다. 전용 best practice 이용 사례는, Photon의 시니어 엔지니어가 여러분이 웹이나 모바일, PC, VR 등의 플랫폼에서 수천명 규모의 참가자를 수용하는 이벤트나 컨퍼런스를 개발할 수 있도록 하기 위해 만들어졌습니다. 샘플은 여러분의 메타버스 프로젝트에 있어서 기폭제가 될 것입니다. 허브 및 여러 룸, 미술 전시회, 캐주얼 게임, DJ 시나리오 등 폭넓게 준비되어 있습니다. PHOTON INDUSTRIES ADD-ONS Improve Your Development with Our Add-Ons We provide our Circle members with a constantly growing list of reusable AddOns to speed up their 3D/XR application prototyping. Check Out the Most Popular Ones: 대형 기업, 에이전시, 플랫폼으로부터 신뢰를 획득. Industries Circle!에 가입하세요! Photon은 안전하고 확장 가능한 네트워크 경험과 빠른 작성을 목표로 하는 모든 분을 위한 서비스입니다. JOIN NOW"
