["https://www.photonengine.com/fusion"]
title = "Photon Fusion: Setting the Benchmark for Multiplayer games."
description = "Global cross platform multiplayer game backend as a service. Photon Fusion for synchronous and asynchronous games and applications. Try for FREE"
full_description = "Setting the Benchmark for Multiplayer Games. Photon Fusion is the high-end state transfer netcode SDK made for Unity Professionals. Give players the best experience for any gameplay with multiple Network Topology choices. BUILD FREE FEATURES PRICING Powerful Features Required to Build the Best Multiplayer Games: Tick-BasedSimulation Core feature of stable and accurate networking. Foundation for client side prediction and snapshot interpolation. Client-SidePrediction Give players an instant response to their own inputs without giving up server authority, even under high latency and network loss. HighPerformance Handle thousands of networked object over hundreds of client connections, including complex interest management. SnapshotInterpolation Provide smooth visual rendering of remote objects for a client, even during bad networking conditions. LagCompensation Compensate for the delay between the client firing his weapon and the server registering the potential hit. ReplicationSystems Per object full consistency or eventual consistency. Unity Verified Solution The Unity Verified Solutions program, including Photon Fusion, denotes top-quality, compatible solutions rigorously reviewed for seamless Unity integration, highlighting a key achievement for developers. MINIMIZED BANDWIDTH Extreme Optimization:Replication Algorithms Fusion implements two replication algorithms that can be switched between: FullConsistency(Default) Uses additional bandwidth per object to ensure each object is internally consistent, meaning that all state you see on an object is from the same tick. EventualConsistency(Advanced) Uses less bandwidth per object, allowing more objects to be packed into each update, but the state seen on each object might be from two different ticks. Number ofPlayers Bandwidth FULL CONSISTENCY EVENTUAL CONSISTENCY MAXIMIZED PERFORMANCE An Evolutionary Leap in Multiplayer Engineering Fusion is an evolution in multiplayer engineering by handling many more players and objects than ever before. Fusion’s bandwidth usage is 6x smaller than MLAPI or Mirror; it is optimized to consume less CPU on the server, allowing more flexibility for gameplay elements or lower server specs and deployment costs. Bandwidth Usage Allocations per frame CPU usage on server 0 123 20Hz packet rate, from server to each client, lower is better Lower is better Lower is better Fusion MLAPI Mirror SIMPLIFYING GAME DEVELOPMENT Flexible Network Topologies Fusion supports different network topologies and replication algorithms while exposing a single consistent API. This allows developers to focus on what really matters most: writing their own game. DEDICATED SERVER Dedicated server with public IP (headless Unity instance) A Authority ++ Server has full authority S State ++ Server migration possible L Latency ++ Low latency: Direct connection from client to server % QoS ++ Stability of the game engine $ Cost -- Dedicated server orchestration CLIENT HOST One Player is the „host“. All other Players connect to him. A Authority -- Host has full authorityHacking/cheating possible S State ++ Turnkey host migration L Latency / Latency good (punch) or relatively bad (relay)Quality depends on host % QoS - Depends on players/hosts $ Cost ++ Hosted by players + Photon Cloud SHARED AUTHORITY Room has state authority and optional plugin (custom code). A Authority / Room has state authority but clients control state of objects assigned to them S State ++ Room is keeping the full game state L Latency ++ Direct connection to room in region % QoS + High stability + uptime $ Cost ++ Cost efficient DETERMINISTIC Quantum: Each client runs a deterministic simulation. A Authority ++ Server has input authority and can referee sim S State ++ Room is keeping the full game state L Latency ++ Direct connection to room in region (edge) % QoS + High stability + uptime $ Cost ++ Cost efficient Snapshot of Fusion Capabilities Discover the essential details of the top-tier state-sync netcode SDK designed for Unity professionals. HAVE A LOOK Servers Photon Cloud – The Global Low Latency Infrastructure Reach more gamers around the world with Photon Cloud performant servers placed at 15 strategic locations while being DDoS protected. Raw power to deliver your game data as fast as possible. Photon Fusion features saved us time and effort and met our product goals for a large player capacity. Partnering with Photon has been a pleasure. Russell BallVice President of Engineering Schell Games (Among Us VR) We’ve used all of Photon’s services internally and for our external clients, so don't expect us to choose another multiplayer engine soon! BitCake Studio (Atomic Picnic) Trusted by Leading Corporations, Agencies & Platforms Ready to Build a New Benchmark Experience? Fusion’s top-tier state-sync netcode SDK provides all essential features to create extraordinary multiplayer experiences. BUILD FOR FREE"
year_published = 2025
