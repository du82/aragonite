full_description = "跨平台聊天，無需擔心冒犯性語言 可以輕鬆整合您App中的跨平台交談系統，並可隨時提升最大同時交談數。 試用免費方案 功能 價格 功能 隨插即用 Photon Chat 是在應用程式或遊戲中新增交談功能較快速且簡單的方式。在短時間內就能開始使用。放心讓系統隨著您的使用者基礎進行無縫調整。遊玩。 安全頻道，始終如一 需要全球聊天、多區域和基於氏族的聊天以及私人頻道？讓我們解決這個問題。Photon Chat 允許用戶創建和訂閱任意數量的頻道。 訊息緩衝 Photon Chat 提供各交談頻道訊息緩衝，方便回覆先前的訊息， 例如對剛加入交談的使用者十分實用。 智慧訊息 Photon Chat 不僅允許您在頻道中傳送文字訊息， 也可傳送智慧訊息： hashtables、字典、字串陣列、ints 等 獨立或混搭 Photon Chat 是建立可擴充交談的統包解決方案。您可單獨使用或輕鬆結合任何其他 Photon 產品使用。完全視您喜好而定。 讓人安心的價格 公道且透明：100% 用量皆以同時上線人數 (CCU) 為基準。 彈性：利用免費方案開始開發，可隨時升級或降級。 免擔心：任何月方案超過 CCU 時不會立即限制。 完美搭配您遊戲的推出。 免費試用 空前的跨平台支援。 在無數遊戲中得到證明。 Bad Word Filter for Your Chat 即時過濾 我們的合作夥伴Community Sift所提供的世界級過濾功能能讓您的對話功能維持安全而無害。 讓霸凌、約炮、詐欺、傷害行為遠離您的對話功能。 一分鐘就能搞定設定 要加入這個世界級的惡質發言過濾器，其實非常容易。進入Photon Chat的設定畫面、選擇啟用、選擇過濾等級、儲存，就搞定了！ 內容偵測式服務 Photon Chat的惡質發言過濾器使用了超過百萬種的語言特徵來分析各種語言，每天有著數十億的文字流量。 亦可在風險分析中指定用戶的聲譽評價來免除過濾誤判。 這個價位，這個功能，無與倫比 Photon Chat和惡質發言過濾器是獨一無二的搭配。 世界上找不到第二個能在功能和價格面披敵的方案。 Photon Cloud - 背後動力 您透過我們 Photon 產品套件開發的所有應用程式都能在 Photon Cloud 上執行。 我們在此將負責服務託管、營運及調整比率。 您可將重心集中在建造遊戲或應用程式！ Photon Enterprise Cloud – 專用伺服器 & 自訂代碼外掛程式 簡單來說，Photon Enterprise Cloud 和有口皆碑的 Photon Cloud是相同的東西，並再提供了下列功能：在專用伺服器上執行，提供服務層級協議 (SLA) 與高優先度支援。其他優勢還有：您可透過Plug-in來調整伺服器端的動作邏輯細節。 一般 Photon Enterprise Cloud 方案為擁有超過 10,000 名同時上線使用者的應用程式、適合於需要客製化伺服器邏輯，或需要遵循政策限制僅可使用專屬伺服器的公司或大型遊戲專案。 有興趣嗎？請您聯絡我們 [email protected]. 可擴充、可靠 & 隨時保持連線 所有Photon Cloud產品均基於客戶端到伺服器架構，是多人遊戲最穩定的解決方案！ 在點對點架構中，客戶端通常會因 NAT 穿透問題而無法連線。 此問題在Mobile網絡中更加嚴重。但搭配 Photon Cloud，您的遊戲將始終會保持連線。 我們的運營團隊會 24/7 全天候監控伺服器，並可以隨時擴展所需資源。 無論您的遊戲需要數百或數十萬玩家同時上線，我們都會根據您的需求對其進行擴展。 這裡有很多好夥伴 Join 800,000 Developers and Studios. PHOTON CLOUD REGIONS 伺服器就在玩家旁邊 低延遲是即時多玩家遊戲中最重要的需求。基於此因素，Photon Cloud 在全球主要區域皆設有主機，以提供您的玩家最低延遲效果。 遊戲視低延遲而定，如 FPS 或 RTS 遊戲類型，都會將玩家連接至最近的區域。可處理高延遲的遊戲 (例如回合制遊戲類型) 能將所有玩家連接至相同的區域。 請參閱此處了解可用區域和設置說明 試用免費方案 作品分享，選自 849,933 個由我們雲端託管的應用程式。"
