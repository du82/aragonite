Arab Emirates SIGN UP 2000 CCU PER MONTH $ 500 Includes 2,000 Connected Users at the Same Time. For Games Only Suitable for ˜ 800 k MAU Includes 6.0 TB Traffic per Month CCU Burst included Additional GB $0.05 Europe / Canada, East / RU / RUE / USA, East / USA, West $0.10 Asia / Australia / China / India / Japan / South Africa / South America / South Korea / Turkey / United Arab Emirates SIGN UP You can down- or upgrade your Photon plan at any time. Switching between Public-, Premium- and Enterprise Cloud is seamless and without any service interruption. SIGN UP Photon PREMIUM CLOUD FOR GAMING Automatically Adapts to Your Usage for up to 50,000 CCU PER CCU INVOICED based on monthly usage $0.50 MINIMUM FEE 2,000 CCU + 6.0 TB Traffic included PER MONTH $1,000 Includes 2,000 Connected Users at the Same Time. For Games Only Suitable for up to ≈ 20m MAU Includes 3.0 GB Traffic per Peak CCU per Month Usage-Based CCU Auto-Scaling CCU Burst for CCU > 50k DDoS Protected by Default Additional GB $0.05 Europe / Canada, East / RU / RUE / USA, East / USA, West $0.10 Asia / Australia / China / India / Japan / South Africa / South America / South Korea / Turkey / United Arab Emirates SIGN UP Service levels with guaranteed response times, premium support by our operation specialists or our 24/7 NOC team are optionally available to Premium Cloud customers. Contacts us for details. SIGN UP Not Building a Game? Photon Industries Circle offers access to special hosting products, coding samples including priority support - required for business use cases like education, training, medical, simulation, collaboration, meeting, events, defense, sports, metaverse, social VR/XR, arcades and more. SEE CIRCLE Photon ENTERPRISE CLOUD Dedicated, Managed Cloud Environment for Multiple Unlimited CCU Titles. Guaranteed service levels and plugins for server authoritative logic make it the trusted choice for the world’s top studios. Unlimited Titles SLA (incl. Uptime and Response Time) Priority Operations Support Dedicated Servers Server Authoritative Logic via Plug-Ins Premium Dashboard and Counters Multi-layered DDoS Protection CONTACT US CCU The number of users allowed to connect to your application is defined by its CCU. For plans the CCU total is defined by the sum of peaks for all regions. Sample Month: EU peak 420 CCU, US peak 230 CCU, Other regions 0 CCU — CCU total = 420 + 230 = 650, matching 1000 CCU subscription plan. CCU Burst, Overage Don't worry about losing users - we allow you to temporarily burst your agreed CCU limit and will simply bill this CCU overage with next month's invoice according to the fees set out in your subscription agreement. After your first burst you have 48 hours to upgrade your subscription plan before we, subject to our sole discretion, may cap your number of CCU to the agreed number. For the CCU burst, the number of CCU is defined by the sum of CCU peaks over all connected regions. Traffic Calculation The included traffic depends on your subscription plan. All incoming and outgoing messages to the Photon Cloud servers count towards the traffic limit. Overage fees apply to traffic exceeding that limit. Sample: 1000 CCU plan * 3 GB incl. per CCU = 3 TB included traffic. One-Time Plans One-time plans apply to one application and for 12 months, no recurring fees. You can add 100 CCU to any other existing monthly subscription plan, e.g. 100 + 500 = 600 CCU in total. Can be applied to an app only once at a time. Monthly Active Users We assume, as rule of thumb and based on our experience, 1 CCU to match 20 daily active users (DAU). Each DAU translates to 20 monthly actives (MAU). Down- and Upgrade at any Time Downgrade and upgrade subscription plans at any time. Additional CCU are available immediately. Any fees paid but unused will be credited automatically. Termination takes effect at the end of the month. Free Support Comprehensive online docs, free samples, tutorials, video streams, assistance with non-technical issues like account activations, account management, billing and service status are free and included in all our plans. Gaming Circle Premium Support Gaming Circle is our premium development support program and includes direct chat support for all Photon products, exclusive samples, access to our Circle Discord pro community and much more. Read more here. Regions For optimum round-trip-times your application can connect the nearest region we host in. Choose from multiple regions around the globe. Still Questions? Drop us a line to get an answer :) [email protected]"
