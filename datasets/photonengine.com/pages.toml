title = "글로벌 크로스 플랫폼 실시간 게임 개발"
description = "동기형 게임과 어플리케이션용 서비스로서의 글로벌 크로스 플랫폼 멀티 플레이어 게임 백엔드(SaaS, Cloud). Android, iOS, .NET, Mac OS, Unity 3D, Windows, Flash, HTML5 그외 SDK가 이용 가능합니다."
full_description = "멀티플레이어 게임 및 애플리케이션을 위한 기본 레이어 인디/프로 개발자 누구나 실시간 멀티 플레이어 게임을 개발하여 세계로 진출할 수 있습니다. 동기/비동기 게임 플레이를 만들어, 커스텀 webhook을 코딩하세요! 무료 플랜 시작하기 특징 가격 Photon Realtime 의 특징 RealtimeCloud Photon Realtime을 이용한 게임은 글로벌 규모로 분산되어 있는 Photon Cloud내에 호스팅되어, 세계 각국의 플레이어에게 짧은 RTT를 보증하고 있습니다. MultiplayerConnect, Match and Play Photon Realtime’s core provides the rock-solid foundation for any type of room based multiplayer game. You concentrate on building a great title while we take care of game servers and hosting. MatchmakingAPI 랜덤, 또는 조건 검색으로 플레이어의 매칭이 가능합니다. 또한 오픈룸의 목록을 작성, 플레이어를 선택할 수도 있습니다. 모바일, PC, 콘솔 기기, 웹에서의 작동도 안심하실 수 있습니다. Sync andAsync Games 턴베이스형 게임의 모드를 동기, 비동기가 자유롭게 변경 가능합니다. 플레이어는 접속이 중단된 경우에도 같은 룸에 재접속이 가능합니다. CloudSave HTTP 웹훅을 통해 게임 상태를 클라우드 또는 자체적인 스토리지에 보존할 수 있습니다. 보존되는 게임 상태에는 플레이어 데이터, 룸 데이터, 속성 및 이벤트 캐시 등 모든 중요 게임 데이터가 포함됩니다. CrossPlatform 고객님이 고르신 게임 플랫폼에서, 원하시는 개발 엔진과 프레임워크를 이용, 직접 개발, 구성할 수 있습니다.<br> Photon은 크로스 플랫폼 멀티 플레이어 게임의 마켓에서 리더적 존재이며, Unity내 No.1의 소프트웨어입니다. HighestScalability Photon Realtime 을 이용한 게임은 CCU수에 따라 자동적으로 스케일링 됩니다. 공정하고 투명한 금액으로 제공되며, 이는 이미 많은 이용자에 의해 증명되고 있습니다. Customisation 어떠한 멀티플레이어 게임을 개발하기 원하십니까? FPS 또는 아케이드 슈팅 게임입니까? RPG 또는 실시간 전략 시뮬레이션 게임입니까? 레이싱 또는 스포츠 게임입니까? MOBA 또는 타워 디펜스 게임입니까? 아니면 새로운 종류의 액션 게임입니까? PUN은 모든 인기 게임 플랫폼에서 모든 타입의 룸 기반 게임을 지원합니다. Clientto Server Photon 을 이용한 게임은, Photon Cloud를 경유하여 언제든지 원하는 만큼 메시지를 전송할 수 있습니다. RUDP, TCP, HTTP, WebSocket 등, Photon의 스피디한 클라이언트 서버 Architecture는 고객님의 타이틀에게도, 게임 산업 전체에도, 가장 완벽한 기반이 될 것입니다. UnmatchedFlexibility Photon is super flexible: you can match an iOS Game Center user with someone using Google Play Services, authenticate a user via Facebook or add a custom authentication, utilize a gaming service or hook in your own backend. Worry-FreePricing 공정/명료함: 100% CCU 수를 베이스로 과금이 정해집니다. 유연성: 무료 플랜으로 시작하여 언제든지 플랜의 업/다운그레이드가 가능합니다. 안심: 월정액 플랜을 이용하시면, CCU과 초과되어도 금방 제한이 걸리지 않습니다. 당신의 게임출시에 완벽한 시스템! Start Creating. Try Realtime Now! BUILD FOR FREE Photon Cloud - 숨겨진 파워의 비밀 Photon 서비스를 이용해 개발한 여러분의 어플리케이션은 Photon Cloud 내에서 가동됩니다. 저희는 호스팅, 시스템 운용, 스케일에 관해 세심한 주의를 기울여 관리합니다. 여러분은 게임 어플리케이션 개발에만 집중하실 수 있도록, 저희가 도와드리겠습니다! Photon Enterprise Cloud – 전용 서버 & 커스텀 코드 플러그인 한 마디로, Photon Enterprise Cloud는 Exit Games의 유명한 퍼블릭 클라우드인 Photon Cloud와 유사하며 다음과 같은 기능이 추가되어 있습니다: 전용 서버에서 실행되며, 보증된 서비스 레벨(SLA) 및 높은 우선순위의 지원을 제공합니다. 또 하나의 큰 장점은, 플러그인을 통해 자체 서버 로직을 움직일 수 있다는 점입니다. Photon Enterprise Cloud는 동시 접속자 수가 5,000명 이상인 앱, 자사의 서버 로직이 필요한 대규모 게임 프로젝트 또는 전용 리소스만을 사용해야 하는 규정이 있는기업 등에서 이용하는 경우가 많습니다. 문의처: [email protected]. 확장성과 신뢰성 & 언제 어디서나 접속 가능 모든 Photon Cloud 제품은 멀티플레이어 게임을 위한 가장 안정적인 솔루션인 클라이언트-서버 아키텍처를 기반으로 합니다! 피어 투 피어 아키텍처의 경우 클라이언트는 NAT 펀치스루 문제로 인해 연결할 수 없는 경우가 있습니다. 해당 문제는 모바일 네트워크에서 더욱 많이 발생하지만 Photon Cloud를 사용하면 여러분의 게임은 항상 안정적으로 접속이 가능합니다. 저희의 운영 팀은 24/7로 서버를 모니터링하고 언제든지 필요한 리소스를 확장해 드릴 수 있습니다. 게임에 수백 명 또는 수십만 명의 동시 사용자를 위한 용량이 필요하다면 언제든지 고객님의 요구에 맞게 확장해 드립니다. PHOTON CLOUD REGIONS 플레이어의 접속 지역과 호스팅 실시간 멀티플레이어 게임에서 응답 속도의 스피드는 필수 조건이죠.그래서 Photon Cloud는 응답 속도의 스피드를 위해 여러분의 플레이어가 있는 세계 각지에 호스팅되어 있습니다. FPS 나 RTS 등, 응답 속도의 스피드가 중요시되는 게임은 가장 가까운 지역의 이용자가 접속됩니다. 응답 속도가 덜 요구되는 턴 제도 게임 등은, 지역을 지정해서 접속이 가능합니다. 사용 가능한 지역 및 설정 지침은 여기를 참조하세요. 무료 플랜 시작하기 많은 동료들이 기다리고 있습니다. Join 800,000 Developers and Studios. 자 그럼, 849,933 의 Photon Cloud내에 설치된 어플리케이션의 일부를 소개합니다. Ready to Build a New Realtime Experience? Connect, match users and play: Photon Realtime is the base foundation for multiplayer games for dozens of platforms. START FOR FREE"
