title = "서비스로서의 글로벌 크로스 플랫폼 Chat(SaaS, Cloud)"
description = "채널, 텍스트, 바이너리 메시지, 각 내역 등을 위한 채널 Subscription을 포함한, 서비스로서의 글로벌 크로스 플랫폼 챗 (SaaS, Cloud). SDK는 android, iOS, .NET, Mac OS, Unity 3D, Windows, HTML5 이외에서도 이용 가능합니다."
full_description = "필터링 기능이 추가된 크로스 플랫폼채팅 서비스! 동시접속 수를 확장할 수 있는 크로스 플랫폼 채팅 시스템을 고객님의 어플리케이션에 간단히 추가할 수 있습니다. 무료 플랜 신청하기 특징 가격 특징 플러그 앤 플레이 Photon Chat은 어플리케이션과 게임에 간단하고 빠르게 채팅 기능을 추가할 수 있습니다. 사용자의 이용상황에 따라 매끄럽게 확장되어 가기 때문에, 번거로움 없이 이용이 가능합니다. 언제나 안전한 채널 글로벌 채팅, 여러 지역 및 클랜 기반 채팅, 비공개 채널이 필요하십니까? 이 문제를 해결하겠습니다. Photon Chat을 사용하면 사용자가 원하는 수의 채널을 만들고 구독할 수 있습니다. 메시지버퍼 Photon Chat은 각 Chat 채널에 버퍼를 제공하고 있어, 이전 메시지를 리플레이 할 때 편리합니다.(예: 새 Chat 사용자가 참가할 경우 등) 스마트 메시지 Photon Chat 은 각 채널을 통해 텍스트 메시지 뿐만 아니라, 스마트 메시지도 전송이 가능합니다. 예)Hash Tables, Dictionaries, 문자열정렬, 정수화 등. Standalone 또는 Mashup Photon Chat 은 확장성 높은 채팅 시스템의 구축에 많은 도움이 되는 솔루션입니다. Photon Chat 자체로도 이용이 가능하며, 다른 Photon 서비스와 함께 이용하실 수도 있습니다. 안심 가격 설정 공정/명료함: 100% CCU 수를 베이스로 과금이 정해집니다. 유연성: 무료 플랜으로 시작하여 언제든지 플랜의 업/다운그레이드가 가능합니다. 안심: 월정액 플랜을 이용하시면, CCU과 초과되어도 금방 제한이 걸리지 않습니다. 당신의 게임출시에 완벽한 시스템! 무료로 사용해 보세요 비교할 수 없는 교차 플랫폼 서포트. 수많은 게임에서 인증되었습니다. Chat에서 부적절한 단어를 필터링 실시간 챗 필터링 저희 파트너사인 Community Sift가 제공하는 세계적인 챗 필터를 사용하여, 채팅을 깨끗하고 안전하게! 폭력적인 표현이나 성적 묘사, 유해성 높은 단어 등을 필터링합니다. 1분만에 설정 완료 세계적인 챗 필터를 제일 간단하게 추가할 수 있는 방법! 관리화면에서 Photon Chat을 체크해서 유효화 후, 희망하시는 폴리시를 선택하시고 저장하기만 하면 OK! 컨텍스트 베이스 서포트 Photon Chat의 필터링 기능은, 다양한 언어로 대응하며 100만 이상의 어휘를 분석하고 있습니다. 수십억의 메시지가 매일 필터링되고, 사용자들의 평가와 컨텍스가 리스크 분석에 추가되는등, 그 성능은 나날이 발전하고 있습니다. 다른 곳에서는 찾아볼 수 없는 기능과 가격 Photon Chat과 옵션기능인 Chat Filter를 함께 사용하면, 완벽한 솔루션이 됩니다! 다른 곳에서는 찾아볼 수 없는 기능과 저렴한 가격을 만나보세요! Photon Cloud - 숨겨진 파워의 비밀 Photon 서비스를 이용해 개발한 여러분의 어플리케이션은 Photon Cloud 내에서 가동됩니다. 저희는 호스팅, 시스템 운용, 스케일에 관해 세심한 주의를 기울여 관리합니다. 여러분은 게임 어플리케이션 개발에만 집중하실 수 있도록, 저희가 도와드리겠습니다! Photon Enterprise Cloud – 전용 서버 & 커스텀 코드 플러그인 한 마디로, Photon Enterprise Cloud는 Exit Games의 유명한 퍼블릭 클라우드인 Photon Cloud와 유사하며 다음과 같은 기능이 추가되어 있습니다: 전용 서버에서 실행되며, 보증된 서비스 레벨(SLA) 및 높은 우선순위의 지원을 제공합니다. 또 하나의 큰 장점은, 플러그인을 통해 자체 서버 로직을 움직일 수 있다는 점입니다. Photon Enterprise Cloud는 동시 접속자 수가 5,000명 이상인 앱, 자사의 서버 로직이 필요한 대규모 게임 프로젝트 또는 전용 리소스만을 사용해야 하는 규정이 있는기업 등에서 이용하는 경우가 많습니다. 문의처: [email protected]. 확장성과 신뢰성 & 언제 어디서나 접속 가능 모든 Photon Cloud 제품은 멀티플레이어 게임을 위한 가장 안정적인 솔루션인 클라이언트-서버 아키텍처를 기반으로 합니다! 피어 투 피어 아키텍처의 경우 클라이언트는 NAT 펀치스루 문제로 인해 연결할 수 없는 경우가 있습니다. 해당 문제는 모바일 네트워크에서 더욱 많이 발생하지만 Photon Cloud를 사용하면 여러분의 게임은 항상 안정적으로 접속이 가능합니다. 저희의 운영 팀은 24/7로 서버를 모니터링하고 언제든지 필요한 리소스를 확장해 드릴 수 있습니다. 게임에 수백 명 또는 수십만 명의 동시 사용자를 위한 용량이 필요하다면 언제든지 고객님의 요구에 맞게 확장해 드립니다. 많은 동료들이 기다리고 있습니다. Join 800,000 Developers and Studios. PHOTON CLOUD REGIONS 플레이어의 접속 지역과 호스팅 실시간 멀티플레이어 게임에서 응답 속도의 스피드는 필수 조건이죠.그래서 Photon Cloud는 응답 속도의 스피드를 위해 여러분의 플레이어가 있는 세계 각지에 호스팅되어 있습니다. FPS 나 RTS 등, 응답 속도의 스피드가 중요시되는 게임은 가장 가까운 지역의 이용자가 접속됩니다. 응답 속도가 덜 요구되는 턴 제도 게임 등은, 지역을 지정해서 접속이 가능합니다. 사용 가능한 지역 및 설정 지침은 여기를 참조하세요. 무료 플랜 시작하기 자 그럼, 849,933 의 Photon Cloud내에 설치된 어플리케이션의 일부를 소개합니다."
