title = "全球通用跨平台即時遊戲開發"
description = "適用於同步遊戲和應用程式的全球通用跨平台多人玩家遊戲後端服務 (SaaS、雲端)。SDK 適用於 android、iOS、.NET、Mac OS、Unity 3D、Windows、HTML5 及其他。"
full_description = "多人遊戲和應用程序的基礎層 不論是獨立開發者或AAA專業開發團隊，都能在全球各地開發及推出同步或者非同步的即時多人連線遊戲，還能使用Webhook 試用免費方案 功能 價格 Photon Realtime 功能 RealtimeCloud Photon Realtime 遊戲於我們的全域分散式 Photon Cloud 中託管，可保證您在全球各地的玩家都擁有低延遲與最短往返時間。 MultiplayerConnect, Match and Play Photon Realtime’s core provides the rock-solid foundation for any type of room based multiplayer game. You concentrate on building a great title while we take care of game servers and hosting. MatchmakingAPI 您可透過參數化搜尋或在遊戲中隨機配對玩家。 或者可建立開放空間清單並讓玩家挑選。 此作法有效。可靠。在行動裝置、電腦、遊戲主機和網路上。 Sync andAsync Games 自由切換同步與非同步回合制遊戲模式。 維持空間連線：讓玩家在發生斷線時或恢復遊戲時重新加入空間。 CloudSave 透過 HTTP webhook 在雲端或您專用的儲存裝置中保存您的遊戲狀態。此狀態含有所有相關遊戲資料：玩家料、空間資料、內容及事件快取。 CrossPlatform 您利用您最愛的引擎或架構在所選遊戲平台上直接開發及打造：<br> Photon 是名列前茅的跨平台多人玩家服務，也是適用 Unity 遊戲的全球 #1。 HighestScalability 利用 Photon Realtime 建立的遊戲可在 Photon Cloud 中進行無縫和自動的調整：範圍從少數幾人到上萬名同時連線的使用者。 包含公道且透明的價格。已證實。成功。 Customisation 您想打造多少名多人玩家的遊戲？ FPS 或街機射擊遊戲？RPG 或 RTS？ 競速或運動？MOBA 或 TD？ 其他類型的動作遊戲？ PUN 支援任何熱門遊戲平台上的任何類型Room-baed遊戲。 Clientto Server 支援 Photon 的遊戲用戶端每小時會透過 Photon Cloud 傳送數十億則訊息。 不論是否搭配 Reliable UDP、TCP、HTTP 或 Websockets： Photon 的高速用戶端至伺服器端架構是遊戲產業中適合您產品的最堅實基礎。 UnmatchedFlexibility Photon is super flexible: you can match an iOS Game Center user with someone using Google Play Services, authenticate a user via Facebook or add a custom authentication, utilize a gaming service or hook in your own backend. Worry-FreePricing 公道且透明：100% 用量皆以同時上線人數 (CCU) 為基準。 彈性：利用免費方案開始開發，可隨時升級或降級。 免擔心：任何月方案超過 CCU 時不會立即限制。 完美搭配您遊戲的推出。 Start Creating. Try Realtime Now! BUILD FOR FREE Photon Cloud - 背後動力 您透過我們 Photon 產品套件開發的所有應用程式都能在 Photon Cloud 上執行。 我們在此將負責服務託管、營運及調整比率。 您可將重心集中在建造遊戲或應用程式！ Photon Enterprise Cloud – 專用伺服器 & 自訂代碼外掛程式 簡單來說，Photon Enterprise Cloud 和有口皆碑的 Photon Cloud是相同的東西，並再提供了下列功能：在專用伺服器上執行，提供服務層級協議 (SLA) 與高優先度支援。其他優勢還有：您可透過Plug-in來調整伺服器端的動作邏輯細節。 一般 Photon Enterprise Cloud 方案為擁有超過 10,000 名同時上線使用者的應用程式、適合於需要客製化伺服器邏輯，或需要遵循政策限制僅可使用專屬伺服器的公司或大型遊戲專案。 有興趣嗎？請您聯絡我們 [email protected]. 可擴充、可靠 & 隨時保持連線 所有Photon Cloud產品均基於客戶端到伺服器架構，是多人遊戲最穩定的解決方案！ 在點對點架構中，客戶端通常會因 NAT 穿透問題而無法連線。 此問題在Mobile網絡中更加嚴重。但搭配 Photon Cloud，您的遊戲將始終會保持連線。 我們的運營團隊會 24/7 全天候監控伺服器，並可以隨時擴展所需資源。 無論您的遊戲需要數百或數十萬玩家同時上線，我們都會根據您的需求對其進行擴展。 PHOTON CLOUD REGIONS 伺服器就在玩家旁邊 低延遲是即時多玩家遊戲中最重要的需求。基於此因素，Photon Cloud 在全球主要區域皆設有主機，以提供您的玩家最低延遲效果。 遊戲視低延遲而定，如 FPS 或 RTS 遊戲類型，都會將玩家連接至最近的區域。可處理高延遲的遊戲 (例如回合制遊戲類型) 能將所有玩家連接至相同的區域。 請參閱此處了解可用區域和設置說明 試用免費方案 這裡有很多好夥伴 Join 800,000 Developers and Studios. 作品分享，選自 849,933 個由我們雲端託管的應用程式。 Ready to Build a New Realtime Experience? Connect, match users and play: Photon Realtime is the base foundation for multiplayer games for dozens of platforms. START FOR FREE"
