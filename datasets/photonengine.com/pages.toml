 포함되는 전송량은 이용하는 플랜의 CCU 수에 따라 계산됩니다. 모든 Photon Cloud 서버로의 송수신 메시지가 전송량의 대상입니다. 기본 포함량을 초과하는 전송량에 대해서는 상단에 표기된 바와 같이 초과 요금이 부과됩니다. 예： 100CCU플랜을 이용할 경우, 1CCU당 3GB가 포함되어 있으므로, 기본 전송량은 300GB 입니다. One-time 플랜(12개월간) One-time 플랜(12개월간)은 하나의 어플리케이션에만 적용되며, 월 정액제가 아닌 한번의 지불로 12개월간 이용이 가능한 플랜입니다. One-time 플랜(12개월간)의 CCU는, 다른 월 정액제 플랜에 추가가 가능합니다. 예) 500CCU플랜에 100CCU를 추가하면 총600CCU가 사용 가능합니다. 월간 액티브 사용자 월간 액티브 사용자(MAU)는, 1CCU=20DAU(데일리 액티브 사용자)=400MAU로 계산됩니다. 언제든지 업/다운그레이드 가능 이용중인 플랜은 언제든지 업그레이드/다운그레이드가 가능하며, 변경된 CCU수는 즉시 적용됩니다. 이전 플랜의 지불 완료된 요금은 자동적으로 이월됩니다. 또한, 해약의 경우에는 월말의 날짜로 해약이 적용됩니다. 무료 서포트 종합적인 온라인 문서, 무료 샘플, 튜토리얼, 비디오 스트림, 계정 활성화, 계정 관리, 청구 및 서비스 상태와 같은 비기술적 문제에 대한 서포트는 무료이며 모든 플랜에 포함되어 있습니다. Gaming Circle 프리미엄 서포트 Gaming Circle은 프리미엄 개발 서포트 프로그램으로써 모든 Photon 제품에 대한 다이렉트 채팅 서포트, 전용 샘플, Circle Discord 프로 커뮤니티 접속 등을 포함합니다. 자세한 내용은 여기를 참조해 주세요. 자세한 사항은 확인해 주세요.. 지역 최적의 RTT(Round Trip Times)가 될수 있도록, 고객님의 어플리케이션으로 부터 가장 가까운 지역을 선택하실 수 있습니다. 전 세계의 여러 지역에서 이용이 가능합니다. 그외 궁금한 점은 없으신가요? 여기로 문의하십시오: [email protected]"
