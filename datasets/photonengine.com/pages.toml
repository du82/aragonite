 Developer Forum: https://forum.photonengine.com Keep yourself up to date following Exit Games on Twitter http://twitter.com/exitgames and our blog at http://blog.photonengine.com/. 전개하기 접기 SDK를 다운로드 v5.0.0.2 문서 https://doc.photonengine.com/pun/current/consoles/xbox API 문서 C# API 상세 정보 … Chat Android Android ReadMe Photon Android NDK SDK ------------------------------------------ Photon is the world's #1 independent networking engine and multiplayer platform - Fast, reliable, scalable. Use the Photon Android NDK SDK to easily add multiplayer to your games. Run them in the global Photon Cloud or host your own Photon Servers. Match your players to a shared game session (called "room") and transfer messages synchronously, in real-time, between connected players across platforms. All client SDKs can interact with each other, no matter if iOS, Android, web, console or standalone. Package Contents ------------------------------------------ /Chat-cpp - Photon Chat sources /Common-cpp - common sources /doc - Release history, API documentation /LoadBalancing-cpp - Photon Realtime sources /Photon-cpp - common Photon sources /PhotonVoice-cpp - Photon Voice sources /Demos /demo_basics: The demo client is basically a 'Hello World'. So it's the best place to start if you are new to the SDK. /demo_chat: The demo shows a basic way of using the Photon Chat API with a graphical user interface. This uses the Cocos2D-x graphics engine. /demo_loadbalancing: The demo client connects to a master server and shows how to create a room, join a random game and how to send and receive events within a running game. /demo_memory: This demo displays Photon's asynchronous turnbased features in a game of Memory. This uses the Cocos2D-x graphics engine. /demo_particle: The demo client connects to a master server and shows the random matchmaking mechanism, how to create a room and how to send and receive events within a running game. Players move 'their' blocks around and the positions are updated in realtime between clients. The UI shows areas of interest when activated. This uses the Cocos2D-x graphics engine. /demo_typeSupport: This demo displays the proper use of Photon's serializable data types. Contact ------------------------------------------ To get in touch with other Photon developers and our engineers, visit our Developer Forum: https://forum.photonengine.com Keep yourself up to date following Exit Games on Twitter http://twitter.com/exitgames and our blog at http://blog.photonengine.com/. 전개하기 접기 SDK를 다운로드 v5.0.12 ( 구 버전 … ) ( 구 버전: Photon-AndroidNDK-Sdk_v5-0-11-0.7z ) 문서 Chat 기술 문서 API 문서 C++ API 상세 정보 … Chat Unity Asset Photon Chat Unity 에셋 Photon Chat 무료 패키지로 고객님의 Unity 게임에 채팅 기능을 간단하게 추가하세요! Photon Chat의 유연한 채널 시스템으로, 원하는 만큼의 채팅 채널을 설정할 수 있습니다. 예를 들면, 글로벌 채팅이나 여러 리전간의 채팅, 가족 채팅 등을 함께 사용할 수 있게 됩니다. 또는 Photon Chat .NET SDK는 어떠신가요? 클라이언트 SDK를 사용하면, 보다 상세한 관리가 가능해집니다. Photon Chat .NET SDK를 다운로드 CHAT을 무료로 GET 멀티플레이어 기능이 아니라, 채팅 기능이 필요하십니까? Photon Chat이라면 무료로 간단히 추가할 수 있습니다. Chat Free는, PUN Free와 Pun Plus에 포함되어 있습니다. 이 패키지는 PUN Free와 PUN Plus와는 병용할 수 없습니다. 문서 Chat 기술 문서 상세 정보 … Chat Cocos2d-x Cocos2d-x ReadMe All C++ based Photon SDKs are compatible with Cocos2d-x off the shelf! Find the SDKs you can gear it up with linked to below. 전개하기 접기 지원 SDK Android , iOS , Windows 문서 Chat 기술 문서 API 문서 C++ API 상세 정보 … Chat Construct 2 Construct 2 ReadMe Photon SDK for Scirra Construct 2 readme. (C) Exit Games GmbH 2016 Overview ---------------------------------------------------------------------------------------------------- Photon SDK contains Scirra Construct 2 plugins exposing underlying Photon Javascript library functionality: - Photon Realtime Plugin allows to develop multiplayer games with clients communicating through Photon Cloud or self-hosted Photon Server. Follow https://www.photonengine.com/en/Realtime for info on Photon Realtime. - Photon Chat Plugin adds chat functionality to your game. Follow https://www.photonengine.com/en/Chat for info on Photon Chat. Installation ---------------------------------------------------------------------------------------------------- - Drag and drop photon.c2addon and photon-chat.c2addon files into the Construct 2 window. See Construct 2 documentation on plugins installation details. - Register a new realtime app at https://www.photonengine.com/en/Dashboard/Realtime - Register a new chat app at https://www.photonengine.com/en/Dashboard/Chat Running demos ---------------------------------------------------------------------------------------------------- - Find Photon object in project tree and set its AppId property to application id value from dashboard. - Select Main layout. - Run the application. Editor will open browser page. Copy url and open it in new browser pages. - Check browser console for helpful info. - Pool demo: all clients automatically join single room, each spawns the fish and notifies others with fish positions. Click on the pool makes owned fish move to the click location. - Test demo: automatically joins or creates new room. Pressing Leave will bring the client to the lobby where client can create new room or join existing from list. Also, test event firing is available inside the room (check other clients log for events receive report). - Chat demo: start 2 or more clients. For every client, choose user id and press Connect. When client is connected to front end, enter channel names separated by comma and press Subscribe. Select channel in list, enter message and press Publish. Or specify destination user id and send private message by pressing Send. Package Contents ---------------------------------------------------------------------------------------------------- - license.txt - the license terms - readme.txt - this readme text - release_history.txt - changelog - photon.c2addon - Photon Realtime Plugin - photon-chat.c2addon - Photon Chat Plugin - demo-test.capx - application for testing Photon Realtime features - demo-pool.capx - Realtime demo application - demo-chat.capx - Chat demo application Documentation ---------------------------------------------------------------------------------------------------- There is no Photon Construct 2 Plugin specific documentation or tutorials available currently. General documentation on Photon Realtime: http://doc.photonengine.com/en-us/realtime/current/getting-started/realtime-intro Photon Chat documentation: http://doc.photonengine.com/en-us/chat/current/getting-started/chat-intro Underlying Photon Javascript API reference: http://doc-api.photonengine.com/en/javascript/current Demos included in the package show clear how plugin works and may be used as tempaltes for real projects. Short descriptions available for each plugin item in editor. Download ---------------------------------------------------------------------------------------------------- The latest version of Photon Plugin for Scirra Construct 2 can be found at https://www.photonengine.com/Realtime/Download Contact ------------------------------------'''
