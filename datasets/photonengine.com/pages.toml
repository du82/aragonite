["https://www.photonengine.com/zh-tw/fusion"]
title = "為多人遊戲設置基準!"
description = "Global cross platform multiplayer game backend as a service. Photon Fusion for synchronous and asynchronous games and applications. Try for FREE"
full_description = "為多人遊戲設置基準! Photon Fusion 是為 Unity Professionals 製作的高端狀態傳輸網絡代碼 SDK。 通過多種網絡構造選擇，為玩家提供任何遊戲的最佳體驗。 BUILD FREE 功能 價格 構建最佳多人遊戲所需的強大功能： Tick-BasedSimulation 穩定準確的網路核心功能。 客戶端預測和快照插值的基礎。 Client-SidePrediction 即使在高延遲和網路丟失的情況下，也可以在不放棄伺服器權限的情況下讓玩家對自己的輸入做出即時響應。 HighPerformance Handle thousands of networked object over hundreds of client connections, including complex interest management. SnapshotInterpolation 即使在網路不好的條件下，也可以使用自動或自定義插值來實現流暢的視覺渲染。 LagCompensation 內置延遲補償 Hitbox，具有易於使用的 API，適用於電子競技級遊戲機制。 ReplicationSystems Delta 快照和最終一致性與有趣管理( Interest Management)的複制算法的一流實現。 Unity Verified Solution The Unity Verified Solutions program, including Photon Fusion, denotes top-quality, compatible solutions rigorously reviewed for seamless Unity integration, highlighting a key achievement for developers. MINIMIZED BANDWIDTH Extreme Optimization:Replication Algorithms Fusion implements two replication algorithms that can be switched between: FullConsistency(Default) Uses additional bandwidth per object to ensure each object is internally consistent, meaning that all state you see on an object is from the same tick. EventualConsistency(Advanced) Uses less bandwidth per object, allowing more objects to be packed into each update, but the state seen on each object might be from two different ticks. Number ofPlayers Bandwidth FULL CONSISTENCY EVENTUAL CONSISTENCY MAXIMIZED PERFORMANCE An Evolutionary Leap in Multiplayer Engineering Fusion is an evolution in multiplayer engineering by handling many more players and objects than ever before. Fusion’s bandwidth usage is 6x smaller than MLAPI or Mirror; it is optimized to consume less CPU on the server, allowing more flexibility for gameplay elements or lower server specs and deployment costs. 頻寬使用 每幀分配 伺服器CPU使用量 0 123 20Hz packet rate, from server to each client, lower is better Lower is better Lower is better Fusion MLAPI Mirror SIMPLIFYING GAME DEVELOPMENT Flexible Network Topologies Fusion supports different network topologies and replication algorithms while exposing a single consistent API. This allows developers to focus on what really matters most: writing their own game. DEDICATED SERVER 具有公共 IP 的專用伺服器（Headless Unity instance） A 權限 ++ 伺服器擁有完全權限 S 狀態 ++ 可執行伺服器遷移 L 延遲 ++ 低延遲：從客戶端直接連到伺服器 % QoS ++ 遊戲引擎的穩定性 $ 費用 -- 專用伺服器的編排 CLIENT HOST 一名玩家當Host，其他玩家會連到該Host A 權限 -- Host擁有完全權限 可黑客/作弊 S 狀態 ++ Turnkey Host遷移 L 延遲 / 延遲好(Punch)或相對差(relay)質量取決於Host % QoS - 取決於玩家/Host $ 費用 ++ 玩家+Photon Cloud託管 SHARED AUTHORITY 房間有狀態權限以及可選插件(自定義代碼) A 權限 / 房間具有狀態權限，但客戶端可控制分配到的物件狀態 S 狀態 ++ 房間具有狀態權限，但客戶端可控制分配到的物件狀態 L 延遲 ++ 直接連到Region內的房間 % QoS + 高穩定性+正常運行時間 $ 費用 ++ 成本效益高 DETERMINISTIC Quantum: 每個客戶端執行決定論性模擬 A 權限 ++ 伺服器有輸入權限，可參考sim S 狀態 ++ 房間具有狀態權限，但客戶端可控制分配到的物件狀態 L 延遲 ++ 直接連到Region內的房間 % QoS + 高穩定性+正常運行時間 $ 費用 ++ 成本效益高 Snapshot of Fusion Capabilities Discover the essential details of the top-tier state-sync netcode SDK designed for Unity professionals. HAVE A LOOK 伺服器 Photon Cloud –全球低延遲基礎設施 通過放置在 15 個戰略位置的 Photon Cloud 高性能服務器，在受到 DDoS 保護的同時，為全球眾多遊戲玩家提供服務。我們盡可能更快的提供遊戲數據而努力。 Photon Fusion features saved us time and effort and met our product goals for a large player capacity. Partnering with Photon has been a pleasure. Russell BallVice President of Engineering Schell Games (Among Us VR) We’ve used all of Photon’s services internally and for our external clients, so don't expect us to choose another multiplayer engine soon! BitCake Studio (Atomic Picnic) Trusted by Leading Corporations, Agencies & Platforms Ready to Build a New Benchmark Experience? Fusion’s top-tier state-sync netcode SDK provides all essential features to create extraordinary multiplayer experiences. BUILD FOR FREE"
