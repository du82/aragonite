ions. It offers extensive options for tailoring control systems, ensuring seamless performance in your game. All features of the simple KCC Support for moving platforms Optional render movement prediction Fusion SHARED AUTHORITY, Fusion CLIENT HOST, Fusion DEDICATED SERVER TRY NOW Fusion Animations Free Sample Fusion Animations FUSION Fusion Animations Discover the Fusion Animations sample, which showcases six methods for implementing synchronized animations in multiplayer games using Fusion. Explore various approaches to effectively handle animation networking in your projects. 6 examples integrated Render and Tick accurate approaches Includes Animancer example Fusion CLIENT HOST TRY NOW Fusion Area of Interest & Multi-Peer Free Sample Fusion Area of Interest & Multi-Peer FUSION Fusion Area of Interest & Multi-Peer This sample project demonstrates Photon Fusion's Area of Interest and Multi-Peer Mode features for optimizing multiplayer networking. It uses spaceships and meteors to showcase Area of Interest for efficient network management and Multi-Peer Mode for testing multiple clients without extra builds, focusing on networking functionality. Multi-Peer : multiple clients editor Area of Interest : optimization Setup configuration on main menu Fusion DEDICATED SERVER, Fusion CLIENT HOST, Fusion SHARED AUTHORITY TRY NOW Fusion Asteroids Simple Free Sample Fusion Asteroids Simple FUSION Fusion Asteroids Simple Discover the Fusion Asteroids sample, a beginner-friendly demo that showcases how to create arcade-style, top-down gameplay with straightforward and engaging mechanics. Ideal for beginners Client Host & Shared Authority versions Fusion SHARED AUTHORITY, Fusion CLIENT HOST, Fusion DEDICATED SERVER TRY NOW Fusion Avatar VR Industries Circle Fusion Avatar VR FUSION Fusion Avatar VR The avatar addon offers a foundation for implementing avatar-specific features and includes a basic avatar system, demonstrating how users can create and customize their own avatars. Generate "simple avatar" model Animate avatar's eyes and mouth Configure the hair, cloth and skin Fusion SHARED AUTHORITY TRY NOW Fusion Battle Royal 200 Free Sample Fusion Battle Royal 200 FUSION Fusion Battle Royal 200 Explore the BR200 sample, a production-ready third-person battle royale shooter supporting up to 200 players at 60 Hz. It showcases Photon Fusion's server hosting capabilities, including player-hosted, dedicated, and Unity Game Server Hosting modes for seamless, high-performance gameplay. Up to 200 players at 60 Hz Lag compensated shooting Tick-accurate animation system Fusion DEDICATED SERVER, Fusion CLIENT HOST TRY NOW Fusion Colocation MR Industries Circle Fusion Colocation MR FUSION Fusion Colocation MR This sample shows how to set up a project for colocalized multiplayer using Meta's shared spatial anchors. It also synchronizes hand tracking, enabling seamless transitions between controller-based hand positioning and finger tracking, offering a robust foundation for immersive multiplayer experiences. Uses Meta's shared spatial anchors Finger synchronization with Meta's hands Dynamic audio grouping Fusion SHARED AUTHORITY TRY NOW Fusion Cooking Coop Gaming Circle Fusion Cooking Coop FUSION Fusion Cooking Coop This "coop party cooking game", where players fulfill orders by chopping, cooking, and plating ingredients. Players collaborate to complete cooking orders before time runs out, with features like character customization, persistent objects, authority transfer, non-destructive disconnects, and crafting mechanics. The Coop Cooking Challenge Recipes and time based mechanics Shared authority with authority transfer Fusion SHARED AUTHORITY TRY NOW Fusion Desktop Focus VR Industries Circle Fusion Desktop Focus VR FUSION Fusion Desktop Focus VR The interaction differences between VR headsets and mouse-driven 3D applications make it challenging to create tools or interfaces that perform well in both. To simplify prototyping, the "Desktop Focus" module allows switching the interface to a mode specifically optimized for mouse control. Shift between scene objects Activate focusCamera Customizable UI Fusion SHARED AUTHORITY TRY NOW Fusion EXPO VR Industries Circle Fusion EXPO VR FUSION Fusion EXPO VR Discover how to create a social application for up to 100 players using Fusion. The Expo sample offers avatars, chat functions and screen sharing. There is seamless audio interaction via the Photon Voice SDK, so that players can communicate with each other when they are in the same chat bubble. Desktop PC are supported as well as VR. Up to 100 players Static and dynamic voice 'bubbles' 2D & 3D drawing Fusion SHARED AUTHORITY TRY NOW Fusion Finite State Machine AddOn Free Sample Fusion Finite State Machine AddOn FUSION Fusion Finite State Machine AddOn The Finite State Machine (FSM) addon for Fusion provides a powerful framework for managing game states and behaviors. It enables developers to create complex interactions, supports parallel execution of child state machines, and enhances scalability and organization in game development. Multiple FSMs can run in parallel Many flexible transition logic options Code-only FSM solution Fusion DEDICATED SERVER, Fusion CLIENT HOST, Fusion SHARED AUTHORITY TRY NOW Fusion Golf Free Sample Fusion Golf FUSION Fusion Golf The Fusion Golf sample showcases how to create an arcade-style golf racing game with a server-authoritative, client-predicted model. Featuring an 18-hole course, session browser, and customizable game settings, it highlights physics-driven mechanics and network synchronized game flow. Physics focussed gameplay Spectating other players Synchronized state of objects in the world Fusion CLIENT HOST TRY NOW Fusion Host Migration Free Sample Fusion Host Migration FUSION Fusion Host Migration This sample presents how to migrate the host in Client Host topology to another client after the original Host dropped out of the session. Main scene with basic framework and prefab