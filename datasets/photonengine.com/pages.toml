full_description = "專為專業用例量身定制的 多用戶解決方案。 使用 Photon SDK 進行協作、培訓、數字孿生、醫療保健、教育、會議等。Photon Industries 將領先的遊戲技術引入非遊戲領域，支持 VR、AR、PC、移動設備和網絡。 JOIN NOW 功能 CIRCLE 價格 加入 ELITE 包含在Circle Membership的內容 作為最大的多用戶專家社群的成員，您可以訪問所有 Photon 產品、服務和支援，以及獨特的授權選項，為您提供最大的靈活性。 主要用例的展示 使用一系列價值數万美元開發價值的模板啟動您的項目。我們的範例涵蓋了許多流行的用例，例如展覽、元宇宙、具有屏幕共享的舞台和會議室。 Hololens專用SDK 從 Hololens 2 UWP (ARM64) 上的 Photon 語音和視頻開始。您將能夠使用 Photon Video 傳輸攝像機信號並將遠程視頻投影到場景中。該 SDK 還支持 HologramComposition 和 Single-Pass Stereo Rendering。 專業社群 加入由世界上最優秀的多用戶軟件工程師組成的社群並成為夥伴吧！從我們的 Stack Overflow 知識庫獲取知識，該知識庫專供 Circle 會員使用。 從我們的核心工程師獲得幫助 我們的領先工程師已參與 Circle 社群和 Stack Overflow 知識庫，可直接從 SDK 創建者那裡提供答案。 私人頻道 您可以在私人頻道中解決機密主題和獨特的挑戰。在生產的關鍵階段獲得個性化支援。 PhotonVideo Video SDK 支持在多用戶情況下傳輸視頻和屏幕共享。該技術僅供 Circle 成員使用 專為企業用途量身定制 Photon產品Overview Fusion 伺服器權威狀態同步 Quantum 輸入的確定性同步 Voice 全雙工語音 Chat 純文字與二進位檔均可傳送 Video 視頻廣播和屏幕共享 Photon 簡化了安全、可擴展應用程序的開發。根據您的業務需求選擇在 Photon Cloud 上託管或在本地託管。 超快技術 Photon SDK 和服務經過精心設計，可實現最佳性能、可擴展性和安全性。從基礎開始精心計算。 跨所有引擎 Photon SDK 與最流行的圖形/遊戲引擎兼容：Unity、Unreal Engine 或 Native C/C++。 跨所有設備 Photon SDK 支持所有主要設備和平台，確保跨平台功能。 PhotonCloud 我們遍布全球的 Photon Cloud 可在全球範圍內實現安全、可擴展和低延遲的連接。可按需提供私人和企業設置。 Need to Host Your Own Photon Server? Secure. Private. Reliable. Proven by Enterprise Customers and our own Photon Cloud. Online and Offline versions available for Fusion, Voice, Video, Realtime and PUN SDK. HOSTING OPTIONS 最佳實踐代碼和模式 會議和活動範例 Photon 的會議和活動範例是打造個性化虛擬體驗的理想選擇。集成了虛擬活動的各個方面，模擬常見的會議或活動場景，可容納從少數到數千名參與者。 該模板在Unity 採用 Fusion、Voice、Video構建，包含手動控制頭像、空間語音等功能，為您的項目提供顯著的領先優勢。 Circle會員限定 Expo可同時容納約 300 名參觀者，提供展位和私人聊天氣泡等功能。要擴展此容量，建議使用Area功能。 舉辦現場活動，例如演講者會議或小組討論，最多可容納 1,000 名訪客。在這些活動期間保持對麥克風使用和屏幕共享的控制。 Avatar整合 提供的頭像選擇僅供演示。您可以使用您喜歡的任何 Avatar 系統。我們還支持 Meta Avatars 和 Ready Player Me。 區塊 您可以利用多層來擴大博覽會的容量。例如，10層樓可容納多達3000名遊客。 談話泡泡 與最多 8 名參與者進行私人對話，享受語音交流和完整的手/頭動作。 最佳實踐代碼/模式 利用本範例中提供的最佳實踐編碼模式和範例，根據您的特定需求和情況對其進行自定義。 我們的高級工程師為您策劃了這些獨家最佳實踐範例，旨在幫助您為網絡、移動、PC 和 VR 等平台開發活動和會議，能夠容納數千名參與者。 使用我們的範例快速啟動您的 Metaverse 專案。它包括一個中心、幾個房間、一個藝術展覽、一個休閒遊戲和一個 DJ 場景。 PHOTON INDUSTRIES ADD-ONS Improve Your Development with Our Add-Ons We provide our Circle members with a constantly growing list of reusable AddOns to speed up their 3D/XR application prototyping. Check Out the Most Popular Ones: 已受到廣大優秀公司，機構和平台的信賴。 Industries Circle!加入我們！ Photon 適用於任何對快速創建安全且可擴展的網絡體驗感興趣的人。 立即 加入"
