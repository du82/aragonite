full_description = "딱맞는 플랜이 있습니다! Photon이 사용된 모든 어플리케이션은 Photon Cloud에서 문제없이 실행됩니다. 호스팅, 운용, 스케일링 서비스 등, 모두 Photon에게 맡겨 주세요! 원하는 때에 원하는 플랜으로 업/다운 그레이드가 가능합니다. 최소한의 Ping으로 전 세계로 접속하세요! 특징 가격 GAMING INDUSTRIES Develop and Launch Your Game for Free in Photon Cloud Our Photon Cloud gaming plans have been proven in thousands of games across various genres and business models - whether you're developing premium games for platforms like Steam, free-to-play mobile titles, or immersive XR experiences. Start building today, launch your project for free, and only pay once your game scales beyond our free tier. Photon PUBLIC CLOUD GAMING용 Development Only 20 CCU DEVELOPMENT ONLY 무료 라이센스 동시에 최대20명 까지 이용 가능. 개발 전용 상한: 60.0 GB 트래픽 /월 제한: 20 CCU - CCU Burst 없음 가입 For Launch 100 CCU ONE-TIME 12개월간 유효 ₩ 171,000 동시에 최대100명 까지 이용 가능. 게임 어플리케이션전용 Suitable for ˜ 40 k MAU 이하를 포함 0.3 TB 트래픽 /월 제한: 100 CCU - CCU Burst 없음 가입 500 CCU /월 ₩ 171,000 동시에 최대500명 까지 이용 가능. 게임 어플리케이션전용 Suitable for ˜ 200 k MAU 이하를 포함 1.5 TB 트래픽 /월 CCU Burst 가 포함되어 있습니다. 추가할 경우: GB ₩90.00 Europe / Canada, East / RU / RUE / USA, East / USA, West ₩180.00 Asia / Australia / China / India / Japan / South Africa / South America / South Korea / Turkey / United Arab Emirates 가입 1000 CCU /월 ₩ 333,000 동시에 최대1,000명 까지 이용 가능. 게임 어플리케이션전용 Suitable for ˜ 400 k MAU 이하를 포함 3.0 TB 트래픽 /월 CCU Burst 가 포함되어 있습니다. 추가할 경우: GB ₩90.00 Europe / Canada, East / RU / RUE / USA, East / USA, West ₩180.00 Asia / Australia / China / India / Japan / South Africa / South America / South Korea / Turkey / United Arab Emirates 가입 2000 CCU /월 ₩ 666,000 동시에 최대2,000명 까지 이용 가능. 게임 어플리케이션전용 Suitable for ˜ 800 k MAU 이하를 포함 6.0 TB 트래픽 /월 CCU Burst 가 포함되어 있습니다. 추가할 경우: GB ₩90.00 Europe / Canada, East / RU / RUE / USA, East / USA, West ₩180.00 Asia / Australia / China / India / Japan / South Africa / South America / South Korea / Turkey / United Arab Emirates 가입 혁신적인 멀티플레이 게임 개발에 도전! MOBA, 브라울러, RTS, 격투, 스포츠게임을 신속한 예측 네트워크 엔진으로 개발할 수 있습니다. 가입 Photon PREMIUM CLOUD FOR GAMING 최대 50,000 CCU까지 사용량에 맞게 자동 조정 PER CCU 청구 월간 사용량 기준 ₩522.00 MINIMUM FEE 2,000 CCU + 6.0 TB 트래픽 included PER MONTH ₩1,044,000 동시에 최대2,000명 까지 이용 가능. 게임 어플리케이션전용 20m MAU까지 대응 이하를 포함 3.0 GB 트래픽 per Peak CCU /월 사용량에 따른 CCU 오토스케일링 50,000CCU 이상의 CCU Burst 디폴트 DDos 보호 추가할 경우: GB ₩90.00 Europe / Canada, East / RU / RUE / USA, East / USA, West ₩180.00 Asia / Australia / China / India / Japan / South Africa / South America / South Korea / Turkey / United Arab Emirates 가입 Premium Cloud 고객님은 응답 시간이 보장된 서비스 수준, 운영 전문가 또는 24/7 NOC 팀의 프리미엄 서포트을 선택적으로 이용할 수 있습니다. 자세한 내용은 문의해주세요. 자세한 내용은문의하세요. 가입 Not Building a Game? Photon Industries Circle offers access to special hosting products, coding samples including priority support - required for business use cases like education, training, medical, simulation, collaboration, meeting, events, defense, sports, metaverse, social VR/XR, arcades and more. SEE CIRCLE Photon ENTERPRISE CLOUD Photon Enterprise Cloud는 여러 타이틀 및 높은 CCU 타이틀을 위한 전용 클라우드 환경을 제공합니다. 서버 권한 로직을 위한 보장된 서비스 수준과 플러그인은 세계 최고의 스튜디오에서 신뢰를 받고 있습니다. 타이틀 수 제한 없음 SLA(업타임, 리스폰스 타임 포함) 우선 순위 오퍼레이션 서포트 전용 서버 플러그인에 따른 Server Authoritative 로직 프리미엄 관리 화면과 카운터 다중 레이어 DDoS 프로텍션 문의처 CCU CCU란 어플리케이션에 동시 접속 가능한 유저 수를 의미합니다. 각 플랜의 피크 CCU 합계가 모든 리전의 최대 이용 CCU가 됩니다. 예： EU 피크 CCU：420, US 피크 CCU：230, 그 외 리전 CCU：0 일 경우 합계CCU = 420 + 230 = 650 이 됩니다. 따라서 적절한 플랜은 1000CCU 플랜입니다. CCU Burst 일시적으로 CCU 수가 초과되어도 플레이가 중단되는 일은 없습니다. 계약에 명시된 요금에 따라 CCU가 초과된 만큼의 추가 요금을 다음 달에 청구합니다. 처음 CCU Burst 후 48시간 이내에 계약 플랜을 업그레이드 해 주십시오. 업그레이드가 이루어지지 않을 경우, 당사 판단으로 CCU 수를 제한할 경우가 있습니다. CCU Burst의 CCU 수는 접속되어 있는 모든 리전의 CCU 피크의 합계로 정의됩니다. 전송량 계산 기본 포함되는 전송량은 이용하는 플랜의 CCU 수에 따라 계산됩니다. 모든 Photon Cloud 서버로의 송수신 메시지가 전송량의 대상입니다. 기본 포함량을 초과하는 전송량에 대해서는 상단에 표기된 바와 같이 초과 요금이 부과됩니다. 예： 100CCU플랜을 이용할 경우, 1CCU당 3GB가 포함되어 있으므로, 기본 전송량은 300GB 입니다. One-time 플랜(12개월간) One-time 플랜(12개월간)은 하나의 어플리케이션에만 적용되며, 월 정액제가 아닌 한번의 지불로 12개월간 이용이 가능한 플랜입니다. One-time 플랜(12개월간)의 CCU는, 다른 월 정액제 플랜에 추가가 가능합니다. 예) 500CCU플랜에 100CCU를 추가하면 총600CCU가 사용 가능합니다. 월간 액티브 사용자 월간 액티브 사용자(MAU)는, 1CCU=20DAU(데일리 액티브 사용자)=400MAU로 계산됩니다. 언제든지 업/다운그레이드 가능 이용중인 플랜은 언제든지 업그레이드/다운그레이드가 가능하며, 변경된 CCU수는 즉시 적용됩니다. 이전 플랜의 지불 완료된 요금은 자동적으로 이월됩니다. 또한, 해약의 경우에는 월말의 날짜로 해약이 적용됩니다. 무료 서포트 종합적인 온라인 문서, 무료 샘플, 튜토리얼, 비디오 스트림, 계정 활성화, 계정 관리, 청구 및 서비스 상태와 같은 비기술적 문제에 대한 서포트는 무료이며 모든 플랜에 포함되어 있습니다. Gaming Circle 프리미엄 서포트 Gaming Circle은 프리미엄 개발 서포트 프로그램으로써 모든 Photon 제품에 대한 다이렉트 채팅 서포트, 전용 샘플, Circle Discord 프로 커뮤니티 접속 등을 포함합니다. 자세한 내용은 여기를 참조해 주세요. 자세한 사항은 확인해 주세요.. 지역 최적의 RTT(Round Trip Times)가 될수 있도록, 고객님의 어플리케이션으로 부터 가장 가까운 지역을 선택하실 수 있습니다. 전 세계의 여러 지역에서 이용이 가능합니다. 그외 궁금한 점은 없으신가요? 여기로 문의하십시오: [email protected]"
