title = "グローバル　クロスプラットフォーム　リアルタイムゲーム開発"
description = "同期ゲームとアプリケーション用のサービスとしてのグローバルクロスプラットフォームマルチプレイヤーゲームバックエンド(SaaS, Cloud)。android, iOS, .NET, Mac OS, Unity 3D, Windows, Flash, HTML5、その他のSDKを利用できます。"
full_description = "マルチプレイヤーゲームやアプリケーションのためのベースレイヤー インディーかプロのディベロッパーかを問わず、誰でもリアルタイムマルチプレイヤーゲームを開発してグローバルに配信可能です。同期・非同期ゲームプレイを作って、カスタムのWebhookをコーディングしよう。 無料 プランはこちら 機能 価格 Photon Realtime の特長 RealtimeCloud Photon Realtime を利用したゲームはグローバルに分散されたPhotonCloud内にホストされており、世界中のプレイヤーに対して低レイテンシー、短いRTTが保証されています。 MultiplayerConnect, Match and Play Photon Realtime’s core provides the rock-solid foundation for any type of room based multiplayer game. You concentrate on building a great title while we take care of game servers and hosting. MatchmakingAPI ランダム、または条件検索によってプレイヤーをマッチングできます。 あるいは、オープンルームの一覧を作成し、プレイヤーに選択させることも可能です。 モバイル、PC、コンソール、およびウェブ上で安定して稼動します。 Sync andAsync Games ターンベースゲームのモードを同期、非同期に自由にスイッチできます。 ルームはそのままで、プレイヤーは、コンティニューや、接続が切断された場合でも同じルームに再接続されます。 CloudSave ゲームステートをHTTPWebhook経由でクラウドやストレージに保持します。ステートには、以下のすべてのゲームデータが含まれます：プレイヤーデータ、ルームのデータ、プロパティ、イベントキャッシュ。 CrossPlatform あらゆるゲームプラットフォーム上で、お好きな開発エンジンやフレームワークを利用して、直接開発やビルドが出来ます。<br> Unityゲームでのシェアは世界No.1となっています。 HighestScalability Photon Realtimeを利用したゲームは、CCU数に応じて自動かつシームレスにスケールされます。 そして、公正で透明性の高い価格設定となっています。多くの方にご利用いただき、証明されています。 Customisation あなたは、どんなマルチプレイヤーゲームをビルドしたいですか？ FPS、アーケードシューター？RPG、RTS？ レースゲーム、スポーツ？MOBA、タワーディフェンスゲーム？ それともアクションゲームですか？ PUNは、あらゆるポピュラーなゲームプラットフォーム上の、全ての種類のルームベースゲームをサポートしています。 Clientto Server Photonを使用しているゲームは、Photon Cloud経由で毎時何億ものメッセージを送信します。 Photonの高速なクライアントサーバー間通信アーキテクチャは、RUDP、TCP、HTTP、WebSocketに対応しています。Photonは、あなたのゲームに対して、最も安定したリアルタイム通信環境を提供します。 UnmatchedFlexibility Photon is super flexible: you can match an iOS Game Center user with someone using Google Play Services, authenticate a user via Facebook or add a custom authentication, utilize a gaming service or hook in your own backend. Worry-FreePricing 単純明快です。100%CCU数に基づいた課金です。最初はフリープランで始めて、いつでもプランのアップ、ダウンができます。月額プランであれば、CCUが超過しても、すぐキャップはかかりません。 Start Creating. Try Realtime Now! BUILD FOR FREE Photon Cloudそのパワーの秘密 あなたが開発しているPhotonサービスを利用したアプリは、PhotonCloud内で稼動しています。ホスティング、システム運用、スケーリングは弊社が細心の注意を払って管理します。 あなたは、ゲームアプリ開発に専念してください！ Photon Enterprise Cloud – 専用サーバー & カスタムコードプラグイン 簡単に言えば、Photon Enterprise Cloudは、現在提供しているパブリッククラウドと同様ですが、以下の特徴が加わります。専用サーバーで稼動し、SLAと高いプライオリティーサポートを提供します。さらに大きな特徴としては、プラグイン経由であなたのサーバーロジックを動かすことができます。Photon Enterprise Cloudの典型的な利用シナリオとしては、5,000CCU以上のゲームアプリ、自社のサーバーロジックが必要な大規模ゲームプロジェクト、そして自社コンプライアンス上専用リソースでなければいけないプロジェクトです。 お問合せはこちら： [email protected]. スケーラブルで高い信頼性 すべてのPhotonサービスはクライアント - サーバーアーキテクチャに基づいており、マルチプレイヤーゲームにとって最も安定したソリューションです。ピアツーピアアーキテクチャの場合、クライアントはNATパンチスルー問題のためしばしば接続できないことがあります。モバイルネットワークでは、さらに接続状況が悪化します。しかし、Photonサービスを使えば、あなたのゲームは常に接続可能になります。我々のオペレーションチームは、常時サーバーをモニターし、負荷に応じていつでもスケールアップ作業を実施します。あなたのゲームが何百、何十万CCUとなったとしても、ご要望に応じてスケールアップします。 PHOTON CLOUD REGIONS プレイヤーのいる場所でホスティング リアルタイムマルチプレイヤーゲームでは、低レイテンシーが必須条件となります。このため、Photon Cloudは世界の主要なリージョンでホスティングされ、プレイヤーに最小のレイテンシーを提供します。FPSやRTSのように、低レイテンシーが不可欠なゲームでは、プレイヤーは最も近いリージョンに接続されます。ターンベースゲームなど、高レイテンシーに対応するゲームでは、すべてのプレーヤーを同じリージョンに接続することが可能です。 利用可能なリージョンと、セットアップ手順はこちらを参照してください。 無料 プランはこちら 仲間がたくさんいます。 Join 800,000 Developers and Studios. Photon Cloudにホスティングされている849,933件のアプリのうち、一部のタイトルを紹介します。 Ready to Build a New Realtime Experience? Connect, match users and play: Photon Realtime is the base foundation for multiplayer games for dozens of platforms. START FOR FREE"
