title = "超快的確定性網絡引擎"
description = "多人遊戲開發的革命！ 使用超快的確定性網絡引擎 QUANTUM 創建 MOBA、格鬥、RTS、格鬥和體育遊戲。"
full_description = "開創性的確定性多人遊戲引擎 Photon Quantum 是市場上唯一的 100% 確定性多人遊戲引擎。多人遊戲開發變得跟開發本地遊戲一樣簡單。沒有網絡代碼、默認聯網並100%完全同步。 START FREE 功能 價格 全球大熱門的特點的 預測/回滾功能 無需網絡代碼– 默認多人遊戲就緒 Quantum 允許您在不編寫網絡代碼的情況下創建多人遊戲。就像本地多人遊戲一樣，您只需要創建一個具有多個連接玩家的模擬就可以了。 僅輸入低帶寬 遊戲客戶端僅交換輸入，通過我們的 Photon Cloud 高頻分發給玩家。使用 webhooks 連接後端和插件以運行伺服器端自定義代碼。 針對終極性能進行了優化 Quantum 的 ECS 架構的每個組件都提供必要的性能，甚至可以在 PC、控制台、VR 和手機上運行物理密集型多人遊戲。 作弊保護設計 確定性遊戲本質上可以抵抗作弊。通過重播驗證或伺服器裁判模擬等最有效打擊作弊的方法來對抗作弊者。 跨平台決定論 用 Quantum 編碼的模擬對 Unity 沒有任何依賴性，可以在任何地方運行。 零延遲-電競級 所有本地操作都以零延遲執行，同時預測和回滾遠程輸入。 重播和觀戰 回放可以存儲在您的後端或在遊戲中使用(例如killcams)。從一開始就內置了觀戰者模式。 Bot SDKAdd-On 機器人的存在對多人遊戲產生了巨大影響，因為它們可以填充房間和替換離開的玩家。 Stumble Guys 在我們開始開發僅六週後就發佈了……32 名玩家在移動設備上擁有全面的物理和機器人！ 這是正確的答案！ Olli, Founder Kitka Games 32 players每場比賽的玩家 #1 在 50個國家 低端手機！ 25M 每日玩家 沒有網絡代碼的多人遊戲。 從現在開始。 下載 免費 Deterministic Multiplayer Engine Code in Quantum – Render, Model & Animatein Unity 視圖和模擬的清晰分離 超快速確定性子系統：物理/數學、尋路/轉向、ECS、工作系統…… 只有輸入很重要：開發者無需擔心網絡部分 Quantum Delivers Extreme Performance ECS 性能架構 帶有GC Free ECS（實體組件系統）的 Quantum 架構提供了跨平台所需的性能。 基於Tick-based模擬 可以調整模擬速度以找到遊戲玩法和所需性能之間的完美平衡。移動設備上的典型速度為 30Hz，PC/控制台上的典型速度為 60Hz 或更高。 預測、回滾和重新模擬 Quantum 客戶端預期其他客戶端的輸入並不斷回滾，重新模擬伺服器確認的輸入。 Unity僅負責畫面 Unity 用於關卡設計以及模型、動畫和 UI 的渲染層。模擬提供了最準確的數據，從而帶來零延遲的遊戲體驗。 開發者視角：在一次模擬中實現多人遊戲 沒有網路代碼 –多人遊戲作為默認功能 通過本地訪問每個玩家的輸入，您可以100%專注於開發模擬。將玩家添加到模擬中就像插入遊戲控制器一樣。多人遊戲就完成了。 所有遊戲模式的共享代碼庫 所有遊戲模式（單人遊戲、本地多人遊戲、在線多人遊戲）都使用相同的代碼庫，包括 AI 和機器人。 100% 完全同步 Quantum 的確定性子系統保證每個客戶端上的模擬始終同步且沒有延遲：物理、機器人、尋路、動畫。 功能豐富的遊戲引擎 內置 2D 和 3D 物理庫、Navmesh 或 Flowfield 尋路和避讓、帶有可視化編輯器的 Bot/AI SDK。這些都非常成熟，可以進行快速原型設計和生產準備。 網絡視圖​​：幕後交換的輸入 Photon Cloud 中的輸入和時間同步 玩家輸入通過在全球的Photon Cloud中運行的自定義邏輯發送和傳遞。我們的伺服器確保穩定的輸入流和時間同步。 Photon Realtime 是基礎 Photon Realtime 是所有 Photon 產品的基礎技術，支持快速協議、大廳、配對和超可擴展房間架構。 使用 Webhook 連接後端 Quantum 3 的新功能：Webhooks 支持房間控制、細粒度配置驗證和玩家數據輸入。全比賽重播還可以將統包發送到可配置的端點。 作弊保護設計 Quantum 的模擬是權威的，因為只交換輸入，防止玩家被其他玩家篡改。Quantum 3 使用 webhook 和伺服器提供的回放增強安全性。 同步和回滾概念已達到最高水平和極致性能。彷彿見證了“魔術” Paul Bettner, CEO (Age of Empires, Words with Friends, Wildcard Alliance) Join the Gaming Circle 透過我們的高級支援和範例 搶佔先機 雖然我們通過在線文檔免費提供您需要的一切，但 Gaming Circle 提供獨家資源來促進您的發展，為您的開發提供更多動力。 加入 Gaming Circle 並享受來自我們工程師的高級支援、僅限會員的範例、搶先體驗 alpha 和 beta 版本等等。 了解更多 加入我們 – 使用 Quantum 的代表客戶 準備好創造震撼世界的遊戲了嗎？ Quantum 正在徹底改變多人遊戲的開發方式。另外，開發是免費的。立即了解 Quantum。 START FOR FREE"
