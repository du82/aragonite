["https://www.photonengine.com/ko-kr/voice"]
title = "세계적인 크로스 플랫폼인 Voice Chat을 서비스화"
description = "Unity 대응의 인터네셔널 크로스 플랫폼 라이브 보이스 챗(Saas, Cloud)"
full_description = "Providing users with a high-quality voice chat that Simply Works. Crystal-Clear 3D Voice Chat for Unity Games, VR/AR/MR, no matter how big your community grows. FREE DOWNLOAD 특징 가격 의 특징 Games, VR & AR Photon Voice는 어떠한 어플리케이션에도 적용할 수 있습니다. 사용자간의 커뮤니케이션에 보이스 챗이 빠질 수 없는 VR이나 AR 어플리케이션에는 꼭 맞는 서비스입니다. Audio Quality Photon Voice는 Skype가 공동개발한 최첨단 오푸스 코텍을 이용하여, 최고의 레벨을 자랑하는 오디오 퀄리티를 제공합니다. 3D Audio Sources Photon Voice를 사용하면, Unity의 3D 오브젝트에 보이스 소스를 첨부할 수 있습니다. 가상 세계와 FPS 오디오 스트림을 설정할 수 있습니다. Easy Setup Adding Photon Voice to your app is a breeze. Use it in conjunction with any multiplayer engine and for any multiuser app where voice communication between the users is needed. Photon Cloud Hosted in our globally distributed Photon Cloud, Photon Voice guarantees low latency and shortest round-trip times for your players’ voice communication worldwide. Global Scalability Photon Vice apps scale seamlessly and automatically in the Photon Cloud: from just a few to tens of thousands of concurrent users. Fair and transparent pricing included. Start Creating. Try Voice Now! BUILD FOR FREE Photon Cloud - 숨겨진 파워의 비밀 Photon 서비스를 이용해 개발한 여러분의 어플리케이션은 Photon Cloud 내에서 가동됩니다. 저희는 호스팅, 시스템 운용, 스케일에 관해 세심한 주의를 기울여 관리합니다. 여러분은 게임 어플리케이션 개발에만 집중하실 수 있도록, 저희가 도와드리겠습니다! Photon Enterprise Cloud – 전용 서버 & 커스텀 코드 플러그인 한 마디로, Photon Enterprise Cloud는 Exit Games의 유명한 퍼블릭 클라우드인 Photon Cloud와 유사하며 다음과 같은 기능이 추가되어 있습니다: 전용 서버에서 실행되며, 보증된 서비스 레벨(SLA) 및 높은 우선순위의 지원을 제공합니다. 또 하나의 큰 장점은, 플러그인을 통해 자체 서버 로직을 움직일 수 있다는 점입니다. Photon Enterprise Cloud는 동시 접속자 수가 5,000명 이상인 앱, 자사의 서버 로직이 필요한 대규모 게임 프로젝트 또는 전용 리소스만을 사용해야 하는 규정이 있는기업 등에서 이용하는 경우가 많습니다. 문의처: [email protected]. 확장성과 신뢰성 & 언제 어디서나 접속 가능 모든 Photon Cloud 제품은 멀티플레이어 게임을 위한 가장 안정적인 솔루션인 클라이언트-서버 아키텍처를 기반으로 합니다! 피어 투 피어 아키텍처의 경우 클라이언트는 NAT 펀치스루 문제로 인해 연결할 수 없는 경우가 있습니다. 해당 문제는 모바일 네트워크에서 더욱 많이 발생하지만 Photon Cloud를 사용하면 여러분의 게임은 항상 안정적으로 접속이 가능합니다. 저희의 운영 팀은 24/7로 서버를 모니터링하고 언제든지 필요한 리소스를 확장해 드릴 수 있습니다. 게임에 수백 명 또는 수십만 명의 동시 사용자를 위한 용량이 필요하다면 언제든지 고객님의 요구에 맞게 확장해 드립니다. PHOTON CLOUD REGIONS 플레이어의 접속 지역과 호스팅 실시간 멀티플레이어 게임에서 응답 속도의 스피드는 필수 조건이죠.그래서 Photon Cloud는 응답 속도의 스피드를 위해 여러분의 플레이어가 있는 세계 각지에 호스팅되어 있습니다. FPS 나 RTS 등, 응답 속도의 스피드가 중요시되는 게임은 가장 가까운 지역의 이용자가 접속됩니다. 응답 속도가 덜 요구되는 턴 제도 게임 등은, 지역을 지정해서 접속이 가능합니다. 사용 가능한 지역 및 설정 지침은 여기를 참조하세요. 무료 플랜 시작하기 많은 동료들이 기다리고 있습니다. Join 800,000 Developers and Studios. 자 그럼, 849,933 의 Photon Cloud내에 설치된 어플리케이션의 일부를 소개합니다. Ready to Add 3D Voice Chat to Your Application? Photon Voice is fast to integrate and provides your Unity application with crystal-clear 3D audio chats on mobile, PC, consoles and XR. START FOR FREE"
