U auto-scaling CCU Burst for CCU > 50k 預設DDos防護 每追加 1 GB NT$2.38 Europe / Canada, East / RU / RUE / USA, East / USA, West NT$4.75 Asia / Australia / China / India / Japan / South Africa / South America / South Korea / Turkey / United Arab Emirates 登入 Premium Cloud 客戶可選擇具有保證響應時間的服務水平，溢價 我們的運營專家或我們的 24/7 NOC 團隊的支援。聯繫我們了解詳情。 聯繫我們了解詳情。 登入 Not Building a Game? Photon Industries Circle offers access to special hosting products, coding samples including priority support - required for business use cases like education, training, medical, simulation, collaboration, meeting, events, defense, sports, metaverse, social VR/XR, arcades and more. SEE CIRCLE Photon ENTERPRISE CLOUD Photon Enterprise Cloud 為您提供用於多個高 CCU 標題的專用雲環境。 有保證的服務水平和伺服器權威邏輯的插件使其成為世界頂級工作室值得信賴的選擇。 無限制title SLA（包括正常運行時間和響應時間） 優先運營支援和 專用伺服器 通過插件的服務器權威邏輯 高級管理者界面及計數器 多層 DDoS 保護 CONTACT US CCU 允許同時連線至您應用程式的使用者數量是由 CCU 計數定義。 方案及 CCU burst 皆由峰值 CCU 決定。 CCU Burst、超額部分 無需擔心您的使用者流失 - 我們允許您暫時超過您購買的 CCU 限制，並根據您的訂閱中費用超出的部分會在下個月的費用中追加收取。 在您第一次超過後，您有 48 小時的時間升級您的訂閱方案。在此之前，我們可以自行決定將 CCU 的數量限制為您訂閱的數量。 對於 CCU Burst，CCU 的數量定義為所有連接區域的 CCU 峰值的總和。 流量計算 每月總流量是依購買的 CCU 數量與每個 CCU 的額定頻寛合併計算， 超量的部份會另外計費。 (流進或自 Photon Cloud 流出的資料流量均會算為使用的流量) 例如：購買 100 個 CCU，每個 CCU 的額定頻寛為 3 GB。每月總流量就是 100 CCU x 3 GB/CCU = 300 GB。 一次性方案(12個月) 一次性方案適用於單一應用程式並可持續使用12個月，無需持續繳納月費。 一次性 CCU 可新增至任何月方案列如 100 + 500 = 總共 600 CCU。 每月活躍用戶 每 1 CCU 約等於 20 個每日活躍用戶 (DAU)， 每 1 DAU 約等於 20 個每月活躍用戶 (MAU)。 ＊此處所示數字乃依照過往經驗概算，實際情況會因為遊戲與程式的設計方式而有所不同。 隨時可以調低或者調高方案 隨時可以調低或者調高方案。新方案將會被即時生效。新方案的收費將按照日數比例計算。如果是解約，該合約效期與收費仍將維持至當月的最後一天。 免費服務 全面的在線文檔、免費範例、教程、視頻教程、帳號激活、帳號管理、計費和服務狀態等非技術問題的幫助都是免費的，並且包含在我們的所有方案中。 Gaming Circle 高級服務 Gaming Circle 是我們的高級開發支持方案，包括對所有 Photon 產品的直接聊天支援、獨家範例、訪問我們的 Circle Discord 專業社群等等。在這裡閱讀更多。 了解更多 here. 區域 為獲得最佳往返時間，您的應用程式可連接離我們託管主機最近的區域。 選擇全球多個區域。 還有問題嗎？ 別客氣，發個信來問我們 :) [email protected]"
