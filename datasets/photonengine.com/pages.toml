title = "신속한 예측 네트워크 엔진"
description = '멀티플레이 게임 개발에 혁신을! MOBA, 브라울러, RTS, 격투, 스포츠 게임을 신속한 예측 네트워크 엔진 "QUANTUM" 으로 개발해 보세요.'
full_description = '획기적인 디터미니스틱멀티 플레이어 엔진 Photon Quantum은 시장에서 유일한 100% 디터미니스틱(결정론적) 멀티플레이어 게임 엔진입니다. 멀티플레이어 게임을 만드는 것은 로컬 멀티플레이어 타이틀을 개발하는 것만큼 간단합니다. 넷 코드는 필요하지 않으며 모든 것이 기본적으로 네트워크에 연결되어 100% 동기화됩니다. 무료로 시작하기 특징 가격 성공적인 글로벌 전개를 위한 예측/롤백 기능 No Netcode – Multiplayer By Default Quantum을 사용하면 넷코드를 작성하지 않아도 멀티플레이어 게임을 만들 수 있습니다. 로컬 멀티플레이어 경험을 개발하는 것 처럼, 여러 플레이어가 연결된 싱글 시뮬레이션을 생성하세요. Low Bandwidth With Input Only 게임 클라이언트는 Photon Cloud를 통해 높은 빈도로 플레이어에게 분배되며 입력만 교환합니다. 웹후크를 사용하여 백엔드 또는 플러그인을 연결, 서버 측 커스텀 코드를 실행하세요. Delivers Extreme Performance Quantum ECS 아키텍처의 각 구성 요소는 PC, 콘솔, VR 및 휴대폰에서 물리적으로 집중되는 멀티플레이어 게임을 실행하는 데 필요한 성능을 제공합니다. Cheat Protection by Design 디터미니스틱 (결정론적) 게임은 본질적으로 부정행위에 저항합니다. 가장 효과적인 치트 방지 수단인 리플레이 검증 또는 서버 심판 시뮬레이션과 같은 방법을 통해 치팅에 대한 대책을 세우세요. Cross Platform Determinism Quantum에 코딩된 시뮬레이션은 Unity에 종속되지 않으며 어디서나 실행할 수 있습니다. Zero Lag E-Sport Grade 원격 입력이 예측되고 롤백되는 동안 모든 로컬 작업은 제로 랙으로 실행됩니다. Replays & Spectating 리플레이는 백엔드에 저장하거나 킬 캠(kill cams)과 같이 게임 내에서 사용할 수 있습니다. 관전 기능은 내장되어 있습니다. Bot SDKAdd-On 봇은 방에 들어오거나 나가는 플레이어를 대체하는 등, 멀티 플레이어 게임에 상당한 중요한 역할을 합니다. Stumble Guys는 우리가 개발을 시작한 지 불과 6주 만에 출시되었습니다. 모바일에서 본격적인 물리와 봇을 사용하여 32명의 플레이어를 구현했고, 이는 금새 문제없이 움직였습니다! Olli, Founder Kitka Games 32 playersper race #1 in 50countries low-endphones! 25M dailyplayers 넷코드가 필요없는 멀티플레이어. 지금 바로 시작하세요! 다운로드 무료 디터미니스틱 멀티플레이어 엔진 Quantum으로 코딩 – Unity에서 렌더링, 모델링, 애니메이션 뷰(View)와 시뮬레이션의 명확한 분리 초고속 결정론적 서브 시스템: 물리/수학, 경로 찾기/스티어링, ECS, 잡 시스템 … 오직 입력(Input)만이 중요:네트워크는 개발자에게 숨겨져 있습니다. Quantum Delivers Extreme Performance ECS 성능 아키텍처 가비지 컬렉션(garbage collection)이 없는 ECS(entitiy component system)로 구성된 Quantum의 아키텍처는 플랫폼 전체에 필요한 성능을 제공합니다. 틱(Tick) 기반 시뮬레이션 시뮬레이션 속도는 게임 플레이와 필요한 성능 간의 완벽한 균형을 위해 조정할 수 있습니다. 일반적인 속도는 모바일의 경우 30Hz, PC/콘솔의 경우는 60Hz 이상입니다. 예측, 롤백 및 재시뮬레이션 Quantum 클라이언트는 다른 클라이언트의 입력을 예측하고 서버에서 확인된 입력으로 지속적으로 롤백 및 재시뮬레이션을 합니다. 뷰(View) 전용 Unity Unity는 레벨 디자인과 모델, 애니메이션 및 UI의 렌더링 레이어로 사용됩니다. 시뮬레이션은 가장 정확한 데이터를 제공하여 제로 랙 게임 플레이 경험을 제공합니다. 개발자 뷰:여러 플레이어의 하나의 시뮬레이션 넷코드 없음 –디폴트 멀티플레이어 각 플레이어의 입력에 대한 로컬 액세스 권한이 있어, 시뮬레이션 개발에 100% 집중할 수 있습니다. 시뮬레이션에 플레이어를 추가하는 것은 게임 컨트롤러를 연결하는 것과 같습니다. 손쉽게 멀티플레이어가 작동합니다. 모든 게임 모드에 대한 원 코드 베이스 싱글 플레이어, 로컬 멀티플레이어, 온라인 멀티플레이어 등 모든 게임 모드에 대해 AI/봇을 포함한 동일한 코드 기반을 활용할 수 있습니다. 100% 동기화 Quantum의 결정론적 서브 시스템은 물리, 봇, 경로 찾기, 애니메이션 등 각 클라이언트의 시뮬레이션이 랙 없이 항상 동기화되도록 보장합니다. 풍부한 기능의 게임 플레이 엔진 2D 및 3D 물리, Navmesh 또는 Flowfield 경로 찾기 및 회피를 위한 내장 라이브러리, 비쥬얼 에디터가 있는 Bot/AI SDK. 프로토타이핑을 위한 빠른 속도와 프로덕션을 위한 충분한 발달이 여기에 있습니다. 네트워크 뷰:입력은 내부적으로 교환됩니다. Photon Cloud의 입력 & 시간 동기화 플레이어의 입력은 글로벌 Photon Cloud에서 실행되는 커스텀 로직을 통해 전송된 후 배포됩니다. 우리 서버는 안정적인 입력 스트림과 동기화된 시계를 보장합니다. Photon Realtime 기반 Photon Realtime은 고속 프로토콜, 로비, 매치메이킹 및 확장성이 뛰어난 룸 아키텍처를 제공하는 모든 Photon 제품의 기본이 되는 기술입니다. Webhook에 의한 백엔드 연결 Quantum 3의 새로운 기능: 룸 컨트롤, 설정 및 플레이어 데이터 항목에 대한 세분화된 확인을 위한 웹훅. 풀 매치 리플레이도 턴키 방식으로 설정 가능한 엔드포인트로 전송할 수 있습니다. 치트를 방지하는 디자인 입력만 교환되어 양자의 시뮬레이션을 신뢰할 수 있게 만들고 플레이어가 다른 사람의 경험을 조작하는 것을 방지합니다. Quantum 3의 새로운 기능: 웹훅 및 서버 제공 리플레이로 보안을 강화합니다. 가장 진보되고 뛰어난 동기화/롤백의 개념입니다. 내가 본 가장 "마법"에 가까운 기술입니다 . Paul Bettner, CEO (Age of Empires, Words with Friends, Wildcard Alliance) Gaming Circle에 참가하기 프리미엄 서포트 및 샘플로 한발 먼저 나아가세요 온라인 문서에서 무료로 시작하는 데 필요한 모든 것을 제공하는 반면, Gaming Circle에서는 개발을 더욱 촉진시키는 독점 리소스를 제공합니다. Gaming Circle에 가입하면 엔지니어의 프리미엄 서포트, 독점 샘플 및 알파, 베타 등에 대한 조기 액세스가 가능합니다. Learn more Join the Club – Quantum 고객 셀렉션 획기적인 게임을 만들 준비가 되셨나요? Quantum은 멀티플레이어 게임 개발의 혁신적인 방법이며, 개발 기간은 무료로 사용이 가능합니다. 지금 바로 Quantum 학습을 시작해 보세요. START FOR FREE'
