ssages Video Video Broadcast and Screen-share Photon simplifies the development of secure, scalable applications. Choose hosting on Photon Cloud or on-premise based on your business requirements. Hyper Fast Technology Photon SDKs and services are meticulously designed for optimal performance, scalability and security. Right from the foundation. Across All Engines Photon SDKs are compatible with the most popular grafic/game engines: Unity, Unreal Engine or Native C/C++. Across All Devices Photon SDKs support all major devices and platforms, ensuring cross-platform functionality. PhotonCloud Our global spanning Photon Cloud allows secure, scalable and low latency connections globally. Private and Enterprise setups available on demand. Need to Host Your Own Photon Server? Secure. Private. Reliable. Proven by Enterprise Customers and our own Photon Cloud. Online and Offline versions available for Fusion, Voice, Video, Realtime and PUN SDK. HOSTING OPTIONS BEST PRACTICE CODE AND PATTERNS Conference & Event Samples Photon’s Conference and Event Samples are ideal for crafting your personalized virtual experiences. They integrate various aspects of virtual events, simulating a common conference or event scenarios that an accommodate anywhere from a handful to thousands of participants. Built with Fusion, Voice, Video in Unity, the template includes features such as hand-controlled avatars, spatial voice, and more, giving your projects a significant head start. Only for Circle Members Expo can handle approximately 300 simultaneous visitors, providing features such as booths and private chat bubbles. To expand this capacity, consider utilizing the Areas feature. Host live events, such as speaker sessions or panels, for up to 1,000 visitors. Maintain control over microphone usage and screen-sharing during these events. Avatar Integration The provided Avatar selection is just for demo. You can use any Avatar system you prefer. We also support Meta Avatars and Ready Player Me. Areas You can expand the capacity of the expo by utilizing multiple floors. For instance, 10 floors could accommodate as many as 3,000 visitors. Conversation Bubbles Engage in private conversations with up to 8 participants, enjoying voice communication and complete hand/head movements. Best Practice Code / Patterns Leverage the best-practice coding patterns and examples provided in this sample to customize them to your specific needs and circumstances. Our senior engineers have curated these exclusive best practice examples for you, designed to help you develop events and conferences for platforms like web, mobile, PC, and VR, capable of accommodating thousands of participants. Jumpstart your Metaverse project with our sample. It encompasses a hub, several rooms, an art exhibition, a casual game, and a DJ scenario. PHOTON INDUSTRIES ADD-ONS Improve Your Development with Our Add-Ons We provide our Circle members with a constantly growing list of reusable AddOns to speed up their 3D/XR application prototyping. Check Out the Most Popular Ones: Trusted by leading corporations, agencies & platforms Join theIndustries Circle! Photon is for anyone interested in rapidly creating secure and scalable networked experiences. Are you one of them? JOIN NOW"
