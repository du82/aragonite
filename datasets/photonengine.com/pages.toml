full_description = "Providing users with a high-quality voice chat that Simply Works. Crystal-Clear 3D Voice Chat for Unity Games, VR/AR/MR, no matter how big your community grows. FREE DOWNLOAD 機能 価格 の特長 Games, VR & AR Photon Voiceはあらゆるアプリケーションに最適なアドオンです。ユーザー間のコミュニケーションにボイスチャットが必須であるVRまたはARアプリケーションに最適です。 Audio Quality Photon Voiceは、Skypeによって共同開発された最先端のOpusコーデックを利用し、最高レベルのオーディオクオリティを提供します。 3D Audio Sources Photon Voiceを使用すれば、Unityの3Dオブジェクトにボイスソースを添付できます。仮想世界やFPSにオーディオストリームを設定可能です。 Easy Setup Adding Photon Voice to your app is a breeze. Use it in conjunction with any multiplayer engine and for any multiuser app where voice communication between the users is needed. Photon Cloud Hosted in our globally distributed Photon Cloud, Photon Voice guarantees low latency and shortest round-trip times for your players’ voice communication worldwide. Global Scalability Photon Vice apps scale seamlessly and automatically in the Photon Cloud: from just a few to tens of thousands of concurrent users. Fair and transparent pricing included. Start Creating. Try Voice Now! BUILD FOR FREE Photon Cloudそのパワーの秘密 あなたが開発しているPhotonサービスを利用したアプリは、PhotonCloud内で稼動しています。ホスティング、システム運用、スケーリングは弊社が細心の注意を払って管理します。 あなたは、ゲームアプリ開発に専念してください！ Photon Enterprise Cloud – 専用サーバー & カスタムコードプラグイン 簡単に言えば、Photon Enterprise Cloudは、現在提供しているパブリッククラウドと同様ですが、以下の特徴が加わります。専用サーバーで稼動し、SLAと高いプライオリティーサポートを提供します。さらに大きな特徴としては、プラグイン経由であなたのサーバーロジックを動かすことができます。Photon Enterprise Cloudの典型的な利用シナリオとしては、5,000CCU以上のゲームアプリ、自社のサーバーロジックが必要な大規模ゲームプロジェクト、そして自社コンプライアンス上専用リソースでなければいけないプロジェクトです。 お問合せはこちら： [email protected]. スケーラブルで高い信頼性 すべてのPhotonサービスはクライアント - サーバーアーキテクチャに基づいており、マルチプレイヤーゲームにとって最も安定したソリューションです。ピアツーピアアーキテクチャの場合、クライアントはNATパンチスルー問題のためしばしば接続できないことがあります。モバイルネットワークでは、さらに接続状況が悪化します。しかし、Photonサービスを使えば、あなたのゲームは常に接続可能になります。我々のオペレーションチームは、常時サーバーをモニターし、負荷に応じていつでもスケールアップ作業を実施します。あなたのゲームが何百、何十万CCUとなったとしても、ご要望に応じてスケールアップします。 PHOTON CLOUD REGIONS プレイヤーのいる場所でホスティング リアルタイムマルチプレイヤーゲームでは、低レイテンシーが必須条件となります。このため、Photon Cloudは世界の主要なリージョンでホスティングされ、プレイヤーに最小のレイテンシーを提供します。FPSやRTSのように、低レイテンシーが不可欠なゲームでは、プレイヤーは最も近いリージョンに接続されます。ターンベースゲームなど、高レイテンシーに対応するゲームでは、すべてのプレーヤーを同じリージョンに接続することが可能です。 利用可能なリージョンと、セットアップ手順はこちらを参照してください。 無料 プランはこちら 仲間がたくさんいます。 Join 800,000 Developers and Studios. Photon Cloudにホスティングされている849,933件のアプリのうち、一部のタイトルを紹介します。 Ready to Add 3D Voice Chat to Your Application? Photon Voice is fast to integrate and provides your Unity application with crystal-clear 3D audio chats on mobile, PC, consoles and XR. START FOR FREE"
