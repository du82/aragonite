his sample showcases a simple Metaverse, featuring interactive scenes accessed from the central hub. Explore with your friends! Move through portals to different spaces with all players or just your friends. Central hub and avatar selection Find the hidden animals in the zoo area Music DJ and Dynamic Art Gallery zones Fusion SHARED AUTHORITY TRY NOW Fusion Multi Climb Tutorial Free Sample Fusion Multi Climb Tutorial FUSION Fusion Multi Climb Tutorial The Multi Climb sample is a first-person parkour racing game which demonstrates how to make use of client prediction, lag compensation, the Simple & Advanced KCCs and more in a server authoritative context. Physics-like movement/abilities via KCC PvP combat abilities Accompanying video tutorial series Fusion DEDICATED SERVER, Fusion CLIENT HOST TRY NOW Fusion Physics AddOn Free Sample Fusion Physics AddOn FUSION Fusion Physics AddOn The Physics addon offers essential components for synchronizing Rigidbody and Rigidbody2D states in Photon Fusion. It includes NetworkRigidbody3D and NetworkRigidbody2D for effective rigid body state management, along with optional RunnerPhysicsSimulate3D and 2D to handle physics simulations. Multiple approaches for prediction Components to synchronize rigid bodies Alternate options to tune performance Fusion SHARED AUTHORITY, Fusion DEDICATED SERVER, Fusion CLIENT HOST TRY NOW Fusion Pirate Adventure Free Sample Fusion Pirate Adventure FUSION Fusion Pirate Adventure The Pirate Adventure sample, complete with full source code, demonstrates how to use Fusion to create a multiplayer adventure game for up to 8 players. It supports multiple platforms, including PC (Windows/Mac), WebGL, and Mobile (Android/iOS). Responsive shared authority guidelines Desktop, mobile and web platforms Using Fusion's KCC and FSM add-ons Fusion SHARED AUTHORITY TRY NOW Fusion Projectiles Advanced Free Sample Fusion Projectiles Advanced FUSION Fusion Projectiles Advanced Projectiles Advanced demonstrates how to implement networking for various projectile types in shooter games, focusing on performance, precision, and smooth rendering. This sample balances bandwidth and accuracy, ensuring seamless rendering between simulated and visual projectile paths in multiplayer settings. Numerous projectile types 8 different weapons Simple FPS game, great to build on Fusion CLIENT HOST, Fusion DEDICATED SERVER TRY NOW Fusion Projectiles Essentials Free Sample Fusion Projectiles Essentials FUSION Fusion Projectiles Essentials Projectiles Essentials demonstrates 5 different approaches to networked projectile implementation. This covers common approaches with simple examples, with detailed description and comments. There is also a companion Projectiles Advanced project. Hitscan and Kinematic Examples 5 Projectile Types Extensive description and comments Fusion CLIENT HOST, Fusion DEDICATED SERVER TRY NOW Fusion Quiz Network Free Sample Fusion Quiz Network FUSION Fusion Quiz Network The Fusion Quiz Network sample is a shared mode triv'''
