. /demo_memory: This demo displays Photon's asynchronous turnbased features in a game of Memory. This uses the Cocos2D-x graphics engine. /demo_particle: The demo client connects to a master server and shows the random matchmaking mechanism, how to create a room and how to send and receive events within a running game. Players move 'their' blocks around and the positions are updated in realtime between clients. The UI shows areas of interest when activated. This uses the Cocos2D-x graphics engine. /demo_typeSupport: This demo displays the proper use of Photon's serializable data types. Contact ------------------------------------------ To get in touch with other Photon developers and our engineers, visit our Developer Forum: https://forum.photonengine.com Keep yourself up to date following Exit Games on Twitter http://twitter.com/exitgames and our blog at http://blog.photonengine.com/. Expand Collapse Download SDK v5.0.12 ( older versions … ) ( older versions: Photon-AndroidNDK-Sdk_v5-0-11-0.7z ) Doc Chat Documentation API Doc C++ API MORE … Chat Unity Asset Photon Chat Unity Assets Photon Chat FREE package is the easiest way to add a chat to your game in Unity within minutes. Its flexible channel system allows to integrate any number of chat channels to your game e.g. a global chat, multiple regional chats and a clan-based chat in parallel. Alternatively, use the Photon Chat .NET SDK. The client SDK offers programmers detailed control. Get the Photon Chat .NET SDK from here. Get CHAT FREE You do not need multiplayer, but a chat? Add it easily with Photon Chat Free. This asset is included in PUN Free and PUN Plus, please do not use with either. Doc Chat Documentation MORE … Chat Cocos2d-x Cocos2d-x Read Me All C++ based Photon SDKs are compatible with Cocos2d-x off the shelf! Find the SDKs you can gear it up with linked to below. Expand Collapse Supported SDKs Android , iOS , Windows Doc Chat Documentation API Doc C++ API MORE … Chat Construct 2 Construct 2 Read Me Photon SDK for Scirra Construct 2 readme. (C) Exit Games GmbH 2016 Overview ---------------------------------------------------------------------------------------------------- Photon SDK contains Scirra Construct 2 plugins exposing underlying Photon Javascript library functionality: - Photon Realtime Plugin allows to develop multiplayer games with clients communicating through Photon Cloud or self-hosted Photon Server. Follow https://www.photonengine.com/en/Realtime for info on Photon Realtime. - Photon Chat Plugin adds chat functionality to your game. Follow https://www.photonengine.com/en/Chat for info on Photon Chat. Installation ---------------------------------------------------------------------------------------------------- - Drag and drop photon.c2addon and photon-chat.c2addon files into the Construct 2 window. See Construct 2 documentation on plugins installation details. - Register a new realtime app at https://www.photonengine.com/en/Dashboard/Realtime - Register a new chat app at https://www.photonengine.com/en/Dashboard/Chat Running demos ---------------------------------------------------------------------------------------------------- - Find Photon object in project tree and set its AppId property to application id value from dashboard. - Select Main layout. - Run the application. Editor will open browser page. Copy url and open it in new browser pages. - Check browser console for helpful info. - Pool demo: all clients automatically join single room, each spawns the fish and notifies others with fish positions. Click on the pool makes owned fish move to the click location. - Test demo: automatically joins or creates new room. Pressing Leave will bring the client to the lobby where client can create new room or join existing from list. Also, test event firing is available inside the room (check other clients log for events receive report). - Chat demo: start 2 or more clients. For every client, choose user id and press Connect. When client is connected to front end, enter channel names separated by comma and press Subscribe. Select channel in list, enter message and press Publish. Or specify destination user id and send private message by pressing Send. Package Contents ---------------------------------------------------------------------------------------------------- - license.txt - the license terms - readme.txt - this readme text - release_history.txt - changelog - photon.c2addon - Photon Realtime Plugin - photon-chat.c2addon - Photon Chat Plugin - demo-test.capx - application for testing Photon Realtime features - demo-pool.capx - Realtime demo application - demo-chat.capx - Chat demo application Documentation ---------------------------------------------------------------------------------------------------- There is no Photon Construct 2 Plugin specific documentation or tutorials available currently. General documentation on Photon Realtime: http://doc.photonengine.com/en-us/realtime/current/getting-started/realtime-intro Photon Chat documentat'''
