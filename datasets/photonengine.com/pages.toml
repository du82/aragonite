description = "チャンネル、テキストとバイナリメッセージ、履歴、その他でパブリッシュするためのチャンネルサブスクリプションを含む、サービスとしてのグローバルクロスプラットフォームチャット(SaaS, Cloud) 。SDKはandroid, iOS, .NET, Mac OS, Unity 3D, Windows, HTML5とその他で利用可能です。"
full_description = "素早く簡単に機能追加できるクロスプラットホームチャットサービス 同時接続数をスケールできるクロスプラットフォームのチャットシステムを、あなたのアプリに簡単に統合できます。 無料プランはこちら 機能 価格 特徴 プラグアンドプレイ Photon Chat は、あなたのアプリやゲームへ簡単に素早くチャット機能を追加することができます。数分で接続できます。ユーザーの利用状況に沿ってシームレスにスケールしていくので、気にせず利用できます。 安全なチャネル グローバルなチャット、多数のリージョンおよびクランベースのチャット、それにプライベートチャネルがあったらいいなとお考えですか？お任せください。Photon Chatは、ユーザーがいくつでもちゃんとチャネルを作成したり購読したりできます。 メッセージバッファー Photon Chatはチャットチャンネルごとにメッセージバッファーを提供しているので、以前のメッセージをリプレイするときに便利です（例：新しくチャットユーザーが加わった時など）。 スマートメッセージ Photon Chatはそれぞれのチャンネル経由でテキストメッセージを送れるだけでなく、スマートメッセージも送れます。例えばハッシュテーブル、ディクショナリ、配列などです。 Standalone または Mashup Photon Chatはスケーラブルなチャットシステムの構築に、すぐ役立つソリューションです。Photon Chat単体でも利用できますし、他のPhotonサービスと一緒に利用もできます。使い方は、あなた次第です。 シンプルな価格 単純明快です。100%CCU数に基づいた課金です。最初はフリープランで始めて、いつでもプランのアップ、ダウンができます。月額プランであれば、CCUが超過しても、すぐキャップはかかりません。 無料で試す 複数のクロスプラットフォームをもサポート。 数多くのゲームで実証済み。 Chatから不適切な語句をフィルタリング リアルタイムのﾁｬｯﾄﾌｨﾙﾀﾘﾝｸﾞ 弊社パートナーのCommunity Siftが提供する世界トップレベルのチャットフィルターで、ゲームのチャットを安全に保ちましょう。有害な語句をチャットから排除します。 1分で設定完了 優れたチャットフィルターを、簡単に追加できます。Photon Chatダッシュボードで、チェックボックスをチェックし、ポリシーを選択後に設定を保存してください。すぐに完了します！ コンテキストベースのサポート Photon Chatのフィルタリング機能は、複数の言語で100万以上の署名を使用しています。数十億のメッセージが日々フィルタリングされ、またチャットユーザーからの評価とコンテキストがリスク分析に追加されて、性能が絶えず向上しています。 他に類をみない機能とお手頃な価格 オプションのChat Filterを併用すれば、Photon Chatは完全にユニークなソリューションとなります。豊富な機能をお値打ち価格でご提供しています。 Photon Cloudそのパワーの秘密 あなたが開発しているPhotonサービスを利用したアプリは、PhotonCloud内で稼動しています。ホスティング、システム運用、スケーリングは弊社が細心の注意を払って管理します。 あなたは、ゲームアプリ開発に専念してください！ Photon Enterprise Cloud – 専用サーバー & カスタムコードプラグイン 簡単に言えば、Photon Enterprise Cloudは、現在提供しているパブリッククラウドと同様ですが、以下の特徴が加わります。専用サーバーで稼動し、SLAと高いプライオリティーサポートを提供します。さらに大きな特徴としては、プラグイン経由であなたのサーバーロジックを動かすことができます。Photon Enterprise Cloudの典型的な利用シナリオとしては、5,000CCU以上のゲームアプリ、自社のサーバーロジックが必要な大規模ゲームプロジェクト、そして自社コンプライアンス上専用リソースでなければいけないプロジェクトです。 お問合せはこちら： [email protected]. スケーラブルで高い信頼性 すべてのPhotonサービスはクライアント - サーバーアーキテクチャに基づいており、マルチプレイヤーゲームにとって最も安定したソリューションです。ピアツーピアアーキテクチャの場合、クライアントはNATパンチスルー問題のためしばしば接続できないことがあります。モバイルネットワークでは、さらに接続状況が悪化します。しかし、Photonサービスを使えば、あなたのゲームは常に接続可能になります。我々のオペレーションチームは、常時サーバーをモニターし、負荷に応じていつでもスケールアップ作業を実施します。あなたのゲームが何百、何十万CCUとなったとしても、ご要望に応じてスケールアップします。 仲間がたくさんいます。 Join 800,000 Developers and Studios. PHOTON CLOUD REGIONS プレイヤーのいる場所でホスティング リアルタイムマルチプレイヤーゲームでは、低レイテンシーが必須条件となります。このため、Photon Cloudは世界の主要なリージョンでホスティングされ、プレイヤーに最小のレイテンシーを提供します。FPSやRTSのように、低レイテンシーが不可欠なゲームでは、プレイヤーは最も近いリージョンに接続されます。ターンベースゲームなど、高レイテンシーに対応するゲームでは、すべてのプレーヤーを同じリージョンに接続することが可能です。 利用可能なリージョンと、セットアップ手順はこちらを参照してください。 無料 プランはこちら Photon Cloudにホスティングされている849,933件のアプリのうち、一部のタイトルを紹介します。"
