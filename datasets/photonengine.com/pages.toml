description = "グローバルでクロスプラットフォーム型のマルチプレイヤーゲームBaaS（サービスとしてのバックエンド）です。同期型ゲームおよび非同期型のゲームとアプリケーションに対応したPhoton Fusionです。無料でお試しください。"
full_description = "マルチプレイヤーゲームのベンチマークに Photon Fusionは、Unityプロフェッショナル向けに開発されたハイエンドの状態転送ネットコードSDKです。複数のネットワークトポロジーを選択することで、どのようなゲームプレイでもプレイヤーに最高の体験を提供します。 BUILD FREE 機能 価格 最高のマルチプレイヤーゲームを構築するための強力な機能： Tick-BasedSimulation 安定した正確なネットワークのコア機能。 クライアント側の予測とスナップショット補間の基盤。 Client-SidePrediction 高遅延やネットワークロスが発生しても、サーバーの権限を放棄することなくプレイヤーが自分の入力に即座に応答できるようにします。 HighPerformance Handle thousands of networked object over hundreds of client connections, including complex interest management. SnapshotInterpolation 自動補間やカスタム補間を使用することで、インターネット環境が悪い場合でもスムーズなビジュアルレンダリングが可能になります。 LagCompensation Esportグレードのゲームメカニクス向けの使いやすいAPIを備えた組み込みのラグ補償ヒットボックス。 ReplicationSystems デルタスナップショットと結果整合性のためのレプリケーションアルゴリズムのクラス実装。 Unity Verified Solution The Unity Verified Solutions program, including Photon Fusion, denotes top-quality, compatible solutions rigorously reviewed for seamless Unity integration, highlighting a key achievement for developers. MINIMIZED BANDWIDTH Extreme Optimization:Replication Algorithms Fusion implements two replication algorithms that can be switched between: FullConsistency(Default) Uses additional bandwidth per object to ensure each object is internally consistent, meaning that all state you see on an object is from the same tick. EventualConsistency(Advanced) Uses less bandwidth per object, allowing more objects to be packed into each update, but the state seen on each object might be from two different ticks. Number ofPlayers Bandwidth FULL CONSISTENCY EVENTUAL CONSISTENCY MAXIMIZED PERFORMANCE An Evolutionary Leap in Multiplayer Engineering Fusion is an evolution in multiplayer engineering by handling many more players and objects than ever before. Fusion’s bandwidth usage is 6x smaller than MLAPI or Mirror; it is optimized to consume less CPU on the server, allowing more flexibility for gameplay elements or lower server specs and deployment costs. バンド幅の使用状況 フレームあたりの割り当て数 サーバーのCPU使用率 0 123 20Hz packet rate, from server to each client, lower is better Lower is better Lower is better Fusion MLAPI Mirror SIMPLIFYING GAME DEVELOPMENT Flexible Network Topologies Fusion supports different network topologies and replication algorithms while exposing a single consistent API. This allows developers to focus on what really matters most: writing their own game. DEDICATED SERVER パブリックIP付き専用サーバー（ヘッドレスUnityインスタンス） A 権限 ++ サーバーが完全な権限を持サーバーが完全な権限を持 S 状態 ++ サーバーの移行が可能 L 遅延 ++ 低レイテンシー：クライアントからサーバーに直接接続 % QoS ++ ゲームエンジンの安定性 $ コスト -- 専用サーバーのオーケストレーション CLIENT ホスト 一人のプレーヤーが「ホスト」となります。他のすべてのプレーヤーはそのホストに接続します。 A 権限 -- ホストが完全な権限を持つハッキング/不正行為が可能 S 状態 ++ ターンキーホストの移行 L 遅延 / レイテンシーが良い（パンチ）または比較的悪い（リレー） % QoS - プレイヤー/ホストによって異なる $ コスト ++ プレイヤー+ Photon Cloudがホスト 共有 AUTHORITY ルームに状態権限とオプションのプラグイン（カスタムコード）があります。 A 権限 / ルームは状態の権限を持っているが、クライアントが自分に割り当てられたオブジェクトの状態を制御する S 状態 ++ ルームがゲーム全体の状態を保持している L 遅延 ++ リージョン内のルームに直接接続 % QoS + 高い安定性とアップタイム $ コスト ++ コスト効率が良い 決定論的 Quantum: 各クライアントは、決定論的なシミュレーションを実行します。 A 権限 ++ サーバーは入力権限を持ち、SIMを参照することができる S 状態 ++ ルームがゲーム全体の状態を保持している L 遅延 ++ リージョン内のルームに直接接続 % QoS + 高い安定性とアップタイム $ コスト ++ コスト効率が良い Snapshot of Fusion Capabilities Discover the essential details of the top-tier state-sync netcode SDK designed for Unity professionals. HAVE A LOOK サーバー Photon Cloud – 世界の低遅延インフラストラクチャ DDoS保護された状態で、15カ所の戦略的拠点に設置されたPhoton Cloudの高性能サーバーで、世界中のより多くのゲーマーにリーチできます。ゲームデータを可能な限り高速に配信します。 Photon Fusion features saved us time and effort and met our product goals for a large player capacity. Partnering with Photon has been a pleasure. Russell BallVice President of Engineering Schell Games (Among Us VR) We’ve used all of Photon’s services internally and for our external clients, so don't expect us to choose another multiplayer engine soon! BitCake Studio (Atomic Picnic) Trusted by Leading Corporations, Agencies & Platforms Ready to Build a New Benchmark Experience? Fusion’s top-tier state-sync netcode SDK provides all essential features to create extraordinary multiplayer experiences. BUILD FOR FREE"
