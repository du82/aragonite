されたサンプルとなっています。Circleメンバーになるとこのサンプルをプロジェクトの土台としてご使用いただけます。 Circleサポート Gaming Circleはマルチプレイヤーゲームの開発と上手なリリースのために不可欠なリソースとサポートをお届けします。本番稼働しているゲームのオペレーションサポートは、Circle対象外です。 キャンセル 初回期間満了後、月単位でGaming Circleメンバーシップを解約できます。解約後は、Circleメンバー限定のSDKやサンプルはご利用いただけませんのでご了承ください。"
