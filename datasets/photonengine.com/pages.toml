請求 毎月の使用量ベース ¥68.20 MINIMUM FEE 2,000 CCU + 6.0 TB 転送量 を含む PER MONTH ¥136,400 同時に最大2,000 人の接続ユーザーまで利用可能。 ゲームのみ 20m MAUまで適応 以下を含む 3.0 GB 転送量 ピークCCUごと /月 使用量ベースのCCUオートスケーリング 50,000CCU以上の CCUバースト デフォルトのDDoS保護 追加購入: 1GBごと ¥11.80 Europe / Canada, East / RU / RUE / USA, East / USA, West ¥23.60 Asia / Australia / China / India / Japan / South Africa / South America / South Korea / Turkey / United Arab Emirates サインアップ Premium Cloudのお客様には、応答時間保証のサービスレベルと当社のオペレーションスペシャリストまたは年中無休のNOCチームによるプレミアムサポートをオプションでお付けしています。 詳細はお問い合わせください。 サインアップ Not Building a Game? Photon Industries Circle offers access to special hosting products, coding samples including priority support - required for business use cases like education, training, medical, simulation, collaboration, meeting, events, defense, sports, metaverse, social VR/XR, arcades and more. SEE CIRCLE Photon ENTERPRISE CLOUD 複数の無制限CCUタイトルの専用かつマネージドクラウド環境です。 サーバーオーソリテーティブロジックへの対応が保証されたサービスレベルとプラグインが、世界でもトップクラスのスタジオに選ばれる要因となっています。 タイトル数制限なし SLA(アップタイム、レスポンスタイムを含む) 優先オペレーションサポート＆年中無休のNOCチーム対応 専用サーバー プラグインによるサーバオーソリティロジック プレミアムダッシュボードとカウンター 多層DDoS対策 お問い合わせ CCU アプリケーションに同時接続可能なユーザーの数がCCUで定義されます。プランごとのCCU合計数は、全リージョンの最大利用CCU数合計です。 例： EUピークCCU：420、 USピークCCU：230、 その他リージョンCCU：0 の場合 合計CCU = 420 + 230 = 650 より、適切なプランは1000CCUプランとなります。 CCUバースト 一時的にCCU申込数を超えて利用できますので、ユーザーがゲームを遊べないといった機会損失の心配はありません。超過利用分については、契約内容に応じて翌月請求いたします。最初のCCUバースト発生後、48時間以内にご利用プランをアップグレードしてください。それ以降は、当社独自の裁量により、CCU数の上限を制限する場合があります。 CCUバースト時のCCU数は、接続している全リージョンのCCUピークの合計値として定義されます。 転送量の計算 無償で利用できる転送量枠は、ご利用のプランのCCU数にもとづいて計算されます。 すべてのPhotonクラウドサーバーへの受信/発信メッセージが、転送量の対象となります。 無償の転送量枠を超過したトラフィックについて、超過料金が発生します。上図を参照してください。 例： 100CCUプランをご利用の場合、1CCUごとに3GBが含まれますので無償の転送量枠は300GBとなります。 Onetimeプラン（12ヶ月） Onetimeプラン（12ヶ月）は、1つのアプリにのみ適用可能です。月額費用なしで、12ヶ月間利用できます。 Onetimeプラン（12ヶ月）のCCUは、すべての月額プランに追加可能です。例) 500CCUプランに100CCU追加すると、合計600 CCUとなります。 月間アクティブユーザー 弊社の経験にもとづき、1CCU=20DAU(デイリーアクティブユーザー)=400MAUの想定で換算しています。 いつでもアップグレード/ダウングレードが可能 お使いのプランのアップグレード/ダウングレードはいつでも可能です。新しいCCU数は直ちに有効となります。以前のプランで支払済みの料金は、自動的に繰り越されます。また、解約は月末に実行されます。 無償サポート 当社の全プランで、オンラインドキュメント、無料サンプル、チュートリアル、動画ストリーム、技術面以外のサポート（アカウント有効化、アカウント管理、請求関連、サービスステータス）について無償でご提供しています。 Gaming Circleプレミアムサポート Gaming Circleは当社のプレミアム開発サポートプログラムです。Photonの全製品についてダイレクトチャットサポート、メンバー限定サンプル、Circle Discordのプロコミュニティへのアクセスなど多くのメリットがあります。 詳細は こちらをご覧ください。. リージョン 最適なRTT(ラウンドトリップタイム)となるよう、あなたのアプリに最も近いリージョンを選ぶことができます。 世界中のリージョンを複数利用できます。 その他不明な点は? こちらまでお問い合わせください： [email protected]"
