金は、自動的に繰り越されます。また、解約は月末に実行されます。 無償サポート 当社の全プランで、オンラインドキュメント、無料サンプル、チュートリアル、動画ストリーム、技術面以外のサポート（アカウント有効化、アカウント管理、請求関連、サービスステータス）について無償でご提供しています。 Gaming Circleプレミアムサポート Gaming Circleは当社のプレミアム開発サポートプログラムです。Photonの全製品についてダイレクトチャットサポート、メンバー限定サンプル、Circle Discordのプロコミュニティへのアクセスなど多くのメリットがあります。 詳細は こちらをご覧ください。. リージョン 最適なRTT(ラウンドトリップタイム)となるよう、あなたのアプリに最も近いリージョンを選ぶことができます。 世界中のリージョンを複数利用できます。 その他不明な点は? こちらまでお問い合わせください： [email protected]"
