title = "PhotoSync – Fotos & Videos übertragen und sichern | Für iOS & Android - PhotoSync"
description = "Schnelles Übertragen von Fotos & Videos zu und vom Computer (Windows PC, Mac & Linux) über Wi-Fi. Es werden keine Cloud-Dienste benötigt! Zwei mächtige Optionen sind verfügbar: 'Drag & Drop zu den Mobilgeräten mit der KOSTENLOSEN PhotoSync Companion App'  und 'Zugriff über den Webbrowser'."
full_description = '''PhotoSync Drahtloses Übertragen & Sichern Ihrer Fotos & Videos. Jede Art von Übertragung - PhotoSync macht's möglich! Unbegrenzte Übertragungen Übertragen Sie Fotos & Videos zwischen iPhone, iPad, Android, Windows PC, Mac, Linux, NAS, Cloud-Diensten und vieles mehr… Plattformübergreifend Die Nummer Eins der plattformübergreifenden Lösungen mit Apps für iOS (iPhone, iPad), Android, Windows PC und Mac. Unterstützung auch für Linux! Volle Kontrolle garantiert Sie haben die volle Kontrolle über Ihre Daten, jederzeit an Ihre Bedürfnisse anpassbar. Seien Sie völlig unabhängig von Cloud-Diensten anderer Anbieter! Verlässlich & sicher Über 12+ Jahre am Markt mit regelmäßigen Updates. Ein unverzichtbares Werkzeug für Ihre Foto- und Videoübertragungen! Übertragen von Fotos zum Computer Schnelles Übertragen von Fotos & Videos zu und vom Computer (Windows PC, Mac & Linux) über Wi-Fi. Es werden keine Cloud-Dienste benötigt! Zwei mächtige Optionen sind verfügbar: 'Drag & Drop zu den Mobilgeräten mit der KOSTENLOSEN PhotoSync Companion App' und 'Zugriff über den Webbrowser'. Erfahren Sie mehr Übertragen von Fotos zu Windows PC, Mac & Linux Sichern Sie Ihre Fotos & Video vom iPhone, iPad und Android-Geräten zu einem Windows PC, Mac oder Linux über das lokale Wi-Fi-Netzwerk. Fotos & Videos werden in der Originalauflösung mit allen Metadaten übertragen. Senden Sie Fotos & Videos direkt von Ihrem Windows PC, Mac oder Linux zum iPhone, iPad und Android-Geräten über das lokale Wi-Fi-Netzwerk. Empfangene Fotos & Videos werden direkt in der iOS Fotobibliothek, der Android Galerie oder in benutzerdefinierten Alben abgelegt. PhotoSync merkt sich Ihre Übertragungsvorgänge und zeigt an, welche Fotos & Videos bereits übertragen wurden. Flexibel verwalten: Individuell konfigurierbare Ablage und Benennung der Dateien und umfangreiche Einstellungen für die Übertragungsqualität geben Ihnen zu jeder Zeit die volle Kontrolle über Ihre Foto- und Videoübertragungen. Erfahren Sie mehr Ihre Fotos & Videos verlassen zu keiner Zeit Ihr lokales Wi-Fi-Netzwerk oder werden über das Internet übertragen! Anmerkung: Die Übertragungsgeschwindigkeit ist von der Qualität Ihres Wi-Fi-Netzwerkes abhängig. Zwei mächtige Übertragungsoptionen PhotoSync Companion: Drag & Drop zu Geräten Übertragen Sie Ihre Fotos & Videos zu Ihren Geräten innerhalb weniger Augenblicke mit der KOSTENLOSEN PhotoSync Companion App für Windows PC und Mac. Die KOSTENLOSE PhotoSync Companion App für Windows PC und Mac macht Ihre Foto- und Videoübertragungen zu einem Kinderspiel. Ziehen Sie einfach die Fotos und Videos auf das PhotoSync-Symbol und versenden Sie diese so zu Ihrem Telefon oder Tablet. Unter macOS erlaubt Ihnen die PhotoSync Companion App auch die direkte Übertragung in die macOS Fotos App. Laden Sie die KOSTENLOSE PhotoSync Companion App für Windows PC & Mac Zugriff über den Webbrowser Über Wi-Fi auf Ihre Fotos & Videos zugreifen – egal wo Sie gerade sind. Und das einfach durch Öffnen Ihres bevorzugten Webbrowsers unter Windows PC, Mac oder Linux! Schauen Sie sich Ihre Fotos auf einem großen Bildschirm an, laden Sie ausgewählte Fotos herunter oder übertragen Sie diese zu Ihrem Telefon oder Tablet. Eine einfache Lösung, wenn man bei Freunden ist! Das Web Sharing erlaubt es Ihnen alle Ihre Fotos & Videos über einen Webbrowser zu durchsuchen, ohne zusätzliche Software herunterzuladen und installieren zu müssen. Der Zugriff über den Webbrowser kann zudem mit einem Benutzernamen und einem Kennwort abgesichert werden. Anmerkung: Unterstützung für Linux über eine SFTP-Verbindung (FTP über SSH). Sichern von Fotos zu NAS-Geräten Sichern Sie Ihre Fotos & Videos sicher zu jedem NAS, mobilem Wi-Fi Speicher oder Ihrer persönlichen Cloud über FTP, SMB, WebDAV and (S)FTP. PhotoSync arbeitet einwandfrei mit Geräten von Synology, QNAP, Buffalo NAS, ownCloud, Nextcloud, WD MyCloud, Fritz!Box, TrueNAS, OpenMediaVault, Seagate Personal Cloud, Toshiba, SanDisk… Erfahren Sie mehr Sichern zu NAS-Geräten, mobilen Wi-Fi-Speichern oder persönlichen Clouds… NAS, entfernte Server und persönliche Clouds Sicheres Übertragen von Fotos & Video direkt von Ihrem iPhone, iPad und Android-Gerät zu jedem beliebigen NAS, entfernten Server oder persönlicher Cloud über (S)FTP, SMB oder WebDAV. Sie können außerdem Ihre Fotos & Videos über (S)FTP, SMB und WebDAV durchsuchen, ansehen und herunterladen. PhotoSync arbeitet einwandfrei mit allen bekannten NAS-Geräten, Servern und persönlichen Clouds zusammen: Synology QNAP Buffalo NAS ownCloud Nextcloud WD MyCloud FRITZ!Box TrueNAS OpenMediaVault Seagate Personal Cloud NETGEAR ReadyNAS Und viele mehr … Drahtlose Festplatten Einfaches hochladen oder herunterladen von Fotos & Videos zu Ihren drahtlosen portablen Festplatten und Sticks über (S)FTP, SMB und WebDAV - und das, während Sie unterwegs sind. PhotoSync unterstützt alle gängigen kabellosen Festplatten: Western Digital Seagate Toshiba HyperDrive SanDisk Und viele mehr … Automatisches Sichern von Fotos im Hintergrund Übertragen Sie automatisch Fotos & Videos direkt vom iPhone, iPad und Android-Geräten zum Computer (Mac/PC), NAS, drahtlosen mobilen Speichern und unterstützten Cloud- und Fotodiensten. Erfahren Sie mehr Autoübertragung Eine einfache und verlässliche Lösung, um neue Fotos & Videos automatisch im Hintergrund von Ihrem iPhone, iPad und Android-Geräten zu einem definierten Ziel zu übertragen. Mit Autoübertragung sichern Sie Ihre Fotos zu: Computer (PC & Mac) NAS, drahtlose, mobile Speicher oder entfernte Server Unterstützten Cloud- und Fotodiensten Es ist möglich, jeden Auslösertyp mit benutzerdefinierten Wi-Fi-Einstellungen zu kombinieren (nur Android). Beachten Sie: Autoübertragung unter iOS unterstützt nur die Optionen "Ortsabhängige Übertragung“ und "Beim Aufladen" (iOS 13). Fünf leistungsstarke Autoübertragung-Optionen: Wi-Fi Netzwerk-Verbindung (SSID): Autoübertragung, wann Ihr Gerät sich mit einem zuvor ausgewählten Wi-Fi Netzwerk verbindet Ortsabhängige Übertragung: Autoübertragung, wann Sie an einem vorher ausgewählten Ort eintreffen (z.B. zu Hause) Zeitabhängige Übertragung: Autoübertragung, täglich zu vorher festgelegten Uhrzeiten – fügen Sie einmalige und sich wiederholende Zeitpläne hinzu (stündlich, täglich, wöchentlich, monatlich) Sofortige Übertragung: Autoübertragung, sobald Sie ein neues Foto oder Video aufnehmen Beim Aufladen: Autoübertragung, wenn das Gerät aufgeladen wird (iOS) / Ihr Gerät an einem Ladekabel anschließen (Android) Premium-Features Exklusive Funktionen verfügbar fürPhotoSync Premium-Benutzer (nur iOS) Autoübertragung:Automatisches Backup Automatische Übertragung und Backup 'neuer' Fotos und Videos im Hintergrund zu Computer, NAS und Cloud-Diensten Erfahren Sie mehr PhotoSync Kamera:Sofortübertragung Sofortige Übertragung und Sicherung von Fotos & Videos auf Computer, NAS oder Cloud-Diensten. Plus Fotobooth-Unterstützung Erfahren Sie mehr Clientseitige Verschlüssselung:Schützen Sie Ihre Fotos/Videos Fotos & Videos vor der Übertragung verschlüsseln, um eine sichere Speicherung auf NAS- und datei-basierten Cloud-Diensten zu gewährleisten Erfahren Sie mehr Siri undKurzbefehle Erstellen Sie leistungsstarke Workflows mit den Siri-Kurzbefehlen 'Übertrage Zwischenablage' und 'Übertrage neue Fotos & Videos' Erfahren Sie mehr Amazon S3-, Backblaze- & Wasabi-Unterstützung Sicherung auf Amazon S3 sowie Anzeigen und Herunterladen von Fotos auf Amazon S3. Plus Backblaze und Wasabi Unterstützung! Erfahren Sie mehr Kamera-Unterstützung(Wi-Fi & USB) Übertragen und Anzeigen von Fotos und Videos von Canon EOS-, Nikon-, Sony-, Fujifilm-, Olympus- und Lumix-Kameras Erfahren Sie mehr Herunterladen von Wi-Fi SD-Karten Laden Sie Fotos, RAWs und Videos in voller Auflösung direkt von Toshiba FlashAir- und Transcend Wi-Fi-Karten herunter. + Drahtloses Tethering für FlashAir Wi-Fi SD Karten! Erfahren Sie mehr SanDisk iXpand LoopUSB-Flash-Laufwerke Sichern Sie Fotos & Videos auf das iXpand Loop Flash-Laufwerk und schaffen Sie zusätlichen Platz auf Ihrem Gerät. Ideal für den Offline-Einsatz auf Reisen! Erfahren Sie mehr Übertragung und Sicherung in die Cloud / Fotodienste Speichern oder downloaden Sie Fotos & Videos direkt über Wi-Fi & 3G/4G/5G zu Ihren bevorzugten Cloud- und Fotodiensten: Dropbox, Google Fotos, Google Drive, Amazon S3, Flickr, SmugMug, OneDrive, Box, Backblaze, Wasabi, Zenfolio, PhotoPrism, pCloud, InfiniCLOUD und SugarSync. Erfahren Sie mehr Übertragen und Teilen von Fotos mit Cloud- und Fotodiensten Speichern und Teilen Sie Fotos & Videos von Ihrem iPhone, iPad und Android-Geräten zu Ihren bevorzugten Cloud- und Fotodiensten über Wi-Fi & 3G/4G/5G. Importieren Sie Fotos & Videos, die in Ihrem bevorzugten Cloud- und Fotodienst gesichert sind direkt in die Fotobibliothek Ihres iOS-Gerätes, die Galerie Ihres Android-Gerätes oder in benutzerdefinierte Alben auf Ihrem Gerät. Sie können ausgewählte, alle oder neue Fotos & Videos importieren. Beachten Sie: Dienste von Drittanbietern benötigen einen personalisierten Zugang für diesen Dienst und eine Internetverbindung. Amazon S3, Backblaze & Wasabi – Premium-Funktionen (nur iOS) InfiniCLOUD – auf Android WebDAV-Verbindung anlegen pCloud & SugarSync – nur für iOS verfügbar MagentaCLOUD – WebDAV-Verbindung anlegen rsync.net – SFTP-Verbindung anlegen Unterstützte Cloud-/Fotodienste: Dropbox Google Drive Google Fotos Amazon S3 Box SmugMug Flickr OneDrive Backblaze Wasabi Zenfolio pCloud PhotoPrism InfiniCLOUD SugarSync MagentaCLOUD rsync.net Direkte Übertragung zwischen Diensten, Geräten und NAS PhotoSync kann Fotos & Videos direkt zwischen Diensten, Geräten und NAS übertragen, ohne dass vorher in die iOS Foto-Bibliothek / Android-Foto-Gallerie importiert werden muss. Beispielsweise ist die direkte Übertagung von OneDrive zum NAS oder von SMB zu einem USB-Speicher möglich – die unterstützen Übertragungskombinationen sind praktisch endlos! iPhone / iPad Android Windows PC1 Mac1 Linux1,2 Flickr SmugMug Box MagentaCLOUD5 InfiniCLOUD3 SMB FTP / SFTP WebDAV Files (USB / iCloud Drive) iXpand Loop USB-Flash-Laufwerk7 Wasabi7 Backblaze7 Toshiba Canvio PhotoPrism3 Dropbox Google Drive OneDrive Amazon S37 Google Fotos Zenfolio SugarSync4 pCloud4 rsync.net 6 1 Keine direkte Übertragung zwischen Mac, Windows und Linux 2 Unterstützung für Linux mit einer SFTP, FTP oder SMB Verbindung 3 InfiniCLOUD - durch Konfiguration einer WebDAV-Verbindung (Android) 4 pCloud & SugarSync (nur iOS) 5 MagentaCLOUD - durch Konfiguration einer WebDAV-Verbindung 6 rsync.net - durch Konfiguration einer SFTP-Verbindung 7 Exklusive Premium-Funktion Clientseitige Verschlüssselung:Schützen Sie Ihre Fotos & Videos Premium Fotos & Videos vor der Übertragung verschlüsseln, um eine sichere Speicherung auf NAS- und Cloud-Diensten (dateibasiert) zu gewährleisten (nur iOS) Erfahren Sie mehr Fotos und Videos verschlüsseln Verschlüsseln Sie Ihre Fotos & Videos vor der Übertragung und speichern Sie sie verschlüsselt auf NAS-Geräten und dateibasierten Cloud-Diensten. Browsen und betrachten Sie verschlüsselte Fotos & Videos direkt in PhotoSync. Rclone und OpenSSL basierte Verschlüsselung werden für eine einfache Integration in eigene Workflows und bequeme Entschlüsselung an Mac und PC unterstützt. Beachten Sie: Dienste von Drittanbietern erfordern ein Benutzerkonto für den Cloud-/Fotodienst + Internetverbindung Unterstützte NAS- und dateibasierte Cloud-Dienste: FTP SFTP WebDAV SMB Dropbox Google Drive Amazon S3 OneDrive Box Backblaze Wasabi pCloud InfiniCLOUD SugarSync MagentaCLOUD rsync.net MagentaCLOUD – durch Konfiguration einer WebDAV-Verbindung rsync.net - durch Konfiguration einer SFTP-Verbindung USB-Laufwerk-Unterstützung - Sichern Sie Ihre Fotos & Videos Übertragen Sie Fotos und Videos auf / von USB-Laufwerken und nutzen Sie dabei die volle Funktionalität von PhotoSync, einschließlich automatischer Ordnererstellung und benutzerdefinierter Dateinamen (nur iOS) Fotos zwischen Telefonen und Tablets übertragen Senden und empfangen Sie Fotos & Videos zwischen Ihrem iPhone, iPad und Android-Geräten über Wi-Fi – Computer oder Cloud-Dienste werden nicht benötigt. Die Übertragung funktioniert plattformübergreifend. Erfahren Sie mehr Übertragen von Fotos zwischen iOS- und Android-Geräten Verschieben, kopieren und teilen Sie Fotos & Videos direkt und in Originalqualität zwischen Ihrem iPhone, iPad und Android-Geräten über Wi-Fi. Zwischen iOS-Geräten sind auch Übertragungen per Bluetooth möglich. Ein Benutzerkonto wird nicht benötigt! Verwenden Sie die integrierten Filter, um Ihre wertvollsten Fotos und Videos für die Übertragung auszuwählen. Beachten Sie: Um Fotos & Videos zwischen iOS und Android zu übertragen, benötigen beide Geräte eine installierte Version von PhotoSync und beide Geräte müssen mit dem gleichen Wi-Fi Netzwerk verbunden sein. Fotos von Wi-Fi SD Karten laden Nehmen Sie Fotos, Videos & RAW-Fotos mit Ihrer Kamera auf einer Wi-Fi SD Karte auf und laden Sie die Originaldateien direkt von Ihrem Telefon / Tablet aus herunter. Toshiba Flashair™ und Transcend Wi-Fi SD Karten werden unterstützt.Drahtloses Tethering für Toshiba FlashAir Wi-Fi SD Karten! Erfahren Sie mehr Wi-Fi SD-Karten & Apple Kamera-Adapter Unterstützung Wi-Fi SD-Karten Nehmen Sie Fotos, Videos & RAW-Fotos mit Ihrer Kamera auf, die mit einer Toshiba Flashair™ oder Transcend Wi-Fi SD Karte ausgestattet ist und laden Sie die Dateien in voller Auflösung direkt in Ihre Fotobibliothek, Android-Galerie oder benutzerdefinierten Alben herunter. Schauen Sie sich die Fotos & Videos, die auf der Wi-Fi SD Karte Ihrer Kamera gespeichert sind in allen Details an, ohne sie auf Ihr Gerät importieren zu müssen. Drahtloses Tethering für Toshiba FlashAir Wi-Fi SD Karten. Apple Kamera-Adapter PhotoSync unterstützt die Übertragung von Fotos & Videos, die mit einem Apple Kamera Adapter auf ein iPhone oder iPad importiert wurden. (Nur iOS) Beeindruckende Funktionalitäten Schnellübertragung Übertragen Sie neue Fotos & Videos zu einem definierten Ziel durch Drücken und Halten der 'Übertragungstaste'. Es werden keine weiteren Interaktionen benötigt! Pfiffig PhotoSync merkt sich, welche Fotos & Videos bereits übertragen wurden und bietet Ihnen die Übertragung von neuen Fotos & Videos mit nur einer Berührung an! RAW-Fotos Betrachten, übertragen und importieren Sie RAW-Fotos ohne Einschränkungen! PhotoSync wird nie Ihre Foto- und Videodateien verändern. Bewahrt die Foto-Metadaten PhotoSync überträgt die Originaldateien und alle Metadaten (EXIF, GPS, IPTC) bleiben erhalten. Share Sheet Fotos & Videos aus anderen Apps direkt mit PhotoSync teilen und übertragen. Integrierter Bildbetrachter Schauen Sie sich Fotos & Videos direkt in PhotoSync an. Drucken oder öffnen Sie Fotos & Videos direkt aus dem Bildbetrachter in anderen Apps. Sprachkontrolle+Kurzbefehle Übertragungen direkt per Sprache auslösen und Kurzbefehle erstellen (Nur iOS) USB-Laufwerke+iCloud Drive Sichern von Fotos & Videos auf USB-Laufwerke & iCloud Drive mit automatischer Ordnererstellun'''
