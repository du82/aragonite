["https://www.photosync-app.com/support/ios/answers/how-to-automatically-create-subdirectories-on-the-target-device-service.html"]
title = "How to automatically create subdirectories on the target device / service? - PhotoSync"
description = "How to automatically create subdirectories on the target device / service?"
full_description = "How to automatically create subdirectories on the target device / service? After successful configuration you will be able to automatically organize the photos / videos you transfer into pre-defined subdirectories ‘on’ computer, cloud or file-based services. You can select creation options from a wide-range of predefined device and date-based subdirectory formats or create custom ones. Steps Open the PhotoSync settings, go to Configure, select the target (e.g. computer) and then open “Create Sub-Directories”. (adsbygoogle = window.adsbygoogle || []).push({}); Device based formats None Creates no additional subdirectories. Your photos go directly into the default destination folder on the target. Device Name + Album Name Default option for file-based services. Creates a subfolder with the name of your device plus a subfolder with the name of the current album in the default destination folder on the target and places the transfers into these folders. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' will be stored as 'Steve's phone/Recents/IMG_1234.JPG' in the destination folder on the target. Device Name + Folder Name Default option for file-based services. Creates a subfolder with the name of your device plus a subfolder with the name of the current folder in the default destination folder on the target and places the transfers into these folders. E.g. a photo named IMG_1234.JPG from your device 'Jennifer's phone' and the folder 'Camera' will be stored as 'Jennifer's phone/Camera/IMG_1234.JPG' in the destination folder on the target. Device Name Creates a subfolder with the name of your device in the default destination folder on the target and places the transfers into this folder. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' will be stored as 'Steve's phone/IMG_1234.JPG' in the destination folder on the target. Album Name Creates a subfolder with the name of the current album in the default destination folder on the target and places the transfers into this folder. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' will be stored as 'Recents/IMG_1234.JPG' in the destination folder on the target. Folder Name Creates a subfolder with the name of the current folder in the default destination folder on the target and places the transfers into this folder. E.g. a photo named IMG_1234.JPG from your device 'Jennifer's phone' and the album 'Camera' will be stored as 'Camera/IMG_1234.JPG' in the destination folder on the target. File type (Photos | Videos | RAW) Creates a subfolder with the file type of the current photo or video in the default destination folder on the target and places the transfers into this folder. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' will be stored as 'photos/IMG_1234.JPG' in the destination folder on the target. While a video named IMG_1234.MOV from your device will be stored as 'videos/IMG_1234.MOV' in the destination folder on the target. File extension Creates a subfolder with the file extension of the current photo or video in the default destination folder on the target and places the transfers into this folder. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' will be stored as 'JPG/IMG_1234.JPG' in the destination folder on the target. While a video named IMG_1234.MOV from your device will be stored as 'MOV/IMG_1234.MOV' in the destination folder on the target. Date based formats Recording Date (Year + Month + Day) Creates multiple subfolders containing the recording year, recording month and recording day of the current photo or video in the default destination folder on the target and places the transfers into these folders. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' which was recorded on 2021-02-24 will be stored as '2021/02/24/IMG_1234.JPG' in the destination folder on the target. Recording Date (Year + Month) Creates multiple subfolders containing the recording year and recording month of the current photo or video in the default destination folder on the target and places the transfers into these folders. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' which was recorded on 2021-02-24 will be stored as '2021/02/IMG_1234.JPG' in the destination folder on the target. Recording Date (Month + Day) Creates multiple subfolders containing the recording month and recording day of the current photo or video in the default destination folder on the target and places the transfers into these folders. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' which was recorded on 2021-02-24 will be stored as '02/24/IMG_1234.JPG' in the destination folder on the target. Recording Date (Date) Creates a subfolder containing the recording date of the current photo or video in the default destination folder on the target and places the transfers into this folder. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' which was recorded on 2021-02-24 will be stored as '2021-02-24/IMG_1234.JPG' in the destination folder on the target. Transfer Date (Year + Month + Day) Creates multiple subfolders containing the transfer year, transfer month and transfer day of the current photo or video in the default destination folder on the target and places the transfers into these folders. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' which was transferred on 2021-02-24 will be stored as '2021/02/24/IMG_1234.JPG' in the destination folder on the target. Transfer Date (Year + Month) Creates multiple subfolders containing the transfer year and transfer month of the current photo or video in the default destination folder on the target and places the transfers into these folders. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' which was transferred on 2021-02-24 will be stored as '2021/02/IMG_1234.JPG' in the destination folder on the target. Transfer Date (Month + Day) Creates multiple subfolders containing the transfer month and transfer day of the current photo or video in the default destination folder on the target and places the transfers into these folders. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' which was transferred on 2021-02-24 will be stored as '02/24/IMG_1234.JPG' in the destination folder on the target. Transfer Date (Date) Creates a subfolder containing the transfer date of the current photo or video in the default destination folder on the target and places the transfers into this folder. E.g. a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' which was transferred on 2021-02-24 will be stored as '2021-02-24/IMG_1234.JPG' in the destination folder on the target. Custom formats Custom Formats This option lets you define your own custom subfolder formats for your transfers. You can choose from a set of placeholders which will be replaced by the corresponding values during the transfer, use your own text blocks and folder separators in the custom formats. Note: Entering an incorrect custom format may cause your transfers to fail if the format generates folder names that are not allowed in your target destination due to illegal or problematic characters.You may use the following characters and placeholders in your custom subfolder definitions: Date/Time Recording Date Year (%YR) Recording date year of the current photo or video in four digit format. For a photo recorded on 2021-02-24 this placeholder will be replaced with '2021'. Year (%yR) Recording date year of the current photo or video in two digit format. For a photo recorded on 2021-02-24 this placeholder will be replaced with '21'. Quarter (%qR) Recording date quarter of the current photo or video in digit format. For a photo recorded on 2021-02-24 this placeholder will be replaced with '1'. Month (%mR) Recording date month of the current photo or video in two digit format. For a photo recorded on 2021-02-24 this placeholder will be replaced with '02'. Month (%mmmmR) Recording date month of the current photo or video in abbreviated format. For a photo recorded on 2021-02-24 this placeholder will be replaced with 'Feb'. Month (%mmmmmR) Recording date month of the current photo or video in full name format. For a photo recorded on 2021-02-24 this placeholder will be replaced with 'February'. Day (%dR) Recording date day of the current photo or video in two digit format. For a photo recorded on 2021-02-24 this placeholder will be replaced with '24'. Day - abbreviated (%eeeR) Recording date day of the current photo or video in abbreviated name format. For a photo recorded on 2021-02-24 (Wednesday) this placeholder will be replaced with 'Wed'. Day - full name (%eeeeR) Recording date day of the current photo or video in full name format. For a photo recorded on 2021-02-24 (Wednesday) this placeholder will be replaced with 'Wednesday'. Hour (%HR) Recording date hour of the current photo or video in two digit format. For a photo recorded on 2021-02-24 14:27:54 this placeholder will be replaced with '14'. Minute (%MR) Recording date minute of the hour of the current photo or video in two digit format. For a photo recorded on 2021-02-24 14:27:54 this placeholder will be replaced with '27'. Second (%SR) Recording date second of the current photo or video in two digit format. For a photo recorded on 2021-02-24 14:27:54 this placeholder will be replaced with '54'. Millisecond (%MSR)Android only Recording date millisecond of the current photo or video in three digit format. For a photo recorded on 2021-02-24 14:27:54:189 this placeholder will be replaced with '189'. Transfer date Year (%YT) Transfer date year of the current photo or video in four digit format. For a photo transferred on 2021-02-24 this placeholder will be replaced with '2021'. Year (%yT) Transfer date year of the current photo or video in two digit format. For a photo transferred on 2021-02-24 this placeholder will be replaced with '21'. Quarter (%qR) Transfer date quarter of the current photo or video in digit format. For a photo transferred on 2021-02-24 this placeholder will be replaced with '1'. Month (%mT) Transfer date month of the current photo or video in two digit format. For a photo transferred on 2021-02-24 this placeholder will be replaced with '02'. Month (%mmmmT) Transfer date month of the current photo or video in abbreviated format. For a photo transferred on 2021-02-24 this placeholder will be replaced with 'Feb'. Month (%mmmmmR) Transfer date month of the current photo or video in full name format. For a photo transferred on 2021-02-24 this placeholder will be replaced with 'February'. Day (%dT) Transfer date day of the current photo or video in two digit format. For a photo transferred on 2021-02-24 this placeholder will be replaced with '24'. Day - abbreviated (%eeeT) Transfer date day of the current photo or video in abbreviated name format. For a photo recorded on 2021-02-24 (Wednesday) this placeholder will be replaced with 'Wed'. Day - full name (%eeeeT) Transfer date day of the current photo or video in full name format. For a photo recorded on 2021-02-24 (Wednesday) this placeholder will be replaced with 'Wednesday'. Hour (%HT) Transfer date hour of the current photo or video in two digit format. For a photo transferred on 2021-02-24 14:27:54 this placeholder will be replaced with '14'. Minute (%MT) Transfer date minute of the hour of the current photo or video in two digit format. For a photo transferred on 2021-02-24 14:27:54 this placeholder will be replaced with '27'. Second (%ST) Transfer date second of the current photo or video in two digit format. For a photo transferred on 2021-02-24 14:27:54 this placeholder will be replaced with '54'. Millisecond (%MST)Android only Transfer date millisecond of the current photo or video in three digit format. For a photo transferred on 2021-02-24 14:27:54:189 this placeholder will be replaced with '189'. Special Current album name (%AP) Name of the current album containing the photo or video. For a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Summer holidays' this placeholder will be replaced with 'Summer holidays' Current folder name (%FP)Android only Name of the current folder containing the photo or video. For a photo named IMG_1234.JPG from your device 'Jennifer's phone' and the folder 'Camera' this placeholder will be replaced with 'Camera'. Note: This placeholder is only available in the Android version of PhotoSync. Media Type (%SP)iOS only Name of the media type of the current media file. This can be 'Live Photo', 'Screenshot', 'Panorama', 'Video', 'Spacial', 'Cinematic', 'HDR', Time-lapse', 'Burst', 'Slo-mo' Device name (%DP) Name of the device containing the current photo or video. For a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'Steve's phone'. File type (%2P) File type of the current photo or video (photo or video). For a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'photos'. For a video named IMG_1234.MOV from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'videos'. For a RAW photo named IMG_1234.CR2 from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'photos'. File type (%3P) File type of the current photo or video (photo, video or RAW photo). For a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'Photos'. For a video named IMG_1234.MOV from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'Videos'. For a RAW photo named IMG_1234.CR2 from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'RAW'. File extension (%EP) File extension of the current photo or video. For a photo named IMG_1234.JPG from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'JPG'. For a video named IMG_1234.MOV from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'MOV'.For a RAW photo named IMG_1234.CR2 from your device 'Steve's phone' and the album 'Recents' this placeholder will be replaced with 'CR2'. Moment Title (%MOT)iOS only The title of the 'moment' from the moments collection, e.g. 'New Year' or '2024-12-31 - 2025-01-01' Moment Location (%MOL)iOS only The location of the 'moment' from the moments collection, e.g. 'London' GUID/UUID (%ID)iOS only The unique identifier of the current photo or video, e.g. 542130D"
