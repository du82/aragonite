ervices, as well as custom S3 installations such as MinIO are also supported. Client-Side Encryption:Protect Your Photos & Videos Encrypt photos & videos before transfer to ensure safe storage on NAS and file-based cloud services (iOS only) Learn more Encrypt Photos & Videos Encrypt photos & videos before transfer and store them encrypted on NAS and file-based cloud services. Browse and view encrypted photos & videos directly in PhotoSync. Rclone and OpenSSL are supported, enabling easy workflow integration and seamless decryption on PC and Mac. Note: 3rd party services require a user account for the cloud / photo service + Internet connection Supported NAS & file-based cloud services: FTP SFTP WebDAV SMB Dropbox Google Drive Amazon S3 OneDrive Box Backblaze Wasabi pCloud InfiniCLOUD SugarSync MagentaCLOUD rsync.net MagentaCLOUD – configure a WebDAV connection rsync.net – configure a SFTP connection SanDisk iXpand Loop Lightning / USB Flash Drive Support Backup and transfer pictures & videos directly to the iXpand Loop Drive and free up local device space fast. Great for offline usage when travelling! Learn more SanDisk iXpand Loop USB Flash Drives Quickly move photos & videos straight from your iPhone / iPad to the iXpand Flash Loop Drive. PhotoSync automatically creates folders on the Flash Drive based on the album structure on your iOS device. The full range of PhotoSync's transfer features (e.g., custom file names) are supported! Free up device space: Automatically delete photos & videos on your iOS device after successful transfer to the iXpand Loop Adapter (optional). Works offline: Ideal for travel and holidays! Import photos & videos from the iXpand Loop Drive to the iOS Photo Library of your iPhone / iPad. View photos & videos stored on the iXpand Loop Drive without having to download them first. Supported file formats: FAT and exFAT Camera Support(Wi-Fi & USB):Transfer & Tethering Download photos, videos & RAWs directly from your Canon EOS, Nikon, Sony, Lumix, Fujifilm & Olympus Wi-Fi camera or camera connected over USB to your iPhone / iPad. Use (wireless) tethering and transfer instantly to your mobile device or supported remote target (computer, NAS, cloud). (Wireless) tethering for many camera models! Learn more Camera Support over Wi-Fi & USB Canon EOS Nikon Sony Lumix Fujifilm Olympus Three transfer options are available: Wi-Fi Camera Support Manually download photos, videos and RAWs from Canon EOS, Nikon, Sony, Lumix, Fujifilm & Olympus Wi-Fi cameras to the photo library on your iPhone / iPad. Instant backup / wireless tethering: Automatically transfer photos, videos & RAWs to the photo library on your iPhone / iPad immediately after pressing the shutter button. Additionally, you can transfer files to any supported remote target (computer, NAS or cloud service). USB Camera Support (iOS 14.2+) Manually download photos, videos and RAWs from cameras connected over USB to the photo library on your iPhone / iPad or directly to remote targets (computer, NAS or cloud service). Instant backup / tethered shooting over USB is supported for many Canon EOS, Nikon, Sony and Fujifilm cameras. PhotoSync supports both PTP / MTP and Mass-Storage Mode of external cameras. If both are available on your camera, choose PTP / MTP for better performance and more features. FTP Server Support Integrated FTP server support for Pro Cameras from Canon, Nikon, Sony and Fujifilm. Highlights Photo booth support: Instant photo display on a TV or projector right after recording over AirPlay / HDMI. Easy deletion (also large numbers) of photos & videos from your camera directly in PhotoSync. Note: Tethering and photo booth support subject to camera model. Supported cameras: Canon EOS cameras Nikon cameras Sony cameras Lumix cameras Fujifilm cameras Olympus cameras Download photos from Wi-Fi SD Cards Take pictures, videos & RAWs on your camera equipped with a wireless SD card and download the full resolution files directly to your phone / tablet. Toshiba Flashair™ and Transcend Wi-Fi SD Cards are supported.Wireless tethering for Toshiba FlashAir Wi-Fi SD cards! Learn more Wireless SD-Cards Wireless SD-Cards Take pictures, videos & RAW photos on your camera equipped with a Toshiba Flashair™ or Transcend Wi-Fi SD Card and download the full resolution files directly to the Camera Roll or user-defined albums on your iPhone / iPad. View the photos & videos stored on your camera in full detail without having to first import them. Wireless tethering for Toshiba FlashAir Wi-Fi SD cards. Camera Connection Kit PhotoSync supports the transfer of photos & videos imported with the Camera Connection Kit (iOS only). OTG adapters PhotoSync supports the transfer of photos & videos stored on your USB or SD device connected with a USB On-The-Go (OTG) adapter. (Android only).'''
