full_description = 'News Read about our latest announcements and activities Featured All iOS Android Windows macOS (current) 2022-03-03 20:57 Update PhotoSync Companion 4.2 for macOS released PhotoSync Companion 4.2 for macOS contains the following improvements: Fixed: Improved handling of network timeouts Fixed: Non allowed characters in filenames are now replaced with an underscore Read more 2021-04-19 14:47 Update PhotoSync Companion 4.1 for macOS released PhotoSync Companion 4.1 for macOS contains the following improvements: NEW Native support for Macs with Apple M1 Chip NEW App name has been changed to "PhotoSync Companion" Fixed: A rare issue when transferring Live Photos to iPhone/iPad Read more 2019-09-18 07:58 Update PhotoSync Companion 4.0 for macOS released PhotoSync Companion 4.0 for macOS contains the following improvements: NEW When transferring to iOS devices running PhotoSync 4.0, albums on iOS are now automatically created for folders on the Mac Support for macOS Catalina (10.15) Fixes for Dark Mode Read more 2019-01-22 14:00 Update PhotoSync Companion 3.3.1 for macOS released Fixed album selection for transfers into Mac Photos app Download 2018-09-25 15:25 Update PhotoSync Companion 3.3 for macOS released NEW Support for Dark Mode (macOS Mojave) NEW Support for an upcoming version of PhotoSync for iOS Download 2017-05-21 22:00 Update PhotoSync Companion 3.2 for macOS released NEW iPv6 support NEW Support the upcoming PhotoSync 3.2 for iOS Download 2016-10-16 19:31 Update PhotoSync Companion 3.1.1 for macOS released Fixed: When opening preferences on macOS Sierra, the "Restart now" message was displayed multiple times under certain circumstances Download 2016-09-19 17:24 Update PhotoSync Companion 3.1 for macOS released NEW PhotoSync now supports macOS Sierra NEW PhotoSync now supports import into macOS Photos in reference mode ("Copy items into Library is deactivated") Download Twitter updates Follow us on'
