["https://www.photosync-app.com/de/specifications"]
title = "Spezifikationen - PhotoSync"
description = "PHOTOSYNC APP – TECHNISCHE SPEZIFIKATIONEN | Alle technischen Spezifikationen der App PhotoSync – Fotos übertragen für iOS, Android, Windows PC und Mac."
full_description = "Technische Daten PhotoSync für iOS & Android PhotoSync für iOS benötigt iOS 9.0 oder höher. PhotoSync für Android benötigt Android 5.0 oder höher. Für die Übertragung zwischen iOS und Android muss PhotoSync auf beiden Geräten installiert sein. Für die Übertragung zwischen einem iPhone/iPad/Android-Gerät und einem Computer (Mac/Windows PC) ist ein Webbrowser oder die kostenlose PhotoSync Companion App von unserer Internetseite (http://www.photosync-app.com/downloads) erforderlich. Wir empfehlen die Installation der kostenlosen PhotoSync Companion App für das beste Übertragungserlebnis. Übertragungen gehen direkt über das lokale Wi-Fi-Netzwerk - Ihre Fotos & Videos verlassen weder Ihr lokales Netzwerk noch gehen sie über das Internet. Die Übertragungsgeschwindigkeit hängt von der Qualität Ihres lokalen Wi-Fi-Netzwerks ab. Dienste von Drittanbietern erfordern ein Benutzerkonto für diesen Dienst und eine Internetverbindung. Mac & Windows Companion Für Übertragungen zwischen Computer (Windows PC/Mac) und iPhone/iPad/Android-Gerät muss PhotoSync auf beiden Geräten installiert sein. PhotoSync Companion für Windows benötigt: Einen PC mit Windows® XP SP2 oder höher, Windows Vista, Windows 7, Windows 8, Windows 8.1, Windows 10 oder Windows 11. PhotoSync Companion für macOS benötigt: Einen Mac mit macOS Leopard (10.5), Snow Leopard (10.6), Lion (10.7), Mountain Lion (10.8) (Intel & PPC werden unterstützt), Mavericks (10.9), Yosemite (10.10) El Capitan (10.11), Sierra (10.12), High Sierra (10.13), Mojave (10.14), Catalina (10.15), Big Sur (11), Monterey (12) oder Ventura (13) (Intel & Apple Silicon werden unterstützt)."
