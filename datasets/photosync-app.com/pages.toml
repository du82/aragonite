rtcuts 'Transfer new photos' and 'Transfer from clipboard' Learn more Amazon S3, Backblaze& Wasabi Support Backup to Amazon S3, plus view & download photos on Amazon S3. + Backblaze & Wasabi cloud support! Learn more Camera Support(Wi-Fi & USB) Transfer and view photos & videos from Canon EOS, Nikon, Sony, Fujifilm, Olympus & Lumix cameras Learn more Download from Wi-Fi SD Cards Download full resolution photos, RAWs & videos directly from Toshiba FlashAir & Transcend Wi-Fi Cards Learn more SanDisk iXpand LoopUSB Flash Drives Backup to iXpand Loop USB Drives & free up space on your phone – a great companion when travelling! Learn more Transfer & backupto cloud / photo services Directly upload and download photos & videos via Wi-Fi & 3G/4G/5G to your favourite cloud & photo services: Dropbox, Google Photos, Google Drive, Amazon S3, Flickr, SmugMug, OneDrive, Box, Backblaze, Wasabi, Zenfolio, PhotoPrism, pCloud, InfiniCLOUD and SugarSync. Learn more Transfer and share pictures to cloud / photo services Upload and share photos & videos from your iPhone, iPad and Android devices to your favorite cloud / photo services over Wi-Fi & 3G/4G/5G. View and import photos & videos stored on your favorite cloud / photo service directly into the Camera Roll, Android Image Gallery or user-defined albums on your device. You can import selected, all or new photos & videos. Note: 3rd party services require a user account for the cloud / photo service + Internet connection. Amazon S3, Backblaze & Wasabi – Premium features (iOS only) InfiniCLOUD – on Android configure a WebDAV connection pCloud & SugarSync – available on iOS only MagentaCLOUD – configure a WebDAV connection rsync.net – configure a SFTP connection Supported cloud / photo services: Dropbox Google Drive Google Photos Amazon S3 Box SmugMug Flickr OneDrive Backblaze Wasabi Zenfolio pCloud PhotoPrism InfiniCLOUD SugarSync MagentaCLOUD rsync.net Direct transfer between services, devices & NAS Transfer photos & videos directly b