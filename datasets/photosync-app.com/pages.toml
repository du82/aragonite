full_description = "News Read about our latest announcements and activities Featured All iOS Android Windows (current) macOS 2024-11-29 14:00 Update PhotoSync Companion 4.3.1 for Windows released Fixed device detection issues caused by running in a wrong thread Added transfer log to log all incoming transfers to the computer 2024-07-29 09:00 Update PhotoSync Companion 4.3.0 for Windows released Officially support two different device detection methods: Microsoft MDNS (Windows built-in) and Apple Bonjour Added the ability to select the device detection method in the 'Device auto detection' settings Fallback to Microsoft MDNS for device detection for installations without administrative permissions Dealing with known device detection issues by restarting the MDNS announcement on a regular basis 2023-10-26 15:00 Update PhotoSync Companion 4.2.5 for Windows released Fixed problems with the device detection using Windows MDNS instead of Apple Bonjour Fixed album generation bug creating a Temp album when albums with the parent folder name should be generated and photos are resized Fixed reported crashes 2023-09-01 10:00 Update PhotoSync Companion 4.2.4 for Windows released Fixed problems loading the albums from iOS devices in the device search window 2023-08-01 10:00 Update PhotoSync Companion 4.2.3 for Windows released Fixed problems with the name resolution of devices reading the album list from the target device when sending photos 2023-07-20 13:00 Update PhotoSync Companion 4.2.2 for Windows released Fixed problems reading the album list from the target device when sending photos Send button will only be activated when the album list has been received from the target device 2023-07-17 13:00 Update PhotoSync Companion 4.2.1 for Windows released Fixed crashes starting/restarting the PhotoSync service on systems which did not have Apple Bonjour installed 2023-07-17 11:00 Update PhotoSync Companion 4.2.0 for Windows released Changed internal webserver with a new component to prevent problems storing transferred files Re-added Apple Bonjour services to provide a better working device detection. Microsoft mDNS device detection will be used as a backup service only when Apple Bonjour is not working Page 1 of 5 1 2 3 4 5 Next Last Twitter updates Follow us on"
