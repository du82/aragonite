["https://www.photosync-app.com/news-android"]
title = "News - Android - PhotoSync"
description = "PHOTOSYNC APP – NEWS | Read about the latest announcements and activities of PhotoSync – Photo Transfer App for Android. Learn about new innovative features which make PhotoSync the most powerful and versatile photo & video transfer solution on the market for iOS & Android."
full_description = '''News Read about our latest announcements and activities Featured All iOS Android (current) Windows macOS 2025-03-05 12:17 Update PhotoSync 4.1.6 for Android released NEW Added favorite info into thumbnails NEW Added favorites smart album for Android build versions 30+ NEW Added an additional autotransfer check for autotransfers when you take a new photo Read more 2024-10-02 07:55 Update PhotoSync 4.1.1 for Android released NEW Added MANAGE_MEDIA permission to allow media management for PhotoSync NEW Added expert settings to view/modify app permissions NEW Replaced the 'Wait for Wi-Fi' option in autotransfer with a more flexible 'Connection' option Read more 2024-07-29 08:00 Update PhotoSync 4.1.0 for Android released Android 14 compatibility fixes UI fixes in the app settings Fixed reported crashes Read more 2024-01-17 12:00 Update PhotoSync 4.0.10 for Android released Fixed an import bug for autotransfer schedules Added a check to skip empty or corrupted files from transferring to prevent follow up errors in the transfer process. This fixes app crashes in SMB transfers when files have no size. Fixed a caching bug for WebDAV transfers to provide proper file overwrite checks Read more 2023-11-01 18:18 Update PhotoSync 4.0.9 for Android released Fixed reported crashes Removed an accidental redirection to the purchase screen of the upcoming release Added support for different volume purchase licenses Fixed redraw problems after executing "Mark all synced" 2023-09-28 18:00 Update PhotoSync 4.0.8 for Android released Fixed a reported crash in the image viewer delete function Fixed web browser handling for selected files to prevent crashes Fixed threading for Receive-, Download- and Send-HUD to prevent UI thread ANR's Read more 2023-06-19 12:00 Update PhotoSync 4.0.7 for Android released Fixed SMB uploads to work without truncation Fixed the mobile default configurations for some services and enabled full quality mobile transfers Fixed an optimisation bug in SMB that prevented the creation of subfolders with the same name as a parent folder Read more 2023-05-31 10:00 Update PhotoSync 4.0.4 for Android released Fixed upload issues with SMB (files were truncated on some servers to 1MB size, on some devices during upload the app crashed) Fixed autotransfer problems that could occur after a device restart For a list of all changes in PhotoSync 4.0 please visit PhotoSync 4.0 for Android released Read more Page 1 of 5 1 2 3 4 5 Next Last Twitter updates Follow us on'''
