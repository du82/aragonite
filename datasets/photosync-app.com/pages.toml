etween targets without having to first import them into the iOS Photo Library / Android Photo Gallery. You can for instance, directly transfer from OneDrive to a NAS or from SMB to a USB device. Supported transfer combinations are basically endless! iPhone / iPad Android Windows PC1 Mac1 Linux1,2 Flickr SmugMug Box MagentaCLOUD5 InfiniCLOUD3 SMB FTP / SFTP WebDAV Files (USB / iCloud Drive) iXpand Loop USB Flash Drive7 Wasabi7 Backblaze7 Toshiba Canvio PhotoPrism3 Dropbox Google Drive OneDrive Amazon S37 Google Photos Zenfolio SugarSync4 pCloud4 rsync.net 6 1 No transfer between Mac, Windows PC & Linux 2 Support for Linux via an SFTP, FTP or SMB connection 3 InfiniCLOUD - configure a WebDAV connection (Android) 4 pCloud & SugarSync (iOS only) 5 MagentaCLOUD - configure a WebDAV connection 6 rsync.net - configure a SFTP connection 7 Exclusive Premium feature Client-Side Encryption:Protect Your Photos & Videos Premium Encrypt photos & videos before transfer to ensure safe storage on NAS and file-based cloud services (iOS only) Learn more Encrypt Photos & Videos Encrypt photos & videos before transfer and store them encrypted on NAS and file-based cloud services. Browse and view encrypted photos & videos directly in PhotoSync. Rclone and OpenSSL are supported, enabling easy workflow integration and seamless decryption on PC and Mac. Note: 3rd party services require a user account for the cloud / photo service + Internet connection Supported NAS & file-based cloud services: FTP SFTP WebDAV SMB Dropbox Google Drive Amazon S3 OneDrive Box Backblaze Wasabi pCloud InfiniCLOUD SugarSync MagentaCLOUD rsync.net MagentaCLOUD – configure a WebDAV connection rsync.net – configure a SFTP connection USB Drive Support - Backup Your Photos & Videos Transfer photos & videos to / from USB Drives leveraging the full functionality of PhotoSync including automatic folder creation and custom file names (iOS only) Move pictures between phones and tablets Directly send and receive photos & videos between your iPhone, iPad and Android devices over Wi-Fi – no computer or cloud needed! Cross-platform support! Learn more Transfer photos between iOS and Android devices Directly move, copy and share photos & videos in full resolution between your iPhone, iPad and Android devices over Wi-Fi. Transfer over Bluetooth between iOS devices is also available. No user account or log-in required! Use the integrated filters to browse and select your most memorable photos and videos for transfer. Note: To transfer photos & videos between iOS and Android – both devices need to have PhotoSync installed on them and be connected to the same Wi-Fi network. Download photos from Wi-Fi SD Cards Take pictures, videos & RAWs on your camera equipped with a wireless SD card and download the full resolution files directly to your phone / tablet. Toshiba Flashair™ and Transcend Wi-Fi SD Cards are supported.Wireless tethering for Toshiba FlashAir Wi-Fi SD cards! Learn more Wi-Fi SD-Cards & Camera Connection Kit Support Wireless SD-Cards Take pictures, videos & RAW photos on your camera equipped with a Toshiba Flashair™ or Transcend Wi-Fi SD Card and download the full resolution files directly to your Camera Roll, Android Image Gallery or user-defined albums. View the photos & videos stored on your camera in full detail without having to first import them. Wireless tethering for Toshiba FlashAir Wi-Fi SD cards. Camera Connection Kit PhotoSync supports the transfer of photos & videos imported with the Camera Connection Kit. (iOS only) Amazing Features Quick Transfer Transfer new photos & videos to a predefined target by pressing and holding the 'Sync' button. No additional interactions required! Smart PhotoSync remembers which photos & videos have already been transferred and let‘s you transfer new photos & videos with one single touch! Preserves metadata Transfers original files and preserves all photo metadata (EXIF, GPS, IPTC) Delete after transfer Delete photos & videos after transf