title = "PhotoSync – Photo Transfer and Backup App | For iOS & Android - PhotoSync"
description = "Quickly transfer photos & videos to and from your computer (Windows PC, Mac & Linux) over Wi-Fi. No cloud needed! Two powerful options are available: 'Drag & drop to devices with the FREE PhotoSync Companion tool' and 'Web Browser Access'."
full_description = "PhotoSync Wirelessly transfer & backup your photos & videos. Any kind of transfer - PhotoSync can handle it! Unlimited transfers Transfer photos & videos between iPhone, iPad, Android, Windows PC, Mac, Linux, NAS, cloud services & more… Cross-platform Number one cross-platform solution with native apps for iOS (iPhone, iPad), Android, Windows PC and Mac. Support for Linux too! Retain full control Total user control and fully customizable at all times. Be totally independent of cloud services! Reliable & secure Operating 12+ years in the market and continuously upgraded. An indispensible tool for photo and video transfers! Transfer photos to computer Quickly transfer photos & videos to and from your computer (Windows PC, Mac & Linux) over Wi-Fi. No cloud needed! Two powerful options are available: 'Drag & drop to devices with the FREE PhotoSync Companion tool' and 'Web Browser Access'. Learn more Transfer photos to Windows PC, Mac & Linux Backup your photos & videos from iPhone, iPad and Android devices to Windows PC, Mac or Linux over the local Wi-Fi network. Photos & videos are transferred in full resolution with all metadata intact. Send photos & videos directly from your Windows PC, Mac or Linux to iPhone, iPad and Android devices over the local Wi-Fi network. Received photos & videos are imported directly into the Camera Roll, Android Image Gallery or user-defined album. PhotoSync keeps track of your actions and notes which photos & videos have already been transferred. Manage like a Pro: Highly configurable storage, naming and transfer quality options mean you retain full control of your photo & video transfers at all times. Learn more Your photos & videos never leave your local Wi-Fi network nor go over the Internet! Note: Transfer speed depends on the quality of your local Wi-Fi network. Two powerful transfer options PhotoSync Companion: Drag & drop to devices Transfer photos & videos to your device in seconds with the FREE PhotoSync companion for Windows PC and Mac. The FREE PhotoSync Companion for Windows PC and Mac makes the photo and video transfer experience quick and easy. Just drag your photos and videos onto the PhotoSync icon to beam to your phone and tablet. On Mac computers the PhotoSync Companion enables direct import into the macOS Photos App. Get the FREE PhotoSync Companion for Windows PC & Mac Access by web browser (Windows, Mac, Linux) Wi-Fi access your photos & videos wherever you are – by opening a web browser (Windows, Mac, Linux)! View your photos on a big screen, download and upload selected photos & videos to your phone and tablet. A great feature when at friends! Web-sharing allows you to browse and view all your photos & videos from a web-browser without downloading or installing any software. Access to web-sharing can be protected with a login and password. Note: Support for Linux via an SFTP (FTP over SSH) connection. Backup photos to NAS Securely backup photos & videos to NAS devices, personal cloud and wireless portable hard drives over FTP, SMB, WebDAV and SFTP. PhotoSync works flawlessly with Synology, QNAP, Buffalo NAS, ownCloud, Nextcloud, WD MyCloud, TrueNAS, OpenMediaVault, Seagate Personal Cloud, Toshiba, SanDisk … Learn more Backup to NAS, mobile storage device or personal cloud NAS, remote server and personal cloud Securely backup photos & videos directly from your iPhone, iPad and Android devices to any NAS, remote server or personal cloud over (S)FTP, SMB or WebDAV. You can also download and view photos & videos on (S)FTP, SMB and WebDAV servers. PhotoSync works seamlessly with all major NAS storage devices, servers and personal cloud services: Synology QNAP Buffalo NAS ownCloud Nextcloud WD MyCloud Fritz!Box TrueNAS OpenMediaVault Seagate Personal Cloud NETGEAR ReadyNAS And many more … Wireless hard drives Quickly upload and download photos & videos whilst on-the-go to your wireless portable hard drives and sticks over (S)FTP, SMB and WebDAV. PhotoSync supports all major wireless hard drives: Western Digital Seagate Toshiba HyperDrive SanDisk And many more … Automatically backup photos in the background Automatically transfer photos & videos directly from iPhone, iPad and Android devices to computer (Mac/PC), NAS, wireless mobile storage devices and supported cloud & photo services. Learn more Autotransfer Easy and reliable transfer solution for automatically backing up new photos & videos in the background from your iPhone, iPad and Android devices to predefined targets. With Autotransfer you can backup photos to: Computer (PC & Mac) NAS, wireless mobile storage device or remote server Supported cloud & photo services It is possible to combine each trigger type with customized Wi-Fi settings (Android only). Note: Autotransfer on iOS supports only the options “Location-Based Transfer” and “When Charging” (iOS 13). Five powerful autotransfer options: Wi-Fi Access Point (SSID): Autotransfer when your device connects to a pre-selected WiFi network Location-Based Transfer: Autotransfer when you arrive at a pre-selected geolocation (e.g. at home) Time Schedule: Autotransfer daily at pre-set times – add one-time or repeating schedules (hourly, daily, weekly, monthly) Instant Transfer: Autotransfer the moment you take a new picture or video When Charging: Autotransfer when you charge your device (iOS) / connect your device to a charger (Android) Premium Features Exclusive features available toPhotoSync Premium users (iOS only) Autotransfer:Automatic Backup Automatically backup 'new' photos & videos in the background to computer, NAS & cloud Learn more PhotoSync Camera:Instant Transfer Instant transfer and backup of photos & videos to computer, NAS or cloud services. Plus photobooth support Learn more Client-Side Encryption:Protect your Photos & Videos Encrypt photos & videos before transfer to ensure safe storage on NAS and file-based cloud services Learn more Advanced Siri& Workflows Build powerful workflows using the Siri Shortcuts 'Transfer new photos' and 'Transfer from clipboard' Learn more Amazon S3, Backblaze& Wasabi Support Backup to Amazon S3, plus view & download photos on Amazon S3. + Backblaze & Wasabi cloud support! Learn more Camera Support(Wi-Fi & USB) Transfer and view photos & videos from Canon EOS, Nikon, Sony, Fujifilm, Olympus & Lumix cameras Learn more Download from Wi-Fi SD Cards Download full resolution photos, RAWs & videos directly from Toshiba FlashAir & Transcend Wi-Fi Cards Learn more SanDisk iXpand LoopUSB Flash Drives Backup to iXpand Loop USB Drives & free up space on your phone – a great companion when travelling! Learn more Transfer & backupto cloud / photo services Directly upload and download photos & videos via Wi-Fi & 3G/4G/5G to your favourite cloud & photo services: Dropbox, Google Photos, Google Drive, Amazon S3, Flickr, SmugMug, OneDrive, Box, Backblaze, Wasabi, Zenfolio, PhotoPrism, pCloud, InfiniCLOUD and SugarSync. Learn more Transfer and share pictures to cloud / photo services Upload and share photos & videos from your iPhone, iPad and Android devices to your favorite cloud / photo services over Wi-Fi & 3G/4G/5G. View and import photos & videos stored on your favorite cloud / photo service directly into the Camera Roll, Android Image Gallery or user-defined albums on your device. You can import selected, all or new photos & videos. Note: 3rd party services require a user account for the cloud / photo service + Internet connection. Amazon S3, Backblaze & Wasabi – Premium features (iOS only) InfiniCLOUD – on Android configure a WebDAV connection pCloud & SugarSync – available on iOS only MagentaCLOUD – configure a WebDAV connection rsync.net – configure a SFTP connection Supported cloud / photo services: Dropbox Google Drive Google Photos Amazon S3 Box SmugMug Flickr OneDrive Backblaze Wasabi Zenfolio pCloud PhotoPrism InfiniCLOUD SugarSync MagentaCLOUD rsync.net Direct transfer between services, devices & NAS Transfer photos & videos directly between targets without having to first import them into the iOS Photo Library / Android Photo Gallery. You can for instance, directly transfer from OneDrive to a NAS or from SMB to a USB device. Supported transfer combinations are basically endless! iPhone / iPad Android Windows PC1 Mac1 Linux1,2 Flickr SmugMug Box MagentaCLOUD5 InfiniCLOUD3 SMB FTP / SFTP WebDAV Files (USB / iCloud Drive) iXpand Loop USB Flash Drive7 Wasabi7 Backblaze7 Toshiba Canvio PhotoPrism3 Dropbox Google Drive OneDrive Amazon S37 Google Photos Zenfolio SugarSync4 pCloud4 rsync.net 6 1 No transfer between Mac, Windows PC & Linux 2 Support for Linux via an SFTP, FTP or SMB connection 3 InfiniCLOUD - configure a WebDAV connection (Android) 4 pCloud & SugarSync (iOS only) 5 MagentaCLOUD - configure a WebDAV connection 6 rsync.net - configure a SFTP connection 7 Exclusive Premium feature Client-Side Encryption:Protect Your Photos & Videos Premium Encrypt photos & videos before transfer to ensure safe storage on NAS and file-based cloud services (iOS only) Learn more Encrypt Photos & Videos Encrypt photos & videos before transfer and store them encrypted on NAS and file-based cloud services. Browse and view encrypted photos & videos directly in PhotoSync. Rclone and OpenSSL are supported, enabling easy workflow integration and seamless decryption on PC and Mac. Note: 3rd party services require a user account for the cloud / photo service + Internet connection Supported NAS & file-based cloud services: FTP SFTP WebDAV SMB Dropbox Google Drive Amazon S3 OneDrive Box Backblaze Wasabi pCloud InfiniCLOUD SugarSync MagentaCLOUD rsync.net MagentaCLOUD – configure a WebDAV connection rsync.net – configure a SFTP connection USB Drive Support - Backup Your Photos & Videos Transfer photos & videos to / from USB Drives leveraging the full functionality of PhotoSync including automatic folder creation and custom file names (iOS only) Move pictures between phones and tablets Directly send and receive photos & vi