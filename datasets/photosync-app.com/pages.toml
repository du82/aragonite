full_description = "News Read about our latest announcements and activities Featured All iOS (current) Android Windows macOS 2024-06-26 19:34 Update PhotoSync 4.9 for iOS released 2024-06-26 19:34 Update PhotoSync 4.9 for iOS released PhotoSync 4.9 introduces over 20 new features, including customizable shortcuts and an enhanced PhotoSync Camera exclusively for Premium users, as well as a favoriting system and improved viewer directly within PhotoSync. Read more 2023-11-08 15:15 Update PhotoSync 4.8 for iOS released PhotoSync 4.8 fully supports iOS 17 and introduces more than 50 new features including 'Client-Side Encryption' exclusively for Premium users. Read more 2022-07-27 15:31 Update PhotoSync 4.7 for iOS released PhotoSync 4.7 now fully supports TeraCLOUD as a transfer destination. It also includes additional metadata support, new custom formats and improved space usage for temporary files. Read more 2022-02-09 14:16 Update PhotoSync 4.6.5 for iOS released NEW PhotoSync now loads photo thumbnails for photos up to 15MB for NAS and cloud services. The file size limit can be increased in the Wi-Fi / Cellular settings of the transfer target. Embedded video thumbnails are also loaded. NEW Streaming video playback is now supported for many remote services (NAS services, many cloud services, iXpand Drives, USB drives). Read more 2021-09-13 14:00 Update PhotoSync 4.6 for iOS released PhotoSync 4.6 fully supports iOS 15 including a new Smart Album for RAW photos. It also includes metadata support, plus (optional) resizing of videos and support for Pro cameras that support FTP transfers (Premium only). Read more 2021-09-13 14:00 Press release touchbyte releases PhotoSync 4.6 for iOS PhotoSync 4.6 fully supports iOS 15 including a new Smart Album for RAW photos. It also includes metadata support, plus (optional) resizing of videos and support for Pro cameras that support FTP transfers (Premium only). Read more 2021-04-19 15:00 Update PhotoSync 4.5 for iOS released PhotoSync 4.5 now supports pCloud and PhotoPrism transfer targets plus two new exclusive features for Premium users. Read more 2020-09-21 16:00 Update PhotoSync 4.4 for iOS released PhotoSync 4.4 now fully supports iOS 14 features and introduces a new exclusive feature for Premium users. Read more Page 1 of 3 1 2 3 Next Last Twitter updates Follow us on"
