nion for Windows PC and Mac. The FREE PhotoSync Companion for Windows PC and Mac makes the photo and video transfer experience quick and easy. Just drag your photos and videos onto the PhotoSync icon to beam to your phone and tablet. On Mac computers the PhotoSync Companion enables direct import into the macOS Photos App. Get the FREE PhotoSync Companion for Windows PC & Mac Access by web browser (Windows, Mac, Linux) Wi-Fi access your photos & videos wherever you are – by opening a web browser (Windows, Mac, Linux)! View your photos on a big screen, download and upload selected photos & videos to your phone and tablet. A great feature when at friends! Web-sharing allows you to browse and view all your photos & videos from a web-browser without downloading or installing any software. Access to web-sharing can be protected with a login and password. Note: Support for Linux via an SFTP (FTP over SSH) connection. Backup photos to NAS Securely backup photos & videos to NAS devices, personal cloud and wireless portable hard drives over FTP, SMB, WebDAV and SFTP. PhotoSync works flawlessly with Synology, QNAP, Buffalo NAS, ownCloud, Nextcloud, WD MyCloud, TrueNAS, OpenMediaVault, Seagate Personal Cloud, Toshiba, SanDisk … Learn more Backup to NAS, mobile storage device or personal cloud NAS, remote server and personal cloud Securely backup photos & videos directly from your iPhone, iPad and Android devices to any NAS, remote server or personal cloud over (S)FTP, SMB or WebDAV. You can also download and view photos & videos on (S)FTP, SMB and WebDAV servers. PhotoSync works seamlessly with all major NAS storage devices, servers and personal cloud services: Synology QNAP Buffalo NAS ownCloud Nextcloud WD MyCloud Fritz!Box TrueNAS OpenMediaVault Seagate Personal Cloud NETGEAR ReadyNAS And many more … Wireless hard drives Quickly upload and download photos & videos whilst on-the-go to your wireless portable hard drives and sticks over (S)FTP, SMB and WebDAV. PhotoSync support