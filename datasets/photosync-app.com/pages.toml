["https://www.photosync-app.com/de/support/ios/answers/wie-kann-ich-automatisch-unterverzeichnisse-auf-dem-zielger%C3%A4t-dienst-erstellen.html"]
title = "Wie kann ich automatisch Unterverzeichnisse auf dem Zielgerät/-dienst erstellen? - PhotoSync"
description = "Wie kann ich automatisch Unterverzeichnisse auf dem Zielgerät/-dienst erstellen?"
full_description = '''Wie kann ich automatisch Unterverzeichnisse auf dem Zielgerät/-dienst erstellen? Nach erfolgreicher Konfiguration können Sie die übertragenen Fotos/Videos automatisch in vordefinierte Unterverzeichnisse auf dem Computer, in der Cloud oder in dateibasierten Diensten speichern. Sie können aus einer breiten Palette von vordefinierten geräte- und datumsbasierten Unterverzeichnisformaten wählen oder eigene Formate erstellen. Schritte Öffnen Sie die PhotoSync-Einstellungen, gehen Sie zu Konfigurieren, wählen Sie das Ziel (z. B. Computer) und öffnen Sie dann Unterverzeichnisse erstellen. (adsbygoogle = window.adsbygoogle || []).push({}); Gerätebasierte Formate Keine Es werden keine zusätzlichen Unterverzeichnisse erstellt. Ihre Fotos werden direkt in den Standardzielordner auf dem Ziel gespeichert. Gerätename + Albumname Standardoption für dateibasierte Dienste. Erstellt einen Unterordner mit dem Namen Ihres Geräts sowie einen Unterordner mit dem Namen des aktuellen Albums im Standardzielordner auf dem Ziel und legt die Übertragungen in diesen Ordnern ab. Ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonie's Telefon" und dem Album "Zuletzt" wird z. B. als "Leonie's Telefon/Zuletzt/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Gerätename + Ordnername (nur Android) Standardoption für dateibasierte Dienste. Erstellt einen Unterordner mit dem Namen Ihres Geräts sowie einen Unterordner mit dem Namen des aktuellen Ordners im Standardzielordner auf dem Ziel und legt die Übertragungen in diesen Ordnern ab. So wird z. B. ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät „Simon's Telefon" und dem Ordner "Kamera" als "Simon's Telefon/Kamera/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Gerätename Erstellt einen Unterordner mit dem Namen Ihres Geräts im Standard-Zielordner auf dem Ziel und legt die Übertragungen in diesem Ordner ab. Z.B. wird ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät 'Leonie's Telefon' und dem Album 'Zuletzt' als 'Leonie's Telefon/IMG_1234.JPG' im Zielordner auf dem Ziel gespeichert. Albumname Erstellt einen Unterordner mit dem Namen des aktuellen Albums im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesem Ordner ab. Z.B. wird ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät 'Leonie's Telefon' und dem Album 'Zuletzt' als 'Zuletzt/IMG_1234.JPG' im Zielordner auf dem Ziel gespeichert. Ordnername (nur Android) Erstellt einen Unterordner mit dem Namen des aktuellen Ordners im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesem Ordner ab. Ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Simon's Telefon" und dem Album "Camera" wird z. B. als "Camera/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Dateityp (Photos | Videos | RAW) Erstellt einen Unterordner mit dem Dateityp des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesem Ordner ab. Ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonie's Telefon" und dem Album "Zuletzt" wird z.B. als "fotos/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Ein Video mit dem Namen IMG_1234.MOV von Ihrem Gerät wird als "videos/IMG_1234.MOV" im Zielordner auf dem Ziel gespeichert. Dateiendung Erstellt einen Unterordner mit der Dateiendung des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesem Ordner ab. Ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonie's Telefon" und dem Album "Zuletzt" wird z.B. als "JPG/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Ein Video mit dem Namen IMG_1234.MOV von Ihrem Gerät wird als 'MOV/IMG_1234.MOV' im Zielordner auf dem Ziel gespeichert. Datum basierte Formate Aufnahmedatum (Jahr + Monat + Tag) Erstellt mehrere Unterordner mit dem Aufnahmejahr, dem Aufnahmemonat und dem Aufnahmetag des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesen Ordnern ab. Ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonie's Telefon" und dem Album "Zuletzt", das am 24.02.2021 aufgenommen wurde, wird z.B. als "2021/02/24/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Aufnahmedatum (Jahr + Monat) Erstellt mehrere Unterordner mit dem Aufnahmejahr und dem Aufnahmemonat des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesen Ordnern ab. Z.B. wird ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonies Telefon" und dem Album "Zuletzt", das am 24.02.2021 aufgenommen wurde, als "2021/02/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Aufnahmedatum (Monat + Tag) Erstellt mehrere Unterordner mit dem Aufnahmemonat und dem Aufnahmetag des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesen Ordnern ab. Z.B. ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonie's Telefon" und dem Album "Zuletzt", das am 24.02.2021 aufgenommen wurde, wird als "02/24/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Aufnahmedatum (Datum) Erstellt einen Unterordner mit dem Aufnahmedatum des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesem Ordner ab. Z.B. wird ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonies Telefon" und dem Album "Zuletzt", das am 24.02.2021 aufgenommen wurde, als "2021-02-24/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Übertragungsdatum (Jahr + Monat + Tag) Erstellt mehrere Unterordner mit dem Übertragungsjahr, dem Übertragungsmonat und dem Übertragungstag des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesen Ordnern ab. Ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonie's Telefon" und dem Album "Zuletzt", das am 24.02.2021 übertragen wurde, wird z.B. als "2021/02/24/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Übertragungsdatum (Jahr + Monat) Erstellt mehrere Unterordner mit dem Übertragungsjahr und dem Übertragungsmonat des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesen Ordnern ab. Z.B. wird ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonies Telefon" und dem Album "Zuletzt", das am 24.02.2021 übertragen wurde, als "2021/02/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Übertragungsdatum (Monat + Tag) Erstellt mehrere Unterordner mit dem Übertragungsmonat und dem Übertragungstag des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesen Ordnern ab. Z.B. wird ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonies Telefon" und dem Album "Zuletzt", das am 24.02.2021 übertragen wurde, als "02/24/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Übertragungsdatum (Datum) Erstellt einen Unterordner mit dem Übertragungsdatum des aktuellen Fotos oder Videos im Standard-Zielordner auf dem Zielgerät und legt die Übertragungen in diesem Ordner ab. Z.B. wird ein Foto mit dem Namen IMG_1234.JPG von Ihrem Gerät "Leonies Telefon" und dem Album "Zuletzt", das am 24.02.2021 übertragen wurde, als "2021-02-24/IMG_1234.JPG" im Zielordner auf dem Ziel gespeichert. Eigene Formate Eigene Formate Mit dieser Option können Sie Ihre eigenen benutzerdefinierten Unterordnerformate für Ihre Übertragungen definieren. Sie können aus einer Reihe von Platzhaltern wählen, die während der Übertragung durch die entsprechenden Werte ersetzt werden, und Ihre eigenen Textblöcke und Ordnertrennzeichen in den benutzerdefinierten Formaten verwenden. Hinweis: Die Eingabe eines falschen benutzerdefinierten Formats kann dazu führen, dass Ihre Übertragungen fehlschlagen, wenn das Format Ordnernamen erzeugt, die in Ihrem Zielort aufgrund illegaler oder problematischer Zeichen nicht zulässig sind.Sie können die folgenden Zeichen und Platzhalter in Ihren benutzerdefinierten Unterordnerdefinitionen verwenden: Datum/Zeit Aufnahmedatum Jahr (%YR) Jahr des Aufnahmedatums des aktuellen Fotos oder Videos im vierstelligen Format. Für ein Foto, das am 24.02.2021 aufgenommen wurde, wird dieser Platzhalter durch '2021' ersetzt. Jahr (%yR) Jahr des Aufnahmedatums des aktuellen Fotos oder Videos im zweistelligen Format. Für ein Foto, das am 24.02.2021 aufgenommen wurde, wird dieser Platzhalter durch '21' ersetzt. Quartal (%qR) Quartal des Aufnahmedatums des aktuellen Fotos oder Videos im Ziffernformat. Für ein Foto, das am 24.02.2021 aufgenommen wurde, wird dieser Platzhalter durch '1' ersetzt. Monat (%mR) Monat des Aufnahmedatums des aktuellen Fotos oder Videos im zweistelligen Format. Für ein Foto, das am 24.02.2021 aufgenommen wurde, wird dieser Platzhalter durch '02' ersetzt. Monat (%mmmmR) Monat des Aufnahmedatums des aktuellen Fotos oder Videos im abgekürzten Format. Für ein Foto, das am 24.02.2021 aufgenommen wurde, wird dieser Platzhalter durch 'Feb' ersetzt. Monat (%mmmmmR) Monat des Aufnahmedatums des aktuellen Fotos oder Videos im Format des vollständigen Namens. Für ein Foto, das am 24.02.2021 aufgenommen wurde, wird dieser Platzhalter durch "Februar" ersetzt. Tag (%dR) Tag des Aufnahmedatums des aktuellen Fotos oder Videos im zweistelligen Format. Für ein Foto, das am 24.02.2021 aufgenommen wurde, wird dieser Platzhalter durch '24' ersetzt. Tag - abgekürzt (%eeeR) Tag des Aufnahmedatums des aktuellen Fotos oder Videos im abgekürzten Namensformat. Für ein Foto, das am 24.02.2021 (Mittwoch) aufgenommen wurde, wird dieser Platzhalter durch 'Mi' ersetzt. Tag - vollständig (%eeeeR) Tag des Aufnahmedatums des aktuellen Fotos oder Videos im Format des vollständigen Namens. Für ein Foto, das am 24.02.2021 (Mittwoch) aufgenommen wurde, wird dieser Platzhalter durch 'Mittwoch' ersetzt. Stunde (%HR) Stunde des Aufnahmedatums des aktuellen Fotos oder Videos im zweistelligen Format. Für ein Foto, das am 24.02.2021 um 14:27:54 aufgenommen wurde, wird dieser Platzhalter durch '14' ersetzt. Minute (%MR) Minute des Aufnahmedatums des aktuellen Fotos oder Videos im zweistelligen Format. Für ein Foto, das am 24.02.2021 um 14:27:54 aufgenommen wurde, wird dieser Platzhalter durch '27' ersetzt. Sekunde (%SR) Sekunde des Aufnahmedatums des aktuellen Fotos oder Videos im zweistelligen Format. Für ein Foto, das am 24.02.2021 um 14:27:54 aufgenommen wurde, wird dieser Platzhalter durch '54' ersetzt. Millisekunde (%MSR)nur Android Millisekunden des Aufnahmedatums des aktuellen Fotos oder Videos im dreistelligen Format. Bei einem Foto, das am 24.02.2021 um 14:27:54.189 aufgenommen wurde, wird dieser Platzhalter durch '189' ersetzt. Übertragungsdatum Jahr (%YT) Jahr des Übertragungsdatums des aktuellen Fotos oder Videos im vierstelligen Format. Für ein Foto, das am 24.02.2021 übertragen wurde, wird dieser Platzhalter durch '2021' ersetzt. Jahr (%yT) Jahr des Übertragungsdatums des aktuellen Fotos oder Videos im zweistelligen Format. Für ein Foto, das am 24.02.2021 übertragen wurde, wird dieser Platzhalter durch '21' ersetzt. Quartal (%qR) Quartal des Übertragungsdatums des aktuellen Fotos oder Videos im Ziffernformat. Für ein Foto, das am 24.02.2021 übertragen wurde, wird dieser Platzhalter durch '1' ersetzt. Monat (%mT) Monat des Übertragungsdatums des aktuellen Fotos oder Videos im zweistelligen Format. Für ein Foto, das am 24.02.2021 übertragen wurde, wird dieser Platzhalter durch '02' ersetzt. Monat (%mmmmT) Monat des Übertragungsdatums des aktuellen Fotos oder Videos im abgekürzten Format. Für ein Foto, das am 24.02.2021 übertragen wurde, wird dieser Platzhalter durch 'Feb' ersetzt. Monat (%mmmmmR) Monat des Übertragungsdatums des aktuellen Fotos oder Videos im Format des vollständigen Namens. Für ein Foto, das am 24.02.2021 übertragen wurde, wird dieser Platzhalter durch "Februar" ersetzt. Tag (%dT) Tag des Übertragungsdatums des aktuellen Fotos oder Videos im zweistelligen Format. Für ein Foto, das am 24.02.2021 übertragen wurde, wird dieser Platzhalter durch '24' ersetzt. Tag - abgekürzt 