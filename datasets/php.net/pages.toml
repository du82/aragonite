full_description = '''Laravel Live Denmark is back! The conference is a two-day Laravel conference held in Copenhagen, Denmark on the 21 - 22. August 2025. Join us and 300 other Laravel and PHP enthusiasts from around the world got for two days of learning, 16 speakers and more within the Laravel community. The PHP Velho Oeste is a national-level conference that takes place annually in the West of Santa Catarina, Brazil, known as Velho Oeste(Old West). In this event, several relevant topics will be covered, from the latest language updates to best development practices. You will have the opportunity to expand your PHP knowledge and stay up to date with the latest market trends. PHPerKaigi is an event for PHPers, that is, those who are currently using PHP, those who have used PHP in the past, those who want to use PHP in the future, and those who love PHP, to share technical know-how and "#love" for PHP. The conference consists of talk sessions by public speakers. In addition to we have unconference, social gathering and so on for all of developers from all from Japan. Let's talk about PHP! We are thrilled to announce that the API Platform Conference will return on September 18th and 19th, 2025, both in Lille (France) and online. The API Platform Conference is a two-day event that highlights the latest trends, best practices, and case studies related to API Platform and its ecosystem, including PHP, Symfony, JavaScript, AI, FrankenPHP, performance, and tools. With nearly 30 talks delivered in both English and French, the conference is a must-attend for innovative companies, project leaders, and skilled developers. If you're a developer, CTO, or decision-maker specializing in these technologies, this event is tailored for you! The call for papers for the API Platform Conference 2025 is open until March 23. Final speakers will be announced starting May 14. Submit your pitch, and you could join us for this special anniversary edition: https://api-platform.com/con/2025/ Web Summer Camp is a unique 3-day international conference for web professionals, focused on providing intensive knowledge exchange and hands-on workshops. It is set in a relaxed summer environment, offering a full-day program with numerous opportunities for learning and sharing experiences with web designers, developers, founders, and other web aficionados. The program will be divided into six tracks, one being focused on PHP. Other tracks include Javascript, Python, UX, etc.'''
