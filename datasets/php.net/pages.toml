["https://php.net/archive/2009.php"]
title = "PHP: News Archive - 2009"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = '[17-Dec-2009] The PHP development team would like to announce the immediate availability of PHP 5.2.12. This release focuses on improving the stability of the PHP 5.2.x branch with over 60 bug fixes, some of which are security related. All users of PHP 5.2 are encouraged to upgrade to this release. Security Enhancements and Fixes in PHP 5.2.12: Fixed a safe_mode bypass in tempnam() identified by Grzegorz Stachowiak. (CVE-2009-3557, Rasmus) Fixed a open_basedir bypass in posix_mkfifo() identified by Grzegorz Stachowiak. (CVE-2009-3558, Rasmus) Added "max_file_uploads" INI directive, which can be set to limit the number of file uploads per-request to 20 by default, to prevent possible DOS via temporary file exhaustion, identified by Bogdan Calin. (CVE-2009-4017, Ilia) Added protection for $_SESSION from interrupt corruption and improved "session.save_path" check, identified by Stefan Esser. (CVE-2009-4143, Stas) Fixed bug #49785 (insufficient input string validation of htmlspecialchars()). (CVE-2009-4142, Moriyoshi, hello at iwamot dot com) Further details about the PHP 5.2.12 release can be found in the release announcement, and the full list of changes are available in the ChangeLog. [09-Dec-2009] PHP London are pleased to announce the date, venue and registration availability of their 5th annual UK PHP conference, building on the success of previous events and accommodating the continual growth of the PHP community and PHP development industry. The event takes place on Friday 26th February 2010 at the Business Design Centre in the Islington area of London. Information on the venue is available on our website. Registration is now available, with an early bird discount of £20 putting the price at £100 (ex. UK VAT), available for the rest of December 2009, increasing to £110 during January 2010, whilst the standard £120 price is available now (for those that wish to significantly contribute towards the running of the conference) until either the event takes place or we run out of places - so register as soon as you can to get the best price and secure your place. Feel free to create an account on the PHP UK Conference website at and sign-up for notifications of updates to the website. Important announcements will also be made to the PHP London announcement mailing list - sign up at http://lists.phplondon.org/cgi-bin/mailman/listinfo/phplondon-announce - via which you may be receiving this message now, and you can also follow the conference on Twitter (@phpukconference - #phpuk2010) and be a fan on Facebook. We expect to announce the initial line up of talks and speakers before Christmas, whilst potential sponsors/exhibitors can find information at http://www.phpconference.co.uk/sponsors and contact the conference committee using the form at http://www.phpconference.co.uk/contact. We hope to see you at the event in 2010!'
