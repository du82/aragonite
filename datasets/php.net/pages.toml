description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "PHP South Coast 2015 29 Dec 2014 We’re pleased to announce our first conference, PHP South Coast 2015! Taking place on the south coast of England in Summer 2015, where community members from around the world will come together to learn and share information about the latest trends and technologies in professional PHP development. Bulgaria Web Summit 2015 29 Dec 2014 Bulgaria Web Summit 2015 is an event about (almost) everything a modern web person should know: {Programming, IoT, UX, UI, Fun, Privacy}. This year we will have strong PHP presense to support the growth of Bulgarian PHP community. The event will take place on the 18th of April at the conference area of the Inter Expo Centre. The purpose of this meeting is to discuss the new tendencies in this direction and to popularize the internet technologies in the spheres of business, education, and services. The range of subjects includes technologies like PHP, JavaScript, CSS, Privacy and others. Join us and have fun while learning something new. Twitter: @bgwebsummit PHP 5.4.36 Released 18 Dec 2014 The PHP development team announces the immediate availability of PHP 5.4.36. Two security-related bugs were fixed in this release, including the fix for CVE-2014-8142. All PHP 5.4 users are encouraged to upgrade to this version. For source downloads of PHP 5.4.36 please visit our downloads page, Windows binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. PHP 5.6.4 is available 18 Dec 2014 The PHP development team announces the immediate availability of PHP 5.6.4. This release fixes several bugs and one CVE related to unserialization. All PHP 5.6 users are encouraged to upgrade to this version. For source downloads of PHP 5.6.4 please visit our downloads page, Windows binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. PHP 5.5.20 is available 18 Dec 2014 The PHP development team announces the immediate availability of PHP 5.5.20. This release fixes several bugs and one CVE related to unserialization. All PHP 5.5 users are encouraged to upgrade to this version. For source downloads of PHP 5.5.20 please visit our downloads page, Windows binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog."
