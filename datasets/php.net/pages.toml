title = "PHP: News Archive - 2015"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "PHP 7.0.1 Released 17 Dec 2015 The PHP development team announces the immediate availability of PHP 7.0.1. Several bugs have been fixed. All PHP 7.0 users are encouraged to upgrade to this version. For source downloads of PHP 7.0.1 please visit our downloads page, Windows source and binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. php[tek] 2016 Call for Speakers 16 Dec 2015 The team at php[architect] is excited to annouce that the Call for Speakers is open for php[tek] 2016. This 11th annual conference that is focused on community is this year moving to a bigger venue in Saint Louis so that we can expand and give our attendees some elbow room! We have a number of other updates that will be announced in the coming months as well. But right now, we want to hear from you! We want to hear what talk ideas you have. Without our speakers, there would be no conference. We offer a very comprehensive speakers package, including: Airfare coverage (up to $400 domestic, $1000 international) Hotel Room (1 night + 1 per accepted talk) Free ticket to the conference, including Tutorial Day Don't hesitate! Our Call for Speakers closes on January 16th, 2016. So you only have a few weeks to get those submissions in. We look forward to hearing from you! PHP 7.0.0 Released 03 Dec 2015 The PHP development team announces the immediate availability of PHP 7.0.0. This release marks the start of the new major PHP 7 series. PHP 7.0.0 comes with a new version of the Zend Engine, numerous improvements and new features such as Improved performance: PHP 7 is up to twice as fast as PHP 5.6 Significantly reduced memory usage Abstract Syntax Tree Consistent 64-bit support Improved Exception hierarchy Many fatal errors converted to Exceptions Secure random number generator Removed old and unsupported SAPIs and extensions The null coalescing operator (??) Return and Scalar Type Declarations Anonymous Classes Zero cost asserts For source downloads of PHP 7.0.0 please visit our downloads page, Windows binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. The migration guide is available in the PHP Manual. Please consult it for the detailed list of new features and backward incompatible changes. The inconvenience of the release lateness in several time zones is caused by the need to ensure the compatibility with the latest OpenSSL 1.0.2e release. Thanks for the patience! It is not just a next major PHP version being released today. The release being introduced is an outcome of the almost two years development journey. It is a very special accomplishment of the core team. And, it is a result of incredible efforts of many active community members. Indeed, it is not just a final release being brought out today, it is the rise of a new PHP generation with an enormous potential. Congratulations everyone to this spectacular day for the PHP world! Grateful thanks to all the contributors and supporters!"
