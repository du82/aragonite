full_description = '''[28-Nov-2005] The PHP Development Team would like to announce the immediate release of PHP 5.1.1. This is a regression correction release aimed at addressing several issues introduced by PHP 5.1.0, the core changes as follows: [24-Nov-2005] The PHP development team is proud to announce the release of PHP 5.1.0. Some of the key features of PHP 5.1.0 include: [31-Oct-2005] PHP 4.4.1 is now available for download. This version is a maintenance release, that contains numerous bug fixes, including a number of security fixes related to the overwriting of the GLOBALS array. All users of PHP 4.3 and 4.4 are encouraged to upgrade to this version. [05-Oct-2005] The French AFUP association is proud to announce the fourth annual PHP meeting in Paris, on November 9th and 10th, 2005. Developers and managers will gather to meet Rasmus Lerdorf, Wez Furlong and other prominent community experts for two days of sessions, packed with enterprise solutions and advanced techniques (in French). [20-Sep-2005] The final program for the Zend / PHP Conference (October 18-21, 2005 in San Francisco) is now available. The conference theme is "Power Your Business With PHP" and features keynote addresses from Marc Andreessen, Google VP Adam Bosworth, and executives from IBM, Oracle & Intel. Featured speakers include Michael Radwin of Yahoo!, Adam Trachtenberg of eBay, Joyce Park of Renkoo.com, George Schlossnagle & Wez Furlong of OmniTI, and, of course, Zeev Suraski & Andi Gutmans. In addition to keynotes and sessions, the conference also features tutorials, certification, a party continuing the celebration of the 10th Anniversary of PHP, and an exhibit hall including companies like Zend, IBM, Oracle, Intel, MySQL, Microsoft, eBay/PayPal, Emic Networks, ActiveGrid, ActiveState and SpikeSource. Registration discounts are still available. [08-Sep-2005] php|architect has announced the publication of php|architect's Pocket PHP Reference, a handy guide to every function in PHP, inclusive of syntax, extension and description. It's a perfect companion for all your coding work, perfect for looking up function syntax in a pinch, and its convenient pocket size (5x8") makes it unobtrusive and easy to transport.'''
