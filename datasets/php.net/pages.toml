["https://php.net/archive/1998.php"]
title = "PHP: News Archive - 1998"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = '[24-Dec-1998] Merry Christmas! 3.0.6 is ready to go. This is mostly a maintenance release. Some new modules make their first apperance in this version. Support for Adobe PDF and FDF as well as XML and an initial Interbase module are now available. If you need any of these features, or if you see something in the ChangeLog that might apply to you, then upgrade. [22-Jun-1998] "The substance of the Web is more and more residing in databases, and there are a variety of methods used to generate Web pages. This year, we selected a pair of "free software" tools that work together quite nicely as a platform for building dynamic content. The award is also a tribute to the Open Source initiative; both products are used, developed and supported by interlocking communities of people on the Net." [06-Jun-1998] PHP 3.0 is finally here! After 10 months of development PHP Version 3.0 is ready for production environments. Coupled with the release of the final version of Apache-1.3.0 today, the combination provides an unbeatable web hosting platform suitable for both small and large web sites. PHP 3.0 is the latest evolution of the PHP/FI 2.0 language and it offers some dramatic enhancements. It is more than twice as fast, it uses less memory, it has a more consistent language implementation and a much wider set of expressions and language features than PHP/FI 2.0. An included conversion program will help you migrate your PHP 2 scripts to PHP 3. [18-Apr-1998] PHP: Hypertext Preprocessor was chosen as the official meaning of the PHP acronym with 53% of the votes. The possible options were PHP HTML|Hypermedia|Hypertext Preprocesor. [23-Mar-1998] The PHP site has been given a serious facelift recently. The design is courtesy of Colin Viebrock at Private World Communications. Please let us know of any problems with the site by sending a message to the webmasters.'
