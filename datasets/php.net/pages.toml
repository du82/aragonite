full_description = "SunshinePHP 2019 15 Dec 2018 In February 2019 come to Miami, Florida and escape the cold to learn more about PHP and speak with other developers, like you, to see what others are doing. The SunshinePHP 2019 speaker list has been announced, and we've assembled a great line-up with the most current PHP related topics for you. Topics include: API Development Middleware Security Blockchain DevOps Progressive Web Apps (PWA) Continuous Delivery Databases Javascript PHP Core Unit Testing UI/UX Async PHP Scalability Team Development Come celebrate our 7th year from February 7th to 9th, 2019 in sunny Miami, Florida. There will be a full tutorial day featuring 3-hour sessions followed by 2 days of 1-hour talks and inspirational keynotes. Register now! SunshinePHP.com PHPKonf Istanbul PHP Conference 2019 - Call for Papers 10 Dec 2018 PHPKonf 2019 is an annual PHP oriented conference in Istanbul, Turkey and will take place on Saturday, 4th of May, 2019. The call for papers for the PHPKonf 2019 Istanbul PHP conference is open! If you have a burning desire to hold forth about PHP, DevOps, databases, JavaScript, or any other web development topics, we want to see your proposals. Call for Papers is open only from December 10, 2018 to January 31, 2019, so hurry. An added benefit: we will cover your travel and hotel. You’ll have 45 minutes for the talk, with 35 minutes for your topic and 10 minutes for Q&A. We can’t wait to see your proposals! Check out the last conference to get an idea of what to expect. Follow us on Twitter to stay updated with news from the PHPKonf crew. PHP 7.0.33 Released 06 Dec 2018 The PHP development team announces the immediate availability of PHP 7.0.33. Five security-related issues were fixed in this release. All PHP 7.0 users are encouraged to upgrade to this version. For source downloads of PHP 7.0.33 please visit our downloads page, Windows source and binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. Please note that according to the PHP version support timelines, PHP 7.0.33 is the last scheduled release of PHP 7.0 branch. There may be additional release if we discover important security issues that warrant it, otherwise this release will be the final one in the PHP 7.0 branch. If your PHP installation is based on PHP 7.0, it may be a good time to start making the plans for the upgrade to PHP 7.1, PHP 7.2 or PHP 7.3."
