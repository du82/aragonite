["https://php.net/mailing-lists.php"]
title = "PHP: Mailing Lists"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "There are many PHP-related mailing lists available on our server. Most of them are archived, and all of them are available as newsgroups on our news server. You can search some mailing lists right from this website from the search page or by using the search input box selecting the appropriate option on the top-right of every page. There is an experimental web interface for the news server at http://news.php.net/, and there are also other archives provided by Marc. You will be sent a confirmation mail at the address you wish to be subscribed or unsubscribed, and only added to the list after following the directions in that mail. Warning: The PHP users mailing list gets close to 1500-2000 messages per month currently. Do the math. That translates to about 60 messages per day. If your mailbox can't handle this sort of traffic you might want to consider subscribing to the digest list instead (two messages per day), using the news server, or reading the mailing list using the archives. If you experience trouble subscribing via the form above, you may also subscribe by sending an email to the list server. To subscribe to any mailing list, send an email to listname+subscribe@lists.php.net (substituting the name of the list for listname — for example, php-general+subscribe@lists.php.net). All of the mailing lists hosted at lists.php.net are managed using the mlmmj mailing list software. There are a variety of commands you can use to modify your subscription. For a full overview, send a message to php-whatever+help@lists.php.net (as in, php-general+help@lists.php.net)."
