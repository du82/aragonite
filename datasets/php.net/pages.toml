r 21 - 23, 2025 PHPerKaigi is an event for PHPers, that is, those who are currently using PHP, those who have used PHP in the past, those who want to use PHP in the future, and those who love PHP, to share technical know-how and "#love" for PHP. The conference consists of talk sessions by public speakers. In addition to we have unconference, social gathering and so on for all of developers from all from Japan. Let's talk about PHP! Follow us on X (Formerly Twitter) @phperkaigi, #phperkaigi. https://phperkaigi.jp/2025/ Note: *Kaigi* means meeting in Japanese.'''
