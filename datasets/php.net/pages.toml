full_description = '''[27-Nov-2006] The PHP Conference Brasil is the first Brazilian conference related exclusively to the PHP language in Sao Paulo, on December 1st and 2nd, 2006. It will be a great opportunity to establish a sustainable Brazilian PHP community and to exchange ideas among our professionals. More info is available at the Brazilian PHP Conference Web site. [02-Nov-2006] The PHP development team is proud to announce the immediate release of PHP 5.2.0. This release is a major improvement in the 5.X series, which includes a large number of new features, bug fixes and security enhancements. Further details about this release can be found in the release announcement 5.2.0, the full list of changes is available in the ChangeLog PHP 5. All users of PHP, especially those using earlier PHP 5 releases are advised to upgrade to this release as soon as possible. This release also obsoletes the 5.1 branch of PHP. For users upgrading from PHP 5.0 and PHP 5.1 there is an upgrading guide available here, detailing the changes between those releases and PHP 5.2.0. [04-Oct-2006] The French AFUP association is proud to announce the fifth annual PHP meeting in Paris, on November 9th and 10th, 2006. Developers and managers will gather to meet Rasmus Lerdorf, Andrei Zmievski and other prominent community experts for two days of sessions, packed with enterprise solutions and advanced techniques (in French). [10-Sep-2006] Software & Support media is pleased to announce the International PHP Conference 2006. It will happen from Nov. 05 to Nov. 08, 2006 at Frankfurt/Main. This year's sessions include topics on Security, PHP Internals, PHP & Business and Webservice topics. The Call for Papers has been closed and the programme is now online. On Nov. 05 and Nov. 06 there will be 6-hour PowerWorkshops that deliver hands-on PHP knowledge. A Management Day, dedicated to Managers who want to get informed about the usage of PHP, contains several sessions about the usage of PHP in large companies. The "PHP Code Camp @ Nite" with PHP Core Devs Marcus Börger and Sara Golemon. They go through from PHP basics to PHP OOP and implementing your own PHP extension. Delicious pizza and beer will do the rest. Registration is now open.'''
