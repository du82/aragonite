full_description = 'Dutch PHP Conference 2022 - Call for Papers 21 Dec 2021 We are back for the 16th edition of the Dutch PHP Conference! The 2022 in-person edition features 2 conference days on July 1 & 2, 2022 at RAI Amsterdam. The Call for Papers of Dutch PHP Conference 2022 is now open! You can submit your papers up to and including January 30th and as many proposals as you like, so please start submitting! Check out cfp.phpconference.nl for content briefing and more info. PHP 8.1.1 Released! 17 Dec 2021 The PHP development team announces the immediate availability of PHP 8.1.1. This is a bug fix release. All PHP 8.1 users are encouraged to upgrade to this version. For source downloads of PHP 8.1.1 please visit our downloads page, Windows source and binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. PHP 8.0.14 Released! 16 Dec 2021 The PHP development team announces the immediate availability of PHP 8.0.14. This is a bug fix release. All PHP 8.0 users are encouraged to upgrade to this version. For source downloads of PHP 8.0.14 please visit our downloads page, Windows source and binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. PHP 7.4.27 Released! 16 Dec 2021 The PHP development team announces the immediate availability of PHP 7.4.27. This is a bug fix release. All PHP 7.4 users are encouraged to upgrade to this version. For source downloads of PHP 7.4.27 please visit our downloads page, Windows source and binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. The Online PHP Conference 2022 13 Dec 2021 The Online PHP Conference 2022 takes place January 17-21, 2022. This time we interpret the term "conference" literally: over the course of a week, we dedicate each morning to a topic that we will discuss together with invited experts in an interactive discussion. The topics are Remote Teams, Data Privacy and Data Security, Supply Chain Management, Cloud and Operations, and Green IT. The discussions will be held in German. https://2022.phpconference.online/'
