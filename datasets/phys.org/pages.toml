["https://phys.org/news/2025-02-amoc-collapse-century-climate-pressures.html"]
title = "AMOC unlikely to collapse this century despite climate change pressures, model suggests"
description = "Research taps into sugary secrets of plant nectar to bite back against mosquito-spread disease                                                                                                                                                                                                                                                                                                        13 hours ago"
full_description = '''March 1, 2025 The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked peer-reviewed publication trusted source proofread AMOC unlikely to collapse this century despite climate change pressures, model suggests by Alex Morrison, University of Exeter Schematic and analysis method for AMOC upwelling pathways. Credit: Nature (2025). DOI: 10.1038/s41586-024-08544-0 The Atlantic Meridional Overturning Circulation (AMOC)—a major transporter of heat to the north Atlantic and northwestern Europe—is unlikely to collapse this century, according to new research. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); The paper, published in the journal Nature, was led by a team of scientists from the Met Office and the University of Exeter. Dr. Jonathan Baker is a scientist at the Met Office and the paper's lead author. He said, "The AMOC has a crucial role in regulating our climate; without it, northwest Europe's temperatures would be much cooler. "Our modeling study suggests that the AMOC will resist pressures from rising global temperatures and inputs of freshwater into the North Atlantic, with the weakened system being largely driven by winds over the Southern Ocean. "Although our study shows that collapse over the next 75 years is unlikely, the AMOC is very likely to weaken, which will present climate challenges for Europe and beyond." Professor Andrew Watson, from the University of Exeter, added, "What we are finding is that, so long as the winds blow around the Southern Ocean, water is drawn up from the deep ocean there. "That water has to be balanced by sinking water somewhere, and that somewhere tends to be the North Atlantic. So the AMOC is not only controlled by the local conditions, but also what's happening at the other end of the Earth." Professor Rowan Sutton, Director of the Met Office Hadley Center, said, "This study brings important new insights into the future of the AMOC. "It shows that aspects of the AMOC may be more robust to a changing climate than some previous research has suggested. (adsbygoogle = window.adsbygoogle || []).push({}); "However, it doesn't change our expectation that the AMOC will weaken over the 21st century, and that this weakening will have important impacts on climate." This new research supports findings from the most recent IPCC assessment, which states with medium confidence that AMOC will not collapse abruptly this century. Further research on AMOC weakening is urgently needed to gain a full understanding of the system and improve predictions. Professor Geoff Vallis, from the University of Exeter, said, "Our theoretical understanding, coupled with the use of state-of-the-art models, indicate that an imminent collapse of the AMOC is unlikely. "However, this does not in any way mean that global warming is not a severe problem for society, and our planet. "I think it very unlikely that my house will burn down in the coming years; however, I still buy insurance to guard against that risk." Under extreme climate change scenarios, the authors discovered the emergence of a Pacific Meridional Overturning Circulation (PMOC), which sinks in the Pacific Ocean, in most simulations. Dr. Baker added, "However, this is not strong enough to balance all of the Southern Ocean wind-driven upwelling. Therefore, some level of sinking in the North Atlantic must be maintained, preventing a complete collapse of the AMOC." More information: Jonathan Baker, Continued Atlantic overturning circulation even under climate extremes, Nature (2025). DOI: 10.1038/s41586-024-08544-0. www.nature.com/articles/s41586-024-08544-0 Journal information: Nature Provided by University of Exeter Citation: AMOC unlikely to collapse this century despite climate change pressures, model suggests (2025, March 1) retrieved 2 March 2025 from https://phys.org/news/2025-02-amoc-collapse-century-climate-pressures.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only.'''
