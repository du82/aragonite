full_description = '''February 28, 2025 The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked peer-reviewed publication trusted source proofread First on-chip multipartite entanglement achieved with optical microcomb by Peking University Fig. 1: An integrated silicon nitride microcomb and setup for the generation, characterization and detection of continuous-variable multi-qumode entanglement. Credit: Nature (2025). DOI: 10.1038/s41586-025-08602-1 A recent study has realized multipartite entanglement on an optical chip for the first time, constituting a significant advance for scalable quantum information. The paper, titled "Continuous-variable multipartite entanglement in an integrated microcomb," is published in Nature. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); Led by Professor Wang Jianwei and Professor Gong Qihuang from the School of Physics at Peking University, in collaboration with Professor Su Xiaolong's research team from Shanxi University, the research has implications for quantum computation, networking and metrology. Continuous-variable integrated quantum photonic chips have been confined to the encoding of and entanglement between two qumodes, a bottleneck withholding the generation or verification of multimode entanglement on chips. Additionally, past research on cluster states failed to go beyond discrete viable, leaving a gap in the generation and detection of continuous-variable entanglement on photonic chips. This study marks an unprecedented deterministic generation, manipulation and detection of continuous-variable multipartite entanglement on an integrated-optical quantum chip. Among the key findings is on-chip deterministic generation of continuous-variable multipartite entanglement in an integrated optical microcomb: polychromatic pump and polychromatic homodyne detection technologies (see Fig. 1c) produce multimode squeezed-vacuum optical frequency combs below the threshold of parametric oscillation, demonstrating the chip-scale deterministic generation of continuous-variable multipartite entanglement. Fig. 2: Experimental measurements of nullifiers and violations of the van Loock–Furusawa inequalities. Credit: Nature (2025). DOI: 10.1038/s41586-025-08602-1 Fig. 3: Full characterizations of nullifier correlations for various multipartite entanglement. Credit: Nature (2025). DOI: 10.1038/s41586-025-08602-1 In addition, the team completed the characterization and reconfiguration of multipartite entanglement with different cluster-type structures. Tailoring the local oscillator beams made it possible to generate various cluster-type entanglement structures, including the four-qumode linear-, box- and star- entanglement structures, and the six-qumode linear-type entanglement structure. (adsbygoogle = window.adsbygoogle || []).push({}); The continuous-variable cluster-style entanglement structure was also experimentally verified. Through precisely tailoring the intensity and detuning of polychromatic pumps, combined with linearly operating the polychromatic local oscillators, the off-diagonal nullifier correlations of different entanglement structures were sufficiently lowered. The research demonstrated the chip-scale deterministic generation of continuous-variable multipartite entanglement, as well as the accurate measurement of various entanglement structures. The continuous-variable integrated quantum photonics (CVIQP) technologies reported in this study provide a solution to the scalability challenges in terms of integrated quantum photonics chips, enabling the generation and manipulation of large-scale entanglement. Meanwhile, the results represent a remarkable leap in chip-scale quantum sensing, networking, and computing. More information: Xinyu Jia et al, Continuous-variable multipartite entanglement in an integrated microcomb, Nature (2025). DOI: 10.1038/s41586-025-08602-1 Journal information: Nature Provided by Peking University Citation: First on-chip multipartite entanglement achieved with optical microcomb (2025, February 28) retrieved 2 March 2025 from https://phys.org/news/2025-02-chip-multipartite-entanglement-optical-microcomb.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only.'''
