["https://phys.org/news/2025-02-ai-triggers-plagiarism-university-students.html"]
title = "Study challenges claim that AI use directly triggers plagiarism among university students"
description = "Research taps into sugary secrets of plant nectar to bite back against mosquito-spread disease                                                                                                                                                                                                                                                                                                        13 hours ago"
full_description = '''February 28, 2025 The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked trusted source proofread Study challenges claim that AI use directly triggers plagiarism among university students by University of the Basque Country Credit: Airam Dato-on from Pexels A recent study published by the journal Interactive Learning Environments analyzes the relationship between the frequency of ChatGPT use for academic purposes and plagiarism among university students. The research by a UPV/EHU group concluded that, despite a correlation existing between the frequency of use of this tool and plagiarism, the causality between the two variables is virtually non-existent. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); The study involving 507 UPV/EHU students also explored whether this relationship was influenced by variables linked to the students, such as their academic achievement, their workload, their levels of hypercompetitiveness, their lack of motivation, their degree of immersion in the culture of cheating or their degree of ignorance of the consequences of plagiarism. "The results revealed that factors such as a lack of motivation and being immersed in the culture of cheating (for example, being surrounded by people who tend to plagiarize) exert a much greater impact on the likelihood of a student committing plagiarism than the frequency of use of tools such as ChatGPT," said the authors of the study. These three variables—frequency of ChatGPT use, lack of motivation with respect to studies, and degree of immersion in the culture of cheating—were able to account for almost 30% of dishonest behavior, such as plagiarism, among university students. The UPV/EHU researchers said that these findings challenge the widely held perception in the educational and social spheres that the use of artificial intelligence directly triggers plagiarism. "The problem is not the technology in itself, but how it is used and the academic context in which it is employed," the authors of the study pointed out. So the study suggests that promoting academic integrity and student motivation could be a more effective strategy for reducing plagiarism than simply banning artificial intelligence-based tools. The researchers stressed the importance of universities establishing clear policies on the use of tools such as ChatGPT and reinforcing pedagogical strategies that encourage active participation and critical thinking. What is more, they stressed the need to design tasks that promote ethical and original learning, instead of relying exclusively on punitive measures. The study provides a novel perspective on the impact of artificial intelligence on higher education and raises challenges and opportunities for teachers and academic administrators. More information: Héctor Galindo-Domínguez et al, Relationship between the use of ChatGPT for academic purposes and plagiarism: the influence of student-related variables on cheating behavior, Interactive Learning Environments (2025). DOI: 10.1080/10494820.2025.2457351 Provided by University of the Basque Country Citation: Study challenges claim that AI use directly triggers plagiarism among university students (2025, February 28) retrieved 2 March 2025 from https://phys.org/news/2025-02-ai-triggers-plagiarism-university-students.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only.'''
