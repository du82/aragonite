["https://phys.org/news/2025-02-england-wild-beaver-milestone-uk.html"]
title = "England allows wild beaver releases in 'milestone' for UK nature"
description = "Research taps into sugary secrets of plant nectar to bite back against mosquito-spread disease                                                                                                                                                                                                                                                                                                        13 hours ago"
full_description = '''February 28, 2025 The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked reputable news agency proofread England allows wild beaver releases in 'milestone' for UK nature Beavers create dams and pools that boost wildlife while also fending off floods and droughts. Beavers will soon be released into waterways in England under a new scheme launched on Friday, signaling a return to the wild for an animal once hunted to extinction. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); It's a win for wildlife campaigners seeking to restore England's depleted countryside—and a triumphant turnaround for the dam-building rodents, which until recently had been absent for hundreds of years. The UK's environment department said Eurasian beaver releases would be carefully managed and the first are expected to be set free in southwest England soon. Beavers went extinct in Britain in the 16th century when they were sought after for their fur, meat and special sacs, which produce a leathery scent prized by perfume makers. Small populations have been reintroduced in enclosures in recent years as part of a wider "rewilding" drive, and following escapes and illegal releases around 500 are already thought to be living in the wild in England. Biologists consider beavers a "keystone species" because they reshape their environment with dams and pools that benefit other wildlife, as well as fending off floods and droughts. But their reintroduction has been a sticky topic in Britain, where farmers are worried about the animals' impact on their land. The head of the National Farmers' Union, Tom Bradshaw, has argued landowners need the right to use "lethal control" if the beavers "end up in the wrong place". The UK's environment department said Eurasian beaver releases would be carefully managed. File picture. Restoring the natural world The new scheme specifies that "as a last resort, beavers may be trapped and translocated or lethally controlled". Each project would need to supply a 10-year plan to support the animals' return to the wild, while the government has also promised help for farmers who make space for beavers on their land. (adsbygoogle = window.adsbygoogle || []).push({}); The UK is one of the world's most nature-depleted countries and has lost almost half of its natural species in recent decades, according to a 2021 parliamentary report. Nature minister Mary Creagh said, "Reintroducing beavers to the wild is a critical milestone for this government's plan to protect and restore our natural world." Roisin Campbell-Palmer of the Beaver Trust, a charity that backs the animal's reintroduction, said it was a "landmark moment" and called for widespread license granting. But she said England was "generations behind the rest of Europe", where schemes have helped beavers reestablish themselves in countries including Belgium, France, Germany, Spain and Switzerland. The protected Purbeck Heaths landscape in Dorset is tipped to be the site for the first English release but no date has yet been given. © 2025 AFP Citation: England allows wild beaver releases in 'milestone' for UK nature (2025, February 28) retrieved 2 March 2025 from https://phys.org/news/2025-02-england-wild-beaver-milestone-uk.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only.'''
