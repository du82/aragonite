full_description = '''March 1, 2025 The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked reputable news agency proofread Cyclone death toll rises to four on ravaged French island by Mahdia BENHAMLA Cyclone Garance barrelled across La Reunion island killing three people as fierce winds left destruction across the French Indian Ocean territory. French authorities said Saturday that at least four people died in Cyclone Garance's devastating crossing of the Indian Ocean island of La Reunion. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); The body of a man was found trapped under one of thousands of trees ripped up by winds of up to 230 kilometers (143 miles) per hour that tore across the island of some 900,000 people on Friday, authorities said giving the new toll. The other victims, two women and a man, were carried away by flash floods, trapped in a mudslide or killed by an electrical fire sparked by the storm, according to the prefecture. More than 180,000 people were left without electricity and more than 170,000 without water, authorities said. The island's international airport was to reopen late Saturday. The nearby tourist island of Mauritius shut its main airport on Wednesday, while Reunion shut down to flights on Thursday. About 200 firefighters and civil aid workers were to be sent from Mayotte—a French territory nearly 1,500 kilometers away—and mainland France, the government said. Troops have also been put on standby. Residents posted pictures online of uprooted trees, torn-off roofs and flooded homes. Entire streets were inundated and cars washed away. Patrice Latron, the central government representative on the island, said "a lot of work" would be needed with many roads blocked by fallen trees. "Roads are flooded, roads are cut off and some washed away. Bridges have come down," he added. Latron said Garance was fiercer than cyclone Belal that killed four people on Reunion in January 2024. © 2025 AFP Citation: Cyclone death toll rises to four on ravaged French island (2025, March 1) retrieved 2 March 2025 from https://phys.org/news/2025-03-cyclone-death-toll-ravaged-french.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only.'''
