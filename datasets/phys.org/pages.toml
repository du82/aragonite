["https://phys.org/news/2025-02-atomically-thin-nbse-resilient-superconducting.html"]
title = "Atomically thin NbSe₂ demonstrates resilient superconducting fluctuations"
description = "Research taps into sugary secrets of plant nectar to bite back against mosquito-spread disease                                                                                                                                                                                                                                                                                                        13 hours ago"
full_description = '''February 28, 2025 feature The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked peer-reviewed publication trusted source proofread Atomically thin NbSe₂ demonstrates resilient superconducting fluctuations by Ingrid Fadelli , Phys.org (a) Superconducting Higgs mode in bulk and bilayer NbSe₂. (b) Magnetic field dependence of the Higgs mode amplitude, measured alongside longitudinal and Hall resistance. Credit: X. Xi et al Superconductivity is an intriguing property observed in some materials, which entails the ability to conduct electric current combined with an electrical resistance of zero at low temperatures. Physicists have observed this property in various solid materials with different characteristics and atomic thicknesses. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); A team of researchers at Nanjing University in China recently carried out a study aimed at further exploring the behavior of niobium diselenide (NbSe₂), a layered material that has been found to be a superconductor when it is atomically thin. Their paper, published in Physical Review Letters, unveils resilient superconducting fluctuations in atomically thin NbSe₂, which could play a part in the anomalous metallic state previously observed in this material. "Our study was inspired by a long-standing puzzle in condensed matter physics, which can be summarized by the question: can metals truly exist in two dimensions as the ground state?" Xiaoxiang Xi, senior author of the paper, told Phys.org. "While we understand the behavior of everyday metals and insulators, ultrathin materials—like sheets just one atom thick—challenge these conventional rules." Previous studies observed a physical state known as the "anomalous metallic state" in some atomically thin materials, including in NbSe₂ when a small magnetic field disrupts its superconducting state. When in this state, the material exhibits metal-like behavior, along with unusual properties that are not quite aligned with the conventional behavior of metals. "Over the years, various theories have been proposed, but the exact mechanism behind this state remains unclear," said Xi. "Our study was aimed at revisiting this phenomenon in NbSe₂ and deepening our understanding of its origins." (adsbygoogle = window.adsbygoogle || []).push({}); To further explore the anomalous metallic state previously observed in atomically thin NbSe₂, Xi and his colleagues collected electrical transport measurements, which provide insight into how electrical charge flows through materials. They also used optical techniques to examine how the superconductivity in the material adapts when a magnetic field is applied to its surface perpendicularly. Using these methods, the researchers observed a superconducting Higgs mode in the atomically thin NbSe₂ sample. This is a collective oscillation of particles in a superconductor, producing a "synchronized dance" of sorts that mirrors the organization of electrons in a material. "To observe the Higgs mode, we used Raman scattering—shining light on the material and analyzing how the light's color shifts as it interacts with these particle 'dances,'" explained Xi. "While this mode was observed decades ago in much thicker NbSe₂ crystals, detecting it in atomically thin layers was more challenging. To capture its subtle signals, we had to overcome difficulties related to the small, delicate samples." Previous works had collected evidence suggesting that the anomalous metallic state in NbSe₂ could be an experimental artifact, caused by external electrical noise coupling to the sample analyzed. The findings gathered by Xi and his colleagues, on the other hand, suggest that even if it is influenced by electrical noise, the metallic state still defies the standard rules of metals. Discover the latest in science, tech, and space with over 100,000 subscribers who rely on Phys.org for daily insights. Sign up for our free newsletter and get updates on breakthroughs, innovations, and research that matter—daily or weekly. Subscribe "We found that its properties closely resemble the 'anomalous metallic state' observed in other systems where noise had been eliminated," said Xi. "Using Raman scattering and Hall resistance measurements, we gathered evidence that the material's electrons still form Cooper pairs (the pairs of electrons typically responsible for superconductivity), but these pairs do not condense into a fully coherent superconducting state. Surprisingly, these incoherent pairs are more resilient to magnetic fields than expected." The recent work by this team of researchers sheds new light on the superconductivity of atomically thin NbSe₂, challenging the present understanding of the anomalous metallic state emerging from this prototypical two-dimensional superconductor. In the future, it could pave the way for further studies focusing on this state, potentially leading to more discoveries about this state and its underlying physics. "In our next studies, we plan to explore the microscopic features of this anomalous metallic state using other experimental techniques," added Xi. "We are also interested in finding ways to control this state, so we can better understand the conditions and mechanisms for its formation." More information: Yu Du et al, Unveiling Resilient Superconducting Fluctuations in Atomically Thin NbSe2 through Higgs Mode Spectroscopy, Physical Review Letters (2025). DOI: 10.1103/PhysRevLett.134.066002. On arXiv: DOI: 10.48550/arxiv.2502.09868 Journal information: Physical Review Letters , arXiv © 2025 Science X Network Citation: Atomically thin NbSe₂ demonstrates resilient superconducting fluctuations (2025, February 28) retrieved 2 March 2025 from https://phys.org/news/2025-02-atomically-thin-nbse-resilient-superconducting.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only.'''
