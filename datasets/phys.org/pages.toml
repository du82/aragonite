full_description = '''March 1, 2025 The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked peer-reviewed publication trusted source proofread New theory suggests star mergers produce universe's highest-energy particles by James Devitt, New York University A new paper by NYU physicist Glennys Farrar provides a tool for understanding the most cataclysmic events of the universe: two neutron stars merging to form a black hole. In the above illustration, two neutron stars are on the verge of colliding. Credit: NASA's Goddard Space Flight Center. Ultrahigh Energy Cosmic Rays are the highest-energy particles in the universe, whose energies are more than a million times what can be achieved by humans. But while the existence of UHECRs has been known for 60 years, researchers have not succeeded in formulating a satisfactory explanation for their origin that explains all the observations. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); But a new theory introduced by New York University physicist Glennys Farrar provides a viable and testable explanation for how UHECRs are created. "After six decades of effort, the origin of the mysterious highest-energy particles in the universe may finally have been identified," says Farrar, a Collegiate Professor of Physics and Julius Silver, Rosalind S. Silver, and Enid Silver Winslow Professor at NYU. "This insight gives a new tool for understanding the most cataclysmic events of the universe: two neutron stars merging to form a black hole, which is the process responsible for the creation of many precious or exotic elements, including gold, platinum, uranium, iodine, and xenon." The work, which appears in the journal Physical Review Letters, proposes that UHECRs are accelerated in the turbulent magnetic outflows of Binary Neutron Star mergers—spewed out from the merger remnant, prior to formation of the final black hole. The process simultaneously generates powerful gravitational waves—some already detected by scientists at the LIGO-Virgo collaboration. These images show the merger of two neutron stars recently simulated using a new supercomputer model. Redder colors indicate lower densities. Green and white ribbons and lines represent magnetic fields. The orbiting neutron stars rapidly lose energy by emitting gravitational waves and merge after about three orbits, or in less than 8 milliseconds. The merger amplifies and scrambles the merged magnetic field. A black hole forms and the magnetic field becomes more organized, eventually producing structures capable of supporting the jets that power short gamma-ray bursts. Credit: NASA/AEI/ZIB/M. Koppitz and L. Rezzolla. Farrar's Physical Review Letters proposal explains, for the first time, two of the most mysterious features of UHECRs: the tight correlation between a UHECR's energy and its electric charge and the extraordinary energy of a handful of the very highest energy events. Stemming from Farrar's analysis are two consequences that can provide experimental validation in future work: The very highest energy UHECRs originate as rare "r-process" elements, such as xenon and tellurium, motivating a search for such a component in the UHECR data. Extremely high-energy neutrinos, originating from UHECR collisions, are necessarily accompanied by the gravitational wave produced in the parent neutron star merger. More information: Glennys R. Farrar, Binary Neutron Star Mergers as the Source of the Highest Energy Cosmic Rays, Physical Review Letters (2025). DOI: 10.1103/PhysRevLett.134.081003 Journal information: Physical Review Letters Provided by New York University Citation: New theory suggests star mergers produce universe's highest-energy particles (2025, March 1) retrieved 2 March 2025 from https://phys.org/news/2025-03-theory-star-mergers-universe-highest.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only.'''
