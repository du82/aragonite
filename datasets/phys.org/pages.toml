["https://phys.org/news/2025-02-languages-babies-ghanaian.html"]
title = "How many languages can babies learn? Study shows how Ghanaian babies grow up speaking two to six languages"
description = "Africa is a multilingual continent and many adults speak several languages fluently. An empirical study by a research team led by the Potsdam psycholinguists Prof. Dr. Natalie Boll-Avetisyan and Paul O. Omane now shows that the roots of this multilingualism can be found in infancy: In Ghana, most babies grow up multilingually, with most of them coming into contact with two to six languages and just as many regular speakers of each language."
full_description = '''February 28, 2025 The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked trusted source proofread How many languages can babies learn? Study shows how Ghanaian babies grow up speaking two to six languages by University of Potsdam Credit: Unsplash/CC0 Public Domain Africa is a multilingual continent and many adults speak several languages fluently. An empirical study by a research team led by the Potsdam psycholinguists Prof. Dr. Natalie Boll-Avetisyan and Paul O. Omane now shows that the roots of this multilingualism can be found in infancy: In Ghana, most babies grow up multilingually, with most of them coming into contact with two to six languages and just as many regular speakers of each language. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); The researchers also showed that the babies heard some languages primarily indirectly—i.e. via radio, television or background conversations—while other languages were used by their caregivers to directly communicate with them. The results of the study have now been published in the journal Cognitive Development. The study, which examined 121 babies aged three to twelve months in Accra, the capital of Ghana, demonstrates a remarkable variety of language input in the early months of life. The children are regularly exposed to two to six languages. Strikingly, the number of caregivers the children have also ranges between two and six, and babies who have more adults in their daily lives who regularly take care of them also hear more different languages. In Ghana, families often live in so-called "compound buildings," where many everyday interactions take place in the courtyard, where family, neighbors and other relatives play an important role in the lives of children. "The idea that a child learns only one particular language from a single caregiver, as is often assumed in Western cultures, does not apply to these communities. Rather, children are surrounded by a rich spectrum of linguistic inputs from the very beginning," says O. Omane, the first author of the study. (adsbygoogle = window.adsbygoogle || []).push({}); "The majority of studies on children's language acquisition have been conducted in Western industrialized nations, which is why they often focus on a rather narrow conception of multilingualism. Our research shows that other societies show a much more vibrant multilingual environment," adds the study's lead researcher, Prof. Dr. Boll-Avetisyan adds. A key finding of the study is the distinction between direct and indirect language input. While English is primarily acquired through indirect channels such as television and official communication, children receive most of the local languages (such as Akan, Ga and Ewe) through direct contact with their caregivers. Accordingly, the proportion of direct input is higher in the local languages than in English, which is predominantly present as indirect input. "It is often emphasized how important direct language contact is for language acquisition," Boll-Avetisyan says. "However, our results suggest that indirect input—especially through media and official communication—also plays an essential role in the children's daily lives, particularly in urban contexts." As a result of their empirical study, the researchers call for a broader view in language research. The common assumptions do not reflect the diversity and complexity found in other cultural contexts such as Ghana. The study makes it clear that it is not only the number of languages a child hears, but also the diversity of people and the different forms of input that have a decisive influence on language acquisition. "Our research shows that for many children, a multilingual environment is a dynamic, vibrant reality from the very beginning. Multilingualism is not just a bonus, but a fundamental part of children's identity and social structure," the researcher says. More information: Paul Okyere Omane et al, Exploring the nature of multilingual input to infants in multiple caregiver families in an African city: The case of Accra (Ghana), Cognitive Development (2025). DOI: 10.1016/j.cogdev.2025.101558 Provided by University of Potsdam Citation: How many languages can babies learn? Study shows how Ghanaian babies grow up speaking two to six languages (2025, February 28) retrieved 2 March 2025 from https://phys.org/news/2025-02-languages-babies-ghanaian.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only.'''
