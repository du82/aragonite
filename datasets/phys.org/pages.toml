["https://phys.org/news/2025-02-graphyne-carbon-potential-electronics.html"]
title = "Graphyne's transformation: A new carbon form with potential for electronics"
description = "Research taps into sugary secrets of plant nectar to bite back against mosquito-spread disease                                                                                                                                                                                                                                                                                                        13 hours ago"
full_description = "February 28, 2025 The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked peer-reviewed publication trusted source proofread Graphyne's transformation: A new carbon form with potential for electronics by Case Western Reserve University Orthogonal to sheet plane views of AA, AB1, AB2, and ABC stacking arrangements for graphyne. Only the AA and AB1 packing modes are consistent with the interplanar reaction of triple bonds to form polyacetylene chains in reacted graphyne. Credit: Proceedings of the National Academy of Sciences (2025). DOI: 10.1073/pnas.2413194122 Graphyne is a crystalline form of carbon that is distinct from both diamond and graphite. Unlike diamond, where each atom possesses four immediate neighbors, or graphite, where each atom has three, graphyne's structure combines two-coordinate and three-coordinate carbons. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); Computational models suggest that graphyne has highly compelling electronic, mechanical and optical properties. It is predicted to be a semiconductor with a band gap appropriate for electronic devices, ultra-high charge carrier mobility far surpassing that of silicon, and ultimate strength comparable to that of graphene. Applications of graphyne in carbon electronics, energy harvesting and storage, gas separations and catalysis have been proposed. While graphyne was first theoretically predicted more than three decades ago, its synthesis remained elusive. The Rodionov group at CWRU developed the first practical synthesis of graphyne in 2022, and their work was published in the Journal of the American Chemical Society. Now, in a new paper published in the Proceedings of the National Academy of Sciences, the Rodionov group and an international team of collaborators from the University of Texas at Dallas, Georgia Institute of Technology, Deakin University (Australia), and Campinas University (Brazil) describe a transformation of graphyne in an entirely different form of carbon. This transformation completely eliminates all the two-coordinate acetylenic carbons from graphyne, yet it preserves the layered structure. The transformation also modifies the band gap of the material. This finding may enable future techniques for fabricating all-carbon electronic chips with performance unattainable by the current silicon technology. More information: Ali E. Aliev et al, A planar-sheet nongraphitic zero-bandgap sp2 carbon phase made by the low-temperature reaction of γ-graphyne, Proceedings of the National Academy of Sciences (2025). DOI: 10.1073/pnas.2413194122 Journal information: Journal of the American Chemical Society , Proceedings of the National Academy of Sciences Provided by Case Western Reserve University Citation: Graphyne's transformation: A new carbon form with potential for electronics (2025, February 28) retrieved 2 March 2025 from https://phys.org/news/2025-02-graphyne-carbon-potential-electronics.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only."
