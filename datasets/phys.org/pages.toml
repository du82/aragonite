["https://phys.org/news/2025-02-sugary-secrets-nectar-mosquito-disease.html"]
title = "Research taps into sugary secrets of plant nectar to bite back against mosquito-spread disease"
description = "New findings date Los Chocoyos supereruption to 79,500 years ago, and show Earth bounced back within decades                                                                                                                                                                                                                                                                                                        13 hours ago"
full_description = '''March 1, 2025 The GIST Editors' notes This article has been reviewed according to Science X's editorial process and policies. Editors have highlighted the following attributes while ensuring the content's credibility: fact-checked peer-reviewed publication trusted source proofread Research taps into sugary secrets of plant nectar to bite back against mosquito-spread disease by Royal Botanic Gardens, Kew In a new study, scientists analyzed the nectar chemistry of several plants known to be used by mosquitoes for food in malaria-prone areas. They propose identifying and removing these plants from the landscape, such as from near people's homes, could tackle the number of infections of malaria as well as other tropical diseases like Zika, West Nile, and dengue. Credit: Anders Lindström In a study published in Scientific Reports, researchers from the Royal Botanic Gardens, Kew, working with partners in Africa and the UK, present a novel plant-host identification method that could help in the fight to reduce the transmission of infectious diseases such as malaria, through restricting the preferred plant food sources of mosquitoes. googletag.cmd.push(function() { googletag.display('div-gpt-ad-1449240174198-2'); }); Professor Phil Stevenson, Priority Leader of Trait Diversity and Function at RBG Kew, says, "Mosquitoes are some of the deadliest animals on the planet because they transmit many dangerous and lethal diseases, including malaria. But what surprises many is that mosquitoes have very high energy requirements which they satisfy from feeding on flower nectar, not just blood, and a good supply of nectar is important for mosquito abundance and disease transmission." The research shows that mosquitoes prefer to feed on sugar from certain plant species and an abundance of these plants in a disease-prone area could lead to higher mosquito populations and higher infection rates. In turn, scientists believe identifying and removing these plants from the landscape could help lower the disease transmission rates. According to the World Health Organization, malaria and other mosquito-borne diseases are responsible for hundreds of thousands of deaths worldwide and is caused by parasite-carrying female mosquitoes feeding on human blood. Furthermore, the current interventions of bed nets and spray insecticides are starting to fail in their effectiveness. What is needed are novel approaches to reducing mosquito populations during disease outbreaks and altering sugar sources in their habitat may prove to be a successful intervention. (adsbygoogle = window.adsbygoogle || []).push({}); Dr. Amanda Cooper, postdoctoral researcher at the Royal Botanic Gardens, Kew, says, "Mosquito-borne diseases continue to challenge public health bodies throughout the tropical regions of the world. The main methods currently used to fight mosquito-borne disease, indoor insecticide application and bed nets, are becoming less effective as mosquitoes are building resistance. "Thus, these new interventions for combating mosquito-borne diseases are desperately needed. We hope this work will be the start of finding new and effective interventions." The study's authors analyzed the nectar chemistry of plants known to be used as a source of sugar by mosquitoes in areas where malaria transmissions are prevalent. They then identified unique metabolites from nectar inside the mosquitoes for more than eight hours after feeding, revealing which plants they have been feasting on. While this can be done through DNA barcoding (by analyzing the DNA of ingested plant material), it may be challenging to extract sufficient plant DNA from small nectar-eating insects. Instead, Kew's scientists focused on nectar metabolites, which provide a unique chemical character that can be used to distinguish different sources of plant sugars. Three candidate species for the study were chosen from the vast living collections of Kew Gardens in West London that were also known to be ornamental plants grown in Bobo-Dioulasso in Burkina Faso. These were yellow sage (Lantana camera), castor oil plant (Ricinus communis), and yellow oleander (Cascabela thevetia), all of which are widespread throughout the tropics. Discover the latest in science, tech, and space with over 100,000 subscribers who rely on Phys.org for daily insights. Sign up for our free newsletter and get updates on breakthroughs, innovations, and research that matter—daily or weekly. Subscribe The Kew team are now hopeful their new approach could be used to screen plants in areas where mosquito-borne diseases are widespread, to help understand mosquito ecology and plant preference and possibly removing those plants from near to peoples' homes, reducing the overall mosquito population numbers. Prof Stevenson adds, "In this work we've developed a way of identifying which flowering plants mosquitoes prefer so that we can remove them from near people's homes and reduce the abundance of the mosquitoes and the transmission of the diseases that they vector. "We think this could also be used to understand and influence the dynamics of infection in other important mosquito-borne diseases including dengue, Zika virus, and West Nile virus." Such studies are of critical importance, as infectious tropical diseases affect hundreds of millions of people globally each year. In 2022 alone, the World Health Organization (WHO) estimated some 249 million people were infected by malaria, with 608,000 deaths reported in 85 countries. Found mostly in the tropics, malaria is caused by Plasmodium parasites carried by mosquitoes and can be entirely prevented by avoiding mosquito bites or with medication. The research is part of a wider program of work at Kew aiming to better understand the relationships between plants and invertebrates, particularly flower-feeding insects such as bees and other pollinators and small insects. The researchers are also keen to understand the role of nectar metabolites and how they affect animals. Dr. Cooper adds, "The only way to reduce the impact of mosquito-borne diseases is to find new avenues of targeting mosquito vectors and interventions through known host plants may be the solutions we need." More information: Amanda N. Cooper et al, Identifying mosquito plant hosts from ingested nectar secondary metabolites, Scientific Reports (2025). DOI: 10.1038/s41598-025-88933-1 Journal information: Scientific Reports Provided by Royal Botanic Gardens, Kew Citation: Research taps into sugary secrets of plant nectar to bite back against mosquito-spread disease (2025, March 1) retrieved 2 March 2025 from https://phys.org/news/2025-02-sugary-secrets-nectar-mosquito-disease.html This document is subject to copyright. Apart from any fair dealing for the purpose of private study or research, no part may be reproduced without the written permission. The content is provided for information purposes only.'''
