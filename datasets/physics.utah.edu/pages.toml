full_description = "The Future of Telescope Lenses is Flat Categories: News This article was originally posted by the University of Utah’s College of Engineering. For centuries, lenses have worked the same way: curved glass or plastic bending light to bring images into focus. But traditional lenses have a major drawback—the more powerful they need to be, the bulkier and heavier they become. Scientists have long searched […] Read More February 28, 2025 Tanmoy Laskar & Team Awarded Inaugural Scialog Award Categories: News This article was originally posted by the University of Utah’s College of Science. University of Utah astronomer Tanmoy Laskar and his team have been awarded $60,000 in direct costs to support research through the first year of the Scialog: Early Science with LSST. The three-year initiative aims to advance the foundational science needed to realize […] Read More February 26, 2025 ‘Vast Discovery’ of Black Holes in Dwarf Galaxies Categories: News This article by Lisa Potterwas originally published in @TheU and was adapted from a release by Josie Fenske at NSF NOIRLab. Using early data from the Dark Energy Spectroscopic Instrument (DESI), a team of scientists, led by University of Utah postdoctoral researcher Ragadeepika Pucha, have compiled the largest sample ever of dwarf galaxies that host an […] Read More February 21, 2025 Widening Our Cosmic View Categories: News This article by Michael Jacobsen was originally published by the U’s College of Science. This includes the meticulous organization that goes into every project, the countless sleepless nights seeking their completion and the individual lives supporting every major breakthrough. Teams are valued within scientific communities, but when it comes to broader public recognition it’s rare […] Read More February 20, 2025 Dr. Matthews Talks Cosmic Particle Detection in Utah Categories: News This article originally appeared on kcpw. Please visit their site to listen to Dr. Matthews’s full discussion on Cool Science Radio. You know you’ve detected something big when you name it the “Oh My God Particle.” In 1991, the most powerful cosmic ray ever was detected at the University of Utah’s Fly’s Eye observatory at the U.S. […] Read More February 20, 2025"
