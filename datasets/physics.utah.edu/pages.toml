full_description = '''The Department of Physics and Astronomy is located on the north-west side of the University of Utah's main campus--on what was originally called the "Engineering Mall." We are located just east of the Kingsbury Hall Performing Arts Center and across the street from "Greek Row." Our main administrative office is located in room 201 of the James Fletcher Building. Directions: https://bit.ly/2bzmMyd Phone: (801) 581-6901 Our mailing address is: Dept. of Physics Astronomy University of Utah 201 James Fletcher Bldg. 115 South 1400 East Salt Lake City, UT 84112-0830. Our Campus Address is: 201 James Fletcher Bldg. (building #83) Quick Contacts in the Department of Physics and Astronomy General Inquiries Front Desk frontdesk@physics.utah.edu Start here! This email is monitored by our entire admin team (801) 581-6901 Department Chair Carsten Rott chair@physics.utah.edu Associate Chair Zheng Zheng zhengzheng@astro.utah.edu Administrative Manager Valerie Smith ext 1-6861 valerie.smith@utah.edu Chair schedule, faculty hiring, RPT Travel Support Sean Zuckerman (801) 585-1754 Sean.Zuckerman@utah.edu Travel arrangements and reimbursements Travel info Graduate Program Kelsey Krause (801) 581-6902 kelsey@physics.utah.edu Support for incoming and current grads Postdocs Naua Uluave 801-581-6902 u0848078@utah.edu Postdoc requests, J1 and F1 visa support, permission codes Academic Support Andrew Ve'e (801) 581-6901 u0809830@utah.edu Course scheduling, classrooms, transfer evaluations, TA offers, Help Lab support Website Help web@physics.utah.edu Web page redirects, content corrections, design support Please, no content requests from unaffiliated parties. You will not receive a response. Computing Help Find an array of help at: physics.utah.edu/computing/ Emailing help@physics.utah.edu will generate a support ticket, no other steps required! Accounting & Grants Email or visit: physicsaccounting@utah.edu pandagrants@utah.edu Accounting site PCards, meal reimbursements, purchasing'''
