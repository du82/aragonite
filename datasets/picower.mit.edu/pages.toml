title = "Learning the secrets of neural longevity could benefit the aging brain and body alike, research project posits | Picower Institute"
description = "With a new Glenn Foundation Discovery Award, the Heiman Lab will study the genetic and molecular basis for the exceptional longevity of neurons in hopes of using that insight to help sustain aging cells."
full_description = "News News All In the media Newsletter e-Newsletter October 3, 2024 New Research Learning the secrets of neural longevity could benefit the aging brain and body alike, research project posits With a new Glenn Foundation Discovery Award, the Heiman Lab will study the genetic and molecular basis for the exceptional longevity of neurons in hopes of using that insight to help sustain aging cells. Neurons in the brain can live for more than 90 years, making them exceptional examples of longevity among cells, but scientists know little about how neurons achieve that long lifespan. With a new Glenn Foundation Discovery Award, Myriam Heiman, John and Dorothy Wilson Associate Professor of Neuroscience in The Picower Institute for Learning and Memory at MIT, and her lab plan a research project that will expand on preliminary work aimed at discovering the genetic and molecular basis of neural longevity. Heiman has long studied the mechanisms that make different cells in the brain especially vulnerable amid neurodegenerative diseases such as Parkinson’s disease, Huntington’s Disease, ALS, and frontotemporal dementia. She said that observing the molecular markers of aging in such diseases inspired her to examine aging and longevity in neurons more fundamentally. Myriam Heiman, John and Dorothy Wilson Associate Professor of Neuroscience “The Glenn Foundation Discovery Award seeks to support investigators who have not previously been engaged in aging research, but whose research is relevant to understanding aging mechanisms and could lead to novel advances with significant potential to benefit human health and well-being,” said Mark R. Collins, President of the Glenn Foundation for Medical Research (GFMR). Support from the award, $525,000 over three years from GFMR and the American Federation for Aging Research (AFAR), will enable Heiman’s lab to conduct rigorous and unbiased testing in the mammalian nervous system to discover genes that sustain neural longevity. “The mechanisms that underlie the exceptional longevity of nerve cells in our brain remain unclear,” said Heiman, a faculty member in MIT’s Brain and Cognitive Sciences department. “If they were understood, however, they could be targeted to restore nerve cell function in the context of aging and neurodegeneration, and they could also potentially be induced in other cell types of the body to increase the healthspan of the whole organism.” Heiman said she was very grateful for the award, which will enable her and her team members to pursue this research project further. “AFAR and GFMR are the leading funders of new and innovative scientific research in the aging field,” Heiman said. “Their mission in this area is of great importance, since elucidating aging mechanisms at the basic scientific level will lead the way to tremendous advances in the treatment of innumerable age-associated diseases. Receiving this grant now has enabled work at a crucial early stage.” Neuron image credit: Leterrier, NeuroCyto Lab, INP, Marseille, France. Creative Commons license Print Share Related Articles Movement disorder ALS and cognitive disorder FTLD show strong molecular overlaps, new study shows March 22, 2024 Research Findings Movement disorder ALS and cognitive disorder FTLD show strong molecular overlaps, new study shows Single-cell gene expression patterns in the brain’s motor and frontal cortex, and evidence from follow-up experiments, reveal many shared cellular and molecular similarities that could be targeted for potential treatment Read more Research Article 'Cellf' Expression December 20, 2023 Research Feature 'Cellf' Expression Picower Institute scientists are using single cell genomics techniques to measure gene expression and produce unque insights into nervous system biology and disease Read more New grant to study possibility of an immunotherapy for autism November 2, 2023 New Research New grant to study possibility of an immunotherapy for autism Picower Institute-based collaboration will study mechanisms that might enable peripheral immune cells to deliver a potentially therapeutic molecule to the brain. Read more Petite & Profound June 22, 2023 Research Feature Petite & Profound Why studying simple organisms—none larger than the palm of your hand—is so integral to understanding nervous system health, disease and evolution. Read more"
