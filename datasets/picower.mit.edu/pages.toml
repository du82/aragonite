full_description = "People People Faculty Director Affiliates Picower Advisory Board Administrators Contact Mark Bear Mark Bear Picower Professor of Neuroscience After postdoctoral work at the Max Planck Institute, Mark Bear joined the Brown medical faculty and was named a Howard Hughes Medical Investigator in 1996. In 2003, Bear joined the Picower faculty. Research Areas mGluR5, LTD, LTP, monocular deprivation, habituation, potentiation, amblyopia, visual cortex Emery N. Brown Emery N. Brown Edward Hood Taplin Professor of Medical Engineering and Computational Neuroscience A practicing anesthesiologist at Massachusetts General Hospital, Emery Brown is also a noted statistician and a member of the faculty of both the Picower Institute and Harvard Medical School. Research Areas anesthesia, arousal, consciousness, neural systems, fMRI, motor cortex, EEG, MEG, microdialysis, epilepsy Gloria Choi Gloria Choi Associate Professor, Department of Brain and Cognitive Sciences Before joining the MIT faculty in 2013, Choi received her bachelor’s degree from University of California, Berkeley, and her Ph.D. from Caltech. Then she was a postdoctoral research scientist in the laboratory of Richard Axel at Columbia University. Research Areas autism, neuroimmunology, cortex, proprioception, neurodevelopmental disorders Kwanghun Chung Kwanghun Chung Associate Professor of Chemical Engineering and Neuroscience Kwanghun Chung is a member of the faculty of the Picower Institute, the MIT Institute for Medical Engineering and Science, and MIT’s chemical engineering department. He is an associate member of the Broad Institute. Research Areas CLARITY, MAP, SWITCH, neurotechnology, organoids, neural systems Linlin Fan Linlin Fan Assistant Professor of Brain and Cognitive Sciences Linlin Fan joined the MIT and Picower Institute faculty in January 2024. Previously she worked as a postdoc at Stanford University after earning her PhD at Harvard. Research Areas optogenetics, spatial memory, plasticity, synaptic plasticity, all-optical physiology, neurotechnology, voltage imaging Steven Flavell Steven Flavell HHMI Investigator After completing his PhD at Harvard University and postdoctoral training at Rockefeller University, Steven Flavell joined the MIT faculty in 2016 as an assistant professor in the Picower Institute and the Department of Brain and Cognitive Sciences. Research Areas neuromodulation, behavior, calcium imaging, C. elegans, gut-brain signaling, feeding states, serotonin Myriam Heiman Myriam Heiman John and Dorothy Wilson Associate Professor of Neuroscience, Department of Brain and Cognitive Sciences Myriam Heiman received her PhD from the John Hopkins University and her postdoctoral training at the Rockefeller University. In 2011, she joined the Picower Institute and the Department of Brain and Cognitive Sciences at MIT. Research Areas TRAP, neurotechnology, striatum, CAG, medium spiny neurons, neuronal identity, Huntington's Disease, neurodegeneration, Single Cell Transcriptomics and Epigenomics Troy Littleton Troy Littleton Menicon Professor in Neuroscience Troy Littleton earned an MD and PhD from Baylor College of Medicine and completed postdoctoral training at the University of Wisconsin. He joined the faculties of the Picower Institute and the MIT Department of Biology in 2000. Research Areas synapse formation, synaptic transmission, glia, epilepsy, neurological disorders, NMJ Earl K. Miller Earl K. Miller Picower Professor of Neuroscience Earl K. Miller earned a PhD in psychology and neuroscience from Princeton, then pursued postdoctoral training at the National Institute of Mental Health. He joined MIT’s Picower Institute and Department of Brain and Cognitive Sciences in 1995. Research Areas oscillations, cognitive control, prefrontal cortex, bayesian modelling, gamma, cognition, working memory Elly Nedivi Elly Nedivi William R. (1964) & Linda R. Young Professor of Neuroscience Elly Nedivi earned a PhD in neuroscience from Stanford and completed postdoctoral training at The Weizmann Institute. In 1998, she joined MIT’s Picower Institute with joint appointments in the Departments of Brain and Cognitive Sciences, and Biology. Research Areas synaptic plasticity, synapse assembly, synapse disassembly, plasticity genes, CPG15, Neuritin, CPG2, SYNE1, visual system, In vivo cellular imaging, inhibitory circuits, Bipolar Disorder Sara Prescott Sara Prescott Pfizer-Laubach Career Development Assistant Professor of Biology Sara Prescott investigates how sensory inputs from within the body control mammalian physiology and behavior Research Areas sensory neurons, interoception, airway-to-brain signaling, Single Cell Transcriptomics and Epigenomics, calcium imaging, circuits Mriganka Sur Mriganka Sur Newton Professor of Neuroscience Mriganka Sur is professor of neuroscience at Picower and also director of the Simons Center for the Social Brain at MIT, which he founded after 15 years as head of the Department of Brain and Cognitive Sciences. Research Areas cerebral cortex, plasticity, development, circuits, attention, autism spectrum disorders, Rett syndrome, organoids, neurotechnology, multiphoton imaging, astrocytes Susumu Tonegawa Susumu Tonegawa Picower Professor of Biology and Neuroscience, HHMI Investigator Nobel laureate Susumu Tonegawa joined MIT’s Department of Biology and the MIT Center for Cancer Research in 1981. He founded MIT’s Center for Learning and Memory in 1994 and the Picower Institute in 2002. Research Areas hippocampus, memory consolidation, circuit mapping, neuromodulation, engram, neurotechnology, inception, depression, place cells, amygdala, valence Li-Huei Tsai Li-Huei Tsai Picower Professor of Neuroscience Li-Huei Tsai joined the faculty of Harvard Medical School in 1994. In 2006, she joined MIT’s Picower Institute and the Department of Brain and Cognitive Sciences and was named the Director of the Picower Institute in 2009. Research Areas Alzheimer's dementia, Down syndrome, Single Cell Transcriptomics and Epigenomics, iPSCs, Brain Rhythms, Neuroimmune interactions, myelination, ApoE, lipid metabolism, Neuronal DNA damage Brady Weissbourd Brady Weissbourd Assistant Professor of Biology Brady Weissbourd uses jellyfish to study nervous system evolution, development, regeneration, and function. Research Areas Evolution, neural systems, Internal states, neuromodulation, development, Single Cell Transcriptomics and Epigenomics Matthew Wilson Matthew Wilson Sherman Fairchild Professor in Neurobiology With a PhD in computational and neural systems from the California Institute of Technology, Matthew Wilson joined the Picower Institute and MIT’s Department of Brain and Cognitive Sciences in 1994. Research Areas hippocampus, place cells, LFP, oscillations, functional connectivity, synchronization, replay, reverse replay"
