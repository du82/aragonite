full_description = "Events Events All Seminars Aging Brain Seminars MCN Seminars Colloquium The Picower Lectures Special Events Symposia Internal Events Past Events Symposia September 18, 2025 The Neuro-Immune Axis and the Aging Brain The 2025 Aging Brain Initiative Symposium: The Neuro-Immune Axis and the Aging Brain Date: Thursday, September 18, 2025 Time: 9:00AM-5:00PM Location: MIT Building 46, Singleton Auditorium (46-3002) Join us on Thursday, September 18, 2025 at the Picower Institute for Learning and Memory for a full day of talks and a trainee poster session exploring the neuro-immune axis and the aging brain with the keynote delivered by Michal Schwartz of the Weizmann Institute of Science. Check back for the schedule and registration page in early 2025. SPEAKER LIST Keynote Speaker: Michal Schwartz, Weizmann Institute of Science Featured Speakers: Isaac Chiu, Harvard Medical School Marco Colonna, Washington University School of Medicine in St. Louis Jonathan Kipnis, Washington University School of Medicine in St. Louis Sarkis Mazmanian, California Institute of Technology Sara Prescott, Picower Institute, MIT Asya Rolls, Technion-Israel Institute of Technology Beth Stevens, Boston Children’s Hospital, Harvard Medical School Kevin Tracey, Feinstein Institutes for Medical Research at Northwell Health About The Aging Brain Initiative The Aging Brain Initiative is a interdisciplinary research effort that pulls together faculty expertise, knowledge, and technical resources from across MIT to solve the mysteries of the aging brain. It spans neuroscience, fundamental biology and genetics, investigative medicine, engineering and computer science, economics, chemistry, urban planning, and artificial intelligence to enable a comprehensive systems approach. What's the ultimate mission? To deliver the basic research that makes possible new tools to address the challenges of brain aging and create a better future for millions. Read more here: https://picower.mit.edu/research/aging-brain-initiative Host Li-Huei Tsai Organizer Brittany Greenough Date/Time Thursday, September 18, 2025 8:30 am – 5:00 pm Location 43 Vassar Street 3rd Floor, Singleton Auditorium (46-3002) Cambridge, MA 02139 United States Share"
