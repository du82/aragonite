title = "Careers | Picower Institute | Neuroscience & Brain Research"
full_description = "About Timeline Education and Training Diversity, Equity and Inclusion Outreach Programs Careers Climate Action Careers Come work with us! Below we list faculty, research, administrative and support positions available at The Picower Institute for Learning and Memory and our member labs through other administrative units such as the Department of Biology. MIT’s Human Resources Office keeps a list of all job openings at the Institute and its labs, and should be your primary contact for all MIT positions. We value diversity and strongly encourage applications from individuals from all identities and backgrounds. All qualified applicants will receive equitable consideration for employment based on their experience and qualifications, and will not be discriminated against on the basis of race, color, sex, sexual orientation, gender identity, pregnancy, religion, disability, age, genetic information, veteran status, or national or ethnic origin. Technical Associate I, Fan Lab Job Number: 24847 Full-Time 2/26/2025 TECHNICAL ASSOCIATE 1, Picower Institute for Learning and Memory-Fan Lab, to support research projects in a lab focused on developing and applying novel high-precision optical and molecular technologies to watch and perturb the brain in action; work with an interdisciplinary team, support the production of high-impact work, and publish investigations; plan and execute wetlab and/or rodent-related experiments related to specific research projects in the laboratory, including molecular cloning, tissue culture, optogenetics experiments, rodent behavior, perfusion, and histology; design and perform one’s own experiments; contribute to the publication of findings; participate in the preparation of written documents, including procedures, presentations, protocols, proposals, and manuscripts; support daily laboratory functions and research by purchasing reagents, maintaining laboratory stocks, overseeing laboratory safety, maintaining laboratory equipment, and managing chemical inventory; interface with veterinary staff and serve as a representative to animal oversight groups; assist with the orientation and training of new staff/students on lab procedures or techniques; and perform other duties as assigned. The lab leverages cutting-edge technologies and integrates them with behavioral, molecular, and computational approaches to understand how the brain encodes, stores, and recalls information. Senior Research Support Associate, Flavell Lab Job Number: 24706 Full-Time 2.26.2025 SENIOR RESEARCH SUPPORT ASSOCIATE, FLAVELL LAB, Picower Institute for Learning and Memory, to assist in genetics, optogenetics, in vivo calcium imaging, and quantitative behavioral experiments aimed at understanding how neural circuits generate patterned activity that gives rise to complex behaviors; perform creative and innovative research rather than procedural lab tasks; conduct molecular, genetic, optogenetic, imaging, and behavioral experiments aimed at understanding how neural circuits generate complex behaviors in the nematode C. elegans; design and perform experiments; analyze and interpret data, often large-scale datasets that require computational approaches; engage in creative and innovative research in the course of performing this work, contributing to overall research directions and discoveries; and assist in lab management, organization, equipment maintenance, and maintaining a safe work environment. Research will use the model system C. elegans. Patient Coordinator, Tsai Lab Job Number: 24794 Full-Time 2/26/2025 PATIENT COORDINATOR, TSAI LAB, Picower Institute for Learning and Memory, will assist with clinical research studies conducted at MIT and at MGH that are designed to evaluate whether Gamma ENtrainment Using Sensory (GENUS) stimulation can be used to help people with memory impairment or at risk of developing impairment including outstanding opportunities for gaining experience in clinical research and clinical patient interaction and for participating in ground-breaking translational research; oversee protocol development and IRB submissions and maintain IRB protocols and certifications, with input from researchers and study leaders; serve as primary contact person for study subjects: screen subjects for inclusion in study; schedule, prepare, and help conduct subject study visits; follow up with subjects between study visits; coordinate and participate in activities during study visits such as neuropsych testing, MRI and EEG recording, and sample collection and processing; ensure timely database entry of study notes and data; perform other duties as assigned, including purchasing, maintaining, and shipping study and research materials and occasional visits to subjects’ homes in and around Boston and Cambridge. MIT Careers"
