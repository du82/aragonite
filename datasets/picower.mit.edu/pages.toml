nce Laboratory, Broad Institute Robert Langer, Department of Chemical Engineering, Department of Biological Engineering, Koch Institute , Troy Littleton, Department of Biology, Department of Brain and Cognitive Sciences, Picower Institute Andrew Lo, MIT Sloan School of Management, Computer Science and Artificial Intelligence Lab Earl Miller, Department of Brain and Cognitive Sciences, Picower Institute Elly Nedivi, Department of Biology, Department of Brain and Cognitive Sciences, Picower Institute Ritu Raman, Department of Mechanical Engineering Michael Sipser*, Department of Mathematics, Dean of the School of Science Jean-Jacques Slotine, Department of Mechanical Engineering Mriganka Sur, Department of Brain and Cognitive Sciences, Picower Institute Susumu Tonegawa*, Department of Biology, Department of Brain and Cognitive Sciences, RIKEN-MIT Center for Neural Circuit Genetics, Picower Institute Li-Huei Tsai*, Department of Brain and Cognitive Sciences, Picower Institute, Alana Down Syndrome Center , Matthew Wilson, Department of Biology, Department of Brain and Cognitive Sciences, Picower Institute, Center for Brains Minds and Machines Richard Wurtman, Department of Brain and Cognitive Sciences *denotes founding faculty member"
