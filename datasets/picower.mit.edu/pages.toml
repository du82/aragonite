title = "Picower Institute joins international declaration on equity and inclusion in brain science | Picower Institute"
description = "The ALBA Declaration outlines steps to overcome two sets of factors that contribute to a lack of equity: implicit bias and workplace culture"
full_description = 'News News All In the media Newsletter e-Newsletter January 12, 2021 Picower People Picower Institute joins international declaration on equity and inclusion in brain science At the Society for Neuroscience’s online Global Connectome meeting Jan. 12, an international group of brain scientists launched the ALBA Declaration on Equity and Inclusion with the endorsement of more than 100 major international scientific institutions including The Picower Institute for Learning and Memory at MIT. The declaration aims to raise awareness and provide a concrete set of actions that individuals and scientific institutions can commit to in order to make their organizations more equitable and inclusive. “Members of underrepresented groups face persistent barriers to equitable representation in science, technology, engineering and mathematics, particularly at advanced stages,” the declaration states. “The cost of this loss of talent is high—for individuals, for research, and for society as a whole.” Neuroscientist Megan Carey, chair of the ALBA Declaration Working Group, said the declaration provides specific ways institutions and individuals in brain science can effect positive change, specifically by combatting implicit bias and improving workplace culture. "The declaration outlines concrete, evidence-based actions that individuals and organizations at any level can take in order to make their environments more equitable and inclusive,” said Carey, group leader in the neuroscience program at the Champalimaud Center for the Unknown in Lisbon, Portugal. “We believe that adopting these principles will benefit all members of the research community." Actions outlined in the declaration include steps to recognize and counteract bias; increase allyship and advocacy for brain scientists from underrepresented groups; improve recruiting, hiring and retention practices; and promote an equitable workplace culture by creating a more positive environment, establishing transparent career structures and ensuring healthy work-life balance. “As the declaration notes, members of underrepresented groups have faced many persistent barriers,” said Li-Huei Tsai, director of The Picower Institute for Learning and Memory and Picower Professor of Neuroscience at MIT. “The Picower Institute recognizes that it can help to end that persistence and break those barriers down. By joining this declaration we are affirming our dedication to embodying the values and engaging in the actions that will overcome bias and racism and promote allyship, equal opportunity and a welcoming, inclusive and diverse neuroscience research environment.” Learn more about diversity, equity and inclusion at The Picower Institute. Print Share Related Articles Mixing joy and resolve, event celebrates women in science and addresses persistent inequalities October 2, 2024 Picower Events Mixing joy and resolve, event celebrates women in science and addresses persistent inequalities The Kuggie Vallee Distinguished Lectures and Workshops presented inspiring examples of success, even as the event evoked frank discussions of the barriers that still hinder many women scientists. Read more Better living through brain chemistry September 6, 2024 Research Feature Better living through brain chemistry Studying neuromodulators such as serotonin and norepinephrine could help make them better targets for psychiatric or psychedelic drugs Read more Study reveals ways in which 40Hz sensory stimulation may preserve brain’s ‘white matter’ August 8, 2024 Research Findings Study reveals ways in which 40Hz sensory stimulation may preserve brain’s ‘white matter’ MIT scientists report that gamma frequency light and sound stimulation preserves myelination in mouse models and reveal molecular mechanisms that may underlie the benefit. Read more Research Article Study across multiple brain regions discerns Alzheimer’s vulnerability and resilience factors July 24, 2024 Research Findings Study across multiple brain regions discerns Alzheimer’s vulnerability and resilience factors Genomics and lab studies reveal numerous findings, including a key role for Reelin amid neuronal vulnerability, and for choline and antioxidants in sustaining cognition. Read more Research Article'
