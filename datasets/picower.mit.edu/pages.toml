["https://picower.mit.edu/about/education-and-training"]
title = "Education and Training | Picower Institute | Neuroscience & Brain Research"
full_description = "About Timeline Education and Training Diversity, Equity and Inclusion Outreach Programs Careers Climate Action Education and Training Picower Fellows The Picower Institute names Picower Fellows to postdoctoral and graduate programs that gives men and women at various stages of their scholarly biomedical careers opportunities to pursue training under the mentorship of a Picower faculty investigator in any laboratory in the Institute. Fellows must be persons of exceptional ability, originality, and resourcefulness, and should be of the highest caliber of intellectual achievement. Picower Fellows receive support needed to pursue their research agenda, freed from the burden and uncertainty of securing outside funding. Meet our postdoctoral and graduate Picower fellows. More Fellowships Learn more about a special set of fellowships for postdoctoral researchers interested in studying the aging brain. And if you are interested in studying Down syndrome, you can find out more here. Picower Clinical Fellowship The Picower Clinical Fellowship program enables clinical researchers and/or physician scientists to conduct research at the Picower Institute. The program draws early-career physicians from top teaching hospitals who seek to learn techniques of basic and applied scientific research in Picower Institute laboratories and form close collaborations with Picower scientists. After completing a one- to three-year fellowship, these clinicians will continue their medical careers with the added benefit of a close and collaborative relationship with the Institute, helping Picower scientists translate their scientific findings into medical treatments and therapies for neurological diseases. Meet them here and learn how qualified applicants can become fellows. Research Scholars Program The Research Scholars Program (RSP), is a post-baccalaureate opportunity hosted in our Brain and Cognitive Sciences (BCS) complex at MIT. The program, jointly funded by The JPB Foundation, the BCS department, K. Lisa Yang, the McGovern Institute for Brain Research, and The Picower Institute for Learning and Memory is designed to provide outstanding recent college graduates from historically underrepresented minority groups and/or economically disadvantaged backgrounds with additional academic training, as they earn a full graduate-level stipend, to become competitive PhD applicants. Since 2017 several Picower Labs have hosted participants in the RSP. Building 46 Post-Doc Association An endeavor including the Picower Institute’s post-doctorate community to provide resources and support to activities that build community and enrich interactions between postdoctoral colleagues and future associates. Initiated by the Picower Institute for its members, the Post-Doc Association has grown to serve the entire Building 46 post-doctoral community and it continues to expand its partnerships with administration. The PDA helps plan career related and social events, and also advocates for postdoctoral issues and benefits. For more information on joining the Postdoc association or their activities, please contact Gabe Stine. Molecular and Cellular Neuroscience (MCN) Program Established and led by Picower Investigator Troy Littleton, the Molecular and Cellular Neuroscience (MCN) Program principally spans the Biology and BCS Departments and allows entering graduate students to train in MCN labs in either department. The program also sponsors community building efforts in the MCN area that bring together participating faculty and students from across the campus. MIT is uniquely situated to provide neuroscience training and research at the bridge of multiple disciplines. With participating MCN faculty located in the Picower Institute, the McGovern Institute, the Whitehead Institute, and the Departments of Biology and Brain and Cognitive Sciences, incoming students have access to many of the top neuroscience laboratories in the world. Innovative neuroscience research is being carried out across these areas, bridging the molecular and cellular field with neuroengineering, systems neuroscience, neurodevelopment and neurochemistry. By bridging research laboratories in multiple departments and centers, the MCN track provides outstanding research and training environments for the top neuroscience undergraduates from around the globe. Click here to learn more about the MCN Program. Academic Programs For more information about undergraduate and graduate academic programs, please visit the Department of Brain and Cognitive Sciences or the Department of Biology. Candidates interested in postdoctoral positions at the Picower Institute should contact the faculty members directly or search for available positions via the MIT Careers Page."
