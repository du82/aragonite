title = "Spring break tours give high schoolers a chance to see science up close | Picower Institute"
description = "Teens from area high schools got the chance to learn about advanced biology and brain research on field trips to MIT"
full_description = "News News All In the media Newsletter e-Newsletter March 31, 2023 Picower Events Spring break tours give high schoolers a chance to see science up close Teens from area high schools got the chance to learn about advanced biology and brain research on field trips to MIT Even during MIT’s spring break the halls of the university’s life sciences buildings were still teeming with young students. That’s because on March 29 and 30 scores of students from six area high schools filled the void by the busload to learn about b­iology and brain science, including from several members of The Picower Institute. More than 80 students from Everett and Lawrence gathered March 30 to learn about the neuroscience of jellyfish from biology Assistant Professor Brady Weissbourd, a new investigator in The Picower Institute. With vibrant videos and images, Weissbourd explained that the jellyfish nervous system has both amazing differences from humans, like an uncanny ability to regenerate, and important similarities, including the same basic job of generating appropriate behaviors based on their current state and environment. Above: Assistant Professor Brady Weissbourd describes an experiment with jellyfish neurons to an audience of students from Everett and Lawrence High Schools. Convenient to study because they are tiny and transparent, jellyfish are also very distant from mammals evolutionarily. So in his lab, which he launched in January, Weissbourd said he plans to learn the secrets jellyfish have to tell about different ways nervous systems have evolved, how their neural organization and activity enables behavior, and how nervous systems can develop and regenerate. For instance, he’s done experiments where he’s killed all the neurons needed for a jellyfish to execute a particular movement behavior, only to find that within a week they all grow back and the movement ability is restored. Understanding that remarkable resilience could someday help lead to new therapies or technologies, he said. “New neurons are being born, they are migrating back out and are fully reforming their nervous system entirely from scratch and allowing this behavior to recover,” Weissbourd said. “So a motivation for going out and trying to broadly explore the diversity of biology is that so much of the breakthrough technologies that people have come up with are from understanding some of the amazing capabilities animals can already do.” On their field trips the visiting teens gained exposure to a wide variety of life science approaches and ideas via demos, tours and talks from numerous labs in the Departments of Biology and Brain and Cognitive Sciences. The tours were coordinated by Mandana Sassanfar, Director of Diversity and Science Outreach. Wellesley High School students listen as Áine Ni Scannail describes processes used to turn induced pluripotent stem cells into brain cells. On March 29, for instance, groups of Wellesley students visited with postdoc Matheus Victor and technical associate Áine Ni Scannail to learn how the lab of Picower Professor Li-Huei Tsai cultures human cells to study Alzheimer’s disease. Victor explained that the lab can biopsy an Alzheimer’s patient’s skin cells and reprogram them to become stem cells. He and Scannail showed how those stem cells can then be further manipulated to become neurons or other kinds of brain cells. The resulting human brain cell cultures derived directly from patients can then be used to test how different genes contribute to Alzheimer’s disease pathology and can provide a testbed for whether different drugs could help reduce it. Littleton Lab graduate student Andrés Crane introduces students from Lawrence High School to electrophysiology techniques. The next day graduate student Andrés Crane led groups of Lawrence High School students through the lab of Menicon Professor Troy Littleton, who uses fruit flies to study fundamentals of how neurons communicate, for instance to control muscle. Crane explained how the researchers can make mutations in the flies to study how those affect the molecules that neurons use to create and operate their connections, or “synapses,” with muscles or other neurons. Crane showed, for instance, how mutations can affect the ability of neurons to transport important molecules, such as the fly version of insulin, from the neuron body down its long axon to synapses at the other end, and how other mutations can affect the strength of a neuron’s electrical signals. From their visit with Crane the students then went to the lab of Picower Professor Mark Bear, where research scientist David Stoppel showed how he uses mice to study fragile X syndrome, a form of autism. Stoppel demonstrated how he prepares mouse brains so that he can make comparisons about how brain activity differs in neurotypical mice and ones modeling the genetics of fragile X. He showed the high schoolers how brain tissue from the visual cortex of mice modeling the disease shows much greater activity upon electrical stimulation than the tissue from typical mice. That might help explain why people with Fragile X syndrome can experience hypersensitivity to sensory stimulation, he said, and could point to ways to treat that. “As researchers we have an obligation to use what we learn about the brain to help,” he said. Many of the visiting high schoolers were seniors approaching graduation later this spring. Perhaps for some, up-close exposure to university research will help shape whether they become part of a next generation of scientists creating new knowledge and ways to help others. Print Share Related Articles Study suggests new molecular strategy for treating fragile X syndrome February 20, 2025 Research Findings Study suggests new molecular strategy for treating fragile X syndrome Enhancing activity of a specific component of ‘NMDA’ receptors normalized protein synthesis, neural activity and seizure susceptibility in hippocampus of fragile X lab mice Read more Research Article From Molecules to Memory December 20, 2024 Research Feature From Molecules to Memory On a biological foundation of ions and proteins, the brain forms, stores, and retrieves memories to inform intelligent behavior Read more Mixing joy and resolve, event celebrates women in science and addresses persistent inequalities October 2, 2024 Picower Events Mixing joy and resolve, event celebrates women in science and addresses persistent inequalities The Kuggie Vallee Distinguished Lectures and Workshops presented inspiring examples of success, even as the event evoked frank discussions of the barriers that still hinder many women scientists. Read more Better living through brain chemistry September 6, 2024 Research Feature Better living through brain chemistry Studying neuromodulators such as serotonin and norepinephrine could help make them better targets for psychiatric or psychedelic drugs Read more"
