["https://pijul.org/manual/the_nest/contributing.html"]
title = "Contributing to a project - The Pijul manual"
full_description = "Contributing to a project Because of the patch-based nature of Pijul, contribution just means sending a change to a repository. The owner of a repository can give permissions to other users in the “Admin” tab of the repository. If you have permission to push directly to a repository, you can do so with: pijul push my_login@ssh.pijul.com:owner/repository If my_login is the same as owner, you can omit owner. Discussions Another way to contribute to a repository on the Nest is to open a discussion, and attach changes to it. A change can be attached with the following syntax: pijul push my_login@ssh.pijul.com:owner/repository --to-channel name:29 Which means “compare the current channel of my repository with channel name on the Nest, and attach the result to discussion number 29”. In the special case where your current channel and the name of the Nest channel match, you can omit name."
year_published = 2025
