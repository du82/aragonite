["http://pijul.org/2017/01/10/first-working-pijul"]
title = "Pijul - First usable Pijul"
description = "An easy to use, distributed and fast version control system."
full_description = "After several months of silence, I’m pleased to announce that we are starting to test the first usable version of Pijul. We are not quite ready to release, as we’d like to get a bug reporting system at the same time as our first release, so that releasing is actually helpful for the community and for us, and no one gets too angry if we don’t fix problems in time. Certainly the hardest part was to make Sanakirja production-ready. One thing that made it incredibly hard was that it all happened incrementally: I was first trying to write a drop-in replacement of LMDB in Pijul. With the existing Pijul, this meant using “binary strings” (or &[u8]) everywhere. Noticing that this wasn’t really going anywhere, Florent then improved the API a lot by adding types everywhere. At the same time, I was having a hard time getting the memory management right: Sanakirja uses a B tree to store reference counts for blocks, and also needs to change the reference counts when changing B trees (including the “reference counter B tree”). Around September 2016, I started to rewrite Sanakirja almost from scratch, which was completed in early December, including an important change in the format to merge Florent’s improvements at a deeper level: we are now using types to define the binary encoding of keys and values. In particular, since Pijul uses a lot of constant-sized strings, we can simply omit their sizes, and know it at compile time. Obviously, this means that Sanakirja databases need to be written and read by programs that use the same type. In other words, our nodes database is now a dictionary mapping branch names to a graph, where a graph is a dictionary mapping a Key to an Edge. In the new Sanakirja API, all these are instances of trait Representable. The main caveat is that there’s no way in Rust (because of the lack of HKT, see e.g. this blog post by Niko Matsakis) to correctly express lifetimes in the deserializing method (see read_value) of Representable. Indeed, these methods would need to return an associated type with a lifetime equal to the transaction’s."
year_published = 2025
clearnet = "http://pijul.org/2017/01/10/first-working-pijul"
