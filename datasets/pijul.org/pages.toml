["https://pijul.org/faq"]
title = "Pijul - FAQ"
description = "An easy to use, distributed and fast version control system."
full_description = "A version control system is a piece of software that allows different authors to work collaboratively and asynchronously on a file, keeps track of their changes and alerts them when their edits are conflicting. It is distinct from a parallel editor, in which all authors edit the same file concurrently. In a parallel editor, the authors are forced to share all their edits with others, often restricting their creativity and causing data loss. There are basically two approaches to version control: either snapshot-based (git, mercurial, svn, or their ancestors), or patch-based (darcs). Historically, patch-based systems have been very simple to learn and use, but slow, whereas snapshot-based systems can be extremely fast, but are usually hard to use for more than simple operations. As an example, cherry-picking does not work well in git/mercurial, and merging is sometimes plain wrong. Pijul combines these approaches, by representing its data in a more general way than snapshot-based systems, which allows to use patches efficiently. In particular, merges and conflicts are where this is the most relevant. This approach, based on a rigorous approach of the problem, is completely different from trying to “fix” Git or Mercurial, or from rediscovering these tools “independently” (with or without “inspiration” from our work). Some things are really wrong, like using three-way merge for version control in general: there are examples (even real-world ones) where Git, Mercurial and SVN just do the wrong thing. See this article for more details. Less objectively, our experience with patch-based tools make us believe that this is possibly the simplest and most efficient way to control versions. If you are considering funding us, thank you! We have an OpenCollective fund if you are interested in helping the project financially. Due to the relatively young age of Pijul, we obviously have little experience with that, but the fact that Pijul patches commute means that users can work on arbitrary partial checkouts."
year_published = 2025
clearnet = "https://pijul.org/faq"
