title = "pijul channel - The Pijul manual"
full_description = "pijul channel Manages different channels Usage pijul channel [OPTIONS] [SUBCOMMAND] Options -h, --help Print help information --repository <REPO_PATH> Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory Subcommands delete Delete a channel. The channel must not be the current channel help Print this message or the help of the given subcommand(s) new Create a new, empty channel rename Rename a channel switch Switch to a channel. There must not be unrecorded changes in the working copy"
