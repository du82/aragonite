["http://pijul.org/2016/03/03/functional-database"]
title = "Pijul - Functional semantics in Sanakirja"
description = "An easy to use, distributed and fast version control system."
full_description = "I announced Sanakirja, our new database backend, on reddit and twitter, but so far I had not had the time to blog about it. This post explains some of the ideas behind this new crate. As is the case in Pijul, we welcome any patch/comment/contribution, sent for instance to our mailing list (we expect this unfortunate situation to end with Pijul 0.3 and its nest). In order to implement branches (as described [here]({%post_url 2016-02-15-branches%})), we needed the ability in LMDB to “clone” just the root node (root of the B-tree) of a database, without cloning the whole thing. For Pijul, this means that forking a project can finally be in complexity O(log h), where h is the number of lines ever written in history. This complexity is actually the optimal one, since opening a file on a standard file system also has roughly that same complexity. For other projects using Sanakirja, this means that it is possible to keep several versions of the same database without duplicating the whole contents: the two versions share all their common parts. The version on the darcs already implements this: put doesn’t modify anything in any database, instead returning a pointer to the root of the new tree. It doesn’t have any overhead compared to LMDB, although the running time is probably not yet at the level of LMDB. In particular, we still need to figure out if our workaround for pagesize differences is necessary or not: one of the main goals of Sanakirja is to provide a file format portable between platforms. This is not very hard to implement. Actually, copy-on-write allows to not worry too much about the memory layout inside B-nodes: we can just allocate in the last part of the node, and compact the node when rewriting. The only thing needed is a counter of how much space is available on each B-node (which we already have). The format already has reference counting, but it doesn’t free its memory yet, mostly because we’ve not implemented commands like delete or update, which would need freeing things."
year_published = 2025
clearnet = "http://pijul.org/2016/03/03/functional-database"
