["https://pijul.org/community"]
title = "Pijul - Community"
description = "An easy to use, distributed and fast version control system."
full_description = "We are committed to providing a friendly, safe and welcoming environment for all, regardless of level of experience, gender, gender identity and expression, sexual orientation, disability, personal appearance, body size, race, ethnicity, age, religion, nationality, or other similar characteristic. On Zulip, please avoid using overtly sexual nicknames or other nicknames that might detract from a friendly, safe and welcoming environment for all. Respect that people have differences of opinion and that every design or implementation choice carries a trade-off and numerous costs. There is seldom a right answer. Please keep unstructured critique to a minimum. If you have solid ideas you want to experiment with, make a fork and see how it works. We will exclude you from interaction if you insult, demean or harass anyone. That is not welcome behaviour. We interpret the term “harassment” as including the definition in the Citizen Code of Conduct; if you have any lack of clarity about what might be included in that concept, please read their definition. In particular, we don’t tolerate behavior that excludes people in socially marginalized groups. Private harassment is also unacceptable. No matter who you are, if you feel you have been or are being harassed or made uncomfortable by a community member, please contact one of the channel ops immediately. Whether you’re a regular contributor or a newcomer, we care about making this community a safe place for you and we’ve got your back. Likewise any spamming, trolling, flaming, baiting or other attention-stealing behaviour is not welcome. These are the policies for upholding our community’s standards of conduct. If you feel that a thread needs moderation, please contact the core Pijul team."
