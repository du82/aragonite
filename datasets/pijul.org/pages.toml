["https://pijul.org/manual/print.html"]
title = "The Pijul manual"
full_description = '''Introduction Welcome to the Pijul book, an introduction to Pijul, a distributed version control system that is at the same time theoretically sound, fast and easy to learn and use. A version control system is a tool that tracks changes in your files, can revert them, and can merge them with your coauthors’ changes. Why Pijul? Pijul is the first distributed version control system to be based on a sound mathematical theory of changes. It is inspired by Darcs, but aims at solving the soundness and performance issues of Darcs. Pijul has a number of features that allow it to scale to very large repositories and fast-paced workflows. In particular, change commutation means that changes written independently can be applied in any order, without changing the result. This property simplifies workflows, allowing Pijul to: clone sub-parts of repositories solve conflicts reliably easily combine different versions. Change commutation In Pijul, for any two changes A and B, either A and B can be applied in any order, or A depends on B, or B depends on A. [Use case: In the early stage of a project] Change commutation makes Pijul a highly forgiving system, as you can “unapply” (or “unrecord”) changes made in the past, without having to change the identity of new changes. A reader familiar with Git will understand “rebasing”. This tends to happen pretty often in the early stages of a project when most things are still uncertain. With Pijul, exploring new features and new implementations comes at no extra cost in time. [Use case: In a mature project] As your project grows, change commutation saves even more time: imagine a project with two main branches, a stable one accepting only bugfixes, and an unstable one, where changes happen constantly. The team working on the unstable branch is likely to discover old bugs, and fix them in the stable branch too. In Pijul, maintainers of the stable branch can simply pull only the changes they are interested in. Pulled changes do not change when imported, which means that pulling new changes will work just as expected. Associativity In Pijul, change application is an associative operation, meaning that applying some change A and then a set of changes (BC) at once yields the same result as applying (AB) first and then C. With branches, the first scenario looks like this: Bob creates A, while Alice creates B, C, and Bob finally merges both B and C at once. The second scenario would look like the following: Bob creating commit A and then pulling B. At that moment, Bob has both A and B on his branch and wants to pull C from Alice. Note that this differs from change reordering: here, we apply A, then B, then C, in the same order in both scenarios. Using math words such as “associative” for such a simple operation may sound like nitpicking because intuition suggests it should always be true. However, Git doesn’t guarantee the associative change property, even if A, B, and C do not conflict. Specifically, Git (and relatives) can sometimes shuffle lines around, because these systems only track versions rather than the changes that happen between the versions. And even though one can reconstruct one from the other, the following example (taken from here) shows that tracking versions only does not yield the expected result. Git merge (which A is which?) Pijul merge In this diagram, Alice and Bob start from an identical file with lines A and B. Alice adds G above everything and then another instance of A and B above that (her new lines show green). Meanwhile, Bob adds a line X between the original A and B. Git, SVN, and Mercurial will merge this example… into the file shown on the left, with the relative positions of G and X swapped, whereas Pijul (and Darcs) yield the file on the right, preserving the order between the lines. Note that this example has nothing to do with a conflict since the edits happen in different file parts. Furthermore, neither Git nor Pijul will report a conflict in this case. The reason for the counter-intuitive behavior in Git is that Git runs a heuristic algorithm called three-way merge or diff3. Diff3 extends diff to two “new” versions instead of one. Note, however, that diff has multiple optimal solutions, and a single change can be described equivalently by different diffs. While this is fine for diff (since the patch resulting from diff has aunique interpretation), it is ambiguous in the case of diff3 and might lead to an arbitrary reshuffling of files. It is prudent to note that change associativity does guarantee the result will have intended semantics, because languages have context-specific rules. Every change should be tested and go through code review. However, the code review won’t be made pointless by reshuffling lines by the version control tool. Modeling conflicts Conflicts are a regular thing in the internal representation of a Pijul repository. After applying new changes, we have to do extra work to find where the conflicts are. In particular, edits from both sides of a conflict get applied without resolving the conflict. This guarantees no information ever gets lost. This is different from both Git and Darcs: Git writes conflicts into the working directory and refuses to commit any changes to the repository until conflicts get manually resolved. In Darcs, conflicts can trigger the exponential merge problem, which might cause it to take several hours to merge even a two-lines change. Comparisons with other version control systems Pijul for Git/Mercurial/SVN/… users The main difference between Pijul and Git (and related systems) is that Pijul stores changes (or patches), whereas Git deals only with snapshots (or versions). There are many advantages to using changes. First, changes are the intuitive atomic unit of work. Moreover, changes can be merged according to formal axioms that guarantee correctness in 100% of cases. In contrast, commits have to be /stitched together based on their contents rather than on the edits that took place/. This is why conflicts are often painful in these systems, as there is no natural way to solve a conflict once and for all (for example, Git has the rerere command to try and simulate that in some cases). Pijul for Darcs users Pijul is a mostly formally-correct version of Darcs’ theory of changes and a new algorithm for merging changes. Its main innovation compared to Darcs is to use a better data structure for its pristine, allowing for: A sane representation of conflicts: Pijul’s pristine is stored in a “conflict-tolerant” data structure. Many changes can be applied to it, and the presence or absence of conflicts are only computed afterward by looking at the pristine. Conflicting changes always commute in Pijul and never commute in Darcs. Fast algorithms: Pijul’s pristine can be seen as a “cache” of applied changes to which new changes can be applied directly without having to compute anything on the repository’s history. However, Pijul’s pristine format is designed to only comply with axioms on a specific set of operations. As a result, some of the Darcs’ features, such as darcs replace, have yet to be made available. Installing Releases The main channel to compile Pijul from source is the Rust Language package manager: cargo. You’ll need to download rustup from here to install cargo. After installing cargo, there are also three different channels to choose from: stable, beta, and nightly. If you’re unsure of which channel to choose, go with stable as your default rust toolchain: rustup default stable You can find more information about channels here. If you’ve already installed rustup before, make sure to update it. Next, you’ll need the necessary libraries and header files installed on your computer and clang compiler: On Debian: sudo apt install make libsodium-dev libclang-dev pkg-config libssl-dev libxxhash-dev libzstd-dev clang On OSX: brew install llvm libsodium openssl xxhash zstd On Arch Linux: sudo pacman -S clang libsodium gcc-libs rustup pkgconf diffutils make xxhash On openSUSE Tumbleweed: sudo zypper in clang-devel libopenssl-devel libsodium-devel libzstd-devel pkgconfig xxhash-devel On Void (Linux): sudo xbps-install libgcc-devel libressl-devel libsodium-devel libzstd-devel xxHash-devel On Fedora Linux sudo dnf install clang-devel openssl-devel libsodium-devel libzstd-devel pkgconfig xxhash-devel After installing the necessary libraries and header files, it’s time to install Pijul! Run the following command in your terminal: cargo install pijul --version "~1.0.0-beta" You might need to add the install directory to your $PATH environment variable. For example: adding the following to your ~/.config/environment.d/envvars.conf: export PATH="\$PATH:$HOME/.cargo/bin/" Distribution packages Nix and NixOS Nix is a package manager that can be installed on any Linux distribution and OSX. nix-env --upgrade nix-env -iA pijul Debian curl https://nixos.org/nix/install | sh If it fails with the following error: nix error: cloning builder process: Operation not permitted Then create a file as root: sudo su root -c 'echo "kernel.unprivileged_userns_clone=1" >> /etc/sysctl.d/nix.conf' Arch Linux Pijul is packaged in AUR. It should be up-to-date or at least close. openSUSE For the development version (1.0.0-beta.X) of Pijul, a package for openSUSE Tumbleweed in the openSUSE Build Service: sudo zypper addrepo -f -r https://download.opensuse.org/repositories/devel:/tools:/scm/openSUSE_Tumbleweed/devel:tools:scm.repo sudo zypper install --allow-vendor-change pijul Use the development version at your own risk. As soon as Pijul 1.0.0 is published, the package will be updated and submitted to openSUSE Tumbleweed. Void (Linux) xbps-install pijul FreeBSD pkg install pijul Alternatively, you can install the port, which is more likely to be up-to-date but means you have to wait for rust and pijul to build from scratch: cd /usr/ports/devel/pijul/ && make install clean Windows We do not provide official Windows binaries at the moment, but community-provided binaries are available. Getting started Here is how to start a project with Pijul: first run the following command: pijul init In the project’s directory. This creates a directory called .pijul, and initialises a few things. Then, add a few files to track. For a Rust project, this could be for instance: pijul add Cargo.toml src/lib.rs Before recording, new users will need to generate a key using pijul key generate <name>. Users can read more about keys in the manual section on identities. Finally, create a patch by recording your changes: pijul record Alternatively, one can add and record files in a single record command. For example, importing all the files in a directory named d is done with: pijul record d If you need to check what parts of repository aren’t recorded, you can use: pijul diff --short --untracked First-Time Setup Now that pijul is installed and working on your system, you can set your user name, full name, and e-mail address so you don’t have to set it each time you want to record a change. You can put this information into one of several places; the one you probably want is $HOME/.config/pijul/config.toml (Linux), %AppData%\pijul\config.toml (Windows), or ~/.pijulconfig (MacOS). Information about the configuration hierarchies used by pijul can be found in the manual section on configuration. Create the file and add the following lines to it: [author] name = "<username>" full_name = "<full name>" email = "<email address>" From now on, pijul should pick this up when recording changes and pre-fill the author section for you. Ignoring files You may want pijul to ignore some files (binary, extra dependencies for examples). This can be done by creating a .ignore file in the root directory. Definitions Pijul works in four different places of your hard drive: a working copy, where you can edit files, a set of changes, a tree, representing the tree of files currently tracked by Pijul, and a pristine, which is a representation of the current recorded version of the repository. The differences between the pristine and the working copy are used to produce changes, which can be then applied to the pristine. Changes encode edits made to files of the repository (line insertions and deletions), as well as file additions, deletions and name changes. At any time, the pristine can be output into the working copy, for instance after receiving new patches, or to cancel changes and reset the working copy to its recorded state. So, the first command of the above example, pijul init, initialised an empty pristine. pijul add then updated the tree, to tell Pijul to start tracking files “Cargo.toml” and “src/lib.rs”. Finally, pijul record compared the (currently empty) repository with the working copy, producing a patch as a result, and applied this patch to the pristine. Next steps In the next chapter, we will see how to exchange patches with others. Collaboration with Pijul doesn’t have to be centralised, and is not even made easier by centralisation, as patches allow for a completely distributed workflow, which can happen even by email exclusively. However, the authors of Pijul provide a free web service called the Nest, as one way to share patches with collaborators. Working with others Although one can use Pijul to work alone, for instance to store the history of changes of a project, or synchronise work with another machine, it is mainly useful (and more efficient than other solutions) when working with other people. The only way to collaborate with others in Pijul is to send and receive patches, and apply them to one’s repository. When working on an existing project, it might be necessary to clone it first. For instance, in order to clone Pijul’s main repository, you can run the following command: pijul clone https://nest.pijul.com/pijul/pijul This just downloads all the patches currently in the remote repository, applies them all, and outputs the result to a new working copy. Further patch exchange can be done with the two commands pull (receive patches) and push (send patches), as we explain now. Between local repositories Patches can also be exchanged between local repositories, in both directions (push and pull). As an example, let’s create two repositories, and exchange two patches between them: mkdir a cd a pijul init echo "blabla" > file pijul add file pijul record cd .. pijul clone a b cd b cat file # should contain "blabla" echo "blibli" >> file pijul record pijul push ../a echo "one extra line" >> file pijul record cd ../a pijul pull ../b SSH Pijul can work with remote repositories over SSH just like local repositories. A working Pijul needs to be installed on the remote machine, though. As an example, if you have an account called “me”, and a repository named “repo” under that account on nest.pijul.com, you can run for instance: pijul clone me@ssh.pijul.com:me/repo To clone your repository, and: pijul push me@ssh.pijul.com:me/repo To send your local patches to your repository th'''
