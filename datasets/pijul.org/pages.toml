["http://pijul.org/2016/02/15/branches"]
title = "Pijul - Thoughts on branches"
description = "An easy to use, distributed and fast version control system."
full_description = "Since our release of Pijul 0.2, I’ve been working mostly on the biggest feature of Pijul 0.3: branches. In this post, I try to explain the current plan. First, branches in Pijul are not like branches in Git. Actually, Git branches are like Pijul’s patches, so in order to produce the simplest possible system, I was once tempted to find simpler ways to map Git workflows to patches. Sometimes, however, we do need some form of branches. There are two use cases I can think of: I want to isolate “private” patches I’m working on currently, and prevent Pijul from pushing them to a remote repository. I want to push patches to a remote “unreviewed” branch, so that they get “merged” to the remote repository only after reviewing. This will be the Pijul way of doing pull requests, only much much lighter than 3-way merge/pull requests. Branches are of course mostly an engineer’s thing, but they’re an absolutely essential feature to have, and a clean definition would make Pijul really easy to learn. The first definition has the merit of simplicity, both in implementation and in learning curve, whereas the other would for instance allow an experimental branch to follow a stable branch, even if patches do not pass through the experimental branch first. These ideas definitely call for a purely functional implementation: with the same implementation as in Pijul 0.2, we could get branches almost for free. Two branches would share everything but their differences. Of course, branches that forked long ago and are “mostly merged” would not share much, but this is probably unavoidable, or at least would require whole new ideas. I’ve contacted the authors of LMDB (the fantastic backend library we’re currentyl using), in order to know whether it would be possible to add some limited form of referential transparency to their B+ trees. They kindly replied that they would probably not do it, which I definitely understand: why would someone want to add such an overhead in space and maintenance for a feature probably used by a single user?"
year_published = 2025
clearnet = "http://pijul.org/2016/02/15/branches"
