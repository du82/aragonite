["https://pijul.org/manual/reference/unrecord.html"]
title = "pijul unrecord - The Pijul manual"
full_description = "pijul unrecord Unrecords a list of changes. The changes will be removed from your log, but your working copy will stay exactly the same, unless the --reset flag was passed. A change can only be unrecorded if all changes that depend on it are also unrecorded in the same operation. There are two ways to call pijul-unrecord: With a list of s. The given changes will be unrecorded, if possible. Without listing any s. You will be presented with a list of changes to choose from. The length of the list is determined by the unrecord_changes setting in your global config or the --show-changes option, with the latter taking precedence. Usage pijul unrecord [OPTIONS] [CHANGE_ID]... Args <CHANGE_ID>... The hash of a change (unambiguous prefixes are accepted) Options --channel <CHANNEL> Unrecord changes from this channel instead of the current channel -h, --help Print help information --repository <REPO_PATH> Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory --reset Also undo the changes in the working copy (preserving unrecorded changes if there are any) --show-changes <N> Show N changes in a text editor if no s were given. Defaults to the value of unrecord_changes in your global configuration"
