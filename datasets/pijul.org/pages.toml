["http://pijul.org/2016/07/20/thrussh"]
title = "Pijul - The design of Thrussh"
description = "An easy to use, distributed and fast version control system."
full_description = "I’ve recently written an SSH library called Thrussh, and I’ve also started to use it for actual tasks like replacing the SCP client in Pijul. This is an important rule of cryptography: do not do your own crypto. Cryptography is full of subtleties, and it is frighteningly easy to introduce more problems than you solve. For example supporting outdated cryptography, even if you don’t really plan to use it, can be harmful to your legitimate crypto, as shown by the Drown attack on HTTPS. Or side-channel attacks, by which an attacker can get bits of a secret key by monitoring differences in the heat, electromagnetic, or time patterns of a processor. This is why I’m using libsodium. Also, this is why I’m using the raw version of it, with as little fuss as possible in the bindings themselves. Thrussh was designed to have the lowest possible code size and dependency set, so as to make it easily readable. It has a server and a client side, sharing a datastructure called CommonSession (see src/session.rs in our darcs repository). Sessions maintain a state, essentially when exchanging keys in the beginning, or when re-exchanging keys during an SSH connection. Thrussh does not depend on any network library: users of this library are instead expected to provide it with instances of std::io::BufRead and std::io::Write. This design allows it to be used with synchronous or asynchronous sockets. In both cases (synchronous or asynchronous), the interface is exactly the same: users need to implement either the Server trait (if they’re writing a server) or the Client trait (if writing a client). Then, they just have to create an instance of thrussh::server::Connection (respectively thrussh::client::Connection), and then successively calling the .read and .write methods of the connections, in a loop (starting with .write for synchronous sockets). A number of methods (for instance .is_authenticated) are supplied for the client to be able to stop the loop at some stages of the protocol, for instance when user input is needed."
year_published = 2025
clearnet = "http://pijul.org/2016/07/20/thrussh"
