["http://pijul.org/2016/04/09/reorganization"]
title = "Pijul - Reorganizing libpijul"
description = "An easy to use, distributed and fast version control system."
full_description = "Now that Sanakirja is in a usable state, the main operation before we can start to use Pijul for other purposes than tests is to plug Sanakirja in. This post describes our strategy for doing this, and the difficulties we’ve had. This is the part I want to blog about, since I’ve had a really hard time figuring out how to do it. The main problem comes from the following patterns we use all the time in Pijul: This means doing something for every key and value in increasing order, starting from a particular key and value. When we designed the format of Pijul repositories, we chose the order of edge flags carefully, so that edge flags that are often iterated together are ordered consecutively. Initially, I wanted to use closures to iterate, as Sanakirja can do this without allocating a single byte on the heap. I had a Backend trait, with the following function (among others): In other words, my iterator was borrowing the backend for lifetime 'a, and applying function f on slices with the same lifetime. Unfortunately, this is not usable in real cases (at least not in Rust 1.6), since the only thing such a method would be useful for would be to change stuff in its borrowed environment. But then Rust thinks that closure f might outlive the function that called iter. I’m not sure why this happens, since f must have returned by the end of the call to iter, and it does not implement the Send trait, which would be necessary to move it to another thread. Then, another design, compatible with the for notation of Rust, is to use iterators. Iterators have another main advantage: they can be used with tons of methods such as take_while or map, which will allow us to simplify the harder parts of our code. The first drawback is, iterators are stateful, which means that Sanakirja will need to allocate a vector on the heap. Since Sanakirja is also written in Rust, the borrow checker could allow us to perform this allocation only once, and still be safe and usable. In contrast, there’s no way in Rust to use two nested LMDB cursors, as they’re both mutable, and borrow the transaction."
