["https://pika.art/blog"]
title = "Pika raises $80M, so anyone can make video on command."
description = "Today is a big day for us. It’s been a year since we dropped out of Stanford to build Pika, and in that time, we’ve done a stealth launch on Discord, released our 1.0 model and web app, shipped multiple first-to-market features, and grown our team from three to thirteen."
full_description = "FUNDRAISING ANNOUNCEMENTPika raises $80M, so anyone can make video on command.June 5th, 2024Today is a big day for us. It’s been a year since we dropped out of Stanford to build Pika, and in that time, we’ve done a stealth launch on Discord, released our 1.0 model and web app, shipped multiple first-to-market features, and grown our team from three to thirteen.But most importantly, we’ve witnessed just how powerful it is when more people have the ability to tell stories through video.That’s why we’re thrilled and humbled to announce that we’ve raised an $80M series B, bringing our total funding to $135M. Led by the incredible team at Spark Capital, this round will enable us to accelerate our progress in building the best video foundation model, and the best possible product for video creators.And, it will also help us continue hiring the best possible talent (hint: if that’s you, apply here!)We want to thank all of our new investors for believing in our vision to remove the barriers to video creation—leading investment firms and individuals across tech and entertainment, including Greycroft, Lightspeed, Neo, Makers Fund, Jared Leto, and Craig Kallman. That’s in addition to our investors from previous rounds, including Nat Friedman, Daniel Gross, Elad Gil, Adam D’Angelo, Mike Vernal, Karim Atiyeh, Aaron Levie, Andrej Karpathy, Aravind Srinivas, Clem Delangue, Alex Chung, Mateusz Staniszewski, Conviction, and SV Angel.And we’d be remiss if we didn’t close this post with love and appreciation for our community of creators, of all kinds. Your ideas are what fuel Pika, and what drive us to make it better.- Demi & ChenlinPhoto credit: Lauren Segal"
year_published = 2025
