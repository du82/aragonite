title = "About"
description = "Making cartoon animals, diffusion models, and occasionally, headlines"
full_description = "ABOUT Us @media screen and (min-width: 1920px) { .about-header_title { font-size: 12.142rem; margin-right: 2.068rem; } .about-header_hero-img-span { width: 12.992rem; margin-right: 2.068rem; } .about-header_title-wrap { margin-left: 10.915rem; margin-right: 10.915rem; } 10.915rem } we’reFORanyonewithanimaginationrocket ship blasting off into spacePika was founded by two Stanford Ph.D students who felt making videos was too damn hard. So, they decided to make it easier for anyone to create video on command.mystical forest with firefliesWhat we’re aboutWhere your creativity goes, we follow.01We make tech to do your ideas justicePika aims to precisely match your vision, even if you have zero experience in video creation. We want you to be able to tell Pika what to create, alter, or add with a simple command.01Pika aims to precisely match your vision, even if you have zero experience in video creation. We want you to be able to tell Pika what to create, alter, or add with a simple command.02If it’s not possible today, we’ll build it tomorrowWhat Pika is capable of today was impossible a few months ago. When we hear creators need a new feature, we get to work and build it — sometimes, overnight.02What Pika is capable of today was impossible a few months ago. When we hear creators need a new feature, we get to work and build it — sometimes, overnight.03We believe the future belongs to creators, not AIWithout a great idea, Pika is powerless. By lowering the barrier to entry, we’re building a future that’s actually expanding opportunities for creativity — not taking them away.03Without a great idea, Pika is powerless. By lowering the barrier to entry, we’re building a future that’s actually expanding opportunities for creativity — not taking them away.lATEST NEWSMaking cartoon animals, diffusion models, and occasionally, headlinesinsert alt textBloomberg 2024 Tech Ones to Watchinsert alt textPika named to the Forbes 2024 AI 50 Listinsert alt textHow this 26-year-old 1st-time founder raised $55M for her AI startupinsert alt textAdobe’s approach to generative AI models & customer choiceinsert alt textPika launches AI Video editing app and announces $55 million in fundinginsert alt textPika Labs’ text-to-video AI platform opens to all: Here’s how to use itinsert alt textThe Information’s Most Promising Startups 2023 insert alt textIntroducing Pika 1.0, the idea-to-video platform.insert alt textModeling Movement in 3D Environmentsinsert alt textPika’s Imagination Engine Professional-quality video creation will also become democratized by generative AI. We believe Pika will lead that transformation.- Michael Mignano Our AdvisorsChris ManningStanford University ProfessorDirector of Stanford AI LabsRon FedkiwStanford University ProfessorTwo-time Academy Award WinnerStefano ErmonStanford University ProfessorGenerative AI PioneerAlexander M. RushCornell University ProfessorResearch, Hugging FaceOur InvestorsNat FriedmanDaniel GrossElad GilAdam D’AngeloAlex ChungClem DelangueAndrej KarpathyCraig KallmanAnKeith PeirisMateusz StaniszewskiCraig KallmanKeith PeirisMateusz StaniszewskiAravind SrinivasKarim AtiyehMike VernalAaron LevieLightspeed VenturesBen’s BitesConvictionHomebrewSV AngelLightspeed VenturesBen’s BitesConvictionHomebrewSV AngelCareersWe’re a company of creatorsWe’re a bunch of AI researchers, filmmakers, programmers, and even fashion designers, united by a love of moving fast and making things. Because great ideas can’t afford to wait.Our team may be small, but between us, we speak 8 languages. Some of us have won international medals in programming. One of us even toured Europe in a metal band.We’ve had meetings about capturing the precise movement of a cat. We’ve created new features in a matter of days. And we’ve had a ton of fun doing it.If that excites you, we’d love to meet you.Join Our Teamwhat’s thehold-up?Try Pika"
