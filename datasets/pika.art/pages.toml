title = "Terms of Services"
full_description = 'Terms of serviceLast Updated: November 29, 2024SECTION 10 CONTAINS AN ARBITRATION CLAUSE AND CLASS ACTION WAIVER. BY AGREEING TO THESE TERMS, YOU AGREE (A) TO RESOLVE ALL DISPUTES (WITH LIMITED EXCEPTION) RELATED TO PIKA’S SERVICE AND/OR PRODUCTS THROUGH BINDING INDIVIDUAL ARBITRATION, WHICH MEANS THAT YOU WAIVE ANY RIGHT TO HAVE THOSE DISPUTES DECIDED BY A JUDGE OR JURY, AND (B) TO WAIVE YOUR RIGHT TO PARTICIPATE IN CLASS ACTIONS, CLASS ARBITRATIONS, OR REPRESENTATIVE ACTIONS, AS SET FORTH BELOW. YOU HAVE THE RIGHT TO OPT-OUT OF THE ARBITRATION CLAUSE AND THE CLASS ACTION WAIVER AS EXPLAINED IN SECTION 8.Mellis, Inc. (“Pika”, “we”, “us” or “our”) provides our Service (described below) and related content to you through our website(s) located at https://pika.art/ and its subdomains (collectively, the “Website”), any third-party social platforms such as Discord, and through our mobile applications and related technologies ("Mobile App", and such Mobile App and the Website, including any content, tools, features, functionality and technology offered on or through our Website or Mobile App, including our generative artificial intelligence platform used to create videos from the images, videos, texts, and other content you upload onto the platform, are collectively referred to as the “Service”). All access and use of the Service is subject to and governed by the terms and conditions contained in these Terms of Service (as amended from time to time, these "Terms"). Please read these Terms carefully, as they include important information about your legal rights. By accessing, browsing, or otherwise using the Website, Mobile Apps, or any other aspect of the Service, you acknowledge that you have read, understood, and agree to be bound by these Terms of Service. If you do not understand or accept the terms and conditions of these Terms, you will not access, browse, or otherwise use the Service.For purposes of these Terms, “you” and “your” means you as the user who created the Pika account and whose payment method is charged. If you use the Service on behalf of a company or other entity then “you” includes you and that entity, and you represent and warrant that (a) you are an authorized representative of the entity with the authority to bind the entity to these Terms, and (b) you agree to these Terms on the entity’s behalf. 1. LOCATION OF OUR PRIVACY POLICY AND OTHER APPLICABLE POLICIES.Privacy Policy. Our Privacy Policy describes how we handle the information you provide to us when you use the Service. For an explanation of our privacy practices, please visit our Privacy Policy located at pika.art/privacy-policy. Acceptable Use Policy. Our Acceptable Use Policy describes how you may use the Service, and is located at pika.art/acceptable-use-policy. Our Acceptable Use Policy is hereby incorporated into these Terms.2. WHO MAY USE THE SERVICE.By accessing the Services, You confirm that You are at least 13 years old and meet the minimum age of digital consent in Your country. If You are old enough to access the Services in Your country, but not old enough to have authority to consent to our terms, Your parent or guardian must agree to our terms on Your behalf. Please ask Your parent or guardian to read these terms with You. If You are a parent or legal guardian, and You allow Your teenager to use the Services, then these terms also apply to You and You are responsible for Your teenager’s activity on the Services.‍‍You may not use the Service if you are barred from doing so under the laws of the United States, your place of residence, or any other applicable jurisdiction. By using the Service, you represent and warrant that you meet these requirements.Pika tries to make its Services PG-13 and family friendly, but the Outputs (defined below) are generated by an artificial intelligence system based on user queries. This is new technology and it does not always work as expected. No guarantees are made as to the suitability of the Outputs for the user of the Service.3. USE OF THE SERVICE.Service Description. The Service utilizes artificial intelligence tools and functionalities to process user inputs to the Service, such as text prompts, directions, images, videos, or other content (the “Inputs” or “Input”) and generate and return outputs based on such Inputs, which may include or take the form of images, videos, sound effects, or other content (the “Outputs” or “Output”, and together with the Inputs, "Content"). The Service may include a public forum where your Content can be shared in a productive environment with other users.Signing up and Safeguarding Your Account. You may be required to create an account with Pika (“Account”) using your email address or sign in through another third party account, such as a Google or Facebook account in order to access the Service. You agree to provide us with accurate, complete and updated information for your Account. You can access, edit and update your Account via the “Profile” page. You are solely responsible for any activity on your Account and for maintaining the confidentiality and security of your password. We are not liable for any acts or omissions by you in connection with your Account. You must immediately notify us at [email protected] if you know or have any reason to suspect that your Account or password have been stolen, misappropriated or otherwise compromised, or in case of any actual or suspected unauthorized use of your Account. You agree not to create any Account if we have previously removed your, or we previously banned you from any of our Service, unless we provide written consent otherwise.Plan Selection and Subscription Payment. To use certain features of Service, you need to select and subscribe to one of the plans provided by Pika (“Plan” or “Plans”). If you subscribe to any of our paid Plans, you agree to pay us the applicable fees and taxes in U.S. Dollars. Failure to pay these fees and taxes will result in the term