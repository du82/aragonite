full_description = 'About UsCareersAPITry PikaAbout UsCareersAPISign InTry PikaPIKA APITAKE PIKA TO GOGet the power of Pika’s video models from the comfort of your own product.self.__wrap_n!=1&&self.__wrap_b(":R3ijts9kq:",1)Get in touchAPIAll about the Pika APIself.__wrap_n!=1&&self.__wrap_b(":Rjjts9kq:",1) FAQ Section What does the API support?Our API supports most features across Pika 1.0, 1.5 and 2.0. We don’t provide access to our Pikaffects via the API. We also don’t provide access to lip sync or sound effects. For Pika 1.0, expand canvas and modify region are available to select partners. Please reach out if you are interested.How to I get started?Just get in touch with us using the handy “Get in touch” button above. We’ll get back to you with next steps.Are there usage limits or rate limits for the API?Great news! There are no usage limits for the API. However, we do impose a rate limit of 20 generations per minute for all users. What video formats and resolutions are supported?The API supports MP4 outputs at 720p. We also support varying aspect ratios.How is billing handled for API usage?We’re billing monthly, based on usage. Everything is pay as you go:$0.05 USD per second for the generation of 720p video content using Pika 1.0.$0.07 USD per second for the generation of 720p video content using Pika 1.5.$0.11 USD per second for the generation of 720p video content using Pika 2.0 (Scene Ingredients disabled).$0.156 USD per second for the generation of 720p video content using Pika 2.0 (Scene Ingredients enabled).How can I troubleshoot errors or issues?We have a dedicated support channel for all our API partners to ensure fast and custom responses. Be the first to hear about Pika updatesself.__wrap_n!=1&&self.__wrap_b(":Rpcjts9kq:",1)Get Our NewsletterCompanyAbout UsCareersContact UsPricingBlogAPIConnectDiscordInstagramXYouTubeFacebookTikTokTerms of ServicePika © 2025. All rights reserved.Acceptable Use PolicyPrivacy Policy FAQ Section What does the API suppo