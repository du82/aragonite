["https://pika.art/careers"]
title = "Pika"
description = "The idea-to-video platform that sets your creativity in motion."
full_description = "About UsCareersAPITry PikaAbout UsCareersAPISign InTry PikaCAREERSWork with usWe're revolutionizing video creation to be seamless and accessible for everyone. Our small, dynamic team values efficiency, collaboration, and creativity. We're seeking individuals with intellect, work ethic, and ambition to join us in breaking down barriers and making a real impact. Experience career growth in a culture that fosters both individual and collective development.Our headquarters are located in Palo Alto, CA.Apply for open roles EngineeringFull-Stack EngineerSummary:In search of a dynamic Full-Stack Engineer to take the reins of our product and backend engineering. The ideal candidate is a versatile technologist capable of managing and executing a broad spectrum of engineering tasks.Job Responsibilities:Lead the charge in developing cutting-edge full-stack web and mobile applications, ensuring the delivery of user-centric products with seamless functionality.Architect and implement robust backend systems that support scalable and efficient product operations.Demonstrate exceptional versatility in engineering, with the ability to develop internal tools, enhance product features through automation, and support various technological needs across the company.Requirements:Extensive experience in full-stack development, evidenced by a strong portfolio of web and mobile applications.Expertise in a wide array of programming languages, development frameworks, and database technologies, with a comprehensive understanding of both frontend and backend best practices.A demonstrated ability to take on a broad range of engineering tasks, from developing internal tools to crafting features that elevate the user experience.A flexible, agile approach to development, with the ability to pivot between projects and adapt to emerging technologies.A problem-solver at heart, ready to tackle complex engineering challenges and contribute to all aspects of the product development lifecycle.Strong communication skills, with the capacity to work collaboratively with cross-functional teams and articulate technical concepts to a variety of stakeholders.Senior Distributed Systems Engineer We are seeking highly skilled engineers with expertise in machine learning, distributed systems, and high-performance computing to join our Research team. In this role, you will collaborate closely with researchers to build and optimize platforms that train next-generation foundation models on massive GPU clusters. Your work will play a critical role in advancing the efficiency and scalability of cutting-edge generative AI technologies. Key ResponsibilitiesScale and optimize systems for training large-scale models across multi-thousand GPU clusters.Profile and enhance the performance of training codebases to achieve best-in-class hardware efficiency.Develop systems to distribute workloads efficiently across massive GPU clusters.Design and implement robust solutions to enable model training in the presence of hardware failures.Build tools to diagnose issues, visualize processes, and evaluate datasets at scale.Optimize and deploy inference workloads for throughput and latency across the entire stack, including data processing, model inference, and parallel processing.Implement and improve high-performance CUDA, Triton, and PyTorch code to address efficiency bottlenecks in memory, speed, and utilization.Collaborate with researchers to ensure systems are designed with optimal efficiency from the ground up.Prototype cutting-edge applications using multimodal generative AI. QualificationsExperience:3+ years of professional experience in ML pipelines, distributed systems, or high-performance computing.Hands-on experience training large models using Python and PyTorch, with familiarity in the full pipeline: data processing, loading, training, and inference.Proven expertise in optimizing and deploying inference workloads, with experience in profiling GPU/CPU code (e.g., Nvidia Nsight).Deep understanding of distributed systems and frameworks, such as DDP, FSDP, and tensor parallelism.Strong experience writing high-performance parallel C++ and custom PyTorch kernels, with knowledge of CUDA and Triton optimization techniques.Bonus: Experience with generative models (e.g., Transformers, Diffusion Models, GANs) and prototype development (e.g., Gradio, Docker).Technical Skills:Proficiency in Python, with significant experience using PyTorch.Advanced skills in CUDA/Triton programming, including custom kernel development and tensor core optimization.Strong generalist software engineering skills and familiarity with distributed and parallel computing systems.Note: This position is not intended for recent graduates. CompensationThe salary range for this role in California is $175,000-$250,000 per year. Actual compensation will depend on job-related knowledge, skills, experience, and candidate location. We also offer competitive equity packages in the form of stock options and a comprehensive benefits plan. ResearchSenior Research Engineer (Data)Summary:We are seeking a Senior Software Engineer to spearhead our data acquisition and management systems, critical to our advanced AI research. In this role, you will architect and maintain efficient pipelines for sourcing, processing, and organizing the extensive datasets that fuel our generative AI models. Your expertise will have a direct and transformative impact on the quality and capabilities of our technology. Key ResponsibilitiesPartner with research teams to understand and address model performance gaps by identifying and leveraging novel data sources.Develop and implement robust data pipelines for acquisition, deduplication, filtering, and pre-training dataset preparation.Collaborate with annotation operations teams to design innovative data filtering strategies and enhance dataset quality.Apply and integrate advanced methodologies such as self-supervised active learning to scale data systems.Lead research projects to improve data quality and drive advancements in video generation models. QualificationsEducation: Bachelor’s or Master’s degree in Computer Science, Software Engineering, or a related field.Experience: 3+ years of experience in managing and curating large-scale datasets, particularly in fields like computer vision, NLP, robotics, or self-driving technologies. Key Skills:Strong proficiency in Python and familiarity with deep learning frameworks such as PyTorch.Experience with large-scale data processing tools, such as SQL or Spark.Hands-on expertise in designing and working with distributed systems.Proven ability to thrive in a fast-paced, research-focused environment and deliver end-to-end project solutions. Note: This position is not intended for recent graduates. CompensationThe salary range for this role in California is $175,000–$250,000 per year. Actual base pay may vary based on factors such as job-related expertise, skills, experience, and candidate location. Additionally, we provide competitive equity packages through stock options and a comprehensive benefits plan. Research Engineer (Applied Research) We are looking for talented individuals who combine exceptional technical machine learning skills with curiosity and a relentless drive to improve. You’ll work on mission-critical projects using large-scale GPUs to bring groundbreaking AI capabilities to life. Key ResponsibilitiesDesign and implement innovative generative AI features for integration into our products.Collaborate with Research and Product teams to fine-tune models, including tasks like dataset creation, model optimization, and evaluation.Build tools and methodologies to evaluate model performance, identify areas for improvement, and implement robust solutions. QualificationsRequired Skills:Strong proficiency in Python with substantial experience using PyTorch.Hands-on experience with visual AI technologies, including diffusion models and Transformers (experience can stem from professional, academic, or open-source projects such as Stable Diffusion).Passion for exploring and experimenting with multimodal generative AI, and familiarity with recent advancements in the field, along with creative ideas for applying research to products.Preferred Experience:1 year+ industrial or academic lab experience.Experience with high-performance, large-scale ML systems. Note: This role is open to recent graduates. CompensationThe salary range for this position in California is $175,000–$200,000 per year. The final offer will be based on job-related expertise, skills, candidate location, and experience. Additionally, we provide competitive equity packages in the form of stock options and a comprehensive benefits plan. Research Engineer (Foundation Model) We are seeking a highly skilled Research Engineer with extensive experience in training Generative AI models. As part of our research team, you will play a key role in building state-of-the-art multimodal foundation models and managing large-scale training runs on thousands of GPUs. Your expertise will directly impact the performance, scalability, and efficiency of our next-generation AI technologies. Key ResponsibilitiesLead and contribute to groundbreaking research in multimodal foundation models.Design, develop, and experiment with innovative algorithms, architectures, and techniques to enhance model performance and scalability.Optimize models for production environments, focusing on computational efficiency, throughput, and latency while maintaining accuracy and robustness.Analyze and manage large-scale data clusters, identifying inefficiencies and bottlenecks in training pipelines and data loading processes.Collaborate with cross-functional teams, including data, applied research, and infrastructure teams, to drive impactful projects. QualificationsTechnical Expertise:Demonstrated strong engineering skills in Python and PyTorch.Hands-on experience building machine learning models from scratch using PyTorch.Familiarity with generative multimodal models such as Diffusion Models and GANs.Solid understanding of foundational deep learning concepts, including Transformers.Preferred Experience:1 year+ industrial or academic lab experience.Experience working with large distributed systems involving 100+ GPUs.Proficiency with Linux clusters, systems, and scripting. Note: This role is open to recent graduates. CompensationThe salary range for this position in California is $175,000–$200,000 per year. The final offer will be based on job-related expertise, skills, candidate location, and experience. Additionally, we provide competitive equity packages in the form of stock options and a comprehensive benefits plan. Research Scientist We are seeking individuals with a proven research track record in areas such as large language models (LLMs), diffusion models, data systems, and distributed computing. QualificationsDeveloping and training generative AI models across modalities, including video, image, text, audio, and 3D.Unlocking the potential of foundational models for applications like editing and controlled generation.On-policy and off-policy reinforcement learning for model optimization and tuning.Innovating efficient training and inference techniques on large-scale distributed systems.Curating and processing datasets for pretraining and fine-tuning. Key Skills:Proficiency in deep learning frameworks, such as PyTorch and/or JAX.This is an onsite position, but remote arrangements may be considered for exceptional candidates. CompensationThe salary range for this role in California is $200,000–$300,000 per year. Actual base pay may vary based on factors such as job-related expertise, skills, experience, and candidate location. Additionally, we provide competitive equity packages through stock options and a comprehensive benefits plan. ProductProduct Design LeadSummary: Pika is seeking a talented and experienced product design lead to join our team. The ideal candidate will have a passion for creating intuitive and visually appealing user experiences that drive product success. As a product design lead at Pika, you will play a key role in shaping our product's look, feel, and functionality, working closely with cross-functional teams. Job Responsibilities:Lead the UI/UX design process from concept to implementation for our product, ensuring a seamless and engaging user experience.Work closely with product managers, technical engineers, and our creative team to define product requirements and specifications.Conduct user research, usability testing, and analysis to improve designs based on user insight.Maintain and evolve design system and style guide to ensure product scalability and consistency. Requirements: Bachelor’s Degree in Design, Human-Computer Interaction, or related field.Minimum 8 years of experience in UI/UX design, with a strong portfolio showcasing your design skills and projects.Proficiency in design tools such as Sketch, Adobe XD, Figma, or similar.Former experience of working at startups is a plus.Strong problem-solving skills and high attention to detail.Excellent communication and collaboration skills, with the ability to work efficiently in fast-paced and team-oriented environments.Ability to handle multiple tasks simultaneously and meet deadlines.Knowledge of front-end technologies such as HTML, CSS is a plus.CompensationThe salary range for this role in California is $175,000–$250,000 per year. Actual base pay may vary based on factors such as job-related expertise, skills, experience, and candidate location. Additionally, we provide competitive equity packages through stock options and a comprehensive benefits plan.Product Manager, CoreSummary: We are looking for a talented and driven Core Product Manager to join our team and help shape the future of our core product offerings. This role is ideal for someone with a passion for consumer apps, community-driven platforms, and social engagement. If you have a creative mindset and a track record of delivering impactful product solutions, we’d love to hear from you!Job Responsibilities:Product Strategy: Define and own the vision, strategy, and roadmap for our core product, ensuring alignment with company goals and user needs.User Insights: Conduct user research and analyze data to understand customer behavior, identify pain points, and uncover new opportunities.Feature Development: Prioritize and drive the development of new features, enhancements, and improvements to create a seamless and engaging user experience.Collaboration: Work closely with cross-functional teams including engineering, design, marketing, and data analytics to execute product initiatives effectively.Community Focus: Build and nurture features that empower our user community and foster engagement.Performance Monitoring: Define and track key performance indicators (KPIs) to measure product success and iteratively improve based on feedback.Project Execution Oversight: Drive execution by man"
