ot responsible for, and disclaims, any and all liability in connection with Content or any act of accessing, browsing, contributing to or otherwise using the Service. In no event will you use the Output to compete with Pika, including to create a competing product or service. This Acceptable Use Policy provides examples of the kinds of Inputs or uses that are illegal or prohibited by Pika. Pika reserves the right to investigate and take appropriate legal action against anyone who, in Pika's sole discretion, violates this provision, including removing the offending content from the Service, suspending or terminating the account of such violators, and reporting the violator to law enforcement authorities.‍GENERAL PROHIBITIONS.We prohibit the creation, display, or transmission of content and use of our Service for any of the following:Deceptive, inaccurate, or misleading content, including using our Service to:Impersonate any person or entity, or falsely state, imply or otherwise misrepresent your affiliation with any person or entity (including by generating, making available, promoting, labeling or otherwise using Output in a manner that suggests that such Output was created by or otherwise associated with an individual who was not the creator thereof).Participate in disinformation campaigns or inauthentic behavior.Solicit personal information from anyone under the age of 18.Post any private information, or otherwise harvest, collect or disclose email addresses or other information about another user or any other person without his or her express consent or for the purposes of sending unsolicited emails or other unsolicited communications.Create content that you know is inaccurate or misleading.Promote, endorse, encourage or facilitate the spread of false information. Imply that Pika endorses any of your Inputs, Outputs, statements or positions.Create deceptive comments or reviews.Illegal, abusive, or fraudulent content, including using our Service to:Promote unlawful activities such as drug use, hacking, or other crimes or activities that are illegal in nature.Provide legal, medical, or financial advice without the necessary qualifications.Violate any individual’s rights, including privacy or publicity rights.Defame any individual or business.Interfere with or disrupt the Service or servers or networks connected to the Service, or disobey any requirements, procedures, policies, or regulations of networks connected to the Service.Obtain or attempt to access or otherwise obtain any content or information through any means not intentionally made available or provided for through the Service.Use the Services (and any Output) to create, develop or improve any competing products or services or to power, enable or train other artificial intelligence and machine learning models, tools or technologies.Engage in or use any data mining, robots, spider, crawlers, avatars, scraping, or similar data gathering or extraction methods.Use any metatags or other “hidden text” using our name or trademarksNegatively impacting the Service.Violate any applicable local, state, national, or international law, or any regulations having the force of lawChild exploitation, abuse or harm. We strictly ban any content or use of our Service that seeks to exploit, abuse or harm minors.Political campaigning or lobbying purposes, including any manipulation or attempted manipulation of governments or elections. We strictly ban any content or use of our Service for these purposes.Psychologically or emotionally harmful content, including using our Service to:Promote self-harm.Shame, humiliate, bully, or harass individuals.Create sexist, racist, homophobic, transphobic, ableist, ageist or otherwise discriminatory jokes and languageSexually explicit or otherwise inappropriate content, including using our Service to:Produce pornographic material or content for sexual gratification.Violent, hateful, or threatening content, including using our Service to:Threaten or promote violence or terrorism.Describe or encourage violent acts against people, animals, or property.Promote hate speech or discrimination, including based on attributes such as race, religion, gender, age, nationality, or sexual orientation.Threaten or undermine democratic processes or institutions. Advertise or offer to sell or buy any goods or services for any business purpose that is not specifically authorized.Any other content that, in our sole discretion, contradicts our values or is objectionable.You agree to not use the Service to submit, upload, transmit or otherwise make available any Inputs or direct the Service to generate any Output that:Infringes any intellectual property or other proprietary rights of any party.You do not have a right to upload and use under any law or under contractual or fiduciary relationships. Contains software viruses or any other computer code, files or programs designed to interrupt, destroy, or limit the functionality of any computer software or hardware or telecommunications equipment. Poses or creates a privacy or security risk to any person. constitutes unsolicited or unauthorized advertising, promotional materials, commercial activities and/or sales, "junk mail," "spam," "chain letters," "pyramid schemes," "contests," "sweepstakes," or any other form of solicitation. Is (or is used for or in connection with any purpose, initiative, activity, product or service that is) unlawful, harmful, threatening, abusive, harassing, tortious, excessively violent, defamatory, vulgar, obscene, pornographic, libelous, invasive of another's privacy, hateful, discriminatory, or otherwise objectionable. In the sole judgment of Pika, is objectionable or which restricts or inhibits any other person from using or enjoying the Service, or which may expose Pika or its users to any harm or liability of any type.USE OF PHOTOGRAPHS OR PORTRAITS. Through our Service you may upload photographs or portraits containing images of real individuals to create videos. Videos created with our Service must respect the rights of others and be used for permissible purposes only.Ownership: You are responsible for ensuring that the photographs or portraits you upload do not infringe on any laws, third-party rights, our Terms of Service, or this Acceptable Use Policy. You must have the necessary rights or consents for images used in video creation. You may only submit your own photographs or portraits or those of others with explicit consent. You are solely responsible for ensuring that you have all of the necessary rights and consents for the photographs or portraits that you utilize when creating a video.Prohibited photographs or portraits: In addition to the prohibitions listed above, we strictly forbid photographs or portraits that: Represent real individuals, including celebrities and politicians, without their explicit consent.Represent, or appear in our sole discretion to represent, individuals under the age of 18.Display illegal, defamatory, sexually explicit, violent, or deceptive imagery. Infringe on copyrighted images without the owner’s consent.UPDATES AND CHANGES TO THIS ACCEPTABLE USE POLICY. We may revise this Acceptable Use Policy from time to time in response to various factors, including but not limited to technical advancements, societal changes, legal requirements, or user feedback. When changes are made, they will take effect immediately upon being posted on this page. Your continued use of our Service constitutes acceptance of this Acceptable Use Policy, including any modifications. We encourage you to review this Acceptable Use Policy periodically for any updates.'''
