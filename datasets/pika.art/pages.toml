title = "Privacy Policy"
full_description = 'PRIVACY POLICYLast Updated: December 2, 2024INTRODUCTION.This Privacy Policy describes how Mellis, Inc. ("Pika," "we," “us” or "our") processes personal information that we collect through our digital or online properties or services that link to this Privacy Policy (including, as applicable, the Pika text-to-video generator platform, our website, mobile app, social media pages, marketing activities, live events and other activities), marketing activities, and other activities described in this Privacy Policy (collectively, the “Service”). Capitalized terms not defined in this Privacy Policy are defined in our Terms of Service.This Privacy Policy does not apply to personal data about Pika employees and candidates, and certain contractors and agents acting in similar roles.Changes. We may update this Privacy Policy from time-to-time to reflect changes in legal, regulatory, operational requirements, our practices, and other factors. Please check this Privacy Policy periodically for updates. If any of the changes are unacceptable to you, you should cease interacting with us. When required under applicable law, we will notify you of any changes to this Policy. Any modifications to this Privacy Policy will be effective upon our posting the modified version (or as otherwise indicated at the time of posting). In all cases, your use of the Service after the effective date of any modified Privacy Policy indicates your acknowledging that the modified Privacy Policy applies to your interactions with the Service and our business.INFORMATION WE COLLECT.Information you provide to us. Some features of the Services may require you to provide certain information. You may elect not to provide this information, but doing so may prevent you from using or accessing these features. Information you may provide to us directly through the Service or otherwise includes:- Contact data, such as your first and last name, email address, billing and mailing addresses, and phone number.- Demographic data, such as your city, state, country of residence, postal code, and age.- Profile data such as the username and password that you may set to register an Account on the Service, date you registered an Account, redemption code, biographical details, photograph or picture, links to your profiles on social networks, interests, preferences, information about your participation in our contests, promotions, or surveys, and any other information that you add to your account profile.- Communications data based on our exchanges with you, including when you contact us through the Service, communicate with us via social media or otherwise.- Marketing data, such as your preferences for receiving our marketing communications and details about your engagement with them.- User-generated content data, such as photos and videos posted on the Service, “likes” of content posted by other users, comments, questions and messages, including any public or private chats, that you post or transmit through the Service(“UGC”). We or others may store, display, reproduce, publish, or otherwise use UGC, and may or may not attribute it to you. Others, including other users, may also have access to your UGC and may have the ability to share it with third parties. If you choose to submit UGC to any public area of the Service, your UGC will be considered “public” and will be accessible by anyone, including us.- Biometric data, such as voice data and scans of faces that you submit when you use certain product features to create videos and audio using characteristics like voice and face. Such characteristics may be considered biometric identifiers or biometric information under certain laws including applicable privacy laws. When you choose to use these features, we use any biometric data submitted by you only to provide the service requested by you.- Networks and connections, such as information about the people and accounts you are connected to and how you interact with them on the Service, such as the accounts of other users that you follow.- Your Inputs and Outputs, such as text, images and video inputs and other prompts you provide, and the videos and other outputs you create. We also collect certain metadata, including information that users can add or can have added to their content, such as keywords, geographical or location information, and other similar data. This content and metadata may constitute or contain personal information, depending on the substance and how it is associated with your account.- Payment and subscription data, needed to complete transactions and process your subscription, such as your payment card or bank account information (collected by our payment processors on our behalf) and transaction history. - Other data that you provide to us, which we will use as described in this Privacy Policy or as otherwise disclosed at the time of collection.Third-party sources. We may collect or receive personal information from other sources, such as:- Marketing and event partners, such as joint marketing partners and event co-sponsors.- Login integration partners, when you choose to access the Services through your email account. These partners provide data such as your name, username, email address, profile picture, and additional account information that is publicly accessible.- Other sources, such as social media services, public records, service providers, and other publicly available sources.Automatic data collection. We, our service providers, and our business partners may automatically collect information about you, your computer or mobile device, and your interaction over time with the Service, our communications and other online services, such as:- Device data such as your computer or mobile device’s operating system type and version, manufacturer and model, browser type, screen resolution, RAM and disk size, CPU usage, device type (e.g., phone, tablet), IP address, unique identifiers, language settings, mobile device carrier, radio/network information (e.g., Wi-Fi, LTE, 3G), and approximate location information such as city, state or geographic area.- Online activity data, such as pages or screens you viewed, how long you spent on a page or screen, the website you visited before browsing to the Service, navigation paths between pages or screens, information about your activity on a page or screen, access times and duration of access, and whether you have opened our emails or clicked links within them.- Communication interaction data such as your interactions with our email, text or other communications (e.g., whether you open and/or forward emails) – we may do this through use of pixel tags (which are also known as clear GIFs), which may be embedded invisibly in our emails.Cookies and similar technologies. Some of the automatic collection described above is facilitated by the following technologies:- Cookies, which are small text files that websites store on user devices and that allow web servers to record users’ web browsing activities and remember their submissions, preferences, and login status as they navigate a site. Cookies used on our sites include both “session cookies” that are deleted when a session ends, “persistent cookies” that remain longer, “first party” cookies that we place and “third party” cookies that our third-party business partners and service providers place.- Local storage technologies, like HTML5, that provide cookie-equivalent functionality but can store larger amounts of data on your device outside of your browser in connection with specific applications.- Web beacons, also known as pixel tags or clear GIFs, which are used to demonstrate that a webpage or email was accessed or opened, or that certain content was viewed or clicked.Data about others. We may offer features that help users invite others to use the Service, and we may collect contact details about these invitees so we can deliver their invitations. Please do not refer someone to us or share their contact details with us unless you have their permission to do so.HOW WE USE YOUR PERSONAL INFORMATION.‍We may use your personal information for the following purposes or as otherwise described at the time of collection:Service delivery and operations. We may use your personal information to:- provide, operate and improve the Service (including to train our artificial intelligence models) and our business;- personalizing our products and the services, including remembering the devices from which you have previously logged in and remembering your selections and preferences as you navigate the Service;- establish and maintain your user profile on the Service;- facilitate your invitations to contacts who you want to invite to join the Service,and enable you to connect with and interact with content posted by other users on the Service;- enable security features , such as by sending you security codes via email or SMS, and remembering devices from which you have previously logged in;- communicate with you about the Service, including by sending Service-related announcements, updates, security alerts, and support and administrative messages;- communicate with you about events or contests in which you participate;- understand your needs and interests, and personalize your experience; and- provide support for the Service, and respond to your requests, questions and feedback.Research and development. We may use your personal information for research and development purposes, including to analyze and improve the Service and our business and to develop new products and services.Marketing and advertising. We, our service providers, and our third-party advertising partners may collect, receive and use your personal information for marketing and advertising purposes.- Direct marketing. We may send you direct marketing communications and may personalize these messages based on your needs and interests. You may opt-out of our marketing communications as described in the Opt-out of marketing below.- Interest-based advertising. Our third-party advertising partners may use cookies and similar technologies to collect information about your interaction (including the data described in the automatic data collection section above) with the Service, our communications and other online services over time, and use that information to serve online ads that they think will interest you. This is called interest-based, or targeted, advertising. We may also share information about our users with these companies to facilitate interest-based advertising to those or similar users on other online platforms.Improvement and analytics. We may use your personal information to analyze your usage of the Service, improve the Service and the rest of our business, help us understand user activity (including which pages are most and least visited and how visitors move around the Service, as well as user interactions with our emails) and to develop new products and services.Compliance and protection. We may use your personal information to:- comply with applicable laws, lawful requests, and legal process, such as to respond to subpoenas, investigations or requests from government authorities;- protect our, your or others’ rights, privacy, safety or property (including by making and defending legal claims);- audit our internal processes for compliance with legal and contractual requirements or our internal policies;- enforce the terms and conditions that govern the Service; and- prevent, identify, investigate and deter fraudulent, harmful, unauthorized, unethical or illegal activity, including cyberattacks and identity theft.With your consent. In some cases, we may collect, use or share your personal information with your consent or at your request or direction.To create aggregated, de-identified and/or anonymized data. We may create aggregated, de-identified and/or anonymized data from your personal information and other individuals whose personal information we collect, and use and share this information with third parties for our lawful business purposes, including to analyze and improve the Service, train our proprietary algorithms and other machine learning purposes, and promote our business.Cookies and similar technologies. In addition to the other uses included in this section, we may use the Cookies and similar technologies described above for the following purposes:- Technical operation. To allow the technical operation of the Service, such as by remembering your selections and preferences as you navigate the site, and whether you are logged in when you visit password protected areas of the Service.- Functionality. To enhance the performance and functionality of our services.- Advertising. To help our third-party advertising partners show you ads on other online services they believe will interest you and measure and analyze the performance of ads.- Analytics. To help us understand user activity, including which pages are most and least visited and how visitors move around the Service, as well as user interactions with our emails. For example, we may use Google Analytics for this purpose. You can learn more about Google Analytics and how to prevent the use of Google Analytics relating to your use of our sites here: https://tools.google.com/dlpage/gaoptout?hl=en.Retention. We generally retain personal information to fulfill the purposes for which we collected it, including for the purposes of satisfying any legal, accounting, or reporting requirements, to establish or defend legal claims, or for fraud prevention purposes. To determine the appropriate retention period for personal information, we may consider factors such as the amount, nature, and sensitivity of the personal information, the potential risk of harm from unauthorized use or disclosure of your personal information, the purposes for which we process your personal information and whether we can achieve those purposes through other means, and the applicable legal requirements. We may store aggregated, de-identified and/or anonymized data for as long as needed for our lawful business purposes.We will retain biometric data for no longer than the earlier of the date the initial purpose for collecting the data is satisfied or within three years of the deletion of your account.HOW WE DISCLOSE YOUR PERSONAL INFORMATION.We may disclose your personal information with the following parties and as otherwise described in this Privacy Policy, in other applicable notices, or at the time of collection.Other users and the public. Your profile, UGC data, and user input and output data may be visible to other users of the Service and the public. For example, other users of the Service or the public may have access to your information (i.e. photos or videos that you upload to the Service if you agree to make your profile and outputs or other information available to them through the Service. This information can be seen, collected and used by others, including being'
