h as the browser type, language preference, referring site, and the date and time of each visitor request. Ping Bot's purpose in collecting non-personally identifying information is to better understand how Ping Bot's visitors use its website. From time to time, Ping Bot may release non-personally-identifying information in the aggregate, e.g., by publishing a report on trends in the usage of its website. Ping Bot also collects potentially personally-identifying information like Internet Protocol (IP) addresses. Ping Bot does not use such information to identify its visitors, however, and does not disclose such information, other than under the same circumstances that it uses and discloses personally-identifying information, as described below. We may also collect and use IP addresses to block users who violated our Terms of Service. Gathering of Personally-Identifying Information Certain visitors to Ping Bot's websites choose to interact with Ping Bot in ways that require Ping Bot to gather personally-identifying information, such as names and email addresses. The amount and type of information that Ping Bot gathers depends on the nature of the interaction. Ping Bot collects such information only insofar as is necessary or appropriate to fulfill the purpose of the visitor's interaction with Ping Bot. Ping Bot does not disclose personally-identifying information other than as described below. And visitors can always refuse to supply personally-identifying information, with the caveat that it may prevent them from engaging in certain Service-related activities. Additionally, some interactions, such as posting a comment, may ask for optional personal information. For instance, when posting a comment, may provide a website that will be displayed along with a user's name when the comment is displayed. Supplying such personal information is completely optional and is only displayed for the benefit and the convenience of the user. Aggregated Statistics Ping Bot may collect statistics about the behavior of visitors to and users of the Service. For instance, Ping Bot may monitor and store data about the most popular parts of the Ping Bot Site, the most commonly monitored vendors, aggregated uptime data, or other statistics. Ping Bot may display this information publicly or provide it to others. In addition, Ping Bot may, from time to time, collect certain personal information from you or your company, your use of the Services, and/or your monitored services (your "Data"). Ping Bot may publish and display your Data in the aggregate to the public through our Site or on our blog, e.g. by publishing a report on average downtime on the Site. However, all Data is only used and published in the aggregate which means that any published Data will not identify you, your website, your company or your users, or link you to the published information in any way. Ping Bot does not disclose personally-identifying information other than as described below. Protection of Certain Personally-Identifying Information Ping Bot discloses potentially personally-identifying and personally-identifying information only to those of its employees and contractors that (i) need to know that information in order to process it on Ping Bot's behalf or to provide services available at Ping Bot's Site websites, and (ii) that have agreed not to disclose it to others. Some of those employees and contractors may be located outside of your home country; by using the Service, you consent to the transfer of such information to them. Ping Bot will not rent or sell potentially personally-identifying and personally-identifying information to anyone. Other than to its employees, contractors, and affiliated organizations, as described above, Ping Bot discloses potentially personally-identifying and personally-identifying information only when required to do so by law, or when Ping Bot believes in good faith that disclosure is reasonably necessary to protect the property or rights of Ping Bot, third parties or the public at large. If you are a registered user of the Service and have supplied your email address, Ping Bot may occasionally send you an email to tell you about new features, solicit your feedback, or just keep you up to date with what's going on with Ping Bot and our products. We primarily use our website and blog to communicate this type of information, so we expect to keep this type of email to a minimum. If you send us a request (for example via a support email or via one of our feedback mechanisms), we reserve the right to anonymize and publish it in order to help us clarify or respond to your request or to help us support other users. Ping Bot takes all measures reasonably necessary to protect against the unauthorized access, use, alteration or destruction of potentially personally-identifying and personally-identifying information. Monitoring Internet Connected Resources In order to properly monitor response time, uptime, and other metrics, Ping Bot will periodically access your website, API, or other internet-connected resources using the access method provided to it by you. This access method may include HTTP, HTTPS, TCP, or some other protocol specified by you or the resource being accessed. Access to your resources will stop when you remove your resource from the Ping Bot Service. In order to provide monitoring services, Ping Bot may require you to provide credentials to access your resources. These credentials may include API keys, usernames, passwords, or other access tokens. You are responsible for providing these credentials in a secure manner, and Ping Bot will not be held responsible for any data breaches or other security issues that may arise from the use of these credentials. You should provide credentials with the least amount of privilege necessary for Ping Bot to perform its monitoring tasks. You may revoke access to your resources at any time by removing your resource from the Ping Bot Service. Ping Bot will store your credentials in a secure manner, using encryption and other security measures to protect your data as specified in the Service. However, no security measures are perfect, and Ping Bot cannot guarantee the complete security of your data. You provide your credentials to Ping Bot at your own risk. Ping Data Access, Usage, and Storage Upon being given access to a resource for monitoring purposes, Ping Bot may access, measure, or store the following information from your monitored resource: Response time data Uptime data Error data Endpoint data (such as IP address, domain, or URL) Resource metadata (such as name, description, tags, location, or other data) Logs, traces, or other data generated by the resource Access to your monitor and ping data is used as described in previous sections of this Privacy Policy, as well as the following: Notify you of downtime or other issues with your monitored resources Provide you with reports, metrics, or other data about your monitored resources Aggregate and anonymize your data for use in reports, metrics, or other data about the Service Provide you with access to your data through the Service Cookies A cookie is a string of information that a website stores on a visitor's computer, and that the visitor's browser provides to the Service each time the visitor returns. Ping Bot uses cookies to help Ping Bot identify and track visitors, their usage of Ping Bot Service, and their Service access preferences. Ping Bot visitors who do not wish to have cookies placed on their computers should set their browsers to refuse cookies before using Ping Bot's websites, with the drawback that certain features of Ping Bot's websites may not function properly without the aid of cookies. Business Transfers If Ping Bot, or substantially all of its assets, were acquired, or in the unlikely event that Ping Bot goes out of business or enters bankruptcy, user information would be one of the assets that is transferred or acquired by a third party. You acknowledge that such transfers may occur, and that any acquirer of Ping Bot may continue to use your personal information as set forth in this policy. Data Transmission, Security, and Storage Ping Bot uses third party vendors and hosting partners to provide the necessary hardware, software, networking, storage, and related technology required to run the Service. You understand that although you retain full rights to your data, it may be stored on third party storage and transmitted through third party networks. It is extremely difficult to guarantee the complete security of data transmitted through the Internet, via mobile devices, or through the physical transfer of information. While we will take precautions to limit security risks, we can not fully eliminate all security risks associated with personal information. We do not guarantee or warrant the security of any data or information transmitted to us by you, and you do so at your own risk. Privacy Policy Changes Although most changes are likely to be minor, Ping Bot may change its Privacy Policy from time to time, and at Ping Bot's sole discretion. Ping Bot encourages visitors to frequently check this page for any changes to its Privacy Policy.'''
