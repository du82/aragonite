["https://pins.rstudio.com/reference/legacy_datatxt.html"]
title = 'Remote "data.txt" board (legacy API) — legacy_datatxt • pins'
full_description = '''Remote "data.txt" board (legacy API) Source: R/legacy_datatxt.R legacy_datatxt.Rd Usage legacy_datatxt( url, headers = NULL, cache = NULL, needs_index = TRUE, browse_url = url, index_updated = NULL, index_randomize = FALSE, path = NULL, versions = FALSE, name = NULL, ... ) board_register_datatxt(url, name = NULL, headers = NULL, cache = NULL, ...) Arguments url Path to the data.txt file or directory containing it. headers Optional list of headers to include or a function to generate them. cache Cache path. Every board requires a local cache to avoid downloading files multiple times. The default stores in a standard cache location for your operating system, but you can override if needed. needs_index Does this board have an index file? browse_url Not currently used index_updated Callback function used to update index index_randomize When retrieving data.txt at a parameter with random query string to defeat caching? path Subdirectory within url versions Should this board be registered with support for versions? name An optional name used identify the board. This is no longer generally needed since you should be passing around an explicit board object. ... Additional parameters required to initialize a particular board. Details Use board that for a website that uses the data.txt specification. A data.txt file is a YAML that provides some basic metadata about a directory of files. Examples # register website board using datatxt file board_register_datatxt( url = "https://datatxt.org/data.txt", name = "txtexample", cache = tempfile() ) #> Warning: `board_register_datatxt()` was deprecated in pins 1.4.0. #> ℹ Learn more at <https://pins.rstudio.com/articles/pins-update.html> # find pins pin_find(board = "txtexample") #> Warning: `pin_find()` was deprecated in pins 1.4.0. #> ℹ Please use `pin_search()` instead. #> name #> 1 iris #> 2 mtcars #> description #> 1 This famous (Fisher's or Anderson's) iris data set gives the measurements in centimeters of the variables sepal length and width and petal length and width, respectively, for 50 flowers from each of 3 species of iris. The species are Iris setosa, versicolor, and virginica. #> 2 The data was extracted from the 1974 Motor Trend US magazine, and comprises fuel consumption and 10 aspects of automobile design and performance for 32 automobiles (1973–74 models). #> type board #> 1 table txtexample #> 2 table txtexample'''
