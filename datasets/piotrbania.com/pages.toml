title = "[: www.piotrbania.com :] CODENAME: ASLAN (4514N)"
description = "a little bit of security"
full_description = "Integration means that firstly target file is disassembled to pieces (it creates a chain which connects the body of target file), then we move that chain, we do everything we want (i call this step InverseKinematics, just because i'm an 3d graphics hobbyst) and then we compile the chain again. Such horrible modified application runs perfectly, moreover it is almost impossible to disinfect the modified target. So tell me, do you want to compile a rootkit inside of yours ndis.sys? :) I don't want to speak much about the metamorphic engine since it is not 100% ready yet. But the main thing you should know it is mostly based on the emulation process (and as far as i know it is the first metamorphic engine which does so), and many of the muation states are based on the Automaton Theory (which inspired me a lot). Lets consider the rest of the features as an future surprise :) So far project includes: + own x86 disassembler + own x86 assembler + own x86 emulator + convertor from IDA disassembly to internal 4514N databases. + some cool gui, written by hand :)"
