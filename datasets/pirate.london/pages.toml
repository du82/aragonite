title = "Access AWS-managed InfluxDB with an ALB and Cognito security | by Chris Monteiro | pirate dot london"
description = "Due to AWS recently launching a managed instance of InfluxDB, this is allowing us to move from my janky EC2 InfluxDB instance into their SAAS offering. Being a new product, AWS only currently has a…"
full_description = "Access AWS-managed InfluxDB with an ALB and Cognito securityChris Monteiro·FollowPublished inpirate dot london·2 min read·Apr 9, 2024--ListenShareDue to AWS recently launching a managed instance of InfluxDB, this is allowing us to move from my janky EC2 InfluxDB instance into their SAAS offering.Being a new product, AWS only currently has a guide for connecting to the instance via a SSH tunnel or VPN which is no good for a product where you need to share metric dashboards with the business. Fortunately I had already placed my EC2 Influx DB behind AWS Cognito and ALB and it was simple to extend to the AWS managed version.Alas, because Terraform does not yet support this new service, I had to create the timestream database via the CLI for now, but the rest can be built programatically.With the endpoint IP resolved to a private VPC IP, it can now be used as an IP target.Solution:TL;DR — Just resolve the internal IP of the Influx endpoint and point your ALB target group to it. Now you can easily access your timestream web application!"
