["https://pirate.london/cam-and-nothing-to-hide-techno-horror-film-reviews-ae5191c06c56"]
title = "“Cam” and “ Nothing to Hide” — techno-horror film reviews | by Chris Monteiro | pirate dot london"
description = "I continue to suckle on the ever-so convenient teat of Netflix, in search of technologically-woke programming, exploring contemporary dystopian technological trends. Black Mirror has to remain the…"
full_description = "“Cam” and “ Nothing to Hide” — techno-horror film reviewsChris Monteiro·FollowPublished inpirate dot london·3 min read·Nov 25, 2018--ListenShareI continue to suckle on the ever-so convenient teat of Netflix, in search of technologically-woke programming, exploring contemporary dystopian technological trends. Black Mirror has to remain the standard-bearer, but newcomers like Maniac and even Unfriended have a lot to say about our hidden socio-technological co-dependence.CamMadeline Brewer, whom you may recognise as ‘Ofwarren/Janine’ from the Handmaid’s Tale plays an up-and-coming cam girl, hoping to make it big on a fictional cam streaming site.Whilst things inevitably go horribly, horribly, wrong, the influence of writer Isa Mazzei, herself a former cam girl comes through well exploring the ‘normal’ pressures such sex workers suffer from — stalkers, personal safety, disbelief from the police, meeting fans, reuploads of their shows and the complex and evolving relationships with their on and offline identities they manage with their families.*spoilers follow*The main twist in the show is very similar to classic anime Perfect Blue, when the protagonist finds her cam site identity stolen and that someone is somehow streaming lives show with increasingly sinister overtones. It’s never revealed whether this is caused by some modern deep fakes-style video technology, some sinister cam girl trafficking cartel or super natural phenomenon, but the horror of having your identity and your business stolen from you is well realised on screen.Nothing to HideMaintenant, une critique en français! Non? Mais regard — la singe est sur la branche…French drama ‘Nothing to Hide’ features a simple premise (developed in Italian Cinema), what if a group of friends and partners who have known each over for a number of years decided to ‘play a game’ and share each and every phone interaction with the group for the evening? Who’s got something to hide? Why? Is secrecy in a romantic relationship healthy or unhealthy? How far would you cover for someone? How much is ‘normality’ of social interaction brokered through presenting the selective self over the brutally honest self?IMDB, what are you doing?*minor spoilers follow*The film is comfortably dubbed from French to English, however it’s not long before our protagonists are on-upping one another on food, consuming wine and performing dramatically timed face slaps to multiple case of sexual and emotional indiscretion as well as accusations of professional hypocrisy.The resolution is questionably hand-waved with effectively ‘it was all an eclipse-induced dream’ triggering a big emotional-reset on the whole affair.ConclusionsThe dichotomy between what is online and ‘fake’ and what is offline and ‘real’ is something heading into mainstream social, legal and political discourse after being sidelined for many years previously.Like with most questions around moral ‘truth’, there is no simply right and wrong, but a conversation that needs to be had."
