["https://pirate.london/everything-belongs-to-the-future-a-review-27b00eb3360b"]
title = "Everything Belongs to the Future — a review | by Chris Monteiro | pirate dot london"
description = "I have a soft spot for Laurie Penny, ever since briefly meeting her an Open Rights Group protest against the Digital Economy Bill in 2010. She’s an increasingly outspoken feminist and columnist these…"
full_description = "Everything Belongs to the Future — a reviewChris Monteiro·FollowPublished inpirate dot london·3 min read·Sep 10, 2018--ListenShareI have a soft spot for Laurie Penny, ever since briefly meeting her an Open Rights Group protest against the Digital Economy Bill in 2010. She’s an increasingly outspoken feminist and columnist these days, I enjoy following her regularly piss off establishment figures with her unashamedly liberal and progressive views.Her 2016 foray into life extension politics and futurist fiction in Everything Belongs to the Future wasn’t something I could pass up for long, as this is my jam — I knew we wouldn’t see eye-to-eye on this one.The book takes place in Oxford, 2098 where a strange technological and political stasis has set in. Some skilled world building is employed though the medium of future letters from prison and the juxtaposition of ancient Oxford halls with dystopian surveillance and implant technologies.A literal plucky band of misfit anarchists must steal the ingredients for a closely guarded longevity drug to subvert I’m assuming the Conservative’s 80th successive year in office — and when that doesn’t work they start killing people. A lot of people.*spoilers follow*The main problem I had with the plot was, similar to Altered Carbon, one is expected to root for deathist terrorists who ultimately spread a bioweapon to age and kill the unworthy rich elites across the globe.These elites are hoarding powerful longevity drugs for themselves, in a fashion similar to Elysium, are implicitly using the immortality to entrench their class privilege into some kind of 1984-esque ‘inner party’ type set up.The motivations of the masters of the longevity drug are never explored, except through the loathsome character of ‘Alex’, a long term undercover corporate spy who strikes up an intimate relationship with one of the deathist anarchists, an action truly uncomfortable to myself given my deep distrust of the police— and to the author herself!“Not until it’s available for everyone” is the rational given by the protagonists for not partaking in stolen longevity treatments. Yet when their plan for develop a patent-free alternative fails, they decide to move on to murder and maiming instead. Even assuming a dystopian totalitarian society, we are to assume there is not a thriving black market in this drug?Cory Doctorow’s involvement in the book confuses me. Whilst he’s well known for his anti-copyright and anti-patent positions, he’s also a transhumanist and therefore we can assume life extension advocate. Certainly, one could twist Everything Belongs to the Future in a cautionary tale of contemporary patent, corporatist, policing and totalitarian trends run amuck, and claim not to revel in the thoughts of the rich and privileged dying horribly — but I wasn’t convinced.I would urge the likes of Laurie Penny and those of the progressive left to realise that life extension therapies will not inevitably lead to an immovable oligarchy, but to a world of biohackers, transhumanist anarchists, and uh, people like me. There needn’t be a gerontocracy, drugs monopoly and the laws of mathematics can win in the long turn against state surveillance.Living longer and healthier is a good thing. Embrace and shape the future, don’t burn it down because it seems simpler than tackling the problems it may bring."
