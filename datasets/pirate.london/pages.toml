description = "It’s just scam to steal Bitcoin. There are no dark web or other internet murder for hire services openly advertising anywhere. It is an urban legend perpetuated by poor quality journalism, bloggers…"
full_description = "CBS 48 Hours ‘Click for a Killer’ FAQWere you featured in a recent US documentary for CBS 48 hours ‘Click for a Killer’?Chris Monteiro·FollowPublished inpirate dot london·3 min read·Sep 29, 2018--1ListenShareYesAre you an ‘Eccentric white hat hacker’ or ‘scourge of the internet’?Whatever.Is it a real murder for hire site?It’s just scam to steal Bitcoin. There are no dark web or other internet murder for hire services openly advertising anywhere. It is an urban legend perpetuated by poor quality journalism, bloggers and YouTubers.Did you do everything in the show they discussed?I don’t know, I’ve not fact checked everything. Maybe.Did you hack a website?That would be a eccumenical matter.Did someone else hack the website?bRpsd, cheers dude.Are you directly working with the police?Not in the UK. The UK’s NCA are not interested in working with data potentially obtained in violation of the computer misuse act.Reform the law. Reform the police.Are you working with the media?Yes, principally CBS 48 Hours and Wired UK. Also Australian journalist Eileen Ormsby. I’m open to other arrangements, especially in Canada, Germany, Colombia, India or China.I will make time for journalists who are willing to refer murder plots to relevant local police departments in their areas.Are you secretly running these websites?No. Yura is going around impersonating me saying this. His terrible grasp of the English language gives him away.What will you be doing with all the murder-plot data you have intercepted?Attempting to continue to route it to the would-be victims via the media and any law enforcement agency who will work with me.Why don’t you contact the would-be-victims directly?I have a day job. This is stressful enough as it is.Why don’t you bring on more people to help get the information to people at risk?Anyone whom I work with who is not working a professional journalistic or law enforcement capacity may be guilty of breach of the computer misuse act and liable to be arrested.Yes, this is some kafkaesque bullshit.How many people used the site and which countries?I will likely release aggregated data in time.What sort of requests did people make through the site?Lots of sick shit. I may or may not publish information about this.How much money has the site made?Some figure over $1,000,000 but I’m not sure.How much money have you made throughout the course of your investigation?I’ve made no money investigating the site or working with the media. CBS once bought me lunch.Do you have a day job?I’m a systems administrator and I work in central London.Any specific people using the site with interesting stories?Loads. Publishing this information will be a very slow process though due to ongoing investigations and not wanting to expose myself to further legal liability.What are the police doing to investigate these sites?They are not investigating these sites as far as I’m aware.Why is the police not investigating this site?‘Yura’ claims the police struck a deal in 2017 whereby they receive a few details on murder plots in exchange for not investigating him.This has been a terrible deal as most names don’t get passed over and people are still at risk as evidenced by my investigation.How many people have died in relation to the website?Two that I’m aware of. Both of whom I tried and failed to protect.How many people are still potentially in danger?Over 100.Have you done related research in this area?Yes, see past blog posts and more. Here’s me doing a talk on the subject:Where can I read more about what you’re up to?This blog pirate.london [ About page ]My Twitter: twitter.com/Deku_shrubReddit: /u/Deku-shrub/People claiming to be me on random blog comments are not me."
