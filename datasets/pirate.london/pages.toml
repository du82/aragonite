full_description = "Murder-for-hire statisticsChris Monteiro·FollowPublished inpirate dot london·1 min read·Sep 28, 2019--ListenShareI have created a >>> public spreadsheet <<<of my murder-for hire investigations grouped by country from early 2018 to September 2019.I hope this will stimulate discussions within law enforcement around the world about the scope of the challenges I’ve had in distributing this data.I have chosen to withhold certain statistics for now on the basis of knowledge of active and potentially active investigations that I don’t want to impact and thus have marked these as ‘confidential’.Feedback I receive from different stakeholders will dictate my publishing, distribution and cooperation schedules on a jurisdiction-by-jurisdiction basis.If you are a local journalist or member of law enforcement and you’re interested in receiving the data and investigating it, get in touch and I’ll see what I can do. Please give details of your location and/or local connections so I can be sure you will action the data and not mishandle it.Do not try to murder people via the internet.Updates"
