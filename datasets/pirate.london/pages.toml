["https://pirate.london/g-suite-team-drive-sharing-yes-you-can-not-you-cant-yes-you-can-db0a4e3e6220"]
title = "G Suite Team drive folder sharing —no you can’t — yes you can | by Chris Monteiro | pirate dot london"
description = "TL;DR — Encourage your users to sign in with their corporate account as their default account and then they can link to already shared folders reliably! As previously established, I successfully…"
full_description = "G Suite Team drive folder sharing —no you can’t — yes you canChris Monteiro·FollowPublished inpirate dot london·3 min read·Nov 9, 2018--12ListenShareUpdate — Shared folders in shared drives now in beta, maybe with opportunistically access urls too?TL;DR — Encourage your users to sign in with their corporate account as their default account and then they can link to already shared folders reliably!As previously established, I successfully moved my company onto G Suite last year and everyone’s using it productively these days.Unfortunately, the slow-moving nature of elements of the product means there are number of functional and documentation gaps in the feature set. Let’s take folder sharing to start.SharingLiesRealityAccount priorityConclusionsSharingGoogle loves you sharing your corporate team drives:They are also happy for you to share any individual file:However, try and share a folder in your team drive and they’re like:LiesIn fact, many blogs have been written saying that team drive sharing is impossible:How to enable folder sharing in Team Drives?At the moment is not possible, but you can add the users to the Team Drive if you’d like to share it with some specific users.Sharing SubfoldersWhat’s the answer? It’s simple, by design. You don’t. If more flexibility is absolutely required, for whatever reason, traditional Drive folders can be used.Limitations of Team DriveYou can’t share a folder, just singles files or the whole Team Drive. This is not something I would expect from an enterprise dedicated tool…RealityI called up Google today for almost 45 minutes. All of these people including Google are wrong — you can share folders with in an existing shared team drive— with a catch.Go to your team drive folder in drive like so and check the URL:https://drive.google.com/drive/u/0/folders/1ffgFstW0fotDfDNlU9fyNiEstrWy3b6sNow, there are two important parts of the url, the user /u/ ID and the folder /folders/ ID.The folder ID appears to be globally unique in Google so it can be shared easily, but what about the user ID?Well your user ID will depends on how your browser is signed into Google. ‘0’ means ‘default google account’, ‘1’ means ‘next google account’ and so on and so forth. As a result, so long as people you share the URL with have the same Google account priority, you CAN share links to folders.Account priorityIn order to share folders by URL, so long as everyone is consistently using their corporate Google account as their default (/u/0) account, the URL will work for everyone!Unfortunately if there is a mismatch, the user will attempt to access corporate resources with a personal account and get a permissions error. :(Make your folder links more sharable — update 22/4/19If you really want to put out a folder link e.g. in an email and are worried about it triggering an access request from the wrong account, you have another option:Remove the u/id/ from the folder url, e.g.https://drive.google.com/drive/folders/1ffgFstW0fotDfDNlU9fyNiEstrWy3b6sThis appears to opportunistically access the folder from whatever account can.Strangely, if you use an alternative context as suggested below by Harshit Maurya:https://drive.google.com/folderview?id=1ffgFstW0fotDfDNlU9fyNiEstrWy3b6s… in my testing this caused a non-default account to be selected so alas is not a viable option.ConclusionEncourage your users to sign in with their corporate account as their default account and then they can share links to folders in already shared team drives reliably, just by copying the folder URL from the address bar.Alternatively, remove the /u/id from the folder link to create a sharable folder link!Also, don’t believe Google or blogs from ‘experts’ who say this can’t be done!"
