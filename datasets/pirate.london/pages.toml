full_description = "Chris Monteiro·FollowPublished inpirate dot london·3 min read·Jan 21, 2017--ListenShareAboutLinks and projectsCitationsContactAboutMy name’s Chris Monteiro and I’m a sysadmin, cybercrime and niche topic internet researcher. I cover topics such as:CybercrimeComputer and information securityTranshumanism and the sociology of futurismTo my surprise I’m getting pretty good at some of these things, having spoken about darknet markets a few times, and I now run hpluspedia.org, the encyclopaedia of transhumanism, an area I also talk about a lot.If you want to get in touch via email, you can use the details below. I am available for engagements around transhumanism/futurism, digital rights activism and dark web / cybercrime events.Links and ProjectsThe wikis I contribute to you can find here:hpluspedia.orgI run and built most of this site because I think transhumanism is the greatest most poorly documented thing there is. (About)Other wikis I contribute to:https://en.wikipedia.org/wiki/User:Deku-shrub — Wikipedian, that’s your citation right therehttps://rationalwiki.org/wiki/User:Deku-shrub — I am a skeptichttps://wiki.lesswrong.com/wiki/User:Deku-shrub — Yeah I am one of those as a wellI have a super-secret wiki for mysterious purposes.Small project sites I’ve made include:churchofgoogle.org — I means I say ‘made’…mailzuck.org — Don’t forget to mail him!transhumanistparty.org.uk — not currently activemetaproxy.net — I can’t even be bothered to fix thisCitationsBesa MafiaWay too many to count. Maybe start with my statistics blog? Otherwise:TVCBS 48 Hours — Click for a Killer & Find Yura [ Blog ]Major articlesWired — The unbelievable tale of a fake hitman, a kill list, a darknet vigilante… and a murder [ Blog ]Harpers — Click here to Kill [ Podcast ]Independent PodcastsMystery Murdery Thingy — 22/5/19, enjoyable well researchedSupernatural — 17/6/20, some errors, otherwise enjoyableOtherI am in this European Union Agency for Network and Information Security reportCybercrime — Print/OnlineFreedom Hosting II — Various inc ForbesBuzzFeed — Black Death Group [ Blog ]Vocativ — Can You Buy Fixed Soccer Match Results On The Dark Net?Demos — As the Internet Fractures, Dark Net Commerce BoomsThe Sun — SICK SEX ROBOT PROBE British cops investigating import and sale of vile sex robots designed to look like children — [ look I don’t write the headlines ]I am ashamed to have consulted on this Daily Star article which is riddled with factual errors :(Vice — The Self-Proclaimed Equifax Hackers Are Likely Nothing More Than Amateur Scammers [ Blog ]DeepDotWeb — Interview: Deku_shrub, Author of Pirate dot London [ Archived on the onionweb ]The SAGE Encyclopedia of the Internet — Deep Web [ Blog ]Bitcoin Magazine —[ My blog on urban legends]Metropolitan Police hack blamed on gang of teenage cyber-vandals — See also Twitter commentary and moreMe complaining about Brave’s VPN thingForbes — Its Worryingly Easy To Create Fake Government COVID-19 WarningsCyberscoop — Dark web crooks wage an easy and profitable phishing scheme on WikipediaSex slaves, human hunting trips, hitmen for hire: Dark web expert sorts fact from fiction — A Daily Star interview which is actually correctPhishing With a Darknet: Imitation of Onion Services, Paper, UncreditedCybercrime — TV/Radio‘Drugs in the Post’ — I contributed to this BBC 2016 mini documentary [ Blog ], oh my god I was quoted in the Daily Mail (This still gets traction these days with Jim on Podcasts)The Next Episode BBC Podcast — and this associated BBC news item talking about darknet market extortion scamsIrish Radio fm104 — Can You Hire An Assassin On The Dark Web?Australian Radio K Rock — Exposing The Dark WebSky News — short podcast on murder for hire investigationsTranshumanismTranshumanism / H+Pedia — tracked on H+PediaOtherVice — BrexitologyDonationsI do not currently accept donations but I am currently reconsidering this position as of August 2019.ContactBluesky (most preferred) https://bsky.app/profile/dekushrub.bsky.socialTwitter: https://twitter.com/Deku_shrubEmail: dekushrub519@protonmail.comReddit (least preferred): https://www.reddit.com/user/Deku-shrub/Mastodon https://infosec.exchange/@dekushrubDon’t believe imposters.-----BEGIN PGP PUBLIC KEY BLOCK-----Version: GnuPG -----END PGP PUBLIC KEY BLOCK-----"
