title = "“Maniac” — miniseries review. Since selling my soul to Netflix… | by Chris Monteiro | pirate dot london"
description = "Since selling my soul to Netflix earlier in the year, my eyeballs have been Clockwork-orange’d for whatever exclusive they want to push every time I open the app. This strategy is almost as dangerous…"
full_description = "“Maniac” — miniseries reviewChris Monteiro·FollowPublished inpirate dot london·4 min read·Sep 22, 2018--ListenShareSince selling my soul to Netflix earlier in the year, my eyeballs have been Clockwork-orange’d for whatever exclusive they want to push every time I open the app. This strategy is almost as dangerous as googling ‘DVD new’ on a torrent site — you will often end up watching shite.However this time, Maniac peaked my attention, featuring the rather lovely Emma Stone and a disconcertingly slim Jonah Hill in a complex psychological/sci-fi escapade. But what’s it about? Well, a few things…*spoilers follow*It’s an alternate present-day for no adequately explained reasonTroubled young man Owen Milgim (Jonah Hill) is introduced in a strange alternate New York, featuring an alternative statue of liberty, dog-poo cleaning robots, 80’s and Japanese cyberpunk aesthetics and and horrible attention economy of ‘ad-buddies’, people who you follow you about advertising products in exchange for product discounts.Just in case you’re coping fine with this uncanny valley, Owen regularly experiences visual hallucinations, which as an audience we are forced to interpret ourselves from the other elements of strange work he lives in.Ever thought about supplementing your income with pharmaceutical testing?The gorgeous retro-futurist mash up I’ve only really seen in the world of ‘Dark City’ — the combination of present day technology satire and 70’s/80’s technologies are brilliantly executed.I would have liked to have seen some closure on this strange world, I expected to see the main characters ‘wake up’ from it at any moment, but such a moment never came. Instead we go deeper…Shit’s got layers yoThe minute the computer-assisted drug-fueled psychological simulations were scheduled, I found myself guessing whether the plot was going to pull any ‘trapped in the simulation’ shenanigans a la ‘The Cell’, or Inception ‘dream within a dream’ arse-pulls at any moment. The answer is — kinda, but not in an overly dissatisfying way.Microwaving brains: freaky, no matter how much you science-it-upAn ‘A, B, C’ experimental drug programme claims to offer insight into trauma, tools to deal with it and a final confrontation-resolution. Of course things don’t do to plan, asThe protagonists already suffering from serious emotional issuesThe lead scientists suffering from emotional issuesUltimately even the artificial consciousness computer is suffering from emotional issues.It is of course <sigh> an emotional journey.Stories of your lifePsychoanalytical theories say we are who we are through the combination of our experiences, and the stories we tell ourselves about these experiences. ‘Maniac’ uses this to intersperse the relatively fast-paced drug trial plot with lengthy drug and computer induced flashbacks, as well as traditional cinematic flashbacks to further develop the characters.Annie Landsberg has already been taking ‘A’ pills recreationally, to vividly recollect the last traumatic memories of her with her deceased sister before the drug trials start, as a obvious metaphor for behaviours such as rumination, nostalgia and regret around her traumatic experiences. Owen on the other hand has a dysfunctional relationship with his powerful family going back years that we learn through past, present and simulated narratives.When it comes for the ‘B’ pills, a computer malfunction creates a combined simulation for both Owen and Annie, creating a two further major narratives around a husband a wife duo getting caught up in an illegal wildlife deal and another of two con artists infiltrating a 1940’s seance.An Unexpected Emotional JourneyThe final ‘C’ pills feature both a well developed Tolkein-esque quest fantasy and a gritty American gangster novella for our protagonists. Of course when the computer malfunctions further, new combined narratives of NATO negotiations around an alien invasion allow the protagonists to take on further new personas as metaphors both for their lives and for the ever-deteriorating state of the computer-controller.The mini series format allows these varied stories-within stories to be self contained, packed full of people and objects from their real lives, and massively symbolic — dissecting and incepting new psychological narratives into these characters we’ve gotten to know.Bringing it togetherThe series is a a well executed character study of these two damaged and flawed characters, so the secret testing programme and its eccentric scientist leaders and flunkies doesn’t typically dominate over the character plots. Even when the lead-scientist’s awful celebrity-scientist mother comes to intervene with a now bereaved and depressed super computer, they are simply more developed characters to deconstruct, each motivated by different egotistical notions of making the world a better place through pharmacological neurobiology and pop psychology respectively.Maniac bills itself as a ‘dark comedy’, it’s certainly on the ‘dark’ side of the spectrum. I would anticipate the non-romantic conclusion of the story and lack of ‘reveal’ about the strange ‘real-world’ universe will leave some dissatisfied.But the message appears to be to both the protagonists and the audience — it’s not all about defeating the programme, passing the tests and winning the narratives, it’s what you can take away from the experience to become better, more psychologically robust people."
