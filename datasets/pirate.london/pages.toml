title = "A darknet drug reseller retires. Since the great Reddit crackdown of… | by Chris Monteiro | pirate dot london"
description = "Since the great Reddit crackdown of ’18, open discussion of darknet market drug dealing has been at an all time low. Whilst several specialist forums have filled the gaps, they are focused primarily…"
full_description = "A darknet drug reseller retiresChris Monteiro·FollowPublished inpirate dot london·4 min read·Jan 13, 2019--ListenShareSince the great Reddit crackdown of ’18, open discussion of darknet market drug dealing has been at an all time low. Whilst several specialist forums have filled the gaps, they are focused primarily on larger-scaler buyers and resellers, lacking the casual entry for consumer drug purchases.The new intersection between online and offline drug dealing is relatively poorly researched still — let’s see how it works.My friend wants to know how he can sell his illegal businessMy friend runs a business selling drugs. (Illegal yes, but not fentanyl, crack, heroine illegal) His profit nets is around maybe $3k a month. Super easy. Maybe works 2 hours a week. This friend choose not to expand to stay safe. Plus his clients are professional folks and really easy to deal with.This friend also runs another business that is legal, and is starting to boom. So the illegal business is almost not worth it any more to maintain. Yah yah, just dump it, you say…?I reached out to /u/HonestRoyal/ on the ‘My friend wants to know’ subreddit asking whether he could provide more information on the nature of his business and it’s operation. Many questions are answered below:SourcingI purchase [Adderall] on Dream, have it shipped to a secret location. I then mail off to my distributors/customers. [For vendors] consistency is key!For the first time, I am going through [a dispute] right now. One of my main sources is fucking me. The potency sucks and even the size of the actually med has shrunk. If he doesn’t resolve this with me, I’m hoping to be successful with a dispute.I can count on one hand the amount of my customers. I choose to keep it this way. My customers were acquired from word of mouth. They’re essentially friends of friends.They know [the adderall is] purchased [rather than direct from manufacturer]. But [they] don’t know the source.[Technical setup:] Tails and PGP, messaging encryption appsPaymentAsking whether his customers pay him in cryptocurrency, cash or other, he responded that he’s “never met my customers in person nor or they tech savvy. This will limit you down to a couple remaining options.”Paypal or mainstream mobile payment services it is then!EntrepreneurshipKeep in small, keep safe opsec, don’t expand and try to become a drug kingpinI asked “Would you consider winding down your operation by training your clients to use the markets directly?”If I did, then I wouldn’t have value in my business I want to sell![Selling the business] will be a challenge for sure. You can imagine this is a super narrow market of buyers! Not only that but I don’t want a bum clown ass kid taking over, so I will also be very selective on who I pass my clients over to.[Profits go into] other business projects or life expenses.Customers and Personal life[I know the] Fullz, and occupations [of my clients]. They’re mid 30s all in the professional field. My clients are seriously dumb bimbos. I would shoot my self trying to explain the simple routes to get on dream market. No one gives a shit about [the legalities of] ADHD medication.My life style is pretty much suburbia status. My friends judge me mostly because they’re jelly of my side hustle. No [friends or family] knows of it. I put [my profits] away immediately in other locations. One day she will learn and will be happy or pissed!My real life job I’m a product developer. I’ve developed products based off of problems one might have in life. Here’s a couple crazy examples… maybe some people maybe have problems with car interior organization. Like their cars a wreck inside. I would develop a car accessory to this issue. Or maybe your kid is trying to learn to improve his basketball shot, I would improve a prop to help his skill. Or maybe your beer gets warm when holding it, I’d develop a solution. I’m a problem solver, entrepreneur:) I had a few friends of friends that needed a product they couldn’t get, so I was asked to help. That’s how I got into this :). I think the average female joe, just isn't that familiar how easy it is it is.HonestRoyal didn’t have any specifically strong opinions about drug legalisation, The Silk Road or law enforcement policy — other than believing he was a low priority target.The online/offline drug dealer phenomenon appears to be a mostly new one, with new issue arising like how to sell your business when you want to get out.If you are interested in running your own prescription medicine drug dealing operation, please don’t get in touch, it’s illegal."
