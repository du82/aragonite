["https://pirate.london/how-to-stop-display-name-based-phishing-easily-f9912b71fc8a"]
title = "How to stop display name based phishing easily | by Chris Monteiro | pirate dot london"
description = "Email standards are hard when your different suppliers don’t properly support them, but work at them long enough, through to helping them them to improve their systems if necessary, and you can get…"
full_description = "How to stop display name based phishing easilyChris Monteiro·FollowPublished inpirate dot london·4 min read·Feb 14, 2021--ListenShareEmail standards are hard when your different suppliers don’t properly support them, but work at them long enough, through to helping them them to improve their systems if necessary, and you can get there.Last year I finished up mandating strict DMARC protections to 100% of my main corporate domain email sources. Now absolutely all emails from my company.com email addresses DMARC insists that they are DKIM signed and fully SPF valid. This protects customers and internal staff from having company.com being spoofed to the highest technical standard.v=DMARC1; p=reject; ruf=mailto:dmarc-f@company.com; fo=1; adkim=r; aspf=r;This glorious policy proclaims that one should reject any emails that fail DKIM or SPF, and to send reports on anyone who tries to dmarc-f@company.com. Policy is ‘r’ for relaxed as we use subdomains on some ‘mail from’ domains.And thus the company domain was protected from spoof based phishing and everyone lived happily ever after… of course not.Modern habitats of phishWith Covid-19 and rise of remote working, phishing attacks have been on the increase with three major vectors, all of which bypass these domain protections. Ones I’ve sigificantly experienced are:Staff impersonationCorporate impersonationSupplier impersonationAll abuse that the ‘display name’ (sometimes also known as the ‘from name’ or ‘sender name’) field within an email address falls outside of the scope of email standards protection. Unlike domain-bound standards, this field is still a free-for-all. My display name can as easily be ‘Bob’ as ‘emergency-contact@nsa.gov’. In most email clients now, even desktop clients, this is also the field is is most prominently displayed to the user too, with the technical data entirely hidden.This is a valid email sent from azure-noreply@microsoft.com but the domain is not displayed anywhere. Outlook web on desktop.At this points, various purveyors of enterprise email protection solutions start to rub their hands together, spouting buzz words like ‘technology is only a part of the solution’ and ‘artificial intelligence is the next step’ whilst chooching themselves down the phone to your IT budget holders.Resist their siren call as there are several low hanging fruit for stopping display name impersonation you can implement!Staff name impersonationFirst you must discover or audit through passive transport rules, what services use your staff names in the display name. Have your rule send you a copy of any email where the ‘from’ header matches a selection of your staff names but doesn’t come from your company.com.It is possible to build these rules more dynamically for all staff members, but this hasn’t been necessary for us so far.In my organisation it turned out that the list of services that send from ‘firstname lastname’ are as follows:slack.com — “firstname.lastname via Slack”google.com — “firstname lastname (Google Docs)”company.com —“firstname lastname”signrequest.com — “firstname lastname via SignRequest” (applies similarly to DocuSign)As a result, I had to create the rule:Name: Warn on staff name impersonationApply this rule if: A message header matches… ‘From’<list of staff names to protect>Prepend the disclaimer:This message was sent from outside the company by someone with a name matching a user in Company. Please do not click links or open attachments unless you recognise the source of this email and know the content is safe. If this message has been added incorrectly, please escalate to service desk.and CC the message to: <compliance and phishing people>Except if: The sender domain is:slack.comsignrequest.comgoogle.comcompany.comAnd thus any point of contact who matches the protected staff names will trigger the warning banner.Corporate impersonationThis is a similar task, identifying what domains send from ‘Company’. In our case, we found only only:company.comcompany.onmicrosoft.com (certain system M365 emails)eventbrite.com — uh, yeah they send from ‘Company’ tooThe rule for this was even simpler:Name: Warn on ‘Company’ name spoofing:Apply this rule if: A message header matches… ‘From’CompanyPrepend the disclaimer:Warning: this message was sent from ‘Company’ but it’s not a known source of Company emails. Please proceed with caution If this message has been added incorrectly, please escalate to service desk.Except if: The sender domain is:company.comcompany.onmicrosoft.comeventbrite.comSupplier impersonationThe final large vector of phishing we had was fake invites to Zoom meetings. Well, that can be quickly stopped!‘Zoom’ sends emails from the following domains:zoom.us — main domain that sends inviteszoom.com —unused corporate domain they ownzoomus.zendesk.com — Zoom support correspondenceName: Warn on ‘Zoom’ name spoofingApply this rule if: A message header matches… ‘From’ZoomPrepend the disclaimer:Warning: this message was sent from ‘Zoom’ but it’s not a known source of Zoom emails. Please proceed with caution If this message has been added incorrectly, please escalate to service desk.Except if: The sender domain is:zoom.uszoom.comzoomus.zendesk.comGoodbye Zoom phishing emails!ConclusionsOther than the excellent work of Elliot Munro, I was surprised how little information there was about setting up such extended email protections against display name spoofing.Not only was this relatively easy to do, but it was notably effective at flagging spoofed email to users. We are still warning rather than blocking on these patterns, but no staff have been confused between legitimate or illegitimate email falling under these patterns since implementation. The internal phishing reports we still get seem to all have the warning banner already added to them.I recommend immediately creating comparable display name spoofing rules for your organisation if you’re close to a proper DMARC setup and watch the phishing attacks fail gloriously."
