description = '''
Samira und Friedemann fragen sich gegenseitig: Wie alt bist du (und wie hoffnungslos)? Und würdest du AfD-Politiker:innen in deine Talkshow einalden?

Das sind die Themen: die hoffnungslose Jugend laut einer Studie und die hoffnungslose Hoffnung, AfDler in Talkshows "entlarven" o.ä. zu können. (Spoiler: funktioniert nicht). Plus: ein paar sahnige Empfehlungen.

sz.de, "Junge Menschen in Deuthschland so pessimistisch wie nie", https://www.sueddeutsche.de/politik/jugendstudie-2024-jugend-in-deutschland-rechtsruck-pessimistisch-1.6565585

