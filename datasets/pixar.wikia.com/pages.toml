description = "Boundin' is a 2003 Pixar short film. It was written and directed by Bud Luckey. In the west lives a lamb whose pride and joy is his wool. When a man comes and shears him, the lamb becomes depressed and uncomfortable without his wool. Later, a Jackalope arrives to the sulking lamb to teach him to bounce back from life's troubles by telling the lamb to conquer his fear without wool. The Jackalope tells the lamb that he can still bounce around the meadow, even without his wool. Getting used to jump"
