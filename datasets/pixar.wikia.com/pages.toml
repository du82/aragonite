 mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Directed by: Madeline Sharafian Written by: Madeline Sharafian Release date: December 25, 2020 Running time: 6:20 Burrow is a Pixar SparkShort that was released on December 25, 2020 on Disney+ along with the release of Soul. Plot[] A young rabbit digs a burrow for herself in the hopes of building her dream home. While digging into the dirt, she encounters a couple of moles who are exercising and a family of mice who both welcome her. However, the socially awkward rabbit, wanting to live in solitude by herself, instead digs deeper into the ground and encounters more neighbors whom she wants nothing to do with including a hedgehog family, well-read frogs, sauna lizards and a party of ants, all of whom show a friendly, welcoming attitudes, but the rabbit proceeds to evade them. After a brief encounter with a creature that roars at her, she digs further down than any of the other animals. The rabbit eventually tries to create her hovel, but hits a stream, resulting in her small burrow filling with water, which the other animals feel. The rabbit climbs back up to the previously unknown creature, who turns out to be a badger, and she explains her situation. The badger, who is implied to be the landlord of sorts, calls for the other animals to help the rabbit and they all dig a tunnel to divert the water away and out onto the surface. The rabbit, feeling guilty for trying to avoid her neighbors, shows them her plans. Later, the rabbit is shown having made a comfortable living space for herself with the help of her new neighbors and even has added a small roof over her hole. She fixes her mailbox before rejoining her new friends. Trivia[] This is the third short released by Pixar that features hand-drawn animation, the first two being Day & Night and Kitbull. The music played during most of the short is written by classical era composer Wolfgang Amadeus Mozart, whose pieces were also heard in The Incredibles franchise. Gallery[] <img style="" src="https://static.wikia.nocookie.net/pixar/images/2/26/Burrow_Official_Poster.jpg/revision/latest/scale-to-width-down/120?cb=20201113013539" title="Burrow Official Poster.jpg (2.47 MB)" class="thumbimage" alt="Burrow Official Poster" height="185" width="185" data-image-name="Burrow Official Poster.jpg" data-image-key="Burrow_Official_Poster.jpg" data-relevant="1"> Categories Categories: Shorts SparkShorts Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi Pixar'''
