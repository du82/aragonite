inside the mind of a young girl named Riley, along with Joy, Fear, Disgust and Sadness. Lewis Black describes Anger as follows: "He's angry. He knows the group is well-meaning and they try hard, but they don't get how things should work as well as he does. So he has to stay on top of everything, and the only way he knows how to get their attention, keep it, and make sure they get things done right is by getting angry. He is comfortable with his anger. It makes him happy. But when pushed too far, the top of his head bursts into flames." [1] Contents 1 Official Bio 2 Inside Out 3 Personality 4 Appearance 5 Trivia 6 Gallery 7 References Official Bio[] "Anger feels very passionately about making sure things are fair for Riley. He has a fiery spirit and tends to explode (literally) when things don’t go as planned. He is quick to overreact and has little patience for life’s imperfections." [2] Inside Out[] Anger is an avid reader of The Mind Reader, a newspaper which seems to have the ability to update itself instantly as relevant events happen in Riley's life. Unsurprisingly, Anger also has a tendency to advocate for the use of the only curse word Riley knows, and is the Emotion that reacts the most violently to the TripleDent Gum commercial. During Riley's childhood, Anger stays fairly in check as Joy was Riley's dominant emotion. However, when Riley turns 11 and her family moves to San Francisco, the Emotions are confused by the new situation. All of a sudden, Anger, Fear, and Disgust are much more present and generate much more memories. When Joy and Sadness, along with all the core memories, are accidentally expelled from Headquarters, Anger, Fear and Disgust are left alone to control Riley. Anger gets out of control much more frequently, despite Fear's efforts to calm him down. His tantrums precipitate the fall of Friendship and Hockey Island. After one day of this madness, Anger decides he's had enough of it. He reasons that since all Riley's happy core memories were made in Minnesota, they should go back there to make some new ones; though he calls it the "happy core memory redevelopment program", he is effectively asking that Riley runs away. Disgust and Fear are unsure about it, but end up agreeing. Anger plants the corresponding idea bulb in the console, and Riley accepts the idea. Declaring there is now no turning back, Anger pushes Riley to steal her mother's credit card, precipitating the fall of Honesty Island. As Riley runs away, Family Island, the last island standing, crumbles down, and Anger abruptly realizes how bad his idea was. The three emotions try to change Riley's mind, but the idea bulb remains stuck in the console, which begins to shut down. Fortunately, Joy and Sadness come back to Headquarters and know how to solve the problem. As Joy and Sadness were stuck outside of the windows of Headquarters, Disgust proceeded to trigger Anger by insulting him, causing his head to explode with fire as he does when angry. The fire was used to melt the glass so Joy and Sadness could get into Headquarters. Sometime later, as Riley turns 12, Anger is excited to find out that the newly installed upgraded console grants him access to a complete library of curse words. Personality[] Anger is intelligent, very serious, short, somewhat antagonistic, very reluctant to express sadness or happiness, bitter and hoarse, but has a somewhat underlying caring nature. He has a mean, fiery spirit and tends to explode (literally) when things do not go as planned. As explained by Joy, he really cares that things are fair and differs from Fear, as Joy differs from Sadness. Despite his intention to fix things, he sometimes acts impulsively and does things his own way, like Joy did, resulting in more harm. Appearance[] Anger is the shortest of the Emotions. He has crimson skin, a bald head, and tan oval eyes. He wears a white shirt and a gray tie with red triangles separated in the middle by a zigzagging line of yellow, as well as a brown belt, maroon trousers and gray shoes. When angry, volcanic bursts of flame burst from his scalp. Trivia[] According to Pete Docter, his appearance is based on a fire brick. Anger is notably the only Emotion that does not have a visible nose. Anger claimed that, before a pizzeria in San Francisco served broccoli pizza, the Hawaiians ruined pizza by inventing the Hawaiian pizza, which is not true, since the Hawaiian Pizza was actually invented in Ontario, Canada. During a stage of development where the Emotions all had human names, Anger was originally named Ira, short for Irate. The first curse word that Riley knows is revealed at the end of the film, when Anger says "This is the s-" before being cut off by a "Bleep" tone coming from Fear toying with his section of the control console. Anger is the dominant emotion of Riley's Father; although is relatively more mature than Riley's Anger. Gary has 5 emotions like everyone else, except that they are all variations of Anger. Gallery[] <img style="" src="https://static.wikia.nocookie.net/pixar/images/f/fa/Meet_Anger_-_Inside_Out/revision/latest/scale-to-width-down/185?cb=20141119221240" title="Meet Anger - Inside Out (11 KB)" class="thumbimage" alt="Meet Anger - Inside Out" height="185" width="185" data-video-name="Meet Anger - Inside Out" data-video-key="Meet_Anger_-_Inside_Out">Meet Anger - Inside Out<img style="" src="https://static.wikia.nocookie.net/pixar/images/5/5e/Meet_Lewis_Black_as_Anger_in_INSIDE_OUT/revision/latest/scale-to-width-down/185?cb=20150515202948" title="Meet Lewis Black as Anger in INSIDE OUT (13 KB)" class="thumbimage" alt="Meet Lewis Black as Anger in INSIDE OUT" height="185" width="185" data-video-name="Meet Lewis Black as Anger in INSIDE OUT" data-video-key="Meet_Lewis_Black_as_Anger_in_INSIDE_OUT">Meet Lewis Black as Anger in INSIDE OUT<img style="" src="https://static.wikia.nocookie.net/pixar/images/1/19/Inside_Out_Character_Poster_Anger.jpg/revision/latest/scale-to-width-down/113?cb=20150103032520" title="Inside Out Character Poster Anger.jpg (1.53 MB)" class="thumbimage" alt="Character Poster" height="185" width="185" data-image-name="Inside Out Character Poster Anger.jpg" data-image-key="Inside_Out_Character_Poster_Anger.jpg" data-relevant="1" data-caption="Character Poster">Character Poster<img style="" src="https://static.wikia.nocookie.net/pixar/images/b/b2/ANGER_Render.png/revision/latest/scale-to-width-down/129?cb=20141209183603" title="ANGER Render.png (934 KB)" class="thumbimage" alt="ANGER Render" height="185" width="185" data-image-name="ANGER Render.png" data-image-key="ANGER_Render.png" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/4/4b/1922_Anger_InsideOut_341.jpg/revision/latest/scale-to-width-down/185?cb=20150721031213" title="1922 Anger InsideOut 341.jpg (531 KB)" class="thumbimage" alt="1922 Anger InsideOut 341" height="185" width="185" data-image-name="1922 Anger InsideOut 341.jpg" data-image-key="1922_Anger_InsideOut_341.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/e/e0/194136_1_iocs_Anger1_150_per16_484_R1n.jpg/revision/latest/scale-to-width-down/149?cb=20150611011357" title="194136 1 iocs Anger1 150 per16 484 R1n.jpg (165 KB)" class="thumbimage" alt="194136 1 iocs Anger1 150 per16 484 R1n" height="185" width="185" data-image-name="194136 1 iocs Anger1 150 per16 484 R1n.jpg" data-image-key="194136_1_iocs_Anger1_150_per16_484_R1n.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/f/fe/Inside-Out-Anger-shoutcrop.jpg/revision/latest/scale-to-width-down/137?cb=20150721031250" title="Inside-Out-Anger-shoutcrop.jpg (87 KB)" class="thumbimage" alt="Inside-Out-Anger-shoutcrop" height="185" width="185" data-image-name="Inside-Out-Anger-shoutcrop.jpg" data-image-key="Inside-Out-Anger-shoutcrop.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/6/6e/DisgustAngerFear-InsideOut_pdf_Page_1.