alse; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Pixar Series Chronology Monsters At Work >> Buzz Lightyear of Star Command was a short-lived animated television series that aired on ABC's Disney's One Saturday Morning block from 2000 to 2001 and on the weekday/Sunday block on UPN, Disney's One Too. It is a spin-off of Toy Story that is animated in traditional animation (with computer animation for the theme song), and was led from the film Buzz Lightyear of Star Command: The Adventure Begins. The series takes place in the far future, a pastiche of Star Trek, Battlestar Galactica, Babylon 5, Lost in Space, Flash Gordon, Buck Rogers, Space Patrol (1950 series), and Star Wars-style science fiction. It follows the adventures of Space Ranger Buzz Lightyear and his team as they defend the galaxy from the Evil Emperor Zurg. It was rerun in the United States on Disney Channel and Toon Disney until 2008. Contents 1 Episodes 2 Opening Scene Variations 3 Characters 3.1 Buzz Lightyear 3.2 Emperor Zurg 3.3 Commander Nebula 3.4 Mira Nova 3.5 XR 3.6 Aliens 3.7 Booster 3.8 Warp Darkmatter 3.9 Evil Buzz Lightyear 3.10 Gravitina 3.11 NOS-4-A2 3.12 XL 3.13 Hornets 4 Trivia 5 Video games 6 See also 7 References Episodes[] Episode Number Title Original Air Date[1] 01 The Torque Armada 2000-10-02 02 Gravitina 2000-10-03 03 XL 2000-10-04 04 Little Secrets 2000-10-05 05 Inside Job 2000-10-06 06 NOS-4-A2 2000-10-08 07 The Planet Destroyer 2000-10-09 08 The Beasts of Karn 2000-10-10 09 Tag Team 2000-10-11 10 The Main Event 2000-10-12 11 The Return of XL 2000-10-13 12 Strange Invasion 2000-10-15 13 The Taking of PC-7 2000-10-16 14 Mindwarp 2000-10-17 15 Mira's Wedding 2000-10-18 16 Panic on Bathyos 2000-10-19 17 Shiv Katall 2000-10-20 18 Stress Test 2000-10-22 19 A Zoo Out There 2000-10-23 20 Root of Evil 2000-10-24 21 Super Nova 2000-10-25 22 Downloaded 2000-10-26 23 The Plasma Monster 2000-10-27 24 The Crawling Flesh 2000-10-29 25 Dirty Work 2000-10-30 26 The Slayer 2000-10-31 27 The Lightyear Factor 2000-11-01 28 Clone Rangers 2000-11-02 29 Bunzel Fever 2000-11-03 30 Devolutionaries 2000-11-05 31 Head Case 2000-11-06 32 The Yukari Imprint 2000-11-07 33 The Shape Stealer 2000-11-08 34 Star Crossed 2000-11-09 35 Haunted Moon 2000-11-10 36 Stranger Invasion 2000-11-12 37 Eye of the Tempest 2000-11-13 38 Revenge of the Monsters 2000-11-14 39 Lone Wolf 2000-11-15 40 Planet of the Lost 2000-11-16 41 Revenge of the Raenoks 2000-11-17 42 The Starthought 2000-11-19 43 Millennial Bugs 2000-11-20 44 At Large on a Small Planet 2000-11-23 45 Sunquake 2000-11-24 46 First Missions 2000-11-26 47 Large Target 2000-11-27 48 War and Peace and War 2000-11-29 49 Lost in Time 2000-10-14 50 Rookie of the Year 2000-10-21 51 Wirewolf 2000-10-28 52 Rescue Mission 2000-11-04 53 Star Smasher 2000-11-11 54 Enemy Without a Face 2000-11-18 55 Good Ol' Buzz 2000-11-25 56 Return to Karn 2000-12-02 57 Speed Trap 2000-12-09 58 Holiday Time 2000-12-16 59 Opposites Attract 2000-12-23 60 Ancient Evil 2001-01-06 61 42 2001-01-13 Opening Scene Variations[] Pixar created more than one opening sequence for the show. Among them: Buzz lands next to the television and opens up his helmet. Buzz smacks into the television and slides down. Buzz lands on Bullseye and then falls off in pain. Zurg stands next to where Buzz lands and fires at the TV screen. Buzz lands and is smacked away by Wheezy (riding RC). Buzz lands and strikes a disco pose. Buzz lands and opens his wings, knocking down everyone behind him. Characters[] Buzz Lightyear[] Performer: Tim Allen (Buzz Lightyear of Star Command: The Adventure Begins)Patrick Warburton (the actual series) Appeared in: "This is the universe. I work here. Name's Lightyear, Buzz Lightyear. I'm a Space Ranger." -Buzz Lightyear's introduction In Buzz Lightyear of Star Command, Buzz is the star of his own show. He is also an actual Space Ranger working for Star Command and protecting the universe from the Evil Emperor Zurg, alongside Mira Nova, a Tangean princess with phasing powers, Booster, a janitor from the planet Jo-Ad, and XR, a robot created by the Little Green Men. Like his Toy Story incarnation, this Buzz is known for his heroism and bravery and is a stickler for procedure, but will tell a cover story if he needs to. However, he has little people skills, and at times displays a lack of common sense. In the direct-to-video movie, he is voiced by Tim Allen, the original Buzz Lightyear. In the actual series, he is voiced by Patrick Warburton. Information from Star Command Personnel Files Academy Ranking: First in Class Special Commendations: Order of Galactic Merit. First Class The Andromeda Cross The Pleadiean Cluster The Solar Wind Award for Courage The Nebula Heart Blue Medallion of Excellence The Golden Ring of Jupiter Emperor Zurg[] Performer: Wayne Knight Appeared in: "EVIL RULES!" -Emperor Zurg in Buzz Lightyear of Star Command Zurg is the main villain of the series, in which he rules over Planet Z and wants to take over the entire universe. His subjects are Grubs, which are similar to Star Command's Little Green Men; Brain Pods, who work for him as scientists and researchers; and an army of Hornets, which are his robotic foot soldiers used for battle. One of his henchmen is Warp Darkmatter, who was once Buzz's partner but had been secretly working for Zurg and given the codename "Agent Z." This incarnation of Zurg is a flamboyant villain who often breaks the seriousness of his evil statements, and is just as much a comic relief character as he is a formidable opponent. He is known for videotaping Buzz's speeches so he can secretly mock him, and in one episode tells Buzz that he is his father during a fight (just like he did in Toy Story 2) only to gain the upper hand by using the statement as a "Made You Look" moment to trick Buzz, which likely implies he and Buzz may not be related. In another episode where Senate members are being kidnapped, Zurg is the chief suspect, but says to Buzz that even he considers kidnapping politicians to be ridiculous; Buzz and his crew then eliminate Zurg from the suspects. Despite Zurg's campy nature, he is still widely considered the most evil person in the galaxy. Commander Nebula[] Performer: Adam Carolla Appeared in: Commander Nebula is the head commander of the Space Rangers, whose left leg was replaced by a pegleg-like plasma cannon. He is rather short-tempered and constantly speaks with a loud voice. He also hates doing paperwork and therefore signs petitions without looking at them (by doing so, he inadvertently gave permission for the creation of XR, who therefore considers him to be his father). Mira Nova[] Performer: Nicole Sullivan Appeared in: Mira Nova is a princess from the planet Tangea and also one of Buzz's partners. She joined Star Command and became a Space Ranger against her father's wishes, because she was inspired by how they saved her planet. She utilizes the ability to walk through walls (called "ghosting") and read minds, which is a trait of her species. She acts as Buzz's co-pilot and second-in-command and has the most common sense of the team. Before the show was even made, Buzz hid inside a burger box for Super Nova Burgers when sneaking into Pizza Planet with Woody in the first Toy Story. Super Nova is also the name of an episode of Buzz Lightyear of Star Command. In the episode Devolutionaries, she came in contact with a de-evolve gas that reverted her to a living blue goo which would explain why Mira's father and her race called Buzz a "monkey" or "ape" because they didn't evolve from primates, just from goo. The de-evolved Mira was shown to be smarter than "dino" Booster and "cave" Buzz, even if she could not talk. XR[] Performer: Larry Miller and Neil Flynn Appeared in: XR is the robotic Space Ranger that first appeared in Buzz Lightyear of Star Command: The Adventure Begins. His name stands for "Experimental Ranger". He was created by the LGMs as a possible partner for Buzz Lightyear (who at the time was still upset over the loss of his former partner Warp Darkmatter) because, being a robot, he could be easily rebuilt if destroyed. Originally he had no personality and was only programed to learn from Buzz, even repeating everything that he said. On his first mission with Buzz, to try to protect the Uni-Mind on the LGMs' home planet from being stolen by Emperor Zurg, he was destroyed. The LGMs later tried to fix him, but since Zurg captured the Uni-Mind the LGMs couldn't think clearly and their abilities to rebuild him were inhibited. Therefore, he was rebuilt with many character flaws, but by the LGMs' standard he was almost human. As a result XR has a taste for the high life, enjoying money, partying, dancing, beautiful women and anything luxurious. He also considers Commander Nebula to be his "Dad" because he had unknowingly signed the papers to authorize XR's construction. XR has gotten blown up on nearly every mission. XR has many pop-out gadgets and can store objects inside his chest cavity. XR was mentioned in Toy Story comic #0. Aliens[] Performer: Jeff Pidgeon (Andy's Room sequence)Patrick Warburton (the actual series) Appeared in: The Aliens are also characters in the series, working for Star Command as scientists. It was in this series that they were first identified as LGMs, short for "Little Green Men". They played an important role in the direct-to-video pilot The Adventure Begins where they were kidnapped by Emperor Zurg, who was attempting to discover the secret of the LGMs' telepathic link so he could use it for his own evil purposes. It is revealed on their home planet that this power comes from the Uni-Mind: a giant orb that binds together all the LGMs mentally and emotionally into a single whole. Zurg later steals and corrupts the Uni-Mind into pure evil and attaches it to a giant ray gun to take over the minds of everyone in the universe. It should be pointed out how this series implies that the Aliens exist in the Buzz Lightyear universe, despite the fact that in Toy Story they seem to be only available at Pizza Planet. Possibly, the Aliens' toys are meant to be only sold at Pizza Planet as an exclusive tie-in deal with the cartoon. In this series, they are voiced by Patrick Warburton. Booster[] Performer: Stephen Furst Appeared in: Booster is a member of Buzz's team. He is a huge dinosaur-like alien from the agricultural planet of Jo-Ad. He has a big appetite and lots of muscle power, but is at times ignorant and naive. He had been looking up to Buzz Lightyear ever since his days working as a janitor for Star Command. <a href="https://static.wikia.nocookie.net/pixar/images/f/f0/Pixarno0booster.jpg/revision/latest?cb=20100127174235" class="image"><img alt="Pixarno0booster" src="https://static.wikia.nocookie.net/pixar/images/f/f0/Pixarno0booster.jpg/revision/latest?cb=20100127174235" decoding="async" loading="lazy" width="282" height="227" class="thumbimage" data-image-name="Pixarno0booster.jpg" data-image-key="Pixarno0booster.jpg" data-relevant="0" data-src="https://static.wikia.nocookie.net/pixar/images/f/f0/Pixarno0booster.jpg/revision/latest?cb=20100127174235" /></a> Andy playing with Booster. Booster was recently seen in the comic Toy Story #0 as an action figure, confirming that the Buzz Lightyear toyline in the Toy Story films actually is based on the Buzz Lightyear of Star Command series. When he first meets the other toys, he is deluded like Buzz was in the original film. In the episode Devolutionaries, he came in contact with a de-evolve gas that reverted him to a 50 ft red dinosaur with a Triceratops nose horn and beak, Ankylosaurus body and a Stegosaurus tail, proving his race evolved f'''
