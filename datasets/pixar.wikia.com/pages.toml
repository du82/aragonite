from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Directed by: Domee Shi Written by: Domee Shi Release date: June 15, 2018 Running time: 7 minutes, 40 seconds[1] Bao is a Pixar short film that was released on June 15, 2018 alongside Incredibles 2. It was directed by Domee Shi and produced by Becky Neiman-Cobb, with John Lasseter and Pete Docter acting as executive producers.[2] Contents 1 Summary 2 Voice cast 3 Trivia 4 Awards 5 Gallery 6 References Summary[] The short begins with a Chinese couple who have immigrated to Toronto, Canada. As the Husband leaves for work, the Wife cooks bao. One bao then comes alive and she decides to raise it as her own child. However, since the Bao Kid is so soft and frail, the Mom becomes overprotective. The Mom raises him well and joins him in Tai Chi routines. Yet the Bao Kid becomes more rebellious as he grows up obsessed with soccer. The Mom thinks soccer is too dangerous, despite Bao Kid enjoying it. The Mom becomes concerned as Bao Kid becomes emotionally detached and independent from her, preferring to be alone or with his rowdy friends. One day, Bao Kid reveals that he is engaged to a woman the Mom never met and Bao Kid intends to move out of his parent's house with her. The Mom tries to stop him and the two struggle. Finally losing her temper, the Mom eats the Bao Kid, only to end up falling in shock from her actions. It is revealed that the Bao Kid was an imaginary representation of the Mom's real biological son, who happens to resemble a bao, and the whole premise was a metaphor for the Mom's suffering of empty nest syndrome. The son returns home to apologize for the break up and eventually the Mom forgives him. The parents are also personally introduced to their daughter-in-law, who quickly becomes loved by her in-laws and a new member of the family. Voice cast[] Sindy Lau as Mom Daniel Kai Lin as Bao Kid Tim Zhang as Dad Sharmaine Yeoh as daughter-in-law Trivia[] Bao is the first Pixar short film to be directed by a woman. A calligraphy of "皮克斯 (Píkèsī)", the Chinese name for Pixar, was written under the title. Awards[] 2019 Academy Award® Winner for Best Animated Short Film Gallery[] <img style="" src="https://static.wikia.nocookie.net/pixar/images/c/c0/BaoPoster1.jpg/revision/latest/scale-to-width-down/130?cb=20180605021948" title="BaoPoster1.jpg (5.39 MB)" class="thumbimage" alt="BaoPoster1" height="185" width="185" data-image-name="BaoPoster1.jpg" data-image-key="BaoPoster1.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/5/5c/Bao_EW_First_Look.jpg/revision/latest/scale-to-width-down/185?cb=20180610224259" title="Bao EW First Look.jpg (4.35 MB)" class="thumbimage" alt="Bao EW First Look" height="185" width="185" data-image-name="Bao EW First Look.jpg" data-image-key="Bao_EW_First_Look.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/3/37/Pixar-Bao-Concept-ARt.jpg/revision/latest/scale-to-width-down/185?cb=20180331013835" title="Pixar-Bao-Concept-ARt.jpg (59 KB)" class="thumbimage" alt="Pixar-Bao-Concept-ARt" height="185" width="185" data-image-name="Pixar-Bao-Concept-ARt.jpg" data-image-key="Pixar-Bao-Concept-ARt.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/4/42/Bao_1.jpeg/revision/latest/scale-to-width-down/185?cb=20190814022008" title="Bao 1.jpeg (167 KB)" class="thumbimage" alt="Bao 1" height="185" width="185" data-image-name="Bao 1.jpeg" data-image-key="Bao_1.jpeg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/e/e9/Bao_2.jpg/revision/latest/scale-to-width-down/185?cb=20180610224606" title="Bao 2.jpg (1.33 MB)" class="thumbimage" alt="Bao 2" height="185" width="185" data-image-name="Bao 2.jpg" data-image-key="Bao_2.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/c/ca/Bao_3.jpg/revision/latest/scale-to-width-down/185?cb=20180610224607" title="Bao 3.jpg (2.14 MB)" class="thumbimage" alt="Bao 3" height="185" width="185" data-image-name="Bao 3.jpg" data-image-key="Bao_3.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/a/a0/Bao_4.jpg/revision/latest/scale-to-width-down/185?cb=20180610224608" title="Bao 4.jpg (2.81 MB)" class="thumbimage" alt="Bao 4" height="185" width="185" data-image-name="Bao 4.jpg" data-image-key="Bao_4.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/pixar/images/7/7d/Bao_5.jpg/revision/latest/scale-to-width-down/185?cb=20180610224608" title="Bao 5.jpg (4.47 MB)" class="thumbimage" alt="Bao 5" height="185" width="185" data-image-name="Bao 5.jpg" data-image-key="Bao_5.jpg" data-relevant="1"><img style="" src="https://sta