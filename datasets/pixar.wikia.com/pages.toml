heck the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Directed by: Bud LuckeyRoger Gould (Co-Director) Written by: Bud Luckey Release date: 2003 Running time: 4 minutes, 40 seconds Boundin' is a 2003 Pixar short film. It was written and directed by Bud Luckey. Contents 1 Plot 2 Voice Cast 3 Credits 4 Trivia 5 Gallery 6 References Plot[] In the west lives a lamb whose pride and joy is his wool. When a man comes and shears him, the lamb becomes depressed and uncomfortable without his wool. Later, a Jackalope arrives to the sulking lamb to teach him to bounce back from life's troubles by telling the lamb to conquer his fear without wool. The Jackalope tells the lamb that he can still bounce around the meadow, even without his wool. Getting used to jumping without wool, the lamb gets his wool back again as the time passes by. Some time later, the lamb gets sheared again and this time gets used to bouncing without wool, thanks to the Jackalope who helped him. Voice Cast[] Bud Luckey as Narrator, Lamb, and Jackalope Credits[] See the credits page. Trivia[] This is the first theatrical short to have dialogue. To date, this and Lava are the only Pixar shorts to feature dialogue that aren't based on a pre-existing property. Indeed, the man talking on the radio in Day & Night is a recording of a speech by Dr. Wayne Dyer.[1] Bud Luckey, who performed all the voices, played Rick Dicker in The Incredibles and Chuckles the Clown in Toy Story 3. He also worked on Sesame Street as the Alligator King in an animated short and voiced Eeyore in the 2011 Disney film Winnie the Pooh. In Hawaiian Vacation, according to commentary on the Pixar shorts DVD collection, the luau chant that Chuckles does roughly translates to "Bound and rebound", a line from this short. In the first draft, Rick Dicker was going to sit on a chair and tell the story. The car that the man drives is the same car model as Stanley from Cars. There is a statue of Stanley in that film. The hand that grabs the lamb belongs to the dentist from Finding Nemo. Additionally, the fish seen in this short are based on Gurgle. The Cars DVD and Blu-ray contain a version of Boundin' with Mater as the Jackalope and Lightning McQueen as the lamb. Guido is also seen briefly as six groundhogs. Gallery[] <img style="" src="https://static.wikia.nocookie.net/pixar/images/9/9e/Boundin_poster.png/revision/latest/scale-to-width-down/128?cb=20160103060757" title="Boundin poster.png (113 KB)" class="thumbimage" alt="Poster." height="185" width="185" data-image-name="Boundin poster.png" data-image-key="Boundin_poster.png" data-relevant="1" data-caption="Poster.">Poster.<img style="" src="https://static.wikia.nocookie.net/pixar/images/1/14/Carsboundin.jpg/revision/latest/scale-to-width-down/185?cb=20110118041244" title="Carsboundin.jpg (46 KB)" class="thumbimage" alt="Stanley statue in Cars." height="185" width="185" data-image-name="Carsboundin.jpg" data-image-key="Carsboundin.jpg" data-relevant="1" data-caption=" statue in &lt;i&gt;&lt;/i&gt;.">Stanley statue in Cars.<img style="" src="https://static.wikia.nocookie.net/pixar/images/9/98/Sheep1.png/revision/latest/scale-to-width-down/139?cb=20110429122212" title="Sheep1.png (97 KB)" class="thumbimage" alt="Lamb." height="185" width="185" data-image-name="Sheep1.png" data-image-key="Sheep1.png" data-relevant="1" data-caption="Lamb.">Lamb.<img style="" src="https://static.wikia.nocookie.net/pixar/images/7/7f/Jackalope.png/revision/latest/scale-to-width-down/166?cb=20110429122353" title="Jackalope.png (101 KB)" class="thumbimage" alt="Jackalope." height="185" width="185" data-image-name="Jackalope.png" data-image-key="Jackalope.png" data-relevant="1" data-caption="Jackalope.">Jackalope. References[] ↑ Pixar.com Categories Categories: Shorts Languages Deutsch Español Français עברית Polski Русский Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi Pixar'''
