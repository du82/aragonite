dForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> << Toy Story Pixar Films Chronology Toy Story 2 >> Film information Directed by John Lasseter Co-Directed by Andrew Stanton Produced by Darla K. AndersonKevin Reher Screenplay by Andrew StantonDonald McEneryBob Shaw Story by John LasseterAndrew StantonJoe Ranft Music by Randy Newman Director of Photography Sharon Calahan Edited by Lee Unkrich Production Designers William Cone MPAA rating G Release date November 25, 1998 Running time 95 minutes[1] Budget $120 million[2] Box office $363 million[2] Full Credits Trivia Home Video Awards Soundtrack Characters Merchandise Locations "An epic of miniature proportions." —Tagline[3] A Bug's Life is Pixar's second feature film, after Toy Story. It was produced by Pixar Animation Studios and distributed by Walt Disney Pictures. It was released in theaters on November 25, 1998. Dave Foley, Kevin Spacey, Julia Louis-Dreyfus, Hayden Panettiere, Phyllis Diller, Richard Kind, David Hyde Pierce, Joe Ranft, Denis Leary, Jonathan Harris, Madeline Kahn, Bonnie Hunt, Michael McShane, John Ratzenberger, Brad Garrett, Roddy McDowall, Edie McClurg, Alex Rocco, and David Ossman fill out the film's ensemble voice cast. Contents 1 Synopsis 2 Plot 3 Voice Cast 4 Production 4.1 Research 4.2 Animation 4.3 Antz 5 Reception 5.1 Critical Response 5.2 Box Office Results 6 Trailers 7 Attached Short Film 8 Video Game 9 Reviews 10 Gallery 10.1 Posters 10.2 International Titles 10.3 Screenshots 11 References Synopsis[] The plot of A Bug's Life focuses on an outcast ant named Flik who recruits a group of warrior insects to help him rid his colony of evil grasshoppers, little does he know, they are actually circus insects. Plot[] Ant Island is the home of a colony of desperate and peaceful ants, ruled by the wise queen and her oldest daughter, Princess Atta, who is very timid and nervous of her responsibilities. The grasshoppers arrive once a season to extort food from the ants, supposedly in return for protection from bigger bugs. However, while working with an invention to pick grain more efficiently, a young optimistic ant named Flik accidentally destroys the annual offering that the ants were collecting to appease the grasshoppers. In exchange for a temporary reprieve from the grasshoppers, the ants are given until the end of autumn to produce an offering of twice the usual amount. Later, while he is being admonished by Atta and the royal council of the colony, Flik proposes a plan to recruit warrior bugs to fight off the grasshoppers, much to the Queen's amusement. When Atta and the council agrees to his proposal, Flik actually believes they have accepted the merits of his plan, whereas the council actually saw it as a convenient way of simply keeping Flik from wreaking any more havoc with their food-gathering activities. Flik finds his way to the Bug City garbage under a trailer, where he finds a group of recently fired circus performers, whose act had collapsed into chaos, and mistakes them for the warrior bugs he's seeking. The bug troupe, meanwhile, mistakes Flik for a talent agent who wants to book their act and agrees to travel with him back to Ant Island. Both Flik and the circus troupe soon become aware of their respective mistakes. However, the rest of the ant colony and the queen had become convinced that these newcomers are indeed the warriors for which they had hoped when the Circus Bugs help Flik pull off a daring rescue of Dot, Atta's younger sister of the colony, who idolizes Flik and a wounded Francis, a ladybug performer of the Circus Bug troupe from a predatory bird. Flik was also able to gain Princess Atta's respect and apology to him in the process. Caught between the opportunity to turn around his fortunes within the colony, and the knowledge that the bug troupe are not who they appear to be, Flik advocates building a fake bird to scare away Hopper, the leader of the grasshoppers, who is deeply afraid of birds. The ants unite behind Flik's plan until the circus ringmaster, P.T. Flea, arrives to retrieve his performers, thereby blowing Flik's cover. As punishment for deceiving the colony, Atta foolishly banishes Flik, who sadly joins the rest of the circus. Meanwhile, at the grasshopper's home under a sombrero in a desert, Molt, Hopper's brother is tricked by other grasshoppers into trying to talk Hopper out of returning to Ant Island since they have more than enough food to last, and it will rain soon. Hopper in response shows his henchmen exactly why they are returning by burying the three who questioned him with hundreds of seeds. Saying that the ants and seeds are alike, ants may be puny by themselves, but they outnumber grasshoppers 100 to 1. They aren't returning because of food; they're returning to keep the ants from figuring out how powerful they really are. Having wasted an enormous amount of time pursuing Flik's plan to stand up to the grasshoppers, the ants try desperately to gather enough food for a new offering, but due to the rapidly approaching winter season, they can't find enough food to meet the quota. When the grasshoppers return and are angered by the meager offering, Dot overhears Hopper's plan to squish the queen after receiving the full offering and convinces her friends to put Flik's bird plan back into action. With her wings finally grown in, she goes after Flik and convinces him and the Circus Bugs to return to save the colony from Hopper's tyranny. With the Circus Bugs' deception and the bird springing to action, the plan nearly works, but when a confused P.T. inadvertently incinerates the bird, Hopper realizes he has been tricked and takes out his anger on the ants, but more onto his primary instigator, Flik. After absorbing a beating from Hopper's rabid, feral grasshopper Thumper and to Hopper's declaration of ants living under salvery to grasshoppers, Flik declares, in response to Hopper's claims of species superiority: "You're wrong, Hopper. Ants are not meant to serve grasshoppers. I've seen these ants do great things, and year after year they somehow manage to pick enough food for themselves and you. So, who's the weaker species? Ants don't need grasshoppers! It's you who need us! We're a lot stronger than you say we are...and you know it, don't you?" Indeed, Hopper's angered and worried expression leads Flik to realize that Hopper has always known how strong the ants are. However, Hopper's reaction to Flik's challenge in front of the whole ant colony, along with Princess Atta make them collectively realize that they vastly outnumber the grasshoppers, and that they needn't endure their oppression any longer. As Hopper tries to squish Flik, Atta defends him and revolts against Hopper. The ants and the Circus Bugs rise up in a wave of fury and chase the grasshoppers, (excluding Molt) out for good, with Dot and Dim finally standing up to Thumper, but not before Hopper abducts Flik in a plan to exact revenge upon him. Flik's friends set off in pursuit of them, with Princess Atta in full admiration of Flik, rescuing him and thanks to some quick thinking by Flik, they lure Hopper to becoming devoured by a real bird and her chicks. Flik is welcomed back to the colony, and all the Circus Bugs join him in a celebration before departing from Ant Island. Voice Cast[] Dave Foley as Flik, a courageous but clumsy inventor ant wanting to make a difference. Kevin Spacey as Hopper, the leader of the grasshopper gang oppressing the ants. Julia Louis-Dreyfus as Princess Atta, the heir to the throne, Flik's love interest and Dot's older sister. Hayden Panettiere as Dot, Atta's younger sister and Flik's friend. Phyllis Diller as The Queen, an elderly ant who is Atta and Dot's mother. Richard Kind as Molt, Hopper's cowardly and dimwitted yet well-mannered younger brother. David Hyde Pierce as Slim, a walking stick clown often used as a stand-in for stick-like props in the circus. Joe Ranft as Heimlich, a large, gluttonous, German-accented caterpillar clown in the circus who desires to be a butterfly. Denis Leary as Francis, a hot-tempered male ladybug clown in the circus, who is frequently mistaken for a female and becomes "den mother" to the Blueberry Scouts. Jonathan Harris as Manny, an elderly, English-accented praying mantis magician in the circus who is Gypsy's husband. Madeline Kahn as Gypsy, a moth in the circus who is Manny's wife and lovely assistant. Bonnie Hunt as Rosie, a black widow spider who is Dim's "tamer" in the circus. Michael McShane as Tuck and Roll, two twin pillbug brothers from Hungary who speak in gibberish and act as cannonballs in the circus. John Ratzenberger as P.T. Flea, the ringmaster of the circus troupe. Brad Garrett as Dim, a childlike rhinoceros beetle that plays the "ferocious beast" in the circus. Roddy McDowall as Mr. Soil, the ant colony's resident thespian. Edie McClurg as Dr. Flora, the ant colony's doctor. Alex Rocco as Thorny, a small, deep-voiced ant and Atta's grouchy assistant. David Ossman as Cornelius, a very old ant with a walking stick. David Lander as Thumper, Hopper's deranged "pet" grasshopper.[4] Ashley Tisdale as the leader of the Blueberry Scouts, a troop of ant children that Dot belongs to.[4] Jan Rabson as Axle[4] Jack Angel as Thud, a big horsefly and bodyguard to the Fly Brothers.[4] Andrew Stanton as Harry, a mosquito that went into the light.[4] John Lasseter as Harry's Friend[4] Debi Derryberry as the Baby Maggots[4] Brian M. Rosen as Slick, a slug.[4] Rodger Bumpass as a Bar Mosquito[4] Additional Voices provided by Carlos Alazraqui, Bob Bergen, Kimberly Brown, Anthony Burch, Jennifer Darling, Rachel Davey, Paul Eiding, Jessica Evans, Bill Farmer, Sam Gifaldi, Brad Hall, Jess Harnell, Brenden Hickey, Kate Hodges, Denise Johnson, Sherry Lynn, Mickie McGowan, Courtland Mead, Christine Milian, Kelsey Mulrooney, Ryan O'Donohue, Jeff Pidgeon, Phil Proctor, Jordy Ranft, Rebecca Schneider, Franchesca Smith, Hannah Swanson, Russi Taylor, Travis Tedford, Lee Unkrich, and Jordan Warkol. Production[] Research[] Research for A Bug's Life was done using a small camera attached to Lego wheels, known as "the bug cam". Research was done in planters in front of Pixar Animation Studios and in a median strip on a highway outside of the studio. Animation[] A Bug's Life was a much more complex film than Toy Story because of the more complex character models, so Pixar's computers tended to run sluggishly for the animation process. The first shot in A Bug's Life starts from the point of view of a human and ends from the point of view of an insect, which is very complex. Because of its complexity, it was the most difficult shot in the film to produce. It was also one of the last shots produced for the film, because producing it required almost all of the production crew. The crowds of ants were particularly challenging, with some 400 crowd shots scattered throughout the film, with many requiring the animation of 800 characters. The technical team worked around this by instructing the animators to work with 4 or 5 groups of 8 to 10 ants. The software team wrote an "ant generator" program that would duplicate the character models and motions of the ants, and then automatically and randomly adjust the character models of each ant to change physical traits such as eye and skin color, height, and weight. The ants were then randomly scattered throughout the shot. This allowed these shots to be animated much more efficiently and for ants to look different from one another, despite the fact that the programmed motions would be nearly identical. These tools wer'''
