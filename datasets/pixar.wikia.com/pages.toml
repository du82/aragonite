full_description = '''in: Shorts, WALL•E Culture English Español Français Polski Русский BURN•E Sign in to edit History Talk (2) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"740e6aed-8e71-4c87-842f-45398734be12","impressionsPerSession":4}, impressionsPerSession: 4, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> See also: BURN-E (character) Directed by: Angus MacLane Release date: November 18, 2008 Running time: 7 minutes, 36 seconds BURN-E is a 2008 Pixar short film released on the WALL•E home video release.[1] It was written and directed by WALL•E directing animator, Angus MacLane, and produced by Pixar Animation Studios. It is a parallel spin-off from the feature-length movie WALL•E. A repair robot named BURN-E is a minor character from the first movie, and the film is intercut with scenes from WALL•E, which takes place concurrently. Contents 1 Plot 2 Cast 3 Credits 4 Trivia 5 References Plot[] The short begins with the words, "2805 AD, 821,190,000 miles from Earth," when EVE's spaceship is flying towards Saturn. WALL•E, who is clinging onto the side of the ship then runs his hand through one of the rings (as seen in the first movie). A small fragment of the ring starts moving at high speed away from Saturn, gets caught in Mars' gravity and catches fire while sling shooting around Mars. It then shoots away past EVE's ship and straight towards the Axiom where it smashes into one of its lights. On the bridge, AUTO sees the damage and contacts SUPPLY-R, a supply robot, who summons BURN-E, an engineering robot who is specifically designed for this job. SUPPLY-R hands him one of the three lamps which he stores inside himself and BURN-E, after shutting down the power for the lamp, goes outside and cuts out the base of the destroyed lamp. Meanwhile, WALL•E arrives at the ship and sees BURN-E, who is seating the new lamp in its socket. He waves at him and BURN-E sees and waves back, unaware that the lamp has already started drifting away and by the time he turns around, the lamp has drifted too far off into space. He desperately tries to get it back, but fails, and turns back for the door. BURN-E then goes back to SUPPLY-R and gets another lamp and starts the cycle again. Meanwhile, GO-4 has just placed the plant inside life pod #12 and he goes to turn it on. At the same time, WALL•E goes in to retrieve the plant, but before he can get back to EVE, GO-4 launches the pod. Outside, BURN-E hears the pod launch but dismisses the noise, until he hears the pod explode. Surprised, he turns around and in doing so, accidentally slices the lamp pole in two with his still-activated blowtorch. SUPPLY-R, now annoyed, drops the third and final lamp in front of BURN-E and he takes it, embarrassed. Soon, he is almost finished welding the lamp in place when WALL•E and EVE, finished with their space dance, fly in through the airlock near BURN-E, the only entrance into the ship, and lock him out. BURN-E hears the door slam shut and starts thumping on it, trying to make it alert the others, but he ultimately realizes that he has been locked out. For a while, BURN-E travels around the airlock waiting for the doors to open. Meanwhile, the garbage disposal is preparing to fire the cubes with EVE and WALL•E in them into space. EVE successfully breaks out of her garbage cube and then struggles to get WALL•E out. BURN-E sees the doors open and races towards them, realizing that he has a way in. Just as he approaches the doors a WALL•A unit shuts the airlock after noticing the commotion between EVE, WALL•E and M-O. BURN-E despondently makes his way back to his own airlock. Later, BURN-E is scorching a flower shape into the deck in front of him by heating up his hand with his blowtorch, when he realizes that he can use it to cut a hole in the door for himself. He does so and races back to SUPPLY-R, just as the captain and Auto begin their final fight. BURN-E reaches SUPPLY-R and is just about to press his POW-R button for the lamp when Auto turns the ship over. BURN-E is flung backward and is taken through the path to the airlock where he has to cling onto the lamp to avoid floating off into space. The Captain then de-activates Auto and rights the ship. BURN-E then tries to enter the ship, but it suddenly hyperjumps and BURN-E is caught in hyperspace and pinned to the side of the hull. The Axiom then lands on Earth at its landing dock. Released from the sudden acceleration, BURN-E falls forward with a groan. BURN-E, badly shaken, returns to where SUPPLY-R usually stands but is very surprised to see that he has disappeared. BURN-E searches all over the ship, but can't find anyone. Finally, his search brings him to life pod #9. There, he sees several robots on the ground below and he spots SUPPLY-R. He waves to him and his hand hits the Launch button. The pod is then launched and it lands right behind SUPPLY-R. BURN-E jumps out of the pod and giddily hopping over, presses SUPPLY-R's POW-R button, re-activating the lamp. As BURN-E whoops with the victory, the door of the life pod, which was forcibly ejected into the air when BURN-E got out, falls back down to Earth and hits the same lamp, destroying it yet again. BURN-E faints when he realizes this. After the credits, an arm comes out from SUPPLY-R's body and pats BURN-E's head and he says, in a dull, emotionless voice, "There, there." Cast[] Angus MacLane: BURN-E Ben Burtt: WALL•E (uncredited) Elissa Knight: EVE (uncredited) Jeff Garlin: Captain B. McCrea (uncredited) MacInTalk: AUTO (uncredited) Unknown: SUPPLY-R Tessa Swigart: SUPPLY-R's computer Credits[] See the credits page. Trivia[] The tune that BURN-E hums are "Ode to Joy." At the end of the short, the song is played again, this time with opera singers. References[] ↑ Slashfilm by Peter Sciretta June 20th, 2008 Categories Categories: Shorts WALL•E Culture Languages Español Français Polski Русский Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi Pixar'''
