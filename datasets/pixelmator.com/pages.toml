description = "Pixelmator Pro includes an astonishingly wide range of tools and features — powerful tools for creating, editing, and enhancing images, innovations that make the entire image editing workflow simpler and easier, and an incredibly modern, GPU-powered image editing engine powering everything under the hood."
full_description = "Tools Over 50 image editing tools for retouching, reshaping, painting, drawing, adding shapes, text, styles, and effects, adjusting colors, selecting image areas, moving and arranging elements Basic Arrange Transform Style Crop Slice Zoom Hand Color Picker Selecting Rectangular Selection Elliptical Selection Free Selection Polygonal Selection Select Row Select Column Quick Selection Magnetic Selection Color Selection Select Color Range Select and Mask Painting Brush Pixel Eraser Smart Eraser Color Fill Gradient Fill Retouching Repair Clone Lighten Darken Saturate Desaturate Sharpen Soften Smudge Reshaping Warp Bump Pinch Twirl Drawing and Vectors Pen Freeform Pen Shape Rectangle Shape Rounded Rectangle Shape Ellipse Shape Polygon Shape Star Shape Line Shape Type Type Circular Type Path Type Freeform Type Interface Unified, single-window interface designed for working with images Modern interface design puts the focus on your content Dark and light appearances Native macOS look and feel Welcome screen designed to make it easy to open recent images, create new ones, and open photos and videos from your library An efficient design means the interface looks good on small and large displays Fully customizable interface Toolbar color well with primary and secondary colors and ability to quickly swap them Crop tool designed for photographers with perspective correction and crop overlays based on common composition techniques, such as rule of thirds and golden ratio Workspace presets for photography, illustration, design, and painting Resizable layer thumbnails Informative layer descriptions showing layer properties, such as layer size, video duration, and more See an interactive split-screen view of any layer with and without edits applied to it Freely rotate the canvas to any angle and use every editing tool with a rotated canvas Hidden interface mode for quickly viewing a design without the distractions of the UI Set of alignment tools, including guides, rulers, and image grid Navigate around images with the Zoom tool and its responsive navigator Perform calculations directly in text fields Use handy, on-canvas controls to pause, play, mute, or edit video layers"
