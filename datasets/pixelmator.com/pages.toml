["https://pixelmator.com/blog/2022/12/06/pixelmator-pro-3-2-with-video-support-is-available-today.html"]
title = "Pixelmator Pro 3.2 with video support is available today - Pixelmator Blog"
description = "Grab your popcorn, everybody — Pixelmator Pro 3.2, codenamed Lumière, is finally here! It brings support for video layers, introducing exciting new ways to create moving designs in Pixelmator Pro."
full_description = "December 6, 2022 Pixelmator Pro 3.2 with video support is available today Grab your popcorn, everybody — Pixelmator Pro 3.2, codenamed Lumière, is finally here! It brings support for video layers, introducing exciting new ways to create moving designs in Pixelmator Pro. The update also adds support for new video and moving image formats, includes all-new video templates, improves Motion document support, and more. Video Layers Over the years, we brought many powerful, yet easy-to-use image editing tools to Pixelmator Pro and, from now on, you can use these same tools to edit videos, too. Video layers work just like regular image layers, making it incredibly quick and easy to mask or crop videos, add effects, change colors, and more. Powered by Apple’s AVFoundation framework, Pixelmator Pro brings blazingly fast video playback performance. So whether you’re just sprucing up your iPhone videos or creating multi-layered video compositions together with images, shapes, and text — you can enjoy an exceptionally smooth, real-time editing experience. And the best part is, you don’t need a separate video editing app to create captivating, moving designs. All-New Video Controls Use handy, on-canvas controls, to quickly play and pause videos, change video duration, scrub through individual frames, choose a poster frame, or mute audio. Keep the video controls visible at all times, even when you’re editing other layers, or display them automatically when a video layer is selected. For more complex compositions that include multiple video layers, we’ve added advanced settings for playback delay and choosing how the first and final frames of a video should behave. If you’d like to learn more about the new tools and some of the key video editing techniques in Pixelmator Pro, check out our latest YouTube video where we create a simple, moving composition using video and text layers. Video Templates To showcase a few of the cool ways video layers can be used in designs, we’ve created 12 gorgeous, cinema-inspired templates. Quickly replace placeholders in templates with your own videos or even Live Photos to get that blockbuster movie look in stunning 4K, or create eye-catching social media stories. Show every video in its best light by customizing templates using a number of artist-designed alternative elements and color palettes created exclusively for each template. New File Formats Pixelmator Pro now supports popular video formats including MP4 and QuickTime Movie, and you can even work with moving image formats such as animated GIFs and PNGs. Share your edited videos or video compositions in any supported video format with a customizable frame rate, quality, and size. When exporting designs as QuickTime movies, you can also choose from a range of compression formats, including HEVC with support for videos with transparency, Apple ProRes 4444 — a popular format in professional video post-production — and more. Motion Support Improvements Finally, as this update focuses primarily on video editing, it was a perfect opportunity for us to squeeze in a few Motion support improvements, too. Now, Pixelmator Pro designs exported to Motion will keep any custom fonts, and many of the nondestructive color adjustments and effects will be replaced with equivalent Motion filters. Thanks to these, and many other improvements, creating designs in Pixelmator Pro and animating them in Motion is now easier — and faster — than ever before. Open in App Store #section-5747 h3 { max-width: 750px; margin-top: 0; margin-inline: auto; padding-bottom: 8px; font-size: 22px; font-weight: 700; color: #0f0f0f; text-align: left; } p + p .icon-5747 { margin-top: 40px; margin-bottom: 11px; } p + div .video-5747 { margin-top: 67px; margin-bottom: 11px; } .video-5747 { position: relative; width: 49px; height: 49px; } .video-5747 > img, .video-5747 > video { position: absolute; } .video-5747 > img { top: 0; left: 0; z-index: 2; } .video-5747 > video { top: 50%; left: 50%; z-index: 1; translate: -50% -50%; } #section-5747 .learn-more { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 30px; font-size: 14px; font-weight: 500; color: #fff; letter-spacing: -0.02em; border: 1px solid #ff4169; background-color: #ff4169; border-radius: 26px; transition: border-color 130ms ease-in-out, color 130ms ease-in-out, background-color 130ms ease-in-out; } .hover #section-5747 .learn-more:hover { background-color: #ff6482; border-color: #ff6482; } #section-5747 div > video, #section-5747 .video-replay-overlay { border-radius: 15px; }"
