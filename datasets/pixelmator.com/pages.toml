full_description = "April 12, 2022 Pixelmator Pro 2.4 introduces color adjustments and effects layers Pixelmator Pro 2.4 is now available, bringing color adjustments and effects layers, a completely redesigned Layers sidebar, over 200 beautiful new vector shapes, support for M1 Ultra, and more. Color Adjustments and Effects Layers Color adjustments and effects layers let you nondestructively change the look of entire layered compositions more quickly and easily than ever before. These new layer types also make it possible to more easily make selective edits to photos, designs, and illustrations, completely transforming many common workflows. If you’d like to learn more about these layer types, we’ve got you covered – check out our video on this topic below. Redesigned Layers Sidebar The Layers sidebar has been redesigned with a fresh new look and a range of usability improvements – different layer types are now much more easily recognizable, layers feature informative subtitles, it’s now possible to customize layer thumbnail sizes, and more. Over 200 New Vector Shapes Pixelmator Pro 2.4 adds over 200 new artist-designed vector shapes in categories like science, activities, and symbols. Vector shapes are resolution-independent so can be used freely in any design or illustration. And they’ve been meticulously crafted to be pixel-perfect in pixel designs, so you won’t see any unwanted blurring at their edges when using them as icons or other elements in your designs. M1 Ultra Support Pixelmator Pro is a Universal app that runs natively on M1-powered Mac devices, taking full advantage of all the power of the new M1 Ultra chip and its unified memory architecture. Thanks to machine learning model optimizations, ML-powered tasks, like automatic background removal, super resolution, and photo enhancement are up to 1.7 times faster on M1 Ultra compared to M1 Max. Other Improvements Pixelmator Pro 2.4 also adds a new Scrubby Zoom mode, adding an all-new way to zoom images, brings the ability to unlink layer masks, includes new keyboard shortcuts for adding layers, and more. The update is totally free for all existing Pixelmator Pro users and $39.99 for those of you who don’t yet have a copy. Head on down to the Mac App Store to make sure you’re all up to date and enjoy all the shiny new features! Download Now #section-5535 .learn-more { display: inline-block; width: 146px; padding: 0; margin: 1em auto; font-size: 14px; font-weight: 700; color: #ffffff; line-height: 36px; letter-spacing: -0.014em; text-align: center; text-transform: uppercase; background-color:#FF4169; border: 0; border-radius: 8px; cursor: pointer; will-change: auto; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } #section-5535 .learn-more:hover {background-color: #FF6482;} #section-5535 h4 { max-width: 750px; margin-top: 0; margin-right: auto; margin-left: auto; padding-bottom: 8px; font-size: 22px; font-weight: 700; color: #0f0f0f; text-align: left; } p + p .icon-5535 { margin-top: 40px; margin-bottom: 11px; } div + p .icon-5535 { margin-top: 60px; margin-bottom: 11px; } #section-5535 video, #section-5535 .video-replay-overlay { border-radius: 15px; }"
