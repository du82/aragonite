["https://pixelmator.com/blog/2022/09/22/pixelmator-team-unveils-pixelmator-pro-3-0-with-more-than-200-stunning-design-templates-and-mockups.html"]
title = "Pixelmator Team unveils Pixelmator Pro 3.0 with more than 200 stunning design templates and mockups - Pixelmator Blog"
description = "Hey everyone! We’re incredibly happy to announce that today, we’re releasing Pixelmator Pro 3.0, codenamed Muse. It introduces an all-new way to create designs with over 200 easy-to-use templates, 16 fully customizable mockups, AI-powered template editing, document color palettes, and more."
full_description = "September 22, 2022 Pixelmator Team unveils Pixelmator Pro 3.0 with more than 200 stunning design templates and mockups Hey everyone! We’re incredibly happy to announce that today, we’re releasing Pixelmator Pro 3.0, codenamed Muse. It introduces an all-new way to create designs with over 200 easy-to-use templates, 16 fully customizable mockups, AI-powered template editing, document color palettes, and more. This update is packed full of awesome new features and we cannot wait to tell you more about them, so let’s dive right in. 200+ Design Templates With more than 200 stunning new templates, you can quickly create high-quality designs in a wide range of different formats, including social media posts, resumes, posters, cards, and others. It takes just a few clicks to personalize a template and turn it into something that’s uniquely yours. But that’s not all. If you’ve got a small business or you’re creating a personal brand, you’re going to love the new brand templates. You can choose from 12 different brand collections with templates for web, print, and more. In each collection, you’ll find templates created using the same design language which makes it very easy to build a consistent and eye-catching visual identity. Ready to try out the new templates? We’ve prepared an in-depth video tutorial about working with templates to help you get started. Fully-Customizable Mockups Mockups let you easily bring your designs to life by displaying them in beautifully-designed compositions. Find mockups for devices such as Mac, iPad, and iPhone, and printed media, including posters, book covers, and more. Freely customize mockups with a number of alternative lighting effects, or recolor different elements in compositions to find just the right look for your design. The ultra high-quality mockups are perfect for both personal or professional use. In fact, the Pixelmator marketing team has already given the new mockups its seal of approval and we are now using them to showcase Pixelmator Pro on the App Store! If you’d like to learn more about how you can make your own designs pop using mockups, check out our latest Youtube tutorial. Smart Replace To make template editing quick and intuitive, we’ve introduced Smart Replace, an incredibly intelligent feature supercharged with the power of three machine learning features: Remove Background, Auto Fill, and ML Super Resolution. Now, when replacing placeholder content, Pixelmator Pro can automatically remove backgrounds, find the most optimal composition and placement, and upscale images if their quality is too low. Element Alternatives Easily customize templates and mockups with a number of built-in alternative elements — lighting, shapes, effects, and illustrations — created exclusively for each design. For example, when working with mockups, you can completely change their look and feel with lighting effects such as Direct Light, Diffused Light, Plant Shadows, and others. If you’d like to try out a few different looks, you can quickly switch between the alternative elements with easy-to-use on-canvas controls. Document Colors Templates and mockups come with a set of built-in color presets available from the new Document Colors menu. Using the presets, you can completely change the entire color scheme of an image with just a few clicks. The feature works by changing all nondestructively applied colors in a composition — whether it’s a gradient stop in gradient map effect, a color fill, or even a shadow. You can also customize individual colors in templates or your own designs to create new document color presets. We had an absolute blast working on this update and hope you’re going to enjoy using the templates as much as we enjoyed creating them. And we’re not stopping there — we plan to continue adding new template and mockup designs to Pixelmator Pro in the future, so keep an eye out for those! Pixelmator Pro 3.0 Muse is a free update to all existing users and is available on the Mac App Store now. New users can get a copy of Pixelmator Pro for $39.99 at the link below. Download Now #section-5591 .learn-more { display: inline-block; width: 146px; padding: 0; margin: 1em auto; font-size: 14px; font-weight: 700; color: #ffffff; line-height: 36px; letter-spacing: -0.014em; text-align: center; text-transform: uppercase; background-color:#FF4169; border: 0; border-radius: 8px; cursor: pointer; will-change: auto; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } #section-5591 .learn-more:hover {background-color: #FF6482;} #section-5591 h4 { max-width: 750px; margin-top: 84px; margin-right: auto; margin-left: auto; padding-bottom: 8px; font-size: 22px; font-weight: 700; color: #0f0f0f; text-align: left; } #section-5591 .browser-wrapper { margin-top: 35px; } #section-5591 .browser-wrapper picture { position: relative; display: block; width: 100%; max-width: auto; height: 927px; } #section-5591 .browser-wrapper img { position: absolute; top: 0; left: 50%; width: 1837px; max-width: 1837px; height: 100%; transform: translateX(-50%); } @media only screen and (max-width: 859px) { #section-5591 .browser-wrapper picture { height: 309px; } #section-5591 .browser-wrapper img { width: 612px; max-width: 612px; } } #section-5591 video, #section-6672 .video-replay-overlay { border-radius: 15px; } .content {overflow: hidden;}"
