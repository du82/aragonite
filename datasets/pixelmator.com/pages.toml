lide Over or Split View. Extensions Photomator Editing extension lets you apply Pixelmator effects right in the Photos app. Metal Metal-based Distort tools let you reshape areas of an image with unprecedented speed and quality. Grand Central Dispatch Pixelmator takes advantage of Grand Central Dispatch technology for advanced multicore processing. 16K Support Open and edit huge, 16K images up to 100 megapixels on the 12.9-inch iPad Pro."
