title = "Pixelmator Blog"
description = "Today we have some important news to share: the Pixelmator Team plans to join Apple."
full_description = "November 1, 2024 A new home for Pixelmator Today we have some important news to share: the Pixelmator Team plans to join Apple. We’ve been inspired by Apple since day one, crafting our products with the same razor-sharp focus on design, ease of use, and performance. And looking back, it’s crazy what a small group of dedicated people have been able to achieve over the years from all the way in Vilnius, Lithuania. Now, we’ll have the ability to reach an even wider audience and make an even bigger impact on the lives of creative people around the world. What to expect Pixelmator has signed an agreement to be acquired by Apple, subject to regulatory approval. There will be no material changes to the Pixelmator Pro, Pixelmator for iOS, and Photomator apps at this time. Stay tuned for exciting updates to come. Thank you We want to give a big thanks to our amazing users for your support over the past 17 years. Your feedback has played a huge role in shaping our apps into what they are today. As we step into this exciting new chapter, we can’t wait to share what’s next. – Pixelmator Team #section-7818 h3 { max-width: 750px; margin-top: 67px; margin-inline: auto; padding-bottom: 8px; font-size: 22px; font-weight: 700; color: #0f0f0f; text-align: left; } May 23, 2024 Pixelmator Pro 3.6 supercharges masking with AI and vector masks Pixelmator Pro 3.6, codenamed Archipelago, is here and brings incredible new masking capabilities, including AI-powered background masks, support for vector masks, new on-canvas mask controls, and much more. These new features are designed to make working with masks easier for beginners and faster for pros, so everyone can make the most of nondestructive editing when creating their own designs. Watch overview All-New Masking Experience Masking in Pixelmator Pro 3.6 has been reengineered from the ground up to offer quicker and more convenient ways to add and refine masks. For example, you can now instantly mask a layer or create a mask from a selection by simply double-clicking it on the canvas using the Arrange tool. You can then effortlessly resize and reposition the mask, or even adjust its corners, making tasks like rounding image corners or cropping individual layers in multi-layer compositions much faster and easier. For refining masks, you’ll now find all the necessary tools conveniently located at the bottom of your screen. The new on-canvas controls appear whenever you select or create a mask, allowing you to quickly adjust its transparency or edge softness, invert it, add new masks, and more. And, with support for multiple masks, you can work with as many masks as you need, using blend modes to combine them in different ways. AI Background Masks The new AI-powered Hide Background feature now lets you nondestructively remove image backgrounds with just a single click. The intelligent subject detection algorithm automatically finds the subject in an image and adds a precise background mask to hide everything else. You can always hide or reveal any additional details of the subject or background by simply refining the mask. This means your original image always remains intact and unchanged, giving you the freedom to make adjustments and experiment with edits as much as you like. Vector Masks The new vector masks in Pixelmator Pro make it easy to quickly mask layers into specific shapes, opening up new editing workflows. Vector masks consist of paths and use shapes to hide or reveal parts of layers. When you add a vector mask, the areas inside the vector shape remain visible and the areas outside are hidden, creating a cookie-cutter-like effect. To mask a layer, simply select a shape from the special new Mask menu at the top of the layers sidebar, or create a mask from scratch using the Pen tools. You can also easily switch between different mask shapes by selecting them from the Shape browser conveniently located at the bottom of the screen. Vector masks are also fully editable, allowing you to adjust each individual point just like you would when editing regular shapes, and offer resolution-independent scaling, making them perfect for designs that need to maintain high quality at any size, like graphics created for web or print. We’re really excited to bring you these powerful new features that make working with masks faster and easier than ever. As always, the update is completely free to all existing Pixelmator Pro users. And, If you haven’t tried Pixelmator Pro yet, be sure to give it a go. It has just hit an impressive 43,000 5-star ratings on the Mac App Store! Open in App Store #section-7319 h3 { max-width: 750px; margin-top: 67px; margin-inline: auto; padding-bottom: 8px; font-size: 22px; font-weight: 700; color: #0f0f0f; text-align: left; } #section-7319 .learn-more { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 30px; font-size: 14px; font-weight: 500; color: #fff; letter-spacing: -0.02em; border: 1px solid #ff4169; background-color: #ff4169; border-radius: 26px; transition: border-color 130ms ease-in-out, color 130ms ease-in-out, background-color 130ms ease-in-out; } .hover #section-7319 .learn-more:hover { background-color: #ff6482; border-color: #ff4169; } #section-7319 .watch__link { text-align: center; font-weight: 500; color: #026FC9; letter-spacing: -0.001em; transition: color 130ms ease-in-out; } #section-7319 .watch__link svg {margin-left: 5px;} #section-7319 .watch__link svg path {fill: #026FC9;} .hover #section-7319 .watch__link:hover {color: #358cd4;} .hover #section-7319 .watch__link:hover svg path {fill: #358cd4;}"
