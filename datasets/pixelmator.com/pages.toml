title = "A new home for Pixelmator - Pixelmator Blog"
description = "Today we have some important news to share: the Pixelmator Team plans to join Apple."
full_description = "November 1, 2024 A new home for Pixelmator Today we have some important news to share: the Pixelmator Team plans to join Apple. We’ve been inspired by Apple since day one, crafting our products with the same razor-sharp focus on design, ease of use, and performance. And looking back, it’s crazy what a small group of dedicated people have been able to achieve over the years from all the way in Vilnius, Lithuania. Now, we’ll have the ability to reach an even wider audience and make an even bigger impact on the lives of creative people around the world. What to expect Pixelmator has signed an agreement to be acquired by Apple, subject to regulatory approval. There will be no material changes to the Pixelmator Pro, Pixelmator for iOS, and Photomator apps at this time. Stay tuned for exciting updates to come. Thank you We want to give a big thanks to our amazing users for your support over the past 17 years. Your feedback has played a huge role in shaping our apps into what they are today. As we step into this exciting new chapter, we can’t wait to share what’s next. – Pixelmator Team #section-7818 h3 { max-width: 750px; margin-top: 67px; margin-inline: auto; padding-bottom: 8px; font-size: 22px; font-weight: 700; color: #0f0f0f; text-align: left; }"
