["https://pixelmator.com/blog/2023/12/20/pixelmator-pro-now-supports-ai-and-eps-files-from-adobe-illustrator.html"]
title = "Pixelmator Pro now supports AI and EPS files from Adobe Illustrator - Pixelmator Blog"
description = "Pixelmator Pro introduces support for Adobe Illustrator (AI) and Illustrator EPS files, letting you open these files with all their layers, including text and shape layers, fully preserved, and easily edit them in Pixelmator Pro. Additionally, this update includes performance improvements, ensuring an even faster image editing experience when switching between tools and opening documents in Pixelmator Pro. In preparation for the upcoming holidays, we’ve also included a stunning collection of holiday templates in Pixelmator Pro."
full_description = "December 20, 2023 Pixelmator Pro now supports AI and EPS files from Adobe Illustrator Pixelmator Pro introduces support for Adobe Illustrator (AI) and Illustrator EPS files, letting you open these files with all their layers, including text and shape layers, fully preserved, and easily edit them in Pixelmator Pro. Additionally, this update includes performance improvements, ensuring an even faster image editing experience when switching between tools and opening documents in Pixelmator Pro. In preparation for the upcoming holidays, we’ve also included a stunning collection of holiday templates in Pixelmator Pro. AI File Support Pixelmator Pro now supports native Illustrator data in AI documents. This means that when you open AI files in Pixelmator Pro, all layers and layer groups are preserved, allowing you to seamlessly edit shapes and even text layers. This enhancement greatly expands the capabilities of Pixelmator Pro, letting you open AI files without the need for Adobe Illustrator and convert AI files into other formats when needed. Illustrator EPS File Support Pixelmator Pro now offers full support for Illustrator EPS files, which is another file format produced by Adobe Illustrator. While this format is older and no longer supported on macOS 14 Sonoma, it’s still commonly used for sharing vector graphics. With Illustrator EPS file support in Pixelmator Pro, you can open EPS files with all the layers intact and easily edit shapes, text layers, and more. Additionally, you can use the Convert Image action in the Shortcuts app to effortlessly convert EPS files into various other formats. Improved Performance We are committed to enhancing your experience with Pixelmator Pro, and as part of our ongoing efforts, we are introducing further performance improvements. This means you can now enjoy quicker tool switching and faster document opening, making Pixelmator Pro work at lightning-fast speeds! Holiday Templates With the holidays around the corner, we are excited to introduce a collection of stunning new holiday templates. These templates are crafted to simplify the process of creating beautiful holiday cards, posters, social media posts, and stories. Our latest release includes 14 brand-new templates, among which you’ll find 8 festive moving design options. In addition, we’ve added 11 new holiday shapes to the Shapes browser in Pixelmator Pro, offering you even more creative possibilities when making your designs from scratch. The update is free to all existing users. If you haven’t got a copy of Pixelmator Pro yet, you can still purchase it at a 50% discount for the next 24 hours, making it a perfect gift for yourself or your loved ones. It’s our way of wishing you the happiest of holidays! Open in App Store #section-7019 h3 { max-width: 750px; margin-top: 0; margin-inline: auto; padding-bottom: 8px; font-size: 22px; font-weight: 700; color: #0f0f0f; text-align: left; } p + p .icon-7019, div + p .icon-7019, style + p .icon-7019 { margin-top: 40px; margin-bottom: 11px; } #section-7019 .learn-more { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 30px; font-size: 14px; font-weight: 500; color: #fff; letter-spacing: -0.02em; border: 1px solid #ff4169; background-color: #ff4169; border-radius: 26px; transition: border-color 130ms ease-in-out, color 130ms ease-in-out, background-color 130ms ease-in-out; } .hover #section-7019 .learn-more:hover { background-color: #ff6482; border-color: #ff4169; }"
