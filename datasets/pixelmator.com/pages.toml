["https://pixelmator.com/photomator"]
title = "Photomator"
description = "Photomator is a powerful yet easy-to-use photo editor for Mac, iPhone, iPad, and Vision Pro. It includes an extensive collection of powerful color adjustments, support for over 750 RAW image formats, a magical Repair tool for removing unwanted objects, and much more. Simply put, it has everything you need to make your photos stand out."
full_description = "Designed exclusively for Mac, iPhone, and iPad. Photomator features a gorgeous native design and takes full advantage of iOS and macOS technologies like SwiftUI, Apple silicon, Core ML, Core Image, and Metal to deliver blazingly fast editing, zooming, and scrolling, even in large images. Photomator also fully supports great iPadOS features like the Apple Pencil hover, Split View, and many others. The ultimate photo editor for Mac, iPhone, iPad, and Vision Pro. Photomator is a powerful yet easy-to-use photo editor for Mac, iPhone, iPad, and Vision Pro. It includes an extensive collection of powerful color adjustments, support for over 750 RAW image formats, a magical Repair tool for removing unwanted objects, and much more. Simply put, it has everything you need to make your photos stand out. Get Photomator Get Photomator from the App Store today and see how easy it is to make every shot your best. Buy now .cls-1 { fill-rule: evenodd; } Effortlessly organize your photo library. Batch edit your photos in seconds. Powerful, nondestructive color adjustments. Make objects disappear like magic. Change the look and feel of photos with powerful color adjustments. Make your photos stand out with a wide collection of powerful, nondestructive color adjustments. In Photomator, you’ll find everything from essential adjustments like brightness, contrast, and exposure to advanced tools like multi-channel curves and wheel-based color balance. Cutting-edge color adjustments. Thanks to an advanced, texture-aware algorithm, you can enhance textures and recover incredible amounts of detail in the highlights and shadows of photos, all while maintaining exceptional photo quality. Selective adjustments. Automatically make subject, sky, and background selections in photos using AI. Use linear and radial masks, or paint over specific areas you want to adjust with a brush. LUT support. Instantly adjust the colors of images using universal color presets. Export LUTs to other apps or import them to Photomator, where they can be converted into individual color adjustments using machine learning. See the full list of adjustments Unlock the full potential of RAW photos. Easily open and edit RAW images right on your Mac, iPhone, and iPad. Every adjustment and filter in Photomator takes full advantage of the extended range data in RAW photos, so you can recover seemingly lost detail in shadows or blown highlights, and adjust colors with incredible accuracy. Highlight and shadow recovery. Recover incredible amounts of detail in highlights and shadows of RAW photos, and enjoy true-to-life colors and textures even in extremely underexposed and overexposed shots. Support for over 750 RAW image formats. Photomator supports RAW images from most popular camera models, including the Apple ProRAW format. View supported RAW formats Browse and organize photos with ease. Photomator is designed from the ground up to bring a seamless photo management experience on your Mac, iPad, and iPhone. It offers incredibly fast browsing performance, supports drag-and-drop for importing photos, and includes many more native features. Native browsing experience. Photomator automatically syncs any edits you make in the photo browser with your Photos library, while full support for the native Apple File System lets you edit photos anywhere on your device, external drives, or cloud services. Image culling. Effortlessly manage your photo library by adding star ratings, flagging favorites, and rejecting unwanted shots across all devices, while also using advanced filtering options on Mac. Learn how to migrate photos from other apps to Photomator Tap into the power of machine learning. Photomator uses machine learning to provide a fast and wildly intelligent image editing experience, automatically taking care of all the little things that go into a great photo. Thanks to machine learning, we can create groundbreaking new features that have never been possible before. Auto Enhance Automatically enhance photos like a pro photographer. Super Resolution Magically increase the resolution of photos with no unwanted blurring. Smart Deband Quickly remove color banding artifacts from photos and increase color depth. Denoise Effortlessly remove camera noise and image compression artifacts. Repair Remove small imperfections or even entire objects from photos. ML Crop Automatically improve the composition of photos. Select Subject Quickly and easily select subjects of photos. Select Sky Instantly select the sky in any photo with ease. Select Background Automatically select the background in any photo. Magically remove unwanted objects in the blink of an eye. The Repair tool in Photomator is more than just a spot removal tool. In fact, it can make entire objects disappear from photos, recreating complex backgrounds with ease. So even if you didn’t quite get the perfect shot the first time around, you can use image editing magic to make sure the final photo looks its best. Replay .cls-1 { fill-rule: evenodd; } A full-featured batch editing experience. With Photomator, it’s a snap to edit even hundreds of photos in moments. You can create your own editing workflows to apply presets, automatically enhance photos, crop and rotate them, remove camera noise, apply watermarks, and more. And you can also quickly copy and paste adjustments between photos in the photo browser. Photographer-designed presets inspired by film photography. Photomator comes with a collection of gorgeous, handcrafted photography presets for your photos. With 5 unique preset groups, you can easily apply black & white or cinematic looks to your photos, emulate analog film, enhance night or landscape shots, and more. These black and white presets are based on classic black and white films. The black and white look is very versatile and is great for artistic photography, landscapes, portraits, street photography, and many other styles. Especially when you want to add a little drama. Some presets apply film-style grain to create an old-school film feel, others increase contrast for a more striking look. Inspired by the contemporary color grading process used in the movie and video industry, these presets emulate the cinematic look and feel. Many of them are based on the ‘teal and orange’ look, which is a pretty simple but very effective way to get a photo’s colors to pop, emphasizing skin tones and color contrasts. Subtle changes to the colors of the shadows and highlights of an image are key to achieving this look. Before digital, there was analog. And many analog films have become legendary for their visual qualities — these presets are based on some of the most well-known and popular analog films. This collection is great for portrait and lifestyle photography, adding a subtle and tasteful vintage look and feel. This collection of presets for landscape photography is designed to boost colors and bring out details in photographs of nature — especially in shots with lots of greens and blues. Along with color changes, the presets also increase contrast for a more striking and eye-catching look. Designed for shots taken in low light, this collection works especially well with photos of cities taken at night. The presets bring out details in the highlights and add tasteful color tints for an artistic finishing touch. Here you’ll find all the presets you create. Save any combination of color adjustments as a custom preset to quickly apply them to any of your photos and even share presets with others. Easily perfect composition, framing, and perspective. Using the Crop tool, you can easily improve the composition of your shots, adjust perspective, and even use machine learning-powered auto cropping to get a suggestion for new ways to frame your photos. Intelligent auto cropping. Automatically improve the composition of a photo using a machine learning algorithm trained to make photos more striking and eye-catching. ML Crop Presets. ML Crop works seamlessly with aspect ratio presets. So when you’ve automatically cropped a photo and choose a preset, ML Crop adjusts the photo to the new aspect ratio. Designed exclusively for Mac, iPhone, and iPad. Photomator features a gorgeous native design and takes full advantage of iOS and macOS technologies like SwiftUI, Apple silicon, Core ML, Core Image, and Metal to deliver blazingly fast editing, zooming, and scrolling, even in large images. Photomator also fully supports great iPadOS features like the Apple Pencil hover, Split View, and many others. White Balance Quickly change the mood of your image by making all the colors warmer or cooler, or use the machine learning-powered White Balance to automatically fix white balance in shots with unwanted color casts. Basic Adjust lightness, contrast, clarity and texture of an image using the Basic adjustment. Lift the shadows and pull in highlights to reveal hidden detail. Adjust Brightness to enhance photos that are a little too bright or too dark. Or use Clarity and Texture adjustments to enhance image details and make subjects in your shots stand out. Selective Clarity Use the Selective Clarity adjustment to subtly enhance fine details in specific areas of an image. Adjust shadows, midtones, or highlights individually, bringing the most important details into focus. Hue & Saturation Shift all the colors in your image along the color spectrum, make colors richer and more brilliant, or adjust their vibrancy. The Hue & Saturation adjustment also features an Auto button that lets you make photos more vivid and vibrant using the power of breakthrough machine learning. Color Balance Change the balance of all the colors in your photo by adjusting the intensity of red, green, blue, cyan, magenta, and yellow. Selective Color The Selective Color adjustment lets you easily adjust precise color ranges in your image, like the blues, yellows, or greens, without affecting any of the others. It features 8 individual color ranges divided according to the color spectrum. Levels Levels is a great adjustment for almost any photo as it’s designed to be both versatile and easy to use. So you can quickly improve the most important aspects of a photo, like the brightness, contrast, and colors, all in one place. Curves The Curves adjustment is one of the most powerful in all of image editing, letting you adjust almost every aspect of the lighting and colors in your shots with an incredible level of depth and precision. Replace Color Use the Replace Color adjustment to replace any color in your image with any other. You can pick both the color you want to replace and its replacement in any way like. For example, using the built-in Color Picker to pick a color directly from your image, or using the native Colors window. Fade Wash out the contrasts in your photo to give it a faded look. Black & White Featuring a range of options that help bring out the contrasts, textures, lighting, and shadows in your black-and-whites, the Black & White adjustment lets you create beautiful black and white photography, even from your color photos. Color Monochrome Use the Color Monochrome effect to turn all the colors in your image into shades of a single color. You can also blend the new monochrome with your original image using Intensity. Sepia Instantly give your photo an aged, vintage look by changing all the colors into shades of sepia. Channel Mixer Mix the balance of the red, green, and blue color channels to create intense color effects in your images. Invert The Invert adjustment instantly inverts all the colors in your image in their opposite colors. Custom LUT Transform the look of an image using a LUT file – a color preset created in Pixelmator Pro or another image editing, video, or graphics app. Vignette Add an artistic vignette around photos to create a retro look or draw attention to your subjects. Sharpen The Sharpen adjustment gives you a way to quickly make all the details in your photo clearer by increasing overall sharpness. Grain Add a touch of natural film grain to emulate the look of analog film in your digital photos."
