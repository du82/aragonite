["https://pixelscopic.com/about"]
title = "About |"
description = "An Interactive Media Company"
full_description = "Ryan Baker Co-Founder, CCO, Vision Director Ryan (aka “Baker”) is the creative leader behind the company’s conceptual and aesthetic vision, and was a graphic designer and painter before he moved to game development. He started as a pixel artist and sprite animator at his former employer before rising to the roles of Lead Artist, Lead Designer, Art Director, and Creative Director on a number of projects. Going independent in 2010, he shortly thereafter teamed up with Coby to found Pixeslcopic with his experience in game direction and project management, and his passion for artistry. Ryan’s constant goal is to design nuanced yet tightly constructed and edited games, and to expand Pixelscopic’s artistic process with techniques from his background in fine art and illustration, graphic design, and traditional animation. Ryan continues to grow his large and varied archive of games and gaming ephemera, plays the drums and dabbles in guitar, and is also our resident spreadsheet wizard. Twitter LinkedIn Ryan Burrell Director of Technical Design Ryan (aka “Burrell”) serves as a jack-of-all-trades contributing in the areas of game design, visual production, user interfaces, scripting, and level design. He is also Pixelscopic’s resident web technology expert and manages our social media communications. Ryan has occupied a variety of different roles throughout his career ranging from technical support specialist, to developer, to graphic designer, and has worked in industries ranging from ISPs and e-commerce to boutique design and branding. He joined the Pixelscopic team in early 2011 and cut his teeth on their first Nintendo DS project. Ryan strives to stay abreast of current trends and methodologies in the tech and entertainment sectors and maintains eclectic gaming interests. He still makes it a point to play with LEGOs in his free time and can be found most Friday nights fumbling through a D&D 3.5 session — these two activities often occurring at the same time. Twitter LinkedIn Coby Utter Co-Founder, CEO, Engineering Director Coby manages the long term technology vision for Pixelscopic and oversees business development and administration. He spent several years as a Lead Programmer and later Programming Director at another game company before going independent. He worked on an original casual game while living in Mexico in 2009, and returned to the U.S. to start Pixelscopic in 2010. Coby has a strong interest in entrepreneurial experimentation and is driven by a fast, flexible, and user-friendly approach to game technology. On a daily basis he is the driving force for both our company’s cross-platform engine and our gameplay programming foundations. He remains active on independent game development forums, keeps an eye out for interesting indie RPGs, and has dreams of rebuilding his SNES collection. Twitter LinkedIn"
