["https://pixijs.com/8.x/guides/components/containers"]
title = "Containers | PixiJS"
description = "The Container class provides a simple display object that does what its name implies - collect a set of child objects together.  But beyond grouping objects, containers have a few uses that you should be aware of."
full_description = '''On this pageContainers The Container class provides a simple display object that does what its name implies - collect a set of child objects together. But beyond grouping objects, containers have a few uses that you should be aware of. Commonly Used Attributes​ The most common attributes you'll use when laying out and animating content in PixiJS are provided by the Container class: PropertyDescriptionpositionX- and Y-position are given in pixels and change the position of the object relative to its parent, also available directly as object.x / object.yrotationRotation is specified in radians, and turns an object clockwise (0.0 - 2 * Math.PI)angleAngle is an alias for rotation that is specified in degrees instead of radians (0.0 - 360.0)pivotPoint the object rotates around, in pixels - also sets origin for child objectsalphaOpacity from 0.0 (fully transparent) to 1.0 (fully opaque), inherited by childrenscaleScale is specified as a percent with 1.0 being 100% or actual-size, and can be set independently for the x and y axisskewSkew transforms the object in x and y similar to the CSS skew() function, and is specified in radiansvisibleWhether the object is visible or not, as a boolean value - prevents updating and rendering object and childrenrenderableWhether the object should be rendered - when false, object will still be updated, but won't be rendered, doesn't affect children Containers as Groups​ Almost every type of display object is also derived from Container! This means that in many cases you can create a parent-child hierarchy with the objects you want to render. However, it's a good idea not to do this. Standalone Container objects are very cheap to render, and having a proper hierarchy of Container objects, each containing one or more renderable objects, provides flexibility in rendering order. It also future-proofs your code, as when you need to add an additional object to a branch of the tree, your animation logic doesn't need to change - just drop the new object into the proper Container, and your logic moves the Container with no changes to your code. So that's the primary use for Containers - as groups of renderable objects in a hierarchy. Check out the container example code. Masking​ Another common use for Container objects is as hosts for masked content. "Masking" is a technique where parts of your scene graph are only visible within a given area. Think of a pop-up window. It has a frame made of one or more Sprites, then has a scrollable content area that hides content outside the frame. A Container plus a mask makes that scrollable area easy to implement. Add the Container, set its mask property to a Graphics object with a rect, and add the text, image, etc. content you want to display as children of that masked Container. Any content that extends beyond the rectangular mask will simply not be drawn. Move the contents of the Container to scroll as desired. // Create the application helper and add its render target to the pagelet app = new Application({ width: 640, height: 360 });document.body.appendChild(app.view);// Create window framelet frame = new Graphics({ x:320 - 104, y:180 - 104}).rect(0, 0, 208, 208).fill(0x666666).stroke({ color: 0xffffff, width: 4, alignment: 0 })app.stage.addChild(frame);// Create a graphics object to define our masklet mask = new Graphics()// Add the rectangular area to show .rect(0,0,200,200) .fill(0xffffff);// Add container that will hold our masked contentlet maskContainer = new Container();// Set the mask to use our graphics object from abovemaskContainer.mask = mask;// Add the mask as a child, so that the mask is positioned relative to its parentmaskContainer.addChild(mask);// Offset by the window's frame widthmaskContainer.position.set(4,4);// And add the container to the window!frame.addChild(maskContainer);// Create contents for the masked containerlet text = new Text({ text:'This text will scroll up and be masked, so you can see how masking works. Lorem ipsum and all that.\n\n' + 'You can put anything in the container and it will be masked!', style:{ fontSize: 24, fill: 0x1010ff, wordWrap: true, wordWrapWidth: 180 }, x:10});maskContainer.addChild(text);// Add a ticker callback to scroll the text up and downlet elapsed = 0.0;app.ticker.add((ticker) => { // Update the text's y coordinate to scroll it elapsed += ticker.deltaTime; text.y = 10 + -100.0 + Math.cos(elapsed/50.0) * 100.0;}); There are two types of masks supported by PixiJS: Use a Graphics object to create a mask with an arbitrary shape - powerful, but doesn't support anti-aliasing Sprite: Use the alpha channel from a Sprite as your mask, providing anti-aliased edging - not supported on the Canvas renderer Filtering​ Another common use for Container objects is as hosts for filtered content. Filters are an advanced, WebGL/WebGPU-only feature that allows PixiJS to perform per-pixel effects like blurring and displacements. By setting a filter on a Container, the area of the screen the Container encompasses will be processed by the filter after the Container's contents have been rendered. Below are list of filters available by default in PixiJS. There is, however, a community repository with many more filters. FilterDescriptionAlphaFilterSimilar to setting alpha property, but flattens the Container instead of applying to children individually.BlurFilterApply a blur effectColorMatrixFilterA color matrix is a flexible way to apply more complex tints or color transforms (e.g., sepia tone).DisplacementFilterDisplacement maps create visual offset pixels, for instance creating a wavy water effect.NoiseFilterCreate random noise (e.g., grain effect). Under the hood, each Filter we offer out of the box is written in both glsl (for WebGL) and wgsl (for WebGPU). This means all filters should work on both renderers. Important: Filters should be used somewhat sparingly. They can slow performance and increase memory usage if used too often in a scene.Edit this page'''
