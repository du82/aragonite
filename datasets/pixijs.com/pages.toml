full_description = "Version: v7.xUpgrading PixiJS PixiJS uses a lot of peerDependencies internally to define the relationship between packages. This has created unpredictable errors because of how npm resolves peers when bumping/upgrading (e.g., #8382, #8268, #8144, #7209). When you're upgrading using npm please completely uninstall instead of just changing the version in your package.json: npm uninstall pixi.jsnpm install pixi.js If you are using any PixiJS community plugins, please make sure to uninstall those too: npm uninstall pixi.js @pixi/particle-emitter @pixi/soundnpm install pixi.js @pixi/particle-emitter @pixi/soundEdit this page"
