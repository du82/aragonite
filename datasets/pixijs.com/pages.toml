["https://pixijs.com/blog"]
title = "PixiJS News | PixiJS"
description = "Latest news from the PixiJS team"
full_description = '''PixiJS Update - v8.7.0January 24, 2025 · 3 min readZyiePixiJS AdminWe're happy to announce the release of PixiJS v8.7.0, featuring a number of new features and improvements that you have been asking for. This version includes: Render Layers: Control the rendering order of objects independently of their scene graph hierarchy. GIF Support: Load and manipulate animated GIFs with playback controls. Three.js Integration: Simplify the use of PixiJS and Three.js (and other WebGL projects) in the same project. Here's a closer look at these features and what they offer.Tags:PixiJSUpdatesImprovementsRead more Introducing PixiJS UserlandJanuary 4, 2025 · 3 min readMatt KarlPixiJS AdminWe have launched a new GitHub organization called PixiJS Userland to host many of our popular community-driven extensions. This initiative aims to help PixiJS developers easily identify which projects are officially supported and which are community-driven, while also giving developers more freedom to manage their projects independently.Tags:PixiJSPluginsGitHubExtensionsCommunityRead more PixiJS Update - Start building with PixiJS in just one command! 🚀December 6, 2024 · 4 min readZyiePixiJS AdminAs we mentioned in our previous PixiJS Update post, we are focusing on making PixiJS easier to use and understand. Today we're pushing the project one step closer to that goal and we’re excited to introduce PixiJS Create. An easy to use CLI that provides templates for using PixiJS with your favourite bundler, as well as a new "Creation Template" to get you started with PixiJS and its ecosystem. Tags:PixiJSUpdatesImprovementsQoLTemplatesCLIRead more PixiJS Update - Survey & v8.6.0November 29, 2024 · 7 min readZyiePixiJS AdminThank you to everyone who participated in our survey! One thing came through loud and clear: better documentation is a top priority for the PixiJS community. We’ve taken your feedback to heart, and work is already underway to make significant improvements. This post is part of our commitment to better communication. We’ll share how we’re tackling documentation updates and shine a light on some of the great features and improvements we’ve introduced since PixiJS v8 that might have flown under the radar!Tags:PixiJSUpdatesImprovementsRead more'''
