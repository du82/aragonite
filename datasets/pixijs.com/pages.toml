["https://pixijs.com/blog/intro-userland"]
title = "Introducing PixiJS Userland | PixiJS"
description = "Announcing a new GitHub organization for community projects."
full_description = "Introducing PixiJS UserlandJanuary 4, 2025 · 3 min readMatt KarlPixiJS AdminWe have launched a new GitHub organization called PixiJS Userland to host many of our popular community-driven extensions. This initiative aims to help PixiJS developers easily identify which projects are officially supported and which are community-driven, while also giving developers more freedom to manage their projects independently. In the past, the main PixiJS organization included a wide range of projects. Some were stable and widely used, while others were experimental with a small user base. This diversity led to the misconception that all projects on github.com/pixijs received equal support from the core team, such as bug fixes and major updates. In reality, the core team found it challenging to communicate different priorities, especially since some side projects were maintained independently by core team members. Welcome to PixiJS Userland! Userland Project Types​ We have identified several common use-cases for projects that are best suited for Userland. Many projects have already been migrated to this new organization. In-Scope Experiments​ Userland is an ideal place for projects that could eventually be part of the main PixiJS repo but need more time for development and stabilization. Examples include: Compressed Textures (similar features in PixiJS v7+) HTMLText (added in PixiJS v7+) Projection (similar features in PixiJS v8+) GIF (candidate for PixiJS v8+) Layers (candidate for similar features in PixiJS v8+) Lights (candidate for similar features in PixiJS v8+) Out-of-Scope Projects​ These projects fall just outside the main goals of PixiJS. They are useful but may be more specialized or opinionated, not fitting for the broader PixiJS community. Examples include: Tilemap Kit Particle Emitter Graphics Smooth Third-Party Integrations​ Sometimes PixiJS developers need to integrate with third-party tools that aren't widely used enough to be officially supported by PixiJS. Examples include: Animate Adobe Animate Publishing Extension Node.js PixiJS Renderer Node.js Rendering Main Project Types​ Several projects will continue to be supported on the main PixiJS GitHub organization. These projects will receive updates to stay compatible with the latest PixiJS releases. While this list may change, it currently includes projects that offer the greatest general benefit to PixiJS developers. General Extensions​ These are runtime extensions that integrate with PixiJS and provide general benefits for all developers. Sound UI Layout Filters Popular Runtimes​ Support for popular web frameworks or integration with other renderers. Pixi React Developer Tools​ Tools that help developers build, package, or develop projects with PixiJS. DevTools ESLint Configuration Create AssetPack Extension Scripts Resources​ References, documentation, or resources for developers. Storybook Open Games PixiJS.com Userland Open For Business​ Do you have a PixiJS project that you can no longer maintain or would like to re-home it in a place where the PixiJS community can contribute? Well, we'd love to have it join Userland. Please reach out to @Zyie or @bigtimebuddy about transferring your project today. Summary​ We hope that introducing Userland will help clarify the level of support among the growing number of PixiJS projects and initiatives. If you have any feedback, please reach out on Discord or start a discussion.Tags:PixiJSPluginsGitHubExtensionsCommunity"
