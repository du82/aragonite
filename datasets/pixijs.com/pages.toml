["https://pixijs.com/8.x/guides/components/assets"]
title = "Assets | PixiJS"
description = "The Assets package"
full_description = '''On this pageAssets The Assets package​ The Assets package is a modern replacement for the old Loader class. It is a promise-based resource management solution that will download, cache and parse your assets into something you can use. The downloads can be simultaneous and in the background, meaning faster startup times for your app, the cache ensures that you never download the same asset twice and the extensible parser system allows you to easily extend and customize the process to your needs. Getting started​ Assets relies heavily on JavaScript Promises that all modern browsers support, however, if your target browser doesn't support promises you should look into polyfilling them. Making our first Assets Promise​ To quickly use the Assets instance, you just need to call Assets.load and pass in an asset. This will return a promise that when resolved will yield the value you seek. In this example, we will load a texture and then turn it into a sprite. import { Application, Assets, Sprite } from 'pixi.js';// Create a new applicationconst app = new Application();// Initialize the applicationawait app.init({ background: '#1099bb', resizeTo: window });// Append the application canvas to the document bodydocument.body.appendChild(app.canvas);// Start loading right away and create a promiseconst texturePromise = Assets.load('https://pixijs.com/assets/bunny.png');// When the promise resolves, we have the texture!texturePromise.then((resolvedTexture) =>{ // create a new Sprite from the resolved loaded Texture const bunny = Sprite.from(resolvedTexture); // center the sprite's anchor point bunny.anchor.set(0.5); // move the sprite to the center of the screen bunny.x = app.screen.width / 2; bunny.y = app.screen.height / 2; app.stage.addChild(bunny);}); One very important thing to keep in mind while using Assets is that all requests are cached and if the URL is the same, the promise returned will also be the same. To show it in code: promise1 = Assets.load('bunny.png')promise2 = Assets.load('bunny.png')// promise1 === promise2 Out of the box, the following assets types can be loaded without the need for external plugins: Textures (avif, webp, png, jpg, gif) Sprite sheets (json) Bitmap fonts (xml, fnt, txt) Web fonts (ttf, woff, woff2) Json files (json) Text files (txt) More types can be added fairly easily by creating additional loader parsers. Working with unrecognizable URLs​ With the basic syntax, asset types are recognized by their file extension - for instance https://pixijs.com/assets/bunny.png ends with .png so Assets.load can figure it should use the texture loader. In some cases you may not have control over the URLs and you have to work with ambiguous URLs without recognizable extensions. In this situation, you can specify an explicit loader: promise = Assets.load({ src: 'https://example.com/ambiguous-file-name', loadParser: 'loadTextures'}) Here are some of the loader values you can use: Textures: loadTextures Web fonts: loadWebFont Json files: loadJson Text files: loadTxt Warning about solved promises​ When an asset is downloaded, it is cached as a promise inside the Assets instance and if you try to download it again you will get a reference to the already resolved promise. However promise handlers .then(...)/.catch(...)/.finally(...) are always asynchronous, this means that even if a promise was already resolved the code below the .then(...)/.catch(...)/.finally(...) will execute before the code inside them. See this example: console.log(1);alreadyResolvedPromise.then(() => console.log(2));console.log(3);// Console output:// 1// 3// 2 To learn more about why this happens you will need to learn about Microtasks, however, using async functions should mitigate this problem. Using Async/Await​ There is a way to work with promises that is more intuitive and easier to read: async/await. To use it we first need to create a function/method and mark it as async. async function test() { // ...} This function now wraps the return value in a promise and allows us to use the await keyword before a promise to halt the execution of the code until it is resolved and gives us the value. See this example: // Create a new applicationconst app = new Application();// Initialize the applicationawait app.init({ background: '#1099bb', resizeTo: window });// Append the application canvas to the document bodydocument.body.appendChild(app.canvas);const texture = await Assets.load('https://pixijs.com/assets/bunny.png');// Create a new Sprite from the awaited loaded Textureconst bunny = Sprite.from(texture);// Center the sprite's anchor pointbunny.anchor.set(0.5);// Move the sprite to the center of the screenbunny.x = app.screen.width / 2;bunny.y = app.screen.height / 2;app.stage.addChild(bunny); The texture variable now is not a promise but the resolved texture that resulted after waiting for this promise to resolve. const texture = await Assets.load('examples/assets/bunny.png'); This allows us to write more readable code without falling into callback hell and to better think when our program halts and yields. Loading multiple assets​ We can add assets to the cache and then load them all simultaneously by using Assets.add(...) and then calling Assets.load(...) with all the keys you want to have loaded. See the following example: // Append the application canvas to the document bodydocument.body.appendChild(app.canvas);// Add the assets to loadAssets.add({ alias: 'flowerTop', src: 'https://pixijs.com/assets/flowerTop.png' });Assets.add({ alias: 'eggHead', src: 'https://pixijs.com/assets/eggHead.png' });// Load the assets and get a resolved promise once both are loadedconst texturesPromise = Assets.load(['flowerTop', 'eggHead']); // => Promise<{flowerTop: Texture, eggHead: Texture}>// When the promise resolves, we have the texture!texturesPromise.then((textures) =>{ // Create a new Sprite from the resolved loaded Textures const flower = Sprite.from(textures.flowerTop); flower.anchor.set(0.5); flower.x = app.screen.width * 0.25; flower.y = app.screen.height / 2; app.stage.addChild(flower); const egg = Sprite.from(textures.eggHead); egg.anchor.set(0.5); egg.x = app.screen.width * 0.75; egg.y = app.screen.height / 2; app.stage.addChild(egg);}); However, if you want to take full advantage of @pixi/Assets you should use bundles. Bundles are just a way to group assets together and can be added manually by calling Assets.addBundle(...)/Assets.loadBundle(...). Assets.addBundle('animals', { bunny: 'bunny.png', chicken: 'chicken.png', thumper: 'thumper.png', }); const assets = await Assets.loadBundle('animals'); However, the best way to handle bundles is to use a manifest and call Assets.init({manifest}) with said manifest (or even better, an URL pointing to it). Splitting our assets into bundles that correspond to screens or stages of our app will come in handy for loading in the background while the user is using the app instead of locking them in a single monolithic loading screen. { "bundles":[ { "name":"load-screen", "assets":[ { "alias":"background", "src":"sunset.png" }, { "alias":"bar", "src":"load-bar.{png,webp}" } ] }, { "name":"game-screen", "assets":[ { "alias":"character", "src":"robot.png" }, { "alias":"enemy", "src":"bad-guy.png" } ] } ]} Assets.init({manifest: "path/manifest.json"}); Beware that you can only call init once. Remember there is no downside in repeating URLs since they will all be cached, so if you need the same asset in two bundles you can duplicate the request without any extra cost! Background loading​ The old approach to loading was to use Loader to load all your assets at the beginning of your app, but users are less patient now and want content to be instantly available so the practices are moving towards loading the bare minimum needed to show the user some content and, while they are interacting with that, we keep loading the following content in the background. Luckily, Assets has us covered with a system that allows us to load everything in the background and in case we need some assets right now, bump them to the top of the queue so we can minimize loading times. To achieve this, we have the methods Assets.backgroundLoad(...) and Assets.backgroundLoadBundle(...) that will passively begin to load these assets in the background. So when you finally come to loading them you will get a promise that resolves to the loaded assets immediately. When you finally need the assets to show, you call the usual Assets.load(...) or Assets.loadBundle(...) and you will get the corresponding promise. The best way to do this is using bundles, see the following example: import { Application, Assets, Sprite } from 'pixi.js';// Create a new applicationconst app = new Application();async function init(){ // Initialize the application await app.init({ background: '#1099bb', resizeTo: window }); // Append the application canvas to the document body document.body.appendChild(app.canvas); // Manifest example const manifestExample = { bundles: [ { name: 'load-screen', assets: [ { alias: 'flowerTop', src: 'https://pixijs.com/assets/flowerTop.png', }, ], }, { name: 'game-screen', assets: [ { alias: 'eggHead', src: 'https://pixijs.com/assets/eggHead.png', }, ], }, ], }; await Assets.init({ manifest: manifestExample }); // Bundles can be loaded in the background too! Assets.backgroundLoadBundle(['load-screen', 'game-screen']);}init(); We create one bundle for each screen our game will have and set them all to start downloading at the beginning of our app. If the user progresses slowly enough in our app then they should never get to see a loading screen after the first one!Edit this page'''
