mprovements and features we're eager for you to start playing with! Over the course of a decade—yes, you read that right, ten years!—we've implemented significant changes to the PixiJS engine. But the advancements in this new release are among the most monumental we've ever made!Tags:PixiJSWebGPUWebGLRead more"
