full_description = "Can I freely use images?Yes, you can use them freely even without asking for permission or giving credit to the author.Can I use free images for my commercial project?Yes, you can use images from this website in your commercial or non commercial projects. You can use photos in any print or digital publication, on your own website, on any social network, on CD/DVD, television, movie, news papers, magazines, books, in business or school project…Can I edit or modify images?Yes, you can edit them however you like. You can edit them in any photo editing (or in any other) program. You can add text, apply any filters on it, you can crop, resize, merge them, anything you wish.Do I need permission to use free images?You don’t need to ask for explicit permission.Do I need to link back or give credit if I use free images?Attribution is not required, authors will greatly appreciate it since it allows them greater exposure and encourages them to share more.Can I use images on Facebook, Twitter and other social media?Yes, absolutely, you can use images on any social media platforms.Can I upload and promote my images?Yes, you can register and create your profile and upload images, as many photos as you like. We provide to photographers service to promote their work/portfolio. We will be glad to promote your images, all that is 100% free.How creators can receive donations?As creator you can receive donations for your work via PayPal. People tend to show their appreciation for getting free photos by donating. As photographer, after registering you can set an email address to be used for donations. All donations will go directly to email address of the author.How can I donate to the author/photographer?If you wish to donate to author for getting free photo you can do that by clicking to “Donate” button on the photo page, or by going to author’s profile page and finding there the same “Donate” button. All donations you made will go directly to the author.How to say thank you for free images?Although giving credit is not required, if you wish to do so you can mention author and website.Also, you can donate to authors, even small amount, creators will appreciate that.If you wish to show your appreciation to Pixnio website, here you can find how to link to us.Also, you can like/follow our FB page and spread out the good word about us on any website, social network.Can I hotlink free images from my website?Download photos you would like to use, and then upload them on your own website, server."
