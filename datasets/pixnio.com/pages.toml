full_description = "PIXNIO / Privacy policy The privacy of our visitors is very important to us, please read our privacy police bellow. What personal data we collect and what rights you have over your data?Personally-identifiable information collected on this website is gathered on our “contact” page, where fields are provided so that you can provide your name, email address. We collect this information so that we can respond to message you send to us via that form. We can have your info only if you send it to us via email. You can also request that we erase any personal data that you send us via our “contact” page (except some data we might be obliged to keep for administrative, legal, or security purposes).If you register on our website, we store the personal information you provide in your user profile (if any), you can see, edit, or delete your personal information at any time, except you cannot change username. You can also request that we erase any personal data we hold about you (except some data we might be obliged to keep).CommentsIf visitor leave comments on our site we collect the data shown in the comments form, and also the visitor’s IP address and browser info to help spam detection. Visitor comments may be checked through an automated spam detection service. You can request that we erase any personal data in any comments, or any comments posted by you (except some data we might be obliged to keep).MediaVisitors of our site can upload media to site, if any media is uploaded by visitor and if we publish it (if is suitable for publishing) it will be publicly accessible.Please note that if you upload images to our website, you should avoid uploading images with embedded GPS info (EXIF GPS info), because we may show that info with image, also visitors of website can download and extract GPS location where image is taken. That info can be useful, and can provide more info about picture, but think about that before uploading images which contain GPS info. Media you upload may be checked through an automated detection service. You can request that we erase any media that represents any personal data about you (except some data we might be obliged to keep).Anonymous information collected on this websiteWe record anonymous data. Most of the information that we collect from this website is anonymous information, such as the pages you visit. Other anonymous data we may collect might include the name of your internet service provider, the website that you used to link to our site, the websites that you visit from our site, and your IP address. The data is used for statistical purposes, but you, as the individual user, remain anonymous. We use this anonymous information to help improve the content of this site and to compile aggregate statistics about individuals using our site for internal market research purposes.Log filesLike many other web sites, this too make use of log files. The information inside the log files may includes internet protocol addresses, type of browser, Internet Service Provider, date / time stamp, referring / exit pages, and number of clicks to analyze trends, administer the site, track user’s movement around the site, and gather demographic information. IP addresses, and other such information are not linked to any information that is personally identifiable.Cookies and web beaconsThis site use cookies to store information about visitors preferences, record user-specific information on which pages the user access or visit, customize web page content based on visitors browser type or other information that the visitor sends via their browser. If you leave a comment on our website you may opt-in to saving your name, email address and website in cookies, these cookies will last for one year.If you registered an account and you log in to our site, we will set a temporary cookie to determine if your browser accepts cookies. Cookie contains no personal data, also it is discarded when you close your browser.