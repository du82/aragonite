title = "Pizzeria Di Matteo | Salvatore Di Matteo | Pizzeria Napoli"
description = "La pizzeria Di Matteo è uno dei locali storici più noti della città di Napoli."
full_description = "Salvatore Di Matteo nasce a Napoli il 18 aprile del ‘74. Discendente di una storica famiglia di pizzaioli inizia a muovere i primi passi nel mondo della pizza fin dai primi anni di età. Si può quasi dire che fosse nato con “le mani nella farina” perché mamma Giuseppina, per aiutare il marito, aveva lavorato in pizzeria fino a poche ore prima che Salvatore venisse al mondo. L’amore verso questo antico mestiere è assoluto, all’eta’ di 13 anni papà Nicola comincia a trasmettere a Salvatore le fondamenta della professione, ma, come è giusto che sia, anche il figlio del titolare deve affrontare la sua buona dose di gavetta! Comincia come garzone per poi ottenere mansioni sempre più adatte alla sua innata propensione verso questo mestiere sostenuto dall’amato zio Gennaro che immancabilmente faceva notare a suo fratello Nicola quanto suo figlio fosse predisposto per quell’attività. Salvatore rimane in pizzeria fino all’eta’ di 18 anni e, quasi come fosse un presagio, una serie di eventi fecero realizzare al giovane pizzaiolo che avrebbe dovuto prendere una strada differente da quella che aveva intrapreso fino ad allora. Nonostante le basi per costruire un futuro da pizzaiolo c’erano tutte, un piccolo dettaglio in quel periodo giocava a suo sfavore, l’età. Inizia così per Salvatore un percorso lavorativo differente che nell’arco degli anni lo porta a crescere e maturare, caratteristiche indispensabili per poter affrontare il duro impegno di portare avanti le tradizioni di famiglia. E’ all’incirca il 2009 quando papà Nicola dichiara a Salvatore che è finalmente giunto il momento in cui lui avrebbe potuto prendere il suo posto in pizzeria dove si rendeva ormai necessaria una figura giovane con molta voglia di fare e di mettersi in gioco. Comincia così l’avventura dell’ultimo discendente dei Di Matteo che, dopo tre anni circa dal suo ritorno in pizzeria, decide di scrivere una nuova pagina nella storia dell’attività iniziata 75 anni prima da nonno Salvatore ricercando anche un riconoscimento da parte degli adetti ai lavori verso questa istituzione della pizza napoletana. Nel maggio 2011, durante il trofeo Caputo, l’ Associazione Pizzaioli Napoletani assegna una targa per l’attività svolta negli anni alla pizzeria Di Matteo dedicata allo zio Gennaro, scomparso da pochi anni, quale testimone della tradizione di famiglia. Nello stesso mese Salvatore partecipa alla trasmissione televisiva Pizza Time che parla della storia della pizza attraverso un viaggio itinerante alla scoperta delle origini di chi vive da sempre questa magica pietanza come una imprescindibile tradizione familiare che si tramanda di generazione in generazione. Da questo programma inizia una vera e propria escalation di vittorie e riconoscimenti per la sua attività. In brevissimo sono tante le manifestazioni legate al mondo della pizza in cui Salvatore viene invitato a partecipare e la sua presenza nelle trasmissioni televisive comincia ad essere sempre più richiesta. A settembre si classifica al primo posto nel concorso World Cup 2011 con il suo Ripieno Doc ed al secondo nella sezione Margherita Doc, manifestazione tenutasi ad Anzio con la partecipazione di oltre 400 pizzaioli. Da questo momento in poi l’attenzione da parte di giornali, blog e tv aumenta vertiginosamente. In ottobre organizza un evento archeoenogastronomico svoltosi nella zona dei campi flegrei dove oltre a parlare del territorio Salvatore festeggia la vittoria del World Cup alla presenza di tantissimi ospiti e personalità del settore sotto i flash dei fotografi e l’attenzione di tv e stampa. Successivamente l’Unione Europea Pizzaioli e Ristoratori Tradizionali conferisce al giovane Di Matteo il titolo di istruttore di laboratorio presso l’ Universita Popolare Internazionale della Pizza. Allo stesso tempo l’Associazione Vera Pizza Napoletana lo riconosce come pizzaiolo verace, mentre con l’Associazione Pizzaioli Napoletani inizia un importante percorso dopo aver ottenuto il marchio s.t.g. All’ Unione Europea Pizzaioli viene anche certificato con l’attestato di “Pizzeria e Pizzaiolo s.t.g.” da un organo indipendente ed esterno all’ Associazione Pizzaioli Napoletani. Sempre con quest’ultima associazione inizierà poi un percorso ancora piu’ importante in ambito dei corsi di formazione. A dicembre è presente all’ European Cup dove nella sezione “Pizza Tradizionale” ottiene il primo posto con una pizza che ama chiamare “Radici” perché è una delle prime pizze che elaborò suo padre insieme al caro zio Gennaro. L’ ingrediente che Salvatore ha voluto cambiare in questa pizza è soltanto uno, ha sostituito il fior di latte con la mozzarelladi bufala. E adesso siam certi che il suo non sia stato soltanto un azzardo in quanto quel “primo posto” ci fa comprendere che “Radici”, con la variazione sul tema di Salvatore, è davvero piaciuta! Nel febbraio del 2012 si riconferma nuovamente campione classificandosi primo nella categoria “Margherita Doc” durante la manifestazione “Coppa Italia Pizza di Qualità” indetta sempre dall’ U.E.P.T & R . Nei primi giorni di maggio Salvatore viene intervistato da una laureanda della facoltà di Sociologia della Federico II che ha scelto di porre come oggetto della sua tesi proprio l’erede della nota famiglia di pizzaioli che, con le proprie tradizioni, ha fatto ormai storia nella famosa via Tribunali. Tante le domande poste al giovane maestro pizzaiolo e tra le più varie. Una lunga video intervista durata circa 4 ore che nell’autunno sarà parte di uno speciale che andrà in onda sulle emittenti Rai. Il 7 e l’8 maggio Salvatore ha partecipato anche alla quindicesima edizione del “Pizzaiuolo dell’Anno”, manifestazione tenuta ad Anzio ed organizzata dalla Follie Production in collaborazione con l’ U.E.P.T & R. Tanti i partecipanti che hanno gareggiato per conquistarsi il titolo tanto ambito ed i primi posti delle 12 categorie in gara. Salvatore riesce a posizionarsi primo classificato in ben 2 categorie, Calzone D.O.C. e Sapori del Sud”. E’ quindi primo con la sua pizza realizzata coi prodotti tipici della terra del Sud mentre si riconferma ancora una volta il numero uno del Calzone D.O.C. e proprio come accadde nel World Cup dello scorso settembre così anche in questa storica manifestazione l’erede dei Di Matteo riesce nuovamente a colpire favorevolmente il parere dei giurati con una nuova specialità di calzone, caratteristica ormai divenuta suo punto di forza. Il 19 settembre, data che nessun napoletano dimentica in quanto ricorre la festa di San Gennaro, patrono della città, alla vigilia del Trofeo della Pizza via Tribunali, Salvatore viene insignito del Premio “Eccellenze del Sud” per il settore gastronomia durante lo svolgimento della kermesse artistica del Terronian Festival. La sua pizza è ormai riconosciuta come una vera eccellenza ed è proprio per omaggiare quest’ultima che al giovane Di Matteo viene l’idea di dedicare un trofeo della pizza alla storica via Tribunali che è da sempre ritenuta la culla di questa secolare tradizione gastronomica nota a livello mondiale. Il Trofeo da puro sogno e idea perseguita per diversi mesi prende concretamente vita quando nasce l’occasione opportuna di mettere in risalto la storicità di via Tribunali e poter contemporaneamente omaggiare la memoria di zio Gennaro col premio “Gennaro Di Matteo” andato ad un meritevole pizzaiolo che negli anni si è saputo distinguere per tecnica, abilità, dedizione e passione. L’idea-sogno si è quindi sempre più concretizzata col passare dei giorni suscitando l’interesse e la curiosità di pizzaioli sia italiani che stranieri e dei tanti addetti del settore che hanno costantemente potuto aggiornarsi e prendere informazioni relative all’iniziativa attraverso stampa e tv. E’ questo forte legame che lui sente per le tradizioni che lo spingono a sposare il progetto “Terronian” portato avanti dall’omonima associazione culturale fondata da lui stesso insieme alla cantautrice Shara (Sarah Ancarola). Durante un’intervista realizzata per Sky alla vigilia di una partita di Champion League del Napoli, Salvatore ha lanciato il ripieno Hamsik che fu precedentemente presentato per la prima volta al pubblico in occasione del secondo appuntamento dell’evento intitolato “Due volti della stessa medaglia” tenutosi presso il Batis, un locale situato nella zona dei Campi Flegrei. E’ poi spettato ad un “panel di degustazione” composto da 12 persone scelte tra i presenti giudicare il gusto dell’ultima creazione a sorpresa firmata da Salvatore. Il celebre giocatore del Napoli è ghiotto di una delle tante specialità fritte della pizzeria Di Matteo, la frittatina di pasta, e per questo motivo il giovane e ormai noto pizzaiolo di via Tribunali ha voluto omaggiare il calciatore con questa pizza realizzata con gli stessi ingredienti della frittatina che, prossimamente, in versione bianca e rosa si potrà gustare allo storico civico 94 di via Tribunali. Ma per il battesimo e la consacrazione di questo estroso ripieno si è dovuto aspettare all’incirca un anno. Il fortunato incontro tra il cannoniere del Napoli ed il fuoriclasse della pizza napoletana è infatti avvenuto soltanto i primi giorni di novembre in una location del tutto unica a cui molti calciatori sono da tempo affezionati: lo studio del noto artista dei tattoo Enzo Brandi. E visto che parliamo di campioni non possiamo non citare un’altra importante “eccellenza” del panorame calcistico napoletano, era infatti inaspettatamente presente all’incontro anche il capitano della squadra, Fabio Cannavaro, al quale Salvatore ha promesso di dedicare molto presto un’altra delle sue speciali pizze dal sapore di “unicità”. Il 2013, per Salvatore, si apre all’insegna di una serie di novità. Tante le partecipazioni a programmi televisivi a tiratura nazionale tra le quali spiccano gli interventi a Street Food Heroes, in onda su Italia 2, dove si è classificato al primo posto come chef street food con la famosa pizza a libretto; Unti e Bisunti con lo chef Rubio, in onda su D-Max; “Gino’s Italian Escape” condotto dallo Chef Gino D’Acampo per la tv inglese ITV. Nel mese di Marzo partecipa alla convention “Pizza centimetro per centimetro” organizzata dallo chef Gennarino Esposito a Vico Equense. Nel mese di Maggio partecipa come istruttore della pizza napoletana alla convention organizzata a Rimini dalla Confraternita della Pizza insieme allo chef Sergio Maria Teutonico ed al collega pizzaiolo romano Maurizio Capodicasa. Il 7 e 8 ottobre 2013 lo vedono di nuovo protagonista al campionato del mondo di pizza (Pizza World Cup) tenutosi a Roma presso la struttura del Palacavicchi. In quest’occasione Salvatore decide di mettersi totalmente in gioco gareggiando in tutte le batterie presenti nella competizione. Forte della tradizione di famiglia, Salvatore si è conquistato il titolo di primo classificato nella batteria “Pizza fritta”, specialità che da generazioni ha contraddistinto a Napoli i Di Matteo, friggitori di qualità oltre che pizzaioli. Altra specialità di famiglia che gli ha favorito il posizionamento al terzo posto nella categoria delle pizze classiche è la Margherita che Salvatore ha realizzato il secondo giorno di gara per la batteria “Margherita Doc”. Gran sorpresa e soddisfazione per il primo posto ottenuto anche nella batteria “Pizza in pala”, specialità non appartenente alla tradizione di famiglia. Ancora una volta protagonista si è rivelata la Margherita che, posizionata all’interno di una composizione artistica realizzata in parte con l’impasto, gli ha permesso di aggiudicarsi il quarto posto della batteria “Margherita scenografica”. Molti i complimenti ottenuti da parte dei giurati per lo “Spaghetto D’oro” che Salvatore ha preparato ed ha fatto degustare per questa gara che lo vedeva primo in classifica nella prima giornata della manifestazione; la tradizione napoletana si è fatta valere anche in una sezione della competizione non dedicata alla pizza grazie alla perfetta combinazione di ingredienti tipici che ha catturato proprio tutti. I punteggi acquisiti nel primo e nel secondo giorno di gare hanno così reso possibile all’erede dei Di Matteo la conquista del primo posto assoluto dell’edizione 2013 del Pizza World Cup. E con quest’ultimo traguardo raggiunto Salvatore Di Matteo può effettivamente attestare che la tradizione è sempre vincente."
