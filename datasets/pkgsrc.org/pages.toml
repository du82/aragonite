["https://pkgsrc.org/pkgsrcCon/2018"]
title = "pkgsrcCon 2018 in Berlin"
full_description = "pkgsrcCon is the annual technical conference for people working on pkgsrc, a framework for building over 19,000 open source software packages. pkgsrc is the native package manager on NetBSD, SmartOS and Minix, and is portable across many different operating systems including Linux and Mac OS X. Developers, contributors and users are all welcome to attend. The pkgsrcCon 2018 takes place on Saturday (July 7th) and Sunday (July 8th). On Saturday we will start off with talks. To plan accordingly please let the organizers know if you are going to attend the social event and dinner on Saturday! Please let the organizers know if you have any particular requirements (diet, allergies...) and we will try our best to address them. While the primary focus is on pkgsrc, the theme of the day is building and packaging open source software in general and the challenges we face. Details for general attendees will be available soon but in the meantime, If you would like to present a talk on such a theme, please send the title, slot duration (minimum of 15 minutes) and a brief description (for the web site) to pkgsrcCon2018@NetBSD.org. The presentations will be recorded, and hopefully also streamed live. We will communicate the corresponding addresses as soon as we know them. To help with planning it would be greatly appreciated that you let the organizers know. Send an email to pkgsrcCon2018@NetBSD.org and include details like: Berlin currently has two operational Airports: Tegel (TXL) and Schönefeld (SXF). Public transport is available. Long distance buses arrive at the Zentraler Omnibusbahnhof (ZOB / Central Bus Station). Trains connect at Hauptbahnhof and Ostbahnhof. More details can be found at wikitravel. Getting around in Berlin is usually easier with public transport or by bike. To navigate on mobile phones the Citymapper App can be recommended for Android and Apple devices. The persons mainly responsible for organisation are Thomas Merkel and Pierre Pronchery. If you want to help with the event, or have questions, suggestions, criticism, remarks, enquiries, praise, queries, proposals, or anything else really, please e-mail pkgsrcCon2018@NetBSD.org."
