["https://pkgsrc.org/pkgsrcCon/2016"]
title = "pkgsrcCon 2016 in Kraków"
full_description = '''pkgsrcCon is the annual technical conference for people working on pkgsrc, a framework for building over 17,000 open source software packages. pkgsrc is the native package manager on NetBSD, SmartOS and Minix, and is portable across many different operating systems including Linux and Mac OS X. Developers, contributors, users and open-source enthusiasts are all welcome to attend. pkgsrcCon 2016 takes place on Saturday (July 2nd) and Sunday (July 3rd). Talks will begin at 10:00 am Saturday, so don't be late! We will have lunchbreaks at a convenient time between talks. There are plenty of opportunities for good food around the University campus: On Friday we'll have a get-together & make introductions with some drinks in the Old Town. We have reservation in Cafe Magia for 20 people. On Saturday after the conference we'll have dinner in a nearby restaurant. We have got a reservation in Al Vecchio Forno for 30 people. We will go there through a path in a small forest. To plan accordingly please let the organizer know if you are going to attend the social event on Friday and dinner on Saturday! RSVP pkgsrcCon will be held at the Jagiellonian University on the 1st floor (0-based) at the Faculty of Physics, Astronomy and Applied Computer Science 11 Profesora Stanisława Łojasiewicza Street, 30-348 Kraków (Cracow, Cracovia), Poland. The closest tram (numbers: 11, 18, 23, 52, 62) stop is "Norymberska". Please note that drinking alcohol is not allowed at the University. Smoking cigarettes is allowed outside the building. If you have special accessibilty needs (like using the elevator, etc.), please let the organizer know how we can make your visit easier. After going through the main entrance take the staircase to the right. Later look for and follow pkgsrcCon directions. Currently there are scheduled 10 presentations on Saturday. The times aren't set in stone and the lunchbreak can be rescheduled between other talks. If you are unsure whether you will attend and you might give a talk, it will be possible to make additional presentations ad hoc during the conference in the unconference mode on Saturday (if the time will premit it) or on Sunday. Alternatively this time will be used for hacking together.'''
