["https://pkgsrc.org/pkgsrcCon/2019"]
title = "pkgsrcCon 2019 in Cambridge"
full_description = "pkgsrcCon is the annual technical conference for people working on pkgsrc, a framework for building over 19,000 open source software packages. pkgsrc is the native package manager on NetBSD, SmartOS and Minix, and is portable across many different operating systems including Linux and Mac OS X. Developers, contributors and users are all welcome to attend. The pkgsrcCon 2019 takes place on Saturday (July 13th) and Sunday (July 14th). On Saturday we will start off with talks. On Saturday after the conference we will have dinner together. (Partners may be in intersted in the Castle Hill open day happening near the conference venue.) To plan accordingly please let the organizers know if you are going to attend the social event and dinner on Saturday! Sunday 14th's hacking will take place in the Centre for Computing History. Admission costs £9. Lunch will be at the Wrestlers. Please let the organizers know if you have any particular requirements (diet, allergies...) and we will try our best to address them. While the primary focus is on pkgsrc, the theme of the day is building and packaging open source software in general and the challenges we face. Details for general attendees will be available soon but in the meantime, If you would like to present a talk on such a theme, please send the title, slot duration (minimum of 15 minutes) and a brief description (for the web site) to pkgsrcCon2019@NetBSD.org. To help with planning it would be greatly appreciated that you let the organizers know. Send an email to pkgsrcCon2019@NetBSD.org and include details like: The conference venue is in West Cambridge, very close to Churchill College. We have been granted the use of their Dining Hall at lunchtime (12.15pm—1.45pm) paying with cash at the tills. Cambridge is well equipped for tourists. There is also bed and breakfast accommodation available at Churchill College. The U Bus line passes the train station, Churchill College (Storey's Way), and very close to the BP Institute (William Gates Building)."
year_published = 2025
