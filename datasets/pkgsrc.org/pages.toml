["https://pkgsrc.org/pkgsrcCon/2017"]
title = "pkgsrcCon 2017 in London"
full_description = "pkgsrcCon is the annual technical conference for people working on pkgsrc, a framework for building over 18,000 open source software packages. pkgsrc is the native package manager on NetBSD, SmartOS and Minix, and is portable across many different operating systems including Linux and Mac OS X. Developers, contributors and users are all welcome to attend. The pkgsrcCon 2017 takes place on Saturday (July 1st) and Sunday (July 2nd). On Saturday we'll start off with talks. On Friday we'll have a get-together with some drinks at The Hand and Shears pub. Located at 1 Middle Stree, EC1A 7JA London the closest two underground stations are Barbican and Farringdon. On Saturday after the conference we'll have dinner at Mohsen which is in walking distance from Earls Court Underground station. To plan accordingly please let the organizer know if you are going to attend the social event and dinner on Saturday! pkgsrcCon will be at the BCS, The Chartered Institute for IT on the 1st Floor in the The Davidson Building at 5 Southampton Street, London, WC2E 7HA on Saturday. While the primary focus is on pkgsrc, the theme of the day is building and packaging open source software in general and the challenges we face. Details for general attendees will be available soon but in the meantime, If you would like to present a talk on such a theme, please send the title, slot duration (minimum of 15 minutes) and a brief description (for the web site) to sevan@NetBSD.org. The conference is free and there are no tickets. Registration is required for Saturday's event however. Please use this link to sign up. Closing date for registration is Thursday 29th June 2017 at 11:59 pm. For Sunday you can just turn up. To help with planning it would be greatly appreciated that you let the organizer know. Send an email to sevan@NetBSD.org and include details like: London is served by a total of six airports (Heathrow, Gatwick, City, Stansted, Luton, Southend). From the airport to the city going by rail is usually the best option."
