["https://pkgsrc.org/wip"]
title = "wip"
full_description = '''The pkgsrc-wip project What is pkgsrc-wip? pkgsrc-wip (work in progress) is a project to get more people actively involved with creating packages for pkgsrc, a portable packaging system coming from NetBSD. It is the default packaging system for NetBSD, SmartOS, and MINIX 3 and has also been ported to many additional operating systems, including Linux, Darwin, FreeBSD, OpenBSD, Illumos, and others. What's in it? You can get an overview of the packages currently in pkgsrc-wip on the git repository page for pkgsrc-wip, or a nicer-looking page at pkgsrc.se. There is an official read-only mirror on github. Getting started This project already assumes you know what pkgsrc is and how to use it, so if you don't, please read the reference and use it. We'll also assume a basic knowledge of git. If you are completely new to git or VCS, gittutorial(7) and gittutorial-2(7) are good introductions to it. You should subscribe to the tech-pkg mailing lists. You can ask for questions about packaging here, or for comments and import to pkgsrc, if you think a package is finished. Additionally, there is the pkgsrc-wip-changes mailing list. Its subscribers receive a mail message for every commit to the pkgsrc-wip repository. This is for addicts only. If you're interested in committing packages (and not only testing), send mail to Thomas Klausner with your public SSH key, suggested user name and perhaps ideas for your first packages. Here you can find more details about commit access and how to use it, including that you should create a COMMIT MSG file. Getting the "source" Getting via git Assuming you have a pkgsrc checkout in /usr/pkgsrc, do the following: cd /usr/pkgsrc/ git clone git://wip.pkgsrc.org/pkgsrc-wip.git wip (advanced; no history) git clone --depth 1 git://wip.pkgsrc.org/pkgsrc-wip.git wip Web-based git browsing Of course, you can also browse the git repository on the pkgsrc-wip git repository. Snapshots of the latest git version are also available as tarballs. Keeping up-to-date Upgrading your clone Just invoke the following: cd /usr/pkgsrc/wip git pull -r Trying packages Change to the package's directory: cd /usr/pkgsrc/wip/<packagename> Take a look at the TODO file there. If the package seems finished enough, install, and try it out: make install Report your experiences to the tech-pkg mailing list. Similar projects pkgsrc-wip-jp Japanese pkgsrc-wip pkgsrc-wip kr Korean pkgsrc-wip OpenBSD Ports WIP Similar project for OpenBSD ports History This project was hosted for 12 years on Sourceforge. Thanks, Sourceforge! Project contact Thomas Klausner'''
year_published = 2024
