["https://pkgsrc.org/pkgsrcCon/2015"]
title = "pkgsrcCon 2015 in Berlin"
full_description = '''pkgsrcCon is the annual technical conference for people working on pkgsrc, a framework for building over 14,000 open source software packages. pkgsrc is the native package manager on NetBSD, SmartOS and Minix, and is portable across 22 different operating systems including Linux and Mac OS X. Developers, contributors, and users are all welcome to attend. The pkgsrcCon 2015 takes place on Saturday (July 4th) and Sunday (July 5th). On Saturday we'll start off with talks. The exact timetable of these will be decided at the event. We'll have lunchbreaks at a convenient time between talks. There are plenty opportunities for good food around the venue. On Friday we'll have a get-together with some drinks at Pratergarten. Located at Kastanienallee 7–9, 10435 Berlin the closest subway station is "Eberswalder Straße". To plan accordingly please let the organizer know if you are going to attend the social event and dinner on Saturday! pkgsrcCon will be at co.up on the 3rd floor at Adalbertstr. 8, 10999 Berlin, Germany. The closest subway station is "Kottbusser Tor". On 155 sqm we'll have room for up to 40 people. Co.up also provides a projector and wi-fi. Cold drinks are available for 1,50€ (club mate, cola, uncaffeinated soft drinks, bottled water, beer). The building is located behind a backyard. Enter through the the small gate at Adalbertstr. 5-6. Reach through the bars to turn the handle and make your way straight through the tunnel, left through a second tunnel and then straight past the bike rack until you see the door of our building, across from the mailboxes. If the door is closed ring at "co.up 3.OG". If you have special accessibilty needs (like using the elevator, etc.), please let the organizer know how we can make your visit easier. The order of talks will be decided at the event. If you already know the topic of your talk you can let the organizer know in advance. While presenting is not a must we welcome everyone to make a presentation. It can be as short as 5 minutes, so don't worry!'''
