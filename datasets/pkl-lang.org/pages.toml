["https://pkl-lang.org/blog/index.html"]
title = "Pkl Blog :: Pkl Docs"
full_description = 'Pkl Blog Know Your Place by Philip Hölzenspies on January 24th, 2025 Configuration generally, and Pkl code especially, tends to be organized hierarchically. When configurations grow, they typically spread across files in a directory structure along similar hierarchical organization. To make one more ergonomically fit the other, Pkl offers a few mechanisms that can be used in module definitions for, for example, validating that modules are organized as expected, or to populate default values. Taking types to the next level by Islon Scherer on October 15th, 2024 One of the main points of using Pkl is to describe what your configuration looks like. An often overlooked design goal (arguably, the most important), is to forbid invalid configurations. Pkl types allow a great degree of freedom and power in constraining what your data looks like. Class-as-a-Function Pattern by Josh Basch on August 13th, 2024 In many languages, function and method parameters may be assigned default values allowing the argument to be omitted in calls. Many languages also offer named parameters, which aid in API self-documentation. Pkl methods do not provide either feature, but one way to achieve similar results is the "class-as-a-function" (CaaF) pattern. Pkl Evolution by Dan Chao on April 29th, 2024 Today, we launch Pkl Evolution, a new repository that holds Suggested Pkl Improvements, Changes, or Enhancements (SPICEs) for Pkl’s language, tooling, and ecosystem. Testing in Pkl by Dan Chao on April 9th, 2024 Pkl files are programs that get evaluated to produce a result. Like any other program, it can be useful to have tests that verify their business logic. To address this, Pkl provides tooling for writing and running tests. Introducing Pkl, a programming language for configuration by the Pkl Team on February 1st, 2024 We are delighted to announce the open source first release of Pkl (pronounced Pickle), a programming language for producing configuration.'
year_published = 2025
