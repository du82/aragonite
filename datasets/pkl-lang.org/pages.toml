["https://pkl-lang.org/main/current/pkl-gradle/index.html"]
title = "Gradle Plugin :: Pkl Docs"
full_description = 'Gradle Plugin The Gradle plugin offers the following features: Module evaluation Java code generation Kotlin code generation Pkldoc generation Plugin versions coincide with Pkl versions. That is, plugin version x.y.z uses Pkl version x.y.z. Installation The Gradle plugin is available from Maven Central. It requires Java 17 or higher and Gradle 8.1 or higher. Earlier Gradle versions are not supported. The plugin is applied as follows: Kotlin Groovy build.gradle.kts plugins { id("org.pkl-lang") version "0.28.0" } settings.gradle.kts pluginManagement { repositories { mavenCentral() } } build.gradle plugins { id "org.pkl-lang" version "0.28.0" } settings.gradle pluginManagement { repositories { mavenCentral() } } Module Evaluation This feature integrates the Pkl evaluator into Gradle builds. Usage To add an evaluator to the build, add a named configuration block inside pkl.evaluators: build.gradle build.gradle.kts pkl { evaluators { evalPkl { sourceModules.add(file("module1.pkl")) outputFile = layout.buildDirectory.file("module1.yaml") outputFormat = "yaml" } } } pkl { evaluators { register("evalPkl") { sourceModules.add(file("module1.pkl")) outputFile.set(layout.buildDirectory.file("module1.yaml")) outputFormat.set("yaml") } } } For each declared evaluator, the Pkl plugin creates an equally named task. Hence the above evaluator can be run with: $ ./gradlew evalPkl For a ready-to-go example with full source code, see codegen-java in the pkl/pkl-examples repository. Configuration Options outputFormat: Property<String> Default: "pcf" Example: outputFormat = "yaml" The output format to generate. The default output renderer for a module supports the following formats: "json" "jsonnet" "pcf" "plist" "properties" "textproto" "xml" "yaml" outputFile: RegularFileProperty Default: file("%{moduleDir}/%{moduleName}.%{outputFormat}") (places output files next to the source modules) Example: outputFile = layout.projectDirectory.file("config.yaml") The file path where the output file is placed. Relative paths are resolved against the project directory. If multiple source modules are given, placeholders can be used to map them to different output files. The following placeholders are supported: %{moduleDir} The directory path of the module, relative to the working directory. Only available when evaluating file-based modules. %{moduleName} The simple module name as inferred from the module URI. For hierarchical module URIs such as file:///foo/bar/baz.pkl, this is the last path segment without file extension. %{outputFormat} The requested output format. Only available if outputFormat is set. If multiple sources modules are mapped to the same output file, their outputs are concatenated. By default, module outputs are separated with ---, as in a YAML stream. The separator can be customized using the moduleOutputSeparator option. multipleFileOutputDir: DirectoryProperty Example 1: multipleFileOutputDir = layout.projectDirectory.dir("output") Example 2: multipleFileOutputDir = layout.projectDirectory.file("%{moduleDir}/output") The directory where a module’s output files are placed. Setting this option causes Pkl to evaluate a module’s output.files property and write the files specified therein. Within output.files, a key determines a file’s path relative to multipleFileOutputDir, and a value determines the file’s contents. This option cannot be used together with any of the following: outputFile expression This option supports the same placeholders as outputFile. For additional details, see Multiple File Output in the language reference. moduleOutputSeparator: Property<String> Default: "---" (as in a YAML stream) The separator to use when multiple module outputs are written to the same file. expression: Property<String> Default: (none) Example: expression = "topLevelProperty.subValue" The expression to be evaluated within the module. This option causes Pkl to evaluate the provided expression instead of the module’s output.text or output.files properties. The resulting value is then stringified, and written to the designated output file. For example, consider the following Pkl module: my-pod.pkl metadata { name = "my-pod" } The expression metadata.name evaluates to text my-pod. Common properties: sourceModules: ListProperty<Object> Default: [] Example 1: sourceModules = ["module1.pkl", "module2.pkl"] Example 2: sourceModules = fileTree("config").include("**/*.pkl") List of Pkl modules which are used for this operation. This property accepts the following types to represent a module: java.net.URI java.io.File java.nio.file.Path java.net.URL java.lang.CharSequence - if the represented string looks like a URI (it contains a scheme), the input is treated as a URI. Otherwise, it is treated as a path. Relative paths are resolved against the project directory. org.gradle.api.file.FileSystemLocation transitiveModules: ConfigurableFileCollection Default: [computed by pkl-gradle] Example 1: transitiveModules.from files("module1.pkl", "module2.pkl") Example 2: transitiveModules.from fileTree("config").include("**/*.pkl") File paths of modules that are directly or indirectly used by source modules. This property, along with sourceModules, is the set of input files used to determine whether this task is up-to-date or not. By default, Pkl computes this property by analyzing the imports of the source modules. Setting this property explicitly causes Pkl to skip the analyze imports step. Including source modules in transitiveModules is permitted but not required. Relative paths are resolved against the project directory. projectDir: DirectoryProperty Default: null Example 1: projectDir = layout.projectDirectory.dir("pkl") Example 2: projectDir.fileValue file("/some/absolute/path") Directory where the project lives. A project is a directory that contains a PklProject file, which is used to declare package dependencies, as well as common evaluator settings to be applied in the project. If null, this is determined by searching up from the working directory for a directory that contains a PklProject file, until evalRootDir or the file system root is reached. omitProjectSettings: Property<Boolean> Disables loading evaluator settings from the PklProject file. noProject: Property<Boolean> Disables all behavior related to projects. settingsModule: Property<Object> Default: null Example: settingsModule = layout.projectDirectory.file("mySettings.pkl") The Pkl settings module to use. This property accepts the same input types as the sourceModules property. If null, ~/.pkl/settings.pkl or defaults specified in the pkl.settings standard library module are used. allowedModules: ListProperty<String> Default: ["pkl:", "file:", "modulepath:", "https:", "repl:", "package:", "projectpackage:"] Example: allowedModules = ["file:"] URI patterns that determine which modules can be loaded and evaluated. Patterns are matched against the beginning of module URIs. (File paths have been converted to file: URLs at this stage.) At least one pattern needs to match for a module to be loadable. allowedResources: ListProperty<String> Default: ["env:", "prop:", "modulepath:", "https:", "file:", "package:", "projectpackage:"] Example: allowedResources = ["env:", "prop:"] URL patterns that determine which external resources can be read. Patterns are matched against the beginning of resource URLs. At least one pattern needs to match for a resource to be readable. environmentVariables: MapProperty<String, String> Default: [:] (note that Gradle default differs from CLI default) Example 1: environmentVariables = ["MY_VAR_1": "myValue1", "MY_VAR_2": "myValue2"] Example 2: environmentVariables = System.getenv() Environment variables that can be read by Pkl code with read("env:<envVariableName>"). evalRootDir: DirectoryProperty Default: rootProject.layout.projectDirectory Example 1: evalRootDir = layout.projectDirectory.dir("pkl-modules") Example 2: evalRootDir.fileValue file("/some/absolute/path") Root directory for file: modules and resources. If non-null, access to file-based modules and resources is restricted to those located under the root directory. Any symlinks are resolved before this check is performed. evalTimeout: Property<java.time.Duration> Default: null Example: evalTimeout = Duration.ofSeconds(10) Duration after which evaluation of a source module will be timed out. Note that a timeout is treated the same as a program error in that any subsequent source modules will not be evaluated. externalProperties: MapProperty<String, String> Default: [:] Example: externalProperties = ["myProp1": "myValue1", "myProp2": "myValue2"] External properties that can be read by Pkl code with read("prop:<propertyName>"). moduleCacheDir: DirectoryProperty Default: null Example 1: moduleCacheDir = layout.buildDirectory.dir("pkl-module-cache") Example 2: moduleCacheDir.fileValue file("/absolute/path/to/cache") The cache directory for storing packages. If null, defaults to ~/.pkl/cache. color: Property<Boolean> Default: false Format messages using ANSI color. noCache: Property<Boolean> Default: false Disable caching of packages. modulePath: ConfigurableFileCollection Default: files() (empty collection) Example: modulePath.from files("dir1", "zip1.zip", "jar1.jar") The directories, ZIP archives, or JAR archives to search when resolving modulepath: URIs. Relative paths are resolved against the project directory. proxy: Property<URI> Default: null Example: proxy = uri("http://proxy.example.com:1234") Configures HTTP connections to connect to the provided proxy address. The URI must have scheme http, and may not contain anything other than a host and port. noProxy: ListProperty<String> Default: null Example: noProxy = ["example.com", "169.254.0.0/16"] Hosts to which all connections should bypass the proxy. Hosts can be specified by name, IP address, or IP range using CIDR notation. Tests This feature integrates the Pkl test evaluator into Gradle builds. Usage To add tests to the build, add a named configuration block inside pkl.tests: build.gradle build.gradle.kts pkl { tests { testPkl { sourceModules.add(files("module1_test.pkl", "module2_test.pkl")) junitReportsDir = layout.buildDirectory.dir("reports") overwrite = false } } } pkl { tests { register("testPkl") { sourceModules.addAll(files("module1_test.pkl", "module2_test.pkl")) junitReportsDir.set(layout.buildDirectory.dir("reports")) overwrite.set(false) } } } junitReportsDir: DirectoryProperty Default: null Example: junitReportsDir = layout.buildDirectory.dir("reports") Whether and where to generate JUnit XML reports. overwrite: Property<Boolean> Default: false Whether to ignore expected example files and generate them again. Common properties: sourceModules: ListProperty<Object> Default: [] Example 1: sourceModules = ["module1.pkl", "module2.pkl"] Example 2: sourceModules = fileTree("config").include("**/*.pkl") List of Pkl modules which are used for this operation. This property accepts the following types to represent a module: java.net.URI java.io.File java.nio.file.Path java.net.URL java.lang.CharSequence - if the represented string looks like a URI (it contains a scheme), the input is treated as a URI. Otherwise, it is treated as a path. Relative paths are resolved against the project directory. org.gradle.api.file.FileSystemLocation transitiveModules: ConfigurableFileCollection Default: [computed by pkl-gradle] Example 1: transitiveModules.from files("module1.pkl", "module2.pkl") Example 2: transitiveModules.from fileTree("config").include("**/*.pkl") File paths of modules that are directly or indirectly used by source modules. This property, along with sourceModules, is the set of input files used to determine whether this task is up-to-date or not. By default, Pkl computes this property by analyzing the imports of the source modules. Setting this property explicitly causes Pkl to skip the analyze imports step. Including source modules in transitiveModules is permitted but not required. Relative paths are resolved against the project directory. projectDir: DirectoryProperty Default: null Example 1: projectDir = layout.projectDirectory.dir("pkl") Example 2: projectDir.fileValue file("/some/absolute/path") Directory where the project lives. A project is a directory that contains a PklProject file, which is used to declare package dependencies, as well as common evaluator settings to be applied in the project. If null, this is determined by searching up from the working directory for a directory that contains a PklProject file, until evalRootDir or the file system root is reached. omitProjectSettings: Property<Boolean> Disables loading evaluator settings from the PklProject file. noProject: Property<Boolean> Disables all behavior related to projects. settingsModule: Property<Object> Default: null Example: settingsModule = layout.projectDirectory.file("mySettings.pkl") The Pkl settings module to use. This property accepts the same input types as the sourceModules property. If null, ~/.pkl/settings.pkl or defaults specified in the pkl.settings standard library module are used. allowedModules: ListProperty<String> Default: ["pkl:", "file:", "modulepath:", "https:", "repl:", "package:", "projectpackage:"] Example: allowedModules = ["file:"] URI patterns that determine which modules can be loaded and evaluated. Patterns are matched against the beginning of module URIs. (File paths have been converted to file: URLs at this stage.) At least one pattern needs to match for a module to be loadable. allowedResources: ListProperty<String> Default: ["env:", "prop:", "modulepath:", "https:", "file:", "package:", "projectpackage:"] Example: allowedResources = ["env:", "prop:"] URL patterns that determine which external resources can be read. Patterns are matched against the beginning of resource URLs. At least one pattern needs to match for a resource to be readable. environmentVariables: MapProperty<String, String> Default: [:] (note that Gradle default differs from CLI default) Example 1: environmentVariables = ["MY_VAR_1": "myValue1", "MY_VAR_2": "myValue2"] Example 2: environmentVariables = System.getenv() Environment variables that can be read by Pkl code with read("env:<envVariableName>"). evalRootDir: DirectoryProperty Default: rootProject.layout.projectDirectory Example 1: evalRootDir = layout.projectDirectory.dir("pkl-modules") Example 2: evalRootDir.fileValue file("/some/absolute/path") Root directory for file: modules and resources. If non-null, access to file-based modules and resources is restricted to those located under the root directory. Any symlinks are resolved before this check is performed. evalTimeout: Property<java.time.Duration> Default: null Example: evalTimeout = Duration.ofSeconds(10) Duration after which evaluation of a source module will be timed out. Note that a timeout is treated the same as a program error in that any subsequent source modules will not be evaluated. externalProperties: MapProperty<String, String> Default: [:] Examp'
