title = "pkl (0.28.0) • Packages"
full_description = '''Packages pkl0.28.0 Overview Modules expand_more package pkl The Pkl standard library. Pkl version: 0.28.0 or higher Authors: pkl-oss@group.apple.com Version: 0.28.0 Source code: https://github.com/apple/pkl/blob/0.28.0/stdlib/ Issue tracker: https://github.com/apple/pkl/issues Known usages: All versions: The standard library is a set of Pkl modules versioned and distributed together with the language. To import a standard library module, use import "pkl:<identifier>". For example, import "pkl:json" imports the pkl.json module. The pkl.base module defines the most fundamental properties, methods, and classes for using Pkl. Its members are automatically available in every module and hence it does not need to be imported. The default module allowlist (--allowed-modules) grants access to all standard library modules. Modules link module pkl.analyze A library for statically analyzing Pkl modules. link module pkl.base Fundamental properties, methods, and classes for writing Pkl programs. link module pkl.Benchmark A template for writing and running benchmarks. link module pkl.DocPackageInfo Template for doc-package-info.pkl, the descriptor for a package. link module pkl.DocsiteInfo Template for docsite-info.pkl, the descriptor for a Pkldoc website. link module pkl.EvaluatorSettings Common settings for Pkl's own evaluator. link module pkl.json A JSON parser. link module pkl.jsonnet A Jsonnet renderer. link module pkl.math Basic mathematical constants and functions. link module pkl.platform Information about the platform that the current program runs on. link module pkl.Project A manifest that defines the presence of a project. link module pkl.protobuf A renderer for Protocol Buffers. Note: This module is experimental and not ready for production use. link module pkl.reflect A mirror-based reflection library. link module pkl.release Information about the Pkl release that the current program runs on. link module pkl.semver Parsing, comparison, and manipulation of semantic version numbers. link module pkl.settings Configuration settings for Pkl itself. link module pkl.shell Utilities for generating shell scripts. link module pkl.test A template for writing tests. link module pkl.xml An XML renderer. link module pkl.yaml A YAML 1.2 compliant YAML parser.'''
