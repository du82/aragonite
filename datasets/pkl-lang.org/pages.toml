full_description = 'Changelog 0.32.0 (2025-02-27) Fixes Fix an incorrect "recursive typealias" error (#87). Changes Add support for Pkl 0.28.0 standard library (#88). 0.31.1 (2024-11-13) Changes Bump maximum InteliiJ version to 252 (#78). 0.31.0 (2024-11-11) Fixes Fix an exception during file refactor rename (#59). Fix an issue where excluded directories are included in project sync (#73). Changes Add support for Pkl 0.27.0 standard library (#72). Add support for const object members (#71). Bump maximum InteliiJ version to 243 (#68). Contributors ❤️ We would like to thank the contributors to this release (in alphabetical order): @amannm @barathvk 0.30.1 (2024-10-10) Fixes Fix a bug that causes a ClassCastException to be thrown (#61) Changes Improve type inference when expressions contain interpolated strings (#64). 0.30.0 (2024-08-13) Fixes Fixes a performance bug that causes spikes in CPU and memory when browsing or editing Pkl files (#55). 0.29.0 (2024-08-07) Changes Add support for IntelliJ 2024.2 (#52). 0.28.0 (2024-07-25) Fixes Fix an issue where transitive dependencies within a project show an incorrect type mismatch error (#42). Fix an issue where the "Sync Projects" action does not enable the plugin to resolve dependencies until after an editor restart (#43). Changes More metadata added to .idea/workspace.xml (requires a new project sync after updating the plugin) (#42). Project sync related changes (#42, #46) Show project-related notification banners on any Pkl file that is within a project directory. Skip ignored files when syncing projects. Remove check for missing package sources, because this can be a cause for slowdown. Add annotation for missing package sources when viewing dependency notation. Change project dependency downloading from an action to an intention. 0.27.0 (2024-06-20) Fixes Fix triple-dot uri resolution (#24). Fix runtime crash from PklCreateProjectAction in 2024.1+ (#22). Fix false positive "expression is always false" (#33). Fix type constraint checking of octal literals (#34). Fix path resolution for packages on Windows (#35). Miscellaneous Move kotlin.serialization.plugin to version catalog (#14). Documentation improvements (#7, #15). Changes Change Pkl file icon to use the logo (#6). Improve semver handling in package uris (#20). Add const check for typealiases (new in Pkl 0.26) (#32). Add support for breadcrumbs (#31). Add support for new package cache dir (new in Pkl 0.26) (#36). Add support for Pkl 0.26.0 standard library (#38). Contributors ❤️ We would like to thank the contributors to this release (in alphabetical order): @Madmegsox1 @MrNavaStar @StefMa @WarningImHack3r 0.26.0 (2024-02-02) Initial plugin release Jump to Error'
