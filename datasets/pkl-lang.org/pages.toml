full_description = '''Installation This plugin requires Neovim version 0.5 or higher. Install nvim-treesitter along side this plugin using your favorite plugin manager. Here is a sample init.vim file using vim-plug. To complete the setup, you will need to run :PlugInstall, then restart neovim. call plug#begin() Plug 'nvim-treesitter/nvim-treesitter', {'do': ':TSUpdate'} Plug 'https://github.com/apple/pkl-neovim.git' call plug#end() " The below is required for enabling the tree-sitter syntax engine, which is used by pkl-neovim. lua <<EOF local hasConfigs, configs = pcall(require, "nvim-treesitter.configs") if hasConfigs then configs.setup { ensure_installed = "pkl", highlight = { enable = true, -- false will disable the whole extension }, indent = { enable = true } } end EOF Neovim Plugin Features'''
