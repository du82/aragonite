full_description = '''Integration with Swift Pkl provides a rich integration with Swift. Our integration allows you to embed the Pkl runtime into your Swift program, and also provides code generation from Pkl source code. To get started, reference the Quickstart guide. @main class MyApp { static func main() async throws { let config = try await MyConfig.loadFrom(source: .path("config.pkl")) print("I'm running on host \(config.host)") } } Quickstart Pkl Swift Bindings Integration with Swift 0.3.0 0.4.1 0.3.0 0.2.3 Edit this Page Integration with Swift Pkl provides a rich integration with Swift. Our integration allows you to embed the Pkl runtime into your Swift program, and also provides code generation from Pkl source code. To get started, reference the Quickstart guide. @main class MyApp { static func main() async throws { let config = try await MyConfig.loadFrom(source: .path("config.pkl")) print("I'm running on host \(config.host)") } } Quickstart'''
