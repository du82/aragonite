["https://pkl-lang.org/main/current/kotlin-binding/codegen.html"]
title = "Kotlin Code Generator :: Pkl Docs"
full_description = 'Kotlin Code Generator The Kotlin source code generator reads Pkl classes and generates corresponding Kotlin classes with equally named properties. Together with Object Mapping, code generation provides a complete solution for consuming Pkl configuration as statically typed Kotlin objects. Kotlin code never drifts from the configuration structure defined in Pkl, and the entire configuration tree can be code-completed in Kotlin IDEs. Installation The code generator is offered as Gradle plugin, Java library, and CLI. Gradle Plugin See Installation in the Gradle plugin chapter. Java Library The pkl-codegen-kotlin library is available from Maven Central. It requires Java 17 or higher and Kotlin 1.3 or higher. Gradle To use the library in a Gradle project, declare the following dependency: Kotlin Groovy build.gradle.kts dependencies { implementation("org.pkl-lang:pkl-codegen-kotlin:0.28.0") } repositories { mavenCentral() } build.gradle dependencies { implementation "org.pkl-lang:pkl-codegen-kotlin:0.28.0" } repositories { mavenCentral() } Maven To use the library in a Maven project, declare the following dependency: pom.xml <dependency> <groupId>org.pkl-lang</groupId> <artifactId>pkl-codegen-kotlin</artifactId> <version>0.28.0</version> </dependency> CLI The CLI is bundled with the library. As we do not currently ship the CLI as a self-contained Jar, we recommend to provision it with a Maven compatible build tool as shown in Java Library. Usage The code generator is offered as Gradle plugin, Java library, and CLI. Gradle Plugin See Kotlin Code Generation in the Gradle plugin chapter. Java Library The library offers two APIs: a high-level API that corresponds to the CLI, and a lower-level API that provides additional features and control. The entry points for these APIs are org.pkl.codegen.kotlin.CliKotlinCodeGenerator and org.pkl.codegen.kotlin.KotlinCodeGenerator, respectively. For more information, refer to the KDoc documentation. CLI As mentioned in Installation, the CLI is bundled with the library. To run the CLI, execute the library Jar or its org.pkl.codegen.kotlin.Main main class. Synopsis: java -cp <classpath> -jar pkl-codegen-kotlin.jar [<options>] <modules> <modules> The absolute or relative URIs of the modules to generate classes for. Relative URIs are resolved against the working directory. Options --generate-kdoc Default: (flag not set) Flag that indicates to preserve Pkl doc comments by generating corresponding KDoc comments. Common code generator options: --indent Default: " " (two spaces) Example: "\t" (one tab) The characters to use for indenting generated source code. -o, --output-dir Default: (not set) Example: generated/ The directory where generated source code is placed. Relative paths are resolved against the working directory. --generate-spring-boot Default: (not set) Flag that indicates to generate config classes for use with Spring Boot. --implement-serializable Default: (not set) Flag that indicates to generate classes that implement java.io.Serializable. --rename Default: (none) Example: foo.=com.example.foo. Allows to change default class and package names (derived from Pkl module names) in the generated code. When you need the generated class or package names to be different from the default names derived from the Pkl module names, you can define a rename mapping, where the key is the original Pkl module name prefix, and the value is its replacement. When you do, the generated code’s package declarations, class names, as well as file locations, will be modified according to this mapping. The prefixes are replaced literally, which means that dots at the end are important. If you want to rename packages only, in most cases, you must ensure that you have an ending dot on both sides of a mapping (except for an empty mapping, if you use it), otherwise you may get unexpected results: // Assuming the following arguments: --rename com.foo.=x // Dot on the left only --rename org.bar=y. // Dot on the right only --rename net.baz=z // No dots // The following renames will be made: "com.foo.bar" -> "xbar" // Target prefix merged into the suffix "org.bar.baz" -> "y..baz" // Double dot, invalid name "net.baz.qux" -> "z.qux" // Looks okay, but... "net.bazqux" -> "zqux" // ...may cut the name in the middle. When computing the appropriate target name, the longest matching prefix is used: // Assuming the following arguments: --rename com.foo.Main=w.Main --rename com.foo.=x. --rename com.=y. --rename =z. // The following renames will be made: com.foo.Main -> w.Main com.foo.bar -> x.bar com.baz.qux -> y.baz.qux org.foo.bar -> z.org.foo.bar Repeat this option to define multiple mappings. Keys can be arbitrary strings, including an empty string. Values must be valid dot-separated fully qualified class name prefixes, possibly terminated by a dot. Common CLI options: --allowed-modules Default: pkl:,file:,modulepath:,https:,repl:,package:,projectpackage: Comma-separated list of URI patterns that determine which modules can be loaded and evaluated. Patterns are matched against the beginning of module URIs. (File paths have been converted to file: URLs at this stage.) At least one pattern needs to match for a module to be loadable. --allowed-resources Default: env:,prop:,package:,projectpackage: Comma-separated list of URI patterns that determine which external resources can be read. Patterns are matched against the beginning of resource URIs. At least one pattern needs to match for a resource to be readable. --color Default: auto When to format messages with ANSI color codes. Possible values: "never": Never format "auto": Format if stdin, stdout, or stderr are connected to a console. "always": Always format --cache-dir Default: ~/.pkl/cache Example: /path/to/module/cache/ The cache directory for storing packages. --no-cache Disable caching of packages. -e, --env-var Default: OS environment variables for the current process Example: MY_VAR=myValue Sets an environment variable that can be read by Pkl code with read("env:<envVarName>"). Repeat this option to set multiple environment variables. -h, --help Display help information. --module-path Default: (empty) Example: dir1:zip1.zip:jar1.jar Directories, ZIP archives, or JAR archives to search when resolving modulepath: URIs. Paths are separated by the platform-specific path separator (: on *nix, ; on Windows). Relative paths are resolved against the working directory. -p, --property Default: (none) Example: myProp=myValue Sets an external property that can be read by Pkl code with read("prop:<propertyName>"). Repeat this option to set multiple external properties. --root-dir Default: (none) Example: /some/path Root directory for file: modules and resources. If set, access to file-based modules and resources is restricted to those located under the specified root directory. Any symlinks are resolved before this check is performed. --settings Default: (none) Example: mySettings.pkl File path of the Pkl settings file to use. If not set, ~/.pkl/settings.pkl or defaults specified in the pkl.settings standard library module are used. -t, --timeout Default: (none) Example: 30 Duration, in seconds, after which evaluation of a source module will be timed out. Note that a timeout is treated the same as a program error in that any subsequent source modules will not be evaluated. -v, --version Display version information. -w, --working-dir Base path that relative module paths passed as command-line arguments are resolved against. Defaults to the current working directory. --ca-certificates Default: (none) Example: /some/path/certificates.pem Path to a file containing CA certificates to be used for TLS connections. Setting this option replaces the existing set of CA certificates bundled into the CLI. Certificates need to be X.509 certificates in PEM format. For other methods of configuring certificates, see CA Certificates. --http-proxy Default: (none) Example: http://proxy.example.com:1234 Configures HTTP connections to connect to the provided proxy address. The URI must have scheme http, and may not contain anything other than a host and port. --http-no-proxy Default: (none) Example: example.com,169.254.0.0/16 Comma separated list of hosts to which all connections should bypass the proxy. Hosts can be specified by name, IP address, or IP range using CIDR notation. Full Example For a ready-to-go example with full source code, see codegen-kotlin in the pkl/pkl-examples repository. Kotlin pkl-config-kotlin Library'
year_published = 2025
