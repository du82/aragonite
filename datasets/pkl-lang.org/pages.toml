["https://pkl-lang.org/main/current/pkl-cli/index.html"]
title = "CLI :: Pkl Docs"
full_description = '''CLI The pkl command-line interface (CLI) evaluates Pkl modules and writes their output to the console or a file. For interactive development, the CLI includes a Read-Eval-Print Loop (REPL). Installation The CLI comes in multiple flavors: Native macOS executable for amd64 (tested on macOS 10.15) Native Linux executable for amd64 Native Linux executable for aarch64 Native Alpine Linux executable for amd64 (cross-compiled and tested on Oracle Linux 8) Native Windows executable for amd64 (tested on Windows Server 2022) Java executable (tested with Java 17/21 on macOS and Oracle Linux) On macOS, Linux, and Windows, we recommend using the native executables. They are self-contained, start up instantly, and run complex Pkl code much faster than the Java executable. What is the Difference Between the Linux and Alpine Linux Executables? The Linux executable is dynamically linked against glibc and libstdc++, whereas, the Alpine Linux executable is statically linked against musl libc and libstdc++. The Java executable works on multiple platforms and has a smaller binary size than the native executables. However, it requires a Java 17 (or higher) runtime on the system path, and has a noticeable startup delay. All flavors are built from the same codebase and undergo the same automated testing. Except where noted otherwise, the rest of this page discusses the native executables. Homebrew On macOS and Linux, release versions can be installed with Homebrew. To install Pkl, run: brew install pkl To update Pkl, run: brew update brew upgrade pkl # or just `brew upgrade` Download Development and release versions can be downloaded and installed manually. macOS Executable On aarch64: curl -L -o pkl 'https://github.com/apple/pkl/releases/download/0.28.0/pkl-macos-aarch64' chmod +x pkl ./pkl --version On amd64: curl -L -o pkl 'https://github.com/apple/pkl/releases/download/0.28.0/pkl-macos-amd64' chmod +x pkl ./pkl --version This should print something similar to: Pkl 0.28.0 (macOS, native) Linux Executable The Linux executable is dynamically linked against glibc and libstdc++ for the amd64 and aarch64 architectures. For a statically linked executable, see Alpine Linux Executable. On aarch64: curl -L -o pkl 'https://github.com/apple/pkl/releases/download/0.28.0/pkl-linux-aarch64' chmod +x pkl ./pkl --version On amd64: curl -L -o pkl 'https://github.com/apple/pkl/releases/download/0.28.0/pkl-linux-amd64' chmod +x pkl ./pkl --version This should print something similar to: Pkl 0.28.0 (Linux, native) Alpine Linux Executable The Alpine Linux executable is statically linked against musl libc and libstdc++. For a dynamically linked executable, see Linux Executable. curl -L -o pkl 'https://github.com/apple/pkl/releases/download/0.28.0/pkl-alpine-linux-amd64' chmod +x pkl ./pkl --version This should print something similar to: Pkl 0.28.0 (Linux, native) We currently do not support the aarch64 architecture for Alpine Linux. Windows Executable Invoke-WebRequest 'https://github.com/apple/pkl/releases/download/0.28.0/pkl-windows-amd64.exe' -OutFile pkl.exe .\pkl --version This should print something similar to: Pkl 0.28.0 (Windows 10.0, native) We currently do not support the aarch64 architecture for Windows. Java Executable The Java executable is a jar that can be executed directly on macOS, Linux, and Windows. It requires java to be installed, and available on $PATH. macOS/Linux Windows curl -L -o jpkl 'https://repo1.maven.org/maven2/org/pkl-lang/pkl-cli-java/0.28.0/pkl-cli-java-0.28.0.jar' chmod +x jpkl ./jpkl --version Invoke-WebRequest 'https://repo1.maven.org/maven2/org/pkl-lang/pkl-cli-java/0.28.0/pkl-cli-java-0.28.0.jar' -OutFile jpkl.bat .\jpkl --version This should print something similar to: Pkl 0.28.0 (macOS 14.2, Java 17.0.10) The Java executable is named jpkl. Usage Synopsis: pkl <subcommand> [<options>] [<args>] For a brief description of available options, run pkl -h. The Java executable is named jpkl. pkl eval Synopsis: pkl eval [<options>] [<modules>] Evaluate the given Pkl <modules> and produce their rendering results. <modules> The absolute or relative URIs of the modules to evaluate. Relative URIs are resolved against the working directory. Options -f, --format Default: (none) Example: yaml The output format to generate. The default output renderer for a module supports the following formats: json jsonnet pcf plist properties textproto xml yaml If no format is set, the default renderer chooses pcf. -o, --output-path Default: (none) Example: "config.yaml" The file path where the output file is placed. Relative paths are resolved against the project directory. This option is mutually exclusive with --multiple-file-output-path. If neither option is set, each module’s output.text is written to standard output. If multiple source modules are given, placeholders can be used to map them to different output files. The following placeholders are supported: %{moduleDir} The directory path of the module, relative to the working directory. Only available when evaluating file-based modules. %{moduleName} The simple module name as inferred from the module URI. For hierarchical URIs such as file:///foo/bar/baz.pkl, this is the last path segment without file extension. %{outputFormat} The requested output format. Only available if --format is set. If multiple source modules are mapped to the same output file, their outputs are concatenated. By default, module outputs are separated with ---, as in a YAML stream. The separator can be customized using the --module-output-separator option. --module-output-separator Default: --- (as in a YAML stream) The separator to use when multiple module outputs are written to the same file, or to standard output. -m, --multiple-file-output-path Default: (none) Example: "output/" The directory where a module’s output files are placed. Setting this option causes Pkl to evaluate a module’s output.files property and write the files specified therein. Within output.files, a key determines a file’s path relative to --multiple-file-output-path, and a value determines the file’s contents. This option cannot be used together with any of the following: --output-path --expression This option supports the same placeholders as --output-path. Examples: # Write files to `output/` pkl eval -m output/ myFiles.pkl # Write files to the current working directory pkl eval -m . myFiles.pkl # Write foo.pkl's files to the `foo` directory, and bar.pkl's files # to the `bar` directory pkl eval -m "%{moduleName}" foo.pkl bar.pkl For additional details, see Multiple File Output in the language reference. -x, --expression Default: (none) The expression to be evaluated within the module. This option causes Pkl to evaluate the provided expression instead of the module’s output.text or output.files properties. The resulting value is then stringified, and written to either standard out, or the designated output file. For example, consider the following Pkl module: pigeon.pkl metadata { species = "Pigeon" } The following command prints Pigeon to the console: pkl eval -x metadata.species pigeon.pkl # => Pigeon Setting an --expression flag can be thought of as substituting the expression in place of a module’s output.text property. Running the previous command is conceptually the same as if the below module were evaluated without the --expression flag: metadata { species = "Pigeon" } output { text = metadata.species.toString() } This command also takes common options. pkl server Synopsis: pkl server Run as a server that communicates over standard input/output. This option is used for embedding Pkl in an external client, such as pkl-swift or pkl-go. pkl test Synopsis: pkl test [<options>] [<modules>] Evaluate the given <modules> as tests, producing a test report and appropriate exit code. Renderers defined in test files will be ignored by the test command. Tests that result in writing pkl-expected.pcf files are considered failing tests. If these are the only failures, the command exits with exit code 10. Otherwise, failures result in exit code 1. <modules> The absolute or relative URIs of the modules to test. Relative URIs are resolved against the working directory. Options --junit-reports Default: (none) Example: ./build/test-results Directory where to store JUnit reports. No JUnit reports will be generated if this option is not present. --overwrite Force generation of expected examples. The old expected files will be deleted if present. This command also takes common options. pkl repl Synopsis: pkl repl [<options>] Start a REPL session. This command takes common options. pkl project package Synopsis: pkl project package <project-dir> This command prepares a project to be published as a package. Given a project directory, it creates the following artifacts: <name>@<version> - the package metadata file <name>@<version>.sha256 - the dependency metadata file’s SHA-256 checksum <name>@<version>.zip - the package archive <name>@<version>.zip.sha256 - the package archive’s SHA-256 checksum These artifacts are expected to be published to an HTTPS server, such that the metadata and zip files can be fetched at their expected locations. The package ZIP should be available at the packageZipUrl location specified in the PklProject file The package metadata should be available at the package URI’s derived HTTPS URL. For example, given package package://example.com/mypackage@1.0.0, the metadata file should be published to https://example.com/mypackage@1.0.0. During packaging, this command runs these additional steps: Run the package’s API tests, if any are defined. Validates that if the package has already been published, that the package’s metadata is identical. This step can be skipped using the --skip-publish-check flag. Examples: # Search the current working directory for a project, and package it. pkl project package # Package all projects within the `packages/` directory to `.out`, writing each package's artifacts to its own directory. pkl project package --output-path ".out/%{name}@%{version}/" packages/*/ Options --output-path Default: .out The directory to write artifacts to. Accepts the following placeholders: %{name} The name of the package %{version} The version of the package --skip-publish-check Skips checking whether a package has already been published with different contents. By default, the packager will check whether a package at the same version has already been published. If the package has been published, it validates that the package’s metadata is identical to the locally generated metadata. --junit-reports Default: (none) Example: ./build/test-results Directory where to store JUnit reports. No JUnit reports will be generated if this option is not present. --overwrite Force generation of expected examples. The old expected files will be deleted if present. This command also takes common options. pkl project resolve Synopsis: pkl project resolve <project-dir> This command takes the dependencies of a project, and writes the resolved versions a file at path PklProject.deps.json. It builds a dependency list, taking the latest minor version in case of version conflicts. For more details, see the resolving dependencies section of the language reference. Examples: # Search the current working directory for a project, and resolve its dependencies. pkl project resolve # Resolve dependencies for all projects within the `packages/` directory. pkl project resolve packages/*/ Options This command accepts common options. pkl download-package Synopsis: pkl download-package <package-uri> This command downloads the specified packages to the cache directory. If the package already exists in the cache directory, this command is a no-op. Options This command accepts common options. pkl analyze imports Synopsis: pkl analyze imports [<modules>] This command builds a graph of imports declared in the provided modules. This is a lower level command that is meant to be useful for Pkl-related tooling. For example, this command feeds into the Gradle Plugin to determine if tasks are considered up-to-date or not. This command produces an object with two properties, imports and resolvedImports. The imports property is a mapping of a module’s absolute URI, to the set of imports declared within that module. The resolvedImports property is a mapping of a module’s absolute URI (as stated in imports), to the resolved absolute URI that might be useful for fetching the module’s contents. For example, a local dependency import will have an in-language URI with scheme projectpackage:, and may have resolved URI with scheme file: (assuming that the project is file-based). Examples: # Analyze the imports of a single module pkl analyze imports myModule.pkl # Same as the previous command, but output in JSON. pkl analyze imports -f json myModule.pkl # Analyze imports of all modules declared within src/ pkl analyze imports src/*.pkl <modules> The absolute or relative URIs of the modules to analyze. Relative URIs are resolved against the working directory. Options -f, --format Same meaning as -f, --format in pkl eval. -o, --output-path Same meaning as -o, --output-path in pkl eval. This command also takes common options. Common options The pkl eval, pkl test, pkl repl, pkl project resolve, pkl project package, pkl download-package, and pkl analyze imports commands support the following common options: --allowed-modules Default: pkl:,file:,modulepath:,https:,repl:,package:,projectpackage: Comma-separated list of URI patterns that determine which modules can be loaded and evaluated. Patterns are matched against the beginning of module URIs. (File paths have been converted to file: URLs at this stage.) At least one pattern needs to match for a module to be loadable. --allowed-resources Default: env:,prop:,package:,projectpackage: Comma-separated list of URI patterns that determine which external resources can be read. Patterns are matched against the beginning of resource URIs. At least one pattern needs to match for a resource to be readable. --color Default: auto When to format messages with ANSI color codes. Possible values: "never": Never format "auto": Format if stdin, stdout, or stderr are connected to a console. "always": Always format --cache-dir Default: ~/.pkl/cache Example: /path/to/module/cache/ The cache directory for storing packages. --no-cache Disable caching of packages. -e, --env-var Default: OS environment variables for the current process Example: MY_VAR=myValue Sets an environment variable that can be read by Pkl code with read("env:<envVarName>"). Repeat this option to set multiple environment variables. -h, --help Display help information. --module-path Default: (empty) Example: dir1:zip1.zip:jar1.jar Directories, ZIP archives, or JAR archives to search when resolving modulepath: URIs. Paths are separated by the platform-specific path separator (: on *nix, ; on Windows). Relative paths are resolved against the working directory. -p, --property Default: (none) Ex'''
year_published = 2025
