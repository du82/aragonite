["https://pkl-lang.org/go/current/CHANGELOG.html"]
title = "Changelog :: Pkl Docs"
full_description = "Changelog 0.9.0 (2024-12-18) Additions Add new struct fields to match added standard library properties in Pkl 0.27 (#101, #119). Add a new API called ExternalReaderClient, which provides a way to write an external module or resource reader (#101). Miscellaneous Codebase improvements (#110, #112). Fixes Fix a memory leak where NewProjectEvaluatorWithCommand creates an ephemeral evaluator but does not close it (#112). Contributors ❤️ Thank you to all the contributors for this release! @HT154 @kasugamirai 0.8.1 (2024-10-10) Fixes Fix an issue where EvaluatorOptions.Http.Proxy.NoProxy is being ignored (#106). Miscellaneous Documentation improvements (#94, #105). Contributors ❤️ Thank you to all the contributors for this release! @HT154 @StefMa @kitsune7 0.8.0 (2024-07-04) Additions Support for Pkl 0.26 Fixes Make the loading of generator-settings.pkl observe the CLI’s --cache-dir for air-gapped use. Fix decoding of sets when input type is any. Miscellaneous Improved performance and clarity of version comparison. Fix unhandled error in the evaluator manager. Reduced lock contention in atomicRandom. Use path.join to make the resolution of PklProject files platform independent. Breaking changes NewProjectEvaluator now interprets PklProject files with the same configuration as the modules in the project. Contributors ❤️ Thank you to all the contributors for this release! @kasugamirai @HT154 0.7.0 (2024-06-06) Additions Add a way to set the cache dir when running pkl-gen-go. Add --cache-dir flag to the CLI. Add cacheDir property to GeneratorSettings.pkl. Fixes Correct typos in some doc comments. Address a possible race condition that prevents correctly closing the evaluator. Gracefully shut down the pkl child process. The process is now given five seconds to shut down before forcefully terminated. Change pkl-gen-go to handle path separators correctly on Windows. Fix unix file permissions when writing files. Correctly resolve pkl-gen-go’s --project-dir flag when given a relative path. Miscellaneous Fix typos. Update doc comments on modules to prevent godoc from processing license headers as documentation. Breaking changes type DurationUnit and type DataSizeUnit are now backed by int64, to avoid possible int overflow issues on 32 bit systems. EvaluatorOptions.ProjectDir is renamed to EvaluatorOptions.ProjectBaseURI to be forwards-compatible with scheme-agnostic projects coming in Pkl 0.27. Contributors ❤️ Thank you to all the contributors for this release! @kasugamirai @jstrachan @candy12t @KushalP @HT154 0.6.0 (2024-03-11) Additions Add support for using pkl-gen-go with projects (#22) Add --project-dir flag to pkl-gen-go command. Add uri and projectDir setting to GeneratorSettings.pkl. Changes Bump Go to 1.21 (#13) Micellaneous Documentation fixes (#19) Contributors ❤️ Thank you to all the contributors for this release! @Nasfame @vince 0.5.3 (2024-02-09) Fixes Fixes an issue where pkl-gen-go can address an invalid path if installed through go install. 0.5.2 (2024-02-08) Fixes Fixes an issue where pkl-gen-go can address an invalid path to GeneratorSettings.pkl (#3) (thanks, @kasugamirai!). Addresses possible nil panics if URLs from pkl server are invalid (#5). Fixes some documentation bugs (#1, #6). 0.5.1 (2024-02-02) Fixes an issue where pkl-gen-go includes broken links 0.5.0 (2024-02-02) Initial library release. External Readers"
year_published = 2025
