title = "Language Reference :: Pkl Docs"
full_description = 'Language Reference The language reference provides a comprehensive description of every Pkl language feature. Comments Numbers Booleans Strings Durations Data Sizes Objects Listings Mappings Classes Methods Modules Null Values If Expressions Resources Errors Debugging Advanced Topics For a hands-on introduction, see Tutorial. For ready-to-go examples with full source code, see Examples. For API documentation, see Standard Library. Comments Pkl has three forms of comments: Line comment A code comment that starts with a double-slash (//) and runs until the end of the line. // Single-line comment Block comment A nestable multiline comment, which is typically used to comment out code. Starts with /* and ends with */. /* Multiline comment */ Doc comment A user-facing comment attached to a program member. It starts with a triple-slash (///) and runs until the end of the line. Doc comments on consecutive lines are merged. /// A *bird* superstar. /// Unfortunately, extinct. dodo: Bird Doc comments are processed by Pkldoc, Pkl’s documentation generator. For details on their syntax, see Doc Comments. Numbers Pkl has two numeric types, Int and Float. Their common supertype is Number. Integers A value of type Int is a 64-bit signed integer. Integer literals can be written in decimal, hexadecimal, binary, or octal notation: num1 = 123 num2 = 0x012AFF (1) num3 = 0b00010111 (2) num4 = 0o755 (3) 1 decimal: 76543 2 decimal: 23 3 decimal: 493 Integers can optionally include an underscore as a separator to improve readability. An underscore does not affect the integer’s value. num1 = 1_000_000 (1) num2 = 0x0134_64DE (2) num3 = 0b0001_0111 (3) num4 = 0o0134_6475 (4) 1 Equivalent to 1000000 2 Equivalent to 0x013464DE 3 Equivalent to 0b00010111 4 Equivalent to 0o01346475 Negative integer literals start with a minus sign, as in -123. Integers support the standard comparison operators: comparison1 = 5 == 2 comparison2 = 5 < 2 comparison3 = 5 > 2 comparison4 = 5 <= 2 comparison5 = 5 >= 2 Integers support the following arithmetic operators: num1 = 5 + 2 (1) num2 = 5 - 2 (2) num3 = 5 * 2 (3) num4 = 5 / 2 (4) num5 = 5 ~/ 2 (5) num6 = 5 % 2 (6) num7 = 5 ** 2 (7) 1 addition (result: 7) 2 subtraction (result: 3) 3 multiplication (result: 10) 4 division (result: 2.5, always Float) 5 integer division (result: 2, always Int) 6 remainder (result: 1) 7 exponentiation (result: 25) Arithmetic overflows are caught and result in an error. To restrict an integer’s range, use one of the predefined type aliases or an isBetween type constraint: clientPort: UInt16 serverPort: Int(isBetween(0, 1023)) Floats A value of type Float is a 64-bit double-precision floating point number. Float literals use decimal notation. They consist of an integer part, decimal point, fractional part, and exponent part. The integer and exponent parts are optional. num1 = .23 num2 = 1.23 num3 = 1.23e2 (1) num4 = 1.23e-2 (2) 1 result: 1.23 * 102 2 result: 1.23 * 10-2 Negative float literals start with a minus sign, as in -1.23. The special float values not a number, positive infinity, and negative infinity are written as: notANumber = NaN positiveInfinity = Infinity negativeInfinity = -Infinity The NaN and Infinity properties are defined in the standard library. Floats support the same comparison and arithmetic operators as integers. Float literals with a fractional part of zero can be safely replaced with integer literals. For example, it is safe to write 1.3 * 42 instead of 1.3 * 42.0. Floats can also include the same underscore separator as integers. For example, 1_000.4_400 is a float whose value is equivalent to 1000.4400. As integers are more convenient to use than floats with a fractional part of zero, we recommend requiring x: Number instead of x: Float in type annotations. To restrict a float to a finite value, use the isFinite type constraint: x: Float(isFinite) To restrict a float’s range, use the isBetween type constraint: x: Float(isBetween(0, 10e6)) Booleans A value of type Boolean is either true or false. Apart from the standard logical operators, Boolean has xor and implies methods. res1 = true && false (1) res2 = true || false (2) res3 = !false (3) res4 = true.xor(false) (4) res5 = true.implies(false) (5) 1 logical conjunction (result: false) 2 logical disjunction (result: true) 3 logical negation (result: true) 4 exclusive disjunction (result: true) 5 logical implication (result: false) Strings A value of type String is a sequence of Unicode code points. String literals are enclosed in double quotes: "Hello, World!" Except for a few minor differences [1], String literals have the same syntax and semantics as in Swift 5. Learn one of them, know both of them! Inside a string literal, the following character escape sequences have special meaning: \t - tab \n - line feed \r - carriage return \" - verbatim quote \\ - verbatim backslash Unicode escape sequences have the form \u{<codePoint>}, where <codePoint> is a hexadecimal number between 0 and 10FFFF: "\u{26} \u{E9} \u{1F600}" (1) 1 result: "& é 😀" To concatenate strings, use the + (plus) operator, as in "abc" + "def" + "ghi". String Interpolation To embed the result of expression <expr> in a string, use \(<expr>): name = "Dodo" greeting = "Hi, \(name)!" (1) 1 result: "Hi, Dodo!" Before a result is inserted, it is converted to a string: x = 42 str = "\(x + 2) plus \(x * 2) is \(0x80)" (1) 1 result: "44 plus 84 is 128" Multiline Strings To write a string that spans multiple lines, use a multiline string literal: """ Although the Dodo is extinct, the species will be remembered. """ Multiline string literals are delimited by three double quotes ("""). String content and closing delimiter must each start on a new line. The content of a multiline string starts on the first line after the opening quotes and ends on the last line before the closing quotes. Line breaks are included in the string and normalized to \n. The previous multiline string is equivalent to this single-line string. Notice that there is no leading or trailing whitespace. "Although the Dodo is extinct,\nthe species will be remembered." String interpolation, character escape sequences, and Unicode escape sequences work the same as for single-line strings: bird = "Dodo" message = """ Although the \(bird) is extinct, the species will be remembered. """ Each content line must begin with the same whitespace characters as the line containing the closing delimiter, which is not included in the string. Any further leading whitespace characters are preserved. In other words, line indentation is controlled by indenting lines relative to the closing delimiter. In the following string, lines have no leading whitespace: str = """ Although the Dodo is extinct, the species will be remembered. """ In the following string, lines are indented between three and five spaces: str = """ Although the Dodo is extinct, the species will be remembered. """ Custom String Delimiters Some strings contain many verbatim backslash (\) or quote (") characters. A good example is regular expressions, which make frequent use of backslash characters for escaping. In such cases, using the escape sequences \\ and \" quickly becomes tedious and hampers readability. Instead, leading/closing string delimiters can be customized to start/end with a pound sign (#). This also affects the escape character, which changes from \ to \#. All backslash and quote characters in the following string are interpreted verbatim: #" \\\\\ """"" "# Escape sequences and string interpolation still work, and now start with \#: bird = "Dodo" str = #" \\\\\ \#n \#u{12AF} \#(bird) """"" "# More generally, string delimiters and escape characters can be customized to contain n pound signs each, for n >= 1. In the following string, n is 2. As a result, the string content is interpreted verbatim: ##" \\\\\ \#\#\# """"" "## String API The String class offers a rich API. Here are just a few examples: strLength = "dodo".length (1) reversedStr = "dodo".reverse() (2) hasAx = "dodo".contains("alive") (3) trimmed = " dodo ".trim() (4) 1 result: 4 2 result: "odod" 3 result: false 4 result: "dodo" Durations A value of type Duration has a value component of type Number and a unit component of type String. The unit component is constrained to the units defined in DurationUnit. Durations are constructed with the following Number properties: duration1 = 5.ns // nanoseconds (smallest unit) duration2 = 5.us // microseconds duration3 = 5.ms // milliseconds duration4 = 5.s // seconds duration5 = 5.min // minutes duration6 = 5.h // hours duration7 = 3.d // days (largest unit) A duration can be negative, as in -5.min. It can have a floating point value, as in 5.13.min. The value and unit properties provide access to the duration’s components. Durations support the standard comparison operators: comparison1 = 5.min == 3.s comparison2 = 5.min < 3.s comparison3 = 5.min > 3.s comparison4 = 5.min <= 3.s comparison5 = 5.min >= 3.s Durations support the same arithmetic operators as numbers: res1 = 5.min + 3.s (1) res2 = 5.min - 3.s (2) res3 = 5.min * 3 (3) res4 = 5.min / 3 (4) res5 = 5.min / 3.min (5) res6 = 5.min ~/ 3 (6) res7 = 5.min ~/ 3.min (7) res8 = 5.min % 3 (8) res9 = 5.min ** 3 (9) 1 result: 5.05.min 2 result: 4.95.min 3 result: 15.min 4 result: 1.6666666666666667.min 5 result: 1.6666666666666667 6 result: 1.min 7 result: 1 8 result: 2.min 9 result: 125.min The value component can be an expression: x = 5 xMinutes = x.min (1) y = 3 xySeconds = (x + y).s (2) 1 result: 5.min 2 result: 8.s Data Sizes A value of type DataSize has a value component of type Number and a unit component of type String. The unit component is constrained to the units defined in DataSizeUnit. Data sizes with decimal units (factor 1000) are constructed with the following Number properties: datasize1 = 5.b // bytes (smallest unit) datasize2 = 5.kb // kilobytes datasize3 = 5.mb // megabytes datasize4 = 5.gb // gigabytes datasize5 = 5.tb // terabytes datasize6 = 5.pb // petabytes (largest unit) Data sizes with binary units (factor 1024) are constructed with the following Number properties: datasize1 = 5.b // bytes (smallest unit) datasize2 = 5.kib // kibibytes datasize3 = 5.mib // mebibytes datasize4 = 5.gib // gibibytes datasize5 = 5.tib // tebibytes datasize6 = 5.pib // pebibytes (largest unit) A data size can be negative, as in -5.mb. It can have a floating point value, as in 5.13.mb. The value and unit properties provide access to the data size’s components. Data sizes support the standard comparison operators: comparison1 = 5.mb == 3.kib comparison2 = 5.mb < 3.kib comparison3 = 5.mb > 3.kib comparison4 = 5.mb <= 3.kib comparison5 = 5.mb >= 3.kib Data sizes support the same arithmetic operators as numbers: res1 = 5.mb + 3.kib (1) res2 = 5.mb - 3.kib (2) res3 = 5.mb * 3 (3) res4 = 5.mb / 3 (4) res5 = 5.mb / 3.mb (5) res6 = 5.mb ~/ 3 (6) res7 = 5.mb ~/ 3.mb (7) res8 = 5.mb % 3 (8) res9 = 5.mb ** 3 (9) 1 result: 5.003072.mb 2 result: 4.996928.mb 3 result: 15.mb 4 result: 1.6666666666666667.mb 5 result: 1.6666666666666667 6 result: 1.mb 7 result: 1 8 result: 2.mb 9 result: 125.mb The value component can be an expression: x = 5 xMegabytes = x.mb (1) y = 3 xyKibibytes = (x + y).kib (2) 1 result: 5.mb 2 result: 8.kib Objects An object is an ordered collection of values indexed by name. An object’s key-value pairs are called its properties. Property values are lazily evaluated on the first read. Because Pkl’s objects differ in important ways from objects in general-purpose programming languages, and because they are the backbone of most data models, understanding objects is the key to understanding Pkl. Defining Objects Let’s define an object with properties name and extinct: dodo { (1) name = "Dodo" (2) extinct = true (3) } (4) 1 Defines a module property named dodo. The open curly brace ({) indicates that the value of this property is an object. 2 Defines an object property named name with string value "Dodo". 3 Defines an object property named extinct with boolean value true. 4 The closing curly brace indicates the end of the object definition. To access an object property by name, use dot (.) notation: dodoName = dodo.name dodoIsExtinct = dodo.extinct Objects can be nested: dodo { name = "Dodo" taxonomy { (1) `class` = "Aves" (2) } } 1 Defines an object property named taxonomy. The open curly brace indicates that its value is another object. 2 The word class is a keyword of Pkl, and needs to be wrapped in backticks (`) to be used as a property. As you probably guessed, the nested property class can be accessed with dodo.taxonomy.class. Like all values, objects are immutable, which is just a fancy (and short!) way to say that their properties never change. So what happens when Dodo moves to a different street? Do we have to construct a new object from scratch? Amending Objects Fortunately, we don’t have to. An object can be amended to form a new object that only differs in selected properties. Here is how this looks: tortoise = (dodo) { (1) name = "Galápagos tortoise" taxonomy { (2) `class` = "Reptilia" (3) } } 1 Defines a module property named tortoise. Its value is an object that amends dodo. Note that the amended object must be enclosed in parentheses. 2 Object property tortoise.taxonomy amends dodo.taxonomy. 3 Object property tortoise.taxonomy.class overrides dodo.taxonomy.class. As you can see, it is easy to construct a new object that overrides selected properties of an existing object, even if, as in our example, the overridden property is nested inside another object. If this way of constructing new objects from existing objects reminds you of prototypical inheritance, you are spot-on: Pkl objects use prototypical inheritance as known from languages such as JavaScript. But unlike in JavaScript, their prototype chain cannot be directly accessed or even modified. Another difference is that in Pkl, object properties are late-bound. Read on to see what this means. Amends declaration vs. amends expression The defining objects and amending objects sections cover two notations that are both a form of amending; called an amends declaration and an amends expression, respectively. pigeon { (1) name = "Turtle dove" extinct = false } parrot = (pigeon) { (2) name = "Parrot" } 1 Amends declaration. 2 Amends expression. An amends declaration amends a property of the same name if the property exists within a parent module. Otherwise, an amends declaration implicitly amends Dynamic. Another way to think about an amends declaration is that it is shorthand for assignment. In practical terms, pigeon {} is the same as pigeon = (super.pigeon) {}. Amending object bodies can be chained for both an amends declaration and an amends expression. pigeon { name = "Common wood pigeon" } { extinct = false } (1) dodo = (pigeon) { name = "Dodo" } { extinct = true } (2) 1 Chained amends declaration. 2 Chained amends expression ((pigeon) { …​ } { …​ } is the amends expression). Late Binding Let’s mov'
