title = "User Manual :: Pkl Docs"
full_description = "User Manual Quick Links: Installation | Language Reference | Standard Library Pkl — pronounced Pickle — is an embeddable configuration language which provides rich support for data templating and validation. It can be used from the command line, integrated in a build pipeline, or embedded in a program. Pkl scales from small to large, simple to complex, ad-hoc to repetitive configuration tasks. Introduction Why we created Pkl and what it can do for you. Language Get to know the language and standard library. Bindings Libraries for embedding Pkl into general-purpose languages. Tools CLI, Gradle plugin, code generators, and other tools. Examples Ready-to-go examples with full source code. Release Notes What’s new in each release. Introduction"
