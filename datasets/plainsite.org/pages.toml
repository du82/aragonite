["https://plainsite.org/cases/index.html"]
title = "PlainSite ::  Court Cases and Agency Dockets"
description = "PlainSite's most popular and newsworthy cases from across the United States court system."
full_description = "Case Summary: Nigerian President-Elect Bola Ahmed Tinubu was named as the owner of several bank accounts that were used to launder money for a heroin distribution network in Chicago, IL in the early 1990s. The members of the heroin ring were criminally charged in a separate case, Northern District of Illinois Case No. 2:92-cr-00113-RL. For unknown reasons, Tinubu was not. Instead, the U.S. Government seized the contents of the bank accounts based on several different seizure warrants across three different dockets, of which this is one. The other two, from 1992, are in the Southern District of New York and a separate docket in the Northern District of Illinois—both with unknown case numbers since the documents pre-date the federal court's PACER system by so many years. In total, about $2.4 million USD was seized from Tinubu's global bank accounts pursuant to these seizure warrants. While working for Mobil Oil Company in Nigeria, Tinubu used a variety of shell companies to move the money around, including Compass Finance & Investment Co., incorporated in Washington, D.C. Though he was not charged, Tinubu committed at least five federal crimes, according to the IRS Special Agent's affidavit in this case: 1) Money laundering (18 U.S.C. § 1956); 2) Using funds from unlawful activity (18 U.S.C. § 1957); 3) Bank fraud (18 U.S.C. § 1344); 4) Failure to file tax returns (26 U.S.C. § 7203); and 5) Lying to federal agents (18 U.S.C. § 1001). Tinubu was elected to be the next President of Nigeria in February 2023. Case Summary: This is a general administrative docket used by the New Jersey District Court to post new complaints. It's not actually a real lawsuit. Case Summary: The heart of my case is that Tesla, Inc. illegally terminated me in violation of the FEHA and well-established public policy. More specifically, Tesla illegally fired me for the following reasons: 1) I have a disability (ASD and hypertension that required emergency care). 2) I requested accommodations and unilaterally attempted to engage in a good faith interactive process and was denied. 3) I am an older person. I was almost 62 years old when I was illegally fired. I was replaced immediately (3-days-later) by a software engineer who was approximately half my age. Coworkers made comments about my age and indicated that I was an “old man.” 4) I complained that Rollins and my co-workers were engaging in sexual harassment and offensive communications referring to their penis sizes on Tesla’s communications network. Also, sexual videos of women twerking were placed in the team’s chat that displayed women’s breasts. Reporting was required by Tesla’s own Sexual Harassment and Bullying Training Program. 5) I was forced to open a workers’ compensation case for injuries I sustained as a result of work. I was awarded $45,000 for this claim. 6) Moreover, I was fired because I engaged in whistleblowing regarding sexual harassment, sabotage, and other security issues. Whistleblowing is a protected activity."
