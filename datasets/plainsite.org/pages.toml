["https://plainsite.org/about/index.html"]
title = "About PlainSite"
full_description = "In addition to making huge volumes of data accessible to the public free of charge, PlainSite lets ordinary citizens impact the law-making process. Our issues section allows members and anonymous users to identify a problem, optionally propose a solution to it, and easily specify the changes to the statutes or regulations necessary to implement the solution. Other users can then indicate their support of a proposed solution, allowing a critical mass to form behind beneficial changes to the law that legislators cannot ignore. Professionals such as lawyers and government officials can also benefit from the PlainSite Pro features that provide additional insight into the legal system in near-real-time. PlainSite started out as a joint venture of Think Computer Corporation and Think Computer Foundation. Today, it is operated solely by Think Computer Corporation."
