full_description = "We’re a passionate team that likes hard problems, breaks world records, and strives to make an impact every day. In 2009, we set out to image the entire world every day. Nine years and almost 200 satellites later, we’ve released a geospatial platform, achieved daily, global imaging capacity, and are hard at work analyzing our data to deliver insights. These are the types of challenges that get us excited and we’re looking for colleagues who share our passion. We’re committed to building a community where everyone belongs and invite people from all backgrounds to apply..css-161surq{width:auto;display:inline-block;margin-top:20px;max-width:360px;} We are a community that is less about what you get, and more about what you give. We have a culture of generosity, responsibility and intentionality, towards each other and towards the planet. Most of all, we are a community dedicated to solving tough problems and being a voice for our planet. © 2025 Planet Labs PBC. All rights reserved. .css-1hfdhkj{display:inline;}@media screen and (min-width: 62em){.css-1hfdhkj{display:none;}}.css-2fp6dw{display:none;}@media screen and (min-width: 62em){.css-2fp6dw{display:inline;}}| .css-wyy2y{transition-property:var(--chakra-transition-property-common);transition-duration:var(--chakra-transition-duration-fast);transition-timing-function:var(--chakra-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:inherit;}.css-wyy2y:hover,.css-wyy2y[data-hover]{-webkit-text-decoration:none;text-decoration:none;}.css-wyy2y:focus-visible,.css-wyy2y[data-focus-visible]{box-shadow:var(--chakra-shadows-outline);}.css-1tux4w9{transition-property:var(--chakra-transition-property-common);transition-duration:var(--chakra-transition-duration-fast);transition-timing-function:var(--chakra-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underli