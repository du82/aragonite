["https://www.planet.com/pulse/planet-releases-analysis-ready-planetscope-product-for-time-series-analysis-and-machine-learning-models"]
title = "Planet Releases Analysis-Ready PlanetScope Product for Time-Series Analysis and Machine Learning Models"
full_description = ".css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}TechPlanet Releases Analysis-Ready PlanetScope Product for Time-Series Analysis and Machine Learning Models.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Planet Labs PBC.css-1jjwf1f{margin-left:0px;}October 21, 2024•3 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Tech.css-1vz2rsl{background:var(--chakra-colors-white);}Tech.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}Today, we’re thrilled to release Analysis-Ready PlanetScope (ARPS). ARPS harnesses a cutting-edge proprietary algorithm to create harmonized and spatially consistent near-daily stacks of images that enable time-series analysis and machine learning applications.ARPS normalizes data from PlanetScope’s daily 3m imagery by reducing inconsistencies between captures. It then harmonizes that data with temporally and spatially consistent third-party sources (like Landsat, Sentinel-2, MODIS, and VIIRS) to produce a pre-processed stack of imagery. The result is a more precise dataset that’s readily-available for manipulation, analysis, and visualization in the Planet Insights Platform.While PlanetScope data enables timely investigations and real-time decision-making, ARPS is optimized for temporal analysis that takes the past into account and ensures accurate measurements for changes over a long period within an area of interest. Its consistency and customization means users spend less time formatting data and more time analyzing how it’s changing.Comparison of Analysis-Ready PlanetScope to PlanetScope Surface Reflectance Scenes. Analysis-Ready PlanetScope shows improved radiometric consistency over time and spatially-composite PlanetScope Scenes yield more complete coverage over AOIs.“Government entities and commercial customers alike often utilize satellite data and machine learning algorithms to manage large areas of land,” said Troy Toman, Planet’s Chief Product Officer. “But current models are often built with data that is inconsistent, misaligned with third-party sources, or require extensive time to prepare. ARPS solves this challenge by streamlining data for analysis and is the latest offering in a suite of products that empower users to get the most from their AI and ML models.”ARPS is a critical tool for Planet users seeking ways to manage large areas of land more efficiently. For civil government agencies that monitor and enforce regulations of natural resources, ARPS enables them to detect deviations such as unauthorized pesticide use or deforestation and intervene expediently. For agricultural operations, ARPS can provide accurate and timely information on vegetation health, irrigation needs, and invasive species detection. In forestry, companies leveraging ARPS can better estimate biomass, conduct post-fire recovery assessments, and monitor carbon stocks.“Analysis-Ready PlanetScope has had a tremendous impact on our product,” said Joaquin Peraza, CTO at Oryzativa. “We significantly reduced our error-rate percentage on biomass growth modeling after moving to ARPS from Landsat and Sentinel data, and we’re excited to continue using ARPS to help improve the accuracy of our models.”In a rapidly changing, data-saturated world, tools that help separate the signal from noise are more important now than ever. With ARPS integrated into the Planet Insights Platform, stakeholders have an accessible, near-daily way to analyze the relevant changes that matter to them over time all in one place.Learn how ARPS helps solves challenges facing data scientists and image analysts in this Agile EO webinar.Tags:#artificial intelligence#earth observation#machine learning#planet#planet labs#PlanetScope#satellite data#satellite imagery.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gxme{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}.css-xwnvlj{font-family:var(--chakra-fonts-heading);font-weight:var(--chakra-fontWeights-bold);color:var(--chakra-colors-white);font-size:36px;margin-bottom:0px;padding-top:0px;line-height:1;}Ready to Get Started.css-9hslri{font-size:24px;line-height:1.2;font-weight:300;color:rgba(255, 255, 255, 0.87);}Connect with a member of our Sales team. We'll help you find the right products and pricing