title = "Forest Carbon: Reliable, Scalable Carbon Estimates | Planet"
description = "Forest Carbon offers high quality, accessible, and consistent data on global forest change."
full_description = "Forests play a critical role in absorbing vast quantities of carbon dioxide, but high-fidelity estimates of the carbon they store are costly and impractical at scale. Our Forest Carbon data is designed to solve these challenges. Forest Carbon is a global dataset of aboveground forest carbon, tree height, and canopy cover estimates to easily analyze every hectare of forest and woodland, anywhere on Earth. Cutting-edge machine learning models fuse a rich archive of historical satellite observations with high-quality, laser-derived reference data to enable carbon project accounting, digital MRV, reforestation, and deforestation monitoring. Monitor the complete spectrum of forest change, from million-acre wildfires to small agricultural clearcuts to single large tree selective harvests. Developed with cutting-edge deep learning models and validated with high-quality air- and spaceborne laser reference data. A globally complete dataset and transparent pricing that supports analysis at all scales and reduces the need for field measurements or airborne surveys. Forest Carbon is a global solution. You can understand changes to the forests and woodlands you care about, no matter where they are. Track forests and forest carbon stocks across entire regions and within specific localities, all the way down to discrete parcels of land and even individual trees. Global coverage and tree-scale data removes the burden of needing to travel to remote locations and conduct field measurements or airborne surveys. Trees absorb carbon dioxide and store it as carbon in their biomass. Our dataset quantifies Forest Carbon, Canopy Height, and Canopy Cover anywhere trees grow on Earth. Comparing discrete parcels of land to regional baselines can help carbon project offset developers maximize their impact by understanding carbon dynamics without the need for expensive airborne or field measurement campaigns. Comparing discrete parcels of land to regional baselines can help carbon project offset developers maximize their impact by understanding carbon dynamics without the need for expensive airborne or field measurement campaigns."
