title = "From Satellite Data to Actionable Insights: Predicting Hay Yield for North Dakota with Planetary Variables"
full_description = ".css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}TechFrom Satellite Data to Actionable Insights: Predicting Hay Yield for North Dakota with Planetary Variables.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Stephanie Gijsbers.css-1jjwf1f{margin-left:0px;}January 23, 2025•5 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Tech.css-1vz2rsl{background:var(--chakra-colors-white);}Tech.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}Authors: Thomas Frederikse & Stephanie GijsbersThe ability to predict crop yields is essential for optimizing agricultural productivity, managing food security, and streamlining supply chain operations. Traditional forecasting methods often struggle with limited and inconsistent data, making it difficult to establish reliable long-term correlations. Satellite data, however, provides a baseline of reliable and near-daily data to measure ground conditions that influence crop growth.Planetary Variables are built on Planet’s robust, global, and high resolution satellite constellations to provide analysis-ready insight into a multitude of crucial ground conditions, including Soil Water Content (SWC), Land Surface Temperature (LST), and Vegetation Optical Depth (VOD). These near-real-time measurements can be directly used to predict crop growth and yield. SWC is a direct measurement of the amount of water available to plants, while LST provides insight into the heat stress affecting plant growth. VOD is an indicator of the amount of water in the vegetation, and reflects plant health.To move from high-level data to actionable insights, we’ve created an example Jupyter notebook to investigate SWC, LST, and VOD as potential hay-yield predictors in North Dakota..css-11m1pet{font-size:0.8em;color:var(--chakra-colors-gray-500);}Figure 1: Most of the of North Dakota is indeed covered by farm- and grassland, and we only see a few densely-vegetated and urban areasIn the notebook, we first examined the relationship between annual hay yield and key variables SWC, LST and VOD (averaged per year), see figure 2 and 3. The results showed a strong correlation between higher SWC and increased hay yield. For instance, during the drought years of 2017 and 2021, low SWC levels clearly coincide with significantly reduced yields. However, SWC alone did not account for all variations, as similar SWC levels in 2017 and 2021 coincided with notably lower yields in 2021. Further analysis revealed that heat stress, captured by LST, played a significant role in 2021, where elevated LST values exacerbated the drought’s impact. Additionally, VOD trends closely mirrored hay yield, underscoring its utility as a key indicator of plant health and productivity. These relationships are visually depicted in Figures 2 and 3, demonstrating the influence of SWC, LST, and VOD on hay yield.Figure 2: Annual Hay Yield vs. Average Soil Water Content over the growing season in North Dakota (2013-2023)Figure 3: Annual Hay Yield vs. Average Annual Land Surface Temperature and VOD in North Dakota (2013-2023)We now have three variables that show a very similar pattern as the yield: SWC, LST and VOD. To quantify the relationship between these variables and hay yield, we calculated correlation coefficients. The stronger the correlation between two time series, the more similar their patterns. For our analysis, we used both Pearson and Spearman correlation coefficients.Table 1: Pearson and Spearman correlationsThe high positive Pearson and Spearman correlations for SWC (0.853 and 0.800, respectively) indicate a strong link between soil water content and hay yield. LST shows a negative correlation with yield, suggesting that higher heat stress (as captured by LST) is detrimental to crop growth, especially during drought periods. VOD, while correlated with yield, shows a weaker relationship compared to SWC.Then we go a step further by showing how to build a model that combines all Planetary Variables to see how they can predict yield. To build the model, we first collected and cleaned the historical data for LST, SWC, VOD and hay yield from 2013 to 2023. We averaged the data per year and made sure it was consistent for analysis. We also adjusted the variables to account for seasonal differences to help the model learn better. We started with a linear regression model as a baseline, but also tested more complex models like random forests and gradient boosting. The model was trained on the historical data (except for a part used for validation). After refining the model by tuning its parameters, we used it to predict the 2024 hay yield (for which we don’t have the yield yet) .Figure 4: Actual yield versus forecasted yield from 2013 to 2023While our analysis helps us better understand how these variables can predict yields and improve yield models, and serves as a starting point for future testing to increase the reliability of the regression. For those interested in exploring this methodology further or experimenting with the data themselves, we invite you to check out the Jupyter notebook we created, which details the full analysis. If you are interested in testing our data, please don’t hesitate to reach out!About Planet Labs PBCPlanet is a leading provider of global, daily satellite imagery and geospatial solutions. Planet is driven by a mission to image the world every day, and make change visible, accessible and actionable. Founded in 2010 by three NASA scientists, Planet designs, builds, and operates the largest Earth observation fleet of imaging satellites. Planet provides mission-critical data, advanced insights, and software solutions to over 1,000 customers, comprising the world’s leading agriculture, forestry, intelligence, education and finance companies and government agencies, enabling users to simply and effectively derive unique value from satellite imagery. Planet is a public benefit corporation listed on the New York Stock Exchange as PL. To learn more visit www.planet.com and follow us on X (formerly Twitter).Tags:#earth observation#EO#land surface temperature#planet#planet labs#planetary variables#satellite data#satellite imagery#soil water content#vegetation optical depth.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gx