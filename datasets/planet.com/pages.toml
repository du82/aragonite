title = "PSAI: Transforming Global Monitoring with Planet Data"
full_description = '''.css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}StoriesPSAI: Transforming Global Monitoring with Planet Data.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Ariana Sexton.css-1jjwf1f{margin-left:0px;}November 7, 2024•3 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Stories.css-1vz2rsl{background:var(--chakra-colors-white);}Stories.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}In an ever-evolving world, understanding behavioral and environmental patterns on a global scale is essential for making informed decisions. PSAI is at the forefront of this transformation, leveraging advanced artificial intelligence (AI) and satellite imagery to provide real-time insights that drive meaningful change in national security, human rights, and environmental conservation.Revolutionizing Global Monitoring with AI and Satellite DataPSAI’s mission is to reshape how governments, organizations, and industries interpret complex data. By continually monitoring vast geographical regions using a range of commercially available data sources, they enable real-time decision-making that can have immediate and significant impacts.Michael Kelly, Director of Operations at PSAI, emphasizes the importance of their partnership with Planet, "We could not do what we do without Planet, specifically PlanetScope data. This allows us to monitor for daily change, and no other provider can provide that. Planet excels in this area."Spotlight on National Security: Predicting the UnpredictableOne of PSAI's most notable achievements is its ability to detect early signs of significant geopolitical events. In the lead-up to the Russian invasion of Ukraine, PSAI’s SPOTLIGHT monitoring solution, powered by Planet’s daily satellite imagery, identified unusual activity in Russian industrial and military complexes. "Our AI established a baseline of what normal activity looked like… We saw an uptick in activity at ports and other industrial areas that led us to believe that change was happening," Kelly recalls.This early detection was crucial in understanding and responding to the situation. PSAI’s ongoing monitoring, in collaboration with the U.S. State Department’s Conflict Observatory, has tracked the daily destruction of over 700,000 buildings across Ukraine, providing invaluable data for international response efforts.Expanding Horizons: Beyond Conflict MonitoringFollowing their work in Ukraine,PSAI has broadened its focus, applying their technology to various sectors, continuing to push the boundaries of what’s possible with satellite data."We can detect everything from vegetation encroachment and on power supply areas, looking at oil pipeline, security and safety, looking at reservoir and dam and physical infrastructure, maintenance, whether there are leaks detected. We can do all of that with PlanetScope data, which is incredible,” says Kelly.A Partnership Built on InnovationThe partnership between PSAI and Planet is not just about technology; it’s about collaboration and shared vision. "Working within this partnership model has put us in direct partnership with other Planet partners, creating a symbiosis that wouldn’t otherwise exist," Kelly explains. "We appreciate Planet’s investment in the partnership program because it provides us the confidence and ability to do our work — our best work. And we know we are more powerful together than we could ever be alone."As PSAI continues to innovate and expand its capabilities, the synergy between their advanced AI and Planet’s satellite imagery will remain at the core of their efforts to drive change across the globe.Watch the accompanying video to hear more from Michael Kelly on how this partnership is making a difference.Tags:#aerospace#Agile aerospace#earth observation#EO#government#intelligence#newspace#planet#planet labs#Satellite#satellite data#satellite imagery.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gxme{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}.css-xwnvlj{font-family:var(--chakra-fonts-heading);font-weight:var(--chakra-fontWeights-bold);color:var(--chakra-colors-white);font-size:36px;margin-bottom:0px;padding-top:0px;line-height:1;}Ready to Get Started.css-9hslri{font-size:24px;line-height:1