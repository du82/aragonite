title = "Maritime and Marine Imagery from Planet Satellite Solutions | Planet"
description = "A strategic satellite overview of the Earth’s oceans, seas, and coastline, and marine imagery delivered directly to you by Planet."
full_description = "Planet delivers a comprehensive view of the Earth’s strategic waterways and coastlines directly to your desk. Planet’s satellite solutions provide unmatched coverage of the Earth’s waters. Government bodies, coast guards, border security, and environmental agencies can leverage Planet products to monitor ports and coastlines, detect and track vessels, and uncover suspicious activity in contested waters. Satellite data provides maritime intelligence remotely, reducing the necessity for location-based surveying and giving insight into the movement of vessels in remote or difficult to reach areas at sea. We currently image a variety of open water areas around the world including the South China Sea, Persian Gulf, Mediterranean Sea, and other maritime areas of interest. Utilize Planet’s Vessel Detection Feed to automatically monitor ports and coastlines across the globe at 3.7-meter resolution. Leverage Planet’s satellite imaging and data analysis to detect maritime vessels, observe dark activity, protect against spoofing, and validate the AIS data of vessels. Planet’s high cadence satellite monitoring and data analysis provides a consistent and complete overview of activity across your waters, ports, and coastlines. Through daily imaging, the nature and frequency of activity can be ascertained and responded to promptly. Planet provides geospatial data and satellite imagery for the monitoring of maritime areas through an easy-to-use, cloud-based system. .css-1o5spur{display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;-webkit-appearance:none;-moz-appearance:none;-ms-appearance:none;appearance:none;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:relative;white-space:bre