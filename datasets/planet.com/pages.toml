["https://planet.com/pulse/impact-observatory-leverages-planet-data-and-ai-to-deliver-insights-to-u-s-local-and-national-government"]
title = "Impact Observatory Leverages Planet Data and AI to Deliver Insights to U.S. Local and National Government"
full_description = '''.css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}StoriesImpact Observatory Leverages Planet Data and AI to Deliver Insights to U.S. Local and National Government.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Ariana Sexton.css-1jjwf1f{margin-left:0px;}October 10, 2024•3 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Stories.css-1vz2rsl{background:var(--chakra-colors-white);}Stories.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}Traditionally, identifying patterns of change on land has been expensive, complex, and labor-intensive, making it difficult to scale to the vast amount of available satellite imagery. To address this challenge, Planet partner Impact Observatory has developed AI-powered geospatial monitoring tools that help decision-makers understand risks and anticipate changes at unprecedented speed and scale."Impact Observatory works with the U.S. government and with state and local governments, to help them understand the threats and risks of climate change and natural disasters," said Steve Brumby, CEO of Impact Observatory. "Planet data provides a unique capability to understand how the world is changing and allow people to anticipate the worst effects and plan to intervene in time to help save lives."Beyond disaster response, Impact Observatory also monitors a growing range of land cover types to provide insights into defense and intelligence, urban development, natural resource management, and agriculture. Their land cover solution, IO Monitor, detects change and patterns that enable data-driven decisions with an up-to-date understanding of any place on Earth.Situational Awareness Powered by Living MapsHuman populations and vegetation states are constantly changing and moving. Impact Observatory provides ground teams with living maps that help them understand these changes. When natural disasters strike, access to the latest maps is invaluable for supporting humanitarian assistance and disaster relief operations."The U.S. government came to us and asked us for help making maps of the counties in Florida that were about to be hit by Hurricane Idalia," Brumby shared. "The official map of the United States, made by the federal government, is three years old. And a thousand people a day move to Florida.”.css-11m1pet{font-size:0.8em;color:var(--chakra-colors-gray-500);}Impact Observatory Cedar Key change mask reclassified following Hurricane Idalia. As emergency response teams mobilized to enter the areas where the Category 4 hurricane was expected to hit, they required accurate, up-to-date information about the situation on the ground, including human population counts and locations. National assets alone couldn't provide this data. Within 24 hours, Impact Observatory delivered a living map to the U.S. government, leveraging PlanetScope's approximately 3 m resolution imagery and AI. These living maps were crucial for confirming and prioritizing evacuation plans and search-and-rescue efforts.Impact Observatory Cedar Key change mask reclassified following Hurricane Idalia. A Partnership Empowering Global Decision-MakersThe partnership between Planet and Impact Observatory accelerates awareness and reduces response times for emergency situations and climate risks. It provides governments, non-profits, companies, and markets with clear, current sustainability and environmental risk analyses for any place on Earth.Impact Observatory continues to innovate, expanding their land-cover categories with PlanetScope imagery to give decision-makers the precise information they need, when they need it. "We use Planet imagery because, in our opinion, Planet is the first and the best space constellation for producing a picture of the world," Brumby emphasized.Watch the accompanying video to hear more from Steve Brumby on how this partnership is making a difference:Tags:#aerospace#Agile aerospace#earth observation#EO#Europe#government#newspace#planet#planet labs#Satellite#satellite data#satellite imagery.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gxme{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}.css-xwnvlj{font-family:var(--chakra-fonts-heading);font-weight:var(--chakra-fontWeights-bold);color:var(--chakra-color