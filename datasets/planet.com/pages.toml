title = "Mitigating Climate Change Through Carbon Monitoring Globally | Planet"
description = "Carbon Mapper’s groundbreaking, carbon monitoring, hyperspectral satellite constellation will accelerate action on climate change."
full_description = "To help accelerate action on climate change, Planet is a key partner in the .css-1gevqp{transition-property:var(--chakra-transition-property-common);transition-duration:var(--chakra-transition-duration-fast);transition-timing-function:var(--chakra-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--chakra-colors-planet-ui-teal-mid);font-weight:600;}.css-1gevqp:hover,.css-1gevqp[data-hover]{-webkit-text-decoration:none;text-decoration:none;}.css-1gevqp:focus-visible,.css-1gevqp[data-focus-visible]{box-shadow:var(--chakra-shadows-outline);}Carbon Mapper, a first of its kind public-private partnership consisting of a broad-based coalition of industry, government, philanthropies, and academic institutions working to identify and accelerate pathways to mitigate methane and carbon dioxide point source emissions over the critical next decade and beyond. With its partners, Planet is developing a first-of-kind satellite constellation and the cloud-based data infrastructure needed to detect global methane and carbon dioxide emissions precisely at the facility level. The satellites’ hyperspectral imaging sensor technology, pioneered by NASA Jet Propulsion Laboratory, is designed to provide comprehensive, accurate, and timely measurement of methane, carbon dioxide, and 25+ other environmental indicators that are needed to closely monitor the health of the planet. This critical data will be made freely available to industry and governments through open data portals, developed by Carbon Mapper Inc., and the California Air Resources Board, promoting the creation and adoption of tools that empower organizations to see, measure, and manage their impacts. Planet believes this will create a virtuous cycle – fueled by transparency – where industry, government, and research have aligned incentives to mitigate risk and make smarter decisions about planetary stewardship. Planet’s hyperspectral satellite constellation will help reveal social, environmental, and climate risks in unprecedented detail, powering a new generation of policy and innovative sustainable financial instruments."
