title = "From Satellite Data to Actionable Insights: How to Calculate Derived Root-Zone Soil Water Content (DRZSWC) Using Planet Insights Platform"
full_description = ".css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}InsightsFrom Satellite Data to Actionable Insights: How to Calculate Derived Root-Zone Soil Water Content (DRZSWC) Using Planet Insights Platform.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Stephanie Gijsbers.css-1jjwf1f{margin-left:0px;}December 13, 2024•3 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Insights.css-1vz2rsl{background:var(--chakra-colors-white);}Insights.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}How to go from satellite data to actionable insights: How to calculate root-zone soil water content from near-surface soil water contentContributors: Thomas Frederikse and Amber MulderUnderstanding soil moisture is essential for managing agricultural productivity, optimizing water resources, and tackling climate challenges. Planet Soil Water Content (SWC) data — part of our Planetary Variables portfolio —provides a consistent, long-term archive of near-surface moisture across globally distributed areas covering the first few centimeters of the soil. Additionally, our data is available in near real-time and is cloud-free, ensuring accurate insights regardless of weather conditions.This near-surface moisture is extremely useful, but many applications benefit from deeper insights — into the root zone, where plants actually draw water. Examples of such applications are improving crop growth models, refining irrigation practices, and enhancing rainfall-runoff models. By deriving root-zone moisture from satellite-observed near-surface SWC, we can unlock crucial insights tailored for agriculture, efficient water management, and climate-resilient practices..css-11m1pet{font-size:0.8em;color:var(--chakra-colors-gray-500);}Figure 1: A cross-section of the soil illustrating the variation in SWC within the top few centimeters. The upper layers of the soil are significantly wetter than those deeper down. Conversely, following an extended dry period, the situation may reverse, with the deeper soil becoming drier than the near-surface layer due to evaporation affecting the topsoil first.So, how exactly do we estimate root-zone soil water content from data that only covers the first few centimeters?The methodology is rooted in the relationship between near-surface and subsurface moisture. Essentially, while the near-surface layer responds quickly to rainfall and drying conditions, deeper soil layers change more slowly and retain water longer. By applying a temporal filter we can estimate how much of the near-surface moisture moves downward into the root zone over time. One effective method to achieve this is through an exponential filter, as detailed in the paper From near-surface to root-zone soil moisture using an exponential filter by Albergel et al. (2008).The time constant is critical because it defines how quickly moisture is transferred from the surface to the root zone; a shorter time constant reflects rapid moisture changes, while a longer one indicates slower, more gradual infiltration. The exponential filter combines past and present moisture data, allowing for a continuous estimation of root-zone soil moisture over time. The method has been validated against in-situ observations and model simulations, showing strong agreement between the derived soil water indices and reference root-zone moisture values.Figure 2: In the figure above, we show near-surface and root-zone soil water content in Iowa (USA), on a rainy day after a dry period. The surface has become wet (blue), while the deeper root zone is still dry (yellow) due to the long dry spell.Quick conversions steps on Planet Insights PlatformCalculating derived root-zone soil moisture is now simple with Planet Insights Platform. By utilizing custom scripts within the API requests, you can easily perform pixel-based calculations or combine different datasets. You have the option to analyze your own soil moisture data or use Planet’s free Sandbox data. You can apply the DRZSWC custom script, adjust the parameters, and you’ll quickly obtain your derived root-zone soil moisture data, ready for analysis or export. To get started with custom scripts, please refer to our tutorial.Tags:#earth observation#EO#planet#planet insights platform#planet labs#satellite data#satellite imagery#satellites#soil moisture#soil water content.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(