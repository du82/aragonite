title = "Satellite Imagery and Geospatial Solutions for the US Federal Government | Planet"
description = "Wi88ampth2 Planet satellite imagery, governments can make timely, data-driven decisions to ensure safer communities and to gain greater visibility over natural resources."
full_description = "Planet Federal equips US Federal Civilian Agencies, the Department of Defense, and Intelligence Community with real-time satellite data and intelligence required to monitor and respond to global changes. Planet designs, builds, and operates the largest commercial constellation of imaging satellites globally, and provides medium and high-resolution images of the Earth’s landmass, daily. Uniquely tailored to meet the needs of the US Government, Planet Federal provides access to this comprehensive suite of information. As geospatial and technological landscapes evolves, so too does the intelligence and imagery requirements of the US Federal Government. Leverage Planet’s actionable data and comprehensive remote sensing imaging of the world, to inform critical decisions, strengthen intelligence assessments, and monitor areas of interest in remote or difficult to reach regions. With Planet Federal, US Government bodies have access to remote sensing technology and information, a visual archive, and PlanetScope’s high cadence monitoring system which provides 3.7 meter resolution images in four multispectral color bands: RGB and Near Infrared. On September 14, 2019, drones were used to attack the state-owned Saudi Aramco oil processing facilities at Abqaiq in eastern Saudi Arabia. PlanetScope imagery captured Smoke billowing from facility shortly after the attack. On September 14, 2019, drones were used to attack the state-owned Saudi Aramco oil processing facilities at Abqaiq in eastern Saudi Arabia. PlanetScope imagery captured Smoke billowing from facility shortly after the attack. With Planet’s high cadence, high-resolution satellite solutions and image archive, observe daily operations, identify change as it happens, monitor patterns, discern trends, and combat threats in a timely manner. This sub-meter SkySat image shows the newly repaired runway at Palmyra Airport on August 8, 2017, after the facility was re-captured by Syrian government forces. Eight Syrian Arab Air Force L-39 Albatros ground attack aircraft are also identifiable."
