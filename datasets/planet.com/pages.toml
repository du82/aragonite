title = "Taking Inspiration From Gandhi: Using Satellite Data for Good"
full_description = ".css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}StoriesTaking Inspiration From Gandhi: Using Satellite Data for Good.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Janeth Fule.css-1jjwf1f{margin-left:0px;}October 1, 2024•3 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Stories.css-1vz2rsl{background:var(--chakra-colors-white);}Stories.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}Every year on October 2nd, India celebrates Gandhi Jayanti, honoring the birth of Mahatma Gandhi, a global icon of nonviolent resistance. As one of India's three national holidays, this day marks his legacy in advancing peace and social equity. His influence transcends time, and the United Nations established the “International Day of Non-Violence” in his memory.In recognition of Gandhi’s contributions to humanity, we explored how the Planet data can support his vision in modern times.Inclusive Development in a Changing WorldGandhi strongly advocated for self-sufficiency and rural development in India. He led the Khadi movement, encouraging locals to produce and wear locally-made clothes. Rooted in the principles of empowering rural communities and fostering self-reliance, the movement gained national support.At present, Khadi is still worn and celebrated across the country and recognized around the world as part of India’s rich cultural heritage. It is but one of the lasting legacies of Gandhi. He may have lived in a time before satellite imagery, but its advanced capabilities can make his vision of a sustainable and inclusive India a reality. As the world’s most populous nation facing the challenges of economic growth and the threat of climate change, its natural resources have been put under strain.The ancient city of Bhubaneswar is experiencing rapid urbanization, but growth has brought with it land encroachment activities. This issue poses a serious threat to the preservation of biodiversity, undermines government revenue, and prevents sustainable planning. In response, the Odisha Space Application Centre (ORSAC) collaborated with Vassar Labs to leverage Planet data for the early detection and prevention of illegal government land use. The partnership gave birth to the Bhubaneswar Land Use Intelligence System (BLUIS). Since its launch, BLUIS has identified over 300 potential encroachments, significantly saving the government time and resources for land monitoring and management. By preventing illegal land use, the government successfully safeguarded environmentally sensitive areas, including forests, wetlands, and water bodies.Agriculture, an industry that heavily relies on natural resources, especially water, also provides livelihoods to millions of India’s rural residents and generates significant export revenue. A key challenge is tackling crop stress, a common farming issue which directly impacts yield productivity. In response to this problem, Agribridge, an India-based agriculture company, developed a system to detect early signs of crop stress without human intervention. Access to this crop-level insight which uses Planet data helps local farmers take proactive measures to maximize harvest potential.These two examples are just a glimpse into the countless ways in which Planet data has empowered and enhanced initiatives. When it comes to understanding Earth's dynamic landscape, our multidimensional insights can help address present-day challenges such as biodiversity conservation, land use mapping, and precision agriculture, while also supporting government programs and policies to further Gandhi’s legacy of promoting sustainable and inclusive development.As we further explore how Planet can support your specific initiatives, we invite you to join the upcoming Planet Webinar Series: Gov Insights to gain more insights into these important topics.Tags:#aerospace#Agile aerospace#earth observation#EO#government#newspace#planet#planet labs#Satellite#satellite data#satellite imagery.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gxme{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}.css-xwnvlj{font-family:var(--chakra-fonts-heading);font-weight:var(--chakra-fontWeights-bold);color:var(--chakra-colors-white);font-size:36px;margin-bott