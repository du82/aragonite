description = "Planetary Variables provide continuous and scientifically rigorous data to measure the changing conditions on Earth."
full_description = "Drawing on observations from Planet’s satellites and the broader Earth observation ecosystem, Planetary Variables™ deliver continuous, scientifically rigorous data that measures the changing conditions of the surface of the Earth. Earth’s hydrological and biological systems shift on a daily basis with immense complexity. Satellite data from Planet can help track some of the vital characteristics that define the health of our world, including water, vegetation, temperature, and forest carbon. Planetary Variables render complex earth observation data from a range of constellations into actionable measurements, nearly everywhere on the Earth’s landmass. Powered by state-of-the-art remote sensing techniques and honed by a team of award-winning scientists, Planetary Variables provide users robust measurements of the Earth’s surface. Make better decisions across a range of industries with tools powered by consistent observations and backed by an archive that spans decades. Planetary Variables data products are based on the scientific expertise of industry-leading remote sensing scientists. Our team develops advanced algorithms that process satellite data from Planet and from public constellations to produce information that is usable without the need for extensive data cleaning and processing. Data sources from across the electromagnetic spectrum, including optical, radar, passive microwave, and lidar sensors, reveal different aspects about the physical properties of earth. By fusing these distinct sources together, Planetary Variables unlock information about key characteristics about the Earth. Our .css-wyy2y{transition-property:var(--chakra-transition-property-common);transition-duration:var(--chakra-transition-duration-fast);transition-timing-function:var(--chakra-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:inherit;}.css-wyy2y:hover,.cs