["https://www.planet.com/pulse/neo-and-planet-revolutionizing-agricultural-monitoring-in-the-eu"]
title = "NEO and Planet: Revolutionizing Agricultural Monitoring in the EU"
full_description = '''.css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}StoriesNEO and Planet: Revolutionizing Agricultural Monitoring in the EU.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Shelby Parks.css-1jjwf1f{margin-left:0px;}October 3, 2024•4 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Stories.css-1vz2rsl{background:var(--chakra-colors-white);}Stories.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}The European Union's Common Agricultural Policy (CAP) is a critical framework designed to support and improve the agricultural sector across member states. However, the CAP's requirements pose significant challenges, particularly in the area of remote sensing-based Area Monitoring Systems (AMS). Netherlands Geomatics & Earth Observation B.V. (NEO), a Planet partner, is addressing these challenges head-on, leveraging the Planet Insights Platform to enhance compliance with CAP requirements.NEO's Mission and Partnership with PlanetNEO, a leading provider of information services for continuous monitoring of geo-objects, has been at the forefront of agricultural monitoring for over 25 years. Their expertise in geo-data management and innovative use of technology has enabled them to support nationwide monitoring efforts in countries like the Netherlands and Ireland."At NEO, our goal is to monitor all objects visible from the skies," said Henk Janssen, Project Manager and Consultant for Earth Observation and Geomatics at NEO. "Specifically, we focus on agricultural parcels to support national paying agencies in monitoring subsidy applications from farmers.”One of the primary challenges faced by NEO is the need for high-resolution, frequent data to monitor agricultural activities accurately. Through CAP, financial incentive programs support farmers in their transition towards sustainable and efficient farming practices through verified payout schemes. However, traditional reliance on Sentinel-2 satellite data has proven inadequate for verification and monitoring smaller fields and narrow land parcels, which make up a significant portion of CAP-eligible hectares. This is where the partnership between NEO with Planet comes into play.The Challenge of Implementing CAPOriginally established in 1962, the CAP is a cornerstone of the EU's efforts to support and improve the agricultural sector. With €58 billion allocated towards it in 2021, the CAP represents the largest share of the EU budget. The policy aims to strengthen the EU agricultural economy and improve productivity across 174 million agricultural hectares.Since 2018, the CAP has been undergoing a modernization process aligned with the EU Green Deal, aiming to tackle climate change through sustainable management practices and the adoption of digital technologies. National authorities have traditionally relied on Sentinel-2 satellite data for the verification of these practices, but the limitations of this data in terms of resolution and cadence have posed significant challenges.NEO's Innovative Approach with Planet Insights PlatformNEO's expertise in remote sensing has been instrumental in preparing for the AMS implementation. They have led several successful projects, including the Proof of Concepts in the Netherlands and operational implementation support in Denmark from 2018 - 2020. Currently, NEO is leading the setting up and running of the Dutch AMS and is a project partner in the AMS implementation in Ireland.The Planet Insights Platform has been a game-changer. NEO uses Planet Insights Platform to generate spatially aggregated time series data – a key ingredient for further analysis. Time series data is integrated into NEO's proprietary logic for monitoring agricultural parcels, enabling nationwide analyses of all agricultural parcels in just days.High resolution satellite data along with improvements in data processing have led to more meaningful insights about both small and large farms nationwide. By utilizing Planet tools to generate parcel-aggregated time series data, NEO helped the Netherlands Enterprise Agency (RVO) increase the number of monitored fields by 25% compared to Sentinel-2 data and expand the number of monitored parcels from 650,000 to 1 million."The Planet datasets are crucial for us because they fill the gaps left by Sentinel data sets," explained Janssen. "With a higher return time and the ability to identify activities on smaller and narrower parcels, we can monitor 25% more parcels and use twice as many images to fill our models."Additionally, the partnership with Planet has allowed NEO to deliver high quality results to the Dutch Paying Agency (NEA) that helps them to reduce the number of on-the-spot checks . This has streamlined the monitoring process, reducing administrative challenges and enabling more accurate reporting to the EU on subsidy spending."Our partnership with Planet has great value for us," said Janssen. "By combining our skills with Planet's capabilities, we can prepare for the future and scale up our competencies. This ecosystem approach is vital for building robust monitoring systems that can support the evolving needs of agricultural policy in the EU."Looking AheadAs NEO continues to innovate and expand its capabilities, their partnership with Planet will play a crucial role in their ongoing success. By leveraging advanced remote sensing technology and reliable data, NEO is helping national authorities comply with CAP requirements and support sustainable agricultural practices across the EU.Watch the accompanying video to hear more from Henk Janssen on how this partnership is transforming agricultural monitoring in the EU.Tags:#aerospace#Agile aerospace#agriculture#CAP#earth observation#EO#Europe#government#newspace#planet#planet labs#Satellite#satellite data#satellite imagery.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gxme{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}.css-xwnvlj{font-family:var(--chakra-fonts-heading);font-weight:var(--chakra-fontWeights-bold);color:var(--chakra-colors-white);font-size:36px;margin-bottom:0px;padding-top:0px;line-height:1;}Ready to Get Started.css-9hslri{font-size:24px;line-height:1.2;font-weight:300;color:rgba(255, 255, 255, 0.87);}Connect with a member of