title = "Abelio Leading the Transition to Sustainable Agriculture with Planet Insights Platform"
full_description = '''.css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}StoriesAbelio Leading the Transition to Sustainable Agriculture with Planet Insights Platform.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Ariana Sexton.css-1jjwf1f{margin-left:0px;}September 19, 2024•4 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Stories.css-1vz2rsl{background:var(--chakra-colors-white);}Stories.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}In the face of increasing food demand, larger farm sizes, tightening regulations, and limited resources, agricultural producers are under pressure to optimize every aspect of their operations. Abelio, a leader in precision agriculture in France, has developed a crop monitoring solution designed to empower farmers, cooperatives, and agricultural distributors with the tools they need to make informed, sustainable decisions. By gathering data from various reliable sources, including PlanetScope imagery, and applying powerful algorithms and AI models, Abelio generates time-sensitive insights that are critical during the short growing season..css-11m1pet{font-size:0.8em;color:var(--chakra-colors-gray-500);}Whether in the field or at the office, Abelio groups data together with an easy-to-use interface to optimize decision-making.One of the key challenges for farmers is managing the tight timelines dictated by plant growth cycles. Missing even a few days of data can lead to suboptimal decisions, especially during cloudy seasons. This is where Abelio's partnership with Planet comes into play. "Before partnering with Planet, farmers often had to rely on satellite imagery that was updated only every five days," explained Samuel Bonnard, Head of International Business Development at Abelio. "This meant that cloud cover could obscure the fields for up to two weeks, leaving farmers in the dark. With PlanetScope's near-daily imagery, we can provide the resolution and frequency needed to offer precise recommendations, helping farmers make timely decisions."Optimizing Nitrogen Use for Wheat CropsNitrogen is a vital nutrient for wheat crops, directly impacting crop yield and quality. However, excessive nitrogen use can harm the environment, leading to air and water pollution, soil degradation, and biodiversity loss. Abelio's solution addresses this issue by enabling farmers to apply nitrogen more precisely, reducing environmental impact while maintaining or even increasing crop yields. "Nitrogen accounts for 40% of the carbon footprint of a farm," Bonnard noted. "Our solution helps farmers reduce nitrogen use by 5-10% on average."Before Abelio's solution, farmers calculated the minimum amount of nitrogen in one field and would apply the same amount of nitrogen across all their fields, leading to inefficiencies and waste. Abelio's variable rate mapping approach allows farmers to tailor nitrogen application to the specific needs of each zone within a field. This saves money and prepares farmers for the Farm to Fork Strategy under the EU Green Deal that mandates a significant reduction in nitrogen use by 2030 and accelerates transition to a sustainable food system.Abelio helps customers provide the right dose of fertilizer with near-real time views of plots to help optimize yields and increase production.Early adopters of Abelio’s smart farming solution are already seeing positive results. A large corn producer in France reported a 96% satisfaction rate after using the service, with a 7% reduction in nitrogen use and a 5% increase in yield, translating to nearly 50 euros in additional profit per hectare.With the help of Planet's near-daily imagery and Planet Insights Platform, Abelio can quickly regenerate maps and provide farmers with up-to-date recommendations, optimizing yields, reducing nitrogen use, and helping to ensure compliance with environmental regulations.Streamlining Data Analysis with Planet Insights PlatformAbelio's evolution from a Planet customer to a partner highlights the growing importance of data in agriculture. By leveraging the Planet Insights Platform, Abelio has streamlined its data analysis process, becoming more efficient and productive. The platform allows Abelio to scalably process satellite data to train into its AI models, enabling the creation of precise agronomic models for biomass and chlorophyll content based on real-time field observations."Using Planet Insights Platform, we can retrieve satellite data from our customers' plots quickly and easily," explains Bonnard. "This API has allowed us to fully automate our service and run it in the cloud with a serverless architecture, significantly reducing our development time and costs."The collaboration with Planet has accelerated Abelio's ability to build and deploy solutions, providing their customers with a responsive, continuously available service that leverages the latest data to inform decision-making. Abelio currently supports customers in France, and is testing in Canada, Australia, and Spain to provide farmers around the world solutions to optimize their agricultural operations, reduce their environmental impact, and make farmers’ lives easier.Tags:#aerospace#Agile aerospace#earth observation#EO#government#newspace#planet#planet labs#Satellite#satellite data#satellite imagery.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gxme{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}.css-xwnvlj{font-family:var(--chakra-fonts-heading);font-weight:var(--chakra-fontWeights-bold);color:var(--chakra-colors-white);font-size:36px;margin-bottom:0px;padding-top:0px;line-height:1;}Ready to Get Started.css-9hslri{font-size:24px;line-height:1.2;font-weight:300;color:rgba(255, 255, 255, 0.87);}Connect with a member of our Sales team. We'll help you find the right products and pricing for your needs.css-328x68{display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;-webkit-appearance:none;-moz-appearance:none;-ms-appearance:none;appearance:none;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-user-select:none;-moz-user-select: