full_description = "Planet’s unified data and analytic products bring governments unprecedented visibility into regional change, helping transform operations and achieve policy and program goals. Planet delivers trusted and timely data that helps state and local governments design, monitor, and measure programs with speed and precision, improving transparency and accountability. Leverage high-frequency data and analytics to reduce the need for on-site inspections. Always-on monitoring and high-resolution tasking can help agencies optimize spend on data collection, including aerial flyovers. Automatically detect road and building changes, identify emerging hazards, and accelerate reporting and documentation workflows. Advanced analytics enables faster issue resolution across multiple teams. Scale monitoring capabilities, from statewide, county-wide, or dispersed parcels. Access a living archive of daily data to document changes to protected areas, working lands, and the built environment to empower data-driven decision making. The State of Alaska uses near-daily, high-resolution satellite imagery from Planet to improve collaboration across agencies and make informed decisions. In this NSGIC webinar, learn how data acquisition at the state level can break down silos and make data more widely available so governments can provide more transparent and responsive services. .css-1gevqp{transition-property:var(--chakra-transition-property-common);transition-duration:var(--chakra-transition-duration-fast);transition-timing-function:var(--chakra-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--chakra-colors-planet-ui-teal-mid);font-weight:600;}.css-1gevqp:hover,.css-1gevqp[data-hover]{-webkit-text-decoration:none;text-decoration:none;}.css-1gevqp:focus-visible,.css-1gevqp[data-focus-visible]{box-shadow:var(--chakra-shadows-outline);}Watch the Fireside Chat Planet statewide monitoring and analytics can help governments improve operational efficiency and achieve a wide variety of policy and program goals. Here is how agencies work with Planet and its partners today."
