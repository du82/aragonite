["https://planet.com/pulse/the-3d-approach-to-building-resilience-across-3-countries-data-driven-decision-making"]
title = "The 3D Approach to Building Resilience Across 3 Countries: Data-Driven Decision-Making"
full_description = ".css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}StoriesThe 3D Approach to Building Resilience Across 3 Countries: Data-Driven Decision-Making.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Janeth Fule.css-1jjwf1f{margin-left:0px;}September 20, 2024•4 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Stories.css-1vz2rsl{background:var(--chakra-colors-white);}Stories.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}Gone are the days when sustainability initiatives move at a snail’s pace, cost a fortune, and often with outdated onground data. Today, governments and private companies worldwide are integrating advanced technologies into their workflows, gaining unprecedented Earth insights with faster processing times—all without compromising quality.At Planet, we have long held the view that only when we uncover previously unseen changes on Earth can we take informed actions to drive meaningful changes. And it starts with local communities. They are at the forefront of these changes. With this in mind, we went directly to three cities in three countries in the Asia-Pacific to discuss with the frontliners of change, exchange insights, and bring ideas over for our common sustainability goals at our inaugural Planet Connect events in Tokyo, Hanoi, and Sydney.Highlights from Planet ConnectDiscussions at the Planet Connect Tokyo event were focused on Japan’s vulnerability to natural disasters—especially infrastructure-damaging earthquakes and unpredictable typhoons—that lead to ongoing challenges. Despite their world-class disaster management strategies, not having the right data at the right time can have devastating effects particularly when climate change starts catching up with these systems.The 2024 New Year’s Day earthquake in Wajima City, Ishikawa Prefecture left a tragic rubble. Within days after the 7.6 magnitude earthquake, The Asahi Shimbun published a Planet satellite imagery of the seaside town. According to the article, “The Geospatial Information Authority of Japan (GSI) analyzed the images and found the coastline in some areas in the bay had advanced about 200 meters offshore.”.css-11m1pet{font-size:0.8em;color:var(--chakra-colors-gray-500);}Left: Planet’s satellite imagery of the west coast line of Wajima Ishikawa Prefecture in Japan taken on March 2, 2022. © 2022 Planet Labs PBC. All Rights Reserved. Right: Planet’s satellite imagery of the west coast line of Wajima Ishikawa Prefecture in Japan taken on January 2, 2024. © 2024 Planet Labs PBC. All Rights Reserved.An accurate assessment of post-disaster areas, with the use of satellite imagery, can be crucial for recovery operations, efficient resource allocation, and mitigation planning for every emergency scenario.At Planet Connect Sydney, the New South Wales government shared the NSW Imagery Hub that they launched in July 2023. The NSW Imagery Hub is a multidimensional data platform supporting 2,000 users in over 149 NSW government agencies and local councils. We were privileged to have Anthony Young, Senior Remote Sensing Scientist in the Spatial Imagery Services Team of the Department of Climate Change, Energy, Environment and Water (DCCEEW) share how integrating Planet data into their system improved emergency response, recovery and biodiversity programs across civil agencies. Young, in his presentation during Planet Connect Sydney, noted the usability of the data that enabled one of their important partners, the State Emergency Service to “support themselves during weekends and public holidays when the Imagery Hub staff are not available.”Additionally, as a new member of the Space Industry Association of Australia (SIAA), we're excited to strengthen our collaboration with local government organizations in Australia. For nearly three decades, the SIAA has been the national representative organization of the country’s space and Earth observation community and we look forward to supporting more sustainability programs leveraging our broad area management capabilities.And finally, at Planet Connect Hanoi, as Stephen Green, Counselor for Commercial Affairs at the U.S. Embassy in Hanoi, noted in his opening remarks, “Commercial collaboration between the United States and Vietnam in the spirit of the bilateral Comprehensive Strategic Partnership announced in September 2023 is growing in an unprecedented manner and American companies like Planet are poised to make important contributions.” Inspired by solutions-oriented ministries and organizations, such as Vietnam’s Ministry of Public Security, we continuously look for more ways to collaborate and learn from regional governments to impact local initiatives.Planet Partner Nguyen Quang, Head of Geo Space Department, Vegastar.jpg moderating the Q&A session for Planet Connect | Hanoi © Vegastar. All Rights Reserved. Discover local perspectives on using satellite data for disaster management in Asia-Pacific in our newest webinar series, the “Planet Webinar Series: Gov Insights Episode 1 - Saving Lives, Protecting Communities: The Power of Satellite Data for Disaster Management”..css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gxme{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}.css-xwnvlj{font-family:var(--chakra-fonts-heading);font-weight:var(--chakra-fontWeights-bold);color:var(--chakra-colors-white);font-size:36px;margin-bottom:0px;padding-top:0px;line-height:1;}Ready to Get Started.css-9hslri{font-size:24px;line-height:1.2;font-weight:300;color:rgba(255, 255, 255, 0.87);}Connect with a member of our Sales team. We'll help you find the right products and pricing for your needs.css-328x68{display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;-webkit-appearance:none;-moz-appearance:none;-ms-appearance:none;appearance:none;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:relative;white-space:nowrap;vertical-align:middle;outline:2px solid transparent;outline-offset:2px;line-height:1.2;border-radius