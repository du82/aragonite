description = "Planet Insights Platform brings together Planet’s global daily Earth data, derived data products, and powerful cloud-based tools in one place."
full_description = ".css-wyy2y{transition-property:var(--chakra-transition-property-common);transition-duration:var(--chakra-transition-duration-fast);transition-timing-function:var(--chakra-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:inherit;}.css-wyy2y:hover,.css-wyy2y[data-hover]{-webkit-text-decoration:none;text-decoration:none;}.css-wyy2y:focus-visible,.css-wyy2y[data-focus-visible]{box-shadow:var(--chakra-shadows-outline);}Planet Insights Platform brings together Planet’s global daily Earth data, derived data products, and powerful cloud-based tools in one place. So you can supercharge your workflows with a dynamic, multidimensional view. Whether you’re an analyst, data scientist, or developer, Planet Insights Platform will help increase observability across your operations, enhance the performance of your teams, and scale your products and services with daily Earth insights. Planet Insights Platform is the central place where daily Earth data, analytics, and powerful tools are combined to achieve the insights that characterize our changing physical Earth. Our platform brings together Planet’s flagship Monitoring, Tasking, Analytics, and Planetary Variables product suite – supercharged with the recently acquired Sentinel Hub – to offer a more unified experience for a broad set of users. Observe vast geographic areas, discover patterns, and identify changes over time. Powered by hundreds of Dove™ satellites in orbit, Planet provides high-frequency data that strives to cover the landmass of the Earth each day, empowering you to make timely, informed decisions across broad areas. Get site-specific data to characterize change in closer detail. SkySat® imagery provides real-time intelligence through very-high-resolution imagery, so you can proactively identify blind spots, anticipate events, and have confidence in your next mission-critical decision. Leverage machine learning to automatically identify objects and features of interest from Planet’s deep archive of data at global scale, empowering you to prioritize resources and act with the most recent insights available."
