full_description = "Power your applications and analytics with seamless basemaps built from the most recent satellite imagery from around the world. Planet Basemaps leverage cutting-edge software together with daily global satellite imagery to create visually consistent and scientifically accurate mosaics. Gain insights over broad areas and diverse geographies, and empower time series analysis and data analytics with Planet’s Global and Select Basemaps. Spatially accurate, color-corrected, high-resolution basemaps that minimize the effects of cloud, haze, and other image variables With minimized atmospheric effects and enhanced pixel accuracy, this basemap provides consistent data for deeper analysis with four or eight spectral bands 1.5+ million scenes incorporated daily to create a smooth contextual layer, updated annually, and ready for your workflow Planet's range of basemap solutions ensure that your application needs are met. Planet Select Basemaps are customizable with options for visual or multispectral content and frequency of delivery. Planet’s Global Basemap spans the Earth’s entire landmass and is generated once each year from data collected daily. With Planet Select Basemaps, customers have access to accurate, up-to-date, and seamless geospatial data captured by the world's largest fleet of satellites. Planet Select Basemaps comprises two offerings—Visual Basemaps and Surface Reflectance Basemaps—that are generated in line with customer needs to provide fresh, actionable insights over broad areas. Unlike other image mosaics, Planet Select Basemaps let the customer determine the AOI, frequency of updates, and the delivery. Monitor evolving landscapes and infrastructure over time and derive insights from advanced analytics over large regions. Select Basemaps give you the power to define what you need, where you need it, and how often – without sacrificing coverage or quality. View of the towering coastal redwoods in the Redwood National Park adjacent to patches of recently clearcut forests"
