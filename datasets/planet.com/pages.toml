title = "Asia Pacific’s Mid-Autumn Festival: Thousands Old Tradition Reimagined With Planet Satellite Data"
full_description = ".css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}OtherAsia Pacific’s Mid-Autumn Festival: Thousands Old Tradition Reimagined With Planet Satellite Data.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Janeth Fule.css-1jjwf1f{margin-left:0px;}September 27, 2024•3 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Other.css-1vz2rsl{background:var(--chakra-colors-white);}Other.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}As one of the world's largest and most diverse agricultural producers, the Asia-Pacific region faces the critical challenge of ensuring long-term food security while preserving its environment and rich cultural heritage.Tradition Meets Technology in Asia-PacificThe Mid-Autumn Festival, celebrated in the Republic of Korea, Vietnam, Singapore, Malaysia, and Taiwan, is a major festival during the harvest season in the region. During the festivities, the people honor the moon, which is believed to be the harbinger of abundant harvests. This celebration occurs on the 15th day of the eighth month in the Chinese lunar calendar when the moon is at its roundest and brightest.The rich tradition dates back 3,000 years ago when the moon's light during mid-autumn extended the hours farmers could harvest their crops. At present, farmers face a multitude of challenges in ensuring high farm productivity such as shifting growing seasons, soil degradation, and water scarcity—all while the demand for food continues to rise. One solution to these challenges is regenerative agriculture, enhanced by satellite data. Regenerative agriculture is a sustainable farming approach that seeks to improve soil health and biodiversity, ensuring the long-term viability of agricultural lands.Creattura, a Japanese company, blends tradition and technology to meet food demands while promoting sustainable food systems in the region. They collaborated with local communities, handling vast amounts of manual, raw data, which requires tedious processing. From the data collected, they identified that the outdated irrigation systems were consuming excessive water without necessarily improving yields. To address this, they analyzed soil moisture levels using Planet data. The localized farming insights led to the development of an automated irrigation calendar for the farmers, creating a more efficient system that conserves water and reduces carbon emissions. Creattura incentivized farmers to adopt the system by offering carbon credit funds generated from the system's carbon emissions reduction.In addition to optimizing irrigation systems, Planet’s solutions can also be integrated to help monitor crop health for early detection of pests and diseases, improve yield forecasting, streamline NDVI calculations, and protect biodiversity. Planet can help users gather, manage, and meaningfully visualize multiple sources of data, enabling farmers to focus on what is truly important for a fruitful season.Given its deep connections to culture, civilization, and conservation, agriculture is crucial to building a sustainable and food-secure future. While we navigate the balance between feeding the growing population and minimizing our carbon footprint, technologies like satellite data and machine learning will be key to threading this needle. However, we must act now and collaboratively to achieve a greater impact. After all, without a healthy planet, we may no longer be able to celebrate festivals as our ancestors once did.Learn more about “Cultivating a Regenerative Future: Satellite Data for Food Security & Environmental Protection in Asia-Pacific” in our webinar on October 16th. We will discuss sustainable digital agriculture in detail with actionable insights from regional Planet data use cases.Tags:#aerospace#Agile aerospace#earth observation#EO#government#newspace#planet#planet labs#Satellite#satellite data#satellite imagery.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gxme{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}.css-xwnvlj{font-family:var(--chakra-fonts-heading);font-weight:var(--chakra-fontWeights-bold);color:var(--chakra-colors-white);font-size:36px;margin-bottom:0px;padding-top:0px;line-height:1;}Ready to Get Started.css-9hslri{font-size:24px;