title = "Planet Launches High-Resolution Pelican-2 Satellite & 36 SuperDoves"
full_description = '''.css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}NewsPlanet Launches High-Resolution Pelican-2 Satellite & 36 SuperDoves.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Planet Labs PBC.css-1jjwf1f{margin-left:0px;}January 14, 2025•4 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}News.css-1vz2rsl{background:var(--chakra-colors-white);}News.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}We are thrilled to announce today that our high-resolution Pelican-2 satellite and 36 SuperDoves of Flock 4G were successfully launched to orbit on SpaceX’s Transporter-12 Rideshare mission from Vandenberg Space Force Base in California. Our Planet team has successfully made contact with Pelican-2 and started its commissioning process..css-11m1pet{font-size:0.8em;color:var(--chakra-colors-gray-500);}Satellite constellation rendering. © 2024 Planet Labs PBC. All Rights Reserved.Pelican-2 joins Pelican-1 (a smallsat platform tech demonstration launched last year) as part of Planet’s next-generation, high-resolution fleet, to support and expand its existing SkySat capabilities. Planet plans to launch additional Pelicans this year.Pelican-2 rendering. © 2024 Planet Labs PBC. All Rights Reserved.Pelican-2 is designed to provide up to 40 cm class resolution imagery across 6 multispectral bands optimized for cross-sensor analysis. Planet has collaborated with NVIDIA to equip Pelican-2 with the NVIDIA Jetson platform to power on-orbit computing—with the aim of vastly reducing the time between data capture and value for customers.Curious how our new Pelican-2 satellite will revolutionize our capabilities? Check out our latest video to learn more:More information on Pelican-2’s capabilities can be found here.About Planet Labs PBCPlanet is a leading provider of global, daily satellite imagery and geospatial solutions. Planet is driven by a mission to image the world every day, and make change visible, accessible and actionable. Founded in 2010 by three NASA scientists, Planet designs, builds, and operates the largest Earth observation fleet of imaging satellites. Planet provides mission-critical data, advanced insights, and software solutions to over 1,000 customers, comprising the world’s leading agriculture, forestry, intelligence, education and finance companies and government agencies, enabling users to simply and effectively derive unique value from satellite imagery. Planet is a public benefit corporation listed on the New York Stock Exchange as PL. To learn more visit www.planet.com and follow us on X (formerly Twitter).Forward Looking StatementsExcept for the historical information contained herein, the matters set forth in this press release are forward-looking statements within the meaning of the "safe harbor" provisions of the Private Securities Litigation Reform Act of 1995, including, but not limited to, the Company’s ability to capture market opportunity and realize any of the potential benefits from current or future product enhancements, new products, or strategic partnerships and customer collaborations, the Company’s ability to successfully design, build, launch and deploy, operate and 