["https://planet.com/markets/defense-and-intelligence"]
title = "Enhance Geospatial Intelligence with Planet's High Frequency Satellite Data | Planet"
description = "Planet's fleet of satellites provide geospatial intelligence imagery for defense in near real-time, from locations around the world."
full_description = "Inform intelligence, ensure defense, prioritize resources, and act decisively with daily insights and global satellite data Planet pairs persistent global satellite monitoring with low latency tasking to deliver early intelligence across shifting geopolitical landscapes. With machine learning-based analytic feeds, Planet provides intelligence groups and defense organizations with the data required for informed decision-making and enhanced crisis management. Track and search borders, remote geographies, and coastal waters with an average of 2,400 images of every spot on earth’s landmass Increase access to geospatial data with Planet’s range of scalable satellite solutions. The PlanetScope constellation monitors the Earth’s entire landmass and strategic areas of interest every day at 3.7 meter resolution, and the SkySat constellation can task collections of 50-centimeter satellite imagery sub-daily. Planet Analytics allows you to identify and quantify change. With Planet's machine learning-powered feature extraction, observe these developments in isolation, and make decisions accordingly. Planet's automated object detection analytics allows you to observe patterns of life, monitor abnormalities, and inform activity-based assessments. SkySat’s intra-day revisit capacity captured two images of the Kabul International Airport in Afghanistan on August 16th at 8:26 and 9:11 UTC - just 45 minutes apart. The imagery gave a near real-time look into the deteriorating situation. With Planet’s high-frequency geospatial data, focus on areas of interest and activity, optimize limited resources, and inform decision-making and intelligence activities. PlanetScope September 7 - November 16, 2020Early signs of construction work detected at the nuclear facility in Natanz, Iran. PlanetScope September 7 - November 16, 2020 Early signs of construction work detected at the nuclear facility in Natanz, Iran. Complement your existing capabilities with Planet’s high-frequency, high-resolution imagery and machine-learning analytics and reduce the risk of missing critical events."
