description = "Planet's fleet of satellites provide geospatial intelligence imagery for defense in near real-time, from locations around the world."
full_description = "Planet’s mission is to image the entire Earth every day and make change visible, accessible, and actionable. Esri is the global leader in GIS technology, mapping, and spatial analytics software. With the Planet-Esri partnership, you can unlock the power of frequent high-resolution satellite imagery in your GIS workflows. Planet supports multiple patterns for integrating Planet data into your GIS workflows, so you can combine Planet imagery with the most authoritative GIS content and analysis platform. The platform is flexible to support use-cases in ArcGIS Pro, ArcGIS Online, or ArcGIS Enterprise, for those with expertise in remote sensing or not. Enrich your GIS databases with the most up to date satellite imagery available today. Perform richer analyses combining other geospatial data sources, to get a comprehensive, nuanced understanding of the locations you want to monitor. Use Planet's high-cadence satellite imagery in ArcGIS Pro to protect natural resources, infrastructure, and people. Steward your constituency and strengthen your community by monitoring land use, enforcing code, and gaining situational awareness during emergencies. The video shows how local governments can monitor and audit urban development classifying large-scale conversion of agricultural land to urban use by leveraging Planet Imagery, and on-the-fly processing in ArcGIS pro. Watch a detailed demo .css-wyy2y{transition-property:var(--chakra-transition-property-common);transition-duration:var(--chakra-transition-duration-fast);transition-timing-function:var(--chakra-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:inherit;}.css-wyy2y:hover,.css-wyy2y[data-hover]{-webkit-text-decoration:none;text-decoration:none;}.css-wyy2y:focus-visible,.css-wyy2y[data-focus-visible]{box-shadow:var(--chakra-shadows-outline);}here. Forest managers from public and private sectors leverage Planet imagery in ArcGIS Pro to monitor forest vitality, efficiently harvest timber, and plan sustainable timber operations. The video shows how forest managers and GIS analysts can leverage Planet's analysis ready basemaps in ArcGIS Pro to detect inventory changes month over month. Watch a detailed demo here."
