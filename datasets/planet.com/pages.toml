["https://planet.com/products/hyperspectral"]
title = "Hyperspectral Imaging Satellites | Planet"
description = "Superior hyperspectral data and critical insights through Planet's Tanager satellite, designed for accurate methane emission detection and broad area coverage."
full_description = "Planet’s hyperspectral imaging satellites are pushing the boundaries of earth observation and methane emissions monitoring. Effective decisions rely on trustworthy data. Tanager™ is a best-in-class hyperspectral imaging satellite offering unparalleled sensitivity, designed to deliver full-spectrum imagery across the visible and shortwave infrared regions (VSWIR). Engineered by NASA’s Jet Propulsion Laboratory and sponsored by Carbon Mapper, Tanager’s next-generation sensor technology empowers your organization to make critical, time-sensitive decisions with confidence. Quickly uncover regional trends and deviations from historical patterns with Tanager’s broad area coverage and rapid-access data. Tanager supports a broad spectrum of applications, but its core mission is to detect and mitigate methane emissions across the globe. Tanager is able to map facility-scale methane emissions to enhance leak detection and repair efforts. Detect smaller emissions more frequently with 3-6 more sensitivity than comparable spaceborne systems Trace likely source of emissions detections to facility equipment with Planet’s high-frequency Monitoring and high-resolution Tasking imagery 90.css-1qwnwpn{font-size:22px;}kg/hr.css-1gn4wbo{color:var(--chakra-colors-planet-darkGrey-300);font-weight:400;position:relative;left:0.1em;top:-0.45em;font-size:0.6em;}1 .css-10vul7a{position:relative;left:-0.2em;top:-0.45em;font-size:0.7em;}190% probability of detection, Maximum sensitivity imaging mode, point source, 3m/s wind, medium surface brightness, 35° solar zenith angle. Slated for release in late 2024, Tanager’s planned hyperspectral offering includes core imagery and derived methane detection data. Customized tasking and multiple sensitivity operational modes will enable custom imagery collection designed to fit your specific business needs. Tasking, ordering, and delivery of Tanager products are planned to be made possible through Planet’s easy-to-use APIs. Tanager’s planned core imagery data include calibrated radiance and atmospherically-corrected surface reflectance. These ready-to-use data products are intended for customers who want to utilize the full spectral range to extract application-specific insights."
