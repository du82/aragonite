title = "Cookie Notice | Planet"
full_description = "This Cookie Notice provides information about how and when Planet Labs PBC (“Planet,” “we,” “us,” “our”) uses cookies and similar technologies when you visit Planet websites (collectively as used in this Cookie Notice, the “Site”) and use or access Planet products, services, and/or applications (the “Services”). It explains what these technologies are, why we use them, and how you can control our use of them. We and our partners (such as advertising and analytics vendors) may use other technologies similar to cookies from time to time, such as web beacons (also known as “tracking pixels” or “clear gifs”). These are tiny graphics files that contain a unique identifier that enable us to recognize when you visit our Site or Services. This allows us, for example, to monitor the traffic patterns of users from one page within our Site and Service to another, deliver or communicate with cookies, understand if you came to our Site from an online ad displayed on a third-party website, and improve Site performance. These technologies often rely on cookies to function properly, so rejecting cookies can impair their functionality. We allow services providers (including Google Analytics) or third parties to use tracking technologies on our Site and Services for analytics, advertising, and customer support purposes. These third parties may use their technologies to provide advertising tailored to your interests which may appear on other websites. You can choose to disable cookies that are not strictly necessary cookies. If you choose to disable or reject cookies, you may still use our Site and Services, though your access to some functionality and areas may be restricted. Please note, unless otherwise noted, the choices below are browser or device based, and you should make the choices on each browser or device where you want them to apply. If you clear cookies or your browser is set to do so, your opt-out may no longer be valid, in which case you must opt out again where you want your choices to apply."
