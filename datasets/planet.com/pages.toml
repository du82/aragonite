title = "World Food Day: Using Planet Data for Food Security & Environmental Protection"
full_description = ".css-7hugtd{-webkit-margin-start:auto;margin-inline-start:auto;-webkit-margin-end:auto;margin-inline-end:auto;max-width:800px;}HOME.css-qvzbmb{-webkit-margin-start:1em;margin-inline-start:1em;-webkit-margin-end:1em;margin-inline-end:1em;}StoriesWorld Food Day: Using Planet Data for Food Security & Environmental Protection.css-1xaekgw{margin-top:20px;}.css-9aj5lt{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;gap:1em;}.css-wkpw2c{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}Janeth Fule.css-1jjwf1f{margin-left:0px;}October 15, 2024•3 min read.css-rm9e7r{margin-top:40px;margin-bottom:40px;}Stories.css-1vz2rsl{background:var(--chakra-colors-white);}Stories.css-1gz73i1{display:grid;grid-template-columns:1fr;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}@media screen and (min-width: 62em){.css-1gz73i1{grid-template-columns:260px auto 260px;}}.css-19xhq27{padding-right:40px;}Global food security is a persistent challenge in advancing the collective Sustainable Development Goals by 2030. According to The State of Food Security and Nutrition in the World 2024 (SOFI) report, nearly 2.33 billion people are experiencing moderate or severe food insecurity. With rising global populations coupled with extreme weather events, land degradation, and natural resource depletion, it’s becoming harder to achieve food security. These challenges demand a combination of new and innovative solutions and approaches.Food Security in Asia-PacificAsia-Pacific is home to 60% of the world’s population and is a major agricultural producer. While it has abundant, arable lands and large water bodies, this region is still no stranger to climate change vulnerability, geopolitical conflicts, and economic inequality which disrupt food production and distribution.On World Food Day 2024, the Food and Agriculture Organization (FAO) urges people to take action using the lens of the “Four Betters” framework: better production, better nutrition, a better environment, and a better life that leaves no one behind. While governments, humanitarian organizations, and the private sector have programs in place to address food security, these initiatives must be reinforced through stronger regional cooperation to create a sustainable and lasting future.During our 30-minute World Food Day webinar, Cultivating a Regenerative Future: Satellite Data for Food Security & Environmental Protection in Asia-Pacific, we shared insights on how our regional partners and customers use the Planet Insights Platform to help meet these objectives.Better Food Production and Environment With Planet Satellite DataAt Planet, we’ve had the rare opportunity to support governments and organizations in advancing their sustainability initiatives and food security policies in Asia-Pacific. Through broad area management, we have expanded our products and capabilities to make better and more informed decisions:An updated Planetary Variable: Crop Biomass to enable simplified daily data feeds on crop growth monitoring.The addition of the Planetary Variable: Field Boundaries to provide accurate and foundational data on crop-level growth and yield estimates.The launch of our first Tanager hyperspectral satellite with the capacity to capture 420 different colors and detect gasses in the air, chemicals on the ground, and more.In our recent Planet Connect sessions in Japan, Australia, and Vietnam, our local partners and customers engaged in knowledge-sharing opportunities and best practices using Planet data.We believe that ensuring food security requires innovation, emerging technologies, and timely insights. Ready to learn more? Contact us so we can help you find the right solutions to meet your goals.Tags:#aerospace#Agile aerospace#earth observation#EO#Europe#government#newspace#planet#planet labs#Satellite#satellite data#satellite imagery.css-wjwe00{position:-webkit-sticky;position:sticky;top:75px;}.css-hu5c21{grid-column:span 3/span 3;z-index:20;}.css-dvxtzn{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-1seorkf{background:#161822;width:100%;height:100%;padding-bottom:var(--chakra-space-16);-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;gap:var(--chakra-space-10);padding:40px 16px;margin-top:32px;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;border-radius:6px;color:var(--chakra-colors-white);max-width:1084px;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}.css-i9gxme{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}.css-xwnvlj{font-family:var(--chakra-fonts-heading);font-weight:var(--chakra-fontWeights-bold);color:var(--chakra-colors-white);font-size:36px;margin-bottom:0px;padding-top:0px;line-height:1;}Ready to Get Started.css-9hslri{font-size:24px;line-height:1.2;font-weight:300;color:rgba(255, 255, 255, 0.87);}Connect with a member of our Sales team. We'll help you find the right products and pricing for your needs.css-328x68{display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;-webkit-appearance:none;-moz-appearance:none;-ms-appearance:none;appearance:none;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;-we