title = "Planet Debian French"
full_description = "Après la MiniDebConf Marseille 2019, le COVID-19 a rendu impossible/difficile l’organisation de nouvelles MiniDebConf pendant quelques années. Avec la reprise progressive d’événements d’ampleur en présentiel (FOSDEM, DebConf, etc.), l’idée était de proposer une nouvelle MiniDebConf en France mais avec une organisation plus légère. En 2023, nous avons eu l’idée de contacter les organisateurs de Capitole du Libre afin de réitérer l’expérience de 2017 : pouvoir organiser une MiniDebConf en parallèle de l’événement annuel qui se tient à Toulouse en novembre. Mais notre demande était trop tardive pour 2023, donc après discussions avec Capitole du Libre en novembre 2023 à Toulouse puis en février 2024 à Bruxelles, nous avons pu confirmer la tenue d’une MiniDebConf Toulouse en novembre 2024 ! Nous avons alors constitué une petite équipe d’organisation et nous nous sommes lancés : Call for Papers en mai 2024, ajout d’un MiniDebCamp de deux jours, coordination avec la DebConf vidéo team, recherche de sponsors, création d’un logo, commande des T-shirts et stickers, planning, gestion des inscriptions… même avec une organisation plus légère (la gestion de la salle de conférence, des badges, de la nourriture pendant le week-end étant faite par Capitole du Libre), il restait un peu de travail de préparation. Jeudi 14 et vendredi 15 novembre 2024, une quarantaine de développeurs débarquent du monde entier (France, Espagne, Italie, Suisse, Allemagne, Angleterre, Brésil, Urugay, Inde, Brest, Marseille…) pour passer deux jours de MiniDebCamp dans les beaux espaces collaboratifs d’Artilect dans le centre-ville de Toulouse. Puis le samedi 16 et dimanche 17 novembre 2024, la MiniDebconf s’est tenue dans les locaux de l’ENSEEIHT au sein de l’évènement Capitole du Libre. On a démarré dès le samedi matin avec une ouverture (Jérémy Lecour) marquée par un hommage à Lunar (Nicolas Dandrimont), puis Reproducible Builds – rebuilding what is distributed from ftp.debian.org (Holger Levsen) et Discussion on my research work on sustainability of Debian OS (Eda). Après un déjeuner grâce aux food trucks du Capitole du Libre, c’est reparti pour un après-midi intense : What’s new in the Linux kernel (and what’s missing in Debian) (Ben Hutchings), Linux live patching in Debian (Santiago Ruano Rincón), Trixie on mobile: are we there yet? (Arnaud Ferraris), PostgreSQL container groups, aka cgroups down the road (Cédric Villemain), Upgrading a thousand Debian hosts in less than an hour (Jérémy Lecour et moi-même) et Using debusine to automate your QA (Stefano Rivera &co). Dimanche, c’est le second jour, et l’on reprend avec une présentation de la DebConf 25 (Benjamin Somers) qui se déroulera à Brest en juillet 2025 puis l’on enchaîne la matinée avec How LTS goes beyond LTS (Santiago Ruano Rincón & Roberto C. Sánchez), Cross building (Helmut Grohne) et State of the javascript (Bastien Roucariès). L’après-midi, place aux Lightning Talks, PyPI Security: Past, Present & Future (Salvo “LtWorf” Tomaselli) et le classique Bits from DPL (Andreas Tille) avant la conférence de clôture (Pierre-Elliott Bécue). Toutes les conférences sont à retrouver en vidéo sur le programme (encore merci à la formidable DebConf vidéo team), merci aux sponsors (Viridien, Freexian, Evolix, Collabora et Data Bene) et grand merci à toute l’équipe du Capitole du Libre de nous avoir « supporté »… rendez-vous à Brest en juillet 2025 ! Articles à propos (ou mentionnant) la MiniDebConf Toulouse : https://edwardbetts.com/blog/a-mini-adventure-at-minidebconf-toulouse/ https://phls.com.br/bits-from-minidebconf-toulouse-2024 https://reproducible-builds.org/reports/2024-11/#debian-updates https://bits.debian.org/2024/12/bits-from-the-dpl-december.html https://www.chiark.greenend.org.uk/~cjwatson/blog/activity-2024-11.html https://www.freexian.com/blog/debian-contributions-11-2024/#minidebconf-toulouse-at-capitole-du-libre"
year_published = 2024
year_updated = 2024
