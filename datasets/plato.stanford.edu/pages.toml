["https://plato.stanford.edu/cgi-bin/encyclopedia/random"]
title = "Global Justice (Stanford Encyclopedia of Philosophy)"
full_description = "Entry Navigation Entry Contents Bibliography Academic Tools Friends PDF Preview Author and Citation Info Back to Top Global JusticeFirst published Fri Mar 6, 2015; substantive revision Fri Jun 9, 2023 On common accounts, we have a state of justice when everyone has their due. The study of justice has been concerned with what we owe one another, what obligations we might have to treat each other fairly in a range of domains, including over distributive and recognitional matters. Contemporary political philosophers had focused their theorizing about justice almost exclusively within the state, but the last twenty-five years or so has seen a marked extension to the global sphere, with a huge expansion in the array of topics covered. While some, such as matters of just conduct in war, have long been of concern, others are more recent and arise especially in the context of contemporary phenomena like intensified globalization, economic integration, and potentially catastrophic pandemics and anthropogenic climate change. John Rawls’s seminal book The Law of Peoples initiated many debates about global justice (Rawls 1999). Several questions soon became prominent in discussions including: What principles should guide international action? What responsibilities do we have to the global poor? Should global inequality be morally troubling? Are there types of non-liberal people who should be tolerated? What kind of foreign policy is consistent with liberal values? Is a “realistic utopia” possible in the global domain? How might we transition effectively towards a less unjust world? Contemporary events also played an enormous role in prompting philosophical inquiries. Prominent cases of genocide, ethnic cleansing, forms of terrorism uncommon prior to 2001, intensified interest in immigration to affluent countries, increased dependence on the labor of those from low-income countries, and enormous threats to well-being, security and the environment became common catalysts for further work. Philosophers began to reflect on questions such as: Is it ever permissible to engage in coercive military action for humanitarian purposes, such as to halt genocide or prevent large-scale violations of human rights? Can terrorism ever be justified? Should affluent countries open their borders more generously than they currently do to those from low-income countries who would like to immigrate to them? Are our current global economic arrangements fair ones and if not, how should they be transformed? What responsibilities do we have to one another in a globalized, post-Westphalian world order? How should we allocate responsibilities for reducing global injustice in our world, such as in the case of distributing costs associated with addressing climate change? Increased interest concerning issues of global justice also coincided with enhanced interest in the place and value of nationalism. These explorations tracked events such as nationalist clashes which spilled over into widespread suffering (notably in the former Yugoslavia and Rwanda), increased calls for national self-determination to carry considerable weight, such as in state recognition for Palestinians or Tibetans, and also in the case of secession (prominently, Quebec). In this area global justice theorists have been concerned with a range of important questions such as: Under what conditions should claims to national self-determination be granted substantial weight? When should self-determination yield to concern for protecting human rights? Are commitments to nationalism and global justice compatible? Is genuine democracy only possible at the state level or are there robust forms of democracy that are possible in more international fora? How are ideals of democracy best incorporated into defensible global institutional arrangements? Is world justice possible without a world state? In recent years reflection on existential threats like climate change, war, and pandemics and how perspectives of the oppressed might inform the future of the sub-discipline, have contributed new dimensions to answering core questions along with adding central questions within the field. The primary purpose of this article is to give an orientation to the enormous and rapidly expanding field of global justice. There are several entries in this encyclopedia that already cover some of the core topics well and these will be cross-referenced. But there are still many important gaps, along with some missing context as to how some topics fit together. This entry aims primarily to address these needs. 1. Some Definitional Issues 1.1 Global and International Justice 1.2 What is a Theory of Global Justice? 1.3 When is a Problem a Global Justice Problem? 2. Principles to Guide Behavior in International and Global Matters 2.1 The Influence of Rawls’s Law of Peoples 2.2 What Global Duties Do We Have? 2.3 Cosmopolitanism, Duties to Non-Compatriots, and Compatriots 2.4 Human Rights Fulfillment 3. The Proper Use of Force, Military Intervention, and its Aftermath 3.1 War and Just Conduct 3.2 Humanitarian Intervention 3.3 Terrorism 4. Global Economic Injustice 5. Global Gender Justice 6. Race and Global Justice 7. Immigration 8. Global Environmental Issues 9. Global Health Issues 10. Some Issues that Cut Across Several Themes 10.1 Natural Resources and Global Justice 10.2 Allocating Responsibilities for Global Problems 10.3 Authority in the Global Domain: Do We Need a World State to Secure Global Justice? 11. The Contribution to Public Policy, Interdisciplinary Engagement, and New Methods Bibliography Academic Tools Other Internet Resources Related Entries 1. Some Definitional Issues 1.1 Global and International Justice A distinction is often drawn between global and international justice. The key point of difference between these two notions involves clarifying the entities among which justice is sought. In international justice the nation or state is taken as the central entity of concern and justice among nations or states is the focus. In the domain of global justice, by contrast, theorists do not seek primarily to define justice between states or nations. Rather they drill down through the state shell and inquire about what justice requires among human beings. Global justice inquiries take individual human beings as of primary concern and seek to give an account of what fairness among such agents involves. There are several types of actions that cut across states or involve different agents, relationships, and structures that might be invisible in an inquiry seeking justice among states exclusively. Many different kinds of interactions are not circumscribed by state membership and yet can importantly affect human beings’ most fundamental interests, so asking the question about what individual human beings owe one another often uncovers significant neglected features of relationships and structures that are of normative concern. Global justice analyses are not precluded from yielding state-level obligations; indeed, they typically do. However, they consider a wider array of possible agents and organizations that might have duties as well. There are advantages associated with both types of inquiries. An important advantage of asking what states owe one another is that much international law presupposes the states system and requires states to perform various actions to promote justice. In this way, responsibilities often appear to be clearly allocated to particular parties thus making it quite precise who ought to do what in our actual world. One advantage of global justice inquiries is that we are not forced to take states as a fixed constraint and we can therefore consider a range of relevant relationships, capacities and roles that also structure our interactions and might be relevant to how we ought to conceptualize global responsibilities. While asking about what individuals owe each other may well have implications for states and their obligations, a range of other agents and institutions may also have relevant justice obligations. These responsibilities can become more visible when we explore what individuals owe each other. The two approaches have different strengths and can complement each other, but in contemporary debate they are often taken as rivals competing to provide the most plausible framework. For further discussion of international justice, see the entry on international distributive justice. 1.2 What is a Theory of Global Justice? In general, a theory of global justice aims to give us an account of what justice on a global scale consists in and this often includes discussion of the following components: identifying what should count as important problems of global justice positing solutions to each identified problem identifying who might have responsibilities in addressing the target problem arguing for positions about what particular agents (or collections of agents) ought to do in connection with solving each problem and providing a normative view which grounds (1)–(4). Theories of global justice aim to help us understand our world better and what our responsibilities are in it. While some theorists aim purely at theoretical understanding, others hope also to provide an analysis that can be useful in practical policy making concerning global justice matters. 1.3 When is a Problem a Global Justice Problem? Problems of global justice arise when one (or more) of the following conditions obtain: Actions stemming from an agent, institution, practice, activity (and so on) that can be traced to one (or more) states negatively affect residents in another state. Institutions, practices, policies, activities (and so on) in one (or more) states could bring about a benefit or reduce harm to those resident in another state. There are normative considerations that require agents in one state to take certain actions with respect to agents or entities in another. Such actions might be mediated through institutions, policies, or norms. We cannot solve a problem that affects residents of one or more states without co-operation from other states. So, in general, a problem is one of global justice when the problem either affects agents resident in more than one state or the problem is unresolvable without their co-operation. For the problem to be considered genuinely global rather than regional it should affect more than one regional area. 2. Principles to Guide Behavior in International and Global Matters What sorts of duties of justice, if any, exist among human beings who do not reside in the same country? If there are such duties, what grounds them? Some argue that John Rawls’s principles developed for the case of domestic justice, notably, the Fair Equality of Opportunity Principle or the Difference Principle, should apply globally (Beitz 1999; Caney 2005a; Moellendorf 2002). Others maintain that the content of our duties to one another is best explored by examining alternative concepts not featured in the Rawlsian corpus, such as capabilities or human rights (Nussbaum 2006; Pogge 2008; Nussbaum 2015). Much discussion about what we owe one another in the global context is influenced by the work of John Rawls, so a short synopsis is needed to situate debates. Since discussion of these issues is amply covered in the entries on international distributive justice and John Rawls, this will be a compressed summary focusing only on the most central aspects of the debate that have a bearing on core topics of global justice. 2.1 The Influence of Rawls’s Law of Peoples In The Law of Peoples, John Rawls argues for eight principles that he believes should regulate international interactions of peoples. For Rawls, a “people” is constituted by a group of persons who have in common sufficient characteristics such as culture, history, tradition, or sentiment. Rawls uses the term “people” in ways that relevantly correspond with how many use the term “nation”. In addition, Rawls often assumes that, for the most part, each people has a state. The eight principles Rawls endorses acknowledge peoples’ independence and equality, that peoples have the right to self-determination along with having duties of non-intervention, that they ought to observe treaties, honor a particular list of human rights, should conduct themselves in certain appropriate ways if they engage in warfare, and that they have duties to assist other peoples in establishing institutions to enable people’s self-determination. He also advocates for international institutions governing trade, borrowing, and other international matters that are characteristically dealt with by the United Nations. Several claims have been the subject of much debate between critics and defenders of Rawls’s position. In particular, Rawls believes that so long as all peoples have a set of institutions that enable citizens to lead decent lives, any global inequality that might remain is not morally troubling. Critics draw attention to the ways in which global inequality – perhaps in levels of power or affluence – can convert into opportunities for deprivation and disadvantage. For instance, the global advantaged can use their superior position to influence the rules that govern international institutions – such as trade practices – which can facilitate further opportunities for increased advantage and so they can indeed threaten the abilities of others in distant lands to lead decent lives (Pogge 2008).[1] Another important issue that underlies debate between Rawls and his critics concerns different views about the nature and origins of prosperity. Rawls gives a particularly strong statement of what he takes the causes of prosperity to be. He claims that the causes of the wealth of a people can be traced to the domestic political culture, the virtues and vices of leaders, and the quality of domestic institutions. He says: I believe that the causes of the wealth of a people and the forms it takes lie in their political culture and in the religious, philosophical, and moral traditions that support the basic structure of their political and social institutions, as well as in the industriousness and cooperative talents of its members … The crucial elements that make the difference are the political culture, the political virtues and civic society of the country (Rawls 1999, 108). Critics observe that in addition to local factors, there are also international ones which play an important role in prospects for well-being. Thomas Pogge prominently helps bring some of these into view. The international borrowing and resource privileges, are good examples of the ways in which international practices can have profound effects on domestic factors which undeniably also play a role in promoting prosperity. According to the international borrowing privilege, governments may borrow amounts of money on behalf of the country and the country thereby incurs an obligation to repay the debt. The internationa"
