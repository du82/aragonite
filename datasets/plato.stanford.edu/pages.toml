["https://plato.stanford.edu/about.html"]
title = "About the Stanford Encyclopedia of Philosophy"
full_description = "About the Stanford Encyclopedia of Philosophy Brief Description The SEP's Publishing Model History History of Grants Publications Acknowledgements Brief Description Welcome to the Stanford Encyclopedia of Philosophy (SEP), which as of Summer 2023, has nearly 1800 entries online. From its inception, the SEP was designed so that each entry is maintained and kept up-to-date by an expert or group of experts in the field. All entries and substantive updates are refereed by the members of a distinguished Editorial Board before they are made public. Consequently, our dynamic reference work maintains academic standards while evolving and adapting in response to new research. You can cite fixed editions that are created on a quarterly basis and stored in our Archives (every entry contains a link to its complete archival history, identifying the fixed edition the reader should cite). The Table of Contents lists entries that are published or assigned. The Projected Table of Contents also lists entries which are currently unassigned but nevertheless projected. The SEP's Publishing Model The combination of features exhibited by the SEP publishing model distinguishes it from other attempts to build scholarly resources on the web. Our open access model has the following features: (1) a password-protected web interface for authors, which allows them to download entry templates, submit private drafts for review, and remotely edit/update their entries; (2) a password-protected web interface for the subject editors, which allows them to add new topics, commission new entries, referee unpublished entries and updates (updates can be displayed with the original and updated versions side-by-side with the differences highlighted) and accept/reject entries and revisions; (3) a secure administrative web interface for the principal editor, by which the entire collaborative process can be managed with a very small staff (the principal editor can add people, add entries, assign entries to editors, issue invitations, track deadlines, publish entries and updates, etc.); (4) a tracking system which logs the actions taken at the web interfaces, monitors the state of every entry, determines who owes work and when, automatically sends occasional, friendly email reminders, and provides a summary to the principal editor; (5) software which dynamically cross-references the SEP when new entries are published, and which periodically checks for broken links throughout the content; (6) software which automatically creates an archive every quarter, providing the proper basis for scholarly citation; and (7) mirror sites at universities in other parts of the world, which provide faster access to readers worldwide, provide access when the Stanford server is down for maintenance, and safeguard the digital content as extra backups. The SEP's publishing model therefore has the ability to deliver, with very low administrative and production costs, quality content meeting the highest of academic standards via a medium that is universally accessible. Few dynamic reference works have been built to the specifications described in the previous paragraph. Most of the other encyclopedia projects available on the web lack some of the dynamic and scholarly features of the SEP. Usually, one of the following applies: (a) they are costly and behind a subscription wall, invisible to search engines and so not as useful to academics and the general public; (b) they don't have an administrative system capable of screening new entries and updates prior to publication and ensuring that entries are responsive to new research; (c) they don't allow the authors/editors to directly contact the server to update/referee the content of the entries; (d) they lack a system of archives for stable, scholarly citation (thus, when entries change, the old content is just lost, and any citations to, or quotations from, prior content become impossible to verify); or (e) they lack a university-based Advisory Board to vet the members of its Editorial Board. The SEP's model may therefore represent a unique digital library concept: a scholarly dynamic reference work. A scholarly dynamic reference work differs from an academic journal, for academic journals (1) do not typically update the articles they publish, (2) do not aim to publish articles on a comprehensive set of topics, but rather, for the most part, publish articles that are randomly submitted by the members of the profession, (3) do not aim to cross-reference and create links among the concepts used in the articles they publish, (4) typically serve a narrow audience of specialists, and (5) do not have to deal with the asynchronous activity of updating, refereeing, and tracking separate deadlines for entries, since they are published on a synchronized schedule. Moreover, our reference work differs from preprint exchanges, for the latter not only exhibit features (1), (2), (3), and (4) just mentioned, but also do not referee their publications and so need not incorporate a work-flow system that handles the asynchronous refereeing process that occurs between upload and publication in a dynamic reference work. None of this is to say that electronic journals and preprint exchanges have a faulty design, but rather that a scholarly dynamic reference work is a distinctive new kind of publication that represents a unique digital library concept. History The SEP project began in September 1995 when John Perry was the Director of the Center for the Study of Language and Information (CSLI). Perry's suggestion that CSLI enhance its web presence by creating a (static) online dictionary of philosophy was taken up by Edward N. Zalta, who developed the idea into that of a dynamic reference work. Zalta then started designing the SEP to be an online encyclopedia that would satisfy the highest academic standards. After two years of support from CSLI, our prototype became a proof of concept that earned the first of a series of successful grant applications. (See the History of Grants below.) The addition of Colin Allen and Uri Nodelman to the project in 1998 resulted in significant enhancements to the design and implementation of our new academic publishing model. They introduced browser-based file-upload, workflow principles that categorized the state of every entry and possible state transitions, remote HTML editing, an engine which compares an original and revised entry side-by-side in the browser with the differences highlighted, etc. Paul Daniell programmed/developed the new search engine that the SEP brought online in September 2006. The SEP project moved to the Department of Philosophy in September 2021. See the masthead on the Editorial Information page, for a list of other people involved in the project. History of Grants Grant Duration Grant Number Granting Organization Amount 10/1998–09/2000 #PA-23167-98 NEH/Preservation and Access Division $131,400 10/2000–09/2003 #IIS-9981549 NSF/Information and Intelligent Systems (with support from NEH) $528,900 02/2002–08/2002 Officer's Grant Andrew W. Mellon Foundation $43,000 10/2003–09/2005 #PA-50133-03 NEH/Preservation and Access Division $300,828 01/2005–12/2008 #CH-50156 NEH/Office of Challenge Grants (awarded to SOLINET for the SEP) $500,000 10/2005–09/2007 #PA-51255-05 NEH/Preservation and Access Division $150,000 09/2005–08/2007 #2005-6238 William and Flora Hewlett Foundation Education, Technology, Open Content $190,000 Publications About the Stanford Encyclopedia Information about our dynamic reference work can be found in the following papers and abstracts: “From SEP to SEPIA: How and why Indiana University is helping the Stanford Encyclopedia of Philosophy”, by Colin Allen and Cecile Jagodzinski, in Against the Grain, 18/4 (September 2006): 42–43. “The Stanford Encyclopedia of Philosophy: A University/Library Partnership in Support of Scholarly Communications and Open Access,” by Edward N. Zalta, in College & Research Libraries News (a publication of the Association of College and Research Libraries), 67/8 (September 2006): 502–504, 507. “I Hear the Train A Comin' ”, by Greg Tananbaum, in Against the Grain, 18/1 (February 2006): 84–85. Abstracts: “Stanford Encyclopedia of Philosophy: A Dynamic Reference Work”, by Colin Allen, Uri Nodelman, and Edward N. Zalta, in Proceedings of the Third ACM/IEEE-CS Joint Conference on Digital Libraries (May 27–31, 2003), New York: Association for Computing Machinery Publications, p. 383. “Stanford Encyclopedia of Philosophy: A Dynamic Reference Work”, by Uri Nodelman, Colin Allen, and Edward N. Zalta, in Proceedings of the Second ACM/IEEE-CS Joint Conference on Digital Libraries (July 14–18, 2002), New York: Association for Computing Machinery Publications, p. 380. “Stanford Encyclopedia of Philosophy: A Dynamic Reference Work”, by Edward N. Zalta, Colin Allen, and Uri Nodelman, in Proceedings of the First ACM/IEEE-CS Joint Conference on Digital Libraries (June 24–28, 2001), New York: Association for Computing Machinery Publications, p. 457. “Digital Workflow Concepts for Dynamic Reference Works”, abstract of talk delivered by Edward N. Zalta at the Ancient Studies — New Technology Conference, Salve Regina University, December 2000. “The Stanford Encyclopedia of Philosophy: A Developed Dynamic Reference Work” (285K PDF document), by Colin Allen, Uri Nodelman, and Edward N. Zalta, in Metaphilosophy, 33/1-2 (January 2002): 210–228; reprinted in CyberPhilosophy: The Intersection of Philosophy and Computing, James H. Moor and Terrell Ward Bynum, (eds.), Oxford: Blackwell, pp. 201–218. “Stanford Encyclopedia of Philosophy”, by Edward N. Zalta, SPARC E-News (October/November 1999), published by The Scholarly Publishing and Academic Resources Coalition, online publication. (This issue is now archived offline; the above link is to our preprint.) “A Solution to the Problem of Updating Encyclopedias”, by Eric Hammer and Edward N. Zalta, Computers and the Humanities, 31/1 (1997): 47–60. [Note: The ftp-based file upload system described in this paper was superseded by a browser-based file upload system which uses special password-protected web interfaces for the authors and editors.] “Why Philosophy Needs a ‘Dynamic’ Encyclopedia”, by John Perry and Edward N. Zalta, URL = <https://plato.stanford.edu/pubs/why.html>, November 1997. Acknowledgments The Stanford Encyclopedia of Philosophy is indebted to many people, both at Stanford and elsewhere, who have supported the efforts of the project in significant ways. First, and foremost, we'd like to thank Professor John Perry, who has served as the principal investigator on the SEP grants, provided high-level supervision on the project, serves as the SEP's advocate to the Stanford administration, and gave generously of his time in SEP fund-raising activities. After Perry served as the SEP's Faculty Sponsor for many years, the role finally turned over first to Helen Longino, and then to R. Lanier Anderson. Administrative Assistance The SEP would like to acknowledge significant support from the Administrative Staff of the Center for the Study of Language and Information (CSLI) from Fall 1995 (when the SEP project started) through Fall 2021, when the SEP moved to the Department of Philosophy. We especially thank Amita Kumar and Michelle Lodwick for their tireless efforts on behalf of the SEP. The project would not be what it is today without their work. Editorial Assistance The SEP would also like to thank the following people: Nathan Tawil, Ben Wolfson, Tamar Lando, Matthew Barrett, and Arezoo Islami have provided, and in some cases continue to provide, valuable editorial and document-editing assistance. Kirsta Anderson (M.A./Philosophy) served as Assistant Editor during the 2003–2004 academic year, and did an outstanding job in SEP communications and control, offering many suggestions on how to improve our workflow system. Daniel McKenzie served as Assistant Editor during the 2004–2005 academic year, and did a great job juggling communications/control and copy-editing. Meica Magnani served as Assistant Editor from 2013–2017 and helped handle many tasks from communications to copyediting through a period of significant growth. Others, including Matthew Barrett and Justin Pront, have helped on a smaller scale with SEP editorial duties. Benjamin Patrick Przybocki also helped convert entries to HTML/MathJax. Fund-Raising Assistance We are especially indebted to the O.C. Tanner Company for a generous gift to the SEP in 2022, as well as The Byrne Foundation for a generous gift to the SEP in 2007, creating the John Perry Fund. We are also deeply indebted to Michelle Wachs (J.D., Harvard, 1993) of Giving Solutions, whose tireless and enthusiastic efforts as the SEP's fund-raising consultant during the 2005–2006 and 2006–2007 academic years helped us achieve our fund-raising goals for those years. We were able to hire Michelle with funds from a generous grant by the Hewlett Foundation. We would also like to acknowledge the contribution of Javier Ergueta (M.B.A., Stanford, 1980), for his efforts and work in developing a business plan for the Stanford Encyclopedia of Philosophy during the first six months of 2002. Javier's time was paid for through a generous grant by the Mellon Foundation. Thanks go the following students in John Perry's Fall 2004 Proseminar, for their help and assistance in implementing an important element of the SEP's fund-raising plan: Dan Giberman, Tomohiro Hoshi, Alistair Isaac, Daniel Long, Lindsay McLeary, Sarah Paul, Josh Snyder, Quayshawn Spencer and Johanna Wolff. Programming Assistance The Associate Editor (Colin Allen) and the Senior Editor (Uri Nodelman) have been the Principal and Associate Perl Programmers, respectively, on this project since 1998. Paul Daniell not only developed a customized search engine for the SEP, but also developed the software that administers the Friends of the SEP Society. During the 2007–2008 and 2008–2009 years, Jesse Alama has contributed his programming skills, in addition to his document editing skills. Eric Hammer (Expedia.com) programmed on the project in its early years, from 1995 to 1997. During the 2000–2001 and 2001–2002 academic years, David James Anderson (M.A./Philosophy) wrote important Perl programs and made other contributions to the project. We'd also like to thank John MacFarlane for developing a program that produces PDF versions of SEP entries in two-column landscape mode. Web Design Assistance In March 2014, the SEP launched a new website design. We are indebted to the team at Stanford Web Services, and especially Sara Worrell-Berg, Megan Miller, Anna Cobb, and Brian Young. They did a terrific job with the new design. In this connection, we are also indebted to Scott Stocker, Zach Chandler, Lisa Lapin, and John Etchemendy, for playing a role and helping to facilitate this initiative. New Technologies Assistance The Encyclopedia would like acknowledge and thank the"
