["https://plato.stanford.edu/accessibility.html"]
title = "Digital Accessibility (Stanford Encyclopedia of Philosophy)"
full_description = "Digital Accessibility Access to websites and electronic content is integral to the academic, research, and engagement activities available at Stanford University. The Stanford Encyclopedia of Philosophy (SEP) is committed to making its electronic content accessible to its students, faculty, staff, and all other individuals with disabilities participating or engaging in the programs and services of the University. Reporting Accessibility Issues If you cannot access content or use features on any SEP webpage due to a disability, please report your accessibility issue to editors@plato.stanford.edu. Digital Accessibility Policy The SEP website endeavors to comply with the University's Accessibility of Electronic Content policy, which addresses the responsibilities and processes for Stanford University branded websites with regard to electronic content and accessibility for individuals with disabilities. Office of Digital Accessibility Further information can be obtained at the Office of Digital Accessibility website, which serves the Stanford community by providing technical guidance, techniques for achieving accessibility, and best practices for accessible electronic content. The Office of Digital Accessibility website includes solutions for evaluating website accessibility, website scanning and monitoring tools, accessibility guidance for common applications, and other informational resources."
year_published = 2025
