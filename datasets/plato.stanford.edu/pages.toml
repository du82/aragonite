["https://plato.stanford.edu/pubs/sparc-oct99.html"]
title = "SPARC | SPARC E-News 10-11/1999"
full_description = '''Edward Zalta, Senior Research Scholar zalta@stanford.edu Center for the Study of Language and Information Stanford University There are innovative efforts underway to address the "other" publishing crisis, namely that of costly publications in the humanities. In this article, I'll describe one such new effort — the Stanford Encyclopedia of Philosophy — and the challenges it faces in the attempt to remain independent of commercial publishers. In August 1998, Routledge published a new Encyclopedia of Philosophy. The pre-publication price was $3,000 (with CD). It was an expensive project to complete and so one might expect the result to be costly. But the fact is that the Routledge Encyclopedia was already out of date when it was published, for many of the entries had been written several years prior to August 1998! At Stanford University's Center for the Study of Language and Information, we are building a new and alternative kind of reference work. The Stanford Encyclopedia of Philosophy (SEP), in contrast to the Routledge work, is a "dynamic" reference work. It enables professional philosophers around the world to collectively maintain a refereed, continuously updatable, online reference work. To implement this new concept, we developed a work-flow system which gives the authors of our entries and the members of our Board of Editors special password-protected access to our web server. SEP authors are chosen to write entries on the basis of their expertise. They can upload their entries (and subsequent changes to their entries) to a private location on our server visible only to our Editorial Board members. The latter are notified whenever new entries or changes to entries have been posted and they can use a special web interface to view and referee the new content. So as authors go about their research and discover new and important work on their topics, they can access and update their entry, and their modifications will be vetted before publication. Errors and omissions can be corrected whenever they are discovered, and users can cite fixed, quarterly archives of the SEP.'''
year_published = 2025
clearnet = "https://plato.stanford.edu/pubs/sparc-oct99.html"
