 of contract, tort (including negligence whether active or passive), or any other theory of liability. In other words: choosing to use our services does mean you are making a bet on us. If the bet does not work out, that’s on you, not us. We do our darnedest to be as safe a bet as possible through careful management of the business; investments in security, infrastructure, and talent; and in general giving a damn. If you choose to use our services, thank you for betting on us. This agreement shall be governed by the laws of Estonia, and the courts of Estonia shall have exclusive jurisdiction to hear and determine all issues that may arise under or in relation to this agreement. Contact us If you have a question about any of the Terms of Service, please contact us. Last updated: October 26, 2020"
