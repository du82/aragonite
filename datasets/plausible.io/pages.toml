full_description = "Plausible Analytics Terms of Service Thank you for using Plausible Analytics! When we say ”company”, “we”, “our”, “us”, ”service” or ”services” in this document, we are referring to Plausible Analytics. Note: The following Terms of Service apply to Plausible Analytics Cloud only and not to Plausible Analytics Self-Hosted which would be hosted on your own servers and therefore the Terms of Service isn’t needed. We may update these Terms of Service in the future. Whenever we make a significant change to our policies, we will also announce them on our blog. When you use our service, now or in the future, you are agreeing to the latest Terms of Service. That’s true for any of our existing and future products and all features that we add to our service over time. There may be times where we do not exercise or enforce any right or provision of the Terms of Service; in doing so, we are not waiving that right or provision. These terms do contain a limitation of our liability. Our Data Processing Agreement (DPA) under the European General Data Protection Regulation (GDPR) forms part of these Terms of Service. If you do not agree to these Terms of Service, do not use this service. Violation of any of the terms below may result in the termination of your account. That’s a broad statement and it means you need to place a lot of trust in us. We do our best to deserve that trust by being open about who we are, how we work, and keeping an open door to your feedback. Account terms You are responsible for maintaining the security of your account and password. Plausible Analytics cannot and will not be liable for any loss or damage from your failure to comply with this security obligation. You are responsible for any activity that occurs under your account (even by others who have their own logins under your account). You may not use our service for any illegal purpose or to violate any laws in your jurisdiction. You must provide your legal full name and a valid email address in order to complete the signup process. You must be a human. Accounts registered by bots or other automated methods are not permitted. Payment, refunds, upgrading and downgrading terms For our free trial, we explain the length of trial when you sign up. We do not ask you for your credit card and — just like for customers who pay for our services — we do not sell your data. After the trial period, you need to pay in advance to keep using the service. If you do not pay, we will freeze your account and it will be inaccessible until you make payment. If your account has been frozen for 60 days, we will queue it up for auto-cancellation. If you are upgrading from a free trial to a paid plan, we will charge you immediately and your billing cycle starts on the day of upgrade. Paying customers are billed automatically via credit card or PayPal depending on their preference. The number of pageviews purchased in the paid plan must be used during the applicable term and any unused pageviews at the end of the term are forfeited. You will never be charged extra for an occasional traffic spike. There are no surprise fees and your card will never be charged unexpectedly. In the event the usage of pageviews exceeds the paid plan you selected for two consecutive months, we will contact you to upgrade to a higher plan for the following month. You will have two weeks to make a decision. You can decide to continue with a higher plan or to cancel your account at that point. You can upgrade or downgrade in plan level at any time within your account settings. Downgrading your plan may cause the loss of features or capacity of your account. Plausible Analytics does not accept any liability for such loss. Our payment process is conducted by our payment processor Paddle. Paddle provides customer service inquiries and handles returns. All fees are inclusive of all taxes, levies, or duties imposed by taxing authorities. Paddle will collect those taxes on behalf of taxing authority and remit those taxes to taxing authorities. See Paddle’s Terms of Use for details. Fees paid hereunder are non-refundable. Cancellation and termination You are solely responsible for properly canceling your account. An email to cancel your account is not considered cancellation. You can find instructions for how to cancel your account here. We provide a simple no-questions-asked cancellation link. If you cancel the service before the end of your current paid up period, your cancellation will take effect at the end of the current billing cycle, and you will not be charged again. All of your stats will be inaccessible from the service after the time you paid for expires. Within 60 days of that, all stats will be permanently deleted from our backups. We cannot recover this information once it has been permanently deleted. You can choose to delete your account and all your site stats at any time. All your stats will be permanently deleted immediately when you delete your Plausible Analytics account. We reserve the right to suspend or terminate your account and refuse any and all current or future use of the service for any reason at any time. Such termination of the service will result in the deactivation or deletion of your account or your access to your account and site stats. Plausible Analytics reserves the right to refuse service to anyone for any reason at any time. We have this clause because statistically speaking, out of the thousands of sites on our service, there may be at least one doing something nefarious. Verbal, physical, written or other abuse (including threats of abuse or retribution) of any service customer, company employee or officer may result in immediate account termination. Modifications to the service and prices We reserve the right at any time and from time to time to modify or discontinue, temporarily or permanently, any part of the service with or without notice. Sometimes we change the pricing structure for our products. When we do that, we tend to exempt existing customers from those changes. However, we may choose to change the prices for existing customers. If we do so, we will give at least 30 days notice and will notify you via the email address on record. We may also post a notice about changes on our blog or the affected services themselves. Plausible Analytics shall not be liable to you or to any third-party for any modification, price change, suspension or discontinuance of the service. Content ownership, copyright and trademark You are solely responsible for any content and other material that you submit, publish, transmit, email, or display on, through, or with the service. We claim no intellectual property rights over the material you provide to the service. All site data remains yours. You may provide us with feedback, suggestions, and ideas about the service. You agree that we own all rights to use and incorporate the feedback you provide in any way, including in future enhancements and modifications to the service, without payment or attribution to you. You must not modify another website so as to falsely imply that it is associated with Plausible Analytics. The look and feel of the service is copyright© to Plausible Analytics. All rights reserved. “Plausible Analytics”, the Plausible Analytics logo and any other product or service name or slogan displayed on the service are trademarks of the company and may not be copied, imitated or used, in whole or in part, without the prior written permission of the company or the applicable trademark holder. You agree not to reproduce, duplicate, copy, sell, resell or exploit any portion of the service, use of the service, or access to the service without the express written permission by the company. Privacy and security of your data We take many measures to protect and secure your data through backups, redundancies, and encryption. When you use our service to measure your website stats, Plausible Analytics will collect information about your