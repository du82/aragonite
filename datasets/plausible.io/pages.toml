full_description = '''The Plausible Blog Hi! We are Uku and Marko. We're building a lightweight, non-intrusive alternative to Google Analytics. You can read about our journey and what we've learnt along the way on this blog. Subscribe Feb 6, 2025 Evolution of SEO in 2025, role of AI, and measuring it all in Plausible It’s an interesting time to be an online business, catching up with rapidly shifting “trends” regarding AI, increasing concerns around consumer privacy, and the one you can’t miss: shifting SEO –– one of the most favourite channels of digital marketers for more than two decades. Continue reading -> Jan 21, 2025 How to use Google's Looker Studio to create custom analytics reports Different businesses or teams have unique goals, workflows, and preferences for tracking and visualizing their data. For marketers and marketing agencies, creating custom dashboards is crucial to help clients visualize and understand their data. One powerful tool for this purpose is Looker Studio by Google. Continue reading -> Dec 19, 2024 How to pick the right metrics for your website? You can track almost any activity you want on your site with modern web analytics tools. And the process has only gotten simpler during the last decade. Continue reading -> Dec 11, 2024 Breaking down our 2.2K% surge in AI traffic with Plausible Analytics (+how to AI-optimize) In 2024, the Plausible website saw a ~2,200% increase in referral traffic from four AI search engines: ChatGPT, Perplexity, Claude, and Phind (refer to the screenshot above). These numbers were in the 100’s in 2023. Continue reading -> Dec 6, 2024 Everything that’s complicated to do in Google Analytics than Plausible The Google Analytics 4 interface has multiple reports, beneath multiple layers of menus. Some reports are standard, i.e. pre-made and available by default, while others are custom (“Explorations”) that you need to create on your own from scratch. Continue reading -> Nov 29, 2024 Tracking Google Ads and other paid campaigns with Plausible If you run paid campaigns on Google, Bing, Instagram, any newsletters, or even sponsored videos, etc., to drive sales or other conversion actions like sign-up, it’s a good idea to integrate an analytics tool. This helps fill blind spots about what was actually done on the website after someone clicked on your ad. Continue reading -> Nov 13, 2024 What is a good bounce rate for a website? When you first see your bounce rate of x%, it can be confusing making you think about what it is, is it good to have a higher or lower bounce rate, how is it being calculated for my site, what are some industry benchmarks, what can I do to improve it, etc. Let’s answer all questions. Continue reading -> Nov 7, 2024 How to analyze top landing pages and exit pages on your website? H﻿aving a website means having landing pages and tracking the traffic and performance of pages can bring great amounts of marketing and business insights. Continue reading -> Oct 10, 2024 WordPress blog categories: how to use, advanced plugins, and performance tracking Most of the time, we visit a site or a blog with a goal (or at least intent) in mind. Imagine you’re searching for home workout ideas and land on a fitness blog with hundreds of unorganized posts. You were likely looking for something specific, like “yoga for beginners” or “quick cardio routines.” Continue reading -> Sep 28, 2024 WordPress plugin: Track popular searches on your site TL;DR: Continue reading -> Sep 24, 2024 WooCommerce analytics plugin: One-click setup for tracking sales, funnel, marketing, and more. Tracking the performance of your WooCommerce store doesn’t have to be complicated. In fact, it’s incredibly straightforward with the Plausible plugin for WordPress, allowing you to set up end-to-end ecommerce site monitoring with just one click. Continue reading -> Sep 12, 2024 Cookie consent banners: do you need them, and how to be GDPR-compliant while maximizing opt-in rates? You’ve probably seen those pop-ups on websites, sweetly offering you cookies. Those are cookie consent banners. Continue reading -> Aug 20, 2024 How to track conversion attribution across your domain and subdomains? As a business with an online presence, you’ll almost definitely have, at least one of, a SaaS application, a blog, an online store, product documentation, or anything table stakes such as these. Continue reading -> Jul 18, 2024 How to ensure that your web analytics is tracking correctly Whether you’ve recently added a new tracking snippet to your site or have reasons to believe that your web analytics might not be functioning properly, it’s a good idea to verify if your analytics setup is correctly installed. Continue reading -> Jul 2, 2024 4 things I hate about GA4 Navigating a Google Analytics account gives me tiny shots of anxiety. The sentiment is always: “Why is GA4 so bad?” It makes me think “What if I do something wrong?”, “What if I end up changing a setting?” or “How do I apply a metric to this report now?”. Continue reading -> Jun 26, 2024 When a web analytics tool crosses the fine line to becoming a marketing tool Web analytics, as the name suggests, came around for helping website-owners visualize data about different elements of their website. This’d help them optimize web usage. Continue reading -> Jun 20, 2024 Using website analytics for ecommerce revenue attribution and boosting sales An e-commerce website has various ways of earning sales. Customers can find you through your ads, email campaigns, social campaigns, SEO, directly visiting your website and more. The process of understanding which channels are the most effective for your e-commerce store to generate sales is known as ecommerce revenue attribution. Continue reading -> Jun 12, 2024 What are custom dimensions in Google analytics and how to use them? Web analytics tools like Google Analytics or Plausible provide basic information, but they can’t automatically track everything you need. Custom dimensions allow you to capture specific data that goes beyond standard metrics. Continue reading -> May 22, 2024 How to track file downloads in web analytics If you have a website with downloadable resources like content or software, it’s a good practice to track how they are performing for your audience and business/marketing. Staying in sight of this information reveals interesting insight into how valuable a resource is to your audience, how effective is your distribution strategy and what improvements can be made to these two. Continue reading -> May 15, 2024 What's a marketing funnel and how to use it to optimize your website conversions Funnels have been around ever since digital marketing wasn’t even a thing. Earlier developed as a technique for door-to-door salespersons to describe their product, it evolved to become many things, and even changed shapes in response to the evolving customer journeys. Continue reading -> Apr 25, 2024 Optimizing paid ad campaigns with cookieless tracking in a post-third-party cookie world Q﻿uick update: Google announced recently that they are delaying the phasing out of third-party cookies. This is an effort to buy time to balance out the advertising industry’s needs and that of privacy advocates. This buys advertisers some time, but the phase-out (in whatever shape it comes) is still around the corner. It’s useful to prepare for this eventuality. Let’s see how, below. Continue reading -> Apr 15, 2024 What Google phasing out third-party cookies in 2025 means for marketers? Q﻿uick update: Google announced recently that they are delaying the phasing out of third-party cookies. This is an effort to buy time to balance out the advertising industry’s needs and that of privacy advocates. This buys marketers some time, but the phase-out (in whatever shape it comes) is still around the corner. It’s useful to prepare for this eventuality. Let’s see how, below. Continue reading -> Mar 21, 2024 GDPR-compliant web analytics without consent: A guide by a data protection lawyer In this article, Steffen Gross, an experienced data protection expert and lawyer at Simpliant Legal PartG mbB and external data protection officer at Simpliant GmbH, explains how web analytics can be implemented in accordance with the strict requirements of the ePrivacy Directive and the GDPR. Continue reading -> Feb 23, 2024 Introducing Plausible Community Edition TL;DR: We’re introducing the “free as in beer”, self-hosted and AGPL-licensed Plausible Community Edition (CE). Installation instructions are here. Continue reading -> Jul 6, 2023 Is Google Analytics illegal? Several European Data Protection Authorities say so Is Google Analytics illegal? Yes, say the Austrian, French, Italian, Danish, Finnish, Norwegian, Swedish and other European Data Protection Authorities. Here’s why. Continue reading -> Mar 29, 2023 Key differences between UA and GA4: A guide to a smooth migration Are you considering migrating from Universal Analytics to Google Analytics 4 but are unsure about the differences between the two and how to succeed with the transition? Continue reading -> Jun 22, 2022 How we built a $1M ARR open source SaaS We’ve reached a significant milestone of $1 million in annual recurring revenue (ARR) with Plausible Analytics, a simple, lightweight, open source and privacy-friendly alternative to Google Analytics. Continue reading -> Mar 16, 2022 Google's Universal Analytics has stopped tracking stats on July 1st 2023 (and there's no import to GA4) Google just dropped big news on the business and marketing world! Universal Google Analytics, the current version of Google Analytics, will be sunset and will stop counting stats on July 1st 2023. The new Google Analytics 4 will be replacing Universal Analytics. Continue reading -> Oct 25, 2021 How we bootstrapped our Google Analytics alternative to $500k ARR We’ve had an amazing journey to date. It took us 324 days to reach $400 in monthly recurring revenue (MRR) since we got our first paying subscriber on May 14 2019. Then things got a bit crazy. Continue reading -> Aug 31, 2021 58% of Hacker News, Reddit and tech-savvy audiences block Google Analytics There are several privacy concerns with running Google Analytics but there are worries about data accuracy too. How much data is missing from Google Analytics due to adblockers and privacy-friendly browsers? Continue reading -> Aug 5, 2021 How we scaled support for 4,000+ subscribers and 1,000+ monthly trials (without dedicated support personnel) We’ve grown from less than 100 subscribers to more than 4,000 subscribers since April 2020. With all this success also comes a growing volume of support requests. Continue reading -> May 18, 2021 Google AMP is dead! AMP pages no longer get preferential treatment in Google search Google is rolling out a significant change as a part of their page experience ranking algorithm in June 2021. Continue reading -> May 11, 2021 Core Web Vitals and how to improve the page experience As a site owner, you’ve probably heard about Google’s page experience update and the introduction of Core Web Vitals but what does it all mean? Continue reading -> Apr 15, 2021 How to fight back against Google FLoC Google is starting to track your site visitors for advertising purposes even when you’re not using Google Analytics or having any relationship with Google. Continue reading -> Mar 17, 2021 Best web analytics plugins for WordPress sites Started your WordPress site, published some posts and now want to get some stats to figure out how you’re doing? It’s time to install a WordPress plugin for web analytics. Continue reading -> Jan 28, 2021 What we learned on our journey to $10,000 MRR We’ve made it to $10,000 MRR with Plausible! Several people asked about our lessons learned, so I wanted to share some in this post. Continue reading -> Dec 17, 2020 Lessons from building and growing an open source SaaS Plausible Analytics is the first open source project I’ve been involved in as a developer and maintainer. And what a great journey it has been until now. Continue reading -> Dec 4, 2020 How to find 404 error pages on your website using web analytics Having 404 error pages on your website can lead to a bad user experience, a negative first impression, and even damage your search engine rankings and traffic you get from SEO. Continue reading -> Nov 26, 2020 How to track outbound link clicks using your website analytics Outbound links play a significant role on the open web, but how do you track clicks on outbound links using your website analytics? Here’s a guide on how to automate external link click tracking on your site using Google Analytics and Plausible Analytics. Let’s get started. Continue reading -> Nov 11, 2020 GDPR, web analytics and do I need a privacy policy for my website? TL;DR: A privacy policy is recommended for all sites if you want to be transparent and open to your visitors. If you’re not collecting or processing any personal data and not using cookies, you may not legally need a privacy policy. For all other use cases, a privacy policy is legally required. Continue reading -> Nov 5, 2020 Building Plausible: October 2020 recap We experienced big growth in October, breaking our traffic and signup records once again. These numbers can be attributed to Marko who published three articles that landed on the front page of Hacker News. Here are the stats from last month: Continue reading -> Oct 12, 2020 Open source licensing and why we're changing Plausible to the AGPL license Plausible Analytics is a software as a service open source web analytics project. With the increase in popularity of Plausible in recent months, we’ve become aware that there are risks associated with permissive open source licenses that corporations that don’t care about open source are happy to take advantage of. Continue reading -> Oct 7, 2020 Building Plausible: September 2020 recap Plausible seems to be settling into a more steady rate of growth. I had to double our server capacity in late September to accommodate the new trial signups and customers. Here are the stats from last month: Continue reading -> Sep 29, 2020 How to use UTM parameters to track your marketing campaigns and understand the dark traffic UTM parameters are a useful tool for business owners. They can help you get more insights into the dark traffic, track paid marketing campaigns, newsletters and identify specific pieces of social media content that deliver the best conversions. Continue reading -> Sep 21, 2020 How to get Safari's Privacy Report stamp of approval for your website Apple has declared privacy a “fundamental human right” and now they’re putting their money where their mouth is, and doing something about it. Apple’s Safari 14 browser and its Privacy Report names, shames and prevents websites that use cross-site trackers to profile web users. Continue reading -> Sep 15, 2020 15 best startup marketing practices we say "no" to (while growing our MRR by 1000% in 6 months) Plausible Analyti'''
