["https://plausible.io/wordpress-analytics-plugin"]
title = "Plausible: Privacy-first web analytics plugin for WordPress | Plausible Analytics"
description = "Plausible Analytics is a web analytics plugin for WordPress that is a simple to use, lightweight and privacy-friendly Google Analytics alternative."
full_description = "Plausible: Privacy-first web analytics plugin for WordPress Plausible Analytics is an open source web analytics plugin for WordPress that is an easy to use, lightweight and privacy-friendly Google Analytics alternative. On WordPress Live demo How is Plausible Analytics different from Google Analytics? What are the other features of Plausible Analytics for WordPress? How to get started with Plausible Analytics How to install Plausible Analytics WordPress plugin Insert your domain name and plugin token Oops! The token you used is invalid How to view your stats directly in your WordPress dashboard How to enable a proxy to get more accurate stats Stats not being recorded after enabling the proxy? If the proxy script is slow How to track external link clicks How to track file downloads How to track form completions How to setup custom events to track goal conversions How to send custom properties Custom properties for custom events Custom properties for pageviews How to track ecommerce revenue If you’re not using WooCommerce for your store How to track 404 error pages How to enable site search tracking How to enable hash-based URL tracking How to track visitors who use Internet Explorer How to exclude specific pages from being tracked How to exclude admins and other roles from being tracked Enjoying Plausible Analytics and our WordPress plugin? How is Plausible Analytics different from Google Analytics? Plausible Analytics is built to be a more modern alternative to Google Analytics and other traditional analytics solutions. Here’s what makes us different: Plausible, unlike Google Analytics, doesn’t use cookies, doesn’t use any long-term identifiers and doesn’t track any personal data. We’re exclusively powered by EU-owned cloud infrastructure. Read more on what makes Plausible a privacy-first web analytics Plausible, unlike Google Analytics, is built for speed and performance. Plausible will not slow down your site Plausible, unlike Google Analytics, is simple to use and get valuable insights from. All the key metrics are displayed on one page, including top content, top referral sources, external link clicks and goal conversions Plausible like WordPress but unlike Google Analytics is open source software. You can inspect and review our source code to verify that our actions match with our words Plausible, unlike Google Analytics, is not a free as in beer product. We don’t sell or monetize your site data. We choose the subscription business model rather than surveillance capitalism and are solely funded by the fees our subscribers pay us There’s a 30-day free trial with no credit card required. If you find Plausible useful, you can get on a paid subscription. The plans start at $9 per month and are based on the number of page views your sites have. You can see the pricing here What are the other features of Plausible Analytics for WordPress? Track clicks on external links so you can see which of your affiliate links are more popular than others Track file downloads so you can see which of your documents are more popular than others Track successful form submissions to see conversion rates and conversion attribution of your campaigns Setup goals and custom events using CSS class names so you can track conversions and analyze conversion attribution Check your Plausible stats dashboard directly in your WordPress dashboard Track 404 error pages that people visit so you can fix them and redirect them to more appropriate pages Track post authors, categories and custom taxonomies Send custom properties alongside pageviews or custom events Track purchases and revenue for your ecommerce store Track WooCommerce sales with automatic events such as add to cart, checkout and the purchase funnel Track site search terms Exclude specific pages from being tracked Exclude admins from being tracked. You can exclude editors, authors and contributors from being tracked too Allow specific user roles (editors, authors or contributors) to access the stats dashboard See a link to the post stats in the toolbar while browsing your site How to get started with Plausible Analytics To use Plausible Analytics, you need to register an account. To explore the product, we offer you a free 30-day trial. No credit card is required to sign up. Click here to register. It is a simple process and we only ask for your name and email address. After you verify your email address, you need to enter the domain name of the website you want to track. Please, remove https and www from the URL, just keep the hostname (yourdomain.com). For example, if your site is https://www.yourdomain.com then the part to enter in the “Domain” field is yourdomain.com. That’s it! You have now registered for an account and you have added your website. Now you need to go to your WordPress dashboard and activate the Plausible Analytics WordPress plugin. How to install Plausible Analytics WordPress plugin Here’s how you can install the Plausible Analytics plugin on your WordPress site: Go into the “Plugins” section in the left-hand side navigation within your WordPress dashboard Click on “Add New” In the search box in the top right, type “Plausible Analytics” and press enter Click on the “Install Now” button on the listing of our official “Plausible Analytics” plugin After the installation is finished, click on the “Activate” button You will then be taken through our get started guide to set up the plugin and the different options “Plausible Analytics” entry will also show up in the “Settings” section in the left-hand side navigation of your WordPress dashboard. Click on it to further explore the various options available That’s it! You are now counting your site stats with a privacy-first web analytics tool. You can now go to our website and access your Plausible Analytics account to view the dashboard. There are some features that you can enable in the plugin. Here’s a look at those. Insert your domain name and plugin token In the “Domain Name” field, make sure you use the same domain name as you’ve added it to your Plausible account. Please remove https and www from the domain name, just keep the hostname (yourdomain.com). To automate the plugin setup, you need to generate a plugin token in your Plausible site settings and paste it into the “Plugin Token” field in the plugin. This will make it so that you can take all the actions directly in the settings area of our WordPress plugin without needing to visit your Plausible site settings. You’ll find a link to where to go to generate the token directly in the plugin itself. After you generate a token, you’ll be able to see a list of all your plugin tokens in your Plausible site settings in the “Integrations” section at any time. Oops! The token you used is invalid Are you seeing the “Oops! The Plugin Token you used is invalid” error message after trying to connect your plugin token? Here are the most common causes of that error: Do make sure that you’re inserting the plugin token and not some other key. The plugin token is always in this format: plausible-plugin-xxxxxxxxxxxx. Do make sure to create the plugin token for the exact site that you’re trying to connect to as plugin tokens are site specific If both of these are fine, then please create a new plugin token and then try to connect it to the plugin once again How to view your stats directly in your WordPress dashboard You can view your Plausible stats dashboard directly in your WordPress dashboard without needing to visit our website. In the “View your stats in your WordPress dashboard” section of the plugin settings, enable the “View stats in WordPress” option. You can now go to the “Dashboard” section in the left hand side of your WordPress admin navigation menu. Then click on “Analytics” to view your site statistics within your WordPress dashboard. The site statistics within your WordPress dashboard are available to the administrators by default. In the “Show stats dashboard to additional user roles” section of our WordPress plugin, you can also grant access to the stats dashboard to editors, authors and contributors. How to enable a proxy to get more accurate stats Plausible script is not blocked to the same extent as Google Analytics but we’re blocked by some blocklist maintainers who have taken the stance that they want to block every tracking script and don’t want to have the responsibility to judge what’s good and what’s bad. Site owners feel unfairly targeted and an innocent casualty of this arms race between blocklist maintainers and the adtech industry. Site owners want some data to figure out what’s going on and learn what they can do to improve. It’s unfortunate for them to lose valuable, privacy-friendly insights that help them create a better user experience. We’ve introduced a proxy feature after hearing from so many site owners who expect privacy-first analytics not to be blocked. We wanted to give a choice to people that use Plausible Analytics. Not concerned about missing data? Simply run our default script. A portion of your visitors will block it but otherwise it works all fine. In our testing, between 6% and 26% of people block scripts all depending on the type of the site and the audience. In more extreme cases, with very tech-savvy referral sources these numbers can get up to 60% Are you concerned about missing data? Proxy our script. We’ve made it easy to do so in our WordPress plugin In the “Bypass adblockers” section of our WordPress plugin settings, turn on the “Enable proxy” option If you have a caching plugin enabled, please make sure to clear the cache for the changes to take effect Enabling the proxy will make our script run as a first-party connection from your domain name. The proxy uses WordPress’ API with a randomly generated endpoint, starting with yourdomain.com/wp-json and it creates a randomly named folder and file in the /wp-content/uploads/ directory Stats not being recorded after enabling the proxy? We’ve put a lot of effort to ensure that the proxy works smoothly and have taken measures to prevent conflicts with popular performance optimization and caching plugins. However, sometimes things might not go as planned. Many problems with proxy activation are due to restrictive firewall or security settings, where PHP may not be allowed to fetch and copy external resources to the server. In case plugin conflicts arise with your WordPress, it might cause the stats not to be recorded properly. So please give your integration a quick double-check after you enable the proxy to make sure the stats are being recorded. Some of the common issues that prevent the proxy from being setup correctly are: Browser console errors: After enabling the proxy, visit your website and check the browser console for any error messages related to the proxied script. See more here SSL Certificate Usage: If your site uses an SSL certificate, please go into your WordPress general settings and make sure to add the s in the https:// both in the WordPress Address (URL) and Site Address (URL) fields. Then please do try to enable the proxy again Firewall or Security Settings: Do you or your hosting company have any firewall or other security plugins activated that may affect the ability for WordPress to create files? Please do disable these or do put your proxy file path and directory in the allow list. Then please do try to enable the proxy again Caching: Do you have any caching enabled either within your WordPress admin dashboard, within your hosting company or Cloudflare? Please try to clear all caches and then try to enable the proxy again File Permissions: Do you have correct permissions for WordPress to be able to create files in the uploads directory? The folder permissions (755) for the /wp-content/uploads/ directory and file permission (644) are needed PHP error logs: Do check your PHP error logs after trying to enable the proxy. You may find helpful messages there to guide further troubleshooting After making any changes, remember to disable the proxy and clear all caches. Then, try enabling the proxy again and clear all caches once more. If the proxy script is slow We will send you a notification if the proxy takes too long (>500ms) to send pageviews. This probably means the speed module failed to install automatically. To resolve this: Access your server using (S)FTP, SSH or your host Navigate to the directory of the Plausible plugin, usually wp-content/plugins/plausible-analytics Open the mu-plugin directory within the plugin directory and copy the plausible-proxy-speed-module.php file to the wp-content/mu-plugins folder (if the mu-plugins folder doesn’t exist within wp-content, create it before copying the file) How to track external link clicks Outbound links play a significant role on the open web and Plausible Analytics plugin can help you automate external link click tracking on your WordPress site. In the “Enhanced measurements” section of our WordPress plugin settings, enable the “Outbound links” option. All the external link clicks will start being tracked and will be displayed in the “Goal Conversions” report of your Plausible Analytics dashboard. You’ll see “Outbound Link: Click” goal as soon as the first external link click has been tracked. How to track file downloads File downloads tracking is essential for many site owners and Plausible helps you automate this process. Our file downloads tracking captures a file download event each time a link is clicked with a document, presentation, text file, compressed file, video, audio or other common file type. Both internal and external files downloads are tracked. These file extensions are tracked: .pdf, .xlsx, .docx, .txt, .rtf, .csv, .exe, .key, .pps, .ppt, .pptx, .7z, .pkg, .rar, .gz, .zip, .avi, .mov, .mp4, .mpeg, .wmv, .midi, .mp3, .wav, .wma, .dmg In the “Enhanced measurements” section of our WordPress plugin settings, enable the “File downloads” option. All the file downloads will start being tracked and will be displayed in the “Goal Conversions” report of your Plausible Analytics dashboard. You’ll see “File Download” goal as soon as the first link that leads to a file has been recorded. How to track form completions Form submissions tracking is essential for many site owners and Plausible helps you automate this process. Our form submissions tracking captures a form completion event upon each successful form submission on your site. We have verified and tested this tracking with Contact Form 7, WP Forms, Ninja Forms and Elementor Forms but it should work for most other forms plugins as well. In the “Enhanced measurements” section of our WordPress plugin settings, enable the “Form completions” option. All the successful form completions will start being tracked and will be displayed in the “Goal Conversions” report of your Plausible Analytics dashboard. You’ll see “WP Form Completions” goal as soon as the first successful for submission has been recorded. If you have multiple forms on your site"
