["https://plausible.io/blog/open-source-saas"]
title = "How we built a $1M ARR open source SaaS | Plausible Analytics"
description = "We’ve reached a significant milestone of $1 million in annual recurring revenue (ARR) with Plausible Analytics. This post is a recap of how we got to this point."
full_description = "← All posts How we built a $1M ARR open source SaaS Jun 22, 2022 • Written by Marko Saric We’ve reached a significant milestone of $1 million in annual recurring revenue (ARR) with Plausible Analytics, a simple, lightweight, open source and privacy-friendly alternative to Google Analytics. We’re a completely independent, self-funded and bootstrapped team of four. We’re intentionally small, profitable and sustainable. More than 7,000 paying subscribers trust us, and we’re actively counting stats on more than 50,000 websites with more than a billion monthly page views. We’ve never paid to advertise for Plausible. Our growth comes organically from word of mouth. It’s time to reflect on how we got to where we are. This post summarizes how we built a $1M ARR open source SaaS. How we got to $1M ARR 2018 December: First line of code 2019 January: Public beta launch May: Paid subscriptions launched ($64 MRR) July: First traffic spike ($118 MRR) September: Embracing the open source world ($178 MRR) 2020 February: Looking for a marketing co-founder ($403 MRR) March: Plausible is now a team of two ($433 MRR) April: Picking a fight and going viral ($607 MRR) May: First mention on a prominent site ($1,055 MRR) June: Moving the database to ClickHouse ($1,767 MRR) July: Once again on the top of Hacker News ($2,844 MRR) August: Product Hunt launch ($4,062 MRR) September: Paid out our first salaries ($5,035 MRR) October: Changing our open source license ($6,378 MRR) December: Open source needs a better funding model ($8,999 MRR) 2021 January: Finally sustainable ($11,303) February: Giving back 5% of our gross revenue ($13,576 MRR) March: Scaling our support ($17,550 MRR) April: Put your personal spin on the news ($22,290 MRR) May: More success with Google-related content ($26,422 MRR) June: Robert joins us as the third team member ($29,285 MRR) August: Publishing a study on the usage of adblockers ($35,713 MRR) October: We’ve made it to $500k ARR ($42,624 MRR) 2022 January: “Google Analytics violates GDPR” ($55,411 MRR) February: Cenk joins us as the fourth team member ($62,769 MRR) March: Google kills Google Analytics ($71,311 MRR) April: Import from Google Analytics ($76,312 MRR) June 2nd: $1M ARR ($83,637 MRR) How we got to $1M ARR First, a TL;DR summary: We’ve had a wild, roller-coaster ride. It took us 324 days to reach the first $400 monthly recurring revenue (MRR) after we launched the paid subscriptions SaaS business in May 2019. Then we got some momentum thanks to a couple of blog posts that got a lot of traffic. It took us nine months to go from $400 to $10,000 MRR. Then it took ten months to get to $500,000 ARR, and now eight months later, we’re at the $1 million ARR milestone. We’ve open sourced our code, but we’ve also been transparent about our website traffic since the beginning, so looking at our public stats is a great way to get an overview of our journey to date. 2018 December: First line of code The first line of code for Plausible was written by my co-founder Uku. Uku is a developer. The marketing head at the company he worked for asked him to integrate Google Analytics into their landing page. Uku’s first thought was, “Ugh. Can we just use something other than Google Analytics?”. This is how the idea for Plausible was born. Read more: The analytics tool I want. 2019 January: Public beta launch We launched the public beta on Indie Hackers. Our marketing in the early days was focused on building in public. The latest updates and milestones were posted on our blog, Indie Hackers and Uku’s Twitter account. All the early users came from these updates. Indie Hackers is a wonderful, supportive community and a perfect place to start your “build in public” journey. Take a look at our Indie Hackers profile and read from the oldest post first to better understand how we progressed since the beta launch. We’ve continued to be as transparent as possible to this day. We regularly share our milestones, lessons learned, site traffic and more. May: Paid subscriptions launched ($64 MRR) We launched our paid subscription plans. A piece of widespread startup advice is to always charge more. An important consideration for us was that Google Analytics is free of charge, and people are not used to paying for web analytics. Paid alternatives on the market started at high rates. We wanted to offer fair and affordable prices to incentivize more site owners to ditch Google Analytics. And so we kicked off with a reasonably priced entry point to give owners of smaller sites a chance to de-Google. We had 60 active beta users at this point, and some decided to stick around and pay for our service too. We ended the month with our first paying subscribers and $64 MRR. Read more: I’m launching Plausible. July: First traffic spike ($118 MRR) We had our first traffic spike by getting more than 2,500 visitors in one day. It was thanks to the “You probably don’t need a single-page application” blog post making it to the front page of Hacker News. The post was not strictly related to our product and niche, so the immediate benefits were not that obvious, but it was still lovely to get a spike in traffic. This was our first venture into content marketing and going “viral”. We’re bootstrapped without any advertising budget, so trying to get heard by writing blog posts is the way to go. With content marketing, we get the word out to more people, increase brand awareness, and get links and social media mentions, which eventually results in higher rankings in search results. Content marketing and Hacker News are essential to our growth even to this day. Most people who hear about Plausible hear about us thanks to some of our blog posts and personal recommendations through social media and niche communities. September: Embracing the open source world ($178 MRR) Plausible goes fully open source with the MIT license, and all the code is made publicly available on GitHub. Our repository includes all of the code powering our SaaS with nothing hidden. We did this to be as transparent as possible and to give people more control over their data. Going open source is a great way to build trust in the privacy-first market that we operate in. Plausible continues being fully open source software, and we’ve since made it possible for individuals to self-host our analytics on their servers too. Read more: Plausible is going open-source. 2020 February: Looking for a marketing co-founder ($403 MRR) After a few months of relatively stagnant growth, Uku announced that he’s “been looking for a partner on Plausible since the very beginning of the project. I’m super happy I’ve found someone whose values are very much aligned with the spirit of what I’m trying to accomplish”. This other person was me, and I’m a marketer. Uku cold-emailed me after reading a blog post I published about how to degoogle a website. I thought he built a great product with great potential in a market I was familiar with, so I was up for the challenge. Running, developing and growing a startup in a competitive market such as web analytics is complicated. Uku could now focus entirely on the design and development of the product, while I could take care of the marketing, community management and customer support. And with the two of us focused on different but equally essential tasks (development and marketing), we could make so much more progress than anyone can do on their own. March: Plausible is now a team of two ($433 MRR) I started working with Uku on March 16th, 2020. I remember looking at our stats in the Plausible dashboard; we had 49 visitors in total, and 0 from Google search the day before I joined. I’m a big fan of setting small but realistic goals, so my first tiny goal was to consistently get ten organic visitors from Google search per day. We may be going against Google Analytics, but Google search is still what most people use to search the web, so we needed to start having a presence in the relevant search result pages for Plausible to grow organically. That was my priority. To achieve this, our first few weeks were spent on: Product relaunch (one example being that the early version of Plausible used one first-party cookie) New brand positioning (simple, lightweight, open source and privacy-first Google Analytics alternative) Streamlining the communication to send a consistent message everywhere (as an example, previously, we used the name Plausible Insights in some places and Plausible Analytics in other places) Improving the site structure (we used to have two different sections for content, one titled “journal” and the other “blog”, so we redirected the journal to the blog) Adding a lot of new product-related content (each focus area of our positioning got one article, we published a comparison with Google Analytics and much more) This post has a more detailed overview of this period and my actions. April: Picking a fight and going viral ($607 MRR) On April 8th, I published my first Plausible blog post. Our new positioning was based on how different we are compared to Google Analytics, so we decided to pick a fight. The post went to the top of Hacker News, and it helped us spread the word about Plausible to more people than ever before. I submitted the post myself, didn’t try any tricks to game the system, and we got lucky that so many people found it interesting. More than 25,000 people visited our site on the day we published the post. We broke all our records in April: most traffic, trials and the biggest MRR increase. The post that changed our traction was: Why you should stop using Google Analytics on your website. May: First mention on a prominent site ($1,055 MRR) May started great as we were featured on OpenSource.com as a transparent and open source alternative to Google Analytics. We got 94 trial signups on May 2nd, which is still our best day for the number of new trials. This opportunity came as part of our outreach to different influential websites. Most sites ended up ignoring our messages. It isn’t easy to send so many emails and hear nothing back, but this one fabulous mention from a very relevant site was worth all that silence. We also posted our first tweet on May 18th with the message, “Friends don’t let friends use Google Analytics”. We have a 30-day free trial, so it took some time to see the results from April’s viral post in our MRR. We doubled our MRR during the month and ended May on $1,055 MRR. June: Moving the database to ClickHouse ($1,767 MRR) With all the new trials and customers, and an increase in larger websites trying our service, Plausible became much slower to use. To continue our growth, we needed to improve the underlying technology that we use. We moved from our PostgreSQL database to ClickHouse to make the app much faster and handle much bigger websites. Moving to ClickHouse was the best technical decision we’ve made, and we’re now able to count more than one billion page views per month while still providing a very fast-loading dashboard. July: Once again on the top of Hacker News ($2,844 MRR) We got another Hacker News moment when our post on “how to pay your rent with an open source project” brought us more than 35,000 visitors in a single day. This is a topic that’s dear to our hearts. We also published an overview of our marketing activities and top referral sources: How we grew our startup from $400 to $2,750 MRR in 135 days without ads. August: Product Hunt launch ($4,062 MRR) We launched on Product Hunt. This is typically a big event for startups. Product Hunt was worthwhile, but it’s not our core growth strategy, so it was just another day for us, albeit a bit busier. We didn’t put all of our eggs in this one basket. Launching on community sites gives your project a spotlight for a day or two, but it’s not a sustainable channel to acquire customers in the long term. It brings that famous spike of hope after which follows the flat line of nope. We got more than 1,000 visitors and 15 trial signups from Product Hunt on the launch day, but only a few days later, we got fewer than 20 visitors from there. As far as we’re concerned, launches like this are nice, but they don’t mean much for your continued growth. More is needed. Here’s how not to launch on Product Hunt (and lessons from our successful launch). September: Paid out our first salaries ($5,035 MRR) On September 10th, we paid the first salaries for the two of us. Even though our wages didn’t match what we could command on the job market, we were thrilled to see a green entry on the bank account, paid from our open source project. Pretty wild. It feels great to be able to pay your rent from an open source project. October: Changing our open source license ($6,378 MRR) Due to our increased reach, we became aware of the risks associated with a permissive open source license and of the corporations happy to take advantage of this. We needed to research the different licenses to find the best fit for our needs. I’m pretty new to the world of open source licensing, so I ended up learning about AGPL only a few days before we officially switched. We haven’t had any other issues with this since we made that switch. Read more: Why we’re changing Plausible to the AGPL license. December: Open source needs a better funding model ($8,999 MRR) We shared our lessons learned about running an open source SaaS. One lesson was that donations are not a viable monetization method. We’ve been accepting donations for about six months and had six donations of $5 each. At the same time, our cloud product has grown from $400 to more than $8,500 MRR. We’d love to see more competitive open source alternatives to the products made by surveillance capitalism. A better monetization method means that more people will be able to focus their time working on projects that they truly believe in. This would make the open source software ecosystem much healthier. Running a premium managed service in the cloud while keeping the code open for inspection and self-hosting seems to be a better model for some open source projects such as our one. Read more: Lessons from building and growing an open source SaaS. 2021 January: Finally sustainable ($11,303) $10,000 MRR was a significant milestone. Until this point, between the two of us, we were down more than $50,000 in personal savings since we started working on Plausible. When we reached $10,000 MRR, we could finally cover our costs and slowly start recovering some of the savings lost. We’re delighted we made it to this point while still being fully open source software. Free and open source software can be sustainable and can pay your rent. Financial sacrifice is not required to work on open source. So many good teams and projects are fighting for the open web, and we hope many of them can succeed too. Read more: What we learned on our journey to $10,000 MRR. February: Giving back 5% of our gross revenue ($13,576 MRR) We decided to start giving back 5% of our gross"
