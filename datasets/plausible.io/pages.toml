title = "Introduction to goal conversions and behavior analytics | Plausible docs"
description = 'Goals allow you to track actions that you want your visitors to take on your site. Actions such as signing up to a newsletter, clicking on a "Download" button, registering for a trial account, purchasing a product, clicking on an external link, downloading a file or completing a checkout form of an ecommerce store.'
full_description = 'Events, Funnels and EcommerceIntroduction to goal conversions and behavior analyticsIntroduction to goal conversions and behavior analytics Goals allow you to track actions that you want your visitors to take on your site. Actions such as signing up to a newsletter, clicking on a "Download" button, registering for a trial account, purchasing a product, clicking on an external link, downloading a file or completing a checkout form of an ecommerce store. A goal can be a custom event or a pageview. By setting up custom events or pageviews as goals, you can track the number of conversions, conversion rate, referrer sources and entry pages that are driving conversions and the top pages that people convert on. You can also follow the visitor journey using funnels. After setting up a goal, it will show up in the "Goal Conversions" section of your dashboard as soon as we record the first conversion. Then you can click on the particular goal to filter your dashboard by it and get all the insights on the traffic that has converted on that specific goal. There are several types of behavior analytics tools in Plausible Analytics: GoalExplanationPageview goalsMeasure how many people visit a specific page or section of your site. Use these to track the "thank you" page or the order confirmation page. Since pageviews are collected automatically, you don’t need to change your website’s code to measure pageview goals. This makes them the easiest way to start tracking conversions on your siteCustom event goalsMeasure button clicks, purchases, subscriptions, form completions, clicks on video or audio elements and pretty much any other action that you wish (you can also send custom dimensions alongside custom events for extra insights)Funnel analysisFollow the visitor journey from a landing page to a conversion in order to uncover possible issues, optimize your site and increase the conversion rateEcommerce revenue trackingAssign dynamic monetary values to goals and custom events to track revenue attributionCustom propertiesSend custom data with pageviews and custom events to create custom metricsOutbound link clicksAutomatically measure clicks on external linksFile downloadsAutomatically track when a visitor clicks a link leading to a file404 error pagesAutomatically measure page not found errorsPretty URLs clicksAutomatically track clicks on cloaked affiliate links and other pretty URLsEdit this page'
