["https://plausible.io/open-source-website-analytics"]
title = "Plausible: Open source Google Analytics alternative | Plausible Analytics"
description = "Plausible is an open source analytics tool you can use to check web traffic. It is a simple, lightweight and privacy-friendly Google Analytics alternative."
full_description = "Plausible: Open source Google Analytics alternative Plausible Analytics is an open source, simple, lightweight and privacy-friendly Google Analytics alternative. One aspect that makes Plausible different from many of the other web analytics tools such as Google Analytics is the fact that Plausible is open source software. Let’s take a look at what that means exactly. What is web analytics? What is open source web analytics? What license is Plausible released under? Can Plausible Analytics be self-hosted? Plausible is open in other ways too Open to community feedback with a public roadmap You can open your website analytics and make the stats publicly-viewable too Is Google Analytics open source too? What are the other ways that Plausible is different from Google Analytics? Google Analytics is free so why is Plausible Analytics Cloud not free? How to switch from Google Analytics to an open source analytics alternative What is web analytics? Web analytics is the process of measuring and analyzing the usage of a website. With Plausible activated on your website, you get access to a simple open source analytics dashboard. This simple dashboard includes website metrics such as the number of unique visitors to your site, the number of page views on your individual pages and the referral sources which have sent traffic to your site. All this data you can use to assess the performance of your site and to figure out what you can do to improve your future efforts. What is open source web analytics? Being open source means that our source code is available and accessible on GitHub so anyone can check it out. You can read it, inspect it and review it to understand how it works and to ensure it keeps the data private and secure. This gives you and everyone else full transparency on how we handle the website traffic data. It is this transparency and openness that means that open source products can be more trustworthy than proprietary and closed source products. You can even download Plausible Analytics, install and run it on your own server. What license is Plausible released under? Plausible is open source under the GNU Affero General Public License Version 3 (AGPLv3) or any later version. You can find it here. The goal of the AGPL license is to maximize user freedom and to encourage companies to contribute to open source. You can read more about why we chose the AGPL license for our startup. Can Plausible Analytics be self-hosted? Yes, you can self-host Plausible. Plausible Self-Hosted is our free as in beer and free as in speech version that you have to install, host and manage yourself. We’re open source and all our code is available on GitHub. Take a look at the full details of our self-hosted web analytics solution. Plausible is open in other ways too Open to community feedback with a public roadmap We welcome feedback from our community. We have a public roadmap driven by the features suggested by the community members and we are available to you via email if you have any questions or need any help. You can open your website analytics and make the stats publicly-viewable too Plausible gives you the option to be transparent and open your web analytics to everyone. Your website stats are private by default but you can choose to make them public so anyone with your custom link can view them. You can view stats for Plausible website itself here. Is Google Analytics open source too? No, Google Analytics is not open source. Google Analytics is a closed source, proprietary product. There’s simply no way of knowing what’s going on behind the scenes when you’re using the Google Analytics script on your website. You have to put your trust in Google. What are the other ways that Plausible is different from Google Analytics? Other than Plausible being open source while Google Analytics being closed source, there are many other ways that these two site analytics products differ: Plausible is more simple to use as it tracks a smaller number of metrics and presents them on an easier to understand dashboard. Rather than tracking every metric imaginable, many of them that you will never find a use for, Plausible Analytics focuses on the most essential stats only. And presents them in a more understandable way. Plausible Analytics is lightweight. Our script is a small script that is lighter and faster to load so you will reduce the page weight of your site compared to when using Google Analytics. Our script is more than 75 times smaller than a typical Google Analytics script. Plausible doesn’t use cookies and doesn’t track nor collect any personal data. This means that we are compliant with the cookie law and other privacy regulations out of the box. There is no need for you to include GDPR, CCPA and other consent prompts nor to have a privacy policy because of the Plausible analytics. For further details on the differences between the two, take a look at our Plausible vs Google Analytics comparison. Google Analytics is free so why is Plausible Analytics Cloud not free? Plausible Analytics is an independently owned and actively developed project. To keep the project development going, to stay in business, to continue putting effort into building a better product and to cover our costs, we need to charge a fee. Google Analytics is free because Google has built their company and their wealth by collecting and analyzing huge amounts of personal information from web users and using these personal and behavioral insights to sell advertisements. Plausible Analytics has no part in that business model. No personal data is being collected and analyzed either. With Plausible Analytics, you 100% own and control all of your website data. This data is not being shared with or sold to any third-parties. We choose the subscription business model rather than the business model of surveillance capitalism. If you want our free as in beer solution, you can self-host Plausible Analytics on your own server. How to switch from Google Analytics to an open source analytics alternative Do you have a website or a blog? Give Plausible a chance. Sign up for a 30-day free trial with no obligations and explore our open source site analytics dashboard. You don’t even need to remove your current analytics provider until you’ve tested Plausible and figured out if you like our product. Plausible is simple to set up and integrate into your website no matter which CMS you use or how you’ve built your site. You simply insert our one-line JavaScript snippet into the <head> section of the pages you’d like to keep an eye on and the numbers will start rolling in. You can even import your historical Google Analytics stats into Plausible."
