["https://plausible.io/blog/paid-ads-cookieless-analytics"]
title = "Optimizing paid ad campaigns with cookieless tracking in a post-third-party cookie world | Plausible Analytics"
description = "Let’s explore what we can do as digital advertisers to stay relevant, while respecting user-privacy and staying compliant with privacy-preserving regulatory bodies."
full_description = "← All posts Optimizing paid ad campaigns with cookieless tracking in a post-third-party cookie world Apr 25, 2024 • Written by Hricha Shandily Q﻿uick update: Google announced recently that they are delaying the phasing out of third-party cookies. This is an effort to buy time to balance out the advertising industry’s needs and that of privacy advocates. This buys advertisers some time, but the phase-out (in whatever shape it comes) is still around the corner. It’s useful to prepare for this eventuality. Let’s see how, below. Advertising has evolved from mass broadcasts to individualized targeting. Earlier, advertising success used to come easier with limited media channels like early TV and radio, because of their sheer novelty and lower competition rates. As newer digital mediums came, they also brought an overload of choices –– for both consumers and advertisers. Eventually, the mediums became more sophisticated and more fragmented, transitioning our behaviors from being more mass-oriented to more individualized. Meanwhile, advertising became more accessible to all kinds of businesses, and demanded a more targeted way of being circulated. This would also promise better ROIs for advertisers. We are at a point when segmentation and personalization allow advertisers to not only target specific customer bases, but pinpoint a user to show them the right ad at the right time. This is made possible with a vast structure of digital surveillance, where widespread digital enablers, like the Google ecosystem, use tech to track what their users are doing across websites and devices –– without the user’s explicit knowledge. Such digital surveillance essentially builds very sophisticated and individualized user profiles, learning everything about our lives and behavior patterns –– our favorite color, our preferences, or on which day we talk about buying socks. On the other hand, audiences are far more knowledgeable and demand better standards that resonate with their values and preferences. This tug of war between Google Chrome and privacy advocates has led to a time where privacy-consciousness is at an all-time high, and rightfully so. Naturally, internet-users and governments are unhappy and this made Chrome take down their abundant usage of third-party cookies –– a key element of the tech that makes digital surveillance our daily reality. The “pinpointed advertising” culture has now taken a massive hit. Let’s explore what we can do as digital advertisers to stay relevant, while respecting user-privacy and staying compliant with privacy-preserving regulatory bodies. What’s this babel about third-party cookies affecting advertisers? Replacements of third-party cookies Privacy Sandbox Google’s Privacy Sandbox APIs for private advertising Concerns with these APIs Publisher-side tracking Server-Side Tracking Fingerprinting Universal IDs Identity Graphs How can digital advertisers adapt? Google Advertising First-party data meets Google Ads P.S. Google ads remarketing using server-side tracking Privacy Sandbox APIs Other advertising solutions worth exploring Social media advertising Contextual Advertising Newsletter advertising Private Marketplace Deals (PMP) Other browsers based advertising Retail Media Networks Enhanced identity based ad tech tools Exploring newer tech Incorporate privacy-first analytics tools Other important things to keep in mind Spread your assets From Mad-vertising to Advertising Connecting > Snooping Value-based Ads > Product Comparisons Mottos > forgettable stuff Parting words What’s this babel about third-party cookies affecting advertisers? A third-party cookie is a tracking code that is set up on a visitor’s browser and device by a foreign party other than the website that’s being visited. These cookies track individual user behavior across multiple sites and devices, and unlock comprehensive insights into their online activities and interests. This data is utilized to create valuable individual user profiles, and understand their behavior patterns and, in turn, behavior predictions. Such insights empower the ad tech to be able to predict clickthrough rates, and help advertisers optimize their ads and targeting reach. A big use case of that is remarketing campaigns that show “reminder” ads to an audience who have engaged with a brand once but haven’t taken a desired action such as signup or purchase. This won’t be possible without third-party cookies, which provide advertisers with the intelligence to locate previous web visitors and show them their ads. In the offline world, it’d have been like putting an undercover tracker on a customer that came to your grocery store and left. This tracker is engineered by a company that specializes in monitoring people’s behaviors and creating detailed profiles. Once a customer leaves the store, even if they didn’t buy anything, the tracking company (which also works in advertising technology) helps the store’s advertising manager. They can follow the customer’s journey beyond the store, continually showing them personalized ads for the store, enticing them to return and make a purchase. That undercover tracker is a third-party cookie in a nutshell. Mostly, advertisers don’t employ them directly. This happens automatically, behind the scenes, 24x7, through Google’s services. To put into perspective, websites employ such third-party cookies on a user’s browser through a code snippet from Google Analytics, or an embed from a YouTube video –– whether explicitly disclosed or not. Since Google also operates a vast network of Android apps, search engine, and other services to gather loads of first-party and third-party data on individuals, it helps it make its advertising reach and effectiveness very targeted and robust –– something advertisers bear the fruit of. For this privacy-intrusive nature of third-party cookies, they have been actively criticized by digital privacy advocates. This led to the formation of regulatory bodies like the GDPR (General Data Protection Regulation) and CCPA (California Consumer Privacy Act), that made the collection and usage of personal data of online users much stricter. We explain more in depth about third-party cookies, the role of Google in surveillance capitalism, why Chrome is having to phase them out, and what it means for digital marketers in this article. All in all, if you use Google’s advertising services — such as on Google Search, YouTube, Google Display Network, Google Shopping, Google Play, and Local Services — and especially rely on remarketing ads to convert sign-ups or other actions, you may need to revisit your advertising strategy because Google Chrome has slowly started phasing out third-party cookies and plans to complete the process in early 2025. Replacements of third-party cookies As third-party cookies saw a looming demise, many tools and services –– some by Google itself, and some by other organizations –– jumped to save the day. The solutions aim to replace the third-party cookies by doing the same job as they did, by being more compliant-friendly. Many of these alternatives are not truly privacy-friendly but are more compliance-friendly due to the strict nature of the aforementioned regulatory bodies. Let’s explore: Privacy Sandbox The Privacy Sandbox is Google’s initiative to build a more private web. It has certain APIs to help advertisers, while staying compliant with regulatory bodies. In short, the approach followed by them prioritizes concealing personal data points of the Chrome-users, but still tracks our cross-site behavior. So whether they are truly privacy-preserving or not is debatable. Let’s explore the four main advertising APIs that replace the traditional third-party cookies: Google’s Privacy Sandbox APIs for private advertising Topics API This proposal talks about tracking a Chrome user’s cross-site behavior but promises to only note the “topics” of the kind of websites they visit, and not “identify” a user. For eg. If I browse websites related to travel in Europe, Chrome would note that as a topic. This information would be used to show me relevant and “safer” ads. Protected Audience API This proposal essentially shifts the power to see ads into the hands of the end user’s browser. Here’s how it works: When a Chrome-user visits a website that sells products, like an online chocolate store, a piece of JavaScript code on the site notes your interests based on what you look at — for example, milk-based chocolates. This preference is “securely” stored in your browser, not on any external server. Then, when you visit another website that displays ads, the system uses the preferences stored in your browser to show you ads that match your interests, like those for milk-based chocolates. Private aggregated API This API collects data about what pages you visit and what items you are interested in, when you visit different websites on Chrome. Instead of keeping specific notes that could identify you personally, it mixes your activities with data from lots of other people. This way, the participating websites get a big picture of what’s popular or not –– the “aggregated data” –– without knowing specifically who likes what. Attribution Reporting API This API supports conversion measurement for Google Ads. Advertisers would need to embed specific tracking information within their ads. When these ads are displayed on publisher sites, any engagements (clicks or views) would be logged by the user’s browser. If the user ends up performing a conversion action on the advertiser’s site, the browser matches this activity with the ad interaction to attribute the conversion accurately. Concerns with these APIs Keeps the user in gray Once the advertiser activates the APIs, they are implemented automatically in a visitor’s Chrome browser. The technical jargon and complexities involved can make it difficult for Chrome-users to understand, or even discover, they are being tracked behind the scenes and if they can control it. Lack of transparency There is a lack of transparency about how Google servers really process, mine, and store this data behind the scenes. This makes it uneasy to trust Chrome with personal data. Miss the mark These proposals still don’t meet the ask of Chrome users to not be covertly tracked anyway, and raise concerns on tracking browsing habits, including exposure of sensitive information that a user might be browsing about. Too volatile for advertisers Even for advertisers, the APIs don’t present very lucrative alternatives to third-party cookies because of their inability to meaningfully understand an end user’s nuanced interests and rightfully balance effective advertising with user privacy. Moreover, if the new APIs aren’t widely adopted by advertisers, or if adoption rates vary significantly, it could lead to a fragmented market where different parts of the internet measure and value ads differently. IMHO, if these proposals were to be implemented with privacy-by-design principles, the functionality in Chrome to automatically track its users’ browsing habits would have been turned off by default. This’d give users the choice to opt-in to being tracked and shown relevant ads, rather than requiring them to discover these practices themselves and opt-out later. Such an approach could have truly empowered users, providing them with more control over their personal information and aligning better with the intent of privacy-friendliness –– the nucleus of the ongoing ruckus. Publisher-side tracking Ad publishers or sellers are the websites that display ads of an ad buyer, to the end user. They usually have access to their visitors’ logged in data and site usage patterns. Some examples include site registrations, subscription forms, user interactions, and other first-party data. Such data can prove to be valuable for helping with audience segmentation and targeting features in Google Ads. Any personally identifiable information, like names, emails, addresses, needs to be hashed. Here are a couple of examples of such features from Google Ads: Publisher Provided Identifiers, to provide unique identifiers collected by the publishers. Publisher Provided Signals, to provide user insights collected by publishers, such as user behavior or preferences. Server-Side Tracking Server-side tracking bypasses the need for cookies by moving the tracking from the client-side (a user’s Chrome browser) to the server-side (an advertiser or an ad-tech provider). The server tracks user behaviors like clicks, form submissions, or page visits –– making it all first-party to the platform. After collecting this data, the advertiser’s server can then communicate directly with other platforms (such as Google Ads) via APIs. Sensitive information is supposed to be handled within the server’s controlled environment and can be hashed to protect identities. You can utilize Google Tag Manager’s server side tags to make use of this functionality, directly upload first-party data to Google Ads, or utilize other services that are known to help with this functionality. If you decide to do this, be sure to: Disclose how you collect, process and use your customers’ data to them. Put user consent forms into place. Be extremely careful with handling sensitive data and make sure that it is properly hashed before being sent to any third party. Put security measures in place for protecting the data from breaches and leaks. Carefully check for any other compliance-requirements with regulatory bodies like the GDPR, CCPA. Get a lawyer’s word, if it helps. Lastly, don’t rely on hyper targeting your users and being creepy on them. Show your commitment to providing a secure and nice customer experience. Fingerprinting Cookies store information on a user’s browser and device. Whereas, “Fingerprinting” services work by collecting various details about a user’s device and browser settings, such as screen resolution, operating system, browser version, installed fonts, etc. These data points are combined to create a unique identifier or “fingerprint” for each user without needing to store any information on their devices. With this method, you can continue ID’ing users for targeted and retargeted advertising. However, fingerprinting raises even deeper privacy concerns because it is harder for users to detect and control them as compared to cookies. Even Google’s Privacy Sandbox blocks fingerprinting services. Universal IDs Universal IDs essentially do what third-party cookies do, but in a supposedly more privacy-compliant way. For eg. The Trade Desk’s Unified ID 2.0, ID5, and similar services allow various parties in the advertising ecosystem to use a common, anonymized ID to follow a user around on the web, much like third-party cookies. Such user IDs are hashed or anonymized to guarantee identity protection. However, these solutions miss the intent of privacy advocates to protect users from being creeped upon, or shown intrusive ads. While some solu"
