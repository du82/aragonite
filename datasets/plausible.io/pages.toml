["https://plausible.io/changelog"]
title = "What’s new in Plausible Analytics | Plausible Analytics"
description = "This is the changelog for Plausible Analytics. It lists new and updated features so you can get a quick overview of what’s new in your Plausible account."
full_description = '''What's new in Plausible Analytics Plausible is updated multiple times per week. Here we list major new features for a quick overview. Take a look at our feedback board for what's coming up next. Follow us on Twitter, LinkedIn or Mastodon for more updates. Feb 5, 2025 Automatically track form completions with the WordPress plugin We just released version 2.2.0 of the Plausible WordPress plugin. The highlight of this update is you can now track contact form submissions automatically, without any manual tagging or extra setup. We have verified and tested this tracking with Contact Form 7, WP Forms, Ninja Forms and Elementor Forms but it should work for most other forms plugins as well. To enable form tracking: Go to the “Enhanced measurements” section in the Plausible WordPress plugin settings. Toggle on “Form completions” tracking. Once enabled, all successful form completions will be tracked and displayed in the “Goal Conversions” report in your Plausible Analytics dashboard. You’ll see a “WP Form Completions” goal appear once the first successful submission is recorded. If you have multiple forms on your site, you can click on this goal to see a breakdown by page. T﻿o learn more about the Plausible WordPress plugin, visit our guide. Jan 23, 2025 Exclude goal conversions We’ve added a new filter option to the dashboard when analyzing by goals. In addition to the existing “is” and “contains” operators, you can now use the “is not” operator. This enhancement allows you to segment and analyze those sessions in which visitors didn’t convert on specific goal(s). Jan 21, 2025 Plausible Analytics Looker Studio Connector is live! The official Plausible Analytics Looker Studio Connector is now available! Easily fetch your Plausible Analytics data using the Stats API and create custom, dynamic reports directly in Google Looker Studio. Find the official connector here. Get started with our setup guide. Nov 19, 2024 Introducing Top Channels Report You can now find the all-new Top Channels report on your dashboard. It automatically groups your traffic into key marketing channels like Direct, Organic Search, Referral, Paid Social, and more. For a full list of channels, check out our documentation. When you click on any channel, your dashboard will filter to show the sources under that category. For example, Organic Search will display sources like Google, DuckDuckGo, Bing, etc. This gives you a complete view of your most effective marketing channels in one place, without the need to manually combine data from different reports. You can easily track key metrics like unique visits, engagement, bounce rates, goal conversions, etc., by channel, helping you make more targeted optimizations and focus your marketing efforts where they’ll have the greatest impact. Oct 30, 2024 Compare all metrics over time periods Previously, the “Compare” date ranges option allowed comparisons only for top metrics and the line graph. Now, you can compare all dashboard metrics! Once you activate date range comparison (by clicking ‘X’ or using the time range selector), you’ll see colour-coded arrows next to each metric, indicating improvements or declines compared to the previous period. Hover over any arrow for a detailed breakdown. Oct 9, 2024 Stats API V2 is here W﻿e have made significant improvements to the Stats API: a way to retrieve your stats programmatically. The new V2 offers simpler querying, more flexibility with custom metrics, filters, and time ranges, and better performance when handling complex queries and large datasets. Q﻿uick overview of the new capabilities: The new API supports breakdowns by multiple dimensions (previously named properties) and time ranges. Interactive documentation and playground which allows testing out queries in the documentation itself. New dimensions `visit:country_name`, `visit:region_name` and `visit:city_name` which simplify analyzing user behavior by location. New API supports custom ordering of results. Improved filtering – New structure requires less work from users to escape things. New regular expression matching operator. Complex conditions using OR/AND/NOT conditions. Increased limits for users on how much data is returned by a request for ease-of-use. Oct 7, 2024 New Shopify integration for tracking e-commerce events W﻿e have migrated from Shopify’s deprecated “Additional scripts” feature to the new “Pixels” setup. This ensures a much easier and efficient tracking of e-commerce events moving forward. You can now effortlessly track checkout pages and customer events like site searches, adds-to-cart, started checkouts, purchases, etc. on Shopify. You can track revenue attributions as well. Simply copy and paste our pre-built code blocks into your Shopify store. Visit our documentation to get started. Sep 30, 2024 Remote logout You can now log out of active sessions on other devices and browsers, enhancing account security and providing better control over your login sessions. Visit your “Account Settings” and find the “Login Management” section to manage your sessions. Sep 13, 2024 Sort reports by performance metrics You can now sort your reports by performance metrics such as Visitors, Pageviews, Bounce Rate, and more. Easily organize your data in ascending or descending order by clicking the “Details” option to expand the report and selecting any metric heading to sort. Sep 2, 2024 Setup enhanced measurements effortlessly. It is now easier than ever to implement enhanced measurements to your Plausible setup. During onboarding, simply choose the measurements you want using a checklist. We’ll provide an updated code snippet, so you won’t need to handle the code yourself. You can also update these settings anytime by clicking “Review Installation” on the General page of your “Site Settings”. Aug 9, 2024 Edit goals, and full Browser & OS data Editable Goals: You can now edit Pageview and Custom Event goals, including changing their settings and display names. This makes your goals more personalized and your reports and funnels more organized. Full Browser & OS Data: We’ve also added detailed browser and OS data! Now you can see all browsers, browser versions, OS, and OS versions used by your visitors, along with metrics like bounce rate and visit duration. Jul 18, 2024 Edit funnels Have you set up some funnels to help you boost conversion rates? You can now edit funnel steps or rename any of your existing funnels directly from your site settings. Jul 15, 2024 Traffic drop alerts In addition to the traffic spike email alerts, you can now enable traffic drop alerts as well. This can be useful to notify you if your site has a technical problem, an issue with your Plausible integration or some trouble with the marketing campaigns you’re running. See more here. Jun 24, 2024 More powerful and flexible audience segmentation You can now segment your audience by “does not contain” in addition to “is”, “is not” and “contains”. Explore the “Filter” menu where you can also search for anything or filter traffic by multiple entries (say multiple countries or multiple referral sources). Note that when you view a specific audience segment, your marketing funnels are filtered to show only the activity from that segment. Jun 3, 2024 You can now filter and export your imported data We’ve made some improvements to the imported data from UA, GA4 and CSV: Filtering imported data: You can now filter imported data directly from the dashboard and within the stats API. Please note that due to its nature, the imported data filtering capability is limited compared to our native data filtering. Details here Exporting imported data: You can now export imported data using the CSV export and the stats API May 28, 2024 A tool to help you check if Plausible has been integrated correctly There’s now a testing tool to help you check if Plausible has been integrated correctly. It sends test traffic to your site to ensure that everything is working. And if we encounter an issue with your integration, we will provide tips on how to fix it. You can find the testing tool both as part of the onboarding process for a new site and directly in the site settings of any site. Learn more. May 15, 2024 Search Console filtering is here You can now filter your dashboard by page, country or device and see the keyword terms for that segment of your audience. We now also display impressions, CTR and position for each search term. Haven’t connected your Search Console to Plausible yet? See how to do it here. May 13, 2024 Import GA4 custom events (and add all existing events with a single click) Our GA4 import functionality now imports your custom events data as well. If you’ve previously imported the GA4 property and now wish to include your custom events, please delete the previous import and do a new import. Details here. We’ve also improved the process of adding custom events as goals in your site settings. You no longer need to manually add events one at a time and can now add all existing events with a single click. More here. May 8, 2024 CSV export and import We’ve improved our CSV export functionality. You can still export any segment of your audience directly from the dashboard but now you can also perform a full export from the site settings without any limits on the number of entries. See more here. And you can now also import external data using CSV files. The CSV import supports Plausible data by default but can also be used to import data from other sources if the external data is formatted according to our guidelines. See the full details. Note that our Google Analytics importer is still the recommended option when looking to import the data from UA and GA4. And if you’re looking to transfer a site from one Plausible account to another, the transfer ownership functionality is the recommended way. Apr 23, 2024 Import GA4 stats It’s now possible to import both UA and GA4 properties into the same Plausible dashboard. We’ll automatically detect time ranges to prevent double counting of periods and to avoid any gaps in the data. You can learn how our Google Analytics import works here. Apr 17, 2024 Filter stats by subdomain and block traffic from unwanted hostnames You can now filter your stats by hostname. This allows you to view a global overview of traffic across all hostnames as well as segment traffic by individual subdomains all in the same Plausible dashboard. It’s possible to apply a hostname filter both by using the filter button in the dashboard and through the stats API. Learn more about hostname filtering. Do you see some unwanted hostnames in your list? You can validate the origin of your traffic and block all unwanted hostnames. This feature is in addition to being able to block traffic by IP address, country and page. See how to block specific origins of traffic. Mar 22, 2024 Display total conversions and conversion rate over time You can now click on the “Conversion Rate” and the “Total Conversions” metrics in the top graph to view the trend over time. These metrics have now also been added to the “visitors.csv” file in the CSV export. And “conversion_rate” is now also available in the stats API. Feb 27, 2024 See percentage of visitors using VPNs (and block traffic from particular countries) We’ve improved the accuracy of the “Locations” report. Visitors that use VPN services are now grouped under the “Anonymous VPN Service” entry in the Countries tab. This eliminates noise that VPNs add to locations and makes it easy to view the percentage of your visitors using VPNs. On a related note, it’s now possible to block traffic from particular countries from being recorded in your dashboard. This is a more permanent option compared to our filtering which allows you to temporarily exclude traffic from some countries when doing reporting. See more here. P.S. January not only marked our 5th anniversary but it was also our best month yet in terms of MRR growth! We’re celebrating these milestones with our first logo redesign in all this time. Feb 13, 2024 Segment by multiple custom properties Do you send custom properties alongside pageviews and custom events? You can now segment your audience by multiple custom properties. Just keep selecting additional custom properties in your dashboard as you’re filtering. You can use the filter button on the top right of the dashboard to do the same too. There we’ve also added the “contains” option for even more powerful segmenting. P.S. It’s now easy to exclude your internal traffic from being counted in your stats. See how. Jan 24, 2024 Improved bot detection We’ve been working on improving our bot detection. We now: Block traffic based on the User-Agent header Filter out known referrer spam domains Block traffic originating from data centers Detect and exclude unnatural traffic patterns All this is enabled for all sites out of the box so you don’t need to worry about having bots in your stats. P.S. Today marks 5 years since we launched Plausible! Thanks to your trust and support, we’ve grown to a team of 8 and have counted more than 73 billion pageviews in a privacy-friendly way! ❤️ Dec 6, 2023 Two-Factor Authentication now available You can now enable two-factor authentication (2FA) as an extra security layer for your Plausible account in your account settings. You can read more details here. Nov 13, 2023 Pin your most-used sites for quick access You can now pin sites that you want to feature at the top of your sites page. You can pin up to nine sites. The most recently pinned site will automatically appear at the top of your list, helping you organize your dashboards by how often you use them. Your pinned sites will also show up in the site switcher list that you can see within each dashboard by clicking on the site name in the top left. You can navigate between the sites in the site switcher list using keyboard shortcuts 1 to 9. Nov 8, 2023 "Business" subscription plan is here Since the launch in 2019, we’ve continuously worked to improve our product and infrastructure. We now have 8 full-time team members and several paid external contributors. We don’t have any investors, so all this is solely funded by the fees our 12,038 subscribers pay us. Thank you for your trust and support! ♥️ One of our commitments has been stability in pricing. Nobody likes price hikes, so we’ve refrained from increasing the cost of Plausible subscription for our loyal subscribers so far. We plan to continue with that approach. In light of this, we’ve just introduced our new “Business” subscription plan. The “Business” plan is designed to offer more advanced business features while helping us cover our costs. If you want to keep access to these premium “Business” features, which currently include funnels and ecommerce revenue, you can upgrade to the new plan with the latest pricing. If you upgrade to the new plan, the amount you’ve already paid for your current subscription will be adjusted for the remaining time, ensuri'''
year_published = 2025
year_updated = 2025
