["http://www.play-asia.com/info/helpassistance"]
title = "Playasia.com Help Desk: Assistance for New Customers"
description = "Online shopping for Import Video Games, Digital Codes, iTunes Cards, Mobage & PSN Cards, Movies, Music, Electronics, Computers, Software, Books, Apparel, Personal Care,  Toys & more."
full_description = '''Placing Your First Order Placing an order with Playasia is easy. There's no need to create an account first. An account will be created once you've placed your first order online. We cannot accept orders by phone, fax or e-mail. All orders must be placed online. Setting Your Currency and Language Playasia allows you to view product prices in various currencies and view ordering help in your local language. You can adjust these settings at the top right corner of each page on the website. Product prices will always be listed in US Dollars, but the converted value will be displayed based on your local currency (Euro, UK Pounds Sterling, Australian Dollars, Hong Kong Dollars, etc.). All credit cards will be billed in US Dollars. Finding Items First, you will need to browse or search for the items you would like to order. A keyword search box is located at the top of our page. You can also browse products directly through our categories which are listed on the top of our site. When you find an item that interests you, click the title, name or picture of the item to see the detailed product information page. Here you will find more information about the item, including availability and estimate of how long it will take before the item will be ready to leave our distribution center. Adding Items to Your Shopping Cart If you want to order an item from Playasia, click the "Add to Cart" button on the item's product information page (or the small "Buy" link that can be found on other product listing pages). Once you've added an item to your shopping cart, a new page will be displayed with a confirmation. You can now continue browsing for other products. You can access the contents of your Shopping Cart at any time by clicking the "Cart" icon at the top of every page on the website. Proceed to Checkout Take a moment to review all of the items you've placed in your Shopping Cart. When you're ready to place an order for all the items in the Shopping Cart, click the "Checkout" button. You will be taken to the first page of the order form.'''
