["https://play.date/dev"]
title = "Develop for Playdate"
description = "It’s yellow. It fits in your pocket. There’s a crank. It comes with 24 free games to get you started. Say hi to Playdate from Panic."
full_description = "SDK Pulp Links Dev Help Playdate SDK All you need: Lua and C APIs, docs, as well as a Simulator for local development, with profiling and more. I agree to the Playdate SDK License. Download Playdate SDK 2.6.2 for macOS Download Playdate SDK 2.6.2 for Windows Download Playdate SDK 2.6.2 for Linux See what's new Playdate Development Documentation The official reference documentation for programming Playdate games. Inside Playdate (Basics of Playdate + Lua APIs) Inside Playdate with C (C language APIs) Designing for Playdate (Best practices for Playdate games) Libraries & Tools Tutorials, editors, importable libraries, engines, templates, bindings, and more helpful resources from our developer community. Dev Tool Links Caps Online bitmap-font editor for Playdate fonts. Draw your own typographic characters, edit existing fonts, kern and preview them—all right here. MAKE SOME FONTS Playdate Mirror A desktop app that mirrors the screen of your connected Playdate in real time. Perfect for capturing Playdate video so you can stream it or record it locally. Available for Mac, Windows, and Linux! Download Mirror Nova You can use any code editor you like with our SDK. We happen to make a pretty nice one for macOS, and it's great for Playdate development, with easy building and debugging. Try Nova for free! SDK Support Dev Forum The place to talk to other Playdate developers about your game and see theirs. Post your progress, or questions about best practices and cool tricks. Dev Forum Report SDK Bugs We're constantly improving the Playdate SDK. If you run into a snag making your game, or you have an API idea, let us know! SDK bug report SDK feature request Playdate SDK is made by a small team here at Panic. Meet them! pulp Web-based game editor for Playdate. Pixel art, chiptune music, and simple scripting built right in. It's fun! TRY PULP NOW Pulp Support Pulp Forum Ask questions about your Pulp game, share code tips with other developers, and learn from their source code and tutorials. Pulp Forum Report Pulp Bugs If you believe you've found a bug in Pulp—an issue in our code, not yours—we'd appreciate it if you let us know. Thanks! Pulp bug report Pulp is made by an even smaller group of people. Meet them! Playdate link badges for developers. Use these to link to your game. Developer News Sign up to receive occasional Playdate developer updates. Email Address Notify Me!"
