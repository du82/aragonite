["https://plblog.danieljanus.pl/2023/10/17/programowanie-wyborcze"]
title = "Programowanie wyborcze"
full_description = "A więc już wszystko prawie wiadomo. Kiedy to piszę, jest jeszcze poniedziałek; policzone są głosy z ponad 99% komisji i ostateczny podział mandatów, jeśli jeszcze się zmieni, to minimalnie. W tej chwili Sejm X kadencji zarysowuje się tak: Oficjalne wyniki poznamy pewnie dopiero we wtorek, 17 października. Ale już dziś od wczesnego popołudnia można było się emocjonować przybliżeniami podziału sejmowych mandatów, generowanych na podstawie danych cząstkowych spływających z PKW. Te dane co kilka minut aktualizowały się na specjalnej stronie, którą zrobiłem w kilka godzin. Kłębią mi się w głowie rozmaite myśli na temat tego dnia. Ta notka jest próbą retrospekcji i odpowiedzi na kilka pytań. Jedno z nich brzmi: czy warto było poświęcać czas na napisanie programu, którego czas życia to niecała doba? Kiepsko spałem poprzedniej nocy. Długo nie mogłem zasnąć, czekając na late poll i oglądając na stronie PKW wyniki z pierwszych komisji; po przebudzeniu rzuciłem okiem na wyniki cząstkowe (bardzo wtedy pesymistyczne dla opozycji) i pomyślałem: ciekawe, jak to wygląda w przeliczeniu na mandaty? Strona PKW nie przeliczała tego na żywo, więc stwierdziłem, że skorzystam z okazji i zaimplementuję algorytm d'Hondta. Ile w końcu czasu – myślałem – może to zająć, plus prosty scraping strony PKW? Około 9 rano odpaliłem Emacsa, a o 16 strona była gotowa i udostępniłem ją w social mediach. Gdybym wtedy wiedział o znakomitym serwisie Michała Kostyka, który robi to samo i jeszcze więcej, to pewnie po prostu wgapiałbym się przez resztę dnia w tamtą stronę. Tym niemniej cieszę się, że nie wiedziałem. Każdy dorosły obywatel powinien przynajmniej raz napisać własną przeliczarkę głosów na mandaty. https://t.co/HMVxFr2Tvu Wokół metody d’Hondta przeliczania głosów na mandaty narosło wiele mitów. Wydaje mi się, że jako społeczeństwo mało rozumiemy, jak to w praktyce działa. Po zakończeniu liczenia głosów PKW ogłasza wyniki, wykonuje „magiczne szuru-buru” i ogłasza, kto został posłem. Sam nie byłem pewien, czy dobrze to rozumiem, i miałem ochotę sprawdzić swoje rozumienie w praktyce. Jeśli wyjdą mi takie same wyniki, jak koniec końców ogłosi PKW, to znaczy po pierwsze, że dobrze rozumiem – a po drugie, że proces demokratyczny zadziałał transparentnie i można mieć do niego zaufanie. Gdyby zaś coś się nie zgadzało, to warto przyjrzeć się bliżej."
