["https://plblog.danieljanus.pl/2012/12/24/jlm"]
title = "JLM: o to chodzi"
full_description = "Jeśli próbowaliście, Drodzy Czytelnicy tego bloga, kiedyś zgłębić jakiś temat czytając poświęcone mu artykuły naukowe, to wiecie, że to kosztuje. I to sporo. Typowa cena za pojedynczy artykuł w wersji elektronicznej to kilkanaście-kilkadziesiąt dolarów; a jeśli chce się pozostawać z tematem na bieżąco, pozostaje subskrypcja czasopisma, której koszty potrafią iść w tysiące dolarów rocznie za periodyk. Jeśli nie jest się afiliowanym przy jakiejś instytucji, która ma wykupione odpowiednie subskrypcje, albo nie jest się w stanie znaleźć biblioteki z takowymi, to dostęp do interesującej nas wiedzy jest praktycznie zablokowany. Sprawy nie ułatwia fakt, że niektóre wydawnictwa uznanych periodyków stosują praktyki niekoniecznie godne moralnej aprobaty, jak grupowanie swoich publikacji w paczki i oferowanie ich subskrypcji tylko w tej formie (oczywiście po odpowiednio wysokich cenach), bez możliwości otrzymywania poszczególnych tytułów à la carte – przez co biblioteki zmuszone są płacić za materiały, z których nikt potem nie korzysta. Na początku roku głośny był bojkot wydawnictwa Elsevier zainicjowany przez Tima Gowersa, laureata Medalu Fieldsa; pod petycją podpisało się ponad dziesięć tysięcy naukowców reprezentujących rozmaite dziedziny wiedzy. Kto na tym zyskuje? Właściwie wyłącznie wydawcy (Wikipedia podaje, że dochód netto wspomnianego wydawnictwa Elsevier za rok 2010 wyniósł ponad miliard dolarów). Kto traci? My wszyscy, i to na wiele sposobów. Raz dlatego, że wydatki na czasopisma naukowe stanowią lwią część i tak skandalicznie niskiego budżetu bibliotek placówek naukowych (nawet jeśli udało nam się już znaleźć artykuł w bibliotece, i tak za niego zapłaciliśmy wydawcy wszyscy z naszych podatków); po wtóre – chciałoby się, żeby wiedza była wolna: żebyśmy uzbrojeni tylko w naszą własną cierpliwość i pasję byli w stanie dzięki dostępowi do niej zrobić różnicę."
year_published = 2012
