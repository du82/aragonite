["https://plblog.danieljanus.pl/2010/11/15/toccata-galuppiego"]
title = "Wiersze nieprzetłumaczalne: Robert Browning, „Toccata Galuppiego”"
full_description = "„Nie ma wierszy nieprzekładalnych, są tylko leniwi tłumacze”. Taki aforyzm nieznanego autorstwa cytuje Stanisław Barańczak w „Ocalonym w tłumaczeniu”, zastrzegając się, że nie jest pewien jego słuszności. I choć Barańczak kontestuje istnienie takich wierszy, których on sam nie potrafiłby na polski przełożyć, nieprzekładalności dopatrując się raczej w tłumaczeniach w drugą stronę – ja od czasu do czasu, zastanawiając się nad tym, jak po polsku mógłby brzmieć ten lub inny wiersz, dochodzę do wniosku, że dobrze przetłumaczyć się go nie da. Dziś przykład: Toccata Galuppiego (A Toccata of Galuppi's) Roberta Browninga, wiersz z roku 1855 ze zbioru „Women and Men”. Oh, Galuppi, Baldassaro, this is very sad to find! I can hardly misconceive you; it would prove me deaf and blind; But although I take your meaning, ’tis with such a heavy mind! Mówię „posłuchajmy”, a nie „popatrzmy” albo „przeczytajmy”, bo to jeden z tych wierszy, które brzmią; w nim melodia tekstu jest co najmniej równie ważna, jak jego dosłowny sens. Napisałem tak, jak gdyby dało się oddzielić te dwie rzeczy, ale to nieprawda. Ten wiersz jest autotematyczny: jest o muzyce i zarazem jest muzyką. I to taką, która jest w stanie przenieść słuchacza w nigdy niewidziane krainy z całym ich bogactwem, tak, aby czuł tam swoją obecność niemal namacalnie. I właśnie przeniesienie tej muzyki w obszar naszego języka wydaje mi się niemożliwe do urzeczywistnienia. Po pierwsze – rytm. W oryginale jest to peon trzeci z kataleksą, w którym każdy wers składa się z czterech stóp. Tak przynajmniej ja to słyszę; można też to traktować jako ośmiostopowiec trocheiczny (tak podobno pisał o nim sam Browning w liście do F. J. Furnivalla – podaję za wydaniem z komentarzami pod redakcją Woolforda i Karlina), ale moim zdaniem pierwsze akcenty w każdej parze trochejów są znacznie słabsze niż drugie. Jednak ta subtelna różnica jest mało istotna wobec pytania, jaki rytm wybrać dla polskiej wersji?"
