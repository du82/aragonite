["https://plblog.danieljanus.pl/2013/05/22/bandsmen"]
title = "Szaleniec ze zdalnym detonatorem"
full_description = "W lipcu 1982 roku w londyńskich parkach Hyde Park i Regent's Park odbywały się uroczystości wojskowe. Doszło do dwóch eksplozji, wywołanych, jak później ustalono, wybuchami zdalnie zdetonowanych bomb domowej roboty. W Hyde Parku zginęło czterech kawalerzystów z regimentu Blues & Royals, a w Regents Parku bomba umieszczona pod sceną zabiła siedmiu muzyków wojskowych z Royal Green Jackets. Osoba podejrzana o zdetonowanie pierwszej bomby została właśnie zatrzymana na lotnisku Gatwick. Gdyby chodziło o inny incydent z powojennej historii Wielkiej Brytanii, prawdopodobnie niewiele by mi to powiedziało. Bardzo mało wiem o północnoirlandzkich dążeniach zjednoczeniowych, a prawie nic o IRA – i na pewno nie byłbym w stanie wymienić innego zamachu. Tymczasem o tym słyszałem wcześniej. Skąd? Jakiś czas temu próbowałem zmierzyć się z tłumaczeniem tekstu utworu „The Gunner’s Dream” Pink Floyd, o którym już tu kiedyś pisałem. Zmusiło mnie to do dokładnego przeczytania tekstu i zastanowienia się nad znaczeniem tych fragmentów, nad którymi do tej pory się prześlizgiwałem. Zacząłem więc drążyć i odkrywać liczne Watersowe odniesienia literackie, kulturowe i historyczne. W ten sposób dowiedziałem się, że końcówka frazy „...space between the heavens and the corner of some foreign field” to nawiązanie do sonetu The Soldier Ruperta Brooke’a, poety, którego można nazwać „angielskim Baczyńskim” ze względu na jego śmierć w I wojnie światowej w niecały rok po napisaniu tego wiersza, który w ten sposób stał się czymś w rodzaju samospełniającej się przepowiedni. Motyw pól pierwszowojennych powraca zresztą na tej płycie kilkakrotnie, jak w „Southampton Dock”, gdzie „mute reminder of the poppy fields and graves” przywodzi na myśl sztuczne czerwone maki, jakie widzi się na londyńskich ulicach wpięte w klapy marynarek w Remembrance Day. Tak dowiedziałem się też, o co chodzi w owym fragmencie mówiącym dosłownie o „szaleńcach, którzy za pomocą zdalnie sterowanych urządzeń przedziurawiają muzyków”, o którym przypomniał mi dzisiejszy artykuł."
