["https://plblog.danieljanus.pl/2021/10/10/jak-placic-za-ksiazki"]
title = "Jak płacić za książki"
full_description = "Czasem zastanawiam się, co bym zmienił, gdybym mógł dowolnie urządzić świat, i zawsze dochodzę do tego samego wniosku: nie wiem. Widzę mnóstwo problemów ze status quo, ale we wszystkich rozwiązaniach, które mi przychodzą do głowy, widzę następne problemy. I tak to się kręci. Ale niektóre pomysły wydają mi się sensowne. Na przykład mam całkiem konkretną wizję tego, jak w moim idealnym świecie wygląda płacenie za książki i e-booki (które na potrzeby tej notki też będę uznawać za książki). Zanim jednak do niej przejdę, napiszę parę słów o tym, co mi się nie podoba w tej rzeczywistości, którą mamy. Ustalmy na początku, że potrzeba wynagradzania i incentywizacji autorów książek (a także innych osób mających wpływ na ich powstawanie) jest oczywista. Pomijając wszystkie niedostatki kapitalizmu, cierpimy jako społeczeństwo — tak sądzę — na pewien rodzaj dwójmyślenia. Z jednej strony wielbimy (słusznie!) biblioteki jako świątynie kultury i wiedzy. Ich rola jako instytucji kulturo- i socjotwórczych jest nie do przecenienia. Z drugiej strony krzywimy się (też nie bez racji), kiedy ktoś nielegalnie ściąga e-booka z internetu: to złamanie umowy społecznej. A tymczasem z punktu widzenia autora zysk z takiego czytelnika jest w obu przypadkach dokładnie taki sam: zero, nic, null, nada, żodyn w drugim przypadku zerowy, zaś w pierwszym — na ogół niższy, niż gdyby kupił on książkę w księgarni. (W tym miejscu w oryginalnym poście był przykład z trzema książkami, tyleż obrazowy, co nieprawdziwy. Od kilku lat funkcjonuje w Polsce system wynagrodzeń dla autorów i wydawców książek, stanowiący realizację koncepcji Public Lending Right. Ponadto, jak zwraca uwagę Koziołek na Twitterze, biblioteki nie płacą za książki cen okładkowych, tylko wyższe, obejmujące biblioteczne opłaty licencyjne. To oczywiście osłabia wagę tej argumentacji, ale sami oceńcie, jak bardzo.) Pamiętacie akcję „Strata Kazika”? Pokazuje ona dość dobitnie, że samo skopiowanie treści cyfrowej (czy to legalnie, czy nie) nie jest samo w sobie szczególnie doniosłym aktem. Pendrive wypełniony trzydziestoma tysiącami książek, zalegający na dnie szuflady, nie jest automatycznie wart kilkaset tysięcy złotych. Jeśli ktoś przeczyta cztery z tych książek, to tylko te cztery będą przedstawiać sobą jakąkolwiek wartość. Książka wnosi wartość w życie czytelnika nie wtedy, kiedy wchodzi w jego posiadanie, tylko w procesie czytania."
