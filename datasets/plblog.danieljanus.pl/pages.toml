["https://plblog.danieljanus.pl/2025/02/10/el-choclo"]
title = "Earworm dnia: <em>El Choclo</em>"
full_description = "Usłyszałem to w nieznanym mi wcześniej wykonaniu w radiu, a wczoraj byliśmy z Anną w argentyńskiej tangoknajpie i może dlatego chodzi mi po głowie jeden ze standardów tango, „El Choclo”. Poczytałem sobie o nim trochę więcej i na pewno też chcecie to wiedzieć. Tango skomponował w 1903 Ángel Villoldo; on też jest autorem pierwszego tekstu. Ów tekst znamy tylko z nagrania jednego wykonania samego Villoldo w Paryżu w 1912, przez co nie ma pewności co do jego brzmienia w niektórych passusach. „El choclo” znaczy „kolba kukurydzy” i tekst Villoldo właśnie o kukurydzy mówi. Tekstów do tej samej melodii powstało kilka. W 1930 śpiewak i kompozytor Juan Carlos Marambio Catán stworzył nowy tekst, poproszony przez Irene Villoldo, siostrę Ángela – twierdziła ona, że „Choclo” było na przełomie wieków ksywą buenosaireskiego ulicznego zawadiaki, nazywanego tak od koloru kosmyka włosów. Najbardziej jednak znany tekst pochodzi z 1946 i napisał go, I shit you not, niejaki Enrique Santos Discépolo (wszelka zbieżność jest przypadkowa) na zamówienie aktorki Libertad Lamarque, do wykorzystania w filmie „Gran Casino”. Discépolo żył i tworzył w Buenos Aires i spora część jego twórczości powstała w lunfardo. Lunfardo to powstały na przełomie XIX i XX w. slang buenosaireskiej biedoty i dzielnic portowych, taki tamtejszy cockney. „Choclo” Discépolo nie jest wyjątkiem: dużo w nim słów z lunfardo. Na przykład we fragmencie „Por tu milagro de notas agoreras / nacieron sin pensarlo las paicas y las grelas” („Z cudu twoich proroczych nut narodziły się nie myśląc paicas i grelas”) „las paicas” to dziewczyny, a „las grelas” to kobiety. Rozpoczynające drugą zwrotkę wersji Discépolo słowo „carancanfunfa” jest onomatopeją przywodzącą na myśl wybijanie rytmu obcasami i pewien specyficzny sposób tańca. Tu jednak raczej oznacza pseudonim artystyczny jednego z tancerzy – mógł to być Casimiro Aín lub Enrique Saborido – którzy byli pionierami tanga na europejskich parkietach; internety mówią, że na występach w Paryżu owijali się argentyńską flagą."
