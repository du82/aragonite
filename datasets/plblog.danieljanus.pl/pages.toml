full_description = "Od jakiegoś czasu prowadzę nieregularny blog po angielsku. Zbierając pomysły na notki zauważyłem, że część z nich ma charakter trochę hermetyczny, raczej niezrozumiały dla szerokiej, angielskojęzycznej publiczności. Teksty, które dotyczą lokalnych, warszawskich spraw albo języka polskiego, nie nadawałyby się na angielskiego bloga. Pomyślałem też, że pisząc po polsku o Clojure mógłbym przyczynić się do popularyzacji tego języka wśród polskich programistów. Jest to też dobra okazja do wypróbowania nowej platformy blogowej. O istnieniu Posterous wiedziałem od dawna, ale nie byłem świadom rozlicznych ułatwień, jakie oferuje, a do których się przyzwyczaiłem pisząc starego bloga. Zobaczymy, jak się sprawdzi. Kusi mnie, żeby się rozpisać więcej, ale nie chcę, by ta pierwsza notka przerodziła się w długie rozważania na temat zalet i wad systemów blogowych; poużywam trochę i napiszę osobną notkę na ten temat."
