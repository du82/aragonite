["https://plblog.danieljanus.pl/2013/03/22/zbiorkom"]
title = "Porównanie prostych taryf zbiorkomu w Warszawie i Londynie"
full_description = "Obszar obsługiwany przez warszawską komunikację miejską podzielony jest na dwie strefy, z których pierwsza odpowiada z grubsza granicom administracyjnym miasta, a druga podwarszawskim miejscowościom. Bilet jednorazowy ważny w jednej strefie kosztuje 4,40 zł, a w obu 7 zł. Taki bilet ważny jest tylko w pojeździe, w którym został skasowany, więc jeśli podróż obejmuje przesiadki, to bardziej opłaca się skasować bilet czasowy: 20-minutowy kosztuje 3,40 zł, 40-minutowy – 4,60 zł, a 60-minutowy – 6,40 zł. Wszystkie bilety czasowe są ważne w obu strefach. Zaczniemy może od autobusów i tramwajów, bo tu sprawa jest prawie tak prosta jak w Warszawie. W całym mieście obowiązuje jedna taryfa za pojedynczy przejazd (no dobrze, dwie). Tak jak w Warszawie, bilet jest ważny tylko w pojedynczym pojeździe. Jeśli płacimy za przejazd gotówką (w autobusie u kierowcy lub w automatach przystankowych, których jest coraz mniej), to bilet kosztuje £2.40. Taniej jest płacić specjalną zbliżeniową kartą przedpłaconą, zwaną Oyster card. Opłata wynosi wtedy £1.40, a płatność odbywa się poprzez przyłożenie karty do żółtego czytnika-kasownika umieszczonego przy kabinie kierowcy autobusu lub na przystankach tramwajowych. Londyn nie ma odpowiednika warszawskich biletów czasowych. Zamiast tego istnieje dzienna granica opłat, która dla autobusów i tramwajów wynosi £4.40. Oznacza to, że jeżeli poruszamy się tylko autobusami i tramwajami, to czwarty przejazd danego dnia kosztuje tylko 20 pensów, a wszystkie następne są bezpłatne. Jeśli jedziemy metrem lub pociągiem (podmiejskim, DLR lub Overground), to obowiązują inne zasady. Obszar obsługiwany przez te środki transportu podzielony jest na sześć dziewięć trzynaście szesnaście stref taryfowych. Strefy od 1 do 6 odpowiadają z grubsza obszarowi Londynu (1 to centralny Londyn), choć część stacji w skrajnych strefach leży już poza granicami miasta. Strefy od 7 do 9 to stacje w podlondyńskich miejscowościach obsługiwane przez Overground i linię metra Metropolitan. Pozostałe strefy są nienumerowane, czasami (nieoficjalnie) oznaczane literami, a leżące w nich stacje są obsługiwane tylko przez kolej podmiejską, z wyjątkiem Watford Junction, do której dojeżdżają również pociągi London Overground."
