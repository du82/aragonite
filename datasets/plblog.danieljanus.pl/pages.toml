["https://plblog.danieljanus.pl/2015/04/29/zawalanie"]
title = "Zawalanie 101"
full_description = "Tekst na ten sam temat popełniła ostatnio Kya; zachęcam do przeczytania, ponieważ są tam same dobre i prawdziwe rzeczy. Tym niemniej czuję się upoważniony do napisania postscriptum. To jedna z niewielu dziedzin, w których mam bogate, długoletnie i udokumentowane doświadczenie, więc nie muszę silić się na besserwisserstwo. Jednocześnie, #include <stddisclaimer.h>: całość jest pisana wyłącznie z mojej perspektywy. Będę pisał o sprawach trudnych dla mnie, bazując na moich własnych odczuciach i opiniach. U mnie działa, ale jakkolwiek wydaje mi się to sensowne, niekoniecznie musi działać dla kogokolwiek innego. Ludzie są różnie skonstruowani. Istotą zawalania jest zaszkodzenie komuś. Świadome czy nie, bardziej lub mniej brzemienne w skutki – spieprzyłeś, jeśli czyjaś sytuacja jest gorsza niż była albo powinna być. Tym kimś możesz być Ty sam albo ktoś inny. Pół biedy, jeśli to Ty sam: na przykład przez lenistwo oblałeś egzamin albo dostałeś zupełnie niepotrzebny, bezsensowny mandat za niezdjęcie w porę nogi z gazu w zabudowanym. Wtedy jest łatwiej powiedzieć „trudno” i wziąć to na klatę. Wtedy masz pełny obraz sytuacji i uczucia nikogo innego nie wchodzą w zakres problemu. Możesz podziękować tylko samemu sobie i tylko z samym sobą to przepracować. Zatem reszta notki będzie poświęcona wyłącznie przypadkowi B: zaszkodziłeś komuś innemu. To mogą być rzeczy zupełnie różnego kalibru: może na przykład nastąpiłeś komuś na stopę, przez co druga osoba odczuwa ból fizyczny. Może zgubiłeś czyjąś własność. Może zapomniałeś o umówionym spotkaniu. Może powiedziałeś coś, co sprawiło drugiej osobie ból. Może nie wywiązałeś się z danej komuś obietnicy. Może wprowadziłeś kogoś w błąd. Może nadużyłeś czyjegoś zaufania. Może to zaufanie nadszarpnąłeś albo zrujnowałeś zupełnie. Przychodzi wtedy taki moment, kiedy sobie z całą mocą uświadamiasz konsekwencje tego, co zrobiłeś (albo czego nie zrobiłeś). W takich chwilach w umyśle pojawia się emocja, którą można zwerbalizować w kilku słowach: o kurwa. O żeż kurwa. KURWA MAĆ."
year_published = 2015
