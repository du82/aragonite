["https://plblog.danieljanus.pl/2012/09/28/perfekcyjna-niedoskonalosc-usosa"]
title = "Perfekcyjna niedoskonałość USOS-a"
full_description = "– Poprawki oprogramowania nie są potrzebne, bo oprogramowania lepiej nie da się napisać – tłumaczy dr Janina Mincer-Daszkiewicz, kierownik Komisji ds. USOS z Uniwersytetu Warszawskiego. Jej zdaniem problem tkwi w liczbie logowań. – Jeśli w ciągu pierwszych pięciu minut trwania rejestracji na serwery uczelniane rzuca się 5 czy 10 tysięcy studentów, to i najlepszy komputer nie pomoże -- dodaje. Nazwisko pani Mincer-Daszkiewicz jest doskonale znane każdemu studentowi informatyki na Wydziale MIM UW, który w ciągu ostatnich kilkunastu lat zdawał egzamin z systemów operacyjnych: jej zasługi nie tylko dydaktyczne, ale również na polu informatyzacji obsługi Wydziału, a także całego UW, są nie do przecenienia. Tym bardziej dziwi powyższa wypowiedź. I nawet nie chodzi mi o to, że stwierdzenie, że nie da się obsłużyć dziesięciu tysięcy użytkowników naraz, jest zwyczajnie nieprawdziwe (wystarczy sobie uświadomić wielkość liczby żądań, jakimi w każdej sekundzie bombardowane są serwery wyszukiwarki Google, albo ilu użytkowników naraz jest średnio zalogowanych do Facebooka; bez kłopotu osiągalne jest 10 tys. żądań na sekundę nawet na pojedynczej maszynie). Problemem jest raczej mentalność wyczuwalna w pierwszym zdaniu. Kto pierwszy powiedział: „dzieła sztuki nie są nigdy ukończone – są porzucane”? Nie wiem; guglanie za „never finished, only abandoned” daje najrozmaitsze wyniki i pokazuje tę frazę odnoszoną do najrozmaitszych dziedzin, w tym do oprogramowania. Każdy, kto kiedykolwiek pracował nad dostatecznie dużym systemem, wie, jak bardzo jest to prawdziwe. Zawsze można coś poprawić: zwiększyć wydajność, odchudzić, dopracować; nie ma siódmego dnia, w którym można by odpocząć i popatrzeć z dumą na ukończone dzieło. Pani Mincer-Daszkiewicz zdaje się sądzić, że USOS osiągnął stan perfekcji; nie, nie osiągnął, podobnie jak nie osiągnął go żaden inny system. A poprawiać jest co. Świadczy o tym pomruk niezadowolenia setek studentów, niemogących „wbić się” do USOSweb. Gdyby USOS realizowany był jako przedsięwzięcie komercyjne, to ze względu na to, że realia rynkowe wymuszają takie myślenie – ktoś by w końcu przyszedł i powiedział: „tak nie może być”. Nie może, bo bywa nieużywalne w fundamentalny sposób; nie może, bo udostępnienie produktu w takiej postaci klientom narazi przedsiębiorstwo na duże straty. Tłumaczenie się ograniczeniami architekturalnymi jest nie do przyjęcia: jeśli architektura w obecnej postaci nie pozwala na sensowne działanie systemu, to znaczy, że trzeba go przeprojektować."
