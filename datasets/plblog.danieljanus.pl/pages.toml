["https://plblog.danieljanus.pl/2012/12/19/o-jaskiniach-programowaniu-i-poezji"]
title = "O jaskiniach, programowaniu i poezji"
full_description = "Emil w swojej ostatniej notce wspomina, że jego marzeniem jest napisanie przygodówki tekstowej. Moim też! Z tej okazji przypomniał mi się eseik, który wysłałem pięć lat temu na jedną z grup usenetowych; publikuję tu bez zmian, dodając tylko odnośniki i poprawiając literówki. Odnotuję też, że większość materiału historycznego jest zaczerpnięta z „Inform Designer's Manual” Nelsona (1997), a programik, który cytuję na końcu, nie kompiluje się już ostatnimi wersjami I7, choć pewnie wymaga niewielkich przeróbek z zachowaniem formy. Wtedy to właściciel Stephena Bishopa, niewolnika „szybkiego, śmiałego, entuzjastycznego”, wykupił ziemię w stanie Kentucky, na której terenie leżała Jaskinia Mamucia. Jej rzeczywisty rozmiar nie był wtedy jeszcze znany: nazwę nadali jej górnicy, wydobywający stąd ongi guano mamucie, z którego wyrabiano saletrę używaną do produkcji prochu. Stephenowi, samoukowi, człowiekowi bystremu, znającemu łacinę i grekę, powierzono opiekę nad jaskinią i w krótkim czasie stał się słynny jako władca podziemnego królestwa. W kilka lat podwoił on znaną połać jaskini, nadał też nazwy -- półklasyczne, półamerykańskie – podziemnym korytarzom, rzekom, studniom: Rzeka Styks, Sala Lawinowa, Bezdnia, Wielka Kopuła. Wiele z tych nazw przetrwało do tej pory. Stephen oprowadzał po jaskini turystów, których zaczęło ściągać tam coraz więcej; mapa, którą naszkicował posiłkując się tylko własną pamięcią w roku 1842, była jeszcze w użyciu czterdzieści lat później. Stephen Bishop zmarł w roku 1857 jako wolny człowiek, uwolniony na mocy testamentu swojego właściciela. Minął wiek. W czasie drugiej wojny światowej na terenach Jaskini ustanowiono park narodowy, co skutecznie odcięło napływ turystów. Coraz więcej osób jednak podejrzewało, że Jaskinia połączona jest systemem korytarzy z innymi okolicznymi jaskiniami, i poszukiwało przejścia; jednak bezskutecznie. Dopiero trzydzieści lat później, w roku 1972, Patricia Crowther, członkini ekspedycji badającej jaskinię Flint Ridge, przebrnęła przez ciasne, błotniste przejście i przedostała się do podziemnych głębi Jaskini Mamuciej; korytarz ten odkryto później ponownie na mapie Bishopa."
year_published = 2012
