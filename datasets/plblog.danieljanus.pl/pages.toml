["https://plblog.danieljanus.pl/2025/02/15/przywilej-szacunku"]
title = "Przywilej szacunku"
full_description = "Oczywiście można się tym nie przejmować i po prostu pisać z nadzieją, że jednak tekst – przez przypadek lub kierowany dziwną łaską algorytmów – dotrze do jakichś czytelników, ale przy takim założeniu równie dobrym rozwiązaniem jest pisanie “do szuflady” i niepublikowanie napisanych rzeczy w ogóle. Myślę, że nie o to tu chodzi – piszę przecież po to, by ktoś to przeczytał. A ja od wczoraj się zastanawiam. Wiecie, jakie jeszcze medium jest (albo było jeszcze kilka lat temu) skuteczne w znajdowaniu tekstom czytelników? Odpowiedź kryje się w samym pytaniu. Medium.com. Tak, to samo Medium, które ładuje i uruchamia 3 MB JavaScriptu tylko po to, żeby wyświetlić tekst; które każe czytelnikom się logować, żeby przeczytać niektóre teksty, a użytkowników niezalogowanych traktuje jako obywateli drugiej kategorii, psując UX i rzucając im w twarz popupem na pół ekranu; które na telefonie bardzo-bardzo chce, żeby zainstalować ich aplikację; które śledzi każdy ruch użytkownika na stronie – każde kliknięcie, każde przewinięcie – chyba że łaskawie się ich poprosi, żeby tego nie robili. Wszystko to razem jest na tyle agresywne, że na mnie działa przeciwskutecznie: kiedy dostaję po oczach bannerem Medium, to zamykam zakładkę przeglądarki (chyba że bardzo potrzebuję przeczytać dany tekst). Wyobraźcie sobie, że idziecie do czytelni poczytać gazetę lub książkę, zasiadacie w fotelu i zagłębiacie się w lekturze, nieświadomi, że ktoś Wam stoi nad głową z notatnikiem w ręku – i notuje każdy moment, kiedy przewracacie kartkę. Jak się z tym czujecie? Nie żeby Medium było jakoś jedyne w swoim rodzaju. Substack robi podobne rzeczy, choć lepiej podtrzymuje więzi między autorami a czytelnikami. Przeważająca większość stron WWW wyświetlających tekst i obrazki – takich, o których myślimy jako o dokumentach, cyfrowych odpowiednikach książek czy gazet – to w istocie aplikacje udające, że są dokumentami, ale po cichu i bez uprzedzenia śledzące użytkownika. Szerzej o tym piszę w osobnej notce na enblogu."
