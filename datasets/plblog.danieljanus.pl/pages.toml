["https://plblog.danieljanus.pl/page/2"]
title = "Daniel Janus – blog"
full_description = "Przemoc fizyczna należała w nim do rzadkości. Jednak przemoc nie musi być fizyczna: przemocą jest każdy akt narzucania własnej woli siłą drugiemu człowiekowi. W istocie na to, co dla mnie ważne, było w tym domu miejsce o tyle, o ile było akceptowane lub przynajmniej tolerowane przez inną osobę. Kiedy zaś rzeczy ważne dla mnie nie pasowały do jej wizji świata, spotykały się ze zdecydowanym sprzeciwem, a czasem jawną pogardą. Dobrze pamiętam wrażenie, że muszę najdosłowniej wyszarpywać dla siebie przestrzeń po kawałku i kurczowo się jej trzymać, i towarzyszące temu wrażeniu uczucie sfrustrowanej bezsilności. Tekst na ten sam temat popełniła ostatnio Kya; zachęcam do przeczytania, ponieważ są tam same dobre i prawdziwe rzeczy. Tym niemniej czuję się upoważniony do napisania postscriptum. To jedna z niewielu dziedzin, w których mam bogate, długoletnie i udokumentowane doświadczenie, więc nie muszę silić się na besserwisserstwo. Jednocześnie, #include <stddisclaimer.h>: całość jest pisana wyłącznie z mojej perspektywy. Będę pisał o sprawach trudnych dla mnie, bazując na moich własnych odczuciach i opiniach. U mnie działa, ale jakkolwiek wydaje mi się to sensowne, niekoniecznie musi działać dla kogokolwiek innego. Ludzie są różnie skonstruowani. Ludzie dziwnie na mnie patrzą, kiedy powiadam, że programowanie i poezja mają ze sobą wiele wspólnego. A jednak uważam, że tak właśnie jest, i to co najmniej na kilku poziomach. Jaki jest cel poezji? Na ten temat napisano morze: parafrazując stary dowcip – gdzie dwóch poetów, tam co najmniej trzy odpowiedzi na to pytanie. Spróbuję jednak uogólnić: poezja ma za zadanie wzbudzić w odbiorcy określone emocje lub przemyślenia, używając do tego celu słów. W lipcu 1982 roku w londyńskich parkach Hyde Park i Regent's Park odbywały się uroczystości wojskowe. Doszło do dwóch eksplozji, wywołanych, jak później ustalono, wybuchami zdalnie zdetonowanych bomb domowej roboty. W Hyde Parku zginęło czterech kawalerzystów z regimentu Blues & Royals, a w Regents Parku bomba umieszczona pod sceną zabiła siedmiu muzyków wojskowych z Royal Green Jackets. Osoba podejrzana o zdetonowanie pierwszej bomby została właśnie zatrzymana na lotnisku Gatwick."
