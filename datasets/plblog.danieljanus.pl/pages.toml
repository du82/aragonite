["https://plblog.danieljanus.pl/2010/11/07/o-lacznikach-i-myslnikach"]
title = "O łącznikach i myślnikach w metrze, czyli dlaczego typografii powinno się uczyć w szkołach"
full_description = "Lubię ekrany informacyjne zainstalowane w metrze warszawskim, tak na stacjach, jak i w pociągach; pozwalają nie nudzić się, gdy akurat nie mam pod ręką niczego innego do czytania. Jednak treść prezentowana na tych wyświetlaczach pozostawia często wiele do życzenia, także pod względem jej prezentacji. Przykład można zobaczyć na powyższym zdjęciu. Rzuca się w oczy błąd typograficzny: w funkcji myślnika, a więc otoczonego odstępami znaku oddzielającego dwie odrębne części myśli zawartej w wypowiedzeniu, użyty jest tu dywiz (-) zamiast dłuższej pauzy (—) lub półpauzy (–). Na Wikipedii można znaleźć dobre omówienie różnic między tymi znakami, nie będę się więc rozpisywał na ten temat. To częsty błąd, i ktoś mógłby powiedzieć, że się czepiam. Zapewne tak; jestem wyczulony na tego typu pomyłki. Gdy widzę taki błąd na czyjejś prywatnej stronie internetowej, przechodzę nad nim do porządku dziennego. Gdybym wiedział, że to jednorazowa wpadka i w innych artykułach znaki interpunkcyjne stosowane są poprawnie — zmełłbym w ustach przekleństwo. Jest jednak inaczej. Za każdym razem, kiedy na ekranach metra powinna pojawić się gdzieś pauza, widzę w tym miejscu dywiz. Uważam to za niechlujstwo godne publicznego piętnowania. Te komunikaty są dziennie czytane przez dziesiątki tysięcy osób. Błąd widziany wielokrotnie przenika w końcu do podświadomości, stając się złym nawykiem. Ten sam zarzut można zresztą podnieść w stosunku do stron internetowych Gazety Wyborczej, z której — jak widać — pochodzi notka ze zdjęcia. Zapytajmy jednak, skąd wziął się błąd? Zapewne osoby przygotowujące notki mają tyle pracy, że nie mają czasu na typograficzną redakcję. Tego typu praca może być jednak z powodzeniem wykonywana automatycznie, przez oprogramowanie wyświetlające artykuły. Każdy procesor tekstu zamienia otoczone spacjami łączniki na myślniki w czasie pisania; dla stron internetowych istnieje SmartyPants i jego odpowiedniki. Czasy, kiedy taka zamiana była utrudniona technicznie, minęły wraz z upowszechnieniem się Unikodu. Szkoda, że tu tego zabrakło."
