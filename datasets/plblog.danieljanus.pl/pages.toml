["https://plblog.danieljanus.pl/2023/01/08/algorytm"]
title = "Słowa, których nie lubię: <em>algorytm</em>"
full_description = "Bez słów — mówionych, zapisywanych, pokazywanych, dotykanych — nie bylibyśmy ludźmi. Słowa są ważne i potrzebne. I piękne. Zwłaszcza kiedy używamy ich zgodnie z (prze)znaczeniem. Czasem jednak wypowiadamy słowa automatycznie, nie zastanawiając się nad ich adekwatnością do tego, co naprawdę mamy na myśli. Bywa, że ujmuje to wagi i wiarygodności naszym wypowiedziom: używamy słów nieprecyzyjnych albo wytartych do tego stopnia, że nie potrafią unieść ciężaru własnego znaczenia. To nie znaczy, że są niepotrzebne i trzeba je wyrzucić z języka — ale myślę, że warto na nie uważać. Zbieram takie słowa na swój prywatny użytek. I o nich będzie cykl na blogu, którego początkiem jest ten post. Wszyscy znamy przykłady tak rozumianych algorytmów. Natknęliśmy się na nie, kiedy przyrządzaliśmy potrawę według przepisu (tak, przepisy kuchenne też pasują do tej definicji!) albo kiedy uczyliśmy się w podstawówce dodawania pisemnego (na ogół, mówiąc o algorytmach, mamy na myśli jednak takie operujące na obiektach matematycznych). Informatycy wymyślili mnóstwo algorytmów rozwiązujących najróżniejsze problemy: od sortowania liczb przez kompresję danych po tłumaczenie między językami naturalnymi. Algorytmy są wszędzie tam, gdzie komputery. Dlaczego więc chcę uważać na słowo opisujące coś tak przydatnego? Dlatego, że ono zupełnie nagle i niepostrzeżenie nabrało nowego znaczenia, którego nie notuje chyba jeszcze żaden słownik. To nowe znaczenie częściowo pokrywa się z dotychczasowym, ale są między nimi znaczące różnice. W dalszej części tekstu będę czasami pisał „algorytm1” i „algorytm2” dla podkreślenia, o który sens chodzi. Czujemy intuicyjnie, że na tych obrazkach pod hasłem „algorytm” rozumie się coś trochę innego niż „ograniczony ciąg precyzyjnie określonych czynności”. Można wskazać kilka cech charakterystycznych dla algorytmu2: Jak widać — zakres zadań, o których wspomina oryginalna definicja, zostaje w tym znaczeniu znacznie ograniczony; zaś „treść” algorytmu — owe „precyzyjnie określone czynności” — w zasadzie nie ma znaczenia, bo jest niepoznawalna. Algorytmy1 postrzegamy przez pryzmat tego, co i jak robią; w algorytmach2 ważne jest to, jak ich działanie wpływa na ludzi."
year_published = 2023
clearnet = "https://plblog.danieljanus.pl/2023/01/08/algorytm"
