["https://plblog.danieljanus.pl/2013/05/17/homofobiczny-brak-umiejetnosci"]
title = "Homofobiczny brak umiejętności czytania ze zrozumieniem"
full_description = "W skrócie: autor grafiki zestawia dane o pobiciach na tle homofobii z danymi o liczbie zarejestrowanych w Polsce pobić i odsetku osób homoseksualnych wśród całej populacji i wychodzi mu, że coś się nie zgadza, ergo geje ściemniają. Byłyby, gdyby liczby przytoczone przez autora znaczyłyby właśnie to, co autorowi wydaje się, że znaczą. W szczególności, jeśli dobrze rozumiem, autor zakłada, że owe 17,7% jest odsetkiem osób homoseksualnych w społeczeństwie, które zostały pobite ze względu na swoją orientację; innymi słowy – że to estymacja stosunku liczby homoseksualnych ofiar pobić do liczby wszystkich homoseksualistów w społeczeństwie. Byłoby tak, gdyby owa próbka 423 osób była losową, reprezentatywną próbą populacji homoseksualistów, niezależnie od wartości zmiennej „bycie ofiarą przemocy”. Tymczasem sięgając do źródła, czyli raportu KPH w części dotyczącej metodologii badania czytamy: W związku z powyższym zasadne stało się zdefiniować grupę respondentów, zawężając ją do osób, które spotkały się z przemocą motywowaną homofobią, ale nie ograniczać jej jedynie do osób nieheteroseksualnych. Innymi słowy, ten raport jest zupełnie o czymś innym. To nie są statystyki mówiące o tym, jak często ludzie (niekoniecznie homoseksualiści!) padają ofiarą przemocy na tle homofobicznym. Te liczby mają za zadanie oddać charakter owej przemocy i dana, na którą powołuje się autor grafiki, oznacza w istocie, że co piąty akt przemocy w badanej próbie miał charakter pobicia. W ten sposób wykorzystanie źle zinterpretowanych danych doprowadziło do wniosków, które można określić jako, ekhm, OKDP (O Krztynę za Daleko Posunięte). Zatrzymajmy się na chwilę. Zastanówmy się, jak łatwo było takiego błędu uniknąć: wystarczyło przeczytać ze zrozumieniem cały tekst, a nie tylko wyłapywać fragmenty pasujące do z góry założonej tezy. Internet jednak rozleniwia. Łatwo jest czytać pobieżnie, a jeszcze łatwiej bezkrytycznie, bez weryfikacji, repostować na fejsie obrazki pasujące do naszej linii światopoglądowej, dając wiarę, że ktoś inny wykonał za nas czarną robotę krytyka."
