["https://plblog.danieljanus.pl/2020/10/02/nowy-swiat"]
title = "Rozwiązanie zagadki Radia Nowy Świat"
full_description = "Dziś na zamkniętej grupie fejsbukowej dla Patronów Radia Nowy Świat pojawiła się zagadka-szyfr. Wrzucam rozwiązanie na bloga, bo tak wygodniej i mogę wstawić więcej obrazków, gdzie chcę. Jeśli chcesz, Czytelniku, pogłówkować we własnym zakresie – nie czytaj dalej. Jeśli interesuje Cię rozwiązanie (i tok myślowy, który mnie do niego zaprowadził), przewiń stronę… Pierwsza myśl: ta wiadomość naprawdę składa się z takich liter. Sprawdzam “na oko”: jest dużo A, a mało Ź, czyli tak, jakbyśmy się spodziewali w losowym polskim tekście. Próbuję czytać kolumnami, od tyłu, ruchem konika szachowego – bezskutecznie! Ha, jednak nie. To wygląda bardzo ciekawie: wszystkie samogłoski występują po 10 lub 9 razy, a wszystkie spółgłoski – po 4 lub 3 razy. W takim razie jest bardzo mało prawdopodobne, że znaczenie mają litery jako takie. Przyglądam się bliżej: to nie jest przypadek, że tekst zaszyfrowany zaczyna się od ABCĆ. Gdyby skreślić wszystkie spółgłoski, to zostaniemy z AĄEĘIOÓÓUY… I analogicznie, gdyby skreślić samogłoski, to dostajemy BCĆDFGH… Wobec tego to nie litery niosą informację w tym tekście, tylko przeplot spółgłosek i samogłosek. Zobaczmy, jak to wygląda: Tak, to wygląda lepiej. 86 samogłosek i 82 spółgłoski. Tylko co to za kod? Morse? Może spółgłoski to kropki, a samogłoski – kreski? Próbuję online-owych dekoderów. Kod Morse’a bez odstępów jest niejednoznaczny, więc przewijam się przez różne opcje. Nic nie pasuje. Gdyby kreski i kropki ustawić odwrotnie, też nie działa. To może to jest ASCII? Przyglądam się bliżej: jest prawie regułą, że co ósmy znak to samogłoska. W takim razie gdyby samogłoski odpowiadały zerom, a spółgłoski jedynkom, i gdyby pogrupować je po 8 (tak jak na obrazku), to… Miliard ŻE CO plęć tysięcy? To są jakieś liczby, napisane przez kogoś, kto sepleni. Albo zamienia litery miejscami. Można by zgadnąć, według jakiego klucza, ale on akurat jest podany w tytule strony. I na obrazku. MALINOWE BUTY."
