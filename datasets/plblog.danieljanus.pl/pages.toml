["https://plblog.danieljanus.pl"]
title = "Daniel Janus – blog"
full_description = "Oczywiście można się tym nie przejmować i po prostu pisać z nadzieją, że jednak tekst – przez przypadek lub kierowany dziwną łaską algorytmów – dotrze do jakichś czytelników, ale przy takim założeniu równie dobrym rozwiązaniem jest pisanie “do szuflady” i niepublikowanie napisanych rzeczy w ogóle. Myślę, że nie o to tu chodzi – piszę przecież po to, by ktoś to przeczytał. Usłyszałem to w nieznanym mi wcześniej wykonaniu w radiu, a wczoraj byliśmy z Anną w argentyńskiej tangoknajpie i może dlatego chodzi mi po głowie jeden ze standardów tango, „El Choclo”. Poczytałem sobie o nim trochę więcej i na pewno też chcecie to wiedzieć. W życia wędrówce, na połowie czasu, Straciwszy z oczu szlak niemylnej drogi, W głębi ciemnego znalazłem się lasu. Lu Wilson powtarza mantrę: „normalise sharing scrappy fiddles”. To dość enigmatyczne, więc spróbuję wyjaśnić to w punktach, tak jak to rozumiem: A więc już wszystko prawie wiadomo. Kiedy to piszę, jest jeszcze poniedziałek; policzone są głosy z ponad 99% komisji i ostateczny podział mandatów, jeśli jeszcze się zmieni, to minimalnie. W tej chwili Sejm X kadencji zarysowuje się tak: Bez słów — mówionych, zapisywanych, pokazywanych, dotykanych — nie bylibyśmy ludźmi. Słowa są ważne i potrzebne. I piękne. Zwłaszcza kiedy używamy ich zgodnie z (prze)znaczeniem. Czasem się tak przedstawiam i czasem budzi to zaciekawienie, powątpiewanie albo jedno i drugie naraz. Wracam więc myślą do samych początków. „Mickiewicz wielki poeta, ale kto go zna, a mnie śpiewa cała Polska i Ukraina” — mawiał o sobie Tomasz Padura, któremu przypisuje się czasem autorstwo znanej wszystkim piosenki „Hej, sokoły”. Błędne to przypisanie — autor słów nie jest znany — ale anegdotkę uważam za przednią. Czasem zastanawiam się, co bym zmienił, gdybym mógł dowolnie urządzić świat, i zawsze dochodzę do tego samego wniosku: nie wiem. Widzę mnóstwo problemów ze status quo, ale we wszystkich rozwiązaniach, które mi przychodzą do głowy, widzę następne problemy. I tak to się kręci."
