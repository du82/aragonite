["https://plblog.danieljanus.pl/2021/11/09/typografia-banknotow"]
title = "Jestem Polakiem, więc mam typografię polską"
full_description = "„Mickiewicz wielki poeta, ale kto go zna, a mnie śpiewa cała Polska i Ukraina” — mawiał o sobie Tomasz Padura, któremu przypisuje się czasem autorstwo znanej wszystkim piosenki „Hej, sokoły”. Błędne to przypisanie — autor słów nie jest znany — ale anegdotkę uważam za przednią. A kto był najpowszechniejszym polskim malarzem? Albo szerzej — artystą plastykiem? Kto mógłby powiedzieć o sobie „Matejko wielki malarz, ale kto go zna”? Czyich to dzieł reprodukcje oglądamy (ba, dotykamy i z zadowoleniem gromadzimy w wielu egzemplarzach) każdego dnia, w każdym domu w Polsce? To z jego pracowni wyszły wzory wszystkich banknotów, którymi płacimy codziennie od 1975 roku. To jego dzieła przetrwały zmianę ustroju, zmiany władzy i denominację. To jemu Narodowy Bank Polski, z okazji półwiecza współpracy, poświęcił specjalny album. Nie mam kompetencji, żeby wypowiadać się krytycznie (albo bezkrytycznie) o tych projektach, oceniając je. Ale przyglądając się banknotom Heidricha, warto uświadomić sobie coś jeszcze: Heidrich był nie tylko projektantem grafiki użytkowej. Zaprojektował między innymi (w 1971 roku) pismo dziełowe o nazwie „Bona”. Cyfrową wersją tego kroju — zwaną Bona Nova i powstałą w roku 2017 — złożone są słowa, które teraz czytacie, drogie osoby odwiedzające tego bloga. To taki mój mały, lokalny, typograficzny patriotyzm: ukłon w stronę człowieka, który żył w tym samym zakątku świata co ja, mówił tym samym językiem i tworzył piękne rzeczy. A razem z nim — ukłon w stronę polskiej tradycji typograficznej, sięgającej czasów renesansu, od Jana Januszowskiego przez Adama Półtawskiego i Zygfryda Gardzielewskiego aż po Łukasza Dziedzica, którego Lato zdobyło wielką popularność w przestrzeni publicznej i w internecie. Heidrich sam zaprojektował charakterystyczne, unikatowe liternictwo dla polskich banknotów. Tak mówił w 2014 w wywiadzie dla „Tygodnika Powszechnego”:"
