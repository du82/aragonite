["https://plblog.danieljanus.pl/2025/01/25/scribere-necesse-est"]
title = "Scrībere necesse est"
full_description = "Lu Wilson powtarza mantrę: „normalise sharing scrappy fiddles”. To dość enigmatyczne, więc spróbuję wyjaśnić to w punktach, tak jak to rozumiem: Myślę o tym blogu. Po co go piszę? Z zawstydzoną szczerością przyznaję, że część odpowiedzi brzmi „dla poklasku”, nazbierania punktów internetowych, nakarmienia ego. To niezdrowe. Ale też to nie wszystko: jest dla mnie ważne, żeby nie pisać o niczym. Piszę więc rzadko, w tempie jedna–dwie notki rocznie – tak często mam poczucie, że mam coś ważnego do powiedzenia i umiem to ubrać w słowa. Na ogół przybiera to formę eseju, powstającego przez kilka godzin i będącego mniej więcej zamkniętą całością. Tymczasem znacznie częściej łapię się na powracających myślach kłębiących mi się w głowie. Postrzępionych, niekonkluzywnych, ale domagających się poświęcenia im uwagi. Może czas zacząć je spisywać, nie martwiąc się o formę? Może czas odsłonić miękkie podbrzusze? Wizualizuję sobie metaforycznie umysł jako gąbkę bombardowaną ze wszystkich stron zalewem informacji. Naturalna chłonność gąbki ma swoje granice i kiedy jest nasiąknięta do granic, trudno przyswajać jej nowe, często ważne rzeczy. Trzeba przetwarzać te nasiąknięte i gdzieś je kanalizować. Trzeba, trzymając się metafory, wyżymać gąbkę do jakiegoś rynsztoka. Trzeba notować. Scrībere necesse est. Zarządzam więc eksperymentalną przemianę niniejszego bloga w rynsztok. (Przypomniało mi się, że istniał kiedyś portal poetycki o takiej nazwie.) Chcę pisać częściej i krócej, bez efekciarstwa, bez wielosłowia, chcę dzielić się kawałkami procesów myślowych, choćby fragmentarycznymi. Chcę pisać dla siebie, dla wentylacji umysłu. I przy tym z nadzieją, że nie cała zawartość rynsztoka to śmieci. Może znajdziecie tu coś dla siebie. W celu uniknięcia pokusy poklasku zamierzam też przestać trąbić o każdej notce na prawo i lewo w social mediach. Będę wrzucać powiadomienia z rzadka i raczej w fediwersum niż gdziekolwiek indziej – taki mały ruch w stronę uniezależnienia się od korporacyjnych megasilosów z krwią na rękach. Jeśli chcecie czytać mnie regularnie, to przypominam, że blog ma kanał RSS (a właściwie Atom)."
