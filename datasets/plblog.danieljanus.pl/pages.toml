["https://plblog.danieljanus.pl/2011/02/13/janusowie-z-deblina"]
title = "Janusowie z Dęblina?"
full_description = 'Mój dziadek, Walenty Janus, urodził się w Polsce w roku 1890. Przybył do Stanów Zjednoczonych w młodym wieku, osiadł w stanie Michigan i ożenił się z Sophie Hojnacki. Próbuję dowiedzieć się czegoś więcej o jego rodzinie (być może jego ojciec miał na imię Franciszka [sic!]). W dokumentach imigracyjnych jako miejscowość pochodzenia figuruje Giblin, ale nie mogę znaleźć miejscowości w Polsce o tej nazwie. Niewiele mi to mówi. Janus to dość popularne nazwisko; na stronie Marka Futregi widzę, że nosi je około 10 tys. osób w Polsce i akurat wśród znanych mi Janusów nie było żadnego Walentego, który by wyemigrował do USA. Wydaje mi się, że "Giblin" może być amerykańsko-fonetycznym zapisem Dęblina – tak mógł usłyszeć oficer imigracyjny i tak zapisać. A publikuję ten post w nadziei, że może ktoś z czytelników tego bloga wie coś o Walentym i mógłby podzielić się informacją. Będę wdzięczny za wiadomość (najlepiej w komentarzach do niniejszego wpisu).'
