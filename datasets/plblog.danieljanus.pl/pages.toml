["https://plblog.danieljanus.pl/2018/11/11/niepodleglosc"]
title = "Święto niepodległości"
full_description = "Przemoc fizyczna należała w nim do rzadkości. Jednak przemoc nie musi być fizyczna: przemocą jest każdy akt narzucania własnej woli siłą drugiemu człowiekowi. W istocie na to, co dla mnie ważne, było w tym domu miejsce o tyle, o ile było akceptowane lub przynajmniej tolerowane przez inną osobę. Kiedy zaś rzeczy ważne dla mnie nie pasowały do jej wizji świata, spotykały się ze zdecydowanym sprzeciwem, a czasem jawną pogardą. Dobrze pamiętam wrażenie, że muszę najdosłowniej wyszarpywać dla siebie przestrzeń po kawałku i kurczowo się jej trzymać, i towarzyszące temu wrażeniu uczucie sfrustrowanej bezsilności. Właśnie ze względu na ową bezsilność ominął mnie klasyczny okres buntu młodzieńczego: trudno się buntować, kiedy nie ma się siły. Pozbawiano mnie możliwości dokonywania wyborów, podejmowania decyzji i mierzenia się z ich konsekwencjami. Jeszcze długo po usamodzielnieniu się, kiedy zniknęły fizyczne ograniczenia w postaci opresyjnego środowiska, nie potrafiłem znaleźć w sobie wiary, że mogę różne rzeczy, a moje wybory polegały na ogół na pójściu ścieżką najłatwiejszą albo na biernym siedzeniu w miejscu. Trzeba było wielu lat i wielomiesięcznej terapii, żeby to się zaczęło zmieniać. I żeby pojawiła się we mnie ta iskra, to coś w środku, co sprawia, że idziemy przez życie z podniesionym czołem, robimy swoje, a świat nam nie wchodzi w paradę. Dzisiejsze święto jest dla mnie okazją do refleksji, w jakim kraju i w jakim świecie chcę żyć. Jestem przekonany, że przemoc, narzucanie innym własnego zdania, nieliczenie się z drugim człowiekiem – fundamentalnie kłóci się z wartością, która dała temu świętu nazwę. Marzę o tym, żebyśmy wszyscy rozmawiali ze sobą; żebyśmy byli gotowi słyszeć, co jest ważne i potrzebne innym osobom, i żebyśmy sami byli słyszani; i żeby na każdą i każdego z nas było miejsce. Jestem też przekonany, że nie ma czegoś takiego jak wrodzona potrzeba wywierania przemocy. Przemoc to zaklęty krąg, który potrafi propagować się przez pokolenia i zarażać całe zbiorowości; ale ten krąg można i trzeba rozrywać, neutralizować. Uważam to za swój obowiązek, w takim zakresie, w jakim mogę to robić. I chcę, żeby instytucje w kraju, w którym żyję, potrafiły sprawnie gasić przemoc, pomagać jej ofiarom i skutecznie chronić osoby, które są szczególnie na nią narażone."
year_published = 2018
