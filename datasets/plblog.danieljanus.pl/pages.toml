["https://plblog.danieljanus.pl/2012/12/04/moja-ulica-murem-podzielona"]
title = "Moja ulica murem podzielona"
full_description = '''Autobus zjeżdżający z gór wysadza nas na przystanku u bramy starego miasta. Dokładniej w południowo-zachodniej części, konstatujemy spojrzawszy na mapę. Określenie "brama" w tym miejscu jest przenośne: funkcję bramy pełni rondo wyłożone pół asfaltem, pół brukiem; mur, który kiedyś otaczał miasto, jest teraz rozkopanym rowem, z którego zaczynają wyrastać fundamenty nie wiadomo czego. Według mapy, hostel mieści się na starówce, we wschodniej części, tuż przy granicy. To jakieś półtora kilometra stąd. Wciąż nie wiemy, czy mają wolne miejsca (taki urok trampowego wyjazdu: nigdy nie wiesz, gdzie będziesz spać jutro) – iść tam od razu czy najpierw zadzwonić? Nie jest daleko, ciepły wieczór zachęca do spaceru. Zabieramy plecaki i ruszamy. Miasto tętni życiem, jest gwarno, ludzie siedzą w knajpach albo niespiesznie przechadzają się od jednej do drugiej. Po kilku minutach docieramy do ulicy wyglądającej jak główny deptak. Na środku placu, między konarami drzewa rozsiadł się kot, drzemiąc i niewiele sobie robiąc z rzeczywistości. Dwa inne krążą między turystami w nadziei na darmowe żarcie. Jeszcze jeden rzut oka na mapę. -- No, thanks, I'm fine. – odpowiadam, odsuwając się na wszelki wypadek. Ludzie tu bardzo chcą być pomocni, co czasem bywa irytujące: wystarczy przez chwilę wyglądać na zagubionego. Powinniśmy pójść na północ, wzdłuż tego deptaku, a potem po jakichś dwustu metrach skręcić w prawo i iść cały czas prosto. Ulica, skręcając łukiem o dziewięćdziesiąt stopni z powrotem na północ, wyprowadzi nas w końcu na przecznicę, przy której jest hostel, a stamtąd już tylko dwa kroki. Odrywamy wzrok i obiektyw aparatu od śpiącego kota i ruszamy dalej, zgodnie z planem schodząc z deptaku za McDonaldem. Pierwsze, co rzuca się w oczy, to znacznie mniej przechodniów; ale to jasne – przy tej ulicy prawie nie ma kawiarń, więc wszyscy siedzą przy deptaku, gdzie koncentruje się nocne życie. Przecinamy małe rondo na przełaj. Dalsza część ulicy nie jest oświetlona, tylko gdzieniegdzie w oknach palą się światła. Uliczka jest wąska, na szerokość jednego samochodu, z wąziutkim kawałkiem chodniczka z jednej strony: prawie trzeba się przytulać do budynków, gdy coś przejeżdża. Stare szyldy na pozamykanych zakładach wyglądają na nieodnawiane od lat. Uśmiechamy się na widok jednego z nich głoszącego NO BORDERS. Jakże adekwatne.'''
year_published = 2012
