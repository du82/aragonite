["https://plblog.danieljanus.pl/2025/02/01/na-polowie-czasu"]
title = "Na połowie czasu"
full_description = "W życia wędrówce, na połowie czasu, Straciwszy z oczu szlak niemylnej drogi, W głębi ciemnego znalazłem się lasu. „Połowa czasu” to wiek 35 lat. Jak podaje Porębowicz w przypisie, Dante w „Biesiadzie” ustala średni czas życia ludzkiego na lat 70, zaś ową trzydziestkę piątkę nazywa jego „prawdziwie szczytowym punktem” („veramente è colmo de la nostra vita”). Teraz żyjemy trochę dłużej i mam spore szanse dożyć osiemdziesiątki, więc powiedzmy, że „połowa czasu” wypada teraz. W maju 2024 skończyłem 40 lat. I nic się nie zmieniło – poza tym, że coraz częściej łapię się na myśleniu o upływającym czasie. Bo tak: zawsze byłem najmłodszy w okolicy. W szkolnej klasie, w towarzystwie, w pierwszej i drugiej pracy – przyzwyczaiłem się do myślenia o sobie w ten sposób; stało się to częścią mojego samopostrzegania, jeśli nie tożsamości. I jak łatwo zgadnąć, niepostrzeżenie przestało być prawdą. Pracuję teraz z ludźmi, którzy w większości są młodsi ode mnie, czasem o pół pokolenia. I zadaję sobie pytania: do czego, jeśli do czegokolwiek, jest mi potrzebne to przekonanie? Czy nadal mam prawo uważać się za młodego? Na czym w ogóle polega młodość? Może na poczuciu, że wszystko przede mną, że przyszłość kryje w sobie nieprzebrane bogactwo doznań i niewyczerpany wręcz zapas czasu, żeby je wszystkie przeżyć. Z tego punktu widzenia młodość mam za sobą. 80 lat to zaledwie nieco ponad cztery tysiące tygodni – przypomina mi się wizualizacja, która dobitnie i boleśnie uświadamia, jak mało to jest czasu. Na każdą rzecz, którą zrobię w życiu, przypadają setki rzeczy, które chcę zrobić, ale nie zdążę. Wybór jest nieunikniony: od samej tej nieuchronności można poczuć przygnębienie. Oczywiście chciałoby się wybierać optymalnie, ale tu znowu pytanie: czym ową optymalność mierzyć, jakie kryteria stosować? Chyba nie chcę iść w tę stronę. Niezależnie od przyjętych kryteriów jest więcej niż pewne, że popełnię jeszcze mnóstwo błędów: równie dobrze mogę się z tym pogodzić. I pamiętać, co jest dla mnie ważne oraz że niekoniecznie pokrywa się to z tym, w co pakuję dziennie mnóstwo uwagi i frustracji (spoiler: praca)."
year_published = 2025
