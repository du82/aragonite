["https://plg.uwaterloo.ca"]
title = "PLG"
full_description = "Programming Languages Group Computer Science and Electrical & Computer Engineering University of Waterloo Every aspect of computer science depends on programming languages to transform human ideas into a practical, functioning form executable by a computer. There are many different programming languages, each addressing a well-defined purpose across a number of diverse computing environments. The Programming Languages Group (PLG) does research across this full spectrum: language design, parsing, type theory, static/dynamic analysis, code generation and runtime systems. PLG also examines the software life-cycle: development tools, code comprehension/transformation, performance, debugging, and programmer behaviour and productivity. The research goal is to ease transforming human ideas into an executable form by a computer, which can be accomplished at multiple levels in the highly complex software stack. Projects Averroes: a tool to build sound and precise call graphs for an application without analyzing the whole program C∀ Programming Language: C extended with modern features. The Checker Framework: a framework to build pluggable type systems for Java, allowing you to enforce and infer advanced program properties. Example uses include enforcing freedom from null-pointer exceptions and verifying information flow in Android apps. Correlated calls: a tool for improving the precision of static data-flow analysis for object-oriented programs; comes with an implementation of the IDE algorithm Flix: a declarative programming language for fixpoints on lattices. μC++: C++ extended with high-performance concurrency. Mailing List To subscribe to the PLG mailing list requires a confirmation from an existing PLG member. Contact a member to join."
year_published = 2025
