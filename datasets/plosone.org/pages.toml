full_description = "01/29/2025 Exercise “I sometimes feel like I can’t win!”: An exploratory mixed-methods study of women’s body image and experiences of exercising in gym settings Cowley and Schneider present a study of female gym-goers and identify factors that may limit activity levels, including judgement of women's appearance and performance, safety concerns, and available space, towards informing work to create more inclusive exercise spaces. Image credit: Fitness Icon by macrovector_official, Freepik 01/22/2025 Climate Change Globalizing opposition to pro-environmental institutions: The growth of counter climate change organizations around the world, 1990 to 2018 Furuta and colleagues present the case that counter climate change organizing is driven both by economic interests and reactionary political interests. Image credit: Global Warming Pollution by Chris_LeBoutillier, Pixabay 01/15/2025 Archaeology From tiny to immense: Geological spotlight on the Alexander Mosaic (National Archaeological Museum of Naples, Italy) using non-invasive in situ analyses Balassone and colleagues use innovative techniques to characterise materials used in the creation of the the world-renowned Alexander Mosaic. In addition to investigating how the artwork was created, this study is helping in the restoration of this artwork today. Image credit: Fig 1 by Balassone et al., CC BY 4.0 01/22/2025 Well-being Life satisfaction around the world: Measurement invariance of the Satisfaction With Life Scale (SWLS) across 65 nations, 40 languages, gender identities, and age groups Swami and colleagues conducted a large-scale global study to examine the stability of measuring life satisfaction across 65 nations, 40 languages, gender identities, and age groups. Image credit: Business Partnership by Dawn Hudson, CC BY 1.0 02/04/2025 EveryOne United by Unique: Celebrating World Cancer Day 2025 PLOS One Associate Editor Jenny Tucker reports on the newly introduced theme in oncology research for 