["https://plugins.craftcms.com/cache-flag"]
title = "Cache Flag"
description = "Cold template caches that can be flagged and automatically cleared."
full_description = "Cache Flag adds a new {% cacheflag %} Twig tag to Craft CMS, which works just like the native {% cache %} tag, except that it will not save element queries for automatic cache invalidation (unless you tell it to). Cache Flag enables you to add flags (i.e. keywords) to your content and template caches. When elements corresponding to those flags are saved, deleted, moved or change status, Cache Flag invalidates the appropriate template caches automatically. Additionally, Cache Flag enables you to have completely cold template caches, optionally flagged with arbritrary flags (again, those are basically keywords) that you can invalidate manually on a per-need basis, programmatically or as part of a deploy setup or other logic, through CLI commands or a HTTP web controller."
year_published = 2025
clearnet = "https://plugins.craftcms.com/cache-flag"
