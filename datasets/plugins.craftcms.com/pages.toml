["https://plugins.craftcms.com/blitz"]
title = "Blitz"
description = "Intelligent static page caching for lightning-fast sites."
full_description = "Be sure to read the Performance Testing Craft CMS with Blitz article for an eye-opening look at the impact of using Blitz. Blitz makes your site fly. By serving cached pages, load times are reduced to the absolute minimum, making your site feel light-weight and instantaneous to navigate. Because your site's pages are statically cached, the site remains available even when performing Craft updates and maintenance. Your web server no longer has to spin up PHP and render templates on each request. Statically cached pages can be served from a reverse proxy CDN such as Cloudflare or from a static host such as Netlify, meaning that you can deliver high performance sites using much more inexpensive servers. Predictability Cache invalidation happens automatically in the background as content is edited, making for a seamless author experience. The plugin is a breeze to set up, very configurable and thoroughly tested. Extensibility Blitz comes with built in cache storage, cache warmers, reverse proxy purgers and deployers. Bring your own drivers for full control and customisation."
year_published = 2025
clearnet = "https://plugins.craftcms.com/blitz"
tags = ["blitz", "cost", "extensibility", "features", "predictability", "saving", "speed", "stability"]
language = "en"
