en as a single monolithic function, we struggled to cleanly represent this polymorphism using case statements, multimethods, or protocols. But once we expressed the core composition structure using Graph, the polymorphism became trivial – each feed just provides a set of nodes that are combined into a shared default Graph using ‘merge’. Flexible execution strategies The eager compilation presented above is just the simplest possibility; because the Graph is not tied to a single execution strategy, you can also compile graphs in more interesting ways: For one, you can compile a Graph to a lazy map, so that values are only computed as needed. This solves the problem mentioned above: if you only need the mean, only the mean (and count) are computed, and if you need everything you get it all with only minimal overhead (each value is only computed once). Similarly, you can automatically parallelize a Graph’s computations with parallel-compile, which executes independent steps concurrently. For instance, when computing the variance the mean and mean-square can be computed in parallel because there is no edge between them. With a bit more tooling, we also compile Graphs to entire production services (where nodes build resources such as database handles and in-memory caches); and one could also compile Graphs to more exotic configurations such as cross-machine streaming topologies. Monitoring, debugging, and testing If the only benefit from Graph was simpler, more flexible and modular code, we’d be happy to stop there. But Graph also makes it much easier to debug, test, and monitor our production code. For example, it’s trivial to write a higher-order function that takes a Graph and produces a new Graph that monitors the call counts and average execution times of each of the nodes: We use this pattern to keep tabs on our Graphs running in production, and generate informative tables like this one on our internal dashboard: <table width=400 border=1 cellspacing=1> Node# CallsAverage time (ms) :n10003.0 :m100011.2 :m280025.3 :v5000.2 </table> For production services, similar patterns enable us to cleanly shutdown an entire service (flushing caches, destroying thread pools, and so on), and cleanly test entire services by mocking out nodes with merge/assoc as discussed above. What’s next? This post has just scratched the surface of what’s possible by using a simple, declarative abstraction like Graph to express the compositional structure of real software systems. At the end of the Strange Loop talk, I mentioned the possibility of open sourcing Graph, and received an unexpectedly very positive response. We’re really excited about this possibility, and hope to make an alpha version available in the coming weeks. We’ve also developed many other libraries here that we’re excited about releasing to the community, so stay tuned! Please let us know what you think in the Hacker News comments."
