ss, put simply each entry in PM2 Runtime list is a process. It can be a worker in a cluster, a app in fork mode or a module. Is there a free plan? PM2 Plus doesn't offer any free plan. However PM2 Runtime itself remains free as it's open source. Can I cancel anytime? Yes. After you cancel your subscription, you'll finish the current month then your access will be disabled (can be re-enabled later of course) Can I pay yearly Yes, it also gives you a 20% discount on your subscription. Note that this only refer to PM2 Plus subscription. If the pricing changes, will I have to pay the difference? No. While we reserve the right to change the pricing, you will always be charged the same price agreed upfront. Is there any trial? It's possible to do a trial, you need to contact our sales team via this form. What happens if i cross the limit of my plan? If you exceed the number of processes, our system will automatically ignore the exceeding processes (ramdonly choosen). // window.onscroll = function() {myFunction()}; // var header = document.getElementById("list-header"); // var sticky = header.offsetTop; // function myFunction() { // if (window.pageYOffset > 500 && window.pageYOffset < 1400) { // header.classList.add("sticky"); // header.style.display = "inline-flex"; // } else { // header.classList.remove("sticky"); // header.style.display = "none"; // } // }'''
