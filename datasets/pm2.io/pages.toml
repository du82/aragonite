full_description = '''Issue dashboard By default when one of your applications crash, pm2 will of course automatically restart it but it will also send the error to PM2 Plus. In the issue dashboard, you will be able to see for each error: How much time the error happened? The servers that were impacted by this errors The stack trace The exact line of code that thrown the error Few applications logs before the error happened You can of course delete them if you think they are not relevant by click on ` Manually emit an issue It’s possible that you need to report an error that isn’t crashing your process. In this case you can use io.notifyError: const io = require('@pm2/io') try { // Critical action to be tested user.sendNotifications() } catch (error) { io.notifyError(new Error('Notification failed'), { // or anything that you can like an user id custom: { user: user.id } }) } Next Steps Notifications /* * * CONFIGURATION VARIABLES * * */ var disqus_shortname = 'pm2'; /* * * DON'T EDIT BELOW THIS LINE * * */ (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
