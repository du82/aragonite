title = "Selective Deposit Collections  - PMC"
full_description = "Selective Deposit Collections Selective Deposit is a PMC participation option intended for the deposit of a subset of articles from a collection of journals. This model is generally used by publishers who offer a hybrid publishing model, i.e., subscription-based journals in which selected open access articles are published, or publishers who wish to support the policies of a particular funder which require articles to be made available in PMC under specific license terms. Learn more about Selective Deposit eligibility on the PMC Policies page. The journals included in the selective deposit collections below do not automatically deposit every NIH-funded paper in PMC. The author can choose to arrange with the journal for the deposit of a specific article; this usually involves choosing the journal's fee-based open access option for publishing that article. Please contact the respective journal or publisher directly for details. Clicking on the Selective Deposit Collection name in the table below will open PMC search results that include full-text articles deposited as part of that publisher's collection. Selective Deposit Collection Publisher AACR Open Access American Association for Cancer Research ACS AuthorChoice American Chemical Society AIP Publishing Selective Deposit American Institute of Physics American Academy of Pediatrics Selective Deposit American Academy of Pediatrics American Psychiatric Publishing Funder-Supported Public Access American Psychiatric Publishing APA Open Access American Psychological Association ASME Digital Collection American Society of Mechanical Engineers Bentham Open Access Bentham Science Publishers BMJ Open Access BMJ Publishing Group The Bone & Joint Journal British Editorial Society of Bone and Joint Surgery Cambridge Open Access Cambridge University Press De Gruyter Funded Articles De Gruyter Edinburgh Open Edinburgh University Press Elsevier Sponsored Documents Elsevier Emerald Publishing Open Access Emerald