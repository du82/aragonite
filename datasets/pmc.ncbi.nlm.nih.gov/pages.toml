["https://pmc.ncbi.nlm.nih.gov/about/userguide"]
title = "PMC User Guide  - PMC"
full_description = '''PMC User Guide PubMed Central® (PMC) is a free full-text archive of biomedical and life sciences journal literature at the U.S. National Institutes of Health's National Library of Medicine (NIH/NLM). This guide is meant to help you use PMC to find and read articles of interest to you. Answers to many common questions about PMC are available in the PMC FAQ. Tip: If you are a researcher seeking to submit an author manuscript to PMC, visit the NIHMS. (For more information on submissions to PMC, see For Authors.) PMC Journal List The PMC Journal List (https://pmc.ncbi.nlm.nih.gov/journals/) contains journals that 1) have an agreement with NLM to make the final published version of all their articles, or all their NIH-funded articles, available in PMC or 2) are historically-significant journals from the Biomedical Journal Digitization project. PMC also includes individual articles from other journals, either deposited as manuscripts by the authors in support of a funder mandate, or by the publisher through a Selective Deposit arrangement; These journals are not searchable in the PMC Journal List. Try a separate search of the NLM Catalog: Journals referenced in the NCBI Databases or try the user guide section on how to search PMC for articles from a specific journal. Figure 1. PMC Journal List with numbers highlighting important features Click on the info button for guidance on how to search PMC for articles from a specific volume/issue of a journal, and to learn more about the scope of the PMC Journal List. To search for a journal or set of journals enter your search terms into the "Search for Journals" search box. The search only looks for words in a journal's title. You may also search for a specific journal using the NLM Unique ID, the unique identifier for a journal in the NLM Catalog, assigned by NLM. Auto-complete options are presented to help you find specific journals. Clear your search results with the "Reset to Full Journal List" link. a) Narrow your search results using the filters on the right-hand side of the page. See the Journal List Field descriptions for details about the specific fields. b) On a mobile device, filters are available by clicking on the icon in the upper right corner of your display. Download the full journal list in comma separated value format (csv) using the "Download full journal list" link. Download the results of your search and/or filtering in csv format with the "Download results" link. For each journal that matches your search terms and filter options, a record with basic bibliographic data and information about PMC coverage is displayed. Use the "See all articles in PMC from this journal" link in each record to run a search to retrieve all articles for the journal in PMC. A Journal Note section will display when there is information available about gaps in PMC's content coverage for a journal or other important changes in a journal's agreement type with NLM. A Title History section will display when there is a history of title changes for a journal over time. Click on the linked journal title(s) in this section to view the additional journal record(s). Journal List Field Descriptions For each journal record, the following data fields are displayed: Field Description Journal title The title of the journal NLM Title Abbreviation The unique abbreviation of a journal title, assigned by NLM, used in citations. Publisher The publisher of the journal. ISSN (print) ISSN, the 8-digit standardized international code used to identify the print version of the journal. ISSN (online) ISSN, the 8-digit standardized international code used to identify the electronic (online) version of the journal. NLM Unique ID The unique identifier for the journal in the NLM Catalog, assigned by NLM. Most Recent The volume and year of the most recent content archived in PMC. Earliest The volume and year of the earliest content archived in PMC. Release Delay (Embargo) How soon after publication the journal makes its content available in PMC by default. Some publishers make individual articles available sooner than the default embargo shown in the journal list. Agreement Status Shows if a journal’s participation agreement is active or not. Possible values are: Active = currently depositing content in PMC No longer participating = the journal has stopped depositing content to PMC under the agreement No longer published = the journal has ceased publication Predecessor title = the journal is continued by another title Agreement to Deposit Shows the type of agreement the journal was deposited under. Possible values are: All articles = Full Participation agreement NIH-funded articles = NIH Portfolio agreement Journal Note A Journal Note section is displayed when there are gaps in coverage, changes in agreement type, or other information about the journal. Title History A Title History section is displayed if a journal has undergone a title change over time. Each current and predecessor title is listed, along with PMC coverage. PMC Article Search To search for full-text articles in PMC, type a term or concept into the search box at the top of any PMC page and run the search. Suggestions will display as you type your search terms. For many searches, it is not necessary to use special tags or syntax, though PMC does support more structured searching and filters to refine your results and help you find the information you are seeking. The PMC Citation Search tool is also available to find PMC articles by specific citation information. Tip: Searches are not case sensitive. Learn to search by: Author | Journal | Volume and Issue | Collection | Funder | License | Publication Date | PMC Live Date | Article Property Other search topics: Phrase Searching | Truncating Search Terms | Combining Search Terms with Boolean Operators (AND, OR, NOT) By Author In the Search box, enter the author's full name or their last name followed by initials, without punctuation. If you only know the author's last name, use the author search field tag [au] as shown in an example below. Author names are automatically truncated to account for varying initials and designations such as Jr. To turn off the truncation, use double quotes around the author's name with the author search field tag [au] as shown in an example below. Author Searches Search Query Examples Full Name David Lipmandavid lipman Last Name and Given Name Initials Lipman DJlipman dj Last Name (with author search field tag [au]) lipman[au] Last Name and Given Name Initials (with truncation turned off by using quotes) "smith j"[au] By Journal In the Search box, enter the journal title, the NLM journal title abbreviation, or the ISSN, the 8-digit standardized international code used to identify journals. Journal Search Search Query Examples Full journal title Journal of the Medical Library Association journal of the medical library association Full journal title with journal search field tag "Journal of the Medical Library Association"[ta] "Journal of the Medical Library Association"[journal] Journal title abbreviation Proc Natl Acad Sci U S A Journal title abbreviation with journal title abbreviation search field tag "Proc Natl Acad Sci U S A"[ta]"Proc Natl Acad Sci U S A"[journal] ISSN 1948-71931948-7193[ta]1948-7193[journal] Journal Search Tips If a journal title or abbreviation includes a special character (e.g., parentheses, brackets, ampersands), enter the title or abbreviation without the special characters. For complete retrieval of indexed items, we recommend a search using the full journal title or the journal title abbreviation as older articles may not have an ISSN. If you are searching using the full journal title or title abbreviation in the Search box along with additional search terms, it is helpful to use quotation marks around a journal's title, e.g., obesity "preventing chronic disease"[journal]. By Volume or Issue To retrieve all the articles in PMC from a specific volume or issue of a journal, include the volume number or the volume and issue number in a journal search query. Volume and Issue Search Search Query Examples Find all articles in volume 111 issue 3 of the Journal of the Medical Library Association J Med Libr Assoc[ta] AND 111[volume] AND 3[issue] Find all articles in volume 6 of the journal, BMC Biomedical Engineering. "BMC Biomed Eng"[ta] AND 6[volume] Find all articles in volume 2022 of the journal, Advances in Orthopedics. "Adv Orthop"[ta] AND 2022[volume] Find all articles in a journal with the ISSN of 1091-6490 in volume 7 issue 6. 1091-6490[ta] AND 7[volume] AND 6[issue] Tip: Use the PMC Citation Search tool to easily build a search for a specific volume or issue of a journal. Figure 2. Example of using the PMC Citation Search tool with numbers highlighting the 3 steps to find all articles available in PMC for issue 3 in volume 111 of the Journal of the Medical Library Association The example shown in Figure 2 is a search of PMC for all the articles in the journal with the title abbreviation "J Med Libr Assoc" that are in volume 111, issue 3. The steps are described below. Enter the full journal title or journal title abbreviation in the Journal field. Enter a volume number and/or desired an issue number in the Volume and Issue fields. Click the Search button at the bottom of page to conduct your search. Select the “Include embargoed articles” option in the Text Availability section of the filters on the lefthand side of the search results to include embargoed articles in the results (see item #4 in the section titled Understand the Search Results Page.) By Collection Explore the contents of collections in PMC by entering the appropriate preset PMC search filter(s): Collection Search Query Author Manuscripts "author manuscript"[filter] NIH Preprints preprint[filter] Open Access Subset "open access"[filter] Digitized Historical Biomedical Journals "is scanned"[filter] "historical OCR"[filter] Learn more about all of PMC's unique historical collections, open access and text mining collections, funder collections, and more on the PMC Collections page. By Funder Use or append the preset search filters shown in the Search Query column below to find articles supported by funding organizations that have formally partnered with NLM to use PMC as a repository for their funded research. Research Funder Search Query National Institutes of Health (NIH) "nih funded"[filter] Administration for Community Living (ACL) "acl funded"[filter] Agency for Healthcare Research and Quality (AHRQ) "ahrq funded"[filter] Centers for Disease Control and Prevention (CDC) "cdc funded"[filter] Food and Drug Administration (FDA) "fda funded"[filter] Office of Assistant Secretary for Preparedness and Response (ASPR) "aspr funded"[filter] Environmental Protection Agency (EPA) "epa funded"[filter] National Aeronautics and Space Administration (NASA) "nasa funded"[filter] National Institute of Standards and Technology (NIST) "nist funded"[filter] US Department of Homeland Security (DHS) "dhs funded"[filter] US Department of Veterans Affairs "va funded"[filter] See PMC and Research Funder Policies for additional information. By License Limit your search results to articles in the PMC Open Access Subset with specific Creative Commons (CC) licenses by appending the preset search filters shown in the Search Query column below. For descriptions of these licenses, please see the Creative Commons site, About the Licenses. Please note that not all articles in the Open Access Subset have a CC license. These filters are based on license information provided in the articles by publishers and other content providers. License type Search Query Any CC license "cc license"[filter] CC BY (Attribution) "cc by license"[filter] CC BY-ND (Attribution, no derivatives) "cc by-nd license"[filter] CC BY-NC (Attribution, noncommercial) "cc by-nc license"[filter] CC BY-NC-ND (Attribution, noncommercial, no derivatives) "cc by-nc-nd license"[filter] CC BY-NC-SA (Attribution, noncommercial, share-alike) "cc by-nc-sa license"[filter] CC BY-SA (Attribution, share-alike) "cc by-sa license"[filter] CC0 (Public domain) "cc0 license"[filter] By Publication Date Enter dates into the Search box using the format YYYY/MM/DD[pubdate], or enter a date range using a colon (:) between each date followed by a date search field tag. By PMC Live Date Enter dates into the Search box using the format YYYY/MM/DD[pmclivedate], or enter a date range using a colon (:) between each date followed by a date search field tag. If you are looking for the PMC Live Date for a specific record, See the corresponding PubMed record for the PMC release date of embargoed articles. See the "available in PMC" date included in the citation on the PMC record. See Version 2.0 of eSummary to get the PMC Live Date for any article in the database e.g., https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pmc&version=2.0&id=14900. Deposit date data are not available. By Article Property Search or append a search with any of the following queries to find articles with these specific properties in PMC: Article property Search Query Has supplementary material "has suppdata"[filter] Has a "Data Availability" and/or a "Data Accessibility" section "has data avail"[filter] Has references tagged with a proper type to be rendered as data citations "has data citations"[filter] Has supplementary material and/or data availability/accessibility section (best option for finding papers that may have openly accessible datasets associated) "has associated data"[filter] Has abstract "has abstract"[filter] Has PDF "has pdf"[filter] Has a preprint version also available in PMC "has preprint"[filter] Has video "has video"[filter] Is a scanned article "is scanned"[filter] Is a letter letter[filter] Is a reply to a letter reply[filter] Is an expression of concern about an article "expression of concern"[filter] Is an articles that has a published expression of concern "has expression of concern"[filter] Is a correction to an article correction[filter] Is an article that has a published correction "is corrected"[filter] Is a retraction of an article retraction[filter] Is an article that has been retracted "is retracted"[filter] Is cited by other articles in PMC "cited in pmc"[filter] Is in PMC and under embargo "pmc embargo"[filter] Phrase Searching PMC does not perform adjacency searching. However, many phrases are recognized by the MeSH Translation Table used in PMC's automatic term mapping feature. For example, if you enter “influenza in birds”, PMC recognizes this phrase as a MeSH concept. If a phrase is not recognized, you can instruct PMC to bypass automatic term mapping and search for a specific phrase using the following formats: Enclose the phrase in double quotes: "kidney allograft". When you enter your search terms as a phrase (using quotation marks), PMC will not perform automatic term mapping, which includes expansion of MeSH terms. Use a search tag: kid'''
