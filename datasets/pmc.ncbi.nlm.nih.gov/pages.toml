title = "New in PMC - PMC"
full_description = '''New in PMC October 21, 2024 - PMC Transitions to Updated Website October 17, 2024 - PMC Tagging Guidelines Accessibility Updates September 16, 2024 - PMC website update coming October 16 March 21, 2024 - Preview Upcoming Improvements to PMC December 15, 2023 - Update on PubReader Format August 30, 2023 - Update on Access to Coronavirus-related Articles in PubMed Central (PMC) COVID-19 Collection after end of Public Health Emergency May 03, 2023 - PMC Public Health Emergency Initiatives Update April 19, 2023 - Clarifying PMC's Role as an Archive January 30, 2023 - Second Phase of the NIH Preprint Pilot Launched January 10, 2023 - Next Phase of NIH Preprint Pilot Launching Soon September 08, 2022 - PMC Collaborating with Publishers in Response to Mpox Public Health Emergency August 30, 2022 - PMC Releases Improved Related Resources Feature March 22, 2022 - New PMC Website Design is Live! February 24, 2022 - Public Access in PMC Update September 21, 2021 - New Directories and File Packages for Bulk Retrieval of the PMC Article Datasets June 14, 2021 - PMC Labs is here - Let Us Know What You Think! June 15, 2020 - NIH Preprint Pilot Launched March 26, 2020 - PMC Collaborating with Publishers in Response to COVID-19 Public Health Emergency July 31, 2019 - PMC Tagging Guidance for Peer Review Documents Now Available February 04, 2019 - Unique Identifiers for Supplemental Material January 14, 2019 - Open Access Subset FTP Clean Up January 07, 2019 - PMC Adds Support for Machine-Readable Clinical Trial Information November 15, 2018 - Discovering Associated Data in PMC October 23, 2018 - Open Access Week 2018 and PMC June 26, 2018 - Updated information on journal selection and participation agreements released April 18, 2018 - Data Filters in PMC and PubMed March 28, 2018 - Article Display Updates January 04, 2018 - PMC Year in Review December 18, 2017 - PMC Canada Status Update October 30, 2017 - Updated guidance on data deposit and linking in PMC August 28, 2017 - PMC Continues to Expand its Role as a Repository for Federally and Privately-funded Research January 19, 2017 - PMC Bulk Download via FTP is Now Using New Naming Conventions August 17, 2016 - New Search Result Filters and Updated Reference List Display August 01, 2016 - FTP service update to improve access to text mining collections March 24, 2016 - Public Access Expansion and PMC January 11, 2016 - NIH Author Manuscripts Available for Text Mining December 15, 2015 - Updated PMC journal review process and minimum requirements November 23, 2015 - CC0 Filter Now Available February 05, 2015 - Full text now available for OA subset articles, in plain text format November 18, 2014 - Citation Exporter Feature Now Available March 28, 2014 - PMC Advisory Committee Meeting to be Held in June February 24, 2014 - Three Million Articles are Now in PMC!! November 18, 2013 - PMC Releases New ID Converter November 18, 2013 - New Version of NCBI Handbook is Released September 04, 2013 - New Version of PubReader is Released August 15, 2013 - A New PMC Mailing List and RSS Feed August 05, 2013 - Search for Open Access Articles by License July 17, 2013 - JATS-Con 2013 Program is Now Available April 22, 2013 - Keep Better Track of PMC Features April 19, 2013 - New OA Web Service for PMC February 01, 2013 - KoreaMed Synapse Adds PubReader as a Display Option February 01, 2013 - PMC Advisory Committee Appoints New Members December 11, 2012 - PubReader - A New Presentation Style for PMC November 05, 2012 - UKPMC Rebranded as Europe PMC August 22, 2012 - JATS Becomes NISO Standard July 13, 2012 - A Facelift for PMC July 12, 2012 - New Version of PMC Help is Released March 26, 2012 - JATS-Con Dates Announced for 2012! February 29, 2012 - PMC Advisory Committee Appoints New Members July 12, 2011 - JATS-Con is Coming! June 20, 2011 - The PMC 10th Anniversary Video is now on YouTube! June 14, 2011 - PMC Advisory Committee to Meet at NLM May 26, 2011 - A Brand New Look for PMC! February 28, 2011 - Ten Years After: PMC Milestone Featured in February 17, 2011 - New Members Appointed to PMC Advisory Committee September 14, 2010 - A New Look and Feel for PMC's Public Access Page June 25, 2010 - PMC Hits Two Million Mark!! June 17, 2010 - First-Ever Journal Article Tag Suite Conference (JATS-Con) to be Held in November 2010 April 29, 2010 - PMC Canada's Manuscript Submission System Goes Live! February 24, 2010 - New Members for PMC Advisory Committee November 16, 2009 - New URLs in PMC October 28, 2009 - PMC Now Offers a "Preview" Table of Contents for Embargoed Issues October 21, 2009 - PMC Canada is Launched! October 01, 2009 - PMC Adds New Page on Public Access July 24, 2009 - New Search Function Released July 06, 2009 - PMC Canada to Start in Fall 2009 June 16, 2009 - PMC Advisory Committee Meets at NLM May 19, 2009 - New Version of PubMed Central Journal List Released October 21, 2024 PMC Transitions to Updated Website On October 16, 2024, NLM's NCBI transitioned to an updated PubMed Central (PMC) website, representing the next step in ongoing efforts to modernize NLM's products and services. As part of this update, the primary URL for the PMC website has changed from ncbi.nlm.nih.gov/pmc to pmc.ncbi.nlm.nih.gov. In addition, you'll notice a new look, feel, and organization of PMC article pages and the PMC Journal List. Learn more in the NLM Technical Bulletin. October 17, 2024 PMC Tagging Guidelines Accessibility Updates The PMC Tagging Guidelines (TG) were updated on October 7, 2024, to provide new guidance for PMC data providers on how to deposit accessible article information using Journal Article Tag Suite (JATS) XML. This guidance aligns with accessibility recommendations from JATS for Reuse, a working group under NISO. This recommendation bases its set of tagging best practices on the following definition: "Accessibility is the practice of ensuring there are minimal barriers to access and interact with websites and other electronic information for users with physical or situational disabilities." The newly added Accessibility section provides an overview summarizing these recommendations and provides links to over 30 elements and document objects throughout the TG. For ease of identification, each updated TG area has an "Accessibility" section that provides guidance. PMC's operations team will be engaging with publisher and data providers to encourage adoption of this guidance to improve the digital accessibility of articles that are deposited into PMC over the long term. September 16, 2024 PMC website update coming October 16 On October 16, 2024, PMC will transition to a new website. This update, available for preview since March 2024 for user testing and feedback, will become the default for PMC on that date. With this update: the primary URL format for the website will change from https://www.ncbi.nlm.nih.gov/pmc/ to https://pmc.ncbi.nlm.nih.gov/ Existing links to most PMC pages with the prior format will redirect to the equivalent page using the new format. PMC search, the PMC Publisher Portal, and most of the public file validation tools will maintain the https://www.ncbi.nlm.nih.gov/pmc format. Journal "archive" pages will redirect to the new PMC Journal List record: https://www.ncbi.nlm.nih.gov/pmc/journals/2/ --> https://pmc.ncbi.nlm.nih.gov/journals/?term=Proceedings+of+the+National+Academy+of+Sciences+of+the+United+States+of+America Table of contents pages for issues will also redirect to the PMC Journal List. Visit the PMC User Guide to learn how to find articles by volume and issue. This change will NOT affect PubMed URLs (https://pubmed.ncbi.nlm.nih.gov/). See our previous posts in NCBI Insights (March 2024) and in the NLM Technical Bulletin (May 2024) for more details. March 21, 2024 Preview Upcoming Improvements to PMC We are pleased to announce the availability of a preview of improvements planned for the PMC website. These improvements will become the default in October 2024 and include an updated article display and enhanced PMC journal list. Click on the "Try it out now" link in the banner on the top of any page on the current PMC website to preview these updates, and visit NCBI Insights for more information. December 15, 2023 Update on PubReader Format The PubReader format was added to PMC in 2012 to make it easier to read full text articles on tablet, mobile, and other small screen devices. In March 2022, NCBI launched an updated PMC website. The updated website is mobile responsive, making it easy to read articles in PMC on any device. This makes some legacy features, such as the PubReader view, no longer necessary. In January 2024, we will remove the PubReader links from the PMC website. You will temporarily still be able to access the PubReader format by appending "?report=reader" to any PMC article URL (e.g., https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9825438/?report=reader). In May 2024, we will fully remove the PubReader functionality from the PMC website. Any link to the PubReader format will redirect to the standard, mobile responsive, PMC article view. For content in Bookshelf, PubReader view will continue to be available for the majority of titles, specifically those with unrestricted navigation. PubReader view is accessed from the Views menu on the right. August 30, 2023 Update on Access to Coronavirus-related Articles in PubMed Central (PMC) COVID-19 Collection after end of Public Health Emergency Early in the COVID-19 pandemic, the National Library of Medicine (NLM) collaborated with publishers and scholarly societies to expand access to coronavirus-related journal articles in PubMed Central (PMC). Through this collaboration, more than 50 publishers made more than 350,000 coronavirus-related articles accessible under various license terms through the PMC COVID-19 Collection (previously the PMC COVID-19 Public Health Emergency Initiative). As COVID-19 emergency declarations expired in the United States and around the globe, so too did article-level license terms for use of some of these articles. Most of the articles deposited in the PMC COVID-19 Collection will remain available in PMC, and all citations will remain searchable in PubMed and available for bulk distribution and reuse through the PMC Open Access Subset. However, some publishers retained the right to remove their content and have requested to do so. Details on changes to the licensing status or availability of content can be found in the NLM Technical Bulletin. More information, including a list of publishers and their licensing statuses, is available in the PMC COVID-19 Collection FAQs and on the PMC COVID-19 Collection webpage. May 03, 2023 PMC Public Health Emergency Initiatives Update The National Library of Medicine (NLM) recently renamed the COVID-19 and Mpox Public Health Emergency Initiatives as the PMC COVID-19 Collection and PMC Mpox Collection, respectively. NLM continues to work with publisher and scholarly society collaborators who contribute content to these collections to provide broad access and support reuse of relevant scientific literature. April 19, 2023 Clarifying PMC's Role as an Archive The role of what a library means in a digital world is evolving and expanding. PMC has a large and diverse user base that includes students and the public, as well as researchers, clinicians, and librarians. We recognize that these different audiences have varying levels of familiarity with NLM, the National Institutes of Health (NIH), and the scholarly publishing process and have recently updated how we describe, display, and share articles in PMC to provide our users with more context. Visit NCBI Insights for more information about these updates. January 30, 2023 Second Phase of the NIH Preprint Pilot Launched Today, we are pleased to announce the launch of the second phase of the NIH Preprint Pilot with the addition of more than 700 new preprint records to PubMed Central (PMC) and PubMed. This second phase expands the scope of the Pilot to include preprints resulting from all NIH-funded research. Eligible preprints are those acknowledging direct support of an NIH award or authored by NIH staff and posted to bioRxiv, medRxiv, arXiv, or Research Square, on or after January 1, 2023. NLM will automatically include the full text of the preprint (as license terms allow) and associated citation information in PMC and PubMed, respectively. New preprint records will be added on a weekly basis. Phase 2 of the pilot is expected to run through 2023. A project of NLM, the NIH Preprint Pilot was launched in 2020 to explore new approaches to increase the discoverability of NIH-supported research results, with the first phase focusing on NIH-supported research on COVID-19 and the SARS-CoV-2 virus. To learn more, visit the NIH Preprint Pilot page. January 10, 2023 Next Phase of NIH Preprint Pilot Launching Soon Last month, the National Library of Medicine (NLM) announced plans to extend its NIH Preprint Pilot in PubMed Central (PMC) and PubMed beyond COVID-19 to encompass all preprints reporting on NIH-funded research. The second phase of the pilot, launching later this month, will include preprints supported by an NIH award, contract, or intramural program and posted to an eligible preprint server on or after January 1, 2023. In preparation for the launch of this second phase, we have updated PMC and PubMed site features to help users of these databases incorporate the increased volume of preprints into their discovery workflows. See the NCBI Insights post for more information about these preprint record display and search filter updates. PMC will continue to update the NIH Preprint Pilot Overview and FAQs in the coming weeks. Please send your questions and feedback to pmc-preprints@ncbi.nlm.nih.gov. September 08, 2022 PMC Collaborating with Publishers in Response to Mpox Public Health Emergency On August 4, 2022, the White House Office of Science and Technology Policy (OSTP) announced a coordinated call to action with the science and technology leaders of more than 20 countries, requesting that publishers voluntarily make mpox and other orthopox-related publications freely and immediately accessible in appropriate public repositories to support the ongoing public health emergency response efforts. The call specified that these articles be made available with broad reuse rights in both human- and machine-readable formats to allow access to full text content and metadata. Publishers have responded to the call by volunteering to make their relevant articles accessible in PMC in formats and under license terms that facilitate text mining and secondary analysis. PMC-participating publishers can email PMC at pmc-phe@ncbi.nlm.nih.gov to notify us of their interest in collaborating on this effort. For a list of current collaborators, help with querying mpox-related literature, and more information, please visit our Public Health Emergency Mpox Initiative webpage. August 30, 2022 PMC Releases Improv'''
