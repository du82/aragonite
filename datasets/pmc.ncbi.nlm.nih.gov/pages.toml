title = "PMC National Advisory Committee  - PMC"
full_description = "PMC National Advisory Committee The PMC National Advisory Committee charter was not renewed in 2018. The complete archive of committee meeting minutes (2001-2015) is below. The PubMed Central National Advisory Committee advises the Director, NIH, the Director, NLM, and the Director, NCBI, on the content and operation of the PubMed Central repository. It is responsible for monitoring the evolution of PubMed Central and ensuring that it remains responsive to the needs of researchers, publishers, librarians and the general public. The committee meets at least once a year at the National Library of Medicine. Committee members are appointed by the NIH Director from the biomedical and information communities and the general public. Meeting Minutes June 9, 2015 PDF (300K). June 10, 2014 PDF (316K). June 27, 2013 PDF (179K). June 19, 2012 PDF (200K). June 17, 2011 PDF (192K). June 4, 2010 PDF (220K). June 15, 2009 PDF (107K). June 17, 2008 PDF (37K). April 19, 2007 PDF (36K). October 26, 2006 PDF (52K). April 26, 2006 PDF (37K). October 20, 2005 PDF (38K). April 28, 2005 PDF (27K). November 22, 2004 PDF (27K). May 10, 2004 PDF (22K). December 2, 2003 PDF (32K). June 25, 2003 PDF (26K). January 16, 2003 PDF (25K). January 14, 2002 PDF (25K). March 21, 2001 PDF (24K). Last modified: Wed Sept. 30 2020"
