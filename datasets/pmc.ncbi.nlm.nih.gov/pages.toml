["https://pmc.ncbi.nlm.nih.gov/about/collections"]
title = "PMC Collections  - PMC"
full_description = "PMC Collections PubMed Central® (PMC) archives millions of full-text articles, spanning centuries of biomedical and life science research. In its roles as journal archive, funder repository, and open science hub, PMC collects and distributes content under numerous participation agreements, funder policies, private-public partnerships, and initiatives. This page provides an overview of the resulting browsable collections, ordered by general size of the collection from largest to smallest. PMC Journal List Browse the PMC journal list to access the journals for which NLM has agreements with publishers and scholarly societies who deposit articles directly to PMC. Learn More PMC Article Datasets PMC includes several subsets of articles where files for text mining and other purposes are made available under Creative Commons or similar licenses. Learn More Author Manuscripts PMC is a repository for peer-reviewed accepted author manuscripts supported by the NIH as well as other public and private funders from around the globe. Learn More Selective Deposit Collections Encompassing a number of publishers in the biomedical and life sciences, this list of publisher-based collections spans thousands of journals that deposit select articles to PMC. Learn More COVID-19 Collection A collaboration between NLM and more than fifty publishers to make coronavirus-related articles accessible in PMC under license terms that facilitate re-use and secondary analysis. Learn More Mpox Collection A collaboration between NLM and scholarly publishers to make mpox and orthopox-related articles accessible in PMC under license terms that facilitate re-use and secondary analysis. Learn More Biomedical Journal Digitization Projects An NLM collaboration with publishers and other organizations to preserve the historical literature through scanning of print journal content. Learn More NIH Preprint Pilot A pilot project launched in June 2020 by NLM to make COVID-19-related preprints resulting from research funded by the NIH available in PMC to increase the discoverability of these works. Learn More NIH Findings of Research Misconduct Findings of Research Misconduct issued by the HHS Office of Research Integrity (ORI) since the mid-1990's are archived in PMC and linked to any associated articles named in a finding. Learn More Last modified: Tue Jan. 21 2025"
year_published = 2025
