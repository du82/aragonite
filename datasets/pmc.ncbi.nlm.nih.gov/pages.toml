["https://pmc.ncbi.nlm.nih.gov/about/mpox"]
title = "PMC Mpox Collection  - PMC"
full_description = '''PMC Mpox Collection The National Library of Medicine (NLM) has renamed the Mpox Public Health Emergency Initiative as the PMC Mpox Collection. On August 4, 2022, the White House Office of Science and Technology Policy (OSTP) announced a coordinated call to action with the science and technology leaders of more than 20 countries, requesting that publishers voluntarily make mpox and other orthopox-related publications immediately accessible in appropriate public repositories to support the ongoing public health emergency response efforts. The call specified that these articles be made available with broad reuse rights in both human- and machine-readable format to allow access to full text and metadata. Publishers (see list of collaborators on this page) responded to the call by volunteering to make their relevant articles accessible in PubMed Central (PMC) in formats and under license terms that facilitate text mining and secondary analysis. In addition, other journals and publishers that participate in PMC deposited their mpox-related articles routinely the same way. [ Image: Colorized transmission electron micrograph of mpox virus particles (red) cultivated and purified from cell culture. Image captured at the NIAID Integrated Research Facility (IRF) in Fort Detrick, Maryland. Credit: NIAID] Scope of the PMC Mpox Collection PMC accepts deposit of mpox and other orthopox-related peer-reviewed, biomedical and life science articles (e.g., original research articles, systematic reviews) from publishers that currently submit articles to PMC. To be in scope, articles should be published in journals that are in the NLM Collection and include a machine-readable license, preferably Creative Commons, that allows for inclusion in the PMC Open Access Subset and clearly indicates terms of reuse. Publishers are also encouraged to follow the PMC Tagging Guidelines for Data Availability Statements and Data Citations to make the underlying data for the articles as open and discoverable as possible through the literature. The content deposited by publishers is available as the PMC Mpox Collection (previously known as the Mpox Public Health Emergency Initiative). Discovering Mpox Literature in NLM Literature Databases Use the buttons below to query mpox-related literature in the NLM Literature Databases. Full-text mpox-related content in PMC View in PMC Articles referencing mpox in PubMed View in PubMed Full-text mpox documents, reports, and guidelines in Bookshelf View in Bookshelf NLM encourages customization of these suggested search queries to meet your specific research or information needs. For example, in PMC you can append 'AND "open access"[filter]' or 'AND "author manuscript"[filter]' to this query or to your own custom queries to identify articles that are currently available in PMC Article Datasets. In December 2022, PMC updated its website documentation with the term "mpox" to align with the recommendation from the World Health Organization Last modified: Tue Sept. 17 2024'''
year_published = 2025
