["https://pmc.ncbi.nlm.nih.gov/about/guidelines"]
title = "Policies  - PMC"
full_description = "Policies PMC policies and processes are guided by those of the National Library of Medicine (NLM) and National Institutes of Health (NIH), as well as current best practices for scientific publishing and scholarly communication. The NLM Board of Regents provides oversight of PMC; from 1999 through 2017, the PMC National Advisory Committee also advised on the content and operation of the repository. Though journal and publisher representatives are the primary audience for this page, anyone interested in NLM’s quality standards and expectations for PMC journals is encouraged to start here. Participation Guidelines In June 2003, the PMC National Advisory Committee affirmed the policy that journals joining PMC must make the full text of their deposited content viewable in PMC, and endorsed the following participation guidelines: Journals are encouraged to deposit the complete contents of each issue, not just research papers or other selected parts, in the PMC archive. Journals are encouraged to provide this content to PMC as close to publication as possible, regardless of when they allow it to be publicly accessible, as this makes it easier for them to correct errors detected in the journal's files during PMC's data review process. Journals are encouraged to allow their primary research articles to be viewable in PMC as early as possible but generally less than one year from publication date. Journals are encouraged to allow all other journal content (e.g. letters, reviews, etc.) to be viewable in PMC as early as possible but generally less than three years from publication date. These original guidelines are the foundation for the current PMC participation agreement, made between the journal owner (or journal owner’s legal representative) and NLM, which includes additional provisions for the timing of deposit and availability of content. Agreement Types There are three options available for participating in PMC. Each option requires the journal owner or journal owner’s legal representative to sign a PMC Participation Agreement. The eligibility requirements for each option are described below. Full Participation Agreement | NIH Portfolio Agreement | Selective Deposit Agreement Full Participation Agreement Full Participation participants commit to depositing the complete contents of each issue or volume of a journal, starting with a particular volume/issue or publication date in accordance with PMC’s Back Content policy. To be eligible for inclusion under this type of agreement a journal must satisfy NLM’s Scientific Quality and Technical Quality standards for PMC journals. NIH Portfolio Agreement NIH Portfolio participants commit to depositing the final published version of all NIH-funded articles (as defined by the NIH Public Access Policy) from a journal, starting with a particular volume/issue or publication date. The participant may choose to also deposit additional, non-NIH-funded articles under this agreement. NIH-funded authors will be blocked from depositing manuscripts themselves from the journal via the NIH Manuscript Submission System from the starting date of deposit indicated in the agreement. As of May 1, 2018, to be eligible for inclusion under this type of agreement a journal must be currently indexed in MEDLINE and regularly publish articles supported by NIH (or other PMC partner or Europe PMC funders.) Selective Deposit Agreement Selective Deposit participants deposit a more loosely defined set of content to PMC than what full participation and NIH portfolio participants agree to. Selective Deposit is intended for the deposit of a subset of articles from a collection of journals. This model is frequently used by publishers who offer a hybrid publishing model, i.e., subscription-based journals in which selected articles are published as Open Access, or publishers who wish to support the policies of a particular funder which require articles to be made available in PMC under specific license terms. To be eligible for a Selective Deposit agreement, a publisher must have an established peer review process for all of its journals. have an open access publishing program and/or a program for helping authors comply with the public or open access policies of funders that use PMC or Europe PMC as a repository (i.e., partner funders). be able to systematically identify and supply article-based content with a persistent funder identifier. publish journals that are indexed in MEDLINE and/or a high volume of articles supported by partner funders. demonstrate compliance with industry standards/best practices. As of May 1, 2018, individual articles are eligible to be deposited in PMC as part of a Selective Deposit collection if the journal of publication is currently indexed in MEDLINE or the work is funded by NIH or other funders that require deposit in compliance with their public or open access policies (see PMC and Research Funder Policies for details). Expectations for PMC Participants For a journal to participate in PMC, NLM expects that the journal and publisher will meet NLM’s standards for PMC and the NLM Collection over time. These standards include maintaining the scientific quality of the publication, supplying quality data to the archive, following industry best practices, demonstrating sustainability, and adhering to NLM Collection requirements. More details on each of these expectations is provided in the following sections. Scientific Quality | Technical Quality | Publisher Practices | Publishing Schedule | Changes to PMC Journals | Access to Electronic Resources Scientific Quality NLM considers the suitability of a journal for the NLM Collection and its scientific and editorial quality in determining if it merits inclusion or continued archiving in PMC. See Journal Selection for PMC for details. Journals that have been reviewed by the Literature Selection and Technical Review Committee (LSTRC) and are fully indexed for MEDLINE generally will not require further scientific review for PMC. See Reevaluation for information on when NLM may reevaluate a PMC journal and the reevaluation process. Technical Quality A journal must provide PMC with the full text of articles in an XML (eXtensible Markup Language) format that conforms to an acceptable journal article DTD (Document Type Definition) and meets the Minimum Data Criteria. NLM recommends that data be submitted in XML conforming to the NISO JATS Journal Publishing Tag Set, but PMC will also accept data in other full-text article DTDs that are widely used in life sciences journal publishing. PMC does not accept articles in HTML format. Files required for each deposited article: A separate XML data file for the full text of each article. The original high-resolution digital image files for all figures in each article. A PDF, if one exists, in addition to the XML version (but not as the only form). Supplementary material files (e.g., spreadsheets or video files) available with the article. (See Supplementary Material policy) PMC-participating journals must continue to meet PMC’s Production Data Requirements consistently in order to remain in PMC. If a journal does not continue to meet these standards, NLM may terminate a journal’s participation agreement. Publisher Practices NLM looks for ongoing publisher conformance with guidelines and best practices published by professional organizations, including Recommendations for the Conduct, Reporting, Editing, and Publication of Scholarly Work in Medical Journals from ICMJE and Principles of Transparency and Best Practice in Scholarly Publishing (joint statement by COPE, DOAJ, WAME, and OASPA). NLM also recommends that electronic journals follow the recommendations of PIE-J: The Presentation & Identification of E-Journals (NISO RP-16-2013), particularly in the areas of title presentation, accurate use of ISSN, access to content, and citation practices. NLM may place a temporary hold on accepting new applications or submissions from a publisher due to problems with one or more of its journals. In such cases, NLM will bring the concerns to the attention of the publisher and provide an expected timeframe for addressing the issues. At the end of that period, NLM will decide if the publisher's journals remain eligible for the NLM Collection. If a publisher is found to not be following established industry best practices it will no longer be eligible for the NLM Collection. In such cases, NLM will cease collecting the publisher's journals and will not accept applications to any of the NLM Literature databases, including MEDLINE and PubMed Central (PMC), for a minimum of three years. Publishing Schedule NLM expects a participating journal to have a posted publishing schedule, maintain its stated publishing schedule, and actively publish primary content. If a participating journal repeatedly fails to publish primary content, does not adhere to its stated publishing schedule, or does not publish any primary content over a two-year period, PMC will terminate the journal's participation agreement. The journal may reapply if/when it resumes publishing, subject to the minimum requirements for reapplications. Changes to PMC Journals To maintain the quality of NLM's literature databases, PMC requires currently participating journals to notify NLM of changes to the journal's title, ISSN, ownership, publisher, or publishing format, as well as journal mergers and significant changes in scope, editorial board, or editorial policies. NLM also monitors PMC journals for changes in publication practices, such as annual publication volume or primary article content types. NLM may ask the journal to provide additional information on the breadth and impact of the changes. If additional information is not received within 90 days of being requested by NLM, PMC may cease accepting deposits for the journal. Based on a review of the available information, NLM will determine whether the changes are considerable enough to require reevaluation. See NLM's Reevaluation policy for details. In instances where the publisher has changed, NLM may also complete a review of the current publisher's policies and practices. Access to Electronic Resources To be considered for PMC, a journal that is accessed or delivered electronically (i.e., e-journal) must provide at least one of the following means of institutional access as defined in the NLM Collection Development Guidelines (CDG): access to full text with no requirement for user registration; or licensed institutional access, including IP authentication and compliance with interlibrary loan provisions and other NLM requirements. E-journals that are selected for inclusion in PMC must remain compliant with the NLM CDG requirements. If a journal is found to no longer meet the access requirement, PMC will work with a journal or publisher to ensure a timely resolution to the problem. A temporary hold will be placed on adding new content to PMC until the situation is resolved. If the access issue is not resolved within six months, the journal’s participation agreement will be terminated. E-journals are also encouraged to follow the recommendations of PIE-J: The Presentation & Identification of E-Journals (NISO RP-16-2013), particularly in the areas of title presentation, accurate use of ISSN, and citation practices. Selection Process The application and selection processes for PMC are described in detail at How to Include a Journal in PMC and Journal Selection for PMC. If a journal is not selected, a reapplication timeframe will be provided to the applicant at the time of rejection. Applicants are expected to be responsive to NLM queries and requests throughout the entire application process. Upon selection, NLM continues to monitor journals for conformance with NLM’s Expectations for PMC Participants to maintain the quality of the archive. Appeals | First-Time Applicants & New Participants | Multiple Applications | Reapplications | Expired Applications | Reevaluation Appeals NLM selection decisions for PMC applications are generally final and not subject to appeal except in the limited circumstances described in the NLM Appeals policy for MEDLINE and PMC. First-Time Applicants & New Participants If a publisher has not previously submitted a journal application to NLM (for MEDLINE or PMC), NLM will generally complete a review of the publisher policies and practices upon receipt of an application (See Publisher Practices). This review determines whether a publisher’s journals are eligible to be considered for the NLM Collection. A publisher review is completed prior to initiating the journal application process. As such, the application period will be longer for these titles. NLM may also request additional publisher information as part of this review. New participants must complete the PMC application process (including technical evaluation) with one journal and that journal must meet PMC’s Production Data Requirements for at least six months before the publisher can submit an application for a second title. Multiple Applications A publisher may have up to two journal applications at a time in the PMC Evaluation and Setup Process if they already have at least one PMC-participating journal that meets all of the following criteria: The journal successfully passed the Scientific Quality Review; The journal successfully passed the Technical Evaluation and Pre-Production phase; The journal has been released to the live site and has continuously met the Production Data Requirements for the past six months. For publishers that have not previously applied to PMC with a journal that meets the criteria above, the publisher is eligible to have one journal at a time in the Evaluation and Setup Process. PMC may consider more than two applications at a time from publishers with ten or more PMC-participating journals that have successfully passed the Evaluation and Setup Process and met the Production Data Requirements for the past six months. Reapplications Reapplication timelines will vary based on several factors: Journals that do not pass the initial application screening or meet PMC's Scientific Quality Standard are eligible to reapply two years (24 months) after the date the review is completed. Journals that do not pass PMC's Technical Evaluation are eligible to restart the process one year (12 months) after the date the technical evaluation is completed. Journals that cease participation as a result of not meeting PMC's Publishing Schedule or Access to Electronic Resources policies are eligible to reapply when they resume publishing in line with the applicable policy and meet the pre-application requirements. Any reapplication to PMC will be processed as a new application and will be subject to initial quality screening, scientific quality review, and technical evaluation (when applicable). If a journal reapplies after previously not meeting PMC's Scientific Quality Standard, a minimum of 20 peer-reviewed articl"
