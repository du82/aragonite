full_description = "ArgsLenAtDash will return the length of c.Flags().Args at the moment when a -- was found during args parsing. CalledAs returns the command name or alias that was used to invoke this command or an empty string if the command has not been called. Context returns underlying command context. If command was executed with ExecuteContext or the context was set with SetContext, the previously set context will be returned. Otherwise, nil is returned. Notice that a call to Execute and ExecuteC will replace a nil context of a command with a context.Background, so a background context will be returned by Context after one of these functions has been called. Execute uses the args (os.Args[1:] by default) and run through the command tree finding appropriate matches for commands and then corresponding flags. ExecuteContext is the same as Execute(), but sets the ctx on the command. Retrieve ctx by calling cmd.Context() inside your *Run lifecycle or ValidArgs functions. ExecuteContextC is the same as ExecuteC(), but sets the ctx on the command. Retrieve ctx by calling cmd.Context() inside your *Run lifecycle or ValidArgs functions. Find the target command given the args and command tree Meant to be run on the highest node. Only searches down. FlagErrorFunc returns either the function set by SetFlagErrorFunc for this command or a parent, or it returns a function which returns the original error. FlagErrorFunc returns either the function set by SetFlagErrorFunc for this command or a parent, or it returns a function which returns the original error. Flags returns the complete FlagSet that applies to this command (local and persistent declared here and by all parents). GenPowerShellCompletion generates powershell completion file without descriptions and writes it to the passed writer. GenPowerShellCompletionWithDesc generates powershell completion file with descriptions and writes it to the passed writer. GenZshCompletion generates zsh completion file including descriptions and writes it to the passed writer."
