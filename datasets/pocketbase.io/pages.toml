title = "Web APIs reference - API Records - Docs - PocketBase"
description = "Open Source backend in 1 file with realtime database, authentication, file storage and admin dashboard"
full_description = '''Introduction Going to production Web APIs reference ├ API Records ├ API Realtime ├ API Files ├ API Collections ├ API Settings ├ API Logs ├ API Crons ├ API Backups └ API Health Extend with Go Extend with JavaScript Go Overview Go Event hooks Go Routing Go Database Go Record operations Go Collection operations Go Migrations Go Jobs scheduling Go Sending emails Go Rendering templates Go Console commands Go Realtime messaging Go Filesystem Go Logging Go Testing Go Miscellaneous Go Record proxy JS Overview JS Event hooks JS Routing JS Database JS Record operations JS Collection operations JS Migrations JS Jobs scheduling JS Sending emails JS Rendering templates JS Console commands JS Sending HTTP requests JS Realtime messaging JS Filesystem JS Logging JS Types reference Web APIs reference - API Records API Records CRUD actions List/Search records Returns a paginated records list, supporting sorting and filtering. Depending on the collection's listRule value, the access to this action may or may not have been restricted. You could find individual generated records API documentation in the "Dashboard > Collections > API Preview". JavaScript Dart import PocketBase from 'pocketbase'; const pb = new PocketBase('http://127.0.0.1:8090'); ... // fetch a paginated records list const resultList = await pb.collection('posts').getList(1, 50, { filter: 'created >= "2022-01-01 00:00:00" && someField1 != someField2', }); // you can also fetch all records at once via getFullList const records = await pb.collection('posts').getFullList({ sort: '-created', }); // or fetch only the first record that matches the specified filter const record = await pb.collection('posts').getFirstListItem('someField="test"', { expand: 'relField1,relField2.subRelField', }); import 'package:pocketbase/pocketbase.dart'; final pb = PocketBase('http://127.0.0.1:8090'); ... // fetch a paginated records list final resultList = await pb.collection('posts').getList( page: 1, perPage: 50, filter: 'created >= "2022-01-01 00:00:00" && someField1 != someField2', ); // you can also fetch all records at once via getFullList final records = await pb.collection('posts').getFullList(sort: '-created'); // or fetch only the first record that matches the specified filter final record = await pb.collection('posts').getFirstListItem( 'someField="test"', expand: 'relField1,relField2.subRelField', ); API details GET /api/collections/collectionIdOrName/records Path parameters Param Type Description collectionIdOrName String ID or name of the records' collection. Query parameters Param Type Description page Number The page (aka. offset) of the paginated list (default to 1). perPage Number The max returned records per page (default to 30). sort String Specify the ORDER BY fields. Add - / + (default) in front of the attribute for DESC / ASC order, eg.: // DESC by created and ASC by id ?sort=-created,id Supported record sort fields: @random, @rowid, id, and any other collection field. filter String Filter expression to filter/search the returned records list (in addition to the collection's listRule), e.g.: ?filter=(title~'abc' && created>'2022-01-01') Supported record filter fields: id, + any field from the collection schema. The syntax basically follows the format OPERAND OPERATOR OPERAND, where: OPERAND - could be any field literal, string (single or double quoted), number, null, true, false OPERATOR - is one of: = Equal != NOT equal > Greater than >= Greater than or equal < Less than <= Less than or equal ~ Like/Contains (if not specified auto wraps the right string OPERAND in a "%" for wildcard match) !~ NOT Like/Contains (if not specified auto wraps the right string OPERAND in a "%" for wildcard match) ?= Any/At least one of Equal ?!= Any/At least one of NOT equal ?> Any/At least one of Greater than ?>= Any/At least one of Greater than or equal ?< Any/At least one of Less than ?<= Any/At least one of Less than or equal ?~ Any/At least one of Like/Contains (if not specified auto wraps the right string OPERAND in a "%" for wildcard match) ?!~ Any/At least one of NOT Like/Contains (if not specified auto wraps the right string OPERAND in a "%" for wildcard match) To group and combine several expressions you can use parenthesis (...), && (AND) and || (OR) tokens. Single line comments are also supported: // Example comment. expand String Auto expand record relations. Ex.: ?expand=relField1,relField2.subRelField Supports up to 6-levels depth nested relations expansion. The expanded relations will be appended to the record under the expand property (e.g. "expand": {"relField1": {...}, ...}). Only the relations to which the request user has permissions to view will be expanded. fields String Comma separated string of the fields to return in the JSON response (by default returns all fields). Ex.: ?fields=*,expand.relField.name * targets all keys from the specific depth level. In addition, the following field modifiers are also supported: :excerpt(maxLength, withEllipsis?) Returns a short plain text version of the field string value. Ex.: ?fields=*,description:excerpt(200,true) skipTotal Boolean If it is set the total counts query will be skipped and the response fields totalItems and totalPages will have -1 value. This could drastically speed up the search queries when the total counters are not needed or cursor based pagination is used. For optimization purposes, it is set by default for the getFirstListItem() and getFullList() SDKs methods. Responses 200 400 403 { "page": 1, "perPage": 100, "totalItems": 2, "totalPages": 1, "items": [ { "id": "ae40239d2bc4477", "collectionId": "a98f514eb05f454", "collectionName": "posts", "updated": "2022-06-25 11:03:50.052", "created": "2022-06-25 11:03:35.163", "title": "test1" }, { "id": "d08dfc4f4d84419", "collectionId": "a98f514eb05f454", "collectionName": "posts", "updated": "2022-06-25 11:03:45.876", "created": "2022-06-25 11:03:45.876", "title": "test2" } ] } { "status": 400, "message": "Something went wrong while processing your request. Invalid filter.", "data": {} } { "status": 403, "message": "Only superusers can filter by '@collection.*'", "data": {} } View record Returns a single collection record by its ID. Depending on the collection's viewRule value, the access to this action may or may not have been restricted. You could find individual generated records API documentation in the "Dashboard > Collections > API Preview". JavaScript Dart import PocketBase from 'pocketbase'; const pb = new PocketBase('http://127.0.0.1:8090'); ... const record1 = await pb.collection('posts').getOne('RECORD_ID', { expand: 'relField1,relField2.subRelField', }); import 'package:pocketbase/pocketbase.dart'; final pb = PocketBase('http://127.0.0.1:8090'); ... final record1 = await pb.collection('posts').getOne('RECORD_ID', expand: 'relField1,relField2.subRelField', ); API details GET /api/collections/collectionIdOrName/records/recordId Path parameters Param Type Description collectionIdOrName String ID or name of the record's collection. recordId String ID of the record to view. Query parameters Param Type Description expand String Auto expand record relations. Ex.: ?expand=relField1,relField2.subRelField Supports up to 6-levels depth nested relations expansion. The expanded relations will be appended to the record under the expand property (e.g. "expand": {"relField1": {...}, ...}). Only the relations to which the request user has permissions to view will be expanded. fields String Comma separated string of the fields to return in the JSON response (by default returns all fields). Ex.: ?fields=*,expand.relField.name * targets all keys from the specific depth level. In addition, the following field modifiers are also supported: :excerpt(maxLength, withEllipsis?) Returns a short plain text version of the field string value. Ex.: ?fields=*,description:excerpt(200,true) Responses 200 403 404 { "id": "ae40239d2bc4477", "collectionId": "a98f514eb05f454", "collectionName": "posts", "updated": "2022-06-25 11:03:50.052", "created": "2022-06-25 11:03:35.163", "title": "test1" } { "status": 403, "message": "Only superusers can perform this action.", "data": {} } { "status": 404, "message": "The requested resource wasn't found.", "data": {} } Create record Creates a new collection Record. Depending on the collection's createRule value, the access to this action may or may not have been restricted. You could find individual generated records API documentation from the Dashboard. JavaScript Dart import PocketBase from 'pocketbase'; const pb = new PocketBase('http://127.0.0.1:8090'); ... const record = await pb.collection('demo').create({ title: 'Lorem ipsum', }); import 'package:pocketbase/pocketbase.dart'; final pb = PocketBase('http://127.0.0.1:8090'); ... final record = await pb.collection('demo').create(body: { 'title': 'Lorem ipsum', }); API details POST /api/collections/collectionIdOrName/records Path parameters Param Type Description collectionIdOrName String ID or name of the record's collection. Body Parameters Param Type Description Optional id String 15 characters string to store as record ID. If not set, it will be auto generated. Schema fields Any field from the collection's schema. Additional auth record fields Required password String Auth record password. Required passwordConfirm String Auth record password confirmation. Body parameters could be sent as JSON or multipart/form-data. File upload is supported only through multipart/form-data. Query parameters Param Type Description expand String Auto expand record relations. Ex.: ?expand=relField1,relField2.subRelField Supports up to 6-levels depth nested relations expansion. The expanded relations will be appended to the record under the expand property (e.g. "expand": {"relField1": {...}, ...}). Only the relations to which the request user has permissions to view will be expanded. fields String Comma separated string of the fields to return in the JSON response (by default returns all fields). Ex.: ?fields=*,expand.relField.name * targets all keys from the specific depth level. In addition, the following field modifiers are also supported: :excerpt(maxLength, withEllipsis?) Returns a short plain text version of the field string value. Ex.: ?fields=*,description:excerpt(200,true) Responses 200 400 403 404 { "collectionId": "a98f514eb05f454", "collectionName": "demo", "id": "ae40239d2bc4477", "updated": "2022-06-25 11:03:50.052", "created": "2022-06-25 11:03:35.163", "title": "Lorem ipsum" } { "status": 400, "message": "Failed to create record.", "data": { "title": { "code": "validation_required", "message": "Missing required value." } } } { "status": 403, "message": "Only superusers can perform this action.", "data": {} } { "status": 404, "message": "The requested resource wasn't found. Missing collection context.", "data": {} } Update record Updates an existing collection Record. Depending on the collection's updateRule value, the access to this action may or may not have been restricted. You could find individual generated records API documentation from the Dashboard. JavaScript Dart import PocketBase from 'pocketbase'; const pb = new PocketBase('http://127.0.0.1:8090'); ... const record = await pb.collection('demo').update('YOUR_RECORD_ID', { title: 'Lorem ipsum', }); import 'package:pocketbase/pocketbase.dart'; final pb = PocketBase('http://127.0.0.1:8090'); ... final record = await pb.collection('demo').update('YOUR_RECORD_ID', body: { 'title': 'Lorem ipsum', }); API details PATCH /api/collections/collectionIdOrName/records/recordId Path parameters Param Type Description collectionIdOrName String ID or name of the record's collection. recordId String ID of the record to update. Body Parameters Param Type Description Schema fields Any field from the collection's schema. Additional auth record fields Optional oldPassword String Old auth record password. This field is required only when changing the record password. Superusers and auth records with "Manage" access can skip this field. Optional password String New auth record password. Optional passwordConfirm String New auth record password confirmation. Body parameters could be sent as JSON or multipart/form-data. File upload is supported only through multipart/form-data. Query parameters Param Type Description expand String Auto expand record relations. Ex.: ?expand=relField1,relField2.subRelField Supports up to 6-levels depth nested relations expansion. The expanded relations will be appended to the record under the expand property (e.g. "expand": {"relField1": {...}, ...}). Only the relations to which the request user has permissions to view will be expanded. fields String Comma separated string of the fields to return in the JSON response (by default returns all fields). Ex.: ?fields=*,expand.relField.name * targets all keys from the specific depth level. In addition, the following field modifiers are also supported: :excerpt(maxLength, withEllipsis?) Returns a short plain text version of the field string value. Ex.: ?fields=*,description:excerpt(200,true) Responses 200 400 403 404 { "collectionId": "a98f514eb05f454", "collectionName": "demo", "id": "ae40239d2bc4477", "updated": "2022-06-25 11:03:50.052", "created": "2022-06-25 11:03:35.163", "title": "Lorem ipsum" } { "status": 400, "message": "Failed to create record.", "data": { "title": { "code": "validation_required", "message": "Missing required value." } } } { "status": 403, "message": "Only superusers can perform this action.", "data": {} } { "status": 404, "message": "The requested resource wasn't found. Missing collection context.", "data": {} } Delete record Deletes a single collection Record by its ID. Depending on the collection's deleteRule value, the access to this action may or may not have been restricted. You could find individual generated records API documentation from the Dashboard. JavaScript Dart import PocketBase from 'pocketbase'; const pb = new PocketBase('http://127.0.0.1:8090'); ... await pb.collection('demo').delete('YOUR_RECORD_ID'); import 'package:pocketbase/pocketbase.dart'; final pb = PocketBase('http://127.0.0.1:8090'); ... await pb.collection('demo').delete('YOUR_RECORD_ID'); API details DELETE /api/collections/collectionIdOrName/records/recordId Path parameters Param Type Description collectionIdOrName String ID or name of the record's collection. recordId String ID of the record to delete. Responses 204 400 403 404 null { "status": 400, "message": "Failed to delete record. Make sure that the record is not part of a required relation reference.", "data": {} } { "status": 403, "message": "Only superusers can perform this action.", "data": {} } { "status": 404, "message": "The requested resource wasn't found.", "data": {} } Batch create/update/upsert/delete records Batch and transactional create/update/upsert/delete of multiple records in a single request. The batch Web API need to be explicitly enabled and configured from the Dashboard > Settings > Application. Beca'''
