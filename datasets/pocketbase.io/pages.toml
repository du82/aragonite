full_description = "By default this method will try to REPLACE existing fields with the new ones by their id or by their name if the new field doesn't have an explicit id. In all cases, if any of the new fields don't have an explicit id it will auto generate a default one for them (the id value doesn't really matter and it is mostly used as a stable identifier in case of a field rename). If pos > FieldsList total items, then the specified fields are inserted/moved at the end of the list. AddMarshaledJSON parses the provided raw json data and adds the found fields into the current list (following the same rule as the Add method). AddMarshaledJSONAt is the same as AddMarshaledJSON but insert/move the fields at the specific position. If pos > FieldsList total items, then the specified fields are inserted/moved at the end of the list. AsMap returns a map with all registered list field. The returned map is indexed with each field name. Scan implements [sql.Scanner] interface to scan the provided value into the current FieldsList instance. UnmarshalJSON implements [json.Unmarshaler] and loads the provided json data into the current FieldsList."
