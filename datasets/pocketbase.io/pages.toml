["https://pocketbase.io/docs"]
title = "Introduction - Docs - PocketBase"
description = "Open Source backend in 1 file with realtime database, authentication, file storage and admin dashboard"
full_description = "Introduction ├ How to use PocketBase ├ Collections ├ API rules and filters ├ Authentication ├ Files upload and handling ├ Working with relations └ Extending PocketBase Going to production Web APIs reference Extend with Go Extend with JavaScript Go Overview Go Event hooks Go Routing Go Database Go Record operations Go Collection operations Go Migrations Go Jobs scheduling Go Sending emails Go Rendering templates Go Console commands Go Realtime messaging Go Filesystem Go Logging Go Testing Go Miscellaneous Go Record proxy JS Overview JS Event hooks JS Routing JS Database JS Record operations JS Collection operations JS Migrations JS Jobs scheduling JS Sending emails JS Rendering templates JS Console commands JS Sending HTTP requests JS Realtime messaging JS Filesystem JS Logging JS Types reference Introduction Introduction Please keep in mind that PocketBase is still under active development and full backward compatibility is not guaranteed before reaching v1.0.0. PocketBase is NOT recommended for production critical applications yet, unless you are fine with reading the changelog and applying some manual migration steps from time to time. PocketBase is an open source backend consisting of embedded database (SQLite) with realtime subscriptions, built-in auth management, convenient dashboard UI and simple REST-ish API. It can be used both as Go framework and as standalone application. The easiest way to get started is to download the prebuilt minimal PocketBase executable: x64 ARM64 Download v0.25.8 for Linux x64 (~14MB zip) Download v0.25.8 for Windows x64 (~14MB zip) Download v0.25.8 for macOS x64 (~14MB zip) Download v0.25.8 for Linux ARM64 (~13MB zip) Download v0.25.8 for Windows ARM64 (~13MB zip) Download v0.25.8 for macOS ARM64 (~13MB zip) See the GitHub Releases page for other platforms and more details. Once you've extracted the archive, you could start the application by running ./pocketbase serve in the extracted directory. And that's it! The first time it will generate an installer link that should be automatically opened in the browser to setup your first superuser account (you can also create the first superuser manually via ./pocketbase superuser create EMAIL PASS) . The started web server has the following default routes: http://127.0.0.1:8090 - if pb_public directory exists, serves the static content from it (html, css, images, etc.) http://127.0.0.1:8090/_/ - superusers dashboard http://127.0.0.1:8090/api/ - REST-ish API The prebuilt PocketBase executable will create and manage 2 new directories alongside the executable: pb_data - stores your application data, uploaded files, etc. (usually should be added in .gitignore). pb_migrations - contains JS migration files with your collection changes (can be safely committed in your repository). You can even write custom migration scripts. For more info check the JS migrations docs. You could find all available commands and their options by running ./pocketbase --help or ./pocketbase [command] --help Next: How to use PocketBase"
