title = "Introduction - Extending PocketBase - Docs - PocketBase"
description = "Open Source backend in 1 file with realtime database, authentication, file storage and admin dashboard"
full_description = '''Introduction ├ How to use PocketBase ├ Collections ├ API rules and filters ├ Authentication ├ Files upload and handling ├ Working with relations └ Extending PocketBase Going to production Web APIs reference Extend with Go Extend with JavaScript Go Overview Go Event hooks Go Routing Go Database Go Record operations Go Collection operations Go Migrations Go Jobs scheduling Go Sending emails Go Rendering templates Go Console commands Go Realtime messaging Go Filesystem Go Logging Go Testing Go Miscellaneous Go Record proxy JS Overview JS Event hooks JS Routing JS Database JS Record operations JS Collection operations JS Migrations JS Jobs scheduling JS Sending emails JS Rendering templates JS Console commands JS Sending HTTP requests JS Realtime messaging JS Filesystem JS Logging JS Types reference Introduction - Extending PocketBase Extending PocketBase One of the main feature of PocketBase is that it can be used as a framework which enables you to write your own custom app business logic in Go or JavaScript and still have a portable backend at the end. Choose Extend with Go if you are already familiar with the language or have the time to learn it. As the primary PocketBase language, the Go APIs are better documented and you'll be able to integrate with any 3rd party Go library since you'll have more control over the application flow. The only drawback is that the Go APIs are slightly more verbose and it may require some time to get used to, especially if this is your first time working with Go. Choose Extend with JavaScript if you don't intend to write too much custom code and want a quick way to explore the PocketBase capabilities. The embedded JavaScript engine is a pluggable wrapper around the existing Go APIs, so most of the time the slight performance penalty will be negligible because it'll invoke the Go functions under the hood. As a bonus, because the JS VM mirrors the Go APIs, you would be able migrate gradually without much code changes from JS -> Go at later stage in case you hit a bottleneck or want more control over the execution flow. With both Go and JavaScript, you can: Register custom routes: Go JavaScript app.OnServe().BindFunc(func(se *core.ServeEvent) error { se.Router.GET("/hello", func(e *core.RequestEvent) error { return e.String(http.StatusOK, "Hello world!") }) return se.Next() }) routerAdd("GET", "/hello", (e) => { return e.string(200, "Hello world!") }) Bind to event hooks and intercept responses: Go JavaScript app.OnRecordCreateRequest("posts").BindFunc(func(e *core.RecordRequestEvent) error { // if not superuser, overwrite the newly submitted "posts" record status to pending if !e.HasSuperuserAuth() { e.Record.Set("status", "pending") } return e.Next() }) onRecordCreateRequest((e) => { // if not superuser, overwrite the newly submitted "posts" record status to pending if (!e.hasSuperuserAuth()) { e.record.set("status", "pending") } e.next() }, "posts") Register custom console commands: Go JavaScript app.RootCmd.AddCommand(&cobra.Command{ Use: "hello", Run: func(cmd *cobra.Command, args []string) { print("Hello world!") }, }) $app.rootCmd.addCommand(new Command({ use: "hello", run: (cmd, args) => { console.log("Hello world!") }, })) and many more... For further info, please check the related Extend with Go or Extend with JavaScript guides. Prev: Working with relations'''
