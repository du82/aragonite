full_description = 'Introduction Going to production Web APIs reference Extend with Go Extend with JavaScript Go Overview Go Event hooks Go Routing Go Database Go Record operations Go Collection operations Go Migrations Go Jobs scheduling Go Sending emails Go Rendering templates Go Console commands Go Realtime messaging Go Filesystem Go Logging Go Testing Go Miscellaneous Go Record proxy JS Overview JS Event hooks JS Routing JS Database JS Record operations JS Collection operations JS Migrations JS Jobs scheduling JS Sending emails JS Rendering templates JS Console commands JS Sending HTTP requests JS Realtime messaging JS Filesystem JS Logging JS Types reference Extend with Go - Console commands Console commands You can register custom console commands using app.RootCmd.AddCommand(cmd), where cmd is a cobra command. Here is an example: package main import ( "log" "github.com/pocketbase/pocketbase" "github.com/spf13/cobra" ) func main() { app := pocketbase.New() app.RootCmd.AddCommand(&cobra.Command{ Use: "hello", Run: func(cmd *cobra.Command, args []string) { log.Println("Hello world!") }, }) if err := app.Start(); err != nil { log.Fatal(err) } } To run the command you can build your Go application and execute: # or "go run main.go hello" ./myapp hello Keep in mind that the console commands execute in their own separate app process and run independently from the main serve command (aka. hook events between different processes are not shared with one another). Prev: Rendering templates Next: Realtime messaging'
