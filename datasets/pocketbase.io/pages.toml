full_description = "Compare compares the current DateTime instance with u. If the current instance is before u, it returns -1. If the current instance is after u, it returns +1. If they're the same, it returns 0. Equal reports whether the current DateTime and u represent the same time instant. Two DateTime can be equal even if they are in different locations. For example, 6:00 +0200 and 4:00 UTC are Equal. Scan implements [sql.Scanner] interface to scan the provided value into the current DateTime instance. If the result exceeds the maximum (or minimum) value that can be stored in a [time.Duration], the maximum (or minimum) duration will be returned. Unix returns the current DateTime as a Unix time, aka. the number of seconds elapsed since January 1, 1970 UTC."
