title = "Extend with JavaScript - Event hooks - Docs - PocketBase"
description = "Open Source backend in 1 file with realtime database, authentication, file storage and admin dashboard"
full_description = '''Introduction Going to production Web APIs reference Extend with Go Extend with JavaScript Go Overview Go Event hooks Go Routing Go Database Go Record operations Go Collection operations Go Migrations Go Jobs scheduling Go Sending emails Go Rendering templates Go Console commands Go Realtime messaging Go Filesystem Go Logging Go Testing Go Miscellaneous Go Record proxy JS Overview JS Event hooks JS Routing JS Database JS Record operations JS Collection operations JS Migrations JS Jobs scheduling JS Sending emails JS Rendering templates JS Console commands JS Sending HTTP requests JS Realtime messaging JS Filesystem JS Logging JS Types reference Extend with JavaScript - Event hooks Event hooks You can extend the default PocketBase behavior with custom server-side code using the exposed JavaScript app event hooks. Throwing an error or not calling e.next() inside a handler function stops the hook execution chain. All hook handler functions share the same function(e){} signature and expect the user to call e.next() if they want to proceed with the execution chain. App hooks onBootstrap onBootstrap hook is triggered when initializing the main application resources (db, app settings, etc). Note that attempting to access the database before the e.next() call will result in an error. onBootstrap((e) => { e.next() // e.app }) onSettingsReload onSettingsReload hook is triggered every time when the $app.settings() is being replaced with a new state. Calling e.app.settings() after e.next() returns the new state. onSettingsReload((e) => { e.next() // e.app.settings() }) onBackupCreate onBackupCreate is triggered on each $app.createBackup call. onBackupCreate((e) => { // e.app // e.name - the name of the backup to create // e.exclude - list of pb_data dir entries to exclude from the backup }) onBackupRestore onBackupRestore is triggered before app backup restore (aka. on $app.restoreBackup call). onBackupRestore((e) => { // e.app // e.name - the name of the backup to restore // e.exclude - list of dir entries to exclude from the backup }) onTerminate onTerminate hook is triggered when the app is in the process of being terminated (ex. on SIGTERM signal). Note that the app could be terminated abruptly without awaiting the hook completion. onTerminate((e) => { // e.app // e.isRestart }) Mailer hooks onMailerSend onMailerSend hook is triggered every time when a new email is being send using the $app.newMailClient() instance. It allows intercepting the email message or to use a custom mailer client. onMailerSend((e) => { // e.app // e.mailer // e.message // ex. change the mail subject e.message.subject = "new subject" e.next() }) onMailerRecordAuthAlertSend onMailerRecordAuthAlertSend hook is triggered when sending a new device login auth alert email, allowing you to intercept and customize the email message that is being sent. onMailerRecordAuthAlertSend((e) => { // e.app // e.mailer // e.message // e.record // e.meta // ex. change the mail subject e.message.subject = "new subject" e.next() }) onMailerRecordPasswordResetSend onMailerRecordPasswordResetSend hook is triggered when sending a password reset email to an auth record, allowing you to intercept and customize the email message that is being sent. onMailerRecordPasswordResetSend((e) => { // e.app // e.mailer // e.message // e.record // e.meta // ex. change the mail subject e.message.subject = "new subject" e.next() }) onMailerRecordVerificationSend onMailerRecordVerificationSend hook is triggered when sending a verification email to an auth record, allowing you to intercept and customize the email message that is being sent. onMailerRecordVerificationSend((e) => { // e.app // e.mailer // e.message // e.record // e.meta // ex. change the mail subject e.message.subject = "new subject" e.next() }) onMailerRecordEmailChangeSend onMailerRecordEmailChangeSend hook is triggered when sending a confirmation new address email to an auth record, allowing you to intercept and customize the email message that is being sent. onMailerRecordEmailChangeSend((e) => { // e.app // e.mailer // e.message // e.record // e.meta // ex. change the mail subject e.message.subject = "new subject" e.next() }) onMailerRecordOTPSend onMailerRecordOTPSend hook is triggered when sending an OTP email to an auth record, allowing you to intercept and customize the email message that is being sent. onMailerRecordOTPSend((e) => { // e.app // e.mailer // e.message // e.record // e.meta // ex. change the mail subject e.message.subject = "new subject" e.next() }) Realtime hooks onRealtimeConnectRequest onRealtimeConnectRequest hook is triggered when establishing the SSE client connection. Any execution after e.next() of a hook handler happens after the client disconnects. onRealtimeConnectRequest((e) => { // e.app // e.client // e.idleTimeout // and all RequestEvent fields... e.next() }) onRealtimeSubscribeRequest onRealtimeSubscribeRequest hook is triggered when updating the client subscriptions, allowing you to further validate and modify the submitted change. OnRealtimeSubscribeRequest((e) => { // e.app // e.client // e.subscriptions // and all RequestEvent fields... e.next() }) onRealtimeMessageSend onRealtimeMessageSend hook is triggered when sending an SSE message to a client. onRealtimeMessageSend((e) => { // e.app // e.client // e.message // and all original connect RequestEvent fields... e.next() }) Record model hooks These are lower level Record model hooks and could be triggered from anywhere (custom console command, scheduled cron job, when calling e.save(record), etc.) and therefore they have no access to the request context! If you want to intercept the builtin Web APIs and to access their request body, query parameters, headers or the request auth state, then please use the designated Record *Request hooks . onRecordEnrich onRecordEnrich is triggered every time when a record is enriched - as part of the builtin Record responses, during realtime message serialization, or when apis.enrichRecord is invoked. It could be used for example to redact/hide or add computed temporary Record model props only for the specific request info. onRecordEnrich((e) => { // hide one or more fields e.record.hide("role") // add new custom field for registered users if (e.requestInfo.auth?.collection()?.name == "users") { e.record.withCustomData(true) // for security custom props require to be enabled explicitly e.record.set("computedScore", e.record.get("score") * e.requestInfo.auth.get("base")) } e.next() }, "posts") onRecordValidate onRecordValidate is a Record proxy model hook of onModelValidate. onRecordValidate is called every time when a Record is being validated, e.g. triggered by $app.validate() or $app.save(). // fires for every record onRecordValidate((e) => { // e.app // e.record e.next() }) // fires only for "users" and "articles" records onRecordValidate((e) => { // e.app // e.record e.next() }, "users", "articles") Record model create hooks onRecordCreate onRecordCreate is a Record proxy model hook of onModelCreate. onRecordCreate is triggered every time when a new Record is being created, e.g. triggered by $app.save(). Operations BEFORE the e.next() execute before the Record validation and the INSERT DB statement. Operations AFTER the e.next() execute after the Record validation and the INSERT DB statement. Note that successful execution doesn't guarantee that the Record is persisted in the database since its wrapping transaction may not have been committed yet. If you want to listen to only the actual persisted events, you can bind to onRecordAfterCreateSuccess or onRecordAfterCreateError hooks. // fires for every record onRecordCreate((e) => { // e.app // e.record e.next() }) // fires only for "users" and "articles" records onRecordCreate((e) => { // e.app // e.record e.next() }, "users", "articles") onRecordCreateExecute onRecordCreateExecute is a Record proxy model hook of onModelCreateExecute. onRecordCreateExecute is triggered after successful Record validation and right before the model INSERT DB statement execution. Usually it is triggered as part of the $app.save() in the following firing order: onRecordCreate -> onRecordValidate (skipped with $app.saveNoValidate()) -> onRecordCreateExecute Note that successful execution doesn't guarantee that the Record is persisted in the database since its wrapping transaction may not have been committed yet. If you want to listen to only the actual persisted events, you can bind to onRecordAfterCreateSuccess or onRecordAfterCreateError hooks. // fires for every record onRecordCreateExecute((e) => { // e.app // e.record e.next() }) // fires only for "users" and "articles" records onRecordCreateExecute((e) => { // e.app // e.record e.next() }, "users", "articles") onRecordAfterCreateSuccess onRecordAfterCreateSuccess is a Record proxy model hook of onModelAfterCreateSuccess. onRecordAfterCreateSuccess is triggered after each successful Record DB create persistence. Note that when a Record is persisted as part of a transaction, this hook is delayed and executed only AFTER the transaction has been committed. This hook is NOT triggered in case the transaction fails/rollbacks. // fires for every record onRecordAfterCreateSuccess((e) => { // e.app // e.record e.next() }) // fires only for "users" and "articles" records onRecordAfterCreateSuccess((e) => { // e.app // e.record e.next() }, "users", "articles") onRecordAfterCreateError onRecordAfterCreateError is a Record proxy model hook of onModelAfterCreateError. onRecordAfterCreateError is triggered after each failed Record DB create persistence. Note that the execution of this hook is either immediate or delayed depending on the error: immediate on $app.save() failure delayed on transaction rollback // fires for every record onRecordAfterCreateError((e) => { // e.app // e.record // e.error e.next() }) // fires only for "users" and "articles" records onRecordAfterCreateError((e) => { // e.app // e.record // e.error e.next() }, "users", "articles") Record model update hooks onRecordUpdate onRecordUpdate is a Record proxy model hook of onModelUpdate. onRecordUpdate is triggered every time when a new Record is being updated, e.g. triggered by $app.save(). Operations BEFORE the e.next() execute before the Record validation and the UPDATE DB statement. Operations AFTER the e.next() execute after the Record validation and the UPDATE DB statement. Note that successful execution doesn't guarantee that the Record is persisted in the database since its wrapping transaction may not have been committed yet. If you want to listen to only the actual persisted events, you can bind to onRecordAfterUpdateSuccess or onRecordAfterUpdateError hooks. // fires for every record onRecordUpdate((e) => { // e.app // e.record e.next() }) // fires only for "users" and "articles" records onRecordUpdate((e) => { // e.app // e.record e.next() }, "users", "articles") onRecordUpdateExecute onRecordUpdateExecute is a Record proxy model hook of onModelUpdateExecute. onRecordUpdateExecute is triggered after successful Record validation and right before the model UPDATE DB statement execution. Usually it is triggered as part of the $app.save() in the following firing order: onRecordUpdate -> onRecordValidate (skipped with $app.saveNoValidate()) -> onRecordUpdateExecute Note that successful execution doesn't guarantee that the Record is persisted in the database since its wrapping transaction may not have been committed yet. If you want to listen to only the actual persisted events, you can bind to onRecordAfterUpdateSuccess or onRecordAfterUpdateError hooks. // fires for every record onRecordUpdateExecute((e) => { // e.app // e.record e.next() }) // fires only for "users" and "articles" records onRecordUpdateExecute((e) => { // e.app // e.record e.next() }, "users", "articles") onRecordAfterUpdateSuccess onRecordAfterUpdateSuccess is a Record proxy model hook of onModelAfterUpdateSuccess. onRecordAfterUpdateSuccess is triggered after each successful Record DB update persistence. Note that when a Record is persisted as part of a transaction, this hook is delayed and executed only AFTER the transaction has been committed. This hook is NOT triggered in case the transaction fails/rollbacks. // fires for every record onRecordAfterUpdateSuccess((e) => { // e.app // e.record e.next() }) // fires only for "users" and "articles" records onRecordAfterUpdateSuccess((e) => { // e.app // e.record e.next() }, "users", "articles") onRecordAfterUpdateError onRecordAfterUpdateError is a Record proxy model hook of onModelAfterUpdateError. onRecordAfterUpdateError is triggered after each failed Record DB update persistence. Note that the execution of this hook is either immediate or delayed depending on the error: immediate on $app.save() failure delayed on transaction rollback // fires for every record onRecordAfterUpdateError((e) => { // e.app // e.record // e.error e.next() }) // fires only for "users" and "articles" records onRecordAfterUpdateError((e) => { // e.app // e.record // e.error e.next() }, "users", "articles") Record model delete hooks onRecordDelete onRecordDelete is a Record proxy model hook of onModelDelete. onRecordDelete is triggered every time when a new Record is being deleted, e.g. triggered by $app.delete(). Operations BEFORE the e.next() execute before the Record validation and the UPDATE DB statement. Operations AFTER the e.next() execute after the Record validation and the UPDATE DB statement. Note that successful execution doesn't guarantee that the Record is deleted from the database since its wrapping transaction may not have been committed yet. If you want to listen to only the actual persisted deleted events, you can bind to onRecordAfterDeleteSuccess or onRecordAfterDeleteError hooks. // fires for every record onRecordDelete((e) => { // e.app // e.record e.next() }) // fires only for "users" and "articles" records onRecordDelete((e) => { // e.app // e.record e.next() }, "users", "articles") onRecordDeleteExecute onRecordDeleteExecute is a Record proxy model hook of onModelDeleteExecute. onRecordDeleteExecute is triggered after the internal delete checks and right before the Record the model DELETE DB statement execution. Usually it is triggered as part of the $app.delete() in the following firing order: onRecordDelete -> internal delete checks -> onRecordDeleteExecute Note that successful execution doesn't guarantee that the Record is deleted from the database since its wrapping transaction may not have been committed yet. If you want to listen to only the actual persisted events, you can bind to onRecordAfterDeleteSuccess or onRecordAfterDeleteError hooks. // fires for every record onRecordDeleteExecute((e) => { // e.app // e.record e.next() }) // fires only for "users" and "articles" records onRecordDeleteExecute((e) => { // e.app // e.record e.next() }, "users", "articles") onRecordAfterDeleteSuccess onRecordAfterDeleteSuccess is a Reco'''
