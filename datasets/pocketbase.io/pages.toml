full_description = '''MarkAsNew clears the pk field and marks the current model as "new" (aka. forces m.IsNew() to be true). MarkAsNew set the pk field to the Id value and marks the current model as NOT "new" (aka. forces m.IsNew() to be false). Note that non-type related fields are ignored from the serialization (ex. for "view" colections the "auth" fields are skipped). PostScan implements the [dbx.PostScanner] interface to auto unmarshal the raw serialized options into the concrete type specific fields. For new/"blank" Collection models it replaces the model with a factory instance and then unmarshal the provided data one on top of it. AuthRule could be used to specify additional record constraints applied after record authentication and right before returning the auth token response to the client. Set it to nil to disallow authentication altogether for the collection (that includes password, OAuth2, etc.). ManageRule gives admin-like permissions to allow fully managing the auth record(s), eg. changing the password without requiring to enter the old one, directly updating the verified state and email, etc. OAuth2 specifies whether OAuth2 auth is enabled for the collection and which OAuth2 providers are allowed. RawOptions represents the raw serialized collection option loaded from the DB. NB! This field shouldn't be modified manually. It is automatically updated with the collection type specific option before save. System prevents the collection rename, deletion and rules change. It is used primarily for internal purposes for collections like "_superusers", "_externalAuths", etc.'''
