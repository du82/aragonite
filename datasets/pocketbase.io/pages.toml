["https://pocketbase.io/docs/api-realtime"]
title = "Web APIs reference - API Realtime - Docs - PocketBase"
description = "Open Source backend in 1 file with realtime database, authentication, file storage and admin dashboard"
full_description = '''Introduction Going to production Web APIs reference ├ API Records ├ API Realtime ├ API Files ├ API Collections ├ API Settings ├ API Logs ├ API Crons ├ API Backups └ API Health Extend with Go Extend with JavaScript Go Overview Go Event hooks Go Routing Go Database Go Record operations Go Collection operations Go Migrations Go Jobs scheduling Go Sending emails Go Rendering templates Go Console commands Go Realtime messaging Go Filesystem Go Logging Go Testing Go Miscellaneous Go Record proxy JS Overview JS Event hooks JS Routing JS Database JS Record operations JS Collection operations JS Migrations JS Jobs scheduling JS Sending emails JS Rendering templates JS Console commands JS Sending HTTP requests JS Realtime messaging JS Filesystem JS Logging JS Types reference Web APIs reference - API Realtime API Realtime The Realtime API is implemented via Server-Sent Events (SSE). Generally, it consists of 2 operations: establish SSE connection submit client subscriptions SSE events are sent for create, update and delete record operations. You could subscribe to a single record or to an entire collection. When you subscribe to a single record, the collection's ViewRule will be used to determine whether the subscriber has access to receive the event message. When you subscribe to an entire collection, the collection's ListRule will be used to determine whether the subscriber has access to receive the event message. Connect GET /api/realtime Establishes a new SSE connection and immediately sends a PB_CONNECT SSE event with the created client ID. NB! The user/superuser authorization happens during the first Set subscriptions call. If the connected client doesn't receive any new messages for 5 minutes, the server will send a disconnect signal (this is to prevent forgotten/leaked connections). The connection will be automatically reestablished if the client is still active (e.g. the browser tab is still open). Set subscriptions POST /api/realtime Sets new active client's subscriptions (and auto unsubscribes from the previous ones). If Authorization header is set, will authorize the client SSE connection with the associated user or superuser. Body Parameters Param Type Description Required clientId String ID of the SSE client connection. Optional subscriptions Array<String> The new client subscriptions to set in the format: COLLECTION_ID_OR_NAME or COLLECTION_ID_OR_NAME/RECORD_ID. You can also attach optional query and header parameters as serialized json to a single topic using the options query parameter, e.g.: COLLECTION_ID_OR_NAME/RECORD_ID?options={"query": {"abc": "123"}, "headers": {"x-token": "..."}} Leave empty to unsubscribe from everything. Body parameters could be sent as JSON or multipart/form-data. Responses 204 400 403 404 null { "status": 400, "message": "Something went wrong while processing your request.", "data": { "clientId": { "code": "validation_required", "message": "Missing required value." } } } { "status": 403, "message": "The current and the previous request authorization don't match.", "data": {} } { "status": 404, "message": "Missing or invalid client id.", "data": {} } All of this is seamlessly handled by the SDKs using just the subscribe and unsubscribe methods: JavaScript Dart import PocketBase from 'pocketbase'; const pb = new PocketBase('http://127.0.0.1:8090'); ... // (Optionally) authenticate await pb.collection('users').authWithPassword('test@example.com', '1234567890'); // Subscribe to changes in any record in the collection pb.collection('example').subscribe('*', function (e) { console.log(e.action); console.log(e.record); }, { /* other options like expand, custom headers, etc. */ }); // Subscribe to changes only in the specified record pb.collection('example').subscribe('RECORD_ID', function (e) { console.log(e.action); console.log(e.record); }, { /* other options like expand, custom headers, etc. */ }); // Unsubscribe pb.collection('example').unsubscribe('RECORD_ID'); // remove all 'RECORD_ID' subscriptions pb.collection('example').unsubscribe('*'); // remove all '*' topic subscriptions pb.collection('example').unsubscribe(); // remove all subscriptions in the collection import 'package:pocketbase/pocketbase.dart'; final pb = PocketBase('http://127.0.0.1:8090'); ... // (Optionally) authenticate await pb.collection('users').authWithPassword('test@example.com', '1234567890'); // Subscribe to changes in any record in the collection pb.collection('example').subscribe('*', (e) { print(e.action); print(e.record); }, /* other options like expand, custom headers, etc. */); // Subscribe to changes only in the specified record pb.collection('example').subscribe('RECORD_ID', (e) { print(e.action); print(e.record); }, /* other options like expand, custom headers, etc. */); // Unsubscribe pb.collection('example').unsubscribe('RECORD_ID'); // remove all 'RECORD_ID' subscriptions pb.collection('example').unsubscribe('*'); // remove all '*' topic subscriptions pb.collection('example').unsubscribe(); // remove all subscriptions in the collection Prev: API Records Next: API Files'''
year_published = 2025
