full_description = '''Clone returns a shallow copy of the current record model with all of its collection and unknown fields data, expand and flags copied. use [Record.Fresh()] instead if you want a copy with only the latest collection fields data and everything else reset to the defaults. NB! The returned collection is only for read purposes and it shouldn't be modified because it could have unintended side-effects on other Record models from the same collection. CustomData returns a shallow copy ONLY of the custom record fields data, aka. fields that are neither defined by the collection, nor special system ones. DBExport implements the [DBExporter] interface and returns a key-value map with the data to be persisted when saving the Record in the database. ExpandedAll retrieves a slice of relation Records from the already loaded expand data of the current model. If the requested expand relation is single, this method normalizes the return result and will wrap the single model as a slice. ExpandedOne retrieves a single relation Record from the already loaded expand data of the current model. If the requested expand relation is multiple, this method returns only first available Record from the expanded relation. FindFileFieldByFile returns the first file type field for which any of the record's data contains the provided filename. Fresh returns a shallow copy of the current record model populated with its LATEST data state and everything else reset to the defaults (aka. no expand, no unknown fields and with default visibility flags). GetUnsavedFiles returns the uploaded files for the provided "file" field key, (aka. the current [*filesytem.File] values) so that you can apply further validations or modifications (including changing the file name or content before persisting). IgnoreUnchangedFields toggles the flag to ignore the unchanged fields from the DB export for the UPDATE SQL query. This could be used if you want to save only the record fields that you've changed without overwrite other untouched fields in case of concurrent update.'''
