["https://pocketbase.io/docs/collections"]
title = "Introduction - Collections - Docs - PocketBase"
description = "Open Source backend in 1 file with realtime database, authentication, file storage and admin dashboard"
full_description = '''Introduction ├ How to use PocketBase ├ Collections ├ API rules and filters ├ Authentication ├ Files upload and handling ├ Working with relations └ Extending PocketBase Going to production Web APIs reference Extend with Go Extend with JavaScript Go Overview Go Event hooks Go Routing Go Database Go Record operations Go Collection operations Go Migrations Go Jobs scheduling Go Sending emails Go Rendering templates Go Console commands Go Realtime messaging Go Filesystem Go Logging Go Testing Go Miscellaneous Go Record proxy JS Overview JS Event hooks JS Routing JS Database JS Record operations JS Collection operations JS Migrations JS Jobs scheduling JS Sending emails JS Rendering templates JS Console commands JS Sending HTTP requests JS Realtime messaging JS Filesystem JS Logging JS Types reference Introduction - Collections Collections Overview Collections represent your application data. Under the hood they are backed by plain SQLite tables that are generated automatically with the collection name and fields (columns). Single entry of a collection is called record (a single row in the SQL table). You can manage your collections from the Dashboard, with the Web APIs using the client-side SDKs (superusers only) or programmatically via the Go/JavaScript migrations. Similarly, you can manage your records from the Dashboard, with the Web APIs using the client-side SDKs or programmatically via the Go/JavaScript Record operations. Here is what a collection edit panel looks like in the Dashboard: Currently there are 3 collection types: Base, View and Auth. Base collection Base collection is the default collection type and it could be used to store any application data (articles, products, posts, etc.). View collection View collection is a read-only collection type where the data is populated from a plain SQL SELECT statement, allowing users to perform aggregations or any other custom queries in general. For example, the following query will create a read-only collection with 3 posts fields - id, name and totalComments: SELECT posts.id, posts.name, count(comments.id) as totalComments FROM posts LEFT JOIN comments on comments.postId = posts.id GROUP BY posts.id View collections don't receive realtime events because they don't have create/update/delete operations. Auth collection Auth collection has everything from the Base collection but with some additional special fields to help you manage your app users and also providing various authentication options. Each Auth collection has the following special system fields: email, emailVisibility, verified, password and tokenKey. They cannot be renamed or deleted but can be configured using their specific field options. For example you can make the user email required or optional. You can have as many Auth collections as you want (users, managers, staffs, members, clients, etc.) each with their own set of fields, separate login and records managing endpoints. You can build all sort of different access controls: Role (Group) For example, you could attach a "role" select field to your Auth collection with the following options: "employee" and "staff". And then in some of your other collections you could define the following rule to allow only "staff": @request.auth.role = "staff" Relation (Ownership) Let's say that you have 2 collections - "posts" base collection and "users" auth collection. In your "posts" collection you can create "author" relation field pointing to the "users" collection. To allow access to only the "author" of the record(s), you could use a rule like: @request.auth.id != "" && author = @request.auth.id Nested relation fields look ups, including back-relations, are also supported, for example: someRelField.anotherRelField.author = @request.auth.id Managed In addition to the default "List", "View", "Create", "Update", "Delete" API rules, Auth collections have also a special "Manage" API rule that could be used to allow one user (it could be even from a different collection) to be able to fully manage the data of another user (e.g. changing their email, password, etc.). Mixed You can build a mixed approach based on your unique use-case. Multiple rules can be grouped with parenthesis () and combined with && (AND) and || (OR) operators: @request.auth.id != "" && (@request.auth.role = "staff" || author = @request.auth.id) Fields All collection fields (with exception of the JSONField) are non-nullable and uses a zero-default for their respective type as fallback value when missing (empty string for text, 0 for number, etc.). All field specific modifiers are supported both in the Web APIs and via the record Get/Set methods. BoolField BoolField defines bool type field to store a single false (default) or true value. NumberField NumberField defines number type field for storing numeric/float64 value: 0 (default), 2, -1, 1.5. The following additional set modifiers are available: fieldName+ adds number to the already existing record value. fieldName- subtracts number from the already existing record value. TextField TextField defines text type field for storing string values: "" (default), "example". The following additional set modifiers are available: fieldName:autogenerate autogenerate a field value if the AutogeneratePattern field option is set. For example, submitting: {"slug:autogenerate":"abc-"} will result in "abc-[random]" slug field value. EmailField EmailField defines email type field for storing a single email string address: "" (default), "john@example.com". URLField URLField defines url type field for storing a single URL string value: "" (default), "https://example.com". EditorField EditorField defines editor type field to store HTML formatted text: "" (default), <p>example</p>. DateField DateField defines date type field to store a single datetime string value: "" (default), "2022-01-01 00:00:00.000Z". All PocketBase dates at the moment follows the RFC3399 format Y-m-d H:i:s.uZ (e.g. 2024-11-10 18:45:27.123Z). Dates are compared as strings, meaning that when using the filters with a date field you'll have to specify the full datetime string format. For example to target a single day (e.g. November 19, 2024) you can use something like: created >= '2024-11-19 00:00:00.000Z' && created <= '2024-11-19 23:59:59.999Z' AutodateField AutodateField defines an autodate type field and it is similar to the DateField but its value is auto set on record create/update. This field is usually used for defining timestamp fields like "created" and "updated". SelectField SelectField defines select type field for storing single or multiple string values from a predefined list. It is usually intended for handling enums-like values such as pending/public/private statuses, simple client/staff/manager/admin roles, etc. For single select (the MaxSelect option is <= 1) the field value is a string: "", "optionA". For multiple select (the MaxSelect option is >= 2) the field value is an array: [], ["optionA", "optionB"]. The following additional set modifiers are available: fieldName+ appends one or more values to the existing one. +fieldName prepends one or more values to the existing one. fieldName- subtracts/removes one or more values from the existing one. For example: {"permissions+": "optionA", "roles-": ["staff", "editor"]} FileField FileField defines file type field for managing record file(s). PocketBase stores in the database only the file name. The file itself is stored either on the local disk or in S3, depending on your application storage settings. For single file (the MaxSelect option is <= 1) the stored value is a string: "", "file1_Ab24ZjL.png". For multiple file (the MaxSelect option is >= 2) the stored value is an array: [], ["file1_Ab24ZjL.png", "file2_Frq24ZjL.txt"]. The following additional set modifiers are available: fieldName+ appends one or more files to the existing field value. +fieldName prepends one or more files to the existing field value. fieldName- deletes one or more files from the existing field value. For example: {"documents+": new File(...), "documents-": ["file1_Ab24ZjL.txt", "file2_Frq24ZjL.txt"]} You can find more detailed information in the Files upload and handling guide. RelationField RelationField defines relation type field for storing single or multiple collection record references. For single relation (the MaxSelect option is <= 1) the field value is a string: "", "RECOD_ID". For multiple relation (the MaxSelect option is >= 2) the field value is an array: [], ["RECORD_ID1", "RECORD_ID2"]. The following additional set modifiers are available: fieldName+ appends one or more ids to the existing one. +fieldName prepends one or more ids to the existing one. fieldName- subtracts/removes one or more ids from the existing one. For example: {"users+": "USER_ID", "categories-": ["CAT_ID1", "CAT_ID2"]} JSONField JSONField defines json type field for storing any serialized JSON value, including null (default). Prev: How to use PocketBase Next: API rules and filters'''
year_published = 2025
clearnet = "https://pocketbase.io/docs/collections"
tags = [":autogenerate", "@request.auth.id", "additional", "apis", "auth", "autodatefield", "available:", "base", "boolfield", "collection"]
language = "en"
internal-references = ["none"]
external-references = ["cloud.google.com", "community.ibm.com", "digitalocean.com", "gani.bg", "github.com", "hetzner.com", "linode.com", "litestream.io", "oracle.com", "sqlite.org", "upcloud.com", "vultr.com"]

["https://pocketbase.io/docs/js-database"]
title = "Extend with JavaScript - Database - Docs - PocketBase"
description = "Open Source backend in 1 file with realtime database, authentication, file storage and admin dashboard"
full_description = '''Introduction Going to production Web APIs reference Extend with Go Extend with JavaScript Go Overview Go Event hooks Go Routing Go Database Go Record operations Go Collection operations Go Migrations Go Jobs scheduling Go Sending emails Go Rendering templates Go Console commands Go Realtime messaging Go Filesystem Go Logging Go Testing Go Miscellaneous Go Record proxy JS Overview JS Event hooks JS Routing JS Database JS Record operations JS Collection operations JS Migrations JS Jobs scheduling JS Sending emails JS Rendering templates JS Console commands JS Sending HTTP requests JS Realtime messaging JS Filesystem JS Logging JS Types reference Extend with JavaScript - Database Database $app is the main interface to interact with your database. $app.db() returns a dbx.Builder that could run all kind of SQL statements, including raw queries. For more details and examples how to interact with Record and Collection models programmatically you could also check Collection operations and Record operations sections. Executing queries To execute DB queries you can start with the newQuery("...") statement and then call one of: execute() - for any query statement that is not meant to retrieve data: $app.db() .newQuery("DELETE FROM articles WHERE status = 'archived'") .execute() // throw an error on db failure one() - to populate a single row into DynamicModel object: const result = new DynamicModel({ // describe the shape of the data (used also as initial values) "id": "", "status": false, "age": 0, // use -0 for a float value "roles": [], // serialized json db arrays are decoded as plain arrays }) $app.db() .newQuery("SELECT id, status, age, roles FROM users WHERE id=1") .one(result) // throw an error on db failure or missing row console.log(result.id) all() - to populate multiple rows into an array of objects (note that the array must be created with arrayOf): const result = arrayOf(new DynamicModel({ // describe the shape of the data (used also as initial values) "id": "", "status": false, "age": 0, // use -0 for a float value "roles": [], // serialized json db arrays are decoded as plain arrays })) $app.db() .newQuery("SELECT id, status, age, roles FROM users LIMIT 100") .all(result) // throw an error on db failure if (result.length > 0) { console.log(result[0].id) } Binding parameters To prevent SQL injection attacks, you should use named parameters for any expression value that comes from user input. This could be done using the named {:paramName} placeholders in your SQL statement and then define the parameter values for the query with bind(params). For example: const result = arrayOf(new DynamicModel({ "name": "", "created": "", })) $app.db() .newQuery("SELECT name, created FROM posts WHERE created >= {:from} and created <= {:to}") .bind({ "from": "2023-06-25 00:00:00.000Z", "to": "2023-06-28 23:59:59.999Z", }) .all(result) console.log(result.length) Query builder Instead of writing plain SQLs, you can also compose SQL statements programmatically using the db query builder. Every SQL keyword has a corresponding query building method. For example, SELECT corresponds to select(), FROM corresponds to from(), WHERE corresponds to where(), and so on. const result = arrayOf(new DynamicModel({ "id": "", "email": "", })) $app.db() .select("id", "email") .from("users") .andWhere($dbx.like("email", "example.com")) .limit(100) .orderBy("created ASC") .all(result) select(), andSelect(), distinct() The select(...cols) method initializes a SELECT query builder. It accepts a list of the column names to be selected. To add additional columns to an existing select query, you can call andSelect(). To select distinct rows, you can call distinct(true). $app.db() .select("id", "avatar as image") .andSelect("(firstName || ' ' || lastName) as fullName") .distinct(true) ... from() The from(...tables) method specifies which tables to select from (plain table names are automatically quoted). $app.db() .select("table1.id", "table2.name") .from("table1", "table2") ... join() The join(type, table, on) method specifies a JOIN clause. It takes 3 parameters: type - join type string like INNER JOIN, LEFT JOIN, etc. table - the name of the table to be joined on - optional dbx.Expression as an ON clause For convenience, you can also use the shortcuts innerJoin(table, on), leftJoin(table, on), rightJoin(table, on) to specify INNER JOIN, LEFT JOIN and RIGHT JOIN, respectively. $app.db() .select("users.*") .from("users") .innerJoin("profiles", $dbx.exp("profiles.user_id = users.id")) .join("FULL OUTER JOIN", "department", $dbx.exp("department.id = {:id}", {id: "someId"})) ... where(), andWhere(), orWhere() The where(exp) method specifies the WHERE condition of the query. You can also use andWhere(exp) or orWhere(exp) to append additional one or more conditions to an existing WHERE clause. Each where condition accepts a single dbx.Expression (see below for full list). /* SELECT users.* FROM users WHERE id = "someId" AND status = "public" AND name like "%john%" OR ( role = "manager" AND fullTime IS TRUE AND experience > 10 ) */ $app.db() .select("users.*") .from("users") .where($dbx.exp("id = {:id}", { id: "someId" })) .andWhere($dbx.hashExp({ status: "public" })) .andWhere($dbx.like("name", "john")) .orWhere($dbx.and( $dbx.hashExp({ role: "manager", fullTime: true, }), $dbx.exp("experience > {:exp}", { exp: 10 }) )) ... The following dbx.Expression methods are available: $dbx.exp(raw, optParams) Generates an expression with the specified raw query fragment. Use the optParams to bind parameters to the expression. $dbx.exp("status = 'public'") $dbx.exp("total > {:min} AND total < {:max}", { min: 10, max: 30 }) $dbx.hashExp(pairs) Generates a hash expression from a map whose keys are DB column names which need to be filtered according to the corresponding values. // slug = "example" AND active IS TRUE AND tags in ("tag1", "tag2", "tag3") AND parent IS NULL $dbx.hashExp({ slug: "example", active: true, tags: ["tag1", "tag2", "tag3"], parent: null, }) $dbx.not(exp) Negates a single expression by wrapping it with NOT(). // NOT(status = 1) $dbx.not($dbx.exp("status = 1")) $dbx.and(...exps) Creates a new expression by concatenating the specified ones with AND. // (status = 1 AND username like "%john%") $dbx.and($dbx.exp("status = 1"), $dbx.like("username", "john")) $dbx.or(...exps) Creates a new expression by concatenating the specified ones with OR. // (status = 1 OR username like "%john%") $dbx.or($dbx.exp("status = 1"), $dbx.like("username", "john")) $dbx.in(col, ...values) Generates an IN expression for the specified column and the list of allowed values. // status IN ("public", "reviewed") $dbx.in("status", "public", "reviewed") $dbx.notIn(col, ...values) Generates an NOT IN expression for the specified column and the list of allowed values. // status NOT IN ("public", "reviewed") $dbx.notIn("status", "public", "reviewed") $dbx.like(col, ...values) Generates a LIKE expression for the specified column and the possible strings that the column should be like. If multiple values are present, the column should be like all of them. By default, each value will be surrounded by "%" to enable partial matching. Special characters like "%", "\", "_" will also be properly escaped. You may call escape(...pairs) and/or match(left, right) to change the default behavior. // name LIKE "%test1%" AND name LIKE "%test2%" $dbx.like("name", "test1", "test2") // name LIKE "test1%" $dbx.like("name", "test1").match(false, true) $dbx.notLike(col, ...values) Generates a NOT LIKE expression in similar manner as like(). // name NOT LIKE "%test1%" AND name NOT LIKE "%test2%" $dbx.notLike("name", "test1", "test2") // name NOT LIKE "test1%" $dbx.notLike("name", "test1").match(false, true) $dbx.orLike(col, ...values) This is similar to like() except that the column must be one of the provided values, aka. multiple values are concatenated with OR instead of AND. // name LIKE "%test1%" OR name LIKE "%test2%" $dbx.orLike("name", "test1", "test2") // name LIKE "test1%" OR name LIKE "test2%" $dbx.orLike("name", "test1", "test2").match(false, true) $dbx.orNotLike(col, ...values) This is similar to notLike() except that the column must not be one of the provided values, aka. multiple values are concatenated with OR instead of AND. // name NOT LIKE "%test1%" OR name NOT LIKE "%test2%" $dbx.orNotLike("name", "test1", "test2") // name NOT LIKE "test1%" OR name NOT LIKE "test2%" $dbx.orNotLike("name", "test1", "test2").match(false, true) $dbx.exists(exp) Prefix with EXISTS the specified expression (usually a subquery). // EXISTS (SELECT 1 FROM users WHERE status = 'active') $dbx.exists(dbx.exp("SELECT 1 FROM users WHERE status = 'active'")) $dbx.notExists(exp) Prefix with NOT EXISTS the specified expression (usually a subquery). // NOT EXISTS (SELECT 1 FROM users WHERE status = 'active') $dbx.notExists(dbx.exp("SELECT 1 FROM users WHERE status = 'active'")) $dbx.between(col, from, to) Generates a BETWEEN expression with the specified range. // age BETWEEN 3 and 99 $dbx.between("age", 3, 99) $dbx.notBetween(col, from, to) Generates a NOT BETWEEN expression with the specified range. // age NOT BETWEEN 3 and 99 $dbx.notBetween("age", 3, 99) orderBy(), andOrderBy() The orderBy(...cols) specifies the ORDER BY clause of the query. A column name can contain "ASC" or "DESC" to indicate its ordering direction. You can also use andOrderBy(...cols) to append additional columns to an existing ORDER BY clause. $app.db() .select("users.*") .from("users") .orderBy("created ASC", "updated DESC") .andOrderBy("title ASC") ... groupBy(), andGroupBy() The groupBy(...cols) specifies the GROUP BY clause of the query. You can also use andGroupBy(...cols) to append additional columns to an existing GROUP BY clause. $app.db() .select("users.*") .from("users") .groupBy("department", "level") ... having(), andHaving(), orHaving() The having(exp) specifies the HAVING clause of the query. Similarly to where(exp), it accept a single dbx.Expression (see all available expressions listed above). You can also use andHaving(exp) or orHaving(exp) to append additional one or more conditions to an existing HAVING clause. $app.db() .select("users.*") .from("users") .groupBy("department", "level") .having($dbx.exp("sum(level) > {:sum}", { sum: 10 })) ... limit() The limit(number) method specifies the LIMIT clause of the query. $app.db() .select("users.*") .from("users") .limit(30) ... offset() The offset(number) method specifies the OFFSET clause of the query. Usually used together with limit(number). $app.db() .select("users.*") .from("users") .offset(5) .limit(30) ... Transaction To execute multiple queries in a transaction you can use $app.runInTransaction(fn) . The DB operations are persisted only if the transaction completes without throwing an error. It is safe to nest runInTransaction calls as long as you use the callback's txApp argument. Inside the transaction function always use its txApp argument and not the original $app instance because we allow only a single writer/transaction at a time and it could result in a deadlock. To avoid performance issues, try to minimize slow/long running tasks such as sending emails, connecting to external services, etc. as part of the transaction. $app.runInTransaction((txApp) => { // update a record const record = txApp.findRecordById("articles", "RECORD_ID") record.set("status", "active") txApp.save(record) // run a custom raw query (doesn't fire event hooks) txApp.db().newQuery("DELETE FROM articles WHERE status = 'pending'").execute() }) Prev: Routing Next: Record operations'''
