full_description = 'Deprecated: It was previously used as part of the record create action but it is not needed anymore and will be removed in the future. DrySubmit performs a temp form submit within a transaction and reverts it at the end. For actual record persistence, check the [RecordUpsert.Submit()] method. GrantManagerAccess updates the form access level to "manager" allowing directly changing some system record fields (often used with auth collection records). GrantSuperuserAccess updates the form access level to "superuser" allowing directly changing all system record fields, including those marked as "Hidden". This could be used for example if you want to change at later stage before submission to change from regular -> transactional app instance.'
