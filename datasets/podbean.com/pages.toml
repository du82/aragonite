["https://www.podbean.com/how-to-record-your-podcast"]
title = "How To Use Group Recording Using The Podbean App | Podbean Academy"
description = "Learn about Podbean's new group recording function. Record an audio podcast with co-hosts and guests by simply using the Podbean app."
full_description = "Group recording lets you record an audio podcast episode with co-hosts and guests by simply using the Podbean app. You can invite up to eight guests to join you during your recording. Once completed, you’ll receive both a single mp3 cloud recording for your whole session, as well as individual local recordings of you and each of your co-hosts. Traditionally, the sound quality of each host and the overall recording in a remote interview or virtual recording decreases due to network issues. Podbean’s Group Recording function allows you to get clear, high quality individual recordings of each host, as these recordings are recorded locally on each host’s smartphone. Your co-hosts recording audio quality is not affected by the internet connection. After the recording session is completed, you can get each speaker's local audio recording in your Podbean account media manager and merge them into a master file using your DAW audio software of choice. Before you begin, please ensure that you and every host have the Podbean App installed on their phones and that you and your guests have created a Podbean account and have logged into the App. Also for the best experience and audio quality, it’s recommended to use headphones and a mic during the group recording. Log into your Podbean account, click on the “+” icon at the bottom–>click Group Recording . Enter your session title, click Start Now to start your group recording. You can also schedule your group recording for a later date by choosing the Start Time, and you can navigate to Profile -> Recording -> Scheduled Recording to see your upcoming show. You can add your co-host’s email and click the invite button to send an email invitation to your guest. They will receive an email with a link to your group recording. If they do not have the Podbean app installed on their device, clicking the link will prompt them to do so before the group recording. You can also click the copy button next to the group recording link to share it. If you’ve previously invited a guest, you can click the green invite button next to their name to invite them to the group recording."
