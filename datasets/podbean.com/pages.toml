full_description = "With its eminent scholars and world-renowned Library and Archives, the Hoover Institution seeks to improve the human condition by advancing ideas that promote economic opportunity and prosperity, while securing and safeguarding peace for America and all mankind. The Libertarian podcast features a weekly conversation with Hoover senior fellow Richard Epstein on the issues of the day. Matters of Policy & Politics is a Hoover Institution podcast devoted to matters of governance and balance of power at home and abroad. It is hosted by Hoover fellow Bill Whalen. For more than two decades the Hoover Institution has been producing Uncommon Knowledge with Peter Robinson, a series hosted by Hoover fellow Peter Robinson as an outlet for political leaders, scholars, journalists, and today’s big thinkers to share their views with the world. Hoover fellows Richard Epstein and Adam White discuss major legal and policy issues and debate points of disagreement between their libertarian and conservative perspectives. The 21st century may be the Pacific Century, and China appears poised to become America’s greatest rival for global power and influence. Host Michael Auslin and guests discuss the latest politics, economics, security, and cultural news in China, Asia, and America. A lively (and often funny) look at legislation and constitutional jurisprudence by preeminent law professors Richard Epstein and John Yoo. The show is hosted by Troy Senik. The Grumpy Economist Podcast features Hoover Institution Senior Fellow John Cochrane offering analysis and commentary on the news of the day from a humorous free-market perspective. In uncertain times what’s needed is not just clarity about today’s pandemic, but insight into the challenges that lie ahead as America recovers and returns to normal. GoodFellows, a weekly Hoover Institution broadcast, features senior fellows John Cochrane, Niall Ferguson, and H.R. McMaster discussing the social, economic, and geostrategic ramifications of this changed world."
