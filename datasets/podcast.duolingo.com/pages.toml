title = "Episódio 43: Vida em NY - Lugares icônicos - Duolingo"
description = "Listen to episodes of the Ingles-Portugues Duolingo podcast for compelling, true-life stories that improve your Ingles-Portugues listening and comprehension skills."
full_description = "Episódio 43: Vida em NY - Lugares icônicos Por Duolingo — quarta, 22 de novembro de 2023 Nesse episódio, trazemos histórias de pessoas que têm uma ligação especial com dois lugares icônicos de Nova York: a Estátua da Liberdade e o Empire State Building. Clique aqui para baixar o Duolingo, o aplicativo Nº1 do mundo para aprender idiomas. É grátis, divertido e funciona! Como ouvir os episódios Ouça de graça no Spotify ou na sua plataforma preferida. Transcrição Helena: A primeira vez que Christina Ray Stanton foi pra Nova York, ela tinha 17 anos. Foi em 1987. Christina: I came to New York on a high school trip. I was visiting from my home in the state of Florida, and I was especially excited to see the Statue of Liberty. Helena: A Estátua da Liberdade é um famoso landmark, ou marco, de Nova York. É uma escultura enorme, de 46 metros de altura. Ela representa uma deusa que segura uma tocha em uma das mãos e uma planilha na outra. As correntes quebradas nos pés simbolizam a liberdade frente à opressão. Christina: Over 100 years ago, people came to the U.S. by boat from all over the world, and the statue was the first thing they saw. Helena: A estátua foi um presente da França pros Estados Unidos no século 19 e fica numa pequena ilha no meio do porto de Nova York. Christina: I fell in love with New York City during that first trip. I looked at the Statue of Liberty, and I felt like anything was possible. At that time, I didn’t know that the famous landmark was going to be such an important part of my future. Helena: Atenção, passageiras e passageiros, welcome to Destinos Duolingo! Eu sou Helena Fruet e vou te guiar nessa viagem. Nesse podcast, vamos explorar a história e a cultura de diferentes cidades do mundo e aprender inglês com os próprios moradores! Eu vou te acompanhar em cada destino e não vou deixar você se perder. Você encontra a transcrição completa de cada episódio em podcast.duolingo.com. Nessa primeira temporada do podcast, embarcamos pra Nova York, a cidade que nunca dorme. Você vai conhecer alguns dos seus 8 milhões de habitantes e explorar lugares que muita gente sempre sonhou em visitar! Nesse episódio, trazemos histórias de pessoas que têm uma ligação especial com dois marcos de Nova York: a Estátua da Liberdade e o Empire State Building. Então vamo lá? Partiu Nova York! Helena: Christina Stanton se mudou pra Nova York em 1995. Ela tinha 23 anos e sonhava em ser atriz da Broadway — aquela parte de Manhattan famosa pelas peças de teatro e musicais, como West Side Story, O Rei Leão e Hamilton. Christina: When I arrived in New York City, I realized that it was a very expensive place to live. I wanted to be an actor, but I needed to find another job to pay for my apartment. I didn’t want to work in an office, a restaurant, or a bar. Then, someone told me that some actors work as tour guides. I thought, “Wow, that sounds wonderful!” Helena: Christina fez um ano de curso pra ser guia turística. Ela aprendeu a história da cidade e se inscrevia pra todo passeio que aparecia pela frente. Pra ser guia turístico oficial de Nova York, é preciso fazer uma prova, e Christina foi aprovada! Foi aí que ela se sentiu uma nova-iorquina de verdade. Christina: I loved being a tour guide. I was an actress, so I felt confident enough to perform in front of big groups of people. I gave tours on big buses, and I did walking tours of an area of the city called the Financial District. Helena: Hoje, o distrito financeiro é um centro mundial de negócios. E sua história também é muito rica. No século 17, o distrito fazia parte do assentamento holandês, que na época se chamava New Amsterdam. É uma das áreas mais antigas de Nova York. Christina: I did a lot of tours, but the Statue of Liberty tour was the most important to me. The tour was on a boat, and I always took my groups to the part of the boat with the best view of the statue. The people on the tour were from all over the world, and I loved hearing all the different languages. Everyone was so excited to learn more about the statue and its message of hope and liberty. Helena: Não importava quantas vezes Christina fosse lá, a estátua sempre teve um significado especial pra ela. Christina: I was still young and trying to find my place in New York. But when I looked at the statue, I remembered that millions of people came to this city looking for their place in the world, too. Helena: Depois de alguns anos trabalhando em Nova York como guia turística, Christina se casou. E o marido dela achou um apartamento pra eles pertinho do World Trade Center, numa parte que era importante pro passeio do distrito financeiro. Christina: At first, I wasn’t sure about living near the World Trade Center. It’s an area where a lot of people work, and it doesn’t always feel like a real community. But after we moved there, I liked it a lot. I especially liked that the area is close to some of my favorite things in the city, including the Statue of Liberty. Helena: Christina continuou atuando e trabalhando como guia turística. Mas em 11 de setembro de 2001, aconteceu uma coisa que mudou a vida dela e de muita gente. Naquela manhã, Brian sentiu o prédio todo tremendo. Ele acordou Christina e os dois foram pra varanda. E foi aí que eles viram a primeira torre, ou tower, do World Trade Center… em chamas. Christina: The second plane passed in front of our window. Then, it turned and flew into the second tower. When the plane hit the building, the impact was really strong. I was outside on my balcony, and I suddenly fell back onto the floor of my living room. Then, we ran down the 24 floors of the building and immediately went to Battery Park. The people around me cried and screamed, and I remember thinking, “I don’t want to see any of this.” Helena: O Battery Park fica mais ao sul da ilha de Manhattan, bem na beira do porto. Cercados por milhares de pessoas tentando escapar da catástrofe do World Trade Center, Christina e Brian sentaram num banco e só conseguiam olhar pra água. Christina: I looked at the Statue of Liberty. And it was still there on its island, with the water and the blue sky around it. I couldn’t stop looking at it. The statue was so important to me and millions of other people, and I was so worried that a plane was going to hit it. Helena: Felizmente isso não aconteceu, mas de repente a terra começou a tremer. As torres desmoronaram. Christina, Brian… Todo mundo que tava por ali ficou coberto de cinzas amarelas e cercado por escombros. Christina: It was hard to see, and everyone was coughing. My husband and I said goodbye to each other because we thought there might be another attack. We watched people jump into the water, and try to swim to a safe place. We didn’t know where to go. It was horrible, and I couldn’t believe it was happening. Helena: Os barcos começaram a chegar no píer pra ajudar a levar as pessoas pra Nova Jersey, um estado que fica do outro lado do rio. Tinha balsas, lanchas e botes. Christina: A boat arrived to take us to a safe place. Without thinking, I walked to the place where I usually did my tours, where I had the best view of the Statue of Liberty. We saw smoke coming from the area where the towers were. I thought, “What’s happening to my city?” Helena: Enquanto os escombros ao redor do World Trade Center eram retirados, Christina e Brian foram morar com a família dela, na Flórida. Seis meses depois, quando o distrito financeiro ficou seguro de novo, eles voltaram pra Nova York. Christina recomeçou seu trabalho como guia turística, mas não era a mesma coisa. Christina: When I took a group to the Statue of Liberty for the first time after September the 11th, I still felt sad and traumatized. On the boat, I was annoyed when I saw people smiling and taking photos. I wanted to shout, “Don’t you know what happened six months ago?” Helena: Mas aí, como faziam todos os turistas, ela olhou pro outro lado do rio e viu seu monumento preferido de Nova York. Ela tava ali, ainda de pé, num céu azul, como um grande símbolo de esperança, ou hope. Aos poucos, Christina começou a se sentir melhor. Christina: On the boat, I remembered that terrible day. But I also remembered that the Statue of Liberty has given hope to so many people. And I realized that she gave me hope, too. Helena: Christina tinha encontrado um novo sentido pros seus passeios. As pessoas visitariam Nova York de novo e seriam recebidas de braços abertos, assim como aconteceu com ela um dia. Christina: I wanted tourists to come back. I wanted them to see that the city is strong and that New Yorkers worked together to help each other. The Statue of Liberty is still an inspiration to the world. She’s still standing there saying, “You are welcome here.” Helena: Você sabia que dá pra subir até o topo da Estátua da Liberdade, lá na cabeça dela, onde fica a coroa? Numa cidade vertical como Nova York, subir na cobertura de prédios enormes é um ótimo passeio! E tem gente que nem usa elevador, como Sproule Love. Sproule: I’ve been to the top of the Empire State Building 12 times. The view is incredible. You can see all of New York City, including famous landmarks, like the World Trade Center, the Brooklyn Bridge, and the Chrysler building. Helena: O Empire State Building é o prédio mais icônico de Nova York. Ele foi inaugurado em 1931 e por 35 anos foi o edifício mais alto do mundo. Sproule adorava o Empire State. Mas como atleta, ele não encontrava naquela selva de pedra as paisagens naturais onde gostava de treinar, ou train. Sproule treinava pra competições de biatlo de inverno, um esporte que combina esqui cross-country e tiro de rifle. Sproule: I’ve always loved races. I grew up in Missouri, and then I traveled to the Rocky Mountains in the state of Colorado and to forests in the state of Vermont to participate in races. After college, I began to train for the Olympics. Helena: O sonho de Sproule era competir numa olimpíada. Mas pra ir pros jogos olímpicos de 1998, ele precisava estar entre os cinco melhores nas provas de seleção, ou trials. E Sproule tinha ficado em décimo... Ele ficou abalado, mas sentia que tinha que erguer a cabeça. Sproule: I did really well in the Olympic trials, but I still wasn’t chosen to be on the Olympic team. After that, it seemed like no one in my life understood that it’s really hard to compete at that level. I was almost able to go to the Olympics, but I felt like I failed. So, I decided to quit training. Helena: A namorada de Sproule morava em Nova York. Um amigo ficou sabendo que ele queria se mudar pra lá e ofereceu um quarto barato pra alugar na cidade. Sproule pensou que seria a oportunidade perfeita pra romper com o passado e com sua carreira esportiva e começar uma nova aventura. Sproule: But when I moved to New York, I missed nature and outdoor activities. In the winter, I often left the city to go skiing. And in warm weather, I went on long bike rides outside of the city. Helena: Sproule precisava queimar aquela energia de atleta. E num dia de 1999, ele tava num dos táxis amarelos de Nova York, ouvindo rádio, quando... Anúncio no rádio: Attention, runners. Register now to climb 86… Sproule: The person on the radio was talking about a race. I was immediately interested. It was a race to the top of the Empire State Building! *Anúncio no rádio: ...Are you up to the challenge? Helena: Em 1978, um grupo chamado New York Road Runners, ou Corredores de Rua de Nova York, começou a organizar uma corrida dentro do Empire State Building. Era uma competição pra chegar no topo do prédio subindo os 1.576 degraus até o terraço. Foi a primeira corrida dentro de um arranha-céu nos Estados Unidos. Os corredores mais rápidos conseguem subir os 86 andares em cerca de 10 minutos. Sproule: I love competitions, so this was exciting. It was such a weird thing, but I knew that I had to do it. Helena: Só 150 pessoas podem participar da corrida. E pra conseguir uma vaga, Sproule teve que escrever um texto contando sua história. Sproule: In my essay, I explained that, before I moved to New York, I spent most of my time in nature, skiing, and climbing mountains. But when I moved to the city, the buildings became my mountains. And in New York, the Empire State Building is the most incredible mountain of all! Helena: Sproule foi aceito na prova. Agora, ele teria a chance de explorar aquele arranha-céu de um jeito completamente diferente. Sproule: The race was at 11 a.m. on a Tuesday morning. When I arrived, all the runners were waiting to start the race. But the Empire State Building is an office building, so people were also there to work, like it was a normal day. Helena: Quando deu a largada, todos os corredores saíram em disparada até as escadas. Foi um verdadeiro caos! Sproule: It’s a narrow door, only a meter wide. And everyone was trying to go through the door at the same time! Finally, I got through the crowd and started to run to the stairs. But then someone pushed me really hard, so I needed to stop for a minute. Soon, I was ready to go again, and I started running up the stairs as fast as I could. Helena: Correr escada acima não foi algo que ele chamaria de divertido! As pessoas se empurravam, o ar era muito seco e tinha muita poeira. E Sproule tinha que correr em círculos enquanto ia subindo cada andar. Ele ficou zonzo! Sproule: A lot of the runners didn’t have much experience, so they had to stop before the 20th floor. When I got to the 43rd floor, I was almost alone. I continued running up the stairs, and I passed one or two more people. When I finally got to the top floor, I was coughing and really tired. Then, I pushed the door open. Helena: A vista deixou Sproule impressionado. Era uma ótima recompensa por todo aquele esforço. Sproule: It was a beautiful February day and, in every direction, I saw a spectacular view of the city. My legs hurt. But I felt like I did something great, and, more than that, I felt like I belonged in New York City. Helena: Sproule terminou em sétimo lugar e virou fã da competição. Ele já participou outras 10 vezes e chegou a ficar em terceiro lugar! Sproule: I started going to similar races all over the world, in buildings in Paris, Taipei, and Chicago. Helena: Os arranha-céus eram as novas montanhas de Sproule — foi isso inclusive que ele escreveu no texto que garantiu sua vaga na competição. Sproule: It was a silly metaphor that I wrote in my essay, but after a while, that idea became really important to me. Now when I fly into cities, I see those tall buildings and I think to myself, “They really are the mountains of the city.” When I go to races, I wake up at my hotel, walk outside, and then look up to find the tallest building. I don’t need a map, I know exactly where to go. Helena: No fim, a corrida do Empire State Building ajudou Sproule a se adaptar à vida em Nova York — e a ver a cidade de um jeito totalmente novo. Sproule: I realized that I didn’t have to train in nature, so I didn’t need to live in places like Vermont or Colorado. I could do it all"
