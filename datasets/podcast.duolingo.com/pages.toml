description = "Listen to episodes of the Ingles-Espanol Duolingo podcast for compelling, true-life stories that improve your Ingles-Espanol listening and comprehension skills."
full_description = "Episodio 89: All About Accents! The Canadian Accent Por Duolingo el miércoles 28 de febrero del 2024 Las historias de dos personas que viven en diferentes partes de Canadá y las características únicas de sus acentos. Escúchanos en Suscríbete y escúchanos gratis en Spotify o donde prefieras escuchar tus podcasts. Transcripción Diana: ¡Hola, listeners! En esta temporada de “Relatos en inglés”, estamos celebrando la riqueza y diversidad del inglés. Estamos revisitando nuestros episodios favoritos, destacando acentos únicos de diferentes países y regiones donde se habla inglés. En el episodio de hoy, vamos rumbo al norte, arriba en el continente americano: Canadá. La forma en que se habla inglés en Canadá es por influencia de su historia y de su geografía. Lo que hoy es el país de Canadá, que hoy sigue siendo parte de la corona británica, fue colonia a la vez francesa y británica. Al oeste del país llegaron los colonos americanos, que aún eran leales a la corona británica, después de que Estados Unidos declarara su independencia. En general, el inglés que se habla en Canadá es muy similar, casi idéntico, al de Estados Unidos. Muestra cómo los acentos no cambian automáticamente cuando cruzamos fronteras o límites políticos en un mapa. Pero hay algunas diferencias que vamos a oír hoy en este episodio. Nuestra primera narradora, Allie Shier, es de la provincia de Ontario, que limita con estados del medio oeste de Estados Unidos, como Minnesota, Wisconsin y Michigan. Así que escucharás que su acento es muy similar al acento del medio oeste de Estados Unidos. Por ejemplo, pronuncia el sonido de la “r” en cada palabra muy claramente, en palabras para “escalera”, ladder, “ladder” y “más”, more, “more”. También podrás notar un rasgo canadiense particular, aunque es muy sutil en la voz de Allie. Ella pronuncia palabras como “de”, about, con un sonido más de “o”, por ejemplo: “I loved hearing about camp Timberlane”. Y ahora, la historia de Allie. Diana: Allie estaba sin aliento. A sus quince años, estaba subiendo una montaña con otras cinco chicas de su campamento de verano. Estaban en el séptimo día de un viaje de canotaje, o canoeing, en un parque provincial en Canadá. Allie: I remember being exhausted. We were carrying a lot of stuff with us, it was hot and sunny, and our arms already hurt because we did a lot of canoeing in the previous days. Diana: Esa tarde, sus supervisores, o counselors, que lideraban el viaje, sugirieron hacer una caminata. Entonces, dejaron sus canoas cerca del lago y empezaron a caminar. Cuando se acercaban a la cima, Allie sintió mucha hambre. Allie: We had to climb a ladder to get to the top. While I climbed, I noticed that there were blueberries growing on the side of the mountain. So, I grabbed a bunch of them and ate them while I climbed. Diana: De repente, con el rostro sucio por el jugo de los arándanos azules, Allie se dio cuenta de que acababan de llegar a la cima de una de las montañas más altas de la provincia de Ontario. Allie: We couldn’t believe it! I looked at the other kids from the camp, and we started laughing because we were so happy. I realized then that I was a lot stronger because of that trip. It showed me that I can do more than I ever thought was possible. Diana: Welcome, les damos la bienvenida a “Relatos en inglés”, un podcast de Duolingo. Soy Diana Gameros. En cada episodio podrás practicar inglés a tu propio ritmo, escuchando historias reales y fascinantes, contadas por las personas que las vivieron. Los protagonistas hablan en un inglés sencillo y fácil de entender para quienes están aprendiendo el idioma. En cada capítulo, yo te acompañaré, para asegurarme de que entiendas todo. Diana: De pequeña, la mamá de Allie siempre le contaba sobre sus propios veranos de niña. Ella iba a un campamento de verano llamado “Camp Timberlane”. Allie: Summer camp was a great way for my mom to spend time outdoors, meet other kids her age, and become more independent. I loved hearing about Camp Timberlane and the friends my mom made while she was there. Diana: En Canadá, como en los Estados Unidos, hay dos tipos de campamentos donde los niños pueden disfrutar de sus vacaciones escolares de verano. Hay un tipo de campamento de día, en el que los niños hacen actividades al aire libre y luego vuelven a casa a dormir. Pero en otros campamentos, como en Camp Timberlane, los niños se quedan a dormir. Allie: Some kids went to the camp for a week or two, but others spent a month or more away from their families. My mom loved going there when she was a kid. And she told me about all the activities she did, like water skiing and sailing. Diana: Muchas de las actividades que la mamá de Allie hizo en Camp Timberlane son comunes en otros campamentos. Pero de todos los recuerdos de su madre, hubo uno que a Allie le parecía especial: viajes de varios días de canotaje. Allie: She told me that she went on a canoe trip to a park called “Temagami.” She and her friends were the very first girls from Camp Timberlane to go on this trip. My mom loved to sing the camp’s song and one that she made up with her friends on their canoe trip. It made me excited about going to the camp. I always felt like it was a family tradition that I wanted to continue. Diana: Finalmente, en 1999, cuando Allie tenía 8 años, llegó el momento de continuar la tradición. Allie: When I went to the camp for the first time, I was away for a whole month. My parents helped me pack a bag with everything I needed: a swimsuit, a rain jacket, sunscreen, running shoes, and a few of my favorite books. I was excited and a little nervous. Diana: Después de un viaje de tres horas desde su casa en Toronto, Allie finalmente vio el mágico lugar del que su madre le había hablado tanto: Camp Timberlane. Allie: It’s a really beautiful camp, right next to a lake. There’s a big beach where you can swim or go sailing or canoeing. There’s also a big dining room where you eat all of your meals. And then there are the cabins where everyone sleeps. Diana: Las cabañas eran exactamente iguales a las que salen en las películas sobre campamentos de verano. Allie: In the cabins, there were old wooden beds. And there were a lot of names on the walls — which were written by the kids who stayed there over the years. Diana: A Allie y sus compañeros de cabaña les dieron un horario con opciones de actividades de una hora, como natación, senderismo o trampolín acuático, ¡que era la actividad favorita de Allie! Es como un trampolín normal, pero flota sobre el agua. Allie: My friends and I got on the water trampolines and then jumped into the water. It was so much fun! Diana: También tenían tiempo libre que podían pasar en sus cabañas, escribiendo cartas a casa o simplemente charlando. Todos se juntaban para la cena y el programa de noche, o evening program. Allie: The evening program was always really fun. We usually had competitions or played games. I loved playing a game called “Make Me Laugh.” There were two teams, and a counselor from each team went on the stage. We had to try to make the other team’s counselor laugh. And if we could make them laugh, we were allowed to do things like put juice or ketchup on them. Diana: Los supervisores favoritos de Allie estaban de acuerdo en una cosa sobre las actividades: los viajes de canotaje eran de lo más divertido. Los supervisores llevaban grupos pequeños de campistas fuera del campamento principal, a un parque provincial cercano. En su tercer año yendo de campamento, Allie estaba lista para remar, o paddle. Allie: I decided to sign up for my first canoe trip when I was ten. The trip took four days and three nights. We already learned how to paddle a canoe at the camp, but on the trip, we got to practice a lot more, and we learned to work as a team. In each canoe, there was a counselor at the back, and then two kids from camp, one in the middle and one in the front. The counselor tried to help us paddle together, at the same time. Diana: Allie aprendió rápidamente que ir en canoa todo el día, durante cuatro días seguidos, era realmente difícil. Y las olas y el viento sobre el lago hacían más duro el desafío. Allie: My arms hurt after I paddled for hours. And sometimes, there were strong currents, and we had to paddle really hard! Diana: Cuando no estaban remando, Allie y sus amigas debían portear, o portage. Es cuando llegas a la orilla y caminas con tu mochila y otras pertenencias a otro lago. Mientras Allie y los otros campistas llevaban sus cosas, los supervisores cargaban las canoas. Allie: We canoed across several lakes, so we had to portage between them. Sometimes we had to hike several kilometers between each lake, and our backpacks felt really heavy after a while. Diana: Al principio, Allie tuvo dificultades para adaptarse al “estilo de vida” que es hacer viajes de canotaje. Le resultaba muy incómodo dormir en una tienda de campaña en el bosque, y a menudo bajo la lluvia. Toda la actividad diaria estaba empezando a afectarle los músculos. Allie: My body hurt a lot! Sometimes I wondered, “Why did my mom want me to go on this canoe trip? Why did she love it so much?” Diana: Pero Allie no tardó mucho en comenzar a darse cuenta de todas las partes maravillosas del viaje, especialmente el paisaje. Allie: I loved looking at the calm water of the lake in the morning and all of the forest around us. I could also hear the sounds of birds while I paddled. It was all so beautiful. Diana: Y cuando regresaron al campamento base de Camp Timberlane, Allie se dio cuenta de lo increíble que había sido la experiencia. Allie: After the trip, I thought, “That was incredible!” Even though there were times when it was really difficult and uncomfortable, I wanted to go on more trips. Because in the end, I had a lot of great memories, and I felt proud of myself for doing it. It made me realize that I’m strong. Diana: El verano en que tenía quince años, Allie y sus compañeras se apuntaron a un viaje en canoa más largo: diez días, en el parque Temagami. Estaba lista para comenzar una nueva aventura. Allie: Temagami Park is a lot more remote than the other places we went. And the paths there were kind of wild. It was going to be difficult, but it was an exciting challenge. Diana: Cuando Allie y sus amigas volvieron al campamento base, se comprometieron a seguir haciendo esos viajes juntas por muchos años más. Allie: The canoe trip was such a special experience for everyone, and we all became very close friends. When the trip was over, I just wanted to go again — to play in waterfalls, get stronger, and feel the sun on my skin. Diana: Allie y sus amigas siguieron haciendo viajes juntas en canoa; hasta que todas fueron a estudiar a la universidad. Allie: During the four years that we all went away to college, my friends and I had our own adventures and did other summer activities. But later, after we all moved back to Toronto in our twenties, we started going on canoe trips together again. We still go back to the parks we visited during our summers at Camp Timberlane. Diana: En 2021 celebraron el aniversario número quince de aquel primer viaje a Temagami, con un viaje a ese mismo parque. Allie: It was so special. We remembered our adventures there and thought about everything that changed in the past 15 years. I hope everyone who goes to Camp Timberlane in the future has that same special camp experience. I’m now 32 and I just had my first baby. I want my child to go to summer camp one day and experience the canoe trips that were so important to me and my mom. I have to continue the family tradition! Diana: Ahora vamos a ver uno de los deportes más importante en Canadá: el hockey sobre hielo. Es un juego que sería imposible sin dos cosas: el hielo y los árbitros, o referees. Vamos a escuchar la historia de uno de ellos; se llama Dan Sepe. Al oirle hablar, fíjate si notas otra característica del inglés canadiense: omitir el sonido de la “t” en palabras donde esa “t” viene después de la “n”, como en la palabra “importante”, important. Dan lo dice así: “ important”. Y ahora, escuchemos a Dan. Dan: When I was a kid, hockey was really important to my family. We didn’t watch basketball or football on TV — just hockey. There was no other option. Everyone in my neighborhood loved hockey too. We played on the ice in the winter, and in the summer we played on the road, or even on tennis courts. Diana: El hockey es tan popular en Canadá que puede ser difícil encontrar espacios de tiempo en las pistas para practicarlo. Así que Dan a menudo tenía que practicar muy temprano por la mañana los fines de semana. Aun así, era feliz cuando jugaba. Le encantaba la sensación de formar parte de un equipo. Dan: When we were kids, each neighborhood had their own hockey team, and each team had their own leather jackets. So, people knew which team you played for just by looking at your jacket. Diana: Desde niño, Dan soñaba con jugar hockey profesionalmente. Pero cuando tenía dieciséis años, se dio cuenta de que no era lo suficientemente bueno como para formar parte de los equipos de élite. Al mismo tiempo, su papá le dijo que necesitaba conseguir un trabajo. Así que decidió tomar un curso para aprender a ser árbitro. Dan: After I finished my training, I started to referee local games for five and six-year-old kids. I didn’t know what to expect, but I really enjoyed it. Each game was an hour long, and I did nine or ten games each week. Diana: Los partidos infantiles eran entretenidos, pero no eran algo demasiado serio. Durante los siguientes siete años, Dan se abrió camino, tomó más cursos y comenzó a arbitrar juegos más competitivos. Dan: When I started refereeing, I didn’t want to work in professional hockey. But I met a lot of people during those first seven years. They became some of my best friends in life, and they motivated me to go farther in my career. Diana: En septiembre de 2012, Dan tuvo la oportunidad de ponerse a prueba como árbitro de la “Liga de Hockey de Ontario”, o OHL, como se la conoce por sus siglas en inglés. Se trata de una liga muy competitiva. Muchos jugadores de esa liga pasan a jugar en la Liga Nacional de Hockey, en Canadá y los Estados Unidos. Para los árbitros, entrar en la Liga de Hockey de Ontario es una gran oportunidad. Dan: I wasn’t nervous the night before the tryout, and I slept well that night. But the next morning, I was anxious. The game started at 7:00 pm, so I started getting ready at 4:00 pm. While I was packing, I got really nervous. I always pack my bag the same way for good luck. I put my skates in first, at the bottom of the bag. Then I put in everything else. It’s a small thing, but it helps me feel calm. Diana: Los preliminares eran en un estadio, o arena, en una pequeña ciudad llamada Barrie. Dan era uno de los cuatro árbitros. Dan: When I first arrived, it was very surreal. It felt different than a game at a local arena. There were thousands of seats. Everything sounded different, too. In a kids’ game, the building is small"
