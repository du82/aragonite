full_description = "Episodio 87: All About Accents! The US Coast to Coast (Part 2) Por Duolingo el miércoles 14 de febrero del 2024 Las historias de dos personas que viven en diferentes partes de Estados Unidos y las características únicas de sus acentos. Escúchanos en Suscríbete y escúchanos gratis en Spotify o donde prefieras escuchar tus podcasts. Transcripción Diana: ¡Hola, bienvenidos de nuevo a “Relatos en inglés”! En esta nueva temporada, estamos celebrando la riqueza y diversidad del inglés. Estamos revisitando algunos de nuestros episodios favoritos… pero con un giro: en cada episodio nos centramos en acentos únicos del inglés de todo el mundo. En el episodio de hoy, retomamos nuestro viaje por Estados Unidos desde Mississippi, justo donde lo dejamos en el episodio anterior. Mississippi, el estado, toma su nombre de Mississippi, el río. Está en el corazón del sur estadounidense, y tiene una historia muy profunda por sus plantaciones de algodón y los africanos quienes fueron esclavizados hasta finales de los 1800s. Esta historia influyó enormemente en los Estados Unidos, y dio origen a un tipo de inglés único que se habla en muchas comunidades negras norteamericanas, conocido como “Vernáculo afroamericano”, o African-American Vernacular. Hoy aprenderemos más sobre esa variedad del inglés. Nuestro primer narrador, Charles Sledge, tiene tanto un acento sureño como inflexiones afroamericanas. Notarás que él omite la consonante final en algunas palabras. Así, pronuncia el verbo “vendí,” o I sold, como: “I sold” y la palabra “cocinar”, cooking, como: “cooking”. También pronuncia el “th” en algunas palabras como “d” por ejemplo, “todos los tamales”, all of the tamales: “all of the tamales”. ¡A ver si puedes captar estas diferencias mientras escuchas la historia de Charles! Diana: Un viernes por la noche en el 2012, el agente de policía Charles Sledge estacionó su coche en un concurrido cruce en la ciudad de Clarksdale, Mississippi. Eran las 10:00 de la noche y Charles esperaba que la gente comenzara a salir pronto de los bares y clubes. Charles: I knew this intersection was usually busy at the end of the night. That’s when a lot of people left the clubs in the area. It was just a few miles away from my home, so I knew the area well. Diana: Pero Charles no estaba allí como agente de policía para controlar el tráfico. No buscaba poner multas o sorprender a conductores embriagados. Estaba allí para encontrar… gente que tuviera hambre. Clientes que al salir de los bares quisieran comer una comida muy rica del sur de los Estados Unidos: tamales del Delta. Charles: I was really nervous about selling my tamales to strangers, but I sold all 500 on the first night. I sold the tamales for less than one dollar each. After that first night, I wasn’t nervous anymore. That’s when my image changed. I wasn’t just a police officer. I was the “King of Tamales.” Diana: Welcome, les damos la bienvenida a “Relatos en inglés”, un podcast de Duolingo. Soy Diana Gameros. En cada episodio podrás practicar inglés a tu propio ritmo, escuchando historias reales y fascinantes contadas por las personas que las vivieron. Los protagonistas hablan en un inglés sencillo y fácil de entender para quienes están aprendiendo el idioma. En cada capítulo, yo te acompañaré, para asegurarme de que entiendas todo. También ofrecemos transcripciones completas en podcast.duolingo.com. Diana: Charles ha vivido en Clarksdale durante la mayor parte de sus 43 años de vida. Cuando era niño, en la década de los ochenta, su abuelo le traía tamales picantes… o como los llama Charles: tamales del Delta, por el Delta del Mississippi, donde se encuentra Clarksdale. Charles: When I was a kid, my grandfather often went to clubs and casinos at night. And he usually brought Delta-style tamales home. I really loved them. The Delta tamale is special and different from tamales anywhere else. Diana: Como mucha gente en Mississippi, incluidos los antepasados de Charles, los tamales Delta tienen sus raíces en México. Pero son muy diferentes de los tamales tradicionales mexicanos. Mientras que los tamales mexicanos se cuecen al vapor, los tamales Delta se hierven a fuego lento en un caldo, o broth. Charles: They’re both made of corn and meat. But Delta tamales are different from Mexican tamales because they are cooked slowly in a broth. I make mine with beef, chicken, and turkey. My favorite combination is chicken, cheddar cheese, and jalapeño. They are spicy… You also have to be careful, or you will spill juice from the tamale all over yourself! Diana: Los tamales siempre fueron comida que calmaba a Charles… tanto comerlos, como prepararlos, lo ayudaban a relajarse. Y esto era importante porque su trabajo como agente de policía era realmente estresante. Charles: There is a lot of crime around here. It was stressful to see violent crimes every day, and I just didn’t like the way it made me feel. Diana: Pero ese era su trabajo. Así que para desconectarse, en su tiempo libre, preparaba tamales. En el 2009, se compró un aparato con el cual podía hacer grandes cantidades de tamales a la vez, docenas o dozens. Charles: By hand, I could make four dozen tamales in fifteen minutes. But with the machine, I could do that in two minutes. I always liked to be busy when I wasn’t at work. Cooking has always been one of my favorite forms of stress relief. Diana: Después de comprar la máquina de tamales, Charles comenzó a experimentar con las recetas. Quería hacer los tamales perfectos. Pero sabía que para eso necesitaba ayuda. Charles: I often brought tamales to my grandmother. She was Mexican, and her tamales were amazing. She tasted them and told me what to change. For example, she told me how much salt or spice to add. I listened to her exact recommendations. I make tamales with very specific ingredients — and that’s why they taste so good. Diana: Al principio, Charles hacía principalmente sus tamales para reuniones familiares y para sus compañeros en la comisaría de policía. Como en México, en el sur de los Estados Unidos es costumbre dar de comer a quienes te rodean. Charles: Mississippi is known for hospitality — people are friendly and generous. So, I gave tamales to anyone who wanted to try them. And everyone always told me that they were delicious. They were so popular that I decided to start selling them. Diana: Así fue como terminó en una concurrida intersección en Clarksdale a altas horas de la noche un día del 2012. Tuvo tanto éxito que siguió regresando. Se convirtió en la mejor parte de su semana. Pero, apenas un año después, consiguió un ascenso a detective de policía. Charles: After I became a detective, I didn’t have time to sell tamales at night anymore because I was too busy with my job. But it was really fun to sell tamales, and I wanted to find another way to do it. So I started to sell them from my house. Diana: Charles comenzó a vender tamales en la cocina de su casa en Clarksdale. No ha dejado de cocinar ningún fin de semana desde el 2012. Charles: Every Friday night, I start cooking. My wife Belinda and I usually cook until the next day. We finish around 5:00 in the morning. The tamales cook slowly for about 8 hours. We only have time to make about 700 tamales, and then the customers start arriving to buy them. My beef tamale recipe is the most popular. It only takes about one hour to sell all of the tamales. Diana: Cuando Charles comenzó a vender sus tamales Delta en su casa… tuvo un éxito enorme. Ahora vienen a comprarlos de toda la zona. Charles: One time, the police came because there were so many cars in the street. There are lines of people outside on the road. They drive hundreds of miles to buy my tamales. Diana: A medida que el negocio de tamales de Charles comenzó a hacerse más y más popular, él empezó a preguntarse si podría dejar su trabajo de policía, que era muy estresante. Charles: I thought, “What if I make tamales full-time?” For about a year, I thought a lot about retiring. I knew it was time to leave my job and become a full-time cook. So in February of last year, I bought a food truck. I wanted to sell tamales not only in Clarksdale, but all over Mississippi. Diana: Y diez meses después de comprar el camión de comida, Charles se retiró de la policía para hacer tamales a tiempo completo. Charles: I’m finally happy, and I’m not stressed anymore. Now I only cook food that I love, and I’ll finish working on my food truck soon. I wish I had retired from my police job and bought a food truck years ago. I feel great! Diana: Pero no todo el mundo quiere que Charles lleve sus tamales de viaje. La hija de Charles de nueve años, Hannah Grace, ama los tamales tanto como a él. Charles: My daughter loves the tamales. She thinks all the flavors are delicious, so she gets mad when people come to buy them. She tries to convince everyone that they taste bad. She wants them all for herself. Diana: ¡Gracias, Charles! Esos tamales seguro estaban deliciosos. Me encantaría probar uno y ver cómo se comparan con los tamales de mi ciudad, Juárez. ¿Notaron en la última frase de la historia de Charles cómo pronunció una “a” larga y arrastrada en algunas palabras? Volvamos a oirlo: “she wants them all for herself”. En nuestra próxima historia, dejamos el sur y nos vamos al norte, a una parte muy diferente de los Estados Unidos: ¡la Gran Manzana o Nueva York! La ciudad está formada por cientos de barrios, y vamos a visitar uno llamado Washington Heights, en el norte de la isla de Manhattan. En ciudades como Nueva York, los enclaves de inmigrantes pueden tener una gran influencia en los acentos, incluso para inmigrantes de segunda o tercera generación que son hablantes nativos de inglés. Washington Heights es hogar de muchas familias puertorriqueñas, cubanas y, especialmente, dominicanas. Es donde creció nuestro narrador Led Black. Sus padres eran inmigrantes dominicanos y él está muy orgulloso de su herencia. Al escuchar su historia, notarán que Led a veces convierte el sonido de I casi en una “ah”. Por ejemplo cuando dice “mi casa”, my house, lo pronuncia así: “my house”. Led: I love the history of my neighborhood. When I was growing up in the 1980s, it was considered a dangerous area. But for the people who lived there, it was a vibrant community of immigrants. A lot of people grew up in small apartments where several generations of families lived. Diana: Washington Heights tiene una arquitectura histórica, escaleras de concreto, o stoops, frente a los apartamentos, coloridos murales y grafitis, tienditas de abarrotes en las esquinas, carritos de helados y, siempre, mucho bullicio. Led: Washington Heights is full of energy and life. When you walk down the street, you’ll see groups of people playing dominoes, or laughing and hanging out on stoops. Washington Heights is like one big family. Diana: Led creció en un hogar igual de animado. Todos en la casa tenían su propia música. Su mamá escuchaba boleros, a su papá le gustaban los sonidos latinos más modernos y su hermano escuchaba salsa. A Led, lo que le gustaba era el hip hop. Pero su abuela también vivía con ellos y el ruido del dominó era música para sus oídos. Led: When I was growing up, a lot of kids in the U.S. got Xboxes for Christmas, but kids from Dominican families got a box of dominoes. It doesn’t matter how old you are, or if you are a man or a woman — everyone plays dominoes. I remember playing with my mom, my aunts, or anyone who came to my house. Diana: La vida en Washington Heights podía ser difícil en aquel entonces: por las drogas y la violencia en las calles. Pero para Led, la mejor parte de su barrio era la gente. Los domingos, cuando era joven, se encontraba una casa bulliciosa llena de familiares y vecinos. Led: My mom cared a lot about her community and she took care of our neighborhood. On my street, she was known as “the numbers lady” because she was in charge of the Dominican lottery every Sunday. So, everyone always came to her to pick their lottery numbers. Diana: En la lotería dominicana, los que juegan eligen números en base a sus sueños de la noche anterior. Los vecinos de la mamá de Led le contaban sus sueños y ella anotaba sus números, cocinaba comida casera y los invitaba a quedarse un rato. Led: While our neighbors were playing the lottery, they ate big bowls of my mom’s hot mondongo, which is a popular Dominican soup. So, my mom helped create a special place where people could hang out and enjoy food from their home country. Diana: De niño, Led tenía muchos amigos en el vecindario. Pero cuando entró en la Bronx High School of Science, una prestigiosa escuela preparatoria pública en las afueras de Washington Heights, comenzó a sentir que no encajaba con sus compañeros de clase. Sintió un choque cultural, o culture shock. Led: My family really wanted me to go to the Bronx High School of Science because it was such a good school. I wasn’t really happy about it because it was far from home, and I didn’t feel like I was the same as the other students. I had to take three trains to get there, and it took an hour. And then once I got there, I felt a real culture shock. People there had a lot of money, and although I grew up with food on the table, I was poor compared to them. I didn’t realize I was different until I went to that school. Diana: Aun así, Led consiguió mantenerse conectado con sus amigos del vecindario. Pero fue un primer año difícil en la escuela preparatoria y el viaje que tenía que hacer cada día era agotador. Pero un día, ese trayecto en tren cambió su vida. Led: There was a group of girls who took the same train as me every day. We never talked, but I remember some of them looking at me. And then one day, one of those girls came up to me and said, “Hey, my friend likes you.” And that’s how I met my future wife, Eileen, when we were 15 years old. Diana: A finales de los noventa, Led y Eileen vivieron en otro barrio que se llama “el Bronx”. Pero decidieron que no era para ellos, porque no les daba la misma sensación de hogar que Washington Heights. Led: We moved back to Washington Heights. I knew that I always wanted to be back in the neighborhood where I grew up. Diana: En el transcurso de diecinueve años de matrimonio, Led y Eileen tuvieron tres hijas. Led probó con el mundo de los blogs, publicando sus textos en internet. En 2008, Led tenía 34 años y era feliz. Pero llegaron las malas noticias… Led: I was at work and I got a phone call from my wife. She was at the doctor’s office, and they told her that she had a very aggressive form of cancer. It was a very scary and difficult time for us. But my wife has always been very brave. Diana: Al día siguiente del diagnóstico, la madre de Led dejó su vida de semi-jubilación en la República Dominicana para mudarse a la ciudad de Nueva York. La mamá de su esposa hizo lo mismo. Ayudaron en todo, desde cocinar y limpiar hasta cuidar a las niñas, que tenían dos, cuatro y nueve años. Pero siempre se esforzaron por mantener a Led animado. Y la forma segura de "
